# The Tanakh as searchable DOCUMENTS, beside the graph (realm spec: sources.yml, `lane: documents`).
#
# The graph answers "which verses mention a goat"; documents answer "which chapters are ABOUT
# atonement" — chunked, embedded, and reachable by RELEVANT_TO. One document per CHAPTER, in the JPS
# English, because readers ask in English; the Hebrew is a walk away from any hit. A document's uri is
# its chapter's `documentUri`, which is how a hit finds its way back to the verses.
#
# Tagged `scripture` as well as `tanakh`: the vocabulary's meaning-search views retrieve every
# scripture's chapters by that one tag, so the Tanakh is searched beside the Bible, the Quran and the
# Book of Mormon in one ranking.
sources:
  - name: tanakh-jps
    lane: documents
    from:
      cypher: |
        MATCH (c:TanakhChapter)<-[:IN]-(v:TanakhVerse)
        WITH c, v ORDER BY v.verse
        WITH c, collect({n: v.verse, text: v.text}) AS verses
        RETURN c.documentUri AS uri, c.name AS title, verses
    document:
      uri: "{{ uri }}"
      title: "{{ title }} (JPS 1917)"
      content: |
        # {{ title }}

        {% for v in verses %}{{ v.n }} {{ v.text }}
        {% endfor %}
      sourceKind: tanakh
      tags: [scripture, tanakh, jps]
    sync:
      trigger: on-install
      prune: true
