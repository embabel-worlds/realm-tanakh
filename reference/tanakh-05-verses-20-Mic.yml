- type: TanakhVerse
  data:
    osis: Mic.1.3
    scripture: tanakh
    name: Tanakh Micah 1:3
    ref: Micah 1:3
    book: Mic
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14580
    text: For, behold, the LORD cometh forth out of His place, And will come down, and tread upon the high places of the earth.
    translation: JPS 1917
    original: כִּי־הִנֵּה יְהוָה יֹצֵא מִמְּקוֹמוֹ וְיָרַד וְדָרַךְ עַל־במותי [בָּמֳתֵי] אָרֶץ׃
    hebrewPlain: כי הנה יהוה יצא ממקומו וירד ודרך על במותי [במתי] ארץ
    kjvRefs:
    - Micah 1:3
    kjvOsis:
    - Mic.1.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.4
    scripture: tanakh
    name: Tanakh Micah 1:4
    ref: Micah 1:4
    book: Mic
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14581
    text: And the mountains shall be molten under Him, And the valleys shall be cleft, As wax before the fire, As waters that are poured down a steep place.
    translation: JPS 1917
    original: וְנָמַסּוּ הֶהָרִים תַּחְתָּיו וְהָעֲמָקִים יִתְבַּקָּעוּ כַּדּוֹנַג מִפְּנֵי הָאֵשׁ כְּמַיִם מֻגָּרִים בְּמוֹרָד׃
    hebrewPlain: ונמסו ההרים תחתיו והעמקים יתבקעו כדונג מפני האש כמים מגרים במורד
    kjvRefs:
    - Micah 1:4
    kjvOsis:
    - Mic.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.5
    scripture: tanakh
    name: Tanakh Micah 1:5
    ref: Micah 1:5
    book: Mic
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14582
    text: For the transgression of Jacob is all this, And for the sins of the house of Israel. What is the transgression of Jacob? Is it not Samaria? And what are the high places of Judah? are they not Jerusalem?
    translation: JPS 1917
    original: בְּפֶשַׁע יַעֲקֹב כָּל־זֹאת וּבְחַטֹּאות בֵּית יִשְׂרָאֵל מִי־פֶשַׁע יַעֲקֹב הֲלוֹא שֹׁמְרוֹן וּמִי בָּמוֹת יְהוּדָה הֲלוֹא יְרוּשָׁלִָם׃
    hebrewPlain: בפשע יעקב כל זאת ובחטאות בית ישראל מי פשע יעקב הלוא שמרון ומי במות יהודה הלוא ירושלם
    kjvRefs:
    - Micah 1:5
    kjvOsis:
    - Mic.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.6
    scripture: tanakh
    name: Tanakh Micah 1:6
    ref: Micah 1:6
    book: Mic
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14583
    text: Therefore I will make Samaria a heap in the field, A place for the planting of vineyards; And I will pour down the stones thereof into the valley, And I will uncover the foundations thereof.
    translation: JPS 1917
    original: וְשַׂמְתִּי שֹׁמְרוֹן לְעִי הַשָּׂדֶה לְמַטָּעֵי כָרֶם וְהִגַּרְתִּי לַגַּי אֲבָנֶיהָ וִיסֹדֶיהָ אֲגַלֶּה׃
    hebrewPlain: ושמתי שמרון לעי השדה למטעי כרם והגרתי לגי אבניה ויסדיה אגלה
    kjvRefs:
    - Micah 1:6
    kjvOsis:
    - Mic.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.7
    scripture: tanakh
    name: Tanakh Micah 1:7
    ref: Micah 1:7
    book: Mic
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14584
    text: And all her graven images shall be beaten to pieces, And all her hires shall be burned with fire, And all her idols will I lay desolate; For of the hire of a harlot hath she gathered them, And unto the hire of a harlot shall they return.
    translation: JPS 1917
    original: וְכָל־פְּסִילֶיהָ יֻכַּתּוּ וְכָל־אֶתְנַנֶּיהָ יִשָּׂרְפוּ בָאֵשׁ וְכָל־עֲצַבֶּיהָ אָשִׂים שְׁמָמָה כִּי מֵאֶתְנַן זוֹנָה קִבָּצָה וְעַד־אֶתְנַן זוֹנָה יָשׁוּבוּ׃
    hebrewPlain: וכל פסיליה יכתו וכל אתנניה ישרפו באש וכל עצביה אשים שממה כי מאתנן זונה קבצה ועד אתנן זונה ישובו
    kjvRefs:
    - Micah 1:7
    kjvOsis:
    - Mic.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.8
    scripture: tanakh
    name: Tanakh Micah 1:8
    ref: Micah 1:8
    book: Mic
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14585
    text: For this will I wail and howl, I will go stripped and naked; I will make a wailing like the jackals, And a mourning like the ostriches.
    translation: JPS 1917
    original: עַל־זֹאת אֶסְפְּדָה וְאֵילִילָה אֵילְכָה שילל [שׁוֹלָל] וְעָרוֹם אֶעֱשֶׂה מִסְפֵּד כַּתַּנִּים וְאֵבֶל כִּבְנוֹת יַעֲנָה׃
    hebrewPlain: על זאת אספדה ואילילה אילכה שילל [שולל] וערום אעשה מספד כתנים ואבל כבנות יענה
    kjvRefs:
    - Micah 1:8
    kjvOsis:
    - Mic.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.9
    scripture: tanakh
    name: Tanakh Micah 1:9
    ref: Micah 1:9
    book: Mic
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14586
    text: For her wound is incurable; For it is come even unto Judah; It reacheth unto the gate of my people, even to Jerusalem.
    translation: JPS 1917
    original: כִּי אֲנוּשָׁה מַכּוֹתֶיהָ כִּי־בָאָה עַד־יְהוּדָה נָגַע עַד־שַׁעַר עַמִּי עַד־יְרוּשָׁלִָם׃
    hebrewPlain: כי אנושה מכותיה כי באה עד יהודה נגע עד שער עמי עד ירושלם
    kjvRefs:
    - Micah 1:9
    kjvOsis:
    - Mic.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.10
    scripture: tanakh
    name: Tanakh Micah 1:10
    ref: Micah 1:10
    book: Mic
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 14587
    text: Tell it not in Gath, Weep not at all; At Beth-le-aphrah roll thyself in the dust.
    translation: JPS 1917
    original: בְּגַת אַל־תַּגִּידוּ בָּכוֹ אַל־תִּבְכּוּ בְּבֵית לְעַפְרָה עָפָר התפלשתי [הִתְפַּלָּשִׁי׃]
    hebrewPlain: בגת אל תגידו בכו אל תבכו בבית לעפרה עפר התפלשתי [התפלשי]
    kjvRefs:
    - Micah 1:10
    kjvOsis:
    - Mic.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.11
    scripture: tanakh
    name: Tanakh Micah 1:11
    ref: Micah 1:11
    book: Mic
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14588
    text: Pass ye away, O inhabitant of Saphir, in nakedness and shame; The inhabitant of Zaanan is not come forth; The wailing of Beth-ezel shall take from you the standing-place thereof.
    translation: JPS 1917
    original: עִבְרִי לָכֶם יוֹשֶׁבֶת שָׁפִיר עֶרְיָה־בֹשֶׁת לֹא יָצְאָה יוֹשֶׁבֶת צַאֲנָן מִסְפַּד בֵּית הָאֵצֶל יִקַּח מִכֶּם עֶמְדָּתוֹ׃
    hebrewPlain: עברי לכם יושבת שפיר עריה בשת לא יצאה יושבת צאנן מספד בית האצל יקח מכם עמדתו
    kjvRefs:
    - Micah 1:11
    kjvOsis:
    - Mic.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.12
    scripture: tanakh
    name: Tanakh Micah 1:12
    ref: Micah 1:12
    book: Mic
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14589
    text: For the inhabitant of Maroth waiteth anxiously for good; Because evil is come down from the LORD unto the gate of Jerusalem.
    translation: JPS 1917
    original: כִּי־חָלָה לְטוֹב יוֹשֶׁבֶת מָרוֹת כִּי־יָרַד רָע מֵאֵת יְהוָה לְשַׁעַר יְרוּשָׁלִָם׃
    hebrewPlain: כי חלה לטוב יושבת מרות כי ירד רע מאת יהוה לשער ירושלם
    kjvRefs:
    - Micah 1:12
    kjvOsis:
    - Mic.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.13
    scripture: tanakh
    name: Tanakh Micah 1:13
    ref: Micah 1:13
    book: Mic
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14590
    text: Bind the chariots to the swift steeds, O inhabitant of Lachish; She was the beginning of sin to the daughter of Zion; For the transgressions of Israel are found in thee.
    translation: JPS 1917
    original: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ יוֹשֶׁבֶת לָכִישׁ רֵאשִׁית חַטָּאת הִיא לְבַת־צִיּוֹן כִּי־בָךְ נִמְצְאוּ פִּשְׁעֵי יִשְׂרָאֵל׃
    hebrewPlain: רתם המרכבה לרכש יושבת לכיש ראשית חטאת היא לבת ציון כי בך נמצאו פשעי ישראל
    kjvRefs:
    - Micah 1:13
    kjvOsis:
    - Mic.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.14
    scripture: tanakh
    name: Tanakh Micah 1:14
    ref: Micah 1:14
    book: Mic
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14591
    text: Therefore shalt thou give a parting gift to Moresheth-gath; The houses of Achzib shall be a deceitful thing unto the kings of Israel.
    translation: JPS 1917
    original: לָכֵן תִּתְּנִי שִׁלּוּחִים עַל מוֹרֶשֶׁת גַּת בָּתֵּי אַכְזִיב לְאַכְזָב לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: לכן תתני שלוחים על מורשת גת בתי אכזיב לאכזב למלכי ישראל
    kjvRefs:
    - Micah 1:14
    kjvOsis:
    - Mic.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.15
    scripture: tanakh
    name: Tanakh Micah 1:15
    ref: Micah 1:15
    book: Mic
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14592
    text: I will yet bring unto thee, O inhabitant of Mareshah, him that shall possess thee; The glory of Israel shall come even unto Adullam.
    translation: JPS 1917
    original: עֹד הַיֹּרֵשׁ אָבִי לָךְ יוֹשֶׁבֶת מָרֵשָׁה עַד־עֲדֻּלָּם יָבוֹא כְּבוֹד יִשְׂרָאֵל׃
    hebrewPlain: עד הירש אבי לך יושבת מרשה עד עדלם יבוא כבוד ישראל
    kjvRefs:
    - Micah 1:15
    kjvOsis:
    - Mic.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.1.16
    scripture: tanakh
    name: Tanakh Micah 1:16
    ref: Micah 1:16
    book: Mic
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 14593
    text: Make thee bald, and poll thee for the children of thy delight; Enlarge thy baldness as the vulture; For they are gone into captivity from thee.
    translation: JPS 1917
    original: קָרְחִי וָגֹזִּי עַל־בְּנֵי תַּעֲנוּגָיִךְ הַרְחִבִי קָרְחָתֵךְ כַּנֶּשֶׁר כִּי גָלוּ מִמֵּךְ׃
    hebrewPlain: קרחי וגזי על בני תענוגיך הרחבי קרחתך כנשר כי גלו ממך
    kjvRefs:
    - Micah 1:16
    kjvOsis:
    - Mic.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.1
- type: TanakhVerse
  data:
    osis: Mic.2.1
    scripture: tanakh
    name: Tanakh Micah 2:1
    ref: Micah 2:1
    book: Mic
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14594
    text: Woe to them that devise iniquity And work evil upon their beds! When the morning is light, they execute it, Because it is in the power of their hand.
    translation: JPS 1917
    original: הוֹי חֹשְׁבֵי־אָוֶן וּפֹעֲלֵי רָע עַל־מִשְׁכְּבוֹתָם בְּאוֹר הַבֹּקֶר יַעֲשׂוּהָ כִּי יֶשׁ־לְאֵל יָדָם׃
    hebrewPlain: הוי חשבי און ופעלי רע על משכבותם באור הבקר יעשוה כי יש לאל ידם
    kjvRefs:
    - Micah 2:1
    kjvOsis:
    - Mic.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.2
    scripture: tanakh
    name: Tanakh Micah 2:2
    ref: Micah 2:2
    book: Mic
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14595
    text: And they covet fields, and seize them; And houses, and take them away; Thus they oppress a man and his house, Even a man and his heritage.
    translation: JPS 1917
    original: וְחָמְדוּ שָׂדוֹת וְגָזָלוּ וּבָתִּים וְנָשָׂאוּ וְעָשְׁקוּ גֶּבֶר וּבֵיתוֹ וְאִישׁ וְנַחֲלָתוֹ׃
    hebrewPlain: וחמדו שדות וגזלו ובתים ונשאו ועשקו גבר וביתו ואיש ונחלתו
    kjvRefs:
    - Micah 2:2
    kjvOsis:
    - Mic.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.3
    scripture: tanakh
    name: Tanakh Micah 2:3
    ref: Micah 2:3
    book: Mic
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14596
    text: 'Therefore thus saith the LORD: Behold, against this family do I devise an evil, From which ye shall not remove your necks, Neither shall ye walk upright; for it shall be an evil time.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר יְהוָה הִנְנִי חֹשֵׁב עַל־הַמִּשְׁפָּחָה הַזֹּאת רָעָה אֲשֶׁר לֹא־תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם וְלֹא תֵלְכוּ רוֹמָה כִּי עֵת רָעָה הִיא׃
    hebrewPlain: לכן כה אמר יהוה הנני חשב על המשפחה הזאת רעה אשר לא תמישו משם צוארתיכם ולא תלכו רומה כי עת רעה היא
    kjvRefs:
    - Micah 2:3
    kjvOsis:
    - Mic.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.4
    scripture: tanakh
    name: Tanakh Micah 2:4
    ref: Micah 2:4
    book: Mic
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14597
    text: 'In that day shall they take up a parable against you, And lament with a doleful lamentation, and say: ‘We are utterly ruined; He changeth the portion of my people; How doth he remove it from me! Instead of restoring our fields, he divideth them.’'
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא יִשָּׂא עֲלֵיכֶם מָשָׁל וְנָהָה נְהִי נִהְיָה אָמַר שָׁדוֹד נְשַׁדֻּנוּ חֵלֶק עַמִּי יָמִיר אֵיךְ יָמִישׁ לִי לְשׁוֹבֵב שָׂדֵינוּ יְחַלֵּק׃
    hebrewPlain: ביום ההוא ישא עליכם משל ונהה נהי נהיה אמר שדוד נשדנו חלק עמי ימיר איך ימיש לי לשובב שדינו יחלק
    kjvRefs:
    - Micah 2:4
    kjvOsis:
    - Mic.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.5
    scripture: tanakh
    name: Tanakh Micah 2:5
    ref: Micah 2:5
    book: Mic
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14598
    text: Therefore thou shalt have none that shall cast the line by lot In the congregation of the LORD.
    translation: JPS 1917
    original: לָכֵן לֹא־יִהְיֶה לְךָ מַשְׁלִיךְ חֶבֶל בְּגוֹרָל בִּקְהַל יְהוָה׃
    hebrewPlain: לכן לא יהיה לך משליך חבל בגורל בקהל יהוה
    kjvRefs:
    - Micah 2:5
    kjvOsis:
    - Mic.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.6
    scripture: tanakh
    name: Tanakh Micah 2:6
    ref: Micah 2:6
    book: Mic
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14599
    text: ’Preach ye not’, they preach; ‘They shall not preach of these things, That they shall not take shame.’
    translation: JPS 1917
    original: אַל־תַּטִּפוּ יַטִּיפוּן לֹא־יַטִּפוּ לָאֵלֶּה לֹא יִסַּג כְּלִמּוֹת׃
    hebrewPlain: אל תטפו יטיפון לא יטפו לאלה לא יסג כלמות
    kjvRefs:
    - Micah 2:6
    kjvOsis:
    - Mic.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.7
    scripture: tanakh
    name: Tanakh Micah 2:7
    ref: Micah 2:7
    book: Mic
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14600
    text: Do I change, O house of Jacob? Is the spirit of the LORD straitened? Are these His doings? Do not My words do good to him that walketh uprightly?
    translation: JPS 1917
    original: הֶאָמוּר בֵּית־יַעֲקֹב הֲקָצַר רוּחַ יְהוָה אִם־אֵלֶּה מַעֲלָלָיו הֲלוֹא דְבָרַי יֵיטִיבוּ עִם הַיָּשָׁר הוֹלֵךְ׃
    hebrewPlain: האמור בית יעקב הקצר רוח יהוה אם אלה מעלליו הלוא דברי ייטיבו עם הישר הולך
    kjvRefs:
    - Micah 2:7
    kjvOsis:
    - Mic.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.8
    scripture: tanakh
    name: Tanakh Micah 2:8
    ref: Micah 2:8
    book: Mic
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14601
    text: But of late My people is risen up as an enemy; With the garment ye strip also the mantle From them that pass by securely, so that they are as men returning from war.
    translation: JPS 1917
    original: וְאֶתְמוּל עַמִּי לְאוֹיֵב יְקוֹמֵם מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן מֵעֹבְרִים בֶּטַח שׁוּבֵי מִלְחָמָה׃
    hebrewPlain: ואתמול עמי לאויב יקומם ממול שלמה אדר תפשטון מעברים בטח שובי מלחמה
    kjvRefs:
    - Micah 2:8
    kjvOsis:
    - Mic.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.9
    scripture: tanakh
    name: Tanakh Micah 2:9
    ref: Micah 2:9
    book: Mic
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14602
    text: The women of My people ye cast out from their pleasant houses; From their young children ye take away My glory for ever.
    translation: JPS 1917
    original: נְשֵׁי עַמִּי תְּגָרְשׁוּן מִבֵּית תַּעֲנֻגֶיהָ מֵעַל עֹלָלֶיהָ תִּקְחוּ הֲדָרִי לְעוֹלָם׃
    hebrewPlain: נשי עמי תגרשון מבית תענגיה מעל עלליה תקחו הדרי לעולם
    kjvRefs:
    - Micah 2:9
    kjvOsis:
    - Mic.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.10
    scripture: tanakh
    name: Tanakh Micah 2:10
    ref: Micah 2:10
    book: Mic
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14603
    text: Arise ye, and depart; for this is not your resting-place; Because of the uncleanness thereof, it shall destroy you, even with a sore destruction.
    translation: JPS 1917
    original: קוּמוּ וּלְכוּ כִּי לֹא־זֹאת הַמְּנוּחָה בַּעֲבוּר טָמְאָה תְּחַבֵּל וְחֶבֶל נִמְרָץ׃
    hebrewPlain: קומו ולכו כי לא זאת המנוחה בעבור טמאה תחבל וחבל נמרץ
    kjvRefs:
    - Micah 2:10
    kjvOsis:
    - Mic.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.11
    scripture: tanakh
    name: Tanakh Micah 2:11
    ref: Micah 2:11
    book: Mic
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14604
    text: 'If a man walking in wind and falsehood do lie: ‘I will preach unto thee of wine and of strong drink’; He shall even be the preacher of this people.'
    translation: JPS 1917
    original: לוּ־אִישׁ הֹלֵךְ רוּחַ וָשֶׁקֶר כִּזֵּב אַטִּף לְךָ לַיַּיִן וְלַשֵּׁכָר וְהָיָה מַטִּיף הָעָם הַזֶּה׃
    hebrewPlain: לו איש הלך רוח ושקר כזב אטף לך ליין ולשכר והיה מטיף העם הזה
    kjvRefs:
    - Micah 2:11
    kjvOsis:
    - Mic.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.12
    scripture: tanakh
    name: Tanakh Micah 2:12
    ref: Micah 2:12
    book: Mic
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14605
    text: I will surely assemble, O Jacob, all of thee; I will surely gather the remnant of Israel; I will render them all as sheep in a fold; As a flock in the midst of their pasture; They shall make great noise by reason of the multitude of men.
    translation: JPS 1917
    original: אָסֹף אֶאֱסֹף יַעֲקֹב כֻּלָּךְ קַבֵּץ אֲקַבֵּץ שְׁאֵרִית יִשְׂרָאֵל יַחַד אֲשִׂימֶנּוּ כְּצֹאן בָּצְרָה כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ תְּהִימֶנָה מֵאָדָם׃
    hebrewPlain: אסף אאסף יעקב כלך קבץ אקבץ שארית ישראל יחד אשימנו כצאן בצרה כעדר בתוך הדברו תהימנה מאדם
    kjvRefs:
    - Micah 2:12
    kjvOsis:
    - Mic.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.2.13
    scripture: tanakh
    name: Tanakh Micah 2:13
    ref: Micah 2:13
    book: Mic
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14606
    text: The breaker is gone up before them; They have broken forth and passed on, By the gate, and are gone out thereat; And their king is passed on before them, And the LORD at the head of them.
    translation: JPS 1917
    original: עָלָה הַפֹּרֵץ לִפְנֵיהֶם פָּרְצוּ וַיַּעֲבֹרוּ שַׁעַר וַיֵּצְאוּ בוֹ וַיַּעֲבֹר מַלְכָּם לִפְנֵיהֶם וַיהוָה בְּרֹאשָׁם׃
    hebrewPlain: עלה הפרץ לפניהם פרצו ויעברו שער ויצאו בו ויעבר מלכם לפניהם ויהוה בראשם
    kjvRefs:
    - Micah 2:13
    kjvOsis:
    - Mic.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.2
- type: TanakhVerse
  data:
    osis: Mic.3.1
    scripture: tanakh
    name: Tanakh Micah 3:1
    ref: Micah 3:1
    book: Mic
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14607
    text: 'And I said: Hear, I pray you, ye heads of Jacob, and rulers of the house of Israel: Is it not for you to know justice?'
    translation: JPS 1917
    original: וָאֹמַר שִׁמְעוּ־נָא רָאשֵׁי יַעֲקֹב וּקְצִינֵי בֵּית יִשְׂרָאֵל הֲלוֹא לָכֶם לָדַעַת אֶת־הַמִּשְׁפָּט׃
    hebrewPlain: ואמר שמעו נא ראשי יעקב וקציני בית ישראל הלוא לכם לדעת את המשפט
    kjvRefs:
    - Micah 3:1
    kjvOsis:
    - Mic.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.2
    scripture: tanakh
    name: Tanakh Micah 3:2
    ref: Micah 3:2
    book: Mic
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14608
    text: Who hate the good, and love the evil; who rob their skin from off them, and their flesh from off their bones;
    translation: JPS 1917
    original: שֹׂנְאֵי טוֹב וְאֹהֲבֵי רעה [רָע] גֹּזְלֵי עוֹרָם מֵעֲלֵיהֶם וּשְׁאֵרָם מֵעַל עַצְמוֹתָם׃
    hebrewPlain: שנאי טוב ואהבי רעה [רע] גזלי עורם מעליהם ושארם מעל עצמותם
    kjvRefs:
    - Micah 3:2
    kjvOsis:
    - Mic.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.3
    scripture: tanakh
    name: Tanakh Micah 3:3
    ref: Micah 3:3
    book: Mic
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14609
    text: Who also eat the flesh of my people, and flay their skin from off them, and break their bones; yea, they chop them in pieces, as that which is in the pot, and as flesh within the caldron.
    translation: JPS 1917
    original: וַאֲשֶׁר אָכְלוּ שְׁאֵר עַמִּי וְעוֹרָם מֵעֲלֵיהֶם הִפְשִׁיטוּ וְאֶת־עַצְמֹתֵיהֶם פִּצֵּחוּ וּפָרְשׂוּ כַּאֲשֶׁר בַּסִּיר וּכְבָשָׂר בְּתוֹךְ קַלָּחַת׃
    hebrewPlain: ואשר אכלו שאר עמי ועורם מעליהם הפשיטו ואת עצמתיהם פצחו ופרשו כאשר בסיר וכבשר בתוך קלחת
    kjvRefs:
    - Micah 3:3
    kjvOsis:
    - Mic.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.4
    scripture: tanakh
    name: Tanakh Micah 3:4
    ref: Micah 3:4
    book: Mic
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14610
    text: Then shall they cry unto the LORD, But He will not answer them; yea, He will hide His face from them at that time, According as they have wrought evil in their doings.
    translation: JPS 1917
    original: אָז יִזְעֲקוּ אֶל־יְהוָה וְלֹא יַעֲנֶה אוֹתָם וְיַסְתֵּר פָּנָיו מֵהֶם בָּעֵת הַהִיא כַּאֲשֶׁר הֵרֵעוּ מַעַלְלֵיהֶם׃
    hebrewPlain: אז יזעקו אל יהוה ולא יענה אותם ויסתר פניו מהם בעת ההיא כאשר הרעו מעלליהם
    kjvRefs:
    - Micah 3:4
    kjvOsis:
    - Mic.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.5
    scripture: tanakh
    name: Tanakh Micah 3:5
    ref: Micah 3:5
    book: Mic
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14611
    text: 'Thus saith the LORD concerning the prophets that make my people to err; that cry: ‘Peace’, when their teeth have any thing to bite; and whoso putteth not into their mouths, they even prepare war against him:'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־הַנְּבִיאִים הַמַּתְעִים אֶת־עַמִּי הַנֹּשְׁכִים בְּשִׁנֵּיהֶם וְקָרְאוּ שָׁלוֹם וַאֲשֶׁר לֹא־יִתֵּן עַל־פִּיהֶם וְקִדְּשׁוּ עָלָיו מִלְחָמָה׃
    hebrewPlain: כה אמר יהוה על הנביאים המתעים את עמי הנשכים בשניהם וקראו שלום ואשר לא יתן על פיהם וקדשו עליו מלחמה
    kjvRefs:
    - Micah 3:5
    kjvOsis:
    - Mic.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.6
    scripture: tanakh
    name: Tanakh Micah 3:6
    ref: Micah 3:6
    book: Mic
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14612
    text: Therefore it shall be night unto you, that ye shall have no vision; and it shall be dark unto you, that ye shall not divine; and the sun shall go down upon the prophets, and the day shall be black over them.
    translation: JPS 1917
    original: לָכֵן לַיְלָה לָכֶם מֵחָזוֹן וְחָשְׁכָה לָכֶם מִקְּסֹם וּבָאָה הַשֶּׁמֶשׁ עַל־הַנְּבִיאִים וְקָדַר עֲלֵיהֶם הַיּוֹם׃
    hebrewPlain: לכן לילה לכם מחזון וחשכה לכם מקסם ובאה השמש על הנביאים וקדר עליהם היום
    kjvRefs:
    - Micah 3:6
    kjvOsis:
    - Mic.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.7
    scripture: tanakh
    name: Tanakh Micah 3:7
    ref: Micah 3:7
    book: Mic
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14613
    text: And the seers shall be put to shame, and the diviners confounded; yea, they shall all cover their upper lips; for there shall be no answer of God.
    translation: JPS 1917
    original: וּבֹשׁוּ הַחֹזִים וְחָפְרוּ הַקֹּסְמִים וְעָטוּ עַל־שָׂפָם כֻּלָּם כִּי אֵין מַעֲנֵה אֱלֹהִים׃
    hebrewPlain: ובשו החזים וחפרו הקסמים ועטו על שפם כלם כי אין מענה אלהים
    kjvRefs:
    - Micah 3:7
    kjvOsis:
    - Mic.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.8
    scripture: tanakh
    name: Tanakh Micah 3:8
    ref: Micah 3:8
    book: Mic
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14614
    text: But I truly am full of power by the spirit of the LORD, and of justice, and of might, to declare unto Jacob his transgression, and to Israel his sin.
    translation: JPS 1917
    original: וְאוּלָם אָנֹכִי מָלֵאתִי כֹחַ אֶת־רוּחַ יְהוָה וּמִשְׁפָּט וּגְבוּרָה לְהַגִּיד לְיַעֲקֹב פִּשְׁעוֹ וּלְיִשְׂרָאֵל חַטָּאתוֹ׃
    hebrewPlain: ואולם אנכי מלאתי כח את רוח יהוה ומשפט וגבורה להגיד ליעקב פשעו ולישראל חטאתו
    kjvRefs:
    - Micah 3:8
    kjvOsis:
    - Mic.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.9
    scripture: tanakh
    name: Tanakh Micah 3:9
    ref: Micah 3:9
    book: Mic
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14615
    text: Hear this, I pray you, ye heads of the house of Jacob, and rulers of the house of Israel, that abhor justice, and pervert all equity;
    translation: JPS 1917
    original: שִׁמְעוּ־נָא זֹאת רָאשֵׁי בֵּית יַעֲקֹב וּקְצִינֵי בֵּית יִשְׂרָאֵל הַמֲתַעֲבִים מִשְׁפָּט וְאֵת כָּל־הַיְשָׁרָה יְעַקֵּשׁוּ׃
    hebrewPlain: שמעו נא זאת ראשי בית יעקב וקציני בית ישראל המתעבים משפט ואת כל הישרה יעקשו
    kjvRefs:
    - Micah 3:9
    kjvOsis:
    - Mic.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.10
    scripture: tanakh
    name: Tanakh Micah 3:10
    ref: Micah 3:10
    book: Mic
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14616
    text: That build up Zion with blood, and Jerusalem with iniquity.
    translation: JPS 1917
    original: בֹּנֶה צִיּוֹן בְּדָמִים וִירוּשָׁלִַם בְּעַוְלָה׃
    hebrewPlain: בנה ציון בדמים וירושלם בעולה
    kjvRefs:
    - Micah 3:10
    kjvOsis:
    - Mic.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.11
    scripture: tanakh
    name: Tanakh Micah 3:11
    ref: Micah 3:11
    book: Mic
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 14617
    text: 'The heads thereof judge for reward, and the priests thereof teach for hire, and the prophets thereof divine for money; yet will they lean upon the LORD, and say: ‘Is not the LORD in the midst of us? No evil shall come upon us’?'
    translation: JPS 1917
    original: רָאשֶׁיהָ בְּשֹׁחַד יִשְׁפֹּטוּ וְכֹהֲנֶיהָ בִּמְחִיר יוֹרוּ וּנְבִיאֶיהָ בְּכֶסֶף יִקְסֹמוּ וְעַל־יְהוָה יִשָּׁעֵנוּ לֵאמֹר הֲלוֹא יְהוָה בְּקִרְבֵּנוּ לֹא־תָבוֹא עָלֵינוּ רָעָה׃
    hebrewPlain: ראשיה בשחד ישפטו וכהניה במחיר יורו ונביאיה בכסף יקסמו ועל יהוה ישענו לאמר הלוא יהוה בקרבנו לא תבוא עלינו רעה
    kjvRefs:
    - Micah 3:11
    kjvOsis:
    - Mic.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.3.12
    scripture: tanakh
    name: Tanakh Micah 3:12
    ref: Micah 3:12
    book: Mic
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 14618
    text: Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of a forest.
    translation: JPS 1917
    original: לָכֵן בִּגְלַלְכֶם צִיּוֹן שָׂדֶה תֵחָרֵשׁ וִירוּשָׁלִַם עִיִּין תִּהְיֶה וְהַר הַבַּיִת לְבָמוֹת יָעַר׃
    hebrewPlain: לכן בגללכם ציון שדה תחרש וירושלם עיין תהיה והר הבית לבמות יער
    kjvRefs:
    - Micah 3:12
    kjvOsis:
    - Mic.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.3
- type: TanakhVerse
  data:
    osis: Mic.4.1
    scripture: tanakh
    name: Tanakh Micah 4:1
    ref: Micah 4:1
    book: Mic
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 14619
    text: But in the end of days it shall come to pass, That the mountain of the LORD’S house shall be established as the top of the mountains, And it shall be exalted above the hills; And peoples shall flow unto it.
    translation: JPS 1917
    original: וְהָיָה בְּאַחֲרִית הַיָּמִים יִהְיֶה הַר בֵּית־יְהוָה נָכוֹן בְּרֹאשׁ הֶהָרִים וְנִשָּׂא הוּא מִגְּבָעוֹת וְנָהֲרוּ עָלָיו עַמִּים׃
    hebrewPlain: והיה באחרית הימים יהיה הר בית יהוה נכון בראש ההרים ונשא הוא מגבעות ונהרו עליו עמים
    kjvRefs:
    - Micah 4:1
    kjvOsis:
    - Mic.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.2
    scripture: tanakh
    name: Tanakh Micah 4:2
    ref: Micah 4:2
    book: Mic
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 14620
    text: 'And many nations shall go and say: ‘Come ye, and let us go up to the mountain of the LORD, And to the house of the God of Jacob; And He will teach us of His ways, And we will walk in His paths’; For out of Zion shall go forth the law, And the word of the LORD from Jerusalem.'
    translation: JPS 1917
    original: וְהָלְכוּ גּוֹיִם רַבִּים וְאָמְרוּ לְכוּ וְנַעֲלֶה אֶל־הַר־יְהוָה וְאֶל־בֵּית אֱלֹהֵי יַעֲקֹב וְיוֹרֵנוּ מִדְּרָכָיו וְנֵלְכָה בְּאֹרְחֹתָיו כִּי מִצִּיּוֹן תֵּצֵא תוֹרָה וּדְבַר־יְהוָה מִירוּשָׁלִָם׃
    hebrewPlain: והלכו גוים רבים ואמרו לכו ונעלה אל הר יהוה ואל בית אלהי יעקב ויורנו מדרכיו ונלכה בארחתיו כי מציון תצא תורה ודבר יהוה מירושלם
    kjvRefs:
    - Micah 4:2
    kjvOsis:
    - Mic.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.3
    scripture: tanakh
    name: Tanakh Micah 4:3
    ref: Micah 4:3
    book: Mic
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 14621
    text: And He shall judge between many peoples, And shall decide concerning mighty nations afar off; And they shall beat their swords into plowshares, And their spears into pruninghooks; Nation shall not lift up sword against nation, Neither shall they learn war any more.
    translation: JPS 1917
    original: וְשָׁפַט בֵּין עַמִּים רַבִּים וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד־רָחוֹק וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת לֹא־יִשְׂאוּ גּוֹי אֶל־גּוֹי חֶרֶב וְלֹא־יִלְמְדוּן עוֹד מִלְחָמָה׃
    hebrewPlain: ושפט בין עמים רבים והוכיח לגוים עצמים עד רחוק וכתתו חרבתיהם לאתים וחניתתיהם למזמרות לא ישאו גוי אל גוי חרב ולא ילמדון עוד מלחמה
    kjvRefs:
    - Micah 4:3
    kjvOsis:
    - Mic.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.4
    scripture: tanakh
    name: Tanakh Micah 4:4
    ref: Micah 4:4
    book: Mic
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 14622
    text: But they shall sit every man under his vine and under his fig-tree; And none shall make them afraid; For the mouth of the LORD of hosts hath spoken.
    translation: JPS 1917
    original: וְיָשְׁבוּ אִישׁ תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ וְאֵין מַחֲרִיד כִּי־פִי יְהוָה צְבָאוֹת דִּבֵּר׃
    hebrewPlain: וישבו איש תחת גפנו ותחת תאנתו ואין מחריד כי פי יהוה צבאות דבר
    kjvRefs:
    - Micah 4:4
    kjvOsis:
    - Mic.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.5
    scripture: tanakh
    name: Tanakh Micah 4:5
    ref: Micah 4:5
    book: Mic
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 14623
    text: For let all the peoples walk each one in the name of its god, But we will walk in the name of the LORD our God for ever and ever.
    translation: JPS 1917
    original: כִּי כָּל־הָעַמִּים יֵלְכוּ אִישׁ בְּשֵׁם אֱלֹהָיו וַאֲנַחְנוּ נֵלֵךְ בְּשֵׁם־יְהוָה אֱלֹהֵינוּ לְעוֹלָם וָעֶד׃
    hebrewPlain: כי כל העמים ילכו איש בשם אלהיו ואנחנו נלך בשם יהוה אלהינו לעולם ועד
    kjvRefs:
    - Micah 4:5
    kjvOsis:
    - Mic.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.6
    scripture: tanakh
    name: Tanakh Micah 4:6
    ref: Micah 4:6
    book: Mic
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 14624
    text: In that day, saith the LORD, will I assemble her that halteth, And I will gather her that is driven away, And her that I have afflicted;
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא נְאֻם־יְהוָה אֹסְפָה הַצֹּלֵעָה וְהַנִּדָּחָה אֲקַבֵּצָה וַאֲשֶׁר הֲרֵעֹתִי׃
    hebrewPlain: ביום ההוא נאם יהוה אספה הצלעה והנדחה אקבצה ואשר הרעתי
    kjvRefs:
    - Micah 4:6
    kjvOsis:
    - Mic.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.7
    scripture: tanakh
    name: Tanakh Micah 4:7
    ref: Micah 4:7
    book: Mic
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 14625
    text: And I will make her that halted a remnant, And her that was cast far off a mighty nation; And the LORD shall reign over them in mount Zion from thenceforth even for ever.
    translation: JPS 1917
    original: וְשַׂמְתִּי אֶת־הַצֹּלֵעָה לִשְׁאֵרִית וְהַנַּהֲלָאָה לְגוֹי עָצוּם וּמָלַךְ יְהוָה עֲלֵיהֶם בְּהַר צִיּוֹן מֵעַתָּה וְעַד־עוֹלָם׃
    hebrewPlain: ושמתי את הצלעה לשארית והנהלאה לגוי עצום ומלך יהוה עליהם בהר ציון מעתה ועד עולם
    kjvRefs:
    - Micah 4:7
    kjvOsis:
    - Mic.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.8
    scripture: tanakh
    name: Tanakh Micah 4:8
    ref: Micah 4:8
    book: Mic
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 14626
    text: And thou, Migdal-eder, the hill of the daughter of Zion, Unto thee shall it come; Yea, the former dominion shall come, The kingdom of the daughter of Jerusalem.
    translation: JPS 1917
    original: וְאַתָּה מִגְדַּל־עֵדֶר עֹפֶל בַּת־צִיּוֹן עָדֶיךָ תֵּאתֶה וּבָאָה הַמֶּמְשָׁלָה הָרִאשֹׁנָה מַמְלֶכֶת לְבַת־יְרוּשָׁלִָם׃
    hebrewPlain: ואתה מגדל עדר עפל בת ציון עדיך תאתה ובאה הממשלה הראשנה ממלכת לבת ירושלם
    kjvRefs:
    - Micah 4:8
    kjvOsis:
    - Mic.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.9
    scripture: tanakh
    name: Tanakh Micah 4:9
    ref: Micah 4:9
    book: Mic
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 14627
    text: Now why dost thou cry out aloud? Is there no King in thee, Is thy Counsellor perished, That pangs have taken hold of thee as of a woman in travail?
    translation: JPS 1917
    original: עַתָּה לָמָּה תָרִיעִי רֵעַ הֲמֶלֶךְ אֵין־בָּךְ אִם־יוֹעֲצֵךְ אָבָד כִּי־הֶחֱזִיקֵךְ חִיל כַּיּוֹלֵדָה׃
    hebrewPlain: עתה למה תריעי רע המלך אין בך אם יועצך אבד כי החזיקך חיל כיולדה
    kjvRefs:
    - Micah 4:9
    kjvOsis:
    - Mic.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.10
    scripture: tanakh
    name: Tanakh Micah 4:10
    ref: Micah 4:10
    book: Mic
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 14628
    text: Be in pain, and labour to bring forth, O daughter of Zion, Like a woman in travail; For now shalt thou go forth out of the city, And shalt dwell in the field, And shalt come even unto Babylon; There shalt thou be rescued; There shall the LORD redeem thee from the hand of thine enemies.
    translation: JPS 1917
    original: חוּלִי וָגֹחִי בַּת־צִיּוֹן כַּיּוֹלֵדָה כִּי־עַתָּה תֵצְאִי מִקִּרְיָה וְשָׁכַנְתְּ בַּשָּׂדֶה וּבָאת עַד־בָּבֶל שָׁם תִּנָּצֵלִי שָׁם יִגְאָלֵךְ יְהוָה מִכַּף אֹיְבָיִךְ׃
    hebrewPlain: חולי וגחי בת ציון כיולדה כי עתה תצאי מקריה ושכנת בשדה ובאת עד בבל שם תנצלי שם יגאלך יהוה מכף איביך
    kjvRefs:
    - Micah 4:10
    kjvOsis:
    - Mic.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.11
    scripture: tanakh
    name: Tanakh Micah 4:11
    ref: Micah 4:11
    book: Mic
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 14629
    text: 'And now many nations are assembled against thee, That say: ‘Let her be defiled, and let our eye gaze upon Zion.’'
    translation: JPS 1917
    original: וְעַתָּה נֶאֶסְפוּ עָלַיִךְ גּוֹיִם רַבִּים הָאֹמְרִים תֶּחֱנָף וְתַחַז בְּצִיּוֹן עֵינֵינוּ׃
    hebrewPlain: ועתה נאספו עליך גוים רבים האמרים תחנף ותחז בציון עינינו
    kjvRefs:
    - Micah 4:11
    kjvOsis:
    - Mic.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.12
    scripture: tanakh
    name: Tanakh Micah 4:12
    ref: Micah 4:12
    book: Mic
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 14630
    text: But they know not the thoughts of the LORD, Neither understand they His counsel; For He hath gathered them as the sheaves to the threshing-floor.
    translation: JPS 1917
    original: וְהֵמָּה לֹא יָדְעוּ מַחְשְׁבוֹת יְהוָה וְלֹא הֵבִינוּ עֲצָתוֹ כִּי קִבְּצָם כֶּעָמִיר גֹּרְנָה׃
    hebrewPlain: והמה לא ידעו מחשבות יהוה ולא הבינו עצתו כי קבצם כעמיר גרנה
    kjvRefs:
    - Micah 4:12
    kjvOsis:
    - Mic.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.13
    scripture: tanakh
    name: Tanakh Micah 4:13
    ref: Micah 4:13
    book: Mic
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 14631
    text: Arise and thresh, O daughter of Zion; For I will make thy horn iron, And I will make thy hoofs brass; And thou shalt beat in pieces many peoples; And thou shalt devote their gain unto the LORD, And their substance unto the Lord of the whole earth.
    translation: JPS 1917
    original: קוּמִי וָדוֹשִׁי בַת־צִיּוֹן כִּי־קַרְנֵךְ אָשִׂים בַּרְזֶל וּפַרְסֹתַיִךְ אָשִׂים נְחוּשָׁה וַהֲדִקּוֹת עַמִּים רַבִּים וְהַחֲרַמְתִּי לַיהוָה בִּצְעָם וְחֵילָם לַאֲדוֹן כָּל־הָאָרֶץ׃
    hebrewPlain: קומי ודושי בת ציון כי קרנך אשים ברזל ופרסתיך אשים נחושה והדקות עמים רבים והחרמתי ליהוה בצעם וחילם לאדון כל הארץ
    kjvRefs:
    - Micah 4:13
    kjvOsis:
    - Mic.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.4.14
    scripture: tanakh
    name: Tanakh Micah 4:14
    ref: Micah 4:14
    book: Mic
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 14632
    text: Now shalt thou gather thyself in troops, O daughter of troops; They have laid siege against us; They smite the judge of Israel with a rod upon the cheek.
    translation: JPS 1917
    original: עַתָּה תִּתְגֹּדְדִי בַת־גְּדוּד מָצוֹר שָׂם עָלֵינוּ בַּשֵּׁבֶט יַכּוּ עַל־הַלְּחִי אֵת שֹׁפֵט יִשְׂרָאֵל׃
    hebrewPlain: עתה תתגדדי בת גדוד מצור שם עלינו בשבט יכו על הלחי את שפט ישראל
    kjvRefs:
    - Micah 5:1
    kjvOsis:
    - Mic.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.4
- type: TanakhVerse
  data:
    osis: Mic.5.1
    scripture: tanakh
    name: Tanakh Micah 5:1
    ref: Micah 5:1
    book: Mic
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 14633
    text: But thou, Beth-lehem Ephrathah, Which art little to be among the thousands of Judah, Out of thee shall one come forth unto Me that is to be ruler in Israel; Whose goings forth are from of old, from ancient days.
    translation: JPS 1917
    original: וְאַתָּה בֵּית־לֶחֶם אֶפְרָתָה צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה מִמְּךָ לִי יֵצֵא לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל וּמוֹצָאֹתָיו מִקֶּדֶם מִימֵי עוֹלָם׃
    hebrewPlain: ואתה בית לחם אפרתה צעיר להיות באלפי יהודה ממך לי יצא להיות מושל בישראל ומוצאתיו מקדם מימי עולם
    kjvRefs:
    - Micah 5:2
    kjvOsis:
    - Mic.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.2
    scripture: tanakh
    name: Tanakh Micah 5:2
    ref: Micah 5:2
    book: Mic
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 14634
    text: Therefore will He give them up, Until the time that she who travaileth hath brought forth; Then the residue of his brethren shall return with the children of Israel.
    translation: JPS 1917
    original: לָכֵן יִתְּנֵם עַד־עֵת יוֹלֵדָה יָלָדָה וְיֶתֶר אֶחָיו יְשׁוּבוּן עַל־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: לכן יתנם עד עת יולדה ילדה ויתר אחיו ישובון על בני ישראל
    kjvRefs:
    - Micah 5:3
    kjvOsis:
    - Mic.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.3
    scripture: tanakh
    name: Tanakh Micah 5:3
    ref: Micah 5:3
    book: Mic
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 14635
    text: And he shall stand, and shall feed his flock in the strength of the LORD, In the majesty of the name of the LORD his God; And they shall abide, for then shall he be great unto the ends of the earth.
    translation: JPS 1917
    original: וְעָמַד וְרָעָה בְּעֹז יְהוָה בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו וְיָשָׁבוּ כִּי־עַתָּה יִגְדַּל עַד־אַפְסֵי־אָרֶץ׃
    hebrewPlain: ועמד ורעה בעז יהוה בגאון שם יהוה אלהיו וישבו כי עתה יגדל עד אפסי ארץ
    kjvRefs:
    - Micah 5:4
    kjvOsis:
    - Mic.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.4
    scripture: tanakh
    name: Tanakh Micah 5:4
    ref: Micah 5:4
    book: Mic
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 14636
    text: 'And this shall be peace: When the Assyrian shall come into our land, And when he shall tread in our palaces, Then shall we raise against him seven shepherds, And eight princes among men.'
    translation: JPS 1917
    original: וְהָיָה זֶה שָׁלוֹם אַשּׁוּר כִּי־יָבוֹא בְאַרְצֵנוּ וְכִי יִדְרֹךְ בְּאַרְמְנֹתֵינוּ וַהֲקֵמֹנוּ עָלָיו שִׁבְעָה רֹעִים וּשְׁמֹנָה נְסִיכֵי אָדָם׃
    hebrewPlain: והיה זה שלום אשור כי יבוא בארצנו וכי ידרך בארמנתינו והקמנו עליו שבעה רעים ושמנה נסיכי אדם
    kjvRefs:
    - Micah 5:5
    kjvOsis:
    - Mic.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.5
    scripture: tanakh
    name: Tanakh Micah 5:5
    ref: Micah 5:5
    book: Mic
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 14637
    text: And they shall waste the land of Assyria with the sword, And the land of Nimrod with the keen-edged sword; And he shall deliver us from the Assyrian, when he cometh into our land, And when he treadeth within our border.
    translation: JPS 1917
    original: וְרָעוּ אֶת־אֶרֶץ אַשּׁוּר בַּחֶרֶב וְאֶת־אֶרֶץ נִמְרֹד בִּפְתָחֶיהָ וְהִצִּיל מֵאַשּׁוּר כִּי־יָבוֹא בְאַרְצֵנוּ וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ׃
    hebrewPlain: ורעו את ארץ אשור בחרב ואת ארץ נמרד בפתחיה והציל מאשור כי יבוא בארצנו וכי ידרך בגבולנו
    kjvRefs:
    - Micah 5:6
    kjvOsis:
    - Mic.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.6
    scripture: tanakh
    name: Tanakh Micah 5:6
    ref: Micah 5:6
    book: Mic
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 14638
    text: And the remnant of Jacob shall be in the midst of many peoples, As dew from the LORD, as showers upon the grass, That are not looked for from man, Nor awaited at the hands of the sons of men.
    translation: JPS 1917
    original: וְהָיָה שְׁאֵרִית יַעֲקֹב בְּקֶרֶב עַמִּים רַבִּים כְּטַל מֵאֵת יְהוָה כִּרְבִיבִים עֲלֵי־עֵשֶׂב אֲשֶׁר לֹא־יְקַוֶּה לְאִישׁ וְלֹא יְיַחֵל לִבְנֵי אָדָם׃
    hebrewPlain: והיה שארית יעקב בקרב עמים רבים כטל מאת יהוה כרביבים עלי עשב אשר לא יקוה לאיש ולא ייחל לבני אדם
    kjvRefs:
    - Micah 5:7
    kjvOsis:
    - Mic.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.7
    scripture: tanakh
    name: Tanakh Micah 5:7
    ref: Micah 5:7
    book: Mic
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 14639
    text: And the remnant of Jacob shall be among the nations, in the midst of many peoples, As a lion among the beasts of the forest, As a young lion among the flocks of sheep, Who, if he go through, treadeth down and teareth in pieces, And there is none to deliver.
    translation: JPS 1917
    original: וְהָיָה שְׁאֵרִית יַעֲקֹב בַּגּוֹיִם בְּקֶרֶב עַמִּים רַבִּים כְּאַרְיֵה בְּבַהֲמוֹת יַעַר כִּכְפִיר בְּעֶדְרֵי צֹאן אֲשֶׁר אִם עָבַר וְרָמַס וְטָרַף וְאֵין מַצִּיל׃
    hebrewPlain: והיה שארית יעקב בגוים בקרב עמים רבים כאריה בבהמות יער ככפיר בעדרי צאן אשר אם עבר ורמס וטרף ואין מציל
    kjvRefs:
    - Micah 5:8
    kjvOsis:
    - Mic.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.8
    scripture: tanakh
    name: Tanakh Micah 5:8
    ref: Micah 5:8
    book: Mic
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 14640
    text: Let Thy hand be lifted up above Thine adversaries, And let all Thine enemies be cut off. .
    translation: JPS 1917
    original: תָּרֹם יָדְךָ עַל־צָרֶיךָ וְכָל־אֹיְבֶיךָ יִכָּרֵתוּ׃
    hebrewPlain: תרם ידך על צריך וכל איביך יכרתו
    kjvRefs:
    - Micah 5:9
    kjvOsis:
    - Mic.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.9
    scripture: tanakh
    name: Tanakh Micah 5:9
    ref: Micah 5:9
    book: Mic
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 14641
    text: And it shall come to pass in that day, saith the LORD, That I will cut off thy horses out of the midst of thee, And will destroy thy chariots;
    translation: JPS 1917
    original: וְהָיָה בַיּוֹם־הַהוּא נְאֻם־יְהוָה וְהִכְרַתִּי סוּסֶיךָ מִקִּרְבֶּךָ וְהַאֲבַדְתִּי מַרְכְּבֹתֶיךָ׃
    hebrewPlain: והיה ביום ההוא נאם יהוה והכרתי סוסיך מקרבך והאבדתי מרכבתיך
    kjvRefs:
    - Micah 5:10
    kjvOsis:
    - Mic.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.10
    scripture: tanakh
    name: Tanakh Micah 5:10
    ref: Micah 5:10
    book: Mic
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 14642
    text: And I will cut off the cities of thy land, And will throw down all thy strongholds;
    translation: JPS 1917
    original: וְהִכְרַתִּי עָרֵי אַרְצֶךָ וְהָרַסְתִּי כָּל־מִבְצָרֶיךָ׃
    hebrewPlain: והכרתי ערי ארצך והרסתי כל מבצריך
    kjvRefs:
    - Micah 5:11
    kjvOsis:
    - Mic.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.11
    scripture: tanakh
    name: Tanakh Micah 5:11
    ref: Micah 5:11
    book: Mic
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 14643
    text: And I will cut off witchcrafts out of thy hand; And thou shalt have no more soothsayers;
    translation: JPS 1917
    original: וְהִכְרַתִּי כְשָׁפִים מִיָּדֶךָ וּמְעוֹנְנִים לֹא יִהְיוּ־לָךְ׃
    hebrewPlain: והכרתי כשפים מידך ומעוננים לא יהיו לך
    kjvRefs:
    - Micah 5:12
    kjvOsis:
    - Mic.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.12
    scripture: tanakh
    name: Tanakh Micah 5:12
    ref: Micah 5:12
    book: Mic
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 14644
    text: And I will cut off thy graven images and thy pillars out of the midst of thee; And thou shalt no more worship the work of thy hands.
    translation: JPS 1917
    original: וְהִכְרַתִּי פְסִילֶיךָ וּמַצֵּבוֹתֶיךָ מִקִּרְבֶּךָ וְלֹא־תִשְׁתַּחֲוֶה עוֹד לְמַעֲשֵׂה יָדֶיךָ׃
    hebrewPlain: והכרתי פסיליך ומצבותיך מקרבך ולא תשתחוה עוד למעשה ידיך
    kjvRefs:
    - Micah 5:13
    kjvOsis:
    - Mic.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.13
    scripture: tanakh
    name: Tanakh Micah 5:13
    ref: Micah 5:13
    book: Mic
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 14645
    text: And I will pluck up thy Asherim out of the midst of thee; And I will destroy thine enemies.
    translation: JPS 1917
    original: וְנָתַשְׁתִּי אֲשֵׁירֶיךָ מִקִּרְבֶּךָ וְהִשְׁמַדְתִּי עָרֶיךָ׃
    hebrewPlain: ונתשתי אשיריך מקרבך והשמדתי עריך
    kjvRefs:
    - Micah 5:14
    kjvOsis:
    - Mic.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.5.14
    scripture: tanakh
    name: Tanakh Micah 5:14
    ref: Micah 5:14
    book: Mic
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 14646
    text: And I will execute vengeance in anger and fury upon the nations, Because they hearkened not.
    translation: JPS 1917
    original: וְעָשִׂיתִי בְּאַף וּבְחֵמָה נָקָם אֶת־הַגּוֹיִם אֲשֶׁר לֹא שָׁמֵעוּ׃
    hebrewPlain: ועשיתי באף ובחמה נקם את הגוים אשר לא שמעו
    kjvRefs:
    - Micah 5:15
    kjvOsis:
    - Mic.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.5
- type: TanakhVerse
  data:
    osis: Mic.6.1
    scripture: tanakh
    name: Tanakh Micah 6:1
    ref: Micah 6:1
    book: Mic
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 14647
    text: 'Hear ye now what the LORD saith: Arise, contend thou before the mountains, And let the hills hear thy voice.'
    translation: JPS 1917
    original: שִׁמְעוּ־נָא אֵת אֲשֶׁר־יְהוָה אֹמֵר קוּם רִיב אֶת־הֶהָרִים וְתִשְׁמַעְנָה הַגְּבָעוֹת קוֹלֶךָ׃
    hebrewPlain: שמעו נא את אשר יהוה אמר קום ריב את ההרים ותשמענה הגבעות קולך
    kjvRefs:
    - Micah 6:1
    kjvOsis:
    - Mic.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.2
    scripture: tanakh
    name: Tanakh Micah 6:2
    ref: Micah 6:2
    book: Mic
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 14648
    text: Hear, O ye mountains, the LORD’S controversy, And ye enduring rocks, the foundations of the earth; For the LORD hath a controversy with His people, And He will plead with Israel.
    translation: JPS 1917
    original: שִׁמְעוּ הָרִים אֶת־רִיב יְהוָה וְהָאֵתָנִים מֹסְדֵי אָרֶץ כִּי רִיב לַיהוָה עִם־עַמּוֹ וְעִם־יִשְׂרָאֵל יִתְוַכָּח׃
    hebrewPlain: שמעו הרים את ריב יהוה והאתנים מסדי ארץ כי ריב ליהוה עם עמו ועם ישראל יתוכח
    kjvRefs:
    - Micah 6:2
    kjvOsis:
    - Mic.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.3
    scripture: tanakh
    name: Tanakh Micah 6:3
    ref: Micah 6:3
    book: Mic
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 14649
    text: O My people, what have I done unto thee? And wherein have I wearied thee? Testify against Me.
    translation: JPS 1917
    original: עַמִּי מֶה־עָשִׂיתִי לְךָ וּמָה הֶלְאֵתִיךָ עֲנֵה בִּי׃
    hebrewPlain: עמי מה עשיתי לך ומה הלאתיך ענה בי
    kjvRefs:
    - Micah 6:3
    kjvOsis:
    - Mic.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.4
    scripture: tanakh
    name: Tanakh Micah 6:4
    ref: Micah 6:4
    book: Mic
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 14650
    text: For I brought thee up out of the land of Egypt, And redeemed thee out of the house of bondage, And I sent before thee Moses, Aaron, and Miriam.
    translation: JPS 1917
    original: כִּי הֶעֱלִתִיךָ מֵאֶרֶץ מִצְרַיִם וּמִבֵּית עֲבָדִים פְּדִיתִיךָ וָאֶשְׁלַח לְפָנֶיךָ אֶת־מֹשֶׁה אַהֲרֹן וּמִרְיָם׃
    hebrewPlain: כי העלתיך מארץ מצרים ומבית עבדים פדיתיך ואשלח לפניך את משה אהרן ומרים
    kjvRefs:
    - Micah 6:4
    kjvOsis:
    - Mic.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.5
    scripture: tanakh
    name: Tanakh Micah 6:5
    ref: Micah 6:5
    book: Mic
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 14651
    text: O My people, remember now what Balak king of Moab devised, And what Balaam the son of Beor answered him; From Shittim unto Gilgal, That ye may know the righteous acts of the LORD.
    translation: JPS 1917
    original: עַמִּי זְכָר־נָא מַה־יָּעַץ בָּלָק מֶלֶךְ מוֹאָב וּמֶה־עָנָה אֹתוֹ בִּלְעָם בֶּן־בְּעוֹר מִן־הַשִּׁטִּים עַד־הַגִּלְגָּל לְמַעַן דַּעַת צִדְקוֹת יְהוָה׃
    hebrewPlain: עמי זכר נא מה יעץ בלק מלך מואב ומה ענה אתו בלעם בן בעור מן השטים עד הגלגל למען דעת צדקות יהוה
    kjvRefs:
    - Micah 6:5
    kjvOsis:
    - Mic.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.6
    scripture: tanakh
    name: Tanakh Micah 6:6
    ref: Micah 6:6
    book: Mic
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 14652
    text: ’Wherewith shall I come before the LORD, And bow myself before God on high? Shall I come before Him with burnt-offerings, With calves of a year old?
    translation: JPS 1917
    original: בַּמָּה אֲקַדֵּם יְהוָה אִכַּף לֵאלֹהֵי מָרוֹם הַאֲקַדְּמֶנּוּ בְעוֹלוֹת בַּעֲגָלִים בְּנֵי שָׁנָה׃
    hebrewPlain: במה אקדם יהוה אכף לאלהי מרום האקדמנו בעולות בעגלים בני שנה
    kjvRefs:
    - Micah 6:6
    kjvOsis:
    - Mic.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.7
    scripture: tanakh
    name: Tanakh Micah 6:7
    ref: Micah 6:7
    book: Mic
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 14653
    text: Will the LORD be pleased with thousands of rams, With ten thousands of rivers of oil? Shall I give my first-born for my transgression, The fruit of my body for the sin of my soul?’
    translation: JPS 1917
    original: הֲיִרְצֶה יְהוָה בְּאַלְפֵי אֵילִים בְּרִבְבוֹת נַחֲלֵי־שָׁמֶן הַאֶתֵּן בְּכוֹרִי פִּשְׁעִי פְּרִי בִטְנִי חַטַּאת נַפְשִׁי׃
    hebrewPlain: הירצה יהוה באלפי אילים ברבבות נחלי שמן האתן בכורי פשעי פרי בטני חטאת נפשי
    kjvRefs:
    - Micah 6:7
    kjvOsis:
    - Mic.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.8
    scripture: tanakh
    name: Tanakh Micah 6:8
    ref: Micah 6:8
    book: Mic
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 14654
    text: 'It hath been told thee, O man, what is good, And what the LORD doth require of thee: Only to do justly, and to love mercy, and to walk humbly with thy God.'
    translation: JPS 1917
    original: הִגִּיד לְךָ אָדָם מַה־טּוֹב וּמָה־יְהוָה דּוֹרֵשׁ מִמְּךָ כִּי אִם־עֲשׂוֹת מִשְׁפָּט וְאַהֲבַת חֶסֶד וְהַצְנֵעַ לֶכֶת עִם־אֱלֹהֶיךָ׃
    hebrewPlain: הגיד לך אדם מה טוב ומה יהוה דורש ממך כי אם עשות משפט ואהבת חסד והצנע לכת עם אלהיך
    kjvRefs:
    - Micah 6:8
    kjvOsis:
    - Mic.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.9
    scripture: tanakh
    name: Tanakh Micah 6:9
    ref: Micah 6:9
    book: Mic
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 14655
    text: Hark! the LORD crieth unto the city— And it is wisdom to have regard for Thy name— Hear ye the rod, and who hath appointed it.
    translation: JPS 1917
    original: קוֹל יְהוָה לָעִיר יִקְרָא וְתוּשִׁיָּה יִרְאֶה שְׁמֶךָ שִׁמְעוּ מַטֶּה וּמִי יְעָדָהּ׃
    hebrewPlain: קול יהוה לעיר יקרא ותושיה יראה שמך שמעו מטה ומי יעדה
    kjvRefs:
    - Micah 6:9
    kjvOsis:
    - Mic.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.10
    scripture: tanakh
    name: Tanakh Micah 6:10
    ref: Micah 6:10
    book: Mic
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 14656
    text: Are there yet the treasures of wickedness in the house of the wicked, And the scant measure that is abominable?
    translation: JPS 1917
    original: עוֹד הַאִשׁ בֵּית רָשָׁע אֹצְרוֹת רֶשַׁע וְאֵיפַת רָזוֹן זְעוּמָה׃
    hebrewPlain: עוד האש בית רשע אצרות רשע ואיפת רזון זעומה
    kjvRefs:
    - Micah 6:10
    kjvOsis:
    - Mic.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.11
    scripture: tanakh
    name: Tanakh Micah 6:11
    ref: Micah 6:11
    book: Mic
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 14657
    text: ’Shall I be pure with wicked balances, And with a bag of deceitful weights?’
    translation: JPS 1917
    original: הַאֶזְכֶּה בְּמֹאזְנֵי רֶשַׁע וּבְכִיס אַבְנֵי מִרְמָה׃
    hebrewPlain: האזכה במאזני רשע ובכיס אבני מרמה
    kjvRefs:
    - Micah 6:11
    kjvOsis:
    - Mic.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.12
    scripture: tanakh
    name: Tanakh Micah 6:12
    ref: Micah 6:12
    book: Mic
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 14658
    text: For the rich men thereof are full of violence, And the inhabitants thereof have spoken lies, And their tongue is deceitful in their mouth.
    translation: JPS 1917
    original: אֲשֶׁר עֲשִׁירֶיהָ מָלְאוּ חָמָס וְיֹשְׁבֶיהָ דִּבְּרוּ־שָׁקֶר וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶם׃
    hebrewPlain: אשר עשיריה מלאו חמס וישביה דברו שקר ולשונם רמיה בפיהם
    kjvRefs:
    - Micah 6:12
    kjvOsis:
    - Mic.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.13
    scripture: tanakh
    name: Tanakh Micah 6:13
    ref: Micah 6:13
    book: Mic
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 14659
    text: Therefore I also do smite thee with a grievous wound; I do make thee desolate because of thy sins.
    translation: JPS 1917
    original: וְגַם־אֲנִי הֶחֱלֵיתִי הַכּוֹתֶךָ הַשְׁמֵם עַל־חַטֹּאתֶךָ׃
    hebrewPlain: וגם אני החליתי הכותך השמם על חטאתך
    kjvRefs:
    - Micah 6:13
    kjvOsis:
    - Mic.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.14
    scripture: tanakh
    name: Tanakh Micah 6:14
    ref: Micah 6:14
    book: Mic
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 14660
    text: Thou shalt eat, but not be satisfied; And thy sickness shall be in thine inward parts; And thou shalt conceive, but shalt not bring forth; And whomsoever thou bringest forth will I give up to the sword.
    translation: JPS 1917
    original: אַתָּה תֹאכַל וְלֹא תִשְׂבָּע וְיֶשְׁחֲךָ בְּקִרְבֶּךָ וְתַסֵּג וְלֹא תַפְלִיט וַאֲשֶׁר תְּפַלֵּט לַחֶרֶב אֶתֵּן׃
    hebrewPlain: אתה תאכל ולא תשבע וישחך בקרבך ותסג ולא תפליט ואשר תפלט לחרב אתן
    kjvRefs:
    - Micah 6:14
    kjvOsis:
    - Mic.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.15
    scripture: tanakh
    name: Tanakh Micah 6:15
    ref: Micah 6:15
    book: Mic
    section: neviim
    chapter: 6
    verse: 15
    ordinal: 14661
    text: Thou shalt sow, but shalt not reap; Thou shalt tread the olives, but shalt not anoint thee with oil; And the vintage, but shalt not drink wine.
    translation: JPS 1917
    original: אַתָּה תִזְרַע וְלֹא תִקְצוֹר אַתָּה תִדְרֹךְ־זַיִת וְלֹא־תָסוּךְ שֶׁמֶן וְתִירוֹשׁ וְלֹא תִשְׁתֶּה־יָּיִן׃
    hebrewPlain: אתה תזרע ולא תקצור אתה תדרך זית ולא תסוך שמן ותירוש ולא תשתה יין
    kjvRefs:
    - Micah 6:15
    kjvOsis:
    - Mic.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.6.16
    scripture: tanakh
    name: Tanakh Micah 6:16
    ref: Micah 6:16
    book: Mic
    section: neviim
    chapter: 6
    verse: 16
    ordinal: 14662
    text: For the statutes of Omri are kept, And all the works of the house of Ahab, And ye walk in their counsels; That I may make thee an astonishment, And the inhabitants thereof a hissing; And ye shall bear the reproach of My people.
    translation: JPS 1917
    original: וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי וְכֹל מַעֲשֵׂה בֵית־אַחְאָב וַתֵּלְכוּ בְּמֹעֲצוֹתָם לְמַעַן תִּתִּי אֹתְךָ לְשַׁמָּה וְיֹשְׁבֶיהָ לִשְׁרֵקָה וְחֶרְפַּת עַמִּי תִּשָּׂאוּ׃
    hebrewPlain: וישתמר חקות עמרי וכל מעשה בית אחאב ותלכו במעצותם למען תתי אתך לשמה וישביה לשרקה וחרפת עמי תשאו
    kjvRefs:
    - Micah 6:16
    kjvOsis:
    - Mic.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.6
- type: TanakhVerse
  data:
    osis: Mic.7.1
    scripture: tanakh
    name: Tanakh Micah 7:1
    ref: Micah 7:1
    book: Mic
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 14663
    text: Woe is me! for I am as the last of the summer fruits, As the grape gleanings of the vintage; There is no cluster to eat; Nor first-ripe fig which my soul desireth.
    translation: JPS 1917
    original: אַלְלַי לִי כִּי הָיִיתִי כְּאָסְפֵּי־קַיִץ כְּעֹלְלֹת בָּצִיר אֵין־אֶשְׁכּוֹל לֶאֱכוֹל בִּכּוּרָה אִוְּתָה נַפְשִׁי׃
    hebrewPlain: אללי לי כי הייתי כאספי קיץ כעללת בציר אין אשכול לאכול בכורה אותה נפשי
    kjvRefs:
    - Micah 7:1
    kjvOsis:
    - Mic.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.2
    scripture: tanakh
    name: Tanakh Micah 7:2
    ref: Micah 7:2
    book: Mic
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 14664
    text: The godly man is perished out of the earth, And the upright among men is no more; They all lie in wait for blood; They hunt every man his brother with a net.
    translation: JPS 1917
    original: אָבַד חָסִיד מִן־הָאָרֶץ וְיָשָׁר בָּאָדָם אָיִן כֻּלָּם לְדָמִים יֶאֱרֹבוּ אִישׁ אֶת־אָחִיהוּ יָצוּדוּ חֵרֶם׃
    hebrewPlain: אבד חסיד מן הארץ וישר באדם אין כלם לדמים יארבו איש את אחיהו יצודו חרם
    kjvRefs:
    - Micah 7:2
    kjvOsis:
    - Mic.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.3
    scripture: tanakh
    name: Tanakh Micah 7:3
    ref: Micah 7:3
    book: Mic
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 14665
    text: Their hands are upon that which is evil to do it diligently; The prince asketh, and the judge is ready for a reward; And the great man, he uttereth the evil desire of his soul; Thus they weave it together.
    translation: JPS 1917
    original: עַל־הָרַע כַּפַּיִם לְהֵיטִיב הַשַּׂר שֹׁאֵל וְהַשֹּׁפֵט בַּשִׁלּוּם וְהַגָּדוֹל דֹּבֵר הַוַּת נַפְשׁוֹ הוּא וַיְעַבְּתוּהָ׃
    hebrewPlain: על הרע כפים להיטיב השר שאל והשפט בשלום והגדול דבר הות נפשו הוא ויעבתוה
    kjvRefs:
    - Micah 7:3
    kjvOsis:
    - Mic.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.4
    scripture: tanakh
    name: Tanakh Micah 7:4
    ref: Micah 7:4
    book: Mic
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 14666
    text: The best of them is as a brier; The most upright is worse than a thorn hedge; The day of thy watchmen, even thy visitation, is come; Now shall be their perplexity.
    translation: JPS 1917
    original: טוֹבָם כְּחֵדֶק יָשָׁר מִמְּסוּכָה יוֹם מְצַפֶּיךָ פְּקֻדָּתְךָ בָאָה עַתָּה תִהְיֶה מְבוּכָתָם׃
    hebrewPlain: טובם כחדק ישר ממסוכה יום מצפיך פקדתך באה עתה תהיה מבוכתם
    kjvRefs:
    - Micah 7:4
    kjvOsis:
    - Mic.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.5
    scripture: tanakh
    name: Tanakh Micah 7:5
    ref: Micah 7:5
    book: Mic
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 14667
    text: Trust ye not in a friend, Put ye not confidence in a familiar friend; Keep the doors of thy mouth from her that lieth in thy bosom. .
    translation: JPS 1917
    original: אַל־תַּאֲמִינוּ בְרֵעַ אַל־תִּבְטְחוּ בְּאַלּוּף מִשֹּׁכֶבֶת חֵיקֶךָ שְׁמֹר פִּתְחֵי־פִיךָ׃
    hebrewPlain: אל תאמינו ברע אל תבטחו באלוף משכבת חיקך שמר פתחי פיך
    kjvRefs:
    - Micah 7:5
    kjvOsis:
    - Mic.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.6
    scripture: tanakh
    name: Tanakh Micah 7:6
    ref: Micah 7:6
    book: Mic
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 14668
    text: For the son dishonoureth the father, The daughter riseth up against her mother, The daughter-in-law against her mother-in-law; A man’s enemies are the men of his own house.
    translation: JPS 1917
    original: כִּי־בֵן מְנַבֵּל אָב בַּת קָמָה בְאִמָּהּ כַּלָּה בַּחֲמֹתָהּ אֹיְבֵי אִישׁ אַנְשֵׁי בֵיתוֹ׃
    hebrewPlain: כי בן מנבל אב בת קמה באמה כלה בחמתה איבי איש אנשי ביתו
    kjvRefs:
    - Micah 7:6
    kjvOsis:
    - Mic.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.7
    scripture: tanakh
    name: Tanakh Micah 7:7
    ref: Micah 7:7
    book: Mic
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 14669
    text: ’But as for me, I will look unto the LORD; I will wait for the God of my salvation; My God will hear me.
    translation: JPS 1917
    original: וַאֲנִי בַּיהוָה אֲצַפֶּה אוֹחִילָה לֵאלֹהֵי יִשְׁעִי יִשְׁמָעֵנִי אֱלֹהָי׃
    hebrewPlain: ואני ביהוה אצפה אוחילה לאלהי ישעי ישמעני אלהי
    kjvRefs:
    - Micah 7:7
    kjvOsis:
    - Mic.7.7
