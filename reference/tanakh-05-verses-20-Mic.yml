    section: neviim
    chapter: 1
    verse: 2
    ordinal: 14579
    text: Hear, ye peoples, all of you; Hearken, O earth, and all that therein is; And let the Lord GOD be witness against you, The Lord from His holy temple.
    translation: JPS 1917
    original: שִׁמְעוּ עַמִּים כֻּלָּם הַקְשִׁיבִי אֶרֶץ וּמְלֹאָהּ וִיהִי אֲדֹנָי יְהוִה בָּכֶם לְעֵד אֲדֹנָי מֵהֵיכַל קָדְשׁוֹ׃
    hebrewPlain: שמעו עמים כלם הקשיבי ארץ ומלאה ויהי אדני יהוה בכם לעד אדני מהיכל קדשו
    kjvRefs:
