    text: The word of the LORD that came to Micah the Morashtite in the days of Jotham, Ahaz, and Hezekiah, kings of Judah, which he saw concerning Samaria and Jerusalem.
    translation: JPS 1917
    original: דְּבַר־יְהוָה אֲשֶׁר הָיָה אֶל־מִיכָה הַמֹּרַשְׁתִּי בִּימֵי יוֹתָם אָחָז יְחִזְקִיָּה מַלְכֵי יְהוּדָה אֲשֶׁר־חָזָה עַל־שֹׁמְרוֹן וִירוּשָׁלִָם׃
    hebrewPlain: דבר יהוה אשר היה אל מיכה המרשתי בימי יותם אחז יחזקיה מלכי יהודה אשר חזה על שמרון וירושלם
    kjvRefs:
    - Micah 1:1
