      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.8
    scripture: tanakh
    name: Tanakh Micah 7:8
    ref: Micah 7:8
    book: Mic
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 14670
    text: Rejoice not against me, O mine enemy; Though I am fallen, I shall arise; Though I sit in darkness, the LORD is a light unto me.
    translation: JPS 1917
    original: אַל־תִּשְׂמְחִי אֹיַבְתִּי לִי כִּי נָפַלְתִּי קָמְתִּי כִּי־אֵשֵׁב בַּחֹשֶׁךְ יְהוָה אוֹר לִי׃
    hebrewPlain: אל תשמחי איבתי לי כי נפלתי קמתי כי אשב בחשך יהוה אור לי
    kjvRefs:
    - Micah 7:8
    kjvOsis:
    - Mic.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.9
    scripture: tanakh
    name: Tanakh Micah 7:9
    ref: Micah 7:9
    book: Mic
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 14671
    text: I will bear the indignation of the LORD, Because I have sinned against Him; Until He plead my cause, and execute judgment for me; He will bring me forth to the light, And I shall behold His righteousness.
    translation: JPS 1917
    original: זַעַף יְהוָה אֶשָּׂא כִּי חָטָאתִי לוֹ עַד אֲשֶׁר יָרִיב רִיבִי וְעָשָׂה מִשְׁפָּטִי יוֹצִיאֵנִי לָאוֹר אֶרְאֶה בְּצִדְקָתוֹ׃
    hebrewPlain: זעף יהוה אשא כי חטאתי לו עד אשר יריב ריבי ועשה משפטי יוציאני לאור אראה בצדקתו
    kjvRefs:
    - Micah 7:9
    kjvOsis:
    - Mic.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.10
    scripture: tanakh
    name: Tanakh Micah 7:10
    ref: Micah 7:10
    book: Mic
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 14672
    text: 'Then mine enemy shall see it, and shame shall cover her; Who said unto me: Where is the LORD thy God? Mine eyes shall gaze upon her; Now shall she be trodden down as the mire of the streets.’'
    translation: JPS 1917
    original: וְתֵרֶא אֹיַבְתִּי וּתְכַסֶּהָ בוּשָׁה הָאֹמְרָה אֵלַי אַיּוֹ יְהוָה אֱלֹהָיִךְ עֵינַי תִּרְאֶינָּה בָּהּ עַתָּה תִּהְיֶה לְמִרְמָס כְּטִיט חוּצוֹת׃
    hebrewPlain: ותרא איבתי ותכסה בושה האמרה אלי איו יהוה אלהיך עיני תראינה בה עתה תהיה למרמס כטיט חוצות
    kjvRefs:
    - Micah 7:10
    kjvOsis:
    - Mic.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.11
    scripture: tanakh
    name: Tanakh Micah 7:11
    ref: Micah 7:11
    book: Mic
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 14673
    text: ’The day for building thy walls, even that day, shall be far removed.’
    translation: JPS 1917
    original: יוֹם לִבְנוֹת גְּדֵרָיִךְ יוֹם הַהוּא יִרְחַק־חֹק׃
    hebrewPlain: יום לבנות גדריך יום ההוא ירחק חק
    kjvRefs:
    - Micah 7:11
    kjvOsis:
    - Mic.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.12
    scripture: tanakh
    name: Tanakh Micah 7:12
    ref: Micah 7:12
    book: Mic
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 14674
    text: There shall be a day when they shall come unto thee, From Assyria even to the cities of Egypt, And from Egypt even to the River, And from sea to sea, and from mountain to mountain.
    translation: JPS 1917
    original: יוֹם הוּא וְעָדֶיךָ יָבוֹא לְמִנִּי אַשּׁוּר וְעָרֵי מָצוֹר וּלְמִנִּי מָצוֹר וְעַד־נָהָר וְיָם מִיָּם וְהַר הָהָר׃
    hebrewPlain: יום הוא ועדיך יבוא למני אשור וערי מצור ולמני מצור ועד נהר וים מים והר ההר
    kjvRefs:
    - Micah 7:12
    kjvOsis:
    - Mic.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.13
    scripture: tanakh
    name: Tanakh Micah 7:13
    ref: Micah 7:13
    book: Mic
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 14675
    text: And the land shall be desolate for them that dwell therein, Because of the fruit of their doings.
    translation: JPS 1917
    original: וְהָיְתָה הָאָרֶץ לִשְׁמָמָה עַל־יֹשְׁבֶיהָ מִפְּרִי מַעַלְלֵיהֶם׃
    hebrewPlain: והיתה הארץ לשממה על ישביה מפרי מעלליהם
    kjvRefs:
    - Micah 7:13
    kjvOsis:
    - Mic.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.14
    scripture: tanakh
    name: Tanakh Micah 7:14
    ref: Micah 7:14
    book: Mic
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 14676
    text: Tend Thy people with Thy staff, the flock of Thy heritage, That dwell solitarily, as a forest in the midst of the fruitful field; Let them feed in Bashan and Gilead, as in the days of old.
    translation: JPS 1917
    original: רְעֵה עַמְּךָ בְשִׁבְטֶךָ צֹאן נַחֲלָתֶךָ שֹׁכְנִי לְבָדָד יַעַר בְּתוֹךְ כַּרְמֶל יִרְעוּ בָשָׁן וְגִלְעָד כִּימֵי עוֹלָם׃
    hebrewPlain: רעה עמך בשבטך צאן נחלתך שכני לבדד יער בתוך כרמל ירעו בשן וגלעד כימי עולם
    kjvRefs:
    - Micah 7:14
    kjvOsis:
    - Mic.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.15
    scripture: tanakh
    name: Tanakh Micah 7:15
    ref: Micah 7:15
    book: Mic
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 14677
    text: ’As in the days of thy coming forth out of the land of Egypt Will I show unto him marvellous things.’
    translation: JPS 1917
    original: כִּימֵי צֵאתְךָ מֵאֶרֶץ מִצְרָיִם אַרְאֶנּוּ נִפְלָאוֹת׃
    hebrewPlain: כימי צאתך מארץ מצרים אראנו נפלאות
    kjvRefs:
    - Micah 7:15
    kjvOsis:
    - Mic.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.16
    scripture: tanakh
    name: Tanakh Micah 7:16
    ref: Micah 7:16
    book: Mic
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 14678
    text: The nations shall see and be put to shame for all their might; They shall lay their hand upon their mouth, Their ears shall be deaf.
    translation: JPS 1917
    original: יִרְאוּ גוֹיִם וְיֵבֹשׁוּ מִכֹּל גְּבוּרָתָם יָשִׂימוּ יָד עַל־פֶּה אָזְנֵיהֶם תֶּחֱרַשְׁנָה׃
    hebrewPlain: יראו גוים ויבשו מכל גבורתם ישימו יד על פה אזניהם תחרשנה
    kjvRefs:
    - Micah 7:16
    kjvOsis:
    - Mic.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.17
    scripture: tanakh
    name: Tanakh Micah 7:17
    ref: Micah 7:17
    book: Mic
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 14679
    text: They shall lick the dust like a serpent; Like crawling things of the earth they shall come trembling out of their close places; They shall come with fear unto the LORD our God, And shall be afraid because of Thee.
    translation: JPS 1917
    original: יְלַחֲכוּ עָפָר כַּנָּחָשׁ כְּזֹחֲלֵי אֶרֶץ יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם אֶל־יְהוָה אֱלֹהֵינוּ יִפְחָדוּ וְיִרְאוּ מִמֶּךָּ׃
    hebrewPlain: ילחכו עפר כנחש כזחלי ארץ ירגזו ממסגרתיהם אל יהוה אלהינו יפחדו ויראו ממך
    kjvRefs:
    - Micah 7:17
    kjvOsis:
    - Mic.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.18
    scripture: tanakh
    name: Tanakh Micah 7:18
    ref: Micah 7:18
    book: Mic
    section: neviim
    chapter: 7
    verse: 18
    ordinal: 14680
    text: Who is a God like unto Thee, that pardoneth the iniquity, And passeth by the transgression of the remnant of His heritage? He retaineth not His anger for ever, Because He delighteth in mercy. .
    translation: JPS 1917
    original: מִי־אֵל כָּמוֹךָ נֹשֵׂא עָוֺן וְעֹבֵר עַל־פֶּשַׁע לִשְׁאֵרִית נַחֲלָתוֹ לֹא־הֶחֱזִיק לָעַד אַפּוֹ כִּי־חָפֵץ חֶסֶד הוּא׃
    hebrewPlain: מי אל כמוך נשא עון ועבר על פשע לשארית נחלתו לא החזיק לעד אפו כי חפץ חסד הוא
    kjvRefs:
    - Micah 7:18
    kjvOsis:
    - Mic.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.19
    scripture: tanakh
    name: Tanakh Micah 7:19
    ref: Micah 7:19
    book: Mic
    section: neviim
    chapter: 7
    verse: 19
    ordinal: 14681
    text: He will again have compassion upon us; He will subdue our iniquities; And Thou wilt cast all their sins into the depths of the sea.
    translation: JPS 1917
    original: יָשׁוּב יְרַחֲמֵנוּ יִכְבֹּשׁ עֲוֺנֹתֵינוּ וְתַשְׁלִיךְ בִּמְצֻלוֹת יָם כָּל־חַטֹּאותָם׃
    hebrewPlain: ישוב ירחמנו יכבש עונתינו ותשליך במצלות ים כל חטאותם
    kjvRefs:
    - Micah 7:19
    kjvOsis:
    - Mic.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
- type: TanakhVerse
  data:
    osis: Mic.7.20
    scripture: tanakh
    name: Tanakh Micah 7:20
    ref: Micah 7:20
    book: Mic
    section: neviim
    chapter: 7
    verse: 20
    ordinal: 14682
    text: Thou wilt show faithfulness to Jacob, mercy to Abraham, As Thou hast sworn unto our fathers from the days of old.
    translation: JPS 1917
    original: תִּתֵּן אֱמֶת לְיַעֲקֹב חֶסֶד לְאַבְרָהָם אֲשֶׁר־נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ מִימֵי קֶדֶם׃
    hebrewPlain: תתן אמת ליעקב חסד לאברהם אשר נשבעת לאבתינו מימי קדם
    kjvRefs:
    - Micah 7:20
    kjvOsis:
    - Mic.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mic.7
