    scripture: tanakh
    name: Tanakh Haggai 1:12
    ref: Haggai 1:12
    book: Hag
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14850
    text: Then Zerubbabel the son of Shealtiel, and Joshua the son of Jehozadak, the high priest, with all the remnant of the people, hearkened unto the voice of the LORD their God, and unto the words of Haggai the prophet, as the LORD their God had sent him; and the people did fear before the LORD.
    translation: JPS 1917
    original: וַיִּשְׁמַע זְרֻבָּבֶל בֶּן־שַׁלְתִּיאֵל וִיהוֹשֻׁעַ בֶּן־יְהוֹצָדָק הַכֹּהֵן הַגָּדוֹל וְכֹל שְׁאֵרִית הָעָם בְּקוֹל יְהוָה אֱלֹהֵיהֶם וְעַל־דִּבְרֵי חַגַּי הַנָּבִיא כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה׃
    hebrewPlain: וישמע זרבבל בן שלתיאל ויהושע בן יהוצדק הכהן הגדול וכל שארית העם בקול יהוה אלהיהם ועל דברי חגי הנביא כאשר שלחו יהוה אלהיהם וייראו העם מפני יהוה
    kjvRefs:
    - Haggai 1:12
    kjvOsis:
    - Hag.1.12
