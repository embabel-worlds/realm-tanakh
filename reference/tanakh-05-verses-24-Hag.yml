    translation: JPS 1917
    original: עַל־כֵּן עֲלֵיכֶם כָּלְאוּ שָמַיִם מִטָּל וְהָאָרֶץ כָּלְאָה יְבוּלָהּ׃
    hebrewPlain: על כן עליכם כלאו שמים מטל והארץ כלאה יבולה
