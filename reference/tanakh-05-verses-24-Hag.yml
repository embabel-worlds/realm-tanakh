    text: Ye have sown much, and brought in little, Ye eat, but ye have not enough, Ye drink, but ye are not filled with drink, Ye clothe you, but there is none warm; And he that earneth wages earneth wages For a bag with holes.
    translation: JPS 1917
    original: זְרַעְתֶּם הַרְבֵּה וְהָבֵא מְעָט אָכוֹל וְאֵין־לְשָׂבְעָה שָׁתוֹ וְאֵין־לְשָׁכְרָה לָבוֹשׁ וְאֵין־לְחֹם לוֹ וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר אֶל־צְרוֹר נָקוּב׃
    hebrewPlain: זרעתם הרבה והבא מעט אכול ואין לשבעה שתו ואין לשכרה לבוש ואין לחם לו והמשתכר משתכר אל צרור נקוב
