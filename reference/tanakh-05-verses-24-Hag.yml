    chapter: 2
    verse: 3
    ordinal: 14856
    text: Who is left among you that saw this house in its former glory? and how do ye see it now? is not such a one as nothing in your eyes?
    translation: JPS 1917
    original: מִי בָכֶם הַנִּשְׁאָר אֲשֶׁר רָאָה אֶת־הַבַּיִת הַזֶּה בִּכְבוֹדוֹ הָרִאשׁוֹן וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה הֲלוֹא כָמֹהוּ כְּאַיִן בְּעֵינֵיכֶם׃
    hebrewPlain: מי בכם הנשאר אשר ראה את הבית הזה בכבודו הראשון ומה אתם ראים אתו עתה הלוא כמהו כאין בעיניכם
    kjvRefs:
    - Haggai 2:3
    kjvOsis:
    - Hag.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.4
    scripture: tanakh
    name: Tanakh Haggai 2:4
    ref: Haggai 2:4
    book: Hag
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14857
    text: Yet now be strong, O Zerubbabel, saith the LORD; and be strong, O Joshua, son of Jehozadak, the high priest; and be strong, all ye people of the land, saith the LORD, and work; for I am with you, saith the LORD of hosts.
    translation: JPS 1917
    original: וְעַתָּה חֲזַק זְרֻבָּבֶל נְאֻם־יְהוָה וַחֲזַק יְהוֹשֻׁעַ בֶּן־יְהוֹצָדָק הַכֹּהֵן הַגָּדוֹל וַחֲזַק כָּל־עַם הָאָרֶץ נְאֻם־יְהוָה וַעֲשׂוּ כִּי־אֲנִי אִתְּכֶם נְאֻם יְהוָה צְבָאוֹת׃
    hebrewPlain: ועתה חזק זרבבל נאם יהוה וחזק יהושע בן יהוצדק הכהן הגדול וחזק כל עם הארץ נאם יהוה ועשו כי אני אתכם נאם יהוה צבאות
    kjvRefs:
    - Haggai 2:4
    kjvOsis:
    - Hag.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.5
    scripture: tanakh
    name: Tanakh Haggai 2:5
    ref: Haggai 2:5
    book: Hag
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14858
    text: The word that I covenanted with you when ye came out of Egypt have I established, and My spirit abideth among you; fear ye not.
    translation: JPS 1917
    original: אֶת־הַדָּבָר אֲשֶׁר־כָּרַתִּי אִתְּכֶם בְּצֵאתְכֶם מִמִּצְרַיִם וְרוּחִי עֹמֶדֶת בְּתוֹכְכֶם אַל־תִּירָאוּ׃
    hebrewPlain: את הדבר אשר כרתי אתכם בצאתכם ממצרים ורוחי עמדת בתוככם אל תיראו
    kjvRefs:
    - Haggai 2:5
    kjvOsis:
    - Hag.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.6
    scripture: tanakh
    name: Tanakh Haggai 2:6
    ref: Haggai 2:6
    book: Hag
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14859
    text: 'For thus saith the LORD of hosts: Yet once, it is a little while, and I will shake the heavens, and the earth, and the sea, and the dry land;'
    translation: JPS 1917
    original: כִּי כֹה אָמַר יְהוָה צְבָאוֹת עוֹד אַחַת מְעַט הִיא וַאֲנִי מַרְעִישׁ אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ וְאֶת־הַיָּם וְאֶת־הֶחָרָבָה׃
    hebrewPlain: כי כה אמר יהוה צבאות עוד אחת מעט היא ואני מרעיש את השמים ואת הארץ ואת הים ואת החרבה
    kjvRefs:
    - Haggai 2:6
    kjvOsis:
    - Hag.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.7
    scripture: tanakh
    name: Tanakh Haggai 2:7
    ref: Haggai 2:7
    book: Hag
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14860
    text: and I will shake all nations, and the choicest things of all nations shall come, and I will fill this house with glory, saith the LORD of hosts.
    translation: JPS 1917
    original: וְהִרְעַשְׁתִּי אֶת־כָּל־הַגּוֹיִם וּבָאוּ חֶמְדַּת כָּל־הַגּוֹיִם וּמִלֵּאתִי אֶת־הַבַּיִת הַזֶּה כָּבוֹד אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: והרעשתי את כל הגוים ובאו חמדת כל הגוים ומלאתי את הבית הזה כבוד אמר יהוה צבאות
    kjvRefs:
    - Haggai 2:7
    kjvOsis:
    - Hag.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.8
    scripture: tanakh
    name: Tanakh Haggai 2:8
    ref: Haggai 2:8
    book: Hag
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14861
    text: Mine is the silver, and Mine the gold, saith the LORD of hosts.
    translation: JPS 1917
    original: לִי הַכֶּסֶף וְלִי הַזָּהָב נְאֻם יְהוָה צְבָאוֹת׃
    hebrewPlain: לי הכסף ולי הזהב נאם יהוה צבאות
    kjvRefs:
    - Haggai 2:8
    kjvOsis:
    - Hag.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.9
    scripture: tanakh
    name: Tanakh Haggai 2:9
    ref: Haggai 2:9
    book: Hag
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14862
    text: The glory of this latter house shall be greater than that of the former, saith the LORD of hosts; and in this place will I give peace, saith the LORD of hosts.’
    translation: JPS 1917
    original: גָּדוֹל יִהְיֶה כְּבוֹד הַבַּיִת הַזֶּה הָאַחֲרוֹן מִן־הָרִאשׁוֹן אָמַר יְהוָה צְבָאוֹת וּבַמָּקוֹם הַזֶּה אֶתֵּן שָׁלוֹם נְאֻם יְהוָה צְבָאוֹת׃
    hebrewPlain: גדול יהיה כבוד הבית הזה האחרון מן הראשון אמר יהוה צבאות ובמקום הזה אתן שלום נאם יהוה צבאות
    kjvRefs:
    - Haggai 2:9
    kjvOsis:
    - Hag.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.10
    scripture: tanakh
    name: Tanakh Haggai 2:10
    ref: Haggai 2:10
    book: Hag
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14863
    text: 'In the four and twentieth day of the ninth month, in the second year of Darius, came the word of the LORD by Haggai the prophet, saying:'
    translation: JPS 1917
    original: בְּעֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הָיָה דְּבַר־יְהוָה אֶל־חַגַּי הַנָּבִיא לֵאמֹר׃
    hebrewPlain: בעשרים וארבעה לתשיעי בשנת שתים לדריוש היה דבר יהוה אל חגי הנביא לאמר
    kjvRefs:
    - Haggai 2:10
    kjvOsis:
    - Hag.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.11
    scripture: tanakh
    name: Tanakh Haggai 2:11
    ref: Haggai 2:11
    book: Hag
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14864
    text: '’Thus saith the LORD of hosts: Ask now the priests for instruction, saying:'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה צְבָאוֹת שְׁאַל־נָא אֶת־הַכֹּהֲנִים תּוֹרָה לֵאמֹר׃
    hebrewPlain: כה אמר יהוה צבאות שאל נא את הכהנים תורה לאמר
    kjvRefs:
    - Haggai 2:11
    kjvOsis:
    - Hag.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.12
    scripture: tanakh
    name: Tanakh Haggai 2:12
    ref: Haggai 2:12
    book: Hag
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14865
    text: 'If one bear hallowed flesh in the skirt of his garment, and with his skirt do touch bread, or pottage, or wine, or oil, or any food, shall it be holy?’ And the priests answered and said: ‘No.’'
    translation: JPS 1917
    original: הֵן יִשָּׂא־אִישׁ בְּשַׂר־קֹדֶשׁ בִּכְנַף בִּגְדוֹ וְנָגַע בִּכְנָפוֹ אֶל־הַלֶּחֶם וְאֶל־הַנָּזִיד וְאֶל־הַיַּיִן וְאֶל־שֶׁמֶן וְאֶל־כָּל־מַאֲכָל הֲיִקְדָּשׁ וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא׃
    hebrewPlain: הן ישא איש בשר קדש בכנף בגדו ונגע בכנפו אל הלחם ואל הנזיד ואל היין ואל שמן ואל כל מאכל היקדש ויענו הכהנים ויאמרו לא
    kjvRefs:
    - Haggai 2:12
    kjvOsis:
    - Hag.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.13
    scripture: tanakh
    name: Tanakh Haggai 2:13
    ref: Haggai 2:13
    book: Hag
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14866
    text: 'Then said Haggai: ‘If one that is unclean by a dead body touch any of these, shall it be unclean?’ And the priests answered and said: ‘It shall be unclean.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חַגַּי אִם־יִגַּע טְמֵא־נֶפֶשׁ בְּכָל־אֵלֶּה הֲיִטְמָא וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ יִטְמָא׃
    hebrewPlain: ויאמר חגי אם יגע טמא נפש בכל אלה היטמא ויענו הכהנים ויאמרו יטמא
    kjvRefs:
    - Haggai 2:13
    kjvOsis:
    - Hag.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.14
    scripture: tanakh
    name: Tanakh Haggai 2:14
    ref: Haggai 2:14
    book: Hag
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14867
    text: 'Then answered Haggai, and said: ‘So is this people, and so is this nation before me, saith the LORD; and so is every work of their hands; and that which they offer there is unclean.'
    translation: JPS 1917
    original: וַיַּעַן חַגַּי וַיֹּאמֶר כֵּן הָעָם־הַזֶּה וְכֵן־הַגּוֹי הַזֶּה לְפָנַי נְאֻם־יְהוָה וְכֵן כָּל־מַעֲשֵׂה יְדֵיהֶם וַאֲשֶׁר יַקְרִיבוּ שָׁם טָמֵא הוּא׃
    hebrewPlain: ויען חגי ויאמר כן העם הזה וכן הגוי הזה לפני נאם יהוה וכן כל מעשה ידיהם ואשר יקריבו שם טמא הוא
    kjvRefs:
    - Haggai 2:14
    kjvOsis:
    - Hag.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.15
    scripture: tanakh
    name: Tanakh Haggai 2:15
    ref: Haggai 2:15
    book: Hag
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 14868
    text: And now, I pray you, consider from this day and forward—before a stone was laid upon a stone in the temple of the LORD,
    translation: JPS 1917
    original: וְעַתָּה שִׂימוּ־נָא לְבַבְכֶם מִן־הַיּוֹם הַזֶּה וָמָעְלָה מִטֶּרֶם שׂוּם־אֶבֶן אֶל־אֶבֶן בְּהֵיכַל יְהוָה׃
    hebrewPlain: ועתה שימו נא לבבכם מן היום הזה ומעלה מטרם שום אבן אל אבן בהיכל יהוה
    kjvRefs:
    - Haggai 2:15
    kjvOsis:
    - Hag.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.16
    scripture: tanakh
    name: Tanakh Haggai 2:16
    ref: Haggai 2:16
    book: Hag
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 14869
    text: through all that time, when one came to a heap of twenty measures, there were but ten; when one came to the winevat to draw out fifty press-measures, there were but twenty;
    translation: JPS 1917
    original: מִהְיוֹתָם בָּא אֶל־עֲרֵמַת עֶשְׂרִים וְהָיְתָה עֲשָׂרָה בָּא אֶל־הַיֶּקֶב לַחְשֹׂף חֲמִשִּׁים פּוּרָה וְהָיְתָה עֶשְׂרִים׃
    hebrewPlain: מהיותם בא אל ערמת עשרים והיתה עשרה בא אל היקב לחשף חמשים פורה והיתה עשרים
    kjvRefs:
    - Haggai 2:16
    kjvOsis:
    - Hag.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.17
    scripture: tanakh
    name: Tanakh Haggai 2:17
    ref: Haggai 2:17
    book: Hag
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 14870
    text: I smote you with blasting and with mildew and with hail in all the work of your hands; yet ye turned not to Me, saith the LORD—
    translation: JPS 1917
    original: הִכֵּיתִי אֶתְכֶם בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן וּבַבָּרָד אֵת כָּל־מַעֲשֵׂה יְדֵיכֶם וְאֵין־אֶתְכֶם אֵלַי נְאֻם־יְהוָה׃
    hebrewPlain: הכיתי אתכם בשדפון ובירקון ובברד את כל מעשה ידיכם ואין אתכם אלי נאם יהוה
    kjvRefs:
    - Haggai 2:17
    kjvOsis:
    - Hag.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.18
    scripture: tanakh
    name: Tanakh Haggai 2:18
    ref: Haggai 2:18
    book: Hag
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 14871
    text: consider, I pray you, from this day and forward, from the four and twentieth day of the ninth month, even from the day that the foundation of the LORD’S temple was laid, consider it;
    translation: JPS 1917
    original: שִׂימוּ־נָא לְבַבְכֶם מִן־הַיּוֹם הַזֶּה וָמָעְלָה מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי לְמִן־הַיּוֹם אֲשֶׁר־יֻסַּד הֵיכַל־יְהוָה שִׂימוּ לְבַבְכֶם׃
    hebrewPlain: שימו נא לבבכם מן היום הזה ומעלה מיום עשרים וארבעה לתשיעי למן היום אשר יסד היכל יהוה שימו לבבכם
    kjvRefs:
    - Haggai 2:18
    kjvOsis:
    - Hag.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.19
    scripture: tanakh
    name: Tanakh Haggai 2:19
    ref: Haggai 2:19
    book: Hag
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 14872
    text: is the seed yet in the barn? yea, the vine, and the fig-tree, and the pomegranate, and the olive-tree hath not brought forth—from this day will I bless you.’ .
    translation: JPS 1917
    original: הַעוֹד הַזֶּרַע בַּמְּגוּרָה וְעַד־הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת לֹא נָשָׂא מִן־הַיּוֹם הַזֶּה אֲבָרֵךְ׃
    hebrewPlain: העוד הזרע במגורה ועד הגפן והתאנה והרמון ועץ הזית לא נשא מן היום הזה אברך
    kjvRefs:
    - Haggai 2:19
    kjvOsis:
    - Hag.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hag.2
- type: TanakhVerse
  data:
    osis: Hag.2.20
    scripture: tanakh
    name: Tanakh Haggai 2:20
    ref: Haggai 2:20
    book: Hag
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 14873
    text: 'And the word of the LORD came the second time unto Haggai in the four and twentieth day of the month, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה שֵׁנִית אֶל־חַגַּי בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה שנית אל חגי בעשרים וארבעה לחדש לאמר
    kjvRefs:
    - Haggai 2:20
