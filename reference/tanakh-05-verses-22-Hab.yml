    scripture: tanakh
    name: Tanakh Habakkuk 1:4
    ref: Habakkuk 1:4
    book: Hab
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14733
    text: Therefore the law is slacked, And right doth never go forth; For the wicked doth beset the righteous; Therefore right goeth forth perverted.
    translation: JPS 1917
    original: עַל־כֵּן תָּפוּג תּוֹרָה וְלֹא־יֵצֵא לָנֶצַח מִשְׁפָּט כִּי רָשָׁע מַכְתִּיר אֶת־הַצַּדִּיק עַל־כֵּן יֵצֵא מִשְׁפָּט מְעֻקָּל׃
    hebrewPlain: על כן תפוג תורה ולא יצא לנצח משפט כי רשע מכתיר את הצדיק על כן יצא משפט מעקל
    kjvRefs:
    - Habakkuk 1:4
    kjvOsis:
    - Hab.1.4
