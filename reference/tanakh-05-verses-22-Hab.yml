- type: TanakhVerse
  data:
    osis: Hab.3.6
    scripture: tanakh
    name: Tanakh Habakkuk 3:6
    ref: Habakkuk 3:6
    book: Hab
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14772
    text: He standeth, and shaketh the earth, He beholdeth, and maketh the nations to tremble; And the everlasting mountains are dashed in pieces, The ancient hills do bow; His goings are as of old.
    translation: JPS 1917
    original: עָמַד וַיְמֹדֶד אֶרֶץ רָאָה וַיַּתֵּר גּוֹיִם וַיִּתְפֹּצְצוּ הַרְרֵי־עַד שַׁחוּ גִּבְעוֹת עוֹלָם הֲלִיכוֹת עוֹלָם לוֹ׃
    hebrewPlain: עמד וימדד ארץ ראה ויתר גוים ויתפצצו הררי עד שחו גבעות עולם הליכות עולם לו
    kjvRefs:
    - Habakkuk 3:6
    kjvOsis:
    - Hab.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.7
    scripture: tanakh
    name: Tanakh Habakkuk 3:7
    ref: Habakkuk 3:7
    book: Hab
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14773
    text: I see the tents of Cushan in affliction; The curtains of the land of Midian do tremble.
    translation: JPS 1917
    original: תַּחַת אָוֶן רָאִיתִי אָהֳלֵי כוּשָׁן יִרְגְּזוּן יְרִיעוֹת אֶרֶץ מִדְיָן׃
    hebrewPlain: תחת און ראיתי אהלי כושן ירגזון יריעות ארץ מדין
    kjvRefs:
    - Habakkuk 3:7
    kjvOsis:
    - Hab.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.8
    scripture: tanakh
    name: Tanakh Habakkuk 3:8
    ref: Habakkuk 3:8
    book: Hab
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14774
    text: Is it, O LORD, that against the rivers, is it that Thine anger is kindled against the rivers, or Thy wrath against the sea? That Thou dost ride upon Thy horses, upon Thy chariots of victory?
    translation: JPS 1917
    original: הֲבִנְהָרִים חָרָה יְהוָה אִם בַּנְּהָרִים אַפֶּךָ אִם־בַּיָּם עֶבְרָתֶךָ כִּי תִרְכַּב עַל־סוּסֶיךָ מַרְכְּבֹתֶיךָ יְשׁוּעָה׃
    hebrewPlain: הבנהרים חרה יהוה אם בנהרים אפך אם בים עברתך כי תרכב על סוסיך מרכבתיך ישועה
    kjvRefs:
    - Habakkuk 3:8
    kjvOsis:
    - Hab.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.9
    scripture: tanakh
    name: Tanakh Habakkuk 3:9
    ref: Habakkuk 3:9
    book: Hab
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14775
    text: Thy bow is made quite bare; Sworn are the rods of the word. Selah. Thou dost cleave the earth with rivers.
    translation: JPS 1917
    original: עֶרְיָה תֵעוֹר קַשְׁתֶּךָ שְׁבֻעוֹת מַטּוֹת אֹמֶר סֶלָה נְהָרוֹת תְּבַקַּע־אָרֶץ׃
    hebrewPlain: עריה תעור קשתך שבעות מטות אמר סלה נהרות תבקע ארץ
    kjvRefs:
    - Habakkuk 3:9
    kjvOsis:
    - Hab.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.10
    scripture: tanakh
    name: Tanakh Habakkuk 3:10
    ref: Habakkuk 3:10
    book: Hab
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14776
    text: The mountains have seen Thee, and they tremble; the tempest of waters floweth over; the deep uttereth its voice, And lifteth up its hands on high.
    translation: JPS 1917
    original: רָאוּךָ יָחִילוּ הָרִים זֶרֶם מַיִם עָבָר נָתַן תְּהוֹם קוֹלוֹ רוֹם יָדֵיהוּ נָשָׂא׃
    hebrewPlain: ראוך יחילו הרים זרם מים עבר נתן תהום קולו רום ידיהו נשא
    kjvRefs:
    - Habakkuk 3:10
    kjvOsis:
    - Hab.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.11
    scripture: tanakh
    name: Tanakh Habakkuk 3:11
    ref: Habakkuk 3:11
    book: Hab
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 14777
    text: The sun and moon stand still in their habitation; at the light of Thine arrows as they go, At the shining of Thy glittering spear.
    translation: JPS 1917
    original: שֶׁמֶשׁ יָרֵחַ עָמַד זְבֻלָה לְאוֹר חִצֶּיךָ יְהַלֵּכוּ לְנֹגַהּ בְּרַק חֲנִיתֶךָ׃
    hebrewPlain: שמש ירח עמד זבלה לאור חציך יהלכו לנגה ברק חניתך
    kjvRefs:
    - Habakkuk 3:11
    kjvOsis:
    - Hab.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.12
    scripture: tanakh
    name: Tanakh Habakkuk 3:12
    ref: Habakkuk 3:12
    book: Hab
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 14778
    text: Thou marchest through the earth in indignation, Thou threshest the nations in anger.
    translation: JPS 1917
    original: בְּזַעַם תִּצְעַד־אָרֶץ בְּאַף תָּדוּשׁ גּוֹיִם׃
    hebrewPlain: בזעם תצעד ארץ באף תדוש גוים
    kjvRefs:
    - Habakkuk 3:12
    kjvOsis:
    - Hab.3.12
  relations:
  - predicate: IN
    to:
