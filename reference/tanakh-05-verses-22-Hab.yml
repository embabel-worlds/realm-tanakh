- type: TanakhVerse
  data:
    osis: Hab.1.12
    scripture: tanakh
    name: Tanakh Habakkuk 1:12
    ref: Habakkuk 1:12
    book: Hab
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14741
    text: Art not Thou from everlasting, O LORD my God, my Holy One? We shall not die. O LORD, Thou hast ordained them for judgment, And Thou, O Rock, hast established them for correction. .
    translation: JPS 1917
    original: הֲלוֹא אַתָּה מִקֶּדֶם יְהוָה אֱלֹהַי קְדֹשִׁי לֹא נָמוּת יְהוָה לְמִשְׁפָּט שַׂמְתּוֹ וְצוּר לְהוֹכִיחַ יְסַדְתּוֹ׃
    hebrewPlain: הלוא אתה מקדם יהוה אלהי קדשי לא נמות יהוה למשפט שמתו וצור להוכיח יסדתו
    kjvRefs:
    - Habakkuk 1:12
    kjvOsis:
    - Hab.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.13
    scripture: tanakh
    name: Tanakh Habakkuk 1:13
    ref: Habakkuk 1:13
    book: Hab
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14742
    text: Thou that art of eyes too pure to behold evil, And that canst not look on mischief, Wherefore lookest Thou, when they deal treacherously, And holdest Thy peace, when the wicked swalloweth up The man that is more righteous than he;
    translation: JPS 1917
    original: טְהוֹר עֵינַיִם מֵרְאוֹת רָע וְהַבִּיט אֶל־עָמָל לֹא תוּכָל לָמָּה תַבִּיט בּוֹגְדִים תַּחֲרִישׁ בְּבַלַּע רָשָׁע צַדִּיק מִמֶּנּוּ׃
    hebrewPlain: טהור עינים מראות רע והביט אל עמל לא תוכל למה תביט בוגדים תחריש בבלע רשע צדיק ממנו
    kjvRefs:
    - Habakkuk 1:13
    kjvOsis:
    - Hab.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.14
    scripture: tanakh
    name: Tanakh Habakkuk 1:14
    ref: Habakkuk 1:14
    book: Hab
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14743
    text: And makest men as the fishes of the sea, As the creeping things, that have no ruler over them?
    translation: JPS 1917
    original: וַתַּעֲשֶׂה אָדָם כִּדְגֵי הַיָּם כְּרֶמֶשׂ לֹא־מֹשֵׁל בּוֹ׃
    hebrewPlain: ותעשה אדם כדגי הים כרמש לא משל בו
    kjvRefs:
    - Habakkuk 1:14
    kjvOsis:
    - Hab.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.15
    scripture: tanakh
    name: Tanakh Habakkuk 1:15
    ref: Habakkuk 1:15
    book: Hab
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14744
    text: They take up all of them with the angle, They catch them in their net, And gather them in their drag; Therefore they rejoice and exult.
    translation: JPS 1917
    original: כֻּלֹּה בְּחַכָּה הֵעֲלָה יְגֹרֵהוּ בְחֶרְמוֹ וְיַאַסְפֵהוּ בְּמִכְמַרְתּוֹ עַל־כֵּן יִשְׂמַח וְיָגִיל׃
    hebrewPlain: כלה בחכה העלה יגרהו בחרמו ויאספהו במכמרתו על כן ישמח ויגיל
    kjvRefs:
    - Habakkuk 1:15
    kjvOsis:
    - Hab.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.16
    scripture: tanakh
    name: Tanakh Habakkuk 1:16
    ref: Habakkuk 1:16
    book: Hab
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 14745
    text: Therefore they sacrifice unto their net, And offer unto their drag; Because by them their portion is fat, And their food plenteous.
    translation: JPS 1917
    original: עַל־כֵּן יְזַבֵּחַ לְחֶרְמוֹ וִיקַטֵּר לְמִכְמַרְתּוֹ כִּי בָהֵמָּה שָׁמֵן חֶלְקוֹ וּמַאֲכָלוֹ בְּרִאָה׃
    hebrewPlain: על כן יזבח לחרמו ויקטר למכמרתו כי בהמה שמן חלקו ומאכלו בראה
    kjvRefs:
    - Habakkuk 1:16
    kjvOsis:
    - Hab.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.17
    scripture: tanakh
    name: Tanakh Habakkuk 1:17
    ref: Habakkuk 1:17
    book: Hab
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 14746
    text: Shall they therefore empty their net, And not spare to slay the nations continually?
    translation: JPS 1917
    original: הַעַל כֵּן יָרִיק חֶרְמוֹ וְתָמִיד לַהֲרֹג גּוֹיִם לֹא יַחְמוֹל׃
    hebrewPlain: העל כן יריק חרמו ותמיד להרג גוים לא יחמול
    kjvRefs:
    - Habakkuk 1:17
    kjvOsis:
    - Hab.1.17
  relations:
  - predicate: IN
    to:
