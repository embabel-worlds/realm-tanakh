    name: Tanakh Habakkuk 1:3
    ref: Habakkuk 1:3
    book: Hab
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14732
    text: Why dost Thou show me iniquity, And beholdest mischief? And why are spoiling and violence before me? So that there is strife, and contention ariseth.
    translation: JPS 1917
    original: לָמָּה תַרְאֵנִי אָוֶן וְעָמָל תַּבִּיט וְשֹׁד וְחָמָס לְנֶגְדִּי וַיְהִי רִיב וּמָדוֹן יִשָּׂא׃
    hebrewPlain: למה תראני און ועמל תביט ושד וחמס לנגדי ויהי ריב ומדון ישא
    kjvRefs:
