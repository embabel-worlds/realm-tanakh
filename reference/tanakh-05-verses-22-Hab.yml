- type: TanakhVerse
  data:
    osis: Hab.3.4
    scripture: tanakh
    name: Tanakh Habakkuk 3:4
    ref: Habakkuk 3:4
    book: Hab
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14770
    text: And a brightness appeareth as the light; rays hath He at His side; and there is the hiding of His power.
    translation: JPS 1917
    original: וְנֹגַהּ כָּאוֹר תִּהְיֶה קַרְנַיִם מִיָּדוֹ לוֹ וְשָׁם חֶבְיוֹן עֻזֹּה׃
    hebrewPlain: ונגה כאור תהיה קרנים מידו לו ושם חביון עזה
    kjvRefs:
    - Habakkuk 3:4
