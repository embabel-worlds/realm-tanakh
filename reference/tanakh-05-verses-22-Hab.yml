- type: TanakhVerse
  data:
    osis: Hab.2.1
    scripture: tanakh
    name: Tanakh Habakkuk 2:1
    ref: Habakkuk 2:1
    book: Hab
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14747
    text: I will stand upon my watch, And set me upon the tower, And will look out to see what He will speak by me, And what I shall answer when I am reproved.
    translation: JPS 1917
    original: עַל־מִשְׁמַרְתִּי אֶעֱמֹדָה וְאֶתְיַצְּבָה עַל־מָצוֹר וַאֲצַפֶּה לִרְאוֹת מַה־יְדַבֶּר־בִּי וּמָה אָשִׁיב עַל־תּוֹכַחְתִּי׃
    hebrewPlain: על משמרתי אעמדה ואתיצבה על מצור ואצפה לראות מה ידבר בי ומה אשיב על תוכחתי
    kjvRefs:
    - Habakkuk 2:1
    kjvOsis:
    - Hab.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.2
    scripture: tanakh
    name: Tanakh Habakkuk 2:2
    ref: Habakkuk 2:2
    book: Hab
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14748
    text: 'And the LORD answered me, and said: ‘Write the vision, and make it plain upon tables, That a man may read it swiftly.'
    translation: JPS 1917
    original: וַיַּעֲנֵנִי יְהוָה וַיֹּאמֶר כְּתוֹב חָזוֹן וּבָאֵר עַל־הַלֻּחוֹת לְמַעַן יָרוּץ קוֹרֵא בוֹ׃
    hebrewPlain: ויענני יהוה ויאמר כתוב חזון ובאר על הלחות למען ירוץ קורא בו
    kjvRefs:
    - Habakkuk 2:2
    kjvOsis:
    - Hab.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.3
    scripture: tanakh
    name: Tanakh Habakkuk 2:3
    ref: Habakkuk 2:3
    book: Hab
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14749
    text: For the vision is yet for the appointed time, And it declareth of the end, and doth not lie; Though it tarry, wait for it; Because it will surely come, it will not delay.’
    translation: JPS 1917
    original: כִּי עוֹד חָזוֹן לַמּוֹעֵד וְיָפֵחַ לַקֵּץ וְלֹא יְכַזֵּב אִם־יִתְמַהְמָהּ חַכֵּה־לוֹ כִּי־בֹא יָבֹא לֹא יְאַחֵר׃
    hebrewPlain: כי עוד חזון למועד ויפח לקץ ולא יכזב אם יתמהמה חכה לו כי בא יבא לא יאחר
    kjvRefs:
    - Habakkuk 2:3
    kjvOsis:
    - Hab.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.4
    scripture: tanakh
    name: Tanakh Habakkuk 2:4
    ref: Habakkuk 2:4
    book: Hab
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14750
    text: Behold, his soul is puffed up, it is not upright in him; But the righteous shall live by his faith.
    translation: JPS 1917
    original: הִנֵּה עֻפְּלָה לֹא־יָשְׁרָה נַפְשׁוֹ בּוֹ וְצַדִּיק בֶּאֱמוּנָתוֹ יִחְיֶה׃
    hebrewPlain: הנה עפלה לא ישרה נפשו בו וצדיק באמונתו יחיה
    kjvRefs:
    - Habakkuk 2:4
    kjvOsis:
    - Hab.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.5
    scripture: tanakh
    name: Tanakh Habakkuk 2:5
    ref: Habakkuk 2:5
    book: Hab
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14751
    text: Yea, moreover, wine is a treacherous dealer; The haughty man abideth not; He who enlargeth his desire as the nether-world, And is as death, and cannot be satisfied, But gathereth unto him all nations, And heapeth unto him all peoples.
    translation: JPS 1917
    original: וְאַף כִּי־הַיַּיִן בּוֹגֵד גֶּבֶר יָהִיר וְלֹא יִנְוֶה אֲשֶׁר הִרְחִיב כִּשְׁאוֹל נַפְשׁוֹ וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע וַיֶּאֱסֹף אֵלָיו כָּל־הַגּוֹיִם וַיִּקְבֹּץ אֵלָיו כָּל־הָעַמִּים׃
    hebrewPlain: ואף כי היין בוגד גבר יהיר ולא ינוה אשר הרחיב כשאול נפשו והוא כמות ולא ישבע ויאסף אליו כל הגוים ויקבץ אליו כל העמים
    kjvRefs:
    - Habakkuk 2:5
    kjvOsis:
    - Hab.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.6
    scripture: tanakh
    name: Tanakh Habakkuk 2:6
    ref: Habakkuk 2:6
    book: Hab
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14752
    text: 'Shall not all these take up a parable against him, And a taunting riddle against him, And say: ‘Woe to him that increaseth that which is not his! How long? and that ladeth himself with many pledges! ’'
    translation: JPS 1917
    original: הֲלוֹא־אֵלֶּה כֻלָּם עָלָיו מָשָׁל יִשָּׂאוּ וּמְלִיצָה חִידוֹת לוֹ וְיֹאמַר הוֹי הַמַּרְבֶּה לֹּא־לוֹ עַד־מָתַי וּמַכְבִּיד עָלָיו עַבְטִיט׃
    hebrewPlain: הלוא אלה כלם עליו משל ישאו ומליצה חידות לו ויאמר הוי המרבה לא לו עד מתי ומכביד עליו עבטיט
    kjvRefs:
    - Habakkuk 2:6
    kjvOsis:
    - Hab.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.7
    scripture: tanakh
    name: Tanakh Habakkuk 2:7
    ref: Habakkuk 2:7
    book: Hab
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14753
    text: Shall they not rise up suddenly that shall exact interest of thee, And awake that shall violently shake thee, And thou shalt be for booties unto them?
    translation: JPS 1917
    original: הֲלוֹא פֶתַע יָקוּמוּ נֹשְׁכֶיךָ וְיִקְצוּ מְזַעְזְעֶיךָ וְהָיִיתָ לִמְשִׁסּוֹת לָמוֹ׃
    hebrewPlain: הלוא פתע יקומו נשכיך ויקצו מזעזעיך והיית למשסות למו
    kjvRefs:
    - Habakkuk 2:7
    kjvOsis:
    - Hab.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.8
    scripture: tanakh
    name: Tanakh Habakkuk 2:8
    ref: Habakkuk 2:8
    book: Hab
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14754
    text: Because thou hast spoiled many nations, All the remnant of the peoples shall spoil thee; Because of men’s blood, and for the violence done to the land, To the city and to all that dwell therein.
    translation: JPS 1917
    original: כִּי אַתָּה שַׁלּוֹתָ גּוֹיִם רַבִּים יְשָׁלּוּךָ כָּל־יֶתֶר עַמִּים מִדְּמֵי אָדָם וַחֲמַס־אֶרֶץ קִרְיָה וְכָל־יֹשְׁבֵי בָהּ׃
    hebrewPlain: כי אתה שלות גוים רבים ישלוך כל יתר עמים מדמי אדם וחמס ארץ קריה וכל ישבי בה
    kjvRefs:
    - Habakkuk 2:8
    kjvOsis:
    - Hab.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.9
    scripture: tanakh
    name: Tanakh Habakkuk 2:9
    ref: Habakkuk 2:9
    book: Hab
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14755
    text: Woe to him that gaineth evil gains for his house, That he may set his nest on high, That he may be delivered from the power of evil!
    translation: JPS 1917
    original: הוֹי בֹּצֵעַ בֶּצַע רָע לְבֵיתוֹ לָשׂוּם בַּמָּרוֹם קִנּוֹ לְהִנָּצֵל מִכַּף־רָע׃
    hebrewPlain: הוי בצע בצע רע לביתו לשום במרום קנו להנצל מכף רע
    kjvRefs:
    - Habakkuk 2:9
    kjvOsis:
    - Hab.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.10
    scripture: tanakh
    name: Tanakh Habakkuk 2:10
    ref: Habakkuk 2:10
    book: Hab
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14756
    text: Thou hast devised shame to thy house, By cutting off many peoples, And hast forfeited thy life.
    translation: JPS 1917
    original: יָעַצְתָּ בֹּשֶׁת לְבֵיתֶךָ קְצוֹת־עַמִּים רַבִּים וְחוֹטֵא נַפְשֶׁךָ׃
    hebrewPlain: יעצת בשת לביתך קצות עמים רבים וחוטא נפשך
    kjvRefs:
    - Habakkuk 2:10
    kjvOsis:
    - Hab.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.11
    scripture: tanakh
    name: Tanakh Habakkuk 2:11
    ref: Habakkuk 2:11
    book: Hab
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14757
    text: For the stone shall cry out of the wall, And the beam out of the timber shall answer it.
    translation: JPS 1917
    original: כִּי־אֶבֶן מִקִּיר תִּזְעָק וְכָפִיס מֵעֵץ יַעֲנֶנָּה׃
    hebrewPlain: כי אבן מקיר תזעק וכפיס מעץ יעננה
    kjvRefs:
    - Habakkuk 2:11
    kjvOsis:
    - Hab.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.12
    scripture: tanakh
    name: Tanakh Habakkuk 2:12
    ref: Habakkuk 2:12
    book: Hab
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14758
    text: Woe to him that buildeth a town with blood, And establisheth a city by iniquity!
    translation: JPS 1917
    original: הוֹי בֹּנֶה עִיר בְּדָמִים וְכוֹנֵן קִרְיָה בְּעַוְלָה׃
    hebrewPlain: הוי בנה עיר בדמים וכונן קריה בעולה
    kjvRefs:
    - Habakkuk 2:12
    kjvOsis:
    - Hab.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.13
    scripture: tanakh
    name: Tanakh Habakkuk 2:13
    ref: Habakkuk 2:13
    book: Hab
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14759
    text: Behold, is it not of the LORD of hosts That the peoples labour for the fire, And the nations weary themselves for vanity?
    translation: JPS 1917
    original: הֲלוֹא הִנֵּה מֵאֵת יְהוָה צְבָאוֹת וְיִיגְעוּ עַמִּים בְּדֵי־אֵשׁ וּלְאֻמִּים בְּדֵי־רִיק יִעָפוּ׃
    hebrewPlain: הלוא הנה מאת יהוה צבאות וייגעו עמים בדי אש ולאמים בדי ריק יעפו
    kjvRefs:
    - Habakkuk 2:13
    kjvOsis:
    - Hab.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.14
    scripture: tanakh
    name: Tanakh Habakkuk 2:14
    ref: Habakkuk 2:14
    book: Hab
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14760
    text: For the earth shall be filled With the knowledge of the glory of the LORD, As the waters cover the sea.
    translation: JPS 1917
    original: כִּי תִּמָּלֵא הָאָרֶץ לָדַעַת אֶת־כְּבוֹד יְהוָה כַּמַּיִם יְכַסּוּ עַל־יָם׃
    hebrewPlain: כי תמלא הארץ לדעת את כבוד יהוה כמים יכסו על ים
    kjvRefs:
    - Habakkuk 2:14
    kjvOsis:
    - Hab.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.15
    scripture: tanakh
    name: Tanakh Habakkuk 2:15
    ref: Habakkuk 2:15
    book: Hab
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 14761
    text: Woe unto him that giveth his neighbour drink, That puttest thy venom thereto, and makest him drunken also, That thou mayest look on their nakedness!
    translation: JPS 1917
    original: הוֹי מַשְׁקֵה רֵעֵהוּ מְסַפֵּחַ חֲמָתְךָ וְאַף שַׁכֵּר לְמַעַן הַבִּיט עַל־מְעוֹרֵיהֶם׃
    hebrewPlain: הוי משקה רעהו מספח חמתך ואף שכר למען הביט על מעוריהם
    kjvRefs:
    - Habakkuk 2:15
    kjvOsis:
    - Hab.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.16
    scripture: tanakh
    name: Tanakh Habakkuk 2:16
    ref: Habakkuk 2:16
    book: Hab
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 14762
    text: Thou art filled with shame instead of glory, Drink thou also, and be uncovered; The cup of the LORD’S right hand shall be turned unto thee, And filthiness shall be upon thy glory.
    translation: JPS 1917
    original: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד שְׁתֵה גַם־אַתָּה וְהֵעָרֵל תִּסּוֹב עָלֶיךָ כּוֹס יְמִין יְהוָה וְקִיקָלוֹן עַל־כְּבוֹדֶךָ׃
    hebrewPlain: שבעת קלון מכבוד שתה גם אתה והערל תסוב עליך כוס ימין יהוה וקיקלון על כבודך
    kjvRefs:
    - Habakkuk 2:16
    kjvOsis:
    - Hab.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.17
    scripture: tanakh
    name: Tanakh Habakkuk 2:17
    ref: Habakkuk 2:17
    book: Hab
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 14763
    text: For the violence done to Lebanon shall cover thee, And the destruction of the beasts, which made them afraid; Because of men’s blood, and for the violence done to the land, To the city and to all that dwell therein.
    translation: JPS 1917
    original: כִּי חֲמַס לְבָנוֹן יְכַסֶּךָּ וְשֹׁד בְּהֵמוֹת יְחִיתַן מִדְּמֵי אָדָם וַחֲמַס־אֶרֶץ קִרְיָה וְכָל־יֹשְׁבֵי בָהּ׃
    hebrewPlain: כי חמס לבנון יכסך ושד בהמות יחיתן מדמי אדם וחמס ארץ קריה וכל ישבי בה
    kjvRefs:
    - Habakkuk 2:17
    kjvOsis:
    - Hab.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.18
    scripture: tanakh
    name: Tanakh Habakkuk 2:18
    ref: Habakkuk 2:18
    book: Hab
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 14764
    text: What profiteth the graven image, That the maker thereof hath graven it, Even the molten image, and the teacher of lies; That the maker of his work trusteth therein, To make dumb idols?
    translation: JPS 1917
    original: מָה־הוֹעִיל פֶּסֶל כִּי פְסָלוֹ יֹצְרוֹ מַסֵּכָה וּמוֹרֶה שָּׁקֶר כִּי בָטַח יֹצֵר יִצְרוֹ עָלָיו לַעֲשׂוֹת אֱלִילִים אִלְּמִים׃
    hebrewPlain: מה הועיל פסל כי פסלו יצרו מסכה ומורה שקר כי בטח יצר יצרו עליו לעשות אלילים אלמים
    kjvRefs:
    - Habakkuk 2:18
    kjvOsis:
    - Hab.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.19
    scripture: tanakh
    name: Tanakh Habakkuk 2:19
    ref: Habakkuk 2:19
    book: Hab
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 14765
    text: 'Woe unto him that saith to the wood: ‘Awake’, To the dumb stone: ‘Arise! ’ Can this teach? Behold, it is overlaid with gold and silver, And there is no breath at all in the midst of it.'
    translation: JPS 1917
    original: הוֹי אֹמֵר לָעֵץ הָקִיצָה עוּרִי לְאֶבֶן דּוּמָם הוּא יוֹרֶה הִנֵּה־הוּא תָּפוּשׂ זָהָב וָכֶסֶף וְכָל־רוּחַ אֵין בְּקִרְבּוֹ׃
    hebrewPlain: הוי אמר לעץ הקיצה עורי לאבן דומם הוא יורה הנה הוא תפוש זהב וכסף וכל רוח אין בקרבו
    kjvRefs:
    - Habakkuk 2:19
    kjvOsis:
    - Hab.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.2.20
    scripture: tanakh
    name: Tanakh Habakkuk 2:20
    ref: Habakkuk 2:20
    book: Hab
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 14766
    text: But the LORD is in His holy temple; Let all the earth keep silence before Him.
    translation: JPS 1917
    original: וַיהוָה בְּהֵיכַל קָדְשׁוֹ הַס מִפָּנָיו כָּל־הָאָרֶץ׃
    hebrewPlain: ויהוה בהיכל קדשו הס מפניו כל הארץ
    kjvRefs:
    - Habakkuk 2:20
    kjvOsis:
    - Hab.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.2
- type: TanakhVerse
  data:
    osis: Hab.3.1
    scripture: tanakh
    name: Tanakh Habakkuk 3:1
    ref: Habakkuk 3:1
    book: Hab
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14767
    text: A prayer of Habakkuk the prophet. Upon Shigionoth.
    translation: JPS 1917
    original: תְּפִלָּה לַחֲבַקּוּק הַנָּבִיא עַל שִׁגְיֹנוֹת׃
    hebrewPlain: תפלה לחבקוק הנביא על שגינות
    kjvRefs:
    - Habakkuk 3:1
    kjvOsis:
    - Hab.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.2
    scripture: tanakh
    name: Tanakh Habakkuk 3:2
    ref: Habakkuk 3:2
    book: Hab
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14768
    text: O LORD, I have heard the report of Thee, and am afraid; O LORD, revive Thy work in the midst of the years, in the midst of the years make it known; In wrath remember compassion.
    translation: JPS 1917
    original: יְהוָה שָׁמַעְתִּי שִׁמְעֲךָ יָרֵאתִי יְהוָה פָּעָלְךָ בְּקֶרֶב שָׁנִים חַיֵּיהוּ בְּקֶרֶב שָׁנִים תּוֹדִיעַ בְּרֹגֶז רַחֵם תִּזְכּוֹר׃
    hebrewPlain: יהוה שמעתי שמעך יראתי יהוה פעלך בקרב שנים חייהו בקרב שנים תודיע ברגז רחם תזכור
    kjvRefs:
    - Habakkuk 3:2
    kjvOsis:
    - Hab.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.3
    scripture: tanakh
    name: Tanakh Habakkuk 3:3
    ref: Habakkuk 3:3
    book: Hab
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14769
    text: God cometh from Teman, And the Holy One from mount Paran. Selah His glory covereth the heavens, And the earth is full of His praise.
    translation: JPS 1917
    original: אֱלוֹהַ מִתֵּימָן יָבוֹא וְקָדוֹשׁ מֵהַר־פָּארָן סֶלָה כִּסָּה שָׁמַיִם הוֹדוֹ וּתְהִלָּתוֹ מָלְאָה הָאָרֶץ׃
    hebrewPlain: אלוה מתימן יבוא וקדוש מהר פארן סלה כסה שמים הודו ותהלתו מלאה הארץ
    kjvRefs:
    - Habakkuk 3:3
    kjvOsis:
    - Hab.3.3
  relations:
