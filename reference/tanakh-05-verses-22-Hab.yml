      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.13
    scripture: tanakh
    name: Tanakh Habakkuk 3:13
    ref: Habakkuk 3:13
    book: Hab
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 14779
    text: Thou art come forth for the deliverance of Thy people, for the deliverance of Thine anointed; Thou woundest the head out of the house of the wicked, uncovering the foundation even unto the neck. Selah
    translation: JPS 1917
    original: יָצָאתָ לְיֵשַׁע עַמֶּךָ לְיֵשַׁע אֶת־מְשִׁיחֶךָ מָחַצְתָּ רֹּאשׁ מִבֵּית רָשָׁע עָרוֹת יְסוֹד עַד־צַוָּאר סֶלָה׃
    hebrewPlain: יצאת לישע עמך לישע את משיחך מחצת ראש מבית רשע ערות יסוד עד צואר סלה
    kjvRefs:
    - Habakkuk 3:13
    kjvOsis:
    - Hab.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.14
    scripture: tanakh
    name: Tanakh Habakkuk 3:14
    ref: Habakkuk 3:14
    book: Hab
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 14780
    text: Thou hast stricken through with his own rods the head of his rulers, that come as a whirlwind to scatter me; whose rejoicing is as to devour the poor secretly.
    translation: JPS 1917
    original: נָקַבְתָּ בְמַטָּיו רֹאשׁ פרזו [פְּרָזָיו] יִסְעֲרוּ לַהֲפִיצֵנִי עֲלִיצֻתָם כְּמוֹ־לֶאֱכֹל עָנִי בַּמִּסְתָּר׃
    hebrewPlain: נקבת במטיו ראש פרזו [פרזיו] יסערו להפיצני עליצתם כמו לאכל עני במסתר
    kjvRefs:
    - Habakkuk 3:14
    kjvOsis:
    - Hab.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.15
    scripture: tanakh
    name: Tanakh Habakkuk 3:15
    ref: Habakkuk 3:15
    book: Hab
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 14781
    text: Thou hast trodden the sea with Thy horses, the foaming of mighty waters.
    translation: JPS 1917
    original: דָּרַכְתָּ בַיָּם סוּסֶיךָ חֹמֶר מַיִם רַבִּים׃
    hebrewPlain: דרכת בים סוסיך חמר מים רבים
    kjvRefs:
    - Habakkuk 3:15
    kjvOsis:
    - Hab.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.16
    scripture: tanakh
    name: Tanakh Habakkuk 3:16
    ref: Habakkuk 3:16
    book: Hab
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 14782
    text: When I heard, mine inward parts trembled, My lips quivered at the voice; Rottenness entereth into my bones, And I tremble where I stand; that I should wait for the day of trouble, when he cometh up against the people that he invadeth.
    translation: JPS 1917
    original: שָׁמַעְתִּי וַתִּרְגַּז בִּטְנִי לְקוֹל צָלֲלוּ שְׂפָתַי יָבוֹא רָקָב בַּעֲצָמַי וְתַחְתַּי אֶרְגָּז אֲשֶׁר אָנוּחַ לְיוֹם צָרָה לַעֲלוֹת לְעַם יְגוּדֶנּוּ׃
    hebrewPlain: שמעתי ותרגז בטני לקול צללו שפתי יבוא רקב בעצמי ותחתי ארגז אשר אנוח ליום צרה לעלות לעם יגודנו
    kjvRefs:
    - Habakkuk 3:16
    kjvOsis:
    - Hab.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.17
    scripture: tanakh
    name: Tanakh Habakkuk 3:17
    ref: Habakkuk 3:17
    book: Hab
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 14783
    text: For though the fig-tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, And the fields shall yield no food; The flock shall be cut off from the fold, and there shall be no herd in the stalls;
    translation: JPS 1917
    original: כִּי־תְאֵנָה לֹא־תִפְרָח וְאֵין יְבוּל בַּגְּפָנִים כִּחֵשׁ מַעֲשֵׂה־זַיִת וּשְׁדֵמוֹת לֹא־עָשָׂה אֹכֶל גָּזַר מִמִּכְלָה צֹאן וְאֵין בָּקָר בָּרְפָתִים׃
    hebrewPlain: כי תאנה לא תפרח ואין יבול בגפנים כחש מעשה זית ושדמות לא עשה אכל גזר ממכלה צאן ואין בקר ברפתים
    kjvRefs:
    - Habakkuk 3:17
    kjvOsis:
    - Hab.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.18
    scripture: tanakh
    name: Tanakh Habakkuk 3:18
    ref: Habakkuk 3:18
    book: Hab
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 14784
    text: Yet I will rejoice in the LORD, I will exult in the God of my salvation.
    translation: JPS 1917
    original: וַאֲנִי בַּיהוָה אֶעְלוֹזָה אָגִילָה בֵּאלֹהֵי יִשְׁעִי׃
    hebrewPlain: ואני ביהוה אעלוזה אגילה באלהי ישעי
    kjvRefs:
    - Habakkuk 3:18
    kjvOsis:
    - Hab.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
- type: TanakhVerse
  data:
    osis: Hab.3.19
    scripture: tanakh
    name: Tanakh Habakkuk 3:19
    ref: Habakkuk 3:19
    book: Hab
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 14785
    text: God, the Lord, is my strength, And He maketh my feet like hinds’ feet, And He maketh me to walk upon my high places. For the Leader. With my string-music.
    translation: JPS 1917
    original: יְהוִהּ אֲדֹנָי חֵילִי וַיָּשֶׂם רַגְלַי כָּאַיָּלוֹת וְעַל בָּמוֹתַי יַדְרִכֵנִי לַמְנַצֵּחַ בִּנְגִינוֹתָי׃
    hebrewPlain: יהוה אדני חילי וישם רגלי כאילות ועל במותי ידרכני למנצח בנגינותי
    kjvRefs:
    - Habakkuk 3:19
    kjvOsis:
    - Hab.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.3
