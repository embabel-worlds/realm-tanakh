- type: TanakhVerse
  data:
    osis: Hab.1.7
    scripture: tanakh
    name: Tanakh Habakkuk 1:7
    ref: Habakkuk 1:7
    book: Hab
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14736
    text: They are terrible and dreadful; Their law and their majesty proceed from themselves.
    translation: JPS 1917
    original: אָיֹם וְנוֹרָא הוּא מִמֶּנּוּ מִשְׁפָּטוֹ וּשְׂאֵתוֹ יֵצֵא׃
    hebrewPlain: אים ונורא הוא ממנו משפטו ושאתו יצא
    kjvRefs:
    - Habakkuk 1:7
    kjvOsis:
    - Hab.1.7
