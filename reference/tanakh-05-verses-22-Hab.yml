    name: Tanakh Habakkuk 1:6
    ref: Habakkuk 1:6
    book: Hab
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14735
    text: For, lo, I raise up the Chaldeans, That bitter and impetuous nation, That march through the breadth of the earth, To possess dwelling-places that are not theirs.
    translation: JPS 1917
    original: כִּי־הִנְנִי מֵקִים אֶת־הַכַּשְׂדִּים הַגּוֹי הַמַּר וְהַנִּמְהָר הַהוֹלֵךְ לְמֶרְחֲבֵי־אֶרֶץ לָרֶשֶׁת מִשְׁכָּנוֹת לֹּא־לוֹ׃
    hebrewPlain: כי הנני מקים את הכשדים הגוי המר והנמהר ההולך למרחבי ארץ לרשת משכנות לא לו
    kjvRefs:
    - Habakkuk 1:6
    kjvOsis:
    - Hab.1.6
