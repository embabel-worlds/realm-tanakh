    scripture: tanakh
    name: Tanakh Habakkuk 3:5
    ref: Habakkuk 3:5
    book: Hab
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14771
    text: Before him goeth the pestilence, and fiery bolts go forth at His feet.
    translation: JPS 1917
    original: לְפָנָיו יֵלֶךְ דָּבֶר וְיֵצֵא רֶשֶׁף לְרַגְלָיו׃
    hebrewPlain: לפניו ילך דבר ויצא רשף לרגליו
    kjvRefs:
    - Habakkuk 3:5
    kjvOsis:
