    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.10
    scripture: tanakh
    name: Tanakh Habakkuk 1:10
    ref: Habakkuk 1:10
    book: Hab
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 14739
    text: And they scoff at kings, And princes are a derision unto them; They deride every stronghold, For they heap up earth, and take it.
    translation: JPS 1917
    original: וְהוּא בַּמְּלָכִים יִתְקַלָּס וְרֹזְנִים מִשְׂחָק לוֹ הוּא לְכָל־מִבְצָר יִשְׂחָק וַיִּצְבֹּר עָפָר וַיִּלְכְּדָהּ׃
    hebrewPlain: והוא במלכים יתקלס ורזנים משחק לו הוא לכל מבצר ישחק ויצבר עפר וילכדה
    kjvRefs:
    - Habakkuk 1:10
    kjvOsis:
    - Hab.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.11
    scripture: tanakh
    name: Tanakh Habakkuk 1:11
    ref: Habakkuk 1:11
    book: Hab
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14740
    text: 'Then their spirit doth pass over and transgress, And they become guilty: Even they who impute their might unto their god.'
    translation: JPS 1917
    original: אָז חָלַף רוּחַ וַיַּעֲבֹר וְאָשֵׁם זוּ כֹחוֹ לֵאלֹהוֹ׃
    hebrewPlain: אז חלף רוח ויעבר ואשם זו כחו לאלהו
    kjvRefs:
    - Habakkuk 1:11
    kjvOsis:
    - Hab.1.11
