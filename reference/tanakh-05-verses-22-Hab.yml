- type: TanakhVerse
  data:
    osis: Hab.1.8
    scripture: tanakh
    name: Tanakh Habakkuk 1:8
    ref: Habakkuk 1:8
    book: Hab
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14737
    text: Their horses also are swifter than leopards, And are more fierce than the wolves of the desert; And their horsemen spread themselves; Yea, their horsemen come from far, They fly as a vulture that hasteth to devour.
    translation: JPS 1917
    original: וְקַלּוּ מִנְּמֵרִים סוּסָיו וְחַדּוּ מִזְּאֵבֵי עֶרֶב וּפָשׁוּ פָּרָשָׁיו וּפָרָשָׁיו מֵרָחוֹק יָבֹאוּ יָעֻפוּ כְּנֶשֶׁר חָשׁ לֶאֱכוֹל׃
    hebrewPlain: וקלו מנמרים סוסיו וחדו מזאבי ערב ופשו פרשיו ופרשיו מרחוק יבאו יעפו כנשר חש לאכול
    kjvRefs:
    - Habakkuk 1:8
    kjvOsis:
    - Hab.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hab.1
- type: TanakhVerse
  data:
    osis: Hab.1.9
    scripture: tanakh
    name: Tanakh Habakkuk 1:9
    ref: Habakkuk 1:9
    book: Hab
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14738
    text: They come all of them for violence; Their faces are set eagerly as the east wind; And they gather captives as the sand.
    translation: JPS 1917
    original: כֻּלֹּה לְחָמָס יָבוֹא מְגַמַּת פְּנֵיהֶם קָדִימָה וַיֶּאֱסֹף כַּחוֹל שֶׁבִי׃
    hebrewPlain: כלה לחמס יבוא מגמת פניהם קדימה ויאסף כחול שבי
    kjvRefs:
    - Habakkuk 1:9
    kjvOsis:
    - Hab.1.9
