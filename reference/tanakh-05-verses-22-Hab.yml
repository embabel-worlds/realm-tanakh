    name: Tanakh Habakkuk 1:5
    ref: Habakkuk 1:5
    book: Hab
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14734
    text: Look ye among the nations, and behold, And wonder marvellously; For, behold, a work shall be wrought in your days, Which ye will not believe though it be told you.
    translation: JPS 1917
    original: רְאוּ בַגּוֹיִם וְהַבִּיטוּ וְהִתַּמְּהוּ תְּמָהוּ כִּי־פֹעַל פֹּעֵל בִּימֵיכֶם לֹא תַאֲמִינוּ כִּי יְסֻפָּר׃
    hebrewPlain: ראו בגוים והביטו והתמהו תמהו כי פעל פעל בימיכם לא תאמינו כי יספר
    kjvRefs:
    - Habakkuk 1:5
    kjvOsis:
