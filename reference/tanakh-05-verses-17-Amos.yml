    scripture: tanakh
    name: Tanakh Amos 1:9
    ref: Amos 1:9
    book: Amos
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14371
    text: 'Thus saith the LORD: For three transgressions of Tyre, yea, for four, I will not reverse it: because they delivered up a whole captivity to Edom, and remembered not the brotherly covenant.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי־צֹר וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־הַסְגִּירָם גָּלוּת שְׁלֵמָה לֶאֱדוֹם וְלֹא זָכְרוּ בְּרִית אַחִים׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי צר ועל ארבעה לא אשיבנו על הסגירם גלות שלמה לאדום ולא זכרו ברית אחים
    kjvRefs:
