    verse: 2
    ordinal: 14364
    text: 'And he said: The LORD roareth from Zion, And uttereth His voice from Jerusalem; and the pastures of the shepherds shall mourn, and the top of Carmel shall wither.'
    translation: JPS 1917
    original: וַיֹּאמַר יְהוָה מִצִיּוֹן יִשְׁאָג וּמִירוּשָׁלִַם יִתֵּן קוֹלוֹ וְאָבְלוּ נְאוֹת הָרֹעִים וְיָבֵשׁ רֹאשׁ הַכַּרְמֶל׃
    hebrewPlain: ויאמר יהוה מציון ישאג ומירושלם יתן קולו ואבלו נאות הרעים ויבש ראש הכרמל
    kjvRefs:
    - Amos 1:2
    kjvOsis:
    - Amos.1.2
