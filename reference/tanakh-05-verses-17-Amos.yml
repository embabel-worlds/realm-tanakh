    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14379
    text: So will I send a fire upon Moab, And it shall devour the palaces of Kerioth; And Moab shall die with tumult, With shouting, and with the sound of the horn;
    translation: JPS 1917
    original: וְשִׁלַּחְתִּי־אֵשׁ בְּמוֹאָב וְאָכְלָה אַרְמְנוֹת הַקְּרִיּוֹת וּמֵת בְּשָׁאוֹן מוֹאָב בִּתְרוּעָה בְּקוֹל שׁוֹפָר׃
    hebrewPlain: ושלחתי אש במואב ואכלה ארמנות הקריות ומת בשאון מואב בתרועה בקול שופר
    kjvRefs:
    - Amos 2:2
    kjvOsis:
    - Amos.2.2
  relations:
