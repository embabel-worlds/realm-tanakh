    original: וְשִׁלַּחְתִּי אֵשׁ בְּבֵית חֲזָאֵל וְאָכְלָה אַרְמְנוֹת בֶּן־הֲדָד׃
    hebrewPlain: ושלחתי אש בבית חזאל ואכלה ארמנות בן הדד
    kjvRefs:
