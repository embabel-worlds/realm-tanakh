      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.4
    scripture: tanakh
    name: Tanakh Amos 2:4
    ref: Amos 2:4
    book: Amos
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14381
    text: 'Thus saith the LORD: For three transgressions of Judah, Yea, for four, I will not reverse it: Because they have rejected the law of the LORD, And have not kept His statutes, And their lies have caused them to err, After which their fathers did walk.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי יְהוּדָה וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־מָאֳסָם אֶת־תּוֹרַת יְהוָה וְחֻקָּיו לֹא שָׁמָרוּ וַיַּתְעוּם כִּזְבֵיהֶם אֲשֶׁר־הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי יהודה ועל ארבעה לא אשיבנו על מאסם את תורת יהוה וחקיו לא שמרו ויתעום כזביהם אשר הלכו אבותם אחריהם
    kjvRefs:
    - Amos 2:4
    kjvOsis:
    - Amos.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.5
    scripture: tanakh
    name: Tanakh Amos 2:5
    ref: Amos 2:5
    book: Amos
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14382
    text: So will I send a fire upon Judah, And it shall devour the palaces of Jerusalem.
    translation: JPS 1917
    original: וְשִׁלַּחְתִּי אֵשׁ בִּיהוּדָה וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִָם׃
    hebrewPlain: ושלחתי אש ביהודה ואכלה ארמנות ירושלם
    kjvRefs:
    - Amos 2:5
    kjvOsis:
    - Amos.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.6
    scripture: tanakh
    name: Tanakh Amos 2:6
    ref: Amos 2:6
    book: Amos
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14383
    text: 'Thus saith the LORD: For three transgressions of Israel, Yea, for four, I will not reverse it: Because they sell the righteous for silver, And the needy for a pair of shoes;'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־מִכְרָם בַּכֶּסֶף צַדִּיק וְאֶבְיוֹן בַּעֲבוּר נַעֲלָיִם׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי ישראל ועל ארבעה לא אשיבנו על מכרם בכסף צדיק ואביון בעבור נעלים
    kjvRefs:
    - Amos 2:6
    kjvOsis:
    - Amos.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.7
    scripture: tanakh
    name: Tanakh Amos 2:7
    ref: Amos 2:7
    book: Amos
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14384
    text: That pant after the dust of the earth on the head of the poor, And turn aside the way of the humble; And a man and his father go unto the same maid, To profane My holy name; .
    translation: JPS 1917
    original: הַשֹּׁאֲפִים עַל־עֲפַר־אֶרֶץ בְּרֹאשׁ דַּלִּים וְדֶרֶךְ עֲנָוִים יַטּוּ וְאִישׁ וְאָבִיו יֵלְכוּ אֶל־הַנַּעֲרָה לְמַעַן חַלֵּל אֶת־שֵׁם קָדְשִׁי׃
    hebrewPlain: השאפים על עפר ארץ בראש דלים ודרך ענוים יטו ואיש ואביו ילכו אל הנערה למען חלל את שם קדשי
    kjvRefs:
    - Amos 2:7
    kjvOsis:
    - Amos.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.8
    scripture: tanakh
    name: Tanakh Amos 2:8
    ref: Amos 2:8
    book: Amos
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14385
    text: And they lay themselves down beside every altar Upon clothes taken in pledge, And in the house of their God they drink The wine of them that have been fined.
    translation: JPS 1917
    original: וְעַל־בְּגָדִים חֲבֻלִים יַטּוּ אֵצֶל כָּל־מִזְבֵּחַ וְיֵין עֲנוּשִׁים יִשְׁתּוּ בֵּית אֱלֹהֵיהֶם׃
    hebrewPlain: ועל בגדים חבלים יטו אצל כל מזבח ויין ענושים ישתו בית אלהיהם
    kjvRefs:
    - Amos 2:8
    kjvOsis:
    - Amos.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.9
    scripture: tanakh
    name: Tanakh Amos 2:9
    ref: Amos 2:9
    book: Amos
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14386
    text: Yet destroyed I the Amorite before them, Whose height was like the height of the cedars, And he was strong as the oaks; Yet I destroyed his fruit from above, And his roots from beneath.
    translation: JPS 1917
    original: וְאָנֹכִי הִשְׁמַדְתִּי אֶת־הָאֱמֹרִי מִפְּנֵיהֶם אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ וְחָסֹן הוּא כָּאַלּוֹנִים וָאַשְׁמִיד פִּרְיוֹ מִמַּעַל וְשָׁרָשָׁיו מִתָּחַת׃
    hebrewPlain: ואנכי השמדתי את האמרי מפניהם אשר כגבה ארזים גבהו וחסן הוא כאלונים ואשמיד פריו ממעל ושרשיו מתחת
    kjvRefs:
    - Amos 2:9
    kjvOsis:
    - Amos.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.10
    scripture: tanakh
    name: Tanakh Amos 2:10
    ref: Amos 2:10
    book: Amos
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14387
    text: Also I brought you up out of the land of Egypt, And led you forty years in the wilderness, To possess the land of the Amorites.
    translation: JPS 1917
    original: וְאָנֹכִי הֶעֱלֵיתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם וָאוֹלֵךְ אֶתְכֶם בַּמִּדְבָּר אַרְבָּעִים שָׁנָה לָרֶשֶׁת אֶת־אֶרֶץ הָאֱמֹרִי׃
    hebrewPlain: ואנכי העליתי אתכם מארץ מצרים ואולך אתכם במדבר ארבעים שנה לרשת את ארץ האמרי
    kjvRefs:
    - Amos 2:10
    kjvOsis:
    - Amos.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.11
    scripture: tanakh
    name: Tanakh Amos 2:11
    ref: Amos 2:11
    book: Amos
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14388
    text: And I raised up of your sons for prophets, And of your young men for Nazirites. Is it not even thus, O ye children of Israel? Saith the LORD.
    translation: JPS 1917
    original: וָאָקִים מִבְּנֵיכֶם לִנְבִיאִים וּמִבַּחוּרֵיכֶם לִנְזִרִים הַאַף אֵין־זֹאת בְּנֵי יִשְׂרָאֵל נְאֻם־יְהוָה׃
    hebrewPlain: ואקים מבניכם לנביאים ומבחוריכם לנזרים האף אין זאת בני ישראל נאם יהוה
    kjvRefs:
    - Amos 2:11
    kjvOsis:
    - Amos.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.12
    scripture: tanakh
    name: Tanakh Amos 2:12
    ref: Amos 2:12
    book: Amos
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14389
    text: 'But ye gave the Nazirites wine to drink; And commanded the prophets, saying: ‘Prophesy not.’'
    translation: JPS 1917
    original: וַתַּשְׁקוּ אֶת־הַנְּזִרִים יָיִן וְעַל־הַנְּבִיאִים צִוִּיתֶם לֵאמֹר לֹא תִּנָּבְאוּ׃
    hebrewPlain: ותשקו את הנזרים יין ועל הנביאים צויתם לאמר לא תנבאו
    kjvRefs:
    - Amos 2:12
    kjvOsis:
    - Amos.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.13
    scripture: tanakh
    name: Tanakh Amos 2:13
    ref: Amos 2:13
    book: Amos
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14390
    text: Behold, I will make it creak under you, As a cart creaketh that is full of sheaves.
    translation: JPS 1917
    original: הִנֵּה אָנֹכִי מֵעִיק תַּחְתֵּיכֶם כַּאֲשֶׁר תָּעִיק הָעֲגָלָה הַמְלֵאָה לָהּ עָמִיר׃
    hebrewPlain: הנה אנכי מעיק תחתיכם כאשר תעיק העגלה המלאה לה עמיר
    kjvRefs:
    - Amos 2:13
    kjvOsis:
    - Amos.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.14
    scripture: tanakh
    name: Tanakh Amos 2:14
    ref: Amos 2:14
    book: Amos
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14391
    text: And flight shall fail the swift, And the strong shall not exert his strength, Neither shall the mighty deliver himself;
    translation: JPS 1917
    original: וְאָבַד מָנוֹס מִקָּל וְחָזָק לֹא־יְאַמֵּץ כֹּחוֹ וְגִבּוֹר לֹא־יְמַלֵּט נַפְשׁוֹ׃
    hebrewPlain: ואבד מנוס מקל וחזק לא יאמץ כחו וגבור לא ימלט נפשו
    kjvRefs:
    - Amos 2:14
    kjvOsis:
    - Amos.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.15
    scripture: tanakh
    name: Tanakh Amos 2:15
    ref: Amos 2:15
    book: Amos
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 14392
    text: Neither shall he stand that handleth the bow; And he that is swift of foot shall not deliver himself; Neither shall he that rideth the horse deliver himself;
    translation: JPS 1917
    original: וְתֹפֵשׂ הַקֶּשֶׁת לֹא יַעֲמֹד וְקַל בְּרַגְלָיו לֹא יְמַלֵּט וְרֹכֵב הַסּוּס לֹא יְמַלֵּט נַפְשׁוֹ׃
    hebrewPlain: ותפש הקשת לא יעמד וקל ברגליו לא ימלט ורכב הסוס לא ימלט נפשו
    kjvRefs:
    - Amos 2:15
    kjvOsis:
    - Amos.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.2.16
    scripture: tanakh
    name: Tanakh Amos 2:16
    ref: Amos 2:16
    book: Amos
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 14393
    text: And he that is courageous among the mighty Shall flee away naked in that day, Saith the LORD.
    translation: JPS 1917
    original: וְאַמִּיץ לִבּוֹ בַּגִּבּוֹרִים עָרוֹם יָנוּס בַּיּוֹם־הַהוּא נְאֻם־יְהוָה׃
    hebrewPlain: ואמיץ לבו בגבורים ערום ינוס ביום ההוא נאם יהוה
    kjvRefs:
    - Amos 2:16
    kjvOsis:
    - Amos.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.2
- type: TanakhVerse
  data:
    osis: Amos.3.1
    scripture: tanakh
    name: Tanakh Amos 3:1
    ref: Amos 3:1
    book: Amos
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14394
    text: 'Hear this word that the LORD hath spoken against you, O children of Israel, against the whole family which I brought up out of the land of Egypt, saying:'
    translation: JPS 1917
    original: שִׁמְעוּ אֶת־הַדָּבָר הַזֶּה אֲשֶׁר דִּבֶּר יְהוָה עֲלֵיכֶם בְּנֵי יִשְׂרָאֵל עַל כָּל־הַמִּשְׁפָּחָה אֲשֶׁר הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם לֵאמֹר׃
    hebrewPlain: שמעו את הדבר הזה אשר דבר יהוה עליכם בני ישראל על כל המשפחה אשר העליתי מארץ מצרים לאמר
    kjvRefs:
    - Amos 3:1
    kjvOsis:
    - Amos.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.2
    scripture: tanakh
    name: Tanakh Amos 3:2
    ref: Amos 3:2
    book: Amos
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14395
    text: You only have I known of all the families of the earth; Therefore I will visit upon you all your iniquities.
    translation: JPS 1917
    original: רַק אֶתְכֶם יָדַעְתִּי מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה עַל־כֵּן אֶפְקֹד עֲלֵיכֶם אֵת כָּל־עֲוֺנֹתֵיכֶם׃
    hebrewPlain: רק אתכם ידעתי מכל משפחות האדמה על כן אפקד עליכם את כל עונתיכם
    kjvRefs:
    - Amos 3:2
    kjvOsis:
    - Amos.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.3
    scripture: tanakh
    name: Tanakh Amos 3:3
    ref: Amos 3:3
    book: Amos
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14396
    text: Will two walk together, Except they have agreed?
    translation: JPS 1917
    original: הֲיֵלְכוּ שְׁנַיִם יַחְדָּו בִּלְתִּי אִם־נוֹעָדוּ׃
    hebrewPlain: הילכו שנים יחדו בלתי אם נועדו
    kjvRefs:
    - Amos 3:3
    kjvOsis:
    - Amos.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.4
    scripture: tanakh
    name: Tanakh Amos 3:4
    ref: Amos 3:4
    book: Amos
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14397
    text: Will a lion roar in the forest, When he hath no prey? Will a young lion give forth his voice out of his den, If he have taken nothing?
    translation: JPS 1917
    original: הֲיִשְׁאַג אַרְיֵה בַּיַּעַר וְטֶרֶף אֵין לוֹ הֲיִתֵּן כְּפִיר קוֹלוֹ מִמְּעֹנָתוֹ בִּלְתִּי אִם־לָכָד׃
    hebrewPlain: הישאג אריה ביער וטרף אין לו היתן כפיר קולו ממענתו בלתי אם לכד
    kjvRefs:
    - Amos 3:4
    kjvOsis:
    - Amos.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.5
    scripture: tanakh
    name: Tanakh Amos 3:5
    ref: Amos 3:5
    book: Amos
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14398
    text: Will a bird fall in a snare upon the earth, Where there is no lure for it? Will a snare spring up from the ground, And have taken nothing at all?
    translation: JPS 1917
    original: הֲתִפֹּל צִפּוֹר עַל־פַּח הָאָרֶץ וּמוֹקֵשׁ אֵין לָהּ הֲיַעֲלֶה־פַּח מִן־הָאֲדָמָה וְלָכוֹד לֹא יִלְכּוֹד׃
    hebrewPlain: התפל צפור על פח הארץ ומוקש אין לה היעלה פח מן האדמה ולכוד לא ילכוד
    kjvRefs:
    - Amos 3:5
    kjvOsis:
    - Amos.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.6
    scripture: tanakh
    name: Tanakh Amos 3:6
    ref: Amos 3:6
    book: Amos
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14399
    text: Shall the horn be blown in a city, And the people not tremble? Shall evil befall a city, And the LORD hath not done it?
    translation: JPS 1917
    original: אִם־יִתָּקַע שׁוֹפָר בְּעִיר וְעָם לֹא יֶחֱרָדוּ אִם־תִּהְיֶה רָעָה בְּעִיר וַיהוָה לֹא עָשָׂה׃
    hebrewPlain: אם יתקע שופר בעיר ועם לא יחרדו אם תהיה רעה בעיר ויהוה לא עשה
    kjvRefs:
    - Amos 3:6
    kjvOsis:
    - Amos.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.7
    scripture: tanakh
    name: Tanakh Amos 3:7
    ref: Amos 3:7
    book: Amos
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14400
    text: For the Lord GOD will do nothing, But He revealeth His counsel unto His servants the prophets.
    translation: JPS 1917
    original: כִּי לֹא יַעֲשֶׂה אֲדֹנָי יְהוִה דָּבָר כִּי אִם־גָּלָה סוֹדוֹ אֶל־עֲבָדָיו הַנְּבִיאִים׃
    hebrewPlain: כי לא יעשה אדני יהוה דבר כי אם גלה סודו אל עבדיו הנביאים
    kjvRefs:
    - Amos 3:7
    kjvOsis:
    - Amos.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.8
    scripture: tanakh
    name: Tanakh Amos 3:8
    ref: Amos 3:8
    book: Amos
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14401
    text: The lion hath roared, Who will not fear? The Lord GOD hath spoken, Who can but prophesy?
    translation: JPS 1917
    original: אַרְיֵה שָׁאָג מִי לֹא יִירָא אֲדֹנָי יְהוִה דִּבֶּר מִי לֹא יִנָּבֵא׃
    hebrewPlain: אריה שאג מי לא יירא אדני יהוה דבר מי לא ינבא
    kjvRefs:
    - Amos 3:8
    kjvOsis:
    - Amos.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.9
    scripture: tanakh
    name: Tanakh Amos 3:9
    ref: Amos 3:9
    book: Amos
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14402
    text: 'Proclaim it upon the palaces at Ashdod, And upon the palaces in the land of Egypt, And say: ‘Assemble yourselves upon the mountains of Samaria, And behold the great confusions therein, And the oppressions in the midst thereof.’'
    translation: JPS 1917
    original: הַשְׁמִיעוּ עַל־אַרְמְנוֹת בְּאַשְׁדּוֹד וְעַל־אַרְמְנוֹת בְּאֶרֶץ מִצְרָיִם וְאִמְרוּ הֵאָסְפוּ עַל־הָרֵי שֹׁמְרוֹן וּרְאוּ מְהוּמֹת רַבּוֹת בְּתוֹכָהּ וַעֲשׁוּקִים בְּקִרְבָּהּ׃
    hebrewPlain: השמיעו על ארמנות באשדוד ועל ארמנות בארץ מצרים ואמרו האספו על הרי שמרון וראו מהומת רבות בתוכה ועשוקים בקרבה
    kjvRefs:
    - Amos 3:9
    kjvOsis:
    - Amos.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.10
    scripture: tanakh
    name: Tanakh Amos 3:10
    ref: Amos 3:10
    book: Amos
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14403
    text: For they know not to do right, saith the LORD, Who store up violence and robbery in their palaces.
    translation: JPS 1917
    original: וְלֹא־יָדְעוּ עֲשׂוֹת־נְכֹחָה נְאֻם־יְהוָה הָאוֹצְרִים חָמָס וָשֹׁד בְּאַרְמְנוֹתֵיהֶם׃
    hebrewPlain: ולא ידעו עשות נכחה נאם יהוה האוצרים חמס ושד בארמנותיהם
    kjvRefs:
    - Amos 3:10
    kjvOsis:
    - Amos.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.11
    scripture: tanakh
    name: Tanakh Amos 3:11
    ref: Amos 3:11
    book: Amos
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 14404
    text: 'Therefore thus saith the Lord GOD: An adversary, even round about the land! And he shall bring down thy strength from thee, And thy palaces shall be spoiled.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה צַר וּסְבִיב הָאָרֶץ וְהוֹרִד מִמֵּךְ עֻזֵּךְ וְנָבֹזּוּ אַרְמְנוֹתָיִךְ׃
    hebrewPlain: לכן כה אמר אדני יהוה צר וסביב הארץ והורד ממך עזך ונבזו ארמנותיך
    kjvRefs:
    - Amos 3:11
    kjvOsis:
    - Amos.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.12
    scripture: tanakh
    name: Tanakh Amos 3:12
    ref: Amos 3:12
    book: Amos
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 14405
    text: 'Thus saith the LORD: As the shepherd rescueth out of the mouth of the lion Two legs, or a piece of an ear, So shall the children of Israel that dwell in Samaria Escape with the corner of a couch, and the leg of a bed.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה כַּאֲשֶׁר יַצִּיל הָרֹעֶה מִפִּי הָאֲרִי שְׁתֵּי כְרָעַיִם אוֹ בְדַל־אֹזֶן כֵּן יִנָּצְלוּ בְּנֵי יִשְׂרָאֵל הַיֹּשְׁבִים בְּשֹׁמְרוֹן בִּפְאַת מִטָּה וּבִדְמֶשֶׁק עָרֶשׂ׃
    hebrewPlain: כה אמר יהוה כאשר יציל הרעה מפי הארי שתי כרעים או בדל אזן כן ינצלו בני ישראל הישבים בשמרון בפאת מטה ובדמשק ערש
    kjvRefs:
    - Amos 3:12
    kjvOsis:
    - Amos.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.13
    scripture: tanakh
    name: Tanakh Amos 3:13
    ref: Amos 3:13
    book: Amos
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 14406
    text: Hear ye, and testify against the house of Jacob, Saith the Lord GOD, the God of hosts.
    translation: JPS 1917
    original: שִׁמְעוּ וְהָעִידוּ בְּבֵית יַעֲקֹב נְאֻם־אֲדֹנָי יְהוִה אֱלֹהֵי הַצְּבָאוֹת׃
    hebrewPlain: שמעו והעידו בבית יעקב נאם אדני יהוה אלהי הצבאות
    kjvRefs:
    - Amos 3:13
    kjvOsis:
    - Amos.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.14
    scripture: tanakh
    name: Tanakh Amos 3:14
    ref: Amos 3:14
    book: Amos
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 14407
    text: For in the day that I shall visit the transgressions of Israel upon him, I will also punish the altars of Beth-el, And the horns of the altar shall be cut off, And fall to the ground.
    translation: JPS 1917
    original: כִּי בְּיוֹם פָּקְדִי פִשְׁעֵי־יִשְׂרָאֵל עָלָיו וּפָקַדְתִּי עַל־מִזְבְּחוֹת בֵּית־אֵל וְנִגְדְּעוּ קַרְנוֹת הַמִּזְבֵּחַ וְנָפְלוּ לָאָרֶץ׃
    hebrewPlain: כי ביום פקדי פשעי ישראל עליו ופקדתי על מזבחות בית אל ונגדעו קרנות המזבח ונפלו לארץ
    kjvRefs:
    - Amos 3:14
    kjvOsis:
    - Amos.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.3.15
    scripture: tanakh
    name: Tanakh Amos 3:15
    ref: Amos 3:15
    book: Amos
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 14408
    text: And I will smite the winter-house with the summer-house; And the houses of ivory shall perish, And the great houses shall have an end, Saith the LORD.
    translation: JPS 1917
    original: וְהִכֵּיתִי בֵית־הַחֹרֶף עַל־בֵּית הַקָּיִץ וְאָבְדוּ בָּתֵּי הַשֵּׁן וְסָפוּ בָּתִּים רַבִּים נְאֻם־יְהוָה׃
    hebrewPlain: והכיתי בית החרף על בית הקיץ ואבדו בתי השן וספו בתים רבים נאם יהוה
    kjvRefs:
    - Amos 3:15
    kjvOsis:
    - Amos.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.3
- type: TanakhVerse
  data:
    osis: Amos.4.1
    scripture: tanakh
    name: Tanakh Amos 4:1
    ref: Amos 4:1
    book: Amos
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 14409
    text: 'Hear this word, ye kine of Bashan, That are in the mountain of Samaria, That oppress the poor, that crush the needy, That say unto their lords: ‘Bring, that we may feast.’'
    translation: JPS 1917
    original: שִׁמְעוּ הַדָּבָר הַזֶּה פָּרוֹת הַבָּשָׁן אֲשֶׁר בְּהַר שֹׁמְרוֹן הָעֹשְׁקוֹת דַּלִּים הָרֹצְצוֹת אֶבְיוֹנִים הָאֹמְרֹת לַאֲדֹנֵיהֶם הָבִיאָה וְנִשְׁתֶּה׃
    hebrewPlain: שמעו הדבר הזה פרות הבשן אשר בהר שמרון העשקות דלים הרצצות אביונים האמרת לאדניהם הביאה ונשתה
    kjvRefs:
    - Amos 4:1
    kjvOsis:
    - Amos.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.2
    scripture: tanakh
    name: Tanakh Amos 4:2
    ref: Amos 4:2
    book: Amos
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 14410
    text: 'The Lord GOD hath sworn by His holiness: Lo, surely the days shall come upon you, That ye shall be taken away with hooks, And your residue with fish-hooks.'
    translation: JPS 1917
    original: נִשְׁבַּע אֲדֹנָי יְהוִה בְּקָדְשׁוֹ כִּי הִנֵּה יָמִים בָּאִים עֲלֵיכֶם וְנִשָּׂא אֶתְכֶם בְּצִנּוֹת וְאַחֲרִיתְכֶן בְּסִירוֹת דּוּגָה׃
    hebrewPlain: נשבע אדני יהוה בקדשו כי הנה ימים באים עליכם ונשא אתכם בצנות ואחריתכן בסירות דוגה
    kjvRefs:
    - Amos 4:2
    kjvOsis:
    - Amos.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.3
    scripture: tanakh
    name: Tanakh Amos 4:3
    ref: Amos 4:3
    book: Amos
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 14411
    text: And ye shall go out at the breaches, every one straight before her; And ye shall be cast into Harmon, Saith the LORD.
    translation: JPS 1917
    original: וּפְרָצִים תֵּצֶאנָה אִשָּׁה נֶגְדָּהּ וְהִשְׁלַכְתֶּנָה הַהַרְמוֹנָה נְאֻם־יְהוָה׃
    hebrewPlain: ופרצים תצאנה אשה נגדה והשלכתנה ההרמונה נאם יהוה
    kjvRefs:
    - Amos 4:3
    kjvOsis:
    - Amos.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.4
    scripture: tanakh
    name: Tanakh Amos 4:4
    ref: Amos 4:4
    book: Amos
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 14412
    text: Come to Beth-el, and transgress, To Gilgal, and multiply transgression; And bring your sacrifices in the morning, And your tithes after three days;
    translation: JPS 1917
    original: בֹּאוּ בֵית־אֵל וּפִשְׁעוּ הַגִּלְגָּל הַרְבּוּ לִפְשֹׁעַ וְהָבִיאוּ לַבֹּקֶר זִבְחֵיכֶם לִשְׁלֹשֶׁת יָמִים מַעְשְׂרֹתֵיכֶם׃
    hebrewPlain: באו בית אל ופשעו הגלגל הרבו לפשע והביאו לבקר זבחיכם לשלשת ימים מעשרתיכם
    kjvRefs:
    - Amos 4:4
    kjvOsis:
    - Amos.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.5
    scripture: tanakh
    name: Tanakh Amos 4:5
    ref: Amos 4:5
    book: Amos
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 14413
    text: And offer a sacrifice of thanksgiving of that which is leavened, And proclaim freewill-offerings and publish them; For so ye love to do, O ye children of Israel, Saith the Lord GOD.
    translation: JPS 1917
    original: וְקַטֵּר מֵחָמֵץ תּוֹדָה וְקִרְאוּ נְדָבוֹת הַשְׁמִיעוּ כִּי כֵן אֲהַבְתֶּם בְּנֵי יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: וקטר מחמץ תודה וקראו נדבות השמיעו כי כן אהבתם בני ישראל נאם אדני יהוה
    kjvRefs:
    - Amos 4:5
    kjvOsis:
    - Amos.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.6
    scripture: tanakh
    name: Tanakh Amos 4:6
    ref: Amos 4:6
    book: Amos
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 14414
    text: And I also have given you Cleanness of teeth in all your cities, And want of bread in all your places; Yet have ye not returned unto Me, Saith the LORD.
    translation: JPS 1917
    original: וְגַם־אֲנִי נָתַתִּי לָכֶם נִקְיוֹן שִׁנַּיִם בְּכָל־עָרֵיכֶם וְחֹסֶר לֶחֶם בְּכֹל מְקוֹמֹתֵיכֶם וְלֹא־שַׁבְתֶּם עָדַי נְאֻם־יְהוָה׃
    hebrewPlain: וגם אני נתתי לכם נקיון שנים בכל עריכם וחסר לחם בכל מקומתיכם ולא שבתם עדי נאם יהוה
    kjvRefs:
    - Amos 4:6
    kjvOsis:
    - Amos.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.7
    scripture: tanakh
    name: Tanakh Amos 4:7
    ref: Amos 4:7
    book: Amos
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 14415
    text: And I also have withholden the rain from you, When there were yet three months to the harvest; And I caused it to rain upon one city, And caused it not to rain upon another city; One piece was rained upon, And the piece whereupon it rained not withered.
    translation: JPS 1917
    original: וְגַם אָנֹכִי מָנַעְתִּי מִכֶּם אֶת־הַגֶּשֶׁם בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר וְהִמְטַרְתִּי עַל־עִיר אֶחָת וְעַל־עִיר אַחַת לֹא אַמְטִיר חֶלְקָה אַחַת תִּמָּטֵר וְחֶלְקָה אֲשֶׁר־לֹא־תַמְטִיר עָלֶיהָ תִּיבָשׁ׃
    hebrewPlain: וגם אנכי מנעתי מכם את הגשם בעוד שלשה חדשים לקציר והמטרתי על עיר אחת ועל עיר אחת לא אמטיר חלקה אחת תמטר וחלקה אשר לא תמטיר עליה תיבש
    kjvRefs:
    - Amos 4:7
    kjvOsis:
    - Amos.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.8
    scripture: tanakh
    name: Tanakh Amos 4:8
    ref: Amos 4:8
    book: Amos
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 14416
    text: So two or three cities wandered unto one city To drink water, and were not satisfied; Yet have ye not returned unto Me, Saith the LORD.
    translation: JPS 1917
    original: וְנָעוּ שְׁתַּיִם שָׁלֹשׁ עָרִים אֶל־עִיר אַחַת לִשְׁתּוֹת מַיִם וְלֹא יִשְׂבָּעוּ וְלֹא־שַׁבְתֶּם עָדַי נְאֻם־יְהוָה׃
    hebrewPlain: ונעו שתים שלש ערים אל עיר אחת לשתות מים ולא ישבעו ולא שבתם עדי נאם יהוה
    kjvRefs:
    - Amos 4:8
    kjvOsis:
    - Amos.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.9
    scripture: tanakh
    name: Tanakh Amos 4:9
    ref: Amos 4:9
    book: Amos
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 14417
    text: I have smitten you with blasting and mildew; The multitude of your gardens and your vineyards And your fig-trees and your olive-trees Hath the palmer-worm devoured; Yet have ye not returned unto Me, Saith the LORD.
    translation: JPS 1917
    original: הִכֵּיתִי אֶתְכֶם בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן הַרְבּוֹת גַּנּוֹתֵיכֶם וְכַרְמֵיכֶם וּתְאֵנֵיכֶם וְזֵיתֵיכֶם יֹאכַל הַגָּזָם וְלֹא־שַׁבְתֶּם עָדַי נְאֻם־יְהוָה׃
    hebrewPlain: הכיתי אתכם בשדפון ובירקון הרבות גנותיכם וכרמיכם ותאניכם וזיתיכם יאכל הגזם ולא שבתם עדי נאם יהוה
    kjvRefs:
    - Amos 4:9
    kjvOsis:
    - Amos.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.10
    scripture: tanakh
    name: Tanakh Amos 4:10
    ref: Amos 4:10
    book: Amos
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 14418
    text: I have sent among you the pestilence in the way of Egypt; Your young men have I slain with the sword, And have carried away your horses; And I have made the stench of your camp to come up even into your nostrils; Yet have ye not returned unto Me, Saith the LORD.
    translation: JPS 1917
    original: שִׁלַּחְתִּי בָכֶם דֶּבֶר בְּדֶרֶךְ מִצְרַיִם הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם עִם שְׁבִי סוּסֵיכֶם וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם וְלֹא־שַׁבְתֶּם עָדַי נְאֻם־יְהוָה׃
    hebrewPlain: שלחתי בכם דבר בדרך מצרים הרגתי בחרב בחוריכם עם שבי סוסיכם ואעלה באש מחניכם ובאפכם ולא שבתם עדי נאם יהוה
    kjvRefs:
    - Amos 4:10
    kjvOsis:
    - Amos.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.11
    scripture: tanakh
    name: Tanakh Amos 4:11
    ref: Amos 4:11
    book: Amos
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 14419
    text: I have overthrown some of you, As God overthrew Sodom and Gomorrah, And ye were as a brand plucked out of the burning; Yet have ye not returned unto Me, Saith the LORD.
    translation: JPS 1917
    original: הָפַכְתִּי בָכֶם כְּמַהְפֵּכַת אֱלֹהִים אֶת־סְדֹם וְאֶת־עֲמֹרָה וַתִּהְיוּ כְּאוּד מֻצָּל מִשְׂרֵפָה וְלֹא־שַׁבְתֶּם עָדַי נְאֻם־יְהוָה׃
    hebrewPlain: הפכתי בכם כמהפכת אלהים את סדם ואת עמרה ותהיו כאוד מצל משרפה ולא שבתם עדי נאם יהוה
    kjvRefs:
    - Amos 4:11
    kjvOsis:
    - Amos.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.12
    scripture: tanakh
    name: Tanakh Amos 4:12
    ref: Amos 4:12
    book: Amos
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 14420
    text: Therefore thus will I do unto thee, O Israel; Because I will do this unto thee, Prepare to meet thy God, O Israel.
    translation: JPS 1917
    original: לָכֵן כֹּה אֶעֱשֶׂה־לְּךָ יִשְׂרָאֵל עֵקֶב כִּי־זֹאת אֶעֱשֶׂה־לָּךְ הִכּוֹן לִקְרַאת־אֱלֹהֶיךָ יִשְׂרָאֵל׃
    hebrewPlain: לכן כה אעשה לך ישראל עקב כי זאת אעשה לך הכון לקראת אלהיך ישראל
    kjvRefs:
    - Amos 4:12
    kjvOsis:
    - Amos.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.4.13
    scripture: tanakh
    name: Tanakh Amos 4:13
    ref: Amos 4:13
    book: Amos
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 14421
    text: For, lo, He that formeth the mountains, and createth the wind, And declareth unto man what is his thought, That maketh the morning darkness, And treadeth upon the high places of the earth; The LORD, the God of hosts, is His name.
    translation: JPS 1917
    original: כִּי הִנֵּה יוֹצֵר הָרִים וּבֹרֵא רוּחַ וּמַגִּיד לְאָדָם מַה־שֵּׂחוֹ עֹשֵׂה שַׁחַר עֵיפָה וְדֹרֵךְ עַל־בָּמֳתֵי אָרֶץ יְהוָה אֱלֹהֵי־צְבָאוֹת שְׁמוֹ׃
    hebrewPlain: כי הנה יוצר הרים וברא רוח ומגיד לאדם מה שחו עשה שחר עיפה ודרך על במתי ארץ יהוה אלהי צבאות שמו
    kjvRefs:
    - Amos 4:13
    kjvOsis:
    - Amos.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.4
- type: TanakhVerse
  data:
    osis: Amos.5.1
    scripture: tanakh
    name: Tanakh Amos 5:1
    ref: Amos 5:1
    book: Amos
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 14422
    text: 'Hear ye this word which I take up for a lamentation over you, O house of Israel:'
    translation: JPS 1917
    original: שִׁמְעוּ אֶת־הַדָּבָר הַזֶּה אֲשֶׁר אָנֹכִי נֹשֵׂא עֲלֵיכֶם קִינָה בֵּית יִשְׂרָאֵל׃
    hebrewPlain: שמעו את הדבר הזה אשר אנכי נשא עליכם קינה בית ישראל
    kjvRefs:
    - Amos 5:1
    kjvOsis:
    - Amos.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.2
    scripture: tanakh
    name: Tanakh Amos 5:2
    ref: Amos 5:2
    book: Amos
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 14423
    text: The virgin of Israel is fallen, She shall no more rise; She is cast down upon her land, There is none to raise her up.
    translation: JPS 1917
    original: נָפְלָה לֹא־תוֹסִיף קוּם בְּתוּלַת יִשְׂרָאֵל נִטְּשָׁה עַל־אַדְמָתָהּ אֵין מְקִימָהּ׃
    hebrewPlain: נפלה לא תוסיף קום בתולת ישראל נטשה על אדמתה אין מקימה
    kjvRefs:
    - Amos 5:2
    kjvOsis:
    - Amos.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.3
    scripture: tanakh
    name: Tanakh Amos 5:3
    ref: Amos 5:3
    book: Amos
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 14424
    text: 'For thus saith the Lord GOD: The city that went forth a thousand shall have a hundred left, and that which went forth a hundred shall have ten left, of the house of Israel.'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה הָעִיר הַיֹּצֵאת אֶלֶף תַּשְׁאִיר מֵאָה וְהַיּוֹצֵאת מֵאָה תַּשְׁאִיר עֲשָׂרָה לְבֵית יִשְׂרָאֵל׃
    hebrewPlain: כי כה אמר אדני יהוה העיר היצאת אלף תשאיר מאה והיוצאת מאה תשאיר עשרה לבית ישראל
    kjvRefs:
    - Amos 5:3
    kjvOsis:
    - Amos.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.4
    scripture: tanakh
    name: Tanakh Amos 5:4
    ref: Amos 5:4
    book: Amos
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 14425
    text: 'For thus saith the LORD unto the house of Israel: Seek ye Me, and live;'
    translation: JPS 1917
    original: כִּי כֹה אָמַר יְהוָה לְבֵית יִשְׂרָאֵל דִּרְשׁוּנִי וִחְיוּ׃
    hebrewPlain: כי כה אמר יהוה לבית ישראל דרשוני וחיו
    kjvRefs:
    - Amos 5:4
    kjvOsis:
    - Amos.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.5
    scripture: tanakh
    name: Tanakh Amos 5:5
    ref: Amos 5:5
    book: Amos
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 14426
    text: But seek not Beth-el, Nor enter into Gilgal, And pass not to Beer-sheba; For Gilgal shall surely go into captivity, And Beth-el shall come to nought.
    translation: JPS 1917
    original: וְאַל־תִּדְרְשׁוּ בֵּית־אֵל וְהַגִּלְגָּל לֹא תָבֹאוּ וּבְאֵר שֶׁבַע לֹא תַעֲבֹרוּ כִּי הַגִּלְגָּל גָּלֹה יִגְלֶה וּבֵית־אֵל יִהְיֶה לְאָוֶן׃
    hebrewPlain: ואל תדרשו בית אל והגלגל לא תבאו ובאר שבע לא תעברו כי הגלגל גלה יגלה ובית אל יהיה לאון
    kjvRefs:
    - Amos 5:5
    kjvOsis:
    - Amos.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.6
    scripture: tanakh
    name: Tanakh Amos 5:6
    ref: Amos 5:6
    book: Amos
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 14427
    text: Seek the LORD, and live— Lest He break out like fire in the house of Joseph, And it devour, and there be none to quench it in Bethel—
    translation: JPS 1917
    original: דִּרְשׁוּ אֶת־יְהוָה וִחְיוּ פֶּן־יִצְלַח כָּאֵשׁ בֵּית יוֹסֵף וְאָכְלָה וְאֵין־מְכַבֶּה לְבֵית־אֵל׃
    hebrewPlain: דרשו את יהוה וחיו פן יצלח כאש בית יוסף ואכלה ואין מכבה לבית אל
    kjvRefs:
    - Amos 5:6
    kjvOsis:
    - Amos.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.7
    scripture: tanakh
    name: Tanakh Amos 5:7
    ref: Amos 5:7
    book: Amos
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 14428
    text: Ye who turn judgment to wormwood, And cast righteousness to the ground;
    translation: JPS 1917
    original: הַהֹפְכִים לְלַעֲנָה מִשְׁפָּט וּצְדָקָה לָאָרֶץ הִנִּיחוּ׃
    hebrewPlain: ההפכים ללענה משפט וצדקה לארץ הניחו
    kjvRefs:
    - Amos 5:7
    kjvOsis:
    - Amos.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.8
    scripture: tanakh
    name: Tanakh Amos 5:8
    ref: Amos 5:8
    book: Amos
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 14429
    text: Him that maketh the Pleiades and Orion, And bringeth on the shadow of death in the morning, And darkeneth the day into night; That calleth for the waters of the sea, And poureth them out upon the face of the earth; The LORD is His name;
    translation: JPS 1917
    original: עֹשֵׂה כִימָה וּכְסִיל וְהֹפֵךְ לַבֹּקֶר צַלְמָוֶת וְיוֹם לַיְלָה הֶחְשִׁיךְ הַקּוֹרֵא לְמֵי־הַיָּם וַיִּשְׁפְּכֵם עַל־פְּנֵי הָאָרֶץ יְהוָה שְׁמוֹ׃
    hebrewPlain: עשה כימה וכסיל והפך לבקר צלמות ויום לילה החשיך הקורא למי הים וישפכם על פני הארץ יהוה שמו
    kjvRefs:
    - Amos 5:8
    kjvOsis:
    - Amos.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.9
    scripture: tanakh
    name: Tanakh Amos 5:9
    ref: Amos 5:9
    book: Amos
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 14430
    text: That causeth destruction to flash upon the strong, So that destruction cometh upon the fortress.
    translation: JPS 1917
    original: הַמַּבְלִיג שֹׁד עַל־עָז וְשֹׁד עַל־מִבְצָר יָבוֹא׃
    hebrewPlain: המבליג שד על עז ושד על מבצר יבוא
    kjvRefs:
    - Amos 5:9
    kjvOsis:
    - Amos.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.10
    scripture: tanakh
    name: Tanakh Amos 5:10
    ref: Amos 5:10
    book: Amos
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 14431
    text: They hate him that reproveth in the gate, And they abhor him that speaketh uprightly.
    translation: JPS 1917
    original: שָׂנְאוּ בַשַּׁעַר מוֹכִיחַ וְדֹבֵר תָּמִים יְתָעֵבוּ׃
    hebrewPlain: שנאו בשער מוכיח ודבר תמים יתעבו
    kjvRefs:
    - Amos 5:10
    kjvOsis:
    - Amos.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.11
    scripture: tanakh
    name: Tanakh Amos 5:11
    ref: Amos 5:11
    book: Amos
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 14432
    text: Therefore, because ye trample upon the poor, And take from him exactions of wheat; Ye have built houses of hewn stone, But ye shall not dwell in them, Ye have planted pleasant vineyards, But ye shall not drink wine thereof.
    translation: JPS 1917
    original: לָכֵן יַעַן בּוֹשַׁסְכֶם עַל־דָּל וּמַשְׂאַת־בַּר תִּקְחוּ מִמֶּנּוּ בָּתֵּי גָזִית בְּנִיתֶם וְלֹא־תֵשְׁבוּ בָם כַּרְמֵי־חֶמֶד נְטַעְתֶּם וְלֹא תִשְׁתּוּ אֶת־יֵינָם׃
    hebrewPlain: לכן יען בושסכם על דל ומשאת בר תקחו ממנו בתי גזית בניתם ולא תשבו בם כרמי חמד נטעתם ולא תשתו את יינם
    kjvRefs:
    - Amos 5:11
    kjvOsis:
    - Amos.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.12
    scripture: tanakh
    name: Tanakh Amos 5:12
    ref: Amos 5:12
    book: Amos
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 14433
    text: For I know how manifold are your transgressions, And how mighty are your sins; Ye that afflict the just, that take a ransom, And that turn aside the needy in the gate.
    translation: JPS 1917
    original: כִּי יָדַעְתִּי רַבִּים פִּשְׁעֵיכֶם וַעֲצֻמִים חַטֹּאתֵיכֶם צֹרְרֵי צַדִּיק לֹקְחֵי כֹפֶר וְאֶבְיוֹנִים בַּשַּׁעַר הִטּוּ׃
    hebrewPlain: כי ידעתי רבים פשעיכם ועצמים חטאתיכם צררי צדיק לקחי כפר ואביונים בשער הטו
    kjvRefs:
    - Amos 5:12
    kjvOsis:
    - Amos.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.13
    scripture: tanakh
    name: Tanakh Amos 5:13
    ref: Amos 5:13
    book: Amos
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 14434
    text: Therefore the prudent doth keep silence in such a time; For it is an evil time.
    translation: JPS 1917
    original: לָכֵן הַמַּשְׂכִּיל בָּעֵת הַהִיא יִדֹּם כִּי עֵת רָעָה הִיא׃
    hebrewPlain: לכן המשכיל בעת ההיא ידם כי עת רעה היא
    kjvRefs:
    - Amos 5:13
    kjvOsis:
    - Amos.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.14
    scripture: tanakh
    name: Tanakh Amos 5:14
    ref: Amos 5:14
    book: Amos
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 14435
    text: Seek good, and not evil, that ye may live; And so the LORD, the God of hosts, will be with you, as ye say.
    translation: JPS 1917
    original: דִּרְשׁוּ־טוֹב וְאַל־רָע לְמַעַן תִּחְיוּ וִיהִי־כֵן יְהוָה אֱלֹהֵי־צְבָאוֹת אִתְּכֶם כַּאֲשֶׁר אֲמַרְתֶּם׃
    hebrewPlain: דרשו טוב ואל רע למען תחיו ויהי כן יהוה אלהי צבאות אתכם כאשר אמרתם
    kjvRefs:
    - Amos 5:14
    kjvOsis:
    - Amos.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.15
    scripture: tanakh
    name: Tanakh Amos 5:15
    ref: Amos 5:15
    book: Amos
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 14436
    text: Hate the evil, and love the good, And establish justice in the gate; It may be that the LORD, the God of hosts, Will be gracious unto the remnant of Joseph.
    translation: JPS 1917
    original: שִׂנְאוּ־רָע וְאֶהֱבוּ טוֹב וְהַצִּיגוּ בַשַּׁעַר מִשְׁפָּט אוּלַי יֶחֱנַן יְהוָה אֱלֹהֵי־צְבָאוֹת שְׁאֵרִית יוֹסֵף׃
    hebrewPlain: שנאו רע ואהבו טוב והציגו בשער משפט אולי יחנן יהוה אלהי צבאות שארית יוסף
    kjvRefs:
    - Amos 5:15
    kjvOsis:
    - Amos.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.16
    scripture: tanakh
    name: Tanakh Amos 5:16
    ref: Amos 5:16
    book: Amos
    section: neviim
    chapter: 5
    verse: 16
    ordinal: 14437
    text: 'Therefore thus saith the LORD, The God of hosts, the Lord: Lamentation shall be in all the broad places, And they shall say in all the streets: ‘Alas! alas! ’ And they shall call the husbandman to mourning, And proclaim lamentation to such as are skilful of wailing.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר יְהוָה אֱלֹהֵי צְבָאוֹת אֲדֹנָי בְּכָל־רְחֹבוֹת מִסְפֵּד וּבְכָל־חוּצוֹת יֹאמְרוּ הוֹ־הוֹ וְקָרְאוּ אִכָּר אֶל־אֵבֶל וּמִסְפֵּד אֶל־יוֹדְעֵי נֶהִי׃
    hebrewPlain: לכן כה אמר יהוה אלהי צבאות אדני בכל רחבות מספד ובכל חוצות יאמרו הו הו וקראו אכר אל אבל ומספד אל יודעי נהי
    kjvRefs:
    - Amos 5:16
    kjvOsis:
    - Amos.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.17
    scripture: tanakh
    name: Tanakh Amos 5:17
    ref: Amos 5:17
    book: Amos
    section: neviim
    chapter: 5
    verse: 17
    ordinal: 14438
    text: And in all vineyards shall be lamentation; For I will pass through the midst of thee, Saith the LORD.
    translation: JPS 1917
    original: וּבְכָל־כְּרָמִים מִסְפֵּד כִּי־אֶעֱבֹר בְּקִרְבְּךָ אָמַר יְהוָה׃
    hebrewPlain: ובכל כרמים מספד כי אעבר בקרבך אמר יהוה
    kjvRefs:
    - Amos 5:17
    kjvOsis:
    - Amos.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.18
    scripture: tanakh
    name: Tanakh Amos 5:18
    ref: Amos 5:18
    book: Amos
    section: neviim
    chapter: 5
    verse: 18
    ordinal: 14439
    text: Woe unto you that desire the day of the LORD! Wherefore would ye have the day of the LORD? It is darkness, and not light.
    translation: JPS 1917
    original: הוֹי הַמִּתְאַוִּים אֶת־יוֹם יְהוָה לָמָּה־זֶּה לָכֶם יוֹם יְהוָה הוּא־חֹשֶׁךְ וְלֹא־אוֹר׃
    hebrewPlain: הוי המתאוים את יום יהוה למה זה לכם יום יהוה הוא חשך ולא אור
    kjvRefs:
    - Amos 5:18
    kjvOsis:
    - Amos.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.19
    scripture: tanakh
    name: Tanakh Amos 5:19
    ref: Amos 5:19
    book: Amos
    section: neviim
    chapter: 5
    verse: 19
    ordinal: 14440
    text: As if a man did flee from a lion, And a bear met him; And went into the house and leaned his hand on the wall, And a serpent bit him.
    translation: JPS 1917
    original: כַּאֲשֶׁר יָנוּס אִישׁ מִפְּנֵי הָאֲרִי וּפְגָעוֹ הַדֹּב וּבָא הַבַּיִת וְסָמַךְ יָדוֹ עַל־הַקִּיר וּנְשָׁכוֹ הַנָּחָשׁ׃
    hebrewPlain: כאשר ינוס איש מפני הארי ופגעו הדב ובא הבית וסמך ידו על הקיר ונשכו הנחש
    kjvRefs:
    - Amos 5:19
    kjvOsis:
    - Amos.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.20
    scripture: tanakh
    name: Tanakh Amos 5:20
    ref: Amos 5:20
    book: Amos
    section: neviim
    chapter: 5
    verse: 20
    ordinal: 14441
    text: Shall not the day of the LORD be darkness, and not light? Even very dark, and no brightness in it?
    translation: JPS 1917
    original: הֲלֹא־חֹשֶׁךְ יוֹם יְהוָה וְלֹא־אוֹר וְאָפֵל וְלֹא־נֹגַהּ לוֹ׃
    hebrewPlain: הלא חשך יום יהוה ולא אור ואפל ולא נגה לו
    kjvRefs:
    - Amos 5:20
    kjvOsis:
    - Amos.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.21
    scripture: tanakh
    name: Tanakh Amos 5:21
    ref: Amos 5:21
    book: Amos
    section: neviim
    chapter: 5
    verse: 21
    ordinal: 14442
    text: I hate, I despise your feasts, And I will take no delight in your solemn assemblies.
    translation: JPS 1917
    original: שָׂנֵאתִי מָאַסְתִּי חַגֵּיכֶם וְלֹא אָרִיחַ בְּעַצְּרֹתֵיכֶם׃
    hebrewPlain: שנאתי מאסתי חגיכם ולא אריח בעצרתיכם
    kjvRefs:
    - Amos 5:21
    kjvOsis:
    - Amos.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.22
    scripture: tanakh
    name: Tanakh Amos 5:22
    ref: Amos 5:22
    book: Amos
    section: neviim
    chapter: 5
    verse: 22
    ordinal: 14443
    text: Yea, though ye offer me burnt-offerings and your meal-offerings, I will not accept them; Neither will I regard the peace-offerings of your fat beasts.
    translation: JPS 1917
    original: כִּי אִם־תַּעֲלוּ־לִי עֹלוֹת וּמִנְחֹתֵיכֶם לֹא אֶרְצֶה וְשֶׁלֶם מְרִיאֵיכֶם לֹא אַבִּיט׃
    hebrewPlain: כי אם תעלו לי עלות ומנחתיכם לא ארצה ושלם מריאיכם לא אביט
    kjvRefs:
    - Amos 5:22
    kjvOsis:
    - Amos.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.23
    scripture: tanakh
    name: Tanakh Amos 5:23
    ref: Amos 5:23
    book: Amos
    section: neviim
    chapter: 5
    verse: 23
    ordinal: 14444
    text: Take thou away from Me the noise of thy songs; And let Me not hear the melody of thy psalteries.
    translation: JPS 1917
    original: הָסֵר מֵעָלַי הֲמוֹן שִׁרֶיךָ וְזִמְרַת נְבָלֶיךָ לֹא אֶשְׁמָע׃
    hebrewPlain: הסר מעלי המון שריך וזמרת נבליך לא אשמע
    kjvRefs:
    - Amos 5:23
    kjvOsis:
    - Amos.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.24
    scripture: tanakh
    name: Tanakh Amos 5:24
    ref: Amos 5:24
    book: Amos
    section: neviim
    chapter: 5
    verse: 24
    ordinal: 14445
    text: But let justice well up as waters, And righteousness as a mighty stream.
    translation: JPS 1917
    original: וְיִגַּל כַּמַּיִם מִשְׁפָּט וּצְדָקָה כְּנַחַל אֵיתָן׃
    hebrewPlain: ויגל כמים משפט וצדקה כנחל איתן
    kjvRefs:
    - Amos 5:24
    kjvOsis:
    - Amos.5.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.25
    scripture: tanakh
    name: Tanakh Amos 5:25
    ref: Amos 5:25
    book: Amos
    section: neviim
    chapter: 5
    verse: 25
    ordinal: 14446
    text: Did ye bring unto Me sacrifices and offerings in the wilderness forty years, O house of Israel?
    translation: JPS 1917
    original: הַזְּבָחִים וּמִנְחָה הִגַּשְׁתֶּם־לִי בַמִּדְבָּר אַרְבָּעִים שָׁנָה בֵּית יִשְׂרָאֵל׃
    hebrewPlain: הזבחים ומנחה הגשתם לי במדבר ארבעים שנה בית ישראל
    kjvRefs:
    - Amos 5:25
    kjvOsis:
    - Amos.5.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.26
    scripture: tanakh
    name: Tanakh Amos 5:26
    ref: Amos 5:26
    book: Amos
    section: neviim
    chapter: 5
    verse: 26
    ordinal: 14447
    text: So shall ye take up Siccuth your king and Chiun your images, the star of your god, which ye made to yourselves.
    translation: JPS 1917
    original: וּנְשָׂאתֶם אֵת סִכּוּת מַלְכְּכֶם וְאֵת כִּיּוּן צַלְמֵיכֶם כּוֹכַב אֱלֹהֵיכֶם אֲשֶׁר עֲשִׂיתֶם לָכֶם׃
    hebrewPlain: ונשאתם את סכות מלככם ואת כיון צלמיכם כוכב אלהיכם אשר עשיתם לכם
    kjvRefs:
    - Amos 5:26
    kjvOsis:
    - Amos.5.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.5.27
    scripture: tanakh
    name: Tanakh Amos 5:27
    ref: Amos 5:27
    book: Amos
    section: neviim
    chapter: 5
    verse: 27
    ordinal: 14448
    text: Therefore will I cause you to go into captivity beyond Damascus, saith He, whose name is the LORD God of hosts.
    translation: JPS 1917
    original: וְהִגְלֵיתִי אֶתְכֶם מֵהָלְאָה לְדַמָּשֶׂק אָמַר יְהוָה אֱלֹהֵי־צְבָאוֹת שְׁמוֹ׃
    hebrewPlain: והגליתי אתכם מהלאה לדמשק אמר יהוה אלהי צבאות שמו
    kjvRefs:
    - Amos 5:27
    kjvOsis:
    - Amos.5.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.5
- type: TanakhVerse
  data:
    osis: Amos.6.1
    scripture: tanakh
    name: Tanakh Amos 6:1
    ref: Amos 6:1
    book: Amos
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 14449
    text: Woe to them that are at ease in Zion, And to them that are secure in the mountain of Samaria, The notable men of the first of the nations, To whom the house of Israel come!
    translation: JPS 1917
    original: הוֹי הַשַּׁאֲנַנִּים בְּצִיּוֹן וְהַבֹּטְחִים בְּהַר שֹׁמְרוֹן נְקֻבֵי רֵאשִׁית הַגּוֹיִם וּבָאוּ לָהֶם בֵּית יִשְׂרָאֵל׃
    hebrewPlain: הוי השאננים בציון והבטחים בהר שמרון נקבי ראשית הגוים ובאו להם בית ישראל
    kjvRefs:
    - Amos 6:1
    kjvOsis:
    - Amos.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.2
    scripture: tanakh
    name: Tanakh Amos 6:2
    ref: Amos 6:2
    book: Amos
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 14450
    text: Pass ye unto Calneh, and see, And from thence go ye to Hamath the great; Then go down to Gath of the Philistines; Are they better than these kingdoms? Or is their border greater than your border? .
    translation: JPS 1917
    original: עִבְרוּ כַלְנֵה וּרְאוּ וּלְכוּ מִשָּׁם חֲמַת רַבָּה וּרְדוּ גַת־פְּלִשְׁתּים הֲטוֹבִים מִן־הַמַּמְלָכוֹת הָאֵלֶּה אִם־רַב גְּבוּלָם מִגְּבֻלְכֶם׃
    hebrewPlain: עברו כלנה וראו ולכו משם חמת רבה ורדו גת פלשתים הטובים מן הממלכות האלה אם רב גבולם מגבלכם
    kjvRefs:
    - Amos 6:2
    kjvOsis:
    - Amos.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.3
    scripture: tanakh
    name: Tanakh Amos 6:3
    ref: Amos 6:3
    book: Amos
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 14451
    text: Ye that put far away the evil day, And cause the seat of violence to come near;
    translation: JPS 1917
    original: הַמְנַדִּים לְיוֹם רָע וַתַּגִּישׁוּן שֶׁבֶת חָמָס׃
    hebrewPlain: המנדים ליום רע ותגישון שבת חמס
    kjvRefs:
    - Amos 6:3
    kjvOsis:
    - Amos.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.4
    scripture: tanakh
    name: Tanakh Amos 6:4
    ref: Amos 6:4
    book: Amos
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 14452
    text: That lie upon beds of ivory, And stretch themselves upon their couches, And eat the lambs out of the flock, And the calves out of the midst of the stall;
    translation: JPS 1917
    original: הַשֹּׁכְבִים עַל־מִטּוֹת שֵׁן וּסְרֻחִים עַל־עַרְשׂוֹתָם וְאֹכְלִים כָּרִים מִצֹּאן וַעֲגָלִים מִתּוֹךְ מַרְבֵּק׃
    hebrewPlain: השכבים על מטות שן וסרחים על ערשותם ואכלים כרים מצאן ועגלים מתוך מרבק
    kjvRefs:
    - Amos 6:4
    kjvOsis:
    - Amos.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.5
    scripture: tanakh
    name: Tanakh Amos 6:5
    ref: Amos 6:5
    book: Amos
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 14453
    text: That thrum on the psaltery, That devise for themselves instruments of music, like David;
    translation: JPS 1917
    original: הַפֹּרְטִים עַל־פִּי הַנָּבֶל כְּדָוִיד חָשְׁבוּ לָהֶם כְּלֵי־שִׁיר׃
    hebrewPlain: הפרטים על פי הנבל כדויד חשבו להם כלי שיר
    kjvRefs:
    - Amos 6:5
    kjvOsis:
    - Amos.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.6
    scripture: tanakh
    name: Tanakh Amos 6:6
    ref: Amos 6:6
    book: Amos
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 14454
    text: That drink wine in bowls, And anoint themselves with the chief ointments; But they are not grieved for the hurt of Joseph.
    translation: JPS 1917
    original: הַשֹּׁתִים בְּמִזְרְקֵי יַיִן וְרֵאשִׁית שְׁמָנִים יִמְשָׁחוּ וְלֹא נֶחְלוּ עַל־שֵׁבֶר יוֹסֵף
    hebrewPlain: השתים במזרקי יין וראשית שמנים ימשחו ולא נחלו על שבר יוסף
    kjvRefs:
    - Amos 6:6
    kjvOsis:
    - Amos.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.7
    scripture: tanakh
    name: Tanakh Amos 6:7
    ref: Amos 6:7
    book: Amos
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 14455
    text: Therefore now shall they go captive at the head of them that go captive, And the revelry of them that stretched themselves shall pass away.
    translation: JPS 1917
    original: לָכֵן עַתָּה יִגְלוּ בְּרֹאשׁ גֹּלִים וְסָר מִרְזַח סְרוּחִים׃
    hebrewPlain: לכן עתה יגלו בראש גלים וסר מרזח סרוחים
    kjvRefs:
    - Amos 6:7
    kjvOsis:
    - Amos.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.8
    scripture: tanakh
    name: Tanakh Amos 6:8
    ref: Amos 6:8
    book: Amos
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 14456
    text: 'The Lord GOD hath sworn by Himself, Saith the LORD, the God of hosts: I abhor the pride of Jacob, And hate his palaces; And I will deliver up the city with all that is therein.'
    translation: JPS 1917
    original: נִשְׁבַּע אֲדֹנָי יְהוִה בְּנַפְשׁוֹ נְאֻם־יְהוָה אֱלֹהֵי צְבָאוֹת מְתָאֵב אָנֹכִי אֶת־גְּאוֹן יַעֲקֹב וְאַרְמְנֹתָיו שָׂנֵאתִי וְהִסְגַּרְתִּי עִיר וּמְלֹאָהּ׃
    hebrewPlain: נשבע אדני יהוה בנפשו נאם יהוה אלהי צבאות מתאב אנכי את גאון יעקב וארמנתיו שנאתי והסגרתי עיר ומלאה
    kjvRefs:
    - Amos 6:8
    kjvOsis:
    - Amos.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.9
    scripture: tanakh
    name: Tanakh Amos 6:9
    ref: Amos 6:9
    book: Amos
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 14457
    text: And it shall come to pass, if there remain ten men in one house, that they shall die.
    translation: JPS 1917
    original: וְהָיָה אִם־יִוָּתְרוּ עֲשָׂרָה אֲנָשִׁים בְּבַיִת אֶחָד וָמֵתוּ׃
    hebrewPlain: והיה אם יותרו עשרה אנשים בבית אחד ומתו
    kjvRefs:
    - Amos 6:9
    kjvOsis:
    - Amos.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.10
    scripture: tanakh
    name: Tanakh Amos 6:10
    ref: Amos 6:10
    book: Amos
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 14458
    text: 'And when a man’s uncle shall take him up, even he that burneth him, to bring out the bones out of the house, and shall say unto him that is in the innermost parts of the house: ‘Is there yet any with thee?’ and he shall say: ‘No’; then shall he say: ‘Hold thy peace; for we must not make mention of the name of the LORD.’'
    translation: JPS 1917
    original: וּנְשָׂאוֹ דּוֹדוֹ וּמְסָרְפוֹ לְהוֹצִיא עֲצָמִים מִן־הַבַּיִת וְאָמַר לַאֲשֶׁר בְּיַרְכְּתֵי הַבַּיִת הַעוֹד עִמָּךְ וְאָמַר אָפֶס וְאָמַר הָס כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה׃
    hebrewPlain: ונשאו דודו ומסרפו להוציא עצמים מן הבית ואמר לאשר בירכתי הבית העוד עמך ואמר אפס ואמר הס כי לא להזכיר בשם יהוה
    kjvRefs:
    - Amos 6:10
    kjvOsis:
    - Amos.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.11
    scripture: tanakh
    name: Tanakh Amos 6:11
    ref: Amos 6:11
    book: Amos
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 14459
    text: For, behold, the LORD commandeth, And the great house shall be smitten into splinters, And the little house into chips.
    translation: JPS 1917
    original: כִּי־הִנֵּה יְהוָה מְצַוֶּה וְהִכָּה הַבַּיִת הַגָּדוֹל רְסִיסִים וְהַבַּיִת הַקָּטֹן בְּקִעִים׃
    hebrewPlain: כי הנה יהוה מצוה והכה הבית הגדול רסיסים והבית הקטן בקעים
    kjvRefs:
    - Amos 6:11
    kjvOsis:
    - Amos.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.12
    scripture: tanakh
    name: Tanakh Amos 6:12
    ref: Amos 6:12
    book: Amos
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 14460
    text: Do horses run upon the rocks? Doth one plow there with oxen? That ye have turned justice into gall, And the fruit of righteousness into wormwood;
    translation: JPS 1917
    original: הַיְרֻצוּן בַּסֶּלַע סוּסִים אִם־יַחֲרוֹשׁ בַּבְּקָרִים כִּי־הֲפַכְתֶּם לְרֹאשׁ מִשְׁפָּט וּפְרִי צְדָקָה לְלַעֲנָה׃
    hebrewPlain: הירצון בסלע סוסים אם יחרוש בבקרים כי הפכתם לראש משפט ופרי צדקה ללענה
    kjvRefs:
    - Amos 6:12
    kjvOsis:
    - Amos.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.13
    scripture: tanakh
    name: Tanakh Amos 6:13
    ref: Amos 6:13
    book: Amos
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 14461
    text: 'Ye that rejoice in a thing of nought, That say: ‘Have we not taken to us horns by our own strength?’'
    translation: JPS 1917
    original: הַשְּׂמֵחִים לְלֹא דָבָר הָאֹמְרִים הֲלוֹא בְחָזְקֵנוּ לָקַחְנוּ לָנוּ קַרְנָיִם׃
    hebrewPlain: השמחים ללא דבר האמרים הלוא בחזקנו לקחנו לנו קרנים
    kjvRefs:
    - Amos 6:13
    kjvOsis:
    - Amos.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.6.14
    scripture: tanakh
    name: Tanakh Amos 6:14
    ref: Amos 6:14
    book: Amos
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 14462
    text: For, behold, I will raise up against you a nation, O house of Israel, saith the LORD, the God of hosts; and they shall afflict you from the entrance of Hamath unto the Brook of the Arabah.
    translation: JPS 1917
    original: כִּי הִנְנִי מֵקִים עֲלֵיכֶם בֵּית יִשְׂרָאֵל נְאֻם־יְהוָה אֱלֹהֵי הַצְּבָאוֹת גּוֹי וְלָחֲצוּ אֶתְכֶם מִלְּבוֹא חֲמָת עַד־נַחַל הָעֲרָבָה׃
    hebrewPlain: כי הנני מקים עליכם בית ישראל נאם יהוה אלהי הצבאות גוי ולחצו אתכם מלבוא חמת עד נחל הערבה
    kjvRefs:
    - Amos 6:14
    kjvOsis:
    - Amos.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.6
- type: TanakhVerse
  data:
    osis: Amos.7.1
    scripture: tanakh
    name: Tanakh Amos 7:1
    ref: Amos 7:1
    book: Amos
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 14463
    text: Thus the Lord GOD showed me; and, behold, He formed locusts in the beginning of the shooting up of the latter growth; and, lo, it was the latter growth after the king’s mowings.
    translation: JPS 1917
    original: כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה יוֹצֵר גֹּבַי בִּתְחִלַּת עֲלוֹת הַלָּקֶשׁ וְהִנֵּה־לֶקֶשׁ אַחַר גִּזֵּי הַמֶּלֶךְ׃
    hebrewPlain: כה הראני אדני יהוה והנה יוצר גבי בתחלת עלות הלקש והנה לקש אחר גזי המלך
    kjvRefs:
    - Amos 7:1
    kjvOsis:
    - Amos.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.2
    scripture: tanakh
    name: Tanakh Amos 7:2
    ref: Amos 7:2
    book: Amos
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 14464
    text: 'And if it had come to pass, that when they had made an end of eating the grass of the land—so I said: O Lord GOD, forgive, I beseech Thee; How shall Jacob stand? for he is small.'
    translation: JPS 1917
    original: וְהָיָה אִם־כִּלָּה לֶאֱכוֹל אֶת־עֵשֶׂב הָאָרֶץ וָאֹמַר אֲדֹנָי יְהוִה סְלַח־נָא מִי יָקוּם יַעֲקֹב כִּי קָטֹן הוּא׃
    hebrewPlain: והיה אם כלה לאכול את עשב הארץ ואמר אדני יהוה סלח נא מי יקום יעקב כי קטן הוא
    kjvRefs:
    - Amos 7:2
    kjvOsis:
    - Amos.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.3
    scripture: tanakh
    name: Tanakh Amos 7:3
    ref: Amos 7:3
    book: Amos
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 14465
    text: The LORD repented concerning this; ‘It shall not be’, saith the LORD. .
    translation: JPS 1917
    original: נִחַם יְהוָה עַל־זֹאת לֹא תִהְיֶה אָמַר יְהוָה׃
    hebrewPlain: נחם יהוה על זאת לא תהיה אמר יהוה
    kjvRefs:
    - Amos 7:3
    kjvOsis:
    - Amos.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.4
    scripture: tanakh
    name: Tanakh Amos 7:4
    ref: Amos 7:4
    book: Amos
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 14466
    text: Thus the Lord GOD showed me; and, behold, the Lord GOD called to contend by fire; and it devoured the great deep, and would have eaten up the land.
    translation: JPS 1917
    original: כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה קֹרֵא לָרִב בָּאֵשׁ אֲדֹנָי יְהוִה וַתֹּאכַל אֶת־תְּהוֹם רַבָּה וְאָכְלָה אֶת־הַחֵלֶק׃
    hebrewPlain: כה הראני אדני יהוה והנה קרא לרב באש אדני יהוה ותאכל את תהום רבה ואכלה את החלק
    kjvRefs:
    - Amos 7:4
    kjvOsis:
    - Amos.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.5
    scripture: tanakh
    name: Tanakh Amos 7:5
    ref: Amos 7:5
    book: Amos
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 14467
    text: 'Then said I: O Lord GOD, cease, I beseech Thee; How shall Jacob stand? for he is small.'
    translation: JPS 1917
    original: וָאֹמַר אֲדֹנָי יְהוִה חֲדַל־נָא מִי יָקוּם יַעֲקֹב כִּי קָטֹן הוּא׃
    hebrewPlain: ואמר אדני יהוה חדל נא מי יקום יעקב כי קטן הוא
    kjvRefs:
    - Amos 7:5
    kjvOsis:
    - Amos.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.6
    scripture: tanakh
    name: Tanakh Amos 7:6
    ref: Amos 7:6
    book: Amos
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 14468
    text: The LORD repented concerning this; ‘This also shall not be’, saith the Lord GOD.
    translation: JPS 1917
    original: נִחַם יְהוָה עַל־זֹאת גַּם־הִיא לֹא תִהְיֶה אָמַר אֲדֹנָי יְהוִה׃
    hebrewPlain: נחם יהוה על זאת גם היא לא תהיה אמר אדני יהוה
    kjvRefs:
    - Amos 7:6
    kjvOsis:
    - Amos.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.7
    scripture: tanakh
    name: Tanakh Amos 7:7
    ref: Amos 7:7
    book: Amos
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 14469
    text: Thus He showed me; and, behold, the Lord stood beside a wall made by a plumbline, with a plumbline in His hand.
    translation: JPS 1917
    original: כֹּה הִרְאַנִי וְהִנֵּה אֲדֹנָי נִצָּב עַל־חוֹמַת אֲנָךְ וּבְיָדוֹ אֲנָךְ׃
    hebrewPlain: כה הראני והנה אדני נצב על חומת אנך ובידו אנך
    kjvRefs:
    - Amos 7:7
    kjvOsis:
    - Amos.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.8
    scripture: tanakh
    name: Tanakh Amos 7:8
    ref: Amos 7:8
    book: Amos
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 14470
    text: 'And the LORD said unto me: ‘Amos, what seest thou?’ And I said: ‘A plumbline.’ Then said the Lord: Behold, I will set a plumbline in the midst of My people Israel; I will not again pardon them any more;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי מָה־אַתָּה רֹאֶה עָמוֹס וָאֹמַר אֲנָךְ וַיֹּאמֶר אֲדֹנָי הִנְנִי שָׂם אֲנָךְ בְּקֶרֶב עַמִּי יִשְׂרָאֵל לֹא־אוֹסִיף עוֹד עֲבוֹר לוֹ׃
    hebrewPlain: ויאמר יהוה אלי מה אתה ראה עמוס ואמר אנך ויאמר אדני הנני שם אנך בקרב עמי ישראל לא אוסיף עוד עבור לו
    kjvRefs:
    - Amos 7:8
    kjvOsis:
    - Amos.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.9
    scripture: tanakh
    name: Tanakh Amos 7:9
    ref: Amos 7:9
    book: Amos
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 14471
    text: And the high places of Isaac shall be desolate, And the sanctuaries of Israel shall be laid waste; And I will rise against the house of Jeroboam with the sword.
    translation: JPS 1917
    original: וְנָשַׁמּוּ בָּמוֹת יִשְׂחָק וּמִקְדְּשֵׁי יִשְׂרָאֵל יֶחֱרָבוּ וְקַמְתִּי עַל־בֵּית יָרָבְעָם בֶּחָרֶב׃
    hebrewPlain: ונשמו במות ישחק ומקדשי ישראל יחרבו וקמתי על בית ירבעם בחרב
    kjvRefs:
    - Amos 7:9
    kjvOsis:
    - Amos.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.10
    scripture: tanakh
    name: Tanakh Amos 7:10
    ref: Amos 7:10
    book: Amos
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 14472
    text: 'Then Amaziah the priest of Beth-el sent to Jeroboam king of Israel, saying: ‘Amos hath conspired against thee in the midst of the house of Israel; the land is not able to bear all his words.'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֲמַצְיָה כֹּהֵן בֵּית־אֵל אֶל־יָרָבְעָם מֶלֶךְ־יִשְׂרָאֵל לֵאמֹר קָשַׁר עָלֶיךָ עָמוֹס בְּקֶרֶב בֵּית יִשְׂרָאֵל לֹא־תוּכַל הָאָרֶץ לְהָכִיל אֶת־כָּל־דְּבָרָיו׃
    hebrewPlain: וישלח אמציה כהן בית אל אל ירבעם מלך ישראל לאמר קשר עליך עמוס בקרב בית ישראל לא תוכל הארץ להכיל את כל דבריו
    kjvRefs:
    - Amos 7:10
    kjvOsis:
    - Amos.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.11
    scripture: tanakh
    name: Tanakh Amos 7:11
    ref: Amos 7:11
    book: Amos
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 14473
    text: 'For thus Amos saith: Jeroboam shall die by the sword, And Israel shall surely be led away captive out of his land.’'
    translation: JPS 1917
    original: כִּי־כֹה אָמַר עָמוֹס בַּחֶרֶב יָמוּת יָרָבְעָם וְיִשְׂרָאֵל גָּלֹה יִגְלֶה מֵעַל אַדְמָתוֹ׃
    hebrewPlain: כי כה אמר עמוס בחרב ימות ירבעם וישראל גלה יגלה מעל אדמתו
    kjvRefs:
    - Amos 7:11
    kjvOsis:
    - Amos.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.12
    scripture: tanakh
    name: Tanakh Amos 7:12
    ref: Amos 7:12
    book: Amos
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 14474
    text: 'Also Amaziah said unto Amos: ‘O thou seer, go, flee thee away into the land of Judah, and there eat bread, and prophesy there;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲמַצְיָה אֶל־עָמוֹס חֹזֶה לֵךְ בְּרַח־לְךָ אֶל־אֶרֶץ יְהוּדָה וֶאֱכָל־שָׁם לֶחֶם וְשָׁם תִּנָּבֵא׃
    hebrewPlain: ויאמר אמציה אל עמוס חזה לך ברח לך אל ארץ יהודה ואכל שם לחם ושם תנבא
    kjvRefs:
    - Amos 7:12
    kjvOsis:
    - Amos.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.13
    scripture: tanakh
    name: Tanakh Amos 7:13
    ref: Amos 7:13
    book: Amos
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 14475
    text: but prophesy not again any more at Beth-el, for it is the king’s sanctuary, and it is a royal house.’
    translation: JPS 1917
    original: וּבֵית־אֵל לֹא־תוֹסִיף עוֹד לְהִנָּבֵא כִּי מִקְדַּשׁ־מֶלֶךְ הוּא וּבֵית מַמְלָכָה הוּא׃
    hebrewPlain: ובית אל לא תוסיף עוד להנבא כי מקדש מלך הוא ובית ממלכה הוא
    kjvRefs:
    - Amos 7:13
    kjvOsis:
    - Amos.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.14
    scripture: tanakh
    name: Tanakh Amos 7:14
    ref: Amos 7:14
    book: Amos
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 14476
    text: 'Then answered Amos, and said to Amaziah: ‘I was no prophet, neither was I a prophet’s son; but I was a herdman, and a dresser of sycamore-trees;'
    translation: JPS 1917
    original: וַיַּעַן עָמוֹס וַיֹּאמֶר אֶל־אֲמַצְיָה לֹא־נָבִיא אָנֹכִי וְלֹא בֶן־נָבִיא אָנֹכִי כִּי־בוֹקֵר אָנֹכִי וּבוֹלֵס שִׁקְמִים׃
    hebrewPlain: ויען עמוס ויאמר אל אמציה לא נביא אנכי ולא בן נביא אנכי כי בוקר אנכי ובולס שקמים
    kjvRefs:
    - Amos 7:14
    kjvOsis:
    - Amos.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.15
    scripture: tanakh
    name: Tanakh Amos 7:15
    ref: Amos 7:15
    book: Amos
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 14477
    text: 'and the LORD took me from following the flock, and the LORD said unto me: Go, prophesy unto My people Israel.'
    translation: JPS 1917
    original: וַיִּקָּחֵנִי יְהוָה מֵאַחֲרֵי הַצֹּאן וַיֹּאמֶר אֵלַי יְהוָה לֵךְ הִנָּבֵא אֶל־עַמִּי יִשְׂרָאֵל׃
    hebrewPlain: ויקחני יהוה מאחרי הצאן ויאמר אלי יהוה לך הנבא אל עמי ישראל
    kjvRefs:
    - Amos 7:15
    kjvOsis:
    - Amos.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.16
    scripture: tanakh
    name: Tanakh Amos 7:16
    ref: Amos 7:16
    book: Amos
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 14478
    text: 'Now therefore hear thou the word of the LORD: Thou sayest: Prophesy not against Israel, And preach not against the house of Isaac;'
    translation: JPS 1917
    original: וְעַתָּה שְׁמַע דְּבַר־יְהוָה אַתָּה אֹמֵר לֹא תִנָּבֵא עַל־יִשְׂרָאֵל וְלֹא תַטִּיף עַל־בֵּית יִשְׂחָק׃
    hebrewPlain: ועתה שמע דבר יהוה אתה אמר לא תנבא על ישראל ולא תטיף על בית ישחק
    kjvRefs:
    - Amos 7:16
    kjvOsis:
    - Amos.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.7.17
    scripture: tanakh
    name: Tanakh Amos 7:17
    ref: Amos 7:17
    book: Amos
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 14479
    text: 'Therefore thus saith the LORD: Thy wife shall be a harlot in the city, And thy sons and thy daughters shall fall by the sword, And thy land shall be divided by line; And thou thyself shalt die in an unclean land, And Israel shall surely be led away captive out of his land.’'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר יְהוָה אִשְׁתְּךָ בָּעִיר תִּזְנֶה וּבָנֶיךָ וּבְנֹתֶיךָ בַּחֶרֶב יִפֹּלוּ וְאַדְמָתְךָ בַּחֶבֶל תְּחֻלָּק וְאַתָּה עַל־אֲדָמָה טְמֵאָה תָּמוּת וְיִשְׂרָאֵל גָּלֹה יִגְלֶה מֵעַל אַדְמָתוֹ׃
    hebrewPlain: לכן כה אמר יהוה אשתך בעיר תזנה ובניך ובנתיך בחרב יפלו ואדמתך בחבל תחלק ואתה על אדמה טמאה תמות וישראל גלה יגלה מעל אדמתו
    kjvRefs:
    - Amos 7:17
    kjvOsis:
    - Amos.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.7
- type: TanakhVerse
  data:
    osis: Amos.8.1
    scripture: tanakh
    name: Tanakh Amos 8:1
    ref: Amos 8:1
    book: Amos
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 14480
    text: Thus the Lord GOD showed me; and behold a basket of summer fruit.
    translation: JPS 1917
    original: כֹּה הִרְאַנִי אֲדֹנָי יְהוִה וְהִנֵּה כְּלוּב קָיִץ׃
    hebrewPlain: כה הראני אדני יהוה והנה כלוב קיץ
    kjvRefs:
    - Amos 8:1
    kjvOsis:
    - Amos.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.2
    scripture: tanakh
    name: Tanakh Amos 8:2
    ref: Amos 8:2
    book: Amos
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 14481
    text: 'And He said: ‘Amos, what seest thou?’ And I said: ‘A basket of summer fruit.’ Then said the LORD unto me: I will not again pardon them any more.'
    translation: JPS 1917
    original: וַיֹּאמֶר מָה־אַתָּה רֹאֶה עָמוֹס וָאֹמַר כְּלוּב קָיִץ וַיֹּאמֶר יְהוָה אֵלַי בָּא הַקֵּץ אֶל־עַמִּי יִשְׂרָאֵל לֹא־אוֹסִיף עוֹד עֲבוֹר לוֹ׃
    hebrewPlain: ויאמר מה אתה ראה עמוס ואמר כלוב קיץ ויאמר יהוה אלי בא הקץ אל עמי ישראל לא אוסיף עוד עבור לו
    kjvRefs:
    - Amos 8:2
    kjvOsis:
    - Amos.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.3
    scripture: tanakh
    name: Tanakh Amos 8:3
    ref: Amos 8:3
    book: Amos
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 14482
    text: And the songs of the palace shall be wailings in that day, Saith the Lord GOD; The dead bodies shall be many; In every place silence shall be cast.
    translation: JPS 1917
    original: וְהֵילִילוּ שִׁירוֹת הֵיכָל בַּיּוֹם הַהוּא נְאֻם אֲדֹנָי יְהוִה רַב הַפֶּגֶר בְּכָל־מָקוֹם הִשְׁלִיךְ הָס׃
    hebrewPlain: והילילו שירות היכל ביום ההוא נאם אדני יהוה רב הפגר בכל מקום השליך הס
    kjvRefs:
    - Amos 8:3
    kjvOsis:
    - Amos.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.4
    scripture: tanakh
    name: Tanakh Amos 8:4
    ref: Amos 8:4
    book: Amos
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 14483
    text: Hear this, O ye that would swallow the needy, And destroy the poor of the land,
    translation: JPS 1917
    original: שִׁמְעוּ־זֹאת הַשֹּׁאֲפִים אֶבְיוֹן וְלַשְׁבִּית ענוי־[עֲנִיֵּי־] אָרֶץ׃
    hebrewPlain: שמעו זאת השאפים אביון ולשבית ענוי [עניי ] ארץ
    kjvRefs:
    - Amos 8:4
    kjvOsis:
    - Amos.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.5
    scripture: tanakh
    name: Tanakh Amos 8:5
    ref: Amos 8:5
    book: Amos
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 14484
    text: 'Saying: ‘When will the new moon be gone, that we may sell grain? And the sabbath, that we may set forth corn? Making the ephah small, and the shekel great, And falsifying the balances of deceit;'
    translation: JPS 1917
    original: לֵאמֹר מָתַי יַעֲבֹר הַחֹדֶשׁ וְנַשְׁבִּירָה שֶּׁבֶר וְהַשַּׁבָּת וְנִפְתְּחָה־בָּר לְהַקְטִין אֵיפָה וּלְהַגְדִּיל שֶׁקֶל וּלְעַוֵּת מֹאזְנֵי מִרְמָה׃
    hebrewPlain: לאמר מתי יעבר החדש ונשבירה שבר והשבת ונפתחה בר להקטין איפה ולהגדיל שקל ולעות מאזני מרמה
    kjvRefs:
    - Amos 8:5
    kjvOsis:
    - Amos.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.6
    scripture: tanakh
    name: Tanakh Amos 8:6
    ref: Amos 8:6
    book: Amos
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 14485
    text: That we may buy the poor for silver, And the needy for a pair of shoes, And sell the refuse of the corn?’
    translation: JPS 1917
    original: לִקְנוֹת בַּכֶּסֶף דַּלִּים וְאֶבְיוֹן בַּעֲבוּר נַעֲלָיִם וּמַפַּל בַּר נַשְׁבִּיר׃
    hebrewPlain: לקנות בכסף דלים ואביון בעבור נעלים ומפל בר נשביר
    kjvRefs:
    - Amos 8:6
    kjvOsis:
    - Amos.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.7
    scripture: tanakh
    name: Tanakh Amos 8:7
    ref: Amos 8:7
    book: Amos
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 14486
    text: 'The LORD hath sworn by the pride of Jacob: Surely I will never forget any of their works.'
    translation: JPS 1917
    original: נִשְׁבַּע יְהוָה בִּגְאוֹן יַעֲקֹב אִם־אֶשְׁכַּח לָנֶצַח כָּל־מַעֲשֵׂיהֶם׃
    hebrewPlain: נשבע יהוה בגאון יעקב אם אשכח לנצח כל מעשיהם
    kjvRefs:
    - Amos 8:7
    kjvOsis:
    - Amos.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.8
    scripture: tanakh
    name: Tanakh Amos 8:8
    ref: Amos 8:8
    book: Amos
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 14487
    text: Shall not the land tremble for this, And every one mourn that dwelleth therein? Yea, it shall rise up wholly like the River; And it shall be troubled and sink again, like the River of Egypt.
    translation: JPS 1917
    original: הַעַל זֹאת לֹא־תִרְגַּז הָאָרֶץ וְאָבַל כָּל־יוֹשֵׁב בָּהּ וְעָלְתָה כָאֹר כֻּלָּהּ וְנִגְרְשָׁה ונשקה [וְנִשְׁקְעָה] כִּיאוֹר מִצְרָיִם׃
    hebrewPlain: העל זאת לא תרגז הארץ ואבל כל יושב בה ועלתה כאר כלה ונגרשה ונשקה [ונשקעה] כיאור מצרים
    kjvRefs:
    - Amos 8:8
    kjvOsis:
    - Amos.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.9
    scripture: tanakh
    name: Tanakh Amos 8:9
    ref: Amos 8:9
    book: Amos
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 14488
    text: And it shall come to pass in that day, Saith the Lord GOD, That I will cause the sun to go down at noon, And I will darken the earth in the clear day.
    translation: JPS 1917
    original: וְהָיָה בַּיּוֹם הַהוּא נְאֻם אֲדֹנָי יְהוִה וְהֵבֵאתִי הַשֶּׁמֶשׁ בַּצָּהֳרָיִם וְהַחֲשַׁכְתִּי לָאָרֶץ בְּיוֹם אוֹר׃
    hebrewPlain: והיה ביום ההוא נאם אדני יהוה והבאתי השמש בצהרים והחשכתי לארץ ביום אור
    kjvRefs:
    - Amos 8:9
    kjvOsis:
    - Amos.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.10
    scripture: tanakh
    name: Tanakh Amos 8:10
    ref: Amos 8:10
    book: Amos
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 14489
    text: And I will turn your feasts into mourning, And all your songs into lamentation; And I will bring up sackcloth upon all loins, And baldness upon every head; And I will make it as the mourning for an only son, And the end thereof as a bitter day.
    translation: JPS 1917
    original: וְהָפַכְתִּי חַגֵּיכֶם לְאֵבֶל וְכָל־שִׁירֵיכֶם לְקִינָה וְהַעֲלֵיתִי עַל־כָּל־מָתְנַיִם שָׂק וְעַל־כָּל־רֹאשׁ קָרְחָה וְשַׂמְתִּיהָ כְּאֵבֶל יָחִיד וְאַחֲרִיתָהּ כְּיוֹם מָר׃
    hebrewPlain: והפכתי חגיכם לאבל וכל שיריכם לקינה והעליתי על כל מתנים שק ועל כל ראש קרחה ושמתיה כאבל יחיד ואחריתה כיום מר
    kjvRefs:
    - Amos 8:10
    kjvOsis:
    - Amos.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.11
    scripture: tanakh
    name: Tanakh Amos 8:11
    ref: Amos 8:11
    book: Amos
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 14490
    text: Behold, the days come, saith the Lord GOD, That I will send a famine in the land, Not a famine of bread, nor a thirst for water, But of hearing the words of the LORD.
    translation: JPS 1917
    original: הִנֵּה יָמִים בָּאִים נְאֻם אֲדֹנָי יְהוִה וְהִשְׁלַחְתִּי רָעָב בָּאָרֶץ לֹא־רָעָב לַלֶּחֶם וְלֹא־צָמָא לַמַּיִם כִּי אִם־לִשְׁמֹעַ אֵת דִּבְרֵי יְהוָה׃
    hebrewPlain: הנה ימים באים נאם אדני יהוה והשלחתי רעב בארץ לא רעב ללחם ולא צמא למים כי אם לשמע את דברי יהוה
    kjvRefs:
    - Amos 8:11
    kjvOsis:
    - Amos.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.12
    scripture: tanakh
    name: Tanakh Amos 8:12
    ref: Amos 8:12
    book: Amos
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 14491
    text: And they shall wander from sea to sea, And from the north even to the east; They shall run to and fro to seek the word of the LORD, And shall not find it.
    translation: JPS 1917
    original: וְנָעוּ מִיָּם עַד־יָם וּמִצָּפוֹן וְעַד־מִזְרָח יְשׁוֹטְטוּ לְבַקֵּשׁ אֶת־דְּבַר־יְהוָה וְלֹא יִמְצָאוּ׃
    hebrewPlain: ונעו מים עד ים ומצפון ועד מזרח ישוטטו לבקש את דבר יהוה ולא ימצאו
    kjvRefs:
    - Amos 8:12
    kjvOsis:
    - Amos.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.13
    scripture: tanakh
    name: Tanakh Amos 8:13
    ref: Amos 8:13
    book: Amos
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 14492
    text: In that day shall the fair virgins And the young men faint for thirst.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא תִּתְעַלַּפְנָה הַבְּתוּלֹת הַיָּפוֹת וְהַבַּחוּרִים בַּצָּמָא׃
    hebrewPlain: ביום ההוא תתעלפנה הבתולת היפות והבחורים בצמא
    kjvRefs:
    - Amos 8:13
    kjvOsis:
    - Amos.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.8.14
    scripture: tanakh
    name: Tanakh Amos 8:14
    ref: Amos 8:14
    book: Amos
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 14493
    text: 'They that swear by the sin of Samaria, And say: ‘As thy God, O Dan, liveth’; And: ‘As the way of Beer-sheba liveth’; Even they shall fall, and never rise up again.'
    translation: JPS 1917
    original: הַנִּשְׁבָּעִים בְּאַשְׁמַת שֹׁמְרוֹן וְאָמְרוּ חֵי אֱלֹהֶיךָ דָּן וְחֵי דֶּרֶךְ בְּאֵר־שָׁבַע וְנָפְלוּ וְלֹא־יָקוּמוּ עוֹד׃
    hebrewPlain: הנשבעים באשמת שמרון ואמרו חי אלהיך דן וחי דרך באר שבע ונפלו ולא יקומו עוד
    kjvRefs:
    - Amos 8:14
    kjvOsis:
    - Amos.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.8
- type: TanakhVerse
  data:
    osis: Amos.9.1
    scripture: tanakh
    name: Tanakh Amos 9:1
    ref: Amos 9:1
    book: Amos
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 14494
    text: 'I saw the Lord standing beside the altar; and He said: Smite the capitals, that the posts may shake; And break them in pieces on the head of all of them; And I will slay the residue of them with the sword; There shall not one of them flee away, And there shall not one of them escape.'
    translation: JPS 1917
    original: רָאִיתִי אֶת־אֲדֹנָי נִצָּב עַל־הַמִּזְבֵּחַ וַיֹּאמֶר הַךְ הַכַּפְתּוֹר וְיִרְעֲשׁוּ הַסִּפִּים וּבְצַעַם בְּרֹאשׁ כֻּלָּם וְאַחֲרִיתָם בַּחֶרֶב אֶהֱרֹג לֹא־יָנוּס לָהֶם נָס וְלֹא־יִמָּלֵט לָהֶם פָּלִיט׃
    hebrewPlain: ראיתי את אדני נצב על המזבח ויאמר הך הכפתור וירעשו הספים ובצעם בראש כלם ואחריתם בחרב אהרג לא ינוס להם נס ולא ימלט להם פליט
    kjvRefs:
    - Amos 9:1
    kjvOsis:
    - Amos.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.2
    scripture: tanakh
    name: Tanakh Amos 9:2
    ref: Amos 9:2
    book: Amos
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 14495
    text: Though they dig into the nether-world, Thence shall My hand take them; And though they climb up to heaven, Thence will I bring them down.
    translation: JPS 1917
    original: אִם־יַחְתְּרוּ בִשְׁאוֹל מִשָּׁם יָדִי תִקָּחֵם וְאִם־יַעֲלוּ הַשָּׁמַיִם מִשָּׁם אוֹרִידֵם׃
    hebrewPlain: אם יחתרו בשאול משם ידי תקחם ואם יעלו השמים משם אורידם
    kjvRefs:
    - Amos 9:2
    kjvOsis:
    - Amos.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.3
    scripture: tanakh
    name: Tanakh Amos 9:3
    ref: Amos 9:3
    book: Amos
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 14496
    text: And though they hide themselves in the top of Carmel, I will search and take them out thence; And though they be hid from My sight in the bottom of the sea, Thence will I command the serpent, and he shall bite them.
    translation: JPS 1917
    original: וְאִם־יֵחָבְאוּ בְּרֹאשׁ הַכַּרְמֶל מִשָּׁם אֲחַפֵּשׂ וּלְקַחְתִּים וְאִם־יִסָּתְרוּ מִנֶּגֶד עֵינַי בְּקַרְקַע הַיָּם מִשָּׁם אֲצַוֶּה אֶת־הַנָּחָשׁ וּנְשָׁכָם׃
    hebrewPlain: ואם יחבאו בראש הכרמל משם אחפש ולקחתים ואם יסתרו מנגד עיני בקרקע הים משם אצוה את הנחש ונשכם
    kjvRefs:
    - Amos 9:3
    kjvOsis:
    - Amos.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.4
    scripture: tanakh
    name: Tanakh Amos 9:4
    ref: Amos 9:4
    book: Amos
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 14497
    text: And though they go into captivity before their enemies, Thence will I command the sword, and it shall slay them; And I will set Mine eyes upon them For evil, and not for good.
    translation: JPS 1917
    original: וְאִם־יֵלְכוּ בַשְּׁבִי לִפְנֵי אֹיבֵיהֶם מִשָּׁם אֲצַוֶּה אֶת־הַחֶרֶב וַהֲרָגָתַם וְשַׂמְתִּי עֵינִי עֲלֵיהֶם לְרָעָה וְלֹא לְטוֹבָה׃
    hebrewPlain: ואם ילכו בשבי לפני איביהם משם אצוה את החרב והרגתם ושמתי עיני עליהם לרעה ולא לטובה
    kjvRefs:
    - Amos 9:4
    kjvOsis:
    - Amos.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.5
    scripture: tanakh
    name: Tanakh Amos 9:5
    ref: Amos 9:5
    book: Amos
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 14498
    text: For the Lord, the GOD of hosts, Is He that toucheth the land and it melteth, And all that dwell therein mourn; And it riseth up wholly like the River, And sinketh again, like the River of Egypt;
    translation: JPS 1917
    original: וַאדֹנָי יְהוִה הַצְּבָאוֹת הַנּוֹגֵעַ בָּאָרֶץ וַתָּמוֹג וְאָבְלוּ כָּל־יוֹשְׁבֵי בָהּ וְעָלְתָה כַיְאֹר כֻּלָּהּ וְשָׁקְעָה כִּיאֹר מִצְרָיִם
    hebrewPlain: ואדני יהוה הצבאות הנוגע בארץ ותמוג ואבלו כל יושבי בה ועלתה כיאר כלה ושקעה כיאר מצרים
    kjvRefs:
    - Amos 9:5
    kjvOsis:
    - Amos.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.6
    scripture: tanakh
    name: Tanakh Amos 9:6
    ref: Amos 9:6
    book: Amos
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 14499
    text: It is He that buildeth His upper chambers in the heaven, And hath founded His vault upon the earth; He that calleth for the waters of the sea, And poureth them out upon the face of the earth; The LORD is His name.
    translation: JPS 1917
    original: הַבּוֹנֶה בַשָּׁמַיִם מעלותו [מַעֲלוֹתָיו] וַאֲגֻדָּתוֹ עַל־אֶרֶץ יְסָדָהּ הַקֹּרֵא לְמֵי־הַיָּם וַיִּשְׁפְּכֵם עַל־פְּנֵי הָאָרֶץ יְהוָה שְׁמוֹ׃
    hebrewPlain: הבונה בשמים מעלותו [מעלותיו] ואגדתו על ארץ יסדה הקרא למי הים וישפכם על פני הארץ יהוה שמו
    kjvRefs:
    - Amos 9:6
    kjvOsis:
    - Amos.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.7
    scripture: tanakh
    name: Tanakh Amos 9:7
    ref: Amos 9:7
    book: Amos
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 14500
    text: Are ye not as the children of the Ethiopians unto Me, O children of Israel? saith the LORD. Have not I brought up Israel out of the land of Egypt, And the Philistines from Caphtor, And Aram from Kir?
    translation: JPS 1917
    original: הֲלוֹא כִבְנֵי כֻשִׁיִּים אַתֶּם לִי בְּנֵי יִשְׂרָאֵל נְאֻם־יְהוָה הֲלוֹא אֶת־יִשְׂרָאֵל הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם וּפְלִשְׁתִּיִּים מִכַּפְתּוֹר וַאֲרָם מִקִּיר׃
    hebrewPlain: הלוא כבני כשיים אתם לי בני ישראל נאם יהוה הלוא את ישראל העליתי מארץ מצרים ופלשתיים מכפתור וארם מקיר
    kjvRefs:
    - Amos 9:7
    kjvOsis:
    - Amos.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.8
    scripture: tanakh
    name: Tanakh Amos 9:8
    ref: Amos 9:8
    book: Amos
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 14501
    text: Behold, the eyes of the Lord GOD Are upon the sinful kingdom, And I will destroy it from off the face of the earth; Saving that I will not utterly destroy the house of Jacob, Saith the LORD.
    translation: JPS 1917
    original: הִנֵּה עֵינֵי אֲדֹנָי יְהוִה בַּמַּמְלָכָה הַחַטָּאָה וְהִשְׁמַדְתִּי אֹתָהּ מֵעַל פְּנֵי הָאֲדָמָה אֶפֶס כִּי לֹא הַשְׁמֵיד אַשְׁמִיד אֶת־בֵּית יַעֲקֹב נְאֻם־יְהוָה׃
    hebrewPlain: הנה עיני אדני יהוה בממלכה החטאה והשמדתי אתה מעל פני האדמה אפס כי לא השמיד אשמיד את בית יעקב נאם יהוה
    kjvRefs:
    - Amos 9:8
    kjvOsis:
    - Amos.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.9
    scripture: tanakh
    name: Tanakh Amos 9:9
    ref: Amos 9:9
    book: Amos
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 14502
    text: For, lo, I will command, and I will sift the house of Israel among all the nations, Like as corn is sifted in a sieve, Yet shall not the least grain fall upon the earth.
    translation: JPS 1917
    original: כִּי־הִנֵּה אָנֹכִי מְצַוֶּה וַהֲנִעוֹתִי בְכָל־הַגּוֹיִם אֶת־בֵּית יִשְׂרָאֵל כַּאֲשֶׁר יִנּוֹעַ בַּכְּבָרָה וְלֹא־יִפּוֹל צְרוֹר אָרֶץ׃
    hebrewPlain: כי הנה אנכי מצוה והנעותי בכל הגוים את בית ישראל כאשר ינוע בכברה ולא יפול צרור ארץ
    kjvRefs:
    - Amos 9:9
    kjvOsis:
    - Amos.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.10
    scripture: tanakh
    name: Tanakh Amos 9:10
    ref: Amos 9:10
    book: Amos
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 14503
    text: 'All the sinners of My people shall die by the sword, That say: ‘The evil shall not overtake nor confront us.’ .'
    translation: JPS 1917
    original: בַּחֶרֶב יָמוּתוּ כֹּל חַטָּאֵי עַמִּי הָאֹמְרִים לֹא־תַגִּישׁ וְתַקְדִּים בַּעֲדֵינוּ הָרָעָה׃
    hebrewPlain: בחרב ימותו כל חטאי עמי האמרים לא תגיש ותקדים בעדינו הרעה
    kjvRefs:
    - Amos 9:10
    kjvOsis:
    - Amos.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.11
    scripture: tanakh
    name: Tanakh Amos 9:11
    ref: Amos 9:11
    book: Amos
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 14504
    text: In that day will I raise up The tabernacle of David that is fallen, And close up the breaches thereof, And I will raise up his ruins, And I will build it as in the days of old;
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא אָקִים אֶת־סֻכַּת דָּוִיד הַנֹּפֶלֶת וְגָדַרְתִּי אֶת־פִּרְצֵיהֶן וַהֲרִסֹתָיו אָקִים וּבְנִיתִיהָ כִּימֵי עוֹלָם׃
    hebrewPlain: ביום ההוא אקים את סכת דויד הנפלת וגדרתי את פרציהן והרסתיו אקים ובניתיה כימי עולם
    kjvRefs:
    - Amos 9:11
    kjvOsis:
    - Amos.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.12
    scripture: tanakh
    name: Tanakh Amos 9:12
    ref: Amos 9:12
    book: Amos
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 14505
    text: That they may possess the remnant of Edom, And all the nations, upon whom My name is called, Saith the LORD that doeth this.
    translation: JPS 1917
    original: לְמַעַן יִירְשׁוּ אֶת־שְׁאֵרִית אֱדוֹם וְכָל־הַגּוֹיִם אֲשֶׁר־נִקְרָא שְׁמִי עֲלֵיהֶם נְאֻם־יְהוָה עֹשֶׂה זֹּאת׃
    hebrewPlain: למען יירשו את שארית אדום וכל הגוים אשר נקרא שמי עליהם נאם יהוה עשה זאת
    kjvRefs:
    - Amos 9:12
    kjvOsis:
    - Amos.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.13
    scripture: tanakh
    name: Tanakh Amos 9:13
    ref: Amos 9:13
    book: Amos
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 14506
    text: Behold, the days come, saith the LORD, That the plowman shall overtake the reaper, And the treader of grapes him that soweth seed; And the mountains shall drop sweet wine, And all the hills shall melt.
    translation: JPS 1917
    original: הִנֵּה יָמִים בָּאִים נְאֻם־יְהוָה וְנִגַּשׁ חוֹרֵשׁ בַּקֹּצֵר וְדֹרֵךְ עֲנָבִים בְּמֹשֵׁךְ הַזָּרַע וְהִטִּיפוּ הֶהָרִים עָסִיס וְכָל־הַגְּבָעוֹת תִּתְמוֹגַגְנָה׃
    hebrewPlain: הנה ימים באים נאם יהוה ונגש חורש בקצר ודרך ענבים במשך הזרע והטיפו ההרים עסיס וכל הגבעות תתמוגגנה
    kjvRefs:
    - Amos 9:13
    kjvOsis:
    - Amos.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.14
    scripture: tanakh
    name: Tanakh Amos 9:14
    ref: Amos 9:14
    book: Amos
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 14507
    text: And I will turn the captivity of My people Israel, And they shall build the waste cities, and inhabit them; And they shall plant vineyards, and drink the wine thereof; They shall also make gardens, and eat the fruit of them.
    translation: JPS 1917
    original: וְשַׁבְתִּי אֶת־שְׁבוּת עַמִּי יִשְׂרָאֵל וּבָנוּ עָרִים נְשַׁמּוֹת וְיָשָׁבוּ וְנָטְעוּ כְרָמִים וְשָׁתוּ אֶת־יֵינָם וְעָשׂוּ גַנּוֹת וְאָכְלוּ אֶת־פְּרִיהֶם׃
    hebrewPlain: ושבתי את שבות עמי ישראל ובנו ערים נשמות וישבו ונטעו כרמים ושתו את יינם ועשו גנות ואכלו את פריהם
    kjvRefs:
    - Amos 9:14
    kjvOsis:
    - Amos.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
- type: TanakhVerse
  data:
    osis: Amos.9.15
    scripture: tanakh
    name: Tanakh Amos 9:15
    ref: Amos 9:15
    book: Amos
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 14508
    text: And I will plant them upon their land, And they shall no more be plucked up Out of their land which I have given them, Saith the LORD thy God.
    translation: JPS 1917
    original: וּנְטַעְתִּים עַל־אַדְמָתָם וְלֹא יִנָּתְשׁוּ עוֹד מֵעַל אַדְמָתָם אֲשֶׁר נָתַתִּי לָהֶם אָמַר יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ונטעתים על אדמתם ולא ינתשו עוד מעל אדמתם אשר נתתי להם אמר יהוה אלהיך
    kjvRefs:
    - Amos 9:15
    kjvOsis:
    - Amos.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Amos.9
