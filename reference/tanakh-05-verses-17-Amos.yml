- type: TanakhVerse
  data:
    osis: Amos.1.5
    scripture: tanakh
    name: Tanakh Amos 1:5
    ref: Amos 1:5
    book: Amos
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14367
    text: And I will break the bar of Damascus, and cut off the inhabitant from Bikath-Aven, and him that holdeth the sceptre from Beth-eden; and the people of Aram shall go into captivity unto Kir, saith the LORD.
    translation: JPS 1917
    original: וְשָׁבַרְתִּי בְּרִיחַ דַּמֶּשֶׂק וְהִכְרַתִּי יוֹשֵׁב מִבִּקְעַת־אָוֶן וְתוֹמֵךְ שֵׁבֶט מִבֵּית עֶדֶן וְגָלוּ עַם־אֲרָם קִירָה אָמַר יְהוָה׃
    hebrewPlain: ושברתי בריח דמשק והכרתי יושב מבקעת און ותומך שבט מבית עדן וגלו עם ארם קירה אמר יהוה
    kjvRefs:
    - Amos 1:5
    kjvOsis:
    - Amos.1.5
  relations:
