    ref: Amos 1:15
    book: Amos
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14377
    text: And their king shall go into captivity, he and his princes together, saith the LORD.
    translation: JPS 1917
    original: וְהָלַךְ מַלְכָּם בַּגּוֹלָה הוּא וְשָׂרָיו יַחְדָּו אָמַר יְהוָה׃
    hebrewPlain: והלך מלכם בגולה הוא ושריו יחדו אמר יהוה
    kjvRefs:
