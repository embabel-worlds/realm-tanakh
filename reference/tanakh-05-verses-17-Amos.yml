    name: Tanakh Amos 1:14
    ref: Amos 1:14
    book: Amos
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14376
    text: So will I kindle a fire in the wall of Rabbah, and it shall devour the palaces thereof, with shouting in the day of battle, with a tempest in the day of the whirlwind;
    translation: JPS 1917
    original: וְהִצַּתִּי אֵשׁ בְּחוֹמַת רַבָּה וְאָכְלָה אַרְמְנוֹתֶיהָ בִּתְרוּעָה בְּיוֹם מִלְחָמָה בְּסַעַר בְּיוֹם סוּפָה
    hebrewPlain: והצתי אש בחומת רבה ואכלה ארמנותיה בתרועה ביום מלחמה בסער ביום סופה
    kjvRefs:
