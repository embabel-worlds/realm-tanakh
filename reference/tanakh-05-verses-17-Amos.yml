    ref: Amos 1:8
    book: Amos
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14370
    text: And I will cut off the inhabitant from Ashdod, and him that holdeth the sceptre from Ashkelon; and I will turn My hand against Ekron, and the remnant of the Philistines shall perish, saith the Lord GOD.
    translation: JPS 1917
    original: וְהִכְרַתִּי יוֹשֵׁב מֵאַשְׁדּוֹד וְתוֹמֵךְ שֵׁבֶט מֵאַשְׁקְלוֹן וַהֲשִׁיבוֹתִי יָדִי עַל־עֶקְרוֹן וְאָבְדוּ שְׁאֵרִית פְּלִשְׁתִּים אָמַר אֲדֹנָי יְהוִה׃
    hebrewPlain: והכרתי יושב מאשדוד ותומך שבט מאשקלון והשיבותי ידי על עקרון ואבדו שארית פלשתים אמר אדני יהוה
    kjvRefs:
    - Amos 1:8
    kjvOsis:
    - Amos.1.8
