    scripture: tanakh
    name: Tanakh Amos 1:3
    ref: Amos 1:3
    book: Amos
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14365
    text: 'For thus saith the LORD: For three transgressions of Damascus, yea, for four, I will not reverse it: because they have threshed Gilead with sledges of iron.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־דּוּשָׁם בַּחֲרֻצוֹת הַבַּרְזֶל אֶת־הַגִּלְעָד׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי דמשק ועל ארבעה לא אשיבנו על דושם בחרצות הברזל את הגלעד
    kjvRefs:
    - Amos 1:3
    kjvOsis:
    - Amos.1.3
  relations:
