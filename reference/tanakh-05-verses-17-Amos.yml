    translation: JPS 1917
    original: וְהִכְרַתִּי שׁוֹפֵט מִקִּרְבָּהּ וְכָל־שָׂרֶיהָ אֶהֱרוֹג עִמּוֹ אָמַר יְהוָה׃
    hebrewPlain: והכרתי שופט מקרבה וכל שריה אהרוג עמו אמר יהוה
