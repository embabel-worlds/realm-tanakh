  data:
    osis: Amos.1.11
    scripture: tanakh
    name: Tanakh Amos 1:11
    ref: Amos 1:11
    book: Amos
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14373
    text: 'Thus saith the LORD: For three transgressions of Edom, yea, for four, I will not reverse it: because he did pursue his brother with the sword, and did cast off all pity, and his anger did tear perpetually, and he kept his wrath for ever.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי אֱדוֹם וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־רָדְפוֹ בַחֶרֶב אָחִיו וְשִׁחֵת רַחֲמָיו וַיִּטְרֹף לָעַד אַפּוֹ וְעֶבְרָתוֹ שְׁמָרָה נֶצַח׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי אדום ועל ארבעה לא אשיבנו על רדפו בחרב אחיו ושחת רחמיו ויטרף לעד אפו ועברתו שמרה נצח
    kjvRefs:
    - Amos 1:11
    kjvOsis:
