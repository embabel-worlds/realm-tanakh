- type: TanakhVerse
  data:
    osis: Amos.1.6
    scripture: tanakh
    name: Tanakh Amos 1:6
    ref: Amos 1:6
    book: Amos
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14368
    text: 'Thus saith the LORD: For three transgressions of Gaza, yea, for four, I will not reverse it: because they carried away captive a whole captivity, to deliver them up to Edom.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי עַזָּה וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־הַגְלוֹתָם גָּלוּת שְׁלֵמָה לְהַסְגִּיר לֶאֱדוֹם׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי עזה ועל ארבעה לא אשיבנו על הגלותם גלות שלמה להסגיר לאדום
    kjvRefs:
    - Amos 1:6
    kjvOsis:
    - Amos.1.6
  relations:
