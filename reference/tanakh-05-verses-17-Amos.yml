    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14378
    text: 'Thus saith the LORD: For three transgressions of Moab, Yea, for four, I will not reverse it: Because he burned the bones of the king of Edom into lime.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־שָׂרְפוֹ עַצְמוֹת מֶלֶךְ־אֱדוֹם לַשִּׂיד׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי מואב ועל ארבעה לא אשיבנו על שרפו עצמות מלך אדום לשיד
