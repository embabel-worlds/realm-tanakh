    scripture: tanakh
    name: Tanakh Amos 1:13
    ref: Amos 1:13
    book: Amos
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14375
    text: 'Thus saith the LORD: For three transgressions of the children of Ammon, yea, for four, I will not reverse it: because they have ripped up the women with child of Gilead, that they might enlarge their border.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה עַל־שְׁלֹשָׁה פִּשְׁעֵי בְנֵי־עַמּוֹן וְעַל־אַרְבָּעָה לֹא אֲשִׁיבֶנּוּ עַל־בִּקְעָם הָרוֹת הַגִּלְעָד לְמַעַן הַרְחִיב אֶת־גְּבוּלָם׃
    hebrewPlain: כה אמר יהוה על שלשה פשעי בני עמון ועל ארבעה לא אשיבנו על בקעם הרות הגלעד למען הרחיב את גבולם
    kjvRefs:
    - Amos 1:13
    kjvOsis:
    - Amos.1.13
  relations:
