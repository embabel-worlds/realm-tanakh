- type: TanakhVerse
  data:
    osis: Jonah.2.1
    scripture: tanakh
    name: Tanakh Jonah 2:1
    ref: Jonah 2:1
    book: Jonah
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14546
    text: And the LORD prepared a great fish to swallow up Jonah; and Jonah was in the belly of the fish three days and three nights.
    translation: JPS 1917
    original: וַיְמַן יְהוָה דָּג גָּדוֹל לִבְלֹעַ אֶת־יוֹנָה וַיְהִי יוֹנָה בִּמְעֵי הַדָּג שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת׃
    hebrewPlain: וימן יהוה דג גדול לבלע את יונה ויהי יונה במעי הדג שלשה ימים ושלשה לילות
    kjvRefs:
    - Jonah 1:17
    kjvOsis:
    - Jonah.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.2
    scripture: tanakh
    name: Tanakh Jonah 2:2
    ref: Jonah 2:2
    book: Jonah
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14547
    text: Then Jonah prayed unto the LORD his God out of the fish’s belly.
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל יוֹנָה אֶל־יְהוָה אֱלֹהָיו מִמְּעֵי הַדָּגָה׃
    hebrewPlain: ויתפלל יונה אל יהוה אלהיו ממעי הדגה
    kjvRefs:
    - Jonah 2:1
    kjvOsis:
    - Jonah.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.3
    scripture: tanakh
    name: Tanakh Jonah 2:3
    ref: Jonah 2:3
    book: Jonah
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14548
    text: 'And he said: I called out of mine affliction Unto the LORD, and He answered me; Out of the belly of the nether-world cried I, And Thou heardest my voice.'
    translation: JPS 1917
    original: וַיֹּאמֶר קָרָאתִי מִצָּרָה לִי אֶל־יְהוָה וַיַּעֲנֵנִי מִבֶּטֶן שְׁאוֹל שִׁוַּעְתִּי שָׁמַעְתָּ קוֹלִי׃
    hebrewPlain: ויאמר קראתי מצרה לי אל יהוה ויענני מבטן שאול שועתי שמעת קולי
    kjvRefs:
    - Jonah 2:2
    kjvOsis:
    - Jonah.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.4
    scripture: tanakh
    name: Tanakh Jonah 2:4
    ref: Jonah 2:4
    book: Jonah
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14549
    text: For Thou didst cast me into the depth, In the heart of the seas, And the flood was round about me; All Thy waves and Thy billows Passed over me.
    translation: JPS 1917
    original: וַתַּשְׁלִיכֵנִי מְצוּלָה בִּלְבַב יַמִּים וְנָהָר יְסֹבְבֵנִי כָּל־מִשְׁבָּרֶיךָ וְגַלֶּיךָ עָלַי עָבָרוּ׃
    hebrewPlain: ותשליכני מצולה בלבב ימים ונהר יסבבני כל משבריך וגליך עלי עברו
    kjvRefs:
    - Jonah 2:3
    kjvOsis:
    - Jonah.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.5
    scripture: tanakh
    name: Tanakh Jonah 2:5
    ref: Jonah 2:5
    book: Jonah
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14550
    text: 'And I said: ‘I am cast out From before Thine eyes’; Yet I will look again Toward Thy holy temple.'
    translation: JPS 1917
    original: וַאֲנִי אָמַרְתִּי נִגְרַשְׁתִּי מִנֶּגֶד עֵינֶיךָ אַךְ אוֹסִיף לְהַבִּיט אֶל־הֵיכַל קָדְשֶׁךָ׃
    hebrewPlain: ואני אמרתי נגרשתי מנגד עיניך אך אוסיף להביט אל היכל קדשך
    kjvRefs:
    - Jonah 2:4
    kjvOsis:
    - Jonah.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.6
    scripture: tanakh
    name: Tanakh Jonah 2:6
    ref: Jonah 2:6
    book: Jonah
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14551
    text: The waters compassed me about, even to the soul; The deep was round about me; The weeds were wrapped about my head.
    translation: JPS 1917
    original: אֲפָפוּנִי מַיִם עַד־נֶפֶשׁ תְּהוֹם יְסֹבְבֵנִי סוּף חָבוּשׁ לְרֹאשִׁי׃
    hebrewPlain: אפפוני מים עד נפש תהום יסבבני סוף חבוש לראשי
    kjvRefs:
    - Jonah 2:5
    kjvOsis:
    - Jonah.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.7
    scripture: tanakh
    name: Tanakh Jonah 2:7
    ref: Jonah 2:7
    book: Jonah
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14552
    text: I went down to the bottoms of the mountains; The earth with her bars closed upon me for ever; Yet hast Thou brought up my life from the pit, O LORD my God.
    translation: JPS 1917
    original: לְקִצְבֵי הָרִים יָרַדְתִּי הָאָרֶץ בְּרִחֶיהָ בַעֲדִי לְעוֹלָם וַתַּעַל מִשַּׁחַת חַיַּי יְהוָה אֱלֹהָי׃
    hebrewPlain: לקצבי הרים ירדתי הארץ ברחיה בעדי לעולם ותעל משחת חיי יהוה אלהי
    kjvRefs:
    - Jonah 2:6
    kjvOsis:
    - Jonah.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.8
    scripture: tanakh
    name: Tanakh Jonah 2:8
    ref: Jonah 2:8
    book: Jonah
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14553
    text: When my soul fainted within me, I remembered the LORD; And my prayer came in unto Thee, Into Thy holy temple.
    translation: JPS 1917
    original: בְּהִתְעַטֵּף עָלַי נַפְשִׁי אֶת־יְהוָה זָכָרְתִּי וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי אֶל־הֵיכַל קָדְשֶׁךָ׃
    hebrewPlain: בהתעטף עלי נפשי את יהוה זכרתי ותבוא אליך תפלתי אל היכל קדשך
    kjvRefs:
    - Jonah 2:7
    kjvOsis:
    - Jonah.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.9
    scripture: tanakh
    name: Tanakh Jonah 2:9
    ref: Jonah 2:9
    book: Jonah
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14554
    text: They that regard lying vanities Forsake their own mercy.
    translation: JPS 1917
    original: מְשַׁמְּרִים הַבְלֵי־שָׁוְא חַסְדָּם יַעֲזֹבוּ׃
    hebrewPlain: משמרים הבלי שוא חסדם יעזבו
    kjvRefs:
    - Jonah 2:8
    kjvOsis:
    - Jonah.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.10
    scripture: tanakh
    name: Tanakh Jonah 2:10
    ref: Jonah 2:10
    book: Jonah
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14555
    text: But I will sacrifice unto Thee With the voice of thanksgiving; That which I have vowed I will pay. Salvation is of the LORD.
    translation: JPS 1917
    original: וַאֲנִי בְּקוֹל תּוֹדָה אֶזְבְּחָה־לָּךְ אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה יְשׁוּעָתָה לַיהוָה׃
    hebrewPlain: ואני בקול תודה אזבחה לך אשר נדרתי אשלמה ישועתה ליהוה
    kjvRefs:
    - Jonah 2:9
    kjvOsis:
    - Jonah.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.2.11
    scripture: tanakh
    name: Tanakh Jonah 2:11
    ref: Jonah 2:11
    book: Jonah
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14556
    text: And the LORD spoke unto the fish, and it vomited out Jonah upon the dry land.
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה לַדָּג וַיָּקֵא אֶת־יוֹנָה אֶל־הַיַּבָּשָׁה׃
    hebrewPlain: ויאמר יהוה לדג ויקא את יונה אל היבשה
    kjvRefs:
    - Jonah 2:10
    kjvOsis:
    - Jonah.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.2
- type: TanakhVerse
  data:
    osis: Jonah.3.1
    scripture: tanakh
    name: Tanakh Jonah 3:1
    ref: Jonah 3:1
    book: Jonah
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14557
    text: 'And the word of the LORD came unto Jonah the second time, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֶל־יוֹנָה שֵׁנִית לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אל יונה שנית לאמר
    kjvRefs:
    - Jonah 3:1
    kjvOsis:
    - Jonah.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.2
    scripture: tanakh
    name: Tanakh Jonah 3:2
    ref: Jonah 3:2
    book: Jonah
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14558
    text: ’Arise, go unto Nineveh, that great city, and make unto it the proclamation that I bid thee.’
    translation: JPS 1917
    original: קוּם לֵךְ אֶל־נִינְוֵה הָעִיר הַגְּדוֹלָה וִּקְרָא אֵלֶיהָ אֶת־הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ׃
    hebrewPlain: קום לך אל נינוה העיר הגדולה וקרא אליה את הקריאה אשר אנכי דבר אליך
    kjvRefs:
    - Jonah 3:2
    kjvOsis:
    - Jonah.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.3
    scripture: tanakh
    name: Tanakh Jonah 3:3
    ref: Jonah 3:3
    book: Jonah
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14559
    text: So Jonah arose, and went unto Nineveh, according to the word of the LORD. Now Nineveh was an exceeding great city, of three days’ journey.
    translation: JPS 1917
    original: וַיָּקָם יוֹנָה וַיֵּלֶךְ אֶל־נִינְוֶה כִּדְבַר יְהוָה וְנִינְוֵה הָיְתָה עִיר־גְּדוֹלָה לֵאלֹהִים מַהֲלַךְ שְׁלֹשֶׁת יָמִים׃
    hebrewPlain: ויקם יונה וילך אל נינוה כדבר יהוה ונינוה היתה עיר גדולה לאלהים מהלך שלשת ימים
    kjvRefs:
    - Jonah 3:3
    kjvOsis:
    - Jonah.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.4
    scripture: tanakh
    name: Tanakh Jonah 3:4
    ref: Jonah 3:4
    book: Jonah
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14560
    text: 'And Jonah began to enter into the city a day’s journey, and he proclaimed, and said: ‘Yet forty days, and Nineveh shall be overthrown.’'
    translation: JPS 1917
    original: וַיָּחֶל יוֹנָה לָבוֹא בָעִיר מַהֲלַךְ יוֹם אֶחָד וַיִּקְרָא וַיֹּאמַר עוֹד אַרְבָּעִים יוֹם וְנִינְוֵה נֶהְפָּכֶת׃
    hebrewPlain: ויחל יונה לבוא בעיר מהלך יום אחד ויקרא ויאמר עוד ארבעים יום ונינוה נהפכת
    kjvRefs:
    - Jonah 3:4
    kjvOsis:
    - Jonah.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.5
    scripture: tanakh
    name: Tanakh Jonah 3:5
    ref: Jonah 3:5
    book: Jonah
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14561
    text: And the people of Nineveh believed God; and they proclaimed a fast, and put on sackcloth, from the greatest of them even to the least of them.
    translation: JPS 1917
    original: וַיַּאֲמִינוּ אַנְשֵׁי נִינְוֵה בֵּאלֹהִים וַיִּקְרְאוּ־צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד־קְטַנָּם׃
    hebrewPlain: ויאמינו אנשי נינוה באלהים ויקראו צום וילבשו שקים מגדולם ועד קטנם
    kjvRefs:
    - Jonah 3:5
    kjvOsis:
    - Jonah.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.6
    scripture: tanakh
    name: Tanakh Jonah 3:6
    ref: Jonah 3:6
    book: Jonah
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14562
    text: And the tidings reached the king of Nineveh, and he arose from his throne, and laid his robe from him, and covered him with sackcloth, and sat in ashes.
    translation: JPS 1917
    original: וַיִּגַּע הַדָּבָר אֶל־מֶלֶך נִינְוֵה וַיָּקָם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל־הָאֵפֶר׃
    hebrewPlain: ויגע הדבר אל מלך נינוה ויקם מכסאו ויעבר אדרתו מעליו ויכס שק וישב על האפר
    kjvRefs:
    - Jonah 3:6
    kjvOsis:
    - Jonah.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.7
    scripture: tanakh
    name: Tanakh Jonah 3:7
    ref: Jonah 3:7
    book: Jonah
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14563
    text: 'And he caused it to be proclaimed and published through Nineveh by the decree of the king and his nobles, saying: ‘Let neither man nor beast, herd nor flock, taste any thing; let them not feed, nor drink water;'
    translation: JPS 1917
    original: וַיַּזְעֵק וַיֹּאמֶר בְּנִינְוֵה מִטַּעַם הַמֶּלֶךְ וּגְדֹלָיו לֵאמֹר הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַל־יִטְעֲמוּ מְאוּמָה אַל־יִרְעוּ וּמַיִם אַל־יִשְׁתּוּ׃
    hebrewPlain: ויזעק ויאמר בנינוה מטעם המלך וגדליו לאמר האדם והבהמה הבקר והצאן אל יטעמו מאומה אל ירעו ומים אל ישתו
    kjvRefs:
    - Jonah 3:7
    kjvOsis:
    - Jonah.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.8
    scripture: tanakh
    name: Tanakh Jonah 3:8
    ref: Jonah 3:8
    book: Jonah
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14564
    text: but let them be covered with sackcloth, both man and beast, and let them cry mightily unto God; yea, let them turn every one from his evil way, and from the violence that is in their hands.
    translation: JPS 1917
    original: וְיִתְכַּסּוּ שַׂקִּים הָאָדָם וְהַבְּהֵמָה וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחָזְקָה וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם׃
    hebrewPlain: ויתכסו שקים האדם והבהמה ויקראו אל אלהים בחזקה וישבו איש מדרכו הרעה ומן החמס אשר בכפיהם
    kjvRefs:
    - Jonah 3:8
    kjvOsis:
    - Jonah.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.9
    scripture: tanakh
    name: Tanakh Jonah 3:9
    ref: Jonah 3:9
    book: Jonah
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14565
    text: Who knoweth whether God will not turn and repent, and turn away from His fierce anger, that we perish not?’
    translation: JPS 1917
    original: מִי־יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵד׃
    hebrewPlain: מי יודע ישוב ונחם האלהים ושב מחרון אפו ולא נאבד
    kjvRefs:
    - Jonah 3:9
    kjvOsis:
    - Jonah.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.3.10
    scripture: tanakh
    name: Tanakh Jonah 3:10
    ref: Jonah 3:10
    book: Jonah
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14566
    text: And God saw their works, that they turned from their evil way; and God repented of the evil, which He said He would do unto them; and He did it not.
    translation: JPS 1917
    original: וַיַּרְא הָאֱלֹהִים אֶת־מַעֲשֵׂיהֶם כִּי־שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל־הָרָעָה אֲשֶׁר־דִּבֶּר לַעֲשׂוֹת־לָהֶם וְלֹא עָשָׂה׃
    hebrewPlain: וירא האלהים את מעשיהם כי שבו מדרכם הרעה וינחם האלהים על הרעה אשר דבר לעשות להם ולא עשה
    kjvRefs:
    - Jonah 3:10
    kjvOsis:
    - Jonah.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.3
- type: TanakhVerse
  data:
    osis: Jonah.4.1
    scripture: tanakh
    name: Tanakh Jonah 4:1
    ref: Jonah 4:1
    book: Jonah
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 14567
    text: But it displeased Jonah exceedingly, and he was angry.
    translation: JPS 1917
    original: וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לוֹ׃
    hebrewPlain: וירע אל יונה רעה גדולה ויחר לו
    kjvRefs:
    - Jonah 4:1
    kjvOsis:
    - Jonah.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.2
    scripture: tanakh
    name: Tanakh Jonah 4:2
    ref: Jonah 4:2
    book: Jonah
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 14568
    text: 'And he prayed unto the LORD, and said: ‘I pray Thee, O LORD, was not this my saying, when I was yet in mine own country? Therefore I fled beforehand unto Tarshish; for I knew that Thou art a gracious God, and compassionate, long-suffering, and abundant in mercy, and repentest Thee of the evil.'
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל אֶל־יְהוָה וַיֹּאמַר אָנָּה יְהוָה הֲלוֹא־זֶה דְבָרִי עַד־הֱיוֹתִי עַל־אַדְמָתִי עַל־כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵל־חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וְנִחָם עַל־הָרָעָה׃
    hebrewPlain: ויתפלל אל יהוה ויאמר אנה יהוה הלוא זה דברי עד היותי על אדמתי על כן קדמתי לברח תרשישה כי ידעתי כי אתה אל חנון ורחום ארך אפים ורב חסד ונחם על הרעה
    kjvRefs:
    - Jonah 4:2
    kjvOsis:
    - Jonah.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.3
    scripture: tanakh
    name: Tanakh Jonah 4:3
    ref: Jonah 4:3
    book: Jonah
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 14569
    text: Therefore now, O LORD, take, I beseech Thee, my life from me; for it is better for me to die than to live.’
    translation: JPS 1917
    original: וְעַתָּה יְהוָה קַח־נָא אֶת־נַפְשִׁי מִמֶּנִּי כִּי טוֹב מוֹתִי מֵחַיָּי׃
    hebrewPlain: ועתה יהוה קח נא את נפשי ממני כי טוב מותי מחיי
    kjvRefs:
    - Jonah 4:3
    kjvOsis:
    - Jonah.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.4
    scripture: tanakh
    name: Tanakh Jonah 4:4
    ref: Jonah 4:4
    book: Jonah
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 14570
    text: 'And the LORD said: ‘Art thou greatly angry?’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה הַהֵיטֵב חָרָה לָךְ׃
    hebrewPlain: ויאמר יהוה ההיטב חרה לך
    kjvRefs:
