- type: TanakhVerse
  data:
    osis: Jonah.1.3
    scripture: tanakh
    name: Tanakh Jonah 1:3
    ref: Jonah 1:3
    book: Jonah
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14532
    text: But Jonah rose up to flee unto Tarshish from the presence of the LORD; and he went down to Joppa, and found a ship going to Tarshish; so he paid the fare thereof, and went down into it, to go with them unto Tarshish, from the presence of the LORD.
    translation: JPS 1917
    original: וַיָּקָם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי יְהוָה וַיֵּרֶד יָפוֹ וַיִּמְצָא אָנִיָּה בָּאָה תַרְשִׁישׁ וַיִּתֵּן שְׂכָרָהּ וַיֵּרֶד בָּהּ לָבוֹא עִמָּהֶם תַּרְשִׁישָׁה מִלִּפְנֵי יְהוָה׃
    hebrewPlain: ויקם יונה לברח תרשישה מלפני יהוה וירד יפו וימצא אניה באה תרשיש ויתן שכרה וירד בה לבוא עמהם תרשישה מלפני יהוה
    kjvRefs:
    - Jonah 1:3
    kjvOsis:
    - Jonah.1.3
