- type: TanakhVerse
  data:
    osis: Jonah.4.5
    scripture: tanakh
    name: Tanakh Jonah 4:5
    ref: Jonah 4:5
    book: Jonah
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 14571
    text: Then Jonah went out of the city, and sat on the east side of the city, and there made him a booth, and sat under it in the shadow, till he might see what would become of the city.
    translation: JPS 1917
    original: וַיֵּצֵא יוֹנָה מִן־הָעִיר וַיֵּשֶׁב מִקֶּדֶם לָעִיר וַיַּעַשׂ לוֹ שָׁם סֻכָּה וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל עַד אֲשֶׁר יִרְאֶה מַה־יִּהְיֶה בָּעִיר׃
    hebrewPlain: ויצא יונה מן העיר וישב מקדם לעיר ויעש לו שם סכה וישב תחתיה בצל עד אשר יראה מה יהיה בעיר
    kjvRefs:
    - Jonah 4:5
    kjvOsis:
    - Jonah.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.6
    scripture: tanakh
    name: Tanakh Jonah 4:6
    ref: Jonah 4:6
    book: Jonah
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 14572
    text: And the LORD God prepared a gourd, and made it to come up over Jonah, that it might be a shadow over his head, to deliver him from his evil. So Jonah was exceeding glad because of the gourd.
    translation: JPS 1917
    original: וַיְמַן יְהוָה־אֱלֹהִים קִיקָיוֹן וַיַּעַל מֵעַל לְיוֹנָה לִהְיוֹת צֵל עַל־רֹאשׁוֹ לְהַצִּיל לוֹ מֵרָעָתוֹ וַיִּשְׂמַח יוֹנָה עַל־הַקִּיקָיוֹן שִׂמְחָה גְדוֹלָה׃
    hebrewPlain: וימן יהוה אלהים קיקיון ויעל מעל ליונה להיות צל על ראשו להציל לו מרעתו וישמח יונה על הקיקיון שמחה גדולה
    kjvRefs:
    - Jonah 4:6
    kjvOsis:
    - Jonah.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.7
    scripture: tanakh
    name: Tanakh Jonah 4:7
    ref: Jonah 4:7
    book: Jonah
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 14573
    text: But God prepared a worm when the morning rose the next day, and it smote the gourd, that it withered.
    translation: JPS 1917
    original: וַיְמַן הָאֱלֹהִים תּוֹלַעַת בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת וַתַּךְ אֶת־הַקִּיקָיוֹן וַיִּיבָשׁ׃
    hebrewPlain: וימן האלהים תולעת בעלות השחר למחרת ותך את הקיקיון וייבש
    kjvRefs:
    - Jonah 4:7
    kjvOsis:
    - Jonah.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.8
    scripture: tanakh
    name: Tanakh Jonah 4:8
    ref: Jonah 4:8
    book: Jonah
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 14574
    text: 'And it came to pass, when the sun arose, that God prepared a vehement east wind; and the sun beat upon the head of Jonah, that he fainted, and requested for himself that he might die, and said: ‘It is better for me to die than to live.’'
    translation: JPS 1917
    original: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ וַיְמַן אֱלֹהִים רוּחַ קָדִים חֲרִישִׁית וַתַּךְ הַשֶּׁמֶשׁ עַל־רֹאשׁ יוֹנָה וַיִּתְעַלָּף וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּי׃
    hebrewPlain: ויהי כזרח השמש וימן אלהים רוח קדים חרישית ותך השמש על ראש יונה ויתעלף וישאל את נפשו למות ויאמר טוב מותי מחיי
    kjvRefs:
    - Jonah 4:8
    kjvOsis:
    - Jonah.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.9
    scripture: tanakh
    name: Tanakh Jonah 4:9
    ref: Jonah 4:9
    book: Jonah
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 14575
    text: 'And God said to Jonah: ‘Art thou greatly angry for the gourd?’ And he said: ‘I am greatly angry, even unto death.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֱלֹהִים אֶל־יוֹנָה הַהֵיטֵב חָרָה־לְךָ עַל־הַקִּיקָיוֹן וַיֹּאמֶר הֵיטֵב חָרָה־לִי עַד־מָוֶת׃
    hebrewPlain: ויאמר אלהים אל יונה ההיטב חרה לך על הקיקיון ויאמר היטב חרה לי עד מות
    kjvRefs:
    - Jonah 4:9
    kjvOsis:
    - Jonah.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.10
    scripture: tanakh
    name: Tanakh Jonah 4:10
    ref: Jonah 4:10
    book: Jonah
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 14576
    text: 'And the LORD said: ‘Thou hast had pity on the gourd, for which thou hast not laboured, neither madest it grow, which came up in a night, and perished in a night;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אַתָּה חַסְתָּ עַל־הַקִּיקָיוֹן אֲשֶׁר לֹא־עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ שֶׁבִּן־לַיְלָה הָיָה וּבִן־לַיְלָה אָבָד׃
    hebrewPlain: ויאמר יהוה אתה חסת על הקיקיון אשר לא עמלת בו ולא גדלתו שבן לילה היה ובן לילה אבד
    kjvRefs:
    - Jonah 4:10
    kjvOsis:
    - Jonah.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
- type: TanakhVerse
  data:
    osis: Jonah.4.11
    scripture: tanakh
    name: Tanakh Jonah 4:11
    ref: Jonah 4:11
    book: Jonah
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 14577
    text: and should not I have pity on Nineveh, that great city, wherein are more than sixscore thousand persons that cannot discern between their right hand and their left hand, and also much cattle?’
    translation: JPS 1917
    original: וַאֲנִי לֹא אָחוּס עַל־נִינְוֵה הָעִיר הַגְּדוֹלָה אֲשֶׁר יֶשׁ־בָּהּ הַרְבֵּה מִשְׁתֵּים־עֶשְׂרֵה רִבּוֹ אָדָם אֲשֶׁר לֹא־יָדַע בֵּין־יְמִינוֹ לִשְׂמֹאלוֹ וּבְהֵמָה רַבָּה׃
    hebrewPlain: ואני לא אחוס על נינוה העיר הגדולה אשר יש בה הרבה משתים עשרה רבו אדם אשר לא ידע בין ימינו לשמאלו ובהמה רבה
    kjvRefs:
    - Jonah 4:11
    kjvOsis:
    - Jonah.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.4
