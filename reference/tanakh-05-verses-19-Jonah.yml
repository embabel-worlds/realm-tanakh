- type: TanakhVerse
  data:
    osis: Jonah.1.4
    scripture: tanakh
    name: Tanakh Jonah 1:4
    ref: Jonah 1:4
    book: Jonah
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14533
    text: But the LORD hurled a great wind into the sea, and there was a mighty tempest in the sea, so that the ship was like to be broken.
    translation: JPS 1917
    original: וַיהוָה הֵטִיל רוּחַ־גְּדוֹלָה אֶל־הַיָּם וַיְהִי סַעַר־גָּדוֹל בַּיָּם וְהָאֳנִיָּה חִשְּׁבָה לְהִשָּׁבֵר׃
    hebrewPlain: ויהוה הטיל רוח גדולה אל הים ויהי סער גדול בים והאניה חשבה להשבר
    kjvRefs:
