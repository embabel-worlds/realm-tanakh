- type: TanakhVerse
  data:
    osis: Jonah.1.5
    scripture: tanakh
    name: Tanakh Jonah 1:5
    ref: Jonah 1:5
    book: Jonah
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14534
    text: And the mariners were afraid, and cried every man unto his god; and they cast forth the wares that were in the ship into the sea, to lighten it unto them. But Jonah was gone down into the innermost parts of the ship; and he lay, and was fast asleep.
    translation: JPS 1917
    original: וַיִּירְאוּ הַמַּלָּחִים וַיִּזְעֲקוּ אִישׁ אֶל־אֱלֹהָיו וַיָּטִלוּ אֶת־הַכֵּלִים אֲשֶׁר בָּאֳנִיָּה אֶל־הַיָּם לְהָקֵל מֵעֲלֵיהֶם וְיוֹנָה יָרַד אֶל־יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַם׃
    hebrewPlain: וייראו המלחים ויזעקו איש אל אלהיו ויטלו את הכלים אשר באניה אל הים להקל מעליהם ויונה ירד אל ירכתי הספינה וישכב וירדם
    kjvRefs:
    - Jonah 1:5
    kjvOsis:
    - Jonah.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.6
    scripture: tanakh
    name: Tanakh Jonah 1:6
    ref: Jonah 1:6
    book: Jonah
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14535
    text: 'So the shipmaster came to him, and said unto him: ‘What meanest thou that thou sleepest? arise, call upon thy God, if so be that God will think upon us, that we perish not.’'
    translation: JPS 1917
    original: וַיִּקְרַב אֵלָיו רַב הַחֹבֵל וַיֹּאמֶר לוֹ מַה־לְּךָ נִרְדָּם קוּם קְרָא אֶל־אֱלֹהֶיךָ אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵד׃
    hebrewPlain: ויקרב אליו רב החבל ויאמר לו מה לך נרדם קום קרא אל אלהיך אולי יתעשת האלהים לנו ולא נאבד
    kjvRefs:
    - Jonah 1:6
    kjvOsis:
    - Jonah.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.7
    scripture: tanakh
    name: Tanakh Jonah 1:7
    ref: Jonah 1:7
    book: Jonah
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14536
    text: 'And they said every one to his fellow: ‘Come, and let us cast lots, that we may know for whose cause this evil is upon us.’ So they cast lots, and the lot fell upon Jonah.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ לְכוּ וְנַפִּילָה גוֹרָלוֹת וְנֵדְעָה בְּשֶׁלְּמִי הָרָעָה הַזֹּאת לָנוּ וַיַּפִּלוּ גּוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל־יוֹנָה׃
    hebrewPlain: ויאמרו איש אל רעהו לכו ונפילה גורלות ונדעה בשלמי הרעה הזאת לנו ויפלו גורלות ויפל הגורל על יונה
    kjvRefs:
    - Jonah 1:7
    kjvOsis:
    - Jonah.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.8
    scripture: tanakh
    name: Tanakh Jonah 1:8
    ref: Jonah 1:8
    book: Jonah
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14537
    text: 'Then said they unto him: ‘Tell us, we pray thee, for whose cause this evil is upon us: what is thine occupation? and whence comest thou? what is thy country? and of what people art thou?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו הַגִּידָה־נָּא לָנוּ בַּאֲשֶׁר לְמִי־הָרָעָה הַזֹּאת לָנוּ מַה־מְּלַאכְתְּךָ וּמֵאַיִן תָּבוֹא מָה אַרְצֶךָ וְאֵי־מִזֶּה עַם אָתָּה׃
    hebrewPlain: ויאמרו אליו הגידה נא לנו באשר למי הרעה הזאת לנו מה מלאכתך ומאין תבוא מה ארצך ואי מזה עם אתה
    kjvRefs:
    - Jonah 1:8
    kjvOsis:
    - Jonah.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.9
    scripture: tanakh
    name: Tanakh Jonah 1:9
    ref: Jonah 1:9
    book: Jonah
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14538
    text: 'And he said unto them: ‘I am an Hebrew; and I fear the LORD, the God of heaven, who hath made the sea and the dry land.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם עִבְרִי אָנֹכִי וְאֶת־יְהוָה אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא אֲשֶׁר־עָשָׂה אֶת־הַיָּם וְאֶת־הַיַּבָּשָׁה׃
    hebrewPlain: ויאמר אליהם עברי אנכי ואת יהוה אלהי השמים אני ירא אשר עשה את הים ואת היבשה
    kjvRefs:
    - Jonah 1:9
    kjvOsis:
    - Jonah.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.10
    scripture: tanakh
    name: Tanakh Jonah 1:10
    ref: Jonah 1:10
    book: Jonah
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 14539
    text: 'Then were the men exceedingly afraid, and said unto him: ‘What is this that thou hast done?’ For the men knew that he fled from the presence of the LORD, because he had told them.'
    translation: JPS 1917
    original: וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה וַיֹּאמְרוּ אֵלָיו מַה־זֹּאת עָשִׂיתָ כִּי־יָדְעוּ הָאֲנָשִׁים כִּי־מִלִּפְנֵי יְהוָה הוּא בֹרֵחַ כִּי הִגִּיד לָהֶם׃
    hebrewPlain: וייראו האנשים יראה גדולה ויאמרו אליו מה זאת עשית כי ידעו האנשים כי מלפני יהוה הוא ברח כי הגיד להם
    kjvRefs:
    - Jonah 1:10
    kjvOsis:
    - Jonah.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.11
    scripture: tanakh
    name: Tanakh Jonah 1:11
    ref: Jonah 1:11
    book: Jonah
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14540
    text: 'Then said they unto him: ‘What shall we do unto thee, that the sea may be calm unto us?’ for the sea grew more and more tempestuous.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו מַה־נַּעֲשֶׂה לָּךְ וְיִשְׁתֹּק הַיָּם מֵעָלֵינוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵר׃
    hebrewPlain: ויאמרו אליו מה נעשה לך וישתק הים מעלינו כי הים הולך וסער
    kjvRefs:
    - Jonah 1:11
    kjvOsis:
    - Jonah.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.12
    scripture: tanakh
    name: Tanakh Jonah 1:12
    ref: Jonah 1:12
    book: Jonah
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14541
    text: 'And he said unto them: ‘Take me up, and cast me forth into the sea; so shall the sea be calm unto you; for I know that for my sake this great tempest is upon you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם שָׂאוּנִי וַהֲטִילֻנִי אֶל־הַיָּם וְיִשְׁתֹּק הַיָּם מֵעֲלֵיכֶם כִּי יוֹדֵעַ אָנִי כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶם׃
    hebrewPlain: ויאמר אליהם שאוני והטילני אל הים וישתק הים מעליכם כי יודע אני כי בשלי הסער הגדול הזה עליכם
    kjvRefs:
    - Jonah 1:12
    kjvOsis:
    - Jonah.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.13
    scripture: tanakh
    name: Tanakh Jonah 1:13
    ref: Jonah 1:13
    book: Jonah
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14542
    text: Nevertheless the men rowed hard to bring it to the land; but they could not; for the sea grew more and more tempestuous against them.
    translation: JPS 1917
    original: וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל־הַיַּבָּשָׁה וְלֹא יָכֹלוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵר עֲלֵיהֶם׃
    hebrewPlain: ויחתרו האנשים להשיב אל היבשה ולא יכלו כי הים הולך וסער עליהם
    kjvRefs:
    - Jonah 1:13
    kjvOsis:
    - Jonah.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.14
    scripture: tanakh
    name: Tanakh Jonah 1:14
    ref: Jonah 1:14
    book: Jonah
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14543
    text: 'Wherefore they cried unto the LORD, and said: ‘We beseech Thee, O LORD, we beseech Thee, let us not perish for this man’s life, and lay not upon us innocent blood; for Thou, O LORD, hast done as it pleased Thee.’'
    translation: JPS 1917
    original: וַיִּקְרְאוּ אֶל־יְהוָה וַיֹּאמְרוּ אָנָּה יְהוָה אַל־נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא כִּי־אַתָּה יְהוָה כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ׃
    hebrewPlain: ויקראו אל יהוה ויאמרו אנה יהוה אל נא נאבדה בנפש האיש הזה ואל תתן עלינו דם נקיא כי אתה יהוה כאשר חפצת עשית
    kjvRefs:
    - Jonah 1:14
    kjvOsis:
    - Jonah.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.15
    scripture: tanakh
    name: Tanakh Jonah 1:15
    ref: Jonah 1:15
    book: Jonah
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14544
    text: So they took up Jonah, and cast him forth into the sea; and the sea ceased from its raging.
    translation: JPS 1917
    original: וַיִּשְׂאוּ אֶת־יוֹנָה וַיְטִלֻהוּ אֶל־הַיָּם וַיַּעֲמֹד הַיָּם מִזַּעְפּוֹ׃
    hebrewPlain: וישאו את יונה ויטלהו אל הים ויעמד הים מזעפו
    kjvRefs:
    - Jonah 1:15
    kjvOsis:
    - Jonah.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Jonah.1
- type: TanakhVerse
  data:
    osis: Jonah.1.16
    scripture: tanakh
    name: Tanakh Jonah 1:16
    ref: Jonah 1:16
    book: Jonah
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 14545
    text: Then the men feared the LORD exceedingly; and they offered a sacrifice unto the LORD, and made vows.
    translation: JPS 1917
    original: וַיִּירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת־יְהוָה וַיִּזְבְּחוּ־זֶבַח לַיהוָה וַיִּדְּרוּ נְדָרִים׃
    hebrewPlain: וייראו האנשים יראה גדולה את יהוה ויזבחו זבח ליהוה וידרו נדרים
    kjvRefs:
    - Jonah 1:16
    kjvOsis:
    - Jonah.1.16
  relations:
