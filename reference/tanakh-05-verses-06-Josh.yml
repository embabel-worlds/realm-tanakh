    scripture: tanakh
    name: Tanakh Joshua 18:15
    ref: Joshua 18:15
    book: Josh
    section: neviim
    chapter: 18
    verse: 15
    ordinal: 6303
    text: And the south side was from the uttermost part of Kiriath-jearim, and the border went out westward, and went out to the fountain of the waters of Nephtoah.
    translation: JPS 1917
    original: וּפְאַת־נֶגְבָּה מִקְצֵה קִרְיַת יְעָרִים וְיָצָא הַגְּבוּל יָמָּה וְיָצָא אֶל־מַעְיַן מֵי נֶפְתּוֹחַ׃
    hebrewPlain: ופאת נגבה מקצה קרית יערים ויצא הגבול ימה ויצא אל מעין מי נפתוח
