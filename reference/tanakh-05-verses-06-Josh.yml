    scripture: tanakh
    name: Tanakh Joshua 18:16
    ref: Joshua 18:16
    book: Josh
    section: neviim
    chapter: 18
    verse: 16
    ordinal: 6304
    text: And the border went down to the uttermost part of the mountain that lieth before the Valley of the son of Hinnom, which is in the vale of Rephaim northward; and it went down to the Valley of Hinnom, to the side of the Jebusite southward, and went down to En-rogel.
    translation: JPS 1917
    original: וְיָרַד הַגְּבוּל אֶל־קְצֵה הָהָר אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה וְיָרַד גֵּי הִנֹּם אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה וְיָרַד עֵין רֹגֵל׃
    hebrewPlain: וירד הגבול אל קצה ההר אשר על פני גי בן הנם אשר בעמק רפאים צפונה וירד גי הנם אל כתף היבוסי נגבה וירד עין רגל
    kjvRefs:
    - Joshua 18:16
    kjvOsis:
    - Josh.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.17
    scripture: tanakh
    name: Tanakh Joshua 18:17
    ref: Joshua 18:17
    book: Josh
    section: neviim
    chapter: 18
    verse: 17
    ordinal: 6305
    text: And it was drawn on the north, and went out at En-shemesh, and went out to Geliloth, which is over against the ascent of Adummim; and it went down to the Stone of Bohan the son of Reuben.
    translation: JPS 1917
    original: וְתָאַר מִצָּפוֹן וְיָצָא עֵין שֶׁמֶשׁ וְיָצָא אֶל־גְּלִילוֹת אֲשֶׁר־נֹכַח מַעֲלֵה אֲדֻמִּים וְיָרַד אֶבֶן בֹּהַן בֶּן־רְאוּבֵן׃
    hebrewPlain: ותאר מצפון ויצא עין שמש ויצא אל גלילות אשר נכח מעלה אדמים וירד אבן בהן בן ראובן
    kjvRefs:
    - Joshua 18:17
    kjvOsis:
    - Josh.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
