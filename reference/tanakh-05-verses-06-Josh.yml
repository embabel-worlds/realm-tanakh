    ordinal: 6316
    text: and Zela, Eleph, and the Jebusite—the same is Jerusalem, Gibeath, and Kiriath; fourteen cities with their villages. This is the inheritance of the children of Benjamin according to their families.
    translation: JPS 1917
    original: וְצֵלַע הָאֶלֶף וְהַיְבוּסִי הִיא יְרוּשָׁלִַם גִּבְעַת קִרְיַת עָרִים אַרְבַּע־עֶשְׂרֵה וְחַצְרֵיהֶן זֹאת נַחֲלַת בְּנֵי־בִנְיָמִן לְמִשְׁפְּחֹתָם׃
