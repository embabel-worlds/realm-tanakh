    section: neviim
    chapter: 16
    verse: 1
    ordinal: 6261
    text: And the lot for the children of Joseph went out from the Jordan at Jericho, at the waters of Jericho on the east, going up from Jericho through the hill-country to the wilderness, even to Beth-el.
    translation: JPS 1917
    original: וַיֵּצֵא הַגּוֹרָל לִבְנֵי יוֹסֵף מִיַּרְדֵּן יְרִיחוֹ לְמֵי יְרִיחוֹ מִזְרָחָה הַמִּדְבָּר עֹלֶה מִירִיחוֹ בָּהָר בֵּית־אֵל׃
    hebrewPlain: ויצא הגורל לבני יוסף מירדן יריחו למי יריחו מזרחה המדבר עלה מיריחו בהר בית אל
