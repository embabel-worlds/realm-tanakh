- type: TanakhVerse
  data:
    osis: Josh.1.5
    scripture: tanakh
    name: Tanakh Joshua 1:5
    ref: Joshua 1:5
    book: Josh
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 5851
    text: There shall not any man be able to stand before thee all the days of thy life; as I was with Moses, so I will be with thee; I will not fail thee, nor forsake thee.
    translation: JPS 1917
    original: לֹא־יִתְיַצֵּב אִישׁ לְפָנֶיךָ כֹּל יְמֵי חַיֶּיךָ כַּאֲשֶׁר הָיִיתִי עִם־מֹשֶׁה אֶהְיֶה עִמָּךְ לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ׃
    hebrewPlain: לא יתיצב איש לפניך כל ימי חייך כאשר הייתי עם משה אהיה עמך לא ארפך ולא אעזבך
    kjvRefs:
    - Joshua 1:5
    kjvOsis:
    - Josh.1.5
