    text: There failed not aught of any good thing which the LORD had spoken unto the house of Israel; all came to pass.
    translation: JPS 1917
    original: לֹא־נָפַל דָּבָר מִכֹּל הַדָּבָר הַטּוֹב אֲשֶׁר־דִּבֶּר יְהוָה אֶל־בֵּית יִשְׂרָאֵל הַכֹּל בָּא׃
    hebrewPlain: לא נפל דבר מכל הדבר הטוב אשר דבר יהוה אל בית ישראל הכל בא
    kjvRefs:
    - Joshua 21:45
    kjvOsis:
    - Josh.21.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.22.1
    scripture: tanakh
    name: Tanakh Joshua 22:1
    ref: Joshua 22:1
    book: Josh
    section: neviim
    chapter: 22
    verse: 1
    ordinal: 6422
    text: Then Joshua called the Reubenites, and the Gadites, and the half-tribe of Manasseh,
    translation: JPS 1917
    original: אָז יִקְרָא יְהוֹשֻׁעַ לָראוּבֵנִי וְלַגָּדִי וְלַחֲצִי מַטֵּה מְנַשֶּׁה׃
    hebrewPlain: אז יקרא יהושע לראובני ולגדי ולחצי מטה מנשה
    kjvRefs:
    - Joshua 22:1
    kjvOsis:
    - Josh.22.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.2
    scripture: tanakh
    name: Tanakh Joshua 22:2
    ref: Joshua 22:2
    book: Josh
    section: neviim
    chapter: 22
    verse: 2
    ordinal: 6423
    text: 'and said unto them: ‘Ye have kept all that Moses the servant of the LORD commanded you, and have hearkened unto my voice in all that I commanded you;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם אַתֶּם שְׁמַרְתֶּם אֵת כָּל־אֲשֶׁר צִוָּה אֶתְכֶם מֹשֶׁה עֶבֶד יְהוָה וַתִּשְׁמְעוּ בְקוֹלִי לְכֹל אֲשֶׁר־צִוִּיתִי אֶתְכֶם׃
    hebrewPlain: ויאמר אליהם אתם שמרתם את כל אשר צוה אתכם משה עבד יהוה ותשמעו בקולי לכל אשר צויתי אתכם
    kjvRefs:
    - Joshua 22:2
    kjvOsis:
    - Josh.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.3
    scripture: tanakh
    name: Tanakh Joshua 22:3
    ref: Joshua 22:3
    book: Josh
    section: neviim
    chapter: 22
    verse: 3
    ordinal: 6424
    text: ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of the LORD your God.
    translation: JPS 1917
    original: לֹא־עֲזַבְתֶּם אֶת־אֲחֵיכֶם זֶה יָמִים רַבִּים עַד הַיּוֹם הַזֶּה וּשְׁמַרְתֶּם אֶת־מִשְׁמֶרֶת מִצְוַת יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: לא עזבתם את אחיכם זה ימים רבים עד היום הזה ושמרתם את משמרת מצות יהוה אלהיכם
    kjvRefs:
    - Joshua 22:3
    kjvOsis:
    - Josh.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.4
    scripture: tanakh
    name: Tanakh Joshua 22:4
    ref: Joshua 22:4
    book: Josh
    section: neviim
    chapter: 22
    verse: 4
    ordinal: 6425
    text: And now the LORD your God hath given rest unto your brethren, as He spoke unto them; therefore now turn ye, and get you unto your tents, unto the land of your possession, which Moses the servant of the LORD gave you beyond the Jordan.
    translation: JPS 1917
    original: וְעַתָּה הֵנִיחַ יְהוָה אֱלֹהֵיכֶם לַאֲחֵיכֶם כַּאֲשֶׁר דִּבֶּר לָהֶם וְעַתָּה פְּנוּ וּלְכוּ לָכֶם לְאָהֳלֵיכֶם אֶל־אֶרֶץ אֲחֻזַּתְכֶם אֲשֶׁר נָתַן לָכֶם מֹשֶׁה עֶבֶד יְהוָה בְּעֵבֶר הַיַּרְדֵּן׃
    hebrewPlain: ועתה הניח יהוה אלהיכם לאחיכם כאשר דבר להם ועתה פנו ולכו לכם לאהליכם אל ארץ אחזתכם אשר נתן לכם משה עבד יהוה בעבר הירדן
    kjvRefs:
    - Joshua 22:4
    kjvOsis:
    - Josh.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.5
    scripture: tanakh
    name: Tanakh Joshua 22:5
    ref: Joshua 22:5
    book: Josh
    section: neviim
    chapter: 22
    verse: 5
    ordinal: 6426
    text: Only take diligent heed to do the commandment and the law, which Moses the servant of the LORD commanded you, to love the LORD your God, and to walk in all His ways, and to keep His commandments, and to cleave unto Him, and to serve Him with all your heart and with all your soul.’
    translation: JPS 1917
    original: רַק שִׁמְרוּ מְאֹד לַעֲשׂוֹת אֶת־הַמִּצְוָה וְאֶת־הַתּוֹרָה אֲשֶׁר צִוָּה אֶתְכֶם מֹשֶׁה עֶבֶד־יְהוָה לְאַהֲבָה אֶת־יְהוָה אֱלֹהֵיכֶם וְלָלֶכֶת בְּכָל־דְּרָכָיו וְלִשְׁמֹר מִצְוֺתָיו וּלְדָבְקָה־בוֹ וּלְעָבְדוֹ בְּכָל־לְבַבְכֶם וּבְכָל־נַפְשְׁכֶם׃
    hebrewPlain: רק שמרו מאד לעשות את המצוה ואת התורה אשר צוה אתכם משה עבד יהוה לאהבה את יהוה אלהיכם וללכת בכל דרכיו ולשמר מצותיו ולדבקה בו ולעבדו בכל לבבכם ובכל נפשכם
    kjvRefs:
    - Joshua 22:5
    kjvOsis:
    - Josh.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.6
    scripture: tanakh
    name: Tanakh Joshua 22:6
    ref: Joshua 22:6
    book: Josh
    section: neviim
    chapter: 22
    verse: 6
    ordinal: 6427
    text: So Joshua blessed them, and sent them away; and they went unto their tents.
    translation: JPS 1917
    original: וַיְבָרְכֵם יְהוֹשֻׁעַ וַיְשַׁלְּחֵם וַיֵּלְכוּ אֶל־אָהֳלֵיהֶם׃
    hebrewPlain: ויברכם יהושע וישלחם וילכו אל אהליהם
    kjvRefs:
    - Joshua 22:6
    kjvOsis:
    - Josh.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.7
    scripture: tanakh
    name: Tanakh Joshua 22:7
    ref: Joshua 22:7
    book: Josh
    section: neviim
    chapter: 22
    verse: 7
    ordinal: 6428
    text: Now to the one half-tribe of Manasseh Moses had given inheritance in Bashan; but unto the other half gave Joshua among their brethren beyond the Jordan westward. Moreover when Joshua sent them away unto their tents, he blessed them,
    translation: JPS 1917
    original: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה נָתַן מֹשֶׁה בַּבָּשָׁן וּלְחֶצְיוֹ נָתַן יְהוֹשֻׁעַ עִם־אֲחֵיהֶם מעבר [בְּעֵבֶר] הַיַּרְדֵּן יָמָּה וְגַם כִּי שִׁלְּחָם יְהוֹשֻׁעַ אֶל־אָהֳלֵיהֶם וַיְבָרֲכֵם׃
    hebrewPlain: ולחצי שבט המנשה נתן משה בבשן ולחציו נתן יהושע עם אחיהם מעבר [בעבר] הירדן ימה וגם כי שלחם יהושע אל אהליהם ויברכם
    kjvRefs:
    - Joshua 22:7
    kjvOsis:
    - Josh.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.8
    scripture: tanakh
    name: Tanakh Joshua 22:8
    ref: Joshua 22:8
    book: Josh
    section: neviim
    chapter: 22
    verse: 8
    ordinal: 6429
    text: 'and spoke unto them, saying: ‘Return with much wealth unto your tents, and with very much cattle, with silver, and with gold, and with brass, and with iron, and with very much raiment; divide the spoil of your enemies with your brethren.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר בִּנְכָסִים רַבִּים שׁוּבוּ אֶל־אָהֳלֵיכֶם וּבְמִקְנֶה רַב־מְאֹד בְּכֶסֶף וּבְזָהָב וּבִנְחֹשֶׁת וּבְבַרְזֶל וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד חִלְקוּ שְׁלַל־אֹיְבֵיכֶם עִם־אֲחֵיכֶם׃
    hebrewPlain: ויאמר אליהם לאמר בנכסים רבים שובו אל אהליכם ובמקנה רב מאד בכסף ובזהב ובנחשת ובברזל ובשלמות הרבה מאד חלקו שלל איביכם עם אחיכם
    kjvRefs:
    - Joshua 22:8
    kjvOsis:
    - Josh.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.9
    scripture: tanakh
    name: Tanakh Joshua 22:9
    ref: Joshua 22:9
    book: Josh
    section: neviim
    chapter: 22
    verse: 9
    ordinal: 6430
    text: And the children of Reuben and the children of Gad and the half-tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which is in the land of Canaan, to go unto the land of Gilead, to the land of their possession, whereof they were possessed, according to the commandment of the LORD by the hand of Moses.
    translation: JPS 1917
    original: וַיָּשֻׁבוּ וַיֵּלְכוּ בְּנֵי־רְאוּבֵן וּבְנֵי־גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה מֵאֵת בְּנֵי יִשְׂרָאֵל מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ־כְּנָעַן לָלֶכֶת אֶל־אֶרֶץ הַגִּלְעָד אֶל־אֶרֶץ אֲחֻזָּתָם אֲשֶׁר נֹאחֲזוּ־בָהּ עַל־פִּי יְהוָה בְּיַד־מֹשֶׁה׃
    hebrewPlain: וישבו וילכו בני ראובן ובני גד וחצי שבט המנשה מאת בני ישראל משלה אשר בארץ כנען ללכת אל ארץ הגלעד אל ארץ אחזתם אשר נאחזו בה על פי יהוה ביד משה
    kjvRefs:
    - Joshua 22:9
    kjvOsis:
    - Josh.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.10
    scripture: tanakh
    name: Tanakh Joshua 22:10
    ref: Joshua 22:10
    book: Josh
    section: neviim
    chapter: 22
    verse: 10
    ordinal: 6431
    text: And when they came unto the region about the Jordan, that is in the land of Canaan, the children of Reuben and the children of Gad and the half-tribe of Manasseh built there an altar by the Jordan, a great altar to look upon.
    translation: JPS 1917
    original: וַיָּבֹאוּ אֶל־גְּלִילוֹת הַיַּרְדֵּן אֲשֶׁר בְּאֶרֶץ כְּנָעַן וַיִּבְנוּ בְנֵי־רְאוּבֵן וּבְנֵי־גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה שָׁם מִזְבֵּחַ עַל־הַיַּרְדֵּן מִזְבֵּחַ גָּדוֹל לְמַרְאֶה׃
    hebrewPlain: ויבאו אל גלילות הירדן אשר בארץ כנען ויבנו בני ראובן ובני גד וחצי שבט המנשה שם מזבח על הירדן מזבח גדול למראה
    kjvRefs:
    - Joshua 22:10
    kjvOsis:
    - Josh.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.11
    scripture: tanakh
    name: Tanakh Joshua 22:11
    ref: Joshua 22:11
    book: Josh
    section: neviim
    chapter: 22
    verse: 11
    ordinal: 6432
    text: 'And the children of Israel heard say: ‘Behold, the children of Reuben and the children of Gad and the half-tribe of Manasseh have built an altar in the forefront of the land of Canaan, in the region about the Jordan, on the side that pertaineth to the children of Israel.’'
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ בְנֵי־יִשְׂרָאֵל לֵאמֹר הִנֵּה בָנוּ בְנֵי־רְאוּבֵן וּבְנֵי־גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה אֶת־הַמִּזְבֵּחַ אֶל־מוּל אֶרֶץ כְּנַעַן אֶל־גְּלִילוֹת הַיַּרְדֵּן אֶל־עֵבֶר בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: וישמעו בני ישראל לאמר הנה בנו בני ראובן ובני גד וחצי שבט המנשה את המזבח אל מול ארץ כנען אל גלילות הירדן אל עבר בני ישראל
    kjvRefs:
    - Joshua 22:11
    kjvOsis:
    - Josh.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.12
    scripture: tanakh
    name: Tanakh Joshua 22:12
    ref: Joshua 22:12
    book: Josh
    section: neviim
    chapter: 22
    verse: 12
    ordinal: 6433
    text: And when the children of Israel heard of it, the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up against them to war.
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ בְּנֵי יִשְׂרָאֵל וַיִּקָּהֲלוּ כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל שִׁלֹה לַעֲלוֹת עֲלֵיהֶם לַצָּבָא׃
    hebrewPlain: וישמעו בני ישראל ויקהלו כל עדת בני ישראל שלה לעלות עליהם לצבא
    kjvRefs:
    - Joshua 22:12
    kjvOsis:
    - Josh.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.13
    scripture: tanakh
    name: Tanakh Joshua 22:13
    ref: Joshua 22:13
    book: Josh
    section: neviim
    chapter: 22
    verse: 13
    ordinal: 6434
    text: And the children of Israel sent unto the children of Reuben, and to the children of Gad, and to the half-tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest;
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ בְנֵי־יִשְׂרָאֵל אֶל־בְּנֵי־רְאוּבֵן וְאֶל־בְּנֵי־גָד וְאֶל־חֲצִי שֵׁבֶט־מְנַשֶּׁה אֶל־אֶרֶץ הַגִּלְעָד אֶת־פִּינְחָס בֶּן־אֶלְעָזָר הַכֹּהֵן׃
    hebrewPlain: וישלחו בני ישראל אל בני ראובן ואל בני גד ואל חצי שבט מנשה אל ארץ הגלעד את פינחס בן אלעזר הכהן
    kjvRefs:
    - Joshua 22:13
    kjvOsis:
    - Josh.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.14
    scripture: tanakh
    name: Tanakh Joshua 22:14
    ref: Joshua 22:14
    book: Josh
    section: neviim
    chapter: 22
    verse: 14
    ordinal: 6435
    text: and with him ten princes, one prince of a fathers’ house for each of the tribes of Israel; and they were every one of them head of their fathers’ houses among the thousands of Israel.
    translation: JPS 1917
    original: וַעֲשָׂרָה נְשִׂאִים עִמּוֹ נָשִׂיא אֶחָד נָשִׂיא אֶחָד לְבֵית אָב לְכֹל מַטּוֹת יִשְׂרָאֵל וְאִישׁ רֹאשׁ בֵּית־אֲבוֹתָם הֵמָּה לְאַלְפֵי יִשְׂרָאֵל׃
    hebrewPlain: ועשרה נשאים עמו נשיא אחד נשיא אחד לבית אב לכל מטות ישראל ואיש ראש בית אבותם המה לאלפי ישראל
    kjvRefs:
    - Joshua 22:14
    kjvOsis:
    - Josh.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.15
    scripture: tanakh
    name: Tanakh Joshua 22:15
    ref: Joshua 22:15
    book: Josh
    section: neviim
    chapter: 22
    verse: 15
    ordinal: 6436
    text: 'And they came unto the children of Reuben, and to the children of Gad, and to the half-tribe of Manasseh, unto the land of Gilead, and they spoke with them, saying:'
    translation: JPS 1917
    original: וַיָּבֹאוּ אֶל־בְּנֵי־רְאוּבֵן וְאֶל־בְּנֵי־גָד וְאֶל־חֲצִי שֵׁבֶט־מְנַשֶּׁה אֶל־אֶרֶץ הַגִּלְעָד וַיְדַבְּרוּ אִתָּם לֵאמֹר׃
    hebrewPlain: ויבאו אל בני ראובן ואל בני גד ואל חצי שבט מנשה אל ארץ הגלעד וידברו אתם לאמר
    kjvRefs:
    - Joshua 22:15
    kjvOsis:
    - Josh.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.16
    scripture: tanakh
    name: Tanakh Joshua 22:16
    ref: Joshua 22:16
    book: Josh
    section: neviim
    chapter: 22
    verse: 16
    ordinal: 6437
    text: '’Thus saith the whole congregation of the LORD: What treachery is this that ye have committed against the God of Israel, to turn away this day from following the LORD, in that ye have builded you an altar, to rebel this day against the LORD?'
    translation: JPS 1917
    original: כֹּה אָמְרוּ כֹּל עֲדַת יְהוָה מָה־הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם בֵּאלֹהֵי יִשְׂרָאֵל לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ לִמְרָדְכֶם הַיּוֹם בַּיהוָה׃
    hebrewPlain: כה אמרו כל עדת יהוה מה המעל הזה אשר מעלתם באלהי ישראל לשוב היום מאחרי יהוה בבנותכם לכם מזבח למרדכם היום ביהוה
    kjvRefs:
    - Joshua 22:16
    kjvOsis:
    - Josh.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.17
    scripture: tanakh
    name: Tanakh Joshua 22:17
    ref: Joshua 22:17
    book: Josh
    section: neviim
    chapter: 22
    verse: 17
    ordinal: 6438
    text: Is the iniquity of Peor too little for us, from which we have not cleansed ourselves unto this day, although there came a plague upon the congregation of the LORD,
    translation: JPS 1917
    original: הַמְעַט־לָנוּ אֶת־עֲוֺן פְּעוֹר אֲשֶׁר לֹא־הִטַּהַרְנוּ מִמֶּנּוּ עַד הַיּוֹם הַזֶּה וַיְהִי הַנֶּגֶף בַּעֲדַת יְהוָה׃
    hebrewPlain: המעט לנו את עון פעור אשר לא הטהרנו ממנו עד היום הזה ויהי הנגף בעדת יהוה
    kjvRefs:
    - Joshua 22:17
    kjvOsis:
    - Josh.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.18
    scripture: tanakh
    name: Tanakh Joshua 22:18
    ref: Joshua 22:18
    book: Josh
    section: neviim
    chapter: 22
    verse: 18
    ordinal: 6439
    text: that ye must turn away this day from following the LORD? and it will be, seeing ye rebel to-day against the LORD, that to-morrow He will be wroth with the whole congregation of Israel.
    translation: JPS 1917
    original: וְאַתֶּם תָּשֻׁבוּ הַיּוֹם מֵאַחֲרֵי יְהוָה וְהָיָה אַתֶּם תִּמְרְדוּ הַיּוֹם בַּיהוָה וּמָחָר אֶל־כָּל־עֲדַת יִשְׂרָאֵל יִקְצֹף׃
    hebrewPlain: ואתם תשבו היום מאחרי יהוה והיה אתם תמרדו היום ביהוה ומחר אל כל עדת ישראל יקצף
    kjvRefs:
    - Joshua 22:18
    kjvOsis:
    - Josh.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.19
    scripture: tanakh
    name: Tanakh Joshua 22:19
    ref: Joshua 22:19
    book: Josh
    section: neviim
    chapter: 22
    verse: 19
    ordinal: 6440
    text: Howbeit, if the land of your possession be unclean, then pass ye over unto the land of the possession of the LORD, wherein the LORD’S tabernacle dwelleth, and take possession among us; but rebel not against the LORD, nor rebel against us, in building you an altar besides the altar of the LORD our God.
    translation: JPS 1917
    original: וְאַךְ אִם־טְמֵאָה אֶרֶץ אֲחֻזַּתְכֶם עִבְרוּ לָכֶם אֶל־אֶרֶץ אֲחֻזַּת יְהוָה אֲשֶׁר שָׁכַן־שָׁם מִשְׁכַּן יְהוָה וְהֵאָחֲזוּ בְּתוֹכֵנוּ וּבַיהוָה אַל־תִּמְרֹדוּ וְאֹתָנוּ אֶל־תִּמְרֹדוּ בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ׃
    hebrewPlain: ואך אם טמאה ארץ אחזתכם עברו לכם אל ארץ אחזת יהוה אשר שכן שם משכן יהוה והאחזו בתוכנו וביהוה אל תמרדו ואתנו אל תמרדו בבנתכם לכם מזבח מבלעדי מזבח יהוה אלהינו
    kjvRefs:
    - Joshua 22:19
    kjvOsis:
    - Josh.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.20
    scripture: tanakh
    name: Tanakh Joshua 22:20
    ref: Joshua 22:20
    book: Josh
    section: neviim
    chapter: 22
    verse: 20
    ordinal: 6441
    text: Did not Achan the son of Zerah commit a trespass concerning the devoted thing, and wrath fell upon all the congregation of Israel? and that man perished not alone in his iniquity.’
    translation: JPS 1917
    original: הֲלוֹא עָכָן בֶּן־זֶרַח מָעַל מַעַל בַּחֵרֶם וְעַל־כָּל־עֲדַת יִשְׂרָאֵל הָיָה קָצֶף וְהוּא אִישׁ אֶחָד לֹא גָוַע בַּעֲוֺנוֹ׃
    hebrewPlain: הלוא עכן בן זרח מעל מעל בחרם ועל כל עדת ישראל היה קצף והוא איש אחד לא גוע בעונו
    kjvRefs:
    - Joshua 22:20
    kjvOsis:
    - Josh.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.21
    scripture: tanakh
    name: Tanakh Joshua 22:21
    ref: Joshua 22:21
    book: Josh
    section: neviim
    chapter: 22
    verse: 21
    ordinal: 6442
    text: 'Then the children of Reuben and the children of Gad and the half-tribe of Manasseh answered, and spoke unto the heads of the thousands of Israel:'
    translation: JPS 1917
    original: וַיַּעֲנוּ בְּנֵי־רְאוּבֵן וּבְנֵי־גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה וַיְדַבְּרוּ אֶת־רָאשֵׁי אַלְפֵי יִשְׂרָאֵל׃
    hebrewPlain: ויענו בני ראובן ובני גד וחצי שבט המנשה וידברו את ראשי אלפי ישראל
    kjvRefs:
    - Joshua 22:21
    kjvOsis:
    - Josh.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.22
    scripture: tanakh
    name: Tanakh Joshua 22:22
    ref: Joshua 22:22
    book: Josh
    section: neviim
    chapter: 22
    verse: 22
    ordinal: 6443
    text: ’God, God, the LORD, God, God, the LORD, He knoweth, and Israel he shall know; if it be in rebellion, or if in treachery against the LORD—save Thou us not this day—
    translation: JPS 1917
    original: אֵל אֱלֹהִים יְהוָה אֵל אֱלֹהִים יְהוָה הוּא יֹדֵעַ וְיִשְׂרָאֵל הוּא יֵדָע אִם־בְּמֶרֶד וְאִם־בְּמַעַל בַּיהוָה אַל־תּוֹשִׁיעֵנוּ הַיּוֹם הַזֶּה׃
    hebrewPlain: אל אלהים יהוה אל אלהים יהוה הוא ידע וישראל הוא ידע אם במרד ואם במעל ביהוה אל תושיענו היום הזה
    kjvRefs:
    - Joshua 22:22
    kjvOsis:
    - Josh.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.23
    scripture: tanakh
    name: Tanakh Joshua 22:23
    ref: Joshua 22:23
    book: Josh
    section: neviim
    chapter: 22
    verse: 23
    ordinal: 6444
    text: that we have built us an altar to turn away from following the LORD; or if to offer thereon burnt-offering or meal-offering, or if to offer sacrifices of peace-offerings thereon, let the LORD Himself require it;
    translation: JPS 1917
    original: לִבְנוֹת לָנוּ מִזְבֵּחַ לָשׁוּב מֵאַחֲרֵי יְהוָה וְאִם־לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה וְאִם־לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים יְהוָה הוּא יְבַקֵּשׁ׃
    hebrewPlain: לבנות לנו מזבח לשוב מאחרי יהוה ואם להעלות עליו עולה ומנחה ואם לעשות עליו זבחי שלמים יהוה הוא יבקש
    kjvRefs:
    - Joshua 22:23
    kjvOsis:
    - Josh.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.24
    scripture: tanakh
    name: Tanakh Joshua 22:24
    ref: Joshua 22:24
    book: Josh
    section: neviim
    chapter: 22
    verse: 24
    ordinal: 6445
    text: 'and if we have not rather out of anxiety about a matter done this, saying: In time to come your children might speak unto our children, saying: What have ye to do with the LORD, the God of Israel?'
    translation: JPS 1917
    original: וְאִם־לֹא מִדְּאָגָה מִדָּבָר עָשִׂינוּ אֶת־זֹאת לֵאמֹר מָחָר יֹאמְרוּ בְנֵיכֶם לְבָנֵינוּ לֵאמֹר מַה־לָּכֶם וְלַיהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ואם לא מדאגה מדבר עשינו את זאת לאמר מחר יאמרו בניכם לבנינו לאמר מה לכם וליהוה אלהי ישראל
    kjvRefs:
    - Joshua 22:24
    kjvOsis:
    - Josh.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.25
    scripture: tanakh
    name: Tanakh Joshua 22:25
    ref: Joshua 22:25
    book: Josh
    section: neviim
    chapter: 22
    verse: 25
    ordinal: 6446
    text: for the LORD hath made the Jordan a border between us and you, ye children of Reuben and children of Gad; ye have no portion in the LORD; so might your children make our children cease from fearing the LORD.
    translation: JPS 1917
    original: וּגְבוּל נָתַן־יְהוָה בֵּינֵנוּ וּבֵינֵיכֶם בְּנֵי־רְאוּבֵן וּבְנֵי־גָד אֶת־הַיַּרְדֵּן אֵין־לָכֶם חֵלֶק בַּיהוָה וְהִשְׁבִּיתוּ בְנֵיכֶם אֶת־בָּנֵינוּ לְבִלְתִּי יְרֹא אֶת־יְהוָה׃
    hebrewPlain: וגבול נתן יהוה ביננו וביניכם בני ראובן ובני גד את הירדן אין לכם חלק ביהוה והשביתו בניכם את בנינו לבלתי ירא את יהוה
    kjvRefs:
    - Joshua 22:25
    kjvOsis:
    - Josh.22.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.26
    scripture: tanakh
    name: Tanakh Joshua 22:26
    ref: Joshua 22:26
    book: Josh
    section: neviim
    chapter: 22
    verse: 26
    ordinal: 6447
    text: 'Therefore we said: Let us now prepare to build us an altar, not for burnt-offering, nor for sacrifice;'
    translation: JPS 1917
    original: וַנֹּאמֶר נַעֲשֶׂה־נָּא לָנוּ לִבְנוֹת אֶת־הַמִּזְבֵּחַ לֹא לְעוֹלָה וְלֹא לְזָבַח׃
    hebrewPlain: ונאמר נעשה נא לנו לבנות את המזבח לא לעולה ולא לזבח
    kjvRefs:
    - Joshua 22:26
    kjvOsis:
    - Josh.22.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.27
    scripture: tanakh
    name: Tanakh Joshua 22:27
    ref: Joshua 22:27
    book: Josh
    section: neviim
    chapter: 22
    verse: 27
    ordinal: 6448
    text: 'but it shall be a witness between us and you, and between our generations after us, that we may do the service of the LORD before Him with our burnt-offerings, and with our sacrifices, and with our peace-offerings; that your children may not say to our children in time to come: Ye have no portion in the LORD.'
    translation: JPS 1917
    original: כִּי עֵד הוּא בֵּינֵינוּ וּבֵינֵיכֶם וּבֵין דֹּרוֹתֵינוּ אַחֲרֵינוּ לַעֲבֹד אֶת־עֲבֹדַת יְהוָה לְפָנָיו בְּעֹלוֹתֵינוּ וּבִזְבָחֵינוּ וּבִשְׁלָמֵינוּ וְלֹא־יֹאמְרוּ בְנֵיכֶם מָחָר לְבָנֵינוּ אֵין־לָכֶם חֵלֶק בַּיהוָה׃
    hebrewPlain: כי עד הוא בינינו וביניכם ובין דרותינו אחרינו לעבד את עבדת יהוה לפניו בעלותינו ובזבחינו ובשלמינו ולא יאמרו בניכם מחר לבנינו אין לכם חלק ביהוה
    kjvRefs:
    - Joshua 22:27
    kjvOsis:
    - Josh.22.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.28
    scripture: tanakh
    name: Tanakh Joshua 22:28
    ref: Joshua 22:28
    book: Josh
    section: neviim
    chapter: 22
    verse: 28
    ordinal: 6449
    text: 'Therefore said we: It shall be, when they so say to us or to our generations in time to come, that we shall say: Behold the pattern of the altar of the LORD, which our fathers made, not for burnt-offering, nor for sacrifice; but it is a witness between us and you.'
    translation: JPS 1917
    original: וַנֹּאמֶר וְהָיָה כִּי־יֹאמְרוּ אֵלֵינוּ וְאֶל־דֹּרֹתֵינוּ מָחָר וְאָמַרְנוּ רְאוּ אֶת־תַּבְנִית מִזְבַּח יְהוָה אֲשֶׁר־עָשׂוּ אֲבוֹתֵינוּ לֹא לְעוֹלָה וְלֹא לְזֶבַח כִּי־עֵד הוּא בֵּינֵינוּ וּבֵינֵיכֶם׃
    hebrewPlain: ונאמר והיה כי יאמרו אלינו ואל דרתינו מחר ואמרנו ראו את תבנית מזבח יהוה אשר עשו אבותינו לא לעולה ולא לזבח כי עד הוא בינינו וביניכם
    kjvRefs:
    - Joshua 22:28
    kjvOsis:
    - Josh.22.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.29
    scripture: tanakh
    name: Tanakh Joshua 22:29
    ref: Joshua 22:29
    book: Josh
    section: neviim
    chapter: 22
    verse: 29
    ordinal: 6450
    text: Far be it from us that we should rebel against the LORD, and turn away this day from following the LORD, to build an altar for burnt-offering, for meal-offering, or for sacrifice, besides the altar of the LORD our God that is before His tabernacle.’
    translation: JPS 1917
    original: חָלִילָה לָּנוּ מִמֶּנּוּ לִמְרֹד בַּיהוָה וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה לִבְנוֹת מִזְבֵּחַ לְעֹלָה לְמִנְחָה וּלְזָבַח מִלְּבַד מִזְבַּח יְהוָה אֱלֹהֵינוּ אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ׃
    hebrewPlain: חלילה לנו ממנו למרד ביהוה ולשוב היום מאחרי יהוה לבנות מזבח לעלה למנחה ולזבח מלבד מזבח יהוה אלהינו אשר לפני משכנו
    kjvRefs:
    - Joshua 22:29
    kjvOsis:
    - Josh.22.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.30
    scripture: tanakh
    name: Tanakh Joshua 22:30
    ref: Joshua 22:30
    book: Josh
    section: neviim
    chapter: 22
    verse: 30
    ordinal: 6451
    text: And when Phinehas the priest, and the princes of the congregation, even the heads of the thousands of Israel that were with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spoke, it pleased them well.
    translation: JPS 1917
    original: וַיִּשְׁמַע פִּינְחָס הַכֹּהֵן וּנְשִׂיאֵי הָעֵדָה וְרָאשֵׁי אַלְפֵי יִשְׂרָאֵל אֲשֶׁר אִתּוֹ אֶת־הַדְּבָרִים אֲשֶׁר דִּבְּרוּ בְּנֵי־רְאוּבֵן וּבְנֵי־גָד וּבְנֵי מְנַשֶּׁה וַיִּיטַב בְּעֵינֵיהֶם׃
    hebrewPlain: וישמע פינחס הכהן ונשיאי העדה וראשי אלפי ישראל אשר אתו את הדברים אשר דברו בני ראובן ובני גד ובני מנשה וייטב בעיניהם
    kjvRefs:
    - Joshua 22:30
    kjvOsis:
    - Josh.22.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.31
    scripture: tanakh
    name: Tanakh Joshua 22:31
    ref: Joshua 22:31
    book: Josh
    section: neviim
    chapter: 22
    verse: 31
    ordinal: 6452
    text: 'And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh: ‘This day we know that the LORD is in the midst of us, because ye have not committed this treachery against the LORD; now have ye delivered the children of Israel out of the hand of the LORD.’'
    translation: JPS 1917
    original: וַיֹּאמֶר פִּינְחָס בֶּן־אֶלְעָזָר הַכֹּהֵן אֶל־בְּנֵי־רְאוּבֵן וְאֶל־בְּנֵי־גָד וְאֶל־בְּנֵי מְנַשֶּׁה הַיּוֹם יָדַעְנוּ כִּי־בְתוֹכֵנוּ יְהוָה אֲשֶׁר לֹא־מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה אָז הִצַּלְתֶּם אֶת־בְּנֵי יִשְׂרָאֵל מִיַּד יְהוָה׃
    hebrewPlain: ויאמר פינחס בן אלעזר הכהן אל בני ראובן ואל בני גד ואל בני מנשה היום ידענו כי בתוכנו יהוה אשר לא מעלתם ביהוה המעל הזה אז הצלתם את בני ישראל מיד יהוה
    kjvRefs:
    - Joshua 22:31
    kjvOsis:
    - Josh.22.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.32
    scripture: tanakh
    name: Tanakh Joshua 22:32
    ref: Joshua 22:32
    book: Josh
    section: neviim
    chapter: 22
    verse: 32
    ordinal: 6453
    text: And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, and brought them back word.
    translation: JPS 1917
    original: וַיָּשָׁב פִּינְחָס בֶּן־אֶלְעָזָר הַכֹּהֵן וְהַנְּשִׂיאִים מֵאֵת בְּנֵי־רְאוּבֵן וּמֵאֵת בְּנֵי־גָד מֵאֶרֶץ הַגִּלְעָד אֶל־אֶרֶץ כְּנַעַן אֶל־בְּנֵי יִשְׂרָאֵל וַיָּשִׁבוּ אוֹתָם דָּבָר׃
    hebrewPlain: וישב פינחס בן אלעזר הכהן והנשיאים מאת בני ראובן ומאת בני גד מארץ הגלעד אל ארץ כנען אל בני ישראל וישבו אותם דבר
    kjvRefs:
    - Joshua 22:32
    kjvOsis:
    - Josh.22.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.33
    scripture: tanakh
    name: Tanakh Joshua 22:33
    ref: Joshua 22:33
    book: Josh
    section: neviim
    chapter: 22
    verse: 33
    ordinal: 6454
    text: And the thing pleased the children of Israel; and the children of Israel blessed God, and spoke no more of going up against them to war, to destroy the land wherein the children of Reuben and the children of Gad dwelt.
    translation: JPS 1917
    original: וַיִּיטַב הַדָּבָר בְּעֵינֵי בְּנֵי יִשְׂרָאֵל וַיְבָרֲכוּ אֱלֹהִים בְּנֵי יִשְׂרָאֵל וְלֹא אָמְרוּ לַעֲלוֹת עֲלֵיהֶם לַצָּבָא לְשַׁחֵת אֶת־הָאָרֶץ אֲשֶׁר בְּנֵי־רְאוּבֵן וּבְנֵי־גָד יֹשְׁבִים בָּהּ׃
    hebrewPlain: וייטב הדבר בעיני בני ישראל ויברכו אלהים בני ישראל ולא אמרו לעלות עליהם לצבא לשחת את הארץ אשר בני ראובן ובני גד ישבים בה
    kjvRefs:
    - Joshua 22:33
    kjvOsis:
    - Josh.22.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.22.34
    scripture: tanakh
    name: Tanakh Joshua 22:34
    ref: Joshua 22:34
    book: Josh
    section: neviim
    chapter: 22
    verse: 34
    ordinal: 6455
    text: 'And the children of Reuben and the children of Gad called the altar—: ‘for it is a witness between us that the LORD is God.’'
    translation: JPS 1917
    original: וַיִּקְרְאוּ בְּנֵי־רְאוּבֵן וּבְנֵי־גָד לַמִּזְבֵּחַ כִּי עֵד הוּא בֵּינֹתֵינוּ כִּי יְהוָה הָאֱלֹהִים׃
    hebrewPlain: ויקראו בני ראובן ובני גד למזבח כי עד הוא בינתינו כי יהוה האלהים
    kjvRefs:
    - Joshua 22:34
    kjvOsis:
    - Josh.22.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.22
- type: TanakhVerse
  data:
    osis: Josh.23.1
    scripture: tanakh
    name: Tanakh Joshua 23:1
    ref: Joshua 23:1
    book: Josh
    section: neviim
    chapter: 23
    verse: 1
    ordinal: 6456
    text: And it came to pass after many days, when the LORD had given rest unto Israel from all their enemies round about, and Joshua was old and well stricken in years;
    translation: JPS 1917
    original: וַיְהִי מִיָּמִים רַבִּים אַחֲרֵי אֲשֶׁר־הֵנִיחַ יְהוָה לְיִשְׂרָאֵל מִכָּל־אֹיְבֵיהֶם מִסָּבִיב וִיהוֹשֻׁעַ זָקֵן בָּא בַּיָּמִים׃
    hebrewPlain: ויהי מימים רבים אחרי אשר הניח יהוה לישראל מכל איביהם מסביב ויהושע זקן בא בימים
    kjvRefs:
    - Joshua 23:1
    kjvOsis:
    - Josh.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.2
    scripture: tanakh
    name: Tanakh Joshua 23:2
    ref: Joshua 23:2
    book: Josh
    section: neviim
    chapter: 23
    verse: 2
    ordinal: 6457
    text: 'that Joshua called for all Israel, for their elders and for their heads, and for their judges and for their officers, and said unto them: ‘I am old and well stricken in years.'
    translation: JPS 1917
    original: וַיִּקְרָא יְהוֹשֻׁעַ לְכָל־יִשְׂרָאֵל לִזְקֵנָיו וּלְרָאשָׁיו וּלְשֹׁפְטָיו וּלְשֹׁטְרָיו וַיֹּאמֶר אֲלֵהֶם אֲנִי זָקַנְתִּי בָּאתִי בַּיָּמִים׃
    hebrewPlain: ויקרא יהושע לכל ישראל לזקניו ולראשיו ולשפטיו ולשטריו ויאמר אלהם אני זקנתי באתי בימים
    kjvRefs:
    - Joshua 23:2
    kjvOsis:
    - Josh.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.3
    scripture: tanakh
    name: Tanakh Joshua 23:3
    ref: Joshua 23:3
    book: Josh
    section: neviim
    chapter: 23
    verse: 3
    ordinal: 6458
    text: And ye have seen all that the LORD your God hath done unto all these nations because of you; for the LORD your God, He it is that hath fought for you.
    translation: JPS 1917
    original: וְאַתֶּם רְאִיתֶם אֵת כָּל־אֲשֶׁר עָשָׂה יְהוָה אֱלֹהֵיכֶם לְכָל־הַגּוֹיִם הָאֵלֶּה מִפְּנֵיכֶם כִּי יְהוָה אֱלֹהֵיכֶם הוּא הַנִּלְחָם לָכֶם׃
    hebrewPlain: ואתם ראיתם את כל אשר עשה יהוה אלהיכם לכל הגוים האלה מפניכם כי יהוה אלהיכם הוא הנלחם לכם
    kjvRefs:
    - Joshua 23:3
    kjvOsis:
    - Josh.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.4
    scripture: tanakh
    name: Tanakh Joshua 23:4
    ref: Joshua 23:4
    book: Josh
    section: neviim
    chapter: 23
    verse: 4
    ordinal: 6459
    text: Behold, I have allotted unto you for an inheritance, according to your tribes, these nations that remain, from the Jordan, with all the nations that I have cut off, even unto the Great Sea toward the going down of the sun.
    translation: JPS 1917
    original: רְאוּ הִפַּלְתִּי לָכֶם אֶת־הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה בְּנַחֲלָה לְשִׁבְטֵיכֶם מִן־הַיַּרְדֵּן וְכָל־הַגּוֹיִם אֲשֶׁר הִכְרַתִּי וְהַיָּם הַגָּדוֹל מְבוֹא הַשָּׁמֶשׁ׃
    hebrewPlain: ראו הפלתי לכם את הגוים הנשארים האלה בנחלה לשבטיכם מן הירדן וכל הגוים אשר הכרתי והים הגדול מבוא השמש
    kjvRefs:
    - Joshua 23:4
    kjvOsis:
    - Josh.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.5
    scripture: tanakh
    name: Tanakh Joshua 23:5
    ref: Joshua 23:5
    book: Josh
    section: neviim
    chapter: 23
    verse: 5
    ordinal: 6460
    text: And the LORD your God, He shall thrust them out from before you, and drive them from out of your sight; and ye shall possess their land, as the LORD your God spoke unto you.
    translation: JPS 1917
    original: וַיהוָה אֱלֹהֵיכֶם הוּא יֶהְדֳּפֵם מִפְּנֵיכֶם וְהוֹרִישׁ אֹתָם מִלִּפְנֵיכֶם וִירִשְׁתֶּם אֶת־אַרְצָם כַּאֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם לָכֶם׃
    hebrewPlain: ויהוה אלהיכם הוא יהדפם מפניכם והוריש אתם מלפניכם וירשתם את ארצם כאשר דבר יהוה אלהיכם לכם
    kjvRefs:
    - Joshua 23:5
    kjvOsis:
    - Josh.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.6
    scripture: tanakh
    name: Tanakh Joshua 23:6
    ref: Joshua 23:6
    book: Josh
    section: neviim
    chapter: 23
    verse: 6
    ordinal: 6461
    text: Therefore be ye very courageous to keep and to do all that is written in the book of the law of Moses, that ye turn not aside therefrom to the right hand or to the left;
    translation: JPS 1917
    original: וַחֲזַקְתֶּם מְאֹד לִשְׁמֹר וְלַעֲשׂוֹת אֵת כָּל־הַכָּתוּב בְּסֵפֶר תּוֹרַת מֹשֶׁה לְבִלְתִּי סוּר־מִמֶּנּוּ יָמִין וּשְׂמֹאול׃
    hebrewPlain: וחזקתם מאד לשמר ולעשות את כל הכתוב בספר תורת משה לבלתי סור ממנו ימין ושמאול
    kjvRefs:
    - Joshua 23:6
    kjvOsis:
    - Josh.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.7
    scripture: tanakh
    name: Tanakh Joshua 23:7
    ref: Joshua 23:7
    book: Josh
    section: neviim
    chapter: 23
    verse: 7
    ordinal: 6462
    text: that ye come not among these nations, these that remain among you; neither make mention of the name of their gods, nor cause to swear by them, neither serve them, nor worship them;
    translation: JPS 1917
    original: לְבִלְתִּי־בוֹא בַּגּוֹיִם הָאֵלֶּה הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם וּבְשֵׁם אֱלֹהֵיהֶם לֹא־תַזְכִּירוּ וְלֹא תַשְׁבִּיעוּ וְלֹא תַעַבְדוּם וְלֹא תִשְׁתַּחֲווּ לָהֶם׃
    hebrewPlain: לבלתי בוא בגוים האלה הנשארים האלה אתכם ובשם אלהיהם לא תזכירו ולא תשביעו ולא תעבדום ולא תשתחוו להם
    kjvRefs:
    - Joshua 23:7
    kjvOsis:
    - Josh.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.8
    scripture: tanakh
    name: Tanakh Joshua 23:8
    ref: Joshua 23:8
    book: Josh
    section: neviim
    chapter: 23
    verse: 8
    ordinal: 6463
    text: but cleave unto the LORD your God, as ye have done unto this day;
    translation: JPS 1917
    original: כִּי אִם־בַּיהוָה אֱלֹהֵיכֶם תִּדְבָּקוּ כַּאֲשֶׁר עֲשִׂיתֶם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: כי אם ביהוה אלהיכם תדבקו כאשר עשיתם עד היום הזה
    kjvRefs:
    - Joshua 23:8
    kjvOsis:
    - Josh.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.9
    scripture: tanakh
    name: Tanakh Joshua 23:9
    ref: Joshua 23:9
    book: Josh
    section: neviim
    chapter: 23
    verse: 9
    ordinal: 6464
    text: wherefore the LORD hath driven out from before you great nations and mighty; but as for you, no man hath stood against you unto this day.
    translation: JPS 1917
    original: וַיּוֹרֶשׁ יְהוָה מִפְּנֵיכֶם גּוֹיִם גְּדֹלִים וַעֲצוּמִים וְאַתֶּם לֹא־עָמַד אִישׁ בִּפְנֵיכֶם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויורש יהוה מפניכם גוים גדלים ועצומים ואתם לא עמד איש בפניכם עד היום הזה
    kjvRefs:
    - Joshua 23:9
    kjvOsis:
    - Josh.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.10
    scripture: tanakh
    name: Tanakh Joshua 23:10
    ref: Joshua 23:10
    book: Josh
    section: neviim
    chapter: 23
    verse: 10
    ordinal: 6465
    text: One man of you hath chased a thousand; for the LORD your God, He it is that fought for you, as He spoke unto you.
    translation: JPS 1917
    original: אִישׁ־אֶחָד מִכֶּם יִרְדָּף־אָלֶף כִּי יְהוָה אֱלֹהֵיכֶם הוּא הַנִּלְחָם לָכֶם כַּאֲשֶׁר דִּבֶּר לָכֶם׃
    hebrewPlain: איש אחד מכם ירדף אלף כי יהוה אלהיכם הוא הנלחם לכם כאשר דבר לכם
    kjvRefs:
    - Joshua 23:10
    kjvOsis:
    - Josh.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.11
    scripture: tanakh
    name: Tanakh Joshua 23:11
    ref: Joshua 23:11
    book: Josh
    section: neviim
    chapter: 23
    verse: 11
    ordinal: 6466
    text: Take good heed therefore unto yourselves, that ye love the LORD your God.
    translation: JPS 1917
    original: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם לְאַהֲבָה אֶת־יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ונשמרתם מאד לנפשתיכם לאהבה את יהוה אלהיכם
    kjvRefs:
    - Joshua 23:11
    kjvOsis:
    - Josh.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.12
    scripture: tanakh
    name: Tanakh Joshua 23:12
    ref: Joshua 23:12
    book: Josh
    section: neviim
    chapter: 23
    verse: 12
    ordinal: 6467
    text: Else if ye do in any wise go back, and cleave unto the remnant of these nations, even these that remain among you, and make marriages with them, and go in unto them, and they to you;
    translation: JPS 1917
    original: כִּי אִם־שׁוֹב תָּשׁוּבוּ וּדְבַקְתֶּם בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם וְהִתְחַתַּנְתֶּם בָּהֶם וּבָאתֶם בָּהֶם וְהֵם בָּכֶם׃
    hebrewPlain: כי אם שוב תשובו ודבקתם ביתר הגוים האלה הנשארים האלה אתכם והתחתנתם בהם ובאתם בהם והם בכם
    kjvRefs:
    - Joshua 23:12
    kjvOsis:
    - Josh.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.13
    scripture: tanakh
    name: Tanakh Joshua 23:13
    ref: Joshua 23:13
    book: Josh
    section: neviim
    chapter: 23
    verse: 13
    ordinal: 6468
    text: know for a certainty that the LORD your God will no more drive these nations from out of your sight; but they shall be a snare and a trap unto you, and a scourge in your sides, and pricks in your eyes, until ye perish from off this good land which the LORD your God hath given you.
    translation: JPS 1917
    original: יָדוֹעַ תֵּדְעוּ כִּי לֹא יוֹסִיף יְהוָה אֱלֹהֵיכֶם לְהוֹרִישׁ אֶת־הַגּוֹיִם הָאֵלֶּה מִלִּפְנֵיכֶם וְהָיוּ לָכֶם לְפַח וּלְמוֹקֵשׁ וּלְשֹׁטֵט בְּצִדֵּיכֶם וְלִצְנִנִים בְּעֵינֵיכֶם עַד־אֲבָדְכֶם מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת אֲשֶׁר נָתַן לָכֶם יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ידוע תדעו כי לא יוסיף יהוה אלהיכם להוריש את הגוים האלה מלפניכם והיו לכם לפח ולמוקש ולשטט בצדיכם ולצננים בעיניכם עד אבדכם מעל האדמה הטובה הזאת אשר נתן לכם יהוה אלהיכם
    kjvRefs:
    - Joshua 23:13
    kjvOsis:
    - Josh.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.14
    scripture: tanakh
    name: Tanakh Joshua 23:14
    ref: Joshua 23:14
    book: Josh
    section: neviim
    chapter: 23
    verse: 14
    ordinal: 6469
    text: And, behold, this day I am going the way of all the earth; consider ye therefore in all your heart and in all your soul, that not one thing hath failed of all the good things which the LORD your God spoke concerning you; all are come to pass unto you, not one thing hath failed thereof.
    translation: JPS 1917
    original: וְהִנֵּה אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל־הָאָרֶץ וִידַעְתֶּם בְּכָל־לְבַבְכֶם וּבְכָל־נַפְשְׁכֶם כִּי לֹא־נָפַל דָּבָר אֶחָד מִכֹּל הַדְּבָרִים הַטּוֹבִים אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם הַכֹּל בָּאוּ לָכֶם לֹא־נָפַל מִמֶּנּוּ דָּבָר אֶחָד׃
    hebrewPlain: והנה אנכי הולך היום בדרך כל הארץ וידעתם בכל לבבכם ובכל נפשכם כי לא נפל דבר אחד מכל הדברים הטובים אשר דבר יהוה אלהיכם עליכם הכל באו לכם לא נפל ממנו דבר אחד
    kjvRefs:
    - Joshua 23:14
    kjvOsis:
    - Josh.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.15
    scripture: tanakh
    name: Tanakh Joshua 23:15
    ref: Joshua 23:15
    book: Josh
    section: neviim
    chapter: 23
    verse: 15
    ordinal: 6470
    text: And it shall come to pass, that as all the good things are come upon you of which the LORD your God spoke unto you, so shall the LORD bring upon you all the evil things, until He have destroyed you from off this good land which the LORD your God hath given you.
    translation: JPS 1917
    original: וְהָיָה כַּאֲשֶׁר־בָּא עֲלֵיכֶם כָּל־הַדָּבָר הַטּוֹב אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם אֲלֵיכֶם כֵּן יָבִיא יְהוָה עֲלֵיכֶם אֵת כָּל־הַדָּבָר הָרָע עַד־הַשְׁמִידוֹ אוֹתְכֶם מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת אֲשֶׁר נָתַן לָכֶם יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: והיה כאשר בא עליכם כל הדבר הטוב אשר דבר יהוה אלהיכם אליכם כן יביא יהוה עליכם את כל הדבר הרע עד השמידו אותכם מעל האדמה הטובה הזאת אשר נתן לכם יהוה אלהיכם
    kjvRefs:
    - Joshua 23:15
    kjvOsis:
    - Josh.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.23.16
    scripture: tanakh
    name: Tanakh Joshua 23:16
    ref: Joshua 23:16
    book: Josh
    section: neviim
    chapter: 23
    verse: 16
    ordinal: 6471
    text: When ye transgress the covenant of the LORD your God, which He commanded you, and go and serve other gods, and worship them; then shall the anger of the LORD be kindled against you, and ye shall perish quickly from off the good land which He hath given unto you.’
    translation: JPS 1917
    original: בְּעָבְרְכֶם אֶת־בְּרִית יְהוָה אֱלֹהֵיכֶם אֲשֶׁר צִוָּה אֶתְכֶם וַהֲלַכְתֶּם וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים וְהִשְׁתַּחֲוִיתֶם לָהֶם וְחָרָה אַף־יְהוָה בָּכֶם וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטּוֹבָה אֲשֶׁר נָתַן לָכֶם׃
    hebrewPlain: בעברכם את ברית יהוה אלהיכם אשר צוה אתכם והלכתם ועבדתם אלהים אחרים והשתחויתם להם וחרה אף יהוה בכם ואבדתם מהרה מעל הארץ הטובה אשר נתן לכם
    kjvRefs:
    - Joshua 23:16
    kjvOsis:
    - Josh.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.23
- type: TanakhVerse
  data:
    osis: Josh.24.1
    scripture: tanakh
    name: Tanakh Joshua 24:1
    ref: Joshua 24:1
    book: Josh
    section: neviim
    chapter: 24
    verse: 1
    ordinal: 6472
    text: And Joshua gathered all the tribes of Israel to Shechem, and called for the elders of Israel, and for their heads, and for their judges, and for their officers; and they presented themselves before God.
    translation: JPS 1917
    original: וַיֶּאֶסֹף יְהוֹשֻׁעַ אֶת־כָּל־שִׁבְטֵי יִשְׂרָאֵל שְׁכֶמָה וַיִּקְרָא לְזִקְנֵי יִשְׂרָאֵל וּלְרָאשָׁיו וּלְשֹׁפְטָיו וּלְשֹׁטְרָיו וַיִּתְיַצְּבוּ לִפְנֵי הָאֱלֹהִים׃
    hebrewPlain: ויאסף יהושע את כל שבטי ישראל שכמה ויקרא לזקני ישראל ולראשיו ולשפטיו ולשטריו ויתיצבו לפני האלהים
    kjvRefs:
    - Joshua 24:1
    kjvOsis:
    - Josh.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.2
    scripture: tanakh
    name: Tanakh Joshua 24:2
    ref: Joshua 24:2
    book: Josh
    section: neviim
    chapter: 24
    verse: 2
    ordinal: 6473
    text: 'And Joshua said unto all the people: ‘Thus saith the LORD, the God of Israel: Your fathers dwelt of old time beyond the River, even Terah, the father of Abraham, and the father of Nahor; and they served other gods.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־כָּל־הָעָם כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל בְּעֵבֶר הַנָּהָר יָשְׁבוּ אֲבוֹתֵיכֶם מֵעוֹלָם תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ויאמר יהושע אל כל העם כה אמר יהוה אלהי ישראל בעבר הנהר ישבו אבותיכם מעולם תרח אבי אברהם ואבי נחור ויעבדו אלהים אחרים
    kjvRefs:
    - Joshua 24:2
    kjvOsis:
    - Josh.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.3
    scripture: tanakh
    name: Tanakh Joshua 24:3
    ref: Joshua 24:3
    book: Josh
    section: neviim
    chapter: 24
    verse: 3
    ordinal: 6474
    text: And I took your father Abraham from beyond the River, and led him throughout all the land of Canaan, and multiplied his seed, and gave him Isaac.
    translation: JPS 1917
    original: וָאֶקַּח אֶת־אֲבִיכֶם אֶת־אַבְרָהָם מֵעֵבֶר הַנָּהָר וָאוֹלֵךְ אוֹתוֹ בְּכָל־אֶרֶץ כְּנָעַן וארב [וָאַרְבֶּה] אֶת־זַרְעוֹ וָאֶתֶּן־לוֹ אֶת־יִצְחָק׃
    hebrewPlain: ואקח את אביכם את אברהם מעבר הנהר ואולך אותו בכל ארץ כנען וארב [וארבה] את זרעו ואתן לו את יצחק
    kjvRefs:
    - Joshua 24:3
    kjvOsis:
    - Josh.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.4
    scripture: tanakh
    name: Tanakh Joshua 24:4
    ref: Joshua 24:4
    book: Josh
    section: neviim
    chapter: 24
    verse: 4
    ordinal: 6475
    text: And I gave unto Isaac Jacob and Esau; and I gave unto Esau mount Seir, to possess it; and Jacob and his children went down into Egypt.
    translation: JPS 1917
    original: וָאֶתֵּן לְיִצְחָק אֶת־יַעֲקֹב וְאֶת־עֵשָׂו וָאֶתֵּן לְעֵשָׂו אֶת־הַר שֵׂעִיר לָרֶשֶׁת אוֹתוֹ וְיַעֲקֹב וּבָנָיו יָרְדוּ מִצְרָיִם׃
    hebrewPlain: ואתן ליצחק את יעקב ואת עשו ואתן לעשו את הר שעיר לרשת אותו ויעקב ובניו ירדו מצרים
    kjvRefs:
    - Joshua 24:4
    kjvOsis:
    - Josh.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.5
    scripture: tanakh
    name: Tanakh Joshua 24:5
    ref: Joshua 24:5
    book: Josh
    section: neviim
    chapter: 24
    verse: 5
    ordinal: 6476
    text: And I sent Moses and Aaron, and I plagued Egypt, according to that which I did in the midst thereof; and afterward I brought you out.
    translation: JPS 1917
    original: וָאֶשְׁלַח אֶת־מֹשֶׁה וְאֶת־אַהֲרֹן וָאֶגֹּף אֶת־מִצְרַיִם כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ וְאַחַר הוֹצֵאתִי אֶתְכֶם׃
    hebrewPlain: ואשלח את משה ואת אהרן ואגף את מצרים כאשר עשיתי בקרבו ואחר הוצאתי אתכם
    kjvRefs:
    - Joshua 24:5
    kjvOsis:
    - Josh.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.6
    scripture: tanakh
    name: Tanakh Joshua 24:6
    ref: Joshua 24:6
    book: Josh
    section: neviim
    chapter: 24
    verse: 6
    ordinal: 6477
    text: And I brought your fathers out of Egypt; and ye came unto the sea; and the Egyptians pursued after your fathers with chariots and with horsemen unto the Red Sea.
    translation: JPS 1917
    original: וָאוֹצִיא אֶת־אֲבוֹתֵיכֶם מִמִּצְרַיִם וַתָּבֹאוּ הַיָּמָּה וַיִּרְדְּפוּ מִצְרַיִם אַחֲרֵי אֲבוֹתֵיכֶם בְּרֶכֶב וּבְפָרָשִׁים יַם־סוּף׃
    hebrewPlain: ואוציא את אבותיכם ממצרים ותבאו הימה וירדפו מצרים אחרי אבותיכם ברכב ובפרשים ים סוף
    kjvRefs:
    - Joshua 24:6
    kjvOsis:
    - Josh.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.7
    scripture: tanakh
    name: Tanakh Joshua 24:7
    ref: Joshua 24:7
    book: Josh
    section: neviim
    chapter: 24
    verse: 7
    ordinal: 6478
    text: And when they cried out unto the LORD, He put darkness between you and the Egyptians, and brought the sea upon them, and covered them; and your eyes saw what I did in Egypt; and ye dwelt in the wilderness many days.
    translation: JPS 1917
    original: וַיִּצְעֲקוּ אֶל־יְהוָה וַיָּשֶׂם מַאֲפֵל בֵּינֵיכֶם וּבֵין הַמִּצְרִים וַיָּבֵא עָלָיו אֶת־הַיָּם וַיְכַסֵּהוּ וַתִּרְאֶינָה עֵינֵיכֶם אֵת אֲשֶׁר־עָשִׂיתִי בְּמִצְרָיִם וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים׃
    hebrewPlain: ויצעקו אל יהוה וישם מאפל ביניכם ובין המצרים ויבא עליו את הים ויכסהו ותראינה עיניכם את אשר עשיתי במצרים ותשבו במדבר ימים רבים
    kjvRefs:
    - Joshua 24:7
    kjvOsis:
    - Josh.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.8
    scripture: tanakh
    name: Tanakh Joshua 24:8
    ref: Joshua 24:8
    book: Josh
    section: neviim
    chapter: 24
    verse: 8
    ordinal: 6479
    text: And I brought you into the land of the Amorites, that dwelt beyond the Jordan; and they fought with you; and I gave them into your hand, and ye possessed their land; and I destroyed them from before you.
    translation: JPS 1917
    original: ואבאה [וָאָבִיא] אֶתְכֶם אֶל־אֶרֶץ הָאֱמֹרִי הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן וַיִּלָּחֲמוּ אִתְּכֶם וָאֶתֵּן אוֹתָם בְּיֶדְכֶם וַתִּירְשׁוּ אֶת־אַרְצָם וָאַשְׁמִידֵם מִפְּנֵיכֶם׃
    hebrewPlain: ואבאה [ואביא] אתכם אל ארץ האמרי היושב בעבר הירדן וילחמו אתכם ואתן אותם בידכם ותירשו את ארצם ואשמידם מפניכם
    kjvRefs:
    - Joshua 24:8
    kjvOsis:
    - Josh.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.9
    scripture: tanakh
    name: Tanakh Joshua 24:9
    ref: Joshua 24:9
    book: Josh
    section: neviim
    chapter: 24
    verse: 9
    ordinal: 6480
    text: Then Balak the son of Zippor, king of Moab, arose and fought against Israel; and he sent and called Balaam the son of Beor to curse you.
    translation: JPS 1917
    original: וַיָּקָם בָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב וַיִּלָּחֶם בְּיִשְׂרָאֵל וַיִּשְׁלַח וַיִּקְרָא לְבִלְעָם בֶּן־בְּעוֹר לְקַלֵּל אֶתְכֶם׃
    hebrewPlain: ויקם בלק בן צפור מלך מואב וילחם בישראל וישלח ויקרא לבלעם בן בעור לקלל אתכם
    kjvRefs:
    - Joshua 24:9
    kjvOsis:
    - Josh.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.10
    scripture: tanakh
    name: Tanakh Joshua 24:10
    ref: Joshua 24:10
    book: Josh
    section: neviim
    chapter: 24
    verse: 10
    ordinal: 6481
    text: But I would not hearken unto Balaam; therefore he even blessed you; so I delivered you out of his hand.
    translation: JPS 1917
    original: וְלֹא אָבִיתִי לִשְׁמֹעַ לְבִלְעָם וַיְבָרֶךְ בָּרוֹךְ אֶתְכֶם וָאַצִּל אֶתְכֶם מִיָּדוֹ׃
    hebrewPlain: ולא אביתי לשמע לבלעם ויברך ברוך אתכם ואצל אתכם מידו
    kjvRefs:
    - Joshua 24:10
    kjvOsis:
    - Josh.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.11
    scripture: tanakh
    name: Tanakh Joshua 24:11
    ref: Joshua 24:11
    book: Josh
    section: neviim
    chapter: 24
    verse: 11
    ordinal: 6482
    text: And ye went over the Jordan, and came unto Jericho; and the men of Jericho fought against you, the Amorite, and the Perizzite, and the Canaanite, and the Hittite, and the Girgashite, the Hivite, and the Jebusite; and I delivered them into your hand.
    translation: JPS 1917
    original: וַתַּעַבְרוּ אֶת־הַיַּרְדֵּן וַתָּבֹאוּ אֶל־יְרִיחוֹ וַיִּלָּחֲמוּ בָכֶם בַּעֲלֵי־יְרִיחוֹ הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי וָאֶתֵּן אוֹתָם בְּיֶדְכֶם׃
    hebrewPlain: ותעברו את הירדן ותבאו אל יריחו וילחמו בכם בעלי יריחו האמרי והפרזי והכנעני והחתי והגרגשי החוי והיבוסי ואתן אותם בידכם
    kjvRefs:
    - Joshua 24:11
    kjvOsis:
    - Josh.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.12
    scripture: tanakh
    name: Tanakh Joshua 24:12
    ref: Joshua 24:12
    book: Josh
    section: neviim
    chapter: 24
    verse: 12
    ordinal: 6483
    text: And I sent the hornet before you, which drove them out from before you, even the two kings of the Amorites; not with thy sword, nor with thy bow.
    translation: JPS 1917
    original: וָאֶשְׁלַח לִפְנֵיכֶם אֶת־הַצִּרְעָה וַתְּגָרֶשׁ אוֹתָם מִפְּנֵיכֶם שְׁנֵי מַלְכֵי הָאֱמֹרִי לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ׃
    hebrewPlain: ואשלח לפניכם את הצרעה ותגרש אותם מפניכם שני מלכי האמרי לא בחרבך ולא בקשתך
    kjvRefs:
    - Joshua 24:12
    kjvOsis:
    - Josh.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.13
    scripture: tanakh
    name: Tanakh Joshua 24:13
    ref: Joshua 24:13
    book: Josh
    section: neviim
    chapter: 24
    verse: 13
    ordinal: 6484
    text: And I gave you a land whereon thou hadst not laboured, and cities which ye built not, and ye dwell therein; of vineyards and olive-yards which ye planted not do ye eat.
    translation: JPS 1917
    original: וָאֶתֵּן לָכֶם אֶרֶץ אֲשֶׁר לֹא־יָגַעְתָּ בָּהּ וְעָרִים אֲשֶׁר לֹא־בְנִיתֶם וַתֵּשְׁבוּ בָּהֶם כְּרָמִים וְזֵיתִים אֲשֶׁר לֹא־נְטַעְתֶּם אַתֶּם אֹכְלִים׃
    hebrewPlain: ואתן לכם ארץ אשר לא יגעת בה וערים אשר לא בניתם ותשבו בהם כרמים וזיתים אשר לא נטעתם אתם אכלים
    kjvRefs:
    - Joshua 24:13
    kjvOsis:
    - Josh.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.14
    scripture: tanakh
    name: Tanakh Joshua 24:14
    ref: Joshua 24:14
    book: Josh
    section: neviim
    chapter: 24
    verse: 14
    ordinal: 6485
    text: Now therefore fear the LORD, and serve Him in sincerity and in truth; and put away the gods which your fathers served beyond the River, and in Egypt; and serve ye the LORD.
    translation: JPS 1917
    original: וְעַתָּה יְראוּ אֶת־יְהוָה וְעִבְדוּ אֹתוֹ בְּתָמִים וּבֶאֱמֶת וְהָסִירוּ אֶת־אֱלֹהִים אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם בְּעֵבֶר הַנָּהָר וּבְמִצְרַיִם וְעִבְדוּ אֶת־יְהוָה׃
    hebrewPlain: ועתה יראו את יהוה ועבדו אתו בתמים ובאמת והסירו את אלהים אשר עבדו אבותיכם בעבר הנהר ובמצרים ועבדו את יהוה
    kjvRefs:
    - Joshua 24:14
    kjvOsis:
    - Josh.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.15
    scripture: tanakh
    name: Tanakh Joshua 24:15
    ref: Joshua 24:15
    book: Josh
    section: neviim
    chapter: 24
    verse: 15
    ordinal: 6486
    text: And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land ye dwell; but as for me and my house, we will serve the LORD.’
    translation: JPS 1917
    original: וְאִם רַע בְּעֵינֵיכֶם לַעֲבֹד אֶת־יְהוָה בַּחֲרוּ לָכֶם הַיּוֹם אֶת־מִי תַעֲבֹדוּן אִם אֶת־אֱלֹהִים אֲשֶׁר־עָבְדוּ אֲבוֹתֵיכֶם אֲשֶׁר בעבר [מֵעֵבֶר] הַנָּהָר וְאִם אֶת־אֱלֹהֵי הָאֱמֹרִי אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם וְאָנֹכִי וּבֵיתִי נַעֲבֹד אֶת־יְהוָה׃
    hebrewPlain: ואם רע בעיניכם לעבד את יהוה בחרו לכם היום את מי תעבדון אם את אלהים אשר עבדו אבותיכם אשר בעבר [מעבר] הנהר ואם את אלהי האמרי אשר אתם ישבים בארצם ואנכי וביתי נעבד את יהוה
    kjvRefs:
    - Joshua 24:15
    kjvOsis:
    - Josh.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.16
    scripture: tanakh
    name: Tanakh Joshua 24:16
    ref: Joshua 24:16
    book: Josh
    section: neviim
    chapter: 24
    verse: 16
    ordinal: 6487
    text: 'And the people answered and said: ‘Far be it from us that we should forsake the LORD, to serve other gods;'
    translation: JPS 1917
    original: וַיַּעַן הָעָם וַיֹּאמֶר חָלִילָה לָּנוּ מֵעֲזֹב אֶת־יְהוָה לַעֲבֹד אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ויען העם ויאמר חלילה לנו מעזב את יהוה לעבד אלהים אחרים
    kjvRefs:
    - Joshua 24:16
    kjvOsis:
    - Josh.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.17
    scripture: tanakh
    name: Tanakh Joshua 24:17
    ref: Joshua 24:17
    book: Josh
    section: neviim
    chapter: 24
    verse: 17
    ordinal: 6488
    text: for the LORD our God, He it is that brought us and our fathers up out of the land of Egypt, from the house of bondage, and that did those great signs in our sight, and preserved us in all the way wherein we went, and among all the peoples through the midst of whom we passed;
    translation: JPS 1917
    original: כִּי יְהוָה אֱלֹהֵינוּ הוּא הַמַּעֲלֶה אֹתָנוּ וְאֶת־אֲבוֹתֵינוּ מֵאֶרֶץ מִצְרַיִם מִבֵּית עֲבָדִים וַאֲשֶׁר עָשָׂה לְעֵינֵינוּ אֶת־הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה וַיִּשְׁמְרֵנוּ בְּכָל־הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם׃
    hebrewPlain: כי יהוה אלהינו הוא המעלה אתנו ואת אבותינו מארץ מצרים מבית עבדים ואשר עשה לעינינו את האתות הגדלות האלה וישמרנו בכל הדרך אשר הלכנו בה ובכל העמים אשר עברנו בקרבם
    kjvRefs:
    - Joshua 24:17
    kjvOsis:
    - Josh.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.18
    scripture: tanakh
    name: Tanakh Joshua 24:18
    ref: Joshua 24:18
    book: Josh
    section: neviim
    chapter: 24
    verse: 18
    ordinal: 6489
    text: and the LORD drove out from before us all the peoples, even the Amorites that dwelt in the land; therefore we also will serve the LORD; for He is our God.’
    translation: JPS 1917
    original: וַיְגָרֶשׁ יְהוָה אֶת־כָּל־הָעַמִּים וְאֶת־הָאֱמֹרִי יֹשֵׁב הָאָרֶץ מִפָּנֵינוּ גַּם־אֲנַחְנוּ נַעֲבֹד אֶת־יְהוָה כִּי־הוּא אֱלֹהֵינוּ׃
    hebrewPlain: ויגרש יהוה את כל העמים ואת האמרי ישב הארץ מפנינו גם אנחנו נעבד את יהוה כי הוא אלהינו
    kjvRefs:
    - Joshua 24:18
    kjvOsis:
    - Josh.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.19
    scripture: tanakh
    name: Tanakh Joshua 24:19
    ref: Joshua 24:19
    book: Josh
    section: neviim
    chapter: 24
    verse: 19
    ordinal: 6490
    text: 'And Joshua said unto the people: ‘Ye cannot serve the LORD; for He is a holy God; He is a jealous God; He will not forgive your transgression nor your sins.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־הָעָם לֹא תוּכְלוּ לַעֲבֹד אֶת־יְהוָה כִּי־אֱלֹהִים קְדֹשִׁים הוּא אֵל־קַנּוֹא הוּא לֹא־יִשָּׂא לְפִשְׁעֲכֶם וּלְחַטֹּאותֵיכֶם׃
    hebrewPlain: ויאמר יהושע אל העם לא תוכלו לעבד את יהוה כי אלהים קדשים הוא אל קנוא הוא לא ישא לפשעכם ולחטאותיכם
    kjvRefs:
    - Joshua 24:19
    kjvOsis:
    - Josh.24.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.20
    scripture: tanakh
    name: Tanakh Joshua 24:20
    ref: Joshua 24:20
    book: Josh
    section: neviim
    chapter: 24
    verse: 20
    ordinal: 6491
    text: If ye forsake the LORD, and serve strange gods, then He will turn and do you evil, and consume you, after that He hath done you good.’
    translation: JPS 1917
    original: כִּי תַעַזְבוּ אֶת־יְהוָה וַעֲבַדְתֶּם אֱלֹהֵי נֵכָר וְשָׁב וְהֵרַע לָכֶם וְכִלָּה אֶתְכֶם אַחֲרֵי אֲשֶׁר־הֵיטִיב לָכֶם׃
    hebrewPlain: כי תעזבו את יהוה ועבדתם אלהי נכר ושב והרע לכם וכלה אתכם אחרי אשר היטיב לכם
    kjvRefs:
    - Joshua 24:20
    kjvOsis:
    - Josh.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.21
    scripture: tanakh
    name: Tanakh Joshua 24:21
    ref: Joshua 24:21
    book: Josh
    section: neviim
    chapter: 24
    verse: 21
    ordinal: 6492
    text: 'And the people said unto Joshua: ‘Nay; but we will serve the LORD.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הָעָם אֶל־יְהוֹשֻׁעַ לֹא כִּי אֶת־יְהוָה נַעֲבֹד׃
    hebrewPlain: ויאמר העם אל יהושע לא כי את יהוה נעבד
    kjvRefs:
    - Joshua 24:21
    kjvOsis:
    - Josh.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.22
    scripture: tanakh
    name: Tanakh Joshua 24:22
    ref: Joshua 24:22
    book: Josh
    section: neviim
    chapter: 24
    verse: 22
    ordinal: 6493
    text: 'And Joshua said unto the people: ‘Ye are witnesses against yourselves that ye have chosen you the LORD, to serve Him.—And they said: ‘We are witnesses.’—'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־הָעָם עֵדִים אַתֶּם בָּכֶם כִּי־אַתֶּם בְּחַרְתֶּם לָכֶם אֶת־יְהוָה לַעֲבֹד אוֹתוֹ וַיֹּאמְרוּ עֵדִים׃
    hebrewPlain: ויאמר יהושע אל העם עדים אתם בכם כי אתם בחרתם לכם את יהוה לעבד אותו ויאמרו עדים
    kjvRefs:
    - Joshua 24:22
    kjvOsis:
    - Josh.24.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.23
    scripture: tanakh
    name: Tanakh Joshua 24:23
    ref: Joshua 24:23
    book: Josh
    section: neviim
    chapter: 24
    verse: 23
    ordinal: 6494
    text: Now therefore put away the strange gods which are among you, and incline your heart unto the LORD, the God of Israel.’
    translation: JPS 1917
    original: וְעַתָּה הָסִירוּ אֶת־אֱלֹהֵי הַנֵּכָר אֲשֶׁר בְּקִרְבְּכֶם וְהַטּוּ אֶת־לְבַבְכֶם אֶל־יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ועתה הסירו את אלהי הנכר אשר בקרבכם והטו את לבבכם אל יהוה אלהי ישראל
    kjvRefs:
    - Joshua 24:23
    kjvOsis:
    - Josh.24.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.24
    scripture: tanakh
    name: Tanakh Joshua 24:24
    ref: Joshua 24:24
    book: Josh
    section: neviim
    chapter: 24
    verse: 24
    ordinal: 6495
    text: 'And the people said unto Joshua: ‘The LORD our God will we serve, and unto His voice will we hearken.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הָעָם אֶל־יְהוֹשֻׁעַ אֶת־יְהוָה אֱלֹהֵינוּ נַעֲבֹד וּבְקוֹלוֹ נִשְׁמָע׃
    hebrewPlain: ויאמרו העם אל יהושע את יהוה אלהינו נעבד ובקולו נשמע
    kjvRefs:
    - Joshua 24:24
    kjvOsis:
    - Josh.24.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.25
    scripture: tanakh
    name: Tanakh Joshua 24:25
    ref: Joshua 24:25
    book: Josh
    section: neviim
    chapter: 24
    verse: 25
    ordinal: 6496
    text: So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem.
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוֹשֻׁעַ בְּרִית לָעָם בַּיּוֹם הַהוּא וַיָּשֶׂם לוֹ חֹק וּמִשְׁפָּט בִּשְׁכֶם׃
    hebrewPlain: ויכרת יהושע ברית לעם ביום ההוא וישם לו חק ומשפט בשכם
    kjvRefs:
    - Joshua 24:25
    kjvOsis:
    - Josh.24.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.26
    scripture: tanakh
    name: Tanakh Joshua 24:26
    ref: Joshua 24:26
    book: Josh
    section: neviim
    chapter: 24
    verse: 26
    ordinal: 6497
    text: And Joshua wrote these words in the book of the law of God; and he took a great stone, and set it up there under the oak that was by the sanctuary of the LORD.
    translation: JPS 1917
    original: וַיִּכְתֹּב יְהוֹשֻׁעַ אֶת־הַדְּבָרִים הָאֵלֶּה בְּסֵפֶר תּוֹרַת אֱלֹהִים וַיִּקַּח אֶבֶן גְּדוֹלָה וַיְקִימֶהָ שָּׁם תַּחַת הָאַלָּה אֲשֶׁר בְּמִקְדַּשׁ יְהוָה׃
    hebrewPlain: ויכתב יהושע את הדברים האלה בספר תורת אלהים ויקח אבן גדולה ויקימה שם תחת האלה אשר במקדש יהוה
    kjvRefs:
    - Joshua 24:26
    kjvOsis:
    - Josh.24.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.27
    scripture: tanakh
    name: Tanakh Joshua 24:27
    ref: Joshua 24:27
    book: Josh
    section: neviim
    chapter: 24
    verse: 27
    ordinal: 6498
    text: 'And Joshua said unto all the people: ‘Behold, this stone shall be a witness against us; for it hath heard all the words of the LORD which He spoke unto us; it shall be therefore a witness against you, lest ye deny your God.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־כָּל־הָעָם הִנֵּה הָאֶבֶן הַזֹּאת תִּהְיֶה־בָּנוּ לְעֵדָה כִּי־הִיא שָׁמְעָה אֵת כָּל־אִמְרֵי יְהוָה אֲשֶׁר דִּבֶּר עִמָּנוּ וְהָיְתָה בָכֶם לְעֵדָה פֶּן־תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם׃
    hebrewPlain: ויאמר יהושע אל כל העם הנה האבן הזאת תהיה בנו לעדה כי היא שמעה את כל אמרי יהוה אשר דבר עמנו והיתה בכם לעדה פן תכחשון באלהיכם
    kjvRefs:
    - Joshua 24:27
    kjvOsis:
    - Josh.24.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
