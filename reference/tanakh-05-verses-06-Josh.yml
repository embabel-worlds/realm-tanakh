    name: Tanakh Joshua 18:14
    ref: Joshua 18:14
    book: Josh
    section: neviim
    chapter: 18
    verse: 14
    ordinal: 6302
    text: And the border was drawn and turned about on the west side southward, from the mountain that lieth before Beth-horon southward; and the goings out thereof were at Kiriath-baal—the same is Kiriath-jearim—a city of the children of Judah; this was the west side.
    translation: JPS 1917
    original: וְתָאַר הַגְּבוּל וְנָסַב לִפְאַת־יָם נֶגְבָּה מִן־הָהָר אֲשֶׁר עַל־פְּנֵי בֵית־חֹרוֹן נֶגְבָּה והיה [וְהָיוּ] תֹצְאֹתָיו אֶל־קִרְיַת־בַּעַל הִיא קִרְיַת יְעָרִים עִיר בְּנֵי יְהוּדָה זֹאת פְּאַת־יָם׃
    hebrewPlain: ותאר הגבול ונסב לפאת ים נגבה מן ההר אשר על פני בית חרון נגבה והיה [והיו] תצאתיו אל קרית בעל היא קרית יערים עיר בני יהודה זאת פאת ים
    kjvRefs:
    - Joshua 18:14
    kjvOsis:
    - Josh.18.14
