    scripture: tanakh
    name: Tanakh Joshua 16:5
    ref: Joshua 16:5
    book: Josh
    section: neviim
    chapter: 16
    verse: 5
    ordinal: 6265
    text: And the border of the children of Ephraim according to their families was thus; even the border of their inheritance eastward was Atroth-addar, unto Beth-horon the upper.
    translation: JPS 1917
    original: וַיְהִי גְּבוּל בְּנֵי־אֶפְרַיִם לְמִשְׁפְּחֹתָם וַיְהִי גְּבוּל נַחֲלָתָם מִזְרָחָה עַטְרוֹת אַדָּר עַד־בֵּית חוֹרֹן עֶלְיוֹן׃
    hebrewPlain: ויהי גבול בני אפרים למשפחתם ויהי גבול נחלתם מזרחה עטרות אדר עד בית חורן עליון
    kjvRefs:
