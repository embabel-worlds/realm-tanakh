    translation: JPS 1917
    original: וּלְשֵׁבֶט הַלֵּוִי לֹא־נָתַן מֹשֶׁה נַחֲלָה יְהוָה אֱלֹהֵי יִשְׂרָאֵל הוּא נַחֲלָתָם כַּאֲשֶׁר דִּבֶּר לָהֶם׃
    hebrewPlain: ולשבט הלוי לא נתן משה נחלה יהוה אלהי ישראל הוא נחלתם כאשר דבר להם
    kjvRefs:
