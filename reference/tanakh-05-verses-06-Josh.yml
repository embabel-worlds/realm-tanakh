    name: Tanakh Joshua 24:28
    ref: Joshua 24:28
    book: Josh
    section: neviim
    chapter: 24
    verse: 28
    ordinal: 6499
    text: So Joshua sent the people away, every man unto his inheritance.
    translation: JPS 1917
    original: וַיְשַׁלַּח יְהוֹשֻׁעַ אֶת־הָעָם אִישׁ לְנַחֲלָתוֹ׃
    hebrewPlain: וישלח יהושע את העם איש לנחלתו
    kjvRefs:
