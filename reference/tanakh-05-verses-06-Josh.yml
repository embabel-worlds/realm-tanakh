    name: Tanakh Joshua 1:16
    ref: Joshua 1:16
    book: Josh
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 5862
    text: 'And they answered Joshua, saying: ‘All that thou hast commanded us we will do, and whithersoever thou sendest us we will go.'
    translation: JPS 1917
    original: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר כֹּל אֲשֶׁר־צִוִּיתָנוּ נַעֲשֶׂה וְאֶל־כָּל־אֲשֶׁר תִּשְׁלָחֵנוּ נֵלֵךְ׃
    hebrewPlain: ויענו את יהושע לאמר כל אשר צויתנו נעשה ואל כל אשר תשלחנו נלך
    kjvRefs:
    - Joshua 1:16
    kjvOsis:
    - Josh.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.1.17
    scripture: tanakh
    name: Tanakh Joshua 1:17
    ref: Joshua 1:17
    book: Josh
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 5863
    text: According as we hearkened unto Moses in all things, so will we hearken unto thee; only the LORD thy God be with thee, as He was with Moses.
    translation: JPS 1917
    original: כְּכֹל אֲשֶׁר־שָׁמַעְנוּ אֶל־מֹשֶׁה כֵּן נִשְׁמַע אֵלֶיךָ רַק יִהְיֶה יְהוָה אֱלֹהֶיךָ עִמָּךְ כַּאֲשֶׁר הָיָה עִם־מֹשֶׁה׃
    hebrewPlain: ככל אשר שמענו אל משה כן נשמע אליך רק יהיה יהוה אלהיך עמך כאשר היה עם משה
    kjvRefs:
    - Joshua 1:17
    kjvOsis:
    - Josh.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.1.18
    scripture: tanakh
    name: Tanakh Joshua 1:18
    ref: Joshua 1:18
    book: Josh
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 5864
    text: Whosoever he be that shall rebel against thy commandment, and shall not hearken unto thy words in all that thou commandest him, he shall be put to death; only be strong and of good courage.’
    translation: JPS 1917
    original: כָּל־אִישׁ אֲשֶׁר־יַמְרֶה אֶת־פִּיךָ וְלֹא־יִשְׁמַע אֶת־דְּבָרֶיךָ לְכֹל אֲשֶׁר־תְּצַוֶּנּוּ יוּמָת רַק חֲזַק וֶאֱמָץ׃
    hebrewPlain: כל איש אשר ימרה את פיך ולא ישמע את דבריך לכל אשר תצונו יומת רק חזק ואמץ
    kjvRefs:
    - Joshua 1:18
    kjvOsis:
    - Josh.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.2.1
    scripture: tanakh
    name: Tanakh Joshua 2:1
    ref: Joshua 2:1
    book: Josh
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 5865
    text: 'And Joshua the son of Nun sent out of Shittim two spies secretly, saying: ‘Go view the land, and Jericho.’ And they went, and came into the house of a harlot whose name was Rahab, and lay there.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוֹשֻׁעַ־בִּן־נוּן מִן־הַשִּׁטִּים שְׁנַיִם־אֲנָשִׁים מְרַגְּלִים חֶרֶשׁ לֵאמֹר לְכוּ רְאוּ אֶת־הָאָרֶץ וְאֶת־יְרִיחוֹ וַיֵּלְכוּ וַיָּבֹאוּ בֵּית־אִשָּׁה זוֹנָה וּשְׁמָהּ רָחָב וַיִּשְׁכְּבוּ־שָׁמָּה׃
    hebrewPlain: וישלח יהושע בן נון מן השטים שנים אנשים מרגלים חרש לאמר לכו ראו את הארץ ואת יריחו וילכו ויבאו בית אשה זונה ושמה רחב וישכבו שמה
    kjvRefs:
    - Joshua 2:1
    kjvOsis:
    - Josh.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.2
    scripture: tanakh
    name: Tanakh Joshua 2:2
    ref: Joshua 2:2
    book: Josh
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 5866
    text: 'And it was told the king of Jericho, saying: ‘Behold, there came men in hither to-night of the children of Israel to search out the land.’'
    translation: JPS 1917
    original: וַיֵּאָמַר לְמֶלֶךְ יְרִיחוֹ לֵאמֹר הִנֵּה אֲנָשִׁים בָּאוּ הֵנָּה הַלַּיְלָה מִבְּנֵי יִשְׂרָאֵל לַחְפֹּר אֶת־הָאָרֶץ׃
    hebrewPlain: ויאמר למלך יריחו לאמר הנה אנשים באו הנה הלילה מבני ישראל לחפר את הארץ
    kjvRefs:
    - Joshua 2:2
    kjvOsis:
    - Josh.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.3
    scripture: tanakh
    name: Tanakh Joshua 2:3
    ref: Joshua 2:3
    book: Josh
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 5867
    text: 'And the king of Jericho sent unto Rahab, saying: ‘Bring forth the men that are come to thee, that are entered into thy house; for they are come to search out all the land.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח מֶלֶךְ יְרִיחוֹ אֶל־רָחָב לֵאמֹר הוֹצִיאִי הָאֲנָשִׁים הַבָּאִים אֵלַיִךְ אֲשֶׁר־בָּאוּ לְבֵיתֵךְ כִּי לַחְפֹּר אֶת־כָּל־הָאָרֶץ בָּאוּ׃
    hebrewPlain: וישלח מלך יריחו אל רחב לאמר הוציאי האנשים הבאים אליך אשר באו לביתך כי לחפר את כל הארץ באו
    kjvRefs:
    - Joshua 2:3
    kjvOsis:
    - Josh.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.4
    scripture: tanakh
    name: Tanakh Joshua 2:4
    ref: Joshua 2:4
    book: Josh
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 5868
    text: 'And the woman took the two men, and hid them; and she said: ‘Yea, the men came unto me, but I knew not whence they were;'
    translation: JPS 1917
    original: וַתִּקַּח הָאִשָּׁה אֶת־שְׁנֵי הָאֲנָשִׁים וַתִּצְפְּנוֹ וַתֹּאמֶר כֵּן בָּאוּ אֵלַי הָאֲנָשִׁים וְלֹא יָדַעְתִּי מֵאַיִן הֵמָּה׃
    hebrewPlain: ותקח האשה את שני האנשים ותצפנו ותאמר כן באו אלי האנשים ולא ידעתי מאין המה
    kjvRefs:
    - Joshua 2:4
    kjvOsis:
    - Josh.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.5
    scripture: tanakh
    name: Tanakh Joshua 2:5
    ref: Joshua 2:5
    book: Josh
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 5869
    text: and it came to pass about the time of the shutting of the gate, when it was dark, that the men went out; whither the men went I know not; pursue after them quickly; for ye shall overtake them.’
    translation: JPS 1917
    original: וַיְהִי הַשַּׁעַר לִסְגּוֹר בַּחֹשֶׁךְ וְהָאֲנָשִׁים יָצָאוּ לֹא יָדַעְתִּי אָנָה הָלְכוּ הָאֲנָשִׁים רִדְפוּ מַהֵר אַחֲרֵיהֶם כִּי תַשִּׂיגוּם׃
    hebrewPlain: ויהי השער לסגור בחשך והאנשים יצאו לא ידעתי אנה הלכו האנשים רדפו מהר אחריהם כי תשיגום
    kjvRefs:
    - Joshua 2:5
    kjvOsis:
    - Josh.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.6
    scripture: tanakh
    name: Tanakh Joshua 2:6
    ref: Joshua 2:6
    book: Josh
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 5870
    text: But she had brought them up to the roof, and hid them with the stalks of flax, which she had spread out upon the roof.
    translation: JPS 1917
    original: וְהִיא הֶעֱלָתַם הַגָּגָה וַתִּטְמְנֵם בְּפִשְׁתֵּי הָעֵץ הָעֲרֻכוֹת לָהּ עַל־הַגָּג׃
    hebrewPlain: והיא העלתם הגגה ותטמנם בפשתי העץ הערכות לה על הגג
    kjvRefs:
    - Joshua 2:6
    kjvOsis:
    - Josh.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.7
    scripture: tanakh
    name: Tanakh Joshua 2:7
    ref: Joshua 2:7
    book: Josh
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 5871
    text: And the men pursued after them the way to the Jordan unto the fords; and as soon as they that pursued after them were gone out, the gate was shut.
    translation: JPS 1917
    original: וְהָאֲנָשִׁים רָדְפוּ אַחֲרֵיהֶם דֶּרֶךְ הַיַּרְדֵּן עַל הַמַּעְבְּרוֹת וְהַשַּׁעַר סָגָרוּ אַחֲרֵי כַּאֲשֶׁר יָצְאוּ הָרֹדְפִים אַחֲרֵיהֶם׃
    hebrewPlain: והאנשים רדפו אחריהם דרך הירדן על המעברות והשער סגרו אחרי כאשר יצאו הרדפים אחריהם
    kjvRefs:
    - Joshua 2:7
    kjvOsis:
    - Josh.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.8
    scripture: tanakh
    name: Tanakh Joshua 2:8
    ref: Joshua 2:8
    book: Josh
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 5872
    text: And before they were laid down, she came up unto them upon the roof;
    translation: JPS 1917
    original: וְהֵמָּה טֶרֶם יִשְׁכָּבוּן וְהִיא עָלְתָה עֲלֵיהֶם עַל־הַגָּג׃
    hebrewPlain: והמה טרם ישכבון והיא עלתה עליהם על הגג
    kjvRefs:
    - Joshua 2:8
    kjvOsis:
    - Josh.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.9
    scripture: tanakh
    name: Tanakh Joshua 2:9
    ref: Joshua 2:9
    book: Josh
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 5873
    text: 'and she said unto the men: ‘I know that the LORD hath given you the land, and that your terror is fallen upon us, and that all the inhabitants of the land melt away before you.'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶל־הָאֲנָשִׁים יָדַעְתִּי כִּי־נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ וְכִי־נָפְלָה אֵימַתְכֶם עָלֵינוּ וְכִי נָמֹגוּ כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם׃
    hebrewPlain: ותאמר אל האנשים ידעתי כי נתן יהוה לכם את הארץ וכי נפלה אימתכם עלינו וכי נמגו כל ישבי הארץ מפניכם
    kjvRefs:
    - Joshua 2:9
    kjvOsis:
    - Josh.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.10
    scripture: tanakh
    name: Tanakh Joshua 2:10
    ref: Joshua 2:10
    book: Josh
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 5874
    text: For we have heard how the LORD dried up the water of the Red Sea before you, when ye came out of Egypt; and what ye did unto the two kings of the Amorites, that were beyond the Jordan, unto Sihon and to Og, whom ye utterly destroyed.
    translation: JPS 1917
    original: כִּי שָׁמַעְנוּ אֵת אֲשֶׁר־הוֹבִישׁ יְהוָה אֶת־מֵי יַם־סוּף מִפְּנֵיכֶם בְּצֵאתְכֶם מִמִּצְרָיִם וַאֲשֶׁר עֲשִׂיתֶם לִשְׁנֵי מַלְכֵי הָאֱמֹרִי אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן לְסִיחֹן וּלְעוֹג אֲשֶׁר הֶחֱרַמְתֶּם אוֹתָם׃
    hebrewPlain: כי שמענו את אשר הוביש יהוה את מי ים סוף מפניכם בצאתכם ממצרים ואשר עשיתם לשני מלכי האמרי אשר בעבר הירדן לסיחן ולעוג אשר החרמתם אותם
    kjvRefs:
    - Joshua 2:10
    kjvOsis:
    - Josh.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.11
    scripture: tanakh
    name: Tanakh Joshua 2:11
    ref: Joshua 2:11
    book: Josh
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 5875
    text: And as soon as we had heard it, our hearts did melt, neither did there remain any more spirit in any man, because of you; for the LORD your God, He is God in heaven above, and on earth beneath.
    translation: JPS 1917
    original: וַנִּשְׁמַע וַיִּמַּס לְבָבֵנוּ וְלֹא־קָמָה עוֹד רוּחַ בְּאִישׁ מִפְּנֵיכֶם כִּי יְהוָה אֱלֹהֵיכֶם הוּא אֱלֹהִים בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת׃
    hebrewPlain: ונשמע וימס לבבנו ולא קמה עוד רוח באיש מפניכם כי יהוה אלהיכם הוא אלהים בשמים ממעל ועל הארץ מתחת
    kjvRefs:
    - Joshua 2:11
    kjvOsis:
    - Josh.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.12
    scripture: tanakh
    name: Tanakh Joshua 2:12
    ref: Joshua 2:12
    book: Josh
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 5876
    text: Now therefore, I pray you, swear unto me by the LORD, since I have dealt kindly with you, that ye also will deal kindly with my father’s house—and give me a true token—
    translation: JPS 1917
    original: וְעַתָּה הִשָּׁבְעוּ־נָא לִי בַּיהוָה כִּי־עָשִׂיתִי עִמָּכֶם חָסֶד וַעֲשִׂיתֶם גַּם־אַתֶּם עִם־בֵּית אָבִי חֶסֶד וּנְתַתֶּם לִי אוֹת אֱמֶת׃
    hebrewPlain: ועתה השבעו נא לי ביהוה כי עשיתי עמכם חסד ועשיתם גם אתם עם בית אבי חסד ונתתם לי אות אמת
    kjvRefs:
    - Joshua 2:12
    kjvOsis:
    - Josh.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.13
    scripture: tanakh
    name: Tanakh Joshua 2:13
    ref: Joshua 2:13
    book: Josh
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 5877
    text: and save alive my father, and my mother, and my brethren, and my sisters, and all that they have, and deliver our lives from death.’
    translation: JPS 1917
    original: וְהַחֲיִתֶם אֶת־אָבִי וְאֶת־אִמִּי וְאֶת־אַחַי וְאֶת־אחותי [אַחְיוֹתַי] וְאֵת כָּל־אֲשֶׁר לָהֶם וְהִצַּלְתֶּם אֶת־נַפְשֹׁתֵינוּ מִמָּוֶת׃
    hebrewPlain: והחיתם את אבי ואת אמי ואת אחי ואת אחותי [אחיותי] ואת כל אשר להם והצלתם את נפשתינו ממות
    kjvRefs:
    - Joshua 2:13
    kjvOsis:
    - Josh.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.14
    scripture: tanakh
    name: Tanakh Joshua 2:14
    ref: Joshua 2:14
    book: Josh
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 5878
    text: 'And the men said unto her: ‘Our life for yours, if ye tell not this our business; and it shall be, when the LORD giveth us the land, that we will deal kindly and truly with thee.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לָהּ הָאֲנָשִׁים נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת אִם לֹא תַגִּידוּ אֶת־דְּבָרֵנוּ זֶה וְהָיָה בְּתֵת־יְהוָה לָנוּ אֶת־הָאָרֶץ וְעָשִׂינוּ עִמָּךְ חֶסֶד וֶאֱמֶת׃
    hebrewPlain: ויאמרו לה האנשים נפשנו תחתיכם למות אם לא תגידו את דברנו זה והיה בתת יהוה לנו את הארץ ועשינו עמך חסד ואמת
    kjvRefs:
    - Joshua 2:14
    kjvOsis:
    - Josh.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.15
    scripture: tanakh
    name: Tanakh Joshua 2:15
    ref: Joshua 2:15
    book: Josh
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 5879
    text: Then she let them down by a cord through the window; for her house was upon the side of the wall, and she dwelt upon the wall.
    translation: JPS 1917
    original: וַתּוֹרִדֵם בַּחֶבֶל בְּעַד הַחַלּוֹן כִּי בֵיתָהּ בְּקִיר הַחוֹמָה וּבַחוֹמָה הִיא יוֹשָׁבֶת׃
    hebrewPlain: ותורדם בחבל בעד החלון כי ביתה בקיר החומה ובחומה היא יושבת
    kjvRefs:
    - Joshua 2:15
    kjvOsis:
    - Josh.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.16
    scripture: tanakh
    name: Tanakh Joshua 2:16
    ref: Joshua 2:16
    book: Josh
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 5880
    text: 'And she said unto them: ‘Get you to the mountain, lest the pursuers light upon you; and hide yourselves there three days, until the pursuers be returned; and afterward may ye go your way.’'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהֶם הָהָרָה לֵּכוּ פֶּן־יִפְגְּעוּ בָכֶם הָרֹדְפִים וְנַחְבֵּתֶם שָׁמָּה שְׁלֹשֶׁת יָמִים עַד שׁוֹב הָרֹדְפִים וְאַחַר תֵּלְכוּ לְדַרְכְּכֶם׃
    hebrewPlain: ותאמר להם ההרה לכו פן יפגעו בכם הרדפים ונחבתם שמה שלשת ימים עד שוב הרדפים ואחר תלכו לדרככם
    kjvRefs:
    - Joshua 2:16
    kjvOsis:
    - Josh.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.17
    scripture: tanakh
    name: Tanakh Joshua 2:17
    ref: Joshua 2:17
    book: Josh
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 5881
    text: 'And the men said unto her: ‘We will be guiltless of this thine oath which thou hast made us to swear.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלֶיהָ הָאֲנָשִׁים נְקִיִּם אֲנַחְנוּ מִשְּׁבֻעָתֵךְ הַזֶּה אֲשֶׁר הִשְׁבַּעְתָּנוּ׃
    hebrewPlain: ויאמרו אליה האנשים נקים אנחנו משבעתך הזה אשר השבעתנו
    kjvRefs:
    - Joshua 2:17
    kjvOsis:
    - Josh.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.18
    scripture: tanakh
    name: Tanakh Joshua 2:18
    ref: Joshua 2:18
    book: Josh
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 5882
    text: Behold, when we come into the land, thou shalt bind this line of scarlet thread in the window which thou didst let us down by; and thou shalt gather unto thee into the house thy father, and thy mother, and thy brethren, and all thy father’s household.
    translation: JPS 1917
    original: הִנֵּה אֲנַחְנוּ בָאִים בָּאָרֶץ אֶת־תִּקְוַת חוּט הַשָּׁנִי הַזֶּה תִּקְשְׁרִי בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ וְאֶת־אָבִיךְ וְאֶת־אִמֵּךְ וְאֶת־אַחַיִךְ וְאֵת כָּל־בֵּית אָבִיךְ תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה׃
    hebrewPlain: הנה אנחנו באים בארץ את תקות חוט השני הזה תקשרי בחלון אשר הורדתנו בו ואת אביך ואת אמך ואת אחיך ואת כל בית אביך תאספי אליך הביתה
    kjvRefs:
    - Joshua 2:18
    kjvOsis:
    - Josh.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.19
    scripture: tanakh
    name: Tanakh Joshua 2:19
    ref: Joshua 2:19
    book: Josh
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 5883
    text: And it shall be, that whosoever shall go out of the doors of thy house into the street, his blood shall be upon his head, and we will be guiltless; and whosoever shall be with thee in the house, his blood shall be on our head, if any hand be upon him.
    translation: JPS 1917
    original: וְהָיָה כֹּל אֲשֶׁר־יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה דָּמוֹ בְרֹאשׁוֹ וַאֲנַחְנוּ נְקִיִּם וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת דָּמוֹ בְרֹאשֵׁנוּ אִם־יָד תִּהְיֶה־בּוֹ׃
    hebrewPlain: והיה כל אשר יצא מדלתי ביתך החוצה דמו בראשו ואנחנו נקים וכל אשר יהיה אתך בבית דמו בראשנו אם יד תהיה בו
    kjvRefs:
    - Joshua 2:19
    kjvOsis:
    - Josh.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.20
    scripture: tanakh
    name: Tanakh Joshua 2:20
    ref: Joshua 2:20
    book: Josh
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 5884
    text: But if thou utter this our business, then we will be guiltless of thine oath which thou hast made us to swear.’
    translation: JPS 1917
    original: וְאִם־תַּגִּידִי אֶת־דְּבָרֵנוּ זֶה וְהָיִינוּ נְקִיִּם מִשְּׁבֻעָתֵךְ אֲשֶׁר הִשְׁבַּעְתָּנוּ׃
    hebrewPlain: ואם תגידי את דברנו זה והיינו נקים משבעתך אשר השבעתנו
    kjvRefs:
    - Joshua 2:20
    kjvOsis:
    - Josh.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.21
    scripture: tanakh
    name: Tanakh Joshua 2:21
    ref: Joshua 2:21
    book: Josh
    section: neviim
    chapter: 2
    verse: 21
    ordinal: 5885
    text: 'And she said: ‘According unto your words, so be it.’ And she sent them away, and they departed; and she bound the scarlet line in the window.'
    translation: JPS 1917
    original: וַתֹּאמֶר כְּדִבְרֵיכֶם כֶּן־הוּא וַתְּשַׁלְּחֵם וַיֵּלֵכוּ וַתִּקְשֹׁר אֶת־תִּקְוַת הַשָּׁנִי בַּחַלּוֹן׃
    hebrewPlain: ותאמר כדבריכם כן הוא ותשלחם וילכו ותקשר את תקות השני בחלון
    kjvRefs:
    - Joshua 2:21
    kjvOsis:
    - Josh.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.22
    scripture: tanakh
    name: Tanakh Joshua 2:22
    ref: Joshua 2:22
    book: Josh
    section: neviim
    chapter: 2
    verse: 22
    ordinal: 5886
    text: And they went, and came unto the mountain, and abode there three days, until the pursuers were returned; and the pursuers sought them throughout all the way, but found them not.
    translation: JPS 1917
    original: וַיֵּלְכוּ וַיָּבֹאוּ הָהָרָה וַיֵּשְׁבוּ שָׁם שְׁלֹשֶׁת יָמִים עַד־שָׁבוּ הָרֹדְפִים וַיְבַקְשׁוּ הָרֹדְפִים בְּכָל־הַדֶּרֶךְ וְלֹא מָצָאוּ׃
    hebrewPlain: וילכו ויבאו ההרה וישבו שם שלשת ימים עד שבו הרדפים ויבקשו הרדפים בכל הדרך ולא מצאו
    kjvRefs:
    - Joshua 2:22
    kjvOsis:
    - Josh.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.23
    scripture: tanakh
    name: Tanakh Joshua 2:23
    ref: Joshua 2:23
    book: Josh
    section: neviim
    chapter: 2
    verse: 23
    ordinal: 5887
    text: Then the two men returned, and descended from the mountain, and passed over, and came to Joshua the son of Nun; and they told him all that had befallen them.
    translation: JPS 1917
    original: וַיָּשֻׁבוּ שְׁנֵי הָאֲנָשִׁים וַיֵּרְדוּ מֵהָהָר וַיַּעַבְרוּ וַיָּבֹאוּ אֶל־יְהוֹשֻׁעַ בִּן־נוּן וַיְסַפְּרוּ־לוֹ אֵת כָּל־הַמֹּצְאוֹת אוֹתָם׃
    hebrewPlain: וישבו שני האנשים וירדו מההר ויעברו ויבאו אל יהושע בן נון ויספרו לו את כל המצאות אותם
    kjvRefs:
    - Joshua 2:23
    kjvOsis:
    - Josh.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.2.24
    scripture: tanakh
    name: Tanakh Joshua 2:24
    ref: Joshua 2:24
    book: Josh
    section: neviim
    chapter: 2
    verse: 24
    ordinal: 5888
    text: 'And they said unto Joshua: ‘Truly the LORD hath delivered into our hands all the land; and moreover all the inhabitants of the land do melt away before us.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֶל־יְהוֹשֻׁעַ כִּי־נָתַן יְהוָה בְּיָדֵנוּ אֶת־כָּל־הָאָרֶץ וְגַם־נָמֹגוּ כָּל־יֹשְׁבֵי הָאָרֶץ מִפָּנֵינוּ׃
    hebrewPlain: ויאמרו אל יהושע כי נתן יהוה בידנו את כל הארץ וגם נמגו כל ישבי הארץ מפנינו
    kjvRefs:
    - Joshua 2:24
    kjvOsis:
    - Josh.2.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.2
- type: TanakhVerse
  data:
    osis: Josh.3.1
    scripture: tanakh
    name: Tanakh Joshua 3:1
    ref: Joshua 3:1
    book: Josh
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 5889
    text: And Joshua rose up early in the morning, and they removed from Shittim, and came to the Jordan, he and all the children of Israel; and they lodged there before they passed over.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְהוֹשֻׁעַ בַּבֹּקֶר וַיִּסְעוּ מֵהַשִּׁטִּים וַיָּבֹאוּ עַד־הַיַּרְדֵּן הוּא וְכָל־בְּנֵי יִשְׂרָאֵל וַיָּלִנוּ שָׁם טֶרֶם יַעֲבֹרוּ׃
    hebrewPlain: וישכם יהושע בבקר ויסעו מהשטים ויבאו עד הירדן הוא וכל בני ישראל וילנו שם טרם יעברו
    kjvRefs:
    - Joshua 3:1
    kjvOsis:
    - Josh.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.2
    scripture: tanakh
    name: Tanakh Joshua 3:2
    ref: Joshua 3:2
    book: Josh
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 5890
    text: And it came to pass after three days, that the officers went through the midst of the camp;
    translation: JPS 1917
    original: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים וַיַּעַבְרוּ הַשֹּׁטְרִים בְּקֶרֶב הַמַּחֲנֶה׃
    hebrewPlain: ויהי מקצה שלשת ימים ויעברו השטרים בקרב המחנה
    kjvRefs:
    - Joshua 3:2
    kjvOsis:
    - Josh.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.3
    scripture: tanakh
    name: Tanakh Joshua 3:3
    ref: Joshua 3:3
    book: Josh
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 5891
    text: 'and they commanded the people, saying: ‘When ye see the ark of the covenant of the LORD your God, and the priests the Levites bearing it, then ye shall remove from your place, and go after it.'
    translation: JPS 1917
    original: וַיְצַוּוּ אֶת־הָעָם לֵאמֹר כִּרְאוֹתְכֶם אֵת אֲרוֹן בְּרִית־יְהוָה אֱלֹהֵיכֶם וְהַכֹּהֲנִים הַלְוִיִּם נֹשְׂאִים אֹתוֹ וְאַתֶּם תִּסְעוּ מִמְּקוֹמְכֶם וַהֲלַכְתֶּם אַחֲרָיו׃
    hebrewPlain: ויצוו את העם לאמר כראותכם את ארון ברית יהוה אלהיכם והכהנים הלוים נשאים אתו ואתם תסעו ממקומכם והלכתם אחריו
    kjvRefs:
    - Joshua 3:3
    kjvOsis:
    - Josh.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.4
    scripture: tanakh
    name: Tanakh Joshua 3:4
    ref: Joshua 3:4
    book: Josh
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 5892
    text: Yet there shall be a space between you and it, about two thousand cubits by measure; come not near unto it, that ye may know the way by which ye must go; for ye have not passed this way heretofore.’
    translation: JPS 1917
    original: אַךְ רָחוֹק יִהְיֶה בֵּינֵיכֶם ובינו [וּבֵינָיו] כְּאַלְפַּיִם אַמָּה בַּמִּדָּה אַל־תִּקְרְבוּ אֵלָיו לְמַעַן אֲשֶׁר־תֵּדְעוּ אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ־בָהּ כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ מִתְּמוֹל שִׁלְשׁוֹם׃
    hebrewPlain: אך רחוק יהיה ביניכם ובינו [וביניו] כאלפים אמה במדה אל תקרבו אליו למען אשר תדעו את הדרך אשר תלכו בה כי לא עברתם בדרך מתמול שלשום
    kjvRefs:
    - Joshua 3:4
    kjvOsis:
    - Josh.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.5
    scripture: tanakh
    name: Tanakh Joshua 3:5
    ref: Joshua 3:5
    book: Josh
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 5893
    text: 'And Joshua said unto the people: ‘Sanctify yourselves; for to-morrow the LORD will do wonders among you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־הָעָם הִתְקַדָּשׁוּ כִּי מָחָר יַעֲשֶׂה יְהוָה בְּקִרְבְּכֶם נִפְלָאוֹת׃
    hebrewPlain: ויאמר יהושע אל העם התקדשו כי מחר יעשה יהוה בקרבכם נפלאות
    kjvRefs:
    - Joshua 3:5
    kjvOsis:
    - Josh.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.6
    scripture: tanakh
    name: Tanakh Joshua 3:6
    ref: Joshua 3:6
    book: Josh
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 5894
    text: 'And Joshua spoke unto the priests, saying: ‘Take up the ark of the covenant, and pass on before the people.’ And they took up the ark of the covenant, and went before the people.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־הַכֹּהֲנִים לֵאמֹר שְׂאוּ אֶת־אֲרוֹן הַבְּרִית וְעִבְרוּ לִפְנֵי הָעָם וַיִּשְׂאוּ אֶת־אֲרוֹן הַבְּרִית וַיֵּלְכוּ לִפְנֵי הָעָם׃
    hebrewPlain: ויאמר יהושע אל הכהנים לאמר שאו את ארון הברית ועברו לפני העם וישאו את ארון הברית וילכו לפני העם
    kjvRefs:
    - Joshua 3:6
    kjvOsis:
    - Josh.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.7
    scripture: tanakh
    name: Tanakh Joshua 3:7
    ref: Joshua 3:7
    book: Josh
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 5895
    text: 'And the LORD said unto Joshua: ‘This day will I begin to magnify thee in the sight of all Israel, that they may know that, as I was with Moses, so I will be with thee.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ הַיּוֹם הַזֶּה אָחֵל גַּדֶּלְךָ בְּעֵינֵי כָּל־יִשְׂרָאֵל אֲשֶׁר יֵדְעוּן כִּי כַּאֲשֶׁר הָיִיתִי עִם־מֹשֶׁה אֶהְיֶה עִמָּךְ׃
    hebrewPlain: ויאמר יהוה אל יהושע היום הזה אחל גדלך בעיני כל ישראל אשר ידעון כי כאשר הייתי עם משה אהיה עמך
    kjvRefs:
    - Joshua 3:7
    kjvOsis:
    - Josh.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.8
    scripture: tanakh
    name: Tanakh Joshua 3:8
    ref: Joshua 3:8
    book: Josh
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 5896
    text: 'And thou shalt command the priests that bear the ark of the covenant, saying: When ye are come to the brink of the waters of the Jordan, ye shall stand still in the Jordan.’'
    translation: JPS 1917
    original: וְאַתָּה תְּצַוֶּה אֶת־הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן־הַבְּרִית לֵאמֹר כְּבֹאֲכֶם עַד־קְצֵה מֵי הַיַּרְדֵּן בַּיַּרְדֵּן תַּעֲמֹדוּ׃
    hebrewPlain: ואתה תצוה את הכהנים נשאי ארון הברית לאמר כבאכם עד קצה מי הירדן בירדן תעמדו
    kjvRefs:
    - Joshua 3:8
    kjvOsis:
    - Josh.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.9
    scripture: tanakh
    name: Tanakh Joshua 3:9
    ref: Joshua 3:9
    book: Josh
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 5897
    text: 'And Joshua said unto the children of Israel: ‘Come hither, and hear the words of the LORD your God.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־בְּנֵי יִשְׂרָאֵל גֹּשׁוּ הֵנָּה וְשִׁמְעוּ אֶת־דִּבְרֵי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ויאמר יהושע אל בני ישראל גשו הנה ושמעו את דברי יהוה אלהיכם
    kjvRefs:
    - Joshua 3:9
    kjvOsis:
    - Josh.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.10
    scripture: tanakh
    name: Tanakh Joshua 3:10
    ref: Joshua 3:10
    book: Josh
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 5898
    text: 'And Joshua said: ‘Hereby ye shall know that the living God is among you, and that He will without fail drive out from before you the Canaanite, and the Hittite, and the Hivite, and the Perizzite, and the Girgashite, and the Amorite, and the Jebusite.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ בְּזֹאת תֵּדְעוּן כִּי אֵל חַי בְּקִרְבְּכֶם וְהוֹרֵשׁ יוֹרִישׁ מִפְּנֵיכֶם אֶת־הַכְּנַעֲנִי וְאֶת־הַחִתִּי וְאֶת־הַחִוִּי וְאֶת־הַפְּרִזִּי וְאֶת־הַגִּרְגָּשִׁי וְהָאֱמֹרִי וְהַיְבוּסִי׃
    hebrewPlain: ויאמר יהושע בזאת תדעון כי אל חי בקרבכם והורש יוריש מפניכם את הכנעני ואת החתי ואת החוי ואת הפרזי ואת הגרגשי והאמרי והיבוסי
    kjvRefs:
    - Joshua 3:10
    kjvOsis:
    - Josh.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.11
    scripture: tanakh
    name: Tanakh Joshua 3:11
    ref: Joshua 3:11
    book: Josh
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 5899
    text: Behold, the ark of the covenant of the Lord of all the earth passeth on before you over the Jordan.
    translation: JPS 1917
    original: הִנֵּה אֲרוֹן הַבְּרִית אֲדוֹן כָּל־הָאָרֶץ עֹבֵר לִפְנֵיכֶם בַּיַּרְדֵּן׃
    hebrewPlain: הנה ארון הברית אדון כל הארץ עבר לפניכם בירדן
    kjvRefs:
    - Joshua 3:11
    kjvOsis:
    - Josh.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.12
    scripture: tanakh
    name: Tanakh Joshua 3:12
    ref: Joshua 3:12
    book: Josh
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 5900
    text: Now therefore take you twelve men out of the tribes of Israel, for every tribe a man.
    translation: JPS 1917
    original: וְעַתָּה קְחוּ לָכֶם שְׁנֵי עָשָׂר אִישׁ מִשִּׁבְטֵי יִשְׂרָאֵל אִישׁ־אֶחָד אִישׁ־אֶחָד לַשָּׁבֶט׃
    hebrewPlain: ועתה קחו לכם שני עשר איש משבטי ישראל איש אחד איש אחד לשבט
    kjvRefs:
    - Joshua 3:12
    kjvOsis:
    - Josh.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.13
    scripture: tanakh
    name: Tanakh Joshua 3:13
    ref: Joshua 3:13
    book: Josh
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 5901
    text: And it shall come to pass, when the soles of the feet of the priests that bear the ark of the LORD, the Lord of all the earth, shall rest in the waters of the Jordan, that the waters of the Jordan shall be cut off, even the waters that come down from above; and they shall stand in one heap.’
    translation: JPS 1917
    original: וְהָיָה כְּנוֹחַ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן יְהוָה אֲדוֹן כָּל־הָאָרֶץ בְּמֵי הַיַּרְדֵּן מֵי הַיַּרְדֵּן יִכָּרֵתוּן הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה וְיַעַמְדוּ נֵד אֶחָד׃
    hebrewPlain: והיה כנוח כפות רגלי הכהנים נשאי ארון יהוה אדון כל הארץ במי הירדן מי הירדן יכרתון המים הירדים מלמעלה ויעמדו נד אחד
    kjvRefs:
    - Joshua 3:13
    kjvOsis:
    - Josh.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.14
    scripture: tanakh
    name: Tanakh Joshua 3:14
    ref: Joshua 3:14
    book: Josh
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 5902
    text: And it came to pass, when the people removed from their tents, to pass over the Jordan, the priests that bore the ark of the covenant being before the people;
    translation: JPS 1917
    original: וַיְהִי בִּנְסֹעַ הָעָם מֵאָהֳלֵיהֶם לַעֲבֹר אֶת־הַיַּרְדֵּן וְהַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן הַבְּרִית לִפְנֵי הָעָם׃
    hebrewPlain: ויהי בנסע העם מאהליהם לעבר את הירדן והכהנים נשאי הארון הברית לפני העם
    kjvRefs:
    - Joshua 3:14
    kjvOsis:
    - Josh.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.15
    scripture: tanakh
    name: Tanakh Joshua 3:15
    ref: Joshua 3:15
    book: Josh
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 5903
    text: and when they that bore the ark were come unto the Jordan, and the feet of the priests that bore the ark were dipped in the brink of the water—for the Jordan overfloweth all its banks all the time of harvest—
    translation: JPS 1917
    original: וּכְבוֹא נֹשְׂאֵי הָאָרוֹן עַד־הַיַּרְדֵּן וְרַגְלֵי הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן נִטְבְּלוּ בִּקְצֵה הַמָּיִם וְהַיַּרְדֵּן מָלֵא עַל־כָּל־גְּדוֹתָיו כֹּל יְמֵי קָצִיר׃
    hebrewPlain: וכבוא נשאי הארון עד הירדן ורגלי הכהנים נשאי הארון נטבלו בקצה המים והירדן מלא על כל גדותיו כל ימי קציר
    kjvRefs:
    - Joshua 3:15
    kjvOsis:
    - Josh.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.16
    scripture: tanakh
    name: Tanakh Joshua 3:16
    ref: Joshua 3:16
    book: Josh
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 5904
    text: that the waters which came down from above stood, and rose up in one heap, a great way off from Adam, the city that is beside Zarethan; and those that went down toward the sea of the Arabah, even the Salt Sea, were wholly cut off; and the people passed over right against Jericho.
    translation: JPS 1917
    original: וַיַּעַמְדוּ הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה קָמוּ נֵד־אֶחָד הַרְחֵק מְאֹד באדם [מֵאָדָם] הָעִיר אֲשֶׁר מִצַּד צָרְתָן וְהַיֹּרְדִים עַל יָם הָעֲרָבָה יָם־הַמֶּלַח תַּמּוּ נִכְרָתוּ וְהָעָם עָבְרוּ נֶגֶד יְרִיחוֹ׃
    hebrewPlain: ויעמדו המים הירדים מלמעלה קמו נד אחד הרחק מאד באדם [מאדם] העיר אשר מצד צרתן והירדים על ים הערבה ים המלח תמו נכרתו והעם עברו נגד יריחו
    kjvRefs:
    - Joshua 3:16
    kjvOsis:
    - Josh.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.3.17
    scripture: tanakh
    name: Tanakh Joshua 3:17
    ref: Joshua 3:17
    book: Josh
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 5905
    text: And the priests that bore the ark of the covenant of the LORD stood firm on dry ground in the midst of the Jordan, while all Israel passed over on dry ground, until all the nation were passed clean over the Jordan.
    translation: JPS 1917
    original: וַיַּעַמְדוּ הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן בְּרִית־יְהוָה בֶּחָרָבָה בְּתוֹךְ הַיַּרְדֵּן הָכֵן וְכָל־יִשְׂרָאֵל עֹבְרִים בֶּחָרָבָה עַד אֲשֶׁר־תַּמּוּ כָּל־הַגּוֹי לַעֲבֹר אֶת־הַיַּרְדֵּן׃
    hebrewPlain: ויעמדו הכהנים נשאי הארון ברית יהוה בחרבה בתוך הירדן הכן וכל ישראל עברים בחרבה עד אשר תמו כל הגוי לעבר את הירדן
    kjvRefs:
    - Joshua 3:17
    kjvOsis:
    - Josh.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.3
- type: TanakhVerse
  data:
    osis: Josh.4.1
    scripture: tanakh
    name: Tanakh Joshua 4:1
    ref: Joshua 4:1
    book: Josh
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 5906
    text: 'And it came to pass, when all the nation were clean passed over the Jordan, that the LORD spoke unto Joshua, saying:'
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־תַּמּוּ כָל־הַגּוֹי לַעֲבוֹר אֶת־הַיַּרְדֵּן וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ לֵאמֹר׃
    hebrewPlain: ויהי כאשר תמו כל הגוי לעבור את הירדן ויאמר יהוה אל יהושע לאמר
    kjvRefs:
    - Joshua 4:1
    kjvOsis:
    - Josh.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.2
    scripture: tanakh
    name: Tanakh Joshua 4:2
    ref: Joshua 4:2
    book: Josh
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 5907
    text: ’Take you twelve men out of the people, out of every tribe a man,
    translation: JPS 1917
    original: קְחוּ לָכֶם מִן־הָעָם שְׁנֵים עָשָׂר אֲנָשִׁים אִישׁ־אֶחָד אִישׁ־אֶחָד מִשָּׁבֶט׃
    hebrewPlain: קחו לכם מן העם שנים עשר אנשים איש אחד איש אחד משבט
    kjvRefs:
    - Joshua 4:2
    kjvOsis:
    - Josh.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.3
    scripture: tanakh
    name: Tanakh Joshua 4:3
    ref: Joshua 4:3
    book: Josh
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 5908
    text: 'and command ye them, saying: Take you hence out of the midst of the Jordan, out of the place where the priests’ feet stood, twelve stones made ready, and carry them over with you, and lay them down in the lodging-place, where ye shall lodge this night.’'
    translation: JPS 1917
    original: וְצַוּוּ אוֹתָם לֵאמֹר שְׂאוּ־לָכֶם מִזֶּה מִתּוֹךְ הַיַּרְדֵּן מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין שְׁתֵּים־עֶשְׂרֵה אֲבָנִים וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם וְהִנַּחְתֶּם אוֹתָם בַּמָּלוֹן אֲשֶׁר־תָּלִינוּ בוֹ הַלָּיְלָה׃
    hebrewPlain: וצוו אותם לאמר שאו לכם מזה מתוך הירדן ממצב רגלי הכהנים הכין שתים עשרה אבנים והעברתם אותם עמכם והנחתם אותם במלון אשר תלינו בו הלילה
    kjvRefs:
    - Joshua 4:3
    kjvOsis:
    - Josh.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.4
    scripture: tanakh
    name: Tanakh Joshua 4:4
    ref: Joshua 4:4
    book: Josh
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 5909
    text: Then Joshua called the twelve men, whom he had prepared of the children of Israel, out of every tribe a man;
    translation: JPS 1917
    original: וַיִּקְרָא יְהוֹשֻׁעַ אֶל־שְׁנֵים הֶעָשָׂר אִישׁ אֲשֶׁר הֵכִין מִבְּנֵי יִשְׂרָאֵל אִישׁ־אֶחָד אִישׁ־אֶחָד מִשָּׁבֶט׃
    hebrewPlain: ויקרא יהושע אל שנים העשר איש אשר הכין מבני ישראל איש אחד איש אחד משבט
    kjvRefs:
    - Joshua 4:4
    kjvOsis:
    - Josh.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.5
    scripture: tanakh
    name: Tanakh Joshua 4:5
    ref: Joshua 4:5
    book: Josh
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 5910
    text: 'and Joshua said unto them: ‘Pass on before the ark of the LORD your God into the midst of the Jordan, and take you up every man of you a stone upon his shoulder, according unto the number of the tribes of the children of Israel;'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם יְהוֹשֻׁעַ עִבְרוּ לִפְנֵי אֲרוֹן יְהוָה אֱלֹהֵיכֶם אֶל־תּוֹךְ הַיַּרְדֵּן וְהָרִימוּ לָכֶם אִישׁ אֶבֶן אַחַת עַל־שִׁכְמוֹ לְמִסְפַּר שִׁבְטֵי בְנֵי־יִשְׂרָאֵל׃
    hebrewPlain: ויאמר להם יהושע עברו לפני ארון יהוה אלהיכם אל תוך הירדן והרימו לכם איש אבן אחת על שכמו למספר שבטי בני ישראל
    kjvRefs:
    - Joshua 4:5
    kjvOsis:
    - Josh.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.6
    scripture: tanakh
    name: Tanakh Joshua 4:6
    ref: Joshua 4:6
    book: Josh
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 5911
    text: 'that this may be a sign among you, that when your children ask in time to come, saying: What mean ye by these stones?'
    translation: JPS 1917
    original: לְמַעַן תִּהְיֶה זֹאת אוֹת בְּקִרְבְּכֶם כִּי־יִשְׁאָלוּן בְּנֵיכֶם מָחָר לֵאמֹר מָה הָאֲבָנִים הָאֵלֶּה לָכֶם׃
    hebrewPlain: למען תהיה זאת אות בקרבכם כי ישאלון בניכם מחר לאמר מה האבנים האלה לכם
    kjvRefs:
    - Joshua 4:6
    kjvOsis:
    - Josh.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.7
    scripture: tanakh
    name: Tanakh Joshua 4:7
    ref: Joshua 4:7
    book: Josh
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 5912
    text: 'then ye shall say unto them: Because the waters of the Jordan were cut off before the ark of the covenant of the LORD; when it passed over the Jordan, the waters of the Jordan were cut off; and these stones shall be for a memorial unto the children of Israel for ever.’'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם לָהֶם אֲשֶׁר נִכְרְתוּ מֵימֵי הַיַּרְדֵּן מִפְּנֵי אֲרוֹן בְּרִית־יְהוָה בְּעָבְרוֹ בַּיַּרְדֵּן נִכְרְתוּ מֵי הַיַּרְדֵּן וְהָיוּ הָאֲבָנִים הָאֵלֶּה לְזִכָּרוֹן לִבְנֵי יִשְׂרָאֵל עַד־עוֹלָם׃
    hebrewPlain: ואמרתם להם אשר נכרתו מימי הירדן מפני ארון ברית יהוה בעברו בירדן נכרתו מי הירדן והיו האבנים האלה לזכרון לבני ישראל עד עולם
    kjvRefs:
    - Joshua 4:7
    kjvOsis:
    - Josh.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.8
    scripture: tanakh
    name: Tanakh Joshua 4:8
    ref: Joshua 4:8
    book: Josh
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 5913
    text: And the children of Israel did so as Joshua commanded, and took up twelve stones out of the midst of the Jordan, as the LORD spoke unto Joshua, according to the number of the tribes of the children of Israel; and they carried them over with them unto the place where they lodged, and laid them down there.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ־כֵן בְּנֵי־יִשְׂרָאֵל כַּאֲשֶׁר צִוָּה יְהוֹשֻׁעַ וַיִּשְׂאוּ שְׁתֵּי־עֶשְׂרֵה אֲבָנִים מִתּוֹךְ הַיַּרְדֵּן כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל־יְהוֹשֻׁעַ לְמִסְפַּר שִׁבְטֵי בְנֵי־יִשְׂרָאֵל וַיַּעֲבִרוּם עִמָּם אֶל־הַמָּלוֹן וַיַּנִּחוּם שָׁם׃
    hebrewPlain: ויעשו כן בני ישראל כאשר צוה יהושע וישאו שתי עשרה אבנים מתוך הירדן כאשר דבר יהוה אל יהושע למספר שבטי בני ישראל ויעברום עמם אל המלון וינחום שם
    kjvRefs:
    - Joshua 4:8
    kjvOsis:
    - Josh.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.9
    scripture: tanakh
    name: Tanakh Joshua 4:9
    ref: Joshua 4:9
    book: Josh
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 5914
    text: Joshua also set up twelve stones in the midst of the Jordan, in the place where the feet of the priests that bore the ark of the covenant stood; and they are there unto this day.
    translation: JPS 1917
    original: וּשְׁתֵּים עֶשְׂרֵה אֲבָנִים הֵקִים יְהוֹשֻׁעַ בְּתוֹךְ הַיַּרְדֵּן תַּחַת מַצַּב רַגְלֵי הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן הַבְּרִית וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ושתים עשרה אבנים הקים יהושע בתוך הירדן תחת מצב רגלי הכהנים נשאי ארון הברית ויהיו שם עד היום הזה
    kjvRefs:
    - Joshua 4:9
    kjvOsis:
    - Josh.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.10
    scripture: tanakh
    name: Tanakh Joshua 4:10
    ref: Joshua 4:10
    book: Josh
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 5915
    text: And the priests that bore the ark stood in the midst of the Jordan, until every thing was finished that the LORD commanded Joshua to speak unto the people, according to all that Moses commanded Joshua; and the people hastened and passed over.
    translation: JPS 1917
    original: וְהַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן עַד תֹּם כָּל־הַדָּבָר אֲשֶׁר־צִוָּה יְהוָה אֶת־יְהוֹשֻׁעַ לְדַבֵּר אֶל־הָעָם כְּכֹל אֲשֶׁר־צִוָּה מֹשֶׁה אֶת־יְהוֹשֻׁעַ וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ׃
    hebrewPlain: והכהנים נשאי הארון עמדים בתוך הירדן עד תם כל הדבר אשר צוה יהוה את יהושע לדבר אל העם ככל אשר צוה משה את יהושע וימהרו העם ויעברו
    kjvRefs:
    - Joshua 4:10
    kjvOsis:
    - Josh.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.11
    scripture: tanakh
    name: Tanakh Joshua 4:11
    ref: Joshua 4:11
    book: Josh
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 5916
    text: And it came to pass, when all the people were clean passed over, that the ark of the LORD passed on, and the priests, before the people.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־תַּם כָּל־הָעָם לַעֲבוֹר וַיַּעֲבֹר אֲרוֹן־יְהוָה וְהַכֹּהֲנִים לִפְנֵי הָעָם׃
    hebrewPlain: ויהי כאשר תם כל העם לעבור ויעבר ארון יהוה והכהנים לפני העם
    kjvRefs:
    - Joshua 4:11
    kjvOsis:
    - Josh.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.12
    scripture: tanakh
    name: Tanakh Joshua 4:12
    ref: Joshua 4:12
    book: Josh
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 5917
    text: And the children of Reuben, and the children of Gad, and the half-tribe of Manasseh, passed on armed before the children of Israel, as Moses spoke unto them;
    translation: JPS 1917
    original: וַיַּעַבְרוּ בְּנֵי־רְאוּבֵן וּבְנֵי־גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה חֲמֻשִׁים לִפְנֵי בְּנֵי יִשְׂרָאֵל כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה׃
    hebrewPlain: ויעברו בני ראובן ובני גד וחצי שבט המנשה חמשים לפני בני ישראל כאשר דבר אליהם משה
    kjvRefs:
    - Joshua 4:12
    kjvOsis:
    - Josh.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.13
    scripture: tanakh
    name: Tanakh Joshua 4:13
    ref: Joshua 4:13
    book: Josh
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 5918
    text: about forty thousand ready armed for war passed on in the presence of the LORD unto battle, to the plains of Jericho.
    translation: JPS 1917
    original: כְּאַרְבָּעִים אֶלֶף חֲלוּצֵי הַצָּבָא עָבְרוּ לִפְנֵי יְהוָה לַמִּלְחָמָה אֶל עַרְבוֹת יְרִיחוֹ׃
    hebrewPlain: כארבעים אלף חלוצי הצבא עברו לפני יהוה למלחמה אל ערבות יריחו
    kjvRefs:
    - Joshua 4:13
    kjvOsis:
    - Josh.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.14
    scripture: tanakh
    name: Tanakh Joshua 4:14
    ref: Joshua 4:14
    book: Josh
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 5919
    text: On that day the LORD magnified Joshua in the sight of all Israel; and they feared him, as they feared Moses, all the days of his life.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא גִּדַּל יְהוָה אֶת־יְהוֹשֻׁעַ בְּעֵינֵי כָּל־יִשְׂרָאֵל וַיִּרְאוּ אֹתוֹ כַּאֲשֶׁר יָרְאוּ אֶת־מֹשֶׁה כָּל־יְמֵי חַיָּיו׃
    hebrewPlain: ביום ההוא גדל יהוה את יהושע בעיני כל ישראל ויראו אתו כאשר יראו את משה כל ימי חייו
    kjvRefs:
    - Joshua 4:14
    kjvOsis:
    - Josh.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.15
    scripture: tanakh
    name: Tanakh Joshua 4:15
    ref: Joshua 4:15
    book: Josh
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 5920
    text: 'And the LORD spoke unto Joshua, saying:'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ לֵאמֹר׃
    hebrewPlain: ויאמר יהוה אל יהושע לאמר
    kjvRefs:
    - Joshua 4:15
    kjvOsis:
    - Josh.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.16
    scripture: tanakh
    name: Tanakh Joshua 4:16
    ref: Joshua 4:16
    book: Josh
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 5921
    text: ’Command the priests that bear the ark of the testimony, that they come up out of the Jordan.’
    translation: JPS 1917
    original: צַוֵּה אֶת־הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן הָעֵדוּת וְיַעֲלוּ מִן־הַיַּרְדֵּן׃
    hebrewPlain: צוה את הכהנים נשאי ארון העדות ויעלו מן הירדן
    kjvRefs:
    - Joshua 4:16
    kjvOsis:
    - Josh.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.17
    scripture: tanakh
    name: Tanakh Joshua 4:17
    ref: Joshua 4:17
    book: Josh
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 5922
    text: 'Joshua therefore commanded the priests, saying: ‘Come ye up out of the Jordan.’'
    translation: JPS 1917
    original: וַיְצַו יְהוֹשֻׁעַ אֶת־הַכֹּהֲנִים לֵאמֹר עֲלוּ מִן־הַיַּרְדֵּן׃
    hebrewPlain: ויצו יהושע את הכהנים לאמר עלו מן הירדן
    kjvRefs:
    - Joshua 4:17
    kjvOsis:
    - Josh.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.18
    scripture: tanakh
    name: Tanakh Joshua 4:18
    ref: Joshua 4:18
    book: Josh
    section: neviim
    chapter: 4
    verse: 18
    ordinal: 5923
    text: And it came to pass, as the priests that bore the ark of the covenant of the LORD came up out of the midst of the Jordan, as soon as the soles of the priests’ feet were drawn up unto the dry ground, that the waters of the Jordan returned unto their place, and went over all its banks, as aforetime.
    translation: JPS 1917
    original: וַיְהִי בעלות [כַּעֲלוֹת] הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן בְּרִית־יְהוָה מִתּוֹךְ הַיַּרְדֵּן נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה וַיָּשֻׁבוּ מֵי־הַיַּרְדֵּן לִמְקוֹמָם וַיֵּלְכוּ כִתְמוֹל־שִׁלְשׁוֹם עַל־כָּל־גְּדוֹתָיו׃
    hebrewPlain: ויהי בעלות [כעלות] הכהנים נשאי ארון ברית יהוה מתוך הירדן נתקו כפות רגלי הכהנים אל החרבה וישבו מי הירדן למקומם וילכו כתמול שלשום על כל גדותיו
    kjvRefs:
    - Joshua 4:18
    kjvOsis:
    - Josh.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.19
    scripture: tanakh
    name: Tanakh Joshua 4:19
    ref: Joshua 4:19
    book: Josh
    section: neviim
    chapter: 4
    verse: 19
    ordinal: 5924
    text: And the people came up out of the Jordan on the tenth day of the first month, and encamped in Gilgal, on the east border of Jericho.
    translation: JPS 1917
    original: וְהָעָם עָלוּ מִן־הַיַּרְדֵּן בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן וַיַּחֲנוּ בַּגִּלְגָּל בִּקְצֵה מִזְרַח יְרִיחוֹ׃
    hebrewPlain: והעם עלו מן הירדן בעשור לחדש הראשון ויחנו בגלגל בקצה מזרח יריחו
    kjvRefs:
    - Joshua 4:19
    kjvOsis:
    - Josh.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.20
    scripture: tanakh
    name: Tanakh Joshua 4:20
    ref: Joshua 4:20
    book: Josh
    section: neviim
    chapter: 4
    verse: 20
    ordinal: 5925
    text: And those twelve stones, which they took out of the Jordan, did Joshua set up in Gilgal.
    translation: JPS 1917
    original: וְאֵת שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה אֲשֶׁר לָקְחוּ מִן־הַיַּרְדֵּן הֵקִים יְהוֹשֻׁעַ בַּגִּלְגָּל׃
    hebrewPlain: ואת שתים עשרה האבנים האלה אשר לקחו מן הירדן הקים יהושע בגלגל
    kjvRefs:
    - Joshua 4:20
    kjvOsis:
    - Josh.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.21
    scripture: tanakh
    name: Tanakh Joshua 4:21
    ref: Joshua 4:21
    book: Josh
    section: neviim
    chapter: 4
    verse: 21
    ordinal: 5926
    text: 'And he spoke unto the children of Israel, saying: ‘When your children shall ask their fathers in time to come, saying: What mean these stones?'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר אֲשֶׁר יִשְׁאָלוּן בְּנֵיכֶם מָחָר אֶת־אֲבוֹתָם לֵאמֹר מָה הָאֲבָנִים הָאֵלֶּה׃
    hebrewPlain: ויאמר אל בני ישראל לאמר אשר ישאלון בניכם מחר את אבותם לאמר מה האבנים האלה
    kjvRefs:
    - Joshua 4:21
    kjvOsis:
    - Josh.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.22
    scripture: tanakh
    name: Tanakh Joshua 4:22
    ref: Joshua 4:22
    book: Josh
    section: neviim
    chapter: 4
    verse: 22
    ordinal: 5927
    text: 'then ye shall let your children know, saying: Israel came over this Jordan on dry land.'
    translation: JPS 1917
    original: וְהוֹדַעְתֶּם אֶת־בְּנֵיכֶם לֵאמֹר בַּיַּבָּשָׁה עָבַר יִשְׂרָאֵל אֶת־הַיַּרְדֵּן הַזֶּה׃
    hebrewPlain: והודעתם את בניכם לאמר ביבשה עבר ישראל את הירדן הזה
    kjvRefs:
    - Joshua 4:22
    kjvOsis:
    - Josh.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.23
    scripture: tanakh
    name: Tanakh Joshua 4:23
    ref: Joshua 4:23
    book: Josh
    section: neviim
    chapter: 4
    verse: 23
    ordinal: 5928
    text: For the LORD your God dried up the waters of Jordan from before you, until ye were passed over, as the LORD your God did to the Red Sea, which He dried up from before us, until we were passed over,
    translation: JPS 1917
    original: אֲשֶׁר־הוֹבִישׁ יְהוָה אֱלֹהֵיכֶם אֶת־מֵי הַיַּרְדֵּן מִפְּנֵיכֶם עַד־עָבְרְכֶם כַּאֲשֶׁר עָשָׂה יְהוָה אֱלֹהֵיכֶם לְיַם־סוּף אֲשֶׁר־הוֹבִישׁ מִפָּנֵינוּ עַד־עָבְרֵנוּ׃
    hebrewPlain: אשר הוביש יהוה אלהיכם את מי הירדן מפניכם עד עברכם כאשר עשה יהוה אלהיכם לים סוף אשר הוביש מפנינו עד עברנו
    kjvRefs:
    - Joshua 4:23
    kjvOsis:
    - Josh.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.4.24
    scripture: tanakh
    name: Tanakh Joshua 4:24
    ref: Joshua 4:24
    book: Josh
    section: neviim
    chapter: 4
    verse: 24
    ordinal: 5929
    text: that all the peoples of the earth may know the hand of the LORD, that it is mighty; that ye may fear the LORD your God for ever.’
    translation: JPS 1917
    original: לְמַעַן דַּעַת כָּל־עַמֵּי הָאָרֶץ אֶת־יַד יְהוָה כִּי חֲזָקָה הִיא לְמַעַן יְרָאתֶם אֶת־יְהוָה אֱלֹהֵיכֶם כָּל־הַיָּמִים׃
    hebrewPlain: למען דעת כל עמי הארץ את יד יהוה כי חזקה היא למען יראתם את יהוה אלהיכם כל הימים
    kjvRefs:
    - Joshua 4:24
    kjvOsis:
    - Josh.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.4
- type: TanakhVerse
  data:
    osis: Josh.5.1
    scripture: tanakh
    name: Tanakh Joshua 5:1
    ref: Joshua 5:1
    book: Josh
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 5930
    text: And it came to pass, when all the kings of the Amorites, that were beyond the Jordan westward, and all the kings of the Canaanites, that were by the sea, heard how that the LORD had dried up the waters of the Jordan from before the children of Israel, until they were passed over, that their heart melted, neither was there spirit in them any more, because of the children of Israel.
    translation: JPS 1917
    original: וַיְהִי כִשְׁמֹעַ כָּל־מַלְכֵי הָאֱמֹרִי אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן יָמָּה וְכָל־מַלְכֵי הַכְּנַעֲנִי אֲשֶׁר עַל־הַיָּם אֵת אֲשֶׁר־הוֹבִישׁ יְהוָה אֶת־מֵי הַיַּרְדֵּן מִפְּנֵי בְנֵי־יִשְׂרָאֵל עַד־עברנו [עָבְרָם] וַיִּמַּס לְבָבָם וְלֹא־הָיָה בָם עוֹד רוּחַ מִפְּנֵי בְּנֵי־יִשְׂרָאֵל׃
    hebrewPlain: ויהי כשמע כל מלכי האמרי אשר בעבר הירדן ימה וכל מלכי הכנעני אשר על הים את אשר הוביש יהוה את מי הירדן מפני בני ישראל עד עברנו [עברם] וימס לבבם ולא היה בם עוד רוח מפני בני ישראל
    kjvRefs:
    - Joshua 5:1
    kjvOsis:
    - Josh.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.2
    scripture: tanakh
    name: Tanakh Joshua 5:2
    ref: Joshua 5:2
    book: Josh
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 5931
    text: 'At that time the LORD said unto Joshua: ‘Make thee knives of flint, and circumcise again the children of Israel the second time.’'
    translation: JPS 1917
    original: בָּעֵת הַהִיא אָמַר יְהוָה אֶל־יְהוֹשֻׁעַ עֲשֵׂה לְךָ חַרְבוֹת צֻרִים וְשׁוּב מֹל אֶת־בְּנֵי־יִשְׂרָאֵל שֵׁנִית׃
    hebrewPlain: בעת ההיא אמר יהוה אל יהושע עשה לך חרבות צרים ושוב מל את בני ישראל שנית
    kjvRefs:
    - Joshua 5:2
    kjvOsis:
    - Josh.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.3
    scripture: tanakh
    name: Tanakh Joshua 5:3
    ref: Joshua 5:3
    book: Josh
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 5932
    text: And Joshua made him knives of flint, and circumcised the children of Israel at Gibeath-ha-araloth.
    translation: JPS 1917
    original: וַיַּעַשׂ־לוֹ יְהוֹשֻׁעַ חַרְבוֹת צֻרִים וַיָּמָל אֶת־בְּנֵי יִשְׂרָאֵל אֶל־גִּבְעַת הָעֲרָלוֹת׃
    hebrewPlain: ויעש לו יהושע חרבות צרים וימל את בני ישראל אל גבעת הערלות
    kjvRefs:
    - Joshua 5:3
    kjvOsis:
    - Josh.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.4
    scripture: tanakh
    name: Tanakh Joshua 5:4
    ref: Joshua 5:4
    book: Josh
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 5933
    text: 'And this is the cause why Joshua did circumcise: all the people that came forth out of Egypt, that were males, even all the men of war, died in the wilderness by the way, after they came forth out of Egypt.'
    translation: JPS 1917
    original: וְזֶה הַדָּבָר אֲשֶׁר־מָל יְהוֹשֻׁעַ כָּל־הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים כֹּל אַנְשֵׁי הַמִּלְחָמָה מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרָיִם׃
    hebrewPlain: וזה הדבר אשר מל יהושע כל העם היצא ממצרים הזכרים כל אנשי המלחמה מתו במדבר בדרך בצאתם ממצרים
    kjvRefs:
    - Joshua 5:4
    kjvOsis:
    - Josh.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.5
    scripture: tanakh
    name: Tanakh Joshua 5:5
    ref: Joshua 5:5
    book: Josh
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 5934
    text: For all the people that came out were circumcised; but all the people that were born in the wilderness by the way as they came forth out of Egypt, had not been circumcised.
    translation: JPS 1917
    original: כִּי־מֻלִים הָיוּ כָּל־הָעָם הַיֹּצְאִים וְכָל־הָעָם הַיִּלֹּדִים בַּמִּדְבָּר בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם לֹא־מָלוּ׃
    hebrewPlain: כי מלים היו כל העם היצאים וכל העם הילדים במדבר בדרך בצאתם ממצרים לא מלו
    kjvRefs:
    - Joshua 5:5
    kjvOsis:
    - Josh.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.6
    scripture: tanakh
    name: Tanakh Joshua 5:6
    ref: Joshua 5:6
    book: Josh
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 5935
    text: For the children of Israel walked forty years in the wilderness, till all the nation, even the men of war that came forth out of Egypt, were consumed, because they hearkened not unto the voice of the LORD; unto whom the LORD swore that He would not let them see the land which the LORD swore unto their fathers that He would give us, a land flowing with milk and honey.
    translation: JPS 1917
    original: כִּי אַרְבָּעִים שָׁנָה הָלְכוּ בְנֵי־יִשְׂרָאֵל בַּמִּדְבָּר עַד־תֹּם כָּל־הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים מִמִּצְרַיִם אֲשֶׁר לֹא־שָׁמְעוּ בְּקוֹל יְהוָה אֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם לְבִלְתִּי הַרְאוֹתָם אֶת־הָאָרֶץ אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבוֹתָם לָתֶת לָנוּ אֶרֶץ זָבַת חָלָב וּדְבָשׁ׃
    hebrewPlain: כי ארבעים שנה הלכו בני ישראל במדבר עד תם כל הגוי אנשי המלחמה היצאים ממצרים אשר לא שמעו בקול יהוה אשר נשבע יהוה להם לבלתי הראותם את הארץ אשר נשבע יהוה לאבותם לתת לנו ארץ זבת חלב ודבש
    kjvRefs:
    - Joshua 5:6
    kjvOsis:
    - Josh.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.7
    scripture: tanakh
    name: Tanakh Joshua 5:7
    ref: Joshua 5:7
    book: Josh
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 5936
    text: And He raised up their children in their stead; them did Joshua circumcise; for they were uncircumcised, because they had not been circumcised by the way.
    translation: JPS 1917
    original: וְאֶת־בְּנֵיהֶם הֵקִים תַּחְתָּם אֹתָם מָל יְהוֹשֻׁעַ כִּי־עֲרֵלִים הָיוּ כִּי לֹא־מָלוּ אוֹתָם בַּדָּרֶךְ׃
    hebrewPlain: ואת בניהם הקים תחתם אתם מל יהושע כי ערלים היו כי לא מלו אותם בדרך
    kjvRefs:
    - Joshua 5:7
    kjvOsis:
    - Josh.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.8
    scripture: tanakh
    name: Tanakh Joshua 5:8
    ref: Joshua 5:8
    book: Josh
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 5937
    text: And it came to pass, when all the nation were circumcised, every one of them, that they abode in their places in the camp, till they were whole.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־תַּמּוּ כָל־הַגּוֹי לְהִמּוֹל וַיֵּשְׁבוּ תַחְתָּם בַּמַּחֲנֶה עַד חֲיוֹתָם׃
    hebrewPlain: ויהי כאשר תמו כל הגוי להמול וישבו תחתם במחנה עד חיותם
    kjvRefs:
    - Joshua 5:8
    kjvOsis:
    - Josh.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.9
    scripture: tanakh
    name: Tanakh Joshua 5:9
    ref: Joshua 5:9
    book: Josh
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 5938
    text: 'And the LORD said unto Joshua: ‘This day have I rolled away the reproach of Egypt from off you.’ Wherefore the name of that place was called Gilgal, unto this day.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ הַיּוֹם גַּלּוֹתִי אֶת־חֶרְפַּת מִצְרַיִם מֵעֲלֵיכֶם וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאמר יהוה אל יהושע היום גלותי את חרפת מצרים מעליכם ויקרא שם המקום ההוא גלגל עד היום הזה
    kjvRefs:
    - Joshua 5:9
    kjvOsis:
    - Josh.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.10
    scripture: tanakh
    name: Tanakh Joshua 5:10
    ref: Joshua 5:10
    book: Josh
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 5939
    text: And the children of Israel encamped in Gilgal; and they kept the passover on the fourteenth day of the month at even in the plains of Jericho.
    translation: JPS 1917
    original: וַיַּחֲנוּ בְנֵי־יִשְׂרָאֵל בַּגִּלְגָּל וַיַּעֲשׂוּ אֶת־הַפֶּסַח בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ בָּעֶרֶב בְּעַרְבוֹת יְרִיחוֹ׃
    hebrewPlain: ויחנו בני ישראל בגלגל ויעשו את הפסח בארבעה עשר יום לחדש בערב בערבות יריחו
    kjvRefs:
    - Joshua 5:10
    kjvOsis:
    - Josh.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.11
    scripture: tanakh
    name: Tanakh Joshua 5:11
    ref: Joshua 5:11
    book: Josh
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 5940
    text: And they did eat of the produce of the land on the morrow after the passover, unleavened cakes and parched corn, in the selfsame day.
    translation: JPS 1917
    original: וַיֹּאכְלוּ מֵעֲבוּר הָאָרֶץ מִמָּחֳרַת הַפֶּסַח מַצּוֹת וְקָלוּי בְּעֶצֶם הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאכלו מעבור הארץ ממחרת הפסח מצות וקלוי בעצם היום הזה
    kjvRefs:
    - Joshua 5:11
    kjvOsis:
    - Josh.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.12
    scripture: tanakh
    name: Tanakh Joshua 5:12
    ref: Joshua 5:12
    book: Josh
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 5941
    text: And the manna ceased on the morrow, after they had eaten of the produce of the land; neither had the children of Israel manna any more; but they did eat of the fruit of the land of Canaan that year.
    translation: JPS 1917
    original: וַיִּשְׁבֹּת הַמָּן מִמָּחֳרָת בְּאָכְלָם מֵעֲבוּר הָאָרֶץ וְלֹא־הָיָה עוֹד לִבְנֵי יִשְׂרָאֵל מָן וַיֹּאכְלוּ מִתְּבוּאַת אֶרֶץ כְּנַעַן בַּשָּׁנָה הַהִיא׃
    hebrewPlain: וישבת המן ממחרת באכלם מעבור הארץ ולא היה עוד לבני ישראל מן ויאכלו מתבואת ארץ כנען בשנה ההיא
    kjvRefs:
    - Joshua 5:12
    kjvOsis:
    - Josh.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.13
    scripture: tanakh
    name: Tanakh Joshua 5:13
    ref: Joshua 5:13
    book: Josh
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 5942
    text: 'And it came to pass, when Joshua was by Jericho, that he lifted up his eyes and looked, and, behold, there stood a man over against him with his sword drawn in his hand; and Joshua went unto him, and said unto him: ‘Art thou for us, or for our adversaries?’ .'
    translation: JPS 1917
    original: וַיְהִי בִּהְיוֹת יְהוֹשֻׁעַ בִּירִיחוֹ וַיִּשָּׂא עֵינָיו וַיַּרְא וְהִנֵּה־אִישׁ עֹמֵד לְנֶגְדּוֹ וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו וַיֹּאמֶר לוֹ הֲלָנוּ אַתָּה אִם־לְצָרֵינוּ׃
    hebrewPlain: ויהי בהיות יהושע ביריחו וישא עיניו וירא והנה איש עמד לנגדו וחרבו שלופה בידו וילך יהושע אליו ויאמר לו הלנו אתה אם לצרינו
    kjvRefs:
    - Joshua 5:13
    kjvOsis:
    - Josh.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.14
    scripture: tanakh
    name: Tanakh Joshua 5:14
    ref: Joshua 5:14
    book: Josh
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 5943
    text: 'And he said: ‘Nay, but I am captain of the host of the LORD; I am now come.’ And Joshua fell on his face to the earth, and bowed down, and said unto him: ‘What saith my lord unto his servant?’'
    translation: JPS 1917
    original: וַיֹּאמֶר לֹא כִּי אֲנִי שַׂר־צְבָא־יְהוָה עַתָּה בָאתִי וַיִּפֹּל יְהוֹשֻׁעַ אֶל־פָּנָיו אַרְצָה וַיִּשְׁתָּחוּ וַיֹּאמֶר לוֹ מָה אֲדֹנִי מְדַבֵּר אֶל־עַבְדּוֹ׃
    hebrewPlain: ויאמר לא כי אני שר צבא יהוה עתה באתי ויפל יהושע אל פניו ארצה וישתחו ויאמר לו מה אדני מדבר אל עבדו
    kjvRefs:
    - Joshua 5:14
    kjvOsis:
    - Josh.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.5.15
    scripture: tanakh
    name: Tanakh Joshua 5:15
    ref: Joshua 5:15
    book: Josh
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 5944
    text: 'And the captain of the LORD’S host said unto Joshua: ‘Put off thy shoe from off thy foot; for the place whereon thou standest is holy.’ And Joshua did so.'
    translation: JPS 1917
    original: וַיֹּאמֶר שַׂר־צְבָא יְהוָה אֶל־יְהוֹשֻׁעַ שַׁל־נַעַלְךָ מֵעַל רַגְלֶךָ כִּי הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו קֹדֶשׁ הוּא וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן׃
    hebrewPlain: ויאמר שר צבא יהוה אל יהושע של נעלך מעל רגלך כי המקום אשר אתה עמד עליו קדש הוא ויעש יהושע כן
    kjvRefs:
    - Joshua 5:15
    kjvOsis:
    - Josh.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.5
- type: TanakhVerse
  data:
    osis: Josh.6.1
    scripture: tanakh
    name: Tanakh Joshua 6:1
    ref: Joshua 6:1
    book: Josh
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 5945
    text: 'Now Jericho was straitly shut up because of the children of Israel: none went out, and none came in.—'
    translation: JPS 1917
    original: וִירִיחוֹ סֹגֶרֶת וּמְסֻגֶּרֶת מִפְּנֵי בְּנֵי יִשְׂרָאֵל אֵין יוֹצֵא וְאֵין בָּא׃
    hebrewPlain: ויריחו סגרת ומסגרת מפני בני ישראל אין יוצא ואין בא
    kjvRefs:
    - Joshua 6:1
    kjvOsis:
    - Josh.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.2
    scripture: tanakh
    name: Tanakh Joshua 6:2
    ref: Joshua 6:2
    book: Josh
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 5946
    text: 'And the LORD said unto Joshua: ‘See, I have given into thy hand Jericho, and the king thereof, even the mighty men of valour.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ רְאֵה נָתַתִּי בְיָדְךָ אֶת־יְרִיחוֹ וְאֶת־מַלְכָּהּ גִּבּוֹרֵי הֶחָיִל׃
    hebrewPlain: ויאמר יהוה אל יהושע ראה נתתי בידך את יריחו ואת מלכה גבורי החיל
    kjvRefs:
    - Joshua 6:2
    kjvOsis:
    - Josh.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.3
    scripture: tanakh
    name: Tanakh Joshua 6:3
    ref: Joshua 6:3
    book: Josh
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 5947
    text: And ye shall compass the city, all the men of war, going about the city once. Thus shalt thou do six days.
    translation: JPS 1917
    original: וְסַבֹּתֶם אֶת־הָעִיר כֹּל אַנְשֵׁי הַמִּלְחָמָה הַקֵּיף אֶת־הָעִיר פַּעַם אֶחָת כֹּה תַעֲשֶׂה שֵׁשֶׁת יָמִים׃
    hebrewPlain: וסבתם את העיר כל אנשי המלחמה הקיף את העיר פעם אחת כה תעשה ששת ימים
    kjvRefs:
    - Joshua 6:3
    kjvOsis:
    - Josh.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.4
    scripture: tanakh
    name: Tanakh Joshua 6:4
    ref: Joshua 6:4
    book: Josh
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 5948
    text: And seven priests shall bear seven rams’ horns before the ark; and the seventh day ye shall compass the city seven times, and the priests shall blow with the horns.
    translation: JPS 1917
    original: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים לִפְנֵי הָאָרוֹן וּבַיּוֹם הַשְּׁבִיעִי תָּסֹבּוּ אֶת־הָעִיר שֶׁבַע פְּעָמִים וְהַכֹּהֲנִים יִתְקְעוּ בַּשּׁוֹפָרוֹת׃
    hebrewPlain: ושבעה כהנים ישאו שבעה שופרות היובלים לפני הארון וביום השביעי תסבו את העיר שבע פעמים והכהנים יתקעו בשופרות
    kjvRefs:
    - Joshua 6:4
    kjvOsis:
    - Josh.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.5
    scripture: tanakh
    name: Tanakh Joshua 6:5
    ref: Joshua 6:5
    book: Josh
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 5949
    text: And it shall be, that when they make a long blast with the ram’s horn, and when ye hear the sound of the horn, all the people shall shout with a great shout; and the wall of the city shall fall down flat, and the people shall go up every man straight before him.’
    translation: JPS 1917
    original: וְהָיָה בִּמְשֹׁךְ בְּקֶרֶן הַיּוֹבֵל בשמעכם [כְּשָׁמְעֲכֶם] אֶת־קוֹל הַשּׁוֹפָר יָרִיעוּ כָל־הָעָם תְּרוּעָה גְדוֹלָה וְנָפְלָה חוֹמַת הָעִיר תַּחְתֶּיהָ וְעָלוּ הָעָם אִישׁ נֶגְדּוֹ׃
    hebrewPlain: והיה במשך בקרן היובל בשמעכם [כשמעכם] את קול השופר יריעו כל העם תרועה גדולה ונפלה חומת העיר תחתיה ועלו העם איש נגדו
    kjvRefs:
    - Joshua 6:5
    kjvOsis:
    - Josh.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.6
    scripture: tanakh
    name: Tanakh Joshua 6:6
    ref: Joshua 6:6
    book: Josh
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 5950
    text: 'And Joshua the son of Nun called the priests, and said unto them: ‘Take up the ark of the covenant, and let seven priests bear seven rams’ horns before the ark of the LORD.’'
    translation: JPS 1917
    original: וַיִּקְרָא יְהוֹשֻׁעַ בִּן־נוּן אֶל־הַכֹּהֲנִים וַיֹּאמֶר אֲלֵהֶם שְׂאוּ אֶת־אֲרוֹן הַבְּרִית וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים לִפְנֵי אֲרוֹן יְהוָה׃
    hebrewPlain: ויקרא יהושע בן נון אל הכהנים ויאמר אלהם שאו את ארון הברית ושבעה כהנים ישאו שבעה שופרות יובלים לפני ארון יהוה
    kjvRefs:
    - Joshua 6:6
    kjvOsis:
    - Josh.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.7
    scripture: tanakh
    name: Tanakh Joshua 6:7
    ref: Joshua 6:7
    book: Josh
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 5951
    text: 'And he said unto the people: ‘Pass on, and compass the city, and let the armed body pass on before the ark of the LORD.’'
    translation: JPS 1917
    original: ויאמרו [וַיֹּאמֶר] אֶל־הָעָם עִבְרוּ וְסֹבּוּ אֶת־הָעִיר וְהֶחָלוּץ יַעֲבֹר לִפְנֵי אֲרוֹן יְהוָה׃
    hebrewPlain: ויאמרו [ויאמר] אל העם עברו וסבו את העיר והחלוץ יעבר לפני ארון יהוה
    kjvRefs:
    - Joshua 6:7
    kjvOsis:
    - Josh.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.8
    scripture: tanakh
    name: Tanakh Joshua 6:8
    ref: Joshua 6:8
    book: Josh
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 5952
    text: And it was so, that when Joshua had spoken unto the people, the seven priests bearing the seven rams’ horns before the LORD passed on, and blew with the horns; and the ark of the covenant of the LORD followed them.
    translation: JPS 1917
    original: וַיְהִי כֶּאֱמֹר יְהוֹשֻׁעַ אֶל־הָעָם וְשִׁבְעָה הַכֹּהֲנִים נֹשְׂאִים שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים לִפְנֵי יְהוָה עָבְרוּ וְתָקְעוּ בַּשּׁוֹפָרוֹת וַאֲרוֹן בְּרִית יְהוָה הֹלֵךְ אַחֲרֵיהֶם׃
    hebrewPlain: ויהי כאמר יהושע אל העם ושבעה הכהנים נשאים שבעה שופרות היובלים לפני יהוה עברו ותקעו בשופרות וארון ברית יהוה הלך אחריהם
    kjvRefs:
    - Joshua 6:8
    kjvOsis:
    - Josh.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.9
    scripture: tanakh
    name: Tanakh Joshua 6:9
    ref: Joshua 6:9
    book: Josh
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 5953
    text: And the armed men went before the priests that blew the horns, and the rearward went after the ark, [the priests] blowing with the horns continually.
    translation: JPS 1917
    original: וְהֶחָלוּץ הֹלֵךְ לִפְנֵי הַכֹּהֲנִים תקעו [תֹּקְעֵי] הַשּׁוֹפָרוֹת וְהַמְאַסֵּף הֹלֵךְ אַחֲרֵי הָאָרוֹן הָלוֹךְ וְתָקוֹעַ בַּשּׁוֹפָרוֹת׃
    hebrewPlain: והחלוץ הלך לפני הכהנים תקעו [תקעי] השופרות והמאסף הלך אחרי הארון הלוך ותקוע בשופרות
    kjvRefs:
    - Joshua 6:9
    kjvOsis:
    - Josh.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.10
    scripture: tanakh
    name: Tanakh Joshua 6:10
    ref: Joshua 6:10
    book: Josh
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 5954
    text: 'And Joshua commanded the people, saying: ‘Ye shall not shout, nor let your voice be heard, neither shall any word proceed out of your mouth, until the day I bid you shout; then shall ye shout.’'
    translation: JPS 1917
    original: וְאֶת־הָעָם צִוָּה יְהוֹשֻׁעַ לֵאמֹר לֹא תָרִיעוּ וְלֹא־תַשְׁמִיעוּ אֶת־קוֹלְכֶם וְלֹא־יֵצֵא מִפִּיכֶם דָּבָר עַד יוֹם אָמְרִי אֲלֵיכֶם הָרִיעוּ וַהֲרִיעֹתֶם׃
    hebrewPlain: ואת העם צוה יהושע לאמר לא תריעו ולא תשמיעו את קולכם ולא יצא מפיכם דבר עד יום אמרי אליכם הריעו והריעתם
    kjvRefs:
    - Joshua 6:10
    kjvOsis:
    - Josh.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.11
    scripture: tanakh
    name: Tanakh Joshua 6:11
    ref: Joshua 6:11
    book: Josh
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 5955
    text: So he caused the ark of the LORD to compass the city, going about it once; and they came into the camp, and lodged in the camp.
    translation: JPS 1917
    original: וַיַּסֵּב אֲרוֹן־יְהוָה אֶת־הָעִיר הַקֵּף פַּעַם אֶחָת וַיָּבֹאוּ הַמַּחֲנֶה וַיָּלִינוּ בַּמַּחֲנֶה׃
    hebrewPlain: ויסב ארון יהוה את העיר הקף פעם אחת ויבאו המחנה וילינו במחנה
    kjvRefs:
    - Joshua 6:11
    kjvOsis:
    - Josh.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.12
    scripture: tanakh
    name: Tanakh Joshua 6:12
    ref: Joshua 6:12
    book: Josh
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 5956
    text: And Joshua rose early in the morning, and the priests took up the ark of the LORD.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְהוֹשֻׁעַ בַּבֹּקֶר וַיִּשְׂאוּ הַכֹּהֲנִים אֶת־אֲרוֹן יְהוָה׃
    hebrewPlain: וישכם יהושע בבקר וישאו הכהנים את ארון יהוה
    kjvRefs:
    - Joshua 6:12
    kjvOsis:
    - Josh.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.13
    scripture: tanakh
    name: Tanakh Joshua 6:13
    ref: Joshua 6:13
    book: Josh
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 5957
    text: And the seven priests bearing the seven rams’ horns before the ark of the LORD went on continually, and blew with the horns; and the armed men went before them; and the rearward came after the ark of the LORD, [the priests] blowing with the horns continually.
    translation: JPS 1917
    original: וְשִׁבְעָה הַכֹּהֲנִים נֹשְׂאִים שִׁבְעָה שׁוֹפְרוֹת הַיֹּבְלִים לִפְנֵי אֲרוֹן יְהוָה הֹלְכִים הָלוֹךְ וְתָקְעוּ בַּשּׁוֹפָרוֹת וְהֶחָלוּץ הֹלֵךְ לִפְנֵיהֶם וְהַמְאַסֵּף הֹלֵךְ אַחֲרֵי אֲרוֹן יְהוָה הולך [הָלוֹךְ] וְתָקוֹעַ בַּשּׁוֹפָרוֹת׃
    hebrewPlain: ושבעה הכהנים נשאים שבעה שופרות היבלים לפני ארון יהוה הלכים הלוך ותקעו בשופרות והחלוץ הלך לפניהם והמאסף הלך אחרי ארון יהוה הולך [הלוך] ותקוע בשופרות
    kjvRefs:
    - Joshua 6:13
    kjvOsis:
    - Josh.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.14
    scripture: tanakh
    name: Tanakh Joshua 6:14
    ref: Joshua 6:14
    book: Josh
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 5958
    text: And the second day they compassed the city once, and returned into the camp; so they did six days.
    translation: JPS 1917
    original: וַיָּסֹבּוּ אֶת־הָעִיר בַּיּוֹם הַשֵּׁנִי פַּעַם אַחַת וַיָּשֻׁבוּ הַמַּחֲנֶה כֹּה עָשׂוּ שֵׁשֶׁת יָמִים׃
    hebrewPlain: ויסבו את העיר ביום השני פעם אחת וישבו המחנה כה עשו ששת ימים
    kjvRefs:
    - Joshua 6:14
    kjvOsis:
    - Josh.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.15
    scripture: tanakh
    name: Tanakh Joshua 6:15
    ref: Joshua 6:15
    book: Josh
    section: neviim
    chapter: 6
    verse: 15
    ordinal: 5959
    text: And it came to pass on the seventh day, that they rose early at the dawning of the day, and compassed the city after the same manner seven times; only on that day they compassed the city seven times.
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי וַיַּשְׁכִּמוּ כַּעֲלוֹת הַשַּׁחַר וַיָּסֹבּוּ אֶת־הָעִיר כַּמִּשְׁפָּט הַזֶּה שֶׁבַע פְּעָמִים רַק בַּיּוֹם הַהוּא סָבְבוּ אֶת־הָעִיר שֶׁבַע פְּעָמִים׃
    hebrewPlain: ויהי ביום השביעי וישכמו כעלות השחר ויסבו את העיר כמשפט הזה שבע פעמים רק ביום ההוא סבבו את העיר שבע פעמים
    kjvRefs:
    - Joshua 6:15
    kjvOsis:
    - Josh.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.16
    scripture: tanakh
    name: Tanakh Joshua 6:16
    ref: Joshua 6:16
    book: Josh
    section: neviim
    chapter: 6
    verse: 16
    ordinal: 5960
    text: 'And it came to pass at the seventh time, when the priests blew with the horns, that Joshua said unto the people: ‘Shout; for the LORD hath given you the city.'
    translation: JPS 1917
    original: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית תָּקְעוּ הַכֹּהֲנִים בַּשּׁוֹפָרוֹת וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־הָעָם הָרִיעוּ כִּי־נָתַן יְהוָה לָכֶם אֶת־הָעִיר׃
    hebrewPlain: ויהי בפעם השביעית תקעו הכהנים בשופרות ויאמר יהושע אל העם הריעו כי נתן יהוה לכם את העיר
    kjvRefs:
    - Joshua 6:16
    kjvOsis:
    - Josh.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.17
    scripture: tanakh
    name: Tanakh Joshua 6:17
    ref: Joshua 6:17
    book: Josh
    section: neviim
    chapter: 6
    verse: 17
    ordinal: 5961
    text: And the city shall be devoted, even it and all that is therein, to the LORD; only Rahab the harlot shall live, she and all that are with her in the house, because she hid the messengers that we sent.
    translation: JPS 1917
    original: וְהָיְתָה הָעִיר חֵרֶם הִיא וְכָל־אֲשֶׁר־בָּהּ לַיהוָה רַק רָחָב הַזּוֹנָה תִּחְיֶה הִיא וְכָל־אֲשֶׁר אִתָּהּ בַּבַּיִת כִּי הֶחְבְּאַתָה אֶת־הַמַּלְאָכִים אֲשֶׁר שָׁלָחְנוּ׃
    hebrewPlain: והיתה העיר חרם היא וכל אשר בה ליהוה רק רחב הזונה תחיה היא וכל אשר אתה בבית כי החבאתה את המלאכים אשר שלחנו
    kjvRefs:
    - Joshua 6:17
    kjvOsis:
    - Josh.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.18
    scripture: tanakh
    name: Tanakh Joshua 6:18
    ref: Joshua 6:18
    book: Josh
    section: neviim
    chapter: 6
    verse: 18
    ordinal: 5962
    text: And ye, in any wise keep yourselves from the devoted thing, lest ye make yourselves accursed by taking of the devoted thing, so should ye make the camp of Israel accursed, and trouble it.
    translation: JPS 1917
    original: וְרַק־אַתֶּם שִׁמְרוּ מִן־הַחֵרֶם פֶּן־תַּחֲרִימוּ וּלְקַחְתֶּם מִן־הַחֵרֶם וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם וַעֲכַרְתֶּם אוֹתוֹ׃
    hebrewPlain: ורק אתם שמרו מן החרם פן תחרימו ולקחתם מן החרם ושמתם את מחנה ישראל לחרם ועכרתם אותו
    kjvRefs:
    - Joshua 6:18
    kjvOsis:
    - Josh.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.19
    scripture: tanakh
    name: Tanakh Joshua 6:19
    ref: Joshua 6:19
    book: Josh
    section: neviim
    chapter: 6
    verse: 19
    ordinal: 5963
    text: But all the silver, and gold, and vessels of brass and iron, are holy unto the LORD; they shall come into the treasury of the LORD.’
    translation: JPS 1917
    original: וְכֹל כֶּסֶף וְזָהָב וּכְלֵי נְחֹשֶׁת וּבַרְזֶל קֹדֶשׁ הוּא לַיהוָה אוֹצַר יְהוָה יָבוֹא׃
    hebrewPlain: וכל כסף וזהב וכלי נחשת וברזל קדש הוא ליהוה אוצר יהוה יבוא
    kjvRefs:
    - Joshua 6:19
    kjvOsis:
    - Josh.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.20
    scripture: tanakh
    name: Tanakh Joshua 6:20
    ref: Joshua 6:20
    book: Josh
    section: neviim
    chapter: 6
    verse: 20
    ordinal: 5964
    text: So the people shouted, and [the priests] blew with the horns. And it came to pass, when the people heard the sound of the horn, that the people shouted with a great shout, and the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.
    translation: JPS 1917
    original: וַיָּרַע הָעָם וַיִּתְקְעוּ בַּשֹּׁפָרוֹת וַיְהִי כִשְׁמֹעַ הָעָם אֶת־קוֹל הַשּׁוֹפָר וַיָּרִיעוּ הָעָם תְּרוּעָה גְדוֹלָה וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ וַיַּעַל הָעָם הָעִירָה אִישׁ נֶגְדּוֹ וַיִּלְכְּדוּ אֶת־הָעִיר׃
    hebrewPlain: וירע העם ויתקעו בשפרות ויהי כשמע העם את קול השופר ויריעו העם תרועה גדולה ותפל החומה תחתיה ויעל העם העירה איש נגדו וילכדו את העיר
    kjvRefs:
    - Joshua 6:20
    kjvOsis:
    - Josh.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.21
    scripture: tanakh
    name: Tanakh Joshua 6:21
    ref: Joshua 6:21
    book: Josh
    section: neviim
    chapter: 6
    verse: 21
    ordinal: 5965
    text: And they utterly destroyed all that was in the city, both man and woman, both young and old, and ox, and sheep, and ass, with the edge of the sword.
    translation: JPS 1917
    original: וַיַּחֲרִימוּ אֶת־כָּל־אֲשֶׁר בָּעִיר מֵאִישׁ וְעַד־אִשָּׁה מִנַּעַר וְעַד־זָקֵן וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר לְפִי־חָרֶב׃
    hebrewPlain: ויחרימו את כל אשר בעיר מאיש ועד אשה מנער ועד זקן ועד שור ושה וחמור לפי חרב
    kjvRefs:
    - Joshua 6:21
    kjvOsis:
    - Josh.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.22
    scripture: tanakh
    name: Tanakh Joshua 6:22
    ref: Joshua 6:22
    book: Josh
    section: neviim
    chapter: 6
    verse: 22
    ordinal: 5966
    text: 'And Joshua said unto the two men that had spied out the land: ‘Go into the harlot’s house, and bring out thence the woman, and all that she hath, as ye swore unto her.’'
    translation: JPS 1917
    original: וְלִשְׁנַיִם הָאֲנָשִׁים הַמְרַגְּלִים אֶת־הָאָרֶץ אָמַר יְהוֹשֻׁעַ בֹּאוּ בֵּית־הָאִשָּׁה הַזּוֹנָה וְהוֹצִיאוּ מִשָּׁם אֶת־הָאִשָּׁה וְאֶת־כָּל־אֲשֶׁר־לָהּ כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ׃
    hebrewPlain: ולשנים האנשים המרגלים את הארץ אמר יהושע באו בית האשה הזונה והוציאו משם את האשה ואת כל אשר לה כאשר נשבעתם לה
    kjvRefs:
    - Joshua 6:22
    kjvOsis:
    - Josh.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.23
    scripture: tanakh
    name: Tanakh Joshua 6:23
    ref: Joshua 6:23
    book: Josh
    section: neviim
    chapter: 6
    verse: 23
    ordinal: 5967
    text: And the young men the spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had, all her kindred also they brought out; and they set them without the camp of Israel.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַנְּעָרִים הַמְרַגְּלִים וַיֹּצִיאוּ אֶת־רָחָב וְאֶת־אָבִיהָ וְאֶת־אִמָּהּ וְאֶת־אַחֶיהָ וְאֶת־כָּל־אֲשֶׁר־לָהּ וְאֵת כָּל־מִשְׁפְּחוֹתֶיהָ הוֹצִיאוּ וַיַּנִּיחוּם מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל׃
    hebrewPlain: ויבאו הנערים המרגלים ויציאו את רחב ואת אביה ואת אמה ואת אחיה ואת כל אשר לה ואת כל משפחותיה הוציאו ויניחום מחוץ למחנה ישראל
    kjvRefs:
    - Joshua 6:23
    kjvOsis:
    - Josh.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.24
    scripture: tanakh
    name: Tanakh Joshua 6:24
    ref: Joshua 6:24
    book: Josh
    section: neviim
    chapter: 6
    verse: 24
    ordinal: 5968
    text: And they burnt the city with fire, and all that was therein; only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD.
    translation: JPS 1917
    original: וְהָעִיר שָׂרְפוּ בָאֵשׁ וְכָל־אֲשֶׁר־בָּהּ רַק הַכֶּסֶף וְהַזָּהָב וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל נָתְנוּ אוֹצַר בֵּית־יְהוָה׃
    hebrewPlain: והעיר שרפו באש וכל אשר בה רק הכסף והזהב וכלי הנחשת והברזל נתנו אוצר בית יהוה
    kjvRefs:
    - Joshua 6:24
    kjvOsis:
    - Josh.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.25
    scripture: tanakh
    name: Tanakh Joshua 6:25
    ref: Joshua 6:25
    book: Josh
    section: neviim
    chapter: 6
    verse: 25
    ordinal: 5969
    text: But Rahab the harlot, and her father’s household, and all that she had, did Joshua save alive; and she dwelt in the midst of Israel, unto this day; because she hid the messengers, whom Joshua sent to spy out Jericho.
    translation: JPS 1917
    original: וְאֶת־רָחָב הַזּוֹנָה וְאֶת־בֵּית אָבִיהָ וְאֶת־כָּל־אֲשֶׁר־לָהּ הֶחֱיָה יְהוֹשֻׁעַ וַתֵּשֶׁב בְּקֶרֶב יִשְׂרָאֵל עַד הַיּוֹם הַזֶּה כִּי הֶחְבִּיאָה אֶת־הַמַּלְאָכִים אֲשֶׁר־שָׁלַח יְהוֹשֻׁעַ לְרַגֵּל אֶת־יְרִיחוֹ׃
    hebrewPlain: ואת רחב הזונה ואת בית אביה ואת כל אשר לה החיה יהושע ותשב בקרב ישראל עד היום הזה כי החביאה את המלאכים אשר שלח יהושע לרגל את יריחו
    kjvRefs:
    - Joshua 6:25
    kjvOsis:
    - Josh.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.26
    scripture: tanakh
    name: Tanakh Joshua 6:26
    ref: Joshua 6:26
    book: Josh
    section: neviim
    chapter: 6
    verse: 26
    ordinal: 5970
    text: 'And Joshua charged the people with an oath at that time, saying: ‘Cursed be the man before the LORD, that riseth up and buildeth this city, even Jericho; with the loss of his first-born shall he lay the foundation thereof, and with the loss of his youngest son shall he set up the gates of it.’'
    translation: JPS 1917
    original: וַיַּשְׁבַּע יְהוֹשֻׁעַ בָּעֵת הַהִיא לֵאמֹר אָרוּר הָאִישׁ לִפְנֵי יְהוָה אֲשֶׁר יָקוּם וּבָנָה אֶת־הָעִיר הַזֹּאת אֶת־יְרִיחוֹ בִּבְכֹרוֹ יְיַסְּדֶנָּה וּבִצְעִירוֹ יַצִּיב דְּלָתֶיהָ׃
    hebrewPlain: וישבע יהושע בעת ההיא לאמר ארור האיש לפני יהוה אשר יקום ובנה את העיר הזאת את יריחו בבכרו ייסדנה ובצעירו יציב דלתיה
    kjvRefs:
    - Joshua 6:26
    kjvOsis:
    - Josh.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.6.27
    scripture: tanakh
    name: Tanakh Joshua 6:27
    ref: Joshua 6:27
    book: Josh
    section: neviim
    chapter: 6
    verse: 27
    ordinal: 5971
    text: So the LORD was with Joshua; and his fame was in all the land.
    translation: JPS 1917
    original: וַיְהִי יְהוָה אֶת־יְהוֹשֻׁעַ וַיְהִי שָׁמְעוֹ בְּכָל־הָאָרֶץ׃
    hebrewPlain: ויהי יהוה את יהושע ויהי שמעו בכל הארץ
    kjvRefs:
    - Joshua 6:27
    kjvOsis:
    - Josh.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.6
- type: TanakhVerse
  data:
    osis: Josh.7.1
    scripture: tanakh
    name: Tanakh Joshua 7:1
    ref: Joshua 7:1
    book: Josh
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 5972
    text: But the children of Israel committed a trespass concerning the devoted thing; for Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the devoted thing; and the anger of the LORD was kindled against the children of Israel.
    translation: JPS 1917
    original: וַיִּמְעֲלוּ בְנֵי־יִשְׂרָאֵל מַעַל בַּחֵרֶם וַיִּקַּח עָכָן בֶּן־כַּרְמִי בֶן־זַבְדִּי בֶן־זֶרַח לְמַטֵּה יְהוּדָה מִן־הַחֵרֶם וַיִּחַר־אַף יְהוָה בִּבְנֵי יִשְׂרָאֵל׃
    hebrewPlain: וימעלו בני ישראל מעל בחרם ויקח עכן בן כרמי בן זבדי בן זרח למטה יהודה מן החרם ויחר אף יהוה בבני ישראל
    kjvRefs:
    - Joshua 7:1
    kjvOsis:
    - Josh.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.2
    scripture: tanakh
    name: Tanakh Joshua 7:2
    ref: Joshua 7:2
    book: Josh
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 5973
    text: 'And Joshua sent men from Jericho to Ai, which is beside Beth-aven, on the east side of Beth-el, and spoke unto them, saying: ‘Go up and spy out the land.’ And the men went up and spied out Ai.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוֹשֻׁעַ אֲנָשִׁים מִירִיחוֹ הָעַי אֲשֶׁר עִם־בֵּית אָוֶן מִקֶּדֶם לְבֵית־אֵל וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר עֲלוּ וְרַגְּלוּ אֶת־הָאָרֶץ וַיַּעֲלוּ הָאֲנָשִׁים וַיְרַגְּלוּ אֶת־הָעָי׃
    hebrewPlain: וישלח יהושע אנשים מיריחו העי אשר עם בית און מקדם לבית אל ויאמר אליהם לאמר עלו ורגלו את הארץ ויעלו האנשים וירגלו את העי
    kjvRefs:
    - Joshua 7:2
    kjvOsis:
    - Josh.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.3
    scripture: tanakh
    name: Tanakh Joshua 7:3
    ref: Joshua 7:3
    book: Josh
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 5974
    text: 'And they returned to Joshua, and said unto him: ‘Let not all the people go up; but let about two or three thousand men go up and smite Ai; make not all the people to toil thither; for they are but few.’'
    translation: JPS 1917
    original: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו אַל־יַעַל כָּל־הָעָם כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ יַעֲלוּ וְיַכּוּ אֶת־הָעָי אַל־תְּיַגַּע־שָׁמָּה אֶת־כָּל־הָעָם כִּי מְעַט הֵמָּה׃
    hebrewPlain: וישבו אל יהושע ויאמרו אליו אל יעל כל העם כאלפים איש או כשלשת אלפים איש יעלו ויכו את העי אל תיגע שמה את כל העם כי מעט המה
    kjvRefs:
    - Joshua 7:3
    kjvOsis:
    - Josh.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.4
    scripture: tanakh
    name: Tanakh Joshua 7:4
    ref: Joshua 7:4
    book: Josh
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 5975
    text: So there went up thither of the people about three thousand men; and they fled before the men of Ai.
    translation: JPS 1917
    original: וַיַּעֲלוּ מִן־הָעָם שָׁמָּה כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ וַיָּנֻסוּ לִפְנֵי אַנְשֵׁי הָעָי׃
    hebrewPlain: ויעלו מן העם שמה כשלשת אלפים איש וינסו לפני אנשי העי
    kjvRefs:
    - Joshua 7:4
    kjvOsis:
    - Josh.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.5
    scripture: tanakh
    name: Tanakh Joshua 7:5
    ref: Joshua 7:5
    book: Josh
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 5976
    text: And the men of Ai smote of them about thirty and six men; and they chased them from before the gate even unto Shebarim, and smote them at the descent; and the hearts of the people melted, and became as water.
    translation: JPS 1917
    original: וַיַּכּוּ מֵהֶם אַנְשֵׁי הָעַי כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ וַיִּרְדְּפוּם לִפְנֵי הַשַּׁעַר עַד־הַשְּׁבָרִים וַיַּכּוּם בַּמּוֹרָד וַיִּמַּס לְבַב־הָעָם וַיְהִי לְמָיִם׃
    hebrewPlain: ויכו מהם אנשי העי כשלשים וששה איש וירדפום לפני השער עד השברים ויכום במורד וימס לבב העם ויהי למים
    kjvRefs:
    - Joshua 7:5
    kjvOsis:
    - Josh.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.6
    scripture: tanakh
    name: Tanakh Joshua 7:6
    ref: Joshua 7:6
    book: Josh
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 5977
    text: And Joshua rent his clothes, and fell to the earth upon his face before the ark of the LORD until the evening, he and the elders of Israel; and they put dust upon their heads.
    translation: JPS 1917
    original: וַיִּקְרַע יְהוֹשֻׁעַ שִׂמְלֹתָיו וַיִּפֹּל עַל־פָּנָיו אַרְצָה לִפְנֵי אֲרוֹן יְהוָה עַד־הָעֶרֶב הוּא וְזִקְנֵי יִשְׂרָאֵל וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם׃
    hebrewPlain: ויקרע יהושע שמלתיו ויפל על פניו ארצה לפני ארון יהוה עד הערב הוא וזקני ישראל ויעלו עפר על ראשם
    kjvRefs:
    - Joshua 7:6
    kjvOsis:
    - Josh.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.7
    scripture: tanakh
    name: Tanakh Joshua 7:7
    ref: Joshua 7:7
    book: Josh
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 5978
    text: 'And Joshua said: ‘Alas, O Lord GOD, wherefore hast Thou at all brought this people over the Jordan, to deliver us into the hand of the Amorites, to cause us to perish? would that we had been content and dwelt beyond the Jordan!'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֲהָהּ אֲדֹנָי יְהוִה לָמָה הֵעֲבַרְתָּ הַעֲבִיר אֶת־הָעָם הַזֶּה אֶת־הַיַּרְדֵּן לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי לְהַאֲבִידֵנוּ וְלוּ הוֹאַלְנוּ וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן׃
    hebrewPlain: ויאמר יהושע אהה אדני יהוה למה העברת העביר את העם הזה את הירדן לתת אתנו ביד האמרי להאבידנו ולו הואלנו ונשב בעבר הירדן
    kjvRefs:
    - Joshua 7:7
    kjvOsis:
    - Josh.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.8
    scripture: tanakh
    name: Tanakh Joshua 7:8
    ref: Joshua 7:8
    book: Josh
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 5979
    text: Oh, Lord, what shall I say, after that Israel hath turned their backs before their enemies!
    translation: JPS 1917
    original: בִּי אֲדֹנָי מָה אֹמַר אַחֲרֵי אֲשֶׁר הָפַךְ יִשְׂרָאֵל עֹרֶף לִפְנֵי אֹיְבָיו׃
    hebrewPlain: בי אדני מה אמר אחרי אשר הפך ישראל ערף לפני איביו
    kjvRefs:
    - Joshua 7:8
    kjvOsis:
    - Josh.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.9
    scripture: tanakh
    name: Tanakh Joshua 7:9
    ref: Joshua 7:9
    book: Josh
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 5980
    text: For when the Canaanites and all the inhabitants of the land hear of it, they will compass us round, and cut off our name from the earth; and what wilt Thou do for Thy great name?’
    translation: JPS 1917
    original: וְיִשְׁמְעוּ הַכְּנַעֲנִי וְכֹל יֹשְׁבֵי הָאָרֶץ וְנָסַבּוּ עָלֵינוּ וְהִכְרִיתוּ אֶת־שְׁמֵנוּ מִן־הָאָרֶץ וּמַה־תַּעֲשֵׂה לְשִׁמְךָ הַגָּדוֹל׃
    hebrewPlain: וישמעו הכנעני וכל ישבי הארץ ונסבו עלינו והכריתו את שמנו מן הארץ ומה תעשה לשמך הגדול
    kjvRefs:
    - Joshua 7:9
    kjvOsis:
    - Josh.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.10
    scripture: tanakh
    name: Tanakh Joshua 7:10
    ref: Joshua 7:10
    book: Josh
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 5981
    text: 'And the LORD said unto Joshua: ‘Get thee up; wherefore, now, art thou fallen upon thy face?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ קֻם לָךְ לָמָּה זֶּה אַתָּה נֹפֵל עַל־פָּנֶיךָ׃
    hebrewPlain: ויאמר יהוה אל יהושע קם לך למה זה אתה נפל על פניך
    kjvRefs:
    - Joshua 7:10
    kjvOsis:
    - Josh.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.11
    scripture: tanakh
    name: Tanakh Joshua 7:11
    ref: Joshua 7:11
    book: Josh
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 5982
    text: Israel hath sinned; yea, they have even transgressed My covenant which I commanded them; yea, they have even taken of the devoted thing; and have also stolen, and dissembled also, and they have even put it among their own stuff.
    translation: JPS 1917
    original: חָטָא יִשְׂרָאֵל וְגַם עָבְרוּ אֶת־בְּרִיתִי אֲשֶׁר צִוִּיתִי אוֹתָם וְגַם לָקְחוּ מִן־הַחֵרֶם וְגַם גָּנְבוּ וְגַם כִּחֲשׁוּ וְגַם שָׂמוּ בִכְלֵיהֶם׃
    hebrewPlain: חטא ישראל וגם עברו את בריתי אשר צויתי אותם וגם לקחו מן החרם וגם גנבו וגם כחשו וגם שמו בכליהם
    kjvRefs:
    - Joshua 7:11
    kjvOsis:
    - Josh.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.12
    scripture: tanakh
    name: Tanakh Joshua 7:12
    ref: Joshua 7:12
    book: Josh
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 5983
    text: Therefore the children of Israel cannot stand before their enemies, they turn their backs before their enemies, because they are become accursed; I will not be with you any more, except ye destroy the accursed from among you.
    translation: JPS 1917
    original: וְלֹא יֻכְלוּ בְּנֵי יִשְׂרָאֵל לָקוּם לִפְנֵי אֹיְבֵיהֶם עֹרֶף יִפְנוּ לִפְנֵי אֹיְבֵיהֶם כִּי הָיוּ לְחֵרֶם לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם אִם־לֹא תַשְׁמִידוּ הַחֵרֶם מִקִּרְבְּכֶם׃
    hebrewPlain: ולא יכלו בני ישראל לקום לפני איביהם ערף יפנו לפני איביהם כי היו לחרם לא אוסיף להיות עמכם אם לא תשמידו החרם מקרבכם
    kjvRefs:
    - Joshua 7:12
    kjvOsis:
    - Josh.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.13
    scripture: tanakh
    name: Tanakh Joshua 7:13
    ref: Joshua 7:13
    book: Josh
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 5984
    text: 'Up, sanctify the people, and say: Sanctify yourselves against tomorrow; for thus saith the LORD, the God of Israel: There is a curse in the midst of thee, O Israel; thou canst not stand before thine enemies, until ye take away the accursed thing from among you.'
    translation: JPS 1917
    original: קֻם קַדֵּשׁ אֶת־הָעָם וְאָמַרְתָּ הִתְקַדְּשׁוּ לְמָחָר כִּי כֹה אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל חֵרֶם בְּקִרְבְּךָ יִשְׂרָאֵל לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ עַד־הֲסִירְכֶם הַחֵרֶם מִקִּרְבְּכֶם׃
    hebrewPlain: קם קדש את העם ואמרת התקדשו למחר כי כה אמר יהוה אלהי ישראל חרם בקרבך ישראל לא תוכל לקום לפני איביך עד הסירכם החרם מקרבכם
    kjvRefs:
    - Joshua 7:13
    kjvOsis:
    - Josh.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.14
    scripture: tanakh
    name: Tanakh Joshua 7:14
    ref: Joshua 7:14
    book: Josh
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 5985
    text: In the morning therefore ye shall draw near by your tribes; and it shall be, that the tribe which the LORD taketh shall come near by families; and the family which the LORD shall take shall come near by households; and the household which the LORD shall take shall come near man by man.
    translation: JPS 1917
    original: וְנִקְרַבְתֶּם בַּבֹּקֶר לְשִׁבְטֵיכֶם וְהָיָה הַשֵּׁבֶט אֲשֶׁר־יִלְכְּדֶנּוּ יְהוָה יִקְרַב לַמִּשְׁפָּחוֹת וְהַמִּשְׁפָּחָה אֲשֶׁר־יִלְכְּדֶנָּה יְהוָה תִּקְרַב לַבָּתִּים וְהַבַּיִת אֲשֶׁר יִלְכְּדֶנּוּ יְהוָה יִקְרַב לַגְּבָרִים׃
    hebrewPlain: ונקרבתם בבקר לשבטיכם והיה השבט אשר ילכדנו יהוה יקרב למשפחות והמשפחה אשר ילכדנה יהוה תקרב לבתים והבית אשר ילכדנו יהוה יקרב לגברים
    kjvRefs:
    - Joshua 7:14
    kjvOsis:
    - Josh.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.15
    scripture: tanakh
    name: Tanakh Joshua 7:15
    ref: Joshua 7:15
    book: Josh
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 5986
    text: And it shall be that he that is taken with the devoted thing shall be burnt with fire, he and all that he hath; because he hath transgressed the covenant of the LORD, and because he hath wrought a wanton deed in Israel.’
    translation: JPS 1917
    original: וְהָיָה הַנִּלְכָּד בַּחֵרֶם יִשָּׂרֵף בָּאֵשׁ אֹתוֹ וְאֶת־כָּל־אֲשֶׁר־לוֹ כִּי עָבַר אֶת־בְּרִית יְהוָה וְכִי־עָשָׂה נְבָלָה בְּיִשְׂרָאֵל׃
    hebrewPlain: והיה הנלכד בחרם ישרף באש אתו ואת כל אשר לו כי עבר את ברית יהוה וכי עשה נבלה בישראל
    kjvRefs:
    - Joshua 7:15
    kjvOsis:
    - Josh.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.16
    scripture: tanakh
    name: Tanakh Joshua 7:16
    ref: Joshua 7:16
    book: Josh
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 5987
    text: So Joshua rose up early in the morning, and brought Israel near by their tribes; and the tribe of Judah was taken.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְהוֹשֻׁעַ בַּבֹּקֶר וַיַּקְרֵב אֶת־יִשְׂרָאֵל לִשְׁבָטָיו וַיִּלָּכֵד שֵׁבֶט יְהוּדָה׃
    hebrewPlain: וישכם יהושע בבקר ויקרב את ישראל לשבטיו וילכד שבט יהודה
    kjvRefs:
    - Joshua 7:16
    kjvOsis:
    - Josh.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.17
    scripture: tanakh
    name: Tanakh Joshua 7:17
    ref: Joshua 7:17
    book: Josh
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 5988
    text: And he brought near the family of Judah; and he took the family of the Zerahites. And he brought near the family of the Zerahites man by man; and Zabdi was taken.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־מִשְׁפַּחַת יְהוּדָה וַיִּלְכֹּד אֵת מִשְׁפַּחַת הַזַּרְחִי וַיַּקְרֵב אֶת־מִשְׁפַּחַת הַזַּרְחִי לַגְּבָרִים וַיִּלָּכֵד זַבְדִּי׃
    hebrewPlain: ויקרב את משפחת יהודה וילכד את משפחת הזרחי ויקרב את משפחת הזרחי לגברים וילכד זבדי
    kjvRefs:
    - Joshua 7:17
    kjvOsis:
    - Josh.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.18
    scripture: tanakh
    name: Tanakh Joshua 7:18
    ref: Joshua 7:18
    book: Josh
    section: neviim
    chapter: 7
    verse: 18
    ordinal: 5989
    text: And he brought near his household man by man; and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־בֵּיתוֹ לַגְּבָרִים וַיִּלָּכֵד עָכָן בֶּן־כַּרְמִי בֶן־זַבְדִּי בֶּן־זֶרַח לְמַטֵּה יְהוּדָה׃
    hebrewPlain: ויקרב את ביתו לגברים וילכד עכן בן כרמי בן זבדי בן זרח למטה יהודה
    kjvRefs:
    - Joshua 7:18
    kjvOsis:
    - Josh.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.19
    scripture: tanakh
    name: Tanakh Joshua 7:19
    ref: Joshua 7:19
    book: Josh
    section: neviim
    chapter: 7
    verse: 19
    ordinal: 5990
    text: 'And Joshua said unto Achan: ‘My son, give, I pray thee, glory to the LORD, the God of Israel, and make confession unto Him; and tell me now what thou hast done; hide nothing from me.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־עָכָן בְּנִי שִׂים־נָא כָבוֹד לַיהוָה אֱלֹהֵי יִשְׂרָאֵל וְתֶן־לוֹ תוֹדָה וְהַגֶּד־נָא לִי מֶה עָשִׂיתָ אַל־תְּכַחֵד מִמֶּנִּי׃
    hebrewPlain: ויאמר יהושע אל עכן בני שים נא כבוד ליהוה אלהי ישראל ותן לו תודה והגד נא לי מה עשית אל תכחד ממני
    kjvRefs:
    - Joshua 7:19
    kjvOsis:
    - Josh.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.20
    scripture: tanakh
    name: Tanakh Joshua 7:20
    ref: Joshua 7:20
    book: Josh
    section: neviim
    chapter: 7
    verse: 20
    ordinal: 5991
    text: 'And Achan answered Joshua, and said: ‘Of a truth I have sinned against the LORD, the God of Israel, and thus and thus have I done.'
    translation: JPS 1917
    original: וַיַּעַן עָכָן אֶת־יְהוֹשֻׁעַ וַיֹּאמַר אָמְנָה אָנֹכִי חָטָאתִי לַיהוָה אֱלֹהֵי יִשְׂרָאֵל וְכָזֹאת וְכָזֹאת עָשִׂיתִי׃
    hebrewPlain: ויען עכן את יהושע ויאמר אמנה אנכי חטאתי ליהוה אלהי ישראל וכזאת וכזאת עשיתי
    kjvRefs:
    - Joshua 7:20
    kjvOsis:
    - Josh.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.21
    scripture: tanakh
    name: Tanakh Joshua 7:21
    ref: Joshua 7:21
    book: Josh
    section: neviim
    chapter: 7
    verse: 21
    ordinal: 5992
    text: When I saw among the spoil a goodly Shinar mantle, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they are hid in the earth in the midst of my tent, and the silver under it.’
    translation: JPS 1917
    original: ואראה [וָאֵרֶא] בַשָּׁלָל אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה וּמָאתַיִם שְׁקָלִים כֶּסֶף וּלְשׁוֹן זָהָב אֶחָד חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ וָאֶחְמְדֵם וָאֶקָּחֵם וְהִנָּם טְמוּנִים בָּאָרֶץ בְּתוֹךְ הָאָהֳלִי וְהַכֶּסֶף תַּחְתֶּיהָ׃
    hebrewPlain: ואראה [וארא] בשלל אדרת שנער אחת טובה ומאתים שקלים כסף ולשון זהב אחד חמשים שקלים משקלו ואחמדם ואקחם והנם טמונים בארץ בתוך האהלי והכסף תחתיה
    kjvRefs:
    - Joshua 7:21
    kjvOsis:
    - Josh.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.22
    scripture: tanakh
    name: Tanakh Joshua 7:22
    ref: Joshua 7:22
    book: Josh
    section: neviim
    chapter: 7
    verse: 22
    ordinal: 5993
    text: So Joshua sent messengers, and they ran unto the tent; and, behold, it was hid in his tent, and the silver under it.
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוֹשֻׁעַ מַלְאָכִים וַיָּרֻצוּ הָאֹהֱלָה וְהִנֵּה טְמוּנָה בְּאָהֳלוֹ וְהַכֶּסֶף תַּחְתֶּיהָ׃
    hebrewPlain: וישלח יהושע מלאכים וירצו האהלה והנה טמונה באהלו והכסף תחתיה
    kjvRefs:
    - Joshua 7:22
    kjvOsis:
    - Josh.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.23
    scripture: tanakh
    name: Tanakh Joshua 7:23
    ref: Joshua 7:23
    book: Josh
    section: neviim
    chapter: 7
    verse: 23
    ordinal: 5994
    text: And they took them from the midst of the tent, and brought them unto Joshua, and unto all the children of Israel; and they laid them down before the LORD.
    translation: JPS 1917
    original: וַיִּקָּחוּם מִתּוֹךְ הָאֹהֶל וַיְבִאוּם אֶל־יְהוֹשֻׁעַ וְאֶל כָּל־בְּנֵי יִשְׂרָאֵל וַיַּצִּקֻם לִפְנֵי יְהוָה׃
    hebrewPlain: ויקחום מתוך האהל ויבאום אל יהושע ואל כל בני ישראל ויצקם לפני יהוה
    kjvRefs:
    - Joshua 7:23
    kjvOsis:
    - Josh.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.24
    scripture: tanakh
    name: Tanakh Joshua 7:24
    ref: Joshua 7:24
    book: Josh
    section: neviim
    chapter: 7
    verse: 24
    ordinal: 5995
    text: And Joshua, and all Israel with him, took Achan the son of Zerah, and the silver, and the mantle, and the wedge of gold, and his sons, and his daughters, and his oxen, and his asses, and his sheep, and his tent, and all that he had; and they brought them up unto the valley of Achor.
    translation: JPS 1917
    original: וַיִּקַּח יְהוֹשֻׁעַ אֶת־עָכָן בֶּן־זֶרַח וְאֶת־הַכֶּסֶף וְאֶת־הָאַדֶּרֶת וְאֶת־לְשׁוֹן הַזָּהָב וְאֶת־בָּנָיו וְאֶת־בְּנֹתָיו וְאֶת־שׁוֹרוֹ וְאֶת־חֲמֹרוֹ וְאֶת־צֹאנוֹ וְאֶת־אָהֳלוֹ וְאֶת־כָּל־אֲשֶׁר־לוֹ וְכָל־יִשְׂרָאֵל עִמּוֹ וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר׃
    hebrewPlain: ויקח יהושע את עכן בן זרח ואת הכסף ואת האדרת ואת לשון הזהב ואת בניו ואת בנתיו ואת שורו ואת חמרו ואת צאנו ואת אהלו ואת כל אשר לו וכל ישראל עמו ויעלו אתם עמק עכור
    kjvRefs:
    - Joshua 7:24
    kjvOsis:
    - Josh.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.25
    scripture: tanakh
    name: Tanakh Joshua 7:25
    ref: Joshua 7:25
    book: Josh
    section: neviim
    chapter: 7
    verse: 25
    ordinal: 5996
    text: 'And Joshua said: ‘Why hast thou troubled us? the LORD shall trouble thee this day.’ And all Israel stoned him with stones; and they burned them with fire, and stoned them with stones.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ מֶה עֲכַרְתָּנוּ יַעְכֳּרְךָ יְהוָה בַּיּוֹם הַזֶּה וַיִּרְגְּמוּ אֹתוֹ כָל־יִשְׂרָאֵל אֶבֶן וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים׃
    hebrewPlain: ויאמר יהושע מה עכרתנו יעכרך יהוה ביום הזה וירגמו אתו כל ישראל אבן וישרפו אתם באש ויסקלו אתם באבנים
    kjvRefs:
    - Joshua 7:25
    kjvOsis:
    - Josh.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.7.26
    scripture: tanakh
    name: Tanakh Joshua 7:26
    ref: Joshua 7:26
    book: Josh
    section: neviim
    chapter: 7
    verse: 26
    ordinal: 5997
    text: And they raised over him a great heap of stones, unto this day; and the LORD turned from the fierceness of His anger. Wherefore the name of that place was called The valley of Achor, unto this day.
    translation: JPS 1917
    original: וַיָּקִימוּ עָלָיו גַּל־אֲבָנִים גָּדוֹל עַד הַיּוֹם הַזֶּה וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ עַל־כֵּן קָרָא שֵׁם הַמָּקוֹם הַהוּא עֵמֶק עָכוֹר עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויקימו עליו גל אבנים גדול עד היום הזה וישב יהוה מחרון אפו על כן קרא שם המקום ההוא עמק עכור עד היום הזה
    kjvRefs:
    - Joshua 7:26
    kjvOsis:
    - Josh.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.7
- type: TanakhVerse
  data:
    osis: Josh.8.1
    scripture: tanakh
    name: Tanakh Joshua 8:1
    ref: Joshua 8:1
    book: Josh
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 5998
    text: 'And the LORD said unto Joshua: ‘Fear not, neither be thou dismayed; take all the people of war with thee, and arise, go up to Ai; see, I have given into thy hand the king of Ai, and his people, and his city, and his land.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ אַל־תִּירָא וְאַל־תֵּחָת קַח עִמְּךָ אֵת כָּל־עַם הַמִּלְחָמָה וְקוּם עֲלֵה הָעָי רְאֵה נָתַתִּי בְיָדְךָ אֶת־מֶלֶךְ הָעַי וְאֶת־עַמּוֹ וְאֶת־עִירוֹ וְאֶת־אַרְצוֹ׃
    hebrewPlain: ויאמר יהוה אל יהושע אל תירא ואל תחת קח עמך את כל עם המלחמה וקום עלה העי ראה נתתי בידך את מלך העי ואת עמו ואת עירו ואת ארצו
    kjvRefs:
    - Joshua 8:1
    kjvOsis:
    - Josh.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.2
    scripture: tanakh
    name: Tanakh Joshua 8:2
    ref: Joshua 8:2
    book: Josh
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 5999
    text: And thou shalt do to Ai and her king as thou didst unto Jericho and her king; only the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves; set thee an ambush for the city behind it.’
    translation: JPS 1917
    original: וְעָשִׂיתָ לָעַי וּלְמַלְכָּהּ כַּאֲשֶׁר עָשִׂיתָ לִירִיחוֹ וּלְמַלְכָּהּ רַק־שְׁלָלָהּ וּבְהֶמְתָּהּ תָּבֹזּוּ לָכֶם שִׂים־לְךָ אֹרֵב לָעִיר מֵאַחֲרֶיהָ׃
    hebrewPlain: ועשית לעי ולמלכה כאשר עשית ליריחו ולמלכה רק שללה ובהמתה תבזו לכם שים לך ארב לעיר מאחריה
    kjvRefs:
    - Joshua 8:2
    kjvOsis:
    - Josh.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.3
    scripture: tanakh
    name: Tanakh Joshua 8:3
    ref: Joshua 8:3
    book: Josh
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 6000
    text: So Joshua arose, and all the people of war, to go up to Ai; and Joshua chose out thirty thousand men, the mighty men of valour, and sent them forth by night.
    translation: JPS 1917
    original: וַיָּקָם יְהוֹשֻׁעַ וְכָל־עַם הַמִּלְחָמָה לַעֲלוֹת הָעָי וַיִּבְחַר יְהוֹשֻׁעַ שְׁלֹשִׁים אֶלֶף אִישׁ גִּבּוֹרֵי הַחַיִל וַיִּשְׁלָחֵם לָיְלָה׃
    hebrewPlain: ויקם יהושע וכל עם המלחמה לעלות העי ויבחר יהושע שלשים אלף איש גבורי החיל וישלחם לילה
    kjvRefs:
    - Joshua 8:3
    kjvOsis:
    - Josh.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.4
    scripture: tanakh
    name: Tanakh Joshua 8:4
    ref: Joshua 8:4
    book: Josh
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 6001
    text: 'And he commanded them, saying: ‘Behold, ye shall lie in ambush against the city, behind the city; go not very far from the city, but be ye all ready.'
    translation: JPS 1917
    original: וַיְצַו אֹתָם לֵאמֹר רְאוּ אַתֶּם אֹרְבִים לָעִיר מֵאַחֲרֵי הָעִיר אַל־תַּרְחִיקוּ מִן־הָעִיר מְאֹד וִהְיִיתֶם כֻּלְּכֶם נְכֹנִים׃
    hebrewPlain: ויצו אתם לאמר ראו אתם ארבים לעיר מאחרי העיר אל תרחיקו מן העיר מאד והייתם כלכם נכנים
    kjvRefs:
    - Joshua 8:4
    kjvOsis:
    - Josh.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.5
    scripture: tanakh
    name: Tanakh Joshua 8:5
    ref: Joshua 8:5
    book: Josh
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 6002
    text: And I, and all the people that are with me, will approach unto the city; and it shall come to pass, when they come out against us, as at the first, that we will flee before them.
    translation: JPS 1917
    original: וַאֲנִי וְכָל־הָעָם אֲשֶׁר אִתִּי נִקְרַב אֶל־הָעִיר וְהָיָה כִּי־יֵצְאוּ לִקְרָאתֵנוּ כַּאֲשֶׁר בָּרִאשֹׁנָה וְנַסְנוּ לִפְנֵיהֶם׃
    hebrewPlain: ואני וכל העם אשר אתי נקרב אל העיר והיה כי יצאו לקראתנו כאשר בראשנה ונסנו לפניהם
    kjvRefs:
    - Joshua 8:5
    kjvOsis:
    - Josh.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.6
    scripture: tanakh
    name: Tanakh Joshua 8:6
    ref: Joshua 8:6
    book: Josh
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 6003
    text: 'And they will come out after us, till we have drawn them away from the city; for they will say: They flee before us, as at the first; so we will flee before them.'
    translation: JPS 1917
    original: וְיָצְאוּ אַחֲרֵינוּ עַד הַתִּיקֵנוּ אוֹתָם מִן־הָעִיר כִּי יֹאמְרוּ נָסִים לְפָנֵינוּ כַּאֲשֶׁר בָּרִאשֹׁנָה וְנַסְנוּ לִפְנֵיהֶם׃
    hebrewPlain: ויצאו אחרינו עד התיקנו אותם מן העיר כי יאמרו נסים לפנינו כאשר בראשנה ונסנו לפניהם
    kjvRefs:
    - Joshua 8:6
    kjvOsis:
    - Josh.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.7
    scripture: tanakh
    name: Tanakh Joshua 8:7
    ref: Joshua 8:7
    book: Josh
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 6004
    text: And ye shall rise up from the ambush, and take possession of the city; for the LORD your God will deliver it into your hand.
    translation: JPS 1917
    original: וְאַתֶּם תָּקֻמוּ מֵהָאוֹרֵב וְהוֹרַשְׁתֶּם אֶת־הָעִיר וּנְתָנָהּ יְהוָה אֱלֹהֵיכֶם בְּיֶדְכֶם׃
    hebrewPlain: ואתם תקמו מהאורב והורשתם את העיר ונתנה יהוה אלהיכם בידכם
    kjvRefs:
    - Joshua 8:7
    kjvOsis:
    - Josh.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.8
    scripture: tanakh
    name: Tanakh Joshua 8:8
    ref: Joshua 8:8
    book: Josh
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 6005
    text: And it shall be, when ye have seized upon the city, that ye shall set the city on fire; according to the word of the LORD shall ye do; see, I have commanded you.’
    translation: JPS 1917
    original: וְהָיָה כְּתָפְשְׂכֶם אֶת־הָעִיר תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ כִּדְבַר יְהוָה תַּעֲשׂוּ רְאוּ צִוִּיתִי אֶתְכֶם׃
    hebrewPlain: והיה כתפשכם את העיר תציתו את העיר באש כדבר יהוה תעשו ראו צויתי אתכם
    kjvRefs:
    - Joshua 8:8
    kjvOsis:
    - Josh.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.9
    scripture: tanakh
    name: Tanakh Joshua 8:9
    ref: Joshua 8:9
    book: Josh
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 6006
    text: And Joshua sent them forth; and they went to the ambushment, and abode between Beth-el and Ai, on the west side of Ai; but Joshua lodged that night among the people.
    translation: JPS 1917
    original: וַיִּשְׁלָחֵם יְהוֹשֻׁעַ וַיֵּלְכוּ אֶל־הַמַּאְרָב וַיֵּשְׁבוּ בֵּין בֵּית־אֵל וּבֵין הָעַי מִיָּם לָעָי וַיָּלֶן יְהוֹשֻׁעַ בַּלַּיְלָה הַהוּא בְּתוֹךְ הָעָם׃
    hebrewPlain: וישלחם יהושע וילכו אל המארב וישבו בין בית אל ובין העי מים לעי וילן יהושע בלילה ההוא בתוך העם
    kjvRefs:
    - Joshua 8:9
    kjvOsis:
    - Josh.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.10
    scripture: tanakh
    name: Tanakh Joshua 8:10
    ref: Joshua 8:10
    book: Josh
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 6007
    text: And Joshua rose up early in the morning, and numbered the people, and went up, he and the elders of Israel, before the people to Ai.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְהוֹשֻׁעַ בַּבֹּקֶר וַיִּפְקֹד אֶת־הָעָם וַיַּעַל הוּא וְזִקְנֵי יִשְׂרָאֵל לִפְנֵי הָעָם הָעָי׃
    hebrewPlain: וישכם יהושע בבקר ויפקד את העם ויעל הוא וזקני ישראל לפני העם העי
    kjvRefs:
    - Joshua 8:10
    kjvOsis:
    - Josh.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.11
    scripture: tanakh
    name: Tanakh Joshua 8:11
    ref: Joshua 8:11
    book: Josh
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 6008
    text: And all the people, even the men of war that were with him, went up, and drew nigh, and came before the city, and pitched on the north side of Ai—now there was a valley between him and Ai.
    translation: JPS 1917
    original: וְכָל־הָעָם הַמִּלְחָמָה אֲשֶׁר אִתּוֹ עָלוּ וַיִּגְּשׁוּ וַיָּבֹאוּ נֶגֶד הָעִיר וַיַּחֲנוּ מִצְּפוֹן לָעַי וְהַגַּי בינו [בֵּינָיו] וּבֵין־הָעָי׃
    hebrewPlain: וכל העם המלחמה אשר אתו עלו ויגשו ויבאו נגד העיר ויחנו מצפון לעי והגי בינו [ביניו] ובין העי
    kjvRefs:
    - Joshua 8:11
    kjvOsis:
    - Josh.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.12
    scripture: tanakh
    name: Tanakh Joshua 8:12
    ref: Joshua 8:12
    book: Josh
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 6009
    text: And he took about five thousand men, and set them in ambush between Beth-el and Ai, on the west side of Ai.
    translation: JPS 1917
    original: וַיִּקַּח כַּחֲמֵשֶׁת אֲלָפִים אִישׁ וַיָּשֶׂם אוֹתָם אֹרֵב בֵּין בֵּית־אֵל וּבֵין הָעַי מִיָּם לָעִיר׃
    hebrewPlain: ויקח כחמשת אלפים איש וישם אותם ארב בין בית אל ובין העי מים לעיר
    kjvRefs:
    - Joshua 8:12
    kjvOsis:
    - Josh.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.13
    scripture: tanakh
    name: Tanakh Joshua 8:13
    ref: Joshua 8:13
    book: Josh
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 6010
    text: So the people set themselves in array, even all the host that was on the north of the city, their rear lying in wait on the west of the city; and Joshua went that night into the midst of the vale.
    translation: JPS 1917
    original: וַיָּשִׂימוּ הָעָם אֶת־כָּל־הַמַּחֲנֶה אֲשֶׁר מִצְּפוֹן לָעִיר וְאֶת־עֲקֵבוֹ מִיָּם לָעִיר וַיֵּלֶךְ יְהוֹשֻׁעַ בַּלַּיְלָה הַהוּא בְּתוֹךְ הָעֵמֶק׃
    hebrewPlain: וישימו העם את כל המחנה אשר מצפון לעיר ואת עקבו מים לעיר וילך יהושע בלילה ההוא בתוך העמק
    kjvRefs:
    - Joshua 8:13
    kjvOsis:
    - Josh.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.14
    scripture: tanakh
    name: Tanakh Joshua 8:14
    ref: Joshua 8:14
    book: Josh
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 6011
    text: And it came to pass, when the king of Ai saw it, that the men of the city hastened and rose up early and went out against Israel to battle, he and all his people, at the time appointed, in front of the Arabah; but he knew not that there was an ambush against him behind the city.
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹת מֶלֶךְ־הָעַי וַיְמַהֲרוּ וַיַּשְׁכִּימוּ וַיֵּצְאוּ אַנְשֵׁי־הָעִיר לִקְרַאת־יִשְׂרָאֵל לַמִּלְחָמָה הוּא וְכָל־עַמּוֹ לַמּוֹעֵד לִפְנֵי הָעֲרָבָה וְהוּא לֹא יָדַע כִּי־אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר׃
    hebrewPlain: ויהי כראות מלך העי וימהרו וישכימו ויצאו אנשי העיר לקראת ישראל למלחמה הוא וכל עמו למועד לפני הערבה והוא לא ידע כי ארב לו מאחרי העיר
    kjvRefs:
    - Joshua 8:14
    kjvOsis:
    - Josh.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.15
    scripture: tanakh
    name: Tanakh Joshua 8:15
    ref: Joshua 8:15
    book: Josh
    section: neviim
    chapter: 8
    verse: 15
    ordinal: 6012
    text: And Joshua and all Israel made as if they were beaten before them, and fled by the way of the wilderness.
    translation: JPS 1917
    original: וַיִּנָּגְעוּ יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל לִפְנֵיהֶם וַיָּנֻסוּ דֶּרֶךְ הַמִּדְבָּר׃
    hebrewPlain: וינגעו יהושע וכל ישראל לפניהם וינסו דרך המדבר
    kjvRefs:
    - Joshua 8:15
    kjvOsis:
    - Josh.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.16
    scripture: tanakh
    name: Tanakh Joshua 8:16
    ref: Joshua 8:16
    book: Josh
    section: neviim
    chapter: 8
    verse: 16
    ordinal: 6013
    text: And all the people that were in Ai were called together to pursue after them; and they pursued after Joshua, and were drawn away from the city.
    translation: JPS 1917
    original: וַיִּזָּעֲקוּ כָּל־הָעָם אֲשֶׁר בעיר [בָּעַי] לִרְדֹּף אַחֲרֵיהֶם וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ וַיִּנָּתְקוּ מִן־הָעִיר׃
    hebrewPlain: ויזעקו כל העם אשר בעיר [בעי] לרדף אחריהם וירדפו אחרי יהושע וינתקו מן העיר
    kjvRefs:
    - Joshua 8:16
    kjvOsis:
    - Josh.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.17
    scripture: tanakh
    name: Tanakh Joshua 8:17
    ref: Joshua 8:17
    book: Josh
    section: neviim
    chapter: 8
    verse: 17
    ordinal: 6014
    text: And there was not a man left in Ai or Beth-el, that went not out after Israel; and they left the city open, and pursued after Israel.
    translation: JPS 1917
    original: וְלֹא־נִשְׁאַר אִישׁ בָּעַי וּבֵית אֵל אֲשֶׁר לֹא־יָצְאוּ אַחֲרֵי יִשְׂרָאֵל וַיַּעַזְבוּ אֶת־הָעִיר פְּתוּחָה וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל׃
    hebrewPlain: ולא נשאר איש בעי ובית אל אשר לא יצאו אחרי ישראל ויעזבו את העיר פתוחה וירדפו אחרי ישראל
    kjvRefs:
    - Joshua 8:17
    kjvOsis:
    - Josh.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.18
    scripture: tanakh
    name: Tanakh Joshua 8:18
    ref: Joshua 8:18
    book: Josh
    section: neviim
    chapter: 8
    verse: 18
    ordinal: 6015
    text: 'And the LORD said unto Joshua: ‘Stretch out the javelin that is in thy hand toward Ai; for I will give it into thy hand.’ And Joshua stretched out the javelin that was in his hand toward the city.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ נְטֵה בַּכִּידוֹן אֲשֶׁר־בְּיָדְךָ אֶל־הָעַי כִּי בְיָדְךָ אֶתְּנֶנָּה וַיֵּט יְהוֹשֻׁעַ בַּכִּידוֹן אֲשֶׁר־בְּיָדוֹ אֶל־הָעִיר׃
    hebrewPlain: ויאמר יהוה אל יהושע נטה בכידון אשר בידך אל העי כי בידך אתננה ויט יהושע בכידון אשר בידו אל העיר
    kjvRefs:
    - Joshua 8:18
    kjvOsis:
    - Josh.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.19
    scripture: tanakh
    name: Tanakh Joshua 8:19
    ref: Joshua 8:19
    book: Josh
    section: neviim
    chapter: 8
    verse: 19
    ordinal: 6016
    text: And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand, and entered into the city, and took it; and they hastened and set the city on fire.
    translation: JPS 1917
    original: וְהָאוֹרֵב קָם מְהֵרָה מִמְּקוֹמוֹ וַיָּרוּצוּ כִּנְטוֹת יָדוֹ וַיָּבֹאוּ הָעִיר וַיִּלְכְּדוּהָ וַיְמַהֲרוּ וַיַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ׃
    hebrewPlain: והאורב קם מהרה ממקומו וירוצו כנטות ידו ויבאו העיר וילכדוה וימהרו ויציתו את העיר באש
    kjvRefs:
    - Joshua 8:19
    kjvOsis:
    - Josh.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.20
    scripture: tanakh
    name: Tanakh Joshua 8:20
    ref: Joshua 8:20
    book: Josh
    section: neviim
    chapter: 8
    verse: 20
    ordinal: 6017
    text: And when the men of Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way; and the people that fled to the wilderness turned back upon the pursuers.
    translation: JPS 1917
    original: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ וְהִנֵּה עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה וְלֹא־הָיָה בָהֶם יָדַיִם לָנוּס הֵנָּה וָהֵנָּה וְהָעָם הַנָּס הַמִּדְבָּר נֶהְפַּךְ אֶל־הָרוֹדֵף׃
    hebrewPlain: ויפנו אנשי העי אחריהם ויראו והנה עלה עשן העיר השמימה ולא היה בהם ידים לנוס הנה והנה והעם הנס המדבר נהפך אל הרודף
    kjvRefs:
    - Joshua 8:20
    kjvOsis:
    - Josh.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.21
    scripture: tanakh
    name: Tanakh Joshua 8:21
    ref: Joshua 8:21
    book: Josh
    section: neviim
    chapter: 8
    verse: 21
    ordinal: 6018
    text: And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned back, and slew the men of Ai.
    translation: JPS 1917
    original: וִיהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל רָאוּ כִּי־לָכַד הָאֹרֵב אֶת־הָעִיר וְכִי עָלָה עֲשַׁן הָעִיר וַיָּשֻׁבוּ וַיַּכּוּ אֶת־אַנְשֵׁי הָעָי׃
    hebrewPlain: ויהושע וכל ישראל ראו כי לכד הארב את העיר וכי עלה עשן העיר וישבו ויכו את אנשי העי
    kjvRefs:
    - Joshua 8:21
    kjvOsis:
    - Josh.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.22
    scripture: tanakh
    name: Tanakh Joshua 8:22
    ref: Joshua 8:22
    book: Josh
    section: neviim
    chapter: 8
    verse: 22
    ordinal: 6019
    text: And the other came forth out of the city against them; so they were in the midst of Israel, some on this side, and some on that side; and they smote them, so that they let none of them remain or escape.
    translation: JPS 1917
    original: וְאֵלֶּה יָצְאוּ מִן־הָעִיר לִקְרָאתָם וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה וַיַּכּוּ אוֹתָם עַד־בִּלְתִּי הִשְׁאִיר־לוֹ שָׂרִיד וּפָלִיט׃
    hebrewPlain: ואלה יצאו מן העיר לקראתם ויהיו לישראל בתוך אלה מזה ואלה מזה ויכו אותם עד בלתי השאיר לו שריד ופליט
    kjvRefs:
    - Joshua 8:22
    kjvOsis:
    - Josh.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.23
    scripture: tanakh
    name: Tanakh Joshua 8:23
    ref: Joshua 8:23
    book: Josh
    section: neviim
    chapter: 8
    verse: 23
    ordinal: 6020
    text: And the king of Ai they took alive, and brought him to Joshua.
    translation: JPS 1917
    original: וְאֶת־מֶלֶךְ הָעַי תָּפְשׂוּ חָי וַיַּקְרִבוּ אֹתוֹ אֶל־יְהוֹשֻׁעַ׃
    hebrewPlain: ואת מלך העי תפשו חי ויקרבו אתו אל יהושע
    kjvRefs:
    - Joshua 8:23
    kjvOsis:
    - Josh.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.24
    scripture: tanakh
    name: Tanakh Joshua 8:24
    ref: Joshua 8:24
    book: Josh
    section: neviim
    chapter: 8
    verse: 24
    ordinal: 6021
    text: And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, even in the wilderness wherein they pursued them, and they were all fallen by the edge of the sword, until they were consumed, that all Israel returned unto Ai, and smote it with the edge of the sword.
    translation: JPS 1917
    original: וַיְהִי כְּכַלּוֹת יִשְׂרָאֵל לַהֲרֹג אֶת־כָּל־יֹשְׁבֵי הָעַי בַּשָּׂדֶה בַּמִּדְבָּר אֲשֶׁר רְדָפוּם בּוֹ וַיִּפְּלוּ כֻלָּם לְפִי־חֶרֶב עַד־תֻּמָּם וַיָּשֻׁבוּ כָל־יִשְׂרָאֵל הָעַי וַיַּכּוּ אֹתָהּ לְפִי־חָרֶב׃
    hebrewPlain: ויהי ככלות ישראל להרג את כל ישבי העי בשדה במדבר אשר רדפום בו ויפלו כלם לפי חרב עד תמם וישבו כל ישראל העי ויכו אתה לפי חרב
    kjvRefs:
    - Joshua 8:24
    kjvOsis:
    - Josh.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.25
    scripture: tanakh
    name: Tanakh Joshua 8:25
    ref: Joshua 8:25
    book: Josh
    section: neviim
    chapter: 8
    verse: 25
    ordinal: 6022
    text: And all that fell that day, both of men and women, were twelve thousand, even all the men of Ai.
    translation: JPS 1917
    original: וַיְהִי כָל־הַנֹּפְלִים בַּיּוֹם הַהוּא מֵאִישׁ וְעַד־אִשָּׁה שְׁנֵים עָשָׂר אָלֶף כֹּל אַנְשֵׁי הָעָי׃
    hebrewPlain: ויהי כל הנפלים ביום ההוא מאיש ועד אשה שנים עשר אלף כל אנשי העי
    kjvRefs:
    - Joshua 8:25
    kjvOsis:
    - Josh.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.26
    scripture: tanakh
    name: Tanakh Joshua 8:26
    ref: Joshua 8:26
    book: Josh
    section: neviim
    chapter: 8
    verse: 26
    ordinal: 6023
    text: For Joshua drew not back his hand, wherewith he stretched out the javelin, until he had utterly destroyed all the inhabitants of Ai.
    translation: JPS 1917
    original: וִיהוֹשֻׁעַ לֹא־הֵשִׁיב יָדוֹ אֲשֶׁר נָטָה בַּכִּידוֹן עַד אֲשֶׁר הֶחֱרִים אֵת כָּל־יֹשְׁבֵי הָעָי׃
    hebrewPlain: ויהושע לא השיב ידו אשר נטה בכידון עד אשר החרים את כל ישבי העי
    kjvRefs:
    - Joshua 8:26
    kjvOsis:
    - Josh.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.27
    scripture: tanakh
    name: Tanakh Joshua 8:27
    ref: Joshua 8:27
    book: Josh
    section: neviim
    chapter: 8
    verse: 27
    ordinal: 6024
    text: Only the cattle and the spoil of that city Israel took for a prey unto themselves, according unto the word of the LORD which He commanded Joshua.
    translation: JPS 1917
    original: רַק הַבְּהֵמָה וּשְׁלַל הָעִיר הַהִיא בָּזְזוּ לָהֶם יִשְׂרָאֵל כִּדְבַר יְהוָה אֲשֶׁר צִוָּה אֶת־יְהוֹשֻׁעַ׃
    hebrewPlain: רק הבהמה ושלל העיר ההיא בזזו להם ישראל כדבר יהוה אשר צוה את יהושע
    kjvRefs:
    - Joshua 8:27
    kjvOsis:
    - Josh.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.28
    scripture: tanakh
    name: Tanakh Joshua 8:28
    ref: Joshua 8:28
    book: Josh
    section: neviim
    chapter: 8
    verse: 28
    ordinal: 6025
    text: So Joshua burnt Ai, and made it a heap for ever, even a desolation, unto this day.
    translation: JPS 1917
    original: וַיִּשְׂרֹף יְהוֹשֻׁעַ אֶת־הָעָי וַיְשִׂימֶהָ תֵּל־עוֹלָם שְׁמָמָה עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: וישרף יהושע את העי וישימה תל עולם שממה עד היום הזה
    kjvRefs:
    - Joshua 8:28
    kjvOsis:
    - Josh.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.29
    scripture: tanakh
    name: Tanakh Joshua 8:29
    ref: Joshua 8:29
    book: Josh
    section: neviim
    chapter: 8
    verse: 29
    ordinal: 6026
    text: And the king of Ai he hanged on a tree until the eventide; and at the going down of the sun Joshua commanded, and they took his carcass down from the tree, and cast it at the entrance of the gate of the city, and raised thereon a great heap of stones, unto this day.
    translation: JPS 1917
    original: וְאֶת־מֶלֶךְ הָעַי תָּלָה עַל־הָעֵץ עַד־עֵת הָעָרֶב וּכְבוֹא הַשֶּׁמֶשׁ צִוָּה יְהוֹשֻׁעַ וַיֹּרִידוּ אֶת־נִבְלָתוֹ מִן־הָעֵץ וַיַּשְׁלִיכוּ אוֹתָהּ אֶל־פֶּתַח שַׁעַר הָעִיר וַיָּקִימוּ עָלָיו גַּל־אֲבָנִים גָּדוֹל עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ואת מלך העי תלה על העץ עד עת הערב וכבוא השמש צוה יהושע וירידו את נבלתו מן העץ וישליכו אותה אל פתח שער העיר ויקימו עליו גל אבנים גדול עד היום הזה
    kjvRefs:
    - Joshua 8:29
    kjvOsis:
    - Josh.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
