    original: וְאֵלֶּה מַלְכֵי הָאָרֶץ אֲשֶׁר הִכּוּ בְנֵי־יִשְׂרָאֵל וַיִּרְשׁוּ אֶת־אַרְצָם בְּעֵבֶר הַיַּרְדֵּן מִזְרְחָה הַשָּׁמֶשׁ מִנַּחַל אַרְנוֹן עַד־הַר חֶרְמוֹן וְכָל־הָעֲרָבָה מִזְרָחָה׃
    hebrewPlain: ואלה מלכי הארץ אשר הכו בני ישראל וירשו את ארצם בעבר הירדן מזרחה השמש מנחל ארנון עד הר חרמון וכל הערבה מזרחה
    kjvRefs:
