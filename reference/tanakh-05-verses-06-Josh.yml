    verse: 4
    ordinal: 5850
    text: From the wilderness, and this Lebanon, even unto the great river, the river Euphrates, all the land of the Hittites, and unto the Great Sea toward the going down of the sun, shall be your border.
    translation: JPS 1917
    original: מֵהַמִּדְבָּר וְהַלְּבָנוֹן הַזֶּה וְעַד־הַנָּהָר הַגָּדוֹל נְהַר־פְּרָת כֹּל אֶרֶץ הַחִתִּים וְעַד־הַיָּם הַגָּדוֹל מְבוֹא הַשָּׁמֶשׁ יִהְיֶה גְּבוּלְכֶם׃
    hebrewPlain: מהמדבר והלבנון הזה ועד הנהר הגדול נהר פרת כל ארץ החתים ועד הים הגדול מבוא השמש יהיה גבולכם
    kjvRefs:
