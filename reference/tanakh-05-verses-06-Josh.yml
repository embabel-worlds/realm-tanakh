- type: TanakhVerse
  data:
    osis: Josh.1.11
    scripture: tanakh
    name: Tanakh Joshua 1:11
    ref: Joshua 1:11
    book: Josh
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 5857
    text: '’Pass through the midst of the camp, and command the people, saying: Prepare you victuals; for within three days ye are to pass over this Jordan, to go in to possess the land, which the LORD your God giveth you to possess it.’'
    translation: JPS 1917
    original: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה וְצַוּוּ אֶת־הָעָם לֵאמֹר הָכִינוּ לָכֶם צֵידָה כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן הַזֶּה לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ אֲשֶׁר יְהוָה אֱלֹהֵיכֶם נֹתֵן לָכֶם לְרִשְׁתָּהּ׃
    hebrewPlain: עברו בקרב המחנה וצוו את העם לאמר הכינו לכם צידה כי בעוד שלשת ימים אתם עברים את הירדן הזה לבוא לרשת את הארץ אשר יהוה אלהיכם נתן לכם לרשתה
