    ref: Joshua 8:30
    book: Josh
    section: neviim
    chapter: 8
    verse: 30
    ordinal: 6027
    text: Then Joshua built an altar unto the LORD, the God of Israel, in mount Ebal,
    translation: JPS 1917
    original: אָז יִבְנֶה יְהוֹשֻׁעַ מִזְבֵּחַ לַיהוָה אֱלֹהֵי יִשְׂרָאֵל בְּהַר עֵיבָל׃
    hebrewPlain: אז יבנה יהושע מזבח ליהוה אלהי ישראל בהר עיבל
    kjvRefs:
    - Joshua 8:30
    kjvOsis:
    - Josh.8.30
