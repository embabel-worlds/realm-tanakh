    name: Tanakh Joshua 1:7
    ref: Joshua 1:7
    book: Josh
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 5853
    text: Only be strong and very courageous, to observe to do according to all the law, which Moses My servant commanded thee; turn not from it to the right hand or to the left, that thou mayest have good success whithersoever thou goest.
    translation: JPS 1917
    original: רַק חֲזַק וֶאֱמַץ מְאֹד לִשְׁמֹר לַעֲשׂוֹת כְּכָל־הַתּוֹרָה אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי אַל־תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול לְמַעַן תַּשְׂכִּיל בְּכֹל אֲשֶׁר תֵּלֵךְ׃
    hebrewPlain: רק חזק ואמץ מאד לשמר לעשות ככל התורה אשר צוך משה עבדי אל תסור ממנו ימין ושמאול למען תשכיל בכל אשר תלך
    kjvRefs:
