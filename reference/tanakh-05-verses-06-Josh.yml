    section: neviim
    chapter: 15
    verse: 63
    ordinal: 6260
    text: And as for the Jebusites, the inhabitants of Jerusalem, the children of Judah could not drive them out; but the Jebusites dwelt with the children of Judah at Jerusalem, unto this day.
    translation: JPS 1917
    original: וְאֶת־הַיְבוּסִי יוֹשְׁבֵי יְרוּשָׁלִַם לֹא־יוכלו [יָכְלוּ] בְנֵי־יְהוּדָה לְהוֹרִישָׁם וַיֵּשֶׁב הַיְבוּסִי אֶת־בְּנֵי יְהוּדָה בִּירוּשָׁלִַם עַד הַיּוֹם הַזֶּה׃
