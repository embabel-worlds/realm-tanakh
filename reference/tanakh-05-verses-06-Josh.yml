    chapter: 1
    verse: 10
    ordinal: 5856
    text: 'Then Joshua commanded the officers of the people, saying:'
    translation: JPS 1917
    original: וַיְצַו יְהוֹשֻׁעַ אֶת־שֹׁטְרֵי הָעָם לֵאמֹר׃
    hebrewPlain: ויצו יהושע את שטרי העם לאמר
