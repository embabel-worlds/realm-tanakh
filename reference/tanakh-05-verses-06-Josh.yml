    text: according to the commandment of the LORD they gave him the city which he asked, even Timnath-serah in the hill-country of Ephraim; and he built the city, and dwelt therein.
    translation: JPS 1917
    original: עַל־פִּי יְהוָה נָתְנוּ לוֹ אֶת־הָעִיר אֲשֶׁר שָׁאָל אֶת־תִּמְנַת־סֶרַח בְּהַר אֶפְרָיִם וַיִּבְנֶה אֶת־הָעִיר וַיֵּשֶׁב בָּהּ׃
    hebrewPlain: על פי יהוה נתנו לו את העיר אשר שאל את תמנת סרח בהר אפרים ויבנה את העיר וישב בה
    kjvRefs:
    - Joshua 19:50
    kjvOsis:
    - Josh.19.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.19
- type: TanakhVerse
  data:
    osis: Josh.19.51
    scripture: tanakh
    name: Tanakh Joshua 19:51
    ref: Joshua 19:51
    book: Josh
    section: neviim
    chapter: 19
    verse: 51
    ordinal: 6367
    text: These are the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers’ houses of the tribes of the children of Israel, distributed for inheritance by lot in Shiloh before the LORD, at the door of the tent of meeting. So they made an end of dividing the land.
    translation: JPS 1917
    original: אֵלֶּה הַנְּחָלֹת אֲשֶׁר נִחֲלוּ אֶלְעָזָר הַכֹּהֵן וִיהוֹשֻׁעַ בִּן־נוּן וְרָאשֵׁי הָאָבוֹת לְמַטּוֹת בְּנֵי־יִשְׂרָאֵל בְּגוֹרָל בְּשִׁלֹה לִפְנֵי יְהוָה פֶּתַח אֹהֶל מוֹעֵד וַיְכַלּוּ מֵחַלֵּק אֶת־הָאָרֶץ׃
    hebrewPlain: אלה הנחלת אשר נחלו אלעזר הכהן ויהושע בן נון וראשי האבות למטות בני ישראל בגורל בשלה לפני יהוה פתח אהל מועד ויכלו מחלק את הארץ
    kjvRefs:
    - Joshua 19:51
    kjvOsis:
    - Josh.19.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.19
- type: TanakhVerse
  data:
    osis: Josh.20.1
    scripture: tanakh
    name: Tanakh Joshua 20:1
    ref: Joshua 20:1
    book: Josh
    section: neviim
    chapter: 20
    verse: 1
    ordinal: 6368
    text: 'And the LORD spoke unto Joshua, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־יְהוֹשֻׁעַ לֵאמֹר׃
    hebrewPlain: וידבר יהוה אל יהושע לאמר
    kjvRefs:
    - Joshua 20:1
    kjvOsis:
    - Josh.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.2
    scripture: tanakh
    name: Tanakh Joshua 20:2
    ref: Joshua 20:2
    book: Josh
    section: neviim
    chapter: 20
    verse: 2
    ordinal: 6369
    text: '’Speak to the children of Israel, saying: Assign you the cities of refuge, whereof I spoke unto you by the hand of Moses;'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר תְּנוּ לָכֶם אֶת־עָרֵי הַמִּקְלָט אֲשֶׁר־דִּבַּרְתִּי אֲלֵיכֶם בְּיַד־מֹשֶׁה׃
    hebrewPlain: דבר אל בני ישראל לאמר תנו לכם את ערי המקלט אשר דברתי אליכם ביד משה
    kjvRefs:
    - Joshua 20:2
    kjvOsis:
    - Josh.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.3
    scripture: tanakh
    name: Tanakh Joshua 20:3
    ref: Joshua 20:3
    book: Josh
    section: neviim
    chapter: 20
    verse: 3
    ordinal: 6370
    text: that the manslayer that killeth any person through error and unawares may flee thither; and they shall be unto you for a refuge from the avenger of blood.
    translation: JPS 1917
    original: לָנוּס שָׁמָּה רוֹצֵחַ מַכֵּה־נֶפֶשׁ בִּשְׁגָגָה בִּבְלִי־דָעַת וְהָיוּ לָכֶם לְמִקְלָט מִגֹּאֵל הַדָּם׃
    hebrewPlain: לנוס שמה רוצח מכה נפש בשגגה בבלי דעת והיו לכם למקלט מגאל הדם
    kjvRefs:
    - Joshua 20:3
    kjvOsis:
    - Josh.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.4
    scripture: tanakh
    name: Tanakh Joshua 20:4
    ref: Joshua 20:4
    book: Josh
    section: neviim
    chapter: 20
    verse: 4
    ordinal: 6371
    text: And he shall flee unto one of those cities, and shall stand at the entrance of the gate of the city, and declare his cause in the ears of the elders of that city; and they shall take him into the city unto them, and give him a place, that he may dwell among them.
    translation: JPS 1917
    original: וְנָס אֶל־אַחַת מֵהֶעָרִים הָאֵלֶּה וְעָמַד פֶּתַח שַׁעַר הָעִיר וְדִבֶּר בְּאָזְנֵי זִקְנֵי־הָעִיר הַהִיא אֶת־דְּבָרָיו וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם וְנָתְנוּ־לוֹ מָקוֹם וְיָשַׁב עִמָּם׃
    hebrewPlain: ונס אל אחת מהערים האלה ועמד פתח שער העיר ודבר באזני זקני העיר ההיא את דבריו ואספו אתו העירה אליהם ונתנו לו מקום וישב עמם
    kjvRefs:
    - Joshua 20:4
    kjvOsis:
    - Josh.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.5
    scripture: tanakh
    name: Tanakh Joshua 20:5
    ref: Joshua 20:5
    book: Josh
    section: neviim
    chapter: 20
    verse: 5
    ordinal: 6372
    text: And if the avenger of blood pursue after him, then they shall not deliver up the manslayer into his hand; because he smote his neighbour unawares, and hated him not beforetime.
    translation: JPS 1917
    original: וְכִי יִרְדֹּף גֹּאֵל הַדָּם אַחֲרָיו וְלֹא־יַסְגִּרוּ אֶת־הָרֹצֵחַ בְּיָדוֹ כִּי בִבְלִי־דַעַת הִכָּה אֶת־רֵעֵהוּ וְלֹא־שֹׂנֵא הוּא לוֹ מִתְּמוֹל שִׁלְשׁוֹם׃
    hebrewPlain: וכי ירדף גאל הדם אחריו ולא יסגרו את הרצח בידו כי בבלי דעת הכה את רעהו ולא שנא הוא לו מתמול שלשום
    kjvRefs:
    - Joshua 20:5
    kjvOsis:
    - Josh.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.6
    scripture: tanakh
    name: Tanakh Joshua 20:6
    ref: Joshua 20:6
    book: Josh
    section: neviim
    chapter: 20
    verse: 6
    ordinal: 6373
    text: And he shall dwell in that city, until he stand before the congregation for judgment, until the death of the high priest that shall be in those days; then may the manslayer return, and come unto his own city, and unto his own house, unto the city from whence he fled.’
    translation: JPS 1917
    original: וְיָשַׁב בָּעִיר הַהִיא עַד־עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט עַד־מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם אָז יָשׁוּב הָרוֹצֵחַ וּבָא אֶל־עִירוֹ וְאֶל־בֵּיתוֹ אֶל־הָעִיר אֲשֶׁר־נָס מִשָּׁם׃
    hebrewPlain: וישב בעיר ההיא עד עמדו לפני העדה למשפט עד מות הכהן הגדול אשר יהיה בימים ההם אז ישוב הרוצח ובא אל עירו ואל ביתו אל העיר אשר נס משם
    kjvRefs:
    - Joshua 20:6
    kjvOsis:
    - Josh.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.7
    scripture: tanakh
    name: Tanakh Joshua 20:7
    ref: Joshua 20:7
    book: Josh
    section: neviim
    chapter: 20
    verse: 7
    ordinal: 6374
    text: And they set apart Kedesh in Galilee in the hill-country of Naphtali, and Shechem in the hill-country of Ephraim, and Kiriath-arba—the same is Hebron—in the hill-country of Judah.
    translation: JPS 1917
    original: וַיַּקְדִּשׁוּ אֶת־קֶדֶשׁ בַּגָּלִיל בְּהַר נַפְתָּלִי וְאֶת־שְׁכֶם בְּהַר אֶפְרָיִם וְאֶת־קִרְיַת אַרְבַּע הִיא חֶבְרוֹן בְּהַר יְהוּדָה׃
    hebrewPlain: ויקדשו את קדש בגליל בהר נפתלי ואת שכם בהר אפרים ואת קרית ארבע היא חברון בהר יהודה
    kjvRefs:
    - Joshua 20:7
    kjvOsis:
    - Josh.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.8
    scripture: tanakh
    name: Tanakh Joshua 20:8
    ref: Joshua 20:8
    book: Josh
    section: neviim
    chapter: 20
    verse: 8
    ordinal: 6375
    text: And beyond the Jordan at Jericho eastward, they assigned Bezer in the wilderness in the table-land out of the tribe of Reuben, and Ramoth in Gilead out of the tribe of Gad, and Golan in Bashan out of the tribe of Manasseh.
    translation: JPS 1917
    original: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה נָתְנוּ אֶת־בֶּצֶר בַּמִּדְבָּר בַּמִּישֹׁר מִמַּטֵּה רְאוּבֵן וְאֶת־רָאמֹת בַּגִּלְעָד מִמַּטֵּה־גָד וְאֶת־גלון [גּוֹלָן] בַּבָּשָׁן מִמַּטֵּה מְנַשֶּׁה׃
    hebrewPlain: ומעבר לירדן יריחו מזרחה נתנו את בצר במדבר במישר ממטה ראובן ואת ראמת בגלעד ממטה גד ואת גלון [גולן] בבשן ממטה מנשה
    kjvRefs:
    - Joshua 20:8
    kjvOsis:
    - Josh.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.20.9
    scripture: tanakh
    name: Tanakh Joshua 20:9
    ref: Joshua 20:9
    book: Josh
    section: neviim
    chapter: 20
    verse: 9
    ordinal: 6376
    text: These were the appointed cities for all the children of Israel, and for the stranger that sojourneth among them, that whosoever killeth any person through error might flee thither, and not die by the hand of the avenger of blood, until he stood before the congregation.
    translation: JPS 1917
    original: אֵלֶּה הָיוּ עָרֵי הַמּוּעָדָה לְכֹל בְּנֵי יִשְׂרָאֵל וְלַגֵּר הַגָּר בְּתוֹכָם לָנוּס שָׁמָּה כָּל־מַכֵּה־נֶפֶשׁ בִּשְׁגָגָה וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם עַד־עָמְדוֹ לִפְנֵי הָעֵדָה׃
    hebrewPlain: אלה היו ערי המועדה לכל בני ישראל ולגר הגר בתוכם לנוס שמה כל מכה נפש בשגגה ולא ימות ביד גאל הדם עד עמדו לפני העדה
    kjvRefs:
    - Joshua 20:9
    kjvOsis:
    - Josh.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.20
- type: TanakhVerse
  data:
    osis: Josh.21.1
    scripture: tanakh
    name: Tanakh Joshua 21:1
    ref: Joshua 21:1
    book: Josh
    section: neviim
    chapter: 21
    verse: 1
    ordinal: 6377
    text: Then came near the heads of fathers’ houses of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of fathers’ houses of the tribes of the children of Israel;
    translation: JPS 1917
    original: וַיִּגְּשׁוּ רָאשֵׁי אֲבוֹת הַלְוִיִּם אֶל־אֶלְעָזָר הַכֹּהֵן וְאֶל־יְהוֹשֻׁעַ בִּן־נוּן וְאֶל־רָאשֵׁי אֲבוֹת הַמַּטּוֹת לִבְנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויגשו ראשי אבות הלוים אל אלעזר הכהן ואל יהושע בן נון ואל ראשי אבות המטות לבני ישראל
    kjvRefs:
    - Joshua 21:1
    kjvOsis:
    - Josh.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.21.2
    scripture: tanakh
    name: Tanakh Joshua 21:2
    ref: Joshua 21:2
    book: Josh
    section: neviim
    chapter: 21
    verse: 2
    ordinal: 6378
    text: 'and they spoke unto them at Shiloh in the land of Canaan, saying: ‘The LORD commanded by the hand of Moses to give us cities to dwell in, with the open land thereabout for our cattle.’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ אֲלֵיהֶם בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן לֵאמֹר יְהוָה צִוָּה בְיַד־מֹשֶׁה לָתֶת־לָנוּ עָרִים לָשָׁבֶת וּמִגְרְשֵׁיהֶן לִבְהֶמְתֵּנוּ׃
    hebrewPlain: וידברו אליהם בשלה בארץ כנען לאמר יהוה צוה ביד משה לתת לנו ערים לשבת ומגרשיהן לבהמתנו
    kjvRefs:
    - Joshua 21:2
    kjvOsis:
    - Josh.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.21.3
    scripture: tanakh
    name: Tanakh Joshua 21:3
    ref: Joshua 21:3
    book: Josh
    section: neviim
    chapter: 21
    verse: 3
    ordinal: 6379
    text: And the children of Israel gave unto the Levites out of their inheritance, according to the commandment of the LORD, these cities with the open land about them.
    translation: JPS 1917
    original: וַיִּתְּנוּ בְנֵי־יִשְׂרָאֵל לַלְוִיִּם מִנַּחֲלָתָם אֶל־פִּי יְהוָה אֶת־הֶעָרִים הָאֵלֶּה וְאֶת־מִגְרְשֵׁיהֶן׃
    hebrewPlain: ויתנו בני ישראל ללוים מנחלתם אל פי יהוה את הערים האלה ואת מגרשיהן
    kjvRefs:
    - Joshua 21:3
    kjvOsis:
    - Josh.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.21.4
    scripture: tanakh
    name: Tanakh Joshua 21:4
    ref: Joshua 21:4
    book: Josh
    section: neviim
    chapter: 21
    verse: 4
    ordinal: 6380
    text: And the lot came out for the families of the Kohathites; and the children of Aaron the priest, who were of the Levites, had by lot out of the tribe of Judah, and out of the tribe of the Simeonites, and out of the tribe of Benjamin, thirteen cities.
    translation: JPS 1917
    original: וַיֵּצֵא הַגּוֹרָל לְמִשְׁפְּחֹת הַקְּהָתִי וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן מִן־הַלְוִיִּם מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן בַּגּוֹרָל עָרִים שְׁלֹשׁ עֶשְׂרֵה׃
    hebrewPlain: ויצא הגורל למשפחת הקהתי ויהי לבני אהרן הכהן מן הלוים ממטה יהודה וממטה השמעני וממטה בנימן בגורל ערים שלש עשרה
    kjvRefs:
    - Joshua 21:4
    kjvOsis:
    - Josh.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.21.5
    scripture: tanakh
    name: Tanakh Joshua 21:5
    ref: Joshua 21:5
    book: Josh
    section: neviim
    chapter: 21
    verse: 5
    ordinal: 6381
    text: And the rest of the children of Kohath had by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half-tribe of Manasseh, ten cities.
    translation: JPS 1917
    original: וְלִבְנֵי קְהָת הַנּוֹתָרִים מִמִּשְׁפְּחֹת מַטֵּה־אֶפְרַיִם וּמִמַּטֵּה־דָן וּמֵחֲצִי מַטֵּה מְנַשֶּׁה בַּגּוֹרָל עָרִים עָשֶׂר׃
    hebrewPlain: ולבני קהת הנותרים ממשפחת מטה אפרים וממטה דן ומחצי מטה מנשה בגורל ערים עשר
    kjvRefs:
    - Joshua 21:5
    kjvOsis:
    - Josh.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.21
- type: TanakhVerse
  data:
    osis: Josh.21.6
    scripture: tanakh
    name: Tanakh Joshua 21:6
    ref: Joshua 21:6
    book: Josh
    section: neviim
    chapter: 21
    verse: 6
    ordinal: 6382
    text: And the children of Gershon had by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half-tribe of Manasseh in Bashan, thirteen cities.
