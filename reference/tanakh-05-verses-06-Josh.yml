- type: TanakhVerse
  data:
    osis: Josh.1.8
    scripture: tanakh
    name: Tanakh Joshua 1:8
    ref: Joshua 1:8
    book: Josh
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 5854
    text: This book of the law shall not depart out of thy mouth, but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein; for then thou shalt make thy ways prosperous, and then thou shalt have good success.
    translation: JPS 1917
    original: לֹא־יָמוּשׁ סֵפֶר הַתּוֹרָה הַזֶּה מִפִּיךָ וְהָגִיתָ בּוֹ יוֹמָם וָלַיְלָה לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת כְּכָל־הַכָּתוּב בּוֹ כִּי־אָז תַּצְלִיחַ אֶת־דְּרָכֶךָ וְאָז תַּשְׂכִּיל׃
    hebrewPlain: לא ימוש ספר התורה הזה מפיך והגית בו יומם ולילה למען תשמר לעשות ככל הכתוב בו כי אז תצליח את דרכך ואז תשכיל
    kjvRefs:
    - Joshua 1:8
    kjvOsis:
    - Josh.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.1.9
    scripture: tanakh
    name: Tanakh Joshua 1:9
    ref: Joshua 1:9
    book: Josh
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 5855
    text: 'Have not I commanded thee? Be strong and of good courage; be not affrighted, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.’'
    translation: JPS 1917
    original: הֲלוֹא צִוִּיתִיךָ חֲזַק וֶאֱמָץ אַל־תַּעֲרֹץ וְאַל־תֵּחָת כִּי עִמְּךָ יְהוָה אֱלֹהֶיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ׃
    hebrewPlain: הלוא צויתיך חזק ואמץ אל תערץ ואל תחת כי עמך יהוה אלהיך בכל אשר תלך
    kjvRefs:
    - Joshua 1:9
