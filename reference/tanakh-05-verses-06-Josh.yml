    translation: JPS 1917
    original: וְהֶעָרִים הַמִּבְדָּלוֹת לִבְנֵי אֶפְרַיִם בְּתוֹךְ נַחֲלַת בְּנֵי־מְנַשֶּׁה כָּל־הֶעָרִים וְחַצְרֵיהֶן׃
    hebrewPlain: והערים המבדלות לבני אפרים בתוך נחלת בני מנשה כל הערים וחצריהן
    kjvRefs:
    - Joshua 16:9
    kjvOsis:
    - Josh.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.16
- type: TanakhVerse
  data:
    osis: Josh.16.10
    scripture: tanakh
    name: Tanakh Joshua 16:10
    ref: Joshua 16:10
    book: Josh
    section: neviim
    chapter: 16
    verse: 10
    ordinal: 6270
    text: And they drove not out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in the midst of Ephraim, unto this day, and became servants to do taskwork.
    translation: JPS 1917
    original: וְלֹא הוֹרִישׁוּ אֶת־הַכְּנַעֲנִי הַיּוֹשֵׁב בְּגָזֶר וַיֵּשֶׁב הַכְּנַעֲנִי בְּקֶרֶב אֶפְרַיִם עַד־הַיּוֹם הַזֶּה וַיְהִי לְמַס־עֹבֵד׃
    hebrewPlain: ולא הורישו את הכנעני היושב בגזר וישב הכנעני בקרב אפרים עד היום הזה ויהי למס עבד
    kjvRefs:
    - Joshua 16:10
    kjvOsis:
    - Josh.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.16
- type: TanakhVerse
  data:
    osis: Josh.17.1
    scripture: tanakh
    name: Tanakh Joshua 17:1
    ref: Joshua 17:1
    book: Josh
    section: neviim
    chapter: 17
    verse: 1
    ordinal: 6271
    text: And this was the lot for the tribe of Manasseh; for he was the first-born of Joseph. As for Machir the first-born of Manasseh, the father of Gilead, because he was a man of war, therefore he had Gilead and Bashan.
    translation: JPS 1917
    original: וַיְהִי הַגּוֹרָל לְמַטֵּה מְנַשֶּׁה כִּי־הוּא בְּכוֹר יוֹסֵף לְמָכִיר בְּכוֹר מְנַשֶּׁה אֲבִי הַגִּלְעָד כִּי הוּא הָיָה אִישׁ מִלְחָמָה וַיְהִי־לוֹ הַגִּלְעָד וְהַבָּשָׁן׃
    hebrewPlain: ויהי הגורל למטה מנשה כי הוא בכור יוסף למכיר בכור מנשה אבי הגלעד כי הוא היה איש מלחמה ויהי לו הגלעד והבשן
    kjvRefs:
    - Joshua 17:1
    kjvOsis:
    - Josh.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.2
    scripture: tanakh
    name: Tanakh Joshua 17:2
    ref: Joshua 17:2
    book: Josh
    section: neviim
    chapter: 17
    verse: 2
    ordinal: 6272
    text: And the lot was for the rest of the children of Manasseh according to their families; for the children of Abiezer, and for the children of Helek, and for the children of Asriel, and for the children of Shechem, and for the children of Hepher, and for the children of Shemida; these were the male children of Manasseh the son of Joseph according to their families.
    translation: JPS 1917
    original: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים לְמִשְׁפְּחֹתָם לִבְנֵי אֲבִיעֶזֶר וְלִבְנֵי־חֵלֶק וְלִבְנֵי אַשְׂרִיאֵל וְלִבְנֵי־שֶׁכֶם וְלִבְנֵי־חֵפֶר וְלִבְנֵי שְׁמִידָע אֵלֶּה בְּנֵי מְנַשֶּׁה בֶּן־יוֹסֵף הַזְּכָרִים לְמִשְׁפְּחֹתָם׃
    hebrewPlain: ויהי לבני מנשה הנותרים למשפחתם לבני אביעזר ולבני חלק ולבני אשריאל ולבני שכם ולבני חפר ולבני שמידע אלה בני מנשה בן יוסף הזכרים למשפחתם
    kjvRefs:
    - Joshua 17:2
    kjvOsis:
    - Josh.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.3
    scripture: tanakh
    name: Tanakh Joshua 17:3
    ref: Joshua 17:3
    book: Josh
    section: neviim
    chapter: 17
    verse: 3
    ordinal: 6273
    text: 'But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters; and these are the names of his daughters: Mahlah, and Noah, Hoglah, Milcah, and Tirzah.'
    translation: JPS 1917
    original: וְלִצְלָפְחָד בֶּן־חֵפֶר בֶּן־גִּלְעָד בֶּן־מָכִיר בֶּן־מְנַשֶּׁה לֹא־הָיוּ לוֹ בָּנִים כִּי אִם־בָּנוֹת וְאֵלֶּה שְׁמוֹת בְּנֹתָיו מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה׃
    hebrewPlain: ולצלפחד בן חפר בן גלעד בן מכיר בן מנשה לא היו לו בנים כי אם בנות ואלה שמות בנתיו מחלה ונעה חגלה מלכה ותרצה
    kjvRefs:
    - Joshua 17:3
    kjvOsis:
    - Josh.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.4
    scripture: tanakh
    name: Tanakh Joshua 17:4
    ref: Joshua 17:4
    book: Josh
    section: neviim
    chapter: 17
    verse: 4
    ordinal: 6274
    text: 'And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying: ‘The LORD commanded Moses to give us an inheritance among our brethren’; therefore according to the commandment of the LORD he gave them an inheritance among the brethren of their father.'
    translation: JPS 1917
    original: וַתִּקְרַבְנָה לִפְנֵי אֶלְעָזָר הַכֹּהֵן וְלִפְנֵי יְהוֹשֻׁעַ בִּן־נוּן וְלִפְנֵי הַנְּשִׂיאִים לֵאמֹר יְהוָה צִוָּה אֶת־מֹשֶׁה לָתֶת־לָנוּ נַחֲלָה בְּתוֹךְ אַחֵינוּ וַיִּתֵּן לָהֶם אֶל־פִּי יְהוָה נַחֲלָה בְּתוֹךְ אֲחֵי אֲבִיהֶן׃
    hebrewPlain: ותקרבנה לפני אלעזר הכהן ולפני יהושע בן נון ולפני הנשיאים לאמר יהוה צוה את משה לתת לנו נחלה בתוך אחינו ויתן להם אל פי יהוה נחלה בתוך אחי אביהן
    kjvRefs:
    - Joshua 17:4
    kjvOsis:
    - Josh.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.5
    scripture: tanakh
    name: Tanakh Joshua 17:5
    ref: Joshua 17:5
    book: Josh
    section: neviim
    chapter: 17
    verse: 5
    ordinal: 6275
    text: And there fell ten parts to Manasseh, beside the land of Gilead and Bashan, which is beyond the Jordan;
    translation: JPS 1917
    original: וַיִּפְּלוּ חַבְלֵי־מְנַשֶּׁה עֲשָׂרָה לְבַד מֵאֶרֶץ הַגִּלְעָד וְהַבָּשָׁן אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן׃
    hebrewPlain: ויפלו חבלי מנשה עשרה לבד מארץ הגלעד והבשן אשר מעבר לירדן
    kjvRefs:
    - Joshua 17:5
    kjvOsis:
    - Josh.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.6
    scripture: tanakh
    name: Tanakh Joshua 17:6
    ref: Joshua 17:6
    book: Josh
    section: neviim
    chapter: 17
    verse: 6
    ordinal: 6276
    text: because the daughters of Manasseh had an inheritance among his sons; and the land of Gilead belonged unto the rest of the sons of Manasseh.
    translation: JPS 1917
    original: כִּי בְּנוֹת מְנַשֶּׁה נָחֲלוּ נַחֲלָה בְּתוֹךְ בָּנָיו וְאֶרֶץ הַגִּלְעָד הָיְתָה לִבְנֵי־מְנַשֶּׁה הַנּוֹתָרִים׃
    hebrewPlain: כי בנות מנשה נחלו נחלה בתוך בניו וארץ הגלעד היתה לבני מנשה הנותרים
    kjvRefs:
    - Joshua 17:6
    kjvOsis:
    - Josh.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.7
    scripture: tanakh
    name: Tanakh Joshua 17:7
    ref: Joshua 17:7
    book: Josh
    section: neviim
    chapter: 17
    verse: 7
    ordinal: 6277
    text: And the border of Manasseh was, beginning from Asher, Michmethath, which is before Shechem; and the border went along to the right hand, unto the inhabitants of En-tappuah.—
    translation: JPS 1917
    original: וַיְהִי גְבוּל־מְנַשֶּׁה מֵאָשֵׁר הַמִּכְמְתָת אֲשֶׁר עַל־פְּנֵי שְׁכֶם וְהָלַךְ הַגְּבוּל אֶל־הַיָּמִין אֶל־יֹשְׁבֵי עֵין תַּפּוּחַ׃
    hebrewPlain: ויהי גבול מנשה מאשר המכמתת אשר על פני שכם והלך הגבול אל הימין אל ישבי עין תפוח
    kjvRefs:
    - Joshua 17:7
    kjvOsis:
    - Josh.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.8
    scripture: tanakh
    name: Tanakh Joshua 17:8
    ref: Joshua 17:8
    book: Josh
    section: neviim
    chapter: 17
    verse: 8
    ordinal: 6278
    text: The land of Tappuah belonged to Manasseh; but Tappuah on the border of Manasseh belonged to the children of Ephraim.—
    translation: JPS 1917
    original: לִמְנַשֶּׁה הָיְתָה אֶרֶץ תַּפּוּחַ וְתַפּוּחַ אֶל־גְּבוּל מְנַשֶּׁה לִבְנֵי אֶפְרָיִם׃
    hebrewPlain: למנשה היתה ארץ תפוח ותפוח אל גבול מנשה לבני אפרים
    kjvRefs:
    - Joshua 17:8
    kjvOsis:
    - Josh.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.9
    scripture: tanakh
    name: Tanakh Joshua 17:9
    ref: Joshua 17:9
    book: Josh
    section: neviim
    chapter: 17
    verse: 9
    ordinal: 6279
    text: 'And the border went down unto the brook of Kanah, southward of the brook, by cities which belonged to Ephraim among the cities of Manasseh; but the border of Manasseh was on the north side of the brook; and the goings out thereof were at the sea:'
    translation: JPS 1917
    original: וְיָרַד הַגְּבוּל נַחַל קָנָה נֶגְבָּה לַנַּחַל עָרִים הָאֵלֶּה לְאֶפְרַיִם בְּתוֹךְ עָרֵי מְנַשֶּׁה וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל וַיְהִי תֹצְאֹתָיו הַיָּמָּה׃
    hebrewPlain: וירד הגבול נחל קנה נגבה לנחל ערים האלה לאפרים בתוך ערי מנשה וגבול מנשה מצפון לנחל ויהי תצאתיו הימה
    kjvRefs:
    - Joshua 17:9
    kjvOsis:
    - Josh.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.10
    scripture: tanakh
    name: Tanakh Joshua 17:10
    ref: Joshua 17:10
    book: Josh
    section: neviim
    chapter: 17
    verse: 10
    ordinal: 6280
    text: southward it was Ephraim’s, and northward it was Manasseh’s, and the sea was his border; and they reached to Asher on the north, and to Issachar on the east.
    translation: JPS 1917
    original: נֶגְבָּה לְאֶפְרַיִם וְצָפוֹנָה לִמְנַשֶּׁה וַיְהִי הַיָּם גְּבוּלוֹ וּבְאָשֵׁר יִפְגְּעוּן מִצָּפוֹן וּבְיִשָּׂשכָר מִמִּזְרָח׃
    hebrewPlain: נגבה לאפרים וצפונה למנשה ויהי הים גבולו ובאשר יפגעון מצפון וביששכר ממזרח
    kjvRefs:
    - Joshua 17:10
    kjvOsis:
    - Josh.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.11
    scripture: tanakh
    name: Tanakh Joshua 17:11
    ref: Joshua 17:11
    book: Josh
    section: neviim
    chapter: 17
    verse: 11
    ordinal: 6281
    text: And Manasseh had in Issachar and in Asher Beth-shean and its towns, and Ibleam and its towns, and the inhabitants of Dor and its towns, and the inhabitants of En-dor and its towns, and the inhabitants of Taanach and its towns, and the inhabitants of Megiddo and its towns, even the three regions.
    translation: JPS 1917
    original: וַיְהִי לִמְנַשֶּׁה בְּיִשָּׂשכָר וּבְאָשֵׁר בֵּית־שְׁאָן וּבְנוֹתֶיהָ וְיִבְלְעָם וּבְנוֹתֶיהָ וְאֶת־יֹשְׁבֵי דֹאר וּבְנוֹתֶיהָ וְיֹשְׁבֵי עֵין־דֹּר וּבְנֹתֶיהָ וְיֹשְׁבֵי תַעְנַךְ וּבְנֹתֶיהָ וְיֹשְׁבֵי מְגִדּוֹ וּבְנוֹתֶיהָ שְׁלֹשֶׁת הַנָּפֶת׃
    hebrewPlain: ויהי למנשה ביששכר ובאשר בית שאן ובנותיה ויבלעם ובנותיה ואת ישבי דאר ובנותיה וישבי עין דר ובנתיה וישבי תענך ובנתיה וישבי מגדו ובנותיה שלשת הנפת
    kjvRefs:
    - Joshua 17:11
    kjvOsis:
    - Josh.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.12
    scripture: tanakh
    name: Tanakh Joshua 17:12
    ref: Joshua 17:12
    book: Josh
    section: neviim
    chapter: 17
    verse: 12
    ordinal: 6282
    text: Yet the children of Manasseh could not drive out the inhabitants of those cities; but the Canaanites were resolved to dwell in that land.
    translation: JPS 1917
    original: וְלֹא יָכְלוּ בְּנֵי מְנַשֶּׁה לְהוֹרִישׁ אֶת־הֶעָרִים הָאֵלֶּה וַיּוֹאֶל הַכְּנַעֲנִי לָשֶׁבֶת בָּאָרֶץ הַזֹּאת׃
    hebrewPlain: ולא יכלו בני מנשה להוריש את הערים האלה ויואל הכנעני לשבת בארץ הזאת
    kjvRefs:
    - Joshua 17:12
    kjvOsis:
    - Josh.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.13
    scripture: tanakh
    name: Tanakh Joshua 17:13
    ref: Joshua 17:13
    book: Josh
    section: neviim
    chapter: 17
    verse: 13
    ordinal: 6283
    text: And it came to pass, when the children of Israel were waxen strong, that they put the Canaanites to taskwork, but did not utterly drive them out.
    translation: JPS 1917
    original: וַיְהִי כִּי חָזְקוּ בְּנֵי יִשְׂרָאֵל וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ׃
    hebrewPlain: ויהי כי חזקו בני ישראל ויתנו את הכנעני למס והורש לא הורישו
    kjvRefs:
    - Joshua 17:13
    kjvOsis:
    - Josh.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.14
    scripture: tanakh
    name: Tanakh Joshua 17:14
    ref: Joshua 17:14
    book: Josh
    section: neviim
    chapter: 17
    verse: 14
    ordinal: 6284
    text: 'And the children of Joseph spoke unto Joshua, saying: ‘Why hast thou given me but one lot and one part for an inheritance, seeing I am a great people, forasmuch as the LORD hath blessed me thus?’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת־יְהוֹשֻׁעַ לֵאמֹר מַדּוּעַ נָתַתָּה לִּי נַחֲלָה גּוֹרָל אֶחָד וְחֶבֶל אֶחָד וַאֲנִי עַם־רָב עַד אֲשֶׁר־עַד־כֹּה בֵּרְכַנִי יְהוָה׃
    hebrewPlain: וידברו בני יוסף את יהושע לאמר מדוע נתתה לי נחלה גורל אחד וחבל אחד ואני עם רב עד אשר עד כה ברכני יהוה
    kjvRefs:
    - Joshua 17:14
    kjvOsis:
    - Josh.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.15
    scripture: tanakh
    name: Tanakh Joshua 17:15
    ref: Joshua 17:15
    book: Josh
    section: neviim
    chapter: 17
    verse: 15
    ordinal: 6285
    text: 'And Joshua said unto them: ‘If thou be a great people, get thee up to the forest, and cut down for thyself there in the land of the Perizzites and of the Rephaim; since the hill-country of Ephraim is too narrow for thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ אִם־עַם־רַב אַתָּה עֲלֵה לְךָ הַיַּעְרָה וּבֵרֵאתָ לְךָ שָׁם בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים כִּי־אָץ לְךָ הַר־אֶפְרָיִם׃
    hebrewPlain: ויאמר אליהם יהושע אם עם רב אתה עלה לך היערה ובראת לך שם בארץ הפרזי והרפאים כי אץ לך הר אפרים
    kjvRefs:
    - Joshua 17:15
    kjvOsis:
    - Josh.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.16
    scripture: tanakh
    name: Tanakh Joshua 17:16
    ref: Joshua 17:16
    book: Josh
    section: neviim
    chapter: 17
    verse: 16
    ordinal: 6286
    text: 'And the children of Joseph said: ‘The hill-country will not be enough for us; and all the Canaanites that dwell in the land of the valley have chariots of iron, both they who are in Beth-shean and its towns, and they who are in the valley of Jezreel.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ בְּנֵי יוֹסֵף לֹא־יִמָּצֵא לָנוּ הָהָר וְרֶכֶב בַּרְזֶל בְּכָל־הַכְּנַעֲנִי הַיֹּשֵׁב בְּאֶרֶץ־הָעֵמֶק לַאֲשֶׁר בְּבֵית־שְׁאָן וּבְנוֹתֶיהָ וְלַאֲשֶׁר בְּעֵמֶק יִזְרְעֶאל׃
    hebrewPlain: ויאמרו בני יוסף לא ימצא לנו ההר ורכב ברזל בכל הכנעני הישב בארץ העמק לאשר בבית שאן ובנותיה ולאשר בעמק יזרעאל
    kjvRefs:
    - Joshua 17:16
    kjvOsis:
    - Josh.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.17
    scripture: tanakh
    name: Tanakh Joshua 17:17
    ref: Joshua 17:17
    book: Josh
    section: neviim
    chapter: 17
    verse: 17
    ordinal: 6287
    text: 'And Joshua spoke unto the house of Joseph, even to Ephraim and to Manasseh, saying: ‘Thou art a great people, and hast great power; thou shalt not have one lot only;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־בֵּית יוֹסֵף לְאֶפְרַיִם וְלִמְנַשֶּׁה לֵאמֹר עַם־רַב אַתָּה וְכֹחַ גָּדוֹל לָךְ לֹא־יִהְיֶה לְךָ גּוֹרָל אֶחָד׃
    hebrewPlain: ויאמר יהושע אל בית יוסף לאפרים ולמנשה לאמר עם רב אתה וכח גדול לך לא יהיה לך גורל אחד
    kjvRefs:
    - Joshua 17:17
    kjvOsis:
    - Josh.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.17.18
    scripture: tanakh
    name: Tanakh Joshua 17:18
    ref: Joshua 17:18
    book: Josh
    section: neviim
    chapter: 17
    verse: 18
    ordinal: 6288
    text: but the hill-country shall be thine; for though it is a forest, thou shalt cut it down, and the goings out thereof shall be thine; for thou shalt drive out the Canaanites, though they have chariots of iron, and though they be strong.’
    translation: JPS 1917
    original: כִּי הַר יִהְיֶה־לָּךְ כִּי־יַעַר הוּא וּבֵרֵאתוֹ וְהָיָה לְךָ תֹּצְאֹתָיו כִּי־תוֹרִישׁ אֶת־הַכְּנַעֲנִי כִּי רֶכֶב בַּרְזֶל לוֹ כִּי חָזָק הוּא׃
    hebrewPlain: כי הר יהיה לך כי יער הוא ובראתו והיה לך תצאתיו כי תוריש את הכנעני כי רכב ברזל לו כי חזק הוא
    kjvRefs:
    - Joshua 17:18
    kjvOsis:
    - Josh.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.17
- type: TanakhVerse
  data:
    osis: Josh.18.1
    scripture: tanakh
    name: Tanakh Joshua 18:1
    ref: Joshua 18:1
    book: Josh
    section: neviim
    chapter: 18
    verse: 1
    ordinal: 6289
    text: And the whole congregation of the children of Israel assembled themselves together at Shiloh, and set up the tent of meeting there; and the land was subdued before them.
    translation: JPS 1917
    original: וַיִּקָּהֲלוּ כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל שִׁלֹה וַיַּשְׁכִּינוּ שָׁם אֶת־אֹהֶל מוֹעֵד וְהָאָרֶץ נִכְבְּשָׁה לִפְנֵיהֶם׃
    hebrewPlain: ויקהלו כל עדת בני ישראל שלה וישכינו שם את אהל מועד והארץ נכבשה לפניהם
    kjvRefs:
    - Joshua 18:1
    kjvOsis:
    - Josh.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.2
    scripture: tanakh
    name: Tanakh Joshua 18:2
    ref: Joshua 18:2
    book: Josh
    section: neviim
    chapter: 18
    verse: 2
    ordinal: 6290
    text: And there remained among the children of Israel seven tribes, which had not yet received their inheritance.
    translation: JPS 1917
    original: וַיִּוָּתְרוּ בִּבְנֵי יִשְׂרָאֵל אֲשֶׁר לֹא־חָלְקוּ אֶת־נַחֲלָתָם שִׁבְעָה שְׁבָטִים׃
    hebrewPlain: ויותרו בבני ישראל אשר לא חלקו את נחלתם שבעה שבטים
    kjvRefs:
    - Joshua 18:2
    kjvOsis:
    - Josh.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.3
    scripture: tanakh
    name: Tanakh Joshua 18:3
    ref: Joshua 18:3
    book: Josh
    section: neviim
    chapter: 18
    verse: 3
    ordinal: 6291
    text: 'And Joshua said unto the children of Israel: ‘How long are ye slack to go in to possess the land, which the LORD, the God of your fathers, hath given you?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ אֶל־בְּנֵי יִשְׂרָאֵל עַד־אָנָה אַתֶּם מִתְרַפִּים לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ אֲשֶׁר נָתַן לָכֶם יְהוָה אֱלֹהֵי אֲבוֹתֵיכֶם׃
    hebrewPlain: ויאמר יהושע אל בני ישראל עד אנה אתם מתרפים לבוא לרשת את הארץ אשר נתן לכם יהוה אלהי אבותיכם
    kjvRefs:
    - Joshua 18:3
    kjvOsis:
    - Josh.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.4
    scripture: tanakh
    name: Tanakh Joshua 18:4
    ref: Joshua 18:4
    book: Josh
    section: neviim
    chapter: 18
    verse: 4
    ordinal: 6292
    text: Appoint for you three men for each tribe; and I will send them, and they shall arise, and walk through the land, and describe it according to their inheritance; and they shall come unto me.
    translation: JPS 1917
    original: הָבוּ לָכֶם שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט וְאֶשְׁלָחֵם וְיָקֻמוּ וְיִתְהַלְּכוּ בָאָרֶץ וְיִכְתְּבוּ אוֹתָהּ לְפִי נַחֲלָתָם וְיָבֹאוּ אֵלָי׃
    hebrewPlain: הבו לכם שלשה אנשים לשבט ואשלחם ויקמו ויתהלכו בארץ ויכתבו אותה לפי נחלתם ויבאו אלי
    kjvRefs:
    - Joshua 18:4
    kjvOsis:
    - Josh.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.5
    scripture: tanakh
    name: Tanakh Joshua 18:5
    ref: Joshua 18:5
    book: Josh
    section: neviim
    chapter: 18
    verse: 5
    ordinal: 6293
    text: 'And they shall divide it into seven portions: Judah shall abide in his border on the south, and the house of Joseph shall abide in their border on the north.'
    translation: JPS 1917
    original: וְהִתְחַלְּקוּ אֹתָהּ לְשִׁבְעָה חֲלָקִים יְהוּדָה יַעֲמֹד עַל־גְּבוּלוֹ מִנֶּגֶב וּבֵית יוֹסֵף יַעַמְדוּ עַל־גְּבוּלָם מִצָּפוֹן׃
    hebrewPlain: והתחלקו אתה לשבעה חלקים יהודה יעמד על גבולו מנגב ובית יוסף יעמדו על גבולם מצפון
    kjvRefs:
    - Joshua 18:5
    kjvOsis:
    - Josh.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.6
    scripture: tanakh
    name: Tanakh Joshua 18:6
    ref: Joshua 18:6
    book: Josh
    section: neviim
    chapter: 18
    verse: 6
    ordinal: 6294
    text: And ye shall describe the land into seven portions, and bring the description hither to me; and I will cast lots for you here before the LORD our God.
    translation: JPS 1917
    original: וְאַתֶּם תִּכְתְּבוּ אֶת־הָאָרֶץ שִׁבְעָה חֲלָקִים וַהֲבֵאתֶם אֵלַי הֵנָּה וְיָרִיתִי לָכֶם גּוֹרָל פֹּה לִפְנֵי יְהוָה אֱלֹהֵינוּ׃
    hebrewPlain: ואתם תכתבו את הארץ שבעה חלקים והבאתם אלי הנה ויריתי לכם גורל פה לפני יהוה אלהינו
    kjvRefs:
    - Joshua 18:6
    kjvOsis:
    - Josh.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.7
    scripture: tanakh
    name: Tanakh Joshua 18:7
    ref: Joshua 18:7
    book: Josh
    section: neviim
    chapter: 18
    verse: 7
    ordinal: 6295
    text: For the Levites have no portion among you, for the priesthood of the LORD is their inheritance; and Gad and Reuben and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of the LORD gave them.’
    translation: JPS 1917
    original: כִּי אֵין־חֵלֶק לַלְוִיִּם בְּקִרְבְּכֶם כִּי־כְהֻנַּת יְהוָה נַחֲלָתוֹ וְגָד וּרְאוּבֵן וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה לָקְחוּ נַחֲלָתָם מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה אֲשֶׁר נָתַן לָהֶם מֹשֶׁה עֶבֶד יְהוָה׃
    hebrewPlain: כי אין חלק ללוים בקרבכם כי כהנת יהוה נחלתו וגד וראובן וחצי שבט המנשה לקחו נחלתם מעבר לירדן מזרחה אשר נתן להם משה עבד יהוה
    kjvRefs:
    - Joshua 18:7
    kjvOsis:
    - Josh.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.8
    scripture: tanakh
    name: Tanakh Joshua 18:8
    ref: Joshua 18:8
    book: Josh
    section: neviim
    chapter: 18
    verse: 8
    ordinal: 6296
    text: 'And the men arose, and went; and Joshua charged them that went to describe the land, saying: ‘Go and walk through the land, and describe it, and come back to me, and I will cast lots for you here before the LORD in Shiloh.’'
    translation: JPS 1917
    original: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ וַיְצַו יְהוֹשֻׁעַ אֶת־הַהֹלְכִים לִכְתֹּב אֶת־הָאָרֶץ לֵאמֹר לְכוּ וְהִתְהַלְּכוּ בָאָרֶץ וְכִתְבוּ אוֹתָהּ וְשׁוּבוּ אֵלַי וּפֹה אַשְׁלִיךְ לָכֶם גּוֹרָל לִפְנֵי יְהוָה בְּשִׁלֹה׃
    hebrewPlain: ויקמו האנשים וילכו ויצו יהושע את ההלכים לכתב את הארץ לאמר לכו והתהלכו בארץ וכתבו אותה ושובו אלי ופה אשליך לכם גורל לפני יהוה בשלה
    kjvRefs:
    - Joshua 18:8
    kjvOsis:
    - Josh.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.9
    scripture: tanakh
    name: Tanakh Joshua 18:9
    ref: Joshua 18:9
    book: Josh
    section: neviim
    chapter: 18
    verse: 9
    ordinal: 6297
    text: And the men went and passed through the land, and described it by cities into seven portions in a book, and they came to Joshua unto the camp at Shiloh.
    translation: JPS 1917
    original: וַיֵּלְכוּ הָאֲנָשִׁים וַיַּעַבְרוּ בָאָרֶץ וַיִּכְתְּבוּהָ לֶעָרִים לְשִׁבְעָה חֲלָקִים עַל־סֵפֶר וַיָּבֹאוּ אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה שִׁלֹה׃
    hebrewPlain: וילכו האנשים ויעברו בארץ ויכתבוה לערים לשבעה חלקים על ספר ויבאו אל יהושע אל המחנה שלה
    kjvRefs:
    - Joshua 18:9
    kjvOsis:
    - Josh.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.10
    scripture: tanakh
    name: Tanakh Joshua 18:10
    ref: Joshua 18:10
    book: Josh
    section: neviim
    chapter: 18
    verse: 10
    ordinal: 6298
    text: And Joshua cast lots for them in Shiloh before the LORD; and there Joshua divided the land unto the children of Israel according to their divisions.
    translation: JPS 1917
    original: וַיַּשְׁלֵךְ לָהֶם יְהוֹשֻׁעַ גּוֹרָל בְּשִׁלֹה לִפְנֵי יְהוָה וַיְחַלֶּק־שָׁם יְהוֹשֻׁעַ אֶת־הָאָרֶץ לִבְנֵי יִשְׂרָאֵל כְּמַחְלְקֹתָם׃
    hebrewPlain: וישלך להם יהושע גורל בשלה לפני יהוה ויחלק שם יהושע את הארץ לבני ישראל כמחלקתם
    kjvRefs:
    - Joshua 18:10
    kjvOsis:
    - Josh.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.11
    scripture: tanakh
    name: Tanakh Joshua 18:11
    ref: Joshua 18:11
    book: Josh
    section: neviim
    chapter: 18
    verse: 11
    ordinal: 6299
    text: And the lot of the tribe of the children of Benjamin came up according to their families; and the border of their lot went out between the children of Judah and the children of Joseph.
    translation: JPS 1917
    original: וַיַּעַל גּוֹרַל מַטֵּה בְנֵי־בִנְיָמִן לְמִשְׁפְּחֹתָם וַיֵּצֵא גְּבוּל גּוֹרָלָם בֵּין בְּנֵי יְהוּדָה וּבֵין בְּנֵי יוֹסֵף׃
    hebrewPlain: ויעל גורל מטה בני בנימן למשפחתם ויצא גבול גורלם בין בני יהודה ובין בני יוסף
    kjvRefs:
    - Joshua 18:11
    kjvOsis:
    - Josh.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.12
    scripture: tanakh
    name: Tanakh Joshua 18:12
    ref: Joshua 18:12
    book: Josh
    section: neviim
    chapter: 18
    verse: 12
    ordinal: 6300
    text: And their border on the north side was from the Jordan; and the border went up to the side of Jericho on the north, and went up through the hill-country westward; and the goings out thereof were at the wilderness of Beth-aven.
    translation: JPS 1917
    original: וַיְהִי לָהֶם הַגְּבוּל לִפְאַת צָפוֹנָה מִן־הַיַּרְדֵּן וְעָלָה הַגְּבוּל אֶל־כֶּתֶף יְרִיחוֹ מִצָּפוֹן וְעָלָה בָהָר יָמָּה והיה [וְהָיוּ] תֹּצְאֹתָיו מִדְבַּרָה בֵּית אָוֶן׃
    hebrewPlain: ויהי להם הגבול לפאת צפונה מן הירדן ועלה הגבול אל כתף יריחו מצפון ועלה בהר ימה והיה [והיו] תצאתיו מדברה בית און
    kjvRefs:
    - Joshua 18:12
    kjvOsis:
    - Josh.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.18
- type: TanakhVerse
  data:
    osis: Josh.18.13
    scripture: tanakh
    name: Tanakh Joshua 18:13
    ref: Joshua 18:13
    book: Josh
    section: neviim
    chapter: 18
    verse: 13
    ordinal: 6301
    text: And the border passed along from thence to Luz, to the side of Luz—the same is Beth-el—southward; and the border went down to Atroth-addar, by the mountain that lieth on the south of Beth-horon the nether.
    translation: JPS 1917
    original: וְעָבַר מִשָּׁם הַגְּבוּל לוּזָה אֶל־כֶּתֶף לוּזָה נֶגְבָּה הִיא בֵּית־אֵל וְיָרַד הַגְּבוּל עַטְרוֹת אַדָּר עַל־הָהָר אֲשֶׁר מִנֶּגֶב לְבֵית־חֹרוֹן תַּחְתּוֹן׃
    hebrewPlain: ועבר משם הגבול לוזה אל כתף לוזה נגבה היא בית אל וירד הגבול עטרות אדר על ההר אשר מנגב לבית חרון תחתון
    kjvRefs:
    - Joshua 18:13
    kjvOsis:
    - Josh.18.13
  relations:
  - predicate: IN
