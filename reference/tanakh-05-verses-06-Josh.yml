  data:
    osis: Josh.1.13
    scripture: tanakh
    name: Tanakh Joshua 1:13
    ref: Joshua 1:13
    book: Josh
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 5859
    text: '’Remember the word which Moses the servant of the LORD commanded, you, saying: The LORD your God giveth you rest, and will give you this land.'
    translation: JPS 1917
    original: זָכוֹר אֶת־הַדָּבָר אֲשֶׁר צִוָּה אֶתְכֶם מֹשֶׁה עֶבֶד־יְהוָה לֵאמֹר יְהוָה אֱלֹהֵיכֶם מֵנִיחַ לָכֶם וְנָתַן לָכֶם אֶת־הָאָרֶץ הַזֹּאת׃
    hebrewPlain: זכור את הדבר אשר צוה אתכם משה עבד יהוה לאמר יהוה אלהיכם מניח לכם ונתן לכם את הארץ הזאת
    kjvRefs:
    - Joshua 1:13
    kjvOsis:
    - Josh.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.1.14
    scripture: tanakh
    name: Tanakh Joshua 1:14
    ref: Joshua 1:14
    book: Josh
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 5860
    text: Your wives, your little ones, and your cattle, shall abide in the land which Moses gave you beyond the Jordan; but ye shall pass over before your brethren armed, all the mighty men of valour, and shall help them;
    translation: JPS 1917
    original: נְשֵׁיכֶם טַפְּכֶם וּמִקְנֵיכֶם יֵשְׁבוּ בָּאָרֶץ אֲשֶׁר נָתַן לָכֶם מֹשֶׁה בְּעֵבֶר הַיַּרְדֵּן וְאַתֶּם תַּעַבְרוּ חֲמֻשִׁים לִפְנֵי אֲחֵיכֶם כֹּל גִּבּוֹרֵי הַחַיִל וַעֲזַרְתֶּם אוֹתָם׃
    hebrewPlain: נשיכם טפכם ומקניכם ישבו בארץ אשר נתן לכם משה בעבר הירדן ואתם תעברו חמשים לפני אחיכם כל גבורי החיל ועזרתם אותם
    kjvRefs:
    - Joshua 1:14
    kjvOsis:
    - Josh.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.1
- type: TanakhVerse
  data:
    osis: Josh.1.15
    scripture: tanakh
    name: Tanakh Joshua 1:15
    ref: Joshua 1:15
    book: Josh
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 5861
    text: until the LORD have given your brethren rest, as unto you, and they also have possessed the land which the LORD your God giveth them; then ye shall return unto the land of your possession, and possess it, which Moses the servant of the LORD gave you beyond the Jordan toward the sunrising.’
    translation: JPS 1917
    original: עַד אֲשֶׁר־יָנִיחַ יְהוָה לַאֲחֵיכֶם כָּכֶם וְיָרְשׁוּ גַם־הֵמָּה אֶת־הָאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֵיכֶם נֹתֵן לָהֶם וְשַׁבְתֶּם לְאֶרֶץ יְרֻשַּׁתְכֶם וִירִשְׁתֶּם אוֹתָהּ אֲשֶׁר נָתַן לָכֶם מֹשֶׁה עֶבֶד יְהוָה בְּעֵבֶר הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ׃
    hebrewPlain: עד אשר יניח יהוה לאחיכם ככם וירשו גם המה את הארץ אשר יהוה אלהיכם נתן להם ושבתם לארץ ירשתכם וירשתם אותה אשר נתן לכם משה עבד יהוה בעבר הירדן מזרח השמש
    kjvRefs:
    - Joshua 1:15
    kjvOsis:
    - Josh.1.15
