    book: Josh
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 5858
    text: 'And to the Reubenites, and to the Gadites, and to the half-tribe of Manasseh, spoke Joshua, saying:'
    translation: JPS 1917
    original: וְלָראוּבֵנִי וְלַגָּדִי וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה אָמַר יְהוֹשֻׁעַ לֵאמֹר׃
    hebrewPlain: ולראובני ולגדי ולחצי שבט המנשה אמר יהושע לאמר
