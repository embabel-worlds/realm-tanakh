    text: by the lot of their inheritance, as the LORD commanded by the hand of Moses, for the nine tribes, and for the half-tribe.—
    translation: JPS 1917
    original: בְּגוֹרַל נַחֲלָתָם כַּאֲשֶׁר צִוָּה יְהוָה בְּיַד־מֹשֶׁה לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה׃
    hebrewPlain: בגורל נחלתם כאשר צוה יהוה ביד משה לתשעת המטות וחצי המטה
    kjvRefs:
    - Joshua 14:2
    kjvOsis:
    - Josh.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.3
    scripture: tanakh
    name: Tanakh Joshua 14:3
    ref: Joshua 14:3
    book: Josh
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 6185
    text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan; but unto the Levites he gave no inheritance among them.
    translation: JPS 1917
    original: כִּי־נָתַן מֹשֶׁה נַחֲלַת שְׁנֵי הַמַּטּוֹת וַחֲצִי הַמַּטֶּה מֵעֵבֶר לַיַּרְדֵּן וְלַלְוִיִּם לֹא־נָתַן נַחֲלָה בְּתוֹכָם׃
    hebrewPlain: כי נתן משה נחלת שני המטות וחצי המטה מעבר לירדן וללוים לא נתן נחלה בתוכם
    kjvRefs:
    - Joshua 14:3
    kjvOsis:
    - Josh.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.4
    scripture: tanakh
    name: Tanakh Joshua 14:4
    ref: Joshua 14:4
    book: Josh
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 6186
    text: For the children of Joseph were two tribes, Manasseh and Ephraim; and they gave no portion unto the Levites in the land, save cities to dwell in, with the open land about them for their cattle and for their substance.—
    translation: JPS 1917
    original: כִּי־הָיוּ בְנֵי־יוֹסֵף שְׁנֵי מַטּוֹת מְנַשֶּׁה וְאֶפְרָיִם וְלֹא־נָתְנוּ חֵלֶק לַלְוִיִּם בָּאָרֶץ כִּי אִם־עָרִים לָשֶׁבֶת וּמִגְרְשֵׁיהֶם לְמִקְנֵיהֶם וּלְקִנְיָנָם׃
    hebrewPlain: כי היו בני יוסף שני מטות מנשה ואפרים ולא נתנו חלק ללוים בארץ כי אם ערים לשבת ומגרשיהם למקניהם ולקנינם
    kjvRefs:
    - Joshua 14:4
    kjvOsis:
    - Josh.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.5
    scripture: tanakh
    name: Tanakh Joshua 14:5
    ref: Joshua 14:5
    book: Josh
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 6187
    text: As the LORD commanded Moses, so the children of Israel did, and they divided the land.
    translation: JPS 1917
    original: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה כֵּן עָשׂוּ בְּנֵי יִשְׂרָאֵל וַיַּחְלְקוּ אֶת־הָאָרֶץ׃
    hebrewPlain: כאשר צוה יהוה את משה כן עשו בני ישראל ויחלקו את הארץ
    kjvRefs:
    - Joshua 14:5
    kjvOsis:
    - Josh.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.6
    scripture: tanakh
    name: Tanakh Joshua 14:6
    ref: Joshua 14:6
    book: Josh
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 6188
    text: 'Then the children of Judah drew nigh unto Joshua in Gilgal; and Caleb the son of Jephunneh the Kenizzite said unto him: ‘Thou knowest the thing that the LORD spoke unto Moses the man of God concerning me and concerning thee in Kadesh-barnea.'
    translation: JPS 1917
    original: וַיִּגְּשׁוּ בְנֵי־יְהוּדָה אֶל־יְהוֹשֻׁעַ בַּגִּלְגָּל וַיֹּאמֶר אֵלָיו כָּלֵב בֶּן־יְפֻנֶּה הַקְּנִזִּי אַתָּה יָדַעְתָּ אֶת־הַדָּבָר אֲשֶׁר־דִּבֶּר יְהוָה אֶל־מֹשֶׁה אִישׁ־הָאֱלֹהִים עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ בְּקָדֵשׁ בַּרְנֵעַ׃
    hebrewPlain: ויגשו בני יהודה אל יהושע בגלגל ויאמר אליו כלב בן יפנה הקנזי אתה ידעת את הדבר אשר דבר יהוה אל משה איש האלהים על אדותי ועל אדותיך בקדש ברנע
    kjvRefs:
    - Joshua 14:6
    kjvOsis:
    - Josh.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.7
    scripture: tanakh
    name: Tanakh Joshua 14:7
    ref: Joshua 14:7
    book: Josh
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 6189
    text: Forty years old was I when Moses the servant of the LORD sent me from Kadesh-barnea to spy out the land; and I brought him back word as it was in my heart.
    translation: JPS 1917
    original: בֶּן־אַרְבָּעִים שָׁנָה אָנֹכִי בִּשְׁלֹחַ מֹשֶׁה עֶבֶד־יְהוָה אֹתִי מִקָּדֵשׁ בַּרְנֵעַ לְרַגֵּל אֶת־הָאָרֶץ וָאָשֵׁב אֹתוֹ דָּבָר כַּאֲשֶׁר עִם־לְבָבִי׃
    hebrewPlain: בן ארבעים שנה אנכי בשלח משה עבד יהוה אתי מקדש ברנע לרגל את הארץ ואשב אתו דבר כאשר עם לבבי
    kjvRefs:
    - Joshua 14:7
    kjvOsis:
    - Josh.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.8
    scripture: tanakh
    name: Tanakh Joshua 14:8
    ref: Joshua 14:8
    book: Josh
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 6190
    text: Nevertheless my brethren that went up with me made the heart of the people melt; but I wholly followed the LORD my God.
    translation: JPS 1917
    original: וְאַחַי אֲשֶׁר עָלוּ עִמִּי הִמְסִיו אֶת־לֵב הָעָם וְאָנֹכִי מִלֵּאתִי אַחֲרֵי יְהוָה אֱלֹהָי׃
    hebrewPlain: ואחי אשר עלו עמי המסיו את לב העם ואנכי מלאתי אחרי יהוה אלהי
    kjvRefs:
    - Joshua 14:8
    kjvOsis:
    - Josh.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.9
    scripture: tanakh
    name: Tanakh Joshua 14:9
    ref: Joshua 14:9
    book: Josh
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 6191
    text: 'And Moses swore on that day, saying: Surely the land whereon thy foot hath trodden shall be an inheritance to thee and to thy children for ever, because thou hast wholly followed the LORD my God.'
    translation: JPS 1917
    original: וַיִּשָּׁבַע מֹשֶׁה בַּיּוֹם הַהוּא לֵאמֹר אִם־לֹא הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ לְךָ תִהְיֶה לְנַחֲלָה וּלְבָנֶיךָ עַד־עוֹלָם כִּי מִלֵּאתָ אַחֲרֵי יְהוָה אֱלֹהָי׃
    hebrewPlain: וישבע משה ביום ההוא לאמר אם לא הארץ אשר דרכה רגלך בה לך תהיה לנחלה ולבניך עד עולם כי מלאת אחרי יהוה אלהי
    kjvRefs:
    - Joshua 14:9
    kjvOsis:
    - Josh.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.10
    scripture: tanakh
    name: Tanakh Joshua 14:10
    ref: Joshua 14:10
    book: Josh
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 6192
    text: And now, behold, the LORD hath kept me alive, as He spoke, these forty and five years, from the time that the LORD spoke this word unto Moses, while Israel walked in the wilderness; and now, lo, I am this day fourscore and five years old.
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה הֶחֱיָה יְהוָה אוֹתִי כַּאֲשֶׁר דִּבֵּר זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה מֵאָז דִּבֶּר יְהוָה אֶת־הַדָּבָר הַזֶּה אֶל־מֹשֶׁה אֲשֶׁר־הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר וְעַתָּה הִנֵּה אָנֹכִי הַיּוֹם בֶּן־חָמֵשׁ וּשְׁמוֹנִים שָׁנָה׃
    hebrewPlain: ועתה הנה החיה יהוה אותי כאשר דבר זה ארבעים וחמש שנה מאז דבר יהוה את הדבר הזה אל משה אשר הלך ישראל במדבר ועתה הנה אנכי היום בן חמש ושמונים שנה
    kjvRefs:
    - Joshua 14:10
    kjvOsis:
    - Josh.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.11
    scripture: tanakh
    name: Tanakh Joshua 14:11
    ref: Joshua 14:11
    book: Josh
    section: neviim
    chapter: 14
    verse: 11
    ordinal: 6193
    text: As yet I am as strong this day as I was in the day that Moses sent me; as my strength was then, even so is my strength now, for war, and to go out and to come in.
    translation: JPS 1917
    original: עוֹדֶנִּי הַיּוֹם חָזָק כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה כְּכֹחִי אָז וּכְכֹחִי עָתָּה לַמִּלְחָמָה וְלָצֵאת וְלָבוֹא׃
    hebrewPlain: עודני היום חזק כאשר ביום שלח אותי משה ככחי אז וככחי עתה למלחמה ולצאת ולבוא
    kjvRefs:
    - Joshua 14:11
    kjvOsis:
    - Josh.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.12
    scripture: tanakh
    name: Tanakh Joshua 14:12
    ref: Joshua 14:12
    book: Josh
    section: neviim
    chapter: 14
    verse: 12
    ordinal: 6194
    text: Now therefore give me this mountain, whereof the LORD spoke in that day; for thou heardest in that day how the Anakim were there, and cities great and fortified; it may be that the LORD will be with me, and I shall drive them out, as the LORD spoke.’
    translation: JPS 1917
    original: וְעַתָּה תְּנָה־לִּי אֶת־הָהָר הַזֶּה אֲשֶׁר־דִּבֶּר יְהוָה בַּיּוֹם הַהוּא כִּי אַתָּה־שָׁמַעְתָּ בַיּוֹם הַהוּא כִּי־עֲנָקִים שָׁם וְעָרִים גְּדֹלוֹת בְּצֻרוֹת אוּלַי יְהוָה אוֹתִי וְהוֹרַשְׁתִּים כַּאֲשֶׁר דִּבֶּר יְהוָה׃
    hebrewPlain: ועתה תנה לי את ההר הזה אשר דבר יהוה ביום ההוא כי אתה שמעת ביום ההוא כי ענקים שם וערים גדלות בצרות אולי יהוה אותי והורשתים כאשר דבר יהוה
    kjvRefs:
    - Joshua 14:12
    kjvOsis:
    - Josh.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.13
    scripture: tanakh
    name: Tanakh Joshua 14:13
    ref: Joshua 14:13
    book: Josh
    section: neviim
    chapter: 14
    verse: 13
    ordinal: 6195
    text: And Joshua blessed him; and he gave Hebron unto Caleb the son of Jephunneh for an inheritance.
    translation: JPS 1917
    original: וַיְבָרְכֵהוּ יְהוֹשֻׁעַ וַיִּתֵּן אֶת־חֶבְרוֹן לְכָלֵב בֶּן־יְפֻנֶּה לְנַחֲלָה׃
    hebrewPlain: ויברכהו יהושע ויתן את חברון לכלב בן יפנה לנחלה
    kjvRefs:
    - Joshua 14:13
    kjvOsis:
    - Josh.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.14
    scripture: tanakh
    name: Tanakh Joshua 14:14
    ref: Joshua 14:14
    book: Josh
    section: neviim
    chapter: 14
    verse: 14
    ordinal: 6196
    text: Therefore Hebron became the inheritance of Caleb the son of Jephunneh the Kenizzite, unto this day; because that he wholly followed the LORD, the God of Israel.
    translation: JPS 1917
    original: עַל־כֵּן הָיְתָה־חֶבְרוֹן לְכָלֵב בֶּן־יְפֻנֶּה הַקְּנִזִּי לְנַחֲלָה עַד הַיּוֹם הַזֶּה יַעַן אֲשֶׁר מִלֵּא אַחֲרֵי יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: על כן היתה חברון לכלב בן יפנה הקנזי לנחלה עד היום הזה יען אשר מלא אחרי יהוה אלהי ישראל
    kjvRefs:
    - Joshua 14:14
    kjvOsis:
    - Josh.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.14.15
    scripture: tanakh
    name: Tanakh Joshua 14:15
    ref: Joshua 14:15
    book: Josh
    section: neviim
    chapter: 14
    verse: 15
    ordinal: 6197
    text: Now the name of Hebron beforetime was Kiriath-arba, which Arba was the greatest man among the Anakim. And the land had rest from war.
    translation: JPS 1917
    original: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה׃
    hebrewPlain: ושם חברון לפנים קרית ארבע האדם הגדול בענקים הוא והארץ שקטה ממלחמה
    kjvRefs:
    - Joshua 14:15
    kjvOsis:
    - Josh.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.14
- type: TanakhVerse
  data:
    osis: Josh.15.1
    scripture: tanakh
    name: Tanakh Joshua 15:1
    ref: Joshua 15:1
    book: Josh
    section: neviim
    chapter: 15
    verse: 1
    ordinal: 6198
    text: And the lot for the tribe of the children of Judah according to their families was unto the border of Edom, even to the wilderness of Zin southward, at the uttermost part of the south.
    translation: JPS 1917
    original: וַיְהִי הַגּוֹרָל לְמַטֵּה בְּנֵי יְהוּדָה לְמִשְׁפְּחֹתָם אֶל־גְּבוּל אֱדוֹם מִדְבַּר־צִן נֶגְבָּה מִקְצֵה תֵימָן׃
    hebrewPlain: ויהי הגורל למטה בני יהודה למשפחתם אל גבול אדום מדבר צן נגבה מקצה תימן
    kjvRefs:
    - Joshua 15:1
    kjvOsis:
    - Josh.15.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.2
    scripture: tanakh
    name: Tanakh Joshua 15:2
    ref: Joshua 15:2
    book: Josh
    section: neviim
    chapter: 15
    verse: 2
    ordinal: 6199
    text: And their south border was from the uttermost part of the Salt Sea, from the bay that looked southward.
    translation: JPS 1917
    original: וַיְהִי לָהֶם גְּבוּל נֶגֶב מִקְצֵה יָם הַמֶּלַח מִן־הַלָּשֹׁן הַפֹּנֶה נֶגְבָּה׃
    hebrewPlain: ויהי להם גבול נגב מקצה ים המלח מן הלשן הפנה נגבה
    kjvRefs:
    - Joshua 15:2
    kjvOsis:
    - Josh.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.3
    scripture: tanakh
    name: Tanakh Joshua 15:3
    ref: Joshua 15:3
    book: Josh
    section: neviim
    chapter: 15
    verse: 3
    ordinal: 6200
    text: And it went out southward of the ascent of Akrabbim, and passed along to Zin, and went up by the south of Kadesh-barnea, and passed along by Hezron, and went up to Addar, and turned about to Karka.
    translation: JPS 1917
    original: וְיָצָא אֶל־מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים וְעָבַר צִנָה וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ וְעָבַר חֶצְרוֹן וְעָלָה אַדָּרָה וְנָסַב הַקַּרְקָעָה׃
    hebrewPlain: ויצא אל מנגב למעלה עקרבים ועבר צנה ועלה מנגב לקדש ברנע ועבר חצרון ועלה אדרה ונסב הקרקעה
    kjvRefs:
    - Joshua 15:3
    kjvOsis:
    - Josh.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.4
    scripture: tanakh
    name: Tanakh Joshua 15:4
    ref: Joshua 15:4
    book: Josh
    section: neviim
    chapter: 15
    verse: 4
    ordinal: 6201
    text: And it passed along to Azmon, and went out at the Brook of Egypt; and the goings out of the border were at the sea; this shall be your south border.
    translation: JPS 1917
    original: וְעָבַר עַצְמוֹנָה וְיָצָא נַחַל מִצְרַיִם והיה [וְהָיוּ] תֹּצְאוֹת הַגְּבוּל יָמָּה זֶה־יִהְיֶה לָכֶם גְּבוּל נֶגֶב׃
    hebrewPlain: ועבר עצמונה ויצא נחל מצרים והיה [והיו] תצאות הגבול ימה זה יהיה לכם גבול נגב
    kjvRefs:
    - Joshua 15:4
    kjvOsis:
    - Josh.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.5
    scripture: tanakh
    name: Tanakh Joshua 15:5
    ref: Joshua 15:5
    book: Josh
    section: neviim
    chapter: 15
    verse: 5
    ordinal: 6202
    text: And the east border was the Salt Sea, even unto the end of the Jordan. And the border of the north side was from the bay of the sea at the end of the Jordan.
    translation: JPS 1917
    original: וּגְבוּל קֵדְמָה יָם הַמֶּלַח עַד־קְצֵה הַיַּרְדֵּן וּגְבוּל לִפְאַת צָפוֹנָה מִלְּשׁוֹן הַיָּם מִקְצֵה הַיַּרְדֵּן׃
    hebrewPlain: וגבול קדמה ים המלח עד קצה הירדן וגבול לפאת צפונה מלשון הים מקצה הירדן
    kjvRefs:
    - Joshua 15:5
    kjvOsis:
    - Josh.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.6
    scripture: tanakh
    name: Tanakh Joshua 15:6
    ref: Joshua 15:6
    book: Josh
    section: neviim
    chapter: 15
    verse: 6
    ordinal: 6203
    text: And the border went up to Beth-hoglah, and passed along by the north of Beth-arabah; and the border went up to the Stone of Bohan the son of Reuben.
    translation: JPS 1917
    original: וְעָלָה הַגְּבוּל בֵּית חָגְלָה וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה וְעָלָה הַגְּבוּל אֶבֶן בֹּהַן בֶּן־רְאוּבֵן׃
    hebrewPlain: ועלה הגבול בית חגלה ועבר מצפון לבית הערבה ועלה הגבול אבן בהן בן ראובן
    kjvRefs:
    - Joshua 15:6
    kjvOsis:
    - Josh.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.7
    scripture: tanakh
    name: Tanakh Joshua 15:7
    ref: Joshua 15:7
    book: Josh
    section: neviim
    chapter: 15
    verse: 7
    ordinal: 6204
    text: And the border went up to Debir from the valley of Achor, and so northward, looking toward Gilgal, that is over against the ascent of Adummim, which is on the south side of the brook; and the border passed along to the waters of En-shemesh, and the goings out thereof were at En-rogel.
    translation: JPS 1917
    original: וְעָלָה הַגְּבוּל דְּבִרָה מֵעֵמֶק עָכוֹר וְצָפוֹנָה פֹּנֶה אֶל־הַגִּלְגָּל אֲשֶׁר־נֹכַח לְמַעֲלֵה אֲדֻמִּים אֲשֶׁר מִנֶּגֶב לַנָּחַל וְעָבַר הַגְּבוּל אֶל־מֵי־עֵין שֶׁמֶשׁ וְהָיוּ תֹצְאֹתָיו אֶל־עֵין רֹגֵל׃
    hebrewPlain: ועלה הגבול דברה מעמק עכור וצפונה פנה אל הגלגל אשר נכח למעלה אדמים אשר מנגב לנחל ועבר הגבול אל מי עין שמש והיו תצאתיו אל עין רגל
    kjvRefs:
    - Joshua 15:7
    kjvOsis:
    - Josh.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.8
    scripture: tanakh
    name: Tanakh Joshua 15:8
    ref: Joshua 15:8
    book: Josh
    section: neviim
    chapter: 15
    verse: 8
    ordinal: 6205
    text: And the border went up by the Valley of the son of Hinnom unto the side of the Jebusite southward—the same is Jerusalem—and the border went up to the top of the mountain that lieth before the Valley of Hinnom westward, which is at the uttermost part of the vale of Rephaim northward.
    translation: JPS 1917
    original: וְעָלָה הַגְּבוּל גֵּי בֶן־הִנֹּם אֶל־כֶּתֶף הַיְבוּסִי מִנֶּגֶב הִיא יְרוּשָׁלִָם וְעָלָה הַגְּבוּל אֶל־רֹאשׁ הָהָר אֲשֶׁר עַל־פְּנֵי גֵי־הִנֹּם יָמָּה אֲשֶׁר בִּקְצֵה עֵמֶק־רְפָאִים צָפֹנָה׃
    hebrewPlain: ועלה הגבול גי בן הנם אל כתף היבוסי מנגב היא ירושלם ועלה הגבול אל ראש ההר אשר על פני גי הנם ימה אשר בקצה עמק רפאים צפנה
    kjvRefs:
    - Joshua 15:8
    kjvOsis:
    - Josh.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.9
    scripture: tanakh
    name: Tanakh Joshua 15:9
    ref: Joshua 15:9
    book: Josh
    section: neviim
    chapter: 15
    verse: 9
    ordinal: 6206
    text: And the border was drawn from the top of the mountain unto the fountain of the waters of Nephtoah, and went out to the cities of mount Ephron; and the border was drawn to Baalah—the same is Kiriath-jearim.
    translation: JPS 1917
    original: וְתָאַר הַגְּבוּל מֵרֹאשׁ הָהָר אֶל־מַעְיַן מֵי נֶפְתּוֹחַ וְיָצָא אֶל־עָרֵי הַר־עֶפְרוֹן וְתָאַר הַגְּבוּל בַּעֲלָה הִיא קִרְיַת יְעָרִים׃
    hebrewPlain: ותאר הגבול מראש ההר אל מעין מי נפתוח ויצא אל ערי הר עפרון ותאר הגבול בעלה היא קרית יערים
    kjvRefs:
    - Joshua 15:9
    kjvOsis:
    - Josh.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.10
    scripture: tanakh
    name: Tanakh Joshua 15:10
    ref: Joshua 15:10
    book: Josh
    section: neviim
    chapter: 15
    verse: 10
    ordinal: 6207
    text: And the border turned about from Baalah westward unto mount Seir, and passed along unto the side of mount Jearim on the north—the same is Chesalon—and went down to Beth-shemesh, and passed along by Timnah.
    translation: JPS 1917
    original: וְנָסַב הַגְּבוּל מִבַּעֲלָה יָמָּה אֶל־הַר שֵׂעִיר וְעָבַר אֶל־כֶּתֶף הַר־יְעָרִים מִצָּפוֹנָה הִיא כְסָלוֹן וְיָרַד בֵּית־שֶׁמֶשׁ וְעָבַר תִּמְנָה׃
    hebrewPlain: ונסב הגבול מבעלה ימה אל הר שעיר ועבר אל כתף הר יערים מצפונה היא כסלון וירד בית שמש ועבר תמנה
    kjvRefs:
    - Joshua 15:10
    kjvOsis:
    - Josh.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.11
    scripture: tanakh
    name: Tanakh Joshua 15:11
    ref: Joshua 15:11
    book: Josh
    section: neviim
    chapter: 15
    verse: 11
    ordinal: 6208
    text: And the border went out unto the side of Ekron northward; and the border was drawn to Shikkeron, and passed along to mount Baalah, and went out at Jabneel; and the goings out of the border were at the sea.
    translation: JPS 1917
    original: וְיָצָא הַגְּבוּל אֶל־כֶּתֶף עֶקְרוֹן צָפוֹנָה וְתָאַר הַגְּבוּל שִׁכְּרוֹנָה וְעָבַר הַר־הַבַּעֲלָה וְיָצָא יַבְנְאֵל וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה׃
    hebrewPlain: ויצא הגבול אל כתף עקרון צפונה ותאר הגבול שכרונה ועבר הר הבעלה ויצא יבנאל והיו תצאות הגבול ימה
    kjvRefs:
    - Joshua 15:11
    kjvOsis:
    - Josh.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.12
    scripture: tanakh
    name: Tanakh Joshua 15:12
    ref: Joshua 15:12
    book: Josh
    section: neviim
    chapter: 15
    verse: 12
    ordinal: 6209
    text: And as for the west border, the Great Sea was the border thereof. This is the border of the children of Judah round about according to their families.
    translation: JPS 1917
    original: וּגְבוּל יָם הַיָּמָּה הַגָּדוֹל וּגְבוּל זֶה גְּבוּל בְּנֵי־יְהוּדָה סָבִיב לְמִשְׁפְּחֹתָם׃
    hebrewPlain: וגבול ים הימה הגדול וגבול זה גבול בני יהודה סביב למשפחתם
    kjvRefs:
    - Joshua 15:12
    kjvOsis:
    - Josh.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.13
    scripture: tanakh
    name: Tanakh Joshua 15:13
    ref: Joshua 15:13
    book: Josh
    section: neviim
    chapter: 15
    verse: 13
    ordinal: 6210
    text: And unto Caleb the son of Jephunneh he gave a portion among the children of Judah, according to the commandment of the LORD to Joshua, even Kiriath-arba, which Arba was the father of Anak—the same is Hebron.
    translation: JPS 1917
    original: וּלְכָלֵב בֶּן־יְפֻנֶּה נָתַן חֵלֶק בְּתוֹךְ בְּנֵי־יְהוּדָה אֶל־פִּי יְהוָה לִיהוֹשֻׁעַ אֶת־קִרְיַת אַרְבַּע אֲבִי הָעֲנָק הִיא חֶבְרוֹן׃
    hebrewPlain: ולכלב בן יפנה נתן חלק בתוך בני יהודה אל פי יהוה ליהושע את קרית ארבע אבי הענק היא חברון
    kjvRefs:
    - Joshua 15:13
    kjvOsis:
    - Josh.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.14
    scripture: tanakh
    name: Tanakh Joshua 15:14
    ref: Joshua 15:14
    book: Josh
    section: neviim
    chapter: 15
    verse: 14
    ordinal: 6211
    text: And Caleb drove out thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.
    translation: JPS 1917
    original: וַיֹּרֶשׁ מִשָּׁם כָּלֵב אֶת־שְׁלוֹשָׁה בְּנֵי הָעֲנָק אֶת־שֵׁשַׁי וְאֶת־אֲחִימַן וְאֶת־תַּלְמַי יְלִידֵי הָעֲנָק׃
    hebrewPlain: וירש משם כלב את שלושה בני הענק את ששי ואת אחימן ואת תלמי ילידי הענק
    kjvRefs:
    - Joshua 15:14
    kjvOsis:
    - Josh.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.15
    scripture: tanakh
    name: Tanakh Joshua 15:15
    ref: Joshua 15:15
    book: Josh
    section: neviim
    chapter: 15
    verse: 15
    ordinal: 6212
    text: And he went up thence against the inhabitants of Debir—now the name of Debir beforetime was Kiriath-sepher.
    translation: JPS 1917
    original: וַיַּעַל מִשָּׁם אֶל־יֹשְׁבֵי דְּבִר וְשֵׁם־דְּבִר לְפָנִים קִרְיַת־סֵפֶר׃
    hebrewPlain: ויעל משם אל ישבי דבר ושם דבר לפנים קרית ספר
    kjvRefs:
    - Joshua 15:15
    kjvOsis:
    - Josh.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.16
    scripture: tanakh
    name: Tanakh Joshua 15:16
    ref: Joshua 15:16
    book: Josh
    section: neviim
    chapter: 15
    verse: 16
    ordinal: 6213
    text: 'And Caleb said: ‘He that smiteth Kiriath-sepher, and taketh it, to him will I give Achsah my daughter to wife.’'
    translation: JPS 1917
    original: וַיֹּאמֶר כָּלֵב אֲשֶׁר־יַכֶּה אֶת־קִרְיַת־סֵפֶר וּלְכָדָהּ וְנָתַתִּי לוֹ אֶת־עַכְסָה בִתִּי לְאִשָּׁה׃
    hebrewPlain: ויאמר כלב אשר יכה את קרית ספר ולכדה ונתתי לו את עכסה בתי לאשה
    kjvRefs:
    - Joshua 15:16
    kjvOsis:
    - Josh.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.17
    scripture: tanakh
    name: Tanakh Joshua 15:17
    ref: Joshua 15:17
    book: Josh
    section: neviim
    chapter: 15
    verse: 17
    ordinal: 6214
    text: And Othniel the son of Kenaz, the brother of Caleb, took it; and he gave him Achsah his daughter to wife. .
    translation: JPS 1917
    original: וַיִּלְכְּדָהּ עָתְנִיאֵל בֶּן־קְנַז אֲחִי כָלֵב וַיִּתֶּן־לוֹ אֶת־עַכְסָה בִתּוֹ לְאִשָּׁה׃
    hebrewPlain: וילכדה עתניאל בן קנז אחי כלב ויתן לו את עכסה בתו לאשה
    kjvRefs:
    - Joshua 15:17
    kjvOsis:
    - Josh.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.18
    scripture: tanakh
    name: Tanakh Joshua 15:18
    ref: Joshua 15:18
    book: Josh
    section: neviim
    chapter: 15
    verse: 18
    ordinal: 6215
    text: 'And it came to pass, when she came unto him, that she persuaded him to ask of her father a field; and she alighted from off her ass; and Caleb said unto her: ‘What wouldest thou?’'
    translation: JPS 1917
    original: וַיְהִי בְּבוֹאָהּ וַתְּסִיתֵהוּ לִשְׁאוֹל מֵאֵת־אָבִיהָ שָׂדֶה וַתִּצְנַח מֵעַל הַחֲמוֹר וַיֹּאמֶר־לָהּ כָּלֵב מַה־לָּךְ׃
    hebrewPlain: ויהי בבואה ותסיתהו לשאול מאת אביה שדה ותצנח מעל החמור ויאמר לה כלב מה לך
    kjvRefs:
    - Joshua 15:18
    kjvOsis:
    - Josh.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.19
    scripture: tanakh
    name: Tanakh Joshua 15:19
    ref: Joshua 15:19
    book: Josh
    section: neviim
    chapter: 15
    verse: 19
    ordinal: 6216
    text: 'And she said: ‘Give me a blessing; for that thou hast set me in the Southland, give me therefore springs of water.’ And he gave her the Upper Springs and the Nether Springs.'
    translation: JPS 1917
    original: וַתֹּאמֶר תְּנָה־לִּי בְרָכָה כִּי אֶרֶץ הַנֶּגֶב נְתַתָּנִי וְנָתַתָּה לִי גֻּלֹּת מָיִם וַיִּתֶּן־לָהּ אֵת גֻּלֹּת עִלִּיּוֹת וְאֵת גֻּלֹּת תַּחְתִּיּוֹת׃
    hebrewPlain: ותאמר תנה לי ברכה כי ארץ הנגב נתתני ונתתה לי גלת מים ויתן לה את גלת עליות ואת גלת תחתיות
    kjvRefs:
    - Joshua 15:19
    kjvOsis:
    - Josh.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.20
    scripture: tanakh
    name: Tanakh Joshua 15:20
    ref: Joshua 15:20
    book: Josh
    section: neviim
    chapter: 15
    verse: 20
    ordinal: 6217
    text: This is the inheritance of the tribe of the children of Judah according to their families.
    translation: JPS 1917
    original: זֹאת נַחֲלַת מַטֵּה בְנֵי־יְהוּדָה לְמִשְׁפְּחֹתָם׃
    hebrewPlain: זאת נחלת מטה בני יהודה למשפחתם
    kjvRefs:
    - Joshua 15:20
    kjvOsis:
    - Josh.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.15
- type: TanakhVerse
  data:
    osis: Josh.15.21
    scripture: tanakh
    name: Tanakh Joshua 15:21
    ref: Joshua 15:21
    book: Josh
    section: neviim
    chapter: 15
    verse: 21
    ordinal: 6218
    text: And the cities at the uttermost part of the tribe of the children of Judah toward the border of Edom in the South were Kabzeel, and Eder, and Jagur;
    translation: JPS 1917
