- type: TanakhVerse
  data:
    osis: Josh.24.30
    scripture: tanakh
    name: Tanakh Joshua 24:30
    ref: Joshua 24:30
    book: Josh
    section: neviim
    chapter: 24
    verse: 30
    ordinal: 6501
    text: And they buried him in the border of his inheritance in Timnath-serah, which is in the hill-country of Ephraim, on the north of the mountain of Gaash.
    translation: JPS 1917
    original: וַיִּקְבְּרוּ אֹתוֹ בִּגְבוּל נַחֲלָתוֹ בְּתִמְנַת־סֶרַח אֲשֶׁר בְּהַר־אֶפְרָיִם מִצְּפוֹן לְהַר־גָּעַשׁ׃
    hebrewPlain: ויקברו אתו בגבול נחלתו בתמנת סרח אשר בהר אפרים מצפון להר געש
    kjvRefs:
    - Joshua 24:30
    kjvOsis:
    - Josh.24.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.31
    scripture: tanakh
    name: Tanakh Joshua 24:31
    ref: Joshua 24:31
    book: Josh
    section: neviim
    chapter: 24
    verse: 31
    ordinal: 6502
    text: And Israel served the LORD all the days of Joshua, and all the days of the elders that outlived Joshua, and had known all the work of the LORD, that He had wrought for Israel.
    translation: JPS 1917
    original: וַיַּעֲבֹד יִשְׂרָאֵל אֶת־יְהוָה כֹּל יְמֵי יְהוֹשֻׁעַ וְכֹל יְמֵי הַזְּקֵנִים אֲשֶׁר הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ וַאֲשֶׁר יָדְעוּ אֵת כָּל־מַעֲשֵׂה יְהוָה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל׃
    hebrewPlain: ויעבד ישראל את יהוה כל ימי יהושע וכל ימי הזקנים אשר האריכו ימים אחרי יהושע ואשר ידעו את כל מעשה יהוה אשר עשה לישראל
    kjvRefs:
    - Joshua 24:31
    kjvOsis:
    - Josh.24.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.32
    scripture: tanakh
    name: Tanakh Joshua 24:32
    ref: Joshua 24:32
    book: Josh
    section: neviim
    chapter: 24
    verse: 32
    ordinal: 6503
    text: And the bones of Joseph, which the children of Israel brought up out of Egypt, buried they in Shechem, in the parcel of ground which Jacob bought of the sons of Hamor the father of Shechem for a hundred pieces of money; and they became the inheritance of the children of Joseph.
    translation: JPS 1917
    original: וְאֶת־עַצְמוֹת יוֹסֵף אֲשֶׁר־הֶעֱלוּ בְנֵי־יִשְׂרָאֵל מִמִּצְרַיִם קָבְרוּ בִשְׁכֶם בְּחֶלְקַת הַשָּׂדֶה אֲשֶׁר קָנָה יַעֲקֹב מֵאֵת בְּנֵי־חֲמוֹר אֲבִי־שְׁכֶם בְּמֵאָה קְשִׂיטָה וַיִּהְיוּ לִבְנֵי־יוֹסֵף לְנַחֲלָה׃
    hebrewPlain: ואת עצמות יוסף אשר העלו בני ישראל ממצרים קברו בשכם בחלקת השדה אשר קנה יעקב מאת בני חמור אבי שכם במאה קשיטה ויהיו לבני יוסף לנחלה
    kjvRefs:
    - Joshua 24:32
    kjvOsis:
    - Josh.24.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.24
- type: TanakhVerse
  data:
    osis: Josh.24.33
    scripture: tanakh
    name: Tanakh Joshua 24:33
    ref: Joshua 24:33
    book: Josh
    section: neviim
    chapter: 24
    verse: 33
    ordinal: 6504
    text: And Eleazar the son of Aaron died; and they buried him in the Hill of Phinehas his son, which was given him in mount Ephraim.
    translation: JPS 1917
    original: וְאֶלְעָזָר בֶּן־אַהֲרֹן מֵת וַיִּקְבְּרוּ אֹתוֹ בְּגִבְעַת פִּינְחָס בְּנוֹ אֲשֶׁר נִתַּן־לוֹ בְּהַר אֶפְרָיִם׃
    hebrewPlain: ואלעזר בן אהרן מת ויקברו אתו בגבעת פינחס בנו אשר נתן לו בהר אפרים
    kjvRefs:
    - Joshua 24:33
    kjvOsis:
    - Josh.24.33
