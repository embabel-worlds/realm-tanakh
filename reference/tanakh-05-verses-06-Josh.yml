- type: TanakhVerse
  data:
    osis: Josh.10.33
    scripture: tanakh
    name: Tanakh Joshua 10:33
    ref: Joshua 10:33
    book: Josh
    section: neviim
    chapter: 10
    verse: 33
    ordinal: 6092
    text: Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.
    translation: JPS 1917
    original: אָז עָלָה הֹרָם מֶלֶךְ גֶּזֶר לַעְזֹר אֶת־לָכִישׁ וַיַּכֵּהוּ יְהוֹשֻׁעַ וְאֶת־עַמּוֹ עַד־בִּלְתִּי הִשְׁאִיר־לוֹ שָׂרִיד׃
    hebrewPlain: אז עלה הרם מלך גזר לעזר את לכיש ויכהו יהושע ואת עמו עד בלתי השאיר לו שריד
    kjvRefs:
    - Joshua 10:33
    kjvOsis:
    - Josh.10.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.34
    scripture: tanakh
    name: Tanakh Joshua 10:34
    ref: Joshua 10:34
    book: Josh
    section: neviim
    chapter: 10
    verse: 34
    ordinal: 6093
    text: And Joshua passed from Lachish, and all Israel with him, unto Eglon; and they encamped against it, and fought against it.
    translation: JPS 1917
    original: וַיַּעֲבֹר יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ מִלָּכִישׁ עֶגְלֹנָה וַיַּחֲנוּ עָלֶיהָ וַיִּלָּחֲמוּ עָלֶיהָ׃
    hebrewPlain: ויעבר יהושע וכל ישראל עמו מלכיש עגלנה ויחנו עליה וילחמו עליה
    kjvRefs:
    - Joshua 10:34
    kjvOsis:
    - Josh.10.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.35
    scripture: tanakh
    name: Tanakh Joshua 10:35
    ref: Joshua 10:35
    book: Josh
    section: neviim
    chapter: 10
    verse: 35
    ordinal: 6094
    text: And they took it on that day, and smote it with the edge of the sword, and all the souls that were therein he utterly destroyed that day, according to all that he had done to Lachish.
    translation: JPS 1917
    original: וַיִּלְכְּדוּהָ בַּיּוֹם הַהוּא וַיַּכּוּהָ לְפִי־חֶרֶב וְאֵת כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ בַּיּוֹם הַהוּא הֶחֱרִים כְּכֹל אֲשֶׁר־עָשָׂה לְלָכִישׁ׃
    hebrewPlain: וילכדוה ביום ההוא ויכוה לפי חרב ואת כל הנפש אשר בה ביום ההוא החרים ככל אשר עשה ללכיש
    kjvRefs:
    - Joshua 10:35
    kjvOsis:
    - Josh.10.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.36
    scripture: tanakh
    name: Tanakh Joshua 10:36
    ref: Joshua 10:36
    book: Josh
    section: neviim
    chapter: 10
    verse: 36
    ordinal: 6095
    text: And Joshua went up from Eglon, and all Israel with him, unto Hebron; and they fought against it.
    translation: JPS 1917
    original: וַיַּעַל יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ מֵעֶגְלוֹנָה חֶבְרוֹנָה וַיִּלָּחֲמוּ עָלֶיהָ׃
    hebrewPlain: ויעל יהושע וכל ישראל עמו מעגלונה חברונה וילחמו עליה
    kjvRefs:
    - Joshua 10:36
    kjvOsis:
    - Josh.10.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.37
    scripture: tanakh
    name: Tanakh Joshua 10:37
    ref: Joshua 10:37
    book: Josh
    section: neviim
    chapter: 10
    verse: 37
    ordinal: 6096
    text: And they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that were therein; he left none remaining, according to all that he had done to Eglon; but he utterly destroyed it, and all the souls that were therein.
    translation: JPS 1917
    original: וַיִּלְכְּדוּהָ וַיַּכּוּהָ־לְפִי־חֶרֶב וְאֶת־מַלְכָּהּ וְאֶת־כָּל־עָרֶיהָ וְאֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ לֹא־הִשְׁאִיר שָׂרִיד כְּכֹל אֲשֶׁר־עָשָׂה לְעֶגְלוֹן וַיַּחֲרֵם אוֹתָהּ וְאֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ׃
    hebrewPlain: וילכדוה ויכוה לפי חרב ואת מלכה ואת כל עריה ואת כל הנפש אשר בה לא השאיר שריד ככל אשר עשה לעגלון ויחרם אותה ואת כל הנפש אשר בה
    kjvRefs:
    - Joshua 10:37
    kjvOsis:
    - Josh.10.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.38
    scripture: tanakh
    name: Tanakh Joshua 10:38
    ref: Joshua 10:38
    book: Josh
    section: neviim
    chapter: 10
    verse: 38
    ordinal: 6097
    text: And Joshua turned back, and all Israel with him, to Debir; and fought against it.
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ דְּבִרָה וַיִּלָּחֶם עָלֶיהָ׃
    hebrewPlain: וישב יהושע וכל ישראל עמו דברה וילחם עליה
    kjvRefs:
    - Joshua 10:38
    kjvOsis:
    - Josh.10.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.39
    scripture: tanakh
    name: Tanakh Joshua 10:39
    ref: Joshua 10:39
    book: Josh
    section: neviim
    chapter: 10
    verse: 39
    ordinal: 6098
    text: And he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword, and utterly destroyed all the souls that were therein; he left none remaining; as he had done to Hebron, so he did to Debir, and to the king thereof; as he had done also to Libnah, and to the king thereof.
    translation: JPS 1917
    original: וַיִּלְכְּדָהּ וְאֶת־מַלְכָּהּ וְאֶת־כָּל־עָרֶיהָ וַיַּכּוּם לְפִי־חֶרֶב וַיַּחֲרִימוּ אֶת־כָּל־נֶפֶשׁ אֲשֶׁר־בָּהּ לֹא הִשְׁאִיר שָׂרִיד כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן־עָשָׂה לִדְבִרָה וּלְמַלְכָּהּ וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ׃
    hebrewPlain: וילכדה ואת מלכה ואת כל עריה ויכום לפי חרב ויחרימו את כל נפש אשר בה לא השאיר שריד כאשר עשה לחברון כן עשה לדברה ולמלכה וכאשר עשה ללבנה ולמלכה
    kjvRefs:
    - Joshua 10:39
    kjvOsis:
    - Josh.10.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.40
    scripture: tanakh
    name: Tanakh Joshua 10:40
    ref: Joshua 10:40
    book: Josh
    section: neviim
    chapter: 10
    verse: 40
    ordinal: 6099
    text: So Joshua smote all the land, the hill-country, and the South, and the Lowland, and the slopes, and all their kings; he left none remaining; but he utterly destroyed all that breathed, as the LORD, the God of Israel, commanded.
    translation: JPS 1917
    original: וַיַּכֶּה יְהוֹשֻׁעַ אֶת־כָּל־הָאָרֶץ הָהָר וְהַנֶּגֶב וְהַשְּׁפֵלָה וְהָאֲשֵׁדוֹת וְאֵת כָּל־מַלְכֵיהֶם לֹא הִשְׁאִיר שָׂרִיד וְאֵת כָּל־הַנְּשָׁמָה הֶחֱרִים כַּאֲשֶׁר צִוָּה יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכה יהושע את כל הארץ ההר והנגב והשפלה והאשדות ואת כל מלכיהם לא השאיר שריד ואת כל הנשמה החרים כאשר צוה יהוה אלהי ישראל
    kjvRefs:
    - Joshua 10:40
    kjvOsis:
    - Josh.10.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.41
    scripture: tanakh
    name: Tanakh Joshua 10:41
    ref: Joshua 10:41
    book: Josh
    section: neviim
    chapter: 10
    verse: 41
    ordinal: 6100
    text: And Joshua smote them from Kadesh-barnea even unto Gaza, and all the country of Goshen, even unto Gibeon.
    translation: JPS 1917
    original: וַיַּכֵּם יְהוֹשֻׁעַ מִקָּדֵשׁ בַּרְנֵעַ וְעַד־עַזָּה וְאֵת כָּל־אֶרֶץ גֹּשֶׁן וְעַד־גִּבְעוֹן׃
    hebrewPlain: ויכם יהושע מקדש ברנע ועד עזה ואת כל ארץ גשן ועד גבעון
    kjvRefs:
    - Joshua 10:41
    kjvOsis:
    - Josh.10.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.42
    scripture: tanakh
    name: Tanakh Joshua 10:42
    ref: Joshua 10:42
    book: Josh
    section: neviim
    chapter: 10
    verse: 42
    ordinal: 6101
    text: And all these kings and their land did Joshua take at one time, because the LORD, the God of Israel, fought for Israel.
    translation: JPS 1917
    original: וְאֵת כָּל־הַמְּלָכִים הָאֵלֶּה וְאֶת־אַרְצָם לָכַד יְהוֹשֻׁעַ פַּעַם אֶחָת כִּי יְהוָה אֱלֹהֵי יִשְׂרָאֵל נִלְחָם לְיִשְׂרָאֵל׃
    hebrewPlain: ואת כל המלכים האלה ואת ארצם לכד יהושע פעם אחת כי יהוה אלהי ישראל נלחם לישראל
    kjvRefs:
    - Joshua 10:42
    kjvOsis:
    - Josh.10.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.43
    scripture: tanakh
    name: Tanakh Joshua 10:43
    ref: Joshua 10:43
    book: Josh
    section: neviim
    chapter: 10
    verse: 43
    ordinal: 6102
    text: And Joshua returned, and all Israel with him, unto the camp to Gilgal.
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ אֶל־הַמַּחֲנֶה הַגִּלְגָּלָה׃
    hebrewPlain: וישב יהושע וכל ישראל עמו אל המחנה הגלגלה
    kjvRefs:
    - Joshua 10:43
    kjvOsis:
    - Josh.10.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.11.1
    scripture: tanakh
    name: Tanakh Joshua 11:1
    ref: Joshua 11:1
    book: Josh
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 6103
    text: And it came to pass, when Jabin king of Hazor heard thereof, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph,
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ יָבִין מֶלֶךְ־חָצוֹר וַיִּשְׁלַח אֶל־יוֹבָב מֶלֶךְ מָדוֹן וְאֶל־מֶלֶךְ שִׁמְרוֹן וְאֶל־מֶלֶךְ אַכְשָׁף׃
    hebrewPlain: ויהי כשמע יבין מלך חצור וישלח אל יובב מלך מדון ואל מלך שמרון ואל מלך אכשף
    kjvRefs:
    - Joshua 11:1
    kjvOsis:
    - Josh.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.2
    scripture: tanakh
    name: Tanakh Joshua 11:2
    ref: Joshua 11:2
    book: Josh
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 6104
    text: and to the kings that were on the north, in the hill-country and in the Arabah south of Chinneroth, and in the Lowland, and in the regions of Dor on the west,
    translation: JPS 1917
    original: וְאֶל־הַמְּלָכִים אֲשֶׁר מִצְּפוֹן בָּהָר וּבָעֲרָבָה נֶגֶב כִּנֲרוֹת וּבַשְּׁפֵלָה וּבְנָפוֹת דּוֹר מִיָּם׃
    hebrewPlain: ואל המלכים אשר מצפון בהר ובערבה נגב כנרות ובשפלה ובנפות דור מים
    kjvRefs:
    - Joshua 11:2
    kjvOsis:
    - Josh.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.3
    scripture: tanakh
    name: Tanakh Joshua 11:3
    ref: Joshua 11:3
    book: Josh
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 6105
    text: to the Canaanite on the east and on the west, and the Amorite, and the Hittite, and the Perizzite, and the Jebusite in the hill-country, and the Hivite under Hermon in the land of Mizpah.
    translation: JPS 1917
    original: הַכְּנַעֲנִי מִמִּזְרָח וּמִיָּם וְהָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי בָּהָר וְהַחִוִּי תַּחַת חֶרְמוֹן בְּאֶרֶץ הַמִּצְפָּה׃
    hebrewPlain: הכנעני ממזרח ומים והאמרי והחתי והפרזי והיבוסי בהר והחוי תחת חרמון בארץ המצפה
    kjvRefs:
    - Joshua 11:3
    kjvOsis:
    - Josh.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.4
    scripture: tanakh
    name: Tanakh Joshua 11:4
    ref: Joshua 11:4
    book: Josh
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 6106
    text: And they went out, they and all their hosts with them, much people, even as the sand that is upon the sea-shore in multitude, with horses and chariots very many.
    translation: JPS 1917
    original: וַיֵּצְאוּ הֵם וְכָל־מַחֲנֵיהֶם עִמָּם עַם־רָב כַּחוֹל אֲשֶׁר עַל־שְׂפַת־הַיָּם לָרֹב וְסוּס וָרֶכֶב רַב־מְאֹד׃
    hebrewPlain: ויצאו הם וכל מחניהם עמם עם רב כחול אשר על שפת הים לרב וסוס ורכב רב מאד
    kjvRefs:
    - Joshua 11:4
    kjvOsis:
    - Josh.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.5
    scripture: tanakh
    name: Tanakh Joshua 11:5
    ref: Joshua 11:5
    book: Josh
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 6107
    text: And all these kings met together, and they came and pitched together at the waters of Merom, to fight with Israel.
    translation: JPS 1917
    original: וַיִּוָּעֲדוּ כֹּל הַמְּלָכִים הָאֵלֶּה וַיָּבֹאוּ וַיַּחֲנוּ יַחְדָּו אֶל־מֵי מֵרוֹם לְהִלָּחֵם עִם־יִשְׂרָאֵל׃
    hebrewPlain: ויועדו כל המלכים האלה ויבאו ויחנו יחדו אל מי מרום להלחם עם ישראל
    kjvRefs:
    - Joshua 11:5
    kjvOsis:
    - Josh.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.6
    scripture: tanakh
    name: Tanakh Joshua 11:6
    ref: Joshua 11:6
    book: Josh
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 6108
    text: 'And the LORD said unto Joshua: ‘Be not afraid because of them; for to-morrow at this time will I deliver them up all slain before Israel; thou shalt hough their horses, and burn their chariots with fire.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ אַל־תִּירָא מִפְּנֵיהֶם כִּי־מָחָר כָּעֵת הַזֹּאת אָנֹכִי נֹתֵן אֶת־כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל אֶת־סוּסֵיהֶם תְּעַקֵּר וְאֶת־מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ׃
    hebrewPlain: ויאמר יהוה אל יהושע אל תירא מפניהם כי מחר כעת הזאת אנכי נתן את כלם חללים לפני ישראל את סוסיהם תעקר ואת מרכבתיהם תשרף באש
    kjvRefs:
    - Joshua 11:6
    kjvOsis:
    - Josh.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.7
    scripture: tanakh
    name: Tanakh Joshua 11:7
    ref: Joshua 11:7
    book: Josh
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 6109
    text: So Joshua came, and all the people of war with him, against them by the waters of Merom suddenly, and fell upon them.
    translation: JPS 1917
    original: וַיָּבֹא יְהוֹשֻׁעַ וְכָל־עַם הַמִּלְחָמָה עִמּוֹ עֲלֵיהֶם עַל־מֵי מֵרוֹם פִּתְאֹם וַיִּפְּלוּ בָּהֶם׃
    hebrewPlain: ויבא יהושע וכל עם המלחמה עמו עליהם על מי מרום פתאם ויפלו בהם
    kjvRefs:
    - Joshua 11:7
    kjvOsis:
    - Josh.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.8
    scripture: tanakh
    name: Tanakh Joshua 11:8
    ref: Joshua 11:8
    book: Josh
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 6110
    text: And the LORD delivered them into the hand of Israel, and they smote them, and chased them unto great Zidon, and unto Misrephoth-maim, and unto the valley of Mizpeh eastward; and they smote them, until they left them none remaining.
    translation: JPS 1917
    original: וַיִּתְּנֵם יְהוָה בְּיַד־יִשְׂרָאֵל וַיַּכּוּם וַיִּרְדְּפוּם עַד־צִידוֹן רַבָּה וְעַד מִשְׂרְפוֹת מַיִם וְעַד־בִּקְעַת מִצְפֶּה מִזְרָחָה וַיַּכֻּם עַד־בִּלְתִּי הִשְׁאִיר־לָהֶם שָׂרִיד׃
    hebrewPlain: ויתנם יהוה ביד ישראל ויכום וירדפום עד צידון רבה ועד משרפות מים ועד בקעת מצפה מזרחה ויכם עד בלתי השאיר להם שריד
    kjvRefs:
    - Joshua 11:8
    kjvOsis:
    - Josh.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.9
    scripture: tanakh
    name: Tanakh Joshua 11:9
    ref: Joshua 11:9
    book: Josh
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 6111
    text: And Joshua did unto them as the LORD bade him; he houghed their horses, and burnt their chariots with fire.
    translation: JPS 1917
    original: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ כַּאֲשֶׁר אָמַר־לוֹ יְהוָה אֶת־סוּסֵיהֶם עִקֵּר וְאֶת־מַרְכְּבֹתֵיהֶם שָׂרַף בָּאֵשׁ׃
    hebrewPlain: ויעש להם יהושע כאשר אמר לו יהוה את סוסיהם עקר ואת מרכבתיהם שרף באש
    kjvRefs:
    - Joshua 11:9
    kjvOsis:
    - Josh.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.10
    scripture: tanakh
    name: Tanakh Joshua 11:10
    ref: Joshua 11:10
    book: Josh
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 6112
    text: 'And Joshua turned back at that time, and took Hazor, and smote the king thereof with the sword: for Hazor beforetime was the head of all those kingdoms.'
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹשֻׁעַ בָּעֵת הַהִיא וַיִּלְכֹּד אֶת־חָצוֹר וְאֶת־מַלְכָּהּ הִכָּה בֶחָרֶב כִּי־חָצוֹר לְפָנִים הִיא רֹאשׁ כָּל־הַמַּמְלָכוֹת הָאֵלֶּה׃
    hebrewPlain: וישב יהושע בעת ההיא וילכד את חצור ואת מלכה הכה בחרב כי חצור לפנים היא ראש כל הממלכות האלה
    kjvRefs:
    - Joshua 11:10
    kjvOsis:
    - Josh.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.11
    scripture: tanakh
    name: Tanakh Joshua 11:11
    ref: Joshua 11:11
    book: Josh
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 6113
    text: And they smote all the souls that were therein with the edge of the sword, utterly destroying them; there was none left that breathed; and he burnt Hazor with fire.
    translation: JPS 1917
    original: וַיַּכּוּ אֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ לְפִי־חֶרֶב הַחֲרֵם לֹא נוֹתַר כָּל־נְשָׁמָה וְאֶת־חָצוֹר שָׂרַף בָּאֵשׁ׃
    hebrewPlain: ויכו את כל הנפש אשר בה לפי חרב החרם לא נותר כל נשמה ואת חצור שרף באש
    kjvRefs:
    - Joshua 11:11
    kjvOsis:
    - Josh.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.12
    scripture: tanakh
    name: Tanakh Joshua 11:12
    ref: Joshua 11:12
    book: Josh
    section: neviim
    chapter: 11
    verse: 12
    ordinal: 6114
    text: And all the cities of those kings, and all the kings of them, did Joshua take, and he smote them with the edge of the sword, and utterly destroyed them; as Moses the servant of the LORD commanded.
    translation: JPS 1917
    original: וְאֶת־כָּל־עָרֵי הַמְּלָכִים־הָאֵלֶּה וְאֶת־כָּל־מַלְכֵיהֶם לָכַד יְהוֹשֻׁעַ וַיַּכֵּם לְפִי־חֶרֶב הֶחֱרִים אוֹתָם כַּאֲשֶׁר צִוָּה מֹשֶׁה עֶבֶד יְהוָה׃
    hebrewPlain: ואת כל ערי המלכים האלה ואת כל מלכיהם לכד יהושע ויכם לפי חרב החרים אותם כאשר צוה משה עבד יהוה
    kjvRefs:
    - Joshua 11:12
    kjvOsis:
    - Josh.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.13
    scripture: tanakh
    name: Tanakh Joshua 11:13
    ref: Joshua 11:13
    book: Josh
    section: neviim
    chapter: 11
    verse: 13
    ordinal: 6115
    text: But as for the cities that stood on their mounds, Israel burned none of them, save Hazor only—that did Joshua burn.
    translation: JPS 1917
    original: רַק כָּל־הֶעָרִים הָעֹמְדוֹת עַל־תִּלָּם לֹא שְׂרָפָם יִשְׂרָאֵל זוּלָתִי אֶת־חָצוֹר לְבַדָּהּ שָׂרַף יְהוֹשֻׁעַ׃
    hebrewPlain: רק כל הערים העמדות על תלם לא שרפם ישראל זולתי את חצור לבדה שרף יהושע
    kjvRefs:
    - Joshua 11:13
    kjvOsis:
    - Josh.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.14
    scripture: tanakh
    name: Tanakh Joshua 11:14
    ref: Joshua 11:14
    book: Josh
    section: neviim
    chapter: 11
    verse: 14
    ordinal: 6116
    text: And all the spoil of these cities, and the cattle, the children of Israel took for a prey unto themselves; but every man they smote with the edge of the sword, until they had destroyed them, neither left they any that breathed.
    translation: JPS 1917
    original: וְכֹל שְׁלַל הֶעָרִים הָאֵלֶּה וְהַבְּהֵמָה בָּזְזוּ לָהֶם בְּנֵי יִשְׂרָאֵל רַק אֶת־כָּל־הָאָדָם הִכּוּ לְפִי־חֶרֶב עַד־הִשְׁמִדָם אוֹתָם לֹא הִשְׁאִירוּ כָּל־נְשָׁמָה׃
    hebrewPlain: וכל שלל הערים האלה והבהמה בזזו להם בני ישראל רק את כל האדם הכו לפי חרב עד השמדם אותם לא השאירו כל נשמה
    kjvRefs:
    - Joshua 11:14
    kjvOsis:
    - Josh.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.15
    scripture: tanakh
    name: Tanakh Joshua 11:15
    ref: Joshua 11:15
    book: Josh
    section: neviim
    chapter: 11
    verse: 15
    ordinal: 6117
    text: As the LORD commanded Moses His servant, so did Moses command Joshua; and so did Joshua; he left nothing undone of all that the LORD commanded Moses.
    translation: JPS 1917
    original: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה עַבְדּוֹ כֵּן־צִוָּה מֹשֶׁה אֶת־יְהוֹשֻׁעַ וְכֵן עָשָׂה יְהוֹשֻׁעַ לֹא־הֵסִיר דָּבָר מִכֹּל אֲשֶׁר־צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: כאשר צוה יהוה את משה עבדו כן צוה משה את יהושע וכן עשה יהושע לא הסיר דבר מכל אשר צוה יהוה את משה
    kjvRefs:
    - Joshua 11:15
    kjvOsis:
    - Josh.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.16
    scripture: tanakh
    name: Tanakh Joshua 11:16
    ref: Joshua 11:16
    book: Josh
    section: neviim
    chapter: 11
    verse: 16
    ordinal: 6118
    text: So Joshua took all that land, the hill-country, and all the South, and all the land of Goshen, and the Lowland, and the Arabah, and the hill-country of Israel, and the Lowland of the same;
    translation: JPS 1917
    original: וַיִּקַּח יְהוֹשֻׁעַ אֶת־כָּל־הָאָרֶץ הַזֹּאת הָהָר וְאֶת־כָּל־הַנֶּגֶב וְאֵת כָּל־אֶרֶץ הַגֹּשֶׁן וְאֶת־הַשְּׁפֵלָה וְאֶת־הָעֲרָבָה וְאֶת־הַר יִשְׂרָאֵל וּשְׁפֵלָתֹה׃
    hebrewPlain: ויקח יהושע את כל הארץ הזאת ההר ואת כל הנגב ואת כל ארץ הגשן ואת השפלה ואת הערבה ואת הר ישראל ושפלתה
    kjvRefs:
    - Joshua 11:16
    kjvOsis:
    - Josh.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.17
    scripture: tanakh
    name: Tanakh Joshua 11:17
    ref: Joshua 11:17
    book: Josh
    section: neviim
    chapter: 11
    verse: 17
    ordinal: 6119
    text: from the bare mountain, that goeth up to Seir, even unto Baal-gad in the valley of Lebanon under mount Hermon; and all their kings he took, and smote them, and put them to death.
    translation: JPS 1917
    original: מִן־הָהָר הֶחָלָק הָעוֹלֶה שֵׂעִיר וְעַד־בַּעַל גָּד בְּבִקְעַת הַלְּבָנוֹן תַּחַת הַר־חֶרְמוֹן וְאֵת כָּל־מַלְכֵיהֶם לָכַד וַיַּכֵּם וַיְמִיתֵם׃
    hebrewPlain: מן ההר החלק העולה שעיר ועד בעל גד בבקעת הלבנון תחת הר חרמון ואת כל מלכיהם לכד ויכם וימיתם
    kjvRefs:
    - Joshua 11:17
    kjvOsis:
    - Josh.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.18
    scripture: tanakh
    name: Tanakh Joshua 11:18
    ref: Joshua 11:18
    book: Josh
    section: neviim
    chapter: 11
    verse: 18
    ordinal: 6120
    text: Joshua made war a long time with all those kings.
    translation: JPS 1917
    original: יָמִים רַבִּים עָשָׂה יְהוֹשֻׁעַ אֶת־כָּל־הַמְּלָכִים הָאֵלֶּה מִלְחָמָה׃
    hebrewPlain: ימים רבים עשה יהושע את כל המלכים האלה מלחמה
    kjvRefs:
    - Joshua 11:18
    kjvOsis:
    - Josh.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.19
    scripture: tanakh
    name: Tanakh Joshua 11:19
    ref: Joshua 11:19
    book: Josh
    section: neviim
    chapter: 11
    verse: 19
    ordinal: 6121
    text: There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon; they took all in battle.
    translation: JPS 1917
    original: לֹא־הָיְתָה עִיר אֲשֶׁר הִשְׁלִימָה אֶל־בְּנֵי יִשְׂרָאֵל בִּלְתִּי הַחִוִּי יֹשְׁבֵי גִבְעוֹן אֶת־הַכֹּל לָקְחוּ בַמִּלְחָמָה׃
    hebrewPlain: לא היתה עיר אשר השלימה אל בני ישראל בלתי החוי ישבי גבעון את הכל לקחו במלחמה
    kjvRefs:
    - Joshua 11:19
    kjvOsis:
    - Josh.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.20
    scripture: tanakh
    name: Tanakh Joshua 11:20
    ref: Joshua 11:20
    book: Josh
    section: neviim
    chapter: 11
    verse: 20
    ordinal: 6122
    text: For it was of the LORD to harden their hearts, to come against Israel in battle, that they might be utterly destroyed, that they might have no favour, but that they might be destroyed, as the LORD commanded Moses.
    translation: JPS 1917
    original: כִּי מֵאֵת יְהוָה הָיְתָה לְחַזֵּק אֶת־לִבָּם לִקְרַאת הַמִּלְחָמָה אֶת־יִשְׂרָאֵל לְמַעַן הַחֲרִימָם לְבִלְתִּי הֱיוֹת־לָהֶם תְּחִנָּה כִּי לְמַעַן הַשְׁמִידָם כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: כי מאת יהוה היתה לחזק את לבם לקראת המלחמה את ישראל למען החרימם לבלתי היות להם תחנה כי למען השמידם כאשר צוה יהוה את משה
    kjvRefs:
    - Joshua 11:20
    kjvOsis:
    - Josh.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.21
    scripture: tanakh
    name: Tanakh Joshua 11:21
    ref: Joshua 11:21
    book: Josh
    section: neviim
    chapter: 11
    verse: 21
    ordinal: 6123
    text: And Joshua came at that time, and cut off the Anakim from the hill-country, from Hebron, from Debir, from Anab, and from all the hill-country of Judah, and from all the hill-country of Israel; Joshua utterly destroyed them with their cities.
    translation: JPS 1917
    original: וַיָּבֹא יְהוֹשֻׁעַ בָּעֵת הַהִיא וַיַּכְרֵת אֶת־הָעֲנָקִים מִן־הָהָר מִן־חֶבְרוֹן מִן־דְּבִר מִן־עֲנָב וּמִכֹּל הַר יְהוּדָה וּמִכֹּל הַר יִשְׂרָאֵל עִם־עָרֵיהֶם הֶחֱרִימָם יְהוֹשֻׁעַ׃
    hebrewPlain: ויבא יהושע בעת ההיא ויכרת את הענקים מן ההר מן חברון מן דבר מן ענב ומכל הר יהודה ומכל הר ישראל עם עריהם החרימם יהושע
    kjvRefs:
    - Joshua 11:21
    kjvOsis:
    - Josh.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.22
    scripture: tanakh
    name: Tanakh Joshua 11:22
    ref: Joshua 11:22
    book: Josh
    section: neviim
    chapter: 11
    verse: 22
    ordinal: 6124
    text: There was none of the Anakim left in the land of the children of Israel; only in Gaza, in Gath, and in Ashdod, did some remain.
    translation: JPS 1917
    original: לֹא־נוֹתַר עֲנָקִים בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל רַק בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד נִשְׁאָרוּ׃
    hebrewPlain: לא נותר ענקים בארץ בני ישראל רק בעזה בגת ובאשדוד נשארו
    kjvRefs:
    - Joshua 11:22
    kjvOsis:
    - Josh.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.11
- type: TanakhVerse
  data:
    osis: Josh.11.23
    scripture: tanakh
    name: Tanakh Joshua 11:23
    ref: Joshua 11:23
    book: Josh
    section: neviim
    chapter: 11
    verse: 23
    ordinal: 6125
    text: So Joshua took the whole land, according to all that the LORD spoke unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land had rest from war.
    translation: JPS 1917
    original: וַיִּקַּח יְהוֹשֻׁעַ אֶת־כָּל־הָאָרֶץ כְּכֹל אֲשֶׁר דִּבֶּר יְהוָה אֶל־מֹשֶׁה וַיִּתְּנָהּ יְהוֹשֻׁעַ לְנַחֲלָה לְיִשְׂרָאֵל כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה׃
