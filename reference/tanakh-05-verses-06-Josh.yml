    translation: JPS 1917
    original: וְהַיַּרְדֵּן יִגְבֹּל־אֹתוֹ לִפְאַת־קֵדְמָה זֹאת נַחֲלַת בְּנֵי בִנְיָמִן לִגְבוּלֹתֶיהָ סָבִיב לְמִשְׁפְּחֹתָם׃
