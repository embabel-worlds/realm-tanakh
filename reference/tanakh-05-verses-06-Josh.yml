    section: neviim
    chapter: 16
    verse: 8
    ordinal: 6268
    text: From Tappuah the border went along westward to the brook of Kanah; and the goings out thereof were at the sea. This is the inheritance of the tribe of the children of Ephraim according to their families;
    translation: JPS 1917
    original: מִתַּפּוּחַ יֵלֵךְ הַגְּבוּל יָמָּה נַחַל קָנָה וְהָיוּ תֹצְאֹתָיו הַיָּמָּה זֹאת נַחֲלַת מַטֵּה בְנֵי־אֶפְרַיִם לְמִשְׁפְּחֹתָם׃
    hebrewPlain: מתפוח ילך הגבול ימה נחל קנה והיו תצאתיו הימה זאת נחלת מטה בני אפרים למשפחתם
