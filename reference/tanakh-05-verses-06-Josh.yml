    original: וַיְהִי גְבוּלָם מִמַּחֲנַיִם כָּל־הַבָּשָׁן כָּל־מַמְלְכוּת עוֹג מֶלֶךְ־הַבָּשָׁן וְכָל־חַוֺּת יָאִיר אֲשֶׁר בַּבָּשָׁן שִׁשִּׁים עִיר׃
    hebrewPlain: ויהי גבולם ממחנים כל הבשן כל ממלכות עוג מלך הבשן וכל חות יאיר אשר בבשן ששים עיר
