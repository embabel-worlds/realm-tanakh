- type: TanakhVerse
  data:
    osis: Josh.8.31
    scripture: tanakh
    name: Tanakh Joshua 8:31
    ref: Joshua 8:31
    book: Josh
    section: neviim
    chapter: 8
    verse: 31
    ordinal: 6028
    text: as Moses the servant of the LORD commanded the children of Israel, as it is written in the book of the law of Moses, an altar of unhewn stones, upon which no man had lifted up any iron; and they offered thereon burnt-offerings unto the LORD, and sacrificed peace-offerings.
    translation: JPS 1917
    original: כַּאֲשֶׁר צִוָּה מֹשֶׁה עֶבֶד־יְהוָה אֶת־בְּנֵי יִשְׂרָאֵל כַּכָּתוּב בְּסֵפֶר תּוֹרַת מֹשֶׁה מִזְבַּח אֲבָנִים שְׁלֵמוֹת אֲשֶׁר לֹא־הֵנִיף עֲלֵיהֶן בַּרְזֶל וַיַּעֲלוּ עָלָיו עֹלוֹת לַיהוָה וַיִּזְבְּחוּ שְׁלָמִים׃
    hebrewPlain: כאשר צוה משה עבד יהוה את בני ישראל ככתוב בספר תורת משה מזבח אבנים שלמות אשר לא הניף עליהן ברזל ויעלו עליו עלות ליהוה ויזבחו שלמים
    kjvRefs:
    - Joshua 8:31
    kjvOsis:
    - Josh.8.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.32
    scripture: tanakh
    name: Tanakh Joshua 8:32
    ref: Joshua 8:32
    book: Josh
    section: neviim
    chapter: 8
    verse: 32
    ordinal: 6029
    text: And he wrote there upon the stones a copy of the law of Moses, which he wrote before the children of Israel.
    translation: JPS 1917
    original: וַיִּכְתָּב־שָׁם עַל־הָאֲבָנִים אֵת מִשְׁנֵה תּוֹרַת מֹשֶׁה אֲשֶׁר כָּתַב לִפְנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכתב שם על האבנים את משנה תורת משה אשר כתב לפני בני ישראל
    kjvRefs:
    - Joshua 8:32
    kjvOsis:
    - Josh.8.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.33
    scripture: tanakh
    name: Tanakh Joshua 8:33
    ref: Joshua 8:33
    book: Josh
    section: neviim
    chapter: 8
    verse: 33
    ordinal: 6030
    text: And all Israel, and their elders and officers, and their judges, stood on this side the ark and on that side before the priests the Levites, that bore the ark of the covenant of the LORD, as well the stranger as the home-born; half of them in front of mount Gerizim and half of them in front of mount Ebal; as Moses the servant of the LORD had commanded at the first, that they should bless the people of Israel.
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו עֹמְדִים מִזֶּה וּמִזֶּה לָאָרוֹן נֶגֶד הַכֹּהֲנִים הַלְוִיִּם נֹשְׂאֵי אֲרוֹן בְּרִית־יְהוָה כַּגֵּר כָּאֶזְרָח חֶצְיוֹ אֶל־מוּל הַר־גְּרִזִים וְהַחֶצְיוֹ אֶל־מוּל הַר־עֵיבָל כַּאֲשֶׁר צִוָּה מֹשֶׁה עֶבֶד־יְהוָה לְבָרֵךְ אֶת־הָעָם יִשְׂרָאֵל בָּרִאשֹׁנָה׃
    hebrewPlain: וכל ישראל וזקניו ושטרים ושפטיו עמדים מזה ומזה לארון נגד הכהנים הלוים נשאי ארון ברית יהוה כגר כאזרח חציו אל מול הר גרזים והחציו אל מול הר עיבל כאשר צוה משה עבד יהוה לברך את העם ישראל בראשנה
    kjvRefs:
    - Joshua 8:33
    kjvOsis:
    - Josh.8.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.34
    scripture: tanakh
    name: Tanakh Joshua 8:34
    ref: Joshua 8:34
    book: Josh
    section: neviim
    chapter: 8
    verse: 34
    ordinal: 6031
    text: And afterward he read all the words of the law, the blessing and the curse, according to all that is written in the book of the law.
    translation: JPS 1917
    original: וְאַחֲרֵי־כֵן קָרָא אֶת־כָּל־דִּבְרֵי הַתּוֹרָה הַבְּרָכָה וְהַקְּלָלָה כְּכָל־הַכָּתוּב בְּסֵפֶר הַתּוֹרָה׃
    hebrewPlain: ואחרי כן קרא את כל דברי התורה הברכה והקללה ככל הכתוב בספר התורה
    kjvRefs:
    - Joshua 8:34
    kjvOsis:
    - Josh.8.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.8.35
    scripture: tanakh
    name: Tanakh Joshua 8:35
    ref: Joshua 8:35
    book: Josh
    section: neviim
    chapter: 8
    verse: 35
    ordinal: 6032
    text: There was not a word of all that Moses commanded, which Joshua read not before all the assembly of Israel, and the women, and the little ones, and the strangers that walked among them.
    translation: JPS 1917
    original: לֹא־הָיָה דָבָר מִכֹּל אֲשֶׁר־צִוָּה מֹשֶׁה אֲשֶׁר לֹא־קָרָא יְהוֹשֻׁעַ נֶגֶד כָּל־קְהַל יִשְׂרָאֵל וְהַנָּשִׁים וְהַטַּף וְהַגֵּר הַהֹלֵךְ בְּקִרְבָּם׃
    hebrewPlain: לא היה דבר מכל אשר צוה משה אשר לא קרא יהושע נגד כל קהל ישראל והנשים והטף והגר ההלך בקרבם
    kjvRefs:
    - Joshua 8:35
    kjvOsis:
    - Josh.8.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.8
- type: TanakhVerse
  data:
    osis: Josh.9.1
    scripture: tanakh
    name: Tanakh Joshua 9:1
    ref: Joshua 9:1
    book: Josh
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 6033
    text: And it came to pass, when all the kings that were beyond the Jordan, in the hill-country, and in the Lowland, and on all the shore of the Great Sea in front of Lebanon, the Hittite, and the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite, heard thereof,
    translation: JPS 1917
    original: וַיְהִי כִשְׁמֹעַ כָּל־הַמְּלָכִים אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן בָּהָר וּבַשְּׁפֵלָה וּבְכֹל חוֹף הַיָּם הַגָּדוֹל אֶל־מוּל הַלְּבָנוֹן הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי׃
    hebrewPlain: ויהי כשמע כל המלכים אשר בעבר הירדן בהר ובשפלה ובכל חוף הים הגדול אל מול הלבנון החתי והאמרי הכנעני הפרזי החוי והיבוסי
    kjvRefs:
    - Joshua 9:1
    kjvOsis:
    - Josh.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.2
    scripture: tanakh
    name: Tanakh Joshua 9:2
    ref: Joshua 9:2
    book: Josh
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 6034
    text: that they gathered themselves together, to fight with Joshua and with Israel, with one accord.
    translation: JPS 1917
    original: וַיִּתְקַבְּצוּ יַחְדָּו לְהִלָּחֵם עִם־יְהוֹשֻׁעַ וְעִם־יִשְׂרָאֵל פֶּה אֶחָד׃
    hebrewPlain: ויתקבצו יחדו להלחם עם יהושע ועם ישראל פה אחד
    kjvRefs:
    - Joshua 9:2
    kjvOsis:
    - Josh.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.3
    scripture: tanakh
    name: Tanakh Joshua 9:3
    ref: Joshua 9:3
    book: Josh
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 6035
    text: But when the inhabitants of Gibeon heard what Joshua had done unto Jericho and to Ai,
    translation: JPS 1917
    original: וְיֹשְׁבֵי גִבְעוֹן שָׁמְעוּ אֵת אֲשֶׁר עָשָׂה יְהוֹשֻׁעַ לִירִיחוֹ וְלָעָי׃
    hebrewPlain: וישבי גבעון שמעו את אשר עשה יהושע ליריחו ולעי
    kjvRefs:
    - Joshua 9:3
    kjvOsis:
    - Josh.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.4
    scripture: tanakh
    name: Tanakh Joshua 9:4
    ref: Joshua 9:4
    book: Josh
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 6036
    text: they also did work wilily, and went and made as if they had been ambassadors, and took old sacks upon their asses, and wine skins, worn and rent and patched up;
    translation: JPS 1917
    original: וַיַּעֲשׂוּ גַם־הֵמָּה בְּעָרְמָה וַיֵּלְכוּ וַיִּצְטַיָּרוּ וַיִּקְחוּ שַׂקִּים בָּלִים לַחֲמוֹרֵיהֶם וְנֹאדוֹת יַיִן בָּלִים וּמְבֻקָּעִים וּמְצֹרָרִים׃
    hebrewPlain: ויעשו גם המה בערמה וילכו ויצטירו ויקחו שקים בלים לחמוריהם ונאדות יין בלים ומבקעים ומצררים
    kjvRefs:
    - Joshua 9:4
    kjvOsis:
    - Josh.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.5
    scripture: tanakh
    name: Tanakh Joshua 9:5
    ref: Joshua 9:5
    book: Josh
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 6037
    text: and worn shoes and clouted upon their feet, and worn garments upon them; and all the bread of their provision was dry and was become crumbs.
    translation: JPS 1917
    original: וּנְעָלוֹת בָּלוֹת וּמְטֻלָּאוֹת בְּרַגְלֵיהֶם וּשְׂלָמוֹת בָּלוֹת עֲלֵיהֶם וְכֹל לֶחֶם צֵידָם יָבֵשׁ הָיָה נִקֻּדִים׃
    hebrewPlain: ונעלות בלות ומטלאות ברגליהם ושלמות בלות עליהם וכל לחם צידם יבש היה נקדים
    kjvRefs:
    - Joshua 9:5
    kjvOsis:
    - Josh.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.6
    scripture: tanakh
    name: Tanakh Joshua 9:6
    ref: Joshua 9:6
    book: Josh
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 6038
    text: 'And they went to Joshua unto the camp at Gilgal, and said unto him, and to the men of Israel: ‘We are come from a far country; now therefore make ye a covenant with us.’'
    translation: JPS 1917
    original: וַיֵּלְכוּ אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּל וַיֹּאמְרוּ אֵלָיו וְאֶל־אִישׁ יִשְׂרָאֵל מֵאֶרֶץ רְחוֹקָה בָּאנוּ וְעַתָּה כִּרְתוּ־לָנוּ בְרִית׃
    hebrewPlain: וילכו אל יהושע אל המחנה הגלגל ויאמרו אליו ואל איש ישראל מארץ רחוקה באנו ועתה כרתו לנו ברית
    kjvRefs:
    - Joshua 9:6
    kjvOsis:
    - Josh.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.7
    scripture: tanakh
    name: Tanakh Joshua 9:7
    ref: Joshua 9:7
    book: Josh
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 6039
    text: 'And the men of Israel said unto the Hivites: ‘Peradventure ye dwell among us; and how shall we make a covenant with you?’'
    translation: JPS 1917
    original: ויאמרו [וַיֹּאמֶר] אִישׁ־יִשְׂרָאֵל אֶל־הַחִוִּי אוּלַי בְּקִרְבִּי אַתָּה יוֹשֵׁב וְאֵיךְ אכרות־[אֶכְרָת־] לְךָ בְרִית׃
    hebrewPlain: ויאמרו [ויאמר] איש ישראל אל החוי אולי בקרבי אתה יושב ואיך אכרות [אכרת ] לך ברית
    kjvRefs:
    - Joshua 9:7
    kjvOsis:
    - Josh.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.8
    scripture: tanakh
    name: Tanakh Joshua 9:8
    ref: Joshua 9:8
    book: Josh
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 6040
    text: 'And they said unto Joshua: ‘We are thy servants.’ And Joshua said unto them: ‘Who are ye? and from whence come ye?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֶל־יְהוֹשֻׁעַ עֲבָדֶיךָ אֲנָחְנוּ וַיֹּאמֶר אֲלֵהֶם יְהוֹשֻׁעַ מִי אַתֶּם וּמֵאַיִן תָּבֹאוּ׃
    hebrewPlain: ויאמרו אל יהושע עבדיך אנחנו ויאמר אלהם יהושע מי אתם ומאין תבאו
    kjvRefs:
    - Joshua 9:8
    kjvOsis:
    - Josh.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.9
    scripture: tanakh
    name: Tanakh Joshua 9:9
    ref: Joshua 9:9
    book: Josh
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 6041
    text: 'And they said unto him: ‘From a very far country thy servants are come because of the name of the LORD thy God; for we have heard the fame of Him, and all that He did in Egypt,'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו מֵאֶרֶץ רְחוֹקָה מְאֹד בָּאוּ עֲבָדֶיךָ לְשֵׁם יְהוָה אֱלֹהֶיךָ כִּי־שָׁמַעְנוּ שָׁמְעוֹ וְאֵת כָּל־אֲשֶׁר עָשָׂה בְּמִצְרָיִם׃
    hebrewPlain: ויאמרו אליו מארץ רחוקה מאד באו עבדיך לשם יהוה אלהיך כי שמענו שמעו ואת כל אשר עשה במצרים
    kjvRefs:
    - Joshua 9:9
    kjvOsis:
    - Josh.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.10
    scripture: tanakh
    name: Tanakh Joshua 9:10
    ref: Joshua 9:10
    book: Josh
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 6042
    text: and all that He did to the two kings of the Amorites, that were beyond the Jordan, to Sihon king of Heshbon, and to Og king of Bashan, who was at Ashtaroth.
    translation: JPS 1917
    original: וְאֵת כָּל־אֲשֶׁר עָשָׂה לִשְׁנֵי מַלְכֵי הָאֱמֹרִי אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן וּלְעוֹג מֶלֶךְ־הַבָּשָׁן אֲשֶׁר בְּעַשְׁתָּרוֹת׃
    hebrewPlain: ואת כל אשר עשה לשני מלכי האמרי אשר בעבר הירדן לסיחון מלך חשבון ולעוג מלך הבשן אשר בעשתרות
    kjvRefs:
    - Joshua 9:10
    kjvOsis:
    - Josh.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.11
    scripture: tanakh
    name: Tanakh Joshua 9:11
    ref: Joshua 9:11
    book: Josh
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 6043
    text: 'And our elders and all the inhabitants of our country spoke to us, saying: Take provision in your hand for the journey, and go to meet them, and say unto them: We are your servants; and now make ye a covenant with us.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלֵינוּ זְקֵינֵינוּ וְכָל־יֹשְׁבֵי אַרְצֵנוּ לֵאמֹר קְחוּ בְיֶדְכֶם צֵידָה לַדֶּרֶךְ וּלְכוּ לִקְרָאתָם וַאֲמַרְתֶּם אֲלֵיהֶם עַבְדֵיכֶם אֲנַחְנוּ וְעַתָּה כִּרְתוּ־לָנוּ בְרִית׃
    hebrewPlain: ויאמרו אלינו זקינינו וכל ישבי ארצנו לאמר קחו בידכם צידה לדרך ולכו לקראתם ואמרתם אליהם עבדיכם אנחנו ועתה כרתו לנו ברית
    kjvRefs:
    - Joshua 9:11
    kjvOsis:
    - Josh.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.12
    scripture: tanakh
    name: Tanakh Joshua 9:12
    ref: Joshua 9:12
    book: Josh
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 6044
    text: This our bread we took hot for our provision out of our houses on the day we came forth to go unto you; but now, behold, it is dry, and is become crumbs.
    translation: JPS 1917
    original: זֶה לַחְמֵנוּ חָם הִצְטַיַּדְנוּ אֹתוֹ מִבָּתֵּינוּ בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם וְעַתָּה הִנֵּה יָבֵשׁ וְהָיָה נִקֻּדִים׃
    hebrewPlain: זה לחמנו חם הצטידנו אתו מבתינו ביום צאתנו ללכת אליכם ועתה הנה יבש והיה נקדים
    kjvRefs:
    - Joshua 9:12
    kjvOsis:
    - Josh.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.13
    scripture: tanakh
    name: Tanakh Joshua 9:13
    ref: Joshua 9:13
    book: Josh
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 6045
    text: And these wine-skins, which we filled, were new; and, behold, they are rent. And these our garments and our shoes are worn by reason of the very long journey.’
    translation: JPS 1917
    original: וְאֵלֶּה נֹאדוֹת הַיַּיִן אֲשֶׁר מִלֵּאנוּ חֲדָשִׁים וְהִנֵּה הִתְבַּקָּעוּ וְאֵלֶּה שַׂלְמוֹתֵינוּ וּנְעָלֵינוּ בָּלוּ מֵרֹב הַדֶּרֶךְ מְאֹד׃
    hebrewPlain: ואלה נאדות היין אשר מלאנו חדשים והנה התבקעו ואלה שלמותינו ונעלינו בלו מרב הדרך מאד
    kjvRefs:
    - Joshua 9:13
    kjvOsis:
    - Josh.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.14
    scripture: tanakh
    name: Tanakh Joshua 9:14
    ref: Joshua 9:14
    book: Josh
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 6046
    text: And the men took of their provision, and asked not counsel at the mouth of the LORD.
    translation: JPS 1917
    original: וַיִּקְחוּ הָאֲנָשִׁים מִצֵּידָם וְאֶת־פִּי יְהוָה לֹא שָׁאָלוּ׃
    hebrewPlain: ויקחו האנשים מצידם ואת פי יהוה לא שאלו
    kjvRefs:
    - Joshua 9:14
    kjvOsis:
    - Josh.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.15
    scripture: tanakh
    name: Tanakh Joshua 9:15
    ref: Joshua 9:15
    book: Josh
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 6047
    text: And Joshua made peace with them, and made a covenant with them, to let them live; and the princes of the congregation swore unto them.
    translation: JPS 1917
    original: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם וַיִּכְרֹת לָהֶם בְּרִית לְחַיּוֹתָם וַיִּשָּׁבְעוּ לָהֶם נְשִׂיאֵי הָעֵדָה׃
    hebrewPlain: ויעש להם יהושע שלום ויכרת להם ברית לחיותם וישבעו להם נשיאי העדה
    kjvRefs:
    - Joshua 9:15
    kjvOsis:
    - Josh.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.16
    scripture: tanakh
    name: Tanakh Joshua 9:16
    ref: Joshua 9:16
    book: Josh
    section: neviim
    chapter: 9
    verse: 16
    ordinal: 6048
    text: And it came to pass at the end of three days after they had made a covenant with them, that they heard that they were their neighbours, and that they dwelt among them.
    translation: JPS 1917
    original: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים אַחֲרֵי אֲשֶׁר־כָּרְתוּ לָהֶם בְּרִית וַיִּשְׁמְעוּ כִּי־קְרֹבִים הֵם אֵלָיו וּבְקִרְבּוֹ הֵם יֹשְׁבִים׃
    hebrewPlain: ויהי מקצה שלשת ימים אחרי אשר כרתו להם ברית וישמעו כי קרבים הם אליו ובקרבו הם ישבים
    kjvRefs:
    - Joshua 9:16
    kjvOsis:
    - Josh.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.17
    scripture: tanakh
    name: Tanakh Joshua 9:17
    ref: Joshua 9:17
    book: Josh
    section: neviim
    chapter: 9
    verse: 17
    ordinal: 6049
    text: And the children of Israel journeyed, and came unto their cities on the third day. Now their cities were Gibeon, and Chephirah, and Beeroth, and Kiriath-jearim.
    translation: JPS 1917
    original: וַיִּסְעוּ בְנֵי־יִשְׂרָאֵל וַיָּבֹאוּ אֶל־עָרֵיהֶם בַּיּוֹם הַשְּׁלִישִׁי וְעָרֵיהֶם גִּבְעוֹן וְהַכְּפִירָה וּבְאֵרוֹת וְקִרְיַת יְעָרִים׃
    hebrewPlain: ויסעו בני ישראל ויבאו אל עריהם ביום השלישי ועריהם גבעון והכפירה ובארות וקרית יערים
    kjvRefs:
    - Joshua 9:17
    kjvOsis:
    - Josh.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.18
    scripture: tanakh
    name: Tanakh Joshua 9:18
    ref: Joshua 9:18
    book: Josh
    section: neviim
    chapter: 9
    verse: 18
    ordinal: 6050
    text: And the children of Israel smote them not, because the princes of the congregation had sworn unto them by the LORD, the God of Israel. And all the congregation murmured against the princes.
    translation: JPS 1917
    original: וְלֹא הִכּוּם בְּנֵי יִשְׂרָאֵל כִּי־נִשְׁבְּעוּ לָהֶם נְשִׂיאֵי הָעֵדָה בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל וַיִּלֹּנוּ כָל־הָעֵדָה עַל־הַנְּשִׂיאִים׃
    hebrewPlain: ולא הכום בני ישראל כי נשבעו להם נשיאי העדה ביהוה אלהי ישראל וילנו כל העדה על הנשיאים
    kjvRefs:
    - Joshua 9:18
    kjvOsis:
    - Josh.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.19
    scripture: tanakh
    name: Tanakh Joshua 9:19
    ref: Joshua 9:19
    book: Josh
    section: neviim
    chapter: 9
    verse: 19
    ordinal: 6051
    text: 'But all the princes said unto all the congregation: ‘We have sworn unto them by the LORD, the God of Israel; now therefore we may not touch them.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ כָל־הַנְּשִׂיאִים אֶל־כָּל־הָעֵדָה אֲנַחְנוּ נִשְׁבַּעְנוּ לָהֶם בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל וְעַתָּה לֹא נוּכַל לִנְגֹּעַ בָּהֶם׃
    hebrewPlain: ויאמרו כל הנשיאים אל כל העדה אנחנו נשבענו להם ביהוה אלהי ישראל ועתה לא נוכל לנגע בהם
    kjvRefs:
    - Joshua 9:19
    kjvOsis:
    - Josh.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.20
    scripture: tanakh
    name: Tanakh Joshua 9:20
    ref: Joshua 9:20
    book: Josh
    section: neviim
    chapter: 9
    verse: 20
    ordinal: 6052
    text: This we will do to them, and let them live; lest wrath be upon us, because of the oath which we swore unto them.’
    translation: JPS 1917
    original: זֹאת נַעֲשֶׂה לָהֶם וְהַחֲיֵה אוֹתָם וְלֹא־יִהְיֶה עָלֵינוּ קֶצֶף עַל־הַשְּׁבוּעָה אֲשֶׁר־נִשְׁבַּעְנוּ לָהֶם׃
    hebrewPlain: זאת נעשה להם והחיה אותם ולא יהיה עלינו קצף על השבועה אשר נשבענו להם
    kjvRefs:
    - Joshua 9:20
    kjvOsis:
    - Josh.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.21
    scripture: tanakh
    name: Tanakh Joshua 9:21
    ref: Joshua 9:21
    book: Josh
    section: neviim
    chapter: 9
    verse: 21
    ordinal: 6053
    text: 'And the princes said concerning them: ‘Let them live’; so they became hewers of wood and drawers of water unto all the congregation, as the princes had spoken concerning them.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֲלֵיהֶם הַנְּשִׂיאִים יִחְיוּ וַיִּהְיוּ חֹטְבֵי עֵצִים וְשֹׁאֲבֵי־מַיִם לְכָל־הָעֵדָה כַּאֲשֶׁר דִּבְּרוּ לָהֶם הַנְּשִׂיאִים׃
    hebrewPlain: ויאמרו אליהם הנשיאים יחיו ויהיו חטבי עצים ושאבי מים לכל העדה כאשר דברו להם הנשיאים
    kjvRefs:
    - Joshua 9:21
    kjvOsis:
    - Josh.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.22
    scripture: tanakh
    name: Tanakh Joshua 9:22
    ref: Joshua 9:22
    book: Josh
    section: neviim
    chapter: 9
    verse: 22
    ordinal: 6054
    text: 'And Joshua called for them, and he spoke unto them, saying: ‘Wherefore have ye beguiled us, saying: We are very far from you, when ye dwell among us?'
    translation: JPS 1917
    original: וַיִּקְרָא לָהֶם יְהוֹשֻׁעַ וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר לָמָּה רִמִּיתֶם אֹתָנוּ לֵאמֹר רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד וְאַתֶּם בְּקִרְבֵּנוּ יֹשְׁבִים׃
    hebrewPlain: ויקרא להם יהושע וידבר אליהם לאמר למה רמיתם אתנו לאמר רחוקים אנחנו מכם מאד ואתם בקרבנו ישבים
    kjvRefs:
    - Joshua 9:22
    kjvOsis:
    - Josh.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.23
    scripture: tanakh
    name: Tanakh Joshua 9:23
    ref: Joshua 9:23
    book: Josh
    section: neviim
    chapter: 9
    verse: 23
    ordinal: 6055
    text: Now therefore ye are cursed, and there shall never fail to be of you bondmen, both hewers of wood and drawers of water for the house of my God.’
    translation: JPS 1917
    original: וְעַתָּה אֲרוּרִים אַתֶּם וְלֹא־יִכָּרֵת מִכֶּם עֶבֶד וְחֹטְבֵי עֵצִים וְשֹׁאֲבֵי־מַיִם לְבֵית אֱלֹהָי׃
    hebrewPlain: ועתה ארורים אתם ולא יכרת מכם עבד וחטבי עצים ושאבי מים לבית אלהי
    kjvRefs:
    - Joshua 9:23
    kjvOsis:
    - Josh.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.24
    scripture: tanakh
    name: Tanakh Joshua 9:24
    ref: Joshua 9:24
    book: Josh
    section: neviim
    chapter: 9
    verse: 24
    ordinal: 6056
    text: 'And they answered Joshua, and said: ‘Because it was certainly told thy servants, how that the LORD thy God commanded His servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you; therefore we were sore afraid for our lives because of you, and have done this thing.'
    translation: JPS 1917
    original: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ כִּי הֻגֵּד הֻגַּד לַעֲבָדֶיךָ אֵת אֲשֶׁר צִוָּה יְהוָה אֱלֹהֶיךָ אֶת־מֹשֶׁה עַבְדּוֹ לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם וַנַּעֲשֵׂה אֶת־הַדָּבָר הַזֶּה׃
    hebrewPlain: ויענו את יהושע ויאמרו כי הגד הגד לעבדיך את אשר צוה יהוה אלהיך את משה עבדו לתת לכם את כל הארץ ולהשמיד את כל ישבי הארץ מפניכם ונירא מאד לנפשתינו מפניכם ונעשה את הדבר הזה
    kjvRefs:
    - Joshua 9:24
    kjvOsis:
    - Josh.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.25
    scripture: tanakh
    name: Tanakh Joshua 9:25
    ref: Joshua 9:25
    book: Josh
    section: neviim
    chapter: 9
    verse: 25
    ordinal: 6057
    text: 'And now, behold, we are in thy hand: as it seemeth good and right unto thee to do unto us, do.’'
    translation: JPS 1917
    original: וְעַתָּה הִנְנוּ בְיָדֶךָ כַּטּוֹב וְכַיָּשָׁר בְּעֵינֶיךָ לַעֲשׂוֹת לָנוּ עֲשֵׂה׃
    hebrewPlain: ועתה הננו בידך כטוב וכישר בעיניך לעשות לנו עשה
    kjvRefs:
    - Joshua 9:25
    kjvOsis:
    - Josh.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.26
    scripture: tanakh
    name: Tanakh Joshua 9:26
    ref: Joshua 9:26
    book: Josh
    section: neviim
    chapter: 9
    verse: 26
    ordinal: 6058
    text: And so did he unto them, and delivered them out of the hand of the children of Israel, that they slew them not.
    translation: JPS 1917
    original: וַיַּעַשׂ לָהֶם כֵּן וַיַּצֵּל אוֹתָם מִיַּד בְּנֵי־יִשְׂרָאֵל וְלֹא הֲרָגוּם׃
    hebrewPlain: ויעש להם כן ויצל אותם מיד בני ישראל ולא הרגום
    kjvRefs:
    - Joshua 9:26
    kjvOsis:
    - Josh.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.9.27
    scripture: tanakh
    name: Tanakh Joshua 9:27
    ref: Joshua 9:27
    book: Josh
    section: neviim
    chapter: 9
    verse: 27
    ordinal: 6059
    text: And Joshua made them that day hewers of wood and drawers of water for the congregation, and for the altar of the LORD, unto this day, in the place which He should choose.
    translation: JPS 1917
    original: וַיִּתְּנֵם יְהוֹשֻׁעַ בַּיּוֹם הַהוּא חֹטְבֵי עֵצִים וְשֹׁאֲבֵי מַיִם לָעֵדָה וּלְמִזְבַּח יְהוָה עַד־הַיּוֹם הַזֶּה אֶל־הַמָּקוֹם אֲשֶׁר יִבְחָר׃
    hebrewPlain: ויתנם יהושע ביום ההוא חטבי עצים ושאבי מים לעדה ולמזבח יהוה עד היום הזה אל המקום אשר יבחר
    kjvRefs:
    - Joshua 9:27
    kjvOsis:
    - Josh.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.9
- type: TanakhVerse
  data:
    osis: Josh.10.1
    scripture: tanakh
    name: Tanakh Joshua 10:1
    ref: Joshua 10:1
    book: Josh
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 6060
    text: Now it came to pass, when Adoni-zedek king of Jerusalem heard how Joshua had taken Ai, and had utterly destroyed it; as he had done to Jericho and her king, so he had done to Ai and her king; and how the inhabitants of Gibeon had made peace with Israel, and were among them;
    translation: JPS 1917
    original: וַיְהִי כִשְׁמֹעַ אֲדֹנִי־צֶדֶק מֶלֶךְ יְרוּשָׁלִַם כִּי־לָכַד יְהוֹשֻׁעַ אֶת־הָעַי וַיַּחֲרִימָהּ כַּאֲשֶׁר עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ כֵּן־עָשָׂה לָעַי וּלְמַלְכָּהּ וְכִי הִשְׁלִימוּ יֹשְׁבֵי גִבְעוֹן אֶת־יִשְׂרָאֵל וַיִּהְיוּ בְּקִרְבָּם׃
    hebrewPlain: ויהי כשמע אדני צדק מלך ירושלם כי לכד יהושע את העי ויחרימה כאשר עשה ליריחו ולמלכה כן עשה לעי ולמלכה וכי השלימו ישבי גבעון את ישראל ויהיו בקרבם
    kjvRefs:
    - Joshua 10:1
    kjvOsis:
    - Josh.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.2
    scripture: tanakh
    name: Tanakh Joshua 10:2
    ref: Joshua 10:2
    book: Josh
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 6061
    text: that they feared greatly, because Gibeon was a great city, as one of the royal cities, and because it was greater than Ai, and all the men thereof were mighty.
    translation: JPS 1917
    original: וַיִּירְאוּ מְאֹד כִּי עִיר גְּדוֹלָה גִּבְעוֹן כְּאַחַת עָרֵי הַמַּמְלָכָה וְכִי הִיא גְדוֹלָה מִן־הָעַי וְכָל־אֲנָשֶׁיהָ גִּבֹּרִים׃
    hebrewPlain: וייראו מאד כי עיר גדולה גבעון כאחת ערי הממלכה וכי היא גדולה מן העי וכל אנשיה גברים
    kjvRefs:
    - Joshua 10:2
    kjvOsis:
    - Josh.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.3
    scripture: tanakh
    name: Tanakh Joshua 10:3
    ref: Joshua 10:3
    book: Josh
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 6062
    text: 'Wherefore Adoni-zedek king of Jerusalem sent unto Hoham king of Hebron, and unto Piram king of Jarmuth, and unto Japhia king of Lachish, and unto Debir king of Eglon, saying:'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֲדֹנִי־צֶדֶק מֶלֶךְ יְרוּשָׁלִַם אֶל־הוֹהָם מֶלֶךְ־חֶבְרוֹן וְאֶל־פִּרְאָם מֶלֶךְ־יַרְמוּת וְאֶל־יָפִיעַ מֶלֶךְ־לָכִישׁ וְאֶל־דְּבִיר מֶלֶךְ־עֶגְלוֹן לֵאמֹר׃
    hebrewPlain: וישלח אדני צדק מלך ירושלם אל הוהם מלך חברון ואל פראם מלך ירמות ואל יפיע מלך לכיש ואל דביר מלך עגלון לאמר
    kjvRefs:
    - Joshua 10:3
    kjvOsis:
    - Josh.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.4
    scripture: tanakh
    name: Tanakh Joshua 10:4
    ref: Joshua 10:4
    book: Josh
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 6063
    text: ’Come up unto me, and help me, and let us smite Gibeon; for it hath made peace with Joshua and with the children of Israel.’
    translation: JPS 1917
    original: עֲלוּ־אֵלַי וְעִזְרֻנִי וְנַכֶּה אֶת־גִּבְעוֹן כִּי־הִשְׁלִימָה אֶת־יְהוֹשֻׁעַ וְאֶת־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: עלו אלי ועזרני ונכה את גבעון כי השלימה את יהושע ואת בני ישראל
    kjvRefs:
    - Joshua 10:4
    kjvOsis:
    - Josh.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.5
    scripture: tanakh
    name: Tanakh Joshua 10:5
    ref: Joshua 10:5
    book: Josh
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 6064
    text: Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, gathered themselves together, and went up, they and all their hosts, and encamped against Gibeon, and made war against it.
    translation: JPS 1917
    original: וַיֵּאָסְפוּ וַיַּעֲלוּ חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי מֶלֶךְ יְרוּשָׁלִַם מֶלֶךְ־חֶבְרוֹן מֶלֶךְ־יַרְמוּת מֶלֶךְ־לָכִישׁ מֶלֶךְ־עֶגְלוֹן הֵם וְכָל־מַחֲנֵיהֶם וַיַּחֲנוּ עַל־גִּבְעוֹן וַיִּלָּחֲמוּ עָלֶיהָ׃
    hebrewPlain: ויאספו ויעלו חמשת מלכי האמרי מלך ירושלם מלך חברון מלך ירמות מלך לכיש מלך עגלון הם וכל מחניהם ויחנו על גבעון וילחמו עליה
    kjvRefs:
    - Joshua 10:5
    kjvOsis:
    - Josh.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.6
    scripture: tanakh
    name: Tanakh Joshua 10:6
    ref: Joshua 10:6
    book: Josh
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 6065
    text: 'And the men of Gibeon sent unto Joshua to the camp to Gilgal, saying: ‘Slack not thy hands from thy servants; come up to us quickly, and save us, and help us; for all the kings of the Amorites that dwell in the hill-country are gathered together against us.’'
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּלָה לֵאמֹר אַל־תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ עֲלֵה אֵלֵינוּ מְהֵרָה וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ כִּי נִקְבְּצוּ אֵלֵינוּ כָּל־מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר׃
    hebrewPlain: וישלחו אנשי גבעון אל יהושע אל המחנה הגלגלה לאמר אל תרף ידיך מעבדיך עלה אלינו מהרה והושיעה לנו ועזרנו כי נקבצו אלינו כל מלכי האמרי ישבי ההר
    kjvRefs:
    - Joshua 10:6
    kjvOsis:
    - Josh.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.7
    scripture: tanakh
    name: Tanakh Joshua 10:7
    ref: Joshua 10:7
    book: Josh
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 6066
    text: So Joshua went up from Gilgal, he, and all the people of war with him, and all the mighty men of valour.
    translation: JPS 1917
    original: וַיַּעַל יְהוֹשֻׁעַ מִן־הַגִּלְגָּל הוּא וְכָל־עַם הַמִּלְחָמָה עִמּוֹ וְכֹל גִּבּוֹרֵי הֶחָיִל׃
    hebrewPlain: ויעל יהושע מן הגלגל הוא וכל עם המלחמה עמו וכל גבורי החיל
    kjvRefs:
    - Joshua 10:7
    kjvOsis:
    - Josh.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.8
    scripture: tanakh
    name: Tanakh Joshua 10:8
    ref: Joshua 10:8
    book: Josh
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 6067
    text: 'And the LORD said unto Joshua: ‘Fear them not; for I have delivered them into thy hand; there shall not a man of them stand against thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יְהוֹשֻׁעַ אַל־תִּירָא מֵהֶם כִּי בְיָדְךָ נְתַתִּים לֹא־יַעֲמֹד אִישׁ מֵהֶם בְּפָנֶיךָ׃
    hebrewPlain: ויאמר יהוה אל יהושע אל תירא מהם כי בידך נתתים לא יעמד איש מהם בפניך
    kjvRefs:
    - Joshua 10:8
    kjvOsis:
    - Josh.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.9
    scripture: tanakh
    name: Tanakh Joshua 10:9
    ref: Joshua 10:9
    book: Josh
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 6068
    text: Joshua therefore came upon them suddenly; for he went up from Gilgal all the night.
    translation: JPS 1917
    original: וַיָּבֹא אֲלֵיהֶם יְהוֹשֻׁעַ פִּתְאֹם כָּל־הַלַּיְלָה עָלָה מִן־הַגִּלְגָּל׃
    hebrewPlain: ויבא אליהם יהושע פתאם כל הלילה עלה מן הגלגל
    kjvRefs:
    - Joshua 10:9
    kjvOsis:
    - Josh.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.10
    scripture: tanakh
    name: Tanakh Joshua 10:10
    ref: Joshua 10:10
    book: Josh
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 6069
    text: And the LORD discomfited them before Israel, and slew them with a great slaughter at Gibeon; and they chased them by the way of the ascent of Beth-horon, and smote them to Azekah, and unto Makkedah.
    translation: JPS 1917
    original: וַיְהֻמֵּם יְהוָה לִפְנֵי יִשְׂרָאֵל וַיַּכֵּם מַכָּה־גְדוֹלָה בְּגִבְעוֹן וַיִּרְדְּפֵם דֶּרֶךְ מַעֲלֵה בֵית־חוֹרֹן וַיַּכֵּם עַד־עֲזֵקָה וְעַד־מַקֵּדָה׃
    hebrewPlain: ויהמם יהוה לפני ישראל ויכם מכה גדולה בגבעון וירדפם דרך מעלה בית חורן ויכם עד עזקה ועד מקדה
    kjvRefs:
    - Joshua 10:10
    kjvOsis:
    - Josh.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.11
    scripture: tanakh
    name: Tanakh Joshua 10:11
    ref: Joshua 10:11
    book: Josh
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 6070
    text: And it came to pass, as they fled from before Israel, while they were at the descent of Beth-horon, that the LORD cast down great stones from heaven upon them unto Azekah, and they died; they were more who died with the hailstones than they whom the children of Israel slew with the sword.
    translation: JPS 1917
    original: וַיְהִי בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל הֵם בְּמוֹרַד בֵּית־חוֹרֹן וַיהוָה הִשְׁלִיךְ עֲלֵיהֶם אֲבָנִים גְּדֹלוֹת מִן־הַשָּׁמַיִם עַד־עֲזֵקָה וַיָּמֻתוּ רַבִּים אֲשֶׁר־מֵתוּ בְּאַבְנֵי הַבָּרָד מֵאֲשֶׁר הָרְגוּ בְּנֵי יִשְׂרָאֵל בֶּחָרֶב׃
    hebrewPlain: ויהי בנסם מפני ישראל הם במורד בית חורן ויהוה השליך עליהם אבנים גדלות מן השמים עד עזקה וימתו רבים אשר מתו באבני הברד מאשר הרגו בני ישראל בחרב
    kjvRefs:
    - Joshua 10:11
    kjvOsis:
    - Josh.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.12
    scripture: tanakh
    name: Tanakh Joshua 10:12
    ref: Joshua 10:12
    book: Josh
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 6071
    text: 'Then spoke Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel; and he said in the sight of Israel: ‘Sun, stand thou still upon Gibeon; And thou, Moon, in the valley of Aijalon.’'
    translation: JPS 1917
    original: אָז יְדַבֵּר יְהוֹשֻׁעַ לַיהוָה בְּיוֹם תֵּת יְהוָה אֶת־הָאֱמֹרִי לִפְנֵי בְּנֵי יִשְׂרָאֵל וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל שֶׁמֶשׁ בְּגִבְעוֹן דּוֹם וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן׃
    hebrewPlain: אז ידבר יהושע ליהוה ביום תת יהוה את האמרי לפני בני ישראל ויאמר לעיני ישראל שמש בגבעון דום וירח בעמק אילון
    kjvRefs:
    - Joshua 10:12
    kjvOsis:
    - Josh.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.13
    scripture: tanakh
    name: Tanakh Joshua 10:13
    ref: Joshua 10:13
    book: Josh
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 6072
    text: And the sun stood still, and the moon stayed, Until the nation had avenged themselves of their enemies. Is not this written in the book of Jashar? And the sun stayed in the midst of heaven, and hasted not to go down about a whole day.
    translation: JPS 1917
    original: וַיִּדֹּם הַשֶּׁמֶשׁ וְיָרֵחַ עָמָד עַד־יִקֹּם גּוֹי אֹיְבָיו הֲלֹא־הִיא כְתוּבָה עַל־סֵפֶר הַיָּשָׁר וַיַּעֲמֹד הַשֶּׁמֶשׁ בַּחֲצִי הַשָּׁמַיִם וְלֹא־אָץ לָבוֹא כְּיוֹם תָּמִים׃
    hebrewPlain: וידם השמש וירח עמד עד יקם גוי איביו הלא היא כתובה על ספר הישר ויעמד השמש בחצי השמים ולא אץ לבוא כיום תמים
    kjvRefs:
    - Joshua 10:13
    kjvOsis:
    - Josh.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.14
    scripture: tanakh
    name: Tanakh Joshua 10:14
    ref: Joshua 10:14
    book: Josh
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 6073
    text: And there was no day like that before it or after it, that the LORD hearkened unto the voice of a man; for the LORD fought for Israel.
    translation: JPS 1917
    original: וְלֹא הָיָה כַּיּוֹם הַהוּא לְפָנָיו וְאַחֲרָיו לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ כִּי יְהוָה נִלְחָם לְיִשְׂרָאֵל׃
    hebrewPlain: ולא היה כיום ההוא לפניו ואחריו לשמע יהוה בקול איש כי יהוה נלחם לישראל
    kjvRefs:
    - Joshua 10:14
    kjvOsis:
    - Josh.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.15
    scripture: tanakh
    name: Tanakh Joshua 10:15
    ref: Joshua 10:15
    book: Josh
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 6074
    text: And Joshua returned, and all Israel with him, unto the camp to Gilgal.
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ אֶל־הַמַּחֲנֶה הַגִּלְגָּלָה׃
    hebrewPlain: וישב יהושע וכל ישראל עמו אל המחנה הגלגלה
    kjvRefs:
    - Joshua 10:15
    kjvOsis:
    - Josh.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.16
    scripture: tanakh
    name: Tanakh Joshua 10:16
    ref: Joshua 10:16
    book: Josh
    section: neviim
    chapter: 10
    verse: 16
    ordinal: 6075
    text: And these five kings fled, and hid themselves in the cave at Makkedah.
    translation: JPS 1917
    original: וַיָּנֻסוּ חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה וַיֵּחָבְאוּ בַמְּעָרָה בְּמַקֵּדָה׃
    hebrewPlain: וינסו חמשת המלכים האלה ויחבאו במערה במקדה
    kjvRefs:
    - Joshua 10:16
    kjvOsis:
    - Josh.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.17
    scripture: tanakh
    name: Tanakh Joshua 10:17
    ref: Joshua 10:17
    book: Josh
    section: neviim
    chapter: 10
    verse: 17
    ordinal: 6076
    text: 'And it was told Joshua, saying: ‘The five kings are found, hidden in the cave at Makkedah.’'
    translation: JPS 1917
    original: וַיֻּגַּד לִיהוֹשֻׁעַ לֵאמֹר נִמְצְאוּ חֲמֵשֶׁת הַמְּלָכִים נֶחְבְּאִים בַּמְּעָרָה בְּמַקֵּדָה׃
    hebrewPlain: ויגד ליהושע לאמר נמצאו חמשת המלכים נחבאים במערה במקדה
    kjvRefs:
    - Joshua 10:17
    kjvOsis:
    - Josh.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.18
    scripture: tanakh
    name: Tanakh Joshua 10:18
    ref: Joshua 10:18
    book: Josh
    section: neviim
    chapter: 10
    verse: 18
    ordinal: 6077
    text: 'And Joshua said: ‘Roll great stones unto the mouth of the cave, and set men by it to keep them;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ גֹּלּוּ אֲבָנִים גְּדֹלוֹת אֶל־פִּי הַמְּעָרָה וְהַפְקִידוּ עָלֶיהָ אֲנָשִׁים לְשָׁמְרָם׃
    hebrewPlain: ויאמר יהושע גלו אבנים גדלות אל פי המערה והפקידו עליה אנשים לשמרם
    kjvRefs:
    - Joshua 10:18
    kjvOsis:
    - Josh.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.19
    scripture: tanakh
    name: Tanakh Joshua 10:19
    ref: Joshua 10:19
    book: Josh
    section: neviim
    chapter: 10
    verse: 19
    ordinal: 6078
    text: but stay not ye; pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities; for the LORD your God hath delivered them into your hand.’
    translation: JPS 1917
    original: וְאַתֶּם אַל־תַּעֲמֹדוּ רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם וְזִנַּבְתֶּם אוֹתָם אַל־תִּתְּנוּם לָבוֹא אֶל־עָרֵיהֶם כִּי נְתָנָם יְהוָה אֱלֹהֵיכֶם בְּיֶדְכֶם׃
    hebrewPlain: ואתם אל תעמדו רדפו אחרי איביכם וזנבתם אותם אל תתנום לבוא אל עריהם כי נתנם יהוה אלהיכם בידכם
    kjvRefs:
    - Joshua 10:19
    kjvOsis:
    - Josh.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.20
    scripture: tanakh
    name: Tanakh Joshua 10:20
    ref: Joshua 10:20
    book: Josh
    section: neviim
    chapter: 10
    verse: 20
    ordinal: 6079
    text: And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, and the remnant which remained of them had entered into the fortified cities,
    translation: JPS 1917
    original: וַיְהִי כְּכַלּוֹת יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל לְהַכּוֹתָם מַכָּה גְדוֹלָה־מְאֹד עַד־תֻּמָּם וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם וַיָּבֹאוּ אֶל־עָרֵי הַמִּבְצָר׃
    hebrewPlain: ויהי ככלות יהושע ובני ישראל להכותם מכה גדולה מאד עד תמם והשרידים שרדו מהם ויבאו אל ערי המבצר
    kjvRefs:
    - Joshua 10:20
    kjvOsis:
    - Josh.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.21
    scripture: tanakh
    name: Tanakh Joshua 10:21
    ref: Joshua 10:21
    book: Josh
    section: neviim
    chapter: 10
    verse: 21
    ordinal: 6080
    text: that all the people returned to the camp to Joshua at Makkedah in peace; none whetted his tongue against any of the children of Israel.
    translation: JPS 1917
    original: וַיָּשֻׁבוּ כָל־הָעָם אֶל־הַמַּחֲנֶה אֶל־יְהוֹשֻׁעַ מַקֵּדָה בְּשָׁלוֹם לֹא־חָרַץ לִבְנֵי יִשְׂרָאֵל לְאִישׁ אֶת־לְשֹׁנוֹ׃
    hebrewPlain: וישבו כל העם אל המחנה אל יהושע מקדה בשלום לא חרץ לבני ישראל לאיש את לשנו
    kjvRefs:
    - Joshua 10:21
    kjvOsis:
    - Josh.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.22
    scripture: tanakh
    name: Tanakh Joshua 10:22
    ref: Joshua 10:22
    book: Josh
    section: neviim
    chapter: 10
    verse: 22
    ordinal: 6081
    text: 'Then said Joshua: ‘Open the mouth of the cave, and bring forth those five kings unto me out of the cave.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשֻׁעַ פִּתְחוּ אֶת־פִּי הַמְּעָרָה וְהוֹצִיאוּ אֵלַי אֶת־חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה מִן־הַמְּעָרָה׃
    hebrewPlain: ויאמר יהושע פתחו את פי המערה והוציאו אלי את חמשת המלכים האלה מן המערה
    kjvRefs:
    - Joshua 10:22
    kjvOsis:
    - Josh.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.23
    scripture: tanakh
    name: Tanakh Joshua 10:23
    ref: Joshua 10:23
    book: Josh
    section: neviim
    chapter: 10
    verse: 23
    ordinal: 6082
    text: And they did so, and brought forth those five kings unto him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ כֵן וַיֹּצִיאוּ אֵלָיו אֶת־חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה מִן־הַמְּעָרָה אֵת מֶלֶךְ יְרוּשָׁלִַם אֶת־מֶלֶךְ חֶבְרוֹן אֶת־מֶלֶךְ יַרְמוּת אֶת־מֶלֶךְ לָכִישׁ אֶת־מֶלֶךְ עֶגְלוֹן׃
    hebrewPlain: ויעשו כן ויציאו אליו את חמשת המלכים האלה מן המערה את מלך ירושלם את מלך חברון את מלך ירמות את מלך לכיש את מלך עגלון
    kjvRefs:
    - Joshua 10:23
    kjvOsis:
    - Josh.10.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.24
    scripture: tanakh
    name: Tanakh Joshua 10:24
    ref: Joshua 10:24
    book: Josh
    section: neviim
    chapter: 10
    verse: 24
    ordinal: 6083
    text: 'And it came to pass, when they brought forth those kings unto Joshua, that Joshua called for all the men of Israel, and said unto the chiefs of the men of war that went with him: ‘Come near, put your feet upon the necks of these kings.’ And they came near, and put their feet upon the necks of them.'
    translation: JPS 1917
    original: וַיְהִי כְּהוֹצִיאָם אֶת־הַמְּלָכִים הָאֵלֶּה אֶל־יְהוֹשֻׁעַ וַיִּקְרָא יְהוֹשֻׁעַ אֶל־כָּל־אִישׁ יִשְׂרָאֵל וַיֹּאמֶר אֶל־קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה הֶהָלְכוּא אִתּוֹ קִרְבוּ שִׂימוּ אֶת־רַגְלֵיכֶם עַל־צַוְּארֵי הַמְּלָכִים הָאֵלֶּה וַיִּקְרְבוּ וַיָּשִׂימוּ אֶת־רַגְלֵיהֶם עַל־צַוְּארֵיהֶם׃
    hebrewPlain: ויהי כהוציאם את המלכים האלה אל יהושע ויקרא יהושע אל כל איש ישראל ויאמר אל קציני אנשי המלחמה ההלכוא אתו קרבו שימו את רגליכם על צוארי המלכים האלה ויקרבו וישימו את רגליהם על צואריהם
    kjvRefs:
    - Joshua 10:24
    kjvOsis:
    - Josh.10.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.25
    scripture: tanakh
    name: Tanakh Joshua 10:25
    ref: Joshua 10:25
    book: Josh
    section: neviim
    chapter: 10
    verse: 25
    ordinal: 6084
    text: 'And Joshua said unto them: ‘Fear not, nor be dismayed; be strong and of good courage; for thus shall the LORD do to all your enemies against whom ye fight.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ אַל־תִּירְאוּ וְאַל־תֵּחָתּוּ חִזְקוּ וְאִמְצוּ כִּי כָכָה יַעֲשֶׂה יְהוָה לְכָל־אֹיְבֵיכֶם אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם׃
    hebrewPlain: ויאמר אליהם יהושע אל תיראו ואל תחתו חזקו ואמצו כי ככה יעשה יהוה לכל איביכם אשר אתם נלחמים אותם
    kjvRefs:
    - Joshua 10:25
    kjvOsis:
    - Josh.10.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.26
    scripture: tanakh
    name: Tanakh Joshua 10:26
    ref: Joshua 10:26
    book: Josh
    section: neviim
    chapter: 10
    verse: 26
    ordinal: 6085
    text: And afterward Joshua smote them, and put them to death, and hanged them on five trees; and they were hanging upon the trees until the evening.
    translation: JPS 1917
    original: וַיַּכֵּם יְהוֹשֻׁעַ אַחֲרֵי־כֵן וַיְמִיתֵם וַיִּתְלֵם עַל חֲמִשָּׁה עֵצִים וַיִּהְיוּ תְּלוּיִם עַל־הָעֵצִים עַד־הָעָרֶב׃
    hebrewPlain: ויכם יהושע אחרי כן וימיתם ויתלם על חמשה עצים ויהיו תלוים על העצים עד הערב
    kjvRefs:
    - Joshua 10:26
    kjvOsis:
    - Josh.10.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.27
    scripture: tanakh
    name: Tanakh Joshua 10:27
    ref: Joshua 10:27
    book: Josh
    section: neviim
    chapter: 10
    verse: 27
    ordinal: 6086
    text: And it came to pass at the time of the going down of the sun, that Joshua commanded, and they took them down off the trees, and cast them into the cave wherein they had hidden themselves, and laid great stones on the mouth of the cave, unto this very day.
    translation: JPS 1917
    original: וַיְהִי לְעֵת בּוֹא הַשֶּׁמֶשׁ צִוָּה יְהוֹשֻׁעַ וַיֹּרִידוּם מֵעַל הָעֵצִים וַיַּשְׁלִכֻם אֶל־הַמְּעָרָה אֲשֶׁר נֶחְבְּאוּ־שָׁם וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת עַל־פִּי הַמְּעָרָה עַד־עֶצֶם הַיּוֹם הַזֶּה׃
    hebrewPlain: ויהי לעת בוא השמש צוה יהושע וירידום מעל העצים וישלכם אל המערה אשר נחבאו שם וישמו אבנים גדלות על פי המערה עד עצם היום הזה
    kjvRefs:
    - Joshua 10:27
    kjvOsis:
    - Josh.10.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.28
    scripture: tanakh
    name: Tanakh Joshua 10:28
    ref: Joshua 10:28
    book: Josh
    section: neviim
    chapter: 10
    verse: 28
    ordinal: 6087
    text: And Joshua took Makkedah on that day, and smote it with the edge of the sword, and the king thereof; he utterly destroyed them and all the souls that were therein, he left none remaining; and he did to the king of Makkedah as he had done unto the king of Jericho.
    translation: JPS 1917
    original: וְאֶת־מַקֵּדָה לָכַד יְהוֹשֻׁעַ בַּיּוֹם הַהוּא וַיַּכֶּהָ לְפִי־חֶרֶב וְאֶת־מַלְכָּהּ הֶחֱרִם אוֹתָם וְאֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ לֹא הִשְׁאִיר שָׂרִיד וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ׃
    hebrewPlain: ואת מקדה לכד יהושע ביום ההוא ויכה לפי חרב ואת מלכה החרם אותם ואת כל הנפש אשר בה לא השאיר שריד ויעש למלך מקדה כאשר עשה למלך יריחו
    kjvRefs:
    - Joshua 10:28
    kjvOsis:
    - Josh.10.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.29
    scripture: tanakh
    name: Tanakh Joshua 10:29
    ref: Joshua 10:29
    book: Josh
    section: neviim
    chapter: 10
    verse: 29
    ordinal: 6088
    text: And Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah.
    translation: JPS 1917
    original: וַיַּעֲבֹר יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ מִמַּקֵּדָה לִבְנָה וַיִּלָּחֶם עִם־לִבְנָה׃
    hebrewPlain: ויעבר יהושע וכל ישראל עמו ממקדה לבנה וילחם עם לבנה
    kjvRefs:
    - Joshua 10:29
    kjvOsis:
    - Josh.10.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.30
    scripture: tanakh
    name: Tanakh Joshua 10:30
    ref: Joshua 10:30
    book: Josh
    section: neviim
    chapter: 10
    verse: 30
    ordinal: 6089
    text: And the LORD delivered it also, and the king thereof, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that were therein; he left none remaining in it; and he did unto the king thereof as he had done unto the king of Jericho.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה גַּם־אוֹתָהּ בְּיַד יִשְׂרָאֵל וְאֶת־מַלְכָּהּ וַיַּכֶּהָ לְפִי־חֶרֶב וְאֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ לֹא־הִשְׁאִיר בָּהּ שָׂרִיד וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ׃
    hebrewPlain: ויתן יהוה גם אותה ביד ישראל ואת מלכה ויכה לפי חרב ואת כל הנפש אשר בה לא השאיר בה שריד ויעש למלכה כאשר עשה למלך יריחו
    kjvRefs:
    - Joshua 10:30
    kjvOsis:
    - Josh.10.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.31
    scripture: tanakh
    name: Tanakh Joshua 10:31
    ref: Joshua 10:31
    book: Josh
    section: neviim
    chapter: 10
    verse: 31
    ordinal: 6090
    text: And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought against it.
    translation: JPS 1917
    original: וַיַּעֲבֹר יְהוֹשֻׁעַ וְכָל־יִשְׂרָאֵל עִמּוֹ מִלִּבְנָה לָכִישָׁה וַיִּחַן עָלֶיהָ וַיִּלָּחֶם בָּהּ׃
    hebrewPlain: ויעבר יהושע וכל ישראל עמו מלבנה לכישה ויחן עליה וילחם בה
    kjvRefs:
    - Joshua 10:31
    kjvOsis:
    - Josh.10.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.10
- type: TanakhVerse
  data:
    osis: Josh.10.32
    scripture: tanakh
    name: Tanakh Joshua 10:32
    ref: Joshua 10:32
    book: Josh
    section: neviim
    chapter: 10
    verse: 32
    ordinal: 6091
    text: And the LORD delivered Lachish into the hand of Israel, and he took it on the second day, and smote it with the edge of the sword, and all the souls that were therein, according to all that he had done to Libnah.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה אֶת־לָכִישׁ בְּיַד יִשְׂרָאֵל וַיִּלְכְּדָהּ בַּיּוֹם הַשֵּׁנִי וַיַּכֶּהָ לְפִי־חֶרֶב וְאֶת־כָּל־הַנֶּפֶשׁ אֲשֶׁר־בָּהּ כְּכֹל אֲשֶׁר־עָשָׂה לְלִבְנָה׃
    hebrewPlain: ויתן יהוה את לכיש ביד ישראל וילכדה ביום השני ויכה לפי חרב ואת כל הנפש אשר בה ככל אשר עשה ללבנה
    kjvRefs:
    - Joshua 10:32
    kjvOsis:
    - Josh.10.32
  relations:
  - predicate: IN
