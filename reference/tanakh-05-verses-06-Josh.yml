  data:
    osis: Josh.24.29
    scripture: tanakh
    name: Tanakh Joshua 24:29
    ref: Joshua 24:29
    book: Josh
    section: neviim
    chapter: 24
    verse: 29
    ordinal: 6500
    text: And it came to pass after these things, that Joshua the son of Nun, the servant of the LORD, died, being a hundred and ten years old.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה וַיָּמָת יְהוֹשֻׁעַ בִּן־נוּן עֶבֶד יְהוָה בֶּן־מֵאָה וָעֶשֶׂר שָׁנִים׃
    hebrewPlain: ויהי אחרי הדברים האלה וימת יהושע בן נון עבד יהוה בן מאה ועשר שנים
    kjvRefs:
    - Joshua 24:29
    kjvOsis:
    - Josh.24.29
  relations:
