    original: וַחֲצִי הַגִּלְעָד וְעַשְׁתָּרוֹת וְאֶדְרֶעִי עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן לִבְנֵי מָכִיר בֶּן־מְנַשֶּׁה לַחֲצִי בְנֵי־מָכִיר לְמִשְׁפְּחוֹתָם׃
    hebrewPlain: וחצי הגלעד ועשתרות ואדרעי ערי ממלכות עוג בבשן לבני מכיר בן מנשה לחצי בני מכיר למשפחותם
