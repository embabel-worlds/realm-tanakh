    original: וְהָיוּ הֶעָרִים לְמַטֵּה בְּנֵי בִנְיָמִן לְמִשְׁפְּחוֹתֵיהֶם יְרִיחוֹ וּבֵית־חָגְלָה וְעֵמֶק קְצִיץ׃
    hebrewPlain: והיו הערים למטה בני בנימן למשפחותיהם יריחו ובית חגלה ועמק קציץ
