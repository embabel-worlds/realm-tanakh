    ref: Joshua 19:1
    book: Josh
    section: neviim
    chapter: 19
    verse: 1
    ordinal: 6317
    text: And the second lot came out for Simeon, even for the tribe of the children of Simeon according to their families; and their inheritance was in the midst of the inheritance of the children of Judah.
    translation: JPS 1917
    original: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי לְשִׁמְעוֹן לְמַטֵּה בְנֵי־שִׁמְעוֹן לְמִשְׁפְּחוֹתָם וַיְהִי נַחֲלָתָם בְּתוֹךְ נַחֲלַת בְּנֵי־יְהוּדָה׃
    hebrewPlain: ויצא הגורל השני לשמעון למטה בני שמעון למשפחותם ויהי נחלתם בתוך נחלת בני יהודה
