    scripture: tanakh
    name: Tanakh Joshua 1:6
    ref: Joshua 1:6
    book: Josh
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 5852
    text: Be strong and of good courage; for thou shalt cause this people to inherit the land which I swore unto their fathers to give them.
    translation: JPS 1917
    original: חֲזַק וֶאֱמָץ כִּי אַתָּה תַּנְחִיל אֶת־הָעָם הַזֶּה אֶת־הָאָרֶץ אֲשֶׁר־נִשְׁבַּעְתִּי לַאֲבוֹתָם לָתֵת לָהֶם׃
    hebrewPlain: חזק ואמץ כי אתה תנחיל את העם הזה את הארץ אשר נשבעתי לאבותם לתת להם
    kjvRefs:
    - Joshua 1:6
    kjvOsis:
