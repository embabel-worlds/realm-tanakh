- type: TanakhVerse
  data:
    osis: Josh.13.1
    scripture: tanakh
    name: Tanakh Joshua 13:1
    ref: Joshua 13:1
    book: Josh
    section: neviim
    chapter: 13
    verse: 1
    ordinal: 6150
    text: 'Now Joshua was old and well stricken in years; and the LORD said unto him: ‘Thou art old and well stricken in years, and there remaineth yet very much land to be possessed.'
    translation: JPS 1917
    original: וִיהוֹשֻׁעַ זָקֵן בָּא בַּיָּמִים וַיֹּאמֶר יְהוָה אֵלָיו אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים וְהָאָרֶץ נִשְׁאֲרָה הַרְבֵּה־מְאֹד לְרִשְׁתָּהּ׃
    hebrewPlain: ויהושע זקן בא בימים ויאמר יהוה אליו אתה זקנתה באת בימים והארץ נשארה הרבה מאד לרשתה
    kjvRefs:
    - Joshua 13:1
    kjvOsis:
    - Josh.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.2
    scripture: tanakh
    name: Tanakh Joshua 13:2
    ref: Joshua 13:2
    book: Josh
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 6151
    text: 'This is the land that yet remaineth: all the regions of the Philistines, and all the Geshurites;'
    translation: JPS 1917
    original: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת כָּל־גְּלִילוֹת הַפְּלִשְׁתִּים וְכָל־הַגְּשׁוּרִי׃
    hebrewPlain: זאת הארץ הנשארת כל גלילות הפלשתים וכל הגשורי
    kjvRefs:
    - Joshua 13:2
    kjvOsis:
    - Josh.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.3
    scripture: tanakh
    name: Tanakh Joshua 13:3
    ref: Joshua 13:3
    book: Josh
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 6152
    text: 'from the Shihor, which is before Egypt, even unto the border of Ekron northward—which is counted to the Canaanites; the five lords of the Philistines: the Gazite, and the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite; also the Avvim'
    translation: JPS 1917
    original: מִן־הַשִּׁיחוֹר אֲשֶׁר עַל־פְּנֵי מִצְרַיִם וְעַד גְּבוּל עֶקְרוֹן צָפוֹנָה לַכְּנַעֲנִי תֵּחָשֵׁב חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים הָעַזָּתִי וְהָאַשְׁדּוֹדִי הָאֶשְׁקְלוֹנִי הַגִּתִּי וְהָעֶקְרוֹנִי וְהָעַוִּים׃
    hebrewPlain: מן השיחור אשר על פני מצרים ועד גבול עקרון צפונה לכנעני תחשב חמשת סרני פלשתים העזתי והאשדודי האשקלוני הגתי והעקרוני והעוים
    kjvRefs:
    - Joshua 13:3
    kjvOsis:
    - Josh.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.4
    scripture: tanakh
    name: Tanakh Joshua 13:4
    ref: Joshua 13:4
    book: Josh
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 6153
    text: on the south; all the land of the Canaanites, and Mearah that belongeth to the Zidonians, unto Aphek, to the border of the Amorites;
    translation: JPS 1917
    original: מִתֵּימָן כָּל־אֶרֶץ הַכְּנַעֲנִי וּמְעָרָה אֲשֶׁר לַצִּידֹנִים עַד־אֲפֵקָה עַד גְּבוּל הָאֱמֹרִי׃
    hebrewPlain: מתימן כל ארץ הכנעני ומערה אשר לצידנים עד אפקה עד גבול האמרי
    kjvRefs:
    - Joshua 13:4
    kjvOsis:
    - Josh.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.5
    scripture: tanakh
    name: Tanakh Joshua 13:5
    ref: Joshua 13:5
    book: Josh
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 6154
    text: and the land of the Gebalites, and all Lebanon, toward the sunrising, from Baal-gad under mount Hermon unto the entrance of Hamath;
    translation: JPS 1917
    original: וְהָאָרֶץ הַגִּבְלִי וְכָל־הַלְּבָנוֹן מִזְרַח הַשֶּׁמֶשׁ מִבַּעַל גָּד תַּחַת הַר־חֶרְמוֹן עַד לְבוֹא חֲמָת׃
    hebrewPlain: והארץ הגבלי וכל הלבנון מזרח השמש מבעל גד תחת הר חרמון עד לבוא חמת
    kjvRefs:
    - Joshua 13:5
    kjvOsis:
    - Josh.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.6
    scripture: tanakh
    name: Tanakh Joshua 13:6
    ref: Joshua 13:6
    book: Josh
    section: neviim
    chapter: 13
    verse: 6
    ordinal: 6155
    text: all the inhabitants of the hill-country from Lebanon unto Misrephoth-maim, even all the Zidonians; them will I drive out from before the children of Israel; only allot thou it unto Israel for an inheritance, as I have commanded thee.
    translation: JPS 1917
    original: כָּל־יֹשְׁבֵי הָהָר מִן־הַלְּבָנוֹן עַד־מִשְׂרְפֹת מַיִם כָּל־צִידֹנִים אָנֹכִי אוֹרִישֵׁם מִפְּנֵי בְּנֵי יִשְׂרָאֵל רַק הַפִּלֶהָ לְיִשְׂרָאֵל בְּנַחֲלָה כַּאֲשֶׁר צִוִּיתִיךָ׃
    hebrewPlain: כל ישבי ההר מן הלבנון עד משרפת מים כל צידנים אנכי אורישם מפני בני ישראל רק הפלה לישראל בנחלה כאשר צויתיך
    kjvRefs:
    - Joshua 13:6
    kjvOsis:
    - Josh.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.7
    scripture: tanakh
    name: Tanakh Joshua 13:7
    ref: Joshua 13:7
    book: Josh
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 6156
    text: Now therefore divide this land for an inheritance unto the nine tribes, and the half-tribe of Manasseh.’
    translation: JPS 1917
    original: וְעַתָּה חַלֵּק אֶת־הָאָרֶץ הַזֹּאת בְּנַחֲלָה לְתִשְׁעַת הַשְּׁבָטִים וַחֲצִי הַשֵּׁבֶט הַמְנַשֶּׁה׃
    hebrewPlain: ועתה חלק את הארץ הזאת בנחלה לתשעת השבטים וחצי השבט המנשה
    kjvRefs:
    - Joshua 13:7
    kjvOsis:
    - Josh.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.8
    scripture: tanakh
    name: Tanakh Joshua 13:8
    ref: Joshua 13:8
    book: Josh
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 6157
    text: With him the Reubenites and the Gadites received their inheritance, which Moses gave them, beyond the Jordan eastward, even as Moses the servant of the LORD gave them;
    translation: JPS 1917
    original: עִמּוֹ הָראוּבֵנִי וְהַגָּדִי לָקְחוּ נַחֲלָתָם אֲשֶׁר נָתַן לָהֶם מֹשֶׁה בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה כַּאֲשֶׁר נָתַן לָהֶם מֹשֶׁה עֶבֶד יְהוָה׃
    hebrewPlain: עמו הראובני והגדי לקחו נחלתם אשר נתן להם משה בעבר הירדן מזרחה כאשר נתן להם משה עבד יהוה
    kjvRefs:
    - Joshua 13:8
    kjvOsis:
    - Josh.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.9
    scripture: tanakh
    name: Tanakh Joshua 13:9
    ref: Joshua 13:9
    book: Josh
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 6158
    text: from Aroer, that is on the edge of the valley of Arnon, and the city that is in the middle of the valley, and all the table-land from Medeba unto Dibon;
    translation: JPS 1917
    original: מֵעֲרוֹעֵר אֲשֶׁר עַל־שְׂפַת־נַחַל אַרְנוֹן וְהָעִיר אֲשֶׁר בְּתוֹךְ־הַנַּחַל וְכָל־הַמִּישֹׁר מֵידְבָא עַד־דִּיבוֹן׃
    hebrewPlain: מערוער אשר על שפת נחל ארנון והעיר אשר בתוך הנחל וכל המישר מידבא עד דיבון
    kjvRefs:
    - Joshua 13:9
    kjvOsis:
    - Josh.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.10
    scripture: tanakh
    name: Tanakh Joshua 13:10
    ref: Joshua 13:10
    book: Josh
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 6159
    text: and all the cities of Sihon king of the Amorites, who reigned in Heshbon, unto the border of the children of Ammon;
    translation: JPS 1917
    original: וְכֹל עָרֵי סִיחוֹן מֶלֶךְ הָאֱמֹרִי אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן עַד־גְּבוּל בְּנֵי עַמּוֹן׃
    hebrewPlain: וכל ערי סיחון מלך האמרי אשר מלך בחשבון עד גבול בני עמון
    kjvRefs:
    - Joshua 13:10
    kjvOsis:
    - Josh.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.11
    scripture: tanakh
    name: Tanakh Joshua 13:11
    ref: Joshua 13:11
    book: Josh
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 6160
    text: and Gilead, and the border of the Geshurites and Maacathites, and all mount Hermon, and all Bashan unto Salcah;
    translation: JPS 1917
    original: וְהַגִּלְעָד וּגְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי וְכֹל הַר חֶרְמוֹן וְכָל־הַבָּשָׁן עַד־סַלְכָה׃
    hebrewPlain: והגלעד וגבול הגשורי והמעכתי וכל הר חרמון וכל הבשן עד סלכה
    kjvRefs:
    - Joshua 13:11
    kjvOsis:
    - Josh.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.12
    scripture: tanakh
    name: Tanakh Joshua 13:12
    ref: Joshua 13:12
    book: Josh
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 6161
    text: all the kingdom of Og in Bashan, who reigned in Ashtaroth and in Edrei—the same was left of the remnant of the Rephaim— for these did Moses smite, and drove them out.
    translation: JPS 1917
    original: כָּל־מַמְלְכוּת עוֹג בַּבָּשָׁן אֲשֶׁר־מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים וַיַּכֵּם מֹשֶׁה וַיֹּרִשֵׁם׃
    hebrewPlain: כל ממלכות עוג בבשן אשר מלך בעשתרות ובאדרעי הוא נשאר מיתר הרפאים ויכם משה וירשם
    kjvRefs:
    - Joshua 13:12
    kjvOsis:
    - Josh.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.13
    scripture: tanakh
    name: Tanakh Joshua 13:13
    ref: Joshua 13:13
    book: Josh
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 6162
    text: Nevertheless the children of Israel drove not out the Geshurites, nor the Maacathites; but Geshur and Maacath dwelt in the midst of Israel unto this day.
    translation: JPS 1917
    original: וְלֹא הוֹרִישׁוּ בְּנֵי יִשְׂרָאֵל אֶת־הַגְּשׁוּרִי וְאֶת־הַמַּעֲכָתִי וַיֵּשֶׁב גְּשׁוּר וּמַעֲכָת בְּקֶרֶב יִשְׂרָאֵל עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ולא הורישו בני ישראל את הגשורי ואת המעכתי וישב גשור ומעכת בקרב ישראל עד היום הזה
    kjvRefs:
    - Joshua 13:13
    kjvOsis:
    - Josh.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.14
    scripture: tanakh
    name: Tanakh Joshua 13:14
    ref: Joshua 13:14
    book: Josh
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 6163
    text: Only unto the tribe of Levi he gave no inheritance; the offerings of the LORD, the God of Israel, made by fire are his inheritance, as He spoke unto him.
    translation: JPS 1917
    original: רַק לְשֵׁבֶט הַלֵּוִי לֹא נָתַן נַחֲלָה אִשֵּׁי יְהוָה אֱלֹהֵי יִשְׂרָאֵל הוּא נַחֲלָתוֹ כַּאֲשֶׁר דִּבֶּר־לוֹ׃
    hebrewPlain: רק לשבט הלוי לא נתן נחלה אשי יהוה אלהי ישראל הוא נחלתו כאשר דבר לו
    kjvRefs:
    - Joshua 13:14
    kjvOsis:
    - Josh.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.15
    scripture: tanakh
    name: Tanakh Joshua 13:15
    ref: Joshua 13:15
    book: Josh
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 6164
    text: And Moses gave unto the tribe of the children of Reuben according to their families.
    translation: JPS 1917
    original: וַיִּתֵּן מֹשֶׁה לְמַטֵּה בְנֵי־רְאוּבֵן לְמִשְׁפְּחֹתָם׃
    hebrewPlain: ויתן משה למטה בני ראובן למשפחתם
    kjvRefs:
    - Joshua 13:15
    kjvOsis:
    - Josh.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Josh.13
- type: TanakhVerse
  data:
    osis: Josh.13.16
    scripture: tanakh
    name: Tanakh Joshua 13:16
    ref: Joshua 13:16
    book: Josh
    section: neviim
    chapter: 13
    verse: 16
    ordinal: 6165
    text: And their border was from Aroer, that is on the edge of the valley of Arnon, and the city that is in the middle of the valley, and all the table-land by Medeba;
    translation: JPS 1917
