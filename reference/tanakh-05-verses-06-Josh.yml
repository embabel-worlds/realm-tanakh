    translation: JPS 1917
    original: וְכֹל עָרֵי הַמִּישֹׁר וְכָל־מַמְלְכוּת סִיחוֹן מֶלֶךְ הָאֱמֹרִי אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ וְאֶת־נְשִׂיאֵי מִדְיָן אֶת־אֱוִי וְאֶת־רֶקֶם וְאֶת־צוּר וְאֶת־חוּר וְאֶת־רֶבַע נְסִיכֵי סִיחוֹן יֹשְׁבֵי הָאָרֶץ׃
    hebrewPlain: וכל ערי המישר וכל ממלכות סיחון מלך האמרי אשר מלך בחשבון אשר הכה משה אתו ואת נשיאי מדין את אוי ואת רקם ואת צור ואת חור ואת רבע נסיכי סיחון ישבי הארץ
