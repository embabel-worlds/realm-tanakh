    translation: JPS 1917
    original: וְעָבַר הַגְּבוּל אֶל־כֶּתֶף בֵּית־חָגְלָה צָפוֹנָה והיה [וְהָיוּ ] תצאותיו [תֹּצְאוֹת] הַגְּבוּל אֶל־לְשׁוֹן יָם־הַמֶּלַח צָפוֹנָה אֶל־קְצֵה הַיַּרְדֵּן נֶגְבָּה זֶה גְּבוּל נֶגֶב׃
