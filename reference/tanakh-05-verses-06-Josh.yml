    translation: JPS 1917
    original: וְיָרַד־יָמָּה אֶל־גְּבוּל הַיַּפְלֵטִי עַד גְּבוּל בֵּית־חוֹרֹן תַּחְתּוֹן וְעַד־גָּזֶר וְהָיוּ תצאתו [תֹצְאֹתָיו] יָמָּה׃
    hebrewPlain: וירד ימה אל גבול היפלטי עד גבול בית חורן תחתון ועד גזר והיו תצאתו [תצאתיו] ימה
