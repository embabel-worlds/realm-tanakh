  data:
    osis: Deut.11.28
    scripture: tanakh
    name: Tanakh Deuteronomy 11:28
    ref: Deuteronomy 11:28
    book: Deut
    section: torah
    chapter: 11
    verse: 28
    ordinal: 5231
    text: and the curse, if ye shall not hearken unto the commandments of the LORD your God, but turn aside out of the way which I command you this day, to go after other gods, which ye have not known.
    translation: JPS 1917
    original: וְהַקְּלָלָה אִם־לֹא תִשְׁמְעוּ אֶל־מִצְוֺת יְהוָה אֱלֹהֵיכֶם וְסַרְתֶּם מִן־הַדֶּרֶךְ אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים אֲשֶׁר לֹא־יְדַעְתֶּם׃
    hebrewPlain: והקללה אם לא תשמעו אל מצות יהוה אלהיכם וסרתם מן הדרך אשר אנכי מצוה אתכם היום ללכת אחרי אלהים אחרים אשר לא ידעתם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 11:28
    kjvOsis:
    - Deut.11.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
