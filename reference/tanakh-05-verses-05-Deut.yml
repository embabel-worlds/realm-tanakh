  data:
    osis: Deut.12.28
    scripture: tanakh
    name: Tanakh Deuteronomy 12:28
    ref: Deuteronomy 12:28
    book: Deut
    section: torah
    chapter: 12
    verse: 28
    ordinal: 5263
    text: Observe and hear all these words which I command thee, that it may go well with thee, and with thy children after thee for ever, when thou doest that which is good and right in the eyes of the LORD thy God.
    translation: JPS 1917
    original: שְׁמֹר וְשָׁמַעְתָּ אֵת כָּל־הַדְּבָרִים הָאֵלֶּה אֲשֶׁר אָנֹכִי מְצַוֶּךָּ לְמַעַן יִיטַב לְךָ וּלְבָנֶיךָ אַחֲרֶיךָ עַד־עוֹלָם כִּי תַעֲשֶׂה הַטּוֹב וְהַיָּשָׁר בְּעֵינֵי יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: שמר ושמעת את כל הדברים האלה אשר אנכי מצוך למען ייטב לך ולבניך אחריך עד עולם כי תעשה הטוב והישר בעיני יהוה אלהיך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:28
    kjvOsis:
