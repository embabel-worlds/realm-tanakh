  data:
    osis: Deut.17.6
    scripture: tanakh
    name: Tanakh Deuteronomy 17:6
    ref: Deuteronomy 17:6
    book: Deut
    section: torah
    chapter: 17
    verse: 6
    ordinal: 5365
    text: At the mouth of two witnesses, or three witnesses, shall he that is to die be put to death; at the mouth of one witness he shall not be put to death.
    translation: JPS 1917
    original: עַל־פִּי שְׁנַיִם עֵדִים אוֹ שְׁלֹשָׁה עֵדִים יוּמַת הַמֵּת לֹא יוּמַת עַל־פִּי עֵד אֶחָד׃
    hebrewPlain: על פי שנים עדים או שלשה עדים יומת המת לא יומת על פי עד אחד
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:6
    kjvOsis:
    - Deut.17.6
