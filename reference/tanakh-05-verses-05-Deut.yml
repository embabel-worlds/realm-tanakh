    scripture: tanakh
    name: Tanakh Deuteronomy 4:2
    ref: Deuteronomy 4:2
    book: Deut
    section: torah
    chapter: 4
    verse: 2
    ordinal: 5004
    text: Ye shall not add unto the word which I command you, neither shall ye diminish from it, that ye may keep the commandments of the LORD your God which I command you.
    translation: JPS 1917
    original: לֹא תֹסִפוּ עַל־הַדָּבָר אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם וְלֹא תִגְרְעוּ מִמֶּנּוּ לִשְׁמֹר אֶת־מִצְוֺת יְהוָה אֱלֹהֵיכֶם אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם׃
    hebrewPlain: לא תספו על הדבר אשר אנכי מצוה אתכם ולא תגרעו ממנו לשמר את מצות יהוה אלהיכם אשר אנכי מצוה אתכם
    parashah: Vaetchanan
