    book: Deut
    section: torah
    chapter: 23
    verse: 11
    ordinal: 5505
    text: If there be among you any man, that is not clean by reason of that which chanceth him by night, then shall he go abroad out of the camp, he shall not come within the camp.
    translation: JPS 1917
    original: כִּי־יִהְיֶה בְךָ אִישׁ אֲשֶׁר לֹא־יִהְיֶה טָהוֹר מִקְּרֵה־לָיְלָה וְיָצָא אֶל־מִחוּץ לַמַּחֲנֶה לֹא יָבֹא אֶל־תּוֹךְ הַמַּחֲנֶה׃
    hebrewPlain: כי יהיה בך איש אשר לא יהיה טהור מקרה לילה ויצא אל מחוץ למחנה לא יבא אל תוך המחנה
    parashah: Ki Teitzei
    kjvRefs:
