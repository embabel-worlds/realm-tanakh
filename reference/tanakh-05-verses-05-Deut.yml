    ref: Deuteronomy 19:10
    book: Deut
    section: torah
    chapter: 19
    verse: 10
    ordinal: 5411
    text: that innocent blood be not shed in the midst of thy land, which the LORD thy God giveth thee for an inheritance, and so blood be upon thee.
    translation: JPS 1917
    original: וְלֹא יִשָּׁפֵךְ דָּם נָקִי בְּקֶרֶב אַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה וְהָיָה עָלֶיךָ דָּמִים׃
    hebrewPlain: ולא ישפך דם נקי בקרב ארצך אשר יהוה אלהיך נתן לך נחלה והיה עליך דמים
    parashah: Shoftim
