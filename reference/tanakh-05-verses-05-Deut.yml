- type: TanakhVerse
  data:
    osis: Deut.9.1
    scripture: tanakh
    name: Tanakh Deuteronomy 9:1
    ref: Deuteronomy 9:1
    book: Deut
    section: torah
    chapter: 9
    verse: 1
    ordinal: 5153
    text: 'Hear, O Israel: thou art to pass over the Jordan this day, to go in to dispossess nations greater and mightier than thyself, cities great and fortified up to heaven,'
    translation: JPS 1917
    original: שְׁמַע יִשְׂרָאֵל אַתָּה עֹבֵר הַיּוֹם אֶת־הַיַּרְדֵּן לָבֹא לָרֶשֶׁת גּוֹיִם גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם׃
    hebrewPlain: שמע ישראל אתה עבר היום את הירדן לבא לרשת גוים גדלים ועצמים ממך ערים גדלת ובצרת בשמים
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:1
    kjvOsis:
    - Deut.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
