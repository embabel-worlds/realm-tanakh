    ordinal: 5835
    text: And Moses went up from the plains of Moab unto mount Nebo, to the top of Pisgah, that is over against Jericho. And the LORD showed him all the land, even Gilead as far as Dan;
    translation: JPS 1917
    original: וַיַּעַל מֹשֶׁה מֵעַרְבֹת מוֹאָב אֶל־הַר נְבוֹ רֹאשׁ הַפִּסְגָּה אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ וַיַּרְאֵהוּ יְהוָה אֶת־כָּל־הָאָרֶץ אֶת־הַגִּלְעָד עַד־דָּן׃
    hebrewPlain: ויעל משה מערבת מואב אל הר נבו ראש הפסגה אשר על פני ירחו ויראהו יהוה את כל הארץ את הגלעד עד דן
    parashah: V'Zot HaBerachah
    kjvRefs:
