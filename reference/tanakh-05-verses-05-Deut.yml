- type: TanakhVerse
  data:
    osis: Deut.22.23
    scripture: tanakh
    name: Tanakh Deuteronomy 22:23
    ref: Deuteronomy 22:23
    book: Deut
    section: torah
    chapter: 22
    verse: 23
    ordinal: 5488
    text: If there be a damsel that is a virgin betrothed unto a man, and a man find her in the city, and lie with her;
    translation: JPS 1917
    original: כִּי יִהְיֶה נער [נַעֲרָה] בְתוּלָה מְאֹרָשָׂה לְאִישׁ וּמְצָאָהּ אִישׁ בָּעִיר וְשָׁכַב עִמָּהּ׃
    hebrewPlain: כי יהיה נער [נערה] בתולה מארשה לאיש ומצאה איש בעיר ושכב עמה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:23
    kjvOsis:
    - Deut.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.22.24
    scripture: tanakh
    name: Tanakh Deuteronomy 22:24
    ref: Deuteronomy 22:24
    book: Deut
    section: torah
    chapter: 22
    verse: 24
    ordinal: 5489
    text: 'then ye shall bring them both out unto the gate of that city, and ye shall stone them with stones that they die: the damsel, because she cried not, being in the city; and the man, because he hath humbled his neighbour’s wife; so thou shalt put away the evil from the midst of thee.'
    translation: JPS 1917
    original: וְהוֹצֵאתֶם אֶת־שְׁנֵיהֶם אֶל־שַׁעַר הָעִיר הַהִוא וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ אֶת־הנער [הַנַּעֲרָה] עַל־דְּבַר אֲשֶׁר לֹא־צָעֲקָה בָעִיר וְאֶת־הָאִישׁ עַל־דְּבַר אֲשֶׁר־עִנָּה אֶת־אֵשֶׁת רֵעֵהוּ וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: והוצאתם את שניהם אל שער העיר ההוא וסקלתם אתם באבנים ומתו את הנער [הנערה] על דבר אשר לא צעקה בעיר ואת האיש על דבר אשר ענה את אשת רעהו ובערת הרע מקרבך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:24
    kjvOsis:
    - Deut.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.22.25
    scripture: tanakh
    name: Tanakh Deuteronomy 22:25
    ref: Deuteronomy 22:25
    book: Deut
    section: torah
    chapter: 22
    verse: 25
    ordinal: 5490
    text: But if the man find the damsel that is betrothed in the field, and the man take hold of her, and lie with her; then the man only that lay with her shall die.
    translation: JPS 1917
    original: וְאִם־בַּשָּׂדֶה יִמְצָא הָאִישׁ אֶת־הנער [הַנַּעֲרָה] הַמְאֹרָשָׂה וְהֶחֱזִיק־בָּהּ הָאִישׁ וְשָׁכַב עִמָּהּ וּמֵת הָאִישׁ אֲשֶׁר־שָׁכַב עִמָּהּ לְבַדּוֹ׃
    hebrewPlain: ואם בשדה ימצא האיש את הנער [הנערה] המארשה והחזיק בה האיש ושכב עמה ומת האיש אשר שכב עמה לבדו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:25
    kjvOsis:
    - Deut.22.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.22.26
    scripture: tanakh
    name: Tanakh Deuteronomy 22:26
    ref: Deuteronomy 22:26
    book: Deut
    section: torah
    chapter: 22
    verse: 26
    ordinal: 5491
    text: But unto the damsel thou shalt do nothing; there is in the damsel no sin worthy of death; for as when a man riseth against his neighbour, and slayeth him, even so is this matter.
    translation: JPS 1917
    original: ולנער [וְלַנַּעֲרָה] לֹא־תַעֲשֶׂה דָבָר אֵין לנער [לַנַּעֲרָה] חֵטְא מָוֶת כִּי כַּאֲשֶׁר יָקוּם אִישׁ עַל־רֵעֵהוּ וּרְצָחוֹ נֶפֶשׁ כֵּן הַדָּבָר הַזֶּה׃
    hebrewPlain: ולנער [ולנערה] לא תעשה דבר אין לנער [לנערה] חטא מות כי כאשר יקום איש על רעהו ורצחו נפש כן הדבר הזה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:26
    kjvOsis:
    - Deut.22.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
