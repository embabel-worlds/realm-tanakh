  data:
    osis: Deut.4.22
    scripture: tanakh
    name: Tanakh Deuteronomy 4:22
    ref: Deuteronomy 4:22
    book: Deut
    section: torah
    chapter: 4
    verse: 22
    ordinal: 5024
    text: but I must die in this land, I must not go over the Jordan; but ye are to go over, and possess that good land.
    translation: JPS 1917
    original: כִּי אָנֹכִי מֵת בָּאָרֶץ הַזֹּאת אֵינֶנִּי עֹבֵר אֶת־הַיַּרְדֵּן וְאַתֶּם עֹבְרִים וִירִשְׁתֶּם אֶת־הָאָרֶץ הַטּוֹבָה הַזֹּאת׃
    hebrewPlain: כי אנכי מת בארץ הזאת אינני עבר את הירדן ואתם עברים וירשתם את הארץ הטובה הזאת
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:22
    kjvOsis:
    - Deut.4.22
