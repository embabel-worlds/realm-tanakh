    translation: JPS 1917
    original: וַנִּקַּח בָּעֵת הַהִוא אֶת־הָאָרֶץ מִיַּד שְׁנֵי מַלְכֵי הָאֱמֹרִי אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן מִנַּחַל אַרְנֹן עַד־הַר חֶרְמוֹן׃
    hebrewPlain: ונקח בעת ההוא את הארץ מיד שני מלכי האמרי אשר בעבר הירדן מנחל ארנן עד הר חרמון
