    section: torah
    chapter: 4
    verse: 3
    ordinal: 5005
    text: Your eyes have seen what the LORD did in Baal-peor; for all the men that followed the Baal of Peor, the LORD thy God hath destroyed them from the midst of thee.
    translation: JPS 1917
    original: עֵינֵיכֶם הָרֹאֹת אֵת אֲשֶׁר־עָשָׂה יְהוָה בְּבַעַל פְּעוֹר כִּי כָל־הָאִישׁ אֲשֶׁר הָלַךְ אַחֲרֵי בַעַל־פְּעוֹר הִשְׁמִידוֹ יְהוָה אֱלֹהֶיךָ מִקִּרְבֶּךָ׃
    hebrewPlain: עיניכם הראת את אשר עשה יהוה בבעל פעור כי כל האיש אשר הלך אחרי בעל פעור השמידו יהוה אלהיך מקרבך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:3
    kjvOsis:
    - Deut.4.3
