  data:
    osis: Deut.5.26
    scripture: tanakh
    name: Tanakh Deuteronomy 5:26
    ref: Deuteronomy 5:26
    book: Deut
    section: torah
    chapter: 5
    verse: 26
    ordinal: 5077
    text: Oh that they had such a heart as this alway, to fear Me, and keep all My commandments, that it might be well with them, and with their children for ever!
    translation: JPS 1917
    original: מִי־יִתֵּן וְהָיָה לְבָבָם זֶה לָהֶם לְיִרְאָה אֹתִי וְלִשְׁמֹר אֶת־כָּל־מִצְוֺתַי כָּל־הַיָּמִים לְמַעַן יִיטַב לָהֶם וְלִבְנֵיהֶם לְעֹלָם׃
    hebrewPlain: מי יתן והיה לבבם זה להם ליראה אתי ולשמר את כל מצותי כל הימים למען ייטב להם ולבניהם לעלם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:29
    kjvOsis:
    - Deut.5.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.5
  - predicate: IN_PORTION
    to:
      type: Parashah
