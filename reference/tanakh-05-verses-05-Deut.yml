  data:
    osis: Deut.4.24
    scripture: tanakh
    name: Tanakh Deuteronomy 4:24
    ref: Deuteronomy 4:24
    book: Deut
    section: torah
    chapter: 4
    verse: 24
    ordinal: 5026
    text: For the LORD thy God is a devouring fire, a jealous God.
    translation: JPS 1917
    original: כִּי יְהוָה אֱלֹהֶיךָ אֵשׁ אֹכְלָה הוּא אֵל קַנָּא׃
    hebrewPlain: כי יהוה אלהיך אש אכלה הוא אל קנא
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:24
    kjvOsis:
