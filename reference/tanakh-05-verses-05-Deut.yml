  data:
    osis: Deut.20.10
    scripture: tanakh
    name: Tanakh Deuteronomy 20:10
    ref: Deuteronomy 20:10
    book: Deut
    section: torah
    chapter: 20
    verse: 10
    ordinal: 5432
    text: When thou drawest nigh unto a city to fight against it, then proclaim peace unto it.
    translation: JPS 1917
    original: כִּי־תִקְרַב אֶל־עִיר לְהִלָּחֵם עָלֶיהָ וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם׃
    hebrewPlain: כי תקרב אל עיר להלחם עליה וקראת אליה לשלום
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:10
    kjvOsis:
    - Deut.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.11
    scripture: tanakh
    name: Tanakh Deuteronomy 20:11
    ref: Deuteronomy 20:11
    book: Deut
    section: torah
    chapter: 20
    verse: 11
    ordinal: 5433
    text: And it shall be, if it make thee answer of peace, and open unto thee, then it shall be, that all the people that are found therein shall become tributary unto thee, and shall serve thee.
    translation: JPS 1917
    original: וְהָיָה אִם־שָׁלוֹם תַּעַנְךָ וּפָתְחָה לָךְ וְהָיָה כָּל־הָעָם הַנִּמְצָא־בָהּ יִהְיוּ לְךָ לָמַס וַעֲבָדוּךָ׃
    hebrewPlain: והיה אם שלום תענך ופתחה לך והיה כל העם הנמצא בה יהיו לך למס ועבדוך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:11
    kjvOsis:
    - Deut.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.12
    scripture: tanakh
    name: Tanakh Deuteronomy 20:12
    ref: Deuteronomy 20:12
    book: Deut
    section: torah
    chapter: 20
    verse: 12
    ordinal: 5434
    text: And if it will make no peace with thee, but will make war against thee, then thou shalt besiege it.
    translation: JPS 1917
    original: וְאִם־לֹא תַשְׁלִים עִמָּךְ וְעָשְׂתָה עִמְּךָ מִלְחָמָה וְצַרְתָּ עָלֶיהָּ׃
    hebrewPlain: ואם לא תשלים עמך ועשתה עמך מלחמה וצרת עליה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:12
    kjvOsis:
    - Deut.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
