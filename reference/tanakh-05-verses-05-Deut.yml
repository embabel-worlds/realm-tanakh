    scripture: tanakh
    name: Tanakh Deuteronomy 17:2
    ref: Deuteronomy 17:2
    book: Deut
    section: torah
    chapter: 17
    verse: 2
    ordinal: 5361
    text: If there be found in the midst of thee, within any of thy gates which the LORD thy God giveth thee, man or woman, that doeth that which is evil in the sight of the LORD thy God, in transgressing His covenant,
    translation: JPS 1917
    original: כִּי־יִמָּצֵא בְקִרְבְּךָ בְּאַחַד שְׁעָרֶיךָ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ אִישׁ אוֹ־אִשָּׁה אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע בְּעֵינֵי יְהוָה־אֱלֹהֶיךָ לַעֲבֹר בְּרִיתוֹ׃
    hebrewPlain: כי ימצא בקרבך באחד שעריך אשר יהוה אלהיך נתן לך איש או אשה אשר יעשה את הרע בעיני יהוה אלהיך לעבר בריתו
    parashah: Shoftim
    kjvRefs:
