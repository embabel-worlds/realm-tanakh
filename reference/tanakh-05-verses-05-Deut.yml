    translation: JPS 1917
    original: וְנִקְרָא שְׁמוֹ בְּיִשְׂרָאֵל בֵּית חֲלוּץ הַנָּעַל׃
    hebrewPlain: ונקרא שמו בישראל בית חלוץ הנעל
