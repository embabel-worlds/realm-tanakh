  data:
    osis: Deut.13.3
    scripture: tanakh
    name: Tanakh Deuteronomy 13:3
    ref: Deuteronomy 13:3
    book: Deut
    section: torah
    chapter: 13
    verse: 3
    ordinal: 5269
    text: 'and the sign or the wonder come to pass, whereof he spoke unto thee—saying: ‘Let us go after other gods, which thou hast not known, and let us serve them’;'
    translation: JPS 1917
    original: וּבָא הָאוֹת וְהַמּוֹפֵת אֲשֶׁר־דִּבֶּר אֵלֶיךָ לֵאמֹר נֵלְכָה אַחֲרֵי אֱלֹהִים אֲחֵרִים אֲשֶׁר לֹא־יְדַעְתָּם וְנָעָבְדֵם׃
    hebrewPlain: ובא האות והמופת אשר דבר אליך לאמר נלכה אחרי אלהים אחרים אשר לא ידעתם ונעבדם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:2
    kjvOsis:
    - Deut.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.13
  - predicate: IN_PORTION
    to:
