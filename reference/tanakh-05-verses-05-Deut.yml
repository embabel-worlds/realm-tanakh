  data:
    osis: Deut.18.19
    scripture: tanakh
    name: Tanakh Deuteronomy 18:19
    ref: Deuteronomy 18:19
    book: Deut
    section: torah
    chapter: 18
    verse: 19
    ordinal: 5398
    text: And it shall come to pass, that whosoever will not hearken unto My words which he shall speak in My name, I will require it of him.
    translation: JPS 1917
    original: וְהָיָה הָאִישׁ אֲשֶׁר לֹא־יִשְׁמַע אֶל־דְּבָרַי אֲשֶׁר יְדַבֵּר בִּשְׁמִי אָנֹכִי אֶדְרֹשׁ מֵעִמּוֹ׃
    hebrewPlain: והיה האיש אשר לא ישמע אל דברי אשר ידבר בשמי אנכי אדרש מעמו
    parashah: Shoftim
    kjvRefs:
