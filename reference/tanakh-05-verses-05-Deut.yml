    book: Deut
    section: torah
    chapter: 2
    verse: 10
    ordinal: 4946
    text: The Emim dwelt therein aforetime, a people great, and many, and tall, as the Anakim;
    translation: JPS 1917
    original: הָאֵמִים לְפָנִים יָשְׁבוּ בָהּ עַם גָּדוֹל וְרַב וָרָם כָּעֲנָקִים׃
    hebrewPlain: האמים לפנים ישבו בה עם גדול ורב ורם כענקים
