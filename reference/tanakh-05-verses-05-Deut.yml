    name: Tanakh Deuteronomy 14:21
    ref: Deuteronomy 14:21
    book: Deut
    section: torah
    chapter: 14
    verse: 21
    ordinal: 5306
    text: Ye shall not eat of any thing that dieth of itself; thou mayest give it unto the stranger that is within thy gates, that he may eat it; or thou mayest sell it unto a foreigner; for thou art a holy people unto the LORD thy God. Thou shalt not seethe a kid in its mother’s milk.
    translation: JPS 1917
    original: לֹא תֹאכְלוּ כָל־נְבֵלָה לַגֵּר אֲשֶׁר־בִּשְׁעָרֶיךָ תִּתְּנֶנָּה וַאֲכָלָהּ אוֹ מָכֹר לְנָכְרִי כִּי עַם קָדוֹשׁ אַתָּה לַיהוָה אֱלֹהֶיךָ לֹא־תְבַשֵּׁל גְּדִי בַּחֲלֵב אִמּוֹ׃
    hebrewPlain: לא תאכלו כל נבלה לגר אשר בשעריך תתננה ואכלה או מכר לנכרי כי עם קדוש אתה ליהוה אלהיך לא תבשל גדי בחלב אמו
