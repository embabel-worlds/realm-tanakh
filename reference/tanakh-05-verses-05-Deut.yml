  data:
    osis: Deut.20.18
    scripture: tanakh
    name: Tanakh Deuteronomy 20:18
    ref: Deuteronomy 20:18
    book: Deut
    section: torah
    chapter: 20
    verse: 18
    ordinal: 5440
    text: that they teach you not to do after all their abominations, which they have done unto their gods, and so ye sin against the LORD your God.
    translation: JPS 1917
    original: לְמַעַן אֲשֶׁר לֹא־יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת כְּכֹל תּוֹעֲבֹתָם אֲשֶׁר עָשׂוּ לֵאלֹהֵיהֶם וַחֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: למען אשר לא ילמדו אתכם לעשות ככל תועבתם אשר עשו לאלהיהם וחטאתם ליהוה אלהיכם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:18
    kjvOsis:
    - Deut.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
