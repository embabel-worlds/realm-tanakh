    ref: Deuteronomy 3:12
    book: Deut
    section: torah
    chapter: 3
    verse: 12
    ordinal: 4985
    text: And this land we took in possession at that time; from Aroer, which is by the valley of Arnon, and half the hill-country of Gilead, and the cities thereof, gave I unto the Reubenites and to the Gadites;
    translation: JPS 1917
    original: וְאֶת־הָאָרֶץ הַזֹּאת יָרַשְׁנוּ בָּעֵת הַהִוא מֵעֲרֹעֵר אֲשֶׁר־עַל־נַחַל אַרְנֹן וַחֲצִי הַר־הַגִּלְעָד וְעָרָיו נָתַתִּי לָרֻאוּבֵנִי וְלַגָּדִי׃
    hebrewPlain: ואת הארץ הזאת ירשנו בעת ההוא מערער אשר על נחל ארנן וחצי הר הגלעד ועריו נתתי לראובני ולגדי
    parashah: Devarim
