  data:
    osis: Deut.4.29
    scripture: tanakh
    name: Tanakh Deuteronomy 4:29
    ref: Deuteronomy 4:29
    book: Deut
    section: torah
    chapter: 4
    verse: 29
    ordinal: 5031
    text: But from thence ye will seek the LORD thy God; and thou shalt find Him, if thou search after Him with all thy heart and with all thy soul.
    translation: JPS 1917
    original: וּבִקַּשְׁתֶּם מִשָּׁם אֶת־יְהוָה אֱלֹהֶיךָ וּמָצָאתָ כִּי תִדְרְשֶׁנּוּ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשֶׁךָ׃
    hebrewPlain: ובקשתם משם את יהוה אלהיך ומצאת כי תדרשנו בכל לבבך ובכל נפשך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:29
    kjvOsis:
    - Deut.4.29
