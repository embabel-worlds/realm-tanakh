    text: 'the day that thou stoodest before the LORD thy God in Horeb, when the LORD said unto me: ‘Assemble Me the people, and I will make them hear My words that they may learn to fear Me all the days that they live upon the earth, and that they may teach their children.’'
    translation: JPS 1917
    original: יוֹם אֲשֶׁר עָמַדְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ בְּחֹרֵב בֶּאֱמֹר יְהוָה אֵלַי הַקְהֶל־לִי אֶת־הָעָם וְאַשְׁמִעֵם אֶת־דְּבָרָי אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי כָּל־הַיָּמִים אֲשֶׁר הֵם חַיִּים עַל־הָאֲדָמָה וְאֶת־בְּנֵיהֶם יְלַמֵּדוּן׃
    hebrewPlain: יום אשר עמדת לפני יהוה אלהיך בחרב באמר יהוה אלי הקהל לי את העם ואשמעם את דברי אשר ילמדון ליראה אתי כל הימים אשר הם חיים על האדמה ואת בניהם ילמדון
