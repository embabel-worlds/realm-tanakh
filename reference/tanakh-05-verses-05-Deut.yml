  data:
    osis: Deut.19.1
    scripture: tanakh
    name: Tanakh Deuteronomy 19:1
    ref: Deuteronomy 19:1
    book: Deut
    section: torah
    chapter: 19
    verse: 1
    ordinal: 5402
    text: When the LORD thy God shall cut off the nations, whose land the LORD thy God giveth thee, and thou dost succeed them, and dwell in their cities, and in their houses;
    translation: JPS 1917
    original: כִּי־יַכְרִית יְהוָה אֱלֹהֶיךָ אֶת־הַגּוֹיִם אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ אֶת־אַרְצָם וִירִשְׁתָּם וְיָשַׁבְתָּ בְעָרֵיהֶם וּבְבָתֵּיהֶם׃
    hebrewPlain: כי יכרית יהוה אלהיך את הגוים אשר יהוה אלהיך נתן לך את ארצם וירשתם וישבת בעריהם ובבתיהם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:1
    kjvOsis:
    - Deut.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.19.2
    scripture: tanakh
    name: Tanakh Deuteronomy 19:2
    ref: Deuteronomy 19:2
    book: Deut
    section: torah
    chapter: 19
    verse: 2
    ordinal: 5403
    text: thou shalt separate three cities for thee in the midst of thy land, which the LORD thy GOD giveth thee to possess it.
    translation: JPS 1917
    original: שָׁלוֹשׁ עָרִים תַּבְדִּיל לָךְ בְּתוֹךְ אַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ׃
    hebrewPlain: שלוש ערים תבדיל לך בתוך ארצך אשר יהוה אלהיך נתן לך לרשתה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:2
    kjvOsis:
    - Deut.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.19.3
    scripture: tanakh
    name: Tanakh Deuteronomy 19:3
    ref: Deuteronomy 19:3
    book: Deut
    section: torah
    chapter: 19
    verse: 3
    ordinal: 5404
    text: Thou shalt prepare thee the way, and divide the borders of thy land, which the LORD thy God causeth thee to inherit, into three parts, that every manslayer may flee thither.
    translation: JPS 1917
    original: תָּכִין לְךָ הַדֶּרֶךְ וְשִׁלַּשְׁתָּ אֶת־גְּבוּל אַרְצְךָ אֲשֶׁר יַנְחִילְךָ יְהוָה אֱלֹהֶיךָ וְהָיָה לָנוּס שָׁמָּה כָּל־רֹצֵחַ׃
    hebrewPlain: תכין לך הדרך ושלשת את גבול ארצך אשר ינחילך יהוה אלהיך והיה לנוס שמה כל רצח
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:3
    kjvOsis:
    - Deut.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.19.4
    scripture: tanakh
    name: Tanakh Deuteronomy 19:4
    ref: Deuteronomy 19:4
    book: Deut
    section: torah
    chapter: 19
    verse: 4
    ordinal: 5405
    text: 'And this is the case of the manslayer, that shall flee thither and live: whoso killeth his neighbour unawares, and hated him not in time past;'
    translation: JPS 1917
    original: וְזֶה דְּבַר הָרֹצֵחַ אֲשֶׁר־יָנוּס שָׁמָּה וָחָי אֲשֶׁר יַכֶּה אֶת־רֵעֵהוּ בִּבְלִי־דַעַת וְהוּא לֹא־שֹׂנֵא לוֹ מִתְּמֹל שִׁלְשֹׁם׃
    hebrewPlain: וזה דבר הרצח אשר ינוס שמה וחי אשר יכה את רעהו בבלי דעת והוא לא שנא לו מתמל שלשם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:4
    kjvOsis:
    - Deut.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.19.5
    scripture: tanakh
    name: Tanakh Deuteronomy 19:5
    ref: Deuteronomy 19:5
    book: Deut
    section: torah
    chapter: 19
    verse: 5
    ordinal: 5406
    text: as when a man goeth into the forest with his neighbour to hew wood, and his hand fetcheth a stroke with the axe to cut down the tree, and the head slippeth from the helve, and lighteth upon his neighbour, that he die; he shall flee unto one of these cities and live;
    translation: JPS 1917
    original: וַאֲשֶׁר יָבֹא אֶת־רֵעֵהוּ בַיַּעַר לַחְטֹב עֵצִים וְנִדְּחָה יָדוֹ בַגַּרְזֶן לִכְרֹת הָעֵץ וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ וּמָצָא אֶת־רֵעֵהוּ וָמֵת הוּא יָנוּס אֶל־אַחַת הֶעָרִים־הָאֵלֶּה וָחָי׃
    hebrewPlain: ואשר יבא את רעהו ביער לחטב עצים ונדחה ידו בגרזן לכרת העץ ונשל הברזל מן העץ ומצא את רעהו ומת הוא ינוס אל אחת הערים האלה וחי
    parashah: Shoftim
