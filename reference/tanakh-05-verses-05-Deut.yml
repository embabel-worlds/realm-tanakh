    section: torah
    chapter: 2
    verse: 25
    ordinal: 4961
    text: This day will I begin to put the dread of thee and the fear of thee upon the peoples that are under the whole heaven, who, when they hear the report of thee, shall tremble, and be in anguish because of thee.’
    translation: JPS 1917
    original: הַיּוֹם הַזֶּה אָחֵל תֵּת פַּחְדְּךָ וְיִרְאָתְךָ עַל־פְּנֵי הָעַמִּים תַּחַת כָּל־הַשָּׁמָיִם אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ וְרָגְזוּ וְחָלוּ מִפָּנֶיךָ׃
    hebrewPlain: היום הזה אחל תת פחדך ויראתך על פני העמים תחת כל השמים אשר ישמעון שמעך ורגזו וחלו מפניך
    parashah: Devarim
    kjvRefs:
