    book: Deut
    section: torah
    chapter: 32
    verse: 4
    ordinal: 5757
    text: The Rock, His work is perfect; For all His ways are justice; A God of faithfulness and without iniquity, Just and right is He. .
    translation: JPS 1917
    original: הַצּוּר תָּמִים פָּעֳלוֹ כִּי כָל־דְּרָכָיו מִשְׁפָּט אֵל אֱמוּנָה וְאֵין עָוֶל צַדִּיק וְיָשָׁר הוּא׃
    hebrewPlain: הצור תמים פעלו כי כל דרכיו משפט אל אמונה ואין עול צדיק וישר הוא
