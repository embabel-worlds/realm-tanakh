    name: Tanakh Deuteronomy 18:14
    ref: Deuteronomy 18:14
    book: Deut
    section: torah
    chapter: 18
    verse: 14
    ordinal: 5393
    text: For these nations, that thou art to dispossess, hearken unto soothsayers, and unto diviners; but as for thee, the LORD thy God hath not suffered thee so to do.
    translation: JPS 1917
    original: כִּי הַגּוֹיִם הָאֵלֶּה אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם אֶל־מְעֹנְנִים וְאֶל־קֹסְמִים יִשְׁמָעוּ וְאַתָּה לֹא כֵן נָתַן לְךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: כי הגוים האלה אשר אתה יורש אותם אל מעננים ואל קסמים ישמעו ואתה לא כן נתן לך יהוה אלהיך
