    name: Tanakh Deuteronomy 22:28
    ref: Deuteronomy 22:28
    book: Deut
    section: torah
    chapter: 22
    verse: 28
    ordinal: 5493
    text: If a man find a damsel that is a virgin, that is not betrothed, and lay hold on her, and lie with her, and they be found;
    translation: JPS 1917
    original: כִּי־יִמְצָא אִישׁ נער [נַעֲרָה] בְתוּלָה אֲשֶׁר לֹא־אֹרָשָׂה וּתְפָשָׂהּ וְשָׁכַב עִמָּהּ וְנִמְצָאוּ׃
    hebrewPlain: כי ימצא איש נער [נערה] בתולה אשר לא ארשה ותפשה ושכב עמה ונמצאו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:28
    kjvOsis:
    - Deut.22.28
  relations:
