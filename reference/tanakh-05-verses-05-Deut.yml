    ref: Deuteronomy 24:16
    book: Deut
    section: torah
    chapter: 24
    verse: 16
    ordinal: 5536
    text: The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers; every man shall be put to death for his own sin.
    translation: JPS 1917
    original: לֹא־יוּמְתוּ אָבוֹת עַל־בָּנִים וּבָנִים לֹא־יוּמְתוּ עַל־אָבוֹת אִיש בְּחֶטְאוֹ יוּמָתוּ׃
    hebrewPlain: לא יומתו אבות על בנים ובנים לא יומתו על אבות איש בחטאו יומתו
    parashah: Ki Teitzei
    kjvRefs:
