  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.1
    scripture: tanakh
    name: Tanakh Deuteronomy 21:1
    ref: Deuteronomy 21:1
    book: Deut
    section: torah
    chapter: 21
    verse: 1
    ordinal: 5443
    text: If one be found slain in the land which the LORD thy God giveth thee to possess it, lying in the field, and it be not known who hath smitten him;
    translation: JPS 1917
    original: כִּי־יִמָּצֵא חָלָל בָּאֲדָמָה אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ נֹפֵל בַּשָּׂדֶה לֹא נוֹדַע מִי הִכָּהוּ׃
    hebrewPlain: כי ימצא חלל באדמה אשר יהוה אלהיך נתן לך לרשתה נפל בשדה לא נודע מי הכהו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:1
    kjvOsis:
    - Deut.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.2
    scripture: tanakh
    name: Tanakh Deuteronomy 21:2
    ref: Deuteronomy 21:2
    book: Deut
    section: torah
    chapter: 21
    verse: 2
    ordinal: 5444
    text: then thy elders and thy judges shall come forth, and they shall measure unto the cities which are round about him that is slain.
    translation: JPS 1917
    original: וְיָצְאוּ זְקֵנֶיךָ וְשֹׁפְטֶיךָ וּמָדְדוּ אֶל־הֶעָרִים אֲשֶׁר סְבִיבֹת הֶחָלָל׃
    hebrewPlain: ויצאו זקניך ושפטיך ומדדו אל הערים אשר סביבת החלל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:2
    kjvOsis:
    - Deut.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.3
    scripture: tanakh
    name: Tanakh Deuteronomy 21:3
    ref: Deuteronomy 21:3
    book: Deut
    section: torah
    chapter: 21
    verse: 3
    ordinal: 5445
    text: And it shall be, that the city which is nearest unto the slain man, even the elders of that city shall take a heifer of the herd, which hath not been wrought with, and which hath not drawn in the yoke.
    translation: JPS 1917
    original: וְהָיָה הָעִיר הַקְּרֹבָה אֶל־הֶחָלָל וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא עֶגְלַת בָּקָר אֲשֶׁר לֹא־עֻבַּד בָּהּ אֲשֶׁר לֹא־מָשְׁכָה בְּעֹל׃
    hebrewPlain: והיה העיר הקרבה אל החלל ולקחו זקני העיר ההוא עגלת בקר אשר לא עבד בה אשר לא משכה בעל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:3
    kjvOsis:
    - Deut.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.4
    scripture: tanakh
    name: Tanakh Deuteronomy 21:4
    ref: Deuteronomy 21:4
    book: Deut
    section: torah
    chapter: 21
    verse: 4
    ordinal: 5446
    text: And the elders of that city shall bring down the heifer unto a rough valley, which may neither be plowed nor sown, and shall break the heifer’s neck there in the valley.
    translation: JPS 1917
    original: וְהוֹרִדוּ זִקְנֵי הָעִיר הַהִוא אֶת־הָעֶגְלָה אֶל־נַחַל אֵיתָן אֲשֶׁר לֹא־יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ וְעָרְפוּ־שָׁם אֶת־הָעֶגְלָה בַּנָּחַל׃
    hebrewPlain: והורדו זקני העיר ההוא את העגלה אל נחל איתן אשר לא יעבד בו ולא יזרע וערפו שם את העגלה בנחל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:4
    kjvOsis:
    - Deut.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.5
    scripture: tanakh
    name: Tanakh Deuteronomy 21:5
    ref: Deuteronomy 21:5
    book: Deut
    section: torah
    chapter: 21
    verse: 5
    ordinal: 5447
    text: And the priests the sons of Levi shall come near—for them the LORD thy God hath chosen to minister unto Him, and to bless in the name of the LORD; and according to their word shall every controversy and every stroke be.
    translation: JPS 1917
    original: וְנִגְּשׁוּ הַכֹּהֲנִים בְּנֵי לֵוִי כִּי בָם בָּחַר יְהוָה אֱלֹהֶיךָ לְשָׁרְתוֹ וּלְבָרֵךְ בְּשֵׁם יְהוָה וְעַל־פִּיהֶם יִהְיֶה כָּל־רִיב וְכָל־נָגַע׃
    hebrewPlain: ונגשו הכהנים בני לוי כי בם בחר יהוה אלהיך לשרתו ולברך בשם יהוה ועל פיהם יהיה כל ריב וכל נגע
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:5
    kjvOsis:
    - Deut.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.6
    scripture: tanakh
    name: Tanakh Deuteronomy 21:6
    ref: Deuteronomy 21:6
    book: Deut
    section: torah
    chapter: 21
    verse: 6
    ordinal: 5448
    text: And all the elders of that city, who are nearest unto the slain man, shall wash their hands over the heifer whose neck was broken in the valley.
    translation: JPS 1917
    original: וְכֹל זִקְנֵי הָעִיר הַהִוא הַקְּרֹבִים אֶל־הֶחָלָל יִרְחֲצוּ אֶת־יְדֵיהֶם עַל־הָעֶגְלָה הָעֲרוּפָה בַנָּחַל׃
    hebrewPlain: וכל זקני העיר ההוא הקרבים אל החלל ירחצו את ידיהם על העגלה הערופה בנחל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:6
    kjvOsis:
    - Deut.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.7
    scripture: tanakh
    name: Tanakh Deuteronomy 21:7
    ref: Deuteronomy 21:7
    book: Deut
    section: torah
    chapter: 21
    verse: 7
    ordinal: 5449
    text: 'And they shall speak and say: ‘Our hands have not shed this blood, neither have our eyes seen it.'
    translation: JPS 1917
    original: וְעָנוּ וְאָמְרוּ יָדֵינוּ לֹא שפכה [שָׁפְכוּ] אֶת־הַדָּם הַזֶּה וְעֵינֵינוּ לֹא רָאוּ׃
    hebrewPlain: וענו ואמרו ידינו לא שפכה [שפכו] את הדם הזה ועינינו לא ראו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:7
    kjvOsis:
    - Deut.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.8
    scripture: tanakh
    name: Tanakh Deuteronomy 21:8
    ref: Deuteronomy 21:8
    book: Deut
    section: torah
    chapter: 21
    verse: 8
    ordinal: 5450
    text: Forgive, O LORD, Thy people Israel, whom Thou hast redeemed, and suffer not innocent blood to remain in the midst of Thy people Israel.’ And the blood shall be forgiven them.
    translation: JPS 1917
    original: כַּפֵּר לְעַמְּךָ יִשְׂרָאֵל אֲשֶׁר־פָּדִיתָ יְהוָה וְאַל־תִּתֵּן דָּם נָקִי בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל וְנִכַּפֵּר לָהֶם הַדָּם׃
    hebrewPlain: כפר לעמך ישראל אשר פדית יהוה ואל תתן דם נקי בקרב עמך ישראל ונכפר להם הדם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:8
    kjvOsis:
    - Deut.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.9
    scripture: tanakh
    name: Tanakh Deuteronomy 21:9
    ref: Deuteronomy 21:9
    book: Deut
    section: torah
    chapter: 21
    verse: 9
    ordinal: 5451
    text: So shalt thou put away the innocent blood from the midst of thee, when thou shalt do that which is right in the eyes of the LORD.
    translation: JPS 1917
    original: וְאַתָּה תְּבַעֵר הַדָּם הַנָּקִי מִקִּרְבֶּךָ כִּי־תַעֲשֶׂה הַיָּשָׁר בְּעֵינֵי יְהוָה׃
    hebrewPlain: ואתה תבער הדם הנקי מקרבך כי תעשה הישר בעיני יהוה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 21:9
    kjvOsis:
    - Deut.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.21.10
    scripture: tanakh
    name: Tanakh Deuteronomy 21:10
    ref: Deuteronomy 21:10
    book: Deut
    section: torah
    chapter: 21
    verse: 10
    ordinal: 5452
    text: When thou goest forth to battle against thine enemies, and the LORD thy God delivereth them into thy hands, and thou carriest them away captive,
    translation: JPS 1917
    original: כִּי־תֵצֵא לַמִּלְחָמָה עַל־אֹיְבֶיךָ וּנְתָנוֹ יְהוָה אֱלֹהֶיךָ בְּיָדֶךָ וְשָׁבִיתָ שִׁבְיוֹ׃
    hebrewPlain: כי תצא למלחמה על איביך ונתנו יהוה אלהיך בידך ושבית שביו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:10
    kjvOsis:
    - Deut.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.21.11
    scripture: tanakh
    name: Tanakh Deuteronomy 21:11
    ref: Deuteronomy 21:11
    book: Deut
    section: torah
    chapter: 21
    verse: 11
    ordinal: 5453
    text: and seest among the captives a woman of goodly form, and thou hast a desire unto her, and wouldest take her to thee to wife;
    translation: JPS 1917
    original: וְרָאִיתָ בַּשִּׁבְיָה אֵשֶׁת יְפַת־תֹּאַר וְחָשַׁקְתָּ בָהּ וְלָקַחְתָּ לְךָ לְאִשָּׁה׃
    hebrewPlain: וראית בשביה אשת יפת תאר וחשקת בה ולקחת לך לאשה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:11
    kjvOsis:
    - Deut.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.21.12
    scripture: tanakh
    name: Tanakh Deuteronomy 21:12
    ref: Deuteronomy 21:12
    book: Deut
    section: torah
    chapter: 21
    verse: 12
    ordinal: 5454
    text: then thou shalt bring her home to thy house; and she shall shave her head, and pare her nails;
    translation: JPS 1917
    original: וַהֲבֵאתָהּ אֶל־תּוֹךְ בֵּיתֶךָ וְגִלְּחָה אֶת־רֹאשָׁהּ וְעָשְׂתָה אֶת־צִפָּרְנֶיהָ׃
    hebrewPlain: והבאתה אל תוך ביתך וגלחה את ראשה ועשתה את צפרניה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:12
    kjvOsis:
    - Deut.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.21.13
    scripture: tanakh
    name: Tanakh Deuteronomy 21:13
    ref: Deuteronomy 21:13
    book: Deut
    section: torah
    chapter: 21
    verse: 13
    ordinal: 5455
    text: and she shall put the raiment of her captivity from off her, and shall remain in thy house, and bewail her father and her mother a full month; and after that thou mayest go in unto her, and be her husband, and she shall be thy wife.
    translation: JPS 1917
    original: וְהֵסִירָה אֶת־שִׂמְלַת שִׁבְיָהּ מֵעָלֶיהָ וְיָשְׁבָה בְּבֵיתֶךָ וּבָכְתָה אֶת־אָבִיהָ וְאֶת־אִמָּהּ יֶרַח יָמִים וְאַחַר כֵּן תָּבוֹא אֵלֶיהָ וּבְעַלְתָּהּ וְהָיְתָה לְךָ לְאִשָּׁה׃
    hebrewPlain: והסירה את שמלת שביה מעליה וישבה בביתך ובכתה את אביה ואת אמה ירח ימים ואחר כן תבוא אליה ובעלתה והיתה לך לאשה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:13
