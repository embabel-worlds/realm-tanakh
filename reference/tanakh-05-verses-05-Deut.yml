    translation: JPS 1917
    original: עַל אֲשֶׁר מְעַלְתֶּם בִּי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל בְּמֵי־מְרִיבַת קָדֵשׁ מִדְבַּר־צִן עַל אֲשֶׁר לֹא־קִדַּשְׁתֶּם אוֹתִי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: על אשר מעלתם בי בתוך בני ישראל במי מריבת קדש מדבר צן על אשר לא קדשתם אותי בתוך בני ישראל
    parashah: Ha'Azinu
