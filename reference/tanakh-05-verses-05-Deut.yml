    scripture: tanakh
    name: Tanakh Deuteronomy 23:7
    ref: Deuteronomy 23:7
    book: Deut
    section: torah
    chapter: 23
    verse: 7
    ordinal: 5501
    text: Thou shalt not seek their peace nor their prosperity all thy days for ever.
    translation: JPS 1917
    original: לֹא־תִדְרֹשׁ שְׁלֹמָם וְטֹבָתָם כָּל־יָמֶיךָ לְעוֹלָם׃
    hebrewPlain: לא תדרש שלמם וטבתם כל ימיך לעולם
    parashah: Ki Teitzei
    kjvRefs:
