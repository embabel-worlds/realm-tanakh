    ref: Deuteronomy 33:29
    book: Deut
    section: torah
    chapter: 33
    verse: 29
    ordinal: 5834
    text: Happy art thou, O Israel, who is like unto thee? A people saved by the LORD, The shield of thy help, And that is the sword of thy excellency! And thine enemies shall dwindle away before thee; And thou shalt tread upon their high places.
    translation: JPS 1917
    original: אַשְׁרֶיךָ יִשְׂרָאֵל מִי כָמוֹךָ עַם נוֹשַׁע בַּיהוָה מָגֵן עֶזְרֶךָ וַאֲשֶׁר־חֶרֶב גַּאֲוָתֶךָ וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ וְאַתָּה עַל־בָּמוֹתֵימוֹ תִדְרֹךְ׃
    hebrewPlain: אשריך ישראל מי כמוך עם נושע ביהוה מגן עזרך ואשר חרב גאותך ויכחשו איביך לך ואתה על במותימו תדרך
    parashah: V'Zot HaBerachah
