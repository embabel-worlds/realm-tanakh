    scripture: tanakh
    name: Tanakh Deuteronomy 1:20
    ref: Deuteronomy 1:20
    book: Deut
    section: torah
    chapter: 1
    verse: 20
    ordinal: 4910
    text: 'And I said unto you: ‘Ye are come unto the hill-country of the Amorites, which the LORD our God giveth unto us.'
    translation: JPS 1917
    original: וָאֹמַר אֲלֵכֶם בָּאתֶם עַד־הַר הָאֱמֹרִי אֲשֶׁר־יְהוָה אֱלֹהֵינוּ נֹתֵן לָנוּ׃
    hebrewPlain: ואמר אלכם באתם עד הר האמרי אשר יהוה אלהינו נתן לנו
    parashah: Devarim
    kjvRefs:
