    chapter: 12
    verse: 14
    ordinal: 5249
    text: but in the place which the LORD shall choose in one of thy tribes, there thou shalt offer thy burnt-offerings, and there thou shalt do all that I command thee.
    translation: JPS 1917
    original: כִּי אִם־בַּמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה בְּאַחַד שְׁבָטֶיךָ שָׁם תַּעֲלֶה עֹלֹתֶיךָ וְשָׁם תַּעֲשֶׂה כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ׃
    hebrewPlain: כי אם במקום אשר יבחר יהוה באחד שבטיך שם תעלה עלתיך ושם תעשה כל אשר אנכי מצוך
    parashah: Re'eh
    kjvRefs:
