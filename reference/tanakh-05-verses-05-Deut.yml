  data:
    osis: Deut.31.26
    scripture: tanakh
    name: Tanakh Deuteronomy 31:26
    ref: Deuteronomy 31:26
    book: Deut
    section: torah
    chapter: 31
    verse: 26
    ordinal: 5749
    text: ’Take this book of the law, and put it by the side of the ark of the covenant of the LORD your God, that it may be there for a witness against thee.
    translation: JPS 1917
    original: לָקֹחַ אֵת סֵפֶר הַתּוֹרָה הַזֶּה וְשַׂמְתֶּם אֹתוֹ מִצַּד אֲרוֹן בְּרִית־יְהוָה אֱלֹהֵיכֶם וְהָיָה־שָׁם בְּךָ לְעֵד׃
    hebrewPlain: לקח את ספר התורה הזה ושמתם אתו מצד ארון ברית יהוה אלהיכם והיה שם בך לעד
    parashah: Vayeilech
