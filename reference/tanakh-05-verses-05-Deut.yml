  data:
    osis: Deut.7.13
    scripture: tanakh
    name: Tanakh Deuteronomy 7:13
    ref: Deuteronomy 7:13
    book: Deut
    section: torah
    chapter: 7
    verse: 13
    ordinal: 5119
    text: and He will love thee, and bless thee, and multiply thee; He will also bless the fruit of thy body and the fruit of thy land, thy corn and thy wine and thine oil, the increase of thy kine and the young of thy flock, in the land which He swore unto thy fathers to give thee.
    translation: JPS 1917
    original: וַאֲהֵבְךָ וּבֵרַכְךָ וְהִרְבֶּךָ וּבֵרַךְ פְּרִי־בִטְנְךָ וּפְרִי־אַדְמָתֶךָ דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ שְׁגַר־אֲלָפֶיךָ וְעַשְׁתְּרֹת צֹאנֶךָ עַל הָאֲדָמָה אֲשֶׁר־נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ׃
    hebrewPlain: ואהבך וברכך והרבך וברך פרי בטנך ופרי אדמתך דגנך ותירשך ויצהרך שגר אלפיך ועשתרת צאנך על האדמה אשר נשבע לאבתיך לתת לך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:13
    kjvOsis:
    - Deut.7.13
