  data:
    osis: Deut.30.18
    scripture: tanakh
    name: Tanakh Deuteronomy 30:18
    ref: Deuteronomy 30:18
    book: Deut
    section: torah
    chapter: 30
    verse: 18
    ordinal: 5721
    text: I declare unto you this day, that ye shall surely perish; ye shall not prolong your days upon the land, whither thou passest over the Jordan to go in to possess it.
    translation: JPS 1917
    original: הִגַּדְתִּי לָכֶם הַיּוֹם כִּי אָבֹד תֹּאבֵדוּן לֹא־תַאֲרִיכֻן יָמִים עַל־הָאֲדָמָה אֲשֶׁר אַתָּה עֹבֵר אֶת־הַיַּרְדֵּן לָבֹא שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: הגדתי לכם היום כי אבד תאבדון לא תאריכן ימים על האדמה אשר אתה עבר את הירדן לבא שמה לרשתה
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:18
    kjvOsis:
    - Deut.30.18
