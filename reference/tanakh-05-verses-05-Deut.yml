  data:
    osis: Deut.19.21
    scripture: tanakh
    name: Tanakh Deuteronomy 19:21
    ref: Deuteronomy 19:21
    book: Deut
    section: torah
    chapter: 19
    verse: 21
    ordinal: 5422
    text: 'And thine eye shall not pity: life for life, eye for eye, tooth for tooth, hand for hand, foot for foot.'
    translation: JPS 1917
    original: וְלֹא תָחוֹס עֵינֶךָ נֶפֶשׁ בְּנֶפֶשׁ עַיִן בְּעַיִן שֵׁן בְּשֵׁן יָד בְּיָד רֶגֶל בְּרָגֶל׃
    hebrewPlain: ולא תחוס עינך נפש בנפש עין בעין שן בשן יד ביד רגל ברגל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:21
    kjvOsis:
