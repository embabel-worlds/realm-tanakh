- type: TanakhVerse
  data:
    osis: Deut.22.18
    scripture: tanakh
    name: Tanakh Deuteronomy 22:18
    ref: Deuteronomy 22:18
    book: Deut
    section: torah
    chapter: 22
    verse: 18
    ordinal: 5483
    text: And the elders of that city shall take the man and chastise him.
    translation: JPS 1917
    original: וְלָקְחוּ זִקְנֵי הָעִיר־הַהִוא אֶת־הָאִישׁ וְיִסְּרוּ אֹתוֹ׃
    hebrewPlain: ולקחו זקני העיר ההוא את האיש ויסרו אתו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:18
    kjvOsis:
    - Deut.22.18
