    translation: JPS 1917
    original: בְּהַנְחֵל עֶלְיוֹן גּוֹיִם בְּהַפְרִידוֹ בְּנֵי אָדָם יַצֵּב גְּבֻלֹת עַמִּים לְמִסְפַּר בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: בהנחל עליון גוים בהפרידו בני אדם יצב גבלת עמים למספר בני ישראל
