    ref: Deuteronomy 3:4
    book: Deut
    section: torah
    chapter: 3
    verse: 4
    ordinal: 4977
    text: And we took all his cities at that time; there was not a city which we took not from them; threescore cities, all the region of Argob, the kingdom of Og in Bashan.
    translation: JPS 1917
    original: וַנִּלְכֹּד אֶת־כָּל־עָרָיו בָּעֵת הַהִוא לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא־לָקַחְנוּ מֵאִתָּם שִׁשִּׁים עִיר כָּל־חֶבֶל אַרְגֹּב מַמְלֶכֶת עוֹג בַּבָּשָׁן׃
    hebrewPlain: ונלכד את כל עריו בעת ההוא לא היתה קריה אשר לא לקחנו מאתם ששים עיר כל חבל ארגב ממלכת עוג בבשן
    parashah: Devarim
