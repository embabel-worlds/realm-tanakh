- type: TanakhVerse
  data:
    osis: Deut.20.19
    scripture: tanakh
    name: Tanakh Deuteronomy 20:19
    ref: Deuteronomy 20:19
    book: Deut
    section: torah
    chapter: 20
    verse: 19
    ordinal: 5441
    text: When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by wielding an axe against them; for thou mayest eat of them, but thou shalt not cut them down; for is the tree of the field man, that it should be besieged of thee?
    translation: JPS 1917
    original: כִּי־תָצוּר אֶל־עִיר יָמִים רַבִּים לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ לֹא־תַשְׁחִית אֶת־עֵצָהּ לִנְדֹּחַ עָלָיו גַּרְזֶן כִּי מִמֶּנּוּ תֹאכֵל וְאֹתוֹ לֹא תִכְרֹת כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר׃
    hebrewPlain: כי תצור אל עיר ימים רבים להלחם עליה לתפשה לא תשחית את עצה לנדח עליו גרזן כי ממנו תאכל ואתו לא תכרת כי האדם עץ השדה לבא מפניך במצור
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:19
    kjvOsis:
    - Deut.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.20
    scripture: tanakh
    name: Tanakh Deuteronomy 20:20
    ref: Deuteronomy 20:20
    book: Deut
    section: torah
    chapter: 20
    verse: 20
    ordinal: 5442
    text: Only the trees of which thou knowest that they are not trees for food, them thou mayest destroy and cut down, that thou mayest build bulwarks against the city that maketh war with thee, until it fall.
    translation: JPS 1917
    original: רַק עֵץ אֲשֶׁר־תֵּדַע כִּי־לֹא־עֵץ מַאֲכָל הוּא אֹתוֹ תַשְׁחִית וְכָרָתָּ וּבָנִיתָ מָצוֹר עַל־הָעִיר אֲשֶׁר־הִוא עֹשָׂה עִמְּךָ מִלְחָמָה עַד רִדְתָּהּ׃
    hebrewPlain: רק עץ אשר תדע כי לא עץ מאכל הוא אתו תשחית וכרת ובנית מצור על העיר אשר הוא עשה עמך מלחמה עד רדתה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:20
    kjvOsis:
    - Deut.20.20
