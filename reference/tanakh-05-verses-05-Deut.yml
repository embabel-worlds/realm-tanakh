- type: TanakhVerse
  data:
    osis: Deut.15.15
    scripture: tanakh
    name: Tanakh Deuteronomy 15:15
    ref: Deuteronomy 15:15
    book: Deut
    section: torah
    chapter: 15
    verse: 15
    ordinal: 5329
    text: And thou shalt remember that thou wast a bondman in the land of Egypt, and the LORD thy God redeemed thee; therefore I command thee this thing to-day.
    translation: JPS 1917
    original: וְזָכַרְתָּ כִּי עֶבֶד הָיִיתָ בְּאֶרֶץ מִצְרַיִם וַיִּפְדְּךָ יְהוָה אֱלֹהֶיךָ עַל־כֵּן אָנֹכִי מְצַוְּךָ אֶת־הַדָּבָר הַזֶּה הַיּוֹם׃
    hebrewPlain: וזכרת כי עבד היית בארץ מצרים ויפדך יהוה אלהיך על כן אנכי מצוך את הדבר הזה היום
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:15
    kjvOsis:
    - Deut.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.16
    scripture: tanakh
    name: Tanakh Deuteronomy 15:16
    ref: Deuteronomy 15:16
    book: Deut
    section: torah
    chapter: 15
    verse: 16
    ordinal: 5330
    text: 'And it shall be, if he say unto thee: ‘I will not go out from thee’; because he loveth thee and thy house, because he fareth well with thee;'
    translation: JPS 1917
    original: וְהָיָה כִּי־יֹאמַר אֵלֶיךָ לֹא אֵצֵא מֵעִמָּךְ כִּי אֲהֵבְךָ וְאֶת־בֵּיתֶךָ כִּי־טוֹב לוֹ עִמָּךְ׃
    hebrewPlain: והיה כי יאמר אליך לא אצא מעמך כי אהבך ואת ביתך כי טוב לו עמך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:16
    kjvOsis:
    - Deut.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.17
    scripture: tanakh
    name: Tanakh Deuteronomy 15:17
    ref: Deuteronomy 15:17
    book: Deut
    section: torah
    chapter: 15
    verse: 17
    ordinal: 5331
    text: then thou shalt take an awl, and thrust it through his ear and into the door, and he shall be thy bondman for ever. And also unto thy bondwoman thou shalt do likewise.
    translation: JPS 1917
    original: וְלָקַחְתָּ אֶת־הַמַּרְצֵעַ וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת וְהָיָה לְךָ עֶבֶד עוֹלָם וְאַף לַאֲמָתְךָ תַּעֲשֶׂה־כֵּן׃
    hebrewPlain: ולקחת את המרצע ונתתה באזנו ובדלת והיה לך עבד עולם ואף לאמתך תעשה כן
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:17
    kjvOsis:
    - Deut.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.18
    scripture: tanakh
    name: Tanakh Deuteronomy 15:18
    ref: Deuteronomy 15:18
    book: Deut
    section: torah
    chapter: 15
    verse: 18
    ordinal: 5332
    text: It shall not seem hard unto thee, when thou lettest him go free from thee; for to the double of the hire of a hireling hath he served thee six years; and the LORD thy God will bless thee in all that thou doest.
    translation: JPS 1917
    original: לֹא־יִקְשֶׁה בְעֵינֶךָ בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ כִּי מִשְׁנֶה שְׂכַר שָׂכִיר עֲבָדְךָ שֵׁשׁ שָׁנִים וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ בְּכֹל אֲשֶׁר תַּעֲשֶׂה׃
    hebrewPlain: לא יקשה בעינך בשלחך אתו חפשי מעמך כי משנה שכר שכיר עבדך שש שנים וברכך יהוה אלהיך בכל אשר תעשה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:18
    kjvOsis:
    - Deut.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.19
    scripture: tanakh
    name: Tanakh Deuteronomy 15:19
    ref: Deuteronomy 15:19
    book: Deut
    section: torah
    chapter: 15
    verse: 19
    ordinal: 5333
    text: All the firstling males that are born of thy herd and of thy flock thou shalt sanctify unto the LORD thy God; thou shalt do no work with the firstling of thine ox, nor shear the firstling of thy flock.
    translation: JPS 1917
    original: כָּל־הַבְּכוֹר אֲשֶׁר יִוָּלֵד בִּבְקָרְךָ וּבְצֹאנְךָ הַזָּכָר תַּקְדִּישׁ לַיהוָה אֱלֹהֶיךָ לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ׃
    hebrewPlain: כל הבכור אשר יולד בבקרך ובצאנך הזכר תקדיש ליהוה אלהיך לא תעבד בבכר שורך ולא תגז בכור צאנך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:19
    kjvOsis:
    - Deut.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.20
    scripture: tanakh
    name: Tanakh Deuteronomy 15:20
    ref: Deuteronomy 15:20
    book: Deut
    section: torah
    chapter: 15
    verse: 20
    ordinal: 5334
    text: Thou shalt eat it before the LORD thy God year by year in the place which the LORD shall choose, thou and thy household.
    translation: JPS 1917
    original: לִפְנֵי יְהוָה אֱלֹהֶיךָ תֹאכֲלֶנּוּ שָׁנָה בְשָׁנָה בַּמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה אַתָּה וּבֵיתֶךָ׃
    hebrewPlain: לפני יהוה אלהיך תאכלנו שנה בשנה במקום אשר יבחר יהוה אתה וביתך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:20
    kjvOsis:
    - Deut.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.21
    scripture: tanakh
    name: Tanakh Deuteronomy 15:21
    ref: Deuteronomy 15:21
    book: Deut
    section: torah
    chapter: 15
    verse: 21
    ordinal: 5335
    text: And if there be any blemish therein, lameness, or blindness, any ill blemish whatsoever, thou shalt not sacrifice it unto the LORD thy God.
    translation: JPS 1917
    original: וְכִי־יִהְיֶה בוֹ מוּם פִּסֵּחַ אוֹ עִוֵּר כֹּל מוּם רָע לֹא תִזְבָּחֶנּוּ לַיהוָה אֱלֹהֶיךָ׃
    hebrewPlain: וכי יהיה בו מום פסח או עור כל מום רע לא תזבחנו ליהוה אלהיך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:21
    kjvOsis:
    - Deut.15.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.22
    scripture: tanakh
    name: Tanakh Deuteronomy 15:22
    ref: Deuteronomy 15:22
    book: Deut
    section: torah
    chapter: 15
    verse: 22
    ordinal: 5336
    text: Thou shalt eat it within thy gates; the unclean and the clean may eat it alike, as the gazelle, and as the hart.
    translation: JPS 1917
    original: בִּשְׁעָרֶיךָ תֹּאכֲלֶנּוּ הַטָּמֵא וְהַטָּהוֹר יַחְדָּו כַּצְּבִי וְכָאַיָּל׃
    hebrewPlain: בשעריך תאכלנו הטמא והטהור יחדו כצבי וכאיל
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:22
    kjvOsis:
    - Deut.15.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.23
    scripture: tanakh
    name: Tanakh Deuteronomy 15:23
    ref: Deuteronomy 15:23
    book: Deut
    section: torah
    chapter: 15
    verse: 23
    ordinal: 5337
    text: Only thou shalt not eat the blood thereof; thou shalt pour it out upon the ground as water.
    translation: JPS 1917
    original: רַק אֶת־דָּמוֹ לֹא תֹאכֵל עַל־הָאָרֶץ תִּשְׁפְּכֶנּוּ כַּמָּיִם׃
    hebrewPlain: רק את דמו לא תאכל על הארץ תשפכנו כמים
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:23
    kjvOsis:
    - Deut.15.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.1
    scripture: tanakh
    name: Tanakh Deuteronomy 16:1
    ref: Deuteronomy 16:1
    book: Deut
    section: torah
    chapter: 16
    verse: 1
    ordinal: 5338
    text: Observe the month of Abib, and keep the passover unto the LORD thy God; for in the month of Abib the LORD thy God brought thee forth out of Egypt by night.
    translation: JPS 1917
    original: שָׁמוֹר אֶת־חֹדֶשׁ הָאָבִיב וְעָשִׂיתָ פֶּסַח לַיהוָה אֱלֹהֶיךָ כִּי בְּחֹדֶשׁ הָאָבִיב הוֹצִיאֲךָ יְהוָה אֱלֹהֶיךָ מִמִּצְרַיִם לָיְלָה׃
    hebrewPlain: שמור את חדש האביב ועשית פסח ליהוה אלהיך כי בחדש האביב הוציאך יהוה אלהיך ממצרים לילה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:1
    kjvOsis:
    - Deut.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.2
    scripture: tanakh
    name: Tanakh Deuteronomy 16:2
    ref: Deuteronomy 16:2
    book: Deut
    section: torah
    chapter: 16
    verse: 2
    ordinal: 5339
    text: And thou shalt sacrifice the passover-offering unto the LORD thy God, of the flock and the herd, in the place which the LORD shall choose to cause His name to dwell there.
    translation: JPS 1917
    original: וְזָבַחְתָּ פֶּסַח לַיהוָה אֱלֹהֶיךָ צֹאן וּבָקָר בַּמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה לְשַׁכֵּן שְׁמוֹ שָׁם׃
    hebrewPlain: וזבחת פסח ליהוה אלהיך צאן ובקר במקום אשר יבחר יהוה לשכן שמו שם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:2
    kjvOsis:
    - Deut.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.3
    scripture: tanakh
    name: Tanakh Deuteronomy 16:3
    ref: Deuteronomy 16:3
    book: Deut
    section: torah
    chapter: 16
    verse: 3
    ordinal: 5340
    text: Thou shalt eat no leavened bread with it; seven days shalt thou eat unleavened bread therewith, even the bread of affliction; for in haste didst thou come forth out of the land of Egypt; that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.
    translation: JPS 1917
    original: לֹא־תֹאכַל עָלָיו חָמֵץ שִׁבְעַת יָמִים תֹּאכַל־עָלָיו מַצּוֹת לֶחֶם עֹנִי כִּי בְחִפָּזוֹן יָצָאתָ מֵאֶרֶץ מִצְרַיִם לְמַעַן תִּזְכֹּר אֶת־יוֹם צֵאתְךָ מֵאֶרֶץ מִצְרַיִם כֹּל יְמֵי חַיֶּיךָ׃
    hebrewPlain: לא תאכל עליו חמץ שבעת ימים תאכל עליו מצות לחם עני כי בחפזון יצאת מארץ מצרים למען תזכר את יום צאתך מארץ מצרים כל ימי חייך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:3
    kjvOsis:
    - Deut.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.4
    scripture: tanakh
    name: Tanakh Deuteronomy 16:4
    ref: Deuteronomy 16:4
    book: Deut
    section: torah
    chapter: 16
    verse: 4
    ordinal: 5341
    text: And there shall be no leaven seen with thee in all thy borders seven days; neither shall any of the flesh, which thou sacrificest the first day at even, remain all night until the morning.
    translation: JPS 1917
    original: וְלֹא־יֵרָאֶה לְךָ שְׂאֹר בְּכָל־גְּבֻלְךָ שִׁבְעַת יָמִים וְלֹא־יָלִין מִן־הַבָּשָׂר אֲשֶׁר תִּזְבַּח בָּעֶרֶב בַּיּוֹם הָרִאשׁוֹן לַבֹּקֶר׃
    hebrewPlain: ולא יראה לך שאר בכל גבלך שבעת ימים ולא ילין מן הבשר אשר תזבח בערב ביום הראשון לבקר
    parashah: Re'eh
