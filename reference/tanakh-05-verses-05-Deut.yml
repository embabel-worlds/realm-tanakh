  data:
    osis: Deut.1.24
    scripture: tanakh
    name: Tanakh Deuteronomy 1:24
    ref: Deuteronomy 1:24
    book: Deut
    section: torah
    chapter: 1
    verse: 24
    ordinal: 4914
    text: and they turned and went up into the mountains, and came unto the valley of Eshcol, and spied it out.
    translation: JPS 1917
    original: וַיִּפְנוּ וַיַּעֲלוּ הָהָרָה וַיָּבֹאוּ עַד־נַחַל אֶשְׁכֹּל וַיְרַגְּלוּ אֹתָהּ׃
    hebrewPlain: ויפנו ויעלו ההרה ויבאו עד נחל אשכל וירגלו אתה
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:24
    kjvOsis:
    - Deut.1.24
