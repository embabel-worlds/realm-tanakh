  data:
    osis: Deut.5.23
    scripture: tanakh
    name: Tanakh Deuteronomy 5:23
    ref: Deuteronomy 5:23
    book: Deut
    section: torah
    chapter: 5
    verse: 23
    ordinal: 5074
    text: For who is there of all flesh, that hath heard the voice of the living God speaking out of the midst of the fire, as we have, and lived?
    translation: JPS 1917
    original: כִּי מִי כָל־בָּשָׂר אֲשֶׁר שָׁמַע קוֹל אֱלֹהִים חַיִּים מְדַבֵּר מִתּוֹךְ־הָאֵשׁ כָּמֹנוּ וַיֶּחִי׃
    hebrewPlain: כי מי כל בשר אשר שמע קול אלהים חיים מדבר מתוך האש כמנו ויחי
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:26
    kjvOsis:
    - Deut.5.26
