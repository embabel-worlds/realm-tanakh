    section: torah
    chapter: 11
    verse: 13
    ordinal: 5216
    text: And it shall come to pass, if ye shall hearken diligently unto My commandments which I command you this day, to love the LORD your God, and to serve Him with all your heart and with all your soul,
    translation: JPS 1917
    original: וְהָיָה אִם־שָׁמֹעַ תִּשְׁמְעוּ אֶל־מִצְוֺתַי אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם לְאַהֲבָה אֶת־יְהוָה אֱלֹהֵיכֶם וּלְעָבְדוֹ בְּכָל־לְבַבְכֶם וּבְכָל־נַפְשְׁכֶם׃
    hebrewPlain: והיה אם שמע תשמעו אל מצותי אשר אנכי מצוה אתכם היום לאהבה את יהוה אלהיכם ולעבדו בכל לבבכם ובכל נפשכם
