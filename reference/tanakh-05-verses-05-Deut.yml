    scripture: tanakh
    name: Tanakh Deuteronomy 31:1
    ref: Deuteronomy 31:1
    book: Deut
    section: torah
    chapter: 31
    verse: 1
    ordinal: 5724
    text: And Moses went and spoke these words unto all Israel.
    translation: JPS 1917
    original: וַיֵּלֶךְ מֹשֶׁה וַיְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה אֶל־כָּל־יִשְׂרָאֵל׃
    hebrewPlain: וילך משה וידבר את הדברים האלה אל כל ישראל
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:1
    kjvOsis:
    - Deut.31.1
  relations:
