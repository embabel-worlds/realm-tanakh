    ref: Deuteronomy 15:1
    book: Deut
    section: torah
    chapter: 15
    verse: 1
    ordinal: 5315
    text: At the end of every seven years thou shalt make a release.
    translation: JPS 1917
    original: מִקֵּץ שֶׁבַע־שָׁנִים תַּעֲשֶׂה שְׁמִטָּה׃
    hebrewPlain: מקץ שבע שנים תעשה שמטה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:1
    kjvOsis:
