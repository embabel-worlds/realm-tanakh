- type: TanakhVerse
  data:
    osis: Deut.4.27
    scripture: tanakh
    name: Tanakh Deuteronomy 4:27
    ref: Deuteronomy 4:27
    book: Deut
    section: torah
    chapter: 4
    verse: 27
    ordinal: 5029
    text: And the LORD shall scatter you among the peoples, and ye shall be left few in number among the nations, whither the LORD shall lead you away.
    translation: JPS 1917
    original: וְהֵפִיץ יְהוָה אֶתְכֶם בָּעַמִּים וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר בַּגּוֹיִם אֲשֶׁר יְנַהֵג יְהוָה אֶתְכֶם שָׁמָּה׃
    hebrewPlain: והפיץ יהוה אתכם בעמים ונשארתם מתי מספר בגוים אשר ינהג יהוה אתכם שמה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:27
    kjvOsis:
    - Deut.4.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
