  data:
    osis: Deut.28.9
    scripture: tanakh
    name: Tanakh Deuteronomy 28:9
    ref: Deuteronomy 28:9
    book: Deut
    section: torah
    chapter: 28
    verse: 9
    ordinal: 5615
    text: The LORD will establish thee for a holy people unto Himself, as He hath sworn unto thee; if thou shalt keep the commandments of the LORD thy God, and walk in His ways.
    translation: JPS 1917
    original: יְקִימְךָ יְהוָה לוֹ לְעַם קָדוֹשׁ כַּאֲשֶׁר נִשְׁבַּע־לָךְ כִּי תִשְׁמֹר אֶת־מִצְוֺת יְהוָה אֱלֹהֶיךָ וְהָלַכְתָּ בִּדְרָכָיו׃
    hebrewPlain: יקימך יהוה לו לעם קדוש כאשר נשבע לך כי תשמר את מצות יהוה אלהיך והלכת בדרכיו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:9
    kjvOsis:
    - Deut.28.9
