      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.16
    scripture: tanakh
    name: Tanakh Deuteronomy 31:16
    ref: Deuteronomy 31:16
    book: Deut
    section: torah
    chapter: 31
    verse: 16
    ordinal: 5739
    text: 'And the LORD said unto Moses: ‘Behold, thou art about to sleep with thy fathers; and this people will rise up, and go astray after the foreign gods of the land, whither they go to be among them, and will forsake Me, and break My covenant which I have made with them.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־מֹשֶׁה הִנְּךָ שֹׁכֵב עִם־אֲבֹתֶיךָ וְקָם הָעָם הַזֶּה וְזָנָה אַחֲרֵי אֱלֹהֵי נֵכַר־הָאָרֶץ אֲשֶׁר הוּא בָא־שָׁמָּה בְּקִרְבּוֹ וַעֲזָבַנִי וְהֵפֵר אֶת־בְּרִיתִי אֲשֶׁר כָּרַתִּי אִתּוֹ׃
    hebrewPlain: ויאמר יהוה אל משה הנך שכב עם אבתיך וקם העם הזה וזנה אחרי אלהי נכר הארץ אשר הוא בא שמה בקרבו ועזבני והפר את בריתי אשר כרתי אתו
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:16
    kjvOsis:
    - Deut.31.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.17
    scripture: tanakh
    name: Tanakh Deuteronomy 31:17
    ref: Deuteronomy 31:17
    book: Deut
    section: torah
    chapter: 31
    verse: 17
    ordinal: 5740
    text: 'Then My anger shall be kindled against them in that day, and I will forsake them, and I will hide My face from them, and they shall be devoured, and many evils and troubles shall come upon them; so that they will say in that day: Are not these evils come upon us because our God is not among us?'
    translation: JPS 1917
    original: וְחָרָה אַפִּי בוֹ בַיּוֹם־הַהוּא וַעֲזַבְתִּים וְהִסְתַּרְתִּי פָנַי מֵהֶם וְהָיָה לֶאֱכֹל וּמְצָאֻהוּ רָעוֹת רַבּוֹת וְצָרוֹת וְאָמַר בַּיּוֹם הַהוּא הֲלֹא עַל כִּי־אֵין אֱלֹהַי בְּקִרְבִּי מְצָאוּנִי הָרָעוֹת הָאֵלֶּה׃
    hebrewPlain: וחרה אפי בו ביום ההוא ועזבתים והסתרתי פני מהם והיה לאכל ומצאהו רעות רבות וצרות ואמר ביום ההוא הלא על כי אין אלהי בקרבי מצאוני הרעות האלה
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:17
    kjvOsis:
    - Deut.31.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.18
    scripture: tanakh
    name: Tanakh Deuteronomy 31:18
    ref: Deuteronomy 31:18
    book: Deut
    section: torah
    chapter: 31
    verse: 18
    ordinal: 5741
    text: And I will surely hide My face in that day for all the evil which they shall have wrought, in that they are turned unto other gods.
    translation: JPS 1917
    original: וְאָנֹכִי הַסְתֵּר אַסְתִּיר פָּנַי בַּיּוֹם הַהוּא עַל כָּל־הָרָעָה אֲשֶׁר עָשָׂה כִּי פָנָה אֶל־אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ואנכי הסתר אסתיר פני ביום ההוא על כל הרעה אשר עשה כי פנה אל אלהים אחרים
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:18
    kjvOsis:
    - Deut.31.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.19
    scripture: tanakh
    name: Tanakh Deuteronomy 31:19
    ref: Deuteronomy 31:19
    book: Deut
    section: torah
    chapter: 31
    verse: 19
    ordinal: 5742
    text: Now therefore write ye this song for you, and teach thou it the children of Israel; put it in their mouths, that this song may be a witness for Me against the children of Israel.
    translation: JPS 1917
    original: וְעַתָּה כִּתְבוּ לָכֶם אֶת־הַשִּׁירָה הַזֹּאת וְלַמְּדָהּ אֶת־בְּנֵי־יִשְׂרָאֵל שִׂימָהּ בְּפִיהֶם לְמַעַן תִּהְיֶה־לִּי הַשִּׁירָה הַזֹּאת לְעֵד בִּבְנֵי יִשְׂרָאֵל׃
    hebrewPlain: ועתה כתבו לכם את השירה הזאת ולמדה את בני ישראל שימה בפיהם למען תהיה לי השירה הזאת לעד בבני ישראל
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:19
    kjvOsis:
    - Deut.31.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.20
    scripture: tanakh
    name: Tanakh Deuteronomy 31:20
    ref: Deuteronomy 31:20
    book: Deut
    section: torah
    chapter: 31
    verse: 20
    ordinal: 5743
    text: For when I shall have brought them into the land which I swore unto their fathers, flowing with milk and honey; and they shall have eaten their fill, and waxen fat; and turned unto other gods, and served them, and despised Me, and broken My covenant;
    translation: JPS 1917
    original: כִּי־אֲבִיאֶנּוּ אֶל־הָאֲדָמָה אֲשֶׁר־נִשְׁבַּעְתִּי לַאֲבֹתָיו זָבַת חָלָב וּדְבַשׁ וְאָכַל וְשָׂבַע וְדָשֵׁן וּפָנָה אֶל־אֱלֹהִים אֲחֵרִים וַעֲבָדוּם וְנִאֲצוּנִי וְהֵפֵר אֶת־בְּרִיתִי׃
    hebrewPlain: כי אביאנו אל האדמה אשר נשבעתי לאבתיו זבת חלב ודבש ואכל ושבע ודשן ופנה אל אלהים אחרים ועבדום ונאצוני והפר את בריתי
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:20
    kjvOsis:
    - Deut.31.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.21
    scripture: tanakh
    name: Tanakh Deuteronomy 31:21
    ref: Deuteronomy 31:21
    book: Deut
    section: torah
    chapter: 31
    verse: 21
    ordinal: 5744
    text: then it shall come to pass, when many evils and troubles are come upon them, that this song shall testify before them as a witness; for it shall not be forgotten out of the mouths of their seed; for I know their imagination how they do even now, before I have brought them into the land which I swore.’
    translation: JPS 1917
    original: וְהָיָה כִּי־תִמְצֶאןָ אֹתוֹ רָעוֹת רַבּוֹת וְצָרוֹת וְעָנְתָה הַשִּׁירָה הַזֹּאת לְפָנָיו לְעֵד כִּי לֹא תִשָּׁכַח מִפִּי זַרְעוֹ כִּי יָדַעְתִּי אֶת־יִצְרוֹ אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם בְּטֶרֶם אֲבִיאֶנּוּ אֶל־הָאָרֶץ אֲשֶׁר נִשְׁבָּעְתִּי׃
    hebrewPlain: והיה כי תמצאן אתו רעות רבות וצרות וענתה השירה הזאת לפניו לעד כי לא תשכח מפי זרעו כי ידעתי את יצרו אשר הוא עשה היום בטרם אביאנו אל הארץ אשר נשבעתי
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:21
    kjvOsis:
    - Deut.31.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.22
    scripture: tanakh
    name: Tanakh Deuteronomy 31:22
    ref: Deuteronomy 31:22
    book: Deut
    section: torah
    chapter: 31
    verse: 22
    ordinal: 5745
    text: So Moses wrote this song the same day, and taught it the children of Israel.
    translation: JPS 1917
    original: וַיִּכְתֹּב מֹשֶׁה אֶת־הַשִּׁירָה הַזֹּאת בַּיּוֹם הַהוּא וַיְלַמְּדָהּ אֶת־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכתב משה את השירה הזאת ביום ההוא וילמדה את בני ישראל
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:22
    kjvOsis:
    - Deut.31.22
