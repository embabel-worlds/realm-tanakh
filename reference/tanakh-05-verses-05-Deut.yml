  data:
    osis: Deut.5.19
    scripture: tanakh
    name: Tanakh Deuteronomy 5:19
    ref: Deuteronomy 5:19
    book: Deut
    section: torah
    chapter: 5
    verse: 19
    ordinal: 5070
    text: These words the LORD spoke unto all your assembly in the mount out of the midst of the fire, of the cloud, and of the thick darkness, with a great voice, and it went on no more. And He wrote them upon two tables of stone, and gave them unto me.
    translation: JPS 1917
    original: אֶת־הַדְּבָרִים הָאֵלֶּה דִּבֶּר יְהוָה אֶל־כָּל־קְהַלְכֶם בָּהָר מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל קוֹל גָּדוֹל וְלֹא יָסָף וַיִּכְתְּבֵם עַל־שְׁנֵי לֻחֹת אֲבָנִים וַיִּתְּנֵם אֵלָי׃
    hebrewPlain: את הדברים האלה דבר יהוה אל כל קהלכם בהר מתוך האש הענן והערפל קול גדול ולא יסף ויכתבם על שני לחת אבנים ויתנם אלי
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:22
    kjvOsis:
    - Deut.5.22
