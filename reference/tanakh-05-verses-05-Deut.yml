    scripture: tanakh
    name: Tanakh Deuteronomy 12:20
    ref: Deuteronomy 12:20
    book: Deut
    section: torah
    chapter: 12
    verse: 20
    ordinal: 5255
    text: 'When the LORD thy God shall enlarge thy border, as He hath promised thee, and thou shalt say: ‘I will eat flesh’, because thy soul desireth to eat flesh; thou mayest eat flesh, after all the desire of thy soul.'
    translation: JPS 1917
    original: כִּי־יַרְחִיב יְהוָה אֱלֹהֶיךָ אֶת־גְּבוּלְךָ כַּאֲשֶׁר דִּבֶּר־לָךְ וְאָמַרְתָּ אֹכְלָה בָשָׂר כִּי־תְאַוֶּה נַפְשְׁךָ לֶאֱכֹל בָּשָׂר בְּכָל־אַוַּת נַפְשְׁךָ תֹּאכַל בָּשָׂר׃
    hebrewPlain: כי ירחיב יהוה אלהיך את גבולך כאשר דבר לך ואמרת אכלה בשר כי תאוה נפשך לאכל בשר בכל אות נפשך תאכל בשר
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:20
    kjvOsis:
    - Deut.12.20
