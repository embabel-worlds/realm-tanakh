    scripture: tanakh
    name: Tanakh Deuteronomy 31:24
    ref: Deuteronomy 31:24
    book: Deut
    section: torah
    chapter: 31
    verse: 24
    ordinal: 5747
    text: And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished,
    translation: JPS 1917
    original: וַיְהִי כְּכַלּוֹת מֹשֶׁה לִכְתֹּב אֶת־דִּבְרֵי הַתּוֹרָה־הַזֹּאת עַל־סֵפֶר עַד תֻּמָּם׃
    hebrewPlain: ויהי ככלות משה לכתב את דברי התורה הזאת על ספר עד תמם
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:24
    kjvOsis:
    - Deut.31.24
