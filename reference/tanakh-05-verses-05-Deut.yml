    section: torah
    chapter: 3
    verse: 27
    ordinal: 5000
    text: Get thee up into the top of Pisgah, and lift up thine eyes westward, and northward, and southward, and eastward, and behold with thine eyes; for thou shalt not go over this Jordan.
    translation: JPS 1917
    original: עֲלֵה רֹאשׁ הַפִּסְגָּה וְשָׂא עֵינֶיךָ יָמָּה וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה וּרְאֵה בְעֵינֶיךָ כִּי־לֹא תַעֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה׃
    hebrewPlain: עלה ראש הפסגה ושא עיניך ימה וצפנה ותימנה ומזרחה וראה בעיניך כי לא תעבר את הירדן הזה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 3:27
    kjvOsis:
