  data:
    osis: Deut.28.22
    scripture: tanakh
    name: Tanakh Deuteronomy 28:22
    ref: Deuteronomy 28:22
    book: Deut
    section: torah
    chapter: 28
    verse: 22
    ordinal: 5628
    text: The LORD will smite thee with consumption, and with fever, and with inflammation, and with fiery heat, and with drought, and with blasting, and with mildew; and they shall pursue thee until thou perish.
    translation: JPS 1917
    original: יַכְּכָה יְהוָה בַּשַּׁחֶפֶת וּבַקַּדַּחַת וּבַדַּלֶּקֶת וּבַחַרְחֻר וּבַחֶרֶב וּבַשִּׁדָּפוֹן וּבַיֵּרָקוֹן וּרְדָפוּךָ עַד אָבְדֶךָ׃
    hebrewPlain: יככה יהוה בשחפת ובקדחת ובדלקת ובחרחר ובחרב ובשדפון ובירקון ורדפוך עד אבדך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:22
    kjvOsis:
    - Deut.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
