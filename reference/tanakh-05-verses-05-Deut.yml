- type: TanakhVerse
  data:
    osis: Deut.1.25
    scripture: tanakh
    name: Tanakh Deuteronomy 1:25
    ref: Deuteronomy 1:25
    book: Deut
    section: torah
    chapter: 1
    verse: 25
    ordinal: 4915
    text: 'And they took of the fruit of the land in their hands, and brought it down unto us, and brought us back word, and said: ‘Good is the land which the LORD our God giveth unto us.’'
    translation: JPS 1917
    original: וַיִּקְחוּ בְיָדָם מִפְּרִי הָאָרֶץ וַיּוֹרִדוּ אֵלֵינוּ וַיָּשִׁבוּ אֹתָנוּ דָבָר וַיֹּאמְרוּ טוֹבָה הָאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֵינוּ נֹתֵן לָנוּ׃
    hebrewPlain: ויקחו בידם מפרי הארץ ויורדו אלינו וישבו אתנו דבר ויאמרו טובה הארץ אשר יהוה אלהינו נתן לנו
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:25
    kjvOsis:
    - Deut.1.25
  relations:
