    translation: JPS 1917
    original: וְיֶתֶר הַגִּלְעָד וְכָל־הַבָּשָׁן מַמְלֶכֶת עוֹג נָתַתִּי לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה כֹּל חֶבֶל הָאַרְגֹּב לְכָל־הַבָּשָׁן הַהוּא יִקָּרֵא אֶרֶץ רְפָאִים׃
    hebrewPlain: ויתר הגלעד וכל הבשן ממלכת עוג נתתי לחצי שבט המנשה כל חבל הארגב לכל הבשן ההוא יקרא ארץ רפאים
    parashah: Devarim
    kjvRefs:
