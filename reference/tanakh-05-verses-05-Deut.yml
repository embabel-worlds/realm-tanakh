    scripture: tanakh
    name: Tanakh Deuteronomy 2:14
    ref: Deuteronomy 2:14
    book: Deut
    section: torah
    chapter: 2
    verse: 14
    ordinal: 4950
    text: And the days in which we came from Kadesh-barnea, until we were come over the brook Zered, were thirty and eight years; until all the generation, even the men of war, were consumed from the midst of the camp, as the LORD swore unto them.
    translation: JPS 1917
    original: וְהַיָּמִים אֲשֶׁר־הָלַכְנוּ מִקָּדֵשׁ בַּרְנֵעַ עַד אֲשֶׁר־עָבַרְנוּ אֶת־נַחַל זֶרֶד שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה עַד־תֹּם כָּל־הַדּוֹר אַנְשֵׁי הַמִּלְחָמָה מִקֶּרֶב הַמַּחֲנֶה כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם׃
    hebrewPlain: והימים אשר הלכנו מקדש ברנע עד אשר עברנו את נחל זרד שלשים ושמנה שנה עד תם כל הדור אנשי המלחמה מקרב המחנה כאשר נשבע יהוה להם
