  data:
    osis: Deut.1.19
    scripture: tanakh
    name: Tanakh Deuteronomy 1:19
    ref: Deuteronomy 1:19
    book: Deut
    section: torah
    chapter: 1
    verse: 19
    ordinal: 4909
    text: And we journeyed from Horeb, and went through all that great and dreadful wilderness which ye saw, by the way to the hill-country of the Amorites, as the LORD our God commanded us; and we came to Kadesh-barnea.
    translation: JPS 1917
    original: וַנִּסַּע מֵחֹרֵב וַנֵּלֶךְ אֵת כָּל־הַמִּדְבָּר הַגָּדוֹל וְהַנּוֹרָא הַהוּא אֲשֶׁר רְאִיתֶם דֶּרֶךְ הַר הָאֱמֹרִי כַּאֲשֶׁר צִוָּה יְהוָה אֱלֹהֵינוּ אֹתָנוּ וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ׃
    hebrewPlain: ונסע מחרב ונלך את כל המדבר הגדול והנורא ההוא אשר ראיתם דרך הר האמרי כאשר צוה יהוה אלהינו אתנו ונבא עד קדש ברנע
    parashah: Devarim
    kjvRefs:
