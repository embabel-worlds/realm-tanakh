    translation: JPS 1917
    original: הִשָּׁמֶר לְךָ פֶּן־תַּעֲזֹב אֶת־הַלֵּוִי כָּל־יָמֶיךָ עַל־אַדְמָתֶךָ׃
    hebrewPlain: השמר לך פן תעזב את הלוי כל ימיך על אדמתך
