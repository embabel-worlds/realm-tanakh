    scripture: tanakh
    name: Tanakh Deuteronomy 18:21
    ref: Deuteronomy 18:21
    book: Deut
    section: torah
    chapter: 18
    verse: 21
    ordinal: 5400
    text: 'And if thou say in thy heart: ‘How shall we know the word which the LORD hath not spoken?’'
    translation: JPS 1917
    original: וְכִי תֹאמַר בִּלְבָבֶךָ אֵיכָה נֵדַע אֶת־הַדָּבָר אֲשֶׁר לֹא־דִבְּרוֹ יְהוָה׃
    hebrewPlain: וכי תאמר בלבבך איכה נדע את הדבר אשר לא דברו יהוה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:21
    kjvOsis:
    - Deut.18.21
