    ref: Deuteronomy 19:15
    book: Deut
    section: torah
    chapter: 19
    verse: 15
    ordinal: 5416
    text: One witness shall not rise up against a man for any iniquity, or for any sin, in any sin that he sinneth; at the mouth of two witnesses, or at the mouth of three witnesses, shall a matter be established.
    translation: JPS 1917
    original: לֹא־יָקוּם עֵד אֶחָד בְּאִישׁ לְכָל־עָוֺן וּלְכָל־חַטָּאת בְּכָל־חֵטְא אֲשֶׁר יֶחֱטָא עַל־פִּי שְׁנֵי עֵדִים אוֹ עַל־פִּי שְׁלֹשָׁה־עֵדִים יָקוּם דָּבָר׃
    hebrewPlain: לא יקום עד אחד באיש לכל עון ולכל חטאת בכל חטא אשר יחטא על פי שני עדים או על פי שלשה עדים יקום דבר
