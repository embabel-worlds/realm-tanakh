    section: torah
    chapter: 24
    verse: 8
    ordinal: 5528
    text: Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you, as I commanded them, so ye shall observe to do.
    translation: JPS 1917
    original: הִשָּׁמֶר בְּנֶגַע־הַצָּרַעַת לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר־יוֹרוּ אֶתְכֶם הַכֹּהֲנִים הַלְוִיִּם כַּאֲשֶׁר צִוִּיתִם תִּשְׁמְרוּ לַעֲשׂוֹת׃
    hebrewPlain: השמר בנגע הצרעת לשמר מאד ולעשות ככל אשר יורו אתכם הכהנים הלוים כאשר צויתם תשמרו לעשות
