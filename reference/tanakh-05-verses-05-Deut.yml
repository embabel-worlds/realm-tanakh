  data:
    osis: Deut.9.17
    scripture: tanakh
    name: Tanakh Deuteronomy 9:17
    ref: Deuteronomy 9:17
    book: Deut
    section: torah
    chapter: 9
    verse: 17
    ordinal: 5169
    text: And I took hold of the two tables, and cast them out of my two hands, and broke them before your eyes.
    translation: JPS 1917
    original: וָאֶתְפֹּשׂ בִּשְׁנֵי הַלֻּחֹת וָאַשְׁלִכֵם מֵעַל שְׁתֵּי יָדָי וָאֲשַׁבְּרֵם לְעֵינֵיכֶם׃
    hebrewPlain: ואתפש בשני הלחת ואשלכם מעל שתי ידי ואשברם לעיניכם
    parashah: Eikev
    kjvRefs:
