- type: TanakhVerse
  data:
    osis: Deut.7.1
    scripture: tanakh
    name: Tanakh Deuteronomy 7:1
    ref: Deuteronomy 7:1
    book: Deut
    section: torah
    chapter: 7
    verse: 1
    ordinal: 5107
    text: When the LORD thy God shall bring thee into the land whither thou goest to possess it, and shall cast out many nations before thee, the Hittite, and the Girgashite, and the Amorite, and the Canaanite, and the Perizzite, and the Hivite, and the Jebusite, seven nations greater and mightier than thou;
    translation: JPS 1917
    original: כִּי יְבִיאֲךָ יְהוָה אֱלֹהֶיךָ אֶל־הָאָרֶץ אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ וְנָשַׁל גּוֹיִם־רַבִּים מִפָּנֶיךָ הַחִתִּי וְהַגִּרְגָּשִׁי וְהָאֱמֹרִי וְהַכְּנַעֲנִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ׃
    hebrewPlain: כי יביאך יהוה אלהיך אל הארץ אשר אתה בא שמה לרשתה ונשל גוים רבים מפניך החתי והגרגשי והאמרי והכנעני והפרזי והחוי והיבוסי שבעה גוים רבים ועצומים ממך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:1
    kjvOsis:
    - Deut.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.2
    scripture: tanakh
    name: Tanakh Deuteronomy 7:2
    ref: Deuteronomy 7:2
    book: Deut
    section: torah
    chapter: 7
    verse: 2
    ordinal: 5108
    text: and when the LORD thy God shall deliver them up before thee, and thou shalt smite them; then thou shalt utterly destroy them; thou shalt make no covenant with them, nor show mercy unto them;
    translation: JPS 1917
    original: וּנְתָנָם יְהוָה אֱלֹהֶיךָ לְפָנֶיךָ וְהִכִּיתָם הַחֲרֵם תַּחֲרִים אֹתָם לֹא־תִכְרֹת לָהֶם בְּרִית וְלֹא תְחָנֵּם׃
    hebrewPlain: ונתנם יהוה אלהיך לפניך והכיתם החרם תחרים אתם לא תכרת להם ברית ולא תחנם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:2
    kjvOsis:
    - Deut.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.3
    scripture: tanakh
    name: Tanakh Deuteronomy 7:3
    ref: Deuteronomy 7:3
    book: Deut
    section: torah
    chapter: 7
    verse: 3
    ordinal: 5109
    text: 'neither shalt thou make marriages with them: thy daughter thou shalt not give unto his son, nor his daughter shalt thou take unto thy son.'
    translation: JPS 1917
    original: וְלֹא תִתְחַתֵּן בָּם בִּתְּךָ לֹא־תִתֵּן לִבְנוֹ וּבִתּוֹ לֹא־תִקַּח לִבְנֶךָ׃
    hebrewPlain: ולא תתחתן בם בתך לא תתן לבנו ובתו לא תקח לבנך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:3
    kjvOsis:
    - Deut.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.4
    scripture: tanakh
    name: Tanakh Deuteronomy 7:4
    ref: Deuteronomy 7:4
    book: Deut
    section: torah
    chapter: 7
    verse: 4
    ordinal: 5110
    text: For he will turn away thy son from following Me, that they may serve other gods; so will the anger of the LORD be kindled against you, and He will destroy thee quickly.
    translation: JPS 1917
    original: כִּי־יָסִיר אֶת־בִּנְךָ מֵאַחֲרַי וְעָבְדוּ אֱלֹהִים אֲחֵרִים וְחָרָה אַף־יְהוָה בָּכֶם וְהִשְׁמִידְךָ מַהֵר׃
    hebrewPlain: כי יסיר את בנך מאחרי ועבדו אלהים אחרים וחרה אף יהוה בכם והשמידך מהר
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:4
    kjvOsis:
    - Deut.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.5
    scripture: tanakh
    name: Tanakh Deuteronomy 7:5
    ref: Deuteronomy 7:5
    book: Deut
    section: torah
    chapter: 7
    verse: 5
    ordinal: 5111
    text: 'But thus shall ye deal with them: ye shall break down their altars, and dash in pieces their pillars, and hew down their Asherim, and burn their graven images with fire.'
    translation: JPS 1917
    original: כִּי־אִם־כֹּה תַעֲשׂוּ לָהֶם מִזְבְּחֹתֵיהֶם תִּתֹּצוּ וּמַצֵּבֹתָם תְּשַׁבֵּרוּ וַאֲשֵׁירֵהֶם תְּגַדֵּעוּן וּפְסִילֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ׃
    hebrewPlain: כי אם כה תעשו להם מזבחתיהם תתצו ומצבתם תשברו ואשירהם תגדעון ופסיליהם תשרפון באש
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:5
    kjvOsis:
    - Deut.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.6
    scripture: tanakh
    name: Tanakh Deuteronomy 7:6
    ref: Deuteronomy 7:6
    book: Deut
    section: torah
    chapter: 7
    verse: 6
    ordinal: 5112
    text: 'For thou art a holy people unto the LORD thy God: the LORD thy God hath chosen thee to be His own treasure, out of all peoples that are upon the face of the earth.'
    translation: JPS 1917
    original: כִּי עַם קָדוֹשׁ אַתָּה לַיהוָה אֱלֹהֶיךָ בְּךָ בָּחַר יְהוָה אֱלֹהֶיךָ לִהְיוֹת לוֹ לְעַם סְגֻלָּה מִכֹּל הָעַמִּים אֲשֶׁר עַל־פְּנֵי הָאֲדָמָה׃
    hebrewPlain: כי עם קדוש אתה ליהוה אלהיך בך בחר יהוה אלהיך להיות לו לעם סגלה מכל העמים אשר על פני האדמה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:6
    kjvOsis:
    - Deut.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.7
    scripture: tanakh
    name: Tanakh Deuteronomy 7:7
    ref: Deuteronomy 7:7
    book: Deut
    section: torah
    chapter: 7
    verse: 7
    ordinal: 5113
    text: The LORD did not set His love upon you, nor choose you, because ye were more in number than any people—for ye were the fewest of all peoples—
    translation: JPS 1917
    original: לֹא מֵרֻבְּכֶם מִכָּל־הָעַמִּים חָשַׁק יְהוָה בָּכֶם וַיִּבְחַר בָּכֶם כִּי־אַתֶּם הַמְעַט מִכָּל־הָעַמִּים׃
    hebrewPlain: לא מרבכם מכל העמים חשק יהוה בכם ויבחר בכם כי אתם המעט מכל העמים
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:7
    kjvOsis:
    - Deut.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.8
    scripture: tanakh
    name: Tanakh Deuteronomy 7:8
    ref: Deuteronomy 7:8
    book: Deut
    section: torah
    chapter: 7
    verse: 8
    ordinal: 5114
    text: but because the LORD loved you, and because He would keep the oath which He swore unto your fathers, hath the LORD brought you out with a mighty hand, and redeemed you out of the house of bondage, from the hand of Pharaoh king of Egypt.
    translation: JPS 1917
    original: כִּי מֵאַהֲבַת יְהוָה אֶתְכֶם וּמִשָּׁמְרוּ אֶת־הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם הוֹצִיא יְהוָה אֶתְכֶם בְּיָד חֲזָקָה וַיִּפְדְּךָ מִבֵּית עֲבָדִים מִיַּד פַּרְעֹה מֶלֶךְ־מִצְרָיִם׃
    hebrewPlain: כי מאהבת יהוה אתכם ומשמרו את השבעה אשר נשבע לאבתיכם הוציא יהוה אתכם ביד חזקה ויפדך מבית עבדים מיד פרעה מלך מצרים
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:8
    kjvOsis:
    - Deut.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.9
    scripture: tanakh
    name: Tanakh Deuteronomy 7:9
    ref: Deuteronomy 7:9
    book: Deut
    section: torah
    chapter: 7
    verse: 9
    ordinal: 5115
    text: Know therefore that the LORD thy God, He is God; the faithful God, who keepeth covenant and mercy with them that love Him and keep His commandments to a thousand generations;
    translation: JPS 1917
    original: וְיָדַעְתָּ כִּי־יְהוָה אֱלֹהֶיךָ הוּא הָאֱלֹהִים הָאֵל הַנֶּאֱמָן שֹׁמֵר הַבְּרִית וְהַחֶסֶד לְאֹהֲבָיו וּלְשֹׁמְרֵי מצותו [מִצְוֺתָיו] לְאֶלֶף דּוֹר׃
    hebrewPlain: וידעת כי יהוה אלהיך הוא האלהים האל הנאמן שמר הברית והחסד לאהביו ולשמרי מצותו [מצותיו] לאלף דור
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:9
    kjvOsis:
    - Deut.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.10
    scripture: tanakh
    name: Tanakh Deuteronomy 7:10
    ref: Deuteronomy 7:10
    book: Deut
    section: torah
    chapter: 7
    verse: 10
    ordinal: 5116
    text: and repayeth them that hate Him to their face, to destroy them; He will not be slack to him that hateth Him, He will repay him to his face.
    translation: JPS 1917
    original: וּמְשַׁלֵּם לְשֹׂנְאָיו אֶל־פָּנָיו לְהַאֲבִידוֹ לֹא יְאַחֵר לְשֹׂנְאוֹ אֶל־פָּנָיו יְשַׁלֶּם־לוֹ׃
    hebrewPlain: ומשלם לשנאיו אל פניו להאבידו לא יאחר לשנאו אל פניו ישלם לו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:10
    kjvOsis:
    - Deut.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.11
    scripture: tanakh
    name: Tanakh Deuteronomy 7:11
    ref: Deuteronomy 7:11
    book: Deut
    section: torah
    chapter: 7
    verse: 11
    ordinal: 5117
    text: Thou shalt therefore keep the commandment, and the statutes, and the ordinances, which I command thee this day, to do them.
    translation: JPS 1917
    original: וְשָׁמַרְתָּ אֶת־הַמִּצְוָה וְאֶת־הַחֻקִּים וְאֶת־הַמִּשְׁפָּטִים אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לַעֲשׂוֹתָם׃
    hebrewPlain: ושמרת את המצוה ואת החקים ואת המשפטים אשר אנכי מצוך היום לעשותם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 7:11
    kjvOsis:
    - Deut.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.7.12
    scripture: tanakh
    name: Tanakh Deuteronomy 7:12
    ref: Deuteronomy 7:12
    book: Deut
    section: torah
    chapter: 7
    verse: 12
    ordinal: 5118
    text: And it shall come to pass, because ye hearken to these ordinances, and keep, and do them, that the LORD thy God shall keep with thee the covenant and the mercy which He swore unto thy fathers,
    translation: JPS 1917
    original: וְהָיָה עֵקֶב תִּשְׁמְעוּן אֵת הַמִּשְׁפָּטִים הָאֵלֶּה וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם וְשָׁמַר יְהוָה אֱלֹהֶיךָ לְךָ אֶת־הַבְּרִית וְאֶת־הַחֶסֶד אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ׃
    hebrewPlain: והיה עקב תשמעון את המשפטים האלה ושמרתם ועשיתם אתם ושמר יהוה אלהיך לך את הברית ואת החסד אשר נשבע לאבתיך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:12
    kjvOsis:
    - Deut.7.12
