- type: TanakhVerse
  data:
    osis: Deut.6.24
    scripture: tanakh
    name: Tanakh Deuteronomy 6:24
    ref: Deuteronomy 6:24
    book: Deut
    section: torah
    chapter: 6
    verse: 24
    ordinal: 5105
    text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, that He might preserve us alive, as it is at this day.
    translation: JPS 1917
    original: וַיְצַוֵּנוּ יְהוָה לַעֲשׂוֹת אֶת־כָּל־הַחֻקִּים הָאֵלֶּה לְיִרְאָה אֶת־יְהוָה אֱלֹהֵינוּ לְטוֹב לָנוּ כָּל־הַיָּמִים לְחַיֹּתֵנוּ כְּהַיּוֹם הַזֶּה׃
    hebrewPlain: ויצונו יהוה לעשות את כל החקים האלה ליראה את יהוה אלהינו לטוב לנו כל הימים לחיתנו כהיום הזה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:24
    kjvOsis:
    - Deut.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
