  data:
    osis: Deut.30.5
    scripture: tanakh
    name: Tanakh Deuteronomy 30:5
    ref: Deuteronomy 30:5
    book: Deut
    section: torah
    chapter: 30
    verse: 5
    ordinal: 5708
    text: And the LORD thy God will bring thee into the land which thy fathers possessed, and thou shalt possess it; and He will do thee good, and multiply thee above thy fathers. .
    translation: JPS 1917
    original: וֶהֱבִיאֲךָ יְהוָה אֱלֹהֶיךָ אֶל־הָאָרֶץ אֲשֶׁר־יָרְשׁוּ אֲבֹתֶיךָ וִירִשְׁתָּהּ וְהֵיטִבְךָ וְהִרְבְּךָ מֵאֲבֹתֶיךָ׃
    hebrewPlain: והביאך יהוה אלהיך אל הארץ אשר ירשו אבתיך וירשתה והיטבך והרבך מאבתיך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:5
    kjvOsis:
    - Deut.30.5
