    section: torah
    chapter: 19
    verse: 9
    ordinal: 5410
    text: if thou shalt keep all this commandment to do it, which I command thee this day, to love the LORD thy God, and to walk ever in His ways—then shalt thou add three cities more for thee, beside these three;
    translation: JPS 1917
    original: כִּי־תִשְׁמֹר אֶת־כָּל־הַמִּצְוָה הַזֹּאת לַעֲשֹׂתָהּ אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ וְלָלֶכֶת בִּדְרָכָיו כָּל־הַיָּמִים וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים עַל הַשָּׁלֹשׁ הָאֵלֶּה׃
    hebrewPlain: כי תשמר את כל המצוה הזאת לעשתה אשר אנכי מצוך היום לאהבה את יהוה אלהיך וללכת בדרכיו כל הימים ויספת לך עוד שלש ערים על השלש האלה
    parashah: Shoftim
    kjvRefs:
