  data:
    osis: Deut.9.21
    scripture: tanakh
    name: Tanakh Deuteronomy 9:21
    ref: Deuteronomy 9:21
    book: Deut
    section: torah
    chapter: 9
    verse: 21
    ordinal: 5173
    text: And I took your sin, the calf which ye had made, and burnt it with fire, and beat it in pieces, grinding it very small, until it was as fine as dust; and I cast the dust thereof into the brook that descended out of the mount.—
    translation: JPS 1917
    original: וְאֶת־חַטַּאתְכֶם אֲשֶׁר־עֲשִׂיתֶם אֶת־הָעֵגֶל לָקַחְתִּי וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב עַד אֲשֶׁר־דַּק לְעָפָר וָאַשְׁלִךְ אֶת־עֲפָרוֹ אֶל־הַנַּחַל הַיֹּרֵד מִן־הָהָר׃
    hebrewPlain: ואת חטאתכם אשר עשיתם את העגל לקחתי ואשרף אתו באש ואכת אתו טחון היטב עד אשר דק לעפר ואשלך את עפרו אל הנחל הירד מן ההר
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:21
    kjvOsis:
    - Deut.9.21
