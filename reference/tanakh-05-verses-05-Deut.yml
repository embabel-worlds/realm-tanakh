  data:
    osis: Deut.19.17
    scripture: tanakh
    name: Tanakh Deuteronomy 19:17
    ref: Deuteronomy 19:17
    book: Deut
    section: torah
    chapter: 19
    verse: 17
    ordinal: 5418
    text: then both the men, between whom the controversy is, shall stand before the LORD, before the priests and the judges that shall be in those days.
    translation: JPS 1917
    original: וְעָמְדוּ שְׁנֵי־הָאֲנָשִׁים אֲשֶׁר־לָהֶם הָרִיב לִפְנֵי יְהוָה לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם׃
    hebrewPlain: ועמדו שני האנשים אשר להם הריב לפני יהוה לפני הכהנים והשפטים אשר יהיו בימים ההם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:17
    kjvOsis:
