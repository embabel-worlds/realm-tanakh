    ordinal: 5755
    text: My doctrine shall drop as the rain, My speech shall distil as the dew; As the small rain upon the tender grass, And as the showers upon the herb.
    translation: JPS 1917
    original: יַעֲרֹף כַּמָּטָר לִקְחִי תִּזַּל כַּטַּל אִמְרָתִי כִּשְׂעִירִם עֲלֵי־דֶשֶׁא וְכִרְבִיבִים עֲלֵי־עֵשֶׂב׃
    hebrewPlain: יערף כמטר לקחי תזל כטל אמרתי כשעירם עלי דשא וכרביבים עלי עשב
