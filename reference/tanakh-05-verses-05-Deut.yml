  data:
    osis: Deut.23.18
    scripture: tanakh
    name: Tanakh Deuteronomy 23:18
    ref: Deuteronomy 23:18
    book: Deut
    section: torah
    chapter: 23
    verse: 18
    ordinal: 5512
    text: There shall be no harlot of the daughters of Israel, neither shall there be a sodomite of the sons of Israel.
    translation: JPS 1917
    original: לֹא־תִהְיֶה קְדֵשָׁה מִבְּנוֹת יִשְׂרָאֵל וְלֹא־יִהְיֶה קָדֵשׁ מִבְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: לא תהיה קדשה מבנות ישראל ולא יהיה קדש מבני ישראל
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:17
    kjvOsis:
    - Deut.23.17
