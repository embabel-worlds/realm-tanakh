    translation: JPS 1917
    original: לֹא תוּכַל לִזְבֹּחַ אֶת־הַפָּסַח בְּאַחַד שְׁעָרֶיךָ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ׃
    hebrewPlain: לא תוכל לזבח את הפסח באחד שעריך אשר יהוה אלהיך נתן לך
