    verse: 14
    ordinal: 5373
    text: 'When thou art come unto the land which the LORD thy God giveth thee, and shalt possess it, and shalt dwell therein; and shalt say: ‘I will set a king over me, like all the nations that are round about me’;'
    translation: JPS 1917
    original: כִּי־תָבֹא אֶל־הָאָרֶץ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ וִירִשְׁתָּהּ וְיָשַׁבְתָּה בָּהּ וְאָמַרְתָּ אָשִׂימָה עָלַי מֶלֶךְ כְּכָל־הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי׃
    hebrewPlain: כי תבא אל הארץ אשר יהוה אלהיך נתן לך וירשתה וישבתה בה ואמרת אשימה עלי מלך ככל הגוים אשר סביבתי
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:14
    kjvOsis:
    - Deut.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.15
    scripture: tanakh
    name: Tanakh Deuteronomy 17:15
    ref: Deuteronomy 17:15
    book: Deut
    section: torah
    chapter: 17
    verse: 15
    ordinal: 5374
    text: thou shalt in any wise set him king over thee, whom the LORD thy God shall choose; one from among thy brethren shalt thou set king over thee; thou mayest not put a foreigner over thee, who is not thy brother.
    translation: JPS 1917
    original: שׂוֹם תָּשִׂים עָלֶיךָ מֶלֶךְ אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ מִקֶּרֶב אַחֶיךָ תָּשִׂים עָלֶיךָ מֶלֶךְ לֹא תוּכַל לָתֵת עָלֶיךָ אִישׁ נָכְרִי אֲשֶׁר לֹא־אָחִיךָ הוּא׃
    hebrewPlain: שום תשים עליך מלך אשר יבחר יהוה אלהיך בו מקרב אחיך תשים עליך מלך לא תוכל לתת עליך איש נכרי אשר לא אחיך הוא
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:15
    kjvOsis:
    - Deut.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.16
    scripture: tanakh
    name: Tanakh Deuteronomy 17:16
    ref: Deuteronomy 17:16
    book: Deut
    section: torah
    chapter: 17
    verse: 16
    ordinal: 5375
    text: 'Only he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses; forasmuch as the LORD hath said unto you: ‘Ye shall henceforth return no more that way.’'
    translation: JPS 1917
    original: רַק לֹא־יַרְבֶּה־לּוֹ סוּסִים וְלֹא־יָשִׁיב אֶת־הָעָם מִצְרַיְמָה לְמַעַן הַרְבּוֹת סוּס וַיהוָה אָמַר לָכֶם לֹא תֹסִפוּן לָשׁוּב בַּדֶּרֶךְ הַזֶּה עוֹד׃
    hebrewPlain: רק לא ירבה לו סוסים ולא ישיב את העם מצרימה למען הרבות סוס ויהוה אמר לכם לא תספון לשוב בדרך הזה עוד
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:16
    kjvOsis:
    - Deut.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.17
    scripture: tanakh
    name: Tanakh Deuteronomy 17:17
    ref: Deuteronomy 17:17
    book: Deut
    section: torah
    chapter: 17
    verse: 17
    ordinal: 5376
    text: Neither shall he multiply wives to himself, that his heart turn not away; neither shall he greatly multiply to himself silver and gold.
    translation: JPS 1917
    original: וְלֹא יַרְבֶּה־לּוֹ נָשִׁים וְלֹא יָסוּר לְבָבוֹ וְכֶסֶף וְזָהָב לֹא יַרְבֶּה־לּוֹ מְאֹד׃
    hebrewPlain: ולא ירבה לו נשים ולא יסור לבבו וכסף וזהב לא ירבה לו מאד
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:17
    kjvOsis:
    - Deut.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.18
    scripture: tanakh
    name: Tanakh Deuteronomy 17:18
    ref: Deuteronomy 17:18
    book: Deut
    section: torah
    chapter: 17
    verse: 18
    ordinal: 5377
    text: And it shall be, when he sitteth upon the throne of his kingdom, that he shall write him a copy of this law in a book, out of that which is before the priests the Levites.
    translation: JPS 1917
    original: וְהָיָה כְשִׁבְתּוֹ עַל כִּסֵּא מַמְלַכְתּוֹ וְכָתַב לוֹ אֶת־מִשְׁנֵה הַתּוֹרָה הַזֹּאת עַל־סֵפֶר מִלִּפְנֵי הַכֹּהֲנִים הַלְוִיִּם׃
    hebrewPlain: והיה כשבתו על כסא ממלכתו וכתב לו את משנה התורה הזאת על ספר מלפני הכהנים הלוים
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:18
    kjvOsis:
    - Deut.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.19
    scripture: tanakh
    name: Tanakh Deuteronomy 17:19
    ref: Deuteronomy 17:19
    book: Deut
    section: torah
    chapter: 17
    verse: 19
    ordinal: 5378
    text: And it shall be with him, and he shall read therein all the days of his life; that he may learn to fear the LORD his God, to keep all the words of this law and these statutes, to do them;
    translation: JPS 1917
    original: וְהָיְתָה עִמּוֹ וְקָרָא בוֹ כָּל־יְמֵי חַיָּיו לְמַעַן יִלְמַד לְיִרְאָה אֶת־יְהוָה אֱלֹהָיו לִשְׁמֹר אֶת־כָּל־דִּבְרֵי הַתּוֹרָה הַזֹּאת וְאֶת־הַחֻקִּים הָאֵלֶּה לַעֲשֹׂתָם׃
    hebrewPlain: והיתה עמו וקרא בו כל ימי חייו למען ילמד ליראה את יהוה אלהיו לשמר את כל דברי התורה הזאת ואת החקים האלה לעשתם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:19
    kjvOsis:
    - Deut.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.20
    scripture: tanakh
    name: Tanakh Deuteronomy 17:20
    ref: Deuteronomy 17:20
    book: Deut
    section: torah
    chapter: 17
    verse: 20
    ordinal: 5379
    text: that his heart be not lifted up above his brethren, and that he turn not aside from the commandment, to the right hand, or to the left; to the end that he may prolong his days in his kingdom, he and his children, in the midst of Israel.
    translation: JPS 1917
    original: לְבִלְתִּי רוּם־לְבָבוֹ מֵאֶחָיו וּלְבִלְתִּי סוּר מִן־הַמִּצְוָה יָמִין וּשְׂמֹאול לְמַעַן יַאֲרִיךְ יָמִים עַל־מַמְלַכְתּוֹ הוּא וּבָנָיו בְּקֶרֶב יִשְׂרָאֵל׃
    hebrewPlain: לבלתי רום לבבו מאחיו ולבלתי סור מן המצוה ימין ושמאול למען יאריך ימים על ממלכתו הוא ובניו בקרב ישראל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:20
    kjvOsis:
    - Deut.17.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.1
    scripture: tanakh
    name: Tanakh Deuteronomy 18:1
    ref: Deuteronomy 18:1
    book: Deut
    section: torah
    chapter: 18
    verse: 1
    ordinal: 5380
    text: The priests the Levites, even all the tribe of Levi, shall have no portion nor inheritance with Israel; they shall eat the offerings of the LORD made by fire, and His inheritance.
    translation: JPS 1917
    original: לֹא־יִהְיֶה לַכֹּהֲנִים הַלְוִיִּם כָּל־שֵׁבֶט לֵוִי חֵלֶק וְנַחֲלָה עִם־יִשְׂרָאֵל אִשֵּׁי יְהוָה וְנַחֲלָתוֹ יֹאכֵלוּן׃
    hebrewPlain: לא יהיה לכהנים הלוים כל שבט לוי חלק ונחלה עם ישראל אשי יהוה ונחלתו יאכלון
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:1
    kjvOsis:
    - Deut.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.2
    scripture: tanakh
    name: Tanakh Deuteronomy 18:2
    ref: Deuteronomy 18:2
    book: Deut
    section: torah
    chapter: 18
    verse: 2
    ordinal: 5381
    text: And they shall have no inheritance among their brethren; the LORD is their inheritance, as He hath spoken unto them.
    translation: JPS 1917
    original: וְנַחֲלָה לֹא־יִהְיֶה־לּוֹ בְּקֶרֶב אֶחָיו יְהוָה הוּא נַחֲלָתוֹ כַּאֲשֶׁר דִּבֶּר־לוֹ׃
    hebrewPlain: ונחלה לא יהיה לו בקרב אחיו יהוה הוא נחלתו כאשר דבר לו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:2
    kjvOsis:
    - Deut.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.3
    scripture: tanakh
    name: Tanakh Deuteronomy 18:3
    ref: Deuteronomy 18:3
    book: Deut
    section: torah
    chapter: 18
    verse: 3
    ordinal: 5382
    text: And this shall be the priests’ due from the people, from them that offer a sacrifice, whether it be ox or sheep, that they shall give unto the priest the shoulder, and the two cheeks, and the maw.
    translation: JPS 1917
    original: וְזֶה יִהְיֶה מִשְׁפַּט הַכֹּהֲנִים מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח אִם־שׁוֹר אִם־שֶׂה וְנָתַן לַכֹּהֵן הַזְּרֹעַ וְהַלְּחָיַיִם וְהַקֵּבָה׃
    hebrewPlain: וזה יהיה משפט הכהנים מאת העם מאת זבחי הזבח אם שור אם שה ונתן לכהן הזרע והלחיים והקבה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:3
    kjvOsis:
    - Deut.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.4
    scripture: tanakh
    name: Tanakh Deuteronomy 18:4
    ref: Deuteronomy 18:4
    book: Deut
    section: torah
    chapter: 18
    verse: 4
    ordinal: 5383
    text: The first-fruits of thy corn, of thy wine, and of thine oil, and the first of the fleece of thy sheep, shalt thou give him.
    translation: JPS 1917
    original: רֵאשִׁית דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ וְרֵאשִׁית גֵּז צֹאנְךָ תִּתֶּן־לּוֹ׃
    hebrewPlain: ראשית דגנך תירשך ויצהרך וראשית גז צאנך תתן לו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:4
    kjvOsis:
    - Deut.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.5
    scripture: tanakh
    name: Tanakh Deuteronomy 18:5
    ref: Deuteronomy 18:5
    book: Deut
    section: torah
    chapter: 18
    verse: 5
    ordinal: 5384
    text: For the LORD thy God hath chosen him out of all thy tribes, to stand to minister in the name of the LORD, him and his sons for ever.
    translation: JPS 1917
    original: כִּי בוֹ בָּחַר יְהוָה אֱלֹהֶיךָ מִכָּל־שְׁבָטֶיךָ לַעֲמֹד לְשָׁרֵת בְּשֵׁם־יְהוָה הוּא וּבָנָיו כָּל־הַיָּמִים׃
    hebrewPlain: כי בו בחר יהוה אלהיך מכל שבטיך לעמד לשרת בשם יהוה הוא ובניו כל הימים
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:5
    kjvOsis:
    - Deut.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.6
    scripture: tanakh
    name: Tanakh Deuteronomy 18:6
    ref: Deuteronomy 18:6
    book: Deut
    section: torah
    chapter: 18
    verse: 6
    ordinal: 5385
    text: And if a Levite come from any of thy gates out of all Israel, where he sojourneth, and come with all the desire of his soul unto the place which the LORD shall choose;
    translation: JPS 1917
    original: וְכִי־יָבֹא הַלֵּוִי מֵאַחַד שְׁעָרֶיךָ מִכָּל־יִשְׂרָאֵל אֲשֶׁר־הוּא גָּר שָׁם וּבָא בְּכָל־אַוַּת נַפְשׁוֹ אֶל־הַמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה׃
    hebrewPlain: וכי יבא הלוי מאחד שעריך מכל ישראל אשר הוא גר שם ובא בכל אות נפשו אל המקום אשר יבחר יהוה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:6
    kjvOsis:
    - Deut.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.7
    scripture: tanakh
    name: Tanakh Deuteronomy 18:7
    ref: Deuteronomy 18:7
    book: Deut
    section: torah
    chapter: 18
    verse: 7
    ordinal: 5386
    text: then he shall minister in the name of the LORD his God, as all his brethren the Levites do, who stand there before the LORD.
    translation: JPS 1917
    original: וְשֵׁרֵת בְּשֵׁם יְהוָה אֱלֹהָיו כְּכָל־אֶחָיו הַלְוִיִּם הָעֹמְדִים שָׁם לִפְנֵי יְהוָה׃
    hebrewPlain: ושרת בשם יהוה אלהיו ככל אחיו הלוים העמדים שם לפני יהוה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:7
    kjvOsis:
    - Deut.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.8
    scripture: tanakh
    name: Tanakh Deuteronomy 18:8
    ref: Deuteronomy 18:8
    book: Deut
    section: torah
    chapter: 18
    verse: 8
    ordinal: 5387
    text: They shall have like portions to eat, beside that which is his due according to the fathers’ houses. .
    translation: JPS 1917
    original: חֵלֶק כְּחֵלֶק יֹאכֵלוּ לְבַד מִמְכָּרָיו עַל־הָאָבוֹת׃
    hebrewPlain: חלק כחלק יאכלו לבד ממכריו על האבות
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:8
    kjvOsis:
    - Deut.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.9
    scripture: tanakh
    name: Tanakh Deuteronomy 18:9
    ref: Deuteronomy 18:9
    book: Deut
    section: torah
    chapter: 18
    verse: 9
    ordinal: 5388
    text: When thou art come into the land which the LORD thy God giveth thee, thou shalt not learn to do after the abominations of those nations.
    translation: JPS 1917
    original: כִּי אַתָּה בָּא אֶל־הָאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ לֹא־תִלְמַד לַעֲשׂוֹת כְּתוֹעֲבֹת הַגּוֹיִם הָהֵם׃
    hebrewPlain: כי אתה בא אל הארץ אשר יהוה אלהיך נתן לך לא תלמד לעשות כתועבת הגוים ההם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:9
    kjvOsis:
    - Deut.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.18.10
    scripture: tanakh
    name: Tanakh Deuteronomy 18:10
    ref: Deuteronomy 18:10
    book: Deut
    section: torah
    chapter: 18
    verse: 10
    ordinal: 5389
    text: There shall not be found among you any one that maketh his son or his daughter to pass through the fire, one that useth divination, a soothsayer, or an enchanter, or a sorcerer,
    translation: JPS 1917
