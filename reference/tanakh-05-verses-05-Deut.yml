  data:
    osis: Deut.22.21
    scripture: tanakh
    name: Tanakh Deuteronomy 22:21
    ref: Deuteronomy 22:21
    book: Deut
    section: torah
    chapter: 22
    verse: 21
    ordinal: 5486
    text: then they shall bring out the damsel to the door of her father’s house, and the men of her city shall stone her with stones that she die; because she hath wrought a wanton deed in Israel, to play the harlot in her father’s house; so shalt thou put away the evil from the midst of thee.
    translation: JPS 1917
    original: וְהוֹצִיאוּ אֶת־הנער [הַנַּעֲרָה] אֶל־פֶּתַח בֵּית־אָבִיהָ וּסְקָלוּהָ אַנְשֵׁי עִירָהּ בָּאֲבָנִים וָמֵתָה כִּי־עָשְׂתָה נְבָלָה בְּיִשְׂרָאֵל לִזְנוֹת בֵּית אָבִיהָ וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: והוציאו את הנער [הנערה] אל פתח בית אביה וסקלוה אנשי עירה באבנים ומתה כי עשתה נבלה בישראל לזנות בית אביה ובערת הרע מקרבך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:21
    kjvOsis:
    - Deut.22.21
  relations:
