    ref: Deuteronomy 4:20
    book: Deut
    section: torah
    chapter: 4
    verse: 20
    ordinal: 5022
    text: But you hath the LORD taken and brought forth out of the iron furnace, out of Egypt, to be unto Him a people of inheritance, as ye are this day.
    translation: JPS 1917
    original: וְאֶתְכֶם לָקַח יְהוָה וַיּוֹצִא אֶתְכֶם מִכּוּר הַבַּרְזֶל מִמִּצְרָיִם לִהְיוֹת לוֹ לְעַם נַחֲלָה כַּיּוֹם הַזֶּה׃
    hebrewPlain: ואתכם לקח יהוה ויוצא אתכם מכור הברזל ממצרים להיות לו לעם נחלה כיום הזה
    parashah: Vaetchanan
    kjvRefs:
