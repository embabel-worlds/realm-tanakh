  data:
    osis: Deut.21.20
    scripture: tanakh
    name: Tanakh Deuteronomy 21:20
    ref: Deuteronomy 21:20
    book: Deut
    section: torah
    chapter: 21
    verse: 20
    ordinal: 5462
    text: 'and they shall say unto the elders of his city: ‘This our son is stubborn and rebellious, he doth not hearken to our voice; he is a glutton, and a drunkard.’'
    translation: JPS 1917
    original: וְאָמְרוּ אֶל־זִקְנֵי עִירוֹ בְּנֵנוּ זֶה סוֹרֵר וּמֹרֶה אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ זוֹלֵל וְסֹבֵא׃
    hebrewPlain: ואמרו אל זקני עירו בננו זה סורר ומרה איננו שמע בקלנו זולל וסבא
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:20
    kjvOsis:
