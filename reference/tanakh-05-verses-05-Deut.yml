      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.23
    scripture: tanakh
    name: Tanakh Deuteronomy 7:23
    ref: Deuteronomy 7:23
    book: Deut
    section: torah
    chapter: 7
    verse: 23
    ordinal: 5129
    text: But the LORD thy God shall deliver them up before thee, and shall discomfit them with a great discomfiture, until they be destroyed.
    translation: JPS 1917
    original: וּנְתָנָם יְהוָה אֱלֹהֶיךָ לְפָנֶיךָ וְהָמָם מְהוּמָה גְדֹלָה עַד הִשָּׁמְדָם׃
    hebrewPlain: ונתנם יהוה אלהיך לפניך והמם מהומה גדלה עד השמדם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:23
    kjvOsis:
    - Deut.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.24
    scripture: tanakh
    name: Tanakh Deuteronomy 7:24
    ref: Deuteronomy 7:24
    book: Deut
    section: torah
    chapter: 7
    verse: 24
    ordinal: 5130
    text: And He shall deliver their kings into thy hand, and thou shalt make their name to perish from under heaven; there shall no man be able to stand against thee, until thou have destroyed them.
    translation: JPS 1917
    original: וְנָתַן מַלְכֵיהֶם בְּיָדֶךָ וְהַאֲבַדְתָּ אֶת־שְׁמָם מִתַּחַת הַשָּׁמָיִם לֹא־יִתְיַצֵּב אִישׁ בְּפָנֶיךָ עַד הִשְׁמִדְךָ אֹתָם׃
    hebrewPlain: ונתן מלכיהם בידך והאבדת את שמם מתחת השמים לא יתיצב איש בפניך עד השמדך אתם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:24
    kjvOsis:
    - Deut.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.25
    scripture: tanakh
    name: Tanakh Deuteronomy 7:25
    ref: Deuteronomy 7:25
    book: Deut
    section: torah
    chapter: 7
    verse: 25
    ordinal: 5131
    text: The graven images of their gods shall ye burn with fire; thou shalt not covet the silver or the gold that is on them, nor take it unto thee, lest thou be snared therein; for it is an abomination to the LORD thy God.
    translation: JPS 1917
    original: פְּסִילֵי אֱלֹהֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ לֹא־תַחְמֹד כֶּסֶף וְזָהָב עֲלֵיהֶם וְלָקַחְתָּ לָךְ פֶּן תִּוָּקֵשׁ בּוֹ כִּי תוֹעֲבַת יְהוָה אֱלֹהֶיךָ הוּא׃
    hebrewPlain: פסילי אלהיהם תשרפון באש לא תחמד כסף וזהב עליהם ולקחת לך פן תוקש בו כי תועבת יהוה אלהיך הוא
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:25
    kjvOsis:
    - Deut.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.26
    scripture: tanakh
    name: Tanakh Deuteronomy 7:26
    ref: Deuteronomy 7:26
    book: Deut
    section: torah
    chapter: 7
    verse: 26
    ordinal: 5132
    text: And thou shalt not bring an abomination into thy house, and be accursed like unto it; thou shalt utterly detest it, and thou shalt utterly abhor it; for it is a devoted thing.
    translation: JPS 1917
    original: וְלֹא־תָבִיא תוֹעֵבָה אֶל־בֵּיתֶךָ וְהָיִיתָ חֵרֶם כָּמֹהוּ שַׁקֵּץ תְּשַׁקְּצֶנּוּ וְתַעֵב תְּתַעֲבֶנּוּ כִּי־חֵרֶם הוּא׃
    hebrewPlain: ולא תביא תועבה אל ביתך והיית חרם כמהו שקץ תשקצנו ותעב תתעבנו כי חרם הוא
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:26
    kjvOsis:
    - Deut.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.8.1
    scripture: tanakh
    name: Tanakh Deuteronomy 8:1
    ref: Deuteronomy 8:1
    book: Deut
    section: torah
    chapter: 8
    verse: 1
    ordinal: 5133
    text: All the commandment which I command thee this day shall ye observe to do, that ye may live, and multiply, and go in and possess the land which the LORD swore unto your fathers.
    translation: JPS 1917
    original: כָּל־הַמִּצְוָה אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם תִּשְׁמְרוּן לַעֲשׂוֹת לְמַעַן תִּחְיוּן וּרְבִיתֶם וּבָאתֶם וִירִשְׁתֶּם אֶת־הָאָרֶץ אֲשֶׁר־נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם׃
    hebrewPlain: כל המצוה אשר אנכי מצוך היום תשמרון לעשות למען תחיון ורביתם ובאתם וירשתם את הארץ אשר נשבע יהוה לאבתיכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 8:1
