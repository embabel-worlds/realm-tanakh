    scripture: tanakh
    name: Tanakh Deuteronomy 22:6
    ref: Deuteronomy 22:6
    book: Deut
    section: torah
    chapter: 22
    verse: 6
    ordinal: 5471
    text: If a bird’s nest chance to be before thee in the way, in any tree or on the ground, with young ones or eggs, and the dam sitting upon the young, or upon the eggs, thou shalt not take the dam with the young;
    translation: JPS 1917
    original: כִּי יִקָּרֵא קַן־צִפּוֹר לְפָנֶיךָ בַּדֶּרֶךְ בְּכָל־עֵץ אוֹ עַל־הָאָרֶץ אֶפְרֹחִים אוֹ בֵיצִים וְהָאֵם רֹבֶצֶת עַל־הָאֶפְרֹחִים אוֹ עַל־הַבֵּיצִים לֹא־תִקַּח הָאֵם עַל־הַבָּנִים׃
    hebrewPlain: כי יקרא קן צפור לפניך בדרך בכל עץ או על הארץ אפרחים או ביצים והאם רבצת על האפרחים או על הביצים לא תקח האם על הבנים
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:6
    kjvOsis:
    - Deut.22.6
  relations:
