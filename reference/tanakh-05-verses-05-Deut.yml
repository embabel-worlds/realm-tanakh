    book: Deut
    section: torah
    chapter: 23
    verse: 13
    ordinal: 5507
    text: Thou shalt have a place also without the camp, whither thou shalt go forth abroad.
    translation: JPS 1917
    original: וְיָד תִּהְיֶה לְךָ מִחוּץ לַמַּחֲנֶה וְיָצָאתָ שָׁמָּה חוּץ׃
