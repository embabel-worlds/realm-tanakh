  data:
    osis: Deut.31.13
    scripture: tanakh
    name: Tanakh Deuteronomy 31:13
    ref: Deuteronomy 31:13
    book: Deut
    section: torah
    chapter: 31
    verse: 13
    ordinal: 5736
    text: and that their children, who have not known, may hear, and learn to fear the LORD your God, as long as ye live in the land whither ye go over the Jordan to possess it.’
    translation: JPS 1917
    original: וּבְנֵיהֶם אֲשֶׁר לֹא־יָדְעוּ יִשְׁמְעוּ וְלָמְדוּ לְיִרְאָה אֶת־יְהוָה אֱלֹהֵיכֶם כָּל־הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים עַל־הָאֲדָמָה אֲשֶׁר אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: ובניהם אשר לא ידעו ישמעו ולמדו ליראה את יהוה אלהיכם כל הימים אשר אתם חיים על האדמה אשר אתם עברים את הירדן שמה לרשתה
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:13
    kjvOsis:
    - Deut.31.13
