    translation: JPS 1917
    original: רַק אֶל־אֶרֶץ בְּנֵי־עַמּוֹן לֹא קָרָבְתָּ כָּל־יַד נַחַל יַבֹּק וְעָרֵי הָהָר וְכֹל אֲשֶׁר־צִוָּה יְהוָה אֱלֹהֵינוּ׃
    hebrewPlain: רק אל ארץ בני עמון לא קרבת כל יד נחל יבק וערי ההר וכל אשר צוה יהוה אלהינו
