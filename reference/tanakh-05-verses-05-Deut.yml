    scripture: tanakh
    name: Tanakh Deuteronomy 24:18
    ref: Deuteronomy 24:18
    book: Deut
    section: torah
    chapter: 24
    verse: 18
    ordinal: 5538
    text: But thou shalt remember that thou wast a bondman in Egypt, and the LORD thy God redeemed thee thence; therefore I command thee to do this thing.
    translation: JPS 1917
    original: וְזָכַרְתָּ כִּי עֶבֶד הָיִיתָ בְּמִצְרַיִם וַיִּפְדְּךָ יְהוָה אֱלֹהֶיךָ מִשָּׁם עַל־כֵּן אָנֹכִי מְצַוְּךָ לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה׃
    hebrewPlain: וזכרת כי עבד היית במצרים ויפדך יהוה אלהיך משם על כן אנכי מצוך לעשות את הדבר הזה
