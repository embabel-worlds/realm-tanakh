  data:
    osis: Deut.30.2
    scripture: tanakh
    name: Tanakh Deuteronomy 30:2
    ref: Deuteronomy 30:2
    book: Deut
    section: torah
    chapter: 30
    verse: 2
    ordinal: 5705
    text: and shalt return unto the LORD thy God, and hearken to His voice according to all that I command thee this day, thou and thy children, with all thy heart, and with all thy soul;
    translation: JPS 1917
    original: וְשַׁבְתָּ עַד־יְהוָה אֱלֹהֶיךָ וְשָׁמַעְתָּ בְקֹלוֹ כְּכֹל אֲשֶׁר־אָנֹכִי מְצַוְּךָ הַיּוֹם אַתָּה וּבָנֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשֶׁךָ׃
    hebrewPlain: ושבת עד יהוה אלהיך ושמעת בקלו ככל אשר אנכי מצוך היום אתה ובניך בכל לבבך ובכל נפשך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:2
    kjvOsis:
    - Deut.30.2
