    section: torah
    chapter: 11
    verse: 2
    ordinal: 5205
    text: And know ye this day; for I speak not with your children that have not known, and that have not seen the chastisement of the LORD your God, His greatness, His mighty hand, and His outstretched arm,
    translation: JPS 1917
    original: וִידַעְתֶּם הַיּוֹם כִּי לֹא אֶת־בְּנֵיכֶם אֲשֶׁר לֹא־יָדְעוּ וַאֲשֶׁר לֹא־רָאוּ אֶת־מוּסַר יְהוָה אֱלֹהֵיכֶם אֶת־גָּדְלוֹ אֶת־יָדוֹ הַחֲזָקָה וּזְרֹעוֹ הַנְּטוּיָה׃
    hebrewPlain: וידעתם היום כי לא את בניכם אשר לא ידעו ואשר לא ראו את מוסר יהוה אלהיכם את גדלו את ידו החזקה וזרעו הנטויה
    parashah: Eikev
