  data:
    osis: Deut.16.7
    scripture: tanakh
    name: Tanakh Deuteronomy 16:7
    ref: Deuteronomy 16:7
    book: Deut
    section: torah
    chapter: 16
    verse: 7
    ordinal: 5344
    text: And thou shalt roast and eat it in the place which the LORD thy God shall choose; and thou shalt turn in the morning, and go unto thy tents.
    translation: JPS 1917
    original: וּבִשַּׁלְתָּ וְאָכַלְתָּ בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ וּפָנִיתָ בַבֹּקֶר וְהָלַכְתָּ לְאֹהָלֶיךָ׃
    hebrewPlain: ובשלת ואכלת במקום אשר יבחר יהוה אלהיך בו ופנית בבקר והלכת לאהליך
    parashah: Re'eh
