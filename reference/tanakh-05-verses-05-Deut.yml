  data:
    osis: Deut.5.24
    scripture: tanakh
    name: Tanakh Deuteronomy 5:24
    ref: Deuteronomy 5:24
    book: Deut
    section: torah
    chapter: 5
    verse: 24
    ordinal: 5075
    text: Go thou near, and hear all that the LORD our God may say; and thou shalt speak unto us all that the LORD our God may speak unto thee; and we will hear it and do it.’
    translation: JPS 1917
    original: קְרַב אַתָּה וּשֲׁמָע אֵת כָּל־אֲשֶׁר יֹאמַר יְהוָה אֱלֹהֵינוּ וְאַתְּ תְּדַבֵּר אֵלֵינוּ אֵת כָּל־אֲשֶׁר יְדַבֵּר יְהוָה אֱלֹהֵינוּ אֵלֶיךָ וְשָׁמַעְנוּ וְעָשִׂינוּ׃
    hebrewPlain: קרב אתה ושמע את כל אשר יאמר יהוה אלהינו ואת תדבר אלינו את כל אשר ידבר יהוה אלהינו אליך ושמענו ועשינו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:27
    kjvOsis:
    - Deut.5.27
  relations:
