    original: כִּי־יִהְיֶה רִיב בֵּין אֲנָשִׁים וְנִגְּשׁוּ אֶל־הַמִּשְׁפָּט וּשְׁפָטוּם וְהִצְדִּיקוּ אֶת־הַצַּדִּיק וְהִרְשִׁיעוּ אֶת־הָרָשָׁע׃
