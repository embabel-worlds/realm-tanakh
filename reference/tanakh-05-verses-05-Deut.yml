  data:
    osis: Deut.16.15
    scripture: tanakh
    name: Tanakh Deuteronomy 16:15
    ref: Deuteronomy 16:15
    book: Deut
    section: torah
    chapter: 16
    verse: 15
    ordinal: 5352
    text: Seven days shalt thou keep a feast unto the LORD thy God in the place which the LORD shall choose; because the LORD thy God shall bless thee in all thine increase, and in all the work of thy hands, and thou shalt be altogether joyful.
    translation: JPS 1917
    original: שִׁבְעַת יָמִים תָּחֹג לַיהוָה אֱלֹהֶיךָ בַּמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ בְּכֹל תְּבוּאָתְךָ וּבְכֹל מַעֲשֵׂה יָדֶיךָ וְהָיִיתָ אַךְ שָׂמֵחַ׃
    hebrewPlain: שבעת ימים תחג ליהוה אלהיך במקום אשר יבחר יהוה כי יברכך יהוה אלהיך בכל תבואתך ובכל מעשה ידיך והיית אך שמח
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:15
    kjvOsis:
    - Deut.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.16
    scripture: tanakh
    name: Tanakh Deuteronomy 16:16
    ref: Deuteronomy 16:16
    book: Deut
    section: torah
    chapter: 16
    verse: 16
    ordinal: 5353
    text: Three times in a year shall all thy males appear before the LORD thy God in the place which He shall choose; on the feast of unleavened bread, and on the feast of weeks, and on the feast of tabernacles; and they shall not appear before the LORD empty;
    translation: JPS 1917
    original: שָׁלוֹשׁ פְּעָמִים בַּשָּׁנָה יֵרָאֶה כָל־זְכוּרְךָ אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ בַּמָּקוֹם אֲשֶׁר יִבְחָר בְּחַג הַמַּצּוֹת וּבְחַג הַשָּׁבֻעוֹת וּבְחַג הַסֻּכּוֹת וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם׃
    hebrewPlain: שלוש פעמים בשנה יראה כל זכורך את פני יהוה אלהיך במקום אשר יבחר בחג המצות ובחג השבעות ובחג הסכות ולא יראה את פני יהוה ריקם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:16
    kjvOsis:
    - Deut.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.17
    scripture: tanakh
    name: Tanakh Deuteronomy 16:17
    ref: Deuteronomy 16:17
    book: Deut
    section: torah
    chapter: 16
    verse: 17
    ordinal: 5354
    text: every man shall give as he is able, according to the blessing of the LORD thy God which He hath given thee.
    translation: JPS 1917
    original: אִישׁ כְּמַתְּנַת יָדוֹ כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן־לָךְ׃
    hebrewPlain: איש כמתנת ידו כברכת יהוה אלהיך אשר נתן לך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:17
    kjvOsis:
    - Deut.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
