    scripture: tanakh
    name: Tanakh Deuteronomy 2:19
    ref: Deuteronomy 2:19
    book: Deut
    section: torah
    chapter: 2
    verse: 19
    ordinal: 4955
    text: and when thou comest nigh over against the children of Ammon, harass them not, nor contend with them; for I will not give thee of the land of the children of Ammon for a possession; because I have given it unto the children of Lot for a possession.—
    translation: JPS 1917
    original: וְקָרַבְתָּ מוּל בְּנֵי עַמּוֹן אַל־תְּצֻרֵם וְאַל־תִּתְגָּר בָּם כִּי לֹא־אֶתֵּן מֵאֶרֶץ בְּנֵי־עַמּוֹן לְךָ יְרֻשָּׁה כִּי לִבְנֵי־לוֹט נְתַתִּיהָ יְרֻשָּׁה׃
    hebrewPlain: וקרבת מול בני עמון אל תצרם ואל תתגר בם כי לא אתן מארץ בני עמון לך ירשה כי לבני לוט נתתיה ירשה
    parashah: Devarim
    kjvRefs:
