- type: TanakhVerse
  data:
    osis: Deut.25.19
    scripture: tanakh
    name: Tanakh Deuteronomy 25:19
    ref: Deuteronomy 25:19
    book: Deut
    section: torah
    chapter: 25
    verse: 19
    ordinal: 5561
    text: Therefore it shall be, when the LORD thy God hath given thee rest from all thine enemies round about, in the land which the LORD thy God giveth thee for an inheritance to possess it, that thou shalt blot out the remembrance of Amalek from under heaven; thou shalt not forget.
    translation: JPS 1917
    original: וְהָיָה בְּהָנִיחַ יְהוָה אֱלֹהֶיךָ לְךָ מִכָּל־אֹיְבֶיךָ מִסָּבִיב בָּאָרֶץ אֲשֶׁר יְהוָה־אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה לְרִשְׁתָּהּ תִּמְחֶה אֶת־זֵכֶר עֲמָלֵק מִתַּחַת הַשָּׁמָיִם לֹא תִּשְׁכָּח׃
    hebrewPlain: והיה בהניח יהוה אלהיך לך מכל איביך מסביב בארץ אשר יהוה אלהיך נתן לך נחלה לרשתה תמחה את זכר עמלק מתחת השמים לא תשכח
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:19
    kjvOsis:
    - Deut.25.19
