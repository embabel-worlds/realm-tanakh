    scripture: tanakh
    name: Tanakh Deuteronomy 23:14
    ref: Deuteronomy 23:14
    book: Deut
    section: torah
    chapter: 23
    verse: 14
    ordinal: 5508
    text: And thou shalt have a paddle among thy weapons; and it shall be, when thou sittest down abroad, thou shalt dig therewith, and shalt turn back and cover that which cometh from thee.
    translation: JPS 1917
    original: וְיָתֵד תִּהְיֶה לְךָ עַל־אֲזֵנֶךָ וְהָיָה בְּשִׁבְתְּךָ חוּץ וְחָפַרְתָּה בָהּ וְשַׁבְתָּ וְכִסִּיתָ אֶת־צֵאָתֶךָ׃
    hebrewPlain: ויתד תהיה לך על אזנך והיה בשבתך חוץ וחפרתה בה ושבת וכסית את צאתך
    parashah: Ki Teitzei
