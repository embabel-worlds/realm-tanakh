    osis: Deut.23.9
    scripture: tanakh
    name: Tanakh Deuteronomy 23:9
    ref: Deuteronomy 23:9
    book: Deut
    section: torah
    chapter: 23
    verse: 9
    ordinal: 5503
    text: The children of the third generation that are born unto them may enter into the assembly of the LORD.
    translation: JPS 1917
    original: בָּנִים אֲשֶׁר־יִוָּלְדוּ לָהֶם דּוֹר שְׁלִישִׁי יָבֹא לָהֶם בִּקְהַל יְהוָה׃
    hebrewPlain: בנים אשר יולדו להם דור שלישי יבא להם בקהל יהוה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:8
