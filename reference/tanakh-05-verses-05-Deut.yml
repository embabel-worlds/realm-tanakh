    scripture: tanakh
    name: Tanakh Deuteronomy 24:10
    ref: Deuteronomy 24:10
    book: Deut
    section: torah
    chapter: 24
    verse: 10
    ordinal: 5530
    text: When thou dost lend thy neighbour any manner of loan, thou shalt not go into his house to fetch his pledge.
    translation: JPS 1917
    original: כִּי־תַשֶּׁה בְרֵעֲךָ מַשַּׁאת מְאוּמָה לֹא־תָבֹא אֶל־בֵּיתוֹ לַעֲבֹט עֲבֹטוֹ׃
    hebrewPlain: כי תשה ברעך משאת מאומה לא תבא אל ביתו לעבט עבטו
    parashah: Ki Teitzei
    kjvRefs:
