    ref: Deuteronomy 25:6
    book: Deut
    section: torah
    chapter: 25
    verse: 6
    ordinal: 5548
    text: And it shall be, that the first-born that she beareth shall succeed in the name of his brother that is dead, that his name be not blotted out of Israel.
    translation: JPS 1917
    original: וְהָיָה הַבְּכוֹר אֲשֶׁר תֵּלֵד יָקוּם עַל־שֵׁם אָחִיו הַמֵּת וְלֹא־יִמָּחֶה שְׁמוֹ מִיִּשְׂרָאֵל׃
    hebrewPlain: והיה הבכור אשר תלד יקום על שם אחיו המת ולא ימחה שמו מישראל
    parashah: Ki Teitzei
