  data:
    osis: Deut.5.22
    scripture: tanakh
    name: Tanakh Deuteronomy 5:22
    ref: Deuteronomy 5:22
    book: Deut
    section: torah
    chapter: 5
    verse: 22
    ordinal: 5073
    text: Now therefore why should we die? for this great fire will consume us; if we hear the voice of the LORD our God any more, then we shall die.
    translation: JPS 1917
    original: וְעַתָּה לָמָּה נָמוּת כִּי תֹאכְלֵנוּ הָאֵשׁ הַגְּדֹלָה הַזֹּאת אִם־יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ אֶת־קוֹל יְהוָה אֱלֹהֵינוּ עוֹד וָמָתְנוּ׃
    hebrewPlain: ועתה למה נמות כי תאכלנו האש הגדלה הזאת אם יספים אנחנו לשמע את קול יהוה אלהינו עוד ומתנו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:25
    kjvOsis:
    - Deut.5.25
