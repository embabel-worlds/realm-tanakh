    to:
      type: TanakhChapter
      osis: Deut.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.6.1
    scripture: tanakh
    name: Tanakh Deuteronomy 6:1
    ref: Deuteronomy 6:1
    book: Deut
    section: torah
    chapter: 6
    verse: 1
    ordinal: 5082
    text: Now this is the commandment, the statutes, and the ordinances, which the LORD your God commanded to teach you, that ye might do them in the land whither ye go over to possess it—
    translation: JPS 1917
    original: וְזֹאת הַמִּצְוָה הַחֻקִּים וְהַמִּשְׁפָּטִים אֲשֶׁר צִוָּה יְהוָה אֱלֹהֵיכֶם לְלַמֵּד אֶתְכֶם לַעֲשׂוֹת בָּאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: וזאת המצוה החקים והמשפטים אשר צוה יהוה אלהיכם ללמד אתכם לעשות בארץ אשר אתם עברים שמה לרשתה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:1
    kjvOsis:
    - Deut.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.6.2
    scripture: tanakh
    name: Tanakh Deuteronomy 6:2
    ref: Deuteronomy 6:2
    book: Deut
    section: torah
    chapter: 6
    verse: 2
    ordinal: 5083
    text: that thou mightest fear the LORD thy God, to keep all His statutes and His commandments, which I command thee, thou, and thy son, and thy son’s son, all the days of thy life; and that thy days may be prolonged.
    translation: JPS 1917
    original: לְמַעַן תִּירָא אֶת־יְהוָה אֱלֹהֶיךָ לִשְׁמֹר אֶת־כָּל־חֻקֹּתָיו וּמִצְוֺתָיו אֲשֶׁר אָנֹכִי מְצַוֶּךָ אַתָּה וּבִנְךָ וּבֶן־בִּנְךָ כֹּל יְמֵי חַיֶּיךָ וּלְמַעַן יַאֲרִכֻן יָמֶיךָ׃
    hebrewPlain: למען תירא את יהוה אלהיך לשמר את כל חקתיו ומצותיו אשר אנכי מצוך אתה ובנך ובן בנך כל ימי חייך ולמען יארכן ימיך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:2
    kjvOsis:
    - Deut.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
