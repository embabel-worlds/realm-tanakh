  data:
    osis: Deut.5.27
    scripture: tanakh
    name: Tanakh Deuteronomy 5:27
    ref: Deuteronomy 5:27
    book: Deut
    section: torah
    chapter: 5
    verse: 27
    ordinal: 5078
    text: 'Go say to them: Return ye to your tents.'
    translation: JPS 1917
    original: לֵךְ אֱמֹר לָהֶם שׁוּבוּ לָכֶם לְאָהֳלֵיכֶם׃
    hebrewPlain: לך אמר להם שובו לכם לאהליכם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:30
    kjvOsis:
    - Deut.5.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.5
  - predicate: IN_PORTION
