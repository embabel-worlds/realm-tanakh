  data:
    osis: Deut.1.27
    scripture: tanakh
    name: Tanakh Deuteronomy 1:27
    ref: Deuteronomy 1:27
    book: Deut
    section: torah
    chapter: 1
    verse: 27
    ordinal: 4917
    text: 'and ye murmured in your tents, and said: ‘Because the LORD hated us, He hath brought us forth out of the land of Egypt, to deliver us into the hand of the Amorites, to destroy us.'
    translation: JPS 1917
    original: וַתֵּרָגְנוּ בְאָהֳלֵיכֶם וַתֹּאמְרוּ בְּשִׂנְאַת יְהוָה אֹתָנוּ הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי לְהַשְׁמִידֵנוּ׃
    hebrewPlain: ותרגנו באהליכם ותאמרו בשנאת יהוה אתנו הוציאנו מארץ מצרים לתת אתנו ביד האמרי להשמידנו
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:27
    kjvOsis:
    - Deut.1.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.28
    scripture: tanakh
    name: Tanakh Deuteronomy 1:28
    ref: Deuteronomy 1:28
    book: Deut
    section: torah
    chapter: 1
    verse: 28
    ordinal: 4918
    text: 'Whither are we going up? our brethren have made our heart to melt, saying: The people is greater and taller than we; the cities are great and fortified up to heaven; and moreover we have seen the sons of the Anakim there.’'
    translation: JPS 1917
    original: אָנָה אֲנַחְנוּ עֹלִים אַחֵינוּ הֵמַסּוּ אֶת־לְבָבֵנוּ לֵאמֹר עַם גָּדוֹל וָרָם מִמֶּנּוּ עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם וְגַם־בְּנֵי עֲנָקִים רָאִינוּ שָׁם׃
    hebrewPlain: אנה אנחנו עלים אחינו המסו את לבבנו לאמר עם גדול ורם ממנו ערים גדלת ובצורת בשמים וגם בני ענקים ראינו שם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:28
    kjvOsis:
    - Deut.1.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.29
    scripture: tanakh
    name: Tanakh Deuteronomy 1:29
    ref: Deuteronomy 1:29
    book: Deut
    section: torah
    chapter: 1
    verse: 29
    ordinal: 4919
    text: 'Then I said unto you: ‘Dread not, neither be afraid of them.'
    translation: JPS 1917
    original: וָאֹמַר אֲלֵכֶם לֹא־תַעַרְצוּן וְלֹא־תִירְאוּן מֵהֶם׃
    hebrewPlain: ואמר אלכם לא תערצון ולא תיראון מהם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:29
    kjvOsis:
    - Deut.1.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
