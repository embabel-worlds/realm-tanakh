- type: TanakhVerse
  data:
    osis: Deut.15.2
    scripture: tanakh
    name: Tanakh Deuteronomy 15:2
    ref: Deuteronomy 15:2
    book: Deut
    section: torah
    chapter: 15
    verse: 2
    ordinal: 5316
    text: 'And this is the manner of the release: every creditor shall release that which he hath lent unto his neighbour; he shall not exact it of his neighbour and his brother; because the LORD’S release hath been proclaimed.'
    translation: JPS 1917
    original: וְזֶה דְּבַר הַשְּׁמִטָּה שָׁמוֹט כָּל־בַּעַל מַשֵּׁה יָדוֹ אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ לֹא־יִגֹּשׂ אֶת־רֵעֵהוּ וְאֶת־אָחִיו כִּי־קָרָא שְׁמִטָּה לַיהוָה׃
    hebrewPlain: וזה דבר השמטה שמוט כל בעל משה ידו אשר ישה ברעהו לא יגש את רעהו ואת אחיו כי קרא שמטה ליהוה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:2
    kjvOsis:
    - Deut.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.3
    scripture: tanakh
    name: Tanakh Deuteronomy 15:3
    ref: Deuteronomy 15:3
    book: Deut
    section: torah
    chapter: 15
    verse: 3
    ordinal: 5317
    text: Of a foreigner thou mayest exact it; but whatsoever of thine is with thy brother thy hand shall release.
    translation: JPS 1917
    original: אֶת־הַנָּכְרִי תִּגֹּשׂ וַאֲשֶׁר יִהְיֶה לְךָ אֶת־אָחִיךָ תַּשְׁמֵט יָדֶךָ׃
    hebrewPlain: את הנכרי תגש ואשר יהיה לך את אחיך תשמט ידך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:3
    kjvOsis:
    - Deut.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
