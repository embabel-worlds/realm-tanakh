    scripture: tanakh
    name: Tanakh Deuteronomy 16:10
    ref: Deuteronomy 16:10
    book: Deut
    section: torah
    chapter: 16
    verse: 10
    ordinal: 5347
    text: And thou shalt keep the feast of weeks unto the LORD thy God after the measure of the freewill-offering of thy hand, which thou shalt give, according as the LORD thy God blesseth thee.
    translation: JPS 1917
    original: וְעָשִׂיתָ חַג שָׁבֻעוֹת לַיהוָה אֱלֹהֶיךָ מִסַּת נִדְבַת יָדְךָ אֲשֶׁר תִּתֵּן כַּאֲשֶׁר יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ועשית חג שבעות ליהוה אלהיך מסת נדבת ידך אשר תתן כאשר יברכך יהוה אלהיך
    parashah: Re'eh
    kjvRefs:
