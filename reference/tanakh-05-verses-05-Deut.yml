  data:
    osis: Deut.19.18
    scripture: tanakh
    name: Tanakh Deuteronomy 19:18
    ref: Deuteronomy 19:18
    book: Deut
    section: torah
    chapter: 19
    verse: 18
    ordinal: 5419
    text: And the judges shall inquire diligently; and, behold, if the witness be a false witness, and hath testified falsely against his brother;
    translation: JPS 1917
    original: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב וְהִנֵּה עֵד־שֶׁקֶר הָעֵד שֶׁקֶר עָנָה בְאָחִיו׃
    hebrewPlain: ודרשו השפטים היטב והנה עד שקר העד שקר ענה באחיו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:18
    kjvOsis:
