    scripture: tanakh
    name: Tanakh Deuteronomy 12:29
    ref: Deuteronomy 12:29
    book: Deut
    section: torah
    chapter: 12
    verse: 29
    ordinal: 5264
    text: When the LORD thy God shall cut off the nations from before thee, whither thou goest in to dispossess them, and thou dispossessest them, and dwellest in their land;
    translation: JPS 1917
    original: כִּי־יַכְרִית יְהוָה אֱלֹהֶיךָ אֶת־הַגּוֹיִם אֲשֶׁר אַתָּה בָא־שָׁמָּה לָרֶשֶׁת אוֹתָם מִפָּנֶיךָ וְיָרַשְׁתָּ אֹתָם וְיָשַׁבְתָּ בְּאַרְצָם׃
    hebrewPlain: כי יכרית יהוה אלהיך את הגוים אשר אתה בא שמה לרשת אותם מפניך וירשת אתם וישבת בארצם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:29
    kjvOsis:
    - Deut.12.29
