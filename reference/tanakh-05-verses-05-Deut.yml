  data:
    osis: Deut.9.20
    scripture: tanakh
    name: Tanakh Deuteronomy 9:20
    ref: Deuteronomy 9:20
    book: Deut
    section: torah
    chapter: 9
    verse: 20
    ordinal: 5172
    text: Moreover the LORD was very angry with Aaron to have destroyed him; and I prayed for Aaron also the same time.
    translation: JPS 1917
    original: וּבְאַהֲרֹן הִתְאַנַּף יְהוָה מְאֹד לְהַשְׁמִידוֹ וָאֶתְפַּלֵּל גַּם־בְּעַד אַהֲרֹן בָּעֵת הַהִוא
    hebrewPlain: ובאהרן התאנף יהוה מאד להשמידו ואתפלל גם בעד אהרן בעת ההוא
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:20
    kjvOsis:
    - Deut.9.20
