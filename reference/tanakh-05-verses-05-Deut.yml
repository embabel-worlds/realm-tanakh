    verse: 17
    ordinal: 5822
    text: His firstling bullock, majesty is his; And his horns are the horns of the wild-ox; With them he shall gore the peoples all of them, even the ends of the earth; And they are the ten thousands of Ephraim, And they are the thousands of Manasseh.
    translation: JPS 1917
    original: בְּכוֹר שׁוֹרוֹ הָדָר לוֹ וְקַרְנֵי רְאֵם קַרְנָיו בָּהֶם עַמִּים יְנַגַּח יַחְדָּו אַפְסֵי־אָרֶץ וְהֵם רִבְבוֹת אֶפְרַיִם וְהֵם אַלְפֵי מְנַשֶּׁה׃
    hebrewPlain: בכור שורו הדר לו וקרני ראם קרניו בהם עמים ינגח יחדו אפסי ארץ והם רבבות אפרים והם אלפי מנשה
    parashah: V'Zot HaBerachah
    kjvRefs:
