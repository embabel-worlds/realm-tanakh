    scripture: tanakh
    name: Tanakh Deuteronomy 12:22
    ref: Deuteronomy 12:22
    book: Deut
    section: torah
    chapter: 12
    verse: 22
    ordinal: 5257
    text: Howbeit as the gazelle and as the hart is eaten, so thou shalt eat thereof; the unclean and the clean may eat thereof alike.
    translation: JPS 1917
    original: אַךְ כַּאֲשֶׁר יֵאָכֵל אֶת־הַצְּבִי וְאֶת־הָאַיָּל כֵּן תֹּאכְלֶנּוּ הַטָּמֵא וְהַטָּהוֹר יַחְדָּו יֹאכְלֶנּוּ׃
    hebrewPlain: אך כאשר יאכל את הצבי ואת האיל כן תאכלנו הטמא והטהור יחדו יאכלנו
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:22
    kjvOsis:
    - Deut.12.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.23
    scripture: tanakh
    name: Tanakh Deuteronomy 12:23
    ref: Deuteronomy 12:23
    book: Deut
    section: torah
    chapter: 12
    verse: 23
    ordinal: 5258
    text: Only be stedfast in not eating the blood; for the blood is the life; and thou shalt not eat the life with the flesh.
    translation: JPS 1917
    original: רַק חֲזַק לְבִלְתִּי אֲכֹל הַדָּם כִּי הַדָּם הוּא הַנָּפֶשׁ וְלֹא־תֹאכַל הַנֶּפֶשׁ עִם־הַבָּשָׂר׃
    hebrewPlain: רק חזק לבלתי אכל הדם כי הדם הוא הנפש ולא תאכל הנפש עם הבשר
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:23
    kjvOsis:
    - Deut.12.23
  relations:
