      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.22.17
    scripture: tanakh
    name: Tanakh Deuteronomy 22:17
    ref: Deuteronomy 22:17
    book: Deut
    section: torah
    chapter: 22
    verse: 17
    ordinal: 5482
    text: 'and, lo, he hath laid wanton charges, saying: I found not in thy daughter the tokens of virginity; and yet these are the tokens of my daughter’s virginity.’ And they shall spread the garment before the elders of the city.'
    translation: JPS 1917
    original: וְהִנֵּה־הוּא שָׂם עֲלִילֹת דְּבָרִים לֵאמֹר לֹא־מָצָאתִי לְבִתְּךָ בְּתוּלִים וְאֵלֶּה בְּתוּלֵי בִתִּי וּפָרְשׂוּ הַשִּׂמְלָה לִפְנֵי זִקְנֵי הָעִיר׃
    hebrewPlain: והנה הוא שם עלילת דברים לאמר לא מצאתי לבתך בתולים ואלה בתולי בתי ופרשו השמלה לפני זקני העיר
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:17
    kjvOsis:
    - Deut.22.17
  relations:
