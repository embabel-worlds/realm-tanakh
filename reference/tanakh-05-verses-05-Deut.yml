  data:
    osis: Deut.16.18
    scripture: tanakh
    name: Tanakh Deuteronomy 16:18
    ref: Deuteronomy 16:18
    book: Deut
    section: torah
    chapter: 16
    verse: 18
    ordinal: 5355
    text: Judges and officers shalt thou make thee in all thy gates, which the LORD thy God giveth thee, tribe by tribe; and they shall judge the people with righteous judgment.
    translation: JPS 1917
    original: שֹׁפְטִים וְשֹׁטְרִים תִּתֶּן־לְךָ בְּכָל־שְׁעָרֶיךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לִשְׁבָטֶיךָ וְשָׁפְטוּ אֶת־הָעָם מִשְׁפַּט־צֶדֶק׃
    hebrewPlain: שפטים ושטרים תתן לך בכל שעריך אשר יהוה אלהיך נתן לך לשבטיך ושפטו את העם משפט צדק
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 16:18
    kjvOsis:
    - Deut.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.16.19
    scripture: tanakh
    name: Tanakh Deuteronomy 16:19
    ref: Deuteronomy 16:19
    book: Deut
    section: torah
    chapter: 16
    verse: 19
    ordinal: 5356
    text: Thou shalt not wrest judgment; thou shalt not respect persons; neither shalt thou take a gift; for a gift doth blind the eyes of the wise, and pervert the words of the righteous.
    translation: JPS 1917
    original: לֹא־תַטֶּה מִשְׁפָּט לֹא תַכִּיר פָּנִים וְלֹא־תִקַּח שֹׁחַד כִּי הַשֹּׁחַד יְעַוֵּר עֵינֵי חֲכָמִים וִיסַלֵּף דִּבְרֵי צַדִּיקִם׃
    hebrewPlain: לא תטה משפט לא תכיר פנים ולא תקח שחד כי השחד יעור עיני חכמים ויסלף דברי צדיקם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 16:19
    kjvOsis:
    - Deut.16.19
  relations:
