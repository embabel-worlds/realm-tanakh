    translation: JPS 1917
    original: מֵעֲרֹעֵר אֲשֶׁר עַל־שְׂפַת־נַחַל אַרְנֹן וְהָעִיר אֲשֶׁר בַּנַּחַל וְעַד־הַגִּלְעָד לֹא הָיְתָה קִרְיָה אֲשֶׁר שָׂגְבָה מִמֶּנּוּ אֶת־הַכֹּל נָתַן יְהוָה אֱלֹהֵינוּ לְפָנֵינוּ׃
    hebrewPlain: מערער אשר על שפת נחל ארנן והעיר אשר בנחל ועד הגלעד לא היתה קריה אשר שגבה ממנו את הכל נתן יהוה אלהינו לפנינו
    parashah: Devarim
