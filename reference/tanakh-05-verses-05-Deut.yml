  data:
    osis: Deut.23.23
    scripture: tanakh
    name: Tanakh Deuteronomy 23:23
    ref: Deuteronomy 23:23
    book: Deut
    section: torah
    chapter: 23
    verse: 23
    ordinal: 5517
    text: But if thou shalt forbear to vow, it shall be no sin in thee.
    translation: JPS 1917
    original: וְכִי תֶחְדַּל לִנְדֹּר לֹא־יִהְיֶה בְךָ חֵטְא׃
    hebrewPlain: וכי תחדל לנדר לא יהיה בך חטא
    parashah: Ki Teitzei
    kjvRefs:
