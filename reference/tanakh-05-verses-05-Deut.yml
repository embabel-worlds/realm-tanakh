    scripture: tanakh
    name: Tanakh Deuteronomy 24:13
    ref: Deuteronomy 24:13
    book: Deut
    section: torah
    chapter: 24
    verse: 13
    ordinal: 5533
    text: thou shalt surely restore to him the pledge when the sun goeth down, that he may sleep in his garment, and bless thee; and it shall be righteousness unto thee before the LORD thy God.
    translation: JPS 1917
    original: הָשֵׁב תָּשִׁיב לוֹ אֶת־הַעֲבוֹט כְּבֹא הַשֶּׁמֶשׁ וְשָׁכַב בְּשַׂלְמָתוֹ וּבֵרֲכֶךָּ וּלְךָ תִּהְיֶה צְדָקָה לִפְנֵי יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: השב תשיב לו את העבוט כבא השמש ושכב בשלמתו וברכך ולך תהיה צדקה לפני יהוה אלהיך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 24:13
    kjvOsis:
    - Deut.24.13
