    scripture: tanakh
    name: Tanakh Deuteronomy 25:18
    ref: Deuteronomy 25:18
    book: Deut
    section: torah
    chapter: 25
    verse: 18
    ordinal: 5560
    text: how he met thee by the way, and smote the hindmost of thee, all that were enfeebled in thy rear, when thou wast faint and weary; and he feared not God.
    translation: JPS 1917
    original: אֲשֶׁר קָרְךָ בַּדֶּרֶךְ וַיְזַנֵּב בְּךָ כָּל־הַנֶּחֱשָׁלִים אַחַרֶיךָ וְאַתָּה עָיֵף וְיָגֵעַ וְלֹא יָרֵא אֱלֹהִים׃
    hebrewPlain: אשר קרך בדרך ויזנב בך כל הנחשלים אחריך ואתה עיף ויגע ולא ירא אלהים
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:18
    kjvOsis:
