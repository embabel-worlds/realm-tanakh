    scripture: tanakh
    name: Tanakh Deuteronomy 25:5
    ref: Deuteronomy 25:5
    book: Deut
    section: torah
    chapter: 25
    verse: 5
    ordinal: 5547
    text: If brethren dwell together, and one of them die, and have no child, the wife of the dead shall not be married abroad unto one not of his kin; her husband’s brother shall go in unto her, and take her to him to wife, and perform the duty of a husband’s brother unto her.
    translation: JPS 1917
    original: כִּי־יֵשְׁבוּ אַחִים יַחְדָּו וּמֵת אַחַד מֵהֶם וּבֵן אֵין־לוֹ לֹא־תִהְיֶה אֵשֶׁת־הַמֵּת הַחוּצָה לְאִישׁ זָר יְבָמָהּ יָבֹא עָלֶיהָ וּלְקָחָהּ לוֹ לְאִשָּׁה וְיִבְּמָהּ׃
    hebrewPlain: כי ישבו אחים יחדו ומת אחד מהם ובן אין לו לא תהיה אשת המת החוצה לאיש זר יבמה יבא עליה ולקחה לו לאשה ויבמה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:5
    kjvOsis:
