  data:
    osis: Deut.12.30
    scripture: tanakh
    name: Tanakh Deuteronomy 12:30
    ref: Deuteronomy 12:30
    book: Deut
    section: torah
    chapter: 12
    verse: 30
    ordinal: 5265
    text: 'take heed to thyself that thou be not ensnared to follow them, after that they are destroyed from before thee; and that thou inquire not after their gods, saying: ‘How used these nations to serve their gods? even so will I do likewise.’'
    translation: JPS 1917
    original: הִשָּׁמֶר לְךָ פֶּן־תִּנָּקֵשׁ אַחֲרֵיהֶם אַחֲרֵי הִשָּׁמְדָם מִפָּנֶיךָ וּפֶן־תִּדְרֹשׁ לֵאלֹהֵיהֶם לֵאמֹר אֵיכָה יַעַבְדוּ הַגּוֹיִם הָאֵלֶּה אֶת־אֱלֹהֵיהֶם וְאֶעֱשֶׂה־כֵּן גַּם־אָנִי׃
    hebrewPlain: השמר לך פן תנקש אחריהם אחרי השמדם מפניך ופן תדרש לאלהיהם לאמר איכה יעבדו הגוים האלה את אלהיהם ואעשה כן גם אני
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:30
    kjvOsis:
    - Deut.12.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.31
    scripture: tanakh
    name: Tanakh Deuteronomy 12:31
    ref: Deuteronomy 12:31
    book: Deut
    section: torah
    chapter: 12
    verse: 31
    ordinal: 5266
    text: Thou shalt not do so unto the LORD thy God; for every abomination to the LORD, which He hateth, have they done unto their gods; for even their sons and their daughters do they burn in the fire to their gods.
    translation: JPS 1917
    original: לֹא־תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ כִּי כָּל־תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא עָשׂוּ לֵאלֹהֵיהֶם כִּי גַם אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם׃
    hebrewPlain: לא תעשה כן ליהוה אלהיך כי כל תועבת יהוה אשר שנא עשו לאלהיהם כי גם את בניהם ואת בנתיהם ישרפו באש לאלהיהם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:31
    kjvOsis:
    - Deut.12.31
