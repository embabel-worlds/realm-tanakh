      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.14
    scripture: tanakh
    name: Tanakh Deuteronomy 7:14
    ref: Deuteronomy 7:14
    book: Deut
    section: torah
    chapter: 7
    verse: 14
    ordinal: 5120
    text: Thou shalt be blessed above all peoples; there shall not be male or female barren among you, or among your cattle.
    translation: JPS 1917
    original: בָּרוּךְ תִּהְיֶה מִכָּל־הָעַמִּים לֹא־יִהְיֶה בְךָ עָקָר וַעֲקָרָה וּבִבְהֶמְתֶּךָ׃
    hebrewPlain: ברוך תהיה מכל העמים לא יהיה בך עקר ועקרה ובבהמתך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:14
    kjvOsis:
    - Deut.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.15
    scripture: tanakh
    name: Tanakh Deuteronomy 7:15
    ref: Deuteronomy 7:15
    book: Deut
    section: torah
    chapter: 7
    verse: 15
    ordinal: 5121
    text: And the LORD will take away from thee all sickness; and He will put none of the evil diseases of Egypt, which thou knowest, upon thee, but will lay them upon all them that hate thee.
    translation: JPS 1917
    original: וְהֵסִיר יְהוָה מִמְּךָ כָּל־חֹלִי וְכָל־מַדְוֵי מִצְרַיִם הָרָעִים אֲשֶׁר יָדַעְתָּ לֹא יְשִׂימָם בָּךְ וּנְתָנָם בְּכָל־שֹׂנְאֶיךָ׃
    hebrewPlain: והסיר יהוה ממך כל חלי וכל מדוי מצרים הרעים אשר ידעת לא ישימם בך ונתנם בכל שנאיך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:15
    kjvOsis:
    - Deut.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.16
    scripture: tanakh
    name: Tanakh Deuteronomy 7:16
    ref: Deuteronomy 7:16
    book: Deut
    section: torah
    chapter: 7
    verse: 16
    ordinal: 5122
    text: And thou shalt consume all the peoples that the LORD thy God shall deliver unto thee; thine eye shall not pity them; neither shalt thou serve their gods; for that will be a snare unto thee.
    translation: JPS 1917
    original: וְאָכַלְתָּ אֶת־כָּל־הָעַמִּים אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ לֹא־תָחֹס עֵינְךָ עֲלֵיהֶם וְלֹא תַעֲבֹד אֶת־אֱלֹהֵיהֶם כִּי־מוֹקֵשׁ הוּא לָךְ׃
    hebrewPlain: ואכלת את כל העמים אשר יהוה אלהיך נתן לך לא תחס עינך עליהם ולא תעבד את אלהיהם כי מוקש הוא לך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:16
    kjvOsis:
    - Deut.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.17
    scripture: tanakh
    name: Tanakh Deuteronomy 7:17
    ref: Deuteronomy 7:17
    book: Deut
    section: torah
    chapter: 7
    verse: 17
    ordinal: 5123
    text: 'If thou shalt say in thy heart: ‘These nations are more than I; how can I dispossess them?’'
    translation: JPS 1917
    original: כִּי תֹאמַר בִּלְבָבְךָ רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי אֵיכָה אוּכַל לְהוֹרִישָׁם׃
    hebrewPlain: כי תאמר בלבבך רבים הגוים האלה ממני איכה אוכל להורישם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:17
    kjvOsis:
    - Deut.7.17
