    verse: 27
    ordinal: 5230
    text: the blessing, if ye shall hearken unto the commandments of the LORD your God, which I command you this day;
    translation: JPS 1917
    original: אֶת־הַבְּרָכָה אֲשֶׁר תִּשְׁמְעוּ אֶל־מִצְוֺת יְהוָה אֱלֹהֵיכֶם אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם׃
    hebrewPlain: את הברכה אשר תשמעו אל מצות יהוה אלהיכם אשר אנכי מצוה אתכם היום
    parashah: Re'eh
    kjvRefs:
