    original: וְזָכַרְתָּ אֶת־כָּל־הַדֶּרֶךְ אֲשֶׁר הֹלִיכֲךָ יְהוָה אֱלֹהֶיךָ זֶה אַרְבָּעִים שָׁנָה בַּמִּדְבָּר לְמַעַן עַנֹּתְךָ לְנַסֹּתְךָ לָדַעַת אֶת־אֲשֶׁר בִּלְבָבְךָ הֲתִשְׁמֹר מצותו [מִצְוֺתָיו] אִם־לֹא׃
    hebrewPlain: וזכרת את כל הדרך אשר הליכך יהוה אלהיך זה ארבעים שנה במדבר למען ענתך לנסתך לדעת את אשר בלבבך התשמר מצותו [מצותיו] אם לא
    parashah: Eikev
    kjvRefs:
