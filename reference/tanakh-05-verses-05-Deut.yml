  data:
    osis: Deut.21.21
    scripture: tanakh
    name: Tanakh Deuteronomy 21:21
    ref: Deuteronomy 21:21
    book: Deut
    section: torah
    chapter: 21
    verse: 21
    ordinal: 5463
    text: And all the men of his city shall stone him with stones, that he die; so shalt thou put away the evil from the midst of thee; and all Israel shall hear, and fear.
    translation: JPS 1917
    original: וּרְגָמֻהוּ כָּל־אַנְשֵׁי עִירוֹ בָאֲבָנִים וָמֵת וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ וְכָל־יִשְׂרָאֵל יִשְׁמְעוּ וְיִרָאוּ׃
    hebrewPlain: ורגמהו כל אנשי עירו באבנים ומת ובערת הרע מקרבך וכל ישראל ישמעו ויראו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:21
    kjvOsis:
    - Deut.21.21
  relations:
  - predicate: IN
    to:
