    scripture: tanakh
    name: Tanakh Deuteronomy 21:15
    ref: Deuteronomy 21:15
    book: Deut
    section: torah
    chapter: 21
    verse: 15
    ordinal: 5457
    text: If a man have two wives, the one beloved, and the other hated, and they have borne him children, both the beloved and the hated; and if the first-born son be hers that was hated;
    translation: JPS 1917
    original: כִּי־תִהְיֶיןָ לְאִישׁ שְׁתֵּי נָשִׁים הָאַחַת אֲהוּבָה וְהָאַחַת שְׂנוּאָה וְיָלְדוּ־לוֹ בָנִים הָאֲהוּבָה וְהַשְּׂנוּאָה וְהָיָה הַבֵּן הַבְּכוֹר לַשְּׂנִיאָה׃
    hebrewPlain: כי תהיין לאיש שתי נשים האחת אהובה והאחת שנואה וילדו לו בנים האהובה והשנואה והיה הבן הבכור לשניאה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:15
    kjvOsis:
    - Deut.21.15
