    scripture: tanakh
    name: Tanakh Deuteronomy 6:22
    ref: Deuteronomy 6:22
    book: Deut
    section: torah
    chapter: 6
    verse: 22
    ordinal: 5103
    text: And the LORD showed signs and wonders, great and sore, upon Egypt, upon Pharaoh, and upon all his house, before our eyes.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה אוֹתֹת וּמֹפְתִים גְּדֹלִים וְרָעִים בְּמִצְרַיִם בְּפַרְעֹה וּבְכָל־בֵּיתוֹ לְעֵינֵינוּ׃
    hebrewPlain: ויתן יהוה אותת ומפתים גדלים ורעים במצרים בפרעה ובכל ביתו לעינינו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:22
    kjvOsis:
