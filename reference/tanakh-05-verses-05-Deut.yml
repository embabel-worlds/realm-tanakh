    section: torah
    chapter: 24
    verse: 9
    ordinal: 5529
    text: Remember what the LORD thy God did unto Miriam, by the way as ye came forth out of Egypt.
    translation: JPS 1917
    original: זָכוֹר אֵת אֲשֶׁר־עָשָׂה יְהוָה אֱלֹהֶיךָ לְמִרְיָם בַּדֶּרֶךְ בְּצֵאתְכֶם מִמִּצְרָיִם׃
