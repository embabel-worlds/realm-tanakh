    section: torah
    chapter: 3
    verse: 21
    ordinal: 4994
    text: 'And I commanded Joshua at that time, saying: ‘Thine eyes have seen all that the LORD your God hath done unto these two kings; so shall the LORD do unto all the kingdoms whither thou goest over.'
    translation: JPS 1917
    original: וְאֶת־יְהוֹשׁוּעַ צִוֵּיתִי בָּעֵת הַהִוא לֵאמֹר עֵינֶיךָ הָרֹאֹת אֵת כָּל־אֲשֶׁר עָשָׂה יְהוָה אֱלֹהֵיכֶם לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה כֵּן־יַעֲשֶׂה יְהוָה לְכָל־הַמַּמְלָכוֹת אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה׃
    hebrewPlain: ואת יהושוע צויתי בעת ההוא לאמר עיניך הראת את כל אשר עשה יהוה אלהיכם לשני המלכים האלה כן יעשה יהוה לכל הממלכות אשר אתה עבר שמה
    parashah: Devarim
    kjvRefs:
