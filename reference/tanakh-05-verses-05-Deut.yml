- type: TanakhVerse
  data:
    osis: Deut.20.13
    scripture: tanakh
    name: Tanakh Deuteronomy 20:13
    ref: Deuteronomy 20:13
    book: Deut
    section: torah
    chapter: 20
    verse: 13
    ordinal: 5435
    text: And when the LORD thy God delivereth it into thy hand, thou shalt smite every male thereof with the edge of the sword;
    translation: JPS 1917
    original: וּנְתָנָהּ יְהוָה אֱלֹהֶיךָ בְּיָדֶךָ וְהִכִּיתָ אֶת־כָּל־זְכוּרָהּ לְפִי־חָרֶב׃
    hebrewPlain: ונתנה יהוה אלהיך בידך והכית את כל זכורה לפי חרב
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:13
    kjvOsis:
    - Deut.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.14
    scripture: tanakh
    name: Tanakh Deuteronomy 20:14
    ref: Deuteronomy 20:14
    book: Deut
    section: torah
    chapter: 20
    verse: 14
    ordinal: 5436
    text: but the women, and the little ones, and the cattle, and all that is in the city, even all the spoil thereof, shalt thou take for a prey unto thyself; and thou shalt eat the spoil of thine enemies, which the LORD thy God hath given thee.
    translation: JPS 1917
    original: רַק הַנָּשִׁים וְהַטַּף וְהַבְּהֵמָה וְכֹל אֲשֶׁר יִהְיֶה בָעִיר כָּל־שְׁלָלָהּ תָּבֹז לָךְ וְאָכַלְתָּ אֶת־שְׁלַל אֹיְבֶיךָ אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ׃
    hebrewPlain: רק הנשים והטף והבהמה וכל אשר יהיה בעיר כל שללה תבז לך ואכלת את שלל איביך אשר נתן יהוה אלהיך לך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:14
    kjvOsis:
    - Deut.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.15
    scripture: tanakh
    name: Tanakh Deuteronomy 20:15
    ref: Deuteronomy 20:15
    book: Deut
    section: torah
    chapter: 20
    verse: 15
    ordinal: 5437
    text: Thus shalt thou do unto all the cities which are very far off from thee, which are not of the cities of these nations.
    translation: JPS 1917
    original: כֵּן תַּעֲשֶׂה לְכָל־הֶעָרִים הָרְחֹקֹת מִמְּךָ מְאֹד אֲשֶׁר לֹא־מֵעָרֵי הַגּוֹיִם־הָאֵלֶּה הֵנָּה׃
    hebrewPlain: כן תעשה לכל הערים הרחקת ממך מאד אשר לא מערי הגוים האלה הנה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:15
    kjvOsis:
    - Deut.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.16
    scripture: tanakh
    name: Tanakh Deuteronomy 20:16
    ref: Deuteronomy 20:16
    book: Deut
    section: torah
    chapter: 20
    verse: 16
    ordinal: 5438
    text: Howbeit of the cities of these peoples, that the LORD thy God giveth thee for an inheritance, thou shalt save alive nothing that breatheth,
    translation: JPS 1917
    original: רַק מֵעָרֵי הָעַמִּים הָאֵלֶּה אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה לֹא תְחַיֶּה כָּל־נְשָׁמָה׃
    hebrewPlain: רק מערי העמים האלה אשר יהוה אלהיך נתן לך נחלה לא תחיה כל נשמה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:16
    kjvOsis:
    - Deut.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.17
    scripture: tanakh
    name: Tanakh Deuteronomy 20:17
    ref: Deuteronomy 20:17
    book: Deut
    section: torah
    chapter: 20
    verse: 17
    ordinal: 5439
    text: 'but thou shalt utterly destroy them: the Hittite, and the Amorite, the Canaanite, and the Perizzite, the Hivite, and the Jebusite; as the LORD thy God hath commanded thee;'
    translation: JPS 1917
    original: כִּי־הַחֲרֵם תַּחֲרִימֵם הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי כַּאֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: כי החרם תחרימם החתי והאמרי הכנעני והפרזי החוי והיבוסי כאשר צוך יהוה אלהיך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:17
    kjvOsis:
    - Deut.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
