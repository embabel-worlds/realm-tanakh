    ordinal: 5814
    text: 'Who said of his father, and of his mother: ‘I have not seen him’; Neither did he acknowledge his brethren, Nor knew he his own children; For they have observed Thy word, And keep Thy covenant.'
    translation: JPS 1917
    original: הָאֹמֵר לְאָבִיו וּלְאִמּוֹ לֹא רְאִיתִיו וְאֶת־אֶחָיו לֹא הִכִּיר וְאֶת־בנו [בָּנָיו] לֹא יָדָע כִּי שָׁמְרוּ אִמְרָתֶךָ וּבְרִיתְךָ יִנְצֹרוּ׃
