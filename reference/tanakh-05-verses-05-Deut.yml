  data:
    osis: Deut.28.23
    scripture: tanakh
    name: Tanakh Deuteronomy 28:23
    ref: Deuteronomy 28:23
    book: Deut
    section: torah
    chapter: 28
    verse: 23
    ordinal: 5629
    text: And thy heaven that is over thy head shall be brass, and the earth that is under thee shall be iron.
    translation: JPS 1917
    original: וְהָיוּ שָׁמֶיךָ אֲשֶׁר עַל־רֹאשְׁךָ נְחֹשֶׁת וְהָאָרֶץ אֲשֶׁר־תַּחְתֶּיךָ בַּרְזֶל׃
    hebrewPlain: והיו שמיך אשר על ראשך נחשת והארץ אשר תחתיך ברזל
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:23
    kjvOsis:
    - Deut.28.23
