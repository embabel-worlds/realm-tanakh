    scripture: tanakh
    name: Tanakh Deuteronomy 23:16
    ref: Deuteronomy 23:16
    book: Deut
    section: torah
    chapter: 23
    verse: 16
    ordinal: 5510
    text: Thou shalt not deliver unto his master a bondman that is escaped from his master unto thee;
    translation: JPS 1917
    original: לֹא־תַסְגִּיר עֶבֶד אֶל־אֲדֹנָיו אֲשֶׁר־יִנָּצֵל אֵלֶיךָ מֵעִם אֲדֹנָיו׃
    hebrewPlain: לא תסגיר עבד אל אדניו אשר ינצל אליך מעם אדניו
    parashah: Ki Teitzei
    kjvRefs:
