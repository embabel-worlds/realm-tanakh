    section: torah
    chapter: 2
    verse: 28
    ordinal: 4964
    text: Thou shalt sell me food for money, that I may eat; and give me water for money, that I may drink; only let me pass through on my feet;
    translation: JPS 1917
    original: אֹכֶל בַּכֶּסֶף תַּשְׁבִּרֵנִי וְאָכַלְתִּי וּמַיִם בַּכֶּסֶף תִּתֶּן־לִי וְשָׁתִיתִי רַק אֶעְבְּרָה בְרַגְלָי׃
