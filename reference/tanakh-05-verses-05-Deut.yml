- type: TanakhVerse
  data:
    osis: Deut.23.5
    scripture: tanakh
    name: Tanakh Deuteronomy 23:5
    ref: Deuteronomy 23:5
    book: Deut
    section: torah
    chapter: 23
    verse: 5
    ordinal: 5499
    text: because they met you not with bread and with water in the way, when ye came forth out of Egypt; and because they hired against thee Balaam the son of Beor from Pethor of Aram-naharaim, to curse thee.
    translation: JPS 1917
    original: עַל־דְּבַר אֲשֶׁר לֹא־קִדְּמוּ אֶתְכֶם בַּלֶּחֶם וּבַמַּיִם בַּדֶּרֶךְ בְּצֵאתְכֶם מִמִּצְרָיִם וַאֲשֶׁר שָׂכַר עָלֶיךָ אֶת־בִּלְעָם בֶּן־בְּעוֹר מִפְּתוֹר אֲרַם נַהֲרַיִם לְקַלְלֶךָּ׃
    hebrewPlain: על דבר אשר לא קדמו אתכם בלחם ובמים בדרך בצאתכם ממצרים ואשר שכר עליך את בלעם בן בעור מפתור ארם נהרים לקללך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:4
    kjvOsis:
    - Deut.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.6
    scripture: tanakh
    name: Tanakh Deuteronomy 23:6
    ref: Deuteronomy 23:6
    book: Deut
    section: torah
    chapter: 23
    verse: 6
    ordinal: 5500
    text: Nevertheless the LORD thy God would not hearken unto Balaam; but the LORD thy God turned the curse into a blessing unto thee, because the LORD thy God loved thee.
    translation: JPS 1917
    original: וְלֹא־אָבָה יְהוָה אֱלֹהֶיךָ לִשְׁמֹעַ אֶל־בִּלְעָם וַיַּהֲפֹךְ יְהוָה אֱלֹהֶיךָ לְּךָ אֶת־הַקְּלָלָה לִבְרָכָה כִּי אֲהֵבְךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ולא אבה יהוה אלהיך לשמע אל בלעם ויהפך יהוה אלהיך לך את הקללה לברכה כי אהבך יהוה אלהיך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:5
    kjvOsis:
    - Deut.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
