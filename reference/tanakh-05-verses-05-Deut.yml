  data:
    osis: Deut.1.23
    scripture: tanakh
    name: Tanakh Deuteronomy 1:23
    ref: Deuteronomy 1:23
    book: Deut
    section: torah
    chapter: 1
    verse: 23
    ordinal: 4913
    text: And the thing pleased me well; and I took twelve men of you, one man for every tribe;
    translation: JPS 1917
    original: וַיִּיטַב בְּעֵינַי הַדָּבָר וָאֶקַּח מִכֶּם שְׁנֵים עָשָׂר אֲנָשִׁים אִישׁ אֶחָד לַשָּׁבֶט׃
    hebrewPlain: וייטב בעיני הדבר ואקח מכם שנים עשר אנשים איש אחד לשבט
    parashah: Devarim
    kjvRefs:
