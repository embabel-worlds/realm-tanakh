    name: Tanakh Deuteronomy 9:16
    ref: Deuteronomy 9:16
    book: Deut
    section: torah
    chapter: 9
    verse: 16
    ordinal: 5168
    text: And I looked, and, behold, ye had sinned against the LORD your God; ye had made you a molten calf; ye had turned aside quickly out of the way which the LORD had commanded you.
    translation: JPS 1917
    original: וָאֵרֶא וְהִנֵּה חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם עֲשִׂיתֶם לָכֶם עֵגֶל מַסֵּכָה סַרְתֶּם מַהֵר מִן־הַדֶּרֶךְ אֲשֶׁר־צִוָּה יְהוָה אֶתְכֶם׃
    hebrewPlain: וארא והנה חטאתם ליהוה אלהיכם עשיתם לכם עגל מסכה סרתם מהר מן הדרך אשר צוה יהוה אתכם
    parashah: Eikev
