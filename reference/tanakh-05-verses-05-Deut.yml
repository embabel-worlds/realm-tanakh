- type: TanakhVerse
  data:
    osis: Deut.22.20
    scripture: tanakh
    name: Tanakh Deuteronomy 22:20
    ref: Deuteronomy 22:20
    book: Deut
    section: torah
    chapter: 22
    verse: 20
    ordinal: 5485
    text: But if this thing be true, that the tokens of virginity were not found in the damsel;
    translation: JPS 1917
    original: וְאִם־אֱמֶת הָיָה הַדָּבָר הַזֶּה לֹא־נִמְצְאוּ בְתוּלִים לנער [לַנַּעֲרָה׃]
    hebrewPlain: ואם אמת היה הדבר הזה לא נמצאו בתולים לנער [לנערה]
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:20
    kjvOsis:
    - Deut.22.20
