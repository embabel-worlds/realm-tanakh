  data:
    osis: Deut.23.24
    scripture: tanakh
    name: Tanakh Deuteronomy 23:24
    ref: Deuteronomy 23:24
    book: Deut
    section: torah
    chapter: 23
    verse: 24
    ordinal: 5518
    text: That which is gone out of thy lips thou shalt observe and do; according as thou hast vowed freely unto the LORD thy God, even that which thou hast promised with thy mouth.
    translation: JPS 1917
    original: מוֹצָא שְׂפָתֶיךָ תִּשְׁמֹר וְעָשִׂיתָ כַּאֲשֶׁר נָדַרְתָּ לַיהוָה אֱלֹהֶיךָ נְדָבָה אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ׃
    hebrewPlain: מוצא שפתיך תשמר ועשית כאשר נדרת ליהוה אלהיך נדבה אשר דברת בפיך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:23
    kjvOsis:
    - Deut.23.23
