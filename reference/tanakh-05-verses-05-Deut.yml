  data:
    osis: Deut.16.13
    scripture: tanakh
    name: Tanakh Deuteronomy 16:13
    ref: Deuteronomy 16:13
    book: Deut
    section: torah
    chapter: 16
    verse: 13
    ordinal: 5350
    text: Thou shalt keep the feast of tabernacles seven days, after that thou hast gathered in from thy threshing-floor and from thy winepress.
    translation: JPS 1917
    original: חַג הַסֻּכֹּת תַּעֲשֶׂה לְךָ שִׁבְעַת יָמִים בְּאָסְפְּךָ מִגָּרְנְךָ וּמִיִּקְבֶךָ׃
    hebrewPlain: חג הסכת תעשה לך שבעת ימים באספך מגרנך ומיקבך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:13
    kjvOsis:
    - Deut.16.13
