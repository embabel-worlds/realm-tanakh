    scripture: tanakh
    name: Tanakh Deuteronomy 16:9
    ref: Deuteronomy 16:9
    book: Deut
    section: torah
    chapter: 16
    verse: 9
    ordinal: 5346
    text: Seven weeks shalt thou number unto thee; from the time the sickle is first put to the standing corn shalt thou begin to number seven weeks.
    translation: JPS 1917
    original: שִׁבְעָה שָׁבֻעֹת תִּסְפָּר־לָךְ מֵהָחֵל חֶרְמֵשׁ בַּקָּמָה תָּחֵל לִסְפֹּר שִׁבְעָה שָׁבֻעוֹת׃
    hebrewPlain: שבעה שבעת תספר לך מהחל חרמש בקמה תחל לספר שבעה שבעות
    parashah: Re'eh
    kjvRefs:
