    scripture: tanakh
    name: Tanakh Deuteronomy 2:8
    ref: Deuteronomy 2:8
    book: Deut
    section: torah
    chapter: 2
    verse: 8
    ordinal: 4944
    text: So we passed by from our brethren the children of Esau, that dwell in Seir, from the way of the Arabah, from Elath and from Ezion-geber. And we turned and passed by the way of the wilderness of Moab.
    translation: JPS 1917
    original: וַנַּעֲבֹר מֵאֵת אַחֵינוּ בְנֵי־עֵשָׂו הַיֹּשְׁבִים בְּשֵׂעִיר מִדֶּרֶךְ הָעֲרָבָה מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר וַנֵּפֶן וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב׃
    hebrewPlain: ונעבר מאת אחינו בני עשו הישבים בשעיר מדרך הערבה מאילת ומעצין גבר ונפן ונעבר דרך מדבר מואב
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 2:8
    kjvOsis:
    - Deut.2.8
