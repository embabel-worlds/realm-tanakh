  data:
    osis: Deut.28.21
    scripture: tanakh
    name: Tanakh Deuteronomy 28:21
    ref: Deuteronomy 28:21
    book: Deut
    section: torah
    chapter: 28
    verse: 21
    ordinal: 5627
    text: The LORD will make the pestilence cleave unto thee, until He have consumed thee from off the land, whither thou goest in to possess it.
    translation: JPS 1917
    original: יַדְבֵּק יְהוָה בְּךָ אֶת־הַדָּבֶר עַד כַּלֹּתוֹ אֹתְךָ מֵעַל הָאֲדָמָה אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: ידבק יהוה בך את הדבר עד כלתו אתך מעל האדמה אשר אתה בא שמה לרשתה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:21
    kjvOsis:
    - Deut.28.21
