    original: כֹּל עָרֵי הַמִּישֹׁר וְכָל־הַגִּלְעָד וְכָל־הַבָּשָׁן עַד־סַלְכָה וְאֶדְרֶעִי עָרֵי מַמְלֶכֶת עוֹג בַּבָּשָׁן׃
    hebrewPlain: כל ערי המישר וכל הגלעד וכל הבשן עד סלכה ואדרעי ערי ממלכת עוג בבשן
