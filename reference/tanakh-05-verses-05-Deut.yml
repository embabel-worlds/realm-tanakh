- type: TanakhVerse
  data:
    osis: Deut.15.4
    scripture: tanakh
    name: Tanakh Deuteronomy 15:4
    ref: Deuteronomy 15:4
    book: Deut
    section: torah
    chapter: 15
    verse: 4
    ordinal: 5318
    text: Howbeit there shall be no needy among you—for the LORD will surely bless thee in the land which the LORD thy God giveth thee for an inheritance to possess it—
    translation: JPS 1917
    original: אֶפֶס כִּי לֹא יִהְיֶה־בְּךָ אֶבְיוֹן כִּי־בָרֵךְ יְבָרֶכְךָ יְהוָה בָּאָרֶץ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן־לְךָ נַחֲלָה לְרִשְׁתָּהּ׃
    hebrewPlain: אפס כי לא יהיה בך אביון כי ברך יברכך יהוה בארץ אשר יהוה אלהיך נתן לך נחלה לרשתה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:4
    kjvOsis:
    - Deut.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.5
    scripture: tanakh
    name: Tanakh Deuteronomy 15:5
    ref: Deuteronomy 15:5
    book: Deut
    section: torah
    chapter: 15
    verse: 5
    ordinal: 5319
    text: if only thou diligently hearken unto the voice of the LORD thy God, to observe to do all this commandment which I command thee this day.
    translation: JPS 1917
    original: רַק אִם־שָׁמוֹעַ תִּשְׁמַע בְּקוֹל יְהוָה אֱלֹהֶיךָ לִשְׁמֹר לַעֲשׂוֹת אֶת־כָּל־הַמִּצְוָה הַזֹּאת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם׃
    hebrewPlain: רק אם שמוע תשמע בקול יהוה אלהיך לשמר לעשות את כל המצוה הזאת אשר אנכי מצוך היום
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:5
    kjvOsis:
    - Deut.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.6
    scripture: tanakh
    name: Tanakh Deuteronomy 15:6
    ref: Deuteronomy 15:6
    book: Deut
    section: torah
    chapter: 15
    verse: 6
    ordinal: 5320
    text: For the LORD thy God will bless thee, as He promised thee; and thou shalt lend unto many nations, but thou shalt not borrow; and thou shalt rule over many nations, but they shall not rule over thee.
    translation: JPS 1917
    original: כִּי־יְהוָה אֱלֹהֶיךָ בֵּרַכְךָ כַּאֲשֶׁר דִּבֶּר־לָךְ וְהַעֲבַטְתָּ גּוֹיִם רַבִּים וְאַתָּה לֹא תַעֲבֹט וּמָשַׁלְתָּ בְּגוֹיִם רַבִּים וּבְךָ לֹא יִמְשֹׁלוּ׃
    hebrewPlain: כי יהוה אלהיך ברכך כאשר דבר לך והעבטת גוים רבים ואתה לא תעבט ומשלת בגוים רבים ובך לא ימשלו
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:6
    kjvOsis:
    - Deut.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.7
    scripture: tanakh
    name: Tanakh Deuteronomy 15:7
    ref: Deuteronomy 15:7
    book: Deut
    section: torah
    chapter: 15
    verse: 7
    ordinal: 5321
    text: If there be among you a needy man, one of thy brethren, within any of thy gates, in thy land which the LORD thy God giveth thee, thou shalt not harden thy heart, nor shut thy hand from thy needy brother;
    translation: JPS 1917
    original: כִּי־יִהְיֶה בְךָ אֶבְיוֹן מֵאַחַד אַחֶיךָ בְּאַחַד שְׁעָרֶיךָ בְּאַרְצְךָ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ לֹא תְאַמֵּץ אֶת־לְבָבְךָ וְלֹא תִקְפֹּץ אֶת־יָדְךָ מֵאָחִיךָ הָאֶבְיוֹן׃
    hebrewPlain: כי יהיה בך אביון מאחד אחיך באחד שעריך בארצך אשר יהוה אלהיך נתן לך לא תאמץ את לבבך ולא תקפץ את ידך מאחיך האביון
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:7
    kjvOsis:
    - Deut.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.8
    scripture: tanakh
    name: Tanakh Deuteronomy 15:8
    ref: Deuteronomy 15:8
    book: Deut
    section: torah
    chapter: 15
    verse: 8
    ordinal: 5322
    text: but thou shalt surely open thy hand unto him, and shalt surely lend him sufficient for his need in that which he wanteth.
    translation: JPS 1917
    original: כִּי־פָתֹחַ תִּפְתַּח אֶת־יָדְךָ לוֹ וְהַעֲבֵט תַּעֲבִיטֶנּוּ דֵּי מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ׃
    hebrewPlain: כי פתח תפתח את ידך לו והעבט תעביטנו די מחסרו אשר יחסר לו
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:8
    kjvOsis:
    - Deut.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.9
    scripture: tanakh
    name: Tanakh Deuteronomy 15:9
    ref: Deuteronomy 15:9
    book: Deut
    section: torah
    chapter: 15
    verse: 9
    ordinal: 5323
    text: 'Beware that there be not a base thought in thy heart, saying: ‘The seventh year, the year of release, is at hand’; and thine eye be evil against thy needy brother, and thou give him nought; and he cry unto the LORD against thee, and it be sin in thee.'
    translation: JPS 1917
    original: הִשָּׁמֶר לְךָ פֶּן־יִהְיֶה דָבָר עִם־לְבָבְךָ בְלִיַּעַל לֵאמֹר קָרְבָה שְׁנַת־הַשֶּׁבַע שְׁנַת הַשְּׁמִטָּה וְרָעָה עֵינְךָ בְּאָחִיךָ הָאֶבְיוֹן וְלֹא תִתֵּן לוֹ וְקָרָא עָלֶיךָ אֶל־יְהוָה וְהָיָה בְךָ חֵטְא׃
    hebrewPlain: השמר לך פן יהיה דבר עם לבבך בליעל לאמר קרבה שנת השבע שנת השמטה ורעה עינך באחיך האביון ולא תתן לו וקרא עליך אל יהוה והיה בך חטא
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:9
    kjvOsis:
    - Deut.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.10
    scripture: tanakh
    name: Tanakh Deuteronomy 15:10
    ref: Deuteronomy 15:10
    book: Deut
    section: torah
    chapter: 15
    verse: 10
    ordinal: 5324
    text: Thou shalt surely give him, and thy heart shall not be grieved when thou givest unto him; because that for this thing the LORD thy God will bless thee in all thy work, and in all that thou puttest thy hand unto.
    translation: JPS 1917
    original: נָתוֹן תִּתֵּן לוֹ וְלֹא־יֵרַע לְבָבְךָ בְּתִתְּךָ לוֹ כִּי בִּגְלַל הַדָּבָר הַזֶּה יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ בְּכָל־מַעֲשֶׂךָ וּבְכֹל מִשְׁלַח יָדֶךָ׃
    hebrewPlain: נתון תתן לו ולא ירע לבבך בתתך לו כי בגלל הדבר הזה יברכך יהוה אלהיך בכל מעשך ובכל משלח ידך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:10
    kjvOsis:
    - Deut.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.11
    scripture: tanakh
    name: Tanakh Deuteronomy 15:11
    ref: Deuteronomy 15:11
    book: Deut
    section: torah
    chapter: 15
    verse: 11
    ordinal: 5325
    text: 'For the poor shall never cease out of the land; therefore I command thee, saying: ‘Thou shalt surely open thy hand unto thy poor and needy brother, in thy land.’'
    translation: JPS 1917
    original: כִּי לֹא־יֶחְדַּל אֶבְיוֹן מִקֶּרֶב הָאָרֶץ עַל־כֵּן אָנֹכִי מְצַוְּךָ לֵאמֹר פָּתֹחַ תִּפְתַּח אֶת־יָדְךָ לְאָחִיךָ לַעֲנִיֶּךָ וּלְאֶבְיֹנְךָ בְּאַרְצֶךָ׃
    hebrewPlain: כי לא יחדל אביון מקרב הארץ על כן אנכי מצוך לאמר פתח תפתח את ידך לאחיך לעניך ולאבינך בארצך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:11
    kjvOsis:
    - Deut.15.11
