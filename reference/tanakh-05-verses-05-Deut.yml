    ref: Deuteronomy 3:3
    book: Deut
    section: torah
    chapter: 3
    verse: 3
    ordinal: 4976
    text: So the LORD our God delivered into our hand Og also, the king of Bashan, and all his people; and we smote him until none was left to him remaining.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה אֱלֹהֵינוּ בְּיָדֵנוּ גַּם אֶת־עוֹג מֶלֶךְ־הַבָּשָׁן וְאֶת־כָּל־עַמּוֹ וַנַּכֵּהוּ עַד־בִּלְתִּי הִשְׁאִיר־לוֹ שָׂרִיד׃
    hebrewPlain: ויתן יהוה אלהינו בידנו גם את עוג מלך הבשן ואת כל עמו ונכהו עד בלתי השאיר לו שריד
    parashah: Devarim
