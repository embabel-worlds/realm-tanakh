  data:
    osis: Deut.5.25
    scripture: tanakh
    name: Tanakh Deuteronomy 5:25
    ref: Deuteronomy 5:25
    book: Deut
    section: torah
    chapter: 5
    verse: 25
    ordinal: 5076
    text: 'And the LORD heard the voice of your words, when ye spoke unto me; and the LORD said unto me: ‘I have heard the voice of the words of this people, which they have spoken unto thee; they have well said all that they have spoken.'
    translation: JPS 1917
    original: וַיִּשְׁמַע יְהוָה אֶת־קוֹל דִּבְרֵיכֶם בְּדַבֶּרְכֶם אֵלָי וַיֹּאמֶר יְהוָה אֵלַי שָׁמַעְתִּי אֶת־קוֹל דִּבְרֵי הָעָם הַזֶּה אֲשֶׁר דִּבְּרוּ אֵלֶיךָ הֵיטִיבוּ כָּל־אֲשֶׁר דִּבֵּרוּ׃
    hebrewPlain: וישמע יהוה את קול דבריכם בדברכם אלי ויאמר יהוה אלי שמעתי את קול דברי העם הזה אשר דברו אליך היטיבו כל אשר דברו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:28
    kjvOsis:
    - Deut.5.28
