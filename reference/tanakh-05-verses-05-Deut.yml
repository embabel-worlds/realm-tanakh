  data:
    osis: Deut.28.24
    scripture: tanakh
    name: Tanakh Deuteronomy 28:24
    ref: Deuteronomy 28:24
    book: Deut
    section: torah
    chapter: 28
    verse: 24
    ordinal: 5630
    text: The LORD will make the rain of thy land powder and dust; from heaven shall it come down upon thee, until thou be destroyed.
    translation: JPS 1917
    original: יִתֵּן יְהוָה אֶת־מְטַר אַרְצְךָ אָבָק וְעָפָר מִן־הַשָּׁמַיִם יֵרֵד עָלֶיךָ עַד הִשָּׁמְדָךְ׃
    hebrewPlain: יתן יהוה את מטר ארצך אבק ועפר מן השמים ירד עליך עד השמדך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:24
    kjvOsis:
    - Deut.28.24
