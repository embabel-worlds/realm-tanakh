  data:
    osis: Deut.13.2
    scripture: tanakh
    name: Tanakh Deuteronomy 13:2
    ref: Deuteronomy 13:2
    book: Deut
    section: torah
    chapter: 13
    verse: 2
    ordinal: 5268
    text: If there arise in the midst of thee a prophet, or a dreamer of dreams—and he give thee a sign or a wonder,
    translation: JPS 1917
    original: כִּי־יָקוּם בְּקִרְבְּךָ נָבִיא אוֹ חֹלֵם חֲלוֹם וְנָתַן אֵלֶיךָ אוֹת אוֹ מוֹפֵת׃
    hebrewPlain: כי יקום בקרבך נביא או חלם חלום ונתן אליך אות או מופת
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:1
    kjvOsis:
    - Deut.13.1
