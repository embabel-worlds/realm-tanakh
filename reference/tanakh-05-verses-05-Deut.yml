  data:
    osis: Deut.28.27
    scripture: tanakh
    name: Tanakh Deuteronomy 28:27
    ref: Deuteronomy 28:27
    book: Deut
    section: torah
    chapter: 28
    verse: 27
    ordinal: 5633
    text: The LORD will smite thee with the boil of Egypt, and with the emerods, and with the scab, and with the itch, whereof thou canst not be healed.
    translation: JPS 1917
    original: יַכְּכָה יְהוָה בִּשְׁחִין מִצְרַיִם ובעפלים [וּבַטְּחֹרִים] וּבַגָּרָב וּבֶחָרֶס אֲשֶׁר לֹא־תוּכַל לְהֵרָפֵא׃
    hebrewPlain: יככה יהוה בשחין מצרים ובעפלים [ובטחרים] ובגרב ובחרס אשר לא תוכל להרפא
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:27
    kjvOsis:
    - Deut.28.27
  relations:
