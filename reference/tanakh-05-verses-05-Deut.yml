  data:
    osis: Deut.17.4
    scripture: tanakh
    name: Tanakh Deuteronomy 17:4
    ref: Deuteronomy 17:4
    book: Deut
    section: torah
    chapter: 17
    verse: 4
    ordinal: 5363
    text: and it be told thee, and thou hear it, then shalt thou inquire diligently, and, behold, if it be true, and the thing certain, that such abomination is wrought in Israel;
    translation: JPS 1917
    original: וְהֻגַּד־לְךָ וְשָׁמָעְתָּ וְדָרַשְׁתָּ הֵיטֵב וְהִנֵּה אֱמֶת נָכוֹן הַדָּבָר נֶעֶשְׂתָה הַתּוֹעֵבָה הַזֹּאת בְּיִשְׂרָאֵל׃
    hebrewPlain: והגד לך ושמעת ודרשת היטב והנה אמת נכון הדבר נעשתה התועבה הזאת בישראל
    parashah: Shoftim
    kjvRefs:
