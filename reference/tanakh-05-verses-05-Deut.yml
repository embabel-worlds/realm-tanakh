  data:
    osis: Deut.31.14
    scripture: tanakh
    name: Tanakh Deuteronomy 31:14
    ref: Deuteronomy 31:14
    book: Deut
    section: torah
    chapter: 31
    verse: 14
    ordinal: 5737
    text: 'And the LORD said unto Moses: ‘Behold, thy days approach that thou must die; call Joshua, and present yourselves in the tent of meeting, that I may give him a charge.’ And Moses and Joshua went, and presented themselves in the tent of meeting.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־מֹשֶׁה הֵן קָרְבוּ יָמֶיךָ לָמוּת קְרָא אֶת־יְהוֹשֻׁעַ וְהִתְיַצְּבוּ בְּאֹהֶל מוֹעֵד וַאֲצַוֶּנּוּ וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ וַיִּתְיַצְּבוּ בְּאֹהֶל מוֹעֵד׃
    hebrewPlain: ויאמר יהוה אל משה הן קרבו ימיך למות קרא את יהושע והתיצבו באהל מועד ואצונו וילך משה ויהושע ויתיצבו באהל מועד
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:14
    kjvOsis:
    - Deut.31.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
