  data:
    osis: Deut.24.1
    scripture: tanakh
    name: Tanakh Deuteronomy 24:1
    ref: Deuteronomy 24:1
    book: Deut
    section: torah
    chapter: 24
    verse: 1
    ordinal: 5521
    text: When a man taketh a wife, and marrieth her, then it cometh to pass, if she find no favour in his eyes, because he hath found some unseemly thing in her, that he writeth her a bill of divorcement, and giveth it in her hand, and sendeth her out of his house,
    translation: JPS 1917
    original: כִּי־יִקַּח אִישׁ אִשָּׁה וּבְעָלָהּ וְהָיָה אִם־לֹא תִמְצָא־חֵן בְּעֵינָיו כִּי־מָצָא בָהּ עֶרְוַת דָּבָר וְכָתַב לָהּ סֵפֶר כְּרִיתֻת וְנָתַן בְּיָדָהּ וְשִׁלְּחָהּ מִבֵּיתוֹ׃
    hebrewPlain: כי יקח איש אשה ובעלה והיה אם לא תמצא חן בעיניו כי מצא בה ערות דבר וכתב לה ספר כריתת ונתן בידה ושלחה מביתו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 24:1
    kjvOsis:
    - Deut.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
