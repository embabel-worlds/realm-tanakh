  data:
    osis: Deut.1.22
    scripture: tanakh
    name: Tanakh Deuteronomy 1:22
    ref: Deuteronomy 1:22
    book: Deut
    section: torah
    chapter: 1
    verse: 22
    ordinal: 4912
    text: 'And ye came near unto me every one of you, and said: ‘Let us send men before us, that they may search the land for us, and bring us back word of the way by which we must go up, and the cities unto which we shall come.’'
    translation: JPS 1917
    original: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם וַתֹּאמְרוּ נִשְׁלְחָה אֲנָשִׁים לְפָנֵינוּ וְיַחְפְּרוּ־לָנוּ אֶת־הָאָרֶץ וְיָשִׁבוּ אֹתָנוּ דָּבָר אֶת־הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה־בָּהּ וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן׃
    hebrewPlain: ותקרבון אלי כלכם ותאמרו נשלחה אנשים לפנינו ויחפרו לנו את הארץ וישבו אתנו דבר את הדרך אשר נעלה בה ואת הערים אשר נבא אליהן
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:22
    kjvOsis:
    - Deut.1.22
