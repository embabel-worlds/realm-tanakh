  data:
    osis: Deut.11.32
    scripture: tanakh
    name: Tanakh Deuteronomy 11:32
    ref: Deuteronomy 11:32
    book: Deut
    section: torah
    chapter: 11
    verse: 32
    ordinal: 5235
    text: And ye shall observe to do all the statutes and the ordinances which I set before you this day.
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם לַעֲשׂוֹת אֵת כָּל־הַחֻקִּים וְאֶת־הַמִּשְׁפָּטִים אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם הַיּוֹם׃
    hebrewPlain: ושמרתם לעשות את כל החקים ואת המשפטים אשר אנכי נתן לפניכם היום
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 11:32
    kjvOsis:
    - Deut.11.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.1
    scripture: tanakh
    name: Tanakh Deuteronomy 12:1
    ref: Deuteronomy 12:1
    book: Deut
    section: torah
    chapter: 12
    verse: 1
    ordinal: 5236
    text: These are the statutes and the ordinances, which ye shall observe to do in the land which the LORD, the God of thy fathers, hath given thee to possess it, all the days that ye live upon the earth.
    translation: JPS 1917
    original: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת בָּאָרֶץ אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי אֲבֹתֶיךָ לְךָ לְרִשְׁתָּהּ כָּל־הַיָּמִים אֲשֶׁר־אַתֶּם חַיִּים עַל־הָאֲדָמָה׃
    hebrewPlain: אלה החקים והמשפטים אשר תשמרון לעשות בארץ אשר נתן יהוה אלהי אבתיך לך לרשתה כל הימים אשר אתם חיים על האדמה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:1
    kjvOsis:
    - Deut.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.2
    scripture: tanakh
    name: Tanakh Deuteronomy 12:2
    ref: Deuteronomy 12:2
    book: Deut
    section: torah
    chapter: 12
    verse: 2
    ordinal: 5237
    text: Ye shall surely destroy all the places, wherein the nations that ye are to dispossess served their gods, upon the high mountains, and upon the hills, and under every leafy tree.
    translation: JPS 1917
    original: אַבֵּד תְּאַבְּדוּן אֶת־כָּל־הַמְּקֹמוֹת אֲשֶׁר עָבְדוּ־שָׁם הַגּוֹיִם אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם אֶת־אֱלֹהֵיהֶם עַל־הֶהָרִים הָרָמִים וְעַל־הַגְּבָעוֹת וְתַחַת כָּל־עֵץ רַעֲנָן׃
    hebrewPlain: אבד תאבדון את כל המקמות אשר עבדו שם הגוים אשר אתם ירשים אתם את אלהיהם על ההרים הרמים ועל הגבעות ותחת כל עץ רענן
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:2
    kjvOsis:
    - Deut.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.3
    scripture: tanakh
    name: Tanakh Deuteronomy 12:3
    ref: Deuteronomy 12:3
    book: Deut
    section: torah
    chapter: 12
    verse: 3
    ordinal: 5238
    text: And ye shall break down their altars, and dash in pieces their pillars, and burn their Asherim with fire; and ye shall hew down the graven images of their gods; and ye shall destroy their name out of that place.
    translation: JPS 1917
    original: וְנִתַּצְתֶּם אֶת־מִזְבּחֹתָם וְשִׁבַּרְתֶּם אֶת־מַצֵּבֹתָם וַאֲשֵׁרֵיהֶם תִּשְׂרְפוּן בָּאֵשׁ וּפְסִילֵי אֱלֹהֵיהֶם תְּגַדֵּעוּן וְאִבַּדְתֶּם אֶת־שְׁמָם מִן־הַמָּקוֹם הַהוּא׃
    hebrewPlain: ונתצתם את מזבחתם ושברתם את מצבתם ואשריהם תשרפון באש ופסילי אלהיהם תגדעון ואבדתם את שמם מן המקום ההוא
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:3
    kjvOsis:
    - Deut.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.4
    scripture: tanakh
    name: Tanakh Deuteronomy 12:4
    ref: Deuteronomy 12:4
    book: Deut
    section: torah
    chapter: 12
    verse: 4
    ordinal: 5239
    text: Ye shall not do so unto the LORD your God.
    translation: JPS 1917
    original: לֹא־תַעֲשׂוּן כֵּן לַיהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: לא תעשון כן ליהוה אלהיכם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:4
    kjvOsis:
    - Deut.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.5
    scripture: tanakh
    name: Tanakh Deuteronomy 12:5
    ref: Deuteronomy 12:5
    book: Deut
    section: torah
    chapter: 12
    verse: 5
    ordinal: 5240
    text: But unto the place which the LORD your God shall choose out of all your tribes to put His name there, even unto His habitation shall ye seek, and thither thou shalt come;
    translation: JPS 1917
    original: כִּי אִם־אֶל־הַמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה אֱלֹהֵיכֶם מִכָּל־שִׁבְטֵיכֶם לָשׂוּם אֶת־שְׁמוֹ שָׁם לְשִׁכְנוֹ תִדְרְשׁוּ וּבָאתָ שָׁמָּה׃
    hebrewPlain: כי אם אל המקום אשר יבחר יהוה אלהיכם מכל שבטיכם לשום את שמו שם לשכנו תדרשו ובאת שמה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:5
    kjvOsis:
    - Deut.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.6
    scripture: tanakh
    name: Tanakh Deuteronomy 12:6
    ref: Deuteronomy 12:6
    book: Deut
    section: torah
    chapter: 12
    verse: 6
    ordinal: 5241
    text: and thither ye shall bring your burnt-offerings, and your sacrifices, and your tithes, and the offering of your hand, and your vows, and your freewill-offerings, and the firstlings of your herd and of your flock;
    translation: JPS 1917
    original: וַהֲבֵאתֶם שָׁמָּה עֹלֹתֵיכֶם וְזִבְחֵיכֶם וְאֵת מַעְשְׂרֹתֵיכֶם וְאֵת תְּרוּמַת יֶדְכֶם וְנִדְרֵיכֶם וְנִדְבֹתֵיכֶם וּבְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם׃
    hebrewPlain: והבאתם שמה עלתיכם וזבחיכם ואת מעשרתיכם ואת תרומת ידכם ונדריכם ונדבתיכם ובכרת בקרכם וצאנכם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:6
    kjvOsis:
    - Deut.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.7
    scripture: tanakh
    name: Tanakh Deuteronomy 12:7
    ref: Deuteronomy 12:7
    book: Deut
    section: torah
    chapter: 12
    verse: 7
    ordinal: 5242
    text: and there ye shall eat before the LORD your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the LORD thy God hath blessed thee.
    translation: JPS 1917
    original: וַאֲכַלְתֶּם־שָׁם לִפְנֵי יְהוָה אֱלֹהֵיכֶם וּשְׂמַחְתֶּם בְּכֹל מִשְׁלַח יֶדְכֶם אַתֶּם וּבָתֵּיכֶם אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ואכלתם שם לפני יהוה אלהיכם ושמחתם בכל משלח ידכם אתם ובתיכם אשר ברכך יהוה אלהיך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:7
    kjvOsis:
    - Deut.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.8
    scripture: tanakh
    name: Tanakh Deuteronomy 12:8
    ref: Deuteronomy 12:8
    book: Deut
    section: torah
    chapter: 12
    verse: 8
    ordinal: 5243
    text: Ye shall not do after all that we do here this day, every man whatsoever is right in his own eyes;
    translation: JPS 1917
    original: לֹא תַעֲשׂוּן כְּכֹל אֲשֶׁר אֲנַחְנוּ עֹשִׂים פֹּה הַיּוֹם אִישׁ כָּל־הַיָּשָׁר בְּעֵינָיו׃
    hebrewPlain: לא תעשון ככל אשר אנחנו עשים פה היום איש כל הישר בעיניו
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:8
    kjvOsis:
    - Deut.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.9
    scripture: tanakh
    name: Tanakh Deuteronomy 12:9
    ref: Deuteronomy 12:9
    book: Deut
    section: torah
    chapter: 12
    verse: 9
    ordinal: 5244
    text: for ye are not as yet come to the rest and to the inheritance, which the LORD your God giveth thee.
    translation: JPS 1917
    original: כִּי לֹא־בָּאתֶם עַד־עָתָּה אֶל־הַמְּנוּחָה וְאֶל־הַנַּחֲלָה אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ׃
    hebrewPlain: כי לא באתם עד עתה אל המנוחה ואל הנחלה אשר יהוה אלהיך נתן לך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:9
    kjvOsis:
    - Deut.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.12.10
    scripture: tanakh
    name: Tanakh Deuteronomy 12:10
    ref: Deuteronomy 12:10
    book: Deut
    section: torah
    chapter: 12
    verse: 10
    ordinal: 5245
    text: But when ye go over the Jordan, and dwell in the land which the LORD your God causeth you to inherit, and He giveth you rest from all your enemies round about, so that ye dwell in safety;
    translation: JPS 1917
    original: וַעֲבַרְתֶּם אֶת־הַיַּרְדֵּן וִישַׁבְתֶּם בָּאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֵיכֶם מַנְחִיל אֶתְכֶם וְהֵנִיחַ לָכֶם מִכָּל־אֹיְבֵיכֶם מִסָּבִיב וִישַׁבְתֶּם־בֶּטַח׃
    hebrewPlain: ועברתם את הירדן וישבתם בארץ אשר יהוה אלהיכם מנחיל אתכם והניח לכם מכל איביכם מסביב וישבתם בטח
    parashah: Re'eh
    kjvRefs:
