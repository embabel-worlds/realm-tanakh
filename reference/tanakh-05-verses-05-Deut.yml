  data:
    osis: Deut.14.29
    scripture: tanakh
    name: Tanakh Deuteronomy 14:29
    ref: Deuteronomy 14:29
    book: Deut
    section: torah
    chapter: 14
    verse: 29
    ordinal: 5314
    text: And the Levite, because he hath no portion nor inheritance with thee, and the stranger, and the fatherless, and the widow, that are within thy gates, shall come, and shall eat and be satisfied; that the LORD thy God may bless thee in all the work of thy hand which thou doest.
    translation: JPS 1917
    original: וּבָא הַלֵּוִי כִּי אֵין־לוֹ חֵלֶק וְנַחֲלָה עִמָּךְ וְהַגֵּר וְהַיָּתוֹם וְהָאַלְמָנָה אֲשֶׁר בִּשְׁעָרֶיךָ וְאָכְלוּ וְשָׂבֵעוּ לְמַעַן יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ בְּכָל־מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה׃
    hebrewPlain: ובא הלוי כי אין לו חלק ונחלה עמך והגר והיתום והאלמנה אשר בשעריך ואכלו ושבעו למען יברכך יהוה אלהיך בכל מעשה ידך אשר תעשה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 14:29
    kjvOsis:
    - Deut.14.29
