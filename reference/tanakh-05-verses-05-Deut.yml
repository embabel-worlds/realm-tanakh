  data:
    osis: Deut.28.8
    scripture: tanakh
    name: Tanakh Deuteronomy 28:8
    ref: Deuteronomy 28:8
    book: Deut
    section: torah
    chapter: 28
    verse: 8
    ordinal: 5614
    text: The LORD will command the blessing with thee in thy barns, and in all that thou puttest thy hand unto; and He will bless thee in the land which the LORD thy God giveth thee.
    translation: JPS 1917
    original: יְצַו יְהוָה אִתְּךָ אֶת־הַבְּרָכָה בַּאֲסָמֶיךָ וּבְכֹל מִשְׁלַח יָדֶךָ וּבֵרַכְךָ בָּאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ׃
    hebrewPlain: יצו יהוה אתך את הברכה באסמיך ובכל משלח ידך וברכך בארץ אשר יהוה אלהיך נתן לך
    parashah: Ki Tavo
    kjvRefs:
