    translation: JPS 1917
    original: וְאֶת־כָּל־שְׁלָלָהּ תִּקְבֹּץ אֶל־תּוֹךְ רְחֹבָהּ וְשָׂרַפְתָּ בָאֵשׁ אֶת־הָעִיר וְאֶת־כָּל־שְׁלָלָהּ כָּלִיל לַיהוָה אֱלֹהֶיךָ וְהָיְתָה תֵּל עוֹלָם לֹא תִבָּנֶה עוֹד׃
