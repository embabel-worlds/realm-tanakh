  data:
    osis: Deut.30.3
    scripture: tanakh
    name: Tanakh Deuteronomy 30:3
    ref: Deuteronomy 30:3
    book: Deut
    section: torah
    chapter: 30
    verse: 3
    ordinal: 5706
    text: that then the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the peoples, whither the LORD thy God hath scattered thee.
    translation: JPS 1917
    original: וְשָׁב יְהוָה אֱלֹהֶיךָ אֶת־שְׁבוּתְךָ וְרִחֲמֶךָ וְשָׁב וְקִבֶּצְךָ מִכָּל־הָעַמִּים אֲשֶׁר הֱפִיצְךָ יְהוָה אֱלֹהֶיךָ שָׁמָּה׃
    hebrewPlain: ושב יהוה אלהיך את שבותך ורחמך ושב וקבצך מכל העמים אשר הפיצך יהוה אלהיך שמה
    parashah: Nitzavim
    kjvRefs:
