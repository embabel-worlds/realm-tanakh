    scripture: tanakh
    name: Tanakh Deuteronomy 20:4
    ref: Deuteronomy 20:4
    book: Deut
    section: torah
    chapter: 20
    verse: 4
    ordinal: 5426
    text: for the LORD your God is He that goeth with you, to fight for you against your enemies, to save you.’
    translation: JPS 1917
    original: כִּי יְהוָה אֱלֹהֵיכֶם הַהֹלֵךְ עִמָּכֶם לְהִלָּחֵם לָכֶם עִם־אֹיְבֵיכֶם לְהוֹשִׁיעַ אֶתְכֶם׃
    hebrewPlain: כי יהוה אלהיכם ההלך עמכם להלחם לכם עם איביכם להושיע אתכם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:4
    kjvOsis:
    - Deut.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.5
    scripture: tanakh
    name: Tanakh Deuteronomy 20:5
    ref: Deuteronomy 20:5
    book: Deut
    section: torah
    chapter: 20
    verse: 5
    ordinal: 5427
    text: 'And the officers shall speak unto the people, saying: ‘What man is there that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate it.'
    translation: JPS 1917
    original: וְדִבְּרוּ הַשֹּׁטְרִים אֶל־הָעָם לֵאמֹר מִי־הָאִישׁ אֲשֶׁר בָּנָה בַיִת־חָדָשׁ וְלֹא חֲנָכוֹ יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ פֶּן־יָמוּת בַּמִּלְחָמָה וְאִישׁ אַחֵר יַחְנְכֶנּוּ׃
    hebrewPlain: ודברו השטרים אל העם לאמר מי האיש אשר בנה בית חדש ולא חנכו ילך וישב לביתו פן ימות במלחמה ואיש אחר יחנכנו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:5
    kjvOsis:
    - Deut.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.6
    scripture: tanakh
    name: Tanakh Deuteronomy 20:6
    ref: Deuteronomy 20:6
    book: Deut
    section: torah
    chapter: 20
    verse: 6
    ordinal: 5428
    text: And what man is there that hath planted a vineyard, and hath not used the fruit thereof? let him go and return unto his house, lest he die in the battle, and another man use the fruit thereof.
    translation: JPS 1917
    original: וּמִי־הָאִישׁ אֲשֶׁר־נָטַע כֶּרֶם וְלֹא חִלְּלוֹ יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ פֶּן־יָמוּת בַּמִּלְחָמָה וְאִישׁ אַחֵר יְחַלְּלֶנּוּ׃
    hebrewPlain: ומי האיש אשר נטע כרם ולא חללו ילך וישב לביתו פן ימות במלחמה ואיש אחר יחללנו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:6
    kjvOsis:
    - Deut.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.7
    scripture: tanakh
    name: Tanakh Deuteronomy 20:7
    ref: Deuteronomy 20:7
    book: Deut
    section: torah
    chapter: 20
    verse: 7
    ordinal: 5429
    text: And what man is there that hath betrothed a wife, and hath not taken her? let him go and return unto his house, lest he die in the battle, and another man take her.’
    translation: JPS 1917
    original: וּמִי־הָאִישׁ אֲשֶׁר־אֵרַשׂ אִשָּׁה וְלֹא לְקָחָהּ יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ פֶּן־יָמוּת בַּמִּלְחָמָה וְאִישׁ אַחֵר יִקָּחֶנָּה׃
    hebrewPlain: ומי האיש אשר ארש אשה ולא לקחה ילך וישב לביתו פן ימות במלחמה ואיש אחר יקחנה
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:7
    kjvOsis:
    - Deut.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.8
    scripture: tanakh
    name: Tanakh Deuteronomy 20:8
    ref: Deuteronomy 20:8
    book: Deut
    section: torah
    chapter: 20
    verse: 8
    ordinal: 5430
    text: 'And the officers shall speak further unto the people, and they shall say: ‘What man is there that is fearful and faint-hearted? let him go and return unto his house, lest his brethren’s heart melt as his heart.’'
    translation: JPS 1917
    original: וְיָסְפוּ הַשֹּׁטְרִים לְדַבֵּר אֶל־הָעָם וְאָמְרוּ מִי־הָאִישׁ הַיָּרֵא וְרַךְ הַלֵּבָב יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ וְלֹא יִמַּס אֶת־לְבַב אֶחָיו כִּלְבָבוֹ׃
    hebrewPlain: ויספו השטרים לדבר אל העם ואמרו מי האיש הירא ורך הלבב ילך וישב לביתו ולא ימס את לבב אחיו כלבבו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:8
    kjvOsis:
    - Deut.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.20.9
    scripture: tanakh
    name: Tanakh Deuteronomy 20:9
    ref: Deuteronomy 20:9
    book: Deut
    section: torah
    chapter: 20
    verse: 9
    ordinal: 5431
    text: And it shall be, when the officers have made an end of speaking unto the people, that captains of hosts shall be appointed at the head of the people.
    translation: JPS 1917
    original: וְהָיָה כְּכַלֹּת הַשֹּׁטְרִים לְדַבֵּר אֶל־הָעָם וּפָקְדוּ שָׂרֵי צְבָאוֹת בְּרֹאשׁ הָעָם׃
    hebrewPlain: והיה ככלת השטרים לדבר אל העם ופקדו שרי צבאות בראש העם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:9
    kjvOsis:
    - Deut.20.9
