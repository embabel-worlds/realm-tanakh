  data:
    osis: Deut.21.22
    scripture: tanakh
    name: Tanakh Deuteronomy 21:22
    ref: Deuteronomy 21:22
    book: Deut
    section: torah
    chapter: 21
    verse: 22
    ordinal: 5464
    text: And if a man have committed a sin worthy of death, and he be put to death, and thou hang him on a tree;
    translation: JPS 1917
    original: וְכִי־יִהְיֶה בְאִישׁ חֵטְא מִשְׁפַּט־מָוֶת וְהוּמָת וְתָלִיתָ אֹתוֹ עַל־עֵץ׃
    hebrewPlain: וכי יהיה באיש חטא משפט מות והומת ותלית אתו על עץ
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:22
    kjvOsis:
    - Deut.21.22
  relations:
  - predicate: IN
    to:
