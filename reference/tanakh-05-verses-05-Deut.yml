  data:
    osis: Deut.24.15
    scripture: tanakh
    name: Tanakh Deuteronomy 24:15
    ref: Deuteronomy 24:15
    book: Deut
    section: torah
    chapter: 24
    verse: 15
    ordinal: 5535
    text: 'In the same day thou shalt give him his hire, neither shall the sun go down upon it; for he is poor, and setteth his heart upon it: lest he cry against thee unto the LORD and it be sin in thee.'
    translation: JPS 1917
    original: בְּיוֹמוֹ תִתֵּן שְׂכָרוֹ וְלֹא־תָבוֹא עָלָיו הַשֶּׁמֶשׁ כִּי עָנִי הוּא וְאֵלָיו הוּא נֹשֵׂא אֶת־נַפְשׁוֹ וְלֹא־יִקְרָא עָלֶיךָ אֶל־יְהוָה וְהָיָה בְךָ חֵטְא׃
    hebrewPlain: ביומו תתן שכרו ולא תבוא עליו השמש כי עני הוא ואליו הוא נשא את נפשו ולא יקרא עליך אל יהוה והיה בך חטא
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 24:15
    kjvOsis:
    - Deut.24.15
