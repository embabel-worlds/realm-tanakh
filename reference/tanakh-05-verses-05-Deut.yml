    text: 'then thou shalt say unto thy son: ‘We were Pharaoh’s bondmen in Egypt; and the LORD brought us out of Egypt with a mighty hand.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לְבִנְךָ עֲבָדִים הָיִינוּ לְפַרְעֹה בְּמִצְרָיִם וַיּוֹצִיאֵנוּ יְהוָה מִמִּצְרַיִם בְּיָד חֲזָקָה׃
    hebrewPlain: ואמרת לבנך עבדים היינו לפרעה במצרים ויוציאנו יהוה ממצרים ביד חזקה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:21
    kjvOsis:
