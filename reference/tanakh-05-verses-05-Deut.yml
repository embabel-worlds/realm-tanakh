    ref: Deuteronomy 28:2
    book: Deut
    section: torah
    chapter: 28
    verse: 2
    ordinal: 5608
    text: And all these blessings shall come upon thee, and overtake thee, if thou shalt hearken unto the voice of the LORD thy God.
