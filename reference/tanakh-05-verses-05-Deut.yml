    name: Tanakh Deuteronomy 9:15
    ref: Deuteronomy 9:15
    book: Deut
    section: torah
    chapter: 9
    verse: 15
    ordinal: 5167
    text: So I turned and came down from the mount, and the mount burned with fire; and the two tables of the covenant were in my two hands.
    translation: JPS 1917
    original: וָאֵפֶן וָאֵרֵד מִן־הָהָר וְהָהָר בֹּעֵר בָּאֵשׁ וּשְׁנֵי לֻחֹת הַבְּרִית עַל שְׁתֵּי יָדָי׃
    hebrewPlain: ואפן וארד מן ההר וההר בער באש ושני לחת הברית על שתי ידי
