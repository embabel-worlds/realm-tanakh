  data:
    osis: Deut.2.9
    scripture: tanakh
    name: Tanakh Deuteronomy 2:9
    ref: Deuteronomy 2:9
    book: Deut
    section: torah
    chapter: 2
    verse: 9
    ordinal: 4945
    text: 'And the LORD said unto me: ‘Be not at enmity with Moab, neither contend with them in battle; for I will not give thee of his land for a possession; because I have given Ar unto the children of Lot for a possession.—'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי אֶל־תָּצַר אֶת־מוֹאָב וְאַל־תִּתְגָּר בָּם מִלְחָמָה כִּי לֹא־אֶתֵּן לְךָ מֵאַרְצוֹ יְרֻשָּׁה כִּי לִבְנֵי־לוֹט נָתַתִּי אֶת־עָר יְרֻשָּׁה׃
    hebrewPlain: ויאמר יהוה אלי אל תצר את מואב ואל תתגר בם מלחמה כי לא אתן לך מארצו ירשה כי לבני לוט נתתי את ער ירשה
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 2:9
    kjvOsis:
    - Deut.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.2
  - predicate: IN_PORTION
