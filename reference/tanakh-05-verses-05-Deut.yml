- type: TanakhVerse
  data:
    osis: Deut.5.28
    scripture: tanakh
    name: Tanakh Deuteronomy 5:28
    ref: Deuteronomy 5:28
    book: Deut
    section: torah
    chapter: 5
    verse: 28
    ordinal: 5079
    text: But as for thee, stand thou here by Me, and I will speak unto thee all the commandment, and the statutes, and the ordinances, which thou shalt teach them, that they may do them in the land which I give them to possess it.’
    translation: JPS 1917
    original: וְאַתָּה פֹּה עֲמֹד עִמָּדִי וַאֲדַבְּרָה אֵלֶיךָ אֵת כָּל־הַמִּצְוָה וְהַחֻקִּים וְהַמִּשְׁפָּטִים אֲשֶׁר תְּלַמְּדֵם וְעָשׂוּ בָאָרֶץ אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם לְרִשְׁתָּהּ׃
    hebrewPlain: ואתה פה עמד עמדי ואדברה אליך את כל המצוה והחקים והמשפטים אשר תלמדם ועשו בארץ אשר אנכי נתן להם לרשתה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:31
    kjvOsis:
    - Deut.5.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.5
  - predicate: IN_PORTION
    to:
      type: Parashah
