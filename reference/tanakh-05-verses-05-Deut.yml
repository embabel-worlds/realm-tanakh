    ref: Deuteronomy 3:14
    book: Deut
    section: torah
    chapter: 3
    verse: 14
    ordinal: 4987
    text: Jair the son of Manasseh took all the region of Argob, unto the border of the Geshurites and the Maacathites, and called them, even Bashan, after his own name, Havvoth-jair, unto this day.—
    translation: JPS 1917
    original: יָאִיר בֶּן־מְנַשֶּׁה לָקַח אֶת־כָּל־חֶבֶל אַרְגֹּב עַד־גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי וַיִּקְרָא אֹתָם עַל־שְׁמוֹ אֶת־הַבָּשָׁן חַוֺּת יָאִיר עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: יאיר בן מנשה לקח את כל חבל ארגב עד גבול הגשורי והמעכתי ויקרא אתם על שמו את הבשן חות יאיר עד היום הזה
    parashah: Devarim
    kjvRefs:
