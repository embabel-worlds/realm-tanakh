  data:
    osis: Deut.30.4
    scripture: tanakh
    name: Tanakh Deuteronomy 30:4
    ref: Deuteronomy 30:4
    book: Deut
    section: torah
    chapter: 30
    verse: 4
    ordinal: 5707
    text: If any of thine that are dispersed be in the uttermost parts of heaven, from thence will the LORD thy God gather thee, and from thence will He fetch thee.
    translation: JPS 1917
    original: אִם־יִהְיֶה נִדַּחֲךָ בִּקְצֵה הַשָּׁמָיִם מִשָּׁם יְקַבֶּצְךָ יְהוָה אֱלֹהֶיךָ וּמִשָּׁם יִקָּחֶךָ׃
    hebrewPlain: אם יהיה נדחך בקצה השמים משם יקבצך יהוה אלהיך ומשם יקחך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:4
    kjvOsis:
    - Deut.30.4
