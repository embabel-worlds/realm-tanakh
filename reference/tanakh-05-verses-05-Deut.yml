  data:
    osis: Deut.16.11
    scripture: tanakh
    name: Tanakh Deuteronomy 16:11
    ref: Deuteronomy 16:11
    book: Deut
    section: torah
    chapter: 16
    verse: 11
    ordinal: 5348
    text: And thou shalt rejoice before the LORD thy God, thou, and thy son, and thy daughter, and thy man-servant, and thy maid-servant, and the Levite that is within they gates, and the stranger, and the fatherless, and the widow, that are in the midst of thee, in the place which the LORD thy God shall choose to cause His name to dwell there.
    translation: JPS 1917
    original: וְשָׂמַחְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ וְהַגֵּר וְהַיָּתוֹם וְהָאַלְמָנָה אֲשֶׁר בְּקִרְבֶּךָ בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ לְשַׁכֵּן שְׁמוֹ שָׁם׃
    hebrewPlain: ושמחת לפני יהוה אלהיך אתה ובנך ובתך ועבדך ואמתך והלוי אשר בשעריך והגר והיתום והאלמנה אשר בקרבך במקום אשר יבחר יהוה אלהיך לשכן שמו שם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:11
    kjvOsis:
    - Deut.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.16.12
    scripture: tanakh
    name: Tanakh Deuteronomy 16:12
    ref: Deuteronomy 16:12
    book: Deut
    section: torah
    chapter: 16
    verse: 12
    ordinal: 5349
    text: And thou shalt remember that thou wast a bondman in Egypt; and thou shalt observe and do these statutes.
    translation: JPS 1917
    original: וְזָכַרְתָּ כִּי־עֶבֶד הָיִיתָ בְּמִצְרָיִם וְשָׁמַרְתָּ וְעָשִׂיתָ אֶת־הַחֻקִּים הָאֵלֶּה׃
    hebrewPlain: וזכרת כי עבד היית במצרים ושמרת ועשית את החקים האלה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:12
    kjvOsis:
    - Deut.16.12
