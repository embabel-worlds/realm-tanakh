  data:
    osis: Deut.5.21
    scripture: tanakh
    name: Tanakh Deuteronomy 5:21
    ref: Deuteronomy 5:21
    book: Deut
    section: torah
    chapter: 5
    verse: 21
    ordinal: 5072
    text: 'and ye said: ‘Behold, the LORD our God hath shown us His glory and His greatness, and we have heard His voice out of the midst of the fire; we have seen this day that God doth speak with man, and he liveth.'
    translation: JPS 1917
    original: וַתֹּאמְרוּ הֵן הֶרְאָנוּ יְהוָה אֱלֹהֵינוּ אֶת־כְּבֹדוֹ וְאֶת־גָּדְלוֹ וְאֶת־קֹלוֹ שָׁמַעְנוּ מִתּוֹךְ הָאֵשׁ הַיּוֹם הַזֶּה רָאִינוּ כִּי־יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם וָחָי׃
    hebrewPlain: ותאמרו הן הראנו יהוה אלהינו את כבדו ואת גדלו ואת קלו שמענו מתוך האש היום הזה ראינו כי ידבר אלהים את האדם וחי
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:24
    kjvOsis:
    - Deut.5.24
