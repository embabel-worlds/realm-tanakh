      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.30
    scripture: tanakh
    name: Tanakh Deuteronomy 1:30
    ref: Deuteronomy 1:30
    book: Deut
    section: torah
    chapter: 1
    verse: 30
    ordinal: 4920
    text: The LORD your God who goeth before you, He shall fight for you, according to all that He did for you in Egypt before your eyes;
    translation: JPS 1917
    original: יְהוָה אֱלֹהֵיכֶם הַהֹלֵךְ לִפְנֵיכֶם הוּא יִלָּחֵם לָכֶם כְּכֹל אֲשֶׁר עָשָׂה אִתְּכֶם בְּמִצְרַיִם לְעֵינֵיכֶם׃
    hebrewPlain: יהוה אלהיכם ההלך לפניכם הוא ילחם לכם ככל אשר עשה אתכם במצרים לעיניכם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:30
    kjvOsis:
    - Deut.1.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.31
    scripture: tanakh
    name: Tanakh Deuteronomy 1:31
    ref: Deuteronomy 1:31
    book: Deut
    section: torah
    chapter: 1
    verse: 31
    ordinal: 4921
    text: and in the wilderness, where thou hast seen how that the LORD thy God bore thee, as a man doth bear his son, in all the way that ye went, until ye came unto this place.
    translation: JPS 1917
    original: וּבַמִּדְבָּר אֲשֶׁר רָאִיתָ אֲשֶׁר נְשָׂאֲךָ יְהוָה אֱלֹהֶיךָ כַּאֲשֶׁר יִשָׂא־אִישׁ אֶת־בְּנוֹ בְּכָל־הַדֶּרֶךְ אֲשֶׁר הֲלַכְתֶּם עַד־בֹּאֲכֶם עַד־הַמָּקוֹם הַזֶּה׃
    hebrewPlain: ובמדבר אשר ראית אשר נשאך יהוה אלהיך כאשר ישא איש את בנו בכל הדרך אשר הלכתם עד באכם עד המקום הזה
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:31
    kjvOsis:
    - Deut.1.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.32
    scripture: tanakh
    name: Tanakh Deuteronomy 1:32
    ref: Deuteronomy 1:32
    book: Deut
    section: torah
    chapter: 1
    verse: 32
    ordinal: 4922
    text: Yet in this thing ye do not believe the LORD your God,
    translation: JPS 1917
    original: וּבַדָּבָר הַזֶּה אֵינְכֶם מַאֲמִינִם בַּיהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ובדבר הזה אינכם מאמינם ביהוה אלהיכם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:32
    kjvOsis:
    - Deut.1.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.1
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: devarim
- type: TanakhVerse
  data:
    osis: Deut.1.33
    scripture: tanakh
    name: Tanakh Deuteronomy 1:33
    ref: Deuteronomy 1:33
    book: Deut
    section: torah
    chapter: 1
    verse: 33
    ordinal: 4923
    text: 'Who went before you in the way, to seek you out a place to pitch your tents in: in fire by night, to show you by what way ye should go, and in the cloud by day.’'
    translation: JPS 1917
    original: הַהֹלֵךְ לִפְנֵיכֶם בַּדֶּרֶךְ לָתוּר לָכֶם מָקוֹם לַחֲנֹתְכֶם בָּאֵשׁ לַיְלָה לַרְאֹתְכֶם בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ־בָהּ וּבֶעָנָן יוֹמָם׃
    hebrewPlain: ההלך לפניכם בדרך לתור לכם מקום לחנתכם באש לילה לראתכם בדרך אשר תלכו בה ובענן יומם
