  data:
    osis: Deut.17.8
    scripture: tanakh
    name: Tanakh Deuteronomy 17:8
    ref: Deuteronomy 17:8
    book: Deut
    section: torah
    chapter: 17
    verse: 8
    ordinal: 5367
    text: If there arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke, even matters of controversy within thy gates; then shalt thou arise, and get thee up unto the place which the LORD thy God shall choose.
    translation: JPS 1917
    original: כִּי יִפָּלֵא מִמְּךָ דָבָר לַמִּשְׁפָּט בֵּין־דָּם לְדָם בֵּין־דִּין לְדִין וּבֵין נֶגַע לָנֶגַע דִּבְרֵי רִיבֹת בִּשְׁעָרֶיךָ וְקַמְתָּ וְעָלִיתָ אֶל־הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ׃
    hebrewPlain: כי יפלא ממך דבר למשפט בין דם לדם בין דין לדין ובין נגע לנגע דברי ריבת בשעריך וקמת ועלית אל המקום אשר יבחר יהוה אלהיך בו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:8
    kjvOsis:
    - Deut.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.9
    scripture: tanakh
    name: Tanakh Deuteronomy 17:9
    ref: Deuteronomy 17:9
    book: Deut
    section: torah
    chapter: 17
    verse: 9
    ordinal: 5368
    text: And thou shall come unto the priests the Levites, and unto the judge that shall be in those days; and thou shalt inquire; and they shall declare unto thee the sentence of judgment.
    translation: JPS 1917
    original: וּבָאתָ אֶל־הַכֹּהֲנִים הַלְוִיִּם וְאֶל־הַשֹּׁפֵט אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם וְדָרַשְׁתָּ וְהִגִּידוּ לְךָ אֵת דְּבַר הַמִּשְׁפָּט׃
    hebrewPlain: ובאת אל הכהנים הלוים ואל השפט אשר יהיה בימים ההם ודרשת והגידו לך את דבר המשפט
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:9
    kjvOsis:
    - Deut.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.10
    scripture: tanakh
    name: Tanakh Deuteronomy 17:10
    ref: Deuteronomy 17:10
    book: Deut
    section: torah
    chapter: 17
    verse: 10
    ordinal: 5369
    text: And thou shalt do according to the tenor of the sentence, which they shall declare unto thee from that place which the LORD shall choose; and thou shalt observe to do according to all that they shall teach thee.
    translation: JPS 1917
    original: וְעָשִׂיתָ עַל־פִּי הַדָּבָר אֲשֶׁר יַגִּידוּ לְךָ מִן־הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה וְשָׁמַרְתָּ לַעֲשׂוֹת כְּכֹל אֲשֶׁר יוֹרוּךָ׃
    hebrewPlain: ועשית על פי הדבר אשר יגידו לך מן המקום ההוא אשר יבחר יהוה ושמרת לעשות ככל אשר יורוך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:10
    kjvOsis:
    - Deut.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.11
    scripture: tanakh
    name: Tanakh Deuteronomy 17:11
    ref: Deuteronomy 17:11
    book: Deut
    section: torah
    chapter: 17
    verse: 11
    ordinal: 5370
    text: According to the law which they shall teach thee, and according to the judgment which they shall tell thee, thou shalt do; thou shalt not turn aside from the sentence which they shall declare unto thee, to the right hand, nor to the left.
    translation: JPS 1917
    original: עַל־פִּי הַתּוֹרָה אֲשֶׁר יוֹרוּךָ וְעַל־הַמִּשְׁפָּט אֲשֶׁר־יֹאמְרוּ לְךָ תַּעֲשֶׂה לֹא תָסוּר מִן־הַדָּבָר אֲשֶׁר־יַגִּידוּ לְךָ יָמִין וּשְׂמֹאל׃
    hebrewPlain: על פי התורה אשר יורוך ועל המשפט אשר יאמרו לך תעשה לא תסור מן הדבר אשר יגידו לך ימין ושמאל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:11
    kjvOsis:
    - Deut.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.12
    scripture: tanakh
    name: Tanakh Deuteronomy 17:12
    ref: Deuteronomy 17:12
    book: Deut
    section: torah
    chapter: 17
    verse: 12
    ordinal: 5371
    text: And the man that doeth presumptuously, in not hearkening unto the priest that standeth to minister there before the LORD thy God, or unto the judge, even that man shall die; and thou shalt exterminate the evil from Israel.
    translation: JPS 1917
    original: וְהָאִישׁ אֲשֶׁר־יַעֲשֶׂה בְזָדוֹן לְבִלְתִּי שְׁמֹעַ אֶל־הַכֹּהֵן הָעֹמֵד לְשָׁרֶת שָׁם אֶת־יְהוָה אֱלֹהֶיךָ אוֹ אֶל־הַשֹּׁפֵט וּמֵת הָאִישׁ הַהוּא וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל׃
    hebrewPlain: והאיש אשר יעשה בזדון לבלתי שמע אל הכהן העמד לשרת שם את יהוה אלהיך או אל השפט ומת האיש ההוא ובערת הרע מישראל
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:12
    kjvOsis:
    - Deut.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.13
    scripture: tanakh
    name: Tanakh Deuteronomy 17:13
    ref: Deuteronomy 17:13
    book: Deut
    section: torah
    chapter: 17
    verse: 13
    ordinal: 5372
    text: And all the people shall hear, and fear, and do no more presumptuously.
    translation: JPS 1917
    original: וְכָל־הָעָם יִשְׁמְעוּ וְיִרָאוּ וְלֹא יְזִידוּן עוֹד׃
    hebrewPlain: וכל העם ישמעו ויראו ולא יזידון עוד
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:13
    kjvOsis:
    - Deut.17.13
