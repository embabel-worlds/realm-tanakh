  data:
    osis: Deut.25.7
    scripture: tanakh
    name: Tanakh Deuteronomy 25:7
    ref: Deuteronomy 25:7
    book: Deut
    section: torah
    chapter: 25
    verse: 7
    ordinal: 5549
    text: 'And if the man like not to take his brother’s wife, then his brother’s wife shall go up to the gate unto the elders, and say: ‘My husband’s brother refuseth to raise up unto his brother a name in Israel; he will not perform the duty of a husband’s brother unto me.’'
    translation: JPS 1917
    original: וְאִם־לֹא יַחְפֹּץ הָאִישׁ לָקַחַת אֶת־יְבִמְתּוֹ וְעָלְתָה יְבִמְתּוֹ הַשַּׁעְרָה אֶל־הַזְּקֵנִים וְאָמְרָה מֵאֵין יְבָמִי לְהָקִים לְאָחִיו שֵׁם בְּיִשְׂרָאֵל לֹא אָבָה יַבְּמִי׃
    hebrewPlain: ואם לא יחפץ האיש לקחת את יבמתו ועלתה יבמתו השערה אל הזקנים ואמרה מאין יבמי להקים לאחיו שם בישראל לא אבה יבמי
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:7
    kjvOsis:
    - Deut.25.7
