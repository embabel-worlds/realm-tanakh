  data:
    osis: Deut.23.25
    scripture: tanakh
    name: Tanakh Deuteronomy 23:25
    ref: Deuteronomy 23:25
    book: Deut
    section: torah
    chapter: 23
    verse: 25
    ordinal: 5519
    text: When thou comest into thy neighbour’s vineyard, then thou mayest eat grapes until thou have enough at thine own pleasure; but thou shalt not put any in thy vessel.
    translation: JPS 1917
    original: כִּי תָבֹא בְּכֶרֶם רֵעֶךָ וְאָכַלְתָּ עֲנָבִים כְּנַפְשְׁךָ שָׂבְעֶךָ וְאֶל־כֶּלְיְךָ לֹא תִתֵּן׃
    hebrewPlain: כי תבא בכרם רעך ואכלת ענבים כנפשך שבעך ואל כליך לא תתן
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:24
    kjvOsis:
    - Deut.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
