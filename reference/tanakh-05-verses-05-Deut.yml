    ref: Deuteronomy 11:6
    book: Deut
    section: torah
    chapter: 11
    verse: 6
    ordinal: 5209
    text: and what He did unto Dathan and Abiram, the sons of Eliab, the son of Reuben; how the earth opened her mouth, and swallowed them up, and their households, and their tents, and every living substance that followed them, in the midst of all Israel;
    translation: JPS 1917
    original: וַאֲשֶׁר עָשָׂה לְדָתָן וְלַאֲבִירָם בְּנֵי אֱלִיאָב בֶּן־רְאוּבֵן אֲשֶׁר פָּצְתָה הָאָרֶץ אֶת־פִּיהָ וַתִּבְלָעֵם וְאֶת־בָּתֵּיהֶם וְאֶת־אָהֳלֵיהֶם וְאֵת כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם בְּקֶרֶב כָּל־יִשְׂרָאֵל׃
    hebrewPlain: ואשר עשה לדתן ולאבירם בני אליאב בן ראובן אשר פצתה הארץ את פיה ותבלעם ואת בתיהם ואת אהליהם ואת כל היקום אשר ברגליהם בקרב כל ישראל
