- type: TanakhVerse
  data:
    osis: Deut.28.12
    scripture: tanakh
    name: Tanakh Deuteronomy 28:12
    ref: Deuteronomy 28:12
    book: Deut
    section: torah
    chapter: 28
    verse: 12
    ordinal: 5618
    text: The LORD will open unto thee His good treasure the heaven to give the rain of thy land in its season, and to bless all the work of thy hand; and thou shalt lend unto many nations, but thou shalt not borrow.
    translation: JPS 1917
    original: יִפְתַּח יְהוָה לְךָ אֶת־אוֹצָרוֹ הַטּוֹב אֶת־הַשָּׁמַיִם לָתֵת מְטַר־אַרְצְךָ בְּעִתּוֹ וּלְבָרֵךְ אֵת כָּל־מַעֲשֵׂה יָדֶךָ וְהִלְוִיתָ גּוֹיִם רַבִּים וְאַתָּה לֹא תִלְוֶה׃
    hebrewPlain: יפתח יהוה לך את אוצרו הטוב את השמים לתת מטר ארצך בעתו ולברך את כל מעשה ידך והלוית גוים רבים ואתה לא תלוה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:12
    kjvOsis:
    - Deut.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.13
    scripture: tanakh
    name: Tanakh Deuteronomy 28:13
    ref: Deuteronomy 28:13
    book: Deut
    section: torah
    chapter: 28
    verse: 13
    ordinal: 5619
    text: And the LORD will make thee the head, and not the tail; and thou shalt be above only, and thou shalt not be beneath; if thou shalt hearken unto the commandments of the LORD thy God, which I command thee this day, to observe and to do them;
    translation: JPS 1917
    original: וּנְתָנְךָ יְהוָה לְרֹאשׁ וְלֹא לְזָנָב וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה כִּי־תִשְׁמַע אֶל־מִצְוֺת יְהוָה אֱלֹהֶיךָ אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לִשְׁמֹר וְלַעֲשׂוֹת׃
    hebrewPlain: ונתנך יהוה לראש ולא לזנב והיית רק למעלה ולא תהיה למטה כי תשמע אל מצות יהוה אלהיך אשר אנכי מצוך היום לשמר ולעשות
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:13
    kjvOsis:
    - Deut.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.14
    scripture: tanakh
    name: Tanakh Deuteronomy 28:14
    ref: Deuteronomy 28:14
    book: Deut
    section: torah
    chapter: 28
    verse: 14
    ordinal: 5620
    text: and shalt not turn aside from any of the words which I command you this day, to the right hand, or to the left, to go after other gods to serve them. .
    translation: JPS 1917
    original: וְלֹא תָסוּר מִכָּל־הַדְּבָרִים אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם יָמִין וּשְׂמֹאול לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם׃
    hebrewPlain: ולא תסור מכל הדברים אשר אנכי מצוה אתכם היום ימין ושמאול ללכת אחרי אלהים אחרים לעבדם
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:14
    kjvOsis:
    - Deut.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.15
    scripture: tanakh
    name: Tanakh Deuteronomy 28:15
    ref: Deuteronomy 28:15
    book: Deut
    section: torah
    chapter: 28
    verse: 15
    ordinal: 5621
    text: But it shall come to pass, if thou wilt not hearken unto the voice of the LORD thy God, to observe to do all His commandments and His statutes which I command thee this day; that all these curses shall come upon thee, and overtake thee.
    translation: JPS 1917
    original: וְהָיָה אִם־לֹא תִשְׁמַע בְּקוֹל יְהוָה אֱלֹהֶיךָ לִשְׁמֹר לַעֲשׂוֹת אֶת־כָּל־מִצְוֺתָיו וְחֻקֹּתָיו אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם וּבָאוּ עָלֶיךָ כָּל־הַקְּלָלוֹת הָאֵלֶּה וְהִשִּׂיגוּךָ׃
    hebrewPlain: והיה אם לא תשמע בקול יהוה אלהיך לשמר לעשות את כל מצותיו וחקתיו אשר אנכי מצוך היום ובאו עליך כל הקללות האלה והשיגוך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:15
    kjvOsis:
    - Deut.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
