- type: TanakhVerse
  data:
    osis: Deut.23.1
    scripture: tanakh
    name: Tanakh Deuteronomy 23:1
    ref: Deuteronomy 23:1
    book: Deut
    section: torah
    chapter: 23
    verse: 1
    ordinal: 5495
    text: A man shall not take his father’s wife, and shall not uncover his father’s skirt.
    translation: JPS 1917
    original: לֹא־יִקַּח אִישׁ אֶת־אֵשֶׁת אָבִיו וְלֹא יְגַלֶּה כְּנַף אָבִיו׃
    hebrewPlain: לא יקח איש את אשת אביו ולא יגלה כנף אביו
    parashah: Ki Teitzei
    kjvRefs:
