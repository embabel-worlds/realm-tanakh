  data:
    osis: Deut.8.19
    scripture: tanakh
    name: Tanakh Deuteronomy 8:19
    ref: Deuteronomy 8:19
    book: Deut
    section: torah
    chapter: 8
    verse: 19
    ordinal: 5151
    text: And it shall be, if thou shalt forget the LORD thy God, and walk after other gods, and serve them, and worship them, I forewarn you this day that ye shall surely perish.
    translation: JPS 1917
    original: וְהָיָה אִם־שָׁכֹחַ תִּשְׁכַּח אֶת־יְהוָה אֱלֹהֶיךָ וְהָלַכְתָּ אַחֲרֵי אֱלֹהִים אֲחֵרִים וַעֲבַדְתָּם וְהִשְׁתַּחֲוִיתָ לָהֶם הַעִדֹתִי בָכֶם הַיּוֹם כִּי אָבֹד תֹּאבֵדוּן׃
    hebrewPlain: והיה אם שכח תשכח את יהוה אלהיך והלכת אחרי אלהים אחרים ועבדתם והשתחוית להם העדתי בכם היום כי אבד תאבדון
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 8:19
    kjvOsis:
    - Deut.8.19
