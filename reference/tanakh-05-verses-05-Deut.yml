    section: torah
    chapter: 30
    verse: 17
    ordinal: 5720
    text: But if thy heart turn away, and thou wilt not hear, but shalt be drawn away, and worship other gods, and serve them;
    translation: JPS 1917
    original: וְאִם־יִפְנֶה לְבָבְךָ וְלֹא תִשְׁמָע וְנִדַּחְתָּ וְהִשְׁתַּחֲוִיתָ לֵאלֹהִים אֲחֵרִים וַעֲבַדְתָּם׃
    hebrewPlain: ואם יפנה לבבך ולא תשמע ונדחת והשתחוית לאלהים אחרים ועבדתם
    parashah: Nitzavim
    kjvRefs:
