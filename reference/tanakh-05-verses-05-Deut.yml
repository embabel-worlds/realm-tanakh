- type: TanakhVerse
  data:
    osis: Deut.15.14
    scripture: tanakh
    name: Tanakh Deuteronomy 15:14
    ref: Deuteronomy 15:14
    book: Deut
    section: torah
    chapter: 15
    verse: 14
    ordinal: 5328
    text: thou shalt furnish him liberally out of thy flock, and out of thy threshing-floor, and out of thy winepress; of that wherewith the LORD thy God hath blessed thee thou shalt give unto him.
    translation: JPS 1917
    original: הַעֲנֵיק תַּעֲנִיק לוֹ מִצֹּאנְךָ וּמִגָּרְנְךָ וּמִיִּקְבֶךָ אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ תִּתֶּן־לוֹ׃
    hebrewPlain: העניק תעניק לו מצאנך ומגרנך ומיקבך אשר ברכך יהוה אלהיך תתן לו
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:14
    kjvOsis:
    - Deut.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
