- type: TanakhVerse
  data:
    osis: Deut.28.52
    scripture: tanakh
    name: Tanakh Deuteronomy 28:52
    ref: Deuteronomy 28:52
    book: Deut
    section: torah
    chapter: 28
    verse: 52
    ordinal: 5658
    text: And he shall besiege thee in all thy gates, until thy high and fortified walls come down, wherein thou didst trust, throughout all thy land; and he shall besiege thee in all thy gates throughout all thy land, which the LORD thy God hath given thee.
    translation: JPS 1917
    original: וְהֵצַר לְךָ בְּכָל־שְׁעָרֶיךָ עַד רֶדֶת חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן בְּכָל־אַרְצֶךָ וְהֵצַר לְךָ בְּכָל־שְׁעָרֶיךָ בְּכָל־אַרְצְךָ אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ׃
    hebrewPlain: והצר לך בכל שעריך עד רדת חמתיך הגבהות והבצרות אשר אתה בטח בהן בכל ארצך והצר לך בכל שעריך בכל ארצך אשר נתן יהוה אלהיך לך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:52
    kjvOsis:
    - Deut.28.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
