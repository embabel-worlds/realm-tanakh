    translation: JPS 1917
    original: יַרְכִּבֵהוּ עַל־במותי [בָּמֳתֵי] אָרֶץ וַיֹּאכַל תְּנוּבֹת שָׂדָי וַיֵּנִקֵהוּ דְבַשׁ מִסֶּלַע וְשֶׁמֶן מֵחַלְמִישׁ צוּר׃
    hebrewPlain: ירכבהו על במותי [במתי] ארץ ויאכל תנובת שדי וינקהו דבש מסלע ושמן מחלמיש צור
    parashah: Ha'Azinu
