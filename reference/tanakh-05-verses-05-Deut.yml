    scripture: tanakh
    name: Tanakh Deuteronomy 12:21
    ref: Deuteronomy 12:21
    book: Deut
    section: torah
    chapter: 12
    verse: 21
    ordinal: 5256
    text: If the place which the LORD thy God shall choose to put His name there be too far from thee, then thou shalt kill of thy herd and of thy flock, which the LORD hath given thee, as I have commanded thee, and thou shalt eat within thy gates, after all the desire of thy soul.
    translation: JPS 1917
    original: כִּי־יִרְחַק מִמְּךָ הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ לָשׂוּם שְׁמוֹ שָׁם וְזָבַחְתָּ מִבְּקָרְךָ וּמִצֹּאנְךָ אֲשֶׁר נָתַן יְהוָה לְךָ כַּאֲשֶׁר צִוִּיתִךָ וְאָכַלְתָּ בִּשְׁעָרֶיךָ בְּכֹל אַוַּת נַפְשֶׁךָ׃
    hebrewPlain: כי ירחק ממך המקום אשר יבחר יהוה אלהיך לשום שמו שם וזבחת מבקרך ומצאנך אשר נתן יהוה לך כאשר צויתך ואכלת בשעריך בכל אות נפשך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:21
    kjvOsis:
    - Deut.12.21
