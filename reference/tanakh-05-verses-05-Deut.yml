- type: TanakhVerse
  data:
    osis: Deut.30.7
    scripture: tanakh
    name: Tanakh Deuteronomy 30:7
    ref: Deuteronomy 30:7
    book: Deut
    section: torah
    chapter: 30
    verse: 7
    ordinal: 5710
    text: And the LORD thy God will put all these curses upon thine enemies, and on them that hate thee, that persecuted thee.
    translation: JPS 1917
    original: וְנָתַן יְהוָה אֱלֹהֶיךָ אֵת כָּל־הָאָלוֹת הָאֵלֶּה עַל־אֹיְבֶיךָ וְעַל־שֹׂנְאֶיךָ אֲשֶׁר רְדָפוּךָ׃
    hebrewPlain: ונתן יהוה אלהיך את כל האלות האלה על איביך ועל שנאיך אשר רדפוך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:7
    kjvOsis:
    - Deut.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.8
    scripture: tanakh
    name: Tanakh Deuteronomy 30:8
    ref: Deuteronomy 30:8
    book: Deut
    section: torah
    chapter: 30
    verse: 8
    ordinal: 5711
    text: And thou shalt return and hearken to the voice of the LORD, and do all His commandments which I command thee this day.
    translation: JPS 1917
    original: וְאַתָּה תָשׁוּב וְשָׁמַעְתָּ בְּקוֹל יְהוָה וְעָשִׂיתָ אֶת־כָּל־מִצְוֺתָיו אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם׃
    hebrewPlain: ואתה תשוב ושמעת בקול יהוה ועשית את כל מצותיו אשר אנכי מצוך היום
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:8
    kjvOsis:
    - Deut.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.9
    scripture: tanakh
    name: Tanakh Deuteronomy 30:9
    ref: Deuteronomy 30:9
    book: Deut
    section: torah
    chapter: 30
    verse: 9
    ordinal: 5712
    text: And the LORD thy God will make thee over-abundant in all the work of thy hand, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, for good; for the LORD will again rejoice over thee for good, as He rejoiced over thy fathers;
    translation: JPS 1917
    original: וְהוֹתִירְךָ יְהוָה אֱלֹהֶיךָ בְּכֹל מַעֲשֵׂה יָדֶךָ בִּפְרִי בִטְנְךָ וּבִפְרִי בְהֶמְתְּךָ וּבִפְרִי אַדְמָתְךָ לְטוֹבָה כִּי יָשׁוּב יְהוָה לָשׂוּשׂ עָלֶיךָ לְטוֹב כַּאֲשֶׁר־שָׂשׂ עַל־אֲבֹתֶיךָ׃
    hebrewPlain: והותירך יהוה אלהיך בכל מעשה ידך בפרי בטנך ובפרי בהמתך ובפרי אדמתך לטובה כי ישוב יהוה לשוש עליך לטוב כאשר שש על אבתיך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:9
    kjvOsis:
    - Deut.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.10
    scripture: tanakh
    name: Tanakh Deuteronomy 30:10
    ref: Deuteronomy 30:10
    book: Deut
    section: torah
    chapter: 30
    verse: 10
    ordinal: 5713
    text: if thou shalt hearken to the voice of the LORD thy God, to keep His commandments and His statutes which are written in this book of the law; if thou turn unto the LORD thy God with all thy heart, and with all thy soul.
    translation: JPS 1917
    original: כִּי תִשְׁמַע בְּקוֹל יְהוָה אֱלֹהֶיךָ לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו הַכְּתוּבָה בְּסֵפֶר הַתּוֹרָה הַזֶּה כִּי תָשׁוּב אֶל־יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשֶׁךָ׃
    hebrewPlain: כי תשמע בקול יהוה אלהיך לשמר מצותיו וחקתיו הכתובה בספר התורה הזה כי תשוב אל יהוה אלהיך בכל לבבך ובכל נפשך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:10
    kjvOsis:
    - Deut.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.11
    scripture: tanakh
    name: Tanakh Deuteronomy 30:11
    ref: Deuteronomy 30:11
    book: Deut
    section: torah
    chapter: 30
    verse: 11
    ordinal: 5714
    text: For this commandment which I command thee this day, it is not too hard for thee, neither is it far off.
    translation: JPS 1917
    original: כִּי הַמִּצְוָה הַזֹּאת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לֹא־נִפְלֵאת הִוא מִמְּךָ וְלֹא רְחֹקָה הִוא׃
    hebrewPlain: כי המצוה הזאת אשר אנכי מצוך היום לא נפלאת הוא ממך ולא רחקה הוא
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:11
    kjvOsis:
    - Deut.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.12
    scripture: tanakh
    name: Tanakh Deuteronomy 30:12
    ref: Deuteronomy 30:12
    book: Deut
    section: torah
    chapter: 30
    verse: 12
    ordinal: 5715
    text: 'It is not in heaven, that thou shouldest say: ‘Who shall go up for us to heaven, and bring it unto us, and make us to hear it, that we may do it?’'
    translation: JPS 1917
    original: לֹא בַשָּׁמַיִם הִוא לֵאמֹר מִי יַעֲלֶה־לָּנוּ הַשָּׁמַיְמָה וְיִקָּחֶהָ לָּנוּ וְיַשְׁמִעֵנוּ אֹתָהּ וְנַעֲשֶׂנָּה׃
    hebrewPlain: לא בשמים הוא לאמר מי יעלה לנו השמימה ויקחה לנו וישמענו אתה ונעשנה
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:12
    kjvOsis:
    - Deut.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.13
    scripture: tanakh
    name: Tanakh Deuteronomy 30:13
    ref: Deuteronomy 30:13
    book: Deut
    section: torah
    chapter: 30
    verse: 13
    ordinal: 5716
    text: 'Neither is it beyond the sea, that thou shouldest say: ‘Who shall go over the sea for us, and bring it unto us, and make us to hear it, that we may do it?’'
    translation: JPS 1917
    original: וְלֹא־מֵעֵבֶר לַיָּם הִוא לֵאמֹר מִי יַעֲבָר־לָנוּ אֶל־עֵבֶר הַיָּם וְיִקָּחֶהָ לָּנוּ וְיַשְׁמִעֵנוּ אֹתָהּ וְנַעֲשֶׂנָּה׃
    hebrewPlain: ולא מעבר לים הוא לאמר מי יעבר לנו אל עבר הים ויקחה לנו וישמענו אתה ונעשנה
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:13
    kjvOsis:
    - Deut.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.14
    scripture: tanakh
    name: Tanakh Deuteronomy 30:14
    ref: Deuteronomy 30:14
    book: Deut
    section: torah
    chapter: 30
    verse: 14
    ordinal: 5717
    text: But the word is very nigh unto thee, in thy mouth, and in thy heart, that thou mayest do it.
    translation: JPS 1917
    original: כִּי־קָרוֹב אֵלֶיךָ הַדָּבָר מְאֹד בְּפִיךָ וּבִלְבָבְךָ לַעֲשֹׂתוֹ׃
    hebrewPlain: כי קרוב אליך הדבר מאד בפיך ובלבבך לעשתו
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:14
    kjvOsis:
    - Deut.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.15
    scripture: tanakh
    name: Tanakh Deuteronomy 30:15
    ref: Deuteronomy 30:15
    book: Deut
    section: torah
    chapter: 30
    verse: 15
    ordinal: 5718
    text: See, I have set before thee this day life and good, and death and evil,
    translation: JPS 1917
    original: רְאֵה נָתַתִּי לְפָנֶיךָ הַיּוֹם אֶת־הַחַיִּים וְאֶת־הַטּוֹב וְאֶת־הַמָּוֶת וְאֶת־הָרָע׃
    hebrewPlain: ראה נתתי לפניך היום את החיים ואת הטוב ואת המות ואת הרע
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:15
    kjvOsis:
    - Deut.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.16
    scripture: tanakh
    name: Tanakh Deuteronomy 30:16
    ref: Deuteronomy 30:16
    book: Deut
    section: torah
    chapter: 30
    verse: 16
    ordinal: 5719
    text: in that I command thee this day to love the LORD thy God, to walk in His ways, and to keep His commandments and His statutes and His ordinances; then thou shalt live and multiply, and the LORD thy God shall bless thee in the land whither thou goest in to possess it.
    translation: JPS 1917
    original: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ לָלֶכֶת בִּדְרָכָיו וְלִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ בָּאָרֶץ אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: אשר אנכי מצוך היום לאהבה את יהוה אלהיך ללכת בדרכיו ולשמר מצותיו וחקתיו ומשפטיו וחיית ורבית וברכך יהוה אלהיך בארץ אשר אתה בא שמה לרשתה
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:16
    kjvOsis:
    - Deut.30.16
  relations:
  - predicate: IN
