  data:
    osis: Deut.14.28
    scripture: tanakh
    name: Tanakh Deuteronomy 14:28
    ref: Deuteronomy 14:28
    book: Deut
    section: torah
    chapter: 14
    verse: 28
    ordinal: 5313
    text: At the end of every three years, even in the same year, thou shalt bring forth all the tithe of thine increase, and shall lay it up within thy gates.
    translation: JPS 1917
    original: מִקְצֵה שָׁלֹשׁ שָׁנִים תּוֹצִיא אֶת־כָּל־מַעְשַׂר תְּבוּאָתְךָ בַּשָּׁנָה הַהִוא וְהִנַּחְתָּ בִּשְׁעָרֶיךָ׃
    hebrewPlain: מקצה שלש שנים תוציא את כל מעשר תבואתך בשנה ההוא והנחת בשעריך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 14:28
    kjvOsis:
