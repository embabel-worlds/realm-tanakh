- type: TanakhVerse
  data:
    osis: Deut.28.53
    scripture: tanakh
    name: Tanakh Deuteronomy 28:53
    ref: Deuteronomy 28:53
    book: Deut
    section: torah
    chapter: 28
    verse: 53
    ordinal: 5659
    text: And thou shalt eat the fruit of thine own body, the flesh of thy sons and of thy daughters whom the LORD thy God hath given thee; in the siege and in the straitness, wherewith thine enemies shall straiten thee.
    translation: JPS 1917
    original: וְאָכַלְתָּ פְרִי־בִטְנְךָ בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ אֲשֶׁר נָתַן־לְךָ יְהוָה אֱלֹהֶיךָ בְּמָצוֹר וּבְמָצוֹק אֲשֶׁר־יָצִיק לְךָ אֹיְבֶךָ׃
    hebrewPlain: ואכלת פרי בטנך בשר בניך ובנתיך אשר נתן לך יהוה אלהיך במצור ובמצוק אשר יציק לך איבך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:53
    kjvOsis:
    - Deut.28.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
