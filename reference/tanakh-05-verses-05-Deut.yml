  data:
    osis: Deut.4.23
    scripture: tanakh
    name: Tanakh Deuteronomy 4:23
    ref: Deuteronomy 4:23
    book: Deut
    section: torah
    chapter: 4
    verse: 23
    ordinal: 5025
    text: Take heed unto yourselves, lest ye forget the covenant of the LORD your God, which He made with you, and make you a graven image, even the likeness of any thing which the LORD thy God hath forbidden thee.
    translation: JPS 1917
    original: הִשָּׁמְרוּ לָכֶם פֶּן־תִּשְׁכְּחוּ אֶת־בְּרִית יְהוָה אֱלֹהֵיכֶם אֲשֶׁר כָּרַת עִמָּכֶם וַעֲשִׂיתֶם לָכֶם פֶּסֶל תְּמוּנַת כֹּל אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: השמרו לכם פן תשכחו את ברית יהוה אלהיכם אשר כרת עמכם ועשיתם לכם פסל תמונת כל אשר צוך יהוה אלהיך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:23
    kjvOsis:
    - Deut.4.23
