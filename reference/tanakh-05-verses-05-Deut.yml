  data:
    osis: Deut.28.28
    scripture: tanakh
    name: Tanakh Deuteronomy 28:28
    ref: Deuteronomy 28:28
    book: Deut
    section: torah
    chapter: 28
    verse: 28
    ordinal: 5634
    text: The LORD will smite thee with madness, and with blindness, and with astonishment of heart.
    translation: JPS 1917
    original: יַכְּכָה יְהוָה בְּשִׁגָּעוֹן וּבְעִוָּרוֹן וּבְתִמְהוֹן לֵבָב׃
    hebrewPlain: יככה יהוה בשגעון ובעורון ובתמהון לבב
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:28
    kjvOsis:
    - Deut.28.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.29
    scripture: tanakh
    name: Tanakh Deuteronomy 28:29
    ref: Deuteronomy 28:29
    book: Deut
    section: torah
    chapter: 28
    verse: 29
    ordinal: 5635
    text: And thou shalt grope at noonday, as the blind gropeth in darkness, and thou shalt not make thy ways prosperous; and thou shalt be only oppressed and robbed alway, and there shall be none to save thee.
    translation: JPS 1917
    original: וְהָיִיתָ מְמַשֵּׁשׁ בַּצָּהֳרַיִם כַּאֲשֶׁר יְמַשֵּׁשׁ הָעִוֵּר בָּאֲפֵלָה וְלֹא תַצְלִיחַ אֶת־דְּרָכֶיךָ וְהָיִיתָ אַךְ עָשׁוּק וְגָזוּל כָּל־הַיָּמִים וְאֵין מוֹשִׁיעַ׃
    hebrewPlain: והיית ממשש בצהרים כאשר ימשש העור באפלה ולא תצליח את דרכיך והיית אך עשוק וגזול כל הימים ואין מושיע
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:29
    kjvOsis:
    - Deut.28.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
