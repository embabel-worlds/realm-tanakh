  data:
    osis: Deut.17.5
    scripture: tanakh
    name: Tanakh Deuteronomy 17:5
    ref: Deuteronomy 17:5
    book: Deut
    section: torah
    chapter: 17
    verse: 5
    ordinal: 5364
    text: then shalt thou bring forth that man or that woman, who have done this evil thing, unto thy gates, even the man or the woman; and thou shalt stone them with stones, that they die.
    translation: JPS 1917
    original: וְהוֹצֵאתָ אֶת־הָאִישׁ הַהוּא אוֹ אֶת־הָאִשָּׁה הַהִוא אֲשֶׁר עָשׂוּ אֶת־הַדָּבָר הָרָע הַזֶּה אֶל־שְׁעָרֶיךָ אֶת־הָאִישׁ אוֹ אֶת־הָאִשָּׁה וּסְקַלְתָּם בָּאֲבָנִים וָמֵתוּ׃
    hebrewPlain: והוצאת את האיש ההוא או את האשה ההוא אשר עשו את הדבר הרע הזה אל שעריך את האיש או את האשה וסקלתם באבנים ומתו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:5
    kjvOsis:
    - Deut.17.5
