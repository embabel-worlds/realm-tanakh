  data:
    osis: Deut.18.22
    scripture: tanakh
    name: Tanakh Deuteronomy 18:22
    ref: Deuteronomy 18:22
    book: Deut
    section: torah
    chapter: 18
    verse: 22
    ordinal: 5401
    text: When a prophet speaketh in the name of the LORD, if the thing follow not, nor come to pass, that is the thing which the LORD hath not spoken; the prophet hath spoken it presumptuously, thou shalt not be afraid of him.
    translation: JPS 1917
    original: אֲשֶׁר יְדַבֵּר הַנָּבִיא בְּשֵׁם יְהוָה וְלֹא־יִהְיֶה הַדָּבָר וְלֹא יָבוֹא הוּא הַדָּבָר אֲשֶׁר לֹא־דִבְּרוֹ יְהוָה בְּזָדוֹן דִּבְּרוֹ הַנָּבִיא לֹא תָגוּר מִמֶּנּוּ׃
    hebrewPlain: אשר ידבר הנביא בשם יהוה ולא יהיה הדבר ולא יבוא הוא הדבר אשר לא דברו יהוה בזדון דברו הנביא לא תגור ממנו
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:22
    kjvOsis:
    - Deut.18.22
