    scripture: tanakh
    name: Tanakh Deuteronomy 11:21
    ref: Deuteronomy 11:21
    book: Deut
    section: torah
    chapter: 11
    verse: 21
    ordinal: 5224
    text: that your days may be multiplied, and the days of your children, upon the land which the LORD swore unto your fathers to give them, as the days of the heavens above the earth.
    translation: JPS 1917
    original: לְמַעַן יִרְבּוּ יְמֵיכֶם וִימֵי בְנֵיכֶם עַל הָאֲדָמָה אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם לָתֵת לָהֶם כִּימֵי הַשָּׁמַיִם עַל־הָאָרֶץ׃
    hebrewPlain: למען ירבו ימיכם וימי בניכם על האדמה אשר נשבע יהוה לאבתיכם לתת להם כימי השמים על הארץ
    parashah: Eikev
