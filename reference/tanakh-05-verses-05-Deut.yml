  data:
    osis: Deut.1.21
    scripture: tanakh
    name: Tanakh Deuteronomy 1:21
    ref: Deuteronomy 1:21
    book: Deut
    section: torah
    chapter: 1
    verse: 21
    ordinal: 4911
    text: Behold, the LORD thy God hath set the land before thee; go up, take possession, as the LORD, the God of thy fathers, hath spoken unto thee; fear not, neither be dismayed.’
    translation: JPS 1917
    original: רְאֵה נָתַן יְהוָה אֱלֹהֶיךָ לְפָנֶיךָ אֶת־הָאָרֶץ עֲלֵה רֵשׁ כַּאֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵי אֲבֹתֶיךָ לָךְ אַל־תִּירָא וְאַל־תֵּחָת׃
    hebrewPlain: ראה נתן יהוה אלהיך לפניך את הארץ עלה רש כאשר דבר יהוה אלהי אבתיך לך אל תירא ואל תחת
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:21
    kjvOsis:
    - Deut.1.21
