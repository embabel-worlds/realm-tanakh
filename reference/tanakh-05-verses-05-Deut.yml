    scripture: tanakh
    name: Tanakh Deuteronomy 16:8
    ref: Deuteronomy 16:8
    book: Deut
    section: torah
    chapter: 16
    verse: 8
    ordinal: 5345
    text: Six days thou shalt eat unleavened bread; and on the seventh day shall be a solemn assembly to the LORD thy God; thou shalt do no work therein.
    translation: JPS 1917
    original: שֵׁשֶׁת יָמִים תֹּאכַל מַצּוֹת וּבַיּוֹם הַשְּׁבִיעִי עֲצֶרֶת לַיהוָה אֱלֹהֶיךָ לֹא תַעֲשֶׂה מְלָאכָה׃
    hebrewPlain: ששת ימים תאכל מצות וביום השביעי עצרת ליהוה אלהיך לא תעשה מלאכה
