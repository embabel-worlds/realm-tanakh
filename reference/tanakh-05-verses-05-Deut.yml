    ordinal: 4908
    text: And I commanded you at that time all the things which ye should do.
    translation: JPS 1917
    original: וָאֲצַוֶּה אֶתְכֶם בָּעֵת הַהִוא אֵת כָּל־הַדְּבָרִים אֲשֶׁר תַּעֲשׂוּן׃
    hebrewPlain: ואצוה אתכם בעת ההוא את כל הדברים אשר תעשון
