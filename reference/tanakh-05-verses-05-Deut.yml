    text: And it shall come to pass, when all these things are come upon thee, the blessing and the curse, which I have set before thee, and thou shalt bethink thyself among all the nations, whither the LORD thy God hath driven thee,
    translation: JPS 1917
    original: וְהָיָה כִי־יָבֹאוּ עָלֶיךָ כָּל־הַדְּבָרִים הָאֵלֶּה הַבְּרָכָה וְהַקְּלָלָה אֲשֶׁר נָתַתִּי לְפָנֶיךָ וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ בְּכָל־הַגּוֹיִם אֲשֶׁר הִדִּיחֲךָ יְהוָה אֱלֹהֶיךָ שָׁמָּה׃
    hebrewPlain: והיה כי יבאו עליך כל הדברים האלה הברכה והקללה אשר נתתי לפניך והשבת אל לבבך בכל הגוים אשר הדיחך יהוה אלהיך שמה
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:1
    kjvOsis:
    - Deut.30.1
