    original: וַיַּרְא רֵאשִׁית לוֹ כִּי־שָׁם חֶלְקַת מְחֹקֵק סָפוּן וַיֵּתֵא רָאשֵׁי עָם צִדְקַת יְהוָה עָשָׂה וּמִשְׁפָּטָיו עִם־יִשְׂרָאֵל׃
