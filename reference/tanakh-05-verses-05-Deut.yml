  data:
    osis: Deut.23.15
    scripture: tanakh
    name: Tanakh Deuteronomy 23:15
    ref: Deuteronomy 23:15
    book: Deut
    section: torah
    chapter: 23
    verse: 15
    ordinal: 5509
    text: For the LORD thy God walketh in the midst of thy camp, to deliver thee, and to give up thine enemies before thee; therefore shall thy camp be holy; that He see no unseemly thing in thee, and turn away from thee.
    translation: JPS 1917
    original: כִּי יְהוָה אֱלֹהֶיךָ מִתְהַלֵּךְ בְּקֶרֶב מַחֲנֶךָ לְהַצִּילְךָ וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ וְהָיָה מַחֲנֶיךָ קָדוֹשׁ וְלֹא־יִרְאֶה בְךָ עֶרְוַת דָּבָר וְשָׁב מֵאַחֲרֶיךָ׃
    hebrewPlain: כי יהוה אלהיך מתהלך בקרב מחנך להצילך ולתת איביך לפניך והיה מחניך קדוש ולא יראה בך ערות דבר ושב מאחריך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:14
    kjvOsis:
    - Deut.23.14
  relations:
