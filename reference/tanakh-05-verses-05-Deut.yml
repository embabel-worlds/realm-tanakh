    name: Tanakh Deuteronomy 25:11
    ref: Deuteronomy 25:11
    book: Deut
    section: torah
    chapter: 25
    verse: 11
    ordinal: 5553
    text: When men strive together one with another, and the wife of the one draweth near to deliver her husband out of the hand of him that smiteth him, and putteth forth her hand, and taketh him by the secrets;
    translation: JPS 1917
    original: כִּי־יִנָּצוּ אֲנָשִׁים יַחְדָּו אִישׁ וְאָחִיו וְקָרְבָה אֵשֶׁת הָאֶחָד לְהַצִּיל אֶת־אִישָׁהּ מִיַּד מַכֵּהוּ וְשָׁלְחָה יָדָהּ וְהֶחֱזִיקָה בִּמְבֻשָׁיו׃
    hebrewPlain: כי ינצו אנשים יחדו איש ואחיו וקרבה אשת האחד להציל את אישה מיד מכהו ושלחה ידה והחזיקה במבשיו
    parashah: Ki Teitzei
    kjvRefs:
