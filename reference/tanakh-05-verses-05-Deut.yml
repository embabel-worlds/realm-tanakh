  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.19
    scripture: tanakh
    name: Tanakh Deuteronomy 23:19
    ref: Deuteronomy 23:19
    book: Deut
    section: torah
    chapter: 23
    verse: 19
    ordinal: 5513
    text: Thou shalt not bring the hire of a harlot, or the price of a dog, into the house of the LORD thy God for any vow; for even both these are an abomination unto the LORD thy God. .
    translation: JPS 1917
    original: לֹא־תָבִיא אֶתְנַן זוֹנָה וּמְחִיר כֶּלֶב בֵּית יְהוָה אֱלֹהֶיךָ לְכָל־נֶדֶר כִּי תוֹעֲבַת יְהוָה אֱלֹהֶיךָ גַּם־שְׁנֵיהֶם׃
    hebrewPlain: לא תביא אתנן זונה ומחיר כלב בית יהוה אלהיך לכל נדר כי תועבת יהוה אלהיך גם שניהם
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:18
    kjvOsis:
    - Deut.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.20
    scripture: tanakh
    name: Tanakh Deuteronomy 23:20
    ref: Deuteronomy 23:20
    book: Deut
    section: torah
    chapter: 23
    verse: 20
    ordinal: 5514
    text: 'Thou shalt not lend upon interest to thy brother: interest of money, interest of victuals, interest of any thing that is lent upon interest.'
    translation: JPS 1917
    original: לֹא־תַשִּׁיךְ לְאָחִיךָ נֶשֶׁךְ כֶּסֶף נֶשֶׁךְ אֹכֶל נֶשֶׁךְ כָּל־דָּבָר אֲשֶׁר יִשָּׁךְ׃
    hebrewPlain: לא תשיך לאחיך נשך כסף נשך אכל נשך כל דבר אשר ישך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:19
    kjvOsis:
    - Deut.23.19
  relations:
