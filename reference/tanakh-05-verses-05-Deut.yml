    text: and the latter husband hateth her, and writeth her a bill of divorcement, and giveth it in her hand, and sendeth her out of his house; or if the latter husband die, who took her to be his wife;
    translation: JPS 1917
    original: וּשְׂנֵאָהּ הָאִישׁ הָאַחֲרוֹן וְכָתַב לָהּ סֵפֶר כְּרִיתֻת וְנָתַן בְּיָדָהּ וְשִׁלְּחָהּ מִבֵּיתוֹ אוֹ כִי יָמוּת הָאִישׁ הָאַחֲרוֹן אֲשֶׁר־לְקָחָהּ לוֹ לְאִשָּׁה׃
    hebrewPlain: ושנאה האיש האחרון וכתב לה ספר כריתת ונתן בידה ושלחה מביתו או כי ימות האיש האחרון אשר לקחה לו לאשה
