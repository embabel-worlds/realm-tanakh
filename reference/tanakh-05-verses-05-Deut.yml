  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.19
    scripture: tanakh
    name: Tanakh Deuteronomy 7:19
    ref: Deuteronomy 7:19
    book: Deut
    section: torah
    chapter: 7
    verse: 19
    ordinal: 5125
    text: the great trials which thine eyes saw, and the signs, and the wonders, and the mighty hand, and the outstretched arm, whereby the LORD thy God brought thee out; so shall the LORD thy God do unto all the peoples of whom thou art afraid.
    translation: JPS 1917
    original: הַמַּסֹּת הַגְּדֹלֹת אֲשֶׁר־רָאוּ עֵינֶיךָ וְהָאֹתֹת וְהַמֹּפְתִים וְהַיָּד הַחֲזָקָה וְהַזְּרֹעַ הַנְּטוּיָה אֲשֶׁר הוֹצִאֲךָ יְהוָה אֱלֹהֶיךָ כֵּן־יַעֲשֶׂה יְהוָה אֱלֹהֶיךָ לְכָל־הָעַמִּים אֲשֶׁר־אַתָּה יָרֵא מִפְּנֵיהֶם׃
    hebrewPlain: המסת הגדלת אשר ראו עיניך והאתת והמפתים והיד החזקה והזרע הנטויה אשר הוצאך יהוה אלהיך כן יעשה יהוה אלהיך לכל העמים אשר אתה ירא מפניהם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:19
    kjvOsis:
    - Deut.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.20
    scripture: tanakh
    name: Tanakh Deuteronomy 7:20
    ref: Deuteronomy 7:20
    book: Deut
    section: torah
    chapter: 7
    verse: 20
    ordinal: 5126
    text: Moreover the LORD thy God will send the hornet among them, until they that are left, and they that hide themselves, perish from before thee. .
    translation: JPS 1917
    original: וְגַם אֶת־הַצִּרְעָה יְשַׁלַּח יְהוָה אֱלֹהֶיךָ בָּם עַד־אֲבֹד הַנִּשְׁאָרִים וְהַנִּסְתָּרִים מִפָּנֶיךָ׃
    hebrewPlain: וגם את הצרעה ישלח יהוה אלהיך בם עד אבד הנשארים והנסתרים מפניך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:20
    kjvOsis:
    - Deut.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.21
    scripture: tanakh
    name: Tanakh Deuteronomy 7:21
    ref: Deuteronomy 7:21
    book: Deut
    section: torah
    chapter: 7
    verse: 21
    ordinal: 5127
    text: Thou shalt not be affrighted at them; for the LORD thy God is in the midst of thee, a God great and awful.
    translation: JPS 1917
    original: לֹא תַעֲרֹץ מִפְּנֵיהֶם כִּי־יְהוָה אֱלֹהֶיךָ בְּקִרְבֶּךָ אֵל גָּדוֹל וְנוֹרָא׃
    hebrewPlain: לא תערץ מפניהם כי יהוה אלהיך בקרבך אל גדול ונורא
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:21
    kjvOsis:
    - Deut.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.22
    scripture: tanakh
    name: Tanakh Deuteronomy 7:22
    ref: Deuteronomy 7:22
    book: Deut
    section: torah
    chapter: 7
    verse: 22
    ordinal: 5128
    text: And the LORD thy God will cast out those nations before thee by little and little; thou mayest not consume them quickly, lest the beasts of the field increase upon thee.
    translation: JPS 1917
    original: וְנָשַׁל יְהוָה אֱלֹהֶיךָ אֶת־הַגּוֹיִם הָאֵל מִפָּנֶיךָ מְעַט מְעָט לֹא תוּכַל כַּלֹּתָם מַהֵר פֶּן־תִּרְבֶּה עָלֶיךָ חַיַּת הַשָּׂדֶה׃
    hebrewPlain: ונשל יהוה אלהיך את הגוים האל מפניך מעט מעט לא תוכל כלתם מהר פן תרבה עליך חית השדה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:22
    kjvOsis:
    - Deut.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
