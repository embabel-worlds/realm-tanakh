- type: TanakhVerse
  data:
    osis: Deut.22.16
    scripture: tanakh
    name: Tanakh Deuteronomy 22:16
    ref: Deuteronomy 22:16
    book: Deut
    section: torah
    chapter: 22
    verse: 16
    ordinal: 5481
    text: 'And the damsel’s father shall say unto the elders: ‘I gave my daughter unto this man to wife, and he hateth her;'
    translation: JPS 1917
    original: וְאָמַר אֲבִי הנער [הַנַּעַרָה] אֶל־הַזְּקֵנִים אֶת־בִּתִּי נָתַתִּי לָאִישׁ הַזֶּה לְאִשָּׁה וַיִּשְׂנָאֶהָ׃
    hebrewPlain: ואמר אבי הנער [הנערה] אל הזקנים את בתי נתתי לאיש הזה לאשה וישנאה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:16
    kjvOsis:
    - Deut.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
