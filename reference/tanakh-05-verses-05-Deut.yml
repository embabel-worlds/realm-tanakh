    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.22
    scripture: tanakh
    name: Tanakh Deuteronomy 23:22
    ref: Deuteronomy 23:22
    book: Deut
    section: torah
    chapter: 23
    verse: 22
    ordinal: 5516
    text: When thou shalt vow a vow unto the LORD thy God, thou shalt not be slack to pay it; for the LORD thy God will surely require it of thee; and it will be sin in thee.
    translation: JPS 1917
    original: כִּי־תִדֹּר נֶדֶר לַיהוָה אֱלֹהֶיךָ לֹא תְאַחֵר לְשַׁלְּמוֹ כִּי־דָּרֹשׁ יִדְרְשֶׁנּוּ יְהוָה אֱלֹהֶיךָ מֵעִמָּךְ וְהָיָה בְךָ חֵטְא׃
    hebrewPlain: כי תדר נדר ליהוה אלהיך לא תאחר לשלמו כי דרש ידרשנו יהוה אלהיך מעמך והיה בך חטא
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:21
    kjvOsis:
    - Deut.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
