    translation: JPS 1917
    original: וְזָכַרְתָּ אֶת־יְהוָה אֱלֹהֶיךָ כִּי הוּא הַנֹּתֵן לְךָ כֹּחַ לַעֲשׂוֹת חָיִל לְמַעַן הָקִים אֶת־בְּרִיתוֹ אֲשֶׁר־נִשְׁבַּע לַאֲבֹתֶיךָ כַּיּוֹם הַזֶּה׃
    hebrewPlain: וזכרת את יהוה אלהיך כי הוא הנתן לך כח לעשות חיל למען הקים את בריתו אשר נשבע לאבתיך כיום הזה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 8:18
    kjvOsis:
    - Deut.8.18
