  data:
    osis: Deut.6.23
    scripture: tanakh
    name: Tanakh Deuteronomy 6:23
    ref: Deuteronomy 6:23
    book: Deut
    section: torah
    chapter: 6
    verse: 23
    ordinal: 5104
    text: And He brought us out from thence, that He might bring us in, to give us the land which He swore unto our fathers.
    translation: JPS 1917
    original: וְאוֹתָנוּ הוֹצִיא מִשָּׁם לְמַעַן הָבִיא אֹתָנוּ לָתֶת לָנוּ אֶת־הָאָרֶץ אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵינוּ׃
    hebrewPlain: ואותנו הוציא משם למען הביא אתנו לתת לנו את הארץ אשר נשבע לאבתינו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:23
    kjvOsis:
    - Deut.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.6
  - predicate: IN_PORTION
