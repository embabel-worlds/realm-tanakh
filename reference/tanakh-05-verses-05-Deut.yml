  data:
    osis: Deut.22.14
    scripture: tanakh
    name: Tanakh Deuteronomy 22:14
    ref: Deuteronomy 22:14
    book: Deut
    section: torah
    chapter: 22
    verse: 14
    ordinal: 5479
    text: 'and lay wanton charges against her, and bring up an evil name upon her, and say: ‘I took this woman, and when I came nigh to her, I found not in her the tokens of virginity’;'
    translation: JPS 1917
    original: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים וְהוֹצִיא עָלֶיהָ שֵׁם רָע וְאָמַר אֶת־הָאִשָּׁה הַזֹּאת לָקַחְתִּי וָאֶקְרַב אֵלֶיהָ וְלֹא־מָצָאתִי לָהּ בְּתוּלִים׃
    hebrewPlain: ושם לה עלילת דברים והוציא עליה שם רע ואמר את האשה הזאת לקחתי ואקרב אליה ולא מצאתי לה בתולים
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:14
    kjvOsis:
    - Deut.22.14
