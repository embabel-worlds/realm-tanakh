  data:
    osis: Deut.9.23
    scripture: tanakh
    name: Tanakh Deuteronomy 9:23
    ref: Deuteronomy 9:23
    book: Deut
    section: torah
    chapter: 9
    verse: 23
    ordinal: 5175
    text: 'And when the LORD sent you from Kadesh-barnea, saying: ‘Go up and possess the land which I have given you’; then ye rebelled against the commandment of the LORD your God, and ye believed Him not, nor hearkened to His voice.'
    translation: JPS 1917
    original: וּבִשְׁלֹחַ יְהוָה אֶתְכֶם מִקָּדֵשׁ בַּרְנֵעַ לֵאמֹר עֲלוּ וּרְשׁוּ אֶת־הָאָרֶץ אֲשֶׁר נָתַתִּי לָכֶם וַתַּמְרוּ אֶת־פִּי יְהוָה אֱלֹהֵיכֶם וְלֹא הֶאֱמַנְתֶּם לוֹ וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ׃
    hebrewPlain: ובשלח יהוה אתכם מקדש ברנע לאמר עלו ורשו את הארץ אשר נתתי לכם ותמרו את פי יהוה אלהיכם ולא האמנתם לו ולא שמעתם בקלו
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:23
    kjvOsis:
    - Deut.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.24
    scripture: tanakh
    name: Tanakh Deuteronomy 9:24
    ref: Deuteronomy 9:24
    book: Deut
    section: torah
    chapter: 9
    verse: 24
    ordinal: 5176
    text: Ye have been rebellious against the LORD from the day that I knew you.—
    translation: JPS 1917
    original: מַמְרִים הֱיִיתֶם עִם־יְהוָה מִיּוֹם דַּעְתִּי אֶתְכֶם׃
    hebrewPlain: ממרים הייתם עם יהוה מיום דעתי אתכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:24
    kjvOsis:
    - Deut.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
