  data:
    osis: Deut.10.1
    scripture: tanakh
    name: Tanakh Deuteronomy 10:1
    ref: Deuteronomy 10:1
    book: Deut
    section: torah
    chapter: 10
    verse: 1
    ordinal: 5182
    text: 'At that time the LORD said unto me: ‘Hew thee two tables of stone like unto the first, and come up unto Me into the mount; and make thee an ark of wood.'
    translation: JPS 1917
    original: בָּעֵת הַהִוא אָמַר יְהוָה אֵלַי פְּסָל־לְךָ שְׁנֵי־לֻוחֹת אֲבָנִים כָּרִאשֹׁנִים וַעֲלֵה אֵלַי הָהָרָה וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ׃
    hebrewPlain: בעת ההוא אמר יהוה אלי פסל לך שני לוחת אבנים כראשנים ועלה אלי ההרה ועשית לך ארון עץ
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:1
    kjvOsis:
    - Deut.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.2
    scripture: tanakh
    name: Tanakh Deuteronomy 10:2
    ref: Deuteronomy 10:2
    book: Deut
    section: torah
    chapter: 10
    verse: 2
    ordinal: 5183
    text: And I will write on the tables the words that were on the first tables which thou didst break, and thou shalt put them in the ark.’
    translation: JPS 1917
    original: וְאֶכְתֹּב עַל־הַלֻּחֹת אֶת־הַדְּבָרִים אֲשֶׁר הָיוּ עַל־הַלֻּחֹת הָרִאשֹׁנִים אֲשֶׁר שִׁבַּרְתָּ וְשַׂמְתָּם בָּאָרוֹן׃
    hebrewPlain: ואכתב על הלחת את הדברים אשר היו על הלחת הראשנים אשר שברת ושמתם בארון
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:2
    kjvOsis:
    - Deut.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.3
    scripture: tanakh
    name: Tanakh Deuteronomy 10:3
    ref: Deuteronomy 10:3
    book: Deut
    section: torah
    chapter: 10
    verse: 3
    ordinal: 5184
    text: So I made an ark of acacia-wood, and hewed two tables of stone like unto the first, and went up into the mount, having the two tables in my hand.
    translation: JPS 1917
    original: וָאַעַשׂ אֲרוֹן עֲצֵי שִׁטִּים וָאֶפְסֹל שְׁנֵי־לֻחֹת אֲבָנִים כָּרִאשֹׁנִים וָאַעַל הָהָרָה וּשְׁנֵי הַלֻּחֹת בְּיָדִי׃
    hebrewPlain: ואעש ארון עצי שטים ואפסל שני לחת אבנים כראשנים ואעל ההרה ושני הלחת בידי
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:3
    kjvOsis:
    - Deut.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.4
    scripture: tanakh
    name: Tanakh Deuteronomy 10:4
    ref: Deuteronomy 10:4
    book: Deut
    section: torah
    chapter: 10
    verse: 4
    ordinal: 5185
    text: And He wrote on the tables according to the first writing, the ten words, which the LORD spoke unto you in the mount out of the midst of the fire in the day of the assembly; and the LORD gave them unto me.
    translation: JPS 1917
    original: וַיִּכְתֹּב עַל־הַלֻּחֹת כַּמִּכְתָּב הָרִאשׁוֹן אֵת עֲשֶׂרֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם בָּהָר מִתּוֹךְ הָאֵשׁ בְּיוֹם הַקָּהָל וַיִּתְּנֵם יְהוָה אֵלָי׃
    hebrewPlain: ויכתב על הלחת כמכתב הראשון את עשרת הדברים אשר דבר יהוה אליכם בהר מתוך האש ביום הקהל ויתנם יהוה אלי
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:4
    kjvOsis:
    - Deut.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.5
    scripture: tanakh
    name: Tanakh Deuteronomy 10:5
    ref: Deuteronomy 10:5
    book: Deut
    section: torah
    chapter: 10
    verse: 5
    ordinal: 5186
    text: And I turned and came down from the mount, and put the tables in the ark which I had made; and there they are, as the LORD commanded me.—
    translation: JPS 1917
    original: וָאֵפֶן וָאֵרֵד מִן־הָהָר וָאָשִׂם אֶת־הַלֻּחֹת בָּאָרוֹן אֲשֶׁר עָשִׂיתִי וַיִּהְיוּ שָׁם כַּאֲשֶׁר צִוַּנִי יְהוָה׃
    hebrewPlain: ואפן וארד מן ההר ואשם את הלחת בארון אשר עשיתי ויהיו שם כאשר צוני יהוה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:5
    kjvOsis:
    - Deut.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.6
    scripture: tanakh
    name: Tanakh Deuteronomy 10:6
    ref: Deuteronomy 10:6
    book: Deut
    section: torah
    chapter: 10
    verse: 6
    ordinal: 5187
    text: And the children of Israel journeyed from Beeroth-benejaakan to Moserah; there Aaron died, and there he was buried; and Eleazar his son ministered in the priest’s office in his stead.
    translation: JPS 1917
    original: וּבְנֵי יִשְׂרָאֵל נָסְעוּ מִבְּאֵרֹת בְּנֵי־יַעֲקָן מוֹסֵרָה שָׁם מֵת אַהֲרֹן וַיִּקָּבֵר שָׁם וַיְכַהֵן אֶלְעָזָר בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: ובני ישראל נסעו מבארת בני יעקן מוסרה שם מת אהרן ויקבר שם ויכהן אלעזר בנו תחתיו
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:6
    kjvOsis:
    - Deut.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.7
    scripture: tanakh
    name: Tanakh Deuteronomy 10:7
    ref: Deuteronomy 10:7
    book: Deut
    section: torah
    chapter: 10
    verse: 7
    ordinal: 5188
    text: From thence they journeyed unto Gudgod; and from Gudgod to Jotbah, a land of brooks of water.—
    translation: JPS 1917
    original: מִשָּׁם נָסְעוּ הַגֻּדְגֹּדָה וּמִן־הַגֻּדְגֹּדָה יָטְבָתָה אֶרֶץ נַחֲלֵי מָיִם׃
    hebrewPlain: משם נסעו הגדגדה ומן הגדגדה יטבתה ארץ נחלי מים
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:7
    kjvOsis:
    - Deut.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.8
    scripture: tanakh
    name: Tanakh Deuteronomy 10:8
    ref: Deuteronomy 10:8
    book: Deut
    section: torah
    chapter: 10
    verse: 8
    ordinal: 5189
    text: At that time the LORD separated the tribe of Levi, to bear the ark of the covenant of the LORD, to stand before the LORD to minister unto Him, and to bless in His name, unto this day.
    translation: JPS 1917
    original: בָּעֵת הַהִוא הִבְדִּיל יְהוָה אֶת־שֵׁבֶט הַלֵּוִי לָשֵׂאת אֶת־אֲרוֹן בְּרִית־יְהוָה לַעֲמֹד לִפְנֵי יְהוָה לְשָׁרְתוֹ וּלְבָרֵךְ בִּשְׁמוֹ עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: בעת ההוא הבדיל יהוה את שבט הלוי לשאת את ארון ברית יהוה לעמד לפני יהוה לשרתו ולברך בשמו עד היום הזה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:8
    kjvOsis:
    - Deut.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.9
    scripture: tanakh
    name: Tanakh Deuteronomy 10:9
    ref: Deuteronomy 10:9
    book: Deut
    section: torah
    chapter: 10
    verse: 9
    ordinal: 5190
    text: Wherefore Levi hath no portion nor inheritance with his brethren; the LORD is his inheritance, according as the LORD thy God spoke unto him.—
    translation: JPS 1917
    original: עַל־כֵּן לֹא־הָיָה לְלֵוִי חֵלֶק וְנַחֲלָה עִם־אֶחָיו יְהוָה הוּא נַחֲלָתוֹ כַּאֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֶיךָ לוֹ׃
    hebrewPlain: על כן לא היה ללוי חלק ונחלה עם אחיו יהוה הוא נחלתו כאשר דבר יהוה אלהיך לו
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:9
    kjvOsis:
    - Deut.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.10
    scripture: tanakh
    name: Tanakh Deuteronomy 10:10
    ref: Deuteronomy 10:10
    book: Deut
    section: torah
    chapter: 10
    verse: 10
    ordinal: 5191
    text: Now I stayed in the mount, as at the first time, forty days and forty nights; and the LORD hearkened unto me that time also; the LORD would not destroy thee.
    translation: JPS 1917
    original: וְאָנֹכִי עָמַדְתִּי בָהָר כַּיָּמִים הָרִאשֹׁנִים אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה וַיִּשְׁמַע יְהוָה אֵלַי גַּם בַּפַּעַם הַהִוא לֹא־אָבָה יְהוָה הַשְׁחִיתֶךָ׃
    hebrewPlain: ואנכי עמדתי בהר כימים הראשנים ארבעים יום וארבעים לילה וישמע יהוה אלי גם בפעם ההוא לא אבה יהוה השחיתך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:10
    kjvOsis:
    - Deut.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.11
    scripture: tanakh
    name: Tanakh Deuteronomy 10:11
    ref: Deuteronomy 10:11
    book: Deut
    section: torah
    chapter: 10
    verse: 11
    ordinal: 5192
    text: 'And the LORD said unto me: ‘Arise, go before the people, causing them to set forward, that they may go in and possess the land, which I swore unto their fathers to give unto them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי קוּם לֵךְ לְמַסַּע לִפְנֵי הָעָם וְיָבֹאוּ וְיִרְשׁוּ אֶת־הָאָרֶץ אֲשֶׁר־נִשְׁבַּעְתִּי לַאֲבֹתָם לָתֵת לָהֶם׃
    hebrewPlain: ויאמר יהוה אלי קום לך למסע לפני העם ויבאו וירשו את הארץ אשר נשבעתי לאבתם לתת להם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:11
    kjvOsis:
    - Deut.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.12
    scripture: tanakh
    name: Tanakh Deuteronomy 10:12
    ref: Deuteronomy 10:12
    book: Deut
    section: torah
    chapter: 10
    verse: 12
    ordinal: 5193
    text: And now, Israel, what doth the LORD thy God require of thee, but to fear the LORD thy God, to walk in all His ways, and to love Him, and to serve the LORD thy God with all thy heart and with all thy soul;
    translation: JPS 1917
    original: וְעַתָּה יִשְׂרָאֵל מָה יְהוָה אֱלֹהֶיךָ שֹׁאֵל מֵעִמָּךְ כִּי אִם־לְיִרְאָה אֶת־יְהוָה אֱלֹהֶיךָ לָלֶכֶת בְּכָל־דְּרָכָיו וּלְאַהֲבָה אֹתוֹ וְלַעֲבֹד אֶת־יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשֶׁךָ׃
    hebrewPlain: ועתה ישראל מה יהוה אלהיך שאל מעמך כי אם ליראה את יהוה אלהיך ללכת בכל דרכיו ולאהבה אתו ולעבד את יהוה אלהיך בכל לבבך ובכל נפשך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:12
    kjvOsis:
    - Deut.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.13
    scripture: tanakh
    name: Tanakh Deuteronomy 10:13
    ref: Deuteronomy 10:13
    book: Deut
    section: torah
    chapter: 10
    verse: 13
    ordinal: 5194
    text: to keep for thy good the commandments of the LORD, and His statutes, which I command thee this day?
    translation: JPS 1917
    original: לִשְׁמֹר אֶת־מִצְוֺת יְהוָה וְאֶת־חֻקֹּתָיו אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם לְטוֹב לָךְ׃
    hebrewPlain: לשמר את מצות יהוה ואת חקתיו אשר אנכי מצוך היום לטוב לך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:13
    kjvOsis:
    - Deut.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.14
    scripture: tanakh
    name: Tanakh Deuteronomy 10:14
    ref: Deuteronomy 10:14
    book: Deut
    section: torah
    chapter: 10
    verse: 14
    ordinal: 5195
    text: Behold, unto the LORD thy God belongeth the heaven, and the heaven of heavens, the earth, with all that therein is.
    translation: JPS 1917
    original: הֵן לַיהוָה אֱלֹהֶיךָ הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמָיִם הָאָרֶץ וְכָל־אֲשֶׁר־בָּהּ׃
    hebrewPlain: הן ליהוה אלהיך השמים ושמי השמים הארץ וכל אשר בה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 10:14
    kjvOsis:
    - Deut.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.10.15
    scripture: tanakh
    name: Tanakh Deuteronomy 10:15
    ref: Deuteronomy 10:15
    book: Deut
    section: torah
    chapter: 10
    verse: 15
    ordinal: 5196
    text: Only the LORD had a delight in thy fathers to love them, and He chose their seed after them, even you, above all peoples, as it is this day.
    translation: JPS 1917
