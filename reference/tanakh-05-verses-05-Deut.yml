  data:
    osis: Deut.5.20
    scripture: tanakh
    name: Tanakh Deuteronomy 5:20
    ref: Deuteronomy 5:20
    book: Deut
    section: torah
    chapter: 5
    verse: 20
    ordinal: 5071
    text: And it came to pass, when ye heard the voice out of the midst of the darkness, while the mountain did burn with fire, that ye came near unto me, even all the heads of your tribes, and your elders;
    translation: JPS 1917
    original: וַיְהִי כְּשָׁמְעֲכֶם אֶת־הַקּוֹל מִתּוֹךְ הַחֹשֶׁךְ וְהָהָר בֹּעֵר בָּאֵשׁ וַתִּקְרְבוּן אֵלַי כָּל־רָאשֵׁי שִׁבְטֵיכֶם וְזִקְנֵיכֶם׃
    hebrewPlain: ויהי כשמעכם את הקול מתוך החשך וההר בער באש ותקרבון אלי כל ראשי שבטיכם וזקניכם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:23
    kjvOsis:
    - Deut.5.23
