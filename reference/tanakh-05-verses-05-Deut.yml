- type: TanakhVerse
  data:
    osis: Deut.23.3
    scripture: tanakh
    name: Tanakh Deuteronomy 23:3
    ref: Deuteronomy 23:3
    book: Deut
    section: torah
    chapter: 23
    verse: 3
    ordinal: 5497
    text: A bastard shall not enter into the assembly of the LORD; even to the tenth generation shall none of his enter into the assembly of the LORD.
    translation: JPS 1917
    original: לֹא־יָבֹא מַמְזֵר בִּקְהַל יְהוָה גַּם דּוֹר עֲשִׂירִי לֹא־יָבֹא לוֹ בִּקְהַל יְהוָה׃
    hebrewPlain: לא יבא ממזר בקהל יהוה גם דור עשירי לא יבא לו בקהל יהוה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:2
    kjvOsis:
    - Deut.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.4
    scripture: tanakh
    name: Tanakh Deuteronomy 23:4
    ref: Deuteronomy 23:4
    book: Deut
    section: torah
    chapter: 23
    verse: 4
    ordinal: 5498
    text: An Ammonite or a Moabite shall not enter into the assembly of the LORD; even to the tenth generation shall none of them enter into the assembly of the LORD for ever;
    translation: JPS 1917
    original: לֹא־יָבֹא עַמּוֹנִי וּמוֹאָבִי בִּקְהַל יְהוָה גַּם דּוֹר עֲשִׂירִי לֹא־יָבֹא לָהֶם בִּקְהַל יְהוָה עַד־עוֹלָם׃
    hebrewPlain: לא יבא עמוני ומואבי בקהל יהוה גם דור עשירי לא יבא להם בקהל יהוה עד עולם
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:3
    kjvOsis:
    - Deut.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
