    ref: Deuteronomy 24:5
    book: Deut
    section: torah
    chapter: 24
    verse: 5
    ordinal: 5525
    text: When a man taketh a new wife, he shall not go out in the host, neither shall he be charged with any business; he shall be free for his house one year, and shall cheer his wife whom he hath taken.
    translation: JPS 1917
    original: כִּי־יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה לֹא יֵצֵא בַּצָּבָא וְלֹא־יַעֲבֹר עָלָיו לְכָל־דָּבָר נָקִי יִהְיֶה לְבֵיתוֹ שָׁנָה אֶחָת וְשִׂמַּח אֶת־אִשְׁתּוֹ אֲשֶׁר־לָקָח׃
    hebrewPlain: כי יקח איש אשה חדשה לא יצא בצבא ולא יעבר עליו לכל דבר נקי יהיה לביתו שנה אחת ושמח את אשתו אשר לקח
    parashah: Ki Teitzei
