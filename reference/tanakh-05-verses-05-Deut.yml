    osis: Deut.23.10
    scripture: tanakh
    name: Tanakh Deuteronomy 23:10
    ref: Deuteronomy 23:10
    book: Deut
    section: torah
    chapter: 23
    verse: 10
    ordinal: 5504
    text: When thou goest forth in camp against thine enemies, then thou shalt keep thee from every evil thing.
    translation: JPS 1917
    original: כִּי־תֵצֵא מַחֲנֶה עַל־אֹיְבֶיךָ וְנִשְׁמַרְתָּ מִכֹּל דָּבָר רָע׃
    hebrewPlain: כי תצא מחנה על איביך ונשמרת מכל דבר רע
