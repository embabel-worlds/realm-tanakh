    scripture: tanakh
    name: Tanakh Deuteronomy 11:17
    ref: Deuteronomy 11:17
    book: Deut
    section: torah
    chapter: 11
    verse: 17
    ordinal: 5220
    text: and the anger of the LORD be kindled against you, and He shut up the heaven, so that there shall be no rain, and the ground shall not yield her fruit; and ye perish quickly from off the good land which the LORD giveth you.
    translation: JPS 1917
    original: וְחָרָה אַף־יְהוָה בָּכֶם וְעָצַר אֶת־הַשָּׁמַיִם וְלֹא־יִהְיֶה מָטָר וְהָאֲדָמָה לֹא תִתֵּן אֶת־יְבוּלָהּ וַאֲבַדְתֶּם מְהֵרָה מֵעַל הָאָרֶץ הַטֹּבָה אֲשֶׁר יְהוָה נֹתֵן לָכֶם׃
    hebrewPlain: וחרה אף יהוה בכם ועצר את השמים ולא יהיה מטר והאדמה לא תתן את יבולה ואבדתם מהרה מעל הארץ הטבה אשר יהוה נתן לכם
