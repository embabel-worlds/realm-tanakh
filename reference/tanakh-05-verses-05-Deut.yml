    text: For whosoever doeth these things is an abomination unto the LORD; and because of these abominations the LORD thy God is driving them out from before thee.
    translation: JPS 1917
    original: כִּי־תוֹעֲבַת יְהוָה כָּל־עֹשֵׂה אֵלֶּה וּבִגְלַל הַתּוֹעֵבֹת הָאֵלֶּה יְהוָה אֱלֹהֶיךָ מוֹרִישׁ אוֹתָם מִפָּנֶיךָ׃
    hebrewPlain: כי תועבת יהוה כל עשה אלה ובגלל התועבת האלה יהוה אלהיך מוריש אותם מפניך
