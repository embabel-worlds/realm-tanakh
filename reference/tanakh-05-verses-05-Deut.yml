    book: Deut
    section: torah
    chapter: 12
    verse: 13
    ordinal: 5248
    text: Take heed to thyself that thou offer not thy burnt-offerings in every place that thou seest;
    translation: JPS 1917
    original: הִשָּׁמֶר לְךָ פֶּן־תַּעֲלֶה עֹלֹתֶיךָ בְּכָל־מָקוֹם אֲשֶׁר תִּרְאֶה׃
