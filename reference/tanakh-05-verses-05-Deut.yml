    section: torah
    chapter: 2
    verse: 30
    ordinal: 4966
    text: But Sihon king of Heshbon would not let us pass by him; for the LORD thy God hardened his spirit, and made his heart obstinate, that He might deliver him into thy hand, as appeareth this day.
    translation: JPS 1917
    original: וְלֹא אָבָה סִיחֹן מֶלֶךְ חֶשְׁבּוֹן הַעֲבִרֵנוּ בּוֹ כִּי־הִקְשָׁה יְהוָה אֱלֹהֶיךָ אֶת־רוּחוֹ וְאִמֵּץ אֶת־לְבָבוֹ לְמַעַן תִּתּוֹ בְיָדְךָ כַּיּוֹם הַזֶּה׃
    hebrewPlain: ולא אבה סיחן מלך חשבון העברנו בו כי הקשה יהוה אלהיך את רוחו ואמץ את לבבו למען תתו בידך כיום הזה
