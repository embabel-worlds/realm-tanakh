    scripture: tanakh
    name: Tanakh Deuteronomy 2:11
    ref: Deuteronomy 2:11
    book: Deut
    section: torah
    chapter: 2
    verse: 11
    ordinal: 4947
    text: these also are accounted Rephaim, as the Anakim; but the Moabites call them Emim.
    translation: JPS 1917
    original: רְפָאִים יֵחָשְׁבוּ אַף־הֵם כָּעֲנָקִים וְהַמֹּאָבִים יִקְרְאוּ לָהֶם אֵמִים׃
    hebrewPlain: רפאים יחשבו אף הם כענקים והמאבים יקראו להם אמים
