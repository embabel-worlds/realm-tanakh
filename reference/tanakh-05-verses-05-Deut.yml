- type: TanakhVerse
  data:
    osis: Deut.9.25
    scripture: tanakh
    name: Tanakh Deuteronomy 9:25
    ref: Deuteronomy 9:25
    book: Deut
    section: torah
    chapter: 9
    verse: 25
    ordinal: 5177
    text: So I fell down before the LORD the forty days and forty nights that I fell down; because the LORD had said He would destroy you.
    translation: JPS 1917
    original: וָאֶתְנַפַּל לִפְנֵי יְהוָה אֵת אַרְבָּעִים הַיּוֹם וְאֶת־אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי כִּי־אָמַר יְהוָה לְהַשְׁמִיד אֶתְכֶם׃
    hebrewPlain: ואתנפל לפני יהוה את ארבעים היום ואת ארבעים הלילה אשר התנפלתי כי אמר יהוה להשמיד אתכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:25
    kjvOsis:
    - Deut.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.26
    scripture: tanakh
    name: Tanakh Deuteronomy 9:26
    ref: Deuteronomy 9:26
    book: Deut
    section: torah
    chapter: 9
    verse: 26
    ordinal: 5178
    text: 'And I prayed unto the LORD, and said: ‘O Lord GOD, destroy not Thy people and Thine inheritance, that Thou hast redeemed through Thy greatness, that Thou hast brought forth out of Egypt with a mighty hand.'
    translation: JPS 1917
    original: וָאֶתְפַּלֵּל אֶל־יְהוָה וָאֹמַר אֲדֹנָי יְהוִה אַל־תַּשְׁחֵת עַמְּךָ וְנַחֲלָתְךָ אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ אֲשֶׁר־הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה׃
    hebrewPlain: ואתפלל אל יהוה ואמר אדני יהוה אל תשחת עמך ונחלתך אשר פדית בגדלך אשר הוצאת ממצרים ביד חזקה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:26
    kjvOsis:
    - Deut.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.27
    scripture: tanakh
    name: Tanakh Deuteronomy 9:27
    ref: Deuteronomy 9:27
    book: Deut
    section: torah
    chapter: 9
    verse: 27
    ordinal: 5179
    text: Remember Thy servants, Abraham, Isaac, and Jacob; look not unto the stubbornness of this people, nor to their wickedness, nor to their sin;
    translation: JPS 1917
    original: זְכֹר לַעֲבָדֶיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב אַל־תֵּפֶן אֶל־קְשִׁי הָעָם הַזֶּה וְאֶל־רִשְׁעוֹ וְאֶל־חַטָּאתוֹ׃
    hebrewPlain: זכר לעבדיך לאברהם ליצחק וליעקב אל תפן אל קשי העם הזה ואל רשעו ואל חטאתו
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:27
    kjvOsis:
    - Deut.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.28
    scripture: tanakh
    name: Tanakh Deuteronomy 9:28
    ref: Deuteronomy 9:28
    book: Deut
    section: torah
    chapter: 9
    verse: 28
    ordinal: 5180
    text: 'lest the land whence Thou broughtest us out say: Because the LORD was not able to bring them into the land which He promised unto them, and because He hated them, He hath brought them out to slay them in the wilderness.'
    translation: JPS 1917
    original: פֶּן־יֹאמְרוּ הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם מִבְּלִי יְכֹלֶת יְהוָה לַהֲבִיאָם אֶל־הָאָרֶץ אֲשֶׁר־דִּבֶּר לָהֶם וּמִשִּׂנְאָתוֹ אוֹתָם הוֹצִיאָם לַהֲמִתָם בַּמִּדְבָּר׃
    hebrewPlain: פן יאמרו הארץ אשר הוצאתנו משם מבלי יכלת יהוה להביאם אל הארץ אשר דבר להם ומשנאתו אותם הוציאם להמתם במדבר
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:28
    kjvOsis:
