- type: TanakhVerse
  data:
    osis: Deut.23.2
    scripture: tanakh
    name: Tanakh Deuteronomy 23:2
    ref: Deuteronomy 23:2
    book: Deut
    section: torah
    chapter: 23
    verse: 2
    ordinal: 5496
    text: He that is crushed or maimed in his privy parts shall not enter into the assembly of the LORD.
    translation: JPS 1917
    original: לֹא־יָבֹא פְצוּעַ־דַּכָּא וּכְרוּת שָׁפְכָה בִּקְהַל יְהוָה׃
    hebrewPlain: לא יבא פצוע דכא וכרות שפכה בקהל יהוה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:1
    kjvOsis:
    - Deut.23.1
  relations:
