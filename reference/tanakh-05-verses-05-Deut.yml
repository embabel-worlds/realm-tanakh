    scripture: tanakh
    name: Tanakh Deuteronomy 23:17
    ref: Deuteronomy 23:17
    book: Deut
    section: torah
    chapter: 23
    verse: 17
    ordinal: 5511
    text: he shall dwell with thee, in the midst of thee, in the place which he shall choose within one of thy gates, where it liketh him best; thou shalt not wrong him.
    translation: JPS 1917
    original: עִמְּךָ יֵשֵׁב בְּקִרְבְּךָ בַּמָּקוֹם אֲשֶׁר־יִבְחַר בְּאַחַד שְׁעָרֶיךָ בַּטּוֹב לוֹ לֹא תּוֹנֶנּוּ׃
    hebrewPlain: עמך ישב בקרבך במקום אשר יבחר באחד שעריך בטוב לו לא תוננו
    parashah: Ki Teitzei
    kjvRefs:
