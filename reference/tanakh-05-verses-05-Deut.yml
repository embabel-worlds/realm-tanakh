  data:
    osis: Deut.4.21
    scripture: tanakh
    name: Tanakh Deuteronomy 4:21
    ref: Deuteronomy 4:21
    book: Deut
    section: torah
    chapter: 4
    verse: 21
    ordinal: 5023
    text: Now the LORD was angered with me for your sakes, and swore that I should not go over the Jordan, and that I should not go in unto that good land, which the LORD thy God giveth thee for an inheritance;
    translation: JPS 1917
    original: וַיהוָה הִתְאַנֶּף־בִּי עַל־דִּבְרֵיכֶם וַיִּשָּׁבַע לְבִלְתִּי עָבְרִי אֶת־הַיַּרְדֵּן וּלְבִלְתִּי־בֹא אֶל־הָאָרֶץ הַטּוֹבָה אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה׃
    hebrewPlain: ויהוה התאנף בי על דבריכם וישבע לבלתי עברי את הירדן ולבלתי בא אל הארץ הטובה אשר יהוה אלהיך נתן לך נחלה
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:21
    kjvOsis:
    - Deut.4.21
