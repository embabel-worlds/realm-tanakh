  data:
    osis: Deut.28.20
    scripture: tanakh
    name: Tanakh Deuteronomy 28:20
    ref: Deuteronomy 28:20
    book: Deut
    section: torah
    chapter: 28
    verse: 20
    ordinal: 5626
    text: The LORD will send upon thee cursing, discomfiture, and rebuke, in all that thou puttest thy hand unto to do, until thou be destroyed, and until thou perish quickly; because of the evil of thy doings, whereby thou hast forsaken Me.
    translation: JPS 1917
    original: יְשַׁלַּח יְהוָה בְּךָ אֶת־הַמְּאֵרָה אֶת־הַמְּהוּמָה וְאֶת־הַמִּגְעֶרֶת בְּכָל־מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה עַד הִשָּׁמֶדְךָ וְעַד־אֲבָדְךָ מַהֵר מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי׃
    hebrewPlain: ישלח יהוה בך את המארה את המהומה ואת המגערת בכל משלח ידך אשר תעשה עד השמדך ועד אבדך מהר מפני רע מעלליך אשר עזבתני
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:20
    kjvOsis:
    - Deut.28.20
