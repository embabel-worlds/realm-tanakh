    scripture: tanakh
    name: Tanakh Deuteronomy 11:22
    ref: Deuteronomy 11:22
    book: Deut
    section: torah
    chapter: 11
    verse: 22
    ordinal: 5225
    text: For if ye shall diligently keep all this commandment which I command you, to do it, to love the LORD your God, to walk in all His ways, and to cleave unto Him,
    translation: JPS 1917
    original: כִּי אִם־שָׁמֹר תִּשְׁמְרוּן אֶת־כָּל־הַמִּצְוָה הַזֹּאת אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ לְאַהֲבָה אֶת־יְהוָה אֱלֹהֵיכֶם לָלֶכֶת בְּכָל־דְּרָכָיו וּלְדָבְקָה־בוֹ׃
    hebrewPlain: כי אם שמר תשמרון את כל המצוה הזאת אשר אנכי מצוה אתכם לעשתה לאהבה את יהוה אלהיכם ללכת בכל דרכיו ולדבקה בו
    parashah: Eikev
    kjvRefs:
