  data:
    osis: Deut.9.18
    scripture: tanakh
    name: Tanakh Deuteronomy 9:18
    ref: Deuteronomy 9:18
    book: Deut
    section: torah
    chapter: 9
    verse: 18
    ordinal: 5170
    text: And I fell down before the LORD, as at the first, forty days and forty nights; I did neither eat bread nor drink water; because of all your sin which ye sinned, in doing that which was evil in the sight of the LORD, to provoke Him.
    translation: JPS 1917
    original: וָאֶתְנַפַּל לִפְנֵי יְהוָה כָּרִאשֹׁנָה אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי עַל כָּל־חַטַּאתְכֶם אֲשֶׁר חֲטָאתֶם לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה לְהַכְעִיסוֹ׃
    hebrewPlain: ואתנפל לפני יהוה כראשנה ארבעים יום וארבעים לילה לחם לא אכלתי ומים לא שתיתי על כל חטאתכם אשר חטאתם לעשות הרע בעיני יהוה להכעיסו
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:18
    kjvOsis:
