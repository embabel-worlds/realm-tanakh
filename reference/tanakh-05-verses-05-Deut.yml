    scripture: tanakh
    name: Tanakh Deuteronomy 12:15
    ref: Deuteronomy 12:15
    book: Deut
    section: torah
    chapter: 12
    verse: 15
    ordinal: 5250
    text: Notwithstanding thou mayest kill and eat flesh within all thy gates, after all the desire of thy soul, according to the blessing of the LORD thy God which He hath given thee; the unclean and the clean may eat thereof, as of the gazelle, and as of the hart.
    translation: JPS 1917
    original: רַק בְּכָל־אַוַּת נַפְשְׁךָ תִּזְבַּח וְאָכַלְתָּ בָשָׂר כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן־לְךָ בְּכָל־שְׁעָרֶיךָ הַטָּמֵא וְהַטָּהוֹר יֹאכְלֶנּוּ כַּצְּבִי וְכָאַיָּל׃
    hebrewPlain: רק בכל אות נפשך תזבח ואכלת בשר כברכת יהוה אלהיך אשר נתן לך בכל שעריך הטמא והטהור יאכלנו כצבי וכאיל
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:15
    kjvOsis:
    - Deut.12.15
