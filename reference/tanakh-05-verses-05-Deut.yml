    scripture: tanakh
    name: Tanakh Deuteronomy 14:27
    ref: Deuteronomy 14:27
    book: Deut
    section: torah
    chapter: 14
    verse: 27
    ordinal: 5312
    text: And the Levite that is within thy gates, thou shalt not forsake him; for he hath no portion nor inheritance with thee.
    translation: JPS 1917
    original: וְהַלֵּוִי אֲשֶׁר־בִּשְׁעָרֶיךָ לֹא תַעַזְבֶנּוּ כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה עִמָּךְ׃
    hebrewPlain: והלוי אשר בשעריך לא תעזבנו כי אין לו חלק ונחלה עמך
    parashah: Re'eh
