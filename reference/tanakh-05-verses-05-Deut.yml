- type: TanakhVerse
  data:
    osis: Deut.20.3
    scripture: tanakh
    name: Tanakh Deuteronomy 20:3
    ref: Deuteronomy 20:3
    book: Deut
    section: torah
    chapter: 20
    verse: 3
    ordinal: 5425
    text: 'and shall say unto them: ‘Hear, O Israel, ye draw nigh this day unto battle against your enemies; let not your heart faint; fear not, nor be alarmed, neither be ye affrighted at them;'
    translation: JPS 1917
    original: וְאָמַר אֲלֵהֶם שְׁמַע יִשְׂרָאֵל אַתֶּם קְרֵבִים הַיּוֹם לַמִּלְחָמָה עַל־אֹיְבֵיכֶם אַל־יֵרַךְ לְבַבְכֶם אַל־תִּירְאוּ וְאַל־תַּחְפְּזוּ וְאַל־תַּעַרְצוּ מִפְּנֵיהֶם׃
    hebrewPlain: ואמר אלהם שמע ישראל אתם קרבים היום למלחמה על איביכם אל ירך לבבכם אל תיראו ואל תחפזו ואל תערצו מפניהם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:3
    kjvOsis:
    - Deut.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shoftim
- type: TanakhVerse
  data:
