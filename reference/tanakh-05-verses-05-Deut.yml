    scripture: tanakh
    name: Tanakh Deuteronomy 24:14
    ref: Deuteronomy 24:14
    book: Deut
    section: torah
    chapter: 24
    verse: 14
    ordinal: 5534
    text: Thou shalt not oppress a hired servant that is poor and needy, whether he be of thy brethren, or of thy strangers that are in thy land within thy gates.
    translation: JPS 1917
    original: לֹא־תַעֲשֹׁק שָׂכִיר עָנִי וְאֶבְיוֹן מֵאַחֶיךָ אוֹ מִגֵּרְךָ אֲשֶׁר בְּאַרְצְךָ בִּשְׁעָרֶיךָ׃
    hebrewPlain: לא תעשק שכיר עני ואביון מאחיך או מגרך אשר בארצך בשעריך
    parashah: Ki Teitzei
    kjvRefs:
