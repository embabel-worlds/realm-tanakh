    translation: JPS 1917
    original: וַנַּחֲרֵם אוֹתָם כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן הַחֲרֵם כָּל־עִיר מְתִם הַנָּשִׁים וְהַטָּף׃
    hebrewPlain: ונחרם אותם כאשר עשינו לסיחן מלך חשבון החרם כל עיר מתם הנשים והטף
