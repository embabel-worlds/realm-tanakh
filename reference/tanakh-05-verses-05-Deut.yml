    section: torah
    chapter: 24
    verse: 4
    ordinal: 5524
    text: her former husband, who sent her away, may not take her again to be his wife, after that she is defiled; for that is abomination before the LORD; and thou shalt not cause the land to sin, which the LORD thy God giveth thee for an inheritance.
    translation: JPS 1917
    original: לֹא־יוּכַל בַּעְלָהּ הָרִאשׁוֹן אֲשֶׁר־שִׁלְּחָהּ לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה כִּי־תוֹעֵבָה הִוא לִפְנֵי יְהוָה וְלֹא תַחֲטִיא אֶת־הָאָרֶץ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה׃
    hebrewPlain: לא יוכל בעלה הראשון אשר שלחה לשוב לקחתה להיות לו לאשה אחרי אשר הטמאה כי תועבה הוא לפני יהוה ולא תחטיא את הארץ אשר יהוה אלהיך נתן לך נחלה
    parashah: Ki Teitzei
