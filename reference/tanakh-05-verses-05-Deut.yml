    text: 'And the LORD said unto him: ‘This is the land which I swore unto Abraham, unto Isaac, and unto Jacob, saying: I will give it unto thy seed; I have caused thee to see it with thine eyes, but thou shalt not go over thither.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלָיו זֹאת הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לֵאמֹר לְזַרְעֲךָ אֶתְּנֶנָּה הֶרְאִיתִיךָ בְעֵינֶיךָ וְשָׁמָּה לֹא תַעֲבֹר׃
    hebrewPlain: ויאמר יהוה אליו זאת הארץ אשר נשבעתי לאברהם ליצחק וליעקב לאמר לזרעך אתננה הראיתיך בעיניך ושמה לא תעבר
    parashah: V'Zot HaBerachah
