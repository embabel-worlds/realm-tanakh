    osis: Deut.19.13
    scripture: tanakh
    name: Tanakh Deuteronomy 19:13
    ref: Deuteronomy 19:13
    book: Deut
    section: torah
    chapter: 19
    verse: 13
    ordinal: 5414
    text: Thine eye shall not pity him, but thou shalt put away the blood of the innocent from Israel, that it may go well with thee.
    translation: JPS 1917
    original: לֹא־תָחוֹס עֵינְךָ עָלָיו וּבִעַרְתָּ דַם־הַנָּקִי מִיִּשְׂרָאֵל וְטוֹב לָךְ׃
