  data:
    osis: Deut.14.26
    scripture: tanakh
    name: Tanakh Deuteronomy 14:26
    ref: Deuteronomy 14:26
    book: Deut
    section: torah
    chapter: 14
    verse: 26
    ordinal: 5311
    text: And thou shalt bestow the money for whatsoever thy soul desireth, for oxen, or for sheep, or for wine, or for strong drink, or for whatsoever thy soul asketh of thee; and thou shalt eat there before the LORD thy God, and thou shalt rejoice, thou and thy household.
    translation: JPS 1917
    original: וְנָתַתָּה הַכֶּסֶף בְּכֹל אֲשֶׁר־תְּאַוֶּה נַפְשְׁךָ בַּבָּקָר וּבַצֹּאן וּבַיַּיִן וּבַשֵּׁכָר וּבְכֹל אֲשֶׁר תִּשְׁאָלְךָ נַפְשֶׁךָ וְאָכַלְתָּ שָּׁם לִפְנֵי יְהוָה אֱלֹהֶיךָ וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ׃
    hebrewPlain: ונתתה הכסף בכל אשר תאוה נפשך בבקר ובצאן וביין ובשכר ובכל אשר תשאלך נפשך ואכלת שם לפני יהוה אלהיך ושמחת אתה וביתך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 14:26
    kjvOsis:
    - Deut.14.26
