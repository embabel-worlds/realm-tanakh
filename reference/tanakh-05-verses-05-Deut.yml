    scripture: tanakh
    name: Tanakh Deuteronomy 16:14
    ref: Deuteronomy 16:14
    book: Deut
    section: torah
    chapter: 16
    verse: 14
    ordinal: 5351
    text: And thou shalt rejoice in thy feast, thou, and thy son, and thy daughter, and thy man-servant, and thy maid-servant, and the Levite, and the stranger, and the fatherless, and the widow, that are within thy gates.
    translation: JPS 1917
    original: וְשָׂמַחְתָּ בְּחַגֶּךָ אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ וְהַלֵּוִי וְהַגֵּר וְהַיָּתוֹם וְהָאַלְמָנָה אֲשֶׁר בִּשְׁעָרֶיךָ׃
    hebrewPlain: ושמחת בחגך אתה ובנך ובתך ועבדך ואמתך והלוי והגר והיתום והאלמנה אשר בשעריך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 16:14
    kjvOsis:
    - Deut.16.14
