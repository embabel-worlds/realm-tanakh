    ref: Deuteronomy 23:12
    book: Deut
    section: torah
    chapter: 23
    verse: 12
    ordinal: 5506
    text: But it shall be, when evening cometh on, he shall bathe himself in water; and when the sun is down, he may come within the camp.
    translation: JPS 1917
    original: וְהָיָה לִפְנוֹת־עֶרֶב יִרְחַץ בַּמָּיִם וּכְבֹא הַשֶּׁמֶשׁ יָבֹא אֶל־תּוֹךְ הַמַּחֲנֶה׃
    hebrewPlain: והיה לפנות ערב ירחץ במים וכבא השמש יבא אל תוך המחנה
    parashah: Ki Teitzei
