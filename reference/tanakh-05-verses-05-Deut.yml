    text: Therefore thou shalt love the LORD thy God, and keep His charge, and His statutes, and His ordinances, and His commandments, alway.
    translation: JPS 1917
    original: וְאָהַבְתָּ אֵת יְהוָה אֱלֹהֶיךָ וְשָׁמַרְתָּ מִשְׁמַרְתּוֹ וְחֻקֹּתָיו וּמִשְׁפָּטָיו וּמִצְוֺתָיו כָּל־הַיָּמִים׃
