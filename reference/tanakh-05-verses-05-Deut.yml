    verse: 16
    ordinal: 5251
    text: Only ye shall not eat the blood; thou shalt pour it out upon the earth as water.
    translation: JPS 1917
    original: רַק הַדָּם לֹא תֹאכֵלוּ עַל־הָאָרֶץ תִּשְׁפְּכֶנּוּ כַּמָּיִם׃
    hebrewPlain: רק הדם לא תאכלו על הארץ תשפכנו כמים
