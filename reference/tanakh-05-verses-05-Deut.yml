    scripture: tanakh
    name: Tanakh Deuteronomy 11:19
    ref: Deuteronomy 11:19
    book: Deut
    section: torah
    chapter: 11
    verse: 19
    ordinal: 5222
    text: And ye shall teach them your children, talking of them, when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up.
    translation: JPS 1917
    original: וְלִמַּדְתֶּם אֹתָם אֶת־בְּנֵיכֶם לְדַבֵּר בָּם בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ׃
    hebrewPlain: ולמדתם אתם את בניכם לדבר בם בשבתך בביתך ובלכתך בדרך ובשכבך ובקומך
