  data:
    osis: Deut.21.16
    scripture: tanakh
    name: Tanakh Deuteronomy 21:16
    ref: Deuteronomy 21:16
    book: Deut
    section: torah
    chapter: 21
    verse: 16
    ordinal: 5458
    text: then it shall be, in the day that he causeth his sons to inherit that which he hath, that he may not make the son of the beloved the first-born before the son of the hated, who is the first-born;
    translation: JPS 1917
    original: וְהָיָה בְּיוֹם הַנְחִילוֹ אֶת־בָּנָיו אֵת אֲשֶׁר־יִהְיֶה לוֹ לֹא יוּכַל לְבַכֵּר אֶת־בֶּן־הָאֲהוּבָה עַל־פְּנֵי בֶן־הַשְּׂנוּאָה הַבְּכֹר׃
    hebrewPlain: והיה ביום הנחילו את בניו את אשר יהיה לו לא יוכל לבכר את בן האהובה על פני בן השנואה הבכר
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:16
    kjvOsis:
    - Deut.21.16
