      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.3
    scripture: tanakh
    name: Tanakh Deuteronomy 9:3
    ref: Deuteronomy 9:3
    book: Deut
    section: torah
    chapter: 9
    verse: 3
    ordinal: 5155
    text: Know therefore this day, that the LORD thy God is He who goeth over before thee as a devouring fire; He will destroy them, and He will bring them down before thee; so shalt thou drive them out, and make them to perish quickly, as the LORD hath spoken unto thee.
    translation: JPS 1917
    original: וְיָדַעְתָּ הַיּוֹם כִּי יְהוָה אֱלֹהֶיךָ הוּא־הָעֹבֵר לְפָנֶיךָ אֵשׁ אֹכְלָה הוּא יַשְׁמִידֵם וְהוּא יַכְנִיעֵם לְפָנֶיךָ וְהוֹרַשְׁתָּם וְהַאַבַדְתָּם מַהֵר כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ׃
    hebrewPlain: וידעת היום כי יהוה אלהיך הוא העבר לפניך אש אכלה הוא ישמידם והוא יכניעם לפניך והורשתם והאבדתם מהר כאשר דבר יהוה לך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:3
    kjvOsis:
    - Deut.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.4
    scripture: tanakh
    name: Tanakh Deuteronomy 9:4
    ref: Deuteronomy 9:4
    book: Deut
    section: torah
    chapter: 9
    verse: 4
    ordinal: 5156
    text: 'Speak not thou in thy heart, after that the LORD thy God hath thrust them out from before thee, saying: ‘For my righteousness the LORD hath brought me in to possess this land’; whereas for the wickedness of these nations the LORD doth drive them out from before thee.'
    translation: JPS 1917
    original: אַל־תֹּאמַר בִּלְבָבְךָ בַּהֲדֹף יְהוָה אֱלֹהֶיךָ אֹתָם מִלְּפָנֶיךָ לֵאמֹר בְּצִדְקָתִי הֱבִיאַנִי יְהוָה לָרֶשֶׁת אֶת־הָאָרֶץ הַזֹּאת וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה יְהוָה מוֹרִישָׁם מִפָּנֶיךָ׃
    hebrewPlain: אל תאמר בלבבך בהדף יהוה אלהיך אתם מלפניך לאמר בצדקתי הביאני יהוה לרשת את הארץ הזאת וברשעת הגוים האלה יהוה מורישם מפניך
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:4
    kjvOsis:
    - Deut.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.5
    scripture: tanakh
    name: Tanakh Deuteronomy 9:5
    ref: Deuteronomy 9:5
    book: Deut
    section: torah
    chapter: 9
    verse: 5
    ordinal: 5157
    text: Not for thy righteousness, or for the uprightness of thy heart, dost thou go in to possess their land; but for the wickedness of these nations the LORD thy God doth drive them out from before thee, and that He may establish the word which the LORD swore unto thy fathers, to Abraham, to Isaac, and to Jacob.
    translation: JPS 1917
    original: לֹא בְצִדְקָתְךָ וּבְיֹשֶׁר לְבָבְךָ אַתָּה בָא לָרֶשֶׁת אֶת־אַרְצָם כִּי בְּרִשְׁעַת הַגּוֹיִם הָאֵלֶּה יְהוָה אֱלֹהֶיךָ מוֹרִישָׁם מִפָּנֶיךָ וּלְמַעַן הָקִים אֶת־הַדָּבָר אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב׃
    hebrewPlain: לא בצדקתך ובישר לבבך אתה בא לרשת את ארצם כי ברשעת הגוים האלה יהוה אלהיך מורישם מפניך ולמען הקים את הדבר אשר נשבע יהוה לאבתיך לאברהם ליצחק וליעקב
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:5
    kjvOsis:
    - Deut.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.6
    scripture: tanakh
    name: Tanakh Deuteronomy 9:6
    ref: Deuteronomy 9:6
    book: Deut
    section: torah
    chapter: 9
    verse: 6
    ordinal: 5158
    text: Know therefore that it is not for thy righteousness that the LORD thy God giveth thee this good land to possess it; for thou art a stiffnecked people.
    translation: JPS 1917
    original: וְיָדַעְתָּ כִּי לֹא בְצִדְקָתְךָ יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ אֶת־הָאָרֶץ הַטּוֹבָה הַזֹּאת לְרִשְׁתָּהּ כִּי עַם־קְשֵׁה־עֹרֶף אָתָּה׃
    hebrewPlain: וידעת כי לא בצדקתך יהוה אלהיך נתן לך את הארץ הטובה הזאת לרשתה כי עם קשה ערף אתה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:6
    kjvOsis:
    - Deut.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.7
    scripture: tanakh
    name: Tanakh Deuteronomy 9:7
    ref: Deuteronomy 9:7
    book: Deut
    section: torah
    chapter: 9
    verse: 7
    ordinal: 5159
    text: Remember, forget thou not, how thou didst make the LORD thy God wroth in the wilderness; from the day that thou didst go forth out of the land of Egypt, until ye came unto this place, ye have been rebellious against the LORD.
    translation: JPS 1917
    original: זְכֹר אַל־תִּשְׁכַּח אֵת אֲשֶׁר־הִקְצַפְתָּ אֶת־יְהוָה אֱלֹהֶיךָ בַּמִּדְבָּר לְמִן־הַיּוֹם אֲשֶׁר־יָצָאתָ מֵאֶרֶץ מִצְרַיִם עַד־בֹּאֲכֶם עַד־הַמָּקוֹם הַזֶּה מַמְרִים הֱיִיתֶם עִם־יְהוָה׃
    hebrewPlain: זכר אל תשכח את אשר הקצפת את יהוה אלהיך במדבר למן היום אשר יצאת מארץ מצרים עד באכם עד המקום הזה ממרים הייתם עם יהוה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:7
    kjvOsis:
    - Deut.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.8
    scripture: tanakh
    name: Tanakh Deuteronomy 9:8
    ref: Deuteronomy 9:8
    book: Deut
    section: torah
    chapter: 9
    verse: 8
    ordinal: 5160
    text: Also in Horeb ye made the LORD wroth, and the LORD was angered with you to have destroyed you.
    translation: JPS 1917
    original: וּבְחֹרֵב הִקְצַפְתֶּם אֶת־יְהוָה וַיִּתְאַנַּף יְהוָה בָּכֶם לְהַשְׁמִיד אֶתְכֶם׃
    hebrewPlain: ובחרב הקצפתם את יהוה ויתאנף יהוה בכם להשמיד אתכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:8
    kjvOsis:
    - Deut.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.9
    scripture: tanakh
    name: Tanakh Deuteronomy 9:9
    ref: Deuteronomy 9:9
    book: Deut
    section: torah
    chapter: 9
    verse: 9
    ordinal: 5161
    text: When I was gone up into the mount to receive the tables of stone, even the tables of the covenant which the LORD made with you, then I abode in the mount forty days and forty nights; I did neither eat bread nor drink water.
    translation: JPS 1917
    original: בַּעֲלֹתִי הָהָרָה לָקַחַת לוּחֹת הָאֲבָנִים לוּחֹת הַבְּרִית אֲשֶׁר־כָּרַת יְהוָה עִמָּכֶם וָאֵשֵׁב בָּהָר אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי׃
    hebrewPlain: בעלתי ההרה לקחת לוחת האבנים לוחת הברית אשר כרת יהוה עמכם ואשב בהר ארבעים יום וארבעים לילה לחם לא אכלתי ומים לא שתיתי
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:9
    kjvOsis:
    - Deut.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.10
    scripture: tanakh
    name: Tanakh Deuteronomy 9:10
    ref: Deuteronomy 9:10
    book: Deut
    section: torah
    chapter: 9
    verse: 10
    ordinal: 5162
    text: And the LORD delivered unto me the two tables of stone written with the finger of God; and on them was written according to all the words, which the LORD spoke with you in the mount out of the midst of the fire in the day of the assembly.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה אֵלַי אֶת־שְׁנֵי לוּחֹת הָאֲבָנִים כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים וַעֲלֵיהֶם כְּכָל־הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם בָּהָר מִתּוֹךְ הָאֵשׁ בְּיוֹם הַקָּהָל׃
    hebrewPlain: ויתן יהוה אלי את שני לוחת האבנים כתבים באצבע אלהים ועליהם ככל הדברים אשר דבר יהוה עמכם בהר מתוך האש ביום הקהל
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:10
    kjvOsis:
    - Deut.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.11
    scripture: tanakh
    name: Tanakh Deuteronomy 9:11
    ref: Deuteronomy 9:11
    book: Deut
    section: torah
    chapter: 9
    verse: 11
    ordinal: 5163
    text: And it came to pass at the end of forty days and forty nights, that the LORD gave me the two tables of stone, even the tables of the covenant.
    translation: JPS 1917
    original: וַיְהִי מִקֵּץ אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה נָתַן יְהוָה אֵלַי אֶת־שְׁנֵי לֻחֹת הָאֲבָנִים לֻחוֹת הַבְּרִית׃
    hebrewPlain: ויהי מקץ ארבעים יום וארבעים לילה נתן יהוה אלי את שני לחת האבנים לחות הברית
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:11
    kjvOsis:
    - Deut.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.9.12
    scripture: tanakh
    name: Tanakh Deuteronomy 9:12
    ref: Deuteronomy 9:12
    book: Deut
    section: torah
    chapter: 9
    verse: 12
    ordinal: 5164
    text: 'And the LORD said unto me: ‘Arise, get thee down quickly from hence; for thy people that thou hast brought forth out of Egypt have dealt corruptly; they are quickly turned aside out of the way which I commanded them; they have made them a molten image.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי קוּם רֵד מַהֵר מִזֶּה כִּי שִׁחֵת עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם סָרוּ מַהֵר מִן־הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם עָשׂוּ לָהֶם מַסֵּכָה׃
    hebrewPlain: ויאמר יהוה אלי קום רד מהר מזה כי שחת עמך אשר הוצאת ממצרים סרו מהר מן הדרך אשר צויתם עשו להם מסכה
    parashah: Eikev
    kjvRefs:
