    translation: JPS 1917
    original: בְּשִׁבְעִים נֶפֶשׁ יָרְדוּ אֲבֹתֶיךָ מִצְרָיְמָהּ וְעַתָּה שָׂמְךָ יְהוָה אֱלֹהֶיךָ כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב׃
