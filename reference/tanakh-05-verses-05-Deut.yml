  data:
    osis: Deut.28.54
    scripture: tanakh
    name: Tanakh Deuteronomy 28:54
    ref: Deuteronomy 28:54
    book: Deut
    section: torah
    chapter: 28
    verse: 54
    ordinal: 5660
    text: The man that is tender among you, and very delicate, his eye shall be evil against his brother, and against the wife of his bosom, and against the remnant of his children whom he hath remaining;
    translation: JPS 1917
    original: הָאִישׁ הָרַךְ בְּךָ וְהֶעָנֹג מְאֹד תֵּרַע עֵינוֹ בְאָחִיו וּבְאֵשֶׁת חֵיקוֹ וּבְיֶתֶר בָּנָיו אֲשֶׁר יוֹתִיר׃
    hebrewPlain: האיש הרך בך והענג מאד תרע עינו באחיו ובאשת חיקו וביתר בניו אשר יותיר
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:54
    kjvOsis:
    - Deut.28.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.55
    scripture: tanakh
    name: Tanakh Deuteronomy 28:55
    ref: Deuteronomy 28:55
    book: Deut
    section: torah
    chapter: 28
    verse: 55
    ordinal: 5661
    text: so that he will not give to any of them of the flesh of his children whom he shall eat, because he hath nothing left him; in the siege and in the straitness, wherewith thine enemy shall straiten thee in all thy gates.
    translation: JPS 1917
    original: מִתֵּת לְאַחַד מֵהֶם מִבְּשַׂר בָּנָיו אֲשֶׁר יֹאכֵל מִבְּלִי הִשְׁאִיר־לוֹ כֹּל בְּמָצוֹר וּבְמָצוֹק אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ בְּכָל־שְׁעָרֶיךָ׃
    hebrewPlain: מתת לאחד מהם מבשר בניו אשר יאכל מבלי השאיר לו כל במצור ובמצוק אשר יציק לך איבך בכל שעריך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:55
    kjvOsis:
    - Deut.28.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.56
    scripture: tanakh
    name: Tanakh Deuteronomy 28:56
    ref: Deuteronomy 28:56
    book: Deut
    section: torah
    chapter: 28
    verse: 56
    ordinal: 5662
    text: The tender and delicate woman among you, who would not adventure to set the sole of her foot upon the ground for delicateness and tenderness, her eye shall be evil against the husband of her bosom, and against her son, and against her daughter;
    translation: JPS 1917
    original: הָרַכָּה בְךָ וְהָעֲנֻגָּה אֲשֶׁר לֹא־נִסְּתָה כַף־רַגְלָהּ הַצֵּג עַל־הָאָרֶץ מֵהִתְעַנֵּג וּמֵרֹךְ תֵּרַע עֵינָהּ בְּאִישׁ חֵיקָהּ וּבִבְנָהּ וּבְבִתָּהּ׃
    hebrewPlain: הרכה בך והענגה אשר לא נסתה כף רגלה הצג על הארץ מהתענג ומרך תרע עינה באיש חיקה ובבנה ובבתה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:56
    kjvOsis:
    - Deut.28.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.57
    scripture: tanakh
    name: Tanakh Deuteronomy 28:57
    ref: Deuteronomy 28:57
    book: Deut
    section: torah
    chapter: 28
    verse: 57
    ordinal: 5663
    text: and against her afterbirth that cometh out from between her feet, and against her children whom she shall bear; for she shall eat them for want of all things secretly; in the siege and in the straitness, wherewith thine enemy shall straiten thee in thy gates.
    translation: JPS 1917
    original: וּבְשִׁלְיָתָהּ הַיּוֹצֵת מִבֵּין רַגְלֶיהָ וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד כִּי־תֹאכְלֵם בְּחֹסֶר־כֹּל בַּסָּתֶר בְּמָצוֹר וּבְמָצוֹק אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ בִּשְׁעָרֶיךָ׃
    hebrewPlain: ובשליתה היוצת מבין רגליה ובבניה אשר תלד כי תאכלם בחסר כל בסתר במצור ובמצוק אשר יציק לך איבך בשעריך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:57
    kjvOsis:
    - Deut.28.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.58
    scripture: tanakh
    name: Tanakh Deuteronomy 28:58
    ref: Deuteronomy 28:58
    book: Deut
    section: torah
    chapter: 28
    verse: 58
    ordinal: 5664
    text: If thou wilt not observe to do all the words of this law that are written in this book, that thou mayest fear this glorious and awful Name, the LORD thy God;
    translation: JPS 1917
    original: אִם־לֹא תִשְׁמֹר לַעֲשׂוֹת אֶת־כָּל־דִּבְרֵי הַתּוֹרָה הַזֹּאת הַכְּתוּבִים בַּסֵּפֶר הַזֶּה לְיִרְאָה אֶת־הַשֵּׁם הַנִּכְבָּד וְהַנּוֹרָא הַזֶּה אֵת יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: אם לא תשמר לעשות את כל דברי התורה הזאת הכתובים בספר הזה ליראה את השם הנכבד והנורא הזה את יהוה אלהיך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:58
    kjvOsis:
    - Deut.28.58
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.59
    scripture: tanakh
    name: Tanakh Deuteronomy 28:59
    ref: Deuteronomy 28:59
    book: Deut
    section: torah
    chapter: 28
    verse: 59
    ordinal: 5665
    text: then the LORD will make thy plagues wonderful, and the plagues of thy seed, even great plagues, and of long continuance, and sore sicknesses, and of long continuance.
    translation: JPS 1917
    original: וְהִפְלָא יְהוָה אֶת־מַכֹּתְךָ וְאֵת מַכּוֹת זַרְעֶךָ מַכּוֹת גְּדֹלוֹת וְנֶאֱמָנוֹת וָחֳלָיִם רָעִים וְנֶאֱמָנִים׃
    hebrewPlain: והפלא יהוה את מכתך ואת מכות זרעך מכות גדלות ונאמנות וחלים רעים ונאמנים
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:59
    kjvOsis:
    - Deut.28.59
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.60
    scripture: tanakh
    name: Tanakh Deuteronomy 28:60
    ref: Deuteronomy 28:60
    book: Deut
    section: torah
    chapter: 28
    verse: 60
    ordinal: 5666
    text: And He will bring back upon thee all the diseases of Egypt, which thou wast in dread of; and they shall cleave unto thee.
    translation: JPS 1917
    original: וְהֵשִׁיב בְּךָ אֵת כָּל־מַדְוֵה מִצְרַיִם אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם וְדָבְקוּ בָּךְ׃
    hebrewPlain: והשיב בך את כל מדוה מצרים אשר יגרת מפניהם ודבקו בך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:60
    kjvOsis:
    - Deut.28.60
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.61
    scripture: tanakh
    name: Tanakh Deuteronomy 28:61
    ref: Deuteronomy 28:61
    book: Deut
    section: torah
    chapter: 28
    verse: 61
    ordinal: 5667
    text: Also every sickness, and every plague, which is not written in the book of this law, them will the LORD bring upon thee, until thou be destroyed.
    translation: JPS 1917
    original: גַּם כָּל־חֳלִי וְכָל־מַכָּה אֲשֶׁר לֹא כָתוּב בְּסֵפֶר הַתּוֹרָה הַזֹּאת יַעְלֵם יְהוָה עָלֶיךָ עַד הִשָּׁמְדָךְ׃
    hebrewPlain: גם כל חלי וכל מכה אשר לא כתוב בספר התורה הזאת יעלם יהוה עליך עד השמדך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:61
    kjvOsis:
    - Deut.28.61
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.62
    scripture: tanakh
    name: Tanakh Deuteronomy 28:62
    ref: Deuteronomy 28:62
    book: Deut
    section: torah
    chapter: 28
    verse: 62
    ordinal: 5668
    text: And ye shall be left few in number, whereas ye were as the stars of heaven for multitude; because thou didst not hearken unto the voice of the LORD thy God.
    translation: JPS 1917
    original: וְנִשְׁאַרְתֶּם בִּמְתֵי מְעָט תַּחַת אֲשֶׁר הֱיִיתֶם כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב כִּי־לֹא שָׁמַעְתָּ בְּקוֹל יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ונשארתם במתי מעט תחת אשר הייתם ככוכבי השמים לרב כי לא שמעת בקול יהוה אלהיך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:62
    kjvOsis:
    - Deut.28.62
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.63
    scripture: tanakh
    name: Tanakh Deuteronomy 28:63
    ref: Deuteronomy 28:63
    book: Deut
    section: torah
    chapter: 28
    verse: 63
    ordinal: 5669
    text: And it shall come to pass, that as the LORD rejoiced over you to do you good, and to multiply you; so the LORD will rejoice over you to cause you to perish, and to destroy you; and ye shall be plucked from off the land whither thou goest in to possess it.
    translation: JPS 1917
    original: וְהָיָה כַּאֲשֶׁר־שָׂשׂ יְהוָה עֲלֵיכֶם לְהֵיטִיב אֶתְכֶם וּלְהַרְבּוֹת אֶתְכֶם כֵּן יָשִׂישׂ יְהוָה עֲלֵיכֶם לְהַאֲבִיד אֶתְכֶם וּלְהַשְׁמִיד אֶתְכֶם וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: והיה כאשר שש יהוה עליכם להיטיב אתכם ולהרבות אתכם כן ישיש יהוה עליכם להאביד אתכם ולהשמיד אתכם ונסחתם מעל האדמה אשר אתה בא שמה לרשתה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:63
    kjvOsis:
    - Deut.28.63
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.64
    scripture: tanakh
    name: Tanakh Deuteronomy 28:64
    ref: Deuteronomy 28:64
    book: Deut
    section: torah
    chapter: 28
    verse: 64
    ordinal: 5670
    text: And the LORD shall scatter thee among all peoples, from the one end of the earth even unto the other end of the earth; and there thou shalt serve other gods, which thou hast not known, thou nor thy fathers, even wood and stone.
    translation: JPS 1917
    original: וֶהֱפִיצְךָ יְהוָה בְּכָל־הָעַמִּים מִקְצֵה הָאָרֶץ וְעַד־קְצֵה הָאָרֶץ וְעָבַדְתָּ שָּׁם אֱלֹהִים אֲחֵרִים אֲשֶׁר לֹא־יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ עֵץ וָאָבֶן׃
    hebrewPlain: והפיצך יהוה בכל העמים מקצה הארץ ועד קצה הארץ ועבדת שם אלהים אחרים אשר לא ידעת אתה ואבתיך עץ ואבן
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:64
    kjvOsis:
    - Deut.28.64
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.65
    scripture: tanakh
    name: Tanakh Deuteronomy 28:65
    ref: Deuteronomy 28:65
    book: Deut
    section: torah
    chapter: 28
    verse: 65
    ordinal: 5671
    text: And among these nations shalt thou have no repose, and there shall be no rest for the sole of thy foot; but the LORD shall give thee there a trembling heart, and failing of eyes, and languishing of soul.
    translation: JPS 1917
    original: וּבַגּוֹיִם הָהֵם לֹא תַרְגִּיעַ וְלֹא־יִהְיֶה מָנוֹחַ לְכַף־רַגְלֶךָ וְנָתַן יְהוָה לְךָ שָׁם לֵב רַגָּז וְכִלְיוֹן עֵינַיִם וְדַאֲבוֹן נָפֶשׁ׃
    hebrewPlain: ובגוים ההם לא תרגיע ולא יהיה מנוח לכף רגלך ונתן יהוה לך שם לב רגז וכליון עינים ודאבון נפש
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:65
    kjvOsis:
    - Deut.28.65
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.66
    scripture: tanakh
    name: Tanakh Deuteronomy 28:66
    ref: Deuteronomy 28:66
    book: Deut
    section: torah
    chapter: 28
    verse: 66
    ordinal: 5672
    text: And thy life shall hang in doubt before thee; and thou shalt fear night and day, and shalt have no assurance of thy life.
    translation: JPS 1917
    original: וְהָיוּ חַיֶּיךָ תְּלֻאִים לְךָ מִנֶּגֶד וּפָחַדְתָּ לַיְלָה וְיוֹמָם וְלֹא תַאֲמִין בְּחַיֶּיךָ׃
    hebrewPlain: והיו חייך תלאים לך מנגד ופחדת לילה ויומם ולא תאמין בחייך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:66
    kjvOsis:
    - Deut.28.66
  relations:
  - predicate: IN
    to:
