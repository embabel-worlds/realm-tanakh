    translation: JPS 1917
    original: כִּי חֵלֶק יְהֹוָה עַמּוֹ יַעֲקֹב חֶבֶל נַחֲלָתוֹ׃
    hebrewPlain: כי חלק יהוה עמו יעקב חבל נחלתו
