  data:
    osis: Deut.1.26
    scripture: tanakh
    name: Tanakh Deuteronomy 1:26
    ref: Deuteronomy 1:26
    book: Deut
    section: torah
    chapter: 1
    verse: 26
    ordinal: 4916
    text: Yet ye would not go up, but rebelled against the commandment of the LORD your God;
    translation: JPS 1917
    original: וְלֹא אֲבִיתֶם לַעֲלֹת וַתַּמְרוּ אֶת־פִּי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ולא אביתם לעלת ותמרו את פי יהוה אלהיכם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 1:26
    kjvOsis:
    - Deut.1.26
