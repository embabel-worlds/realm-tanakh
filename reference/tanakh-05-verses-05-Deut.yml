    verse: 14
    ordinal: 5166
    text: let Me alone, that I may destroy them, and blot out their name from under heaven; and I will make of thee a nation mightier and greater than they.’
    translation: JPS 1917
    original: הֶרֶף מִמֶּנִּי וְאַשְׁמִידֵם וְאֶמְחֶה אֶת־שְׁמָם מִתַּחַת הַשָּׁמָיִם וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי־עָצוּם וָרָב מִמֶּנּוּ׃
    hebrewPlain: הרף ממני ואשמידם ואמחה את שמם מתחת השמים ואעשה אותך לגוי עצום ורב ממנו
