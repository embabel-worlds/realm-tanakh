    ordinal: 5008
    text: 'Observe therefore and do them; for this is your wisdom and your understanding in the sight of the peoples, that, when they hear all these statutes, shall say: ‘Surely this great nation is a wise and understanding people.’'
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם כִּי הִוא חָכְמַתְכֶם וּבִינַתְכֶם לְעֵינֵי הָעַמִּים אֲשֶׁר יִשְׁמְעוּן אֵת כָּל־הַחֻקִּים הָאֵלֶּה וְאָמְרוּ רַק עַם־חָכָם וְנָבוֹן הַגּוֹי הַגָּדוֹל הַזֶּה׃
    hebrewPlain: ושמרתם ועשיתם כי הוא חכמתכם ובינתכם לעיני העמים אשר ישמעון את כל החקים האלה ואמרו רק עם חכם ונבון הגוי הגדול הזה
