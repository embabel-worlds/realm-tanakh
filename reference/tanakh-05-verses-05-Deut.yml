    translation: JPS 1917
    original: לֹא תַטֶּה מִשְׁפַּט גֵּר יָתוֹם וְלֹא תַחֲבֹל בֶּגֶד אַלְמָנָה׃
    hebrewPlain: לא תטה משפט גר יתום ולא תחבל בגד אלמנה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 24:17
    kjvOsis:
