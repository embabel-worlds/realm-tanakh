    scripture: tanakh
    name: Tanakh Deuteronomy 24:11
    ref: Deuteronomy 24:11
    book: Deut
    section: torah
    chapter: 24
    verse: 11
    ordinal: 5531
    text: Thou shalt stand without, and the man to whom thou dost lend shall bring forth the pledge without unto thee.
    translation: JPS 1917
    original: בַּחוּץ תַּעֲמֹד וְהָאִישׁ אֲשֶׁר אַתָּה נֹשֶׁה בוֹ יוֹצִיא אֵלֶיךָ אֶת־הַעֲבוֹט הַחוּצָה׃
    hebrewPlain: בחוץ תעמד והאיש אשר אתה נשה בו יוציא אליך את העבוט החוצה
    parashah: Ki Teitzei
    kjvRefs:
