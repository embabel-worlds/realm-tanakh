  data:
    osis: Deut.6.25
    scripture: tanakh
    name: Tanakh Deuteronomy 6:25
    ref: Deuteronomy 6:25
    book: Deut
    section: torah
    chapter: 6
    verse: 25
    ordinal: 5106
    text: And it shall be righteousness unto us, if we observe to do all this commandment before the LORD our God, as He hath commanded us.’
    translation: JPS 1917
    original: וּצְדָקָה תִּהְיֶה־לָּנוּ כִּי־נִשְׁמֹר לַעֲשׂוֹת אֶת־כָּל־הַמִּצְוָה הַזֹּאת לִפְנֵי יְהוָה אֱלֹהֵינוּ כַּאֲשֶׁר צִוָּנוּ׃
    hebrewPlain: וצדקה תהיה לנו כי נשמר לעשות את כל המצוה הזאת לפני יהוה אלהינו כאשר צונו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 6:25
    kjvOsis:
    - Deut.6.25
