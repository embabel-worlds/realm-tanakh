    scripture: tanakh
    name: Tanakh Deuteronomy 24:7
    ref: Deuteronomy 24:7
    book: Deut
    section: torah
    chapter: 24
    verse: 7
    ordinal: 5527
    text: If a man be found stealing any of his brethren of the children of Israel, and he deal with him as a slave, and sell him; then that thief shall die; so shalt thou put away the evil from the midst of thee.
    translation: JPS 1917
    original: כִּי־יִמָּצֵא אִישׁ גֹּנֵב נֶפֶשׁ מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל וְהִתְעַמֶּר־בּוֹ וּמְכָרוֹ וּמֵת הַגַּנָּב הַהוּא וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: כי ימצא איש גנב נפש מאחיו מבני ישראל והתעמר בו ומכרו ומת הגנב ההוא ובערת הרע מקרבך
    parashah: Ki Teitzei
