- type: TanakhVerse
  data:
    osis: Deut.30.6
    scripture: tanakh
    name: Tanakh Deuteronomy 30:6
    ref: Deuteronomy 30:6
    book: Deut
    section: torah
    chapter: 30
    verse: 6
    ordinal: 5709
    text: And the LORD thy God will circumcise thy heart, and the heart of thy seed, to love the LORD thy God with all thy heart, and with all thy soul, that thou mayest live.
    translation: JPS 1917
    original: וּמָל יְהוָה אֱלֹהֶיךָ אֶת־לְבָבְךָ וְאֶת־לְבַב זַרְעֶךָ לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ לְמַעַן חַיֶּיךָ׃
    hebrewPlain: ומל יהוה אלהיך את לבבך ואת לבב זרעך לאהבה את יהוה אלהיך בכל לבבך ובכל נפשך למען חייך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:6
    kjvOsis:
    - Deut.30.6
