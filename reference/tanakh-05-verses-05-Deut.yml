    scripture: tanakh
    name: Tanakh Deuteronomy 17:3
    ref: Deuteronomy 17:3
    book: Deut
    section: torah
    chapter: 17
    verse: 3
    ordinal: 5362
    text: and hath gone and served other gods, and worshipped them, or the sun, or the moon, or any of the host of heaven, which I have commanded not;
    translation: JPS 1917
    original: וַיֵּלֶךְ וַיַּעֲבֹד אֱלֹהִים אֲחֵרִים וַיִּשְׁתַּחוּ לָהֶם וְלַשֶּׁמֶשׁ אוֹ לַיָּרֵחַ אוֹ לְכָל־צְבָא הַשָּׁמַיִם אֲשֶׁר לֹא־צִוִּיתִי׃
    hebrewPlain: וילך ויעבד אלהים אחרים וישתחו להם ולשמש או לירח או לכל צבא השמים אשר לא צויתי
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:3
    kjvOsis:
    - Deut.17.3
