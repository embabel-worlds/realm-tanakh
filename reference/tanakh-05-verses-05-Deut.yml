    translation: JPS 1917
    original: וַיִּשְׁכֹּן יִשְׂרָאֵל בֶּטַח בָּדָד עֵין יַעֲקֹב אֶל־אֶרֶץ דָּגָן וְתִירוֹשׁ אַף־שָׁמָיו יַעַרְפוּ טָל׃
    hebrewPlain: וישכן ישראל בטח בדד עין יעקב אל ארץ דגן ותירוש אף שמיו יערפו טל
