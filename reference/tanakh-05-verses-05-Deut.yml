      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.22.29
    scripture: tanakh
    name: Tanakh Deuteronomy 22:29
    ref: Deuteronomy 22:29
    book: Deut
    section: torah
    chapter: 22
    verse: 29
    ordinal: 5494
    text: then the man that lay with her shall give unto the damsel’s father fifty shekels of silver, and she shall be his wife, because he hath humbled her; he may not put her away all his days.
    translation: JPS 1917
    original: וְנָתַן הָאִישׁ הַשֹּׁכֵב עִמָּהּ לַאֲבִי הנער [הַנַּעֲרָה] חֲמִשִּׁים כָּסֶף וְלוֹ־תִהְיֶה לְאִשָּׁה תַּחַת אֲשֶׁר עִנָּהּ לֹא־יוּכַל שַׁלְּחָה כָּל־יָמָיו׃
    hebrewPlain: ונתן האיש השכב עמה לאבי הנער [הנערה] חמשים כסף ולו תהיה לאשה תחת אשר ענה לא יוכל שלחה כל ימיו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:29
    kjvOsis:
    - Deut.22.29
  relations:
