    verse: 27
    ordinal: 5750
    text: For I know thy rebellion, and thy stiff neck; behold, while I am yet alive with you this day, ye have been rebellious against the LORD; and how much more after my death?
    translation: JPS 1917
    original: כִּי אָנֹכִי יָדַעְתִּי אֶת־מֶרְיְךָ וְאֶת־עָרְפְּךָ הַקָּשֶׁה הֵן בְּעוֹדֶנִּי חַי עִמָּכֶם הַיּוֹם מַמְרִים הֱיִתֶם עִם־יְהֹוָה וְאַף כִּי־אַחֲרֵי מוֹתִי׃
    hebrewPlain: כי אנכי ידעתי את מריך ואת ערפך הקשה הן בעודני חי עמכם היום ממרים היתם עם יהוה ואף כי אחרי מותי
    parashah: Vayeilech
    kjvRefs:
