    scripture: tanakh
    name: Tanakh Deuteronomy 18:16
    ref: Deuteronomy 18:16
    book: Deut
    section: torah
    chapter: 18
    verse: 16
    ordinal: 5395
    text: 'according to all that thou didst desire of the LORD thy God in Horeb in the day of the assembly, saying: ‘Let me not hear again the voice of the LORD my God, neither let me see this great fire any more, that I die not.’'
    translation: JPS 1917
    original: כְּכֹל אֲשֶׁר־שָׁאַלְתָּ מֵעִם יְהוָה אֱלֹהֶיךָ בְּחֹרֵב בְּיוֹם הַקָּהָל לֵאמֹר לֹא אֹסֵף לִשְׁמֹעַ אֶת־קוֹל יְהוָה אֱלֹהָי וְאֶת־הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא־אֶרְאֶה עוֹד וְלֹא אָמוּת׃
    hebrewPlain: ככל אשר שאלת מעם יהוה אלהיך בחרב ביום הקהל לאמר לא אסף לשמע את קול יהוה אלהי ואת האש הגדלה הזאת לא אראה עוד ולא אמות
    parashah: Shoftim
    kjvRefs:
