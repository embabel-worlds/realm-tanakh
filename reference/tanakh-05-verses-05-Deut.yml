  data:
    osis: Deut.19.19
    scripture: tanakh
    name: Tanakh Deuteronomy 19:19
    ref: Deuteronomy 19:19
    book: Deut
    section: torah
    chapter: 19
    verse: 19
    ordinal: 5420
    text: then shall ye do unto him, as he had purposed to do unto his brother; so shalt thou put away the evil from the midst of thee.
    translation: JPS 1917
    original: וַעֲשִׂיתֶם לוֹ כַּאֲשֶׁר זָמַם לַעֲשׂוֹת לְאָחִיו וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: ועשיתם לו כאשר זמם לעשות לאחיו ובערת הרע מקרבך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:19
