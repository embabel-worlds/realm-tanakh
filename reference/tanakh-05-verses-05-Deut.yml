  data:
    osis: Deut.21.18
    scripture: tanakh
    name: Tanakh Deuteronomy 21:18
    ref: Deuteronomy 21:18
    book: Deut
    section: torah
    chapter: 21
    verse: 18
    ordinal: 5460
    text: If a man have a stubborn and rebellious son, that will not hearken to the voice of his father, or the voice of his mother, and though they chasten him, will not hearken unto them;
    translation: JPS 1917
    original: כִּי־יִהְיֶה לְאִישׁ בֵּן סוֹרֵר וּמוֹרֶה אֵינֶנּוּ שֹׁמֵעַ בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ וְיסְּרוּ אֹתוֹ וְלֹא יִשְׁמַע אֲלֵיהֶם׃
    hebrewPlain: כי יהיה לאיש בן סורר ומורה איננו שמע בקול אביו ובקול אמו ויסרו אתו ולא ישמע אליהם
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:18
    kjvOsis:
    - Deut.21.18
