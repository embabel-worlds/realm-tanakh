    book: Deut
    section: torah
    chapter: 11
    verse: 16
    ordinal: 5219
    text: Take heed to yourselves, lest your heart be deceived, and ye turn aside, and serve other gods, and worship them;
    translation: JPS 1917
    original: הִשָּׁמְרוּ לָכֶם פֶּן יִפְתֶּה לְבַבְכֶם וְסַרְתֶּם וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים וְהִשְׁתַּחֲוִיתֶם לָהֶם׃
    hebrewPlain: השמרו לכם פן יפתה לבבכם וסרתם ועבדתם אלהים אחרים והשתחויתם להם
