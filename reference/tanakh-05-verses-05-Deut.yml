    text: And we took all his cities at that time, and utterly destroyed every city, the men, and the women, and the little ones; we left none remaining;
    translation: JPS 1917
    original: וַנִּלְכֹּד אֶת־כָּל־עָרָיו בָּעֵת הַהִוא וַנַּחֲרֵם אֶת־כָּל־עִיר מְתִם וְהַנָּשִׁים וְהַטָּף לֹא הִשְׁאַרְנוּ שָׂרִיד׃
    hebrewPlain: ונלכד את כל עריו בעת ההוא ונחרם את כל עיר מתם והנשים והטף לא השארנו שריד
    parashah: Devarim
