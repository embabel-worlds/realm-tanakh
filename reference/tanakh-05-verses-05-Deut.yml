    scripture: tanakh
    name: Tanakh Deuteronomy 11:20
    ref: Deuteronomy 11:20
    book: Deut
    section: torah
    chapter: 11
    verse: 20
    ordinal: 5223
    text: And thou shalt write them upon the door-posts of thy house, and upon thy gates;
    translation: JPS 1917
    original: וּכְתַבְתָּם עַל־מְזוּזוֹת בֵּיתֶךָ וּבִשְׁעָרֶיךָ׃
    hebrewPlain: וכתבתם על מזוזות ביתך ובשעריך
    parashah: Eikev
