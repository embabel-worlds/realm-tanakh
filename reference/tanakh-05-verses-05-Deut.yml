  data:
    osis: Deut.12.17
    scripture: tanakh
    name: Tanakh Deuteronomy 12:17
    ref: Deuteronomy 12:17
    book: Deut
    section: torah
    chapter: 12
    verse: 17
    ordinal: 5252
    text: Thou mayest not eat within thy gates the tithe of thy corn, or of thy wine, or of thine oil, or the firstlings of thy herd or of thy flock, nor any of thy vows which thou vowest, nor thy freewill-offerings, nor the offering of thy hand;
    translation: JPS 1917
    original: לֹא־תוּכַל לֶאֱכֹל בִּשְׁעָרֶיךָ מַעְשַׂר דְּגָנְךָ וְתִירֹשְׁךָ וְיִצְהָרֶךָ וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ וְכָל־נְדָרֶיךָ אֲשֶׁר תִּדֹּר וְנִדְבֹתֶיךָ וּתְרוּמַת יָדֶךָ׃
    hebrewPlain: לא תוכל לאכל בשעריך מעשר דגנך ותירשך ויצהרך ובכרת בקרך וצאנך וכל נדריך אשר תדר ונדבתיך ותרומת ידך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:17
    kjvOsis:
    - Deut.12.17
