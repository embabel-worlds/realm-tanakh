- type: TanakhVerse
  data:
    osis: Deut.31.25
    scripture: tanakh
    name: Tanakh Deuteronomy 31:25
    ref: Deuteronomy 31:25
    book: Deut
    section: torah
    chapter: 31
    verse: 25
    ordinal: 5748
    text: 'that Moses commanded the Levites, that bore the ark of the covenant of the LORD, saying:'
    translation: JPS 1917
    original: וַיְצַו מֹשֶׁה אֶת־הַלְוִיִּם נֹשְׂאֵי אֲרוֹן בְּרִית־יְהוָה לֵאמֹר׃
    hebrewPlain: ויצו משה את הלוים נשאי ארון ברית יהוה לאמר
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:25
    kjvOsis:
