    section: torah
    chapter: 2
    verse: 5
    ordinal: 4941
    text: contend not with them; for I will not give you of their land, no, not so much as for the sole of the foot to tread on; because I have given mount Seir unto Esau for a possession.
    translation: JPS 1917
    original: אַל־תִּתְגָּרוּ בָם כִּי לֹא־אֶתֵּן לָכֶם מֵאַרְצָם עַד מִדְרַךְ כַּף־רָגֶל כִּי־יְרֻשָּׁה לְעֵשָׂו נָתַתִּי אֶת־הַר שֵׂעִיר׃
    hebrewPlain: אל תתגרו בם כי לא אתן לכם מארצם עד מדרך כף רגל כי ירשה לעשו נתתי את הר שעיר
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 2:5
    kjvOsis:
    - Deut.2.5
