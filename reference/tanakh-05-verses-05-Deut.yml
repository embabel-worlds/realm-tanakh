  data:
    osis: Deut.19.20
    scripture: tanakh
    name: Tanakh Deuteronomy 19:20
    ref: Deuteronomy 19:20
    book: Deut
    section: torah
    chapter: 19
    verse: 20
    ordinal: 5421
    text: And those that remain shall hear, and fear, and shall henceforth commit no more any such evil in the midst of thee.
    translation: JPS 1917
    original: וְהַנִּשְׁאָרִים יִשְׁמְעוּ וְיִרָאוּ וְלֹא־יֹסִפוּ לַעֲשׂוֹת עוֹד כַּדָּבָר הָרָע הַזֶּה בְּקִרְבֶּךָ׃
    hebrewPlain: והנשארים ישמעו ויראו ולא יספו לעשות עוד כדבר הרע הזה בקרבך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 19:20
    kjvOsis:
    - Deut.19.20
  relations:
