  data:
    osis: Deut.9.22
    scripture: tanakh
    name: Tanakh Deuteronomy 9:22
    ref: Deuteronomy 9:22
    book: Deut
    section: torah
    chapter: 9
    verse: 22
    ordinal: 5174
    text: And at Taberah, and at Massah, and at Kibroth-hattaavah, ye made the LORD wroth.
    translation: JPS 1917
    original: וּבְתַבְעֵרָה וּבְמַסָּה וּבְקִבְרֹת הַתַּאֲוָה מַקְצִפִים הֱיִיתֶם אֶת־יְהוָה׃
    hebrewPlain: ובתבערה ובמסה ובקברת התאוה מקצפים הייתם את יהוה
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:22
    kjvOsis:
    - Deut.9.22
