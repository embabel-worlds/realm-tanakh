    name: Tanakh Deuteronomy 5:18
    ref: Deuteronomy 5:18
    book: Deut
    section: torah
    chapter: 5
    verse: 18
    ordinal: 5069
    text: Neither shalt thou covet thy neighbour’s wife; neither shalt thou desire thy neighbour’s house, his field, or his man-servant, or his maid-servant, his ox, or his ass, or any thing that is thy neighbour’s.
    translation: JPS 1917
    original: וְלֹא תַחְמֹד אֵשֶׁת רֵעֶךָ וְלֹא תִתְאַוֶּה בֵּית רֵעֶךָ שָׂדֵהוּ וְעַבְדּוֹ וַאֲמָתוֹ שׁוֹרוֹ וַחֲמֹרוֹ וְכֹל אֲשֶׁר לְרֵעֶךָ׃
    hebrewPlain: ולא תחמד אשת רעך ולא תתאוה בית רעך שדהו ועבדו ואמתו שורו וחמרו וכל אשר לרעך
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:21
    kjvOsis:
    - Deut.5.21
