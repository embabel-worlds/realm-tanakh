  data:
    osis: Deut.12.18
    scripture: tanakh
    name: Tanakh Deuteronomy 12:18
    ref: Deuteronomy 12:18
    book: Deut
    section: torah
    chapter: 12
    verse: 18
    ordinal: 5253
    text: but thou shalt eat them before the LORD thy God in the place which the LORD thy God shall choose, thou, and thy son, and thy daughter, and thy man-servant, and thy maid-servant, and the Levite that is within thy gates; and thou shalt rejoice before the LORD thy God in all that thou puttest thy hand unto.
    translation: JPS 1917
    original: כִּי אִם־לִפְנֵי יְהוָה אֱלֹהֶיךָ תֹּאכְלֶנּוּ בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ אַתָּה וּבִנְךָ וּבִתֶּךָ וְעַבְדְּךָ וַאֲמָתֶךָ וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ וְשָׂמַחְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ בְּכֹל מִשְׁלַח יָדֶךָ׃
    hebrewPlain: כי אם לפני יהוה אלהיך תאכלנו במקום אשר יבחר יהוה אלהיך בו אתה ובנך ובתך ועבדך ואמתך והלוי אשר בשעריך ושמחת לפני יהוה אלהיך בכל משלח ידך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:18
    kjvOsis:
    - Deut.12.18
