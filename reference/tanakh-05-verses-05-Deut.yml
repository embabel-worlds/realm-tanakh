    ref: Deuteronomy 25:17
    book: Deut
    section: torah
    chapter: 25
    verse: 17
    ordinal: 5559
    text: Remember what Amalek did unto thee by the way as ye came forth out of Egypt;
    translation: JPS 1917
    original: זָכוֹר אֵת אֲשֶׁר־עָשָׂה לְךָ עֲמָלֵק בַּדֶּרֶךְ בְּצֵאתְכֶם מִמִּצְרָיִם׃
