  data:
    osis: Deut.18.18
    scripture: tanakh
    name: Tanakh Deuteronomy 18:18
    ref: Deuteronomy 18:18
    book: Deut
    section: torah
    chapter: 18
    verse: 18
    ordinal: 5397
    text: I will raise them up a prophet from among their brethren, like unto thee; and I will put My words in his mouth, and he shall speak unto them all that I shall command him.
    translation: JPS 1917
    original: נָבִיא אָקִים לָהֶם מִקֶּרֶב אֲחֵיהֶם כָּמוֹךָ וְנָתַתִּי דְבָרַי בְּפִיו וְדִבֶּר אֲלֵיהֶם אֵת כָּל־אֲשֶׁר אֲצַוֶּנּוּ׃
    hebrewPlain: נביא אקים להם מקרב אחיהם כמוך ונתתי דברי בפיו ודבר אליהם את כל אשר אצונו
    parashah: Shoftim
    kjvRefs:
