    original: וְאֵת כָּל־נַפְתָּלִי וְאֶת־אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְאֵת כָּל־אֶרֶץ יְהוּדָה עַד הַיָּם הָאַחֲרוֹן׃
    hebrewPlain: ואת כל נפתלי ואת ארץ אפרים ומנשה ואת כל ארץ יהודה עד הים האחרון
    parashah: V'Zot HaBerachah
