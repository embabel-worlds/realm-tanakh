- type: TanakhVerse
  data:
    osis: Deut.31.23
    scripture: tanakh
    name: Tanakh Deuteronomy 31:23
    ref: Deuteronomy 31:23
    book: Deut
    section: torah
    chapter: 31
    verse: 23
    ordinal: 5746
    text: 'And he gave Joshua the son of Nun a charge, and said: ‘Be strong and of good courage; for thou shalt bring the children of Israel into the land which I swore unto them; and I will be with thee.’'
    translation: JPS 1917
    original: וַיְצַו אֶת־יְהוֹשֻׁעַ בִּן־נוּן וַיֹּאמֶר חֲזַק וֶאֱמָץ כִּי אַתָּה תָּבִיא אֶת־בְּנֵי יִשְׂרָאֵל אֶל־הָאָרֶץ אֲשֶׁר־נִשְׁבַּעְתִּי לָהֶם וְאָנֹכִי אֶהְיֶה עִמָּךְ׃
    hebrewPlain: ויצו את יהושע בן נון ויאמר חזק ואמץ כי אתה תביא את בני ישראל אל הארץ אשר נשבעתי להם ואנכי אהיה עמך
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:23
    kjvOsis:
    - Deut.31.23
