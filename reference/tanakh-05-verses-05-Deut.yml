  data:
    osis: Deut.22.22
    scripture: tanakh
    name: Tanakh Deuteronomy 22:22
    ref: Deuteronomy 22:22
    book: Deut
    section: torah
    chapter: 22
    verse: 22
    ordinal: 5487
    text: If a man be found lying with a woman married to a husband, then they shall both of them die, the man that lay with the woman, and the woman; so shalt thou put away the evil from Israel.
    translation: JPS 1917
    original: כִּי־יִמָּצֵא אִישׁ שֹׁכֵב עִם־אִשָּׁה בְעֻלַת־בַּעַל וּמֵתוּ גַּם־שְׁנֵיהֶם הָאִישׁ הַשֹּׁכֵב עִם־הָאִשָּׁה וְהָאִשָּׁה וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל׃
    hebrewPlain: כי ימצא איש שכב עם אשה בעלת בעל ומתו גם שניהם האיש השכב עם האשה והאשה ובערת הרע מישראל
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:22
    kjvOsis:
    - Deut.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
