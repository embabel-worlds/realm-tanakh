    scripture: tanakh
    name: Tanakh Deuteronomy 20:2
    ref: Deuteronomy 20:2
    book: Deut
    section: torah
    chapter: 20
    verse: 2
    ordinal: 5424
    text: And it shall be, when ye draw nigh unto the battle, that the priest shall approach and speak unto the people,
    translation: JPS 1917
    original: וְהָיָה כְּקָרָבְכֶם אֶל־הַמִּלְחָמָה וְנִגַּשׁ הַכֹּהֵן וְדִבֶּר אֶל־הָעָם׃
    hebrewPlain: והיה כקרבכם אל המלחמה ונגש הכהן ודבר אל העם
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:2
    kjvOsis:
