    scripture: tanakh
    name: Tanakh Deuteronomy 2:15
    ref: Deuteronomy 2:15
    book: Deut
    section: torah
    chapter: 2
    verse: 15
    ordinal: 4951
    text: Moreover the hand of the LORD was against them, to discomfit them from the midst of the camp, until they were consumed.
    translation: JPS 1917
    original: וְגַם יַד־יְהוָה הָיְתָה בָּם לְהֻמָּם מִקֶּרֶב הַמַּחֲנֶה עַד תֻּמָּם׃
