  data:
    osis: Deut.21.17
    scripture: tanakh
    name: Tanakh Deuteronomy 21:17
    ref: Deuteronomy 21:17
    book: Deut
    section: torah
    chapter: 21
    verse: 17
    ordinal: 5459
    text: but he shall acknowledge the first-born, the son of the hated, by giving him a double portion of all that he hath; for he is the first-fruits of his strength, the right of the first-born is his.
    translation: JPS 1917
    original: כִּי אֶת־הַבְּכֹר בֶּן־הַשְּׂנוּאָה יַכִּיר לָתֶת לוֹ פִּי שְׁנַיִם בְּכֹל אֲשֶׁר־יִמָּצֵא לוֹ כִּי־הוּא רֵאשִׁית אֹנוֹ לוֹ מִשְׁפַּט הַבְּכֹרָה׃
    hebrewPlain: כי את הבכר בן השנואה יכיר לתת לו פי שנים בכל אשר ימצא לו כי הוא ראשית אנו לו משפט הבכרה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 21:17
    kjvOsis:
    - Deut.21.17
