  data:
    osis: Deut.4.30
    scripture: tanakh
    name: Tanakh Deuteronomy 4:30
    ref: Deuteronomy 4:30
    book: Deut
    section: torah
    chapter: 4
    verse: 30
    ordinal: 5032
    text: In thy distress, when all these things are come upon thee, in the end of days, thou wilt return to the LORD thy God, and hearken unto His voice;
    translation: JPS 1917
    original: בַּצַּר לְךָ וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה בְּאַחֲרִית הַיָּמִים וְשַׁבְתָּ עַד־יְהוָה אֱלֹהֶיךָ וְשָׁמַעְתָּ בְּקֹלוֹ׃
    hebrewPlain: בצר לך ומצאוך כל הדברים האלה באחרית הימים ושבת עד יהוה אלהיך ושמעת בקלו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:30
    kjvOsis:
    - Deut.4.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.4.31
    scripture: tanakh
    name: Tanakh Deuteronomy 4:31
    ref: Deuteronomy 4:31
    book: Deut
    section: torah
    chapter: 4
    verse: 31
    ordinal: 5033
    text: for the LORD thy God is a merciful God; He will not fail thee, neither destroy thee, nor forget the covenant of thy fathers which He swore unto them.
    translation: JPS 1917
    original: כִּי אֵל רַחוּם יְהוָה אֱלֹהֶיךָ לֹא יַרְפְּךָ וְלֹא יַשְׁחִיתֶךָ וְלֹא יִשְׁכַּח אֶת־בְּרִית אֲבֹתֶיךָ אֲשֶׁר נִשְׁבַּע לָהֶם׃
    hebrewPlain: כי אל רחום יהוה אלהיך לא ירפך ולא ישחיתך ולא ישכח את ברית אבתיך אשר נשבע להם
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:31
    kjvOsis:
    - Deut.4.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.4.32
    scripture: tanakh
    name: Tanakh Deuteronomy 4:32
    ref: Deuteronomy 4:32
    book: Deut
    section: torah
    chapter: 4
    verse: 32
    ordinal: 5034
    text: For ask now of the days past, which were before thee, since the day that God created man upon the earth, and from the one end of heaven unto the other, whether there hath been any such thing as this great thing is, or hath been heard like it?
    translation: JPS 1917
    original: כִּי שְׁאַל־נָא לְיָמִים רִאשֹׁנִים אֲשֶׁר־הָיוּ לְפָנֶיךָ לְמִן־הַיּוֹם אֲשֶׁר בָּרָא אֱלֹהִים אָדָם עַל־הָאָרֶץ וּלְמִקְצֵה הַשָּׁמַיִם וְעַד־קְצֵה הַשָּׁמָיִם הֲנִהְיָה כַּדָּבָר הַגָּדוֹל הַזֶּה אוֹ הֲנִשְׁמַע כָּמֹהוּ׃
    hebrewPlain: כי שאל נא לימים ראשנים אשר היו לפניך למן היום אשר ברא אלהים אדם על הארץ ולמקצה השמים ועד קצה השמים הנהיה כדבר הגדול הזה או הנשמע כמהו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:32
    kjvOsis:
    - Deut.4.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.4.33
    scripture: tanakh
    name: Tanakh Deuteronomy 4:33
    ref: Deuteronomy 4:33
    book: Deut
    section: torah
    chapter: 4
    verse: 33
    ordinal: 5035
    text: Did ever a people hear the voice of God speaking out of the midst of the fire, as thou hast heard, and live?
    translation: JPS 1917
    original: הֲשָׁמַע עָם קוֹל אֱלֹהִים מְדַבֵּר מִתּוֹךְ־הָאֵשׁ כַּאֲשֶׁר־שָׁמַעְתָּ אַתָּה וַיֶּחִי׃
    hebrewPlain: השמע עם קול אלהים מדבר מתוך האש כאשר שמעת אתה ויחי
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:33
    kjvOsis:
    - Deut.4.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.4.34
    scripture: tanakh
    name: Tanakh Deuteronomy 4:34
    ref: Deuteronomy 4:34
    book: Deut
    section: torah
    chapter: 4
    verse: 34
    ordinal: 5036
    text: Or hath God assayed to go and take Him a nation from the midst of another nation, by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that the LORD your God did for you in Egypt before thine eyes?
    translation: JPS 1917
