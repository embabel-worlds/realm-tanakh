  data:
    osis: Deut.23.26
    scripture: tanakh
    name: Tanakh Deuteronomy 23:26
    ref: Deuteronomy 23:26
    book: Deut
    section: torah
    chapter: 23
    verse: 26
    ordinal: 5520
    text: When thou comest into thy neighbour’s standing corn, then thou mayest pluck ears with thy hand; but thou shalt not move a sickle unto thy neighbour’s standing corn.
    translation: JPS 1917
    original: כִּי תָבֹא בְּקָמַת רֵעֶךָ וְקָטַפְתָּ מְלִילֹת בְּיָדֶךָ וְחֶרְמֵשׁ לֹא תָנִיף עַל קָמַת רֵעֶךָ׃
    hebrewPlain: כי תבא בקמת רעך וקטפת מלילת בידך וחרמש לא תניף על קמת רעך
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:25
    kjvOsis:
    - Deut.23.25
