  data:
    osis: Deut.15.12
    scripture: tanakh
    name: Tanakh Deuteronomy 15:12
    ref: Deuteronomy 15:12
    book: Deut
    section: torah
    chapter: 15
    verse: 12
    ordinal: 5326
    text: If thy brother, a Hebrew man, or a Hebrew woman, be sold unto thee, he shall serve thee six years; and in the seventh year thou shalt let him go free from thee.
    translation: JPS 1917
    original: כִּי־יִמָּכֵר לְךָ אָחִיךָ הָעִבְרִי אוֹ הָעִבְרִיָּה וַעֲבָדְךָ שֵׁשׁ שָׁנִים וּבַשָּׁנָה הַשְּׁבִיעִת תְּשַׁלְּחֶנּוּ חָפְשִׁי מֵעִמָּךְ׃
    hebrewPlain: כי ימכר לך אחיך העברי או העבריה ועבדך שש שנים ובשנה השביעת תשלחנו חפשי מעמך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:12
    kjvOsis:
    - Deut.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.15.13
    scripture: tanakh
    name: Tanakh Deuteronomy 15:13
    ref: Deuteronomy 15:13
    book: Deut
    section: torah
    chapter: 15
    verse: 13
    ordinal: 5327
    text: And when thou lettest him go free from thee, thou shalt not let him go empty;
    translation: JPS 1917
    original: וְכִי־תְשַׁלְּחֶנּוּ חָפְשִׁי מֵעִמָּךְ לֹא תְשַׁלְּחֶנּוּ רֵיקָם׃
    hebrewPlain: וכי תשלחנו חפשי מעמך לא תשלחנו ריקם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 15:13
    kjvOsis:
