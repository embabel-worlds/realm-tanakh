  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.19
    scripture: tanakh
    name: Tanakh Deuteronomy 30:19
    ref: Deuteronomy 30:19
    book: Deut
    section: torah
    chapter: 30
    verse: 19
    ordinal: 5722
    text: I call heaven and earth to witness against you this day, that I have set before thee life and death, the blessing and the curse; therefore choose life, that thou mayest live, thou and thy seed;
    translation: JPS 1917
    original: הַעִידֹתִי בָכֶם הַיּוֹם אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ הַחַיִּים וְהַמָּוֶת נָתַתִּי לְפָנֶיךָ הַבְּרָכָה וְהַקְּלָלָה וּבָחַרְתָּ בַּחַיִּים לְמַעַן תִּחְיֶה אַתָּה וְזַרְעֶךָ׃
    hebrewPlain: העידתי בכם היום את השמים ואת הארץ החיים והמות נתתי לפניך הברכה והקללה ובחרת בחיים למען תחיה אתה וזרעך
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:19
    kjvOsis:
    - Deut.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
    osis: Deut.30.20
    scripture: tanakh
    name: Tanakh Deuteronomy 30:20
    ref: Deuteronomy 30:20
    book: Deut
    section: torah
    chapter: 30
    verse: 20
    ordinal: 5723
    text: to love the LORD thy God, to hearken to His voice, and to cleave unto Him; for that is thy life, and the length of thy days; that thou mayest dwell in the land which the LORD swore unto thy fathers, to Abraham, to Isaac, and to Jacob, to give them.
    translation: JPS 1917
    original: לְאַהֲבָה אֶת־יְהוָה אֱלֹהֶיךָ לִשְׁמֹעַ בְּקֹלוֹ וּלְדָבְקָה־בוֹ כִּי הוּא חַיֶּיךָ וְאֹרֶךְ יָמֶיךָ לָשֶׁבֶת עַל־הָאֲדָמָה אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לָתֵת לָהֶם׃
    hebrewPlain: לאהבה את יהוה אלהיך לשמע בקלו ולדבקה בו כי הוא חייך וארך ימיך לשבת על האדמה אשר נשבע יהוה לאבתיך לאברהם ליצחק וליעקב לתת להם
    parashah: Nitzavim
    kjvRefs:
    - Deuteronomy 30:20
    kjvOsis:
    - Deut.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.30
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: nitzavim
- type: TanakhVerse
  data:
