  data:
    osis: Deut.22.15
    scripture: tanakh
    name: Tanakh Deuteronomy 22:15
    ref: Deuteronomy 22:15
    book: Deut
    section: torah
    chapter: 22
    verse: 15
    ordinal: 5480
    text: then shall the father of the damsel, and her mother, take and bring forth the tokens of the damsel’s virginity unto the elders of the city in the gate.
    translation: JPS 1917
    original: וְלָקַח אֲבִי הנער [הַנַּעֲרָה] וְאִמָּהּ וְהוֹצִיאוּ אֶת־בְּתוּלֵי הנער [הַנַּעֲרָה] אֶל־זִקְנֵי הָעִיר הַשָּׁעְרָה׃
    hebrewPlain: ולקח אבי הנער [הנערה] ואמה והוציאו את בתולי הנער [הנערה] אל זקני העיר השערה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:15
    kjvOsis:
    - Deut.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
