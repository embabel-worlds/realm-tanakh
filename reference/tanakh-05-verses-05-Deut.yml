  data:
    osis: Deut.11.24
    scripture: tanakh
    name: Tanakh Deuteronomy 11:24
    ref: Deuteronomy 11:24
    book: Deut
    section: torah
    chapter: 11
    verse: 24
    ordinal: 5227
    text: 'Every place whereon the sole of your foot shall tread shall be yours: from the wilderness, and Lebanon, from the river, the river Euphrates, even unto the hinder sea shall be your border.'
    translation: JPS 1917
    original: כָּל־הַמָּקוֹם אֲשֶׁר תִּדְרֹךְ כַּף־רַגְלְכֶם בּוֹ לָכֶם יִהְיֶה מִן־הַמִּדְבָּר וְהַלְּבָנוֹן מִן־הַנָּהָר נְהַר־פְּרָת וְעַד הַיָּם הָאַחֲרוֹן יִהְיֶה גְּבֻלְכֶם׃
    hebrewPlain: כל המקום אשר תדרך כף רגלכם בו לכם יהיה מן המדבר והלבנון מן הנהר נהר פרת ועד הים האחרון יהיה גבלכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 11:24
    kjvOsis:
    - Deut.11.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.11.25
    scripture: tanakh
    name: Tanakh Deuteronomy 11:25
    ref: Deuteronomy 11:25
    book: Deut
    section: torah
    chapter: 11
    verse: 25
    ordinal: 5228
    text: 'There shall no man be able to stand against you: the LORD your God shall lay the fear of you and the dread of you upon all the land that ye shall tread upon, as He hath spoken unto you.'
    translation: JPS 1917
    original: לֹא־יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם פַּחְדְּכֶם וּמוֹרַאֲכֶם יִתֵּן יְהוָה אֱלֹהֵיכֶם עַל־פְּנֵי כָל־הָאָרֶץ אֲשֶׁר תִּדְרְכוּ־בָהּ כַּאֲשֶׁר דִּבֶּר לָכֶם׃
    hebrewPlain: לא יתיצב איש בפניכם פחדכם ומוראכם יתן יהוה אלהיכם על פני כל הארץ אשר תדרכו בה כאשר דבר לכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 11:25
    kjvOsis:
    - Deut.11.25
