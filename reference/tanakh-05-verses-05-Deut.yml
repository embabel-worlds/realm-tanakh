- type: TanakhVerse
  data:
    osis: Deut.31.11
    scripture: tanakh
    name: Tanakh Deuteronomy 31:11
    ref: Deuteronomy 31:11
    book: Deut
    section: torah
    chapter: 31
    verse: 11
    ordinal: 5734
    text: when all Israel is come to appear before the LORD thy God in the place which He shall choose, thou shalt read this law before all Israel in their hearing.
    translation: JPS 1917
    original: בְּבוֹא כָל־יִשְׂרָאֵל לֵרָאוֹת אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ בַּמָּקוֹם אֲשֶׁר יִבְחָר תִּקְרָא אֶת־הַתּוֹרָה הַזֹּאת נֶגֶד כָּל־יִשְׂרָאֵל בְּאָזְנֵיהֶם׃
    hebrewPlain: בבוא כל ישראל לראות את פני יהוה אלהיך במקום אשר יבחר תקרא את התורה הזאת נגד כל ישראל באזניהם
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:11
    kjvOsis:
    - Deut.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.12
    scripture: tanakh
    name: Tanakh Deuteronomy 31:12
    ref: Deuteronomy 31:12
    book: Deut
    section: torah
    chapter: 31
    verse: 12
    ordinal: 5735
    text: Assemble the people, the men and the women and the little ones, and thy stranger that is within thy gates, that they may hear, and that they may learn, and fear the LORD your God, and observe to do all the words of this law;
    translation: JPS 1917
    original: הַקְהֵל אֶת־הָעָם הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ וְיָרְאוּ אֶת־יְהוָה אֱלֹהֵיכֶם וְשָׁמְרוּ לַעֲשׂוֹת אֶת־כָּל־דִּבְרֵי הַתּוֹרָה הַזֹּאת׃
    hebrewPlain: הקהל את העם האנשים והנשים והטף וגרך אשר בשעריך למען ישמעו ולמען ילמדו ויראו את יהוה אלהיכם ושמרו לעשות את כל דברי התורה הזאת
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:12
    kjvOsis:
    - Deut.31.12
