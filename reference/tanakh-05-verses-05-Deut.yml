  data:
    osis: Deut.4.26
    scripture: tanakh
    name: Tanakh Deuteronomy 4:26
    ref: Deuteronomy 4:26
    book: Deut
    section: torah
    chapter: 4
    verse: 26
    ordinal: 5028
    text: I call heaven and earth to witness against you this day, that ye shall soon utterly perish from off the land whereunto ye go over the Jordan to possess it; ye shall not prolong your days upon it, but shall utterly be destroyed.
    translation: JPS 1917
    original: הַעִידֹתִי בָכֶם הַיּוֹם אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ כִּי־אָבֹד תֹּאבֵדוּן מַהֵר מֵעַל הָאָרֶץ אֲשֶׁר אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ לֹא־תַאֲרִיכֻן יָמִים עָלֶיהָ כִּי הִשָּׁמֵד תִּשָּׁמֵדוּן׃
    hebrewPlain: העידתי בכם היום את השמים ואת הארץ כי אבד תאבדון מהר מעל הארץ אשר אתם עברים את הירדן שמה לרשתה לא תאריכן ימים עליה כי השמד תשמדון
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:26
    kjvOsis:
    - Deut.4.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
