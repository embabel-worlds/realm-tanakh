- type: TanakhVerse
  data:
    osis: Deut.9.19
    scripture: tanakh
    name: Tanakh Deuteronomy 9:19
    ref: Deuteronomy 9:19
    book: Deut
    section: torah
    chapter: 9
    verse: 19
    ordinal: 5171
    text: For I was in dread of the anger and hot displeasure, wherewith the LORD was wroth against you to destroy you. But the LORD hearkened unto me that time also.
    translation: JPS 1917
    original: כִּי יָגֹרְתִּי מִפְּנֵי הָאַף וְהַחֵמָה אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם לְהַשְׁמִיד אֶתְכֶם וַיִּשְׁמַע יְהוָה אֵלַי גַּם בַּפַּעַם הַהִוא׃
    hebrewPlain: כי יגרתי מפני האף והחמה אשר קצף יהוה עליכם להשמיד אתכם וישמע יהוה אלי גם בפעם ההוא
    parashah: Eikev
    kjvRefs:
