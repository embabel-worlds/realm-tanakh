    section: torah
    chapter: 33
    verse: 27
    ordinal: 5832
    text: 'The eternal God is a dwelling-place, And underneath are the everlasting arms; And He thrust out the enemy from before thee, And said: ‘Destroy.’'
    translation: JPS 1917
    original: מְעֹנָה אֱלֹהֵי קֶדֶם וּמִתַּחַת זְרֹעֹת עוֹלָם וַיְגָרֶשׁ מִפָּנֶיךָ אוֹיֵב וַיֹּאמֶר הַשְׁמֵד׃
