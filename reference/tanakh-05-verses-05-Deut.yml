  data:
    osis: Deut.11.23
    scripture: tanakh
    name: Tanakh Deuteronomy 11:23
    ref: Deuteronomy 11:23
    book: Deut
    section: torah
    chapter: 11
    verse: 23
    ordinal: 5226
    text: then will the LORD drive out all these nations from before you, and ye shall dispossess nations greater and mightier than yourselves.
    translation: JPS 1917
    original: וְהוֹרִישׁ יְהוָה אֶת־כָּל־הַגּוֹיִם הָאֵלֶּה מִלִּפְנֵיכֶם וִירִשְׁתֶּם גּוֹיִם גְּדֹלִים וַעֲצֻמִים מִכֶּם׃
    hebrewPlain: והוריש יהוה את כל הגוים האלה מלפניכם וירשתם גוים גדלים ועצמים מכם
    parashah: Eikev
    kjvRefs:
