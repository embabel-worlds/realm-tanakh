  data:
    osis: Deut.18.20
    scripture: tanakh
    name: Tanakh Deuteronomy 18:20
    ref: Deuteronomy 18:20
    book: Deut
    section: torah
    chapter: 18
    verse: 20
    ordinal: 5399
    text: But the prophet, that shall speak a word presumptuously in My name, which I have not commanded him to speak, or that shall speak in the name of other gods, that same prophet shall die.’
    translation: JPS 1917
    original: אַךְ הַנָּבִיא אֲשֶׁר יָזִיד לְדַבֵּר דָּבָר בִּשְׁמִי אֵת אֲשֶׁר לֹא־צִוִּיתִיו לְדַבֵּר וַאֲשֶׁר יְדַבֵּר בְּשֵׁם אֱלֹהִים אֲחֵרִים וּמֵת הַנָּבִיא הַהוּא׃
    hebrewPlain: אך הנביא אשר יזיד לדבר דבר בשמי את אשר לא צויתיו לדבר ואשר ידבר בשם אלהים אחרים ומת הנביא ההוא
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 18:20
    kjvOsis:
    - Deut.18.20
