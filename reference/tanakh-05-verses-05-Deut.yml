    scripture: tanakh
    name: Tanakh Deuteronomy 31:29
    ref: Deuteronomy 31:29
    book: Deut
    section: torah
    chapter: 31
    verse: 29
    ordinal: 5752
    text: For I know that after my death ye will in any wise deal corruptly, and turn aside from the way which I have commanded you; and evil will befall you in the end of days; because ye will do that which is evil in the sight of the LORD, to provoke Him through the work of your hands.’
    translation: JPS 1917
    original: כִּי יָדַעְתִּי אַחֲרֵי מוֹתִי כִּי־הַשְׁחֵת תַּשְׁחִתוּן וְסַרְתֶּם מִן־הַדֶּרֶךְ אֲשֶׁר צִוִּיתִי אֶתְכֶם וְקָרָאת אֶתְכֶם הָרָעָה בְּאַחֲרִית הַיָּמִים כִּי־תַעֲשׂוּ אֶת־הָרַע בְּעֵינֵי יְהוָה לְהַכְעִיסוֹ בְּמַעֲשֵׂה יְדֵיכֶם׃
    hebrewPlain: כי ידעתי אחרי מותי כי השחת תשחתון וסרתם מן הדרך אשר צויתי אתכם וקראת אתכם הרעה באחרית הימים כי תעשו את הרע בעיני יהוה להכעיסו במעשה ידיכם
    parashah: Vayeilech
