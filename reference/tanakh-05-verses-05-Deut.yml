- type: TanakhVerse
  data:
    osis: Deut.5.29
    scripture: tanakh
    name: Tanakh Deuteronomy 5:29
    ref: Deuteronomy 5:29
    book: Deut
    section: torah
    chapter: 5
    verse: 29
    ordinal: 5080
    text: Ye shall observe to do therefore as the LORD your God hath commanded you; ye shall not turn aside to the right hand or to the left.
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם לַעֲשׂוֹת כַּאֲשֶׁר צִוָּה יְהוָה אֱלֹהֵיכֶם אֶתְכֶם לֹא תָסֻרוּ יָמִין וּשְׂמֹאל׃
    hebrewPlain: ושמרתם לעשות כאשר צוה יהוה אלהיכם אתכם לא תסרו ימין ושמאל
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:32
    kjvOsis:
    - Deut.5.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
- type: TanakhVerse
  data:
    osis: Deut.5.30
    scripture: tanakh
    name: Tanakh Deuteronomy 5:30
    ref: Deuteronomy 5:30
    book: Deut
    section: torah
    chapter: 5
    verse: 30
    ordinal: 5081
    text: Ye shall walk in all the way which the LORD your God hath commanded you, that ye may live, and that it may be well with you, and that ye may prolong your days in the land which ye shall possess.
    translation: JPS 1917
    original: בְּכָל־הַדֶּרֶךְ אֲשֶׁר צִוָּה יְהוָה אֱלֹהֵיכֶם אֶתְכֶם תֵּלֵכוּ לְמַעַן תִּחְיוּן וְטוֹב לָכֶם וְהַאֲרַכְתֶּם יָמִים בָּאָרֶץ אֲשֶׁר תִּירָשׁוּן׃
    hebrewPlain: בכל הדרך אשר צוה יהוה אלהיכם אתכם תלכו למען תחיון וטוב לכם והארכתם ימים בארץ אשר תירשון
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 5:33
    kjvOsis:
    - Deut.5.33
  relations:
