    scripture: tanakh
    name: Tanakh Deuteronomy 22:27
    ref: Deuteronomy 22:27
    book: Deut
    section: torah
    chapter: 22
    verse: 27
    ordinal: 5492
    text: For he found her in the field; the betrothed damsel cried, and there was none to save her.
    translation: JPS 1917
    original: כִּי בַשָּׂדֶה מְצָאָהּ צָעֲקָה הנער [הַנַּעֲרָה] הַמְאֹרָשָׂה וְאֵין מוֹשִׁיעַ לָהּ׃
    hebrewPlain: כי בשדה מצאה צעקה הנער [הנערה] המארשה ואין מושיע לה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:27
    kjvOsis:
    - Deut.22.27
  relations:
