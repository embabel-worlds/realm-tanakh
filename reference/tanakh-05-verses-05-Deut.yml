    name: Tanakh Deuteronomy 22:13
    ref: Deuteronomy 22:13
    book: Deut
    section: torah
    chapter: 22
    verse: 13
    ordinal: 5478
    text: If any man take a wife, and go in unto her, and hate her,
    translation: JPS 1917
    original: כִּי־יִקַּח אִישׁ אִשָּׁה וּבָא אֵלֶיהָ וּשְׂנֵאָהּ׃
