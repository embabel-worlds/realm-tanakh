    scripture: tanakh
    name: Tanakh Deuteronomy 31:15
    ref: Deuteronomy 31:15
    book: Deut
    section: torah
    chapter: 31
    verse: 15
    ordinal: 5738
    text: And the LORD appeared in the Tent in a pillar of cloud; and the pillar of cloud stood over the door of the Tent.
    translation: JPS 1917
    original: וַיֵּרָא יְהוָה בָּאֹהֶל בְּעַמּוּד עָנָן וַיַּעֲמֹד עַמּוּד הֶעָנָן עַל־פֶּתַח הָאֹהֶל׃
    hebrewPlain: וירא יהוה באהל בעמוד ענן ויעמד עמוד הענן על פתח האהל
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:15
    kjvOsis:
    - Deut.31.15
