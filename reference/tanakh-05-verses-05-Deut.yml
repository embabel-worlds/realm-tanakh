  data:
    osis: Deut.28.7
    scripture: tanakh
    name: Tanakh Deuteronomy 28:7
    ref: Deuteronomy 28:7
    book: Deut
    section: torah
    chapter: 28
    verse: 7
    ordinal: 5613
    text: The LORD will cause thine enemies that rise up against thee to be smitten before thee; they shall come out against thee one way, and shall flee before thee seven ways.
    translation: JPS 1917
    original: יִתֵּן יְהוָה אֶת־אֹיְבֶיךָ הַקָּמִים עָלֶיךָ נִגָּפִים לְפָנֶיךָ בְּדֶרֶךְ אֶחָד יֵצְאוּ אֵלֶיךָ וּבְשִׁבְעָה דְרָכִים יָנוּסוּ לְפָנֶיךָ׃
    hebrewPlain: יתן יהוה את איביך הקמים עליך נגפים לפניך בדרך אחד יצאו אליך ובשבעה דרכים ינוסו לפניך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:7
    kjvOsis:
    - Deut.28.7
