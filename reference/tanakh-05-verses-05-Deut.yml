    verse: 6
    ordinal: 4942
    text: Ye shall purchase food of them for money, that ye may eat; and ye shall also buy water of them for money, that ye may drink.
    translation: JPS 1917
    original: אֹכֶל תִּשְׁבְּרוּ מֵאִתָּם בַּכֶּסֶף וַאֲכַלְתֶּם וְגַם־מַיִם תִּכְרוּ מֵאִתָּם בַּכֶּסֶף וּשְׁתִיתֶם׃
    hebrewPlain: אכל תשברו מאתם בכסף ואכלתם וגם מים תכרו מאתם בכסף ושתיתם
    parashah: Devarim
    kjvRefs:
