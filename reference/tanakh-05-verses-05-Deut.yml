    scripture: tanakh
    name: Tanakh Deuteronomy 2:12
    ref: Deuteronomy 2:12
    book: Deut
    section: torah
    chapter: 2
    verse: 12
    ordinal: 4948
    text: And in Seir dwelt the Horites aforetime, but the children of Esau succeeded them; and they destroyed them from before them, and dwelt in their stead; as Israel did unto the land of his possession, which the LORD gave unto them.—
    translation: JPS 1917
    original: וּבְשֵׂעִיר יָשְׁבוּ הַחֹרִים לְפָנִים וּבְנֵי עֵשָׂו יִירָשׁוּם וַיַּשְׁמִידוּם מִפְּנֵיהֶם וַיֵּשְׁבוּ תַּחְתָּם כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל לְאֶרֶץ יְרֻשָּׁתוֹ אֲשֶׁר־נָתַן יְהוָה לָהֶם׃
    hebrewPlain: ובשעיר ישבו החרים לפנים ובני עשו יירשום וישמידום מפניהם וישבו תחתם כאשר עשה ישראל לארץ ירשתו אשר נתן יהוה להם
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 2:12
    kjvOsis:
    - Deut.2.12
