    section: torah
    chapter: 11
    verse: 4
    ordinal: 5207
    text: and what He did unto the army of Egypt, unto their horses, and to their chariots; how He made the water of the Red Sea to overflow them as they pursued after you, and how the LORD hath destroyed them unto this day;
    translation: JPS 1917
    original: וַאֲשֶׁר עָשָׂה לְחֵיל מִצְרַיִם לְסוּסָיו וּלְרִכְבּוֹ אֲשֶׁר הֵצִיף אֶת־מֵי יַם־סוּף עַל־פְּנֵיהֶם בְּרָדְפָם אַחֲרֵיכֶם וַיְאַבְּדֵם יְהוָה עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ואשר עשה לחיל מצרים לסוסיו ולרכבו אשר הציף את מי ים סוף על פניהם ברדפם אחריכם ויאבדם יהוה עד היום הזה
    parashah: Eikev
