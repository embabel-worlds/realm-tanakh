    scripture: tanakh
    name: Tanakh Deuteronomy 2:7
    ref: Deuteronomy 2:7
    book: Deut
    section: torah
    chapter: 2
    verse: 7
    ordinal: 4943
    text: For the LORD thy God hath blessed thee in all the work of thy hand; He hath known thy walking through this great wilderness; these forty years the LORD thy God hath been with thee; thou hast lacked nothing.’
    translation: JPS 1917
    original: כִּי יְהוָה אֱלֹהֶיךָ בֵּרַכְךָ בְּכֹל מַעֲשֵׂה יָדֶךָ יָדַע לֶכְתְּךָ אֶת־הַמִּדְבָּר הַגָּדֹל הַזֶּה זֶה אַרְבָּעִים שָׁנָה יְהוָה אֱלֹהֶיךָ עִמָּךְ לֹא חָסַרְתָּ דָּבָר׃
    hebrewPlain: כי יהוה אלהיך ברכך בכל מעשה ידך ידע לכתך את המדבר הגדל הזה זה ארבעים שנה יהוה אלהיך עמך לא חסרת דבר
    parashah: Devarim
    kjvRefs:
    - Deuteronomy 2:7
    kjvOsis:
    - Deut.2.7
