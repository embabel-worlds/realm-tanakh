  data:
    osis: Deut.4.25
    scripture: tanakh
    name: Tanakh Deuteronomy 4:25
    ref: Deuteronomy 4:25
    book: Deut
    section: torah
    chapter: 4
    verse: 25
    ordinal: 5027
    text: When thou shalt beget children, and children’s children, and ye shall have been long in the land, and shall deal corruptly, and make a graven image, even the form of any thing, and shall do that which is evil in the sight of the LORD thy God, to provoke Him;
    translation: JPS 1917
    original: כִּי־תוֹלִיד בָּנִים וּבְנֵי בָנִים וְנוֹשַׁנְתֶּם בָּאָרֶץ וְהִשְׁחַתֶּם וַעֲשִׂיתֶם פֶּסֶל תְּמוּנַת כֹּל וַעֲשִׂיתֶם הָרַע בְּעֵינֵי יְהוָה־אֱלֹהֶיךָ לְהַכְעִיסוֹ׃
    hebrewPlain: כי תוליד בנים ובני בנים ונושנתם בארץ והשחתם ועשיתם פסל תמונת כל ועשיתם הרע בעיני יהוה אלהיך להכעיסו
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:25
    kjvOsis:
    - Deut.4.25
