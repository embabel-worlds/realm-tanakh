- type: TanakhVerse
  data:
    osis: Deut.4.28
    scripture: tanakh
    name: Tanakh Deuteronomy 4:28
    ref: Deuteronomy 4:28
    book: Deut
    section: torah
    chapter: 4
    verse: 28
    ordinal: 5030
    text: And there ye shall serve gods, the work of men’s hands, wood and stone, which neither see, nor hear, nor eat, nor smell.
    translation: JPS 1917
    original: וַעֲבַדְתֶּם־שָׁם אֱלֹהִים מַעֲשֵׂה יְדֵי אָדָם עֵץ וָאֶבֶן אֲשֶׁר לֹא־יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן׃
    hebrewPlain: ועבדתם שם אלהים מעשה ידי אדם עץ ואבן אשר לא יראון ולא ישמעון ולא יאכלון ולא יריחן
    parashah: Vaetchanan
    kjvRefs:
    - Deuteronomy 4:28
    kjvOsis:
    - Deut.4.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vaetchanan
