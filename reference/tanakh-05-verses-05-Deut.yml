- type: TanakhVerse
  data:
    osis: Deut.26.1
    scripture: tanakh
    name: Tanakh Deuteronomy 26:1
    ref: Deuteronomy 26:1
    book: Deut
    section: torah
    chapter: 26
    verse: 1
    ordinal: 5562
    text: And it shall be, when thou art come in unto the land which the LORD thy God giveth thee for an inheritance, and dost possess it, and dwell therein;
    translation: JPS 1917
    original: וְהָיָה כִּי־תָבוֹא אֶל־הָאָרֶץ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ נַחֲלָה וִירִשְׁתָּהּ וְיָשַׁבְתָּ בָּהּ׃
    hebrewPlain: והיה כי תבוא אל הארץ אשר יהוה אלהיך נתן לך נחלה וירשתה וישבת בה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:1
    kjvOsis:
    - Deut.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.2
    scripture: tanakh
    name: Tanakh Deuteronomy 26:2
    ref: Deuteronomy 26:2
    book: Deut
    section: torah
    chapter: 26
    verse: 2
    ordinal: 5563
    text: that thou shalt take of the first of all the fruit of the ground, which thou shalt bring in from thy land that the LORD thy God giveth thee; and thou shalt put it in a basket and shalt go unto the place which the LORD thy God shall choose to cause His name to dwell there.
    translation: JPS 1917
    original: וְלָקַחְתָּ מֵרֵאשִׁית כָּל־פְּרִי הָאֲדָמָה אֲשֶׁר תָּבִיא מֵאַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ וְשַׂמְתָּ בַטֶּנֶא וְהָלַכְתָּ אֶל־הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ לְשַׁכֵּן שְׁמוֹ שָׁם׃
    hebrewPlain: ולקחת מראשית כל פרי האדמה אשר תביא מארצך אשר יהוה אלהיך נתן לך ושמת בטנא והלכת אל המקום אשר יבחר יהוה אלהיך לשכן שמו שם
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:2
    kjvOsis:
    - Deut.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.3
    scripture: tanakh
    name: Tanakh Deuteronomy 26:3
    ref: Deuteronomy 26:3
    book: Deut
    section: torah
    chapter: 26
    verse: 3
    ordinal: 5564
    text: 'And thou shalt come unto the priest that shall be in those days, and say unto him: ‘I profess this day unto the LORD thy God, that I am come unto the land which the LORD swore unto our fathers to give us.’'
    translation: JPS 1917
    original: וּבָאתָ אֶל־הַכֹּהֵן אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם וְאָמַרְתָּ אֵלָיו הִגַּדְתִּי הַיּוֹם לַיהוָה אֱלֹהֶיךָ כִּי־בָאתִי אֶל־הָאָרֶץ אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵינוּ לָתֶת לָנוּ׃
    hebrewPlain: ובאת אל הכהן אשר יהיה בימים ההם ואמרת אליו הגדתי היום ליהוה אלהיך כי באתי אל הארץ אשר נשבע יהוה לאבתינו לתת לנו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:3
    kjvOsis:
    - Deut.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.4
    scripture: tanakh
    name: Tanakh Deuteronomy 26:4
    ref: Deuteronomy 26:4
    book: Deut
    section: torah
    chapter: 26
    verse: 4
    ordinal: 5565
    text: And the priest shall take the basket out of thy hand, and set it down before the altar of the LORD thy God.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן הַטֶּנֶא מִיָּדֶךָ וְהִנִּיחוֹ לִפְנֵי מִזְבַּח יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ולקח הכהן הטנא מידך והניחו לפני מזבח יהוה אלהיך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:4
    kjvOsis:
    - Deut.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.5
    scripture: tanakh
    name: Tanakh Deuteronomy 26:5
    ref: Deuteronomy 26:5
    book: Deut
    section: torah
    chapter: 26
    verse: 5
    ordinal: 5566
    text: 'And thou shalt speak and say before the LORD thy God: ‘A wandering Aramean was my father, and he went down into Egypt, and sojourned there, few in number; and he became there a nation, great, mighty, and populous.'
    translation: JPS 1917
    original: וְעָנִיתָ וְאָמַרְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ אֲרַמִּי אֹבֵד אָבִי וַיֵּרֶד מִצְרַיְמָה וַיָּגָר שָׁם בִּמְתֵי מְעָט וַיְהִי־שָׁם לְגוֹי גָּדוֹל עָצוּם וָרָב׃
    hebrewPlain: וענית ואמרת לפני יהוה אלהיך ארמי אבד אבי וירד מצרימה ויגר שם במתי מעט ויהי שם לגוי גדול עצום ורב
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:5
    kjvOsis:
    - Deut.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.6
    scripture: tanakh
    name: Tanakh Deuteronomy 26:6
    ref: Deuteronomy 26:6
    book: Deut
    section: torah
    chapter: 26
    verse: 6
    ordinal: 5567
    text: And the Egyptians dealt ill with us, and afflicted us, and laid upon us hard bondage.
    translation: JPS 1917
    original: וַיָּרֵעוּ אֹתָנוּ הַמִּצְרִים וַיְעַנּוּנוּ וַיִּתְּנוּ עָלֵינוּ עֲבֹדָה קָשָׁה׃
    hebrewPlain: וירעו אתנו המצרים ויענונו ויתנו עלינו עבדה קשה
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:6
    kjvOsis:
    - Deut.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.7
    scripture: tanakh
    name: Tanakh Deuteronomy 26:7
    ref: Deuteronomy 26:7
    book: Deut
    section: torah
    chapter: 26
    verse: 7
    ordinal: 5568
    text: And we cried unto the LORD, the God of our fathers, and the LORD heard our voice, and saw our affliction, and our toil, and our oppression.
    translation: JPS 1917
    original: וַנִּצְעַק אֶל־יְהוָה אֱלֹהֵי אֲבֹתֵינוּ וַיִּשְׁמַע יְהוָה אֶת־קֹלֵנוּ וַיַּרְא אֶת־עָנְיֵנוּ וְאֶת־עֲמָלֵנוּ וְאֶת־לַחֲצֵנוּ׃
    hebrewPlain: ונצעק אל יהוה אלהי אבתינו וישמע יהוה את קלנו וירא את ענינו ואת עמלנו ואת לחצנו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:7
    kjvOsis:
    - Deut.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.8
    scripture: tanakh
    name: Tanakh Deuteronomy 26:8
    ref: Deuteronomy 26:8
    book: Deut
    section: torah
    chapter: 26
    verse: 8
    ordinal: 5569
    text: And the LORD brought us forth out of Egypt with a mighty hand, and with an outstretched arm, and with great terribleness, and with signs, and with wonders.
    translation: JPS 1917
    original: וַיּוֹצִאֵנוּ יְהוָה מִמִּצְרַיִם בְּיָד חֲזָקָה וּבִזְרֹעַ נְטוּיָה וּבְמֹרָא גָּדֹל וּבְאֹתוֹת וּבְמֹפְתִים׃
    hebrewPlain: ויוצאנו יהוה ממצרים ביד חזקה ובזרע נטויה ובמרא גדל ובאתות ובמפתים
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:8
    kjvOsis:
    - Deut.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.9
    scripture: tanakh
    name: Tanakh Deuteronomy 26:9
    ref: Deuteronomy 26:9
    book: Deut
    section: torah
    chapter: 26
    verse: 9
    ordinal: 5570
    text: And He hath brought us into this place, and hath given us this land, a land flowing with milk and honey.
    translation: JPS 1917
    original: וַיְבִאֵנוּ אֶל־הַמָּקוֹם הַזֶּה וַיִּתֶּן־לָנוּ אֶת־הָאָרֶץ הַזֹּאת אֶרֶץ זָבַת חָלָב וּדְבָשׁ׃
    hebrewPlain: ויבאנו אל המקום הזה ויתן לנו את הארץ הזאת ארץ זבת חלב ודבש
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:9
    kjvOsis:
    - Deut.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.10
    scripture: tanakh
    name: Tanakh Deuteronomy 26:10
    ref: Deuteronomy 26:10
    book: Deut
    section: torah
    chapter: 26
    verse: 10
    ordinal: 5571
    text: And now, behold, I have brought the first of the fruit of the land, which Thou, O LORD, hast given me.’ And thou shalt set it down before the LORD thy God, and worship before the LORD thy God.
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה הֵבֵאתִי אֶת־רֵאשִׁית פְּרִי הָאֲדָמָה אֲשֶׁר־נָתַתָּה לִּי יְהוָה וְהִנַּחְתּוֹ לִפְנֵי יְהוָה אֱלֹהֶיךָ וְהִשְׁתַּחֲוִיתָ לִפְנֵי יְהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ועתה הנה הבאתי את ראשית פרי האדמה אשר נתתה לי יהוה והנחתו לפני יהוה אלהיך והשתחוית לפני יהוה אלהיך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:10
    kjvOsis:
    - Deut.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.11
    scripture: tanakh
    name: Tanakh Deuteronomy 26:11
    ref: Deuteronomy 26:11
    book: Deut
    section: torah
    chapter: 26
    verse: 11
    ordinal: 5572
    text: And thou shalt rejoice in all the good which the LORD thy God hath given unto thee, and unto thy house, thou, and the Levite, and the stranger that is in the midst of thee.
    translation: JPS 1917
    original: וְשָׂמַחְתָּ בְכָל־הַטּוֹב אֲשֶׁר נָתַן־לְךָ יְהוָה אֱלֹהֶיךָ וּלְבֵיתֶךָ אַתָּה וְהַלֵּוִי וְהַגֵּר אֲשֶׁר בְּקִרְבֶּךָ׃
    hebrewPlain: ושמחת בכל הטוב אשר נתן לך יהוה אלהיך ולביתך אתה והלוי והגר אשר בקרבך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:11
    kjvOsis:
    - Deut.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.12
    scripture: tanakh
    name: Tanakh Deuteronomy 26:12
    ref: Deuteronomy 26:12
    book: Deut
    section: torah
    chapter: 26
    verse: 12
    ordinal: 5573
    text: When thou hast made an end of tithing all the tithe of thine increase in the third year, which is the year of tithing, and hast given it unto the Levite, to the stranger, to the fatherless, and to the widow, that they may eat within thy gates, and be satisfied,
    translation: JPS 1917
    original: כִּי תְכַלֶּה לַעְשֵׂר אֶת־כָּל־מַעְשַׂר תְּבוּאָתְךָ בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר וְנָתַתָּה לַלֵּוִי לַגֵּר לַיָּתוֹם וְלָאַלְמָנָה וְאָכְלוּ בִשְׁעָרֶיךָ וְשָׂבֵעוּ׃
    hebrewPlain: כי תכלה לעשר את כל מעשר תבואתך בשנה השלישת שנת המעשר ונתתה ללוי לגר ליתום ולאלמנה ואכלו בשעריך ושבעו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:12
    kjvOsis:
    - Deut.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.13
    scripture: tanakh
    name: Tanakh Deuteronomy 26:13
    ref: Deuteronomy 26:13
    book: Deut
    section: torah
    chapter: 26
    verse: 13
    ordinal: 5574
    text: 'then thou shalt say before the LORD thy God: ‘I have put away the hallowed things out of my house, and also have given them unto the Levite, and unto the stranger, to the fatherless, and to the widow, according to all Thy commandment which Thou hast commanded me; I have not transgressed any of Thy commandments, neither have I forgotten them.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ בִּעַרְתִּי הַקֹּדֶשׁ מִן־הַבַּיִת וְגַם נְתַתִּיו לַלֵּוִי וְלַגֵּר לַיָּתוֹם וְלָאַלְמָנָה כְּכָל־מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי לֹא־עָבַרְתִּי מִמִּצְוֺתֶיךָ וְלֹא שָׁכָחְתִּי׃
    hebrewPlain: ואמרת לפני יהוה אלהיך בערתי הקדש מן הבית וגם נתתיו ללוי ולגר ליתום ולאלמנה ככל מצותך אשר צויתני לא עברתי ממצותיך ולא שכחתי
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:13
    kjvOsis:
    - Deut.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.14
    scripture: tanakh
    name: Tanakh Deuteronomy 26:14
    ref: Deuteronomy 26:14
    book: Deut
    section: torah
    chapter: 26
    verse: 14
    ordinal: 5575
    text: I have not eaten thereof in my mourning, neither have I put away thereof, being unclean, nor given thereof for the dead; I have hearkened to the voice of the LORD my God, I have done according to all that Thou hast commanded me.
    translation: JPS 1917
    original: לֹא־אָכַלְתִּי בְאֹנִי מִמֶּנּוּ וְלֹא־בִעַרְתִּי מִמֶּנּוּ בְּטָמֵא וְלֹא־נָתַתִּי מִמֶּנּוּ לְמֵת שָׁמַעְתִּי בְּקוֹל יְהוָה אֱלֹהָי עָשִׂיתִי כְּכֹל אֲשֶׁר צִוִּיתָנִי׃
    hebrewPlain: לא אכלתי באני ממנו ולא בערתי ממנו בטמא ולא נתתי ממנו למת שמעתי בקול יהוה אלהי עשיתי ככל אשר צויתני
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:14
    kjvOsis:
    - Deut.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.15
    scripture: tanakh
    name: Tanakh Deuteronomy 26:15
    ref: Deuteronomy 26:15
    book: Deut
    section: torah
    chapter: 26
    verse: 15
    ordinal: 5576
    text: Look forth from Thy holy habitation, from heaven, and bless Thy people Israel, and the land which Thou hast given us, as Thou didst swear unto our fathers, a land flowing with milk and honey.’
    translation: JPS 1917
    original: הַשְׁקִיפָה מִמְּעוֹן קָדְשְׁךָ מִן־הַשָּׁמַיִם וּבָרֵךְ אֶת־עַמְּךָ אֶת־יִשְׂרָאֵל וְאֵת הָאֲדָמָה אֲשֶׁר נָתַתָּה לָנוּ כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ אֶרֶץ זָבַת חָלָב וּדְבָשׁ׃
    hebrewPlain: השקיפה ממעון קדשך מן השמים וברך את עמך את ישראל ואת האדמה אשר נתתה לנו כאשר נשבעת לאבתינו ארץ זבת חלב ודבש
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:15
    kjvOsis:
    - Deut.26.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.16
    scripture: tanakh
    name: Tanakh Deuteronomy 26:16
    ref: Deuteronomy 26:16
    book: Deut
    section: torah
    chapter: 26
    verse: 16
    ordinal: 5577
    text: This day the LORD thy God commandeth thee to do these statutes and ordinances; thou shalt therefore observe and do them with all thy heart, and with all thy soul.
    translation: JPS 1917
    original: הַיּוֹם הַזֶּה יְהוָה אֱלֹהֶיךָ מְצַוְּךָ לַעֲשׂוֹת אֶת־הַחֻקִּים הָאֵלֶּה וְאֶת־הַמִּשְׁפָּטִים וְשָׁמַרְתָּ וְעָשִׂיתָ אוֹתָם בְּכָל־לְבָבְךָ וּבְכָל־נַפְשֶׁךָ׃
    hebrewPlain: היום הזה יהוה אלהיך מצוך לעשות את החקים האלה ואת המשפטים ושמרת ועשית אותם בכל לבבך ובכל נפשך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:16
    kjvOsis:
    - Deut.26.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.17
    scripture: tanakh
    name: Tanakh Deuteronomy 26:17
    ref: Deuteronomy 26:17
    book: Deut
    section: torah
    chapter: 26
    verse: 17
    ordinal: 5578
    text: Thou hast avouched the LORD this day to be thy God, and that thou wouldest walk in His ways, and keep His statutes, and His commandments, and His ordinances, and hearken unto His voice.
    translation: JPS 1917
    original: אֶת־יְהוָה הֶאֱמַרְתָּ הַיּוֹם לִהְיוֹת לְךָ לֵאלֹהִים וְלָלֶכֶת בִּדְרָכָיו וְלִשְׁמֹר חֻקָּיו וּמִצְוֺתָיו וּמִשְׁפָּטָיו וְלִשְׁמֹעַ בְּקֹלוֹ׃
    hebrewPlain: את יהוה האמרת היום להיות לך לאלהים וללכת בדרכיו ולשמר חקיו ומצותיו ומשפטיו ולשמע בקלו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:17
    kjvOsis:
    - Deut.26.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.18
    scripture: tanakh
    name: Tanakh Deuteronomy 26:18
    ref: Deuteronomy 26:18
    book: Deut
    section: torah
    chapter: 26
    verse: 18
    ordinal: 5579
    text: And the LORD hath avouched thee this day to be His own treasure, as He hath promised thee, and that thou shouldest keep all His commandments;
    translation: JPS 1917
    original: וַיהוָה הֶאֱמִירְךָ הַיּוֹם לִהְיוֹת לוֹ לְעַם סְגֻלָּה כַּאֲשֶׁר דִּבֶּר־לָךְ וְלִשְׁמֹר כָּל־מִצְוֺתָיו׃
    hebrewPlain: ויהוה האמירך היום להיות לו לעם סגלה כאשר דבר לך ולשמר כל מצותיו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:18
    kjvOsis:
    - Deut.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.26.19
    scripture: tanakh
    name: Tanakh Deuteronomy 26:19
    ref: Deuteronomy 26:19
    book: Deut
    section: torah
    chapter: 26
    verse: 19
    ordinal: 5580
    text: and to make thee high above all nations that He hath made, in praise, and in name, and in glory; and that thou mayest be a holy people unto the LORD thy God, as He hath spoken.
    translation: JPS 1917
    original: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל־הַגּוֹיִם אֲשֶׁר עָשָׂה לִתְהִלָּה וּלְשֵׁם וּלְתִפְאָרֶת וְלִהְיֹתְךָ עַם־קָדֹשׁ לַיהוָה אֱלֹהֶיךָ כַּאֲשֶׁר דִּבֵּר׃
    hebrewPlain: ולתתך עליון על כל הגוים אשר עשה לתהלה ולשם ולתפארת ולהיתך עם קדש ליהוה אלהיך כאשר דבר
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 26:19
    kjvOsis:
    - Deut.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.1
    scripture: tanakh
    name: Tanakh Deuteronomy 27:1
    ref: Deuteronomy 27:1
    book: Deut
    section: torah
    chapter: 27
    verse: 1
    ordinal: 5581
    text: 'And Moses and the elders of Israel commanded the people, saying: ‘Keep all the commandment which I command you this day.'
    translation: JPS 1917
    original: וַיְצַו מֹשֶׁה וְזִקְנֵי יִשְׂרָאֵל אֶת־הָעָם לֵאמֹר שָׁמֹר אֶת־כָּל־הַמִּצְוָה אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם׃
    hebrewPlain: ויצו משה וזקני ישראל את העם לאמר שמר את כל המצוה אשר אנכי מצוה אתכם היום
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 27:1
    kjvOsis:
    - Deut.27.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.2
    scripture: tanakh
    name: Tanakh Deuteronomy 27:2
    ref: Deuteronomy 27:2
    book: Deut
    section: torah
    chapter: 27
    verse: 2
    ordinal: 5582
    text: And it shall be on the day when ye shall pass over the Jordan unto the land which the LORD thy God giveth thee, that thou shalt set thee up great stones, and plaster them with plaster.
    translation: JPS 1917
    original: וְהָיָה בַּיּוֹם אֲשֶׁר תַּעַבְרוּ אֶת־הַיַּרְדֵּן אֶל־הָאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ וַהֲקֵמֹתָ לְךָ אֲבָנִים גְּדֹלוֹת וְשַׂדְתָּ אֹתָם בַּשִּׂיד׃
    hebrewPlain: והיה ביום אשר תעברו את הירדן אל הארץ אשר יהוה אלהיך נתן לך והקמת לך אבנים גדלות ושדת אתם בשיד
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 27:2
    kjvOsis:
    - Deut.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.3
    scripture: tanakh
    name: Tanakh Deuteronomy 27:3
    ref: Deuteronomy 27:3
    book: Deut
    section: torah
    chapter: 27
    verse: 3
    ordinal: 5583
    text: And thou shalt write upon them all the words of this law, when thou art passed over; that thou mayest go in unto the land which the LORD thy God giveth thee, a land flowing with milk and honey, as the LORD, the God of thy fathers, hath promised thee.
    translation: JPS 1917
    original: וְכָתַבְתָּ עֲלֵיהֶן אֶת־כָּל־דִּבְרֵי הַתּוֹרָה הַזֹּאת בְּעָבְרֶךָ לְמַעַן אֲשֶׁר תָּבֹא אֶל־הָאָרֶץ אֲ‍שֶׁר־יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ אֶרֶץ זָבַת חָלָב וּדְבַשׁ כַּאֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵי־אֲבֹתֶיךָ לָךְ׃
    hebrewPlain: וכתבת עליהן את כל דברי התורה הזאת בעברך למען אשר תבא אל הארץ א‍שר יהוה אלהיך נתן לך ארץ זבת חלב ודבש כאשר דבר יהוה אלהי אבתיך לך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 27:3
    kjvOsis:
    - Deut.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.4
    scripture: tanakh
    name: Tanakh Deuteronomy 27:4
    ref: Deuteronomy 27:4
    book: Deut
    section: torah
    chapter: 27
    verse: 4
    ordinal: 5584
    text: And it shall be when ye are passed over the Jordan, that ye shall set up these stones, which I command you this day, in mount Ebal, and thou shalt plaster them with plaster.
    translation: JPS 1917
    original: וְהָיָה בְּעָבְרְכֶם אֶת־הַיַּרְדֵּן תָּקִימוּ אֶת־הָאֲבָנִים הָאֵלֶּה אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם בְּהַר עֵיבָל וְשַׂדְתָּ אוֹתָם בַּשִּׂיד׃
    hebrewPlain: והיה בעברכם את הירדן תקימו את האבנים האלה אשר אנכי מצוה אתכם היום בהר עיבל ושדת אותם בשיד
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 27:4
    kjvOsis:
    - Deut.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.5
    scripture: tanakh
    name: Tanakh Deuteronomy 27:5
    ref: Deuteronomy 27:5
    book: Deut
    section: torah
    chapter: 27
    verse: 5
    ordinal: 5585
    text: And there shalt thou build an altar unto the LORD thy God, an altar of stones; thou shalt lift up no iron tool upon them.
    translation: JPS 1917
    original: וּבָנִיתָ שָּׁם מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ מִזְבַּח אֲבָנִים לֹא־תָנִיף עֲלֵיהֶם בַּרְזֶל׃
    hebrewPlain: ובנית שם מזבח ליהוה אלהיך מזבח אבנים לא תניף עליהם ברזל
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 27:5
    kjvOsis:
    - Deut.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.27.6
    scripture: tanakh
    name: Tanakh Deuteronomy 27:6
    ref: Deuteronomy 27:6
    book: Deut
    section: torah
    chapter: 27
    verse: 6
    ordinal: 5586
    text: Thou shalt build the altar of the LORD thy God of unhewn stones; and thou shalt offer burnt-offerings thereon unto the LORD thy God.
    translation: JPS 1917
    original: אֲבָנִים שְׁלֵמוֹת תִּבְנֶה אֶת־מִזְבַּח יְהוָה אֱלֹהֶיךָ וְהַעֲלִיתָ עָלָיו עוֹלֹת לַיהוָה אֱלֹהֶיךָ׃
