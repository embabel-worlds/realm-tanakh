      key: shoftim
- type: TanakhVerse
  data:
    osis: Deut.17.7
    scripture: tanakh
    name: Tanakh Deuteronomy 17:7
    ref: Deuteronomy 17:7
    book: Deut
    section: torah
    chapter: 17
    verse: 7
    ordinal: 5366
    text: The hand of the witnesses shall be first upon him to put him to death, and afterward the hand of all the people. So thou shalt put away the evil from the midst of thee.
    translation: JPS 1917
    original: יַד הָעֵדִים תִּהְיֶה־בּוֹ בָרִאשֹׁנָה לַהֲמִיתוֹ וְיַד כָּל־הָעָם בָּאַחֲרֹנָה וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: יד העדים תהיה בו בראשנה להמיתו ויד כל העם באחרנה ובערת הרע מקרבך
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 17:7
    kjvOsis:
    - Deut.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.17
  - predicate: IN_PORTION
    to:
      type: Parashah
