    ref: Deuteronomy 12:11
    book: Deut
    section: torah
    chapter: 12
    verse: 11
    ordinal: 5246
    text: 'then it shall come to pass that the place which the LORD your God shall choose to cause His name to dwell there, thither shall ye bring all that I command you: your burnt-offerings, and your sacrifices, your tithes, and the offering of your hand, and all your choice vows which ye vow unto the LORD.'
    translation: JPS 1917
    original: וְהָיָה הַמָּקוֹם אֲשֶׁר־יִבְחַר יְהוָה אֱלֹהֵיכֶם בּוֹ לְשַׁכֵּן שְׁמוֹ שָׁם שָׁמָּה תָבִיאוּ אֵת כָּל־אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם עוֹלֹתֵיכֶם וְזִבְחֵיכֶם מַעְשְׂרֹתֵיכֶם וּתְרֻמַת יֶדְכֶם וְכֹל מִבְחַר נִדְרֵיכֶם אֲשֶׁר תִּדְּרוּ לַיהוָה׃
    hebrewPlain: והיה המקום אשר יבחר יהוה אלהיכם בו לשכן שמו שם שמה תביאו את כל אשר אנכי מצוה אתכם עולתיכם וזבחיכם מעשרתיכם ותרמת ידכם וכל מבחר נדריכם אשר תדרו ליהוה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 12:11
    kjvOsis:
    - Deut.12.11
