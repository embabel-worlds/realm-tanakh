  data:
    osis: Deut.28.30
    scripture: tanakh
    name: Tanakh Deuteronomy 28:30
    ref: Deuteronomy 28:30
    book: Deut
    section: torah
    chapter: 28
    verse: 30
    ordinal: 5636
    text: Thou shalt betroth a wife, and another man shall lie with her; thou shalt build a house, and thou shalt not dwell therein; thou shalt plant a vineyard, and shalt not use the fruit thereof.
    translation: JPS 1917
    original: אִשָּׁה תְאָרֵשׂ וְאִישׁ אַחֵר ישגלנה [יִשְׁכָּבֶנָּה] בַּיִת תִּבְנֶה וְלֹא־תֵשֵׁב בּוֹ כֶּרֶם תִּטַּע וְלֹא תְחַלְּלֶּנּוּ׃
    hebrewPlain: אשה תארש ואיש אחר ישגלנה [ישכבנה] בית תבנה ולא תשב בו כרם תטע ולא תחללנו
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:30
    kjvOsis:
    - Deut.28.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.31
    scripture: tanakh
    name: Tanakh Deuteronomy 28:31
    ref: Deuteronomy 28:31
    book: Deut
    section: torah
    chapter: 28
    verse: 31
    ordinal: 5637
    text: Thine ox shall be slain before thine eyes, and thou shalt not eat thereof; thine ass shall be violently taken away from before thy face, and shall not be restored to thee; thy sheep shall be given unto thine enemies; and thou shalt have none to save thee.
    translation: JPS 1917
    original: שׁוֹרְךָ טָבוּחַ לְעֵינֶיךָ וְלֹא תֹאכַל מִמֶּנּוּ חֲמֹרְךָ גָּזוּל מִלְּפָנֶיךָ וְלֹא יָשׁוּב לָךְ צֹאנְךָ נְתֻנוֹת לְאֹיְבֶיךָ וְאֵין לְךָ מוֹשִׁיעַ׃
    hebrewPlain: שורך טבוח לעיניך ולא תאכל ממנו חמרך גזול מלפניך ולא ישוב לך צאנך נתנות לאיביך ואין לך מושיע
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:31
    kjvOsis:
    - Deut.28.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.32
    scripture: tanakh
    name: Tanakh Deuteronomy 28:32
    ref: Deuteronomy 28:32
    book: Deut
    section: torah
    chapter: 28
    verse: 32
    ordinal: 5638
    text: Thy sons and thy daughters shall be given unto another people, and thine eyes shall look, and fail with longing for them all the day; and there shall be nought in the power of thy hand.
    translation: JPS 1917
    original: בָּנֶיךָ וּבְנֹתֶיךָ נְתֻנִים לְעַם אַחֵר וְעֵינֶיךָ רֹאוֹת וְכָלוֹת אֲלֵיהֶם כָּל־הַיּוֹם וְאֵין לְאֵל יָדֶךָ׃
    hebrewPlain: בניך ובנתיך נתנים לעם אחר ועיניך ראות וכלות אליהם כל היום ואין לאל ידך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:32
    kjvOsis:
    - Deut.28.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.33
    scripture: tanakh
    name: Tanakh Deuteronomy 28:33
    ref: Deuteronomy 28:33
    book: Deut
    section: torah
    chapter: 28
    verse: 33
    ordinal: 5639
    text: 'The fruit of thy land, and all thy labours, shall a nation which thou knowest not eat up; and thou shalt be only oppressed and crushed away:'
    translation: JPS 1917
    original: פְּרִי אַדְמָתְךָ וְכָל־יְגִיעֲךָ יֹאכַל עַם אֲשֶׁר לֹא־יָדָעְתָּ וְהָיִיתָ רַק עָשׁוּק וְרָצוּץ כָּל־הַיָּמִים׃
    hebrewPlain: פרי אדמתך וכל יגיעך יאכל עם אשר לא ידעת והיית רק עשוק ורצוץ כל הימים
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:33
    kjvOsis:
    - Deut.28.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
