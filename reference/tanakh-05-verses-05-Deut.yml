    scripture: tanakh
    name: Tanakh Deuteronomy 12:27
    ref: Deuteronomy 12:27
    book: Deut
    section: torah
    chapter: 12
    verse: 27
    ordinal: 5262
    text: and thou shalt offer thy burnt-offerings, the flesh and the blood, upon the altar of the LORD thy God; and the blood of thy sacrifices shall be poured out against the altar of the LORD thy God, and thou shalt eat the flesh.
    translation: JPS 1917
    original: וְעָשִׂיתָ עֹלֹתֶיךָ הַבָּשָׂר וְהַדָּם עַל־מִזְבַּח יְהוָה אֱלֹהֶיךָ וְדַם־זְבָחֶיךָ יִשָּׁפֵךְ עַל־מִזְבַּח יְהוָה אֱלֹהֶיךָ וְהַבָּשָׂר תֹּאכֵל׃
    hebrewPlain: ועשית עלתיך הבשר והדם על מזבח יהוה אלהיך ודם זבחיך ישפך על מזבח יהוה אלהיך והבשר תאכל
    parashah: Re'eh
