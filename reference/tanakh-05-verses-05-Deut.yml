    scripture: tanakh
    name: Tanakh Deuteronomy 23:8
    ref: Deuteronomy 23:8
    book: Deut
    section: torah
    chapter: 23
    verse: 8
    ordinal: 5502
    text: Thou shalt not abhor an Edomite, for he is thy brother; thou shalt not abhor an Egyptian, because thou wast a stranger in his land.
    translation: JPS 1917
    original: לֹא־תְתַעֵב אֲדֹמִי כִּי אָחִיךָ הוּא לֹא־תְתַעֵב מִצְרִי כִּי־גֵר הָיִיתָ בְאַרְצוֹ׃
    hebrewPlain: לא תתעב אדמי כי אחיך הוא לא תתעב מצרי כי גר היית בארצו
    parashah: Ki Teitzei
    kjvRefs:
