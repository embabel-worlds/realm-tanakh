      type: TanakhChapter
      osis: Deut.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: eikev
- type: TanakhVerse
  data:
    osis: Deut.7.18
    scripture: tanakh
    name: Tanakh Deuteronomy 7:18
    ref: Deuteronomy 7:18
    book: Deut
    section: torah
    chapter: 7
    verse: 18
    ordinal: 5124
    text: 'thou shalt not be afraid of them; thou shalt well remember what the LORD thy God did unto Pharaoh, and unto all Egypt:'
    translation: JPS 1917
    original: לֹא תִירָא מֵהֶם זָכֹר תִּזְכֹּר אֵת אֲשֶׁר־עָשָׂה יְהוָה אֱלֹהֶיךָ לְפַרְעֹה וּלְכָל־מִצְרָיִם׃
    hebrewPlain: לא תירא מהם זכר תזכר את אשר עשה יהוה אלהיך לפרעה ולכל מצרים
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 7:18
    kjvOsis:
    - Deut.7.18
