  data:
    osis: Deut.22.19
    scripture: tanakh
    name: Tanakh Deuteronomy 22:19
    ref: Deuteronomy 22:19
    book: Deut
    section: torah
    chapter: 22
    verse: 19
    ordinal: 5484
    text: And they shall fine him a hundred shekels of silver, and give them unto the father of the damsel, because he hath brought up an evil name upon a virgin of Israel; and she shall be his wife; he may not put her away all his days.
    translation: JPS 1917
    original: וְעָנְשׁוּ אֹתוֹ מֵאָה כֶסֶף וְנָתְנוּ לַאֲבִי הַנַּעֲרָה כִּי הוֹצִיא שֵׁם רָע עַל בְּתוּלַת יִשְׂרָאֵל וְלוֹ־תִהְיֶה לְאִשָּׁה לֹא־יוּכַל לְשַּׁלְּחָהּ כָּל־יָמָיו׃
    hebrewPlain: וענשו אתו מאה כסף ונתנו לאבי הנערה כי הוציא שם רע על בתולת ישראל ולו תהיה לאשה לא יוכל לשלחה כל ימיו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 22:19
    kjvOsis:
    - Deut.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.22
  - predicate: IN_PORTION
    to:
      type: Parashah
