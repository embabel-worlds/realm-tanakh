    to:
      type: TanakhChapter
      osis: Deut.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.23.21
    scripture: tanakh
    name: Tanakh Deuteronomy 23:21
    ref: Deuteronomy 23:21
    book: Deut
    section: torah
    chapter: 23
    verse: 21
    ordinal: 5515
    text: Unto a foreigner thou mayest lend upon interest; but unto thy brother thou shalt not lend upon interest; that the LORD thy God may bless thee in all that thou puttest thy hand unto, in the land whither thou goest in to possess it.
    translation: JPS 1917
    original: לַנָּכְרִי תַשִּׁיךְ וּלְאָחִיךָ לֹא תַשִּׁיךְ לְמַעַן יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ בְּכֹל מִשְׁלַח יָדֶךָ עַל־הָאָרֶץ אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ׃
    hebrewPlain: לנכרי תשיך ולאחיך לא תשיך למען יברכך יהוה אלהיך בכל משלח ידך על הארץ אשר אתה בא שמה לרשתה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 23:20
    kjvOsis:
    - Deut.23.20
  relations:
