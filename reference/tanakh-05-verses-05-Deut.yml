    section: torah
    chapter: 3
    verse: 24
    ordinal: 4997
    text: ’O Lord GOD, Thou hast begun to show Thy servant Thy greatness, and Thy strong hand; for what god is there in heaven or on earth, that can do according to Thy works, and according to Thy mighty acts?
    translation: JPS 1917
    original: אֲדֹנָי יְהוִה אַתָּה הַחִלּוֹתָ לְהַרְאוֹת אֶת־עַבְדְּךָ אֶת־גָּדְלְךָ וְאֶת־יָדְךָ הַחֲזָקָה אֲשֶׁר מִי־אֵל בַּשָּׁמַיִם וּבָאָרֶץ אֲשֶׁר־יַעֲשֶׂה כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶךָ׃
    hebrewPlain: אדני יהוה אתה החלות להראות את עבדך את גדלך ואת ידך החזקה אשר מי אל בשמים ובארץ אשר יעשה כמעשיך וכגבורתך
    parashah: Vaetchanan
