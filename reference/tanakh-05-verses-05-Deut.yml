- type: TanakhVerse
  data:
    osis: Deut.11.29
    scripture: tanakh
    name: Tanakh Deuteronomy 11:29
    ref: Deuteronomy 11:29
    book: Deut
    section: torah
    chapter: 11
    verse: 29
    ordinal: 5232
    text: And it shall come to pass, when the LORD thy God shall bring thee into the land whither thou goest to possess it, that thou shalt set the blessing upon mount Gerizim, and the curse upon mount Ebal.
    translation: JPS 1917
    original: וְהָיָה כִּי יְבִיאֲךָ יְהוָה אֱלֹהֶיךָ אֶל־הָאָרֶץ אֲשֶׁר־אַתָּה בָא־שָׁמָּה לְרִשְׁתָּהּ וְנָתַתָּה אֶת־הַבְּרָכָה עַל־הַר גְּרִזִים וְאֶת־הַקְּלָלָה עַל־הַר עֵיבָל׃
    hebrewPlain: והיה כי יביאך יהוה אלהיך אל הארץ אשר אתה בא שמה לרשתה ונתתה את הברכה על הר גרזים ואת הקללה על הר עיבל
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 11:29
    kjvOsis:
    - Deut.11.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.11.30
    scripture: tanakh
    name: Tanakh Deuteronomy 11:30
    ref: Deuteronomy 11:30
    book: Deut
    section: torah
    chapter: 11
    verse: 30
    ordinal: 5233
    text: Are they not beyond the Jordan, behind the way of the going down of the sun, in the land of the Canaanites that dwell in the Arabah, over against Gilgal, beside the terebinths of Moreh?
    translation: JPS 1917
    original: הֲלֹא־הֵמָּה בְּעֵבֶר הַיַּרְדֵּן אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ בְּאֶרֶץ הַכְּנַעֲנִי הַיֹּשֵׁב בָּעֲרָבָה מוּל הַגִּלְגָּל אֵצֶל אֵלוֹנֵי מֹרֶה׃
    hebrewPlain: הלא המה בעבר הירדן אחרי דרך מבוא השמש בארץ הכנעני הישב בערבה מול הגלגל אצל אלוני מרה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 11:30
    kjvOsis:
    - Deut.11.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.11.31
    scripture: tanakh
    name: Tanakh Deuteronomy 11:31
    ref: Deuteronomy 11:31
    book: Deut
    section: torah
    chapter: 11
    verse: 31
    ordinal: 5234
    text: For ye are to pass over the Jordan to go in to possess the land which the LORD your God giveth you, and ye shall possess it, and dwell therein.
    translation: JPS 1917
    original: כִּי אַתֶּם עֹבְרִים אֶת־הַיַּרְדֵּן לָבֹא לָרֶשֶׁת אֶת־הָאָרֶץ אֲשֶׁר־יְהוָה אֱלֹהֵיכֶם נֹתֵן לָכֶם וִירִשְׁתֶּם אֹתָהּ וִישַׁבְתֶּם־בָּהּ׃
    hebrewPlain: כי אתם עברים את הירדן לבא לרשת את הארץ אשר יהוה אלהיכם נתן לכם וירשתם אתה וישבתם בה
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 11:31
    kjvOsis:
    - Deut.11.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
