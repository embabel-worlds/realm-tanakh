  data:
    osis: Deut.28.10
    scripture: tanakh
    name: Tanakh Deuteronomy 28:10
    ref: Deuteronomy 28:10
    book: Deut
    section: torah
    chapter: 28
    verse: 10
    ordinal: 5616
    text: And all the peoples of the earth shall see that the name of the LORD is called upon thee; and they shall be afraid of thee.
    translation: JPS 1917
    original: וְרָאוּ כָּל־עַמֵּי הָאָרֶץ כִּי שֵׁם יְהוָה נִקְרָא עָלֶיךָ וְיָרְאוּ מִמֶּךָּ׃
    hebrewPlain: וראו כל עמי הארץ כי שם יהוה נקרא עליך ויראו ממך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:10
    kjvOsis:
    - Deut.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.11
    scripture: tanakh
    name: Tanakh Deuteronomy 28:11
    ref: Deuteronomy 28:11
    book: Deut
    section: torah
    chapter: 28
    verse: 11
    ordinal: 5617
    text: And the LORD will make thee over-abundant for good, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, in the land which the LORD swore unto thy fathers to give thee.
    translation: JPS 1917
    original: וְהוֹתִרְךָ יְהוָה לְטוֹבָה בִּפְרִי בִטְנְךָ וּבִפְרִי בְהַמְתְּךָ וּבִפְרִי אַדְמָתֶךָ עַל הָאֲדָמָה אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ׃
    hebrewPlain: והותרך יהוה לטובה בפרי בטנך ובפרי בהמתך ובפרי אדמתך על האדמה אשר נשבע יהוה לאבתיך לתת לך
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:11
    kjvOsis:
    - Deut.28.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
