    scripture: tanakh
    name: Tanakh Deuteronomy 9:29
    ref: Deuteronomy 9:29
    book: Deut
    section: torah
    chapter: 9
    verse: 29
    ordinal: 5181
    text: Yet they are Thy people and Thine inheritance, that Thou didst bring out by Thy great power and by Thy outstretched arm.’
    translation: JPS 1917
    original: וְהֵם עַמְּךָ וְנַחֲלָתֶךָ אֲשֶׁר הוֹצֵאתָ בְּכֹחֲךָ הַגָּדֹל וּבִזְרֹעֲךָ הַנְּטוּיָה׃
    hebrewPlain: והם עמך ונחלתך אשר הוצאת בכחך הגדל ובזרעך הנטויה
    parashah: Eikev
    kjvRefs:
