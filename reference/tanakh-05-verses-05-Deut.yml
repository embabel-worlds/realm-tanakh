  data:
    osis: Deut.28.25
    scripture: tanakh
    name: Tanakh Deuteronomy 28:25
    ref: Deuteronomy 28:25
    book: Deut
    section: torah
    chapter: 28
    verse: 25
    ordinal: 5631
    text: The LORD will cause thee to be smitten before thine enemies; thou shalt go out one way against them, and shalt flee seven ways before them; and thou shalt be a horror unto all the kingdoms of the earth.
    translation: JPS 1917
    original: יִתֶּנְךָ יְהוָה נִגָּף לִפְנֵי אֹיְבֶיךָ בְּדֶרֶךְ אֶחָד תֵּצֵא אֵלָיו וּבְשִׁבְעָה דְרָכִים תָּנוּס לְפָנָיו וְהָיִיתָ לְזַעֲוָה לְכֹל מַמְלְכוֹת הָאָרֶץ׃
    hebrewPlain: יתנך יהוה נגף לפני איביך בדרך אחד תצא אליו ובשבעה דרכים תנוס לפניו והיית לזעוה לכל ממלכות הארץ
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:25
    kjvOsis:
    - Deut.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.28
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-tavo
- type: TanakhVerse
  data:
    osis: Deut.28.26
    scripture: tanakh
    name: Tanakh Deuteronomy 28:26
    ref: Deuteronomy 28:26
    book: Deut
    section: torah
    chapter: 28
    verse: 26
    ordinal: 5632
    text: And thy carcasses shall be food unto all fowls of the air, and unto the beasts of the earth, and there shall be none to frighten them away.
    translation: JPS 1917
    original: וְהָיְתָה נִבְלָתְךָ לְמַאֲכָל לְכָל־עוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ וְאֵין מַחֲרִיד׃
    hebrewPlain: והיתה נבלתך למאכל לכל עוף השמים ולבהמת הארץ ואין מחריד
    parashah: Ki Tavo
    kjvRefs:
    - Deuteronomy 28:26
    kjvOsis:
    - Deut.28.26
