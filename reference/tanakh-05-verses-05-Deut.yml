    section: torah
    chapter: 32
    verse: 6
    ordinal: 5759
    text: Do ye thus requite the LORD, O foolish people and unwise? Is not He thy father that hath gotten thee? Hath He not made thee, and established thee?
    translation: JPS 1917
    original: הֲ־לַיְהוָה תִּגְמְלוּ־זֹאת עַם נָבָל וְלֹא חָכָם הֲלוֹא־הוּא אָבִיךָ קָּנֶךָ הוּא עָשְׂךָ וַיְכֹנְנֶךָ׃
    hebrewPlain: ה ליהוה תגמלו זאת עם נבל ולא חכם הלוא הוא אביך קנך הוא עשך ויכננך
