    original: כְּנֶשֶׁר יָעִיר קִנּוֹ עַל־גּוֹזָלָיו יְרַחֵף יִפְרֹשׂ כְּנָפָיו יִקָּחֵהוּ יִשָּׂאֵהוּ עַל־אֶבְרָתוֹ׃
    hebrewPlain: כנשר יעיר קנו על גוזליו ירחף יפרש כנפיו יקחהו ישאהו על אברתו
