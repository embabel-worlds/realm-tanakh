    book: Deut
    section: torah
    chapter: 25
    verse: 8
    ordinal: 5550
    text: 'Then the elders of his city shall call him, and speak unto him; and if he stand, and say: ‘I like not to take her’;'
    translation: JPS 1917
    original: וְקָרְאוּ־לוֹ זִקְנֵי־עִירוֹ וְדִבְּרוּ אֵלָיו וְעָמַד וְאָמַר לֹא חָפַצְתִּי לְקַחְתָּהּ׃
    hebrewPlain: וקראו לו זקני עירו ודברו אליו ועמד ואמר לא חפצתי לקחתה
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:8
    kjvOsis:
    - Deut.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: ki-teitzei
- type: TanakhVerse
  data:
    osis: Deut.25.9
    scripture: tanakh
    name: Tanakh Deuteronomy 25:9
    ref: Deuteronomy 25:9
    book: Deut
    section: torah
    chapter: 25
    verse: 9
    ordinal: 5551
    text: 'then shall his brother’s wife draw nigh unto him in the presence of the elders, and loose his shoe from off his foot, and spit in his face; and she shall answer and say: ‘So shall it be done unto the man that doth not build up his brother’s house.’'
    translation: JPS 1917
    original: וְנִגְּשָׁה יְבִמְתּוֹ אֵלָיו לְעֵינֵי הַזְּקֵנִים וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ וְיָרְקָה בְּפָנָיו וְעָנְתָה וְאָמְרָה כָּכָה יֵעָשֶׂה לָאִישׁ אֲשֶׁר לֹא־יִבְנֶה אֶת־בֵּית אָחִיו
    hebrewPlain: ונגשה יבמתו אליו לעיני הזקנים וחלצה נעלו מעל רגלו וירקה בפניו וענתה ואמרה ככה יעשה לאיש אשר לא יבנה את בית אחיו
    parashah: Ki Teitzei
    kjvRefs:
    - Deuteronomy 25:9
    kjvOsis:
    - Deut.25.9
