  data:
    osis: Deut.9.2
    scripture: tanakh
    name: Tanakh Deuteronomy 9:2
    ref: Deuteronomy 9:2
    book: Deut
    section: torah
    chapter: 9
    verse: 2
    ordinal: 5154
    text: 'a people great and tall, the sons of the Anakim, whom thou knowest, and of whom thou hast heard say: ‘Who can stand before the sons of Anak?’'
    translation: JPS 1917
    original: עַם־גָּדוֹל וָרָם בְּנֵי עֲנָקִים אֲשֶׁר אַתָּה יָדַעְתָּ וְאַתָּה שָׁמַעְתָּ מִי יִתְיַצֵּב לִפְנֵי בְּנֵי עֲנָק׃
    hebrewPlain: עם גדול ורם בני ענקים אשר אתה ידעת ואתה שמעת מי יתיצב לפני בני ענק
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 9:2
    kjvOsis:
    - Deut.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.9
  - predicate: IN_PORTION
    to:
