- type: TanakhVerse
  data:
    osis: Deut.31.2
    scripture: tanakh
    name: Tanakh Deuteronomy 31:2
    ref: Deuteronomy 31:2
    book: Deut
    section: torah
    chapter: 31
    verse: 2
    ordinal: 5725
    text: 'And he said unto them: ‘I am a hundred and twenty years old this day; I can no more go out and come in; and the LORD hath said unto me: Thou shalt not go over this Jordan.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם בֶּן־מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם לֹא־אוּכַל עוֹד לָצֵאת וְלָבוֹא וַיהוָה אָמַר אֵלַי לֹא תַעֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה׃
    hebrewPlain: ויאמר אלהם בן מאה ועשרים שנה אנכי היום לא אוכל עוד לצאת ולבוא ויהוה אמר אלי לא תעבר את הירדן הזה
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:2
    kjvOsis:
    - Deut.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.3
    scripture: tanakh
    name: Tanakh Deuteronomy 31:3
    ref: Deuteronomy 31:3
    book: Deut
    section: torah
    chapter: 31
    verse: 3
    ordinal: 5726
    text: The LORD thy God, He will go over before thee; He will destroy these nations from before thee, and thou shalt dispossess them; and Joshua, he shall go over before thee, as the LORD hath spoken.
    translation: JPS 1917
    original: יְהוָה אֱלֹהֶיךָ הוּא עֹבֵר לְפָנֶיךָ הוּא־יַשְׁמִיד אֶת־הַגּוֹיִם הָאֵלֶּה מִלְּפָנֶיךָ וִירִשְׁתָּם יְהוֹשֻׁעַ הוּא עֹבֵר לְפָנֶיךָ כַּאֲשֶׁר דִּבֶּר יְהוָה׃
    hebrewPlain: יהוה אלהיך הוא עבר לפניך הוא ישמיד את הגוים האלה מלפניך וירשתם יהושע הוא עבר לפניך כאשר דבר יהוה
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:3
    kjvOsis:
    - Deut.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.4
    scripture: tanakh
    name: Tanakh Deuteronomy 31:4
    ref: Deuteronomy 31:4
    book: Deut
    section: torah
    chapter: 31
    verse: 4
    ordinal: 5727
    text: And the LORD will do unto them as He did to Sihon and to Og, the kings of the Amorites, and unto their land; whom He destroyed.
    translation: JPS 1917
    original: וְעָשָׂה יְהוָה לָהֶם כַּאֲשֶׁר עָשָׂה לְסִיחוֹן וּלְעוֹג מַלְכֵי הָאֱמֹרִי וּלְאַרְצָם אֲשֶׁר הִשְׁמִיד אֹתָם׃
    hebrewPlain: ועשה יהוה להם כאשר עשה לסיחון ולעוג מלכי האמרי ולארצם אשר השמיד אתם
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:4
    kjvOsis:
    - Deut.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.5
    scripture: tanakh
    name: Tanakh Deuteronomy 31:5
    ref: Deuteronomy 31:5
    book: Deut
    section: torah
    chapter: 31
    verse: 5
    ordinal: 5728
    text: And the LORD will deliver them up before you, and ye shall do unto them according unto all the commandment which I have commanded you.
    translation: JPS 1917
    original: וּנְתָנָם יְהוָה לִפְנֵיכֶם וַעֲשִׂיתֶם לָהֶם כְּכָל־הַמִּצְוָה אֲשֶׁר צִוִּיתִי אֶתְכֶם׃
    hebrewPlain: ונתנם יהוה לפניכם ועשיתם להם ככל המצוה אשר צויתי אתכם
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:5
    kjvOsis:
    - Deut.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.6
    scripture: tanakh
    name: Tanakh Deuteronomy 31:6
    ref: Deuteronomy 31:6
    book: Deut
    section: torah
    chapter: 31
    verse: 6
    ordinal: 5729
    text: Be strong and of good courage, fear not, nor be affrighted at them; for the LORD thy God, He it is that doth go with thee; He will not fail thee, nor forsake thee.’
    translation: JPS 1917
    original: חִזְקוּ וְאִמְצוּ אַל־תִּירְאוּ וְאַל־תַּעַרְצוּ מִפְּנֵיהֶם כִּי יְהוָה אֱלֹהֶיךָ הוּא הַהֹלֵךְ עִמָּךְ לֹא יַרְפְּךָ וְלֹא יַעַזְבֶךָּ׃
    hebrewPlain: חזקו ואמצו אל תיראו ואל תערצו מפניהם כי יהוה אלהיך הוא ההלך עמך לא ירפך ולא יעזבך
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:6
    kjvOsis:
    - Deut.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.7
    scripture: tanakh
    name: Tanakh Deuteronomy 31:7
    ref: Deuteronomy 31:7
    book: Deut
    section: torah
    chapter: 31
    verse: 7
    ordinal: 5730
    text: 'And Moses called unto Joshua, and said unto him in the sight of all Israel: ‘Be strong and of good courage; for thou shalt go with this people into the land which the LORD hath sworn unto their fathers to give them; and thou shalt cause them to inherit it.'
    translation: JPS 1917
    original: וַיִּקְרָא מֹשֶׁה לִיהוֹשֻׁעַ וַיֹּאמֶר אֵלָיו לְעֵינֵי כָל־יִשְׂרָאֵל חֲזַק וֶאֱמָץ כִּי אַתָּה תָּבוֹא אֶת־הָעָם הַזֶּה אֶל־הָאָרֶץ אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתָם לָתֵת לָהֶם וְאַתָּה תַּנְחִילֶנָּה אוֹתָם׃
    hebrewPlain: ויקרא משה ליהושע ויאמר אליו לעיני כל ישראל חזק ואמץ כי אתה תבוא את העם הזה אל הארץ אשר נשבע יהוה לאבתם לתת להם ואתה תנחילנה אותם
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:7
    kjvOsis:
    - Deut.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.8
    scripture: tanakh
    name: Tanakh Deuteronomy 31:8
    ref: Deuteronomy 31:8
    book: Deut
    section: torah
    chapter: 31
    verse: 8
    ordinal: 5731
    text: And the LORD, He it is that doth go before thee; He will be with thee, He will not fail thee, neither forsake thee; fear not, neither be dismayed.’
    translation: JPS 1917
    original: וַיהוָה הוּא הַהֹלֵךְ לְפָנֶיךָ הוּא יִהְיֶה עִמָּךְ לֹא יַרְפְּךָ וְלֹא יַעַזְבֶךָּ לֹא תִירָא וְלֹא תֵחָת׃
    hebrewPlain: ויהוה הוא ההלך לפניך הוא יהיה עמך לא ירפך ולא יעזבך לא תירא ולא תחת
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:8
    kjvOsis:
    - Deut.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.9
    scripture: tanakh
    name: Tanakh Deuteronomy 31:9
    ref: Deuteronomy 31:9
    book: Deut
    section: torah
    chapter: 31
    verse: 9
    ordinal: 5732
    text: And Moses wrote this law, and delivered it unto the priests the sons of Levi, that bore the ark of the covenant of the LORD, and unto all the elders of Israel.
    translation: JPS 1917
    original: וַיִּכְתֹּב מֹשֶׁה אֶת־הַתּוֹרָה הַזֹּאת וַיִּתְּנָהּ אֶל־הַכֹּהֲנִים בְּנֵי לֵוִי הַנֹּשְׂאִים אֶת־אֲרוֹן בְּרִית יְהוָה וְאֶל־כָּל־זִקְנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכתב משה את התורה הזאת ויתנה אל הכהנים בני לוי הנשאים את ארון ברית יהוה ואל כל זקני ישראל
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:9
    kjvOsis:
    - Deut.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.31
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayeilech
- type: TanakhVerse
  data:
    osis: Deut.31.10
    scripture: tanakh
    name: Tanakh Deuteronomy 31:10
    ref: Deuteronomy 31:10
    book: Deut
    section: torah
    chapter: 31
    verse: 10
    ordinal: 5733
    text: 'And Moses commanded them, saying: ‘At the end of every seven years, in the set time of the year of release, in the feast of tabernacles,'
    translation: JPS 1917
    original: וַיְצַו מֹשֶׁה אוֹתָם לֵאמֹר מִקֵּץ שֶׁבַע שָׁנִים בְּמֹעֵד שְׁנַת הַשְּׁמִטָּה בְּחַג הַסֻּכּוֹת׃
    hebrewPlain: ויצו משה אותם לאמר מקץ שבע שנים במעד שנת השמטה בחג הסכות
    parashah: Vayeilech
    kjvRefs:
    - Deuteronomy 31:10
    kjvOsis:
