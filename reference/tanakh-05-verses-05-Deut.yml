  data:
    osis: Deut.20.1
    scripture: tanakh
    name: Tanakh Deuteronomy 20:1
    ref: Deuteronomy 20:1
    book: Deut
    section: torah
    chapter: 20
    verse: 1
    ordinal: 5423
    text: When thou goest forth to battle against thine enemies, and seest horses, and chariots, and a people more than thou, thou shalt not be afraid of them; for the LORD thy God is with thee, who brought thee up out of the land of Egypt.
    translation: JPS 1917
    original: כִּי־תֵצֵא לַמִּלְחָמָה עַל־אֹיְבֶיךָ וְרָאִיתָ סוּס וָרֶכֶב עַם רַב מִמְּךָ לֹא תִירָא מֵהֶם כִּי־יְהוָה אֱלֹהֶיךָ עִמָּךְ הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם׃
    hebrewPlain: כי תצא למלחמה על איביך וראית סוס ורכב עם רב ממך לא תירא מהם כי יהוה אלהיך עמך המעלך מארץ מצרים
    parashah: Shoftim
    kjvRefs:
    - Deuteronomy 20:1
    kjvOsis:
    - Deut.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.20
  - predicate: IN_PORTION
