  data:
    osis: Deut.13.4
    scripture: tanakh
    name: Tanakh Deuteronomy 13:4
    ref: Deuteronomy 13:4
    book: Deut
    section: torah
    chapter: 13
    verse: 4
    ordinal: 5270
    text: thou shalt not hearken unto the words of that prophet, or unto that dreamer of dreams; for the LORD your God putteth you to proof, to know whether ye do love the LORD your God with all your heart and with all your soul.
    translation: JPS 1917
    original: לֹא תִשְׁמַע אֶל־דִּבְרֵי הַנָּבִיא הַהוּא אוֹ אֶל־חוֹלֵם הַחֲלוֹם הַהוּא כִּי מְנַסֶּה יְהוָה אֱלֹהֵיכֶם אֶתְכֶם לָדַעַת הֲיִשְׁכֶם אֹהֲבִים אֶת־יְהוָה אֱלֹהֵיכֶם בְּכָל־לְבַבְכֶם וּבְכָל־נַפְשְׁכֶם׃
    hebrewPlain: לא תשמע אל דברי הנביא ההוא או אל חולם החלום ההוא כי מנסה יהוה אלהיכם אתכם לדעת הישכם אהבים את יהוה אלהיכם בכל לבבכם ובכל נפשכם
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:3
    kjvOsis:
    - Deut.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.13.5
    scripture: tanakh
    name: Tanakh Deuteronomy 13:5
    ref: Deuteronomy 13:5
    book: Deut
    section: torah
    chapter: 13
    verse: 5
    ordinal: 5271
    text: After the LORD your God shall ye walk, and Him shall ye fear, and His commandments shall ye keep, and unto His voice shall ye hearken, and Him shall ye serve, and unto Him shall ye cleave.
    translation: JPS 1917
    original: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ וְאֹתוֹ תִירָאוּ וְאֶת־מִצְוֺתָיו תִּשְׁמֹרוּ וּבְקֹלוֹ תִשְׁמָעוּ וְאֹתוֹ תַעֲבֹדוּ וּבוֹ תִדְבָּקוּן׃
    hebrewPlain: אחרי יהוה אלהיכם תלכו ואתו תיראו ואת מצותיו תשמרו ובקלו תשמעו ואתו תעבדו ובו תדבקון
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:4
    kjvOsis:
    - Deut.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.13.6
    scripture: tanakh
    name: Tanakh Deuteronomy 13:6
    ref: Deuteronomy 13:6
    book: Deut
    section: torah
    chapter: 13
    verse: 6
    ordinal: 5272
    text: And that prophet, or that dreamer of dreams, shall be put to death; because he hath spoken perversion against the LORD your God, who brought you out of the land of Egypt, and redeemed thee out of the house of bondage, to draw thee aside out of the way which the LORD thy God commanded thee to walk in. So shalt thou put away the evil from the midst of thee.
    translation: JPS 1917
    original: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא יוּמָת כִּי דִבֶּר־סָרָה עַל־יְהוָה אֱלֹהֵיכֶם הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם וְהַפֹּדְךָ מִבֵּית עֲבָדִים לְהַדִּיחֲךָ מִן־הַדֶּרֶךְ אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ׃
    hebrewPlain: והנביא ההוא או חלם החלום ההוא יומת כי דבר סרה על יהוה אלהיכם המוציא אתכם מארץ מצרים והפדך מבית עבדים להדיחך מן הדרך אשר צוך יהוה אלהיך ללכת בה ובערת הרע מקרבך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:5
    kjvOsis:
    - Deut.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.13.7
    scripture: tanakh
    name: Tanakh Deuteronomy 13:7
    ref: Deuteronomy 13:7
    book: Deut
    section: torah
    chapter: 13
    verse: 7
    ordinal: 5273
    text: 'If thy brother, the son of thy mother, or thy son, or thy daughter, or the wife of thy bosom, or thy friend, that is as thine own soul, entice thee secretly, saying: ''Let us go and serve other gods,'' which thou hast not known, thou, nor thy fathers;'
    translation: JPS 1917
    original: כִּי יְסִיתְךָ אָחִיךָ בֶן־אִמֶּךָ אוֹ־בִנְךָ אוֹ־בִתְּךָ אוֹ אֵשֶׁת חֵיקֶךָ אוֹ רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ בַּסֵּתֶר לֵאמֹר נֵלְכָה וְנַעַבְדָה אֱלֹהִים אֲחֵרִים אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ׃
    hebrewPlain: כי יסיתך אחיך בן אמך או בנך או בתך או אשת חיקך או רעך אשר כנפשך בסתר לאמר נלכה ונעבדה אלהים אחרים אשר לא ידעת אתה ואבתיך
    parashah: Re'eh
    kjvRefs:
    - Deuteronomy 13:6
    kjvOsis:
    - Deut.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Deut.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: re-eh
- type: TanakhVerse
  data:
    osis: Deut.13.8
    scripture: tanakh
    name: Tanakh Deuteronomy 13:8
    ref: Deuteronomy 13:8
    book: Deut
    section: torah
    chapter: 13
    verse: 8
    ordinal: 5274
    text: of the gods of the peoples that are round about you, nigh unto thee, or far off from thee, from the one end of the earth even unto the other end of the earth;
    translation: JPS 1917
    original: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבֹתֵיכֶם הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ מִקְצֵה הָאָרֶץ וְעַד־קְצֵה הָאָרֶץ׃
