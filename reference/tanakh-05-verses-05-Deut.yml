  data:
    osis: Deut.8.20
    scripture: tanakh
    name: Tanakh Deuteronomy 8:20
    ref: Deuteronomy 8:20
    book: Deut
    section: torah
    chapter: 8
    verse: 20
    ordinal: 5152
    text: As the nations that the LORD maketh to perish before you, so shall ye perish; because ye would not hearken unto the voice of the LORD your God.
    translation: JPS 1917
    original: כַּגּוֹיִם אֲשֶׁר יְהוָה מַאֲבִיד מִפְּנֵיכֶם כֵּן תֹאבֵדוּן עֵקֶב לֹא תִשְׁמְעוּן בְּקוֹל יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: כגוים אשר יהוה מאביד מפניכם כן תאבדון עקב לא תשמעון בקול יהוה אלהיכם
    parashah: Eikev
    kjvRefs:
    - Deuteronomy 8:20
    kjvOsis:
    - Deut.8.20
