    section: neviim
    chapter: 23
    verse: 23
    ordinal: 13385
    text: the Babylonians and all the Chaldeans, Pekod and Shoa and Koa, and all the Assyrians with them, handsome young men, governors and rulers all of them, captains and councillors, all of them riding upon horses.
    translation: JPS 1917
    original: בְּנֵי בָבֶל וְכָל־כַּשְׂדִּים פְּקוֹד וְשׁוֹעַ וְקוֹעַ כָּל־בְּנֵי אַשּׁוּר אוֹתָם בַּחוּרֵי חֶמֶד פַּחוֹת וּסְגָנִים כֻּלָּם שָׁלִשִׁים וּקְרוּאִים רֹכְבֵי סוּסִים כֻּלָּם׃
    hebrewPlain: בני בבל וכל כשדים פקוד ושוע וקוע כל בני אשור אותם בחורי חמד פחות וסגנים כלם שלשים וקרואים רכבי סוסים כלם
    kjvRefs:
    - Ezekiel 23:23
    kjvOsis:
    - Ezek.23.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
