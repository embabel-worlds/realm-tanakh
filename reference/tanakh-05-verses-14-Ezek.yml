  data:
    osis: Ezek.47.21
    scripture: tanakh
    name: Tanakh Ezekiel 47:21
    ref: Ezekiel 47:21
    book: Ezek
    section: neviim
    chapter: 47
    verse: 21
    ordinal: 14055
    text: So shall ye divide this land unto you according to the tribes of Israel.
    translation: JPS 1917
    original: וְחִלַּקְתֶּם אֶת־הָאָרֶץ הַזֹּאת לָכֶם לְשִׁבְטֵי יִשְׂרָאֵל׃
    hebrewPlain: וחלקתם את הארץ הזאת לכם לשבטי ישראל
    kjvRefs:
    - Ezekiel 47:21
    kjvOsis:
    - Ezek.47.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.22
    scripture: tanakh
    name: Tanakh Ezekiel 47:22
    ref: Ezekiel 47:22
    book: Ezek
    section: neviim
    chapter: 47
    verse: 22
    ordinal: 14056
    text: And it shall come to pass, that ye shall divide it by lot for an inheritance unto you and to the strangers that sojourn among you, who shall beget children among you; and they shall be unto you as the home-born among the children of Israel; they shall have inheritance with you among the tribes of Israel.
    translation: JPS 1917
    original: וְהָיָה תַּפִּלוּ אוֹתָהּ בְּנַחֲלָה לָכֶם וּלְהַגֵּרִים הַגָּרִים בְּתוֹכְכֶם אֲשֶׁר־הוֹלִדוּ בָנִים בְּתוֹכְכֶם וְהָיוּ לָכֶם כְּאֶזְרָח בִּבְנֵי יִשְׂרָאֵל אִתְּכֶם יִפְּלוּ בְנַחֲלָה בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל׃
    hebrewPlain: והיה תפלו אותה בנחלה לכם ולהגרים הגרים בתוככם אשר הולדו בנים בתוככם והיו לכם כאזרח בבני ישראל אתכם יפלו בנחלה בתוך שבטי ישראל
    kjvRefs:
    - Ezekiel 47:22
    kjvOsis:
    - Ezek.47.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.23
    scripture: tanakh
    name: Tanakh Ezekiel 47:23
    ref: Ezekiel 47:23
    book: Ezek
    section: neviim
    chapter: 47
    verse: 23
    ordinal: 14057
    text: And it shall come to pass, that in what tribe the stranger sojourneth, there shall ye give him his inheritance, saith the Lord GOD.
    translation: JPS 1917
    original: וְהָיָה בַשֵּׁבֶט אֲשֶׁר־גָּר הַגֵּר אִתּוֹ שָׁם תִּתְּנוּ נַחֲלָתוֹ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: והיה בשבט אשר גר הגר אתו שם תתנו נחלתו נאם אדני יהוה
    kjvRefs:
