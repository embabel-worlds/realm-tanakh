    ref: Ezekiel 32:18
    book: Ezek
    section: neviim
    chapter: 32
    verse: 18
    ordinal: 13621
    text: ’Son of man, wail for the multitude of Egypt, and cast them down, even her, with the daughters of the mighty nations, unto the nether parts of the earth, with them that go down into the pit.
    translation: JPS 1917
    original: בֶּן־אָדָם נְהֵה עַל־הֲמוֹן מִצְרַיִם וְהוֹרִדֵהוּ אוֹתָהּ וּבְנוֹת גּוֹיִם אַדִּרִם אֶל־אֶרֶץ תַּחְתִּיּוֹת אֶת־יוֹרְדֵי בוֹר׃
    hebrewPlain: בן אדם נהה על המון מצרים והורדהו אותה ובנות גוים אדרם אל ארץ תחתיות את יורדי בור
    kjvRefs:
