    scripture: tanakh
    name: Tanakh Ezekiel 48:6
    ref: Ezekiel 48:6
    book: Ezek
    section: neviim
    chapter: 48
    verse: 6
    ordinal: 14063
    text: 'And by the border of Ephraim, from the east side even unto the west side: Reuben, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל אֶפְרַיִם מִפְּאַת קָדִים וְעַד־פְּאַת־יָמָּה רְאוּבֵן אֶחָד׃
    hebrewPlain: ועל גבול אפרים מפאת קדים ועד פאת ימה ראובן אחד
