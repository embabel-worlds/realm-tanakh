    book: Ezek
    section: neviim
    chapter: 42
    verse: 7
    ordinal: 13914
    text: And the wall that was without by the side of the chambers, toward the outer court in front of the chambers, the length thereof was fifty cubits.
    translation: JPS 1917
    original: וְגָדֵר אֲשֶׁר־לַחוּץ לְעֻמַּת הַלְּשָׁכוֹת דֶּרֶךְ הֶחָצֵר הַחִצוֹנָה אֶל־פְּנֵי הַלְּשָׁכוֹת אָרְכּוֹ חֲמִשִּׁים אַמָּה׃
    hebrewPlain: וגדר אשר לחוץ לעמת הלשכות דרך החצר החצונה אל פני הלשכות ארכו חמשים אמה
    kjvRefs:
    - Ezekiel 42:7
    kjvOsis:
    - Ezek.42.7
