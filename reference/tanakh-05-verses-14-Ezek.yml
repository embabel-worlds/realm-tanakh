    scripture: tanakh
    name: Tanakh Ezekiel 12:15
    ref: Ezekiel 12:15
    book: Ezek
    section: neviim
    chapter: 12
    verse: 15
    ordinal: 13050
    text: And they shall know that I am the LORD, when I shall scatter them among the nations, and disperse them in the countries.
    translation: JPS 1917
    original: וְיָדְעוּ כִּי־אֲנִי יְהוָה בַּהֲפִיצִי אוֹתָם בַּגּוֹיִם וְזֵרִיתִי אוֹתָם בָּאֲרָצוֹת׃
    hebrewPlain: וידעו כי אני יהוה בהפיצי אותם בגוים וזריתי אותם בארצות
    kjvRefs:
    - Ezekiel 12:15
    kjvOsis:
    - Ezek.12.15
