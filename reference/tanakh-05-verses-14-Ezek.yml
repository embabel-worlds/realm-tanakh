  data:
    osis: Ezek.24.26
    scripture: tanakh
    name: Tanakh Ezekiel 24:26
    ref: Ezekiel 24:26
    book: Ezek
    section: neviim
    chapter: 24
    verse: 26
    ordinal: 13437
    text: that in that day he that escapeth shall come unto thee, to cause thee to hear it with thine ears?
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא יָבוֹא הַפָּלִיט אֵלֶיךָ לְהַשְׁמָעוּת אָזְנָיִם׃
    hebrewPlain: ביום ההוא יבוא הפליט אליך להשמעות אזנים
    kjvRefs:
    - Ezekiel 24:26
    kjvOsis:
