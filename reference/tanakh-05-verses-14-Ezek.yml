    name: Tanakh Ezekiel 13:3
    ref: Ezekiel 13:3
    book: Ezek
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 13066
    text: 'Thus saith the Lord GOD: Woe unto the vile prophets, that follow their own spirit, and things which they have not seen!'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה הוֹי עַל־הַנְּבִיאִים הַנְּבָלִים אֲשֶׁר הֹלְכִים אַחַר רוּחָם וּלְבִלְתִּי רָאוּ׃
    hebrewPlain: כה אמר אדני יהוה הוי על הנביאים הנבלים אשר הלכים אחר רוחם ולבלתי ראו
    kjvRefs:
    - Ezekiel 13:3
    kjvOsis:
