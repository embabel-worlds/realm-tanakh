  data:
    osis: Ezek.21.19
    scripture: tanakh
    name: Tanakh Ezekiel 21:19
    ref: Ezekiel 21:19
    book: Ezek
    section: neviim
    chapter: 21
    verse: 19
    ordinal: 13313
    text: Thou therefore, son of man, prophesy, and smite thy hands together; and let the sword be doubled the third time, the sword of those to be slain; it is the sword of the great one that is to be slain, which compasseth them about.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הִנָּבֵא וְהַךְ כַּף אֶל־כָּף וְתִכָּפֵל חֶרֶב שְׁלִישִׁתָה חֶרֶב חֲלָלִים הִיא חֶרֶב חָלָל הַגָּדוֹל הַחֹדֶרֶת לָהֶם׃
    hebrewPlain: ואתה בן אדם הנבא והך כף אל כף ותכפל חרב שלישתה חרב חללים היא חרב חלל הגדול החדרת להם
    kjvRefs:
    - Ezekiel 21:14
    kjvOsis:
    - Ezek.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.20
    scripture: tanakh
    name: Tanakh Ezekiel 21:20
    ref: Ezekiel 21:20
    book: Ezek
    section: neviim
    chapter: 21
    verse: 20
    ordinal: 13314
    text: I have set the point of the sword against all their gates, that their heart may melt, and their stumblings be multiplied; ah! it is made glittering, it is sharpened for slaughter.
    translation: JPS 1917
    original: לְמַעַן לָמוּג לֵב וְהַרְבֵּה הַמִּכְשֹׁלִים עַל כָּל־שַׁעֲרֵיהֶם נָתַתִּי אִבְחַת־חָרֶב אָח עֲשׂוּיָה לְבָרָק מְעֻטָּה לְטָבַח׃
    hebrewPlain: למען למוג לב והרבה המכשלים על כל שעריהם נתתי אבחת חרב אח עשויה לברק מעטה לטבח
    kjvRefs:
