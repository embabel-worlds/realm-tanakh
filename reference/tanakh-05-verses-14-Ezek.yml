    name: Tanakh Ezekiel 23:43
    ref: Ezekiel 23:43
    book: Ezek
    section: neviim
    chapter: 23
    verse: 43
    ordinal: 13405
    text: 'Then said I of her that was worn out by adulteries: Still they commit harlotries with her, even her.'
    translation: JPS 1917
    original: וָאֹמַר לַבָּלָה נִאוּפִים עת [עַתָּה] יזנה [יִזְנוּ] תַזְנוּתֶהָ וָהִיא׃
    hebrewPlain: ואמר לבלה נאופים עת [עתה] יזנה [יזנו] תזנותה והיא
    kjvRefs:
    - Ezekiel 23:43
    kjvOsis:
    - Ezek.23.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.44
    scripture: tanakh
    name: Tanakh Ezekiel 23:44
    ref: Ezekiel 23:44
    book: Ezek
    section: neviim
    chapter: 23
    verse: 44
    ordinal: 13406
    text: For every one went in unto her, as men go in unto a harlot; so went they in unto Oholah and unto Oholibah, the lewd women.
    translation: JPS 1917
    original: וַיָּבוֹא אֵלֶיהָ כְּבוֹא אֶל־אִשָּׁה זוֹנָה כֵּן בָּאוּ אֶל־אָהֳלָה וְאֶל־אָהֳלִיבָה אִשֹּׁת הַזִּמָּה׃
    hebrewPlain: ויבוא אליה כבוא אל אשה זונה כן באו אל אהלה ואל אהליבה אשת הזמה
    kjvRefs:
    - Ezekiel 23:44
    kjvOsis:
    - Ezek.23.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.45
    scripture: tanakh
    name: Tanakh Ezekiel 23:45
    ref: Ezekiel 23:45
    book: Ezek
    section: neviim
    chapter: 23
    verse: 45
    ordinal: 13407
    text: But righteous men, they shall judge them as adulteresses are judged, and as women that shed blood are judged; because they are adulteresses, and blood is in their hands.
    translation: JPS 1917
    original: וַאֲנָשִׁים צַדִּיקִם הֵמָּה יִשְׁפְּטוּ אוֹתְהֶם מִשְׁפַּט נֹאֲפוֹת וּמִשְׁפַּט שֹׁפְכוֹת דָּם כִּי נֹאֲפֹת הֵנָּה וְדָם בִּידֵיהֶן׃
    hebrewPlain: ואנשים צדיקם המה ישפטו אותהם משפט נאפות ומשפט שפכות דם כי נאפת הנה ודם בידיהן
    kjvRefs:
    - Ezekiel 23:45
    kjvOsis:
    - Ezek.23.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.46
    scripture: tanakh
    name: Tanakh Ezekiel 23:46
    ref: Ezekiel 23:46
    book: Ezek
    section: neviim
    chapter: 23
    verse: 46
    ordinal: 13408
    text: 'For thus saith the Lord GOD: An assembly shall be brought up against them, and they shall be made a horror and a spoil.'
    translation: JPS 1917
    original: כִּי כֹּה אָמַר אֲדֹנָי יְהוִה הַעֲלֵה עֲלֵיהֶם קָהָל וְנָתֹן אֶתְהֶן לְזַעֲוָה וְלָבַז׃
    hebrewPlain: כי כה אמר אדני יהוה העלה עליהם קהל ונתן אתהן לזעוה ולבז
    kjvRefs:
    - Ezekiel 23:46
    kjvOsis:
    - Ezek.23.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.47
    scripture: tanakh
    name: Tanakh Ezekiel 23:47
    ref: Ezekiel 23:47
    book: Ezek
    section: neviim
    chapter: 23
    verse: 47
    ordinal: 13409
    text: And the assembly shall stone them with stones, and despatch them with their swords; they shall slay their sons and their daughters, and burn up their houses with fire.
    translation: JPS 1917
    original: וְרָגְמוּ עֲלֵיהֶן אֶבֶן קָהָל וּבָרֵא אוֹתְהֶן בְּחַרְבוֹתָם בְּנֵיהֶם וּבְנוֹתֵיהֶם יַהֲרֹגוּ וּבָתֵּיהֶן בָּאֵשׁ יִשְׂרֹפוּ׃
    hebrewPlain: ורגמו עליהן אבן קהל וברא אותהן בחרבותם בניהם ובנותיהם יהרגו ובתיהן באש ישרפו
    kjvRefs:
    - Ezekiel 23:47
    kjvOsis:
    - Ezek.23.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.48
    scripture: tanakh
    name: Tanakh Ezekiel 23:48
    ref: Ezekiel 23:48
    book: Ezek
    section: neviim
    chapter: 23
    verse: 48
    ordinal: 13410
    text: Thus will I cause lewdness to cease out of the land, that all women may be taught not to do after your lewdness.
    translation: JPS 1917
    original: וְהִשְׁבַּתִּי זִמָּה מִן־הָאָרֶץ וְנִוַּסְּרוּ כָּל־הַנָּשִׁים וְלֹא תַעֲשֶׂינָה כְּזִמַּתְכֶנָה׃
    hebrewPlain: והשבתי זמה מן הארץ ונוסרו כל הנשים ולא תעשינה כזמתכנה
    kjvRefs:
    - Ezekiel 23:48
    kjvOsis:
    - Ezek.23.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.49
    scripture: tanakh
    name: Tanakh Ezekiel 23:49
    ref: Ezekiel 23:49
    book: Ezek
    section: neviim
    chapter: 23
    verse: 49
    ordinal: 13411
    text: And your lewdness shall be recompensed upon you, and ye shall bear the sins of your idols; and ye shall know that I am the Lord GOD.’
    translation: JPS 1917
    original: וְנָתְנוּ זִמַּתְכֶנָה עֲלֵיכֶן וַחֲטָאֵי גִלּוּלֵיכֶן תִּשֶּׂאינָה וִידַעְתֶּם כִּי אֲנִי אֲדֹנָי יְהוִה׃
    hebrewPlain: ונתנו זמתכנה עליכן וחטאי גלוליכן תשאינה וידעתם כי אני אדני יהוה
    kjvRefs:
    - Ezekiel 23:49
    kjvOsis:
    - Ezek.23.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.24.1
    scripture: tanakh
    name: Tanakh Ezekiel 24:1
    ref: Ezekiel 24:1
    book: Ezek
    section: neviim
    chapter: 24
    verse: 1
    ordinal: 13412
    text: 'And the word of the LORD came unto me in the ninth year, in the tenth month, in the tenth day of the month, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי בַּשָּׁנָה הַתְּשִׁיעִית בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי בשנה התשיעית בחדש העשירי בעשור לחדש לאמר
    kjvRefs:
    - Ezekiel 24:1
    kjvOsis:
    - Ezek.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.2
    scripture: tanakh
    name: Tanakh Ezekiel 24:2
    ref: Ezekiel 24:2
    book: Ezek
    section: neviim
    chapter: 24
    verse: 2
    ordinal: 13413
    text: ’Son of man, write thee the name of the day, even of this selfsame day; this selfsame day the king of Babylon hath invested Jerusalem.
    translation: JPS 1917
    original: בֶּן־אָדָם כתוב־[כְּתָב־] לְךָ אֶת־שֵׁם הַיּוֹם אֶת־עֶצֶם הַיּוֹם הַזֶּה סָמַךְ מֶלֶךְ־בָּבֶל אֶל־יְרוּשָׁלִַם בְּעֶצֶם הַיּוֹם הַזֶּה׃
    hebrewPlain: בן אדם כתוב [כתב ] לך את שם היום את עצם היום הזה סמך מלך בבל אל ירושלם בעצם היום הזה
    kjvRefs:
    - Ezekiel 24:2
    kjvOsis:
    - Ezek.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.3
    scripture: tanakh
    name: Tanakh Ezekiel 24:3
    ref: Ezekiel 24:3
    book: Ezek
    section: neviim
    chapter: 24
    verse: 3
    ordinal: 13414
    text: 'And utter a parable concerning the rebellious house, and say unto them: Thus saith the Lord GOD: Set on the pot, set it on, And also pour water into it;'
    translation: JPS 1917
    original: וּמְשֹׁל אֶל־בֵּית־הַמֶּרִי מָשָׁל וְאָמַרְתָּ אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהוִה שְׁפֹת הַסִּיר שְׁפֹת וְגַם־יְצֹק בּוֹ מָיִם׃
    hebrewPlain: ומשל אל בית המרי משל ואמרת אליהם כה אמר אדני יהוה שפת הסיר שפת וגם יצק בו מים
    kjvRefs:
    - Ezekiel 24:3
    kjvOsis:
    - Ezek.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.4
    scripture: tanakh
    name: Tanakh Ezekiel 24:4
    ref: Ezekiel 24:4
    book: Ezek
    section: neviim
    chapter: 24
    verse: 4
    ordinal: 13415
    text: Gather into it the pieces belonging to it, Even every good piece, the thigh, and the shoulder; Fill it with the choice bones.
    translation: JPS 1917
    original: אֱסֹף נְתָחֶיהָ אֵלֶיהָ כָּל־נֵתַח טוֹב יָרֵךְ וְכָתֵף מִבְחַר עֲצָמִים מַלֵּא׃
    hebrewPlain: אסף נתחיה אליה כל נתח טוב ירך וכתף מבחר עצמים מלא
    kjvRefs:
    - Ezekiel 24:4
    kjvOsis:
    - Ezek.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.5
    scripture: tanakh
    name: Tanakh Ezekiel 24:5
    ref: Ezekiel 24:5
    book: Ezek
    section: neviim
    chapter: 24
    verse: 5
    ordinal: 13416
    text: Take the choice of the flock, And pile also the bones under it; Make it boil well, That the bones thereof may also be seethed in the midst of it.
    translation: JPS 1917
    original: מִבְחַר הַצֹּאן לָקוֹחַ וְגַם דּוּר הָעֲצָמִים תַּחְתֶּיהָ רַתַּח רְתָחֶיהָ גַּם־בָּשְׁלוּ עֲצָמֶיהָ בְּתוֹכָהּ׃
    hebrewPlain: מבחר הצאן לקוח וגם דור העצמים תחתיה רתח רתחיה גם בשלו עצמיה בתוכה
    kjvRefs:
    - Ezekiel 24:5
    kjvOsis:
    - Ezek.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.6
    scripture: tanakh
    name: Tanakh Ezekiel 24:6
    ref: Ezekiel 24:6
    book: Ezek
    section: neviim
    chapter: 24
    verse: 6
    ordinal: 13417
    text: 'Wherefore thus saith the Lord GOD: Woe to the bloody city, to the pot whose filth is therein, and whose filth is not gone out of it! bring it out piece by piece; no lot is fallen upon it.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהֹוִה אוֹי עִיר הַדָּמִים סִיר אֲשֶׁר חֶלְאָתָה בָהּ וְחֶלְאָתָהּ לֹא יָצְאָה מִמֶּנָּה לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ לֹא־נָפַל עָלֶיהָ גּוֹרָל׃
    hebrewPlain: לכן כה אמר אדני יהוה אוי עיר הדמים סיר אשר חלאתה בה וחלאתה לא יצאה ממנה לנתחיה לנתחיה הוציאה לא נפל עליה גורל
    kjvRefs:
    - Ezekiel 24:6
    kjvOsis:
    - Ezek.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.7
    scripture: tanakh
    name: Tanakh Ezekiel 24:7
    ref: Ezekiel 24:7
    book: Ezek
    section: neviim
    chapter: 24
    verse: 7
    ordinal: 13418
    text: For her blood is in the midst of her; she set it upon the bare rock; she poured it not upon the ground, to cover it with dust;
    translation: JPS 1917
    original: כִּי דָמָהּ בְּתוֹכָהּ הָיָה עַל־צְחִיחַ סֶלַע שָׂמָתְהוּ לֹא שְׁפָכַתְהוּ עַל־הָאָרֶץ לְכַסּוֹת עָלָיו עָפָר׃
    hebrewPlain: כי דמה בתוכה היה על צחיח סלע שמתהו לא שפכתהו על הארץ לכסות עליו עפר
    kjvRefs:
    - Ezekiel 24:7
    kjvOsis:
    - Ezek.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.8
    scripture: tanakh
    name: Tanakh Ezekiel 24:8
    ref: Ezekiel 24:8
    book: Ezek
    section: neviim
    chapter: 24
    verse: 8
    ordinal: 13419
    text: that it might cause fury to come up, that vengeance might be taken, I have set her blood upon the bare rock, that it should not be covered.
    translation: JPS 1917
    original: לְהַעֲלוֹת חֵמָה לִנְקֹם נָקָם נָתַתִּי אֶת־דָּמָהּ עַל־צְחִיחַ סָלַע לְבִלְתִּי הִכָּסוֹת׃
    hebrewPlain: להעלות חמה לנקם נקם נתתי את דמה על צחיח סלע לבלתי הכסות
    kjvRefs:
    - Ezekiel 24:8
    kjvOsis:
    - Ezek.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.9
    scripture: tanakh
    name: Tanakh Ezekiel 24:9
    ref: Ezekiel 24:9
    book: Ezek
    section: neviim
    chapter: 24
    verse: 9
    ordinal: 13420
    text: 'Therefore thus saith the Lord GOD: Woe to the bloody city! I also will make the pile great,'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה אוֹי עִיר הַדָּמִים גַּם־אֲנִי אַגְדִּיל הַמְּדוּרָה׃
    hebrewPlain: לכן כה אמר אדני יהוה אוי עיר הדמים גם אני אגדיל המדורה
    kjvRefs:
    - Ezekiel 24:9
    kjvOsis:
    - Ezek.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.10
    scripture: tanakh
    name: Tanakh Ezekiel 24:10
    ref: Ezekiel 24:10
    book: Ezek
    section: neviim
    chapter: 24
    verse: 10
    ordinal: 13421
    text: heaping on the wood, kindling the fire, that the flesh may be consumed; and preparing the mixture, that the bones also may be burned;
    translation: JPS 1917
    original: הַרְבֵּה הָעֵצִים הַדְלֵק הָאֵשׁ הָתֵם הַבָּשָׂר וְהַרְקַח הַמֶּרְקָחָה וְהָעֲצָמוֹת יֵחָרוּ׃
    hebrewPlain: הרבה העצים הדלק האש התם הבשר והרקח המרקחה והעצמות יחרו
    kjvRefs:
    - Ezekiel 24:10
    kjvOsis:
    - Ezek.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
    osis: Ezek.24.11
    scripture: tanakh
    name: Tanakh Ezekiel 24:11
    ref: Ezekiel 24:11
    book: Ezek
    section: neviim
    chapter: 24
    verse: 11
    ordinal: 13422
    text: then will I set it empty upon the coals thereof, that it may be hot, and the bottom thereof may burn, and that the impurity of it may be molten in it, that the filth of it may be consumed
    translation: JPS 1917
    original: וְהַעֲמִידֶהָ עַל־גֶּחָלֶיהָ רֵקָה לְמַעַן תֵּחַם וְחָרָה נְחֻשְׁתָּהּ וְנִתְּכָה בְתוֹכָהּ טֻמְאָתָהּ תִּתֻּם חֶלְאָתָהּ׃
    hebrewPlain: והעמידה על גחליה רקה למען תחם וחרה נחשתה ונתכה בתוכה טמאתה תתם חלאתה
    kjvRefs:
