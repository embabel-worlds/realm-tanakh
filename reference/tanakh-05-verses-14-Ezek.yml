    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.23
    scripture: tanakh
    name: Tanakh Ezekiel 12:23
    ref: Ezekiel 12:23
    book: Ezek
    section: neviim
    chapter: 12
    verse: 23
    ordinal: 13058
    text: 'Tell them therefore: Thus saith the Lord GOD: I will make this proverb to cease, and they shall no more use it as a proverb in Israel; but say unto them: The days are at hand, and the word of every vision.'
    translation: JPS 1917
    original: לָכֵן אֱמֹר אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה הִשְׁבַּתִּי אֶת־הַמָּשָׁל הַזֶּה וְלֹא־יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל כִּי אִם־דַּבֵּר אֲלֵיהֶם קָרְבוּ הַיָּמִים וּדְבַר כָּל־חָזוֹן׃
    hebrewPlain: לכן אמר אליהם כה אמר אדני יהוה השבתי את המשל הזה ולא ימשלו אתו עוד בישראל כי אם דבר אליהם קרבו הימים ודבר כל חזון
    kjvRefs:
    - Ezekiel 12:23
    kjvOsis:
    - Ezek.12.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.24
    scripture: tanakh
    name: Tanakh Ezekiel 12:24
    ref: Ezekiel 12:24
    book: Ezek
    section: neviim
    chapter: 12
    verse: 24
    ordinal: 13059
    text: For there shall be no more any vain vision nor smooth divination within the house of Israel.
    translation: JPS 1917
    original: כִּי לֹא יִהְיֶה עוֹד כָּל־חֲזוֹן שָׁוְא וּמִקְסַם חָלָק בְּתוֹךְ בֵּית יִשְׂרָאֵל׃
    hebrewPlain: כי לא יהיה עוד כל חזון שוא ומקסם חלק בתוך בית ישראל
    kjvRefs:
    - Ezekiel 12:24
    kjvOsis:
    - Ezek.12.24
