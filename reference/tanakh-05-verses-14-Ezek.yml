    scripture: tanakh
    name: Tanakh Ezekiel 12:16
    ref: Ezekiel 12:16
    book: Ezek
    section: neviim
    chapter: 12
    verse: 16
    ordinal: 13051
    text: But I will leave a few men of them from the sword, from the famine, and from the pestilence; that they may declare all their abominations among the nations whither they come; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: וְהוֹתַרְתִּי מֵהֶם אַנְשֵׁי מִסְפָּר מֵחֶרֶב מֵרָעָב וּמִדָּבֶר לְמַעַן יְסַפְּרוּ אֶת־כָּל־תּוֹעֲבוֹתֵיהֶם בַּגּוֹיִם אֲשֶׁר־בָּאוּ שָׁם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והותרתי מהם אנשי מספר מחרב מרעב ומדבר למען יספרו את כל תועבותיהם בגוים אשר באו שם וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 12:16
    kjvOsis:
    - Ezek.12.16
