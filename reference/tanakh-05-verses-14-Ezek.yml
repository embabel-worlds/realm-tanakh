- type: TanakhVerse
  data:
    osis: Ezek.22.2
    scripture: tanakh
    name: Tanakh Ezekiel 22:2
    ref: Ezekiel 22:2
    book: Ezek
    section: neviim
    chapter: 22
    verse: 2
    ordinal: 13333
    text: ’Now, thou, son of man, wilt thou judge, wilt thou judge the bloody city? then cause her to know all her abominations.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הֲתִשְׁפֹּט הֲתִשְׁפֹּט אֶת־עִיר הַדָּמִים וְהוֹדַעְתָּהּ אֵת כָּל־תּוֹעֲבוֹתֶיהָ׃
    hebrewPlain: ואתה בן אדם התשפט התשפט את עיר הדמים והודעתה את כל תועבותיה
    kjvRefs:
    - Ezekiel 22:2
    kjvOsis:
    - Ezek.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.3
    scripture: tanakh
    name: Tanakh Ezekiel 22:3
    ref: Ezekiel 22:3
    book: Ezek
    section: neviim
    chapter: 22
    verse: 3
    ordinal: 13334
    text: 'And thou shalt say: Thus saith the Lord GOD: O city that sheddest blood in the midst of thee, that thy time may come, and that makest idols unto thyself to defile thee;'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה עִיר שֹׁפֶכֶת דָּם בְּתוֹכָהּ לָבוֹא עִתָּהּ וְעָשְׂתָה גִלּוּלִים עָלֶיהָ לְטָמְאָה׃
    hebrewPlain: ואמרת כה אמר אדני יהוה עיר שפכת דם בתוכה לבוא עתה ועשתה גלולים עליה לטמאה
    kjvRefs:
    - Ezekiel 22:3
    kjvOsis:
    - Ezek.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.4
    scripture: tanakh
    name: Tanakh Ezekiel 22:4
    ref: Ezekiel 22:4
    book: Ezek
    section: neviim
    chapter: 22
    verse: 4
    ordinal: 13335
    text: thou art become guilty in thy blood that thou hast shed, and art defiled in thine idols which thou hast made; and thou hast caused thy days to draw near, and art come even unto thy years; therefore have I made thee a reproach unto the nations, and a mocking to all the countries!
    translation: JPS 1917
    original: בְּדָמֵךְ אֲשֶׁר־שָׁפַכְתְּ אָשַׁמְתְּ וּבְגִלּוּלַיִךְ אֲשֶׁר־עָשִׂית טָמֵאת וַתַּקְרִיבִי יָמַיִךְ וַתָּבוֹא עַד־שְׁנוֹתָיִךְ עַל־כֵּן נְתַתִּיךְ חֶרְפָּה לַגּוֹיִם וְקַלָּסָה לְכָל־הָאֲרָצוֹת׃
    hebrewPlain: בדמך אשר שפכת אשמת ובגלוליך אשר עשית טמאת ותקריבי ימיך ותבוא עד שנותיך על כן נתתיך חרפה לגוים וקלסה לכל הארצות
    kjvRefs:
    - Ezekiel 22:4
    kjvOsis:
    - Ezek.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.5
    scripture: tanakh
    name: Tanakh Ezekiel 22:5
    ref: Ezekiel 22:5
    book: Ezek
    section: neviim
    chapter: 22
    verse: 5
    ordinal: 13336
    text: Those that are near, and those that are far from thee, shall mock thee, thou defiled of name and full of tumult.
    translation: JPS 1917
    original: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ יִתְקַלְּסוּ־בָךְ טְמֵאַת הַשֵּׁם רַבַּת הַמְּהוּמָה׃
    hebrewPlain: הקרבות והרחקות ממך יתקלסו בך טמאת השם רבת המהומה
    kjvRefs:
    - Ezekiel 22:5
    kjvOsis:
    - Ezek.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.6
    scripture: tanakh
    name: Tanakh Ezekiel 22:6
    ref: Ezekiel 22:6
    book: Ezek
    section: neviim
    chapter: 22
    verse: 6
    ordinal: 13337
    text: Behold, the princes of Israel, every one according to his might, have been in thee to shed blood.
    translation: JPS 1917
    original: הִנֵּה נְשִׂיאֵי יִשְׂרָאֵל אִישׁ לִזְרֹעוֹ הָיוּ בָךְ לְמַעַן שְׁפָךְ־דָּם׃
    hebrewPlain: הנה נשיאי ישראל איש לזרעו היו בך למען שפך דם
    kjvRefs:
    - Ezekiel 22:6
    kjvOsis:
    - Ezek.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.7
    scripture: tanakh
    name: Tanakh Ezekiel 22:7
    ref: Ezekiel 22:7
    book: Ezek
    section: neviim
    chapter: 22
    verse: 7
    ordinal: 13338
    text: In thee have they made light of father and mother; in the midst of thee have they dealt by oppression with the stranger; in thee have they wronged the fatherless and the widow.
    translation: JPS 1917
    original: אָב וָאֵם הֵקַלּוּ בָךְ לַגֵּר עָשׂוּ בַעֹשֶׁק בְּתוֹכֵךְ יָתוֹם וְאַלְמָנָה הוֹנוּ בָךְ׃
    hebrewPlain: אב ואם הקלו בך לגר עשו בעשק בתוכך יתום ואלמנה הונו בך
    kjvRefs:
    - Ezekiel 22:7
    kjvOsis:
    - Ezek.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.8
    scripture: tanakh
    name: Tanakh Ezekiel 22:8
    ref: Ezekiel 22:8
    book: Ezek
    section: neviim
    chapter: 22
    verse: 8
    ordinal: 13339
    text: Thou hast despised My holy things, and hast profaned My sabbaths.
    translation: JPS 1917
    original: קָדָשַׁי בָּזִית וְאֶת־שַׁבְּתֹתַי חִלָּלְתְּ׃
    hebrewPlain: קדשי בזית ואת שבתתי חללת
    kjvRefs:
    - Ezekiel 22:8
    kjvOsis:
    - Ezek.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.9
    scripture: tanakh
    name: Tanakh Ezekiel 22:9
    ref: Ezekiel 22:9
    book: Ezek
    section: neviim
    chapter: 22
    verse: 9
    ordinal: 13340
    text: In thee have been talebearers to shed blood; and in thee they have eaten upon the mountains; in the midst of thee they have committed lewdness.
    translation: JPS 1917
    original: אַנְשֵׁי רָכִיל הָיוּ בָךְ לְמַעַן שְׁפָךְ־דָּם וְאֶל־הֶהָרִים אָכְלוּ בָךְ זִמָּה עָשׂוּ בְתוֹכֵךְ׃
    hebrewPlain: אנשי רכיל היו בך למען שפך דם ואל ההרים אכלו בך זמה עשו בתוכך
    kjvRefs:
    - Ezekiel 22:9
    kjvOsis:
    - Ezek.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.10
    scripture: tanakh
    name: Tanakh Ezekiel 22:10
    ref: Ezekiel 22:10
    book: Ezek
    section: neviim
    chapter: 22
    verse: 10
    ordinal: 13341
    text: In thee have they uncovered their fathers’ nakedness; in thee have they humbled her that was unclean in her impurity.
    translation: JPS 1917
    original: עֶרְוַת־אָב גִּלָּה־בָךְ טְמֵאַת הַנִּדָּה עִנּוּ־בָךְ׃
    hebrewPlain: ערות אב גלה בך טמאת הנדה ענו בך
    kjvRefs:
    - Ezekiel 22:10
    kjvOsis:
    - Ezek.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.11
    scripture: tanakh
    name: Tanakh Ezekiel 22:11
    ref: Ezekiel 22:11
    book: Ezek
    section: neviim
    chapter: 22
    verse: 11
    ordinal: 13342
    text: And each hath committed abomination with his neighbour’s wife; and each hath lewdly defiled his daughter-in-law; and each in thee hath humbled his sister, his father’s daughter.
    translation: JPS 1917
    original: וְאִישׁ אֶת־אֵשֶׁת רֵעֵהוּ עָשָׂה תּוֹעֵבָה וְאִישׁ אֶת־כַּלָּתוֹ טִמֵּא בְזִמָּה וְאִישׁ אֶת־אֲחֹתוֹ בַת־אָבִיו עִנָּה־בָךְ׃
    hebrewPlain: ואיש את אשת רעהו עשה תועבה ואיש את כלתו טמא בזמה ואיש את אחתו בת אביו ענה בך
    kjvRefs:
    - Ezekiel 22:11
    kjvOsis:
    - Ezek.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.12
    scripture: tanakh
    name: Tanakh Ezekiel 22:12
    ref: Ezekiel 22:12
    book: Ezek
    section: neviim
    chapter: 22
    verse: 12
    ordinal: 13343
    text: In thee have they taken gifts to shed blood; thou hast taken interest and increase, and thou hast greedily gained of thy neighbours by oppression, and hast forgotten Me, saith the Lord GOD.
    translation: JPS 1917
    original: שֹׁחַד לָקְחוּ־בָךְ לְמַעַן שְׁפָךְ־דָּם נֶשֶׁךְ וְתַרְבִּית לָקַחַתְּ וַתְּבַצְּעִי רֵעַיִךְ בַּעֹשֶׁק וְאֹתִי שָׁכַחַתְּ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: שחד לקחו בך למען שפך דם נשך ותרבית לקחת ותבצעי רעיך בעשק ואתי שכחת נאם אדני יהוה
    kjvRefs:
    - Ezekiel 22:12
    kjvOsis:
    - Ezek.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.13
    scripture: tanakh
    name: Tanakh Ezekiel 22:13
    ref: Ezekiel 22:13
    book: Ezek
    section: neviim
    chapter: 22
    verse: 13
    ordinal: 13344
    text: Behold, therefore, I have smitten My hand at thy dishonest gain which thou hast made, and at thy blood which hath been in the midst of thee.
    translation: JPS 1917
    original: וְהִנֵּה הִכֵּיתִי כַפִּי אֶל־בִּצְעֵךְ אֲשֶׁר עָשִׂית וְעַל־דָּמֵךְ אֲשֶׁר הָיוּ בְּתוֹכֵךְ׃
    hebrewPlain: והנה הכיתי כפי אל בצעך אשר עשית ועל דמך אשר היו בתוכך
    kjvRefs:
    - Ezekiel 22:13
    kjvOsis:
    - Ezek.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.14
    scripture: tanakh
    name: Tanakh Ezekiel 22:14
    ref: Ezekiel 22:14
    book: Ezek
    section: neviim
    chapter: 22
    verse: 14
    ordinal: 13345
    text: Can thy heart endure, or can thy hands be strong, in the days that I shall deal with thee? I the LORD have spoken it, and will do it.
    translation: JPS 1917
    original: הֲיַעֲמֹד לִבֵּךְ אִם־תֶּחֱזַקְנָה יָדַיִךְ לַיָּמִים אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ אֲנִי יְהוָה דִּבַּרְתִּי וְעָשִׂיתִי׃
    hebrewPlain: היעמד לבך אם תחזקנה ידיך לימים אשר אני עשה אותך אני יהוה דברתי ועשיתי
    kjvRefs:
    - Ezekiel 22:14
    kjvOsis:
    - Ezek.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.15
    scripture: tanakh
    name: Tanakh Ezekiel 22:15
    ref: Ezekiel 22:15
    book: Ezek
    section: neviim
    chapter: 22
    verse: 15
    ordinal: 13346
    text: And I will scatter thee among the nations, and disperse thee through the countries; and I will consume thy filthiness out of thee.
    translation: JPS 1917
    original: וַהֲפִיצוֹתִי אוֹתָךְ בַּגּוֹיִם וְזֵרִיתִיךְ בָּאֲרָצוֹת וַהֲתִמֹּתִי טֻמְאָתֵךְ מִמֵּךְ׃
    hebrewPlain: והפיצותי אותך בגוים וזריתיך בארצות והתמתי טמאתך ממך
    kjvRefs:
    - Ezekiel 22:15
    kjvOsis:
    - Ezek.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.16
    scripture: tanakh
    name: Tanakh Ezekiel 22:16
    ref: Ezekiel 22:16
    book: Ezek
    section: neviim
    chapter: 22
    verse: 16
    ordinal: 13347
    text: And thou shalt be profaned in thyself, in the sight of the nations; and thou shalt know that I am the LORD.’
    translation: JPS 1917
    original: וְנִחַלְתְּ בָּךְ לְעֵינֵי גוֹיִם וְיָדַעַתְּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונחלת בך לעיני גוים וידעת כי אני יהוה
    kjvRefs:
    - Ezekiel 22:16
    kjvOsis:
    - Ezek.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.17
    scripture: tanakh
    name: Tanakh Ezekiel 22:17
    ref: Ezekiel 22:17
    book: Ezek
    section: neviim
    chapter: 22
    verse: 17
    ordinal: 13348
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 22:17
    kjvOsis:
    - Ezek.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
