    translation: JPS 1917
    original: וָאֲטַמֵּא אוֹתָם בְּמַתְּנוֹתָם בְּהַעֲבִיר כָּל־פֶּטֶר רָחַם לְמַעַן אֲשִׁמֵּם לְמַעַן אֲשֶׁר יֵדְעוּ אֲשֶׁר אֲנִי יְהוָה׃
    hebrewPlain: ואטמא אותם במתנותם בהעביר כל פטר רחם למען אשמם למען אשר ידעו אשר אני יהוה
