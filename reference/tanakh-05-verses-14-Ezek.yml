  data:
    osis: Ezek.18.13
    scripture: tanakh
    name: Tanakh Ezekiel 18:13
    ref: Ezekiel 18:13
    book: Ezek
    section: neviim
    chapter: 18
    verse: 13
    ordinal: 13217
    text: hath given forth upon interest, and hath taken increase; shall he then live? he shall not live—he hath done all these abominations; he shall surely be put to death, his blood shall be upon him.
    translation: JPS 1917
    original: בַּנֶּשֶׁךְ נָתַן וְתַרְבִּית לָקַח וָחָי לֹא יִחְיֶה אֵת כָּל־הַתּוֹעֵבוֹת הָאֵלֶּה עָשָׂה מוֹת יוּמָת דָּמָיו בּוֹ יִהְיֶה׃
    hebrewPlain: בנשך נתן ותרבית לקח וחי לא יחיה את כל התועבות האלה עשה מות יומת דמיו בו יהיה
    kjvRefs:
    - Ezekiel 18:13
    kjvOsis:
    - Ezek.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
