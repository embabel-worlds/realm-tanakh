    verse: 24
    ordinal: 13905
    text: And the doors had two leaves [apiece], two turning leaves; two leaves for the one door, and two leaves for the other.
    translation: JPS 1917
    original: וּשְׁתַּיִם דְּלָתוֹת לַדְּלָתוֹת שְׁתַּיִם מוּסַבּוֹת דְּלָתוֹת שְׁתַּיִם לְדֶלֶת אֶחָת וּשְׁתֵּי דְלָתוֹת לָאַחֶרֶת׃
