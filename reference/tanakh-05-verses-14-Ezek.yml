    ordinal: 13622
    text: Whom dost thou pass in beauty? Go down, and be thou laid with the uncircumcised.
    translation: JPS 1917
    original: מִמִּי נָעָמְתָּ רְדָה וְהָשְׁכְּבָה אֶת־עֲרֵלִים׃
    hebrewPlain: ממי נעמת רדה והשכבה את ערלים
