    translation: JPS 1917
    original: וּבְלֶכֶת הַחַיּוֹת יֵלְכוּ הָאוֹפַנִּים אֶצְלָם וּבְהִנָּשֵׂא הַחַיּוֹת מֵעַל הָאָרֶץ יִנָּשְׂאוּ הָאוֹפַנִּים׃
    hebrewPlain: ובלכת החיות ילכו האופנים אצלם ובהנשא החיות מעל הארץ ינשאו האופנים
    kjvRefs:
    - Ezekiel 1:19
    kjvOsis:
    - Ezek.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.20
    scripture: tanakh
    name: Tanakh Ezekiel 1:20
    ref: Ezekiel 1:20
    book: Ezek
    section: neviim
    chapter: 1
    verse: 20
    ordinal: 12839
    text: Whithersoever the spirit was to go, as the spirit was to go thither, so they went; and the wheels were lifted up beside them; for the spirit of the living creature was in the wheels.
    translation: JPS 1917
    original: עַל אֲשֶׁר יִהְיֶה־שָּׁם הָרוּחַ לָלֶכֶת יֵלֵכוּ שָׁמָּה הָרוּחַ לָלֶכֶת וְהָאוֹפַנִּים יִנָּשְׂאוּ לְעֻמָּתָם כִּי רוּחַ הַחַיָּה בָּאוֹפַנִּים׃
    hebrewPlain: על אשר יהיה שם הרוח ללכת ילכו שמה הרוח ללכת והאופנים ינשאו לעמתם כי רוח החיה באופנים
    kjvRefs:
    - Ezekiel 1:20
    kjvOsis:
    - Ezek.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.21
    scripture: tanakh
    name: Tanakh Ezekiel 1:21
    ref: Ezekiel 1:21
    book: Ezek
    section: neviim
    chapter: 1
    verse: 21
    ordinal: 12840
    text: When those went, these went, and when those stood, these stood; and when those were lifted up from the earth, the wheels were lifted up beside them; for the spirit of the living creature was in the wheels.
    translation: JPS 1917
    original: בְּלֶכְתָּם יֵלֵכוּ וּבְעָמְדָם יַעֲמֹדוּ וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ יִנָּשְׂאוּ הָאוֹפַנִּים לְעֻמָּתָם כִּי רוּחַ הַחַיָּה בָּאוֹפַנִּים׃
    hebrewPlain: בלכתם ילכו ובעמדם יעמדו ובהנשאם מעל הארץ ינשאו האופנים לעמתם כי רוח החיה באופנים
    kjvRefs:
    - Ezekiel 1:21
    kjvOsis:
    - Ezek.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.22
    scripture: tanakh
    name: Tanakh Ezekiel 1:22
    ref: Ezekiel 1:22
    book: Ezek
    section: neviim
    chapter: 1
    verse: 22
    ordinal: 12841
    text: And over the heads of the living creatures there was the likeness of a firmament, like the colour of the terrible ice, stretched forth over their heads above.
    translation: JPS 1917
    original: וּדְמוּת עַל־רָאשֵׁי הַחַיָּה רָקִיעַ כְּעֵין הַקֶּרַח הַנּוֹרָא נָטוּי עַל־רָאשֵׁיהֶם מִלְמָעְלָה׃
    hebrewPlain: ודמות על ראשי החיה רקיע כעין הקרח הנורא נטוי על ראשיהם מלמעלה
    kjvRefs:
    - Ezekiel 1:22
    kjvOsis:
    - Ezek.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.23
    scripture: tanakh
    name: Tanakh Ezekiel 1:23
    ref: Ezekiel 1:23
    book: Ezek
    section: neviim
    chapter: 1
    verse: 23
    ordinal: 12842
    text: And under the firmament were their wings conformable the one to the other; this one of them had two which covered, and that one of them had two which covered, their bodies.
    translation: JPS 1917
    original: וְתַחַת הָרָקִיעַ כַּנְפֵיהֶם יְשָׁרוֹת אִשָּׁה אֶל־אֲחוֹתָהּ לְאִישׁ שְׁתַּיִם מְכַסּוֹת לָהֵנָּה וּלְאִישׁ שְׁתַּיִם מְכַסּוֹת לָהֵנָּה אֵת גְּוִיֹּתֵיהֶם׃
    hebrewPlain: ותחת הרקיע כנפיהם ישרות אשה אל אחותה לאיש שתים מכסות להנה ולאיש שתים מכסות להנה את גויתיהם
    kjvRefs:
    - Ezekiel 1:23
    kjvOsis:
    - Ezek.1.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.24
    scripture: tanakh
    name: Tanakh Ezekiel 1:24
    ref: Ezekiel 1:24
    book: Ezek
    section: neviim
    chapter: 1
    verse: 24
    ordinal: 12843
    text: And when they went, I heard the noise of their wings like the noise of great waters, like the voice of the Almighty, a noise of tumult like the noise of a host; when they stood, they let down their wings.
    translation: JPS 1917
    original: וָאֶשְׁמַע אֶת־קוֹל כַּנְפֵיהֶם כְּקוֹל מַיִם רַבִּים כְּקוֹל־שַׁדַּי בְּלֶכְתָּם קוֹל הֲמֻלָּה כְּקוֹל מַחֲנֶה בְּעָמְדָם תְּרַפֶּינָה כַנְפֵיהֶן׃
    hebrewPlain: ואשמע את קול כנפיהם כקול מים רבים כקול שדי בלכתם קול המלה כקול מחנה בעמדם תרפינה כנפיהן
    kjvRefs:
    - Ezekiel 1:24
    kjvOsis:
    - Ezek.1.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.25
    scripture: tanakh
    name: Tanakh Ezekiel 1:25
    ref: Ezekiel 1:25
    book: Ezek
    section: neviim
    chapter: 1
    verse: 25
    ordinal: 12844
    text: For, when there was a voice above the firmament that was over their heads, as they stood, they let down their wings.
    translation: JPS 1917
    original: וַיְהִי־קוֹל מֵעַל לָרָקִיעַ אֲשֶׁר עַל־רֹאשָׁם בְּעָמְדָם תְּרַפֶּינָה כַנְפֵיהֶן׃
    hebrewPlain: ויהי קול מעל לרקיע אשר על ראשם בעמדם תרפינה כנפיהן
    kjvRefs:
    - Ezekiel 1:25
    kjvOsis:
    - Ezek.1.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.26
    scripture: tanakh
    name: Tanakh Ezekiel 1:26
    ref: Ezekiel 1:26
    book: Ezek
    section: neviim
    chapter: 1
    verse: 26
    ordinal: 12845
    text: And above the firmament that was over their heads was the likeness of a throne, as the appearance of a sapphire stone; and upon the likeness of the throne was a likeness as the appearance of a man upon it above.
    translation: JPS 1917
    original: וּמִמַּעַל לָרָקִיעַ אֲשֶׁר עַל־רֹאשָׁם כְּמַרְאֵה אֶבֶן־סַפִּיר דְּמוּת כִּסֵּא וְעַל דְּמוּת הַכִּסֵּא דְּמוּת כְּמַרְאֵה אָדָם עָלָיו מִלְמָעְלָה׃
    hebrewPlain: וממעל לרקיע אשר על ראשם כמראה אבן ספיר דמות כסא ועל דמות הכסא דמות כמראה אדם עליו מלמעלה
    kjvRefs:
    - Ezekiel 1:26
    kjvOsis:
    - Ezek.1.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.27
    scripture: tanakh
    name: Tanakh Ezekiel 1:27
    ref: Ezekiel 1:27
    book: Ezek
    section: neviim
    chapter: 1
    verse: 27
    ordinal: 12846
    text: And I saw as the colour of electrum, as the appearance of fire round about enclosing it, from the appearance of his loins and upward; and from the appearance of his loins and downward I saw as it were the appearance of fire, and there was brightness round about him.
    translation: JPS 1917
    original: וָאֵרֶא כְּעֵין חַשְׁמַל כְּמַרְאֵה־אֵשׁ בֵּית־לָהּ סָבִיב מִמַּרְאֵה מָתְנָיו וּלְמָעְלָה וּמִמַּרְאֵה מָתְנָיו וּלְמַטָּה רָאִיתִי כְּמַרְאֵה־אֵשׁ וְנֹגַהּ לוֹ סָבִיב׃
    hebrewPlain: וארא כעין חשמל כמראה אש בית לה סביב ממראה מתניו ולמעלה וממראה מתניו ולמטה ראיתי כמראה אש ונגה לו סביב
    kjvRefs:
    - Ezekiel 1:27
    kjvOsis:
    - Ezek.1.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.1.28
    scripture: tanakh
    name: Tanakh Ezekiel 1:28
    ref: Ezekiel 1:28
    book: Ezek
    section: neviim
    chapter: 1
    verse: 28
    ordinal: 12847
    text: As the appearance of the bow that is in the cloud in the day of rain, so was the appearance of the brightness round about. This was the appearance of the likeness of the glory of the LORD. And when I saw it, I fell upon my face, and I heard a voice of one that spoke.
    translation: JPS 1917
    original: כְּמַרְאֵה הַקֶּשֶׁת אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם כֵּן מַרְאֵה הַנֹּגַהּ סָבִיב הוּא מַרְאֵה דְּמוּת כְּבוֹד־יְהוָה וָאֶרְאֶה וָאֶפֹּל עַל־פָּנַי וָאֶשְׁמַע קוֹל מְדַבֵּר׃
    hebrewPlain: כמראה הקשת אשר יהיה בענן ביום הגשם כן מראה הנגה סביב הוא מראה דמות כבוד יהוה ואראה ואפל על פני ואשמע קול מדבר
    kjvRefs:
    - Ezekiel 1:28
    kjvOsis:
    - Ezek.1.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.1
- type: TanakhVerse
  data:
    osis: Ezek.2.1
    scripture: tanakh
    name: Tanakh Ezekiel 2:1
    ref: Ezekiel 2:1
    book: Ezek
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 12848
    text: 'And He said unto me: ‘Son of man, stand upon thy feet, and I will speak with thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי בֶּן־אָדָם עֲמֹד עַל־רַגְלֶיךָ וַאֲדַבֵּר אֹתָךְ׃
    hebrewPlain: ויאמר אלי בן אדם עמד על רגליך ואדבר אתך
    kjvRefs:
    - Ezekiel 2:1
    kjvOsis:
    - Ezek.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.2
    scripture: tanakh
    name: Tanakh Ezekiel 2:2
    ref: Ezekiel 2:2
    book: Ezek
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 12849
    text: And spirit entered into me when He spoke unto me, and set me upon my feet; and I heard Him that spoke unto me.
    translation: JPS 1917
    original: וַתָּבֹא בִי רוּחַ כַּאֲשֶׁר דִּבֶּר אֵלַי וַתַּעֲמִדֵנִי עַל־רַגְלָי וָאֶשְׁמַע אֵת מִדַּבֵּר אֵלָי׃
    hebrewPlain: ותבא בי רוח כאשר דבר אלי ותעמדני על רגלי ואשמע את מדבר אלי
    kjvRefs:
    - Ezekiel 2:2
    kjvOsis:
    - Ezek.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.3
    scripture: tanakh
    name: Tanakh Ezekiel 2:3
    ref: Ezekiel 2:3
    book: Ezek
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 12850
    text: 'And He said unto me: ‘Son of man, I send thee to the children of Israel, to rebellious nations, that have rebelled against Me; they and their fathers have transgressed against Me, even unto this very day;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם שׁוֹלֵחַ אֲנִי אוֹתְךָ אֶל־בְּנֵי יִשְׂרָאֵל אֶל־גּוֹיִם הַמּוֹרְדִים אֲשֶׁר מָרְדוּ־בִי הֵמָּה וַאֲבוֹתָם פָּשְׁעוּ בִי עַד־עֶצֶם הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאמר אלי בן אדם שולח אני אותך אל בני ישראל אל גוים המורדים אשר מרדו בי המה ואבותם פשעו בי עד עצם היום הזה
    kjvRefs:
    - Ezekiel 2:3
    kjvOsis:
    - Ezek.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.4
    scripture: tanakh
    name: Tanakh Ezekiel 2:4
    ref: Ezekiel 2:4
    book: Ezek
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 12851
    text: 'and the children are brazen-faced and stiff-hearted, I do send thee unto them; and thou shalt say unto them: Thus saith the Lord GOD.'
    translation: JPS 1917
    original: וְהַבָּנִים קְשֵׁי פָנִים וְחִזְקֵי־לֵב אֲנִי שׁוֹלֵחַ אוֹתְךָ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהֹוִה׃
    hebrewPlain: והבנים קשי פנים וחזקי לב אני שולח אותך אליהם ואמרת אליהם כה אמר אדני יהוה
    kjvRefs:
    - Ezekiel 2:4
    kjvOsis:
    - Ezek.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.5
    scripture: tanakh
    name: Tanakh Ezekiel 2:5
    ref: Ezekiel 2:5
    book: Ezek
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 12852
    text: And they, whether they will hear, or whether they will forbear—for they are a rebellious house—yet shall know that there hath been a prophet among them. .
    translation: JPS 1917
    original: וְהֵמָּה אִם־יִשְׁמְעוּ וְאִם־יֶחְדָּלוּ כִּי בֵּית מְרִי הֵמָּה וְיָדְעוּ כִּי נָבִיא הָיָה בְתוֹכָם׃
    hebrewPlain: והמה אם ישמעו ואם יחדלו כי בית מרי המה וידעו כי נביא היה בתוכם
    kjvRefs:
    - Ezekiel 2:5
    kjvOsis:
    - Ezek.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.6
    scripture: tanakh
    name: Tanakh Ezekiel 2:6
    ref: Ezekiel 2:6
    book: Ezek
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 12853
    text: And thou, son of man, be not afraid of them, neither be afraid of their words, though defiers and despisers be with thee, and thou dost dwell among scorpions; be not afraid of their words, nor be dismayed at their looks, for they are a rebellious house.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם אַל־תִּירָא מֵהֶם וּמִדִּבְרֵיהֶם אַל־תִּירָא כִּי סָרָבִים וְסַלּוֹנִים אוֹתָךְ וְאֶל־עַקְרַבִּים אַתָּה יוֹשֵׁב מִדִּבְרֵיהֶם אַל־תִּירָא וּמִפְּנֵיהֶם אַל־תֵּחָת כִּי בֵּית מְרִי הֵמָּה׃
    hebrewPlain: ואתה בן אדם אל תירא מהם ומדבריהם אל תירא כי סרבים וסלונים אותך ואל עקרבים אתה יושב מדבריהם אל תירא ומפניהם אל תחת כי בית מרי המה
    kjvRefs:
    - Ezekiel 2:6
    kjvOsis:
    - Ezek.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.7
    scripture: tanakh
    name: Tanakh Ezekiel 2:7
    ref: Ezekiel 2:7
    book: Ezek
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 12854
    text: And thou shalt speak My words unto them, whether they will hear, or whether they will forbear; for they are most rebellious.
    translation: JPS 1917
    original: וְדִבַּרְתָּ אֶת־דְּבָרַי אֲלֵיהֶם אִם־יִשְׁמְעוּ וְאִם־יֶחְדָּלוּ כִּי מְרִי הֵמָּה׃
    hebrewPlain: ודברת את דברי אליהם אם ישמעו ואם יחדלו כי מרי המה
    kjvRefs:
    - Ezekiel 2:7
    kjvOsis:
    - Ezek.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.8
    scripture: tanakh
    name: Tanakh Ezekiel 2:8
    ref: Ezekiel 2:8
    book: Ezek
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 12855
    text: 'And thou, son of man, hear what I say unto thee: be not thou rebellious like that rebellious house; open thy mouth, and eat that which I give thee.’'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם שְׁמַע אֵת אֲשֶׁר־אֲנִי מְדַבֵּר אֵלֶיךָ אַל־תְּהִי־מֶרִי כְּבֵית הַמֶּרִי פְּצֵה פִיךָ וֶאֱכֹל אֵת אֲשֶׁר־אֲנִי נֹתֵן אֵלֶיךָ׃
    hebrewPlain: ואתה בן אדם שמע את אשר אני מדבר אליך אל תהי מרי כבית המרי פצה פיך ואכל את אשר אני נתן אליך
    kjvRefs:
    - Ezekiel 2:8
    kjvOsis:
    - Ezek.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.9
    scripture: tanakh
    name: Tanakh Ezekiel 2:9
    ref: Ezekiel 2:9
    book: Ezek
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 12856
    text: And when I looked, behold, a hand was put forth unto me; and, lo, a roll of a book was therein;
    translation: JPS 1917
    original: וָאֶרְאֶה וְהִנֵּה־יָד שְׁלוּחָה אֵלָי וְהִנֵּה־בוֹ מְגִלַּת־סֵפֶר׃
    hebrewPlain: ואראה והנה יד שלוחה אלי והנה בו מגלת ספר
    kjvRefs:
    - Ezekiel 2:9
    kjvOsis:
    - Ezek.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.2.10
    scripture: tanakh
    name: Tanakh Ezekiel 2:10
    ref: Ezekiel 2:10
    book: Ezek
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 12857
    text: and He spread it before me, and it was written within and without; and there was written therein lamentations, and moaning, and woe.
    translation: JPS 1917
    original: וַיִּפְרֹשׂ אוֹתָהּ לְפָנַי וְהִיא כְתוּבָה פָּנִים וְאָחוֹר וְכָתוּב אֵלֶיהָ קִנִים וָהֶגֶה וָהִי׃
    hebrewPlain: ויפרש אותה לפני והיא כתובה פנים ואחור וכתוב אליה קנים והגה והי
    kjvRefs:
    - Ezekiel 2:10
    kjvOsis:
    - Ezek.2.10
