- type: TanakhVerse
  data:
    osis: Ezek.28.12
    scripture: tanakh
    name: Tanakh Ezekiel 28:12
    ref: Ezekiel 28:12
    book: Ezek
    section: neviim
    chapter: 28
    verse: 12
    ordinal: 13524
    text: '’Son of man, take up a lamentation for the king of Tyre, and say unto him: Thus saith the Lord GOD: Thou seal most accurate, full of wisdom, and perfect in beauty,'
    translation: JPS 1917
    original: בֶּן־אָדָם שָׂא קִינָה עַל־מֶלֶךְ צוֹר וְאָמַרְתָּ לּוֹ כֹּה אָמַר אֲדֹנָי יְהוִה אַתָּה חוֹתֵם תָּכְנִית מָלֵא חָכְמָה וּכְלִיל יֹפִי׃
    hebrewPlain: בן אדם שא קינה על מלך צור ואמרת לו כה אמר אדני יהוה אתה חותם תכנית מלא חכמה וכליל יפי
    kjvRefs:
    - Ezekiel 28:12
    kjvOsis:
    - Ezek.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.13
    scripture: tanakh
    name: Tanakh Ezekiel 28:13
    ref: Ezekiel 28:13
    book: Ezek
    section: neviim
    chapter: 28
    verse: 13
    ordinal: 13525
    text: thou wast in Eden the garden of God; every precious stone was thy covering, the carnelian, the topaz, and the emerald, the beryl, the onyx, and the jasper, the sapphire, the carbuncle, and the smaragd, and gold; the workmanship of thy settings and of thy sockets was in thee, in the day that thou wast created they were prepared.
    translation: JPS 1917
    original: בְּעֵדֶן גַּן־אֱלֹהִים הָיִיתָ כָּל־אֶבֶן יְקָרָה מְסֻכָתֶךָ אֹדֶם פִּטְדָה וְיָהֲלֹם תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה סַפִּיר נֹפֶךְ וּבָרְקַת וְזָהָב מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ בָּךְ בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ׃
    hebrewPlain: בעדן גן אלהים היית כל אבן יקרה מסכתך אדם פטדה ויהלם תרשיש שהם וישפה ספיר נפך וברקת וזהב מלאכת תפיך ונקביך בך ביום הבראך כוננו
    kjvRefs:
    - Ezekiel 28:13
    kjvOsis:
    - Ezek.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.14
    scripture: tanakh
    name: Tanakh Ezekiel 28:14
    ref: Ezekiel 28:14
    book: Ezek
    section: neviim
    chapter: 28
    verse: 14
    ordinal: 13526
    text: Thou wast the far-covering cherub; and I set thee, so that thou wast upon the holy mountain of God; thou hast walked up and down in the midst of stones of fire.
    translation: JPS 1917
    original: אַתְּ־כְּרוּב מִמְשַׁח הַסּוֹכֵךְ וּנְתַתִּיךָ בְּהַר קֹדֶשׁ אֱלֹהִים הָיִיתָ בְּתוֹךְ אַבְנֵי־אֵשׁ הִתְהַלָּכְתָּ׃
    hebrewPlain: את כרוב ממשח הסוכך ונתתיך בהר קדש אלהים היית בתוך אבני אש התהלכת
    kjvRefs:
    - Ezekiel 28:14
    kjvOsis:
    - Ezek.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.15
    scripture: tanakh
    name: Tanakh Ezekiel 28:15
    ref: Ezekiel 28:15
    book: Ezek
    section: neviim
    chapter: 28
    verse: 15
    ordinal: 13527
    text: Thou wast perfect in thy ways from the day that thou wast created, till unrighteousness was found in thee.
    translation: JPS 1917
    original: תָּמִים אַתָּה בִּדְרָכֶיךָ מִיּוֹם הִבָּרְאָךְ עַד־נִמְצָא עַוְלָתָה בָּךְ׃
    hebrewPlain: תמים אתה בדרכיך מיום הבראך עד נמצא עולתה בך
    kjvRefs:
    - Ezekiel 28:15
    kjvOsis:
    - Ezek.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.16
    scripture: tanakh
    name: Tanakh Ezekiel 28:16
    ref: Ezekiel 28:16
    book: Ezek
    section: neviim
    chapter: 28
    verse: 16
    ordinal: 13528
    text: By the multitude of thy traffic they filled the midst of thee with violence, and thou hast sinned; therefore have I cast thee as profane out of the mountain of God; and I have destroyed thee, O covering cherub, from the midst of the stones of fire.
    translation: JPS 1917
    original: בְּרֹב רְכֻלָּתְךָ מָלוּ תוֹכְךָ חָמָס וַתֶּחֱטָא וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים וָאַבֶּדְךָ כְּרוּב הַסֹּכֵךְ מִתּוֹךְ אַבְנֵי־אֵשׁ׃
    hebrewPlain: ברב רכלתך מלו תוכך חמס ותחטא ואחללך מהר אלהים ואבדך כרוב הסכך מתוך אבני אש
    kjvRefs:
    - Ezekiel 28:16
    kjvOsis:
    - Ezek.28.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.17
    scripture: tanakh
    name: Tanakh Ezekiel 28:17
    ref: Ezekiel 28:17
    book: Ezek
    section: neviim
    chapter: 28
    verse: 17
    ordinal: 13529
    text: Thy heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness; I have cast thee to the ground, I have laid thee before kings, that they may gaze upon thee.
    translation: JPS 1917
    original: גָּבַהּ לִבְּךָ בְּיָפְיֶךָ שִׁחַתָּ חָכְמָתְךָ עַל־יִפְעָתֶךָ עַל־אֶרֶץ הִשְׁלַכְתִּיךָ לִפְנֵי מְלָכִים נְתַתִּיךָ לְרַאֲוָה בָךְ׃
    hebrewPlain: גבה לבך ביפיך שחת חכמתך על יפעתך על ארץ השלכתיך לפני מלכים נתתיך לראוה בך
    kjvRefs:
    - Ezekiel 28:17
    kjvOsis:
    - Ezek.28.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.18
    scripture: tanakh
    name: Tanakh Ezekiel 28:18
    ref: Ezekiel 28:18
    book: Ezek
    section: neviim
    chapter: 28
    verse: 18
    ordinal: 13530
    text: By the multitude of thine iniquities, in the unrighteousness of thy traffic, thou hast profaned thy sanctuaries; therefore have I brought forth a fire from the midst of thee, it hath devoured thee, and I have turned thee to ashes upon the earth in the sight of all them that behold thee.
    translation: JPS 1917
    original: מֵרֹב עֲוֺנֶיךָ בְּעֶוֶל רְכֻלָּתְךָ חִלַּלְתָּ מִקְדָּשֶׁיךָ וָאוֹצִא־אֵשׁ מִתּוֹכְךָ הִיא אֲכָלַתְךָ וָאֶתֶּנְךָ לְאֵפֶר עַל־הָאָרֶץ לְעֵינֵי כָּל־רֹאֶיךָ׃
    hebrewPlain: מרב עוניך בעול רכלתך חללת מקדשיך ואוצא אש מתוכך היא אכלתך ואתנך לאפר על הארץ לעיני כל ראיך
    kjvRefs:
    - Ezekiel 28:18
    kjvOsis:
    - Ezek.28.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.19
    scripture: tanakh
    name: Tanakh Ezekiel 28:19
    ref: Ezekiel 28:19
    book: Ezek
    section: neviim
    chapter: 28
    verse: 19
    ordinal: 13531
    text: All they that know thee among the peoples shall be appalled at thee; thou art become a terror, and thou shalt never be any more.’
    translation: JPS 1917
    original: כָּל־יוֹדְעֶיךָ בָּעַמִּים שָׁמְמוּ עָלֶיךָ בַּלָּהוֹת הָיִיתָ וְאֵינְךָ עַד־עוֹלָם׃
    hebrewPlain: כל יודעיך בעמים שממו עליך בלהות היית ואינך עד עולם
    kjvRefs:
    - Ezekiel 28:19
    kjvOsis:
    - Ezek.28.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.20
    scripture: tanakh
    name: Tanakh Ezekiel 28:20
    ref: Ezekiel 28:20
    book: Ezek
    section: neviim
    chapter: 28
    verse: 20
    ordinal: 13532
