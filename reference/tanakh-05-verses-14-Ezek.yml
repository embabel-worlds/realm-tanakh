    name: Tanakh Ezekiel 12:12
    ref: Ezekiel 12:12
    book: Ezek
    section: neviim
    chapter: 12
    verse: 12
    ordinal: 13047
    text: And the prince that is among them shall bear upon his shoulder, and go forth in the darkness; they shall dig through the wall to carry out thereby; he shall cover his face, that he see not the ground with his eyes.
    translation: JPS 1917
    original: וְהַנָּשִׂיא אֲשֶׁר־בְּתוֹכָם אֶל־כָּתֵף יִשָּׂא בָּעֲלָטָה וְיֵצֵא בַּקִּיר יַחְתְּרוּ לְהוֹצִיא בוֹ פָּנָיו יְכַסֶּה יַעַן אֲשֶׁר לֹא־יִרְאֶה לַעַיִן הוּא אֶת־הָאָרֶץ׃
    hebrewPlain: והנשיא אשר בתוכם אל כתף ישא בעלטה ויצא בקיר יחתרו להוציא בו פניו יכסה יען אשר לא יראה לעין הוא את הארץ
    kjvRefs:
