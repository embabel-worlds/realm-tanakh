      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.4
    scripture: tanakh
    name: Tanakh Ezekiel 28:4
    ref: Ezekiel 28:4
    book: Ezek
    section: neviim
    chapter: 28
    verse: 4
    ordinal: 13516
    text: By thy wisdom and by thy discernment Thou hast gotten thee riches, And hast gotten gold and silver Into thy treasures;
    translation: JPS 1917
    original: בְּחָכְמָתְךָ וּבִתְבוּנָתְךָ עָשִׂיתָ לְּךָ חָיִל וַתַּעַשׂ זָהָב וָכֶסֶף בְּאוֹצְרוֹתֶיךָ׃
    hebrewPlain: בחכמתך ובתבונתך עשית לך חיל ותעש זהב וכסף באוצרותיך
    kjvRefs:
    - Ezekiel 28:4
    kjvOsis:
    - Ezek.28.4
