    verse: 3
    ordinal: 14060
    text: 'And by the border of Asher, from the east side even unto the west side: Naphtali, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל אָשֵׁר מִפְּאַת קָדִימָה וְעַד־פְּאַת־יָמָּה נַפְתָּלִי אֶחָד׃
    hebrewPlain: ועל גבול אשר מפאת קדימה ועד פאת ימה נפתלי אחד
