- type: TanakhVerse
  data:
    osis: Ezek.21.36
    scripture: tanakh
    name: Tanakh Ezekiel 21:36
    ref: Ezekiel 21:36
    book: Ezek
    section: neviim
    chapter: 21
    verse: 36
    ordinal: 13330
    text: And I will pour out My indignation upon thee, I will blow upon thee with the fire of My wrath; and I will deliver thee into the hand of brutish men, skillful to destroy.
    translation: JPS 1917
    original: וְשָׁפַכְתִּי עָלַיִךְ זַעְמִי בְּאֵשׁ עֶבְרָתִי אָפִיחַ עָלָיִךְ וּנְתַתִּיךְ בְּיַד אֲנָשִׁים בֹּעֲרִים חָרָשֵׁי מַשְׁחִית׃
    hebrewPlain: ושפכתי עליך זעמי באש עברתי אפיח עליך ונתתיך ביד אנשים בערים חרשי משחית
    kjvRefs:
    - Ezekiel 21:31
    kjvOsis:
    - Ezek.21.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.37
    scripture: tanakh
    name: Tanakh Ezekiel 21:37
    ref: Ezekiel 21:37
    book: Ezek
    section: neviim
    chapter: 21
    verse: 37
    ordinal: 13331
    text: Thou shalt be for fuel to the fire; Thy blood shall be in the midst of the land, Thou shalt be no more remembered; For I the LORD have spoken it.’
    translation: JPS 1917
    original: לָאֵשׁ תִּהְיֶה לְאָכְלָה דָּמֵךְ יִהְיֶה בְּתוֹךְ הָאָרֶץ לֹא תִזָּכֵרִי כִּי אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: לאש תהיה לאכלה דמך יהיה בתוך הארץ לא תזכרי כי אני יהוה דברתי
    kjvRefs:
    - Ezekiel 21:32
    kjvOsis:
    - Ezek.21.32
