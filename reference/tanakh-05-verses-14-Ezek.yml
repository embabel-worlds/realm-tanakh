    name: Tanakh Ezekiel 47:20
    ref: Ezekiel 47:20
    book: Ezek
    section: neviim
    chapter: 47
    verse: 20
    ordinal: 14054
    text: And the west side shall be the Great Sea, from the border as far as over against the entrance of Hamath. This is the west side.
    translation: JPS 1917
    original: וּפְאַת־יָם הַיָּם הַגָּדוֹל מִגְּבוּל עַד־נֹכַח לְבוֹא חֲמָת זֹאת פְּאַת־יָם׃
    hebrewPlain: ופאת ים הים הגדול מגבול עד נכח לבוא חמת זאת פאת ים
    kjvRefs:
