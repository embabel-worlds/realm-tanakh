  data:
    osis: Ezek.12.18
    scripture: tanakh
    name: Tanakh Ezekiel 12:18
    ref: Ezekiel 12:18
    book: Ezek
    section: neviim
    chapter: 12
    verse: 18
    ordinal: 13053
    text: ’Son of man, eat thy bread with quaking, and drink thy water with trembling and with anxiety;
    translation: JPS 1917
    original: בֶּן־אָדָם לַחְמְךָ בְּרַעַשׁ תֹּאכֵל וּמֵימֶיךָ בְּרָגְזָה וּבִדְאָגָה תִּשְׁתֶּה׃
    hebrewPlain: בן אדם לחמך ברעש תאכל ומימיך ברגזה ובדאגה תשתה
    kjvRefs:
    - Ezekiel 12:18
    kjvOsis:
    - Ezek.12.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.19
    scripture: tanakh
    name: Tanakh Ezekiel 12:19
    ref: Ezekiel 12:19
    book: Ezek
    section: neviim
    chapter: 12
    verse: 19
    ordinal: 13054
    text: 'and say unto the people of the land: Thus saith the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel. They shall eat their bread with anxiety, and drink their water with appalment, that her land may be desolate from all that is therein, because of the violence of all them that dwell therein.'
    translation: JPS 1917
    original: וְאָמַרְתָּ אֶל־עַם הָאָרֶץ כֹּה־אָמַר אֲדֹנָי יְהוִה לְיוֹשְׁבֵי יְרוּשָׁלִַם אֶל־אַדְמַת יִשְׂרָאֵל לַחְמָם בִּדְאָגָה יֹאכֵלוּ וּמֵימֵיהֶם בְּשִׁמָּמוֹן יִשְׁתּוּ לְמַעַן תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ מֵחֲמַס כָּל־הַיֹּשְׁבִים בָּהּ׃
    hebrewPlain: ואמרת אל עם הארץ כה אמר אדני יהוה ליושבי ירושלם אל אדמת ישראל לחמם בדאגה יאכלו ומימיהם בשממון ישתו למען תשם ארצה ממלאה מחמס כל הישבים בה
    kjvRefs:
    - Ezekiel 12:19
    kjvOsis:
    - Ezek.12.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.20
    scripture: tanakh
    name: Tanakh Ezekiel 12:20
    ref: Ezekiel 12:20
    book: Ezek
    section: neviim
    chapter: 12
    verse: 20
    ordinal: 13055
    text: And the cities that are inhabited shall be laid waste, and the land shall be desolate; and ye shall know that I am the LORD.’
    translation: JPS 1917
    original: וְהֶעָרִים הַנּוֹשָׁבוֹת תֶּחֱרַבְנָה וְהָאָרֶץ שְׁמָמָה תִהְיֶה וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והערים הנושבות תחרבנה והארץ שממה תהיה וידעתם כי אני יהוה
