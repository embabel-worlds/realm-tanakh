    ref: Ezekiel 24:13
    book: Ezek
    section: neviim
    chapter: 24
    verse: 13
    ordinal: 13424
    text: Because of thy filthy lewdness, because I have purged thee and thou wast not purged, thou shalt not be purged from thy filthiness any more, till I have satisfied My fury upon thee.
    translation: JPS 1917
    original: בְּטֻמְאָתֵךְ זִמָּה יַעַן טִהַרְתִּיךְ וְלֹא טָהַרְתְּ מִטֻּמְאָתֵךְ לֹא תִטְהֲרִי־עוֹד עַד־הֲנִיחִי אֶת־חֲמָתִי בָּךְ׃
    hebrewPlain: בטמאתך זמה יען טהרתיך ולא טהרת מטמאתך לא תטהרי עוד עד הניחי את חמתי בך
    kjvRefs:
