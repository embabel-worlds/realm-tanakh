    section: neviim
    chapter: 48
    verse: 4
    ordinal: 14061
    text: 'And by the border of Naphtali, from the east side unto the west side: Manasseh, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל נַפְתָּלִי מִפְּאַת קָדִמָה עַד־פְּאַת־יָמָּה מְנַשֶּׁה אֶחָד׃
    hebrewPlain: ועל גבול נפתלי מפאת קדמה עד פאת ימה מנשה אחד
