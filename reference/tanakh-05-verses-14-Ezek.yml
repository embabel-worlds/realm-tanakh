    to:
      type: TanakhChapter
      osis: Ezek.2
- type: TanakhVerse
  data:
    osis: Ezek.3.1
    scripture: tanakh
    name: Tanakh Ezekiel 3:1
    ref: Ezekiel 3:1
    book: Ezek
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 12858
    text: 'And He said unto me: ‘Son of man, eat that which thou findest; eat this roll, and go, speak unto the house of Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם אֵת אֲשֶׁר־תִּמְצָא אֱכוֹל אֱכוֹל אֶת־הַמְּגִלָּה הַזֹּאת וְלֵךְ דַּבֵּר אֶל־בֵּית יִשְׂרָאֵל׃
    hebrewPlain: ויאמר אלי בן אדם את אשר תמצא אכול אכול את המגלה הזאת ולך דבר אל בית ישראל
    kjvRefs:
    - Ezekiel 3:1
    kjvOsis:
    - Ezek.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.2
    scripture: tanakh
    name: Tanakh Ezekiel 3:2
    ref: Ezekiel 3:2
    book: Ezek
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 12859
    text: So I opened my mouth, and He caused me to eat that roll.
    translation: JPS 1917
    original: וָאֶפְתַּח אֶת־פִּי וַיַּאֲכִלֵנִי אֵת הַמְּגִלָּה הַזֹּאת׃
    hebrewPlain: ואפתח את פי ויאכלני את המגלה הזאת
    kjvRefs:
    - Ezekiel 3:2
    kjvOsis:
    - Ezek.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.3
    scripture: tanakh
    name: Tanakh Ezekiel 3:3
    ref: Ezekiel 3:3
    book: Ezek
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 12860
    text: 'And He said unto me: ‘Son of man, cause thy belly to eat, and fill thy bowels with this roll that I give thee.’ Then did I eat it; and it was in my mouth as honey for sweetness.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם בִּטְנְךָ תַאֲכֵל וּמֵעֶיךָ תְמַלֵּא אֵת הַמְּגִלָּה הַזֹּאת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ וָאֹכְלָה וַתְּהִי בְּפִי כִּדְבַשׁ לְמָתוֹק׃
    hebrewPlain: ויאמר אלי בן אדם בטנך תאכל ומעיך תמלא את המגלה הזאת אשר אני נתן אליך ואכלה ותהי בפי כדבש למתוק
    kjvRefs:
    - Ezekiel 3:3
    kjvOsis:
    - Ezek.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.4
    scripture: tanakh
    name: Tanakh Ezekiel 3:4
    ref: Ezekiel 3:4
    book: Ezek
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 12861
    text: 'And He said unto me: ‘Son of man, go, get thee unto the house of Israel, and speak with My words unto them.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי בֶּן־אָדָם לֶךְ־בֹּא אֶל־בֵּית יִשְׂרָאֵל וְדִבַּרְתָּ בִדְבָרַי אֲלֵיהֶם׃
    hebrewPlain: ויאמר אלי בן אדם לך בא אל בית ישראל ודברת בדברי אליהם
    kjvRefs:
    - Ezekiel 3:4
    kjvOsis:
    - Ezek.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.5
    scripture: tanakh
    name: Tanakh Ezekiel 3:5
    ref: Ezekiel 3:5
    book: Ezek
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 12862
    text: For thou art not sent to a people of an unintelligible speech and of a slow tongue, but to the house of Israel;
    translation: JPS 1917
    original: כִּי לֹא אֶל־עַם עִמְקֵי שָׂפָה וְכִבְדֵי לָשׁוֹן אַתָּה שָׁלוּחַ אֶל־בֵּית יִשְׂרָאֵל׃
    hebrewPlain: כי לא אל עם עמקי שפה וכבדי לשון אתה שלוח אל בית ישראל
    kjvRefs:
    - Ezekiel 3:5
    kjvOsis:
    - Ezek.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.6
    scripture: tanakh
    name: Tanakh Ezekiel 3:6
    ref: Ezekiel 3:6
    book: Ezek
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 12863
    text: not to many peoples of an unintelligible speech and of a slow tongue, whose words thou canst not understand. Surely, if I sent thee to them, they would hearken unto thee.
    translation: JPS 1917
    original: לֹא אֶל־עַמִּים רַבִּים עִמְקֵי שָׂפָה וְכִבְדֵי לָשׁוֹן אֲשֶׁר לֹא־תִשְׁמַע דִּבְרֵיהֶם אִם־לֹא אֲלֵיהֶם שְׁלַחְתִּיךָ הֵמָּה יִשְׁמְעוּ אֵלֶיךָ׃
    hebrewPlain: לא אל עמים רבים עמקי שפה וכבדי לשון אשר לא תשמע דבריהם אם לא אליהם שלחתיך המה ישמעו אליך
    kjvRefs:
    - Ezekiel 3:6
    kjvOsis:
    - Ezek.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.7
    scripture: tanakh
    name: Tanakh Ezekiel 3:7
    ref: Ezekiel 3:7
    book: Ezek
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 12864
    text: But the house of Israel will not consent to hearken unto thee; for they consent not to hearken unto Me; for all the house of Israel are of a hard forehead and of a stiff heart.
    translation: JPS 1917
    original: וּבֵית יִשְׂרָאֵל לֹא יֹאבוּ לִשְׁמֹעַ אֵלֶיךָ כִּי־אֵינָם אֹבִים לִשְׁמֹעַ אֵלָי כִּי כָּל־בֵּית יִשְׂרָאֵל חִזְקֵי־מֵצַח וּקְשֵׁי־לֵב הֵמָּה׃
    hebrewPlain: ובית ישראל לא יאבו לשמע אליך כי אינם אבים לשמע אלי כי כל בית ישראל חזקי מצח וקשי לב המה
    kjvRefs:
    - Ezekiel 3:7
    kjvOsis:
    - Ezek.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.8
    scripture: tanakh
    name: Tanakh Ezekiel 3:8
    ref: Ezekiel 3:8
    book: Ezek
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 12865
    text: Behold, I have made thy face hard against their faces, and thy forehead hard against their foreheads.
    translation: JPS 1917
    original: הִנֵּה נָתַתִּי אֶת־פָּנֶיךָ חֲזָקִים לְעֻמַּת פְּנֵיהֶם וְאֶת־מִצְחֲךָ חָזָק לְעֻמַּת מִצְחָם׃
    hebrewPlain: הנה נתתי את פניך חזקים לעמת פניהם ואת מצחך חזק לעמת מצחם
    kjvRefs:
    - Ezekiel 3:8
    kjvOsis:
    - Ezek.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.9
    scripture: tanakh
    name: Tanakh Ezekiel 3:9
    ref: Ezekiel 3:9
    book: Ezek
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 12866
    text: As an adamant harder than flint have I made thy forehead; fear them not, neither be dismayed at their looks, for they are a rebellious house.’
    translation: JPS 1917
    original: כְּשָׁמִיר חָזָק מִצֹּר נָתַתִּי מִצְחֶךָ לֹא־תִירָא אוֹתָם וְלֹא־תֵחַת מִפְּנֵיהֶם כִּי בֵּית־מְרִי הֵמָּה׃
    hebrewPlain: כשמיר חזק מצר נתתי מצחך לא תירא אותם ולא תחת מפניהם כי בית מרי המה
    kjvRefs:
    - Ezekiel 3:9
    kjvOsis:
    - Ezek.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.10
    scripture: tanakh
    name: Tanakh Ezekiel 3:10
    ref: Ezekiel 3:10
    book: Ezek
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 12867
    text: 'Moreover He said unto me: ‘Son of man, all My words that I shall speak unto thee receive in thy heart, and hear with thine ears.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי בֶּן־אָדָם אֶת־כָּל־דְּבָרַי אֲשֶׁר אֲדַבֵּר אֵלֶיךָ קַח בִּלְבָבְךָ וּבְאָזְנֶיךָ שְׁמָע׃
    hebrewPlain: ויאמר אלי בן אדם את כל דברי אשר אדבר אליך קח בלבבך ובאזניך שמע
    kjvRefs:
    - Ezekiel 3:10
    kjvOsis:
    - Ezek.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.11
    scripture: tanakh
    name: Tanakh Ezekiel 3:11
    ref: Ezekiel 3:11
    book: Ezek
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 12868
    text: 'And go, get thee to them of the captivity, unto the children of thy people, and speak unto them, and tell them: Thus saith the Lord GOD; whether they will hear, or whether they will forbear.’'
    translation: JPS 1917
    original: וְלֵךְ בֹּא אֶל־הַגּוֹלָה אֶל־בְּנֵי עַמֶּךָ וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהֹוִה אִם־יִשְׁמְעוּ וְאִם־יֶחְדָּלוּ׃
    hebrewPlain: ולך בא אל הגולה אל בני עמך ודברת אליהם ואמרת אליהם כה אמר אדני יהוה אם ישמעו ואם יחדלו
    kjvRefs:
    - Ezekiel 3:11
    kjvOsis:
    - Ezek.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.12
    scripture: tanakh
    name: Tanakh Ezekiel 3:12
    ref: Ezekiel 3:12
    book: Ezek
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 12869
    text: 'Then a spirit lifted me up, and I heard behind me the voice of a great rushing: ‘Blessed be the glory of the LORD from His place’;'
    translation: JPS 1917
    original: וַתִּשָּׂאֵנִי רוּחַ וָאֶשְׁמַע אַחֲרַי קוֹל רַעַשׁ גָּדוֹל בָּרוּךְ כְּבוֹד־יְהוָה מִמְּקוֹמוֹ׃
    hebrewPlain: ותשאני רוח ואשמע אחרי קול רעש גדול ברוך כבוד יהוה ממקומו
    kjvRefs:
    - Ezekiel 3:12
    kjvOsis:
    - Ezek.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.13
    scripture: tanakh
    name: Tanakh Ezekiel 3:13
    ref: Ezekiel 3:13
    book: Ezek
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 12870
    text: also the noise of the wings of the living creatures as they touched one another, and the noise of the wheels beside them, even the noise of a great rushing.
    translation: JPS 1917
    original: וְקוֹל כַּנְפֵי הַחַיּוֹת מַשִּׁיקוֹת אִשָּׁה אֶל־אֲחוֹתָהּ וְקוֹל הָאוֹפַנִּים לְעֻמָּתָם וְקוֹל רַעַשׁ גָּדוֹל׃
    hebrewPlain: וקול כנפי החיות משיקות אשה אל אחותה וקול האופנים לעמתם וקול רעש גדול
    kjvRefs:
    - Ezekiel 3:13
    kjvOsis:
    - Ezek.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.14
    scripture: tanakh
    name: Tanakh Ezekiel 3:14
    ref: Ezekiel 3:14
    book: Ezek
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 12871
    text: So a spirit lifted me up, and took me away; and I went in bitterness, in the heat of my spirit, and the hand of the LORD was strong upon me.
    translation: JPS 1917
    original: וְרוּחַ נְשָׂאַתְנִי וַתִּקָּחֵנִי וָאֵלֵךְ מַר בַּחֲמַת רוּחִי וְיַד־יְהוָה עָלַי חָזָקָה׃
    hebrewPlain: ורוח נשאתני ותקחני ואלך מר בחמת רוחי ויד יהוה עלי חזקה
    kjvRefs:
    - Ezekiel 3:14
    kjvOsis:
    - Ezek.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.15
    scripture: tanakh
    name: Tanakh Ezekiel 3:15
    ref: Ezekiel 3:15
    book: Ezek
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 12872
    text: Then I came to them of the captivity at Tel-abib, that dwelt by the river Chebar, and I sat where they sat; and I remained there appalled among them seven days.
    translation: JPS 1917
    original: וָאָבוֹא אֶל־הַגּוֹלָה תֵּל אָבִיב הַיֹּשְׁבִים אֶל־נְהַר־כְּבָר ואשר [וָאֵשֵׁב] הֵמָּה יוֹשְׁבִים שָׁם וָאֵשֵׁב שָׁם שִׁבְעַת יָמִים מַשְׁמִים בְּתוֹכָם׃
    hebrewPlain: ואבוא אל הגולה תל אביב הישבים אל נהר כבר ואשר [ואשב] המה יושבים שם ואשב שם שבעת ימים משמים בתוכם
    kjvRefs:
    - Ezekiel 3:15
    kjvOsis:
    - Ezek.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.16
    scripture: tanakh
    name: Tanakh Ezekiel 3:16
    ref: Ezekiel 3:16
    book: Ezek
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 12873
    text: 'And it came to pass at the end of seven days, that the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי מִקְצֵה שִׁבְעַת יָמִים וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי מקצה שבעת ימים ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 3:16
    kjvOsis:
    - Ezek.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.17
    scripture: tanakh
    name: Tanakh Ezekiel 3:17
    ref: Ezekiel 3:17
    book: Ezek
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 12874
    text: ’Son of man, I have appointed thee a watchman unto the house of Israel; and when thou shalt hear a word at My mouth, thou shalt give them warning from Me.
    translation: JPS 1917
    original: בֶּן־אָדָם צֹפֶה נְתַתִּיךָ לְבֵית יִשְׂרָאֵל וְשָׁמַעְתָּ מִפִּי דָּבָר וְהִזְהַרְתָּ אוֹתָם מִמֶּנִּי׃
    hebrewPlain: בן אדם צפה נתתיך לבית ישראל ושמעת מפי דבר והזהרת אותם ממני
    kjvRefs:
    - Ezekiel 3:17
    kjvOsis:
    - Ezek.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.18
    scripture: tanakh
    name: Tanakh Ezekiel 3:18
    ref: Ezekiel 3:18
    book: Ezek
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 12875
    text: 'When I say unto the wicked: Thou shalt surely die; and thou givest him not warning, nor speakest to warn the wicked from his wicked way, to save his life; the same wicked man shall die in his iniquity, but his blood will I require at thy hand.'
    translation: JPS 1917
    original: בְּאָמְרִי לָרָשָׁע מוֹת תָּמוּת וְלֹא הִזְהַרְתּוֹ וְלֹא דִבַּרְתָּ לְהַזְהִיר רָשָׁע מִדַּרְכּוֹ הָרְשָׁעָה לְחַיֹּתוֹ הוּא רָשָׁע בַּעֲוֺנוֹ יָמוּת וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ׃
    hebrewPlain: באמרי לרשע מות תמות ולא הזהרתו ולא דברת להזהיר רשע מדרכו הרשעה לחיתו הוא רשע בעונו ימות ודמו מידך אבקש
    kjvRefs:
    - Ezekiel 3:18
    kjvOsis:
    - Ezek.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.19
    scripture: tanakh
    name: Tanakh Ezekiel 3:19
    ref: Ezekiel 3:19
    book: Ezek
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 12876
    text: Yet if thou warn the wicked, and he turn not from his wickedness, nor from his wicked way, he shall die in his iniquity; but thou hast delivered thy soul.
    translation: JPS 1917
    original: וְאַתָּה כִּי־הִזְהַרְתָּ רָשָׁע וְלֹא־שָׁב מֵרִשְׁעוֹ וּמִדַּרְכּוֹ הָרְשָׁעָה הוּא בַּעֲוֺנוֹ יָמוּת וְאַתָּה אֶת־נַפְשְׁךָ הִצַּלְתָּ׃
    hebrewPlain: ואתה כי הזהרת רשע ולא שב מרשעו ומדרכו הרשעה הוא בעונו ימות ואתה את נפשך הצלת
    kjvRefs:
    - Ezekiel 3:19
    kjvOsis:
    - Ezek.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.20
    scripture: tanakh
    name: Tanakh Ezekiel 3:20
    ref: Ezekiel 3:20
    book: Ezek
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 12877
    text: Again, when a righteous man doth turn from his righteousness, and commit iniquity, I will lay a stumblingblock before him, he shall die; because thou hast not given him warning, he shall die in his sin, and his righteous deeds which he hath done shall not be remembered; but his blood will I require at thy hand.
    translation: JPS 1917
    original: וּבְשׁוּב צַדִּיק מִצִּדְקוֹ וְעָשָׂה עָוֶל וְנָתַתִּי מִכְשׁוֹל לְפָנָיו הוּא יָמוּת כִּי לֹא הִזְהַרְתּוֹ בְּחַטָּאתוֹ יָמוּת וְלֹא תִזָּכַרְןָ צִדְקֹתָו אֲשֶׁר עָשָׂה וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ׃
    hebrewPlain: ובשוב צדיק מצדקו ועשה עול ונתתי מכשול לפניו הוא ימות כי לא הזהרתו בחטאתו ימות ולא תזכרן צדקתו אשר עשה ודמו מידך אבקש
    kjvRefs:
    - Ezekiel 3:20
    kjvOsis:
    - Ezek.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.21
    scripture: tanakh
    name: Tanakh Ezekiel 3:21
    ref: Ezekiel 3:21
    book: Ezek
    section: neviim
    chapter: 3
    verse: 21
    ordinal: 12878
    text: Nevertheless if thou warn the righteous man, that the righteous sin not, and he doth not sin, he shall surely live, because he took warning; and thou hast delivered thy soul.’
    translation: JPS 1917
    original: וְאַתָּה כִּי הִזְהַרְתּוֹ צַדִּיק לְבִלְתִּי חֲטֹא צַדִּיק וְהוּא לֹא־חָטָא חָיוֹ יִחְיֶה כִּי נִזְהָר וְאַתָּה אֶת־נַפְשְׁךָ הִצַּלְתָּ׃
    hebrewPlain: ואתה כי הזהרתו צדיק לבלתי חטא צדיק והוא לא חטא חיו יחיה כי נזהר ואתה את נפשך הצלת
    kjvRefs:
    - Ezekiel 3:21
    kjvOsis:
    - Ezek.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.22
    scripture: tanakh
    name: Tanakh Ezekiel 3:22
    ref: Ezekiel 3:22
    book: Ezek
    section: neviim
    chapter: 3
    verse: 22
    ordinal: 12879
    text: 'And the hand of the LORD came there upon me; and He said unto me: ‘Arise, go forth into the plain, and I will there speak with thee.’'
    translation: JPS 1917
    original: וַתְּהִי עָלַי שָׁם יַד־יְהוָה וַיֹּאמֶר אֵלַי קוּם צֵא אֶל־הַבִּקְעָה וְשָׁם אֲדַבֵּר אוֹתָךְ׃
    hebrewPlain: ותהי עלי שם יד יהוה ויאמר אלי קום צא אל הבקעה ושם אדבר אותך
    kjvRefs:
    - Ezekiel 3:22
    kjvOsis:
    - Ezek.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.23
    scripture: tanakh
    name: Tanakh Ezekiel 3:23
    ref: Ezekiel 3:23
    book: Ezek
    section: neviim
    chapter: 3
    verse: 23
    ordinal: 12880
    text: Then I arose, and went forth into the plain; and, behold, the glory of the LORD stood there, as the glory which I saw by the river Chebar; and I fell on my face.
    translation: JPS 1917
    original: וָאָקוּם וָאֵצֵא אֶל־הַבִּקְעָה וְהִנֵּה־שָׁם כְּבוֹד־יְהוָה עֹמֵד כַּכָּבוֹד אֲשֶׁר רָאִיתִי עַל־נְהַר־כְּבָר וָאֶפֹּל עַל־פָּנָי׃
    hebrewPlain: ואקום ואצא אל הבקעה והנה שם כבוד יהוה עמד ככבוד אשר ראיתי על נהר כבר ואפל על פני
    kjvRefs:
    - Ezekiel 3:23
    kjvOsis:
    - Ezek.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.24
    scripture: tanakh
    name: Tanakh Ezekiel 3:24
    ref: Ezekiel 3:24
    book: Ezek
    section: neviim
    chapter: 3
    verse: 24
    ordinal: 12881
    text: 'Then spirit entered into me, and set me upon my feet; and He spoke with me, and said unto me: ‘Go, shut thyself within thy house.'
    translation: JPS 1917
    original: וַתָּבֹא־בִי רוּחַ וַתַּעֲמִדֵנִי עַל־רַגְלָי וַיְדַבֵּר אֹתִי וַיֹּאמֶר אֵלַי בֹּא הִסָּגֵר בְּתוֹךְ בֵּיתֶךָ׃
    hebrewPlain: ותבא בי רוח ותעמדני על רגלי וידבר אתי ויאמר אלי בא הסגר בתוך ביתך
    kjvRefs:
    - Ezekiel 3:24
    kjvOsis:
    - Ezek.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.25
    scripture: tanakh
    name: Tanakh Ezekiel 3:25
    ref: Ezekiel 3:25
    book: Ezek
    section: neviim
    chapter: 3
    verse: 25
    ordinal: 12882
    text: But thou, son of man, behold, bands shall be put upon thee, and thou shalt be bound with them, and thou shalt not go out among them;
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הִנֵּה נָתְנוּ עָלֶיךָ עֲבוֹתִים וַאֲסָרוּךָ בָּהֶם וְלֹא תֵצֵא בְּתוֹכָם׃
    hebrewPlain: ואתה בן אדם הנה נתנו עליך עבותים ואסרוך בהם ולא תצא בתוכם
    kjvRefs:
    - Ezekiel 3:25
    kjvOsis:
    - Ezek.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.26
    scripture: tanakh
    name: Tanakh Ezekiel 3:26
    ref: Ezekiel 3:26
    book: Ezek
    section: neviim
    chapter: 3
    verse: 26
    ordinal: 12883
    text: and I will make thy tongue cleave to the roof of thy mouth, that thou shalt be dumb, and shalt not be to them a reprover; for they are a rebellious house.
    translation: JPS 1917
    original: וּלְשׁוֹנְךָ אַדְבִּיק אֶל־חִכֶּךָ וְנֶאֱלַמְתָּ וְלֹא־תִהְיֶה לָהֶם לְאִישׁ מוֹכִיחַ כִּי בֵּית מְרִי הֵמָּה׃
    hebrewPlain: ולשונך אדביק אל חכך ונאלמת ולא תהיה להם לאיש מוכיח כי בית מרי המה
    kjvRefs:
    - Ezekiel 3:26
    kjvOsis:
    - Ezek.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.3.27
    scripture: tanakh
    name: Tanakh Ezekiel 3:27
    ref: Ezekiel 3:27
    book: Ezek
    section: neviim
    chapter: 3
    verse: 27
    ordinal: 12884
    text: 'But when I speak with thee, I will open thy mouth, and thou shalt say unto them: Thus saith the Lord GOD; he that heareth, let him hear, and he that forbeareth, let him forbear; for they are a rebellious house.'
    translation: JPS 1917
    original: וּבְדַבְּרִי אוֹתְךָ אֶפְתַּח אֶת־פִּיךָ וְאָמַרְתָּ אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהֹוִה הַשֹּׁמֵעַ יִשְׁמָע וְהֶחָדֵל יֶחְדָּל כִּי בֵּית מְרִי הֵמָּה׃
    hebrewPlain: ובדברי אותך אפתח את פיך ואמרת אליהם כה אמר אדני יהוה השמע ישמע והחדל יחדל כי בית מרי המה
    kjvRefs:
    - Ezekiel 3:27
    kjvOsis:
    - Ezek.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.3
- type: TanakhVerse
  data:
    osis: Ezek.4.1
    scripture: tanakh
    name: Tanakh Ezekiel 4:1
    ref: Ezekiel 4:1
    book: Ezek
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 12885
    text: Thou also, son of man, take thee a tile, and lay it before thee, and trace upon it a city, even Jerusalem;
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם קַח־לְךָ לְבֵנָה וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ וְחַקּוֹתָ עָלֶיהָ עִיר אֶת־יְרוּשָׁלִָם׃
    hebrewPlain: ואתה בן אדם קח לך לבנה ונתתה אותה לפניך וחקות עליה עיר את ירושלם
    kjvRefs:
    - Ezekiel 4:1
    kjvOsis:
    - Ezek.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.2
    scripture: tanakh
    name: Tanakh Ezekiel 4:2
    ref: Ezekiel 4:2
    book: Ezek
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 12886
    text: and lay siege against it, and build forts against it, and cast up a mound against it; set camps also against it, and set battering rams against it round about.
    translation: JPS 1917
    original: וְנָתַתָּה עָלֶיהָ מָצוֹר וּבָנִיתָ עָלֶיהָ דָּיֵק וְשָׁפַכְתָּ עָלֶיהָ סֹלְלָה וְנָתַתָּה עָלֶיהָ מַחֲנוֹת וְשִׂים־עָלֶיהָ כָּרִים סָבִיב׃
    hebrewPlain: ונתתה עליה מצור ובנית עליה דיק ושפכת עליה סללה ונתתה עליה מחנות ושים עליה כרים סביב
    kjvRefs:
    - Ezekiel 4:2
    kjvOsis:
    - Ezek.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.3
    scripture: tanakh
    name: Tanakh Ezekiel 4:3
    ref: Ezekiel 4:3
    book: Ezek
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 12887
    text: And take thou unto thee an iron griddle, and set it for a wall of iron between thee and the city; and set thy face toward it, and it shall be besieged, and thou shalt lay siege against it. This shall be a sign to the house of Israel.
    translation: JPS 1917
    original: וְאַתָּה קַח־לְךָ מַחֲבַת בַּרְזֶל וְנָתַתָּה אוֹתָהּ קִיר בַּרְזֶל בֵּינְךָ וּבֵין הָעִיר וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ וְהָיְתָה בַמָּצוֹר וְצַרְתָּ עָלֶיהָ אוֹת הִיא לְבֵית יִשְׂרָאֵל׃
    hebrewPlain: ואתה קח לך מחבת ברזל ונתתה אותה קיר ברזל בינך ובין העיר והכינתה את פניך אליה והיתה במצור וצרת עליה אות היא לבית ישראל
    kjvRefs:
    - Ezekiel 4:3
    kjvOsis:
    - Ezek.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.4
    scripture: tanakh
    name: Tanakh Ezekiel 4:4
    ref: Ezekiel 4:4
    book: Ezek
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 12888
    text: Moreover lie thou upon thy left side, and lay the iniquity of the house of Israel upon it; according to the number of the days that thou shalt lie upon it, thou shalt bear their iniquity.
    translation: JPS 1917
    original: וְאַתָּה שְׁכַב עַל־צִדְּךָ הַשְּׂמָאלִי וְשַׂמְתָּ אֶת־עֲוֺן בֵּית־יִשְׂרָאֵל עָלָיו מִסְפַּר הַיָּמִים אֲשֶׁר תִּשְׁכַּב עָלָיו תִּשָּׂא אֶת־עֲוֺנָם׃
    hebrewPlain: ואתה שכב על צדך השמאלי ושמת את עון בית ישראל עליו מספר הימים אשר תשכב עליו תשא את עונם
    kjvRefs:
    - Ezekiel 4:4
    kjvOsis:
    - Ezek.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.5
    scripture: tanakh
    name: Tanakh Ezekiel 4:5
    ref: Ezekiel 4:5
    book: Ezek
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 12889
    text: For I have appointed the years of their iniquity to be unto thee a number of days, even three hundred and ninety days; so shalt thou bear the iniquity of the house of Israel.
    translation: JPS 1917
    original: וַאֲנִי נָתַתִּי לְךָ אֶת־שְׁנֵי עֲוֺנָם לְמִסְפַּר יָמִים שְׁלֹשׁ־מֵאוֹת וְתִשְׁעִים יוֹם וְנָשָׂאתָ עֲוֺן בֵּית־יִשְׂרָאֵל׃
    hebrewPlain: ואני נתתי לך את שני עונם למספר ימים שלש מאות ותשעים יום ונשאת עון בית ישראל
    kjvRefs:
    - Ezekiel 4:5
    kjvOsis:
    - Ezek.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.6
    scripture: tanakh
    name: Tanakh Ezekiel 4:6
    ref: Ezekiel 4:6
    book: Ezek
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 12890
    text: And again, when thou hast accomplished these, thou shalt lie on thy right side, and shalt bear the iniquity of the house of Judah; forty days, each day for a year, have I appointed it unto thee.
    translation: JPS 1917
    original: וְכִלִּיתָ אֶת־אֵלֶּה וְשָׁכַבְתָּ עַל־צִדְּךָ הימוני [הַיְמָנִי] שֵׁנִית וְנָשָׂאתָ אֶת־עֲוֺן בֵּית־יְהוּדָה אַרְבָּעִים יוֹם יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה נְתַתִּיו לָךְ׃
    hebrewPlain: וכלית את אלה ושכבת על צדך הימוני [הימני] שנית ונשאת את עון בית יהודה ארבעים יום יום לשנה יום לשנה נתתיו לך
    kjvRefs:
    - Ezekiel 4:6
    kjvOsis:
    - Ezek.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.7
    scripture: tanakh
    name: Tanakh Ezekiel 4:7
    ref: Ezekiel 4:7
    book: Ezek
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 12891
    text: And thou shalt set thy face toward the siege of Jerusalem, with thine arm uncovered; and thou shalt prophesy against it.
    translation: JPS 1917
    original: וְאֶל־מְצוֹר יְרוּשָׁלִַם תָּכִין פָּנֶיךָ וּזְרֹעֲךָ חֲשׂוּפָה וְנִבֵּאתָ עָלֶיהָ׃
    hebrewPlain: ואל מצור ירושלם תכין פניך וזרעך חשופה ונבאת עליה
    kjvRefs:
    - Ezekiel 4:7
    kjvOsis:
    - Ezek.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.8
    scripture: tanakh
    name: Tanakh Ezekiel 4:8
    ref: Ezekiel 4:8
    book: Ezek
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 12892
    text: And, behold, I lay bands upon thee, and thou shalt not turn thee from one side to another, till thou hast accomplished the days of thy siege.
    translation: JPS 1917
    original: וְהִנֵּה נָתַתִּי עָלֶיךָ עֲבוֹתִים וְלֹא־תֵהָפֵךְ מִצִּדְּךָ אֶל־צִדֶּךָ עַד־כַּלּוֹתְךָ יְמֵי מְצוּרֶךָ׃
    hebrewPlain: והנה נתתי עליך עבותים ולא תהפך מצדך אל צדך עד כלותך ימי מצורך
    kjvRefs:
    - Ezekiel 4:8
    kjvOsis:
    - Ezek.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.9
    scripture: tanakh
    name: Tanakh Ezekiel 4:9
    ref: Ezekiel 4:9
    book: Ezek
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 12893
    text: Take thou also unto thee wheat, and barley, and beans, and lentils, and millet, and spelt, and put them in one vessel, and make thee bread thereof; according to the number of the days that thou shalt lie upon thy side, even three hundred and ninety days, shalt thou eat thereof.
    translation: JPS 1917
    original: וְאַתָּה קַח־לְךָ חִטִּין וּשְׂעֹרִים וּפוֹל וַעֲדָשִׁים וְדֹחַן וְכֻסְּמִים וְנָתַתָּה אוֹתָם בִּכְלִי אֶחָד וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם מִסְפַּר הַיָּמִים אֲשֶׁר־אַתָּה שׁוֹכֵב עַל־צִדְּךָ שְׁלֹשׁ־מֵאוֹת וְתִשְׁעִים יוֹם תֹּאכֲלֶנּוּ׃
    hebrewPlain: ואתה קח לך חטין ושערים ופול ועדשים ודחן וכסמים ונתתה אותם בכלי אחד ועשית אותם לך ללחם מספר הימים אשר אתה שוכב על צדך שלש מאות ותשעים יום תאכלנו
    kjvRefs:
    - Ezekiel 4:9
    kjvOsis:
    - Ezek.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.10
    scripture: tanakh
    name: Tanakh Ezekiel 4:10
    ref: Ezekiel 4:10
    book: Ezek
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 12894
    text: And thy food which thou shalt eat shall be by weight, twenty shekels a day; from time to time shalt thou eat it.
    translation: JPS 1917
    original: וּמַאֲכָלְךָ אֲשֶׁר תֹּאכֲלֶנּוּ בְּמִשְׁקוֹל עֶשְׂרִים שֶׁקֶל לַיּוֹם מֵעֵת עַד־עֵת תֹּאכֲלֶנּוּ׃
    hebrewPlain: ומאכלך אשר תאכלנו במשקול עשרים שקל ליום מעת עד עת תאכלנו
    kjvRefs:
    - Ezekiel 4:10
    kjvOsis:
    - Ezek.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.11
    scripture: tanakh
    name: Tanakh Ezekiel 4:11
    ref: Ezekiel 4:11
    book: Ezek
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 12895
    text: Thou shalt drink also water by measure, the sixth part of a hin; from time to time shalt thou drink.
    translation: JPS 1917
    original: וּמַיִם בִּמְשׂוּרָה תִשְׁתֶּה שִׁשִּׁית הַהִין מֵעֵת עַד־עֵת תִּשְׁתֶּה׃
    hebrewPlain: ומים במשורה תשתה ששית ההין מעת עד עת תשתה
    kjvRefs:
    - Ezekiel 4:11
    kjvOsis:
    - Ezek.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.12
    scripture: tanakh
    name: Tanakh Ezekiel 4:12
    ref: Ezekiel 4:12
    book: Ezek
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 12896
    text: And thou shalt eat it as barley cakes, and thou shalt bake it in their sight with dung that cometh out of man.’
    translation: JPS 1917
    original: וְעֻגַת שְׂעֹרִים תֹּאכֲלֶנָּה וְהִיא בְּגֶלְלֵי צֵאַת הָאָדָם תְּעֻגֶנָה לְעֵינֵיהֶם׃
    hebrewPlain: ועגת שערים תאכלנה והיא בגללי צאת האדם תעגנה לעיניהם
    kjvRefs:
    - Ezekiel 4:12
    kjvOsis:
    - Ezek.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.13
    scripture: tanakh
    name: Tanakh Ezekiel 4:13
    ref: Ezekiel 4:13
    book: Ezek
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 12897
    text: 'And the LORD said: ‘Even thus shall the children of Israel eat their bread unclean, among the nations whither I will drive them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה כָּכָה יֹאכְלוּ בְנֵי־יִשְׂרָאֵל אֶת־לַחְמָם טָמֵא בַּגּוֹיִם אֲשֶׁר אַדִּיחֵם שָׁם׃
    hebrewPlain: ויאמר יהוה ככה יאכלו בני ישראל את לחמם טמא בגוים אשר אדיחם שם
    kjvRefs:
    - Ezekiel 4:13
    kjvOsis:
    - Ezek.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.14
    scripture: tanakh
    name: Tanakh Ezekiel 4:14
    ref: Ezekiel 4:14
    book: Ezek
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 12898
    text: 'Then said I: ‘Ah Lord GOD! behold, my soul hath not been polluted; for from my youth up even till now have I not eaten of that which dieth of itself, or is torn of beasts; neither came there abhorred flesh into my mouth.’'
    translation: JPS 1917
    original: וָאֹמַר אֲהָהּ אֲדֹנָי יְהוִה הִנֵּה נַפְשִׁי לֹא מְטֻמָּאָה וּנְבֵלָה וּטְרֵפָה לֹא־אָכַלְתִּי מִנְּעוּרַי וְעַד־עַתָּה וְלֹא־בָא בְּפִי בְּשַׂר פִּגּוּל׃
    hebrewPlain: ואמר אהה אדני יהוה הנה נפשי לא מטמאה ונבלה וטרפה לא אכלתי מנעורי ועד עתה ולא בא בפי בשר פגול
    kjvRefs:
    - Ezekiel 4:14
    kjvOsis:
    - Ezek.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.15
    scripture: tanakh
    name: Tanakh Ezekiel 4:15
    ref: Ezekiel 4:15
    book: Ezek
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 12899
    text: 'Then He said unto me: ‘See, I have given thee cow’s dung for man’s dung, and thou shalt prepare thy bread thereon.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי רְאֵה נָתַתִּי לְךָ אֶת־צפועי [צְפִיעֵי] הַבָּקָר תַּחַת גֶּלְלֵי הָאָדָם וְעָשִׂיתָ אֶת־לַחְמְךָ עֲלֵיהֶם׃
    hebrewPlain: ויאמר אלי ראה נתתי לך את צפועי [צפיעי] הבקר תחת גללי האדם ועשית את לחמך עליהם
    kjvRefs:
    - Ezekiel 4:15
    kjvOsis:
    - Ezek.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.16
    scripture: tanakh
    name: Tanakh Ezekiel 4:16
    ref: Ezekiel 4:16
    book: Ezek
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 12900
    text: 'Moreover He said unto me: ‘Son of man, behold, I will break the staff of bread in Jerusalem, and they shall eat bread by weight, and with anxiety; and they shall drink water by measure, and in appalment;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם הִנְנִי שֹׁבֵר מַטֵּה־לֶחֶם בִּירוּשָׁלִַם וְאָכְלוּ־לֶחֶם בְּמִשְׁקָל וּבִדְאָגָה וּמַיִם בִּמְשׂוּרָה וּבְשִׁמָּמוֹן יִשְׁתּוּ׃
    hebrewPlain: ויאמר אלי בן אדם הנני שבר מטה לחם בירושלם ואכלו לחם במשקל ובדאגה ומים במשורה ובשממון ישתו
    kjvRefs:
    - Ezekiel 4:16
    kjvOsis:
    - Ezek.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.4.17
    scripture: tanakh
    name: Tanakh Ezekiel 4:17
    ref: Ezekiel 4:17
    book: Ezek
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 12901
    text: that they may want bread and water, and be appalled one with another, and pine away in their iniquity.
    translation: JPS 1917
    original: לְמַעַן יַחְסְרוּ לֶחֶם וָמָיִם וְנָשַׁמּוּ אִישׁ וְאָחִיו וְנָמַקּוּ בַּעֲוֺנָם׃
    hebrewPlain: למען יחסרו לחם ומים ונשמו איש ואחיו ונמקו בעונם
    kjvRefs:
    - Ezekiel 4:17
    kjvOsis:
    - Ezek.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.4
- type: TanakhVerse
  data:
    osis: Ezek.5.1
    scripture: tanakh
    name: Tanakh Ezekiel 5:1
    ref: Ezekiel 5:1
    book: Ezek
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 12902
    text: And thou, son of man, take thee a sharp sword, as a barber’s razor shalt thou take it unto thee, and cause it to pass upon thy head and upon thy beard; then take thee balances to weigh, and divide the hair.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם קַח־לְךָ חֶרֶב חַדָּה תַּעַר הַגַּלָּבִים תִּקָּחֶנָּה לָּךְ וְהַעֲבַרְתָּ עַל־רֹאשְׁךָ וְעַל־זְקָנֶךָ וְלָקַחְתָּ לְךָ מֹאזְנֵי מִשְׁקָל וְחִלַּקְתָּם׃
    hebrewPlain: ואתה בן אדם קח לך חרב חדה תער הגלבים תקחנה לך והעברת על ראשך ועל זקנך ולקחת לך מאזני משקל וחלקתם
    kjvRefs:
    - Ezekiel 5:1
    kjvOsis:
    - Ezek.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.2
    scripture: tanakh
    name: Tanakh Ezekiel 5:2
    ref: Ezekiel 5:2
    book: Ezek
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 12903
    text: A third part shalt thou burn in the fire in the midst of the city, when the days of the siege are fulfilled; and thou shalt take a third part, and smite it with the sword round about her; and a third part thou shalt scatter to the wind, and I will draw out a sword after them.
    translation: JPS 1917
    original: שְׁלִשִׁית בָּאוּר תַּבְעִיר בְּתוֹךְ הָעִיר כִּמְלֹאת יְמֵי הַמָּצוֹר וְלָקַחְתָּ אֶת־הַשְּׁלִשִׁית תַּכֶּה בַחֶרֶב סְבִיבוֹתֶיהָ וְהַשְּׁלִשִׁית תִּזְרֶה לָרוּחַ וְחֶרֶב אָרִיק אַחֲרֵיהֶם׃
    hebrewPlain: שלשית באור תבעיר בתוך העיר כמלאת ימי המצור ולקחת את השלשית תכה בחרב סביבותיה והשלשית תזרה לרוח וחרב אריק אחריהם
    kjvRefs:
    - Ezekiel 5:2
    kjvOsis:
    - Ezek.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.3
    scripture: tanakh
    name: Tanakh Ezekiel 5:3
    ref: Ezekiel 5:3
    book: Ezek
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 12904
    text: Thou shalt also take thereof a few by number, and bind them in thy skirts.
    translation: JPS 1917
    original: וְלָקַחְתָּ מִשָּׁם מְעַט בְּמִסְפָּר וְצַרְתָּ אוֹתָם בִּכְנָפֶיךָ׃
    hebrewPlain: ולקחת משם מעט במספר וצרת אותם בכנפיך
    kjvRefs:
    - Ezekiel 5:3
    kjvOsis:
    - Ezek.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.4
    scripture: tanakh
    name: Tanakh Ezekiel 5:4
    ref: Ezekiel 5:4
    book: Ezek
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 12905
    text: And of them again shalt thou take, and cast them into the midst of the fire, and burn them in the fire; therefrom shall a fire come forth into all the house of Israel.
    translation: JPS 1917
    original: וּמֵהֶם עוֹד תִּקָּח וְהִשְׁלַכְתָּ אוֹתָם אֶל־תּוֹךְ הָאֵשׁ וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ מִמֶּנּוּ תֵצֵא־אֵשׁ אֶל־כָּל־בֵּית יִשְׂרָאֵל׃
    hebrewPlain: ומהם עוד תקח והשלכת אותם אל תוך האש ושרפת אתם באש ממנו תצא אש אל כל בית ישראל
    kjvRefs:
    - Ezekiel 5:4
    kjvOsis:
    - Ezek.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.5
    scripture: tanakh
    name: Tanakh Ezekiel 5:5
    ref: Ezekiel 5:5
    book: Ezek
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 12906
    text: 'Thus saith the Lord GOD: This is Jerusalem! I have set her in the midst of the nations, and countries are round about her.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהֹוִה זֹאת יְרוּשָׁלִַם בְּתוֹךְ הַגּוֹיִם שַׂמְתִּיהָ וּסְבִיבוֹתֶיהָ אֲרָצוֹת׃
    hebrewPlain: כה אמר אדני יהוה זאת ירושלם בתוך הגוים שמתיה וסביבותיה ארצות
    kjvRefs:
    - Ezekiel 5:5
    kjvOsis:
    - Ezek.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.6
    scripture: tanakh
    name: Tanakh Ezekiel 5:6
    ref: Ezekiel 5:6
    book: Ezek
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 12907
    text: And she hath rebelled against Mine ordinances in doing wickedness more than the nations, and against My statutes more than the countries that are round about her; for they have rejected Mine ordinances, and as for My statutes, they have not walked in them.
    translation: JPS 1917
    original: וַתֶּמֶר אֶת־מִשְׁפָּטַי לְרִשְׁעָה מִן־הַגּוֹיִם וְאֶת־חֻקּוֹתַי מִן־הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ כִּי בְמִשְׁפָּטַי מָאָסוּ וְחֻקּוֹתַי לֹא־הָלְכוּ בָהֶם׃
    hebrewPlain: ותמר את משפטי לרשעה מן הגוים ואת חקותי מן הארצות אשר סביבותיה כי במשפטי מאסו וחקותי לא הלכו בהם
    kjvRefs:
    - Ezekiel 5:6
    kjvOsis:
    - Ezek.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.7
    scripture: tanakh
    name: Tanakh Ezekiel 5:7
    ref: Ezekiel 5:7
    book: Ezek
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 12908
    text: 'Therefore thus saith the Lord GOD: Because ye have outdone the nations that are round about you, in that ye have not walked in My statutes, neither have kept Mine ordinances, neither have done after the ordinances of the nations that are round about you;'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה יַעַן הֲמָנְכֶם מִן־הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם וְאֶת־מִשְׁפָּטַי לֹא עֲשִׂיתֶם וּכְמִשְׁפְּטֵי הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם לֹא עֲשִׂיתֶם׃
    hebrewPlain: לכן כה אמר אדני יהוה יען המנכם מן הגוים אשר סביבותיכם בחקותי לא הלכתם ואת משפטי לא עשיתם וכמשפטי הגוים אשר סביבותיכם לא עשיתם
    kjvRefs:
    - Ezekiel 5:7
    kjvOsis:
    - Ezek.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.8
    scripture: tanakh
    name: Tanakh Ezekiel 5:8
    ref: Ezekiel 5:8
    book: Ezek
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 12909
    text: 'therefore thus saith the Lord GOD: Behold, I, even I, am against thee, and I will execute judgments in the midst of thee in the sight of the nations.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי עָלַיִךְ גַּם־אָנִי וְעָשִׂיתִי בְתוֹכֵךְ מִשְׁפָּטִים לְעֵינֵי הַגּוֹיִם׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני עליך גם אני ועשיתי בתוכך משפטים לעיני הגוים
    kjvRefs:
    - Ezekiel 5:8
    kjvOsis:
    - Ezek.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.9
    scripture: tanakh
    name: Tanakh Ezekiel 5:9
    ref: Ezekiel 5:9
    book: Ezek
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 12910
    text: And I will do in thee that which I have not done, and whereunto I will not do any more the like, because of all thine abominations.
    translation: JPS 1917
    original: וְעָשִׂיתִי בָךְ אֵת אֲשֶׁר לֹא־עָשִׂיתִי וְאֵת אֲשֶׁר־לֹא־אֶעֱשֶׂה כָמֹהוּ עוֹד יַעַן כָּל־תּוֹעֲבֹתָיִךְ׃
    hebrewPlain: ועשיתי בך את אשר לא עשיתי ואת אשר לא אעשה כמהו עוד יען כל תועבתיך
    kjvRefs:
    - Ezekiel 5:9
    kjvOsis:
    - Ezek.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.10
    scripture: tanakh
    name: Tanakh Ezekiel 5:10
    ref: Ezekiel 5:10
    book: Ezek
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 12911
    text: Therefore the fathers shall eat the sons in the midst of thee, and the sons shall eat their fathers; and I will execute judgments in thee, and the whole remnant of thee will I scatter unto all the winds.
    translation: JPS 1917
    original: לָכֵן אָבוֹת יֹאכְלוּ בָנִים בְּתוֹכֵךְ וּבָנִים יֹאכְלוּ אֲבוֹתָם וְעָשִׂיתִי בָךְ שְׁפָטִים וְזֵרִיתִי אֶת־כָּל־שְׁאֵרִיתֵךְ לְכָל־רוּחַ׃
    hebrewPlain: לכן אבות יאכלו בנים בתוכך ובנים יאכלו אבותם ועשיתי בך שפטים וזריתי את כל שאריתך לכל רוח
    kjvRefs:
    - Ezekiel 5:10
    kjvOsis:
    - Ezek.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.11
    scripture: tanakh
    name: Tanakh Ezekiel 5:11
    ref: Ezekiel 5:11
    book: Ezek
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 12912
    text: Wherefore, as I live, saith the Lord GOD, surely, because thou hast defiled My sanctuary with all thy detestable things, and with all thine abominations, therefore will I also diminish thee; neither shall Mine eye spare, and I also will have no pity.
    translation: JPS 1917
    original: לָכֵן חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־לֹא יַעַן אֶת־מִקְדָּשִׁי טִמֵּאת בְּכָל־שִׁקּוּצַיִךְ וּבְכָל־תּוֹעֲבֹתָיִךְ וְגַם־אֲנִי אֶגְרַע וְלֹא־תָחוֹס עֵינִי וְגַם־אֲנִי לֹא אֶחְמוֹל׃
    hebrewPlain: לכן חי אני נאם אדני יהוה אם לא יען את מקדשי טמאת בכל שקוציך ובכל תועבתיך וגם אני אגרע ולא תחוס עיני וגם אני לא אחמול
    kjvRefs:
    - Ezekiel 5:11
    kjvOsis:
    - Ezek.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.12
    scripture: tanakh
    name: Tanakh Ezekiel 5:12
    ref: Ezekiel 5:12
    book: Ezek
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 12913
    text: A third part of thee shall die with the pestilence, and with famine shall they be consumed in the midst of thee; and a third part shall fall by the sword round about thee; and a third part I will scatter unto all the winds, and will draw out a sword after them.
    translation: JPS 1917
    original: שְׁלִשִׁתֵיךְ בַּדֶּבֶר יָמוּתוּ וּבָרָעָב יִכְלוּ בְתוֹכֵךְ וְהַשְּׁלִשִׁית בַּחֶרֶב יִפְּלוּ סְבִיבוֹתָיִךְ וְהַשְּׁלִישִׁית לְכָל־רוּחַ אֱזָרֶה וְחֶרֶב אָרִיק אַחֲרֵיהֶם׃
    hebrewPlain: שלשתיך בדבר ימותו וברעב יכלו בתוכך והשלשית בחרב יפלו סביבותיך והשלישית לכל רוח אזרה וחרב אריק אחריהם
    kjvRefs:
    - Ezekiel 5:12
    kjvOsis:
    - Ezek.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.13
    scripture: tanakh
    name: Tanakh Ezekiel 5:13
    ref: Ezekiel 5:13
    book: Ezek
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 12914
    text: Thus shall Mine anger spend itself, and I will satisfy My fury upon them, and I will be eased; and they shall know that I the LORD have spoken in My zeal, when I have spent My fury upon them.
    translation: JPS 1917
    original: וְכָלָה אַפִּי וַהֲנִחוֹתִי חֲמָתִי בָּם וְהִנֶּחָמְתִּי וְיָדְעוּ כִּי־אֲנִי יְהוָה דִּבַּרְתִּי בְּקִנְאָתִי בְּכַלּוֹתִי חֲמָתִי בָּם׃
    hebrewPlain: וכלה אפי והנחותי חמתי בם והנחמתי וידעו כי אני יהוה דברתי בקנאתי בכלותי חמתי בם
    kjvRefs:
    - Ezekiel 5:13
    kjvOsis:
    - Ezek.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.14
    scripture: tanakh
    name: Tanakh Ezekiel 5:14
    ref: Ezekiel 5:14
    book: Ezek
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 12915
    text: Moreover I will make thee an amazement and a reproach, among the nations that are round about thee, in the sight of all that pass by.
    translation: JPS 1917
    original: וְאֶתְּנֵךְ לְחָרְבָּה וּלְחֶרְפָּה בַּגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ לְעֵינֵי כָּל־עוֹבֵר׃
    hebrewPlain: ואתנך לחרבה ולחרפה בגוים אשר סביבותיך לעיני כל עובר
    kjvRefs:
    - Ezekiel 5:14
    kjvOsis:
    - Ezek.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.15
    scripture: tanakh
    name: Tanakh Ezekiel 5:15
    ref: Ezekiel 5:15
    book: Ezek
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 12916
    text: So it shall be a reproach and a taunt, an instruction and an astonishment, unto the nations that are round about thee, when I shall execute judgments in thee in anger and in fury, and in furious rebukes; I the LORD have spoken it;
    translation: JPS 1917
    original: וְהָיְתָה חֶרְפָּה וּגְדוּפָה מוּסָר וּמְשַׁמָּה לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ בַּעֲשׂוֹתִי בָךְ שְׁפָטִים בְּאַף וּבְחֵמָה וּבְתֹכְחוֹת חֵמָה אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: והיתה חרפה וגדופה מוסר ומשמה לגוים אשר סביבותיך בעשותי בך שפטים באף ובחמה ובתכחות חמה אני יהוה דברתי
    kjvRefs:
    - Ezekiel 5:15
    kjvOsis:
    - Ezek.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.16
    scripture: tanakh
    name: Tanakh Ezekiel 5:16
    ref: Ezekiel 5:16
    book: Ezek
    section: neviim
    chapter: 5
    verse: 16
    ordinal: 12917
    text: when I shall send upon them the evil arrows of famine, that are for destruction, which I will send to destroy you; and I will increase the famine upon you, and will break your staff of bread;
    translation: JPS 1917
    original: בְּשַׁלְּחִי אֶת־חִצֵּי הָרָעָב הָרָעִים בָּהֶם אֲשֶׁר הָיוּ לְמַשְׁחִית אֲשֶׁר־אֲשַׁלַּח אוֹתָם לְשַׁחֶתְכֶם וְרָעָב אֹסֵף עֲלֵיכֶם וְשָׁבַרְתִּי לָכֶם מַטֵּה־לָחֶם׃
    hebrewPlain: בשלחי את חצי הרעב הרעים בהם אשר היו למשחית אשר אשלח אותם לשחתכם ורעב אסף עליכם ושברתי לכם מטה לחם
    kjvRefs:
    - Ezekiel 5:16
    kjvOsis:
    - Ezek.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.5.17
    scripture: tanakh
    name: Tanakh Ezekiel 5:17
    ref: Ezekiel 5:17
    book: Ezek
    section: neviim
    chapter: 5
    verse: 17
    ordinal: 12918
    text: and I will send upon you famine and evil beasts, and they shall bereave thee; and pestilence and blood shall pass through thee; and I will bring the sword upon thee. I the LORD have spoken it.’
    translation: JPS 1917
    original: וְשִׁלַּחְתִּי עֲלֵיכֶם רָעָב וְחַיָּה רָעָה וְשִׁכְּלֻךְ וְדֶבֶר וָדָם יַעֲבָר־בָּךְ וְחֶרֶב אָבִיא עָלַיִךְ אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: ושלחתי עליכם רעב וחיה רעה ושכלך ודבר ודם יעבר בך וחרב אביא עליך אני יהוה דברתי
    kjvRefs:
    - Ezekiel 5:17
    kjvOsis:
    - Ezek.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.5
- type: TanakhVerse
  data:
    osis: Ezek.6.1
    scripture: tanakh
    name: Tanakh Ezekiel 6:1
    ref: Ezekiel 6:1
    book: Ezek
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 12919
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 6:1
    kjvOsis:
    - Ezek.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.2
    scripture: tanakh
    name: Tanakh Ezekiel 6:2
    ref: Ezekiel 6:2
    book: Ezek
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 12920
    text: ’Son of man, set thy face toward the mountains of Israel, and prophesy against them,
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ אֶל־הָרֵי יִשְׂרָאֵל וְהִנָּבֵא אֲלֵיהֶם׃
    hebrewPlain: בן אדם שים פניך אל הרי ישראל והנבא אליהם
    kjvRefs:
    - Ezekiel 6:2
    kjvOsis:
    - Ezek.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.3
    scripture: tanakh
    name: Tanakh Ezekiel 6:3
    ref: Ezekiel 6:3
    book: Ezek
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 12921
    text: 'and say: Ye mountains of Israel, hear the word of the Lord GOD: Thus saith the Lord GOD concerning the mountains and concerning the hills, concerning the ravines and concerning the valleys: Behold, I, even I, will bring a sword upon you, and I will destroy your high places.'
    translation: JPS 1917
    original: וְאָמַרְתָּ הָרֵי יִשְׂרָאֵל שִׁמְעוּ דְּבַר־אֲדֹנָי יְהוִה כֹּה־אָמַר אֲדֹנָי יְהוִה לֶהָרִים וְלַגְּבָעוֹת לָאֲפִיקִים ולגאית [וְלַגֵּאָיוֹת] הִנְנִי אֲנִי מֵבִיא עֲלֵיכֶם חֶרֶב וְאִבַּדְתִּי בָּמוֹתֵיכֶם׃
    hebrewPlain: ואמרת הרי ישראל שמעו דבר אדני יהוה כה אמר אדני יהוה להרים ולגבעות לאפיקים ולגאית [ולגאיות] הנני אני מביא עליכם חרב ואבדתי במותיכם
    kjvRefs:
    - Ezekiel 6:3
    kjvOsis:
    - Ezek.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.4
    scripture: tanakh
    name: Tanakh Ezekiel 6:4
    ref: Ezekiel 6:4
    book: Ezek
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 12922
    text: And your altars shall become desolate, and your sun-images shall be broken; and I will cast down your slain men before your idols.
    translation: JPS 1917
    original: וְנָשַׁמּוּ מִזְבְּחוֹתֵיכֶם וְנִשְׁבְּרוּ חַמָּנֵיכֶם וְהִפַּלְתִּי חַלְלֵיכֶם לִפְנֵי גִּלּוּלֵיכֶם׃
    hebrewPlain: ונשמו מזבחותיכם ונשברו חמניכם והפלתי חלליכם לפני גלוליכם
    kjvRefs:
    - Ezekiel 6:4
    kjvOsis:
    - Ezek.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.5
    scripture: tanakh
    name: Tanakh Ezekiel 6:5
    ref: Ezekiel 6:5
    book: Ezek
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 12923
    text: And I will lay the carcasses of the children of Israel before their idols; and I will scatter your bones round about your altars.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־פִּגְרֵי בְּנֵי יִשְׂרָאֵל לִפְנֵי גִּלּוּלֵיהֶם וְזֵרִיתִי אֶת־עַצְמוֹתֵיכֶם סְבִיבוֹת מִזְבְּחוֹתֵיכֶם׃
    hebrewPlain: ונתתי את פגרי בני ישראל לפני גלוליהם וזריתי את עצמותיכם סביבות מזבחותיכם
    kjvRefs:
    - Ezekiel 6:5
    kjvOsis:
    - Ezek.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.6
    scripture: tanakh
    name: Tanakh Ezekiel 6:6
    ref: Ezekiel 6:6
    book: Ezek
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 12924
    text: In all your dwelling-places the cities shall be laid waste, and the high places shall be desolate; that your altars may be laid waste and made desolate, and your idols may be broken and cease, and your sun-images may be hewn down, and your works may be blotted out.
    translation: JPS 1917
    original: בְּכֹל מוֹשְׁבוֹתֵיכֶם הֶעָרִים תֶּחֱרַבְנָה וְהַבָּמוֹת תִּישָׁמְנָה לְמַעַן יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ גִּלּוּלֵיכֶם וְנִגְדְּעוּ חַמָּנֵיכֶם וְנִמְחוּ מַעֲשֵׂיכֶם׃
    hebrewPlain: בכל מושבותיכם הערים תחרבנה והבמות תישמנה למען יחרבו ויאשמו מזבחותיכם ונשברו ונשבתו גלוליכם ונגדעו חמניכם ונמחו מעשיכם
    kjvRefs:
    - Ezekiel 6:6
    kjvOsis:
    - Ezek.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.7
    scripture: tanakh
    name: Tanakh Ezekiel 6:7
    ref: Ezekiel 6:7
    book: Ezek
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 12925
    text: And the slain shall fall in the midst of you, and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְנָפַל חָלָל בְּתוֹכְכֶם וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונפל חלל בתוככם וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 6:7
    kjvOsis:
    - Ezek.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.8
    scripture: tanakh
    name: Tanakh Ezekiel 6:8
    ref: Ezekiel 6:8
    book: Ezek
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 12926
    text: Yet will I leave a remnant, in that ye shall have some that escape the sword among the nations, when ye shall be scattered through the countries.
    translation: JPS 1917
    original: וְהוֹתַרְתִּי בִּהְיוֹת לָכֶם פְּלִיטֵי חֶרֶב בַּגּוֹיִם בְּהִזָּרוֹתֵיכֶם בָּאֲרָצוֹת׃
    hebrewPlain: והותרתי בהיות לכם פליטי חרב בגוים בהזרותיכם בארצות
    kjvRefs:
    - Ezekiel 6:8
    kjvOsis:
    - Ezek.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.9
    scripture: tanakh
    name: Tanakh Ezekiel 6:9
    ref: Ezekiel 6:9
    book: Ezek
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 12927
    text: And they that escape of you shall remember Me among the nations whither they shall be carried captives, how that I have been anguished with their straying heart, which hath departed from Me, and with their eyes, which are gone astray after their idols; and they shall loathe themselves in their own sight for the evils which they have committed in all their abominations.
    translation: JPS 1917
    original: וְזָכְרוּ פְלִיטֵיכֶם אוֹתִי בַּגּוֹיִם אֲשֶׁר נִשְׁבּוּ־שָׁם אֲשֶׁר נִשְׁבַּרְתִּי אֶת־לִבָּם הַזּוֹנֶה אֲשֶׁר־סָר מֵעָלַי וְאֵת עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם וְנָקֹטּוּ בִּפְנֵיהֶם אֶל־הָרָעוֹת אֲשֶׁר עָשׂוּ לְכֹל תּוֹעֲבֹתֵיהֶם׃
    hebrewPlain: וזכרו פליטיכם אותי בגוים אשר נשבו שם אשר נשברתי את לבם הזונה אשר סר מעלי ואת עיניהם הזנות אחרי גלוליהם ונקטו בפניהם אל הרעות אשר עשו לכל תועבתיהם
    kjvRefs:
    - Ezekiel 6:9
    kjvOsis:
    - Ezek.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.10
    scripture: tanakh
    name: Tanakh Ezekiel 6:10
    ref: Ezekiel 6:10
    book: Ezek
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 12928
    text: And they shall know that I am the LORD; I have not said in vain that I would do this evil unto them.
    translation: JPS 1917
    original: וְיָדְעוּ כִּי־אֲנִי יְהוָה לֹא אֶל־חִנָּם דִּבַּרְתִּי לַעֲשׂוֹת לָהֶם הָרָעָה הַזֹּאת׃
    hebrewPlain: וידעו כי אני יהוה לא אל חנם דברתי לעשות להם הרעה הזאת
    kjvRefs:
    - Ezekiel 6:10
    kjvOsis:
    - Ezek.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.11
    scripture: tanakh
    name: Tanakh Ezekiel 6:11
    ref: Ezekiel 6:11
    book: Ezek
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 12929
    text: 'Thus saith the Lord GOD: Smite with thy hand, and stamp with thy foot, and say: Alas! because of all the evil abominations of the house of Israel; for they shall fall by the sword, by the famine, and by the pestilence.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה הַכֵּה בְכַפְּךָ וּרְקַע בְּרַגְלְךָ וֶאֱמָר־אָח אֶל כָּל־תּוֹעֲבוֹת רָעוֹת בֵּית יִשְׂרָאֵל אֲשֶׁר בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר יִפֹּלוּ׃
    hebrewPlain: כה אמר אדני יהוה הכה בכפך ורקע ברגלך ואמר אח אל כל תועבות רעות בית ישראל אשר בחרב ברעב ובדבר יפלו
    kjvRefs:
    - Ezekiel 6:11
    kjvOsis:
    - Ezek.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.12
    scripture: tanakh
    name: Tanakh Ezekiel 6:12
    ref: Ezekiel 6:12
    book: Ezek
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 12930
    text: He that is far off shall die of the pestilence; and he that is near shall fall by the sword; and he that remaineth and is besieged shall die by the famine; thus will I spend My fury upon them.
    translation: JPS 1917
    original: הָרָחוֹק בַּדֶּבֶר יָמוּת וְהַקָּרוֹב בַּחֶרֶב יִפּוֹל וְהַנִּשְׁאָר וְהַנָּצוּר בָּרָעָב יָמוּת וְכִלֵּיתִי חֲמָתִי בָּם׃
    hebrewPlain: הרחוק בדבר ימות והקרוב בחרב יפול והנשאר והנצור ברעב ימות וכליתי חמתי בם
    kjvRefs:
    - Ezekiel 6:12
    kjvOsis:
    - Ezek.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.13
    scripture: tanakh
    name: Tanakh Ezekiel 6:13
    ref: Ezekiel 6:13
    book: Ezek
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 12931
    text: And ye shall know that I am the LORD, when their slain men shall be among their idols round about their altars, upon every high hill, in all the tops of the mountains, and under every leafy tree, and under every thick terebinth, the place where they did offer sweet savour to all their idols.
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי־אֲנִי יְהוָה בִּהְיוֹת חַלְלֵיהֶם בְּתוֹךְ גִּלּוּלֵיהֶם סְבִיבוֹת מִזְבְּחוֹתֵיהֶם אֶל כָּל־גִּבְעָה רָמָה בְּכֹל רָאשֵׁי הֶהָרִים וְתַחַת כָּל־עֵץ רַעֲנָן וְתַחַת כָּל־אֵלָה עֲבֻתָּה מְקוֹם אֲשֶׁר נָתְנוּ־שָׁם רֵיחַ נִיחֹחַ לְכֹל גִּלּוּלֵיהֶם׃
    hebrewPlain: וידעתם כי אני יהוה בהיות חלליהם בתוך גלוליהם סביבות מזבחותיהם אל כל גבעה רמה בכל ראשי ההרים ותחת כל עץ רענן ותחת כל אלה עבתה מקום אשר נתנו שם ריח ניחח לכל גלוליהם
    kjvRefs:
    - Ezekiel 6:13
    kjvOsis:
    - Ezek.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.6.14
    scripture: tanakh
    name: Tanakh Ezekiel 6:14
    ref: Ezekiel 6:14
    book: Ezek
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 12932
    text: And I will stretch out My hand upon them, and make the land desolate and waste, more than the wilderness of Diblah, throughout all their habitations; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: וְנָטִיתִי אֶת־יָדִי עֲלֵיהֶם וְנָתַתִּי אֶת־הָאָרֶץ שְׁמָמָה וּמְשַׁמָּה מִמִּדְבַּר דִּבְלָתָה בְּכֹל מוֹשְׁבוֹתֵיהֶם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונטיתי את ידי עליהם ונתתי את הארץ שממה ומשמה ממדבר דבלתה בכל מושבותיהם וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 6:14
    kjvOsis:
    - Ezek.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.6
- type: TanakhVerse
  data:
    osis: Ezek.7.1
    scripture: tanakh
    name: Tanakh Ezekiel 7:1
    ref: Ezekiel 7:1
    book: Ezek
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 12933
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 7:1
    kjvOsis:
    - Ezek.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.2
    scripture: tanakh
    name: Tanakh Ezekiel 7:2
    ref: Ezekiel 7:2
    book: Ezek
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 12934
    text: '’And thou, son of man, thus saith the Lord GOD concerning the land of Israel: An end! the end is come upon the four corners of the land.'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם כֹּה־אָמַר אֲדֹנָי יְהוִה לְאַדְמַת יִשְׂרָאֵל קֵץ בָּא הַקֵּץ עַל־ארבעת [אַרְבַּע] כַּנְפוֹת הָאָרֶץ׃
    hebrewPlain: ואתה בן אדם כה אמר אדני יהוה לאדמת ישראל קץ בא הקץ על ארבעת [ארבע] כנפות הארץ
    kjvRefs:
    - Ezekiel 7:2
    kjvOsis:
    - Ezek.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.3
    scripture: tanakh
    name: Tanakh Ezekiel 7:3
    ref: Ezekiel 7:3
    book: Ezek
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 12935
    text: Now is the end upon thee, and I will send Mine anger upon thee, and will judge thee according to thy ways; and I will bring upon thee all thine abominations.
    translation: JPS 1917
    original: עַתָּה הַקֵּץ עָלַיִךְ וְשִׁלַּחְתִּי אַפִּי בָּךְ וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ וְנָתַתִּי עָלַיִךְ אֵת כָּל־תּוֹעֲבֹתָיִךְ׃
    hebrewPlain: עתה הקץ עליך ושלחתי אפי בך ושפטתיך כדרכיך ונתתי עליך את כל תועבתיך
    kjvRefs:
    - Ezekiel 7:3
    kjvOsis:
    - Ezek.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.4
    scripture: tanakh
    name: Tanakh Ezekiel 7:4
    ref: Ezekiel 7:4
    book: Ezek
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 12936
    text: And Mine eye shall not spare thee, neither will I have pity; but I will bring thy ways upon thee, and thine abominations shall be in the midst of thee; and ye shall know that I am the LORD. .
    translation: JPS 1917
    original: וְלֹא־תָחוֹס עֵינִי עָלַיִךְ וְלֹא אֶחְמוֹל כִּי דְרָכַיִךְ עָלַיִךְ אֶתֵּן וְתוֹעֲבוֹתַיִךְ בְּתוֹכֵךְ תִּהְיֶיןָ וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ולא תחוס עיני עליך ולא אחמול כי דרכיך עליך אתן ותועבותיך בתוכך תהיין וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 7:4
    kjvOsis:
    - Ezek.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.5
    scripture: tanakh
    name: Tanakh Ezekiel 7:5
    ref: Ezekiel 7:5
    book: Ezek
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 12937
    text: 'Thus saith the Lord GOD: An evil, a singular evil, behold, it cometh.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה רָעָה אַחַת רָעָה הִנֵּה בָאָה׃
    hebrewPlain: כה אמר אדני יהוה רעה אחת רעה הנה באה
    kjvRefs:
    - Ezekiel 7:5
    kjvOsis:
    - Ezek.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.6
    scripture: tanakh
    name: Tanakh Ezekiel 7:6
    ref: Ezekiel 7:6
    book: Ezek
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 12938
    text: An end is come, the end is come, it awaketh against thee; behold, it cometh.
    translation: JPS 1917
    original: קֵץ בָּא בָּא הַקֵּץ הֵקִיץ אֵלָיִךְ הִנֵּה בָּאָה׃
    hebrewPlain: קץ בא בא הקץ הקיץ אליך הנה באה
    kjvRefs:
    - Ezekiel 7:6
    kjvOsis:
    - Ezek.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.7
    scripture: tanakh
    name: Tanakh Ezekiel 7:7
    ref: Ezekiel 7:7
    book: Ezek
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 12939
    text: The turn is come unto thee, O inhabitant of the land; the time is come, the day of tumult is near, and not of joyful shouting upon the mountains.
    translation: JPS 1917
    original: בָּאָה הַצְּפִירָה אֵלֶיךָ יוֹשֵׁב הָאָרֶץ בָּא הָעֵת קָרוֹב הַיּוֹם מְהוּמָה וְלֹא־הֵד הָרִים׃
    hebrewPlain: באה הצפירה אליך יושב הארץ בא העת קרוב היום מהומה ולא הד הרים
    kjvRefs:
    - Ezekiel 7:7
    kjvOsis:
    - Ezek.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.8
    scripture: tanakh
    name: Tanakh Ezekiel 7:8
    ref: Ezekiel 7:8
    book: Ezek
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 12940
    text: Now will I shortly pour out My fury upon thee, and spend Mine anger upon thee, and will judge thee according to thy ways; and I will bring upon thee all thine abominations.
    translation: JPS 1917
    original: עַתָּה מִקָּרוֹב אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ וְכִלֵּיתִי אַפִּי בָּךְ וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ וְנָתַתִּי עָלַיִךְ אֵת כָּל־תּוֹעֲבוֹתָיִךְ׃
    hebrewPlain: עתה מקרוב אשפוך חמתי עליך וכליתי אפי בך ושפטתיך כדרכיך ונתתי עליך את כל תועבותיך
    kjvRefs:
    - Ezekiel 7:8
    kjvOsis:
    - Ezek.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.9
    scripture: tanakh
    name: Tanakh Ezekiel 7:9
    ref: Ezekiel 7:9
    book: Ezek
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 12941
    text: And Mine eye shall not spare, neither will I have pity; I will bring upon thee according to thy ways, and thine abominations shall be in the midst of thee; and ye shall know that I the LORD do smite.
    translation: JPS 1917
    original: וְלֹא־תָחוֹס עֵינִי וְלֹא אֶחְמוֹל כִּדְרָכַיִךְ עָלַיִךְ אֶתֵּן וְתוֹעֲבוֹתַיִךְ בְּתוֹכֵךְ תִּהְיֶיןָ וִידַעְתֶּם כִּי אֲנִי יְהוָה מַכֶּה׃
    hebrewPlain: ולא תחוס עיני ולא אחמול כדרכיך עליך אתן ותועבותיך בתוכך תהיין וידעתם כי אני יהוה מכה
    kjvRefs:
    - Ezekiel 7:9
    kjvOsis:
    - Ezek.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.10
    scripture: tanakh
    name: Tanakh Ezekiel 7:10
    ref: Ezekiel 7:10
    book: Ezek
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 12942
    text: Behold the day; behold, it cometh; the turn is come forth; the rod hath blossomed, arrogancy hath budded.
    translation: JPS 1917
    original: הִנֵּה הַיּוֹם הִנֵּה בָאָה יָצְאָה הַצְּפִרָה צָץ הַמַּטֶּה פָּרַח הַזָּדוֹן׃
    hebrewPlain: הנה היום הנה באה יצאה הצפרה צץ המטה פרח הזדון
    kjvRefs:
    - Ezekiel 7:10
    kjvOsis:
    - Ezek.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.11
    scripture: tanakh
    name: Tanakh Ezekiel 7:11
    ref: Ezekiel 7:11
    book: Ezek
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 12943
    text: Violence is risen up into a rod of wickedness; nought cometh from them, nor from their tumult, nor from their turmoil, neither is there eminency among them.
    translation: JPS 1917
    original: הֶחָמָס קָם לְמַטֵּה־רֶשַׁע לֹא־מֵהֶם וְלֹא מֵהֲמוֹנָם וְלֹא מֶהֱמֵהֶם וְלֹא־נֹהַּ בָּהֶם׃
    hebrewPlain: החמס קם למטה רשע לא מהם ולא מהמונם ולא מהמהם ולא נה בהם
    kjvRefs:
    - Ezekiel 7:11
    kjvOsis:
    - Ezek.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.12
    scripture: tanakh
    name: Tanakh Ezekiel 7:12
    ref: Ezekiel 7:12
    book: Ezek
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 12944
    text: The time is come, the day draweth near; let not the buyer rejoice, nor the seller mourn; for wrath is upon all the multitude thereof.
    translation: JPS 1917
    original: בָּא הָעֵת הִגִּיעַ הַיּוֹם הַקּוֹנֶה אַל־יִשְׂמָח וְהַמּוֹכֵר אַל־יִתְאַבָּל כִּי חָרוֹן אֶל־כָּל־הֲמוֹנָהּ׃
    hebrewPlain: בא העת הגיע היום הקונה אל ישמח והמוכר אל יתאבל כי חרון אל כל המונה
    kjvRefs:
    - Ezekiel 7:12
    kjvOsis:
    - Ezek.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.13
    scripture: tanakh
    name: Tanakh Ezekiel 7:13
    ref: Ezekiel 7:13
    book: Ezek
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 12945
    text: For the seller shall not return to that which is sold, although they be yet alive; for the vision is touching the whole multitude thereof, which shall not return; neither shall any stand possessed of the iniquity of his life.
    translation: JPS 1917
    original: כִּי הַמּוֹכֵר אֶל־הַמִּמְכָּר לֹא יָשׁוּב וְעוֹד בַּחַיִּים חַיָּתָם כִּי־חָזוֹן אֶל־כָּל־הֲמוֹנָהּ לֹא יָשׁוּב וְאִישׁ בַּעֲוֺנוֹ חַיָּתוֹ לֹא יִתְחַזָּקוּ׃
    hebrewPlain: כי המוכר אל הממכר לא ישוב ועוד בחיים חיתם כי חזון אל כל המונה לא ישוב ואיש בעונו חיתו לא יתחזקו
    kjvRefs:
    - Ezekiel 7:13
    kjvOsis:
    - Ezek.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.14
    scripture: tanakh
    name: Tanakh Ezekiel 7:14
    ref: Ezekiel 7:14
    book: Ezek
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 12946
    text: They have blown the horn, and have made all ready, but none goeth to the battle; for My wrath is upon all the multitude thereof.
    translation: JPS 1917
    original: תָּקְעוּ בַתָּקוֹעַ וְהָכִין הַכֹּל וְאֵין הֹלֵךְ לַמִּלְחָמָה כִּי חֲרוֹנִי אֶל־כָּל־הֲמוֹנָהּ׃
    hebrewPlain: תקעו בתקוע והכין הכל ואין הלך למלחמה כי חרוני אל כל המונה
    kjvRefs:
    - Ezekiel 7:14
    kjvOsis:
    - Ezek.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.15
    scripture: tanakh
    name: Tanakh Ezekiel 7:15
    ref: Ezekiel 7:15
    book: Ezek
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 12947
    text: The sword is without, and the pestilence and the famine within; he that is in the field shall die with the sword, and he that is in the city, famine and pestilence shall devour him.
    translation: JPS 1917
    original: הַחֶרֶב בַּחוּץ וְהַדֶּבֶר וְהָרָעָב מִבָּיִת אֲשֶׁר בַּשָּׂדֶה בַּחֶרֶב יָמוּת וַאֲשֶׁר בָּעִיר רָעָב וָדֶבֶר יֹאכֲלֶנּוּ׃
    hebrewPlain: החרב בחוץ והדבר והרעב מבית אשר בשדה בחרב ימות ואשר בעיר רעב ודבר יאכלנו
    kjvRefs:
    - Ezekiel 7:15
    kjvOsis:
    - Ezek.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.16
    scripture: tanakh
    name: Tanakh Ezekiel 7:16
    ref: Ezekiel 7:16
    book: Ezek
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 12948
    text: But they that shall at all escape of them, shall be on the mountains like doves of the valleys, all of them moaning, every one in his iniquity.
    translation: JPS 1917
    original: וּפָלְטוּ פְּלִיטֵיהֶם וְהָיוּ אֶל־הֶהָרִים כְּיוֹנֵי הַגֵּאָיוֹת כֻּלָּם הֹמוֹת אִישׁ בַּעֲוֺנוֹ׃
    hebrewPlain: ופלטו פליטיהם והיו אל ההרים כיוני הגאיות כלם המות איש בעונו
    kjvRefs:
    - Ezekiel 7:16
    kjvOsis:
    - Ezek.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.17
    scripture: tanakh
    name: Tanakh Ezekiel 7:17
    ref: Ezekiel 7:17
    book: Ezek
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 12949
    text: All hands shall be slack, and all knees shall drip with water.
    translation: JPS 1917
    original: כָּל־הַיָּדַיִם תִּרְפֶּינָה וְכָל־בִּרְכַּיִם תֵּלַכְנָה מָּיִם׃
    hebrewPlain: כל הידים תרפינה וכל ברכים תלכנה מים
    kjvRefs:
    - Ezekiel 7:17
    kjvOsis:
    - Ezek.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.18
    scripture: tanakh
    name: Tanakh Ezekiel 7:18
    ref: Ezekiel 7:18
    book: Ezek
    section: neviim
    chapter: 7
    verse: 18
    ordinal: 12950
    text: They shall also gird themselves with sackcloth, and horror shall cover them; and shame shall be upon all faces, and baldness upon all their heads.
    translation: JPS 1917
    original: וְחָגְרוּ שַׂקִּים וְכִסְּתָה אוֹתָם פַּלָּצוּת וְאֶל כָּל־פָּנִים בּוּשָׁה וּבְכָל־רָאשֵׁיהֶם קָרְחָה׃
    hebrewPlain: וחגרו שקים וכסתה אותם פלצות ואל כל פנים בושה ובכל ראשיהם קרחה
    kjvRefs:
    - Ezekiel 7:18
    kjvOsis:
    - Ezek.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.19
    scripture: tanakh
    name: Tanakh Ezekiel 7:19
    ref: Ezekiel 7:19
    book: Ezek
    section: neviim
    chapter: 7
    verse: 19
    ordinal: 12951
    text: They shall cast their silver in the streets, and their gold shall be as an unclean thing; their silver and their gold shall not be able to deliver them in the day of the wrath of the LORD; they shall not satisfy their souls, neither fill their bowels; because it hath been the stumblingblock of their iniquity.
    translation: JPS 1917
    original: כַּסְפָּם בַּחוּצוֹת יַשְׁלִיכוּ וּזְהָבָם לְנִדָּה יִהְיֶה כַּסְפָּם וּזְהָבָם לֹא־יוּכַל לְהַצִּילָם בְּיוֹם עֶבְרַת יְהוָה נַפְשָׁם לֹא יְשַׂבֵּעוּ וּמֵעֵיהֶם לֹא יְמַלֵּאוּ כִּי־מִכְשׁוֹל עֲוֺנָם הָיָה׃
    hebrewPlain: כספם בחוצות ישליכו וזהבם לנדה יהיה כספם וזהבם לא יוכל להצילם ביום עברת יהוה נפשם לא ישבעו ומעיהם לא ימלאו כי מכשול עונם היה
    kjvRefs:
    - Ezekiel 7:19
    kjvOsis:
    - Ezek.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.20
    scripture: tanakh
    name: Tanakh Ezekiel 7:20
    ref: Ezekiel 7:20
    book: Ezek
    section: neviim
    chapter: 7
    verse: 20
    ordinal: 12952
    text: And as for the beauty of their ornament, which was set for a pride, they made the images of their abominations and their detestable things thereof; therefore have I made it unto them as an unclean thing.
    translation: JPS 1917
    original: וּצְבִי עֶדְיוֹ לְגָאוֹן שָׂמָהוּ וְצַלְמֵי תוֹעֲבֹתָם שִׁקּוּצֵיהֶם עָשׂוּ בוֹ עַל־כֵּן נְתַתִּיו לָהֶם לְנִדָּה׃
    hebrewPlain: וצבי עדיו לגאון שמהו וצלמי תועבתם שקוציהם עשו בו על כן נתתיו להם לנדה
    kjvRefs:
    - Ezekiel 7:20
    kjvOsis:
    - Ezek.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.21
    scripture: tanakh
    name: Tanakh Ezekiel 7:21
    ref: Ezekiel 7:21
    book: Ezek
    section: neviim
    chapter: 7
    verse: 21
    ordinal: 12953
    text: And I will give it into the hands of the strangers for a prey, and to the wicked of the earth for a spoil; and they shall profane it.
    translation: JPS 1917
    original: וּנְתַתִּיו בְּיַד־הַזָּרִים לָבַז וּלְרִשְׁעֵי הָאָרֶץ לְשָׁלָל וחללה [וְחִלְּלוּהוּ׃]
    hebrewPlain: ונתתיו ביד הזרים לבז ולרשעי הארץ לשלל וחללה [וחללוהו]
    kjvRefs:
    - Ezekiel 7:21
    kjvOsis:
    - Ezek.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.22
    scripture: tanakh
    name: Tanakh Ezekiel 7:22
    ref: Ezekiel 7:22
    book: Ezek
    section: neviim
    chapter: 7
    verse: 22
    ordinal: 12954
    text: I will also turn My face from them, and they shall profane My secret place; and robbers shall enter into it, and profane it.
    translation: JPS 1917
    original: וַהֲסִבּוֹתִי פָנַי מֵהֶם וְחִלְּלוּ אֶת־צְפוּנִי וּבָאוּ־בָהּ פָּרִיצִים וְחִלְּלוּהָ׃
    hebrewPlain: והסבותי פני מהם וחללו את צפוני ובאו בה פריצים וחללוה
    kjvRefs:
    - Ezekiel 7:22
    kjvOsis:
    - Ezek.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.23
    scripture: tanakh
    name: Tanakh Ezekiel 7:23
    ref: Ezekiel 7:23
    book: Ezek
    section: neviim
    chapter: 7
    verse: 23
    ordinal: 12955
    text: Make the chain; for the land is full of bloody crimes, and the city is full of violence.
    translation: JPS 1917
    original: עֲשֵׂה הָרַתּוֹק כִּי הָאָרֶץ מָלְאָה מִשְׁפַּט דָּמִים וְהָעִיר מָלְאָה חָמָס׃
    hebrewPlain: עשה הרתוק כי הארץ מלאה משפט דמים והעיר מלאה חמס
    kjvRefs:
    - Ezekiel 7:23
    kjvOsis:
    - Ezek.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.24
    scripture: tanakh
    name: Tanakh Ezekiel 7:24
    ref: Ezekiel 7:24
    book: Ezek
    section: neviim
    chapter: 7
    verse: 24
    ordinal: 12956
    text: Wherefore I will bring the worst of the nations, and they shall possess their houses; I will also make the pride of the strong to cease; and their holy places shall be profaned.
    translation: JPS 1917
    original: וְהֵבֵאתִי רָעֵי גוֹיִם וְיָרְשׁוּ אֶת־בָּתֵּיהֶם וְהִשְׁבַּתִּי גְּאוֹן עַזִּים וְנִחֲלוּ מְקַדְשֵׁיהֶם׃
    hebrewPlain: והבאתי רעי גוים וירשו את בתיהם והשבתי גאון עזים ונחלו מקדשיהם
    kjvRefs:
    - Ezekiel 7:24
    kjvOsis:
    - Ezek.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.25
    scripture: tanakh
    name: Tanakh Ezekiel 7:25
    ref: Ezekiel 7:25
    book: Ezek
    section: neviim
    chapter: 7
    verse: 25
    ordinal: 12957
    text: Horror cometh; and they shall seek peace, and there shall be none.
    translation: JPS 1917
    original: קְפָדָה־בָא וּבִקְשׁוּ שָׁלוֹם וָאָיִן׃
    hebrewPlain: קפדה בא ובקשו שלום ואין
    kjvRefs:
    - Ezekiel 7:25
    kjvOsis:
    - Ezek.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.26
    scripture: tanakh
    name: Tanakh Ezekiel 7:26
    ref: Ezekiel 7:26
    book: Ezek
    section: neviim
    chapter: 7
    verse: 26
    ordinal: 12958
    text: Calamity shall come upon calamity, and rumour shall be upon rumour; and they shall seek a vision of the prophet, and instruction shall perish from the priest, and counsel from the elders.
    translation: JPS 1917
    original: הֹוָה עַל־הֹוָה תָּבוֹא וּשְׁמֻעָה אֶל־שְׁמוּעָה תִּהְיֶה וּבִקְשׁוּ חָזוֹן מִנָּבִיא וְתוֹרָה תֹּאבַד מִכֹּהֵן וְעֵצָה מִזְּקֵנִים׃
    hebrewPlain: הוה על הוה תבוא ושמעה אל שמועה תהיה ובקשו חזון מנביא ותורה תאבד מכהן ועצה מזקנים
    kjvRefs:
    - Ezekiel 7:26
    kjvOsis:
    - Ezek.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.7.27
    scripture: tanakh
    name: Tanakh Ezekiel 7:27
    ref: Ezekiel 7:27
    book: Ezek
    section: neviim
    chapter: 7
    verse: 27
    ordinal: 12959
    text: The king shall mourn, and the prince shall be clothed with appalment, and the hands of the people of the land shall be enfeebled; I will do unto them after their way, and according to their deserts will I judge them; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: הַמֶּלֶךְ יִתְאַבָּל וְנָשִׂיא יִלְבַּשׁ שְׁמָמָה וִידֵי עַם־הָאָרֶץ תִּבָּהַלְנָה מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: המלך יתאבל ונשיא ילבש שממה וידי עם הארץ תבהלנה מדרכם אעשה אותם ובמשפטיהם אשפטם וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 7:27
    kjvOsis:
    - Ezek.7.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.7
- type: TanakhVerse
  data:
    osis: Ezek.8.1
    scripture: tanakh
    name: Tanakh Ezekiel 8:1
    ref: Ezekiel 8:1
    book: Ezek
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 12960
    text: And it came to pass in the sixth year, in the sixth month, in the fifth day of the month, as I sat in my house, and the elders of Judah sat before me, that the hand of the Lord GOD fell there upon me.
    translation: JPS 1917
    original: וַיְהִי בַּשָּׁנָה הַשִּׁשִּׁית בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ אֲנִי יוֹשֵׁב בְּבֵיתִי וְזִקְנֵי יְהוּדָה יוֹשְׁבִים לְפָנָי וַתִּפֹּל עָלַי שָׁם יַד אֲדֹנָי יְהֹוִה׃
    hebrewPlain: ויהי בשנה הששית בששי בחמשה לחדש אני יושב בביתי וזקני יהודה יושבים לפני ותפל עלי שם יד אדני יהוה
    kjvRefs:
    - Ezekiel 8:1
    kjvOsis:
    - Ezek.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.2
    scripture: tanakh
    name: Tanakh Ezekiel 8:2
    ref: Ezekiel 8:2
    book: Ezek
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 12961
    text: 'Then I beheld, and lo a likeness as the appearance of fire: from the appearance of his loins and downward, fire; and from his loins and upward, as the appearance of brightness, as the colour of electrum.'
    translation: JPS 1917
    original: וָאֶרְאֶה וְהִנֵּה דְמוּת כְּמַרְאֵה־אֵשׁ מִמַּרְאֵה מָתְנָיו וּלְמַטָּה אֵשׁ וּמִמָּתְנָיו וּלְמַעְלָה כְּמַרְאֵה־זֹהַר כְּעֵין הַחַשְׁמַלָה׃
    hebrewPlain: ואראה והנה דמות כמראה אש ממראה מתניו ולמטה אש וממתניו ולמעלה כמראה זהר כעין החשמלה
    kjvRefs:
    - Ezekiel 8:2
    kjvOsis:
    - Ezek.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.3
    scripture: tanakh
    name: Tanakh Ezekiel 8:3
    ref: Ezekiel 8:3
    book: Ezek
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 12962
    text: And the form of a hand was put forth, and I was taken by a lock of my head; and a spirit lifted me up between the earth and the heaven, and brought me in the visions of God to Jerusalem, to the door of the gate of the inner court that looketh toward the north; where was the seat of the image of jealousy, which provoketh to jealousy.
    translation: JPS 1917
    original: וַיִּשְׁלַח תַּבְנִית יָד וַיִּקָּחֵנִי בְּצִיצִת רֹאשִׁי וַתִּשָּׂא אֹתִי רוּחַ בֵּין־הָאָרֶץ וּבֵין הַשָּׁמַיִם וַתָּבֵא אֹתִי יְרוּשָׁלְַמָה בְּמַרְאוֹת אֱלֹהִים אֶל־פֶּתַח שַׁעַר הַפְּנִימִית הַפּוֹנֶה צָפוֹנָה אֲשֶׁר־שָׁם מוֹשַׁב סֵמֶל הַקִּנְאָה הַמַּקְנֶה׃
    hebrewPlain: וישלח תבנית יד ויקחני בציצת ראשי ותשא אתי רוח בין הארץ ובין השמים ותבא אתי ירושלמה במראות אלהים אל פתח שער הפנימית הפונה צפונה אשר שם מושב סמל הקנאה המקנה
    kjvRefs:
    - Ezekiel 8:3
    kjvOsis:
    - Ezek.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.4
    scripture: tanakh
    name: Tanakh Ezekiel 8:4
    ref: Ezekiel 8:4
    book: Ezek
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 12963
    text: And, behold, the glory of the God of Israel was there, according to the vision that I saw in the plain.
    translation: JPS 1917
    original: וְהִנֵּה־שָׁם כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל כַּמַּרְאֶה אֲשֶׁר רָאִיתִי בַּבִּקְעָה׃
    hebrewPlain: והנה שם כבוד אלהי ישראל כמראה אשר ראיתי בבקעה
    kjvRefs:
    - Ezekiel 8:4
    kjvOsis:
    - Ezek.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.5
    scripture: tanakh
    name: Tanakh Ezekiel 8:5
    ref: Ezekiel 8:5
    book: Ezek
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 12964
    text: 'Then said He unto me: ‘Son of man, lift up thine eyes now the way toward the north.’ So I lifted up mine eyes the way toward the north, and behold northward of the gate of the altar this image of jealousy in the entry.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם שָׂא־נָא עֵינֶיךָ דֶּרֶךְ צָפוֹנָה וָאֶשָּׂא עֵינַי דֶּרֶךְ צָפוֹנָה וְהִנֵּה מִצָּפוֹן לְשַׁעַר הַמִּזְבֵּחַ סֵמֶל הַקִּנְאָה הַזֶּה בַּבִּאָה׃
    hebrewPlain: ויאמר אלי בן אדם שא נא עיניך דרך צפונה ואשא עיני דרך צפונה והנה מצפון לשער המזבח סמל הקנאה הזה בבאה
    kjvRefs:
    - Ezekiel 8:5
    kjvOsis:
    - Ezek.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.6
    scripture: tanakh
    name: Tanakh Ezekiel 8:6
    ref: Ezekiel 8:6
    book: Ezek
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 12965
    text: 'And He said unto me: ‘Son of man, seest thou what they do? even the great abominations that the house of Israel do commit here, that I should go far off from My sanctuary? but thou shalt again see yet greater abominations.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם הֲרֹאֶה אַתָּה מהם [מָה] [הֵם] עֹשִׂים תּוֹעֵבוֹת גְּדֹלוֹת אֲשֶׁר בֵּית־יִשְׂרָאֵל עֹשִׂים פֹּה לְרָחֳקָה מֵעַל מִקְדָּשִׁי וְעוֹד תָּשׁוּב תִּרְאֶה תּוֹעֵבוֹת גְּדֹלוֹת׃
    hebrewPlain: ויאמר אלי בן אדם הראה אתה מהם [מה] [הם] עשים תועבות גדלות אשר בית ישראל עשים פה לרחקה מעל מקדשי ועוד תשוב תראה תועבות גדלות
    kjvRefs:
    - Ezekiel 8:6
    kjvOsis:
    - Ezek.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.7
    scripture: tanakh
    name: Tanakh Ezekiel 8:7
    ref: Ezekiel 8:7
    book: Ezek
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 12966
    text: And He brought me to the door of the court; and when I looked, behold a hole in the wall.
    translation: JPS 1917
    original: וַיָּבֵא אֹתִי אֶל־פֶּתַח הֶחָצֵר וָאֶרְאֶה וְהִנֵּה חֹר־אֶחָד בַּקִּיר׃
    hebrewPlain: ויבא אתי אל פתח החצר ואראה והנה חר אחד בקיר
    kjvRefs:
    - Ezekiel 8:7
    kjvOsis:
    - Ezek.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.8
    scripture: tanakh
    name: Tanakh Ezekiel 8:8
    ref: Ezekiel 8:8
    book: Ezek
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 12967
    text: 'Then said He unto me: ‘Son of man, dig now in the wall’; and when I had digged in the wall, behold a door.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם חֲתָר־נָא בַקִּיר וָאֶחְתֹּר בַּקִּיר וְהִנֵּה פֶּתַח אֶחָד׃
    hebrewPlain: ויאמר אלי בן אדם חתר נא בקיר ואחתר בקיר והנה פתח אחד
    kjvRefs:
    - Ezekiel 8:8
    kjvOsis:
    - Ezek.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.9
    scripture: tanakh
    name: Tanakh Ezekiel 8:9
    ref: Ezekiel 8:9
    book: Ezek
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 12968
    text: 'And He said unto me: ‘Go in, and see the wicked abominations that they do here.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי בֹּא וּרְאֵה אֶת־הַתּוֹעֵבוֹת הָרָעוֹת אֲשֶׁר הֵם עֹשִׂים פֹּה׃
    hebrewPlain: ויאמר אלי בא וראה את התועבות הרעות אשר הם עשים פה
    kjvRefs:
    - Ezekiel 8:9
    kjvOsis:
    - Ezek.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.10
    scripture: tanakh
    name: Tanakh Ezekiel 8:10
    ref: Ezekiel 8:10
    book: Ezek
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 12969
    text: So I went in and saw; and behold every detestable form of creeping things and beasts, and all the idols of the house of Israel, portrayed upon the wall round about.
    translation: JPS 1917
    original: וָאָבוֹא וָאֶרְאֶה וְהִנֵּה כָל־תַּבְנִית רֶמֶשׂ וּבְהֵמָה שֶׁקֶץ וְכָל־גִּלּוּלֵי בֵּית יִשְׂרָאֵל מְחֻקֶּה עַל־הַקִּיר סָבִיב סָבִיב׃
    hebrewPlain: ואבוא ואראה והנה כל תבנית רמש ובהמה שקץ וכל גלולי בית ישראל מחקה על הקיר סביב סביב
    kjvRefs:
    - Ezekiel 8:10
    kjvOsis:
    - Ezek.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.11
    scripture: tanakh
    name: Tanakh Ezekiel 8:11
    ref: Ezekiel 8:11
    book: Ezek
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 12970
    text: And there stood before them seventy men of the elders of the house of Israel, and in the midst of them stood Jaazaniah the son of Shaphan, every man with his censer in his hand; and a thick cloud of incense went up.
    translation: JPS 1917
    original: וְשִׁבְעִים אִישׁ מִזִּקְנֵי בֵית־יִשְׂרָאֵל וְיַאֲזַנְיָהוּ בֶן־שָׁפָן עֹמֵד בְּתוֹכָם עֹמְדִים לִפְנֵיהֶם וְאִישׁ מִקְטַרְתּוֹ בְּיָדוֹ וַעֲתַר עֲנַן־הַקְּטֹרֶת עֹלֶה׃
    hebrewPlain: ושבעים איש מזקני בית ישראל ויאזניהו בן שפן עמד בתוכם עמדים לפניהם ואיש מקטרתו בידו ועתר ענן הקטרת עלה
    kjvRefs:
    - Ezekiel 8:11
    kjvOsis:
    - Ezek.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.12
    scripture: tanakh
    name: Tanakh Ezekiel 8:12
    ref: Ezekiel 8:12
    book: Ezek
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 12971
    text: 'Then said He unto me: ‘Son of man, hast thou seen what the elders of the house of Israel do in the dark, every man in his chambers of imagery? for they say: The LORD seeth us not, the LORD hath forsaken the land.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הֲרָאִיתָ בֶן־אָדָם אֲשֶׁר זִקְנֵי בֵית־יִשְׂרָאֵל עֹשִׂים בַּחֹשֶׁךְ אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ כִּי אֹמְרִים אֵין יְהוָה רֹאֶה אֹתָנוּ עָזַב יְהוָה אֶת־הָאָרֶץ׃
    hebrewPlain: ויאמר אלי הראית בן אדם אשר זקני בית ישראל עשים בחשך איש בחדרי משכיתו כי אמרים אין יהוה ראה אתנו עזב יהוה את הארץ
    kjvRefs:
    - Ezekiel 8:12
    kjvOsis:
    - Ezek.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.13
    scripture: tanakh
    name: Tanakh Ezekiel 8:13
    ref: Ezekiel 8:13
    book: Ezek
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 12972
    text: 'He said also unto me: ‘Thou shalt again see yet greater abominations which they do.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי עוֹד תָּשׁוּב תִּרְאֶה תּוֹעֵבוֹת גְּדֹלוֹת אֲשֶׁר־הֵמָּה עֹשִׂים׃
    hebrewPlain: ויאמר אלי עוד תשוב תראה תועבות גדלות אשר המה עשים
    kjvRefs:
    - Ezekiel 8:13
    kjvOsis:
    - Ezek.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.14
    scripture: tanakh
    name: Tanakh Ezekiel 8:14
    ref: Ezekiel 8:14
    book: Ezek
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 12973
    text: Then He brought me to the door of the gate of the LORD’S house which was toward the north; and, behold, there sat the women weeping for Tammuz.
    translation: JPS 1917
    original: וַיָּבֵא אֹתִי אֶל־פֶּתַח שַׁעַר בֵּית־יְהוָה אֲשֶׁר אֶל־הַצָּפוֹנָה וְהִנֵּה־שָׁם הַנָּשִׁים יֹשְׁבוֹת מְבַכּוֹת אֶת־הַתַּמּוּז׃
    hebrewPlain: ויבא אתי אל פתח שער בית יהוה אשר אל הצפונה והנה שם הנשים ישבות מבכות את התמוז
    kjvRefs:
    - Ezekiel 8:14
    kjvOsis:
    - Ezek.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.15
    scripture: tanakh
    name: Tanakh Ezekiel 8:15
    ref: Ezekiel 8:15
    book: Ezek
    section: neviim
    chapter: 8
    verse: 15
    ordinal: 12974
    text: 'Then said He unto me: ‘Hast thou seen this, O son of man? thou shalt again see yet greater abominations than these.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הֲרָאִיתָ בֶן־אָדָם עוֹד תָּשׁוּב תִּרְאֶה תּוֹעֵבוֹת גְּדֹלוֹת מֵאֵלֶּה׃
    hebrewPlain: ויאמר אלי הראית בן אדם עוד תשוב תראה תועבות גדלות מאלה
    kjvRefs:
    - Ezekiel 8:15
    kjvOsis:
    - Ezek.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.16
    scripture: tanakh
    name: Tanakh Ezekiel 8:16
    ref: Ezekiel 8:16
    book: Ezek
    section: neviim
    chapter: 8
    verse: 16
    ordinal: 12975
    text: And He brought me into the inner court of the LORD’S house, and, behold, at the door of the temple of the LORD, between the porch and the altar, were about five and twenty men, with their backs toward the temple of the LORD, and their faces toward the east; and they worshipped the sun toward the east.
    translation: JPS 1917
    original: וַיָּבֵא אֹתִי אֶל־חֲצַר בֵּית־יְהוָה הַפְּנִימִית וְהִנֵּה־פֶתַח הֵיכַל יְהוָה בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ אֲחֹרֵיהֶם אֶל־הֵיכַל יְהוָה וּפְנֵיהֶם קֵדְמָה וְהֵמָּה מִשְׁתַּחֲוִיתֶם קֵדְמָה לַשָּׁמֶשׁ׃
    hebrewPlain: ויבא אתי אל חצר בית יהוה הפנימית והנה פתח היכל יהוה בין האולם ובין המזבח כעשרים וחמשה איש אחריהם אל היכל יהוה ופניהם קדמה והמה משתחויתם קדמה לשמש
    kjvRefs:
    - Ezekiel 8:16
    kjvOsis:
    - Ezek.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.17
    scripture: tanakh
    name: Tanakh Ezekiel 8:17
    ref: Ezekiel 8:17
    book: Ezek
    section: neviim
    chapter: 8
    verse: 17
    ordinal: 12976
    text: 'Then He said unto me: ‘Hast thou seen this, O son of man? Is it a light thing to the house of Judah that they commit the abominations which they commit here in that they fill the land with violence, and provoke Me still more, and, lo, they put the branch to their nose?'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הֲרָאִיתָ בֶן־אָדָם הֲנָקֵל לְבֵית יְהוּדָה מֵעֲשׂוֹת אֶת־הַתּוֹעֵבוֹת אֲשֶׁר עָשׂוּ־פֹה כִּי־מָלְאוּ אֶת־הָאָרֶץ חָמָס וַיָּשֻׁבוּ לְהַכְעִיסֵנִי וְהִנָּם שֹׁלְחִים אֶת־הַזְּמוֹרָה אֶל־אַפָּם׃
    hebrewPlain: ויאמר אלי הראית בן אדם הנקל לבית יהודה מעשות את התועבות אשר עשו פה כי מלאו את הארץ חמס וישבו להכעיסני והנם שלחים את הזמורה אל אפם
    kjvRefs:
    - Ezekiel 8:17
    kjvOsis:
    - Ezek.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.8.18
    scripture: tanakh
    name: Tanakh Ezekiel 8:18
    ref: Ezekiel 8:18
    book: Ezek
    section: neviim
    chapter: 8
    verse: 18
    ordinal: 12977
    text: Therefore will I also deal in fury; Mine eye shall not spare, neither will I have pity; and though they cry in Mine ears with a loud voice, yet will I not hear them.’
    translation: JPS 1917
    original: וְגַם־אֲנִי אֶעֱשֶׂה בְחֵמָה לֹא־תָחוֹס עֵינִי וְלֹא אֶחְמֹל וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל וְלֹא אֶשְׁמַע אוֹתָם׃
    hebrewPlain: וגם אני אעשה בחמה לא תחוס עיני ולא אחמל וקראו באזני קול גדול ולא אשמע אותם
    kjvRefs:
    - Ezekiel 8:18
    kjvOsis:
    - Ezek.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.8
- type: TanakhVerse
  data:
    osis: Ezek.9.1
    scripture: tanakh
    name: Tanakh Ezekiel 9:1
    ref: Ezekiel 9:1
    book: Ezek
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 12978
    text: 'Then he called in mine ears with a loud voice, saying: ‘Cause ye them that have charge over the city to draw near, every man with his destroying weapon in his hand.’'
    translation: JPS 1917
    original: וַיִּקְרָא בְאָזְנַי קוֹל גָּדוֹל לֵאמֹר קָרְבוּ פְּקֻדּוֹת הָעִיר וְאִישׁ כְּלִי מַשְׁחֵתוֹ בְּיָדוֹ׃
    hebrewPlain: ויקרא באזני קול גדול לאמר קרבו פקדות העיר ואיש כלי משחתו בידו
    kjvRefs:
    - Ezekiel 9:1
    kjvOsis:
    - Ezek.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.2
    scripture: tanakh
    name: Tanakh Ezekiel 9:2
    ref: Ezekiel 9:2
    book: Ezek
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 12979
    text: And, behold, six men came from the way of the upper gate, which lieth toward the north, every man with his weapon of destruction in his hand; and one man in the midst of them clothed in linen, with a writer’s inkhorn on his side. And they went in, and stood beside the brazen altar.
    translation: JPS 1917
    original: וְהִנֵּה שִׁשָּׁה אֲנָשִׁים בָּאִים מִדֶּרֶךְ־שַׁעַר הָעֶלְיוֹן אֲשֶׁר מָפְנֶה צָפוֹנָה וְאִישׁ כְּלִי מַפָּצוֹ בְּיָדוֹ וְאִישׁ־אֶחָד בְּתוֹכָם לָבֻשׁ בַּדִּים וְקֶסֶת הַסֹּפֵר בְּמָתְנָיו וַיָּבֹאוּ וַיַּעַמְדוּ אֵצֶל מִזְבַּח הַנְּחֹשֶׁת׃
    hebrewPlain: והנה ששה אנשים באים מדרך שער העליון אשר מפנה צפונה ואיש כלי מפצו בידו ואיש אחד בתוכם לבש בדים וקסת הספר במתניו ויבאו ויעמדו אצל מזבח הנחשת
    kjvRefs:
    - Ezekiel 9:2
    kjvOsis:
    - Ezek.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.3
    scripture: tanakh
    name: Tanakh Ezekiel 9:3
    ref: Ezekiel 9:3
    book: Ezek
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 12980
    text: And the glory of the God of Israel was gone up from the cherub, whereupon it was, to the threshold of the house; and He called to the man clothed in linen, who had the writer’s inkhorn on his side.
    translation: JPS 1917
    original: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל נַעֲלָה מֵעַל הַכְּרוּב אֲשֶׁר הָיָה עָלָיו אֶל מִפְתַּן הַבָּיִת וַיִּקְרָא אֶל־הָאִישׁ הַלָּבֻשׁ הַבַּדִּים אֲשֶׁר קֶסֶת הַסֹּפֵר בְּמָתְנָיו׃
    hebrewPlain: וכבוד אלהי ישראל נעלה מעל הכרוב אשר היה עליו אל מפתן הבית ויקרא אל האיש הלבש הבדים אשר קסת הספר במתניו
    kjvRefs:
    - Ezekiel 9:3
    kjvOsis:
    - Ezek.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.4
    scripture: tanakh
    name: Tanakh Ezekiel 9:4
    ref: Ezekiel 9:4
    book: Ezek
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 12981
    text: 'And the LORD said unto him: ‘Go through the midst of the city, through the midst of Jerusalem, and set a mark upon the foreheads of the men that sigh and that cry for all the abominations that are done in the midst thereof.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אלו [אֵלָיו] עֲבֹר בְּתוֹךְ הָעִיר בְּתוֹךְ יְרוּשָׁלִָם וְהִתְוִיתָ תָּו עַל־מִצְחוֹת הָאֲנָשִׁים הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים עַל כָּל־הַתּוֹעֵבוֹת הַנַּעֲשׂוֹת בְּתוֹכָהּ׃
    hebrewPlain: ויאמר יהוה אלו [אליו] עבר בתוך העיר בתוך ירושלם והתוית תו על מצחות האנשים הנאנחים והנאנקים על כל התועבות הנעשות בתוכה
    kjvRefs:
    - Ezekiel 9:4
    kjvOsis:
    - Ezek.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.5
    scripture: tanakh
    name: Tanakh Ezekiel 9:5
    ref: Ezekiel 9:5
    book: Ezek
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 12982
    text: 'And to the others He said in my hearing: ‘Go ye through the city after him, and smite; let not your eye spare, neither have ye pity;'
    translation: JPS 1917
    original: וּלְאֵלֶּה אָמַר בְּאָזְנַי עִבְרוּ בָעִיר אַחֲרָיו וְהַכּוּ על־[אַל־] תָּחֹס עיניכם [עֵינְכֶם] וְאַל־תַּחְמֹלוּ׃
    hebrewPlain: ולאלה אמר באזני עברו בעיר אחריו והכו על [אל ] תחס עיניכם [עינכם] ואל תחמלו
    kjvRefs:
    - Ezekiel 9:5
    kjvOsis:
    - Ezek.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.6
    scripture: tanakh
    name: Tanakh Ezekiel 9:6
    ref: Ezekiel 9:6
    book: Ezek
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 12983
    text: slay utterly the old man, the young man and the maiden, and little children and women; but come not near any man upon whom is the mark; and begin at My sanctuary.’ Then they began at the elders that were before the house.
    translation: JPS 1917
    original: זָקֵן בָּחוּר וּבְתוּלָה וְטַף וְנָשִׁים תַּהַרְגוּ לְמַשְׁחִית וְעַל־כָּל־אִישׁ אֲשֶׁר־עָלָיו הַתָּו אַל־תִּגַּשׁוּ וּמִמִּקְדָּשִׁי תָּחֵלּוּ וַיָּחֵלּוּ בָּאֲנָשִׁים הַזְּקֵנִים אֲשֶׁר לִפְנֵי הַבָּיִת׃
    hebrewPlain: זקן בחור ובתולה וטף ונשים תהרגו למשחית ועל כל איש אשר עליו התו אל תגשו וממקדשי תחלו ויחלו באנשים הזקנים אשר לפני הבית
    kjvRefs:
    - Ezekiel 9:6
    kjvOsis:
    - Ezek.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.7
    scripture: tanakh
    name: Tanakh Ezekiel 9:7
    ref: Ezekiel 9:7
    book: Ezek
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 12984
    text: 'And He said unto them: ‘Defile the house, and fill the courts with the slain; go ye forth.’ And they went forth, and smote in the city.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם טַמְּאוּ אֶת־הַבַּיִת וּמַלְאוּ אֶת־הַחֲצֵרוֹת חֲלָלִים צֵאוּ וְיָצְאוּ וְהִכּוּ בָעִיר׃
    hebrewPlain: ויאמר אליהם טמאו את הבית ומלאו את החצרות חללים צאו ויצאו והכו בעיר
    kjvRefs:
    - Ezekiel 9:7
    kjvOsis:
    - Ezek.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.8
    scripture: tanakh
    name: Tanakh Ezekiel 9:8
    ref: Ezekiel 9:8
    book: Ezek
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 12985
    text: 'And it came to pass, while they were smiting, and I was left, that I fell upon my face, and cried, and said: ‘Ah Lord GOD! wilt Thou destroy all the residue of Israel in Thy pouring out of Thy fury upon Jerusalem?’'
    translation: JPS 1917
    original: וַיְהִי כְּהַכּוֹתָם וְנֵאשֲׁאַר אָנִי וָאֶפְּלָה עַל־פָּנַי וָאֶזְעַק וָאֹמַר אֲהָהּ אֲדֹנָי יְהוִה הֲמַשְׁחִית אַתָּה אֵת כָּל־שְׁאֵרִית יִשְׂרָאֵל בְּשָׁפְכְּךָ אֶת־חֲמָתְךָ עַל־יְרוּשָׁלִָם׃
    hebrewPlain: ויהי כהכותם ונאשאר אני ואפלה על פני ואזעק ואמר אהה אדני יהוה המשחית אתה את כל שארית ישראל בשפכך את חמתך על ירושלם
    kjvRefs:
    - Ezekiel 9:8
    kjvOsis:
    - Ezek.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.9
    scripture: tanakh
    name: Tanakh Ezekiel 9:9
    ref: Ezekiel 9:9
    book: Ezek
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 12986
    text: 'Then said He unto me: ‘The iniquity of the house of Israel and Judah is exceeding great, and the land is full of blood, and the city full of wresting of judgment; for they say: The LORD hath forsaken the land, and the LORD seeth not.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי עֲוֺן בֵּית־יִשְׂרָאֵל וִיהוּדָה גָּדוֹל בִּמְאֹד מְאֹד וַתִּמָּלֵא הָאָרֶץ דָּמִים וְהָעִיר מָלְאָה מֻטֶּה כִּי אָמְרוּ עָזַב יְהוָה אֶת־הָאָרֶץ וְאֵין יְהוָה רֹאֶה׃
    hebrewPlain: ויאמר אלי עון בית ישראל ויהודה גדול במאד מאד ותמלא הארץ דמים והעיר מלאה מטה כי אמרו עזב יהוה את הארץ ואין יהוה ראה
    kjvRefs:
    - Ezekiel 9:9
    kjvOsis:
    - Ezek.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.10
    scripture: tanakh
    name: Tanakh Ezekiel 9:10
    ref: Ezekiel 9:10
    book: Ezek
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 12987
    text: And as for Me also, Mine eye shall not spare, neither will I have pity, but I will bring their way upon their head.’
    translation: JPS 1917
    original: וְגַם־אֲנִי לֹא־תָחוֹס עֵינִי וְלֹא אֶחְמֹל דַּרְכָּם בְּרֹאשָׁם נָתָתִּי׃
    hebrewPlain: וגם אני לא תחוס עיני ולא אחמל דרכם בראשם נתתי
    kjvRefs:
    - Ezekiel 9:10
    kjvOsis:
    - Ezek.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.9.11
    scripture: tanakh
    name: Tanakh Ezekiel 9:11
    ref: Ezekiel 9:11
    book: Ezek
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 12988
    text: 'And, behold, the man clothed in linen, who had the inkhorn on his side, reported, saying: ‘I have done according to all that Thou hast commanded me.’'
    translation: JPS 1917
    original: וְהִנֵּה הָאִישׁ לְבֻשׁ הַבַּדִּים אֲשֶׁר הַקֶּסֶת בְּמָתְנָיו מֵשִׁיב דָּבָר לֵאמֹר עָשִׂיתִי כאשר [כְּכֹל] [אֲשֶׁר] צִוִּיתָנִי׃
    hebrewPlain: והנה האיש לבש הבדים אשר הקסת במתניו משיב דבר לאמר עשיתי כאשר [ככל] [אשר] צויתני
    kjvRefs:
    - Ezekiel 9:11
    kjvOsis:
    - Ezek.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.9
- type: TanakhVerse
  data:
    osis: Ezek.10.1
    scripture: tanakh
    name: Tanakh Ezekiel 10:1
    ref: Ezekiel 10:1
    book: Ezek
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 12989
    text: Then I looked, and, behold, upon the firmament that was over the head of the cherubim, there appeared above them as it were a sapphire stone, as the appearance of the likeness of a throne.
    translation: JPS 1917
    original: וָאֶרְאֶה וְהִנֵּה אֶל־הָרָקִיעַ אֲשֶׁר עַל־רֹאשׁ הַכְּרֻבִים כְּאֶבֶן סַפִּיר כְּמַרְאֵה דְּמוּת כִּסֵּא נִרְאָה עֲלֵיהֶם׃
    hebrewPlain: ואראה והנה אל הרקיע אשר על ראש הכרבים כאבן ספיר כמראה דמות כסא נראה עליהם
    kjvRefs:
    - Ezekiel 10:1
    kjvOsis:
    - Ezek.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.2
    scripture: tanakh
    name: Tanakh Ezekiel 10:2
    ref: Ezekiel 10:2
    book: Ezek
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 12990
    text: 'And He spoke unto the man clothed in linen, and said: ‘Go in between the wheelwork, even under the cherub, and fill both thy hands with coals of fire from between the cherubim, and dash them against the city.’ And he went in in my sight.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־הָאִישׁ לְבֻשׁ הַבַּדִּים וַיֹּאמֶר בֹּא אֶל־בֵּינוֹת לַגַּלְגַּל אֶל־תַּחַת לַכְּרוּב וּמַלֵּא חָפְנֶיךָ גַחֲלֵי־אֵשׁ מִבֵּינוֹת לַכְּרֻבִים וּזְרֹק עַל־הָעִיר וַיָּבֹא לְעֵינָי׃
    hebrewPlain: ויאמר אל האיש לבש הבדים ויאמר בא אל בינות לגלגל אל תחת לכרוב ומלא חפניך גחלי אש מבינות לכרבים וזרק על העיר ויבא לעיני
    kjvRefs:
    - Ezekiel 10:2
    kjvOsis:
    - Ezek.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.3
    scripture: tanakh
    name: Tanakh Ezekiel 10:3
    ref: Ezekiel 10:3
    book: Ezek
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 12991
    text: Now the cherubim stood on the right side of the house, when the man went in; and the cloud filled the inner court.
    translation: JPS 1917
    original: וְהַכְּרֻבִים עֹמְדִים מִימִין לַבַּיִת בְּבֹאוֹ הָאִישׁ וְהֶעָנָן מָלֵא אֶת־הֶחָצֵר הַפְּנִימִית׃
    hebrewPlain: והכרבים עמדים מימין לבית בבאו האיש והענן מלא את החצר הפנימית
    kjvRefs:
    - Ezekiel 10:3
    kjvOsis:
    - Ezek.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.4
    scripture: tanakh
    name: Tanakh Ezekiel 10:4
    ref: Ezekiel 10:4
    book: Ezek
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 12992
    text: And the glory of the LORD mounted up from the cherub to the threshold of the house; and the house was filled with the cloud, and the court was full of the brightness of the LORD’S glory.
    translation: JPS 1917
    original: וַיָּרָם כְּבוֹד־יְהוָה מֵעַל הַכְּרוּב עַל מִפְתַּן הַבָּיִת וַיִּמָּלֵא הַבַּיִת אֶת־הֶעָנָן וְהֶחָצֵר מָלְאָה אֶת־נֹגַהּ כְּבוֹד יְהוָה׃
    hebrewPlain: וירם כבוד יהוה מעל הכרוב על מפתן הבית וימלא הבית את הענן והחצר מלאה את נגה כבוד יהוה
    kjvRefs:
    - Ezekiel 10:4
    kjvOsis:
    - Ezek.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.5
    scripture: tanakh
    name: Tanakh Ezekiel 10:5
    ref: Ezekiel 10:5
    book: Ezek
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 12993
    text: And the sound of the wings of the cherubim was heard even to the outer court, as the voice of God Almighty when He speaketh.
    translation: JPS 1917
    original: וְקוֹל כַּנְפֵי הַכְּרוּבִים נִשְׁמַע עַד־הֶחָצֵר הַחִיצֹנָה כְּקוֹל אֵל־שַׁדַּי בְּדַבְּרוֹ׃
    hebrewPlain: וקול כנפי הכרובים נשמע עד החצר החיצנה כקול אל שדי בדברו
    kjvRefs:
    - Ezekiel 10:5
    kjvOsis:
    - Ezek.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.6
    scripture: tanakh
    name: Tanakh Ezekiel 10:6
    ref: Ezekiel 10:6
    book: Ezek
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 12994
    text: 'And it came to pass, when He commanded the man clothed in linen, saying: ‘Take fire from between the wheelwork, from between the cherubim’, that he went in, and stood beside a wheel.'
    translation: JPS 1917
    original: וַיְהִי בְּצַוֺּתוֹ אֶת־הָאִישׁ לְבֻשׁ־הַבַּדִּים לֵאמֹר קַח אֵשׁ מִבֵּינוֹת לַגַּלְגַּל מִבֵּינוֹת לַכְּרוּבִים וַיָּבֹא וַיַּעֲמֹד אֵצֶל הָאוֹפָן׃
    hebrewPlain: ויהי בצותו את האיש לבש הבדים לאמר קח אש מבינות לגלגל מבינות לכרובים ויבא ויעמד אצל האופן
    kjvRefs:
    - Ezekiel 10:6
    kjvOsis:
    - Ezek.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.7
    scripture: tanakh
    name: Tanakh Ezekiel 10:7
    ref: Ezekiel 10:7
    book: Ezek
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 12995
    text: And the cherub stretched forth his hand from between the cherubim unto the fire that was between the cherubim, and took thereof, and put it into the hands of him that was clothed in linen, who took it and went out.
    translation: JPS 1917
    original: וַיִּשְׁלַח הַכְּרוּב אֶת־יָדוֹ מִבֵּינוֹת לַכְּרוּבִים אֶל־הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים וַיִּשָּׂא וַיִּתֵּן אֶל־חָפְנֵי לְבֻשׁ הַבַּדִּים וַיִּקַּח וַיֵּצֵא׃
    hebrewPlain: וישלח הכרוב את ידו מבינות לכרובים אל האש אשר בינות הכרבים וישא ויתן אל חפני לבש הבדים ויקח ויצא
    kjvRefs:
    - Ezekiel 10:7
    kjvOsis:
    - Ezek.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.8
    scripture: tanakh
    name: Tanakh Ezekiel 10:8
    ref: Ezekiel 10:8
    book: Ezek
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 12996
    text: And there appeared in the cherubim the form of a man’s hand under their wings.
    translation: JPS 1917
    original: וַיֵּרָא לַכְּרֻבִים תַּבְנִית יַד־אָדָם תַּחַת כַּנְפֵיהֶם׃
    hebrewPlain: וירא לכרבים תבנית יד אדם תחת כנפיהם
    kjvRefs:
    - Ezekiel 10:8
    kjvOsis:
    - Ezek.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.9
    scripture: tanakh
    name: Tanakh Ezekiel 10:9
    ref: Ezekiel 10:9
    book: Ezek
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 12997
    text: And I looked, and behold four wheels beside the cherubim, one wheel beside one cherub, and another wheel beside another cherub; and the appearance of the wheels was as the colour of a beryl stone.
    translation: JPS 1917
    original: וָאֶרְאֶה וְהִנֵּה אַרְבָּעָה אוֹפַנִּים אֵצֶל הַכְּרוּבִים אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד וְאוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד וּמַרְאֵה הָאוֹפַנִּים כְּעֵין אֶבֶן תַּרְשִׁישׁ׃
    hebrewPlain: ואראה והנה ארבעה אופנים אצל הכרובים אופן אחד אצל הכרוב אחד ואופן אחד אצל הכרוב אחד ומראה האופנים כעין אבן תרשיש
    kjvRefs:
    - Ezekiel 10:9
    kjvOsis:
    - Ezek.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.10
    scripture: tanakh
    name: Tanakh Ezekiel 10:10
    ref: Ezekiel 10:10
    book: Ezek
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 12998
    text: And as for their appearance, they four had one likeness, as if a wheel had been within a wheel.
    translation: JPS 1917
    original: וּמַרְאֵיהֶם דְּמוּת אֶחָד לְאַרְבַּעְתָּם כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן׃
    hebrewPlain: ומראיהם דמות אחד לארבעתם כאשר יהיה האופן בתוך האופן
    kjvRefs:
    - Ezekiel 10:10
    kjvOsis:
    - Ezek.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.11
    scripture: tanakh
    name: Tanakh Ezekiel 10:11
    ref: Ezekiel 10:11
    book: Ezek
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 12999
    text: When they went, they went toward their four sides; they turned not as they went, but to the place whither the head looked they followed it; they turned not as they went.
    translation: JPS 1917
    original: בְּלֶכְתָּם אֶל־אַרְבַּעַת רִבְעֵיהֶם יֵלֵכוּ לֹא יִסַּבּוּ בְּלֶכְתָּם כִּי הַמָּקוֹם אֲשֶׁר־יִפְנֶה הָרֹאשׁ אַחֲרָיו יֵלֵכוּ לֹא יִסַּבּוּ בְּלֶכְתָּם׃
    hebrewPlain: בלכתם אל ארבעת רבעיהם ילכו לא יסבו בלכתם כי המקום אשר יפנה הראש אחריו ילכו לא יסבו בלכתם
    kjvRefs:
    - Ezekiel 10:11
    kjvOsis:
    - Ezek.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.12
    scripture: tanakh
    name: Tanakh Ezekiel 10:12
    ref: Ezekiel 10:12
    book: Ezek
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 13000
    text: And their whole body, and their backs, and their hands, and their wings, and the wheels were full of eyes round about, even the wheels that they four had.
    translation: JPS 1917
    original: וְכָל־בְּשָׂרָם וְגַבֵּהֶם וִידֵיהֶם וְכַנְפֵיהֶם וְהָאוֹפַנִּים מְלֵאִים עֵינַיִם סָבִיב לְאַרְבַּעְתָּם אוֹפַנֵּיהֶם׃
    hebrewPlain: וכל בשרם וגבהם וידיהם וכנפיהם והאופנים מלאים עינים סביב לארבעתם אופניהם
    kjvRefs:
    - Ezekiel 10:12
    kjvOsis:
    - Ezek.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.13
    scripture: tanakh
    name: Tanakh Ezekiel 10:13
    ref: Ezekiel 10:13
    book: Ezek
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 13001
    text: As for the wheels, they were called in my hearing The wheelwork.
    translation: JPS 1917
    original: לָאוֹפַנִּים לָהֶם קוֹרָא הַגַּלְגַּל בְּאָזְנָי׃
    hebrewPlain: לאופנים להם קורא הגלגל באזני
    kjvRefs:
    - Ezekiel 10:13
    kjvOsis:
    - Ezek.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.14
    scripture: tanakh
    name: Tanakh Ezekiel 10:14
    ref: Ezekiel 10:14
    book: Ezek
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 13002
    text: 'And every one had four faces: the first face was the face of the cherub, and the second face was the face of a man, and the third the face of a lion, and the fourth the face of an eagle.'
    translation: JPS 1917
    original: וְאַרְבָּעָה פָנִים לְאֶחָד פְּנֵי הָאֶחָד פְּנֵי הַכְּרוּב וּפְנֵי הַשֵּׁנִי פְּנֵי אָדָם וְהַשְּׁלִישִׁי פְּנֵי אַרְיֵה וְהָרְבִיעִי פְּנֵי־נָשֶׁר׃
    hebrewPlain: וארבעה פנים לאחד פני האחד פני הכרוב ופני השני פני אדם והשלישי פני אריה והרביעי פני נשר
    kjvRefs:
    - Ezekiel 10:14
    kjvOsis:
    - Ezek.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.15
    scripture: tanakh
    name: Tanakh Ezekiel 10:15
    ref: Ezekiel 10:15
    book: Ezek
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 13003
    text: And the cherubim mounted up—this is the living creature that I saw by the river Chebar.
    translation: JPS 1917
    original: וַיֵּרֹמּוּ הַכְּרוּבִים הִיא הַחַיָּה אֲשֶׁר רָאִיתִי בִּנְהַר־כְּבָר׃
    hebrewPlain: וירמו הכרובים היא החיה אשר ראיתי בנהר כבר
    kjvRefs:
    - Ezekiel 10:15
    kjvOsis:
    - Ezek.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.16
    scripture: tanakh
    name: Tanakh Ezekiel 10:16
    ref: Ezekiel 10:16
    book: Ezek
    section: neviim
    chapter: 10
    verse: 16
    ordinal: 13004
    text: And when the cherubim went, the wheels went beside them; and when the cherubim lifted up their wings to mount up from the earth, the same wheels also turned not from beside them.
    translation: JPS 1917
    original: וּבְלֶכֶת הַכְּרוּבִים יֵלְכוּ הָאוֹפַנִּים אֶצְלָם וּבִשְׂאֵת הַכְּרוּבִים אֶת־כַּנְפֵיהֶם לָרוּם מֵעַל הָאָרֶץ לֹא־יִסַּבּוּ הָאוֹפַנִּים גַּם־הֵם מֵאֶצְלָם׃
    hebrewPlain: ובלכת הכרובים ילכו האופנים אצלם ובשאת הכרובים את כנפיהם לרום מעל הארץ לא יסבו האופנים גם הם מאצלם
    kjvRefs:
    - Ezekiel 10:16
    kjvOsis:
    - Ezek.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.17
    scripture: tanakh
    name: Tanakh Ezekiel 10:17
    ref: Ezekiel 10:17
    book: Ezek
    section: neviim
    chapter: 10
    verse: 17
    ordinal: 13005
    text: When they stood, these stood, and when they mounted up, these mounted up with them; for the spirit of the living creature was in them.
    translation: JPS 1917
    original: בְּעָמְדָם יַעֲמֹדוּ וּבְרוֹמָם יֵרוֹמּוּ אוֹתָם כִּי רוּחַ הַחַיָּה בָּהֶם׃
    hebrewPlain: בעמדם יעמדו וברומם ירומו אותם כי רוח החיה בהם
    kjvRefs:
    - Ezekiel 10:17
    kjvOsis:
    - Ezek.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.18
    scripture: tanakh
    name: Tanakh Ezekiel 10:18
    ref: Ezekiel 10:18
    book: Ezek
    section: neviim
    chapter: 10
    verse: 18
    ordinal: 13006
    text: And the glory of the LORD went forth from off the threshold of the house, and stood over the cherubim.
    translation: JPS 1917
    original: וַיֵּצֵא כְּבוֹד יְהוָה מֵעַל מִפְתַּן הַבָּיִת וַיַּעֲמֹד עַל־הַכְּרוּבִים׃
    hebrewPlain: ויצא כבוד יהוה מעל מפתן הבית ויעמד על הכרובים
    kjvRefs:
    - Ezekiel 10:18
    kjvOsis:
    - Ezek.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.19
    scripture: tanakh
    name: Tanakh Ezekiel 10:19
    ref: Ezekiel 10:19
    book: Ezek
    section: neviim
    chapter: 10
    verse: 19
    ordinal: 13007
    text: And the cherubim lifted up their wings, and mounted up from the earth in my sight when they went forth, and the wheels beside them; and they stood at the door of the east gate of the LORD’S house; and the glory of the God of Israel was over them above.
    translation: JPS 1917
    original: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם וַיֵּרוֹמּוּ מִן־הָאָרֶץ לְעֵינַי בְּצֵאתָם וְהָאוֹפַנִּים לְעֻמָּתָם וַיַּעֲמֹד פֶּתַח שַׁעַר בֵּית־יְהוָה הַקַּדְמוֹנִי וּכְבוֹד אֱלֹהֵי־יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה׃
    hebrewPlain: וישאו הכרובים את כנפיהם וירומו מן הארץ לעיני בצאתם והאופנים לעמתם ויעמד פתח שער בית יהוה הקדמוני וכבוד אלהי ישראל עליהם מלמעלה
    kjvRefs:
    - Ezekiel 10:19
    kjvOsis:
    - Ezek.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.20
    scripture: tanakh
    name: Tanakh Ezekiel 10:20
    ref: Ezekiel 10:20
    book: Ezek
    section: neviim
    chapter: 10
    verse: 20
    ordinal: 13008
    text: This is the living creature that I saw under the God of Israel by the river Chebar; and I knew that they were cherubim.
    translation: JPS 1917
    original: הִיא הַחַיָּה אֲשֶׁר רָאִיתִי תַּחַת אֱלֹהֵי־יִשְׂרָאֵל בִּנְהַר־כְּבָר וָאֵדַע כִּי כְרוּבִים הֵמָּה׃
    hebrewPlain: היא החיה אשר ראיתי תחת אלהי ישראל בנהר כבר ואדע כי כרובים המה
    kjvRefs:
    - Ezekiel 10:20
    kjvOsis:
    - Ezek.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.21
    scripture: tanakh
    name: Tanakh Ezekiel 10:21
    ref: Ezekiel 10:21
    book: Ezek
    section: neviim
    chapter: 10
    verse: 21
    ordinal: 13009
    text: Every one had four faces apiece, and every one four wings; and the likeness of the hands of a man was under their wings.
    translation: JPS 1917
    original: אַרְבָּעָה אַרְבָּעָה פָנִים לְאֶחָד וְאַרְבַּע כְּנָפַיִם לְאֶחָד וּדְמוּת יְדֵי אָדָם תַּחַת כַּנְפֵיהֶם׃
    hebrewPlain: ארבעה ארבעה פנים לאחד וארבע כנפים לאחד ודמות ידי אדם תחת כנפיהם
    kjvRefs:
    - Ezekiel 10:21
    kjvOsis:
    - Ezek.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.10.22
    scripture: tanakh
    name: Tanakh Ezekiel 10:22
    ref: Ezekiel 10:22
    book: Ezek
    section: neviim
    chapter: 10
    verse: 22
    ordinal: 13010
    text: And as for the likeness of their faces, they were the faces which I saw by the river Chebar, their appearances and themselves; they went every one straight forward.
    translation: JPS 1917
    original: וּדְמוּת פְּנֵיהֶם הֵמָּה הַפָּנִים אֲשֶׁר רָאִיתִי עַל־נְהַר־כְּבָר מַרְאֵיהֶם וְאוֹתָם אִישׁ אֶל־עֵבֶר פָּנָיו יֵלֵכוּ׃
    hebrewPlain: ודמות פניהם המה הפנים אשר ראיתי על נהר כבר מראיהם ואותם איש אל עבר פניו ילכו
    kjvRefs:
    - Ezekiel 10:22
    kjvOsis:
    - Ezek.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.10
- type: TanakhVerse
  data:
    osis: Ezek.11.1
    scripture: tanakh
    name: Tanakh Ezekiel 11:1
    ref: Ezekiel 11:1
    book: Ezek
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 13011
    text: Then a spirit lifted me up, and brought me unto the east gate of the LORD’S house, which looketh eastward; and behold at the door of the gate five and twenty men; and I saw in the midst of them Jaazaniah the son of Azzur, and Pelatiah the son of Benaiah, princes of the people.
    translation: JPS 1917
    original: וַתִּשָּׂא אֹתִי רוּחַ וַתָּבֵא אֹתִי אֶל־שַׁעַר בֵּית־יְהוָה הַקַּדְמוֹנִי הַפּוֹנֶה קָדִימָה וְהִנֵּה בְּפֶתַח הַשַּׁעַר עֶשְׂרִים וַחֲמִשָּׁה אִישׁ וָאֶרְאֶה בְתוֹכָם אֶת־יַאֲזַנְיָה בֶן־עַזֻּר וְאֶת־פְּלַטְיָהוּ בֶן־בְּנָיָהוּ שָׂרֵי הָעָם׃
    hebrewPlain: ותשא אתי רוח ותבא אתי אל שער בית יהוה הקדמוני הפונה קדימה והנה בפתח השער עשרים וחמשה איש ואראה בתוכם את יאזניה בן עזר ואת פלטיהו בן בניהו שרי העם
    kjvRefs:
    - Ezekiel 11:1
    kjvOsis:
    - Ezek.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.2
    scripture: tanakh
    name: Tanakh Ezekiel 11:2
    ref: Ezekiel 11:2
    book: Ezek
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 13012
    text: 'And He said unto me: ‘Son of man, these are the men that devise iniquity, and that give wicked counsel in this city;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי בֶּן־אָדָם אֵלֶּה הָאֲנָשִׁים הַחֹשְׁבִים אָוֶן וְהַיֹּעֲצִים עֲצַת־רָע בָּעִיר הַזֹּאת׃
    hebrewPlain: ויאמר אלי בן אדם אלה האנשים החשבים און והיעצים עצת רע בעיר הזאת
    kjvRefs:
    - Ezekiel 11:2
    kjvOsis:
    - Ezek.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.3
    scripture: tanakh
    name: Tanakh Ezekiel 11:3
    ref: Ezekiel 11:3
    book: Ezek
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 13013
    text: 'that say: The time is not near to build houses! this city is the caldron, and we are the flesh.'
    translation: JPS 1917
    original: הָאֹמְרִים לֹא בְקָרוֹב בְּנוֹת בָּתִּים הִיא הַסִּיר וַאֲנַחְנוּ הַבָּשָׂר׃
    hebrewPlain: האמרים לא בקרוב בנות בתים היא הסיר ואנחנו הבשר
    kjvRefs:
    - Ezekiel 11:3
    kjvOsis:
    - Ezek.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.4
    scripture: tanakh
    name: Tanakh Ezekiel 11:4
    ref: Ezekiel 11:4
    book: Ezek
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 13014
    text: Therefore prophesy against them, prophesy, O son of man.’
    translation: JPS 1917
    original: לָכֵן הִנָּבֵא עֲלֵיהֶם הִנָּבֵא בֶּן־אָדָם׃
    hebrewPlain: לכן הנבא עליהם הנבא בן אדם
    kjvRefs:
    - Ezekiel 11:4
    kjvOsis:
    - Ezek.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.5
    scripture: tanakh
    name: Tanakh Ezekiel 11:5
    ref: Ezekiel 11:5
    book: Ezek
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 13015
    text: 'And the spirit of the LORD fell upon me, and He said unto me: ‘Speak: Thus saith the LORD: Thus have ye said, O house of Israel; for I know the things that come into your mind.'
    translation: JPS 1917
    original: וַתִּפֹּל עָלַי רוּחַ יְהוָה וַיֹּאמֶר אֵלַי אֱמֹר כֹּה־אָמַר יְהוָה כֵּן אֲמַרְתֶּם בֵּית יִשְׂרָאֵל וּמַעֲלוֹת רוּחֲכֶם אֲנִי יְדַעְתִּיהָ׃
    hebrewPlain: ותפל עלי רוח יהוה ויאמר אלי אמר כה אמר יהוה כן אמרתם בית ישראל ומעלות רוחכם אני ידעתיה
    kjvRefs:
    - Ezekiel 11:5
    kjvOsis:
    - Ezek.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.6
    scripture: tanakh
    name: Tanakh Ezekiel 11:6
    ref: Ezekiel 11:6
    book: Ezek
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 13016
    text: Ye have multiplied your slain in this city, and ye have filled the streets thereof with the slain.
    translation: JPS 1917
    original: הִרְבֵּיתֶם חַלְלֵיכֶם בָּעִיר הַזֹּאת וּמִלֵּאתֶם חוּצֹתֶיהָ חָלָל׃
    hebrewPlain: הרביתם חלליכם בעיר הזאת ומלאתם חוצתיה חלל
    kjvRefs:
    - Ezekiel 11:6
    kjvOsis:
    - Ezek.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.7
    scripture: tanakh
    name: Tanakh Ezekiel 11:7
    ref: Ezekiel 11:7
    book: Ezek
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 13017
    text: 'Therefore thus saith the Lord GOD: Your slain whom ye have laid in the midst of it, they are the flesh, and this city is the caldron; but ye shall be brought forth out of the midst of it.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה חַלְלֵיכֶם אֲשֶׁר שַׂמְתֶּם בְּתוֹכָהּ הֵמָּה הַבָּשָׂר וְהִיא הַסִּיר וְאֶתְכֶם הוֹצִיא מִתּוֹכָהּ׃
    hebrewPlain: לכן כה אמר אדני יהוה חלליכם אשר שמתם בתוכה המה הבשר והיא הסיר ואתכם הוציא מתוכה
    kjvRefs:
    - Ezekiel 11:7
    kjvOsis:
    - Ezek.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.8
    scripture: tanakh
    name: Tanakh Ezekiel 11:8
    ref: Ezekiel 11:8
    book: Ezek
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 13018
    text: Ye have feared the sword; and the sword will I bring upon you, saith the Lord GOD.
    translation: JPS 1917
    original: חֶרֶב יְרֵאתֶם וְחֶרֶב אָבִיא עֲלֵיכֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: חרב יראתם וחרב אביא עליכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 11:8
    kjvOsis:
    - Ezek.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.9
    scripture: tanakh
    name: Tanakh Ezekiel 11:9
    ref: Ezekiel 11:9
    book: Ezek
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 13019
    text: And I will bring you forth out of the midst thereof, and deliver you into the hands of strangers, and will execute judgments among you.
    translation: JPS 1917
    original: וְהוֹצֵאתִי אֶתְכֶם מִתּוֹכָהּ וְנָתַתִּי אֶתְכֶם בְּיַד־זָרִים וְעָשִׂיתִי בָכֶם שְׁפָטִים׃
    hebrewPlain: והוצאתי אתכם מתוכה ונתתי אתכם ביד זרים ועשיתי בכם שפטים
    kjvRefs:
    - Ezekiel 11:9
    kjvOsis:
    - Ezek.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.10
    scripture: tanakh
    name: Tanakh Ezekiel 11:10
    ref: Ezekiel 11:10
    book: Ezek
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 13020
    text: 'Ye shall fall by the sword: I will judge you upon the border of Israel; and ye shall know that I am the LORD.'
    translation: JPS 1917
    original: בַּחֶרֶב תִּפֹּלוּ עַל־גְּבוּל יִשְׂרָאֵל אֶשְׁפּוֹט אֶתְכֶם וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: בחרב תפלו על גבול ישראל אשפוט אתכם וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 11:10
    kjvOsis:
    - Ezek.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.11
    scripture: tanakh
    name: Tanakh Ezekiel 11:11
    ref: Ezekiel 11:11
    book: Ezek
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 13021
    text: Though this city shall not be your caldron, ye shall be the flesh in the midst thereof; I will judge you upon the border of Israel;
    translation: JPS 1917
    original: הִיא לֹא־תִהְיֶה לָכֶם לְסִיר וְאַתֶּם תִּהְיוּ בְתוֹכָהּ לְבָשָׂר אֶל־גְּבוּל יִשְׂרָאֵל אֶשְׁפֹּט אֶתְכֶם׃
    hebrewPlain: היא לא תהיה לכם לסיר ואתם תהיו בתוכה לבשר אל גבול ישראל אשפט אתכם
    kjvRefs:
    - Ezekiel 11:11
    kjvOsis:
    - Ezek.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.12
    scripture: tanakh
    name: Tanakh Ezekiel 11:12
    ref: Ezekiel 11:12
    book: Ezek
    section: neviim
    chapter: 11
    verse: 12
    ordinal: 13022
    text: and ye shall know that I am the LORD; for ye have not walked in My statutes, neither have ye executed Mine ordinances, but have done after the ordinances of the nations that are round about you.’
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי־אֲנִי יְהוָה אֲשֶׁר בְּחֻקַּי לֹא הֲלַכְתֶּם וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם וּכְמִשְׁפְּטֵי הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם עֲשִׂיתֶם׃
    hebrewPlain: וידעתם כי אני יהוה אשר בחקי לא הלכתם ומשפטי לא עשיתם וכמשפטי הגוים אשר סביבותיכם עשיתם
    kjvRefs:
    - Ezekiel 11:12
    kjvOsis:
    - Ezek.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.13
    scripture: tanakh
    name: Tanakh Ezekiel 11:13
    ref: Ezekiel 11:13
    book: Ezek
    section: neviim
    chapter: 11
    verse: 13
    ordinal: 13023
    text: 'And it came to pass, when I prophesied, that Pelatiah the son of Benaiah died. Then fell I down upon my face, and cried with a loud voice, and said: ‘Ah Lord GOD! wilt Thou make a full end of the remnant of Israel?’'
    translation: JPS 1917
    original: וַיְהִי כְּהִנָּבְאִי וּפְלַטְיָהוּ בֶן־בְּנָיָה מֵת וָאֶפֹּל עַל־פָּנַי וָאֶזְעַק קוֹל־גָּדוֹל וָאֹמַר אֲהָהּ אֲדֹנָי יְהוִה כָּלָה אַתָּה עֹשֶׂה אֵת שְׁאֵרִית יִשְׂרָאֵל׃
    hebrewPlain: ויהי כהנבאי ופלטיהו בן בניה מת ואפל על פני ואזעק קול גדול ואמר אהה אדני יהוה כלה אתה עשה את שארית ישראל
    kjvRefs:
    - Ezekiel 11:13
    kjvOsis:
    - Ezek.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.14
    scripture: tanakh
    name: Tanakh Ezekiel 11:14
    ref: Ezekiel 11:14
    book: Ezek
    section: neviim
    chapter: 11
    verse: 14
    ordinal: 13024
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 11:14
    kjvOsis:
    - Ezek.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.15
    scripture: tanakh
    name: Tanakh Ezekiel 11:15
    ref: Ezekiel 11:15
    book: Ezek
    section: neviim
    chapter: 11
    verse: 15
    ordinal: 13025
    text: '’Son of man, as for thy brethren, even thy brethren, the men of thy kindred, and all the house of Israel, all of them, concerning whom the inhabitants of Jerusalem have said: Get you far from the LORD! unto us is this land given for a possession;'
    translation: JPS 1917
    original: בֶּן־אָדָם אַחֶיךָ אַחֶיךָ אַנְשֵׁי גְאֻלָּתֶךָ וְכָל־בֵּית יִשְׂרָאֵל כֻּלֹּה אֲשֶׁר אָמְרוּ לָהֶם יֹשְׁבֵי יְרוּשָׁלִַם רַחֲקוּ מֵעַל יְהוָה לָנוּ הִיא נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה׃
    hebrewPlain: בן אדם אחיך אחיך אנשי גאלתך וכל בית ישראל כלה אשר אמרו להם ישבי ירושלם רחקו מעל יהוה לנו היא נתנה הארץ למורשה
    kjvRefs:
    - Ezekiel 11:15
    kjvOsis:
    - Ezek.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.16
    scripture: tanakh
    name: Tanakh Ezekiel 11:16
    ref: Ezekiel 11:16
    book: Ezek
    section: neviim
    chapter: 11
    verse: 16
    ordinal: 13026
    text: 'therefore say: Thus saith the Lord GOD: Although I have removed them far off among the nations, and although I have scattered them among the countries, yet have I been to them as a little sanctuary in the countries where they are come;'
    translation: JPS 1917
    original: לָכֵן אֱמֹר כֹּה־אָמַר אֲדֹנָי יְהוִה כִּי הִרְחַקְתִּים בַּגּוֹיִם וְכִי הֲפִיצוֹתִים בָּאֲרָצוֹת וָאֱהִי לָהֶם לְמִקְדָּשׁ מְעַט בָּאֲרָצוֹת אֲשֶׁר־בָּאוּ שָׁם׃
    hebrewPlain: לכן אמר כה אמר אדני יהוה כי הרחקתים בגוים וכי הפיצותים בארצות ואהי להם למקדש מעט בארצות אשר באו שם
    kjvRefs:
    - Ezekiel 11:16
    kjvOsis:
    - Ezek.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.17
    scripture: tanakh
    name: Tanakh Ezekiel 11:17
    ref: Ezekiel 11:17
    book: Ezek
    section: neviim
    chapter: 11
    verse: 17
    ordinal: 13027
    text: 'therefore say: Thus saith the Lord GOD: I will even gather you from the peoples, and assemble you out of the countries where ye have been scattered, and I will give you the land of Israel.'
    translation: JPS 1917
    original: לָכֵן אֱמֹר כֹּה־אָמַר אֲדֹנָי יְהוִה וְקִבַּצְתִּי אֶתְכֶם מִן־הָעַמִּים וְאָסַפְתִּי אֶתְכֶם מִן־הָאֲרָצוֹת אֲשֶׁר נְפֹצוֹתֶם בָּהֶם וְנָתַתִּי לָכֶם אֶת־אַדְמַת יִשְׂרָאֵל׃
    hebrewPlain: לכן אמר כה אמר אדני יהוה וקבצתי אתכם מן העמים ואספתי אתכם מן הארצות אשר נפצותם בהם ונתתי לכם את אדמת ישראל
    kjvRefs:
    - Ezekiel 11:17
    kjvOsis:
    - Ezek.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.18
    scripture: tanakh
    name: Tanakh Ezekiel 11:18
    ref: Ezekiel 11:18
    book: Ezek
    section: neviim
    chapter: 11
    verse: 18
    ordinal: 13028
    text: And they shall come thither, and they shall take away all the detestable things thereof and all the abominations thereof from thence.
    translation: JPS 1917
    original: וּבָאוּ־שָׁמָּה וְהֵסִירוּ אֶת־כָּל־שִׁקּוּצֶיהָ וְאֶת־כָּל־תּוֹעֲבוֹתֶיהָ מִמֶּנָּה׃
    hebrewPlain: ובאו שמה והסירו את כל שקוציה ואת כל תועבותיה ממנה
    kjvRefs:
    - Ezekiel 11:18
    kjvOsis:
    - Ezek.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.19
    scripture: tanakh
    name: Tanakh Ezekiel 11:19
    ref: Ezekiel 11:19
    book: Ezek
    section: neviim
    chapter: 11
    verse: 19
    ordinal: 13029
    text: And I will give them one heart, and I will put a new spirit within you; and I will remove the stony heart out of their flesh, and will give them a heart of flesh;
    translation: JPS 1917
    original: וְנָתַתִּי לָהֶם לֵב אֶחָד וְרוּחַ חֲדָשָׁה אֶתֵּן בְּקִרְבְּכֶם וַהֲסִרֹתִי לֵב הָאֶבֶן מִבְּשָׂרָם וְנָתַתִּי לָהֶם לֵב בָּשָׂר׃
    hebrewPlain: ונתתי להם לב אחד ורוח חדשה אתן בקרבכם והסרתי לב האבן מבשרם ונתתי להם לב בשר
    kjvRefs:
    - Ezekiel 11:19
    kjvOsis:
    - Ezek.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.20
    scripture: tanakh
    name: Tanakh Ezekiel 11:20
    ref: Ezekiel 11:20
    book: Ezek
    section: neviim
    chapter: 11
    verse: 20
    ordinal: 13030
    text: that they may walk in My statutes, and keep Mine ordinances, and do them; and they shall be My people, and I will be their God.
    translation: JPS 1917
    original: לְמַעַן בְּחֻקֹּתַי יֵלֵכוּ וְאֶת־מִשְׁפָּטַי יִשְׁמְרוּ וְעָשׂוּ אֹתָם וְהָיוּ־לִי לְעָם וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים׃
    hebrewPlain: למען בחקתי ילכו ואת משפטי ישמרו ועשו אתם והיו לי לעם ואני אהיה להם לאלהים
    kjvRefs:
    - Ezekiel 11:20
    kjvOsis:
    - Ezek.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.21
    scripture: tanakh
    name: Tanakh Ezekiel 11:21
    ref: Ezekiel 11:21
    book: Ezek
    section: neviim
    chapter: 11
    verse: 21
    ordinal: 13031
    text: But as for them whose heart walketh after the heart of their detestable things and their abominations, I will bring their way upon their own heads, saith the Lord GOD.’
    translation: JPS 1917
    original: וְאֶל־לֵב שִׁקּוּצֵיהֶם וְתוֹעֲבוֹתֵיהֶם לִבָּם הֹלֵךְ דַּרְכָּם בְּרֹאשָׁם נָתַתִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ואל לב שקוציהם ותועבותיהם לבם הלך דרכם בראשם נתתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 11:21
    kjvOsis:
    - Ezek.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.22
    scripture: tanakh
    name: Tanakh Ezekiel 11:22
    ref: Ezekiel 11:22
    book: Ezek
    section: neviim
    chapter: 11
    verse: 22
    ordinal: 13032
    text: Then did the cherubim lift up their wings, and the wheels were beside them; and the glory of the God of Israel was over them above.
    translation: JPS 1917
    original: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם וְהָאוֹפַנִּים לְעֻמָּתָם וּכְבוֹד אֱלֹהֵי־יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה׃
    hebrewPlain: וישאו הכרובים את כנפיהם והאופנים לעמתם וכבוד אלהי ישראל עליהם מלמעלה
    kjvRefs:
    - Ezekiel 11:22
    kjvOsis:
    - Ezek.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.23
    scripture: tanakh
    name: Tanakh Ezekiel 11:23
    ref: Ezekiel 11:23
    book: Ezek
    section: neviim
    chapter: 11
    verse: 23
    ordinal: 13033
    text: And the glory of the LORD went up from the midst of the city, and stood upon the mountain which is on the east side of the city.
    translation: JPS 1917
    original: וַיַּעַל כְּבוֹד יְהוָה מֵעַל תּוֹךְ הָעִיר וַיַּעֲמֹד עַל־הָהָר אֲשֶׁר מִקֶּדֶם לָעִיר׃
    hebrewPlain: ויעל כבוד יהוה מעל תוך העיר ויעמד על ההר אשר מקדם לעיר
    kjvRefs:
    - Ezekiel 11:23
    kjvOsis:
    - Ezek.11.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.24
    scripture: tanakh
    name: Tanakh Ezekiel 11:24
    ref: Ezekiel 11:24
    book: Ezek
    section: neviim
    chapter: 11
    verse: 24
    ordinal: 13034
    text: And a spirit lifted me up, and brought me in the vision by the spirit of God into Chaldea, to them of the captivity. So the vision that I had seen went up from Me.
    translation: JPS 1917
    original: וְרוּחַ נְשָׂאַתְנִי וַתְּבִיאֵנִי כַשְׂדִּימָה אֶל־הַגּוֹלָה בַּמַּרְאֶה בְּרוּחַ אֱלֹהִים וַיַּעַל מֵעָלַי הַמַּרְאֶה אֲשֶׁר רָאִיתִי׃
    hebrewPlain: ורוח נשאתני ותביאני כשדימה אל הגולה במראה ברוח אלהים ויעל מעלי המראה אשר ראיתי
    kjvRefs:
    - Ezekiel 11:24
    kjvOsis:
    - Ezek.11.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.11.25
    scripture: tanakh
    name: Tanakh Ezekiel 11:25
    ref: Ezekiel 11:25
    book: Ezek
    section: neviim
    chapter: 11
    verse: 25
    ordinal: 13035
    text: Then I spoke unto them of the captivity all the things that the LORD had shown me.
    translation: JPS 1917
    original: וָאֲדַבֵּר אֶל־הַגּוֹלָה אֵת כָּל־דִּבְרֵי יְהוָה אֲשֶׁר הֶרְאָנִי׃
    hebrewPlain: ואדבר אל הגולה את כל דברי יהוה אשר הראני
    kjvRefs:
    - Ezekiel 11:25
    kjvOsis:
    - Ezek.11.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.11
- type: TanakhVerse
  data:
    osis: Ezek.12.1
    scripture: tanakh
    name: Tanakh Ezekiel 12:1
    ref: Ezekiel 12:1
    book: Ezek
    section: neviim
    chapter: 12
    verse: 1
    ordinal: 13036
    text: 'The word of the LORD also came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 12:1
    kjvOsis:
    - Ezek.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.2
    scripture: tanakh
    name: Tanakh Ezekiel 12:2
    ref: Ezekiel 12:2
    book: Ezek
    section: neviim
    chapter: 12
    verse: 2
    ordinal: 13037
    text: ’Son of man, thou dwellest in the midst of the rebellious house, that have eyes to see, and see not, that have ears to hear, and hear not; for they are a rebellious house.
    translation: JPS 1917
    original: בֶּן־אָדָם בְּתוֹךְ בֵּית־הַמֶּרִי אַתָּה יֹשֵׁב אֲשֶׁר עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ כִּי בֵּית מְרִי הֵם׃
    hebrewPlain: בן אדם בתוך בית המרי אתה ישב אשר עינים להם לראות ולא ראו אזנים להם לשמע ולא שמעו כי בית מרי הם
    kjvRefs:
    - Ezekiel 12:2
    kjvOsis:
    - Ezek.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.3
    scripture: tanakh
    name: Tanakh Ezekiel 12:3
    ref: Ezekiel 12:3
    book: Ezek
    section: neviim
    chapter: 12
    verse: 3
    ordinal: 13038
    text: Therefore, thou son of man, prepare thee stuff for exile, and remove as though for exile by day in their sight; and thou shalt remove from thy place to another place in their sight; it may be they will perceive, for they are a rebellious house.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם עֲשֵׂה לְךָ כְּלֵי גוֹלָה וּגְלֵה יוֹמָם לְעֵינֵיהֶם וְגָלִיתָ מִמְּקוֹמְךָ אֶל־מָקוֹם אַחֵר לְעֵינֵיהֶם אוּלַי יִרְאוּ כִּי בֵּית מְרִי הֵמָּה׃
    hebrewPlain: ואתה בן אדם עשה לך כלי גולה וגלה יומם לעיניהם וגלית ממקומך אל מקום אחר לעיניהם אולי יראו כי בית מרי המה
    kjvRefs:
    - Ezekiel 12:3
    kjvOsis:
    - Ezek.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.4
    scripture: tanakh
    name: Tanakh Ezekiel 12:4
    ref: Ezekiel 12:4
    book: Ezek
    section: neviim
    chapter: 12
    verse: 4
    ordinal: 13039
    text: And thou shalt bring forth thy stuff by day in their sight, as stuff for exile; and thou shalt go forth thyself at even in their sight, as when men go forth into exile.
    translation: JPS 1917
    original: וְהוֹצֵאתָ כֵלֶיךָ כִּכְלֵי גוֹלָה יוֹמָם לְעֵינֵיהֶם וְאַתָּה תֵּצֵא בָעֶרֶב לְעֵינֵיהֶם כְּמוֹצָאֵי גּוֹלָה׃
    hebrewPlain: והוצאת כליך ככלי גולה יומם לעיניהם ואתה תצא בערב לעיניהם כמוצאי גולה
    kjvRefs:
    - Ezekiel 12:4
    kjvOsis:
    - Ezek.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.5
    scripture: tanakh
    name: Tanakh Ezekiel 12:5
    ref: Ezekiel 12:5
    book: Ezek
    section: neviim
    chapter: 12
    verse: 5
    ordinal: 13040
    text: Dig thou through the wall in their sight, and carry out thereby.
    translation: JPS 1917
    original: לְעֵינֵיהֶם חֲתָר־לְךָ בַקִּיר וְהוֹצֵאתָ בּוֹ׃
    hebrewPlain: לעיניהם חתר לך בקיר והוצאת בו
    kjvRefs:
    - Ezekiel 12:5
    kjvOsis:
    - Ezek.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.6
    scripture: tanakh
    name: Tanakh Ezekiel 12:6
    ref: Ezekiel 12:6
    book: Ezek
    section: neviim
    chapter: 12
    verse: 6
    ordinal: 13041
    text: In their sight shalt thou bear it upon thy shoulder, and carry it forth in the darkness; thou shalt cover thy face, that thou see not the ground; for I have set thee for a sign unto the house of Israel.’
    translation: JPS 1917
    original: לְעֵינֵיהֶם עַל־כָּתֵף תִּשָּׂא בָּעֲלָטָה תוֹצִיא פָּנֶיךָ תְכַסֶּה וְלֹא תִרְאֶה אֶת־הָאָרֶץ כִּי־מוֹפֵת נְתַתִּיךָ לְבֵית יִשְׂרָאֵל׃
    hebrewPlain: לעיניהם על כתף תשא בעלטה תוציא פניך תכסה ולא תראה את הארץ כי מופת נתתיך לבית ישראל
    kjvRefs:
    - Ezekiel 12:6
    kjvOsis:
    - Ezek.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.7
    scripture: tanakh
    name: Tanakh Ezekiel 12:7
    ref: Ezekiel 12:7
    book: Ezek
    section: neviim
    chapter: 12
    verse: 7
    ordinal: 13042
    text: 'And I did so as I was commanded: I brought forth my stuff by day, as stuff for exile, and in the even I digged through the wall with my hand; I carried out in the darkness, and bore it upon my shoulder in their sight.'
    translation: JPS 1917
    original: וָאַעַשׂ כֵּן כַּאֲשֶׁר צֻוֵּיתִי כֵּלַי הוֹצֵאתִי כִּכְלֵי גוֹלָה יוֹמָם וּבָעֶרֶב חָתַרְתִּי־לִי בַקִּיר בְּיָד בָּעֲלָטָה הוֹצֵאתִי עַל־כָּתֵף נָשָׂאתִי לְעֵינֵיהֶם׃
    hebrewPlain: ואעש כן כאשר צויתי כלי הוצאתי ככלי גולה יומם ובערב חתרתי לי בקיר ביד בעלטה הוצאתי על כתף נשאתי לעיניהם
    kjvRefs:
    - Ezekiel 12:7
    kjvOsis:
    - Ezek.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.8
    scripture: tanakh
    name: Tanakh Ezekiel 12:8
    ref: Ezekiel 12:8
    book: Ezek
    section: neviim
    chapter: 12
    verse: 8
    ordinal: 13043
    text: 'And in the morning came the word of the LORD unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי בַּבֹּקֶר לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי בבקר לאמר
    kjvRefs:
    - Ezekiel 12:8
    kjvOsis:
    - Ezek.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.9
    scripture: tanakh
    name: Tanakh Ezekiel 12:9
    ref: Ezekiel 12:9
    book: Ezek
    section: neviim
    chapter: 12
    verse: 9
    ordinal: 13044
    text: '’Son of man, hath not the house of Israel, the rebellious house, said unto thee: What doest thou?'
    translation: JPS 1917
    original: בֶּן־אָדָם הֲלֹא אָמְרוּ אֵלֶיךָ בֵּית יִשְׂרָאֵל בֵּית הַמֶּרִי מָה אַתָּה עֹשֶׂה׃
    hebrewPlain: בן אדם הלא אמרו אליך בית ישראל בית המרי מה אתה עשה
    kjvRefs:
    - Ezekiel 12:9
    kjvOsis:
    - Ezek.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.10
    scripture: tanakh
    name: Tanakh Ezekiel 12:10
    ref: Ezekiel 12:10
    book: Ezek
    section: neviim
    chapter: 12
    verse: 10
    ordinal: 13045
    text: 'Say thou unto them: Thus saith the Lord GOD: Concerning the prince, even this burden, in Jerusalem, and all the house of Israel among whom they are,'
    translation: JPS 1917
    original: אֱמֹר אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהֹוִה הַנָּשִׂיא הַמַּשָּׂא הַזֶּה בִּירוּשָׁלִַם וְכָל־בֵּית יִשְׂרָאֵל אֲשֶׁר־הֵמָּה בְתוֹכָם׃
    hebrewPlain: אמר אליהם כה אמר אדני יהוה הנשיא המשא הזה בירושלם וכל בית ישראל אשר המה בתוכם
    kjvRefs:
    - Ezekiel 12:10
    kjvOsis:
    - Ezek.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.11
    scripture: tanakh
    name: Tanakh Ezekiel 12:11
    ref: Ezekiel 12:11
    book: Ezek
    section: neviim
    chapter: 12
    verse: 11
    ordinal: 13046
    text: 'say: I am your sign: like as I have done, so shall it be done unto them—they shall go into exile, into captivity.'
    translation: JPS 1917
    original: אֱמֹר אֲנִי מוֹפֶתְכֶם כַּאֲשֶׁר עָשִׂיתִי כֵּן יֵעָשֶׂה לָהֶם בַּגּוֹלָה בַשְּׁבִי יֵלֵכוּ׃
    hebrewPlain: אמר אני מופתכם כאשר עשיתי כן יעשה להם בגולה בשבי ילכו
    kjvRefs:
