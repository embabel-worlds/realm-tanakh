  data:
    osis: Ezek.18.6
    scripture: tanakh
    name: Tanakh Ezekiel 18:6
    ref: Ezekiel 18:6
    book: Ezek
    section: neviim
    chapter: 18
    verse: 6
    ordinal: 13210
    text: and hath not eaten upon the mountains, neither hath lifted up his eyes to the idols of the house of Israel, neither hath defiled his neighbour’s wife, neither hath come near to a woman in her impurity;
    translation: JPS 1917
    original: אֶל־הֶהָרִים לֹא אָכָל וְעֵינָיו לֹא נָשָׂא אֶל־גִּלּוּלֵי בֵּית יִשְׂרָאֵל וְאֶת־אֵשֶׁת רֵעֵהוּ לֹא טִמֵּא וְאֶל־אִשָּׁה נִדָּה לֹא יִקְרָב׃
    hebrewPlain: אל ההרים לא אכל ועיניו לא נשא אל גלולי בית ישראל ואת אשת רעהו לא טמא ואל אשה נדה לא יקרב
    kjvRefs:
    - Ezekiel 18:6
    kjvOsis:
    - Ezek.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.7
    scripture: tanakh
    name: Tanakh Ezekiel 18:7
    ref: Ezekiel 18:7
    book: Ezek
    section: neviim
    chapter: 18
    verse: 7
    ordinal: 13211
    text: and hath not wronged any, but hath restored his pledge for a debt, hath taken nought by robbery, hath given his bread to the hungry, and hath covered the naked with a garment;
    translation: JPS 1917
    original: וְאִישׁ לֹא יוֹנֶה חֲבֹלָתוֹ חוֹב יָשִׁיב גְּזֵלָה לֹא יִגְזֹל לַחְמוֹ לְרָעֵב יִתֵּן וְעֵירֹם יְכַסֶּה־בָּגֶד׃
    hebrewPlain: ואיש לא יונה חבלתו חוב ישיב גזלה לא יגזל לחמו לרעב יתן ועירם יכסה בגד
    kjvRefs:
    - Ezekiel 18:7
    kjvOsis:
    - Ezek.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
