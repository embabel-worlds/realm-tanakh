  data:
    osis: Ezek.21.14
    scripture: tanakh
    name: Tanakh Ezekiel 21:14
    ref: Ezekiel 21:14
    book: Ezek
    section: neviim
    chapter: 21
    verse: 14
    ordinal: 13308
    text: '’Son of man, prophesy, and say: Thus saith the LORD: Say: A sword, a sword, it is sharpened, And also furbished:'
    translation: JPS 1917
    original: בֶּן־אָדָם הִנָּבֵא וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי אֱמֹר חֶרֶב חֶרֶב הוּחַדָּה וְגַם־מְרוּטָה׃
    hebrewPlain: בן אדם הנבא ואמרת כה אמר אדני אמר חרב חרב הוחדה וגם מרוטה
    kjvRefs:
    - Ezekiel 21:9
    kjvOsis:
    - Ezek.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.15
    scripture: tanakh
    name: Tanakh Ezekiel 21:15
    ref: Ezekiel 21:15
    book: Ezek
    section: neviim
    chapter: 21
    verse: 15
    ordinal: 13309
    text: It is sharpened that it may make a sore slaughter, It is furbished that it may glitter— Or shall we make mirth?— Against the rod of My son, contemning every tree.
    translation: JPS 1917
    original: לְמַעַן טְבֹחַ טֶבַח הוּחַדָּה לְמַעַן־הֱיֵה־לָהּ בָּרָק מֹרָטָּה אוֹ נָשִׂישׂ שֵׁבֶט בְּנִי מֹאֶסֶת כָּל־עֵץ׃
    hebrewPlain: למען טבח טבח הוחדה למען היה לה ברק מרטה או נשיש שבט בני מאסת כל עץ
    kjvRefs:
    - Ezekiel 21:10
    kjvOsis:
    - Ezek.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.16
    scripture: tanakh
    name: Tanakh Ezekiel 21:16
    ref: Ezekiel 21:16
    book: Ezek
    section: neviim
    chapter: 21
    verse: 16
    ordinal: 13310
    text: And it is given to be furbished, That it may be handled; The sword, it is sharpened, Yea, it is furbished, To give it into the hand of the slayer.
    translation: JPS 1917
    original: וַיִּתֵּן אֹתָהּ לְמָרְטָה לִתְפֹּשׂ בַּכָּף הִיא־הוּחַדָּה חֶרֶב וְהִיא מֹרָטָּה לָתֵת אוֹתָהּ בְּיַד־הוֹרֵג׃
    hebrewPlain: ויתן אתה למרטה לתפש בכף היא הוחדה חרב והיא מרטה לתת אותה ביד הורג
    kjvRefs:
    - Ezekiel 21:11
    kjvOsis:
    - Ezek.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.17
    scripture: tanakh
    name: Tanakh Ezekiel 21:17
    ref: Ezekiel 21:17
    book: Ezek
    section: neviim
    chapter: 21
    verse: 17
    ordinal: 13311
    text: Cry and wail, son of man; for it is upon My people, it is upon all the princes of Israel; they are thrust down to the sword with My people; smite therefore upon thy thigh.
    translation: JPS 1917
    original: זְעַק וְהֵילֵל בֶּן־אָדָם כִּי־הִיא הָיתָה בְעַמִּי הִיא בְּכָל־נְשִׂיאֵי יִשְׂרָאֵל מְגוּרֵי אֶל־חֶרֶב הָיוּ אֶת־עַמִּי לָכֵן סְפֹק אֶל־יָרֵךְ׃
    hebrewPlain: זעק והילל בן אדם כי היא היתה בעמי היא בכל נשיאי ישראל מגורי אל חרב היו את עמי לכן ספק אל ירך
    kjvRefs:
