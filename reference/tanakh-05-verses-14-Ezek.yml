    ref: Ezekiel 25:3
    book: Ezek
    section: neviim
    chapter: 25
    verse: 3
    ordinal: 13441
    text: 'and say unto the children of Ammon: Hear the word of the Lord GOD: Thus saith the Lord GOD: Because thou saidst: Aha! against My sanctuary, when it was profaned, and against the land of Israel, when it was made desolate, and against the house of Judah, when they went into captivity;'
    translation: JPS 1917
    original: וְאָמַרְתָּ לִבְנֵי עַמּוֹן שִׁמְעוּ דְּבַר־אֲדֹנָי יְהוִה כֹּה־אָמַר אֲדֹנָי יְהוִה יַעַן אָמְרֵךְ הֶאָח אֶל־מִקְדָּשִׁי כִי־נִחָל וְאֶל־אַדְמַת יִשְׂרָאֵל כִּי נָשַׁמָּה וְאֶל־בֵּית יְהוּדָה כִּי הָלְכוּ בַּגּוֹלָה׃
    hebrewPlain: ואמרת לבני עמון שמעו דבר אדני יהוה כה אמר אדני יהוה יען אמרך האח אל מקדשי כי נחל ואל אדמת ישראל כי נשמה ואל בית יהודה כי הלכו בגולה
    kjvRefs:
    - Ezekiel 25:3
    kjvOsis:
    - Ezek.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.4
    scripture: tanakh
    name: Tanakh Ezekiel 25:4
    ref: Ezekiel 25:4
    book: Ezek
    section: neviim
    chapter: 25
    verse: 4
    ordinal: 13442
    text: therefore, behold, I will deliver thee to the children of the east for a possession, and they shall set their encampments in thee, and make their dwellings in thee; they shall eat thy fruit, and they shall drink thy milk.
    translation: JPS 1917
    original: לָכֵן הִנְנִי נֹתְנָךְ לִבְנֵי־קֶדֶם לְמוֹרָשָׁה וְיִשְּׁבוּ טִירוֹתֵיהֶם בָּךְ וְנָתְנוּ בָךְ מִשְׁכְּנֵיהֶם הֵמָּה יֹאכְלוּ פִרְיֵךְ וְהֵמָּה יִשְׁתּוּ חֲלָבֵךְ׃
    hebrewPlain: לכן הנני נתנך לבני קדם למורשה וישבו טירותיהם בך ונתנו בך משכניהם המה יאכלו פריך והמה ישתו חלבך
    kjvRefs:
    - Ezekiel 25:4
    kjvOsis:
    - Ezek.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.5
    scripture: tanakh
    name: Tanakh Ezekiel 25:5
    ref: Ezekiel 25:5
    book: Ezek
    section: neviim
    chapter: 25
    verse: 5
    ordinal: 13443
    text: And I will make Rabbah a pasture for camels, and the children of Ammon a couching-place for flocks; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־רַבָּה לִנְוֵה גְמַלִּים וְאֶת־בְּנֵי עַמּוֹן לְמִרְבַּץ־צֹאן וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונתתי את רבה לנוה גמלים ואת בני עמון למרבץ צאן וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 25:5
    kjvOsis:
    - Ezek.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.6
    scripture: tanakh
    name: Tanakh Ezekiel 25:6
    ref: Ezekiel 25:6
    book: Ezek
    section: neviim
    chapter: 25
    verse: 6
    ordinal: 13444
    text: 'For thus saith the Lord GOD: Because thou hast clapped thy hands, and stamped with the feet, and rejoiced with all the disdain of thy soul against the land of Israel;'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה יַעַן מַחְאֲךָ יָד וְרַקְעֲךָ בְּרָגֶל וַתִּשְׂמַח בְּכָל־שָׁאטְךָ בְּנֶפֶשׁ אֶל־אַדְמַת יִשְׂרָאֵל׃
    hebrewPlain: כי כה אמר אדני יהוה יען מחאך יד ורקעך ברגל ותשמח בכל שאטך בנפש אל אדמת ישראל
    kjvRefs:
    - Ezekiel 25:6
    kjvOsis:
    - Ezek.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.7
    scripture: tanakh
    name: Tanakh Ezekiel 25:7
    ref: Ezekiel 25:7
    book: Ezek
    section: neviim
    chapter: 25
    verse: 7
    ordinal: 13445
    text: therefore, behold, I stretch out My hand upon thee, and will deliver thee for a spoil to the nations; and I will cut thee off from the peoples, and I will cause thee to perish out of the countries; I will destroy thee, and thou shalt know that I am the LORD.
    translation: JPS 1917
    original: לָכֵן הִנְנִי נָטִיתִי אֶת־יָדִי עָלֶיךָ וּנְתַתִּיךָ־לבג [לְבַז] לַגּוֹיִם וְהִכְרַתִּיךָ מִן־הָעַמִּים וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת אַשְׁמִידְךָ וְיָדַעְתָּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: לכן הנני נטיתי את ידי עליך ונתתיך לבג [לבז] לגוים והכרתיך מן העמים והאבדתיך מן הארצות אשמידך וידעת כי אני יהוה
    kjvRefs:
    - Ezekiel 25:7
    kjvOsis:
    - Ezek.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.8
    scripture: tanakh
    name: Tanakh Ezekiel 25:8
    ref: Ezekiel 25:8
    book: Ezek
    section: neviim
    chapter: 25
    verse: 8
    ordinal: 13446
    text: 'Thus saith the Lord GOD: Because that Moab and Seir do say: Behold, the house of Judah is like unto all the nations,'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן אֲמֹר מוֹאָב וְשֵׂעִיר הִנֵּה כְּכָל־הַגּוֹיִם בֵּית יְהוּדָה׃
    hebrewPlain: כה אמר אדני יהוה יען אמר מואב ושעיר הנה ככל הגוים בית יהודה
    kjvRefs:
    - Ezekiel 25:8
    kjvOsis:
    - Ezek.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.9
    scripture: tanakh
    name: Tanakh Ezekiel 25:9
    ref: Ezekiel 25:9
    book: Ezek
    section: neviim
    chapter: 25
    verse: 9
    ordinal: 13447
    text: therefore, behold, I will open the flank of Moab on the side of the cities, on the side of his cities which are on his frontiers, the beauteous country of Beth-jeshimoth, Baal-meon, and Kiriathaim,
    translation: JPS 1917
    original: לָכֵן הִנְנִי פֹתֵחַ אֶת־כֶּתֶף מוֹאָב מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ צְבִי אֶרֶץ בֵּית הַיְשִׁימֹת בַּעַל מְעוֹן וקריתמה [וְקִרְיָתָיְמָה׃]
    hebrewPlain: לכן הנני פתח את כתף מואב מהערים מעריו מקצהו צבי ארץ בית הישימת בעל מעון וקריתמה [וקריתימה]
    kjvRefs:
    - Ezekiel 25:9
    kjvOsis:
    - Ezek.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.10
    scripture: tanakh
    name: Tanakh Ezekiel 25:10
    ref: Ezekiel 25:10
    book: Ezek
    section: neviim
    chapter: 25
    verse: 10
    ordinal: 13448
    text: together with the children of Ammon, unto the children of the east, and I will give them for a possession, that the children of Ammon may not be remembered among the nations;
    translation: JPS 1917
    original: לִבְנֵי־קֶדֶם עַל־בְּנֵי עַמּוֹן וּנְתַתִּיהָ לְמוֹרָשָׁה לְמַעַן לֹא־תִזָּכֵר בְּנֵי־עַמּוֹן בַּגּוֹיִם׃
    hebrewPlain: לבני קדם על בני עמון ונתתיה למורשה למען לא תזכר בני עמון בגוים
    kjvRefs:
    - Ezekiel 25:10
    kjvOsis:
    - Ezek.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.11
    scripture: tanakh
    name: Tanakh Ezekiel 25:11
    ref: Ezekiel 25:11
    book: Ezek
    section: neviim
    chapter: 25
    verse: 11
    ordinal: 13449
    text: and I will execute judgments upon Moab; and they shall know that I am the LORD.
    translation: JPS 1917
    original: וּבְמוֹאָב אֶעֱשֶׂה שְׁפָטִים וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ובמואב אעשה שפטים וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 25:11
    kjvOsis:
    - Ezek.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.12
    scripture: tanakh
    name: Tanakh Ezekiel 25:12
    ref: Ezekiel 25:12
    book: Ezek
    section: neviim
    chapter: 25
    verse: 12
    ordinal: 13450
    text: 'Thus saith the Lord GOD: Because that Edom hath dealt against the house of Judah by taking vengeance, and hath greatly offended, and revenged himself upon them;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן עֲשׂוֹת אֱדוֹם בִּנְקֹם נָקָם לְבֵית יְהוּדָה וַיֶּאְשְׁמוּ אָשׁוֹם וְנִקְּמוּ בָהֶם׃
    hebrewPlain: כה אמר אדני יהוה יען עשות אדום בנקם נקם לבית יהודה ויאשמו אשום ונקמו בהם
    kjvRefs:
    - Ezekiel 25:12
    kjvOsis:
    - Ezek.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.13
    scripture: tanakh
    name: Tanakh Ezekiel 25:13
    ref: Ezekiel 25:13
    book: Ezek
    section: neviim
    chapter: 25
    verse: 13
    ordinal: 13451
    text: 'therefore thus saith the Lord GOD: I will stretch out My hand upon Edom, and will cut off man and beast from it; and I will make it desolate from Teman, even unto Dedan shall they fall by the sword.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה וְנָטִתִי יָדִי עַל־אֱדוֹם וְהִכְרַתִּי מִמֶּנָּה אָדָם וּבְהֵמָה וּנְתַתִּיהָ חָרְבָּה מִתֵּימָן וּדְדָנֶה בַּחֶרֶב יִפֹּלוּ׃
    hebrewPlain: לכן כה אמר אדני יהוה ונטתי ידי על אדום והכרתי ממנה אדם ובהמה ונתתיה חרבה מתימן ודדנה בחרב יפלו
    kjvRefs:
    - Ezekiel 25:13
    kjvOsis:
    - Ezek.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.14
    scripture: tanakh
    name: Tanakh Ezekiel 25:14
    ref: Ezekiel 25:14
    book: Ezek
    section: neviim
    chapter: 25
    verse: 14
    ordinal: 13452
    text: And I will lay My vengeance upon Edom by the hand of My people Israel; and they shall do in Edom according to Mine anger and according to My fury; and they shall know my vengeance, saith the Lord GOD.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־נִקְמָתִי בֶּאֱדוֹם בְּיַד עַמִּי יִשְׂרָאֵל וְעָשׂוּ בֶאֱדוֹם כְּאַפִּי וְכַחֲמָתִי וְיָדְעוּ אֶת־נִקְמָתִי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ונתתי את נקמתי באדום ביד עמי ישראל ועשו באדום כאפי וכחמתי וידעו את נקמתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 25:14
    kjvOsis:
    - Ezek.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.15
    scripture: tanakh
    name: Tanakh Ezekiel 25:15
    ref: Ezekiel 25:15
    book: Ezek
    section: neviim
    chapter: 25
    verse: 15
    ordinal: 13453
    text: 'Thus saith the Lord GOD: Because the Philistines have dealt by revenge, and have taken vengeance with disdain of soul to destroy, for the old hatred;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה וַיִּנָּקְמוּ נָקָם בִּשְׁאָט בְּנֶפֶשׁ לְמַשְׁחִית אֵיבַת עוֹלָם׃
    hebrewPlain: כה אמר אדני יהוה יען עשות פלשתים בנקמה וינקמו נקם בשאט בנפש למשחית איבת עולם
    kjvRefs:
    - Ezekiel 25:15
    kjvOsis:
    - Ezek.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.16
    scripture: tanakh
    name: Tanakh Ezekiel 25:16
    ref: Ezekiel 25:16
    book: Ezek
    section: neviim
    chapter: 25
    verse: 16
    ordinal: 13454
    text: 'therefore thus saith the Lord GOD: Behold, I will stretch out My hand upon the Philistines, and I will cut off the Cherethites, and destroy the remnant of the sea-coast.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי נוֹטֶה יָדִי עַל־פְּלִשְׁתִּים וְהִכְרַתִּי אֶת־כְּרֵתִים וְהַאֲבַדְתִּי אֶת־שְׁאֵרִית חוֹף הַיָּם׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני נוטה ידי על פלשתים והכרתי את כרתים והאבדתי את שארית חוף הים
    kjvRefs:
    - Ezekiel 25:16
    kjvOsis:
    - Ezek.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.25.17
    scripture: tanakh
    name: Tanakh Ezekiel 25:17
    ref: Ezekiel 25:17
    book: Ezek
    section: neviim
    chapter: 25
    verse: 17
    ordinal: 13455
    text: And I will execute great vengeance upon them with furious rebukes; and they shall know that I am the LORD, when I shall lay My vengeance upon them.’
    translation: JPS 1917
    original: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת בְּתוֹכְחוֹת חֵמָה וְיָדְעוּ כִּי־אֲנִי יְהוָה בְּתִתִּי אֶת־נִקְמָתִי בָּם׃
    hebrewPlain: ועשיתי בם נקמות גדלות בתוכחות חמה וידעו כי אני יהוה בתתי את נקמתי בם
    kjvRefs:
    - Ezekiel 25:17
    kjvOsis:
    - Ezek.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.25
- type: TanakhVerse
  data:
    osis: Ezek.26.1
    scripture: tanakh
    name: Tanakh Ezekiel 26:1
    ref: Ezekiel 26:1
    book: Ezek
    section: neviim
    chapter: 26
    verse: 1
    ordinal: 13456
    text: 'And it came to pass in the eleventh year, in the first day of the month, that the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי בְּעַשְׁתֵּי־עֶשְׂרֵה שָׁנָה בְּאֶחָד לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי בעשתי עשרה שנה באחד לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 26:1
    kjvOsis:
    - Ezek.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.2
    scripture: tanakh
    name: Tanakh Ezekiel 26:2
    ref: Ezekiel 26:2
    book: Ezek
    section: neviim
    chapter: 26
    verse: 2
    ordinal: 13457
    text: '’Son of man, because that Tyre hath said against Jerusalem: Aha, she is broken that was the gate of the peoples; She is turned unto me; I shall be filled with her that is laid waste;'
    translation: JPS 1917
    original: בֶּן־אָדָם יַעַן אֲשֶׁר־אָמְרָה צֹּר עַל־יְרוּשָׁלִַם הֶאָח נִשְׁבְּרָה דַּלְתוֹת הָעַמִּים נָסֵבָּה אֵלָי אִמָּלְאָה הָחֳרָבָה׃
    hebrewPlain: בן אדם יען אשר אמרה צר על ירושלם האח נשברה דלתות העמים נסבה אלי אמלאה החרבה
    kjvRefs:
    - Ezekiel 26:2
    kjvOsis:
    - Ezek.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.3
    scripture: tanakh
    name: Tanakh Ezekiel 26:3
    ref: Ezekiel 26:3
    book: Ezek
    section: neviim
    chapter: 26
    verse: 3
    ordinal: 13458
    text: 'Therefore thus saith the Lord GOD: Behold, I am against thee, O Tyre, And will cause many nations to come up against thee, As the sea causeth its waves to come up.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי עָלַיִךְ צֹר וְהַעֲלֵיתִי עָלַיִךְ גּוֹיִם רַבִּים כְּהַעֲלוֹת הַיָּם לְגַלָּיו׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני עליך צר והעליתי עליך גוים רבים כהעלות הים לגליו
    kjvRefs:
    - Ezekiel 26:3
    kjvOsis:
    - Ezek.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.4
    scripture: tanakh
    name: Tanakh Ezekiel 26:4
    ref: Ezekiel 26:4
    book: Ezek
    section: neviim
    chapter: 26
    verse: 4
    ordinal: 13459
    text: And they shall destroy the walls of Tyre, And break down her towers; I will also scrape her dust from her, And make her a bare rock.
    translation: JPS 1917
    original: וְשִׁחֲתוּ חֹמוֹת צֹר וְהָרְסוּ מִגְדָּלֶיהָ וְסִחֵיתִי עֲפָרָהּ מִמֶּנָּה וְנָתַתִּי אוֹתָהּ לִצְחִיחַ סָלַע׃
    hebrewPlain: ושחתו חמות צר והרסו מגדליה וסחיתי עפרה ממנה ונתתי אותה לצחיח סלע
    kjvRefs:
    - Ezekiel 26:4
    kjvOsis:
    - Ezek.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.5
    scripture: tanakh
    name: Tanakh Ezekiel 26:5
    ref: Ezekiel 26:5
    book: Ezek
    section: neviim
    chapter: 26
    verse: 5
    ordinal: 13460
    text: She shall be a place for the spreading of nets In the midst of the sea; For I have spoken it, saith the Lord GOD; And she shall become a spoil to the nations.
    translation: JPS 1917
    original: מִשְׁטַח חֲרָמִים תִּהְיֶה בְּתוֹךְ הַיָּם כִּי אֲנִי דִבַּרְתִּי נְאֻם אֲדֹנָי יְהוִה וְהָיְתָה לְבַז לַגּוֹיִם׃
    hebrewPlain: משטח חרמים תהיה בתוך הים כי אני דברתי נאם אדני יהוה והיתה לבז לגוים
    kjvRefs:
    - Ezekiel 26:5
    kjvOsis:
    - Ezek.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.6
    scripture: tanakh
    name: Tanakh Ezekiel 26:6
    ref: Ezekiel 26:6
    book: Ezek
    section: neviim
    chapter: 26
    verse: 6
    ordinal: 13461
    text: And her daughters that are in the field Shall be slain with the sword; And they shall know that I am the LORD.
    translation: JPS 1917
    original: וּבְנוֹתֶיהָ אֲשֶׁר בַּשָּׂדֶה בַּחֶרֶב תֵּהָרַגְנָה וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ובנותיה אשר בשדה בחרב תהרגנה וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 26:6
    kjvOsis:
    - Ezek.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.7
    scripture: tanakh
    name: Tanakh Ezekiel 26:7
    ref: Ezekiel 26:7
    book: Ezek
    section: neviim
    chapter: 26
    verse: 7
    ordinal: 13462
    text: 'For thus saith the Lord GOD: Behold, I will bring upon Tyre Nebuchadrezzar king of Babylon, king of kings, from the north, with horses, and with chariots, and with horsemen, and a company, and much people.'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה הִנְנִי מֵבִיא אֶל־צֹר נְבוּכַדְרֶאצַּר מֶלֶךְ־בָּבֶל מִצָּפוֹן מֶלֶךְ מְלָכִים בְּסוּס וּבְרֶכֶב וּבְפָרָשִׁים וְקָהָל וְעַם־רָב׃
    hebrewPlain: כי כה אמר אדני יהוה הנני מביא אל צר נבוכדראצר מלך בבל מצפון מלך מלכים בסוס וברכב ובפרשים וקהל ועם רב
    kjvRefs:
    - Ezekiel 26:7
    kjvOsis:
    - Ezek.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.8
    scripture: tanakh
    name: Tanakh Ezekiel 26:8
    ref: Ezekiel 26:8
    book: Ezek
    section: neviim
    chapter: 26
    verse: 8
    ordinal: 13463
    text: He shall slay with the sword Thy daughters in the field; And he shall make forts against thee, And cast up a mound against thee, And set up bucklers against thee.
    translation: JPS 1917
    original: בְּנוֹתַיִךְ בַּשָּׂדֶה בַּחֶרֶב יַהֲרֹג וְנָתַן עָלַיִךְ דָּיֵק וְשָׁפַךְ עָלַיִךְ סֹלְלָה וְהֵקִים עָלַיִךְ צִנָּה׃
    hebrewPlain: בנותיך בשדה בחרב יהרג ונתן עליך דיק ושפך עליך סללה והקים עליך צנה
    kjvRefs:
    - Ezekiel 26:8
    kjvOsis:
    - Ezek.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.9
    scripture: tanakh
    name: Tanakh Ezekiel 26:9
    ref: Ezekiel 26:9
    book: Ezek
    section: neviim
    chapter: 26
    verse: 9
    ordinal: 13464
    text: And he shall set his battering engines Against thy walls, And with his axes He shall break down thy towers.
    translation: JPS 1917
    original: וּמְחִי קָבָלּוֹ יִתֵּן בְּחֹמוֹתָיִךְ וּמִגְדְּלֹתַיִךְ יִתֹּץ בְּחַרְבוֹתָיו׃
    hebrewPlain: ומחי קבלו יתן בחמותיך ומגדלתיך יתץ בחרבותיו
    kjvRefs:
    - Ezekiel 26:9
    kjvOsis:
    - Ezek.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.10
    scripture: tanakh
    name: Tanakh Ezekiel 26:10
    ref: Ezekiel 26:10
    book: Ezek
    section: neviim
    chapter: 26
    verse: 10
    ordinal: 13465
    text: By reason of the abundance of his horses Their dust shall cover thee; At the noise of the horsemen, And of the wheels, and of the chariots, Thy walls shall shake, When he shall enter into thy gates, As men enter into a city Wherein is made a breach.
    translation: JPS 1917
    original: מִשִּׁפְעַת סוּסָיו יְכַסֵּךְ אֲבָקָם מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב תִּרְעַשְׁנָה חוֹמוֹתַיִךְ בְּבֹאוֹ בִּשְׁעָרַיִךְ כִּמְבוֹאֵי עִיר מְבֻקָּעָה׃
    hebrewPlain: משפעת סוסיו יכסך אבקם מקול פרש וגלגל ורכב תרעשנה חומותיך בבאו בשעריך כמבואי עיר מבקעה
    kjvRefs:
    - Ezekiel 26:10
    kjvOsis:
    - Ezek.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.11
    scripture: tanakh
    name: Tanakh Ezekiel 26:11
    ref: Ezekiel 26:11
    book: Ezek
    section: neviim
    chapter: 26
    verse: 11
    ordinal: 13466
    text: With the hoofs of his horses Shall he tread down all thy streets; He shall slay thy people with the sword, And the pillars of thy strength Shall go down to the ground.
    translation: JPS 1917
    original: בְּפַרְסוֹת סוּסָיו יִרְמֹס אֶת־כָּל־חוּצוֹתָיִךְ עַמֵּךְ בַּחֶרֶב יַהֲרֹג וּמַצְּבוֹת עֻזֵּךְ לָאָרֶץ תֵּרֵד׃
    hebrewPlain: בפרסות סוסיו ירמס את כל חוצותיך עמך בחרב יהרג ומצבות עזך לארץ תרד
    kjvRefs:
    - Ezekiel 26:11
    kjvOsis:
    - Ezek.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.12
    scripture: tanakh
    name: Tanakh Ezekiel 26:12
    ref: Ezekiel 26:12
    book: Ezek
    section: neviim
    chapter: 26
    verse: 12
    ordinal: 13467
    text: And they shall make a spoil of thy riches, And make a prey of thy merchandise; And they shall break down thy walls, And destroy the houses of thy delight; And thy stones and thy timber and thy dust Shall they lay in the midst of the waters.
    translation: JPS 1917
    original: וְשָׁלְלוּ חֵילֵךְ וּבָזְזוּ רְכֻלָּתֵךְ וְהָרְסוּ חוֹמוֹתַיִךְ וּבָתֵּי חֶמְדָּתֵךְ יִתֹּצוּ וַאֲבָנַיִךְ וְעֵצַיִךְ וַעֲפָרֵךְ בְּתוֹךְ מַיִם יָשִׂימוּ׃
    hebrewPlain: ושללו חילך ובזזו רכלתך והרסו חומותיך ובתי חמדתך יתצו ואבניך ועציך ועפרך בתוך מים ישימו
    kjvRefs:
    - Ezekiel 26:12
    kjvOsis:
    - Ezek.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.13
    scripture: tanakh
    name: Tanakh Ezekiel 26:13
    ref: Ezekiel 26:13
    book: Ezek
    section: neviim
    chapter: 26
    verse: 13
    ordinal: 13468
    text: And I will cause the noise of thy songs to cease, And the sound of thy harps shall be no more heard.
    translation: JPS 1917
    original: וְהִשְׁבַּתִּי הֲמוֹן שִׁירָיִךְ וְקוֹל כִּנּוֹרַיִךְ לֹא יִשָּׁמַע עוֹד׃
    hebrewPlain: והשבתי המון שיריך וקול כנוריך לא ישמע עוד
    kjvRefs:
    - Ezekiel 26:13
    kjvOsis:
    - Ezek.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.14
    scripture: tanakh
    name: Tanakh Ezekiel 26:14
    ref: Ezekiel 26:14
    book: Ezek
    section: neviim
    chapter: 26
    verse: 14
    ordinal: 13469
    text: And I will make thee a bare rock; Thou shalt be a place for the spreading of nets, Thou shalt be built no more; For I the LORD have spoken, Saith the Lord GOD.
    translation: JPS 1917
    original: וּנְתַתִּיךְ לִצְחִיחַ סֶלַע מִשְׁטַח חֲרָמִים תִּהְיֶה לֹא תִבָּנֶה עוֹד כִּי אֲנִי יְהוָה דִּבַּרְתִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ונתתיך לצחיח סלע משטח חרמים תהיה לא תבנה עוד כי אני יהוה דברתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 26:14
    kjvOsis:
    - Ezek.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.15
    scripture: tanakh
    name: Tanakh Ezekiel 26:15
    ref: Ezekiel 26:15
    book: Ezek
    section: neviim
    chapter: 26
    verse: 15
    ordinal: 13470
    text: 'Thus saith the Lord GOD to Tyre: Shall not the isles shake at the sound of thy fall, when the wounded groan, when the slaughter is made in the midst of thee?'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה לְצוֹר הֲלֹא מִקּוֹל מַפַּלְתֵּךְ בֶּאֱנֹק חָלָל בֵּהָרֵג הֶרֶג בְּתוֹכֵךְ יִרְעֲשׁוּ הָאִיִּים׃
    hebrewPlain: כה אמר אדני יהוה לצור הלא מקול מפלתך באנק חלל בהרג הרג בתוכך ירעשו האיים
    kjvRefs:
    - Ezekiel 26:15
    kjvOsis:
    - Ezek.26.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.16
    scripture: tanakh
    name: Tanakh Ezekiel 26:16
    ref: Ezekiel 26:16
    book: Ezek
    section: neviim
    chapter: 26
    verse: 16
    ordinal: 13471
    text: Then all the princes of the sea shall come down from their thrones, and lay away their robes, and strip off their richly woven garments; they shall clothe themselves with trembling; they shall sit upon the ground, and shall tremble every moment, and be appalled at thee. .
    translation: JPS 1917
    original: וְיָרְדוּ מֵעַל כִּסְאוֹתָם כֹּל נְשִׂיאֵי הַיָּם וְהֵסִירוּ אֶת־מְעִילֵיהֶם וְאֶת־בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ חֲרָדוֹת יִלְבָּשׁוּ עַל־הָאָרֶץ יֵשֵׁבוּ וְחָרְדוּ לִרְגָעִים וְשָׁמְמוּ עָלָיִךְ׃
    hebrewPlain: וירדו מעל כסאותם כל נשיאי הים והסירו את מעיליהם ואת בגדי רקמתם יפשטו חרדות ילבשו על הארץ ישבו וחרדו לרגעים ושממו עליך
    kjvRefs:
    - Ezekiel 26:16
    kjvOsis:
    - Ezek.26.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.17
    scripture: tanakh
    name: Tanakh Ezekiel 26:17
    ref: Ezekiel 26:17
    book: Ezek
    section: neviim
    chapter: 26
    verse: 17
    ordinal: 13472
    text: 'And they shall take up a lamentation for thee, and say to thee: How art thou destroyed, that wast peopled from the seas, The renowned city, That wast strong in the sea, Thou and thy inhabitants, That caused your terror to be On all that inhabit the earth!'
    translation: JPS 1917
    original: וְנָשְׂאוּ עָלַיִךְ קִינָה וְאָמְרוּ לָךְ אֵיךְ אָבַדְתְּ נוֹשֶׁבֶת מִיַּמִּים הָעִיר הַהֻלָּלָה אֲשֶׁר הָיְתָה חֲזָקָה בַיָּם הִיא וְיֹשְׁבֶיהָ אֲשֶׁר־נָתְנוּ חִתִּיתָם לְכָל־יוֹשְׁבֶיהָ׃
    hebrewPlain: ונשאו עליך קינה ואמרו לך איך אבדת נושבת מימים העיר ההללה אשר היתה חזקה בים היא וישביה אשר נתנו חתיתם לכל יושביה
    kjvRefs:
    - Ezekiel 26:17
    kjvOsis:
    - Ezek.26.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.18
    scripture: tanakh
    name: Tanakh Ezekiel 26:18
    ref: Ezekiel 26:18
    book: Ezek
    section: neviim
    chapter: 26
    verse: 18
    ordinal: 13473
    text: Now shall the isles tremble In the day of thy fall; Yea, the isles that are in the sea Shall be affrighted at thy going out.
    translation: JPS 1917
    original: עַתָּה יֶחְרְדוּ הָאִיִּן יוֹם מַפַּלְתֵּךְ וְנִבְהֲלוּ הָאִיִּים אֲשֶׁר־בַּיָּם מִצֵּאתֵךְ׃
    hebrewPlain: עתה יחרדו האין יום מפלתך ונבהלו האיים אשר בים מצאתך
    kjvRefs:
    - Ezekiel 26:18
    kjvOsis:
    - Ezek.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.19
    scripture: tanakh
    name: Tanakh Ezekiel 26:19
    ref: Ezekiel 26:19
    book: Ezek
    section: neviim
    chapter: 26
    verse: 19
    ordinal: 13474
    text: 'For thus saith the Lord GOD: When I shall make thee a desolate city, like the cities that are not inhabited; when I shall bring up the deep upon thee, and the great waters shall cover thee;'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת כֶּעָרִים אֲשֶׁר לֹא־נוֹשָׁבוּ בְּהַעֲלוֹת עָלַיִךְ אֶת־תְּהוֹם וְכִסּוּךְ הַמַּיִם הָרַבִּים׃
    hebrewPlain: כי כה אמר אדני יהוה בתתי אתך עיר נחרבת כערים אשר לא נושבו בהעלות עליך את תהום וכסוך המים הרבים
    kjvRefs:
    - Ezekiel 26:19
    kjvOsis:
    - Ezek.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.20
    scripture: tanakh
    name: Tanakh Ezekiel 26:20
    ref: Ezekiel 26:20
    book: Ezek
    section: neviim
    chapter: 26
    verse: 20
    ordinal: 13475
    text: then will I bring thee down with them that descend into the pit, to the people of old time, and will make thee to dwell in the nether parts of the earth, like the places that are desolate of old, with them that go down to the pit, that thou be not inhabited; and I will set glory in the land of the living;
    translation: JPS 1917
    original: וְהוֹרַדְתִּיךְ אֶת־יוֹרְדֵי בוֹר אֶל־עַם עוֹלָם וְהוֹשַׁבְתִּיךְ בְּאֶרֶץ תַּחְתִּיּוֹת כָּחֳרָבוֹת מֵעוֹלָם אֶת־יוֹרְדֵי בוֹר לְמַעַן לֹא תֵשֵׁבִי וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים׃
    hebrewPlain: והורדתיך את יורדי בור אל עם עולם והושבתיך בארץ תחתיות כחרבות מעולם את יורדי בור למען לא תשבי ונתתי צבי בארץ חיים
    kjvRefs:
    - Ezekiel 26:20
    kjvOsis:
    - Ezek.26.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.26.21
    scripture: tanakh
    name: Tanakh Ezekiel 26:21
    ref: Ezekiel 26:21
    book: Ezek
    section: neviim
    chapter: 26
    verse: 21
    ordinal: 13476
    text: I will make thee a terror, and thou shalt be no more; though thou be sought for, yet shalt thou never be found again, saith the Lord GOD.’
    translation: JPS 1917
    original: בַּלָּהוֹת אֶתְּנֵךְ וְאֵינֵךְ וּתְבֻקְשִׁי וְלֹא־תִמָּצְאִי עוֹד לְעוֹלָם נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: בלהות אתנך ואינך ותבקשי ולא תמצאי עוד לעולם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 26:21
    kjvOsis:
    - Ezek.26.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.26
- type: TanakhVerse
  data:
    osis: Ezek.27.1
    scripture: tanakh
    name: Tanakh Ezekiel 27:1
    ref: Ezekiel 27:1
    book: Ezek
    section: neviim
    chapter: 27
    verse: 1
    ordinal: 13477
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 27:1
    kjvOsis:
    - Ezek.27.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.2
    scripture: tanakh
    name: Tanakh Ezekiel 27:2
    ref: Ezekiel 27:2
    book: Ezek
    section: neviim
    chapter: 27
    verse: 2
    ordinal: 13478
    text: ’And thou, son of man, take up a lamentation for Tyre,
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם שָׂא עַל־צֹר קִינָה׃
    hebrewPlain: ואתה בן אדם שא על צר קינה
    kjvRefs:
    - Ezekiel 27:2
    kjvOsis:
    - Ezek.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.3
    scripture: tanakh
    name: Tanakh Ezekiel 27:3
    ref: Ezekiel 27:3
    book: Ezek
    section: neviim
    chapter: 27
    verse: 3
    ordinal: 13479
    text: 'and say unto Tyre, that dwelleth at the entry of the sea, that is the merchant of the peoples unto many isles: Thus saith the Lord GOD: Thou, O Tyre, hast said: I am of perfect beauty.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לְצוֹר הישבתי [הַיֹּשֶׁבֶת] עַל־מְבוֹאֹת יָם רֹכֶלֶת הָעַמִּים אֶל־אִיִּים רַבִּים כֹּה אָמַר אֲדֹנָי יְהוִה צוֹר אַתְּ אָמַרְתְּ אֲנִי כְּלִילַת יֹפִי׃
    hebrewPlain: ואמרת לצור הישבתי [הישבת] על מבואת ים רכלת העמים אל איים רבים כה אמר אדני יהוה צור את אמרת אני כלילת יפי
    kjvRefs:
    - Ezekiel 27:3
    kjvOsis:
    - Ezek.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.4
    scripture: tanakh
    name: Tanakh Ezekiel 27:4
    ref: Ezekiel 27:4
    book: Ezek
    section: neviim
    chapter: 27
    verse: 4
    ordinal: 13480
    text: Thy borders are in the heart of the seas, Thy builders have perfected thy beauty.
    translation: JPS 1917
    original: בְּלֵב יַמִּים גְּבוּלָיִךְ בֹּנַיִךְ כָּלְלוּ יָפְיֵךְ׃
    hebrewPlain: בלב ימים גבוליך בניך כללו יפיך
    kjvRefs:
    - Ezekiel 27:4
    kjvOsis:
    - Ezek.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.5
    scripture: tanakh
    name: Tanakh Ezekiel 27:5
    ref: Ezekiel 27:5
    book: Ezek
    section: neviim
    chapter: 27
    verse: 5
    ordinal: 13481
    text: Of cypress-trees from Senir have they fashioned All thy planks; They have taken cedars from Lebanon To make masts for thee.
    translation: JPS 1917
    original: בְּרוֹשִׁים מִשְּׂנִיר בָּנוּ לָךְ אֵת כָּל־לֻחֹתָיִם אֶרֶז מִלְּבָנוֹן לָקָחוּ לַעֲשׂוֹת תֹּרֶן עָלָיִךְ׃
    hebrewPlain: ברושים משניר בנו לך את כל לחתים ארז מלבנון לקחו לעשות תרן עליך
    kjvRefs:
    - Ezekiel 27:5
    kjvOsis:
    - Ezek.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.6
    scripture: tanakh
    name: Tanakh Ezekiel 27:6
    ref: Ezekiel 27:6
    book: Ezek
    section: neviim
    chapter: 27
    verse: 6
    ordinal: 13482
    text: Of the oaks of Bashan Have they made thine oars; Thy deck have they made of ivory inlaid in larch, From the isles of the Kittites.
    translation: JPS 1917
    original: אַלּוֹנִים מִבָּשָׁן עָשׂוּ מִשּׁוֹטָיִךְ קַרְשֵׁךְ עָשׂוּ־שֵׁן בַּת־אֲשֻׁרִים מֵאִיֵּי כתים [כִּתִּיִּים׃]
    hebrewPlain: אלונים מבשן עשו משוטיך קרשך עשו שן בת אשרים מאיי כתים [כתיים]
    kjvRefs:
    - Ezekiel 27:6
    kjvOsis:
    - Ezek.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.7
    scripture: tanakh
    name: Tanakh Ezekiel 27:7
    ref: Ezekiel 27:7
    book: Ezek
    section: neviim
    chapter: 27
    verse: 7
    ordinal: 13483
    text: Of fine linen with richly woven work from Egypt Was thy sail, That it might be to thee for an ensign; Blue and purple from the isles of Elishah Was thine awning.
    translation: JPS 1917
    original: שֵׁשׁ־בְּרִקְמָה מִמִּצְרַיִם הָיָה מִפְרָשֵׂךְ לִהְיוֹת לָךְ לְנֵס תְּכֵלֶת וְאַרְגָּמָן מֵאִיֵּי אֱלִישָׁה הָיָה מְכַסֵּךְ׃
    hebrewPlain: שש ברקמה ממצרים היה מפרשך להיות לך לנס תכלת וארגמן מאיי אלישה היה מכסך
    kjvRefs:
    - Ezekiel 27:7
    kjvOsis:
    - Ezek.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.8
    scripture: tanakh
    name: Tanakh Ezekiel 27:8
    ref: Ezekiel 27:8
    book: Ezek
    section: neviim
    chapter: 27
    verse: 8
    ordinal: 13484
    text: The inhabitants of Sidon and Arvad Were thy rowers; Thy wise men, O Tyre, were in thee, They were thy pilots.
    translation: JPS 1917
    original: יֹשְׁבֵי צִידוֹן וְאַרְוַד הָיוּ שָׁטִים לָךְ חֲכָמַיִךְ צוֹר הָיוּ בָךְ הֵמָּה חֹבְלָיִךְ׃
    hebrewPlain: ישבי צידון וארוד היו שטים לך חכמיך צור היו בך המה חבליך
    kjvRefs:
    - Ezekiel 27:8
    kjvOsis:
    - Ezek.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.9
    scripture: tanakh
    name: Tanakh Ezekiel 27:9
    ref: Ezekiel 27:9
    book: Ezek
    section: neviim
    chapter: 27
    verse: 9
    ordinal: 13485
    text: The elders of Gebal and the wise men thereof Were in thee thy calkers; All the ships of the sea with their mariners were in thee To exchange thy merchandise.
    translation: JPS 1917
    original: זִקְנֵי גְבַל וַחֲכָמֶיהָ הָיוּ בָךְ מַחֲזִיקֵי בִּדְקֵךְ כָּל־אֳנִיּוֹת הַיָּם וּמַלָּחֵיהֶם הָיוּ בָךְ לַעֲרֹב מַעֲרָבֵךְ׃
    hebrewPlain: זקני גבל וחכמיה היו בך מחזיקי בדקך כל אניות הים ומלחיהם היו בך לערב מערבך
    kjvRefs:
    - Ezekiel 27:9
    kjvOsis:
    - Ezek.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.10
    scripture: tanakh
    name: Tanakh Ezekiel 27:10
    ref: Ezekiel 27:10
    book: Ezek
    section: neviim
    chapter: 27
    verse: 10
    ordinal: 13486
    text: Persia and Lud and Put were in thine army, Thy men of war; They hanged the shield and helmet in thee, They set forth thy comeliness.
    translation: JPS 1917
    original: פָּרַס וְלוּד וּפוּט הָיוּ בְחֵילֵךְ אַנְשֵׁי מִלְחַמְתֵּךְ מָגֵן וְכוֹבַע תִּלּוּ־בָךְ הֵמָּה נָתְנוּ הֲדָרֵךְ׃
    hebrewPlain: פרס ולוד ופוט היו בחילך אנשי מלחמתך מגן וכובע תלו בך המה נתנו הדרך
    kjvRefs:
    - Ezekiel 27:10
    kjvOsis:
    - Ezek.27.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.11
    scripture: tanakh
    name: Tanakh Ezekiel 27:11
    ref: Ezekiel 27:11
    book: Ezek
    section: neviim
    chapter: 27
    verse: 11
    ordinal: 13487
    text: The men of Arvad and Helech were upon thy walls round about, and the Gammadim were in thy towers; they hanged their shields upon thy walls round about; they have perfected thy beauty.
    translation: JPS 1917
    original: בְּנֵי אַרְוַד וְחֵילֵךְ עַל־חוֹמוֹתַיִךְ סָבִיב וְגַמָּדִים בְּמִגְדְּלוֹתַיִךְ הָיוּ שִׁלְטֵיהֶם תִּלּוּ עַל־חוֹמוֹתַיִךְ סָבִיב הֵמָּה כָּלְלוּ יָפְיֵךְ׃
    hebrewPlain: בני ארוד וחילך על חומותיך סביב וגמדים במגדלותיך היו שלטיהם תלו על חומותיך סביב המה כללו יפיך
    kjvRefs:
    - Ezekiel 27:11
    kjvOsis:
    - Ezek.27.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.12
    scripture: tanakh
    name: Tanakh Ezekiel 27:12
    ref: Ezekiel 27:12
    book: Ezek
    section: neviim
    chapter: 27
    verse: 12
    ordinal: 13488
    text: Tarshish was thy merchant by reason of the multitude of all kinds of riches; with silver, iron, tin, and lead, they traded for thy wares.
    translation: JPS 1917
    original: תַּרְשִׁישׁ סֹחַרְתֵּךְ מֵרֹב כָּל־הוֹן בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת נָתְנוּ עִזְבוֹנָיִךְ׃
    hebrewPlain: תרשיש סחרתך מרב כל הון בכסף ברזל בדיל ועופרת נתנו עזבוניך
    kjvRefs:
    - Ezekiel 27:12
    kjvOsis:
    - Ezek.27.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.13
    scripture: tanakh
    name: Tanakh Ezekiel 27:13
    ref: Ezekiel 27:13
    book: Ezek
    section: neviim
    chapter: 27
    verse: 13
    ordinal: 13489
    text: Javan, Tubal, and Meshech, they were thy traffickers; they traded the persons of men and vessels of brass for thy merchandise.
    translation: JPS 1917
    original: יָוָן תֻּבַל וָמֶשֶׁךְ הֵמָּה רֹכְלָיִךְ בְּנֶפֶשׁ אָדָם וּכְלֵי נְחֹשֶׁת נָתְנוּ מַעֲרָבֵךְ׃
    hebrewPlain: יון תבל ומשך המה רכליך בנפש אדם וכלי נחשת נתנו מערבך
    kjvRefs:
    - Ezekiel 27:13
    kjvOsis:
    - Ezek.27.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.14
    scripture: tanakh
    name: Tanakh Ezekiel 27:14
    ref: Ezekiel 27:14
    book: Ezek
    section: neviim
    chapter: 27
    verse: 14
    ordinal: 13490
    text: They of the house of Togarmah traded for thy wares with horses and horsemen and mules.
    translation: JPS 1917
    original: מִבֵּית תּוֹגַרְמָה סוּסִים וּפָרָשִׁים וּפְרָדִים נָתְנוּ עִזְבוֹנָיִךְ׃
    hebrewPlain: מבית תוגרמה סוסים ופרשים ופרדים נתנו עזבוניך
    kjvRefs:
    - Ezekiel 27:14
    kjvOsis:
    - Ezek.27.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.15
    scripture: tanakh
    name: Tanakh Ezekiel 27:15
    ref: Ezekiel 27:15
    book: Ezek
    section: neviim
    chapter: 27
    verse: 15
    ordinal: 13491
    text: The men of Dedan were thy traffickers; many isles were the mart of thy hand; they brought thee as tribute horns of ivory and ebony.
    translation: JPS 1917
    original: בְּנֵי דְדָן רֹכְלַיִךְ אִיִּים רַבִּים סְחֹרַת יָדֵךְ קַרְנוֹת שֵׁן והובנים [וְהָבְנִים] הֵשִׁיבוּ אֶשְׁכָּרֵךְ׃
    hebrewPlain: בני דדן רכליך איים רבים סחרת ידך קרנות שן והובנים [והבנים] השיבו אשכרך
    kjvRefs:
    - Ezekiel 27:15
    kjvOsis:
    - Ezek.27.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.16
    scripture: tanakh
    name: Tanakh Ezekiel 27:16
    ref: Ezekiel 27:16
    book: Ezek
    section: neviim
    chapter: 27
    verse: 16
    ordinal: 13492
    text: Aram was thy merchant by reason of the multitude of thy wealth; they traded for thy wares with carbuncles, purple, and richly woven work, and fine linen, and coral, and rubies.
    translation: JPS 1917
    original: אֲרָם סֹחַרְתֵּךְ מֵרֹב מַעֲשָׂיִךְ בְּנֹפֶךְ אַרְגָּמָן וְרִקְמָה וּבוּץ וְרָאמֹת וְכַדְכֹּד נָתְנוּ בְּעִזְבוֹנָיִךְ׃
    hebrewPlain: ארם סחרתך מרב מעשיך בנפך ארגמן ורקמה ובוץ וראמת וכדכד נתנו בעזבוניך
    kjvRefs:
    - Ezekiel 27:16
    kjvOsis:
    - Ezek.27.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.17
    scripture: tanakh
    name: Tanakh Ezekiel 27:17
    ref: Ezekiel 27:17
    book: Ezek
    section: neviim
    chapter: 27
    verse: 17
    ordinal: 13493
    text: Judah, and the land of Israel, they were thy traffickers; they traded for thy merchandise wheat of Minnith, and balsam, and honey, and oil, and balm.
    translation: JPS 1917
    original: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל הֵמָּה רֹכְלָיִךְ בְּחִטֵּי מִנִּית וּפַנַּג וּדְבַשׁ וָשֶׁמֶן וָצֹרִי נָתְנוּ מַעֲרָבֵךְ׃
    hebrewPlain: יהודה וארץ ישראל המה רכליך בחטי מנית ופנג ודבש ושמן וצרי נתנו מערבך
    kjvRefs:
    - Ezekiel 27:17
    kjvOsis:
    - Ezek.27.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.18
    scripture: tanakh
    name: Tanakh Ezekiel 27:18
    ref: Ezekiel 27:18
    book: Ezek
    section: neviim
    chapter: 27
    verse: 18
    ordinal: 13494
    text: Damascus was thy merchant for the multitude of thy wealth, by reason of the multitude of all riches, with the wine of Helbon, and white wool.
    translation: JPS 1917
    original: דַּמֶּשֶׂק סֹחַרְתֵּךְ בְּרֹב מַעֲשַׂיִךְ מֵרֹב כָּל־הוֹן בְּיֵין חֶלְבּוֹן וְצֶמֶר צָחַר׃
    hebrewPlain: דמשק סחרתך ברב מעשיך מרב כל הון ביין חלבון וצמר צחר
    kjvRefs:
    - Ezekiel 27:18
    kjvOsis:
    - Ezek.27.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.19
    scripture: tanakh
    name: Tanakh Ezekiel 27:19
    ref: Ezekiel 27:19
    book: Ezek
    section: neviim
    chapter: 27
    verse: 19
    ordinal: 13495
    text: Vedan and Javan traded with yarn for thy wares; massive iron, cassia, and calamus, were among thy merchandise.
    translation: JPS 1917
    original: וְדָן וְיָוָן מְאוּזָּל בְּעִזְבוֹנַיִךְ נָתָנּוּ בַּרְזֶל עָשׁוֹת קִדָּה וְקָנֶה בְּמַעֲרָבֵךְ הָיָה׃
    hebrewPlain: ודן ויון מאוזל בעזבוניך נתנו ברזל עשות קדה וקנה במערבך היה
    kjvRefs:
    - Ezekiel 27:19
    kjvOsis:
    - Ezek.27.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.20
    scripture: tanakh
    name: Tanakh Ezekiel 27:20
    ref: Ezekiel 27:20
    book: Ezek
    section: neviim
    chapter: 27
    verse: 20
    ordinal: 13496
    text: Dedan was thy trafficker in precious cloths for riding.
    translation: JPS 1917
    original: דְּדָן רֹכַלְתֵּךְ בְבִגְדֵי־חֹפֶשׁ לְרִכְבָּה׃
    hebrewPlain: דדן רכלתך בבגדי חפש לרכבה
    kjvRefs:
    - Ezekiel 27:20
    kjvOsis:
    - Ezek.27.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.21
    scripture: tanakh
    name: Tanakh Ezekiel 27:21
    ref: Ezekiel 27:21
    book: Ezek
    section: neviim
    chapter: 27
    verse: 21
    ordinal: 13497
    text: Arabia, and all the princes of Kedar, they were the merchants of thy hand; in lambs, and rams, and goats, in these were they thy merchants.
    translation: JPS 1917
    original: עֲרַב וְכָל־נְשִׂיאֵי קֵדָר הֵמָּה סֹחֲרֵי יָדֵךְ בְּכָרִים וְאֵילִים וְעַתּוּדִים בָּם סֹחֲרָיִךְ׃
    hebrewPlain: ערב וכל נשיאי קדר המה סחרי ידך בכרים ואילים ועתודים בם סחריך
    kjvRefs:
    - Ezekiel 27:21
    kjvOsis:
    - Ezek.27.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.22
    scripture: tanakh
    name: Tanakh Ezekiel 27:22
    ref: Ezekiel 27:22
    book: Ezek
    section: neviim
    chapter: 27
    verse: 22
    ordinal: 13498
    text: The traffickers of Sheba and Raamah, they were thy traffickers; they traded for thy wares with chief of all spices, and with all precious stones, and gold.
    translation: JPS 1917
    original: רֹכְלֵי שְׁבָא וְרַעְמָה הֵמָּה רֹכְלָיִךְ בְּרֹאשׁ כָּל־בֹּשֶׂם וּבְכָל־אֶבֶן יְקָרָה וְזָהָב נָתְנוּ עִזְבוֹנָיִךְ׃
    hebrewPlain: רכלי שבא ורעמה המה רכליך בראש כל בשם ובכל אבן יקרה וזהב נתנו עזבוניך
    kjvRefs:
    - Ezekiel 27:22
    kjvOsis:
    - Ezek.27.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.23
    scripture: tanakh
    name: Tanakh Ezekiel 27:23
    ref: Ezekiel 27:23
    book: Ezek
    section: neviim
    chapter: 27
    verse: 23
    ordinal: 13499
    text: Haran and Canneh and Eden, the traffickers of Sheba, Asshur was as thine apprentice in traffic.
    translation: JPS 1917
    original: חָרָן וְכַנֵּה וָעֶדֶן רֹכְלֵי שְׁבָא אַשּׁוּר כִּלְמַד רֹכַלְתֵּךְ׃
    hebrewPlain: חרן וכנה ועדן רכלי שבא אשור כלמד רכלתך
    kjvRefs:
    - Ezekiel 27:23
    kjvOsis:
    - Ezek.27.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.24
    scripture: tanakh
    name: Tanakh Ezekiel 27:24
    ref: Ezekiel 27:24
    book: Ezek
    section: neviim
    chapter: 27
    verse: 24
    ordinal: 13500
    text: These were thy traffickers in gorgeous fabrics, in wrappings of blue and richly woven work, and in chests of rich apparel, bound with cords and cedar-lined, among thy merchandise.
    translation: JPS 1917
    original: הֵמָּה רֹכְלַיִךְ בְּמַכְלֻלִים בִּגְלוֹמֵי תְּכֵלֶת וְרִקְמָה וּבְגִנְזֵי בְּרֹמִים בַּחֲבָלִים חֲבֻשִׁים וַאֲרֻזִים בְּמַרְכֻלְתֵּךְ׃
    hebrewPlain: המה רכליך במכללים בגלומי תכלת ורקמה ובגנזי ברמים בחבלים חבשים וארזים במרכלתך
    kjvRefs:
    - Ezekiel 27:24
    kjvOsis:
    - Ezek.27.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.25
    scripture: tanakh
    name: Tanakh Ezekiel 27:25
    ref: Ezekiel 27:25
    book: Ezek
    section: neviim
    chapter: 27
    verse: 25
    ordinal: 13501
    text: The ships of Tarshish brought thee tribute for thy merchandise; So wast thou replenished, and made very heavy In the heart of the seas.
    translation: JPS 1917
    original: אֳנִיּוֹת תַּרְשִׁישׁ שָׁרוֹתַיִךְ מַעֲרָבֵךְ וַתִּמָּלְאִי וַתִּכְבְּדִי מְאֹד בְּלֵב־יַמִּים׃
    hebrewPlain: אניות תרשיש שרותיך מערבך ותמלאי ותכבדי מאד בלב ימים
    kjvRefs:
    - Ezekiel 27:25
    kjvOsis:
    - Ezek.27.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.26
    scripture: tanakh
    name: Tanakh Ezekiel 27:26
    ref: Ezekiel 27:26
    book: Ezek
    section: neviim
    chapter: 27
    verse: 26
    ordinal: 13502
    text: Thy rowers have brought thee Into great waters; The east wind hath broken thee In the heart of the seas.
    translation: JPS 1917
    original: בְּמַיִם רַבִּים הֱבִיאוּךְ הַשָּׁטִים אֹתָךְ רוּחַ הַקָּדִים שְׁבָרֵךְ בְּלֵב יַמִּים׃
    hebrewPlain: במים רבים הביאוך השטים אתך רוח הקדים שברך בלב ימים
    kjvRefs:
    - Ezekiel 27:26
    kjvOsis:
    - Ezek.27.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.27
    scripture: tanakh
    name: Tanakh Ezekiel 27:27
    ref: Ezekiel 27:27
    book: Ezek
    section: neviim
    chapter: 27
    verse: 27
    ordinal: 13503
    text: Thy riches, and thy wares, thy merchandise, Thy mariners, and thy pilots, Thy calkers, and the exchangers of thy merchandise, And all thy men of war, that are in thee, With all thy company which is in the midst of thee, Shall fall into the heart of the seas In the day of thy ruin.
    translation: JPS 1917
    original: הוֹנֵךְ וְעִזְבוֹנַיִךְ מַעֲרָבֵךְ מַלָּחַיִךְ וְחֹבְלָיִךְ מַחֲזִיקֵי בִדְקֵך וְעֹרְבֵי מַעֲרָבֵךְ וְכָל־אַנְשֵׁי מִלְחַמְתֵּךְ אֲשֶׁר־בָּךְ וּבְכָל־קְהָלֵךְ אֲשֶׁר בְּתוֹכֵךְ יִפְּלוּ בְּלֵב יַמִּים בְּיוֹם מַפַּלְתֵּךְ׃
    hebrewPlain: הונך ועזבוניך מערבך מלחיך וחבליך מחזיקי בדקך וערבי מערבך וכל אנשי מלחמתך אשר בך ובכל קהלך אשר בתוכך יפלו בלב ימים ביום מפלתך
    kjvRefs:
    - Ezekiel 27:27
    kjvOsis:
    - Ezek.27.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.28
    scripture: tanakh
    name: Tanakh Ezekiel 27:28
    ref: Ezekiel 27:28
    book: Ezek
    section: neviim
    chapter: 27
    verse: 28
    ordinal: 13504
    text: At the sound of the cry of thy pilots The waves shall shake.
    translation: JPS 1917
    original: לְקוֹל זַעֲקַת חֹבְלָיִךְ יִרְעֲשׁוּ מִגְרֹשׁוֹת׃
    hebrewPlain: לקול זעקת חבליך ירעשו מגרשות
    kjvRefs:
    - Ezekiel 27:28
    kjvOsis:
    - Ezek.27.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.29
    scripture: tanakh
    name: Tanakh Ezekiel 27:29
    ref: Ezekiel 27:29
    book: Ezek
    section: neviim
    chapter: 27
    verse: 29
    ordinal: 13505
    text: And all that handle the oar, The mariners, and all the pilots of the sea, Shall come down from their ships, They shall stand upon the land,
    translation: JPS 1917
    original: וְיָרְדוּ מֵאָנִיּוֹתֵיהֶם כֹּל תֹּפְשֵׂי מָשׁוֹט מַלָּחִים כֹּל חֹבְלֵי הַיָּם אֶל־הָאָרֶץ יַעֲמֹדוּ׃
    hebrewPlain: וירדו מאניותיהם כל תפשי משוט מלחים כל חבלי הים אל הארץ יעמדו
    kjvRefs:
    - Ezekiel 27:29
    kjvOsis:
    - Ezek.27.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.30
    scripture: tanakh
    name: Tanakh Ezekiel 27:30
    ref: Ezekiel 27:30
    book: Ezek
    section: neviim
    chapter: 27
    verse: 30
    ordinal: 13506
    text: And shall cause their voice to be heard over thee, And shall cry bitterly, And shall cast up dust upon their heads, They shall roll themselves in the ashes;
    translation: JPS 1917
    original: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם וְיִזְעֲקוּ מָרָה וְיַעֲלוּ עָפָר עַל־רָאשֵׁיהֶם בָּאֵפֶר יִתְפַּלָּשׁוּ׃
    hebrewPlain: והשמיעו עליך בקולם ויזעקו מרה ויעלו עפר על ראשיהם באפר יתפלשו
    kjvRefs:
    - Ezekiel 27:30
    kjvOsis:
    - Ezek.27.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.31
    scripture: tanakh
    name: Tanakh Ezekiel 27:31
    ref: Ezekiel 27:31
    book: Ezek
    section: neviim
    chapter: 27
    verse: 31
    ordinal: 13507
    text: And they shall make themselves utterly bald for thee, And gird them with sackcloth, And they shall weep for thee in bitterness of soul With bitter lamentation.
    translation: JPS 1917
    original: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה וְחָגְרוּ שַׂקִּים וּבָכוּ אֵלַיִךְ בְּמַר־נֶפֶשׁ מִסְפֵּד מָר׃
    hebrewPlain: והקריחו אליך קרחה וחגרו שקים ובכו אליך במר נפש מספד מר
    kjvRefs:
    - Ezekiel 27:31
    kjvOsis:
    - Ezek.27.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.32
    scripture: tanakh
    name: Tanakh Ezekiel 27:32
    ref: Ezekiel 27:32
    book: Ezek
    section: neviim
    chapter: 27
    verse: 32
    ordinal: 13508
    text: 'And in their wailing they shall take up a lamentation for thee, And lament over thee: Who was there like Tyre, fortified In the midst of the sea?'
    translation: JPS 1917
    original: וְנָשְׂאוּ אֵלַיִךְ בְּנִיהֶם קִינָה וְקוֹנְנוּ עָלָיִךְ מִי כְצוֹר כְּדֻמָה בְּתוֹךְ הַיָּם׃
    hebrewPlain: ונשאו אליך בניהם קינה וקוננו עליך מי כצור כדמה בתוך הים
    kjvRefs:
    - Ezekiel 27:32
    kjvOsis:
    - Ezek.27.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.33
    scripture: tanakh
    name: Tanakh Ezekiel 27:33
    ref: Ezekiel 27:33
    book: Ezek
    section: neviim
    chapter: 27
    verse: 33
    ordinal: 13509
    text: When thy wares came forth out of the seas, Thou didst fill many peoples; With the multitude of thy riches and of thy merchandise Didst thou enrich the kings of the earth.
    translation: JPS 1917
    original: בְּצֵאת עִזְבוֹנַיִךְ מִיַּמִּים הִשְׂבַּעַתְּ עַמִּים רַבִּים בְּרֹב הוֹנַיִךְ וּמַעֲרָבַיִךְ הֶעֱשַׁרְתְּ מַלְכֵי־אָרֶץ׃
    hebrewPlain: בצאת עזבוניך מימים השבעת עמים רבים ברב הוניך ומערביך העשרת מלכי ארץ
    kjvRefs:
    - Ezekiel 27:33
    kjvOsis:
    - Ezek.27.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.34
    scripture: tanakh
    name: Tanakh Ezekiel 27:34
    ref: Ezekiel 27:34
    book: Ezek
    section: neviim
    chapter: 27
    verse: 34
    ordinal: 13510
    text: Now that thou art broken by the seas In the depths of the waters, And thy merchandise and all thy company Are fallen in the midst of thee,
    translation: JPS 1917
    original: עֵת נִשְׁבֶּרֶת מִיַּמִּים בְּמַעֲמַקֵּי־מָיִם מַעֲרָבֵךְ וְכָל־קְהָלֵךְ בְּתוֹכֵךְ נָפָלוּ׃
    hebrewPlain: עת נשברת מימים במעמקי מים מערבך וכל קהלך בתוכך נפלו
    kjvRefs:
    - Ezekiel 27:34
    kjvOsis:
    - Ezek.27.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.35
    scripture: tanakh
    name: Tanakh Ezekiel 27:35
    ref: Ezekiel 27:35
    book: Ezek
    section: neviim
    chapter: 27
    verse: 35
    ordinal: 13511
    text: All the inhabitants of the isles Are appalled at thee, And their kings are horribly afraid, They are troubled in their countenance;
    translation: JPS 1917
    original: כֹּל יֹשְׁבֵי הָאִיִּים שָׁמְמוּ עָלָיִךְ וּמַלְכֵיהֶם שָׂעֲרוּ שַׂעַר רָעֲמוּ פָּנִים׃
    hebrewPlain: כל ישבי האיים שממו עליך ומלכיהם שערו שער רעמו פנים
    kjvRefs:
    - Ezekiel 27:35
    kjvOsis:
    - Ezek.27.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.27.36
    scripture: tanakh
    name: Tanakh Ezekiel 27:36
    ref: Ezekiel 27:36
    book: Ezek
    section: neviim
    chapter: 27
    verse: 36
    ordinal: 13512
    text: The merchants among the peoples hiss at thee; Thou art become a terror, And never shalt be any more.’
    translation: JPS 1917
    original: סֹחֲרִים בָּעַמִּים שָׁרְקוּ עָלָיִךְ בַּלָּהוֹת הָיִית וְאֵינֵךְ עַד־עוֹלָם׃
    hebrewPlain: סחרים בעמים שרקו עליך בלהות היית ואינך עד עולם
    kjvRefs:
    - Ezekiel 27:36
    kjvOsis:
    - Ezek.27.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.27
- type: TanakhVerse
  data:
    osis: Ezek.28.1
    scripture: tanakh
    name: Tanakh Ezekiel 28:1
    ref: Ezekiel 28:1
    book: Ezek
    section: neviim
    chapter: 28
    verse: 1
    ordinal: 13513
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 28:1
    kjvOsis:
    - Ezek.28.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.2
    scripture: tanakh
    name: Tanakh Ezekiel 28:2
    ref: Ezekiel 28:2
    book: Ezek
    section: neviim
    chapter: 28
    verse: 2
    ordinal: 13514
    text: '’Son of man, say unto the prince of Tyre: Thus saith the Lord GOD: Because thy heart is lifted up, And thou hast said: I am a god, I sit in the seat of God, In the heart of the seas; Yet thou art man, and not God, Though thou didst set thy heart as the heart of God—'
    translation: JPS 1917
    original: בֶּן־אָדָם אֱמֹר לִנְגִיד צֹר כֹּה־אָמַר אֲדֹנָי יְהֹוִה יַעַן גָּבַהּ לִבְּךָ וַתֹּאמֶר אֵל אָנִי מוֹשַׁב אֱלֹהִים יָשַׁבְתִּי בְּלֵב יַמִּים וְאַתָּה אָדָם וְלֹא־אֵל וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים׃
    hebrewPlain: בן אדם אמר לנגיד צר כה אמר אדני יהוה יען גבה לבך ותאמר אל אני מושב אלהים ישבתי בלב ימים ואתה אדם ולא אל ותתן לבך כלב אלהים
    kjvRefs:
    - Ezekiel 28:2
    kjvOsis:
    - Ezek.28.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.3
    scripture: tanakh
    name: Tanakh Ezekiel 28:3
    ref: Ezekiel 28:3
    book: Ezek
    section: neviim
    chapter: 28
    verse: 3
    ordinal: 13515
    text: Behold, thou art wiser than Daniel! There is no secret that they can hide from thee!
    translation: JPS 1917
    original: הִנֵּה חָכָם אַתָּה מדנאל [מִדָּנִיֵּאל] כָּל־סָתוּם לֹא עֲמָמוּךָ׃
    hebrewPlain: הנה חכם אתה מדנאל [מדניאל] כל סתום לא עממוך
    kjvRefs:
    - Ezekiel 28:3
    kjvOsis:
    - Ezek.28.3
