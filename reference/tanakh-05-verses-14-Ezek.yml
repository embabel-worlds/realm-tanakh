    translation: JPS 1917
    original: לְאַרְבַּע רוּחוֹת מְדָדוֹ חוֹמָה לוֹ סָבִיב סָבִיב אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת לְהַבְדִּיל בֵּין הַקֹּדֶשׁ לְחֹל׃
