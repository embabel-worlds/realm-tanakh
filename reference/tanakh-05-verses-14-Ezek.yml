    scripture: tanakh
    name: Tanakh Ezekiel 40:38
    ref: Ezekiel 40:38
    book: Ezek
    section: neviim
    chapter: 40
    verse: 38
    ordinal: 13870
    text: And a chamber with the entry thereof was by the posts at the gates; there was the burnt-offering to be washed.
    translation: JPS 1917
    original: וְלִשְׁכָּה וּפִתְחָהּ בְּאֵילִים הַשְּׁעָרִים שָׁם יָדִיחוּ אֶת־הָעֹלָה׃
    hebrewPlain: ולשכה ופתחה באילים השערים שם ידיחו את העלה
