    section: neviim
    chapter: 42
    verse: 1
    ordinal: 13908
    text: Then he brought me forth into the outer court, the way toward the north; and he brought me into the chamber that was over against the separate place, and which was over against the building, toward the north,
    translation: JPS 1917
    original: וַיּוֹצִאֵנִי אֶל־הֶחָצֵר הַחִיצוֹנָה הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן וַיְבִאֵנִי אֶל־הַלִּשְׁכָּה אֲשֶׁר נֶגֶד הַגִּזְרָה וַאֲשֶׁר־נֶגֶד הַבִּנְיָן אֶל־הַצָּפוֹן׃
    hebrewPlain: ויוצאני אל החצר החיצונה הדרך דרך הצפון ויבאני אל הלשכה אשר נגד הגזרה ואשר נגד הבנין אל הצפון
