  data:
    osis: Ezek.32.23
    scripture: tanakh
    name: Tanakh Ezekiel 32:23
    ref: Ezekiel 32:23
    book: Ezek
    section: neviim
    chapter: 32
    verse: 23
    ordinal: 13626
    text: whose graves are set in the uttermost parts of the pit, and her company is round about her grave; all of them slain, fallen by the sword, who caused terror in the land of the living.
    translation: JPS 1917
    original: אֲשֶׁר נִתְּנוּ קִבְרֹתֶיהָ בְּיַרְכְּתֵי־בוֹר וַיְהִי קְהָלָהּ סְבִיבוֹת קְבֻרָתָהּ כֻּלָּם חֲלָלִים נֹפְלִים בַּחֶרֶב אֲשֶׁר־נָתְנוּ חִתִּית בְּאֶרֶץ חַיִּים׃
    hebrewPlain: אשר נתנו קברתיה בירכתי בור ויהי קהלה סביבות קברתה כלם חללים נפלים בחרב אשר נתנו חתית בארץ חיים
    kjvRefs:
    - Ezekiel 32:23
    kjvOsis:
    - Ezek.32.23
