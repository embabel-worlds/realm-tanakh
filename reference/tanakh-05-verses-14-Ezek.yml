  data:
    osis: Ezek.12.14
    scripture: tanakh
    name: Tanakh Ezekiel 12:14
    ref: Ezekiel 12:14
    book: Ezek
    section: neviim
    chapter: 12
    verse: 14
    ordinal: 13049
    text: And I will disperse toward every wind all that are round about him to help him, and all his troops; and I will draw out the sword after them.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר סְבִיבֹתָיו עזרה [עֶזְרוֹ] וְכָל־אֲגַפָּיו אֱזָרֶה לְכָל־רוּחַ וְחֶרֶב אָרִיק אַחֲרֵיהֶם׃
    hebrewPlain: וכל אשר סביבתיו עזרה [עזרו] וכל אגפיו אזרה לכל רוח וחרב אריק אחריהם
    kjvRefs:
