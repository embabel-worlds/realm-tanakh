    book: Ezek
    section: neviim
    chapter: 43
    verse: 3
    ordinal: 13930
    text: And the appearance of the vision which I saw was like the vision that I saw when I came to destroy the city; and the visions were like the vision that I saw by the river Chebar; and I fell upon my face.
    translation: JPS 1917
    original: וּכְמַרְאֵה הַמַּרְאֶה אֲשֶׁר רָאִיתִי כַּמַּרְאֶה אֲשֶׁר־רָאִיתִי בְּבֹאִי לְשַׁחֵת אֶת־הָעִיר וּמַרְאוֹת כַּמַּרְאֶה אֲשֶׁר רָאִיתִי אֶל־נְהַר־כְּבָר וָאֶפֹּל אֶל־פָּנָי׃
    hebrewPlain: וכמראה המראה אשר ראיתי כמראה אשר ראיתי בבאי לשחת את העיר ומראות כמראה אשר ראיתי אל נהר כבר ואפל אל פני
