    name: Tanakh Ezekiel 23:19
    ref: Ezekiel 23:19
    book: Ezek
    section: neviim
    chapter: 23
    verse: 19
    ordinal: 13381
    text: Yet she multiplied her harlotries, remembering the days of her youth, wherein she had played the harlot in the land of Egypt.
    translation: JPS 1917
    original: וַתַּרְבֶּה אֶת־תַּזְנוּתֶיהָ לִזְכֹּר אֶת־יְמֵי נְעוּרֶיהָ אֲשֶׁר זָנְתָה בְּאֶרֶץ מִצְרָיִם׃
    hebrewPlain: ותרבה את תזנותיה לזכר את ימי נעוריה אשר זנתה בארץ מצרים
