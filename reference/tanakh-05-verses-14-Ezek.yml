    scripture: tanakh
    name: Tanakh Ezekiel 28:11
    ref: Ezekiel 28:11
    book: Ezek
    section: neviim
    chapter: 28
    verse: 11
    ordinal: 13523
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
