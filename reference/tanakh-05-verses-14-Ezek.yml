    scripture: tanakh
    name: Tanakh Ezekiel 24:27
    ref: Ezekiel 24:27
    book: Ezek
    section: neviim
    chapter: 24
    verse: 27
    ordinal: 13438
    text: In that day shall thy mouth be opened together with him that is escaped, and thou shalt speak, and be no more dumb; so shalt thou be a sign unto them; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא יִפָּתַח פִּיךָ אֶת־הַפָּלִיט וּתְדַבֵּר וְלֹא תֵאָלֵם עוֹד וְהָיִיתָ לָהֶם לְמוֹפֵת וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ביום ההוא יפתח פיך את הפליט ותדבר ולא תאלם עוד והיית להם למופת וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 24:27
    kjvOsis:
    - Ezek.24.27
