  data:
    osis: Ezek.21.5
    scripture: tanakh
    name: Tanakh Ezekiel 21:5
    ref: Ezekiel 21:5
    book: Ezek
    section: neviim
    chapter: 21
    verse: 5
    ordinal: 13299
    text: 'Then said I: ‘Ah Lord GOD! they say of me: Is he not a maker of parables?’'
    translation: JPS 1917
    original: וָאֹמַר אֲהָהּ אֲדֹנָי יְהוִה הֵמָּה אֹמְרִים לִי הֲלֹא מְמַשֵּׁל מְשָׁלִים הוּא׃
    hebrewPlain: ואמר אהה אדני יהוה המה אמרים לי הלא ממשל משלים הוא
    kjvRefs:
    - Ezekiel 20:49
    kjvOsis:
