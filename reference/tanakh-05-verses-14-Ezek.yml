    ref: Ezekiel 21:2
    book: Ezek
    section: neviim
    chapter: 21
    verse: 2
    ordinal: 13296
    text: ’Son of man, set thy face toward the South, and preach toward the South, and prophesy against the forest of the field in the South;
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ דֶּרֶךְ תֵּימָנָה וְהַטֵּף אֶל־דָּרוֹם וְהִנָּבֵא אֶל־יַעַר הַשָּׂדֶה נֶגֶב׃
    hebrewPlain: בן אדם שים פניך דרך תימנה והטף אל דרום והנבא אל יער השדה נגב
    kjvRefs:
    - Ezekiel 20:46
    kjvOsis:
    - Ezek.20.46
