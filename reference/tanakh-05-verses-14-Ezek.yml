  data:
    osis: Ezek.32.21
    scripture: tanakh
    name: Tanakh Ezekiel 32:21
    ref: Ezekiel 32:21
    book: Ezek
    section: neviim
    chapter: 32
    verse: 21
    ordinal: 13624
    text: The strong among the mighty shall speak of him out of the midst of the nether-world with them that helped him; they are gone down, they lie still, even the uncircumcised, slain by the sword.
    translation: JPS 1917
    original: יְדַבְּרוּ־לוֹ אֵלֵי גִבּוֹרִים מִתּוֹךְ שְׁאוֹל אֶת־עֹזְרָיו יָרְדוּ שָׁכְבוּ הָעֲרֵלִים חַלְלֵי־חָרֶב׃
    hebrewPlain: ידברו לו אלי גבורים מתוך שאול את עזריו ירדו שכבו הערלים חללי חרב
    kjvRefs:
