    name: Tanakh Ezekiel 42:3
    ref: Ezekiel 42:3
    book: Ezek
    section: neviim
    chapter: 42
    verse: 3
    ordinal: 13910
    text: over against the twenty cubits which belonged to the inner court, and over against the pavement which belonged to the outer court; with gallery against gallery in three stories.
    translation: JPS 1917
    original: נֶגֶד הָעֶשְׂרִים אֲשֶׁר לֶחָצֵר הַפְּנִימִי וְנֶגֶד רִצְפָה אֲשֶׁר לֶחָצֵר הַחִיצוֹנָה אַתִּיק אֶל־פְּנֵי־אַתִּיק בַּשְּׁלִשִׁים׃
    hebrewPlain: נגד העשרים אשר לחצר הפנימי ונגד רצפה אשר לחצר החיצונה אתיק אל פני אתיק בשלשים
