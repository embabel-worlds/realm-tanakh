    scripture: tanakh
    name: Tanakh Ezekiel 24:17
    ref: Ezekiel 24:17
    book: Ezek
    section: neviim
    chapter: 24
    verse: 17
    ordinal: 13428
    text: Sigh in silence; make no mourning for the dead, bind thy headtire upon thee, and put thy shoes upon thy feet, and cover not thine upper lip, and eat not the bread of men.’
    translation: JPS 1917
    original: הֵאָנֵק דֹּם מֵתִים אֵבֶל לֹא־תַעֲשֶׂה פְאֵרְךָ חֲבוֹשׁ עָלֶיךָ וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ וְלֹא תַעְטֶה עַל־שָׂפָם וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל׃
    hebrewPlain: האנק דם מתים אבל לא תעשה פארך חבוש עליך ונעליך תשים ברגליך ולא תעטה על שפם ולחם אנשים לא תאכל
