    section: neviim
    chapter: 20
    verse: 11
    ordinal: 13261
    text: And I gave them My statutes, and taught them Mine ordinances, which if a man do, he shall live by them.
    translation: JPS 1917
    original: וָאֶתֵּן לָהֶם אֶת־חֻקּוֹתַי וְאֶת־מִשְׁפָּטַי הוֹדַעְתִּי אוֹתָם אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם׃
    hebrewPlain: ואתן להם את חקותי ואת משפטי הודעתי אותם אשר יעשה אותם האדם וחי בהם
