    translation: JPS 1917
    original: בֶּן־אָדָם הִנֵּה בֵית־יִשְׂרָאֵל אֹמְרִים הֶחָזוֹן אֲשֶׁר־הוּא חֹזֶה לְיָמִים רַבִּים וּלְעִתִּים רְחוֹקוֹת הוּא נִבָּא׃
    hebrewPlain: בן אדם הנה בית ישראל אמרים החזון אשר הוא חזה לימים רבים ולעתים רחוקות הוא נבא
