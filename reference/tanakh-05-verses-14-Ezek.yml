  data:
    osis: Ezek.14.22
    scripture: tanakh
    name: Tanakh Ezekiel 14:22
    ref: Ezekiel 14:22
    book: Ezek
    section: neviim
    chapter: 14
    verse: 22
    ordinal: 13108
    text: And, behold, though there be left a remnant therein that shall be brought forth, both sons and daughters; behold, when they come forth unto you, and ye see their way and their doings, then ye shall be comforted concerning the evil that I have brought upon Jerusalem, even concerning all that I have brought upon it;
    translation: JPS 1917
    original: וְהִנֵּה נוֹתְרָה־בָּהּ פְּלֵטָה הַמּוּצָאִים בָּנִים וּבָנוֹת הִנָּם יוֹצְאִים אֲלֵיכֶם וּרְאִיתֶם אֶת־דַּרְכָּם וְאֶת־עֲלִילוֹתָם וְנִחַמְתֶּם עַל־הָרָעָה אֲשֶׁר הֵבֵאתִי עַל־יְרוּשָׁלִַם אֵת כָּל־אֲשֶׁר הֵבֵאתִי עָלֶיהָ׃
    hebrewPlain: והנה נותרה בה פלטה המוצאים בנים ובנות הנם יוצאים אליכם וראיתם את דרכם ואת עלילותם ונחמתם על הרעה אשר הבאתי על ירושלם את כל אשר הבאתי עליה
    kjvRefs:
    - Ezekiel 14:22
    kjvOsis:
    - Ezek.14.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.23
    scripture: tanakh
    name: Tanakh Ezekiel 14:23
    ref: Ezekiel 14:23
    book: Ezek
    section: neviim
    chapter: 14
    verse: 23
    ordinal: 13109
    text: and they shall comfort you, when ye see their way and their doings, and ye shall know that I have not done without cause all that I have done in it, saith the Lord GOD.’
    translation: JPS 1917
    original: וְנִחֲמוּ אֶתְכֶם כִּי־תִרְאוּ אֶת־דַּרְכָּם וְאֶת־עֲלִילוֹתָם וִידַעְתֶּם כִּי לֹא חִנָּם עָשִׂיתִי אֵת כָּל־אֲשֶׁר־עָשִׂיתִי בָהּ נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: ונחמו אתכם כי תראו את דרכם ואת עלילותם וידעתם כי לא חנם עשיתי את כל אשר עשיתי בה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 14:23
    kjvOsis:
    - Ezek.14.23
