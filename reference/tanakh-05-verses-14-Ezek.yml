    ordinal: 13106
    text: though Noah, Daniel, and Job, were in it, as I live, saith the Lord GOD, they shall deliver neither son nor daughter; they shall but deliver their own souls by their righteousness.
    translation: JPS 1917
    original: וְנֹחַ דנאל [דָּנִיֵּאל] וְאִיּוֹב בְּתוֹכָהּ חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־בֵּן אִם־בַּת יַצִּילוּ הֵמָּה בְצִדְקָתָם יַצִּילוּ נַפְשָׁם׃
