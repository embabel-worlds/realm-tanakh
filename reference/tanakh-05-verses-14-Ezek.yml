- type: TanakhVerse
  data:
    osis: Ezek.48.1
    scripture: tanakh
    name: Tanakh Ezekiel 48:1
    ref: Ezekiel 48:1
    book: Ezek
    section: neviim
    chapter: 48
    verse: 1
    ordinal: 14058
    text: 'Now these are the names of the tribes: from the north end, beside the way of Hethlon to the entrance of Hamath, Hazar-enan, at the border of Damascus, northward, beside Hamath; and they shall have their sides east and west: Dan, one portion.'
    translation: JPS 1917
    original: וְאֵלֶּה שְׁמוֹת הַשְּׁבָטִים מִקְצֵה צָפוֹנָה אֶל־יַד דֶּרֶךְ־חֶתְלֹן לְבוֹא־חֲמָת חֲצַר עֵינָן גְּבוּל דַּמֶּשֶׂק צָפוֹנָה אֶל־יַד חֲמָת וְהָיוּ־לוֹ פְאַת־קָדִים הַיָּם דָּן אֶחָד׃
    hebrewPlain: ואלה שמות השבטים מקצה צפונה אל יד דרך חתלן לבוא חמת חצר עינן גבול דמשק צפונה אל יד חמת והיו לו פאת קדים הים דן אחד
    kjvRefs:
    - Ezekiel 48:1
    kjvOsis:
    - Ezek.48.1
