    section: neviim
    chapter: 23
    verse: 18
    ordinal: 13380
    text: So she uncovered her harlotries, and uncovered her nakedness; then My soul was alienated from her, like as My soul was alienated from her sister.
    translation: JPS 1917
    original: וַתְּגַל תַּזְנוּתֶיהָ וַתְּגַל אֶת־עֶרְוָתָהּ וַתֵּקַע נַפְשִׁי מֵעָלֶיהָ כַּאֲשֶׁר נָקְעָה נַפְשִׁי מֵעַל אֲחוֹתָהּ׃
    hebrewPlain: ותגל תזנותיה ותגל את ערותה ותקע נפשי מעליה כאשר נקעה נפשי מעל אחותה
