    name: Tanakh Ezekiel 41:22
    ref: Ezekiel 41:22
    book: Ezek
    section: neviim
    chapter: 41
    verse: 22
    ordinal: 13903
    text: 'The altar, three cubits high, and the length thereof two cubits, was of wood, and so the corners thereof; the length thereof, and the walls thereof, were also of wood; and he said unto me: ‘This is the table that is before the LORD.’'
    translation: JPS 1917
    original: הַמִּזְבֵּחַ עֵץ שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ וְאָרְכּוֹ שְׁתַּיִם־אַמּוֹת וּמִקְצֹעוֹתָיו לוֹ וְאָרְכּוֹ וְקִירֹתָיו עֵץ וַיְדַבֵּר אֵלַי זֶה הַשֻּׁלְחָן אֲשֶׁר לִפְנֵי יְהוָה׃
    hebrewPlain: המזבח עץ שלוש אמות גבה וארכו שתים אמות ומקצעותיו לו וארכו וקירתיו עץ וידבר אלי זה השלחן אשר לפני יהוה
    kjvRefs:
