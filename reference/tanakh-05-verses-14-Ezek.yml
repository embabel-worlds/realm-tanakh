    ref: Ezekiel 38:1
    book: Ezek
    section: neviim
    chapter: 38
    verse: 1
    ordinal: 13781
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
