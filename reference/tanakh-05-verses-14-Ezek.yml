    hebrewPlain: ותאו [ותאיו] ואלו [ואליו] ואלמו [ואלמיו] כמדות האלה וחלונות לו ולאלמו [ולאלמיו] סביב סביב ארך חמשים אמה ורחב חמש ועשרים אמה
