    translation: JPS 1917
    original: וְהוֹלִיד בֵּן־פָּרִיץ שֹׁפֵךְ דָּם וְעָשָׂה אָח מֵאַחַד מֵאֵלֶּה׃
    hebrewPlain: והוליד בן פריץ שפך דם ועשה אח מאחד מאלה
