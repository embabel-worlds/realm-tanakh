    scripture: tanakh
    name: Tanakh Ezekiel 24:24
    ref: Ezekiel 24:24
    book: Ezek
    section: neviim
    chapter: 24
    verse: 24
    ordinal: 13435
    text: Thus shall Ezekiel be unto you a sign; according to all that he hath done shall ye do; when this cometh, then shall ye know that I am the Lord GOD.
    translation: JPS 1917
    original: וְהָיָה יְחֶזְקֵאל לָכֶם לְמוֹפֵת כְּכֹל אֲשֶׁר־עָשָׂה תַּעֲשׂוּ בְּבֹאָהּ וִידַעְתֶּם כִּי אֲנִי אֲדֹנָי יְהוִה׃
    hebrewPlain: והיה יחזקאל לכם למופת ככל אשר עשה תעשו בבאה וידעתם כי אני אדני יהוה
    kjvRefs:
    - Ezekiel 24:24
    kjvOsis:
    - Ezek.24.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
