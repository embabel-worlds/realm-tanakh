  data:
    osis: Ezek.14.19
    scripture: tanakh
    name: Tanakh Ezekiel 14:19
    ref: Ezekiel 14:19
    book: Ezek
    section: neviim
    chapter: 14
    verse: 19
    ordinal: 13105
    text: Or if I send a pestilence into that land, and pour out My fury upon it in blood, to cut off from it man and beast;
    translation: JPS 1917
    original: אוֹ דֶּבֶר אֲשַׁלַּח אֶל־הָאָרֶץ הַהִיא וְשָׁפַכְתִּי חֲמָתִי עָלֶיהָ בְּדָם לְהַכְרִית מִמֶּנָּה אָדָם וּבְהֵמָה׃
    hebrewPlain: או דבר אשלח אל הארץ ההיא ושפכתי חמתי עליה בדם להכרית ממנה אדם ובהמה
