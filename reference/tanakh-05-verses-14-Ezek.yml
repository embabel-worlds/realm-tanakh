    scripture: tanakh
    name: Tanakh Ezekiel 24:16
    ref: Ezekiel 24:16
    book: Ezek
    section: neviim
    chapter: 24
    verse: 16
    ordinal: 13427
    text: ’Son of man, behold, I take away from thee the desire of thine eyes with a stroke; yet neither shalt thou make lamentation nor weep, neither shall thy tears run down.
    translation: JPS 1917
    original: בֶּן־אָדָם הִנְנִי לֹקֵחַ מִמְּךָ אֶת־מַחְמַד עֵינֶיךָ בְּמַגֵּפָה וְלֹא תִסְפֹּד וְלֹא תִבְכֶּה וְלוֹא תָבוֹא דִּמְעָתֶךָ׃
    hebrewPlain: בן אדם הנני לקח ממך את מחמד עיניך במגפה ולא תספד ולא תבכה ולוא תבוא דמעתך
    kjvRefs:
