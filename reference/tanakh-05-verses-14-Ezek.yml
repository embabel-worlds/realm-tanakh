    text: And the posts thereof were toward the outer court; and palm-trees were upon the posts thereof, on this side, and on that side; and the going up to it had eight steps.
    translation: JPS 1917
    original: ואילו [וְאֵילָיו] לֶחָצֵר הַחִיצוֹנָה וְתִמֹרִים אֶל־אילו [אֵילָיו] מִפּוֹ וּמִפּוֹ וּשְׁמֹנֶה מַעֲלוֹת מעלו [מַעֲלָיו׃]
