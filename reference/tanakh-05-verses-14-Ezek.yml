    book: Ezek
    section: neviim
    chapter: 42
    verse: 5
    ordinal: 13912
    text: Now the upper chambers were shorter; for the galleries took away from these, more than from the lower and the middlemost, in the building.
    translation: JPS 1917
    original: וְהַלְּשָׁכוֹת הָעֶלְיוֹנֹת קְצֻרוֹת כִּי־יוֹכְלוּ אַתִּיקִים מֵהֵנָה מֵהַתַּחְתֹּנוֹת וּמֵהַתִּכֹנוֹת בִּנְיָן׃
    hebrewPlain: והלשכות העליונת קצרות כי יוכלו אתיקים מהנה מהתחתנות ומהתכנות בנין
    kjvRefs:
    - Ezekiel 42:5
    kjvOsis:
    - Ezek.42.5
