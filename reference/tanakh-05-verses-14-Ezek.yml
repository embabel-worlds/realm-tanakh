  data:
    osis: Ezek.14.21
    scripture: tanakh
    name: Tanakh Ezekiel 14:21
    ref: Ezekiel 14:21
    book: Ezek
    section: neviim
    chapter: 14
    verse: 21
    ordinal: 13107
    text: 'For thus saith the Lord GOD: How much more when I send My four sore judgments against Jerusalem, the sword, and the famine, and the evil beasts, and the pestilence, to cut off from it man and beast.'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהֹוִה אַף כִּי־אַרְבַּעַת שְׁפָטַי הָרָעִים חֶרֶב וְרָעָב וְחַיָּה רָעָה וָדֶבֶר שִׁלַּחְתִּי אֶל־יְרוּשָׁלִָם לְהַכְרִית מִמֶּנָּה אָדָם וּבְהֵמָה׃
    hebrewPlain: כי כה אמר אדני יהוה אף כי ארבעת שפטי הרעים חרב ורעב וחיה רעה ודבר שלחתי אל ירושלם להכרית ממנה אדם ובהמה
    kjvRefs:
    - Ezekiel 14:21
    kjvOsis:
    - Ezek.14.21
