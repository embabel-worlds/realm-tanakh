  data:
    osis: Ezek.13.4
    scripture: tanakh
    name: Tanakh Ezekiel 13:4
    ref: Ezekiel 13:4
    book: Ezek
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 13067
    text: O Israel, thy prophets have been like foxes in ruins.
    translation: JPS 1917
    original: כְּשֻׁעָלִים בָּחֳרָבוֹת נְבִיאֶיךָ יִשְׂרָאֵל הָיוּ׃
    hebrewPlain: כשעלים בחרבות נביאיך ישראל היו
    kjvRefs:
