  data:
    osis: Ezek.20.43
    scripture: tanakh
    name: Tanakh Ezekiel 20:43
    ref: Ezekiel 20:43
    book: Ezek
    section: neviim
    chapter: 20
    verse: 43
    ordinal: 13293
    text: And there shall ye remember your ways, and all your doings, wherein ye have polluted yourselves; and ye shall loathe yourselves in your own sight for all your evils that ye have committed.
    translation: JPS 1917
    original: וּזְכַרְתֶּם־שָׁם אֶת־דַּרְכֵיכֶם וְאֵת כָּל־עֲלִילוֹתֵיכֶם אֲשֶׁר נִטְמֵאתֶם בָּם וּנְקֹטֹתֶם בִּפְנֵיכֶם בְּכָל־רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם׃
    hebrewPlain: וזכרתם שם את דרכיכם ואת כל עלילותיכם אשר נטמאתם בם ונקטתם בפניכם בכל רעותיכם אשר עשיתם
    kjvRefs:
    - Ezekiel 20:43
    kjvOsis:
    - Ezek.20.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.44
    scripture: tanakh
    name: Tanakh Ezekiel 20:44
    ref: Ezekiel 20:44
    book: Ezek
    section: neviim
    chapter: 20
    verse: 44
    ordinal: 13294
    text: And ye shall know that I am the LORD, when I have wrought with you for My name’s sake, not according to your evil ways, nor according to your corrupt doings, O ye house of Israel, saith the Lord GOD.’
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי־אֲנִי יְהוָה בַּעֲשׂוֹתִי אִתְּכֶם לְמַעַן שְׁמִי לֹא כְדַרְכֵיכֶם הָרָעִים וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת בֵּית יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: וידעתם כי אני יהוה בעשותי אתכם למען שמי לא כדרכיכם הרעים וכעלילותיכם הנשחתות בית ישראל נאם אדני יהוה
    kjvRefs:
    - Ezekiel 20:44
    kjvOsis:
    - Ezek.20.44
