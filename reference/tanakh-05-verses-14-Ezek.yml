- type: TanakhVerse
  data:
    osis: Ezek.23.2
    scripture: tanakh
    name: Tanakh Ezekiel 23:2
    ref: Ezekiel 23:2
    book: Ezek
    section: neviim
    chapter: 23
    verse: 2
    ordinal: 13364
    text: ’Son of man, there were two women, the daughters of one mother;
    translation: JPS 1917
    original: בֶּן־אָדָם שְׁתַּיִם נָשִׁים בְּנוֹת אֵם־אַחַת הָיוּ׃
    hebrewPlain: בן אדם שתים נשים בנות אם אחת היו
    kjvRefs:
    - Ezekiel 23:2
    kjvOsis:
    - Ezek.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.3
    scripture: tanakh
    name: Tanakh Ezekiel 23:3
    ref: Ezekiel 23:3
    book: Ezek
    section: neviim
    chapter: 23
    verse: 3
    ordinal: 13365
    text: and they committed harlotries in Egypt; they committed harlotries in their youth; there were their bosoms pressed, and there their virgin breasts were bruised.
    translation: JPS 1917
    original: וַתִּזְנֶינָה בְמִצְרַיִם בִּנְעוּרֵיהֶן זָנוּ שָׁמָּה מֹעֲכוּ שְׁדֵיהֶן וְשָׁם עִשּׂוּ דַּדֵּי בְּתוּלֵיהֶן׃
    hebrewPlain: ותזנינה במצרים בנעוריהן זנו שמה מעכו שדיהן ושם עשו דדי בתוליהן
    kjvRefs:
    - Ezekiel 23:3
    kjvOsis:
    - Ezek.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.4
    scripture: tanakh
    name: Tanakh Ezekiel 23:4
    ref: Ezekiel 23:4
    book: Ezek
    section: neviim
    chapter: 23
    verse: 4
    ordinal: 13366
    text: And the names of them were Oholah the elder, and Oholibah her sister; and they became Mine, and they bore sons and daughters. And as for their names, Samaria is Oholah, and Jerusalem Oholibah.
    translation: JPS 1917
    original: וּשְׁמוֹתָן אָהֳלָה הַגְּדוֹלָה וְאָהֳלִיבָה אֲחוֹתָהּ וַתִּהְיֶינָה לִי וַתֵּלַדְנָה בָּנִים וּבָנוֹת וּשְׁמוֹתָן שֹׁמְרוֹן אָהֳלָה וִירוּשָׁלִַם אָהֳלִיבָה׃
    hebrewPlain: ושמותן אהלה הגדולה ואהליבה אחותה ותהיינה לי ותלדנה בנים ובנות ושמותן שמרון אהלה וירושלם אהליבה
    kjvRefs:
    - Ezekiel 23:4
    kjvOsis:
    - Ezek.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.5
    scripture: tanakh
    name: Tanakh Ezekiel 23:5
    ref: Ezekiel 23:5
    book: Ezek
    section: neviim
    chapter: 23
    verse: 5
    ordinal: 13367
    text: And Oholah played the harlot when she was Mine; and she doted on her lovers, on the Assyrians, warriors,
    translation: JPS 1917
    original: וַתִּזֶן אָהֳלָה תַּחְתָּי וַתַּעְגַּב עַל־מְאַהֲבֶיהָ אֶל־אַשּׁוּר קְרוֹבִים׃
    hebrewPlain: ותזן אהלה תחתי ותעגב על מאהביה אל אשור קרובים
    kjvRefs:
    - Ezekiel 23:5
    kjvOsis:
    - Ezek.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.6
    scripture: tanakh
    name: Tanakh Ezekiel 23:6
    ref: Ezekiel 23:6
    book: Ezek
    section: neviim
    chapter: 23
    verse: 6
