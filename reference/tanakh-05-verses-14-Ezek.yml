    verse: 2
    ordinal: 14059
    text: 'And by the border of Dan, from the east side unto the west side: Asher, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל דָּן מִפְּאַת קָדִים עַד־פְּאַת־יָמָּה אָשֵׁר אֶחָד׃
    hebrewPlain: ועל גבול דן מפאת קדים עד פאת ימה אשר אחד
    kjvRefs:
