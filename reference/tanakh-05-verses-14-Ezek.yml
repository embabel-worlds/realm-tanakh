  data:
    osis: Ezek.24.25
    scripture: tanakh
    name: Tanakh Ezekiel 24:25
    ref: Ezekiel 24:25
    book: Ezek
    section: neviim
    chapter: 24
    verse: 25
    ordinal: 13436
    text: And thou, son of man, shall it not be in the day when I take from them their stronghold, the joy of their glory, the desire of their eyes, and the yearning of their soul, their sons and their daughters,
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הֲלוֹא בְּיוֹם קַחְתִּי מֵהֶם אֶת־מָעוּזָּם מְשׂוֹשׂ תִּפְאַרְתָּם אֶת־מַחְמַד עֵינֵיהֶם וְאֶת־מַשָּׂא נַפְשָׁם בְּנֵיהֶם וּבְנוֹתֵיהֶם׃
    hebrewPlain: ואתה בן אדם הלוא ביום קחתי מהם את מעוזם משוש תפארתם את מחמד עיניהם ואת משא נפשם בניהם ובנותיהם
    kjvRefs:
    - Ezekiel 24:25
    kjvOsis:
    - Ezek.24.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
