    scripture: tanakh
    name: Tanakh Ezekiel 42:6
    ref: Ezekiel 42:6
    book: Ezek
    section: neviim
    chapter: 42
    verse: 6
    ordinal: 13913
    text: For they were in three stories, and they had not pillars as the pillars of the courts; therefore room was taken away from the lowest and the middlemost, in comparison with the ground.
    translation: JPS 1917
    original: כִּי מְשֻׁלָּשׁוֹת הֵנָּה וְאֵין לָהֶן עַמּוּדִים כְּעַמּוּדֵי הַחֲצֵרוֹת עַל־כֵּן נֶאֱצַל מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת מֵהָאָרֶץ׃
    hebrewPlain: כי משלשות הנה ואין להן עמודים כעמודי החצרות על כן נאצל מהתחתונות ומהתיכנות מהארץ
    kjvRefs:
    - Ezekiel 42:6
    kjvOsis:
    - Ezek.42.6
