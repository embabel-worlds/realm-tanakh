    scripture: tanakh
    name: Tanakh Ezekiel 23:21
    ref: Ezekiel 23:21
    book: Ezek
    section: neviim
    chapter: 23
    verse: 21
    ordinal: 13383
    text: Thus thou didst call to remembrance the lewdness of thy youth, when they from Egypt bruised thy breasts for the bosom of thy youth.
    translation: JPS 1917
    original: וַתִּפְקְדִי אֵת זִמַּת נְעוּרָיִךְ בַּעְשׂוֹת מִמִּצְרַיִם דַּדַּיִךְ לְמַעַן שְׁדֵי נְעוּרָיִךְ׃
    hebrewPlain: ותפקדי את זמת נעוריך בעשות ממצרים דדיך למען שדי נעוריך
    kjvRefs:
