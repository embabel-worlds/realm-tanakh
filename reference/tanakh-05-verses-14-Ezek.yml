  data:
    osis: Ezek.24.23
    scripture: tanakh
    name: Tanakh Ezekiel 24:23
    ref: Ezekiel 24:23
    book: Ezek
    section: neviim
    chapter: 24
    verse: 23
    ordinal: 13434
    text: and your tires shall be upon your heads, and your shoes upon your feet; ye shall not make lamentation nor weep; but ye shall pine away in your iniquities, and moan one toward another.
    translation: JPS 1917
    original: וּפְאֵרֵכֶם עַל־רָאשֵׁיכֶם וְנַעֲלֵיכֶם בְּרַגְלֵיכֶם לֹא תִסְפְּדוּ וְלֹא תִבְכּוּ וּנְמַקֹּתֶם בַּעֲוֺנֹתֵיכֶם וּנְהַמְתֶּם אִישׁ אֶל־אָחִיו׃
    hebrewPlain: ופארכם על ראשיכם ונעליכם ברגליכם לא תספדו ולא תבכו ונמקתם בעונתיכם ונהמתם איש אל אחיו
    kjvRefs:
    - Ezekiel 24:23
    kjvOsis:
    - Ezek.24.23
