- type: TanakhVerse
  data:
    osis: Ezek.40.48
    scripture: tanakh
    name: Tanakh Ezekiel 40:48
    ref: Ezekiel 40:48
    book: Ezek
    section: neviim
    chapter: 40
    verse: 48
    ordinal: 13880
    text: Then he brought me to the porch of the house, and measured each post of the porch, five cubits on this side, and five cubits on that side; and the breadth of the gate was three cubits on this side, and three cubits on that side.
    translation: JPS 1917
    original: וַיְבִאֵנִי אֶל־אֻלָם הַבַּיִת וַיָּמָד אֵל אֻלָם חָמֵשׁ אַמּוֹת מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה וְרֹחַב הַשַּׁעַר שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ׃
    hebrewPlain: ויבאני אל אלם הבית וימד אל אלם חמש אמות מפה וחמש אמות מפה ורחב השער שלש אמות מפו ושלש אמות מפו
    kjvRefs:
    - Ezekiel 40:48
    kjvOsis:
    - Ezek.40.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.49
    scripture: tanakh
    name: Tanakh Ezekiel 40:49
    ref: Ezekiel 40:49
    book: Ezek
    section: neviim
    chapter: 40
    verse: 49
    ordinal: 13881
    text: The length of the porch was twenty cubits, and the breadth eleven cubits; and it was by steps that it was ascended; and there were pillars by the posts, one on this side, and another on that side.
    translation: JPS 1917
    original: אֹרֶךְ הָאֻלָם עֶשְׂרִים אַמָּה וְרֹחַב עַשְׁתֵּי עֶשְׂרֵה אַמָּה וּבַמַּעֲלוֹת אֲשֶׁר יַעֲלוּ אֵלָיו וְעַמֻּדִים אֶל־הָאֵילִים אֶחָד מִפֹּה וְאֶחָד מִפֹּה׃
    hebrewPlain: ארך האלם עשרים אמה ורחב עשתי עשרה אמה ובמעלות אשר יעלו אליו ועמדים אל האילים אחד מפה ואחד מפה
    kjvRefs:
    - Ezekiel 40:49
    kjvOsis:
    - Ezek.40.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.41.1
    scripture: tanakh
    name: Tanakh Ezekiel 41:1
    ref: Ezekiel 41:1
    book: Ezek
    section: neviim
    chapter: 41
    verse: 1
    ordinal: 13882
    text: And he brought me to athe temple, and measured the posts, six cubits broad on the one side, and six cubits broad on the other side, which was the breadth of the tent.
    translation: JPS 1917
    original: וַיְבִיאֵנִי אֶל־הַהֵיכָל וַיָּמָד אֶת־הָאֵילִים שֵׁשׁ־אַמּוֹת רֹחַב־מִפּוֹ וְשֵׁשׁ־אַמּוֹת־רֹחַב מִפּוֹ רֹחַב הָאֹהֶל׃
    hebrewPlain: ויביאני אל ההיכל וימד את האילים שש אמות רחב מפו ושש אמות רחב מפו רחב האהל
    kjvRefs:
    - Ezekiel 41:1
    kjvOsis:
    - Ezek.41.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.2
    scripture: tanakh
    name: Tanakh Ezekiel 41:2
    ref: Ezekiel 41:2
    book: Ezek
    section: neviim
    chapter: 41
    verse: 2
    ordinal: 13883
    text: And the breadth of the entrance was ten cubits; and the sides of the entrance were five cubits on the one side, and five cubits on the other side; and he measured the length thereof, forty cubits, and the breadth, twenty cubits.
    translation: JPS 1917
    original: וְרֹחַב הַפֶּתַח עֶשֶׂר אַמּוֹת וְכִתְפוֹת הַפֶּתַח חָמֵשׁ אַמּוֹת מִפּוֹ וְחָמֵשׁ אַמּוֹת מִפּוֹ וַיָּמָד אָרְכּוֹ אַרְבָּעִים אַמָּה וְרֹחַב עֶשְׂרִים אַמָּה׃
    hebrewPlain: ורחב הפתח עשר אמות וכתפות הפתח חמש אמות מפו וחמש אמות מפו וימד ארכו ארבעים אמה ורחב עשרים אמה
    kjvRefs:
    - Ezekiel 41:2
    kjvOsis:
    - Ezek.41.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.3
    scripture: tanakh
    name: Tanakh Ezekiel 41:3
    ref: Ezekiel 41:3
    book: Ezek
    section: neviim
    chapter: 41
    verse: 3
    ordinal: 13884
    text: Then went he inward, and measured each post of the entrance, two cubits; and the entrance, six cubits; and the breadth of the entrance, seven cubits.
    translation: JPS 1917
    original: וּבָא לִפְנִימָה וַיָּמָד אֵיל־הַפֶּתַח שְׁתַּיִם אַמּוֹת וְהַפֶּתַח שֵׁשׁ אַמּוֹת וְרֹחַב הַפֶּתַח שֶׁבַע אַמּוֹת׃
    hebrewPlain: ובא לפנימה וימד איל הפתח שתים אמות והפתח שש אמות ורחב הפתח שבע אמות
    kjvRefs:
    - Ezekiel 41:3
    kjvOsis:
    - Ezek.41.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.4
    scripture: tanakh
    name: Tanakh Ezekiel 41:4
    ref: Ezekiel 41:4
    book: Ezek
    section: neviim
    chapter: 41
    verse: 4
    ordinal: 13885
    text: 'And he measured the length thereof, twenty cubits, and the breadth, twenty cubits, before the temple; and he said unto me: ‘This is the most holy place.’'
    translation: JPS 1917
    original: וַיָּמָד אֶת־אָרְכּוֹ עֶשְׂרִים אַמָּה וְרֹחַב עֶשְׂרִים אַמָּה אֶל־פְּנֵי הַהֵיכָל וַיֹּאמֶר אֵלַי זֶה קֹדֶשׁ הַקֳּדָשִׁים׃
    hebrewPlain: וימד את ארכו עשרים אמה ורחב עשרים אמה אל פני ההיכל ויאמר אלי זה קדש הקדשים
    kjvRefs:
    - Ezekiel 41:4
    kjvOsis:
    - Ezek.41.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.5
    scripture: tanakh
    name: Tanakh Ezekiel 41:5
    ref: Ezekiel 41:5
    book: Ezek
    section: neviim
    chapter: 41
    verse: 5
    ordinal: 13886
    text: Then he measured the wall of the house, six cubits; and the breadth of every side-chamber, four cubits, round about the house on every side.
    translation: JPS 1917
    original: וַיָּמָד קִיר־הַבַּיִת שֵׁשׁ אַמּוֹת וְרֹחַב הַצֵּלָע אַרְבַּע אַמּוֹת סָבִיב סָבִיב לַבַּיִת סָבִיב׃
    hebrewPlain: וימד קיר הבית שש אמות ורחב הצלע ארבע אמות סביב סביב לבית סביב
    kjvRefs:
    - Ezekiel 41:5
    kjvOsis:
    - Ezek.41.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.6
    scripture: tanakh
    name: Tanakh Ezekiel 41:6
    ref: Ezekiel 41:6
    book: Ezek
    section: neviim
    chapter: 41
    verse: 6
    ordinal: 13887
    text: And the side-chambers were one over another, three and thirty times; and there were cornices in the wall which belonged to the house for the side-chambers round about, that they might have hold therein, and not have hold in the wall of the house.
    translation: JPS 1917
    original: וְהַצְּלָעוֹת צֵלָע אֶל־צֵלָע שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים וּבָאוֹת בַּקִּיר אֲשֶׁר־לַבַּיִת לַצְּלָעוֹת סָבִיב סָבִיב לִהְיוֹת אֲחוּזִים וְלֹא־יִהְיוּ אֲחוּזִים בְּקִיר הַבָּיִת׃
    hebrewPlain: והצלעות צלע אל צלע שלוש ושלשים פעמים ובאות בקיר אשר לבית לצלעות סביב סביב להיות אחוזים ולא יהיו אחוזים בקיר הבית
    kjvRefs:
    - Ezekiel 41:6
    kjvOsis:
    - Ezek.41.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.7
    scripture: tanakh
    name: Tanakh Ezekiel 41:7
    ref: Ezekiel 41:7
    book: Ezek
    section: neviim
    chapter: 41
    verse: 7
    ordinal: 13888
    text: And the side-chambers were broader as they wound about higher and higher; for the winding about of the house went higher and higher round about the house; therefore the breadth of the house continued upward; and so one went up from the lowest row to the highest by the middle.
    translation: JPS 1917
    original: וְרָחֲבָה וְנָסְבָה לְמַעְלָה לְמַעְלָה לַצְּלָעוֹת כִּי מוּסַב־הַבַּיִת לְמַעְלָה לְמַעְלָה סָבִיב סָבִיב לַבַּיִת עַל־כֵּן רֹחַב־לַבַּיִת לְמָעְלָה וְכֵן הַתַּחְתּוֹנָה יַעֲלֶה עַל־הָעֶלְיוֹנָה לַתִּיכוֹנָה׃
    hebrewPlain: ורחבה ונסבה למעלה למעלה לצלעות כי מוסב הבית למעלה למעלה סביב סביב לבית על כן רחב לבית למעלה וכן התחתונה יעלה על העליונה לתיכונה
    kjvRefs:
    - Ezekiel 41:7
    kjvOsis:
    - Ezek.41.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.8
    scripture: tanakh
    name: Tanakh Ezekiel 41:8
    ref: Ezekiel 41:8
    book: Ezek
    section: neviim
    chapter: 41
    verse: 8
    ordinal: 13889
    text: I saw also that the house had a raised basement round about; the foundations of the side-chambers were a full reed of six cubits to the joining.
    translation: JPS 1917
    original: וְרָאִיתִי לַבַּיִת גֹּבַהּ סָבִיב סָבִיב מיסדות [מוּסְדוֹת] הַצְּלָעוֹת מְלוֹ הַקָּנֶה שֵׁשׁ אַמּוֹת אַצִּילָה׃
    hebrewPlain: וראיתי לבית גבה סביב סביב מיסדות [מוסדות] הצלעות מלו הקנה שש אמות אצילה
    kjvRefs:
    - Ezekiel 41:8
    kjvOsis:
    - Ezek.41.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.9
    scripture: tanakh
    name: Tanakh Ezekiel 41:9
    ref: Ezekiel 41:9
    book: Ezek
    section: neviim
    chapter: 41
    verse: 9
    ordinal: 13890
    text: The breadth of the outer wall which belonged to the side-chambers was five cubits; and so that which was left by the structure of the side-chambers that belonged to the house.
    translation: JPS 1917
    original: רֹחַב הַקִּיר אֲ‍שֶׁר־לַצֵּלָע אֶל־הַחוּץ חָמֵשׁ אַמּוֹת וַאֲשֶׁר מֻנָּח בֵּית צְלָעוֹת אֲשֶׁר לַבָּיִת׃
    hebrewPlain: רחב הקיר א‍שר לצלע אל החוץ חמש אמות ואשר מנח בית צלעות אשר לבית
    kjvRefs:
    - Ezekiel 41:9
    kjvOsis:
    - Ezek.41.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.10
    scripture: tanakh
    name: Tanakh Ezekiel 41:10
    ref: Ezekiel 41:10
    book: Ezek
    section: neviim
    chapter: 41
    verse: 10
    ordinal: 13891
    text: And between the chambers was a breadth of twenty cubits round about the house on every side.
    translation: JPS 1917
    original: וּבֵין הַלְּשָׁכוֹת רֹחַב עֶשְׂרִים אַמָּה סָבִיב לַבַּיִת סָבִיב סָבִיב׃
    hebrewPlain: ובין הלשכות רחב עשרים אמה סביב לבית סביב סביב
    kjvRefs:
    - Ezekiel 41:10
    kjvOsis:
    - Ezek.41.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.11
    scripture: tanakh
    name: Tanakh Ezekiel 41:11
    ref: Ezekiel 41:11
    book: Ezek
    section: neviim
    chapter: 41
    verse: 11
    ordinal: 13892
    text: And the doors of the side-chambers were toward the place that was left, one door toward the north, and another door toward the south; and the breadth of the place that was left was five cubits round about.
    translation: JPS 1917
    original: וּפֶתַח הַצֵּלָע לַמֻּנָּח פֶּתַח אֶחָד דֶּרֶךְ הַצָּפוֹן וּפֶתַח אֶחָד לַדָּרוֹם וְרֹחַב מְקוֹם הַמֻּנָּח חָמֵשׁ אַמּוֹת סָבִיב סָבִיב׃
    hebrewPlain: ופתח הצלע למנח פתח אחד דרך הצפון ופתח אחד לדרום ורחב מקום המנח חמש אמות סביב סביב
    kjvRefs:
    - Ezekiel 41:11
    kjvOsis:
    - Ezek.41.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.12
    scripture: tanakh
    name: Tanakh Ezekiel 41:12
    ref: Ezekiel 41:12
    book: Ezek
    section: neviim
    chapter: 41
    verse: 12
    ordinal: 13893
    text: And the building that was before the separate place at the side toward the west was seventy cubits broad; and the wall of the building was five cubits thick round about, and the length thereof ninety cubits.
    translation: JPS 1917
    original: וְהַבִּנְיָן אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה פְּאַת דֶּרֶךְ־הַיָּם רֹחַב שִׁבְעִים אַמָּה וְקִיר הַבִּנְיָן חָמֵשׁ־אַמּוֹת רֹחַב סָבִיב סָבִיב וְאָרְכּוֹ תִּשְׁעִים אַמָּה׃
    hebrewPlain: והבנין אשר אל פני הגזרה פאת דרך הים רחב שבעים אמה וקיר הבנין חמש אמות רחב סביב סביב וארכו תשעים אמה
    kjvRefs:
    - Ezekiel 41:12
    kjvOsis:
    - Ezek.41.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.13
    scripture: tanakh
    name: Tanakh Ezekiel 41:13
    ref: Ezekiel 41:13
    book: Ezek
    section: neviim
    chapter: 41
    verse: 13
    ordinal: 13894
    text: And he measured the house, a hundred cubits long; and the separate place, and the building, with the walls thereof, a hundred cubits long;
    translation: JPS 1917
    original: וּמָדַד אֶת־הַבַּיִת אֹרֶךְ מֵאָה אַמָּה וְהַגִּזְרָה וְהַבִּנְיָה וְקִירוֹתֶיהָ אֹרֶךְ מֵאָה אַמָּה׃
    hebrewPlain: ומדד את הבית ארך מאה אמה והגזרה והבניה וקירותיה ארך מאה אמה
    kjvRefs:
    - Ezekiel 41:13
    kjvOsis:
    - Ezek.41.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.14
    scripture: tanakh
    name: Tanakh Ezekiel 41:14
    ref: Ezekiel 41:14
    book: Ezek
    section: neviim
    chapter: 41
    verse: 14
    ordinal: 13895
    text: also the breadth of the face of the house and of the separate place toward the east, a hundred cubits.
    translation: JPS 1917
    original: וְרֹחַב פְּנֵי הַבַּיִת וְהַגִּזְרָה לַקָּדִים מֵאָה אַמָּה׃
    hebrewPlain: ורחב פני הבית והגזרה לקדים מאה אמה
    kjvRefs:
    - Ezekiel 41:14
    kjvOsis:
    - Ezek.41.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
- type: TanakhVerse
  data:
    osis: Ezek.41.15
    scripture: tanakh
    name: Tanakh Ezekiel 41:15
    ref: Ezekiel 41:15
    book: Ezek
    section: neviim
    chapter: 41
    verse: 15
    ordinal: 13896
    text: And he measured the length of the building before the separate place which was at the back thereof, and the galleries thereof on the one side and on the other side, a hundred cubits. Now the temple, and the inner place, and the porches of the court,
    translation: JPS 1917
    original: וּמָדַד אֹרֶךְ־הַבִּנְיָן אֶל־פְּנֵי הַגִּזְרָה אֲשֶׁר עַל־אַחֲרֶיהָ ואתוקיהא [וְאַתִּיקֶיהָא] מִפּוֹ וּמִפּוֹ מֵאָה אַמָּה וְהַהֵיכָל הַפְּנִימִי וְאֻלַמֵּי הֶחָצֵר׃
    hebrewPlain: ומדד ארך הבנין אל פני הגזרה אשר על אחריה ואתוקיהא [ואתיקיהא] מפו ומפו מאה אמה וההיכל הפנימי ואלמי החצר
    kjvRefs:
    - Ezekiel 41:15
    kjvOsis:
    - Ezek.41.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.41
