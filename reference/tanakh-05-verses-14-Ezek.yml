  data:
    osis: Ezek.32.22
    scripture: tanakh
    name: Tanakh Ezekiel 32:22
    ref: Ezekiel 32:22
    book: Ezek
    section: neviim
    chapter: 32
    verse: 22
    ordinal: 13625
    text: Asshur is there and all her company; their graves are round about them; all of them slain, fallen by the sword;
    translation: JPS 1917
    original: שָׁם אַשּׁוּר וְכָל־קְהָלָהּ סְבִיבוֹתָיו קִבְרֹתָיו כֻּלָּם חֲלָלִים הַנֹּפְלִים בֶּחָרֶב׃
