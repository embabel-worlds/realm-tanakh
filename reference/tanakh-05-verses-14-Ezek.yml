  data:
    osis: Ezek.24.12
    scripture: tanakh
    name: Tanakh Ezekiel 24:12
    ref: Ezekiel 24:12
    book: Ezek
    section: neviim
    chapter: 24
    verse: 12
    ordinal: 13423
    text: It hath wearied itself with toil; yet its great filth goeth not forth out of it, yea, its noisome filth.
    translation: JPS 1917
    original: תְּאֻנִים הֶלְאָת וְלֹא־תֵצֵא מִמֶּנָּה רַבַּת חֶלְאָתָהּ בְּאֵשׁ חֶלְאָתָהּ׃
    hebrewPlain: תאנים הלאת ולא תצא ממנה רבת חלאתה באש חלאתה
