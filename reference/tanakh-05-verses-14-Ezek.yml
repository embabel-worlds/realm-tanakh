    ordinal: 13099
    text: ’Son of man, when a land sinneth against Me by trespassing grievously, and I stretch out My hand upon it, and break the staff of the bread thereof, and send famine upon it, and cut off from it man and beast;
    translation: JPS 1917
    original: בֶּן־אָדָם אֶרֶץ כִּי תֶחֱטָא־לִי לִמְעָל־מַעַל וְנָטִיתִי יָדִי עָלֶיהָ וְשָׁבַרְתִּי לָהּ מַטֵּה־לָחֶם וְהִשְׁלַחְתִּי־בָהּ רָעָב וְהִכְרַתִּי מִמֶּנָּה אָדָם וּבְהֵמָה׃
    hebrewPlain: בן אדם ארץ כי תחטא לי למעל מעל ונטיתי ידי עליה ושברתי לה מטה לחם והשלחתי בה רעב והכרתי ממנה אדם ובהמה
    kjvRefs:
