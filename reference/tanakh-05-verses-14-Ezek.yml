    name: Tanakh Ezekiel 18:15
    ref: Ezekiel 18:15
    book: Ezek
    section: neviim
    chapter: 18
    verse: 15
    ordinal: 13219
    text: that hath not eaten upon the mountains, neither hath lifted up his eyes to the idols of the house of Israel, hath not defiled his neighbour’s wife,
    translation: JPS 1917
    original: עַל־הֶהָרִים לֹא אָכָל וְעֵינָיו לֹא נָשָׂא אֶל־גִּלּוּלֵי בֵּית יִשְׂרָאֵל אֶת־אֵשֶׁת רֵעֵהוּ לֹא טִמֵּא׃
    hebrewPlain: על ההרים לא אכל ועיניו לא נשא אל גלולי בית ישראל את אשת רעהו לא טמא
    kjvRefs:
