  data:
    osis: Ezek.18.11
    scripture: tanakh
    name: Tanakh Ezekiel 18:11
    ref: Ezekiel 18:11
    book: Ezek
    section: neviim
    chapter: 18
    verse: 11
    ordinal: 13215
    text: whereas he himself had not done any of these things, for he hath even eaten upon the mountains, and defiled his neighbour’s wife,
    translation: JPS 1917
    original: וְהוּא אֶת־כָּל־אֵלֶּה לֹא עָשָׂה כִּי גַם אֶל־הֶהָרִים אָכַל וְאֶת־אֵשֶׁת רֵעֵהוּ טִמֵּא׃
    hebrewPlain: והוא את כל אלה לא עשה כי גם אל ההרים אכל ואת אשת רעהו טמא
    kjvRefs:
