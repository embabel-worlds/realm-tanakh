  data:
    osis: Ezek.21.21
    scripture: tanakh
    name: Tanakh Ezekiel 21:21
    ref: Ezekiel 21:21
    book: Ezek
    section: neviim
    chapter: 21
    verse: 21
    ordinal: 13315
    text: Go thee one way to the right, or direct thyself to the left; whither is thy face set?
    translation: JPS 1917
    original: הִתְאַחֲדִי הֵימִנִי הָשִׂימִי הַשְׂמִילִי אָנָה פָּנַיִךְ מֻעָדוֹת׃
    hebrewPlain: התאחדי הימני השימי השמילי אנה פניך מעדות
    kjvRefs:
