    name: Tanakh Ezekiel 42:13
    ref: Ezekiel 42:13
    book: Ezek
    section: neviim
    chapter: 42
    verse: 13
    ordinal: 13920
    text: 'Then said he unto me: ‘The north chambers and the south chambers, which are before the separate place, they are the holy chambers, where the priests that are near unto the LORD shall eat the most holy things; there shall they lay the most holy things, and the meal-offering, and the sin-offering, and the guilt-offering; for the place is holy.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי לִשְׁכוֹת הַצָּפוֹן לִשְׁכוֹת הַדָּרוֹם אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה הֵנָּה לִשְׁכוֹת הַקֹּדֶשׁ אֲשֶׁר יֹאכְלוּ־שָׁם הַכֹּהֲנִים אֲשֶׁר־קְרוֹבִים לַיהוָה קָדְשֵׁי הַקֳּדָשִׁים שָׁם יַנִּיחוּ קָדְשֵׁי הַקֳּדָשִׁים וְהַמִּנְחָה וְהַחַטָּאת וְהָאָשָׁם כִּי הַמָּקוֹם קָדֹשׁ׃
    hebrewPlain: ויאמר אלי לשכות הצפון לשכות הדרום אשר אל פני הגזרה הנה לשכות הקדש אשר יאכלו שם הכהנים אשר קרובים ליהוה קדשי הקדשים שם יניחו קדשי הקדשים והמנחה והחטאת והאשם כי המקום קדש
    kjvRefs:
    - Ezekiel 42:13
    kjvOsis:
    - Ezek.42.13
