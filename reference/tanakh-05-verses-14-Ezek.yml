    original: יַעַן בְּמִשְׁפָּטַי מָאָסוּ וְאֶת־חֻקּוֹתַי לֹא־הָלְכוּ בָהֶם וְאֶת־שַׁבְּתוֹתַי חִלֵּלוּ כִּי אַחֲרֵי גִלּוּלֵיהֶם לִבָּם הֹלֵךְ׃
