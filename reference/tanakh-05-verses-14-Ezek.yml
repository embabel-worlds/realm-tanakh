  data:
    osis: Ezek.28.5
    scripture: tanakh
    name: Tanakh Ezekiel 28:5
    ref: Ezekiel 28:5
    book: Ezek
    section: neviim
    chapter: 28
    verse: 5
    ordinal: 13517
    text: In thy great wisdom by thy traffic Hast thou increased thy riches, And thy heart is lifted up because of thy riches—
    translation: JPS 1917
    original: בְּרֹב חָכְמָתְךָ בִּרְכֻלָּתְךָ הִרְבִּיתָ חֵילֶךָ וַיִּגְבַּהּ לְבָבְךָ בְּחֵילֶךָ׃
    hebrewPlain: ברב חכמתך ברכלתך הרבית חילך ויגבה לבבך בחילך
    kjvRefs:
