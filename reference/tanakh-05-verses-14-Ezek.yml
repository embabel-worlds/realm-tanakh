    ref: Ezekiel 41:25
    book: Ezek
    section: neviim
    chapter: 41
    verse: 25
    ordinal: 13906
    text: And there were made on them, on the doors of the temple, cherubim and palm-trees, like as were made upon the walls; and there were thick beams of wood upon the face of the porch without.
    translation: JPS 1917
    original: וַעֲשׂוּיָה אֲלֵיהֶן אֶל־דַּלְתוֹת הַהֵיכָל כְּרוּבִים וְתִמֹרִים כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת וְעָב עֵץ אֶל־פְּנֵי הָאוּלָם מֵהַחוּץ׃
    hebrewPlain: ועשויה אליהן אל דלתות ההיכל כרובים ותמרים כאשר עשוים לקירות ועב עץ אל פני האולם מהחוץ
    kjvRefs:
