  data:
    osis: Ezek.28.21
    scripture: tanakh
    name: Tanakh Ezekiel 28:21
    ref: Ezekiel 28:21
    book: Ezek
    section: neviim
    chapter: 28
    verse: 21
    ordinal: 13533
    text: ’Son of man, set thy face toward Zidon, and prophesy against it,
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ אֶל־צִידוֹן וְהִנָּבֵא עָלֶיהָ׃
    hebrewPlain: בן אדם שים פניך אל צידון והנבא עליה
    kjvRefs:
    - Ezekiel 28:21
    kjvOsis:
    - Ezek.28.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.22
    scripture: tanakh
    name: Tanakh Ezekiel 28:22
    ref: Ezekiel 28:22
    book: Ezek
    section: neviim
    chapter: 28
    verse: 22
    ordinal: 13534
    text: 'and say: Thus saith the Lord GOD: Behold, I am against thee, O Zidon, And I will be glorified in the midst of thee; And they shall know that I am the LORD, when I shall have executed judgments in her, and shall be sanctified in her.'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי עָלַיִךְ צִידוֹן וְנִכְבַּדְתִּי בְּתוֹכֵךְ וְיָדְעוּ כִּי־אֲנִי יְהוָה בַּעֲשׂוֹתִי בָהּ שְׁפָטִים וְנִקְדַּשְׁתִּי בָהּ׃
    hebrewPlain: ואמרת כה אמר אדני יהוה הנני עליך צידון ונכבדתי בתוכך וידעו כי אני יהוה בעשותי בה שפטים ונקדשתי בה
    kjvRefs:
    - Ezekiel 28:22
    kjvOsis:
    - Ezek.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.23
    scripture: tanakh
    name: Tanakh Ezekiel 28:23
    ref: Ezekiel 28:23
    book: Ezek
    section: neviim
    chapter: 28
    verse: 23
    ordinal: 13535
    text: For I will send into her pestilence And blood in her streets; And the wounded shall fall in the midst of her By the sword upon her on every side; and they shall know that I am the LORD.
    translation: JPS 1917
    original: וְשִׁלַּחְתִּי־בָהּ דֶּבֶר וָדָם בְּחוּצוֹתֶיהָ וְנִפְלַל חָלָל בְּתוֹכָהּ בְּחֶרֶב עָלֶיהָ מִסָּבִיב וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ושלחתי בה דבר ודם בחוצותיה ונפלל חלל בתוכה בחרב עליה מסביב וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 28:23
    kjvOsis:
    - Ezek.28.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.24
    scripture: tanakh
    name: Tanakh Ezekiel 28:24
    ref: Ezekiel 28:24
    book: Ezek
    section: neviim
    chapter: 28
    verse: 24
    ordinal: 13536
    text: And there shall be no more a pricking brier unto the house of Israel, nor a piercing thorn of any that are round about them, that did have them in disdain; and they shall know that I am the Lord GOD.
    translation: JPS 1917
    original: וְלֹא־יִהְיֶה עוֹד לְבֵית יִשְׂרָאֵל סִלּוֹן מַמְאִיר וְקוֹץ מַכְאִב מִכֹּל סְבִיבֹתָם הַשָּׁאטִים אוֹתָם וְיָדְעוּ כִּי אֲנִי אֲדֹנָי יְהוִה׃
    hebrewPlain: ולא יהיה עוד לבית ישראל סלון ממאיר וקוץ מכאב מכל סביבתם השאטים אותם וידעו כי אני אדני יהוה
    kjvRefs:
    - Ezekiel 28:24
    kjvOsis:
    - Ezek.28.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.25
    scripture: tanakh
    name: Tanakh Ezekiel 28:25
    ref: Ezekiel 28:25
    book: Ezek
    section: neviim
    chapter: 28
    verse: 25
    ordinal: 13537
    text: 'Thus saith the Lord GOD: When I shall have gathered the house of Israel from the peoples among whom they are scattered, and shall be sanctified in them in the sight of the nations, then shall they dwell in their own land which I gave to My servant Jacob.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה בְּקַבְּצִי אֶת־בֵּית יִשְׂרָאֵל מִן־הָעַמִּים אֲשֶׁר נָפֹצוּ בָם וְנִקְדַּשְׁתִּי בָם לְעֵינֵי הַגּוֹיִם וְיָשְׁבוּ עַל־אַדְמָתָם אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב׃
    hebrewPlain: כה אמר אדני יהוה בקבצי את בית ישראל מן העמים אשר נפצו בם ונקדשתי בם לעיני הגוים וישבו על אדמתם אשר נתתי לעבדי ליעקב
    kjvRefs:
    - Ezekiel 28:25
    kjvOsis:
    - Ezek.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.26
    scripture: tanakh
    name: Tanakh Ezekiel 28:26
    ref: Ezekiel 28:26
    book: Ezek
    section: neviim
    chapter: 28
    verse: 26
    ordinal: 13538
    text: And they shall dwell safely therein, and shall build houses, and plant vineyards; yea, they shall dwell safely; when I have executed judgments upon all those that have them in disdain round about them; and they shall know that I am the LORD their God.’
    translation: JPS 1917
    original: וְיָשְׁבוּ עָלֶיהָ לָבֶטַח וּבָנוּ בָתִּים וְנָטְעוּ כְרָמִים וְיָשְׁבוּ לָבֶטַח בַּעֲשׂוֹתִי שְׁפָטִים בְּכֹל הַשָּׁאטִים אֹתָם מִסְּבִיבוֹתָם וְיָדְעוּ כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: וישבו עליה לבטח ובנו בתים ונטעו כרמים וישבו לבטח בעשותי שפטים בכל השאטים אתם מסביבותם וידעו כי אני יהוה אלהיהם
    kjvRefs:
    - Ezekiel 28:26
    kjvOsis:
    - Ezek.28.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.29.1
    scripture: tanakh
    name: Tanakh Ezekiel 29:1
    ref: Ezekiel 29:1
    book: Ezek
    section: neviim
    chapter: 29
    verse: 1
    ordinal: 13539
    text: 'In the tenth year, in the tenth month, in the twelfth day of the month, the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: בַּשָּׁנָה הָעֲשִׂירִית בָּעֲשִׂרִי בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: בשנה העשירית בעשרי בשנים עשר לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 29:1
    kjvOsis:
    - Ezek.29.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.2
    scripture: tanakh
    name: Tanakh Ezekiel 29:2
    ref: Ezekiel 29:2
    book: Ezek
    section: neviim
    chapter: 29
    verse: 2
    ordinal: 13540
    text: ’Son of man, set thy face against Pharaoh king of Egypt, and prophesy against him, and against all Egypt;
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ עַל־פַּרְעֹה מֶלֶךְ מִצְרָיִם וְהִנָּבֵא עָלָיו וְעַל־מִצְרַיִם כֻּלָּהּ׃
    hebrewPlain: בן אדם שים פניך על פרעה מלך מצרים והנבא עליו ועל מצרים כלה
    kjvRefs:
    - Ezekiel 29:2
    kjvOsis:
    - Ezek.29.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.3
    scripture: tanakh
    name: Tanakh Ezekiel 29:3
    ref: Ezekiel 29:3
    book: Ezek
    section: neviim
    chapter: 29
    verse: 3
    ordinal: 13541
    text: 'speak, and say: Thus saith the Lord GOD: Behold, I am against thee, Pharaoh King of Egypt, The great dragon that lieth In the midst of his rivers, That hath said: My river is mine own, And I have made it for myself.'
    translation: JPS 1917
    original: דַּבֵּר וְאָמַרְתָּ כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי עָלֶיךָ פַּרְעֹה מֶלֶךְ־מִצְרַיִם הַתַּנִּים הַגָּדוֹל הָרֹבֵץ בְּתוֹךְ יְאֹרָיו אֲשֶׁר אָמַר לִי יְאֹרִי וַאֲנִי עֲשִׂיתִנִי׃
    hebrewPlain: דבר ואמרת כה אמר אדני יהוה הנני עליך פרעה מלך מצרים התנים הגדול הרבץ בתוך יאריו אשר אמר לי יארי ואני עשיתני
    kjvRefs:
    - Ezekiel 29:3
    kjvOsis:
    - Ezek.29.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.4
    scripture: tanakh
    name: Tanakh Ezekiel 29:4
    ref: Ezekiel 29:4
    book: Ezek
    section: neviim
    chapter: 29
    verse: 4
    ordinal: 13542
    text: And I will put hooks in thy jaws, and I will cause the fish of thy rivers to stick unto thy scales; and I will bring thee up out of the midst of thy rivers, and all the fish of thy rivers shall stick unto thy scales.
    translation: JPS 1917
    original: וְנָתַתִּי חחיים [חַחִים] בִּלְחָיֶיךָ וְהִדְבַּקְתִּי דְגַת־יְאֹרֶיךָ בְּקַשְׂקְשֹׂתֶיךָ וְהַעֲלִיתִיךָ מִתּוֹךְ יְאֹרֶיךָ וְאֵת כָּל־דְּגַת יְאֹרֶיךָ בְּקַשְׂקְשֹׂתֶיךָ תִּדְבָּק׃
    hebrewPlain: ונתתי חחיים [חחים] בלחייך והדבקתי דגת יאריך בקשקשתיך והעליתיך מתוך יאריך ואת כל דגת יאריך בקשקשתיך תדבק
    kjvRefs:
    - Ezekiel 29:4
    kjvOsis:
    - Ezek.29.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.5
    scripture: tanakh
    name: Tanakh Ezekiel 29:5
    ref: Ezekiel 29:5
    book: Ezek
    section: neviim
    chapter: 29
    verse: 5
    ordinal: 13543
    text: And I will cast thee into the wilderness, Thee and all the fish of thy rivers; Thou shalt fall upon the open field; Thou shalt not be brought together, nor gathered; To the beasts of the earth and to the fowls of the heaven Have I given thee for food.
    translation: JPS 1917
    original: וּנְטַשְׁתִּיךָ הַמִּדְבָּרָה אוֹתְךָ וְאֵת כָּל־דְּגַת יְאֹרֶיךָ עַל־פְּנֵי הַשָּׂדֶה תִּפּוֹל לֹא תֵאָסֵף וְלֹא תִקָּבֵץ לְחַיַּת הָאָרֶץ וּלְעוֹף הַשָּׁמַיִם נְתַתִּיךָ לְאָכְלָה׃
    hebrewPlain: ונטשתיך המדברה אותך ואת כל דגת יאריך על פני השדה תפול לא תאסף ולא תקבץ לחית הארץ ולעוף השמים נתתיך לאכלה
    kjvRefs:
    - Ezekiel 29:5
    kjvOsis:
    - Ezek.29.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.6
    scripture: tanakh
    name: Tanakh Ezekiel 29:6
    ref: Ezekiel 29:6
    book: Ezek
    section: neviim
    chapter: 29
    verse: 6
    ordinal: 13544
    text: And all the inhabitants of Egypt shall know That I am the LORD, Because they have been a staff of reed To the house of Israel.
    translation: JPS 1917
    original: וְיָדְעוּ כָּל־יֹשְׁבֵי מִצְרַיִם כִּי אֲנִי יְהוָה יַעַן הֱיוֹתָם מִשְׁעֶנֶת קָנֶה לְבֵית יִשְׂרָאֵל׃
    hebrewPlain: וידעו כל ישבי מצרים כי אני יהוה יען היותם משענת קנה לבית ישראל
    kjvRefs:
    - Ezekiel 29:6
    kjvOsis:
    - Ezek.29.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.7
    scripture: tanakh
    name: Tanakh Ezekiel 29:7
    ref: Ezekiel 29:7
    book: Ezek
    section: neviim
    chapter: 29
    verse: 7
    ordinal: 13545
    text: When they take hold of thee with the hand, thou dost break, And rend all their shoulders; And when they lean upon thee, thou breakest, And makest all their loins to be at a stand.
    translation: JPS 1917
    original: בְּתָפְשָׂם בְּךָ בכפך [בַכַּף] תֵּרוֹץ וּבָקַעְתָּ לָהֶם כָּל־כָּתֵף וּבְהִשָּׁעֲנָם עָלֶיךָ תִּשָּׁבֵר וְהַעֲמַדְתָּ לָהֶם כָּל־מָתְנָיִם׃
    hebrewPlain: בתפשם בך בכפך [בכף] תרוץ ובקעת להם כל כתף ובהשענם עליך תשבר והעמדת להם כל מתנים
    kjvRefs:
    - Ezekiel 29:7
    kjvOsis:
    - Ezek.29.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.8
    scripture: tanakh
    name: Tanakh Ezekiel 29:8
    ref: Ezekiel 29:8
    book: Ezek
    section: neviim
    chapter: 29
    verse: 8
    ordinal: 13546
    text: 'Therefore thus saith the Lord GOD: Behold, I will bring a sword upon thee, and will cut off from thee man and beast.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי מֵבִיא עָלַיִךְ חָרֶב וְהִכְרַתִּי מִמֵּךְ אָדָם וּבְהֵמָה׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני מביא עליך חרב והכרתי ממך אדם ובהמה
    kjvRefs:
    - Ezekiel 29:8
    kjvOsis:
    - Ezek.29.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.9
    scripture: tanakh
    name: Tanakh Ezekiel 29:9
    ref: Ezekiel 29:9
    book: Ezek
    section: neviim
    chapter: 29
    verse: 9
    ordinal: 13547
    text: 'And the land of Egypt shall be desolate and waste, and they shall know that I am the LORD; because he hath said: The river is mine, and I have made it.'
    translation: JPS 1917
    original: וְהָיְתָה אֶרֶץ־מִצְרַיִם לִשְׁמָמָה וְחָרְבָּה וְיָדְעוּ כִּי־אֲנִי יְהוָה יַעַן אָמַר יְאֹר לִי וַאֲנִי עָשִׂיתִי׃
    hebrewPlain: והיתה ארץ מצרים לשממה וחרבה וידעו כי אני יהוה יען אמר יאר לי ואני עשיתי
    kjvRefs:
    - Ezekiel 29:9
    kjvOsis:
    - Ezek.29.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.10
    scripture: tanakh
    name: Tanakh Ezekiel 29:10
    ref: Ezekiel 29:10
    book: Ezek
    section: neviim
    chapter: 29
    verse: 10
    ordinal: 13548
    text: Therefore, behold, I am against thee, and against thy rivers, and I will make the land of Egypt utterly waste and desolate, from Migdol to Syene even unto the border of Ethiopia.
    translation: JPS 1917
    original: לָכֵן הִנְנִי אֵלֶיךָ וְאֶל־יְאֹרֶיךָ וְנָתַתִּי אֶת־אֶרֶץ מִצְרַיִם לְחָרְבוֹת חֹרֶב שְׁמָמָה מִמִּגְדֹּל סְוֵנֵה וְעַד־גְּבוּל כּוּשׁ׃
    hebrewPlain: לכן הנני אליך ואל יאריך ונתתי את ארץ מצרים לחרבות חרב שממה ממגדל סונה ועד גבול כוש
    kjvRefs:
    - Ezekiel 29:10
    kjvOsis:
    - Ezek.29.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.11
    scripture: tanakh
    name: Tanakh Ezekiel 29:11
    ref: Ezekiel 29:11
    book: Ezek
    section: neviim
    chapter: 29
    verse: 11
    ordinal: 13549
    text: No foot of man shall pass through it, nor foot of beast shall pass through it, neither shall it be inhabited forty years.
    translation: JPS 1917
    original: לֹא תַעֲבָר־בָּהּ רֶגֶל אָדָם וְרֶגֶל בְּהֵמָה לֹא תַעֲבָר־בָּהּ וְלֹא תֵשֵׁב אַרְבָּעִים שָׁנָה׃
    hebrewPlain: לא תעבר בה רגל אדם ורגל בהמה לא תעבר בה ולא תשב ארבעים שנה
    kjvRefs:
    - Ezekiel 29:11
    kjvOsis:
    - Ezek.29.11
  relations:
