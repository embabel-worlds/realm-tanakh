    scripture: tanakh
    name: Tanakh Ezekiel 18:2
    ref: Ezekiel 18:2
    book: Ezek
    section: neviim
    chapter: 18
    verse: 2
    ordinal: 13206
    text: '’What mean ye, that ye use this proverb in the land of Israel, saying: The fathers have eaten sour grapes, And the children’s teeth are set on edge?'
    translation: JPS 1917
    original: מַה־לָּכֶם אַתֶּם מֹשְׁלִים אֶת־הַמָּשָׁל הַזֶּה עַל־אַדְמַת יִשְׂרָאֵל לֵאמֹר אָבוֹת יֹאכְלוּ בֹסֶר וְשִׁנֵּי הַבָּנִים תִּקְהֶינָה׃
    hebrewPlain: מה לכם אתם משלים את המשל הזה על אדמת ישראל לאמר אבות יאכלו בסר ושני הבנים תקהינה
    kjvRefs:
