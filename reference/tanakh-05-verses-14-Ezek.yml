  data:
    osis: Ezek.40.14
    scripture: tanakh
    name: Tanakh Ezekiel 40:14
    ref: Ezekiel 40:14
    book: Ezek
    section: neviim
    chapter: 40
    verse: 14
    ordinal: 13846
    text: He made also posts of threescore cubits; even unto the posts of the court in the gates round about.
    translation: JPS 1917
    original: וַיַּעַשׂ אֶת־אֵילִים שִׁשִּׁים אַמָּה וְאֶל־אֵיל הֶחָצֵר הַשַּׁעַר סָבִיב סָבִיב׃
    hebrewPlain: ויעש את אילים ששים אמה ואל איל החצר השער סביב סביב
    kjvRefs:
    - Ezekiel 40:14
    kjvOsis:
    - Ezek.40.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.15
    scripture: tanakh
    name: Tanakh Ezekiel 40:15
    ref: Ezekiel 40:15
    book: Ezek
    section: neviim
    chapter: 40
    verse: 15
    ordinal: 13847
    text: And from the forefront of the gate of the entrance unto the forefront of the inner porch of the gate were fifty cubits.
    translation: JPS 1917
    original: וְעַל פְּנֵי הַשַּׁעַר היאתון [הָאִיתוֹן] עַל־לִפְנֵי אֻלָם הַשַּׁעַר הַפְּנִימִי חֲמִשִּׁים אַמָּה׃
    hebrewPlain: ועל פני השער היאתון [האיתון] על לפני אלם השער הפנימי חמשים אמה
    kjvRefs:
    - Ezekiel 40:15
    kjvOsis:
    - Ezek.40.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.16
    scripture: tanakh
    name: Tanakh Ezekiel 40:16
    ref: Ezekiel 40:16
    book: Ezek
    section: neviim
    chapter: 40
    verse: 16
    ordinal: 13848
    text: And there were narrow windows to the cells and to their posts within the gate round about, and likewise to the arches; and windows were round about inward; and upon each post were palm-trees.
    translation: JPS 1917
    original: וְחַלֹּנוֹת אֲטֻמוֹת אֶל־הַתָּאִים וְאֶל אֵלֵיהֵמָה לִפְנִימָה לַשַּׁעַר סָבִיב סָבִיב וְכֵן לָאֵלַמּוֹת וְחַלּוֹנוֹת סָבִיב סָבִיב לִפְנִימָה וְאֶל־אַיִל תִּמֹרִים׃
    hebrewPlain: וחלנות אטמות אל התאים ואל אליהמה לפנימה לשער סביב סביב וכן לאלמות וחלונות סביב סביב לפנימה ואל איל תמרים
    kjvRefs:
    - Ezekiel 40:16
    kjvOsis:
    - Ezek.40.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.17
    scripture: tanakh
    name: Tanakh Ezekiel 40:17
    ref: Ezekiel 40:17
    book: Ezek
    section: neviim
    chapter: 40
    verse: 17
    ordinal: 13849
    text: Then brought he me into the outer court, and, lo, there were chambers and a pavement, made for the court round about; thirty chambers were upon the pavement.
    translation: JPS 1917
    original: וַיְבִיאֵנִי אֶל־הֶחָצֵר הַחִיצוֹנָה וְהִנֵּה לְשָׁכוֹת וְרִצְפָה עָשׂוּי לֶחָצֵר סָבִיב סָבִיב שְׁלֹשִׁים לְשָׁכוֹת אֶל־הָרִצְפָה׃
    hebrewPlain: ויביאני אל החצר החיצונה והנה לשכות ורצפה עשוי לחצר סביב סביב שלשים לשכות אל הרצפה
    kjvRefs:
    - Ezekiel 40:17
    kjvOsis:
    - Ezek.40.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.18
    scripture: tanakh
    name: Tanakh Ezekiel 40:18
    ref: Ezekiel 40:18
    book: Ezek
    section: neviim
    chapter: 40
    verse: 18
    ordinal: 13850
    text: And the pavement was by the side of the gates, corresponding unto the length of the gates, even the lower pavement.
    translation: JPS 1917
    original: וְהָרִצְפָה אֶל־כֶּתֶף הַשְּׁעָרִים לְעֻמַּת אֹרֶךְ הַשְּׁעָרִים הָרִצְפָה הַתַּחְתּוֹנָה׃
    hebrewPlain: והרצפה אל כתף השערים לעמת ארך השערים הרצפה התחתונה
    kjvRefs:
    - Ezekiel 40:18
    kjvOsis:
    - Ezek.40.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.19
    scripture: tanakh
    name: Tanakh Ezekiel 40:19
    ref: Ezekiel 40:19
    book: Ezek
    section: neviim
    chapter: 40
    verse: 19
    ordinal: 13851
    text: Then he measured the breadth from the forefront of the lower gate unto the forefront of the inner court without, a hundred cubits, eastward as also northward.
    translation: JPS 1917
    original: וַיָּמָד רֹחַב מִלִּפְנֵי הַשַּׁעַר הַתַּחְתּוֹנָה לִפְנֵי הֶחָצֵר הַפְּנִימִי מִחוּץ מֵאָה אַמָּה הַקָּדִים וְהַצָּפוֹן׃
    hebrewPlain: וימד רחב מלפני השער התחתונה לפני החצר הפנימי מחוץ מאה אמה הקדים והצפון
    kjvRefs:
    - Ezekiel 40:19
    kjvOsis:
    - Ezek.40.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.20
    scripture: tanakh
    name: Tanakh Ezekiel 40:20
    ref: Ezekiel 40:20
    book: Ezek
    section: neviim
    chapter: 40
    verse: 20
    ordinal: 13852
    text: And the gate of the outer court that looked toward the north, he measured the length thereof and the breadth thereof.
    translation: JPS 1917
    original: וְהַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַצָּפוֹן לֶחָצֵר הַחִיצוֹנָה מָדַד אָרְכּוֹ וְרָחְבּוֹ׃
    hebrewPlain: והשער אשר פניו דרך הצפון לחצר החיצונה מדד ארכו ורחבו
    kjvRefs:
    - Ezekiel 40:20
    kjvOsis:
    - Ezek.40.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.21
    scripture: tanakh
    name: Tanakh Ezekiel 40:21
    ref: Ezekiel 40:21
    book: Ezek
    section: neviim
    chapter: 40
    verse: 21
    ordinal: 13853
    text: And the cells thereof were three on this side and three on that side; and the posts thereof and the arches thereof were after the measure of the first gate; the length thereof was fifty cubits, and the breadth five and twenty cubits.
    translation: JPS 1917
    original: ותאו [וְתָאָיו] שְׁלוֹשָׁה מִפּוֹ וּשְׁלֹשָׁה מִפּוֹ ואילו [וְאֵילָיו] ואלמו [וְאֵלַמָּיו] הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן חֲמִשִּׁים אַמָּה אָרְכּוֹ וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה׃
    hebrewPlain: ותאו [ותאיו] שלושה מפו ושלשה מפו ואילו [ואיליו] ואלמו [ואלמיו] היה כמדת השער הראשון חמשים אמה ארכו ורחב חמש ועשרים באמה
    kjvRefs:
    - Ezekiel 40:21
    kjvOsis:
    - Ezek.40.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.22
    scripture: tanakh
    name: Tanakh Ezekiel 40:22
    ref: Ezekiel 40:22
    book: Ezek
    section: neviim
    chapter: 40
    verse: 22
    ordinal: 13854
    text: And the windows thereof, and the arches thereof, and the palm-trees thereof, were after the measure of the gate that looketh toward the east; and it was ascended by seven steps; and the arches thereof were before them.
    translation: JPS 1917
    original: וחלונו [וְחַלּוֹנָיו] ואלמו [וְאֵלַמָּיו] ותמרו [וְתִמֹרָיו] כְּמִדַּת הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ־בוֹ ואילמו [וְאֵילַמָּיו] לִפְנֵיהֶם׃
    hebrewPlain: וחלונו [וחלוניו] ואלמו [ואלמיו] ותמרו [ותמריו] כמדת השער אשר פניו דרך הקדים ובמעלות שבע יעלו בו ואילמו [ואילמיו] לפניהם
    kjvRefs:
    - Ezekiel 40:22
    kjvOsis:
    - Ezek.40.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.23
    scripture: tanakh
    name: Tanakh Ezekiel 40:23
    ref: Ezekiel 40:23
    book: Ezek
    section: neviim
    chapter: 40
    verse: 23
    ordinal: 13855
    text: And there was a gate to the inner court over against the other gate, northward as also eastward; and he measured from gate to gate a hundred cubits.
    translation: JPS 1917
    original: וְשַׁעַר לֶחָצֵר הַפְּנִימִי נֶגֶד הַשַּׁעַר לַצָּפוֹן וְלַקָּדִים וַיָּמָד מִשַּׁעַר אֶל־שַׁעַר מֵאָה אַמָּה׃
    hebrewPlain: ושער לחצר הפנימי נגד השער לצפון ולקדים וימד משער אל שער מאה אמה
    kjvRefs:
    - Ezekiel 40:23
    kjvOsis:
    - Ezek.40.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.24
    scripture: tanakh
    name: Tanakh Ezekiel 40:24
    ref: Ezekiel 40:24
    book: Ezek
    section: neviim
    chapter: 40
    verse: 24
    ordinal: 13856
    text: And he led me toward the south, and behold a gate toward the south; and he measured the posts thereof, and the arches thereof according to these measures.
    translation: JPS 1917
    original: וַיּוֹלִכֵנִי דֶּרֶךְ הַדָּרוֹם וְהִנֵּה־שַׁעַר דֶּרֶךְ הַדָּרוֹם וּמָדַד אילו [אֵילָיו] ואילמו [וְאֵילַמָּיו] כַּמִּדּוֹת הָאֵלֶּה׃
    hebrewPlain: ויולכני דרך הדרום והנה שער דרך הדרום ומדד אילו [איליו] ואילמו [ואילמיו] כמדות האלה
    kjvRefs:
    - Ezekiel 40:24
    kjvOsis:
    - Ezek.40.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.25
    scripture: tanakh
    name: Tanakh Ezekiel 40:25
    ref: Ezekiel 40:25
    book: Ezek
    section: neviim
    chapter: 40
    verse: 25
    ordinal: 13857
    text: And there were windows in it and in the arches thereof round about, like those windows; the length was fifty cubits, and the breadth five and twenty cubits.
    translation: JPS 1917
    original: וְחַלּוֹנִים לוֹ ולאילמו [וּלְאֵילַמָּיו] סָבִיב סָבִיב כְּהַחֲלֹּנוֹת הָאֵלֶּה חֲמִשִּׁים אַמָּה אֹרֶךְ וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה׃
    hebrewPlain: וחלונים לו ולאילמו [ולאילמיו] סביב סביב כהחלנות האלה חמשים אמה ארך ורחב חמש ועשרים אמה
    kjvRefs:
    - Ezekiel 40:25
    kjvOsis:
    - Ezek.40.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.26
    scripture: tanakh
    name: Tanakh Ezekiel 40:26
    ref: Ezekiel 40:26
    book: Ezek
    section: neviim
    chapter: 40
    verse: 26
    ordinal: 13858
    text: And there were seven steps to go up to it, and the arches thereof were before them; and it had palm-trees, one on this side, and another on that side, upon the posts thereof.
    translation: JPS 1917
    original: וּמַעֲלוֹת שִׁבְעָה עלותו [עֹלוֹתָיו] ואלמו [וְאֵלַמָּיו] לִפְנֵיהֶם וְתִמֹרִים לוֹ אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ אֶל־אילו [אֵילָיו׃]
    hebrewPlain: ומעלות שבעה עלותו [עלותיו] ואלמו [ואלמיו] לפניהם ותמרים לו אחד מפו ואחד מפו אל אילו [איליו]
    kjvRefs:
    - Ezekiel 40:26
    kjvOsis:
    - Ezek.40.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.27
    scripture: tanakh
    name: Tanakh Ezekiel 40:27
    ref: Ezekiel 40:27
    book: Ezek
    section: neviim
    chapter: 40
    verse: 27
    ordinal: 13859
    text: And there was a gate to the inner court toward the south; and he measured from gate to gate toward the south a hundred cubits.
    translation: JPS 1917
    original: וְשַׁעַר לֶחָצֵר הַפְּנִימִי דֶּרֶךְ הַדָּרוֹם וַיָּמָד מִשַּׁעַר אֶל־הַשַּׁעַר דֶּרֶךְ הַדָּרוֹם מֵאָה אַמּוֹת׃
    hebrewPlain: ושער לחצר הפנימי דרך הדרום וימד משער אל השער דרך הדרום מאה אמות
    kjvRefs:
    - Ezekiel 40:27
    kjvOsis:
    - Ezek.40.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.28
    scripture: tanakh
    name: Tanakh Ezekiel 40:28
    ref: Ezekiel 40:28
    book: Ezek
    section: neviim
    chapter: 40
    verse: 28
    ordinal: 13860
    text: Then he brought me to the inner court by the south gate; and he measured the south gate according to these measures;
    translation: JPS 1917
    original: וַיְבִיאֵנִי אֶל־חָצֵר הַפְּנִימִי בְּשַׁעַר הַדָּרוֹם וַיָּמָד אֶת־הַשַּׁעַר הַדָּרוֹם כַּמִּדּוֹת הָאֵלֶּה׃
    hebrewPlain: ויביאני אל חצר הפנימי בשער הדרום וימד את השער הדרום כמדות האלה
    kjvRefs:
    - Ezekiel 40:28
    kjvOsis:
    - Ezek.40.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.29
    scripture: tanakh
    name: Tanakh Ezekiel 40:29
    ref: Ezekiel 40:29
    book: Ezek
    section: neviim
    chapter: 40
    verse: 29
    ordinal: 13861
    text: and the cells thereof, and the posts thereof, and the arches thereof, according to these measures; and there were windows in it and in the arches thereof round about; it was fifty cubits long, and five and twenty cubits broad.
    translation: JPS 1917
    original: ותאו [וְתָאָיו] ואילו [וְאֵילָיו] ואלמו [וְאֵלַמָּיו] כַּמִּדּוֹת הָאֵלֶּה וְחַלּוֹנוֹת לוֹ ולאלמו [וּלְאֵלַמָּיו] סָבִיב סָבִיב חֲמִשִּׁים אַמָּה אֹרֶךְ וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת׃
    hebrewPlain: ותאו [ותאיו] ואילו [ואיליו] ואלמו [ואלמיו] כמדות האלה וחלונות לו ולאלמו [ולאלמיו] סביב סביב חמשים אמה ארך ורחב עשרים וחמש אמות
    kjvRefs:
    - Ezekiel 40:29
    kjvOsis:
    - Ezek.40.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
