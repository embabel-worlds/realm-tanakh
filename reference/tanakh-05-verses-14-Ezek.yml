- type: TanakhVerse
  data:
    osis: Ezek.30.2
    scripture: tanakh
    name: Tanakh Ezekiel 30:2
    ref: Ezekiel 30:2
    book: Ezek
    section: neviim
    chapter: 30
    verse: 2
    ordinal: 13561
    text: '’Son of man, prophesy, and say: Thus saith the Lord GOD: Wail ye: Woe worth the day!'
    translation: JPS 1917
    original: בֶּן־אָדָם הִנָּבֵא וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה הֵילִילוּ הָהּ לַיּוֹם׃
    hebrewPlain: בן אדם הנבא ואמרת כה אמר אדני יהוה הילילו הה ליום
    kjvRefs:
    - Ezekiel 30:2
    kjvOsis:
    - Ezek.30.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.3
    scripture: tanakh
    name: Tanakh Ezekiel 30:3
    ref: Ezekiel 30:3
    book: Ezek
    section: neviim
    chapter: 30
    verse: 3
    ordinal: 13562
    text: For the day is near, Even the day of the LORD is near, A day of clouds, it shall be the time of the nations.
    translation: JPS 1917
    original: כִּי־קָרוֹב יוֹם וְקָרוֹב יוֹם לַיהוָה יוֹם עָנָן עֵת גּוֹיִם יִהְיֶה׃
    hebrewPlain: כי קרוב יום וקרוב יום ליהוה יום ענן עת גוים יהיה
    kjvRefs:
    - Ezekiel 30:3
    kjvOsis:
    - Ezek.30.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.4
    scripture: tanakh
    name: Tanakh Ezekiel 30:4
    ref: Ezekiel 30:4
    book: Ezek
    section: neviim
    chapter: 30
    verse: 4
    ordinal: 13563
    text: And a sword shall come upon Egypt, And convulsion shall be in Ethiopia, When the slain shall fall in Egypt; And they shall take away her abundance, And her foundation shall be broken down.
    translation: JPS 1917
    original: וּבָאָה חֶרֶב בְּמִצְרַיִם וְהָיְתָה חַלְחָלָה בְּכוּשׁ בִּנְפֹל חָלָל בְּמִצְרָיִם וְלָקְחוּ הֲמוֹנָהּ וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ׃
    hebrewPlain: ובאה חרב במצרים והיתה חלחלה בכוש בנפל חלל במצרים ולקחו המונה ונהרסו יסודתיה
    kjvRefs:
    - Ezekiel 30:4
    kjvOsis:
    - Ezek.30.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.5
    scripture: tanakh
    name: Tanakh Ezekiel 30:5
    ref: Ezekiel 30:5
    book: Ezek
    section: neviim
    chapter: 30
    verse: 5
    ordinal: 13564
    text: Ethiopia, and Put, and Lud, and all the mingled people, and Cub, and the children of the land that is in league, shall fall with them by the sword.
    translation: JPS 1917
    original: כּוּשׁ וּפוּט וְלוּד וְכָל־הָעֶרֶב וְכוּב וּבְנֵי אֶרֶץ הַבְּרִית אִתָּם בַּחֶרֶב יִפֹּלוּ׃
    hebrewPlain: כוש ופוט ולוד וכל הערב וכוב ובני ארץ הברית אתם בחרב יפלו
    kjvRefs:
    - Ezekiel 30:5
    kjvOsis:
    - Ezek.30.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.6
    scripture: tanakh
    name: Tanakh Ezekiel 30:6
    ref: Ezekiel 30:6
    book: Ezek
    section: neviim
    chapter: 30
    verse: 6
    ordinal: 13565
    text: 'Thus saith the LORD: They also that uphold Egypt shall fall, And the pride of her power shall come down; From Migdol to Syene shall they fall in it by the sword, Saith the Lord GOD.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה וְנָפְלוּ סֹמְכֵי מִצְרַיִם וְיָרַד גְּאוֹן עֻזָּהּ מִמִּגְדֹּל סְוֵנֵה בַּחֶרֶב יִפְּלוּ־בָהּ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כה אמר יהוה ונפלו סמכי מצרים וירד גאון עזה ממגדל סונה בחרב יפלו בה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 30:6
    kjvOsis:
    - Ezek.30.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.7
    scripture: tanakh
    name: Tanakh Ezekiel 30:7
    ref: Ezekiel 30:7
    book: Ezek
    section: neviim
    chapter: 30
    verse: 7
    ordinal: 13566
    text: And they shall be desolate in the midst of the countries that are desolate, And her cities shall be in the midst of the cities that are wasted.
    translation: JPS 1917
    original: וְנָשַׁמּוּ בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת וְעָרָיו בְּתוֹךְ־עָרִים נַחֲרָבוֹת תִּהְיֶינָה׃
    hebrewPlain: ונשמו בתוך ארצות נשמות ועריו בתוך ערים נחרבות תהיינה
    kjvRefs:
    - Ezekiel 30:7
    kjvOsis:
    - Ezek.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.8
    scripture: tanakh
    name: Tanakh Ezekiel 30:8
    ref: Ezekiel 30:8
    book: Ezek
    section: neviim
    chapter: 30
    verse: 8
    ordinal: 13567
    text: And they shall know that I am the LORD, When I have set a fire in Egypt, And all her helpers are destroyed.
    translation: JPS 1917
    original: וְיָדְעוּ כִּי־אֲנִי יְהוָה בְּתִתִּי־אֵשׁ בְּמִצְרַיִם וְנִשְׁבְּרוּ כָּל־עֹזְרֶיהָ׃
    hebrewPlain: וידעו כי אני יהוה בתתי אש במצרים ונשברו כל עזריה
    kjvRefs:
    - Ezekiel 30:8
    kjvOsis:
    - Ezek.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.9
    scripture: tanakh
    name: Tanakh Ezekiel 30:9
    ref: Ezekiel 30:9
    book: Ezek
    section: neviim
    chapter: 30
    verse: 9
    ordinal: 13568
    text: In that day shall messengers go forth from before Me in ships To make the confident Ethiopians afraid; And there shall come convulsion upon them in the day of Egypt; For, lo, it cometh.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא יֵצְאוּ מַלְאָכִים מִלְּפָנַי בַּצִּים לְהַחֲרִיד אֶת־כּוּשׁ בֶּטַח וְהָיְתָה חַלְחָלָה בָהֶם בְּיוֹם מִצְרַיִם כִּי הִנֵּה בָּאָה׃
    hebrewPlain: ביום ההוא יצאו מלאכים מלפני בצים להחריד את כוש בטח והיתה חלחלה בהם ביום מצרים כי הנה באה
    kjvRefs:
    - Ezekiel 30:9
    kjvOsis:
    - Ezek.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.10
    scripture: tanakh
    name: Tanakh Ezekiel 30:10
    ref: Ezekiel 30:10
    book: Ezek
    section: neviim
    chapter: 30
    verse: 10
    ordinal: 13569
    text: 'Thus saith the Lord GOD: I will also make the multitude of Egypt to cease, By the hand of Nebuchadrezzar king of Babylon.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה וְהִשְׁבַּתִּי אֶת־הֲמוֹן מִצְרַיִם בְּיַד נְבוּכַדְרֶאצַּר מֶלֶךְ־בָּבֶל׃
    hebrewPlain: כה אמר אדני יהוה והשבתי את המון מצרים ביד נבוכדראצר מלך בבל
    kjvRefs:
    - Ezekiel 30:10
    kjvOsis:
    - Ezek.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.11
    scripture: tanakh
    name: Tanakh Ezekiel 30:11
    ref: Ezekiel 30:11
    book: Ezek
    section: neviim
    chapter: 30
    verse: 11
    ordinal: 13570
    text: He and his people with him, the terrible of the nations, Shall be brought in to destroy the land; And they shall draw their swords against Egypt, And fill the land with the slain.
    translation: JPS 1917
    original: הוּא וְעַמּוֹ אִתּוֹ עָרִיצֵי גוֹיִם מוּבָאִים לְשַׁחֵת הָאָרֶץ וְהֵרִיקוּ חַרְבוֹתָם עַל־מִצְרַיִם וּמָלְאוּ אֶת־הָאָרֶץ חָלָל׃
    hebrewPlain: הוא ועמו אתו עריצי גוים מובאים לשחת הארץ והריקו חרבותם על מצרים ומלאו את הארץ חלל
    kjvRefs:
    - Ezekiel 30:11
    kjvOsis:
    - Ezek.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.12
    scripture: tanakh
    name: Tanakh Ezekiel 30:12
    ref: Ezekiel 30:12
    book: Ezek
    section: neviim
    chapter: 30
    verse: 12
    ordinal: 13571
    text: And I will make the rivers dry, And will give the land over into the hand of evil men; And I will make the land desolate, And all that is therein, by the hand of strangers; I the LORD have spoken it.
    translation: JPS 1917
    original: וְנָתַתִּי יְאֹרִים חָרָבָה וּמָכַרְתִּי אֶת־הָאָרֶץ בְּיַד־רָעִים וַהֲשִׁמֹּתִי אֶרֶץ וּמְלֹאָהּ בְּיַד־זָרִים אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: ונתתי יארים חרבה ומכרתי את הארץ ביד רעים והשמתי ארץ ומלאה ביד זרים אני יהוה דברתי
    kjvRefs:
    - Ezekiel 30:12
    kjvOsis:
    - Ezek.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.13
    scripture: tanakh
    name: Tanakh Ezekiel 30:13
    ref: Ezekiel 30:13
    book: Ezek
    section: neviim
    chapter: 30
    verse: 13
    ordinal: 13572
    text: 'Thus saith the Lord GOD: I will also destroy the idols, And I will cause the things of nought to cease from Noph; And there shall be no more a prince out of the land of Egypt; And I will put a fear in the land of Egypt.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה וְהַאֲבַדְתִּי גִלּוּלִים וְהִשְׁבַּתִּי אֱלִילִים מִנֹּף וְנָשִׂיא מֵאֶרֶץ־מִצְרַיִם לֹא יִהְיֶה־עוֹד וְנָתַתִּי יִרְאָה בְּאֶרֶץ מִצְרָיִם׃
    hebrewPlain: כה אמר אדני יהוה והאבדתי גלולים והשבתי אלילים מנף ונשיא מארץ מצרים לא יהיה עוד ונתתי יראה בארץ מצרים
    kjvRefs:
    - Ezekiel 30:13
    kjvOsis:
    - Ezek.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.14
    scripture: tanakh
    name: Tanakh Ezekiel 30:14
    ref: Ezekiel 30:14
    book: Ezek
    section: neviim
    chapter: 30
    verse: 14
    ordinal: 13573
    text: And I will make Pathros desolate, And will set a fire in Zoan, And will execute judgments in No.
    translation: JPS 1917
    original: וַהֲשִׁמֹּתִי אֶת־פַּתְרוֹס וְנָתַתִּי אֵשׁ בְּצֹעַן וְעָשִׂיתִי שְׁפָטִים בְּנֹא׃
    hebrewPlain: והשמתי את פתרוס ונתתי אש בצען ועשיתי שפטים בנא
    kjvRefs:
    - Ezekiel 30:14
    kjvOsis:
    - Ezek.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.15
    scripture: tanakh
    name: Tanakh Ezekiel 30:15
    ref: Ezekiel 30:15
    book: Ezek
    section: neviim
    chapter: 30
    verse: 15
    ordinal: 13574
    text: And I will pour My fury upon Sin, the stronghold of Egypt; And I will cut off the multitude of No.
    translation: JPS 1917
    original: וְשָׁפַכְתִּי חֲמָתִי עַל־סִין מָעוֹז מִצְרָיִם וְהִכְרַתִּי אֶת־הֲמוֹן נֹא׃
    hebrewPlain: ושפכתי חמתי על סין מעוז מצרים והכרתי את המון נא
    kjvRefs:
    - Ezekiel 30:15
    kjvOsis:
    - Ezek.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.16
    scripture: tanakh
    name: Tanakh Ezekiel 30:16
    ref: Ezekiel 30:16
    book: Ezek
    section: neviim
    chapter: 30
    verse: 16
    ordinal: 13575
    text: And I will set a fire in Egypt; Sin shall be in great convulsion, And No shall be rent asunder; And in Noph shall come adversaries in the day-time.
    translation: JPS 1917
    original: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם חוּל תחיל [תָּחוּל] סִין וְנֹא תִּהְיֶה לְהִבָּקֵעַ וְנֹף צָרֵי יוֹמָם׃
    hebrewPlain: ונתתי אש במצרים חול תחיל [תחול] סין ונא תהיה להבקע ונף צרי יומם
    kjvRefs:
    - Ezekiel 30:16
    kjvOsis:
    - Ezek.30.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.17
    scripture: tanakh
    name: Tanakh Ezekiel 30:17
    ref: Ezekiel 30:17
    book: Ezek
    section: neviim
    chapter: 30
    verse: 17
    ordinal: 13576
    text: The young men of Aven and of Pi-beseth shall fall by the sword; And these cities shall go into captivity.
    translation: JPS 1917
    original: בַּחוּרֵי אָוֶן וּפִי־בֶסֶת בַּחֶרֶב יִפֹּלוּ וְהֵנָּה בַּשְּׁבִי תֵלַכְנָה׃
    hebrewPlain: בחורי און ופי בסת בחרב יפלו והנה בשבי תלכנה
    kjvRefs:
    - Ezekiel 30:17
    kjvOsis:
    - Ezek.30.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.18
    scripture: tanakh
    name: Tanakh Ezekiel 30:18
    ref: Ezekiel 30:18
    book: Ezek
    section: neviim
    chapter: 30
    verse: 18
    ordinal: 13577
    text: At Tehaphnehes also the day shall withdraw itself, When I shall break there the yokes of Egypt, And the pride of her power shall cease in her; As for her, a cloud shall cover her, And her daughters shall go into captivity.
    translation: JPS 1917
    original: וּבִתְחַפְנְחֵס חָשַׂךְ הַיּוֹם בְּשִׁבְרִי־שָׁם אֶת־מֹטוֹת מִצְרַיִם וְנִשְׁבַּת־בָּהּ גְּאוֹן עֻזָּהּ הִיא עָנָן יְכַסֶּנָּה וּבְנוֹתֶיהָ בַּשְּׁבִי תֵלַכְנָה׃
    hebrewPlain: ובתחפנחס חשך היום בשברי שם את מטות מצרים ונשבת בה גאון עזה היא ענן יכסנה ובנותיה בשבי תלכנה
    kjvRefs:
    - Ezekiel 30:18
    kjvOsis:
    - Ezek.30.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.19
    scripture: tanakh
    name: Tanakh Ezekiel 30:19
    ref: Ezekiel 30:19
    book: Ezek
    section: neviim
    chapter: 30
    verse: 19
    ordinal: 13578
    text: Thus will I execute judgments in Egypt; And they shall know that I am the LORD.’ .
    translation: JPS 1917
    original: וְעָשִׂיתִי שְׁפָטִים בְּמִצְרָיִם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ועשיתי שפטים במצרים וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 30:19
    kjvOsis:
    - Ezek.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.20
    scripture: tanakh
    name: Tanakh Ezekiel 30:20
    ref: Ezekiel 30:20
    book: Ezek
    section: neviim
    chapter: 30
    verse: 20
    ordinal: 13579
    text: 'And it came to pass in the eleventh year, in the first month, in the seventh day of the month, that the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי בְּאַחַת עֶשְׂרֵה שָׁנָה בָּרִאשׁוֹן בְּשִׁבְעָה לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי באחת עשרה שנה בראשון בשבעה לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 30:20
    kjvOsis:
    - Ezek.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.21
    scripture: tanakh
    name: Tanakh Ezekiel 30:21
    ref: Ezekiel 30:21
    book: Ezek
    section: neviim
    chapter: 30
    verse: 21
    ordinal: 13580
    text: ’Son of man, I have broken the arm of Pharaoh king of Egypt; and, lo, it hath not been bound up to be healed, to put a roller, that it be bound up and wax strong, that it hold the sword.
    translation: JPS 1917
    original: בֶּן־אָדָם אֶת־זְרוֹעַ פַּרְעֹה מֶלֶךְ־מִצְרַיִם שָׁבָרְתִּי וְהִנֵּה לֹא־חֻבְּשָׁה לָתֵת רְפֻאוֹת לָשׂוּם חִתּוּל לְחָבְשָׁהּ לְחָזְקָהּ לִתְפֹּשׂ בֶּחָרֶב׃
    hebrewPlain: בן אדם את זרוע פרעה מלך מצרים שברתי והנה לא חבשה לתת רפאות לשום חתול לחבשה לחזקה לתפש בחרב
    kjvRefs:
    - Ezekiel 30:21
    kjvOsis:
    - Ezek.30.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.22
    scripture: tanakh
    name: Tanakh Ezekiel 30:22
    ref: Ezekiel 30:22
    book: Ezek
    section: neviim
    chapter: 30
    verse: 22
    ordinal: 13581
    text: 'Therefore thus saith the Lord GOD: Behold, I am against Pharaoh king of Egypt, and will break his arms, the strong, and that which was broken; and I will cause the sword to fall out of his hand.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהֹוִה הִנְנִי אֶל־פַּרְעֹה מֶלֶךְ־מִצְרַיִם וְשָׁבַרְתִּי אֶת־זְרֹעֹתָיו אֶת־הַחֲזָקָה וְאֶת־הַנִּשְׁבָּרֶת וְהִפַּלְתִּי אֶת־הַחֶרֶב מִיָּדוֹ׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני אל פרעה מלך מצרים ושברתי את זרעתיו את החזקה ואת הנשברת והפלתי את החרב מידו
    kjvRefs:
    - Ezekiel 30:22
    kjvOsis:
    - Ezek.30.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.23
    scripture: tanakh
    name: Tanakh Ezekiel 30:23
    ref: Ezekiel 30:23
    book: Ezek
    section: neviim
    chapter: 30
    verse: 23
    ordinal: 13582
    text: And I will scatter the Egyptians among the nations, and will disperse them through the countries.
    translation: JPS 1917
    original: וַהֲפִצוֹתִי אֶת־מִצְרַיִם בַּגּוֹיִם וְזֵרִיתִם בָּאֲרָצוֹת׃
    hebrewPlain: והפצותי את מצרים בגוים וזריתם בארצות
    kjvRefs:
    - Ezekiel 30:23
    kjvOsis:
    - Ezek.30.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.24
    scripture: tanakh
    name: Tanakh Ezekiel 30:24
    ref: Ezekiel 30:24
    book: Ezek
    section: neviim
    chapter: 30
    verse: 24
    ordinal: 13583
    text: And I will strengthen the arms of the king of Babylon, and put My sword in his hand; but I will break the arms of Pharaoh, and he shall groan before him with the groanings of a deadly wounded man.
    translation: JPS 1917
    original: וְחִזַּקְתִּי אֶת־זְרֹעוֹת מֶלֶךְ בָּבֶל וְנָתַתִּי אֶת־חַרְבִּי בְּיָדוֹ וְשָׁבַרְתִּי אֶת־זְרֹעוֹת פַּרְעֹה וְנָאַק נַאֲקוֹת חָלָל לְפָנָיו׃
    hebrewPlain: וחזקתי את זרעות מלך בבל ונתתי את חרבי בידו ושברתי את זרעות פרעה ונאק נאקות חלל לפניו
    kjvRefs:
    - Ezekiel 30:24
    kjvOsis:
    - Ezek.30.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.25
    scripture: tanakh
    name: Tanakh Ezekiel 30:25
    ref: Ezekiel 30:25
    book: Ezek
    section: neviim
    chapter: 30
    verse: 25
    ordinal: 13584
    text: And I will hold up the arms of the king of Babylon, and the arms of Pharaoh shall fall down; and they shall know that I am the LORD, when I shall put My sword into the hand of the king of Babylon, and he shall stretch it out upon the land of Egypt.
    translation: JPS 1917
    original: וְהַחֲזַקְתִּי אֶת־זְרֹעוֹת מֶלֶךְ בָּבֶל וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה וְיָדְעוּ כִּי־אֲנִי יְהוָה בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ־בָּבֶל וְנָטָה אוֹתָהּ אֶל־אֶרֶץ מִצְרָיִם׃
    hebrewPlain: והחזקתי את זרעות מלך בבל וזרעות פרעה תפלנה וידעו כי אני יהוה בתתי חרבי ביד מלך בבל ונטה אותה אל ארץ מצרים
    kjvRefs:
    - Ezekiel 30:25
    kjvOsis:
    - Ezek.30.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.30.26
    scripture: tanakh
    name: Tanakh Ezekiel 30:26
    ref: Ezekiel 30:26
    book: Ezek
    section: neviim
    chapter: 30
    verse: 26
    ordinal: 13585
    text: And I will scatter the Egyptians among the nations, and disperse them through the countries; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: וַהֲפִצוֹתִי אֶת־מִצְרַיִם בַּגּוֹיִם וְזֵרִיתִי אוֹתָם בָּאֲרָצוֹת וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והפצותי את מצרים בגוים וזריתי אותם בארצות וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 30:26
    kjvOsis:
    - Ezek.30.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.30
- type: TanakhVerse
  data:
    osis: Ezek.31.1
    scripture: tanakh
    name: Tanakh Ezekiel 31:1
    ref: Ezekiel 31:1
    book: Ezek
    section: neviim
    chapter: 31
    verse: 1
    ordinal: 13586
    text: 'And it came to pass in the eleventh year, in the third month, in the first day of the month, that the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי בְּאַחַת עֶשְׂרֵה שָׁנָה בַּשְּׁלִישִׁי בְּאֶחָד לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי באחת עשרה שנה בשלישי באחד לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 31:1
    kjvOsis:
    - Ezek.31.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.2
    scripture: tanakh
    name: Tanakh Ezekiel 31:2
    ref: Ezekiel 31:2
    book: Ezek
    section: neviim
    chapter: 31
    verse: 2
    ordinal: 13587
    text: '’Son of man, say unto Pharaoh king of Egypt, and to his multitude: Whom art thou like in thy greatness?'
    translation: JPS 1917
    original: בֶּן־אָדָם אֱמֹר אֶל־פַּרְעֹה מֶלֶךְ־מִצְרַיִם וְאֶל־הֲמוֹנוֹ אֶל־מִי דָּמִיתָ בְגָדְלֶךָ׃
    hebrewPlain: בן אדם אמר אל פרעה מלך מצרים ואל המונו אל מי דמית בגדלך
    kjvRefs:
    - Ezekiel 31:2
    kjvOsis:
    - Ezek.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.3
    scripture: tanakh
    name: Tanakh Ezekiel 31:3
    ref: Ezekiel 31:3
    book: Ezek
    section: neviim
    chapter: 31
    verse: 3
    ordinal: 13588
    text: Behold, the Assyrian was a cedar in Lebanon, With fair branches, and with a shadowing shroud, And of a high stature; And its top was among the thick boughs.
    translation: JPS 1917
    original: הִנֵּה אַשּׁוּר אֶרֶז בַּלְּבָנוֹן יְפֵה עָנָף וְחֹרֶשׁ מֵצַל וּגְבַהּ קוֹמָה וּבֵין עֲבֹתִים הָיְתָה צַמַּרְתּוֹ׃
    hebrewPlain: הנה אשור ארז בלבנון יפה ענף וחרש מצל וגבה קומה ובין עבתים היתה צמרתו
    kjvRefs:
    - Ezekiel 31:3
    kjvOsis:
    - Ezek.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.4
    scripture: tanakh
    name: Tanakh Ezekiel 31:4
    ref: Ezekiel 31:4
    book: Ezek
    section: neviim
    chapter: 31
    verse: 4
    ordinal: 13589
    text: The waters nourished it, The deep made it to grow; Her rivers ran round About her plantation, And she sent out her conduits Unto all the trees of the field.
    translation: JPS 1917
    original: מַיִם גִּדְּלוּהוּ תְּהוֹם רֹמְמָתְהוּ אֶת־נַהֲרֹתֶיהָ הֹלֵךְ סְבִיבוֹת מַטָּעָהּ וְאֶת־תְּעָלֹתֶיהָ שִׁלְחָה אֶל כָּל־עֲצֵי הַשָּׂדֶה׃
    hebrewPlain: מים גדלוהו תהום רממתהו את נהרתיה הלך סביבות מטעה ואת תעלתיה שלחה אל כל עצי השדה
    kjvRefs:
    - Ezekiel 31:4
    kjvOsis:
    - Ezek.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.5
    scripture: tanakh
    name: Tanakh Ezekiel 31:5
    ref: Ezekiel 31:5
    book: Ezek
    section: neviim
    chapter: 31
    verse: 5
    ordinal: 13590
    text: Therefore its stature was exalted Above all the trees of the field; And its boughs were multiplied, And its branches became long, Because of the multitude of waters, when it shot them forth.
    translation: JPS 1917
    original: עַל־כֵּן גָּבְהָא קֹמָתוֹ מִכֹּל עֲצֵי הַשָּׂדֶה וַתִּרְבֶּינָה סַרְעַפֹּתָיו וַתֶּאֱרַכְנָה פארתו [פֹארֹתָיו] מִמַּיִם רַבִּים בְּשַׁלְּחוֹ׃
    hebrewPlain: על כן גבהא קמתו מכל עצי השדה ותרבינה סרעפתיו ותארכנה פארתו [פארתיו] ממים רבים בשלחו
    kjvRefs:
    - Ezekiel 31:5
    kjvOsis:
    - Ezek.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.6
    scripture: tanakh
    name: Tanakh Ezekiel 31:6
    ref: Ezekiel 31:6
    book: Ezek
    section: neviim
    chapter: 31
    verse: 6
    ordinal: 13591
    text: All the fowls of heaven made Their nests in its boughs, And all the beasts of the field did bring forth their young Under its branches, And under its shadow dwelt All great nations.
    translation: JPS 1917
    original: בִּסְעַפֹּתָיו קִנְנוּ כָּל־עוֹף הַשָּׁמַיִם וְתַחַת פֹּארֹתָיו יָלְדוּ כֹּל חַיַּת הַשָּׂדֶה וּבְצִלּוֹ יֵשְׁבוּ כֹּל גּוֹיִם רַבִּים׃
    hebrewPlain: בסעפתיו קננו כל עוף השמים ותחת פארתיו ילדו כל חית השדה ובצלו ישבו כל גוים רבים
    kjvRefs:
    - Ezekiel 31:6
    kjvOsis:
    - Ezek.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.7
    scripture: tanakh
    name: Tanakh Ezekiel 31:7
    ref: Ezekiel 31:7
    book: Ezek
    section: neviim
    chapter: 31
    verse: 7
    ordinal: 13592
    text: Thus was it fair in its greatness, In the length of its branches; For its root was By many waters.
    translation: JPS 1917
    original: וַיְּיִף בְּגָדְלוֹ בְּאֹרֶךְ דָּלִיּוֹתָיו כִּי־הָיָה שָׁרְשׁוֹ אֶל־מַיִם רַבִּים׃
    hebrewPlain: וייף בגדלו בארך דליותיו כי היה שרשו אל מים רבים
    kjvRefs:
    - Ezekiel 31:7
    kjvOsis:
    - Ezek.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.8
    scripture: tanakh
    name: Tanakh Ezekiel 31:8
    ref: Ezekiel 31:8
    book: Ezek
    section: neviim
    chapter: 31
    verse: 8
    ordinal: 13593
    text: The cedars in the garden of God Could not hide it; The cypress-trees were not Like its boughs, And the plane-trees were not As its branches; Nor was any tree in the garden of God Like unto it in its beauty.
    translation: JPS 1917
    original: אֲרָזִים לֹא־עֲמָמֻהוּ בְּגַן־אֱלֹהִים בְּרוֹשִׁים לֹא דָמוּ אֶל־סְעַפֹּתָיו וְעַרְמֹנִים לֹא־הָיוּ כְּפֹארֹתָיו כָּל־עֵץ בְּגַן־אֱלֹהִים לֹא־דָמָה אֵלָיו בְּיָפְיוֹ׃
    hebrewPlain: ארזים לא עממהו בגן אלהים ברושים לא דמו אל סעפתיו וערמנים לא היו כפארתיו כל עץ בגן אלהים לא דמה אליו ביפיו
    kjvRefs:
    - Ezekiel 31:8
    kjvOsis:
    - Ezek.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.9
    scripture: tanakh
    name: Tanakh Ezekiel 31:9
    ref: Ezekiel 31:9
    book: Ezek
    section: neviim
    chapter: 31
    verse: 9
    ordinal: 13594
    text: I made it fair By the multitude of its branches; So that all the trees of Eden, That were in the garden of God, envied it.
    translation: JPS 1917
    original: יָפֶה עֲשִׂיתִיו בְּרֹב דָּלִיּוֹתָיו וַיְקַנְאֻהוּ כָּל־עֲצֵי־עֵדֶן אֲשֶׁר בְּגַן הָאֱלֹהִים׃
    hebrewPlain: יפה עשיתיו ברב דליותיו ויקנאהו כל עצי עדן אשר בגן האלהים
    kjvRefs:
    - Ezekiel 31:9
    kjvOsis:
    - Ezek.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.10
    scripture: tanakh
    name: Tanakh Ezekiel 31:10
    ref: Ezekiel 31:10
    book: Ezek
    section: neviim
    chapter: 31
    verse: 10
    ordinal: 13595
    text: 'Therefore thus saith the Lord GOD: Because thou art exalted in stature, and he hath set his top among the thick boughs, and his heart is lifted up in his height;'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן אֲשֶׁר גָּבַהְתָּ בְּקוֹמָה וַיִּתֵּן צַמַּרְתּוֹ אֶל־בֵּין עֲבוֹתִים וְרָם לְבָבוֹ בְּגָבְהוֹ׃
    hebrewPlain: לכן כה אמר אדני יהוה יען אשר גבהת בקומה ויתן צמרתו אל בין עבותים ורם לבבו בגבהו
    kjvRefs:
    - Ezekiel 31:10
    kjvOsis:
    - Ezek.31.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.11
    scripture: tanakh
    name: Tanakh Ezekiel 31:11
    ref: Ezekiel 31:11
    book: Ezek
    section: neviim
    chapter: 31
    verse: 11
    ordinal: 13596
    text: I do even deliver him into the hand of the mighty one of the nations; he shall surely deal with him; I do drive him out according to his wickedness.
    translation: JPS 1917
    original: וְאֶתְּנֵהוּ בְּיַד אֵיל גּוֹיִם עָשׂוֹ יַעֲשֶׂה לוֹ כְּרִשְׁעוֹ גֵּרַשְׁתִּהוּ׃
    hebrewPlain: ואתנהו ביד איל גוים עשו יעשה לו כרשעו גרשתהו
    kjvRefs:
    - Ezekiel 31:11
    kjvOsis:
    - Ezek.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.12
    scripture: tanakh
    name: Tanakh Ezekiel 31:12
    ref: Ezekiel 31:12
    book: Ezek
    section: neviim
    chapter: 31
    verse: 12
    ordinal: 13597
    text: And strangers, the terrible of the nations, do cut him off, and cast him down; upon the mountains and in all the valleys his branches are fallen, and his boughs lie broken in all the channels of the land; and all the peoples of the earth do go down from his shadow, and do leave him.
    translation: JPS 1917
    original: וַיִּכְרְתֻהוּ זָרִים עָרִיצֵי גוֹיִם וַיִּטְּשֻׁהוּ אֶל־הֶהָרִים וּבְכָל־גֵּאָיוֹת נָפְלוּ דָלִיּוֹתָיו וַתִּשָּׁבַרְנָה פֹארֹתָיו בְּכֹל אֲפִיקֵי הָאָרֶץ וַיֵּרְדוּ מִצִּלּוֹ כָּל־עַמֵּי הָאָרֶץ וַיִּטְּשֻׁהוּ׃
    hebrewPlain: ויכרתהו זרים עריצי גוים ויטשהו אל ההרים ובכל גאיות נפלו דליותיו ותשברנה פארתיו בכל אפיקי הארץ וירדו מצלו כל עמי הארץ ויטשהו
    kjvRefs:
    - Ezekiel 31:12
    kjvOsis:
    - Ezek.31.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.13
    scripture: tanakh
    name: Tanakh Ezekiel 31:13
    ref: Ezekiel 31:13
    book: Ezek
    section: neviim
    chapter: 31
    verse: 13
    ordinal: 13598
    text: Upon his carcass all the fowls of the heaven do dwell, and upon his branches are all the beasts of the field;
    translation: JPS 1917
    original: עַל־מַפַּלְתּוֹ יִשְׁכְּנוּ כָּל־עוֹף הַשָּׁמָיִם וְאֶל־פֹּארֹתָיו הָיוּ כֹּל חַיַּת הַשָּׂדֶה׃
    hebrewPlain: על מפלתו ישכנו כל עוף השמים ואל פארתיו היו כל חית השדה
    kjvRefs:
    - Ezekiel 31:13
    kjvOsis:
    - Ezek.31.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.14
    scripture: tanakh
    name: Tanakh Ezekiel 31:14
    ref: Ezekiel 31:14
    book: Ezek
    section: neviim
    chapter: 31
    verse: 14
    ordinal: 13599
    text: to the end that none of all the trees by the waters exalt themselves in their stature, neither set their top among the thick boughs, nor that their mighty ones stand up in their height, even all that drink water; for they are all delivered unto death, to the nether parts of the earth, in the midst of the children of men, with them that go down to the pit.
    translation: JPS 1917
    original: לְמַעַן אֲשֶׁר לֹא־יִגְבְּהוּ בְקוֹמָתָם כָּל־עֲצֵי־מַיִם וְלֹא־יִתְּנוּ אֶת־צַמַּרְתָּם אֶל־בֵּין עֲבֹתִים וְלֹא־יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם כָּל־שֹׁתֵי מָיִם כִּי־כֻלָּם נִתְּנוּ לַמָּוֶת אֶל־אֶרֶץ תַּחְתִּית בְּתוֹךְ בְּנֵי אָדָם אֶל־יוֹרְדֵי בוֹר׃
    hebrewPlain: למען אשר לא יגבהו בקומתם כל עצי מים ולא יתנו את צמרתם אל בין עבתים ולא יעמדו אליהם בגבהם כל שתי מים כי כלם נתנו למות אל ארץ תחתית בתוך בני אדם אל יורדי בור
    kjvRefs:
    - Ezekiel 31:14
    kjvOsis:
    - Ezek.31.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.15
    scripture: tanakh
    name: Tanakh Ezekiel 31:15
    ref: Ezekiel 31:15
    book: Ezek
    section: neviim
    chapter: 31
    verse: 15
    ordinal: 13600
    text: 'Thus saith the Lord GOD: In the day when he went down to the nether-world I caused the deep to mourn and cover itself for him, and I restrained the rivers thereof, and the great waters were stayed; and I caused Lebanon to mourn for him, and all the trees of the field fainted for him.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה בְּיוֹם רִדְתּוֹ שְׁאוֹלָה הֶאֱבַלְתִּי כִּסֵּתִי עָלָיו אֶת־תְּהוֹם וָאֶמְנַע נַהֲרוֹתֶיהָ וַיִּכָּלְאוּ מַיִם רַבִּים וָאַקְדִּר עָלָיו לְבָנוֹן וְכָל־עֲצֵי הַשָּׂדֶה עָלָיו עֻלְפֶּה׃
    hebrewPlain: כה אמר אדני יהוה ביום רדתו שאולה האבלתי כסתי עליו את תהום ואמנע נהרותיה ויכלאו מים רבים ואקדר עליו לבנון וכל עצי השדה עליו עלפה
    kjvRefs:
    - Ezekiel 31:15
    kjvOsis:
    - Ezek.31.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.16
    scripture: tanakh
    name: Tanakh Ezekiel 31:16
    ref: Ezekiel 31:16
    book: Ezek
    section: neviim
    chapter: 31
    verse: 16
    ordinal: 13601
    text: I made the nations to shake at the sound of his fall, when I cast him down to the nether-world with them that descend into the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water, were comforted in the nether parts of the earth.
    translation: JPS 1917
    original: מִקּוֹל מַפַּלְתּוֹ הִרְעַשְׁתִּי גוֹיִם בְּהוֹרִדִי אֹתוֹ שְׁאוֹלָה אֶת־יוֹרְדֵי בוֹר וַיִּנָּחֲמוּ בְּאֶרֶץ תַּחְתִּית כָּל־עֲצֵי־עֵדֶן מִבְחַר וְטוֹב־לְבָנוֹן כָּל־שֹׁתֵי מָיִם׃
    hebrewPlain: מקול מפלתו הרעשתי גוים בהורדי אתו שאולה את יורדי בור וינחמו בארץ תחתית כל עצי עדן מבחר וטוב לבנון כל שתי מים
    kjvRefs:
    - Ezekiel 31:16
    kjvOsis:
    - Ezek.31.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.17
    scripture: tanakh
    name: Tanakh Ezekiel 31:17
    ref: Ezekiel 31:17
    book: Ezek
    section: neviim
    chapter: 31
    verse: 17
    ordinal: 13602
    text: They also went down into the nether-world with him unto them that are slain by the sword; yea, they that were in his arm, that dwelt under his shadow in the midst of the nations.
    translation: JPS 1917
    original: גַּם־הֵם אִתּוֹ יָרְדוּ שְׁאוֹלָה אֶל־חַלְלֵי־חָרֶב וּזְרֹעוֹ יָשְׁבוּ בְצִלּוֹ בְּתוֹךְ גּוֹיִם׃
    hebrewPlain: גם הם אתו ירדו שאולה אל חללי חרב וזרעו ישבו בצלו בתוך גוים
    kjvRefs:
    - Ezekiel 31:17
    kjvOsis:
    - Ezek.31.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.31.18
    scripture: tanakh
    name: Tanakh Ezekiel 31:18
    ref: Ezekiel 31:18
    book: Ezek
    section: neviim
    chapter: 31
    verse: 18
    ordinal: 13603
    text: To whom art thou thus like in glory and in greatness among the trees of Eden? yet shall thou be brought down with the trees of Eden unto the nether parts of the earth; thou shalt lie in the midst of the uncircumcised, with them that are slain by the sword. This is Pharaoh and all his multitude, saith the Lord GOD.’
    translation: JPS 1917
    original: אֶל־מִי דָמִיתָ כָּכָה בְּכָבוֹד וּבְגֹדֶל בַּעֲצֵי־עֵדֶן וְהוּרַדְתָּ אֶת־עֲצֵי־עֵדֶן אֶל־אֶרֶץ תַּחְתִּית בְּתוֹךְ עֲרֵלִים תִּשְׁכַּב אֶת־חַלְלֵי־חֶרֶב הוּא פַרְעֹה וְכָל־הֲמוֹנֹה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: אל מי דמית ככה בכבוד ובגדל בעצי עדן והורדת את עצי עדן אל ארץ תחתית בתוך ערלים תשכב את חללי חרב הוא פרעה וכל המונה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 31:18
    kjvOsis:
    - Ezek.31.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.31
- type: TanakhVerse
  data:
    osis: Ezek.32.1
    scripture: tanakh
    name: Tanakh Ezekiel 32:1
    ref: Ezekiel 32:1
    book: Ezek
    section: neviim
    chapter: 32
    verse: 1
    ordinal: 13604
    text: 'And it came to pass in the twelfth year, in the twelfth month, in the first day of the month, that the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה בִּשְׁנֵי־עָשָׂר חֹדֶשׁ בְּאֶחָד לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי בשתי עשרה שנה בשני עשר חדש באחד לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 32:1
    kjvOsis:
    - Ezek.32.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.2
    scripture: tanakh
    name: Tanakh Ezekiel 32:2
    ref: Ezekiel 32:2
    book: Ezek
    section: neviim
    chapter: 32
    verse: 2
    ordinal: 13605
    text: '’Son of man, take up a lamentation for Pharaoh king of Egypt, and say unto him: Thou didst liken thyself unto a young lion of the nations; Whereas thou art as a dragon in the seas; And thou didst gush forth with thy rivers, And didst trouble the waters with thy feet, And foul their rivers.'
    translation: JPS 1917
    original: בֶּן־אָדָם שָׂא קִינָה עַל־פַּרְעֹה מֶלֶךְ־מִצְרַיִם וְאָמַרְתָּ אֵלָיו כְּפִיר גּוֹיִם נִדְמֵיתָ וְאַתָּה כַּתַּנִּים בַּיַּמִּים וַתָּגַח בְּנַהֲרוֹתֶיךָ וַתִּדְלַח־מַיִם בְּרַגְלֶיךָ וַתִּרְפֹּס נַהֲרוֹתָם׃
    hebrewPlain: בן אדם שא קינה על פרעה מלך מצרים ואמרת אליו כפיר גוים נדמית ואתה כתנים בימים ותגח בנהרותיך ותדלח מים ברגליך ותרפס נהרותם
    kjvRefs:
    - Ezekiel 32:2
    kjvOsis:
    - Ezek.32.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.3
    scripture: tanakh
    name: Tanakh Ezekiel 32:3
    ref: Ezekiel 32:3
    book: Ezek
    section: neviim
    chapter: 32
    verse: 3
    ordinal: 13606
    text: 'Thus saith the Lord GOD: I will therefore spread out My net over thee With a company of many peoples; And they shall bring thee up in My net.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה וּפָרַשְׂתִּי עָלֶיךָ אֶת־רִשְׁתִּי בִּקְהַל עַמִּים רַבִּים וְהֶעֱלוּךָ בְּחֶרְמִי׃
    hebrewPlain: כה אמר אדני יהוה ופרשתי עליך את רשתי בקהל עמים רבים והעלוך בחרמי
    kjvRefs:
    - Ezekiel 32:3
    kjvOsis:
    - Ezek.32.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.4
    scripture: tanakh
    name: Tanakh Ezekiel 32:4
    ref: Ezekiel 32:4
    book: Ezek
    section: neviim
    chapter: 32
    verse: 4
    ordinal: 13607
    text: And I will cast thee upon the land, I will hurl thee upon the open field, And will cause all the fowls of the heaven to settle upon thee, And I will fill the beasts of the whole earth with thee.
    translation: JPS 1917
    original: וּנְטַשְׁתִּיךָ בָאָרֶץ עַל־פְּנֵי הַשָּׂדֶה אֲטִילֶךָ וְהִשְׁכַּנְתִּי עָלֶיךָ כָּל־עוֹף הַשָּׁמַיִם וְהִשְׂבַּעְתִּי מִמְּךָ חַיַּת כָּל־הָאָרֶץ׃
    hebrewPlain: ונטשתיך בארץ על פני השדה אטילך והשכנתי עליך כל עוף השמים והשבעתי ממך חית כל הארץ
    kjvRefs:
    - Ezekiel 32:4
    kjvOsis:
    - Ezek.32.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.5
    scripture: tanakh
    name: Tanakh Ezekiel 32:5
    ref: Ezekiel 32:5
    book: Ezek
    section: neviim
    chapter: 32
    verse: 5
    ordinal: 13608
    text: And I will lay thy flesh upon the mountains, And fill the valleys with thy foulness.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־בְּשָׂרְךָ עַל־הֶהָרִים וּמִלֵּאתִי הַגֵּאָיוֹת רָמוּתֶךָ׃
    hebrewPlain: ונתתי את בשרך על ההרים ומלאתי הגאיות רמותך
    kjvRefs:
    - Ezekiel 32:5
    kjvOsis:
    - Ezek.32.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.6
    scripture: tanakh
    name: Tanakh Ezekiel 32:6
    ref: Ezekiel 32:6
    book: Ezek
    section: neviim
    chapter: 32
    verse: 6
    ordinal: 13609
    text: I will also water with thy blood the land wherein thou swimmest, even to the mountains; And the channels shall be full of thee.
    translation: JPS 1917
    original: וְהִשְׁקֵיתִי אֶרֶץ צָפָתְךָ מִדָּמְךָ אֶל־הֶהָרִים וַאֲפִקִים יִמָּלְאוּן מִמֶּךָּ׃
    hebrewPlain: והשקיתי ארץ צפתך מדמך אל ההרים ואפקים ימלאון ממך
    kjvRefs:
    - Ezekiel 32:6
    kjvOsis:
    - Ezek.32.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.7
    scripture: tanakh
    name: Tanakh Ezekiel 32:7
    ref: Ezekiel 32:7
    book: Ezek
    section: neviim
    chapter: 32
    verse: 7
    ordinal: 13610
    text: And when I shall extinguish thee, I will cover the heaven, And make the stars thereof black; I will cover the sun with a cloud, And the moon shall not give her light.
    translation: JPS 1917
    original: וְכִסֵּיתִי בְכַבּוֹתְךָ שָׁמַיִם וְהִקְדַּרְתִּי אֶת־כֹּכְבֵיהֶם שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ וְיָרֵחַ לֹא־יָאִיר אוֹרוֹ׃
    hebrewPlain: וכסיתי בכבותך שמים והקדרתי את ככביהם שמש בענן אכסנו וירח לא יאיר אורו
    kjvRefs:
    - Ezekiel 32:7
    kjvOsis:
    - Ezek.32.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.8
    scripture: tanakh
    name: Tanakh Ezekiel 32:8
    ref: Ezekiel 32:8
    book: Ezek
    section: neviim
    chapter: 32
    verse: 8
    ordinal: 13611
    text: All the bright lights of heaven Will I make black over thee, And set darkness upon thy land, Saith the Lord GOD.
    translation: JPS 1917
    original: כָּל־מְאוֹרֵי אוֹר בַּשָּׁמַיִם אַקְדִּירֵם עָלֶיךָ וְנָתַתִּי חֹשֶׁךְ עַל־אַרְצְךָ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כל מאורי אור בשמים אקדירם עליך ונתתי חשך על ארצך נאם אדני יהוה
    kjvRefs:
    - Ezekiel 32:8
    kjvOsis:
    - Ezek.32.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.9
    scripture: tanakh
    name: Tanakh Ezekiel 32:9
    ref: Ezekiel 32:9
    book: Ezek
    section: neviim
    chapter: 32
    verse: 9
    ordinal: 13612
    text: I will also vex the hearts of many peoples, when I shall bring thy destruction among the nations, into the countries which thou hast not known.
    translation: JPS 1917
    original: וְהִכְעַסְתִּי לֵב עַמִּים רַבִּים בַּהֲבִיאִי שִׁבְרְךָ בַּגּוֹיִם עַל־אֲרָצוֹת אֲשֶׁר לֹא־יְדַעְתָּם׃
    hebrewPlain: והכעסתי לב עמים רבים בהביאי שברך בגוים על ארצות אשר לא ידעתם
    kjvRefs:
    - Ezekiel 32:9
    kjvOsis:
    - Ezek.32.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.10
    scripture: tanakh
    name: Tanakh Ezekiel 32:10
    ref: Ezekiel 32:10
    book: Ezek
    section: neviim
    chapter: 32
    verse: 10
    ordinal: 13613
    text: Yea, I will make many peoples appalled at thee, and their kings shall be horribly afraid for thee, when I shall brandish My sword before them; and they shall tremble at every moment, every man for his own life, in the day of thy fall.
    translation: JPS 1917
    original: וַהֲשִׁמּוֹתִי עָלֶיךָ עַמִּים רַבִּים וּמַלְכֵיהֶם יִשְׂעֲרוּ עָלֶיךָ שַׂעַר בְּעוֹפְפִי חַרְבִּי עַל־פְּנֵיהֶם וְחָרְדוּ לִרְגָעִים אִישׁ לְנַפְשׁוֹ בְּיוֹם מַפַּלְתֶּךָ׃
    hebrewPlain: והשמותי עליך עמים רבים ומלכיהם ישערו עליך שער בעופפי חרבי על פניהם וחרדו לרגעים איש לנפשו ביום מפלתך
    kjvRefs:
    - Ezekiel 32:10
    kjvOsis:
    - Ezek.32.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.11
    scripture: tanakh
    name: Tanakh Ezekiel 32:11
    ref: Ezekiel 32:11
    book: Ezek
    section: neviim
    chapter: 32
    verse: 11
    ordinal: 13614
    text: 'For thus saith the Lord GOD: The sword of the king of Babylon shall come upon thee.'
    translation: JPS 1917
    original: כִּי כֹּה אָמַר אֲדֹנָי יְהוִה חֶרֶב מֶלֶךְ־בָּבֶל תְּבוֹאֶךָ׃
    hebrewPlain: כי כה אמר אדני יהוה חרב מלך בבל תבואך
    kjvRefs:
    - Ezekiel 32:11
    kjvOsis:
    - Ezek.32.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.12
    scripture: tanakh
    name: Tanakh Ezekiel 32:12
    ref: Ezekiel 32:12
    book: Ezek
    section: neviim
    chapter: 32
    verse: 12
    ordinal: 13615
    text: By the swords of the mighty will I cause thy multitude to fall; The terrible of the nations are they all; And they shall spoil the pride of Egypt, And all the multitude thereof shall be destroyed.
    translation: JPS 1917
    original: בְּחַרְבוֹת גִּבּוֹרִים אַפִּיל הֲמוֹנֶךָ עָרִיצֵי גוֹיִם כֻּלָּם וְשָׁדְדוּ אֶת־גְּאוֹן מִצְרַיִם וְנִשְׁמַד כָּל־הֲמוֹנָהּ׃
    hebrewPlain: בחרבות גבורים אפיל המונך עריצי גוים כלם ושדדו את גאון מצרים ונשמד כל המונה
    kjvRefs:
    - Ezekiel 32:12
    kjvOsis:
    - Ezek.32.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.13
    scripture: tanakh
    name: Tanakh Ezekiel 32:13
    ref: Ezekiel 32:13
    book: Ezek
    section: neviim
    chapter: 32
    verse: 13
    ordinal: 13616
    text: I will destroy also all the beasts thereof From beside many waters; Neither shall the foot of man trouble them any more, Nor the hoofs of beasts trouble them.
    translation: JPS 1917
    original: וְהַאֲבַדְתִּי אֶת־כָּל־בְּהֶמְתָּהּ מֵעַל מַיִם רַבִּים וְלֹא תִדְלָחֵם רֶגֶל־אָדָם עוֹד וּפַרְסוֹת בְּהֵמָה לֹא תִדְלָחֵם׃
    hebrewPlain: והאבדתי את כל בהמתה מעל מים רבים ולא תדלחם רגל אדם עוד ופרסות בהמה לא תדלחם
    kjvRefs:
    - Ezekiel 32:13
    kjvOsis:
    - Ezek.32.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.14
    scripture: tanakh
    name: Tanakh Ezekiel 32:14
    ref: Ezekiel 32:14
    book: Ezek
    section: neviim
    chapter: 32
    verse: 14
    ordinal: 13617
    text: Then will I make their waters to settle, And cause their rivers to run like oil, Saith the Lord GOD.
    translation: JPS 1917
    original: אָז אַשְׁקִיעַ מֵימֵיהֶם וְנַהֲרוֹתָם כַּשֶּׁמֶן אוֹלִיךְ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: אז אשקיע מימיהם ונהרותם כשמן אוליך נאם אדני יהוה
    kjvRefs:
    - Ezekiel 32:14
    kjvOsis:
    - Ezek.32.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.15
    scripture: tanakh
    name: Tanakh Ezekiel 32:15
    ref: Ezekiel 32:15
    book: Ezek
    section: neviim
    chapter: 32
    verse: 15
    ordinal: 13618
    text: When I shall make the land of Egypt desolate and waste, A land destitute of that whereof it was full, When I shall smite all them that dwell therein, Then shall they know that I am the LORD.
    translation: JPS 1917
    original: בְּתִתִּי אֶת־אֶרֶץ מִצְרַיִם שְׁמָמָה וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ בְּהַכּוֹתִי אֶת־כָּל־יוֹשְׁבֵי בָהּ וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: בתתי את ארץ מצרים שממה ונשמה ארץ ממלאה בהכותי את כל יושבי בה וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 32:15
    kjvOsis:
    - Ezek.32.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.16
    scripture: tanakh
    name: Tanakh Ezekiel 32:16
    ref: Ezekiel 32:16
    book: Ezek
    section: neviim
    chapter: 32
    verse: 16
    ordinal: 13619
    text: This is the lamentation wherewith they shall lament; The daughters of the nations shall lament therewith; For Egypt, and for all her multitude, shall they lament therewith, Saith the Lord GOD.’
    translation: JPS 1917
    original: קִינָה הִיא וְקוֹנְנוּהָ בְּנוֹת הַגּוֹיִם תְּקוֹנֵנָּה אוֹתָהּ עַל־מִצְרַיִם וְעַל־כָּל־הֲמוֹנָהּ תְּקוֹנֵנָּה אוֹתָהּ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: קינה היא וקוננוה בנות הגוים תקוננה אותה על מצרים ועל כל המונה תקוננה אותה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 32:16
