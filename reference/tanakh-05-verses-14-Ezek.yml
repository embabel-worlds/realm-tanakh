    scripture: tanakh
    name: Tanakh Ezekiel 18:9
    ref: Ezekiel 18:9
    book: Ezek
    section: neviim
    chapter: 18
    verse: 9
    ordinal: 13213
    text: hath walked in My statutes, and hath kept Mine ordinances, to deal truly; he is just, he shall surely live, saith the Lord GOD.
    translation: JPS 1917
    original: בְּחֻקּוֹתַי יְהַלֵּךְ וּמִשְׁפָּטַי שָׁמַר לַעֲשׂוֹת אֱמֶת צַדִּיק הוּא חָיֹה יִחְיֶה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: בחקותי יהלך ומשפטי שמר לעשות אמת צדיק הוא חיה יחיה נאם אדני יהוה
    kjvRefs:
