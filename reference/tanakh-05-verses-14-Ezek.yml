  data:
    osis: Ezek.21.7
    scripture: tanakh
    name: Tanakh Ezekiel 21:7
    ref: Ezekiel 21:7
    book: Ezek
    section: neviim
    chapter: 21
    verse: 7
    ordinal: 13301
    text: ’Son of man, set thy face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel;
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ אֶל־יְרוּשָׁלִַם וְהַטֵּף אֶל־מִקְדָּשִׁים וְהִנָּבֵא אֶל־אַדְמַת יִשְׂרָאֵל׃
    hebrewPlain: בן אדם שים פניך אל ירושלם והטף אל מקדשים והנבא אל אדמת ישראל
    kjvRefs:
    - Ezekiel 21:2
    kjvOsis:
    - Ezek.21.2
  relations:
  - predicate: IN
