    name: Tanakh Ezekiel 24:18
    ref: Ezekiel 24:18
    book: Ezek
    section: neviim
    chapter: 24
    verse: 18
    ordinal: 13429
    text: So I spoke unto the people in the morning, and at even my wife died; and I did in the morning as I was commanded.
    translation: JPS 1917
    original: וָאֲדַבֵּר אֶל־הָעָם בַּבֹּקֶר וַתָּמָת אִשְׁתִּי בָּעָרֶב וָאַעַשׂ בַּבֹּקֶר כַּאֲשֶׁר צֻוֵּיתִי׃
    hebrewPlain: ואדבר אל העם בבקר ותמת אשתי בערב ואעש בבקר כאשר צויתי
