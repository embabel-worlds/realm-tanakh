- type: TanakhVerse
  data:
    osis: Ezek.34.21
    scripture: tanakh
    name: Tanakh Ezekiel 34:21
    ref: Ezekiel 34:21
    book: Ezek
    section: neviim
    chapter: 34
    verse: 21
    ordinal: 13689
    text: Because ye thrust with side and with shoulder, and push all the weak with your horns, till ye have scattered them abroad;
    translation: JPS 1917
    original: יַעַן בְּצַד וּבְכָתֵף תֶּהְדֹּפוּ וּבְקַרְנֵיכֶם תְּנַגְּחוּ כָּל־הַנַּחְלוֹת עַד אֲשֶׁר הֲפִיצוֹתֶם אוֹתָנָה אֶל־הַחוּצָה׃
    hebrewPlain: יען בצד ובכתף תהדפו ובקרניכם תנגחו כל הנחלות עד אשר הפיצותם אותנה אל החוצה
    kjvRefs:
    - Ezekiel 34:21
    kjvOsis:
    - Ezek.34.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
