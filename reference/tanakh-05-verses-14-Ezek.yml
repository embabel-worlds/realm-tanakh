  data:
    osis: Ezek.18.14
    scripture: tanakh
    name: Tanakh Ezekiel 18:14
    ref: Ezekiel 18:14
    book: Ezek
    section: neviim
    chapter: 18
    verse: 14
    ordinal: 13218
    text: Now, lo, if he beget a son, that seeth all his father’s sins, which he hath done, and considereth, and doeth not such like,
    translation: JPS 1917
    original: וְהִנֵּה הוֹלִיד בֵּן וַיַּרְא אֶת־כָּל־חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה וַיִּרְאֶה וְלֹא יַעֲשֶׂה כָּהֵן׃
    hebrewPlain: והנה הוליד בן וירא את כל חטאת אביו אשר עשה ויראה ולא יעשה כהן
    kjvRefs:
    - Ezekiel 18:14
    kjvOsis:
    - Ezek.18.14
