  data:
    osis: Ezek.18.12
    scripture: tanakh
    name: Tanakh Ezekiel 18:12
    ref: Ezekiel 18:12
    book: Ezek
    section: neviim
    chapter: 18
    verse: 12
    ordinal: 13216
    text: hath wronged the poor and needy, hath taken by robbery, hath not restored the pledge, and hath lifted up his eyes to the idols, hath committed abomination,
    translation: JPS 1917
    original: עָנִי וְאֶבְיוֹן הוֹנָה גְּזֵלוֹת גָּזָל חֲבֹל לֹא יָשִׁיב וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו תּוֹעֵבָה עָשָׂה׃
    hebrewPlain: עני ואביון הונה גזלות גזל חבל לא ישיב ואל הגלולים נשא עיניו תועבה עשה
    kjvRefs:
    - Ezekiel 18:12
    kjvOsis:
    - Ezek.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
