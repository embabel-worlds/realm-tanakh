    ref: Ezekiel 20:24
    book: Ezek
    section: neviim
    chapter: 20
    verse: 24
    ordinal: 13274
    text: because they had not executed Mine ordinances, but had rejected My statutes, and had profaned My sabbaths, and their eyes were after their fathers’ idols.
    translation: JPS 1917
    original: יַעַן מִשְׁפָּטַי לֹא־עָשׂוּ וְחֻקּוֹתַי מָאָסוּ וְאֶת־שַׁבְּתוֹתַי חִלֵּלוּ וְאַחֲרֵי גִּלּוּלֵי אֲבוֹתָם הָיוּ עֵינֵיהֶם׃
    hebrewPlain: יען משפטי לא עשו וחקותי מאסו ואת שבתותי חללו ואחרי גלולי אבותם היו עיניהם
