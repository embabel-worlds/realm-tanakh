    translation: JPS 1917
    original: אֶל־בְּנֵי אַשּׁוּר עָגָבָה פַּחוֹת וּסְגָנִים קְרֹבִים לְבֻשֵׁי מִכְלוֹל פָּרָשִׁים רֹכְבֵי סוּסִים בַּחוּרֵי חֶמֶד כֻּלָּם׃
    hebrewPlain: אל בני אשור עגבה פחות וסגנים קרבים לבשי מכלול פרשים רכבי סוסים בחורי חמד כלם
