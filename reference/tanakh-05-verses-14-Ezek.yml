  data:
    osis: Ezek.21.3
    scripture: tanakh
    name: Tanakh Ezekiel 21:3
    ref: Ezekiel 21:3
    book: Ezek
    section: neviim
    chapter: 21
    verse: 3
    ordinal: 13297
    text: 'and say to the forest of the South: Hear the word of the LORD: Thus saith the Lord GOD: Behold, I will kindle a fire in thee, and it shall devour every green tree in thee, and every dry tree, it shall not be quenched, even a flaming flame; and all faces from the south to the north shall be seared thereby.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לְיַעַר הַנֶּגֶב שְׁמַע דְּבַר־יְהוָה כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי מַצִּית־בְּךָ אֵשׁ וְאָכְלָה בְךָ כָל־עֵץ־לַח וְכָל־עֵץ יָבֵשׁ לֹא־תִכְבֶּה לַהֶבֶת שַׁלְהֶבֶת וְנִצְרְבוּ־בָהּ כָּל־פָּנִים מִנֶּגֶב צָפוֹנָה׃
    hebrewPlain: ואמרת ליער הנגב שמע דבר יהוה כה אמר אדני יהוה הנני מצית בך אש ואכלה בך כל עץ לח וכל עץ יבש לא תכבה להבת שלהבת ונצרבו בה כל פנים מנגב צפונה
    kjvRefs:
    - Ezekiel 20:47
    kjvOsis:
    - Ezek.20.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.4
    scripture: tanakh
    name: Tanakh Ezekiel 21:4
    ref: Ezekiel 21:4
    book: Ezek
    section: neviim
    chapter: 21
    verse: 4
    ordinal: 13298
    text: And all flesh shall see that I the LORD have kindled it; it shall not be quenched.’
    translation: JPS 1917
    original: וְרָאוּ כָּל־בָּשָׂר כִּי אֲנִי יְהוָה בִּעַרְתִּיהָ לֹא תִּכְבֶּה׃
    hebrewPlain: וראו כל בשר כי אני יהוה בערתיה לא תכבה
    kjvRefs:
