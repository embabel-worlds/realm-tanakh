    name: Tanakh Ezekiel 20:21
    ref: Ezekiel 20:21
    book: Ezek
    section: neviim
    chapter: 20
    verse: 21
    ordinal: 13271
    text: But the children rebelled against Me; they walked not in My statutes, neither kept Mine ordinances to do them, which if a man do, he shall live by them; they profaned My sabbaths; then I said I would pour out My fury upon them, to spend My anger upon them in the wilderness.
    translation: JPS 1917
    original: וַיַּמְרוּ־בִי הַבָּנִים בְּחֻקּוֹתַי לֹא־הָלָכוּ וְאֶת־מִשְׁפָּטַי לֹא־שָׁמְרוּ לַעֲשׂוֹת אוֹתָם אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם אֶת־שַׁבְּתוֹתַי חִלֵּלוּ וָאֹמַר לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם לְכַלּוֹת אַפִּי בָּם בַּמִּדְבָּר׃
    hebrewPlain: וימרו בי הבנים בחקותי לא הלכו ואת משפטי לא שמרו לעשות אותם אשר יעשה אותם האדם וחי בהם את שבתותי חללו ואמר לשפך חמתי עליהם לכלות אפי בם במדבר
