  data:
    osis: Ezek.24.21
    scripture: tanakh
    name: Tanakh Ezekiel 24:21
    ref: Ezekiel 24:21
    book: Ezek
    section: neviim
    chapter: 24
    verse: 21
    ordinal: 13432
    text: 'Speak unto the house of Israel: Thus saith the Lord GOD: Behold, I will profane My sanctuary, the pride of your power, the desire of your eyes, and the longing of your soul; and your sons and your daughters whom ye have left behind shall fall by the sword.'
    translation: JPS 1917
    original: אֱמֹר לְבֵית יִשְׂרָאֵל כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי מְחַלֵּל אֶת־מִקְדָּשִׁי גְּאוֹן עֻזְּכֶם מַחְמַד עֵינֵיכֶם וּמַחְמַל נַפְשְׁכֶם וּבְנֵיכֶם וּבְנוֹתֵיכֶם אֲשֶׁר עֲזַבְתֶּם בַּחֶרֶב יִפֹּלוּ׃
    hebrewPlain: אמר לבית ישראל כה אמר אדני יהוה הנני מחלל את מקדשי גאון עזכם מחמד עיניכם ומחמל נפשכם ובניכם ובנותיכם אשר עזבתם בחרב יפלו
    kjvRefs:
    - Ezekiel 24:21
    kjvOsis:
    - Ezek.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.24
- type: TanakhVerse
  data:
