    ordinal: 13921
    text: When the priests enter in, then shall they not go out of the holy place into the outer court, but there they shall lay their garments wherein they minister, for they are holy; and they shall put on other garments, and shall approach to that which pertaineth to the people.’
    translation: JPS 1917
    original: בְּבֹאָם הַכֹּהֲנִים וְלֹא־יֵצְאוּ מֵהַקֹּדֶשׁ אֶל־הֶחָצֵר הַחִיצוֹנָה וְשָׁם יַנִּיחוּ בִגְדֵיהֶם אֲשֶׁר־יְשָׁרְתוּ בָהֶן כִּי־קֹדֶשׁ הֵנָּה ילבשו [וְלָבְשׁוּ] בְּגָדִים אֲחֵרִים וְקָרְבוּ אֶל־אֲשֶׁר לָעָם׃
    hebrewPlain: בבאם הכהנים ולא יצאו מהקדש אל החצר החיצונה ושם יניחו בגדיהם אשר ישרתו בהן כי קדש הנה ילבשו [ולבשו] בגדים אחרים וקרבו אל אשר לעם
