- type: TanakhVerse
  data:
    osis: Ezek.21.8
    scripture: tanakh
    name: Tanakh Ezekiel 21:8
    ref: Ezekiel 21:8
    book: Ezek
    section: neviim
    chapter: 21
    verse: 8
    ordinal: 13302
    text: 'and say to the land of Israel: Thus saith the LORD: Behold, I am against thee, and will draw forth My sword out of its sheath, and will cut off from thee the righteous and the wicked.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לְאַדְמַת יִשְׂרָאֵל כֹּה אָמַר יְהוָה הִנְנִי אֵלַיִךְ וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ וְהִכְרַתִּי מִמֵּךְ צַדִּיק וְרָשָׁע׃
    hebrewPlain: ואמרת לאדמת ישראל כה אמר יהוה הנני אליך והוצאתי חרבי מתערה והכרתי ממך צדיק ורשע
    kjvRefs:
    - Ezekiel 21:3
    kjvOsis:
    - Ezek.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.9
    scripture: tanakh
    name: Tanakh Ezekiel 21:9
    ref: Ezekiel 21:9
    book: Ezek
    section: neviim
    chapter: 21
    verse: 9
    ordinal: 13303
    text: Seeing then that I will cut off from thee the righteous and the wicked, therefore shall My sword go forth out of its sheath against all flesh from the south to the north;
    translation: JPS 1917
    original: יַעַן אֲשֶׁר־הִכְרַתִּי מִמֵּךְ צַדִּיק וְרָשָׁע לָכֵן תֵּצֵא חַרְבִּי מִתַּעְרָהּ אֶל־כָּל־בָּשָׂר מִנֶּגֶב צָפוֹן׃
    hebrewPlain: יען אשר הכרתי ממך צדיק ורשע לכן תצא חרבי מתערה אל כל בשר מנגב צפון
    kjvRefs:
    - Ezekiel 21:4
    kjvOsis:
    - Ezek.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.10
    scripture: tanakh
    name: Tanakh Ezekiel 21:10
    ref: Ezekiel 21:10
    book: Ezek
    section: neviim
    chapter: 21
    verse: 10
    ordinal: 13304
    text: and all flesh shall know that I the LORD have drawn forth My sword out of its sheath; it shall not return any more.
    translation: JPS 1917
    original: וְיָדְעוּ כָּל־בָּשָׂר כִּי אֲנִי יְהוָה הוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ לֹא תָשׁוּב עוֹד׃
    hebrewPlain: וידעו כל בשר כי אני יהוה הוצאתי חרבי מתערה לא תשוב עוד
    kjvRefs:
    - Ezekiel 21:5
    kjvOsis:
    - Ezek.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.11
    scripture: tanakh
    name: Tanakh Ezekiel 21:11
    ref: Ezekiel 21:11
    book: Ezek
    section: neviim
    chapter: 21
    verse: 11
    ordinal: 13305
    text: Sigh therefore, thou son of man; with the breaking of thy loins and with bitterness shalt thou sigh before their eyes.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הֵאָנַח בְּשִׁבְרוֹן מָתְנַיִם וּבִמְרִירוּת תֵּאָנַח לְעֵינֵיהֶם׃
    hebrewPlain: ואתה בן אדם האנח בשברון מתנים ובמרירות תאנח לעיניהם
    kjvRefs:
    - Ezekiel 21:6
    kjvOsis:
    - Ezek.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.12
    scripture: tanakh
    name: Tanakh Ezekiel 21:12
    ref: Ezekiel 21:12
    book: Ezek
    section: neviim
    chapter: 21
    verse: 12
    ordinal: 13306
    text: 'And it shall be, when they say unto thee: Wherefore sighest thou? that thou shalt say: Because of the tidings, for it cometh; and every heart shall melt, and all hands shall be slack, and every spirit shall be faint, and all knees shall drip with water; behold, it cometh, and it shall be done, saith the Lord GOD.’'
    translation: JPS 1917
    original: וְהָיָה כִּי־יֹאמְרוּ אֵלֶיךָ עַל־מָה אַתָּה נֶאֱנָח וְאָמַרְתָּ אֶל־שְׁמוּעָה כִי־בָאָה וְנָמֵס כָּל־לֵב וְרָפוּ כָל־יָדַיִם וְכִהֲתָה כָל־רוּחַ וְכָל־בִּרְכַּיִם תֵּלַכְנָה מַּיִם הִנֵּה בָאָה וְנִהְיָתָה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: והיה כי יאמרו אליך על מה אתה נאנח ואמרת אל שמועה כי באה ונמס כל לב ורפו כל ידים וכהתה כל רוח וכל ברכים תלכנה מים הנה באה ונהיתה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 21:7
    kjvOsis:
    - Ezek.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.13
    scripture: tanakh
    name: Tanakh Ezekiel 21:13
    ref: Ezekiel 21:13
    book: Ezek
    section: neviim
    chapter: 21
    verse: 13
    ordinal: 13307
