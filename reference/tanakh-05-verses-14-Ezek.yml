    scripture: tanakh
    name: Tanakh Ezekiel 18:16
    ref: Ezekiel 18:16
    book: Ezek
    section: neviim
    chapter: 18
    verse: 16
    ordinal: 13220
    text: neither hath wronged any, hath not taken aught to pledge, neither hath taken by robbery, but hath given his bread to the hungry, and hath covered the naked with a garment,
    translation: JPS 1917
    original: וְאִישׁ לֹא הוֹנָה חֲבֹל לֹא חָבָל וּגְזֵלָה לֹא גָזָל לַחְמוֹ לְרָעֵב נָתָן וְעֵרוֹם כִּסָּה־בָגֶד׃
    hebrewPlain: ואיש לא הונה חבל לא חבל וגזלה לא גזל לחמו לרעב נתן וערום כסה בגד
    kjvRefs:
    - Ezekiel 18:16
    kjvOsis:
    - Ezek.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
