    translation: JPS 1917
    original: וְגַם־אֲנִי נָתַתִּי לָהֶם חֻקִּים לֹא טוֹבִים וּמִשְׁפָּטִים לֹא יִחְיוּ בָּהֶם׃
    hebrewPlain: וגם אני נתתי להם חקים לא טובים ומשפטים לא יחיו בהם
