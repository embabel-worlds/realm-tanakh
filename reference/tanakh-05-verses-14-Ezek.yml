    verse: 35
    ordinal: 13329
    text: Cause it to return into its sheath!— In the place where thou wast created, in the land of thine origin, will I judge thee.
    translation: JPS 1917
    original: הָשַׁב אֶל־תַּעְרָהּ בִּמְקוֹם אֲשֶׁר־נִבְרֵאת בְּאֶרֶץ מְכֻרוֹתַיִךְ אֶשְׁפֹּט אֹתָךְ׃
    hebrewPlain: השב אל תערה במקום אשר נבראת בארץ מכרותיך אשפט אתך
    kjvRefs:
    - Ezekiel 21:30
    kjvOsis:
    - Ezek.21.30
