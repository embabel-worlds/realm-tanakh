    translation: JPS 1917
    original: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה בְּתוֹכָהּ חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־בָּנִים וְאִם־בָּנוֹת יַצִּילוּ הֵמָּה לְבַדָּם יִנָּצֵלוּ וְהָאָרֶץ תִּהְיֶה שְׁמָמָה׃
