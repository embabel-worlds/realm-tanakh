    name: Tanakh Ezekiel 23:17
    ref: Ezekiel 23:17
    book: Ezek
    section: neviim
    chapter: 23
    verse: 17
    ordinal: 13379
    text: And the Babylonians came to her into the bed of love, and they defiled her with their lust; and she was polluted with them, and her soul was alienated from them.
    translation: JPS 1917
    original: וַיָּבֹאוּ אֵלֶיהָ בְנֵי־בָבֶל לְמִשְׁכַּב דֹּדִים וַיְטַמְּאוּ אוֹתָהּ בְּתַזְנוּתָם וַתִּטְמָא־בָם וַתֵּקַע נַפְשָׁהּ מֵהֶם׃
    hebrewPlain: ויבאו אליה בני בבל למשכב דדים ויטמאו אותה בתזנותם ותטמא בם ותקע נפשה מהם
    kjvRefs:
