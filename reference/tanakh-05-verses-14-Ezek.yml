    scripture: tanakh
    name: Tanakh Ezekiel 23:22
    ref: Ezekiel 23:22
    book: Ezek
    section: neviim
    chapter: 23
    verse: 22
    ordinal: 13384
    text: 'Therefore, O Oholibah, thus saith the Lord GOD: Behold, I will raise up thy lovers against thee, from whom thy soul is alienated, and I will bring them against thee on every side:'
    translation: JPS 1917
    original: לָכֵן אָהֳלִיבָה כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי מֵעִיר אֶת־מְאַהֲבַיִךְ עָלַיִךְ אֵת אֲשֶׁר־נָקְעָה נַפְשֵׁךְ מֵהֶם וַהֲבֵאתִים עָלַיִךְ מִסָּבִיב׃
    hebrewPlain: לכן אהליבה כה אמר אדני יהוה הנני מעיר את מאהביך עליך את אשר נקעה נפשך מהם והבאתים עליך מסביב
    kjvRefs:
