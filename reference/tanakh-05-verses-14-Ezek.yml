    ref: Ezekiel 25:2
    book: Ezek
    section: neviim
    chapter: 25
    verse: 2
    ordinal: 13440
    text: ’Son of man, set thy face toward the children of Ammon, and prophesy against them;
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ אֶל־בְּנֵי עַמּוֹן וְהִנָּבֵא עֲלֵיהֶם׃
    hebrewPlain: בן אדם שים פניך אל בני עמון והנבא עליהם
