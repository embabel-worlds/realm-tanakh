    scripture: tanakh
    name: Tanakh Ezekiel 21:23
    ref: Ezekiel 21:23
    book: Ezek
    section: neviim
    chapter: 21
    verse: 23
    ordinal: 13317
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
