    scripture: tanakh
    name: Tanakh Ezekiel 20:27
    ref: Ezekiel 20:27
    book: Ezek
    section: neviim
    chapter: 20
    verse: 27
    ordinal: 13277
    text: 'Therefore, son of man, speak unto the house of Israel, and say unto them: Thus saith the Lord GOD: In this moreover have your fathers blasphemed Me, in that they dealt treacherously with Me.'
    translation: JPS 1917
    original: לָכֵן דַּבֵּר אֶל־בֵּית יִשְׂרָאֵל בֶּן־אָדָם וְאָמַרְתָּ אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהוִה עוֹד זֹאת גִּדְּפוּ אוֹתִי אֲבוֹתֵיכֶם בְּמַעֲלָם בִּי מָעַל׃
    hebrewPlain: לכן דבר אל בית ישראל בן אדם ואמרת אליהם כה אמר אדני יהוה עוד זאת גדפו אותי אבותיכם במעלם בי מעל
    kjvRefs:
    - Ezekiel 20:27
    kjvOsis:
    - Ezek.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.28
    scripture: tanakh
    name: Tanakh Ezekiel 20:28
    ref: Ezekiel 20:28
    book: Ezek
    section: neviim
    chapter: 20
    verse: 28
    ordinal: 13278
    text: For when I had brought them into the land, which I lifted up My hand to give unto them, then they saw every high hill, and every thick tree, and they offered there their sacrifices, and there they presented the provocation of their offering, there also they made their sweet savour, and there they poured out their drink-offerings.
    translation: JPS 1917
    original: וָאֲבִיאֵם אֶל־הָאָרֶץ אֲשֶׁר נָשָׂאתִי אֶת־יָדִי לָתֵת אוֹתָהּ לָהֶם וַיִּרְאוּ כָל־גִּבְעָה רָמָה וְכָל־עֵץ עָבֹת וַיִּזְבְּחוּ־שָׁם אֶת־זִבְחֵיהֶם וַיִּתְּנוּ־שָׁם כַּעַס קָרְבָּנָם וַיָּשִׂימוּ שָׁם רֵיחַ נִיחוֹחֵיהֶם וַיַּסִּיכוּ שָׁם אֶת־נִסְכֵּיהֶם׃
    hebrewPlain: ואביאם אל הארץ אשר נשאתי את ידי לתת אותה להם ויראו כל גבעה רמה וכל עץ עבת ויזבחו שם את זבחיהם ויתנו שם כעס קרבנם וישימו שם ריח ניחוחיהם ויסיכו שם את נסכיהם
    kjvRefs:
    - Ezekiel 20:28
    kjvOsis:
    - Ezek.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.29
    scripture: tanakh
    name: Tanakh Ezekiel 20:29
    ref: Ezekiel 20:29
    book: Ezek
    section: neviim
    chapter: 20
    verse: 29
    ordinal: 13279
    text: 'Then I said unto them: What meaneth the high place whereunto ye go? So the name thereof is called Bamah unto this day.'
    translation: JPS 1917
    original: וָאֹמַר אֲלֵהֶם מָה הַבָּמָה אֲשֶׁר־אַתֶּם הַבָּאִים שָׁם וַיִּקָּרֵא שְׁמָהּ בָּמָה עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ואמר אלהם מה הבמה אשר אתם הבאים שם ויקרא שמה במה עד היום הזה
    kjvRefs:
    - Ezekiel 20:29
    kjvOsis:
    - Ezek.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.30
    scripture: tanakh
    name: Tanakh Ezekiel 20:30
    ref: Ezekiel 20:30
    book: Ezek
    section: neviim
    chapter: 20
    verse: 30
    ordinal: 13280
    text: 'Wherefore say unto the house of Israel: Thus saith the Lord GOD: When ye pollute yourselves after the manner of your fathers, and go after their abominations,'
    translation: JPS 1917
    original: לָכֵן אֱמֹר אֶל־בֵּית יִשְׂרָאֵל כֹּה אָמַר אֲדֹנָי יְהוִה הַבְּדֶרֶךְ אֲבוֹתֵיכֶם אַתֶּם נִטְמְאִים וְאַחֲרֵי שִׁקּוּצֵיהֶם אַתֶּם זֹנִים׃
    hebrewPlain: לכן אמר אל בית ישראל כה אמר אדני יהוה הבדרך אבותיכם אתם נטמאים ואחרי שקוציהם אתם זנים
    kjvRefs:
    - Ezekiel 20:30
    kjvOsis:
    - Ezek.20.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.31
    scripture: tanakh
    name: Tanakh Ezekiel 20:31
    ref: Ezekiel 20:31
    book: Ezek
    section: neviim
    chapter: 20
    verse: 31
    ordinal: 13281
    text: and when, in offering your gifts, in making your sons to pass through the fire, ye pollute yourselves with all your idols, unto this day; shall I then be inquired of by you, O house of Israel? As I live, saith the Lord GOD, I will not be inquired of by you;
    translation: JPS 1917
    original: וּבִשְׂאֵת מַתְּנֹתֵיכֶם בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ אַתֶּם נִטְמְאִים לְכָל־גִּלּוּלֵיכֶם עַד־הַיּוֹם וַאֲנִי אִדָּרֵשׁ לָכֶם בֵּית יִשְׂרָאֵל חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־אִדָּרֵשׁ לָכֶם׃
    hebrewPlain: ובשאת מתנתיכם בהעביר בניכם באש אתם נטמאים לכל גלוליכם עד היום ואני אדרש לכם בית ישראל חי אני נאם אדני יהוה אם אדרש לכם
    kjvRefs:
    - Ezekiel 20:31
    kjvOsis:
    - Ezek.20.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.32
    scripture: tanakh
    name: Tanakh Ezekiel 20:32
    ref: Ezekiel 20:32
    book: Ezek
    section: neviim
    chapter: 20
    verse: 32
    ordinal: 13282
    text: 'and that which cometh into your mind shall not be at all; in that ye say: We will be as the nations, as the families of the countries, to serve wood and stone.'
    translation: JPS 1917
    original: וְהָעֹלָה עַל־רוּחֲכֶם הָיוֹ לֹא תִהְיֶה אֲשֶׁר אַתֶּם אֹמְרִים נִהְיֶה כַגּוֹיִם כְּמִשְׁפְּחוֹת הָאֲרָצוֹת לְשָׁרֵת עֵץ וָאָבֶן׃
    hebrewPlain: והעלה על רוחכם היו לא תהיה אשר אתם אמרים נהיה כגוים כמשפחות הארצות לשרת עץ ואבן
    kjvRefs:
    - Ezekiel 20:32
    kjvOsis:
    - Ezek.20.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.33
    scripture: tanakh
    name: Tanakh Ezekiel 20:33
    ref: Ezekiel 20:33
    book: Ezek
    section: neviim
    chapter: 20
    verse: 33
    ordinal: 13283
    text: As I live, saith the Lord GOD, surely with a mighty hand, and with an outstretched arm, and with fury poured out, will I be king over you;
    translation: JPS 1917
    original: חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־לֹא בְּיָד חֲזָקָה וּבִזְרוֹעַ נְטוּיָה וּבְחֵמָה שְׁפוּכָה אֶמְלוֹךְ עֲלֵיכֶם׃
    hebrewPlain: חי אני נאם אדני יהוה אם לא ביד חזקה ובזרוע נטויה ובחמה שפוכה אמלוך עליכם
    kjvRefs:
    - Ezekiel 20:33
    kjvOsis:
    - Ezek.20.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.34
    scripture: tanakh
    name: Tanakh Ezekiel 20:34
    ref: Ezekiel 20:34
    book: Ezek
    section: neviim
    chapter: 20
    verse: 34
    ordinal: 13284
    text: and I will bring you out from the peoples, and will gather you out of the countries wherein ye are scattered, with a mighty hand, and with an outstretched arm, and with fury poured out;
    translation: JPS 1917
    original: וְהוֹצֵאתִי אֶתְכֶם מִן־הָעַמִּים וְקִבַּצְתִּי אֶתְכֶם מִן־הָאֲרָצוֹת אֲשֶׁר נְפוֹצֹתֶם בָּם בְּיָד חֲזָקָה וּבִזְרוֹעַ נְטוּיָה וּבְחֵמָה שְׁפוּכָה׃
    hebrewPlain: והוצאתי אתכם מן העמים וקבצתי אתכם מן הארצות אשר נפוצתם בם ביד חזקה ובזרוע נטויה ובחמה שפוכה
    kjvRefs:
    - Ezekiel 20:34
    kjvOsis:
    - Ezek.20.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.35
    scripture: tanakh
    name: Tanakh Ezekiel 20:35
    ref: Ezekiel 20:35
    book: Ezek
    section: neviim
    chapter: 20
    verse: 35
    ordinal: 13285
    text: and I will bring you into the wilderness of the peoples, and there will I plead with you face to face.
    translation: JPS 1917
    original: וְהֵבֵאתִי אֶתְכֶם אֶל־מִדְבַּר הָעַמִּים וְנִשְׁפַּטְתִּי אִתְּכֶם שָׁם פָּנִים אֶל־פָּנִים׃
    hebrewPlain: והבאתי אתכם אל מדבר העמים ונשפטתי אתכם שם פנים אל פנים
    kjvRefs:
    - Ezekiel 20:35
    kjvOsis:
    - Ezek.20.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.36
    scripture: tanakh
    name: Tanakh Ezekiel 20:36
    ref: Ezekiel 20:36
    book: Ezek
    section: neviim
    chapter: 20
    verse: 36
    ordinal: 13286
    text: Like as I pleaded with your fathers in the wilderness of the land of Egypt, so will I plead with you, saith the Lord GOD.
    translation: JPS 1917
    original: כַּאֲשֶׁר נִשְׁפַּטְתִּי אֶת־אֲבוֹתֵיכֶם בְּמִדְבַּר אֶרֶץ מִצְרָיִם כֵּן אִשָּׁפֵט אִתְּכֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כאשר נשפטתי את אבותיכם במדבר ארץ מצרים כן אשפט אתכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 20:36
    kjvOsis:
    - Ezek.20.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.37
    scripture: tanakh
    name: Tanakh Ezekiel 20:37
    ref: Ezekiel 20:37
    book: Ezek
    section: neviim
    chapter: 20
    verse: 37
    ordinal: 13287
    text: And I will cause you to pass under the rod, and I will bring you into the bond of the covenant;
    translation: JPS 1917
    original: וְהַעֲבַרְתִּי אֶתְכֶם תַּחַת הַשָּׁבֶט וְהֵבֵאתִי אֶתְכֶם בְּמָסֹרֶת הַבְּרִית׃
    hebrewPlain: והעברתי אתכם תחת השבט והבאתי אתכם במסרת הברית
    kjvRefs:
    - Ezekiel 20:37
    kjvOsis:
    - Ezek.20.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.38
    scripture: tanakh
    name: Tanakh Ezekiel 20:38
    ref: Ezekiel 20:38
    book: Ezek
    section: neviim
    chapter: 20
    verse: 38
    ordinal: 13288
    text: and I will purge out from among you the rebels, and them that transgress against Me; I will bring them forth out of the land where they sojourn, but they shall not enter into the land of Israel; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וּבָרוֹתִי מִכֶּם הַמֹּרְדִים וְהַפּוֹשְׁעִים בִּי מֵאֶרֶץ מְגוּרֵיהֶם אוֹצִיא אוֹתָם וְאֶל־אַדְמַת יִשְׂרָאֵל לֹא יָבוֹא וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: וברותי מכם המרדים והפושעים בי מארץ מגוריהם אוציא אותם ואל אדמת ישראל לא יבוא וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 20:38
    kjvOsis:
    - Ezek.20.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.39
    scripture: tanakh
    name: Tanakh Ezekiel 20:39
    ref: Ezekiel 20:39
    book: Ezek
    section: neviim
    chapter: 20
    verse: 39
    ordinal: 13289
    text: 'As for you, O house of Israel, thus saith the Lord GOD: Go ye, serve every one his idols, even because ye will not hearken unto Me; but My holy name shall ye no more profane with your gifts, and with your idols.'
    translation: JPS 1917
    original: וְאַתֶּם בֵּית־יִשְׂרָאֵל כֹּה־אָמַר אֲדֹנָי יְהֹוִה אִישׁ גִּלּוּלָיו לְכוּ עֲבֹדוּ וְאַחַר אִם־אֵינְכֶם שֹׁמְעִים אֵלָי וְאֶת־שֵׁם קָדְשִׁי לֹא תְחַלְּלוּ־עוֹד בְּמַתְּנוֹתֵיכֶם וּבְגִלּוּלֵיכֶם׃
    hebrewPlain: ואתם בית ישראל כה אמר אדני יהוה איש גלוליו לכו עבדו ואחר אם אינכם שמעים אלי ואת שם קדשי לא תחללו עוד במתנותיכם ובגלוליכם
    kjvRefs:
    - Ezekiel 20:39
    kjvOsis:
    - Ezek.20.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.40
    scripture: tanakh
    name: Tanakh Ezekiel 20:40
    ref: Ezekiel 20:40
    book: Ezek
    section: neviim
    chapter: 20
    verse: 40
    ordinal: 13290
    text: For in My holy mountain, in the mountain of the height of Israel, saith the Lord GOD, there shall all the house of Israel, all of them, serve Me in the land; there will I accept them, and there will I require your heave-offerings, and the first of your gifts, with all your holy things.
    translation: JPS 1917
    original: כִּי בְהַר־קָדְשִׁי בְּהַר מְרוֹם יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה שָׁם יַעַבְדֻנִי כָּל־בֵּית יִשְׂרָאֵל כֻּלֹּה בָּאָרֶץ שָׁם אֶרְצֵם וְשָׁם אֶדְרוֹשׁ אֶת־תְּרוּמֹתֵיכֶם וְאֶת־רֵאשִׁית מַשְׂאוֹתֵיכֶם בְּכָל־קָדְשֵׁיכֶם׃
    hebrewPlain: כי בהר קדשי בהר מרום ישראל נאם אדני יהוה שם יעבדני כל בית ישראל כלה בארץ שם ארצם ושם אדרוש את תרומתיכם ואת ראשית משאותיכם בכל קדשיכם
    kjvRefs:
    - Ezekiel 20:40
    kjvOsis:
    - Ezek.20.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.41
    scripture: tanakh
    name: Tanakh Ezekiel 20:41
    ref: Ezekiel 20:41
    book: Ezek
    section: neviim
    chapter: 20
    verse: 41
    ordinal: 13291
    text: With your sweet savour will I accept you, when I bring you out from the peoples, and gather you out of the countries wherein ye have been scattered; and I will be sanctified in you in the sight of the nations.
    translation: JPS 1917
    original: בְּרֵיחַ נִיחֹחַ אֶרְצֶה אֶתְכֶם בְּהוֹצִיאִי אֶתְכֶם מִן־הָעַמִּים וְקִבַּצְתִּי אֶתְכֶם מִן־הָאֲרָצוֹת אֲשֶׁר נְפֹצֹתֶם בָּם וְנִקְדַּשְׁתִּי בָכֶם לְעֵינֵי הַגּוֹיִם׃
    hebrewPlain: בריח ניחח ארצה אתכם בהוציאי אתכם מן העמים וקבצתי אתכם מן הארצות אשר נפצתם בם ונקדשתי בכם לעיני הגוים
    kjvRefs:
    - Ezekiel 20:41
    kjvOsis:
    - Ezek.20.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.42
    scripture: tanakh
    name: Tanakh Ezekiel 20:42
    ref: Ezekiel 20:42
    book: Ezek
    section: neviim
    chapter: 20
    verse: 42
    ordinal: 13292
    text: And ye shall know that I am the LORD, when I shall bring you into the land of Israel, into the country which I lifted up My hand to give unto your fathers.
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי־אֲנִי יְהוָה בַּהֲבִיאִי אֶתְכֶם אֶל־אַדְמַת יִשְׂרָאֵל אֶל־הָאָרֶץ אֲשֶׁר נָשָׂאתִי אֶת־יָדִי לָתֵת אוֹתָהּ לַאֲבוֹתֵיכֶם׃
    hebrewPlain: וידעתם כי אני יהוה בהביאי אתכם אל אדמת ישראל אל הארץ אשר נשאתי את ידי לתת אותה לאבותיכם
    kjvRefs:
