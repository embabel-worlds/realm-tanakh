- type: TanakhVerse
  data:
    osis: Ezek.29.12
    scripture: tanakh
    name: Tanakh Ezekiel 29:12
    ref: Ezekiel 29:12
    book: Ezek
    section: neviim
    chapter: 29
    verse: 12
    ordinal: 13550
    text: And I will make the land of Egypt desolate in the midst of the countries that are desolate, and her cities among the cities that are laid waste shall be desolate forty years; and I will scatter the Egyptians among the nations, and will disperse them through the countries.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־אֶרֶץ מִצְרַיִם שְׁמָמָה בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת וְעָרֶיהָ בְּתוֹךְ עָרִים מָחֳרָבוֹת תִּהְיֶיןָ שְׁמָמָה אַרְבָּעִים שָׁנָה וַהֲפִצֹתִי אֶת־מִצְרַיִם בַּגּוֹיִם וְזֵרִיתִים בָּאֲרָצוֹת׃
    hebrewPlain: ונתתי את ארץ מצרים שממה בתוך ארצות נשמות ועריה בתוך ערים מחרבות תהיין שממה ארבעים שנה והפצתי את מצרים בגוים וזריתים בארצות
    kjvRefs:
    - Ezekiel 29:12
    kjvOsis:
    - Ezek.29.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.13
    scripture: tanakh
    name: Tanakh Ezekiel 29:13
    ref: Ezekiel 29:13
    book: Ezek
    section: neviim
    chapter: 29
    verse: 13
    ordinal: 13551
    text: 'For thus saith the Lord GOD: At the end of forty years will I gather the Egyptians from the peoples whither they were scattered;'
    translation: JPS 1917
    original: כִּי כֹּה אָמַר אֲדֹנָי יְהוִה מִקֵּץ אַרְבָּעִים שָׁנָה אֲקַבֵּץ אֶת־מִצְרַיִם מִן־הָעַמִּים אֲשֶׁר־נָפֹצוּ שָׁמָּה׃
    hebrewPlain: כי כה אמר אדני יהוה מקץ ארבעים שנה אקבץ את מצרים מן העמים אשר נפצו שמה
    kjvRefs:
    - Ezekiel 29:13
    kjvOsis:
    - Ezek.29.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.14
    scripture: tanakh
    name: Tanakh Ezekiel 29:14
    ref: Ezekiel 29:14
    book: Ezek
    section: neviim
    chapter: 29
    verse: 14
    ordinal: 13552
    text: and I will turn the captivity of Egypt, and will cause them to return into the land of Pathros, into the land of their origin; and they shall be there a lowly kingdom.
    translation: JPS 1917
    original: וְשַׁבְתִּי אֶת־שְׁבוּת מִצְרַיִם וַהֲשִׁבֹתִי אֹתָם אֶרֶץ פַּתְרוֹס עַל־אֶרֶץ מְכוּרָתָם וְהָיוּ שָׁם מַמְלָכָה שְׁפָלָה׃
    hebrewPlain: ושבתי את שבות מצרים והשבתי אתם ארץ פתרוס על ארץ מכורתם והיו שם ממלכה שפלה
    kjvRefs:
    - Ezekiel 29:14
    kjvOsis:
    - Ezek.29.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.15
    scripture: tanakh
    name: Tanakh Ezekiel 29:15
    ref: Ezekiel 29:15
    book: Ezek
    section: neviim
    chapter: 29
    verse: 15
    ordinal: 13553
    text: It shall be the lowliest of the kingdoms, neither shall it any more lift itself up above the nations; and I will diminish them, that they shall no more rule over the nations.
    translation: JPS 1917
    original: מִן־הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה וְלֹא־תִתְנַשֵּׂא עוֹד עַל־הַגּוֹיִם וְהִמְעַטְתִּים לְבִלְתִּי רְדוֹת בַּגּוֹיִם׃
    hebrewPlain: מן הממלכות תהיה שפלה ולא תתנשא עוד על הגוים והמעטתים לבלתי רדות בגוים
    kjvRefs:
    - Ezekiel 29:15
    kjvOsis:
    - Ezek.29.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.16
    scripture: tanakh
    name: Tanakh Ezekiel 29:16
    ref: Ezekiel 29:16
    book: Ezek
    section: neviim
    chapter: 29
    verse: 16
    ordinal: 13554
    text: And it shall be no more the confidence of the house of Israel, bringing iniquity to remembrance, when they turn after them; and they shall know that I am the Lord GOD.’
    translation: JPS 1917
    original: וְלֹא יִהְיֶה־עוֹד לְבֵית יִשְׂרָאֵל לְמִבְטָח מַזְכִּיר עָוֺן בִּפְנוֹתָם אַחֲרֵיהֶם וְיָדְעוּ כִּי אֲנִי אֲדֹנָי יְהוִה׃
    hebrewPlain: ולא יהיה עוד לבית ישראל למבטח מזכיר עון בפנותם אחריהם וידעו כי אני אדני יהוה
    kjvRefs:
    - Ezekiel 29:16
    kjvOsis:
    - Ezek.29.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.17
    scripture: tanakh
    name: Tanakh Ezekiel 29:17
    ref: Ezekiel 29:17
    book: Ezek
    section: neviim
    chapter: 29
    verse: 17
    ordinal: 13555
    text: 'And it came to pass in the seven and twentieth year, in the first month, in the first day of the month, the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ הָיָה דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי בעשרים ושבע שנה בראשון באחד לחדש היה דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 29:17
    kjvOsis:
    - Ezek.29.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.18
    scripture: tanakh
    name: Tanakh Ezekiel 29:18
    ref: Ezekiel 29:18
    book: Ezek
    section: neviim
    chapter: 29
    verse: 18
    ordinal: 13556
    text: ’Son of man, Nebuchadrezzar king of Babylon caused his army to serve a great service against Tyre; every head was made bald, and every shoulder was peeled; yet had he no wages, nor his army, from Tyre, for the service that he had served against it;
    translation: JPS 1917
    original: בֶּן־אָדָם נְבוּכַדְרֶאצַּר מֶלֶךְ־בָּבֶל הֶעֱבִיד אֶת־חֵילוֹ עֲבֹדָה גְדֹלָה אֶל־צֹר כָּל־רֹאשׁ מֻקְרָח וְכָל־כָּתֵף מְרוּטָה וְשָׂכָר לֹא־הָיָה לוֹ וּלְחֵילוֹ מִצֹּר עַל־הָעֲבֹדָה אֲשֶׁר־עָבַד עָלֶיהָ׃
    hebrewPlain: בן אדם נבוכדראצר מלך בבל העביד את חילו עבדה גדלה אל צר כל ראש מקרח וכל כתף מרוטה ושכר לא היה לו ולחילו מצר על העבדה אשר עבד עליה
    kjvRefs:
    - Ezekiel 29:18
    kjvOsis:
    - Ezek.29.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.19
    scripture: tanakh
    name: Tanakh Ezekiel 29:19
    ref: Ezekiel 29:19
    book: Ezek
    section: neviim
    chapter: 29
    verse: 19
    ordinal: 13557
    text: 'Therefore thus saith the Lord GOD: Behold, I will give the land of Egypt unto Nebuchadrezzar king of Babylon; and he shall carry off her abundance, and take her spoil, and take her prey; and it shall be the wages for his army.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי נֹתֵן לִנְבוּכַדְרֶאצַּר מֶלֶךְ־בָּבֶל אֶת־אֶרֶץ מִצְרָיִם וְנָשָׂא הֲמֹנָהּ וְשָׁלַל שְׁלָלָהּ וּבָזַז בִּזָּהּ וְהָיְתָה שָׂכָר לְחֵילוֹ׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני נתן לנבוכדראצר מלך בבל את ארץ מצרים ונשא המנה ושלל שללה ובזז בזה והיתה שכר לחילו
    kjvRefs:
    - Ezekiel 29:19
    kjvOsis:
    - Ezek.29.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.20
    scripture: tanakh
    name: Tanakh Ezekiel 29:20
    ref: Ezekiel 29:20
    book: Ezek
    section: neviim
    chapter: 29
    verse: 20
    ordinal: 13558
    text: I have given him the land of Egypt as his hire for which he served, because they wrought for Me, saith the Lord GOD.
    translation: JPS 1917
    original: פְּעֻלָּתוֹ אֲשֶׁר־עָבַד בָּהּ נָתַתִּי לוֹ אֶת־אֶרֶץ מִצְרָיִם אֲשֶׁר עָשׂוּ לִי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: פעלתו אשר עבד בה נתתי לו את ארץ מצרים אשר עשו לי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 29:20
    kjvOsis:
    - Ezek.29.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.29.21
    scripture: tanakh
    name: Tanakh Ezekiel 29:21
    ref: Ezekiel 29:21
    book: Ezek
    section: neviim
    chapter: 29
    verse: 21
    ordinal: 13559
    text: In that day will I cause a horn to shoot up unto the house of Israel, and I will give thee the opening of the mouth in the midst of them; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא אַצְמִיחַ קֶרֶן לְבֵית יִשְׂרָאֵל וּלְךָ אֶתֵּן פִּתְחוֹן־פֶּה בְּתוֹכָם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ביום ההוא אצמיח קרן לבית ישראל ולך אתן פתחון פה בתוכם וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 29:21
    kjvOsis:
    - Ezek.29.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.29
- type: TanakhVerse
  data:
    osis: Ezek.30.1
    scripture: tanakh
    name: Tanakh Ezekiel 30:1
    ref: Ezekiel 30:1
    book: Ezek
    section: neviim
    chapter: 30
    verse: 1
    ordinal: 13560
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
