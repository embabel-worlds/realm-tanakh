  data:
    osis: Ezek.47.18
    scripture: tanakh
    name: Tanakh Ezekiel 47:18
    ref: Ezekiel 47:18
    book: Ezek
    section: neviim
    chapter: 47
    verse: 18
    ordinal: 14052
    text: And the east side, between Hauran and Damascus and Gilead, and the land of Israel, by the Jordan, from the border unto the east sea shall ye measure. This is the east side.
    translation: JPS 1917
    original: וּפְאַת קָדִים מִבֵּין חַוְרָן וּמִבֵּין־דַּמֶּשֶׂק וּמִבֵּין הַגִּלְעָד וּמִבֵּין אֶרֶץ יִשְׂרָאֵל הַיַּרְדֵּן מִגְּבוּל עַל־הַיָּם הַקַּדְמוֹנִי תָּמֹדּוּ וְאֵת פְּאַת קָדִימָה׃
    hebrewPlain: ופאת קדים מבין חורן ומבין דמשק ומבין הגלעד ומבין ארץ ישראל הירדן מגבול על הים הקדמוני תמדו ואת פאת קדימה
    kjvRefs:
    - Ezekiel 47:18
    kjvOsis:
    - Ezek.47.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
