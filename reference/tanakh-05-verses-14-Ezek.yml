    verse: 10
    ordinal: 13372
    text: These uncovered her nakedness; they took her sons and her daughters, and her they slew with the sword; and she became a byword among women, for judgments were executed upon her.
    translation: JPS 1917
    original: הֵמָּה גִּלּוּ עֶרְוָתָהּ בָּנֶיהָ וּבְנוֹתֶיהָ לָקָחוּ וְאוֹתָהּ בַּחֶרֶב הָרָגוּ וַתְּהִי־שֵׁם לַנָּשִׁים וּשְׁפוּטִים עָשׂוּ בָהּ׃
    hebrewPlain: המה גלו ערותה בניה ובנותיה לקחו ואותה בחרב הרגו ותהי שם לנשים ושפוטים עשו בה
