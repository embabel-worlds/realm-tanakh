    ordinal: 13929
    text: and, behold, the glory of the God of Israel came from the way of the east; and His voice was like the sound of many waters; and the earth did shine with His glory.
    translation: JPS 1917
    original: וְהִנֵּה כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל בָּא מִדֶּרֶךְ הַקָּדִים וְקוֹלוֹ כְּקוֹל מַיִם רַבִּים וְהָאָרֶץ הֵאִירָה מִכְּבֹדוֹ׃
    hebrewPlain: והנה כבוד אלהי ישראל בא מדרך הקדים וקולו כקול מים רבים והארץ האירה מכבדו
    kjvRefs:
