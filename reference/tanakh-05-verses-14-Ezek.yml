    ref: Ezekiel 42:8
    book: Ezek
    section: neviim
    chapter: 42
    verse: 8
    ordinal: 13915
    text: For the length of the chambers that were toward the outer court was fifty cubits; and, lo, before the temple were a hundred cubits.
