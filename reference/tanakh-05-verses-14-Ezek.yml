    original: וַהֲשִׁבֹתִי אֶת־יָדִי וָאַעַשׂ לְמַעַן שְׁמִי לְבִלְתִּי הֵחֵל לְעֵינֵי הַגּוֹיִם אֲשֶׁר־הוֹצֵאתִי אוֹתָם לְעֵינֵיהֶם׃
    hebrewPlain: והשבתי את ידי ואעש למען שמי לבלתי החל לעיני הגוים אשר הוצאתי אותם לעיניהם
