  data:
    osis: Ezek.18.3
    scripture: tanakh
    name: Tanakh Ezekiel 18:3
    ref: Ezekiel 18:3
    book: Ezek
    section: neviim
    chapter: 18
    verse: 3
    ordinal: 13207
    text: As I live, saith the Lord GOD, ye shall not have occasion any more to use this proverb in Israel.
    translation: JPS 1917
    original: חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־יִהְיֶה לָכֶם עוֹד מְשֹׁל הַמָּשָׁל הַזֶּה בְּיִשְׂרָאֵל׃
    hebrewPlain: חי אני נאם אדני יהוה אם יהיה לכם עוד משל המשל הזה בישראל
    kjvRefs:
    - Ezekiel 18:3
    kjvOsis:
    - Ezek.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.4
    scripture: tanakh
    name: Tanakh Ezekiel 18:4
    ref: Ezekiel 18:4
    book: Ezek
    section: neviim
    chapter: 18
    verse: 4
    ordinal: 13208
    text: Behold, all souls are Mine; as the soul of the father, so also the soul of the son is Mine; the soul that sinneth, it shall die.
    translation: JPS 1917
    original: הֵן כָּל־הַנְּפָשׁוֹת לִי הֵנָּה כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן לִי־הֵנָּה הַנֶּפֶשׁ הַחֹטֵאת הִיא תָמוּת׃
    hebrewPlain: הן כל הנפשות לי הנה כנפש האב וכנפש הבן לי הנה הנפש החטאת היא תמות
    kjvRefs:
    - Ezekiel 18:4
    kjvOsis:
    - Ezek.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
