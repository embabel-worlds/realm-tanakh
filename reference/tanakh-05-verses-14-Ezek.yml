    ref: Ezekiel 47:17
    book: Ezek
    section: neviim
    chapter: 47
    verse: 17
    ordinal: 14051
    text: And the border from the sea shall be Hazar-enon at the border of Damascus, and on the north northward is the border of Hamath. This is the north side.
    translation: JPS 1917
    original: וְהָיָה גְבוּל מִן־הַיָּם חֲצַר עֵינוֹן גְּבוּל דַּמֶּשֶׂק וְצָפוֹן צָפוֹנָה וּגְבוּל חֲמָת וְאֵת פְּאַת צָפוֹן׃
    hebrewPlain: והיה גבול מן הים חצר עינון גבול דמשק וצפון צפונה וגבול חמת ואת פאת צפון
    kjvRefs:
