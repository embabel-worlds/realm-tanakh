  data:
    osis: Ezek.24.19
    scripture: tanakh
    name: Tanakh Ezekiel 24:19
    ref: Ezekiel 24:19
    book: Ezek
    section: neviim
    chapter: 24
    verse: 19
    ordinal: 13430
    text: 'And the people said unto me: ‘Wilt thou not tell us what these things are to us, that thou doest so?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלַי הָעָם הֲלֹא־תַגִּיד לָנוּ מָה־אֵלֶּה לָּנוּ כִּי אַתָּה עֹשֶׂה׃
    hebrewPlain: ויאמרו אלי העם הלא תגיד לנו מה אלה לנו כי אתה עשה
