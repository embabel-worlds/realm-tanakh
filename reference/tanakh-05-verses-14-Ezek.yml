  data:
    osis: Ezek.33.1
    scripture: tanakh
    name: Tanakh Ezekiel 33:1
    ref: Ezekiel 33:1
    book: Ezek
    section: neviim
    chapter: 33
    verse: 1
    ordinal: 13636
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 33:1
    kjvOsis:
