    verse: 19
    ordinal: 13223
    text: 'Yet say ye: Why doth not the son bear the iniquity of the father with him? When the son hath done that which is lawful and right, and hath kept all My statutes, and hath done them, he shall surely live.'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם מַדֻּעַ לֹא־נָשָׂא הַבֵּן בַּעֲוֺן הָאָב וְהַבֵּן מִשְׁפָּט וּצְדָקָה עָשָׂה אֵת כָּל־חֻקּוֹתַי שָׁמַר וַיַּעֲשֶׂה אֹתָם חָיֹה יִחְיֶה׃
    hebrewPlain: ואמרתם מדע לא נשא הבן בעון האב והבן משפט וצדקה עשה את כל חקותי שמר ויעשה אתם חיה יחיה
    kjvRefs:
    - Ezekiel 18:19
    kjvOsis:
    - Ezek.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.20
    scripture: tanakh
    name: Tanakh Ezekiel 18:20
    ref: Ezekiel 18:20
    book: Ezek
    section: neviim
    chapter: 18
    verse: 20
    ordinal: 13224
    text: The soul that sinneth, it shall die; the son shall not bear the iniquity of the father with him, neither shall the father bear the iniquity of the son with him; the righteousness of the righteous shall be upon him, and the wickedness of the wicked shall be upon him.
    translation: JPS 1917
    original: הַנֶּפֶשׁ הַחֹטֵאת הִיא תָמוּת בֵּן לֹא־יִשָּׂא בַּעֲוֺן הָאָב וְאָב לֹא יִשָּׂא בַּעֲוֺן הַבֵּן צִדְקַת הַצַּדִּיק עָלָיו תִּהְיֶה וְרִשְׁעַת רשע [הָרָשָׁע] עָלָיו תִּהְיֶה׃
    hebrewPlain: הנפש החטאת היא תמות בן לא ישא בעון האב ואב לא ישא בעון הבן צדקת הצדיק עליו תהיה ורשעת רשע [הרשע] עליו תהיה
    kjvRefs:
    - Ezekiel 18:20
    kjvOsis:
    - Ezek.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.21
    scripture: tanakh
    name: Tanakh Ezekiel 18:21
    ref: Ezekiel 18:21
    book: Ezek
    section: neviim
    chapter: 18
    verse: 21
    ordinal: 13225
    text: But if the wicked turn from all his sins that he hath committed, and keep all My statutes, and do that which is lawful and right, he shall surely live, he shall not die.
    translation: JPS 1917
    original: וְהָרָשָׁע כִּי יָשׁוּב מִכָּל־חטאתו [חַטֹּאתָיו] אֲשֶׁר עָשָׂה וְשָׁמַר אֶת־כָּל־חֻקּוֹתַי וְעָשָׂה מִשְׁפָּט וּצְדָקָה חָיֹה יִחְיֶה לֹא יָמוּת׃
    hebrewPlain: והרשע כי ישוב מכל חטאתו [חטאתיו] אשר עשה ושמר את כל חקותי ועשה משפט וצדקה חיה יחיה לא ימות
    kjvRefs:
    - Ezekiel 18:21
    kjvOsis:
    - Ezek.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.22
    scripture: tanakh
    name: Tanakh Ezekiel 18:22
    ref: Ezekiel 18:22
    book: Ezek
    section: neviim
    chapter: 18
    verse: 22
    ordinal: 13226
    text: None of his transgressions that he hath committed shall be remembered against him; for his righteousness that he hath done he shall live.
    translation: JPS 1917
    original: כָּל־פְּשָׁעָיו אֲשֶׁר עָשָׂה לֹא יִזָּכְרוּ לוֹ בְּצִדְקָתוֹ אֲשֶׁר־עָשָׂה יִחְיֶה׃
    hebrewPlain: כל פשעיו אשר עשה לא יזכרו לו בצדקתו אשר עשה יחיה
    kjvRefs:
    - Ezekiel 18:22
    kjvOsis:
    - Ezek.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.23
    scripture: tanakh
    name: Tanakh Ezekiel 18:23
    ref: Ezekiel 18:23
    book: Ezek
    section: neviim
    chapter: 18
    verse: 23
    ordinal: 13227
    text: Have I any pleasure at all that the wicked should die? saith the Lord GOD; and not rather that he should return from his ways, and live?
    translation: JPS 1917
    original: הֶחָפֹץ אֶחְפֹּץ מוֹת רָשָׁע נְאֻם אֲדֹנָי יְהוִה הֲלוֹא בְּשׁוּבוֹ מִדְּרָכָיו וְחָיָה׃
    hebrewPlain: החפץ אחפץ מות רשע נאם אדני יהוה הלוא בשובו מדרכיו וחיה
    kjvRefs:
    - Ezekiel 18:23
    kjvOsis:
    - Ezek.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.24
    scripture: tanakh
    name: Tanakh Ezekiel 18:24
    ref: Ezekiel 18:24
    book: Ezek
    section: neviim
    chapter: 18
    verse: 24
    ordinal: 13228
    text: But when the righteous turneth away from his righteousness, and committeth iniquity, and doeth according to all the abominations that the wicked man doeth, shall he live? None of his righteous deeds that he hath done shall be remembered; for his trespass that he trespassed, and for his sin that he hath sinned, for them shall he die.
    translation: JPS 1917
    original: וּבְשׁוּב צַדִּיק מִצִּדְקָתוֹ וְעָשָׂה עָוֶל כְּכֹל הַתּוֹעֵבוֹת אֲשֶׁר־עָשָׂה הָרָשָׁע יַעֲשֶׂה וָחָי כָּל־צדקתו [צִדְקֹתָיו] אֲשֶׁר־עָשָׂה לֹא תִזָּכַרְנָה בְּמַעֲלוֹ אֲשֶׁר־מָעַל וּבְחַטָּאתוֹ אֲשֶׁר־חָטָא בָּם יָמוּת׃
    hebrewPlain: ובשוב צדיק מצדקתו ועשה עול ככל התועבות אשר עשה הרשע יעשה וחי כל צדקתו [צדקתיו] אשר עשה לא תזכרנה במעלו אשר מעל ובחטאתו אשר חטא בם ימות
    kjvRefs:
    - Ezekiel 18:24
    kjvOsis:
    - Ezek.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.25
    scripture: tanakh
    name: Tanakh Ezekiel 18:25
    ref: Ezekiel 18:25
    book: Ezek
    section: neviim
    chapter: 18
    verse: 25
    ordinal: 13229
    text: 'Yet ye say: The way of the Lord is not equal. Hear now, O house of Israel: Is it My way that is not equal? is it not your ways that are unequal?'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם לֹא יִתָּכֵן דֶּרֶךְ אֲדֹנָי שִׁמְעוּ־נָא בֵּית יִשְׂרָאֵל הֲדַרְכִּי לֹא יִתָּכֵן הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵנוּ׃
    hebrewPlain: ואמרתם לא יתכן דרך אדני שמעו נא בית ישראל הדרכי לא יתכן הלא דרכיכם לא יתכנו
    kjvRefs:
    - Ezekiel 18:25
    kjvOsis:
    - Ezek.18.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.26
    scripture: tanakh
    name: Tanakh Ezekiel 18:26
    ref: Ezekiel 18:26
    book: Ezek
    section: neviim
    chapter: 18
    verse: 26
    ordinal: 13230
    text: When the righteous man turneth away from his righteousness, and committeth iniquity, he shall die therefor; for his iniquity that he hath done shall he die.
    translation: JPS 1917
    original: בְּשׁוּב־צַדִּיק מִצִּדְקָתוֹ וְעָשָׂה עָוֶל וּמֵת עֲלֵיהֶם בְּעַוְלוֹ אֲשֶׁר־עָשָׂה יָמוּת׃
    hebrewPlain: בשוב צדיק מצדקתו ועשה עול ומת עליהם בעולו אשר עשה ימות
    kjvRefs:
    - Ezekiel 18:26
    kjvOsis:
    - Ezek.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.27
    scripture: tanakh
    name: Tanakh Ezekiel 18:27
    ref: Ezekiel 18:27
    book: Ezek
    section: neviim
    chapter: 18
    verse: 27
    ordinal: 13231
    text: Again, when the wicked man turneth away from his wickedness that he hath committed, and doeth that which is lawful and right, he shall save his soul alive.
    translation: JPS 1917
    original: וּבְשׁוּב רָשָׁע מֵרִשְׁעָתוֹ אֲשֶׁר עָשָׂה וַיַּעַשׂ מִשְׁפָּט וּצְדָקָה הוּא אֶת־נַפְשׁוֹ יְחַיֶּה׃
    hebrewPlain: ובשוב רשע מרשעתו אשר עשה ויעש משפט וצדקה הוא את נפשו יחיה
    kjvRefs:
    - Ezekiel 18:27
    kjvOsis:
    - Ezek.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.28
    scripture: tanakh
    name: Tanakh Ezekiel 18:28
    ref: Ezekiel 18:28
    book: Ezek
    section: neviim
    chapter: 18
    verse: 28
    ordinal: 13232
    text: Because he considereth, and turneth away from all his transgressions that he hath committed, he shall surely live, he shall not die.
    translation: JPS 1917
    original: וַיִּרְאֶה וישוב [וַיָּשָׁב] מִכָּל־פְּשָׁעָיו אֲשֶׁר עָשָׂה חָיוֹ יִחְיֶה לֹא יָמוּת׃
    hebrewPlain: ויראה וישוב [וישב] מכל פשעיו אשר עשה חיו יחיה לא ימות
    kjvRefs:
    - Ezekiel 18:28
    kjvOsis:
    - Ezek.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.29
    scripture: tanakh
    name: Tanakh Ezekiel 18:29
    ref: Ezekiel 18:29
    book: Ezek
    section: neviim
    chapter: 18
    verse: 29
    ordinal: 13233
    text: 'Yet saith the house of Israel: The way of the Lord is not equal. O house of Israel, is it My ways that are not equal? is it not your ways that are unequal?'
    translation: JPS 1917
    original: וְאָמְרוּ בֵּית יִשְׂרָאֵל לֹא יִתָּכֵן דֶּרֶךְ אֲדֹנָי הַדְּרָכַי לֹא יִתָּכְנּוּ בֵּית יִשְׂרָאֵל הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵן׃
    hebrewPlain: ואמרו בית ישראל לא יתכן דרך אדני הדרכי לא יתכנו בית ישראל הלא דרכיכם לא יתכן
    kjvRefs:
    - Ezekiel 18:29
    kjvOsis:
    - Ezek.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.30
    scripture: tanakh
    name: Tanakh Ezekiel 18:30
    ref: Ezekiel 18:30
    book: Ezek
    section: neviim
    chapter: 18
    verse: 30
    ordinal: 13234
    text: Therefore I will judge you, O house of Israel, every one according to his ways, saith the Lord GOD. Return ye, and turn yourselves from all your transgressions; so shall they not be a stumblingblock of iniquity unto you.
    translation: JPS 1917
    original: לָכֵן אִישׁ כִּדְרָכָיו אֶשְׁפֹּט אֶתְכֶם בֵּית יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה שׁוּבוּ וְהָשִׁיבוּ מִכָּל־פִּשְׁעֵיכֶם וְלֹא־יִהְיֶה לָכֶם לְמִכְשׁוֹל עָוֺן׃
    hebrewPlain: לכן איש כדרכיו אשפט אתכם בית ישראל נאם אדני יהוה שובו והשיבו מכל פשעיכם ולא יהיה לכם למכשול עון
    kjvRefs:
    - Ezekiel 18:30
    kjvOsis:
    - Ezek.18.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.31
    scripture: tanakh
    name: Tanakh Ezekiel 18:31
    ref: Ezekiel 18:31
    book: Ezek
    section: neviim
    chapter: 18
    verse: 31
    ordinal: 13235
    text: Cast away from you all your transgressions, wherein ye have transgressed; and make you a new heart and a new spirit; for why will ye die, O house of Israel?
    translation: JPS 1917
    original: הַשְׁלִיכוּ מֵעֲלֵיכֶם אֶת־כָּל־פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם וַעֲשׂוּ לָכֶם לֵב חָדָשׁ וְרוּחַ חֲדָשָׁה וְלָמָּה תָמֻתוּ בֵּית יִשְׂרָאֵל׃
    hebrewPlain: השליכו מעליכם את כל פשעיכם אשר פשעתם בם ועשו לכם לב חדש ורוח חדשה ולמה תמתו בית ישראל
    kjvRefs:
    - Ezekiel 18:31
    kjvOsis:
    - Ezek.18.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.18.32
    scripture: tanakh
    name: Tanakh Ezekiel 18:32
    ref: Ezekiel 18:32
    book: Ezek
    section: neviim
    chapter: 18
    verse: 32
    ordinal: 13236
    text: For I have no pleasure in the death of him that dieth, saith the Lord GOD; wherefore turn yourselves, and live.
    translation: JPS 1917
    original: כִּי לֹא אֶחְפֹּץ בְּמוֹת הַמֵּת נְאֻם אֲדֹנָי יְהוִה וְהָשִׁיבוּ וִחְיוּ׃
    hebrewPlain: כי לא אחפץ במות המת נאם אדני יהוה והשיבו וחיו
    kjvRefs:
    - Ezekiel 18:32
    kjvOsis:
    - Ezek.18.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
- type: TanakhVerse
  data:
    osis: Ezek.19.1
    scripture: tanakh
    name: Tanakh Ezekiel 19:1
    ref: Ezekiel 19:1
    book: Ezek
    section: neviim
    chapter: 19
    verse: 1
    ordinal: 13237
    text: Moreover, take thou up a lamentation for the princes of Israel,
    translation: JPS 1917
    original: וְאַתָּה שָׂא קִינָה אֶל־נְשִׂיאֵי יִשְׂרָאֵל׃
    hebrewPlain: ואתה שא קינה אל נשיאי ישראל
    kjvRefs:
    - Ezekiel 19:1
    kjvOsis:
    - Ezek.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.2
    scripture: tanakh
    name: Tanakh Ezekiel 19:2
    ref: Ezekiel 19:2
    book: Ezek
    section: neviim
    chapter: 19
    verse: 2
    ordinal: 13238
    text: 'and say: How was thy mother a lioness; Among lions she couched, In the midst of the young lions She reared her whelps!'
    translation: JPS 1917
    original: וְאָמַרְתָּ מָה אִמְּךָ לְבִיָּא בֵּין אֲרָיוֹת רָבָצָה בְּתוֹךְ כְּפִרִים רִבְּתָה גוּרֶיהָ׃
    hebrewPlain: ואמרת מה אמך לביא בין אריות רבצה בתוך כפרים רבתה גוריה
    kjvRefs:
    - Ezekiel 19:2
    kjvOsis:
    - Ezek.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.3
    scripture: tanakh
    name: Tanakh Ezekiel 19:3
    ref: Ezekiel 19:3
    book: Ezek
    section: neviim
    chapter: 19
    verse: 3
    ordinal: 13239
    text: And she brought up one of her whelps, He became a young lion; And he learned to catch the prey, He devoured men.
    translation: JPS 1917
    original: וַתַּעַל אֶחָד מִגֻּרֶיהָ כְּפִיר הָיָה וַיִּלְמַד לִטְרָף־טֶרֶף אָדָם אָכָל׃
    hebrewPlain: ותעל אחד מגריה כפיר היה וילמד לטרף טרף אדם אכל
    kjvRefs:
    - Ezekiel 19:3
    kjvOsis:
    - Ezek.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.4
    scripture: tanakh
    name: Tanakh Ezekiel 19:4
    ref: Ezekiel 19:4
    book: Ezek
    section: neviim
    chapter: 19
    verse: 4
    ordinal: 13240
    text: Then the nations assembled against him, He was taken in their pit; And they brought him with hooks Unto the land of Egypt.
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ אֵלָיו גּוֹיִם בְּשַׁחְתָּם נִתְפָּשׂ וַיְבִאֻהוּ בַחַחִים אֶל־אֶרֶץ מִצְרָיִם׃
    hebrewPlain: וישמעו אליו גוים בשחתם נתפש ויבאהו בחחים אל ארץ מצרים
    kjvRefs:
    - Ezekiel 19:4
    kjvOsis:
    - Ezek.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.5
    scripture: tanakh
    name: Tanakh Ezekiel 19:5
    ref: Ezekiel 19:5
    book: Ezek
    section: neviim
    chapter: 19
    verse: 5
    ordinal: 13241
    text: Now when she saw that she was disappointed, And her hope was lost, Then she took another of her whelps, And made him a young lion.
    translation: JPS 1917
    original: וַתֵּרֶא כִּי נוֹחֲלָה אָבְדָה תִּקְוָתָהּ וַתִּקַּח אֶחָד מִגֻּרֶיהָ כְּפִיר שָׂמָתְהוּ׃
    hebrewPlain: ותרא כי נוחלה אבדה תקותה ותקח אחד מגריה כפיר שמתהו
    kjvRefs:
    - Ezekiel 19:5
    kjvOsis:
    - Ezek.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.6
    scripture: tanakh
    name: Tanakh Ezekiel 19:6
    ref: Ezekiel 19:6
    book: Ezek
    section: neviim
    chapter: 19
    verse: 6
    ordinal: 13242
    text: And he went up and down among the lions, He became a young lion; And he learned to catch the prey, He devoured men.
    translation: JPS 1917
    original: וַיִּתְהַלֵּךְ בְּתוֹךְ־אֲרָיוֹת כְּפִיר הָיָה וַיִּלְמַד לִטְרָף־טֶרֶף אָדָם אָכָל׃
    hebrewPlain: ויתהלך בתוך אריות כפיר היה וילמד לטרף טרף אדם אכל
    kjvRefs:
    - Ezekiel 19:6
    kjvOsis:
    - Ezek.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.7
    scripture: tanakh
    name: Tanakh Ezekiel 19:7
    ref: Ezekiel 19:7
    book: Ezek
    section: neviim
    chapter: 19
    verse: 7
    ordinal: 13243
    text: And he knew their castles, And laid waste their cities; And the land was desolate, And the fulness thereof, Because of the noise of his roaring.
    translation: JPS 1917
    original: וַיֵּדַע אַלְמְנוֹתָיו וְעָרֵיהֶם הֶחֱרִיב וַתֵּשַׁם אֶרֶץ וּמְלֹאָהּ מִקּוֹל שַׁאֲגָתוֹ׃
    hebrewPlain: וידע אלמנותיו ועריהם החריב ותשם ארץ ומלאה מקול שאגתו
    kjvRefs:
    - Ezekiel 19:7
    kjvOsis:
    - Ezek.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.8
    scripture: tanakh
    name: Tanakh Ezekiel 19:8
    ref: Ezekiel 19:8
    book: Ezek
    section: neviim
    chapter: 19
    verse: 8
    ordinal: 13244
    text: Then the nations cried out against him On every side from the provinces; And they spread their net over him, He was taken in their pit.
    translation: JPS 1917
    original: וַיִּתְּנוּ עָלָיו גּוֹיִם סָבִיב מִמְּדִינוֹת וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם בְּשַׁחְתָּם נִתְפָּשׂ׃
    hebrewPlain: ויתנו עליו גוים סביב ממדינות ויפרשו עליו רשתם בשחתם נתפש
    kjvRefs:
    - Ezekiel 19:8
    kjvOsis:
    - Ezek.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.9
    scripture: tanakh
    name: Tanakh Ezekiel 19:9
    ref: Ezekiel 19:9
    book: Ezek
    section: neviim
    chapter: 19
    verse: 9
    ordinal: 13245
    text: And they put him in a cage with hooks, And brought him to the king of Babylon; That they might bring him into strongholds, So that his voice should no more be heard Upon the mountains of Israel.
    translation: JPS 1917
    original: וַיִּתְּנֻהוּ בַסּוּגַר בַּחַחִים וַיְבִאֻהוּ אֶל־מֶלֶךְ בָּבֶל יְבִאֻהוּ בַּמְּצֹדוֹת לְמַעַן לֹא־יִשָּׁמַע קוֹלוֹ עוֹד אֶל־הָרֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתנהו בסוגר בחחים ויבאהו אל מלך בבל יבאהו במצדות למען לא ישמע קולו עוד אל הרי ישראל
    kjvRefs:
    - Ezekiel 19:9
    kjvOsis:
    - Ezek.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.10
    scripture: tanakh
    name: Tanakh Ezekiel 19:10
    ref: Ezekiel 19:10
    book: Ezek
    section: neviim
    chapter: 19
    verse: 10
    ordinal: 13246
    text: Thy mother was like a vine, in thy likeness, Planted by the waters; She was fruitful and full of branches By reason of many waters.
    translation: JPS 1917
    original: אִמְּךָ כַגֶּפֶן בְּדָמְךָ עַל־מַיִם שְׁתוּלָה פֹּרִיָּה וַעֲנֵפָה הָיְתָה מִמַּיִם רַבִּים׃
    hebrewPlain: אמך כגפן בדמך על מים שתולה פריה וענפה היתה ממים רבים
    kjvRefs:
    - Ezekiel 19:10
    kjvOsis:
    - Ezek.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.11
    scripture: tanakh
    name: Tanakh Ezekiel 19:11
    ref: Ezekiel 19:11
    book: Ezek
    section: neviim
    chapter: 19
    verse: 11
    ordinal: 13247
    text: And she had strong rods To be sceptres for them that bore rule; And her stature was exalted Among the thick branches, And she was seen in her height With the multitude of her tendrils.
    translation: JPS 1917
    original: וַיִּהְיוּ־לָהּ מַטּוֹת עֹז אֶל־שִׁבְטֵי מֹשְׁלִים וַתִּגְבַּהּ קוֹמָתוֹ עַל־בֵּין עֲבֹתִים וַיֵּרָא בְגָבְהוֹ בְּרֹב דָּלִיֹּתָיו׃
    hebrewPlain: ויהיו לה מטות עז אל שבטי משלים ותגבה קומתו על בין עבתים וירא בגבהו ברב דליתיו
    kjvRefs:
    - Ezekiel 19:11
    kjvOsis:
    - Ezek.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.12
    scripture: tanakh
    name: Tanakh Ezekiel 19:12
    ref: Ezekiel 19:12
    book: Ezek
    section: neviim
    chapter: 19
    verse: 12
    ordinal: 13248
    text: But she was plucked up in fury, She was cast down to the ground, And the east wind dried up her fruit; Her strong rods were broken off and withered, The fire consumed her.
    translation: JPS 1917
    original: וַתֻּתַּשׁ בְּחֵמָה לָאָרֶץ הֻשְׁלָכָה וְרוּחַ הַקָּדִים הוֹבִישׁ פִּרְיָהּ הִתְפָּרְקוּ וְיָבֵשׁוּ מַטֵּה עֻזָּהּ אֵשׁ אֲכָלָתְהוּ׃
    hebrewPlain: ותתש בחמה לארץ השלכה ורוח הקדים הוביש פריה התפרקו ויבשו מטה עזה אש אכלתהו
    kjvRefs:
    - Ezekiel 19:12
    kjvOsis:
    - Ezek.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.13
    scripture: tanakh
    name: Tanakh Ezekiel 19:13
    ref: Ezekiel 19:13
    book: Ezek
    section: neviim
    chapter: 19
    verse: 13
    ordinal: 13249
    text: And now she is planted in the wilderness, In a dry and thirsty ground.
    translation: JPS 1917
    original: וְעַתָּה שְׁתוּלָה בַמִּדְבָּר בְּאֶרֶץ צִיָּה וְצָמָא׃
    hebrewPlain: ועתה שתולה במדבר בארץ ציה וצמא
    kjvRefs:
    - Ezekiel 19:13
    kjvOsis:
    - Ezek.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.19.14
    scripture: tanakh
    name: Tanakh Ezekiel 19:14
    ref: Ezekiel 19:14
    book: Ezek
    section: neviim
    chapter: 19
    verse: 14
    ordinal: 13250
    text: And fire is gone out of the rod of her branches, It hath devoured her fruit, So that there is in her no strong rod To be a sceptre to rule.’ This is a lamentation, and it was for a lamentation.
    translation: JPS 1917
    original: וַתֵּצֵא אֵשׁ מִמַּטֵּה בַדֶּיהָ פִּרְיָהּ אָכָלָה וְלֹא־הָיָה בָהּ מַטֵּה־עֹז שֵׁבֶט לִמְשׁוֹל קִינָה הִיא וַתְּהִי לְקִינָה׃
    hebrewPlain: ותצא אש ממטה בדיה פריה אכלה ולא היה בה מטה עז שבט למשול קינה היא ותהי לקינה
    kjvRefs:
    - Ezekiel 19:14
    kjvOsis:
    - Ezek.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.19
- type: TanakhVerse
  data:
    osis: Ezek.20.1
    scripture: tanakh
    name: Tanakh Ezekiel 20:1
    ref: Ezekiel 20:1
    book: Ezek
    section: neviim
    chapter: 20
    verse: 1
    ordinal: 13251
    text: And it came to pass in the seventh year, in the fifth month, the tenth day of the month, that certain of the elders of Israel came to inquire of the LORD, and sat before me.
    translation: JPS 1917
    original: וַיְהִי בַּשָּׁנָה הַשְּׁבִיעִית בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל לִדְרֹשׁ אֶת־יְהוָה וַיֵּשְׁבוּ לְפָנָי׃
    hebrewPlain: ויהי בשנה השביעית בחמשי בעשור לחדש באו אנשים מזקני ישראל לדרש את יהוה וישבו לפני
    kjvRefs:
    - Ezekiel 20:1
    kjvOsis:
    - Ezek.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.2
    scripture: tanakh
    name: Tanakh Ezekiel 20:2
    ref: Ezekiel 20:2
    book: Ezek
    section: neviim
    chapter: 20
    verse: 2
    ordinal: 13252
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 20:2
    kjvOsis:
    - Ezek.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.3
    scripture: tanakh
    name: Tanakh Ezekiel 20:3
    ref: Ezekiel 20:3
    book: Ezek
    section: neviim
    chapter: 20
    verse: 3
    ordinal: 13253
    text: '’Son of man, speak unto the elders of Israel, and say unto them: Thus saith the Lord GOD: Are ye come to inquire of Me? As I live, saith the Lord GOD, I will not be inquired of by you.'
    translation: JPS 1917
    original: בֶּן־אָדָם דַּבֵּר אֶת־זִקְנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם כֹּה אָמַר אֲדֹנָי יְהוִה הֲלִדְרֹשׁ אֹתִי אַתֶּם בָּאִים חַי־אָנִי אִם־אִדָּרֵשׁ לָכֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: בן אדם דבר את זקני ישראל ואמרת אלהם כה אמר אדני יהוה הלדרש אתי אתם באים חי אני אם אדרש לכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 20:3
    kjvOsis:
    - Ezek.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.4
    scripture: tanakh
    name: Tanakh Ezekiel 20:4
    ref: Ezekiel 20:4
    book: Ezek
    section: neviim
    chapter: 20
    verse: 4
    ordinal: 13254
    text: Wilt thou judge them, son of man, wilt thou judge them? cause them to know the abominations of their fathers;
    translation: JPS 1917
    original: הֲתִשְׁפֹּט אֹתָם הֲתִשְׁפּוֹט בֶּן־אָדָם אֶת־תּוֹעֲבֹת אֲבוֹתָם הוֹדִיעֵם׃
    hebrewPlain: התשפט אתם התשפוט בן אדם את תועבת אבותם הודיעם
    kjvRefs:
    - Ezekiel 20:4
    kjvOsis:
    - Ezek.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.5
    scripture: tanakh
    name: Tanakh Ezekiel 20:5
    ref: Ezekiel 20:5
    book: Ezek
    section: neviim
    chapter: 20
    verse: 5
    ordinal: 13255
    text: 'and say unto them: Thus saith the Lord GOD: In the day when I chose Israel, and lifted up My hand unto the seed of the house of Jacob, and made Myself known unto them in the land of Egypt, when I lifted up My hand unto them, saying: I am the LORD your God;'
    translation: JPS 1917
    original: וְאָמַרְתָּ אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל וָאֶשָּׂא יָדִי לְזֶרַע בֵּית יַעֲקֹב וָאִוָּדַע לָהֶם בְּאֶרֶץ מִצְרָיִם וָאֶשָּׂא יָדִי לָהֶם לֵאמֹר אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ואמרת אליהם כה אמר אדני יהוה ביום בחרי בישראל ואשא ידי לזרע בית יעקב ואודע להם בארץ מצרים ואשא ידי להם לאמר אני יהוה אלהיכם
    kjvRefs:
    - Ezekiel 20:5
    kjvOsis:
    - Ezek.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.6
    scripture: tanakh
    name: Tanakh Ezekiel 20:6
    ref: Ezekiel 20:6
    book: Ezek
    section: neviim
    chapter: 20
    verse: 6
    ordinal: 13256
    text: in that day I lifted up My hand unto them, to bring them forth out of the land of Egypt into a land that I had sought out for them, flowing with milk and honey, which is the beauty of all lands;
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא נָשָׂאתִי יָדִי לָהֶם לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם אֶל־אֶרֶץ אֲשֶׁר־תַּרְתִּי לָהֶם זָבַת חָלָב וּדְבַשׁ צְבִי הִיא לְכָל־הָאֲרָצוֹת׃
    hebrewPlain: ביום ההוא נשאתי ידי להם להוציאם מארץ מצרים אל ארץ אשר תרתי להם זבת חלב ודבש צבי היא לכל הארצות
    kjvRefs:
    - Ezekiel 20:6
    kjvOsis:
    - Ezek.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.7
    scripture: tanakh
    name: Tanakh Ezekiel 20:7
    ref: Ezekiel 20:7
    book: Ezek
    section: neviim
    chapter: 20
    verse: 7
    ordinal: 13257
    text: 'and I said unto them: Cast ye away every man the detestable things of his eyes, and defile not yourselves with the idols of Egypt; I am the LORD your God.'
    translation: JPS 1917
    original: וָאֹמַר אֲלֵהֶם אִישׁ שִׁקּוּצֵי עֵינָיו הַשְׁלִיכוּ וּבְגִלּוּלֵי מִצְרַיִם אַל־תִּטַּמָּאוּ אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ואמר אלהם איש שקוצי עיניו השליכו ובגלולי מצרים אל תטמאו אני יהוה אלהיכם
    kjvRefs:
    - Ezekiel 20:7
    kjvOsis:
    - Ezek.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.8
    scripture: tanakh
    name: Tanakh Ezekiel 20:8
    ref: Ezekiel 20:8
    book: Ezek
    section: neviim
    chapter: 20
    verse: 8
    ordinal: 13258
    text: But they rebelled against Me, and would not hearken unto Me; they did not every man cast away the detestable things of their eyes, neither did they forsake the idols of Egypt; then I said I would pour out My fury upon them, to spend My anger upon them in the midst of the land of Egypt.
    translation: JPS 1917
    original: וַיַּמְרוּ־בִי וְלֹא אָבוּ לִּשְׁמֹעַ אֵלַי אִישׁ אֶת־שִׁקּוּצֵי עֵינֵיהֶם לֹא הִשְׁלִיכוּ וְאֶת־גִּלּוּלֵי מִצְרַיִם לֹא עָזָבוּ וָאֹמַר לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם לְכַלּוֹת אַפִּי בָּהֶם בְּתוֹךְ אֶרֶץ מִצְרָיִם׃
    hebrewPlain: וימרו בי ולא אבו לשמע אלי איש את שקוצי עיניהם לא השליכו ואת גלולי מצרים לא עזבו ואמר לשפך חמתי עליהם לכלות אפי בהם בתוך ארץ מצרים
    kjvRefs:
    - Ezekiel 20:8
    kjvOsis:
    - Ezek.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.20
- type: TanakhVerse
  data:
    osis: Ezek.20.9
    scripture: tanakh
    name: Tanakh Ezekiel 20:9
    ref: Ezekiel 20:9
    book: Ezek
    section: neviim
    chapter: 20
    verse: 9
    ordinal: 13259
    text: But I wrought for My name’s sake, that it should not be profaned in the sight of the nations, among whom they were, in whose sight I made Myself known unto them, so as to bring them forth out of the land of Egypt.
    translation: JPS 1917
