  data:
    osis: Ezek.32.24
    scripture: tanakh
    name: Tanakh Ezekiel 32:24
    ref: Ezekiel 32:24
    book: Ezek
    section: neviim
    chapter: 32
    verse: 24
    ordinal: 13627
    text: There is Elam and all her multitude round about her grave; all of them slain, fallen by the sword, who are gone down uncircumcised into the nether parts of the earth, who caused their terror in the land of the living; yet have they borne their shame with them that go down to the pit.
    translation: JPS 1917
    original: שָׁם עֵילָם וְכָל־הֲמוֹנָהּ סְבִיבוֹת קְבֻרָתָהּ כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב אֲ‍שֶׁר־יָרְדוּ עֲרֵלִים אֶל־אֶרֶץ תַּחְתִּיּוֹת אֲשֶׁר נָתְנוּ חִתִּיתָם בְּאֶרֶץ חַיִּים וַיִּשְׂאוּ כְלִמָּתָם אֶת־יוֹרְדֵי בוֹר׃
    hebrewPlain: שם עילם וכל המונה סביבות קברתה כלם חללים הנפלים בחרב א‍שר ירדו ערלים אל ארץ תחתיות אשר נתנו חתיתם בארץ חיים וישאו כלמתם את יורדי בור
    kjvRefs:
    - Ezekiel 32:24
    kjvOsis:
    - Ezek.32.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.25
    scripture: tanakh
    name: Tanakh Ezekiel 32:25
    ref: Ezekiel 32:25
    book: Ezek
    section: neviim
    chapter: 32
    verse: 25
    ordinal: 13628
    text: They have set her a bed in the midst of the slain with all her multitude; her graves are round about them; all of them uncircumcised, slain by the sword; because their terror was caused in the land of the living, yet have they borne their shame with them that go down to the pit; they are put in the midst of them that are slain.
    translation: JPS 1917
    original: בְּתוֹךְ חֲלָלִים נָתְנוּ מִשְׁכָּב לָהּ בְּכָל־הֲמוֹנָהּ סְבִיבוֹתָיו קִבְרֹתֶהָ כֻּלָּם עֲרֵלִים חַלְלֵי־חֶרֶב כִּי־נִתַּן חִתִּיתָם בְּאֶרֶץ חַיִּים וַיִּשְׂאוּ כְלִמָּתָם אֶת־יוֹרְדֵי בוֹר בְּתוֹךְ חֲלָלִים נִתָּן׃
    hebrewPlain: בתוך חללים נתנו משכב לה בכל המונה סביבותיו קברתה כלם ערלים חללי חרב כי נתן חתיתם בארץ חיים וישאו כלמתם את יורדי בור בתוך חללים נתן
    kjvRefs:
    - Ezekiel 32:25
    kjvOsis:
    - Ezek.32.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.26
    scripture: tanakh
    name: Tanakh Ezekiel 32:26
    ref: Ezekiel 32:26
    book: Ezek
    section: neviim
    chapter: 32
    verse: 26
    ordinal: 13629
    text: There is Meshech, Tubal, and all her multitude; her graves are round about them; all of them uncircumcised, slain by the sword; because they caused their terror in the land of the living.
    translation: JPS 1917
    original: שָׁם מֶשֶׁךְ תֻּבַל וְכָל־הֲמוֹנָהּ סְבִיבוֹתָיו קִבְרוֹתֶיהָ כֻּלָּם עֲרֵלִים מְחֻלְלֵי חֶרֶב כִּי־נָתְנוּ חִתִּיתָם בְּאֶרֶץ חַיִּים׃
    hebrewPlain: שם משך תבל וכל המונה סביבותיו קברותיה כלם ערלים מחללי חרב כי נתנו חתיתם בארץ חיים
    kjvRefs:
    - Ezekiel 32:26
    kjvOsis:
    - Ezek.32.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.27
    scripture: tanakh
    name: Tanakh Ezekiel 32:27
    ref: Ezekiel 32:27
    book: Ezek
    section: neviim
    chapter: 32
    verse: 27
    ordinal: 13630
    text: And they that are inferior to the uncircumcised shall not lie with the mighty that are gone down to the nether-world with their weapons of war, whose swords are laid under their heads, and whose iniquities are upon their bones; because the terror of the mighty was in the land of the living.
    translation: JPS 1917
    original: וְלֹא יִשְׁכְּבוּ אֶת־גִּבּוֹרִים נֹפְלִים מֵעֲרֵלִים אֲשֶׁר יָרְדוּ־שְׁאוֹל בִּכְלֵי־מִלְחַמְתָּם וַיִּתְּנוּ אֶת־חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם וַתְּהִי עֲוֺנֹתָם עַל־עַצְמוֹתָם כִּי־חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים׃
    hebrewPlain: ולא ישכבו את גבורים נפלים מערלים אשר ירדו שאול בכלי מלחמתם ויתנו את חרבותם תחת ראשיהם ותהי עונתם על עצמותם כי חתית גבורים בארץ חיים
    kjvRefs:
    - Ezekiel 32:27
    kjvOsis:
    - Ezek.32.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.28
    scripture: tanakh
    name: Tanakh Ezekiel 32:28
    ref: Ezekiel 32:28
    book: Ezek
    section: neviim
    chapter: 32
    verse: 28
    ordinal: 13631
    text: But thou, in the midst of the uncircumcised shalt thou be broken and lie, even with them that are slain by the sword.
    translation: JPS 1917
    original: וְאַתָּה בְּתוֹךְ עֲרֵלִים תִּשָּׁבַר וְתִשְׁכַּב אֶת־חַלְלֵי־חָרֶב׃
    hebrewPlain: ואתה בתוך ערלים תשבר ותשכב את חללי חרב
    kjvRefs:
    - Ezekiel 32:28
    kjvOsis:
    - Ezek.32.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.29
    scripture: tanakh
    name: Tanakh Ezekiel 32:29
    ref: Ezekiel 32:29
    book: Ezek
    section: neviim
    chapter: 32
    verse: 29
    ordinal: 13632
    text: There is Edom, her kings and all her princes, who for all their might are laid with them that are slain by the sword; they shall lie with the uncircumcised, and with them that go down to the pit.
    translation: JPS 1917
    original: שָׁמָּה אֱדוֹם מְלָכֶיהָ וְכָל־נְשִׂיאֶיהָ אֲשֶׁר־נִתְּנוּ בִגְבוּרָתָם אֶת־חַלְלֵי־חָרֶב הֵמָּה אֶת־עֲרֵלִים יִשְׁכָּבוּ וְאֶת־יֹרְדֵי בוֹר׃
    hebrewPlain: שמה אדום מלכיה וכל נשיאיה אשר נתנו בגבורתם את חללי חרב המה את ערלים ישכבו ואת ירדי בור
    kjvRefs:
    - Ezekiel 32:29
    kjvOsis:
    - Ezek.32.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.30
    scripture: tanakh
    name: Tanakh Ezekiel 32:30
    ref: Ezekiel 32:30
    book: Ezek
    section: neviim
    chapter: 32
    verse: 30
    ordinal: 13633
    text: There are the princes of the north, all of them, and all the Zidonians, who are gone down with the slain, ashamed for all the terror which they caused by their might, and they lie uncircumcised with them that are slain by the sword, and bear their shame with them that go down to the pit.
    translation: JPS 1917
    original: שָׁמָּה נְסִיכֵי צָפוֹן כֻּלָּם וְכָל־צִדֹנִי אֲשֶׁר־יָרְדוּ אֶת־חֲלָלִים בְּחִתִּיתָם מִגְבוּרָתָם בּוֹשִׁים וַיִּשְׁכְּבוּ עֲרֵלִים אֶת־חַלְלֵי־חֶרֶב וַיִּשְׂאוּ כְלִמָּתָם אֶת־יוֹרְדֵי בוֹר׃
    hebrewPlain: שמה נסיכי צפון כלם וכל צדני אשר ירדו את חללים בחתיתם מגבורתם בושים וישכבו ערלים את חללי חרב וישאו כלמתם את יורדי בור
    kjvRefs:
    - Ezekiel 32:30
    kjvOsis:
    - Ezek.32.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.31
    scripture: tanakh
    name: Tanakh Ezekiel 32:31
    ref: Ezekiel 32:31
    book: Ezek
    section: neviim
    chapter: 32
    verse: 31
    ordinal: 13634
    text: These shall Pharaoh see, and shall be comforted over all his multitude; even Pharaoh and all his army, slain by the sword, saith the Lord GOD.
    translation: JPS 1917
    original: אוֹתָם יִרְאֶה פַרְעֹה וְנִחַם עַל־כָּל־המונה [הֲמוֹנוֹ] חַלְלֵי־חֶרֶב פַּרְעֹה וְכָל־חֵילוֹ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: אותם יראה פרעה ונחם על כל המונה [המונו] חללי חרב פרעה וכל חילו נאם אדני יהוה
    kjvRefs:
    - Ezekiel 32:31
    kjvOsis:
    - Ezek.32.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
- type: TanakhVerse
  data:
    osis: Ezek.32.32
    scripture: tanakh
    name: Tanakh Ezekiel 32:32
    ref: Ezekiel 32:32
    book: Ezek
    section: neviim
    chapter: 32
    verse: 32
    ordinal: 13635
    text: For I have put My terror in the land of the living; and he shall be laid in the midst of the uncircumcised, with them that are slain by the sword, even Pharaoh and all his multitude, saith the Lord GOD.’
    translation: JPS 1917
    original: כִּי־נָתַתִּי אֶת־חתיתו [חִתִּיתִי] בְּאֶרֶץ חַיִּים וְהֻשְׁכַּב בְּתוֹךְ עֲרֵלִים אֶת־חַלְלֵי־חֶרֶב פַּרְעֹה וְכָל־הֲמוֹנֹה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כי נתתי את חתיתו [חתיתי] בארץ חיים והשכב בתוך ערלים את חללי חרב פרעה וכל המונה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 32:32
    kjvOsis:
    - Ezek.32.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.32
