    ordinal: 13378
    text: And as soon as she saw them she doted upon them, and sent messengers unto them into Chaldea.
    translation: JPS 1917
    original: ותעגב [וַתַּעְגְּבָה] עֲלֵיהֶם לְמַרְאֵה עֵינֶיהָ וַתִּשְׁלַח מַלְאָכִים אֲלֵיהֶם כַּשְׂדִּימָה׃
