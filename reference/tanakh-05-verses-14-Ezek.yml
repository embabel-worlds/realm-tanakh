    name: Tanakh Ezekiel 21:18
    ref: Ezekiel 21:18
    book: Ezek
    section: neviim
    chapter: 21
    verse: 18
    ordinal: 13312
    text: For there is a trial; and what if it contemn even the rod? It shall be no more, saith the Lord GOD.
    translation: JPS 1917
    original: כִּי בֹחַן וּמָה אִם־גַּם־שֵׁבֶט מֹאֶסֶת לֹא יִהְיֶה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כי בחן ומה אם גם שבט מאסת לא יהיה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 21:13
    kjvOsis:
    - Ezek.21.13
