  data:
    osis: Ezek.48.7
    scripture: tanakh
    name: Tanakh Ezekiel 48:7
    ref: Ezekiel 48:7
    book: Ezek
    section: neviim
    chapter: 48
    verse: 7
    ordinal: 14064
    text: 'And by the border of Reuben, from the east side unto the west side: Judah, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל רְאוּבֵן מִפְּאַת קָדִים עַד־פְּאַת־יָמָּה יְהוּדָה אֶחָד׃
    hebrewPlain: ועל גבול ראובן מפאת קדים עד פאת ימה יהודה אחד
    kjvRefs:
