  data:
    osis: Ezek.28.6
    scripture: tanakh
    name: Tanakh Ezekiel 28:6
    ref: Ezekiel 28:6
    book: Ezek
    section: neviim
    chapter: 28
    verse: 6
    ordinal: 13518
    text: 'Therefore thus saith the Lord GOD: Because thou hast set thy heart As the heart of God;'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן תִּתְּךָ אֶת־לְבָבְךָ כְּלֵב אֱלֹהִים׃
    hebrewPlain: לכן כה אמר אדני יהוה יען תתך את לבבך כלב אלהים
    kjvRefs:
    - Ezekiel 28:6
    kjvOsis:
    - Ezek.28.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.7
    scripture: tanakh
    name: Tanakh Ezekiel 28:7
    ref: Ezekiel 28:7
    book: Ezek
    section: neviim
    chapter: 28
    verse: 7
    ordinal: 13519
    text: Therefore, behold, I will bring strangers upon thee, The terrible of the nations; And they shall draw their swords against the beauty of thy wisdom, And they shall defile thy brightness. .
    translation: JPS 1917
    original: לָכֵן הִנְנִי מֵבִיא עָלֶיךָ זָרִים עָרִיצֵי גּוֹיִם וְהֵרִיקוּ חַרְבוֹתָם עַל־יְפִי חָכְמָתֶךָ וְחִלְּלוּ יִפְעָתֶךָ׃
    hebrewPlain: לכן הנני מביא עליך זרים עריצי גוים והריקו חרבותם על יפי חכמתך וחללו יפעתך
    kjvRefs:
    - Ezekiel 28:7
    kjvOsis:
    - Ezek.28.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.8
    scripture: tanakh
    name: Tanakh Ezekiel 28:8
    ref: Ezekiel 28:8
    book: Ezek
    section: neviim
    chapter: 28
    verse: 8
    ordinal: 13520
    text: They shall bring thee down to the pit; And thou shalt die the deaths of them that are slain, In the heart of the seas.
    translation: JPS 1917
    original: לַשַּׁחַת יוֹרִדוּךָ וָמַתָּה מְמוֹתֵי חָלָל בְּלֵב יַמִּים׃
    hebrewPlain: לשחת יורדוך ומתה ממותי חלל בלב ימים
    kjvRefs:
    - Ezekiel 28:8
    kjvOsis:
    - Ezek.28.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.9
    scripture: tanakh
    name: Tanakh Ezekiel 28:9
    ref: Ezekiel 28:9
    book: Ezek
    section: neviim
    chapter: 28
    verse: 9
    ordinal: 13521
    text: 'Wilt thou yet say before him that slayeth thee: I am God? But thou art man, and not God, In the hand of them that defile thee.'
    translation: JPS 1917
    original: הֶאָמֹר תֹּאמַר אֱלֹהִים אָנִי לִפְנֵי הֹרְגֶךָ וְאַתָּה אָדָם וְלֹא־אֵל בְּיַד מְחַלְלֶיךָ׃
    hebrewPlain: האמר תאמר אלהים אני לפני הרגך ואתה אדם ולא אל ביד מחלליך
    kjvRefs:
    - Ezekiel 28:9
    kjvOsis:
    - Ezek.28.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
- type: TanakhVerse
  data:
    osis: Ezek.28.10
    scripture: tanakh
    name: Tanakh Ezekiel 28:10
    ref: Ezekiel 28:10
    book: Ezek
    section: neviim
    chapter: 28
    verse: 10
    ordinal: 13522
    text: Thou shalt die the deaths of the uncircumcised By the hand of strangers; For I have spoken, saith the Lord GOD.’
    translation: JPS 1917
    original: מוֹתֵי עֲרֵלִים תָּמוּת בְּיַד־זָרִים כִּי אֲנִי דִבַּרְתִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: מותי ערלים תמות ביד זרים כי אני דברתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 28:10
    kjvOsis:
    - Ezek.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.28
