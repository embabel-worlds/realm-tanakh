    section: neviim
    chapter: 23
    verse: 8
    ordinal: 13370
    text: Neither hath she left her harlotries brought from Egypt; for in her youth they lay with her, and they bruised her virgin breasts; and they poured out their lust upon her.
    translation: JPS 1917
    original: וְאֶת־תַּזְנוּתֶיהָ מִמִּצְרַיִם לֹא עָזָבָה כִּי אוֹתָהּ שָׁכְבוּ בִנְעוּרֶיהָ וְהֵמָּה עִשּׂוּ דַּדֵּי בְתוּלֶיהָ וַיִּשְׁפְּכוּ תַזְנוּתָם עָלֶיהָ׃
    hebrewPlain: ואת תזנותיה ממצרים לא עזבה כי אותה שכבו בנעוריה והמה עשו דדי בתוליה וישפכו תזנותם עליה
