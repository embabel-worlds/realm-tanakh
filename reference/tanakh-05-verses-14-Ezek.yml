  data:
    osis: Ezek.18.17
    scripture: tanakh
    name: Tanakh Ezekiel 18:17
    ref: Ezekiel 18:17
    book: Ezek
    section: neviim
    chapter: 18
    verse: 17
    ordinal: 13221
    text: that hath withdrawn his hand from the poor, that hath not received interest nor increase, hath executed Mine ordinances, hath walked in My statutes; he shall not die for the iniquity of his father, he shall surely live.
    translation: JPS 1917
    original: מֵעָנִי הֵשִׁיב יָדוֹ נֶשֶׁךְ וְתַרְבִּית לֹא לָקָח מִשְׁפָּטַי עָשָׂה בְּחֻקּוֹתַי הָלָךְ הוּא לֹא יָמוּת בַּעֲוֺן אָבִיו חָיֹה יִחְיֶה׃
    hebrewPlain: מעני השיב ידו נשך ותרבית לא לקח משפטי עשה בחקותי הלך הוא לא ימות בעון אביו חיה יחיה
    kjvRefs:
    - Ezekiel 18:17
    kjvOsis:
    - Ezek.18.17
