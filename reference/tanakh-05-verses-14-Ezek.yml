  data:
    osis: Ezek.40.41
    scripture: tanakh
    name: Tanakh Ezekiel 40:41
    ref: Ezekiel 40:41
    book: Ezek
    section: neviim
    chapter: 40
    verse: 41
    ordinal: 13873
    text: Four tables were on this side, and four tables on that side, by the side of the gate; eight tables, whereupon to slay the sacrifices.
    translation: JPS 1917
    original: אַרְבָּעָה שֻׁלְחָנוֹת מִפֹּה וְאַרְבָּעָה שֻׁלְחָנוֹת מִפֹּה לְכֶתֶף הַשָּׁעַר שְׁמוֹנָה שֻׁלְחָנוֹת אֲלֵיהֶם יִשְׁחָטוּ׃
    hebrewPlain: ארבעה שלחנות מפה וארבעה שלחנות מפה לכתף השער שמונה שלחנות אליהם ישחטו
    kjvRefs:
    - Ezekiel 40:41
    kjvOsis:
    - Ezek.40.41
