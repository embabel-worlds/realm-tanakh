  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.12
- type: TanakhVerse
  data:
    osis: Ezek.12.25
    scripture: tanakh
    name: Tanakh Ezekiel 12:25
    ref: Ezekiel 12:25
    book: Ezek
    section: neviim
    chapter: 12
    verse: 25
    ordinal: 13060
    text: For I am the LORD; I will speak, what word soever it be that I shall speak, and it shall be performed; it shall be no more delayed; for in your days, O rebellious house, will I speak the word, and will perform it, saith the Lord GOD.’
    translation: JPS 1917
    original: כִּי אֲנִי יְהוָה אֲדַבֵּר אֵת אֲשֶׁר אֲדַבֵּר דָּבָר וְיֵעָשֶׂה לֹא תִמָּשֵׁךְ עוֹד כִּי בִימֵיכֶם בֵּית הַמֶּרִי אֲדַבֵּר דָּבָר וַעֲשִׂיתִיו נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כי אני יהוה אדבר את אשר אדבר דבר ויעשה לא תמשך עוד כי בימיכם בית המרי אדבר דבר ועשיתיו נאם אדני יהוה
    kjvRefs:
    - Ezekiel 12:25
    kjvOsis:
    - Ezek.12.25
