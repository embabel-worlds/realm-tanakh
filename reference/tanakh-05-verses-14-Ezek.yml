    translation: JPS 1917
    original: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה בְּתוֹכָהּ חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה לֹא יַצִּילוּ בָּנִים וּבָנוֹת כִּי הֵם לְבַדָּם יִנָּצֵלוּ׃
