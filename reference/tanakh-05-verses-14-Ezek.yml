    translation: JPS 1917
    original: וּכְפִתְחֵי הַלְּשָׁכוֹת אֲשֶׁר דֶּרֶךְ הַדָּרוֹם פֶּתַח בְּרֹאשׁ דָּרֶךְ דֶּרֶךְ בִּפְנֵי הַגְּדֶרֶת הֲגִינָה דֶּרֶךְ הַקָּדִים בְּבוֹאָן׃
    hebrewPlain: וכפתחי הלשכות אשר דרך הדרום פתח בראש דרך דרך בפני הגדרת הגינה דרך הקדים בבואן
