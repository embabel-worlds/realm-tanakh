    verse: 20
    ordinal: 13431
    text: 'Then I said unto them: ‘The word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וָאֹמַר אֲלֵיהֶם דְּבַר־יְהוָה הָיָה אֵלַי לֵאמֹר׃
    hebrewPlain: ואמר אליהם דבר יהוה היה אלי לאמר
