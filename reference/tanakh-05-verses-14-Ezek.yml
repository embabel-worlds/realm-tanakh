    ref: Ezekiel 18:5
    book: Ezek
    section: neviim
    chapter: 18
    verse: 5
    ordinal: 13209
    text: But if a man be just, and do that which is lawful and right,
    translation: JPS 1917
    original: וְאִישׁ כִּי־יִהְיֶה צַדִּיק וְעָשָׂה מִשְׁפָּט וּצְדָקָה׃
    hebrewPlain: ואיש כי יהיה צדיק ועשה משפט וצדקה
    kjvRefs:
