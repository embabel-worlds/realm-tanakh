    book: Ezek
    section: neviim
    chapter: 42
    verse: 4
    ordinal: 13911
    text: And before the chambers was a walk of ten cubits breadth inward, a way of one cubit; and their doors were toward the north.
    translation: JPS 1917
    original: וְלִפְנֵי הַלְּשָׁכוֹת מַהֲלַךְ עֶשֶׂר אַמּוֹת רֹחַב אֶל־הַפְּנִימִית דֶּרֶךְ אַמָּה אֶחָת וּפִתְחֵיהֶם לַצָּפוֹן׃
    hebrewPlain: ולפני הלשכות מהלך עשר אמות רחב אל הפנימית דרך אמה אחת ופתחיהם לצפון
    kjvRefs:
