    ref: Ezekiel 24:14
    book: Ezek
    section: neviim
    chapter: 24
    verse: 14
    ordinal: 13425
    text: I the LORD have spoken it; it shall come to pass, and I will do it; I will not go back, neither will I spare, neither will I repent; according to thy ways, and according to thy doings, shall they judge thee, saith the Lord GOD.’ .
    translation: JPS 1917
    original: אֲנִי יְהוָה דִּבַּרְתִּי בָּאָה וְעָשִׂיתִי לֹא־אֶפְרַע וְלֹא־אָחוּס וְלֹא אֶנָּחֵם כִּדְרָכַיִךְ וְכַעֲלִילוֹתַיִךְ שְׁפָטוּךְ נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: אני יהוה דברתי באה ועשיתי לא אפרע ולא אחוס ולא אנחם כדרכיך וכעלילותיך שפטוך נאם אדני יהוה
