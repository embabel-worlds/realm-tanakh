    book: Ezek
    section: neviim
    chapter: 12
    verse: 13
    ordinal: 13048
    text: My net also will I spread upon him, and he shall be taken in My snare; and I will bring him to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there.
    translation: JPS 1917
    original: וּפָרַשְׂתִּי אֶת־רִשְׁתִּי עָלָיו וְנִתְפַּשׂ בִּמְצוּדָתִי וְהֵבֵאתִי אֹתוֹ בָבֶלָה אֶרֶץ כַּשְׂדִּים וְאוֹתָהּ לֹא־יִרְאֶה וְשָׁם יָמוּת׃
    hebrewPlain: ופרשתי את רשתי עליו ונתפש במצודתי והבאתי אתו בבלה ארץ כשדים ואותה לא יראה ושם ימות
    kjvRefs:
    - Ezekiel 12:13
    kjvOsis:
    - Ezek.12.13
