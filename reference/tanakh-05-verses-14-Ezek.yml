  data:
    osis: Ezek.15.2
    scripture: tanakh
    name: Tanakh Ezekiel 15:2
    ref: Ezekiel 15:2
    book: Ezek
    section: neviim
    chapter: 15
    verse: 2
    ordinal: 13111
    text: ’Son of man, what is the vine-tree more than any tree, the vine branch which grew up among the trees of the forest?
    translation: JPS 1917
    original: בֶּן־אָדָם מַה־יִּהְיֶה עֵץ־הַגֶּפֶן מִכָּל־עֵץ הַזְּמוֹרָה אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר׃
    hebrewPlain: בן אדם מה יהיה עץ הגפן מכל עץ הזמורה אשר היה בעצי היער
    kjvRefs:
    - Ezekiel 15:2
    kjvOsis:
    - Ezek.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.3
    scripture: tanakh
    name: Tanakh Ezekiel 15:3
    ref: Ezekiel 15:3
    book: Ezek
    section: neviim
    chapter: 15
    verse: 3
    ordinal: 13112
    text: Shall wood be taken thereof to make any work? or will men take a pin of it to hang any vessel thereon?
    translation: JPS 1917
    original: הֲיֻקַּח מִמֶּנּוּ עֵץ לַעֲשׂוֹת לִמְלָאכָה אִם־יִקְחוּ מִמֶּנּוּ יָתֵד לִתְלוֹת עָלָיו כָּל־כֶּלִי׃
    hebrewPlain: היקח ממנו עץ לעשות למלאכה אם יקחו ממנו יתד לתלות עליו כל כלי
    kjvRefs:
    - Ezekiel 15:3
    kjvOsis:
    - Ezek.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.4
    scripture: tanakh
    name: Tanakh Ezekiel 15:4
    ref: Ezekiel 15:4
    book: Ezek
    section: neviim
    chapter: 15
    verse: 4
    ordinal: 13113
    text: Behold, it is cast into the fire for fuel; the fire hath devoured both the ends of it, and the midst of it is singed; is it profitable for any work?
    translation: JPS 1917
    original: הִנֵּה לָאֵשׁ נִתַּן לְאָכְלָה אֵת שְׁנֵי קְצוֹתָיו אָכְלָה הָאֵשׁ וְתוֹכוֹ נָחָר הֲיִצְלַח לִמְלָאכָה׃
    hebrewPlain: הנה לאש נתן לאכלה את שני קצותיו אכלה האש ותוכו נחר היצלח למלאכה
    kjvRefs:
    - Ezekiel 15:4
    kjvOsis:
    - Ezek.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.5
    scripture: tanakh
    name: Tanakh Ezekiel 15:5
    ref: Ezekiel 15:5
    book: Ezek
    section: neviim
    chapter: 15
    verse: 5
    ordinal: 13114
    text: Behold, when it was whole, it was meet for no work; how much less, when the fire hath devoured it, and it is singed, shall it yet be meet for any work?
    translation: JPS 1917
    original: הִנֵּה בִּהְיוֹתוֹ תָמִים לֹא יֵעָשֶׂה לִמְלָאכָה אַף כִּי־אֵשׁ אֲכָלַתְהוּ וַיֵּחָר וְנַעֲשָׂה עוֹד לִמְלָאכָה׃
    hebrewPlain: הנה בהיותו תמים לא יעשה למלאכה אף כי אש אכלתהו ויחר ונעשה עוד למלאכה
    kjvRefs:
    - Ezekiel 15:5
    kjvOsis:
    - Ezek.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.6
    scripture: tanakh
    name: Tanakh Ezekiel 15:6
    ref: Ezekiel 15:6
    book: Ezek
    section: neviim
    chapter: 15
    verse: 6
    ordinal: 13115
    text: 'Therefore thus saith the Lord GOD: As the vine-tree among the trees of the forest, which I have given to the fire for fuel, so do I give the inhabitants of Jerusalem.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה כַּאֲשֶׁר עֵץ־הַגֶּפֶן בְּעֵץ הַיַּעַר אֲשֶׁר־נְתַתִּיו לָאֵשׁ לְאָכְלָה כֵּן נָתַתִּי אֶת־יֹשְׁבֵי יְרוּשָׁלִָם׃
    hebrewPlain: לכן כה אמר אדני יהוה כאשר עץ הגפן בעץ היער אשר נתתיו לאש לאכלה כן נתתי את ישבי ירושלם
    kjvRefs:
    - Ezekiel 15:6
    kjvOsis:
    - Ezek.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.7
    scripture: tanakh
    name: Tanakh Ezekiel 15:7
    ref: Ezekiel 15:7
    book: Ezek
    section: neviim
    chapter: 15
    verse: 7
    ordinal: 13116
    text: And I will set My face against them; out of the fire are they come forth, and the fire shall devour them; and ye shall know that I am the LORD, when I set My face against them.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־פָּנַי בָּהֶם מֵהָאֵשׁ יָצָאוּ וְהָאֵשׁ תֹּאכְלֵם וִידַעְתֶּם כִּי־אֲנִי יְהוָה בְּשׂוּמִי אֶת־פָּנַי בָּהֶם׃
    hebrewPlain: ונתתי את פני בהם מהאש יצאו והאש תאכלם וידעתם כי אני יהוה בשומי את פני בהם
    kjvRefs:
    - Ezekiel 15:7
    kjvOsis:
    - Ezek.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.15.8
    scripture: tanakh
    name: Tanakh Ezekiel 15:8
    ref: Ezekiel 15:8
    book: Ezek
    section: neviim
    chapter: 15
    verse: 8
    ordinal: 13117
    text: And I will make the land desolate, because they have acted treacherously, saith the Lord GOD.’
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־הָאָרֶץ שְׁמָמָה יַעַן מָעֲלוּ מַעַל נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ונתתי את הארץ שממה יען מעלו מעל נאם אדני יהוה
    kjvRefs:
    - Ezekiel 15:8
    kjvOsis:
    - Ezek.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.15
- type: TanakhVerse
  data:
    osis: Ezek.16.1
    scripture: tanakh
    name: Tanakh Ezekiel 16:1
    ref: Ezekiel 16:1
    book: Ezek
    section: neviim
    chapter: 16
    verse: 1
    ordinal: 13118
    text: 'Again the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 16:1
    kjvOsis:
    - Ezek.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.2
    scripture: tanakh
    name: Tanakh Ezekiel 16:2
    ref: Ezekiel 16:2
    book: Ezek
    section: neviim
    chapter: 16
    verse: 2
    ordinal: 13119
    text: ’Son of man, cause Jerusalem to know her abominations,
    translation: JPS 1917
    original: בֶּן־אָדָם הוֹדַע אֶת־יְרוּשָׁלִַם אֶת־תּוֹעֲבֹתֶיהָ׃
    hebrewPlain: בן אדם הודע את ירושלם את תועבתיה
    kjvRefs:
    - Ezekiel 16:2
    kjvOsis:
    - Ezek.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.3
    scripture: tanakh
    name: Tanakh Ezekiel 16:3
    ref: Ezekiel 16:3
    book: Ezek
    section: neviim
    chapter: 16
    verse: 3
    ordinal: 13120
    text: 'and say: Thus saith the Lord GOD unto Jerusalem: Thine origin and thy nativity is of the land of the Canaanite; the Amorite was thy father, and thy mother was a Hittite.'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה־אָמַר אֲדֹנָי יְהוִה לִירוּשָׁלִַם מְכֹרֹתַיִךְ וּמֹלְדֹתַיִךְ מֵאֶרֶץ הַכְּנַעֲנִי אָבִיךְ הָאֱמֹרִי וְאִמֵּךְ חִתִּית׃
    hebrewPlain: ואמרת כה אמר אדני יהוה לירושלם מכרתיך ומלדתיך מארץ הכנעני אביך האמרי ואמך חתית
    kjvRefs:
    - Ezekiel 16:3
    kjvOsis:
    - Ezek.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.4
    scripture: tanakh
    name: Tanakh Ezekiel 16:4
    ref: Ezekiel 16:4
    book: Ezek
    section: neviim
    chapter: 16
    verse: 4
    ordinal: 13121
    text: And as for thy nativity, in the day thou wast born thy navel was not cut, neither wast thou washed in water for cleansing; thou was not salted at all, nor swaddled at all.
    translation: JPS 1917
    original: וּמוֹלְדוֹתַיִךְ בְּיוֹם הוּלֶּדֶת אֹתָךְ לֹא־כָרַּת שָׁרֵּךְ וּבְמַיִם לֹא־רֻחַצְתְּ לְמִשְׁעִי וְהָמְלֵחַ לֹא הֻמְלַחַתְּ וְהָחְתֵּל לֹא חֻתָּלְתְּ׃
    hebrewPlain: ומולדותיך ביום הולדת אתך לא כרת שרך ובמים לא רחצת למשעי והמלח לא המלחת והחתל לא חתלת
    kjvRefs:
    - Ezekiel 16:4
    kjvOsis:
    - Ezek.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.5
    scripture: tanakh
    name: Tanakh Ezekiel 16:5
    ref: Ezekiel 16:5
    book: Ezek
    section: neviim
    chapter: 16
    verse: 5
    ordinal: 13122
    text: No eye pitied thee, to do any of these unto thee, to have compassion upon thee; but thou wast cast out in the open field in the loathsomeness of thy person, in the day that thou wast born.
    translation: JPS 1917
    original: לֹא־חָסָה עָלַיִךְ עַיִן לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה לְחֻמְלָה עָלָיִךְ וַתֻּשְׁלְכִי אֶל־פְּנֵי הַשָּׂדֶה בְּגֹעַל נַפְשֵׁךְ בְּיוֹם הֻלֶּדֶת אֹתָךְ׃
    hebrewPlain: לא חסה עליך עין לעשות לך אחת מאלה לחמלה עליך ותשלכי אל פני השדה בגעל נפשך ביום הלדת אתך
    kjvRefs:
    - Ezekiel 16:5
    kjvOsis:
    - Ezek.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.6
    scripture: tanakh
    name: Tanakh Ezekiel 16:6
    ref: Ezekiel 16:6
    book: Ezek
    section: neviim
    chapter: 16
    verse: 6
    ordinal: 13123
    text: 'And when I passed by thee, and saw thee wallowing in thy blood, I said unto thee: In thy blood, live; yea, I said unto thee: In thy blood, live;'
    translation: JPS 1917
    original: וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ מִתְבּוֹסֶסֶת בְּדָמָיִךְ וָאֹמַר לָךְ בְּדָמַיִךְ חֲיִי וָאֹמַר לָךְ בְּדָמַיִךְ חֲיִי׃
    hebrewPlain: ואעבר עליך ואראך מתבוססת בדמיך ואמר לך בדמיך חיי ואמר לך בדמיך חיי
    kjvRefs:
    - Ezekiel 16:6
    kjvOsis:
    - Ezek.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.7
    scripture: tanakh
    name: Tanakh Ezekiel 16:7
    ref: Ezekiel 16:7
    book: Ezek
    section: neviim
    chapter: 16
    verse: 7
    ordinal: 13124
    text: 'I cause thee to increase, even as the growth of the field. And thou didst increase and grow up, and thou camest to excellent beauty: thy breasts were fashioned, and thy hair was grown; yet thou wast naked and bare.'
    translation: JPS 1917
    original: רְבָבָה כְּצֶמַח הַשָּׂדֶה נְתַתִּיךְ וַתִּרְבִּי וַתִּגְדְּלִי וַתָּבֹאִי בַּעֲדִי עֲדָיִים שָׁדַיִם נָכֹנוּ וּשְׂעָרֵךְ צִמֵּחַ וְאַתְּ עֵרֹם וְעֶרְיָה׃
    hebrewPlain: רבבה כצמח השדה נתתיך ותרבי ותגדלי ותבאי בעדי עדיים שדים נכנו ושערך צמח ואת ערם ועריה
    kjvRefs:
    - Ezekiel 16:7
    kjvOsis:
    - Ezek.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.8
    scripture: tanakh
    name: Tanakh Ezekiel 16:8
    ref: Ezekiel 16:8
    book: Ezek
    section: neviim
    chapter: 16
    verse: 8
    ordinal: 13125
    text: Now when I passed by thee, and looked upon thee, and, behold, thy time was the time of love, I spread my skirt over thee, and covered thy nakedness; yea, I swore unto thee, and entered into a covenant with thee, saith the Lord GOD, and thou becamest Mine.
    translation: JPS 1917
    original: וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ וְהִנֵּה עִתֵּךְ עֵת דֹּדִים וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ וָאֲכַסֶּה עֶרְוָתֵךְ וָאֶשָּׁבַע לָךְ וָאָבוֹא בִבְרִית אֹתָךְ נְאֻם אֲדֹנָי יְהוִה וַתִּהְיִי לִי׃
    hebrewPlain: ואעבר עליך ואראך והנה עתך עת דדים ואפרש כנפי עליך ואכסה ערותך ואשבע לך ואבוא בברית אתך נאם אדני יהוה ותהיי לי
    kjvRefs:
    - Ezekiel 16:8
    kjvOsis:
    - Ezek.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.9
    scripture: tanakh
    name: Tanakh Ezekiel 16:9
    ref: Ezekiel 16:9
    book: Ezek
    section: neviim
    chapter: 16
    verse: 9
    ordinal: 13126
    text: Then washed I thee with water; yea, I cleansed away thy blood from thee, and I anointed thee with oil.
    translation: JPS 1917
    original: וָאֶרְחָצֵךְ בַּמַּיִם וָאֶשְׁטֹף דָּמַיִךְ מֵעָלָיִךְ וָאֲסֻכֵךְ בַּשָּׁמֶן׃
    hebrewPlain: וארחצך במים ואשטף דמיך מעליך ואסכך בשמן
    kjvRefs:
    - Ezekiel 16:9
    kjvOsis:
    - Ezek.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.10
    scripture: tanakh
    name: Tanakh Ezekiel 16:10
    ref: Ezekiel 16:10
    book: Ezek
    section: neviim
    chapter: 16
    verse: 10
    ordinal: 13127
    text: I clothed thee also with richly woven work, and shod thee with sealskin, and I wound fine linen about thy head, and covered thee with silk.
    translation: JPS 1917
    original: וָאַלְבִּישֵׁךְ רִקְמָה וָאֶנְעֲלֵךְ תָּחַשׁ וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ וַאֲכַסֵּךְ מֶשִׁי׃
    hebrewPlain: ואלבישך רקמה ואנעלך תחש ואחבשך בשש ואכסך משי
    kjvRefs:
    - Ezekiel 16:10
    kjvOsis:
    - Ezek.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.11
    scripture: tanakh
    name: Tanakh Ezekiel 16:11
    ref: Ezekiel 16:11
    book: Ezek
    section: neviim
    chapter: 16
    verse: 11
    ordinal: 13128
    text: I decked thee also with ornaments, and I put bracelets upon thy hands, and a chain on thy neck.
    translation: JPS 1917
    original: וָאֶעְדֵּךְ עֶדִי וָאֶתְּנָה צְמִידִים עַל־יָדַיִךְ וְרָבִיד עַל־גְּרוֹנֵךְ׃
    hebrewPlain: ואעדך עדי ואתנה צמידים על ידיך ורביד על גרונך
    kjvRefs:
    - Ezekiel 16:11
    kjvOsis:
    - Ezek.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.12
    scripture: tanakh
    name: Tanakh Ezekiel 16:12
    ref: Ezekiel 16:12
    book: Ezek
    section: neviim
    chapter: 16
    verse: 12
    ordinal: 13129
    text: And I put a ring upon thy nose, and earrings in thine ears, and a beautiful crown upon thy head.
    translation: JPS 1917
    original: וָאֶתֵּן נֶזֶם עַל־אַפֵּךְ וַעֲגִילִים עַל־אָזְנָיִךְ וַעֲטֶרֶת תִּפְאֶרֶת בְּרֹאשֵׁךְ׃
    hebrewPlain: ואתן נזם על אפך ועגילים על אזניך ועטרת תפארת בראשך
    kjvRefs:
    - Ezekiel 16:12
    kjvOsis:
    - Ezek.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.13
    scripture: tanakh
    name: Tanakh Ezekiel 16:13
    ref: Ezekiel 16:13
    book: Ezek
    section: neviim
    chapter: 16
    verse: 13
    ordinal: 13130
    text: Thus wast thou decked with gold and silver; and thy raiment was of fine linen, and silk, and richly woven work; thou didst eat fine flour, and honey, and oil; and thou didst wax exceeding beautiful, and thou wast meet for royal estate.
    translation: JPS 1917
    original: וַתַּעְדִּי זָהָב וָכֶסֶף וּמַלְבּוּשֵׁךְ ששי [שֵׁשׁ] וָמֶשִׁי וְרִקְמָה סֹלֶת וּדְבַשׁ וָשֶׁמֶן אכלתי [אָכָלְתְּ] וַתִּיפִי בִּמְאֹד מְאֹד וַתִּצְלְחִי לִמְלוּכָה׃
    hebrewPlain: ותעדי זהב וכסף ומלבושך ששי [שש] ומשי ורקמה סלת ודבש ושמן אכלתי [אכלת] ותיפי במאד מאד ותצלחי למלוכה
    kjvRefs:
    - Ezekiel 16:13
    kjvOsis:
    - Ezek.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.14
    scripture: tanakh
    name: Tanakh Ezekiel 16:14
    ref: Ezekiel 16:14
    book: Ezek
    section: neviim
    chapter: 16
    verse: 14
    ordinal: 13131
    text: And thy renown went forth among the nations for thy beauty; for it was perfect, through My splendour which I had put upon thee, saith the Lord GOD.
    translation: JPS 1917
    original: וַיֵּצֵא לָךְ שֵׁם בַּגּוֹיִם בְּיָפְיֵךְ כִּי כָּלִיל הוּא בַּהֲדָרִי אֲשֶׁר־שַׂמְתִּי עָלַיִךְ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ויצא לך שם בגוים ביפיך כי כליל הוא בהדרי אשר שמתי עליך נאם אדני יהוה
    kjvRefs:
    - Ezekiel 16:14
    kjvOsis:
    - Ezek.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.15
    scripture: tanakh
    name: Tanakh Ezekiel 16:15
    ref: Ezekiel 16:15
    book: Ezek
    section: neviim
    chapter: 16
    verse: 15
    ordinal: 13132
    text: But thou didst trust in thy beauty and play the harlot because of thy renown, and didst pour out thy harlotries on every one that passed by; his it was.
    translation: JPS 1917
    original: וַתִּבְטְחִי בְיָפְיֵךְ וַתִּזְנִי עַל־שְׁמֵךְ וַתִּשְׁפְּכִי אֶת־תַּזְנוּתַיִךְ עַל־כָּל־עוֹבֵר לוֹ־יֶהִי׃
    hebrewPlain: ותבטחי ביפיך ותזני על שמך ותשפכי את תזנותיך על כל עובר לו יהי
    kjvRefs:
    - Ezekiel 16:15
    kjvOsis:
    - Ezek.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.16
    scripture: tanakh
    name: Tanakh Ezekiel 16:16
    ref: Ezekiel 16:16
    book: Ezek
    section: neviim
    chapter: 16
    verse: 16
    ordinal: 13133
    text: And thou didst take of thy garments, and didst make for thee high places decked with divers colours, and didst play the harlot upon them; the like things shall not come, neither shall it be so.
    translation: JPS 1917
    original: וַתִּקְחִי מִבְּגָדַיִךְ וַתַּעֲשִׂי־לָךְ בָּמוֹת טְלֻאוֹת וַתִּזְנִי עֲלֵיהֶם לֹא בָאוֹת וְלֹא יִהְיֶה׃
    hebrewPlain: ותקחי מבגדיך ותעשי לך במות טלאות ותזני עליהם לא באות ולא יהיה
    kjvRefs:
    - Ezekiel 16:16
    kjvOsis:
    - Ezek.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.17
    scripture: tanakh
    name: Tanakh Ezekiel 16:17
    ref: Ezekiel 16:17
    book: Ezek
    section: neviim
    chapter: 16
    verse: 17
    ordinal: 13134
    text: Thou didst also take thy fair jewels of My gold and of My silver, which I had given thee, and madest for thee images of men, and didst play the harlot with them;
    translation: JPS 1917
    original: וַתִּקְחִי כְּלֵי תִפְאַרְתֵּךְ מִזְּהָבִי וּמִכַּסְפִּי אֲשֶׁר נָתַתִּי לָךְ וַתַּעֲשִׂי־לָךְ צַלְמֵי זָכָר וַתִּזְנִי־בָם׃
    hebrewPlain: ותקחי כלי תפארתך מזהבי ומכספי אשר נתתי לך ותעשי לך צלמי זכר ותזני בם
    kjvRefs:
    - Ezekiel 16:17
    kjvOsis:
    - Ezek.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.18
    scripture: tanakh
    name: Tanakh Ezekiel 16:18
    ref: Ezekiel 16:18
    book: Ezek
    section: neviim
    chapter: 16
    verse: 18
    ordinal: 13135
    text: and thou didst take thy richly woven garments and cover them, and didst set Mine oil and Mine incense before them.
    translation: JPS 1917
    original: וַתִּקְחִי אֶת־בִּגְדֵי רִקְמָתֵךְ וַתְּכַסִּים וְשַׁמְנִי וּקְטָרְתִּי נתתי [נָתַתְּ] לִפְנֵיהֶם׃
    hebrewPlain: ותקחי את בגדי רקמתך ותכסים ושמני וקטרתי נתתי [נתת] לפניהם
    kjvRefs:
    - Ezekiel 16:18
    kjvOsis:
    - Ezek.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.19
    scripture: tanakh
    name: Tanakh Ezekiel 16:19
    ref: Ezekiel 16:19
    book: Ezek
    section: neviim
    chapter: 16
    verse: 19
    ordinal: 13136
    text: My bread also which I gave thee, fine flour, and oil, and honey, wherewith I fed thee, thou didst even set it before them for a sweet savour, and thus it was; saith the Lord GOD.
    translation: JPS 1917
    original: וְלַחְמִי אֲשֶׁר־נָתַתִּי לָךְ סֹלֶת וָשֶׁמֶן וּדְבַשׁ הֶאֱכַלְתִּיךְ וּנְתַתִּיהוּ לִפְנֵיהֶם לְרֵיחַ נִיחֹחַ וַיֶּהִי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ולחמי אשר נתתי לך סלת ושמן ודבש האכלתיך ונתתיהו לפניהם לריח ניחח ויהי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 16:19
    kjvOsis:
    - Ezek.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.20
    scripture: tanakh
    name: Tanakh Ezekiel 16:20
    ref: Ezekiel 16:20
    book: Ezek
    section: neviim
    chapter: 16
    verse: 20
    ordinal: 13137
    text: Moreover thou hast taken thy sons and thy daughters, whom thou hast borne unto Me, and these hast thou sacrificed unto them to be devoured. Were thy harlotries a small matter,
    translation: JPS 1917
    original: וַתִּקְחִי אֶת־בָּנַיִךְ וְאֶת־בְּנוֹתַיִךְ אֲשֶׁר יָלַדְתְּ לִי וַתִּזְבָּחִים לָהֶם לֶאֱכוֹל הַמְעַט מתזנתך [מִתַּזְנוּתָיִךְ׃]
    hebrewPlain: ותקחי את בניך ואת בנותיך אשר ילדת לי ותזבחים להם לאכול המעט מתזנתך [מתזנותיך]
    kjvRefs:
    - Ezekiel 16:20
    kjvOsis:
    - Ezek.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.21
    scripture: tanakh
    name: Tanakh Ezekiel 16:21
    ref: Ezekiel 16:21
    book: Ezek
    section: neviim
    chapter: 16
    verse: 21
    ordinal: 13138
    text: that thou hast slain My children, and delivered them up, in setting them apart unto them?
    translation: JPS 1917
    original: וַתִּשְׁחֲטִי אֶת־בָּנָי וַתִּתְּנִים בְּהַעֲבִיר אוֹתָם לָהֶם׃
    hebrewPlain: ותשחטי את בני ותתנים בהעביר אותם להם
    kjvRefs:
    - Ezekiel 16:21
    kjvOsis:
    - Ezek.16.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.22
    scripture: tanakh
    name: Tanakh Ezekiel 16:22
    ref: Ezekiel 16:22
    book: Ezek
    section: neviim
    chapter: 16
    verse: 22
    ordinal: 13139
    text: And in all thine abominations and thy harlotries thou hast not remembered the days of thy youth, when thou wast naked and bare, and wast wallowing in thy blood.
    translation: JPS 1917
    original: וְאֵת כָּל־תּוֹעֲבֹתַיִךְ וְתַזְנֻתַיִךְ לֹא זכרתי [זָכַרְתְּ] אֶת־יְמֵי נְעוּרָיִךְ בִּהְיוֹתֵךְ עֵרֹם וְעֶרְיָה מִתְבּוֹסֶסֶת בְּדָמֵךְ הָיִית׃
    hebrewPlain: ואת כל תועבתיך ותזנתיך לא זכרתי [זכרת] את ימי נעוריך בהיותך ערם ועריה מתבוססת בדמך היית
    kjvRefs:
    - Ezekiel 16:22
    kjvOsis:
    - Ezek.16.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.23
    scripture: tanakh
    name: Tanakh Ezekiel 16:23
    ref: Ezekiel 16:23
    book: Ezek
    section: neviim
    chapter: 16
    verse: 23
    ordinal: 13140
    text: And it came to pass after all thy wickedness—woe, woe unto thee! saith the Lord GOD—
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי כָּל־רָעָתֵךְ אוֹי אוֹי לָךְ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ויהי אחרי כל רעתך אוי אוי לך נאם אדני יהוה
    kjvRefs:
    - Ezekiel 16:23
    kjvOsis:
    - Ezek.16.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.24
    scripture: tanakh
    name: Tanakh Ezekiel 16:24
    ref: Ezekiel 16:24
    book: Ezek
    section: neviim
    chapter: 16
    verse: 24
    ordinal: 13141
    text: that thou hast built unto thee an eminent place, and hast made thee a lofty place in every street.
    translation: JPS 1917
    original: וַתִּבְנִי־לָךְ גֶּב וַתַּעֲשִׂי־לָךְ רָמָה בְּכָל־רְחוֹב׃
    hebrewPlain: ותבני לך גב ותעשי לך רמה בכל רחוב
    kjvRefs:
    - Ezekiel 16:24
    kjvOsis:
    - Ezek.16.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.25
    scripture: tanakh
    name: Tanakh Ezekiel 16:25
    ref: Ezekiel 16:25
    book: Ezek
    section: neviim
    chapter: 16
    verse: 25
    ordinal: 13142
    text: Thou hast built thy lofty place at every head of the way, and hast made thy beauty an abomination, and hast opened thy feet to every one that passed by, and multiplied thy harlotries.
    translation: JPS 1917
    original: אֶל־כָּל־רֹאשׁ דֶּרֶךְ בָּנִית רָמָתֵךְ וַתְּתַעֲבִי אֶת־יָפְיֵךְ וַתְּפַשְּׂקִי אֶת־רַגְלַיִךְ לְכָל־עוֹבֵר וַתַּרְבִּי אֶת־תזנתך [תַּזְנוּתָיִךְ׃]
    hebrewPlain: אל כל ראש דרך בנית רמתך ותתעבי את יפיך ותפשקי את רגליך לכל עובר ותרבי את תזנתך [תזנותיך]
    kjvRefs:
    - Ezekiel 16:25
    kjvOsis:
    - Ezek.16.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.26
    scripture: tanakh
    name: Tanakh Ezekiel 16:26
    ref: Ezekiel 16:26
    book: Ezek
    section: neviim
    chapter: 16
    verse: 26
    ordinal: 13143
    text: Thou hast also played the harlot with the Egyptians, thy neighbours, great of flesh; and hast multiplied thy harlotry, to provoke Me.
    translation: JPS 1917
    original: וַתִּזְנִי אֶל־בְּנֵי־מִצְרַיִם שְׁכֵנַיִךְ גִּדְלֵי בָשָׂר וַתַּרְבִּי אֶת־תַּזְנֻתֵךְ לְהַכְעִיסֵנִי׃
    hebrewPlain: ותזני אל בני מצרים שכניך גדלי בשר ותרבי את תזנתך להכעיסני
    kjvRefs:
    - Ezekiel 16:26
    kjvOsis:
    - Ezek.16.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.27
    scripture: tanakh
    name: Tanakh Ezekiel 16:27
    ref: Ezekiel 16:27
    book: Ezek
    section: neviim
    chapter: 16
    verse: 27
    ordinal: 13144
    text: Behold, therefore I have stretched out My hand over thee, and have diminished thine allowance, and delivered thee unto the will of them that hate thee, the daughters of the Philistines, that are ashamed of thy lewd way.
    translation: JPS 1917
    original: וְהִנֵּה נָטִיתִי יָדִי עָלַיִךְ וָאֶגְרַע חֻקֵּךְ וָאֶתְּנֵךְ בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ בְּנוֹת פְּלִשְׁתִּים הַנִּכְלָמוֹת מִדַּרְכֵּךְ זִמָּה׃
    hebrewPlain: והנה נטיתי ידי עליך ואגרע חקך ואתנך בנפש שנאותיך בנות פלשתים הנכלמות מדרכך זמה
    kjvRefs:
    - Ezekiel 16:27
    kjvOsis:
    - Ezek.16.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.28
    scripture: tanakh
    name: Tanakh Ezekiel 16:28
    ref: Ezekiel 16:28
    book: Ezek
    section: neviim
    chapter: 16
    verse: 28
    ordinal: 13145
    text: Thou hast played the harlot also with the Assyrians, without having enough; yea, thou hast played the harlot with them, and yet thou wast not satisfied.
    translation: JPS 1917
    original: וַתִּזְנִי אֶל־בְּנֵי אַשּׁוּר מִבִּלְתִּי שָׂבְעָתֵךְ וַתִּזְנִים וְגַם לֹא שָׂבָעַתְּ׃
    hebrewPlain: ותזני אל בני אשור מבלתי שבעתך ותזנים וגם לא שבעת
    kjvRefs:
    - Ezekiel 16:28
    kjvOsis:
    - Ezek.16.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.29
    scripture: tanakh
    name: Tanakh Ezekiel 16:29
    ref: Ezekiel 16:29
    book: Ezek
    section: neviim
    chapter: 16
    verse: 29
    ordinal: 13146
    text: Thou hast moreover multiplied thy harlotry with the land of traffic, even with Chaldea; and yet thou didst not have enough herewith.
    translation: JPS 1917
    original: וַתַּרְבִּי אֶת־תַּזְנוּתֵךְ אֶל־אֶרֶץ כְּנַעַן כַּשְׂדִּימָה וְגַם־בְּזֹאת לֹא שָׂבָעַתְּ׃
    hebrewPlain: ותרבי את תזנותך אל ארץ כנען כשדימה וגם בזאת לא שבעת
    kjvRefs:
    - Ezekiel 16:29
    kjvOsis:
    - Ezek.16.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.30
    scripture: tanakh
    name: Tanakh Ezekiel 16:30
    ref: Ezekiel 16:30
    book: Ezek
    section: neviim
    chapter: 16
    verse: 30
    ordinal: 13147
    text: How weak is thy heart, saith the Lord GOD, seeing thou doest all these things, the work of a wanton harlot;
    translation: JPS 1917
    original: מָה אֲמֻלָה לִבָּתֵךְ נְאֻם אֲדֹנָי יְהוִה בַּעֲשׂוֹתֵךְ אֶת־כָּל־אֵלֶּה מַעֲשֵׂה אִשָּׁה־זוֹנָה שַׁלָּטֶת׃
    hebrewPlain: מה אמלה לבתך נאם אדני יהוה בעשותך את כל אלה מעשה אשה זונה שלטת
    kjvRefs:
    - Ezekiel 16:30
    kjvOsis:
    - Ezek.16.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.31
    scripture: tanakh
    name: Tanakh Ezekiel 16:31
    ref: Ezekiel 16:31
    book: Ezek
    section: neviim
    chapter: 16
    verse: 31
    ordinal: 13148
    text: in that thou buildest thine eminent place in the head of every way, and makest thy lofty place in every street; and hast not been as a harlot that enhanceth her hire.
    translation: JPS 1917
    original: בִּבְנוֹתַיִךְ גַּבֵּךְ בְּרֹאשׁ כָּל־דֶּרֶךְ וְרָמָתֵךְ עשיתי [עָשִׂית] בְּכָל־רְחוֹב וְלֹא־הייתי [הָיִית] כַּזּוֹנָה לְקַלֵּס אֶתְנָן׃
    hebrewPlain: בבנותיך גבך בראש כל דרך ורמתך עשיתי [עשית] בכל רחוב ולא הייתי [היית] כזונה לקלס אתנן
    kjvRefs:
    - Ezekiel 16:31
    kjvOsis:
    - Ezek.16.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.32
    scripture: tanakh
    name: Tanakh Ezekiel 16:32
    ref: Ezekiel 16:32
    book: Ezek
    section: neviim
    chapter: 16
    verse: 32
    ordinal: 13149
    text: Thou wife that committest adultery, that takest strangers instead of thy husband—
    translation: JPS 1917
    original: הָאִשָּׁה הַמְּנָאָפֶת תַּחַת אִישָׁהּ תִּקַּח אֶת־זָרִים׃
    hebrewPlain: האשה המנאפת תחת אישה תקח את זרים
    kjvRefs:
    - Ezekiel 16:32
    kjvOsis:
    - Ezek.16.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.33
    scripture: tanakh
    name: Tanakh Ezekiel 16:33
    ref: Ezekiel 16:33
    book: Ezek
    section: neviim
    chapter: 16
    verse: 33
    ordinal: 13150
    text: to all harlots gifts are given; but thou hast given thy gifts to all thy lovers, and hast bribed them to come unto thee from every side in thy harlotries.
    translation: JPS 1917
    original: לְכָל־זֹנוֹת יִתְּנוּ־נֵדֶה וְאַתְּ נָתַתְּ אֶת־נְדָנַיִךְ לְכָל־מְאַהֲבַיִךְ וַתִּשְׁחֳדִי אוֹתָם לָבוֹא אֵלַיִךְ מִסָּבִיב בְּתַזְנוּתָיִךְ׃
    hebrewPlain: לכל זנות יתנו נדה ואת נתת את נדניך לכל מאהביך ותשחדי אותם לבוא אליך מסביב בתזנותיך
    kjvRefs:
    - Ezekiel 16:33
    kjvOsis:
    - Ezek.16.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.34
    scripture: tanakh
    name: Tanakh Ezekiel 16:34
    ref: Ezekiel 16:34
    book: Ezek
    section: neviim
    chapter: 16
    verse: 34
    ordinal: 13151
    text: And the contrary is in thee from other women, in that thou didst solicit to harlotry, and wast not solicited; and in that thou givest hire, and no hire is given unto thee, thus thou art contrary.
    translation: JPS 1917
    original: וַיְהִי־בָךְ הֵפֶךְ מִן־הַנָּשִׁים בְּתַזְנוּתַיִךְ וְאַחֲרַיִךְ לֹא זוּנָּה וּבְתִתֵּךְ אֶתְנָן וְאֶתְנַן לֹא נִתַּן־לָךְ וַתְּהִי לְהֶפֶךְ׃
    hebrewPlain: ויהי בך הפך מן הנשים בתזנותיך ואחריך לא זונה ובתתך אתנן ואתנן לא נתן לך ותהי להפך
    kjvRefs:
    - Ezekiel 16:34
    kjvOsis:
    - Ezek.16.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.35
    scripture: tanakh
    name: Tanakh Ezekiel 16:35
    ref: Ezekiel 16:35
    book: Ezek
    section: neviim
    chapter: 16
    verse: 35
    ordinal: 13152
    text: Wherefore, O harlot, hear the word of the LORD!
    translation: JPS 1917
    original: לָכֵן זוֹנָה שִׁמְעִי דְּבַר־יְהוָה׃
    hebrewPlain: לכן זונה שמעי דבר יהוה
    kjvRefs:
    - Ezekiel 16:35
    kjvOsis:
    - Ezek.16.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.36
    scripture: tanakh
    name: Tanakh Ezekiel 16:36
    ref: Ezekiel 16:36
    book: Ezek
    section: neviim
    chapter: 16
    verse: 36
    ordinal: 13153
    text: 'Thus saith the Lord GOD: Because thy filthiness was poured out, and thy nakedness uncovered through thy harlotries with thy lovers; and because of all the idols of thy abominations, and for the blood of thy children, that thou didst give unto them;'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהֹוִה יַעַן הִשָּׁפֵךְ נְחֻשְׁתֵּךְ וַתִּגָּלֶה עֶרְוָתֵךְ בְּתַזְנוּתַיִךְ עַל־מְאַהֲבָיִךְ וְעַל כָּל־גִּלּוּלֵי תוֹעֲבוֹתַיִךְ וְכִדְמֵי בָנַיִךְ אֲשֶׁר נָתַתְּ לָהֶם׃
    hebrewPlain: כה אמר אדני יהוה יען השפך נחשתך ותגלה ערותך בתזנותיך על מאהביך ועל כל גלולי תועבותיך וכדמי בניך אשר נתת להם
    kjvRefs:
    - Ezekiel 16:36
    kjvOsis:
    - Ezek.16.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.37
    scripture: tanakh
    name: Tanakh Ezekiel 16:37
    ref: Ezekiel 16:37
    book: Ezek
    section: neviim
    chapter: 16
    verse: 37
    ordinal: 13154
    text: therefore behold, I will gather all thy lovers, unto whom thou hast been pleasant, and all them that thou hast loved, with all them that thou hast hated; I will even gather them against thee from every side, and will uncover thy nakedness unto them, that they may see all thy nakedness.
    translation: JPS 1917
    original: לָכֵן הִנְנִי מְקַבֵּץ אֶת־כָּל־מְאַהֲבַיִךְ אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם וְאֵת כָּל־אֲשֶׁר אָהַבְתְּ עַל כָּל־אֲשֶׁר שָׂנֵאת וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם וְרָאוּ אֶת־כָּל־עֶרְוָתֵךְ׃
    hebrewPlain: לכן הנני מקבץ את כל מאהביך אשר ערבת עליהם ואת כל אשר אהבת על כל אשר שנאת וקבצתי אתם עליך מסביב וגליתי ערותך אלהם וראו את כל ערותך
    kjvRefs:
    - Ezekiel 16:37
    kjvOsis:
    - Ezek.16.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.38
    scripture: tanakh
    name: Tanakh Ezekiel 16:38
    ref: Ezekiel 16:38
    book: Ezek
    section: neviim
    chapter: 16
    verse: 38
    ordinal: 13155
    text: And I will judge thee, as women that break wedlock and shed blood are judged; and I will bring upon thee the blood of fury and jealousy.
    translation: JPS 1917
    original: וּשְׁפַטְתִּיךְ מִשְׁפְּטֵי נֹאֲפוֹת וְשֹׁפְכֹת דָּם וּנְתַתִּיךְ דַּם חֵמָה וְקִנְאָה׃
    hebrewPlain: ושפטתיך משפטי נאפות ושפכת דם ונתתיך דם חמה וקנאה
    kjvRefs:
    - Ezekiel 16:38
    kjvOsis:
    - Ezek.16.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.39
    scripture: tanakh
    name: Tanakh Ezekiel 16:39
    ref: Ezekiel 16:39
    book: Ezek
    section: neviim
    chapter: 16
    verse: 39
    ordinal: 13156
    text: I will also give thee into their hand, and they shall throw down thine eminent place, and break down thy lofty places; and they shall strip thee of thy clothes, and take thy fair jewels; and they shall leave thee naked and bare.
    translation: JPS 1917
    original: וְנָתַתִּי אוֹתָךְ בְּיָדָם וְהָרְסוּ גַבֵּךְ וְנִתְּצוּ רָמֹתַיִךְ וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדַיִךְ וְלָקְחוּ כְּלֵי תִפְאַרְתֵּךְ וְהִנִּיחוּךְ עֵירֹם וְעֶרְיָה׃
    hebrewPlain: ונתתי אותך בידם והרסו גבך ונתצו רמתיך והפשיטו אותך בגדיך ולקחו כלי תפארתך והניחוך עירם ועריה
    kjvRefs:
    - Ezekiel 16:39
    kjvOsis:
    - Ezek.16.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.40
    scripture: tanakh
    name: Tanakh Ezekiel 16:40
    ref: Ezekiel 16:40
    book: Ezek
    section: neviim
    chapter: 16
    verse: 40
    ordinal: 13157
    text: They shall also bring up an assembly against thee, and they shall stone thee with stones, and thrust thee through with their swords.
    translation: JPS 1917
    original: וְהֶעֱלוּ עָלַיִךְ קָהָל וְרָגְמוּ אוֹתָךְ בָּאָבֶן וּבִתְּקוּךְ בְּחַרְבוֹתָם׃
    hebrewPlain: והעלו עליך קהל ורגמו אותך באבן ובתקוך בחרבותם
    kjvRefs:
    - Ezekiel 16:40
    kjvOsis:
    - Ezek.16.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.41
    scripture: tanakh
    name: Tanakh Ezekiel 16:41
    ref: Ezekiel 16:41
    book: Ezek
    section: neviim
    chapter: 16
    verse: 41
    ordinal: 13158
    text: And they shall burn thy houses with fire, and execute judgments upon thee in the sight of many women; and I will cause thee to cease from playing the harlot, and thou shalt also give no hire any more.
    translation: JPS 1917
    original: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ וְעָשׂוּ־בָךְ שְׁפָטִים לְעֵינֵי נָשִׁים רַבּוֹת וְהִשְׁבַּתִּיךְ מִזּוֹנָה וְגַם־אֶתְנַן לֹא תִתְּנִי־עוֹד׃
    hebrewPlain: ושרפו בתיך באש ועשו בך שפטים לעיני נשים רבות והשבתיך מזונה וגם אתנן לא תתני עוד
    kjvRefs:
    - Ezekiel 16:41
    kjvOsis:
    - Ezek.16.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.42
    scripture: tanakh
    name: Tanakh Ezekiel 16:42
    ref: Ezekiel 16:42
    book: Ezek
    section: neviim
    chapter: 16
    verse: 42
    ordinal: 13159
    text: So will I satisfy My fury upon thee, and My jealousy shall depart from thee, and I will be quiet, and will be no more angry.
    translation: JPS 1917
    original: וַהֲנִחֹתִי חֲמָתִי בָּךְ וְסָרָה קִנְאָתִי מִמֵּךְ וְשָׁקַטְתִּי וְלֹא אֶכְעַס עוֹד׃
    hebrewPlain: והנחתי חמתי בך וסרה קנאתי ממך ושקטתי ולא אכעס עוד
    kjvRefs:
    - Ezekiel 16:42
    kjvOsis:
    - Ezek.16.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.43
    scripture: tanakh
    name: Tanakh Ezekiel 16:43
    ref: Ezekiel 16:43
    book: Ezek
    section: neviim
    chapter: 16
    verse: 43
    ordinal: 13160
    text: Because thou hast not remembered the days of thy youth, but hast fretted Me in all these things; lo, therefore I also will bring thy way upon thy head, saith the Lord GOD; or hast thou not committed this lewdness above all thine abominations?
    translation: JPS 1917
    original: יַעַן אֲשֶׁר לֹא־זכרתי [זָכַרְתְּ] אֶת־יְמֵי נְעוּרַיִךְ וַתִּרְגְּזִי־לִי בְּכָל־אֵלֶּה וְגַם־אֲנִי הֵא דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי נְאֻם אֲדֹנָי יְהוִה וְלֹא עשיתי [עָשִׂית] אֶת־הַזִּמָּה עַל כָּל־תּוֹעֲבֹתָיִךְ׃
    hebrewPlain: יען אשר לא זכרתי [זכרת] את ימי נעוריך ותרגזי לי בכל אלה וגם אני הא דרכך בראש נתתי נאם אדני יהוה ולא עשיתי [עשית] את הזמה על כל תועבתיך
    kjvRefs:
    - Ezekiel 16:43
    kjvOsis:
    - Ezek.16.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.44
    scripture: tanakh
    name: Tanakh Ezekiel 16:44
    ref: Ezekiel 16:44
    book: Ezek
    section: neviim
    chapter: 16
    verse: 44
    ordinal: 13161
    text: 'Behold, every one that useth proverbs shall use this proverb against thee, saying: As the mother, so her daughter.'
    translation: JPS 1917
    original: הִנֵּה כָּל־הַמֹּשֵׁל עָלַיִךְ יִמְשֹׁל לֵאמֹר כְּאִמָּה בִּתָּהּ׃
    hebrewPlain: הנה כל המשל עליך ימשל לאמר כאמה בתה
    kjvRefs:
    - Ezekiel 16:44
    kjvOsis:
    - Ezek.16.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.45
    scripture: tanakh
    name: Tanakh Ezekiel 16:45
    ref: Ezekiel 16:45
    book: Ezek
    section: neviim
    chapter: 16
    verse: 45
    ordinal: 13162
    text: Thou art thy mother’s daughter, that loatheth her husband and her children; and thou art the sister of thy sisters, who loathed their husbands and their children; your mother was a Hittite, and your father an Amorite.
    translation: JPS 1917
    original: בַּת־אִמֵּךְ אַתְּ גֹּעֶלֶת אִישָׁהּ וּבָנֶיהָ וַאֲחוֹת אֲחוֹתֵךְ אַתְּ אֲשֶׁר גָּעֲלוּ אַנְשֵׁיהֶן וּבְנֵיהֶן אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי׃
    hebrewPlain: בת אמך את געלת אישה ובניה ואחות אחותך את אשר געלו אנשיהן ובניהן אמכן חתית ואביכן אמרי
    kjvRefs:
    - Ezekiel 16:45
    kjvOsis:
    - Ezek.16.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.46
    scripture: tanakh
    name: Tanakh Ezekiel 16:46
    ref: Ezekiel 16:46
    book: Ezek
    section: neviim
    chapter: 16
    verse: 46
    ordinal: 13163
    text: And thine elder sister is Samaria, that dwelleth at thy left hand, she and her daughters; and thy younger sister, that dwelleth at thy right hand, is Sodom and her daughters.
    translation: JPS 1917
    original: וַאֲחוֹתֵךְ הַגְּדוֹלָה שֹׁמְרוֹן הִיא וּבְנוֹתֶיהָ הַיּוֹשֶׁבֶת עַל־שְׂמֹאולֵךְ וַאֲחוֹתֵךְ הַקְּטַנָּה מִמֵּךְ הַיּוֹשֶׁבֶת מִימִינֵךְ סְדֹם וּבְנוֹתֶיהָ׃
    hebrewPlain: ואחותך הגדולה שמרון היא ובנותיה היושבת על שמאולך ואחותך הקטנה ממך היושבת מימינך סדם ובנותיה
    kjvRefs:
    - Ezekiel 16:46
    kjvOsis:
    - Ezek.16.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.47
    scripture: tanakh
    name: Tanakh Ezekiel 16:47
    ref: Ezekiel 16:47
    book: Ezek
    section: neviim
    chapter: 16
    verse: 47
    ordinal: 13164
    text: Yet hast thou not walked in their ways, nor done after their abominations; but in a very little while thou didst deal more corruptly than they in all thy ways.
    translation: JPS 1917
    original: וְלֹא בְדַרְכֵיהֶן הָלַכְתְּ וּבְתוֹעֲבוֹתֵיהֶן עשיתי [עָשִׂית] כִּמְעַט קָט וַתַּשְׁחִתִי מֵהֵן בְּכָל־דְּרָכָיִךְ׃
    hebrewPlain: ולא בדרכיהן הלכת ובתועבותיהן עשיתי [עשית] כמעט קט ותשחתי מהן בכל דרכיך
    kjvRefs:
    - Ezekiel 16:47
    kjvOsis:
    - Ezek.16.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.48
    scripture: tanakh
    name: Tanakh Ezekiel 16:48
    ref: Ezekiel 16:48
    book: Ezek
    section: neviim
    chapter: 16
    verse: 48
    ordinal: 13165
    text: As I live, saith the Lord GOD, Sodom thy sister hath not done, she nor her daughters, as thou hast done, thou and thy daughters.
    translation: JPS 1917
    original: חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־עָשְׂתָה סְדֹם אֲחוֹתֵךְ הִיא וּבְנוֹתֶיהָ כַּאֲשֶׁר עָשִׂית אַתְּ וּבְנוֹתָיִךְ׃
    hebrewPlain: חי אני נאם אדני יהוה אם עשתה סדם אחותך היא ובנותיה כאשר עשית את ובנותיך
    kjvRefs:
    - Ezekiel 16:48
    kjvOsis:
    - Ezek.16.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.49
    scripture: tanakh
    name: Tanakh Ezekiel 16:49
    ref: Ezekiel 16:49
    book: Ezek
    section: neviim
    chapter: 16
    verse: 49
    ordinal: 13166
    text: 'Behold, this was the iniquity of thy sister Sodom: pride, fulness of bread, and careless ease was in her and in her daughters; neither did she strengthen the hand of the poor and needy.'
    translation: JPS 1917
    original: הִנֵּה־זֶה הָיָה עֲוֺן סְדֹם אֲחוֹתֵךְ גָּאוֹן שִׂבְעַת־לֶחֶם וְשַׁלְוַת הַשְׁקֵט הָיָה לָהּ וְלִבְנוֹתֶיהָ וְיַד־עָנִי וְאֶבְיוֹן לֹא הֶחֱזִיקָה׃
    hebrewPlain: הנה זה היה עון סדם אחותך גאון שבעת לחם ושלות השקט היה לה ולבנותיה ויד עני ואביון לא החזיקה
    kjvRefs:
    - Ezekiel 16:49
    kjvOsis:
    - Ezek.16.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.50
    scripture: tanakh
    name: Tanakh Ezekiel 16:50
    ref: Ezekiel 16:50
    book: Ezek
    section: neviim
    chapter: 16
    verse: 50
    ordinal: 13167
    text: And they were haughty, and committed abomination before Me; therefore I removed them when I saw it.
    translation: JPS 1917
    original: וַתִּגְבְּהֶינָה וַתַּעֲשֶׂינָה תוֹעֵבָה לְפָנָי וָאָסִיר אֶתְהֶן כַּאֲשֶׁר רָאִיתִי׃
    hebrewPlain: ותגבהינה ותעשינה תועבה לפני ואסיר אתהן כאשר ראיתי
    kjvRefs:
    - Ezekiel 16:50
    kjvOsis:
    - Ezek.16.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.51
    scripture: tanakh
    name: Tanakh Ezekiel 16:51
    ref: Ezekiel 16:51
    book: Ezek
    section: neviim
    chapter: 16
    verse: 51
    ordinal: 13168
    text: Neither hath Samaria committed even half of thy sins; but thou hast multiplied thine abominations more than they, and hast justified thy sisters by all thine abominations which thou hast done.
    translation: JPS 1917
    original: וְשֹׁמְרוֹן כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה וַתַּרְבִּי אֶת־תּוֹעֲבוֹתַיִךְ מֵהֵנָּה וַתְּצַדְּקִי אֶת־אחותך [אֲחוֹתַיִךְ] בְּכָל־תּוֹעֲבוֹתַיִךְ אֲשֶׁר עשיתי [עָשִׂית׃]
    hebrewPlain: ושמרון כחצי חטאתיך לא חטאה ותרבי את תועבותיך מהנה ותצדקי את אחותך [אחותיך] בכל תועבותיך אשר עשיתי [עשית]
    kjvRefs:
    - Ezekiel 16:51
    kjvOsis:
    - Ezek.16.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.52
    scripture: tanakh
    name: Tanakh Ezekiel 16:52
    ref: Ezekiel 16:52
    book: Ezek
    section: neviim
    chapter: 16
    verse: 52
    ordinal: 13169
    text: Thou also, bear thine own shame, in that thou hast given judgment for thy sisters; through thy sins that thou hast committed more abominable than they, they are more righteous than thou; yea, be thou also confounded, and bear thy shame, in that thou hast justified thy sisters.
    translation: JPS 1917
    original: גַּם־אַתְּ שְׂאִי כְלִמָּתֵךְ אֲשֶׁר פִּלַּלְתְּ לַאֲחוֹתֵךְ בְּחַטֹּאתַיִךְ אֲשֶׁר־הִתְעַבְתְּ מֵהֵן תִּצְדַּקְנָה מִמֵּךְ וְגַם־אַתְּ בּוֹשִׁי וּשְׂאִי כְלִמָּתֵךְ בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ׃
    hebrewPlain: גם את שאי כלמתך אשר פללת לאחותך בחטאתיך אשר התעבת מהן תצדקנה ממך וגם את בושי ושאי כלמתך בצדקתך אחיותך
    kjvRefs:
    - Ezekiel 16:52
    kjvOsis:
    - Ezek.16.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.53
    scripture: tanakh
    name: Tanakh Ezekiel 16:53
    ref: Ezekiel 16:53
    book: Ezek
    section: neviim
    chapter: 16
    verse: 53
    ordinal: 13170
    text: And I will turn their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, and the captivity of thy captives in the midst of them;
    translation: JPS 1917
    original: וְשַׁבְתִּי אֶת־שְׁבִיתְהֶן אֶת־שבית [שְׁבוּת] סְדֹם וּבְנוֹתֶיהָ וְאֶת־שבית [שְׁבוּת] שֹׁמְרוֹן וּבְנוֹתֶיהָ ושבית [וּשְׁבוּת] שְׁבִיתַיִךְ בְּתוֹכָהְנָה׃
    hebrewPlain: ושבתי את שביתהן את שבית [שבות] סדם ובנותיה ואת שבית [שבות] שמרון ובנותיה ושבית [ושבות] שביתיך בתוכהנה
    kjvRefs:
    - Ezekiel 16:53
    kjvOsis:
    - Ezek.16.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.54
    scripture: tanakh
    name: Tanakh Ezekiel 16:54
    ref: Ezekiel 16:54
    book: Ezek
    section: neviim
    chapter: 16
    verse: 54
    ordinal: 13171
    text: that thou mayest bear thine own shame, and mayest be ashamed because of all that thou hast done, in that thou art a comfort unto them.
    translation: JPS 1917
    original: לְמַעַן תִּשְׂאִי כְלִמָּתֵךְ וְנִכְלַמְתְּ מִכֹּל אֲשֶׁר עָשִׂית בְּנַחֲמֵךְ אֹתָן׃
    hebrewPlain: למען תשאי כלמתך ונכלמת מכל אשר עשית בנחמך אתן
    kjvRefs:
    - Ezekiel 16:54
    kjvOsis:
    - Ezek.16.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.55
    scripture: tanakh
    name: Tanakh Ezekiel 16:55
    ref: Ezekiel 16:55
    book: Ezek
    section: neviim
    chapter: 16
    verse: 55
    ordinal: 13172
    text: And thy sisters, Sodom and her daughters, shall return to their former estate, and Samaria and her daughters shall return to their former estate, and thou and thy daughters shall return to your former estate.
    translation: JPS 1917
    original: וַאֲחוֹתַיִךְ סְדֹם וּבְנוֹתֶיהָ תָּשֹׁבְןָ לְקַדְמָתָן וְשֹׁמְרוֹן וּבְנוֹתֶיהָ תָּשֹׁבְןָ לְקַדְמָתָן וְאַתְּ וּבְנוֹתַיִךְ תְּשֻׁבֶינָה לְקַדְמַתְכֶן׃
    hebrewPlain: ואחותיך סדם ובנותיה תשבן לקדמתן ושמרון ובנותיה תשבן לקדמתן ואת ובנותיך תשבינה לקדמתכן
    kjvRefs:
    - Ezekiel 16:55
    kjvOsis:
    - Ezek.16.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.56
    scripture: tanakh
    name: Tanakh Ezekiel 16:56
    ref: Ezekiel 16:56
    book: Ezek
    section: neviim
    chapter: 16
    verse: 56
    ordinal: 13173
    text: For thy sister Sodom was not mentioned by thy mouth in the day of thy pride;
    translation: JPS 1917
    original: וְלוֹא הָיְתָה סְדֹם אֲחוֹתֵךְ לִשְׁמוּעָה בְּפִיךְ בְּיוֹם גְּאוֹנָיִךְ׃
    hebrewPlain: ולוא היתה סדם אחותך לשמועה בפיך ביום גאוניך
    kjvRefs:
    - Ezekiel 16:56
    kjvOsis:
    - Ezek.16.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.57
    scripture: tanakh
    name: Tanakh Ezekiel 16:57
    ref: Ezekiel 16:57
    book: Ezek
    section: neviim
    chapter: 16
    verse: 57
    ordinal: 13174
    text: before thy wickedness was uncovered, as at the time of the taunt of the daughters of Aram, and of all that are round about her, the daughters of the Philistines, that have thee in disdain round about.
    translation: JPS 1917
    original: בְּטֶרֶם תִּגָּלֶה רָעָתֵךְ כְּמוֹ עֵת חֶרְפַּת בְּנוֹת־אֲרָם וְכָל־סְבִיבוֹתֶיהָ בְּנוֹת פְּלִשְׁתִּים הַשָּׁאטוֹת אוֹתָךְ מִסָּבִיב׃
    hebrewPlain: בטרם תגלה רעתך כמו עת חרפת בנות ארם וכל סביבותיה בנות פלשתים השאטות אותך מסביב
    kjvRefs:
    - Ezekiel 16:57
    kjvOsis:
    - Ezek.16.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.58
    scripture: tanakh
    name: Tanakh Ezekiel 16:58
    ref: Ezekiel 16:58
    book: Ezek
    section: neviim
    chapter: 16
    verse: 58
    ordinal: 13175
    text: Thou hast borne thy lewdness and thine abominations, saith the LORD.
    translation: JPS 1917
    original: אֶת־זִמָּתֵךְ וְאֶת־תּוֹעֲבוֹתַיִךְ אַתְּ נְשָׂאתִים נְאֻם יְהוָה׃
    hebrewPlain: את זמתך ואת תועבותיך את נשאתים נאם יהוה
    kjvRefs:
    - Ezekiel 16:58
    kjvOsis:
    - Ezek.16.58
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.59
    scripture: tanakh
    name: Tanakh Ezekiel 16:59
    ref: Ezekiel 16:59
    book: Ezek
    section: neviim
    chapter: 16
    verse: 59
    ordinal: 13176
    text: 'For thus saith the Lord GOD: I will even deal with thee as thou hast done, who hast despised the oath in breaking the covenant.'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה ועשית [וְעָשִׂיתִי] אוֹתָךְ כַּאֲשֶׁר עָשִׂית אֲשֶׁר־בָּזִית אָלָה לְהָפֵר בְּרִית׃
    hebrewPlain: כי כה אמר אדני יהוה ועשית [ועשיתי] אותך כאשר עשית אשר בזית אלה להפר ברית
    kjvRefs:
    - Ezekiel 16:59
    kjvOsis:
    - Ezek.16.59
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.60
    scripture: tanakh
    name: Tanakh Ezekiel 16:60
    ref: Ezekiel 16:60
    book: Ezek
    section: neviim
    chapter: 16
    verse: 60
    ordinal: 13177
    text: Nevertheless I will remember My covenant with thee in the days of thy youth, and I will establish unto thee an everlasting covenant.
    translation: JPS 1917
    original: וְזָכַרְתִּי אֲנִי אֶת־בְּרִיתִי אוֹתָךְ בִּימֵי נְעוּרָיִךְ וַהֲקִמוֹתִי לָךְ בְּרִית עוֹלָם׃
    hebrewPlain: וזכרתי אני את בריתי אותך בימי נעוריך והקמותי לך ברית עולם
    kjvRefs:
    - Ezekiel 16:60
    kjvOsis:
    - Ezek.16.60
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.61
    scripture: tanakh
    name: Tanakh Ezekiel 16:61
    ref: Ezekiel 16:61
    book: Ezek
    section: neviim
    chapter: 16
    verse: 61
    ordinal: 13178
    text: Then shalt thou remember thy ways, and be ashamed, when thou shalt receive thy sisters, thine elder sisters and thy younger; and I will give them unto thee for daughters, but not because of thy covenant.
    translation: JPS 1917
    original: וְזָכַרְתְּ אֶת־דְּרָכַיִךְ וְנִכְלַמְתְּ בְּקַחְתֵּךְ אֶת־אֲחוֹתַיִךְ הַגְּדֹלוֹת מִמֵּךְ אֶל־הַקְּטַנּוֹת מִמֵּךְ וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת וְלֹא מִבְּרִיתֵךְ׃
    hebrewPlain: וזכרת את דרכיך ונכלמת בקחתך את אחותיך הגדלות ממך אל הקטנות ממך ונתתי אתהן לך לבנות ולא מבריתך
    kjvRefs:
    - Ezekiel 16:61
    kjvOsis:
    - Ezek.16.61
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.62
    scripture: tanakh
    name: Tanakh Ezekiel 16:62
    ref: Ezekiel 16:62
    book: Ezek
    section: neviim
    chapter: 16
    verse: 62
    ordinal: 13179
    text: And I will establish My covenant with thee, and thou shalt know that I am the LORD;
    translation: JPS 1917
    original: וַהֲקִימוֹתִי אֲנִי אֶת־בְּרִיתִי אִתָּךְ וְיָדַעַתְּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והקימותי אני את בריתי אתך וידעת כי אני יהוה
    kjvRefs:
    - Ezekiel 16:62
    kjvOsis:
    - Ezek.16.62
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.16.63
    scripture: tanakh
    name: Tanakh Ezekiel 16:63
    ref: Ezekiel 16:63
    book: Ezek
    section: neviim
    chapter: 16
    verse: 63
    ordinal: 13180
    text: that thou mayest remember, and be confounded, and never open thy mouth any more, because of thy shame; when I have forgiven thee all that thou hast done, saith the Lord GOD.’
    translation: JPS 1917
    original: לְמַעַן תִּזְכְּרִי וָבֹשְׁתְּ וְלֹא יִהְיֶה־לָּךְ עוֹד פִּתְחוֹן פֶּה מִפְּנֵי כְּלִמָּתֵךְ בְּכַפְּרִי־לָךְ לְכָל־אֲשֶׁר עָשִׂית נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: למען תזכרי ובשת ולא יהיה לך עוד פתחון פה מפני כלמתך בכפרי לך לכל אשר עשית נאם אדני יהוה
    kjvRefs:
    - Ezekiel 16:63
    kjvOsis:
    - Ezek.16.63
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.16
- type: TanakhVerse
  data:
    osis: Ezek.17.1
    scripture: tanakh
    name: Tanakh Ezekiel 17:1
    ref: Ezekiel 17:1
    book: Ezek
    section: neviim
    chapter: 17
    verse: 1
    ordinal: 13181
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 17:1
    kjvOsis:
    - Ezek.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.2
    scripture: tanakh
    name: Tanakh Ezekiel 17:2
    ref: Ezekiel 17:2
    book: Ezek
    section: neviim
    chapter: 17
    verse: 2
    ordinal: 13182
    text: ’Son of man, put forth a riddle, and speak a parable unto the house of Israel,
    translation: JPS 1917
    original: בֶּן־אָדָם חוּד חִידָה וּמְשֹׁל מָשָׁל אֶל־בֵּית יִשְׂרָאֵל׃
    hebrewPlain: בן אדם חוד חידה ומשל משל אל בית ישראל
    kjvRefs:
    - Ezekiel 17:2
    kjvOsis:
    - Ezek.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.3
    scripture: tanakh
    name: Tanakh Ezekiel 17:3
    ref: Ezekiel 17:3
    book: Ezek
    section: neviim
    chapter: 17
    verse: 3
    ordinal: 13183
    text: 'and say: Thus saith the Lord GOD: A great eagle with great wings And long pinions, Full of feathers, which had divers colours, Came unto Lebanon, And took the top of the cedar;'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה־אָמַר אֲדֹנָי יְהוִה הַנֶּשֶׁר הַגָּדוֹל גְּדוֹל הַכְּנָפַיִם אֶרֶךְ הָאֵבֶר מָלֵא הַנּוֹצָה אֲשֶׁר־לוֹ הָרִקְמָה בָּא אֶל־הַלְּבָנוֹן וַיִּקַּח אֶת־צַמֶּרֶת הָאָרֶז׃
    hebrewPlain: ואמרת כה אמר אדני יהוה הנשר הגדול גדול הכנפים ארך האבר מלא הנוצה אשר לו הרקמה בא אל הלבנון ויקח את צמרת הארז
    kjvRefs:
    - Ezekiel 17:3
    kjvOsis:
    - Ezek.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.4
    scripture: tanakh
    name: Tanakh Ezekiel 17:4
    ref: Ezekiel 17:4
    book: Ezek
    section: neviim
    chapter: 17
    verse: 4
    ordinal: 13184
    text: He cropped off the topmost of the young twigs thereof, And carried it into a land of traffic; He set it in a city of merchants.
    translation: JPS 1917
    original: אֵת רֹאשׁ יְנִיקוֹתָיו קָטָף וַיְבִיאֵהוּ אֶל־אֶרֶץ כְּנַעַן בְּעִיר רֹכְלִים שָׂמוֹ׃
    hebrewPlain: את ראש יניקותיו קטף ויביאהו אל ארץ כנען בעיר רכלים שמו
    kjvRefs:
    - Ezekiel 17:4
    kjvOsis:
    - Ezek.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.5
    scripture: tanakh
    name: Tanakh Ezekiel 17:5
    ref: Ezekiel 17:5
    book: Ezek
    section: neviim
    chapter: 17
    verse: 5
    ordinal: 13185
    text: He took also of the seed of the land, And planted it in a fruitful soil; He placed it beside many waters, He set it as a slip.
    translation: JPS 1917
    original: וַיִּקַּח מִזֶּרַע הָאָרֶץ וַיִּתְּנֵהוּ בִּשְׂדֵה־זָרַע קָח עַל־מַיִם רַבִּים צַפְצָפָה שָׂמוֹ׃
    hebrewPlain: ויקח מזרע הארץ ויתנהו בשדה זרע קח על מים רבים צפצפה שמו
    kjvRefs:
    - Ezekiel 17:5
    kjvOsis:
    - Ezek.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.6
    scripture: tanakh
    name: Tanakh Ezekiel 17:6
    ref: Ezekiel 17:6
    book: Ezek
    section: neviim
    chapter: 17
    verse: 6
    ordinal: 13186
    text: And it grew, and became a spreading vine Of low stature, Whose tendrils might turn toward him, And the roots thereof be under him; So it became a vine, and brought forth branches, And shot forth sprigs.
    translation: JPS 1917
    original: וַיִּצְמַח וַיְהִי לְגֶפֶן סֹרַחַת שִׁפְלַת קוֹמָה לִפְנוֹת דָּלִיּוֹתָיו אֵלָיו וְשָׁרָשָׁיו תַּחְתָּיו יִהְיוּ וַתְּהִי לְגֶפֶן וַתַּעַשׂ בַּדִּים וַתְּשַׁלַּח פֹּארוֹת׃
    hebrewPlain: ויצמח ויהי לגפן סרחת שפלת קומה לפנות דליותיו אליו ושרשיו תחתיו יהיו ותהי לגפן ותעש בדים ותשלח פארות
    kjvRefs:
    - Ezekiel 17:6
    kjvOsis:
    - Ezek.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.7
    scripture: tanakh
    name: Tanakh Ezekiel 17:7
    ref: Ezekiel 17:7
    book: Ezek
    section: neviim
    chapter: 17
    verse: 7
    ordinal: 13187
    text: There was also another great eagle with great wings And many feathers; And, behold, this vine did bend Its roots toward him, And shot forth its branches toward him, from the beds of its plantation, That he might water it.
    translation: JPS 1917
    original: וַיְהִי נֶשֶׁר־אֶחָד גָּדוֹל גְּדוֹל כְּנָפַיִם וְרַב־נוֹצָה וְהִנֵּה הַגֶּפֶן הַזֹּאת כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו וְדָלִיּוֹתָיו שִׁלְחָה־לּוֹ לְהַשְׁקוֹת אוֹתָהּ מֵעֲרֻגוֹת מַטָּעָהּ׃
    hebrewPlain: ויהי נשר אחד גדול גדול כנפים ורב נוצה והנה הגפן הזאת כפנה שרשיה עליו ודליותיו שלחה לו להשקות אותה מערגות מטעה
    kjvRefs:
    - Ezekiel 17:7
    kjvOsis:
    - Ezek.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.8
    scripture: tanakh
    name: Tanakh Ezekiel 17:8
    ref: Ezekiel 17:8
    book: Ezek
    section: neviim
    chapter: 17
    verse: 8
    ordinal: 13188
    text: It was planted in a good soil By many waters, That it might bring forth branches, and that it might bear fruit, That it might be a stately vine.
    translation: JPS 1917
    original: אֶל־שָׂדֶה טּוֹב אֶל־מַיִם רַבִּים הִיא שְׁתוּלָה לַעֲשׂוֹת עָנָף וְלָשֵׂאת פֶּרִי לִהְיוֹת לְגֶפֶן אַדָּרֶת׃
    hebrewPlain: אל שדה טוב אל מים רבים היא שתולה לעשות ענף ולשאת פרי להיות לגפן אדרת
    kjvRefs:
    - Ezekiel 17:8
    kjvOsis:
    - Ezek.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.9
    scripture: tanakh
    name: Tanakh Ezekiel 17:9
    ref: Ezekiel 17:9
    book: Ezek
    section: neviim
    chapter: 17
    verse: 9
    ordinal: 13189
    text: 'Say thou: Thus saith the Lord GOD: Shall it prosper? Shall he not pull up the roots thereof, And cut off the fruit thereof, that it wither, Yea, wither in all its sprouting leaves? Neither shall great power or much people be at hand When it is plucked up by the roots thereof.'
    translation: JPS 1917
    original: אֱמֹר כֹּה אָמַר אֲדֹנָי יְהֹוִה תִּצְלָח הֲלוֹא אֶת־שָׁרָשֶׁיהָ יְנַתֵּק וְאֶת־פִּרְיָהּ יְקוֹסֵס וְיָבֵשׁ כָּל־טַרְפֵּי צִמְחָהּ תִּיבָשׁ וְלֹא־בִזְרֹעַ גְּדוֹלָה וּבְעַם־רָב לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ׃
    hebrewPlain: אמר כה אמר אדני יהוה תצלח הלוא את שרשיה ינתק ואת פריה יקוסס ויבש כל טרפי צמחה תיבש ולא בזרע גדולה ובעם רב למשאות אותה משרשיה
    kjvRefs:
    - Ezekiel 17:9
    kjvOsis:
    - Ezek.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.10
    scripture: tanakh
    name: Tanakh Ezekiel 17:10
    ref: Ezekiel 17:10
    book: Ezek
    section: neviim
    chapter: 17
    verse: 10
    ordinal: 13190
    text: Yea, behold, being planted, shall it prosper? Shall it not utterly wither, when the east wind toucheth it? In the beds where it grew it shall wither.’
    translation: JPS 1917
    original: וְהִנֵּה שְׁתוּלָה הֲתִצְלָח הֲלוֹא כְגַעַת בָּהּ רוּחַ הַקָּדִים תִּיבַשׁ יָבֹשׁ עַל־עֲרֻגֹת צִמְחָהּ תִּיבָשׁ׃
    hebrewPlain: והנה שתולה התצלח הלוא כגעת בה רוח הקדים תיבש יבש על ערגת צמחה תיבש
    kjvRefs:
    - Ezekiel 17:10
    kjvOsis:
    - Ezek.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.11
    scripture: tanakh
    name: Tanakh Ezekiel 17:11
    ref: Ezekiel 17:11
    book: Ezek
    section: neviim
    chapter: 17
    verse: 11
    ordinal: 13191
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 17:11
    kjvOsis:
    - Ezek.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.12
    scripture: tanakh
    name: Tanakh Ezekiel 17:12
    ref: Ezekiel 17:12
    book: Ezek
    section: neviim
    chapter: 17
    verse: 12
    ordinal: 13192
    text: '’Say now to the rebellious house: Know ye not what these things mean? tell them: Behold, the king of Babylon came to Jerusalem, and took the king thereof, and the princes thereof, and brought them to him to Babylon;'
    translation: JPS 1917
    original: אֱמָר־נָא לְבֵית הַמֶּרִי הֲלֹא יְדַעְתֶּם מָה־אֵלֶּה אֱמֹר הִנֵּה־בָא מֶלֶךְ־בָּבֶל יְרוּשָׁלִַם וַיִּקַּח אֶת־מַלְכָּהּ וְאֶת־שָׂרֶיהָ וַיָּבֵא אוֹתָם אֵלָיו בָּבֶלָה׃
    hebrewPlain: אמר נא לבית המרי הלא ידעתם מה אלה אמר הנה בא מלך בבל ירושלם ויקח את מלכה ואת שריה ויבא אותם אליו בבלה
    kjvRefs:
    - Ezekiel 17:12
    kjvOsis:
    - Ezek.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.13
    scripture: tanakh
    name: Tanakh Ezekiel 17:13
    ref: Ezekiel 17:13
    book: Ezek
    section: neviim
    chapter: 17
    verse: 13
    ordinal: 13193
    text: and he took of the seed royal, and made a covenant with him, and brought him under an oath, and the mighty of the land he took away;
    translation: JPS 1917
    original: וַיִּקַּח מִזֶּרַע הַמְּלוּכָה וַיִּכְרֹת אִתּוֹ בְּרִית וַיָּבֵא אֹתוֹ בְּאָלָה וְאֶת־אֵילֵי הָאָרֶץ לָקָח׃
    hebrewPlain: ויקח מזרע המלוכה ויכרת אתו ברית ויבא אתו באלה ואת אילי הארץ לקח
    kjvRefs:
    - Ezekiel 17:13
    kjvOsis:
    - Ezek.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.14
    scripture: tanakh
    name: Tanakh Ezekiel 17:14
    ref: Ezekiel 17:14
    book: Ezek
    section: neviim
    chapter: 17
    verse: 14
    ordinal: 13194
    text: that his might be a lowly kingdom, that it might not lift itself up, but that by keeping his covenant it might stand.
    translation: JPS 1917
    original: לִהְיוֹת מַמְלָכָה שְׁפָלָה לְבִלְתִּי הִתְנַשֵּׂא לִשְׁמֹר אֶת־בְּרִיתוֹ לְעָמְדָהּ׃
    hebrewPlain: להיות ממלכה שפלה לבלתי התנשא לשמר את בריתו לעמדה
    kjvRefs:
    - Ezekiel 17:14
    kjvOsis:
    - Ezek.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.15
    scripture: tanakh
    name: Tanakh Ezekiel 17:15
    ref: Ezekiel 17:15
    book: Ezek
    section: neviim
    chapter: 17
    verse: 15
    ordinal: 13195
    text: But he rebelled against him in sending his ambassadors into Egypt, that they might give him horses and much people. Shall he prosper? shall he escape that doeth such things? shall he break the covenant, and yet escape?
    translation: JPS 1917
    original: וַיִּמְרָד־בּוֹ לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם לָתֶת־לוֹ סוּסִים וְעַם־רָב הֲיִצְלָח הֲיִמָּלֵט הָעֹשֵׂה אֵלֶּה וְהֵפֵר בְּרִית וְנִמְלָט׃
    hebrewPlain: וימרד בו לשלח מלאכיו מצרים לתת לו סוסים ועם רב היצלח הימלט העשה אלה והפר ברית ונמלט
    kjvRefs:
    - Ezekiel 17:15
    kjvOsis:
    - Ezek.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.16
    scripture: tanakh
    name: Tanakh Ezekiel 17:16
    ref: Ezekiel 17:16
    book: Ezek
    section: neviim
    chapter: 17
    verse: 16
    ordinal: 13196
    text: As I live, saith the Lord GOD, surely in the place where the king dwelleth that made him king, whose oath he despised, and whose covenant he broke, even with him in the midst of Babylon he shall die.
    translation: JPS 1917
    original: חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־לֹא בִּמְקוֹם הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ אֲשֶׁר בָּזָה אֶת־אָלָתוֹ וַאֲשֶׁר הֵפֵר אֶת־בְּרִיתוֹ אִתּוֹ בְתוֹךְ־בָּבֶל יָמוּת׃
    hebrewPlain: חי אני נאם אדני יהוה אם לא במקום המלך הממליך אתו אשר בזה את אלתו ואשר הפר את בריתו אתו בתוך בבל ימות
    kjvRefs:
    - Ezekiel 17:16
    kjvOsis:
    - Ezek.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.17
    scripture: tanakh
    name: Tanakh Ezekiel 17:17
    ref: Ezekiel 17:17
    book: Ezek
    section: neviim
    chapter: 17
    verse: 17
    ordinal: 13197
    text: Neither shall Pharaoh with his mighty army and great company succour him in the war, when they cast up mounds and build forts, to cut off many souls;
    translation: JPS 1917
    original: וְלֹא בְחַיִל גָּדוֹל וּבְקָהָל רָב יַעֲשֶׂה אוֹתוֹ פַרְעֹה בַּמִּלְחָמָה בִּשְׁפֹּךְ סֹלְלָה וּבִבְנוֹת דָּיֵק לְהַכְרִית נְפָשׁוֹת רַבּוֹת׃
    hebrewPlain: ולא בחיל גדול ובקהל רב יעשה אותו פרעה במלחמה בשפך סללה ובבנות דיק להכרית נפשות רבות
    kjvRefs:
    - Ezekiel 17:17
    kjvOsis:
    - Ezek.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.18
    scripture: tanakh
    name: Tanakh Ezekiel 17:18
    ref: Ezekiel 17:18
    book: Ezek
    section: neviim
    chapter: 17
    verse: 18
    ordinal: 13198
    text: seeing he hath despised the oath by breaking the covenant, when, lo, he had given his hand, and hath done all these things, he shall not escape.
    translation: JPS 1917
    original: וּבָזָה אָלָה לְהָפֵר בְּרִית וְהִנֵּה נָתַן יָדוֹ וְכָל־אֵלֶּה עָשָׂה לֹא יִמָּלֵט׃
    hebrewPlain: ובזה אלה להפר ברית והנה נתן ידו וכל אלה עשה לא ימלט
    kjvRefs:
    - Ezekiel 17:18
    kjvOsis:
    - Ezek.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.19
    scripture: tanakh
    name: Tanakh Ezekiel 17:19
    ref: Ezekiel 17:19
    book: Ezek
    section: neviim
    chapter: 17
    verse: 19
    ordinal: 13199
    text: 'Therefore thus saith the Lord GOD: As I live, surely Mine oath that he hath despised, and My covenant that he hath broken, I will even bring it upon his own head.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה חַי־אָנִי אִם־לֹא אָלָתִי אֲשֶׁר בָּזָה וּבְרִיתִי אֲשֶׁר הֵפִיר וּנְתַתִּיו בְּרֹאשׁוֹ׃
    hebrewPlain: לכן כה אמר אדני יהוה חי אני אם לא אלתי אשר בזה ובריתי אשר הפיר ונתתיו בראשו
    kjvRefs:
    - Ezekiel 17:19
    kjvOsis:
    - Ezek.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.20
    scripture: tanakh
    name: Tanakh Ezekiel 17:20
    ref: Ezekiel 17:20
    book: Ezek
    section: neviim
    chapter: 17
    verse: 20
    ordinal: 13200
    text: And I will spread My net upon him, and he shall be taken in My snare, and I will bring him to Babylon, and will plead with him there for his treachery that he hath committed against Me.
    translation: JPS 1917
    original: וּפָרַשְׂתִּי עָלָיו רִשְׁתִּי וְנִתְפַּשׂ בִּמְצוּדָתִי וַהֲבִיאוֹתִיהוּ בָבֶלָה וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם מַעֲלוֹ אֲשֶׁר מָעַל־בִּי׃
    hebrewPlain: ופרשתי עליו רשתי ונתפש במצודתי והביאותיהו בבלה ונשפטתי אתו שם מעלו אשר מעל בי
    kjvRefs:
    - Ezekiel 17:20
    kjvOsis:
    - Ezek.17.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.21
    scripture: tanakh
    name: Tanakh Ezekiel 17:21
    ref: Ezekiel 17:21
    book: Ezek
    section: neviim
    chapter: 17
    verse: 21
    ordinal: 13201
    text: And all his mighty men in all his bands shall fall by the sword, and they that remain shall be scattered toward every wind; and ye shall know that I the LORD have spoken it.
    translation: JPS 1917
    original: וְאֵת כָּל־מברחו [מִבְרָחָיו] בְּכָל־אֲגַפָּיו בַּחֶרֶב יִפֹּלוּ וְהַנִּשְׁאָרִים לְכָל־רוּחַ יִפָּרֵשׂוּ וִידַעְתֶּם כִּי אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: ואת כל מברחו [מברחיו] בכל אגפיו בחרב יפלו והנשארים לכל רוח יפרשו וידעתם כי אני יהוה דברתי
    kjvRefs:
    - Ezekiel 17:21
    kjvOsis:
    - Ezek.17.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.22
    scripture: tanakh
    name: Tanakh Ezekiel 17:22
    ref: Ezekiel 17:22
    book: Ezek
    section: neviim
    chapter: 17
    verse: 22
    ordinal: 13202
    text: 'Thus saith the Lord GOD: Moreover I will take, even I, of the lofty top of the cedar, and will set it; I will crop off from the topmost of its young twigs a tender one, and I will plant it upon a high mountain and eminent;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה וְלָקַחְתִּי אָנִי מִצַּמֶּרֶת הָאֶרֶז הָרָמָה וְנָתָתִּי מֵרֹאשׁ יֹנְקוֹתָיו רַךְ אֶקְטֹף וְשָׁתַלְתִּי אָנִי עַל הַר־גָּבֹהַ וְתָלוּל׃
    hebrewPlain: כה אמר אדני יהוה ולקחתי אני מצמרת הארז הרמה ונתתי מראש ינקותיו רך אקטף ושתלתי אני על הר גבה ותלול
    kjvRefs:
    - Ezekiel 17:22
    kjvOsis:
    - Ezek.17.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.23
    scripture: tanakh
    name: Tanakh Ezekiel 17:23
    ref: Ezekiel 17:23
    book: Ezek
    section: neviim
    chapter: 17
    verse: 23
    ordinal: 13203
    text: in the mountain of the height of Israel will I plant it; and it shall bring forth boughs, and bear fruit, and be a stately cedar; and under it shall dwell all fowl of every wing, in the shadow of the branches thereof shall they dwell.
    translation: JPS 1917
    original: בְּהַר מְרוֹם יִשְׂרָאֵל אֶשְׁתֳּלֶנּוּ וְנָשָׂא עָנָף וְעָשָׂה פֶרִי וְהָיָה לְאֶרֶז אַדִּיר וְשָׁכְנוּ תַחְתָּיו כֹּל צִפּוֹר כָּל־כָּנָף בְּצֵל דָּלִיּוֹתָיו תִּשְׁכֹּנָּה׃
    hebrewPlain: בהר מרום ישראל אשתלנו ונשא ענף ועשה פרי והיה לארז אדיר ושכנו תחתיו כל צפור כל כנף בצל דליותיו תשכנה
    kjvRefs:
    - Ezekiel 17:23
    kjvOsis:
    - Ezek.17.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.17
- type: TanakhVerse
  data:
    osis: Ezek.17.24
    scripture: tanakh
    name: Tanakh Ezekiel 17:24
    ref: Ezekiel 17:24
    book: Ezek
    section: neviim
    chapter: 17
    verse: 24
    ordinal: 13204
    text: And all the trees of the field shall know that I the LORD have brought down the high tree, have exalted the low tree, have dried up the green tree, and have made the dry tree to flourish; I the LORD have spoken and have done it.’
    translation: JPS 1917
    original: וְיָדְעוּ כָּל־עֲצֵי הַשָּׂדֶה כִּי אֲנִי יְהוָה הִשְׁפַּלְתִּי עֵץ גָּבֹהַ הִגְבַּהְתִּי עֵץ שָׁפָל הוֹבַשְׁתִּי עֵץ לָח וְהִפְרַחְתִּי עֵץ יָבֵשׁ אֲנִי יְהוָה דִּבַּרְתִּי וְעָשִׂיתִי׃
    hebrewPlain: וידעו כל עצי השדה כי אני יהוה השפלתי עץ גבה הגבהתי עץ שפל הובשתי עץ לח והפרחתי עץ יבש אני יהוה דברתי ועשיתי
    kjvRefs:
    - Ezekiel 17:24
    kjvOsis:
    - Ezek.17.24
