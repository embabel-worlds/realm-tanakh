    translation: JPS 1917
    original: לָכֵן אֱמֹר אֲלֵיהֶם כֹּה אָמַר אֲדֹנָי יְהוִה לֹא־תִמָּשֵׁךְ עוֹד כָּל־דְּבָרָי אֲשֶׁר אֲדַבֵּר דָּבָר וְיֵעָשֶׂה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: לכן אמר אליהם כה אמר אדני יהוה לא תמשך עוד כל דברי אשר אדבר דבר ויעשה נאם אדני יהוה
