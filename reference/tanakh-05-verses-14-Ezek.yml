    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.2
    scripture: tanakh
    name: Tanakh Ezekiel 14:2
    ref: Ezekiel 14:2
    book: Ezek
    section: neviim
    chapter: 14
    verse: 2
    ordinal: 13088
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 14:2
    kjvOsis:
    - Ezek.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.3
    scripture: tanakh
    name: Tanakh Ezekiel 14:3
    ref: Ezekiel 14:3
    book: Ezek
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 13089
    text: ’Son of man, these men have set up their idols in their mind, and put the stumblingblock of their iniquity before their face; should I be inquired of at all by them?
    translation: JPS 1917
    original: בֶּן־אָדָם הָאֲנָשִׁים הָאֵלֶּה הֶעֱלוּ גִלּוּלֵיהֶם עַל־לִבָּם וּמִכְשׁוֹל עֲוֺנָם נָתְנוּ נֹכַח פְּנֵיהֶם הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם׃
    hebrewPlain: בן אדם האנשים האלה העלו גלוליהם על לבם ומכשול עונם נתנו נכח פניהם האדרש אדרש להם
    kjvRefs:
    - Ezekiel 14:3
    kjvOsis:
    - Ezek.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.4
    scripture: tanakh
    name: Tanakh Ezekiel 14:4
    ref: Ezekiel 14:4
    book: Ezek
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 13090
    text: 'Therefore speak unto them, and say unto them: Thus saith the Lord GOD: Every man of the house of Israel that setteth up his idols in his mind, and putteth the stumblingblock of his iniquity before his face, and cometh to the prophet—I the LORD will answer him that cometh according to the multitude of his idols;'
    translation: JPS 1917
    original: לָכֵן דַּבֵּר־אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל אֲשֶׁר יַעֲלֶה אֶת־גִּלּוּלָיו אֶל־לִבּוֹ וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו וּבָא אֶל־הַנָּבִיא אֲנִי יְהוָה נַעֲנֵיתִי לוֹ בה [בָא] בְּרֹב גִּלּוּלָיו׃
    hebrewPlain: לכן דבר אותם ואמרת אליהם כה אמר אדני יהוה איש איש מבית ישראל אשר יעלה את גלוליו אל לבו ומכשול עונו ישים נכח פניו ובא אל הנביא אני יהוה נעניתי לו בה [בא] ברב גלוליו
    kjvRefs:
    - Ezekiel 14:4
    kjvOsis:
    - Ezek.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.5
    scripture: tanakh
    name: Tanakh Ezekiel 14:5
    ref: Ezekiel 14:5
    book: Ezek
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 13091
    text: that I may take the house of Israel in their own heart, because they are all turned away from Me through their idols.
    translation: JPS 1917
    original: לְמַעַן תְּפֹשׂ אֶת־בֵּית־יִשְׂרָאֵל בְּלִבָּם אֲשֶׁר נָזֹרוּ מֵעָלַי בְּגִלּוּלֵיהֶם כֻּלָּם׃
    hebrewPlain: למען תפש את בית ישראל בלבם אשר נזרו מעלי בגלוליהם כלם
    kjvRefs:
    - Ezekiel 14:5
    kjvOsis:
    - Ezek.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.6
    scripture: tanakh
    name: Tanakh Ezekiel 14:6
    ref: Ezekiel 14:6
    book: Ezek
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 13092
    text: 'Therefore say unto the house of Israel: Thus saith the Lord GOD: Return ye, and turn yourselves from your idols; and turn away your faces from all your abominations.'
    translation: JPS 1917
    original: לָכֵן אֱמֹר אֶל־בֵּית יִשְׂרָאֵל כֹּה אָמַר אֲדֹנָי יְהוִה שׁוּבוּ וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם וּמֵעַל כָּל־תּוֹעֲבֹתֵיכֶם הָשִׁיבוּ פְנֵיכֶם׃
    hebrewPlain: לכן אמר אל בית ישראל כה אמר אדני יהוה שובו והשיבו מעל גלוליכם ומעל כל תועבתיכם השיבו פניכם
    kjvRefs:
    - Ezekiel 14:6
    kjvOsis:
    - Ezek.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.7
    scripture: tanakh
    name: Tanakh Ezekiel 14:7
    ref: Ezekiel 14:7
    book: Ezek
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 13093
    text: For every one of the house of Israel, or of the strangers that sojourn in Israel, that separateth himself from Me, and taketh his idols into his heart, and putteth the stumblingblock of his iniquity before his face, and cometh to the prophet, that he inquire for him of Me—I the LORD will answer him by Myself,
    translation: JPS 1917
    original: כִּי אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמֵהַגֵּר אֲשֶׁר־יָגוּר בְּיִשְׂרָאֵל וְיִנָּזֵר מֵאַחֲרַי וְיַעַל גִּלּוּלָיו אֶל־לִבּוֹ וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו וּבָא אֶל־הַנָּבִיא לִדְרָשׁ־לוֹ בִי אֲנִי יְהוָה נַעֲנֶה־לּוֹ בִּי׃
    hebrewPlain: כי איש איש מבית ישראל ומהגר אשר יגור בישראל וינזר מאחרי ויעל גלוליו אל לבו ומכשול עונו ישים נכח פניו ובא אל הנביא לדרש לו בי אני יהוה נענה לו בי
    kjvRefs:
    - Ezekiel 14:7
    kjvOsis:
    - Ezek.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.8
    scripture: tanakh
    name: Tanakh Ezekiel 14:8
    ref: Ezekiel 14:8
    book: Ezek
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 13094
    text: and I will set My face against that man, and will make him a sign and a proverb, and I will cut him off from the midst of My people; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא וַהֲשִׂמֹתִיהוּ לְאוֹת וְלִמְשָׁלִים וְהִכְרַתִּיו מִתּוֹךְ עַמִּי וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונתתי פני באיש ההוא והשמתיהו לאות ולמשלים והכרתיו מתוך עמי וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 14:8
    kjvOsis:
    - Ezek.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.9
    scripture: tanakh
    name: Tanakh Ezekiel 14:9
    ref: Ezekiel 14:9
    book: Ezek
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 13095
    text: And when the prophet is enticed and speaketh a word, I the LORD have enticed that prophet, and I will stretch out My hand upon him, and will destroy him from the midst of My people Israel.
    translation: JPS 1917
    original: וְהַנָּבִיא כִי־יְפֻתֶּה וְדִבֶּר דָּבָר אֲנִי יְהוָה פִּתֵּיתִי אֵת הַנָּבִיא הַהוּא וְנָטִיתִי אֶת־יָדִי עָלָיו וְהִשְׁמַדְתִּיו מִתּוֹךְ עַמִּי יִשְׂרָאֵל׃
    hebrewPlain: והנביא כי יפתה ודבר דבר אני יהוה פתיתי את הנביא ההוא ונטיתי את ידי עליו והשמדתיו מתוך עמי ישראל
    kjvRefs:
    - Ezekiel 14:9
    kjvOsis:
    - Ezek.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.10
    scripture: tanakh
    name: Tanakh Ezekiel 14:10
    ref: Ezekiel 14:10
    book: Ezek
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 13096
    text: And they shall bear their iniquity; the iniquity of the prophet shall be even as the iniquity of him that inquireth;
    translation: JPS 1917
    original: וְנָשְׂאוּ עֲוֺנָם כַּעֲוֺן הַדֹּרֵשׁ כַּעֲוֺן הַנָּבִיא יִהְיֶה׃
    hebrewPlain: ונשאו עונם כעון הדרש כעון הנביא יהיה
    kjvRefs:
    - Ezekiel 14:10
    kjvOsis:
    - Ezek.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.11
    scripture: tanakh
    name: Tanakh Ezekiel 14:11
    ref: Ezekiel 14:11
    book: Ezek
    section: neviim
    chapter: 14
    verse: 11
    ordinal: 13097
    text: that the house of Israel may go no more astray from Me, neither defile themselves any more with all their transgressions; but that they may be My people, and I may be their God, saith the Lord GOD.’
    translation: JPS 1917
    original: לְמַעַן לֹא־יִתְעוּ עוֹד בֵּית־יִשְׂרָאֵל מֵאַחֲרַי וְלֹא־יִטַּמְּאוּ עוֹד בְּכָל־פִּשְׁעֵיהֶם וְהָיוּ לִי לְעָם וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: למען לא יתעו עוד בית ישראל מאחרי ולא יטמאו עוד בכל פשעיהם והיו לי לעם ואני אהיה להם לאלהים נאם אדני יהוה
    kjvRefs:
    - Ezekiel 14:11
    kjvOsis:
    - Ezek.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.14
- type: TanakhVerse
  data:
    osis: Ezek.14.12
    scripture: tanakh
    name: Tanakh Ezekiel 14:12
    ref: Ezekiel 14:12
    book: Ezek
    section: neviim
    chapter: 14
    verse: 12
    ordinal: 13098
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
