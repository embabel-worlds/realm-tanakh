- type: TanakhVerse
  data:
    osis: Ezek.33.2
    scripture: tanakh
    name: Tanakh Ezekiel 33:2
    ref: Ezekiel 33:2
    book: Ezek
    section: neviim
    chapter: 33
    verse: 2
    ordinal: 13637
    text: '’Son of man, speak to the children of thy people, and say unto them: When I bring the sword upon a land, if the people of the land take a man from among them, and set him for their watchman;'
    translation: JPS 1917
    original: בֶּן־אָדָם דַּבֵּר אֶל־בְּנֵי־עַמְּךָ וְאָמַרְתָּ אֲלֵיהֶם אֶרֶץ כִּי־אָבִיא עָלֶיהָ חָרֶב וְלָקְחוּ עַם־הָאָרֶץ אִישׁ אֶחָד מִקְצֵיהֶם וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה׃
    hebrewPlain: בן אדם דבר אל בני עמך ואמרת אליהם ארץ כי אביא עליה חרב ולקחו עם הארץ איש אחד מקציהם ונתנו אתו להם לצפה
    kjvRefs:
    - Ezekiel 33:2
    kjvOsis:
    - Ezek.33.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.3
    scripture: tanakh
    name: Tanakh Ezekiel 33:3
    ref: Ezekiel 33:3
    book: Ezek
    section: neviim
    chapter: 33
    verse: 3
    ordinal: 13638
    text: if, when he seeth the sword come upon the land, he blow the horn, and warn the people;
    translation: JPS 1917
    original: וְרָאָה אֶת־הַחֶרֶב בָּאָה עַל־הָאָרֶץ וְתָקַע בַּשּׁוֹפָר וְהִזְהִיר אֶת־הָעָם׃
    hebrewPlain: וראה את החרב באה על הארץ ותקע בשופר והזהיר את העם
    kjvRefs:
    - Ezekiel 33:3
    kjvOsis:
    - Ezek.33.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.4
    scripture: tanakh
    name: Tanakh Ezekiel 33:4
    ref: Ezekiel 33:4
    book: Ezek
    section: neviim
    chapter: 33
    verse: 4
    ordinal: 13639
    text: then whosoever heareth the sound of the horn, and taketh not warning, if the sword come, and take him away, his blood shall be upon his own head;
    translation: JPS 1917
    original: וְשָׁמַע הַשֹּׁמֵעַ אֶת־קוֹל הַשּׁוֹפָר וְלֹא נִזְהָר וַתָּבוֹא חֶרֶב וַתִּקָּחֵהוּ דָּמוֹ בְרֹאשׁוֹ יִהְיֶה׃
    hebrewPlain: ושמע השמע את קול השופר ולא נזהר ותבוא חרב ותקחהו דמו בראשו יהיה
    kjvRefs:
    - Ezekiel 33:4
    kjvOsis:
    - Ezek.33.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.5
    scripture: tanakh
    name: Tanakh Ezekiel 33:5
    ref: Ezekiel 33:5
    book: Ezek
    section: neviim
    chapter: 33
    verse: 5
    ordinal: 13640
    text: he heard the sound of the horn, and took not warning, his blood shall be upon him; whereas if he had taken warning, he would have delivered his soul.
    translation: JPS 1917
    original: אֵת קוֹל הַשּׁוֹפָר שָׁמַע וְלֹא נִזְהָר דָּמוֹ בּוֹ יִהְיֶה וְהוּא נִזְהָר נַפְשׁוֹ מִלֵּט׃
    hebrewPlain: את קול השופר שמע ולא נזהר דמו בו יהיה והוא נזהר נפשו מלט
    kjvRefs:
    - Ezekiel 33:5
    kjvOsis:
    - Ezek.33.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.6
    scripture: tanakh
    name: Tanakh Ezekiel 33:6
    ref: Ezekiel 33:6
    book: Ezek
    section: neviim
    chapter: 33
    verse: 6
    ordinal: 13641
    text: But if the watchman see the sword come, and blow not the horn, and the people be not warned, and the sword do come, and take any person from among them, he is taken away in his iniquity, but his blood will I require at the watchman’s hand.
    translation: JPS 1917
    original: וְהַצֹּפֶה כִּי־יִרְאֶה אֶת־הַחֶרֶב בָּאָה וְלֹא־תָקַע בַּשּׁוֹפָר וְהָעָם לֹא־נִזְהָר וַתָּבוֹא חֶרֶב וַתִּקַּח מֵהֶם נָפֶשׁ הוּא בַּעֲוֺנוֹ נִלְקָח וְדָמוֹ מִיַּד־הַצֹּפֶה אֶדְרֹשׁ׃
    hebrewPlain: והצפה כי יראה את החרב באה ולא תקע בשופר והעם לא נזהר ותבוא חרב ותקח מהם נפש הוא בעונו נלקח ודמו מיד הצפה אדרש
    kjvRefs:
    - Ezekiel 33:6
    kjvOsis:
    - Ezek.33.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.7
    scripture: tanakh
    name: Tanakh Ezekiel 33:7
    ref: Ezekiel 33:7
    book: Ezek
    section: neviim
    chapter: 33
    verse: 7
    ordinal: 13642
    text: So thou, son of man, I have set thee a watchman unto the house of Israel; therefore, when thou shalt hear the word at My mouth, warn them from Me.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם צֹפֶה נְתַתִּיךָ לְבֵית יִשְׂרָאֵל וְשָׁמַעְתָּ מִפִּי דָּבָר וְהִזְהַרְתָּ אֹתָם מִמֶּנִּי׃
    hebrewPlain: ואתה בן אדם צפה נתתיך לבית ישראל ושמעת מפי דבר והזהרת אתם ממני
    kjvRefs:
    - Ezekiel 33:7
    kjvOsis:
    - Ezek.33.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.8
    scripture: tanakh
    name: Tanakh Ezekiel 33:8
    ref: Ezekiel 33:8
    book: Ezek
    section: neviim
    chapter: 33
    verse: 8
    ordinal: 13643
    text: 'When I say unto the wicked: O wicked man, thou shalt surely die, and thou dost not speak to warn the wicked from his way; that wicked man shall die in his iniquity, but his blood will I require at thy hand.'
    translation: JPS 1917
    original: בְּאָמְרִי לָרָשָׁע רָשָׁע מוֹת תָּמוּת וְלֹא דִבַּרְתָּ לְהַזְהִיר רָשָׁע מִדַּרְכּוֹ הוּא רָשָׁע בַּעֲוֺנוֹ יָמוּת וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ׃
    hebrewPlain: באמרי לרשע רשע מות תמות ולא דברת להזהיר רשע מדרכו הוא רשע בעונו ימות ודמו מידך אבקש
    kjvRefs:
    - Ezekiel 33:8
    kjvOsis:
    - Ezek.33.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.9
    scripture: tanakh
    name: Tanakh Ezekiel 33:9
    ref: Ezekiel 33:9
    book: Ezek
    section: neviim
    chapter: 33
    verse: 9
    ordinal: 13644
    text: Nevertheless, if thou warn the wicked of his way to turn from it, and he turn not from his way; he shall die in his iniquity, but thou hast delivered thy soul.
    translation: JPS 1917
    original: וְאַתָּה כִּי־הִזְהַרְתָּ רָשָׁע מִדַּרְכּוֹ לָשׁוּב מִמֶּנָּה וְלֹא־שָׁב מִדַּרְכּוֹ הוּא בַּעֲוֺנוֹ יָמוּת וְאַתָּה נַפְשְׁךָ הִצַּלְתָּ׃
    hebrewPlain: ואתה כי הזהרת רשע מדרכו לשוב ממנה ולא שב מדרכו הוא בעונו ימות ואתה נפשך הצלת
    kjvRefs:
    - Ezekiel 33:9
    kjvOsis:
    - Ezek.33.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.10
    scripture: tanakh
    name: Tanakh Ezekiel 33:10
    ref: Ezekiel 33:10
    book: Ezek
    section: neviim
    chapter: 33
    verse: 10
    ordinal: 13645
    text: 'Therefore, O thou son of man, say unto the house of Israel: Thus ye speak, saying: Our transgressions and our sins are upon us, and we pine away in them; how then can we live?'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם אֱמֹר אֶל־בֵּית יִשְׂרָאֵל כֵּן אֲמַרְתֶּם לֵאמֹר כִּי־פְשָׁעֵינוּ וְחַטֹּאתֵינוּ עָלֵינוּ וּבָם אֲנַחְנוּ נְמַקִּים וְאֵיךְ נִחְיֶה׃
    hebrewPlain: ואתה בן אדם אמר אל בית ישראל כן אמרתם לאמר כי פשעינו וחטאתינו עלינו ובם אנחנו נמקים ואיך נחיה
    kjvRefs:
    - Ezekiel 33:10
    kjvOsis:
    - Ezek.33.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.11
    scripture: tanakh
    name: Tanakh Ezekiel 33:11
    ref: Ezekiel 33:11
    book: Ezek
    section: neviim
    chapter: 33
    verse: 11
    ordinal: 13646
    text: 'Say unto them: As I live, saith the Lord GOD, I have no pleasure in the death of the wicked, but that the wicked turn from his way and live; turn ye, turn ye from your evil ways; for why will ye die, O house of Israel?'
    translation: JPS 1917
    original: אֱמֹר אֲלֵיהֶם חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־אֶחְפֹּץ בְּמוֹת הָרָשָׁע כִּי אִם־בְּשׁוּב רָשָׁע מִדַּרְכּוֹ וְחָיָה שׁוּבוּ שׁוּבוּ מִדַּרְכֵיכֶם הָרָעִים וְלָמָּה תָמוּתוּ בֵּית יִשְׂרָאֵל׃
    hebrewPlain: אמר אליהם חי אני נאם אדני יהוה אם אחפץ במות הרשע כי אם בשוב רשע מדרכו וחיה שובו שובו מדרכיכם הרעים ולמה תמותו בית ישראל
    kjvRefs:
    - Ezekiel 33:11
    kjvOsis:
    - Ezek.33.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.12
    scripture: tanakh
    name: Tanakh Ezekiel 33:12
    ref: Ezekiel 33:12
    book: Ezek
    section: neviim
    chapter: 33
    verse: 12
    ordinal: 13647
    text: 'And thou, son of man, say unto the children of thy people: The righteousness of the righteous shall not deliver him in the day of his transgression; and as for the wickedness of the wicked, he shall not stumble thereby in the day that he turneth from his wickedness; neither shall he that is righteous be able to live thereby in the day that he sinneth.'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם אֱמֹר אֶל־בְּנֵי־עַמְּךָ צִדְקַת הַצַּדִּיק לֹא תַצִּילֶנּוּ בְּיוֹם פִּשְׁעוֹ וְרִשְׁעַת הָרָשָׁע לֹא־יִכָּשֶׁל בָּהּ בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ וְצַדִּיק לֹא יוּכַל לִחְיוֹת בָּהּ בְּיוֹם חֲטֹאתוֹ׃
    hebrewPlain: ואתה בן אדם אמר אל בני עמך צדקת הצדיק לא תצילנו ביום פשעו ורשעת הרשע לא יכשל בה ביום שובו מרשעו וצדיק לא יוכל לחיות בה ביום חטאתו
    kjvRefs:
    - Ezekiel 33:12
    kjvOsis:
    - Ezek.33.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.13
    scripture: tanakh
    name: Tanakh Ezekiel 33:13
    ref: Ezekiel 33:13
    book: Ezek
    section: neviim
    chapter: 33
    verse: 13
    ordinal: 13648
    text: When I say to the righteous, that he shall surely live; if he trust to his righteousness, and commit iniquity, none of his righteous deeds shall be remembered; but for his iniquity that he hath committed, for it shall he die.
    translation: JPS 1917
    original: בְּאָמְרִי לַצַּדִּיק חָיֹה יִחְיֶה וְהוּא־בָטַח עַל־צִדְקָתוֹ וְעָשָׂה עָוֶל כָּל־צדקתו [צִדְקֹתָיו] לֹא תִזָּכַרְנָה וּבְעַוְלוֹ אֲשֶׁר־עָשָׂה בּוֹ יָמוּת׃
    hebrewPlain: באמרי לצדיק חיה יחיה והוא בטח על צדקתו ועשה עול כל צדקתו [צדקתיו] לא תזכרנה ובעולו אשר עשה בו ימות
    kjvRefs:
    - Ezekiel 33:13
    kjvOsis:
    - Ezek.33.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.14
    scripture: tanakh
    name: Tanakh Ezekiel 33:14
    ref: Ezekiel 33:14
    book: Ezek
    section: neviim
    chapter: 33
    verse: 14
    ordinal: 13649
    text: 'Again, when I say unto the wicked: Thou shalt surely die; if he turn from his sin, and do that which is lawful and right;'
    translation: JPS 1917
    original: וּבְאָמְרִי לָרָשָׁע מוֹת תָּמוּת וְשָׁב מֵחַטָּאתוֹ וְעָשָׂה מִשְׁפָּט וּצְדָקָה׃
    hebrewPlain: ובאמרי לרשע מות תמות ושב מחטאתו ועשה משפט וצדקה
    kjvRefs:
    - Ezekiel 33:14
    kjvOsis:
    - Ezek.33.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.15
    scripture: tanakh
    name: Tanakh Ezekiel 33:15
    ref: Ezekiel 33:15
    book: Ezek
    section: neviim
    chapter: 33
    verse: 15
    ordinal: 13650
    text: if the wicked restore the pledge, give back that which he had taken by robbery, walk in the statutes of life, committing no iniquity; he shall surely live, he shall not die.
    translation: JPS 1917
    original: חֲבֹל יָשִׁיב רָשָׁע גְּזֵלָה יְשַׁלֵּם בְּחֻקּוֹת הַחַיִּים הָלַךְ לְבִלְתִּי עֲשׂוֹת עָוֶל חָיוֹ יִחְיֶה לֹא יָמוּת׃
    hebrewPlain: חבל ישיב רשע גזלה ישלם בחקות החיים הלך לבלתי עשות עול חיו יחיה לא ימות
    kjvRefs:
    - Ezekiel 33:15
    kjvOsis:
    - Ezek.33.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.16
    scripture: tanakh
    name: Tanakh Ezekiel 33:16
    ref: Ezekiel 33:16
    book: Ezek
    section: neviim
    chapter: 33
    verse: 16
    ordinal: 13651
    text: None of his sins that he hath committed shall be remembered against him; he hath done that which is lawful and right; he shall surely live.
    translation: JPS 1917
    original: כָּל־חטאתו [חַטֹּאתָיו] אֲשֶׁר חָטָא לֹא תִזָּכַרְנָה לוֹ מִשְׁפָּט וּצְדָקָה עָשָׂה חָיוֹ יִחְיֶה׃
    hebrewPlain: כל חטאתו [חטאתיו] אשר חטא לא תזכרנה לו משפט וצדקה עשה חיו יחיה
    kjvRefs:
    - Ezekiel 33:16
    kjvOsis:
    - Ezek.33.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.17
    scripture: tanakh
    name: Tanakh Ezekiel 33:17
    ref: Ezekiel 33:17
    book: Ezek
    section: neviim
    chapter: 33
    verse: 17
    ordinal: 13652
    text: 'Yet the children of thy people say: The way of the Lord is not equal; but as for them, their way is not equal.'
    translation: JPS 1917
    original: וְאָמְרוּ בְּנֵי עַמְּךָ לֹא יִתָּכֵן דֶּרֶךְ אֲדֹנָי וְהֵמָּה דַּרְכָּם לֹא־יִתָּכֵן׃
    hebrewPlain: ואמרו בני עמך לא יתכן דרך אדני והמה דרכם לא יתכן
    kjvRefs:
    - Ezekiel 33:17
    kjvOsis:
    - Ezek.33.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.18
    scripture: tanakh
    name: Tanakh Ezekiel 33:18
    ref: Ezekiel 33:18
    book: Ezek
    section: neviim
    chapter: 33
    verse: 18
    ordinal: 13653
    text: When the righteous turneth from his righteousness, and committeth iniquity, he shall even die thereby.
    translation: JPS 1917
    original: בְּשׁוּב־צַדִּיק מִצִּדְקָתוֹ וְעָשָׂה עָוֶל וּמֵת בָּהֶם׃
    hebrewPlain: בשוב צדיק מצדקתו ועשה עול ומת בהם
    kjvRefs:
    - Ezekiel 33:18
    kjvOsis:
    - Ezek.33.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.19
    scripture: tanakh
    name: Tanakh Ezekiel 33:19
    ref: Ezekiel 33:19
    book: Ezek
    section: neviim
    chapter: 33
    verse: 19
    ordinal: 13654
    text: And when the wicked turneth from his wickedness, and doeth that which is lawful and right, he shall live thereby.
    translation: JPS 1917
    original: וּבְשׁוּב רָשָׁע מֵרִשְׁעָתוֹ וְעָשָׂה מִשְׁפָּט וּצְדָקָה עֲלֵיהֶם הוּא יִחְיֶה׃
    hebrewPlain: ובשוב רשע מרשעתו ועשה משפט וצדקה עליהם הוא יחיה
    kjvRefs:
    - Ezekiel 33:19
    kjvOsis:
    - Ezek.33.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.20
    scripture: tanakh
    name: Tanakh Ezekiel 33:20
    ref: Ezekiel 33:20
    book: Ezek
    section: neviim
    chapter: 33
    verse: 20
    ordinal: 13655
    text: 'Yet ye say: The way of the Lord is not equal. O house of Israel, I will judge you every one after his ways.’'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם לֹא יִתָּכֵן דֶּרֶךְ אֲדֹנָי אִישׁ כִּדְרָכָיו אֶשְׁפּוֹט אֶתְכֶם בֵּית יִשְׂרָאֵל
    hebrewPlain: ואמרתם לא יתכן דרך אדני איש כדרכיו אשפוט אתכם בית ישראל
    kjvRefs:
    - Ezekiel 33:20
    kjvOsis:
    - Ezek.33.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.21
    scripture: tanakh
    name: Tanakh Ezekiel 33:21
    ref: Ezekiel 33:21
    book: Ezek
    section: neviim
    chapter: 33
    verse: 21
    ordinal: 13656
    text: 'And it came to pass in the twelfth year of our captivity, in the tenth month, in the fifth day of the month, that one that had escaped out of Jerusalem came unto me, saying: ‘The city is smitten.’'
    translation: JPS 1917
    original: וַיְהִי בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה בָּעֲשִׂרִי בַּחֲמִשָּׁה לַחֹדֶשׁ לְגָלוּתֵנוּ בָּא־אֵלַי הַפָּלִיט מִירוּשָׁלִַם לֵאמֹר הֻכְּתָה הָעִיר׃
    hebrewPlain: ויהי בשתי עשרה שנה בעשרי בחמשה לחדש לגלותנו בא אלי הפליט מירושלם לאמר הכתה העיר
    kjvRefs:
    - Ezekiel 33:21
    kjvOsis:
    - Ezek.33.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.22
    scripture: tanakh
    name: Tanakh Ezekiel 33:22
    ref: Ezekiel 33:22
    book: Ezek
    section: neviim
    chapter: 33
    verse: 22
    ordinal: 13657
    text: Now the hand of the LORD had been upon me in the evening, before he that was escaped came; and He had opened my mouth against his coming to me in the morning; and my mouth was opened, and I was no more dumb.
    translation: JPS 1917
    original: וְיַד־יְהוָה הָיְתָה אֵלַי בָּעֶרֶב לִפְנֵי בּוֹא הַפָּלִיט וַיִּפְתַּח אֶת־פִּי עַד־בּוֹא אֵלַי בַּבֹּקֶר וַיִּפָּתַח פִּי וְלֹא נֶאֱלַמְתִּי עוֹד׃
    hebrewPlain: ויד יהוה היתה אלי בערב לפני בוא הפליט ויפתח את פי עד בוא אלי בבקר ויפתח פי ולא נאלמתי עוד
    kjvRefs:
    - Ezekiel 33:22
    kjvOsis:
    - Ezek.33.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.23
    scripture: tanakh
    name: Tanakh Ezekiel 33:23
    ref: Ezekiel 33:23
    book: Ezek
    section: neviim
    chapter: 33
    verse: 23
    ordinal: 13658
    text: 'Then the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהֹוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 33:23
    kjvOsis:
    - Ezek.33.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.24
    scripture: tanakh
    name: Tanakh Ezekiel 33:24
    ref: Ezekiel 33:24
    book: Ezek
    section: neviim
    chapter: 33
    verse: 24
    ordinal: 13659
    text: '’Son of man, they that inhabit those waste places in the land of Israel speak, saying: Abraham was one, and he inherited the land; but we are many; the land is given us for inheritance.'
    translation: JPS 1917
    original: בֶּן־אָדָם יֹשְׁבֵי הֶחֳרָבוֹת הָאֵלֶּה עַל־אַדְמַת יִשְׂרָאֵל אֹמְרִים לֵאמֹר אֶחָד הָיָה אַבְרָהָם וַיִּירַשׁ אֶת־הָאָרֶץ וַאֲנַחְנוּ רַבִּים לָנוּ נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה׃
    hebrewPlain: בן אדם ישבי החרבות האלה על אדמת ישראל אמרים לאמר אחד היה אברהם ויירש את הארץ ואנחנו רבים לנו נתנה הארץ למורשה
    kjvRefs:
    - Ezekiel 33:24
    kjvOsis:
    - Ezek.33.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.25
    scripture: tanakh
    name: Tanakh Ezekiel 33:25
    ref: Ezekiel 33:25
    book: Ezek
    section: neviim
    chapter: 33
    verse: 25
    ordinal: 13660
    text: 'Wherefore say unto them: Thus saith the Lord GOD. Ye eat with the blood, and lift up your eyes unto your idols, and shed blood; and shall ye possess the land?'
    translation: JPS 1917
    original: לָכֵן אֱמֹר אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהֹוִה עַל־הַדָּם תֹּאכֵלוּ וְעֵינֵכֶם תִּשְׂאוּ אֶל־גִּלּוּלֵיכֶם וְדָם תִּשְׁפֹּכוּ וְהָאָרֶץ תִּירָשׁוּ׃
    hebrewPlain: לכן אמר אליהם כה אמר אדני יהוה על הדם תאכלו ועינכם תשאו אל גלוליכם ודם תשפכו והארץ תירשו
    kjvRefs:
    - Ezekiel 33:25
    kjvOsis:
    - Ezek.33.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.26
    scripture: tanakh
    name: Tanakh Ezekiel 33:26
    ref: Ezekiel 33:26
    book: Ezek
    section: neviim
    chapter: 33
    verse: 26
    ordinal: 13661
    text: Ye stand upon your sword, ye work abomination, and ye defile every one his neighbour’s wife; and shall ye possess the land?
    translation: JPS 1917
    original: עֲמַדְתֶּם עַל־חַרְבְּכֶם עֲשִׂיתֶן תּוֹעֵבָה וְאִישׁ אֶת־אֵשֶׁת רֵעֵהוּ טִמֵּאתֶם וְהָאָרֶץ תִּירָשׁוּ׃
    hebrewPlain: עמדתם על חרבכם עשיתן תועבה ואיש את אשת רעהו טמאתם והארץ תירשו
    kjvRefs:
    - Ezekiel 33:26
    kjvOsis:
    - Ezek.33.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.27
    scripture: tanakh
    name: Tanakh Ezekiel 33:27
    ref: Ezekiel 33:27
    book: Ezek
    section: neviim
    chapter: 33
    verse: 27
    ordinal: 13662
    text: 'Thus shalt thou say unto them: Thus saith the Lord GOD: As I live, surely they that are in the waste places shall fall by the sword, and him that is in the open field will I give to the beasts to be devoured, and they that are in the strongholds and in the caves shall die of the pestilence.'
    translation: JPS 1917
    original: כֹּה־תֹאמַר אֲלֵהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה חַי־אָנִי אִם־לֹא אֲשֶׁר בֶּחֳרָבוֹת בַּחֶרֶב יִפֹּלוּ וַאֲשֶׁר עַל־פְּנֵי הַשָּׂדֶה לַחַיָּה נְתַתִּיו לְאָכְלוֹ וַאֲשֶׁר בַּמְּצָדוֹת וּבַמְּעָרוֹת בַּדֶּבֶר יָמוּתוּ׃
    hebrewPlain: כה תאמר אלהם כה אמר אדני יהוה חי אני אם לא אשר בחרבות בחרב יפלו ואשר על פני השדה לחיה נתתיו לאכלו ואשר במצדות ובמערות בדבר ימותו
    kjvRefs:
    - Ezekiel 33:27
    kjvOsis:
    - Ezek.33.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.28
    scripture: tanakh
    name: Tanakh Ezekiel 33:28
    ref: Ezekiel 33:28
    book: Ezek
    section: neviim
    chapter: 33
    verse: 28
    ordinal: 13663
    text: And I will make the land most desolate, and the pride of her power shall cease; and the mountains of Israel shall be desolate, so that none shall pass through.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־הָאָרֶץ שְׁמָמָה וּמְשַׁמָּה וְנִשְׁבַּת גְּאוֹן עֻזָּהּ וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל מֵאֵין עוֹבֵר׃
    hebrewPlain: ונתתי את הארץ שממה ומשמה ונשבת גאון עזה ושממו הרי ישראל מאין עובר
    kjvRefs:
    - Ezekiel 33:28
    kjvOsis:
    - Ezek.33.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.29
    scripture: tanakh
    name: Tanakh Ezekiel 33:29
    ref: Ezekiel 33:29
    book: Ezek
    section: neviim
    chapter: 33
    verse: 29
    ordinal: 13664
    text: Then shall they know that I am the LORD, when I have made the land most desolate, because of all their abominations which they have committed.
    translation: JPS 1917
    original: וְיָדְעוּ כִּי־אֲנִי יְהוָה בְּתִתִּי אֶת־הָאָרֶץ שְׁמָמָה וּמְשַׁמָּה עַל כָּל־תּוֹעֲבֹתָם אֲשֶׁר עָשׂוּ׃
    hebrewPlain: וידעו כי אני יהוה בתתי את הארץ שממה ומשמה על כל תועבתם אשר עשו
    kjvRefs:
    - Ezekiel 33:29
    kjvOsis:
    - Ezek.33.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.30
    scripture: tanakh
    name: Tanakh Ezekiel 33:30
    ref: Ezekiel 33:30
    book: Ezek
    section: neviim
    chapter: 33
    verse: 30
    ordinal: 13665
    text: 'And as for thee, son of man, the children of thy people that talk of thee by the walls and in the doors of the houses, and speak one to another, every one to his brother, saying: Come, I pray you, and hear what is the word that cometh forth from the LORD;'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם בְּנֵי עַמְּךָ הַנִּדְבָּרִים בְּךָ אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים וְדִבֶּר־חַד אֶת־אַחַד אִישׁ אֶת־אָחִיו לֵאמֹר בֹּאוּ־נָא וְשִׁמְעוּ מָה הַדָּבָר הַיּוֹצֵא מֵאֵת יְהוָה׃
    hebrewPlain: ואתה בן אדם בני עמך הנדברים בך אצל הקירות ובפתחי הבתים ודבר חד את אחד איש את אחיו לאמר באו נא ושמעו מה הדבר היוצא מאת יהוה
    kjvRefs:
    - Ezekiel 33:30
    kjvOsis:
    - Ezek.33.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.31
    scripture: tanakh
    name: Tanakh Ezekiel 33:31
    ref: Ezekiel 33:31
    book: Ezek
    section: neviim
    chapter: 33
    verse: 31
    ordinal: 13666
    text: and come unto thee as the people cometh, and sit before thee as My people, and hear thy words, but do them not—for with their mouth they show much love, but their heart goeth after their covetousness;
    translation: JPS 1917
    original: וְיָבוֹאוּ אֵלֶיךָ כִּמְבוֹא־עָם וְיֵשְׁבוּ לְפָנֶיךָ עַמִּי וְשָׁמְעוּ אֶת־דְּבָרֶיךָ וְאוֹתָם לֹא יַעֲשׂוּ כִּי־עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים אַחֲרֵי בִצְעָם לִבָּם הֹלֵךְ׃
    hebrewPlain: ויבואו אליך כמבוא עם וישבו לפניך עמי ושמעו את דבריך ואותם לא יעשו כי עגבים בפיהם המה עשים אחרי בצעם לבם הלך
    kjvRefs:
    - Ezekiel 33:31
    kjvOsis:
    - Ezek.33.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.32
    scripture: tanakh
    name: Tanakh Ezekiel 33:32
    ref: Ezekiel 33:32
    book: Ezek
    section: neviim
    chapter: 33
    verse: 32
    ordinal: 13667
    text: and, lo, thou art unto them as a love song of one that hath a pleasant voice, and can play well on an instrument; so they hear thy words, but they do them not—
    translation: JPS 1917
    original: וְהִנְּךָ לָהֶם כְּשִׁיר עֲגָבִים יְפֵה קוֹל וּמֵטִב נַגֵּן וְשָׁמְעוּ אֶת־דְּבָרֶיךָ וְעֹשִׂים אֵינָם אוֹתָם׃
    hebrewPlain: והנך להם כשיר עגבים יפה קול ומטב נגן ושמעו את דבריך ועשים אינם אותם
    kjvRefs:
    - Ezekiel 33:32
    kjvOsis:
    - Ezek.33.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.33.33
    scripture: tanakh
    name: Tanakh Ezekiel 33:33
    ref: Ezekiel 33:33
    book: Ezek
    section: neviim
    chapter: 33
    verse: 33
    ordinal: 13668
    text: when this cometh to pass—behold, it cometh—then shall they know that a prophet hath been among them.’
    translation: JPS 1917
    original: וּבְבֹאָהּ הִנֵּה בָאָה וְיָדְעוּ כִּי נָבִיא הָיָה בְתוֹכָם׃
    hebrewPlain: ובבאה הנה באה וידעו כי נביא היה בתוכם
    kjvRefs:
    - Ezekiel 33:33
    kjvOsis:
    - Ezek.33.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.33
- type: TanakhVerse
  data:
    osis: Ezek.34.1
    scripture: tanakh
    name: Tanakh Ezekiel 34:1
    ref: Ezekiel 34:1
    book: Ezek
    section: neviim
    chapter: 34
    verse: 1
    ordinal: 13669
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 34:1
    kjvOsis:
    - Ezek.34.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.2
    scripture: tanakh
    name: Tanakh Ezekiel 34:2
    ref: Ezekiel 34:2
    book: Ezek
    section: neviim
    chapter: 34
    verse: 2
    ordinal: 13670
    text: '’Son of man, prophesy against the shepherds of Israel, prophesy, and say unto them, even to the shepherds: Thus saith the Lord GOD: Woe unto the shepherds of Israel that have fed themselves! should not the shepherds feed the sheep?'
    translation: JPS 1917
    original: בֶּן־אָדָם הִנָּבֵא עַל־רוֹעֵי יִשְׂרָאֵל הִנָּבֵא וְאָמַרְתָּ אֲלֵיהֶם לָרֹעִים כֹּה אָמַר אֲדֹנָי יְהוִה הוֹי רֹעֵי־יִשְׂרָאֵל אֲשֶׁר הָיוּ רֹעִים אוֹתָם הֲלוֹא הַצֹּאן יִרְעוּ הָרֹעִים׃
    hebrewPlain: בן אדם הנבא על רועי ישראל הנבא ואמרת אליהם לרעים כה אמר אדני יהוה הוי רעי ישראל אשר היו רעים אותם הלוא הצאן ירעו הרעים
    kjvRefs:
    - Ezekiel 34:2
    kjvOsis:
    - Ezek.34.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.3
    scripture: tanakh
    name: Tanakh Ezekiel 34:3
    ref: Ezekiel 34:3
    book: Ezek
    section: neviim
    chapter: 34
    verse: 3
    ordinal: 13671
    text: Ye did eat the fat, and ye clothed you with the wool, ye killed the fatlings; but ye fed not the sheep.
    translation: JPS 1917
    original: אֶת־הַחֵלֶב תֹּאכֵלוּ וְאֶת־הַצֶּמֶר תִּלְבָּשׁוּ הַבְּרִיאָה תִּזְבָּחוּ הַצֹּאן לֹא תִרְעוּ׃
    hebrewPlain: את החלב תאכלו ואת הצמר תלבשו הבריאה תזבחו הצאן לא תרעו
    kjvRefs:
    - Ezekiel 34:3
    kjvOsis:
    - Ezek.34.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.4
    scripture: tanakh
    name: Tanakh Ezekiel 34:4
    ref: Ezekiel 34:4
    book: Ezek
    section: neviim
    chapter: 34
    verse: 4
    ordinal: 13672
    text: The weak have ye not strengthened, neither have ye healed that which was sick, neither have ye bound up that which was broken, neither have ye brought back that which was driven away, neither have ye sought that which was lost; but with force have ye ruled over them and with rigour.
    translation: JPS 1917
    original: אֶת־הַנַּחְלוֹת לֹא חִזַּקְתֶּם וְאֶת־הַחוֹלָה לֹא־רִפֵּאתֶם וְלַנִּשְׁבֶּרֶת לֹא חֲבַשְׁתֶּם וְאֶת־הַנִּדַּחַת לֹא הֲשֵׁבֹתֶם וְאֶת־הָאֹבֶדֶת לֹא בִקַּשְׁתֶּם וּבְחָזְקָה רְדִיתֶם אֹתָם וּבְפָרֶךְ׃
    hebrewPlain: את הנחלות לא חזקתם ואת החולה לא רפאתם ולנשברת לא חבשתם ואת הנדחת לא השבתם ואת האבדת לא בקשתם ובחזקה רדיתם אתם ובפרך
    kjvRefs:
    - Ezekiel 34:4
    kjvOsis:
    - Ezek.34.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.5
    scripture: tanakh
    name: Tanakh Ezekiel 34:5
    ref: Ezekiel 34:5
    book: Ezek
    section: neviim
    chapter: 34
    verse: 5
    ordinal: 13673
    text: So were they scattered, because there was no shepherd; and they became food to all the beasts of the field, and were scattered.
    translation: JPS 1917
    original: וַתְּפוּצֶינָה מִבְּלִי רֹעֶה וַתִּהְיֶינָה לְאָכְלָה לְכָל־חַיַּת הַשָּׂדֶה וַתְּפוּצֶינָה׃
    hebrewPlain: ותפוצינה מבלי רעה ותהיינה לאכלה לכל חית השדה ותפוצינה
    kjvRefs:
    - Ezekiel 34:5
    kjvOsis:
    - Ezek.34.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.6
    scripture: tanakh
    name: Tanakh Ezekiel 34:6
    ref: Ezekiel 34:6
    book: Ezek
    section: neviim
    chapter: 34
    verse: 6
    ordinal: 13674
    text: My sheep wandered through all the mountains, and upon every high hill, yea, upon all the face of the earth were My sheep scattered, and there was none that did search or seek.
    translation: JPS 1917
    original: יִשְׁגּוּ צֹאנִי בְּכָל־הֶהָרִים וְעַל כָּל־גִּבְעָה רָמָה וְעַל כָּל־פְּנֵי הָאָרֶץ נָפֹצוּ צֹאנִי וְאֵין דּוֹרֵשׁ וְאֵין מְבַקֵּשׁ׃
    hebrewPlain: ישגו צאני בכל ההרים ועל כל גבעה רמה ועל כל פני הארץ נפצו צאני ואין דורש ואין מבקש
    kjvRefs:
    - Ezekiel 34:6
    kjvOsis:
    - Ezek.34.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.7
    scripture: tanakh
    name: Tanakh Ezekiel 34:7
    ref: Ezekiel 34:7
    book: Ezek
    section: neviim
    chapter: 34
    verse: 7
    ordinal: 13675
    text: 'Therefore, ye shepherds, hear the word of the LORD:'
    translation: JPS 1917
    original: לָכֵן רֹעִים שִׁמְעוּ אֶת־דְּבַר יְהוָה׃
    hebrewPlain: לכן רעים שמעו את דבר יהוה
    kjvRefs:
    - Ezekiel 34:7
    kjvOsis:
    - Ezek.34.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.8
    scripture: tanakh
    name: Tanakh Ezekiel 34:8
    ref: Ezekiel 34:8
    book: Ezek
    section: neviim
    chapter: 34
    verse: 8
    ordinal: 13676
    text: As I live, saith the Lord GOD, surely forasmuch as My sheep became a prey, and My sheep became food to all the beasts of the field, because there was no shepherd, neither did My shepherds search for My sheep, but the shepherds fed themselves, and fed not My sheep;
    translation: JPS 1917
    original: חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה אִם־לֹא יַעַן הֱיוֹת־צֹאנִי לָבַז וַתִּהְיֶינָה צֹאנִי לְאָכְלָה לְכָל־חַיַּת הַשָּׂדֶה מֵאֵין רֹעֶה וְלֹא־דָרְשׁוּ רֹעַי אֶת־צֹאנִי וַיִּרְעוּ הָרֹעִים אוֹתָם וְאֶת־צֹאנִי לֹא רָעוּ׃
    hebrewPlain: חי אני נאם אדני יהוה אם לא יען היות צאני לבז ותהיינה צאני לאכלה לכל חית השדה מאין רעה ולא דרשו רעי את צאני וירעו הרעים אותם ואת צאני לא רעו
    kjvRefs:
    - Ezekiel 34:8
    kjvOsis:
    - Ezek.34.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.9
    scripture: tanakh
    name: Tanakh Ezekiel 34:9
    ref: Ezekiel 34:9
    book: Ezek
    section: neviim
    chapter: 34
    verse: 9
    ordinal: 13677
    text: 'therefore, ye shepherds, hear the word of the LORD:'
    translation: JPS 1917
    original: לָכֵן הָרֹעִים שִׁמְעוּ דְּבַר־יְהוָה׃
    hebrewPlain: לכן הרעים שמעו דבר יהוה
    kjvRefs:
    - Ezekiel 34:9
    kjvOsis:
    - Ezek.34.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.10
    scripture: tanakh
    name: Tanakh Ezekiel 34:10
    ref: Ezekiel 34:10
    book: Ezek
    section: neviim
    chapter: 34
    verse: 10
    ordinal: 13678
    text: 'Thus saith the Lord GOD: Behold, I am against the shepherds; and I will require My sheep at their hand, and cause them to cease from feeding the sheep; neither shall the shepherds feed themselves any more; and I will deliver My sheep from their mouth, that they may not be food for them.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי אֶל־הָרֹעִים וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן וְלֹא־יִרְעוּ עוֹד הָרֹעִים אוֹתָם וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם וְלֹא־תִהְיֶיןָ לָהֶם לְאָכְלָה׃
    hebrewPlain: כה אמר אדני יהוה הנני אל הרעים ודרשתי את צאני מידם והשבתים מרעות צאן ולא ירעו עוד הרעים אותם והצלתי צאני מפיהם ולא תהיין להם לאכלה
    kjvRefs:
    - Ezekiel 34:10
    kjvOsis:
    - Ezek.34.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.11
    scripture: tanakh
    name: Tanakh Ezekiel 34:11
    ref: Ezekiel 34:11
    book: Ezek
    section: neviim
    chapter: 34
    verse: 11
    ordinal: 13679
    text: 'For thus saith the Lord GOD: Behold, here am I, and I will search for My sheep, and seek them out.'
    translation: JPS 1917
    original: כִּי כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי־אָנִי וְדָרַשְׁתִּי אֶת־צֹאנִי וּבִקַּרְתִּים׃
    hebrewPlain: כי כה אמר אדני יהוה הנני אני ודרשתי את צאני ובקרתים
    kjvRefs:
    - Ezekiel 34:11
    kjvOsis:
    - Ezek.34.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.12
    scripture: tanakh
    name: Tanakh Ezekiel 34:12
    ref: Ezekiel 34:12
    book: Ezek
    section: neviim
    chapter: 34
    verse: 12
    ordinal: 13680
    text: As a shepherd seeketh out his flock in the day that he is among his sheep that are separated, so will I seek out My sheep; and I will deliver them out of all places whither they have been scattered in the day of clouds and thick darkness.
    translation: JPS 1917
    original: כְּבַקָּרַת רֹעֶה עֶדְרוֹ בְּיוֹם־הֱיוֹתוֹ בְתוֹךְ־צֹאנוֹ נִפְרָשׁוֹת כֵּן אֲבַקֵּר אֶת־צֹאנִי וְהִצַּלְתִּי אֶתְהֶם מִכָּל־הַמְּקוֹמֹת אֲשֶׁר נָפֹצוּ שָׁם בְּיוֹם עָנָן וַעֲרָפֶל׃
    hebrewPlain: כבקרת רעה עדרו ביום היותו בתוך צאנו נפרשות כן אבקר את צאני והצלתי אתהם מכל המקומת אשר נפצו שם ביום ענן וערפל
    kjvRefs:
    - Ezekiel 34:12
    kjvOsis:
    - Ezek.34.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.13
    scripture: tanakh
    name: Tanakh Ezekiel 34:13
    ref: Ezekiel 34:13
    book: Ezek
    section: neviim
    chapter: 34
    verse: 13
    ordinal: 13681
    text: And I will bring them out from the peoples, and gather them from the countries, and will bring them into their own land; and I will feed them upon the mountains of Israel, by the streams, and in all the habitable places of the country.
    translation: JPS 1917
    original: וְהוֹצֵאתִים מִן־הָעַמִּים וְקִבַּצְתִּים מִן־הָאֲרָצוֹת וַהֲבִיאֹתִים אֶל־אַדְמָתָם וּרְעִיתִים אֶל־הָרֵי יִשְׂרָאֵל בָּאֲפִיקִים וּבְכֹל מוֹשְׁבֵי הָאָרֶץ׃
    hebrewPlain: והוצאתים מן העמים וקבצתים מן הארצות והביאתים אל אדמתם ורעיתים אל הרי ישראל באפיקים ובכל מושבי הארץ
    kjvRefs:
    - Ezekiel 34:13
    kjvOsis:
    - Ezek.34.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.14
    scripture: tanakh
    name: Tanakh Ezekiel 34:14
    ref: Ezekiel 34:14
    book: Ezek
    section: neviim
    chapter: 34
    verse: 14
    ordinal: 13682
    text: I will feed them in a good pasture, and upon the high mountains of Israel shall their fold be; there shall they lie down in a good fold, and in a fat pasture shall they feed upon the mountains of Israel.
    translation: JPS 1917
    original: בְּמִרְעֶה־טּוֹב אֶרְעֶה אֹתָם וּבְהָרֵי מְרוֹם־יִשְׂרָאֵל יִהְיֶה נְוֵהֶם שָׁם תִּרְבַּצְנָה בְּנָוֶה טּוֹב וּמִרְעֶה שָׁמֵן תִּרְעֶינָה אֶל־הָרֵי יִשְׂרָאֵל׃
    hebrewPlain: במרעה טוב ארעה אתם ובהרי מרום ישראל יהיה נוהם שם תרבצנה בנוה טוב ומרעה שמן תרעינה אל הרי ישראל
    kjvRefs:
    - Ezekiel 34:14
    kjvOsis:
    - Ezek.34.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.15
    scripture: tanakh
    name: Tanakh Ezekiel 34:15
    ref: Ezekiel 34:15
    book: Ezek
    section: neviim
    chapter: 34
    verse: 15
    ordinal: 13683
    text: I will feed My sheep, and I will cause them to lie down, saith the Lord GOD.
    translation: JPS 1917
    original: אֲנִי אֶרְעֶה צֹאנִי וַאֲנִי אַרְבִּיצֵם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: אני ארעה צאני ואני ארביצם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 34:15
    kjvOsis:
    - Ezek.34.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.16
    scripture: tanakh
    name: Tanakh Ezekiel 34:16
    ref: Ezekiel 34:16
    book: Ezek
    section: neviim
    chapter: 34
    verse: 16
    ordinal: 13684
    text: I will seek that which was lost, and will bring back that which was driven away, and will bind up that which was broken, and will strengthen that which was sick; and the fat and the strong I will destroy, I will feed them in justice.
    translation: JPS 1917
    original: אֶת־הָאֹבֶדֶת אֲבַקֵּשׁ וְאֶת־הַנִּדַּחַת אָשִׁיב וְלַנִּשְׁבֶּרֶת אֶחֱבֹשׁ וְאֶת־הַחוֹלָה אֲחַזֵּק וְאֶת־הַשְּׁמֵנָה וְאֶת־הַחֲזָקָה אַשְׁמִיד אֶרְעֶנָּה בְמִשְׁפָּט׃
    hebrewPlain: את האבדת אבקש ואת הנדחת אשיב ולנשברת אחבש ואת החולה אחזק ואת השמנה ואת החזקה אשמיד ארענה במשפט
    kjvRefs:
    - Ezekiel 34:16
    kjvOsis:
    - Ezek.34.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.17
    scripture: tanakh
    name: Tanakh Ezekiel 34:17
    ref: Ezekiel 34:17
    book: Ezek
    section: neviim
    chapter: 34
    verse: 17
    ordinal: 13685
    text: 'And as for you, O My flock, thus saith the Lord GOD: Behold, I judge between cattle and cattle, even the rams and the he-goats.'
    translation: JPS 1917
    original: וְאַתֵּנָה צֹאנִי כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי שֹׁפֵט בֵּין־שֶׂה לָשֶׂה לָאֵילִים וְלָעַתּוּדִים׃
    hebrewPlain: ואתנה צאני כה אמר אדני יהוה הנני שפט בין שה לשה לאילים ולעתודים
    kjvRefs:
    - Ezekiel 34:17
    kjvOsis:
    - Ezek.34.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.18
    scripture: tanakh
    name: Tanakh Ezekiel 34:18
    ref: Ezekiel 34:18
    book: Ezek
    section: neviim
    chapter: 34
    verse: 18
    ordinal: 13686
    text: Seemeth it a small thing unto you to have fed upon the good pasture, but ye must tread down with your feet the residue of your pasture? and to have drunk of the settled waters, but ye must foul the residue with your feet?
    translation: JPS 1917
    original: הַמְעַט מִכֶּם הַמִּרְעֶה הַטּוֹב תִּרְעוּ וְיֶתֶר מִרְעֵיכֶם תִּרְמְסוּ בְּרַגְלֵיכֶם וּמִשְׁקַע־מַיִם תִּשְׁתּוּ וְאֵת הַנּוֹתָרִים בְּרַגְלֵיכֶם תִּרְפֹּשׂוּן׃
    hebrewPlain: המעט מכם המרעה הטוב תרעו ויתר מרעיכם תרמסו ברגליכם ומשקע מים תשתו ואת הנותרים ברגליכם תרפשון
    kjvRefs:
    - Ezekiel 34:18
    kjvOsis:
    - Ezek.34.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.19
    scripture: tanakh
    name: Tanakh Ezekiel 34:19
    ref: Ezekiel 34:19
    book: Ezek
    section: neviim
    chapter: 34
    verse: 19
    ordinal: 13687
    text: And as for My sheep, they eat that which ye have trodden with your feet, and they drink that which ye have fouled with your feet.
    translation: JPS 1917
    original: וְצֹאנִי מִרְמַס רַגְלֵיכֶם תִּרְעֶינָה וּמִרְפַּשׂ רַגְלֵיכֶם תִּשְׁתֶּינָה׃
    hebrewPlain: וצאני מרמס רגליכם תרעינה ומרפש רגליכם תשתינה
    kjvRefs:
    - Ezekiel 34:19
    kjvOsis:
    - Ezek.34.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.20
    scripture: tanakh
    name: Tanakh Ezekiel 34:20
    ref: Ezekiel 34:20
    book: Ezek
    section: neviim
    chapter: 34
    verse: 20
    ordinal: 13688
    text: 'Therefore thus saith the Lord GOD unto them: Behold, I, even I, will judge between the fat cattle and the lean cattle.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה אֲלֵיהֶם הִנְנִי־אָנִי וְשָׁפַטְתִּי בֵּין־שֶׂה בִרְיָה וּבֵין שֶׂה רָזָה׃
    hebrewPlain: לכן כה אמר אדני יהוה אליהם הנני אני ושפטתי בין שה בריה ובין שה רזה
    kjvRefs:
    - Ezekiel 34:20
    kjvOsis:
    - Ezek.34.20
  relations:
