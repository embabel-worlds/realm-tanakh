    scripture: tanakh
    name: Tanakh Ezekiel 24:22
    ref: Ezekiel 24:22
    book: Ezek
    section: neviim
    chapter: 24
    verse: 22
    ordinal: 13433
    text: 'And ye shall do as I have done: ye shall not cover your upper lips, nor eat the bread of men;'
    translation: JPS 1917
    original: וַעֲשִׂיתֶם כַּאֲשֶׁר עָשִׂיתִי עַל־שָׂפָם לֹא תַעְטוּ וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵלוּ׃
    hebrewPlain: ועשיתם כאשר עשיתי על שפם לא תעטו ולחם אנשים לא תאכלו
    kjvRefs:
