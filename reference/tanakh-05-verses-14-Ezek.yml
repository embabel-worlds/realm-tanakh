  data:
    osis: Ezek.40.40
    scripture: tanakh
    name: Tanakh Ezekiel 40:40
    ref: Ezekiel 40:40
    book: Ezek
    section: neviim
    chapter: 40
    verse: 40
    ordinal: 13872
    text: And on the one side without, as one goeth up to the entry of the gate toward the north, were two tables; and on the other side of the porch of the gate were two tables.
    translation: JPS 1917
    original: וְאֶל־הַכָּתֵף מִחוּצָה לָעוֹלֶה לְפֶתַח הַשַּׁעַר הַצָּפוֹנָה שְׁנַיִם שֻׁלְחָנוֹת וְאֶל־הַכָּתֵף הָאַחֶרֶת אֲשֶׁר לְאֻלָם הַשַּׁעַר שְׁנַיִם שֻׁלְחָנוֹת׃
    hebrewPlain: ואל הכתף מחוצה לעולה לפתח השער הצפונה שנים שלחנות ואל הכתף האחרת אשר לאלם השער שנים שלחנות
    kjvRefs:
    - Ezekiel 40:40
    kjvOsis:
    - Ezek.40.40
