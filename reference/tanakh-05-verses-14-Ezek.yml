    text: And I heard one speaking unto me out of the house; and a man stood by me.
    translation: JPS 1917
    original: וָאֶשְׁמַע מִדַּבֵּר אֵלַי מֵהַבָּיִת וְאִישׁ הָיָה עֹמֵד אֶצְלִי׃
    hebrewPlain: ואשמע מדבר אלי מהבית ואיש היה עמד אצלי
    kjvRefs:
    - Ezekiel 43:6
    kjvOsis:
    - Ezek.43.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.7
    scripture: tanakh
    name: Tanakh Ezekiel 43:7
    ref: Ezekiel 43:7
    book: Ezek
    section: neviim
    chapter: 43
    verse: 7
    ordinal: 13934
    text: 'And He said unto me: ‘Son of man, this is the place of My throne, and the place of the soles of My feet, where I will dwell in the midst of the children of Israel for ever; and the house of Israel shall no more defile My holy name, neither they, nor their kings, by their harlotry, and by the carcasses of their kings in their high places;'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם אֶת־מְקוֹם כִּסְאִי וְאֶת־מְקוֹם כַּפּוֹת רַגְלַי אֲשֶׁר אֶשְׁכָּן־שָׁם בְּתוֹךְ בְּנֵי־יִשְׂרָאֵל לְעוֹלָם וְלֹא יְטַמְּאוּ עוֹד בֵּית־יִשְׂרָאֵל שֵׁם קָדְשִׁי הֵמָּה וּמַלְכֵיהֶם בִּזְנוּתָם וּבְפִגְרֵי מַלְכֵיהֶם בָּמוֹתָם׃
    hebrewPlain: ויאמר אלי בן אדם את מקום כסאי ואת מקום כפות רגלי אשר אשכן שם בתוך בני ישראל לעולם ולא יטמאו עוד בית ישראל שם קדשי המה ומלכיהם בזנותם ובפגרי מלכיהם במותם
    kjvRefs:
    - Ezekiel 43:7
    kjvOsis:
    - Ezek.43.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.8
    scripture: tanakh
    name: Tanakh Ezekiel 43:8
    ref: Ezekiel 43:8
    book: Ezek
    section: neviim
    chapter: 43
    verse: 8
    ordinal: 13935
    text: in their setting of their threshold by My threshold, and their door-post beside My door-post, and there was but the wall between Me and them; and they have defiled My holy name by their abominations which they have committed; wherefore I have consumed them in Mine anger.
    translation: JPS 1917
    original: בְּתִתָּם סִפָּם אֶת־סִפִּי וּמְזוּזָתָם אֵצֶל מְזוּזָתִי וְהַקִּיר בֵּינִי וּבֵינֵיהֶם וְטִמְּאוּ אֶת־שֵׁם קָדְשִׁי בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ וָאֲכַל אֹתָם בְּאַפִּי׃
    hebrewPlain: בתתם ספם את ספי ומזוזתם אצל מזוזתי והקיר ביני וביניהם וטמאו את שם קדשי בתועבותם אשר עשו ואכל אתם באפי
    kjvRefs:
    - Ezekiel 43:8
    kjvOsis:
    - Ezek.43.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.9
    scripture: tanakh
    name: Tanakh Ezekiel 43:9
    ref: Ezekiel 43:9
    book: Ezek
    section: neviim
    chapter: 43
    verse: 9
    ordinal: 13936
    text: Now let them put away their harlotry, and the carcasses of their kings, far from Me, and I will dwell in the midst of them for ever.
    translation: JPS 1917
    original: עַתָּה יְרַחֲקוּ אֶת־זְנוּתָם וּפִגְרֵי מַלְכֵיהֶם מִמֶּנִּי וְשָׁכַנְתִּי בְתוֹכָם לְעוֹלָם׃
    hebrewPlain: עתה ירחקו את זנותם ופגרי מלכיהם ממני ושכנתי בתוכם לעולם
    kjvRefs:
    - Ezekiel 43:9
    kjvOsis:
    - Ezek.43.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.10
    scripture: tanakh
    name: Tanakh Ezekiel 43:10
    ref: Ezekiel 43:10
    book: Ezek
    section: neviim
    chapter: 43
    verse: 10
    ordinal: 13937
    text: Thou, son of man, show the house to the house of Israel, that they may be ashamed of their iniquities; and let them measure accurately.
    translation: JPS 1917
    original: אַתָּה בֶן־אָדָם הַגֵּד אֶת־בֵּית־יִשְׂרָאֵל אֶת־הַבַּיִת וְיִכָּלְמוּ מֵעֲוֺנוֹתֵיהֶם וּמָדְדוּ אֶת־תָּכְנִית׃
    hebrewPlain: אתה בן אדם הגד את בית ישראל את הבית ויכלמו מעונותיהם ומדדו את תכנית
    kjvRefs:
    - Ezekiel 43:10
    kjvOsis:
    - Ezek.43.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.11
    scripture: tanakh
    name: Tanakh Ezekiel 43:11
    ref: Ezekiel 43:11
    book: Ezek
    section: neviim
    chapter: 43
    verse: 11
    ordinal: 13938
    text: And if they be ashamed of all that they have done, make known unto them the form of the house, and the fashion thereof, and the goings out thereof, and the comings in thereof, and all the forms thereof, and all the ordinances thereof, and all the forms thereof, and all the laws thereof, and write it in their sight; that they may keep the whole form thereof, and all the ordinances thereof, and do them.
    translation: JPS 1917
    original: וְאִם־נִכְלְמוּ מִכֹּל אֲשֶׁר־עָשׂוּ צוּרַת הַבַּיִת וּתְכוּנָתוֹ וּמוֹצָאָיו וּמוֹבָאָיו וְכָל־צוּרֹתָו וְאֵת כָּל־חֻקֹּתָיו וְכָל־צורתי [צוּרֹתָיו] וְכָל־תורתו [תּוֹרֹתָיו] הוֹדַע אוֹתָם וּכְתֹב לְעֵינֵיהֶם וְיִשְׁמְרוּ אֶת־כָּל־צוּרָתוֹ וְאֶת־כָּל־חֻקֹּתָיו וְעָשׂוּ אוֹתָם׃
    hebrewPlain: ואם נכלמו מכל אשר עשו צורת הבית ותכונתו ומוצאיו ומובאיו וכל צורתו ואת כל חקתיו וכל צורתי [צורתיו] וכל תורתו [תורתיו] הודע אותם וכתב לעיניהם וישמרו את כל צורתו ואת כל חקתיו ועשו אותם
    kjvRefs:
    - Ezekiel 43:11
    kjvOsis:
    - Ezek.43.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.12
    scripture: tanakh
    name: Tanakh Ezekiel 43:12
    ref: Ezekiel 43:12
    book: Ezek
    section: neviim
    chapter: 43
    verse: 12
    ordinal: 13939
    text: 'This is the law of the house: upon the top of the mountain the whole limit thereof round about shall be most holy. Behold, this is the law of the house.'
    translation: JPS 1917
    original: זֹאת תּוֹרַת הַבָּיִת עַל־רֹאשׁ הָהָר כָּל־גְּבֻלוֹ סָבִיב סָבִיב קֹדֶשׁ קָדָשִׁים הִנֵּה־זֹאת תּוֹרַת הַבָּיִת׃
    hebrewPlain: זאת תורת הבית על ראש ההר כל גבלו סביב סביב קדש קדשים הנה זאת תורת הבית
    kjvRefs:
    - Ezekiel 43:12
    kjvOsis:
    - Ezek.43.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.13
    scripture: tanakh
    name: Tanakh Ezekiel 43:13
    ref: Ezekiel 43:13
    book: Ezek
    section: neviim
    chapter: 43
    verse: 13
    ordinal: 13940
    text: 'And these are the measures of the altar by cubits—the cubit is a cubit and a handbreadth: the bottom shall be a cubit, and the breadth a cubit, and the border thereof by the edge thereof round about a span; and this shall be the base of the altar.'
    translation: JPS 1917
    original: וְאֵלֶּה מִדּוֹת הַמִּזְבֵּחַ בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח וְחֵיק הָאַמָּה וְאַמָּה־רֹחַב וּגְבוּלָהּ אֶל־שְׂפָתָהּ סָבִיב זֶרֶת הָאֶחָד וְזֶה גַּב הַמִּזְבֵּחַ׃
    hebrewPlain: ואלה מדות המזבח באמות אמה אמה וטפח וחיק האמה ואמה רחב וגבולה אל שפתה סביב זרת האחד וזה גב המזבח
    kjvRefs:
    - Ezekiel 43:13
    kjvOsis:
    - Ezek.43.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.14
    scripture: tanakh
    name: Tanakh Ezekiel 43:14
    ref: Ezekiel 43:14
    book: Ezek
    section: neviim
    chapter: 43
    verse: 14
    ordinal: 13941
    text: And from the bottom upon the ground to the lower settle shall be two cubits, and the breadth one cubit; and from the lesser settle to the greater settle shall be four cubits, and the breadth a cubit.
    translation: JPS 1917
    original: וּמֵחֵיק הָאָרֶץ עַד־הָעֲזָרָה הַתַּחְתּוֹנָה שְׁתַּיִם אַמּוֹת וְרֹחַב אַמָּה אֶחָת וּמֵהֳעֲזָרָה הַקְּטַנָּה עַד־הָעֲזָרָה הַגְּדוֹלָה אַרְבַּע אַמּוֹת וְרֹחַב הָאַמָּה׃
    hebrewPlain: ומחיק הארץ עד העזרה התחתונה שתים אמות ורחב אמה אחת ומהעזרה הקטנה עד העזרה הגדולה ארבע אמות ורחב האמה
    kjvRefs:
    - Ezekiel 43:14
    kjvOsis:
    - Ezek.43.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.15
    scripture: tanakh
    name: Tanakh Ezekiel 43:15
    ref: Ezekiel 43:15
    book: Ezek
    section: neviim
    chapter: 43
    verse: 15
    ordinal: 13942
    text: And the hearth shall be four cubits; and from the hearth and upward there shall be four horns.
    translation: JPS 1917
    original: וְהַהַרְאֵל אַרְבַּע אַמּוֹת וּמֵהָאֲרִאֵיל וּלְמַעְלָה הַקְּרָנוֹת אַרְבַּע׃
    hebrewPlain: וההראל ארבע אמות ומהאראיל ולמעלה הקרנות ארבע
    kjvRefs:
    - Ezekiel 43:15
    kjvOsis:
    - Ezek.43.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.16
    scripture: tanakh
    name: Tanakh Ezekiel 43:16
    ref: Ezekiel 43:16
    book: Ezek
    section: neviim
    chapter: 43
    verse: 16
    ordinal: 13943
    text: And the hearth shall be twelve cubits long by twelve broad, square in the four sides thereof.
    translation: JPS 1917
    original: והאראיל [וְהָאֲרִיאֵל] שְׁתֵּים עֶשְׂרֵה אֹרֶךְ בִּשְׁתֵּים עֶשְׂרֵה רֹחַב רָבוּעַ אֶל אַרְבַּעַת רְבָעָיו׃
    hebrewPlain: והאראיל [והאריאל] שתים עשרה ארך בשתים עשרה רחב רבוע אל ארבעת רבעיו
    kjvRefs:
    - Ezekiel 43:16
    kjvOsis:
    - Ezek.43.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.17
    scripture: tanakh
    name: Tanakh Ezekiel 43:17
    ref: Ezekiel 43:17
    book: Ezek
    section: neviim
    chapter: 43
    verse: 17
    ordinal: 13944
    text: And the settle shall be fourteen cubits long by fourteen broad in the four sides thereof; and the border about it shall be half a cubit; and the bottom thereof shall be a cubit about; and the steps thereof shall look toward the east.’
    translation: JPS 1917
    original: וְהָעֲזָרָה אַרְבַּע עֶשְׂרֵה אֹרֶךְ בְּאַרְבַּע עֶשְׂרֵה רֹחַב אֶל אַרְבַּעַת רְבָעֶיהָ וְהַגְּבוּל סָבִיב אוֹתָהּ חֲצִי הָאַמָּה וְהַחֵיק־לָהּ אַמָּה סָבִיב וּמַעֲלֹתֵהוּ פְּנוֹת קָדִים׃
    hebrewPlain: והעזרה ארבע עשרה ארך בארבע עשרה רחב אל ארבעת רבעיה והגבול סביב אותה חצי האמה והחיק לה אמה סביב ומעלתהו פנות קדים
    kjvRefs:
    - Ezekiel 43:17
    kjvOsis:
    - Ezek.43.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.18
    scripture: tanakh
    name: Tanakh Ezekiel 43:18
    ref: Ezekiel 43:18
    book: Ezek
    section: neviim
    chapter: 43
    verse: 18
    ordinal: 13945
    text: 'And He said unto me: ‘Son of man, thus saith the Lord GOD: These are the ordinances of the altar in the day when they shall make it, to offer burnt-offerings thereon, and to dash blood against it.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם כֹּה אָמַר אֲדֹנָי יְהוִה אֵלֶּה חֻקּוֹת הַמִּזְבֵּחַ בְּיוֹם הֵעָשׂוֹתוֹ לְהַעֲלוֹת עָלָיו עוֹלָה וְלִזְרֹק עָלָיו דָּם׃
    hebrewPlain: ויאמר אלי בן אדם כה אמר אדני יהוה אלה חקות המזבח ביום העשותו להעלות עליו עולה ולזרק עליו דם
    kjvRefs:
    - Ezekiel 43:18
    kjvOsis:
    - Ezek.43.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.19
    scripture: tanakh
    name: Tanakh Ezekiel 43:19
    ref: Ezekiel 43:19
    book: Ezek
    section: neviim
    chapter: 43
    verse: 19
    ordinal: 13946
    text: Thou shalt give to the priests the Levites that are of the seed of Zadok, who are near unto Me, to minister unto Me, saith the Lord GOD, a young bullock for a sin-offering.
    translation: JPS 1917
    original: וְנָתַתָּה אֶל־הַכֹּהֲנִים הַלְוִיִּם אֲשֶׁר הֵם מִזֶּרַע צָדוֹק הַקְּרֹבִים אֵלַי נְאֻם אֲדֹנָי יְהוִה לְשָׁרְתֵנִי פַּר בֶּן־בָּקָר לְחַטָּאת׃
    hebrewPlain: ונתתה אל הכהנים הלוים אשר הם מזרע צדוק הקרבים אלי נאם אדני יהוה לשרתני פר בן בקר לחטאת
    kjvRefs:
    - Ezekiel 43:19
    kjvOsis:
    - Ezek.43.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.20
    scripture: tanakh
    name: Tanakh Ezekiel 43:20
    ref: Ezekiel 43:20
    book: Ezek
    section: neviim
    chapter: 43
    verse: 20
    ordinal: 13947
    text: And thou shalt take of the blood thereof, and put it on the four horns of it, and on the four corners of the settle, and upon the border round about; thus shalt thou purify it and make atonement for it.
    translation: JPS 1917
    original: וְלָקַחְתָּ מִדָּמוֹ וְנָתַתָּה עַל־אַרְבַּע קַרְנֹתָיו וְאֶל־אַרְבַּע פִּנּוֹת הָעֲזָרָה וְאֶל־הַגְּבוּל סָבִיב וְחִטֵּאתָ אוֹתוֹ וְכִפַּרְתָּהוּ׃
    hebrewPlain: ולקחת מדמו ונתתה על ארבע קרנתיו ואל ארבע פנות העזרה ואל הגבול סביב וחטאת אותו וכפרתהו
    kjvRefs:
    - Ezekiel 43:20
    kjvOsis:
    - Ezek.43.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.21
    scripture: tanakh
    name: Tanakh Ezekiel 43:21
    ref: Ezekiel 43:21
    book: Ezek
    section: neviim
    chapter: 43
    verse: 21
    ordinal: 13948
    text: Thou shalt also take the bullock of the sin-offering, and it shall be burnt in the appointed place of the house, without the sanctuary.
    translation: JPS 1917
    original: וְלָקַחְתָּ אֵת הַפָּר הַחַטָּאת וּשְׂרָפוֹ בְּמִפְקַד הַבַּיִת מִחוּץ לַמִּקְדָּשׁ׃
    hebrewPlain: ולקחת את הפר החטאת ושרפו במפקד הבית מחוץ למקדש
    kjvRefs:
    - Ezekiel 43:21
    kjvOsis:
    - Ezek.43.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.22
    scripture: tanakh
    name: Tanakh Ezekiel 43:22
    ref: Ezekiel 43:22
    book: Ezek
    section: neviim
    chapter: 43
    verse: 22
    ordinal: 13949
    text: And on the second day thou shalt offer a he-goat without blemish for a sin-offering; and they shall purify the altar, as they did purify it with the bullock.
    translation: JPS 1917
    original: וּבַיּוֹם הַשֵּׁנִי תַּקְרִיב שְׂעִיר־עִזִּים תָּמִים לְחַטָּאת וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ כַּאֲשֶׁר חִטְּאוּ בַּפָּר׃
    hebrewPlain: וביום השני תקריב שעיר עזים תמים לחטאת וחטאו את המזבח כאשר חטאו בפר
    kjvRefs:
    - Ezekiel 43:22
    kjvOsis:
    - Ezek.43.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.23
    scripture: tanakh
    name: Tanakh Ezekiel 43:23
    ref: Ezekiel 43:23
    book: Ezek
    section: neviim
    chapter: 43
    verse: 23
    ordinal: 13950
    text: When thou hast made an end of purifying it, thou shalt offer a young bullock without blemish, and a ram out of the flock without blemish.
    translation: JPS 1917
    original: בְּכַלּוֹתְךָ מֵחַטֵּא תַּקְרִיב פַּר בֶּן־בָּקָר תָּמִים וְאַיִל מִן־הַצֹּאן תָּמִים׃
    hebrewPlain: בכלותך מחטא תקריב פר בן בקר תמים ואיל מן הצאן תמים
    kjvRefs:
    - Ezekiel 43:23
    kjvOsis:
    - Ezek.43.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.24
    scripture: tanakh
    name: Tanakh Ezekiel 43:24
    ref: Ezekiel 43:24
    book: Ezek
    section: neviim
    chapter: 43
    verse: 24
    ordinal: 13951
    text: And thou shalt present them before the LORD, and the priests shall cast salt upon them, and they shall offer them up for a burnt-offering unto the LORD.
    translation: JPS 1917
    original: וְהִקְרַבְתָּם לִפְנֵי יְהוָה וְהִשְׁלִיכוּ הַכֹּהֲנִים עֲלֵיהֶם מֶלַח וְהֶעֱלוּ אוֹתָם עֹלָה לַיהוָה׃
    hebrewPlain: והקרבתם לפני יהוה והשליכו הכהנים עליהם מלח והעלו אותם עלה ליהוה
    kjvRefs:
    - Ezekiel 43:24
    kjvOsis:
    - Ezek.43.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.25
    scripture: tanakh
    name: Tanakh Ezekiel 43:25
    ref: Ezekiel 43:25
    book: Ezek
    section: neviim
    chapter: 43
    verse: 25
    ordinal: 13952
    text: Seven days shalt thou prepare every day a goat for a sin-offering; they shall also prepare a young bullock, and a ram out of the flock, without blemish.
    translation: JPS 1917
    original: שִׁבְעַת יָמִים תַּעֲשֶׂה שְׂעִיר־חַטָּאת לַיּוֹם וּפַר בֶּן־בָּקָר וְאַיִל מִן־הַצֹּאן תְּמִימִים יַעֲשׂוּ׃
    hebrewPlain: שבעת ימים תעשה שעיר חטאת ליום ופר בן בקר ואיל מן הצאן תמימים יעשו
    kjvRefs:
    - Ezekiel 43:25
    kjvOsis:
    - Ezek.43.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.26
    scripture: tanakh
    name: Tanakh Ezekiel 43:26
    ref: Ezekiel 43:26
    book: Ezek
    section: neviim
    chapter: 43
    verse: 26
    ordinal: 13953
    text: Seven days shall they make atonement for the altar and cleanse it; so shall they consecrate it.
    translation: JPS 1917
    original: שִׁבְעַת יָמִים יְכַפְּרוּ אֶת־הַמִּזְבֵּחַ וְטִהֲרוּ אֹתוֹ וּמִלְאוּ ידו [יָדָיו׃]
    hebrewPlain: שבעת ימים יכפרו את המזבח וטהרו אתו ומלאו ידו [ידיו]
    kjvRefs:
    - Ezekiel 43:26
    kjvOsis:
    - Ezek.43.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.43.27
    scripture: tanakh
    name: Tanakh Ezekiel 43:27
    ref: Ezekiel 43:27
    book: Ezek
    section: neviim
    chapter: 43
    verse: 27
    ordinal: 13954
    text: And when they have accomplished the days, it shall be that upon the eighth day, and forward, the priests shall make your burnt-offerings upon the altar, and your peace-offerings; and I will accept you, saith the Lord GOD.’
    translation: JPS 1917
    original: וִיכַלּוּ אֶת־הַיָּמִים וְהָיָה בַיּוֹם הַשְּׁמִינִי וָהָלְאָה יַעֲשׂוּ הַכֹּהֲנִים עַל־הַמִּזְבֵּחַ אֶת־עוֹלוֹתֵיכֶם וְאֶת־שַׁלְמֵיכֶם וְרָצִאתִי אֶתְכֶם נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: ויכלו את הימים והיה ביום השמיני והלאה יעשו הכהנים על המזבח את עולותיכם ואת שלמיכם ורצאתי אתכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 43:27
    kjvOsis:
    - Ezek.43.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.43
- type: TanakhVerse
  data:
    osis: Ezek.44.1
    scripture: tanakh
    name: Tanakh Ezekiel 44:1
    ref: Ezekiel 44:1
    book: Ezek
    section: neviim
    chapter: 44
    verse: 1
    ordinal: 13955
    text: Then he brought me back the way of the outer gate of the sanctuary, which looketh toward the east; and it was shut.
    translation: JPS 1917
    original: וַיָּשֶׁב אֹתִי דֶּרֶךְ שַׁעַר הַמִּקְדָּשׁ הַחִיצוֹן הַפֹּנֶה קָדִים וְהוּא סָגוּר׃
    hebrewPlain: וישב אתי דרך שער המקדש החיצון הפנה קדים והוא סגור
    kjvRefs:
    - Ezekiel 44:1
    kjvOsis:
    - Ezek.44.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.2
    scripture: tanakh
    name: Tanakh Ezekiel 44:2
    ref: Ezekiel 44:2
    book: Ezek
    section: neviim
    chapter: 44
    verse: 2
    ordinal: 13956
    text: 'And the LORD said unto me: ‘This gate shall be shut, it shall not be opened, neither shall any man enter in by it, for the LORD, the God of Israel, hath entered in by it; therefore it shall be shut.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי יְהוָה הַשַּׁעַר הַזֶּה סָגוּר יִהְיֶה לֹא יִפָּתֵחַ וְאִישׁ לֹא־יָבֹא בוֹ כִּי יְהוָה אֱלֹהֵי־יִשְׂרָאֵל בָּא בוֹ וְהָיָה סָגוּר׃
    hebrewPlain: ויאמר אלי יהוה השער הזה סגור יהיה לא יפתח ואיש לא יבא בו כי יהוה אלהי ישראל בא בו והיה סגור
    kjvRefs:
    - Ezekiel 44:2
    kjvOsis:
    - Ezek.44.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.3
    scripture: tanakh
    name: Tanakh Ezekiel 44:3
    ref: Ezekiel 44:3
    book: Ezek
    section: neviim
    chapter: 44
    verse: 3
    ordinal: 13957
    text: As for the prince, being a prince, he shall sit therein to eat bread before the LORD; he shall enter by the way of the porch of the gate, and shall go out by the way of the same.’
    translation: JPS 1917
    original: אֶת־הַנָּשִׂיא נָשִׂיא הוּא יֵשֶׁב־בּוֹ לֶאֱכָול־לֶחֶם לִפְנֵי יְהוָה מִדֶּרֶךְ אֻלָם הַשַּׁעַר יָבוֹא וּמִדַּרְכּוֹ יֵצֵא׃
    hebrewPlain: את הנשיא נשיא הוא ישב בו לאכול לחם לפני יהוה מדרך אלם השער יבוא ומדרכו יצא
    kjvRefs:
    - Ezekiel 44:3
    kjvOsis:
    - Ezek.44.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.4
    scripture: tanakh
    name: Tanakh Ezekiel 44:4
    ref: Ezekiel 44:4
    book: Ezek
    section: neviim
    chapter: 44
    verse: 4
    ordinal: 13958
    text: Then he brought me the way of the north gate before the house; and I looked, and, behold, the glory of the LORD filled the house of the LORD; and I fell upon my face.
    translation: JPS 1917
    original: וַיְבִיאֵנִי דֶּרֶךְ־שַׁעַר הַצָּפוֹן אֶל־פְּנֵי הַבַּיִת וָאֵרֶא וְהִנֵּה מָלֵא כְבוֹד־יְהוָה אֶת־בֵּית יְהוָה וָאֶפֹּל אֶל־פָּנָי׃
    hebrewPlain: ויביאני דרך שער הצפון אל פני הבית וארא והנה מלא כבוד יהוה את בית יהוה ואפל אל פני
    kjvRefs:
    - Ezekiel 44:4
    kjvOsis:
    - Ezek.44.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.5
    scripture: tanakh
    name: Tanakh Ezekiel 44:5
    ref: Ezekiel 44:5
    book: Ezek
    section: neviim
    chapter: 44
    verse: 5
    ordinal: 13959
    text: 'And the LORD said unto me: ‘Son of man, mark well, and behold with thine eyes, and hear with thine ears all that I say unto thee concerning all the ordinances of the house of the LORD, and all the laws thereof; and mark well the entering in of the house, with every going forth of the sanctuary.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי יְהֹוָה בֶּן־אָדָם שִׂים לִבְּךָ וּרְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְּׁמָע אֵת כָּל־אֲשֶׁר אֲנִי מְדַבֵּר אֹתָךְ לְכָל־חֻקּוֹת בֵּית־יְהוָה וּלְכָל־תורתו [תּוֹרֹתָיו] וְשַׂמְתָּ לִבְּךָ לִמְבוֹא הַבַּיִת בְּכֹל מוֹצָאֵי הַמִּקְדָּשׁ׃
    hebrewPlain: ויאמר אלי יהוה בן אדם שים לבך וראה בעיניך ובאזניך שמע את כל אשר אני מדבר אתך לכל חקות בית יהוה ולכל תורתו [תורתיו] ושמת לבך למבוא הבית בכל מוצאי המקדש
    kjvRefs:
    - Ezekiel 44:5
    kjvOsis:
    - Ezek.44.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.6
    scripture: tanakh
    name: Tanakh Ezekiel 44:6
    ref: Ezekiel 44:6
    book: Ezek
    section: neviim
    chapter: 44
    verse: 6
    ordinal: 13960
    text: 'And thou shalt say to the rebellious, even to the house of Israel: Thus saith the Lord GOD: O ye house of Israel, let it suffice you of all your abominations,'
    translation: JPS 1917
    original: וְאָמַרְתָּ אֶל־מֶרִי אֶל־בֵּית יִשְׂרָאֵל כֹּה אָמַר אֲדֹנָי יְהוִה רַב־לָכֶם מִכָּל־תּוֹעֲבוֹתֵיכֶם בֵּית יִשְׂרָאֵל׃
    hebrewPlain: ואמרת אל מרי אל בית ישראל כה אמר אדני יהוה רב לכם מכל תועבותיכם בית ישראל
    kjvRefs:
    - Ezekiel 44:6
    kjvOsis:
    - Ezek.44.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.7
    scripture: tanakh
    name: Tanakh Ezekiel 44:7
    ref: Ezekiel 44:7
    book: Ezek
    section: neviim
    chapter: 44
    verse: 7
    ordinal: 13961
    text: in that ye have brought in aliens, uncircumcised in heart and uncircumcised in flesh, to be in My sanctuary, to profane it, even My house, when ye offer My bread, the fat and the blood, and they have broken My covenant, to add unto all your abominations.
    translation: JPS 1917
    original: בַּהֲבִיאֲכֶם בְּנֵי־נֵכָר עַרְלֵי־לֵב וְעַרְלֵי בָשָׂר לִהְיוֹת בְּמִקְדָּשִׁי לְחַלְּלוֹ אֶת־בֵּיתִי בְּהַקְרִיבְכֶם אֶת־לַחְמִי חֵלֶב וָדָם וַיָּפֵרוּ אֶת־בְּרִיתִי אֶל כָּל־תּוֹעֲבוֹתֵיכֶם׃
    hebrewPlain: בהביאכם בני נכר ערלי לב וערלי בשר להיות במקדשי לחללו את ביתי בהקריבכם את לחמי חלב ודם ויפרו את בריתי אל כל תועבותיכם
    kjvRefs:
    - Ezekiel 44:7
    kjvOsis:
    - Ezek.44.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.8
    scripture: tanakh
    name: Tanakh Ezekiel 44:8
    ref: Ezekiel 44:8
    book: Ezek
    section: neviim
    chapter: 44
    verse: 8
    ordinal: 13962
    text: And ye have not kept the charge of My holy things; but ye have set keepers of My charge in My sanctuary to please yourselves.
    translation: JPS 1917
    original: וְלֹא שְׁמַרְתֶּם מִשְׁמֶרֶת קָדָשָׁי וַתְּשִׂימוּן לְשֹׁמְרֵי מִשְׁמַרְתִּי בְּמִקְדָּשִׁי לָכֶם׃
    hebrewPlain: ולא שמרתם משמרת קדשי ותשימון לשמרי משמרתי במקדשי לכם
    kjvRefs:
    - Ezekiel 44:8
    kjvOsis:
    - Ezek.44.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.9
    scripture: tanakh
    name: Tanakh Ezekiel 44:9
    ref: Ezekiel 44:9
    book: Ezek
    section: neviim
    chapter: 44
    verse: 9
    ordinal: 13963
    text: 'Thus saith the Lord GOD: No alien, uncircumcised in heart and uncircumcised in flesh, shall enter into My sanctuary, even any alien that is among the children of Israel.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה כָּל־בֶּן־נֵכָר עֶרֶל לֵב וְעֶרֶל בָּשָׂר לֹא יָבוֹא אֶל־מִקְדָּשִׁי לְכָל־בֶּן־נֵכָר אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: כה אמר אדני יהוה כל בן נכר ערל לב וערל בשר לא יבוא אל מקדשי לכל בן נכר אשר בתוך בני ישראל
    kjvRefs:
    - Ezekiel 44:9
    kjvOsis:
    - Ezek.44.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.10
    scripture: tanakh
    name: Tanakh Ezekiel 44:10
    ref: Ezekiel 44:10
    book: Ezek
    section: neviim
    chapter: 44
    verse: 10
    ordinal: 13964
    text: But the Levites, that went far from Me, when Israel went astray, that went astray from Me after their idols, they shall bear their iniquity;
    translation: JPS 1917
    original: כִּי אִם־הַלְוִיִּם אֲשֶׁר רָחֲקוּ מֵעָלַי בִּתְעוֹת יִשְׂרָאֵל אֲשֶׁר תָּעוּ מֵעָלַי אַחֲרֵי גִּלּוּלֵיהֶם וְנָשְׂאוּ עֲוֺנָם׃
    hebrewPlain: כי אם הלוים אשר רחקו מעלי בתעות ישראל אשר תעו מעלי אחרי גלוליהם ונשאו עונם
    kjvRefs:
    - Ezekiel 44:10
    kjvOsis:
    - Ezek.44.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.11
    scripture: tanakh
    name: Tanakh Ezekiel 44:11
    ref: Ezekiel 44:11
    book: Ezek
    section: neviim
    chapter: 44
    verse: 11
    ordinal: 13965
    text: 'and they shall be ministers in My sanctuary, having charge at the gates of the house, and ministering in the house: they shall slay the burnt-offering and the sacrifice for the people, and they shall stand before them to minister unto them.'
    translation: JPS 1917
    original: וְהָיוּ בְמִקְדָּשִׁי מְשָׁרְתִים פְּקֻדּוֹת אֶל־שַׁעֲרֵי הַבַּיִת וּמְשָׁרְתִים אֶת־הַבָּיִת הֵמָּה יִשְׁחֲטוּ אֶת־הָעֹלָה וְאֶת־הַזֶּבַח לָעָם וְהֵמָּה יַעַמְדוּ לִפְנֵיהֶם לְשָׁרְתָם׃
    hebrewPlain: והיו במקדשי משרתים פקדות אל שערי הבית ומשרתים את הבית המה ישחטו את העלה ואת הזבח לעם והמה יעמדו לפניהם לשרתם
    kjvRefs:
    - Ezekiel 44:11
    kjvOsis:
    - Ezek.44.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.12
    scripture: tanakh
    name: Tanakh Ezekiel 44:12
    ref: Ezekiel 44:12
    book: Ezek
    section: neviim
    chapter: 44
    verse: 12
    ordinal: 13966
    text: Because they ministered unto them before their idols, and became a stumblingblock of iniquity unto the house of Israel; therefore have I lifted up My hand against them, saith the Lord GOD, and they shall bear their iniquity.
    translation: JPS 1917
    original: יַעַן אֲשֶׁר יְשָׁרְתוּ אוֹתָם לִפְנֵי גִלּוּלֵיהֶם וְהָיוּ לְבֵית־יִשְׂרָאֵל לְמִכְשׁוֹל עָוֺן עַל־כֵּן נָשָׂאתִי יָדִי עֲלֵיהֶם נְאֻם אֲדֹנָי יְהוִה וְנָשְׂאוּ עֲוֺנָם׃
    hebrewPlain: יען אשר ישרתו אותם לפני גלוליהם והיו לבית ישראל למכשול עון על כן נשאתי ידי עליהם נאם אדני יהוה ונשאו עונם
    kjvRefs:
    - Ezekiel 44:12
    kjvOsis:
    - Ezek.44.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.13
    scripture: tanakh
    name: Tanakh Ezekiel 44:13
    ref: Ezekiel 44:13
    book: Ezek
    section: neviim
    chapter: 44
    verse: 13
    ordinal: 13967
    text: And they shall not come near unto Me, to minister unto Me in the priest’s office, nor to come near to any of My holy things, unto the things that are most holy; but they shall bear their shame, and their abominations which they have committed.
    translation: JPS 1917
    original: וְלֹא־יִגְּשׁוּ אֵלַי לְכַהֵן לִי וְלָגֶשֶׁת עַל־כָּל־קָדָשַׁי אֶל־קָדְשֵׁי הַקְּדָשִׁים וְנָשְׂאוּ כְּלִמָּתָם וְתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ׃
    hebrewPlain: ולא יגשו אלי לכהן לי ולגשת על כל קדשי אל קדשי הקדשים ונשאו כלמתם ותועבותם אשר עשו
    kjvRefs:
    - Ezekiel 44:13
    kjvOsis:
    - Ezek.44.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.14
    scripture: tanakh
    name: Tanakh Ezekiel 44:14
    ref: Ezekiel 44:14
    book: Ezek
    section: neviim
    chapter: 44
    verse: 14
    ordinal: 13968
    text: And I will make them keepers of the charge of the house, for all the service thereof, and for all that shall be done therein.
    translation: JPS 1917
    original: וְנָתַתִּי אוֹתָם שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת לְכֹל עֲבֹדָתוֹ וּלְכֹל אֲשֶׁר יֵעָשֶׂה בּוֹ׃
    hebrewPlain: ונתתי אותם שמרי משמרת הבית לכל עבדתו ולכל אשר יעשה בו
    kjvRefs:
    - Ezekiel 44:14
    kjvOsis:
    - Ezek.44.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.15
    scripture: tanakh
    name: Tanakh Ezekiel 44:15
    ref: Ezekiel 44:15
    book: Ezek
    section: neviim
    chapter: 44
    verse: 15
    ordinal: 13969
    text: But the priests the Levites, the sons of Zadok, that kept the charge of My sanctuary when the children of Israel went astray from Me, they shall come near to Me to minister unto Me; and they shall stand before Me to offer unto Me the fat and the blood, saith the Lord GOD;
    translation: JPS 1917
    original: וְהַכֹּהֲנִים הַלְוִיִּם בְּנֵי צָדוֹק אֲשֶׁר שָׁמְרוּ אֶת־מִשְׁמֶרֶת מִקְדָּשִׁי בִּתְעוֹת בְּנֵי־יִשְׂרָאֵל מֵעָלַי הֵמָּה יִקְרְבוּ אֵלַי לְשָׁרְתֵנִי וְעָמְדוּ לְפָנַי לְהַקְרִיב לִי חֵלֶב וָדָם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: והכהנים הלוים בני צדוק אשר שמרו את משמרת מקדשי בתעות בני ישראל מעלי המה יקרבו אלי לשרתני ועמדו לפני להקריב לי חלב ודם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 44:15
    kjvOsis:
    - Ezek.44.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.16
    scripture: tanakh
    name: Tanakh Ezekiel 44:16
    ref: Ezekiel 44:16
    book: Ezek
    section: neviim
    chapter: 44
    verse: 16
    ordinal: 13970
    text: they shall enter into My sanctuary, and they shall come near to My table, to minister unto Me, and they shall keep My charge.
    translation: JPS 1917
    original: הֵמָּה יָבֹאוּ אֶל־מִקְדָּשִׁי וְהֵמָּה יִקְרְבוּ אֶל־שֻׁלְחָנִי לְשָׁרְתֵנִי וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי׃
    hebrewPlain: המה יבאו אל מקדשי והמה יקרבו אל שלחני לשרתני ושמרו את משמרתי
    kjvRefs:
    - Ezekiel 44:16
    kjvOsis:
    - Ezek.44.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.17
    scripture: tanakh
    name: Tanakh Ezekiel 44:17
    ref: Ezekiel 44:17
    book: Ezek
    section: neviim
    chapter: 44
    verse: 17
    ordinal: 13971
    text: And it shall be that when they enter in at the gates of the inner court, they shall be clothed with linen garments; and no wool shall come upon them, while they minister in the gates of the inner court, and within.
    translation: JPS 1917
    original: וְהָיָה בְּבוֹאָם אֶל־שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית בִּגְדֵי פִשְׁתִּים יִלְבָּשׁוּ וְלֹא־יַעֲלֶה עֲלֵיהֶם צֶמֶר בְּשָׁרְתָם בְּשַׁעֲרֵי הֶחָצֵר הַפְּנִימִית וָבָיְתָה׃
    hebrewPlain: והיה בבואם אל שערי החצר הפנימית בגדי פשתים ילבשו ולא יעלה עליהם צמר בשרתם בשערי החצר הפנימית וביתה
    kjvRefs:
    - Ezekiel 44:17
    kjvOsis:
    - Ezek.44.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.18
    scripture: tanakh
    name: Tanakh Ezekiel 44:18
    ref: Ezekiel 44:18
    book: Ezek
    section: neviim
    chapter: 44
    verse: 18
    ordinal: 13972
    text: They shall have linen tires upon their heads, and shall have linen breeches upon their loins; they shall not gird themselves with any thing that causeth sweat.
    translation: JPS 1917
    original: פַּאֲרֵי פִשְׁתִּים יִהְיוּ עַל־רֹאשָׁם וּמִכְנְסֵי פִשְׁתִּים יִהְיוּ עַל־מָתְנֵיהֶם לֹא יַחְגְּרוּ בַּיָּזַע׃
    hebrewPlain: פארי פשתים יהיו על ראשם ומכנסי פשתים יהיו על מתניהם לא יחגרו ביזע
    kjvRefs:
    - Ezekiel 44:18
    kjvOsis:
    - Ezek.44.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.19
    scripture: tanakh
    name: Tanakh Ezekiel 44:19
    ref: Ezekiel 44:19
    book: Ezek
    section: neviim
    chapter: 44
    verse: 19
    ordinal: 13973
    text: And when they go forth into the outer court, even into the outer court to the people, they shall put off their garments wherein they minister, and lay them in the holy chambers, and they shall put on other garments, that they sanctify not the people with their garments.
    translation: JPS 1917
    original: וּבְצֵאתָם אֶל־הֶחָצֵר הַחִיצוֹנָה אֶל־הֶחָצֵר הַחִיצוֹנָה אֶל־הָעָם יִפְשְׁטוּ אֶת־בִּגְדֵיהֶם אֲשֶׁר־הֵמָּה מְשָׁרְתִם בָּם וְהִנִּיחוּ אוֹתָם בְּלִשְׁכֹת הַקֹּדֶשׁ וְלָבְשׁוּ בְּגָדִים אֲחֵרִים וְלֹא־יְקַדְּשׁוּ אֶת־הָעָם בְּבִגְדֵיהֶם׃
    hebrewPlain: ובצאתם אל החצר החיצונה אל החצר החיצונה אל העם יפשטו את בגדיהם אשר המה משרתם בם והניחו אותם בלשכת הקדש ולבשו בגדים אחרים ולא יקדשו את העם בבגדיהם
    kjvRefs:
    - Ezekiel 44:19
    kjvOsis:
    - Ezek.44.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.20
    scripture: tanakh
    name: Tanakh Ezekiel 44:20
    ref: Ezekiel 44:20
    book: Ezek
    section: neviim
    chapter: 44
    verse: 20
    ordinal: 13974
    text: Neither shall they shave their heads, nor suffer their locks to grow long; they shall only poll their heads.
    translation: JPS 1917
    original: וְרֹאשָׁם לֹא יְגַלֵּחוּ וּפֶרַע לֹא יְשַׁלֵּחוּ כָּסוֹם יִכְסְמוּ אֶת־רָאשֵׁיהֶם׃
    hebrewPlain: וראשם לא יגלחו ופרע לא ישלחו כסום יכסמו את ראשיהם
    kjvRefs:
    - Ezekiel 44:20
    kjvOsis:
    - Ezek.44.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.21
    scripture: tanakh
    name: Tanakh Ezekiel 44:21
    ref: Ezekiel 44:21
    book: Ezek
    section: neviim
    chapter: 44
    verse: 21
    ordinal: 13975
    text: Neither shall any priest drink wine, when they enter into the inner court.
    translation: JPS 1917
    original: וְיַיִן לֹא־יִשְׁתּוּ כָּל־כֹּהֵן בְּבוֹאָם אֶל־הֶחָצֵר הַפְּנִימִית׃
    hebrewPlain: ויין לא ישתו כל כהן בבואם אל החצר הפנימית
    kjvRefs:
    - Ezekiel 44:21
    kjvOsis:
    - Ezek.44.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.22
    scripture: tanakh
    name: Tanakh Ezekiel 44:22
    ref: Ezekiel 44:22
    book: Ezek
    section: neviim
    chapter: 44
    verse: 22
    ordinal: 13976
    text: Neither shall they take for their wives a widow, nor her that is put away; but they shall take virgins of the seed of the house of Israel, or a widow that is the widow of a priest.
    translation: JPS 1917
    original: וְאַלְמָנָה וּגְרוּשָׁה לֹא־יִקְחוּ לָהֶם לְנָשִׁים כִּי אִם־בְּתוּלֹת מִזֶּרַע בֵּית יִשְׂרָאֵל וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן יִקָּחוּ׃
    hebrewPlain: ואלמנה וגרושה לא יקחו להם לנשים כי אם בתולת מזרע בית ישראל והאלמנה אשר תהיה אלמנה מכהן יקחו
    kjvRefs:
    - Ezekiel 44:22
    kjvOsis:
    - Ezek.44.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.23
    scripture: tanakh
    name: Tanakh Ezekiel 44:23
    ref: Ezekiel 44:23
    book: Ezek
    section: neviim
    chapter: 44
    verse: 23
    ordinal: 13977
    text: And they shall teach My people the difference between the holy and the common, and cause them to discern between the unclean and the clean.
    translation: JPS 1917
    original: וְאֶת־עַמִּי יוֹרוּ בֵּין קֹדֶשׁ לְחֹל וּבֵין־טָמֵא לְטָהוֹר יוֹדִעֻם׃
    hebrewPlain: ואת עמי יורו בין קדש לחל ובין טמא לטהור יודעם
    kjvRefs:
    - Ezekiel 44:23
    kjvOsis:
    - Ezek.44.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.24
    scripture: tanakh
    name: Tanakh Ezekiel 44:24
    ref: Ezekiel 44:24
    book: Ezek
    section: neviim
    chapter: 44
    verse: 24
    ordinal: 13978
    text: And in a controversy they shall stand to judge; according to Mine ordinances shall they judge it; and they shall keep My laws and My statutes in all My appointed seasons, and they shall hallow My sabbaths.
    translation: JPS 1917
    original: וְעַל־רִיב הֵמָּה יַעַמְדוּ לשפט [לְמִשְׁפָּט] בְּמִשְׁפָּטַי ושפטהו [יִשְׁפְּטוּהוּ] וְאֶת־תּוֹרֹתַי וְאֶת־חֻקֹּתַי בְּכָל־מוֹעֲדַי יִשְׁמֹרוּ וְאֶת־שַׁבְּתוֹתַי יְקַדֵּשׁוּ׃
    hebrewPlain: ועל ריב המה יעמדו לשפט [למשפט] במשפטי ושפטהו [ישפטוהו] ואת תורתי ואת חקתי בכל מועדי ישמרו ואת שבתותי יקדשו
    kjvRefs:
    - Ezekiel 44:24
    kjvOsis:
    - Ezek.44.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.25
    scripture: tanakh
    name: Tanakh Ezekiel 44:25
    ref: Ezekiel 44:25
    book: Ezek
    section: neviim
    chapter: 44
    verse: 25
    ordinal: 13979
    text: And they shall come near no dead person to defile themselves; but for father, or for mother, or for son, or for daughter, for brother, or for sister that hath had no husband, they may defile themselves.
    translation: JPS 1917
    original: וְאֶל־מֵת אָדָם לֹא יָבוֹא לְטָמְאָה כִּי אִם־לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת אֲשֶׁר־לֹא־הָיְתָה לְאִישׁ יִטַּמָּאוּ׃
    hebrewPlain: ואל מת אדם לא יבוא לטמאה כי אם לאב ולאם ולבן ולבת לאח ולאחות אשר לא היתה לאיש יטמאו
    kjvRefs:
    - Ezekiel 44:25
    kjvOsis:
    - Ezek.44.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.26
    scripture: tanakh
    name: Tanakh Ezekiel 44:26
    ref: Ezekiel 44:26
    book: Ezek
    section: neviim
    chapter: 44
    verse: 26
    ordinal: 13980
    text: And after he is cleansed, they shall reckon unto him seven days.
    translation: JPS 1917
    original: וְאַחֲרֵי טָהֳרָתוֹ שִׁבְעַת יָמִים יִסְפְּרוּ־לוֹ׃
    hebrewPlain: ואחרי טהרתו שבעת ימים יספרו לו
    kjvRefs:
    - Ezekiel 44:26
    kjvOsis:
    - Ezek.44.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.27
    scripture: tanakh
    name: Tanakh Ezekiel 44:27
    ref: Ezekiel 44:27
    book: Ezek
    section: neviim
    chapter: 44
    verse: 27
    ordinal: 13981
    text: And in the day that he goeth into the sanctuary, into the inner court, to minister in the sanctuary, he shall offer his sin-offering, saith the Lord GOD.
    translation: JPS 1917
    original: וּבְיוֹם בֹּאוֹ אֶל־הַקֹּדֶשׁ אֶל־הֶחָצֵר הַפְּנִימִית לְשָׁרֵת בַּקֹּדֶשׁ יַקְרִיב חַטָּאתוֹ נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: וביום באו אל הקדש אל החצר הפנימית לשרת בקדש יקריב חטאתו נאם אדני יהוה
    kjvRefs:
    - Ezekiel 44:27
    kjvOsis:
    - Ezek.44.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.28
    scripture: tanakh
    name: Tanakh Ezekiel 44:28
    ref: Ezekiel 44:28
    book: Ezek
    section: neviim
    chapter: 44
    verse: 28
    ordinal: 13982
    text: 'And it shall be unto them for an inheritance: I am their inheritance; and ye shall give them no possession in Israel: I am their possession.'
    translation: JPS 1917
    original: וְהָיְתָה לָהֶם לְנַחֲלָה אֲנִי נַחֲלָתָם וַאֲחֻזָּה לֹא־תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל אֲנִי אֲחֻזָּתָם׃
    hebrewPlain: והיתה להם לנחלה אני נחלתם ואחזה לא תתנו להם בישראל אני אחזתם
    kjvRefs:
    - Ezekiel 44:28
    kjvOsis:
    - Ezek.44.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.29
    scripture: tanakh
    name: Tanakh Ezekiel 44:29
    ref: Ezekiel 44:29
    book: Ezek
    section: neviim
    chapter: 44
    verse: 29
    ordinal: 13983
    text: The meal-offering, and the sin-offering, and the guilt-offering, they, even they, shall eat; and every devoted thing in Israel shall be theirs.
    translation: JPS 1917
    original: הַמִּנְחָה וְהַחַטָּאת וְהָאָשָׁם הֵמָּה יֹאכְלוּם וְכָל־חֵרֶם בְּיִשְׂרָאֵל לָהֶם יִהְיֶה׃
    hebrewPlain: המנחה והחטאת והאשם המה יאכלום וכל חרם בישראל להם יהיה
    kjvRefs:
    - Ezekiel 44:29
    kjvOsis:
    - Ezek.44.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.30
    scripture: tanakh
    name: Tanakh Ezekiel 44:30
    ref: Ezekiel 44:30
    book: Ezek
    section: neviim
    chapter: 44
    verse: 30
    ordinal: 13984
    text: And the first of all the first-fruits of every thing, and every heave-offering of every thing, of all your offerings, shall be for the priests; ye shall also give unto the priest the first of your dough, to cause a blessing to rest on thy house.
    translation: JPS 1917
    original: וְרֵאשִׁית כָּל־בִּכּוּרֵי כֹל וְכָל־תְּרוּמַת כֹּל מִכֹּל תְּרוּמוֹתֵיכֶם לַכֹּהֲנִים יִהְיֶה וְרֵאשִׁית עֲרִסוֹתֵיכֶם תִּתְּנוּ לַכֹּהֵן לְהָנִיחַ בְּרָכָה אֶל־בֵּיתֶךָ׃
    hebrewPlain: וראשית כל בכורי כל וכל תרומת כל מכל תרומותיכם לכהנים יהיה וראשית ערסותיכם תתנו לכהן להניח ברכה אל ביתך
    kjvRefs:
    - Ezekiel 44:30
    kjvOsis:
    - Ezek.44.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.44.31
    scripture: tanakh
    name: Tanakh Ezekiel 44:31
    ref: Ezekiel 44:31
    book: Ezek
    section: neviim
    chapter: 44
    verse: 31
    ordinal: 13985
    text: The priests shall not eat of any thing that dieth of itself, or is torn, whether it be fowl or beast.
    translation: JPS 1917
    original: כָּל־נְבֵלָה וּטְרֵפָה מִן־הָעוֹף וּמִן־הַבְּהֵמָה לֹא יֹאכְלוּ הַכֹּהֲנִים׃
    hebrewPlain: כל נבלה וטרפה מן העוף ומן הבהמה לא יאכלו הכהנים
    kjvRefs:
    - Ezekiel 44:31
    kjvOsis:
    - Ezek.44.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.44
- type: TanakhVerse
  data:
    osis: Ezek.45.1
    scripture: tanakh
    name: Tanakh Ezekiel 45:1
    ref: Ezekiel 45:1
    book: Ezek
    section: neviim
    chapter: 45
    verse: 1
    ordinal: 13986
    text: Moreover, when ye shall divide by lot the land for inheritance, ye shall set apart an offering unto the LORD, a holy portion of the land; the length shall be the length of five and twenty thousand reeds, and the breadth shall be ten thousand; it shall be holy in all the border thereof round about.
    translation: JPS 1917
    original: וּבְהַפִּילְכֶם אֶת־הָאָרֶץ בְּנַחֲלָה תָּרִימוּ תְרוּמָה לַיהוָה קֹדֶשׁ מִן־הָאָרֶץ אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וְרֹחַב עֲשָׂרָה אָלֶף קֹדֶשׁ־הוּא בְכָל־גְּבוּלָהּ סָבִיב׃
    hebrewPlain: ובהפילכם את הארץ בנחלה תרימו תרומה ליהוה קדש מן הארץ ארך חמשה ועשרים אלף ארך ורחב עשרה אלף קדש הוא בכל גבולה סביב
    kjvRefs:
    - Ezekiel 45:1
    kjvOsis:
    - Ezek.45.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.2
    scripture: tanakh
    name: Tanakh Ezekiel 45:2
    ref: Ezekiel 45:2
    book: Ezek
    section: neviim
    chapter: 45
    verse: 2
    ordinal: 13987
    text: Of this there shall be for the holy place five hundred in length by five hundred in breadth, square round about; and fifty cubits for the open land round about it.
    translation: JPS 1917
    original: יִהְיֶה מִזֶּה אֶל־הַקֹּדֶשׁ חֲמֵשׁ מֵאוֹת בַּחֲמֵשׁ מֵאוֹת מְרֻבָּע סָבִיב וַחֲמִשִּׁים אַמָּה מִגְרָשׁ לוֹ סָבִיב׃
    hebrewPlain: יהיה מזה אל הקדש חמש מאות בחמש מאות מרבע סביב וחמשים אמה מגרש לו סביב
    kjvRefs:
    - Ezekiel 45:2
    kjvOsis:
    - Ezek.45.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.3
    scripture: tanakh
    name: Tanakh Ezekiel 45:3
    ref: Ezekiel 45:3
    book: Ezek
    section: neviim
    chapter: 45
    verse: 3
    ordinal: 13988
    text: And of this measure shalt thou measure a length of five and twenty thousand, and a breadth of ten thousand; and in it shall be the sanctuary, which is most holy.
    translation: JPS 1917
    original: וּמִן־הַמִּדָּה הַזֹּאת תָּמוֹד אֹרֶךְ חמש [חֲמִשָּׁה] וְעֶשְׂרִים אֶלֶף וְרֹחַב עֲשֶׂרֶת אֲלָפִים וּבוֹ־יִהְיֶה הַמִּקְדָּשׁ קֹדֶשׁ קָדָשִׁים׃
    hebrewPlain: ומן המדה הזאת תמוד ארך חמש [חמשה] ועשרים אלף ורחב עשרת אלפים ובו יהיה המקדש קדש קדשים
    kjvRefs:
    - Ezekiel 45:3
    kjvOsis:
    - Ezek.45.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.4
    scripture: tanakh
    name: Tanakh Ezekiel 45:4
    ref: Ezekiel 45:4
    book: Ezek
    section: neviim
    chapter: 45
    verse: 4
    ordinal: 13989
    text: It is a holy portion of the land; it shall be for the priests, the ministers of the sanctuary, that come near to minister unto the LORD; and it shall be a place for their houses, and a place consecrated for the sanctuary.
    translation: JPS 1917
    original: קֹדֶשׁ מִן־הָאָרֶץ הוּא לַכֹּהֲנִים מְשָׁרְתֵי הַמִּקְדָּשׁ יִהְיֶה הַקְּרֵבִים לְשָׁרֵת אֶת־יְהוָה וְהָיָה לָהֶם מָקוֹם לְבָתִּים וּמִקְדָּשׁ לַמִּקְדָּשׁ׃
    hebrewPlain: קדש מן הארץ הוא לכהנים משרתי המקדש יהיה הקרבים לשרת את יהוה והיה להם מקום לבתים ומקדש למקדש
    kjvRefs:
    - Ezekiel 45:4
    kjvOsis:
    - Ezek.45.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.5
    scripture: tanakh
    name: Tanakh Ezekiel 45:5
    ref: Ezekiel 45:5
    book: Ezek
    section: neviim
    chapter: 45
    verse: 5
    ordinal: 13990
    text: And five and twenty thousand in length, and ten thousand in breadth, which shall be unto the Levites, the ministers of the house, for a possession unto themselves, for twenty chambers.
    translation: JPS 1917
    original: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וַעֲשֶׂרֶת אֲלָפִים רֹחַב יהיה [וְהָיָה] לַלְוִיִּם מְשָׁרְתֵי הַבַּיִת לָהֶם לַאֲחֻזָּה עֶשְׂרִים לְשָׁכֹת׃
    hebrewPlain: וחמשה ועשרים אלף ארך ועשרת אלפים רחב יהיה [והיה] ללוים משרתי הבית להם לאחזה עשרים לשכת
    kjvRefs:
    - Ezekiel 45:5
    kjvOsis:
    - Ezek.45.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.6
    scripture: tanakh
    name: Tanakh Ezekiel 45:6
    ref: Ezekiel 45:6
    book: Ezek
    section: neviim
    chapter: 45
    verse: 6
    ordinal: 13991
    text: And ye shall appoint the possession of the city five thousand broad, and five and twenty thousand long, side by side with the offering of the holy portion; it shall be for the whole house of Israel.
    translation: JPS 1917
    original: וַאֲחֻזַּת הָעִיר תִּתְּנוּ חֲמֵשֶׁת אֲלָפִים רֹחַב וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ לְכָל־בֵּית יִשְׂרָאֵל יִהְיֶה׃
    hebrewPlain: ואחזת העיר תתנו חמשת אלפים רחב וארך חמשה ועשרים אלף לעמת תרומת הקדש לכל בית ישראל יהיה
    kjvRefs:
    - Ezekiel 45:6
    kjvOsis:
    - Ezek.45.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.7
    scripture: tanakh
    name: Tanakh Ezekiel 45:7
    ref: Ezekiel 45:7
    book: Ezek
    section: neviim
    chapter: 45
    verse: 7
    ordinal: 13992
    text: And for the prince, on the one side and on the other side of the holy offering and of the possession of the city, in front of the holy offering and in front of the possession of the city, on the west side westward, and on the east side eastward; and in length answerable unto one of the portions, from the west border unto the east border
    translation: JPS 1917
    original: וְלַנָּשִׂיא מִזֶּה וּמִזֶּה לִתְרוּמַת הַקֹּדֶשׁ וְלַאֲחֻזַּת הָעִיר אֶל־פְּנֵי תְרוּמַת־הַקֹּדֶשׁ וְאֶל־פְּנֵי אֲחֻזַּת הָעִיר מִפְּאַת־יָם יָמָּה וּמִפְּאַת־קֵדְמָה קָדִימָה וְאֹרֶךְ לְעֻמּוֹת אַחַד הַחֲלָקִים מִגְּבוּל יָם אֶל־גְּבוּל קָדִימָה׃
    hebrewPlain: ולנשיא מזה ומזה לתרומת הקדש ולאחזת העיר אל פני תרומת הקדש ואל פני אחזת העיר מפאת ים ימה ומפאת קדמה קדימה וארך לעמות אחד החלקים מגבול ים אל גבול קדימה
    kjvRefs:
    - Ezekiel 45:7
    kjvOsis:
    - Ezek.45.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.8
    scripture: tanakh
    name: Tanakh Ezekiel 45:8
    ref: Ezekiel 45:8
    book: Ezek
    section: neviim
    chapter: 45
    verse: 8
    ordinal: 13993
    text: of the land; it shall be to him for a possession in Israel, and My princes shall no more wrong My people; but they shall give the land to the house of Israel according to their tribes.
    translation: JPS 1917
    original: לָאָרֶץ יִהְיֶה־לּוֹ לַאֲחֻזָּה בְּיִשְׂרָאֵל וְלֹא־יוֹנוּ עוֹד נְשִׂיאַי אֶת־עַמִּי וְהָאָרֶץ יִתְּנוּ לְבֵית־יִשְׂרָאֵל לְשִׁבְטֵיהֶם׃
    hebrewPlain: לארץ יהיה לו לאחזה בישראל ולא יונו עוד נשיאי את עמי והארץ יתנו לבית ישראל לשבטיהם
    kjvRefs:
    - Ezekiel 45:8
    kjvOsis:
    - Ezek.45.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.9
    scripture: tanakh
    name: Tanakh Ezekiel 45:9
    ref: Ezekiel 45:9
    book: Ezek
    section: neviim
    chapter: 45
    verse: 9
    ordinal: 13994
    text: 'Thus saith the Lord GOD: Let it suffice you, O princes of Israel; remove violence and spoil, and execute justice and righteousness; take away your exactions from My people, saith the Lord GOD.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה רַב־לָכֶם נְשִׂיאֵי יִשְׂרָאֵל חָמָס וָשֹׁד הָסִירוּ וּמִשְׁפָּט וּצְדָקָה עֲשׂוּ הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: כה אמר אדני יהוה רב לכם נשיאי ישראל חמס ושד הסירו ומשפט וצדקה עשו הרימו גרשתיכם מעל עמי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 45:9
    kjvOsis:
    - Ezek.45.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.10
    scripture: tanakh
    name: Tanakh Ezekiel 45:10
    ref: Ezekiel 45:10
    book: Ezek
    section: neviim
    chapter: 45
    verse: 10
    ordinal: 13995
    text: Ye shall have just balances, and a just ephah, and a just bath.
    translation: JPS 1917
    original: מֹאזְנֵי־צֶדֶק וְאֵיפַת־צֶדֶק וּבַת־צֶדֶק יְהִי לָכֶם׃
    hebrewPlain: מאזני צדק ואיפת צדק ובת צדק יהי לכם
    kjvRefs:
    - Ezekiel 45:10
    kjvOsis:
    - Ezek.45.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.11
    scripture: tanakh
    name: Tanakh Ezekiel 45:11
    ref: Ezekiel 45:11
    book: Ezek
    section: neviim
    chapter: 45
    verse: 11
    ordinal: 13996
    text: The ephah and the bath shall be of one measure, that the bath may contain the tenth part of a homer, and the ephah the tenth part of a homer; the measure thereof shall be after the homer.
    translation: JPS 1917
    original: הָאֵיפָה וְהַבַּת תֹּכֶן אֶחָד יִהְיֶה לָשֵׂאת מַעְשַׂר הַחֹמֶר הַבָּת וַעֲשִׂירִת הַחֹמֶר הָאֵיפָה אֶל־הַחֹמֶר יִהְיֶה מַתְכֻּנְתּוֹ׃
    hebrewPlain: האיפה והבת תכן אחד יהיה לשאת מעשר החמר הבת ועשירת החמר האיפה אל החמר יהיה מתכנתו
    kjvRefs:
    - Ezekiel 45:11
    kjvOsis:
    - Ezek.45.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.12
    scripture: tanakh
    name: Tanakh Ezekiel 45:12
    ref: Ezekiel 45:12
    book: Ezek
    section: neviim
    chapter: 45
    verse: 12
    ordinal: 13997
    text: And the shekel shall be twenty gerahs; twenty shekels, five and twenty shekels, ten, and five shekels, shall be your maneh.
    translation: JPS 1917
    original: וְהַשֶּׁקֶל עֶשְׂרִים גֵּרָה עֶשְׂרִים שְׁקָלִים חֲמִשָּׁה וְעֶשְׂרִים שְׁקָלִים עֲשָׂרָה וַחֲמִשָּׁה שֶׁקֶל הַמָּנֶה יִהְיֶה לָכֶם׃
    hebrewPlain: והשקל עשרים גרה עשרים שקלים חמשה ועשרים שקלים עשרה וחמשה שקל המנה יהיה לכם
    kjvRefs:
    - Ezekiel 45:12
    kjvOsis:
    - Ezek.45.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.13
    scripture: tanakh
    name: Tanakh Ezekiel 45:13
    ref: Ezekiel 45:13
    book: Ezek
    section: neviim
    chapter: 45
    verse: 13
    ordinal: 13998
    text: 'This is the offering that ye shall set apart: the sixth part of an ephah out of a homer of wheat, and ye shall give the sixth part of an ephah out of a homer of barley;'
    translation: JPS 1917
    original: זֹאת הַתְּרוּמָה אֲשֶׁר תָּרִימוּ שִׁשִּׁית הָאֵיפָה מֵחֹמֶר הַחִטִּים וְשִׁשִּׁיתֶם הָאֵיפָה מֵחֹמֶר הַשְּׂעֹרִים׃
    hebrewPlain: זאת התרומה אשר תרימו ששית האיפה מחמר החטים וששיתם האיפה מחמר השערים
    kjvRefs:
    - Ezekiel 45:13
    kjvOsis:
    - Ezek.45.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.14
    scripture: tanakh
    name: Tanakh Ezekiel 45:14
    ref: Ezekiel 45:14
    book: Ezek
    section: neviim
    chapter: 45
    verse: 14
    ordinal: 13999
    text: and the set portion of oil, the bath of oil, shall be the tithe of the bath out of the cor, which is ten baths, even a homer; for ten baths are a homer;
    translation: JPS 1917
    original: וְחֹק הַשֶּׁמֶן הַבַּת הַשֶּׁמֶן מַעְשַׂר הַבַּת מִן־הַכֹּר עֲשֶׂרֶת הַבַּתִּים חֹמֶר כִּי־עֲשֶׂרֶת הַבַּתִּים חֹמֶר׃
    hebrewPlain: וחק השמן הבת השמן מעשר הבת מן הכר עשרת הבתים חמר כי עשרת הבתים חמר
    kjvRefs:
    - Ezekiel 45:14
    kjvOsis:
    - Ezek.45.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.15
    scripture: tanakh
    name: Tanakh Ezekiel 45:15
    ref: Ezekiel 45:15
    book: Ezek
    section: neviim
    chapter: 45
    verse: 15
    ordinal: 14000
    text: and one lamb of the flock, out of two hundred, from the well-watered pastures of Israel; for a meal-offering, and for a burnt-offering, and for peace-offerings, to make atonement for them, saith the Lord GOD.
    translation: JPS 1917
    original: וְשֶׂה־אַחַת מִן־הַצֹּאן מִן־הַמָּאתַיִם מִמַּשְׁקֵה יִשְׂרָאֵל לְמִנְחָה וּלְעוֹלָה וְלִשְׁלָמִים לְכַפֵּר עֲלֵיהֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ושה אחת מן הצאן מן המאתים ממשקה ישראל למנחה ולעולה ולשלמים לכפר עליהם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 45:15
    kjvOsis:
    - Ezek.45.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.16
    scripture: tanakh
    name: Tanakh Ezekiel 45:16
    ref: Ezekiel 45:16
    book: Ezek
    section: neviim
    chapter: 45
    verse: 16
    ordinal: 14001
    text: All the people of the land shall give this offering for the prince in Israel.
    translation: JPS 1917
    original: כֹּל הָעָם הָאָרֶץ יִהְיוּ אֶל־הַתְּרוּמָה הַזֹּאת לַנָּשִׂיא בְּיִשְׂרָאֵל׃
    hebrewPlain: כל העם הארץ יהיו אל התרומה הזאת לנשיא בישראל
    kjvRefs:
    - Ezekiel 45:16
    kjvOsis:
    - Ezek.45.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.17
    scripture: tanakh
    name: Tanakh Ezekiel 45:17
    ref: Ezekiel 45:17
    book: Ezek
    section: neviim
    chapter: 45
    verse: 17
    ordinal: 14002
    text: And it shall be the prince’s part to give the burnt-offerings, and the meal-offerings, and the drink-offerings, in the feasts, and in the new moons, and in the sabbaths, in all the appointed seasons of the house of Israel; he shall prepare the sin-offering, and the meal-offering, and the burnt-offering, and the peace-offerings, to make atonement for the house of Israel.
    translation: JPS 1917
    original: וְעַל־הַנָּשִׂיא יִהְיֶה הָעוֹלוֹת וְהַמִּנְחָה וְהַנֵּסֶךְ בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת בְּכָל־מוֹעֲדֵי בֵּית יִשְׂרָאֵל הוּא־יַעֲשֶׂה אֶת־הַחַטָּאת וְאֶת־הַמִּנְחָה וְאֶת־הָעוֹלָה וְאֶת־הַשְּׁלָמִים לְכַפֵּר בְּעַד בֵּית־יִשְׂרָאֵל׃
    hebrewPlain: ועל הנשיא יהיה העולות והמנחה והנסך בחגים ובחדשים ובשבתות בכל מועדי בית ישראל הוא יעשה את החטאת ואת המנחה ואת העולה ואת השלמים לכפר בעד בית ישראל
    kjvRefs:
    - Ezekiel 45:17
    kjvOsis:
    - Ezek.45.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.18
    scripture: tanakh
    name: Tanakh Ezekiel 45:18
    ref: Ezekiel 45:18
    book: Ezek
    section: neviim
    chapter: 45
    verse: 18
    ordinal: 14003
    text: 'Thus saith the Lord GOD: In the first month, in the first day of the month, thou shalt take a young bullock without blemish; and thou shalt purify the sanctuary.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ תִּקַּח פַּר־בֶּן־בָּקָר תָּמִים וְחִטֵּאתָ אֶת־הַמִּקְדָּשׁ׃
    hebrewPlain: כה אמר אדני יהוה בראשון באחד לחדש תקח פר בן בקר תמים וחטאת את המקדש
    kjvRefs:
    - Ezekiel 45:18
    kjvOsis:
    - Ezek.45.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.19
    scripture: tanakh
    name: Tanakh Ezekiel 45:19
    ref: Ezekiel 45:19
    book: Ezek
    section: neviim
    chapter: 45
    verse: 19
    ordinal: 14004
    text: And the priest shall take of the blood of the sin-offering, and put it upon the door-posts of the house, and upon the four corners of the settle of the altar, and upon the posts of the gate of the inner court.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן מִדַּם הַחַטָּאת וְנָתַן אֶל־מְזוּזַת הַבַּיִת וְאֶל־אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ וְעַל־מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית׃
    hebrewPlain: ולקח הכהן מדם החטאת ונתן אל מזוזת הבית ואל ארבע פנות העזרה למזבח ועל מזוזת שער החצר הפנימית
    kjvRefs:
    - Ezekiel 45:19
    kjvOsis:
    - Ezek.45.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.20
    scripture: tanakh
    name: Tanakh Ezekiel 45:20
    ref: Ezekiel 45:20
    book: Ezek
    section: neviim
    chapter: 45
    verse: 20
    ordinal: 14005
    text: And so thou shalt do on the seventh day of the month for every one that erreth, and for him that is simple; so shall ye make atonement for the house.
    translation: JPS 1917
    original: וְכֵן תַּעֲשֶׂה בְּשִׁבְעָה בַחֹדֶשׁ מֵאִישׁ שֹׁגֶה וּמִפֶּתִי וְכִפַּרְתֶּם אֶת־הַבָּיִת׃
    hebrewPlain: וכן תעשה בשבעה בחדש מאיש שגה ומפתי וכפרתם את הבית
    kjvRefs:
    - Ezekiel 45:20
    kjvOsis:
    - Ezek.45.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.21
    scripture: tanakh
    name: Tanakh Ezekiel 45:21
    ref: Ezekiel 45:21
    book: Ezek
    section: neviim
    chapter: 45
    verse: 21
    ordinal: 14006
    text: In the first month, in the fourteenth day of the month, ye shall have the passover; a feast of seven days; unleavened bread shall be eaten.
    translation: JPS 1917
    original: בָּרִאשׁוֹן בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ יִהְיֶה לָכֶם הַפָּסַח חָג שְׁבֻעוֹת יָמִים מַצּוֹת יֵאָכֵל׃
    hebrewPlain: בראשון בארבעה עשר יום לחדש יהיה לכם הפסח חג שבעות ימים מצות יאכל
    kjvRefs:
    - Ezekiel 45:21
    kjvOsis:
    - Ezek.45.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.22
    scripture: tanakh
    name: Tanakh Ezekiel 45:22
    ref: Ezekiel 45:22
    book: Ezek
    section: neviim
    chapter: 45
    verse: 22
    ordinal: 14007
    text: And upon that day shall the prince prepare for himself and for all the people of the land a bullock for a sin-offering.
    translation: JPS 1917
    original: וְעָשָׂה הַנָּשִׂיא בַּיּוֹם הַהוּא בַּעֲדוֹ וּבְעַד כָּל־עַם הָאָרֶץ פַּר חַטָּאת׃
    hebrewPlain: ועשה הנשיא ביום ההוא בעדו ובעד כל עם הארץ פר חטאת
    kjvRefs:
    - Ezekiel 45:22
    kjvOsis:
    - Ezek.45.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.23
    scripture: tanakh
    name: Tanakh Ezekiel 45:23
    ref: Ezekiel 45:23
    book: Ezek
    section: neviim
    chapter: 45
    verse: 23
    ordinal: 14008
    text: And the seven days of the feast he shall prepare a burnt-offering to the LORD, seven bullocks and seven rams without blemish daily the seven days; and a he-goat daily for a sin-offering.
    translation: JPS 1917
    original: וְשִׁבְעַת יְמֵי־הֶחָג יַעֲשֶׂה עוֹלָה לַיהוָה שִׁבְעַת פָּרִים וְשִׁבְעַת אֵילִים תְּמִימִם לַיּוֹם שִׁבְעַת הַיָּמִים וְחַטָּאת שְׂעִיר עִזִּים לַיּוֹם׃
    hebrewPlain: ושבעת ימי החג יעשה עולה ליהוה שבעת פרים ושבעת אילים תמימם ליום שבעת הימים וחטאת שעיר עזים ליום
    kjvRefs:
    - Ezekiel 45:23
    kjvOsis:
    - Ezek.45.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.24
    scripture: tanakh
    name: Tanakh Ezekiel 45:24
    ref: Ezekiel 45:24
    book: Ezek
    section: neviim
    chapter: 45
    verse: 24
    ordinal: 14009
    text: And he shall prepare a meal-offering, an ephah for a bullock, and an ephah for a ram, and a hin of oil to an ephah.
    translation: JPS 1917
    original: וּמִנְחָה אֵיפָה לַפָּר וְאֵיפָה לָאַיִל יַעֲשֶׂה וְשֶׁמֶן הִין לָאֵיפָה׃
    hebrewPlain: ומנחה איפה לפר ואיפה לאיל יעשה ושמן הין לאיפה
    kjvRefs:
    - Ezekiel 45:24
    kjvOsis:
    - Ezek.45.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.45.25
    scripture: tanakh
    name: Tanakh Ezekiel 45:25
    ref: Ezekiel 45:25
    book: Ezek
    section: neviim
    chapter: 45
    verse: 25
    ordinal: 14010
    text: In the seventh month, in the fifteenth day of the month, in the feast, shall he do the like the seven days; to the sin-offering as well as the burnt-offering, and the meal-offering as well as the oil.
    translation: JPS 1917
    original: בַּשְּׁבִיעִי בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ בֶּחָג יַעֲשֶׂה כָאֵלֶּה שִׁבְעַת הַיָּמִים כַּחַטָּאת כָּעֹלָה וְכַמִּנְחָה וְכַשָּׁמֶן׃
    hebrewPlain: בשביעי בחמשה עשר יום לחדש בחג יעשה כאלה שבעת הימים כחטאת כעלה וכמנחה וכשמן
    kjvRefs:
    - Ezekiel 45:25
    kjvOsis:
    - Ezek.45.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.45
- type: TanakhVerse
  data:
    osis: Ezek.46.1
    scripture: tanakh
    name: Tanakh Ezekiel 46:1
    ref: Ezekiel 46:1
    book: Ezek
    section: neviim
    chapter: 46
    verse: 1
    ordinal: 14011
    text: 'Thus saith the Lord GOD: The gate of the inner court that looketh toward the east shall be shut the six working days; but on the sabbath day it shall be opened, and in the day of the new moon it shall be opened.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה שַׁעַר הֶחָצֵר הַפְּנִימִית הַפֹּנֶה קָדִים יִהְיֶה סָגוּר שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה וּבְיוֹם הַשַּׁבָּת יִפָּתֵחַ וּבְיוֹם הַחֹדֶשׁ יִפָּתֵחַ׃
    hebrewPlain: כה אמר אדני יהוה שער החצר הפנימית הפנה קדים יהיה סגור ששת ימי המעשה וביום השבת יפתח וביום החדש יפתח
    kjvRefs:
    - Ezekiel 46:1
    kjvOsis:
    - Ezek.46.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.2
    scripture: tanakh
    name: Tanakh Ezekiel 46:2
    ref: Ezekiel 46:2
    book: Ezek
    section: neviim
    chapter: 46
    verse: 2
    ordinal: 14012
    text: And the prince shall enter by the way of the porch of the gate without, and shall stand by the post of the gate, and the priests shall prepare his burnt-offering and his peace-offerings, and he shall worship at the threshold of the gate; then he shall go forth; but the gate shall not be shut until the evening.
    translation: JPS 1917
    original: וּבָא הַנָּשִׂיא דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ וְעָמַד עַל־מְזוּזַת הַשַּׁעַר וְעָשׂוּ הַכֹּהֲנִים אֶת־עוֹלָתוֹ וְאֶת־שְׁלָמָיו וְהִשְׁתַּחֲוָה עַל־מִפְתַּן הַשַּׁעַר וְיָצָא וְהַשַּׁעַר לֹא־יִסָּגֵר עַד־הָעָרֶב׃
    hebrewPlain: ובא הנשיא דרך אולם השער מחוץ ועמד על מזוזת השער ועשו הכהנים את עולתו ואת שלמיו והשתחוה על מפתן השער ויצא והשער לא יסגר עד הערב
    kjvRefs:
    - Ezekiel 46:2
    kjvOsis:
    - Ezek.46.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.3
    scripture: tanakh
    name: Tanakh Ezekiel 46:3
    ref: Ezekiel 46:3
    book: Ezek
    section: neviim
    chapter: 46
    verse: 3
    ordinal: 14013
    text: Likewise the people of the land shall worship at the door of that gate before the LORD in the sabbaths and in the new moons.
    translation: JPS 1917
    original: וְהִשְׁתַּחֲווּ עַם־הָאָרֶץ פֶּתַח הַשַּׁעַר הַהוּא בַּשַּׁבָּתוֹת וּבֶחֳדָשִׁים לִפְנֵי יְהוָה׃
    hebrewPlain: והשתחוו עם הארץ פתח השער ההוא בשבתות ובחדשים לפני יהוה
    kjvRefs:
    - Ezekiel 46:3
    kjvOsis:
    - Ezek.46.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.4
    scripture: tanakh
    name: Tanakh Ezekiel 46:4
    ref: Ezekiel 46:4
    book: Ezek
    section: neviim
    chapter: 46
    verse: 4
    ordinal: 14014
    text: And the burnt-offering that the prince shall offer unto the LORD shall be in the sabbath day six lambs without blemish and a ram without blemish;
    translation: JPS 1917
    original: וְהָעֹלָה אֲשֶׁר־יַקְרִב הַנָּשִׂיא לַיהוָה בְּיוֹם הַשַּׁבָּת שִׁשָּׁה כְבָשִׂים תְּמִימִם וְאַיִל תָּמִים׃
    hebrewPlain: והעלה אשר יקרב הנשיא ליהוה ביום השבת ששה כבשים תמימם ואיל תמים
    kjvRefs:
    - Ezekiel 46:4
    kjvOsis:
    - Ezek.46.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.5
    scripture: tanakh
    name: Tanakh Ezekiel 46:5
    ref: Ezekiel 46:5
    book: Ezek
    section: neviim
    chapter: 46
    verse: 5
    ordinal: 14015
    text: and the meal-offering shall be an ephah for the ram, and the meal-offering for the lambs as he is able to give, and a hin of oil to an ephah.
    translation: JPS 1917
    original: וּמִנְחָה אֵיפָה לָאַיִל וְלַכְּבָשִׂים מִנְחָה מַתַּת יָדוֹ וְשֶׁמֶן הִין לָאֵיפָה׃
    hebrewPlain: ומנחה איפה לאיל ולכבשים מנחה מתת ידו ושמן הין לאיפה
    kjvRefs:
    - Ezekiel 46:5
    kjvOsis:
    - Ezek.46.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.6
    scripture: tanakh
    name: Tanakh Ezekiel 46:6
    ref: Ezekiel 46:6
    book: Ezek
    section: neviim
    chapter: 46
    verse: 6
    ordinal: 14016
    text: And in the day of the new moon it shall be a young bullock without blemish; and six lambs, and a ram; they shall be without blemish;
    translation: JPS 1917
    original: וּבְיוֹם הַחֹדֶשׁ פַּר בֶּן־בָּקָר תְּמִימִם וְשֵׁשֶׁת כְּבָשִׂם וָאַיִל תְּמִימִם יִהְיוּ׃
    hebrewPlain: וביום החדש פר בן בקר תמימם וששת כבשם ואיל תמימם יהיו
    kjvRefs:
    - Ezekiel 46:6
    kjvOsis:
    - Ezek.46.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.7
    scripture: tanakh
    name: Tanakh Ezekiel 46:7
    ref: Ezekiel 46:7
    book: Ezek
    section: neviim
    chapter: 46
    verse: 7
    ordinal: 14017
    text: and he shall prepare a meal-offering, an ephah for the bullock, and an ephah for the ram, and for the lambs according as his means suffice, and a hin of oil to an ephah.
    translation: JPS 1917
    original: וְאֵיפָה לַפָּר וְאֵיפָה לָאַיִל יַעֲשֶׂה מִנְחָה וְלַכְּבָשִׂים כַּאֲשֶׁר תַּשִּׂיג יָדוֹ וְשֶׁמֶן הִין לָאֵיפָה׃
    hebrewPlain: ואיפה לפר ואיפה לאיל יעשה מנחה ולכבשים כאשר תשיג ידו ושמן הין לאיפה
    kjvRefs:
    - Ezekiel 46:7
    kjvOsis:
    - Ezek.46.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.8
    scripture: tanakh
    name: Tanakh Ezekiel 46:8
    ref: Ezekiel 46:8
    book: Ezek
    section: neviim
    chapter: 46
    verse: 8
    ordinal: 14018
    text: And when the prince shall enter, he shall go in by the way of the porch of the gate, and he shall go forth by the way thereof.
    translation: JPS 1917
    original: וּבְבוֹא הַנָּשִׂיא דֶּרֶךְ אוּלָם הַשַּׁעַר יָבוֹא וּבְדַרְכּוֹ יֵצֵא׃
    hebrewPlain: ובבוא הנשיא דרך אולם השער יבוא ובדרכו יצא
    kjvRefs:
    - Ezekiel 46:8
    kjvOsis:
    - Ezek.46.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.9
    scripture: tanakh
    name: Tanakh Ezekiel 46:9
    ref: Ezekiel 46:9
    book: Ezek
    section: neviim
    chapter: 46
    verse: 9
    ordinal: 14019
    text: But when the people of the land shall come before the LORD in the appointed seasons, he that entereth by the way of the north gate to worship shall go forth by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate; he shall not return by the way of the gate whereby he came in, but shall go forth straight before him.
    translation: JPS 1917
    original: וּבְבוֹא עַם־הָאָרֶץ לִפְנֵי יְהוָה בַּמּוֹעֲדִים הַבָּא דֶּרֶךְ־שַׁעַר צָפוֹן לְהִשְׁתַּחֲוֺת יֵצֵא דֶּרֶךְ־שַׁעַר נֶגֶב וְהַבָּא דֶּרֶךְ־שַׁעַר נֶגֶב יֵצֵא דֶּרֶךְ־שַׁעַר צָפוֹנָה לֹא יָשׁוּב דֶּרֶךְ הַשַּׁעַר אֲשֶׁר־בָּא בוֹ כִּי נִכְחוֹ יצאו [יֵצֵא׃]
    hebrewPlain: ובבוא עם הארץ לפני יהוה במועדים הבא דרך שער צפון להשתחות יצא דרך שער נגב והבא דרך שער נגב יצא דרך שער צפונה לא ישוב דרך השער אשר בא בו כי נכחו יצאו [יצא]
    kjvRefs:
    - Ezekiel 46:9
    kjvOsis:
    - Ezek.46.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.10
    scripture: tanakh
    name: Tanakh Ezekiel 46:10
    ref: Ezekiel 46:10
    book: Ezek
    section: neviim
    chapter: 46
    verse: 10
    ordinal: 14020
    text: And the prince, when they go in, shall go in in the midst of them; and when they go forth, they shall go forth together.
    translation: JPS 1917
    original: וְהַנָּשִׂיא בְּתוֹכָם בְּבוֹאָם יָבוֹא וּבְצֵאתָם יֵצֵאוּ׃
    hebrewPlain: והנשיא בתוכם בבואם יבוא ובצאתם יצאו
    kjvRefs:
    - Ezekiel 46:10
    kjvOsis:
    - Ezek.46.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.11
    scripture: tanakh
    name: Tanakh Ezekiel 46:11
    ref: Ezekiel 46:11
    book: Ezek
    section: neviim
    chapter: 46
    verse: 11
    ordinal: 14021
    text: And in the feasts and in the appointed seasons the meal-offering shall be an ephah for a bullock, and an ephah for a ram, and for the lambs as he is able to give, and a hin of oil to an ephah.
    translation: JPS 1917
    original: וּבַחַגִּים וּבַמּוֹעֲדִים תִּהְיֶה הַמִּנְחָה אֵיפָה לַפָּר וְאֵיפָה לָאַיִל וְלַכְּבָשִׂים מַתַּת יָדוֹ וְשֶׁמֶן הִין לָאֵיפָה׃
    hebrewPlain: ובחגים ובמועדים תהיה המנחה איפה לפר ואיפה לאיל ולכבשים מתת ידו ושמן הין לאיפה
    kjvRefs:
    - Ezekiel 46:11
    kjvOsis:
    - Ezek.46.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.12
    scripture: tanakh
    name: Tanakh Ezekiel 46:12
    ref: Ezekiel 46:12
    book: Ezek
    section: neviim
    chapter: 46
    verse: 12
    ordinal: 14022
    text: And when the prince shall prepare a freewill-offering, a burnt-offering or peace-offerings as a freewill-offering unto the LORD, one shall open for him the gate that looketh toward the east, and he shall prepare his burnt-offering and his peace-offerings, as he doth on the sabbath day; then he shall go forth; and after his going forth one shall shut the gate.
    translation: JPS 1917
    original: וְכִי־יַעֲשֶׂה הַנָּשִׂיא נְדָבָה עוֹלָה אוֹ־שְׁלָמִים נְדָבָה לַיהוָה וּפָתַח לוֹ אֶת הַשַּׁעַר הַפֹּנֶה קָדִים וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־שְׁלָמָיו כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת וְיָצָא וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ׃
    hebrewPlain: וכי יעשה הנשיא נדבה עולה או שלמים נדבה ליהוה ופתח לו את השער הפנה קדים ועשה את עלתו ואת שלמיו כאשר יעשה ביום השבת ויצא וסגר את השער אחרי צאתו
    kjvRefs:
    - Ezekiel 46:12
    kjvOsis:
    - Ezek.46.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.13
    scripture: tanakh
    name: Tanakh Ezekiel 46:13
    ref: Ezekiel 46:13
    book: Ezek
    section: neviim
    chapter: 46
    verse: 13
    ordinal: 14023
    text: And thou shalt prepare a lamb of the first year without blemish for a burnt-offering unto the LORD daily; morning by morning shalt thou prepare it.
    translation: JPS 1917
    original: וְכֶבֶשׂ בֶּן־שְׁנָתוֹ תָּמִים תַּעֲשֶׂה עוֹלָה לַיּוֹם לַיהֹוָה בַּבֹּקֶר בַּבֹּקֶר תַּעֲשֶׂה אֹתוֹ׃
    hebrewPlain: וכבש בן שנתו תמים תעשה עולה ליום ליהוה בבקר בבקר תעשה אתו
    kjvRefs:
    - Ezekiel 46:13
    kjvOsis:
    - Ezek.46.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.14
    scripture: tanakh
    name: Tanakh Ezekiel 46:14
    ref: Ezekiel 46:14
    book: Ezek
    section: neviim
    chapter: 46
    verse: 14
    ordinal: 14024
    text: 'And thou shalt prepare a meal-offering with it morning by morning, the sixth part of an ephah, and the third part of a hin of oil, to moisten the fine flour: a meal-offering unto the LORD continually by a perpetual ordinance.'
    translation: JPS 1917
    original: וּמִנְחָה תַעֲשֶׂה עָלָיו בַּבֹּקֶר בַּבֹּקֶר שִׁשִּׁית הָאֵיפָה וְשֶׁמֶן שְׁלִישִׁית הַהִין לָרֹס אֶת־הַסֹּלֶת מִנְחָה לַיהוָה חֻקּוֹת עוֹלָם תָּמִיד׃
    hebrewPlain: ומנחה תעשה עליו בבקר בבקר ששית האיפה ושמן שלישית ההין לרס את הסלת מנחה ליהוה חקות עולם תמיד
    kjvRefs:
    - Ezekiel 46:14
    kjvOsis:
    - Ezek.46.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.15
    scripture: tanakh
    name: Tanakh Ezekiel 46:15
    ref: Ezekiel 46:15
    book: Ezek
    section: neviim
    chapter: 46
    verse: 15
    ordinal: 14025
    text: Thus shall they prepare the lamb, and the meal-offering, and the oil, morning by morning, for a continual burnt-offering.
    translation: JPS 1917
    original: ועשו [יַעֲשׂוּ] אֶת־הַכֶּבֶשׂ וְאֶת־הַמִּנְחָה וְאֶת־הַשֶּׁמֶן בַּבֹּקֶר בַּבֹּקֶר עוֹלַת תָּמִיד׃
    hebrewPlain: ועשו [יעשו] את הכבש ואת המנחה ואת השמן בבקר בבקר עולת תמיד
    kjvRefs:
    - Ezekiel 46:15
    kjvOsis:
    - Ezek.46.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.16
    scripture: tanakh
    name: Tanakh Ezekiel 46:16
    ref: Ezekiel 46:16
    book: Ezek
    section: neviim
    chapter: 46
    verse: 16
    ordinal: 14026
    text: 'Thus saith the Lord GOD: If the prince give a gift unto any of his sons, it is his inheritance, it shall belong to his sons; it is their possession by inheritance.'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהֹוִה כִּי־יִתֵּן הַנָּשִׂיא מַתָּנָה לְאִישׁ מִבָּנָיו נַחֲלָתוֹ הִיא לְבָנָיו תִּהְיֶה אֲחֻזָּתָם הִיא בְּנַחֲלָה׃
    hebrewPlain: כה אמר אדני יהוה כי יתן הנשיא מתנה לאיש מבניו נחלתו היא לבניו תהיה אחזתם היא בנחלה
    kjvRefs:
    - Ezekiel 46:16
    kjvOsis:
    - Ezek.46.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.17
    scripture: tanakh
    name: Tanakh Ezekiel 46:17
    ref: Ezekiel 46:17
    book: Ezek
    section: neviim
    chapter: 46
    verse: 17
    ordinal: 14027
    text: But if he give of his inheritance a gift to one of his servants, it shall be his to the year of liberty; then it shall return to the prince; but as for his inheritance, it shall be for his sons.
    translation: JPS 1917
    original: וְכִי־יִתֵּן מַתָּנָה מִנַּחֲלָתוֹ לְאַחַד מֵעֲבָדָיו וְהָיְתָה לּוֹ עַד־שְׁנַת הַדְּרוֹר וְשָׁבַת לַנָּשִׂיא אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה׃
    hebrewPlain: וכי יתן מתנה מנחלתו לאחד מעבדיו והיתה לו עד שנת הדרור ושבת לנשיא אך נחלתו בניו להם תהיה
    kjvRefs:
    - Ezekiel 46:17
    kjvOsis:
    - Ezek.46.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.18
    scripture: tanakh
    name: Tanakh Ezekiel 46:18
    ref: Ezekiel 46:18
    book: Ezek
    section: neviim
    chapter: 46
    verse: 18
    ordinal: 14028
    text: Moreover the prince shall not take of the people’s inheritance, to thrust them wrongfully out of their possession; he shall give inheritance to his sons out of his own possession; that My people be not scattered every man from his possession.’
    translation: JPS 1917
    original: וְלֹא־יִקַּח הַנָּשִׂיא מִנַּחֲלַת הָעָם לְהוֹנֹתָם מֵאֲחֻזָּתָם מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו לְמַעַן אֲשֶׁר לֹא־יָפֻצוּ עַמִּי אִישׁ מֵאֲחֻזָּתוֹ׃
    hebrewPlain: ולא יקח הנשיא מנחלת העם להונתם מאחזתם מאחזתו ינחל את בניו למען אשר לא יפצו עמי איש מאחזתו
    kjvRefs:
    - Ezekiel 46:18
    kjvOsis:
    - Ezek.46.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.19
    scripture: tanakh
    name: Tanakh Ezekiel 46:19
    ref: Ezekiel 46:19
    book: Ezek
    section: neviim
    chapter: 46
    verse: 19
    ordinal: 14029
    text: Then he brought me through the entry, which was at the side of the gate, into the holy chambers for the priests, which looked toward the north; and, behold, there was a place on the hinder part westward.
    translation: JPS 1917
    original: וַיְבִיאֵנִי בַמָּבוֹא אֲשֶׁר עַל־כֶּתֶף הַשַּׁעַר אֶל־הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל־הַכֹּהֲנִים הַפֹּנוֹת צָפוֹנָה וְהִנֵּה־שָׁם מָקוֹם בירכתם [בַּיַּרְכָתַיִם] יָמָּה׃
    hebrewPlain: ויביאני במבוא אשר על כתף השער אל הלשכות הקדש אל הכהנים הפנות צפונה והנה שם מקום בירכתם [בירכתים] ימה
    kjvRefs:
    - Ezekiel 46:19
    kjvOsis:
    - Ezek.46.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.20
    scripture: tanakh
    name: Tanakh Ezekiel 46:20
    ref: Ezekiel 46:20
    book: Ezek
    section: neviim
    chapter: 46
    verse: 20
    ordinal: 14030
    text: 'And he said unto me: ‘This is the place where the priests shall boil the guilt-offering and the sin-offering, where they shall bake the meal-offering; that they bring them not forth into the outer court, to sanctify the people.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי זֶה הַמָּקוֹם אֲשֶׁר יְבַשְּׁלוּ־שָׁם הַכֹּהֲנִים אֶת־הָאָשָׁם וְאֶת־הַחַטָּאת אֲשֶׁר יֹאפוּ אֶת־הַמִּנְחָה לְבִלְתִּי הוֹצִיא אֶל־הֶחָצֵר הַחִיצוֹנָה לְקַדֵּשׁ אֶת־הָעָם׃
    hebrewPlain: ויאמר אלי זה המקום אשר יבשלו שם הכהנים את האשם ואת החטאת אשר יאפו את המנחה לבלתי הוציא אל החצר החיצונה לקדש את העם
    kjvRefs:
    - Ezekiel 46:20
    kjvOsis:
    - Ezek.46.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.21
    scripture: tanakh
    name: Tanakh Ezekiel 46:21
    ref: Ezekiel 46:21
    book: Ezek
    section: neviim
    chapter: 46
    verse: 21
    ordinal: 14031
    text: Then he brought me forth into the outer court, and caused me to pass by the four corners of the court; and, behold, in every corner of the court there was a court.
    translation: JPS 1917
    original: וַיּוֹצִיאֵנִי אֶל־הֶחָצֵר הַחִיצֹנָה וַיַּעֲבִירֵנִי אֶל־אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר וְהִנֵּה חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר׃
    hebrewPlain: ויוציאני אל החצר החיצנה ויעבירני אל ארבעת מקצועי החצר והנה חצר במקצע החצר חצר במקצע החצר
    kjvRefs:
    - Ezekiel 46:21
    kjvOsis:
    - Ezek.46.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.22
    scripture: tanakh
    name: Tanakh Ezekiel 46:22
    ref: Ezekiel 46:22
    book: Ezek
    section: neviim
    chapter: 46
    verse: 22
    ordinal: 14032
    text: In the four corners of the court there were courts inclosed, forty cubits long and thirty broad; these four in the corners were of one measure.
    translation: JPS 1917
    original: בְּאַרְבַּעַת מִקְצֹעוֹת הֶחָצֵר חֲצֵרוֹת קְטֻרוֹת אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב מִדָּה אַחַת לְאַרְבַּעְתָּם מְהֻקְצָעוֹת׃
    hebrewPlain: בארבעת מקצעות החצר חצרות קטרות ארבעים ארך ושלשים רחב מדה אחת לארבעתם מהקצעות
    kjvRefs:
    - Ezekiel 46:22
    kjvOsis:
    - Ezek.46.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.23
    scripture: tanakh
    name: Tanakh Ezekiel 46:23
    ref: Ezekiel 46:23
    book: Ezek
    section: neviim
    chapter: 46
    verse: 23
    ordinal: 14033
    text: And there was a row of masonry round about in them, round about the four, and it was made with boiling-places under the rows round about.
    translation: JPS 1917
    original: וְטוּר סָבִיב בָּהֶם סָבִיב לְאַרְבַּעְתָּם וּמְבַשְּׁלוֹת עָשׂוּי מִתַּחַת הַטִּירוֹת סָבִיב׃
    hebrewPlain: וטור סביב בהם סביב לארבעתם ומבשלות עשוי מתחת הטירות סביב
    kjvRefs:
    - Ezekiel 46:23
    kjvOsis:
    - Ezek.46.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.46.24
    scripture: tanakh
    name: Tanakh Ezekiel 46:24
    ref: Ezekiel 46:24
    book: Ezek
    section: neviim
    chapter: 46
    verse: 24
    ordinal: 14034
    text: 'Then said he unto me: ‘These are the boiling-places, where the ministers of the house shall boil the sacrifices of the people.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָי אֵלֶּה בֵּית הַמְבַשְּׁלִים אֲשֶׁר יְבַשְּׁלוּ־שָׁם מְשָׁרְתֵי הַבַּיִת אֶת־זֶבַח הָעָם׃
    hebrewPlain: ויאמר אלי אלה בית המבשלים אשר יבשלו שם משרתי הבית את זבח העם
    kjvRefs:
    - Ezekiel 46:24
    kjvOsis:
    - Ezek.46.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.46
- type: TanakhVerse
  data:
    osis: Ezek.47.1
    scripture: tanakh
    name: Tanakh Ezekiel 47:1
    ref: Ezekiel 47:1
    book: Ezek
    section: neviim
    chapter: 47
    verse: 1
    ordinal: 14035
    text: And he brought me back unto the door of the house; and, behold, waters issued out from under the threshold of the house eastward, for the forefront of the house looked toward the east; and the waters came down from under, from the right side of the house, on the south of the altar.
    translation: JPS 1917
    original: וַיְשִׁבֵנִי אֶל־פֶּתַח הַבַּיִת וְהִנֵּה־מַיִם יֹצְאִים מִתַּחַת מִפְתַּן הַבַּיִת קָדִימָה כִּי־פְנֵי הַבַּיִת קָדִים וְהַמַּיִם יֹרְדִים מִתַּחַת מִכֶּתֶף הַבַּיִת הַיְמָנִית מִנֶּגֶב לַמִּזְבֵּחַ׃
    hebrewPlain: וישבני אל פתח הבית והנה מים יצאים מתחת מפתן הבית קדימה כי פני הבית קדים והמים ירדים מתחת מכתף הבית הימנית מנגב למזבח
    kjvRefs:
    - Ezekiel 47:1
    kjvOsis:
    - Ezek.47.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.2
    scripture: tanakh
    name: Tanakh Ezekiel 47:2
    ref: Ezekiel 47:2
    book: Ezek
    section: neviim
    chapter: 47
    verse: 2
    ordinal: 14036
    text: Then brought he me out by the way of the gate northward, and led me round by the way without unto the outer gate, by the way of the gate that looketh toward the east; and, behold, there trickled forth waters on the right side.
    translation: JPS 1917
    original: וַיּוֹצִאֵנִי דֶּרֶךְ־שַׁעַר צָפוֹנָה וַיְסִבֵּנִי דֶּרֶךְ חוּץ אֶל־שַׁעַר הַחוּץ דֶּרֶךְ הַפּוֹנֶה קָדִים וְהִנֵּה־מַיִם מְפַכִּים מִן־הַכָּתֵף הַיְמָנִית׃
    hebrewPlain: ויוצאני דרך שער צפונה ויסבני דרך חוץ אל שער החוץ דרך הפונה קדים והנה מים מפכים מן הכתף הימנית
    kjvRefs:
    - Ezekiel 47:2
    kjvOsis:
    - Ezek.47.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.3
    scripture: tanakh
    name: Tanakh Ezekiel 47:3
    ref: Ezekiel 47:3
    book: Ezek
    section: neviim
    chapter: 47
    verse: 3
    ordinal: 14037
    text: When the man went forth eastward with the line in his hand, he measured a thousand cubits, and he caused me to pass through the waters, waters that were to the ankles.
    translation: JPS 1917
    original: בְּצֵאת־הָאִישׁ קָדִים וְקָו בְּיָדוֹ וַיָּמָד אֶלֶף בָּאַמָּה וַיַּעֲבִרֵנִי בַמַּיִם מֵי אָפְסָיִם׃
    hebrewPlain: בצאת האיש קדים וקו בידו וימד אלף באמה ויעברני במים מי אפסים
    kjvRefs:
    - Ezekiel 47:3
    kjvOsis:
    - Ezek.47.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.4
    scripture: tanakh
    name: Tanakh Ezekiel 47:4
    ref: Ezekiel 47:4
    book: Ezek
    section: neviim
    chapter: 47
    verse: 4
    ordinal: 14038
    text: Again he measured a thousand, and caused me to pass through the waters, waters that were to the knees. Again he measured a thousand, and caused me to pass through waters that were to the loins.
    translation: JPS 1917
    original: וַיָּמָד אֶלֶף וַיַּעֲבִרֵנִי בַמַּיִם מַיִם בִּרְכָּיִם וַיָּמָד אֶלֶף וַיַּעֲבִרֵנִי מֵי מָתְנָיִם׃
    hebrewPlain: וימד אלף ויעברני במים מים ברכים וימד אלף ויעברני מי מתנים
    kjvRefs:
    - Ezekiel 47:4
    kjvOsis:
    - Ezek.47.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.5
    scripture: tanakh
    name: Tanakh Ezekiel 47:5
    ref: Ezekiel 47:5
    book: Ezek
    section: neviim
    chapter: 47
    verse: 5
    ordinal: 14039
    text: Afterward he measured a thousand; and it was a river that I could not pass through; for the waters were risen, waters to swim in, a river that could not be passed through.
    translation: JPS 1917
    original: וַיָּמָד אֶלֶף נַחַל אֲשֶׁר לֹא־אוּכַל לַעֲבֹר כִּי־גָאוּ הַמַּיִם מֵי שָׂחוּ נַחַל אֲשֶׁר לֹא־יֵעָבֵר׃
    hebrewPlain: וימד אלף נחל אשר לא אוכל לעבר כי גאו המים מי שחו נחל אשר לא יעבר
    kjvRefs:
    - Ezekiel 47:5
    kjvOsis:
    - Ezek.47.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.6
    scripture: tanakh
    name: Tanakh Ezekiel 47:6
    ref: Ezekiel 47:6
    book: Ezek
    section: neviim
    chapter: 47
    verse: 6
    ordinal: 14040
    text: 'And he said unto me: ‘Hast thou seen this, O son of man?’ Then he led me, and caused me to return to the bank of the river.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הֲרָאִיתָ בֶן־אָדָם וַיּוֹלִכֵנִי וַיְשִׁבֵנִי שְׂפַת הַנָּחַל׃
    hebrewPlain: ויאמר אלי הראית בן אדם ויולכני וישבני שפת הנחל
    kjvRefs:
    - Ezekiel 47:6
    kjvOsis:
    - Ezek.47.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.7
    scripture: tanakh
    name: Tanakh Ezekiel 47:7
    ref: Ezekiel 47:7
    book: Ezek
    section: neviim
    chapter: 47
    verse: 7
    ordinal: 14041
    text: Now when I had been brought back, behold, upon the bank of the river were very many trees on the one side and on the other.
    translation: JPS 1917
    original: בְּשׁוּבֵנִי וְהִנֵּה אֶל־שְׂפַת הַנַּחַל עֵץ רַב מְאֹד מִזֶּה וּמִזֶּה׃
    hebrewPlain: בשובני והנה אל שפת הנחל עץ רב מאד מזה ומזה
    kjvRefs:
    - Ezekiel 47:7
    kjvOsis:
    - Ezek.47.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.8
    scripture: tanakh
    name: Tanakh Ezekiel 47:8
    ref: Ezekiel 47:8
    book: Ezek
    section: neviim
    chapter: 47
    verse: 8
    ordinal: 14042
    text: 'Then said he unto me: ‘These waters issue forth toward the eastern region, and shall go down into the Arabah; and when they shall enter into the sea, into the sea of the putrid waters, the waters shall be healed.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הַמַּיִם הָאֵלֶּה יוֹצְאִים אֶל־הַגְּלִילָה הַקַּדְמוֹנָה וְיָרְדוּ עַל־הָעֲרָבָה וּבָאוּ הַיָּמָּה אֶל־הַיָּמָּה הַמּוּצָאִים ונרפאו [וְנִרְפּוּ] הַמָּיִם׃
    hebrewPlain: ויאמר אלי המים האלה יוצאים אל הגלילה הקדמונה וירדו על הערבה ובאו הימה אל הימה המוצאים ונרפאו [ונרפו] המים
    kjvRefs:
    - Ezekiel 47:8
    kjvOsis:
    - Ezek.47.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.9
    scripture: tanakh
    name: Tanakh Ezekiel 47:9
    ref: Ezekiel 47:9
    book: Ezek
    section: neviim
    chapter: 47
    verse: 9
    ordinal: 14043
    text: And it shall come to pass, that every living creature wherewith it swarmeth, whithersoever the rivers shall come, shall live; and there shall be a very great multitude of fish; for these waters are come thither, that all things be healed and may live whithersoever the river cometh.
    translation: JPS 1917
    original: וְהָיָה כָל־נֶפֶשׁ חַיָּה אֲ‍שֶׁר־יִשְׁרֹץ אֶל כָּל־אֲשֶׁר יָבוֹא שָׁם נַחֲלַיִם יִחְיֶה וְהָיָה הַדָּגָה רַבָּה מְאֹד כִּי בָאוּ שָׁמָּה הַמַּיִם הָאֵלֶּה וְיֵרָפְאוּ וָחָי כֹּל אֲשֶׁר־יָבוֹא שָׁמָּה הַנָּחַל׃
    hebrewPlain: והיה כל נפש חיה א‍שר ישרץ אל כל אשר יבוא שם נחלים יחיה והיה הדגה רבה מאד כי באו שמה המים האלה וירפאו וחי כל אשר יבוא שמה הנחל
    kjvRefs:
    - Ezekiel 47:9
    kjvOsis:
    - Ezek.47.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.10
    scripture: tanakh
    name: Tanakh Ezekiel 47:10
    ref: Ezekiel 47:10
    book: Ezek
    section: neviim
    chapter: 47
    verse: 10
    ordinal: 14044
    text: And it shall come to pass, that fishers shall stand by it from En-gedi even unto En-eglaim; there shall be a place for the spreading of nets; their fish shall be after their kinds, as the fish of the Great Sea, exceeding many.
    translation: JPS 1917
    original: וְהָיָה יעמדו [עָמְדוּ] עָלָיו דַּוָּגִים מֵעֵין גֶּדִי וְעַד־עֵין עֶגְלַיִם מִשְׁטוֹחַ לַחֲרָמִים יִהְיוּ לְמִינָה תִּהְיֶה דְגָתָם כִּדְגַת הַיָּם הַגָּדוֹל רַבָּה מְאֹד׃
    hebrewPlain: והיה יעמדו [עמדו] עליו דוגים מעין גדי ועד עין עגלים משטוח לחרמים יהיו למינה תהיה דגתם כדגת הים הגדול רבה מאד
    kjvRefs:
    - Ezekiel 47:10
    kjvOsis:
    - Ezek.47.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.11
    scripture: tanakh
    name: Tanakh Ezekiel 47:11
    ref: Ezekiel 47:11
    book: Ezek
    section: neviim
    chapter: 47
    verse: 11
    ordinal: 14045
    text: But the miry places thereof, and the marshes thereof, shall not be healed; they shall be given for salt.
    translation: JPS 1917
    original: בצאתו [בִּצֹּאתָיו] וּגְבָאָיו וְלֹא יֵרָפְאוּ לְמֶלַח נִתָּנוּ׃
    hebrewPlain: בצאתו [בצאתיו] וגבאיו ולא ירפאו למלח נתנו
    kjvRefs:
    - Ezekiel 47:11
    kjvOsis:
    - Ezek.47.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.12
    scripture: tanakh
    name: Tanakh Ezekiel 47:12
    ref: Ezekiel 47:12
    book: Ezek
    section: neviim
    chapter: 47
    verse: 12
    ordinal: 14046
    text: And by the river upon the bank thereof, on this side and on that side, shall grow every tree for food, whose leaf shall not wither, neither shall the fruit thereof fail; it shall bring forth new fruit every month, because the waters thereof issue out of the sanctuary; and the fruit thereof shall be for food, and the leaf thereof for healing.’ .
    translation: JPS 1917
    original: וְעַל־הַנַּחַל יַעֲלֶה עַל־שְׂפָתוֹ מִזֶּה וּמִזֶּה כָּל־עֵץ־מַאֲכָל לֹא־יִבּוֹל עָלֵהוּ וְלֹא־יִתֹּם פִּרְיוֹ לָחֳדָשָׁיו יְבַכֵּר כִּי מֵימָיו מִן־הַמִּקְדָּשׁ הֵמָּה יוֹצְאִים והיו [וְהָיָה] פִרְיוֹ לְמַאֲכָל וְעָלֵהוּ לִתְרוּפָה׃
    hebrewPlain: ועל הנחל יעלה על שפתו מזה ומזה כל עץ מאכל לא יבול עלהו ולא יתם פריו לחדשיו יבכר כי מימיו מן המקדש המה יוצאים והיו [והיה] פריו למאכל ועלהו לתרופה
    kjvRefs:
    - Ezekiel 47:12
    kjvOsis:
    - Ezek.47.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.13
    scripture: tanakh
    name: Tanakh Ezekiel 47:13
    ref: Ezekiel 47:13
    book: Ezek
    section: neviim
    chapter: 47
    verse: 13
    ordinal: 14047
    text: 'Thus saith the Lord GOD: ‘This shall be the border, whereby ye shall divide the land for inheritance according to the twelve tribes of Israel, Joseph receiving two portions.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה גֵּה גְבוּל אֲשֶׁר תִּתְנַחֲלוּ אֶת־הָאָרֶץ לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל יוֹסֵף חֲבָלִים׃
    hebrewPlain: כה אמר אדני יהוה גה גבול אשר תתנחלו את הארץ לשני עשר שבטי ישראל יוסף חבלים
    kjvRefs:
    - Ezekiel 47:13
    kjvOsis:
    - Ezek.47.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.14
    scripture: tanakh
    name: Tanakh Ezekiel 47:14
    ref: Ezekiel 47:14
    book: Ezek
    section: neviim
    chapter: 47
    verse: 14
    ordinal: 14048
    text: And ye shall inherit it, one as well as another, concerning which I lifted up My hand to give it unto your fathers; and this land shall fall unto you for inheritance.
    translation: JPS 1917
    original: וּנְחַלְתֶּם אוֹתָהּ אִישׁ כְּאָחִיו אֲשֶׁר נָשָׂאתִי אֶת־יָדִי לְתִתָּהּ לַאֲבֹתֵיכֶם וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה׃
    hebrewPlain: ונחלתם אותה איש כאחיו אשר נשאתי את ידי לתתה לאבתיכם ונפלה הארץ הזאת לכם בנחלה
    kjvRefs:
    - Ezekiel 47:14
    kjvOsis:
    - Ezek.47.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.47
- type: TanakhVerse
  data:
    osis: Ezek.47.15
    scripture: tanakh
    name: Tanakh Ezekiel 47:15
    ref: Ezekiel 47:15
    book: Ezek
    section: neviim
    chapter: 47
    verse: 15
    ordinal: 14049
    text: 'And this shall be the border of the land: on the north side, from the Great Sea, by the way of Hethlon, unto the entrance of Zedad;'
    translation: JPS 1917
    original: וְזֶה גְּבוּל הָאָרֶץ לִפְאַת צָפוֹנָה מִן־הַיָּם הַגָּדוֹל הַדֶּרֶךְ חֶתְלֹן לְבוֹא צְדָדָה׃
    hebrewPlain: וזה גבול הארץ לפאת צפונה מן הים הגדול הדרך חתלן לבוא צדדה
    kjvRefs:
