- type: TanakhVerse
  data:
    osis: Ezek.38.14
    scripture: tanakh
    name: Tanakh Ezekiel 38:14
    ref: Ezekiel 38:14
    book: Ezek
    section: neviim
    chapter: 38
    verse: 14
    ordinal: 13794
    text: 'Therefore, son of man, prophesy, and say unto Gog: Thus saith the Lord GOD: In that day when My people Israel dwelleth safely, shalt thou not know it?'
    translation: JPS 1917
    original: לָכֵן הִנָּבֵא בֶן־אָדָם וְאָמַרְתָּ לְגוֹג כֹּה אָמַר אֲדֹנָי יְהוִה הֲלוֹא בַּיּוֹם הַהוּא בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל לָבֶטַח תֵּדָע׃
    hebrewPlain: לכן הנבא בן אדם ואמרת לגוג כה אמר אדני יהוה הלוא ביום ההוא בשבת עמי ישראל לבטח תדע
    kjvRefs:
    - Ezekiel 38:14
    kjvOsis:
    - Ezek.38.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.15
    scripture: tanakh
    name: Tanakh Ezekiel 38:15
    ref: Ezekiel 38:15
    book: Ezek
    section: neviim
    chapter: 38
    verse: 15
    ordinal: 13795
    text: And thou shalt come from thy place out of the uttermost parts of the north, thou, and many peoples with thee, all of them riding upon horses, a great company and a mighty army;
    translation: JPS 1917
    original: וּבָאתָ מִמְּקוֹמְךָ מִיַּרְכְּתֵי צָפוֹן אַתָּה וְעַמִּים רַבִּים אִתָּךְ רֹכְבֵי סוּסִים כֻּלָּם קָהָל גָּדוֹל וְחַיִל רָב׃
    hebrewPlain: ובאת ממקומך מירכתי צפון אתה ועמים רבים אתך רכבי סוסים כלם קהל גדול וחיל רב
    kjvRefs:
    - Ezekiel 38:15
    kjvOsis:
    - Ezek.38.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.16
    scripture: tanakh
    name: Tanakh Ezekiel 38:16
    ref: Ezekiel 38:16
    book: Ezek
    section: neviim
    chapter: 38
    verse: 16
    ordinal: 13796
    text: and thou shalt come up against My people Israel, as a cloud to cover the land; it shall be in the end of days, and I will bring thee against My land, that the nations may know Me, when I shall be sanctified through thee, O Gog, before their eyes.
    translation: JPS 1917
    original: וְעָלִיתָ עַל־עַמִּי יִשְׂרָאֵל כֶּעָנָן לְכַסּוֹת הָאָרֶץ בְּאַחֲרִית הַיָּמִים תִּהְיֶה וַהֲבִאוֹתִיךָ עַל־אַרְצִי לְמַעַן דַּעַת הַגּוֹיִם אֹתִי בְּהִקָּדְשִׁי בְךָ לְעֵינֵיהֶם גּוֹג׃
    hebrewPlain: ועלית על עמי ישראל כענן לכסות הארץ באחרית הימים תהיה והבאותיך על ארצי למען דעת הגוים אתי בהקדשי בך לעיניהם גוג
    kjvRefs:
    - Ezekiel 38:16
    kjvOsis:
    - Ezek.38.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.17
    scripture: tanakh
    name: Tanakh Ezekiel 38:17
    ref: Ezekiel 38:17
    book: Ezek
    section: neviim
    chapter: 38
    verse: 17
    ordinal: 13797
    text: 'Thus saith the Lord GOD: Art thou he of whom I spoke in old time by My servants the prophets of Israel, that prophesied in those days for many years, that I would bring thee against them?'
    translation: JPS 1917
    original: כֹּה־אָמַר אֲדֹנָי יְהוִה הַאַתָּה־הוּא אֲשֶׁר־דִּבַּרְתִּי בְּיָמִים קַדְמוֹנִים בְּיַד עֲבָדַי נְבִיאֵי יִשְׂרָאֵל הַנִּבְּאִים בַּיָּמִים הָהֵם שָׁנִים לְהָבִיא אֹתְךָ עֲלֵיהֶם׃
    hebrewPlain: כה אמר אדני יהוה האתה הוא אשר דברתי בימים קדמונים ביד עבדי נביאי ישראל הנבאים בימים ההם שנים להביא אתך עליהם
    kjvRefs:
    - Ezekiel 38:17
    kjvOsis:
    - Ezek.38.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.18
    scripture: tanakh
    name: Tanakh Ezekiel 38:18
    ref: Ezekiel 38:18
    book: Ezek
    section: neviim
    chapter: 38
    verse: 18
    ordinal: 13798
    text: And it shall come to pass in that day, when Gog shall come against the land of Israel, saith the Lord GOD, that My fury shall arise up in My nostrils.
    translation: JPS 1917
    original: וְהָיָה בַּיּוֹם הַהוּא בְּיוֹם בּוֹא גוֹג עַל־אַדְמַת יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה תַּעֲלֶה חֲמָתִי בְּאַפִּי׃
    hebrewPlain: והיה ביום ההוא ביום בוא גוג על אדמת ישראל נאם אדני יהוה תעלה חמתי באפי
    kjvRefs:
    - Ezekiel 38:18
    kjvOsis:
    - Ezek.38.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.19
    scripture: tanakh
    name: Tanakh Ezekiel 38:19
    ref: Ezekiel 38:19
    book: Ezek
    section: neviim
    chapter: 38
    verse: 19
    ordinal: 13799
    text: 'For in My jealousy and in the fire of My wrath have I spoken: Surely in that day there shall be a great shaking in the land of Israel;'
    translation: JPS 1917
    original: וּבְקִנְאָתִי בְאֵשׁ־עֶבְרָתִי דִּבַּרְתִּי אִם־לֹא בַּיּוֹם הַהוּא יִהְיֶה רַעַשׁ גָּדוֹל עַל אַדְמַת יִשְׂרָאֵל׃
    hebrewPlain: ובקנאתי באש עברתי דברתי אם לא ביום ההוא יהיה רעש גדול על אדמת ישראל
    kjvRefs:
    - Ezekiel 38:19
    kjvOsis:
    - Ezek.38.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.20
    scripture: tanakh
    name: Tanakh Ezekiel 38:20
    ref: Ezekiel 38:20
    book: Ezek
    section: neviim
    chapter: 38
    verse: 20
    ordinal: 13800
    text: so that the fishes of the sea, and the fowls of the heaven, and the beasts of the field and all creeping things that creep upon the ground, and all the men that are upon the face of the earth, shall shake at My presence, and the mountains shall be thrown down, and the steep places shall fall, and every wall shall fall to the ground.
    translation: JPS 1917
    original: וְרָעֲשׁוּ מִפָּנַי דְּגֵי הַיָּם וְעוֹף הַשָּׁמַיִם וְחַיַּת הַשָּׂדֶה וְכָל־הָרֶמֶשׂ הָרֹמֵשׂ עַל־הָאֲדָמָה וְכֹל הָאָדָם אֲשֶׁר עַל־פְּנֵי הָאֲדָמָה וְנֶהֶרְסוּ הֶהָרִים וְנָפְלוּ הַמַּדְרֵגוֹת וְכָל־חוֹמָה לָאָרֶץ תִּפּוֹל׃
    hebrewPlain: ורעשו מפני דגי הים ועוף השמים וחית השדה וכל הרמש הרמש על האדמה וכל האדם אשר על פני האדמה ונהרסו ההרים ונפלו המדרגות וכל חומה לארץ תפול
    kjvRefs:
    - Ezekiel 38:20
    kjvOsis:
    - Ezek.38.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.21
    scripture: tanakh
    name: Tanakh Ezekiel 38:21
    ref: Ezekiel 38:21
    book: Ezek
    section: neviim
    chapter: 38
    verse: 21
    ordinal: 13801
    text: And I will call for a sword against him throughout all my mountains, saith the Lord GOD; every man’s sword shall be against his brother.
    translation: JPS 1917
    original: וְקָרָאתִי עָלָיו לְכָל־הָרַי חֶרֶב נְאֻם אֲדֹנָי יְהוִה חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה׃
    hebrewPlain: וקראתי עליו לכל הרי חרב נאם אדני יהוה חרב איש באחיו תהיה
    kjvRefs:
    - Ezekiel 38:21
    kjvOsis:
    - Ezek.38.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.22
    scripture: tanakh
    name: Tanakh Ezekiel 38:22
    ref: Ezekiel 38:22
    book: Ezek
    section: neviim
    chapter: 38
    verse: 22
    ordinal: 13802
    text: And I will plead against him with pestilence and with blood; and I will cause to rain upon him, and upon his bands, and upon the many peoples that are with him, an overflowing shower, and great hailstones, fire, and brimstone.
    translation: JPS 1917
    original: וְנִשְׁפַּטְתִּי אִתּוֹ בְּדֶבֶר וּבְדָם וְגֶשֶׁם שׁוֹטֵף וְאַבְנֵי אֶלְגָּבִישׁ אֵשׁ וְגָפְרִית אַמְטִיר עָלָיו וְעַל־אֲגַפָּיו וְעַל־עַמִּים רַבִּים אֲשֶׁר אִתּוֹ׃
    hebrewPlain: ונשפטתי אתו בדבר ובדם וגשם שוטף ואבני אלגביש אש וגפרית אמטיר עליו ועל אגפיו ועל עמים רבים אשר אתו
    kjvRefs:
    - Ezekiel 38:22
    kjvOsis:
    - Ezek.38.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.23
    scripture: tanakh
    name: Tanakh Ezekiel 38:23
    ref: Ezekiel 38:23
    book: Ezek
    section: neviim
    chapter: 38
    verse: 23
    ordinal: 13803
    text: Thus will I magnify Myself, and sanctify Myself, and I will make Myself known in the eyes of many nations; and they shall know that I am the LORD.
    translation: JPS 1917
    original: וְהִתְגַּדִּלְתִּי וְהִתְקַדִּשְׁתִּי וְנוֹדַעְתִּי לְעֵינֵי גּוֹיִם רַבִּים וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והתגדלתי והתקדשתי ונודעתי לעיני גוים רבים וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 38:23
    kjvOsis:
    - Ezek.38.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.39.1
    scripture: tanakh
    name: Tanakh Ezekiel 39:1
    ref: Ezekiel 39:1
    book: Ezek
    section: neviim
    chapter: 39
    verse: 1
    ordinal: 13804
    text: 'And thou, son of man, prophesy against Gog, and say: Thus saith the Lord GOD: Behold, I am against thee, O Gog, chief prince of Meshech and Tubal;'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הִנָּבֵא עַל־גּוֹג וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי אֵלֶיךָ גּוֹג נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל׃
    hebrewPlain: ואתה בן אדם הנבא על גוג ואמרת כה אמר אדני יהוה הנני אליך גוג נשיא ראש משך ותבל
    kjvRefs:
    - Ezekiel 39:1
    kjvOsis:
    - Ezek.39.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.2
    scripture: tanakh
    name: Tanakh Ezekiel 39:2
    ref: Ezekiel 39:2
    book: Ezek
    section: neviim
    chapter: 39
    verse: 2
    ordinal: 13805
    text: and I will turn thee about and lead thee on, and will cause thee to come up from the uttermost parts of the north; and I will bring thee upon the mountains of Israel;
    translation: JPS 1917
    original: וְשֹׁבַבְתִּיךָ וְשִׁשֵּׁאתִיךָ וְהַעֲלִיתִיךָ מִיַּרְכְּתֵי צָפוֹן וַהֲבִאוֹתִךָ עַל־הָרֵי יִשְׂרָאֵל׃
    hebrewPlain: ושבבתיך וששאתיך והעליתיך מירכתי צפון והבאותך על הרי ישראל
    kjvRefs:
    - Ezekiel 39:2
    kjvOsis:
    - Ezek.39.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.3
    scripture: tanakh
    name: Tanakh Ezekiel 39:3
    ref: Ezekiel 39:3
    book: Ezek
    section: neviim
    chapter: 39
    verse: 3
    ordinal: 13806
    text: and I will smite thy bow out of thy left hand, and will cause thine arrows to fall out of thy right hand.
    translation: JPS 1917
    original: וְהִכֵּיתִי קַשְׁתְּךָ מִיַּד שְׂמֹאולֶךָ וְחִצֶּיךָ מִיַּד יְמִינְךָ אַפִּיל׃
    hebrewPlain: והכיתי קשתך מיד שמאולך וחציך מיד ימינך אפיל
    kjvRefs:
    - Ezekiel 39:3
    kjvOsis:
    - Ezek.39.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.4
    scripture: tanakh
    name: Tanakh Ezekiel 39:4
    ref: Ezekiel 39:4
    book: Ezek
    section: neviim
    chapter: 39
    verse: 4
    ordinal: 13807
    text: Thou shalt fall upon the mountains of Israel, thou, and all thy bands, and the peoples that are with thee; I will give thee unto the ravenous birds of every sort and to the beasts of the field, to be devoured.
    translation: JPS 1917
    original: עַל־הָרֵי יִשְׂרָאֵל תִּפּוֹל אַתָּה וְכָל־אֲגַפֶּיךָ וְעַמִּים אֲשֶׁר אִתָּךְ לְעֵיט צִפּוֹר כָּל־כָּנָף וְחַיַּת הַשָּׂדֶה נְתַתִּיךָ לְאָכְלָה׃
    hebrewPlain: על הרי ישראל תפול אתה וכל אגפיך ועמים אשר אתך לעיט צפור כל כנף וחית השדה נתתיך לאכלה
    kjvRefs:
    - Ezekiel 39:4
    kjvOsis:
    - Ezek.39.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.5
    scripture: tanakh
    name: Tanakh Ezekiel 39:5
    ref: Ezekiel 39:5
    book: Ezek
    section: neviim
    chapter: 39
    verse: 5
    ordinal: 13808
    text: Thou shalt fall upon the open field; for I have spoken it, saith the Lord GOD.
    translation: JPS 1917
    original: עַל־פְּנֵי הַשָּׂדֶה תִּפּוֹל כִּי אֲנִי דִבַּרְתִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: על פני השדה תפול כי אני דברתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 39:5
    kjvOsis:
    - Ezek.39.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.6
    scripture: tanakh
    name: Tanakh Ezekiel 39:6
    ref: Ezekiel 39:6
    book: Ezek
    section: neviim
    chapter: 39
    verse: 6
    ordinal: 13809
    text: And I will send a fire on Magog, and on them that dwell safely in the isles; and they shall know that I am the LORD.
    translation: JPS 1917
    original: וְשִׁלַּחְתִּי־אֵשׁ בְּמָגוֹג וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ושלחתי אש במגוג ובישבי האיים לבטח וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 39:6
    kjvOsis:
    - Ezek.39.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.7
    scripture: tanakh
    name: Tanakh Ezekiel 39:7
    ref: Ezekiel 39:7
    book: Ezek
    section: neviim
    chapter: 39
    verse: 7
    ordinal: 13810
    text: And My holy name will I make known in the midst of My people Israel; neither will I suffer My holy name to be profaned any more; and the nations shall know that I am the LORD, the Holy One in Israel.
    translation: JPS 1917
    original: וְאֶת־שֵׁם קָדְשִׁי אוֹדִיעַ בְּתוֹךְ עַמִּי יִשְׂרָאֵל וְלֹא־אַחֵל אֶת־שֵׁם־קָדְשִׁי עוֹד וְיָדְעוּ הַגּוֹיִם כִּי־אֲנִי יְהוָה קָדוֹשׁ בְּיִשְׂרָאֵל׃
    hebrewPlain: ואת שם קדשי אודיע בתוך עמי ישראל ולא אחל את שם קדשי עוד וידעו הגוים כי אני יהוה קדוש בישראל
    kjvRefs:
    - Ezekiel 39:7
    kjvOsis:
    - Ezek.39.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.8
    scripture: tanakh
    name: Tanakh Ezekiel 39:8
    ref: Ezekiel 39:8
    book: Ezek
    section: neviim
    chapter: 39
    verse: 8
    ordinal: 13811
    text: Behold, it cometh, and it shall be done, saith the Lord GOD; This is the day whereof I have spoken.
    translation: JPS 1917
    original: הִנֵּה בָאָה וְנִהְיָתָה נְאֻם אֲדֹנָי יְהוִה הוּא הַיּוֹם אֲשֶׁר דִּבַּרְתִּי׃
    hebrewPlain: הנה באה ונהיתה נאם אדני יהוה הוא היום אשר דברתי
    kjvRefs:
    - Ezekiel 39:8
    kjvOsis:
    - Ezek.39.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.9
    scripture: tanakh
    name: Tanakh Ezekiel 39:9
    ref: Ezekiel 39:9
    book: Ezek
    section: neviim
    chapter: 39
    verse: 9
    ordinal: 13812
    text: And they that dwell in the cities of Israel shall go forth, and shall make fires of the weapons and use them as fuel, both the shields and the bucklers, the bows and the arrows, and the hand-staves, and the spears, and they shall make fires of them seven years;
    translation: JPS 1917
    original: וְיָצְאוּ יֹשְׁבֵי עָרֵי יִשְׂרָאֵל וּבִעֲרוּ וְהִשִּׂיקוּ בְּנֶשֶׁק וּמָגֵן וְצִנָּה בְּקֶשֶׁת וּבְחִצִּים וּבְמַקֵּל יָד וּבְרֹמַח וּבִעֲרוּ בָהֶם אֵשׁ שֶׁבַע שָׁנִים׃
    hebrewPlain: ויצאו ישבי ערי ישראל ובערו והשיקו בנשק ומגן וצנה בקשת ובחצים ובמקל יד וברמח ובערו בהם אש שבע שנים
    kjvRefs:
    - Ezekiel 39:9
    kjvOsis:
    - Ezek.39.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.10
    scripture: tanakh
    name: Tanakh Ezekiel 39:10
    ref: Ezekiel 39:10
    book: Ezek
    section: neviim
    chapter: 39
    verse: 10
    ordinal: 13813
    text: so that they shall take no wood out of the field, neither cut down any out of the forests, for they shall make fires of the weapons; and they shall spoil those that spoiled them, and rob those that robbed them, saith the Lord GOD.
    translation: JPS 1917
    original: וְלֹא־יִשְׂאוּ עֵצִים מִן־הַשָּׂדֶה וְלֹא יַחְטְבוּ מִן־הַיְּעָרִים כִּי בַנֶּשֶׁק יְבַעֲרוּ־אֵשׁ וְשָׁלְלוּ אֶת־שֹׁלְלֵיהֶם וּבָזְזוּ אֶת־בֹּזְזֵיהֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ולא ישאו עצים מן השדה ולא יחטבו מן היערים כי בנשק יבערו אש ושללו את שלליהם ובזזו את בזזיהם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 39:10
    kjvOsis:
    - Ezek.39.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.11
    scripture: tanakh
    name: Tanakh Ezekiel 39:11
    ref: Ezekiel 39:11
    book: Ezek
    section: neviim
    chapter: 39
    verse: 11
    ordinal: 13814
    text: And it shall come to pass in that day, that I will give unto Gog a place fit for burial in Israel, the valley of them that pass through on the east of the sea; and it shall stop them that pass through; and there shall they bury Gog and all his multitude; and they shall call it the valley of Hamon-gog.
    translation: JPS 1917
    original: וְהָיָה בַיּוֹם הַהוּא אֶתֵּן לְגוֹג מְקוֹם־שָׁם קֶבֶר בְּיִשְׂרָאֵל גֵּי הָעֹבְרִים קִדְמַת הַיָּם וְחֹסֶמֶת הִיא אֶת־הָעֹבְרִים וְקָבְרוּ שָׁם אֶת־גּוֹג וְאֶת־כָּל־הֲמוֹנֹה וְקָרְאוּ גֵּיא הֲמוֹן גּוֹג׃
    hebrewPlain: והיה ביום ההוא אתן לגוג מקום שם קבר בישראל גי העברים קדמת הים וחסמת היא את העברים וקברו שם את גוג ואת כל המונה וקראו גיא המון גוג
    kjvRefs:
    - Ezekiel 39:11
    kjvOsis:
    - Ezek.39.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.12
    scripture: tanakh
    name: Tanakh Ezekiel 39:12
    ref: Ezekiel 39:12
    book: Ezek
    section: neviim
    chapter: 39
    verse: 12
    ordinal: 13815
    text: And seven months shall the house of Israel be burying them, that they may cleanse the land.
    translation: JPS 1917
    original: וּקְבָרוּם בֵּית יִשְׂרָאֵל לְמַעַן טַהֵר אֶת־הָאָרֶץ שִׁבְעָה חֳדָשִׁים׃
    hebrewPlain: וקברום בית ישראל למען טהר את הארץ שבעה חדשים
    kjvRefs:
    - Ezekiel 39:12
    kjvOsis:
    - Ezek.39.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.13
    scripture: tanakh
    name: Tanakh Ezekiel 39:13
    ref: Ezekiel 39:13
    book: Ezek
    section: neviim
    chapter: 39
    verse: 13
    ordinal: 13816
    text: Yea, all the people of the land shall bury them, and it shall be to them a renown; in the day that I shall be glorified, saith the Lord GOD.
    translation: JPS 1917
    original: וְקָבְרוּ כָּל־עַם הָאָרֶץ וְהָיָה לָהֶם לְשֵׁם יוֹם הִכָּבְדִי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: וקברו כל עם הארץ והיה להם לשם יום הכבדי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 39:13
    kjvOsis:
    - Ezek.39.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.14
    scripture: tanakh
    name: Tanakh Ezekiel 39:14
    ref: Ezekiel 39:14
    book: Ezek
    section: neviim
    chapter: 39
    verse: 14
    ordinal: 13817
    text: And they shall set apart men of continual employment, that shall pass through the land to bury with them that pass through those that remain upon the face of the land, to cleanse it; after the end of seven months shall they search.
    translation: JPS 1917
    original: וְאַנְשֵׁי תָמִיד יַבְדִּילוּ עֹבְרִים בָּאָרֶץ מְקַבְּרִים אֶת־הָעֹבְרִים אֶת־הַנּוֹתָרִים עַל־פְּנֵי הָאָרֶץ לְטַהֲרָהּ מִקְצֵה שִׁבְעָה־חֳדָשִׁים יַחְקֹרוּ׃
    hebrewPlain: ואנשי תמיד יבדילו עברים בארץ מקברים את העברים את הנותרים על פני הארץ לטהרה מקצה שבעה חדשים יחקרו
    kjvRefs:
    - Ezekiel 39:14
    kjvOsis:
    - Ezek.39.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.15
    scripture: tanakh
    name: Tanakh Ezekiel 39:15
    ref: Ezekiel 39:15
    book: Ezek
    section: neviim
    chapter: 39
    verse: 15
    ordinal: 13818
    text: And when they that pass through shall pass through the land, and any seeth a man’s bone, then shall he set up a sign by it, till the buriers have buried it in the valley of Hamon-gog.
    translation: JPS 1917
    original: וְעָבְרוּ הָעֹבְרִים בָּאָרֶץ וְרָאָה עֶצֶם אָדָם וּבָנָה אֶצְלוֹ צִיּוּן עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים אֶל־גֵּיא הֲמוֹן גּוֹג׃
    hebrewPlain: ועברו העברים בארץ וראה עצם אדם ובנה אצלו ציון עד קברו אתו המקברים אל גיא המון גוג
    kjvRefs:
    - Ezekiel 39:15
    kjvOsis:
    - Ezek.39.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.16
    scripture: tanakh
    name: Tanakh Ezekiel 39:16
    ref: Ezekiel 39:16
    book: Ezek
    section: neviim
    chapter: 39
    verse: 16
    ordinal: 13819
    text: And Hamonah shall also be the name of a city. Thus shall they cleanse the land.
    translation: JPS 1917
    original: וְגַם שֶׁם־עִיר הֲמוֹנָה וְטִהֲרוּ הָאָרֶץ׃
    hebrewPlain: וגם שם עיר המונה וטהרו הארץ
    kjvRefs:
    - Ezekiel 39:16
    kjvOsis:
    - Ezek.39.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.17
    scripture: tanakh
    name: Tanakh Ezekiel 39:17
    ref: Ezekiel 39:17
    book: Ezek
    section: neviim
    chapter: 39
    verse: 17
    ordinal: 13820
    text: 'And thou, son of man, thus saith the Lord GOD: Speak unto the birds of every sort, and to every beast of the field: Assemble yourselves, and come; gather yourselves on every side to My feast that I do prepare for you, even a great feast, upon the mountains of Israel, that ye may eat flesh and drink blood.'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם כֹּה־אָמַר אֲדֹנָי יְהֹוִה אֱמֹר לְצִפּוֹר כָּל־כָּנָף וּלְכֹל חַיַּת הַשָּׂדֶה הִקָּבְצוּ וָבֹאוּ הֵאָסְפוּ מִסָּבִיב עַל־זִבְחִי אֲשֶׁר אֲנִי זֹבֵחַ לָכֶם זֶבַח גָּדוֹל עַל הָרֵי יִשְׂרָאֵל וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם׃
    hebrewPlain: ואתה בן אדם כה אמר אדני יהוה אמר לצפור כל כנף ולכל חית השדה הקבצו ובאו האספו מסביב על זבחי אשר אני זבח לכם זבח גדול על הרי ישראל ואכלתם בשר ושתיתם דם
    kjvRefs:
    - Ezekiel 39:17
    kjvOsis:
    - Ezek.39.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.18
    scripture: tanakh
    name: Tanakh Ezekiel 39:18
    ref: Ezekiel 39:18
    book: Ezek
    section: neviim
    chapter: 39
    verse: 18
    ordinal: 13821
    text: The flesh of the mighty shall ye eat, and the blood of the princes of the earth shall ye drink; rams, lambs, and goats, bullocks, fatlings of Bashan are they all of them.
    translation: JPS 1917
    original: בְּשַׂר גִּבּוֹרִים תֹּאכֵלוּ וְדַם־נְשִׂיאֵי הָאָרֶץ תִּשְׁתּוּ אֵילִים כָּרִים וְעַתּוּדִים פָּרִים מְרִיאֵי בָשָׁן כֻּלָּם׃
    hebrewPlain: בשר גבורים תאכלו ודם נשיאי הארץ תשתו אילים כרים ועתודים פרים מריאי בשן כלם
    kjvRefs:
    - Ezekiel 39:18
    kjvOsis:
    - Ezek.39.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.19
    scripture: tanakh
    name: Tanakh Ezekiel 39:19
    ref: Ezekiel 39:19
    book: Ezek
    section: neviim
    chapter: 39
    verse: 19
    ordinal: 13822
    text: And ye shall eat fat till ye be full, and drink blood till ye be drunken, of My feast which I have prepared for you.
    translation: JPS 1917
    original: וַאֲכַלְתֶּם־חֵלֶב לְשָׂבְעָה וּשְׁתִיתֶם דָּם לְשִׁכָּרוֹן מִזִּבְחִי אֲשֶׁר־זָבַחְתִּי לָכֶם׃
    hebrewPlain: ואכלתם חלב לשבעה ושתיתם דם לשכרון מזבחי אשר זבחתי לכם
    kjvRefs:
    - Ezekiel 39:19
    kjvOsis:
    - Ezek.39.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.20
    scripture: tanakh
    name: Tanakh Ezekiel 39:20
    ref: Ezekiel 39:20
    book: Ezek
    section: neviim
    chapter: 39
    verse: 20
    ordinal: 13823
    text: And ye shall be filled at My table with horses and horsemen, with mighty men, and with all men of war, saith the Lord GOD.
    translation: JPS 1917
    original: וּשְׂבַעְתֶּם עַל־שֻׁלְחָנִי סוּס וָרֶכֶב גִּבּוֹר וְכָל־אִישׁ מִלְחָמָה נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ושבעתם על שלחני סוס ורכב גבור וכל איש מלחמה נאם אדני יהוה
    kjvRefs:
    - Ezekiel 39:20
    kjvOsis:
    - Ezek.39.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.21
    scripture: tanakh
    name: Tanakh Ezekiel 39:21
    ref: Ezekiel 39:21
    book: Ezek
    section: neviim
    chapter: 39
    verse: 21
    ordinal: 13824
    text: And I will set My glory among the nations, and all the nations shall see My judgment that I have executed, and My hand that I have laid upon them.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־כְּבוֹדִי בַּגּוֹיִם וְרָאוּ כָל־הַגּוֹיִם אֶת־מִשְׁפָּטִי אֲשֶׁר עָשִׂיתִי וְאֶת־יָדִי אֲשֶׁר־שַׂמְתִּי בָהֶם׃
    hebrewPlain: ונתתי את כבודי בגוים וראו כל הגוים את משפטי אשר עשיתי ואת ידי אשר שמתי בהם
    kjvRefs:
    - Ezekiel 39:21
    kjvOsis:
    - Ezek.39.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.22
    scripture: tanakh
    name: Tanakh Ezekiel 39:22
    ref: Ezekiel 39:22
    book: Ezek
    section: neviim
    chapter: 39
    verse: 22
    ordinal: 13825
    text: So the house of Israel shall know that I am the LORD their God, from that day and forward.
    translation: JPS 1917
    original: וְיָדְעוּ בֵּית יִשְׂרָאֵל כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם מִן־הַיּוֹם הַהוּא וָהָלְאָה׃
    hebrewPlain: וידעו בית ישראל כי אני יהוה אלהיהם מן היום ההוא והלאה
    kjvRefs:
    - Ezekiel 39:22
    kjvOsis:
    - Ezek.39.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.23
    scripture: tanakh
    name: Tanakh Ezekiel 39:23
    ref: Ezekiel 39:23
    book: Ezek
    section: neviim
    chapter: 39
    verse: 23
    ordinal: 13826
    text: And the nations shall know that the house of Israel went into captivity for their iniquity, because they broke faith with Me, and I hid My face from them; so I gave them into the hand of their adversaries, and they fell all of them by the sword.
    translation: JPS 1917
    original: וְיָדְעוּ הַגּוֹיִם כִּי בַעֲוֺנָם גָּלוּ בֵית־יִשְׂרָאֵל עַל אֲשֶׁר מָעֲלוּ־בִי וָאַסְתִּר פָּנַי מֵהֶם וָאֶתְּנֵם בְּיַד צָרֵיהֶם וַיִּפְּלוּ בַחֶרֶב כֻּלָּם׃
    hebrewPlain: וידעו הגוים כי בעונם גלו בית ישראל על אשר מעלו בי ואסתר פני מהם ואתנם ביד צריהם ויפלו בחרב כלם
    kjvRefs:
    - Ezekiel 39:23
    kjvOsis:
    - Ezek.39.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.24
    scripture: tanakh
    name: Tanakh Ezekiel 39:24
    ref: Ezekiel 39:24
    book: Ezek
    section: neviim
    chapter: 39
    verse: 24
    ordinal: 13827
    text: According to their uncleanness and according to their transgressions did I unto them; and I hid My face from them.
    translation: JPS 1917
    original: כְּטֻמְאָתָם וּכְפִשְׁעֵיהֶם עָשִׂיתִי אֹתָם וָאַסְתִּר פָּנַי מֵהֶם׃
    hebrewPlain: כטמאתם וכפשעיהם עשיתי אתם ואסתר פני מהם
    kjvRefs:
    - Ezekiel 39:24
    kjvOsis:
    - Ezek.39.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.25
    scripture: tanakh
    name: Tanakh Ezekiel 39:25
    ref: Ezekiel 39:25
    book: Ezek
    section: neviim
    chapter: 39
    verse: 25
    ordinal: 13828
    text: 'Therefore thus saith the Lord GOD: Now will I bring back the captivity of Jacob, and have compassion upon the whole house of Israel; and I will be jealous for My holy name.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה עַתָּה אָשִׁיב אֶת־שבית [שְׁבוּת] יַעֲקֹב וְרִחַמְתִּי כָּל־בֵּית יִשְׂרָאֵל וְקִנֵּאתִי לְשֵׁם קָדְשִׁי׃
    hebrewPlain: לכן כה אמר אדני יהוה עתה אשיב את שבית [שבות] יעקב ורחמתי כל בית ישראל וקנאתי לשם קדשי
    kjvRefs:
    - Ezekiel 39:25
    kjvOsis:
    - Ezek.39.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.26
    scripture: tanakh
    name: Tanakh Ezekiel 39:26
    ref: Ezekiel 39:26
    book: Ezek
    section: neviim
    chapter: 39
    verse: 26
    ordinal: 13829
    text: And they shall bear their shame, and all their breach of faith which they have committed against Me, when they shall dwell safely in their land, and none shall make them afraid;
    translation: JPS 1917
    original: וְנָשׂוּ אֶת־כְּלִמָּתָם וְאֶת־כָּל־מַעֲלָם אֲשֶׁר מָעֲלוּ־בִי בְּשִׁבְתָּם עַל־אַדְמָתָם לָבֶטַח וְאֵין מַחֲרִיד׃
    hebrewPlain: ונשו את כלמתם ואת כל מעלם אשר מעלו בי בשבתם על אדמתם לבטח ואין מחריד
    kjvRefs:
    - Ezekiel 39:26
    kjvOsis:
    - Ezek.39.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.27
    scripture: tanakh
    name: Tanakh Ezekiel 39:27
    ref: Ezekiel 39:27
    book: Ezek
    section: neviim
    chapter: 39
    verse: 27
    ordinal: 13830
    text: when I have brought them back from the peoples, and gathered them out of their enemies’ lands, and am sanctified in them in the sight of many nations.
    translation: JPS 1917
    original: בְּשׁוֹבְבִי אוֹתָם מִן־הָעַמִּים וְקִבַּצְתִּי אֹתָם מֵאַרְצוֹת אֹיְבֵיהֶם וְנִקְדַּשְׁתִּי בָם לְעֵינֵי הַגּוֹיִם רַבִּים׃
    hebrewPlain: בשובבי אותם מן העמים וקבצתי אתם מארצות איביהם ונקדשתי בם לעיני הגוים רבים
    kjvRefs:
    - Ezekiel 39:27
    kjvOsis:
    - Ezek.39.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.28
    scripture: tanakh
    name: Tanakh Ezekiel 39:28
    ref: Ezekiel 39:28
    book: Ezek
    section: neviim
    chapter: 39
    verse: 28
    ordinal: 13831
    text: And they shall know that I am the LORD their God, in that I caused them to go into captivity among the nations, and have gathered them unto their own land; and I will leave none of them any more there;
    translation: JPS 1917
    original: וְיָדְעוּ כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם וְכִנַּסְתִּים עַל־אַדְמָתָם וְלֹא־אוֹתִיר עוֹד מֵהֶם שָׁם׃
    hebrewPlain: וידעו כי אני יהוה אלהיהם בהגלותי אתם אל הגוים וכנסתים על אדמתם ולא אותיר עוד מהם שם
    kjvRefs:
    - Ezekiel 39:28
    kjvOsis:
    - Ezek.39.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.39.29
    scripture: tanakh
    name: Tanakh Ezekiel 39:29
    ref: Ezekiel 39:29
    book: Ezek
    section: neviim
    chapter: 39
    verse: 29
    ordinal: 13832
    text: neither will I hide My face any more from them; for I have poured out My spirit upon the house of Israel, saith the Lord GOD.’
    translation: JPS 1917
    original: וְלֹא־אַסְתִּיר עוֹד פָּנַי מֵהֶם אֲשֶׁר שָׁפַכְתִּי אֶת־רוּחִי עַל־בֵּית יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ולא אסתיר עוד פני מהם אשר שפכתי את רוחי על בית ישראל נאם אדני יהוה
    kjvRefs:
    - Ezekiel 39:29
    kjvOsis:
    - Ezek.39.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.39
- type: TanakhVerse
  data:
    osis: Ezek.40.1
    scripture: tanakh
    name: Tanakh Ezekiel 40:1
    ref: Ezekiel 40:1
    book: Ezek
    section: neviim
    chapter: 40
    verse: 1
    ordinal: 13833
    text: In the five and twentieth year of our captivity, in the beginning of the year, in the tenth day of the month, in the fourteenth year after that the city was smitten, in the selfsame day, the hand of the LORD was upon me, and He brought me thither.
    translation: JPS 1917
    original: בְּעֶשְׂרִים וְחָמֵשׁ שָׁנָה לְגָלוּתֵנוּ בְּרֹאשׁ הַשָּׁנָה בֶּעָשׂוֹר לַחֹדֶשׁ בְּאַרְבַּע עֶשְׂרֵה שָׁנָה אַחַר אֲשֶׁר הֻכְּתָה הָעִיר בְּעֶצֶם הַיּוֹם הַזֶּה הָיְתָה עָלַי יַד־יְהוָה וַיָּבֵא אֹתִי שָׁמָּה׃
    hebrewPlain: בעשרים וחמש שנה לגלותנו בראש השנה בעשור לחדש בארבע עשרה שנה אחר אשר הכתה העיר בעצם היום הזה היתה עלי יד יהוה ויבא אתי שמה
    kjvRefs:
    - Ezekiel 40:1
    kjvOsis:
    - Ezek.40.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.2
    scripture: tanakh
    name: Tanakh Ezekiel 40:2
    ref: Ezekiel 40:2
    book: Ezek
    section: neviim
    chapter: 40
    verse: 2
    ordinal: 13834
    text: In the visions of God brought He me into the land of Israel, and set me down upon a very high mountain, whereon was as it were the frame of a city on the south.
    translation: JPS 1917
    original: בְּמַרְאוֹת אֱלֹהִים הֱבִיאַנִי אֶל־אֶרֶץ יִשְׂרָאֵל וַיְנִיחֵנִי אֶל־הַר גָּבֹהַּ מְאֹד וְעָלָיו כְּמִבְנֵה־עִיר מִנֶּגֶב׃
    hebrewPlain: במראות אלהים הביאני אל ארץ ישראל ויניחני אל הר גבה מאד ועליו כמבנה עיר מנגב
    kjvRefs:
    - Ezekiel 40:2
    kjvOsis:
    - Ezek.40.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.3
    scripture: tanakh
    name: Tanakh Ezekiel 40:3
    ref: Ezekiel 40:3
    book: Ezek
    section: neviim
    chapter: 40
    verse: 3
    ordinal: 13835
    text: And He brought me thither, and, behold, there was a man, whose appearance was like the appearance of brass, with a line of flax in his hand, and a measuring reed; and he stood in the gate.
    translation: JPS 1917
    original: וַיָּבֵיא אוֹתִי שָׁמָּה וְהִנֵּה־אִישׁ מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת וּפְתִיל־פִּשְׁתִּים בְּיָדוֹ וּקְנֵה הַמִּדָּה וְהוּא עֹמֵד בַּשָּׁעַר׃
    hebrewPlain: ויביא אותי שמה והנה איש מראהו כמראה נחשת ופתיל פשתים בידו וקנה המדה והוא עמד בשער
    kjvRefs:
    - Ezekiel 40:3
    kjvOsis:
    - Ezek.40.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.4
    scripture: tanakh
    name: Tanakh Ezekiel 40:4
    ref: Ezekiel 40:4
    book: Ezek
    section: neviim
    chapter: 40
    verse: 4
    ordinal: 13836
    text: 'And the man said unto me: ‘Son of man, behold with thine eyes, and hear with thine ears, and set thy heart upon all that I shall show thee, for to the intent that I might show them unto thee art thou brought thither; declare all that thou seest to the house of Israel.’ .'
    translation: JPS 1917
    original: וַיְדַבֵּר אֵלַי הָאִישׁ בֶּן־אָדָם רְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְּׁמָע וְשִׂים לִבְּךָ לְכֹל אֲשֶׁר־אֲנִי מַרְאֶה אוֹתָךְ כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה הַגֵּד אֶת־כָּל־אֲשֶׁר־אַתָּה רֹאֶה לְבֵית יִשְׂרָאֵל׃
    hebrewPlain: וידבר אלי האיש בן אדם ראה בעיניך ובאזניך שמע ושים לבך לכל אשר אני מראה אותך כי למען הראותכה הבאתה הנה הגד את כל אשר אתה ראה לבית ישראל
    kjvRefs:
    - Ezekiel 40:4
    kjvOsis:
    - Ezek.40.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.5
    scripture: tanakh
    name: Tanakh Ezekiel 40:5
    ref: Ezekiel 40:5
    book: Ezek
    section: neviim
    chapter: 40
    verse: 5
    ordinal: 13837
    text: And behold a wall on the outside of the house round about, and in the man’s hand a measuring reed of six cubits long, of a cubit and a hand-breadth each; so he measured the breadth of the building, one reed, and the height, one reed.
    translation: JPS 1917
    original: וְהִנֵּה חוֹמָה מִחוּץ לַבַּיִת סָבִיב סָבִיב וּבְיַד הָאִישׁ קְנֵה הַמִּדָּה שֵׁשׁ־אַמּוֹת בָּאַמָּה וָטֹפַח וַיָּמָד אֶת־רֹחַב הַבִּנְיָן קָנֶה אֶחָד וְקוֹמָה קָנֶה אֶחָד׃
    hebrewPlain: והנה חומה מחוץ לבית סביב סביב וביד האיש קנה המדה שש אמות באמה וטפח וימד את רחב הבנין קנה אחד וקומה קנה אחד
    kjvRefs:
    - Ezekiel 40:5
    kjvOsis:
    - Ezek.40.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.6
    scripture: tanakh
    name: Tanakh Ezekiel 40:6
    ref: Ezekiel 40:6
    book: Ezek
    section: neviim
    chapter: 40
    verse: 6
    ordinal: 13838
    text: Then came he unto the gate which looketh toward the east, and went up the steps thereof; and he measured the jamb of the gate, one reed broad, and the other jamb, one reed broad.
    translation: JPS 1917
    original: וַיָּבוֹא אֶל־שַׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה וַיַּעַל במעלותו [בְּמַעֲלוֹתָיו] וַיָּמָד אֶת־סַף הַשַּׁעַר קָנֶה אֶחָד רֹחַב וְאֵת סַף אֶחָד קָנֶה אֶחָד רֹחַב׃
    hebrewPlain: ויבוא אל שער אשר פניו דרך הקדימה ויעל במעלותו [במעלותיו] וימד את סף השער קנה אחד רחב ואת סף אחד קנה אחד רחב
    kjvRefs:
    - Ezekiel 40:6
    kjvOsis:
    - Ezek.40.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.7
    scripture: tanakh
    name: Tanakh Ezekiel 40:7
    ref: Ezekiel 40:7
    book: Ezek
    section: neviim
    chapter: 40
    verse: 7
    ordinal: 13839
    text: And every cell was one reed long, and one reed broad; and the space between the cells was five cubits; and the jambs of the gate by the porch of the gate within were one reed.
    translation: JPS 1917
    original: וְהַתָּא קָנֶה אֶחָד אֹרֶךְ וְקָנֶה אֶחָד רֹחַב וּבֵין הַתָּאִים חָמֵשׁ אַמּוֹת וְסַף הַשַּׁעַר מֵאֵצֶל אוּלָם הַשַּׁעַר מֵהַבַּיִת קָנֶה אֶחָד׃
    hebrewPlain: והתא קנה אחד ארך וקנה אחד רחב ובין התאים חמש אמות וסף השער מאצל אולם השער מהבית קנה אחד
    kjvRefs:
    - Ezekiel 40:7
    kjvOsis:
    - Ezek.40.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.8
    scripture: tanakh
    name: Tanakh Ezekiel 40:8
    ref: Ezekiel 40:8
    book: Ezek
    section: neviim
    chapter: 40
    verse: 8
    ordinal: 13840
    text: He measured also the porch of the gate toward the house, one reed.
    translation: JPS 1917
    original: וַיָּמָד אֶת־אֻלָם הַשַּׁעַר מֵהַבַּיִת קָנֶה אֶחָד׃
    hebrewPlain: וימד את אלם השער מהבית קנה אחד
    kjvRefs:
    - Ezekiel 40:8
    kjvOsis:
    - Ezek.40.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.9
    scripture: tanakh
    name: Tanakh Ezekiel 40:9
    ref: Ezekiel 40:9
    book: Ezek
    section: neviim
    chapter: 40
    verse: 9
    ordinal: 13841
    text: Then measured he the porch of the gate, eight cubits; and the posts thereof, two cubits; and the porch of the gate was inward.
    translation: JPS 1917
    original: וַיָּמָד אֶת־אֻלָם הַשַּׁעַר שְׁמֹנֶה אַמּוֹת ואילו [וְאֵילָיו] שְׁתַּיִם אַמּוֹת וְאֻלָם הַשַּׁעַר מֵהַבָּיִת׃
    hebrewPlain: וימד את אלם השער שמנה אמות ואילו [ואיליו] שתים אמות ואלם השער מהבית
    kjvRefs:
    - Ezekiel 40:9
    kjvOsis:
    - Ezek.40.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.10
    scripture: tanakh
    name: Tanakh Ezekiel 40:10
    ref: Ezekiel 40:10
    book: Ezek
    section: neviim
    chapter: 40
    verse: 10
    ordinal: 13842
    text: And the cells of the gate eastward were three on this side, and three on that side; they three were of one measure; and the posts had one measure on this side and on that side.
    translation: JPS 1917
    original: וְתָאֵי הַשַּׁעַר דֶּרֶךְ הַקָּדִים שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה מִדָּה אַחַת לִשְׁלָשְׁתָּם וּמִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ׃
    hebrewPlain: ותאי השער דרך הקדים שלשה מפה ושלשה מפה מדה אחת לשלשתם ומדה אחת לאילם מפה ומפו
    kjvRefs:
    - Ezekiel 40:10
    kjvOsis:
    - Ezek.40.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.11
    scripture: tanakh
    name: Tanakh Ezekiel 40:11
    ref: Ezekiel 40:11
    book: Ezek
    section: neviim
    chapter: 40
    verse: 11
    ordinal: 13843
    text: And he measured the breadth of the entry of the gate, ten cubits; and the length of the gate, thirteen cubits;
    translation: JPS 1917
    original: וַיָּמָד אֶת־רֹחַב פֶּתַח־הַשַּׁעַר עֶשֶׂר אַמּוֹת אֹרֶךְ הַשַּׁעַר שְׁלוֹשׁ עֶשְׂרֵה אַמּוֹת׃
    hebrewPlain: וימד את רחב פתח השער עשר אמות ארך השער שלוש עשרה אמות
    kjvRefs:
    - Ezekiel 40:11
    kjvOsis:
    - Ezek.40.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.12
    scripture: tanakh
    name: Tanakh Ezekiel 40:12
    ref: Ezekiel 40:12
    book: Ezek
    section: neviim
    chapter: 40
    verse: 12
    ordinal: 13844
    text: and a border before the cells, one cubit [on this side], and a border, one cubit on that side; and the cells, six cubits on this side, and six cubits on that side.
    translation: JPS 1917
    original: וּגְבוּל לִפְנֵי הַתָּאוֹת אַמָּה אֶחָת וְאַמָּה־אַחַת גְּבוּל מִפֹּה וְהַתָּא שֵׁשׁ־אַמּוֹת מִפּוֹ וְשֵׁשׁ אַמּוֹת מִפּוֹ׃
    hebrewPlain: וגבול לפני התאות אמה אחת ואמה אחת גבול מפה והתא שש אמות מפו ושש אמות מפו
    kjvRefs:
    - Ezekiel 40:12
    kjvOsis:
    - Ezek.40.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.13
    scripture: tanakh
    name: Tanakh Ezekiel 40:13
    ref: Ezekiel 40:13
    book: Ezek
    section: neviim
    chapter: 40
    verse: 13
    ordinal: 13845
    text: And he measured the gate from the roof of the one cell to the roof of the other, a breadth of five and twenty cubits; door against door.
    translation: JPS 1917
    original: וַיָּמָד אֶת־הַשַּׁעַר מִגַּג הַתָּא לְגַגּוֹ רֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת פֶּתַח נֶגֶד פָּתַח׃
    hebrewPlain: וימד את השער מגג התא לגגו רחב עשרים וחמש אמות פתח נגד פתח
    kjvRefs:
    - Ezekiel 40:13
    kjvOsis:
    - Ezek.40.13
