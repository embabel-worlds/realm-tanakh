- type: TanakhVerse
  data:
    osis: Ezek.13.5
    scripture: tanakh
    name: Tanakh Ezekiel 13:5
    ref: Ezekiel 13:5
    book: Ezek
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 13068
    text: Ye have not gone up into the breaches, neither made up the hedge for the house of Israel, to stand in the battle in the day of the LORD.
    translation: JPS 1917
    original: לֹא עֲלִיתֶם בַּפְּרָצוֹת וַתִּגְדְּרוּ גָדֵר עַל־בֵּית יִשְׂרָאֵל לַעֲמֹד בַּמִּלְחָמָה בְּיוֹם יְהוָה׃
    hebrewPlain: לא עליתם בפרצות ותגדרו גדר על בית ישראל לעמד במלחמה ביום יהוה
    kjvRefs:
    - Ezekiel 13:5
    kjvOsis:
    - Ezek.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.6
    scripture: tanakh
    name: Tanakh Ezekiel 13:6
    ref: Ezekiel 13:6
    book: Ezek
    section: neviim
    chapter: 13
    verse: 6
    ordinal: 13069
    text: 'They have seen vanity and lying divination, that say: The LORD saith; and the LORD hath not sent them, yet they hope that the word would be confirmed!'
    translation: JPS 1917
    original: חָזוּ שָׁוְא וְקֶסֶם כָּזָב הָאֹמְרִים נְאֻם־יְהוָה וַיהוָה לֹא שְׁלָחָם וְיִחֲלוּ לְקַיֵּם דָּבָר׃
    hebrewPlain: חזו שוא וקסם כזב האמרים נאם יהוה ויהוה לא שלחם ויחלו לקים דבר
    kjvRefs:
    - Ezekiel 13:6
    kjvOsis:
    - Ezek.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.7
    scripture: tanakh
    name: Tanakh Ezekiel 13:7
    ref: Ezekiel 13:7
    book: Ezek
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 13070
    text: 'Have ye not seen a vain vision, and have ye not spoken a lying divination, whereas ye say: The LORD saith; albeit I have not spoken?'
    translation: JPS 1917
    original: הֲלוֹא מַחֲזֵה־שָׁוְא חֲזִיתֶם וּמִקְסַם כָּזָב אֲמַרְתֶּם וְאֹמְרִים נְאֻם־יְהוָה וַאֲנִי לֹא דִבַּרְתִּי׃
    hebrewPlain: הלוא מחזה שוא חזיתם ומקסם כזב אמרתם ואמרים נאם יהוה ואני לא דברתי
    kjvRefs:
    - Ezekiel 13:7
    kjvOsis:
    - Ezek.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.8
    scripture: tanakh
    name: Tanakh Ezekiel 13:8
    ref: Ezekiel 13:8
    book: Ezek
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 13071
    text: 'Therefore thus saith the Lord GOD: Because ye have spoken vanity, and seen lies, therefore, behold, I am against you, saith the Lord GOD.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן דַּבֶּרְכֶם שָׁוְא וַחֲזִיתֶם כָּזָב לָכֵן הִנְנִי אֲלֵיכֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: לכן כה אמר אדני יהוה יען דברכם שוא וחזיתם כזב לכן הנני אליכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 13:8
    kjvOsis:
    - Ezek.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.9
    scripture: tanakh
    name: Tanakh Ezekiel 13:9
    ref: Ezekiel 13:9
    book: Ezek
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 13072
    text: And My hand shall be against the prophets that see vanity, and that divine lies; they shall not be in the council of My people, neither shall they be written in the register of the house of Israel, neither shall they enter into the land of Israel; and ye shall know that I am the Lord GOD.
    translation: JPS 1917
    original: וְהָיְתָה יָדִי אֶל־הַנְּבִיאִים הַחֹזִים שָׁוְא וְהַקֹּסְמִים כָּזָב בְּסוֹד עַמִּי לֹא־יִהְיוּ וּבִכְתָב בֵּית־יִשְׂרָאֵל לֹא יִכָּתֵבוּ וְאֶל־אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ וִידַעְתֶּם כִּי אֲנִי אֲדֹנָי יְהוִה׃
    hebrewPlain: והיתה ידי אל הנביאים החזים שוא והקסמים כזב בסוד עמי לא יהיו ובכתב בית ישראל לא יכתבו ואל אדמת ישראל לא יבאו וידעתם כי אני אדני יהוה
    kjvRefs:
    - Ezekiel 13:9
    kjvOsis:
    - Ezek.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.10
    scripture: tanakh
    name: Tanakh Ezekiel 13:10
    ref: Ezekiel 13:10
    book: Ezek
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 13073
    text: 'Because, even because they have led My people astray, saying: Peace, and there is no peace; and when it buildeth up a slight wall, behold, they daub it with whited plaster;'
    translation: JPS 1917
    original: יַעַן וּבְיַעַן הִטְעוּ אֶת־עַמִּי לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם וְהוּא בֹּנֶה חַיִץ וְהִנָּם טָחִים אֹתוֹ תָּפֵל׃
    hebrewPlain: יען וביען הטעו את עמי לאמר שלום ואין שלום והוא בנה חיץ והנם טחים אתו תפל
    kjvRefs:
    - Ezekiel 13:10
    kjvOsis:
    - Ezek.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.11
    scripture: tanakh
    name: Tanakh Ezekiel 13:11
    ref: Ezekiel 13:11
    book: Ezek
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 13074
    text: say unto them that daub it with whited plaster, that it shall fall; there shall be an overflowing shower, and ye, O great hailstones, shall fall, and a stormy wind shall break forth,
    translation: JPS 1917
    original: אֱמֹר אֶל־טָחֵי תָפֵל וְיִפֹּל הָיָה גֶּשֶׁם שׁוֹטֵף וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה וְרוּחַ סְעָרוֹת תְּבַקֵּעַ׃
    hebrewPlain: אמר אל טחי תפל ויפל היה גשם שוטף ואתנה אבני אלגביש תפלנה ורוח סערות תבקע
    kjvRefs:
    - Ezekiel 13:11
    kjvOsis:
    - Ezek.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.12
    scripture: tanakh
    name: Tanakh Ezekiel 13:12
    ref: Ezekiel 13:12
    book: Ezek
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 13075
    text: 'and, lo, when the wall is fallen, shall it not be said unto you: Where is the daubing wherewith ye have daubed it?'
    translation: JPS 1917
    original: וְהִנֵּה נָפַל הַקִּיר הֲלוֹא יֵאָמֵר אֲלֵיכֶם אַיֵּה הַטִּיחַ אֲשֶׁר טַחְתֶּם׃
    hebrewPlain: והנה נפל הקיר הלוא יאמר אליכם איה הטיח אשר טחתם
    kjvRefs:
    - Ezekiel 13:12
    kjvOsis:
    - Ezek.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.13
    scripture: tanakh
    name: Tanakh Ezekiel 13:13
    ref: Ezekiel 13:13
    book: Ezek
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 13076
    text: 'Therefore thus saith the Lord GOD: I will even cause a stormy wind to break forth in My fury; and there shall be an overflowing shower in Mine anger, and great hailstones in fury to consume it.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה וּבִקַּעְתִּי רוּחַ־סְעָרוֹת בַּחֲמָתִי וְגֶשֶׁם שֹׁטֵף בְּאַפִּי יִהְיֶה וְאַבְנֵי אֶלְגָּבִישׁ בְּחֵמָה לְכָלָה׃
    hebrewPlain: לכן כה אמר אדני יהוה ובקעתי רוח סערות בחמתי וגשם שטף באפי יהיה ואבני אלגביש בחמה לכלה
    kjvRefs:
    - Ezekiel 13:13
    kjvOsis:
    - Ezek.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.14
    scripture: tanakh
    name: Tanakh Ezekiel 13:14
    ref: Ezekiel 13:14
    book: Ezek
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 13077
    text: So will I break down the wall that ye have daubed with whited plaster, and bring it down to the ground, so that the foundation thereof shall be uncovered; and it shall fall, and ye shall be consumed in the midst thereof; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְהָרַסְתִּי אֶת־הַקִּיר אֲשֶׁר־טַחְתֶּם תָּפֵל וְהִגַּעְתִּיהוּ אֶל־הָאָרֶץ וְנִגְלָה יְסֹדוֹ וְנָפְלָה וּכְלִיתֶם בְּתוֹכָהּ וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והרסתי את הקיר אשר טחתם תפל והגעתיהו אל הארץ ונגלה יסדו ונפלה וכליתם בתוכה וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 13:14
    kjvOsis:
    - Ezek.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.15
    scripture: tanakh
    name: Tanakh Ezekiel 13:15
    ref: Ezekiel 13:15
    book: Ezek
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 13078
    text: 'Thus will I spend My fury upon the wall, and upon them that have daubed it with whited plaster; and I will say unto you: The wall is no more, neither they that daubed it;'
    translation: JPS 1917
    original: וְכִלֵּיתִי אֶת־חֲמָתִי בַּקִּיר וּבַטָּחִים אֹתוֹ תָּפֵל וְאֹמַר לָכֶם אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ׃
    hebrewPlain: וכליתי את חמתי בקיר ובטחים אתו תפל ואמר לכם אין הקיר ואין הטחים אתו
    kjvRefs:
    - Ezekiel 13:15
    kjvOsis:
    - Ezek.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.16
    scripture: tanakh
    name: Tanakh Ezekiel 13:16
    ref: Ezekiel 13:16
    book: Ezek
    section: neviim
    chapter: 13
    verse: 16
    ordinal: 13079
    text: to wit, the prophets of Israel that prophesy concerning Jerusalem, and that see visions of peace for her, and there is no peace, saith the Lord GOD.
    translation: JPS 1917
    original: נְבִיאֵי יִשְׂרָאֵל הַנִבְּאִים אֶל־יְרוּשָׁלִַם וְהַחֹזִים לָהּ חֲזוֹן שָׁלֹם וְאֵין שָׁלֹם נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: נביאי ישראל הנבאים אל ירושלם והחזים לה חזון שלם ואין שלם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 13:16
    kjvOsis:
    - Ezek.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.17
    scripture: tanakh
    name: Tanakh Ezekiel 13:17
    ref: Ezekiel 13:17
    book: Ezek
    section: neviim
    chapter: 13
    verse: 17
    ordinal: 13080
    text: And thou, son of man, set thy face against the daughters of thy people, that prophesy out of their own heart; and prophesy thou against them,
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם שִׂים פָּנֶיךָ אֶל־בְּנוֹת עַמְּךָ הַמִּתְנַבְּאוֹת מִלִּבְּהֶן וְהִנָּבֵא עֲלֵיהֶן׃
    hebrewPlain: ואתה בן אדם שים פניך אל בנות עמך המתנבאות מלבהן והנבא עליהן
    kjvRefs:
    - Ezekiel 13:17
    kjvOsis:
    - Ezek.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.18
    scripture: tanakh
    name: Tanakh Ezekiel 13:18
    ref: Ezekiel 13:18
    book: Ezek
    section: neviim
    chapter: 13
    verse: 18
    ordinal: 13081
    text: 'and say: Thus saith the Lord GOD: Woe to the women that sew cushions upon all elbows, and make pads for the head of persons of every stature to hunt souls! Will ye hunt the souls of My people, and save souls alive for yourselves?'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה־אָמַר אֲדֹנָי יְהוִה הוֹי לִמְתַפְּרוֹת כְּסָתוֹת עַל כָּל־אַצִּילֵי יָדַי וְעֹשׂוֹת הַמִּסְפָּחוֹת עַל־רֹאשׁ כָּל־קוֹמָה לְצוֹדֵד נְפָשׁוֹת הַנְּפָשׁוֹת תְּצוֹדֵדְנָה לְעַמִּי וּנְפָשׁוֹת לָכֶנָה תְחַיֶּינָה׃
    hebrewPlain: ואמרת כה אמר אדני יהוה הוי למתפרות כסתות על כל אצילי ידי ועשות המספחות על ראש כל קומה לצודד נפשות הנפשות תצודדנה לעמי ונפשות לכנה תחיינה
    kjvRefs:
    - Ezekiel 13:18
    kjvOsis:
    - Ezek.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.19
    scripture: tanakh
    name: Tanakh Ezekiel 13:19
    ref: Ezekiel 13:19
    book: Ezek
    section: neviim
    chapter: 13
    verse: 19
    ordinal: 13082
    text: And ye have profaned Me among My people for handfuls of barley and for crumbs of bread, to slay the souls that should not die, and to save the souls alive that should not live, by your lying to My people that hearken unto lies.
    translation: JPS 1917
    original: וַתְּחַלֶּלְנָה אֹתִי אֶל־עַמִּי בְּשַׁעֲלֵי שְׂעֹרִים וּבִפְתוֹתֵי לֶחֶם לְהָמִית נְפָשׁוֹת אֲשֶׁר לֹא־תְמוּתֶנָה וּלְחַיּוֹת נְפָשׁוֹת אֲשֶׁר לֹא־תִחְיֶינָה בְּכַזֶּבְכֶם לְעַמִּי שֹׁמְעֵי כָזָב׃
    hebrewPlain: ותחללנה אתי אל עמי בשעלי שערים ובפתותי לחם להמית נפשות אשר לא תמותנה ולחיות נפשות אשר לא תחיינה בכזבכם לעמי שמעי כזב
    kjvRefs:
    - Ezekiel 13:19
    kjvOsis:
    - Ezek.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.20
    scripture: tanakh
    name: Tanakh Ezekiel 13:20
    ref: Ezekiel 13:20
    book: Ezek
    section: neviim
    chapter: 13
    verse: 20
    ordinal: 13083
    text: 'Wherefore thus saith the Lord GOD: Behold, I am against your cushions, wherewith ye hunt the souls as birds, and I will tear them from your arms; and I will let the souls go, even the souls that ye hunt as birds.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי אֶל־כִּסְּתוֹתֵיכֶנָה אֲשֶׁר אַתֵּנָה מְצֹדְדוֹת שָׁם אֶת־הַנְּפָשׁוֹת לְפֹרְחוֹת וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם וְשִׁלַּחְתִּי אֶת־הַנְּפָשׁוֹת אֲשֶׁר אַתֶּם מְצֹדְדוֹת אֶת־נְפָשִׁים לְפֹרְחֹת׃
    hebrewPlain: לכן כה אמר אדני יהוה הנני אל כסתותיכנה אשר אתנה מצדדות שם את הנפשות לפרחות וקרעתי אתם מעל זרועתיכם ושלחתי את הנפשות אשר אתם מצדדות את נפשים לפרחת
    kjvRefs:
    - Ezekiel 13:20
    kjvOsis:
    - Ezek.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.21
    scripture: tanakh
    name: Tanakh Ezekiel 13:21
    ref: Ezekiel 13:21
    book: Ezek
    section: neviim
    chapter: 13
    verse: 21
    ordinal: 13084
    text: Your pads also will I tear, and deliver My people out of your hand, and they shall be no more in your hand to be hunted; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְקָרַעְתִּי אֶת־מִסְפְּחֹתֵיכֶם וְהִצַּלְתִּי אֶת־עַמִּי מִיֶּדְכֶן וְלֹא־יִהְיוּ עוֹד בְּיֶדְכֶן לִמְצוּדָה וִידַעְתֶּן כִּי־אֲנִי יְהוָה׃
    hebrewPlain: וקרעתי את מספחתיכם והצלתי את עמי מידכן ולא יהיו עוד בידכן למצודה וידעתן כי אני יהוה
    kjvRefs:
    - Ezekiel 13:21
    kjvOsis:
    - Ezek.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.22
    scripture: tanakh
    name: Tanakh Ezekiel 13:22
    ref: Ezekiel 13:22
    book: Ezek
    section: neviim
    chapter: 13
    verse: 22
    ordinal: 13085
    text: Because with lies ye have cowed the heart of the righteous, when I have not grieved him; and strengthened the hands of the wicked, that he should not return from his wicked way, that he be saved alive;
    translation: JPS 1917
    original: יַעַן הַכְאוֹת לֵב־צַדִּיק שֶׁקֶר וַאֲנִי לֹא הִכְאַבְתִּיו וּלְחַזֵּק יְדֵי רָשָׁע לְבִלְתִּי־שׁוּב מִדַּרְכּוֹ הָרָע לְהַחֲיֹתוֹ׃
    hebrewPlain: יען הכאות לב צדיק שקר ואני לא הכאבתיו ולחזק ידי רשע לבלתי שוב מדרכו הרע להחיתו
    kjvRefs:
    - Ezekiel 13:22
    kjvOsis:
    - Ezek.13.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.13.23
    scripture: tanakh
    name: Tanakh Ezekiel 13:23
    ref: Ezekiel 13:23
    book: Ezek
    section: neviim
    chapter: 13
    verse: 23
    ordinal: 13086
    text: therefore ye shall no more see vanity, nor divine divinations; and I will deliver My people out of your hand; and ye shall know that I am the LORD.’
    translation: JPS 1917
    original: לָכֵן שָׁוְא לֹא תֶחֱזֶינָה וְקֶסֶם לֹא־תִקְסַמְנָה עוֹד וְהִצַּלְתִּי אֶת־עַמִּי מִיֶּדְכֶן וִידַעְתֶּן כִּי־אֲנִי יְהוָה׃
    hebrewPlain: לכן שוא לא תחזינה וקסם לא תקסמנה עוד והצלתי את עמי מידכן וידעתן כי אני יהוה
    kjvRefs:
    - Ezekiel 13:23
    kjvOsis:
    - Ezek.13.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.13
- type: TanakhVerse
  data:
    osis: Ezek.14.1
    scripture: tanakh
    name: Tanakh Ezekiel 14:1
    ref: Ezekiel 14:1
    book: Ezek
    section: neviim
    chapter: 14
    verse: 1
    ordinal: 13087
    text: Then came certain of the elders of Israel unto me, and sat before me.
    translation: JPS 1917
    original: וַיָּבוֹא אֵלַי אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל וַיֵּשְׁבוּ לְפָנָי׃
    hebrewPlain: ויבוא אלי אנשים מזקני ישראל וישבו לפני
    kjvRefs:
    - Ezekiel 14:1
    kjvOsis:
    - Ezek.14.1
  relations:
