- type: TanakhVerse
  data:
    osis: Ezek.22.18
    scripture: tanakh
    name: Tanakh Ezekiel 22:18
    ref: Ezekiel 22:18
    book: Ezek
    section: neviim
    chapter: 22
    verse: 18
    ordinal: 13349
    text: ’Son of man, the house of Israel is become dross unto Me; all of them are brass and tin and iron and lead, in the midst of the furnace; they are the dross of silver.
    translation: JPS 1917
    original: בֶּן־אָדָם הָיוּ־לִי בֵית־יִשְׂרָאֵל לסוג [לְסִיג] כֻּלָּם נְחֹשֶׁת וּבְדִיל וּבַרְזֶל וְעוֹפֶרֶת בְּתוֹךְ כּוּר סִגִים כֶּסֶף הָיוּ׃
    hebrewPlain: בן אדם היו לי בית ישראל לסוג [לסיג] כלם נחשת ובדיל וברזל ועופרת בתוך כור סגים כסף היו
    kjvRefs:
    - Ezekiel 22:18
    kjvOsis:
    - Ezek.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.19
    scripture: tanakh
    name: Tanakh Ezekiel 22:19
    ref: Ezekiel 22:19
    book: Ezek
    section: neviim
    chapter: 22
    verse: 19
    ordinal: 13350
    text: 'Therefore thus saith the Lord GOD: Because ye are all become dross, therefore, behold, I will gather you into the midst of Jerusalem.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן הֱיוֹת כֻּלְּכֶם לְסִגִים לָכֵן הִנְנִי קֹבֵץ אֶתְכֶם אֶל־תּוֹךְ יְרוּשָׁלִָם׃
    hebrewPlain: לכן כה אמר אדני יהוה יען היות כלכם לסגים לכן הנני קבץ אתכם אל תוך ירושלם
    kjvRefs:
    - Ezekiel 22:19
    kjvOsis:
    - Ezek.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.20
    scripture: tanakh
    name: Tanakh Ezekiel 22:20
    ref: Ezekiel 22:20
    book: Ezek
    section: neviim
    chapter: 22
    verse: 20
    ordinal: 13351
    text: As they gather silver and brass and iron and lead and tin into the midst of the furnace, to blow the fire upon it, to melt it; so will I gather you in Mine anger and in My fury, and I will cast you in, and melt you.
    translation: JPS 1917
    original: קְבֻצַת כֶּסֶף וּנְחֹשֶׁת וּבַרְזֶל וְעוֹפֶרֶת וּבְדִיל אֶל־תּוֹךְ כּוּר לָפַחַת־עָלָיו אֵשׁ לְהַנְתִּיךְ כֵּן אֶקְבֹּץ בְּאַפִּי וּבַחֲמָתִי וְהִנַּחְתִּי וְהִתַּכְתִּי אֶתְכֶם׃
    hebrewPlain: קבצת כסף ונחשת וברזל ועופרת ובדיל אל תוך כור לפחת עליו אש להנתיך כן אקבץ באפי ובחמתי והנחתי והתכתי אתכם
    kjvRefs:
    - Ezekiel 22:20
    kjvOsis:
    - Ezek.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.21
    scripture: tanakh
    name: Tanakh Ezekiel 22:21
    ref: Ezekiel 22:21
    book: Ezek
    section: neviim
    chapter: 22
    verse: 21
    ordinal: 13352
    text: Yea, I will gather you, and blow upon you with the fire of My wrath, and ye shall be melted in the midst thereof.
    translation: JPS 1917
    original: וְכִנַּסְתִּי אֶתְכֶם וְנָפַחְתִּי עֲלֵיכֶם בְּאֵשׁ עֶבְרָתִי וְנִתַּכְתֶּם בְּתוֹכָהּ׃
    hebrewPlain: וכנסתי אתכם ונפחתי עליכם באש עברתי ונתכתם בתוכה
    kjvRefs:
    - Ezekiel 22:21
    kjvOsis:
    - Ezek.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.22
    scripture: tanakh
    name: Tanakh Ezekiel 22:22
    ref: Ezekiel 22:22
    book: Ezek
    section: neviim
    chapter: 22
    verse: 22
    ordinal: 13353
    text: As silver is melted in the midst of the furnace, so shall ye be melted in the midst thereof; and ye shall know that I the LORD have poured out My fury upon you.’
    translation: JPS 1917
    original: כְּהִתּוּךְ כֶּסֶף בְּתוֹךְ כּוּר כֵּן תֻּתְּכוּ בְתוֹכָהּ וִידַעְתֶּם כִּי־אֲנִי יְהוָה שָׁפַכְתִּי חֲמָתִי עֲלֵיכֶם׃
    hebrewPlain: כהתוך כסף בתוך כור כן תתכו בתוכה וידעתם כי אני יהוה שפכתי חמתי עליכם
    kjvRefs:
    - Ezekiel 22:22
    kjvOsis:
    - Ezek.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.23
    scripture: tanakh
    name: Tanakh Ezekiel 22:23
    ref: Ezekiel 22:23
    book: Ezek
    section: neviim
    chapter: 22
    verse: 23
    ordinal: 13354
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 22:23
    kjvOsis:
    - Ezek.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.24
    scripture: tanakh
    name: Tanakh Ezekiel 22:24
    ref: Ezekiel 22:24
    book: Ezek
    section: neviim
    chapter: 22
    verse: 24
    ordinal: 13355
    text: '’Son of man, say unto her: Thou art a land that is not cleansed, nor rained upon in the day of indignation.'
    translation: JPS 1917
    original: בֶּן־אָדָם אֱמָר־לָהּ אַתְּ אֶרֶץ לֹא מְטֹהָרָה הִיא לֹא גֻשְׁמָהּ בְּיוֹם זָעַם׃
    hebrewPlain: בן אדם אמר לה את ארץ לא מטהרה היא לא גשמה ביום זעם
    kjvRefs:
    - Ezekiel 22:24
    kjvOsis:
    - Ezek.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.25
    scripture: tanakh
    name: Tanakh Ezekiel 22:25
    ref: Ezekiel 22:25
    book: Ezek
    section: neviim
    chapter: 22
    verse: 25
    ordinal: 13356
    text: There is a conspiracy of her prophets in the midst thereof, like a roaring lion ravening the prey; they have devoured souls, they take treasure and precious things, they have made her widows many in the midst thereof.
    translation: JPS 1917
    original: קֶשֶׁר נְבִיאֶיהָ בְּתוֹכָהּ כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף נֶפֶשׁ אָכָלוּ חֹסֶן וִיקָר יִקָּחוּ אַלְמְנוֹתֶיהָ הִרְבּוּ בְתוֹכָהּ׃
    hebrewPlain: קשר נביאיה בתוכה כארי שואג טרף טרף נפש אכלו חסן ויקר יקחו אלמנותיה הרבו בתוכה
    kjvRefs:
    - Ezekiel 22:25
    kjvOsis:
    - Ezek.22.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.26
    scripture: tanakh
    name: Tanakh Ezekiel 22:26
    ref: Ezekiel 22:26
    book: Ezek
    section: neviim
    chapter: 22
    verse: 26
    ordinal: 13357
    text: Her priests have done violence to My law, and have profaned My holy things; they have put no difference between the holy and the common, neither have they taught difference between the unclean and the clean, and have hid their eyes from My sabbaths, and I am profaned among them.
    translation: JPS 1917
    original: כֹּהֲנֶיהָ חָמְסוּ תוֹרָתִי וַיְחַלְּלוּ קָדָשַׁי בֵּין־קֹדֶשׁ לְחֹל לֹא הִבְדִּילוּ וּבֵין־הַטָּמֵא לְטָהוֹר לֹא הוֹדִיעוּ וּמִשַׁבְּתוֹתַי הֶעְלִימוּ עֵינֵיהֶם וָאֵחַל בְּתוֹכָם׃
    hebrewPlain: כהניה חמסו תורתי ויחללו קדשי בין קדש לחל לא הבדילו ובין הטמא לטהור לא הודיעו ומשבתותי העלימו עיניהם ואחל בתוכם
    kjvRefs:
    - Ezekiel 22:26
    kjvOsis:
    - Ezek.22.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.27
    scripture: tanakh
    name: Tanakh Ezekiel 22:27
    ref: Ezekiel 22:27
    book: Ezek
    section: neviim
    chapter: 22
    verse: 27
    ordinal: 13358
    text: 'Her princes in the midst thereof are like wolves ravening the prey: to shed blood, and to destroy souls, so as to get dishonest gain.'
    translation: JPS 1917
    original: שָׂרֶיהָ בְקִרְבָּהּ כִּזְאֵבִים טֹרְפֵי טָרֶף לִשְׁפָּךְ־דָּם לְאַבֵּד נְפָשׁוֹת לְמַעַן בְּצֹעַ בָּצַע׃
    hebrewPlain: שריה בקרבה כזאבים טרפי טרף לשפך דם לאבד נפשות למען בצע בצע
    kjvRefs:
    - Ezekiel 22:27
    kjvOsis:
    - Ezek.22.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.28
    scripture: tanakh
    name: Tanakh Ezekiel 22:28
    ref: Ezekiel 22:28
    book: Ezek
    section: neviim
    chapter: 22
    verse: 28
    ordinal: 13359
    text: 'And her prophets have daubed for them with whited plaster, seeing falsehood, and divining lies unto them, saying: Thus saith the Lord GOD, when the LORD hath not spoken.'
    translation: JPS 1917
    original: וּנְבִיאֶיהָ טָחוּ לָהֶם תָּפֵל חֹזִים שָׁוְא וְקֹסְמִים לָהֶם כָּזָב אֹמְרִים כֹּה אָמַר אֲדֹנָי יְהוִה וַיהוָה לֹא דִבֵּר׃
    hebrewPlain: ונביאיה טחו להם תפל חזים שוא וקסמים להם כזב אמרים כה אמר אדני יהוה ויהוה לא דבר
    kjvRefs:
    - Ezekiel 22:28
    kjvOsis:
    - Ezek.22.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.29
    scripture: tanakh
    name: Tanakh Ezekiel 22:29
    ref: Ezekiel 22:29
    book: Ezek
    section: neviim
    chapter: 22
    verse: 29
    ordinal: 13360
    text: The people of the land have used oppression, and exercised robbery, and have wronged the poor and needy, and have oppressed the stranger unlawfully.
    translation: JPS 1917
    original: עַם הָאָרֶץ עָשְׁקוּ עֹשֶׁק וְגָזְלוּ גָּזֵל וְעָנִי וְאֶבְיוֹן הוֹנוּ וְאֶת־הַגֵּר עָשְׁקוּ בְּלֹא מִשְׁפָּט׃
    hebrewPlain: עם הארץ עשקו עשק וגזלו גזל ועני ואביון הונו ואת הגר עשקו בלא משפט
    kjvRefs:
    - Ezekiel 22:29
    kjvOsis:
    - Ezek.22.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.30
    scripture: tanakh
    name: Tanakh Ezekiel 22:30
    ref: Ezekiel 22:30
    book: Ezek
    section: neviim
    chapter: 22
    verse: 30
    ordinal: 13361
    text: And I sought for a man among them, that should make up the hedge, and stand in the breach before Me for the land, that I should not destroy it; but I found none.
    translation: JPS 1917
    original: וָאֲבַקֵּשׁ מֵהֶם אִישׁ גֹּדֵר־גָּדֵר וְעֹמֵד בַּפֶּרֶץ לְפָנַי בְּעַד הָאָרֶץ לְבִלְתִּי שַׁחֲתָהּ וְלֹא מָצָאתִי׃
    hebrewPlain: ואבקש מהם איש גדר גדר ועמד בפרץ לפני בעד הארץ לבלתי שחתה ולא מצאתי
    kjvRefs:
    - Ezekiel 22:30
    kjvOsis:
    - Ezek.22.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.22.31
    scripture: tanakh
    name: Tanakh Ezekiel 22:31
    ref: Ezekiel 22:31
    book: Ezek
    section: neviim
    chapter: 22
    verse: 31
    ordinal: 13362
    text: Therefore have I poured out Mine indignation upon them; I have consumed them with the fire of My wrath; their own way have I brought upon their heads, saith the Lord GOD.’
    translation: JPS 1917
    original: וָאֶשְׁפֹּךְ עֲלֵיהֶם זַעְמִי בְּאֵשׁ עֶבְרָתִי כִּלִּיתִים דַּרְכָּם בְּרֹאשָׁם נָתַתִּי נְאֻם אֲדֹנָי יְהֹוִה׃
    hebrewPlain: ואשפך עליהם זעמי באש עברתי כליתים דרכם בראשם נתתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 22:31
    kjvOsis:
    - Ezek.22.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.22
- type: TanakhVerse
  data:
    osis: Ezek.23.1
    scripture: tanakh
    name: Tanakh Ezekiel 23:1
    ref: Ezekiel 23:1
    book: Ezek
    section: neviim
    chapter: 23
    verse: 1
    ordinal: 13363
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 23:1
    kjvOsis:
    - Ezek.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
