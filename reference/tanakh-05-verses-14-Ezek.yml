    ref: Ezekiel 20:12
    book: Ezek
    section: neviim
    chapter: 20
    verse: 12
    ordinal: 13262
    text: Moreover also I gave them My sabbaths, to be a sign between Me and them, that they might know that I am the LORD that sanctify them.
    translation: JPS 1917
    original: וְגַם אֶת־שַׁבְּתוֹתַי נָתַתִּי לָהֶם לִהְיוֹת לְאוֹת בֵּינִי וּבֵינֵיהֶם לָדַעַת כִּי אֲנִי יְהוָה מְקַדְּשָׁם׃
    hebrewPlain: וגם את שבתותי נתתי להם להיות לאות ביני וביניהם לדעת כי אני יהוה מקדשם
