  data:
    osis: Ezek.12.22
    scripture: tanakh
    name: Tanakh Ezekiel 12:22
    ref: Ezekiel 12:22
    book: Ezek
    section: neviim
    chapter: 12
    verse: 22
    ordinal: 13057
    text: '’Son of man, what is that proverb that ye have in the land of Israel, saying: The days are prolonged, and every vision faileth?'
    translation: JPS 1917
    original: בֶּן־אָדָם מָה־הַמָּשָׁל הַזֶּה לָכֶם עַל־אַדְמַת יִשְׂרָאֵל לֵאמֹר יַאַרְכוּ הַיָּמִים וְאָבַד כָּל־חָזוֹן׃
    hebrewPlain: בן אדם מה המשל הזה לכם על אדמת ישראל לאמר יארכו הימים ואבד כל חזון
    kjvRefs:
    - Ezekiel 12:22
    kjvOsis:
    - Ezek.12.22
  relations:
