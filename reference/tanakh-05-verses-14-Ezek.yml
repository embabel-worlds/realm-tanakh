  data:
    osis: Ezek.40.39
    scripture: tanakh
    name: Tanakh Ezekiel 40:39
    ref: Ezekiel 40:39
    book: Ezek
    section: neviim
    chapter: 40
    verse: 39
    ordinal: 13871
    text: And in the porch of the gate were two tables on this side, and two tables on that side, to slay thereon the burnt-offering and the sin-offering and the guilt-offering.
    translation: JPS 1917
    original: וּבְאֻלָם הַשַּׁעַר שְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ וּשְׁנַיִם שֻׁלְחָנוֹת מִפֹּה לִשְׁחוֹט אֲלֵיהֶם הָעוֹלָה וְהַחַטָּאת וְהָאָשָׁם׃
    hebrewPlain: ובאלם השער שנים שלחנות מפו ושנים שלחנות מפה לשחוט אליהם העולה והחטאת והאשם
    kjvRefs:
    - Ezekiel 40:39
    kjvOsis:
    - Ezek.40.39
