    ref: Ezekiel 23:20
    book: Ezek
    section: neviim
    chapter: 23
    verse: 20
    ordinal: 13382
    text: And she doted upon concubinage with them, whose flesh is as the flesh of asses, and whose issue is like the issue of horses.
    translation: JPS 1917
    original: וַתַּעְגְּבָה עַל פִּלַגְשֵׁיהֶם אֲשֶׁר בְּשַׂר־חֲמוֹרִים בְּשָׂרָם וְזִרְמַת סוּסִים זִרְמָתָם׃
    hebrewPlain: ותעגבה על פלגשיהם אשר בשר חמורים בשרם וזרמת סוסים זרמתם
    kjvRefs:
