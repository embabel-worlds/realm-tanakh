    book: Ezek
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 13065
    text: '’Son of man, prophesy against the prophets of Israel that prophesy, and say thou unto them that prophesy out of their own heart: Hear ye the word of the LORD:'
    translation: JPS 1917
    original: בֶּן־אָדָם הִנָּבֵא אֶל־נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים וְאָמַרְתָּ לִנְבִיאֵי מִלִּבָּם שִׁמְעוּ דְּבַר־יְהוָה׃
    hebrewPlain: בן אדם הנבא אל נביאי ישראל הנבאים ואמרת לנביאי מלבם שמעו דבר יהוה
    kjvRefs:
