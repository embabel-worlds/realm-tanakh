    verse: 17
    ordinal: 13103
    text: 'Or if I bring a sword upon that land, and say: Let the sword go through the land, so that I cut off from it man and beast;'
    translation: JPS 1917
    original: אוֹ חֶרֶב אָבִיא עַל־הָאָרֶץ הַהִיא וְאָמַרְתִּי חֶרֶב תַּעֲבֹר בָּאָרֶץ וְהִכְרַתִּי מִמֶּנָּה אָדָם וּבְהֵמָה׃
    hebrewPlain: או חרב אביא על הארץ ההיא ואמרתי חרב תעבר בארץ והכרתי ממנה אדם ובהמה
