  data:
    osis: Ezek.21.24
    scripture: tanakh
    name: Tanakh Ezekiel 21:24
    ref: Ezekiel 21:24
    book: Ezek
    section: neviim
    chapter: 21
    verse: 24
    ordinal: 13318
    text: ‘Now, thou son of man, make thee two ways, that the sword of the king of Babylon may come; they twain shall come forth out of one land; and mark a signpost, mark it clear at the head of the way to the city.
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם שִׂים־לְךָ שְׁנַיִם דְּרָכִים לָבוֹא חֶרֶב מֶלֶךְ־בָּבֶל מֵאֶרֶץ אֶחָד יֵצְאוּ שְׁנֵיהֶם וְיָד בָּרֵא בְּרֹאשׁ דֶּרֶךְ־עִיר בָּרֵא׃
    hebrewPlain: ואתה בן אדם שים לך שנים דרכים לבוא חרב מלך בבל מארץ אחד יצאו שניהם ויד ברא בראש דרך עיר ברא
    kjvRefs:
    - Ezekiel 21:19
    kjvOsis:
    - Ezek.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.25
    scripture: tanakh
    name: Tanakh Ezekiel 21:25
    ref: Ezekiel 21:25
    book: Ezek
    section: neviim
    chapter: 21
    verse: 25
    ordinal: 13319
    text: Thou shalt make a way, that the sword may come to Rabbah of the children of Ammon, and to Judah in Jerusalem the fortified.
    translation: JPS 1917
    original: דֶּרֶךְ תָּשִׂים לָבוֹא חֶרֶב אֵת רַבַּת בְּנֵי־עַמּוֹן וְאֶת־יְהוּדָה בִירוּשָׁלִַם בְּצוּרָה׃
    hebrewPlain: דרך תשים לבוא חרב את רבת בני עמון ואת יהודה בירושלם בצורה
    kjvRefs:
    - Ezekiel 21:20
    kjvOsis:
    - Ezek.21.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.26
    scripture: tanakh
    name: Tanakh Ezekiel 21:26
    ref: Ezekiel 21:26
    book: Ezek
    section: neviim
    chapter: 21
    verse: 26
    ordinal: 13320
    text: For the king of Babylon standeth at the parting of the way, at the head of the two ways, to use divination; he shaketh the arrows to and fro, he inquireth of the teraphim, he looketh in the liver.
    translation: JPS 1917
    original: כִּי־עָמַד מֶלֶךְ־בָּבֶל אֶל־אֵם הַדֶּרֶךְ בְּרֹאשׁ שְׁנֵי הַדְּרָכִים לִקְסָם־קָסֶם קִלְקַל בַּחִצִּים שָׁאַל בַּתְּרָפִים רָאָה בַּכָּבֵד׃
    hebrewPlain: כי עמד מלך בבל אל אם הדרך בראש שני הדרכים לקסם קסם קלקל בחצים שאל בתרפים ראה בכבד
    kjvRefs:
    - Ezekiel 21:21
    kjvOsis:
    - Ezek.21.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.27
    scripture: tanakh
    name: Tanakh Ezekiel 21:27
    ref: Ezekiel 21:27
    book: Ezek
    section: neviim
    chapter: 21
    verse: 27
    ordinal: 13321
    text: In his right hand is the lot Jerusalem, to set battering rams, to open the mouth for the slaughter, to lift up the voice with shouting, to set battering rams against the gates, to cast up mounds, to build forts.
    translation: JPS 1917
    original: בִּימִינוֹ הָיָה הַקֶּסֶם יְרוּשָׁלִַם לָשׂוּם כָּרִים לִפְתֹּחַ פֶּה בְּרֶצַח לְהָרִים קוֹל בִּתְרוּעָה לָשׂוּם כָּרִים עַל־שְׁעָרִים לִשְׁפֹּךְ סֹלְלָה לִבְנוֹת דָּיֵק׃
    hebrewPlain: בימינו היה הקסם ירושלם לשום כרים לפתח פה ברצח להרים קול בתרועה לשום כרים על שערים לשפך סללה לבנות דיק
    kjvRefs:
    - Ezekiel 21:22
    kjvOsis:
    - Ezek.21.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.28
    scripture: tanakh
    name: Tanakh Ezekiel 21:28
    ref: Ezekiel 21:28
    book: Ezek
    section: neviim
    chapter: 21
    verse: 28
    ordinal: 13322
    text: And it shall be unto them as a false divination in their sight, who have weeks upon weeks! but it bringeth iniquity to remembrance, that they may be taken.
    translation: JPS 1917
    original: וְהָיָה לָהֶם כקסום־[כִּקְסָם־] שָׁוְא בְּעֵינֵיהֶם שְׁבֻעֵי שְׁבֻעוֹת לָהֶם וְהוּא־מַזְכִּיר עָוֺן לְהִתָּפֵשׂ׃
    hebrewPlain: והיה להם כקסום [כקסם ] שוא בעיניהם שבעי שבעות להם והוא מזכיר עון להתפש
    kjvRefs:
    - Ezekiel 21:23
    kjvOsis:
    - Ezek.21.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.29
    scripture: tanakh
    name: Tanakh Ezekiel 21:29
    ref: Ezekiel 21:29
    book: Ezek
    section: neviim
    chapter: 21
    verse: 29
    ordinal: 13323
    text: 'Therefore thus saith the Lord GOD: Because ye have made your iniquity to be remembered, in that your transgressions are uncovered, so that your sins do appear in all your doings; because that ye are come to remembrance, ye shall be taken with the hand.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה יַעַן הַזְכַּרְכֶם עֲוֺנְכֶם בְּהִגָּלוֹת פִּשְׁעֵיכֶם לְהֵרָאוֹת חַטֹּאותֵיכֶם בְּכֹל עֲלִילוֹתֵיכֶם יַעַן הִזָּכֶרְכֶם בַּכַּף תִּתָּפֵשׂוּ׃
    hebrewPlain: לכן כה אמר אדני יהוה יען הזכרכם עונכם בהגלות פשעיכם להראות חטאותיכם בכל עלילותיכם יען הזכרכם בכף תתפשו
    kjvRefs:
    - Ezekiel 21:24
    kjvOsis:
    - Ezek.21.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.30
    scripture: tanakh
    name: Tanakh Ezekiel 21:30
    ref: Ezekiel 21:30
    book: Ezek
    section: neviim
    chapter: 21
    verse: 30
    ordinal: 13324
    text: And thou, O wicked one, that art to be slain, the prince of Israel, whose day is come, in the time of the iniquity of the end;
    translation: JPS 1917
    original: וְאַתָּה חָלָל רָשָׁע נְשִׂיא יִשְׂרָאֵל אֲשֶׁר־בָּא יוֹמוֹ בְּעֵת עֲוֺן קֵץ׃
    hebrewPlain: ואתה חלל רשע נשיא ישראל אשר בא יומו בעת עון קץ
    kjvRefs:
    - Ezekiel 21:25
    kjvOsis:
    - Ezek.21.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.31
    scripture: tanakh
    name: Tanakh Ezekiel 21:31
    ref: Ezekiel 21:31
    book: Ezek
    section: neviim
    chapter: 21
    verse: 31
    ordinal: 13325
    text: 'thus saith the Lord GOD: The mitre shall be removed, and the crown taken off; this shall be no more the same: that which is low shall be exalted, and that which is high abased.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה הָסִיר הַמִּצְנֶפֶת וְהָרִים הָעֲטָרָה זֹאת לֹא־זֹאת הַשָּׁפָלָה הַגְבֵּהַ וְהַגָּבֹהַ הַשְׁפִּיל׃
    hebrewPlain: כה אמר אדני יהוה הסיר המצנפת והרים העטרה זאת לא זאת השפלה הגבה והגבה השפיל
    kjvRefs:
    - Ezekiel 21:26
    kjvOsis:
    - Ezek.21.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.32
    scripture: tanakh
    name: Tanakh Ezekiel 21:32
    ref: Ezekiel 21:32
    book: Ezek
    section: neviim
    chapter: 21
    verse: 32
    ordinal: 13326
    text: A ruin, a ruin, a ruin, will I make it; this also shall be no more, until he come whose right it is, and I will give it him.
    translation: JPS 1917
    original: עַוָּה עַוָּה עַוָּה אֲשִׂימֶנָּה גַּם־זֹאת לֹא הָיָה עַד־בֹּא אֲשֶׁר־לוֹ הַמִּשְׁפָּט וּנְתַתִּיו׃
    hebrewPlain: עוה עוה עוה אשימנה גם זאת לא היה עד בא אשר לו המשפט ונתתיו
    kjvRefs:
    - Ezekiel 21:27
    kjvOsis:
    - Ezek.21.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.33
    scripture: tanakh
    name: Tanakh Ezekiel 21:33
    ref: Ezekiel 21:33
    book: Ezek
    section: neviim
    chapter: 21
    verse: 33
    ordinal: 13327
    text: 'And thou, son of man, prophesy, and say: Thus saith the Lord GOD concerning the children of Ammon, and concerning their taunt; and say thou: O sword, O sword keen-edged, Furbished for the slaughter, To the uttermost, because of the glitterings;'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הִנָּבֵא וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהֹוִה אֶל־בְּנֵי עַמּוֹן וְאֶל־חֶרְפָּתָם וְאָמַרְתָּ חֶרֶב חֶרֶב פְּתוּחָה לְטֶבַח מְרוּטָה לְהָכִיל לְמַעַן בָּרָק׃
    hebrewPlain: ואתה בן אדם הנבא ואמרת כה אמר אדני יהוה אל בני עמון ואל חרפתם ואמרת חרב חרב פתוחה לטבח מרוטה להכיל למען ברק
    kjvRefs:
    - Ezekiel 21:28
    kjvOsis:
    - Ezek.21.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.34
    scripture: tanakh
    name: Tanakh Ezekiel 21:34
    ref: Ezekiel 21:34
    book: Ezek
    section: neviim
    chapter: 21
    verse: 34
    ordinal: 13328
    text: While they see falsehood unto thee, while they divine lies unto thee, to lay thee upon the necks of the wicked that are to be slain, whose day is come, in the time of the iniquity of the end!—
    translation: JPS 1917
    original: בַּחֲזוֹת לָךְ שָׁוְא בִּקְסָם־לָךְ כָּזָב לָתֵת אוֹתָךְ אֶל־צַוְּארֵי חַלְלֵי רְשָׁעִים אֲשֶׁר־בָּא יוֹמָם בְּעֵת עֲוֺן קֵץ׃
    hebrewPlain: בחזות לך שוא בקסם לך כזב לתת אותך אל צוארי חללי רשעים אשר בא יומם בעת עון קץ
    kjvRefs:
    - Ezekiel 21:29
    kjvOsis:
    - Ezek.21.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.21
- type: TanakhVerse
  data:
    osis: Ezek.21.35
    scripture: tanakh
    name: Tanakh Ezekiel 21:35
    ref: Ezekiel 21:35
    book: Ezek
    section: neviim
