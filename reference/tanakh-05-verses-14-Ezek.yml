  data:
    osis: Ezek.48.8
    scripture: tanakh
    name: Tanakh Ezekiel 48:8
    ref: Ezekiel 48:8
    book: Ezek
    section: neviim
    chapter: 48
    verse: 8
    ordinal: 14065
    text: And by the border of Judah, from the east side unto the west side, shall be the offering which ye shall set aside, five and twenty thousand reeds in breadth, and in length as one of the portions, from the east side unto the west side; and the sanctuary shall be in the midst of it.
    translation: JPS 1917
    original: וְעַל גְּבוּל יְהוּדָה מִפְּאַת קָדִים עַד־פְּאַת־יָמָּה תִּהְיֶה הַתְּרוּמָה אֲ‍שֶׁר־תָּרִימוּ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף רֹחַב וְאֹרֶךְ כְּאַחַד הַחֲלָקִים מִפְּאַת קָדִימָה עַד־פְּאַת־יָמָּה וְהָיָה הַמִּקְדָּשׁ בְּתוֹכוֹ׃
    hebrewPlain: ועל גבול יהודה מפאת קדים עד פאת ימה תהיה התרומה א‍שר תרימו חמשה ועשרים אלף רחב וארך כאחד החלקים מפאת קדימה עד פאת ימה והיה המקדש בתוכו
    kjvRefs:
    - Ezekiel 48:8
    kjvOsis:
    - Ezek.48.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.9
    scripture: tanakh
    name: Tanakh Ezekiel 48:9
    ref: Ezekiel 48:9
    book: Ezek
    section: neviim
    chapter: 48
    verse: 9
    ordinal: 14066
    text: The offering that ye shall set apart unto the LORD shall be five and twenty thousand reeds in length, and ten thousand in breadth.
    translation: JPS 1917
    original: הַתְּרוּמָה אֲשֶׁר תָּרִימוּ לַיהוָה אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף וְרֹחַב עֲשֶׂרֶת אֲלָפִים׃
    hebrewPlain: התרומה אשר תרימו ליהוה ארך חמשה ועשרים אלף ורחב עשרת אלפים
    kjvRefs:
    - Ezekiel 48:9
    kjvOsis:
    - Ezek.48.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.10
    scripture: tanakh
    name: Tanakh Ezekiel 48:10
    ref: Ezekiel 48:10
    book: Ezek
    section: neviim
    chapter: 48
    verse: 10
    ordinal: 14067
    text: And for these, even for the priests, shall be the holy offering; toward the north five and twenty thousand [in length], and toward the west ten thousand in breadth, and toward the east ten thousand in breadth, and toward the south five and twenty thousand in length; and the sanctuary of the LORD shall be in the midst thereof.
    translation: JPS 1917
    original: וּלְאֵלֶּה תִּהְיֶה תְרוּמַת־הַקֹּדֶשׁ לַכֹּהֲנִים צָפוֹנָה חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף וְיָמָּה רֹחַב עֲשֶׂרֶת אֲלָפִים וְקָדִימָה רֹחַב עֲשֶׂרֶת אֲלָפִים וְנֶגְבָּה אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אָלֶף וְהָיָה מִקְדַּשׁ־יְהוָה בְּתוֹכוֹ׃
    hebrewPlain: ולאלה תהיה תרומת הקדש לכהנים צפונה חמשה ועשרים אלף וימה רחב עשרת אלפים וקדימה רחב עשרת אלפים ונגבה ארך חמשה ועשרים אלף והיה מקדש יהוה בתוכו
    kjvRefs:
    - Ezekiel 48:10
    kjvOsis:
    - Ezek.48.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.11
    scripture: tanakh
    name: Tanakh Ezekiel 48:11
    ref: Ezekiel 48:11
    book: Ezek
    section: neviim
    chapter: 48
    verse: 11
    ordinal: 14068
    text: The sanctified portion shall be for the priests of the sons of Zadok, that have kept My charge, that went not astray when the children of Israel went astray, as the Levites went astray.
    translation: JPS 1917
    original: לַכֹּהֲנִים הַמְקֻדָּשׁ מִבְּנֵי צָדוֹק אֲשֶׁר שָׁמְרוּ מִשְׁמַרְתִּי אֲשֶׁר לֹא־תָעוּ בִּתְעוֹת בְּנֵי יִשְׂרָאֵל כַּאֲשֶׁר תָּעוּ הַלְוִיִּם׃
    hebrewPlain: לכהנים המקדש מבני צדוק אשר שמרו משמרתי אשר לא תעו בתעות בני ישראל כאשר תעו הלוים
    kjvRefs:
    - Ezekiel 48:11
    kjvOsis:
    - Ezek.48.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.12
    scripture: tanakh
    name: Tanakh Ezekiel 48:12
    ref: Ezekiel 48:12
    book: Ezek
    section: neviim
    chapter: 48
    verse: 12
    ordinal: 14069
    text: And it shall be unto them a portion set apart from the offering of the land, a thing most holy, by the border of the Levites.
    translation: JPS 1917
    original: וְהָיְתָה לָהֶם תְּרוּמִיָּה מִתְּרוּמַת הָאָרֶץ קֹדֶשׁ קָדָשִׁים אֶל־גְּבוּל הַלְוִיִּם׃
    hebrewPlain: והיתה להם תרומיה מתרומת הארץ קדש קדשים אל גבול הלוים
    kjvRefs:
    - Ezekiel 48:12
    kjvOsis:
    - Ezek.48.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.13
    scripture: tanakh
    name: Tanakh Ezekiel 48:13
    ref: Ezekiel 48:13
    book: Ezek
    section: neviim
    chapter: 48
    verse: 13
    ordinal: 14070
    text: And answerable unto the border of the priests, the Levites shall have five and twenty thousand in length, and ten thousand in breadth; all the length shall be five and twenty thousand, and the breadth ten thousand.
    translation: JPS 1917
    original: וְהַלְוִיִּם לְעֻמַּת גְּבוּל הַכֹּהֲנִים חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וְרֹחַב עֲשֶׂרֶת אֲלָפִים כָּל־אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף וְרֹחַב עֲשֶׂרֶת אֲלָפִים׃
    hebrewPlain: והלוים לעמת גבול הכהנים חמשה ועשרים אלף ארך ורחב עשרת אלפים כל ארך חמשה ועשרים אלף ורחב עשרת אלפים
    kjvRefs:
    - Ezekiel 48:13
    kjvOsis:
    - Ezek.48.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.14
    scripture: tanakh
    name: Tanakh Ezekiel 48:14
    ref: Ezekiel 48:14
    book: Ezek
    section: neviim
    chapter: 48
    verse: 14
    ordinal: 14071
    text: And they shall not sell of it, nor exchange, nor alienate the first portion of the land; for it is holy unto the LORD.
    translation: JPS 1917
    original: וְלֹא־יִמְכְּרוּ מִמֶּנּוּ וְלֹא יָמֵר וְלֹא יעבור [יַעֲבִיר] רֵאשִׁית הָאָרֶץ כִּי־קֹדֶשׁ לַיהוָה׃
    hebrewPlain: ולא ימכרו ממנו ולא ימר ולא יעבור [יעביר] ראשית הארץ כי קדש ליהוה
    kjvRefs:
    - Ezekiel 48:14
    kjvOsis:
    - Ezek.48.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.15
    scripture: tanakh
    name: Tanakh Ezekiel 48:15
    ref: Ezekiel 48:15
    book: Ezek
    section: neviim
    chapter: 48
    verse: 15
    ordinal: 14072
    text: And the five thousand that are left in the breadth, in front of the five and twenty thousand, shall be for common use, for the city, for dwelling and for open land; and the city shall be in the midst thereof.
    translation: JPS 1917
    original: וַחֲמֵשֶׁת אֲלָפִים הַנּוֹתָר בָּרֹחַב עַל־פְּנֵי חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף חֹל־הוּא לָעִיר לְמוֹשָׁב וּלְמִגְרָשׁ וְהָיְתָה הָעִיר בתוכה [בְּתוֹכוֹ׃]
    hebrewPlain: וחמשת אלפים הנותר ברחב על פני חמשה ועשרים אלף חל הוא לעיר למושב ולמגרש והיתה העיר בתוכה [בתוכו]
    kjvRefs:
    - Ezekiel 48:15
    kjvOsis:
    - Ezek.48.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.16
    scripture: tanakh
    name: Tanakh Ezekiel 48:16
    ref: Ezekiel 48:16
    book: Ezek
    section: neviim
    chapter: 48
    verse: 16
    ordinal: 14073
    text: 'And these shall be the measures thereof: the north side four thousand and five hundred, and the south side four thousand and five hundred, and on the east side four thousand and five hundred, and the west side four thousand and five hundred.'
    translation: JPS 1917
    original: וְאֵלֶּה מִדּוֹתֶיהָ פְּאַת צָפוֹן חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים וּפְאַת־נֶגֶב חֲמֵשׁ חמש מֵאוֹת וְאַרְבַּעַת אֲלָפִים וּמִפְּאַת קָדִים חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים וּפְאַת־יָמָּה חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים׃
    hebrewPlain: ואלה מדותיה פאת צפון חמש מאות וארבעת אלפים ופאת נגב חמש חמש מאות וארבעת אלפים ומפאת קדים חמש מאות וארבעת אלפים ופאת ימה חמש מאות וארבעת אלפים
    kjvRefs:
    - Ezekiel 48:16
    kjvOsis:
    - Ezek.48.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.17
    scripture: tanakh
    name: Tanakh Ezekiel 48:17
    ref: Ezekiel 48:17
    book: Ezek
    section: neviim
    chapter: 48
    verse: 17
    ordinal: 14074
    text: 'And the city shall have open land: toward the north two hundred and fifty, and toward the south two hundred and fifty, and toward the east two hundred and fifty, and toward the west two hundred and fifty.'
    translation: JPS 1917
    original: וְהָיָה מִגְרָשׁ לָעִיר צָפוֹנָה חֲמִשִּׁים וּמָאתַיִם וְנֶגְבָּה חֲמִשִּׁים וּמָאתָיִם וְקָדִימָה חֲמִשִּׁים וּמָאתַיִם וְיָמָּה חֲמִשִּׁים וּמָאתָיִם׃
    hebrewPlain: והיה מגרש לעיר צפונה חמשים ומאתים ונגבה חמשים ומאתים וקדימה חמשים ומאתים וימה חמשים ומאתים
    kjvRefs:
    - Ezekiel 48:17
    kjvOsis:
    - Ezek.48.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.18
    scripture: tanakh
    name: Tanakh Ezekiel 48:18
    ref: Ezekiel 48:18
    book: Ezek
    section: neviim
    chapter: 48
    verse: 18
    ordinal: 14075
    text: And the residue in the length, answerable unto the holy offering, shall be ten thousand eastward, and ten thousand westward; and it shall be answerable unto the holy offering; and the increase thereof shall be for food unto them that serve the city.
    translation: JPS 1917
    original: וְהַנּוֹתָר בָּאֹרֶךְ לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ עֲשֶׂרֶת אֲלָפִים קָדִימָה וַעֲשֶׂרֶת אֲלָפִים יָמָּה וְהָיָה לְעֻמַּת תְּרוּמַת הַקֹּדֶשׁ וְהָיְתָה תבואתה [תְבוּאָתוֹ] לְלֶחֶם לְעֹבְדֵי הָעִיר׃
    hebrewPlain: והנותר בארך לעמת תרומת הקדש עשרת אלפים קדימה ועשרת אלפים ימה והיה לעמת תרומת הקדש והיתה תבואתה [תבואתו] ללחם לעבדי העיר
    kjvRefs:
    - Ezekiel 48:18
    kjvOsis:
    - Ezek.48.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.19
    scripture: tanakh
    name: Tanakh Ezekiel 48:19
    ref: Ezekiel 48:19
    book: Ezek
    section: neviim
    chapter: 48
    verse: 19
    ordinal: 14076
    text: And they that serve the city, out of all the tribes of Israel, shall till it.
    translation: JPS 1917
    original: וְהָעֹבֵד הָעִיר יַעַבְדוּהוּ מִכֹּל שִׁבְטֵי יִשְׂרָאֵל׃
    hebrewPlain: והעבד העיר יעבדוהו מכל שבטי ישראל
    kjvRefs:
    - Ezekiel 48:19
    kjvOsis:
    - Ezek.48.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.20
    scripture: tanakh
    name: Tanakh Ezekiel 48:20
    ref: Ezekiel 48:20
    book: Ezek
    section: neviim
    chapter: 48
    verse: 20
    ordinal: 14077
    text: All the offering shall be five and twenty thousand by five and twenty thousand; ye shall set apart the holy offering foursquare, with the possession of the city.
    translation: JPS 1917
    original: כָּל־הַתְּרוּמָה חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף רְבִיעִית תָּרִימוּ אֶת־תְּרוּמַת הַקֹּדֶשׁ אֶל־אֲחֻזַּת הָעִיר׃
    hebrewPlain: כל התרומה חמשה ועשרים אלף בחמשה ועשרים אלף רביעית תרימו את תרומת הקדש אל אחזת העיר
    kjvRefs:
    - Ezekiel 48:20
    kjvOsis:
    - Ezek.48.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.21
    scripture: tanakh
    name: Tanakh Ezekiel 48:21
    ref: Ezekiel 48:21
    book: Ezek
    section: neviim
    chapter: 48
    verse: 21
    ordinal: 14078
    text: And the residue shall be for the prince, on the one side and on the other of the holy offering and of the possession of the city, in front of the five and twenty thousand of the offering toward the east border, and westward in front of the five and twenty thousand toward the west border, answerable unto the portions, it shall be for the prince; and the holy offering and the sanctuary of the house shall be in the midst thereof.
    translation: JPS 1917
    original: וְהַנּוֹתָר לַנָּשִׂיא מִזֶּה וּמִזֶּה לִתְרוּמַת־הַקֹּדֶשׁ וְלַאֲחֻזַּת הָעִיר אֶל־פְּנֵי חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף תְּרוּמָה עַד־גְּבוּל קָדִימָה וְיָמָּה עַל־פְּנֵי חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף עַל־גְּבוּל יָמָּה לְעֻמַּת חֲלָקִים לַנָּשִׂיא וְהָיְתָה תְּרוּמַת הַקֹּדֶשׁ וּמִקְדַּשׁ הַבַּיִת בתוכה [בְּתוֹכוֹ׃]
    hebrewPlain: והנותר לנשיא מזה ומזה לתרומת הקדש ולאחזת העיר אל פני חמשה ועשרים אלף תרומה עד גבול קדימה וימה על פני חמשה ועשרים אלף על גבול ימה לעמת חלקים לנשיא והיתה תרומת הקדש ומקדש הבית בתוכה [בתוכו]
    kjvRefs:
    - Ezekiel 48:21
    kjvOsis:
    - Ezek.48.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.22
    scripture: tanakh
    name: Tanakh Ezekiel 48:22
    ref: Ezekiel 48:22
    book: Ezek
    section: neviim
    chapter: 48
    verse: 22
    ordinal: 14079
    text: Thus the possession of the Levites, and the possession of the city, shall be in the midst of that which is the prince’s; between the border of Judah and the border of Benjamin shall be the prince’s.
    translation: JPS 1917
    original: וּמֵאֲחֻזַּת הַלְוִיִּם וּמֵאֲחֻזַּת הָעִיר בְּתוֹךְ אֲשֶׁר לַנָּשִׂיא יִהְיֶה בֵּין גְּבוּל יְהוּדָה וּבֵין גְּבוּל בִּנְיָמִן לַנָּשִׂיא יִהְיֶה׃
    hebrewPlain: ומאחזת הלוים ומאחזת העיר בתוך אשר לנשיא יהיה בין גבול יהודה ובין גבול בנימן לנשיא יהיה
    kjvRefs:
    - Ezekiel 48:22
    kjvOsis:
    - Ezek.48.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.23
    scripture: tanakh
    name: Tanakh Ezekiel 48:23
    ref: Ezekiel 48:23
    book: Ezek
    section: neviim
    chapter: 48
    verse: 23
    ordinal: 14080
    text: 'And as for the rest of the tribes: from the east side unto the west side: Benjamin, one portion.'
    translation: JPS 1917
    original: וְיֶתֶר הַשְּׁבָטִים מִפְּאַת קָדִימָה עַד־פְּאַת־יָמָּה בִּנְיָמִן אֶחָד׃
    hebrewPlain: ויתר השבטים מפאת קדימה עד פאת ימה בנימן אחד
    kjvRefs:
    - Ezekiel 48:23
    kjvOsis:
    - Ezek.48.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.24
    scripture: tanakh
    name: Tanakh Ezekiel 48:24
    ref: Ezekiel 48:24
    book: Ezek
    section: neviim
    chapter: 48
    verse: 24
    ordinal: 14081
    text: 'And by the border of Benjamin, from the east side unto the west side: Simeon, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל בִּנְיָמִן מִפְּאַת קָדִימָה עַד־פְּאַת־יָמָּה שִׁמְעוֹן אֶחָד׃
    hebrewPlain: ועל גבול בנימן מפאת קדימה עד פאת ימה שמעון אחד
    kjvRefs:
    - Ezekiel 48:24
    kjvOsis:
    - Ezek.48.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.25
    scripture: tanakh
    name: Tanakh Ezekiel 48:25
    ref: Ezekiel 48:25
    book: Ezek
    section: neviim
    chapter: 48
    verse: 25
    ordinal: 14082
    text: 'And by the border of Simeon, from the east side unto the west side: Issachar, one portion.'
    translation: JPS 1917
    original: וְעַל גְּבוּל שִׁמְעוֹן מִפְּאַת קָדִימָה עַד־פְּאַת־יָמָּה יִשָׂשכָר אֶחָד׃
    hebrewPlain: ועל גבול שמעון מפאת קדימה עד פאת ימה יששכר אחד
    kjvRefs:
    - Ezekiel 48:25
    kjvOsis:
    - Ezek.48.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.48
- type: TanakhVerse
  data:
    osis: Ezek.48.26
    scripture: tanakh
    name: Tanakh Ezekiel 48:26
    ref: Ezekiel 48:26
    book: Ezek
    section: neviim
    chapter: 48
    verse: 26
    ordinal: 14083
    text: 'And by the border of Issachar, from the east side unto the west side: Zebulun, one portion.'
