    ordinal: 13376
    text: And she increased her harlotries; for she saw men portrayed upon the wall, the images of the Chaldeans portrayed with vermilion,
    translation: JPS 1917
    original: וַתּוֹסֶף אֶל־תַּזְנוּתֶיהָ וַתֵּרֶא אַנְשֵׁי מְחֻקֶּה עַל־הַקִּיר צַלְמֵי כשדיים [כַשְׂדִּים] חֲקֻקִים בַּשָּׁשַׁר׃
