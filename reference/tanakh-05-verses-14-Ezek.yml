    name: Tanakh Ezekiel 47:19
    ref: Ezekiel 47:19
    book: Ezek
    section: neviim
    chapter: 47
    verse: 19
    ordinal: 14053
    text: And the south side southward shall be from Tamar as far as the waters of Meriboth-kadesh, to the Brook, unto the Great Sea. This is the south side southward.
    translation: JPS 1917
    original: וּפְאַת נֶגֶב תֵּימָנָה מִתָּמָר עַד־מֵי מְרִיבוֹת קָדֵשׁ נַחֲלָה אֶל־הַיָּם הַגָּדוֹל וְאֵת פְּאַת־תֵּימָנָה נֶגְבָּה׃
    hebrewPlain: ופאת נגב תימנה מתמר עד מי מריבות קדש נחלה אל הים הגדול ואת פאת תימנה נגבה
    kjvRefs:
