  data:
    osis: Ezek.23.24
    scripture: tanakh
    name: Tanakh Ezekiel 23:24
    ref: Ezekiel 23:24
    book: Ezek
    section: neviim
    chapter: 23
    verse: 24
    ordinal: 13386
    text: And they shall come against thee with hosts, chariots, and wheels, and with an assembly of peoples; they shall set themselves in array against thee with buckler and shield and helmet round about; and I will commit the judgment unto them, and they shall judge thee according to their judgments.
    translation: JPS 1917
    original: וּבָאוּ עָלַיִךְ הֹצֶן רֶכֶב וְגַלְגַּל וּבִקְהַל עַמִּים צִנָּה וּמָגֵן וְקוֹבַע יָשִׂימוּ עָלַיִךְ סָבִיב וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט וּשְׁפָטוּךְ בְּמִשְׁפְּטֵיהֶם׃
    hebrewPlain: ובאו עליך הצן רכב וגלגל ובקהל עמים צנה ומגן וקובע ישימו עליך סביב ונתתי לפניהם משפט ושפטוך במשפטיהם
    kjvRefs:
    - Ezekiel 23:24
    kjvOsis:
    - Ezek.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.25
    scripture: tanakh
    name: Tanakh Ezekiel 23:25
    ref: Ezekiel 23:25
    book: Ezek
    section: neviim
    chapter: 23
    verse: 25
    ordinal: 13387
    text: And I will set My jealousy against thee, and they shall deal with thee in fury; they shall take away thy nose and thine ears, and thy residue shall fall by the sword; they shall take thy sons and thy daughters, and thy residue shall be devoured by the fire.
    translation: JPS 1917
    original: וְנָתַתִּי קִנְאָתִי בָּךְ וְעָשׂוּ אוֹתָךְ בְּחֵמָה אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ וְאַחֲרִיתֵךְ בַּחֶרֶב תִּפּוֹל הֵמָּה בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ וְאַחֲרִיתֵךְ תֵּאָכֵל בָּאֵשׁ׃
    hebrewPlain: ונתתי קנאתי בך ועשו אותך בחמה אפך ואזניך יסירו ואחריתך בחרב תפול המה בניך ובנותיך יקחו ואחריתך תאכל באש
    kjvRefs:
    - Ezekiel 23:25
    kjvOsis:
    - Ezek.23.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.26
    scripture: tanakh
    name: Tanakh Ezekiel 23:26
    ref: Ezekiel 23:26
    book: Ezek
    section: neviim
    chapter: 23
    verse: 26
    ordinal: 13388
    text: They shall also strip thee of thy clothes, and take away thy fair jewels.
    translation: JPS 1917
    original: וְהִפְשִׁיטוּךְ אֶת־בְּגָדָיִךְ וְלָקְחוּ כְּלֵי תִפְאַרְתֵּךְ׃
    hebrewPlain: והפשיטוך את בגדיך ולקחו כלי תפארתך
    kjvRefs:
    - Ezekiel 23:26
    kjvOsis:
    - Ezek.23.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.27
    scripture: tanakh
    name: Tanakh Ezekiel 23:27
    ref: Ezekiel 23:27
    book: Ezek
    section: neviim
    chapter: 23
    verse: 27
    ordinal: 13389
    text: Thus will I make thy lewdness to cease from thee, and thy harlotry brought from the land of Egypt, so that thou shalt not lift up thine eyes unto them, nor remember Egypt any more.
    translation: JPS 1917
    original: וְהִשְׁבַּתִּי זִמָּתֵךְ מִמֵּךְ וְאֶת־זְנוּתֵךְ מֵאֶרֶץ מִצְרָיִם וְלֹא־תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם וּמִצְרַיִם לֹא תִזְכְּרִי־עוֹד׃
    hebrewPlain: והשבתי זמתך ממך ואת זנותך מארץ מצרים ולא תשאי עיניך אליהם ומצרים לא תזכרי עוד
    kjvRefs:
    - Ezekiel 23:27
    kjvOsis:
    - Ezek.23.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.28
    scripture: tanakh
    name: Tanakh Ezekiel 23:28
    ref: Ezekiel 23:28
    book: Ezek
    section: neviim
    chapter: 23
    verse: 28
    ordinal: 13390
    text: 'For thus saith the Lord GOD: Behold, I will deliver thee into the hand of them whom thou hatest, into the hand of them from whom thy soul is alienated;'
    translation: JPS 1917
    original: כִּי כֹה אָמַר אֲדֹנָי יְהוִה הִנְנִי נֹתְנָךְ בְּיַד אֲשֶׁר שָׂנֵאת בְּיַד אֲשֶׁר־נָקְעָה נַפְשֵׁךְ מֵהֶם׃
    hebrewPlain: כי כה אמר אדני יהוה הנני נתנך ביד אשר שנאת ביד אשר נקעה נפשך מהם
    kjvRefs:
    - Ezekiel 23:28
    kjvOsis:
    - Ezek.23.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.29
    scripture: tanakh
    name: Tanakh Ezekiel 23:29
    ref: Ezekiel 23:29
    book: Ezek
    section: neviim
    chapter: 23
    verse: 29
    ordinal: 13391
    text: and they shall deal with thee in hatred, and shall take away all thy labour, and shall leave thee naked and bare; and the nakedness of thy harlotries shall be uncovered, both thy lewdness and thy harlotries.
    translation: JPS 1917
    original: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה וְלָקְחוּ כָּל־יְגִיעֵךְ וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה וְנִגְלָה עֶרְוַת זְנוּנַיִךְ וְזִמָּתֵךְ וְתַזְנוּתָיִךְ׃
    hebrewPlain: ועשו אותך בשנאה ולקחו כל יגיעך ועזבוך עירם ועריה ונגלה ערות זנוניך וזמתך ותזנותיך
    kjvRefs:
    - Ezekiel 23:29
    kjvOsis:
    - Ezek.23.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.30
    scripture: tanakh
    name: Tanakh Ezekiel 23:30
    ref: Ezekiel 23:30
    book: Ezek
    section: neviim
    chapter: 23
    verse: 30
    ordinal: 13392
    text: These things shall be done unto thee, for that thou hast gone astray after the nations, and because thou art polluted with their idols.
    translation: JPS 1917
    original: עָשֹׂה אֵלֶּה לָךְ בִּזְנוֹתֵךְ אַחֲרֵי גוֹיִם עַל אֲשֶׁר־נִטְמֵאת בְּגִלּוּלֵיהֶם׃
    hebrewPlain: עשה אלה לך בזנותך אחרי גוים על אשר נטמאת בגלוליהם
    kjvRefs:
    - Ezekiel 23:30
    kjvOsis:
    - Ezek.23.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.31
    scripture: tanakh
    name: Tanakh Ezekiel 23:31
    ref: Ezekiel 23:31
    book: Ezek
    section: neviim
    chapter: 23
    verse: 31
    ordinal: 13393
    text: In the way of thy sister hast thou walked; therefore will I give her cup into thy hand.
    translation: JPS 1917
    original: בְּדֶרֶךְ אֲחוֹתֵךְ הָלָכְתְּ וְנָתַתִּי כוֹסָהּ בְּיָדֵךְ׃
    hebrewPlain: בדרך אחותך הלכת ונתתי כוסה בידך
    kjvRefs:
    - Ezekiel 23:31
    kjvOsis:
    - Ezek.23.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.32
    scripture: tanakh
    name: Tanakh Ezekiel 23:32
    ref: Ezekiel 23:32
    book: Ezek
    section: neviim
    chapter: 23
    verse: 32
    ordinal: 13394
    text: 'Thus saith the Lord GOD: Thou shalt drink of thy sister’s cup, Which is deep and large; Thou shalt be for a scorn and a derision; It is full to the uttermost.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהֹוִה כּוֹס אֲחוֹתֵךְ תִּשְׁתִּי הָעֲמֻקָּה וְהָרְחָבָה תִּהְיֶה לִצְחֹק וּלְלַעַג מִרְבָּה לְהָכִיל׃
    hebrewPlain: כה אמר אדני יהוה כוס אחותך תשתי העמקה והרחבה תהיה לצחק וללעג מרבה להכיל
    kjvRefs:
    - Ezekiel 23:32
    kjvOsis:
    - Ezek.23.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.33
    scripture: tanakh
    name: Tanakh Ezekiel 23:33
    ref: Ezekiel 23:33
    book: Ezek
    section: neviim
    chapter: 23
    verse: 33
    ordinal: 13395
    text: Thou shalt be filled with drunkenness and sorrow, With the cup of astonishment and appalment, With the cup of thy sister Samaria.
    translation: JPS 1917
    original: שִׁכָּרוֹן וְיָגוֹן תִּמָּלֵאִי כּוֹס שַׁמָּה וּשְׁמָמָה כּוֹס אֲחוֹתֵךְ שֹׁמְרוֹן׃
    hebrewPlain: שכרון ויגון תמלאי כוס שמה ושממה כוס אחותך שמרון
    kjvRefs:
    - Ezekiel 23:33
    kjvOsis:
    - Ezek.23.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.34
    scripture: tanakh
    name: Tanakh Ezekiel 23:34
    ref: Ezekiel 23:34
    book: Ezek
    section: neviim
    chapter: 23
    verse: 34
    ordinal: 13396
    text: Thou shalt even drink it and drain it, And thou shalt craunch the sherds thereof, And shalt tear thy breasts; For I have spoken it, Saith the Lord GOD.
    translation: JPS 1917
    original: וְשָׁתִית אוֹתָהּ וּמָצִית וְאֶת־חֲרָשֶׂיהָ תְּגָרֵמִי וְשָׁדַיִךְ תְּנַתֵּקִי כִּי אֲנִי דִבַּרְתִּי נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ושתית אותה ומצית ואת חרשיה תגרמי ושדיך תנתקי כי אני דברתי נאם אדני יהוה
    kjvRefs:
    - Ezekiel 23:34
    kjvOsis:
    - Ezek.23.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.35
    scripture: tanakh
    name: Tanakh Ezekiel 23:35
    ref: Ezekiel 23:35
    book: Ezek
    section: neviim
    chapter: 23
    verse: 35
    ordinal: 13397
    text: 'Therefore thus saith the Lord GOD: Because thou hast forgotten Me, and cast Me behind thy back, therefore bear thou also thy lewdness and thy harlotries.’'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן שָׁכַחַתְּ אוֹתִי וַתַּשְׁלִיכִי אוֹתִי אַחֲרֵי גַוֵּךְ וְגַם־אַתְּ שְׂאִי זִמָּתֵךְ וְאֶת־תַּזְנוּתָיִךְ׃
    hebrewPlain: לכן כה אמר אדני יהוה יען שכחת אותי ותשליכי אותי אחרי גוך וגם את שאי זמתך ואת תזנותיך
    kjvRefs:
    - Ezekiel 23:35
    kjvOsis:
    - Ezek.23.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.36
    scripture: tanakh
    name: Tanakh Ezekiel 23:36
    ref: Ezekiel 23:36
    book: Ezek
    section: neviim
    chapter: 23
    verse: 36
    ordinal: 13398
    text: 'The LORD said moreover unto me: ‘Son of man, wilt thou judge Oholah and Oholibah? then declare unto them their abominations.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי בֶּן־אָדָם הֲתִשְׁפּוֹט אֶת־אָהֳלָה וְאֶת־אָהֳלִיבָה וְהַגֵּד לָהֶן אֵת תוֹעֲבוֹתֵיהֶן׃
    hebrewPlain: ויאמר יהוה אלי בן אדם התשפוט את אהלה ואת אהליבה והגד להן את תועבותיהן
    kjvRefs:
    - Ezekiel 23:36
    kjvOsis:
    - Ezek.23.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.37
    scripture: tanakh
    name: Tanakh Ezekiel 23:37
    ref: Ezekiel 23:37
    book: Ezek
    section: neviim
    chapter: 23
    verse: 37
    ordinal: 13399
    text: For they have committed adultery, and blood is in their hands, and with their idols have they committed adultery; and their sons, whom they bore unto Me, they have also set apart unto them to be devoured.
    translation: JPS 1917
    original: כִּי נִאֵפוּ וְדָם בִּידֵיהֶן וְאֶת־גִּלּוּלֵיהֶן נִאֵפוּ וְגַם אֶת־בְּנֵיהֶן אֲשֶׁר יָלְדוּ־לִי הֶעֱבִירוּ לָהֶם לְאָכְלָה׃
    hebrewPlain: כי נאפו ודם בידיהן ואת גלוליהן נאפו וגם את בניהן אשר ילדו לי העבירו להם לאכלה
    kjvRefs:
    - Ezekiel 23:37
    kjvOsis:
    - Ezek.23.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.38
    scripture: tanakh
    name: Tanakh Ezekiel 23:38
    ref: Ezekiel 23:38
    book: Ezek
    section: neviim
    chapter: 23
    verse: 38
    ordinal: 13400
    text: 'Moreover this they have done unto Me: they have defiled My sanctuary in the same day, and have profaned My sabbaths.'
    translation: JPS 1917
    original: עוֹד זֹאת עָשׂוּ לִי טִמְּאוּ אֶת־מִקְדָּשִׁי בַּיּוֹם הַהוּא וְאֶת־שַׁבְּתוֹתַי חִלֵּלוּ׃
    hebrewPlain: עוד זאת עשו לי טמאו את מקדשי ביום ההוא ואת שבתותי חללו
    kjvRefs:
    - Ezekiel 23:38
    kjvOsis:
    - Ezek.23.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.39
    scripture: tanakh
    name: Tanakh Ezekiel 23:39
    ref: Ezekiel 23:39
    book: Ezek
    section: neviim
    chapter: 23
    verse: 39
    ordinal: 13401
    text: For when they had slain their children to their idols, then they came the same day into My sanctuary to profane it; and, lo, thus have they done in the midst of My house.
    translation: JPS 1917
    original: וּבְשַׁחֲטָם אֶת־בְּנֵיהֶם לְגִלּוּלֵיהֶם וַיָּבֹאוּ אֶל־מִקְדָּשִׁי בַּיּוֹם הַהוּא לְחַלְּלוֹ וְהִנֵּה־כֹה עָשׂוּ בְּתוֹךְ בֵּיתִי׃
    hebrewPlain: ובשחטם את בניהם לגלוליהם ויבאו אל מקדשי ביום ההוא לחללו והנה כה עשו בתוך ביתי
    kjvRefs:
    - Ezekiel 23:39
    kjvOsis:
    - Ezek.23.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.40
    scripture: tanakh
    name: Tanakh Ezekiel 23:40
    ref: Ezekiel 23:40
    book: Ezek
    section: neviim
    chapter: 23
    verse: 40
    ordinal: 13402
    text: And furthermore ye have sent for men that come from far; unto whom a messenger was sent, and, lo, they came; for whom thou didst wash thyself, paint thine eyes, and deck thyself with ornaments;
    translation: JPS 1917
    original: וְאַף כִּי תִשְׁלַחְנָה לַאֲנָשִׁים בָּאִים מִמֶּרְחָק אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם וְהִנֵּה־בָאוּ לַאֲשֶׁר רָחַצְתְּ כָּחַלְתְּ עֵינַיִךְ וְעָדִית עֶדִי׃
    hebrewPlain: ואף כי תשלחנה לאנשים באים ממרחק אשר מלאך שלוח אליהם והנה באו לאשר רחצת כחלת עיניך ועדית עדי
    kjvRefs:
    - Ezekiel 23:40
    kjvOsis:
    - Ezek.23.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.41
    scripture: tanakh
    name: Tanakh Ezekiel 23:41
    ref: Ezekiel 23:41
    book: Ezek
    section: neviim
    chapter: 23
    verse: 41
    ordinal: 13403
    text: and sattest upon a stately bed, with a table prepared before it, whereupon thou didst set Mine incense and Mine oil.
    translation: JPS 1917
    original: וְיָשַׁבְתְּ עַל־מִטָּה כְבוּדָּה וְשֻׁלְחָן עָרוּךְ לְפָנֶיהָ וּקְטָרְתִּי וְשַׁמְנִי שַׂמְתְּ עָלֶיהָ׃
    hebrewPlain: וישבת על מטה כבודה ושלחן ערוך לפניה וקטרתי ושמני שמת עליה
    kjvRefs:
    - Ezekiel 23:41
    kjvOsis:
    - Ezek.23.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.23
- type: TanakhVerse
  data:
    osis: Ezek.23.42
    scripture: tanakh
    name: Tanakh Ezekiel 23:42
    ref: Ezekiel 23:42
    book: Ezek
    section: neviim
    chapter: 23
    verse: 42
    ordinal: 13404
    text: And the voice of a multitude being at ease was therein; and for the sake of men, they were so many, brought drunken from the wilderness, they put bracelets upon their hands, and beautiful crowns upon their heads.
    translation: JPS 1917
    original: וְקוֹל הָמוֹן שָׁלֵו בָהּ וְאֶל־אֲנָשִׁים מֵרֹב אָדָם מוּבָאִים סובאים [סָבָאִים] מִמִּדְבָּר וַיִּתְּנוּ צְמִידִים אֶל־יְדֵיהֶן וַעֲטֶרֶת תִּפְאֶרֶת עַל־רָאשֵׁיהֶן׃
    hebrewPlain: וקול המון שלו בה ואל אנשים מרב אדם מובאים סובאים [סבאים] ממדבר ויתנו צמידים אל ידיהן ועטרת תפארת על ראשיהן
    kjvRefs:
    - Ezekiel 23:42
    kjvOsis:
    - Ezek.23.42
