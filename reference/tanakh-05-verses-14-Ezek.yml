- type: TanakhVerse
  data:
    osis: Ezek.34.22
    scripture: tanakh
    name: Tanakh Ezekiel 34:22
    ref: Ezekiel 34:22
    book: Ezek
    section: neviim
    chapter: 34
    verse: 22
    ordinal: 13690
    text: therefore will I save My flock, and they shall no more be a prey; and I will judge between cattle and cattle.
    translation: JPS 1917
    original: וְהוֹשַׁעְתִּי לְצֹאנִי וְלֹא־תִהְיֶינָה עוֹד לָבַז וְשָׁפַטְתִּי בֵּין שֶׂה לָשֶׂה׃
    hebrewPlain: והושעתי לצאני ולא תהיינה עוד לבז ושפטתי בין שה לשה
    kjvRefs:
    - Ezekiel 34:22
    kjvOsis:
    - Ezek.34.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.23
    scripture: tanakh
    name: Tanakh Ezekiel 34:23
    ref: Ezekiel 34:23
    book: Ezek
    section: neviim
    chapter: 34
    verse: 23
    ordinal: 13691
    text: And I will set up one shepherd over them, and he shall feed them, even My servant David; he shall feed them, and he shall be their shepherd.
    translation: JPS 1917
    original: וַהֲקִמֹתִי עֲלֵיהֶם רֹעֶה אֶחָד וְרָעָה אֶתְהֶן אֵת עַבְדִּי דָוִיד הוּא יִרְעֶה אֹתָם וְהוּא־יִהְיֶה לָהֶן לְרֹעֶה׃
    hebrewPlain: והקמתי עליהם רעה אחד ורעה אתהן את עבדי דויד הוא ירעה אתם והוא יהיה להן לרעה
    kjvRefs:
    - Ezekiel 34:23
    kjvOsis:
    - Ezek.34.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.24
    scripture: tanakh
    name: Tanakh Ezekiel 34:24
    ref: Ezekiel 34:24
    book: Ezek
    section: neviim
    chapter: 34
    verse: 24
    ordinal: 13692
    text: And I the LORD will be their God, and My servant David prince among them; I the LORD have spoken.
    translation: JPS 1917
    original: וַאֲנִי יְהוָה אֶהְיֶה לָהֶם לֵאלֹהִים וְעַבְדִּי דָוִד נָשִׂיא בְתוֹכָם אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: ואני יהוה אהיה להם לאלהים ועבדי דוד נשיא בתוכם אני יהוה דברתי
    kjvRefs:
    - Ezekiel 34:24
    kjvOsis:
    - Ezek.34.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.25
    scripture: tanakh
    name: Tanakh Ezekiel 34:25
    ref: Ezekiel 34:25
    book: Ezek
    section: neviim
    chapter: 34
    verse: 25
    ordinal: 13693
    text: And I will make with them a covenant of peace, and will cause evil beasts to cease out of the land; and they shall dwell safely in the wilderness, and sleep in the woods.
    translation: JPS 1917
    original: וְכָרַתִּי לָהֶם בְּרִית שָׁלוֹם וְהִשְׁבַּתִּי חַיָּה־רָעָה מִן־הָאָרֶץ וְיָשְׁבוּ בַמִּדְבָּר לָבֶטַח וְיָשְׁנוּ בַּיְּעָרִים׃
    hebrewPlain: וכרתי להם ברית שלום והשבתי חיה רעה מן הארץ וישבו במדבר לבטח וישנו ביערים
    kjvRefs:
    - Ezekiel 34:25
    kjvOsis:
    - Ezek.34.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.26
    scripture: tanakh
    name: Tanakh Ezekiel 34:26
    ref: Ezekiel 34:26
    book: Ezek
    section: neviim
    chapter: 34
    verse: 26
    ordinal: 13694
    text: And I will make them and the places round about My hill a blessing; and I will cause the shower to come down in its season; there shall be showers of blessing.
    translation: JPS 1917
    original: וְנָתַתִּי אוֹתָם וּסְבִיבוֹת גִּבְעָתִי בְּרָכָה וְהוֹרַדְתִּי הַגֶּשֶׁם בְּעִתּוֹ גִּשְׁמֵי בְרָכָה יִהְיוּ׃
    hebrewPlain: ונתתי אותם וסביבות גבעתי ברכה והורדתי הגשם בעתו גשמי ברכה יהיו
    kjvRefs:
    - Ezekiel 34:26
    kjvOsis:
    - Ezek.34.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.27
    scripture: tanakh
    name: Tanakh Ezekiel 34:27
    ref: Ezekiel 34:27
    book: Ezek
    section: neviim
    chapter: 34
    verse: 27
    ordinal: 13695
    text: And the tree of the field shall yield its fruit, and the earth shall yield her produce, and they shall be safe in their land; and they shall know that I am the LORD, when I have broken the bars of their yoke, and have delivered them out of the hand of those that made bondmen of them.
    translation: JPS 1917
    original: וְנָתַן עֵץ הַשָּׂדֶה אֶת־פִּרְיוֹ וְהָאָרֶץ תִּתֵּן יְבוּלָהּ וְהָיוּ עַל־אַדְמָתָם לָבֶטַח וְיָדְעוּ כִּי־אֲנִי יְהוָה בְּשִׁבְרִי אֶת־מֹטוֹת עֻלָּם וְהִצַּלְתִּים מִיַּד הָעֹבְדִים בָּהֶם׃
    hebrewPlain: ונתן עץ השדה את פריו והארץ תתן יבולה והיו על אדמתם לבטח וידעו כי אני יהוה בשברי את מטות עלם והצלתים מיד העבדים בהם
    kjvRefs:
    - Ezekiel 34:27
    kjvOsis:
    - Ezek.34.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.28
    scripture: tanakh
    name: Tanakh Ezekiel 34:28
    ref: Ezekiel 34:28
    book: Ezek
    section: neviim
    chapter: 34
    verse: 28
    ordinal: 13696
    text: And they shall no more be a prey to the nations, neither shall the beast of the earth devour them; but they shall dwell safely, and none shall make them afraid.
    translation: JPS 1917
    original: וְלֹא־יִהְיוּ עוֹד בַּז לַגּוֹיִם וְחַיַּת הָאָרֶץ לֹא תֹאכְלֵם וְיָשְׁבוּ לָבֶטַח וְאֵין מַחֲרִיד׃
    hebrewPlain: ולא יהיו עוד בז לגוים וחית הארץ לא תאכלם וישבו לבטח ואין מחריד
    kjvRefs:
    - Ezekiel 34:28
    kjvOsis:
    - Ezek.34.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.29
    scripture: tanakh
    name: Tanakh Ezekiel 34:29
    ref: Ezekiel 34:29
    book: Ezek
    section: neviim
    chapter: 34
    verse: 29
    ordinal: 13697
    text: And I will raise up unto them a plantation for renown, and they shall be no more consumed with hunger in the land, neither bear the shame of the nations any more.
    translation: JPS 1917
    original: וַהֲקִמֹתִי לָהֶם מַטָּע לְשֵׁם וְלֹא־יִהְיוּ עוֹד אֲסֻפֵי רָעָב בָּאָרֶץ וְלֹא־יִשְׂאוּ עוֹד כְּלִמַּת הַגּוֹיִם׃
    hebrewPlain: והקמתי להם מטע לשם ולא יהיו עוד אספי רעב בארץ ולא ישאו עוד כלמת הגוים
    kjvRefs:
    - Ezekiel 34:29
    kjvOsis:
    - Ezek.34.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.30
    scripture: tanakh
    name: Tanakh Ezekiel 34:30
    ref: Ezekiel 34:30
    book: Ezek
    section: neviim
    chapter: 34
    verse: 30
    ordinal: 13698
    text: And they shall know that I the LORD their God am with them, and that they, the house of Israel, are My people, saith the Lord GOD.
    translation: JPS 1917
    original: וְיָדְעוּ כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם אִתָּם וְהֵמָּה עַמִּי בֵּית יִשְׂרָאֵל נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: וידעו כי אני יהוה אלהיהם אתם והמה עמי בית ישראל נאם אדני יהוה
    kjvRefs:
    - Ezekiel 34:30
    kjvOsis:
    - Ezek.34.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.34.31
    scripture: tanakh
    name: Tanakh Ezekiel 34:31
    ref: Ezekiel 34:31
    book: Ezek
    section: neviim
    chapter: 34
    verse: 31
    ordinal: 13699
    text: And ye My sheep, the sheep of My pasture, are men, and I am your God, saith the Lord GOD.’
    translation: JPS 1917
    original: וְאַתֵּן צֹאנִי צֹאן מַרְעִיתִי אָדָם אַתֶּם אֲנִי אֱלֹהֵיכֶם נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ואתן צאני צאן מרעיתי אדם אתם אני אלהיכם נאם אדני יהוה
    kjvRefs:
    - Ezekiel 34:31
    kjvOsis:
    - Ezek.34.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.34
- type: TanakhVerse
  data:
    osis: Ezek.35.1
    scripture: tanakh
    name: Tanakh Ezekiel 35:1
    ref: Ezekiel 35:1
    book: Ezek
    section: neviim
    chapter: 35
    verse: 1
    ordinal: 13700
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 35:1
    kjvOsis:
    - Ezek.35.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.2
    scripture: tanakh
    name: Tanakh Ezekiel 35:2
    ref: Ezekiel 35:2
    book: Ezek
    section: neviim
    chapter: 35
    verse: 2
    ordinal: 13701
    text: ’Son of man, set thy face against mount Seir, and prophesy against it,
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ עַל־הַר שֵׂעִיר וְהִנָּבֵא עָלָיו׃
    hebrewPlain: בן אדם שים פניך על הר שעיר והנבא עליו
    kjvRefs:
    - Ezekiel 35:2
    kjvOsis:
    - Ezek.35.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.3
    scripture: tanakh
    name: Tanakh Ezekiel 35:3
    ref: Ezekiel 35:3
    book: Ezek
    section: neviim
    chapter: 35
    verse: 3
    ordinal: 13702
    text: 'and say unto it: Thus saith the Lord GOD: Behold, I am against thee, O mount Seir, and I will stretch out My hand against thee, and I will make thee most desolate.'
    translation: JPS 1917
    original: וְאָמַרְתָּ לּוֹ כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי אֵלֶיךָ הַר־שֵׂעִיר וְנָטִיתִי יָדִי עָלֶיךָ וּנְתַתִּיךָ שְׁמָמָה וּמְשַׁמָּה׃
    hebrewPlain: ואמרת לו כה אמר אדני יהוה הנני אליך הר שעיר ונטיתי ידי עליך ונתתיך שממה ומשמה
    kjvRefs:
    - Ezekiel 35:3
    kjvOsis:
    - Ezek.35.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.4
    scripture: tanakh
    name: Tanakh Ezekiel 35:4
    ref: Ezekiel 35:4
    book: Ezek
    section: neviim
    chapter: 35
    verse: 4
    ordinal: 13703
    text: I will lay thy cities waste, and thou shalt be desolate; and thou shalt know that I am the LORD.
    translation: JPS 1917
    original: עָרֶיךָ חָרְבָּה אָשִׂים וְאַתָּה שְׁמָמָה תִהְיֶה וְיָדַעְתָּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: עריך חרבה אשים ואתה שממה תהיה וידעת כי אני יהוה
    kjvRefs:
    - Ezekiel 35:4
    kjvOsis:
    - Ezek.35.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.5
    scripture: tanakh
    name: Tanakh Ezekiel 35:5
    ref: Ezekiel 35:5
    book: Ezek
    section: neviim
    chapter: 35
    verse: 5
    ordinal: 13704
    text: Because thou hast had a hatred of old, and hast hurled the children of Israel unto the power of the sword in the time of their calamity, in the time of the iniquity of the end;
    translation: JPS 1917
    original: יַעַן הֱיוֹת לְךָ אֵיבַת עוֹלָם וַתַּגֵּר אֶת־בְּנֵי־יִשְׂרָאֵל עַל־יְדֵי־חָרֶב בְּעֵת אֵידָם בְּעֵת עֲוֺן קֵץ׃
    hebrewPlain: יען היות לך איבת עולם ותגר את בני ישראל על ידי חרב בעת אידם בעת עון קץ
    kjvRefs:
    - Ezekiel 35:5
    kjvOsis:
    - Ezek.35.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.6
    scripture: tanakh
    name: Tanakh Ezekiel 35:6
    ref: Ezekiel 35:6
    book: Ezek
    section: neviim
    chapter: 35
    verse: 6
    ordinal: 13705
    text: therefore, as I live, saith the Lord GOD, I will prepare thee unto blood, and blood shall pursue thee; surely thou hast hated thine own blood, therefore blood shall pursue thee.
    translation: JPS 1917
    original: לָכֵן חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה כִּי־לְדָם אֶעֶשְׂךָ וְדָם יִרְדֲּפֶךָ אִם־לֹא דָם שָׂנֵאתָ וְדָם יִרְדֲּפֶךָ׃
    hebrewPlain: לכן חי אני נאם אדני יהוה כי לדם אעשך ודם ירדפך אם לא דם שנאת ודם ירדפך
    kjvRefs:
    - Ezekiel 35:6
    kjvOsis:
    - Ezek.35.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.7
    scripture: tanakh
    name: Tanakh Ezekiel 35:7
    ref: Ezekiel 35:7
    book: Ezek
    section: neviim
    chapter: 35
    verse: 7
    ordinal: 13706
    text: Thus will I make mount Seir most desolate, and cut off from it him that passeth through and him that returneth.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־הַר שֵׂעִיר לְשִׁמְמָה וּשְׁמָמָה וְהִכְרַתִּי מִמֶּנּוּ עֹבֵר וָשָׁב׃
    hebrewPlain: ונתתי את הר שעיר לשממה ושממה והכרתי ממנו עבר ושב
    kjvRefs:
    - Ezekiel 35:7
    kjvOsis:
    - Ezek.35.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.8
    scripture: tanakh
    name: Tanakh Ezekiel 35:8
    ref: Ezekiel 35:8
    book: Ezek
    section: neviim
    chapter: 35
    verse: 8
    ordinal: 13707
    text: And I will fill his mountains with his slain; in thy hills and in thy valleys and in all thy streams shall they fall that are slain with the sword.
    translation: JPS 1917
    original: וּמִלֵּאתִי אֶת־הָרָיו חֲלָלָיו גִּבְעוֹתֶיךָ וְגֵאוֹתֶיךָ וְכָל־אֲפִיקֶיךָ חַלְלֵי־חֶרֶב יִפְּלוּ בָהֶם׃
    hebrewPlain: ומלאתי את הריו חלליו גבעותיך וגאותיך וכל אפיקיך חללי חרב יפלו בהם
    kjvRefs:
    - Ezekiel 35:8
    kjvOsis:
    - Ezek.35.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.9
    scripture: tanakh
    name: Tanakh Ezekiel 35:9
    ref: Ezekiel 35:9
    book: Ezek
    section: neviim
    chapter: 35
    verse: 9
    ordinal: 13708
    text: I will make thee perpetual desolations, and thy cities shall not return; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: שִׁמְמוֹת עוֹלָם אֶתֶּנְךָ וְעָרֶיךָ לֹא תישבנה [תָשֹׁבְנָה] וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: שממות עולם אתנך ועריך לא תישבנה [תשבנה] וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 35:9
    kjvOsis:
    - Ezek.35.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.10
    scripture: tanakh
    name: Tanakh Ezekiel 35:10
    ref: Ezekiel 35:10
    book: Ezek
    section: neviim
    chapter: 35
    verse: 10
    ordinal: 13709
    text: 'Because thou hast said: These two nations and these two countries shall be mine, and we will possess it; whereas the LORD was there;'
    translation: JPS 1917
    original: יַעַן אֲמָרְךָ אֶת־שְׁנֵי הַגּוֹיִם וְאֶת־שְׁתֵּי הָאֲרָצוֹת לִי תִהְיֶינָה וִירַשְׁנוּהָ וַיהוָה שָׁם הָיָה׃
    hebrewPlain: יען אמרך את שני הגוים ואת שתי הארצות לי תהיינה וירשנוה ויהוה שם היה
    kjvRefs:
    - Ezekiel 35:10
    kjvOsis:
    - Ezek.35.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.11
    scripture: tanakh
    name: Tanakh Ezekiel 35:11
    ref: Ezekiel 35:11
    book: Ezek
    section: neviim
    chapter: 35
    verse: 11
    ordinal: 13710
    text: therefore, as I live, saith the Lord GOD, I will do according to thine anger and according to thine envy, which thou hast used out of thy hatred against them; and I will make Myself known among them, when I shall judge thee.
    translation: JPS 1917
    original: לָכֵן חַי־אָנִי נְאֻם אֲדֹנָי יְהוִה וְעָשִׂיתִי כְּאַפְּךָ וּכְקִנְאָתְךָ אֲשֶׁר עָשִׂיתָה מִשִּׂנְאָתֶיךָ בָּם וְנוֹדַעְתִּי בָם כַּאֲשֶׁר אֶשְׁפְּטֶךָ׃
    hebrewPlain: לכן חי אני נאם אדני יהוה ועשיתי כאפך וכקנאתך אשר עשיתה משנאתיך בם ונודעתי בם כאשר אשפטך
    kjvRefs:
    - Ezekiel 35:11
    kjvOsis:
    - Ezek.35.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.12
    scripture: tanakh
    name: Tanakh Ezekiel 35:12
    ref: Ezekiel 35:12
    book: Ezek
    section: neviim
    chapter: 35
    verse: 12
    ordinal: 13711
    text: 'And thou shalt know that I the LORD have heard all thy blasphemies which thou hast spoken against the mountains of Israel, saying: They are laid desolate, they are given us to devour.'
    translation: JPS 1917
    original: וְיָדַעְתָּ כִּי־אֲנִי יְהוָה שָׁמַעְתִּי אֶת־כָּל־נָאָצוֹתֶיךָ אֲשֶׁר אָמַרְתָּ עַל־הָרֵי יִשְׂרָאֵל לֵאמֹר שממה [שָׁמֵמוּ] לָנוּ נִתְּנוּ לְאָכְלָה׃
    hebrewPlain: וידעת כי אני יהוה שמעתי את כל נאצותיך אשר אמרת על הרי ישראל לאמר שממה [שממו] לנו נתנו לאכלה
    kjvRefs:
    - Ezekiel 35:12
    kjvOsis:
    - Ezek.35.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.13
    scripture: tanakh
    name: Tanakh Ezekiel 35:13
    ref: Ezekiel 35:13
    book: Ezek
    section: neviim
    chapter: 35
    verse: 13
    ordinal: 13712
    text: And ye have magnified yourselves against Me with your mouth, and have multiplied your words against Me; I have heard it.
    translation: JPS 1917
    original: וַתַּגְדִּילוּ עָלַי בְּפִיכֶם וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם אֲנִי שָׁמָעְתִּי׃
    hebrewPlain: ותגדילו עלי בפיכם והעתרתם עלי דבריכם אני שמעתי
    kjvRefs:
    - Ezekiel 35:13
    kjvOsis:
    - Ezek.35.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.14
    scripture: tanakh
    name: Tanakh Ezekiel 35:14
    ref: Ezekiel 35:14
    book: Ezek
    section: neviim
    chapter: 35
    verse: 14
    ordinal: 13713
    text: 'Thus saith the Lord GOD: When the whole earth rejoiceth, I will make thee desolate.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה כִּשְׂמֹחַ כָּל־הָאָרֶץ שְׁמָמָה אֶעֱשֶׂה־לָּךְ׃
    hebrewPlain: כה אמר אדני יהוה כשמח כל הארץ שממה אעשה לך
    kjvRefs:
    - Ezekiel 35:14
    kjvOsis:
    - Ezek.35.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.35.15
    scripture: tanakh
    name: Tanakh Ezekiel 35:15
    ref: Ezekiel 35:15
    book: Ezek
    section: neviim
    chapter: 35
    verse: 15
    ordinal: 13714
    text: As thou didst rejoice over the inheritance of the house of Israel, because it was desolate, so will I do unto thee; thou shalt be desolate, O mount Seir, and all Edom, even all of it; and they shall know that I am the LORD.
    translation: JPS 1917
    original: כְּשִׂמְחָתְךָ לְנַחְלַת בֵּית־יִשְׂרָאֵל עַל אֲשֶׁר־שָׁמֵמָה כֵּן אֶעֱשֶׂה־לָּךְ שְׁמָמָה תִהְיֶה הַר־שֵׂעִיר וְכָל־אֱדוֹם כֻּלָּהּ וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: כשמחתך לנחלת בית ישראל על אשר שממה כן אעשה לך שממה תהיה הר שעיר וכל אדום כלה וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 35:15
    kjvOsis:
    - Ezek.35.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.35
- type: TanakhVerse
  data:
    osis: Ezek.36.1
    scripture: tanakh
    name: Tanakh Ezekiel 36:1
    ref: Ezekiel 36:1
    book: Ezek
    section: neviim
    chapter: 36
    verse: 1
    ordinal: 13715
    text: 'And thou, son of man, prophesy unto the mountains of Israel, and say: Ye mountains of Israel, hear the word of the LORD.'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם הִנָּבֵא אֶל־הָרֵי יִשְׂרָאֵל וְאָמַרְתָּ הָרֵי יִשְׂרָאֵל שִׁמְעוּ דְּבַר־יְהוָה׃
    hebrewPlain: ואתה בן אדם הנבא אל הרי ישראל ואמרת הרי ישראל שמעו דבר יהוה
    kjvRefs:
    - Ezekiel 36:1
    kjvOsis:
    - Ezek.36.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.2
    scripture: tanakh
    name: Tanakh Ezekiel 36:2
    ref: Ezekiel 36:2
    book: Ezek
    section: neviim
    chapter: 36
    verse: 2
    ordinal: 13716
    text: 'Thus saith the Lord GOD: Because the enemy hath said against you: Aha! even the ancient high places are ours in possession;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן אָמַר הָאוֹיֵב עֲלֵיכֶם הֶאָח וּבָמוֹת עוֹלָם לְמוֹרָשָׁה הָיְתָה לָּנוּ׃
    hebrewPlain: כה אמר אדני יהוה יען אמר האויב עליכם האח ובמות עולם למורשה היתה לנו
    kjvRefs:
    - Ezekiel 36:2
    kjvOsis:
    - Ezek.36.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.3
    scripture: tanakh
    name: Tanakh Ezekiel 36:3
    ref: Ezekiel 36:3
    book: Ezek
    section: neviim
    chapter: 36
    verse: 3
    ordinal: 13717
    text: 'therefore prophesy, and say: Thus saith the Lord GOD: Because, even because they have made you desolate, and swallowed you up on every side, that ye might be a possession unto the rest of the nations, and ye are taken up in the lips of talkers, and the evil report of the people;'
    translation: JPS 1917
    original: לָכֵן הִנָּבֵא וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן בְּיַעַן שַׁמּוֹת וְשָׁאֹף אֶתְכֶם מִסָּבִיב לִהְיוֹתְכֶם מוֹרָשָׁה לִשְׁאֵרִית הַגּוֹיִם וַתֵּעֲלוּ עַל־שְׂפַת לָשׁוֹן וְדִבַּת־עָם׃
    hebrewPlain: לכן הנבא ואמרת כה אמר אדני יהוה יען ביען שמות ושאף אתכם מסביב להיותכם מורשה לשארית הגוים ותעלו על שפת לשון ודבת עם
    kjvRefs:
    - Ezekiel 36:3
    kjvOsis:
    - Ezek.36.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.4
    scripture: tanakh
    name: Tanakh Ezekiel 36:4
    ref: Ezekiel 36:4
    book: Ezek
    section: neviim
    chapter: 36
    verse: 4
    ordinal: 13718
    text: 'therefore, ye mountains of Israel, hear the word of the Lord GOD: Thus saith the Lord GOD to the mountains and to the hills, to the streams and to the valleys, to the desolate wastes and to the cities that are forsaken, which are become a prey and derision to the residue of the nations that are round about;'
    translation: JPS 1917
    original: לָכֵן הָרֵי יִשְׂרָאֵל שִׁמְעוּ דְּבַר־אֲדֹנָי יְהוִה כֹּה־אָמַר אֲדֹנָי יְהוִה לֶהָרִים וְלַגְּבָעוֹת לָאֲפִיקִים וְלַגֵּאָיוֹת וְלֶחֳרָבוֹת הַשֹּׁמְמוֹת וְלֶעָרִים הַנֶּעֱזָבוֹת אֲשֶׁר הָיוּ לְבַז וּלְלַעַג לִשְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב׃
    hebrewPlain: לכן הרי ישראל שמעו דבר אדני יהוה כה אמר אדני יהוה להרים ולגבעות לאפיקים ולגאיות ולחרבות השממות ולערים הנעזבות אשר היו לבז וללעג לשארית הגוים אשר מסביב
    kjvRefs:
    - Ezekiel 36:4
    kjvOsis:
    - Ezek.36.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.5
    scripture: tanakh
    name: Tanakh Ezekiel 36:5
    ref: Ezekiel 36:5
    book: Ezek
    section: neviim
    chapter: 36
    verse: 5
    ordinal: 13719
    text: 'therefore thus saith the Lord GOD: Surely in the fire of My jealousy have I spoken against the residue of the nations, and against all Edom, that have appointed My land unto themselves for a possession with the joy of all their heart, with disdain of soul, to cast it out for a prey;'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר אֲדֹנָי יְהוִה אִם־לֹא בְּאֵשׁ קִנְאָתִי דִבַּרְתִּי עַל־שְׁאֵרִית הַגּוֹיִם וְעַל־אֱדוֹם כֻּלָּא אֲשֶׁר נָתְנוּ־אֶת־אַרְצִי לָהֶם לְמוֹרָשָׁה בְּשִׂמְחַת כָּל־לֵבָב בִּשְׁאָט נֶפֶשׁ לְמַעַן מִגְרָשָׁהּ לָבַז׃
    hebrewPlain: לכן כה אמר אדני יהוה אם לא באש קנאתי דברתי על שארית הגוים ועל אדום כלא אשר נתנו את ארצי להם למורשה בשמחת כל לבב בשאט נפש למען מגרשה לבז
    kjvRefs:
    - Ezekiel 36:5
    kjvOsis:
    - Ezek.36.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.6
    scripture: tanakh
    name: Tanakh Ezekiel 36:6
    ref: Ezekiel 36:6
    book: Ezek
    section: neviim
    chapter: 36
    verse: 6
    ordinal: 13720
    text: 'therefore prophesy concerning the land of Israel, and say unto the mountains and to the hills, to the streams and to the valleys: Thus saith the Lord GOD: Behold, I have spoken in My jealousy and in My fury, because ye have borne the shame of the nations;'
    translation: JPS 1917
    original: לָכֵן הִנָּבֵא עַל־אַדְמַת יִשְׂרָאֵל וְאָמַרְתָּ לֶהָרִים וְלַגְּבָעוֹת לָאֲפִיקִים וְלַגֵּאָיוֹת כֹּה־אָמַר אֲדֹנָי יְהוִה הִנְנִי בְקִנְאָתִי וּבַחֲמָתִי דִּבַּרְתִּי יַעַן כְּלִמַּת גּוֹיִם נְשָׂאתֶם׃
    hebrewPlain: לכן הנבא על אדמת ישראל ואמרת להרים ולגבעות לאפיקים ולגאיות כה אמר אדני יהוה הנני בקנאתי ובחמתי דברתי יען כלמת גוים נשאתם
    kjvRefs:
    - Ezekiel 36:6
    kjvOsis:
    - Ezek.36.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.7
    scripture: tanakh
    name: Tanakh Ezekiel 36:7
    ref: Ezekiel 36:7
    book: Ezek
    section: neviim
    chapter: 36
    verse: 7
    ordinal: 13721
    text: 'therefore thus saith the Lord GOD: I have lifted up My hand: Surely the nations that are round about you, they shall bear their shame.'
    translation: JPS 1917
    original: לָכֵן כֹּה אָמַר אֲדֹנָי יְהוִה אֲנִי נָשָׂאתִי אֶת־יָדִי אִם־לֹא הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב הֵמָּה כְּלִמָּתָם יִשָּׂאוּ׃
    hebrewPlain: לכן כה אמר אדני יהוה אני נשאתי את ידי אם לא הגוים אשר לכם מסביב המה כלמתם ישאו
    kjvRefs:
    - Ezekiel 36:7
    kjvOsis:
    - Ezek.36.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.8
    scripture: tanakh
    name: Tanakh Ezekiel 36:8
    ref: Ezekiel 36:8
    book: Ezek
    section: neviim
    chapter: 36
    verse: 8
    ordinal: 13722
    text: But ye, O mountains of Israel, ye shall shoot forth your branches, and yield your fruit to My people Israel; for they are at hand to come.
    translation: JPS 1917
    original: וְאַתֶּם הָרֵי יִשְׂרָאֵל עַנְפְּכֶם תִּתֵּנוּ וּפֶרְיְכֶם תִּשְׂאוּ לְעַמִּי יִשְׂרָאֵל כִּי קֵרְבוּ לָבוֹא׃
    hebrewPlain: ואתם הרי ישראל ענפכם תתנו ופריכם תשאו לעמי ישראל כי קרבו לבוא
    kjvRefs:
    - Ezekiel 36:8
    kjvOsis:
    - Ezek.36.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.9
    scripture: tanakh
    name: Tanakh Ezekiel 36:9
    ref: Ezekiel 36:9
    book: Ezek
    section: neviim
    chapter: 36
    verse: 9
    ordinal: 13723
    text: For, behold, I am for you, and I will turn unto you, and ye shall be tilled and sown;
    translation: JPS 1917
    original: כִּי הִנְנִי אֲלֵיכֶם וּפָנִיתִי אֲלֵיכֶם וְנֶעֱבַדְתֶּם וְנִזְרַעְתֶּם׃
    hebrewPlain: כי הנני אליכם ופניתי אליכם ונעבדתם ונזרעתם
    kjvRefs:
    - Ezekiel 36:9
    kjvOsis:
    - Ezek.36.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.10
    scripture: tanakh
    name: Tanakh Ezekiel 36:10
    ref: Ezekiel 36:10
    book: Ezek
    section: neviim
    chapter: 36
    verse: 10
    ordinal: 13724
    text: and I will multiply men upon you, all the house of Israel, even all of it; and the cities shall be inhabited, and the waste places shall be builded;
    translation: JPS 1917
    original: וְהִרְבֵּיתִי עֲלֵיכֶם אָדָם כָּל־בֵּית יִשְׂרָאֵל כֻּלֹּה וְנֹשְׁבוּ הֶעָרִים וְהֶחֳרָבוֹת תִּבָּנֶינָה׃
    hebrewPlain: והרביתי עליכם אדם כל בית ישראל כלה ונשבו הערים והחרבות תבנינה
    kjvRefs:
    - Ezekiel 36:10
    kjvOsis:
    - Ezek.36.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.11
    scripture: tanakh
    name: Tanakh Ezekiel 36:11
    ref: Ezekiel 36:11
    book: Ezek
    section: neviim
    chapter: 36
    verse: 11
    ordinal: 13725
    text: and I will multiply upon you man and beast, and they shall increase and be fruitful; and I will cause you to be inhabited after your former estate, and will do better unto you than at your beginnings; and ye shall know that I am the LORD.
    translation: JPS 1917
    original: וְהִרְבֵּיתִי עֲלֵיכֶם אָדָם וּבְהֵמָה וְרָבוּ וּפָרוּ וְהוֹשַׁבְתִּי אֶתְכֶם כְּקַדְמוֹתֵיכֶם וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: והרביתי עליכם אדם ובהמה ורבו ופרו והושבתי אתכם כקדמותיכם והטבתי מראשתיכם וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 36:11
    kjvOsis:
    - Ezek.36.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.12
    scripture: tanakh
    name: Tanakh Ezekiel 36:12
    ref: Ezekiel 36:12
    book: Ezek
    section: neviim
    chapter: 36
    verse: 12
    ordinal: 13726
    text: Yea, I will cause men to walk upon you, even my people Israel, and they shall possess thee, and thou shalt be their inheritance; and thou shalt no more henceforth bereave them of children.
    translation: JPS 1917
    original: וְהוֹלַכְתִּי עֲלֵיכֶם אָדָם אֶת־עַמִּי יִשְׂרָאֵל וִירֵשׁוּךָ וְהָיִיתָ לָהֶם לְנַחֲלָה וְלֹא־תוֹסִף עוֹד לְשַׁכְּלָם׃
    hebrewPlain: והולכתי עליכם אדם את עמי ישראל וירשוך והיית להם לנחלה ולא תוסף עוד לשכלם
    kjvRefs:
    - Ezekiel 36:12
    kjvOsis:
    - Ezek.36.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.13
    scripture: tanakh
    name: Tanakh Ezekiel 36:13
    ref: Ezekiel 36:13
    book: Ezek
    section: neviim
    chapter: 36
    verse: 13
    ordinal: 13727
    text: 'Thus saith the Lord GOD: Because they say unto you: Thou land art a devourer of men, and hast been a bereaver of thy nations;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה יַעַן אֹמְרִים לָכֶם אֹכֶלֶת אָדָם אתי [אָתְּ] וּמְשַׁכֶּלֶת גויך [גּוֹיַיִךְ] הָיִית׃
    hebrewPlain: כה אמר אדני יהוה יען אמרים לכם אכלת אדם אתי [את] ומשכלת גויך [גוייך] היית
    kjvRefs:
    - Ezekiel 36:13
    kjvOsis:
    - Ezek.36.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.14
    scripture: tanakh
    name: Tanakh Ezekiel 36:14
    ref: Ezekiel 36:14
    book: Ezek
    section: neviim
    chapter: 36
    verse: 14
    ordinal: 13728
    text: therefore thou shalt devour men no more, neither bereave thy nations any more, saith the Lord GOD;
    translation: JPS 1917
    original: לָכֵן אָדָם לֹא־תֹאכְלִי עוֹד וגויך [וְגוֹיַיִךְ] לֹא תכשלי־[תְשַׁכְּלִי־] עוֹד נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: לכן אדם לא תאכלי עוד וגויך [וגוייך] לא תכשלי [תשכלי ] עוד נאם אדני יהוה
    kjvRefs:
    - Ezekiel 36:14
    kjvOsis:
    - Ezek.36.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.15
    scripture: tanakh
    name: Tanakh Ezekiel 36:15
    ref: Ezekiel 36:15
    book: Ezek
    section: neviim
    chapter: 36
    verse: 15
    ordinal: 13729
    text: neither will I suffer the shame of the nations any more to be heard against thee, neither shalt thou bear the reproach of the peoples any more, neither shalt thou cause thy nations to stumble any more, saith the Lord GOD.’
    translation: JPS 1917
    original: וְלֹא־אַשְׁמִיעַ אֵלַיִךְ עוֹד כְּלִמַּת הַגּוֹיִם וְחֶרְפַּת עַמִּים לֹא תִשְׂאִי־עוֹד וגויך [וְגוֹיַיִךְ] לֹא־תַכְשִׁלִי עוֹד נְאֻם אֲדֹנָי יְהוִה׃
    hebrewPlain: ולא אשמיע אליך עוד כלמת הגוים וחרפת עמים לא תשאי עוד וגויך [וגוייך] לא תכשלי עוד נאם אדני יהוה
    kjvRefs:
    - Ezekiel 36:15
    kjvOsis:
    - Ezek.36.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.16
    scripture: tanakh
    name: Tanakh Ezekiel 36:16
    ref: Ezekiel 36:16
    book: Ezek
    section: neviim
    chapter: 36
    verse: 16
    ordinal: 13730
    text: 'Moreover the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 36:16
    kjvOsis:
    - Ezek.36.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.17
    scripture: tanakh
    name: Tanakh Ezekiel 36:17
    ref: Ezekiel 36:17
    book: Ezek
    section: neviim
    chapter: 36
    verse: 17
    ordinal: 13731
    text: ’Son of man, when the house of Israel dwelt in their own land, they defiled it by their way and by their doings; their way before Me was as the uncleanness of a woman in her impurity.
    translation: JPS 1917
    original: בֶּן־אָדָם בֵּית יִשְׂרָאֵל יֹשְׁבִים עַל־אַדְמָתָם וַיְטַמְּאוּ אוֹתָהּ בְּדַרְכָּם וּבַעֲלִילוֹתָם כְּטֻמְאַת הַנִּדָּה הָיְתָה דַרְכָּם לְפָנָי׃
    hebrewPlain: בן אדם בית ישראל ישבים על אדמתם ויטמאו אותה בדרכם ובעלילותם כטמאת הנדה היתה דרכם לפני
    kjvRefs:
    - Ezekiel 36:17
    kjvOsis:
    - Ezek.36.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.18
    scripture: tanakh
    name: Tanakh Ezekiel 36:18
    ref: Ezekiel 36:18
    book: Ezek
    section: neviim
    chapter: 36
    verse: 18
    ordinal: 13732
    text: Wherefore I poured out My fury upon them for the blood which they had shed upon the land, and because they had defiled it with their idols;
    translation: JPS 1917
    original: וָאֶשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם עַל־הַדָּם אֲשֶׁר־שָׁפְכוּ עַל־הָאָרֶץ וּבְגִלּוּלֵיהֶם טִמְּאוּהָ׃
    hebrewPlain: ואשפך חמתי עליהם על הדם אשר שפכו על הארץ ובגלוליהם טמאוה
    kjvRefs:
    - Ezekiel 36:18
    kjvOsis:
    - Ezek.36.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.19
    scripture: tanakh
    name: Tanakh Ezekiel 36:19
    ref: Ezekiel 36:19
    book: Ezek
    section: neviim
    chapter: 36
    verse: 19
    ordinal: 13733
    text: and I scattered them among the nations, and they were dispersed through the countries; according to their way and according to their doings I judged them.
    translation: JPS 1917
    original: וָאָפִיץ אֹתָם בַּגּוֹיִם וַיִּזָּרוּ בָּאֲרָצוֹת כְּדַרְכָּם וְכַעֲלִילוֹתָם שְׁפַטְתִּים׃
    hebrewPlain: ואפיץ אתם בגוים ויזרו בארצות כדרכם וכעלילותם שפטתים
    kjvRefs:
    - Ezekiel 36:19
    kjvOsis:
    - Ezek.36.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.20
    scripture: tanakh
    name: Tanakh Ezekiel 36:20
    ref: Ezekiel 36:20
    book: Ezek
    section: neviim
    chapter: 36
    verse: 20
    ordinal: 13734
    text: 'And when they came unto the nations, whither they came, they profaned My holy name; in that men said of them: These are the people of the LORD, and are gone forth out of His land.'
    translation: JPS 1917
    original: וַיָּבוֹא אֶל־הַגּוֹיִם אֲשֶׁר־בָּאוּ שָׁם וַיְחַלְּלוּ אֶת־שֵׁם קָדְשִׁי בֶּאֱמֹר לָהֶם עַם־יְהוָה אֵלֶּה וּמֵאַרְצוֹ יָצָאוּ׃
    hebrewPlain: ויבוא אל הגוים אשר באו שם ויחללו את שם קדשי באמר להם עם יהוה אלה ומארצו יצאו
    kjvRefs:
    - Ezekiel 36:20
    kjvOsis:
    - Ezek.36.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.21
    scripture: tanakh
    name: Tanakh Ezekiel 36:21
    ref: Ezekiel 36:21
    book: Ezek
    section: neviim
    chapter: 36
    verse: 21
    ordinal: 13735
    text: But I had pity for My holy name, which the house of Israel had profaned among the nations, whither they came.
    translation: JPS 1917
    original: וָאֶחְמֹל עַל־שֵׁם קָדְשִׁי אֲשֶׁר חִלְּלוּהוּ בֵּית יִשְׂרָאֵל בַּגּוֹיִם אֲשֶׁר־בָּאוּ שָׁמָּה׃
    hebrewPlain: ואחמל על שם קדשי אשר חללוהו בית ישראל בגוים אשר באו שמה
    kjvRefs:
    - Ezekiel 36:21
    kjvOsis:
    - Ezek.36.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.22
    scripture: tanakh
    name: Tanakh Ezekiel 36:22
    ref: Ezekiel 36:22
    book: Ezek
    section: neviim
    chapter: 36
    verse: 22
    ordinal: 13736
    text: 'Therefore say unto the house of Israel: Thus saith the Lord GOD: I do not this for your sake, O house of Israel, but for My holy name, which ye have profaned among the nations, whither ye came.'
    translation: JPS 1917
    original: לָכֵן אֱמֹר לְבֵית־יִשְׂרָאֵל כֹּה אָמַר אֲדֹנָי יְהוִה לֹא לְמַעַנְכֶם אֲנִי עֹשֶׂה בֵּית יִשְׂרָאֵל כִּי אִם־לְשֵׁם־קָדְשִׁי אֲשֶׁר חִלַּלְתֶּם בַּגּוֹיִם אֲשֶׁר־בָּאתֶם שָׁם׃
    hebrewPlain: לכן אמר לבית ישראל כה אמר אדני יהוה לא למענכם אני עשה בית ישראל כי אם לשם קדשי אשר חללתם בגוים אשר באתם שם
    kjvRefs:
    - Ezekiel 36:22
    kjvOsis:
    - Ezek.36.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.23
    scripture: tanakh
    name: Tanakh Ezekiel 36:23
    ref: Ezekiel 36:23
    book: Ezek
    section: neviim
    chapter: 36
    verse: 23
    ordinal: 13737
    text: And I will sanctify My great name, which hath been profaned among the nations, which ye have profaned in the midst of them; and the nations shall know that I am the LORD, saith the Lord GOD, when I shall be sanctified in you before their eyes.
    translation: JPS 1917
    original: וְקִדַּשְׁתִּי אֶת־שְׁמִי הַגָּדוֹל הַמְחֻלָּל בַּגּוֹיִם אֲשֶׁר חִלַּלְתֶּם בְּתוֹכָם וְיָדְעוּ הַגּוֹיִם כִּי־אֲנִי יְהוָה נְאֻם אֲדֹנָי יְהוִה בְּהִקָּדְשִׁי בָכֶם לְעֵינֵיהֶם׃
    hebrewPlain: וקדשתי את שמי הגדול המחלל בגוים אשר חללתם בתוכם וידעו הגוים כי אני יהוה נאם אדני יהוה בהקדשי בכם לעיניהם
    kjvRefs:
    - Ezekiel 36:23
    kjvOsis:
    - Ezek.36.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.24
    scripture: tanakh
    name: Tanakh Ezekiel 36:24
    ref: Ezekiel 36:24
    book: Ezek
    section: neviim
    chapter: 36
    verse: 24
    ordinal: 13738
    text: For I will take you from among the nations, and gather you out of all the countries, and will bring you into your own land.
    translation: JPS 1917
    original: וְלָקַחְתִּי אֶתְכֶם מִן־הַגּוֹיִם וְקִבַּצְתִּי אֶתְכֶם מִכָּל־הָאֲרָצוֹת וְהֵבֵאתִי אֶתְכֶם אֶל־אַדְמַתְכֶם׃
    hebrewPlain: ולקחתי אתכם מן הגוים וקבצתי אתכם מכל הארצות והבאתי אתכם אל אדמתכם
    kjvRefs:
    - Ezekiel 36:24
    kjvOsis:
    - Ezek.36.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.25
    scripture: tanakh
    name: Tanakh Ezekiel 36:25
    ref: Ezekiel 36:25
    book: Ezek
    section: neviim
    chapter: 36
    verse: 25
    ordinal: 13739
    text: And I will sprinkle clean water upon you, and ye shall be clean; from all your uncleannesses, and from all your idols, will I cleanse you.
    translation: JPS 1917
    original: וְזָרַקְתִּי עֲלֵיכֶם מַיִם טְהוֹרִים וּטְהַרְתֶּם מִכֹּל טֻמְאוֹתֵיכֶם וּמִכָּל־גִּלּוּלֵיכֶם אֲטַהֵר אֶתְכֶם׃
    hebrewPlain: וזרקתי עליכם מים טהורים וטהרתם מכל טמאותיכם ומכל גלוליכם אטהר אתכם
    kjvRefs:
    - Ezekiel 36:25
    kjvOsis:
    - Ezek.36.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.26
    scripture: tanakh
    name: Tanakh Ezekiel 36:26
    ref: Ezekiel 36:26
    book: Ezek
    section: neviim
    chapter: 36
    verse: 26
    ordinal: 13740
    text: A new heart also will I give you, and a new spirit will I put within you; and I will take away the stony heart out of your flesh, and I will give you a heart of flesh.
    translation: JPS 1917
    original: וְנָתַתִּי לָכֶם לֵב חָדָשׁ וְרוּחַ חֲדָשָׁה אֶתֵּן בְּקִרְבְּכֶם וַהֲסִרֹתִי אֶת־לֵב הָאֶבֶן מִבְּשַׂרְכֶם וְנָתַתִּי לָכֶם לֵב בָּשָׂר׃
    hebrewPlain: ונתתי לכם לב חדש ורוח חדשה אתן בקרבכם והסרתי את לב האבן מבשרכם ונתתי לכם לב בשר
    kjvRefs:
    - Ezekiel 36:26
    kjvOsis:
    - Ezek.36.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.27
    scripture: tanakh
    name: Tanakh Ezekiel 36:27
    ref: Ezekiel 36:27
    book: Ezek
    section: neviim
    chapter: 36
    verse: 27
    ordinal: 13741
    text: And I will put My spirit within you, and cause you to walk in My statutes, and ye shall keep Mine ordinances, and do them.
    translation: JPS 1917
    original: וְאֶת־רוּחִי אֶתֵּן בְּקִרְבְּכֶם וְעָשִׂיתִי אֵת אֲשֶׁר־בְּחֻקַּי תֵּלֵכוּ וּמִשְׁפָּטַי תִּשְׁמְרוּ וַעֲשִׂיתֶם׃
    hebrewPlain: ואת רוחי אתן בקרבכם ועשיתי את אשר בחקי תלכו ומשפטי תשמרו ועשיתם
    kjvRefs:
    - Ezekiel 36:27
    kjvOsis:
    - Ezek.36.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.28
    scripture: tanakh
    name: Tanakh Ezekiel 36:28
    ref: Ezekiel 36:28
    book: Ezek
    section: neviim
    chapter: 36
    verse: 28
    ordinal: 13742
    text: And ye shall dwell in the land that I gave to your fathers; and ye shall be My people, and I will be your God.
    translation: JPS 1917
    original: וִישַׁבְתֶּם בָּאָרֶץ אֲשֶׁר נָתַתִּי לַאֲבֹתֵיכֶם וִהְיִיתֶם לִי לְעָם וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים׃
    hebrewPlain: וישבתם בארץ אשר נתתי לאבתיכם והייתם לי לעם ואנכי אהיה לכם לאלהים
    kjvRefs:
    - Ezekiel 36:28
    kjvOsis:
    - Ezek.36.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.29
    scripture: tanakh
    name: Tanakh Ezekiel 36:29
    ref: Ezekiel 36:29
    book: Ezek
    section: neviim
    chapter: 36
    verse: 29
    ordinal: 13743
    text: And I will save you from all your uncleannesses; and I will call for the corn, and will increase it, and lay no famine upon you.
    translation: JPS 1917
    original: וְהוֹשַׁעְתִּי אֶתְכֶם מִכֹּל טֻמְאוֹתֵיכֶם וְקָרָאתִי אֶל־הַדָּגָן וְהִרְבֵּיתִי אֹתוֹ וְלֹא־אֶתֵּן עֲלֵיכֶם רָעָב׃
    hebrewPlain: והושעתי אתכם מכל טמאותיכם וקראתי אל הדגן והרביתי אתו ולא אתן עליכם רעב
    kjvRefs:
    - Ezekiel 36:29
    kjvOsis:
    - Ezek.36.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.30
    scripture: tanakh
    name: Tanakh Ezekiel 36:30
    ref: Ezekiel 36:30
    book: Ezek
    section: neviim
    chapter: 36
    verse: 30
    ordinal: 13744
    text: And I will multiply the fruit of the tree, and the increase of the field, that ye may receive no more the reproach of famine among the nations.
    translation: JPS 1917
    original: וְהִרְבֵּיתִי אֶת־פְּרִי הָעֵץ וּתְנוּבַת הַשָּׂדֶה לְמַעַן אֲשֶׁר לֹא תִקְחוּ עוֹד חֶרְפַּת רָעָב בַּגּוֹיִם׃
    hebrewPlain: והרביתי את פרי העץ ותנובת השדה למען אשר לא תקחו עוד חרפת רעב בגוים
    kjvRefs:
    - Ezekiel 36:30
    kjvOsis:
    - Ezek.36.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.31
    scripture: tanakh
    name: Tanakh Ezekiel 36:31
    ref: Ezekiel 36:31
    book: Ezek
    section: neviim
    chapter: 36
    verse: 31
    ordinal: 13745
    text: Then shall ye remember your evil ways, and your doings that were not good; and ye shall loathe yourselves in your own sight for your iniquities and for your abominations.
    translation: JPS 1917
    original: וּזְכַרְתֶּם אֶת־דַּרְכֵיכֶם הָרָעִים וּמַעַלְלֵיכֶם אֲשֶׁר לֹא־טוֹבִים וּנְקֹטֹתֶם בִּפְנֵיכֶם עַל עֲוֺנֹתֵיכֶם וְעַל תּוֹעֲבוֹתֵיכֶם׃
    hebrewPlain: וזכרתם את דרכיכם הרעים ומעלליכם אשר לא טובים ונקטתם בפניכם על עונתיכם ועל תועבותיכם
    kjvRefs:
    - Ezekiel 36:31
    kjvOsis:
    - Ezek.36.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.32
    scripture: tanakh
    name: Tanakh Ezekiel 36:32
    ref: Ezekiel 36:32
    book: Ezek
    section: neviim
    chapter: 36
    verse: 32
    ordinal: 13746
    text: Not for your sake do I this, saith the Lord GOD, be it known unto you; be ashamed and confounded for your ways, O house of Israel.
    translation: JPS 1917
    original: לֹא לְמַעַנְכֶם אֲנִי־עֹשֶׂה נְאֻם אֲדֹנָי יְהוִה יִוָּדַע לָכֶם בּוֹשׁוּ וְהִכָּלְמוּ מִדַּרְכֵיכֶם בֵּית יִשְׂרָאֵל׃
    hebrewPlain: לא למענכם אני עשה נאם אדני יהוה יודע לכם בושו והכלמו מדרכיכם בית ישראל
    kjvRefs:
    - Ezekiel 36:32
    kjvOsis:
    - Ezek.36.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.33
    scripture: tanakh
    name: Tanakh Ezekiel 36:33
    ref: Ezekiel 36:33
    book: Ezek
    section: neviim
    chapter: 36
    verse: 33
    ordinal: 13747
    text: 'Thus saith the Lord GOD: In the day that I cleanse you from all your iniquities, I will cause the cities to be inhabited, and the waste places shall be builded.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה בְּיוֹם טַהֲרִי אֶתְכֶם מִכֹּל עֲוֺנוֹתֵיכֶם וְהוֹשַׁבְתִּי אֶת־הֶעָרִים וְנִבְנוּ הֶחֳרָבוֹת׃
    hebrewPlain: כה אמר אדני יהוה ביום טהרי אתכם מכל עונותיכם והושבתי את הערים ונבנו החרבות
    kjvRefs:
    - Ezekiel 36:33
    kjvOsis:
    - Ezek.36.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.34
    scripture: tanakh
    name: Tanakh Ezekiel 36:34
    ref: Ezekiel 36:34
    book: Ezek
    section: neviim
    chapter: 36
    verse: 34
    ordinal: 13748
    text: And the land that was desolate shall be tilled, whereas it was a desolation in the sight of all that passed by.
    translation: JPS 1917
    original: וְהָאָרֶץ הַנְּשַׁמָּה תֵּעָבֵד תַּחַת אֲשֶׁר הָיְתָה שְׁמָמָה לְעֵינֵי כָּל־עוֹבֵר׃
    hebrewPlain: והארץ הנשמה תעבד תחת אשר היתה שממה לעיני כל עובר
    kjvRefs:
    - Ezekiel 36:34
    kjvOsis:
    - Ezek.36.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.35
    scripture: tanakh
    name: Tanakh Ezekiel 36:35
    ref: Ezekiel 36:35
    book: Ezek
    section: neviim
    chapter: 36
    verse: 35
    ordinal: 13749
    text: 'And they shall say: This land that was desolate is become like the garden of Eden; and the waste and desolate and ruined cities are fortified and inhabited.'
    translation: JPS 1917
    original: וְאָמְרוּ הָאָרֶץ הַלֵּזוּ הַנְּשַׁמָּה הָיְתָה כְּגַן־עֵדֶן וְהֶעָרִים הֶחֳרֵבוֹת וְהַנְשַׁמּוֹת וְהַנֶּהֱרָסוֹת בְּצוּרוֹת יָשָׁבוּ׃
    hebrewPlain: ואמרו הארץ הלזו הנשמה היתה כגן עדן והערים החרבות והנשמות והנהרסות בצורות ישבו
    kjvRefs:
    - Ezekiel 36:35
    kjvOsis:
    - Ezek.36.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.36
    scripture: tanakh
    name: Tanakh Ezekiel 36:36
    ref: Ezekiel 36:36
    book: Ezek
    section: neviim
    chapter: 36
    verse: 36
    ordinal: 13750
    text: Then the nations that are left round about you shall know that I the LORD have builded the ruined places, and planted that which was desolate; I the LORD have spoken it, and I will do it.
    translation: JPS 1917
    original: וְיָדְעוּ הַגּוֹיִם אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם כִּי אֲנִי יְהוָה בָּנִיתִי הַנֶּהֱרָסוֹת נָטַעְתִּי הַנְּשַׁמָּה אֲנִי יְהוָה דִּבַּרְתִּי וְעָשִׂיתִי׃
    hebrewPlain: וידעו הגוים אשר ישארו סביבותיכם כי אני יהוה בניתי הנהרסות נטעתי הנשמה אני יהוה דברתי ועשיתי
    kjvRefs:
    - Ezekiel 36:36
    kjvOsis:
    - Ezek.36.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.37
    scripture: tanakh
    name: Tanakh Ezekiel 36:37
    ref: Ezekiel 36:37
    book: Ezek
    section: neviim
    chapter: 36
    verse: 37
    ordinal: 13751
    text: 'Thus saith the Lord GOD: I will yet for this be inquired of by the house of Israel, to do it for them; I will increase them with men like a flock.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה עוֹד זֹאת אִדָּרֵשׁ לְבֵית־יִשְׂרָאֵל לַעֲשׂוֹת לָהֶם אַרְבֶּה אֹתָם כַּצֹּאן אָדָם׃
    hebrewPlain: כה אמר אדני יהוה עוד זאת אדרש לבית ישראל לעשות להם ארבה אתם כצאן אדם
    kjvRefs:
    - Ezekiel 36:37
    kjvOsis:
    - Ezek.36.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.36.38
    scripture: tanakh
    name: Tanakh Ezekiel 36:38
    ref: Ezekiel 36:38
    book: Ezek
    section: neviim
    chapter: 36
    verse: 38
    ordinal: 13752
    text: As the flock for sacrifice, as the flock of Jerusalem in her appointed seasons, so shall the waste cities be filled with flocks of men; and they shall know that I am the LORD.’
    translation: JPS 1917
    original: כְּצֹאן קָדָשִׁים כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ כֵּן תִּהְיֶינָה הֶעָרִים הֶחֳרֵבוֹת מְלֵאוֹת צֹאן אָדָם וְיָדְעוּ כִּי־אֲנִי יְהוָה׃
    hebrewPlain: כצאן קדשים כצאן ירושלם במועדיה כן תהיינה הערים החרבות מלאות צאן אדם וידעו כי אני יהוה
    kjvRefs:
    - Ezekiel 36:38
    kjvOsis:
    - Ezek.36.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.36
- type: TanakhVerse
  data:
    osis: Ezek.37.1
    scripture: tanakh
    name: Tanakh Ezekiel 37:1
    ref: Ezekiel 37:1
    book: Ezek
    section: neviim
    chapter: 37
    verse: 1
    ordinal: 13753
    text: The hand of the LORD was upon me, and the LORD carried me out in a spirit, and set me down in the midst of the valley, and it was full of bones;
    translation: JPS 1917
    original: הָיְתָה עָלַי יַד־יְהוָה וַיּוֹצִאֵנִי בְרוּחַ יְהוָה וַיְנִיחֵנִי בְּתוֹךְ הַבִּקְעָה וְהִיא מְלֵאָה עֲצָמוֹת׃
    hebrewPlain: היתה עלי יד יהוה ויוצאני ברוח יהוה ויניחני בתוך הבקעה והיא מלאה עצמות
    kjvRefs:
    - Ezekiel 37:1
    kjvOsis:
    - Ezek.37.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.2
    scripture: tanakh
    name: Tanakh Ezekiel 37:2
    ref: Ezekiel 37:2
    book: Ezek
    section: neviim
    chapter: 37
    verse: 2
    ordinal: 13754
    text: and He caused me to pass by them round about, and, behold, there were very many in the open valley; and, lo, they were very dry.
    translation: JPS 1917
    original: וְהֶעֱבִירַנִי עֲלֵיהֶם סָבִיב סָבִיב וְהִנֵּה רַבּוֹת מְאֹד עַל־פְּנֵי הַבִּקְעָה וְהִנֵּה יְבֵשׁוֹת מְאֹד׃
    hebrewPlain: והעבירני עליהם סביב סביב והנה רבות מאד על פני הבקעה והנה יבשות מאד
    kjvRefs:
    - Ezekiel 37:2
    kjvOsis:
    - Ezek.37.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.3
    scripture: tanakh
    name: Tanakh Ezekiel 37:3
    ref: Ezekiel 37:3
    book: Ezek
    section: neviim
    chapter: 37
    verse: 3
    ordinal: 13755
    text: 'And He said unto me: ‘Son of man, can these bones live?’ And I answered: ‘O Lord GOD, Thou knowest.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם הֲתִחְיֶינָה הָעֲצָמוֹת הָאֵלֶּה וָאֹמַר אֲדֹנָי יְהוִה אַתָּה יָדָעְתָּ׃
    hebrewPlain: ויאמר אלי בן אדם התחיינה העצמות האלה ואמר אדני יהוה אתה ידעת
    kjvRefs:
    - Ezekiel 37:3
    kjvOsis:
    - Ezek.37.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.4
    scripture: tanakh
    name: Tanakh Ezekiel 37:4
    ref: Ezekiel 37:4
    book: Ezek
    section: neviim
    chapter: 37
    verse: 4
    ordinal: 13756
    text: 'Then He said unto me: ‘Prophesy over these bones, and say unto them: O ye dry bones, hear the word of the LORD:'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הִנָּבֵא עַל־הָעֲצָמוֹת הָאֵלֶּה וְאָמַרְתָּ אֲלֵיהֶם הָעֲצָמוֹת הַיְבֵשׁוֹת שִׁמְעוּ דְּבַר־יְהוָה׃
    hebrewPlain: ויאמר אלי הנבא על העצמות האלה ואמרת אליהם העצמות היבשות שמעו דבר יהוה
    kjvRefs:
    - Ezekiel 37:4
    kjvOsis:
    - Ezek.37.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.5
    scripture: tanakh
    name: Tanakh Ezekiel 37:5
    ref: Ezekiel 37:5
    book: Ezek
    section: neviim
    chapter: 37
    verse: 5
    ordinal: 13757
    text: 'Thus saith the Lord GOD unto these bones: Behold, I will cause breath to enter into you, and ye shall live.'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה לָעֲצָמוֹת הָאֵלֶּה הִנֵּה אֲנִי מֵבִיא בָכֶם רוּחַ וִחְיִיתֶם׃
    hebrewPlain: כה אמר אדני יהוה לעצמות האלה הנה אני מביא בכם רוח וחייתם
    kjvRefs:
    - Ezekiel 37:5
    kjvOsis:
    - Ezek.37.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.6
    scripture: tanakh
    name: Tanakh Ezekiel 37:6
    ref: Ezekiel 37:6
    book: Ezek
    section: neviim
    chapter: 37
    verse: 6
    ordinal: 13758
    text: And I will lay sinews upon you, and will bring up flesh upon you, and cover you with skin, and put breath in you, and ye shall live; and ye shall know that I am the LORD.’
    translation: JPS 1917
    original: וְנָתַתִּי עֲלֵיכֶם גִּדִים וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר וְקָרַמְתִּי עֲלֵיכֶם עוֹר וְנָתַתִּי בָכֶם רוּחַ וִחְיִיתֶם וִידַעְתֶּם כִּי־אֲנִי יְהוָה׃
    hebrewPlain: ונתתי עליכם גדים והעלתי עליכם בשר וקרמתי עליכם עור ונתתי בכם רוח וחייתם וידעתם כי אני יהוה
    kjvRefs:
    - Ezekiel 37:6
    kjvOsis:
    - Ezek.37.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.7
    scripture: tanakh
    name: Tanakh Ezekiel 37:7
    ref: Ezekiel 37:7
    book: Ezek
    section: neviim
    chapter: 37
    verse: 7
    ordinal: 13759
    text: So I prophesied as I was commanded; and as I prophesied, there was a noise, and behold a commotion, and the bones came together, bone to its bone.
    translation: JPS 1917
    original: וְנִבֵּאתִי כַּאֲשֶׁר צֻוֵּיתִי וַיְהִי־קוֹל כְּהִנָּבְאִי וְהִנֵּה־רַעַשׁ וַתִּקְרְבוּ עֲצָמוֹת עֶצֶם אֶל־עַצְמוֹ׃
    hebrewPlain: ונבאתי כאשר צויתי ויהי קול כהנבאי והנה רעש ותקרבו עצמות עצם אל עצמו
    kjvRefs:
    - Ezekiel 37:7
    kjvOsis:
    - Ezek.37.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.8
    scripture: tanakh
    name: Tanakh Ezekiel 37:8
    ref: Ezekiel 37:8
    book: Ezek
    section: neviim
    chapter: 37
    verse: 8
    ordinal: 13760
    text: And I beheld, and, lo, there were sinews upon them, and flesh came up, and skin covered them above; but there was no breath in them.
    translation: JPS 1917
    original: וְרָאִיתִי וְהִנֵּה־עֲלֵיהֶם גִּדִים וּבָשָׂר עָלָה וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה וְרוּחַ אֵין בָּהֶם׃
    hebrewPlain: וראיתי והנה עליהם גדים ובשר עלה ויקרם עליהם עור מלמעלה ורוח אין בהם
    kjvRefs:
    - Ezekiel 37:8
    kjvOsis:
    - Ezek.37.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.9
    scripture: tanakh
    name: Tanakh Ezekiel 37:9
    ref: Ezekiel 37:9
    book: Ezek
    section: neviim
    chapter: 37
    verse: 9
    ordinal: 13761
    text: 'Then said He unto me: ‘Prophesy unto the breath, prophesy, son of man, and say to the breath: Thus saith the Lord GOD: Come from the four winds, O breath, and breathe upon these slain, that they may live.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי הִנָּבֵא אֶל־הָרוּחַ הִנָּבֵא בֶן־אָדָם וְאָמַרְתָּ אֶל־הָרוּחַ כֹּה־אָמַר אֲדֹנָי יְהוִה מֵאַרְבַּע רוּחוֹת בֹּאִי הָרוּחַ וּפְחִי בַּהֲרוּגִים הָאֵלֶּה וְיִחְיוּ׃
    hebrewPlain: ויאמר אלי הנבא אל הרוח הנבא בן אדם ואמרת אל הרוח כה אמר אדני יהוה מארבע רוחות באי הרוח ופחי בהרוגים האלה ויחיו
    kjvRefs:
    - Ezekiel 37:9
    kjvOsis:
    - Ezek.37.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.10
    scripture: tanakh
    name: Tanakh Ezekiel 37:10
    ref: Ezekiel 37:10
    book: Ezek
    section: neviim
    chapter: 37
    verse: 10
    ordinal: 13762
    text: So I prophesied as He commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great host.
    translation: JPS 1917
    original: וְהִנַּבֵּאתִי כַּאֲשֶׁר צִוָּנִי וַתָּבוֹא בָהֶם הָרוּחַ וַיִּחְיוּ וַיַּעַמְדוּ עַל־רַגְלֵיהֶם חַיִל גָּדוֹל מְאֹד־מְאֹד׃
    hebrewPlain: והנבאתי כאשר צוני ותבוא בהם הרוח ויחיו ויעמדו על רגליהם חיל גדול מאד מאד
    kjvRefs:
    - Ezekiel 37:10
    kjvOsis:
    - Ezek.37.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.11
    scripture: tanakh
    name: Tanakh Ezekiel 37:11
    ref: Ezekiel 37:11
    book: Ezek
    section: neviim
    chapter: 37
    verse: 11
    ordinal: 13763
    text: 'Then He said unto me: ‘Son of man, these bones are the whole house of Israel; behold, they say: Our bones are dried up, and our hope is lost; we are clean cut off.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי בֶּן־אָדָם הָעֲצָמוֹת הָאֵלֶּה כָּל־בֵּית יִשְׂרָאֵל הֵמָּה הִנֵּה אֹמְרִים יָבְשׁוּ עַצְמוֹתֵינוּ וְאָבְדָה תִקְוָתֵנוּ נִגְזַרְנוּ לָנוּ׃
    hebrewPlain: ויאמר אלי בן אדם העצמות האלה כל בית ישראל המה הנה אמרים יבשו עצמותינו ואבדה תקותנו נגזרנו לנו
    kjvRefs:
    - Ezekiel 37:11
    kjvOsis:
    - Ezek.37.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.12
    scripture: tanakh
    name: Tanakh Ezekiel 37:12
    ref: Ezekiel 37:12
    book: Ezek
    section: neviim
    chapter: 37
    verse: 12
    ordinal: 13764
    text: 'Therefore prophesy, and say unto them: Thus saith the Lord GOD: Behold, I will open your graves, and cause you to come up out of your graves, O My people; and I will bring you into the land of Israel.'
    translation: JPS 1917
    original: לָכֵן הִנָּבֵא וְאָמַרְתָּ אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה הִנֵּה אֲנִי פֹתֵחַ אֶת־קִבְרוֹתֵיכֶם וְהַעֲלֵיתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם עַמִּי וְהֵבֵאתִי אֶתְכֶם אֶל־אַדְמַת יִשְׂרָאֵל׃
    hebrewPlain: לכן הנבא ואמרת אליהם כה אמר אדני יהוה הנה אני פתח את קברותיכם והעליתי אתכם מקברותיכם עמי והבאתי אתכם אל אדמת ישראל
    kjvRefs:
    - Ezekiel 37:12
    kjvOsis:
    - Ezek.37.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.13
    scripture: tanakh
    name: Tanakh Ezekiel 37:13
    ref: Ezekiel 37:13
    book: Ezek
    section: neviim
    chapter: 37
    verse: 13
    ordinal: 13765
    text: And ye shall know that I am the LORD, when I have opened your graves, and caused you to come up out of your graves, O My people.
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי־אֲנִי יְהוָה בְּפִתְחִי אֶת־קִבְרוֹתֵיכֶם וּבְהַעֲלוֹתִי אֶתְכֶם מִקִּבְרוֹתֵיכֶם עַמִּי׃
    hebrewPlain: וידעתם כי אני יהוה בפתחי את קברותיכם ובהעלותי אתכם מקברותיכם עמי
    kjvRefs:
    - Ezekiel 37:13
    kjvOsis:
    - Ezek.37.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.14
    scripture: tanakh
    name: Tanakh Ezekiel 37:14
    ref: Ezekiel 37:14
    book: Ezek
    section: neviim
    chapter: 37
    verse: 14
    ordinal: 13766
    text: And I will put My spirit in you, and ye shall live, and I will place you in your own land; and ye shall know that I the LORD have spoken, and performed it, saith the LORD.’
    translation: JPS 1917
    original: וְנָתַתִּי רוּחִי בָכֶם וִחְיִיתֶם וְהִנַּחְתִּי אֶתְכֶם עַל־אַדְמַתְכֶם וִידַעְתֶּם כִּי־אֲנִי יְהוָה דִּבַּרְתִּי וְעָשִׂיתִי נְאֻם־יְהוָה׃
    hebrewPlain: ונתתי רוחי בכם וחייתם והנחתי אתכם על אדמתכם וידעתם כי אני יהוה דברתי ועשיתי נאם יהוה
    kjvRefs:
    - Ezekiel 37:14
    kjvOsis:
    - Ezek.37.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.15
    scripture: tanakh
    name: Tanakh Ezekiel 37:15
    ref: Ezekiel 37:15
    book: Ezek
    section: neviim
    chapter: 37
    verse: 15
    ordinal: 13767
    text: 'And the word of the LORD came unto me, saying:'
    translation: JPS 1917
    original: וַיְהִי דְבַר־יְהוָה אֵלַי לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אלי לאמר
    kjvRefs:
    - Ezekiel 37:15
    kjvOsis:
    - Ezek.37.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.16
    scripture: tanakh
    name: Tanakh Ezekiel 37:16
    ref: Ezekiel 37:16
    book: Ezek
    section: neviim
    chapter: 37
    verse: 16
    ordinal: 13768
    text: '’And thou, son of man, take thee one stick, and write upon it: For Judah, and for the children of Israel his companions; then take another stick, and write upon it: For Joseph, the stick of Ephraim, and of all the house of Israel his companions;'
    translation: JPS 1917
    original: וְאַתָּה בֶן־אָדָם קַח־לְךָ עֵץ אֶחָד וּכְתֹב עָלָיו לִיהוּדָה וְלִבְנֵי יִשְׂרָאֵל חברו [חֲבֵרָיו] וּלְקַח עֵץ אֶחָד וּכְתוֹב עָלָיו לְיוֹסֵף עֵץ אֶפְרַיִם וְכָל־בֵּית יִשְׂרָאֵל חברו [חֲבֵרָיו׃]
    hebrewPlain: ואתה בן אדם קח לך עץ אחד וכתב עליו ליהודה ולבני ישראל חברו [חבריו] ולקח עץ אחד וכתוב עליו ליוסף עץ אפרים וכל בית ישראל חברו [חבריו]
    kjvRefs:
    - Ezekiel 37:16
    kjvOsis:
    - Ezek.37.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.17
    scripture: tanakh
    name: Tanakh Ezekiel 37:17
    ref: Ezekiel 37:17
    book: Ezek
    section: neviim
    chapter: 37
    verse: 17
    ordinal: 13769
    text: and join them for thee one to another into one stick, that they may become one in thy hand.
    translation: JPS 1917
    original: וְקָרַב אֹתָם אֶחָד אֶל־אֶחָד לְךָ לְעֵץ אֶחָד וְהָיוּ לַאֲחָדִים בְּיָדֶךָ׃
    hebrewPlain: וקרב אתם אחד אל אחד לך לעץ אחד והיו לאחדים בידך
    kjvRefs:
    - Ezekiel 37:17
    kjvOsis:
    - Ezek.37.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.18
    scripture: tanakh
    name: Tanakh Ezekiel 37:18
    ref: Ezekiel 37:18
    book: Ezek
    section: neviim
    chapter: 37
    verse: 18
    ordinal: 13770
    text: 'And when the children of thy people shall speak unto thee, saying: Wilt thou not tell us what thou meanest by these?'
    translation: JPS 1917
    original: וְכַאֲשֶׁר יֹאמְרוּ אֵלֶיךָ בְּנֵי עַמְּךָ לֵאמֹר הֲלוֹא־תַגִּיד לָנוּ מָה־אֵלֶּה לָּךְ׃
    hebrewPlain: וכאשר יאמרו אליך בני עמך לאמר הלוא תגיד לנו מה אלה לך
    kjvRefs:
    - Ezekiel 37:18
    kjvOsis:
    - Ezek.37.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.19
    scripture: tanakh
    name: Tanakh Ezekiel 37:19
    ref: Ezekiel 37:19
    book: Ezek
    section: neviim
    chapter: 37
    verse: 19
    ordinal: 13771
    text: 'say into them: Thus saith the Lord GOD: Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel his companions; and I will put them unto him together with the stick of Judah, and make them one stick, and they shall be one in My hand.'
    translation: JPS 1917
    original: דַּבֵּר אֲלֵהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה הִנֵּה אֲנִי לֹקֵחַ אֶת־עֵץ יוֹסֵף אֲשֶׁר בְּיַד־אֶפְרַיִם וְשִׁבְטֵי יִשְׂרָאֵל חברו [חֲבֵרָיו] וְנָתַתִּי אוֹתָם עָלָיו אֶת־עֵץ יְהוּדָה וַעֲשִׂיתִם לְעֵץ אֶחָד וְהָיוּ אֶחָד בְּיָדִי׃
    hebrewPlain: דבר אלהם כה אמר אדני יהוה הנה אני לקח את עץ יוסף אשר ביד אפרים ושבטי ישראל חברו [חבריו] ונתתי אותם עליו את עץ יהודה ועשיתם לעץ אחד והיו אחד בידי
    kjvRefs:
    - Ezekiel 37:19
    kjvOsis:
    - Ezek.37.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.20
    scripture: tanakh
    name: Tanakh Ezekiel 37:20
    ref: Ezekiel 37:20
    book: Ezek
    section: neviim
    chapter: 37
    verse: 20
    ordinal: 13772
    text: And the sticks whereon thou writest shall be in thy hand before their eyes.
    translation: JPS 1917
    original: וְהָיוּ הָעֵצִים אֲ‍שֶׁר־תִּכְתֹּב עֲלֵיהֶם בְּיָדְךָ לְעֵינֵיהֶם׃
    hebrewPlain: והיו העצים א‍שר תכתב עליהם בידך לעיניהם
    kjvRefs:
    - Ezekiel 37:20
    kjvOsis:
    - Ezek.37.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.21
    scripture: tanakh
    name: Tanakh Ezekiel 37:21
    ref: Ezekiel 37:21
    book: Ezek
    section: neviim
    chapter: 37
    verse: 21
    ordinal: 13773
    text: 'And say unto them: Thus saith the Lord GOD: Behold, I will take the children of Israel from among the nations, whither they are gone, and will gather them on every side, and bring them into their own land;'
    translation: JPS 1917
    original: וְדַבֵּר אֲלֵיהֶם כֹּה־אָמַר אֲדֹנָי יְהוִה הִנֵּה אֲנִי לֹקֵחַ אֶת־בְּנֵי יִשְׂרָאֵל מִבֵּין הַגּוֹיִם אֲשֶׁר הָלְכוּ־שָׁם וְקִבַּצְתִּי אֹתָם מִסָּבִיב וְהֵבֵאתִי אוֹתָם אֶל־אַדְמָתָם׃
    hebrewPlain: ודבר אליהם כה אמר אדני יהוה הנה אני לקח את בני ישראל מבין הגוים אשר הלכו שם וקבצתי אתם מסביב והבאתי אותם אל אדמתם
    kjvRefs:
    - Ezekiel 37:21
    kjvOsis:
    - Ezek.37.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.22
    scripture: tanakh
    name: Tanakh Ezekiel 37:22
    ref: Ezekiel 37:22
    book: Ezek
    section: neviim
    chapter: 37
    verse: 22
    ordinal: 13774
    text: and I will make them one nation in the land, upon the mountains of Israel, and one king shall be king to them all; and they shall be no more two nations, neither shall they be divided into two kingdoms any more at all;
    translation: JPS 1917
    original: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד בָּאָרֶץ בְּהָרֵי יִשְׂרָאֵל וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ וְלֹא יהיה־[יִהְיוּ־] עוֹד לִשְׁנֵי גוֹיִם וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת עוֹד׃
    hebrewPlain: ועשיתי אתם לגוי אחד בארץ בהרי ישראל ומלך אחד יהיה לכלם למלך ולא יהיה [יהיו ] עוד לשני גוים ולא יחצו עוד לשתי ממלכות עוד
    kjvRefs:
    - Ezekiel 37:22
    kjvOsis:
    - Ezek.37.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.23
    scripture: tanakh
    name: Tanakh Ezekiel 37:23
    ref: Ezekiel 37:23
    book: Ezek
    section: neviim
    chapter: 37
    verse: 23
    ordinal: 13775
    text: neither shall they defile themselves any more with their idols, nor with their detestable things, nor with any of their transgressions; but I will save them out of all their dwelling-places, wherein they have sinned, and will cleanse them; so shall they be My people, and I will be their God.
    translation: JPS 1917
    original: וְלֹא יִטַמְּאוּ עוֹד בְּגִלּוּלֵיהֶם וּבְשִׁקּוּצֵיהֶם וּבְכֹל פִּשְׁעֵיהֶם וְהוֹשַׁעְתִּי אֹתָם מִכֹּל מוֹשְׁבֹתֵיהֶם אֲשֶׁר חָטְאוּ בָהֶם וְטִהַרְתִּי אוֹתָם וְהָיוּ־לִי לְעָם וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים׃
    hebrewPlain: ולא יטמאו עוד בגלוליהם ובשקוציהם ובכל פשעיהם והושעתי אתם מכל מושבתיהם אשר חטאו בהם וטהרתי אותם והיו לי לעם ואני אהיה להם לאלהים
    kjvRefs:
    - Ezekiel 37:23
    kjvOsis:
    - Ezek.37.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.24
    scripture: tanakh
    name: Tanakh Ezekiel 37:24
    ref: Ezekiel 37:24
    book: Ezek
    section: neviim
    chapter: 37
    verse: 24
    ordinal: 13776
    text: And My servant David shall be king over them, and they all shall have one shepherd; they shall also walk in Mine ordinances, and observe My statutes, and do them.
    translation: JPS 1917
    original: וְעַבְדִּי דָוִד מֶלֶךְ עֲלֵיהֶם וְרוֹעֶה אֶחָד יִהְיֶה לְכֻלָּם וּבְמִשְׁפָּטַי יֵלֵכוּ וְחֻקֹּתַי יִשְׁמְרוּ וְעָשׂוּ אוֹתָם׃
    hebrewPlain: ועבדי דוד מלך עליהם ורועה אחד יהיה לכלם ובמשפטי ילכו וחקתי ישמרו ועשו אותם
    kjvRefs:
    - Ezekiel 37:24
    kjvOsis:
    - Ezek.37.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.25
    scripture: tanakh
    name: Tanakh Ezekiel 37:25
    ref: Ezekiel 37:25
    book: Ezek
    section: neviim
    chapter: 37
    verse: 25
    ordinal: 13777
    text: And they shall dwell in the land that I have given unto Jacob My servant, wherein your fathers dwelt; and they shall dwell therein, they, and their children, and their children’s children, for ever; and David My servant shall be their prince for ever.
    translation: JPS 1917
    original: וְיָשְׁבוּ עַל־הָאָרֶץ אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב אֲשֶׁר יָשְׁבוּ־בָהּ אֲבוֹתֵיכֶם וְיָשְׁבוּ עָלֶיהָ הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם עַד־עוֹלָם וְדָוִד עַבְדִּי נָשִׂיא לָהֶם לְעוֹלָם׃
    hebrewPlain: וישבו על הארץ אשר נתתי לעבדי ליעקב אשר ישבו בה אבותיכם וישבו עליה המה ובניהם ובני בניהם עד עולם ודוד עבדי נשיא להם לעולם
    kjvRefs:
    - Ezekiel 37:25
    kjvOsis:
    - Ezek.37.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.26
    scripture: tanakh
    name: Tanakh Ezekiel 37:26
    ref: Ezekiel 37:26
    book: Ezek
    section: neviim
    chapter: 37
    verse: 26
    ordinal: 13778
    text: Moreover I will make a covenant of peace with them—it shall be an everlasting covenant with them; and I will establish them, and multiply them, and will set My sanctuary in the midst of them for ever.
    translation: JPS 1917
    original: וְכָרַתִּי לָהֶם בְּרִית שָׁלוֹם בְּרִית עוֹלָם יִהְיֶה אוֹתָם וּנְתַתִּים וְהִרְבֵּיתִי אוֹתָם וְנָתַתִּי אֶת־מִקְדָּשִׁי בְּתוֹכָם לְעוֹלָם׃
    hebrewPlain: וכרתי להם ברית שלום ברית עולם יהיה אותם ונתתים והרביתי אותם ונתתי את מקדשי בתוכם לעולם
    kjvRefs:
    - Ezekiel 37:26
    kjvOsis:
    - Ezek.37.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.27
    scripture: tanakh
    name: Tanakh Ezekiel 37:27
    ref: Ezekiel 37:27
    book: Ezek
    section: neviim
    chapter: 37
    verse: 27
    ordinal: 13779
    text: My dwelling-place also shall be over them; and I will be their God, and they shall be My people.
    translation: JPS 1917
    original: וְהָיָה מִשְׁכָּנִי עֲלֵיהֶם וְהָיִיתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ־לִי לְעָם׃
    hebrewPlain: והיה משכני עליהם והייתי להם לאלהים והמה יהיו לי לעם
    kjvRefs:
    - Ezekiel 37:27
    kjvOsis:
    - Ezek.37.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
    osis: Ezek.37.28
    scripture: tanakh
    name: Tanakh Ezekiel 37:28
    ref: Ezekiel 37:28
    book: Ezek
    section: neviim
    chapter: 37
    verse: 28
    ordinal: 13780
    text: And the nations shall know that I am the LORD that sanctify Israel, when My sanctuary shall be in the midst of them for ever.’
    translation: JPS 1917
    original: וְיָדְעוּ הַגּוֹיִם כִּי אֲנִי יְהוָה מְקַדֵּשׁ אֶת־יִשְׂרָאֵל בִּהְיוֹת מִקְדָּשִׁי בְּתוֹכָם לְעוֹלָם׃
    hebrewPlain: וידעו הגוים כי אני יהוה מקדש את ישראל בהיות מקדשי בתוכם לעולם
    kjvRefs:
    - Ezekiel 37:28
    kjvOsis:
    - Ezek.37.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.37
- type: TanakhVerse
  data:
