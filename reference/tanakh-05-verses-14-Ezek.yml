  data:
    osis: Ezek.38.2
    scripture: tanakh
    name: Tanakh Ezekiel 38:2
    ref: Ezekiel 38:2
    book: Ezek
    section: neviim
    chapter: 38
    verse: 2
    ordinal: 13782
    text: ’Son of man, set thy face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him,
    translation: JPS 1917
    original: בֶּן־אָדָם שִׂים פָּנֶיךָ אֶל־גּוֹג אֶרֶץ הַמָּגוֹג נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל וְהִנָּבֵא עָלָיו׃
    hebrewPlain: בן אדם שים פניך אל גוג ארץ המגוג נשיא ראש משך ותבל והנבא עליו
    kjvRefs:
    - Ezekiel 38:2
    kjvOsis:
    - Ezek.38.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.3
    scripture: tanakh
    name: Tanakh Ezekiel 38:3
    ref: Ezekiel 38:3
    book: Ezek
    section: neviim
    chapter: 38
    verse: 3
    ordinal: 13783
    text: 'and say: Thus saith the Lord GOD: Behold, I am against thee, O Gog, chief prince of Meshech and Tubal;'
    translation: JPS 1917
    original: וְאָמַרְתָּ כֹּה אָמַר אֲדֹנָי יְהוִה הִנְנִי אֵלֶיךָ גּוֹג נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל׃
    hebrewPlain: ואמרת כה אמר אדני יהוה הנני אליך גוג נשיא ראש משך ותבל
    kjvRefs:
    - Ezekiel 38:3
    kjvOsis:
    - Ezek.38.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.4
    scripture: tanakh
    name: Tanakh Ezekiel 38:4
    ref: Ezekiel 38:4
    book: Ezek
    section: neviim
    chapter: 38
    verse: 4
    ordinal: 13784
    text: 'and I will turn thee about, and put hooks into thy jaws, and I will bring thee forth, and all thine army, horses and horsemen, all of them clothed most gorgeously, a great company with buckler and shield, all of them handling swords:'
    translation: JPS 1917
    original: וְשׁוֹבַבְתִּיךָ וְנָתַתִּי חַחִים בִּלְחָיֶיךָ וְהוֹצֵאתִי אוֹתְךָ וְאֶת־כָּל־חֵילֶךָ סוּסִים וּפָרָשִׁים לְבֻשֵׁי מִכְלוֹל כֻּלָּם קָהָל רָב צִנָּה וּמָגֵן תֹּפְשֵׂי חֲרָבוֹת כֻּלָּם׃
    hebrewPlain: ושובבתיך ונתתי חחים בלחייך והוצאתי אותך ואת כל חילך סוסים ופרשים לבשי מכלול כלם קהל רב צנה ומגן תפשי חרבות כלם
    kjvRefs:
    - Ezekiel 38:4
    kjvOsis:
    - Ezek.38.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.5
    scripture: tanakh
    name: Tanakh Ezekiel 38:5
    ref: Ezekiel 38:5
    book: Ezek
    section: neviim
    chapter: 38
    verse: 5
    ordinal: 13785
    text: Persia, Cush, and Put with them, all of them with shield and helmet;
    translation: JPS 1917
    original: פָּרַס כּוּשׁ וּפוּט אִתָּם כֻּלָּם מָגֵן וְכוֹבָע׃
    hebrewPlain: פרס כוש ופוט אתם כלם מגן וכובע
    kjvRefs:
    - Ezekiel 38:5
    kjvOsis:
    - Ezek.38.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.6
    scripture: tanakh
    name: Tanakh Ezekiel 38:6
    ref: Ezekiel 38:6
    book: Ezek
    section: neviim
    chapter: 38
    verse: 6
    ordinal: 13786
    text: Gomer, and all his bands; the house of Togarmah in the uttermost parts of the north, and all his bands; even many peoples with thee.
    translation: JPS 1917
    original: גֹּמֶר וְכָל־אֲגַפֶּיהָ בֵּית תּוֹגַרְמָה יַרְכְּתֵי צָפוֹן וְאֶת־כָּל־אֲגַפָּיו עַמִּים רַבִּים אִתָּךְ׃
    hebrewPlain: גמר וכל אגפיה בית תוגרמה ירכתי צפון ואת כל אגפיו עמים רבים אתך
    kjvRefs:
    - Ezekiel 38:6
    kjvOsis:
    - Ezek.38.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.7
    scripture: tanakh
    name: Tanakh Ezekiel 38:7
    ref: Ezekiel 38:7
    book: Ezek
    section: neviim
    chapter: 38
    verse: 7
    ordinal: 13787
    text: Be thou prepared, and prepare for thyself, thou, and all thy company that are assembled unto thee, and be thou guarded of them.
    translation: JPS 1917
    original: הִכֹּן וְהָכֵן לְךָ אַתָּה וְכָל־קְהָלֶךָ הַנִּקְהָלִים עָלֶיךָ וְהָיִיתָ לָהֶם לְמִשְׁמָר׃
    hebrewPlain: הכן והכן לך אתה וכל קהלך הנקהלים עליך והיית להם למשמר
    kjvRefs:
    - Ezekiel 38:7
    kjvOsis:
    - Ezek.38.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.8
    scripture: tanakh
    name: Tanakh Ezekiel 38:8
    ref: Ezekiel 38:8
    book: Ezek
    section: neviim
    chapter: 38
    verse: 8
    ordinal: 13788
    text: After many days thou shalt be mustered for service, in the latter years thou shalt come against the land that is brought back from the sword, that is gathered out of many peoples, against the mountains of Israel, which have been a continual waste; but it is brought forth out of the peoples, and they dwell safely all of them.
    translation: JPS 1917
    original: מִיָּמִים רַבִּים תִּפָּקֵד בְּאַחֲרִית הַשָּׁנִים תָּבוֹא אֶל־אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב מְקֻבֶּצֶת מֵעַמִּים רַבִּים עַל הָרֵי יִשְׂרָאֵל אֲשֶׁר־הָיוּ לְחָרְבָּה תָּמִיד וְהִיא מֵעַמִּים הוּצָאָה וְיָשְׁבוּ לָבֶטַח כֻּלָּם׃
    hebrewPlain: מימים רבים תפקד באחרית השנים תבוא אל ארץ משובבת מחרב מקבצת מעמים רבים על הרי ישראל אשר היו לחרבה תמיד והיא מעמים הוצאה וישבו לבטח כלם
    kjvRefs:
    - Ezekiel 38:8
    kjvOsis:
    - Ezek.38.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.9
    scripture: tanakh
    name: Tanakh Ezekiel 38:9
    ref: Ezekiel 38:9
    book: Ezek
    section: neviim
    chapter: 38
    verse: 9
    ordinal: 13789
    text: And thou shalt ascend, thou shalt come like a storm, thou shalt be like a cloud to cover the land, thou, and all thy bands, and many peoples with thee. .
    translation: JPS 1917
    original: וְעָלִיתָ כַּשֹּׁאָה תָבוֹא כֶּעָנָן לְכַסּוֹת הָאָרֶץ תִּהְיֶה אַתָּה וְכָל־אֲגַפֶּיךָ וְעַמִּים רַבִּים אוֹתָךְ׃
    hebrewPlain: ועלית כשאה תבוא כענן לכסות הארץ תהיה אתה וכל אגפיך ועמים רבים אותך
    kjvRefs:
    - Ezekiel 38:9
    kjvOsis:
    - Ezek.38.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.10
    scripture: tanakh
    name: Tanakh Ezekiel 38:10
    ref: Ezekiel 38:10
    book: Ezek
    section: neviim
    chapter: 38
    verse: 10
    ordinal: 13790
    text: 'Thus saith the Lord GOD: It shall come to pass in that day, that things shall come into thy mind, and thou shalt devise an evil device;'
    translation: JPS 1917
    original: כֹּה אָמַר אֲדֹנָי יְהוִה וְהָיָה בַּיּוֹם הַהוּא יַעֲלוּ דְבָרִים עַל־לְבָבֶךָ וְחָשַׁבְתָּ מַחֲשֶׁבֶת רָעָה׃
    hebrewPlain: כה אמר אדני יהוה והיה ביום ההוא יעלו דברים על לבבך וחשבת מחשבת רעה
    kjvRefs:
    - Ezekiel 38:10
    kjvOsis:
    - Ezek.38.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.11
    scripture: tanakh
    name: Tanakh Ezekiel 38:11
    ref: Ezekiel 38:11
    book: Ezek
    section: neviim
    chapter: 38
    verse: 11
    ordinal: 13791
    text: 'and thou shalt say: I will go up against the land of unwalled villages; I will come upon them that are at quiet, that dwell safely, all of them dwelling without walls, and having neither bars nor gates;'
    translation: JPS 1917
    original: וְאָמַרְתָּ אֶעֱלֶה עַל־אֶרֶץ פְּרָזוֹת אָבוֹא הַשֹּׁקְטִים יֹשְׁבֵי לָבֶטַח כֻּלָּם יֹשְׁבִים בְּאֵין חוֹמָה וּבְרִיחַ וּדְלָתַיִם אֵין לָהֶם׃
    hebrewPlain: ואמרת אעלה על ארץ פרזות אבוא השקטים ישבי לבטח כלם ישבים באין חומה ובריח ודלתים אין להם
    kjvRefs:
    - Ezekiel 38:11
    kjvOsis:
    - Ezek.38.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.12
    scripture: tanakh
    name: Tanakh Ezekiel 38:12
    ref: Ezekiel 38:12
    book: Ezek
    section: neviim
    chapter: 38
    verse: 12
    ordinal: 13792
    text: to take the spoil and to take the prey; to turn thy hand against the waste places that are now inhabited, and against the people that are gathered out of the nations, that have gotten cattle and goods, that dwell in the middle of the earth.
    translation: JPS 1917
    original: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז לְהָשִׁיב יָדְךָ עַל־חֳרָבוֹת נוֹשָׁבֹת וְאֶל־עַם מְאֻסָּף מִגּוֹיִם עֹשֶׂה מִקְנֶה וְקִנְיָן יֹשְׁבֵי עַל־טַבּוּר הָאָרֶץ׃
    hebrewPlain: לשלל שלל ולבז בז להשיב ידך על חרבות נושבת ואל עם מאסף מגוים עשה מקנה וקנין ישבי על טבור הארץ
    kjvRefs:
    - Ezekiel 38:12
    kjvOsis:
    - Ezek.38.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.38
- type: TanakhVerse
  data:
    osis: Ezek.38.13
    scripture: tanakh
    name: Tanakh Ezekiel 38:13
    ref: Ezekiel 38:13
    book: Ezek
    section: neviim
    chapter: 38
    verse: 13
    ordinal: 13793
    text: 'Sheba, and Dedan, and the merchants of Tarshish, with all the magnates thereof, shall say unto thee: Comest thou to take the spoil? hast thou assembled thy company to take the prey? to carry away silver and gold, to take away cattle and goods, to take great spoil?'
    translation: JPS 1917
    original: שְׁבָא וּדְדָן וְסֹחֲרֵי תַרְשִׁישׁ וְכָל־כְּפִרֶיהָ יֹאמְרוּ לְךָ הֲלִשְׁלֹל שָׁלָל אַתָּה בָא הֲלָבֹז בַּז הִקְהַלְתָּ קְהָלֶךָ לָשֵׂאת כֶּסֶף וְזָהָב לָקַחַת מִקְנֶה וְקִנְיָן לִשְׁלֹל שָׁלָל גָּדוֹל׃
    hebrewPlain: שבא ודדן וסחרי תרשיש וכל כפריה יאמרו לך הלשלל שלל אתה בא הלבז בז הקהלת קהלך לשאת כסף וזהב לקחת מקנה וקנין לשלל שלל גדול
    kjvRefs:
    - Ezekiel 38:13
    kjvOsis:
    - Ezek.38.13
  relations:
