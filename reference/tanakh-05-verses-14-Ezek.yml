  data:
    osis: Ezek.18.8
    scripture: tanakh
    name: Tanakh Ezekiel 18:8
    ref: Ezekiel 18:8
    book: Ezek
    section: neviim
    chapter: 18
    verse: 8
    ordinal: 13212
    text: he that hath not given forth upon interest, neither hath taken any increase, that hath withdrawn his hand from iniquity, hath executed true justice between man and man,
    translation: JPS 1917
    original: בַּנֶּשֶׁךְ לֹא־יִתֵּן וְתַרְבִּית לֹא יִקָּח מֵעָוֶל יָשִׁיב יָדוֹ מִשְׁפַּט אֱמֶת יַעֲשֶׂה בֵּין אִישׁ לְאִישׁ׃
    hebrewPlain: בנשך לא יתן ותרבית לא יקח מעול ישיב ידו משפט אמת יעשה בין איש לאיש
    kjvRefs:
    - Ezekiel 18:8
    kjvOsis:
    - Ezek.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.18
