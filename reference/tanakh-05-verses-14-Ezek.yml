    translation: JPS 1917
    original: גַּם־אֲנִי נָשָׂאתִי אֶת־יָדִי לָהֶם בַּמִּדְבָּר לְהָפִיץ אֹתָם בַּגּוֹיִם וּלְזָרוֹת אוֹתָם בָּאֲרָצוֹת׃
    hebrewPlain: גם אני נשאתי את ידי להם במדבר להפיץ אתם בגוים ולזרות אותם בארצות
