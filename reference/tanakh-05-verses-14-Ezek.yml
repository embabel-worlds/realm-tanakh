    translation: JPS 1917
    original: חֲמָת בֵּרוֹתָה סִבְרַיִם אֲשֶׁר בֵּין־גְּבוּל דַּמֶּשֶׂק וּבֵין גְּבוּל חֲמָת חָצֵר הַתִּיכוֹן אֲשֶׁר אֶל־גְּבוּל חַוְרָן׃
    hebrewPlain: חמת ברותה סברים אשר בין גבול דמשק ובין גבול חמת חצר התיכון אשר אל גבול חורן
