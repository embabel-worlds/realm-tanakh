    translation: JPS 1917
    original: וָאֹמַר אֶל־בְּנֵיהֶם בַּמִּדְבָּר בְּחוּקֵּי אֲבוֹתֵיכֶם אַל־תֵּלֵכוּ וְאֶת־מִשְׁפְּטֵיהֶם אַל־תִּשְׁמֹרוּ וּבְגִלּוּלֵיהֶם אַל־תִּטַּמָּאוּ׃
    hebrewPlain: ואמר אל בניהם במדבר בחוקי אבותיכם אל תלכו ואת משפטיהם אל תשמרו ובגלוליהם אל תטמאו
