    name: Tanakh Ezekiel 32:20
    ref: Ezekiel 32:20
    book: Ezek
    section: neviim
    chapter: 32
    verse: 20
    ordinal: 13623
    text: They shall fall in the midst of them that are slain by the sword; she is delivered to the sword; draw her down and all her multitudes.
    translation: JPS 1917
    original: בְּתוֹךְ חַלְלֵי־חֶרֶב יִפֹּלוּ חֶרֶב נִתָּנָה מָשְׁכוּ אוֹתָהּ וְכָל־הֲמוֹנֶיהָ׃
