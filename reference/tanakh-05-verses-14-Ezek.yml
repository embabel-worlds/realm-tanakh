    scripture: tanakh
    name: Tanakh Ezekiel 21:22
    ref: Ezekiel 21:22
    book: Ezek
    section: neviim
    chapter: 21
    verse: 22
    ordinal: 13316
    text: I will also smite My hands together, and I will satisfy My fury; I the LORD have spoken it.’
    translation: JPS 1917
    original: וְגַם־אֲנִי אַכֶּה כַפִּי אֶל־כַּפִּי וַהֲנִחֹתִי חֲמָתִי אֲנִי יְהוָה דִּבַּרְתִּי׃
    hebrewPlain: וגם אני אכה כפי אל כפי והנחתי חמתי אני יהוה דברתי
    kjvRefs:
