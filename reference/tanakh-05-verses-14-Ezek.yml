  data:
    osis: Ezek.18.18
    scripture: tanakh
    name: Tanakh Ezekiel 18:18
    ref: Ezekiel 18:18
    book: Ezek
    section: neviim
    chapter: 18
    verse: 18
    ordinal: 13222
    text: As for his father, because he cruelly oppressed, committed robbery on his brother, and did that which is not good among his people, behold, he dieth for his iniquity.
    translation: JPS 1917
    original: אָבִיו כִּי־עָשַׁק עֹשֶׁק גָּזַל גֵּזֶל אָח וַאֲשֶׁר לֹא־טוֹב עָשָׂה בְּתוֹךְ עַמָּיו וְהִנֵּה־מֵת בַּעֲוֺנוֹ׃
    hebrewPlain: אביו כי עשק עשק גזל גזל אח ואשר לא טוב עשה בתוך עמיו והנה מת בעונו
    kjvRefs:
