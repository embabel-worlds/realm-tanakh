  data:
    osis: Ezek.40.42
    scripture: tanakh
    name: Tanakh Ezekiel 40:42
    ref: Ezekiel 40:42
    book: Ezek
    section: neviim
    chapter: 40
    verse: 42
    ordinal: 13874
    text: Moreover there were four tables for the burnt-offering, of hewn stone, a cubit and a half long, and a cubit and a half broad, and one cubit high, whereupon to lay the instruments wherewith the burnt-offering and the sacrifice are slain.
    translation: JPS 1917
    original: וְאַרְבָּעָה שֻׁלְחָנוֹת לָעוֹלָה אַבְנֵי גָזִית אֹרֶךְ אַמָּה אַחַת וָחֵצִי וְרֹחַב אַמָּה אַחַת וָחֵצִי וְגֹבַהּ אַמָּה אֶחָת אֲלֵיהֶם וְיַנִּיחוּ אֶת־הַכֵּלִים אֲשֶׁר יִשְׁחֲטוּ אֶת־הָעוֹלָה בָּם וְהַזָּבַח׃
    hebrewPlain: וארבעה שלחנות לעולה אבני גזית ארך אמה אחת וחצי ורחב אמה אחת וחצי וגבה אמה אחת אליהם ויניחו את הכלים אשר ישחטו את העולה בם והזבח
    kjvRefs:
    - Ezekiel 40:42
    kjvOsis:
    - Ezek.40.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.43
    scripture: tanakh
    name: Tanakh Ezekiel 40:43
    ref: Ezekiel 40:43
    book: Ezek
    section: neviim
    chapter: 40
    verse: 43
    ordinal: 13875
    text: And the slabs, a handbreadth long, were fastened within round about; and upon the tables was to be the flesh of the offering.
    translation: JPS 1917
    original: וְהַשְׁפַתַּיִם טֹפַח אֶחָד מוּכָנִים בַּבַּיִת סָבִיב סָבִיב וְאֶל־הַשֻּׁלְחָנוֹת בְּשַׂר הַקָּרְבָן׃
    hebrewPlain: והשפתים טפח אחד מוכנים בבית סביב סביב ואל השלחנות בשר הקרבן
    kjvRefs:
    - Ezekiel 40:43
    kjvOsis:
    - Ezek.40.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.44
    scripture: tanakh
    name: Tanakh Ezekiel 40:44
    ref: Ezekiel 40:44
    book: Ezek
    section: neviim
    chapter: 40
    verse: 44
    ordinal: 13876
    text: And without the inner gate were chambers for the guard in the inner court, which was at the side of the north gate, and their prospect was toward the south; one at the side of the east gate having the prospect toward the north.
    translation: JPS 1917
    original: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי לִשְׁכוֹת שָׁרִים בֶּחָצֵר הַפְּנִימִי אֲשֶׁר אֶל־כֶּתֶף שַׁעַר הַצָּפוֹן וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם אֶחָד אֶל־כֶּתֶף שַׁעַר הַקָּדִים פְּנֵי דֶּרֶךְ הַצָּפֹן׃
    hebrewPlain: ומחוצה לשער הפנימי לשכות שרים בחצר הפנימי אשר אל כתף שער הצפון ופניהם דרך הדרום אחד אל כתף שער הקדים פני דרך הצפן
    kjvRefs:
    - Ezekiel 40:44
    kjvOsis:
    - Ezek.40.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.45
    scripture: tanakh
    name: Tanakh Ezekiel 40:45
    ref: Ezekiel 40:45
    book: Ezek
    section: neviim
    chapter: 40
    verse: 45
    ordinal: 13877
    text: 'And he said unto me: ‘This chamber, whose prospect is toward the south, is for the priests, the keepers of the charge of the house.'
    translation: JPS 1917
    original: וַיְדַבֵּר אֵלָי זֹה הַלִּשְׁכָּה אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם לַכֹּהֲנִים שֹׁמְרֵי מִשְׁמֶרֶת הַבָּיִת׃
    hebrewPlain: וידבר אלי זה הלשכה אשר פניה דרך הדרום לכהנים שמרי משמרת הבית
    kjvRefs:
    - Ezekiel 40:45
    kjvOsis:
    - Ezek.40.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.46
    scripture: tanakh
    name: Tanakh Ezekiel 40:46
    ref: Ezekiel 40:46
    book: Ezek
    section: neviim
    chapter: 40
    verse: 46
    ordinal: 13878
    text: And the chamber whose prospect is toward the north is for the priests, the keepers of the charge of the altar; these are the sons of Zadok, who from among the sons of Levi come near to the LORD to minister unto Him.’
    translation: JPS 1917
    original: וְהַלִּשְׁכָּה אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן לַכֹּהֲנִים שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ הֵמָּה בְנֵי־צָדוֹק הַקְּרֵבִים מִבְּנֵי־לֵוִי אֶל־יְהוָה לְשָׁרְתוֹ׃
    hebrewPlain: והלשכה אשר פניה דרך הצפון לכהנים שמרי משמרת המזבח המה בני צדוק הקרבים מבני לוי אל יהוה לשרתו
    kjvRefs:
    - Ezekiel 40:46
    kjvOsis:
    - Ezek.40.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezek.40
- type: TanakhVerse
  data:
    osis: Ezek.40.47
    scripture: tanakh
    name: Tanakh Ezekiel 40:47
    ref: Ezekiel 40:47
    book: Ezek
    section: neviim
    chapter: 40
    verse: 47
    ordinal: 13879
    text: And he measured the court, a hundred cubits long, and a hundred cubits broad, foursquare; and the altar was before the house.
    translation: JPS 1917
    original: וַיָּמָד אֶת־הֶחָצֵר אֹרֶךְ מֵאָה אַמָּה וְרֹחַב מֵאָה אַמָּה מְרֻבָּעַת וְהַמִּזְבֵּחַ לִפְנֵי הַבָּיִת׃
    hebrewPlain: וימד את החצר ארך מאה אמה ורחב מאה אמה מרבעת והמזבח לפני הבית
    kjvRefs:
    - Ezekiel 40:47
    kjvOsis:
    - Ezek.40.47
