    name: Tanakh Ezekiel 20:13
    ref: Ezekiel 20:13
    book: Ezek
    section: neviim
    chapter: 20
    verse: 13
    ordinal: 13263
    text: But the house of Israel rebelled against Me in the wilderness; they walked not in My statutes, and they rejected Mine ordinances, which if a man do, he shall live by them, and My sabbaths they greatly profaned; then I said I would pour out My fury upon them in the wilderness, to consume them.
    translation: JPS 1917
    original: וַיַּמְרוּ־בִי בֵית־יִשְׂרָאֵל בַּמִּדְבָּר בְּחֻקּוֹתַי לֹא־הָלָכוּ וְאֶת־מִשְׁפָּטַי מָאָסוּ אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם וְאֶת־שַׁבְּתֹתַי חִלְּלוּ מְאֹד וָאֹמַר לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם בַּמִּדְבָּר לְכַלּוֹתָם׃
    hebrewPlain: וימרו בי בית ישראל במדבר בחקותי לא הלכו ואת משפטי מאסו אשר יעשה אתם האדם וחי בהם ואת שבתתי חללו מאד ואמר לשפך חמתי עליהם במדבר לכלותם
