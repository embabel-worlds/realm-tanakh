- type: TanakhVerse
  data:
    osis: 1Sam.17.4
    scripture: tanakh
    name: Tanakh 1 Samuel 17:4
    ref: 1 Samuel 17:4
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 4
    ordinal: 7532
    text: And there went out a champion from the camp of the Philistines, named Goliath, of Gath, whose height was six cubits and a span.
    translation: JPS 1917
    original: וַיֵּצֵא אִישׁ־הַבֵּנַיִם מִמַּחֲנוֹת פְּלִשְׁתִּים גָּלְיָת שְׁמוֹ מִגַּת גָּבְהוֹ שֵׁשׁ אַמּוֹת וָזָרֶת׃
    hebrewPlain: ויצא איש הבנים ממחנות פלשתים גלית שמו מגת גבהו שש אמות וזרת
    kjvRefs:
    - 1 Samuel 17:4
    kjvOsis:
    - 1Sam.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.5
    scripture: tanakh
    name: Tanakh 1 Samuel 17:5
    ref: 1 Samuel 17:5
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 5
    ordinal: 7533
    text: And he had a helmet of brass upon his head, and he was clad with a coat of mail; and the weight of the coat was five thousand shekels of brass.
    translation: JPS 1917
    original: וְכוֹבַע נְחֹשֶׁת עַל־רֹאשׁוֹ וְשִׁרְיוֹן קַשְׂקַשִּׂים הוּא לָבוּשׁ וּמִשְׁקַל הַשִּׁרְיוֹן חֲמֵשֶׁת־אֲלָפִים שְׁקָלִים נְחֹשֶׁת׃
    hebrewPlain: וכובע נחשת על ראשו ושריון קשקשים הוא לבוש ומשקל השריון חמשת אלפים שקלים נחשת
    kjvRefs:
    - 1 Samuel 17:5
    kjvOsis:
    - 1Sam.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.6
    scripture: tanakh
    name: Tanakh 1 Samuel 17:6
    ref: 1 Samuel 17:6
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 6
    ordinal: 7534
    text: And he had greaves of brass upon his legs, and a javelin of brass between his shoulders.
    translation: JPS 1917
    original: וּמִצְחַת נְחֹשֶׁת עַל־רַגְלָיו וְכִידוֹן נְחֹשֶׁת בֵּין כְּתֵפָיו׃
    hebrewPlain: ומצחת נחשת על רגליו וכידון נחשת בין כתפיו
    kjvRefs:
