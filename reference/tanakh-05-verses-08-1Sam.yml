- type: TanakhVerse
  data:
    osis: 1Sam.1.7
    scripture: tanakh
    name: Tanakh 1 Samuel 1:7
    ref: 1 Samuel 1:7
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 7129
    text: And as he did so year by year, when she went up to the house of the LORD, so she vexed her; therefore she wept, and would not eat.
    translation: JPS 1917
    original: וְכֵן יַעֲשֶׂה שָׁנָה בְשָׁנָה מִדֵּי עֲלֹתָהּ בְּבֵית יְהוָה כֵּן תַּכְעִסֶנָּה וַתִּבְכֶּה וְלֹא תֹאכַל׃
    hebrewPlain: וכן יעשה שנה בשנה מדי עלתה בבית יהוה כן תכעסנה ותבכה ולא תאכל
    kjvRefs:
    - 1 Samuel 1:7
    kjvOsis:
    - 1Sam.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.8
    scripture: tanakh
    name: Tanakh 1 Samuel 1:8
    ref: 1 Samuel 1:8
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 7130
    text: 'And Elkanah her husband said unto her: ‘Hannah, why weepest thou? and why eatest thou not? and why is thy heart grieved? am not I better to thee than ten sons?’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהּ אֶלְקָנָה אִישָׁהּ חַנָּה לָמֶה תִבְכִּי וְלָמֶה לֹא תֹאכְלִי וְלָמֶה יֵרַע לְבָבֵךְ הֲלוֹא אָנֹכִי טוֹב לָךְ מֵעֲשָׂרָה בָּנִים׃
    hebrewPlain: ויאמר לה אלקנה אישה חנה למה תבכי ולמה לא תאכלי ולמה ירע לבבך הלוא אנכי טוב לך מעשרה בנים
    kjvRefs:
    - 1 Samuel 1:8
    kjvOsis:
    - 1Sam.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.9
    scripture: tanakh
    name: Tanakh 1 Samuel 1:9
    ref: 1 Samuel 1:9
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 7131
    text: So Hannah rose up after they had eaten in Shiloh, and after they had drunk—now Eli the priest sat upon his seat by the door-post of the temple of the LORD;
    translation: JPS 1917
    original: וַתָּקָם חַנָּה אַחֲרֵי אָכְלָה בְשִׁלֹה וְאַחֲרֵי שָׁתֹה וְעֵלִי הַכֹּהֵן יֹשֵׁב עַל־הַכִּסֵּא עַל־מְזוּזַת הֵיכַל יְהוָה׃
    hebrewPlain: ותקם חנה אחרי אכלה בשלה ואחרי שתה ועלי הכהן ישב על הכסא על מזוזת היכל יהוה
    kjvRefs:
    - 1 Samuel 1:9
    kjvOsis:
    - 1Sam.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.10
    scripture: tanakh
    name: Tanakh 1 Samuel 1:10
    ref: 1 Samuel 1:10
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 7132
    text: and she was in bitterness of soul—and prayed unto the LORD, and wept sore.
    translation: JPS 1917
    original: וְהִיא מָרַת נָפֶשׁ וַתִּתְפַּלֵּל עַל־יְהוָה וּבָכֹה תִבְכֶּה׃
    hebrewPlain: והיא מרת נפש ותתפלל על יהוה ובכה תבכה
    kjvRefs:
    - 1 Samuel 1:10
    kjvOsis:
    - 1Sam.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.11
    scripture: tanakh
    name: Tanakh 1 Samuel 1:11
    ref: 1 Samuel 1:11
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 7133
    text: 'And she vowed a vow, and said: ‘O LORD of hosts, if Thou wilt indeed look on the affliction of Thy handmaid, and remember me, and not forget Thy handmaid, but wilt give unto Thy handmaid a man-child, then I will give him unto the LORD all the days of his life, and there shall no razor come upon his head.’'
    translation: JPS 1917
    original: וַתִּדֹּר נֶדֶר וַתֹּאמַר יְהוָה צְבָאוֹת אִם־רָאֹה תִרְאֶה בָּעֳנִי אֲמָתֶךָ וּזְכַרְתַּנִי וְלֹא־תִשְׁכַּח אֶת־אֲמָתֶךָ וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים וּנְתַתִּיו לַיהוָה כָּל־יְמֵי חַיָּיו וּמוֹרָה לֹא־יַעֲלֶה עַל־רֹאשׁוֹ׃
    hebrewPlain: ותדר נדר ותאמר יהוה צבאות אם ראה תראה בעני אמתך וזכרתני ולא תשכח את אמתך ונתתה לאמתך זרע אנשים ונתתיו ליהוה כל ימי חייו ומורה לא יעלה על ראשו
    kjvRefs:
    - 1 Samuel 1:11
    kjvOsis:
    - 1Sam.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.12
    scripture: tanakh
    name: Tanakh 1 Samuel 1:12
    ref: 1 Samuel 1:12
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 7134
    text: And it came to pass, as she prayed long before the LORD, that Eli watched her mouth.
    translation: JPS 1917
    original: וְהָיָה כִּי הִרְבְּתָה לְהִתְפַּלֵּל לִפְנֵי יְהוָה וְעֵלִי שֹׁמֵר אֶת־פִּיהָ׃
    hebrewPlain: והיה כי הרבתה להתפלל לפני יהוה ועלי שמר את פיה
    kjvRefs:
    - 1 Samuel 1:12
    kjvOsis:
    - 1Sam.1.12
