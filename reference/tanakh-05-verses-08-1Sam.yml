- type: TanakhVerse
  data:
    osis: 1Sam.1.3
    scripture: tanakh
    name: Tanakh 1 Samuel 1:3
    ref: 1 Samuel 1:3
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 7125
    text: And this man went up out of his city from year to year to worship and to sacrifice unto the LORD of hosts in Shiloh. And the two sons of Eli, Hophni and Phinehas, were there priests unto the LORD.
    translation: JPS 1917
    original: וְעָלָה הָאִישׁ הַהוּא מֵעִירוֹ מִיָּמִים יָמִימָה לְהִשְׁתַּחֲוֺת וְלִזְבֹּחַ לַיהוָה צְבָאוֹת בְּשִׁלֹה וְשָׁם שְׁנֵי בְנֵי־עֵלִי חָפְנִי וּפִנְחָס כֹּהֲנִים לַיהוָה׃
    hebrewPlain: ועלה האיש ההוא מעירו מימים ימימה להשתחות ולזבח ליהוה צבאות בשלה ושם שני בני עלי חפני ופנחס כהנים ליהוה
    kjvRefs:
    - 1 Samuel 1:3
    kjvOsis:
    - 1Sam.1.3
  relations:
