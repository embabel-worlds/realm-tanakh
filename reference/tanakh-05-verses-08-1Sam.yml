  data:
    osis: 1Sam.8.18
    scripture: tanakh
    name: Tanakh 1 Samuel 8:18
    ref: 1 Samuel 8:18
    book: 1Sam
    section: neviim
    chapter: 8
    verse: 18
    ordinal: 7297
    text: And ye shall cry out in that day because of your king whom ye shall have chosen you; and the LORD will not answer you in that day.’
    translation: JPS 1917
    original: וּזְעַקְתֶּם בַּיּוֹם הַהוּא מִלִּפְנֵי מַלְכְּכֶם אֲשֶׁר בְּחַרְתֶּם לָכֶם וְלֹא־יַעֲנֶה יְהוָה אֶתְכֶם בַּיּוֹם הַהוּא׃
    hebrewPlain: וזעקתם ביום ההוא מלפני מלככם אשר בחרתם לכם ולא יענה יהוה אתכם ביום ההוא
    kjvRefs:
