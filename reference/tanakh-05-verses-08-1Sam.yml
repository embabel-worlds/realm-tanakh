    chapter: 1
    verse: 19
    ordinal: 7141
    text: And they rose up in the morning early, and worshipped before the LORD, and returned, and came to their house to Ramah; and Elkanah knew Hannah his wife; and the LORD remembered her.
    translation: JPS 1917
    original: וַיַּשְׁכִּמוּ בַבֹּקֶר וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ וַיִּזְכְּרֶהָ יְהוָה׃
    hebrewPlain: וישכמו בבקר וישתחוו לפני יהוה וישבו ויבאו אל ביתם הרמתה וידע אלקנה את חנה אשתו ויזכרה יהוה
    kjvRefs:
    - 1 Samuel 1:19
    kjvOsis:
    - 1Sam.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.20
    scripture: tanakh
    name: Tanakh 1 Samuel 1:20
    ref: 1 Samuel 1:20
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 20
    ordinal: 7142
    text: 'And it came to pass, when the time was come about, that Hannah conceived, and bore a son; and she called his name Samuel: ‘because I have asked him of the LORD.’'
    translation: JPS 1917
    original: וַיְהִי לִתְקֻפוֹת הַיָּמִים וַתַּהַר חַנָּה וַתֵּלֶד בֵּן וַתִּקְרָא אֶת־שְׁמוֹ שְׁמוּאֵל כִּי מֵיְהוָה שְׁאִלְתִּיו׃
    hebrewPlain: ויהי לתקפות הימים ותהר חנה ותלד בן ותקרא את שמו שמואל כי מיהוה שאלתיו
    kjvRefs:
    - 1 Samuel 1:20
    kjvOsis:
    - 1Sam.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.21
    scripture: tanakh
    name: Tanakh 1 Samuel 1:21
    ref: 1 Samuel 1:21
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 21
    ordinal: 7143
    text: And the man Elkanah, and all his house, went up to offer unto the LORD the yearly sacrifice, and his vow.
    translation: JPS 1917
    original: וַיַּעַל הָאִישׁ אֶלְקָנָה וְכָל־בֵּיתוֹ לִזְבֹּחַ לַיהוָה אֶת־זֶבַח הַיָּמִים וְאֶת־נִדְרוֹ׃
    hebrewPlain: ויעל האיש אלקנה וכל ביתו לזבח ליהוה את זבח הימים ואת נדרו
    kjvRefs:
    - 1 Samuel 1:21
    kjvOsis:
    - 1Sam.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.22
    scripture: tanakh
    name: Tanakh 1 Samuel 1:22
    ref: 1 Samuel 1:22
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 22
    ordinal: 7144
    text: 'But Hannah went not up; for she said unto her husband: ‘Until the child be weaned, when I will bring him, that he may appear before the LORD, and there abide for ever.’'
    translation: JPS 1917
    original: וְחַנָּה לֹא עָלָתָה כִּי־אָמְרָה לְאִישָׁהּ עַד יִגָּמֵל הַנַּעַר וַהֲבִאֹתִיו וְנִרְאָה אֶת־פְּנֵי יְהוָה וְיָשַׁב שָׁם עַד־עוֹלָם׃
    hebrewPlain: וחנה לא עלתה כי אמרה לאישה עד יגמל הנער והבאתיו ונראה את פני יהוה וישב שם עד עולם
    kjvRefs:
    - 1 Samuel 1:22
    kjvOsis:
    - 1Sam.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.23
    scripture: tanakh
    name: Tanakh 1 Samuel 1:23
    ref: 1 Samuel 1:23
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 23
    ordinal: 7145
    text: 'And Elkanah her husband said unto her: ‘Do what seemeth thee good; tarry until thou have weaned him; only the LORD establish His word.’ So the woman tarried and gave her son suck, until she weaned him.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהּ אֶלְקָנָה אִישָׁהּ עֲשִׂי הַטּוֹב בְּעֵינַיִךְ שְׁבִי עַד־גָּמְלֵךְ אֹתוֹ אַךְ יָקֵם יְהוָה אֶת־דְּבָרוֹ וַתֵּשֶׁב הָאִשָּׁה וַתֵּינֶק אֶת־בְּנָהּ עַד־גָּמְלָהּ אֹתוֹ׃
    hebrewPlain: ויאמר לה אלקנה אישה עשי הטוב בעיניך שבי עד גמלך אתו אך יקם יהוה את דברו ותשב האשה ותינק את בנה עד גמלה אתו
    kjvRefs:
    - 1 Samuel 1:23
    kjvOsis:
    - 1Sam.1.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.24
    scripture: tanakh
    name: Tanakh 1 Samuel 1:24
    ref: 1 Samuel 1:24
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 24
    ordinal: 7146
    text: And when she had weaned him, she took him up with her, with three bullocks, and one ephah of meal, and a bottle of wine, and brought him unto the house of the LORD in Shiloh; and the child was young.
    translation: JPS 1917
    original: וַתַּעֲלֵהוּ עִמָּהּ כַּאֲשֶׁר גְּמָלַתּוּ בְּפָרִים שְׁלֹשָׁה וְאֵיפָה אַחַת קֶמַח וְנֵבֶל יַיִן וַתְּבִאֵהוּ בֵית־יְהוָה שִׁלוֹ וְהַנַּעַר נָעַר׃
    hebrewPlain: ותעלהו עמה כאשר גמלתו בפרים שלשה ואיפה אחת קמח ונבל יין ותבאהו בית יהוה שלו והנער נער
    kjvRefs:
    - 1 Samuel 1:24
    kjvOsis:
    - 1Sam.1.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.25
    scripture: tanakh
    name: Tanakh 1 Samuel 1:25
    ref: 1 Samuel 1:25
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 25
    ordinal: 7147
    text: And when the bullock was slain, the child was brought to Eli.
    translation: JPS 1917
    original: וַיִּשְׁחֲטוּ אֶת־הַפָּר וַיָּבִיאוּ אֶת־הַנַּעַר אֶל־עֵלִי׃
    hebrewPlain: וישחטו את הפר ויביאו את הנער אל עלי
    kjvRefs:
    - 1 Samuel 1:25
    kjvOsis:
    - 1Sam.1.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.26
    scripture: tanakh
    name: Tanakh 1 Samuel 1:26
    ref: 1 Samuel 1:26
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 26
    ordinal: 7148
    text: 'And she said: ‘Oh, my lord, as thy soul liveth, my lord, I am the woman that stood by thee here, praying unto the LORD.'
    translation: JPS 1917
    original: וַתֹּאמֶר בִּי אֲדֹנִי חֵי נַפְשְׁךָ אֲדֹנִי אֲנִי הָאִשָּׁה הַנִּצֶּבֶת עִמְּכָה בָּזֶה לְהִתְפַּלֵּל אֶל־יְהוָה׃
    hebrewPlain: ותאמר בי אדני חי נפשך אדני אני האשה הנצבת עמכה בזה להתפלל אל יהוה
    kjvRefs:
    - 1 Samuel 1:26
    kjvOsis:
    - 1Sam.1.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.27
    scripture: tanakh
    name: Tanakh 1 Samuel 1:27
    ref: 1 Samuel 1:27
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 27
    ordinal: 7149
    text: For this child I prayed; and the LORD hath granted me my petition which I asked of Him;
    translation: JPS 1917
    original: אֶל־הַנַּעַר הַזֶּה הִתְפַּלָּלְתִּי וַיִּתֵּן יְהוָה לִי אֶת־שְׁאֵלָתִי אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ׃
    hebrewPlain: אל הנער הזה התפללתי ויתן יהוה לי את שאלתי אשר שאלתי מעמו
    kjvRefs:
    - 1 Samuel 1:27
    kjvOsis:
    - 1Sam.1.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.28
    scripture: tanakh
    name: Tanakh 1 Samuel 1:28
    ref: 1 Samuel 1:28
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 28
    ordinal: 7150
    text: therefore I also have lent him to the LORD; as long as he liveth he is lent to the LORD.’ And he worshipped the LORD there.
    translation: JPS 1917
    original: וְגַם אָנֹכִי הִשְׁאִלְתִּהוּ לַיהוָה כָּל־הַיָּמִים אֲשֶׁר הָיָה הוּא שָׁאוּל לַיהוָה וַיִּשְׁתַּחוּ שָׁם לַיהוָה׃
    hebrewPlain: וגם אנכי השאלתהו ליהוה כל הימים אשר היה הוא שאול ליהוה וישתחו שם ליהוה
    kjvRefs:
    - 1 Samuel 1:28
    kjvOsis:
    - 1Sam.1.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.2.1
    scripture: tanakh
    name: Tanakh 1 Samuel 2:1
    ref: 1 Samuel 2:1
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 7151
    text: 'And Hannah prayed, and said: My heart exulteth in the LORD, My horn is exalted in the LORD; My mouth is enlarged over mine enemies; Because I rejoice in Thy salvation.'
    translation: JPS 1917
    original: וַתִּתְפַּלֵּל חַנָּה וַתֹּאמַר עָלַץ לִבִּי בַּיהוָה רָמָה קַרְנִי בַּיהוָה רָחַב פִּי עַל־אוֹיְבַי כִּי שָׂמַחְתִּי בִּישׁוּעָתֶךָ׃
    hebrewPlain: ותתפלל חנה ותאמר עלץ לבי ביהוה רמה קרני ביהוה רחב פי על אויבי כי שמחתי בישועתך
    kjvRefs:
    - 1 Samuel 2:1
    kjvOsis:
    - 1Sam.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.2
    scripture: tanakh
    name: Tanakh 1 Samuel 2:2
    ref: 1 Samuel 2:2
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 7152
    text: There is none holy as the LORD, For there is none beside Thee; Neither is there any rock like our God.
    translation: JPS 1917
    original: אֵין־קָדוֹשׁ כַּיהוָה כִּי אֵין בִּלְתֶּךָ וְאֵין צוּר כֵּאלֹהֵינוּ׃
    hebrewPlain: אין קדוש כיהוה כי אין בלתך ואין צור כאלהינו
    kjvRefs:
    - 1 Samuel 2:2
    kjvOsis:
    - 1Sam.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.3
    scripture: tanakh
    name: Tanakh 1 Samuel 2:3
    ref: 1 Samuel 2:3
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 7153
    text: Multiply not exceeding proud talk; Let not arrogancy come out of your mouth; For the LORD is a God of knowledge, And by Him actions are weighed.
    translation: JPS 1917
    original: אַל־תַּרְבּוּ תְדַבְּרוּ גְּבֹהָה גְבֹהָה יֵצֵא עָתָק מִפִּיכֶם כִּי אֵל דֵּעוֹת יְהוָה ולא [וְלוֹ] נִתְכְּנוּ עֲלִלוֹת׃
    hebrewPlain: אל תרבו תדברו גבהה גבהה יצא עתק מפיכם כי אל דעות יהוה ולא [ולו] נתכנו עללות
    kjvRefs:
    - 1 Samuel 2:3
    kjvOsis:
    - 1Sam.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.4
    scripture: tanakh
    name: Tanakh 1 Samuel 2:4
    ref: 1 Samuel 2:4
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 7154
    text: The bows of the mighty men are broken, And they that stumbled are girded with strength.
    translation: JPS 1917
    original: קֶשֶׁת גִּבֹּרִים חַתִּים וְנִכְשָׁלִים אָזְרוּ חָיִל׃
    hebrewPlain: קשת גברים חתים ונכשלים אזרו חיל
    kjvRefs:
    - 1 Samuel 2:4
    kjvOsis:
    - 1Sam.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.5
    scripture: tanakh
    name: Tanakh 1 Samuel 2:5
    ref: 1 Samuel 2:5
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 7155
    text: They that were full have hired out themselves for bread; And they that were hungry have ceased; While the barren hath borne seven, She that had many children hath languished.
    translation: JPS 1917
    original: שְׂבֵעִים בַּלֶּחֶם נִשְׂכָּרוּ וּרְעֵבִים חָדֵלּוּ עַד־עֲקָרָה יָלְדָה שִׁבְעָה וְרַבַּת בָּנִים אֻמְלָלָה׃
    hebrewPlain: שבעים בלחם נשכרו ורעבים חדלו עד עקרה ילדה שבעה ורבת בנים אמללה
    kjvRefs:
    - 1 Samuel 2:5
    kjvOsis:
    - 1Sam.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.6
    scripture: tanakh
    name: Tanakh 1 Samuel 2:6
    ref: 1 Samuel 2:6
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 7156
    text: The LORD killeth, and maketh alive; He bringeth down to the grave, and bringeth up.
    translation: JPS 1917
    original: יְהוָה מֵמִית וּמְחַיֶּה מוֹרִיד שְׁאוֹל וַיָּעַל׃
    hebrewPlain: יהוה ממית ומחיה מוריד שאול ויעל
    kjvRefs:
    - 1 Samuel 2:6
    kjvOsis:
    - 1Sam.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.7
    scripture: tanakh
    name: Tanakh 1 Samuel 2:7
    ref: 1 Samuel 2:7
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 7157
    text: The LORD maketh poor, and maketh rich; He bringeth low, He also lifteth up. .
    translation: JPS 1917
    original: יְהוָה מוֹרִישׁ וּמַעֲשִׁיר מַשְׁפִּיל אַף־מְרוֹמֵם׃
    hebrewPlain: יהוה מוריש ומעשיר משפיל אף מרומם
    kjvRefs:
    - 1 Samuel 2:7
    kjvOsis:
    - 1Sam.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.8
    scripture: tanakh
    name: Tanakh 1 Samuel 2:8
    ref: 1 Samuel 2:8
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 7158
    text: He raiseth up the poor out of the dust, He lifteth up the needy from the dung-hill, To make them sit with princes, And inherit the throne of glory; For the pillars of the earth are the LORD’S, And He hath set the world upon them.
    translation: JPS 1917
    original: מֵקִים מֵעָפָר דָּל מֵאַשְׁפֹּת יָרִים אֶבְיוֹן לְהוֹשִׁיב עִם־נְדִיבִים וְכִסֵּא כָבוֹד יַנְחִלֵם כִּי לַיהוָה מְצֻקֵי אֶרֶץ וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל׃
    hebrewPlain: מקים מעפר דל מאשפת ירים אביון להושיב עם נדיבים וכסא כבוד ינחלם כי ליהוה מצקי ארץ וישת עליהם תבל
    kjvRefs:
    - 1 Samuel 2:8
    kjvOsis:
    - 1Sam.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.9
    scripture: tanakh
    name: Tanakh 1 Samuel 2:9
    ref: 1 Samuel 2:9
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 7159
    text: He will keep the feet of His holy ones, But the wicked shall be put to silence in darkness; For not by strength shall man prevail.
    translation: JPS 1917
    original: רַגְלֵי חסידו [חֲסִידָיו] יִשְׁמֹר וּרְשָׁעִים בַּחֹשֶׁךְ יִדָּמּוּ כִּי־לֹא בְכֹחַ יִגְבַּר־אִישׁ׃
    hebrewPlain: רגלי חסידו [חסידיו] ישמר ורשעים בחשך ידמו כי לא בכח יגבר איש
    kjvRefs:
    - 1 Samuel 2:9
    kjvOsis:
    - 1Sam.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.10
    scripture: tanakh
    name: Tanakh 1 Samuel 2:10
    ref: 1 Samuel 2:10
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 7160
    text: They that strive with the LORD shall be broken to pieces; Against them will He thunder in heaven; The LORD will judge the ends of the earth; And He will give strength unto His king, And exalt the horn of His anointed.
    translation: JPS 1917
    original: יְהוָה יֵחַתּוּ מריבו [מְרִיבָיו] עלו [עָלָיו] בַּשָּׁמַיִם יַרְעֵם יְהוָה יָדִין אַפְסֵי־אָרֶץ וְיִתֶּן־עֹז לְמַלְכּוֹ וְיָרֵם קֶרֶן מְשִׁיחוֹ׃
    hebrewPlain: יהוה יחתו מריבו [מריביו] עלו [עליו] בשמים ירעם יהוה ידין אפסי ארץ ויתן עז למלכו וירם קרן משיחו
    kjvRefs:
    - 1 Samuel 2:10
    kjvOsis:
    - 1Sam.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.11
    scripture: tanakh
    name: Tanakh 1 Samuel 2:11
    ref: 1 Samuel 2:11
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 7161
    text: And Elkanah went to Ramah to his house. And the child did minister unto the LORD before Eli the priest.
    translation: JPS 1917
    original: וַיֵּלֶךְ אֶלְקָנָה הָרָמָתָה עַל־בֵּיתוֹ וְהַנַּעַר הָיָה מְשָׁרֵת אֶת־יְהוָה אֶת־פְּנֵי עֵלִי הַכֹּהֵן׃
    hebrewPlain: וילך אלקנה הרמתה על ביתו והנער היה משרת את יהוה את פני עלי הכהן
    kjvRefs:
    - 1 Samuel 2:11
    kjvOsis:
    - 1Sam.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.12
    scripture: tanakh
    name: Tanakh 1 Samuel 2:12
    ref: 1 Samuel 2:12
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 7162
    text: Now the sons of Eli were base men; they knew not the LORD.
    translation: JPS 1917
    original: וּבְנֵי עֵלִי בְּנֵי בְלִיָּעַל לֹא יָדְעוּ אֶת־יְהוָה׃
    hebrewPlain: ובני עלי בני בליעל לא ידעו את יהוה
    kjvRefs:
    - 1 Samuel 2:12
    kjvOsis:
    - 1Sam.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.13
    scripture: tanakh
    name: Tanakh 1 Samuel 2:13
    ref: 1 Samuel 2:13
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 7163
    text: And the custom of the priests with the people was, that, when any man offered sacrifice, the priest’s servant came, while the flesh was in seething, with a flesh-hook of three teeth in his band;
    translation: JPS 1917
    original: וּמִשְׁפַּט הַכֹּהֲנִים אֶת־הָעָם כָּל־אִישׁ זֹבֵחַ זֶבַח וּבָא נַעַר הַכֹּהֵן כְּבַשֵּׁל הַבָּשָׂר וְהַמַּזְלֵג שְׁלֹשׁ־הַשִּׁנַּיִם בְּיָדוֹ׃
    hebrewPlain: ומשפט הכהנים את העם כל איש זבח זבח ובא נער הכהן כבשל הבשר והמזלג שלש השנים בידו
    kjvRefs:
    - 1 Samuel 2:13
    kjvOsis:
    - 1Sam.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.14
    scripture: tanakh
    name: Tanakh 1 Samuel 2:14
    ref: 1 Samuel 2:14
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 7164
    text: and he struck it into the pan, or kettle, or caldron, or pot; all that the flesh-hook brought up the priest took therewith. So they did unto all the Israelites that came thither in Shiloh.
    translation: JPS 1917
    original: וְהִכָּה בַכִּיּוֹר אוֹ בַדּוּד אוֹ בַקַּלַּחַת אוֹ בַפָּרוּר כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג יִקַּח הַכֹּהֵן בּוֹ כָּכָה יַעֲשׂוּ לְכָל־יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה׃
    hebrewPlain: והכה בכיור או בדוד או בקלחת או בפרור כל אשר יעלה המזלג יקח הכהן בו ככה יעשו לכל ישראל הבאים שם בשלה
    kjvRefs:
    - 1 Samuel 2:14
    kjvOsis:
    - 1Sam.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.15
    scripture: tanakh
    name: Tanakh 1 Samuel 2:15
    ref: 1 Samuel 2:15
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 7165
    text: 'Yea, before the fat was made to smoke, the priest’s servant came, and said to the man that sacrificed: ‘Give flesh to roast for the priest; for he will not have sodden flesh of thee, but raw.’'
    translation: JPS 1917
    original: גַּם בְּטֶרֶם יַקְטִרוּן אֶת־הַחֵלֶב וּבָא נַעַר הַכֹּהֵן וְאָמַר לָאִישׁ הַזֹּבֵחַ תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן וְלֹא־יִקַּח מִמְּךָ בָּשָׂר מְבֻשָּׁל כִּי אִם־חָי׃
    hebrewPlain: גם בטרם יקטרון את החלב ובא נער הכהן ואמר לאיש הזבח תנה בשר לצלות לכהן ולא יקח ממך בשר מבשל כי אם חי
    kjvRefs:
    - 1 Samuel 2:15
    kjvOsis:
    - 1Sam.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.16
    scripture: tanakh
    name: Tanakh 1 Samuel 2:16
    ref: 1 Samuel 2:16
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 7166
    text: 'And if the man said unto him: ‘Let the fat be made to smoke first of all, and then take as much as thy soul desireth’; then he would say: ‘Nay, but thou shalt give it me now; and if not, I will take it by force.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו הָאִישׁ קַטֵּר יַקְטִירוּן כַּיּוֹם הַחֵלֶב וְקַח־לְךָ כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ וְאָמַר לו [לֹא] כִּי עַתָּה תִתֵּן וְאִם־לֹא לָקַחְתִּי בְחָזְקָה׃
    hebrewPlain: ויאמר אליו האיש קטר יקטירון כיום החלב וקח לך כאשר תאוה נפשך ואמר לו [לא] כי עתה תתן ואם לא לקחתי בחזקה
    kjvRefs:
    - 1 Samuel 2:16
    kjvOsis:
    - 1Sam.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.17
    scripture: tanakh
    name: Tanakh 1 Samuel 2:17
    ref: 1 Samuel 2:17
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 7167
    text: And the sin of the young men was very great before the LORD; for the men dealt contemptuously with the offering of the LORD.
    translation: JPS 1917
    original: וַתְּהִי חַטַּאת הַנְּעָרִים גְּדוֹלָה מְאֹד אֶת־פְּנֵי יְהוָה כִּי נִאֲצוּ הָאֲנָשִׁים אֵת מִנְחַת יְהוָה׃
    hebrewPlain: ותהי חטאת הנערים גדולה מאד את פני יהוה כי נאצו האנשים את מנחת יהוה
    kjvRefs:
    - 1 Samuel 2:17
    kjvOsis:
    - 1Sam.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.18
    scripture: tanakh
    name: Tanakh 1 Samuel 2:18
    ref: 1 Samuel 2:18
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 7168
    text: But Samuel ministered before the LORD, being a child, girded with a linen ephod.
    translation: JPS 1917
    original: וּשְׁמוּאֵל מְשָׁרֵת אֶת־פְּנֵי יְהוָה נַעַר חָגוּר אֵפוֹד בָּד׃
    hebrewPlain: ושמואל משרת את פני יהוה נער חגור אפוד בד
    kjvRefs:
    - 1 Samuel 2:18
    kjvOsis:
    - 1Sam.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.19
    scripture: tanakh
    name: Tanakh 1 Samuel 2:19
    ref: 1 Samuel 2:19
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 7169
    text: Moreover his mother made him a little robe, and brought it to him from year to year, when she came up with her husband to offer the yearly sacrifice.
    translation: JPS 1917
    original: וּמְעִיל קָטֹן תַּעֲשֶׂה־לּוֹ אִמּוֹ וְהַעַלְתָה לוֹ מִיָּמִים יָמִימָה בַּעֲלוֹתָהּ אֶת־אִישָׁהּ לִזְבֹּחַ אֶת־זֶבַח הַיָּמִים׃
    hebrewPlain: ומעיל קטן תעשה לו אמו והעלתה לו מימים ימימה בעלותה את אישה לזבח את זבח הימים
    kjvRefs:
    - 1 Samuel 2:19
    kjvOsis:
    - 1Sam.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.20
    scripture: tanakh
    name: Tanakh 1 Samuel 2:20
    ref: 1 Samuel 2:20
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 7170
    text: 'And Eli would bless Elkanah and his wife, and say: ‘The LORD give thee seed of this woman for the loan which was lent to the LORD.’ And they would go unto their own home.'
    translation: JPS 1917
    original: וּבֵרַךְ עֵלִי אֶת־אֶלְקָנָה וְאֶת־אִשְׁתּוֹ וְאָמַר יָשֵׂם יְהוָה לְךָ זֶרַע מִן־הָאִשָּׁה הַזֹּאת תַּחַת הַשְּׁאֵלָה אֲשֶׁר שָׁאַל לַיהוָה וְהָלְכוּ לִמְקֹמוֹ׃
    hebrewPlain: וברך עלי את אלקנה ואת אשתו ואמר ישם יהוה לך זרע מן האשה הזאת תחת השאלה אשר שאל ליהוה והלכו למקמו
    kjvRefs:
    - 1 Samuel 2:20
    kjvOsis:
    - 1Sam.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.21
    scripture: tanakh
    name: Tanakh 1 Samuel 2:21
    ref: 1 Samuel 2:21
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 21
    ordinal: 7171
    text: So the LORD remembered Hannah, and she conceived, and bore three sons and two daughters. And the child Samuel grew before the LORD.
    translation: JPS 1917
    original: כִּי־פָקַד יְהוָה אֶת־חַנָּה וַתַּהַר וַתֵּלֶד שְׁלֹשָׁה־בָנִים וּשְׁתֵּי בָנוֹת וַיִּגְדַּל הַנַּעַר שְׁמוּאֵל עִם־יְהוָה׃
    hebrewPlain: כי פקד יהוה את חנה ותהר ותלד שלשה בנים ושתי בנות ויגדל הנער שמואל עם יהוה
    kjvRefs:
    - 1 Samuel 2:21
    kjvOsis:
    - 1Sam.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.22
    scripture: tanakh
    name: Tanakh 1 Samuel 2:22
    ref: 1 Samuel 2:22
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 22
    ordinal: 7172
    text: Now Eli was very old; and he heard all that his sons did unto all Israel, and how that they lay with the women that did service at the door of the tent of meeting.
    translation: JPS 1917
    original: וְעֵלִי זָקֵן מְאֹד וְשָׁמַע אֵת כָּל־אֲשֶׁר יַעֲשׂוּן בָּנָיו לְכָל־יִשְׂרָאֵל וְאֵת אֲשֶׁר־יִשְׁכְּבוּן אֶת־הַנָּשִׁים הַצֹּבְאוֹת פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: ועלי זקן מאד ושמע את כל אשר יעשון בניו לכל ישראל ואת אשר ישכבון את הנשים הצבאות פתח אהל מועד
    kjvRefs:
    - 1 Samuel 2:22
    kjvOsis:
    - 1Sam.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.23
    scripture: tanakh
    name: Tanakh 1 Samuel 2:23
    ref: 1 Samuel 2:23
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 23
    ordinal: 7173
    text: 'And he said unto them: ‘Why do ye such things? for I hear evil reports concerning you from all this people.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה אֲשֶׁר אָנֹכִי שֹׁמֵעַ אֶת־דִּבְרֵיכֶם רָעִים מֵאֵת כָּל־הָעָם אֵלֶּה׃
    hebrewPlain: ויאמר להם למה תעשון כדברים האלה אשר אנכי שמע את דבריכם רעים מאת כל העם אלה
    kjvRefs:
    - 1 Samuel 2:23
    kjvOsis:
    - 1Sam.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.24
    scripture: tanakh
    name: Tanakh 1 Samuel 2:24
    ref: 1 Samuel 2:24
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 24
    ordinal: 7174
    text: Nay, my sons; for it is no good report which I hear the LORD’S people do spread abroad.
    translation: JPS 1917
    original: אַל בָּנָי כִּי לוֹא־טוֹבָה הַשְּׁמֻעָה אֲשֶׁר אָנֹכִי שֹׁמֵעַ מַעֲבִרִים עַם־יְהוָה׃
    hebrewPlain: אל בני כי לוא טובה השמעה אשר אנכי שמע מעברים עם יהוה
    kjvRefs:
    - 1 Samuel 2:24
    kjvOsis:
    - 1Sam.2.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.25
    scripture: tanakh
    name: Tanakh 1 Samuel 2:25
    ref: 1 Samuel 2:25
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 25
    ordinal: 7175
    text: If one man sin against another, God shall judge him; but if a man sin against the LORD, who shall entreat for him?’ But they hearkened not unto the voice of their father, because the LORD would slay them.
    translation: JPS 1917
    original: אִם־יֶחֱטָא אִישׁ לְאִישׁ וּפִלְלוֹ אֱלֹהִים וְאִם לַיהוָה יֶחֱטָא־אִישׁ מִי יִתְפַּלֶּל־לוֹ וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם כִּי־חָפֵץ יְהוָה לַהֲמִיתָם׃
    hebrewPlain: אם יחטא איש לאיש ופללו אלהים ואם ליהוה יחטא איש מי יתפלל לו ולא ישמעו לקול אביהם כי חפץ יהוה להמיתם
    kjvRefs:
    - 1 Samuel 2:25
    kjvOsis:
    - 1Sam.2.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.26
    scripture: tanakh
    name: Tanakh 1 Samuel 2:26
    ref: 1 Samuel 2:26
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 26
    ordinal: 7176
    text: And the child Samuel grew on, and increased in favour both with the LORD, and also with men.
    translation: JPS 1917
    original: וְהַנַּעַר שְׁמוּאֵל הֹלֵךְ וְגָדֵל וָטוֹב גַּם עִם־יְהוָה וְגַם עִם־אֲנָשִׁים׃
    hebrewPlain: והנער שמואל הלך וגדל וטוב גם עם יהוה וגם עם אנשים
    kjvRefs:
    - 1 Samuel 2:26
    kjvOsis:
    - 1Sam.2.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.27
    scripture: tanakh
    name: Tanakh 1 Samuel 2:27
    ref: 1 Samuel 2:27
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 27
    ordinal: 7177
    text: 'And there came a man of God unto Eli, and said unto him: ‘Thus saith the LORD: Did I reveal Myself unto the house of thy father, when they were in Egypt in bondage to Pharaoh’s house?'
    translation: JPS 1917
    original: וַיָּבֹא אִישׁ־אֱלֹהִים אֶל־עֵלִי וַיֹּאמֶר אֵלָיו כֹּה אָמַר יְהוָה הֲנִגְלֹה נִגְלֵיתִי אֶל־בֵּית אָבִיךָ בִּהְיוֹתָם בְּמִצְרַיִם לְבֵית פַּרְעֹה׃
    hebrewPlain: ויבא איש אלהים אל עלי ויאמר אליו כה אמר יהוה הנגלה נגליתי אל בית אביך בהיותם במצרים לבית פרעה
    kjvRefs:
    - 1 Samuel 2:27
    kjvOsis:
    - 1Sam.2.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.28
    scripture: tanakh
    name: Tanakh 1 Samuel 2:28
    ref: 1 Samuel 2:28
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 28
    ordinal: 7178
    text: And did I choose him out of all the tribes of Israel to be My priest, to go up unto Mine altar, to burn incense, to wear an ephod before Me? and did I give unto the house of thy father all the offerings of the children of Israel made by fire?
    translation: JPS 1917
    original: וּבָחֹר אֹתוֹ מִכָּל־שִׁבְטֵי יִשְׂרָאֵל לִי לְכֹהֵן לַעֲלוֹת עַל־מִזְבְּחִי לְהַקְטִיר קְטֹרֶת לָשֵׂאת אֵפוֹד לְפָנָי וָאֶתְּנָה לְבֵית אָבִיךָ אֶת־כָּל־אִשֵּׁי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ובחר אתו מכל שבטי ישראל לי לכהן לעלות על מזבחי להקטיר קטרת לשאת אפוד לפני ואתנה לבית אביך את כל אשי בני ישראל
    kjvRefs:
    - 1 Samuel 2:28
    kjvOsis:
    - 1Sam.2.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.29
    scripture: tanakh
    name: Tanakh 1 Samuel 2:29
    ref: 1 Samuel 2:29
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 29
    ordinal: 7179
    text: Wherefore kick ye at My sacrifice and at Mine offering, which I have commanded in My habitation; and honourest thy sons above Me, to make yourselves fat with the chiefest of all the offerings of Israel My people?
    translation: JPS 1917
    original: לָמָּה תִבְעֲטוּ בְּזִבְחִי וּבְמִנְחָתִי אֲשֶׁר צִוִּיתִי מָעוֹן וַתְּכַבֵּד אֶת־בָּנֶיךָ מִמֶּנִּי לְהַבְרִיאֲכֶם מֵרֵאשִׁית כָּל־מִנְחַת יִשְׂרָאֵל לְעַמִּי׃
    hebrewPlain: למה תבעטו בזבחי ובמנחתי אשר צויתי מעון ותכבד את בניך ממני להבריאכם מראשית כל מנחת ישראל לעמי
    kjvRefs:
    - 1 Samuel 2:29
    kjvOsis:
    - 1Sam.2.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.30
    scripture: tanakh
    name: Tanakh 1 Samuel 2:30
    ref: 1 Samuel 2:30
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 30
    ordinal: 7180
    text: 'Therefore the LORD, the God of Israel, saith: I said indeed that thy house, and the house of thy father, should walk before Me for ever; but now the LORD saith: Be it far from Me: for them that honour Me I will honour, and they that despise Me shall be lightly esteemed.'
    translation: JPS 1917
    original: לָכֵן נְאֻם־יְהוָה אֱלֹהֵי יִשְׂרָאֵל אָמוֹר אָמַרְתִּי בֵּיתְךָ וּבֵית אָבִיךָ יִתְהַלְּכוּ לְפָנַי עַד־עוֹלָם וְעַתָּה נְאֻם־יְהוָה חָלִילָה לִּי כִּי־מְכַבְּדַי אֲכַבֵּד וּבֹזַי יֵקָלּוּ׃
    hebrewPlain: לכן נאם יהוה אלהי ישראל אמור אמרתי ביתך ובית אביך יתהלכו לפני עד עולם ועתה נאם יהוה חלילה לי כי מכבדי אכבד ובזי יקלו
    kjvRefs:
    - 1 Samuel 2:30
    kjvOsis:
    - 1Sam.2.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.31
    scripture: tanakh
    name: Tanakh 1 Samuel 2:31
    ref: 1 Samuel 2:31
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 31
    ordinal: 7181
    text: Behold, the days come, that I will cut off thine arm, and the arm of thy father’s house, that there shall not be an old man in thy house.
    translation: JPS 1917
    original: הִנֵּה יָמִים בָּאִים וְגָדַעְתִּי אֶת־זְרֹעֲךָ וְאֶת־זְרֹעַ בֵּית אָבִיךָ מִהְיוֹת זָקֵן בְּבֵיתֶךָ׃
    hebrewPlain: הנה ימים באים וגדעתי את זרעך ואת זרע בית אביך מהיות זקן בביתך
    kjvRefs:
    - 1 Samuel 2:31
    kjvOsis:
    - 1Sam.2.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.32
    scripture: tanakh
    name: Tanakh 1 Samuel 2:32
    ref: 1 Samuel 2:32
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 32
    ordinal: 7182
    text: And thou shalt behold a rival in My habitation, in all the good which shall be done to Israel; and there shall not be an old man in thy house for ever.
    translation: JPS 1917
    original: וְהִבַּטְתָּ צַר מָעוֹן בְּכֹל אֲשֶׁר־יֵיטִיב אֶת־יִשְׂרָאֵל וְלֹא־יִהְיֶה זָקֵן בְּבֵיתְךָ כָּל־הַיָּמִים׃
    hebrewPlain: והבטת צר מעון בכל אשר ייטיב את ישראל ולא יהיה זקן בביתך כל הימים
    kjvRefs:
    - 1 Samuel 2:32
    kjvOsis:
    - 1Sam.2.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.33
    scripture: tanakh
    name: Tanakh 1 Samuel 2:33
    ref: 1 Samuel 2:33
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 33
    ordinal: 7183
    text: Yet will I not cut off every man of thine from Mine altar, to make thine eyes to fail, and thy heart to languish; and all the increase of thy house shall die young men.
    translation: JPS 1917
    original: וְאִישׁ לֹא־אַכְרִית לְךָ מֵעִם מִזְבְּחִי לְכַלּוֹת אֶת־עֵינֶיךָ וְלַאֲדִיב אֶת־נַפְשֶׁךָ וְכָל־מַרְבִּית בֵּיתְךָ יָמוּתוּ אֲנָשִׁים׃
    hebrewPlain: ואיש לא אכרית לך מעם מזבחי לכלות את עיניך ולאדיב את נפשך וכל מרבית ביתך ימותו אנשים
    kjvRefs:
    - 1 Samuel 2:33
    kjvOsis:
    - 1Sam.2.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.34
    scripture: tanakh
    name: Tanakh 1 Samuel 2:34
    ref: 1 Samuel 2:34
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 34
    ordinal: 7184
    text: 'And this shall be the sign unto thee, that which shall come upon thy two sons, on Hophni and Phinehas: in one day they shall die both of them.'
    translation: JPS 1917
    original: וְזֶה־לְּךָ הָאוֹת אֲשֶׁר יָבֹא אֶל־שְׁנֵי בָנֶיךָ אֶל־חָפְנִי וּפִינְחָס בְּיוֹם אֶחָד יָמוּתוּ שְׁנֵיהֶם׃
    hebrewPlain: וזה לך האות אשר יבא אל שני בניך אל חפני ופינחס ביום אחד ימותו שניהם
    kjvRefs:
    - 1 Samuel 2:34
    kjvOsis:
    - 1Sam.2.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.35
    scripture: tanakh
    name: Tanakh 1 Samuel 2:35
    ref: 1 Samuel 2:35
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 35
    ordinal: 7185
    text: And I will raise Me up a faithful priest, that shall do according to that which is in My heart and in My mind; and I will build him a sure house; and he shall walk before Mine anointed for ever.
    translation: JPS 1917
    original: וַהֲקִימֹתִי לִי כֹּהֵן נֶאֱמָן כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה וּבָנִיתִי לוֹ בַּיִת נֶאֱמָן וְהִתְהַלֵּךְ לִפְנֵי־מְשִׁיחִי כָּל־הַיָּמִים׃
    hebrewPlain: והקימתי לי כהן נאמן כאשר בלבבי ובנפשי יעשה ובניתי לו בית נאמן והתהלך לפני משיחי כל הימים
    kjvRefs:
    - 1 Samuel 2:35
    kjvOsis:
    - 1Sam.2.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.2.36
    scripture: tanakh
    name: Tanakh 1 Samuel 2:36
    ref: 1 Samuel 2:36
    book: 1Sam
    section: neviim
    chapter: 2
    verse: 36
    ordinal: 7186
    text: 'And it shall come to pass, that every one that is left in thy house shall come and bow down to him for a piece of silver and a loaf of bread, and shall say: Put me, I pray thee, into one of the priests’ offices, that I may eat a morsel of bread.’'
    translation: JPS 1917
    original: וְהָיָה כָּל־הַנּוֹתָר בְּבֵיתְךָ יָבוֹא לְהִשְׁתַּחֲוֺת לוֹ לַאֲגוֹרַת כֶּסֶף וְכִכַּר־לָחֶם וְאָמַר סְפָחֵנִי נָא אֶל־אַחַת הַכְּהֻנּוֹת לֶאֱכֹל פַּת־לָחֶם׃
    hebrewPlain: והיה כל הנותר בביתך יבוא להשתחות לו לאגורת כסף וככר לחם ואמר ספחני נא אל אחת הכהנות לאכל פת לחם
    kjvRefs:
    - 1 Samuel 2:36
    kjvOsis:
    - 1Sam.2.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.2
- type: TanakhVerse
  data:
    osis: 1Sam.3.1
    scripture: tanakh
    name: Tanakh 1 Samuel 3:1
    ref: 1 Samuel 3:1
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 7187
    text: And the child Samuel ministered unto the LORD before Eli. And the word of the LORD was precious in those days; there was no frequent vision.
    translation: JPS 1917
    original: וְהַנַּעַר שְׁמוּאֵל מְשָׁרֵת אֶת־יְהוָה לִפְנֵי עֵלִי וּדְבַר־יְהוָה הָיָה יָקָר בַּיָּמִים הָהֵם אֵין חָזוֹן נִפְרָץ׃
    hebrewPlain: והנער שמואל משרת את יהוה לפני עלי ודבר יהוה היה יקר בימים ההם אין חזון נפרץ
    kjvRefs:
    - 1 Samuel 3:1
    kjvOsis:
    - 1Sam.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.2
    scripture: tanakh
    name: Tanakh 1 Samuel 3:2
    ref: 1 Samuel 3:2
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 7188
    text: And it came to pass at that time, when Eli was laid down in his place—now his eyes had begun to wax dim, that he could not see—
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הַהוּא וְעֵלִי שֹׁכֵב בִּמְקֹמוֹ ועינו [וְעֵינָיו] הֵחֵלּוּ כֵהוֹת לֹא יוּכַל לִרְאוֹת׃
    hebrewPlain: ויהי ביום ההוא ועלי שכב במקמו ועינו [ועיניו] החלו כהות לא יוכל לראות
    kjvRefs:
    - 1 Samuel 3:2
    kjvOsis:
    - 1Sam.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.3
    scripture: tanakh
    name: Tanakh 1 Samuel 3:3
    ref: 1 Samuel 3:3
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 7189
    text: and the lamp of God was not yet gone out, and Samuel was laid down to sleep in the temple of the LORD, where the ark of God was,
    translation: JPS 1917
    original: וְנֵר אֱלֹהִים טֶרֶם יִכְבֶּה וּשְׁמוּאֵל שֹׁכֵב בְּהֵיכַל יְהוָה אֲשֶׁר־שָׁם אֲרוֹן אֱלֹהִים׃
    hebrewPlain: ונר אלהים טרם יכבה ושמואל שכב בהיכל יהוה אשר שם ארון אלהים
    kjvRefs:
    - 1 Samuel 3:3
    kjvOsis:
    - 1Sam.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.4
    scripture: tanakh
    name: Tanakh 1 Samuel 3:4
    ref: 1 Samuel 3:4
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 7190
    text: 'that the LORD called Samuel; and he said: ‘Here am I.’ .'
    translation: JPS 1917
    original: וַיִּקְרָא יְהוָה אֶל־שְׁמוּאֵל וַיֹּאמֶר הִנֵּנִי׃
    hebrewPlain: ויקרא יהוה אל שמואל ויאמר הנני
    kjvRefs:
    - 1 Samuel 3:4
    kjvOsis:
    - 1Sam.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.5
    scripture: tanakh
    name: Tanakh 1 Samuel 3:5
    ref: 1 Samuel 3:5
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 7191
    text: 'And he ran unto Eli, and said: ‘Here am I; for thou didst call me.’ And he said: ‘I called not; lie down again.’ And he went and lay down.'
    translation: JPS 1917
    original: וַיָּרָץ אֶל־עֵלִי וַיֹּאמֶר הִנְנִי כִּי־קָרָאתָ לִּי וַיֹּאמֶר לֹא־קָרָאתִי שׁוּב שְׁכָב וַיֵּלֶךְ וַיִּשְׁכָּב׃
    hebrewPlain: וירץ אל עלי ויאמר הנני כי קראת לי ויאמר לא קראתי שוב שכב וילך וישכב
    kjvRefs:
    - 1 Samuel 3:5
    kjvOsis:
    - 1Sam.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.6
    scripture: tanakh
    name: Tanakh 1 Samuel 3:6
    ref: 1 Samuel 3:6
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 7192
    text: 'And the LORD called yet again Samuel. And Samuel arose and went to Eli, and said: ‘Here am I; for thou didst call me.’ And he answered: ‘I called not, my son; lie down again.’'
    translation: JPS 1917
    original: וַיֹּסֶף יְהוָה קְרֹא עוֹד שְׁמוּאֵל וַיָּקָם שְׁמוּאֵל וַיֵּלֶךְ אֶל־עֵלִי וַיֹּאמֶר הִנְנִי כִּי קָרָאתָ לִי וַיֹּאמֶר לֹא־קָרָאתִי בְנִי שׁוּב שְׁכָב׃
    hebrewPlain: ויסף יהוה קרא עוד שמואל ויקם שמואל וילך אל עלי ויאמר הנני כי קראת לי ויאמר לא קראתי בני שוב שכב
    kjvRefs:
    - 1 Samuel 3:6
    kjvOsis:
    - 1Sam.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.7
    scripture: tanakh
    name: Tanakh 1 Samuel 3:7
    ref: 1 Samuel 3:7
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 7193
    text: Now Samuel did not yet know the LORD, neither was the word of the LORD yet revealed unto him.
    translation: JPS 1917
    original: וּשְׁמוּאֵל טֶרֶם יָדַע אֶת־יְהוָה וְטֶרֶם יִגָּלֶה אֵלָיו דְּבַר־יְהוָה׃
    hebrewPlain: ושמואל טרם ידע את יהוה וטרם יגלה אליו דבר יהוה
    kjvRefs:
    - 1 Samuel 3:7
    kjvOsis:
    - 1Sam.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.8
    scripture: tanakh
    name: Tanakh 1 Samuel 3:8
    ref: 1 Samuel 3:8
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 7194
    text: 'And the LORD called Samuel again the third time. And he arose and went to Eli, and said: ‘Here am I; for thou didst call me.’ And Eli perceived that the LORD was calling the child.'
    translation: JPS 1917
    original: וַיֹּסֶף יְהוָה קְרֹא־שְׁמוּאֵל בַּשְּׁלִשִׁית וַיָּקָם וַיֵּלֶךְ אֶל־עֵלִי וַיֹּאמֶר הִנְנִי כִּי קָרָאתָ לִי וַיָּבֶן עֵלִי כִּי יְהוָה קֹרֵא לַנָּעַר׃
    hebrewPlain: ויסף יהוה קרא שמואל בשלשית ויקם וילך אל עלי ויאמר הנני כי קראת לי ויבן עלי כי יהוה קרא לנער
    kjvRefs:
    - 1 Samuel 3:8
    kjvOsis:
    - 1Sam.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.9
    scripture: tanakh
    name: Tanakh 1 Samuel 3:9
    ref: 1 Samuel 3:9
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 7195
    text: 'Therefore Eli said unto Samuel: ‘Go, lie down; and it shall be, if thou be called, that thou shalt say: Speak, LORD; for Thy servant heareth.’ So Samuel went and lay down in his place.'
    translation: JPS 1917
    original: וַיֹּאמֶר עֵלִי לִשְׁמוּאֵל לֵךְ שְׁכָב וְהָיָה אִם־יִקְרָא אֵלֶיךָ וְאָמַרְתָּ דַּבֵּר יְהוָה כִּי שֹׁמֵעַ עַבְדֶּךָ וַיֵּלֶךְ שְׁמוּאֵל וַיִּשְׁכַּב בִּמְקוֹמוֹ׃
    hebrewPlain: ויאמר עלי לשמואל לך שכב והיה אם יקרא אליך ואמרת דבר יהוה כי שמע עבדך וילך שמואל וישכב במקומו
    kjvRefs:
    - 1 Samuel 3:9
    kjvOsis:
    - 1Sam.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.10
    scripture: tanakh
    name: Tanakh 1 Samuel 3:10
    ref: 1 Samuel 3:10
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 7196
    text: 'And the LORD came, and stood, and called as at other times: ‘Samuel, Samuel.’ Then Samuel said: ‘Speak; for Thy servant heareth.’'
    translation: JPS 1917
    original: וַיָּבֹא יְהוָה וַיִּתְיַצַּב וַיִּקְרָא כְפַעַם־בְּפַעַם שְׁמוּאֵל שְׁמוּאֵל וַיֹּאמֶר שְׁמוּאֵל דַּבֵּר כִּי שֹׁמֵעַ עַבְדֶּךָ׃
    hebrewPlain: ויבא יהוה ויתיצב ויקרא כפעם בפעם שמואל שמואל ויאמר שמואל דבר כי שמע עבדך
    kjvRefs:
    - 1 Samuel 3:10
    kjvOsis:
    - 1Sam.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.11
    scripture: tanakh
    name: Tanakh 1 Samuel 3:11
    ref: 1 Samuel 3:11
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 7197
    text: 'And the LORD said to Samuel: ‘Behold, I will do a thing in Israel, at which both the ears of every one that heareth it shall tingle.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־שְׁמוּאֵל הִנֵּה אָנֹכִי עֹשֶׂה דָבָר בְּיִשְׂרָאֵל אֲשֶׁר כָּל־שֹׁמְעוֹ תְּצִלֶּינָה שְׁתֵּי אָזְנָיו׃
    hebrewPlain: ויאמר יהוה אל שמואל הנה אנכי עשה דבר בישראל אשר כל שמעו תצלינה שתי אזניו
    kjvRefs:
    - 1 Samuel 3:11
    kjvOsis:
    - 1Sam.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.12
    scripture: tanakh
    name: Tanakh 1 Samuel 3:12
    ref: 1 Samuel 3:12
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 7198
    text: In that day I will perform against Eli all that I have spoken concerning his house, from the beginning even unto the end.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא אָקִים אֶל־עֵלִי אֵת כָּל־אֲשֶׁר דִּבַּרְתִּי אֶל־בֵּיתוֹ הָחֵל וְכַלֵּה׃
    hebrewPlain: ביום ההוא אקים אל עלי את כל אשר דברתי אל ביתו החל וכלה
    kjvRefs:
    - 1 Samuel 3:12
    kjvOsis:
    - 1Sam.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.13
    scripture: tanakh
    name: Tanakh 1 Samuel 3:13
    ref: 1 Samuel 3:13
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 7199
    text: For I have told him that I will judge his house for ever, for the iniquity, in that he knew that his sons did bring a curse upon themselves, and he rebuked them not.
    translation: JPS 1917
    original: וְהִגַּדְתִּי לוֹ כִּי־שֹׁפֵט אֲנִי אֶת־בֵּיתוֹ עַד־עוֹלָם בַּעֲוֺן אֲשֶׁר־יָדַע כִּי־מְקַלְלִים לָהֶם בָּנָיו וְלֹא כִהָה בָּם׃
    hebrewPlain: והגדתי לו כי שפט אני את ביתו עד עולם בעון אשר ידע כי מקללים להם בניו ולא כהה בם
    kjvRefs:
    - 1 Samuel 3:13
    kjvOsis:
    - 1Sam.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.14
    scripture: tanakh
    name: Tanakh 1 Samuel 3:14
    ref: 1 Samuel 3:14
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 7200
    text: And therefore I have sworn unto the house of Eli, that the iniquity of Eli’s house shall not be expiated with sacrifice nor offering for ever.’
    translation: JPS 1917
    original: וְלָכֵן נִשְׁבַּעְתִּי לְבֵית עֵלִי אִם־יִתְכַּפֵּר עֲוֺן בֵּית־עֵלִי בְּזֶבַח וּבְמִנְחָה עַד־עוֹלָם׃
    hebrewPlain: ולכן נשבעתי לבית עלי אם יתכפר עון בית עלי בזבח ובמנחה עד עולם
    kjvRefs:
    - 1 Samuel 3:14
    kjvOsis:
    - 1Sam.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.15
    scripture: tanakh
    name: Tanakh 1 Samuel 3:15
    ref: 1 Samuel 3:15
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 7201
    text: And Samuel lay until the morning, and opened the doors of the house of the LORD. And Samuel feared to tell Eli the vision.
    translation: JPS 1917
    original: וַיִּשְׁכַּב שְׁמוּאֵל עַד־הַבֹּקֶר וַיִּפְתַּח אֶת־דַּלְתוֹת בֵּית־יְהוָה וּשְׁמוּאֵל יָרֵא מֵהַגִּיד אֶת־הַמַּרְאָה אֶל־עֵלִי׃
    hebrewPlain: וישכב שמואל עד הבקר ויפתח את דלתות בית יהוה ושמואל ירא מהגיד את המראה אל עלי
    kjvRefs:
    - 1 Samuel 3:15
    kjvOsis:
    - 1Sam.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.16
    scripture: tanakh
    name: Tanakh 1 Samuel 3:16
    ref: 1 Samuel 3:16
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 7202
    text: 'Then Eli called Samuel, and said: ‘Samuel, my son.’ And he said: ‘Here am I.’'
    translation: JPS 1917
    original: וַיִּקְרָא עֵלִי אֶת־שְׁמוּאֵל וַיֹּאמֶר שְׁמוּאֵל בְּנִי וַיֹּאמֶר הִנֵּנִי׃
    hebrewPlain: ויקרא עלי את שמואל ויאמר שמואל בני ויאמר הנני
    kjvRefs:
    - 1 Samuel 3:16
    kjvOsis:
    - 1Sam.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.17
    scripture: tanakh
    name: Tanakh 1 Samuel 3:17
    ref: 1 Samuel 3:17
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 7203
    text: 'And he said: ‘What is the thing that He hath spoken unto thee? I pray thee, hide it not from me, God do so to thee, and more also, if thou hide any thing from me of all the things that He spoke unto thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָה הַדָּבָר אֲשֶׁר דִּבֶּר אֵלֶיךָ אַל־נָא תְכַחֵד מִמֶּנִּי כֹּה יַעֲשֶׂה־לְּךָ אֱלֹהִים וְכֹה יוֹסִיף אִם־תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל־הַדָּבָר אֲשֶׁר־דִּבֶּר אֵלֶיךָ׃
    hebrewPlain: ויאמר מה הדבר אשר דבר אליך אל נא תכחד ממני כה יעשה לך אלהים וכה יוסיף אם תכחד ממני דבר מכל הדבר אשר דבר אליך
    kjvRefs:
    - 1 Samuel 3:17
    kjvOsis:
    - 1Sam.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.18
    scripture: tanakh
    name: Tanakh 1 Samuel 3:18
    ref: 1 Samuel 3:18
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 7204
    text: 'And Samuel told him all the words, and hid nothing from him. And he said: ‘It is the LORD; let Him do what seemeth Him good.’'
    translation: JPS 1917
    original: וַיַּגֶּד־לוֹ שְׁמוּאֵל אֶת־כָּל־הַדְּבָרִים וְלֹא כִחֵד מִמֶּנּוּ וַיֹּאמַר יְהוָה הוּא הַטּוֹב בְּעֵינָו יַעֲשֶׂה׃
    hebrewPlain: ויגד לו שמואל את כל הדברים ולא כחד ממנו ויאמר יהוה הוא הטוב בעינו יעשה
    kjvRefs:
    - 1 Samuel 3:18
    kjvOsis:
    - 1Sam.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.19
    scripture: tanakh
    name: Tanakh 1 Samuel 3:19
    ref: 1 Samuel 3:19
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 7205
    text: And Samuel grew, and the LORD was with him, and did let none of his words fall to the ground.
    translation: JPS 1917
    original: וַיִּגְדַּל שְׁמוּאֵל וַיהוָה הָיָה עִמּוֹ וְלֹא־הִפִּיל מִכָּל־דְּבָרָיו אָרְצָה׃
    hebrewPlain: ויגדל שמואל ויהוה היה עמו ולא הפיל מכל דבריו ארצה
    kjvRefs:
    - 1 Samuel 3:19
    kjvOsis:
    - 1Sam.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.20
    scripture: tanakh
    name: Tanakh 1 Samuel 3:20
    ref: 1 Samuel 3:20
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 7206
    text: And all Israel from Dan even to Beer-sheba knew that Samuel was established to be a prophet of the LORD.
    translation: JPS 1917
    original: וַיֵּדַע כָּל־יִשְׂרָאֵל מִדָּן וְעַד־בְּאֵר שָׁבַע כִּי נֶאֱמָן שְׁמוּאֵל לְנָבִיא לַיהוָה׃
    hebrewPlain: וידע כל ישראל מדן ועד באר שבע כי נאמן שמואל לנביא ליהוה
    kjvRefs:
    - 1 Samuel 3:20
    kjvOsis:
    - 1Sam.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.3.21
    scripture: tanakh
    name: Tanakh 1 Samuel 3:21
    ref: 1 Samuel 3:21
    book: 1Sam
    section: neviim
    chapter: 3
    verse: 21
    ordinal: 7207
    text: And the LORD appeared again in Shiloh; for the LORD revealed Himself to Samuel in Shiloh by the word of the LORD.
    translation: JPS 1917
    original: וַיֹּסֶף יְהוָה לְהֵרָאֹה בְשִׁלֹה כִּי־נִגְלָה יְהוָה אֶל־שְׁמוּאֵל בְּשִׁלוֹ בִּדְבַר יְהוָה׃
    hebrewPlain: ויסף יהוה להראה בשלה כי נגלה יהוה אל שמואל בשלו בדבר יהוה
    kjvRefs:
    - 1 Samuel 3:21
    kjvOsis:
    - 1Sam.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.3
- type: TanakhVerse
  data:
    osis: 1Sam.4.1
    scripture: tanakh
    name: Tanakh 1 Samuel 4:1
    ref: 1 Samuel 4:1
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 7208
    text: And the word of Samuel came to all Israel. Now Israel went out against the Philistines to battle, and pitched beside Eben-ezer; and the Philistines pitched in Aphek.
    translation: JPS 1917
    original: וַיְהִי דְבַר־שְׁמוּאֵל לְכָל־יִשְׂרָאֵל וַיֵּצֵא יִשְׂרָאֵל לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה וַיַּחֲנוּ עַל־הָאֶבֶן הָעֵזֶר וּפְלִשְׁתִּים חָנוּ בַאֲפֵק׃
    hebrewPlain: ויהי דבר שמואל לכל ישראל ויצא ישראל לקראת פלשתים למלחמה ויחנו על האבן העזר ופלשתים חנו באפק
    kjvRefs:
    - 1 Samuel 4:1
    kjvOsis:
    - 1Sam.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.2
    scripture: tanakh
    name: Tanakh 1 Samuel 4:2
    ref: 1 Samuel 4:2
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 7209
    text: And the Philistines put themselves in array against Israel; and when the battle was spread, Israel was smitten before the Philistines; and they slew of the army in the field about four thousand men.
    translation: JPS 1917
    original: וַיַּעַרְכוּ פְלִשְׁתִּים לִקְרַאת יִשְׂרָאֵל וַתִּטֹּשׁ הַמִּלְחָמָה וַיִּנָּגֶף יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים וַיַּכּוּ בַמַּעֲרָכָה בַּשָּׂדֶה כְּאַרְבַּעַת אֲלָפִים אִישׁ׃
    hebrewPlain: ויערכו פלשתים לקראת ישראל ותטש המלחמה וינגף ישראל לפני פלשתים ויכו במערכה בשדה כארבעת אלפים איש
    kjvRefs:
    - 1 Samuel 4:2
    kjvOsis:
    - 1Sam.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.3
    scripture: tanakh
    name: Tanakh 1 Samuel 4:3
    ref: 1 Samuel 4:3
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 7210
    text: 'And when the people were come into the camp, the elders of Israel said: ‘Wherefore hath the LORD smitten us to-day before the Philistines? Let us fetch the ark of the covenant of the LORD out of Shiloh unto us, that He may come among us, and save us out of the hand of our enemies.’'
    translation: JPS 1917
    original: וַיָּבֹא הָעָם אֶל־הַמַּחֲנֶה וַיֹּאמְרוּ זִקְנֵי יִשְׂרָאֵל לָמָּה נְגָפָנוּ יְהוָה הַיּוֹם לִפְנֵי פְלִשְׁתִּים נִקְחָה אֵלֵינוּ מִשִּׁלֹה אֶת־אֲרוֹן בְּרִית יְהוָה וְיָבֹא בְקִרְבֵּנוּ וְיֹשִׁעֵנוּ מִכַּף אֹיְבֵינוּ׃
    hebrewPlain: ויבא העם אל המחנה ויאמרו זקני ישראל למה נגפנו יהוה היום לפני פלשתים נקחה אלינו משלה את ארון ברית יהוה ויבא בקרבנו וישענו מכף איבינו
    kjvRefs:
    - 1 Samuel 4:3
    kjvOsis:
    - 1Sam.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.4
    scripture: tanakh
    name: Tanakh 1 Samuel 4:4
    ref: 1 Samuel 4:4
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 7211
    text: So the people sent to Shiloh, and they brought from thence the ark of the covenant of the LORD of hosts, who sitteth upon the cherubim; and the two sons of Eli, Hophni and Phinehas, were there with the ark of the covenant of God.
    translation: JPS 1917
    original: וַיִּשְׁלַח הָעָם שִׁלֹה וַיִּשְׂאוּ מִשָּׁם אֵת אֲרוֹן בְּרִית־יְהוָה צְבָאוֹת יֹשֵׁב הַכְּרֻבִים וְשָׁם שְׁנֵי בְנֵי־עֵלִי עִם־אֲרוֹן בְּרִית הָאֱלֹהִים חָפְנִי וּפִינְחָס׃
    hebrewPlain: וישלח העם שלה וישאו משם את ארון ברית יהוה צבאות ישב הכרבים ושם שני בני עלי עם ארון ברית האלהים חפני ופינחס
    kjvRefs:
    - 1 Samuel 4:4
    kjvOsis:
    - 1Sam.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.5
    scripture: tanakh
    name: Tanakh 1 Samuel 4:5
    ref: 1 Samuel 4:5
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 7212
    text: And when the ark of the covenant of the LORD came into the camp, all Israel shouted with a great shout, so that the earth rang.
    translation: JPS 1917
    original: וַיְהִי כְּבוֹא אֲרוֹן בְּרִית־יְהוָה אֶל־הַמַּחֲנֶה וַיָּרִעוּ כָל־יִשְׂרָאֵל תְּרוּעָה גְדוֹלָה וַתֵּהֹם הָאָרֶץ׃
    hebrewPlain: ויהי כבוא ארון ברית יהוה אל המחנה וירעו כל ישראל תרועה גדולה ותהם הארץ
    kjvRefs:
    - 1 Samuel 4:5
    kjvOsis:
    - 1Sam.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.6
    scripture: tanakh
    name: Tanakh 1 Samuel 4:6
    ref: 1 Samuel 4:6
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 7213
    text: 'And when the Philistines heard the noise of the shout, they said: ‘What meaneth the noise of this great shout in the camp of the Hebrews?’ And they knew that the ark of the LORD was come into the camp.'
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ פְלִשְׁתִּים אֶת־קוֹל הַתְּרוּעָה וַיֹּאמְרוּ מֶה קוֹל הַתְּרוּעָה הַגְּדוֹלָה הַזֹּאת בְּמַחֲנֵה הָעִבְרִים וַיֵּדְעוּ כִּי אֲרוֹן יְהוָה בָּא אֶל־הַמַּחֲנֶה׃
    hebrewPlain: וישמעו פלשתים את קול התרועה ויאמרו מה קול התרועה הגדולה הזאת במחנה העברים וידעו כי ארון יהוה בא אל המחנה
    kjvRefs:
    - 1 Samuel 4:6
    kjvOsis:
    - 1Sam.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.7
    scripture: tanakh
    name: Tanakh 1 Samuel 4:7
    ref: 1 Samuel 4:7
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 7214
    text: 'And the Philistines were afraid, for they said: ‘God is come into the camp.’ And they said: ‘Woe unto us! for there was not such a thing yesterday and the day before.'
    translation: JPS 1917
    original: וַיִּרְאוּ הַפְּלִשְׁתִּים כִּי אָמְרוּ בָּא אֱלֹהִים אֶל־הַמַּחֲנֶה וַיֹּאמְרוּ אוֹי לָנוּ כִּי לֹא הָיְתָה כָּזֹאת אֶתְמוֹל שִׁלְשֹׁם׃
    hebrewPlain: ויראו הפלשתים כי אמרו בא אלהים אל המחנה ויאמרו אוי לנו כי לא היתה כזאת אתמול שלשם
    kjvRefs:
    - 1 Samuel 4:7
    kjvOsis:
    - 1Sam.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.8
    scripture: tanakh
    name: Tanakh 1 Samuel 4:8
    ref: 1 Samuel 4:8
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 7215
    text: Woe unto us! who shall deliver us out of the hand of these mighty gods? these are the gods that smote the Egyptians with all manner of plagues and in the wilderness.
    translation: JPS 1917
    original: אוֹי לָנוּ מִי יַצִּילֵנוּ מִיַּד הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה אֵלֶּה הֵם הָאֱלֹהִים הַמַּכִּים אֶת־מִצְרַיִם בְּכָל־מַכָּה בַּמִּדְבָּר׃
    hebrewPlain: אוי לנו מי יצילנו מיד האלהים האדירים האלה אלה הם האלהים המכים את מצרים בכל מכה במדבר
    kjvRefs:
    - 1 Samuel 4:8
    kjvOsis:
    - 1Sam.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.9
    scripture: tanakh
    name: Tanakh 1 Samuel 4:9
    ref: 1 Samuel 4:9
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 7216
    text: Be strong, and quit yourselves like men, O ye Philistines, that ye be not servants unto the Hebrews, as they have been to you; quit yourselves like men, and fight.’
    translation: JPS 1917
    original: הִתְחַזְּקוּ וִהְיוּ לַאֲנָשִׁים פְּלִשְׁתִּים פֶּן תַּעַבְדוּ לָעִבְרִים כַּאֲשֶׁר עָבְדוּ לָכֶם וִהְיִיתֶם לַאֲנָשִׁים וְנִלְחַמְתֶּם׃
    hebrewPlain: התחזקו והיו לאנשים פלשתים פן תעבדו לעברים כאשר עבדו לכם והייתם לאנשים ונלחמתם
    kjvRefs:
    - 1 Samuel 4:9
    kjvOsis:
    - 1Sam.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.10
    scripture: tanakh
    name: Tanakh 1 Samuel 4:10
    ref: 1 Samuel 4:10
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 7217
    text: And the Philistines fought, and Israel was smitten, and they fled every man to his tent; and there was a very great slaughter; for there fell of Israel thirty thousand footmen.
    translation: JPS 1917
    original: וַיִּלָּחֲמוּ פְלִשְׁתִּים וַיִּנָּגֶף יִשְׂרָאֵל וַיָּנֻסוּ אִישׁ לְאֹהָלָיו וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד וַיִּפֹּל מִיִּשְׂרָאֵל שְׁלֹשִׁים אֶלֶף רַגְלִי׃
    hebrewPlain: וילחמו פלשתים וינגף ישראל וינסו איש לאהליו ותהי המכה גדולה מאד ויפל מישראל שלשים אלף רגלי
    kjvRefs:
    - 1 Samuel 4:10
    kjvOsis:
    - 1Sam.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.11
    scripture: tanakh
    name: Tanakh 1 Samuel 4:11
    ref: 1 Samuel 4:11
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 7218
    text: And the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain.
    translation: JPS 1917
    original: וַאֲרוֹן אֱלֹהִים נִלְקָח וּשְׁנֵי בְנֵי־עֵלִי מֵתוּ חָפְנִי וּפִינְחָס׃
    hebrewPlain: וארון אלהים נלקח ושני בני עלי מתו חפני ופינחס
    kjvRefs:
    - 1 Samuel 4:11
    kjvOsis:
    - 1Sam.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.12
    scripture: tanakh
    name: Tanakh 1 Samuel 4:12
    ref: 1 Samuel 4:12
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 7219
    text: And there ran a man of Benjamin out of the army, and came to Shiloh the same day with his clothes rent, and with earth upon his head.
    translation: JPS 1917
    original: וַיָּרָץ אִישׁ־בִּנְיָמִן מֵהַמַּעֲרָכָה וַיָּבֹא שִׁלֹה בַּיּוֹם הַהוּא וּמַדָּיו קְרֻעִים וַאֲדָמָה עַל־רֹאשׁוֹ׃
    hebrewPlain: וירץ איש בנימן מהמערכה ויבא שלה ביום ההוא ומדיו קרעים ואדמה על ראשו
    kjvRefs:
    - 1 Samuel 4:12
    kjvOsis:
    - 1Sam.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.13
    scripture: tanakh
    name: Tanakh 1 Samuel 4:13
    ref: 1 Samuel 4:13
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 7220
    text: And when he came, lo, Eli sat upon his seat by the wayside watching; for his heart trembled for the ark of God. And when the man came into the city, and told it, all the city cried out.
    translation: JPS 1917
    original: וַיָּבוֹא וְהִנֵּה עֵלִי יֹשֵׁב עַל־הַכִּסֵּא יך [יַד] דֶּרֶךְ מְצַפֶּה כִּי־הָיָה לִבּוֹ חָרֵד עַל אֲרוֹן הָאֱלֹהִים וְהָאִישׁ בָּא לְהַגִּיד בָּעִיר וַתִּזְעַק כָּל־הָעִיר׃
    hebrewPlain: ויבוא והנה עלי ישב על הכסא יך [יד] דרך מצפה כי היה לבו חרד על ארון האלהים והאיש בא להגיד בעיר ותזעק כל העיר
    kjvRefs:
    - 1 Samuel 4:13
    kjvOsis:
    - 1Sam.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.14
    scripture: tanakh
    name: Tanakh 1 Samuel 4:14
    ref: 1 Samuel 4:14
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 7221
    text: 'And when Eli heard the noise of the crying, he said: ‘What meaneth the noise of this tumult?’ And the man made haste, and came and told Eli.'
    translation: JPS 1917
    original: וַיִּשְׁמַע עֵלִי אֶת־קוֹל הַצְּעָקָה וַיֹּאמֶר מֶה קוֹל הֶהָמוֹן הַזֶּה וְהָאִישׁ מִהַר וַיָּבֹא וַיַּגֵּד לְעֵלִי׃
    hebrewPlain: וישמע עלי את קול הצעקה ויאמר מה קול ההמון הזה והאיש מהר ויבא ויגד לעלי
    kjvRefs:
    - 1 Samuel 4:14
    kjvOsis:
    - 1Sam.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.15
    scripture: tanakh
    name: Tanakh 1 Samuel 4:15
    ref: 1 Samuel 4:15
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 7222
    text: Now Eli was ninety and eight years old; and his eyes were set, that he could not see.
    translation: JPS 1917
    original: וְעֵלִי בֶּן־תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה וְעֵינָיו קָמָה וְלֹא יָכוֹל לִרְאוֹת׃
    hebrewPlain: ועלי בן תשעים ושמנה שנה ועיניו קמה ולא יכול לראות
    kjvRefs:
    - 1 Samuel 4:15
    kjvOsis:
    - 1Sam.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.16
    scripture: tanakh
    name: Tanakh 1 Samuel 4:16
    ref: 1 Samuel 4:16
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 7223
    text: 'And the man said unto Eli: ‘I am he that came out of the army, and I fled to-day out of the army.’ And he said: ‘How went the matter, my son?’'
    translation: JPS 1917
    original: וַיֹּאמֶר הָאִישׁ אֶל־עֵלִי אָנֹכִי הַבָּא מִן־הַמַּעֲרָכָה וַאֲנִי מִן־הַמַּעֲרָכָה נַסְתִּי הַיּוֹם וַיֹּאמֶר מֶה־הָיָה הַדָּבָר בְּנִי׃
    hebrewPlain: ויאמר האיש אל עלי אנכי הבא מן המערכה ואני מן המערכה נסתי היום ויאמר מה היה הדבר בני
    kjvRefs:
    - 1 Samuel 4:16
    kjvOsis:
    - 1Sam.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.17
    scripture: tanakh
    name: Tanakh 1 Samuel 4:17
    ref: 1 Samuel 4:17
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 7224
    text: 'And he that brought the tidings answered and said: ‘Israel is fled before the Philistines, and there hath been also a great slaughter among the people, and thy two sons also, Hophni and Phinehas, are dead, and the ark of God is taken.’'
    translation: JPS 1917
    original: וַיַּעַן הַמְבַשֵּׂר וַיֹּאמֶר נָס יִשְׂרָאֵל לִפְנֵי פְלִשְׁתִּים וְגַם מַגֵּפָה גְדוֹלָה הָיְתָה בָעָם וְגַם־שְׁנֵי בָנֶיךָ מֵתוּ חָפְנִי וּפִינְחָס וַאֲרוֹן הָאֱלֹהִים נִלְקָחָה׃
    hebrewPlain: ויען המבשר ויאמר נס ישראל לפני פלשתים וגם מגפה גדולה היתה בעם וגם שני בניך מתו חפני ופינחס וארון האלהים נלקחה
    kjvRefs:
    - 1 Samuel 4:17
    kjvOsis:
    - 1Sam.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.18
    scripture: tanakh
    name: Tanakh 1 Samuel 4:18
    ref: 1 Samuel 4:18
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 18
    ordinal: 7225
    text: And it came to pass, when he made mention of the ark of God, that he fell from off his seat backward by the side of the gate, and his neck broke, and he died; for he was an old man, and heavy. And he had judged Israel forty years.
    translation: JPS 1917
    original: וַיְהִי כְּהַזְכִּירוֹ אֶת־אֲרוֹן הָאֱלֹהִים וַיִּפֹּל מֵעַל־הַכִּסֵּא אֲחֹרַנִּית בְּעַד יַד הַשַּׁעַר וַתִּשָּׁבֵר מַפְרַקְתּוֹ וַיָּמֹת כִּי־זָקֵן הָאִישׁ וְכָבֵד וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל אַרְבָּעִים שָׁנָה׃
    hebrewPlain: ויהי כהזכירו את ארון האלהים ויפל מעל הכסא אחרנית בעד יד השער ותשבר מפרקתו וימת כי זקן האיש וכבד והוא שפט את ישראל ארבעים שנה
    kjvRefs:
    - 1 Samuel 4:18
    kjvOsis:
    - 1Sam.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.19
    scripture: tanakh
    name: Tanakh 1 Samuel 4:19
    ref: 1 Samuel 4:19
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 19
    ordinal: 7226
    text: And his daughter-in-law, Phinehas’ wife, was with child, near to be delivered; and when she heard the tidings that the ark of God was taken, and that her father-in-law and her husband were dead, she bowed herself and brought forth; for her pains came suddenly upon her.
    translation: JPS 1917
    original: וְכַלָּתוֹ אֵשֶׁת־פִּינְחָס הָרָה לָלַת וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה אֶל־הִלָּקַח אֲרוֹן הָאֱלֹהִים וּמֵת חָמִיהָ וְאִישָׁהּ וַתִּכְרַע וַתֵּלֶד כִּי־נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ׃
    hebrewPlain: וכלתו אשת פינחס הרה ללת ותשמע את השמעה אל הלקח ארון האלהים ומת חמיה ואישה ותכרע ותלד כי נהפכו עליה צריה
    kjvRefs:
    - 1 Samuel 4:19
    kjvOsis:
    - 1Sam.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.20
    scripture: tanakh
    name: Tanakh 1 Samuel 4:20
    ref: 1 Samuel 4:20
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 20
    ordinal: 7227
    text: 'And about the time of her death the women that stood by her said unto her: ‘Fear not; for thou hast brought forth a son.’ But she answered not, neither did she regard it.'
    translation: JPS 1917
    original: וּכְעֵת מוּתָהּ וַתְּדַבֵּרְנָה הַנִּצָּבוֹת עָלֶיהָ אַל־תִּירְאִי כִּי בֵן יָלָדְתְּ וְלֹא עָנְתָה וְלֹא־שָׁתָה לִבָּהּ׃
    hebrewPlain: וכעת מותה ותדברנה הנצבות עליה אל תיראי כי בן ילדת ולא ענתה ולא שתה לבה
    kjvRefs:
    - 1 Samuel 4:20
    kjvOsis:
    - 1Sam.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.4
- type: TanakhVerse
  data:
    osis: 1Sam.4.21
    scripture: tanakh
    name: Tanakh 1 Samuel 4:21
    ref: 1 Samuel 4:21
    book: 1Sam
    section: neviim
    chapter: 4
    verse: 21
    ordinal: 7228
    text: 'And she named the child Ichabod, saying: ‘The glory is departed from Israel’; because the ark of God was taken, and because of her father-in-law and her husband.'
    translation: JPS 1917
    original: וַתִּקְרָא לַנַּעַר אִי־כָבוֹד לֵאמֹר גָּלָה כָבוֹד מִיִּשְׂרָאֵל אֶל־הִלָּקַח אֲרוֹן הָאֱלֹהִים וְאֶל־חָמִיהָ וְאִישָׁהּ׃
    hebrewPlain: ותקרא לנער אי כבוד לאמר גלה כבוד מישראל אל הלקח ארון האלהים ואל חמיה ואישה
    kjvRefs:
    - 1 Samuel 4:21
    kjvOsis:
    - 1Sam.4.21
  relations:
