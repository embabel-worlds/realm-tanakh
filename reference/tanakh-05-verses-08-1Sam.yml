    ordinal: 7127
    text: but unto Hannah he gave a double portion; for he loved Hannah, but the LORD had shut up her womb.
    translation: JPS 1917
    original: וּלְחַנָּה יִתֵּן מָנָה אַחַת אַפָּיִם כִּי אֶת־חַנָּה אָהֵב וַיהוָה סָגַר רַחְמָהּ׃
    hebrewPlain: ולחנה יתן מנה אחת אפים כי את חנה אהב ויהוה סגר רחמה
    kjvRefs:
