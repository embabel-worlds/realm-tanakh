    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.13
    scripture: tanakh
    name: Tanakh 1 Samuel 1:13
    ref: 1 Samuel 1:13
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 7135
    text: Now Hannah, she spoke in her heart; only her lips moved, but her voice could not be heard; therefore, Eli thought she had been drunken.
    translation: JPS 1917
    original: וְחַנָּה הִיא מְדַבֶּרֶת עַל־לִבָּהּ רַק שְׂפָתֶיהָ נָּעוֹת וְקוֹלָהּ לֹא יִשָּׁמֵעַ וַיַּחְשְׁבֶהָ עֵלִי לְשִׁכֹּרָה׃
    hebrewPlain: וחנה היא מדברת על לבה רק שפתיה נעות וקולה לא ישמע ויחשבה עלי לשכרה
    kjvRefs:
    - 1 Samuel 1:13
    kjvOsis:
    - 1Sam.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.14
    scripture: tanakh
    name: Tanakh 1 Samuel 1:14
    ref: 1 Samuel 1:14
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 7136
    text: 'And Eli said unto her: ‘How long wilt thou be drunken? put away thy wine from thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ עֵלִי עַד־מָתַי תִּשְׁתַּכָּרִין הָסִירִי אֶת־יֵינֵךְ מֵעָלָיִךְ׃
    hebrewPlain: ויאמר אליה עלי עד מתי תשתכרין הסירי את יינך מעליך
    kjvRefs:
    - 1 Samuel 1:14
    kjvOsis:
    - 1Sam.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.15
    scripture: tanakh
    name: Tanakh 1 Samuel 1:15
    ref: 1 Samuel 1:15
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 7137
    text: 'And Hannah answered and said: ‘No, my lord, I am a woman of a sorrowful spirit; I have drunk neither wine nor strong drink, but I poured out my soul before the LORD.'
    translation: JPS 1917
    original: וַתַּעַן חַנָּה וַתֹּאמֶר לֹא אֲדֹנִי אִשָּׁה קְשַׁת־רוּחַ אָנֹכִי וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי וָאֶשְׁפֹּךְ אֶת־נַפְשִׁי לִפְנֵי יְהוָה׃
    hebrewPlain: ותען חנה ותאמר לא אדני אשה קשת רוח אנכי ויין ושכר לא שתיתי ואשפך את נפשי לפני יהוה
    kjvRefs:
    - 1 Samuel 1:15
    kjvOsis:
    - 1Sam.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.16
    scripture: tanakh
    name: Tanakh 1 Samuel 1:16
    ref: 1 Samuel 1:16
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 7138
    text: 'Count not thy handmaid for a wicked woman: for out of the abundance of my complaint and my vexation have I spoken hitherto.’'
    translation: JPS 1917
    original: אַל־תִּתֵּן אֶת־אֲמָתְךָ לִפְנֵי בַּת־בְּלִיָּעַל כִּי־מֵרֹב שִׂיחִי וְכַעְסִי דִּבַּרְתִּי עַד־הֵנָּה׃
    hebrewPlain: אל תתן את אמתך לפני בת בליעל כי מרב שיחי וכעסי דברתי עד הנה
    kjvRefs:
    - 1 Samuel 1:16
    kjvOsis:
    - 1Sam.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.17
    scripture: tanakh
    name: Tanakh 1 Samuel 1:17
    ref: 1 Samuel 1:17
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 7139
    text: 'Then Eli answered and said: ‘Go in peace, and the God of Israel grant thy petition that thou hast asked of Him.’'
    translation: JPS 1917
    original: וַיַּעַן עֵלִי וַיֹּאמֶר לְכִי לְשָׁלוֹם וֵאלֹהֵי יִשְׂרָאֵל יִתֵּן אֶת־שֵׁלָתֵךְ אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ׃
    hebrewPlain: ויען עלי ויאמר לכי לשלום ואלהי ישראל יתן את שלתך אשר שאלת מעמו
    kjvRefs:
    - 1 Samuel 1:17
    kjvOsis:
    - 1Sam.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
  data:
    osis: 1Sam.1.18
    scripture: tanakh
    name: Tanakh 1 Samuel 1:18
    ref: 1 Samuel 1:18
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 7140
    text: 'And she said: ‘Let thy servant find favour in thy sight.’ So the woman went her way, and did eat, and her countenance was no more sad.'
    translation: JPS 1917
    original: וַתֹּאמֶר תִּמְצָא שִׁפְחָתְךָ חֵן בְּעֵינֶיךָ וַתֵּלֶךְ הָאִשָּׁה לְדַרְכָּהּ וַתֹּאכַל וּפָנֶיהָ לֹא־הָיוּ־לָהּ עוֹד׃
    hebrewPlain: ותאמר תמצא שפחתך חן בעיניך ותלך האשה לדרכה ותאכל ופניה לא היו לה עוד
    kjvRefs:
    - 1 Samuel 1:18
    kjvOsis:
    - 1Sam.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.1
- type: TanakhVerse
