- type: TanakhVerse
  data:
    osis: 1Sam.17.54
    scripture: tanakh
    name: Tanakh 1 Samuel 17:54
    ref: 1 Samuel 17:54
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 54
    ordinal: 7582
    text: And David took the head of the philistine, and brought it to Jerusalem; but he put his armour in his tent.
    translation: JPS 1917
    original: וַיִּקַּח דָּוִד אֶת־רֹאשׁ הַפְּלִשְׁתִּי וַיְבִאֵהוּ יְרוּשָׁלִָם וְאֶת־כֵּלָיו שָׂם בְּאָהֳלוֹ׃
    hebrewPlain: ויקח דוד את ראש הפלשתי ויבאהו ירושלם ואת כליו שם באהלו
    kjvRefs:
    - 1 Samuel 17:54
    kjvOsis:
    - 1Sam.17.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.55
    scripture: tanakh
    name: Tanakh 1 Samuel 17:55
    ref: 1 Samuel 17:55
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 55
    ordinal: 7583
    text: 'And when Saul saw David go forth against the Philistine, he said unto Abner, the captain of the host: ‘Abner, whose son is this youth?’ And Abner said: ‘As thy soul liveth, O king, I cannot tell.’'
    translation: JPS 1917
    original: וְכִרְאוֹת שָׁאוּל אֶת־דָּוִד יֹצֵא לִקְרַאת הַפְּלִשְׁתִּי אָמַר אֶל־אַבְנֵר שַׂר הַצָּבָא בֶּן־מִי־זֶה הַנַּעַר אַבְנֵר וַיֹּאמֶר אַבְנֵר חֵי־נַפְשְׁךָ הַמֶּלֶךְ אִם־יָדָעְתִּי׃
    hebrewPlain: וכראות שאול את דוד יצא לקראת הפלשתי אמר אל אבנר שר הצבא בן מי זה הנער אבנר ויאמר אבנר חי נפשך המלך אם ידעתי
    kjvRefs:
    - 1 Samuel 17:55
    kjvOsis:
    - 1Sam.17.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.56
    scripture: tanakh
    name: Tanakh 1 Samuel 17:56
    ref: 1 Samuel 17:56
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 56
    ordinal: 7584
    text: 'And the king said: ‘Inquire thou whose son the stripling is.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ שְׁאַל אַתָּה בֶּן־מִי־זֶה הָעָלֶם׃
    hebrewPlain: ויאמר המלך שאל אתה בן מי זה העלם
    kjvRefs:
    - 1 Samuel 17:56
    kjvOsis:
    - 1Sam.17.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.57
    scripture: tanakh
    name: Tanakh 1 Samuel 17:57
    ref: 1 Samuel 17:57
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 57
    ordinal: 7585
    text: And as David returned from the slaughter of the Philistine, Abner took him, and brought him before Saul with the head of the Philistine in his hand.
    translation: JPS 1917
    original: וּכְשׁוּב דָּוִד מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי וַיִּקַּח אֹתוֹ אַבְנֵר וַיְבִאֵהוּ לִפְנֵי שָׁאוּל וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ׃
    hebrewPlain: וכשוב דוד מהכות את הפלשתי ויקח אתו אבנר ויבאהו לפני שאול וראש הפלשתי בידו
    kjvRefs:
    - 1 Samuel 17:57
    kjvOsis:
    - 1Sam.17.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.58
    scripture: tanakh
    name: Tanakh 1 Samuel 17:58
    ref: 1 Samuel 17:58
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 58
    ordinal: 7586
    text: 'And Saul said to him: ‘Whose son art thou, thou young man?’ And David answered: ‘I am the son of thy servant Jesse the Beth-lehemite.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו שָׁאוּל בֶּן־מִי אַתָּה הַנָּעַר וַיֹּאמֶר דָּוִד בֶּן־עַבְדְּךָ יִשַׁי בֵּית הַלַּחְמִי׃
    hebrewPlain: ויאמר אליו שאול בן מי אתה הנער ויאמר דוד בן עבדך ישי בית הלחמי
    kjvRefs:
    - 1 Samuel 17:58
    kjvOsis:
    - 1Sam.17.58
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.18.1
    scripture: tanakh
    name: Tanakh 1 Samuel 18:1
    ref: 1 Samuel 18:1
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 1
    ordinal: 7587
    text: And it came to pass, when he had made an end of speaking unto Saul, that the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul.
    translation: JPS 1917
    original: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר אֶל־שָׁאוּל וְנֶפֶשׁ יְהוֹנָתָן נִקְשְׁרָה בְּנֶפֶשׁ דָּוִד ויאהבו [וַיֶּאֱהָבֵהוּ] יְהוֹנָתָן כְּנַפְשׁוֹ׃
    hebrewPlain: ויהי ככלתו לדבר אל שאול ונפש יהונתן נקשרה בנפש דוד ויאהבו [ויאהבהו] יהונתן כנפשו
    kjvRefs:
    - 1 Samuel 18:1
    kjvOsis:
    - 1Sam.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.2
    scripture: tanakh
    name: Tanakh 1 Samuel 18:2
    ref: 1 Samuel 18:2
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 2
    ordinal: 7588
    text: And Saul took him that day, and would let him go no more home to his father’s house.
    translation: JPS 1917
    original: וַיִּקָּחֵהוּ שָׁאוּל בַּיּוֹם הַהוּא וְלֹא נְתָנוֹ לָשׁוּב בֵּית אָבִיו׃
    hebrewPlain: ויקחהו שאול ביום ההוא ולא נתנו לשוב בית אביו
    kjvRefs:
    - 1 Samuel 18:2
    kjvOsis:
    - 1Sam.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.3
    scripture: tanakh
    name: Tanakh 1 Samuel 18:3
    ref: 1 Samuel 18:3
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 3
    ordinal: 7589
    text: Then Jonathan made a covenant with David, because he loved him as his own soul.
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוֹנָתָן וְדָוִד בְּרִית בְּאַהֲבָתוֹ אֹתוֹ כְּנַפְשׁוֹ׃
    hebrewPlain: ויכרת יהונתן ודוד ברית באהבתו אתו כנפשו
    kjvRefs:
    - 1 Samuel 18:3
    kjvOsis:
    - 1Sam.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.4
    scripture: tanakh
    name: Tanakh 1 Samuel 18:4
    ref: 1 Samuel 18:4
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 4
    ordinal: 7590
    text: And Jonathan stripped himself of the robe that was upon him, and gave it to David, and his apparel, even to his sword, and to his bow, and to his girdle.
    translation: JPS 1917
    original: וַיִּתְפַּשֵּׁט יְהוֹנָתָן אֶת־הַמְּעִיל אֲשֶׁר עָלָיו וַיִּתְּנֵהוּ לְדָוִד וּמַדָּיו וְעַד־חַרְבּוֹ וְעַד־קַשְׁתּוֹ וְעַד־חֲגֹרוֹ׃
    hebrewPlain: ויתפשט יהונתן את המעיל אשר עליו ויתנהו לדוד ומדיו ועד חרבו ועד קשתו ועד חגרו
    kjvRefs:
    - 1 Samuel 18:4
    kjvOsis:
    - 1Sam.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.5
    scripture: tanakh
    name: Tanakh 1 Samuel 18:5
    ref: 1 Samuel 18:5
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 5
    ordinal: 7591
    text: And David went out; whithersoever Saul sent him, he had good success; and Saul set him over the men of war; and it was good in the sight of all the people, and also in the sight of Saul’s servants.
    translation: JPS 1917
    original: וַיֵּצֵא דָוִד בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל יַשְׂכִּיל וַיְשִׂמֵהוּ שָׁאוּל עַל אַנְשֵׁי הַמִּלְחָמָה וַיִּיטַב בְּעֵינֵי כָל־הָעָם וְגַם בְּעֵינֵי עַבְדֵי שָׁאוּל׃
    hebrewPlain: ויצא דוד בכל אשר ישלחנו שאול ישכיל וישמהו שאול על אנשי המלחמה וייטב בעיני כל העם וגם בעיני עבדי שאול
    kjvRefs:
    - 1 Samuel 18:5
    kjvOsis:
    - 1Sam.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.6
    scripture: tanakh
    name: Tanakh 1 Samuel 18:6
    ref: 1 Samuel 18:6
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 6
    ordinal: 7592
    text: And it came to pass as they came, when David returned from the slaughter of the Philistine, that the women came out of all the cities of Israel, singing and dancing, to meet king Saul, with timbrels, with joy, and with three-stringed instruments.
    translation: JPS 1917
    original: וַיְהִי בְּבוֹאָם בְּשׁוּב דָּוִד מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי וַתֵּצֶאנָה הַנָּשִׁים מִכָּל־עָרֵי יִשְׂרָאֵל לשור [לָשִׁיר] וְהַמְּחֹלוֹת לִקְרַאת שָׁאוּל הַמֶּלֶךְ בְּתֻפִּים בְּשִׂמְחָה וּבְשָׁלִשִׁים׃
    hebrewPlain: ויהי בבואם בשוב דוד מהכות את הפלשתי ותצאנה הנשים מכל ערי ישראל לשור [לשיר] והמחלות לקראת שאול המלך בתפים בשמחה ובשלשים
    kjvRefs:
    - 1 Samuel 18:6
    kjvOsis:
    - 1Sam.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.7
    scripture: tanakh
    name: Tanakh 1 Samuel 18:7
    ref: 1 Samuel 18:7
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 7
    ordinal: 7593
    text: 'And the women sang one to another in their play, and said: Saul hath slain his thousands, And David his ten thousands.'
    translation: JPS 1917
    original: וַתַּעֲנֶינָה הַנָּשִׁים הַמְשַׂחֲקוֹת וַתֹּאמַרְןָ הִכָּה שָׁאוּל באלפו [בַּאֲלָפָיו] וְדָוִד בְּרִבְבֹתָיו׃
    hebrewPlain: ותענינה הנשים המשחקות ותאמרן הכה שאול באלפו [באלפיו] ודוד ברבבתיו
    kjvRefs:
    - 1 Samuel 18:7
    kjvOsis:
    - 1Sam.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.8
    scripture: tanakh
    name: Tanakh 1 Samuel 18:8
    ref: 1 Samuel 18:8
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 8
    ordinal: 7594
    text: 'And Saul was very wroth, and this saying displeased him; and he said: ‘They have ascribed unto David ten thousands, and to me they have ascribed but thousands; and all he lacketh is the kingdom! ’'
    translation: JPS 1917
    original: וַיִּחַר לְשָׁאוּל מְאֹד וַיֵּרַע בְּעֵינָיו הַדָּבָר הַזֶּה וַיֹּאמֶר נָתְנוּ לְדָוִד רְבָבוֹת וְלִי נָתְנוּ הָאֲלָפִים וְעוֹד לוֹ אַךְ הַמְּלוּכָה׃
    hebrewPlain: ויחר לשאול מאד וירע בעיניו הדבר הזה ויאמר נתנו לדוד רבבות ולי נתנו האלפים ועוד לו אך המלוכה
    kjvRefs:
    - 1 Samuel 18:8
    kjvOsis:
    - 1Sam.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.9
    scripture: tanakh
    name: Tanakh 1 Samuel 18:9
    ref: 1 Samuel 18:9
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 9
    ordinal: 7595
    text: And Saul eyed David from that day and forward.
    translation: JPS 1917
    original: וַיְהִי שָׁאוּל עון [עוֹיֵן] אֶת־דָּוִד מֵהַיּוֹם הַהוּא וָהָלְאָה׃
    hebrewPlain: ויהי שאול עון [עוין] את דוד מהיום ההוא והלאה
    kjvRefs:
    - 1 Samuel 18:9
    kjvOsis:
    - 1Sam.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.10
    scripture: tanakh
    name: Tanakh 1 Samuel 18:10
    ref: 1 Samuel 18:10
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 10
    ordinal: 7596
    text: And it came to pass on the morrow, that an evil spirit from God came mightily upon Saul, and he raved in the midst of the house; and David played with his hand, as he did day by day; and Saul had his spear in his hand.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַתִּצְלַח רוּחַ אֱלֹהִים רָעָה אֶל־שָׁאוּל וַיִּתְנַבֵּא בְתוֹךְ־הַבַּיִת וְדָוִד מְנַגֵּן בְּיָדוֹ כְּיוֹם בְּיוֹם וְהַחֲנִית בְּיַד־שָׁאוּל׃
    hebrewPlain: ויהי ממחרת ותצלח רוח אלהים רעה אל שאול ויתנבא בתוך הבית ודוד מנגן בידו כיום ביום והחנית ביד שאול
    kjvRefs:
    - 1 Samuel 18:10
    kjvOsis:
    - 1Sam.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.11
    scripture: tanakh
    name: Tanakh 1 Samuel 18:11
    ref: 1 Samuel 18:11
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 11
    ordinal: 7597
    text: 'And Saul cast the spear; for he said: ‘I will smite David even to the wall.’ And David stepped aside out of his presence twice.'
    translation: JPS 1917
    original: וַיָּטֶל שָׁאוּל אֶת־הַחֲנִית וַיֹּאמֶר אַכֶּה בְדָוִד וּבַקִּיר וַיִּסֹּב דָּוִד מִפָּנָיו פַּעֲמָיִם׃
    hebrewPlain: ויטל שאול את החנית ויאמר אכה בדוד ובקיר ויסב דוד מפניו פעמים
    kjvRefs:
    - 1 Samuel 18:11
    kjvOsis:
    - 1Sam.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.12
    scripture: tanakh
    name: Tanakh 1 Samuel 18:12
    ref: 1 Samuel 18:12
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 12
    ordinal: 7598
    text: And Saul was afraid of David, because the LORD was with him, and was departed from Saul.
    translation: JPS 1917
    original: וַיִּרָא שָׁאוּל מִלִּפְנֵי דָוִד כִּי־הָיָה יְהוָה עִמּוֹ וּמֵעִם שָׁאוּל סָר׃
    hebrewPlain: וירא שאול מלפני דוד כי היה יהוה עמו ומעם שאול סר
    kjvRefs:
    - 1 Samuel 18:12
    kjvOsis:
    - 1Sam.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.13
    scripture: tanakh
    name: Tanakh 1 Samuel 18:13
    ref: 1 Samuel 18:13
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 13
    ordinal: 7599
    text: Therefore Saul removed him from him, and made him his captain over a thousand; and he went out and came in before the people.
    translation: JPS 1917
    original: וַיְסִרֵהוּ שָׁאוּל מֵעִמּוֹ וַיְשִׂמֵהוּ לוֹ שַׂר־אָלֶף וַיֵּצֵא וַיָּבֹא לִפְנֵי הָעָם׃
    hebrewPlain: ויסרהו שאול מעמו וישמהו לו שר אלף ויצא ויבא לפני העם
    kjvRefs:
    - 1 Samuel 18:13
    kjvOsis:
    - 1Sam.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.14
    scripture: tanakh
    name: Tanakh 1 Samuel 18:14
    ref: 1 Samuel 18:14
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 14
    ordinal: 7600
    text: And David had great success in all his ways; and the LORD was with him.
    translation: JPS 1917
    original: וַיְהִי דָוִד לְכָל־דָּרְכָו מַשְׂכִּיל וַיהוָה עִמּוֹ׃
    hebrewPlain: ויהי דוד לכל דרכו משכיל ויהוה עמו
    kjvRefs:
    - 1 Samuel 18:14
    kjvOsis:
    - 1Sam.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.15
    scripture: tanakh
    name: Tanakh 1 Samuel 18:15
    ref: 1 Samuel 18:15
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 15
    ordinal: 7601
    text: And when Saul saw that he had great success, he stood in awe of him.
    translation: JPS 1917
    original: וַיַּרְא שָׁאוּל אֲשֶׁר־הוּא מַשְׂכִּיל מְאֹד וַיָּגָר מִפָּנָיו׃
    hebrewPlain: וירא שאול אשר הוא משכיל מאד ויגר מפניו
    kjvRefs:
    - 1 Samuel 18:15
    kjvOsis:
    - 1Sam.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.16
    scripture: tanakh
    name: Tanakh 1 Samuel 18:16
    ref: 1 Samuel 18:16
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 16
    ordinal: 7602
    text: But all Israel and Judah loved David; for he went out and came in before them.
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל וִיהוּדָה אֹהֵב אֶת־דָּוִד כִּי־הוּא יוֹצֵא וָבָא לִפְנֵיהֶם׃
    hebrewPlain: וכל ישראל ויהודה אהב את דוד כי הוא יוצא ובא לפניהם
    kjvRefs:
    - 1 Samuel 18:16
    kjvOsis:
    - 1Sam.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.17
    scripture: tanakh
    name: Tanakh 1 Samuel 18:17
    ref: 1 Samuel 18:17
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 17
    ordinal: 7603
    text: 'And Saul said to David: ‘Behold my elder daughter Merab, her will I give thee to wife; only be thou valiant for me, and fight the LORD’S battles.’ For Saul said: ‘Let not my hand be upon him, but let the hand of the Philistines be upon him.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־דָּוִד הִנֵּה בִתִּי הַגְּדוֹלָה מֵרַב אֹתָהּ אֶתֶּן־לְךָ לְאִשָּׁה אַךְ הֱיֵה־לִּי לְבֶן־חַיִל וְהִלָּחֵם מִלְחֲמוֹת יְהוָה וְשָׁאוּל אָמַר אַל־תְּהִי יָדִי בּוֹ וּתְהִי־בוֹ יַד־פְּלִשְׁתִּים׃
    hebrewPlain: ויאמר שאול אל דוד הנה בתי הגדולה מרב אתה אתן לך לאשה אך היה לי לבן חיל והלחם מלחמות יהוה ושאול אמר אל תהי ידי בו ותהי בו יד פלשתים
    kjvRefs:
    - 1 Samuel 18:17
    kjvOsis:
    - 1Sam.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.18
    scripture: tanakh
    name: Tanakh 1 Samuel 18:18
    ref: 1 Samuel 18:18
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 18
    ordinal: 7604
    text: 'And David said unto Saul: ‘Who am I, and what is my life, or my father’s family in Israel, that I should be son-in-law to the king?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל מִי אָנֹכִי וּמִי חַיַּי מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל כִּי־אֶהְיֶה חָתָן לַמֶּלֶךְ׃
    hebrewPlain: ויאמר דוד אל שאול מי אנכי ומי חיי משפחת אבי בישראל כי אהיה חתן למלך
    kjvRefs:
    - 1 Samuel 18:18
    kjvOsis:
    - 1Sam.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.19
    scripture: tanakh
    name: Tanakh 1 Samuel 18:19
    ref: 1 Samuel 18:19
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 19
    ordinal: 7605
    text: But it came to pass at the time when Merab Saul’s daughter should have been given to David, that she was given unto Adriel the Meholathite to wife.
    translation: JPS 1917
    original: וַיְהִי בְּעֵת תֵּת אֶת־מֵרַב בַּת־שָׁאוּל לְדָוִד וְהִיא נִתְּנָה לְעַדְרִיאֵל הַמְּחֹלָתִי לְאִשָּׁה׃
    hebrewPlain: ויהי בעת תת את מרב בת שאול לדוד והיא נתנה לעדריאל המחלתי לאשה
    kjvRefs:
    - 1 Samuel 18:19
    kjvOsis:
    - 1Sam.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.20
    scripture: tanakh
    name: Tanakh 1 Samuel 18:20
    ref: 1 Samuel 18:20
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 20
    ordinal: 7606
    text: And Michal Saul’s daughter loved David; and they told Saul, and the thing pleased him.
    translation: JPS 1917
    original: וַתֶּאֱהַב מִיכַל בַּת־שָׁאוּל אֶת־דָּוִד וַיַּגִּדוּ לְשָׁאוּל וַיִּשַׁר הַדָּבָר בְּעֵינָיו׃
    hebrewPlain: ותאהב מיכל בת שאול את דוד ויגדו לשאול וישר הדבר בעיניו
    kjvRefs:
    - 1 Samuel 18:20
    kjvOsis:
    - 1Sam.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.21
    scripture: tanakh
    name: Tanakh 1 Samuel 18:21
    ref: 1 Samuel 18:21
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 21
    ordinal: 7607
    text: 'And Saul said: ‘I will give him her, that she may be a snare to him, and that the hand of the Philistines may be against him.’ Wherefore Saul said to David: ‘Thou shalt this day be my son-in-law through the one of the twain.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶתְּנֶנָּה לּוֹ וּתְהִי־לוֹ לְמוֹקֵשׁ וּתְהִי־בוֹ יַד־פְּלִשְׁתִּים וַיֹּאמֶר שָׁאוּל אֶל־דָּוִד בִּשְׁתַּיִם תִּתְחַתֵּן בִּי הַיּוֹם׃
    hebrewPlain: ויאמר שאול אתננה לו ותהי לו למוקש ותהי בו יד פלשתים ויאמר שאול אל דוד בשתים תתחתן בי היום
    kjvRefs:
    - 1 Samuel 18:21
    kjvOsis:
    - 1Sam.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.22
    scripture: tanakh
    name: Tanakh 1 Samuel 18:22
    ref: 1 Samuel 18:22
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 22
    ordinal: 7608
    text: 'And Saul commanded his servants: ‘Speak with David secretly, and say: Behold, the king hath delight in thee, and all his servants love thee; now therefore be the king’s son-in-law.’'
    translation: JPS 1917
    original: וַיְצַו שָׁאוּל אֶת־עֲבָדָו דַּבְּרוּ אֶל־דָּוִד בַּלָּט לֵאמֹר הִנֵּה חָפֵץ בְּךָ הַמֶּלֶךְ וְכָל־עֲבָדָיו אֲהֵבוּךָ וְעַתָּה הִתְחַתֵּן בַּמֶּלֶךְ׃
    hebrewPlain: ויצו שאול את עבדו דברו אל דוד בלט לאמר הנה חפץ בך המלך וכל עבדיו אהבוך ועתה התחתן במלך
    kjvRefs:
    - 1 Samuel 18:22
    kjvOsis:
    - 1Sam.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.23
    scripture: tanakh
    name: Tanakh 1 Samuel 18:23
    ref: 1 Samuel 18:23
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 23
    ordinal: 7609
    text: 'And Saul’s servants spoke those words in the ears of David. And David said: ‘Seemeth it to you a light thing to be the king’s son-in-law, seeing that I am a poor man, and lightly esteemed?’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ עַבְדֵי שָׁאוּל בְּאָזְנֵי דָוִד אֶת־הַדְּבָרִים הָאֵלֶּה וַיֹּאמֶר דָּוִד הַנְקַלָּה בְעֵינֵיכֶם הִתְחַתֵּן בַּמֶּלֶךְ וְאָנֹכִי אִישׁ־רָשׁ וְנִקְלֶה׃
    hebrewPlain: וידברו עבדי שאול באזני דוד את הדברים האלה ויאמר דוד הנקלה בעיניכם התחתן במלך ואנכי איש רש ונקלה
    kjvRefs:
    - 1 Samuel 18:23
    kjvOsis:
    - 1Sam.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.24
    scripture: tanakh
    name: Tanakh 1 Samuel 18:24
    ref: 1 Samuel 18:24
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 24
    ordinal: 7610
    text: 'And the servants of Saul told him, saying: ‘On this manner spoke David.’'
    translation: JPS 1917
    original: וַיַּגִּדוּ עַבְדֵי שָׁאוּל לוֹ לֵאמֹר כַּדְּבָרִים הָאֵלֶּה דִּבֶּר דָּוִד׃
    hebrewPlain: ויגדו עבדי שאול לו לאמר כדברים האלה דבר דוד
    kjvRefs:
    - 1 Samuel 18:24
    kjvOsis:
    - 1Sam.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.25
    scripture: tanakh
    name: Tanakh 1 Samuel 18:25
    ref: 1 Samuel 18:25
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 25
    ordinal: 7611
    text: 'And Saul said: ‘Thus shall ye say to David: The king desireth not any dowry, but a hundred foreskins of the Philistines, to be avenged of the king’s enemies.’ For Saul thought to make David fall by the hand of the Philistines.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל כֹּה־תֹאמְרוּ לְדָוִד אֵין־חֵפֶץ לַמֶּלֶךְ בְּמֹהַר כִּי בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ וְשָׁאוּל חָשַׁב לְהַפִּיל אֶת־דָּוִד בְּיַד־פְּלִשְׁתִּים׃
    hebrewPlain: ויאמר שאול כה תאמרו לדוד אין חפץ למלך במהר כי במאה ערלות פלשתים להנקם באיבי המלך ושאול חשב להפיל את דוד ביד פלשתים
    kjvRefs:
    - 1 Samuel 18:25
    kjvOsis:
    - 1Sam.18.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.26
    scripture: tanakh
    name: Tanakh 1 Samuel 18:26
    ref: 1 Samuel 18:26
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 26
    ordinal: 7612
    text: And when his servants told David these words, it pleased David well to be the king’s son-in-law. And the days were not expired;
    translation: JPS 1917
    original: וַיַּגִּדוּ עֲבָדָיו לְדָוִד אֶת־הַדְּבָרִים הָאֵלֶּה וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד לְהִתְחַתֵּן בַּמֶּלֶךְ וְלֹא מָלְאוּ הַיָּמִים׃
    hebrewPlain: ויגדו עבדיו לדוד את הדברים האלה וישר הדבר בעיני דוד להתחתן במלך ולא מלאו הימים
    kjvRefs:
    - 1 Samuel 18:26
    kjvOsis:
    - 1Sam.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.27
    scripture: tanakh
    name: Tanakh 1 Samuel 18:27
    ref: 1 Samuel 18:27
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 27
    ordinal: 7613
    text: and David arose and went, he and his men, and slew of the Philistines two hundred men; and David brought their foreskins, and they gave them in full number to the king, that he might be the king’s son-in-law. And Saul gave him Michal his daughter to wife.
    translation: JPS 1917
    original: וַיָּקָם דָּוִד וַיֵּלֶךְ הוּא וַאֲנָשָׁיו וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ וַיָּבֵא דָוִד אֶת־עָרְלֹתֵיהֶם וַיְמַלְאוּם לַמֶּלֶךְ לְהִתְחַתֵּן בַּמֶּלֶךְ וַיִּתֶּן־לוֹ שָׁאוּל אֶת־מִיכַל בִּתּוֹ לְאִשָּׁה׃
    hebrewPlain: ויקם דוד וילך הוא ואנשיו ויך בפלשתים מאתים איש ויבא דוד את ערלתיהם וימלאום למלך להתחתן במלך ויתן לו שאול את מיכל בתו לאשה
    kjvRefs:
    - 1 Samuel 18:27
    kjvOsis:
    - 1Sam.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.28
    scripture: tanakh
    name: Tanakh 1 Samuel 18:28
    ref: 1 Samuel 18:28
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 28
    ordinal: 7614
    text: And Saul saw and knew that the LORD was with David; and Michal Saul’s daughter loved him.
    translation: JPS 1917
    original: וַיַּרְא שָׁאוּל וַיֵּדַע כִּי יְהוָה עִם־דָּוִד וּמִיכַל בַּת־שָׁאוּל אֲהֵבַתְהוּ׃
    hebrewPlain: וירא שאול וידע כי יהוה עם דוד ומיכל בת שאול אהבתהו
    kjvRefs:
    - 1 Samuel 18:28
    kjvOsis:
    - 1Sam.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.29
    scripture: tanakh
    name: Tanakh 1 Samuel 18:29
    ref: 1 Samuel 18:29
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 29
    ordinal: 7615
    text: And Saul was yet the more afraid of David; and Saul was David’s enemy continually.
    translation: JPS 1917
    original: וַיֹּאסֶף שָׁאוּל לֵרֹא מִפְּנֵי דָוִד עוֹד וַיְהִי שָׁאוּל אֹיֵב אֶת־דָּוִד כָּל־הַיָּמִים׃
    hebrewPlain: ויאסף שאול לרא מפני דוד עוד ויהי שאול איב את דוד כל הימים
    kjvRefs:
    - 1 Samuel 18:29
    kjvOsis:
    - 1Sam.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.18.30
    scripture: tanakh
    name: Tanakh 1 Samuel 18:30
    ref: 1 Samuel 18:30
    book: 1Sam
    section: neviim
    chapter: 18
    verse: 30
    ordinal: 7616
    text: Then the princes of the Philistines went forth; and it came to pass, as often as they went forth, that David prospered more than all the servants of Saul; so that his name was much set by.
    translation: JPS 1917
    original: וַיֵּצְאוּ שָׂרֵי פְלִשְׁתִּים וַיְהִי מִדֵּי צֵאתָם שָׂכַל דָּוִד מִכֹּל עַבְדֵי שָׁאוּל וַיִּיקַר שְׁמוֹ מְאֹד׃
    hebrewPlain: ויצאו שרי פלשתים ויהי מדי צאתם שכל דוד מכל עבדי שאול וייקר שמו מאד
    kjvRefs:
    - 1 Samuel 18:30
    kjvOsis:
    - 1Sam.18.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.18
- type: TanakhVerse
  data:
    osis: 1Sam.19.1
    scripture: tanakh
    name: Tanakh 1 Samuel 19:1
    ref: 1 Samuel 19:1
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 1
    ordinal: 7617
    text: And Saul spoke to Jonathan his son, and to all his servants, that they should slay David; but Jonathan Saul’s son delighted much in David.
    translation: JPS 1917
    original: וַיְדַבֵּר שָׁאוּל אֶל־יוֹנָתָן בְּנוֹ וְאֶל־כָּל־עֲבָדָיו לְהָמִית אֶת־דָּוִד וִיהוֹנָתָן בֶּן־שָׁאוּל חָפֵץ בְּדָוִד מְאֹד׃
    hebrewPlain: וידבר שאול אל יונתן בנו ואל כל עבדיו להמית את דוד ויהונתן בן שאול חפץ בדוד מאד
    kjvRefs:
    - 1 Samuel 19:1
    kjvOsis:
    - 1Sam.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.2
    scripture: tanakh
    name: Tanakh 1 Samuel 19:2
    ref: 1 Samuel 19:2
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 2
    ordinal: 7618
    text: 'And Jonathan told David, saying: ‘Saul my father seeketh to slay thee; now therefore, I pray thee, take heed to thyself in the morning, and abide in a secret place, and hide thyself.'
    translation: JPS 1917
    original: וַיַּגֵּד יְהוֹנָתָן לְדָוִד לֵאמֹר מְבַקֵּשׁ שָׁאוּל אָבִי לַהֲמִיתֶךָ וְעַתָּה הִשָּׁמֶר־נָא בַבֹּקֶר וְיָשַׁבְתָּ בַסֵּתֶר וְנַחְבֵּאתָ׃
    hebrewPlain: ויגד יהונתן לדוד לאמר מבקש שאול אבי להמיתך ועתה השמר נא בבקר וישבת בסתר ונחבאת
    kjvRefs:
    - 1 Samuel 19:2
    kjvOsis:
    - 1Sam.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.3
    scripture: tanakh
    name: Tanakh 1 Samuel 19:3
    ref: 1 Samuel 19:3
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 3
    ordinal: 7619
    text: And I will go out and stand beside my father in the field where thou art, and I will speak with my father of thee; and if I see aught, I will tell thee.’
    translation: JPS 1917
    original: וַאֲנִי אֵצֵא וְעָמַדְתִּי לְיַד־אָבִי בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם וַאֲנִי אֲדַבֵּר בְּךָ אֶל־אָבִי וְרָאִיתִי מָה וְהִגַּדְתִּי לָךְ׃
    hebrewPlain: ואני אצא ועמדתי ליד אבי בשדה אשר אתה שם ואני אדבר בך אל אבי וראיתי מה והגדתי לך
    kjvRefs:
    - 1 Samuel 19:3
    kjvOsis:
    - 1Sam.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.4
    scripture: tanakh
    name: Tanakh 1 Samuel 19:4
    ref: 1 Samuel 19:4
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 4
    ordinal: 7620
    text: 'And Jonathan spoke good of David unto Saul his father, and said unto him: ‘Let not the king sin against his servant, against David; because he hath not sinned against thee, and because his work hath been very good towards thee;'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוֹנָתָן בְּדָוִד טוֹב אֶל־שָׁאוּל אָבִיו וַיֹּאמֶר אֵלָיו אַל־יֶחֱטָא הַמֶּלֶךְ בְּעַבְדּוֹ בְדָוִד כִּי לוֹא חָטָא לָךְ וְכִי מַעֲשָׂיו טוֹב־לְךָ מְאֹד׃
    hebrewPlain: וידבר יהונתן בדוד טוב אל שאול אביו ויאמר אליו אל יחטא המלך בעבדו בדוד כי לוא חטא לך וכי מעשיו טוב לך מאד
    kjvRefs:
    - 1 Samuel 19:4
    kjvOsis:
    - 1Sam.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.5
    scripture: tanakh
    name: Tanakh 1 Samuel 19:5
    ref: 1 Samuel 19:5
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 5
    ordinal: 7621
    text: for he put his life in his hand, and smote the Philistine, and the LORD wrought a great victory for all Israel; thou sawest it, and didst rejoice; wherefore then wilt thou sin against innocent blood, to slay David without a cause?’
    translation: JPS 1917
    original: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ וַיַּךְ אֶת־הַפְּלִשְׁתִּי וַיַּעַשׂ יְהוָה תְּשׁוּעָה גְדוֹלָה לְכָל־יִשְׂרָאֵל רָאִיתָ וַתִּשְׂמָח וְלָמָּה תֶחֱטָא בְּדָם נָקִי לְהָמִית אֶת־דָּוִד חִנָּם׃
    hebrewPlain: וישם את נפשו בכפו ויך את הפלשתי ויעש יהוה תשועה גדולה לכל ישראל ראית ותשמח ולמה תחטא בדם נקי להמית את דוד חנם
    kjvRefs:
    - 1 Samuel 19:5
    kjvOsis:
    - 1Sam.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.6
    scripture: tanakh
    name: Tanakh 1 Samuel 19:6
    ref: 1 Samuel 19:6
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 6
    ordinal: 7622
    text: 'And Saul hearkened unto the voice of Jonathan; and Saul swore: ‘As the LORD liveth, he shall not be put to death.’'
    translation: JPS 1917
    original: וַיִּשְׁמַע שָׁאוּל בְּקוֹל יְהוֹנָתָן וַיִּשָּׁבַע שָׁאוּל חַי־יְהוָה אִם־יוּמָת׃
    hebrewPlain: וישמע שאול בקול יהונתן וישבע שאול חי יהוה אם יומת
    kjvRefs:
    - 1 Samuel 19:6
    kjvOsis:
    - 1Sam.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.7
    scripture: tanakh
    name: Tanakh 1 Samuel 19:7
    ref: 1 Samuel 19:7
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 7
    ordinal: 7623
    text: And Jonathan called David, and Jonathan told him all those things. And Jonathan brought David to Saul, and he was in his presence, as beforetime.
    translation: JPS 1917
    original: וַיִּקְרָא יְהוֹנָתָן לְדָוִד וַיַּגֶּד־לוֹ יְהוֹנָתָן אֵת כָּל־הַדְּבָרִים הָאֵלֶּה וַיָּבֵא יְהוֹנָתָן אֶת־דָּוִד אֶל־שָׁאוּל וַיְהִי לְפָנָיו כְּאֶתְמוֹל שִׁלְשׁוֹם׃
    hebrewPlain: ויקרא יהונתן לדוד ויגד לו יהונתן את כל הדברים האלה ויבא יהונתן את דוד אל שאול ויהי לפניו כאתמול שלשום
    kjvRefs:
    - 1 Samuel 19:7
    kjvOsis:
    - 1Sam.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.8
    scripture: tanakh
    name: Tanakh 1 Samuel 19:8
    ref: 1 Samuel 19:8
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 8
    ordinal: 7624
    text: And there was war again; and David went out, and fought with the Philistines, and slew them with a great slaughter; and they fled before him.
    translation: JPS 1917
    original: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת וַיֵּצֵא דָוִד וַיִּלָּחֶם בַּפְּלִשְׁתִּים וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה וַיָּנֻסוּ מִפָּנָיו׃
    hebrewPlain: ותוסף המלחמה להיות ויצא דוד וילחם בפלשתים ויך בהם מכה גדולה וינסו מפניו
    kjvRefs:
    - 1 Samuel 19:8
    kjvOsis:
    - 1Sam.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.9
    scripture: tanakh
    name: Tanakh 1 Samuel 19:9
    ref: 1 Samuel 19:9
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 9
    ordinal: 7625
    text: And an evil spirit from the LORD was upon Saul, as he sat in his house with his spear in his hand; and David was playing with his hand.
    translation: JPS 1917
    original: וַתְּהִי רוּחַ יְהוָה רָעָה אֶל־שָׁאוּל וְהוּא בְּבֵיתוֹ יוֹשֵׁב וַחֲנִיתוֹ בְּיָדוֹ וְדָוִד מְנַגֵּן בְּיָד׃
    hebrewPlain: ותהי רוח יהוה רעה אל שאול והוא בביתו יושב וחניתו בידו ודוד מנגן ביד
    kjvRefs:
    - 1 Samuel 19:9
    kjvOsis:
    - 1Sam.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.10
    scripture: tanakh
    name: Tanakh 1 Samuel 19:10
    ref: 1 Samuel 19:10
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 10
    ordinal: 7626
    text: And Saul sought to smite David even to the wall with the spear; but he slipped away out of Saul’s presence, and he smote the spear into the wall; and David fled, and escaped that night.
    translation: JPS 1917
    original: וַיְבַקֵּשׁ שָׁאוּל לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר וַיִּפְטַר מִפְּנֵי שָׁאוּל וַיַּךְ אֶת־הַחֲנִית בַּקִּיר וְדָוִד נָס וַיִּמָּלֵט בַּלַּיְלָה הוּא׃
    hebrewPlain: ויבקש שאול להכות בחנית בדוד ובקיר ויפטר מפני שאול ויך את החנית בקיר ודוד נס וימלט בלילה הוא
    kjvRefs:
    - 1 Samuel 19:10
    kjvOsis:
    - 1Sam.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.11
    scripture: tanakh
    name: Tanakh 1 Samuel 19:11
    ref: 1 Samuel 19:11
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 11
    ordinal: 7627
    text: 'And Saul sent messengers unto David’s house, to watch him, and to slay him in the morning; and Michal David’s wife told him, saying: ‘If thou save not thy life to-night, to-morrow thou shalt be slain.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל מַלְאָכִים אֶל־בֵּית דָּוִד לְשָׁמְרוֹ וְלַהֲמִיתוֹ בַּבֹּקֶר וַתַּגֵּד לְדָוִד מִיכַל אִשְׁתּוֹ לֵאמֹר אִם־אֵינְךָ מְמַלֵּט אֶת־נַפְשְׁךָ הַלַּיְלָה מָחָר אַתָּה מוּמָת׃
    hebrewPlain: וישלח שאול מלאכים אל בית דוד לשמרו ולהמיתו בבקר ותגד לדוד מיכל אשתו לאמר אם אינך ממלט את נפשך הלילה מחר אתה מומת
    kjvRefs:
    - 1 Samuel 19:11
    kjvOsis:
    - 1Sam.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.12
    scripture: tanakh
    name: Tanakh 1 Samuel 19:12
    ref: 1 Samuel 19:12
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 12
    ordinal: 7628
    text: So Michal let David down through the window; and he went, and fled, and escaped.
    translation: JPS 1917
    original: וַתֹּרֶד מִיכַל אֶת־דָּוִד בְּעַד הַחַלּוֹן וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט׃
    hebrewPlain: ותרד מיכל את דוד בעד החלון וילך ויברח וימלט
    kjvRefs:
    - 1 Samuel 19:12
    kjvOsis:
    - 1Sam.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.13
    scripture: tanakh
    name: Tanakh 1 Samuel 19:13
    ref: 1 Samuel 19:13
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 13
    ordinal: 7629
    text: And Michal took the teraphim, and laid it in the bed, and put a quilt of goats’ hair at the head thereof, and covered it with a cloth.
    translation: JPS 1917
    original: וַתִּקַּח מִיכַל אֶת־הַתְּרָפִים וַתָּשֶׂם אֶל־הַמִּטָּה וְאֵת כְּבִיר הָעִזִּים שָׂמָה מְרַאֲשֹׁתָיו וַתְּכַס בַּבָּגֶד׃
    hebrewPlain: ותקח מיכל את התרפים ותשם אל המטה ואת כביר העזים שמה מראשתיו ותכס בבגד
    kjvRefs:
    - 1 Samuel 19:13
    kjvOsis:
    - 1Sam.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.14
    scripture: tanakh
    name: Tanakh 1 Samuel 19:14
    ref: 1 Samuel 19:14
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 14
    ordinal: 7630
    text: 'And when Saul sent messengers to take David, she said: ‘He is sick.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל מַלְאָכִים לָקַחַת אֶת־דָּוִד וַתֹּאמֶר חֹלֶה הוּא׃
    hebrewPlain: וישלח שאול מלאכים לקחת את דוד ותאמר חלה הוא
    kjvRefs:
    - 1 Samuel 19:14
    kjvOsis:
    - 1Sam.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.15
    scripture: tanakh
    name: Tanakh 1 Samuel 19:15
    ref: 1 Samuel 19:15
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 15
    ordinal: 7631
    text: 'And Saul sent the messengers to see David, saying: ‘Bring him up to me in the bed, that I may slay him.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל אֶת־הַמַּלְאָכִים לִרְאוֹת אֶת־דָּוִד לֵאמֹר הַעֲלוּ אֹתוֹ בַמִּטָּה אֵלַי לַהֲמִתוֹ׃
    hebrewPlain: וישלח שאול את המלאכים לראות את דוד לאמר העלו אתו במטה אלי להמתו
    kjvRefs:
    - 1 Samuel 19:15
    kjvOsis:
    - 1Sam.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.16
    scripture: tanakh
    name: Tanakh 1 Samuel 19:16
    ref: 1 Samuel 19:16
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 16
    ordinal: 7632
    text: And when the messengers came in, behold, the teraphim was in the bed, with the quilt of goats’ hair at the head thereof.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַמַּלְאָכִים וְהִנֵּה הַתְּרָפִים אֶל־הַמִּטָּה וּכְבִיר הָעִזִּים מְרַאֲשֹׁתָיו׃
    hebrewPlain: ויבאו המלאכים והנה התרפים אל המטה וכביר העזים מראשתיו
    kjvRefs:
    - 1 Samuel 19:16
    kjvOsis:
    - 1Sam.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.17
    scripture: tanakh
    name: Tanakh 1 Samuel 19:17
    ref: 1 Samuel 19:17
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 17
    ordinal: 7633
    text: 'And Saul said unto Michal: ‘Why hast thou deceived me thus, and let mine enemy go, that he is escaped?’ And Michal answered Saul: ‘He said unto me: Let me go; why should I kill thee?’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־מִיכַל לָמָּה כָּכָה רִמִּיתִנִי וַתְּשַׁלְּחִי אֶת־אֹיְבִי וַיִּמָּלֵט וַתֹּאמֶר מִיכַל אֶל־שָׁאוּל הוּא־אָמַר אֵלַי שַׁלְּחִנִי לָמָה אֲמִיתֵךְ׃
    hebrewPlain: ויאמר שאול אל מיכל למה ככה רמיתני ותשלחי את איבי וימלט ותאמר מיכל אל שאול הוא אמר אלי שלחני למה אמיתך
    kjvRefs:
    - 1 Samuel 19:17
    kjvOsis:
    - 1Sam.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.18
    scripture: tanakh
    name: Tanakh 1 Samuel 19:18
    ref: 1 Samuel 19:18
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 18
    ordinal: 7634
    text: Now David fled, and escaped, and came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth.
    translation: JPS 1917
    original: וְדָוִד בָּרַח וַיִּמָּלֵט וַיָּבֹא אֶל־שְׁמוּאֵל הָרָמָתָה וַיַּגֶּד־לוֹ אֵת כָּל־אֲשֶׁר עָשָׂה־לוֹ שָׁאוּל וַיֵּלֶךְ הוּא וּשְׁמוּאֵל וַיֵּשְׁבוּ בנוית [בְּנָיוֹת׃]
    hebrewPlain: ודוד ברח וימלט ויבא אל שמואל הרמתה ויגד לו את כל אשר עשה לו שאול וילך הוא ושמואל וישבו בנוית [בניות]
    kjvRefs:
    - 1 Samuel 19:18
    kjvOsis:
    - 1Sam.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.19
    scripture: tanakh
    name: Tanakh 1 Samuel 19:19
    ref: 1 Samuel 19:19
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 19
    ordinal: 7635
    text: 'And it was told Saul, saying: ‘Behold, David is at Naioth in Ramah.’'
    translation: JPS 1917
    original: וַיֻּגַּד לְשָׁאוּל לֵאמֹר הִנֵּה דָוִד בנוית [בְּנָיוֹת] בָּרָמָה׃
    hebrewPlain: ויגד לשאול לאמר הנה דוד בנוית [בניות] ברמה
    kjvRefs:
    - 1 Samuel 19:19
    kjvOsis:
    - 1Sam.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.20
    scripture: tanakh
    name: Tanakh 1 Samuel 19:20
    ref: 1 Samuel 19:20
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 20
    ordinal: 7636
    text: And Saul sent messengers to take David; and when they saw the company of the prophets prophesying, and Samuel standing as head over them, the spirit of God came upon the messengers of Saul, and they also prophesied.
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל מַלְאָכִים לָקַחַת אֶת־דָּוִד וַיַּרְא אֶת־לַהֲקַת הַנְּבִיאִים נִבְּאִים וּשְׁמוּאֵל עֹמֵד נִצָּב עֲלֵיהֶם וַתְּהִי עַל־מַלְאֲכֵי שָׁאוּל רוּחַ אֱלֹהִים וַיִּתְנַבְּאוּ גַּם־הֵמָּה׃
    hebrewPlain: וישלח שאול מלאכים לקחת את דוד וירא את להקת הנביאים נבאים ושמואל עמד נצב עליהם ותהי על מלאכי שאול רוח אלהים ויתנבאו גם המה
    kjvRefs:
    - 1 Samuel 19:20
    kjvOsis:
    - 1Sam.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.21
    scripture: tanakh
    name: Tanakh 1 Samuel 19:21
    ref: 1 Samuel 19:21
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 21
    ordinal: 7637
    text: And when it was told Saul, he sent other messengers, and they also prophesied. And Saul sent messengers again the third time, and they also prophesied.
    translation: JPS 1917
    original: וַיַּגִּדוּ לְשָׁאוּל וַיִּשְׁלַח מַלְאָכִים אֲחֵרִים וַיִּתְנַבְּאוּ גַּם־הֵמָּה וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח מַלְאָכִים שְׁלִשִׁים וַיִּתְנַבְּאוּ גַּם־הֵמָּה׃
    hebrewPlain: ויגדו לשאול וישלח מלאכים אחרים ויתנבאו גם המה ויסף שאול וישלח מלאכים שלשים ויתנבאו גם המה
    kjvRefs:
    - 1 Samuel 19:21
    kjvOsis:
    - 1Sam.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.22
    scripture: tanakh
    name: Tanakh 1 Samuel 19:22
    ref: 1 Samuel 19:22
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 22
    ordinal: 7638
    text: 'Then went he also to Ramah, and came to the great cistern that is in Secu; and he asked and said: ‘Where are Samuel and David?’ And one said: ‘Behold, they are at Naioth in Ramah.’'
    translation: JPS 1917
    original: וַיֵּלֶךְ גַּם־הוּא הָרָמָתָה וַיָּבֹא עַד־בּוֹר הַגָּדוֹל אֲשֶׁר בַּשֶּׂכוּ וַיִּשְׁאַל וַיֹּאמֶר אֵיפֹה שְׁמוּאֵל וְדָוִד וַיֹּאמֶר הִנֵּה בנוית [בְּנָיוֹת] בָּרָמָה׃
    hebrewPlain: וילך גם הוא הרמתה ויבא עד בור הגדול אשר בשכו וישאל ויאמר איפה שמואל ודוד ויאמר הנה בנוית [בניות] ברמה
    kjvRefs:
    - 1 Samuel 19:22
    kjvOsis:
    - 1Sam.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.23
    scripture: tanakh
    name: Tanakh 1 Samuel 19:23
    ref: 1 Samuel 19:23
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 23
    ordinal: 7639
    text: And he went thither to Naioth in Ramah; and the spirit of God came upon him also, and he went on, and prophesied, until he came to Naioth in Ramah.
    translation: JPS 1917
    original: וַיֵּלֶךְ שָׁם אֶל־נוית [נָיוֹת] בָּרָמָה וַתְּהִי עָלָיו גַּם־הוּא רוּחַ אֱלֹהִים וַיֵּלֶךְ הָלוֹךְ וַיִּתְנַבֵּא עַד־בֹּאוֹ בנוית [בְּנָיוֹת] בָּרָמָה׃
    hebrewPlain: וילך שם אל נוית [ניות] ברמה ותהי עליו גם הוא רוח אלהים וילך הלוך ויתנבא עד באו בנוית [בניות] ברמה
    kjvRefs:
    - 1 Samuel 19:23
    kjvOsis:
    - 1Sam.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.19.24
    scripture: tanakh
    name: Tanakh 1 Samuel 19:24
    ref: 1 Samuel 19:24
    book: 1Sam
    section: neviim
    chapter: 19
    verse: 24
    ordinal: 7640
    text: 'And he also stripped off his clothes, and he also prophesied before Samuel, and lay down naked all that day and all that night. Wherefore they say: ‘Is Saul also among the prophets?’'
    translation: JPS 1917
    original: וַיִּפְשַׁט גַּם־הוּא בְּגָדָיו וַיִּתְנַבֵּא גַם־הוּא לִפְנֵי שְׁמוּאֵל וַיִּפֹּל עָרֹם כָּל־הַיּוֹם הַהוּא וְכָל־הַלָּיְלָה עַל־כֵּן יֹאמְרוּ הֲגַם שָׁאוּל בַּנְּבִיאִם׃
    hebrewPlain: ויפשט גם הוא בגדיו ויתנבא גם הוא לפני שמואל ויפל ערם כל היום ההוא וכל הלילה על כן יאמרו הגם שאול בנביאם
    kjvRefs:
    - 1 Samuel 19:24
    kjvOsis:
    - 1Sam.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.19
- type: TanakhVerse
  data:
    osis: 1Sam.20.1
    scripture: tanakh
    name: Tanakh 1 Samuel 20:1
    ref: 1 Samuel 20:1
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 1
    ordinal: 7641
    text: 'And David fled from Naioth in Ramah, and came and said before Jonathan: ‘What have I done? what is mine iniquity? and what is my sin before thy father, that he seeketh my life?’'
    translation: JPS 1917
    original: וַיִּבְרַח דָּוִד מנוות [מִנָּיוֹת] בָּרָמָה וַיָּבֹא וַיֹּאמֶר לִפְנֵי יְהוֹנָתָן מֶה עָשִׂיתִי מֶה־עֲוֺנִי וּמֶה־חַטָּאתִי לִפְנֵי אָבִיךָ כִּי מְבַקֵּשׁ אֶת־נַפְשִׁי׃
    hebrewPlain: ויברח דוד מנוות [מניות] ברמה ויבא ויאמר לפני יהונתן מה עשיתי מה עוני ומה חטאתי לפני אביך כי מבקש את נפשי
    kjvRefs:
    - 1 Samuel 20:1
    kjvOsis:
    - 1Sam.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.2
    scripture: tanakh
    name: Tanakh 1 Samuel 20:2
    ref: 1 Samuel 20:2
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 2
    ordinal: 7642
    text: 'And he said unto him: ‘Far from it; thou shalt not die; behold, my father doeth nothing either great or small, but that he discloseth it unto me; and why should my father hide this thing from me? it is not so.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ חָלִילָה לֹא תָמוּת הִנֵּה לו־עשה [לֹא־] [יַעֲשֶׂה] אָבִי דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן וְלֹא יִגְלֶה אֶת־אָזְנִי וּמַדּוּעַ יַסְתִּיר אָבִי מִמֶּנִּי אֶת־הַדָּבָר הַזֶּה אֵין זֹאת׃
    hebrewPlain: ויאמר לו חלילה לא תמות הנה לו עשה [לא ] [יעשה] אבי דבר גדול או דבר קטן ולא יגלה את אזני ומדוע יסתיר אבי ממני את הדבר הזה אין זאת
    kjvRefs:
    - 1 Samuel 20:2
    kjvOsis:
    - 1Sam.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.3
    scripture: tanakh
    name: Tanakh 1 Samuel 20:3
    ref: 1 Samuel 20:3
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 3
    ordinal: 7643
    text: 'And David swore moreover, and said: ‘Thy father knoweth well that I have found favour in thine eyes; and he saith: Let not Jonathan know this, lest he be grieved; but truly as the LORD liveth, and as thy soul liveth, there is but a step between me and death.’'
    translation: JPS 1917
    original: וַיִּשָּׁבַע עוֹד דָּוִד וַיֹּאמֶר יָדֹעַ יָדַע אָבִיךָ כִּי־מָצָאתִי חֵן בְּעֵינֶיךָ וַיֹּאמֶר אַל־יֵדַע־זֹאת יְהוֹנָתָן פֶּן־יֵעָצֵב וְאוּלָם חַי־יְהוָה וְחֵי נַפְשֶׁךָ כִּי כְפֶשַׂע בֵּינִי וּבֵין הַמָּוֶת׃
    hebrewPlain: וישבע עוד דוד ויאמר ידע ידע אביך כי מצאתי חן בעיניך ויאמר אל ידע זאת יהונתן פן יעצב ואולם חי יהוה וחי נפשך כי כפשע ביני ובין המות
    kjvRefs:
    - 1 Samuel 20:3
    kjvOsis:
    - 1Sam.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.4
    scripture: tanakh
    name: Tanakh 1 Samuel 20:4
    ref: 1 Samuel 20:4
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 4
    ordinal: 7644
    text: 'Then said Jonathan unto David: ‘What doth thy soul desire, that I should do it for thee?’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן אֶל־דָּוִד מַה־תֹּאמַר נַפְשְׁךָ וְאֶעֱשֶׂה־לָּךְ׃
    hebrewPlain: ויאמר יהונתן אל דוד מה תאמר נפשך ואעשה לך
    kjvRefs:
    - 1 Samuel 20:4
    kjvOsis:
    - 1Sam.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.5
    scripture: tanakh
    name: Tanakh 1 Samuel 20:5
    ref: 1 Samuel 20:5
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 5
    ordinal: 7645
    text: 'And David said unto Jonathan: ‘Behold, to-morrow is the new moon, when I should sit with the king to eat; so let me go, that I may hide myself in the field unto the third day at even.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־יְהוֹנָתָן הִנֵּה־חֹדֶשׁ מָחָר וְאָנֹכִי יָשֹׁב־אֵשֵׁב עִם־הַמֶּלֶךְ לֶאֱכוֹל וְשִׁלַּחְתַּנִי וְנִסְתַּרְתִּי בַשָּׂדֶה עַד הָעֶרֶב הַשְּׁלִשִׁית׃
    hebrewPlain: ויאמר דוד אל יהונתן הנה חדש מחר ואנכי ישב אשב עם המלך לאכול ושלחתני ונסתרתי בשדה עד הערב השלשית
    kjvRefs:
    - 1 Samuel 20:5
    kjvOsis:
    - 1Sam.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.6
    scripture: tanakh
    name: Tanakh 1 Samuel 20:6
    ref: 1 Samuel 20:6
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 6
    ordinal: 7646
    text: 'If thy father miss me at all, then say: David earnestly asked leave of me that he might run to Beth-lehem his city; for it is the yearly sacrifice there for all the family.'
    translation: JPS 1917
    original: אִם־פָּקֹד יִפְקְדֵנִי אָבִיךָ וְאָמַרְתָּ נִשְׁאֹל נִשְׁאַל מִמֶּנִּי דָוִד לָרוּץ בֵּית־לֶחֶם עִירוֹ כִּי זֶבַח הַיָּמִים שָׁם לְכָל־הַמִּשְׁפָּחָה׃
    hebrewPlain: אם פקד יפקדני אביך ואמרת נשאל נשאל ממני דוד לרוץ בית לחם עירו כי זבח הימים שם לכל המשפחה
    kjvRefs:
    - 1 Samuel 20:6
    kjvOsis:
    - 1Sam.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.7
    scripture: tanakh
    name: Tanakh 1 Samuel 20:7
    ref: 1 Samuel 20:7
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 7
    ordinal: 7647
    text: 'If he say thus: It is well; thy servant shall have peace; but if he be wroth, then know that evil is determined by him.'
    translation: JPS 1917
    original: אִם־כֹּה יֹאמַר טוֹב שָׁלוֹם לְעַבְדֶּךָ וְאִם־חָרֹה יֶחֱרֶה לוֹ דַּע כִּי־כָלְתָה הָרָעָה מֵעִמּוֹ׃
    hebrewPlain: אם כה יאמר טוב שלום לעבדך ואם חרה יחרה לו דע כי כלתה הרעה מעמו
    kjvRefs:
    - 1 Samuel 20:7
    kjvOsis:
    - 1Sam.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.8
    scripture: tanakh
    name: Tanakh 1 Samuel 20:8
    ref: 1 Samuel 20:8
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 8
    ordinal: 7648
    text: Therefore deal kindly with thy servant; for thou hast brought thy servant into a covenant of the LORD with thee; but if there be in me iniquity, slay me thyself; for why shouldest thou bring me to thy father?’
    translation: JPS 1917
    original: וְעָשִׂיתָ חֶסֶד עַל־עַבְדֶּךָ כִּי בִּבְרִית יְהוָה הֵבֵאתָ אֶת־עַבְדְּךָ עִמָּךְ וְאִם־יֶשׁ־בִּי עָוֺן הֲמִיתֵנִי אַתָּה וְעַד־אָבִיךָ לָמָּה־זֶּה תְבִיאֵנִי׃
    hebrewPlain: ועשית חסד על עבדך כי בברית יהוה הבאת את עבדך עמך ואם יש בי עון המיתני אתה ועד אביך למה זה תביאני
    kjvRefs:
    - 1 Samuel 20:8
    kjvOsis:
    - 1Sam.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.9
    scripture: tanakh
    name: Tanakh 1 Samuel 20:9
    ref: 1 Samuel 20:9
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 9
    ordinal: 7649
    text: 'And Jonathan said: ‘Far be it from thee; for if I should at all know that evil were determined by my father to come upon thee, then would not I tell it thee?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן חָלִילָה לָּךְ כִּי אִם־יָדֹעַ אֵדַע כִּי־כָלְתָה הָרָעָה מֵעִם אָבִי לָבוֹא עָלֶיךָ וְלֹא אֹתָהּ אַגִּיד לָךְ׃
    hebrewPlain: ויאמר יהונתן חלילה לך כי אם ידע אדע כי כלתה הרעה מעם אבי לבוא עליך ולא אתה אגיד לך
    kjvRefs:
    - 1 Samuel 20:9
    kjvOsis:
    - 1Sam.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.10
    scripture: tanakh
    name: Tanakh 1 Samuel 20:10
    ref: 1 Samuel 20:10
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 10
    ordinal: 7650
    text: 'Then said David to Jonathan: ‘Who shall tell me if perchance thy father answer thee roughly?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־יְהוֹנָתָן מִי יַגִּיד לִי אוֹ מַה־יַּעַנְךָ אָבִיךָ קָשָׁה׃
    hebrewPlain: ויאמר דוד אל יהונתן מי יגיד לי או מה יענך אביך קשה
    kjvRefs:
    - 1 Samuel 20:10
    kjvOsis:
    - 1Sam.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.11
    scripture: tanakh
    name: Tanakh 1 Samuel 20:11
    ref: 1 Samuel 20:11
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 11
    ordinal: 7651
    text: 'And Jonathan said unto David: ‘Come and let us go out into the field.’ And they went out both of them into the field.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן אֶל־דָּוִד לְכָה וְנֵצֵא הַשָּׂדֶה וַיֵּצְאוּ שְׁנֵיהֶם הַשָּׂדֶה׃
    hebrewPlain: ויאמר יהונתן אל דוד לכה ונצא השדה ויצאו שניהם השדה
    kjvRefs:
    - 1 Samuel 20:11
    kjvOsis:
    - 1Sam.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.12
    scripture: tanakh
    name: Tanakh 1 Samuel 20:12
    ref: 1 Samuel 20:12
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 12
    ordinal: 7652
    text: 'And Jonathan said unto David: ‘The LORD, the God of Israel—when I have sounded my father about this time to-morrow, or the third day, behold, if there be good toward David, shall I not then send unto thee, and disclose it unto thee?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן אֶל־דָּוִד יְהוָה אֱלֹהֵי יִשְׂרָאֵל כִּי־אֶחְקֹר אֶת־אָבִי כָּעֵת מָחָר הַשְּׁלִשִׁית וְהִנֵּה־טוֹב אֶל־דָּוִד וְלֹא־אָז אֶשְׁלַח אֵלֶיךָ וְגָלִיתִי אֶת־אָזְנֶךָ׃
    hebrewPlain: ויאמר יהונתן אל דוד יהוה אלהי ישראל כי אחקר את אבי כעת מחר השלשית והנה טוב אל דוד ולא אז אשלח אליך וגליתי את אזנך
    kjvRefs:
    - 1 Samuel 20:12
    kjvOsis:
    - 1Sam.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.13
    scripture: tanakh
    name: Tanakh 1 Samuel 20:13
    ref: 1 Samuel 20:13
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 13
    ordinal: 7653
    text: The LORD do so to Jonathan, and more also, should it please my father to do thee evil, if I disclose it not unto thee, and send thee away, that thou mayest go in peace; and the LORD be with thee, as He hath been with my father.
    translation: JPS 1917
    original: כֹּה־יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף כִּי־יֵיטִב אֶל־אָבִי אֶת־הָרָעָה עָלֶיךָ וְגָלִיתִי אֶת־אָזְנֶךָ וְשִׁלַּחְתִּיךָ וְהָלַכְתָּ לְשָׁלוֹם וִיהִי יְהוָה עִמָּךְ כַּאֲשֶׁר הָיָה עִם־אָבִי׃
    hebrewPlain: כה יעשה יהוה ליהונתן וכה יסיף כי ייטב אל אבי את הרעה עליך וגליתי את אזנך ושלחתיך והלכת לשלום ויהי יהוה עמך כאשר היה עם אבי
    kjvRefs:
    - 1 Samuel 20:13
    kjvOsis:
    - 1Sam.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.14
    scripture: tanakh
    name: Tanakh 1 Samuel 20:14
    ref: 1 Samuel 20:14
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 14
    ordinal: 7654
    text: And thou shalt not only while yet I live show me the kindness of the LORD, that I die not;
    translation: JPS 1917
    original: וְלֹא אִם־עוֹדֶנִּי חָי וְלֹא־תַעֲשֶׂה עִמָּדִי חֶסֶד יְהוָה וְלֹא אָמוּת׃
    hebrewPlain: ולא אם עודני חי ולא תעשה עמדי חסד יהוה ולא אמות
    kjvRefs:
    - 1 Samuel 20:14
    kjvOsis:
    - 1Sam.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.15
    scripture: tanakh
    name: Tanakh 1 Samuel 20:15
    ref: 1 Samuel 20:15
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 15
    ordinal: 7655
    text: but also thou shalt not cut off thy kindness from my house for ever; no, not when the LORD hath cut off the enemies of David every one from the face of the earth.’
    translation: JPS 1917
    original: וְלֹא־תַכְרִת אֶת־חַסְדְּךָ מֵעִם בֵּיתִי עַד־עוֹלָם וְלֹא בְּהַכְרִת יְהוָה אֶת־אֹיְבֵי דָוִד אִישׁ מֵעַל פְּנֵי הָאֲדָמָה׃
    hebrewPlain: ולא תכרת את חסדך מעם ביתי עד עולם ולא בהכרת יהוה את איבי דוד איש מעל פני האדמה
    kjvRefs:
    - 1 Samuel 20:15
    kjvOsis:
    - 1Sam.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.16
    scripture: tanakh
    name: Tanakh 1 Samuel 20:16
    ref: 1 Samuel 20:16
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 16
    ordinal: 7656
    text: 'So Jonathan made a covenant with the house of David: ‘The LORD even require it at the hand of David’s enemies.’'
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוֹנָתָן עִם־בֵּית דָּוִד וּבִקֵּשׁ יְהוָה מִיַּד אֹיְבֵי דָוִד׃
    hebrewPlain: ויכרת יהונתן עם בית דוד ובקש יהוה מיד איבי דוד
    kjvRefs:
    - 1 Samuel 20:16
    kjvOsis:
    - 1Sam.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.17
    scripture: tanakh
    name: Tanakh 1 Samuel 20:17
    ref: 1 Samuel 20:17
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 17
    ordinal: 7657
    text: And Jonathan caused David to swear again, for the love that he had to him; for he loved him as he loved his own soul.
    translation: JPS 1917
    original: וַיּוֹסֶף יְהוֹנָתָן לְהַשְׁבִּיעַ אֶת־דָּוִד בְּאַהֲבָתוֹ אֹתוֹ כִּי־אַהֲבַת נַפְשׁוֹ אֲהֵבוֹ׃
    hebrewPlain: ויוסף יהונתן להשביע את דוד באהבתו אתו כי אהבת נפשו אהבו
    kjvRefs:
    - 1 Samuel 20:17
    kjvOsis:
    - 1Sam.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.18
    scripture: tanakh
    name: Tanakh 1 Samuel 20:18
    ref: 1 Samuel 20:18
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 18
    ordinal: 7658
    text: 'And Jonathan said unto him: ‘To-morrow is the new moon; and thou wilt be missed, thy seat will be empty.'
    translation: JPS 1917
    original: וַיֹּאמֶר־לוֹ יְהוֹנָתָן מָחָר חֹדֶשׁ וְנִפְקַדְתָּ כִּי יִפָּקֵד מוֹשָׁבֶךָ׃
    hebrewPlain: ויאמר לו יהונתן מחר חדש ונפקדת כי יפקד מושבך
    kjvRefs:
    - 1 Samuel 20:18
    kjvOsis:
    - 1Sam.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.19
    scripture: tanakh
    name: Tanakh 1 Samuel 20:19
    ref: 1 Samuel 20:19
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 19
    ordinal: 7659
    text: And in the third day thou shalt hide thyself well, and come to the place where thou didst hide thyself in the day of work, and shalt remain by the stone Ezel.
    translation: JPS 1917
    original: וְשִׁלַּשְׁתָּ תֵּרֵד מְאֹד וּבָאתָ אֶל־הַמָּקוֹם אֲשֶׁר־נִסְתַּרְתָּ שָּׁם בְּיוֹם הַמַּעֲשֶׂה וְיָשַׁבְתָּ אֵצֶל הָאֶבֶן הָאָזֶל׃
    hebrewPlain: ושלשת תרד מאד ובאת אל המקום אשר נסתרת שם ביום המעשה וישבת אצל האבן האזל
    kjvRefs:
    - 1 Samuel 20:19
    kjvOsis:
    - 1Sam.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.20
    scripture: tanakh
    name: Tanakh 1 Samuel 20:20
    ref: 1 Samuel 20:20
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 20
    ordinal: 7660
    text: And I will shoot three arrows to the side-ward, as though I shot at a mark.
    translation: JPS 1917
    original: וַאֲנִי שְׁלֹשֶׁת הַחִצִּים צִדָּה אוֹרֶה לְשַׁלַּח־לִי לְמַטָּרָה׃
    hebrewPlain: ואני שלשת החצים צדה אורה לשלח לי למטרה
    kjvRefs:
    - 1 Samuel 20:20
    kjvOsis:
    - 1Sam.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.21
    scripture: tanakh
    name: Tanakh 1 Samuel 20:21
    ref: 1 Samuel 20:21
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 21
    ordinal: 7661
    text: 'And, behold, I will send the lad: Go, find the arrows. If I say unto the lad: Behold, the arrows are on this side of thee; take them, and come; for there is peace to thee and no hurt, as the LORD liveth.'
    translation: JPS 1917
    original: וְהִנֵּה אֶשְׁלַח אֶת־הַנַּעַר לֵךְ מְצָא אֶת־הַחִצִּים אִם־אָמֹר אֹמַר לַנַּעַר הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה קָחֶנּוּ וָבֹאָה כִּי־שָׁלוֹם לְךָ וְאֵין דָּבָר חַי־יְהוָה׃
    hebrewPlain: והנה אשלח את הנער לך מצא את החצים אם אמר אמר לנער הנה החצים ממך והנה קחנו ובאה כי שלום לך ואין דבר חי יהוה
    kjvRefs:
    - 1 Samuel 20:21
    kjvOsis:
    - 1Sam.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.22
    scripture: tanakh
    name: Tanakh 1 Samuel 20:22
    ref: 1 Samuel 20:22
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 22
    ordinal: 7662
    text: 'But if I say thus unto the boy: Behold, the arrows are beyond thee; go thy way; for the LORD hath sent thee away.'
    translation: JPS 1917
    original: וְאִם־כֹּה אֹמַר לָעֶלֶם הִנֵּה הַחִצִּים מִמְּךָ וָהָלְאָה לֵךְ כִּי שִׁלַּחֲךָ יְהוָה׃
    hebrewPlain: ואם כה אמר לעלם הנה החצים ממך והלאה לך כי שלחך יהוה
    kjvRefs:
    - 1 Samuel 20:22
    kjvOsis:
    - 1Sam.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.23
    scripture: tanakh
    name: Tanakh 1 Samuel 20:23
    ref: 1 Samuel 20:23
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 23
    ordinal: 7663
    text: And as touching the matter which I and thou have spoken of, behold, the LORD is between me and thee for ever.’
    translation: JPS 1917
    original: וְהַדָּבָר אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה הִנֵּה יְהוָה בֵּינִי וּבֵינְךָ עַד־עוֹלָם׃
    hebrewPlain: והדבר אשר דברנו אני ואתה הנה יהוה ביני ובינך עד עולם
    kjvRefs:
    - 1 Samuel 20:23
    kjvOsis:
    - 1Sam.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.24
    scripture: tanakh
    name: Tanakh 1 Samuel 20:24
    ref: 1 Samuel 20:24
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 24
    ordinal: 7664
    text: So David hid himself in the field; and when the new moon was come, the king sat him down to the meal to eat.
    translation: JPS 1917
    original: וַיִּסָּתֵר דָּוִד בַּשָּׂדֶה וַיְהִי הַחֹדֶשׁ וַיֵּשֶׁב הַמֶּלֶךְ על־[אֶל־] הַלֶּחֶם לֶאֱכוֹל׃
    hebrewPlain: ויסתר דוד בשדה ויהי החדש וישב המלך על [אל ] הלחם לאכול
    kjvRefs:
    - 1 Samuel 20:24
    kjvOsis:
    - 1Sam.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.25
    scripture: tanakh
    name: Tanakh 1 Samuel 20:25
    ref: 1 Samuel 20:25
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 25
    ordinal: 7665
    text: And the king sat upon his seat, as at other times, even upon the seat by the wall; and Jonathan stood up, and Abner sat by Saul’s side; but David’s place was empty.
    translation: JPS 1917
    original: וַיֵּשֶׁב הַמֶּלֶךְ עַל־מוֹשָׁבוֹ כְּפַעַם בְּפַעַם אֶל־מוֹשַׁב הַקִּיר וַיָּקָם יְהוֹנָתָן וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל וַיִּפָּקֵד מְקוֹם דָּוִד׃
    hebrewPlain: וישב המלך על מושבו כפעם בפעם אל מושב הקיר ויקם יהונתן וישב אבנר מצד שאול ויפקד מקום דוד
    kjvRefs:
    - 1 Samuel 20:25
    kjvOsis:
    - 1Sam.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.26
    scripture: tanakh
    name: Tanakh 1 Samuel 20:26
    ref: 1 Samuel 20:26
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 26
    ordinal: 7666
    text: 'Nevertheless Saul spoke not any thing that day; for he thought: ‘Something hath befallen him, he is unclean; surely he is not clean.’'
    translation: JPS 1917
    original: וְלֹא־דִבֶּר שָׁאוּל מְאוּמָה בַּיּוֹם הַהוּא כִּי אָמַר מִקְרֶה הוּא בִּלְתִּי טָהוֹר הוּא כִּי־לֹא טָהוֹר׃
    hebrewPlain: ולא דבר שאול מאומה ביום ההוא כי אמר מקרה הוא בלתי טהור הוא כי לא טהור
    kjvRefs:
    - 1 Samuel 20:26
    kjvOsis:
    - 1Sam.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.27
    scripture: tanakh
    name: Tanakh 1 Samuel 20:27
    ref: 1 Samuel 20:27
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 27
    ordinal: 7667
    text: 'And it came to pass on the morrow after the new moon, which was the second day, that David’s place was empty; and Saul said unto Jonathan his son: ‘Wherefore cometh not the son of Jesse to the meal, neither yesterday, nor to-day?’'
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרַת הַחֹדֶשׁ הַשֵּׁנִי וַיִּפָּקֵד מְקוֹם דָּוִד וַיֹּאמֶר שָׁאוּל אֶל־יְהוֹנָתָן בְּנוֹ מַדּוּעַ לֹא־בָא בֶן־יִשַׁי גַּם־תְּמוֹל גַּם־הַיּוֹם אֶל־הַלָּחֶם׃
    hebrewPlain: ויהי ממחרת החדש השני ויפקד מקום דוד ויאמר שאול אל יהונתן בנו מדוע לא בא בן ישי גם תמול גם היום אל הלחם
    kjvRefs:
    - 1 Samuel 20:27
    kjvOsis:
    - 1Sam.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.28
    scripture: tanakh
    name: Tanakh 1 Samuel 20:28
    ref: 1 Samuel 20:28
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 28
    ordinal: 7668
    text: 'And Jonathan answered Saul: ‘David earnestly asked leave of me to go to Beth-lehem;'
    translation: JPS 1917
    original: וַיַּעַן יְהוֹנָתָן אֶת־שָׁאוּל נִשְׁאֹל נִשְׁאַל דָּוִד מֵעִמָּדִי עַד־בֵּית לָחֶם׃
    hebrewPlain: ויען יהונתן את שאול נשאל נשאל דוד מעמדי עד בית לחם
    kjvRefs:
    - 1 Samuel 20:28
    kjvOsis:
    - 1Sam.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.29
    scripture: tanakh
    name: Tanakh 1 Samuel 20:29
    ref: 1 Samuel 20:29
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 29
    ordinal: 7669
    text: 'and he said: Let me go, I pray thee; for our family hath a sacrifice in the city; and my brother, he hath commanded me; and now, if I have found favour in thine eyes, let me get away, I pray thee, and see my brethren. Therefore he is not come unto the king’s table.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שַׁלְּחֵנִי נָא כִּי זֶבַח מִשְׁפָּחָה לָנוּ בָּעִיר וְהוּא צִוָּה־לִי אָחִי וְעַתָּה אִם־מָצָאתִי חֵן בְּעֵינֶיךָ אִמָּלְטָה נָּא וְאֶרְאֶה אֶת־אֶחָי עַל־כֵּן לֹא־בָא אֶל־שֻׁלְחַן הַמֶּלֶךְ׃
    hebrewPlain: ויאמר שלחני נא כי זבח משפחה לנו בעיר והוא צוה לי אחי ועתה אם מצאתי חן בעיניך אמלטה נא ואראה את אחי על כן לא בא אל שלחן המלך
    kjvRefs:
    - 1 Samuel 20:29
    kjvOsis:
    - 1Sam.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.30
    scripture: tanakh
    name: Tanakh 1 Samuel 20:30
    ref: 1 Samuel 20:30
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 30
    ordinal: 7670
    text: 'Then Saul’s anger was kindled against Jonathan, and he said unto him: ‘Thou son of perverse rebellion, do not I know that thou hast chosen the son of Jesse to thine own shame, and unto the shame of thy mother’s nakedness?'
    translation: JPS 1917
    original: וַיִּחַר־אַף שָׁאוּל בִּיהוֹנָתָן וַיֹּאמֶר לוֹ בֶּן־נַעֲוַת הַמַּרְדּוּת הֲלוֹא יָדַעְתִּי כִּי־בֹחֵר אַתָּה לְבֶן־יִשַׁי לְבָשְׁתְּךָ וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ׃
    hebrewPlain: ויחר אף שאול ביהונתן ויאמר לו בן נעות המרדות הלוא ידעתי כי בחר אתה לבן ישי לבשתך ולבשת ערות אמך
    kjvRefs:
    - 1 Samuel 20:30
    kjvOsis:
    - 1Sam.20.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.31
    scripture: tanakh
    name: Tanakh 1 Samuel 20:31
    ref: 1 Samuel 20:31
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 31
    ordinal: 7671
    text: For as long as the son of Jesse liveth upon the earth, thou shalt not be established, nor thy kingdom. Wherefore now send and fetch him unto me, for he deserveth to die.’
    translation: JPS 1917
    original: כִּי כָל־הַיָּמִים אֲשֶׁר בֶּן־יִשַׁי חַי עַל־הָאֲדָמָה לֹא תִכּוֹן אַתָּה וּמַלְכוּתֶךָ וְעַתָּה שְׁלַח וְקַח אֹתוֹ אֵלַי כִּי בֶן־מָוֶת הוּא׃
    hebrewPlain: כי כל הימים אשר בן ישי חי על האדמה לא תכון אתה ומלכותך ועתה שלח וקח אתו אלי כי בן מות הוא
    kjvRefs:
    - 1 Samuel 20:31
    kjvOsis:
    - 1Sam.20.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.32
    scripture: tanakh
    name: Tanakh 1 Samuel 20:32
    ref: 1 Samuel 20:32
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 32
    ordinal: 7672
    text: 'And Jonathan answered Saul his father, and said unto him: ‘Wherefore should he be put to death? what hath he done?’'
    translation: JPS 1917
    original: וַיַּעַן יְהוֹנָתָן אֶת־שָׁאוּל אָבִיו וַיֹּאמֶר אֵלָיו לָמָּה יוּמַת מֶה עָשָׂה׃
    hebrewPlain: ויען יהונתן את שאול אביו ויאמר אליו למה יומת מה עשה
    kjvRefs:
    - 1 Samuel 20:32
    kjvOsis:
    - 1Sam.20.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.33
    scripture: tanakh
    name: Tanakh 1 Samuel 20:33
    ref: 1 Samuel 20:33
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 33
    ordinal: 7673
    text: And Saul cast his spear at him to smite him; whereby Jonathan knew that it was determined of his father to put David to death.
    translation: JPS 1917
    original: וַיָּטֶל שָׁאוּל אֶת־הַחֲנִית עָלָיו לְהַכֹּתוֹ וַיֵּדַע יְהוֹנָתָן כִּי־כָלָה הִיא מֵעִם אָבִיו לְהָמִית אֶת־דָּוִד׃
    hebrewPlain: ויטל שאול את החנית עליו להכתו וידע יהונתן כי כלה היא מעם אביו להמית את דוד
    kjvRefs:
    - 1 Samuel 20:33
    kjvOsis:
    - 1Sam.20.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.34
    scripture: tanakh
    name: Tanakh 1 Samuel 20:34
    ref: 1 Samuel 20:34
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 34
    ordinal: 7674
    text: So Jonathan arose from the table in fierce anger, and did eat no food the second day of the month; for he was grieved for David, and because his father had put him to shame.
    translation: JPS 1917
    original: וַיָּקָם יְהוֹנָתָן מֵעִם הַשֻּׁלְחָן בָּחֳרִי־אָף וְלֹא־אָכַל בְּיוֹם־הַחֹדֶשׁ הַשֵּׁנִי לֶחֶם כִּי נֶעְצַב אֶל־דָּוִד כִּי הִכְלִמוֹ אָבִיו׃
    hebrewPlain: ויקם יהונתן מעם השלחן בחרי אף ולא אכל ביום החדש השני לחם כי נעצב אל דוד כי הכלמו אביו
    kjvRefs:
    - 1 Samuel 20:34
    kjvOsis:
    - 1Sam.20.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.35
    scripture: tanakh
    name: Tanakh 1 Samuel 20:35
    ref: 1 Samuel 20:35
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 35
    ordinal: 7675
    text: And it came to pass in the morning, that Jonathan went out into the field at the time appointed with David, and a little lad with him.
    translation: JPS 1917
    original: וַיְהִי בַבֹּקֶר וַיֵּצֵא יְהוֹנָתָן הַשָּׂדֶה לְמוֹעֵד דָּוִד וְנַעַר קָטֹן עִמּוֹ׃
    hebrewPlain: ויהי בבקר ויצא יהונתן השדה למועד דוד ונער קטן עמו
    kjvRefs:
    - 1 Samuel 20:35
    kjvOsis:
    - 1Sam.20.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.36
    scripture: tanakh
    name: Tanakh 1 Samuel 20:36
    ref: 1 Samuel 20:36
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 36
    ordinal: 7676
    text: 'And he said unto his lad: ‘Run, find now the arrows which I shoot.’ And as the lad ran, he shot an arrow beyond him.'
    translation: JPS 1917
    original: וַיֹּאמֶר לְנַעֲרוֹ רֻץ מְצָא נָא אֶת־הַחִצִּים אֲשֶׁר אָנֹכִי מוֹרֶה הַנַּעַר רָץ וְהוּא־יָרָה הַחֵצִי לְהַעֲבִרוֹ׃
    hebrewPlain: ויאמר לנערו רץ מצא נא את החצים אשר אנכי מורה הנער רץ והוא ירה החצי להעברו
    kjvRefs:
    - 1 Samuel 20:36
    kjvOsis:
    - 1Sam.20.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.37
    scripture: tanakh
    name: Tanakh 1 Samuel 20:37
    ref: 1 Samuel 20:37
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 37
    ordinal: 7677
    text: 'And when the lad was come to the place of the arrow which Jonathan had shot, Jonathan cried after the lad, and said: ‘Is not the arrow beyond thee?’'
    translation: JPS 1917
    original: וַיָּבֹא הַנַּעַר עַד־מְקוֹם הַחֵצִי אֲשֶׁר יָרָה יְהוֹנָתָן וַיִּקְרָא יְהוֹנָתָן אַחֲרֵי הַנַּעַר וַיֹּאמֶר הֲלוֹא הַחֵצִי מִמְּךָ וָהָלְאָה׃
    hebrewPlain: ויבא הנער עד מקום החצי אשר ירה יהונתן ויקרא יהונתן אחרי הנער ויאמר הלוא החצי ממך והלאה
    kjvRefs:
    - 1 Samuel 20:37
    kjvOsis:
    - 1Sam.20.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.38
    scripture: tanakh
    name: Tanakh 1 Samuel 20:38
    ref: 1 Samuel 20:38
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 38
    ordinal: 7678
    text: 'And Jonathan cried after the lad: ‘Make speed, hasten, stay not.’ And Jonathan’s lad gathered up the arrows, and came to his master.'
    translation: JPS 1917
    original: וַיִּקְרָא יְהוֹנָתָן אַחֲרֵי הַנַּעַר מְהֵרָה חוּשָׁה אַל־תַּעֲמֹד וַיְלַקֵּט נַעַר יְהוֹנָתָן אֶת־החצי [הַחִצִּים] וַיָּבֹא אֶל־אֲדֹנָיו׃
    hebrewPlain: ויקרא יהונתן אחרי הנער מהרה חושה אל תעמד וילקט נער יהונתן את החצי [החצים] ויבא אל אדניו
    kjvRefs:
    - 1 Samuel 20:38
    kjvOsis:
    - 1Sam.20.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.39
    scripture: tanakh
    name: Tanakh 1 Samuel 20:39
    ref: 1 Samuel 20:39
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 39
    ordinal: 7679
    text: But the lad knew not any thing; only Jonathan and David knew the matter.
    translation: JPS 1917
    original: וְהַנַּעַר לֹא־יָדַע מְאוּמָה אַךְ יְהוֹנָתָן וְדָוִד יָדְעוּ אֶת־הַדָּבָר׃
    hebrewPlain: והנער לא ידע מאומה אך יהונתן ודוד ידעו את הדבר
    kjvRefs:
    - 1 Samuel 20:39
    kjvOsis:
    - 1Sam.20.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.40
    scripture: tanakh
    name: Tanakh 1 Samuel 20:40
    ref: 1 Samuel 20:40
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 40
    ordinal: 7680
    text: 'And Jonathan gave his weapons unto his lad, and said unto him: ‘Go, carry them to the city.’'
    translation: JPS 1917
    original: וַיִּתֵּן יְהוֹנָתָן אֶת־כֵּלָיו אֶל־הַנַּעַר אֲשֶׁר־לוֹ וַיֹּאמֶר לוֹ לֵךְ הָבֵיא הָעִיר׃
    hebrewPlain: ויתן יהונתן את כליו אל הנער אשר לו ויאמר לו לך הביא העיר
    kjvRefs:
    - 1 Samuel 20:40
    kjvOsis:
    - 1Sam.20.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.41
    scripture: tanakh
    name: Tanakh 1 Samuel 20:41
    ref: 1 Samuel 20:41
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 41
    ordinal: 7681
    text: And as soon as the lad was gone, David arose out of a place toward the South, and fell on his face to the ground, and bowed down three times; and they kissed one another, and wept one with another, until David exceeded.
    translation: JPS 1917
    original: הַנַּעַר בָּא וְדָוִד קָם מֵאֵצֶל הַנֶּגֶב וַיִּפֹּל לְאַפָּיו אַרְצָה וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים וַיִּשְּׁקוּ אִישׁ אֶת־רֵעֵהוּ וַיִּבְכּוּ אִישׁ אֶת־רֵעֵהוּ עַד־דָּוִד הִגְדִּיל׃
    hebrewPlain: הנער בא ודוד קם מאצל הנגב ויפל לאפיו ארצה וישתחו שלש פעמים וישקו איש את רעהו ויבכו איש את רעהו עד דוד הגדיל
    kjvRefs:
    - 1 Samuel 20:41
    kjvOsis:
    - 1Sam.20.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.20.42
    scripture: tanakh
    name: Tanakh 1 Samuel 20:42
    ref: 1 Samuel 20:42
    book: 1Sam
    section: neviim
    chapter: 20
    verse: 42
    ordinal: 7682
    text: 'And Jonathan said to David: ‘Go in peace, forasmuch as we have sworn both of us in the name of the LORD, saying: The LORD shall be between me and thee, and Between my seed and thy seed, for ever.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן לְדָוִד לֵךְ לְשָׁלוֹם אֲשֶׁר נִשְׁבַּעְנוּ שְׁנֵינוּ אֲנַחְנוּ בְּשֵׁם יְהוָה לֵאמֹר יְהוָה יִהְיֶה בֵּינִי וּבֵינֶךָ וּבֵין זַרְעִי וּבֵין זַרְעֲךָ עַד־עוֹלָם׃
    hebrewPlain: ויאמר יהונתן לדוד לך לשלום אשר נשבענו שנינו אנחנו בשם יהוה לאמר יהוה יהיה ביני ובינך ובין זרעי ובין זרעך עד עולם
    kjvRefs:
    - 1 Samuel 20:42
    kjvOsis:
    - 1Sam.20.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.20
- type: TanakhVerse
  data:
    osis: 1Sam.21.1
    scripture: tanakh
    name: Tanakh 1 Samuel 21:1
    ref: 1 Samuel 21:1
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 1
    ordinal: 7683
    text: And he arose and departed; and Jonathan went into the city.
    translation: JPS 1917
    original: וַיָּקָם וַיֵּלַךְ וִיהוֹנָתָן בָּא הָעִיר׃
    hebrewPlain: ויקם וילך ויהונתן בא העיר
    kjvRefs:
    - 1 Samuel 20:42
    kjvOsis:
    - 1Sam.20.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.2
    scripture: tanakh
    name: Tanakh 1 Samuel 21:2
    ref: 1 Samuel 21:2
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 2
    ordinal: 7684
    text: 'Then came David to Nob to Ahimelech the priest; and Ahimelech came to meet David trembling, and said unto him: ‘Why art thou alone, and no man with thee?’'
    translation: JPS 1917
    original: וַיָּבֹא דָוִד נֹבֶה אֶל־אֲחִימֶלֶךְ הַכֹּהֵן וַיֶּחֱרַד אֲחִימֶלֶךְ לִקְרַאת דָּוִד וַיֹּאמֶר לוֹ מַדּוּעַ אַתָּה לְבַדֶּךָ וְאִישׁ אֵין אִתָּךְ׃
    hebrewPlain: ויבא דוד נבה אל אחימלך הכהן ויחרד אחימלך לקראת דוד ויאמר לו מדוע אתה לבדך ואיש אין אתך
    kjvRefs:
    - 1 Samuel 21:1
    kjvOsis:
    - 1Sam.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.3
    scripture: tanakh
    name: Tanakh 1 Samuel 21:3
    ref: 1 Samuel 21:3
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 3
    ordinal: 7685
    text: 'And David said unto Ahimelech the priest: ‘The king hath commanded me a business, and hath said unto me: Let no man know any thing of the business whereabout I send thee, and what I have commanded thee; and the young men have I appointed to such and such a place.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ הַכֹּהֵן הַמֶּלֶךְ צִוַּנִי דָבָר וַיֹּאמֶר אֵלַי אִישׁ אַל־יֵדַע מְאוּמָה אֶת־הַדָּבָר אֲשֶׁר־אָנֹכִי שֹׁלֵחֲךָ וַאֲשֶׁר צִוִּיתִךָ וְאֶת־הַנְּעָרִים יוֹדַעְתִּי אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי׃
    hebrewPlain: ויאמר דוד לאחימלך הכהן המלך צוני דבר ויאמר אלי איש אל ידע מאומה את הדבר אשר אנכי שלחך ואשר צויתך ואת הנערים יודעתי אל מקום פלני אלמוני
    kjvRefs:
    - 1 Samuel 21:2
    kjvOsis:
    - 1Sam.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.4
    scripture: tanakh
    name: Tanakh 1 Samuel 21:4
    ref: 1 Samuel 21:4
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 4
    ordinal: 7686
    text: Now therefore what is under thy hand? five loaves of bread? give them in my hand, or whatsoever there is present.’
    translation: JPS 1917
    original: וְעַתָּה מַה־יֵּשׁ תַּחַת־יָדְךָ חֲמִשָּׁה־לֶחֶם תְּנָה בְיָדִי אוֹ הַנִּמְצָא׃
    hebrewPlain: ועתה מה יש תחת ידך חמשה לחם תנה בידי או הנמצא
    kjvRefs:
    - 1 Samuel 21:3
    kjvOsis:
    - 1Sam.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.5
    scripture: tanakh
    name: Tanakh 1 Samuel 21:5
    ref: 1 Samuel 21:5
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 5
    ordinal: 7687
    text: 'And the priest answered David, and said: ‘There is no common bread under my hand, but there is holy bread; if only the young men have kept themselves from women.’'
    translation: JPS 1917
    original: וַיַּעַן הַכֹּהֵן אֶת־דָּוִד וַיֹּאמֶר אֵין־לֶחֶם חֹל אֶל־תַּחַת יָדִי כִּי־אִם־לֶחֶם קֹדֶשׁ יֵשׁ אִם־נִשְׁמְרוּ הַנְּעָרִים אַךְ מֵאִשָּׁה׃
    hebrewPlain: ויען הכהן את דוד ויאמר אין לחם חל אל תחת ידי כי אם לחם קדש יש אם נשמרו הנערים אך מאשה
    kjvRefs:
    - 1 Samuel 21:4
    kjvOsis:
    - 1Sam.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.6
    scripture: tanakh
    name: Tanakh 1 Samuel 21:6
    ref: 1 Samuel 21:6
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 6
    ordinal: 7688
    text: 'And David answered the priest, and said unto him: ‘Of a truth women have been kept from us about these three days; when I came out, the vessels of the young men were holy, though it was but a common journey; how much more then to-day, when there shall be holy bread in their vessels?’'
    translation: JPS 1917
    original: וַיַּעַן דָּוִד אֶת־הַכֹּהֵן וַיֹּאמֶר לוֹ כִּי אִם־אִשָּׁה עֲצֻרָה־לָנוּ כִּתְמוֹל שִׁלְשֹׁם בְּצֵאתִי וַיִּהְיוּ כְלֵי־הַנְּעָרִים קֹדֶשׁ וְהוּא דֶּרֶךְ חֹל וְאַף כִּי הַיּוֹם יִקְדַּשׁ בַּכֶּלִי׃
    hebrewPlain: ויען דוד את הכהן ויאמר לו כי אם אשה עצרה לנו כתמול שלשם בצאתי ויהיו כלי הנערים קדש והוא דרך חל ואף כי היום יקדש בכלי
    kjvRefs:
    - 1 Samuel 21:5
    kjvOsis:
    - 1Sam.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.7
    scripture: tanakh
    name: Tanakh 1 Samuel 21:7
    ref: 1 Samuel 21:7
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 7
    ordinal: 7689
    text: So the priest gave him holy bread; for there was no bread there but the showbread, that was taken from before the LORD, to put hot bread in the day when it was taken away.—
    translation: JPS 1917
    original: וַיִּתֶּן־לוֹ הַכֹּהֵן קֹדֶשׁ כִּי לֹא־הָיָה שָׁם לֶחֶם כִּי־אִם־לֶחֶם הַפָּנִים הַמּוּסָרִים מִלִּפְנֵי יְהוָה לָשׂוּם לֶחֶם חֹם בְּיוֹם הִלָּקְחוֹ׃
    hebrewPlain: ויתן לו הכהן קדש כי לא היה שם לחם כי אם לחם הפנים המוסרים מלפני יהוה לשום לחם חם ביום הלקחו
    kjvRefs:
    - 1 Samuel 21:6
    kjvOsis:
    - 1Sam.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.8
    scripture: tanakh
    name: Tanakh 1 Samuel 21:8
    ref: 1 Samuel 21:8
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 8
    ordinal: 7690
    text: Now a certain man of the servants of Saul was there that day, detained before the LORD; and his name was Doeg the Edomite, the chiefest of the herdmen that belonged to Saul.—
    translation: JPS 1917
    original: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל בַּיּוֹם הַהוּא נֶעְצָר לִפְנֵי יְהוָה וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל׃
    hebrewPlain: ושם איש מעבדי שאול ביום ההוא נעצר לפני יהוה ושמו דאג האדמי אביר הרעים אשר לשאול
    kjvRefs:
    - 1 Samuel 21:7
    kjvOsis:
    - 1Sam.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.9
    scripture: tanakh
    name: Tanakh 1 Samuel 21:9
    ref: 1 Samuel 21:9
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 9
    ordinal: 7691
    text: 'And David said unto Ahimelech: ‘And is there peradventure here under thy hand spear or sword? for I have neither brought my sword nor my weapons with me, because the king’s business required haste.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ וְאִין יֶשׁ־פֹּה תַחַת־יָדְךָ חֲנִית אוֹ־חָרֶב כִּי גַם־חַרְבִּי וְגַם־כֵּלַי לֹא־לָקַחְתִּי בְיָדִי כִּי־הָיָה דְבַר־הַמֶּלֶךְ נָחוּץ׃
    hebrewPlain: ויאמר דוד לאחימלך ואין יש פה תחת ידך חנית או חרב כי גם חרבי וגם כלי לא לקחתי בידי כי היה דבר המלך נחוץ
    kjvRefs:
    - 1 Samuel 21:8
    kjvOsis:
    - 1Sam.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.10
    scripture: tanakh
    name: Tanakh 1 Samuel 21:10
    ref: 1 Samuel 21:10
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 10
    ordinal: 7692
    text: 'And the priest said: ‘The sword of Goliath the Philistine, whom thou slewest in the vale of Elah, behold, it is here wrapped in a cloth behind the ephod; if thou wilt take that, take it; for there is no other save that here.’ And David said: ‘There is none like that; give it me.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַכֹּהֵן חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי אֲשֶׁר־הִכִּיתָ בְּעֵמֶק הָאֵלָה הִנֵּה־הִיא לוּטָה בַשִּׂמְלָה אַחֲרֵי הָאֵפוֹד אִם־אֹתָהּ תִּקַּח־לְךָ קָח כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה וַיֹּאמֶר דָּוִד אֵין כָּמוֹהָ תְּנֶנָּה לִּי׃
    hebrewPlain: ויאמר הכהן חרב גלית הפלשתי אשר הכית בעמק האלה הנה היא לוטה בשמלה אחרי האפוד אם אתה תקח לך קח כי אין אחרת זולתה בזה ויאמר דוד אין כמוה תננה לי
    kjvRefs:
    - 1 Samuel 21:9
    kjvOsis:
    - 1Sam.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.11
    scripture: tanakh
    name: Tanakh 1 Samuel 21:11
    ref: 1 Samuel 21:11
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 11
    ordinal: 7693
    text: And David arose, and fled that day for fear of Saul, and went to Achish the king of Gath.
    translation: JPS 1917
    original: וַיָּקָם דָּוִד וַיִּבְרַח בַּיּוֹם־הַהוּא מִפְּנֵי שָׁאוּל וַיָּבֹא אֶל־אָכִישׁ מֶלֶךְ גַּת׃
    hebrewPlain: ויקם דוד ויברח ביום ההוא מפני שאול ויבא אל אכיש מלך גת
    kjvRefs:
    - 1 Samuel 21:10
    kjvOsis:
    - 1Sam.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.12
    scripture: tanakh
    name: Tanakh 1 Samuel 21:12
    ref: 1 Samuel 21:12
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 12
    ordinal: 7694
    text: 'And the servants of Achish said unto him: ‘Is not this David the king of the land? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, And David his ten thousands?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ עַבְדֵי אָכִישׁ אֵלָיו הֲלוֹא־זֶה דָוִד מֶלֶךְ הָאָרֶץ הֲלוֹא לָזֶה יַעֲנוּ בַמְּחֹלוֹת לֵאמֹר הִכָּה שָׁאוּל באלפו [בַּאֲלָפָיו] וְדָוִד ברבבתו [בְּרִבְבֹתָיו׃]
    hebrewPlain: ויאמרו עבדי אכיש אליו הלוא זה דוד מלך הארץ הלוא לזה יענו במחלות לאמר הכה שאול באלפו [באלפיו] ודוד ברבבתו [ברבבתיו]
    kjvRefs:
    - 1 Samuel 21:11
    kjvOsis:
    - 1Sam.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.13
    scripture: tanakh
    name: Tanakh 1 Samuel 21:13
    ref: 1 Samuel 21:13
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 13
    ordinal: 7695
    text: And David laid up these words in his heart, and was sore afraid of Achish the king of Gath.
    translation: JPS 1917
    original: וַיָּשֶׂם דָּוִד אֶת־הַדְּבָרִים הָאֵלֶּה בִּלְבָבוֹ וַיִּרָא מְאֹד מִפְּנֵי אָכִישׁ מֶלֶךְ־גַּת׃
    hebrewPlain: וישם דוד את הדברים האלה בלבבו וירא מאד מפני אכיש מלך גת
    kjvRefs:
    - 1 Samuel 21:12
    kjvOsis:
    - 1Sam.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.14
    scripture: tanakh
    name: Tanakh 1 Samuel 21:14
    ref: 1 Samuel 21:14
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 14
    ordinal: 7696
    text: And he changed his demeanour before them, and feigned himself mad in their hands, and scrabbled on the doors of the gate, and let his spittle fall down upon his beard.
    translation: JPS 1917
    original: וַיְשַׁנּוֹ אֶת־טַעְמוֹ בְּעֵינֵיהֶם וַיִּתְהֹלֵל בְּיָדָם ויתו [וַיְתָיו] עַל־דַּלְתוֹת הַשַּׁעַר וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ׃
    hebrewPlain: וישנו את טעמו בעיניהם ויתהלל בידם ויתו [ויתיו] על דלתות השער ויורד רירו אל זקנו
    kjvRefs:
    - 1 Samuel 21:13
    kjvOsis:
    - 1Sam.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.15
    scripture: tanakh
    name: Tanakh 1 Samuel 21:15
    ref: 1 Samuel 21:15
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 15
    ordinal: 7697
    text: 'Then said Achish unto his servants: ‘Lo, when ye see a man that is mad, wherefore do ye bring him to me?'
    translation: JPS 1917
    original: וַיֹּאמֶר אָכִישׁ אֶל־עֲבָדָיו הִנֵּה תִרְאוּ אִישׁ מִשְׁתַּגֵּעַ לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי׃
    hebrewPlain: ויאמר אכיש אל עבדיו הנה תראו איש משתגע למה תביאו אתו אלי
    kjvRefs:
    - 1 Samuel 21:14
    kjvOsis:
    - 1Sam.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.21.16
    scripture: tanakh
    name: Tanakh 1 Samuel 21:16
    ref: 1 Samuel 21:16
    book: 1Sam
    section: neviim
    chapter: 21
    verse: 16
    ordinal: 7698
    text: Do I lack madmen, that ye have brought this fellow to play the madman in my presence? shall this fellow come into my house?’
    translation: JPS 1917
    original: חֲסַר מְשֻׁגָּעִים אָנִי כִּי־הֲבֵאתֶם אֶת־זֶה לְהִשְׁתַּגֵּעַ עָלָי הֲזֶה יָבוֹא אֶל־בֵּיתִי׃
    hebrewPlain: חסר משגעים אני כי הבאתם את זה להשתגע עלי הזה יבוא אל ביתי
    kjvRefs:
    - 1 Samuel 21:15
    kjvOsis:
    - 1Sam.21.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.21
- type: TanakhVerse
  data:
    osis: 1Sam.22.1
    scripture: tanakh
    name: Tanakh 1 Samuel 22:1
    ref: 1 Samuel 22:1
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 1
    ordinal: 7699
    text: David therefore departed thence, and escaped to the cave of Adullam; and when his brethren and all his father’s house heard it, they went down thither to him.
    translation: JPS 1917
    original: וַיֵּלֶךְ דָּוִד מִשָּׁם וַיִּמָּלֵט אֶל־מְעָרַת עֲדֻלָּם וַיִּשְׁמְעוּ אֶחָיו וְכָל־בֵּית אָבִיו וַיֵּרְדוּ אֵלָיו שָׁמָּה׃
    hebrewPlain: וילך דוד משם וימלט אל מערת עדלם וישמעו אחיו וכל בית אביו וירדו אליו שמה
    kjvRefs:
    - 1 Samuel 22:1
    kjvOsis:
    - 1Sam.22.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.2
    scripture: tanakh
    name: Tanakh 1 Samuel 22:2
    ref: 1 Samuel 22:2
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 2
    ordinal: 7700
    text: And every one that was in distress, and every one that was in debt, and every one that was discontented, gathered themselves unto him; and he became captain over them; and there were with him about four hundred men.
    translation: JPS 1917
    original: וַיִּתְקַבְּצוּ אֵלָיו כָּל־אִישׁ מָצוֹק וְכָל־אִישׁ אֲשֶׁר־לוֹ נֹשֶׁא וְכָל־אִישׁ מַר־נֶפֶשׁ וַיְהִי עֲלֵיהֶם לְשָׂר וַיִּהְיוּ עִמּוֹ כְּאַרְבַּע מֵאוֹת אִישׁ׃
    hebrewPlain: ויתקבצו אליו כל איש מצוק וכל איש אשר לו נשא וכל איש מר נפש ויהי עליהם לשר ויהיו עמו כארבע מאות איש
    kjvRefs:
    - 1 Samuel 22:2
    kjvOsis:
    - 1Sam.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.3
    scripture: tanakh
    name: Tanakh 1 Samuel 22:3
    ref: 1 Samuel 22:3
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 3
    ordinal: 7701
    text: 'And David went thence to Mizpeh of Moab; and he said unto the king of Moab: ‘Let my father and my mother, I pray thee, come forth, and be with you, till I know what God will do for me.’'
    translation: JPS 1917
    original: וַיֵּלֶךְ דָּוִד מִשָּׁם מִצְפֵּה מוֹאָב וַיֹּאמֶר אֶל־מֶלֶךְ מוֹאָב יֵצֵא־נָא אָבִי וְאִמִּי אִתְּכֶם עַד אֲשֶׁר אֵדַע מַה־יַּעֲשֶׂה־לִּי אֱלֹהִים׃
    hebrewPlain: וילך דוד משם מצפה מואב ויאמר אל מלך מואב יצא נא אבי ואמי אתכם עד אשר אדע מה יעשה לי אלהים
    kjvRefs:
    - 1 Samuel 22:3
    kjvOsis:
    - 1Sam.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.4
    scripture: tanakh
    name: Tanakh 1 Samuel 22:4
    ref: 1 Samuel 22:4
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 4
    ordinal: 7702
    text: And he brought them before the king of Moab; and they dwelt with him all the while that David was in the stronghold.
    translation: JPS 1917
    original: וַיַּנְחֵם אֶת־פְּנֵי מֶלֶךְ מוֹאָב וַיֵּשְׁבוּ עִמּוֹ כָּל־יְמֵי הֱיוֹת־דָּוִד בַּמְּצוּדָה׃
    hebrewPlain: וינחם את פני מלך מואב וישבו עמו כל ימי היות דוד במצודה
    kjvRefs:
    - 1 Samuel 22:4
    kjvOsis:
    - 1Sam.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.5
    scripture: tanakh
    name: Tanakh 1 Samuel 22:5
    ref: 1 Samuel 22:5
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 5
    ordinal: 7703
    text: 'And the prophet Gad said unto David: ‘Abide not in the stronghold; depart, and get thee into the land of Judah.’ Then David departed, and came into the forest of Hereth.'
    translation: JPS 1917
    original: וַיֹּאמֶר גָּד הַנָּבִיא אֶל־דָּוִד לֹא תֵשֵׁב בַּמְּצוּדָה לֵךְ וּבָאתָ־לְּךָ אֶרֶץ יְהוּדָה וַיֵּלֶךְ דָּוִד וַיָּבֹא יַעַר חָרֶת׃
    hebrewPlain: ויאמר גד הנביא אל דוד לא תשב במצודה לך ובאת לך ארץ יהודה וילך דוד ויבא יער חרת
    kjvRefs:
    - 1 Samuel 22:5
    kjvOsis:
    - 1Sam.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.6
    scripture: tanakh
    name: Tanakh 1 Samuel 22:6
    ref: 1 Samuel 22:6
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 6
    ordinal: 7704
    text: And Saul heard that David was discovered, and the men that were with him; now Saul was sitting in Gibeah, under the tamarisk-tree in Ramah, with his spear in his hand, and all his servants were standing about him.
    translation: JPS 1917
    original: וַיִּשְׁמַע שָׁאוּל כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ וְשָׁאוּל יוֹשֵׁב בַּגִּבְעָה תַּחַת־הָאֶשֶׁל בָּרָמָה וַחֲנִיתוֹ בְיָדוֹ וְכָל־עֲבָדָיו נִצָּבִים עָלָיו׃
    hebrewPlain: וישמע שאול כי נודע דוד ואנשים אשר אתו ושאול יושב בגבעה תחת האשל ברמה וחניתו בידו וכל עבדיו נצבים עליו
    kjvRefs:
    - 1 Samuel 22:6
    kjvOsis:
    - 1Sam.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.7
    scripture: tanakh
    name: Tanakh 1 Samuel 22:7
    ref: 1 Samuel 22:7
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 7
    ordinal: 7705
    text: 'And Saul said unto his servants that stood about him: ‘Hear now, ye Benjamites; will the son of Jesse give every one of you fields and vineyards, will he make you all captains of thousands and captains of hundreds;'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לַעֲבָדָיו הַנִּצָּבִים עָלָיו שִׁמְעוּ־נָא בְּנֵי יְמִינִי גַּם־לְכֻלְּכֶם יִתֵּן בֶּן־יִשַׁי שָׂדוֹת וּכְרָמִים לְכֻלְּכֶם יָשִׂים שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת׃
    hebrewPlain: ויאמר שאול לעבדיו הנצבים עליו שמעו נא בני ימיני גם לכלכם יתן בן ישי שדות וכרמים לכלכם ישים שרי אלפים ושרי מאות
    kjvRefs:
    - 1 Samuel 22:7
    kjvOsis:
    - 1Sam.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.8
    scripture: tanakh
    name: Tanakh 1 Samuel 22:8
    ref: 1 Samuel 22:8
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 8
    ordinal: 7706
    text: that all of you have conspired against me, and there was none that disclosed it to me when my son made a league with the son of Jesse, and there is none of you that is sorry for me, or discloseth unto me that my son hath stirred up my servant against me, to lie in wait, as at this day?’
    translation: JPS 1917
    original: כִּי קְשַׁרְתֶּם כֻּלְּכֶם עָלַי וְאֵין־גֹּלֶה אֶת־אָזְנִי בִּכְרָת־בְּנִי עִם־בֶּן־יִשַׁי וְאֵין־חֹלֶה מִכֶּם עָלַי וְגֹלֶה אֶת־אָזְנִי כִּי הֵקִים בְּנִי אֶת־עַבְדִּי עָלַי לְאֹרֵב כַּיּוֹם הַזֶּה׃
    hebrewPlain: כי קשרתם כלכם עלי ואין גלה את אזני בכרת בני עם בן ישי ואין חלה מכם עלי וגלה את אזני כי הקים בני את עבדי עלי לארב כיום הזה
    kjvRefs:
    - 1 Samuel 22:8
    kjvOsis:
    - 1Sam.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.9
    scripture: tanakh
    name: Tanakh 1 Samuel 22:9
    ref: 1 Samuel 22:9
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 9
    ordinal: 7707
    text: 'Then answered Doeg the Edomite, who was set over the servants of Saul, and said: ‘I saw the son of Jesse coming to Nob, to Ahimelech the son of Ahitub.'
    translation: JPS 1917
    original: וַיַּעַן דֹּאֵג הָאֲדֹמִי וְהוּא נִצָּב עַל־עַבְדֵי־שָׁאוּל וַיֹּאמַר רָאִיתִי אֶת־בֶּן־יִשַׁי בָּא נֹבֶה אֶל־אֲחִימֶלֶךְ בֶּן־אֲחִטוּב׃
    hebrewPlain: ויען דאג האדמי והוא נצב על עבדי שאול ויאמר ראיתי את בן ישי בא נבה אל אחימלך בן אחטוב
    kjvRefs:
    - 1 Samuel 22:9
    kjvOsis:
    - 1Sam.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.10
    scripture: tanakh
    name: Tanakh 1 Samuel 22:10
    ref: 1 Samuel 22:10
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 10
    ordinal: 7708
    text: And he inquired of the LORD for him, and gave him victuals, and gave him the sword of Goliath the Philistine.’
    translation: JPS 1917
    original: וַיִּשְׁאַל־לוֹ בַּיהוָה וְצֵידָה נָתַן לוֹ וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי נָתַן לוֹ׃
    hebrewPlain: וישאל לו ביהוה וצידה נתן לו ואת חרב גלית הפלשתי נתן לו
    kjvRefs:
    - 1 Samuel 22:10
    kjvOsis:
    - 1Sam.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.11
    scripture: tanakh
    name: Tanakh 1 Samuel 22:11
    ref: 1 Samuel 22:11
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 11
    ordinal: 7709
    text: Then the king sent to call Ahimelech the priest, the son of Ahitub, and all his father’s house, the priests that were in Nob; and they came all of them to the king.
    translation: JPS 1917
    original: וַיִּשְׁלַח הַמֶּלֶךְ לִקְרֹא אֶת־אֲחִימֶלֶךְ בֶּן־אֲחִיטוּב הַכֹּהֵן וְאֵת כָּל־בֵּית אָבִיו הַכֹּהֲנִים אֲשֶׁר בְּנֹב וַיָּבֹאוּ כֻלָּם אֶל־הַמֶּלֶךְ׃
    hebrewPlain: וישלח המלך לקרא את אחימלך בן אחיטוב הכהן ואת כל בית אביו הכהנים אשר בנב ויבאו כלם אל המלך
    kjvRefs:
    - 1 Samuel 22:11
    kjvOsis:
    - 1Sam.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.12
    scripture: tanakh
    name: Tanakh 1 Samuel 22:12
    ref: 1 Samuel 22:12
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 12
    ordinal: 7710
    text: 'And Saul said: ‘Hear now, thou son of Ahitub.’ And he answered: ‘Here I am, my lord.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל שְׁמַע־נָא בֶּן־אֲחִיטוּב וַיֹּאמֶר הִנְנִי אֲדֹנִי׃
    hebrewPlain: ויאמר שאול שמע נא בן אחיטוב ויאמר הנני אדני
    kjvRefs:
    - 1 Samuel 22:12
    kjvOsis:
    - 1Sam.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.13
    scripture: tanakh
    name: Tanakh 1 Samuel 22:13
    ref: 1 Samuel 22:13
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 13
    ordinal: 7711
    text: 'And Saul said unto him: ‘Why have ye conspired against me, thou and the son of Jesse, in that thou hast given him bread, and a sword, and hast inquired of God for him, that he should rise against me, to lie in wait, as at this day?’'
    translation: JPS 1917
    original: וַיֹּאמֶר אלו [אֵלָיו] שָׁאוּל לָמָּה קְשַׁרְתֶּם עָלַי אַתָּה וּבֶן־יִשָׁי בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב וְשָׁאוֹל לוֹ בֵּאלֹהִים לָקוּם אֵלַי לְאֹרֵב כַּיּוֹם הַזֶּה׃
    hebrewPlain: ויאמר אלו [אליו] שאול למה קשרתם עלי אתה ובן ישי בתתך לו לחם וחרב ושאול לו באלהים לקום אלי לארב כיום הזה
    kjvRefs:
    - 1 Samuel 22:13
    kjvOsis:
    - 1Sam.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.14
    scripture: tanakh
    name: Tanakh 1 Samuel 22:14
    ref: 1 Samuel 22:14
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 14
    ordinal: 7712
    text: 'Then Ahimelech answered the king, and said: ‘And who among all thy servants is so trusted as David, who is the king’s son-in-law, and giveth heed unto thy bidding, and is honourable in thy house?'
    translation: JPS 1917
    original: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר וּמִי בְכָל־עֲבָדֶיךָ כְּדָוִד נֶאֱמָן וַחֲתַן הַמֶּלֶךְ וְסָר אֶל־מִשְׁמַעְתֶּךָ וְנִכְבָּד בְּבֵיתֶךָ׃
    hebrewPlain: ויען אחימלך את המלך ויאמר ומי בכל עבדיך כדוד נאמן וחתן המלך וסר אל משמעתך ונכבד בביתך
    kjvRefs:
    - 1 Samuel 22:14
    kjvOsis:
    - 1Sam.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.15
    scripture: tanakh
    name: Tanakh 1 Samuel 22:15
    ref: 1 Samuel 22:15
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 15
    ordinal: 7713
    text: Have I to-day begun to inquire of God for him? be it far from me; let not the king impute any thing unto his servant, nor to all the house of my father; for thy servant knoweth nothing of all this, less or more.’
    translation: JPS 1917
    original: הַיּוֹם הַחִלֹּתִי לשאול־[לִשְׁאָל־] לוֹ בֵאלֹהִים חָלִילָה לִּי אַל־יָשֵׂם הַמֶּלֶךְ בְּעַבְדּוֹ דָבָר בְּכָל־בֵּית אָבִי כִּי לֹא־יָדַע עַבְדְּךָ בְּכָל־זֹאת דָּבָר קָטֹן אוֹ גָדוֹל׃
    hebrewPlain: היום החלתי לשאול [לשאל ] לו באלהים חלילה לי אל ישם המלך בעבדו דבר בכל בית אבי כי לא ידע עבדך בכל זאת דבר קטן או גדול
    kjvRefs:
    - 1 Samuel 22:15
    kjvOsis:
    - 1Sam.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.16
    scripture: tanakh
    name: Tanakh 1 Samuel 22:16
    ref: 1 Samuel 22:16
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 16
    ordinal: 7714
    text: 'And the king said: ‘Thou shalt surely die, Ahimelech, thou, and all thy father’s house.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ מוֹת תָּמוּת אֲחִימֶלֶךְ אַתָּה וְכָל־בֵּית אָבִיךָ׃
    hebrewPlain: ויאמר המלך מות תמות אחימלך אתה וכל בית אביך
    kjvRefs:
    - 1 Samuel 22:16
    kjvOsis:
    - 1Sam.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.17
    scripture: tanakh
    name: Tanakh 1 Samuel 22:17
    ref: 1 Samuel 22:17
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 17
    ordinal: 7715
    text: 'And the king said unto the guard that stood about him: ‘Turn, and slay the priests of the LORD; because their hand also is with David, and because they knew that he fled, and did not disclose it to me.’ But the servants of the king would not put forth their hand to fall upon the priests of the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לָרָצִים הַנִּצָּבִים עָלָיו סֹבּוּ וְהָמִיתוּ כֹּהֲנֵי יְהוָה כִּי גַם־יָדָם עִם־דָּוִד וְכִי יָדְעוּ כִּי־בֹרֵחַ הוּא וְלֹא גָלוּ אֶת־אזנו [אָזְנִי] וְלֹא־אָבוּ עַבְדֵי הַמֶּלֶךְ לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ בְּכֹהֲנֵי יְהוָה׃
    hebrewPlain: ויאמר המלך לרצים הנצבים עליו סבו והמיתו כהני יהוה כי גם ידם עם דוד וכי ידעו כי ברח הוא ולא גלו את אזנו [אזני] ולא אבו עבדי המלך לשלח את ידם לפגע בכהני יהוה
    kjvRefs:
    - 1 Samuel 22:17
    kjvOsis:
    - 1Sam.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.18
    scripture: tanakh
    name: Tanakh 1 Samuel 22:18
    ref: 1 Samuel 22:18
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 18
    ordinal: 7716
    text: 'And the king said to Doeg: ‘Turn thou, and fall upon the priests.’ And Doeg the Edomite turned, and he fell upon the priests, and he slew on that day fourscore and five persons that did wear a linen ephod.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לדויג [לְדוֹאֵג] סֹב אַתָּה וּפְגַע בַּכֹּהֲנִים וַיִּסֹּב דויג [דּוֹאֵג] הָאֲדֹמִי וַיִּפְגַּע־הוּא בַּכֹּהֲנִים וַיָּמֶת בַּיּוֹם הַהוּא שְׁמֹנִים וַחֲמִשָּׁה אִישׁ נֹשֵׂא אֵפוֹד בָּד׃
    hebrewPlain: ויאמר המלך לדויג [לדואג] סב אתה ופגע בכהנים ויסב דויג [דואג] האדמי ויפגע הוא בכהנים וימת ביום ההוא שמנים וחמשה איש נשא אפוד בד
    kjvRefs:
    - 1 Samuel 22:18
    kjvOsis:
    - 1Sam.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.19
    scripture: tanakh
    name: Tanakh 1 Samuel 22:19
    ref: 1 Samuel 22:19
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 19
    ordinal: 7717
    text: And Nob, the city of the priests, smote he with the edge of the sword, both men and women, children and sucklings, and oxen and asses and sheep, with the edge of the sword.
    translation: JPS 1917
    original: וְאֵת נֹב עִיר־הַכֹּהֲנִים הִכָּה לְפִי־חֶרֶב מֵאִישׁ וְעַד־אִשָּׁה מֵעוֹלֵל וְעַד־יוֹנֵק וְשׁוֹר וַחֲמוֹר וָשֶׂה לְפִי־חָרֶב׃
    hebrewPlain: ואת נב עיר הכהנים הכה לפי חרב מאיש ועד אשה מעולל ועד יונק ושור וחמור ושה לפי חרב
    kjvRefs:
    - 1 Samuel 22:19
    kjvOsis:
    - 1Sam.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.20
    scripture: tanakh
    name: Tanakh 1 Samuel 22:20
    ref: 1 Samuel 22:20
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 20
    ordinal: 7718
    text: And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.
    translation: JPS 1917
    original: וַיִּמָּלֵט בֵּן־אֶחָד לַאֲחִימֶלֶךְ בֶּן־אֲחִטוּב וּשְׁמוֹ אֶבְיָתָר וַיִּבְרַח אַחֲרֵי דָוִד׃
    hebrewPlain: וימלט בן אחד לאחימלך בן אחטוב ושמו אביתר ויברח אחרי דוד
    kjvRefs:
    - 1 Samuel 22:20
    kjvOsis:
    - 1Sam.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.21
    scripture: tanakh
    name: Tanakh 1 Samuel 22:21
    ref: 1 Samuel 22:21
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 21
    ordinal: 7719
    text: And Abiathar told David that Saul had slain the LORD’S priests.
    translation: JPS 1917
    original: וַיַּגֵּד אֶבְיָתָר לְדָוִד כִּי הָרַג שָׁאוּל אֵת כֹּהֲנֵי יְהוָה׃
    hebrewPlain: ויגד אביתר לדוד כי הרג שאול את כהני יהוה
    kjvRefs:
    - 1 Samuel 22:21
    kjvOsis:
    - 1Sam.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.22
    scripture: tanakh
    name: Tanakh 1 Samuel 22:22
    ref: 1 Samuel 22:22
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 22
    ordinal: 7720
    text: 'And David said unto Abiathar: ‘I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul; I have brought about the death of all the persons of thy father’s house.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לְאֶבְיָתָר יָדַעְתִּי בַּיּוֹם הַהוּא כִּי־שָׁם דויג [דּוֹאֵג] הָאֲדֹמִי כִּי־הַגֵּד יַגִּיד לְשָׁאוּל אָנֹכִי סַבֹּתִי בְּכָל־נֶפֶשׁ בֵּית אָבִיךָ׃
    hebrewPlain: ויאמר דוד לאביתר ידעתי ביום ההוא כי שם דויג [דואג] האדמי כי הגד יגיד לשאול אנכי סבתי בכל נפש בית אביך
    kjvRefs:
    - 1 Samuel 22:22
    kjvOsis:
    - 1Sam.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.22.23
    scripture: tanakh
    name: Tanakh 1 Samuel 22:23
    ref: 1 Samuel 22:23
    book: 1Sam
    section: neviim
    chapter: 22
    verse: 23
    ordinal: 7721
    text: Abide thou with me, fear not; for he that seeketh my life seeketh thy life; for with me thou shalt be in safeguard.’
    translation: JPS 1917
    original: שְׁבָה אִתִּי אַל־תִּירָא כִּי אֲשֶׁר־יְבַקֵּשׁ אֶת־נַפְשִׁי יְבַקֵּשׁ אֶת־נַפְשֶׁךָ כִּי־מִשְׁמֶרֶת אַתָּה עִמָּדִי׃
    hebrewPlain: שבה אתי אל תירא כי אשר יבקש את נפשי יבקש את נפשך כי משמרת אתה עמדי
    kjvRefs:
    - 1 Samuel 22:23
    kjvOsis:
    - 1Sam.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.22
- type: TanakhVerse
  data:
    osis: 1Sam.23.1
    scripture: tanakh
    name: Tanakh 1 Samuel 23:1
    ref: 1 Samuel 23:1
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 1
    ordinal: 7722
    text: 'And they told David, saying: ‘Behold, the Philistines are fighting against Keilah, and they rob the threshing-floors.’'
    translation: JPS 1917
    original: וַיַּגִּדוּ לְדָוִד לֵאמֹר הִנֵּה פְלִשְׁתִּים נִלְחָמִים בִּקְעִילָה וְהֵמָּה שֹׁסִים אֶת־הַגֳּרָנוֹת׃
    hebrewPlain: ויגדו לדוד לאמר הנה פלשתים נלחמים בקעילה והמה שסים את הגרנות
    kjvRefs:
    - 1 Samuel 23:1
    kjvOsis:
    - 1Sam.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.2
    scripture: tanakh
    name: Tanakh 1 Samuel 23:2
    ref: 1 Samuel 23:2
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 2
    ordinal: 7723
    text: 'Therefore David inquired of the LORD, saying: ‘Shall I go and smite these Philistines?’ And the LORD said unto David: ‘Go, and smite the Philistines, and save Keilah.’'
    translation: JPS 1917
    original: וַיִּשְׁאַל דָּוִד בַּיהוָה לֵאמֹר הַאֵלֵךְ וְהִכֵּיתִי בַּפְּלִשְׁתִּים הָאֵלֶּה וַיֹּאמֶר יְהוָה אֶל־דָּוִד לֵךְ וְהִכִּיתָ בַפְּלִשְׁתִּים וְהוֹשַׁעְתָּ אֶת־קְעִילָה׃
    hebrewPlain: וישאל דוד ביהוה לאמר האלך והכיתי בפלשתים האלה ויאמר יהוה אל דוד לך והכית בפלשתים והושעת את קעילה
    kjvRefs:
    - 1 Samuel 23:2
    kjvOsis:
    - 1Sam.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.3
    scripture: tanakh
    name: Tanakh 1 Samuel 23:3
    ref: 1 Samuel 23:3
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 3
    ordinal: 7724
    text: 'And David’s men said unto him: ‘Behold, we are afraid here in Judah; how much more then if we go to Keilah against the armies of the Philistines?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו הִנֵּה אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים וְאַף כִּי־נֵלֵךְ קְעִלָה אֶל־מַעַרְכוֹת פְּלִשְׁתִּים׃
    hebrewPlain: ויאמרו אנשי דוד אליו הנה אנחנו פה ביהודה יראים ואף כי נלך קעלה אל מערכות פלשתים
    kjvRefs:
    - 1 Samuel 23:3
    kjvOsis:
    - 1Sam.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.4
    scripture: tanakh
    name: Tanakh 1 Samuel 23:4
    ref: 1 Samuel 23:4
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 4
    ordinal: 7725
    text: 'Then David inquired of the LORD yet again. And the LORD answered him and said: ‘Arise, go down to Keilah; for I will deliver the Philistines into thy hand.’'
    translation: JPS 1917
    original: וַיּוֹסֶף עוֹד דָּוִד לִשְׁאֹל בַּיהוָה וַיַּעֲנֵהוּ יְהוָה וַיֹּאמֶר קוּם רֵד קְעִילָה כִּי־אֲנִי נֹתֵן אֶת־פְּלִשְׁתִּים בְּיָדֶךָ׃
    hebrewPlain: ויוסף עוד דוד לשאל ביהוה ויענהו יהוה ויאמר קום רד קעילה כי אני נתן את פלשתים בידך
    kjvRefs:
    - 1 Samuel 23:4
    kjvOsis:
    - 1Sam.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.5
    scripture: tanakh
    name: Tanakh 1 Samuel 23:5
    ref: 1 Samuel 23:5
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 5
    ordinal: 7726
    text: And David and his men went to Keilah, and fought with the Philistines, and brought away their cattle, and slew them with a great slaughter. So David saved the inhabitants of Keilah.
    translation: JPS 1917
    original: וַיֵּלֶךְ דָּוִד ואנשו [וַאֲנָשָׁיו] קְעִילָה וַיִּלָּחֶם בַּפְּלִשְׁתִּים וַיִּנְהַג אֶת־מִקְנֵיהֶם וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה וַיֹּשַׁע דָּוִד אֵת יֹשְׁבֵי קְעִילָה׃
    hebrewPlain: וילך דוד ואנשו [ואנשיו] קעילה וילחם בפלשתים וינהג את מקניהם ויך בהם מכה גדולה וישע דוד את ישבי קעילה
    kjvRefs:
    - 1 Samuel 23:5
    kjvOsis:
    - 1Sam.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.6
    scripture: tanakh
    name: Tanakh 1 Samuel 23:6
    ref: 1 Samuel 23:6
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 6
    ordinal: 7727
    text: And it came to pass, when Abiathar the son of Ahimelech fled to David to Keilah, that he came down with an ephod in his hand.
    translation: JPS 1917
    original: וַיְהִי בִּבְרֹחַ אֶבְיָתָר בֶּן־אֲחִימֶלֶךְ אֶל־דָּוִד קְעִילָה אֵפוֹד יָרַד בְּיָדוֹ׃
    hebrewPlain: ויהי בברח אביתר בן אחימלך אל דוד קעילה אפוד ירד בידו
    kjvRefs:
    - 1 Samuel 23:6
    kjvOsis:
    - 1Sam.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.7
    scripture: tanakh
    name: Tanakh 1 Samuel 23:7
    ref: 1 Samuel 23:7
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 7
    ordinal: 7728
    text: 'And it was told Saul that David was come to Keilah. And Saul said: ‘God hath delivered him into my hand; for he is shut in, by entering into a town that hath gates and bars.’'
    translation: JPS 1917
    original: וַיֻּגַּד לְשָׁאוּל כִּי־בָא דָוִד קְעִילָה וַיֹּאמֶר שָׁאוּל נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי כִּי נִסְגַּר לָבוֹא בְּעִיר דְּלָתַיִם וּבְרִיחַ׃
    hebrewPlain: ויגד לשאול כי בא דוד קעילה ויאמר שאול נכר אתו אלהים בידי כי נסגר לבוא בעיר דלתים ובריח
    kjvRefs:
    - 1 Samuel 23:7
    kjvOsis:
    - 1Sam.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.8
    scripture: tanakh
    name: Tanakh 1 Samuel 23:8
    ref: 1 Samuel 23:8
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 8
    ordinal: 7729
    text: And Saul summoned all the people to war, to go down to Keilah, to besiege David and his men.
    translation: JPS 1917
    original: וַיְשַׁמַּע שָׁאוּל אֶת־כָּל־הָעָם לַמִּלְחָמָה לָרֶדֶת קְעִילָה לָצוּר אֶל־דָּוִד וְאֶל־אֲנָשָׁיו׃
    hebrewPlain: וישמע שאול את כל העם למלחמה לרדת קעילה לצור אל דוד ואל אנשיו
    kjvRefs:
    - 1 Samuel 23:8
    kjvOsis:
    - 1Sam.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.9
    scripture: tanakh
    name: Tanakh 1 Samuel 23:9
    ref: 1 Samuel 23:9
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 9
    ordinal: 7730
    text: 'And David knew that Saul devised mischief against him; and he said to Abiathar the priest: ‘Bring hither the ephod.’'
    translation: JPS 1917
    original: וַיֵּדַע דָּוִד כִּי עָלָיו שָׁאוּל מַחֲרִישׁ הָרָעָה וַיֹּאמֶר אֶל־אֶבְיָתָר הַכֹּהֵן הַגִּישָׁה הָאֵפוֹד׃
    hebrewPlain: וידע דוד כי עליו שאול מחריש הרעה ויאמר אל אביתר הכהן הגישה האפוד
    kjvRefs:
    - 1 Samuel 23:9
    kjvOsis:
    - 1Sam.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.10
    scripture: tanakh
    name: Tanakh 1 Samuel 23:10
    ref: 1 Samuel 23:10
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 10
    ordinal: 7731
    text: 'Then said David: ‘O LORD, the God of Israel, Thy servant hath surely heard that Saul seeketh to come to Keilah, to destroy the city for my sake.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד יְהוָה אֱלֹהֵי יִשְׂרָאֵל שָׁמֹעַ שָׁמַע עַבְדְּךָ כִּי־מְבַקֵּשׁ שָׁאוּל לָבוֹא אֶל־קְעִילָה לְשַׁחֵת לָעִיר בַּעֲבוּרִי׃
    hebrewPlain: ויאמר דוד יהוה אלהי ישראל שמע שמע עבדך כי מבקש שאול לבוא אל קעילה לשחת לעיר בעבורי
    kjvRefs:
    - 1 Samuel 23:10
    kjvOsis:
    - 1Sam.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.11
    scripture: tanakh
    name: Tanakh 1 Samuel 23:11
    ref: 1 Samuel 23:11
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 11
    ordinal: 7732
    text: 'Will the men of Keilah deliver me up into his hand? will Saul come down, as Thy servant hath heard?’ O LORD, the God of Israel, I beseech Thee, tell Thy servant.’ And the LORD said: ‘He will come down.’'
    translation: JPS 1917
    original: הֲיַסְגִּרֻנִי בַעֲלֵי קְעִילָה בְיָדוֹ הֲיֵרֵד שָׁאוּל כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ יְהוָה אֱלֹהֵי יִשְׂרָאֵל הַגֶּד־נָא לְעַבְדֶּךָ וַיֹּאמֶר יְהוָה יֵרֵד׃
    hebrewPlain: היסגרני בעלי קעילה בידו הירד שאול כאשר שמע עבדך יהוה אלהי ישראל הגד נא לעבדך ויאמר יהוה ירד
    kjvRefs:
    - 1 Samuel 23:11
    kjvOsis:
    - 1Sam.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.12
    scripture: tanakh
    name: Tanakh 1 Samuel 23:12
    ref: 1 Samuel 23:12
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 12
    ordinal: 7733
    text: 'Then said David: ‘Will the men of Keilah deliver up me and my men into the hand of Saul?’ And the LORD said: ‘They will deliver thee up.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד הֲיַסְגִּרוּ בַּעֲלֵי קְעִילָה אֹתִי וְאֶת־אֲנָשַׁי בְּיַד־שָׁאוּל וַיֹּאמֶר יְהוָה יַסְגִּירוּ׃
    hebrewPlain: ויאמר דוד היסגרו בעלי קעילה אתי ואת אנשי ביד שאול ויאמר יהוה יסגירו
    kjvRefs:
    - 1 Samuel 23:12
    kjvOsis:
    - 1Sam.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.13
    scripture: tanakh
    name: Tanakh 1 Samuel 23:13
    ref: 1 Samuel 23:13
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 13
    ordinal: 7734
    text: Then David and his men, who were about six hundred, arose and departed out of Keilah, and went whithersoever they could go. And it was told Saul that David was escaped from Keilah; and he forbore to go forth.
    translation: JPS 1917
    original: וַיָּקָם דָּוִד וַאֲנָשָׁיו כְּשֵׁשׁ־מֵאוֹת אִישׁ וַיֵּצְאוּ מִקְּעִלָה וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ וּלְשָׁאוּל הֻגַּד כִּי־נִמְלַט דָּוִד מִקְּעִילָה וַיֶּחְדַּל לָצֵאת׃
    hebrewPlain: ויקם דוד ואנשיו כשש מאות איש ויצאו מקעלה ויתהלכו באשר יתהלכו ולשאול הגד כי נמלט דוד מקעילה ויחדל לצאת
    kjvRefs:
    - 1 Samuel 23:13
    kjvOsis:
    - 1Sam.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.14
    scripture: tanakh
    name: Tanakh 1 Samuel 23:14
    ref: 1 Samuel 23:14
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 14
    ordinal: 7735
    text: And David abode in the wilderness in the strongholds, and remained in the hill-country in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.
    translation: JPS 1917
    original: וַיֵּשֶׁב דָּוִד בַּמִּדְבָּר בַּמְּצָדוֹת וַיֵּשֶׁב בָּהָר בְּמִדְבַּר־זִיף וַיְבַקְשֵׁהוּ שָׁאוּל כָּל־הַיָּמִים וְלֹא־נְתָנוֹ אֱלֹהִים בְּיָדוֹ׃
    hebrewPlain: וישב דוד במדבר במצדות וישב בהר במדבר זיף ויבקשהו שאול כל הימים ולא נתנו אלהים בידו
    kjvRefs:
    - 1 Samuel 23:14
    kjvOsis:
    - 1Sam.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.15
    scripture: tanakh
    name: Tanakh 1 Samuel 23:15
    ref: 1 Samuel 23:15
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 15
    ordinal: 7736
    text: And David saw that Saul was come out to seek his life; and David was in the wilderness of Ziph in the wood.
    translation: JPS 1917
    original: וַיַּרְא דָוִד כִּי־יָצָא שָׁאוּל לְבַקֵּשׁ אֶת־נַפְשׁוֹ וְדָוִד בְּמִדְבַּר־זִיף בַּחֹרְשָׁה׃
    hebrewPlain: וירא דוד כי יצא שאול לבקש את נפשו ודוד במדבר זיף בחרשה
    kjvRefs:
    - 1 Samuel 23:15
    kjvOsis:
    - 1Sam.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.16
    scripture: tanakh
    name: Tanakh 1 Samuel 23:16
    ref: 1 Samuel 23:16
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 16
    ordinal: 7737
    text: And Jonathan Saul’s son arose, and went to David into the wood, and strengthened his hand in God.
    translation: JPS 1917
    original: וַיָּקָם יְהוֹנָתָן בֶּן־שָׁאוּל וַיֵּלֶךְ אֶל־דָּוִד חֹרְשָׁה וַיְחַזֵּק אֶת־יָדוֹ בֵּאלֹהִים׃
    hebrewPlain: ויקם יהונתן בן שאול וילך אל דוד חרשה ויחזק את ידו באלהים
    kjvRefs:
    - 1 Samuel 23:16
    kjvOsis:
    - 1Sam.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.17
    scripture: tanakh
    name: Tanakh 1 Samuel 23:17
    ref: 1 Samuel 23:17
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 17
    ordinal: 7738
    text: 'And he said unto him: ‘Fear not; for the hand of Saul my father shall not find thee; and thou shalt be king over Israel, and I shall be next unto thee; and that also Saul my father knoweth.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו אַל־תִּירָא כִּי לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי וְאַתָּה תִּמְלֹךְ עַל־יִשְׂרָאֵל וְאָנֹכִי אֶהְיֶה־לְּךָ לְמִשְׁנֶה וְגַם־שָׁאוּל אָבִי יֹדֵעַ כֵּן׃
    hebrewPlain: ויאמר אליו אל תירא כי לא תמצאך יד שאול אבי ואתה תמלך על ישראל ואנכי אהיה לך למשנה וגם שאול אבי ידע כן
    kjvRefs:
    - 1 Samuel 23:17
    kjvOsis:
    - 1Sam.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.18
    scripture: tanakh
    name: Tanakh 1 Samuel 23:18
    ref: 1 Samuel 23:18
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 18
    ordinal: 7739
    text: And they two made a covenant before the LORD; and David abode in the wood, and Jonathan went to his house.
    translation: JPS 1917
    original: וַיִּכְרְתוּ שְׁנֵיהֶם בְּרִית לִפְנֵי יְהוָה וַיֵּשֶׁב דָּוִד בַּחֹרְשָׁה וִיהוֹנָתָן הָלַךְ לְבֵיתוֹ׃
    hebrewPlain: ויכרתו שניהם ברית לפני יהוה וישב דוד בחרשה ויהונתן הלך לביתו
    kjvRefs:
    - 1 Samuel 23:18
    kjvOsis:
    - 1Sam.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.19
    scripture: tanakh
    name: Tanakh 1 Samuel 23:19
    ref: 1 Samuel 23:19
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 19
    ordinal: 7740
    text: 'Then came up the Ziphites to Saul to Gibeah, saying: ‘Doth not David hide himself with us in the strongholds in the wood, in the hill of Hachilah, which is on the south of Jeshimon?'
    translation: JPS 1917
    original: וַיַּעֲלוּ זִפִים אֶל־שָׁאוּל הַגִּבְעָתָה לֵאמֹר הֲלוֹא דָוִד מִסְתַּתֵּר עִמָּנוּ בַמְּצָדוֹת בַּחֹרְשָׁה בְּגִבְעַת הַחֲכִילָה אֲשֶׁר מִימִין הַיְשִׁימוֹן׃
    hebrewPlain: ויעלו זפים אל שאול הגבעתה לאמר הלוא דוד מסתתר עמנו במצדות בחרשה בגבעת החכילה אשר מימין הישימון
    kjvRefs:
    - 1 Samuel 23:19
    kjvOsis:
    - 1Sam.23.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.20
    scripture: tanakh
    name: Tanakh 1 Samuel 23:20
    ref: 1 Samuel 23:20
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 20
    ordinal: 7741
    text: Now therefore, O king, come down, according to all the desire of thy soul to come down; and our part shall be to deliver him up into the king’s hand.’
    translation: JPS 1917
    original: וְעַתָּה לְכָל־אַוַּת נַפְשְׁךָ הַמֶּלֶךְ לָרֶדֶת רֵד וְלָנוּ הַסְגִּירוֹ בְּיַד הַמֶּלֶךְ׃
    hebrewPlain: ועתה לכל אות נפשך המלך לרדת רד ולנו הסגירו ביד המלך
    kjvRefs:
    - 1 Samuel 23:20
    kjvOsis:
    - 1Sam.23.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.21
    scripture: tanakh
    name: Tanakh 1 Samuel 23:21
    ref: 1 Samuel 23:21
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 21
    ordinal: 7742
    text: 'And Saul said: ‘Blessed be ye of the LORD; for ye have had compassion on me.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל בְּרוּכִים אַתֶּם לַיהוָה כִּי חֲמַלְתֶּם עָלָי׃
    hebrewPlain: ויאמר שאול ברוכים אתם ליהוה כי חמלתם עלי
    kjvRefs:
    - 1 Samuel 23:21
    kjvOsis:
    - 1Sam.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.22
    scripture: tanakh
    name: Tanakh 1 Samuel 23:22
    ref: 1 Samuel 23:22
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 22
    ordinal: 7743
    text: Go, I pray you, make yet more sure, and know and see his place where his haunt is, and who hath seen him there; for it is told me that he dealeth very subtly.
    translation: JPS 1917
    original: לְכוּ־נָא הָכִינוּ עוֹד וּדְעוּ וּרְאוּ אֶת־מְקוֹמוֹ אֲשֶׁר תִּהְיֶה רַגְלוֹ מִי רָאָהוּ שָׁם כִּי אָמַר אֵלַי עָרוֹם יַעְרִם הוּא׃
    hebrewPlain: לכו נא הכינו עוד ודעו וראו את מקומו אשר תהיה רגלו מי ראהו שם כי אמר אלי ערום יערם הוא
    kjvRefs:
    - 1 Samuel 23:22
    kjvOsis:
    - 1Sam.23.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.23
    scripture: tanakh
    name: Tanakh 1 Samuel 23:23
    ref: 1 Samuel 23:23
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 23
    ordinal: 7744
    text: See therefore, and take knowledge of all the lurking-places where he hideth himself, and come ye back to me with the certainty, and I will go with you; and it shall come to pass, if he be in the land, that I will search him out among all the thousands of Judah.’
    translation: JPS 1917
    original: וּרְאוּ וּדְעוּ מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם וְשַׁבְתֶּם אֵלַי אֶל־נָכוֹן וְהָלַכְתִּי אִתְּכֶם וְהָיָה אִם־יֶשְׁנוֹ בָאָרֶץ וְחִפַּשְׂתִּי אֹתוֹ בְּכֹל אַלְפֵי יְהוּדָה׃
    hebrewPlain: וראו ודעו מכל המחבאים אשר יתחבא שם ושבתם אלי אל נכון והלכתי אתכם והיה אם ישנו בארץ וחפשתי אתו בכל אלפי יהודה
    kjvRefs:
    - 1 Samuel 23:23
    kjvOsis:
    - 1Sam.23.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.24
    scripture: tanakh
    name: Tanakh 1 Samuel 23:24
    ref: 1 Samuel 23:24
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 24
    ordinal: 7745
    text: And they arose, and went to Ziph before Saul; but David and his men were in the wilderness of Maon, in the Arabah on the south of Jeshimon.
    translation: JPS 1917
    original: וַיָּקוּמוּ וַיֵּלְכוּ זִיפָה לִפְנֵי שָׁאוּל וְדָוִד וַאֲנָשָׁיו בְּמִדְבַּר מָעוֹן בָּעֲרָבָה אֶל יְמִין הַיְשִׁימוֹן׃
    hebrewPlain: ויקומו וילכו זיפה לפני שאול ודוד ואנשיו במדבר מעון בערבה אל ימין הישימון
    kjvRefs:
    - 1 Samuel 23:24
    kjvOsis:
    - 1Sam.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.25
    scripture: tanakh
    name: Tanakh 1 Samuel 23:25
    ref: 1 Samuel 23:25
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 25
    ordinal: 7746
    text: And Saul and his men went to seek him. And they told David; wherefore he came down to the rock, and abode in the wilderness of Maon. And when Saul heard that, he pursued after David in the wilderness of Maon.
    translation: JPS 1917
    original: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו לְבַקֵּשׁ וַיַּגִּדוּ לְדָוִד וַיֵּרֶד הַסֶּלַע וַיֵּשֶׁב בְּמִדְבַּר מָעוֹן וַיִּשְׁמַע שָׁאוּל וַיִּרְדֹּף אַחֲרֵי־דָוִד מִדְבַּר מָעוֹן׃
    hebrewPlain: וילך שאול ואנשיו לבקש ויגדו לדוד וירד הסלע וישב במדבר מעון וישמע שאול וירדף אחרי דוד מדבר מעון
    kjvRefs:
    - 1 Samuel 23:25
    kjvOsis:
    - 1Sam.23.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.26
    scripture: tanakh
    name: Tanakh 1 Samuel 23:26
    ref: 1 Samuel 23:26
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 26
    ordinal: 7747
    text: And Saul went on this side of the mountain, and David and his men on that side of the mountain; and David made haste to get away for fear of Saul; for Saul and his men compassed David and his men round about to take them.
    translation: JPS 1917
    original: וַיֵּלֶךְ שָׁאוּל מִצַּד הָהָר מִזֶּה וְדָוִד וַאֲנָשָׁיו מִצַּד הָהָר מִזֶּה וַיְהִי דָוִד נֶחְפָּז לָלֶכֶת מִפְּנֵי שָׁאוּל וְשָׁאוּל וַאֲנָשָׁיו עֹטְרִים אֶל־דָּוִד וְאֶל־אֲנָשָׁיו לְתָפְשָׂם׃
    hebrewPlain: וילך שאול מצד ההר מזה ודוד ואנשיו מצד ההר מזה ויהי דוד נחפז ללכת מפני שאול ושאול ואנשיו עטרים אל דוד ואל אנשיו לתפשם
    kjvRefs:
    - 1 Samuel 23:26
    kjvOsis:
    - 1Sam.23.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.27
    scripture: tanakh
    name: Tanakh 1 Samuel 23:27
    ref: 1 Samuel 23:27
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 27
    ordinal: 7748
    text: 'But there came a messenger unto Saul, saying: ‘Haste thee, and come; for the Philistines have made a raid upon the land.’'
    translation: JPS 1917
    original: וּמַלְאָךְ בָּא אֶל־שָׁאוּל לֵאמֹר מַהֲרָה וְלֵכָה כִּי־פָשְׁטוּ פְלִשְׁתִּים עַל־הָאָרֶץ׃
    hebrewPlain: ומלאך בא אל שאול לאמר מהרה ולכה כי פשטו פלשתים על הארץ
    kjvRefs:
    - 1 Samuel 23:27
    kjvOsis:
    - 1Sam.23.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.23.28
    scripture: tanakh
    name: Tanakh 1 Samuel 23:28
    ref: 1 Samuel 23:28
    book: 1Sam
    section: neviim
    chapter: 23
    verse: 28
    ordinal: 7749
    text: So Saul returned from pursuing after David, and went against the Philistines; therefore they called that place Sela-hammahlekoth.
    translation: JPS 1917
    original: וַיָּשָׁב שָׁאוּל מִרְדֹף אַחֲרֵי דָוִד וַיֵּלֶךְ לִקְרַאת פְּלִשְׁתִּים עַל־כֵּן קָרְאוּ לַמָּקוֹם הַהוּא סֶלַע הַמַּחְלְקוֹת׃
    hebrewPlain: וישב שאול מרדף אחרי דוד וילך לקראת פלשתים על כן קראו למקום ההוא סלע המחלקות
    kjvRefs:
    - 1 Samuel 23:28
    kjvOsis:
    - 1Sam.23.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.23
- type: TanakhVerse
  data:
    osis: 1Sam.24.1
    scripture: tanakh
    name: Tanakh 1 Samuel 24:1
    ref: 1 Samuel 24:1
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 1
    ordinal: 7750
    text: And David went up from thence, and dwelt in the strongholds of En-gedi.
    translation: JPS 1917
    original: וַיַּעַל דָּוִד מִשָּׁם וַיֵּשֶׁב בִּמְצָדוֹת עֵין־גֶּדִי׃
    hebrewPlain: ויעל דוד משם וישב במצדות עין גדי
    kjvRefs:
    - 1 Samuel 23:29
    kjvOsis:
    - 1Sam.23.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.2
    scripture: tanakh
    name: Tanakh 1 Samuel 24:2
    ref: 1 Samuel 24:2
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 2
    ordinal: 7751
    text: 'And it came to pass, when Saul was returned from following the Philistines, that it was told him, saying: ‘Behold, David is in the wilderness of En-gedi.’'
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר שָׁב שָׁאוּל מֵאַחֲרֵי פְּלִשְׁתִּים וַיַּגִּדוּ לוֹ לֵאמֹר הִנֵּה דָוִד בְּמִדְבַּר עֵין גֶּדִי׃
    hebrewPlain: ויהי כאשר שב שאול מאחרי פלשתים ויגדו לו לאמר הנה דוד במדבר עין גדי
    kjvRefs:
    - 1 Samuel 24:1
    kjvOsis:
    - 1Sam.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.3
    scripture: tanakh
    name: Tanakh 1 Samuel 24:3
    ref: 1 Samuel 24:3
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 3
    ordinal: 7752
    text: Then Saul took three thousand chosen men out of all Israel, and went to seek David and his men upon the rocks of the wild goats.
    translation: JPS 1917
    original: וַיִּקַּח שָׁאוּל שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר מִכָּל־יִשְׂרָאֵל וַיֵּלֶךְ לְבַקֵּשׁ אֶת־דָּוִד וַאֲנָשָׁיו עַל־פְּנֵי צוּרֵי הַיְּעֵלִים׃
    hebrewPlain: ויקח שאול שלשת אלפים איש בחור מכל ישראל וילך לבקש את דוד ואנשיו על פני צורי היעלים
    kjvRefs:
    - 1 Samuel 24:2
    kjvOsis:
    - 1Sam.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.4
    scripture: tanakh
    name: Tanakh 1 Samuel 24:4
    ref: 1 Samuel 24:4
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 4
    ordinal: 7753
    text: And he came to the sheepcotes by the way, where was a cave; and Saul went in to cover his feet. Now David and his men were sitting in the innermost parts of the cave.
    translation: JPS 1917
    original: וַיָּבֹא אֶל־גִּדְרוֹת הַצֹּאן עַל־הַדֶּרֶךְ וְשָׁם מְעָרָה וַיָּבֹא שָׁאוּל לְהָסֵךְ אֶת־רַגְלָיו וְדָוִד וַאֲנָשָׁיו בְּיַרְכְּתֵי הַמְּעָרָה יֹשְׁבִים׃
    hebrewPlain: ויבא אל גדרות הצאן על הדרך ושם מערה ויבא שאול להסך את רגליו ודוד ואנשיו בירכתי המערה ישבים
    kjvRefs:
    - 1 Samuel 24:3
    kjvOsis:
    - 1Sam.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.5
    scripture: tanakh
    name: Tanakh 1 Samuel 24:5
    ref: 1 Samuel 24:5
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 5
    ordinal: 7754
    text: 'And the men of David said unto him: ‘Behold the day in which the LORD hath said unto thee: Behold, I will deliver thine enemy into thy hand, and thou shalt do to him as it shall seem good unto thee.’ Then David arose, and cut off the skirt of Saul’s robe privily.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו הִנֵּה הַיּוֹם אֲ‍שֶׁר־אָמַר יְהוָה אֵלֶיךָ הִנֵּה אָנֹכִי נֹתֵן אֶת־איביך [אֹיִבְךָ] בְּיָדֶךָ וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ וַיָּקָם דָּוִד וַיִּכְרֹת אֶת־כְּנַף־הַמְּעִיל אֲשֶׁר־לְשָׁאוּל בַּלָּט׃
    hebrewPlain: ויאמרו אנשי דוד אליו הנה היום א‍שר אמר יהוה אליך הנה אנכי נתן את איביך [איבך] בידך ועשית לו כאשר יטב בעיניך ויקם דוד ויכרת את כנף המעיל אשר לשאול בלט
    kjvRefs:
    - 1 Samuel 24:4
    kjvOsis:
    - 1Sam.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.6
    scripture: tanakh
    name: Tanakh 1 Samuel 24:6
    ref: 1 Samuel 24:6
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 6
    ordinal: 7755
    text: And it came to pass afterward, that David’s heart smote him, because he had cut off Saul’s skirt.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי־כֵן וַיַּךְ לֵב־דָּוִד אֹתוֹ עַל אֲשֶׁר כָּרַת אֶת־כָּנָף אֲשֶׁר לְשָׁאוּל׃
    hebrewPlain: ויהי אחרי כן ויך לב דוד אתו על אשר כרת את כנף אשר לשאול
    kjvRefs:
    - 1 Samuel 24:5
    kjvOsis:
    - 1Sam.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.7
    scripture: tanakh
    name: Tanakh 1 Samuel 24:7
    ref: 1 Samuel 24:7
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 7
    ordinal: 7756
    text: 'And he said unto his men: ‘The LORD forbid it me, that I should do this thing unto my lord, the LORD’S anointed, to put forth my hand against him, seeing he is the LORD’S anointed.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לַאֲנָשָׁיו חָלִילָה לִּי מֵיהוָה אִם־אֶעֱשֶׂה אֶת־הַדָּבָר הַזֶּה לַאדֹנִי לִמְשִׁיחַ יְהוָה לִשְׁלֹחַ יָדִי בּוֹ כִּי־מְשִׁיחַ יְהוָה הוּא׃
    hebrewPlain: ויאמר לאנשיו חלילה לי מיהוה אם אעשה את הדבר הזה לאדני למשיח יהוה לשלח ידי בו כי משיח יהוה הוא
    kjvRefs:
    - 1 Samuel 24:6
    kjvOsis:
    - 1Sam.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.8
    scripture: tanakh
    name: Tanakh 1 Samuel 24:8
    ref: 1 Samuel 24:8
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 8
    ordinal: 7757
    text: So David checked his men with these words, and suffered them not to rise against Saul. And Saul rose up out of the cave, and went on his way.
    translation: JPS 1917
    original: וַיְשַׁסַּע דָּוִד אֶת־אֲנָשָׁיו בַּדְּבָרִים וְלֹא נְתָנָם לָקוּם אֶל־שָׁאוּל וְשָׁאוּל קָם מֵהַמְּעָרָה וַיֵּלֶךְ בַּדָּרֶךְ׃
    hebrewPlain: וישסע דוד את אנשיו בדברים ולא נתנם לקום אל שאול ושאול קם מהמערה וילך בדרך
    kjvRefs:
    - 1 Samuel 24:7
    kjvOsis:
    - 1Sam.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.9
    scripture: tanakh
    name: Tanakh 1 Samuel 24:9
    ref: 1 Samuel 24:9
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 9
    ordinal: 7758
    text: 'David also arose afterward, and went out of the cave, and cried after Saul, saying: ‘My lord the king.’ And when Saul looked behind him, David bowed with his face to the earth, and prostrated himself.'
    translation: JPS 1917
    original: וַיָּקָם דָּוִד אַחֲרֵי־כֵן וַיֵּצֵא מן־המערה [מֵהַמְּעָרָה] וַיִּקְרָא אַחֲרֵי־שָׁאוּל לֵאמֹר אֲדֹנִי הַמֶּלֶךְ וַיַּבֵּט שָׁאוּל אַחֲרָיו וַיִּקֹּד דָּוִד אַפַּיִם אַרְצָה וַיִּשְׁתָּחוּ׃
    hebrewPlain: ויקם דוד אחרי כן ויצא מן המערה [מהמערה] ויקרא אחרי שאול לאמר אדני המלך ויבט שאול אחריו ויקד דוד אפים ארצה וישתחו
    kjvRefs:
    - 1 Samuel 24:8
    kjvOsis:
    - 1Sam.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.10
    scripture: tanakh
    name: Tanakh 1 Samuel 24:10
    ref: 1 Samuel 24:10
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 10
    ordinal: 7759
    text: 'And David said to Saul: ‘Wherefore hearkenest thou to men’s words, saying: Behold, David seeketh thy hurt?'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לְשָׁאוּל לָמָּה תִשְׁמַע אֶת־דִּבְרֵי אָדָם לֵאמֹר הִנֵּה דָוִד מְבַקֵּשׁ רָעָתֶךָ׃
    hebrewPlain: ויאמר דוד לשאול למה תשמע את דברי אדם לאמר הנה דוד מבקש רעתך
    kjvRefs:
    - 1 Samuel 24:9
    kjvOsis:
    - 1Sam.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.11
    scripture: tanakh
    name: Tanakh 1 Samuel 24:11
    ref: 1 Samuel 24:11
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 11
    ordinal: 7760
    text: 'Behold, this day thine eyes have seen how that the LORD had delivered thee to-day into my hand in the cave; and some bade me kill thee; but mine eye spared thee; and I said: I will not put forth my hand against my lord; for he is the LORD’S anointed.'
    translation: JPS 1917
    original: הִנֵּה הַיּוֹם הַזֶּה רָאוּ עֵינֶיךָ אֵת אֲשֶׁר־נְתָנְךָ יְהוָה הַיּוֹם בְּיָדִי בַּמְּעָרָה וְאָמַר לַהֲרָגֲךָ וַתָּחָס עָלֶיךָ וָאֹמַר לֹא־אֶשְׁלַח יָדִי בַּאדֹנִי כִּי־מְשִׁיחַ יְהוָה הוּא׃
    hebrewPlain: הנה היום הזה ראו עיניך את אשר נתנך יהוה היום בידי במערה ואמר להרגך ותחס עליך ואמר לא אשלח ידי באדני כי משיח יהוה הוא
    kjvRefs:
    - 1 Samuel 24:10
    kjvOsis:
    - 1Sam.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.12
    scripture: tanakh
    name: Tanakh 1 Samuel 24:12
    ref: 1 Samuel 24:12
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 12
    ordinal: 7761
    text: Moreover, my father, see, yea, see the skirt of thy robe in my hand; for in that I cut off the skirt of thy robe, and killed thee not, know thou and see that there is neither evil nor transgression in my hand, and I have not sinned against thee, though thou layest wait for my soul to take it.
    translation: JPS 1917
    original: וְאָבִי רְאֵה גַּם רְאֵה אֶת־כְּנַף מְעִילְךָ בְּיָדִי כִּי בְּכָרְתִי אֶת־כְּנַף מְעִילְךָ וְלֹא הֲרַגְתִּיךָ דַּע וּרְאֵה כִּי אֵין בְּיָדִי רָעָה וָפֶשַׁע וְלֹא־חָטָאתִי לָךְ וְאַתָּה צֹדֶה אֶת־נַפְשִׁי לְקַחְתָּהּ׃
    hebrewPlain: ואבי ראה גם ראה את כנף מעילך בידי כי בכרתי את כנף מעילך ולא הרגתיך דע וראה כי אין בידי רעה ופשע ולא חטאתי לך ואתה צדה את נפשי לקחתה
    kjvRefs:
    - 1 Samuel 24:11
    kjvOsis:
    - 1Sam.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.13
    scripture: tanakh
    name: Tanakh 1 Samuel 24:13
    ref: 1 Samuel 24:13
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 13
    ordinal: 7762
    text: The LORD judge between me and thee, and the LORD avenge me of thee; but my hand shall not be upon thee.
    translation: JPS 1917
    original: יִשְׁפֹּט יְהוָה בֵּינִי וּבֵינֶךָ וּנְקָמַנִי יְהוָה מִמֶּךָּ וְיָדִי לֹא תִהְיֶה־בָּךְ׃
    hebrewPlain: ישפט יהוה ביני ובינך ונקמני יהוה ממך וידי לא תהיה בך
    kjvRefs:
    - 1 Samuel 24:12
    kjvOsis:
    - 1Sam.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.14
    scripture: tanakh
    name: Tanakh 1 Samuel 24:14
    ref: 1 Samuel 24:14
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 14
    ordinal: 7763
    text: 'As saith the proverb of the ancients: Out of the wicked cometh forth wickedness; but my hand shall not be upon thee.'
    translation: JPS 1917
    original: כַּאֲשֶׁר יֹאמַר מְשַׁל הַקַּדְמֹנִי מֵרְשָׁעִים יֵצֵא רֶשַׁע וְיָדִי לֹא תִהְיֶה־בָּךְ׃
    hebrewPlain: כאשר יאמר משל הקדמני מרשעים יצא רשע וידי לא תהיה בך
    kjvRefs:
    - 1 Samuel 24:13
    kjvOsis:
    - 1Sam.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.15
    scripture: tanakh
    name: Tanakh 1 Samuel 24:15
    ref: 1 Samuel 24:15
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 15
    ordinal: 7764
    text: After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea.
    translation: JPS 1917
    original: אַחֲרֵי מִי יָצָא מֶלֶךְ יִשְׂרָאֵל אַחֲרֵי מִי אַתָּה רֹדֵף אַחֲרֵי כֶּלֶב מֵת אַחֲרֵי פַּרְעֹשׁ אֶחָד׃
    hebrewPlain: אחרי מי יצא מלך ישראל אחרי מי אתה רדף אחרי כלב מת אחרי פרעש אחד
    kjvRefs:
    - 1 Samuel 24:14
    kjvOsis:
    - 1Sam.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.16
    scripture: tanakh
    name: Tanakh 1 Samuel 24:16
    ref: 1 Samuel 24:16
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 16
    ordinal: 7765
    text: The LORD therefore be judge, and give sentence between me and thee, and see, and plead my cause, and deliver me out of thy hand.’
    translation: JPS 1917
    original: וְהָיָה יְהוָה לְדַיָּן וְשָׁפַט בֵּינִי וּבֵינֶךָ וְיֵרֶא וְיָרֵב אֶת־רִיבִי וְיִשְׁפְּטֵנִי מִיָּדֶךָ׃
    hebrewPlain: והיה יהוה לדין ושפט ביני ובינך וירא וירב את ריבי וישפטני מידך
    kjvRefs:
    - 1 Samuel 24:15
    kjvOsis:
    - 1Sam.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.17
    scripture: tanakh
    name: Tanakh 1 Samuel 24:17
    ref: 1 Samuel 24:17
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 17
    ordinal: 7766
    text: 'And it came to pass, when David had made an end of speaking these words unto Saul, that Saul said: ‘Is this thy voice, my son David?’ And Saul lifted up his voice, and wept.'
    translation: JPS 1917
    original: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה אֶל־שָׁאוּל וַיֹּאמֶר שָׁאוּל הֲקֹלְךָ זֶה בְּנִי דָוִד וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ׃
    hebrewPlain: ויהי ככלות דוד לדבר את הדברים האלה אל שאול ויאמר שאול הקלך זה בני דוד וישא שאול קלו ויבך
    kjvRefs:
    - 1 Samuel 24:16
    kjvOsis:
    - 1Sam.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.18
    scripture: tanakh
    name: Tanakh 1 Samuel 24:18
    ref: 1 Samuel 24:18
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 18
    ordinal: 7767
    text: 'And he said to David: ‘Thou art more righteous than I; for thou hast rendered unto me good, whereas I have rendered unto thee evil.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־דָּוִד צַדִּיק אַתָּה מִמֶּנִּי כִּי אַתָּה גְּמַלְתַּנִי הַטּוֹבָה וַאֲנִי גְּמַלְתִּיךָ הָרָעָה׃
    hebrewPlain: ויאמר אל דוד צדיק אתה ממני כי אתה גמלתני הטובה ואני גמלתיך הרעה
    kjvRefs:
    - 1 Samuel 24:17
    kjvOsis:
    - 1Sam.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.19
    scripture: tanakh
    name: Tanakh 1 Samuel 24:19
    ref: 1 Samuel 24:19
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 19
    ordinal: 7768
    text: And thou hast declared this day how that thou hast dealt well with me; forasmuch as when the LORD had delivered me up into thy hand, thou didst not kill me.
    translation: JPS 1917
    original: ואת [וְאַתָּה] הִגַּדְתָּ הַיּוֹם אֵת אֲשֶׁר־עָשִׂיתָה אִתִּי טוֹבָה אֵת אֲשֶׁר סִגְּרַנִי יְהוָה בְּיָדְךָ וְלֹא הֲרַגְתָּנִי׃
    hebrewPlain: ואת [ואתה] הגדת היום את אשר עשיתה אתי טובה את אשר סגרני יהוה בידך ולא הרגתני
    kjvRefs:
    - 1 Samuel 24:18
    kjvOsis:
    - 1Sam.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.20
    scripture: tanakh
    name: Tanakh 1 Samuel 24:20
    ref: 1 Samuel 24:20
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 20
    ordinal: 7769
    text: For if a man find his enemy, will he let him go well away? wherefore the LORD reward thee good for that which thou hast done unto me this day.
    translation: JPS 1917
    original: וְכִי־יִמְצָא אִישׁ אֶת־אֹיְבוֹ וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה וַיהוָה יְשַׁלֶּמְךָ טוֹבָה תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי׃
    hebrewPlain: וכי ימצא איש את איבו ושלחו בדרך טובה ויהוה ישלמך טובה תחת היום הזה אשר עשיתה לי
    kjvRefs:
    - 1 Samuel 24:19
