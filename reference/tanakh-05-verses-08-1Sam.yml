- type: TanakhVerse
  data:
    osis: 1Sam.8.19
    scripture: tanakh
    name: Tanakh 1 Samuel 8:19
    ref: 1 Samuel 8:19
    book: 1Sam
    section: neviim
    chapter: 8
    verse: 19
    ordinal: 7298
    text: 'But the people refused to hearken unto the voice of Samuel; and they said: ‘Nay; but there shall be a king over us;'
    translation: JPS 1917
    original: וַיְמָאֲנוּ הָעָם לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל וַיֹּאמְרוּ לֹּא כִּי אִם־מֶלֶךְ יִהְיֶה עָלֵינוּ׃
    hebrewPlain: וימאנו העם לשמע בקול שמואל ויאמרו לא כי אם מלך יהיה עלינו
    kjvRefs:
    - 1 Samuel 8:19
    kjvOsis:
    - 1Sam.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.8
- type: TanakhVerse
  data:
    osis: 1Sam.8.20
    scripture: tanakh
    name: Tanakh 1 Samuel 8:20
    ref: 1 Samuel 8:20
    book: 1Sam
    section: neviim
    chapter: 8
    verse: 20
    ordinal: 7299
    text: that we also may be like all the nations; and that our king may judge us, and go out before us, and fight our battles.’
    translation: JPS 1917
    original: וְהָיִינוּ גַם־אֲנַחְנוּ כְּכָל־הַגּוֹיִם וּשְׁפָטָנוּ מַלְכֵּנוּ וְיָצָא לְפָנֵינוּ וְנִלְחַם אֶת־מִלְחֲמֹתֵנוּ׃
    hebrewPlain: והיינו גם אנחנו ככל הגוים ושפטנו מלכנו ויצא לפנינו ונלחם את מלחמתנו
    kjvRefs:
    - 1 Samuel 8:20
    kjvOsis:
    - 1Sam.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.8
- type: TanakhVerse
  data:
    osis: 1Sam.8.21
    scripture: tanakh
    name: Tanakh 1 Samuel 8:21
    ref: 1 Samuel 8:21
    book: 1Sam
    section: neviim
    chapter: 8
    verse: 21
    ordinal: 7300
    text: And Samuel heard all the words of the people, and he spoke them in the ears of the LORD.
    translation: JPS 1917
    original: וַיִּשְׁמַע שְׁמוּאֵל אֵת כָּל־דִּבְרֵי הָעָם וַיְדַבְּרֵם בְּאָזְנֵי יְהוָה׃
    hebrewPlain: וישמע שמואל את כל דברי העם וידברם באזני יהוה
    kjvRefs:
    - 1 Samuel 8:21
    kjvOsis:
    - 1Sam.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.8
- type: TanakhVerse
  data:
    osis: 1Sam.8.22
    scripture: tanakh
    name: Tanakh 1 Samuel 8:22
    ref: 1 Samuel 8:22
    book: 1Sam
    section: neviim
    chapter: 8
    verse: 22
    ordinal: 7301
    text: 'And the LORD said to Samuel: ‘Hearken unto their voice, and make them a king.’ And Samuel said unto the men of Israel: ‘Go ye every man unto his city.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־שְׁמוּאֵל שְׁמַע בְּקוֹלָם וְהִמְלַכְתָּ לָהֶם מֶלֶךְ וַיֹּאמֶר שְׁמוּאֵל אֶל־אַנְשֵׁי יִשְׂרָאֵל לְכוּ אִישׁ לְעִירוֹ׃
    hebrewPlain: ויאמר יהוה אל שמואל שמע בקולם והמלכת להם מלך ויאמר שמואל אל אנשי ישראל לכו איש לעירו
    kjvRefs:
    - 1 Samuel 8:22
    kjvOsis:
    - 1Sam.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.8
- type: TanakhVerse
  data:
    osis: 1Sam.9.1
    scripture: tanakh
    name: Tanakh 1 Samuel 9:1
    ref: 1 Samuel 9:1
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 7302
    text: Now there was a man of Benjamin, whose name was Kish, the son of Abiel, the son of Zeror, the son of Becorath, the son of Aphiah, the son of a Benjamite, a mighty man of valour.
    translation: JPS 1917
    original: וַיְהִי־אִישׁ מבן־ימין [מִבִּנְיָמִין] וּשְׁמוֹ קִישׁ בֶּן־אֲבִיאֵל בֶּן־צְרוֹר בֶּן־בְּכוֹרַת בֶּן־אֲפִיחַ בֶּן־אִישׁ יְמִינִי גִּבּוֹר חָיִל׃
    hebrewPlain: ויהי איש מבן ימין [מבנימין] ושמו קיש בן אביאל בן צרור בן בכורת בן אפיח בן איש ימיני גבור חיל
    kjvRefs:
    - 1 Samuel 9:1
    kjvOsis:
    - 1Sam.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.2
    scripture: tanakh
    name: Tanakh 1 Samuel 9:2
    ref: 1 Samuel 9:2
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 7303
    text: 'And he had a son, whose name was Saul, young and goodly, and there was not among the children of Israel a goodlier person than he: from his shoulders and upward he was higher than any of the people.'
    translation: JPS 1917
    original: וְלוֹ־הָיָה בֵן וּשְׁמוֹ שָׁאוּל בָּחוּר וָטוֹב וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל טוֹב מִמֶּנּוּ מִשִּׁכְמוֹ וָמַעְלָה גָּבֹהַּ מִכָּל־הָעָם׃
    hebrewPlain: ולו היה בן ושמו שאול בחור וטוב ואין איש מבני ישראל טוב ממנו משכמו ומעלה גבה מכל העם
    kjvRefs:
    - 1 Samuel 9:2
    kjvOsis:
    - 1Sam.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.3
    scripture: tanakh
    name: Tanakh 1 Samuel 9:3
    ref: 1 Samuel 9:3
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 7304
    text: 'Now the asses of Kish Saul’s father were lost. And Kish said to Saul his son: ‘Take now one of the servants with thee, and arise, go seek the asses.’'
    translation: JPS 1917
    original: וַתֹּאבַדְנָה הָאֲתֹנוֹת לְקִישׁ אֲבִי שָׁאוּל וַיֹּאמֶר קִישׁ אֶל־שָׁאוּל בְּנוֹ קַח־נָא אִתְּךָ אֶת־אַחַד מֵהַנְּעָרִים וְקוּם לֵךְ בַּקֵּשׁ אֶת־הָאֲתֹנֹת׃
    hebrewPlain: ותאבדנה האתנות לקיש אבי שאול ויאמר קיש אל שאול בנו קח נא אתך את אחד מהנערים וקום לך בקש את האתנת
    kjvRefs:
    - 1 Samuel 9:3
    kjvOsis:
    - 1Sam.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.4
    scripture: tanakh
    name: Tanakh 1 Samuel 9:4
    ref: 1 Samuel 9:4
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 7305
    text: And he passed through the hill-country of Ephraim, and passed through the land of Shalishah, but they found them not; then they passed through the land of Shaalim, and there they were not; and he passed through the land of the Benjamites, but they found them not.
    translation: JPS 1917
    original: וַיַּעֲבֹר בְּהַר־אֶפְרַיִם וַיַּעֲבֹר בְּאֶרֶץ־שָׁלִשָׁה וְלֹא מָצָאוּ וַיַּעַבְרוּ בְאֶרֶץ־שַׁעֲלִים וָאַיִן וַיַּעֲבֹר בְּאֶרֶץ־יְמִינִי וְלֹא מָצָאוּ׃
    hebrewPlain: ויעבר בהר אפרים ויעבר בארץ שלשה ולא מצאו ויעברו בארץ שעלים ואין ויעבר בארץ ימיני ולא מצאו
    kjvRefs:
    - 1 Samuel 9:4
    kjvOsis:
    - 1Sam.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.5
    scripture: tanakh
    name: Tanakh 1 Samuel 9:5
    ref: 1 Samuel 9:5
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 7306
    text: 'When they were come to the land of Zuph, Saul said to his servant that was with him: ‘Come and let us return; lest my father leave caring for the asses, and become anxious concerning us.’'
    translation: JPS 1917
    original: הֵמָּה בָּאוּ בְּאֶרֶץ צוּף וְשָׁאוּל אָמַר לְנַעֲרוֹ אֲשֶׁר־עִמּוֹ לְכָה וְנָשׁוּבָה פֶּן־יֶחְדַּל אָבִי מִן־הָאֲתֹנוֹת וְדָאַג לָנוּ׃
    hebrewPlain: המה באו בארץ צוף ושאול אמר לנערו אשר עמו לכה ונשובה פן יחדל אבי מן האתנות ודאג לנו
    kjvRefs:
    - 1 Samuel 9:5
    kjvOsis:
    - 1Sam.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.6
    scripture: tanakh
    name: Tanakh 1 Samuel 9:6
    ref: 1 Samuel 9:6
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 7307
    text: 'And he said unto him: ‘Behold now, there is in this city a man of God, and he is a man that is held in honour; all that he saith cometh surely to pass; now let us go thither; peradventure he can tell us concerning our journey whereon we go.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ הִנֵּה־נָא אִישׁ־אֱלֹהִים בָּעִיר הַזֹּאת וְהָאִישׁ נִכְבָּד כֹּל אֲשֶׁר־יְדַבֵּר בּוֹא יָבוֹא עַתָּה נֵלֲכָה שָּׁם אוּלַי יַגִּיד לָנוּ אֶת־דַּרְכֵּנוּ אֲשֶׁר־הָלַכְנוּ עָלֶיהָ׃
    hebrewPlain: ויאמר לו הנה נא איש אלהים בעיר הזאת והאיש נכבד כל אשר ידבר בוא יבוא עתה נלכה שם אולי יגיד לנו את דרכנו אשר הלכנו עליה
    kjvRefs:
    - 1 Samuel 9:6
    kjvOsis:
    - 1Sam.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.7
    scripture: tanakh
    name: Tanakh 1 Samuel 9:7
    ref: 1 Samuel 9:7
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 7308
    text: 'Then said Saul to his servant: ‘But, behold, if we go, what shall we bring the man? for the bread is spent in our vessels, and there is not a present to bring to the man of God; what have we?’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לְנַעֲרוֹ וְהִנֵּה נֵלֵךְ וּמַה־נָּבִיא לָאִישׁ כִּי הַלֶּחֶם אָזַל מִכֵּלֵינוּ וּתְשׁוּרָה אֵין־לְהָבִיא לְאִישׁ הָאֱלֹהִים מָה אִתָּנוּ׃
    hebrewPlain: ויאמר שאול לנערו והנה נלך ומה נביא לאיש כי הלחם אזל מכלינו ותשורה אין להביא לאיש האלהים מה אתנו
    kjvRefs:
    - 1 Samuel 9:7
    kjvOsis:
    - 1Sam.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.8
    scripture: tanakh
    name: Tanakh 1 Samuel 9:8
    ref: 1 Samuel 9:8
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 7309
    text: 'And the servant answered Saul again, and said: ‘Behold, I have in my hand the fourth part of a shekel of silver, that will I give to the man of God, to tell us our way.’—'
    translation: JPS 1917
    original: וַיֹּסֶף הַנַּעַר לַעֲנוֹת אֶת־שָׁאוּל וַיֹּאמֶר הִנֵּה נִמְצָא בְיָדִי רֶבַע שֶׁקֶל כָּסֶף וְנָתַתִּי לְאִישׁ הָאֱלֹהִים וְהִגִּיד לָנוּ אֶת־דַּרְכֵּנוּ׃
    hebrewPlain: ויסף הנער לענות את שאול ויאמר הנה נמצא בידי רבע שקל כסף ונתתי לאיש האלהים והגיד לנו את דרכנו
    kjvRefs:
    - 1 Samuel 9:8
    kjvOsis:
    - 1Sam.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.9
    scripture: tanakh
    name: Tanakh 1 Samuel 9:9
    ref: 1 Samuel 9:9
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 7310
    text: 'Beforetime in Israel, when a man went to inquire of God, thus he said: ‘Come and let us go to the seer’; for he that is now called a prophet was beforetime called a seer.—'
    translation: JPS 1917
    original: לְפָנִים בְּיִשְׂרָאֵל כֹּה־אָמַר הָאִישׁ בְּלֶכְתּוֹ לִדְרוֹשׁ אֱלֹהִים לְכוּ וְנֵלְכָה עַד־הָרֹאֶה כִּי לַנָּבִיא הַיּוֹם יִקָּרֵא לְפָנִים הָרֹאֶה׃
    hebrewPlain: לפנים בישראל כה אמר האיש בלכתו לדרוש אלהים לכו ונלכה עד הראה כי לנביא היום יקרא לפנים הראה
    kjvRefs:
    - 1 Samuel 9:9
    kjvOsis:
    - 1Sam.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.10
    scripture: tanakh
    name: Tanakh 1 Samuel 9:10
    ref: 1 Samuel 9:10
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 7311
    text: 'Then said Saul to his servant: ‘Well said; come, let us go.’ So they went unto the city where the man of God was.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לְנַעֲרוֹ טוֹב דְּבָרְךָ לְכָה נֵלֵכָה וַיֵּלְכוּ אֶל־הָעִיר אֲשֶׁר־שָׁם אִישׁ הָאֱלֹהִים׃
    hebrewPlain: ויאמר שאול לנערו טוב דברך לכה נלכה וילכו אל העיר אשר שם איש האלהים
    kjvRefs:
    - 1 Samuel 9:10
    kjvOsis:
    - 1Sam.9.10
