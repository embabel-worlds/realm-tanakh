- type: TanakhVerse
  data:
    osis: 1Sam.9.11
    scripture: tanakh
    name: Tanakh 1 Samuel 9:11
    ref: 1 Samuel 9:11
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 7312
    text: 'As they went up the ascent to the city, they found young maidens going out to draw water, and said unto them: ‘Is the seer here?’'
    translation: JPS 1917
    original: הֵמָּה עֹלִים בְּמַעֲלֵה הָעִיר וְהֵמָּה מָצְאוּ נְעָרוֹת יֹצְאוֹת לִשְׁאֹב מָיִם וַיֹּאמְרוּ לָהֶן הֲיֵשׁ בָּזֶה הָרֹאֶה׃
    hebrewPlain: המה עלים במעלה העיר והמה מצאו נערות יצאות לשאב מים ויאמרו להן היש בזה הראה
    kjvRefs:
    - 1 Samuel 9:11
    kjvOsis:
    - 1Sam.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.12
    scripture: tanakh
    name: Tanakh 1 Samuel 9:12
    ref: 1 Samuel 9:12
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 7313
    text: 'And they answered them, and said: ‘He is; behold, he is before thee; make haste now, for he is come to-day into the city; for the people have a sacrifice to-day in the high place.'
    translation: JPS 1917
    original: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה יֵּשׁ הִנֵּה לְפָנֶיךָ מַהֵר עַתָּה כִּי הַיּוֹם בָּא לָעִיר כִּי זֶבַח הַיּוֹם לָעָם בַּבָּמָה׃
    hebrewPlain: ותענינה אותם ותאמרנה יש הנה לפניך מהר עתה כי היום בא לעיר כי זבח היום לעם בבמה
    kjvRefs:
    - 1 Samuel 9:12
    kjvOsis:
    - 1Sam.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.13
    scripture: tanakh
    name: Tanakh 1 Samuel 9:13
    ref: 1 Samuel 9:13
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 7314
    text: As soon as ye are come into the city, ye shall straightway find him, before he go up to the high place to eat; for the people will not eat until he come, because he doth bless the sacrifice; and afterwards they eat that are bidden. Now therefore get you up; for at this time ye shall find him.’
    translation: JPS 1917
    original: כְּבֹאֲכֶם הָעִיר כֵּן תִּמְצְאוּן אֹתוֹ בְּטֶרֶם יַעֲלֶה הַבָּמָתָה לֶאֱכֹל כִּי לֹא־יֹאכַל הָעָם עַד־בֹּאוֹ כִּי־הוּא יְבָרֵךְ הַזֶּבַח אַחֲרֵי־כֵן יֹאכְלוּ הַקְּרֻאִים וְעַתָּה עֲלוּ כִּי־אֹתוֹ כְהַיּוֹם תִּמְצְאוּן אֹתוֹ׃
    hebrewPlain: כבאכם העיר כן תמצאון אתו בטרם יעלה הבמתה לאכל כי לא יאכל העם עד באו כי הוא יברך הזבח אחרי כן יאכלו הקראים ועתה עלו כי אתו כהיום תמצאון אתו
    kjvRefs:
    - 1 Samuel 9:13
    kjvOsis:
    - 1Sam.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.14
    scripture: tanakh
    name: Tanakh 1 Samuel 9:14
    ref: 1 Samuel 9:14
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 7315
    text: And they went up to the city; and as they came within the city, behold, Samuel came out toward them, to go up to the high place.
    translation: JPS 1917
    original: וַיַּעֲלוּ הָעִיר הֵמָּה בָּאִים בְּתוֹךְ הָעִיר וְהִנֵּה שְׁמוּאֵל יֹצֵא לִקְרָאתָם לַעֲלוֹת הַבָּמָה׃
    hebrewPlain: ויעלו העיר המה באים בתוך העיר והנה שמואל יצא לקראתם לעלות הבמה
    kjvRefs:
    - 1 Samuel 9:14
    kjvOsis:
    - 1Sam.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.15
    scripture: tanakh
    name: Tanakh 1 Samuel 9:15
    ref: 1 Samuel 9:15
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 7316
    text: 'Now the LORD had revealed unto Samuel a day before Saul came, saying:'
    translation: JPS 1917
    original: וַיהוָה גָּלָה אֶת־אֹזֶן שְׁמוּאֵל יוֹם אֶחָד לִפְנֵי בוֹא־שָׁאוּל לֵאמֹר׃
    hebrewPlain: ויהוה גלה את אזן שמואל יום אחד לפני בוא שאול לאמר
    kjvRefs:
    - 1 Samuel 9:15
    kjvOsis:
    - 1Sam.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.16
    scripture: tanakh
    name: Tanakh 1 Samuel 9:16
    ref: 1 Samuel 9:16
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 16
    ordinal: 7317
    text: ’To-morrow about this time I will send thee a man out of the land of Benjamin, and thou shalt anoint him to be prince over My people Israel, and he shall save My people out of the hand of the Philistines; for I have looked upon My people, because their cry is come unto Me.’
    translation: JPS 1917
    original: כָּעֵת מָחָר אֶשְׁלַח אֵלֶיךָ אִישׁ מֵאֶרֶץ בִּנְיָמִן וּמְשַׁחְתּוֹ לְנָגִיד עַל־עַמִּי יִשְׂרָאֵל וְהוֹשִׁיעַ אֶת־עַמִּי מִיַּד פְּלִשְׁתִּים כִּי רָאִיתִי אֶת־עַמִּי כִּי בָּאָה צַעֲקָתוֹ אֵלָי׃
    hebrewPlain: כעת מחר אשלח אליך איש מארץ בנימן ומשחתו לנגיד על עמי ישראל והושיע את עמי מיד פלשתים כי ראיתי את עמי כי באה צעקתו אלי
    kjvRefs:
    - 1 Samuel 9:16
    kjvOsis:
    - 1Sam.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.17
    scripture: tanakh
    name: Tanakh 1 Samuel 9:17
    ref: 1 Samuel 9:17
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 17
    ordinal: 7318
    text: 'And when Samuel saw Saul, the LORD spoke unto him: ‘Behold the man of whom I said unto thee: This same shall have authority over My people.’'
    translation: JPS 1917
    original: וּשְׁמוּאֵל רָאָה אֶת־שָׁאוּל וַיהוָה עָנָהוּ הִנֵּה הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ זֶה יַעְצֹר בְּעַמִּי׃
    hebrewPlain: ושמואל ראה את שאול ויהוה ענהו הנה האיש אשר אמרתי אליך זה יעצר בעמי
    kjvRefs:
    - 1 Samuel 9:17
    kjvOsis:
    - 1Sam.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.18
    scripture: tanakh
    name: Tanakh 1 Samuel 9:18
    ref: 1 Samuel 9:18
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 18
    ordinal: 7319
    text: 'Then Saul drew near to Samuel in the gate, and said: ‘Tell me, I pray thee, where the seer’s house is.’'
    translation: JPS 1917
    original: וַיִּגַּשׁ שָׁאוּל אֶת־שְׁמוּאֵל בְּתוֹךְ הַשָּׁעַר וַיֹּאמֶר הַגִּידָה־נָּא לִי אֵי־זֶה בֵּית הָרֹאֶה׃
    hebrewPlain: ויגש שאול את שמואל בתוך השער ויאמר הגידה נא לי אי זה בית הראה
    kjvRefs:
    - 1 Samuel 9:18
    kjvOsis:
    - 1Sam.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.19
    scripture: tanakh
    name: Tanakh 1 Samuel 9:19
    ref: 1 Samuel 9:19
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 19
    ordinal: 7320
    text: 'And Samuel answered Saul, and said: ‘I am the seer; go up before me unto the high place, for ye shall eat with me to-day; and in the morning I will let thee go, and will tell thee all that is in thy heart.'
    translation: JPS 1917
    original: וַיַּעַן שְׁמוּאֵל אֶת־שָׁאוּל וַיֹּאמֶר אָנֹכִי הָרֹאֶה עֲלֵה לְפָנַי הַבָּמָה וַאֲכַלְתֶּם עִמִּי הַיּוֹם וְשִׁלַּחְתִּיךָ בַבֹּקֶר וְכֹל אֲשֶׁר בִּלְבָבְךָ אַגִּיד לָךְ׃
    hebrewPlain: ויען שמואל את שאול ויאמר אנכי הראה עלה לפני הבמה ואכלתם עמי היום ושלחתיך בבקר וכל אשר בלבבך אגיד לך
    kjvRefs:
    - 1 Samuel 9:19
    kjvOsis:
    - 1Sam.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.20
    scripture: tanakh
    name: Tanakh 1 Samuel 9:20
    ref: 1 Samuel 9:20
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 20
    ordinal: 7321
    text: And as for thine asses that were lost three days ago, set not thy mind on them; for they are found. And on whom is all the desire of Israel? Is it not on thee, and on all thy father’s house?’
    translation: JPS 1917
    original: וְלָאֲתֹנוֹת הָאֹבְדוֹת לְךָ הַיּוֹם שְׁלֹשֶׁת הַיָּמִים אַל־תָּשֶׂם אֶת־לִבְּךָ לָהֶם כִּי נִמְצָאוּ וּלְמִי כָּל־חֶמְדַּת יִשְׂרָאֵל הֲלוֹא לְךָ וּלְכֹל בֵּית אָבִיךָ׃
    hebrewPlain: ולאתנות האבדות לך היום שלשת הימים אל תשם את לבך להם כי נמצאו ולמי כל חמדת ישראל הלוא לך ולכל בית אביך
    kjvRefs:
    - 1 Samuel 9:20
    kjvOsis:
    - 1Sam.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.21
    scripture: tanakh
    name: Tanakh 1 Samuel 9:21
    ref: 1 Samuel 9:21
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 21
    ordinal: 7322
    text: 'And Saul answered and said: ‘Am not I a Benjamite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin? wherefore then speakest thou to me after this manner?’'
    translation: JPS 1917
    original: וַיַּעַן שָׁאוּל וַיֹּאמֶר הֲלוֹא בֶן־יְמִינִי אָנֹכִי מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל וּמִשְׁפַּחְתִּי הַצְּעִרָה מִכָּל־מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן וְלָמָּה דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה׃
    hebrewPlain: ויען שאול ויאמר הלוא בן ימיני אנכי מקטני שבטי ישראל ומשפחתי הצערה מכל משפחות שבטי בנימן ולמה דברת אלי כדבר הזה
    kjvRefs:
    - 1 Samuel 9:21
    kjvOsis:
    - 1Sam.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.22
    scripture: tanakh
    name: Tanakh 1 Samuel 9:22
    ref: 1 Samuel 9:22
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 22
    ordinal: 7323
    text: And Samuel took Saul and his servant, and brought them into the chamber, and made them sit in the chiefest place among them that were bidden, who were about thirty persons.
    translation: JPS 1917
    original: וַיִּקַּח שְׁמוּאֵל אֶת־שָׁאוּל וְאֶת־נַעֲרוֹ וַיְבִיאֵם לִשְׁכָּתָה וַיִּתֵּן לָהֶם מָקוֹם בְּרֹאשׁ הַקְּרוּאִים וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ׃
    hebrewPlain: ויקח שמואל את שאול ואת נערו ויביאם לשכתה ויתן להם מקום בראש הקרואים והמה כשלשים איש
    kjvRefs:
    - 1 Samuel 9:22
    kjvOsis:
    - 1Sam.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.23
    scripture: tanakh
    name: Tanakh 1 Samuel 9:23
    ref: 1 Samuel 9:23
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 23
    ordinal: 7324
    text: 'And Samuel said unto the cook: ‘Bring the portion which I gave thee, of which I said unto thee: Set it by thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל לַטַּבָּח תְּנָה אֶת־הַמָּנָה אֲשֶׁר נָתַתִּי לָךְ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ שִׂים אֹתָהּ עִמָּךְ׃
    hebrewPlain: ויאמר שמואל לטבח תנה את המנה אשר נתתי לך אשר אמרתי אליך שים אתה עמך
    kjvRefs:
    - 1 Samuel 9:23
    kjvOsis:
    - 1Sam.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.24
    scripture: tanakh
    name: Tanakh 1 Samuel 9:24
    ref: 1 Samuel 9:24
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 24
    ordinal: 7325
    text: 'And the cook took up the thigh, and that which was upon it, and set it before Saul. And [Samuel] said: ‘Behold that which hath been reserved! set it before thee and eat; because unto the appointed time hath it been kept for thee, for I said: I have invited the people.’ So Saul did eat with Samuel that day.'
    translation: JPS 1917
    original: וַיָּרֶם הַטַּבָּח אֶת־הַשּׁוֹק וְהֶעָלֶיהָ וַיָּשֶׂם לִפְנֵי שָׁאוּל וַיֹּאמֶר הִנֵּה הַנִּשְׁאָר שִׂים־לְפָנֶיךָ אֱכֹל כִּי לַמּוֹעֵד שָׁמוּר־לְךָ לֵאמֹר הָעָם קָרָאתִי וַיֹּאכַל שָׁאוּל עִם־שְׁמוּאֵל בַּיּוֹם הַהוּא׃
    hebrewPlain: וירם הטבח את השוק והעליה וישם לפני שאול ויאמר הנה הנשאר שים לפניך אכל כי למועד שמור לך לאמר העם קראתי ויאכל שאול עם שמואל ביום ההוא
    kjvRefs:
    - 1 Samuel 9:24
    kjvOsis:
    - 1Sam.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.25
    scripture: tanakh
    name: Tanakh 1 Samuel 9:25
    ref: 1 Samuel 9:25
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 25
    ordinal: 7326
    text: And when they were come down from the high place into the city, he spoke with Saul upon the housetop.
    translation: JPS 1917
    original: וַיֵּרְדוּ מֵהַבָּמָה הָעִיר וַיְדַבֵּר עִם־שָׁאוּל עַל־הַגָּג׃
    hebrewPlain: וירדו מהבמה העיר וידבר עם שאול על הגג
    kjvRefs:
    - 1 Samuel 9:25
    kjvOsis:
    - 1Sam.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.26
    scripture: tanakh
    name: Tanakh 1 Samuel 9:26
    ref: 1 Samuel 9:26
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 26
    ordinal: 7327
    text: 'And they arose early; and it came to pass about the break of day, that Samuel called to Saul on the housetop, saying: ‘Up, that I may send thee away.’ And Saul arose, and they went out both of them, he and Samuel, abroad.'
    translation: JPS 1917
    original: וַיַּשְׁכִּמוּ וַיְהִי כַּעֲלוֹת הַשַּׁחַר וַיִּקְרָא שְׁמוּאֵל אֶל־שָׁאוּל הגג [הַגָּגָה] לֵאמֹר קוּמָה וַאֲשַׁלְּחֶךָּ וַיָּקָם שָׁאוּל וַיֵּצְאוּ שְׁנֵיהֶם הוּא וּשְׁמוּאֵל הַחוּצָה׃
    hebrewPlain: וישכמו ויהי כעלות השחר ויקרא שמואל אל שאול הגג [הגגה] לאמר קומה ואשלחך ויקם שאול ויצאו שניהם הוא ושמואל החוצה
    kjvRefs:
    - 1 Samuel 9:26
    kjvOsis:
    - 1Sam.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.9.27
    scripture: tanakh
    name: Tanakh 1 Samuel 9:27
    ref: 1 Samuel 9:27
    book: 1Sam
    section: neviim
    chapter: 9
    verse: 27
    ordinal: 7328
    text: 'As they were going down at the end of the city, Samuel said to Saul: ‘Bid the servant pass on before us—and he passed on—but stand thou still at this time, that I may cause thee to hear the word of God.’'
    translation: JPS 1917
    original: הֵמָּה יוֹרְדִים בִּקְצֵה הָעִיר וּשְׁמוּאֵל אָמַר אֶל־שָׁאוּל אֱמֹר לַנַּעַר וְיַעֲבֹר לְפָנֵינוּ וַיַּעֲבֹר וְאַתָּה עֲמֹד כַּיּוֹם וְאַשְׁמִיעֲךָ אֶת־דְּבַר אֱלֹהִים׃
    hebrewPlain: המה יורדים בקצה העיר ושמואל אמר אל שאול אמר לנער ויעבר לפנינו ויעבר ואתה עמד כיום ואשמיעך את דבר אלהים
    kjvRefs:
    - 1 Samuel 9:27
    kjvOsis:
    - 1Sam.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.9
- type: TanakhVerse
  data:
    osis: 1Sam.10.1
    scripture: tanakh
    name: Tanakh 1 Samuel 10:1
    ref: 1 Samuel 10:1
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 7329
    text: 'Then Samuel took the vial of oil, and poured it upon his head, and kissed him, and said: ‘Is it not that the LORD hath anointed thee to be prince over His inheritance?'
    translation: JPS 1917
    original: וַיִּקַּח שְׁמוּאֵל אֶת־פַּךְ הַשֶּׁמֶן וַיִּצֹק עַל־רֹאשׁוֹ וַיִּשָּׁקֵהוּ וַיֹּאמֶר הֲלוֹא כִּי־מְשָׁחֲךָ יְהוָה עַל־נַחֲלָתוֹ לְנָגִיד׃
    hebrewPlain: ויקח שמואל את פך השמן ויצק על ראשו וישקהו ויאמר הלוא כי משחך יהוה על נחלתו לנגיד
    kjvRefs:
    - 1 Samuel 10:1
    kjvOsis:
    - 1Sam.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.2
    scripture: tanakh
    name: Tanakh 1 Samuel 10:2
    ref: 1 Samuel 10:2
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 7330
    text: 'When thou art departed from me to-day, then thou shalt find two men by the tomb of Rachel, in the border of Benjamin at Zelzah; and they will say unto thee: The asses which thou wentest to seek are found; and, lo, thy father hath left off caring for the asses, and is anxious concerning you, saying: What shall I do for my son?'
    translation: JPS 1917
    original: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי וּמָצָאתָ שְׁנֵי אֲנָשִׁים עִם־קְבֻרַת רָחֵל בִּגְבוּל בִּנְיָמִן בְּצֶלְצַח וְאָמְרוּ אֵלֶיךָ נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ וְהִנֵּה נָטַשׁ אָבִיךָ אֶת־דִּבְרֵי הָאֲתֹנוֹת וְדָאַג לָכֶם לֵאמֹר מָה אֶעֱשֶׂה לִבְנִי׃
    hebrewPlain: בלכתך היום מעמדי ומצאת שני אנשים עם קברת רחל בגבול בנימן בצלצח ואמרו אליך נמצאו האתנות אשר הלכת לבקש והנה נטש אביך את דברי האתנות ודאג לכם לאמר מה אעשה לבני
    kjvRefs:
    - 1 Samuel 10:2
    kjvOsis:
    - 1Sam.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.3
    scripture: tanakh
    name: Tanakh 1 Samuel 10:3
    ref: 1 Samuel 10:3
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 7331
    text: Then shalt thou go on forward from thence, and thou shalt come to the terebinth of Tabor, and there shall meet thee there three men going up to God to Beth-el, one carrying three kids, and another carrying three loaves of bread, and another carrying a bottle of wine.
    translation: JPS 1917
    original: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה וּבָאתָ עַד־אֵלוֹן תָּבוֹר וּמְצָאוּךָ שָּׁם שְׁלֹשָׁה אֲנָשִׁים עֹלִים אֶל־הָאֱלֹהִים בֵּית־אֵל אֶחָד נֹשֵׂא שְׁלֹשָׁה גְדָיִים וְאֶחָד נֹשֵׂא שְׁלֹשֶׁת כִּכְּרוֹת לֶחֶם וְאֶחָד נֹשֵׂא נֵבֶל־יָיִן׃
    hebrewPlain: וחלפת משם והלאה ובאת עד אלון תבור ומצאוך שם שלשה אנשים עלים אל האלהים בית אל אחד נשא שלשה גדיים ואחד נשא שלשת ככרות לחם ואחד נשא נבל יין
    kjvRefs:
    - 1 Samuel 10:3
    kjvOsis:
    - 1Sam.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.4
    scripture: tanakh
    name: Tanakh 1 Samuel 10:4
    ref: 1 Samuel 10:4
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 7332
    text: And they will salute thee, and give thee two cakes of bread; which thou shalt receive of their hand.
    translation: JPS 1917
    original: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם וְנָתְנוּ לְךָ שְׁתֵּי־לֶחֶם וְלָקַחְתָּ מִיָּדָם׃
    hebrewPlain: ושאלו לך לשלום ונתנו לך שתי לחם ולקחת מידם
    kjvRefs:
    - 1 Samuel 10:4
    kjvOsis:
    - 1Sam.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.5
    scripture: tanakh
    name: Tanakh 1 Samuel 10:5
    ref: 1 Samuel 10:5
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 7333
    text: After that thou shalt come to the hill of God, where is the garrison of the Philistines; and it shall come to pass, when thou art come thither to the city, that thou shalt meet a band of prophets coming down from the high place with a psaltery, and a timbrel, and a pipe, and a harp, before them; and they will be prophesying.
    translation: JPS 1917
    original: אַחַר כֵּן תָּבוֹא גִּבְעַת הָאֱלֹהִים אֲשֶׁר־שָׁם נְצִבֵי פְלִשְׁתִּים וִיהִי כְבֹאֲךָ שָׁם הָעִיר וּפָגַעְתָּ חֶבֶל נְבִיאִים יֹרְדִים מֵהַבָּמָה וְלִפְנֵיהֶם נֵבֶל וְתֹף וְחָלִיל וְכִנּוֹר וְהֵמָּה מִתְנַבְּאִים׃
    hebrewPlain: אחר כן תבוא גבעת האלהים אשר שם נצבי פלשתים ויהי כבאך שם העיר ופגעת חבל נביאים ירדים מהבמה ולפניהם נבל ותף וחליל וכנור והמה מתנבאים
    kjvRefs:
    - 1 Samuel 10:5
    kjvOsis:
    - 1Sam.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.6
    scripture: tanakh
    name: Tanakh 1 Samuel 10:6
    ref: 1 Samuel 10:6
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 7334
    text: And the spirit of the LORD will come mightily upon thee, and thou shalt prophesy with them, and shalt be turned into another man.
    translation: JPS 1917
    original: וְצָלְחָה עָלֶיךָ רוּחַ יְהוָה וְהִתְנַבִּיתָ עִמָּם וְנֶהְפַּכְתָּ לְאִישׁ אַחֵר׃
    hebrewPlain: וצלחה עליך רוח יהוה והתנבית עמם ונהפכת לאיש אחר
    kjvRefs:
    - 1 Samuel 10:6
    kjvOsis:
    - 1Sam.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.7
    scripture: tanakh
    name: Tanakh 1 Samuel 10:7
    ref: 1 Samuel 10:7
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 7335
    text: And let it be, when these signs are come unto thee, that thou do as thy hand shall find; for God is with thee.
    translation: JPS 1917
    original: וְהָיָה כִּי תבאינה [תָבֹאנָה] הָאֹתוֹת הָאֵלֶּה לָךְ עֲשֵׂה לְךָ אֲשֶׁר תִּמְצָא יָדֶךָ כִּי הָאֱלֹהִים עִמָּךְ׃
    hebrewPlain: והיה כי תבאינה [תבאנה] האתות האלה לך עשה לך אשר תמצא ידך כי האלהים עמך
    kjvRefs:
    - 1 Samuel 10:7
    kjvOsis:
    - 1Sam.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.8
    scripture: tanakh
    name: Tanakh 1 Samuel 10:8
    ref: 1 Samuel 10:8
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 7336
    text: And thou shalt go down before me to Gilgal; and, behold, I will come down unto thee, to offer burnt-offerings, and to sacrifice sacrifices of peace-offerings; seven days shalt thou tarry, till I come unto thee, and tell thee what thou shalt do.’
    translation: JPS 1917
    original: וְיָרַדְתָּ לְפָנַי הַגִּלְגָּל וְהִנֵּה אָנֹכִי יֹרֵד אֵלֶיךָ לְהַעֲלוֹת עֹלוֹת לִזְבֹּחַ זִבְחֵי שְׁלָמִים שִׁבְעַת יָמִים תּוֹחֵל עַד־בּוֹאִי אֵלֶיךָ וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה׃
    hebrewPlain: וירדת לפני הגלגל והנה אנכי ירד אליך להעלות עלות לזבח זבחי שלמים שבעת ימים תוחל עד בואי אליך והודעתי לך את אשר תעשה
    kjvRefs:
    - 1 Samuel 10:8
    kjvOsis:
    - 1Sam.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.9
    scripture: tanakh
    name: Tanakh 1 Samuel 10:9
    ref: 1 Samuel 10:9
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 7337
    text: And it was so, that when he had turned his back to go from Samuel, God gave him another heart; and all those signs came to pass that day.
    translation: JPS 1917
    original: וְהָיָה כְּהַפְנֹתוֹ שִׁכְמוֹ לָלֶכֶת מֵעִם שְׁמוּאֵל וַיַּהֲפָךְ־לוֹ אֱלֹהִים לֵב אַחֵר וַיָּבֹאוּ כָּל־הָאֹתוֹת הָאֵלֶּה בַּיּוֹם הַהוּא׃
    hebrewPlain: והיה כהפנתו שכמו ללכת מעם שמואל ויהפך לו אלהים לב אחר ויבאו כל האתות האלה ביום ההוא
    kjvRefs:
    - 1 Samuel 10:9
    kjvOsis:
    - 1Sam.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.10
    scripture: tanakh
    name: Tanakh 1 Samuel 10:10
    ref: 1 Samuel 10:10
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 7338
    text: And when they came thither to the hill, behold, a band of prophets met him; and the spirit of God came mightily upon him, and he prophesied among them.
    translation: JPS 1917
    original: וַיָּבֹאוּ שָׁם הַגִּבְעָתָה וְהִנֵּה חֶבֶל־נְבִאִים לִקְרָאתוֹ וַתִּצְלַח עָלָיו רוּחַ אֱלֹהִים וַיִּתְנַבֵּא בְּתוֹכָם׃
    hebrewPlain: ויבאו שם הגבעתה והנה חבל נבאים לקראתו ותצלח עליו רוח אלהים ויתנבא בתוכם
    kjvRefs:
    - 1 Samuel 10:10
    kjvOsis:
    - 1Sam.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.11
    scripture: tanakh
    name: Tanakh 1 Samuel 10:11
    ref: 1 Samuel 10:11
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 7339
    text: 'And it came to pass, when all that knew him beforetime saw that, behold, he prophesied with the prophets, then the people said one to another: ‘What is this that is come unto the son of Kish? Is Saul also among the prophets?’'
    translation: JPS 1917
    original: וַיְהִי כָּל־יוֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם וַיִּרְאוּ וְהִנֵּה עִם־נְבִאִים נִבָּא וַיֹּאמֶר הָעָם אִישׁ אֶל־רֵעֵהוּ מַה־זֶּה הָיָה לְבֶן־קִישׁ הֲגַם שָׁאוּל בַּנְּבִיאִים׃
    hebrewPlain: ויהי כל יודעו מאתמול שלשום ויראו והנה עם נבאים נבא ויאמר העם איש אל רעהו מה זה היה לבן קיש הגם שאול בנביאים
    kjvRefs:
    - 1 Samuel 10:11
    kjvOsis:
    - 1Sam.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.12
    scripture: tanakh
    name: Tanakh 1 Samuel 10:12
    ref: 1 Samuel 10:12
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 7340
    text: 'And one of the same place answered and said: ‘And who is their father?’ Therefore it became a proverb: ‘Is Saul also among the prophets?’'
    translation: JPS 1917
    original: וַיַּעַן אִישׁ מִשָּׁם וַיֹּאמֶר וּמִי אֲבִיהֶם עַל־כֵּן הָיְתָה לְמָשָׁל הֲגַם שָׁאוּל בַּנְּבִאִים׃
    hebrewPlain: ויען איש משם ויאמר ומי אביהם על כן היתה למשל הגם שאול בנבאים
    kjvRefs:
    - 1 Samuel 10:12
    kjvOsis:
    - 1Sam.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.13
    scripture: tanakh
    name: Tanakh 1 Samuel 10:13
    ref: 1 Samuel 10:13
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 7341
    text: And when he had made an end of prophesying, he came to the high place.
    translation: JPS 1917
    original: וַיְכַל מֵהִתְנַבּוֹת וַיָּבֹא הַבָּמָה׃
    hebrewPlain: ויכל מהתנבות ויבא הבמה
    kjvRefs:
    - 1 Samuel 10:13
    kjvOsis:
    - 1Sam.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.14
    scripture: tanakh
    name: Tanakh 1 Samuel 10:14
    ref: 1 Samuel 10:14
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 7342
    text: 'And Saul’s uncle said unto him and to his servant: ‘Whither went ye?’ And he said: ‘To seek the asses; and when we saw that they were not found, we came to Samuel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דּוֹד שָׁאוּל אֵלָיו וְאֶל־נַעֲרוֹ אָן הֲלַכְתֶּם וַיֹּאמֶר לְבַקֵּשׁ אֶת־הָאֲתֹנוֹת וַנִּרְאֶה כִי־אַיִן וַנָּבוֹא אֶל־שְׁמוּאֵל׃
    hebrewPlain: ויאמר דוד שאול אליו ואל נערו אן הלכתם ויאמר לבקש את האתנות ונראה כי אין ונבוא אל שמואל
    kjvRefs:
    - 1 Samuel 10:14
    kjvOsis:
    - 1Sam.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.15
    scripture: tanakh
    name: Tanakh 1 Samuel 10:15
    ref: 1 Samuel 10:15
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 7343
    text: 'And Saul’s uncle said: ‘Tell me, I pray thee, what Samuel said unto you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דּוֹד שָׁאוּל הַגִּידָה־נָּא לִי מָה־אָמַר לָכֶם שְׁמוּאֵל׃
    hebrewPlain: ויאמר דוד שאול הגידה נא לי מה אמר לכם שמואל
    kjvRefs:
    - 1 Samuel 10:15
    kjvOsis:
    - 1Sam.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.16
    scripture: tanakh
    name: Tanakh 1 Samuel 10:16
    ref: 1 Samuel 10:16
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 16
    ordinal: 7344
    text: 'And Saul said unto his uncle: ‘He told us plainly that the asses were found.’ But concerning the matter of the kingdom, whereof Samuel spoke, he told him not.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־דּוֹדוֹ הַגֵּד הִגִּיד לָנוּ כִּי נִמְצְאוּ הָאֲתֹנוֹת וְאֶת־דְּבַר הַמְּלוּכָה לֹא־הִגִּיד לוֹ אֲשֶׁר אָמַר שְׁמוּאֵל׃
    hebrewPlain: ויאמר שאול אל דודו הגד הגיד לנו כי נמצאו האתנות ואת דבר המלוכה לא הגיד לו אשר אמר שמואל
    kjvRefs:
    - 1 Samuel 10:16
    kjvOsis:
    - 1Sam.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.17
    scripture: tanakh
    name: Tanakh 1 Samuel 10:17
    ref: 1 Samuel 10:17
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 17
    ordinal: 7345
    text: And Samuel called the people together unto the LORD to Mizpah.
    translation: JPS 1917
    original: וַיַּצְעֵק שְׁמוּאֵל אֶת־הָעָם אֶל־יְהוָה הַמִּצְפָּה׃
    hebrewPlain: ויצעק שמואל את העם אל יהוה המצפה
    kjvRefs:
    - 1 Samuel 10:17
    kjvOsis:
    - 1Sam.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.18
    scripture: tanakh
    name: Tanakh 1 Samuel 10:18
    ref: 1 Samuel 10:18
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 18
    ordinal: 7346
    text: 'And he said unto the children of Israel: ‘Thus saith the LORD, the God of Israel: I brought up Israel out of Egypt, and I delivered you out of the hand of the Egyptians, and out of the hand of all the kingdoms that oppressed you.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־בְּנֵי יִשְׂרָאֵל כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אָנֹכִי הֶעֱלֵיתִי אֶת־יִשְׂרָאֵל מִמִּצְרָיִם וָאַצִּיל אֶתְכֶם מִיַּד מִצְרַיִם וּמִיַּד כָּל־הַמַּמְלָכוֹת הַלֹּחֲצִים אֶתְכֶם׃
    hebrewPlain: ויאמר אל בני ישראל כה אמר יהוה אלהי ישראל אנכי העליתי את ישראל ממצרים ואציל אתכם מיד מצרים ומיד כל הממלכות הלחצים אתכם
    kjvRefs:
    - 1 Samuel 10:18
    kjvOsis:
    - 1Sam.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.19
    scripture: tanakh
    name: Tanakh 1 Samuel 10:19
    ref: 1 Samuel 10:19
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 19
    ordinal: 7347
    text: 'But ye have this day rejected your God, who Himself saveth you out of all your calamities and your distresses; and ye have said unto Him: Nay, but set a king over us. Now therefore present yourselves before the LORD by your tribes, and by your thousands.’'
    translation: JPS 1917
    original: וְאַתֶּם הַיּוֹם מְאַסְתֶּם אֶת־אֱלֹהֵיכֶם אֲשֶׁר־הוּא מוֹשִׁיעַ לָכֶם מִכָּל־רָעוֹתֵיכֶם וְצָרֹתֵיכֶם וַתֹּאמְרוּ לוֹ כִּי־מֶלֶךְ תָּשִׂים עָלֵינוּ וְעַתָּה הִתְיַצְּבוּ לִפְנֵי יְהוָה לְשִׁבְטֵיכֶם וּלְאַלְפֵיכֶם׃
    hebrewPlain: ואתם היום מאסתם את אלהיכם אשר הוא מושיע לכם מכל רעותיכם וצרתיכם ותאמרו לו כי מלך תשים עלינו ועתה התיצבו לפני יהוה לשבטיכם ולאלפיכם
    kjvRefs:
    - 1 Samuel 10:19
    kjvOsis:
    - 1Sam.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.20
    scripture: tanakh
    name: Tanakh 1 Samuel 10:20
    ref: 1 Samuel 10:20
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 20
    ordinal: 7348
    text: So Samuel brought all the tribes of Israel near, and the tribe of Benjamin was taken.
    translation: JPS 1917
    original: וַיַּקְרֵב שְׁמוּאֵל אֵת כָּל־שִׁבְטֵי יִשְׂרָאֵל וַיִּלָּכֵד שֵׁבֶט בִּנְיָמִן׃
    hebrewPlain: ויקרב שמואל את כל שבטי ישראל וילכד שבט בנימן
    kjvRefs:
    - 1 Samuel 10:20
    kjvOsis:
    - 1Sam.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.21
    scripture: tanakh
    name: Tanakh 1 Samuel 10:21
    ref: 1 Samuel 10:21
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 21
    ordinal: 7349
    text: And he brought the tribe of Benjamin near by their families, and the family of the Matrites was taken; and Saul the son of Kish was taken; but when they sought him, he could not be found.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־שֵׁבֶט בִּנְיָמִן למשפחתו [לְמִשְׁפְּחֹתָיו] וַתִּלָּכֵד מִשְׁפַּחַת הַמַּטְרִי וַיִּלָּכֵד שָׁאוּל בֶּן־קִישׁ וַיְבַקְשֻׁהוּ וְלֹא נִמְצָא׃
    hebrewPlain: ויקרב את שבט בנימן למשפחתו [למשפחתיו] ותלכד משפחת המטרי וילכד שאול בן קיש ויבקשהו ולא נמצא
    kjvRefs:
    - 1 Samuel 10:21
    kjvOsis:
    - 1Sam.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.22
    scripture: tanakh
    name: Tanakh 1 Samuel 10:22
    ref: 1 Samuel 10:22
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 22
    ordinal: 7350
    text: 'Therefore they asked of the LORD further: ‘Is there yet a man come hither?’ And the LORD answered: ‘Behold, he hath hid himself among the baggage.’'
    translation: JPS 1917
    original: וַיִּשְׁאֲלוּ־עוֹד בַּיהוָה הֲבָא עוֹד הֲלֹם אִישׁ וַיֹּאמֶר יְהוָה הִנֵּה־הוּא נֶחְבָּא אֶל־הַכֵּלִים׃
    hebrewPlain: וישאלו עוד ביהוה הבא עוד הלם איש ויאמר יהוה הנה הוא נחבא אל הכלים
    kjvRefs:
    - 1 Samuel 10:22
    kjvOsis:
    - 1Sam.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.23
    scripture: tanakh
    name: Tanakh 1 Samuel 10:23
    ref: 1 Samuel 10:23
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 23
    ordinal: 7351
    text: And they ran and fetched him thence; and when he stood among the people, he was higher than any of the people from his shoulders and upward.
    translation: JPS 1917
    original: וַיָּרֻצוּ וַיִּקָּחֻהוּ מִשָּׁם וַיִּתְיַצֵּב בְּתוֹךְ הָעָם וַיִּגְבַּהּ מִכָּל־הָעָם מִשִּׁכְמוֹ וָמָעְלָה׃
    hebrewPlain: וירצו ויקחהו משם ויתיצב בתוך העם ויגבה מכל העם משכמו ומעלה
    kjvRefs:
    - 1 Samuel 10:23
    kjvOsis:
    - 1Sam.10.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.24
    scripture: tanakh
    name: Tanakh 1 Samuel 10:24
    ref: 1 Samuel 10:24
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 24
    ordinal: 7352
    text: 'And Samuel said to all the people: ‘See ye him whom the LORD hath chosen, that there is none like him among all the people?’ And all the people shouted, and said: ‘Long live the king.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־כָּל־הָעָם הַרְּאִיתֶם אֲשֶׁר בָּחַר־בּוֹ יְהוָה כִּי אֵין כָּמֹהוּ בְּכָל־הָעָם וַיָּרִעוּ כָל־הָעָם וַיֹּאמְרוּ יְחִי הַמֶּלֶךְ׃
    hebrewPlain: ויאמר שמואל אל כל העם הראיתם אשר בחר בו יהוה כי אין כמהו בכל העם וירעו כל העם ויאמרו יחי המלך
    kjvRefs:
    - 1 Samuel 10:24
    kjvOsis:
    - 1Sam.10.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.25
    scripture: tanakh
    name: Tanakh 1 Samuel 10:25
    ref: 1 Samuel 10:25
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 25
    ordinal: 7353
    text: Then Samuel told the people the manner of the kingdom, and wrote it in a book, and laid it up before the LORD. And Samuel sent all the people away, every man to his house.
    translation: JPS 1917
    original: וַיְדַבֵּר שְׁמוּאֵל אֶל־הָעָם אֵת מִשְׁפַּט הַמְּלֻכָה וַיִּכְתֹּב בַּסֵּפֶר וַיַּנַּח לִפְנֵי יְהוָה וַיְשַׁלַּח שְׁמוּאֵל אֶת־כָּל־הָעָם אִישׁ לְבֵיתוֹ׃
    hebrewPlain: וידבר שמואל אל העם את משפט המלכה ויכתב בספר וינח לפני יהוה וישלח שמואל את כל העם איש לביתו
    kjvRefs:
    - 1 Samuel 10:25
    kjvOsis:
    - 1Sam.10.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.26
    scripture: tanakh
    name: Tanakh 1 Samuel 10:26
    ref: 1 Samuel 10:26
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 26
    ordinal: 7354
    text: And Saul also went to his house to Gibeah; and there went with him the men of valour, whose hearts God had touched.
    translation: JPS 1917
    original: וְגַם־שָׁאוּל הָלַךְ לְבֵיתוֹ גִּבְעָתָה וַיֵּלְכוּ עִמּוֹ הַחַיִל אֲשֶׁר־נָגַע אֱלֹהִים בְּלִבָּם׃
    hebrewPlain: וגם שאול הלך לביתו גבעתה וילכו עמו החיל אשר נגע אלהים בלבם
    kjvRefs:
    - 1 Samuel 10:26
    kjvOsis:
    - 1Sam.10.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.10.27
    scripture: tanakh
    name: Tanakh 1 Samuel 10:27
    ref: 1 Samuel 10:27
    book: 1Sam
    section: neviim
    chapter: 10
    verse: 27
    ordinal: 7355
    text: 'But certain base fellows said: ‘How shall this man save us?’ And they despised him, and brought him no present. But he was as one that held his peace.'
    translation: JPS 1917
    original: וּבְנֵי בְלִיַּעַל אָמְרוּ מַה־יֹּשִׁעֵנוּ זֶה וַיִּבְזֻהוּ וְלֹא־הֵבִיאוּ לוֹ מִנְחָה וַיְהִי כְּמַחֲרִישׁ׃
    hebrewPlain: ובני בליעל אמרו מה ישענו זה ויבזהו ולא הביאו לו מנחה ויהי כמחריש
    kjvRefs:
    - 1 Samuel 10:27
    kjvOsis:
    - 1Sam.10.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.10
- type: TanakhVerse
  data:
    osis: 1Sam.11.1
    scripture: tanakh
    name: Tanakh 1 Samuel 11:1
    ref: 1 Samuel 11:1
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 7356
    text: 'Then Nahash the Ammonite came up, and encamped against Jabesh-gilead; and all the men of Jabesh said unto Nahash: ‘Make a covenant with us, and we will serve thee.’'
    translation: JPS 1917
    original: וַיַּעַל נָחָשׁ הָעַמּוֹנִי וַיִּחַן עַל־יָבֵשׁ גִּלְעָד וַיֹּאמְרוּ כָּל־אַנְשֵׁי יָבֵישׁ אֶל־נָחָשׁ כְּרָת־לָנוּ בְרִית וְנַעַבְדֶךָּ׃
    hebrewPlain: ויעל נחש העמוני ויחן על יבש גלעד ויאמרו כל אנשי יביש אל נחש כרת לנו ברית ונעבדך
    kjvRefs:
    - 1 Samuel 11:1
    kjvOsis:
    - 1Sam.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.2
    scripture: tanakh
    name: Tanakh 1 Samuel 11:2
    ref: 1 Samuel 11:2
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 7357
    text: 'And Nahash the Ammonite said unto them: ‘On this condition will I make it with you, that all your right eyes be put out; and I will lay it for a reproach upon all Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם נָחָשׁ הָעַמּוֹנִי בְּזֹאת אֶכְרֹת לָכֶם בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין וְשַׂמְתִּיהָ חֶרְפָּה עַל־כָּל־יִשְׂרָאֵל׃
    hebrewPlain: ויאמר אליהם נחש העמוני בזאת אכרת לכם בנקור לכם כל עין ימין ושמתיה חרפה על כל ישראל
    kjvRefs:
    - 1 Samuel 11:2
    kjvOsis:
    - 1Sam.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.3
    scripture: tanakh
    name: Tanakh 1 Samuel 11:3
    ref: 1 Samuel 11:3
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 7358
    text: 'And the elders of Jabesh said unto him: ‘Give us seven days’ respite, that we may send messengers unto all the borders of Israel; and then, if there be none to deliver us, we will come out to thee.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו זִקְנֵי יָבֵישׁ הֶרֶף לָנוּ שִׁבְעַת יָמִים וְנִשְׁלְחָה מַלְאָכִים בְּכֹל גְּבוּל יִשְׂרָאֵל וְאִם־אֵין מוֹשִׁיעַ אֹתָנוּ וְיָצָאנוּ אֵלֶיךָ׃
    hebrewPlain: ויאמרו אליו זקני יביש הרף לנו שבעת ימים ונשלחה מלאכים בכל גבול ישראל ואם אין מושיע אתנו ויצאנו אליך
    kjvRefs:
    - 1 Samuel 11:3
    kjvOsis:
    - 1Sam.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.4
    scripture: tanakh
    name: Tanakh 1 Samuel 11:4
    ref: 1 Samuel 11:4
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 7359
    text: Then came the messengers to Gibeath-shaul, and spoke these words in the ears of the people; and all the people lifted up their voice, and wept.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַמַּלְאָכִים גִּבְעַת שָׁאוּל וַיְדַבְּרוּ הַדְּבָרִים בְּאָזְנֵי הָעָם וַיִּשְׂאוּ כָל־הָעָם אֶת־קוֹלָם וַיִּבְכּוּ׃
    hebrewPlain: ויבאו המלאכים גבעת שאול וידברו הדברים באזני העם וישאו כל העם את קולם ויבכו
    kjvRefs:
    - 1 Samuel 11:4
    kjvOsis:
    - 1Sam.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.5
    scripture: tanakh
    name: Tanakh 1 Samuel 11:5
    ref: 1 Samuel 11:5
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 7360
    text: 'And, behold, Saul came following the oxen out of the field; and Saul said: ‘What aileth the people that they weep?’ And they told him the words of the men of Jabesh.'
    translation: JPS 1917
    original: וְהִנֵּה שָׁאוּל בָּא אַחֲרֵי הַבָּקָר מִן־הַשָּׂדֶה וַיֹּאמֶר שָׁאוּל מַה־לָּעָם כִּי יִבְכּוּ וַיְסַפְּרוּ־לוֹ אֶת־דִּבְרֵי אַנְשֵׁי יָבֵישׁ׃
    hebrewPlain: והנה שאול בא אחרי הבקר מן השדה ויאמר שאול מה לעם כי יבכו ויספרו לו את דברי אנשי יביש
    kjvRefs:
    - 1 Samuel 11:5
    kjvOsis:
    - 1Sam.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.6
    scripture: tanakh
    name: Tanakh 1 Samuel 11:6
    ref: 1 Samuel 11:6
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 7361
    text: And the spirit of God came mightily upon Saul when he heard those words, and his anger was kindled greatly.
    translation: JPS 1917
    original: וַתִּצְלַח רוּחַ־אֱלֹהִים עַל־שָׁאוּל בשמעו [כְּשָׁמְעוֹ] אֶת־הַדְּבָרִים הָאֵלֶּה וַיִּחַר אַפּוֹ מְאֹד׃
    hebrewPlain: ותצלח רוח אלהים על שאול בשמעו [כשמעו] את הדברים האלה ויחר אפו מאד
    kjvRefs:
    - 1 Samuel 11:6
    kjvOsis:
    - 1Sam.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.7
    scripture: tanakh
    name: Tanakh 1 Samuel 11:7
    ref: 1 Samuel 11:7
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 7362
    text: 'And he took a yoke of oxen, and cut them in pieces, and sent them throughout all the borders of Israel by the hand of messengers, saying: ‘Whosoever cometh not forth after Saul and after Samuel, so shall it be done unto his oxen.’ And the dread of the LORD fell on the people, and they came out as one man.'
    translation: JPS 1917
    original: וַיִּקַּח צֶמֶד בָּקָר וַיְנַתְּחֵהוּ וַיְשַׁלַּח בְּכָל־גְּבוּל יִשְׂרָאֵל בְּיַד הַמַּלְאָכִים לֵאמֹר אֲשֶׁר אֵינֶנּוּ יֹצֵא אַחֲרֵי שָׁאוּל וְאַחַר שְׁמוּאֵל כֹּה יֵעָשֶׂה לִבְקָרוֹ וַיִּפֹּל פַּחַד־יְהוָה עַל־הָעָם וַיֵּצְאוּ כְּאִישׁ אֶחָד׃
    hebrewPlain: ויקח צמד בקר וינתחהו וישלח בכל גבול ישראל ביד המלאכים לאמר אשר איננו יצא אחרי שאול ואחר שמואל כה יעשה לבקרו ויפל פחד יהוה על העם ויצאו כאיש אחד
    kjvRefs:
    - 1 Samuel 11:7
    kjvOsis:
    - 1Sam.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.8
    scripture: tanakh
    name: Tanakh 1 Samuel 11:8
    ref: 1 Samuel 11:8
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 7363
    text: And he numbered them in Bezek; and the children of Israel were three hundred thousand, and the men of Judah thirty thousand.
    translation: JPS 1917
    original: וַיִּפְקְדֵם בְּבָזֶק וַיִּהְיוּ בְנֵי־יִשְׂרָאֵל שְׁלֹשׁ מֵאוֹת אֶלֶף וְאִישׁ יְהוּדָה שְׁלֹשִׁים אָלֶף׃
    hebrewPlain: ויפקדם בבזק ויהיו בני ישראל שלש מאות אלף ואיש יהודה שלשים אלף
    kjvRefs:
    - 1 Samuel 11:8
    kjvOsis:
    - 1Sam.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.9
    scripture: tanakh
    name: Tanakh 1 Samuel 11:9
    ref: 1 Samuel 11:9
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 7364
    text: 'And they said unto the messengers that came: ‘Thus shall ye say unto the men of Jabesh-gilead: To-morrow, by the time the sun is hot, ye shall have deliverance.’ And the messengers came and told the men of Jabesh; and they were glad.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לַמַּלְאָכִים הַבָּאִים כֹּה תֹאמְרוּן לְאִישׁ יָבֵישׁ גִּלְעָד מָחָר תִּהְיֶה־לָכֶם תְּשׁוּעָה בחם [כְּחֹם] הַשָּׁמֶשׁ וַיָּבֹאוּ הַמַּלְאָכִים וַיַּגִּידוּ לְאַנְשֵׁי יָבֵישׁ וַיִּשְׂמָחוּ׃
    hebrewPlain: ויאמרו למלאכים הבאים כה תאמרון לאיש יביש גלעד מחר תהיה לכם תשועה בחם [כחם] השמש ויבאו המלאכים ויגידו לאנשי יביש וישמחו
    kjvRefs:
    - 1 Samuel 11:9
    kjvOsis:
    - 1Sam.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.10
    scripture: tanakh
    name: Tanakh 1 Samuel 11:10
    ref: 1 Samuel 11:10
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 7365
    text: 'And the men of Jabesh said: ‘To-morrow we will come out unto you, and ye shall do with us all that seemeth good unto you.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אַנְשֵׁי יָבֵישׁ מָחָר נֵצֵא אֲלֵיכֶם וַעֲשִׂיתֶם לָּנוּ כְּכָל־הַטּוֹב בְּעֵינֵיכֶם׃
    hebrewPlain: ויאמרו אנשי יביש מחר נצא אליכם ועשיתם לנו ככל הטוב בעיניכם
    kjvRefs:
    - 1 Samuel 11:10
    kjvOsis:
    - 1Sam.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.11
    scripture: tanakh
    name: Tanakh 1 Samuel 11:11
    ref: 1 Samuel 11:11
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 7366
    text: And it was so on the morrow, that Saul put the people in three companies; and they came into the midst of the camp in the morning watch, and smote the Ammonites until the heat of the day; and it came to pass, that they that remained were scattered, so that two of them were not left together.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַיָּשֶׂם שָׁאוּל אֶת־הָעָם שְׁלֹשָׁה רָאשִׁים וַיָּבֹאוּ בְתוֹךְ־הַמַּחֲנֶה בְּאַשְׁמֹרֶת הַבֹּקֶר וַיַּכּוּ אֶת־עַמּוֹן עַד־חֹם הַיּוֹם וַיְהִי הַנִּשְׁאָרִים וַיָּפֻצוּ וְלֹא נִשְׁאֲרוּ־בָם שְׁנַיִם יָחַד׃
    hebrewPlain: ויהי ממחרת וישם שאול את העם שלשה ראשים ויבאו בתוך המחנה באשמרת הבקר ויכו את עמון עד חם היום ויהי הנשארים ויפצו ולא נשארו בם שנים יחד
    kjvRefs:
    - 1 Samuel 11:11
    kjvOsis:
    - 1Sam.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.12
    scripture: tanakh
    name: Tanakh 1 Samuel 11:12
    ref: 1 Samuel 11:12
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 12
    ordinal: 7367
    text: 'And the people said unto Samuel: ‘Who is he that said: Shall Saul reign over us? bring the men, that we may put them to death.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הָעָם אֶל־שְׁמוּאֵל מִי הָאֹמֵר שָׁאוּל יִמְלֹךְ עָלֵינוּ תְּנוּ הָאֲנָשִׁים וּנְמִיתֵם׃
    hebrewPlain: ויאמר העם אל שמואל מי האמר שאול ימלך עלינו תנו האנשים ונמיתם
    kjvRefs:
    - 1 Samuel 11:12
    kjvOsis:
    - 1Sam.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.13
    scripture: tanakh
    name: Tanakh 1 Samuel 11:13
    ref: 1 Samuel 11:13
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 13
    ordinal: 7368
    text: 'And Saul said: ‘There shall not a man be put to death this day; for to-day the LORD hath wrought deliverance in Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לֹא־יוּמַת אִישׁ בַּיּוֹם הַזֶּה כִּי הַיּוֹם עָשָׂה־יְהוָה תְּשׁוּעָה בְּיִשְׂרָאֵל׃
    hebrewPlain: ויאמר שאול לא יומת איש ביום הזה כי היום עשה יהוה תשועה בישראל
    kjvRefs:
    - 1 Samuel 11:13
    kjvOsis:
    - 1Sam.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.14
    scripture: tanakh
    name: Tanakh 1 Samuel 11:14
    ref: 1 Samuel 11:14
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 14
    ordinal: 7369
    text: 'Then said Samuel to the people: ‘Come and let us go to Gilgal, and renew the kingdom there.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם לְכוּ וְנֵלְכָה הַגִּלְגָּל וּנְחַדֵּשׁ שָׁם הַמְּלוּכָה׃
    hebrewPlain: ויאמר שמואל אל העם לכו ונלכה הגלגל ונחדש שם המלוכה
    kjvRefs:
    - 1 Samuel 11:14
    kjvOsis:
    - 1Sam.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.11.15
    scripture: tanakh
    name: Tanakh 1 Samuel 11:15
    ref: 1 Samuel 11:15
    book: 1Sam
    section: neviim
    chapter: 11
    verse: 15
    ordinal: 7370
    text: And all the people went to Gilgal; and there they made Saul king before the LORD in Gilgal; and there they sacrificed sacrifices of peace-offerings before the LORD; and there Saul and all the men of Israel rejoiced greatly.
    translation: JPS 1917
    original: וַיֵּלְכוּ כָל־הָעָם הַגִּלְגָּל וַיַּמְלִכוּ שָׁם אֶת־שָׁאוּל לִפְנֵי יְהוָה בַּגִּלְגָּל וַיִּזְבְּחוּ־שָׁם זְבָחִים שְׁלָמִים לִפְנֵי יְהוָה וַיִּשְׂמַח שָׁם שָׁאוּל וְכָל־אַנְשֵׁי יִשְׂרָאֵל עַד־מְאֹד׃
    hebrewPlain: וילכו כל העם הגלגל וימלכו שם את שאול לפני יהוה בגלגל ויזבחו שם זבחים שלמים לפני יהוה וישמח שם שאול וכל אנשי ישראל עד מאד
    kjvRefs:
    - 1 Samuel 11:15
    kjvOsis:
    - 1Sam.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.11
- type: TanakhVerse
  data:
    osis: 1Sam.12.1
    scripture: tanakh
    name: Tanakh 1 Samuel 12:1
    ref: 1 Samuel 12:1
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 1
    ordinal: 7371
    text: 'And Samuel said unto all Israel: ‘Behold, I have hearkened unto your voice in all that ye said unto me, and have made a king over you.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־כָּל־יִשְׂרָאֵל הִנֵּה שָׁמַעְתִּי בְקֹלְכֶם לְכֹל אֲשֶׁר־אֲמַרְתֶּם לִי וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ׃
    hebrewPlain: ויאמר שמואל אל כל ישראל הנה שמעתי בקלכם לכל אשר אמרתם לי ואמליך עליכם מלך
    kjvRefs:
    - 1 Samuel 12:1
    kjvOsis:
    - 1Sam.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.2
    scripture: tanakh
    name: Tanakh 1 Samuel 12:2
    ref: 1 Samuel 12:2
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 2
    ordinal: 7372
    text: And now, behold, the king walketh before you; and I am old and grayheaded; and, behold, my sons are with you; and I have walked before you from my youth unto this day.
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה הַמֶּלֶךְ מִתְהַלֵּךְ לִפְנֵיכֶם וַאֲנִי זָקַנְתִּי וָשַׂבְתִּי וּבָנַי הִנָּם אִתְּכֶם וַאֲנִי הִתְהַלַּכְתִּי לִפְנֵיכֶם מִנְּעֻרַי עַד־הַיּוֹם הַזֶּה׃
    hebrewPlain: ועתה הנה המלך מתהלך לפניכם ואני זקנתי ושבתי ובני הנם אתכם ואני התהלכתי לפניכם מנערי עד היום הזה
    kjvRefs:
    - 1 Samuel 12:2
    kjvOsis:
    - 1Sam.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.3
    scripture: tanakh
    name: Tanakh 1 Samuel 12:3
    ref: 1 Samuel 12:3
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 3
    ordinal: 7373
    text: 'Here I am; witness against me before the LORD, and before His anointed: whose ox have I taken? or whose ass have I taken? or whom have I defrauded? or whom have I oppressed? or of whose hand have I taken a ransom to blind mine eyes therewith? and I will restore it you.’'
    translation: JPS 1917
    original: הִנְנִי עֲנוּ בִי נֶגֶד יְהוָה וְנֶגֶד מְשִׁיחוֹ אֶת־שׁוֹר מִי לָקַחְתִּי וַחֲמוֹר מִי לָקַחְתִּי וְאֶת־מִי עָשַׁקְתִּי אֶת־מִי רַצּוֹתִי וּמִיַּד־מִי לָקַחְתִּי כֹפֶר וְאַעְלִים עֵינַי בּוֹ וְאָשִׁיב לָכֶם׃
    hebrewPlain: הנני ענו בי נגד יהוה ונגד משיחו את שור מי לקחתי וחמור מי לקחתי ואת מי עשקתי את מי רצותי ומיד מי לקחתי כפר ואעלים עיני בו ואשיב לכם
    kjvRefs:
    - 1 Samuel 12:3
    kjvOsis:
    - 1Sam.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.4
    scripture: tanakh
    name: Tanakh 1 Samuel 12:4
    ref: 1 Samuel 12:4
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 4
    ordinal: 7374
    text: 'And they said: ‘Thou hast not defrauded us, nor oppressed us, neither hast thou taken aught of any man’s hand.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לֹא עֲשַׁקְתָּנוּ וְלֹא רַצּוֹתָנוּ וְלֹא־לָקַחְתָּ מִיַּד־אִישׁ מְאוּמָה׃
    hebrewPlain: ויאמרו לא עשקתנו ולא רצותנו ולא לקחת מיד איש מאומה
    kjvRefs:
    - 1 Samuel 12:4
    kjvOsis:
    - 1Sam.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.5
    scripture: tanakh
    name: Tanakh 1 Samuel 12:5
    ref: 1 Samuel 12:5
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 5
    ordinal: 7375
    text: 'And he said unto them: ‘The LORD is witness against you, and His anointed is witness this day, that ye have not found aught in my hand.’ And they said: ‘He is witness.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם עֵד יְהוָה בָּכֶם וְעֵד מְשִׁיחוֹ הַיּוֹם הַזֶּה כִּי לֹא מְצָאתֶם בְּיָדִי מְאוּמָה וַיֹּאמֶר עֵד׃
    hebrewPlain: ויאמר אליהם עד יהוה בכם ועד משיחו היום הזה כי לא מצאתם בידי מאומה ויאמר עד
    kjvRefs:
    - 1 Samuel 12:5
    kjvOsis:
    - 1Sam.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.6
    scripture: tanakh
    name: Tanakh 1 Samuel 12:6
    ref: 1 Samuel 12:6
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 6
    ordinal: 7376
    text: 'And Samuel said unto the people: ‘It is the LORD that made Moses and Aaron, and that brought your fathers up out of the land of Egypt.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם יְהוָה אֲשֶׁר עָשָׂה אֶת־מֹשֶׁה וְאֶת־אַהֲרֹן וַאֲשֶׁר הֶעֱלָה אֶת־אֲבֹתֵיכֶם מֵאֶרֶץ מִצְרָיִם׃
    hebrewPlain: ויאמר שמואל אל העם יהוה אשר עשה את משה ואת אהרן ואשר העלה את אבתיכם מארץ מצרים
    kjvRefs:
    - 1 Samuel 12:6
    kjvOsis:
    - 1Sam.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.7
    scripture: tanakh
    name: Tanakh 1 Samuel 12:7
    ref: 1 Samuel 12:7
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 7
    ordinal: 7377
    text: Now therefore stand still, that I may plead with you before the LORD concerning all the righteous acts of the LORD, which He did to you and to your fathers.
    translation: JPS 1917
    original: וְעַתָּה הִתְיַצְּבוּ וְאִשָּׁפְטָה אִתְּכֶם לִפְנֵי יְהוָה אֵת כָּל־צִדְקוֹת יְהוָה אֲשֶׁר־עָשָׂה אִתְּכֶם וְאֶת־אֲבוֹתֵיכֶם׃
    hebrewPlain: ועתה התיצבו ואשפטה אתכם לפני יהוה את כל צדקות יהוה אשר עשה אתכם ואת אבותיכם
    kjvRefs:
    - 1 Samuel 12:7
    kjvOsis:
    - 1Sam.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.8
    scripture: tanakh
    name: Tanakh 1 Samuel 12:8
    ref: 1 Samuel 12:8
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 8
    ordinal: 7378
    text: When Jacob was come into Egypt, then your fathers cried unto the LORD, and the LORD sent Moses and Aaron, who brought forth your fathers out of Egypt, and they were made to dwell in this place.
    translation: JPS 1917
    original: כַּאֲשֶׁר־בָּא יַעֲקֹב מִצְרָיִם וַיִּזְעֲקוּ אֲבוֹתֵיכֶם אֶל־יְהוָה וַיִּשְׁלַח יְהוָה אֶת־מֹשֶׁה וְאֶת־אַהֲרֹן וַיּוֹצִיאוּ אֶת־אֲבֹתֵיכֶם מִמִּצְרַיִם וַיֹּשִׁבוּם בַּמָּקוֹם הַזֶּה׃
    hebrewPlain: כאשר בא יעקב מצרים ויזעקו אבותיכם אל יהוה וישלח יהוה את משה ואת אהרן ויוציאו את אבתיכם ממצרים וישבום במקום הזה
    kjvRefs:
    - 1 Samuel 12:8
    kjvOsis:
    - 1Sam.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.9
    scripture: tanakh
    name: Tanakh 1 Samuel 12:9
    ref: 1 Samuel 12:9
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 9
    ordinal: 7379
    text: But they forgot the LORD their God, and He gave them over into the hand of Sisera, captain of the host of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab, and they fought against them.
    translation: JPS 1917
    original: וַיִּשְׁכְּחוּ אֶת־יְהוָה אֱלֹהֵיהֶם וַיִּמְכֹּר אֹתָם בְּיַד סִיסְרָא שַׂר־צְבָא חָצוֹר וּבְיַד־פְּלִשְׁתִּים וּבְיַד מֶלֶךְ מוֹאָב וַיִּלָּחֲמוּ בָּם׃
    hebrewPlain: וישכחו את יהוה אלהיהם וימכר אתם ביד סיסרא שר צבא חצור וביד פלשתים וביד מלך מואב וילחמו בם
    kjvRefs:
    - 1 Samuel 12:9
    kjvOsis:
    - 1Sam.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.10
    scripture: tanakh
    name: Tanakh 1 Samuel 12:10
    ref: 1 Samuel 12:10
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 10
    ordinal: 7380
    text: 'And they cried unto the LORD, and said: We have sinned, because we have forsaken the LORD, and have served the Baalim and the Ashtaroth; but now deliver us out of the hand of our enemies, and we will serve Thee.'
    translation: JPS 1917
    original: וַיִּזְעֲקוּ אֶל־יְהוָה ויאמר [וַיֹּאמְרוּ] חָטָאנוּ כִּי עָזַבְנוּ אֶת־יְהוָה וַנַּעֲבֹד אֶת־הַבְּעָלִים וְאֶת־הָעַשְׁתָּרוֹת וְעַתָּה הַצִּילֵנוּ מִיַּד אֹיְבֵינוּ וְנַעַבְדֶךָּ׃
    hebrewPlain: ויזעקו אל יהוה ויאמר [ויאמרו] חטאנו כי עזבנו את יהוה ונעבד את הבעלים ואת העשתרות ועתה הצילנו מיד איבינו ונעבדך
    kjvRefs:
    - 1 Samuel 12:10
    kjvOsis:
    - 1Sam.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.11
    scripture: tanakh
    name: Tanakh 1 Samuel 12:11
    ref: 1 Samuel 12:11
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 11
    ordinal: 7381
    text: And the LORD sent Jerubbaal, and Bedan, and Jephthah, and Samuel, and delivered you out of the hand of your enemies on every side, and ye dwelt in safety.
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוָה אֶת־יְרֻבַּעַל וְאֶת־בְּדָן וְאֶת־יִפְתָּח וְאֶת־שְׁמוּאֵל וַיַּצֵּל אֶתְכֶם מִיַּד אֹיְבֵיכֶם מִסָּבִיב וַתֵּשְׁבוּ בֶּטַח׃
    hebrewPlain: וישלח יהוה את ירבעל ואת בדן ואת יפתח ואת שמואל ויצל אתכם מיד איביכם מסביב ותשבו בטח
    kjvRefs:
    - 1 Samuel 12:11
    kjvOsis:
    - 1Sam.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.12
    scripture: tanakh
    name: Tanakh 1 Samuel 12:12
    ref: 1 Samuel 12:12
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 12
    ordinal: 7382
    text: 'And when ye saw that Nahash the king of the children of Ammon came against you, ye said unto me: Nay, but a king shall reign over us; when the LORD your God was your king.'
    translation: JPS 1917
    original: וַתִּרְאוּ כִּי־נָחָשׁ מֶלֶךְ בְּנֵי־עַמּוֹן בָּא עֲלֵיכֶם וַתֹּאמְרוּ לִי לֹא כִּי־מֶלֶךְ יִמְלֹךְ עָלֵינוּ וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם׃
    hebrewPlain: ותראו כי נחש מלך בני עמון בא עליכם ותאמרו לי לא כי מלך ימלך עלינו ויהוה אלהיכם מלככם
    kjvRefs:
    - 1 Samuel 12:12
    kjvOsis:
    - 1Sam.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.13
    scripture: tanakh
    name: Tanakh 1 Samuel 12:13
    ref: 1 Samuel 12:13
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 13
    ordinal: 7383
    text: Now therefore behold the king whom ye have chosen, and whom ye have asked for; and, behold, the LORD hath set a king over you.
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה הַמֶּלֶךְ אֲשֶׁר בְּחַרְתֶּם אֲשֶׁר שְׁאֶלְתֶּם וְהִנֵּה נָתַן יְהוָה עֲלֵיכֶם מֶלֶךְ׃
    hebrewPlain: ועתה הנה המלך אשר בחרתם אשר שאלתם והנה נתן יהוה עליכם מלך
    kjvRefs:
    - 1 Samuel 12:13
    kjvOsis:
    - 1Sam.12.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.14
    scripture: tanakh
    name: Tanakh 1 Samuel 12:14
    ref: 1 Samuel 12:14
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 14
    ordinal: 7384
    text: If ye will fear the LORD, and serve Him, and hearken unto His voice, and not rebel against the commandment of the LORD, and both ye and also the king that reigneth over you be followers of the LORD your God—;
    translation: JPS 1917
    original: אִם־תִּירְאוּ אֶת־יְהוָה וַעֲבַדְתֶּם אֹתוֹ וּשְׁמַעְתֶּם בְּקֹלוֹ וְלֹא תַמְרוּ אֶת־פִּי יְהוָה וִהְיִתֶם גַּם־אַתֶּם וְגַם־הַמֶּלֶךְ אֲשֶׁר מָלַךְ עֲלֵיכֶם אַחַר יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: אם תיראו את יהוה ועבדתם אתו ושמעתם בקלו ולא תמרו את פי יהוה והיתם גם אתם וגם המלך אשר מלך עליכם אחר יהוה אלהיכם
    kjvRefs:
    - 1 Samuel 12:14
    kjvOsis:
    - 1Sam.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.15
    scripture: tanakh
    name: Tanakh 1 Samuel 12:15
    ref: 1 Samuel 12:15
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 15
    ordinal: 7385
    text: but if ye will not hearken unto the voice of the LORD, but rebel against the commandment of the LORD, then shall the hand of the LORD be against you, and against your fathers.
    translation: JPS 1917
    original: וְאִם־לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה וּמְרִיתֶם אֶת־פִּי יְהוָה וְהָיְתָה יַד־יְהוָה בָּכֶם וּבַאֲבֹתֵיכֶם׃
    hebrewPlain: ואם לא תשמעו בקול יהוה ומריתם את פי יהוה והיתה יד יהוה בכם ובאבתיכם
    kjvRefs:
    - 1 Samuel 12:15
    kjvOsis:
    - 1Sam.12.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.16
    scripture: tanakh
    name: Tanakh 1 Samuel 12:16
    ref: 1 Samuel 12:16
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 16
    ordinal: 7386
    text: Now therefore stand still and see this great thing, which the LORD will do before your eyes.
    translation: JPS 1917
    original: גַּם־עַתָּה הִתְיַצְּבוּ וּרְאוּ אֶת־הַדָּבָר הַגָּדוֹל הַזֶּה אֲשֶׁר יְהוָה עֹשֶׂה לְעֵינֵיכֶם׃
    hebrewPlain: גם עתה התיצבו וראו את הדבר הגדול הזה אשר יהוה עשה לעיניכם
    kjvRefs:
    - 1 Samuel 12:16
    kjvOsis:
    - 1Sam.12.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.17
    scripture: tanakh
    name: Tanakh 1 Samuel 12:17
    ref: 1 Samuel 12:17
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 17
    ordinal: 7387
    text: Is it not wheat harvest to-day? I will call unto the LORD, that He may send thunder and rain; and ye shall know and see that your wickedness is great, which ye have done in the sight of the LORD, in asking you a king.’
    translation: JPS 1917
    original: הֲלוֹא קְצִיר־חִטִּים הַיּוֹם אֶקְרָא אֶל־יְהוָה וְיִתֵּן קֹלוֹת וּמָטָר וּדְעוּ וּרְאוּ כִּי־רָעַתְכֶם רַבָּה אֲשֶׁר עֲשִׂיתֶם בְּעֵינֵי יְהוָה לִשְׁאוֹל לָכֶם מֶלֶךְ׃
    hebrewPlain: הלוא קציר חטים היום אקרא אל יהוה ויתן קלות ומטר ודעו וראו כי רעתכם רבה אשר עשיתם בעיני יהוה לשאול לכם מלך
    kjvRefs:
    - 1 Samuel 12:17
    kjvOsis:
    - 1Sam.12.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.18
    scripture: tanakh
    name: Tanakh 1 Samuel 12:18
    ref: 1 Samuel 12:18
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 18
    ordinal: 7388
    text: So Samuel called unto the LORD; and the LORD sent thunder and rain that day; and all the people greatly feared the LORD and Samuel.
    translation: JPS 1917
    original: וַיִּקְרָא שְׁמוּאֵל אֶל־יְהוָה וַיִּתֵּן יְהוָה קֹלֹת וּמָטָר בַּיּוֹם הַהוּא וַיִּירָא כָל־הָעָם מְאֹד אֶת־יְהוָה וְאֶת־שְׁמוּאֵל׃
    hebrewPlain: ויקרא שמואל אל יהוה ויתן יהוה קלת ומטר ביום ההוא ויירא כל העם מאד את יהוה ואת שמואל
    kjvRefs:
    - 1 Samuel 12:18
    kjvOsis:
    - 1Sam.12.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.19
    scripture: tanakh
    name: Tanakh 1 Samuel 12:19
    ref: 1 Samuel 12:19
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 19
    ordinal: 7389
    text: 'And all the people said unto Samuel: ‘Pray for thy servants unto the LORD thy God, that we die not; for we have added unto all our sins this evil, to ask us a king.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ כָל־הָעָם אֶל־שְׁמוּאֵל הִתְפַּלֵּל בְּעַד־עֲבָדֶיךָ אֶל־יְהוָה אֱלֹהֶיךָ וְאַל־נָמוּת כִּי־יָסַפְנוּ עַל־כָּל־חַטֹּאתֵינוּ רָעָה לִשְׁאֹל לָנוּ מֶלֶךְ׃
    hebrewPlain: ויאמרו כל העם אל שמואל התפלל בעד עבדיך אל יהוה אלהיך ואל נמות כי יספנו על כל חטאתינו רעה לשאל לנו מלך
    kjvRefs:
    - 1 Samuel 12:19
    kjvOsis:
    - 1Sam.12.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.20
    scripture: tanakh
    name: Tanakh 1 Samuel 12:20
    ref: 1 Samuel 12:20
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 20
    ordinal: 7390
    text: 'And Samuel said unto the people: ‘Fear not; ye have indeed done all this evil; yet turn not aside from following the LORD, but serve the LORD with all your heart;'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־הָעָם אַל־תִּירָאוּ אַתֶּם עֲשִׂיתֶם אֵת כָּל־הָרָעָה הַזֹּאת אַךְ אַל־תָּסוּרוּ מֵאַחֲרֵי יְהוָה וַעֲבַדְתֶּם אֶת־יְהוָה בְּכָל־לְבַבְכֶם׃
    hebrewPlain: ויאמר שמואל אל העם אל תיראו אתם עשיתם את כל הרעה הזאת אך אל תסורו מאחרי יהוה ועבדתם את יהוה בכל לבבכם
    kjvRefs:
    - 1 Samuel 12:20
    kjvOsis:
    - 1Sam.12.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.21
    scripture: tanakh
    name: Tanakh 1 Samuel 12:21
    ref: 1 Samuel 12:21
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 21
    ordinal: 7391
    text: and turn ye not aside; for then should ye go after vain things which cannot profit nor deliver, for they are vain.
    translation: JPS 1917
    original: וְלֹא תָּסוּרוּ כִּי אַחֲרֵי הַתֹּהוּ אֲשֶׁר לֹא־יוֹעִילוּ וְלֹא יַצִּילוּ כִּי־תֹהוּ הֵמָּה׃
    hebrewPlain: ולא תסורו כי אחרי התהו אשר לא יועילו ולא יצילו כי תהו המה
    kjvRefs:
    - 1 Samuel 12:21
    kjvOsis:
    - 1Sam.12.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.22
    scripture: tanakh
    name: Tanakh 1 Samuel 12:22
    ref: 1 Samuel 12:22
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 22
    ordinal: 7392
    text: For the LORD will not forsake His people for His great name’s sake; because it hath pleased the LORD to make you a people unto Himself.
    translation: JPS 1917
    original: כִּי לֹא־יִטֹּשׁ יְהוָה אֶת־עַמּוֹ בַּעֲבוּר שְׁמוֹ הַגָּדוֹל כִּי הוֹאִיל יְהוָה לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם׃
    hebrewPlain: כי לא יטש יהוה את עמו בעבור שמו הגדול כי הואיל יהוה לעשות אתכם לו לעם
    kjvRefs:
    - 1 Samuel 12:22
