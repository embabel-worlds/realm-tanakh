    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיִּזְבַּח אֶלְקָנָה וְנָתַן לִפְנִנָּה אִשְׁתּוֹ וּלְכָל־בָּנֶיהָ וּבְנוֹתֶיהָ מָנוֹת׃
    hebrewPlain: ויהי היום ויזבח אלקנה ונתן לפננה אשתו ולכל בניה ובנותיה מנות
    kjvRefs:
