    ordinal: 7295
    text: And he will take your men-servants, and your maid-servants, and your goodliest young men, and your asses, and put them to his work.
    translation: JPS 1917
    original: וְאֶת־עַבְדֵיכֶם וְאֶת־שִׁפְחוֹתֵיכֶם וְאֶת־בַּחוּרֵיכֶם הַטּוֹבִים וְאֶת־חֲמוֹרֵיכֶם יִקָּח וְעָשָׂה לִמְלַאכְתּוֹ׃
    hebrewPlain: ואת עבדיכם ואת שפחותיכם ואת בחוריכם הטובים ואת חמוריכם יקח ועשה למלאכתו
