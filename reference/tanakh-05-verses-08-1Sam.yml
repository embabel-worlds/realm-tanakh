- type: TanakhVerse
  data:
    osis: 1Sam.1.6
    scripture: tanakh
    name: Tanakh 1 Samuel 1:6
    ref: 1 Samuel 1:6
    book: 1Sam
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 7128
    text: And her rival vexed her sore, to make her fret, because the LORD had shut up her womb.
    translation: JPS 1917
    original: וְכִעֲסַתָּה צָרָתָהּ גַּם־כַּעַס בַּעֲבוּר הַרְּעִמָהּ כִּי־סָגַר יְהוָה בְּעַד רַחְמָהּ׃
    hebrewPlain: וכעסתה צרתה גם כעס בעבור הרעמה כי סגר יהוה בעד רחמה
    kjvRefs:
    - 1 Samuel 1:6
    kjvOsis:
    - 1Sam.1.6
