    hebrewPlain: ויהי איש אחד מן הרמתים צופים מהר אפרים ושמו אלקנה בן ירחם בן אליהוא בן תחו בן צוף אפרתי
    kjvRefs:
    - 1 Samuel 1:1
    kjvOsis:
    - 1Sam.1.1
