- type: TanakhVerse
  data:
    osis: 1Sam.24.21
    scripture: tanakh
    name: Tanakh 1 Samuel 24:21
    ref: 1 Samuel 24:21
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 21
    ordinal: 7770
    text: And now, behold, I know that thou shalt surely be king, and that the kingdom of Israel shall be established in thy hand.
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה יָדַעְתִּי כִּי מָלֹךְ תִּמְלוֹךְ וְקָמָה בְּיָדְךָ מַמְלֶכֶת יִשְׂרָאֵל׃
    hebrewPlain: ועתה הנה ידעתי כי מלך תמלוך וקמה בידך ממלכת ישראל
    kjvRefs:
    - 1 Samuel 24:20
    kjvOsis:
    - 1Sam.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.22
    scripture: tanakh
    name: Tanakh 1 Samuel 24:22
    ref: 1 Samuel 24:22
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 22
    ordinal: 7771
    text: Swear now therefore unto me by the LORD, that thou wilt not cut off my seed after me, and that thou wilt not destroy my name out of my father’s house.’
    translation: JPS 1917
    original: וְעַתָּה הִשָּׁבְעָה לִּי בַּיהוָה אִם־תַּכְרִית אֶת־זַרְעִי אַחֲרָי וְאִם־תַּשְׁמִיד אֶת־שְׁמִי מִבֵּית אָבִי׃
    hebrewPlain: ועתה השבעה לי ביהוה אם תכרית את זרעי אחרי ואם תשמיד את שמי מבית אבי
    kjvRefs:
    - 1 Samuel 24:21
    kjvOsis:
    - 1Sam.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.24.23
    scripture: tanakh
    name: Tanakh 1 Samuel 24:23
    ref: 1 Samuel 24:23
    book: 1Sam
    section: neviim
    chapter: 24
    verse: 23
    ordinal: 7772
    text: And David swore unto Saul. And Saul went home; but David and his men got them up unto the stronghold.
    translation: JPS 1917
    original: וַיִּשָּׁבַע דָּוִד לְשָׁאוּל וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ וְדָוִד וַאֲנָשָׁיו עָלוּ עַל־הַמְּצוּדָה׃
    hebrewPlain: וישבע דוד לשאול וילך שאול אל ביתו ודוד ואנשיו עלו על המצודה
    kjvRefs:
    - 1 Samuel 24:22
    kjvOsis:
    - 1Sam.24.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.24
- type: TanakhVerse
  data:
    osis: 1Sam.25.1
    scripture: tanakh
    name: Tanakh 1 Samuel 25:1
    ref: 1 Samuel 25:1
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 1
    ordinal: 7773
    text: And Samuel died; and all Israel gathered themselves together, and lamented him, and buried him in his house at Ramah. And David arose, and went down to the wilderness of Paran.
    translation: JPS 1917
    original: וַיָּמָת שְׁמוּאֵל וַיִּקָּבְצוּ כָל־יִשְׂרָאֵל וַיִּסְפְּדוּ־לוֹ וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה וַיָּקָם דָּוִד וַיֵּרֶד אֶל־מִדְבַּר פָּארָן׃
    hebrewPlain: וימת שמואל ויקבצו כל ישראל ויספדו לו ויקברהו בביתו ברמה ויקם דוד וירד אל מדבר פארן
    kjvRefs:
    - 1 Samuel 25:1
    kjvOsis:
    - 1Sam.25.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.2
    scripture: tanakh
    name: Tanakh 1 Samuel 25:2
    ref: 1 Samuel 25:2
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 2
    ordinal: 7774
    text: And there was a man in Maon, whose possessions were in Carmel; and the man was very great, and he had three thousand sheep, and a thousand goats; and he was shearing his sheep in Carmel.
    translation: JPS 1917
    original: וְאִישׁ בְּמָעוֹן וּמַעֲשֵׂהוּ בַכַּרְמֶל וְהָאִישׁ גָּדוֹל מְאֹד וְלוֹ צֹאן שְׁלֹשֶׁת־אֲלָפִים וְאֶלֶף עִזִּים וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ בַּכַּרְמֶל׃
    hebrewPlain: ואיש במעון ומעשהו בכרמל והאיש גדול מאד ולו צאן שלשת אלפים ואלף עזים ויהי בגזז את צאנו בכרמל
    kjvRefs:
    - 1 Samuel 25:2
    kjvOsis:
    - 1Sam.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.3
    scripture: tanakh
    name: Tanakh 1 Samuel 25:3
    ref: 1 Samuel 25:3
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 3
    ordinal: 7775
    text: Now the name of the man was Nabal; and the name of his wife Abigail; and the woman was of good understanding, and of a beautiful form; but the man was churlish and evil in his doings; and he was of the house of Caleb.
    translation: JPS 1917
    original: וְשֵׁם הָאִישׁ נָבָל וְשֵׁם אִשְׁתּוֹ אֲבִגָיִל וְהָאִשָּׁה טוֹבַת־שֶׂכֶל וִיפַת תֹּאַר וְהָאִישׁ קָשֶׁה וְרַע מַעֲלָלִים וְהוּא כלבו [כָלִבִּי׃]
    hebrewPlain: ושם האיש נבל ושם אשתו אבגיל והאשה טובת שכל ויפת תאר והאיש קשה ורע מעללים והוא כלבו [כלבי]
    kjvRefs:
    - 1 Samuel 25:3
    kjvOsis:
    - 1Sam.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.4
    scripture: tanakh
    name: Tanakh 1 Samuel 25:4
    ref: 1 Samuel 25:4
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 4
    ordinal: 7776
    text: And David heard in the wilderness that Nabal was shearing his sheep.
    translation: JPS 1917
    original: וַיִּשְׁמַע דָּוִד בַּמִּדְבָּר כִּי־גֹזֵז נָבָל אֶת־צֹאנוֹ׃
    hebrewPlain: וישמע דוד במדבר כי גזז נבל את צאנו
    kjvRefs:
    - 1 Samuel 25:4
    kjvOsis:
    - 1Sam.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.5
    scripture: tanakh
    name: Tanakh 1 Samuel 25:5
    ref: 1 Samuel 25:5
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 5
    ordinal: 7777
    text: 'And David sent ten young men, and David said unto the young men: ‘Get you up to Carmel, and go to Nabal, and greet him in my name;'
    translation: JPS 1917
    original: וַיִּשְׁלַח דָּוִד עֲשָׂרָה נְעָרִים וַיֹּאמֶר דָּוִד לַנְּעָרִים עֲלוּ כַרְמֶלָה וּבָאתֶם אֶל־נָבָל וּשְׁאֶלְתֶּם־לוֹ בִשְׁמִי לְשָׁלוֹם׃
    hebrewPlain: וישלח דוד עשרה נערים ויאמר דוד לנערים עלו כרמלה ובאתם אל נבל ושאלתם לו בשמי לשלום
    kjvRefs:
    - 1 Samuel 25:5
    kjvOsis:
    - 1Sam.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.6
    scripture: tanakh
    name: Tanakh 1 Samuel 25:6
    ref: 1 Samuel 25:6
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 6
    ordinal: 7778
    text: 'and thus ye shall say: All hail! and peace be both unto thee, and peace be to thy house, and peace be unto all that thou hast.'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם כֹּה לֶחָי וְאַתָּה שָׁלוֹם וּבֵיתְךָ שָׁלוֹם וְכֹל אֲשֶׁר־לְךָ שָׁלוֹם׃
    hebrewPlain: ואמרתם כה לחי ואתה שלום וביתך שלום וכל אשר לך שלום
    kjvRefs:
    - 1 Samuel 25:6
    kjvOsis:
    - 1Sam.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.7
    scripture: tanakh
    name: Tanakh 1 Samuel 25:7
    ref: 1 Samuel 25:7
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 7
    ordinal: 7779
    text: And now I have heard that thou hast shearers; thy shepherds have now been with us, and we did them no hurt, neither was there aught missing unto them, all the while they were in Carmel.
    translation: JPS 1917
    original: וְעַתָּה שָׁמַעְתִּי כִּי גֹזְזִים לָךְ עַתָּה הָרֹעִים אֲשֶׁר־לְךָ הָיוּ עִמָּנוּ לֹא הֶכְלַמְנוּם וְלֹא־נִפְקַד לָהֶם מְאוּמָה כָּל־יְמֵי הֱיוֹתָם בַּכַּרְמֶל׃
    hebrewPlain: ועתה שמעתי כי גזזים לך עתה הרעים אשר לך היו עמנו לא הכלמנום ולא נפקד להם מאומה כל ימי היותם בכרמל
    kjvRefs:
    - 1 Samuel 25:7
    kjvOsis:
    - 1Sam.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.8
    scripture: tanakh
    name: Tanakh 1 Samuel 25:8
    ref: 1 Samuel 25:8
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 8
    ordinal: 7780
    text: Ask thy young men, and they will tell thee; wherefore let the young men find favour in thine eyes; for we come on a good day; give, I pray thee, whatsoever cometh to thy hand, unto thy servants, and to thy son David.’
    translation: JPS 1917
    original: שְׁאַל אֶת־נְעָרֶיךָ וְיַגִּידוּ לָךְ וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ כִּי־עַל־יוֹם טוֹב בָּנוּ תְּנָה־נָּא אֵת אֲשֶׁר תִּמְצָא יָדְךָ לַעֲבָדֶיךָ וּלְבִנְךָ לְדָוִד׃
    hebrewPlain: שאל את נעריך ויגידו לך וימצאו הנערים חן בעיניך כי על יום טוב בנו תנה נא את אשר תמצא ידך לעבדיך ולבנך לדוד
    kjvRefs:
    - 1 Samuel 25:8
    kjvOsis:
    - 1Sam.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.9
    scripture: tanakh
    name: Tanakh 1 Samuel 25:9
    ref: 1 Samuel 25:9
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 9
    ordinal: 7781
    text: And when David’s young men came, they spoke to Nabal according to all those words in the name of David, and ceased.
    translation: JPS 1917
    original: וַיָּבֹאוּ נַעֲרֵי דָוִד וַיְדַבְּרוּ אֶל־נָבָל כְּכָל־הַדְּבָרִים הָאֵלֶּה בְּשֵׁם דָּוִד וַיָּנוּחוּ׃
    hebrewPlain: ויבאו נערי דוד וידברו אל נבל ככל הדברים האלה בשם דוד וינוחו
    kjvRefs:
    - 1 Samuel 25:9
    kjvOsis:
    - 1Sam.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.10
    scripture: tanakh
    name: Tanakh 1 Samuel 25:10
    ref: 1 Samuel 25:10
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 10
    ordinal: 7782
    text: 'And Nabal answered David’s servants, and said: ‘Who is David? and who is the son of Jesse? there are many servants now-a-days that break away every man from his master;'
    translation: JPS 1917
    original: וַיַּעַן נָבָל אֶת־עַבְדֵי דָוִד וַיֹּאמֶר מִי דָוִד וּמִי בֶן־יִשָׁי הַיּוֹם רַבּוּ עֲבָדִים הַמִּתְפָּרְצִים אִישׁ מִפְּנֵי אֲדֹנָיו׃
    hebrewPlain: ויען נבל את עבדי דוד ויאמר מי דוד ומי בן ישי היום רבו עבדים המתפרצים איש מפני אדניו
    kjvRefs:
    - 1 Samuel 25:10
    kjvOsis:
    - 1Sam.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.11
    scripture: tanakh
    name: Tanakh 1 Samuel 25:11
    ref: 1 Samuel 25:11
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 11
    ordinal: 7783
    text: shall I then take my bread, and my water, and my flesh that I have killed for my shearers, and give it unto men of whom I know not whence they are?’
    translation: JPS 1917
    original: וְלָקַחְתִּי אֶת־לַחְמִי וְאֶת־מֵימַי וְאֵת טִבְחָתִי אֲשֶׁר טָבַחְתִּי לְגֹזְזָי וְנָתַתִּי לַאֲנָשִׁים אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה׃
    hebrewPlain: ולקחתי את לחמי ואת מימי ואת טבחתי אשר טבחתי לגזזי ונתתי לאנשים אשר לא ידעתי אי מזה המה
    kjvRefs:
    - 1 Samuel 25:11
    kjvOsis:
    - 1Sam.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.12
    scripture: tanakh
    name: Tanakh 1 Samuel 25:12
    ref: 1 Samuel 25:12
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 12
    ordinal: 7784
    text: So David’s young men turned on their way, and went back, and came and told him according to all these words.
    translation: JPS 1917
    original: וַיַּהַפְכוּ נַעֲרֵי־דָוִד לְדַרְכָּם וַיָּשֻׁבוּ וַיָּבֹאוּ וַיַּגִּדוּ לוֹ כְּכֹל הַדְּבָרִים הָאֵלֶּה׃
    hebrewPlain: ויהפכו נערי דוד לדרכם וישבו ויבאו ויגדו לו ככל הדברים האלה
    kjvRefs:
    - 1 Samuel 25:12
    kjvOsis:
    - 1Sam.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.13
    scripture: tanakh
    name: Tanakh 1 Samuel 25:13
    ref: 1 Samuel 25:13
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 13
    ordinal: 7785
    text: 'And David said unto his men: ‘Gird ye on every man his sword.’ And they girded on every man his sword; and David also girded on his sword; and there went up after David about four hundred men; and two hundred abode by the baggage.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לַאֲנָשָׁיו חִגְרוּ אִישׁ אֶת־חַרְבּוֹ וַיַּחְגְּרוּ אִישׁ אֶת־חַרְבּוֹ וַיַּחְגֹּר גַּם־דָּוִד אֶת־חַרְבּוֹ וַיַּעֲלוּ אַחֲרֵי דָוִד כְּאַרְבַּע מֵאוֹת אִישׁ וּמָאתַיִם יָשְׁבוּ עַל־הַכֵּלִים׃
    hebrewPlain: ויאמר דוד לאנשיו חגרו איש את חרבו ויחגרו איש את חרבו ויחגר גם דוד את חרבו ויעלו אחרי דוד כארבע מאות איש ומאתים ישבו על הכלים
    kjvRefs:
    - 1 Samuel 25:13
    kjvOsis:
    - 1Sam.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.14
    scripture: tanakh
    name: Tanakh 1 Samuel 25:14
    ref: 1 Samuel 25:14
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 14
    ordinal: 7786
    text: 'But one of the young men told Abigail, Nabal’s wife, saying: ‘Behold, David sent messengers out of the wilderness to salute our master; and he flew upon them.'
    translation: JPS 1917
    original: וְלַאֲבִיגַיִל אֵשֶׁת נָבָל הִגִּיד נַעַר־אֶחָד מֵהַנְּעָרִים לֵאמֹר הִנֵּה שָׁלַח דָּוִד מַלְאָכִים מֵהַמִּדְבָּר לְבָרֵךְ אֶת־אֲדֹנֵינוּ וַיָּעַט בָּהֶם׃
    hebrewPlain: ולאביגיל אשת נבל הגיד נער אחד מהנערים לאמר הנה שלח דוד מלאכים מהמדבר לברך את אדנינו ויעט בהם
    kjvRefs:
    - 1 Samuel 25:14
    kjvOsis:
    - 1Sam.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.15
    scripture: tanakh
    name: Tanakh 1 Samuel 25:15
    ref: 1 Samuel 25:15
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 15
    ordinal: 7787
    text: But the men were very good unto us, and we were not hurt, neither missed we any thing, as long as we went with them, when we were in the fields;
    translation: JPS 1917
    original: וְהָאֲנָשִׁים טֹבִים לָנוּ מְאֹד וְלֹא הָכְלַמְנוּ וְלֹא־פָקַדְנוּ מְאוּמָה כָּל־יְמֵי הִתְהַלַּכְנוּ אִתָּם בִּהְיוֹתֵנוּ בַּשָּׂדֶה׃
    hebrewPlain: והאנשים טבים לנו מאד ולא הכלמנו ולא פקדנו מאומה כל ימי התהלכנו אתם בהיותנו בשדה
    kjvRefs:
    - 1 Samuel 25:15
    kjvOsis:
    - 1Sam.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.16
    scripture: tanakh
    name: Tanakh 1 Samuel 25:16
    ref: 1 Samuel 25:16
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 16
    ordinal: 7788
    text: they were a wall unto us both by night and by day, all the while we were with them keeping the sheep.
    translation: JPS 1917
    original: חוֹמָה הָיוּ עָלֵינוּ גַּם־לַיְלָה גַּם־יוֹמָם כָּל־יְמֵי הֱיוֹתֵנוּ עִמָּם רֹעִים הַצֹּאן׃
    hebrewPlain: חומה היו עלינו גם לילה גם יומם כל ימי היותנו עמם רעים הצאן
    kjvRefs:
    - 1 Samuel 25:16
    kjvOsis:
    - 1Sam.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
