- type: TanakhVerse
  data:
    osis: 1Sam.12.23
    scripture: tanakh
    name: Tanakh 1 Samuel 12:23
    ref: 1 Samuel 12:23
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 23
    ordinal: 7393
    text: Moreover as for me, far be it from me that I should sin against the LORD in ceasing to pray for you; but I will instruct you in the good and the right way.
    translation: JPS 1917
    original: גַּם אָנֹכִי חָלִילָה לִּי מֵחֲטֹא לַיהוָה מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם וְהוֹרֵיתִי אֶתְכֶם בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה׃
    hebrewPlain: גם אנכי חלילה לי מחטא ליהוה מחדל להתפלל בעדכם והוריתי אתכם בדרך הטובה והישרה
    kjvRefs:
    - 1 Samuel 12:23
    kjvOsis:
    - 1Sam.12.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.24
    scripture: tanakh
    name: Tanakh 1 Samuel 12:24
    ref: 1 Samuel 12:24
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 24
    ordinal: 7394
    text: Only fear the LORD, and serve Him in truth with all your heart; for consider how great things He hath done for you.
    translation: JPS 1917
    original: אַךְ יְראוּ אֶת־יְהוָה וַעֲבַדְתֶּם אֹתוֹ בֶּאֱמֶת בְּכָל־לְבַבְכֶם כִּי רְאוּ אֵת אֲשֶׁר־הִגְדִּל עִמָּכֶם׃
    hebrewPlain: אך יראו את יהוה ועבדתם אתו באמת בכל לבבכם כי ראו את אשר הגדל עמכם
    kjvRefs:
    - 1 Samuel 12:24
    kjvOsis:
    - 1Sam.12.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.12.25
    scripture: tanakh
    name: Tanakh 1 Samuel 12:25
    ref: 1 Samuel 12:25
    book: 1Sam
    section: neviim
    chapter: 12
    verse: 25
    ordinal: 7395
    text: But if ye shall still do wickedly, ye shall be swept away, both ye and your king.’
    translation: JPS 1917
    original: וְאִם־הָרֵעַ תָּרֵעוּ גַּם־אַתֶּם גַּם־מַלְכְּכֶם תִּסָּפוּ׃
    hebrewPlain: ואם הרע תרעו גם אתם גם מלככם תספו
    kjvRefs:
    - 1 Samuel 12:25
    kjvOsis:
    - 1Sam.12.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.12
- type: TanakhVerse
  data:
    osis: 1Sam.13.1
    scripture: tanakh
    name: Tanakh 1 Samuel 13:1
    ref: 1 Samuel 13:1
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 1
    ordinal: 7396
    text: Saul was a—years old when he began to reign; and two years he reigned over Israel.
    translation: JPS 1917
    original: בֶּן־שָׁנָה שָׁאוּל בְּמָלְכוֹ וּשְׁתֵּי שָׁנִים מָלַךְ עַל־יִשְׂרָאֵל׃
    hebrewPlain: בן שנה שאול במלכו ושתי שנים מלך על ישראל
    kjvRefs:
    - 1 Samuel 13:1
    kjvOsis:
    - 1Sam.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.2
    scripture: tanakh
    name: Tanakh 1 Samuel 13:2
    ref: 1 Samuel 13:2
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 7397
    text: And Saul chose him three thousand men of Israel; whereof two thousand were with Saul in Michmas and in the mount of Beth-el, and a thousand were with Jonathan in Gibeath-benjamin; and the rest of the people he sent every man to his tent.
    translation: JPS 1917
    original: וַיִּבְחַר־לוֹ שָׁאוּל שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל וַיִּהְיוּ עִם־שָׁאוּל אַלְפַּיִם בְּמִכְמָשׂ וּבְהַר בֵּית־אֵל וְאֶלֶף הָיוּ עִם־יוֹנָתָן בְּגִבְעַת בִּנְיָמִין וְיֶתֶר הָעָם שִׁלַּח אִישׁ לְאֹהָלָיו׃
    hebrewPlain: ויבחר לו שאול שלשת אלפים מישראל ויהיו עם שאול אלפים במכמש ובהר בית אל ואלף היו עם יונתן בגבעת בנימין ויתר העם שלח איש לאהליו
    kjvRefs:
    - 1 Samuel 13:2
    kjvOsis:
    - 1Sam.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.3
    scripture: tanakh
    name: Tanakh 1 Samuel 13:3
    ref: 1 Samuel 13:3
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 7398
    text: 'And Jonathan smote the garrison of the Philistines that was in Geba, and the Philistines heard of it. And Saul blew the horn throughout all the land, saying: ‘Let the Hebrews hear.’'
    translation: JPS 1917
    original: וַיַּךְ יוֹנָתָן אֵת נְצִיב פְּלִשְׁתִּים אֲשֶׁר בְּגֶבַע וַיִּשְׁמְעוּ פְּלִשְׁתִּים וְשָׁאוּל תָּקַע בַּשּׁוֹפָר בְּכָל־הָאָרֶץ לֵאמֹר יִשְׁמְעוּ הָעִבְרִים׃
    hebrewPlain: ויך יונתן את נציב פלשתים אשר בגבע וישמעו פלשתים ושאול תקע בשופר בכל הארץ לאמר ישמעו העברים
    kjvRefs:
    - 1 Samuel 13:3
    kjvOsis:
    - 1Sam.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.4
    scripture: tanakh
    name: Tanakh 1 Samuel 13:4
    ref: 1 Samuel 13:4
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 7399
    text: And all Israel heard say that Saul had smitten the garrison of the Philistines, and that Israel also had made himself odious with the Philistines. And the people were gathered together after Saul to Gilgal.
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל שָׁמְעוּ לֵאמֹר הִכָּה שָׁאוּל אֶת־נְצִיב פְּלִשְׁתִּים וְגַם־נִבְאַשׁ יִשְׂרָאֵל בַּפְּלִשְׁתִּים וַיִּצָּעֲקוּ הָעָם אַחֲרֵי שָׁאוּל הַגִּלְגָּל׃
    hebrewPlain: וכל ישראל שמעו לאמר הכה שאול את נציב פלשתים וגם נבאש ישראל בפלשתים ויצעקו העם אחרי שאול הגלגל
    kjvRefs:
    - 1 Samuel 13:4
    kjvOsis:
    - 1Sam.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.5
    scripture: tanakh
    name: Tanakh 1 Samuel 13:5
    ref: 1 Samuel 13:5
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 7400
    text: And the Philistines assembled themselves together to fight with Israel, thirty thousand chariots, and six thousand horsemen, and people as the sand which is on the sea-shore in multitude; and they came up, and pitched in Michmas, eastward of Beth-aven.
    translation: JPS 1917
    original: וּפְלִשְׁתִּים נֶאֶסְפוּ לְהִלָּחֵם עִם־יִשְׂרָאֵל שְׁלֹשִׁים אֶלֶף רֶכֶב וְשֵׁשֶׁת אֲלָפִים פָּרָשִׁים וְעָם כַּחוֹל אֲשֶׁר עַל־שְׂפַת־הַיָּם לָרֹב וַיַּעֲלוּ וַיַּחֲנוּ בְמִכְמָשׂ קִדְמַת בֵּית אָוֶן׃
    hebrewPlain: ופלשתים נאספו להלחם עם ישראל שלשים אלף רכב וששת אלפים פרשים ועם כחול אשר על שפת הים לרב ויעלו ויחנו במכמש קדמת בית און
    kjvRefs:
    - 1 Samuel 13:5
    kjvOsis:
    - 1Sam.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.6
    scripture: tanakh
    name: Tanakh 1 Samuel 13:6
    ref: 1 Samuel 13:6
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 6
    ordinal: 7401
    text: When the men of Israel saw that they were in a strait—for the people were distressed—then the people did hide themselves in caves, and in thickets, and in rocks, and in holds, and in pits.
    translation: JPS 1917
    original: וְאִישׁ יִשְׂרָאֵל רָאוּ כִּי צַר־לוֹ כִּי נִגַּשׂ הָעָם וַיִּתְחַבְּאוּ הָעָם בַּמְּעָרוֹת וּבַחֲוָחִים וּבַסְּלָעִים וּבַצְּרִחִים וּבַבֹּרוֹת׃
    hebrewPlain: ואיש ישראל ראו כי צר לו כי נגש העם ויתחבאו העם במערות ובחוחים ובסלעים ובצרחים ובברות
    kjvRefs:
    - 1 Samuel 13:6
    kjvOsis:
    - 1Sam.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.7
    scripture: tanakh
    name: Tanakh 1 Samuel 13:7
    ref: 1 Samuel 13:7
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 7402
    text: Now some of the Hebrews had gone over the Jordan to the land of Gad and Gilead; but as for Saul, he was yet in Gilgal, and all the people followed him trembling.
    translation: JPS 1917
    original: וְעִבְרִים עָבְרוּ אֶת־הַיַּרְדֵּן אֶרֶץ גָּד וְגִלְעָד וְשָׁאוּל עוֹדֶנּוּ בַגִּלְגָּל וְכָל־הָעָם חָרְדוּ אַחֲרָיו׃
    hebrewPlain: ועברים עברו את הירדן ארץ גד וגלעד ושאול עודנו בגלגל וכל העם חרדו אחריו
    kjvRefs:
    - 1 Samuel 13:7
    kjvOsis:
    - 1Sam.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.8
    scripture: tanakh
    name: Tanakh 1 Samuel 13:8
    ref: 1 Samuel 13:8
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 7403
    text: And he tarried seven days, according to the set time that Samuel had appointed; but Samuel came not to Gilgal; and the people were scattered from him.
    translation: JPS 1917
    original: וייחל [וַיּוֹחֶל ] שִׁבְעַת יָמִים לַמּוֹעֵד אֲשֶׁר שְׁמוּאֵל וְלֹא־בָא שְׁמוּאֵל הַגִּלְגָּל וַיָּפֶץ הָעָם מֵעָלָיו׃
    hebrewPlain: וייחל [ויוחל ] שבעת ימים למועד אשר שמואל ולא בא שמואל הגלגל ויפץ העם מעליו
    kjvRefs:
    - 1 Samuel 13:8
    kjvOsis:
    - 1Sam.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.9
    scripture: tanakh
    name: Tanakh 1 Samuel 13:9
    ref: 1 Samuel 13:9
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 7404
    text: 'And Saul said: ‘Bring hither to me the burnt-offering and the peace-offerings.’ And he offered the burnt-offering.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל הַגִּשׁוּ אֵלַי הָעֹלָה וְהַשְּׁלָמִים וַיַּעַל הָעֹלָה׃
    hebrewPlain: ויאמר שאול הגשו אלי העלה והשלמים ויעל העלה
    kjvRefs:
    - 1 Samuel 13:9
    kjvOsis:
    - 1Sam.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.10
    scripture: tanakh
    name: Tanakh 1 Samuel 13:10
    ref: 1 Samuel 13:10
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 7405
    text: And it came to pass that, as soon as he had made an end of offering the burnt-offering, behold, Samuel came; and Saul went out to meet him, that he might salute him.
    translation: JPS 1917
    original: וַיְהִי כְּכַלֹּתוֹ לְהַעֲלוֹת הָעֹלָה וְהִנֵּה שְׁמוּאֵל בָּא וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ לְבָרֲכוֹ׃
    hebrewPlain: ויהי ככלתו להעלות העלה והנה שמואל בא ויצא שאול לקראתו לברכו
    kjvRefs:
    - 1 Samuel 13:10
    kjvOsis:
    - 1Sam.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.11
    scripture: tanakh
    name: Tanakh 1 Samuel 13:11
    ref: 1 Samuel 13:11
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 7406
    text: 'And Samuel said: ‘What hast thou done?’ And Saul said: ‘Because I saw that the people were scattered from me, and that thou camest not within the days appointed, and that the Philistines assembled themselves together against Michmas;'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל מֶה עָשִׂיתָ וַיֹּאמֶר שָׁאוּל כִּי־רָאִיתִי כִי־נָפַץ הָעָם מֵעָלַי וְאַתָּה לֹא־בָאתָ לְמוֹעֵד הַיָּמִים וּפְלִשְׁתִּים נֶאֱסָפִים מִכְמָשׂ׃
    hebrewPlain: ויאמר שמואל מה עשית ויאמר שאול כי ראיתי כי נפץ העם מעלי ואתה לא באת למועד הימים ופלשתים נאספים מכמש
    kjvRefs:
    - 1 Samuel 13:11
    kjvOsis:
    - 1Sam.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.12
    scripture: tanakh
    name: Tanakh 1 Samuel 13:12
    ref: 1 Samuel 13:12
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 7407
    text: 'therefore said I: Now will the Philistines come down upon me to Gilgal, and I have not entreated the favour of the LORD; I forced myself therefore, and offered the burnt-offering.’'
    translation: JPS 1917
    original: וָאֹמַר עַתָּה יֵרְדוּ פְלִשְׁתִּים אֵלַי הַגִּלְגָּל וּפְנֵי יְהוָה לֹא חִלִּיתִי וָאֶתְאַפַּק וָאַעֲלֶה הָעֹלָה׃
    hebrewPlain: ואמר עתה ירדו פלשתים אלי הגלגל ופני יהוה לא חליתי ואתאפק ואעלה העלה
    kjvRefs:
    - 1 Samuel 13:12
    kjvOsis:
    - 1Sam.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.13
    scripture: tanakh
    name: Tanakh 1 Samuel 13:13
    ref: 1 Samuel 13:13
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 7408
    text: 'And Samuel said to Saul: ‘Thou hast done foolishly; thou hast not kept the commandment of the LORD thy God, which He commanded thee; for now would the LORD have established thy kingdom upon Israel for ever.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־שָׁאוּל נִסְכָּלְתָּ לֹא שָׁמַרְתָּ אֶת־מִצְוַת יְהוָה אֱלֹהֶיךָ אֲשֶׁר צִוָּךְ כִּי עַתָּה הֵכִין יְהוָה אֶת־מַמְלַכְתְּךָ אֶל־יִשְׂרָאֵל עַד־עוֹלָם׃
    hebrewPlain: ויאמר שמואל אל שאול נסכלת לא שמרת את מצות יהוה אלהיך אשר צוך כי עתה הכין יהוה את ממלכתך אל ישראל עד עולם
    kjvRefs:
    - 1 Samuel 13:13
    kjvOsis:
    - 1Sam.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.14
    scripture: tanakh
    name: Tanakh 1 Samuel 13:14
    ref: 1 Samuel 13:14
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 7409
    text: But now thy kingdom shall not continue; the LORD hath sought him a man after His own heart, and the LORD hath appointed him to be prince over His people, because thou hast not kept that which the LORD commanded thee.’
    translation: JPS 1917
    original: וְעַתָּה מַמְלַכְתְּךָ לֹא־תָקוּם בִּקֵּשׁ יְהוָה לוֹ אִישׁ כִּלְבָבוֹ וַיְצַוֵּהוּ יְהוָה לְנָגִיד עַל־עַמּוֹ כִּי לֹא שָׁמַרְתָּ אֵת אֲשֶׁר־צִוְּךָ יְהוָה׃
    hebrewPlain: ועתה ממלכתך לא תקום בקש יהוה לו איש כלבבו ויצוהו יהוה לנגיד על עמו כי לא שמרת את אשר צוך יהוה
    kjvRefs:
    - 1 Samuel 13:14
    kjvOsis:
    - 1Sam.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.15
    scripture: tanakh
    name: Tanakh 1 Samuel 13:15
    ref: 1 Samuel 13:15
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 7410
    text: And Samuel arose, and got him up from Gilgal unto Gibeath-benjamin. And Saul numbered the people that were present with him, about six hundred men.
    translation: JPS 1917
    original: וַיָּקָם שְׁמוּאֵל וַיַּעַל מִן־הַגִּלְגָּל גִּבְעַת בִּנְיָמִן וַיִּפְקֹד שָׁאוּל אֶת־הָעָם הַנִּמְצְאִים עִמּוֹ כְּשֵׁשׁ מֵאוֹת אִישׁ׃
    hebrewPlain: ויקם שמואל ויעל מן הגלגל גבעת בנימן ויפקד שאול את העם הנמצאים עמו כשש מאות איש
    kjvRefs:
    - 1 Samuel 13:15
    kjvOsis:
    - 1Sam.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.16
    scripture: tanakh
    name: Tanakh 1 Samuel 13:16
    ref: 1 Samuel 13:16
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 16
    ordinal: 7411
    text: And Saul, and Jonathan his son, and the people that were present with them, abode in Gibeath-benjamin; but the Philistines encamped in Michmas.
    translation: JPS 1917
    original: וְשָׁאוּל וְיוֹנָתָן בְּנוֹ וְהָעָם הַנִּמְצָא עִמָּם יֹשְׁבִים בְּגֶבַע בִּנְיָמִן וּפְלִשְׁתִּים חָנוּ בְמִכְמָשׂ׃
    hebrewPlain: ושאול ויונתן בנו והעם הנמצא עמם ישבים בגבע בנימן ופלשתים חנו במכמש
    kjvRefs:
    - 1 Samuel 13:16
    kjvOsis:
    - 1Sam.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.17
    scripture: tanakh
    name: Tanakh 1 Samuel 13:17
    ref: 1 Samuel 13:17
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 17
    ordinal: 7412
    text: 'And the spoilers came out of the camp of the Philistines in three companies: one company turned unto the way that leadeth to Ophrah, unto the land of Shual;'
    translation: JPS 1917
    original: וַיֵּצֵא הַמַּשְׁחִית מִמַּחֲנֵה פְלִשְׁתִּים שְׁלֹשָׁה רָאשִׁים הָרֹאשׁ אֶחָד יִפְנֶה אֶל־דֶּרֶךְ עָפְרָה אֶל־אֶרֶץ שׁוּעָל׃
    hebrewPlain: ויצא המשחית ממחנה פלשתים שלשה ראשים הראש אחד יפנה אל דרך עפרה אל ארץ שועל
    kjvRefs:
    - 1 Samuel 13:17
    kjvOsis:
    - 1Sam.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.18
    scripture: tanakh
    name: Tanakh 1 Samuel 13:18
    ref: 1 Samuel 13:18
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 18
    ordinal: 7413
    text: and another company turned the way to Beth-horon; and another company turned the way of the border that looketh down upon the valley of Zeboim toward the wilderness.
    translation: JPS 1917
    original: וְהָרֹאשׁ אֶחָד יִפְנֶה דֶּרֶךְ בֵּית חֹרוֹן וְהָרֹאשׁ אֶחָד יִפְנֶה דֶּרֶךְ הַגְּבוּל הַנִּשְׁקָף עַל־גֵּי הַצְּבֹעִים הַמִּדְבָּרָה׃
    hebrewPlain: והראש אחד יפנה דרך בית חרון והראש אחד יפנה דרך הגבול הנשקף על גי הצבעים המדברה
    kjvRefs:
    - 1 Samuel 13:18
    kjvOsis:
    - 1Sam.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.19
    scripture: tanakh
    name: Tanakh 1 Samuel 13:19
    ref: 1 Samuel 13:19
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 19
    ordinal: 7414
    text: 'Now there was no smith found throughout all the land of Israel; for the Philistines said: ‘Lest the Hebrews make them swords or spears’;'
    translation: JPS 1917
    original: וְחָרָשׁ לֹא יִמָּצֵא בְּכֹל אֶרֶץ יִשְׂרָאֵל כִּי־אמר [אָמְרוּ] פְלִשְׁתִּים פֶּן יַעֲשׂוּ הָעִבְרִים חֶרֶב אוֹ חֲנִית׃
    hebrewPlain: וחרש לא ימצא בכל ארץ ישראל כי אמר [אמרו] פלשתים פן יעשו העברים חרב או חנית
    kjvRefs:
    - 1 Samuel 13:19
    kjvOsis:
    - 1Sam.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.20
    scripture: tanakh
    name: Tanakh 1 Samuel 13:20
    ref: 1 Samuel 13:20
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 20
    ordinal: 7415
    text: but all the Israelites went down to the Philistines, to sharpen every man his plowshare, and his coulter, and his axe, and his mattock.
    translation: JPS 1917
    original: וַיֵּרְדוּ כָל־יִשְׂרָאֵל הַפְּלִשְׁתִּים לִלְטוֹשׁ אִישׁ אֶת־מַחֲרַשְׁתּוֹ וְאֶת־אֵתוֹ וְאֶת־קַרְדֻּמּוֹ וְאֵת מַחֲרֵשָׁתוֹ׃
    hebrewPlain: וירדו כל ישראל הפלשתים ללטוש איש את מחרשתו ואת אתו ואת קרדמו ואת מחרשתו
    kjvRefs:
    - 1 Samuel 13:20
    kjvOsis:
    - 1Sam.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.21
    scripture: tanakh
    name: Tanakh 1 Samuel 13:21
    ref: 1 Samuel 13:21
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 21
    ordinal: 7416
    text: And the price of the filing was ba pim for the mattocks, and for the coulters, and for the forks with three teeth, and for the axes; and to set the goads.
    translation: JPS 1917
    original: וְהָיְתָה הַפְּצִירָה פִים לַמַּחֲרֵשֹׁת וְלָאֵתִים וְלִשְׁלֹשׁ קִלְּשׁוֹן וּלְהַקַּרְדֻּמִּים וּלְהַצִּיב הַדָּרְבָן׃
    hebrewPlain: והיתה הפצירה פים למחרשת ולאתים ולשלש קלשון ולהקרדמים ולהציב הדרבן
    kjvRefs:
    - 1 Samuel 13:21
    kjvOsis:
    - 1Sam.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.22
    scripture: tanakh
    name: Tanakh 1 Samuel 13:22
    ref: 1 Samuel 13:22
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 22
    ordinal: 7417
    text: So it came to pass in the day of battle, that there was neither sword nor spear found in the hand of any of the people that were with Saul and Jonathan; but with Saul and with Jonathan his son was there found.
    translation: JPS 1917
    original: וְהָיָה בְּיוֹם מִלְחֶמֶת וְלֹא נִמְצָא חֶרֶב וַחֲנִית בְּיַד כָּל־הָעָם אֲשֶׁר אֶת־שָׁאוּל וְאֶת־יוֹנָתָן וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ׃
    hebrewPlain: והיה ביום מלחמת ולא נמצא חרב וחנית ביד כל העם אשר את שאול ואת יונתן ותמצא לשאול וליונתן בנו
    kjvRefs:
    - 1 Samuel 13:22
    kjvOsis:
    - 1Sam.13.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.13.23
    scripture: tanakh
    name: Tanakh 1 Samuel 13:23
    ref: 1 Samuel 13:23
    book: 1Sam
    section: neviim
    chapter: 13
    verse: 23
    ordinal: 7418
    text: And the garrison of the Philistines went out unto the pass of Michmas.
    translation: JPS 1917
    original: וַיֵּצֵא מַצַּב פְּלִשְׁתִּים אֶל־מַעֲבַר מִכְמָשׂ׃
    hebrewPlain: ויצא מצב פלשתים אל מעבר מכמש
    kjvRefs:
    - 1 Samuel 13:23
    kjvOsis:
    - 1Sam.13.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.13
- type: TanakhVerse
  data:
    osis: 1Sam.14.1
    scripture: tanakh
    name: Tanakh 1 Samuel 14:1
    ref: 1 Samuel 14:1
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 1
    ordinal: 7419
    text: 'Now it fell upon a day, that Jonathan the son of Saul said unto the young man that bore his armour: ‘Come and let us go over to the Philistines’ garrison, that is on yonder side. But he told not his father.'
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיֹּאמֶר יוֹנָתָן בֶּן־שָׁאוּל אֶל־הַנַּעַר נֹשֵׂא כֵלָיו לְכָה וְנַעְבְּרָה אֶל־מַצַּב פְּלִשְׁתִּים אֲשֶׁר מֵעֵבֶר הַלָּז וּלְאָבִיו לֹא הִגִּיד׃
    hebrewPlain: ויהי היום ויאמר יונתן בן שאול אל הנער נשא כליו לכה ונעברה אל מצב פלשתים אשר מעבר הלז ולאביו לא הגיד
    kjvRefs:
    - 1 Samuel 14:1
    kjvOsis:
    - 1Sam.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.2
    scripture: tanakh
    name: Tanakh 1 Samuel 14:2
    ref: 1 Samuel 14:2
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 2
    ordinal: 7420
    text: And Saul tarried in the uttermost part of Gibeah under the pomegranate-tree which is in Migron; and the people that were with him were about six hundred men,
    translation: JPS 1917
    original: וְשָׁאוּל יוֹשֵׁב בִּקְצֵה הַגִּבְעָה תַּחַת הָרִמּוֹן אֲשֶׁר בְּמִגְרוֹן וְהָעָם אֲשֶׁר עִמּוֹ כְּשֵׁשׁ מֵאוֹת אִישׁ׃
    hebrewPlain: ושאול יושב בקצה הגבעה תחת הרמון אשר במגרון והעם אשר עמו כשש מאות איש
    kjvRefs:
    - 1 Samuel 14:2
    kjvOsis:
    - 1Sam.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.3
    scripture: tanakh
    name: Tanakh 1 Samuel 14:3
    ref: 1 Samuel 14:3
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 7421
    text: and Ahijah, the son of Ahitub, Ichabod’s brother, the son of Phinehas, the son of Eli, the priest of the LORD in Shiloh, wearing an ephod. And the people knew not that Jonathan was gone.
    translation: JPS 1917
    original: וַאֲחִיָּה בֶן־אֲחִטוּב אֲחִי אִיכָבוֹד בֶּן־פִּינְחָס בֶּן־עֵלִי כֹּהֵן יְהוָה בְּשִׁלוֹ נֹשֵׂא אֵפוֹד וְהָעָם לֹא יָדַע כִּי הָלַךְ יוֹנָתָן׃
    hebrewPlain: ואחיה בן אחטוב אחי איכבוד בן פינחס בן עלי כהן יהוה בשלו נשא אפוד והעם לא ידע כי הלך יונתן
    kjvRefs:
    - 1 Samuel 14:3
    kjvOsis:
    - 1Sam.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.4
    scripture: tanakh
    name: Tanakh 1 Samuel 14:4
    ref: 1 Samuel 14:4
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 7422
    text: And between the passes, by which Jonathan sought to go over unto the Philistines’ garrison, there was a rocky crag on the one side, and a rocky crag on the other side; and the name of the one was Bozez, and the name of the other Seneh.
    translation: JPS 1917
    original: וּבֵין הַמַּעְבְּרוֹת אֲשֶׁר בִּקֵּשׁ יוֹנָתָן לַעֲבֹר עַל־מַצַּב פְּלִשְׁתִּים שֵׁן־הַסֶּלַע מֵהָעֵבֶר מִזֶּה וְשֵׁן־הַסֶּלַע מֵהָעֵבֶר מִזֶּה וְשֵׁם הָאֶחָד בּוֹצֵץ וְשֵׁם הָאֶחָד סֶנֶּה׃
    hebrewPlain: ובין המעברות אשר בקש יונתן לעבר על מצב פלשתים שן הסלע מהעבר מזה ושן הסלע מהעבר מזה ושם האחד בוצץ ושם האחד סנה
    kjvRefs:
    - 1 Samuel 14:4
    kjvOsis:
    - 1Sam.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.5
    scripture: tanakh
    name: Tanakh 1 Samuel 14:5
    ref: 1 Samuel 14:5
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 7423
    text: The one crag rose up on the north in front of Michmas, and the other on the south in front of Geba.
    translation: JPS 1917
    original: הַשֵּׁן הָאֶחָד מָצוּק מִצָּפוֹן מוּל מִכְמָשׂ וְהָאֶחָד מִנֶּגֶב מוּל גָּבַע׃
    hebrewPlain: השן האחד מצוק מצפון מול מכמש והאחד מנגב מול גבע
    kjvRefs:
    - 1 Samuel 14:5
    kjvOsis:
    - 1Sam.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.6
    scripture: tanakh
    name: Tanakh 1 Samuel 14:6
    ref: 1 Samuel 14:6
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 7424
    text: 'And Jonathan said to the young man that bore his armour: ‘Come and let us go over unto the garrison of these uncircumcised; it may be that the LORD will work for us; for there is no restraint to the LORD to save by many or by few.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן אֶל־הַנַּעַר נֹשֵׂא כֵלָיו לְכָה וְנַעְבְּרָה אֶל־מַצַּב הָעֲרֵלִים הָאֵלֶּה אוּלַי יַעֲשֶׂה יְהוָה לָנוּ כִּי אֵין לַיהוָה מַעְצוֹר לְהוֹשִׁיעַ בְּרַב אוֹ בִמְעָט׃
    hebrewPlain: ויאמר יהונתן אל הנער נשא כליו לכה ונעברה אל מצב הערלים האלה אולי יעשה יהוה לנו כי אין ליהוה מעצור להושיע ברב או במעט
    kjvRefs:
    - 1 Samuel 14:6
    kjvOsis:
    - 1Sam.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.7
    scripture: tanakh
    name: Tanakh 1 Samuel 14:7
    ref: 1 Samuel 14:7
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 7425
    text: 'And his armour-bearer said unto him: ‘Do all that is in thy heart; turn thee, behold I am with thee according to thy heart.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ נֹשֵׂא כֵלָיו עֲשֵׂה כָּל־אֲשֶׁר בִּלְבָבֶךָ נְטֵה לָךְ הִנְנִי עִמְּךָ כִּלְבָבֶךָ׃
    hebrewPlain: ויאמר לו נשא כליו עשה כל אשר בלבבך נטה לך הנני עמך כלבבך
    kjvRefs:
    - 1 Samuel 14:7
    kjvOsis:
    - 1Sam.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.8
    scripture: tanakh
    name: Tanakh 1 Samuel 14:8
    ref: 1 Samuel 14:8
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 7426
    text: 'Then said Jonathan: ‘Behold, we will pass over unto the men, and we will disclose ourselves unto them.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹנָתָן הִנֵּה אֲנַחְנוּ עֹבְרִים אֶל־הָאֲנָשִׁים וְנִגְלִינוּ אֲלֵיהֶם׃
    hebrewPlain: ויאמר יהונתן הנה אנחנו עברים אל האנשים ונגלינו אליהם
    kjvRefs:
    - 1 Samuel 14:8
    kjvOsis:
    - 1Sam.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.9
    scripture: tanakh
    name: Tanakh 1 Samuel 14:9
    ref: 1 Samuel 14:9
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 7427
    text: 'If they say thus unto us: Tarry until we come to you; then we will stand still in our place, and will not go up unto them.'
    translation: JPS 1917
    original: אִם־כֹּה יֹאמְרוּ אֵלֵינוּ דֹּמּוּ עַד־הַגִּיעֵנוּ אֲלֵיכֶם וְעָמַדְנוּ תַחְתֵּינוּ וְלֹא נַעֲלֶה אֲלֵיהֶם׃
    hebrewPlain: אם כה יאמרו אלינו דמו עד הגיענו אליכם ועמדנו תחתינו ולא נעלה אליהם
    kjvRefs:
    - 1 Samuel 14:9
    kjvOsis:
    - 1Sam.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.10
    scripture: tanakh
    name: Tanakh 1 Samuel 14:10
    ref: 1 Samuel 14:10
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 7428
    text: 'But if they say thus: Come up unto us; then we will go up; for the LORD hath delivered them into our hand; and this shall be the sign unto us.’'
    translation: JPS 1917
    original: וְאִם־כֹּה יֹאמְרוּ עֲלוּ עָלֵינוּ וְעָלִינוּ כִּי־נְתָנָם יְהוָה בְּיָדֵנוּ וְזֶה־לָּנוּ הָאוֹת׃
    hebrewPlain: ואם כה יאמרו עלו עלינו ועלינו כי נתנם יהוה בידנו וזה לנו האות
    kjvRefs:
    - 1 Samuel 14:10
    kjvOsis:
    - 1Sam.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.11
    scripture: tanakh
    name: Tanakh 1 Samuel 14:11
    ref: 1 Samuel 14:11
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 11
    ordinal: 7429
    text: 'And both of them disclosed themselves unto the garrison of the Philistines; and the Philistines said: ‘Behold Hebrews coming forth out of the holes where they hid themselves.’'
    translation: JPS 1917
    original: וַיִּגָּלוּ שְׁנֵיהֶם אֶל־מַצַּב פְּלִשְׁתִּים וַיֹּאמְרוּ פְלִשְׁתִּים הִנֵּה עִבְרִים יֹצְאִים מִן־הַחֹרִים אֲשֶׁר הִתְחַבְּאוּ־שָׁם׃
    hebrewPlain: ויגלו שניהם אל מצב פלשתים ויאמרו פלשתים הנה עברים יצאים מן החרים אשר התחבאו שם
    kjvRefs:
    - 1 Samuel 14:11
    kjvOsis:
    - 1Sam.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.12
    scripture: tanakh
    name: Tanakh 1 Samuel 14:12
    ref: 1 Samuel 14:12
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 12
    ordinal: 7430
    text: 'And the men of the garrison spoke to Jonathan and his armour-bearer, and said: ‘Come up to us, and we will show you a thing.’ And Jonathan said unto his armour-bearer: ‘Come up after me; for the LORD hath delivered them into the hand of Israel.’'
    translation: JPS 1917
    original: וַיַּעֲנוּ אַנְשֵׁי הַמַּצָּבָה אֶת־יוֹנָתָן וְאֶת־נֹשֵׂא כֵלָיו וַיֹּאמְרוּ עֲלוּ אֵלֵינוּ וְנוֹדִיעָה אֶתְכֶם דָּבָר וַיֹּאמֶר יוֹנָתָן אֶל־נֹשֵׂא כֵלָיו עֲלֵה אַחֲרַי כִּי־נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל׃
    hebrewPlain: ויענו אנשי המצבה את יונתן ואת נשא כליו ויאמרו עלו אלינו ונודיעה אתכם דבר ויאמר יונתן אל נשא כליו עלה אחרי כי נתנם יהוה ביד ישראל
    kjvRefs:
    - 1 Samuel 14:12
    kjvOsis:
    - 1Sam.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.13
    scripture: tanakh
    name: Tanakh 1 Samuel 14:13
    ref: 1 Samuel 14:13
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 13
    ordinal: 7431
    text: And Jonathan climbed up upon his hands and upon his feet, and his armour-bearer after him; and they fell before Jonathan; and his armour-bearer slew them after him.
    translation: JPS 1917
    original: וַיַּעַל יוֹנָתָן עַל־יָדָיו וְעַל־רַגְלָיו וְנֹשֵׂא כֵלָיו אַחֲרָיו וַיִּפְּלוּ לִפְנֵי יוֹנָתָן וְנֹשֵׂא כֵלָיו מְמוֹתֵת אַחֲרָיו׃
    hebrewPlain: ויעל יונתן על ידיו ועל רגליו ונשא כליו אחריו ויפלו לפני יונתן ונשא כליו ממותת אחריו
    kjvRefs:
    - 1 Samuel 14:13
    kjvOsis:
    - 1Sam.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.14
    scripture: tanakh
    name: Tanakh 1 Samuel 14:14
    ref: 1 Samuel 14:14
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 14
    ordinal: 7432
    text: And that first slaughter, which Jonathan and his armour-bearer made, was about twenty men, within as it were half a furrow’s length in an acre of land.
    translation: JPS 1917
    original: וַתְּהִי הַמַּכָּה הָרִאשֹׁנָה אֲשֶׁר הִכָּה יוֹנָתָן וְנֹשֵׂא כֵלָיו כְּעֶשְׂרִים אִישׁ כְּבַחֲצִי מַעֲנָה צֶמֶד שָׂדֶה׃
    hebrewPlain: ותהי המכה הראשנה אשר הכה יונתן ונשא כליו כעשרים איש כבחצי מענה צמד שדה
    kjvRefs:
    - 1 Samuel 14:14
    kjvOsis:
    - 1Sam.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.15
    scripture: tanakh
    name: Tanakh 1 Samuel 14:15
    ref: 1 Samuel 14:15
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 15
    ordinal: 7433
    text: And there was a trembling in the camp in the field, and among all the people; the garrison, and the spoilers, they also trembled; and the earth quaked; so it grew into a terror from God.
    translation: JPS 1917
    original: וַתְּהִי חֲרָדָה בַמַּחֲנֶה בַשָּׂדֶה וּבְכָל־הָעָם הַמַּצָּב וְהַמַּשְׁחִית חָרְדוּ גַּם־הֵמָּה וַתִּרְגַּז הָאָרֶץ וַתְּהִי לְחֶרְדַּת אֱלֹהִים׃
    hebrewPlain: ותהי חרדה במחנה בשדה ובכל העם המצב והמשחית חרדו גם המה ותרגז הארץ ותהי לחרדת אלהים
    kjvRefs:
    - 1 Samuel 14:15
    kjvOsis:
    - 1Sam.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.16
    scripture: tanakh
    name: Tanakh 1 Samuel 14:16
    ref: 1 Samuel 14:16
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 16
    ordinal: 7434
    text: And the watchmen of Saul in Gibeath-benjamin looked; and, behold, the multitude melted away, and they went hither and thither.
    translation: JPS 1917
    original: וַיִּרְאוּ הַצֹּפִים לְשָׁאוּל בְּגִבְעַת בִּנְיָמִן וְהִנֵּה הֶהָמוֹן נָמוֹג וַיֵּלֶךְ וַהֲלֹם׃
    hebrewPlain: ויראו הצפים לשאול בגבעת בנימן והנה ההמון נמוג וילך והלם
    kjvRefs:
    - 1 Samuel 14:16
    kjvOsis:
    - 1Sam.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.17
    scripture: tanakh
    name: Tanakh 1 Samuel 14:17
    ref: 1 Samuel 14:17
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 17
    ordinal: 7435
    text: 'Then said Saul unto the people that were with him: ‘Number now, and see who is gone from us.’ And when they had numbered, behold, Jonathan and his armour-bearer were not there.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לָעָם אֲשֶׁר אִתּוֹ פִּקְדוּ־נָא וּרְאוּ מִי הָלַךְ מֵעִמָּנוּ וַיִּפְקְדוּ וְהִנֵּה אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו׃
    hebrewPlain: ויאמר שאול לעם אשר אתו פקדו נא וראו מי הלך מעמנו ויפקדו והנה אין יונתן ונשא כליו
    kjvRefs:
    - 1 Samuel 14:17
    kjvOsis:
    - 1Sam.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.18
    scripture: tanakh
    name: Tanakh 1 Samuel 14:18
    ref: 1 Samuel 14:18
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 18
    ordinal: 7436
    text: 'And Saul said unto Ahijah: ‘Bring hither the ark of God.’ For the ark of God was there at that time with the children of Israel.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לַאֲחִיָּה הַגִּישָׁה אֲרוֹן הָאֱלֹהִים כִּי־הָיָה אֲרוֹן הָאֱלֹהִים בַּיּוֹם הַהוּא וּבְנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויאמר שאול לאחיה הגישה ארון האלהים כי היה ארון האלהים ביום ההוא ובני ישראל
    kjvRefs:
    - 1 Samuel 14:18
    kjvOsis:
    - 1Sam.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.19
    scripture: tanakh
    name: Tanakh 1 Samuel 14:19
    ref: 1 Samuel 14:19
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 19
    ordinal: 7437
    text: 'And it came to pass, while Saul talked unto the priest, that the tumult that was in the camp of the Philistines went on and increased; and Saul said unto the priest: ‘Withdraw thy hand.’'
    translation: JPS 1917
    original: וַיְהִי עַד דִּבֶּר שָׁאוּל אֶל־הַכֹּהֵן וְהֶהָמוֹן אֲשֶׁר בְּמַחֲנֵה פְלִשְׁתִּים וַיֵּלֶךְ הָלוֹךְ וָרָב וַיֹּאמֶר שָׁאוּל אֶל־הַכֹּהֵן אֱסֹף יָדֶךָ׃
    hebrewPlain: ויהי עד דבר שאול אל הכהן וההמון אשר במחנה פלשתים וילך הלוך ורב ויאמר שאול אל הכהן אסף ידך
    kjvRefs:
    - 1 Samuel 14:19
    kjvOsis:
    - 1Sam.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.20
    scripture: tanakh
    name: Tanakh 1 Samuel 14:20
    ref: 1 Samuel 14:20
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 20
    ordinal: 7438
    text: And Saul and all the people that were with him were gathered together, and came to the battle; and, behold, every man’s sword was against his fellow, and there was a very great discomfiture.
    translation: JPS 1917
    original: וַיִּזָּעֵק שָׁאוּל וְכָל־הָעָם אֲשֶׁר אִתּוֹ וַיָּבֹאוּ עַד־הַמִּלְחָמָה וְהִנֵּה הָיְתָה חֶרֶב אִישׁ בְּרֵעֵהוּ מְהוּמָה גְּדוֹלָה מְאֹד׃
    hebrewPlain: ויזעק שאול וכל העם אשר אתו ויבאו עד המלחמה והנה היתה חרב איש ברעהו מהומה גדולה מאד
    kjvRefs:
    - 1 Samuel 14:20
    kjvOsis:
    - 1Sam.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.21
    scripture: tanakh
    name: Tanakh 1 Samuel 14:21
    ref: 1 Samuel 14:21
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 21
    ordinal: 7439
    text: Now the Hebrews that were with the Philistines as beforetime, and that went up with them into the camp round about; even they also turned to be with the Israelites that were with Saul and Jonathan.
    translation: JPS 1917
    original: וְהָעִבְרִים הָיוּ לַפְּלִשְׁתִּים כְּאֶתְמוֹל שִׁלְשׁוֹם אֲשֶׁר עָלוּ עִמָּם בַּמַּחֲנֶה סָבִיב וְגַם־הֵמָּה לִהְיוֹת עִם־יִשְׂרָאֵל אֲשֶׁר עִם־שָׁאוּל וְיוֹנָתָן׃
    hebrewPlain: והעברים היו לפלשתים כאתמול שלשום אשר עלו עמם במחנה סביב וגם המה להיות עם ישראל אשר עם שאול ויונתן
    kjvRefs:
    - 1 Samuel 14:21
    kjvOsis:
    - 1Sam.14.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.22
    scripture: tanakh
    name: Tanakh 1 Samuel 14:22
    ref: 1 Samuel 14:22
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 22
    ordinal: 7440
    text: Likewise all the men of Israel that had hid themselves in the hill-country of Ephraim, when they heard that the Philistines fled, even they also followed hard after them in the battle.
    translation: JPS 1917
    original: וְכֹל אִישׁ יִשְׂרָאֵל הַמִּתְחַבְּאִים בְּהַר־אֶפְרַיִם שָׁמְעוּ כִּי־נָסוּ פְּלִשְׁתִּים וַיַּדְבְּקוּ גַם־הֵמָּה אַחֲרֵיהֶם בַּמִּלְחָמָה׃
    hebrewPlain: וכל איש ישראל המתחבאים בהר אפרים שמעו כי נסו פלשתים וידבקו גם המה אחריהם במלחמה
    kjvRefs:
    - 1 Samuel 14:22
    kjvOsis:
    - 1Sam.14.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.23
    scripture: tanakh
    name: Tanakh 1 Samuel 14:23
    ref: 1 Samuel 14:23
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 23
    ordinal: 7441
    text: So the LORD saved Israel that day; and the battle passed on as far as Beth-aven.
    translation: JPS 1917
    original: וַיּוֹשַׁע יְהוָה בַּיּוֹם הַהוּא אֶת־יִשְׂרָאֵל וְהַמִּלְחָמָה עָבְרָה אֶת־בֵּית אָוֶן׃
    hebrewPlain: ויושע יהוה ביום ההוא את ישראל והמלחמה עברה את בית און
    kjvRefs:
    - 1 Samuel 14:23
    kjvOsis:
    - 1Sam.14.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.24
    scripture: tanakh
    name: Tanakh 1 Samuel 14:24
    ref: 1 Samuel 14:24
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 24
    ordinal: 7442
    text: 'And the men of Israel were distressed that day; but Saul adjured the people, saying: ‘Cursed be the man that eateth any food until it be evening, and I be avenged on mine enemies.’ So none of the people tasted food.'
    translation: JPS 1917
    original: וְאִישׁ־יִשְׂרָאֵל נִגַּשׂ בַּיּוֹם הַהוּא וַיֹּאֶל שָׁאוּל אֶת־הָעָם לֵאמֹר אָרוּר הָאִישׁ אֲשֶׁר־יֹאכַל לֶחֶם עַד־הָעֶרֶב וְנִקַּמְתִּי מֵאֹיְבַי וְלֹא טָעַם כָּל־הָעָם לָחֶם׃
    hebrewPlain: ואיש ישראל נגש ביום ההוא ויאל שאול את העם לאמר ארור האיש אשר יאכל לחם עד הערב ונקמתי מאיבי ולא טעם כל העם לחם
    kjvRefs:
    - 1 Samuel 14:24
    kjvOsis:
    - 1Sam.14.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.25
    scripture: tanakh
    name: Tanakh 1 Samuel 14:25
    ref: 1 Samuel 14:25
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 25
    ordinal: 7443
    text: And all the people came into the forest; and there was honey upon the ground.
    translation: JPS 1917
    original: וְכָל־הָאָרֶץ בָּאוּ בַיָּעַר וַיְהִי דְבַשׁ עַל־פְּנֵי הַשָּׂדֶה׃
    hebrewPlain: וכל הארץ באו ביער ויהי דבש על פני השדה
    kjvRefs:
    - 1 Samuel 14:25
    kjvOsis:
    - 1Sam.14.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.26
    scripture: tanakh
    name: Tanakh 1 Samuel 14:26
    ref: 1 Samuel 14:26
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 26
    ordinal: 7444
    text: And when the people were come unto the forest, behold a flow of honey; but no man put his hand to his mouth; for the people feared the oath.
    translation: JPS 1917
    original: וַיָּבֹא הָעָם אֶל־הַיַּעַר וְהִנֵּה הֵלֶךְ דְּבָשׁ וְאֵין־מַשִּׂיג יָדוֹ אֶל־פִּיו כִּי־יָרֵא הָעָם אֶת־הַשְּׁבֻעָה׃
    hebrewPlain: ויבא העם אל היער והנה הלך דבש ואין משיג ידו אל פיו כי ירא העם את השבעה
    kjvRefs:
    - 1 Samuel 14:26
    kjvOsis:
    - 1Sam.14.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.27
    scripture: tanakh
    name: Tanakh 1 Samuel 14:27
    ref: 1 Samuel 14:27
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 27
    ordinal: 7445
    text: But Jonathan heard not when his father charged the people with the oath; and he put forth the end of the rod that was in his hand, and dipped it in the honeycomb, and put his hand to his mouth; and his eyes brightened.
    translation: JPS 1917
    original: וְיוֹנָתָן לֹא־שָׁמַע בְּהַשְׁבִּיעַ אָבִיו אֶת־הָעָם וַיִּשְׁלַח אֶת־קְצֵה הַמַּטֶּה אֲשֶׁר בְּיָדוֹ וַיִּטְבֹּל אוֹתָהּ בְּיַעְרַת הַדְּבָשׁ וַיָּשֶׁב יָדוֹ אֶל־פִּיו ותראנה [וַתָּאֹרְנָה] עֵינָיו׃
    hebrewPlain: ויונתן לא שמע בהשביע אביו את העם וישלח את קצה המטה אשר בידו ויטבל אותה ביערת הדבש וישב ידו אל פיו ותראנה [ותארנה] עיניו
    kjvRefs:
    - 1 Samuel 14:27
    kjvOsis:
    - 1Sam.14.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.28
    scripture: tanakh
    name: Tanakh 1 Samuel 14:28
    ref: 1 Samuel 14:28
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 28
    ordinal: 7446
    text: 'Then answered one of the people, and said: ‘Thy father straitly charged the people with an oath, saying: Cursed be the man that eateth food this day; and the people are faint.’'
    translation: JPS 1917
    original: וַיַּעַן אִישׁ מֵהָעָם וַיֹּאמֶר הַשְׁבֵּעַ הִשְׁבִּיעַ אָבִיךָ אֶת־הָעָם לֵאמֹר אָרוּר הָאִישׁ אֲשֶׁר־יֹאכַל לֶחֶם הַיּוֹם וַיָּעַף הָעָם׃
    hebrewPlain: ויען איש מהעם ויאמר השבע השביע אביך את העם לאמר ארור האיש אשר יאכל לחם היום ויעף העם
    kjvRefs:
    - 1 Samuel 14:28
    kjvOsis:
    - 1Sam.14.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.29
    scripture: tanakh
    name: Tanakh 1 Samuel 14:29
    ref: 1 Samuel 14:29
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 29
    ordinal: 7447
    text: 'Then said Jonathan: ‘My father hath troubled the land; see, I pray you, how mine eyes are brightened, because I tasted a little of this honey.'
    translation: JPS 1917
    original: וַיֹּאמֶר יוֹנָתָן עָכַר אָבִי אֶת־הָאָרֶץ רְאוּ־נָא כִּי־אֹרוּ עֵינַי כִּי טָעַמְתִּי מְעַט דְּבַשׁ הַזֶּה׃
    hebrewPlain: ויאמר יונתן עכר אבי את הארץ ראו נא כי ארו עיני כי טעמתי מעט דבש הזה
    kjvRefs:
    - 1 Samuel 14:29
    kjvOsis:
    - 1Sam.14.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.30
    scripture: tanakh
    name: Tanakh 1 Samuel 14:30
    ref: 1 Samuel 14:30
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 30
    ordinal: 7448
    text: How much more, if haply the people had eaten freely to-day of the spoil of their enemies which they found? had there not been then a much greater slaughter among the Philistines?’
    translation: JPS 1917
    original: אַף כִּי לוּא אָכֹל אָכַל הַיּוֹם הָעָם מִשְּׁלַל אֹיְבָיו אֲשֶׁר מָצָא כִּי עַתָּה לֹא־רָבְתָה מַכָּה בַּפְּלִשְׁתִּים׃
    hebrewPlain: אף כי לוא אכל אכל היום העם משלל איביו אשר מצא כי עתה לא רבתה מכה בפלשתים
    kjvRefs:
    - 1 Samuel 14:30
    kjvOsis:
    - 1Sam.14.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.31
    scripture: tanakh
    name: Tanakh 1 Samuel 14:31
    ref: 1 Samuel 14:31
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 31
    ordinal: 7449
    text: And they smote of the Philistines that day from Michmas to Aijalon; and the people were very faint.
    translation: JPS 1917
    original: וַיַּכּוּ בַּיּוֹם הַהוּא בַּפְּלִשְׁתִּים מִמִּכְמָשׂ אַיָּלֹנָה וַיָּעַף הָעָם מְאֹד׃
    hebrewPlain: ויכו ביום ההוא בפלשתים ממכמש אילנה ויעף העם מאד
    kjvRefs:
    - 1 Samuel 14:31
    kjvOsis:
    - 1Sam.14.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.32
    scripture: tanakh
    name: Tanakh 1 Samuel 14:32
    ref: 1 Samuel 14:32
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 32
    ordinal: 7450
    text: And the people flew upon the spoil, and took sheep, and oxen, and calves, and slew them on the ground; and the people did eat them with the blood.
    translation: JPS 1917
    original: ויעש [וַיַּעַט] הָעָם אֶל־שלל [הַשָּׁלָל] וַיִּקְחוּ צֹאן וּבָקָר וּבְנֵי בָקָר וַיִּשְׁחֲטוּ־אָרְצָה וַיֹּאכַל הָעָם עַל־הַדָּם׃
    hebrewPlain: ויעש [ויעט] העם אל שלל [השלל] ויקחו צאן ובקר ובני בקר וישחטו ארצה ויאכל העם על הדם
    kjvRefs:
    - 1 Samuel 14:32
    kjvOsis:
    - 1Sam.14.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.33
    scripture: tanakh
    name: Tanakh 1 Samuel 14:33
    ref: 1 Samuel 14:33
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 33
    ordinal: 7451
    text: 'Then they told Saul, saying: ‘Behold, the people sin against the LORD, in that they eat with the blood.’ And he said: ‘Ye have dealt treacherously; roll a great stone unto me this day.’'
    translation: JPS 1917
    original: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר הִנֵּה הָעָם חֹטִאים לַיהוָה לֶאֱכֹל עַל־הַדָּם וַיֹּאמֶר בְּגַדְתֶּם גֹּלּוּ־אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה׃
    hebrewPlain: ויגידו לשאול לאמר הנה העם חטאים ליהוה לאכל על הדם ויאמר בגדתם גלו אלי היום אבן גדולה
    kjvRefs:
    - 1 Samuel 14:33
    kjvOsis:
    - 1Sam.14.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.34
    scripture: tanakh
    name: Tanakh 1 Samuel 14:34
    ref: 1 Samuel 14:34
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 34
    ordinal: 7452
    text: 'And Saul said: ‘Disperse yourselves among the people, and say unto them: Bring me hither every man his ox, and every man his sheep, and slay them here, and eat; and sin not against the LORD in eating with the blood.’ And all the people brought every man his ox with him that night, and slew them there.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל פֻּצוּ בָעָם וַאֲמַרְתֶּם לָהֶם הַגִּישׁוּ אֵלַי אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ וּשְׁחַטְתֶּם בָּזֶה וַאֲכַלְתֶּם וְלֹא־תֶחֶטְאוּ לַיהוָה לֶאֱכֹל אֶל־הַדָּם וַיַּגִּשׁוּ כָל־הָעָם אִישׁ שׁוֹרוֹ בְיָדוֹ הַלַּיְלָה וַיִּשְׁחֲטוּ־שָׁם׃
    hebrewPlain: ויאמר שאול פצו בעם ואמרתם להם הגישו אלי איש שורו ואיש שיהו ושחטתם בזה ואכלתם ולא תחטאו ליהוה לאכל אל הדם ויגשו כל העם איש שורו בידו הלילה וישחטו שם
    kjvRefs:
    - 1 Samuel 14:34
    kjvOsis:
    - 1Sam.14.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.35
    scripture: tanakh
    name: Tanakh 1 Samuel 14:35
    ref: 1 Samuel 14:35
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 35
    ordinal: 7453
    text: And Saul built an altar unto the LORD; the same was the first altar that he built unto the LORD.
    translation: JPS 1917
    original: וַיִּבֶן שָׁאוּל מִזְבֵּחַ לַיהוָה אֹתוֹ הֵחֵל לִבְנוֹת מִזְבֵּחַ לַיהוָה׃
    hebrewPlain: ויבן שאול מזבח ליהוה אתו החל לבנות מזבח ליהוה
    kjvRefs:
    - 1 Samuel 14:35
    kjvOsis:
    - 1Sam.14.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.36
    scripture: tanakh
    name: Tanakh 1 Samuel 14:36
    ref: 1 Samuel 14:36
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 36
    ordinal: 7454
    text: 'And Saul said: ‘Let us go down after the Philistines by night, and spoil them until the morning light, and let us not leave a man of them.’ And they said: ‘Do whatsoever seemeth good unto thee.’ Then said the priest: ‘Let us draw near hither unto God.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל נֵרְדָה אַחֲרֵי פְלִשְׁתִּים לַיְלָה וְנָבֹזָה בָהֶם עַד־אוֹר הַבֹּקֶר וְלֹא־נַשְׁאֵר בָּהֶם אִישׁ וַיֹּאמְרוּ כָּל־הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה וַיֹּאמֶר הַכֹּהֵן נִקְרְבָה הֲלֹם אֶל־הָאֱלֹהִים׃
    hebrewPlain: ויאמר שאול נרדה אחרי פלשתים לילה ונבזה בהם עד אור הבקר ולא נשאר בהם איש ויאמרו כל הטוב בעיניך עשה ויאמר הכהן נקרבה הלם אל האלהים
    kjvRefs:
    - 1 Samuel 14:36
    kjvOsis:
    - 1Sam.14.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.37
    scripture: tanakh
    name: Tanakh 1 Samuel 14:37
    ref: 1 Samuel 14:37
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 37
    ordinal: 7455
    text: 'And Saul asked counsel of God: ‘Shall I go down after the Philistines? wilt Thou deliver them into the hand of Israel?’ But He answered him not that day.'
    translation: JPS 1917
    original: וַיִּשְׁאַל שָׁאוּל בֵּאלֹהִים הַאֵרֵד אַחֲרֵי פְלִשְׁתִּים הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל וְלֹא עָנָהוּ בַּיּוֹם הַהוּא׃
    hebrewPlain: וישאל שאול באלהים הארד אחרי פלשתים התתנם ביד ישראל ולא ענהו ביום ההוא
    kjvRefs:
    - 1 Samuel 14:37
    kjvOsis:
    - 1Sam.14.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.38
    scripture: tanakh
    name: Tanakh 1 Samuel 14:38
    ref: 1 Samuel 14:38
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 38
    ordinal: 7456
    text: 'And Saul said: ‘Draw nigh hither, all ye chiefs of the people; and know and see wherein this sin hath been this day.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל גֹּשׁוּ הֲלֹם כֹּל פִּנּוֹת הָעָם וּדְעוּ וּרְאוּ בַּמָּה הָיְתָה הַחַטָּאת הַזֹּאת הַיּוֹם׃
    hebrewPlain: ויאמר שאול גשו הלם כל פנות העם ודעו וראו במה היתה החטאת הזאת היום
    kjvRefs:
    - 1 Samuel 14:38
    kjvOsis:
    - 1Sam.14.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.39
    scripture: tanakh
    name: Tanakh 1 Samuel 14:39
    ref: 1 Samuel 14:39
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 39
    ordinal: 7457
    text: For, as the LORD liveth, who saveth Israel, though it be in Jonathan my son, he shall surely die.’ But there was not a man among all the people that answered him.
    translation: JPS 1917
    original: כִּי חַי־יְהוָה הַמּוֹשִׁיעַ אֶת־יִשְׂרָאֵל כִּי אִם־יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי כִּי מוֹת יָמוּת וְאֵין עֹנֵהוּ מִכָּל־הָעָם׃
    hebrewPlain: כי חי יהוה המושיע את ישראל כי אם ישנו ביונתן בני כי מות ימות ואין ענהו מכל העם
    kjvRefs:
    - 1 Samuel 14:39
    kjvOsis:
    - 1Sam.14.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.40
    scripture: tanakh
    name: Tanakh 1 Samuel 14:40
    ref: 1 Samuel 14:40
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 40
    ordinal: 7458
    text: 'Then said he unto all Israel: ‘Be ye on one side, and I and Jonathan my son will be on the other side.’ And the people said unto Saul: ‘Do what seemeth good unto thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־כָּל־יִשְׂרָאֵל אַתֶּם תִּהְיוּ לְעֵבֶר אֶחָד וַאֲנִי וְיוֹנָתָן בְּנִי נִהְיֶה לְעֵבֶר אֶחָד וַיֹּאמְרוּ הָעָם אֶל־שָׁאוּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה׃
    hebrewPlain: ויאמר אל כל ישראל אתם תהיו לעבר אחד ואני ויונתן בני נהיה לעבר אחד ויאמרו העם אל שאול הטוב בעיניך עשה
    kjvRefs:
    - 1 Samuel 14:40
    kjvOsis:
    - 1Sam.14.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.41
    scripture: tanakh
    name: Tanakh 1 Samuel 14:41
    ref: 1 Samuel 14:41
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 41
    ordinal: 7459
    text: 'Therefore Saul said unto the LORD, the God of Israel: ‘Declare the right.’ And Jonathan and Saul were taken by lot; but the people escaped.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־יְהוָה אֱלֹהֵי יִשְׂרָאֵל הָבָה תָמִים וַיִּלָּכֵד יוֹנָתָן וְשָׁאוּל וְהָעָם יָצָאוּ׃
    hebrewPlain: ויאמר שאול אל יהוה אלהי ישראל הבה תמים וילכד יונתן ושאול והעם יצאו
    kjvRefs:
    - 1 Samuel 14:41
    kjvOsis:
    - 1Sam.14.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.42
    scripture: tanakh
    name: Tanakh 1 Samuel 14:42
    ref: 1 Samuel 14:42
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 42
    ordinal: 7460
    text: 'And Saul said: ‘Cast lots between me and Jonathan my son.’ And Jonathan was taken.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל הַפִּילוּ בֵּינִי וּבֵין יוֹנָתָן בְּנִי וַיִּלָּכֵד יוֹנָתָן׃
    hebrewPlain: ויאמר שאול הפילו ביני ובין יונתן בני וילכד יונתן
    kjvRefs:
    - 1 Samuel 14:42
    kjvOsis:
    - 1Sam.14.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.43
    scripture: tanakh
    name: Tanakh 1 Samuel 14:43
    ref: 1 Samuel 14:43
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 43
    ordinal: 7461
    text: 'Then Saul said to Jonathan: ‘Tell me what thou hast done.’ And Jonathan told him, and said: ‘I did certainly taste a little honey with the end of the rod that was in my hand; here am I: I will die.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־יוֹנָתָן הַגִּידָה לִּי מֶה עָשִׂיתָה וַיַּגֶּד־לוֹ יוֹנָתָן וַיֹּאמֶר טָעֹם טָעַמְתִּי בִּקְצֵה הַמַּטֶּה אֲשֶׁר־בְּיָדִי מְעַט דְּבַשׁ הִנְנִי אָמוּת׃
    hebrewPlain: ויאמר שאול אל יונתן הגידה לי מה עשיתה ויגד לו יונתן ויאמר טעם טעמתי בקצה המטה אשר בידי מעט דבש הנני אמות
    kjvRefs:
    - 1 Samuel 14:43
    kjvOsis:
    - 1Sam.14.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.44
    scripture: tanakh
    name: Tanakh 1 Samuel 14:44
    ref: 1 Samuel 14:44
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 44
    ordinal: 7462
    text: 'And Saul said: ‘God do so and more also; thou shalt surely die, Jonathan.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל כֹּה־יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף כִּי־מוֹת תָּמוּת יוֹנָתָן׃
    hebrewPlain: ויאמר שאול כה יעשה אלהים וכה יוסף כי מות תמות יונתן
    kjvRefs:
    - 1 Samuel 14:44
    kjvOsis:
    - 1Sam.14.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.45
    scripture: tanakh
    name: Tanakh 1 Samuel 14:45
    ref: 1 Samuel 14:45
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 45
    ordinal: 7463
    text: 'And the people said unto Saul: ‘Shall Jonathan die, who hath wrought this great salvation in Israel? Far from it; as the LORD liveth, there shall not one hair of his head fall to the ground; for he hath wrought with God this day.’ So the people rescued Jonathan, that he died not.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָעָם אֶל־שָׁאוּל הֲ‍יוֹנָתָן יָמוּת אֲשֶׁר עָשָׂה הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת בְּיִשְׂרָאֵל חָלִילָה חַי־יְהוָה אִם־יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה כִּי־עִם־אֱלֹהִים עָשָׂה הַיּוֹם הַזֶּה וַיִּפְדּוּ הָעָם אֶת־יוֹנָתָן וְלֹא־מֵת׃
    hebrewPlain: ויאמר העם אל שאול ה‍יונתן ימות אשר עשה הישועה הגדולה הזאת בישראל חלילה חי יהוה אם יפל משערת ראשו ארצה כי עם אלהים עשה היום הזה ויפדו העם את יונתן ולא מת
    kjvRefs:
    - 1 Samuel 14:45
    kjvOsis:
    - 1Sam.14.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.46
    scripture: tanakh
    name: Tanakh 1 Samuel 14:46
    ref: 1 Samuel 14:46
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 46
    ordinal: 7464
    text: Then Saul went up from following the Philistines; and the Philistines went to their own place.
    translation: JPS 1917
    original: וַיַּעַל שָׁאוּל מֵאַחֲרֵי פְּלִשְׁתִּים וּפְלִשְׁתִּים הָלְכוּ לִמְקוֹמָם׃
    hebrewPlain: ויעל שאול מאחרי פלשתים ופלשתים הלכו למקומם
    kjvRefs:
    - 1 Samuel 14:46
    kjvOsis:
    - 1Sam.14.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.47
    scripture: tanakh
    name: Tanakh 1 Samuel 14:47
    ref: 1 Samuel 14:47
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 47
    ordinal: 7465
    text: So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab, and against the children of Ammon, and against Edom, and against the kings of Zobah, and against the Philistines; and whithersoever he turned himself, he put them to the worse.
    translation: JPS 1917
    original: וְשָׁאוּל לָכַד הַמְּלוּכָה עַל־יִשְׂרָאֵל וַיִּלָּחֶם סָבִיב בְּכָל־אֹיְבָיו בְּמוֹאָב וּבִבְנֵי־עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים וּבְכֹל אֲשֶׁר־יִפְנֶה יַרְשִׁיעַ׃
    hebrewPlain: ושאול לכד המלוכה על ישראל וילחם סביב בכל איביו במואב ובבני עמון ובאדום ובמלכי צובה ובפלשתים ובכל אשר יפנה ירשיע
    kjvRefs:
    - 1 Samuel 14:47
    kjvOsis:
    - 1Sam.14.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.48
    scripture: tanakh
    name: Tanakh 1 Samuel 14:48
    ref: 1 Samuel 14:48
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 48
    ordinal: 7466
    text: And he did valiantly, and smote the Amalekites, and delivered Israel out of the hands of them that spoiled them.
    translation: JPS 1917
    original: וַיַּעַשׂ חַיִל וַיַּךְ אֶת־עֲמָלֵק וַיַּצֵּל אֶת־יִשְׂרָאֵל מִיַּד שֹׁסֵהוּ׃
    hebrewPlain: ויעש חיל ויך את עמלק ויצל את ישראל מיד שסהו
    kjvRefs:
    - 1 Samuel 14:48
    kjvOsis:
    - 1Sam.14.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.49
    scripture: tanakh
    name: Tanakh 1 Samuel 14:49
    ref: 1 Samuel 14:49
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 49
    ordinal: 7467
    text: 'Now the sons of Saul were Jonathan, and Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the first-born Merab, and the name of the younger Michal;'
    translation: JPS 1917
    original: וַיִּהְיוּ בְּנֵי שָׁאוּל יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי־שׁוּעַ וְשֵׁם שְׁתֵּי בְנֹתָיו שֵׁם הַבְּכִירָה מֵרַב וְשֵׁם הַקְּטַנָּה מִיכַל׃
    hebrewPlain: ויהיו בני שאול יונתן וישוי ומלכי שוע ושם שתי בנתיו שם הבכירה מרב ושם הקטנה מיכל
    kjvRefs:
    - 1 Samuel 14:49
    kjvOsis:
    - 1Sam.14.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.50
    scripture: tanakh
    name: Tanakh 1 Samuel 14:50
    ref: 1 Samuel 14:50
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 50
    ordinal: 7468
    text: and the name of Saul’s wife was Ahinoam the daughter of Ahimaaz; and the name of the captain of his host was Abner, the son of Ner, Saul’s uncle.
    translation: JPS 1917
    original: וְשֵׁם אֵשֶׁת שָׁאוּל אֲחִינֹעַם בַּת־אֲחִימָעַץ וְשֵׁם שַׂר־צְבָאוֹ אֲבִינֵר בֶּן־נֵר דּוֹד שָׁאוּל׃
    hebrewPlain: ושם אשת שאול אחינעם בת אחימעץ ושם שר צבאו אבינר בן נר דוד שאול
    kjvRefs:
    - 1 Samuel 14:50
    kjvOsis:
    - 1Sam.14.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.51
    scripture: tanakh
    name: Tanakh 1 Samuel 14:51
    ref: 1 Samuel 14:51
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 51
    ordinal: 7469
    text: And Kish was the father of Saul, and Ner the father of Abner was the son of Abiel.
    translation: JPS 1917
    original: וְקִישׁ אֲבִי־שָׁאוּל וְנֵר אֲבִי־אַבְנֵר בֶּן־אֲבִיאֵל׃
    hebrewPlain: וקיש אבי שאול ונר אבי אבנר בן אביאל
    kjvRefs:
    - 1 Samuel 14:51
    kjvOsis:
    - 1Sam.14.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.14.52
    scripture: tanakh
    name: Tanakh 1 Samuel 14:52
    ref: 1 Samuel 14:52
    book: 1Sam
    section: neviim
    chapter: 14
    verse: 52
    ordinal: 7470
    text: And there was sore war against the Philistines all the days of Saul; and when Saul saw any mighty man, or any valiant man, he took him unto him.
    translation: JPS 1917
    original: וַתְּהִי הַמִּלְחָמָה חֲזָקָה עַל־פְּלִשְׁתִּים כֹּל יְמֵי שָׁאוּל וְרָאָה שָׁאוּל כָּל־אִישׁ גִּבּוֹר וְכָל־בֶּן־חַיִל וַיַּאַסְפֵהוּ אֵלָיו׃
    hebrewPlain: ותהי המלחמה חזקה על פלשתים כל ימי שאול וראה שאול כל איש גבור וכל בן חיל ויאספהו אליו
    kjvRefs:
    - 1 Samuel 14:52
    kjvOsis:
    - 1Sam.14.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.14
- type: TanakhVerse
  data:
    osis: 1Sam.15.1
    scripture: tanakh
    name: Tanakh 1 Samuel 15:1
    ref: 1 Samuel 15:1
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 1
    ordinal: 7471
    text: 'And Samuel said unto Saul: ‘The LORD sent me to anoint thee to be king over His people, over Israel; now therefore hearken thou unto the voice of the words of the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־שָׁאוּל אֹתִי שָׁלַח יְהוָה לִמְשָׁחֳךָ לְמֶלֶךְ עַל־עַמּוֹ עַל־יִשְׂרָאֵל וְעַתָּה שְׁמַע לְקוֹל דִּבְרֵי יְהוָה׃
    hebrewPlain: ויאמר שמואל אל שאול אתי שלח יהוה למשחך למלך על עמו על ישראל ועתה שמע לקול דברי יהוה
    kjvRefs:
    - 1 Samuel 15:1
    kjvOsis:
    - 1Sam.15.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.2
    scripture: tanakh
    name: Tanakh 1 Samuel 15:2
    ref: 1 Samuel 15:2
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 2
    ordinal: 7472
    text: 'Thus saith the LORD of hosts: I remember that which Amalek did to Israel, how he set himself against him in the way, when he came up out of Egypt.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה צְבָאוֹת פָּקַדְתִּי אֵת אֲשֶׁר־עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל אֲשֶׁר־שָׂם לוֹ בַּדֶּרֶךְ בַּעֲלֹתוֹ מִמִּצְרָיִם׃
    hebrewPlain: כה אמר יהוה צבאות פקדתי את אשר עשה עמלק לישראל אשר שם לו בדרך בעלתו ממצרים
    kjvRefs:
    - 1 Samuel 15:2
    kjvOsis:
    - 1Sam.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.3
    scripture: tanakh
    name: Tanakh 1 Samuel 15:3
    ref: 1 Samuel 15:3
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 3
    ordinal: 7473
    text: Now go and smite Amalek, and utterly destroy all that they have, and spare them not; but slay both man and woman, infant and suckling, ox and sheep, camel and ass.’ .
    translation: JPS 1917
    original: עַתָּה לֵךְ וְהִכִּיתָה אֶת־עֲמָלֵק וְהַחֲרַמְתֶּם אֶת־כָּל־אֲשֶׁר־לוֹ וְלֹא תַחְמֹל עָלָיו וְהֵמַתָּה מֵאִישׁ עַד־אִשָּׁה מֵעֹלֵל וְעַד־יוֹנֵק מִשּׁוֹר וְעַד־שֶׂה מִגָּמָל וְעַד־חֲמוֹר׃
    hebrewPlain: עתה לך והכיתה את עמלק והחרמתם את כל אשר לו ולא תחמל עליו והמתה מאיש עד אשה מעלל ועד יונק משור ועד שה מגמל ועד חמור
    kjvRefs:
    - 1 Samuel 15:3
    kjvOsis:
    - 1Sam.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.4
    scripture: tanakh
    name: Tanakh 1 Samuel 15:4
    ref: 1 Samuel 15:4
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 4
    ordinal: 7474
    text: And Saul summoned the people, and numbered them in Telaim, two hundred thousand footmen, and ten thousand men of Judah.
    translation: JPS 1917
    original: וַיְשַׁמַּע שָׁאוּל אֶת־הָעָם וַיִּפְקְדֵם בַּטְּלָאִים מָאתַיִם אֶלֶף רַגְלִי וַעֲשֶׂרֶת אֲלָפִים אֶת־אִישׁ יְהוּדָה׃
    hebrewPlain: וישמע שאול את העם ויפקדם בטלאים מאתים אלף רגלי ועשרת אלפים את איש יהודה
    kjvRefs:
    - 1 Samuel 15:4
    kjvOsis:
    - 1Sam.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.5
    scripture: tanakh
    name: Tanakh 1 Samuel 15:5
    ref: 1 Samuel 15:5
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 5
    ordinal: 7475
    text: And Saul came to the city of Amalek, and lay in wait in the valley.
    translation: JPS 1917
    original: וַיָּבֹא שָׁאוּל עַד־עִיר עֲמָלֵק וַיָּרֶב בַּנָּחַל׃
    hebrewPlain: ויבא שאול עד עיר עמלק וירב בנחל
    kjvRefs:
    - 1 Samuel 15:5
    kjvOsis:
    - 1Sam.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.6
    scripture: tanakh
    name: Tanakh 1 Samuel 15:6
    ref: 1 Samuel 15:6
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 6
    ordinal: 7476
    text: 'And Saul said unto the Kenites: ‘Go, depart, get you down from among the Amalekites, lest I destroy you with them; for ye showed kindness to all the children of Israel, when they came up out of Egypt.’ So the Kenites departed from among the Amalekites.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־הַקֵּינִי לְכוּ סֻּרוּ רְדוּ מִתּוֹךְ עֲמָלֵקִי פֶּן־אֹסִפְךָ עִמּוֹ וְאַתָּה עָשִׂיתָה חֶסֶד עִם־כָּל־בְּנֵי יִשְׂרָאֵל בַּעֲלוֹתָם מִמִּצְרָיִם וַיָּסַר קֵינִי מִתּוֹךְ עֲמָלֵק׃
    hebrewPlain: ויאמר שאול אל הקיני לכו סרו רדו מתוך עמלקי פן אספך עמו ואתה עשיתה חסד עם כל בני ישראל בעלותם ממצרים ויסר קיני מתוך עמלק
    kjvRefs:
    - 1 Samuel 15:6
    kjvOsis:
    - 1Sam.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.7
    scripture: tanakh
    name: Tanakh 1 Samuel 15:7
    ref: 1 Samuel 15:7
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 7
    ordinal: 7477
    text: And Saul smote the Amalekites, from Havilah as thou goest to Shur, that is in front of Egypt.
    translation: JPS 1917
    original: וַיַּךְ שָׁאוּל אֶת־עֲמָלֵק מֵחֲוִילָה בּוֹאֲךָ שׁוּר אֲשֶׁר עַל־פְּנֵי מִצְרָיִם׃
    hebrewPlain: ויך שאול את עמלק מחוילה בואך שור אשר על פני מצרים
    kjvRefs:
    - 1 Samuel 15:7
    kjvOsis:
    - 1Sam.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.8
    scripture: tanakh
    name: Tanakh 1 Samuel 15:8
    ref: 1 Samuel 15:8
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 8
    ordinal: 7478
    text: And he took Agag the king of the Amalekites alive, and utterly destroyed all the people with the edge of the sword.
    translation: JPS 1917
    original: וַיִּתְפֹּשׂ אֶת־אֲגַג מֶלֶךְ־עֲמָלֵק חָי וְאֶת־כָּל־הָעָם הֶחֱרִים לְפִי־חָרֶב׃
    hebrewPlain: ויתפש את אגג מלך עמלק חי ואת כל העם החרים לפי חרב
    kjvRefs:
    - 1 Samuel 15:8
    kjvOsis:
    - 1Sam.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.9
    scripture: tanakh
    name: Tanakh 1 Samuel 15:9
    ref: 1 Samuel 15:9
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 9
    ordinal: 7479
    text: But Saul and the people spared Agag, and the best of the sheep, and of the oxen, even the young of the second birth, and the lambs, and all that was good, and would not utterly destroy them; but every thing that was of no account and feeble, that they destroyed utterly.
    translation: JPS 1917
    original: וַיַּחְמֹל שָׁאוּל וְהָעָם עַל־אֲגָג וְעַל־מֵיטַב הַצֹּאן וְהַבָּקָר וְהַמִּשְׁנִים וְעַל־הַכָּרִים וְעַל־כָּל־הַטּוֹב וְלֹא אָבוּ הַחֲרִימָם וְכָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס אֹתָהּ הֶחֱרִימוּ׃
    hebrewPlain: ויחמל שאול והעם על אגג ועל מיטב הצאן והבקר והמשנים ועל הכרים ועל כל הטוב ולא אבו החרימם וכל המלאכה נמבזה ונמס אתה החרימו
    kjvRefs:
    - 1 Samuel 15:9
    kjvOsis:
    - 1Sam.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.10
    scripture: tanakh
    name: Tanakh 1 Samuel 15:10
    ref: 1 Samuel 15:10
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 10
    ordinal: 7480
    text: 'Then came the word of the LORD unto Samuel, saying:'
    translation: JPS 1917
    original: וַיְהִי דְּבַר־יְהוָה אֶל־שְׁמוּאֵל לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אל שמואל לאמר
    kjvRefs:
    - 1 Samuel 15:10
    kjvOsis:
    - 1Sam.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.11
    scripture: tanakh
    name: Tanakh 1 Samuel 15:11
    ref: 1 Samuel 15:11
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 11
    ordinal: 7481
    text: ’It repenteth Me that I have set up Saul to be king; for he is turned back from following Me, and hath not performed My commandments.’ And it grieved Samuel; and he cried unto the LORD all night.
    translation: JPS 1917
    original: נִחַמְתִּי כִּי־הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ כִּי־שָׁב מֵאַחֲרַי וְאֶת־דְּבָרַי לֹא הֵקִים וַיִּחַר לִשְׁמוּאֵל וַיִּזְעַק אֶל־יְהוָה כָּל־הַלָּיְלָה׃
    hebrewPlain: נחמתי כי המלכתי את שאול למלך כי שב מאחרי ואת דברי לא הקים ויחר לשמואל ויזעק אל יהוה כל הלילה
    kjvRefs:
    - 1 Samuel 15:11
    kjvOsis:
    - 1Sam.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.12
    scripture: tanakh
    name: Tanakh 1 Samuel 15:12
    ref: 1 Samuel 15:12
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 12
    ordinal: 7482
    text: 'And Samuel rose early to meet Saul in the morning; and it was told Samuel, saying: ‘Saul came to Carmel, and, behold, he is setting him up a monument, and is gone about, and passed on, and gone down to Gilgal.’'
    translation: JPS 1917
    original: וַיַּשְׁכֵּם שְׁמוּאֵל לִקְרַאת שָׁאוּל בַּבֹּקֶר וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר בָּא־שָׁאוּל הַכַּרְמֶלָה וְהִנֵּה מַצִּיב לוֹ יָד וַיִּסֹּב וַיַּעֲבֹר וַיֵּרֶד הַגִּלְגָּל׃
    hebrewPlain: וישכם שמואל לקראת שאול בבקר ויגד לשמואל לאמר בא שאול הכרמלה והנה מציב לו יד ויסב ויעבר וירד הגלגל
    kjvRefs:
    - 1 Samuel 15:12
    kjvOsis:
    - 1Sam.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.13
    scripture: tanakh
    name: Tanakh 1 Samuel 15:13
    ref: 1 Samuel 15:13
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 13
    ordinal: 7483
    text: 'And Samuel came to Saul; and Saul said unto him: ‘Blessed be thou of the LORD; I have performed the commandment of the LORD.’'
    translation: JPS 1917
    original: וַיָּבֹא שְׁמוּאֵל אֶל־שָׁאוּל וַיֹּאמֶר לוֹ שָׁאוּל בָּרוּךְ אַתָּה לַיהוָה הֲקִימֹתִי אֶת־דְּבַר יְהוָה׃
    hebrewPlain: ויבא שמואל אל שאול ויאמר לו שאול ברוך אתה ליהוה הקימתי את דבר יהוה
    kjvRefs:
    - 1 Samuel 15:13
    kjvOsis:
    - 1Sam.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.14
    scripture: tanakh
    name: Tanakh 1 Samuel 15:14
    ref: 1 Samuel 15:14
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 14
    ordinal: 7484
    text: 'And Samuel said: ‘What meaneth then this bleating of the sheep in mine ears, and the lowing of the oxen which I hear?’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל וּמֶה קוֹל־הַצֹּאן הַזֶּה בְּאָזְנָי וְקוֹל הַבָּקָר אֲשֶׁר אָנֹכִי שֹׁמֵעַ׃
    hebrewPlain: ויאמר שמואל ומה קול הצאן הזה באזני וקול הבקר אשר אנכי שמע
    kjvRefs:
    - 1 Samuel 15:14
    kjvOsis:
    - 1Sam.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.15
    scripture: tanakh
    name: Tanakh 1 Samuel 15:15
    ref: 1 Samuel 15:15
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 15
    ordinal: 7485
    text: 'And Saul said: ‘They have brought them from the Amalekites; for the people spared the best of the sheep and of the oxen, to sacrifice unto the LORD thy God; and the rest we have utterly destroyed.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל מֵעֲמָלֵקִי הֱבִיאוּם אֲשֶׁר חָמַל הָעָם עַל־מֵיטַב הַצֹּאן וְהַבָּקָר לְמַעַן זְבֹחַ לַיהוָה אֱלֹהֶיךָ וְאֶת־הַיּוֹתֵר הֶחֱרַמְנוּ׃
    hebrewPlain: ויאמר שאול מעמלקי הביאום אשר חמל העם על מיטב הצאן והבקר למען זבח ליהוה אלהיך ואת היותר החרמנו
    kjvRefs:
    - 1 Samuel 15:15
    kjvOsis:
    - 1Sam.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.16
    scripture: tanakh
    name: Tanakh 1 Samuel 15:16
    ref: 1 Samuel 15:16
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 16
    ordinal: 7486
    text: 'Then Samuel said unto Saul: ‘Stay, and I will tell thee what the LORD hath said to me this night.’ And he said unto him: ‘Say on.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־שָׁאוּל הֶרֶף וְאַגִּידָה לְּךָ אֵת אֲשֶׁר דִּבֶּר יְהוָה אֵלַי הַלָּיְלָה ויאמרו [וַיֹּאמֶר] לוֹ דַּבֵּר׃
    hebrewPlain: ויאמר שמואל אל שאול הרף ואגידה לך את אשר דבר יהוה אלי הלילה ויאמרו [ויאמר] לו דבר
    kjvRefs:
    - 1 Samuel 15:16
    kjvOsis:
    - 1Sam.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.17
    scripture: tanakh
    name: Tanakh 1 Samuel 15:17
    ref: 1 Samuel 15:17
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 17
    ordinal: 7487
    text: 'And Samuel said: ‘Though thou be little in thine own sight, art thou not head of the tribes of Israel? And the LORD anointed thee king over Israel;'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל הֲלוֹא אִם־קָטֹן אַתָּה בְּעֵינֶיךָ רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל אָתָּה וַיִּמְשָׁחֲךָ יְהוָה לְמֶלֶךְ עַל־יִשְׂרָאֵל׃
    hebrewPlain: ויאמר שמואל הלוא אם קטן אתה בעיניך ראש שבטי ישראל אתה וימשחך יהוה למלך על ישראל
    kjvRefs:
    - 1 Samuel 15:17
    kjvOsis:
    - 1Sam.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.18
    scripture: tanakh
    name: Tanakh 1 Samuel 15:18
    ref: 1 Samuel 15:18
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 18
    ordinal: 7488
    text: 'and the LORD sent thee on a journey, and said: Go and utterly destroy the sinners the Amalekites, and fight against them until they be consumed.'
    translation: JPS 1917
    original: וַיִּשְׁלָחֲךָ יְהוָה בְּדָרֶךְ וַיֹּאמֶר לֵךְ וְהַחֲרַמְתָּה אֶת־הַחַטָּאִים אֶת־עֲמָלֵק וְנִלְחַמְתָּ בוֹ עַד כַּלּוֹתָם אֹתָם׃
    hebrewPlain: וישלחך יהוה בדרך ויאמר לך והחרמתה את החטאים את עמלק ונלחמת בו עד כלותם אתם
    kjvRefs:
    - 1 Samuel 15:18
    kjvOsis:
    - 1Sam.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.19
    scripture: tanakh
    name: Tanakh 1 Samuel 15:19
    ref: 1 Samuel 15:19
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 19
    ordinal: 7489
    text: Wherefore then didst thou not hearken to the voice of the LORD, but didst fly upon the spoil, and didst that which was evil in the sight of the LORD?’
    translation: JPS 1917
    original: וְלָמָּה לֹא־שָׁמַעְתָּ בְּקוֹל יְהוָה וַתַּעַט אֶל־הַשָּׁלָל וַתַּעַשׂ הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: ולמה לא שמעת בקול יהוה ותעט אל השלל ותעש הרע בעיני יהוה
    kjvRefs:
    - 1 Samuel 15:19
    kjvOsis:
    - 1Sam.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.20
    scripture: tanakh
    name: Tanakh 1 Samuel 15:20
    ref: 1 Samuel 15:20
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 20
    ordinal: 7490
    text: 'And Saul said unto Samuel: ‘Yea, I have hearkened to the voice of the LORD, and have gone the way which the LORD sent me, and have brought Agag the king of Amalek, and have utterly destroyed the Amalekites.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־שְׁמוּאֵל אֲשֶׁר שָׁמַעְתִּי בְּקוֹל יְהוָה וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר־שְׁלָחַנִי יְהוָה וָאָבִיא אֶת־אֲגַג מֶלֶךְ עֲמָלֵק וְאֶת־עֲמָלֵק הֶחֱרַמְתִּי׃
    hebrewPlain: ויאמר שאול אל שמואל אשר שמעתי בקול יהוה ואלך בדרך אשר שלחני יהוה ואביא את אגג מלך עמלק ואת עמלק החרמתי
    kjvRefs:
    - 1 Samuel 15:20
    kjvOsis:
    - 1Sam.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.21
    scripture: tanakh
    name: Tanakh 1 Samuel 15:21
    ref: 1 Samuel 15:21
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 21
    ordinal: 7491
    text: But the people took of the spoil, sheep and oxen, the chief of the devoted things, to sacrifice unto the LORD thy God in Gilgal.’
    translation: JPS 1917
    original: וַיִּקַּח הָעָם מֵהַשָּׁלָל צֹאן וּבָקָר רֵאשִׁית הַחֵרֶם לִזְבֹּחַ לַיהוָה אֱלֹהֶיךָ בַּגִּלְגָּל׃
    hebrewPlain: ויקח העם מהשלל צאן ובקר ראשית החרם לזבח ליהוה אלהיך בגלגל
    kjvRefs:
    - 1 Samuel 15:21
    kjvOsis:
    - 1Sam.15.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.22
    scripture: tanakh
    name: Tanakh 1 Samuel 15:22
    ref: 1 Samuel 15:22
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 22
    ordinal: 7492
    text: 'And Samuel said: ‘Hath the LORD as great delight in burnt-offerings and sacrifices, As in hearkening to the voice of the LORD? Behold, to obey is better than sacrifice, And to hearken than the fat of rams.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל הַחֵפֶץ לַיהוָה בְּעֹלוֹת וּזְבָחִים כִּשְׁמֹעַ בְּקוֹל יְהוָה הִנֵּה שְׁמֹעַ מִזֶּבַח טוֹב לְהַקְשִׁיב מֵחֵלֶב אֵילִים׃
    hebrewPlain: ויאמר שמואל החפץ ליהוה בעלות וזבחים כשמע בקול יהוה הנה שמע מזבח טוב להקשיב מחלב אילים
    kjvRefs:
    - 1 Samuel 15:22
    kjvOsis:
    - 1Sam.15.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.23
    scripture: tanakh
    name: Tanakh 1 Samuel 15:23
    ref: 1 Samuel 15:23
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 23
    ordinal: 7493
    text: For rebellion is as the sin of witchcraft, And stubbornness is as idolatry and teraphim. Because thou hast rejected the word of the LORD, He hath also rejected thee from being king.’
    translation: JPS 1917
    original: כִּי חַטַּאת־קֶסֶם מֶרִי וְאָוֶן וּתְרָפִים הַפְצַר יַעַן מָאַסְתָּ אֶת־דְּבַר יְהוָה וַיִּמְאָסְךָ מִמֶּלֶךְ׃
    hebrewPlain: כי חטאת קסם מרי ואון ותרפים הפצר יען מאסת את דבר יהוה וימאסך ממלך
    kjvRefs:
    - 1 Samuel 15:23
    kjvOsis:
    - 1Sam.15.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.24
    scripture: tanakh
    name: Tanakh 1 Samuel 15:24
    ref: 1 Samuel 15:24
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 24
    ordinal: 7494
    text: 'And Saul said unto Samuel: ‘I have sinned; for I have transgressed the commandment of the LORD, and thy words; because I feared the people, and hearkened to their voice.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־שְׁמוּאֵל חָטָאתִי כִּי־עָבַרְתִּי אֶת־פִּי־יְהוָה וְאֶת־דְּבָרֶיךָ כִּי יָרֵאתִי אֶת־הָעָם וָאֶשְׁמַע בְּקוֹלָם׃
    hebrewPlain: ויאמר שאול אל שמואל חטאתי כי עברתי את פי יהוה ואת דבריך כי יראתי את העם ואשמע בקולם
    kjvRefs:
    - 1 Samuel 15:24
    kjvOsis:
    - 1Sam.15.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.25
    scripture: tanakh
    name: Tanakh 1 Samuel 15:25
    ref: 1 Samuel 15:25
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 25
    ordinal: 7495
    text: Now therefore, I pray thee, pardon my sin, and return with me, that I may worship the LORD.’
    translation: JPS 1917
    original: וְעַתָּה שָׂא נָא אֶת־חַטָּאתִי וְשׁוּב עִמִּי וְאֶשְׁתַּחֲוֶה לַיהוָה׃
    hebrewPlain: ועתה שא נא את חטאתי ושוב עמי ואשתחוה ליהוה
    kjvRefs:
    - 1 Samuel 15:25
    kjvOsis:
    - 1Sam.15.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.26
    scripture: tanakh
    name: Tanakh 1 Samuel 15:26
    ref: 1 Samuel 15:26
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 26
    ordinal: 7496
    text: 'And Samuel said unto Saul: ‘I will not return with thee; for thou hast rejected the word of the LORD, and the LORD hath rejected thee from being king over Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־שָׁאוּל לֹא אָשׁוּב עִמָּךְ כִּי מָאַסְתָּה אֶת־דְּבַר יְהוָה וַיִּמְאָסְךָ יְהוָה מִהְיוֹת מֶלֶךְ עַל־יִשְׂרָאֵל׃
    hebrewPlain: ויאמר שמואל אל שאול לא אשוב עמך כי מאסתה את דבר יהוה וימאסך יהוה מהיות מלך על ישראל
    kjvRefs:
    - 1 Samuel 15:26
    kjvOsis:
    - 1Sam.15.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.27
    scripture: tanakh
    name: Tanakh 1 Samuel 15:27
    ref: 1 Samuel 15:27
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 27
    ordinal: 7497
    text: And as Samuel turned about to go away, he laid hold upon the skirt of his robe, and it rent.
    translation: JPS 1917
    original: וַיִּסֹּב שְׁמוּאֵל לָלֶכֶת וַיַּחֲזֵק בִּכְנַף־מְעִילוֹ וַיִּקָּרַע׃
    hebrewPlain: ויסב שמואל ללכת ויחזק בכנף מעילו ויקרע
    kjvRefs:
    - 1 Samuel 15:27
    kjvOsis:
    - 1Sam.15.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.28
    scripture: tanakh
    name: Tanakh 1 Samuel 15:28
    ref: 1 Samuel 15:28
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 28
    ordinal: 7498
    text: 'And Samuel said unto him: ‘The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל קָרַע יְהוָה אֶת־מַמְלְכוּת יִשְׂרָאֵל מֵעָלֶיךָ הַיּוֹם וּנְתָנָהּ לְרֵעֲךָ הַטּוֹב מִמֶּךָּ׃
    hebrewPlain: ויאמר אליו שמואל קרע יהוה את ממלכות ישראל מעליך היום ונתנה לרעך הטוב ממך
    kjvRefs:
    - 1 Samuel 15:28
    kjvOsis:
    - 1Sam.15.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.29
    scripture: tanakh
    name: Tanakh 1 Samuel 15:29
    ref: 1 Samuel 15:29
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 29
    ordinal: 7499
    text: And also the Glory of Israel will not lie nor repent; for He is not a man, that He should repent.’
    translation: JPS 1917
    original: וְגַם נֵצַח יִשְׂרָאֵל לֹא יְשַׁקֵּר וְלֹא יִנָּחֵם כִּי לֹא אָדָם הוּא לְהִנָּחֵם׃
    hebrewPlain: וגם נצח ישראל לא ישקר ולא ינחם כי לא אדם הוא להנחם
    kjvRefs:
    - 1 Samuel 15:29
    kjvOsis:
    - 1Sam.15.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.30
    scripture: tanakh
    name: Tanakh 1 Samuel 15:30
    ref: 1 Samuel 15:30
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 30
    ordinal: 7500
    text: 'Then he said: ‘I have sinned; yet honour me now, I pray thee, before the elders of my people, and before Israel, and return with me, that I may worship the LORD thy God.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חָטָאתִי עַתָּה כַּבְּדֵנִי נָא נֶגֶד זִקְנֵי־עַמִּי וְנֶגֶד יִשְׂרָאֵל וְשׁוּב עִמִּי וְהִשְׁתַּחֲוֵיתִי לַיהוָה אֱלֹהֶיךָ׃
    hebrewPlain: ויאמר חטאתי עתה כבדני נא נגד זקני עמי ונגד ישראל ושוב עמי והשתחויתי ליהוה אלהיך
    kjvRefs:
    - 1 Samuel 15:30
    kjvOsis:
    - 1Sam.15.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.31
    scripture: tanakh
    name: Tanakh 1 Samuel 15:31
    ref: 1 Samuel 15:31
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 31
    ordinal: 7501
    text: So Samuel returned after Saul; and Saul worshipped the LORD.
    translation: JPS 1917
    original: וַיָּשָׁב שְׁמוּאֵל אַחֲרֵי שָׁאוּל וַיִּשְׁתַּחוּ שָׁאוּל לַיהוָה׃
    hebrewPlain: וישב שמואל אחרי שאול וישתחו שאול ליהוה
    kjvRefs:
    - 1 Samuel 15:31
    kjvOsis:
    - 1Sam.15.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.32
    scripture: tanakh
    name: Tanakh 1 Samuel 15:32
    ref: 1 Samuel 15:32
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 32
    ordinal: 7502
    text: 'Then said Samuel: ‘Bring ye hither to me Agag the king of the Amalekites.’ And Agag came unto him in chains. And Agag said: ‘Surely the bitterness of death is at hand.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל הַגִּישׁוּ אֵלַי אֶת־אֲגַג מֶלֶךְ עֲמָלֵק וַיֵּלֶךְ אֵלָיו אֲגַג מַעֲדַנֹּת וַיֹּאמֶר אֲגָג אָכֵן סָר מַר־הַמָּוֶת׃
    hebrewPlain: ויאמר שמואל הגישו אלי את אגג מלך עמלק וילך אליו אגג מעדנת ויאמר אגג אכן סר מר המות
    kjvRefs:
    - 1 Samuel 15:32
    kjvOsis:
    - 1Sam.15.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.33
    scripture: tanakh
    name: Tanakh 1 Samuel 15:33
    ref: 1 Samuel 15:33
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 33
    ordinal: 7503
    text: 'And Samuel said: As thy sword hath made women childless, So shall thy mother be childless among women. And Samuel hewed Agag in pieces before the LORD in Gilgal.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל כַּאֲשֶׁר שִׁכְּלָה נָשִׁים חַרְבֶּךָ כֵּן־תִּשְׁכַּל מִנָּשִׁים אִמֶּךָ וַיְשַׁסֵּף שְׁמוּאֵל אֶת־אֲגָג לִפְנֵי יְהוָה בַּגִּלְגָּל׃
    hebrewPlain: ויאמר שמואל כאשר שכלה נשים חרבך כן תשכל מנשים אמך וישסף שמואל את אגג לפני יהוה בגלגל
    kjvRefs:
    - 1 Samuel 15:33
    kjvOsis:
    - 1Sam.15.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.34
    scripture: tanakh
    name: Tanakh 1 Samuel 15:34
    ref: 1 Samuel 15:34
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 34
    ordinal: 7504
    text: Then Samuel went to Ramah; and Saul went up to his house to Gibeath-shaul.
    translation: JPS 1917
    original: וַיֵּלֶךְ שְׁמוּאֵל הָרָמָתָה וְשָׁאוּל עָלָה אֶל־בֵּיתוֹ גִּבְעַת שָׁאוּל׃
    hebrewPlain: וילך שמואל הרמתה ושאול עלה אל ביתו גבעת שאול
    kjvRefs:
    - 1 Samuel 15:34
    kjvOsis:
    - 1Sam.15.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.15.35
    scripture: tanakh
    name: Tanakh 1 Samuel 15:35
    ref: 1 Samuel 15:35
    book: 1Sam
    section: neviim
    chapter: 15
    verse: 35
    ordinal: 7505
    text: And Samuel never beheld Saul again until the day of his death; for Samuel mourned for Saul; and the LORD repented that He had made Saul king over Israel.
    translation: JPS 1917
    original: וְלֹא־יָסַף שְׁמוּאֵל לִרְאוֹת אֶת־שָׁאוּל עַד־יוֹם מוֹתוֹ כִּי־הִתְאַבֵּל שְׁמוּאֵל אֶל־שָׁאוּל וַיהוָה נִחָם כִּי־הִמְלִיךְ אֶת־שָׁאוּל עַל־יִשְׂרָאֵל׃
    hebrewPlain: ולא יסף שמואל לראות את שאול עד יום מותו כי התאבל שמואל אל שאול ויהוה נחם כי המליך את שאול על ישראל
    kjvRefs:
    - 1 Samuel 15:35
    kjvOsis:
    - 1Sam.15.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.15
- type: TanakhVerse
  data:
    osis: 1Sam.16.1
    scripture: tanakh
    name: Tanakh 1 Samuel 16:1
    ref: 1 Samuel 16:1
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 1
    ordinal: 7506
    text: 'And the LORD said unto Samuel: ‘How long wilt thou mourn for Saul, seeing I have rejected him from being king over Israel? fill thy horn with oil, and go, I will send thee to Jesse the Beth-lehemite; for I have provided Me a king among his sons.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־שְׁמוּאֵל עַד־מָתַי אַתָּה מִתְאַבֵּל אֶל־שָׁאוּל וַאֲנִי מְאַסְתִּיו מִמְּלֹךְ עַל־יִשְׂרָאֵל מַלֵּא קַרְנְךָ שֶׁמֶן וְלֵךְ אֶשְׁלָחֲךָ אֶל־יִשַׁי בֵּית־הַלַּחְמִי כִּי־רָאִיתִי בְּבָנָיו לִי מֶלֶךְ׃
    hebrewPlain: ויאמר יהוה אל שמואל עד מתי אתה מתאבל אל שאול ואני מאסתיו ממלך על ישראל מלא קרנך שמן ולך אשלחך אל ישי בית הלחמי כי ראיתי בבניו לי מלך
    kjvRefs:
    - 1 Samuel 16:1
    kjvOsis:
    - 1Sam.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.2
    scripture: tanakh
    name: Tanakh 1 Samuel 16:2
    ref: 1 Samuel 16:2
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 2
    ordinal: 7507
    text: 'And Samuel said: ‘How can I go? if Saul hear it, he will kill me.’ And the LORD said: ‘Take a heifer with thee, and say: I am come to sacrifice to the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֵיךְ אֵלֵךְ וְשָׁמַע שָׁאוּל וַהֲרָגָנִי וַיֹּאמֶר יְהוָה עֶגְלַת בָּקָר תִּקַּח בְּיָדֶךָ וְאָמַרְתָּ לִזְבֹּחַ לַיהוָה בָּאתִי׃
    hebrewPlain: ויאמר שמואל איך אלך ושמע שאול והרגני ויאמר יהוה עגלת בקר תקח בידך ואמרת לזבח ליהוה באתי
    kjvRefs:
    - 1 Samuel 16:2
    kjvOsis:
    - 1Sam.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.3
    scripture: tanakh
    name: Tanakh 1 Samuel 16:3
    ref: 1 Samuel 16:3
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 3
    ordinal: 7508
    text: And call Jesse to the sacrifice, and I will tell thee what thou shalt do; and thou shalt anoint unto Me him whom I name unto thee.’
    translation: JPS 1917
    original: וְקָרָאתָ לְיִשַׁי בַּזָּבַח וְאָנֹכִי אוֹדִיעֲךָ אֵת אֲשֶׁר־תַּעֲשֶׂה וּמָשַׁחְתָּ לִי אֵת אֲשֶׁר־אֹמַר אֵלֶיךָ׃
    hebrewPlain: וקראת לישי בזבח ואנכי אודיעך את אשר תעשה ומשחת לי את אשר אמר אליך
    kjvRefs:
    - 1 Samuel 16:3
    kjvOsis:
    - 1Sam.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.4
    scripture: tanakh
    name: Tanakh 1 Samuel 16:4
    ref: 1 Samuel 16:4
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 4
    ordinal: 7509
    text: 'And Samuel did that which the LORD spoke, and came to Beth-lehem. And the elders of the city came to meet him trembling, and said: ‘Comest thou peaceably?’'
    translation: JPS 1917
    original: וַיַּעַשׂ שְׁמוּאֵל אֵת אֲשֶׁר דִּבֶּר יְהוָה וַיָּבֹא בֵּית לָחֶם וַיֶּחֶרְדוּ זִקְנֵי הָעִיר לִקְרָאתוֹ וַיֹּאמֶר שָׁלֹם בּוֹאֶךָ׃
    hebrewPlain: ויעש שמואל את אשר דבר יהוה ויבא בית לחם ויחרדו זקני העיר לקראתו ויאמר שלם בואך
    kjvRefs:
    - 1 Samuel 16:4
    kjvOsis:
    - 1Sam.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.5
    scripture: tanakh
    name: Tanakh 1 Samuel 16:5
    ref: 1 Samuel 16:5
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 5
    ordinal: 7510
    text: 'And he said: ‘Peaceably; I am come to sacrifice unto the LORD; sanctify yourselves and come with me to the sacrifice.’ And he sanctified Jesse and his sons, and called them to the sacrifice.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁלוֹם לִזְבֹּחַ לַיהוָה בָּאתִי הִתְקַדְּשׁוּ וּבָאתֶם אִתִּי בַּזָּבַח וַיְקַדֵּשׁ אֶת־יִשַׁי וְאֶת־בָּנָיו וַיִּקְרָא לָהֶם לַזָּבַח׃
    hebrewPlain: ויאמר שלום לזבח ליהוה באתי התקדשו ובאתם אתי בזבח ויקדש את ישי ואת בניו ויקרא להם לזבח
    kjvRefs:
    - 1 Samuel 16:5
    kjvOsis:
    - 1Sam.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.6
    scripture: tanakh
    name: Tanakh 1 Samuel 16:6
    ref: 1 Samuel 16:6
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 6
    ordinal: 7511
    text: 'And it came to pass, when they were come, that he beheld Eliab, and said: ‘Surely the LORD’S anointed is before Him.’'
    translation: JPS 1917
    original: וַיְהִי בְּבוֹאָם וַיַּרְא אֶת־אֱלִיאָב וַיֹּאמֶר אַךְ נֶגֶד יְהוָה מְשִׁיחוֹ׃
    hebrewPlain: ויהי בבואם וירא את אליאב ויאמר אך נגד יהוה משיחו
    kjvRefs:
    - 1 Samuel 16:6
    kjvOsis:
    - 1Sam.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.7
    scripture: tanakh
    name: Tanakh 1 Samuel 16:7
    ref: 1 Samuel 16:7
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 7
    ordinal: 7512
    text: 'But the LORD said unto Samuel: ‘Look not on his countenance, or on the height of his stature; because I have rejected him; for it is not as man seeth: for man looketh on the outward appearance, but the LORD looketh on the heart.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־שְׁמוּאֵל אַל־תַּבֵּט אֶל־מַרְאֵהוּ וְאֶל־גְּבֹהַּ קוֹמָתוֹ כִּי מְאַסְתִּיהוּ כִּי לֹא אֲשֶׁר יִרְאֶה הָאָדָם כִּי הָאָדָם יִרְאֶה לַעֵינַיִם וַיהוָה יִרְאֶה לַלֵּבָב׃
    hebrewPlain: ויאמר יהוה אל שמואל אל תבט אל מראהו ואל גבה קומתו כי מאסתיהו כי לא אשר יראה האדם כי האדם יראה לעינים ויהוה יראה ללבב
    kjvRefs:
    - 1 Samuel 16:7
    kjvOsis:
    - 1Sam.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.8
    scripture: tanakh
    name: Tanakh 1 Samuel 16:8
    ref: 1 Samuel 16:8
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 8
    ordinal: 7513
    text: 'Then Jesse called Abinadab, and made him pass before Samuel. And he said: ‘Neither hath the LORD chosen this.’'
    translation: JPS 1917
    original: וַיִּקְרָא יִשַׁי אֶל־אֲבִינָדָב וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל וַיֹּאמֶר גַּם־בָּזֶה לֹא־בָחַר יְהוָה׃
    hebrewPlain: ויקרא ישי אל אבינדב ויעברהו לפני שמואל ויאמר גם בזה לא בחר יהוה
    kjvRefs:
    - 1 Samuel 16:8
    kjvOsis:
    - 1Sam.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.9
    scripture: tanakh
    name: Tanakh 1 Samuel 16:9
    ref: 1 Samuel 16:9
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 9
    ordinal: 7514
    text: 'Then Jesse made Shammah to pass by. And he said: ‘Neither hath the LORD chosen this.’'
    translation: JPS 1917
    original: וַיַּעֲבֵר יִשַׁי שַׁמָּה וַיֹּאמֶר גַּם־בָּזֶה לֹא־בָחַר יְהוָה׃
    hebrewPlain: ויעבר ישי שמה ויאמר גם בזה לא בחר יהוה
    kjvRefs:
    - 1 Samuel 16:9
    kjvOsis:
    - 1Sam.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.10
    scripture: tanakh
    name: Tanakh 1 Samuel 16:10
    ref: 1 Samuel 16:10
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 10
    ordinal: 7515
    text: 'And Jesse made seven of his sons to pass before Samuel. And Samuel said unto Jesse: ‘The LORD hath not chosen these.’'
    translation: JPS 1917
    original: וַיַּעֲבֵר יִשַׁי שִׁבְעַת בָּנָיו לִפְנֵי שְׁמוּאֵל וַיֹּאמֶר שְׁמוּאֵל אֶל־יִשַׁי לֹא־בָחַר יְהוָה בָּאֵלֶּה׃
    hebrewPlain: ויעבר ישי שבעת בניו לפני שמואל ויאמר שמואל אל ישי לא בחר יהוה באלה
    kjvRefs:
    - 1 Samuel 16:10
    kjvOsis:
    - 1Sam.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.11
    scripture: tanakh
    name: Tanakh 1 Samuel 16:11
    ref: 1 Samuel 16:11
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 11
    ordinal: 7516
    text: 'And Samuel said unto Jesse: ‘Are here all thy children?’ And he said: ‘There remaineth yet the youngest, and, behold, he keepeth the sheep.’ And Samuel said unto Jesse: ‘Send and fetch him; for we will not sit down till he come hither.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־יִשַׁי הֲתַמּוּ הַנְּעָרִים וַיֹּאמֶר עוֹד שָׁאַר הַקָּטָן וְהִנֵּה רֹעֶה בַּצֹּאן וַיֹּאמֶר שְׁמוּאֵל אֶל־יִשַׁי שִׁלְחָה וְקָחֶנּוּ כִּי לֹא־נָסֹב עַד־בֹּאוֹ פֹה׃
    hebrewPlain: ויאמר שמואל אל ישי התמו הנערים ויאמר עוד שאר הקטן והנה רעה בצאן ויאמר שמואל אל ישי שלחה וקחנו כי לא נסב עד באו פה
    kjvRefs:
    - 1 Samuel 16:11
    kjvOsis:
    - 1Sam.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.12
    scripture: tanakh
    name: Tanakh 1 Samuel 16:12
    ref: 1 Samuel 16:12
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 12
    ordinal: 7517
    text: 'And he sent, and brought him in. Now he was ruddy, and withal of beautiful eyes, and goodly to look upon. And the LORD said: ‘Arise, anoint him; for this is he.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח וַיְבִיאֵהוּ וְהוּא אַדְמוֹנִי עִם־יְפֵה עֵינַיִם וְטוֹב רֹאִי וַיֹּאמֶר יְהוָה קוּם מְשָׁחֵהוּ כִּי־זֶה הוּא׃
    hebrewPlain: וישלח ויביאהו והוא אדמוני עם יפה עינים וטוב ראי ויאמר יהוה קום משחהו כי זה הוא
    kjvRefs:
    - 1 Samuel 16:12
    kjvOsis:
    - 1Sam.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.13
    scripture: tanakh
    name: Tanakh 1 Samuel 16:13
    ref: 1 Samuel 16:13
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 13
    ordinal: 7518
    text: Then Samuel took the horn of oil, and anointed him in the midst of his brethren; and the spirit of the LORD came mightily upon David from that day forward. So Samuel rose up, and went to Ramah.
    translation: JPS 1917
    original: וַיִּקַּח שְׁמוּאֵל אֶת־קֶרֶן הַשֶּׁמֶן וַיִּמְשַׁח אֹתוֹ בְּקֶרֶב אֶחָיו וַתִּצְלַח רוּחַ־יְהוָה אֶל־דָּוִד מֵהַיּוֹם הַהוּא וָמָעְלָה וַיָּקָם שְׁמוּאֵל וַיֵּלֶךְ הָרָמָתָה׃
    hebrewPlain: ויקח שמואל את קרן השמן וימשח אתו בקרב אחיו ותצלח רוח יהוה אל דוד מהיום ההוא ומעלה ויקם שמואל וילך הרמתה
    kjvRefs:
    - 1 Samuel 16:13
    kjvOsis:
    - 1Sam.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.14
    scripture: tanakh
    name: Tanakh 1 Samuel 16:14
    ref: 1 Samuel 16:14
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 14
    ordinal: 7519
    text: Now the spirit of the LORD had departed from Saul, and an evil spirit from the LORD terrified him.
    translation: JPS 1917
    original: וְרוּחַ יְהוָה סָרָה מֵעִם שָׁאוּל וּבִעֲתַתּוּ רוּחַ־רָעָה מֵאֵת יְהוָה׃
    hebrewPlain: ורוח יהוה סרה מעם שאול ובעתתו רוח רעה מאת יהוה
    kjvRefs:
    - 1 Samuel 16:14
    kjvOsis:
    - 1Sam.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.15
    scripture: tanakh
    name: Tanakh 1 Samuel 16:15
    ref: 1 Samuel 16:15
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 15
    ordinal: 7520
    text: 'And Saul’s servants said unto him: ‘Behold now, an evil spirit from God terrifieth thee.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ עַבְדֵי־שָׁאוּל אֵלָיו הִנֵּה־נָא רוּחַ־אֱלֹהִים רָעָה מְבַעִתֶּךָ׃
    hebrewPlain: ויאמרו עבדי שאול אליו הנה נא רוח אלהים רעה מבעתך
    kjvRefs:
    - 1 Samuel 16:15
    kjvOsis:
    - 1Sam.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.16
    scripture: tanakh
    name: Tanakh 1 Samuel 16:16
    ref: 1 Samuel 16:16
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 16
    ordinal: 7521
    text: Let our lord now command thy servants, that are before thee, to seek out a man who is a skilful player on the harp; and it shall be, when the evil spirit from God cometh upon thee, that he shall play with his hand, and thou shalt be well.’
    translation: JPS 1917
    original: יֹאמַר־נָא אֲדֹנֵנוּ עֲבָדֶיךָ לְפָנֶיךָ יְבַקְשׁוּ אִישׁ יֹדֵעַ מְנַגֵּן בַּכִּנּוֹר וְהָיָה בִּהְיוֹת עָלֶיךָ רוּחַ־אֱלֹהִים רָעָה וְנִגֵּן בְּיָדוֹ וְטוֹב לָךְ׃
    hebrewPlain: יאמר נא אדננו עבדיך לפניך יבקשו איש ידע מנגן בכנור והיה בהיות עליך רוח אלהים רעה ונגן בידו וטוב לך
    kjvRefs:
    - 1 Samuel 16:16
    kjvOsis:
    - 1Sam.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.17
    scripture: tanakh
    name: Tanakh 1 Samuel 16:17
    ref: 1 Samuel 16:17
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 17
    ordinal: 7522
    text: 'And Saul said unto his servants: ‘Provide me now a man that can play well, and bring him to me.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־עֲבָדָיו רְאוּ־נָא לִי אִישׁ מֵיטִיב לְנַגֵּן וַהֲבִיאוֹתֶם אֵלָי׃
    hebrewPlain: ויאמר שאול אל עבדיו ראו נא לי איש מיטיב לנגן והביאותם אלי
    kjvRefs:
    - 1 Samuel 16:17
    kjvOsis:
    - 1Sam.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.18
    scripture: tanakh
    name: Tanakh 1 Samuel 16:18
    ref: 1 Samuel 16:18
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 18
    ordinal: 7523
    text: 'Then answered one of the young men, and said: ‘Behold, I have seen a son of Jesse the Beth-lehemite, that is skilful in playing, and a mighty man of valour, and a man of war, and prudent in affairs, and a comely person, and the LORD is with him.’'
    translation: JPS 1917
    original: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר הִנֵּה רָאִיתִי בֵּן לְיִשַׁי בֵּית הַלַּחְמִי יֹדֵעַ נַגֵּן וְגִבּוֹר חַיִל וְאִישׁ מִלְחָמָה וּנְבוֹן דָּבָר וְאִישׁ תֹּאַר וַיהוָה עִמּוֹ׃
    hebrewPlain: ויען אחד מהנערים ויאמר הנה ראיתי בן לישי בית הלחמי ידע נגן וגבור חיל ואיש מלחמה ונבון דבר ואיש תאר ויהוה עמו
    kjvRefs:
    - 1 Samuel 16:18
    kjvOsis:
    - 1Sam.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.19
    scripture: tanakh
    name: Tanakh 1 Samuel 16:19
    ref: 1 Samuel 16:19
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 19
    ordinal: 7524
    text: 'Wherefore Saul sent messengers unto Jesse, and said: ‘Send me David thy son, who is with the sheep.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל מַלְאָכִים אֶל־יִשָׁי וַיֹּאמֶר שִׁלְחָה אֵלַי אֶת־דָּוִד בִּנְךָ אֲשֶׁר בַּצֹּאן׃
    hebrewPlain: וישלח שאול מלאכים אל ישי ויאמר שלחה אלי את דוד בנך אשר בצאן
    kjvRefs:
    - 1 Samuel 16:19
    kjvOsis:
    - 1Sam.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.20
    scripture: tanakh
    name: Tanakh 1 Samuel 16:20
    ref: 1 Samuel 16:20
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 20
    ordinal: 7525
    text: And Jesse took an ass laden with bread, and a bottle of wine, and a kid, and sent them by David his son unto Saul.
    translation: JPS 1917
    original: וַיִּקַּח יִשַׁי חֲמוֹר לֶחֶם וְנֹאד יַיִן וּגְדִי עִזִּים אֶחָד וַיִּשְׁלַח בְּיַד־דָּוִד בְּנוֹ אֶל־שָׁאוּל׃
    hebrewPlain: ויקח ישי חמור לחם ונאד יין וגדי עזים אחד וישלח ביד דוד בנו אל שאול
    kjvRefs:
    - 1 Samuel 16:20
    kjvOsis:
    - 1Sam.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.21
    scripture: tanakh
    name: Tanakh 1 Samuel 16:21
    ref: 1 Samuel 16:21
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 21
    ordinal: 7526
    text: And David came to Saul, and stood before him; and he loved him greatly; and he became his armour-bearer.
    translation: JPS 1917
    original: וַיָּבֹא דָוִד אֶל־שָׁאוּל וַיַּעֲמֹד לְפָנָיו וַיֶּאֱהָבֵהוּ מְאֹד וַיְהִי־לוֹ נֹשֵׂא כֵלִים׃
    hebrewPlain: ויבא דוד אל שאול ויעמד לפניו ויאהבהו מאד ויהי לו נשא כלים
    kjvRefs:
    - 1 Samuel 16:21
    kjvOsis:
    - 1Sam.16.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.22
    scripture: tanakh
    name: Tanakh 1 Samuel 16:22
    ref: 1 Samuel 16:22
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 22
    ordinal: 7527
    text: 'And Saul sent to Jesse, saying: ‘Let David, I pray thee, stand before me; for he hath found favour in my sight.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח שָׁאוּל אֶל־יִשַׁי לֵאמֹר יַעֲמָד־נָא דָוִד לְפָנַי כִּי־מָצָא חֵן בְּעֵינָי׃
    hebrewPlain: וישלח שאול אל ישי לאמר יעמד נא דוד לפני כי מצא חן בעיני
    kjvRefs:
    - 1 Samuel 16:22
    kjvOsis:
    - 1Sam.16.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.16.23
    scripture: tanakh
    name: Tanakh 1 Samuel 16:23
    ref: 1 Samuel 16:23
    book: 1Sam
    section: neviim
    chapter: 16
    verse: 23
    ordinal: 7528
    text: And it came to pass, when the [evil] spirit from God was upon Saul, that David took the harp, and played with his hand; so Saul found relief, and it was well with him, and the evil spirit departed from him.
    translation: JPS 1917
    original: וְהָיָה בִּהְיוֹת רוּחַ־אֱלֹהִים אֶל־שָׁאוּל וְלָקַח דָּוִד אֶת־הַכִּנּוֹר וְנִגֵּן בְּיָדוֹ וְרָוַח לְשָׁאוּל וְטוֹב לוֹ וְסָרָה מֵעָלָיו רוּחַ הָרָעָה׃
    hebrewPlain: והיה בהיות רוח אלהים אל שאול ולקח דוד את הכנור ונגן בידו ורוח לשאול וטוב לו וסרה מעליו רוח הרעה
    kjvRefs:
    - 1 Samuel 16:23
    kjvOsis:
    - 1Sam.16.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.16
- type: TanakhVerse
  data:
    osis: 1Sam.17.1
    scripture: tanakh
    name: Tanakh 1 Samuel 17:1
    ref: 1 Samuel 17:1
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 1
    ordinal: 7529
    text: Now the Philistines gathered together their armies to battle, and they were gathered together at Socoh, which belongeth to Judah, and pitched between Socoh and Azekah, in Ephes-dammim.
    translation: JPS 1917
    original: וַיַּאַסְפוּ פְלִשְׁתִּים אֶת־מַחֲנֵיהֶם לַמִּלְחָמָה וַיֵּאָסְפוּ שֹׂכֹה אֲשֶׁר לִיהוּדָה וַיַּחֲנוּ בֵּין־שׂוֹכֹה וּבֵין־עֲזֵקָה בְּאֶפֶס דַּמִּים׃
    hebrewPlain: ויאספו פלשתים את מחניהם למלחמה ויאספו שכה אשר ליהודה ויחנו בין שוכה ובין עזקה באפס דמים
    kjvRefs:
    - 1 Samuel 17:1
    kjvOsis:
    - 1Sam.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.2
    scripture: tanakh
    name: Tanakh 1 Samuel 17:2
    ref: 1 Samuel 17:2
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 2
    ordinal: 7530
    text: And Saul and the men of Israel were gathered together, and pitched in the vale of Elah, and set the battle in array against the Philistines.
    translation: JPS 1917
    original: וְשָׁאוּל וְאִישׁ־יִשְׂרָאֵל נֶאֶסְפוּ וַיַּחֲנוּ בְּעֵמֶק הָאֵלָה וַיַּעַרְכוּ מִלְחָמָה לִקְרַאת פְּלִשְׁתִּים׃
    hebrewPlain: ושאול ואיש ישראל נאספו ויחנו בעמק האלה ויערכו מלחמה לקראת פלשתים
    kjvRefs:
    - 1 Samuel 17:2
    kjvOsis:
    - 1Sam.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.3
    scripture: tanakh
    name: Tanakh 1 Samuel 17:3
    ref: 1 Samuel 17:3
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 3
    ordinal: 7531
    text: And the Philistines stood on the mountain on the one side, and Israel stood on the mountain on the other side; and there was a valley between them.
    translation: JPS 1917
    original: וּפְלִשְׁתִּים עֹמְדִים אֶל־הָהָר מִזֶּה וְיִשְׂרָאֵל עֹמְדִים אֶל־הָהָר מִזֶּה וְהַגַּיְא בֵּינֵיהֶם׃
    hebrewPlain: ופלשתים עמדים אל ההר מזה וישראל עמדים אל ההר מזה והגיא ביניהם
    kjvRefs:
    - 1 Samuel 17:3
    kjvOsis:
    - 1Sam.17.3
  relations:
