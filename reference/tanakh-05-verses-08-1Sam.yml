  data:
    osis: 1Sam.17.7
    scripture: tanakh
    name: Tanakh 1 Samuel 17:7
    ref: 1 Samuel 17:7
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 7
    ordinal: 7535
    text: And the shaft of his spear was like a weaver’s beam; and his spear’s head weighed six hundred shekels of iron; and his shield-bearer went before him.
    translation: JPS 1917
    original: וחץ [וְעֵץ] חֲנִיתוֹ כִּמְנוֹר אֹרְגִים וְלַהֶבֶת חֲנִיתוֹ שֵׁשׁ־מֵאוֹת שְׁקָלִים בַּרְזֶל וְנֹשֵׂא הַצִּנָּה הֹלֵךְ לְפָנָיו׃
    hebrewPlain: וחץ [ועץ] חניתו כמנור ארגים ולהבת חניתו שש מאות שקלים ברזל ונשא הצנה הלך לפניו
    kjvRefs:
    - 1 Samuel 17:7
    kjvOsis:
    - 1Sam.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.8
    scripture: tanakh
    name: Tanakh 1 Samuel 17:8
    ref: 1 Samuel 17:8
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 8
    ordinal: 7536
    text: 'And he stood and cried unto the armies of Israel, and said unto them: ‘Why do ye come out to set your battle in array? am not I a Philistine, and ye servants to Saul? choose you a man for you, and let him come down to me.'
    translation: JPS 1917
    original: וַיַּעֲמֹד וַיִּקְרָא אֶל־מַעַרְכֹת יִשְׂרָאֵל וַיֹּאמֶר לָהֶם לָמָּה תֵצְאוּ לַעֲרֹךְ מִלְחָמָה הֲלוֹא אָנֹכִי הַפְּלִשְׁתִּי וְאַתֶּם עֲבָדִים לְשָׁאוּל בְּרוּ־לָכֶם אִישׁ וְיֵרֵד אֵלָי׃
    hebrewPlain: ויעמד ויקרא אל מערכת ישראל ויאמר להם למה תצאו לערך מלחמה הלוא אנכי הפלשתי ואתם עבדים לשאול ברו לכם איש וירד אלי
    kjvRefs:
    - 1 Samuel 17:8
    kjvOsis:
    - 1Sam.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.9
    scripture: tanakh
    name: Tanakh 1 Samuel 17:9
    ref: 1 Samuel 17:9
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 9
    ordinal: 7537
    text: If he be able to fight with me, and kill me, then will we be your servants; but if I prevail against him, and kill him, then shall ye be our servants, and serve us.’
    translation: JPS 1917
    original: אִם־יוּכַל לְהִלָּחֵם אִתִּי וְהִכָּנִי וְהָיִינוּ לָכֶם לַעֲבָדִים וְאִם־אֲנִי אוּכַל־לוֹ וְהִכִּיתִיו וִהְיִיתֶם לָנוּ לַעֲבָדִים וַעֲבַדְתֶּם אֹתָנוּ׃
    hebrewPlain: אם יוכל להלחם אתי והכני והיינו לכם לעבדים ואם אני אוכל לו והכיתיו והייתם לנו לעבדים ועבדתם אתנו
    kjvRefs:
    - 1 Samuel 17:9
    kjvOsis:
    - 1Sam.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.10
    scripture: tanakh
    name: Tanakh 1 Samuel 17:10
    ref: 1 Samuel 17:10
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 10
    ordinal: 7538
    text: 'And the Philistine said: ‘I do taunt the armies of Israel this day; give me a man, that we may fight together.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַפְּלִשְׁתִּי אֲנִי חֵרַפְתִּי אֶת־מַעַרְכוֹת יִשְׂרָאֵל הַיּוֹם הַזֶּה תְּנוּ־לִי אִישׁ וְנִלָּחֲמָה יָחַד׃
    hebrewPlain: ויאמר הפלשתי אני חרפתי את מערכות ישראל היום הזה תנו לי איש ונלחמה יחד
    kjvRefs:
    - 1 Samuel 17:10
    kjvOsis:
    - 1Sam.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.11
    scripture: tanakh
    name: Tanakh 1 Samuel 17:11
    ref: 1 Samuel 17:11
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 11
    ordinal: 7539
    text: And when Saul and all Israel heard those words of the Philistine, they were dismayed, and greatly afraid.
    translation: JPS 1917
    original: וַיִּשְׁמַע שָׁאוּל וְכָל־יִשְׂרָאֵל אֶת־דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה וַיֵּחַתּוּ וַיִּרְאוּ מְאֹד׃
    hebrewPlain: וישמע שאול וכל ישראל את דברי הפלשתי האלה ויחתו ויראו מאד
    kjvRefs:
    - 1 Samuel 17:11
    kjvOsis:
    - 1Sam.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.12
    scripture: tanakh
    name: Tanakh 1 Samuel 17:12
    ref: 1 Samuel 17:12
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 12
    ordinal: 7540
    text: Now David was the son of that Ephrathite of Beth-lehem in Judah, whose name was Jesse; and he had eight sons; and the man was an old man in the days of Saul, stricken in years among men.
    translation: JPS 1917
    original: וְדָוִד בֶּן־אִישׁ אֶפְרָתִי הַזֶּה מִבֵּית לֶחֶם יְהוּדָה וּשְׁמוֹ יִשַׁי וְלוֹ שְׁמֹנָה בָנִים וְהָאִישׁ בִּימֵי שָׁאוּל זָקֵן בָּא בַאֲנָשִׁים׃
    hebrewPlain: ודוד בן איש אפרתי הזה מבית לחם יהודה ושמו ישי ולו שמנה בנים והאיש בימי שאול זקן בא באנשים
    kjvRefs:
    - 1 Samuel 17:12
    kjvOsis:
    - 1Sam.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.13
    scripture: tanakh
    name: Tanakh 1 Samuel 17:13
    ref: 1 Samuel 17:13
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 13
    ordinal: 7541
    text: And the three eldest sons of Jesse had gone after Saul to the battle; and the names of his three sons that went to the battle were Eliab the first-born, and next unto him Abinadab, and the third Shammah.
    translation: JPS 1917
    original: וַיֵּלְכוּ שְׁלֹשֶׁת בְּנֵי־יִשַׁי הַגְּדֹלִים הָלְכוּ אַחֲרֵי־שָׁאוּל לַמִּלְחָמָה וְשֵׁם שְׁלֹשֶׁת בָּנָיו אֲשֶׁר הָלְכוּ בַּמִּלְחָמָה אֱלִיאָב הַבְּכוֹר וּמִשְׁנֵהוּ אֲבִינָדָב וְהַשְּׁלִשִׁי שַׁמָּה׃
    hebrewPlain: וילכו שלשת בני ישי הגדלים הלכו אחרי שאול למלחמה ושם שלשת בניו אשר הלכו במלחמה אליאב הבכור ומשנהו אבינדב והשלשי שמה
    kjvRefs:
    - 1 Samuel 17:13
    kjvOsis:
    - 1Sam.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.14
    scripture: tanakh
    name: Tanakh 1 Samuel 17:14
    ref: 1 Samuel 17:14
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 14
    ordinal: 7542
    text: And David was the youngest; and the three eldest followed Saul.—
    translation: JPS 1917
    original: וְדָוִד הוּא הַקָּטָן וּשְׁלֹשָׁה הַגְּדֹלִים הָלְכוּ אַחֲרֵי שָׁאוּל׃
    hebrewPlain: ודוד הוא הקטן ושלשה הגדלים הלכו אחרי שאול
    kjvRefs:
    - 1 Samuel 17:14
    kjvOsis:
    - 1Sam.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.15
    scripture: tanakh
    name: Tanakh 1 Samuel 17:15
    ref: 1 Samuel 17:15
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 15
    ordinal: 7543
    text: Now David went to and fro from Saul to feed his father’s sheep at Beth-lehem.—
    translation: JPS 1917
    original: וְדָוִד הֹלֵךְ וָשָׁב מֵעַל שָׁאוּל לִרְעוֹת אֶת־צֹאן אָבִיו בֵּית־לָחֶם׃
    hebrewPlain: ודוד הלך ושב מעל שאול לרעות את צאן אביו בית לחם
    kjvRefs:
    - 1 Samuel 17:15
    kjvOsis:
    - 1Sam.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.16
    scripture: tanakh
    name: Tanakh 1 Samuel 17:16
    ref: 1 Samuel 17:16
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 16
    ordinal: 7544
    text: And the Philistine drew near morning and evening, and presented himself forty days.
    translation: JPS 1917
    original: וַיִּגַּשׁ הַפְּלִשְׁתִּי הַשְׁכֵּם וְהַעֲרֵב וַיִּתְיַצֵּב אַרְבָּעִים יוֹם׃
    hebrewPlain: ויגש הפלשתי השכם והערב ויתיצב ארבעים יום
    kjvRefs:
    - 1 Samuel 17:16
    kjvOsis:
    - 1Sam.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.17
    scripture: tanakh
    name: Tanakh 1 Samuel 17:17
    ref: 1 Samuel 17:17
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 17
    ordinal: 7545
    text: 'And Jesse said unto David his son: ‘Take now for thy brethren an ephah of this parched corn, and these ten loaves, and carry them quickly to the camp to thy brethren.'
    translation: JPS 1917
    original: וַיֹּאמֶר יִשַׁי לְדָוִד בְּנוֹ קַח־נָא לְאַחֶיךָ אֵיפַת הַקָּלִיא הַזֶּה וַעֲשָׂרָה לֶחֶם הַזֶּה וְהָרֵץ הַמַּחֲנֶה לְאַחֶיךָ׃
    hebrewPlain: ויאמר ישי לדוד בנו קח נא לאחיך איפת הקליא הזה ועשרה לחם הזה והרץ המחנה לאחיך
    kjvRefs:
    - 1 Samuel 17:17
    kjvOsis:
    - 1Sam.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.18
    scripture: tanakh
    name: Tanakh 1 Samuel 17:18
    ref: 1 Samuel 17:18
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 18
    ordinal: 7546
    text: And bring these ten cheeses unto the captain of their thousand, and to thy brethren shalt thou bring greetings, and take their pledge;
    translation: JPS 1917
    original: וְאֵת עֲשֶׂרֶת חֲרִצֵי הֶחָלָב הָאֵלֶּה תָּבִיא לְשַׂר־הָאָלֶף וְאֶת־אַחֶיךָ תִּפְקֹד לְשָׁלוֹם וְאֶת־עֲרֻבָּתָם תִּקָּח׃
    hebrewPlain: ואת עשרת חרצי החלב האלה תביא לשר האלף ואת אחיך תפקד לשלום ואת ערבתם תקח
    kjvRefs:
    - 1 Samuel 17:18
    kjvOsis:
    - 1Sam.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.19
    scripture: tanakh
    name: Tanakh 1 Samuel 17:19
    ref: 1 Samuel 17:19
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 19
    ordinal: 7547
    text: now Saul, and they, and all the men of Israel, are in the vale of Elah, fighting with the Philistines.’
    translation: JPS 1917
    original: וְשָׁאוּל וְהֵמָּה וְכָל־אִישׁ יִשְׂרָאֵל בְּעֵמֶק הָאֵלָה נִלְחָמִים עִם־פְּלִשְׁתִּים׃
    hebrewPlain: ושאול והמה וכל איש ישראל בעמק האלה נלחמים עם פלשתים
    kjvRefs:
    - 1 Samuel 17:19
    kjvOsis:
    - 1Sam.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.20
    scripture: tanakh
    name: Tanakh 1 Samuel 17:20
    ref: 1 Samuel 17:20
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 20
    ordinal: 7548
    text: And David rose up early in the morning, and left the sheep with a keeper, and took, and went, as Jesse had commanded him; and he came to the barricade, as the host which was going forth to the fight shouted for the battle.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר וַיִּשָּׂא וַיֵּלֶךְ כַּאֲשֶׁר צִוָּהוּ יִשָׁי וַיָּבֹא הַמַּעְגָּלָה וְהַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה וְהֵרֵעוּ בַּמִּלְחָמָה׃
    hebrewPlain: וישכם דוד בבקר ויטש את הצאן על שמר וישא וילך כאשר צוהו ישי ויבא המעגלה והחיל היצא אל המערכה והרעו במלחמה
    kjvRefs:
    - 1 Samuel 17:20
    kjvOsis:
    - 1Sam.17.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.21
    scripture: tanakh
    name: Tanakh 1 Samuel 17:21
    ref: 1 Samuel 17:21
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 21
    ordinal: 7549
    text: And Israel and the Philistines put the battle in array, army against army.
    translation: JPS 1917
    original: וַתַּעֲרֹךְ יִשְׂרָאֵל וּפְלִשְׁתִּים מַעֲרָכָה לִקְרַאת מַעֲרָכָה׃
    hebrewPlain: ותערך ישראל ופלשתים מערכה לקראת מערכה
    kjvRefs:
    - 1 Samuel 17:21
    kjvOsis:
    - 1Sam.17.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.22
    scripture: tanakh
    name: Tanakh 1 Samuel 17:22
    ref: 1 Samuel 17:22
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 22
    ordinal: 7550
    text: And David left his baggage in the hand of the keeper of the baggage, and ran to the army, and came and greeted his brethren.
    translation: JPS 1917
    original: וַיִּטֹּשׁ דָּוִד אֶת־הַכֵּלִים מֵעָלָיו עַל־יַד שׁוֹמֵר הַכֵּלִים וַיָּרָץ הַמַּעֲרָכָה וַיָּבֹא וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם׃
    hebrewPlain: ויטש דוד את הכלים מעליו על יד שומר הכלים וירץ המערכה ויבא וישאל לאחיו לשלום
    kjvRefs:
    - 1 Samuel 17:22
    kjvOsis:
    - 1Sam.17.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.23
    scripture: tanakh
    name: Tanakh 1 Samuel 17:23
    ref: 1 Samuel 17:23
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 23
    ordinal: 7551
    text: And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the ranks of the Philistines, and spoke according to the same words; and David heard them.
    translation: JPS 1917
    original: וְהוּא מְדַבֵּר עִמָּם וְהִנֵּה אִישׁ הַבֵּנַיִם עוֹלֶה גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת ממערות [מִמַּעַרְכוֹת] פְּלִשְׁתִּים וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה וַיִּשְׁמַע דָּוִד׃
    hebrewPlain: והוא מדבר עמם והנה איש הבנים עולה גלית הפלשתי שמו מגת ממערות [ממערכות] פלשתים וידבר כדברים האלה וישמע דוד
    kjvRefs:
    - 1 Samuel 17:23
    kjvOsis:
    - 1Sam.17.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.24
    scripture: tanakh
    name: Tanakh 1 Samuel 17:24
    ref: 1 Samuel 17:24
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 24
    ordinal: 7552
    text: And all the men of Israel, when they saw the man, fled from him, and were sore afraid.
    translation: JPS 1917
    original: וְכֹל אִישׁ יִשְׂרָאֵל בִּרְאוֹתָם אֶת־הָאִישׁ וַיָּנֻסוּ מִפָּנָיו וַיִּירְאוּ מְאֹד׃
    hebrewPlain: וכל איש ישראל בראותם את האיש וינסו מפניו וייראו מאד
    kjvRefs:
    - 1 Samuel 17:24
    kjvOsis:
    - 1Sam.17.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.25
    scripture: tanakh
    name: Tanakh 1 Samuel 17:25
    ref: 1 Samuel 17:25
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 25
    ordinal: 7553
    text: 'And the men of Israel said: ‘Have ye seen this man that is come up? surely to taunt Israel is he come up; and it shall be, that the man who killeth him, the king will enrich him with great riches, and will give him his daughter, and make his father’s house free in Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אִישׁ יִשְׂרָאֵל הַרְּאִיתֶם הָאִישׁ הָעֹלֶה הַזֶּה כִּי לְחָרֵף אֶת־יִשְׂרָאֵל עֹלֶה וְהָיָה הָאִישׁ אֲשֶׁר־יַכֶּנּוּ יַעְשְׁרֶנּוּ הַמֶּלֶךְ עֹשֶׁר גָּדוֹל וְאֶת־בִּתּוֹ יִתֶּן־לוֹ וְאֵת בֵּית אָבִיו יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל׃
    hebrewPlain: ויאמר איש ישראל הראיתם האיש העלה הזה כי לחרף את ישראל עלה והיה האיש אשר יכנו יעשרנו המלך עשר גדול ואת בתו יתן לו ואת בית אביו יעשה חפשי בישראל
    kjvRefs:
    - 1 Samuel 17:25
    kjvOsis:
    - 1Sam.17.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.26
    scripture: tanakh
    name: Tanakh 1 Samuel 17:26
    ref: 1 Samuel 17:26
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 26
    ordinal: 7554
    text: 'And David spoke to the men that stood by him, saying: ‘What shall be done to the man that killeth this Philistine, and taketh away the taunt from Israel? for who is this uncircumcised Philistine, that he should have taunted the armies of the living God?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־הָאֲנָשִׁים הָעֹמְדִים עִמּוֹ לֵאמֹר מַה־יֵּעָשֶׂה לָאִישׁ אֲשֶׁר יַכֶּה אֶת־הַפְּלִשְׁתִּי הַלָּז וְהֵסִיר חֶרְפָּה מֵעַל יִשְׂרָאֵל כִּי מִי הַפְּלִשְׁתִּי הֶעָרֵל הַזֶּה כִּי חֵרֵף מַעַרְכוֹת אֱלֹהִים חַיִּים׃
    hebrewPlain: ויאמר דוד אל האנשים העמדים עמו לאמר מה יעשה לאיש אשר יכה את הפלשתי הלז והסיר חרפה מעל ישראל כי מי הפלשתי הערל הזה כי חרף מערכות אלהים חיים
    kjvRefs:
    - 1 Samuel 17:26
    kjvOsis:
    - 1Sam.17.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.27
    scripture: tanakh
    name: Tanakh 1 Samuel 17:27
    ref: 1 Samuel 17:27
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 27
    ordinal: 7555
    text: 'And the people answered him after this manner, saying: ‘So shall it be done to the man that killeth him.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ הָעָם כַּדָּבָר הַזֶּה לֵאמֹר כֹּה יֵעָשֶׂה לָאִישׁ אֲשֶׁר יַכֶּנּוּ׃
    hebrewPlain: ויאמר לו העם כדבר הזה לאמר כה יעשה לאיש אשר יכנו
    kjvRefs:
    - 1 Samuel 17:27
    kjvOsis:
    - 1Sam.17.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.28
    scripture: tanakh
    name: Tanakh 1 Samuel 17:28
    ref: 1 Samuel 17:28
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 28
    ordinal: 7556
    text: 'And Eliab his eldest brother heard when he spoke unto the men; and Eliab’s anger was kindled against David, and he said: ‘Why art thou come down? and with whom hast thou left those few sheep in the wilderness? I know thy presumptuousness, and the naughtiness of thy heart; for thou art come down that thou mightest see the battle.’'
    translation: JPS 1917
    original: וַיִּשְׁמַע אֱלִיאָב אָחִיו הַגָּדוֹל בְּדַבְּרוֹ אֶל־הָאֲנָשִׁים וַיִּחַר־אַף אֱלִיאָב בְּדָוִד וַיֹּאמֶר לָמָּה־זֶּה יָרַדְתָּ וְעַל־מִי נָטַשְׁתָּ מְעַט הַצֹּאן הָהֵנָּה בַּמִּדְבָּר אֲנִי יָדַעְתִּי אֶת־זְדֹנְךָ וְאֵת רֹעַ לְבָבֶךָ כִּי לְמַעַן רְאוֹת הַמִּלְחָמָה יָרָדְתָּ׃
    hebrewPlain: וישמע אליאב אחיו הגדול בדברו אל האנשים ויחר אף אליאב בדוד ויאמר למה זה ירדת ועל מי נטשת מעט הצאן ההנה במדבר אני ידעתי את זדנך ואת רע לבבך כי למען ראות המלחמה ירדת
    kjvRefs:
    - 1 Samuel 17:28
    kjvOsis:
    - 1Sam.17.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.29
    scripture: tanakh
    name: Tanakh 1 Samuel 17:29
    ref: 1 Samuel 17:29
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 29
    ordinal: 7557
    text: 'And David said: ‘What have I now done? Was it not but a word?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד מֶה עָשִׂיתִי עָתָּה הֲלוֹא דָּבָר הוּא׃
    hebrewPlain: ויאמר דוד מה עשיתי עתה הלוא דבר הוא
    kjvRefs:
    - 1 Samuel 17:29
    kjvOsis:
    - 1Sam.17.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.30
    scripture: tanakh
    name: Tanakh 1 Samuel 17:30
    ref: 1 Samuel 17:30
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 30
    ordinal: 7558
    text: And he turned away from him toward another, and spoke after the same manner; and the people answered him after the former manner.
    translation: JPS 1917
    original: וַיִּסֹּב מֵאֶצְלוֹ אֶל־מוּל אַחֵר וַיֹּאמֶר כַּדָּבָר הַזֶּה וַיְשִׁבֻהוּ הָעָם דָּבָר כַּדָּבָר הָרִאשׁוֹן׃
    hebrewPlain: ויסב מאצלו אל מול אחר ויאמר כדבר הזה וישבהו העם דבר כדבר הראשון
    kjvRefs:
    - 1 Samuel 17:30
    kjvOsis:
    - 1Sam.17.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.31
    scripture: tanakh
    name: Tanakh 1 Samuel 17:31
    ref: 1 Samuel 17:31
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 31
    ordinal: 7559
    text: And when the words were heard which David spoke, they rehearsed them before Saul; and he was taken to him.
    translation: JPS 1917
    original: וַיְּשָּׁמְעוּ הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד וַיַּגִּדוּ לִפְנֵי־שָׁאוּל וַיִּקָּחֵהוּ׃
    hebrewPlain: וישמעו הדברים אשר דבר דוד ויגדו לפני שאול ויקחהו
    kjvRefs:
    - 1 Samuel 17:31
    kjvOsis:
    - 1Sam.17.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.32
    scripture: tanakh
    name: Tanakh 1 Samuel 17:32
    ref: 1 Samuel 17:32
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 32
    ordinal: 7560
    text: 'And David said to Saul: ‘Let no man’s heart fail within him; thy servant will go and fight with this Philistine.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל אַל־יִפֹּל לֵב־אָדָם עָלָיו עַבְדְּךָ יֵלֵךְ וְנִלְחַם עִם־הַפְּלִשְׁתִּי הַזֶּה׃
    hebrewPlain: ויאמר דוד אל שאול אל יפל לב אדם עליו עבדך ילך ונלחם עם הפלשתי הזה
    kjvRefs:
    - 1 Samuel 17:32
    kjvOsis:
    - 1Sam.17.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.33
    scripture: tanakh
    name: Tanakh 1 Samuel 17:33
    ref: 1 Samuel 17:33
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 33
    ordinal: 7561
    text: 'And Saul said to David: ‘Thou art not able to go against this Philistine to fight with him; for thou art but a youth, and he a man of war from his youth.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־דָּוִד לֹא תוּכַל לָלֶכֶת אֶל־הַפְּלִשְׁתִּי הַזֶּה לְהִלָּחֵם עִמּוֹ כִּי־נַעַר אַתָּה וְהוּא אִישׁ מִלְחָמָה מִנְּעֻרָיו׃
    hebrewPlain: ויאמר שאול אל דוד לא תוכל ללכת אל הפלשתי הזה להלחם עמו כי נער אתה והוא איש מלחמה מנעריו
    kjvRefs:
    - 1 Samuel 17:33
    kjvOsis:
    - 1Sam.17.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.34
    scripture: tanakh
    name: Tanakh 1 Samuel 17:34
    ref: 1 Samuel 17:34
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 34
    ordinal: 7562
    text: 'And David said unto Saul: ‘Thy servant kept his father’s sheep; and when there came a lion, or a bear, and took a lamb out of the flock,'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל רֹעֶה הָיָה עַבְדְּךָ לְאָבִיו בַּצֹּאן וּבָא הָאֲרִי וְאֶת־הַדּוֹב וְנָשָׂא שֶׂה מֵהָעֵדֶר׃
    hebrewPlain: ויאמר דוד אל שאול רעה היה עבדך לאביו בצאן ובא הארי ואת הדוב ונשא שה מהעדר
    kjvRefs:
    - 1 Samuel 17:34
    kjvOsis:
    - 1Sam.17.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.35
    scripture: tanakh
    name: Tanakh 1 Samuel 17:35
    ref: 1 Samuel 17:35
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 35
    ordinal: 7563
    text: I went out after him, and smote him, and delivered it out of his mouth; and when he arose against me, I caught him by his beard, and smote him, and slew him.
    translation: JPS 1917
    original: וְיָצָאתִי אַחֲרָיו וְהִכִּתִיו וְהִצַּלְתִּי מִפִּיו וַיָּקָם עָלַי וְהֶחֱזַקְתִּי בִּזְקָנוֹ וְהִכִּתִיו וַהֲמִיתִּיו׃
    hebrewPlain: ויצאתי אחריו והכתיו והצלתי מפיו ויקם עלי והחזקתי בזקנו והכתיו והמיתיו
    kjvRefs:
    - 1 Samuel 17:35
    kjvOsis:
    - 1Sam.17.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.36
    scripture: tanakh
    name: Tanakh 1 Samuel 17:36
    ref: 1 Samuel 17:36
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 36
    ordinal: 7564
    text: Thy servant smote both the lion and the bear; and this uncircumcised Philistine shall be as one of them, seeing he hath taunted the armies of the living God.’
    translation: JPS 1917
    original: גַּם אֶת־הָאֲרִי גַּם־הַדּוֹב הִכָּה עַבְדֶּךָ וְהָיָה הַפְּלִשְׁתִּי הֶעָרֵל הַזֶּה כְּאַחַד מֵהֶם כִּי חֵרֵף מַעַרְכֹת אֱלֹהִים חַיִּים׃
    hebrewPlain: גם את הארי גם הדוב הכה עבדך והיה הפלשתי הערל הזה כאחד מהם כי חרף מערכת אלהים חיים
    kjvRefs:
    - 1 Samuel 17:36
    kjvOsis:
    - 1Sam.17.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.37
    scripture: tanakh
    name: Tanakh 1 Samuel 17:37
    ref: 1 Samuel 17:37
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 37
    ordinal: 7565
    text: 'And David said: ‘The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, He will deliver me out of the hand of this Philistine.’ And Saul said unto David: ‘Go, and the LORD shall be with thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד יְהוָה אֲשֶׁר הִצִּלַנִי מִיַּד הָאֲרִי וּמִיַּד הַדֹּב הוּא יַצִּילֵנִי מִיַּד הַפְּלִשְׁתִּי הַזֶּה וַיֹּאמֶר שָׁאוּל אֶל־דָּוִד לֵךְ וַיהוָה יִהְיֶה עִמָּךְ׃
    hebrewPlain: ויאמר דוד יהוה אשר הצלני מיד הארי ומיד הדב הוא יצילני מיד הפלשתי הזה ויאמר שאול אל דוד לך ויהוה יהיה עמך
    kjvRefs:
    - 1 Samuel 17:37
    kjvOsis:
    - 1Sam.17.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.38
    scripture: tanakh
    name: Tanakh 1 Samuel 17:38
    ref: 1 Samuel 17:38
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 38
    ordinal: 7566
    text: And Saul clad David with his apparel, and he put a helmet of brass upon his head, and he clad him with a coat of mail.
    translation: JPS 1917
    original: וַיַּלְבֵּשׁ שָׁאוּל אֶת־דָּוִד מַדָּיו וְנָתַן קוֹבַע נְחֹשֶׁת עַל־רֹאשׁוֹ וַיַּלְבֵּשׁ אֹתוֹ שִׁרְיוֹן׃
    hebrewPlain: וילבש שאול את דוד מדיו ונתן קובע נחשת על ראשו וילבש אתו שריון
    kjvRefs:
    - 1 Samuel 17:38
    kjvOsis:
    - 1Sam.17.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.39
    scripture: tanakh
    name: Tanakh 1 Samuel 17:39
    ref: 1 Samuel 17:39
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 39
    ordinal: 7567
    text: 'And David girded his sword upon his apparel, and he essayed to go, [but could not]; for he had not tried it. And David said unto Saul: ‘I cannot go with these; for I have not tried them.’ And David put them off him.'
    translation: JPS 1917
    original: וַיַּחְגֹּר דָּוִד אֶת־חַרְבּוֹ מֵעַל לְמַדָּיו וַיֹּאֶל לָלֶכֶת כִּי לֹא־נִסָּה וַיֹּאמֶר דָּוִד אֶל־שָׁאוּל לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה כִּי לֹא נִסִּיתִי וַיְסִרֵם דָּוִד מֵעָלָיו׃
    hebrewPlain: ויחגר דוד את חרבו מעל למדיו ויאל ללכת כי לא נסה ויאמר דוד אל שאול לא אוכל ללכת באלה כי לא נסיתי ויסרם דוד מעליו
    kjvRefs:
    - 1 Samuel 17:39
    kjvOsis:
    - 1Sam.17.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.40
    scripture: tanakh
    name: Tanakh 1 Samuel 17:40
    ref: 1 Samuel 17:40
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 40
    ordinal: 7568
    text: And he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in the shepherd’s bag which he had, even in his scrip; and his sling was in his hand; and he drew near to the Philistine.
    translation: JPS 1917
    original: וַיִּקַּח מַקְלוֹ בְּיָדוֹ וַיִּבְחַר־לוֹ חֲמִשָּׁה חַלֻּקֵי־אֲבָנִים מִן־הַנַּחַל וַיָּשֶׂם אֹתָם בִּכְלִי הָרֹעִים אֲשֶׁר־לוֹ וּבַיַּלְקוּט וְקַלְּעוֹ בְיָדוֹ וַיִּגַּשׁ אֶל־הַפְּלִשְׁתִּי׃
    hebrewPlain: ויקח מקלו בידו ויבחר לו חמשה חלקי אבנים מן הנחל וישם אתם בכלי הרעים אשר לו ובילקוט וקלעו בידו ויגש אל הפלשתי
    kjvRefs:
    - 1 Samuel 17:40
    kjvOsis:
    - 1Sam.17.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.41
    scripture: tanakh
    name: Tanakh 1 Samuel 17:41
    ref: 1 Samuel 17:41
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 41
    ordinal: 7569
    text: And the Philistine came nearer and nearer unto David; and the man that bore the shield went before him.
    translation: JPS 1917
    original: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב אֶל־דָּוִד וְהָאִישׁ נֹשֵׂא הַצִּנָּה לְפָנָיו׃
    hebrewPlain: וילך הפלשתי הלך וקרב אל דוד והאיש נשא הצנה לפניו
    kjvRefs:
    - 1 Samuel 17:41
    kjvOsis:
    - 1Sam.17.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.42
    scripture: tanakh
    name: Tanakh 1 Samuel 17:42
    ref: 1 Samuel 17:42
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 42
    ordinal: 7570
    text: And when the Philistine looked about, and saw David, he disdained him; for he was but a youth, and ruddy, and withal of a fair countenance.
    translation: JPS 1917
    original: וַיַּבֵּט הַפְּלִשְׁתִּי וַיִּרְאֶה אֶת־דָּוִד וַיִּבְזֵהוּ כִּי־הָיָה נַעַר וְאַדְמֹנִי עִם־יְפֵה מַרְאֶה׃
    hebrewPlain: ויבט הפלשתי ויראה את דוד ויבזהו כי היה נער ואדמני עם יפה מראה
    kjvRefs:
    - 1 Samuel 17:42
    kjvOsis:
    - 1Sam.17.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.43
    scripture: tanakh
    name: Tanakh 1 Samuel 17:43
    ref: 1 Samuel 17:43
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 43
    ordinal: 7571
    text: 'And the Philistine said unto David: ‘Am I a dog, that thou comest to me with staves?’ And the Philistine cursed David by his god.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַפְּלִשְׁתִּי אֶל־דָּוִד הֲכֶלֶב אָנֹכִי כִּי־אַתָּה בָא־אֵלַי בַּמַּקְלוֹת וַיְקַלֵּל הַפְּלִשְׁתִּי אֶת־דָּוִד בֵּאלֹהָיו׃
    hebrewPlain: ויאמר הפלשתי אל דוד הכלב אנכי כי אתה בא אלי במקלות ויקלל הפלשתי את דוד באלהיו
    kjvRefs:
    - 1 Samuel 17:43
    kjvOsis:
    - 1Sam.17.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.44
    scripture: tanakh
    name: Tanakh 1 Samuel 17:44
    ref: 1 Samuel 17:44
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 44
    ordinal: 7572
    text: 'And the Philistine said to David: ‘Come to me, and I will give thy flesh unto the fowls of the air, and to the beasts of the field.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַפְּלִשְׁתִּי אֶל־דָּוִד לְכָה אֵלַי וְאֶתְּנָה אֶת־בְּשָׂרְךָ לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הַשָּׂדֶה׃
    hebrewPlain: ויאמר הפלשתי אל דוד לכה אלי ואתנה את בשרך לעוף השמים ולבהמת השדה
    kjvRefs:
    - 1 Samuel 17:44
    kjvOsis:
    - 1Sam.17.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.45
    scripture: tanakh
    name: Tanakh 1 Samuel 17:45
    ref: 1 Samuel 17:45
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 45
    ordinal: 7573
    text: 'Then said David to the Philistine: ‘Thou comest to me with a sword, and with a spear, and with a javelin; but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast taunted.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־הַפְּלִשְׁתִּי אַתָּה בָּא אֵלַי בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן וְאָנֹכִי בָא־אֵלֶיךָ בְּשֵׁם יְהוָה צְבָאוֹת אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל אֲשֶׁר חֵרַפְתָּ׃
    hebrewPlain: ויאמר דוד אל הפלשתי אתה בא אלי בחרב ובחנית ובכידון ואנכי בא אליך בשם יהוה צבאות אלהי מערכות ישראל אשר חרפת
    kjvRefs:
    - 1 Samuel 17:45
    kjvOsis:
    - 1Sam.17.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.46
    scripture: tanakh
    name: Tanakh 1 Samuel 17:46
    ref: 1 Samuel 17:46
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 46
    ordinal: 7574
    text: This day will the LORD deliver thee into my hand; and I will smite thee, and take thy head from off thee; and I will give the carcasses of the host of the Philistines this day unto the fowls of the air, and to the wild beasts of the earth; that all the earth may know that there is a God in Israel;
    translation: JPS 1917
    original: הַיּוֹם הַזֶּה יְסַגֶּרְךָ יְהוָה בְּיָדִי וְהִכִּיתִךָ וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ וְנָתַתִּי פֶּגֶר מַחֲנֵה פְלִשְׁתִּים הַיּוֹם הַזֶּה לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ וְיֵדְעוּ כָּל־הָאָרֶץ כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל׃
    hebrewPlain: היום הזה יסגרך יהוה בידי והכיתך והסרתי את ראשך מעליך ונתתי פגר מחנה פלשתים היום הזה לעוף השמים ולחית הארץ וידעו כל הארץ כי יש אלהים לישראל
    kjvRefs:
    - 1 Samuel 17:46
    kjvOsis:
    - 1Sam.17.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.47
    scripture: tanakh
    name: Tanakh 1 Samuel 17:47
    ref: 1 Samuel 17:47
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 47
    ordinal: 7575
    text: and that all this assembly may know that the LORD saveth not with sword and spear; for the battle is the LORD’S, and He will give you into our hand.’
    translation: JPS 1917
    original: וְיֵדְעוּ כָּל־הַקָּהָל הַזֶּה כִּי־לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ יְהוָה כִּי לַיהוָה הַמִּלְחָמָה וְנָתַן אֶתְכֶם בְּיָדֵנוּ׃
    hebrewPlain: וידעו כל הקהל הזה כי לא בחרב ובחנית יהושיע יהוה כי ליהוה המלחמה ונתן אתכם בידנו
    kjvRefs:
    - 1 Samuel 17:47
    kjvOsis:
    - 1Sam.17.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.48
    scripture: tanakh
    name: Tanakh 1 Samuel 17:48
    ref: 1 Samuel 17:48
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 48
    ordinal: 7576
    text: And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that David hastened, and ran toward the army to meet the Philistine.
    translation: JPS 1917
    original: וְהָיָה כִּי־קָם הַפְּלִשְׁתִּי וַיֵּלֶךְ וַיִּקְרַב לִקְרַאת דָּוִד וַיְמַהֵר דָּוִד וַיָּרָץ הַמַּעֲרָכָה לִקְרַאת הַפְּלִשְׁתִּי׃
    hebrewPlain: והיה כי קם הפלשתי וילך ויקרב לקראת דוד וימהר דוד וירץ המערכה לקראת הפלשתי
    kjvRefs:
    - 1 Samuel 17:48
    kjvOsis:
    - 1Sam.17.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.49
    scripture: tanakh
    name: Tanakh 1 Samuel 17:49
    ref: 1 Samuel 17:49
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 49
    ordinal: 7577
    text: And David put his hand in his bag, and took thence a stone, and slung it, and smote the Philistine in his forehead; and the stone sank into his forehead, and he fell upon his face to the earth.
    translation: JPS 1917
    original: וַיִּשְׁלַח דָּוִד אֶת־יָדוֹ אֶל־הַכֶּלִי וַיִּקַּח מִשָּׁם אֶבֶן וַיְקַלַּע וַיַּךְ אֶת־הַפְּלִשְׁתִּי אֶל־מִצְחוֹ וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ וַיִּפֹּל עַל־פָּנָיו אָרְצָה׃
    hebrewPlain: וישלח דוד את ידו אל הכלי ויקח משם אבן ויקלע ויך את הפלשתי אל מצחו ותטבע האבן במצחו ויפל על פניו ארצה
    kjvRefs:
    - 1 Samuel 17:49
    kjvOsis:
    - 1Sam.17.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.50
    scripture: tanakh
    name: Tanakh 1 Samuel 17:50
    ref: 1 Samuel 17:50
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 50
    ordinal: 7578
    text: So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David.
    translation: JPS 1917
    original: וַיֶּחֱזַק דָּוִד מִן־הַפְּלִשְׁתִּי בַּקֶּלַע וּבָאֶבֶן וַיַּךְ אֶת־הַפְּלִשְׁתִּי וַיְמִיתֵהוּ וְחֶרֶב אֵין בְּיַד־דָּוִד׃
    hebrewPlain: ויחזק דוד מן הפלשתי בקלע ובאבן ויך את הפלשתי וימיתהו וחרב אין ביד דוד
    kjvRefs:
    - 1 Samuel 17:50
    kjvOsis:
    - 1Sam.17.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.51
    scripture: tanakh
    name: Tanakh 1 Samuel 17:51
    ref: 1 Samuel 17:51
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 51
    ordinal: 7579
    text: And David ran, and stood over the Philistine, and took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith. And when the Philistines saw that their mighty man was dead, they fled.
    translation: JPS 1917
    original: וַיָּרָץ דָּוִד וַיַּעֲמֹד אֶל־הַפְּלִשְׁתִּי וַיִּקַּח אֶת־חַרְבּוֹ וַיִּשְׁלְפָהּ מִתַּעְרָהּ וַיְמֹתְתֵהוּ וַיִּכְרָת־בָּהּ אֶת־רֹאשׁוֹ וַיִּרְאוּ הַפְּלִשְׁתִּים כִּי־מֵת גִּבּוֹרָם וַיָּנֻסוּ׃
    hebrewPlain: וירץ דוד ויעמד אל הפלשתי ויקח את חרבו וישלפה מתערה וימתתהו ויכרת בה את ראשו ויראו הפלשתים כי מת גבורם וינסו
    kjvRefs:
    - 1 Samuel 17:51
    kjvOsis:
    - 1Sam.17.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.52
    scripture: tanakh
    name: Tanakh 1 Samuel 17:52
    ref: 1 Samuel 17:52
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 52
    ordinal: 7580
    text: And the men of Israel and of Judah arose, and shouted, and pursued the Philistines, until thou comest to Gai, and to the gates of Ekron. And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.
    translation: JPS 1917
    original: וַיָּקֻמוּ אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה וַיָּרִעוּ וַיִּרְדְּפוּ אֶת־הַפְּלִשְׁתִּים עַד־בּוֹאֲךָ גַיְא וְעַד שַׁעֲרֵי עֶקְרוֹן וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים בְּדֶרֶךְ שַׁעֲרַיִם וְעַד־גַּת וְעַד־עֶקְרוֹן׃
    hebrewPlain: ויקמו אנשי ישראל ויהודה וירעו וירדפו את הפלשתים עד בואך גיא ועד שערי עקרון ויפלו חללי פלשתים בדרך שערים ועד גת ועד עקרון
    kjvRefs:
    - 1 Samuel 17:52
    kjvOsis:
    - 1Sam.17.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.17
- type: TanakhVerse
  data:
    osis: 1Sam.17.53
    scripture: tanakh
    name: Tanakh 1 Samuel 17:53
    ref: 1 Samuel 17:53
    book: 1Sam
    section: neviim
    chapter: 17
    verse: 53
    ordinal: 7581
    text: And the children of Israel returned from chasing after the Philistines, and they spoiled their camp.
    translation: JPS 1917
    original: וַיָּשֻׁבוּ בְּנֵי יִשְׂרָאֵל מִדְּלֹק אַחֲרֵי פְלִשְׁתִּים וַיָּשֹׁסּוּ אֶת־מַחֲנֵיהֶם׃
    hebrewPlain: וישבו בני ישראל מדלק אחרי פלשתים וישסו את מחניהם
    kjvRefs:
    - 1 Samuel 17:53
    kjvOsis:
    - 1Sam.17.53
  relations:
  - predicate: IN
