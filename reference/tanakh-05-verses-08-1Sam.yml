- type: TanakhVerse
  data:
    osis: 1Sam.25.17
    scripture: tanakh
    name: Tanakh 1 Samuel 25:17
    ref: 1 Samuel 25:17
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 17
    ordinal: 7789
    text: Now therefore know and consider what thou wilt do; for evil is determined against our master, and against all his house; for he is such a base fellow, that one cannot speak to him.’
    translation: JPS 1917
    original: וְעַתָּה דְּעִי וּרְאִי מַה־תַּעֲשִׂי כִּי־כָלְתָה הָרָעָה אֶל־אֲדֹנֵינוּ וְעַל כָּל־בֵּיתוֹ וְהוּא בֶּן־בְּלִיַּעַל מִדַּבֵּר אֵלָיו׃
    hebrewPlain: ועתה דעי וראי מה תעשי כי כלתה הרעה אל אדנינו ועל כל ביתו והוא בן בליעל מדבר אליו
    kjvRefs:
    - 1 Samuel 25:17
    kjvOsis:
    - 1Sam.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.18
    scripture: tanakh
    name: Tanakh 1 Samuel 25:18
    ref: 1 Samuel 25:18
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 18
    ordinal: 7790
    text: Then Abigail made haste, and took two hundred loaves, and two bottles of wine, and five sheep ready dressed, and five measures of parched corn, and a hundred clusters of raisins, and two hundred cakes of figs, and laid them on asses.
    translation: JPS 1917
    original: וַתְּמַהֵר אבוגיל [אֲבִיגַיִל] וַתִּקַּח מָאתַיִם לֶחֶם וּשְׁנַיִם נִבְלֵי־יַיִן וְחָמֵשׁ צֹאן עשוות [עֲשׂוּיֹת] וְחָמֵשׁ סְאִים קָלִי וּמֵאָה צִמֻּקִים וּמָאתַיִם דְּבֵלִים וַתָּשֶׂם עַל־הַחֲמֹרִים׃
    hebrewPlain: ותמהר אבוגיל [אביגיל] ותקח מאתים לחם ושנים נבלי יין וחמש צאן עשוות [עשוית] וחמש סאים קלי ומאה צמקים ומאתים דבלים ותשם על החמרים
    kjvRefs:
    - 1 Samuel 25:18
    kjvOsis:
    - 1Sam.25.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.19
    scripture: tanakh
    name: Tanakh 1 Samuel 25:19
    ref: 1 Samuel 25:19
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 19
    ordinal: 7791
    text: 'And she said unto her young men: ‘Go on before me; behold, I come after you.’ But she told not her husband Nabal.'
    translation: JPS 1917
    original: וַתֹּאמֶר לִנְעָרֶיהָ עִבְרוּ לְפָנַי הִנְנִי אַחֲרֵיכֶם בָּאָה וּלְאִישָׁהּ נָבָל לֹא הִגִּידָה׃
    hebrewPlain: ותאמר לנעריה עברו לפני הנני אחריכם באה ולאישה נבל לא הגידה
    kjvRefs:
    - 1 Samuel 25:19
    kjvOsis:
    - 1Sam.25.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.20
    scripture: tanakh
    name: Tanakh 1 Samuel 25:20
    ref: 1 Samuel 25:20
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 20
    ordinal: 7792
    text: And it was so, as she rode on her ass, and came down by the covert of the mountain, that, behold, David and his men came down towards her; and she met them.—
    translation: JPS 1917
    original: וְהָיָה הִיא רֹכֶבֶת עַל־הַחֲמוֹר וְיֹרֶדֶת בְּסֵתֶר הָהָר וְהִנֵּה דָוִד וַאֲנָשָׁיו יֹרְדִים לִקְרָאתָהּ וַתִּפְגֹּשׁ אֹתָם׃
    hebrewPlain: והיה היא רכבת על החמור וירדת בסתר ההר והנה דוד ואנשיו ירדים לקראתה ותפגש אתם
    kjvRefs:
    - 1 Samuel 25:20
    kjvOsis:
    - 1Sam.25.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.21
    scripture: tanakh
    name: Tanakh 1 Samuel 25:21
    ref: 1 Samuel 25:21
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 21
    ordinal: 7793
    text: 'Now David had said: ‘Surely in vain have I kept all that this fellow hath in the wilderness, so that nothing was missed of all that pertained unto him; and he hath returned me evil for good.'
    translation: JPS 1917
    original: וְדָוִד אָמַר אַךְ לַשֶּׁקֶר שָׁמַרְתִּי אֶת־כָּל־אֲשֶׁר לָזֶה בַּמִּדְבָּר וְלֹא־נִפְקַד מִכָּל־אֲשֶׁר־לוֹ מְאוּמָה וַיָּשֶׁב־לִי רָעָה תַּחַת טוֹבָה׃
    hebrewPlain: ודוד אמר אך לשקר שמרתי את כל אשר לזה במדבר ולא נפקד מכל אשר לו מאומה וישב לי רעה תחת טובה
    kjvRefs:
    - 1 Samuel 25:21
    kjvOsis:
    - 1Sam.25.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.22
    scripture: tanakh
    name: Tanakh 1 Samuel 25:22
    ref: 1 Samuel 25:22
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 22
    ordinal: 7794
    text: God do so unto the enemies of David, and more also, if I leave of all that pertain to him by the morning light so much as one male.’—
    translation: JPS 1917
    original: כֹּה־יַעֲשֶׂה אֱלֹהִים לְאֹיְבֵי דָוִד וְכֹה יֹסִיף אִם־אַשְׁאִיר מִכָּל־אֲשֶׁר־לוֹ עַד־הַבֹּקֶר מַשְׁתִּין בְּקִיר׃
    hebrewPlain: כה יעשה אלהים לאיבי דוד וכה יסיף אם אשאיר מכל אשר לו עד הבקר משתין בקיר
    kjvRefs:
    - 1 Samuel 25:22
    kjvOsis:
    - 1Sam.25.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.23
    scripture: tanakh
    name: Tanakh 1 Samuel 25:23
    ref: 1 Samuel 25:23
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 23
    ordinal: 7795
    text: And when Abigail saw David, she made haste, and alighted from her ass, and fell before David on her face, and bowed down to the ground.
    translation: JPS 1917
    original: וַתֵּרֶא אֲבִיגַיִל אֶת־דָּוִד וַתְּמַהֵר וַתֵּרֶד מֵעַל הַחֲמוֹר וַתִּפֹּל לְאַפֵּי דָוִד עַל־פָּנֶיהָ וַתִּשְׁתַּחוּ אָרֶץ׃
    hebrewPlain: ותרא אביגיל את דוד ותמהר ותרד מעל החמור ותפל לאפי דוד על פניה ותשתחו ארץ
    kjvRefs:
    - 1 Samuel 25:23
    kjvOsis:
    - 1Sam.25.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.24
    scripture: tanakh
    name: Tanakh 1 Samuel 25:24
    ref: 1 Samuel 25:24
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 24
    ordinal: 7796
    text: 'And she fell at his feet, and said: ‘Upon me, my lord, upon me be the iniquity; and let thy handmaid, I pray thee, speak in thine ears, and hear thou the words of thy handmaid.'
    translation: JPS 1917
    original: וַתִּפֹּל עַל־רַגְלָיו וַתֹּאמֶר בִּי־אֲנִי אֲדֹנִי הֶעָוֺן וּתְדַבֶּר־נָא אֲמָתְךָ בְּאָזְנֶיךָ וּשְׁמַע אֵת דִּבְרֵי אֲמָתֶךָ׃
    hebrewPlain: ותפל על רגליו ותאמר בי אני אדני העון ותדבר נא אמתך באזניך ושמע את דברי אמתך
    kjvRefs:
    - 1 Samuel 25:24
    kjvOsis:
    - 1Sam.25.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.25
    scripture: tanakh
    name: Tanakh 1 Samuel 25:25
    ref: 1 Samuel 25:25
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 25
    ordinal: 7797
    text: 'Let not my lord, I pray thee, regard this base fellow, even Nabal; for as his name is, so is he: Nabal is his name, and churlishness is with him; but I thy handmaid saw not the young men of my lord, whom thou didst send.'
    translation: JPS 1917
    original: אַל־נָא יָשִׂים אֲדֹנִי אֶת־לִבּוֹ אֶל־אִישׁ הַבְּלִיַּעַל הַזֶּה עַל־נָבָל כִּי כִשְׁמוֹ כֶּן־הוּא נָבָל שְׁמוֹ וּנְבָלָה עִמּוֹ וַאֲנִי אֲמָתְךָ לֹא רָאִיתִי אֶת־נַעֲרֵי אֲדֹנִי אֲשֶׁר שָׁלָחְתָּ׃
    hebrewPlain: אל נא ישים אדני את לבו אל איש הבליעל הזה על נבל כי כשמו כן הוא נבל שמו ונבלה עמו ואני אמתך לא ראיתי את נערי אדני אשר שלחת
    kjvRefs:
    - 1 Samuel 25:25
    kjvOsis:
    - 1Sam.25.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.26
    scripture: tanakh
    name: Tanakh 1 Samuel 25:26
    ref: 1 Samuel 25:26
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 26
    ordinal: 7798
    text: Now therefore, my lord, as the LORD liveth, and as thy soul liveth, seeing the LORD hath withholden thee from bloodguiltiness, and from finding redress for thyself with thine own hand, now therefore let thine enemies, and them that seek evil to my lord, be as Nabal.
    translation: JPS 1917
    original: וְעַתָּה אֲדֹנִי חַי־יְהוָה וְחֵי־נַפְשְׁךָ אֲשֶׁר מְנָעֲךָ יְהוָה מִבּוֹא בְדָמִים וְהוֹשֵׁעַ יָדְךָ לָךְ וְעַתָּה יִהְיוּ כְנָבָל אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל־אֲדֹנִי רָעָה׃
    hebrewPlain: ועתה אדני חי יהוה וחי נפשך אשר מנעך יהוה מבוא בדמים והושע ידך לך ועתה יהיו כנבל איביך והמבקשים אל אדני רעה
    kjvRefs:
    - 1 Samuel 25:26
    kjvOsis:
    - 1Sam.25.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.27
    scripture: tanakh
    name: Tanakh 1 Samuel 25:27
    ref: 1 Samuel 25:27
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 27
    ordinal: 7799
    text: And now this present which thy servant hath brought unto my lord, let it be given unto the young men that follow my lord.
    translation: JPS 1917
    original: וְעַתָּה הַבְּרָכָה הַזֹּאת אֲשֶׁר־הֵבִיא שִׁפְחָתְךָ לַאדֹנִי וְנִתְּנָה לַנְּעָרִים הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי׃
    hebrewPlain: ועתה הברכה הזאת אשר הביא שפחתך לאדני ונתנה לנערים המתהלכים ברגלי אדני
    kjvRefs:
    - 1 Samuel 25:27
    kjvOsis:
    - 1Sam.25.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.28
    scripture: tanakh
    name: Tanakh 1 Samuel 25:28
    ref: 1 Samuel 25:28
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 28
    ordinal: 7800
    text: Forgive, I pray thee, the trespass of thy handmaid; for the LORD will certainly make my lord a sure house, because my lord fighteth the battles of the LORD; and evil is not found in thee all thy days.
    translation: JPS 1917
    original: שָׂא נָא לְפֶשַׁע אֲמָתֶךָ כִּי עָשֹׂה־יַעֲשֶׂה יְהוָה לַאדֹנִי בַּיִת נֶאֱמָן כִּי־מִלְחֲמוֹת יְהוָה אֲדֹנִי נִלְחָם וְרָעָה לֹא־תִמָּצֵא בְךָ מִיָּמֶיךָ׃
    hebrewPlain: שא נא לפשע אמתך כי עשה יעשה יהוה לאדני בית נאמן כי מלחמות יהוה אדני נלחם ורעה לא תמצא בך מימיך
    kjvRefs:
    - 1 Samuel 25:28
    kjvOsis:
    - 1Sam.25.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.29
    scripture: tanakh
    name: Tanakh 1 Samuel 25:29
    ref: 1 Samuel 25:29
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 29
    ordinal: 7801
    text: And though man be risen up to pursue thee, and to seek thy soul, yet the soul of my lord shall be bound in the bundle of life with the LORD thy God; and the souls of thine enemies, them shall he sling out, as from the hollow of a sling.
    translation: JPS 1917
    original: וַיָּקָם אָדָם לִרְדָפְךָ וּלְבַקֵּשׁ אֶת־נַפְשֶׁךָ וְהָיְתָה נֶפֶשׁ אֲדֹנִי צְרוּרָה בִּצְרוֹר הַחַיִּים אֵת יְהוָה אֱלֹהֶיךָ וְאֵת נֶפֶשׁ אֹיְבֶיךָ יְקַלְּעֶנָּה בְּתוֹךְ כַּף הַקָּלַע׃
    hebrewPlain: ויקם אדם לרדפך ולבקש את נפשך והיתה נפש אדני צרורה בצרור החיים את יהוה אלהיך ואת נפש איביך יקלענה בתוך כף הקלע
    kjvRefs:
    - 1 Samuel 25:29
    kjvOsis:
    - 1Sam.25.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.30
    scripture: tanakh
    name: Tanakh 1 Samuel 25:30
    ref: 1 Samuel 25:30
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 30
    ordinal: 7802
    text: And it shall come to pass, when the LORD shall have done to my lord according to all the good that He hath spoken concerning thee, and shall have appointed thee prince over Israel;
    translation: JPS 1917
    original: וְהָיָה כִּי־יַעֲשֶׂה יְהוָה לַאדֹנִי כְּכֹל אֲשֶׁר־דִּבֶּר אֶת־הַטּוֹבָה עָלֶיךָ וְצִוְּךָ לְנָגִיד עַל־יִשְׂרָאֵל׃
    hebrewPlain: והיה כי יעשה יהוה לאדני ככל אשר דבר את הטובה עליך וצוך לנגיד על ישראל
    kjvRefs:
    - 1 Samuel 25:30
    kjvOsis:
    - 1Sam.25.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.31
    scripture: tanakh
    name: Tanakh 1 Samuel 25:31
    ref: 1 Samuel 25:31
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 31
    ordinal: 7803
    text: that this shall be no stumbling-block unto thee, nor offence of heart unto my lord, either that thou hast shed blood without cause, or that my lord hath found redress for himself. And when the LORD shall have dealt well with my lord, then remember thy handmaid.’
    translation: JPS 1917
    original: וְלֹא תִהְיֶה זֹאת לְךָ לְפוּקָה וּלְמִכְשׁוֹל לֵב לַאדֹנִי וְלִשְׁפָּךְ־דָּם חִנָּם וּלְהוֹשִׁיעַ אֲדֹנִי לוֹ וְהֵיטִב יְהוָה לַאדֹנִי וְזָכַרְתָּ אֶת־אֲמָתֶךָ׃
    hebrewPlain: ולא תהיה זאת לך לפוקה ולמכשול לב לאדני ולשפך דם חנם ולהושיע אדני לו והיטב יהוה לאדני וזכרת את אמתך
    kjvRefs:
    - 1 Samuel 25:31
    kjvOsis:
    - 1Sam.25.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.32
    scripture: tanakh
    name: Tanakh 1 Samuel 25:32
    ref: 1 Samuel 25:32
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 32
    ordinal: 7804
    text: 'And David said to Abigail: ‘Blessed be the LORD, the God of Israel, who sent thee this day to meet me;'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לַאֲבִיגַל בָּרוּךְ יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר שְׁלָחֵךְ הַיּוֹם הַזֶּה לִקְרָאתִי׃
    hebrewPlain: ויאמר דוד לאביגל ברוך יהוה אלהי ישראל אשר שלחך היום הזה לקראתי
    kjvRefs:
    - 1 Samuel 25:32
    kjvOsis:
    - 1Sam.25.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.33
    scripture: tanakh
    name: Tanakh 1 Samuel 25:33
    ref: 1 Samuel 25:33
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 33
    ordinal: 7805
    text: and blessed be thy discretion, and blessed be thou, that hast kept me this day from bloodguiltiness, and from finding redress for myself with mine own hand.
    translation: JPS 1917
    original: וּבָרוּךְ טַעְמֵךְ וּבְרוּכָה אָתְּ אֲשֶׁר כְּלִתִנִי הַיּוֹם הַזֶּה מִבּוֹא בְדָמִים וְהֹשֵׁעַ יָדִי לִי׃
    hebrewPlain: וברוך טעמך וברוכה את אשר כלתני היום הזה מבוא בדמים והשע ידי לי
    kjvRefs:
    - 1 Samuel 25:33
    kjvOsis:
    - 1Sam.25.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.34
    scripture: tanakh
    name: Tanakh 1 Samuel 25:34
    ref: 1 Samuel 25:34
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 34
    ordinal: 7806
    text: For in very deed, as the LORD, the God of Israel, liveth, who hath withholden me from hurting thee, except thou hadst made haste and come to meet me, surely there had not been left unto Nabal by the morning light so much as one male.’
    translation: JPS 1917
    original: וְאוּלָם חַי־יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר מְנָעַנִי מֵהָרַע אֹתָךְ כִּי לוּלֵי מִהַרְתְּ ותבאתי [וַתָּבֹאת] לִקְרָאתִי כִּי אִם־נוֹתַר לְנָבָל עַד־אוֹר הַבֹּקֶר מַשְׁתִּין בְּקִיר׃
    hebrewPlain: ואולם חי יהוה אלהי ישראל אשר מנעני מהרע אתך כי לולי מהרת ותבאתי [ותבאת] לקראתי כי אם נותר לנבל עד אור הבקר משתין בקיר
    kjvRefs:
    - 1 Samuel 25:34
    kjvOsis:
    - 1Sam.25.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.35
    scripture: tanakh
    name: Tanakh 1 Samuel 25:35
    ref: 1 Samuel 25:35
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 35
    ordinal: 7807
    text: 'So David received of her hand that which she had brought him; and he said unto her: ‘Go up in peace to thy house; see, I have hearkened to thy voice, and have accepted thy person.’'
    translation: JPS 1917
    original: וַיִּקַּח דָּוִד מִיָּדָהּ אֵת אֲשֶׁר־הֵבִיאָה לוֹ וְלָהּ אָמַר עֲלִי לְשָׁלוֹם לְבֵיתֵךְ רְאִי שָׁמַעְתִּי בְקוֹלֵךְ וָאֶשָּׂא פָּנָיִךְ׃
    hebrewPlain: ויקח דוד מידה את אשר הביאה לו ולה אמר עלי לשלום לביתך ראי שמעתי בקולך ואשא פניך
    kjvRefs:
    - 1 Samuel 25:35
    kjvOsis:
    - 1Sam.25.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.36
    scripture: tanakh
    name: Tanakh 1 Samuel 25:36
    ref: 1 Samuel 25:36
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 36
    ordinal: 7808
    text: And Abigail came to Nabal; and, behold, he held a feast in his house, like the feast of a king; and Nabal’s heart was merry within him, for he was very drunken; wherefore she told him nothing, less or more, until the morning light.
    translation: JPS 1917
    original: וַתָּבֹא אֲבִיגַיִל אֶל־נָבָל וְהִנֵּה־לוֹ מִשְׁתֶּה בְּבֵיתוֹ כְּמִשְׁתֵּה הַמֶּלֶךְ וְלֵב נָבָל טוֹב עָלָיו וְהוּא שִׁכֹּר עַד־מְאֹד וְלֹא־הִגִּידָה לּוֹ דָּבָר קָטֹן וְגָדוֹל עַד־אוֹר הַבֹּקֶר׃
    hebrewPlain: ותבא אביגיל אל נבל והנה לו משתה בביתו כמשתה המלך ולב נבל טוב עליו והוא שכר עד מאד ולא הגידה לו דבר קטן וגדול עד אור הבקר
    kjvRefs:
    - 1 Samuel 25:36
    kjvOsis:
    - 1Sam.25.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.37
    scripture: tanakh
    name: Tanakh 1 Samuel 25:37
    ref: 1 Samuel 25:37
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 37
    ordinal: 7809
    text: And it came to pass in the morning, when the wine was gone out of Nabal, that his wife told him these things, and his heart died within him, and he became as a stone.
    translation: JPS 1917
    original: וַיְהִי בַבֹּקֶר בְּצֵאת הַיַּיִן מִנָּבָל וַתַּגֶּד־לוֹ אִשְׁתּוֹ אֶת־הַדְּבָרִים הָאֵלֶּה וַיָּמָת לִבּוֹ בְּקִרְבּוֹ וְהוּא הָיָה לְאָבֶן׃
    hebrewPlain: ויהי בבקר בצאת היין מנבל ותגד לו אשתו את הדברים האלה וימת לבו בקרבו והוא היה לאבן
    kjvRefs:
    - 1 Samuel 25:37
    kjvOsis:
    - 1Sam.25.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.38
    scripture: tanakh
    name: Tanakh 1 Samuel 25:38
    ref: 1 Samuel 25:38
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 38
    ordinal: 7810
    text: And it came to pass about ten days after, that the LORD smote Nabal, so that he died.
    translation: JPS 1917
    original: וַיְהִי כַּעֲשֶׂרֶת הַיָּמִים וַיִּגֹּף יְהוָה אֶת־נָבָל וַיָּמֹת׃
    hebrewPlain: ויהי כעשרת הימים ויגף יהוה את נבל וימת
    kjvRefs:
    - 1 Samuel 25:38
    kjvOsis:
    - 1Sam.25.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.39
    scripture: tanakh
    name: Tanakh 1 Samuel 25:39
    ref: 1 Samuel 25:39
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 39
    ordinal: 7811
    text: 'And when David heard that Nabal was dead, he said: ‘Blessed be the LORD, that hath pleaded the cause of my reproach from the hand of Nabal, and hath kept back His servant from evil; and the evil-doing of Nabal hath the LORD returned upon his own head.’ And David sent and spoke concerning Abigail, to take her to him to wife.'
    translation: JPS 1917
    original: וַיִּשְׁמַע דָּוִד כִּי מֵת נָבָל וַיֹּאמֶר בָּרוּךְ יְהוָה אֲשֶׁר רָב אֶת־רִיב חֶרְפָּתִי מִיַּד נָבָל וְאֶת־עַבְדּוֹ חָשַׂךְ מֵרָעָה וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל לְקַחְתָּהּ לוֹ לְאִשָּׁה׃
    hebrewPlain: וישמע דוד כי מת נבל ויאמר ברוך יהוה אשר רב את ריב חרפתי מיד נבל ואת עבדו חשך מרעה ואת רעת נבל השיב יהוה בראשו וישלח דוד וידבר באביגיל לקחתה לו לאשה
    kjvRefs:
    - 1 Samuel 25:39
    kjvOsis:
    - 1Sam.25.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.40
    scripture: tanakh
    name: Tanakh 1 Samuel 25:40
    ref: 1 Samuel 25:40
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 40
    ordinal: 7812
    text: 'And when the servants of David were come to Abigail to Carmel, they spoke unto her, saying: ‘David hath sent us unto thee, to take thee to him to wife.’'
    translation: JPS 1917
    original: וַיָּבֹאוּ עַבְדֵי דָוִד אֶל־אֲבִיגַיִל הַכַּרְמֶלָה וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר דָּוִד שְׁלָחָנוּ אֵלַיִךְ לְקַחְתֵּךְ לוֹ לְאִשָּׁה׃
    hebrewPlain: ויבאו עבדי דוד אל אביגיל הכרמלה וידברו אליה לאמר דוד שלחנו אליך לקחתך לו לאשה
    kjvRefs:
    - 1 Samuel 25:40
    kjvOsis:
    - 1Sam.25.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.41
    scripture: tanakh
    name: Tanakh 1 Samuel 25:41
    ref: 1 Samuel 25:41
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 41
    ordinal: 7813
    text: 'And she arose, and bowed down with her face to the earth, and said: ‘Behold, thy handmaid is a servant to wash the feet of the servants of my lord.’'
    translation: JPS 1917
    original: וַתָּקָם וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה וַתֹּאמֶר הִנֵּה אֲמָתְךָ לְשִׁפְחָה לִרְחֹץ רַגְלֵי עַבְדֵי אֲדֹנִי׃
    hebrewPlain: ותקם ותשתחו אפים ארצה ותאמר הנה אמתך לשפחה לרחץ רגלי עבדי אדני
    kjvRefs:
    - 1 Samuel 25:41
    kjvOsis:
    - 1Sam.25.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.42
    scripture: tanakh
    name: Tanakh 1 Samuel 25:42
    ref: 1 Samuel 25:42
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 42
    ordinal: 7814
    text: And Abigail hastened, and arose, and rode upon an ass, with five damsels of hers that followed her; and she went after the messengers of David, and became his wife.
    translation: JPS 1917
    original: וַתְּמַהֵר וַתָּקָם אֲבִיגַיִל וַתִּרְכַּב עַל־הַחֲמוֹר וְחָמֵשׁ נַעֲרֹתֶיהָ הַהֹלְכוֹת לְרַגְלָהּ וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד וַתְּהִי־לוֹ לְאִשָּׁה׃
    hebrewPlain: ותמהר ותקם אביגיל ותרכב על החמור וחמש נערתיה ההלכות לרגלה ותלך אחרי מלאכי דוד ותהי לו לאשה
    kjvRefs:
    - 1 Samuel 25:42
    kjvOsis:
    - 1Sam.25.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.43
    scripture: tanakh
    name: Tanakh 1 Samuel 25:43
    ref: 1 Samuel 25:43
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 43
    ordinal: 7815
    text: David also took Ahinoam of Jezreel; and they became both of them his wives.
    translation: JPS 1917
    original: וְאֶת־אֲחִינֹעַם לָקַח דָּוִד מִיִּזְרְעֶאל וַתִּהְיֶיןָ גַּם־שְׁתֵּיהֶן לוֹ לְנָשִׁים׃
    hebrewPlain: ואת אחינעם לקח דוד מיזרעאל ותהיין גם שתיהן לו לנשים
    kjvRefs:
    - 1 Samuel 25:43
    kjvOsis:
    - 1Sam.25.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.25.44
    scripture: tanakh
    name: Tanakh 1 Samuel 25:44
    ref: 1 Samuel 25:44
    book: 1Sam
    section: neviim
    chapter: 25
    verse: 44
    ordinal: 7816
    text: Now Saul had given Michal his daughter, David’s wife, to Palti the son of Laish, who was of Gallim.
    translation: JPS 1917
    original: וְשָׁאוּל נָתַן אֶת־מִיכַל בִּתּוֹ אֵשֶׁת דָּוִד לְפַלְטִי בֶן־לַיִשׁ אֲשֶׁר מִגַּלִּים׃
    hebrewPlain: ושאול נתן את מיכל בתו אשת דוד לפלטי בן ליש אשר מגלים
    kjvRefs:
    - 1 Samuel 25:44
    kjvOsis:
    - 1Sam.25.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.25
- type: TanakhVerse
  data:
    osis: 1Sam.26.1
    scripture: tanakh
    name: Tanakh 1 Samuel 26:1
    ref: 1 Samuel 26:1
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 1
    ordinal: 7817
    text: 'And the Ziphites came unto Saul to Gibeah, saying: ‘Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?’'
    translation: JPS 1917
    original: וַיָּבֹאוּ הַזִּפִים אֶל־שָׁאוּל הַגִּבְעָתָה לֵאמֹר הֲלוֹא דָוִד מִסְתַּתֵּר בְּגִבְעַת הַחֲכִילָה עַל פְּנֵי הַיְשִׁימֹן׃
    hebrewPlain: ויבאו הזפים אל שאול הגבעתה לאמר הלוא דוד מסתתר בגבעת החכילה על פני הישימן
    kjvRefs:
    - 1 Samuel 26:1
    kjvOsis:
    - 1Sam.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.2
    scripture: tanakh
    name: Tanakh 1 Samuel 26:2
    ref: 1 Samuel 26:2
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 2
    ordinal: 7818
    text: Then Saul arose, and went down to the wilderness of Ziph, having three thousand chosen men of Israel with him, to seek David in the wilderness of Ziph.
    translation: JPS 1917
    original: וַיָּקָם שָׁאוּל וַיֵּרֶד אֶל־מִדְבַּר־זִיף וְאִתּוֹ שְׁלֹשֶׁת־אֲלָפִים אִישׁ בְּחוּרֵי יִשְׂרָאֵל לְבַקֵּשׁ אֶת־דָּוִד בְּמִדְבַּר־זִיף׃
    hebrewPlain: ויקם שאול וירד אל מדבר זיף ואתו שלשת אלפים איש בחורי ישראל לבקש את דוד במדבר זיף
    kjvRefs:
    - 1 Samuel 26:2
    kjvOsis:
    - 1Sam.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.3
    scripture: tanakh
    name: Tanakh 1 Samuel 26:3
    ref: 1 Samuel 26:3
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 3
    ordinal: 7819
    text: And Saul pitched in the hill of Hachilah, which is before Jeshimon, by the way. But David abode in the wilderness, and he saw that Saul came after him into the wilderness.
    translation: JPS 1917
    original: וַיִּחַן שָׁאוּל בְּגִבְעַת הַחֲכִילָה אֲשֶׁר עַל־פְּנֵי הַיְשִׁימֹן עַל־הַדָּרֶךְ וְדָוִד יֹשֵׁב בַּמִּדְבָּר וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו הַמִּדְבָּרָה׃
    hebrewPlain: ויחן שאול בגבעת החכילה אשר על פני הישימן על הדרך ודוד ישב במדבר וירא כי בא שאול אחריו המדברה
    kjvRefs:
    - 1 Samuel 26:3
    kjvOsis:
    - 1Sam.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.4
    scripture: tanakh
    name: Tanakh 1 Samuel 26:4
    ref: 1 Samuel 26:4
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 4
    ordinal: 7820
    text: David therefore sent out spies, and understood that Saul was come of a certainty.
    translation: JPS 1917
    original: וַיִּשְׁלַח דָּוִד מְרַגְּלִים וַיֵּדַע כִּי־בָא שָׁאוּל אֶל־נָכוֹן׃
    hebrewPlain: וישלח דוד מרגלים וידע כי בא שאול אל נכון
    kjvRefs:
    - 1 Samuel 26:4
    kjvOsis:
    - 1Sam.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.5
    scripture: tanakh
    name: Tanakh 1 Samuel 26:5
    ref: 1 Samuel 26:5
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 5
    ordinal: 7821
    text: And David arose, and came to the place where Saul had pitched; and David beheld the place where Saul lay, and Abner the son of Ner, the captain of his host; and Saul lay within the barricade, and the people pitched round about him.
    translation: JPS 1917
    original: וַיָּקָם דָּוִד וַיָּבֹא אֶל־הַמָּקוֹם אֲשֶׁר חָנָה־שָׁם שָׁאוּל וַיַּרְא דָּוִד אֶת־הַמָּקוֹם אֲשֶׁר שָׁכַב־שָׁם שָׁאוּל וְאַבְנֵר בֶּן־נֵר שַׂר־צְבָאוֹ וְשָׁאוּל שֹׁכֵב בַּמַּעְגָּל וְהָעָם חֹנִים סביבתו [סְבִיבֹתָיו׃]
    hebrewPlain: ויקם דוד ויבא אל המקום אשר חנה שם שאול וירא דוד את המקום אשר שכב שם שאול ואבנר בן נר שר צבאו ושאול שכב במעגל והעם חנים סביבתו [סביבתיו]
    kjvRefs:
    - 1 Samuel 26:5
    kjvOsis:
    - 1Sam.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.6
    scripture: tanakh
    name: Tanakh 1 Samuel 26:6
    ref: 1 Samuel 26:6
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 6
    ordinal: 7822
    text: 'Then answered David and said to Ahimelech the Hittite, and to Abishai the son of Zeruiah, brother to Joab, saying: ‘Who will go down with me to Saul to the camp?’ And Abishai said: ‘I will go down with thee.’'
    translation: JPS 1917
    original: וַיַּעַן דָּוִד וַיֹּאמֶר אֶל־אֲחִימֶלֶךְ הַחִתִּי וְאֶל־אֲבִישַׁי בֶּן־צְרוּיָה אֲחִי יוֹאָב לֵאמֹר מִי־יֵרֵד אִתִּי אֶל־שָׁאוּל אֶל־הַמַּחֲנֶה וַיֹּאמֶר אֲבִישַׁי אֲנִי אֵרֵד עִמָּךְ׃
    hebrewPlain: ויען דוד ויאמר אל אחימלך החתי ואל אבישי בן צרויה אחי יואב לאמר מי ירד אתי אל שאול אל המחנה ויאמר אבישי אני ארד עמך
    kjvRefs:
    - 1 Samuel 26:6
    kjvOsis:
    - 1Sam.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.7
    scripture: tanakh
    name: Tanakh 1 Samuel 26:7
    ref: 1 Samuel 26:7
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 7
    ordinal: 7823
    text: So David and Abishai came to the people by night; and, behold, Saul lay sleeping within the barricade, with his spear stuck in the ground at his head; and Abner and the people lay round about him.
    translation: JPS 1917
    original: וַיָּבֹא דָוִד וַאֲבִישַׁי אֶל־הָעָם לַיְלָה וְהִנֵּה שָׁאוּל שֹׁכֵב יָשֵׁן בַּמַּעְגָּל וַחֲנִיתוֹ מְעוּכָה־בָאָרֶץ מראשתו [מְרַאֲשֹׁתָיו] וְאַבְנֵר וְהָעָם שֹׁכְבִים סביבתו [סְבִיבֹתָיו׃]
    hebrewPlain: ויבא דוד ואבישי אל העם לילה והנה שאול שכב ישן במעגל וחניתו מעוכה בארץ מראשתו [מראשתיו] ואבנר והעם שכבים סביבתו [סביבתיו]
    kjvRefs:
    - 1 Samuel 26:7
    kjvOsis:
    - 1Sam.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.8
    scripture: tanakh
    name: Tanakh 1 Samuel 26:8
    ref: 1 Samuel 26:8
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 8
    ordinal: 7824
    text: 'Then said Abishai to David: ‘God hath delivered up thine enemy into thy hand this day; now therefore let me smite him, I pray thee, with the spear to the earth at one stroke, and I will not smite him the second time.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲבִישַׁי אֶל־דָּוִד סִגַּר אֱלֹהִים הַיּוֹם אֶת־אוֹיִבְךָ בְּיָדֶךָ וְעַתָּה אַכֶּנּוּ נָא בַּחֲנִית וּבָאָרֶץ פַּעַם אַחַת וְלֹא אֶשְׁנֶה לוֹ׃
    hebrewPlain: ויאמר אבישי אל דוד סגר אלהים היום את אויבך בידך ועתה אכנו נא בחנית ובארץ פעם אחת ולא אשנה לו
    kjvRefs:
    - 1 Samuel 26:8
    kjvOsis:
    - 1Sam.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.9
    scripture: tanakh
    name: Tanakh 1 Samuel 26:9
    ref: 1 Samuel 26:9
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 9
    ordinal: 7825
    text: 'And David said to Abishai: ‘Destroy him not; for who can put forth his hand against the LORD’S anointed, and be guiltless?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אֲבִישַׁי אַל־תַּשְׁחִיתֵהוּ כִּי מִי שָׁלַח יָדוֹ בִּמְשִׁיחַ יְהוָה וְנִקָּה׃
    hebrewPlain: ויאמר דוד אל אבישי אל תשחיתהו כי מי שלח ידו במשיח יהוה ונקה
    kjvRefs:
    - 1 Samuel 26:9
    kjvOsis:
    - 1Sam.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.10
    scripture: tanakh
    name: Tanakh 1 Samuel 26:10
    ref: 1 Samuel 26:10
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 10
    ordinal: 7826
    text: 'And David said: ‘As the LORD liveth, nay, but the LORD shall smite him; or his day shall come to die; or he shall go down into battle, and be swept away.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד חַי־יְהוָה כִּי אִם־יְהוָה יִגָּפֶנּוּ אוֹ־יוֹמוֹ יָבוֹא וָמֵת אוֹ בַמִּלְחָמָה יֵרֵד וְנִסְפָּה׃
    hebrewPlain: ויאמר דוד חי יהוה כי אם יהוה יגפנו או יומו יבוא ומת או במלחמה ירד ונספה
    kjvRefs:
    - 1 Samuel 26:10
    kjvOsis:
    - 1Sam.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.11
    scripture: tanakh
    name: Tanakh 1 Samuel 26:11
    ref: 1 Samuel 26:11
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 11
    ordinal: 7827
    text: The LORD forbid it me, that I should put forth my hand against the LORD’S anointed; but now take, I pray thee, the spear that is at his head, and the cruse of water and let us go.’
    translation: JPS 1917
    original: חָלִילָה לִּי מֵיהוָה מִשְּׁלֹחַ יָדִי בִּמְשִׁיחַ יְהוָה וְעַתָּה קַח־נָא אֶת־הַחֲנִית אֲשֶׁר מראשתו [מְרַאֲשֹׁתָיו] וְאֶת־צַפַּחַת הַמַּיִם וְנֵלֲכָה לָּנוּ׃
    hebrewPlain: חלילה לי מיהוה משלח ידי במשיח יהוה ועתה קח נא את החנית אשר מראשתו [מראשתיו] ואת צפחת המים ונלכה לנו
    kjvRefs:
    - 1 Samuel 26:11
    kjvOsis:
    - 1Sam.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.12
    scripture: tanakh
    name: Tanakh 1 Samuel 26:12
    ref: 1 Samuel 26:12
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 12
    ordinal: 7828
    text: So David took the spear and the cruse of water from Saul’s head; and they got them away, and no man saw it, nor knew it, neither did any awake; for they were all asleep; because a deep sleep from the LORD was fallen upon them.
    translation: JPS 1917
    original: וַיִּקַּח דָּוִד אֶת־הַחֲנִית וְאֶת־צַפַּחַת הַמַּיִם מֵרַאֲשֹׁתֵי שָׁאוּל וַיֵּלְכוּ לָהֶם וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ כִּי כֻלָּם יְשֵׁנִים כִּי תַּרְדֵּמַת יְהוָה נָפְלָה עֲלֵיהֶם׃
    hebrewPlain: ויקח דוד את החנית ואת צפחת המים מראשתי שאול וילכו להם ואין ראה ואין יודע ואין מקיץ כי כלם ישנים כי תרדמת יהוה נפלה עליהם
    kjvRefs:
    - 1 Samuel 26:12
    kjvOsis:
    - 1Sam.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.13
    scripture: tanakh
    name: Tanakh 1 Samuel 26:13
    ref: 1 Samuel 26:13
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 13
    ordinal: 7829
    text: Then David went over to the other side, and stood on the top of the mountain afar off; a great space being between them.
    translation: JPS 1917
    original: וַיַּעֲבֹר דָּוִד הָעֵבֶר וַיַּעֲמֹד עַל־רֹאשׁ־הָהָר מֵרָחֹק רַב הַמָּקוֹם בֵּינֵיהֶם׃
    hebrewPlain: ויעבר דוד העבר ויעמד על ראש ההר מרחק רב המקום ביניהם
    kjvRefs:
    - 1 Samuel 26:13
    kjvOsis:
    - 1Sam.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.14
    scripture: tanakh
    name: Tanakh 1 Samuel 26:14
    ref: 1 Samuel 26:14
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 14
    ordinal: 7830
    text: 'And David cried to the people, and to Abner the son of Ner, saying: ‘Answerest thou not, Abner?’ Then Abner answered and said: ‘Who art thou that criest to the king?’'
    translation: JPS 1917
    original: וַיִּקְרָא דָוִד אֶל־הָעָם וְאֶל־אַבְנֵר בֶּן־נֵר לֵאמֹר הֲלוֹא תַעֲנֶה אַבְנֵר וַיַּעַן אַבְנֵר וַיֹּאמֶר מִי אַתָּה קָרָאתָ אֶל־הַמֶּלֶךְ׃
    hebrewPlain: ויקרא דוד אל העם ואל אבנר בן נר לאמר הלוא תענה אבנר ויען אבנר ויאמר מי אתה קראת אל המלך
    kjvRefs:
    - 1 Samuel 26:14
    kjvOsis:
    - 1Sam.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.15
    scripture: tanakh
    name: Tanakh 1 Samuel 26:15
    ref: 1 Samuel 26:15
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 15
    ordinal: 7831
    text: 'And David said to Abner: ‘Art not thou a valiant man? and who is like to thee in Israel? wherefore then hast thou not kept watch over thy lord the king? for there came one of the people in to destroy the king thy lord.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אַבְנֵר הֲלוֹא־אִישׁ אַתָּה וּמִי כָמוֹךָ בְּיִשְׂרָאֵל וְלָמָּה לֹא שָׁמַרְתָּ אֶל־אֲדֹנֶיךָ הַמֶּלֶךְ כִּי־בָא אַחַד הָעָם לְהַשְׁחִית אֶת־הַמֶּלֶךְ אֲדֹנֶיךָ׃
    hebrewPlain: ויאמר דוד אל אבנר הלוא איש אתה ומי כמוך בישראל ולמה לא שמרת אל אדניך המלך כי בא אחד העם להשחית את המלך אדניך
    kjvRefs:
    - 1 Samuel 26:15
    kjvOsis:
    - 1Sam.26.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.16
    scripture: tanakh
    name: Tanakh 1 Samuel 26:16
    ref: 1 Samuel 26:16
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 16
    ordinal: 7832
    text: This thing is not good that thou hast done. As the LORD liveth, ye deserve to die, because ye have not kept watch over your lord, the LORD’S anointed. And now, see, where the king’s spear is, and the cruse of water that was at his head.’
    translation: JPS 1917
    original: לֹא־טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ חַי־יְהוָה כִּי בְנֵי־מָוֶת אַתֶּם אֲשֶׁר לֹא־שְׁמַרְתֶּם עַל־אֲדֹנֵיכֶם עַל־מְשִׁיחַ יְהוָה וְעַתָּה רְאֵה אֵי־חֲנִית הַמֶּלֶךְ וְאֶת־צַפַּחַת הַמַּיִם אֲשֶׁר מראשתו [מְרַאֲשֹׁתָיו׃]
    hebrewPlain: לא טוב הדבר הזה אשר עשית חי יהוה כי בני מות אתם אשר לא שמרתם על אדניכם על משיח יהוה ועתה ראה אי חנית המלך ואת צפחת המים אשר מראשתו [מראשתיו]
    kjvRefs:
    - 1 Samuel 26:16
    kjvOsis:
    - 1Sam.26.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.17
    scripture: tanakh
    name: Tanakh 1 Samuel 26:17
    ref: 1 Samuel 26:17
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 17
    ordinal: 7833
    text: 'And Saul knew David’s voice, and said: ‘Is this thy voice, my son David?’ And David said: ‘It is my voice, my lord, O king.’'
    translation: JPS 1917
    original: וַיַּכֵּר שָׁאוּל אֶת־קוֹל דָּוִד וַיֹּאמֶר הֲקוֹלְךָ זֶה בְּנִי דָוִד וַיֹּאמֶר דָּוִד קוֹלִי אֲדֹנִי הַמֶּלֶךְ׃
    hebrewPlain: ויכר שאול את קול דוד ויאמר הקולך זה בני דוד ויאמר דוד קולי אדני המלך
    kjvRefs:
    - 1 Samuel 26:17
    kjvOsis:
    - 1Sam.26.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.18
    scripture: tanakh
    name: Tanakh 1 Samuel 26:18
    ref: 1 Samuel 26:18
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 18
    ordinal: 7834
    text: 'And he said: ‘Wherefore doth my lord pursue after his servant? for what have I done? or what evil is in my hand?'
    translation: JPS 1917
    original: וַיֹּאמֶר לָמָּה זֶּה אֲדֹנִי רֹדֵף אַחֲרֵי עַבְדּוֹ כִּי מֶה עָשִׂיתִי וּמַה־בְּיָדִי רָעָה׃
    hebrewPlain: ויאמר למה זה אדני רדף אחרי עבדו כי מה עשיתי ומה בידי רעה
    kjvRefs:
    - 1 Samuel 26:18
    kjvOsis:
    - 1Sam.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.19
    scripture: tanakh
    name: Tanakh 1 Samuel 26:19
    ref: 1 Samuel 26:19
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 19
    ordinal: 7835
    text: 'Now therefore, I pray thee, let my lord the king hear the words of his servant. If it be the LORD that hath stirred thee up against me, let Him accept an offering; but if it be the children of men, cursed be they before the LORD; for they have driven me out this day that I should not cleave unto the inheritance of the LORD, saying: Go, serve other gods.'
    translation: JPS 1917
    original: וְעַתָּה יִשְׁמַע־נָא אֲדֹנִי הַמֶּלֶךְ אֵת דִּבְרֵי עַבְדּוֹ אִם־יְהוָה הֱסִיתְךָ בִי יָרַח מִנְחָה וְאִם בְּנֵי הָאָדָם אֲרוּרִים הֵם לִפְנֵי יְהוָה כִּי־גֵרְשׁוּנִי הַיּוֹם מֵהִסְתַּפֵּחַ בְּנַחֲלַת יְהוָה לֵאמֹר לֵךְ עֲבֹד אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ועתה ישמע נא אדני המלך את דברי עבדו אם יהוה הסיתך בי ירח מנחה ואם בני האדם ארורים הם לפני יהוה כי גרשוני היום מהסתפח בנחלת יהוה לאמר לך עבד אלהים אחרים
    kjvRefs:
    - 1 Samuel 26:19
    kjvOsis:
    - 1Sam.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.20
    scripture: tanakh
    name: Tanakh 1 Samuel 26:20
    ref: 1 Samuel 26:20
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 20
    ordinal: 7836
    text: Now therefore, let not my blood fall to the earth away from the presence of the LORD; for the king of Israel is come out to seek a single flea, as when one doth hunt a partridge in the mountains.’
    translation: JPS 1917
    original: וְעַתָּה אַל־יִפֹּל דָּמִי אַרְצָה מִנֶּגֶד פְּנֵי יְהוָה כִּי־יָצָא מֶלֶךְ יִשְׂרָאֵל לְבַקֵּשׁ אֶת־פַּרְעֹשׁ אֶחָד כַּאֲשֶׁר יִרְדֹּף הַקֹּרֵא בֶּהָרִים׃
    hebrewPlain: ועתה אל יפל דמי ארצה מנגד פני יהוה כי יצא מלך ישראל לבקש את פרעש אחד כאשר ירדף הקרא בהרים
    kjvRefs:
    - 1 Samuel 26:20
    kjvOsis:
    - 1Sam.26.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.21
    scripture: tanakh
    name: Tanakh 1 Samuel 26:21
    ref: 1 Samuel 26:21
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 21
    ordinal: 7837
    text: 'Then said Saul: ‘I have sinned; return, my son David; for I will no more do thee harm, because my life was precious in thine eyes this day; behold, I have played the fool and erred exceedingly.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל חָטָאתִי שׁוּב בְּנִי־דָוִד כִּי לֹא־אָרַע לְךָ עוֹד תַּחַת אֲשֶׁר יָקְרָה נַפְשִׁי בְּעֵינֶיךָ הַיּוֹם הַזֶּה הִנֵּה הִסְכַּלְתִּי וָאֶשְׁגֶּה הַרְבֵּה מְאֹד׃
    hebrewPlain: ויאמר שאול חטאתי שוב בני דוד כי לא ארע לך עוד תחת אשר יקרה נפשי בעיניך היום הזה הנה הסכלתי ואשגה הרבה מאד
    kjvRefs:
    - 1 Samuel 26:21
    kjvOsis:
    - 1Sam.26.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.22
    scripture: tanakh
    name: Tanakh 1 Samuel 26:22
    ref: 1 Samuel 26:22
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 22
    ordinal: 7838
    text: 'And David answered and said: ‘Behold the king’s spear! let then one of the young men come over and fetch it.'
    translation: JPS 1917
    original: וַיַּעַן דָּוִד וַיֹּאמֶר הִנֵּה החנית [חֲנִית] הַמֶּלֶךְ וְיַעֲבֹר אֶחָד מֵהַנְּעָרִים וְיִקָּחֶהָ׃
    hebrewPlain: ויען דוד ויאמר הנה החנית [חנית] המלך ויעבר אחד מהנערים ויקחה
    kjvRefs:
    - 1 Samuel 26:22
    kjvOsis:
    - 1Sam.26.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.23
    scripture: tanakh
    name: Tanakh 1 Samuel 26:23
    ref: 1 Samuel 26:23
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 23
    ordinal: 7839
    text: And the LORD will render to every man his righteousness and his faithfulness; forasmuch as the LORD delivered thee into my hand to-day, and I would not put forth my hand against the LORD’S anointed.
    translation: JPS 1917
    original: וַיהוָה יָשִׁיב לָאִישׁ אֶת־צִדְקָתוֹ וְאֶת־אֱמֻנָתוֹ אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד וְלֹא אָבִיתִי לִשְׁלֹחַ יָדִי בִּמְשִׁיחַ יְהוָה׃
    hebrewPlain: ויהוה ישיב לאיש את צדקתו ואת אמנתו אשר נתנך יהוה היום ביד ולא אביתי לשלח ידי במשיח יהוה
    kjvRefs:
    - 1 Samuel 26:23
    kjvOsis:
    - 1Sam.26.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.24
    scripture: tanakh
    name: Tanakh 1 Samuel 26:24
    ref: 1 Samuel 26:24
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 24
    ordinal: 7840
    text: And, behold, as thy life was much set by this day in mine eyes, so let my life be much set by in the eyes of the LORD, and let Him deliver me out of all tribulation.’
    translation: JPS 1917
    original: וְהִנֵּה כַּאֲשֶׁר גָּדְלָה נַפְשְׁךָ הַיּוֹם הַזֶּה בְּעֵינָי כֵּן תִּגְדַּל נַפְשִׁי בְּעֵינֵי יְהוָה וְיַצִּלֵנִי מִכָּל־צָרָה׃
    hebrewPlain: והנה כאשר גדלה נפשך היום הזה בעיני כן תגדל נפשי בעיני יהוה ויצלני מכל צרה
    kjvRefs:
    - 1 Samuel 26:24
    kjvOsis:
    - 1Sam.26.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.26.25
    scripture: tanakh
    name: Tanakh 1 Samuel 26:25
    ref: 1 Samuel 26:25
    book: 1Sam
    section: neviim
    chapter: 26
    verse: 25
    ordinal: 7841
    text: 'Then Saul said to David: ‘Blessed be thou, my son David; thou shalt both do mightily, and shalt surely prevail.’ So David went his way, and Saul returned to his place.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל אֶל־דָּוִד בָּרוּךְ אַתָּה בְּנִי דָוִד גַּם עָשֹׂה תַעֲשֶׂה וְגַם יָכֹל תּוּכָל וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ וְשָׁאוּל שָׁב לִמְקוֹמוֹ׃
    hebrewPlain: ויאמר שאול אל דוד ברוך אתה בני דוד גם עשה תעשה וגם יכל תוכל וילך דוד לדרכו ושאול שב למקומו
    kjvRefs:
    - 1 Samuel 26:25
    kjvOsis:
    - 1Sam.26.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.26
- type: TanakhVerse
  data:
    osis: 1Sam.27.1
    scripture: tanakh
    name: Tanakh 1 Samuel 27:1
    ref: 1 Samuel 27:1
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 1
    ordinal: 7842
    text: 'And David said in his heart: ‘I shall now be swept away one day by the hand of Saul; there is nothing better for me than that I should escape into the land of the Philistines; and Saul will despair of me, to seek me any more in all the borders of Israel; so shall I escape out of his hand.’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־לִבּוֹ עַתָּה אֶסָּפֶה יוֹם־אֶחָד בְּיַד־שָׁאוּל אֵין־לִי טוֹב כִּי הִמָּלֵט אִמָּלֵט אֶל־אֶרֶץ פְּלִשְׁתִּים וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל לְבַקְשֵׁנִי עוֹד בְּכָל־גְּבוּל יִשְׂרָאֵל וְנִמְלַטְתִּי מִיָּדוֹ׃
    hebrewPlain: ויאמר דוד אל לבו עתה אספה יום אחד ביד שאול אין לי טוב כי המלט אמלט אל ארץ פלשתים ונואש ממני שאול לבקשני עוד בכל גבול ישראל ונמלטתי מידו
    kjvRefs:
    - 1 Samuel 27:1
    kjvOsis:
    - 1Sam.27.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.2
    scripture: tanakh
    name: Tanakh 1 Samuel 27:2
    ref: 1 Samuel 27:2
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 2
    ordinal: 7843
    text: And David arose, and passed over, he and the six hundred men that were with him, unto Achish the son of Maoch, king of Gath.
    translation: JPS 1917
    original: וַיָּקָם דָּוִד וַיַּעֲבֹר הוּא וְשֵׁשׁ־מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ אֶל־אָכִישׁ בֶּן־מָעוֹךְ מֶלֶךְ גַּת׃
    hebrewPlain: ויקם דוד ויעבר הוא ושש מאות איש אשר עמו אל אכיש בן מעוך מלך גת
    kjvRefs:
    - 1 Samuel 27:2
    kjvOsis:
    - 1Sam.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.3
    scripture: tanakh
    name: Tanakh 1 Samuel 27:3
    ref: 1 Samuel 27:3
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 3
    ordinal: 7844
    text: And David dwelt with Achish at Gath, he and his men, every man with his household, even David with his two wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal’s wife.
    translation: JPS 1917
    original: וַיֵּשֶׁב דָּוִד עִם־אָכִישׁ בְּגַת הוּא וַאֲנָשָׁיו אִישׁ וּבֵיתוֹ דָּוִד וּשְׁתֵּי נָשָׁיו אֲחִינֹעַם הַיִּזְרְעֵאלִית וַאֲבִיגַיִל אֵשֶׁת־נָבָל הַכַּרְמְלִית׃
    hebrewPlain: וישב דוד עם אכיש בגת הוא ואנשיו איש וביתו דוד ושתי נשיו אחינעם היזרעאלית ואביגיל אשת נבל הכרמלית
    kjvRefs:
    - 1 Samuel 27:3
    kjvOsis:
    - 1Sam.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.4
    scripture: tanakh
    name: Tanakh 1 Samuel 27:4
    ref: 1 Samuel 27:4
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 4
    ordinal: 7845
    text: And it was told Saul that David was fled to Gath; and he sought no more again for him.
    translation: JPS 1917
    original: וַיֻּגַּד לְשָׁאוּל כִּי־בָרַח דָּוִד גַּת וְלֹא־יוסף [יָסַף] עוֹד לְבַקְשׁוֹ׃
    hebrewPlain: ויגד לשאול כי ברח דוד גת ולא יוסף [יסף] עוד לבקשו
    kjvRefs:
    - 1 Samuel 27:4
    kjvOsis:
    - 1Sam.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.5
    scripture: tanakh
    name: Tanakh 1 Samuel 27:5
    ref: 1 Samuel 27:5
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 5
    ordinal: 7846
    text: 'And David said unto Achish: ‘If now I have found favour in thine eyes, let them give me a place in one of the cities in the country, that I may dwell there; for why should thy servant dwell in the royal city with thee?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אָכִישׁ אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ יִתְּנוּ־לִי מָקוֹם בְּאַחַת עָרֵי הַשָּׂדֶה וְאֵשְׁבָה שָּׁם וְלָמָּה יֵשֵׁב עַבְדְּךָ בְּעִיר הַמַּמְלָכָה עִמָּךְ׃
    hebrewPlain: ויאמר דוד אל אכיש אם נא מצאתי חן בעיניך יתנו לי מקום באחת ערי השדה ואשבה שם ולמה ישב עבדך בעיר הממלכה עמך
    kjvRefs:
    - 1 Samuel 27:5
    kjvOsis:
    - 1Sam.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.6
    scripture: tanakh
    name: Tanakh 1 Samuel 27:6
    ref: 1 Samuel 27:6
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 6
    ordinal: 7847
    text: Then Achish gave him Ziklag that day; wherefore Ziklag belongeth unto the kings of Judah unto this day.
    translation: JPS 1917
    original: וַיִּתֶּן־לוֹ אָכִישׁ בַּיּוֹם הַהוּא אֶת־צִקְלָג לָכֵן הָיְתָה צִקְלַג לְמַלְכֵי יְהוּדָה עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויתן לו אכיש ביום ההוא את צקלג לכן היתה צקלג למלכי יהודה עד היום הזה
    kjvRefs:
    - 1 Samuel 27:6
    kjvOsis:
    - 1Sam.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.7
    scripture: tanakh
    name: Tanakh 1 Samuel 27:7
    ref: 1 Samuel 27:7
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 7
    ordinal: 7848
    text: And the number of the days that David dwelt in the country of the Philistines was a full year and four months.
    translation: JPS 1917
    original: וַיְהִי מִסְפַּר הַיָּמִים אֲשֶׁר־יָשַׁב דָּוִד בִּשְׂדֵה פְלִשְׁתִּים יָמִים וְאַרְבָּעָה חֳדָשִׁים׃
    hebrewPlain: ויהי מספר הימים אשר ישב דוד בשדה פלשתים ימים וארבעה חדשים
    kjvRefs:
    - 1 Samuel 27:7
    kjvOsis:
    - 1Sam.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.8
    scripture: tanakh
    name: Tanakh 1 Samuel 27:8
    ref: 1 Samuel 27:8
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 8
    ordinal: 7849
    text: And David and his men went up, and made a raid upon the Geshurites, and the Gizrites, and the Amalekites; for those were the inhabitants of the land, who were of old, as thou goest to Shur, even unto the land of Egypt.
    translation: JPS 1917
    original: וַיַּעַל דָּוִד וַאֲנָשָׁיו וַיִּפְשְׁטוּ אֶל־הַגְּשׁוּרִי והגרזי [וְהַגִּזְרִי] וְהָעֲמָלֵקִי כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ אֲשֶׁר מֵעוֹלָם בּוֹאֲךָ שׁוּרָה וְעַד־אֶרֶץ מִצְרָיִם׃
    hebrewPlain: ויעל דוד ואנשיו ויפשטו אל הגשורי והגרזי [והגזרי] והעמלקי כי הנה ישבות הארץ אשר מעולם בואך שורה ועד ארץ מצרים
    kjvRefs:
    - 1 Samuel 27:8
    kjvOsis:
    - 1Sam.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.9
    scripture: tanakh
    name: Tanakh 1 Samuel 27:9
    ref: 1 Samuel 27:9
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 9
    ordinal: 7850
    text: And David smote the land, and left neither man nor woman alive, and took away the sheep, and the oxen, and the asses, and the camels, and the apparel. And he returned, and came to Achish.
    translation: JPS 1917
    original: וְהִכָּה דָוִד אֶת־הָאָרֶץ וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה וְלָקַח צֹאן וּבָקָר וַחֲמֹרִים וּגְמַלִּים וּבְגָדִים וַיָּשָׁב וַיָּבֹא אֶל־אָכִישׁ׃
    hebrewPlain: והכה דוד את הארץ ולא יחיה איש ואשה ולקח צאן ובקר וחמרים וגמלים ובגדים וישב ויבא אל אכיש
    kjvRefs:
    - 1 Samuel 27:9
    kjvOsis:
    - 1Sam.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.10
    scripture: tanakh
    name: Tanakh 1 Samuel 27:10
    ref: 1 Samuel 27:10
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 10
    ordinal: 7851
    text: 'And Achish said: ‘Whither have ye made a raid to-day?’ And David said: ‘Against the South of Judah, and against the South of the Jerahmeelites, and against the South of the Kenites.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אָכִישׁ אַל־פְּשַׁטְתֶּם הַיּוֹם וַיֹּאמֶר דָּוִד עַל־נֶגֶב יְהוּדָה וְעַל־נֶגֶב הַיַּרְחְמְאֵלִי וְאֶל־נֶגֶב הַקֵּינִי׃
    hebrewPlain: ויאמר אכיש אל פשטתם היום ויאמר דוד על נגב יהודה ועל נגב הירחמאלי ואל נגב הקיני
    kjvRefs:
    - 1 Samuel 27:10
    kjvOsis:
    - 1Sam.27.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.11
    scripture: tanakh
    name: Tanakh 1 Samuel 27:11
    ref: 1 Samuel 27:11
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 11
    ordinal: 7852
    text: 'And David left neither man nor woman alive, to bring them to Gath, saying: ‘Lest they should tell on us, saying: So did David, and so hath been his manner all the while he hath dwelt in the country of the Philistines.’'
    translation: JPS 1917
    original: וְאִישׁ וְאִשָּׁה לֹא־יְחַיֶּה דָוִד לְהָבִיא גַת לֵאמֹר פֶּן־יַגִּדוּ עָלֵינוּ לֵאמֹר כֹּה־עָשָׂה דָוִד וְכֹה מִשְׁפָּטוֹ כָּל־הַיָּמִים אֲשֶׁר יָשַׁב בִּשְׂדֵה פְלִשְׁתִּים׃
    hebrewPlain: ואיש ואשה לא יחיה דוד להביא גת לאמר פן יגדו עלינו לאמר כה עשה דוד וכה משפטו כל הימים אשר ישב בשדה פלשתים
    kjvRefs:
    - 1 Samuel 27:11
    kjvOsis:
    - 1Sam.27.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.27.12
    scripture: tanakh
    name: Tanakh 1 Samuel 27:12
    ref: 1 Samuel 27:12
    book: 1Sam
    section: neviim
    chapter: 27
    verse: 12
    ordinal: 7853
    text: 'And Achish believed David, saying: ‘He hath made his people Israel utterly to abhor him; therefore he shall be my servant for ever.’'
    translation: JPS 1917
    original: וַיַּאֲמֵן אָכִישׁ בְּדָוִד לֵאמֹר הַבְאֵשׁ הִבְאִישׁ בְּעַמּוֹ בְיִשְׂרָאֵל וְהָיָה לִי לְעֶבֶד עוֹלָם׃
    hebrewPlain: ויאמן אכיש בדוד לאמר הבאש הבאיש בעמו בישראל והיה לי לעבד עולם
    kjvRefs:
    - 1 Samuel 27:12
    kjvOsis:
    - 1Sam.27.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.27
- type: TanakhVerse
  data:
    osis: 1Sam.28.1
    scripture: tanakh
    name: Tanakh 1 Samuel 28:1
    ref: 1 Samuel 28:1
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 1
    ordinal: 7854
    text: 'And it came to pass in those days, that the Philistines gathered their hosts together for warfare, to fight with Israel. And Achish said unto David: ‘Know thou assuredly, that thou shalt go out with me in the host, thou and thy men.’'
    translation: JPS 1917
    original: וַיְהִי בַּיָּמִים הָהֵם וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת־מַחֲנֵיהֶם לַצָּבָא לְהִלָּחֵם בְּיִשְׂרָאֵל וַיֹּאמֶר אָכִישׁ אֶל־דָּוִד יָדֹעַ תֵּדַע כִּי אִתִּי תֵּצֵא בַמַּחֲנֶה אַתָּה וַאֲנָשֶׁיךָ׃
    hebrewPlain: ויהי בימים ההם ויקבצו פלשתים את מחניהם לצבא להלחם בישראל ויאמר אכיש אל דוד ידע תדע כי אתי תצא במחנה אתה ואנשיך
    kjvRefs:
    - 1 Samuel 28:1
    kjvOsis:
    - 1Sam.28.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.2
    scripture: tanakh
    name: Tanakh 1 Samuel 28:2
    ref: 1 Samuel 28:2
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 2
    ordinal: 7855
    text: 'And David said to Achish: ‘Therefore thou shalt know what thy servant will do.’ And Achish said to David: ‘Therefore will I make thee keeper of my head for ever.’ .'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אָכִישׁ לָכֵן אַתָּה תֵדַע אֵת אֲשֶׁר־יַעֲשֶׂה עַבְדֶּךָ וַיֹּאמֶר אָכִישׁ אֶל־דָּוִד לָכֵן שֹׁמֵר לְרֹאשִׁי אֲשִׂימְךָ כָּל־הַיָּמִים׃
    hebrewPlain: ויאמר דוד אל אכיש לכן אתה תדע את אשר יעשה עבדך ויאמר אכיש אל דוד לכן שמר לראשי אשימך כל הימים
    kjvRefs:
    - 1 Samuel 28:2
    kjvOsis:
    - 1Sam.28.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.3
    scripture: tanakh
    name: Tanakh 1 Samuel 28:3
    ref: 1 Samuel 28:3
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 3
    ordinal: 7856
    text: Now Samuel was dead, and all Israel had lamented him, and buried him in Ramah, even in his own city. And Saul had put away those that divined by a ghost or a familiar spirit out of the land.
    translation: JPS 1917
    original: וּשְׁמוּאֵל מֵת וַיִּסְפְּדוּ־לוֹ כָּל־יִשְׂרָאֵל וַיִּקְבְּרֻהוּ בָרָמָה וּבְעִירוֹ וְשָׁאוּל הֵסִיר הָאֹבוֹת וְאֶת־הַיִּדְּעֹנִים מֵהָאָרֶץ׃
    hebrewPlain: ושמואל מת ויספדו לו כל ישראל ויקברהו ברמה ובעירו ושאול הסיר האבות ואת הידענים מהארץ
    kjvRefs:
    - 1 Samuel 28:3
    kjvOsis:
    - 1Sam.28.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.4
    scripture: tanakh
    name: Tanakh 1 Samuel 28:4
    ref: 1 Samuel 28:4
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 4
    ordinal: 7857
    text: And the Philistines gathered themselves together, and came and pitched in Shunem; and Saul gathered all Israel together, and they pitched in Gilboa.
    translation: JPS 1917
    original: וַיִּקָּבְצוּ פְלִשְׁתִּים וַיָּבֹאוּ וַיַּחֲנוּ בְשׁוּנֵם וַיִּקְבֹּץ שָׁאוּל אֶת־כָּל־יִשְׂרָאֵל וַיַּחֲנוּ בַּגִּלְבֹּעַ׃
    hebrewPlain: ויקבצו פלשתים ויבאו ויחנו בשונם ויקבץ שאול את כל ישראל ויחנו בגלבע
    kjvRefs:
    - 1 Samuel 28:4
    kjvOsis:
    - 1Sam.28.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.5
    scripture: tanakh
    name: Tanakh 1 Samuel 28:5
    ref: 1 Samuel 28:5
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 5
    ordinal: 7858
    text: And when Saul saw the host of the Philistines, he was afraid, and his heart trembled greatly.
    translation: JPS 1917
    original: וַיַּרְא שָׁאוּל אֶת־מַחֲנֵה פְלִשְׁתִּים וַיִּרָא וַיֶּחֱרַד לִבּוֹ מְאֹד׃
    hebrewPlain: וירא שאול את מחנה פלשתים וירא ויחרד לבו מאד
    kjvRefs:
    - 1 Samuel 28:5
    kjvOsis:
    - 1Sam.28.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.6
    scripture: tanakh
    name: Tanakh 1 Samuel 28:6
    ref: 1 Samuel 28:6
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 6
    ordinal: 7859
    text: And when Saul inquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets.
    translation: JPS 1917
    original: וַיִּשְׁאַל שָׁאוּל בַּיהוָה וְלֹא עָנָהוּ יְהוָה גַּם בַּחֲלֹמוֹת גַּם בָּאוּרִים גַּם בַּנְּבִיאִם׃
    hebrewPlain: וישאל שאול ביהוה ולא ענהו יהוה גם בחלמות גם באורים גם בנביאם
    kjvRefs:
    - 1 Samuel 28:6
    kjvOsis:
    - 1Sam.28.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.7
    scripture: tanakh
    name: Tanakh 1 Samuel 28:7
    ref: 1 Samuel 28:7
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 7
    ordinal: 7860
    text: 'Then said Saul unto his servants: ‘Seek me a woman that divineth by a ghost, that I may go to her, and inquire of her.’ And his servants said to him: ‘Behold, there is a woman that divineth by a ghost at En-dor.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לַעֲבָדָיו בַּקְּשׁוּ־לִי אֵשֶׁת בַּעֲלַת־אוֹב וְאֵלְכָה אֵלֶיהָ וְאֶדְרְשָׁה־בָּהּ וַיֹּאמְרוּ עֲבָדָיו אֵלָיו הִנֵּה אֵשֶׁת בַּעֲלַת־אוֹב בְּעֵין דּוֹר׃
    hebrewPlain: ויאמר שאול לעבדיו בקשו לי אשת בעלת אוב ואלכה אליה ואדרשה בה ויאמרו עבדיו אליו הנה אשת בעלת אוב בעין דור
    kjvRefs:
    - 1 Samuel 28:7
    kjvOsis:
    - 1Sam.28.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.8
    scripture: tanakh
    name: Tanakh 1 Samuel 28:8
    ref: 1 Samuel 28:8
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 8
    ordinal: 7861
    text: 'And Saul disguised himself, and put on other raiment, and went, he and two men with him, and they came to the woman by night; and he said: ‘Divine unto me, I pray thee, by a ghost, and bring me up whomsoever I shall name unto thee.’'
    translation: JPS 1917
    original: וַיִּתְחַפֵּשׂ שָׁאוּל וַיִּלְבַּשׁ בְּגָדִים אֲחֵרִים וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ וַיָּבֹאוּ אֶל־הָאִשָּׁה לָיְלָה וַיֹּאמֶר קסומי־[קָסֳמִי־] נָא לִי בָּאוֹב וְהַעֲלִי לִי אֵת אֲשֶׁר־אֹמַר אֵלָיִךְ׃
    hebrewPlain: ויתחפש שאול וילבש בגדים אחרים וילך הוא ושני אנשים עמו ויבאו אל האשה לילה ויאמר קסומי [קסמי ] נא לי באוב והעלי לי את אשר אמר אליך
    kjvRefs:
    - 1 Samuel 28:8
    kjvOsis:
    - 1Sam.28.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.9
    scripture: tanakh
    name: Tanakh 1 Samuel 28:9
    ref: 1 Samuel 28:9
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 9
    ordinal: 7862
    text: 'And the woman said unto him: ‘Behold, thou knowest what Saul hath done, how he hath cut off those that divine by a ghost or a familiar spirit out of the land; wherefore then layest thou a snare for my life, to cause me to die?’'
    translation: JPS 1917
    original: וַתֹּאמֶר הָאִשָּׁה אֵלָיו הִנֵּה אַתָּה יָדַעְתָּ אֵת אֲשֶׁר־עָשָׂה שָׁאוּל אֲשֶׁר הִכְרִית אֶת־הָאֹבוֹת וְאֶת־הַיִּדְּעֹנִי מִן־הָאָרֶץ וְלָמָה אַתָּה מִתְנַקֵּשׁ בְּנַפְשִׁי לַהֲמִיתֵנִי׃
    hebrewPlain: ותאמר האשה אליו הנה אתה ידעת את אשר עשה שאול אשר הכרית את האבות ואת הידעני מן הארץ ולמה אתה מתנקש בנפשי להמיתני
    kjvRefs:
    - 1 Samuel 28:9
    kjvOsis:
    - 1Sam.28.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.10
    scripture: tanakh
    name: Tanakh 1 Samuel 28:10
    ref: 1 Samuel 28:10
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 10
    ordinal: 7863
    text: 'And Saul swore to her by the LORD, saying: ‘As the LORD liveth, there shall no punishment happen to thee for this thing.’'
    translation: JPS 1917
    original: וַיִּשָּׁבַע לָהּ שָׁאוּל בַּיהוָה לֵאמֹר חַי־יְהוָה אִם־יִקְּרֵךְ עָוֺן בַּדָּבָר הַזֶּה׃
    hebrewPlain: וישבע לה שאול ביהוה לאמר חי יהוה אם יקרך עון בדבר הזה
    kjvRefs:
    - 1 Samuel 28:10
    kjvOsis:
    - 1Sam.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.11
    scripture: tanakh
    name: Tanakh 1 Samuel 28:11
    ref: 1 Samuel 28:11
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 11
    ordinal: 7864
    text: 'Then said the woman: ‘Whom shall I bring up unto thee?’ And he said: ‘Bring me up Samuel.’'
    translation: JPS 1917
    original: וַתֹּאמֶר הָאִשָּׁה אֶת־מִי אַעֲלֶה־לָּךְ וַיֹּאמֶר אֶת־שְׁמוּאֵל הַעֲלִי־לִי׃
    hebrewPlain: ותאמר האשה את מי אעלה לך ויאמר את שמואל העלי לי
    kjvRefs:
    - 1 Samuel 28:11
    kjvOsis:
    - 1Sam.28.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.12
    scripture: tanakh
    name: Tanakh 1 Samuel 28:12
    ref: 1 Samuel 28:12
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 12
    ordinal: 7865
    text: 'And when the woman saw Samuel, she cried with a loud voice; and the woman spoke to Saul, saying: ‘Why hast thou deceived me? for thou art Saul.’'
    translation: JPS 1917
    original: וַתֵּרֶא הָאִשָּׁה אֶת־שְׁמוּאֵל וַתִּזְעַק בְּקוֹל גָּדוֹל וַתֹּאמֶר הָאִשָּׁה אֶל־שָׁאוּל לֵאמֹר לָמָּה רִמִּיתָנִי וְאַתָּה שָׁאוּל׃
    hebrewPlain: ותרא האשה את שמואל ותזעק בקול גדול ותאמר האשה אל שאול לאמר למה רמיתני ואתה שאול
    kjvRefs:
    - 1 Samuel 28:12
    kjvOsis:
    - 1Sam.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.13
    scripture: tanakh
    name: Tanakh 1 Samuel 28:13
    ref: 1 Samuel 28:13
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 13
    ordinal: 7866
    text: 'And the king said unto her: ‘Be not afraid; for what seest thou?’ And the woman said unto Saul: ‘I see a godlike being coming up out of the earth.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהּ הַמֶּלֶךְ אַל־תִּירְאִי כִּי מָה רָאִית וַתֹּאמֶר הָאִשָּׁה אֶל־שָׁאוּל אֱלֹהִים רָאִיתִי עֹלִים מִן־הָאָרֶץ׃
    hebrewPlain: ויאמר לה המלך אל תיראי כי מה ראית ותאמר האשה אל שאול אלהים ראיתי עלים מן הארץ
    kjvRefs:
    - 1 Samuel 28:13
    kjvOsis:
    - 1Sam.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.14
    scripture: tanakh
    name: Tanakh 1 Samuel 28:14
    ref: 1 Samuel 28:14
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 14
    ordinal: 7867
    text: 'And he said unto her: ‘What form is he of?’ And she said: ‘An old man cometh up; and he is covered with a robe.’ And Saul perceived that it was Samuel, and he bowed with his face to the ground, and prostrated himself.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהּ מַה־תָּאֳרוֹ וַתֹּאמֶר אִישׁ זָקֵן עֹלֶה וְהוּא עֹטֶה מְעִיל וַיֵּדַע שָׁאוּל כִּי־שְׁמוּאֵל הוּא וַיִּקֹּד אַפַּיִם אַרְצָה וַיִּשְׁתָּחוּ׃
    hebrewPlain: ויאמר לה מה תארו ותאמר איש זקן עלה והוא עטה מעיל וידע שאול כי שמואל הוא ויקד אפים ארצה וישתחו
    kjvRefs:
    - 1 Samuel 28:14
    kjvOsis:
    - 1Sam.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.15
    scripture: tanakh
    name: Tanakh 1 Samuel 28:15
    ref: 1 Samuel 28:15
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 15
    ordinal: 7868
    text: 'And Samuel said to Saul: ‘Why hast thou disquieted me, to bring me up?’ And Saul answered: ‘I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams; therefore I have called thee, that thou mayest make known unto me what I shall do.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל אֶל־שָׁאוּל לָמָּה הִרְגַּזְתַּנִי לְהַעֲלוֹת אֹתִי וַיֹּאמֶר שָׁאוּל צַר־לִי מְאֹד וּפְלִשְׁתִּים נִלְחָמִים בִּי וֵאלֹהִים סָר מֵעָלַי וְלֹא־עָנָנִי עוֹד גַּם בְּיַד־הַנְּבִיאִם גַּם־בַּחֲלֹמוֹת וָאֶקְרָאֶה לְךָ לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה׃
    hebrewPlain: ויאמר שמואל אל שאול למה הרגזתני להעלות אתי ויאמר שאול צר לי מאד ופלשתים נלחמים בי ואלהים סר מעלי ולא ענני עוד גם ביד הנביאם גם בחלמות ואקראה לך להודיעני מה אעשה
    kjvRefs:
    - 1 Samuel 28:15
    kjvOsis:
    - 1Sam.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.16
    scripture: tanakh
    name: Tanakh 1 Samuel 28:16
    ref: 1 Samuel 28:16
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 16
    ordinal: 7869
    text: 'And Samuel said: ‘Wherefore then dost thou ask of me, seeing the LORD is departed from thee, and is become thine adversary?'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁמוּאֵל וְלָמָּה תִּשְׁאָלֵנִי וַיהוָה סָר מֵעָלֶיךָ וַיְהִי עָרֶךָ׃
    hebrewPlain: ויאמר שמואל ולמה תשאלני ויהוה סר מעליך ויהי ערך
    kjvRefs:
    - 1 Samuel 28:16
    kjvOsis:
    - 1Sam.28.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.17
    scripture: tanakh
    name: Tanakh 1 Samuel 28:17
    ref: 1 Samuel 28:17
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 17
    ordinal: 7870
    text: And the LORD hath wrought for Himself; as He spoke by me; and the LORD hath rent the kingdom out of thy hand, and given it to thy neighbour, even to David.
    translation: JPS 1917
    original: וַיַּעַשׂ יְהוָה לוֹ כַּאֲשֶׁר דִּבֶּר בְּיָדִי וַיִּקְרַע יְהוָה אֶת־הַמַּמְלָכָה מִיָּדֶךָ וַיִּתְּנָהּ לְרֵעֲךָ לְדָוִד׃
    hebrewPlain: ויעש יהוה לו כאשר דבר בידי ויקרע יהוה את הממלכה מידך ויתנה לרעך לדוד
    kjvRefs:
    - 1 Samuel 28:17
    kjvOsis:
    - 1Sam.28.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.18
    scripture: tanakh
    name: Tanakh 1 Samuel 28:18
    ref: 1 Samuel 28:18
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 18
    ordinal: 7871
    text: Because thou didst not hearken to the voice of the LORD, and didst not execute His fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day.
    translation: JPS 1917
    original: כַּאֲשֶׁר לֹא־שָׁמַעְתָּ בְּקוֹל יְהוָה וְלֹא־עָשִׂיתָ חֲרוֹן־אַפּוֹ בַּעֲמָלֵק עַל־כֵּן הַדָּבָר הַזֶּה עָשָׂה־לְךָ יְהוָה הַיּוֹם הַזֶּה׃
    hebrewPlain: כאשר לא שמעת בקול יהוה ולא עשית חרון אפו בעמלק על כן הדבר הזה עשה לך יהוה היום הזה
    kjvRefs:
    - 1 Samuel 28:18
    kjvOsis:
    - 1Sam.28.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.19
    scripture: tanakh
    name: Tanakh 1 Samuel 28:19
    ref: 1 Samuel 28:19
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 19
    ordinal: 7872
    text: Moreover the LORD will deliver Israel also with thee into the hand of the Philistines; and to-morrow shalt thou and thy sons be with me; the LORD will deliver the host of Israel also into the hand of the Philistines.’
    translation: JPS 1917
    original: וְיִתֵּן יְהוָה גַּם אֶת־יִשְׂרָאֵל עִמְּךָ בְּיַד־פְּלִשְׁתִּים וּמָחָר אַתָּה וּבָנֶיךָ עִמִּי גַּם אֶת־מַחֲנֵה יִשְׂרָאֵל יִתֵּן יְהוָה בְּיַד־פְּלִשְׁתִּים׃
    hebrewPlain: ויתן יהוה גם את ישראל עמך ביד פלשתים ומחר אתה ובניך עמי גם את מחנה ישראל יתן יהוה ביד פלשתים
    kjvRefs:
    - 1 Samuel 28:19
    kjvOsis:
    - 1Sam.28.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.20
    scripture: tanakh
    name: Tanakh 1 Samuel 28:20
    ref: 1 Samuel 28:20
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 20
    ordinal: 7873
    text: Then Saul fell straightway his full length upon the earth, and was sore afraid, because of the words of Samuel; and there was no strength in him; for he had eaten no bread all the day, nor all the night.
    translation: JPS 1917
    original: וַיְמַהֵר שָׁאוּל וַיִּפֹּל מְלֹא־קוֹמָתוֹ אַרְצָה וַיִּרָא מְאֹד מִדִּבְרֵי שְׁמוּאֵל גַּם־כֹּחַ לֹא־הָיָה בוֹ כִּי לֹא אָכַל לֶחֶם כָּל־הַיּוֹם וְכָל־הַלָּיְלָה׃
    hebrewPlain: וימהר שאול ויפל מלא קומתו ארצה וירא מאד מדברי שמואל גם כח לא היה בו כי לא אכל לחם כל היום וכל הלילה
    kjvRefs:
    - 1 Samuel 28:20
    kjvOsis:
    - 1Sam.28.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.21
    scripture: tanakh
    name: Tanakh 1 Samuel 28:21
    ref: 1 Samuel 28:21
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 21
    ordinal: 7874
    text: 'And the woman came unto Saul, and saw that he was sore affrighted, and said unto him: ‘Behold, thy handmaid hath hearkened unto thy voice, and I have put my life in my hand, and have hearkened unto thy words which thou spokest unto me.'
    translation: JPS 1917
    original: וַתָּבוֹא הָאִשָּׁה אֶל־שָׁאוּל וַתֵּרֶא כִּי־נִבְהַל מְאֹד וַתֹּאמֶר אֵלָיו הִנֵּה שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ וָאָשִׂים נַפְשִׁי בְּכַפִּי וָאֶשְׁמַע אֶת־דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי׃
    hebrewPlain: ותבוא האשה אל שאול ותרא כי נבהל מאד ותאמר אליו הנה שמעה שפחתך בקולך ואשים נפשי בכפי ואשמע את דבריך אשר דברת אלי
    kjvRefs:
    - 1 Samuel 28:21
    kjvOsis:
    - 1Sam.28.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.22
    scripture: tanakh
    name: Tanakh 1 Samuel 28:22
    ref: 1 Samuel 28:22
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 22
    ordinal: 7875
    text: Now therefore, I pray thee, hearken thou also unto the voice of thy handmaid, and let me set a morsel of bread before thee; and eat, that thou mayest have strength, when thou goest on thy way.’
    translation: JPS 1917
    original: וְעַתָּה שְׁמַע־נָא גַם־אַתָּה בְּקוֹל שִׁפְחָתֶךָ וְאָשִׂמָה לְפָנֶיךָ פַּת־לֶחֶם וֶאֱכוֹל וִיהִי בְךָ כֹּחַ כִּי תֵלֵךְ בַּדָּרֶךְ׃
    hebrewPlain: ועתה שמע נא גם אתה בקול שפחתך ואשמה לפניך פת לחם ואכול ויהי בך כח כי תלך בדרך
    kjvRefs:
    - 1 Samuel 28:22
    kjvOsis:
    - 1Sam.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.23
    scripture: tanakh
    name: Tanakh 1 Samuel 28:23
    ref: 1 Samuel 28:23
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 23
    ordinal: 7876
    text: 'But he refused, and said: ‘I will not eat.’ But his servants, together with the woman, urged him; and he hearkened unto their voice. So he arose from the earth, and sat upon the bed.'
    translation: JPS 1917
    original: וַיְמָאֵן וַיֹּאמֶר לֹא אֹכַל וַיִּפְרְצוּ־בוֹ עֲבָדָיו וְגַם־הָאִשָּׁה וַיִּשְׁמַע לְקֹלָם וַיָּקָם מֵהָאָרֶץ וַיֵּשֶׁב אֶל־הַמִּטָּה׃
    hebrewPlain: וימאן ויאמר לא אכל ויפרצו בו עבדיו וגם האשה וישמע לקלם ויקם מהארץ וישב אל המטה
    kjvRefs:
    - 1 Samuel 28:23
    kjvOsis:
    - 1Sam.28.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.24
    scripture: tanakh
    name: Tanakh 1 Samuel 28:24
    ref: 1 Samuel 28:24
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 24
    ordinal: 7877
    text: And the woman had a fatted calf in the house; and she made haste, and killed it; and she took flour, and kneaded it, and did bake unleavened bread thereof;
    translation: JPS 1917
    original: וְלָאִשָּׁה עֵגֶל־מַרְבֵּק בַּבַּיִת וַתְּמַהֵר וַתִּזְבָּחֵהוּ וַתִּקַּח־קֶמַח וַתָּלָשׁ וַתֹּפֵהוּ מַצּוֹת׃
    hebrewPlain: ולאשה עגל מרבק בבית ותמהר ותזבחהו ותקח קמח ותלש ותפהו מצות
    kjvRefs:
    - 1 Samuel 28:24
    kjvOsis:
    - 1Sam.28.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.28.25
    scripture: tanakh
    name: Tanakh 1 Samuel 28:25
    ref: 1 Samuel 28:25
    book: 1Sam
    section: neviim
    chapter: 28
    verse: 25
    ordinal: 7878
    text: and she brought it before Saul, and before his servants; and they did eat. Then they rose up, and went away that night.
    translation: JPS 1917
    original: וַתַּגֵּשׁ לִפְנֵי־שָׁאוּל וְלִפְנֵי עֲבָדָיו וַיֹּאכֵלוּ וַיָּקֻמוּ וַיֵּלְכוּ בַּלַּיְלָה הַהוּא׃
    hebrewPlain: ותגש לפני שאול ולפני עבדיו ויאכלו ויקמו וילכו בלילה ההוא
    kjvRefs:
    - 1 Samuel 28:25
    kjvOsis:
    - 1Sam.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.28
- type: TanakhVerse
  data:
    osis: 1Sam.29.1
    scripture: tanakh
    name: Tanakh 1 Samuel 29:1
    ref: 1 Samuel 29:1
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 1
    ordinal: 7879
    text: Now the Philistines gathered together all their hosts to Aphek; and the Israelites pitched by the fountain which is in Jezreel.
    translation: JPS 1917
    original: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת־כָּל־מַחֲנֵיהֶם אֲפֵקָה וְיִשְׂרָאֵל חֹנִים בַּעַיִן אֲשֶׁר בְּיִזְרְעֶאל׃
    hebrewPlain: ויקבצו פלשתים את כל מחניהם אפקה וישראל חנים בעין אשר ביזרעאל
    kjvRefs:
    - 1 Samuel 29:1
    kjvOsis:
    - 1Sam.29.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.2
    scripture: tanakh
    name: Tanakh 1 Samuel 29:2
    ref: 1 Samuel 29:2
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 2
    ordinal: 7880
    text: And the lords of the Philistines passed on by hundreds, and by thousands; and David and his men passed on in the rearward with Achish.
    translation: JPS 1917
    original: וְסַרְנֵי פְלִשְׁתִּים עֹבְרִים לְמֵאוֹת וְלַאֲלָפִים וְדָוִד וַאֲנָשָׁיו עֹבְרִים בָּאַחֲרֹנָה עִם־אָכִישׁ׃
    hebrewPlain: וסרני פלשתים עברים למאות ולאלפים ודוד ואנשיו עברים באחרנה עם אכיש
    kjvRefs:
    - 1 Samuel 29:2
    kjvOsis:
    - 1Sam.29.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.3
    scripture: tanakh
    name: Tanakh 1 Samuel 29:3
    ref: 1 Samuel 29:3
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 3
    ordinal: 7881
    text: 'Then said the princes of the Philistines: ‘What do these Hebrews here?’ And Achish said unto the princes of the Philistines: ‘Is not this David, the servant of Saul the king of Israel, who hath been with me these days or these years, and I have found no fault in him since he fell away unto me unto this day?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ שָׂרֵי פְלִשְׁתִּים מָה הָעִבְרִים הָאֵלֶּה וַיֹּאמֶר אָכִישׁ אֶל־שָׂרֵי פְלִשְׁתִּים הֲלוֹא־זֶה דָוִד עֶבֶד שָׁאוּל מֶלֶךְ־יִשְׂרָאֵל אֲשֶׁר הָיָה אִתִּי זֶה יָמִים אוֹ־זֶה שָׁנִים וְלֹא־מָצָאתִי בוֹ מְאוּמָה מִיּוֹם נָפְלוֹ עַד־הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאמרו שרי פלשתים מה העברים האלה ויאמר אכיש אל שרי פלשתים הלוא זה דוד עבד שאול מלך ישראל אשר היה אתי זה ימים או זה שנים ולא מצאתי בו מאומה מיום נפלו עד היום הזה
    kjvRefs:
    - 1 Samuel 29:3
    kjvOsis:
    - 1Sam.29.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.4
    scripture: tanakh
    name: Tanakh 1 Samuel 29:4
    ref: 1 Samuel 29:4
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 4
    ordinal: 7882
    text: 'But the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him: ‘Make the man return, that he may go back to his place where thou hast appointed him, and let him not go down with us to battle, lest in the battle he become an adversary to us; for wherewith should this fellow reconcile himself unto his lord? should it not be with the heads of these men?'
    translation: JPS 1917
    original: וַיִּקְצְפוּ עָלָיו שָׂרֵי פְלִשְׁתִּים וַיֹּאמְרוּ לוֹ שָׂרֵי פְלִשְׁתִּים הָשֵׁב אֶת־הָאִישׁ וְיָשֹׁב אֶל־מְקוֹמוֹ אֲשֶׁר הִפְקַדְתּוֹ שָׁם וְלֹא־יֵרֵד עִמָּנוּ בַּמִּלְחָמָה וְלֹא־יִהְיֶה־לָּנוּ לְשָׂטָן בַּמִּלְחָמָה וּבַמֶּה יִתְרַצֶּה זֶה אֶל־אֲדֹנָיו הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם׃
    hebrewPlain: ויקצפו עליו שרי פלשתים ויאמרו לו שרי פלשתים השב את האיש וישב אל מקומו אשר הפקדתו שם ולא ירד עמנו במלחמה ולא יהיה לנו לשטן במלחמה ובמה יתרצה זה אל אדניו הלוא בראשי האנשים ההם
    kjvRefs:
    - 1 Samuel 29:4
    kjvOsis:
    - 1Sam.29.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.5
    scripture: tanakh
    name: Tanakh 1 Samuel 29:5
    ref: 1 Samuel 29:5
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 5
    ordinal: 7883
    text: 'Is not this David, of whom they sang one to another in dances, saying: Saul hath slain his thousands, And David his ten thousands?’'
    translation: JPS 1917
    original: הֲלוֹא־זֶה דָוִד אֲשֶׁר יַעֲנוּ־לוֹ בַּמְּחֹלוֹת לֵאמֹר הִכָּה שָׁאוּל בַּאֲלָפָיו וְדָוִד ברבבתו [בְּרִבְבֹתָיו׃]
    hebrewPlain: הלוא זה דוד אשר יענו לו במחלות לאמר הכה שאול באלפיו ודוד ברבבתו [ברבבתיו]
    kjvRefs:
    - 1 Samuel 29:5
    kjvOsis:
    - 1Sam.29.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.6
    scripture: tanakh
    name: Tanakh 1 Samuel 29:6
    ref: 1 Samuel 29:6
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 6
    ordinal: 7884
    text: 'Then Achish called David, and said unto him: ‘As the LORD liveth, thou hast been upright, and thy going out and thy coming in with me in the host is good in my sight; for I have not found evil in thee since the day of thy coming unto me unto this day; nevertheless the lords favour thee not.'
    translation: JPS 1917
    original: וַיִּקְרָא אָכִישׁ אֶל־דָּוִד וַיֹּאמֶר אֵלָיו חַי־יְהוָה כִּי־יָשָׁר אַתָּה וְטוֹב בְּעֵינַי צֵאתְךָ וּבֹאֲךָ אִתִּי בַּמַּחֲנֶה כִּי לֹא־מָצָאתִי בְךָ רָעָה מִיּוֹם בֹּאֲךָ אֵלַי עַד־הַיּוֹם הַזֶּה וּבְעֵינֵי הַסְּרָנִים לֹא־טוֹב אָתָּה׃
    hebrewPlain: ויקרא אכיש אל דוד ויאמר אליו חי יהוה כי ישר אתה וטוב בעיני צאתך ובאך אתי במחנה כי לא מצאתי בך רעה מיום באך אלי עד היום הזה ובעיני הסרנים לא טוב אתה
    kjvRefs:
    - 1 Samuel 29:6
    kjvOsis:
    - 1Sam.29.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.7
    scripture: tanakh
    name: Tanakh 1 Samuel 29:7
    ref: 1 Samuel 29:7
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 7
    ordinal: 7885
    text: Wherefore now return, and go in peace, that thou displease not the lords of the Philistines.’
    translation: JPS 1917
    original: וְעַתָּה שׁוּב וְלֵךְ בְּשָׁלוֹם וְלֹא־תַעֲשֶׂה רָע בְּעֵינֵי סַרְנֵי פְלִשְׁתִּים׃
    hebrewPlain: ועתה שוב ולך בשלום ולא תעשה רע בעיני סרני פלשתים
    kjvRefs:
    - 1 Samuel 29:7
    kjvOsis:
    - 1Sam.29.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.8
    scripture: tanakh
    name: Tanakh 1 Samuel 29:8
    ref: 1 Samuel 29:8
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 8
    ordinal: 7886
    text: 'And David said unto Achish: ‘But what have I done? and what hast thou found in thy servant so long as I have been before thee unto this day, that I may not go and fight against the enemies of my lord the king?’'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אָכִישׁ כִּי מֶה עָשִׂיתִי וּמַה־מָּצָאתָ בְעַבְדְּךָ מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה כִּי לֹא אָבוֹא וְנִלְחַמְתִּי בְּאֹיְבֵי אֲדֹנִי הַמֶּלֶךְ׃
    hebrewPlain: ויאמר דוד אל אכיש כי מה עשיתי ומה מצאת בעבדך מיום אשר הייתי לפניך עד היום הזה כי לא אבוא ונלחמתי באיבי אדני המלך
    kjvRefs:
    - 1 Samuel 29:8
    kjvOsis:
    - 1Sam.29.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.9
    scripture: tanakh
    name: Tanakh 1 Samuel 29:9
    ref: 1 Samuel 29:9
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 9
    ordinal: 7887
    text: 'And Achish answered and said to David: ‘I know that thou art good in my sight, as an angel of God; notwithstanding the princes of the Philistines have said: He shall not go up with us to the battle.'
    translation: JPS 1917
    original: וַיַּעַן אָכִישׁ וַיֹּאמֶר אֶל־דָּוִד יָדַעְתִּי כִּי טוֹב אַתָּה בְּעֵינַי כְּמַלְאַךְ אֱלֹהִים אַךְ שָׂרֵי פְלִשְׁתִּים אָמְרוּ לֹא־יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה׃
    hebrewPlain: ויען אכיש ויאמר אל דוד ידעתי כי טוב אתה בעיני כמלאך אלהים אך שרי פלשתים אמרו לא יעלה עמנו במלחמה
    kjvRefs:
    - 1 Samuel 29:9
    kjvOsis:
    - 1Sam.29.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.10
    scripture: tanakh
    name: Tanakh 1 Samuel 29:10
    ref: 1 Samuel 29:10
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 10
    ordinal: 7888
    text: Wherefore now rise up early in the morning with the servants of thy lord that are come with thee; and as soon as ye are up early in the morning, and have light, depart.’
    translation: JPS 1917
    original: וְעַתָּה הַשְׁכֵּם בַּבֹּקֶר וְעַבְדֵי אֲדֹנֶיךָ אֲשֶׁר־בָּאוּ אִתָּךְ וְהִשְׁכַּמְתֶּם בַּבֹּקֶר וְאוֹר לָכֶם וָלֵכוּ׃
    hebrewPlain: ועתה השכם בבקר ועבדי אדניך אשר באו אתך והשכמתם בבקר ואור לכם ולכו
    kjvRefs:
    - 1 Samuel 29:10
    kjvOsis:
    - 1Sam.29.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.29.11
    scripture: tanakh
    name: Tanakh 1 Samuel 29:11
    ref: 1 Samuel 29:11
    book: 1Sam
    section: neviim
    chapter: 29
    verse: 11
    ordinal: 7889
    text: So David rose up early, he and his men, to depart in the morning, to return into the land of the Philistines. And the Philistines went up to Jezreel.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם דָּוִד הוּא וַאֲנָשָׁיו לָלֶכֶת בַּבֹּקֶר לָשׁוּב אֶל־אֶרֶץ פְּלִשְׁתִּים וּפְלִשְׁתִּים עָלוּ יִזְרְעֶאל׃
    hebrewPlain: וישכם דוד הוא ואנשיו ללכת בבקר לשוב אל ארץ פלשתים ופלשתים עלו יזרעאל
    kjvRefs:
    - 1 Samuel 29:11
    kjvOsis:
    - 1Sam.29.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.29
- type: TanakhVerse
  data:
    osis: 1Sam.30.1
    scripture: tanakh
    name: Tanakh 1 Samuel 30:1
    ref: 1 Samuel 30:1
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 1
    ordinal: 7890
    text: And it came to pass, when David and his men were come to Ziklag on the third day, that the Amalekites had made a raid upon the South, and upon Ziklag, and had smitten Ziklag, and burned it with fire;
    translation: JPS 1917
    original: וַיְהִי בְּבֹא דָוִד וַאֲנָשָׁיו צִקְלַג בַּיּוֹם הַשְּׁלִישִׁי וַעֲמָלֵקִי פָשְׁטוּ אֶל־נֶגֶב וְאֶל־צִקְלַג וַיַּכּוּ אֶת־צִקְלַג וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ׃
    hebrewPlain: ויהי בבא דוד ואנשיו צקלג ביום השלישי ועמלקי פשטו אל נגב ואל צקלג ויכו את צקלג וישרפו אתה באש
    kjvRefs:
    - 1 Samuel 30:1
    kjvOsis:
    - 1Sam.30.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.2
    scripture: tanakh
    name: Tanakh 1 Samuel 30:2
    ref: 1 Samuel 30:2
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 2
    ordinal: 7891
    text: and had taken captive the women and all that were therein, both small and great; they slew not any, but carried them off, and went their way.
    translation: JPS 1917
    original: וַיִּשְׁבּוּ אֶת־הַנָּשִׁים אֲשֶׁר־בָּהּ מִקָּטֹן וְעַד־גָּדוֹל לֹא הֵמִיתוּ אִישׁ וַיִּנְהֲגוּ וַיֵּלְכוּ לְדַרְכָּם׃
    hebrewPlain: וישבו את הנשים אשר בה מקטן ועד גדול לא המיתו איש וינהגו וילכו לדרכם
    kjvRefs:
    - 1 Samuel 30:2
    kjvOsis:
    - 1Sam.30.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.3
    scripture: tanakh
    name: Tanakh 1 Samuel 30:3
    ref: 1 Samuel 30:3
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 3
    ordinal: 7892
    text: And when David and his men came to the city, behold, it was burned with fire; and their wives, and their sons, and their daughters, were taken captives.
    translation: JPS 1917
    original: וַיָּבֹא דָוִד וַאֲנָשָׁיו אֶל־הָעִיר וְהִנֵּה שְׂרוּפָה בָּאֵשׁ וּנְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם נִשְׁבּוּ׃
    hebrewPlain: ויבא דוד ואנשיו אל העיר והנה שרופה באש ונשיהם ובניהם ובנתיהם נשבו
    kjvRefs:
    - 1 Samuel 30:3
    kjvOsis:
    - 1Sam.30.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.4
    scripture: tanakh
    name: Tanakh 1 Samuel 30:4
    ref: 1 Samuel 30:4
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 4
    ordinal: 7893
    text: Then David and the people that were with him lifted up their voice and wept, until they had no more power to weep.
    translation: JPS 1917
    original: וַיִּשָּׂא דָוִד וְהָעָם אֲשֶׁר־אִתּוֹ אֶת־קוֹלָם וַיִּבְכּוּ עַד אֲשֶׁר אֵין־בָּהֶם כֹּחַ לִבְכּוֹת׃
    hebrewPlain: וישא דוד והעם אשר אתו את קולם ויבכו עד אשר אין בהם כח לבכות
    kjvRefs:
    - 1 Samuel 30:4
    kjvOsis:
    - 1Sam.30.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.5
    scripture: tanakh
    name: Tanakh 1 Samuel 30:5
    ref: 1 Samuel 30:5
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 5
    ordinal: 7894
    text: And David’s two wives were taken captives, Ahinoam the Jezreelitess, and Abigail the wife of Nabal the Carmelite.
    translation: JPS 1917
    original: וּשְׁתֵּי נְשֵׁי־דָוִד נִשְׁבּוּ אֲחִינֹעַם הַיִּזְרְעֵלִית וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִי׃
    hebrewPlain: ושתי נשי דוד נשבו אחינעם היזרעלית ואביגיל אשת נבל הכרמלי
    kjvRefs:
    - 1 Samuel 30:5
    kjvOsis:
    - 1Sam.30.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.6
    scripture: tanakh
    name: Tanakh 1 Samuel 30:6
    ref: 1 Samuel 30:6
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 6
    ordinal: 7895
    text: And David was greatly distressed; for the people spoke of stoning him, because the soul of all the people was grieved, every man for his sons and for his daughters; but David strengthened himself in the LORD his God.
    translation: JPS 1917
    original: וַתֵּצֶר לְדָוִד מְאֹד כִּי־אָמְרוּ הָעָם לְסָקְלוֹ כִּי־מָרָה נֶפֶשׁ כָּל־הָעָם אִישׁ עַל־בנו [בָּנָיו] וְעַל־בְּנֹתָיו וַיִּתְחַזֵּק דָּוִד בַּיהוָה אֱלֹהָיו׃
    hebrewPlain: ותצר לדוד מאד כי אמרו העם לסקלו כי מרה נפש כל העם איש על בנו [בניו] ועל בנתיו ויתחזק דוד ביהוה אלהיו
    kjvRefs:
    - 1 Samuel 30:6
    kjvOsis:
    - 1Sam.30.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.7
    scripture: tanakh
    name: Tanakh 1 Samuel 30:7
    ref: 1 Samuel 30:7
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 7
    ordinal: 7896
    text: 'And David said to Abiathar the priest, the son of Ahimelech: ‘I pray thee, bring me hither the ephod.’ And Abiathar brought thither the ephod to David.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד אֶל־אֶבְיָתָר הַכֹּהֵן בֶּן־אֲחִימֶלֶךְ הַגִּישָׁה־נָּא לִי הָאֵפֹד וַיַּגֵּשׁ אֶבְיָתָר אֶת־הָאֵפֹד אֶל־דָּוִד׃
    hebrewPlain: ויאמר דוד אל אביתר הכהן בן אחימלך הגישה נא לי האפד ויגש אביתר את האפד אל דוד
    kjvRefs:
    - 1 Samuel 30:7
    kjvOsis:
    - 1Sam.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.8
    scripture: tanakh
    name: Tanakh 1 Samuel 30:8
    ref: 1 Samuel 30:8
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 8
    ordinal: 7897
    text: 'And David inquired of the LORD, saying: ‘Shall I pursue after this troop? shall I overtake them?’ And He answered him: ‘Pursue; for thou shalt surely overtake them, and shalt without fail recover all.’'
    translation: JPS 1917
    original: וַיִּשְׁאַל דָּוִד בַּיהוָה לֵאמֹר אֶרְדֹּף אַחֲרֵי הַגְּדוּד־הַזֶּה הַאַשִּׂגֶנּוּ וַיֹּאמֶר לוֹ רְדֹף כִּי־הַשֵּׂג תַּשִּׂיג וְהַצֵּל תַּצִּיל׃
    hebrewPlain: וישאל דוד ביהוה לאמר ארדף אחרי הגדוד הזה האשגנו ויאמר לו רדף כי השג תשיג והצל תציל
    kjvRefs:
    - 1 Samuel 30:8
    kjvOsis:
    - 1Sam.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.9
    scripture: tanakh
    name: Tanakh 1 Samuel 30:9
    ref: 1 Samuel 30:9
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 9
    ordinal: 7898
    text: So David went, he and the six hundred men that were with him, and came to the brook Besor, where those that were left behind stayed.
    translation: JPS 1917
    original: וַיֵּלֶךְ דָּוִד הוּא וְשֵׁשׁ־מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ וַיָּבֹאוּ עַד־נַחַל הַבְּשׂוֹר וְהַנּוֹתָרִים עָמָדוּ׃
    hebrewPlain: וילך דוד הוא ושש מאות איש אשר אתו ויבאו עד נחל הבשור והנותרים עמדו
    kjvRefs:
    - 1 Samuel 30:9
    kjvOsis:
    - 1Sam.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.10
    scripture: tanakh
    name: Tanakh 1 Samuel 30:10
    ref: 1 Samuel 30:10
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 10
    ordinal: 7899
    text: But David pursued, he and four hundred men; for two hundred stayed behind, who were so faint that they could not go over the brook Besor.
    translation: JPS 1917
    original: וַיִּרְדֹּף דָּוִד הוּא וְאַרְבַּע־מֵאוֹת אִישׁ וַיַּעַמְדוּ מָאתַיִם אִישׁ אֲשֶׁר פִּגְּרוּ מֵעֲבֹר אֶת־נַחַל הַבְּשׂוֹר׃
    hebrewPlain: וירדף דוד הוא וארבע מאות איש ויעמדו מאתים איש אשר פגרו מעבר את נחל הבשור
    kjvRefs:
    - 1 Samuel 30:10
    kjvOsis:
    - 1Sam.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.11
    scripture: tanakh
    name: Tanakh 1 Samuel 30:11
    ref: 1 Samuel 30:11
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 11
    ordinal: 7900
    text: And they found an Egyptian in the field, and brought him to David, and gave him bread, and he did eat; and they gave him water to drink;
    translation: JPS 1917
    original: וַיִּמְצְאוּ אִישׁ־מִצְרִי בַּשָּׂדֶה וַיִּקְחוּ אֹתוֹ אֶל־דָּוִד וַיִּתְּנוּ־לוֹ לֶחֶם וַיֹּאכַל וַיַּשְׁקֻהוּ מָיִם׃
    hebrewPlain: וימצאו איש מצרי בשדה ויקחו אתו אל דוד ויתנו לו לחם ויאכל וישקהו מים
    kjvRefs:
    - 1 Samuel 30:11
    kjvOsis:
    - 1Sam.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.12
    scripture: tanakh
    name: Tanakh 1 Samuel 30:12
    ref: 1 Samuel 30:12
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 12
    ordinal: 7901
    text: and they gave him a piece of a cake of figs, and two clusters of raisins; and when he had eaten, his spirit came back to him; for he had eaten no bread, nor drunk any water, three days and three nights.
    translation: JPS 1917
    original: וַיִּתְּנוּ־לוֹ פֶלַח דְּבֵלָה וּשְׁנֵי צִמֻּקִים וַיֹּאכַל וַתָּשָׁב רוּחוֹ אֵלָיו כִּי לֹא־אָכַל לֶחֶם וְלֹא־שָׁתָה מַיִם שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת׃
    hebrewPlain: ויתנו לו פלח דבלה ושני צמקים ויאכל ותשב רוחו אליו כי לא אכל לחם ולא שתה מים שלשה ימים ושלשה לילות
    kjvRefs:
    - 1 Samuel 30:12
    kjvOsis:
    - 1Sam.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.13
    scripture: tanakh
    name: Tanakh 1 Samuel 30:13
    ref: 1 Samuel 30:13
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 13
    ordinal: 7902
    text: 'And David said unto him: ‘To whom belongest thou? and whence art thou?’ And he said: ‘I am a young Egyptian, servant to an Amalekite; and my master left me, because three days ago I fell sick.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ דָוִד לְמִי־אַתָּה וְאֵי מִזֶּה אָתָּה וַיֹּאמֶר נַעַר מִצְרִי אָנֹכִי עֶבֶד לְאִישׁ עֲמָלֵקִי וַיַּעַזְבֵנִי אֲדֹנִי כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה׃
    hebrewPlain: ויאמר לו דוד למי אתה ואי מזה אתה ויאמר נער מצרי אנכי עבד לאיש עמלקי ויעזבני אדני כי חליתי היום שלשה
    kjvRefs:
    - 1 Samuel 30:13
    kjvOsis:
    - 1Sam.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.14
    scripture: tanakh
    name: Tanakh 1 Samuel 30:14
    ref: 1 Samuel 30:14
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 14
    ordinal: 7903
    text: We made a raid upon the South of the Cherethites, and upon that which belongeth to Judah, and upon the South of Caleb; and we burned Ziklag with fire.’
    translation: JPS 1917
    original: אֲנַחְנוּ פָּשַׁטְנוּ נֶגֶב הַכְּרֵתִי וְעַל־אֲשֶׁר לִיהוּדָה וְעַל־נֶגֶב כָּלֵב וְאֶת־צִקְלַג שָׂרַפְנוּ בָאֵשׁ׃
    hebrewPlain: אנחנו פשטנו נגב הכרתי ועל אשר ליהודה ועל נגב כלב ואת צקלג שרפנו באש
    kjvRefs:
    - 1 Samuel 30:14
    kjvOsis:
    - 1Sam.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.15
    scripture: tanakh
    name: Tanakh 1 Samuel 30:15
    ref: 1 Samuel 30:15
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 15
    ordinal: 7904
    text: 'And David said to him: ‘Wilt thou bring me down to this troop?’ And he said: ‘Swear unto me by God, that thou wilt neither kill me, nor deliver me up into the hands of my master, and I will bring thee down to this troop.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו דָּוִד הֲתוֹרִדֵנִי אֶל־הַגְּדוּד הַזֶּה וַיֹּאמֶר הִשָּׁבְעָה לִּי בֵאלֹהִים אִם־תְּמִיתֵנִי וְאִם־תַּסְגִּרֵנִי בְּיַד־אֲדֹנִי וְאוֹרִדְךָ אֶל־הַגְּדוּד הַזֶּה׃
    hebrewPlain: ויאמר אליו דוד התורדני אל הגדוד הזה ויאמר השבעה לי באלהים אם תמיתני ואם תסגרני ביד אדני ואורדך אל הגדוד הזה
    kjvRefs:
    - 1 Samuel 30:15
    kjvOsis:
    - 1Sam.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.16
    scripture: tanakh
    name: Tanakh 1 Samuel 30:16
    ref: 1 Samuel 30:16
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 16
    ordinal: 7905
    text: And when he had brought him down, behold, they were spread abroad over all the ground, eating and drinking, and feasting, because of all the great spoil that they had taken out of the land of the Philistines, and out of the land of Judah.
    translation: JPS 1917
    original: וַיֹּרִדֵהוּ וְהִנֵּה נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ אֹכְלִים וְשֹׁתִים וְחֹגְגִים בְּכֹל הַשָּׁלָל הַגָּדוֹל אֲשֶׁר לָקְחוּ מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה׃
    hebrewPlain: וירדהו והנה נטשים על פני כל הארץ אכלים ושתים וחגגים בכל השלל הגדול אשר לקחו מארץ פלשתים ומארץ יהודה
    kjvRefs:
    - 1 Samuel 30:16
    kjvOsis:
    - 1Sam.30.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.17
    scripture: tanakh
    name: Tanakh 1 Samuel 30:17
    ref: 1 Samuel 30:17
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 17
    ordinal: 7906
    text: And David smote them from the twilight even unto the evening of the next day; and there escaped not a man of them, save four hundred young men, who rode upon camels and fled.
    translation: JPS 1917
    original: וַיַּכֵּם דָּוִד מֵהַנֶּשֶׁף וְעַד־הָעֶרֶב לְמָחֳרָתָם וְלֹא־נִמְלַט מֵהֶם אִישׁ כִּי אִם־אַרְבַּע מֵאוֹת אִישׁ־נַעַר אֲשֶׁר־רָכְבוּ עַל־הַגְּמַלִּים וַיָּנֻסוּ׃
    hebrewPlain: ויכם דוד מהנשף ועד הערב למחרתם ולא נמלט מהם איש כי אם ארבע מאות איש נער אשר רכבו על הגמלים וינסו
    kjvRefs:
    - 1 Samuel 30:17
    kjvOsis:
    - 1Sam.30.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.18
    scripture: tanakh
    name: Tanakh 1 Samuel 30:18
    ref: 1 Samuel 30:18
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 18
    ordinal: 7907
    text: And David recovered all that the Amalekites had taken; and David rescued his two wives.
    translation: JPS 1917
    original: וַיַּצֵּל דָּוִד אֵת כָּל־אֲשֶׁר לָקְחוּ עֲמָלֵק וְאֶת־שְׁתֵּי נָשָׁיו הִצִּיל דָּוִד׃
    hebrewPlain: ויצל דוד את כל אשר לקחו עמלק ואת שתי נשיו הציל דוד
    kjvRefs:
    - 1 Samuel 30:18
    kjvOsis:
    - 1Sam.30.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.19
    scripture: tanakh
    name: Tanakh 1 Samuel 30:19
    ref: 1 Samuel 30:19
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 19
    ordinal: 7908
    text: And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any thing that they had taken to them; David brought back all.
    translation: JPS 1917
    original: וְלֹא נֶעְדַּר־לָהֶם מִן־הַקָּטֹן וְעַד־הַגָּדוֹל וְעַד־בָּנִים וּבָנוֹת וּמִשָּׁלָל וְעַד כָּל־אֲשֶׁר לָקְחוּ לָהֶם הַכֹּל הֵשִׁיב דָּוִד׃
    hebrewPlain: ולא נעדר להם מן הקטן ועד הגדול ועד בנים ובנות ומשלל ועד כל אשר לקחו להם הכל השיב דוד
    kjvRefs:
    - 1 Samuel 30:19
    kjvOsis:
    - 1Sam.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.20
    scripture: tanakh
    name: Tanakh 1 Samuel 30:20
    ref: 1 Samuel 30:20
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 20
    ordinal: 7909
    text: 'And David took all the flocks and the herds, which they drove before those other cattle, and said: ‘This is David’s spoil.’'
    translation: JPS 1917
    original: וַיִּקַּח דָּוִד אֶת־כָּל־הַצֹּאן וְהַבָּקָר נָהֲגוּ לִפְנֵי הַמִּקְנֶה הַהוּא וַיֹּאמְרוּ זֶה שְׁלַל דָּוִד׃
    hebrewPlain: ויקח דוד את כל הצאן והבקר נהגו לפני המקנה ההוא ויאמרו זה שלל דוד
    kjvRefs:
    - 1 Samuel 30:20
    kjvOsis:
    - 1Sam.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.21
    scripture: tanakh
    name: Tanakh 1 Samuel 30:21
    ref: 1 Samuel 30:21
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 21
    ordinal: 7910
    text: And David came to the two hundred men, who were so faint that they could not follow David, whom also they had made to abide at the brook Besor; and they went forth to meet David, and to meet the people that were with him; and when David came near to the people, he saluted them.
    translation: JPS 1917
    original: וַיָּבֹא דָוִד אֶל־מָאתַיִם הָאֲנָשִׁים אֲשֶׁר־פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד וַיֹּשִׁיבֻם בְּנַחַל הַבְּשׂוֹר וַיֵּצְאוּ לִקְרַאת דָּוִד וְלִקְרַאת הָעָם אֲשֶׁר־אִתּוֹ וַיִּגַּשׁ דָּוִד אֶת־הָעָם וַיִּשְׁאַל לָהֶם לְשָׁלוֹם׃
    hebrewPlain: ויבא דוד אל מאתים האנשים אשר פגרו מלכת אחרי דוד וישיבם בנחל הבשור ויצאו לקראת דוד ולקראת העם אשר אתו ויגש דוד את העם וישאל להם לשלום
    kjvRefs:
    - 1 Samuel 30:21
    kjvOsis:
    - 1Sam.30.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.22
    scripture: tanakh
    name: Tanakh 1 Samuel 30:22
    ref: 1 Samuel 30:22
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 22
    ordinal: 7911
    text: 'Then answered all the wicked men and base fellows, of those that went with David, and said: ‘Because they went not with us, we will not give them aught of the spoil that we have recovered, save to every man his wife and his children, that they may lead them away, and depart.’'
    translation: JPS 1917
    original: וַיַּעַן כָּל־אִישׁ־רָע וּבְלִיַּעַל מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם־דָּוִד וַיֹּאמְרוּ יַעַן אֲשֶׁר לֹא־הָלְכוּ עִמִּי לֹא־נִתֵּן לָהֶם מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ כִּי־אִם־אִישׁ אֶת־אִשְׁתּוֹ וְאֶת־בָּנָיו וְיִנְהֲגוּ וְיֵלֵכוּ׃
    hebrewPlain: ויען כל איש רע ובליעל מהאנשים אשר הלכו עם דוד ויאמרו יען אשר לא הלכו עמי לא נתן להם מהשלל אשר הצלנו כי אם איש את אשתו ואת בניו וינהגו וילכו
    kjvRefs:
    - 1 Samuel 30:22
    kjvOsis:
    - 1Sam.30.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.23
    scripture: tanakh
    name: Tanakh 1 Samuel 30:23
    ref: 1 Samuel 30:23
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 23
    ordinal: 7912
    text: 'Then said David: ‘Ye shall not do so, my brethren, with that which the LORD hath given unto us, who hath preserved us, and delivered the troop that came against us into our hand.'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּוִד לֹא־תַעֲשׂוּ כֵן אֶחָי אֵת אֲשֶׁר־נָתַן יְהוָה לָנוּ וַיִּשְׁמֹר אֹתָנוּ וַיִּתֵּן אֶת־הַגְּדוּד הַבָּא עָלֵינוּ בְּיָדֵנוּ׃
    hebrewPlain: ויאמר דוד לא תעשו כן אחי את אשר נתן יהוה לנו וישמר אתנו ויתן את הגדוד הבא עלינו בידנו
    kjvRefs:
    - 1 Samuel 30:23
    kjvOsis:
    - 1Sam.30.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.24
    scripture: tanakh
    name: Tanakh 1 Samuel 30:24
    ref: 1 Samuel 30:24
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 24
    ordinal: 7913
    text: And who will hearken unto you in this matter? for as is the share of him that goeth down to the battle, so shall be the share of him that tarrieth by the baggage; they shall share alike.’
    translation: JPS 1917
    original: וּמִי יִשְׁמַע לָכֶם לַדָּבָר הַזֶּה כִּי כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה וּכְחֵלֶק הַיֹּשֵׁב עַל־הַכֵּלִים יַחְדָּו יַחֲלֹקוּ׃
    hebrewPlain: ומי ישמע לכם לדבר הזה כי כחלק הירד במלחמה וכחלק הישב על הכלים יחדו יחלקו
    kjvRefs:
    - 1 Samuel 30:24
    kjvOsis:
    - 1Sam.30.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.25
    scripture: tanakh
    name: Tanakh 1 Samuel 30:25
    ref: 1 Samuel 30:25
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 25
    ordinal: 7914
    text: And it was so from that day forward, that he made it a statute and an ordinance for Israel unto this day.
    translation: JPS 1917
    original: וַיְהִי מֵהַיּוֹם הַהוּא וָמָעְלָה וַיְשִׂמֶהָ לְחֹק וּלְמִשְׁפָּט לְיִשְׂרָאֵל עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויהי מהיום ההוא ומעלה וישמה לחק ולמשפט לישראל עד היום הזה
    kjvRefs:
    - 1 Samuel 30:25
    kjvOsis:
    - 1Sam.30.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.26
    scripture: tanakh
    name: Tanakh 1 Samuel 30:26
    ref: 1 Samuel 30:26
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 26
    ordinal: 7915
    text: 'And when David came to Ziklag, he sent of the spoil unto the elders of Judah, even to his friends, saying: ‘Behold a present for you of the spoil of the enemies of the LORD’;'
    translation: JPS 1917
    original: וַיָּבֹא דָוִד אֶל־צִקְלַג וַיְשַׁלַּח מֵהַשָּׁלָל לְזִקְנֵי יְהוּדָה לְרֵעֵהוּ לֵאמֹר הִנֵּה לָכֶם בְּרָכָה מִשְּׁלַל אֹיְבֵי יְהוָה׃
    hebrewPlain: ויבא דוד אל צקלג וישלח מהשלל לזקני יהודה לרעהו לאמר הנה לכם ברכה משלל איבי יהוה
    kjvRefs:
    - 1 Samuel 30:26
    kjvOsis:
    - 1Sam.30.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.27
    scripture: tanakh
    name: Tanakh 1 Samuel 30:27
    ref: 1 Samuel 30:27
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 27
    ordinal: 7916
    text: to them that were in Beth-el, and to them that were in Ramoth of the South, and to them that were in Jattir;
    translation: JPS 1917
    original: לַאֲשֶׁר בְּבֵית־אֵל וְלַאֲשֶׁר בְּרָמוֹת־נֶגֶב וְלַאֲשֶׁר בְּיַתִּר׃
    hebrewPlain: לאשר בבית אל ולאשר ברמות נגב ולאשר ביתר
    kjvRefs:
    - 1 Samuel 30:27
    kjvOsis:
    - 1Sam.30.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.28
    scripture: tanakh
    name: Tanakh 1 Samuel 30:28
    ref: 1 Samuel 30:28
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 28
    ordinal: 7917
    text: and to them that were in Aroer, and to them that were in Siphmoth, and to them that were in Eshtemoa;
    translation: JPS 1917
    original: וְלַאֲשֶׁר בַּעֲרֹעֵר וְלַאֲשֶׁר בְּשִׂפְמוֹת וְלַאֲשֶׁר בְּאֶשְׁתְּמֹעַ׃
    hebrewPlain: ולאשר בערער ולאשר בשפמות ולאשר באשתמע
    kjvRefs:
    - 1 Samuel 30:28
    kjvOsis:
    - 1Sam.30.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.29
    scripture: tanakh
    name: Tanakh 1 Samuel 30:29
    ref: 1 Samuel 30:29
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 29
    ordinal: 7918
    text: and to them that were in Racal, and to them that were in the cities of the Jerahmeelites, and to them that were in the cities of the Kenites;
    translation: JPS 1917
    original: וְלַאֲשֶׁר בְּרָכָל וְלַאֲשֶׁר בְּעָרֵי הַיְּרַחְמְאֵלִי וְלַאֲשֶׁר בְּעָרֵי הַקֵּינִי׃
    hebrewPlain: ולאשר ברכל ולאשר בערי הירחמאלי ולאשר בערי הקיני
    kjvRefs:
    - 1 Samuel 30:29
    kjvOsis:
    - 1Sam.30.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.30
    scripture: tanakh
    name: Tanakh 1 Samuel 30:30
    ref: 1 Samuel 30:30
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 30
    ordinal: 7919
    text: and to them that were in Hormah, and to them that were in Bor-ashan, and to them that were in Athach;
    translation: JPS 1917
    original: וְלַאֲשֶׁר בְּחָרְמָה וְלַאֲשֶׁר בְּבוֹר־עָשָׁן וְלַאֲשֶׁר בַּעֲתָךְ׃
    hebrewPlain: ולאשר בחרמה ולאשר בבור עשן ולאשר בעתך
    kjvRefs:
    - 1 Samuel 30:30
    kjvOsis:
    - 1Sam.30.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.30.31
    scripture: tanakh
    name: Tanakh 1 Samuel 30:31
    ref: 1 Samuel 30:31
    book: 1Sam
    section: neviim
    chapter: 30
    verse: 31
    ordinal: 7920
    text: and to them that were in Hebron, and to all the places where David himself and his men were wont to haunt.
    translation: JPS 1917
    original: וְלַאֲשֶׁר בְּחֶבְרוֹן וּלְכָל־הַמְּקֹמוֹת אֲשֶׁר־הִתְהַלֶּךְ־שָׁם דָּוִד הוּא וַאֲנָשָׁיו׃
    hebrewPlain: ולאשר בחברון ולכל המקמות אשר התהלך שם דוד הוא ואנשיו
    kjvRefs:
    - 1 Samuel 30:31
    kjvOsis:
    - 1Sam.30.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.30
- type: TanakhVerse
  data:
    osis: 1Sam.31.1
    scripture: tanakh
    name: Tanakh 1 Samuel 31:1
    ref: 1 Samuel 31:1
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 1
    ordinal: 7921
    text: Now the Philistines fought against Israel, and the men of Israel fled from before the Philistines, and fell down slain in mount Gilboa.
    translation: JPS 1917
    original: וּפְלִשְׁתִּים נִלְחָמִים בְּיִשְׂרָאֵל וַיָּנֻסוּ אַנְשֵׁי יִשְׂרָאֵל מִפְּנֵי פְלִשְׁתִּים וַיִּפְּלוּ חֲלָלִים בְּהַר הַגִּלְבֹּעַ׃
    hebrewPlain: ופלשתים נלחמים בישראל וינסו אנשי ישראל מפני פלשתים ויפלו חללים בהר הגלבע
    kjvRefs:
    - 1 Samuel 31:1
    kjvOsis:
    - 1Sam.31.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.2
    scripture: tanakh
    name: Tanakh 1 Samuel 31:2
    ref: 1 Samuel 31:2
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 2
    ordinal: 7922
    text: And the Philistines followed hard upon Saul and upon his sons; and the Philistines slew Jonathan, and Abinadab, and Malchishua, the sons of Saul.
    translation: JPS 1917
    original: וַיַּדְבְּקוּ פְלִשְׁתִּים אֶת־שָׁאוּל וְאֶת־בָּנָיו וַיַּכּוּ פְלִשְׁתִּים אֶת־יְהוֹנָתָן וְאֶת־אֲבִינָדָב וְאֶת־מַלְכִּי־שׁוּעַ בְּנֵי שָׁאוּל׃
    hebrewPlain: וידבקו פלשתים את שאול ואת בניו ויכו פלשתים את יהונתן ואת אבינדב ואת מלכי שוע בני שאול
    kjvRefs:
    - 1 Samuel 31:2
    kjvOsis:
    - 1Sam.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.3
    scripture: tanakh
    name: Tanakh 1 Samuel 31:3
    ref: 1 Samuel 31:3
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 3
    ordinal: 7923
    text: And the battle went sore against Saul, an the archers overtook him; and he was in great anguish by reason of the archers.
    translation: JPS 1917
    original: וַתִּכְבַּד הַמִּלְחָמָה אֶל־שָׁאוּל וַיִּמְצָאֻהוּ הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת וַיָּחֶל מְאֹד מֵהַמּוֹרִים׃
    hebrewPlain: ותכבד המלחמה אל שאול וימצאהו המורים אנשים בקשת ויחל מאד מהמורים
    kjvRefs:
    - 1 Samuel 31:3
    kjvOsis:
    - 1Sam.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.4
    scripture: tanakh
    name: Tanakh 1 Samuel 31:4
    ref: 1 Samuel 31:4
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 4
    ordinal: 7924
    text: 'Then said Saul to his armour-bearer: ‘Draw thy sword, and thrust me through therewith; lest these uncircumcised come and thrust me through, and make a mock of me.’ But his armour-bearer would not; for he was sore afraid. Therefore Saul took his sword, and fell upon it.'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁאוּל לְנֹשֵׂא כֵלָיו שְׁלֹף חַרְבְּךָ וְדָקְרֵנִי בָהּ פֶּן־יָבוֹאוּ הָעֲרֵלִים הָאֵלֶּה וּדְקָרֻנִי וְהִתְעַלְּלוּ־בִי וְלֹא אָבָה נֹשֵׂא כֵלָיו כִּי יָרֵא מְאֹד וַיִּקַּח שָׁאוּל אֶת־הַחֶרֶב וַיִּפֹּל עָלֶיהָ׃
    hebrewPlain: ויאמר שאול לנשא כליו שלף חרבך ודקרני בה פן יבואו הערלים האלה ודקרני והתעללו בי ולא אבה נשא כליו כי ירא מאד ויקח שאול את החרב ויפל עליה
    kjvRefs:
    - 1 Samuel 31:4
    kjvOsis:
    - 1Sam.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.5
    scripture: tanakh
    name: Tanakh 1 Samuel 31:5
    ref: 1 Samuel 31:5
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 5
    ordinal: 7925
    text: And when his armour-bearer saw that Saul was dead, he likewise fell upon his sword, and died with him.
    translation: JPS 1917
    original: וַיַּרְא נֹשֵׂא־כֵלָיו כִּי מֵת שָׁאוּל וַיִּפֹּל גַּם־הוּא עַל־חַרְבּוֹ וַיָּמָת עִמּוֹ׃
    hebrewPlain: וירא נשא כליו כי מת שאול ויפל גם הוא על חרבו וימת עמו
    kjvRefs:
    - 1 Samuel 31:5
    kjvOsis:
    - 1Sam.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.6
    scripture: tanakh
    name: Tanakh 1 Samuel 31:6
    ref: 1 Samuel 31:6
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 6
    ordinal: 7926
    text: So Saul died, and his three sons, and his armour-bearer, and all his men, that same day together.
    translation: JPS 1917
    original: וַיָּמָת שָׁאוּל וּשְׁלֹשֶׁת בָּנָיו וְנֹשֵׂא כֵלָיו גַּם כָּל־אֲנָשָׁיו בַּיּוֹם הַהוּא יַחְדָּו׃
    hebrewPlain: וימת שאול ושלשת בניו ונשא כליו גם כל אנשיו ביום ההוא יחדו
    kjvRefs:
    - 1 Samuel 31:6
    kjvOsis:
    - 1Sam.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.7
    scripture: tanakh
    name: Tanakh 1 Samuel 31:7
    ref: 1 Samuel 31:7
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 7
    ordinal: 7927
    text: And when the men of Israel that were on the other side of the valley, and they that were beyond the Jordan, saw that the men of Israel fled, and that Saul and his sons were dead, they forsook the cities, and fled; and the Philistines came and dwelt in them.
    translation: JPS 1917
    original: וַיִּרְאוּ אַנְשֵׁי־יִשְׂרָאֵל אֲשֶׁר־בְּעֵבֶר הָעֵמֶק וַאֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן כִּי־נָסוּ אַנְשֵׁי יִשְׂרָאֵל וְכִי־מֵתוּ שָׁאוּל וּבָנָיו וַיַּעַזְבוּ אֶת־הֶעָרִים וַיָּנֻסוּ וַיָּבֹאוּ פְלִשְׁתִּים וַיֵּשְׁבוּ בָּהֶן׃
    hebrewPlain: ויראו אנשי ישראל אשר בעבר העמק ואשר בעבר הירדן כי נסו אנשי ישראל וכי מתו שאול ובניו ויעזבו את הערים וינסו ויבאו פלשתים וישבו בהן
    kjvRefs:
    - 1 Samuel 31:7
    kjvOsis:
    - 1Sam.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.8
    scripture: tanakh
    name: Tanakh 1 Samuel 31:8
    ref: 1 Samuel 31:8
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 8
    ordinal: 7928
    text: And it came to pass on the morrow, when the Philistines came to strip the slain, that they found Saul and his three sons fallen in mount Gilboa.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַיָּבֹאוּ פְלִשְׁתִּים לְפַשֵּׁט אֶת־הַחֲלָלִים וַיִּמְצְאוּ אֶת־שָׁאוּל וְאֶת־שְׁלֹשֶׁת בָּנָיו נֹפְלִים בְּהַר הַגִּלְבֹּעַ׃
    hebrewPlain: ויהי ממחרת ויבאו פלשתים לפשט את החללים וימצאו את שאול ואת שלשת בניו נפלים בהר הגלבע
    kjvRefs:
    - 1 Samuel 31:8
    kjvOsis:
    - 1Sam.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.9
    scripture: tanakh
    name: Tanakh 1 Samuel 31:9
    ref: 1 Samuel 31:9
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 9
    ordinal: 7929
    text: And they cut off his head, and stripped off his armour, and sent into the land of the Philistines round about, to carry the tidings unto the house of their idols, and to the people.
    translation: JPS 1917
    original: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ וַיַּפְשִׁיטוּ אֶת־כֵּלָיו וַיְשַׁלְּחוּ בְאֶרֶץ־פְּלִשְׁתִּים סָבִיב לְבַשֵּׂר בֵּית עֲצַבֵּיהֶם וְאֶת־הָעָם׃
    hebrewPlain: ויכרתו את ראשו ויפשיטו את כליו וישלחו בארץ פלשתים סביב לבשר בית עצביהם ואת העם
    kjvRefs:
    - 1 Samuel 31:9
    kjvOsis:
    - 1Sam.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.10
    scripture: tanakh
    name: Tanakh 1 Samuel 31:10
    ref: 1 Samuel 31:10
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 10
    ordinal: 7930
    text: And they put his armour in the house of the Ashtaroth; and they fastened his body to the wall of Beth-shan.
    translation: JPS 1917
    original: וַיָּשִׂמוּ אֶת־כֵּלָיו בֵּית עַשְׁתָּרוֹת וְאֶת־גְּוִיָּתוֹ תָּקְעוּ בְּחוֹמַת בֵּית שָׁן׃
    hebrewPlain: וישמו את כליו בית עשתרות ואת גויתו תקעו בחומת בית שן
    kjvRefs:
    - 1 Samuel 31:10
    kjvOsis:
    - 1Sam.31.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.11
    scripture: tanakh
    name: Tanakh 1 Samuel 31:11
    ref: 1 Samuel 31:11
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 11
    ordinal: 7931
    text: And when the inhabitants of Jabesh-gilead heard concerning him that which the Philistines had done to Saul,
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ אֵלָיו יֹשְׁבֵי יָבֵישׁ גִּלְעָד אֵת אֲשֶׁר־עָשׂוּ פְלִשְׁתִּים לְשָׁאוּל׃
    hebrewPlain: וישמעו אליו ישבי יביש גלעד את אשר עשו פלשתים לשאול
    kjvRefs:
    - 1 Samuel 31:11
    kjvOsis:
    - 1Sam.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 1Sam.31
- type: TanakhVerse
  data:
    osis: 1Sam.31.12
    scripture: tanakh
    name: Tanakh 1 Samuel 31:12
    ref: 1 Samuel 31:12
    book: 1Sam
    section: neviim
    chapter: 31
    verse: 12
    ordinal: 7932
    text: all the valiant men arose, and went all night, and took the body of Saul and the bodies of his sons from the wall of Beth-shan; and they came to Jabesh, and burnt them there.
    translation: JPS 1917
