    ordinal: 20016
    text: The wind goeth toward the south, And turneth about unto the north; It turneth about continually in its circuit, And the wind returneth again to its circuits.
    translation: JPS 1917
    original: הוֹלֵךְ אֶל־דָּרוֹם וְסוֹבֵב אֶל־צָפוֹן סוֹבֵב סֹבֵב הוֹלֵךְ הָרוּחַ וְעַל־סְבִיבֹתָיו שָׁב הָרוּחַ׃
    hebrewPlain: הולך אל־דרום וסובב אל־צפון סובב סבב הולך הרוח ועל־סביבתיו שב הרוח
