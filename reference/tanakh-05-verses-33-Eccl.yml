- type: TanakhVerse
  data:
    osis: Eccl.1.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:9
    ref: Ecclesiastes 1:9
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 20019
    text: That which hath been is that which shall be, And that which hath been done is that which shall be done; And there is nothing new under the sun.
    translation: JPS 1917
    original: מַה־שֶּׁהָיָה הוּא שֶׁיִּהְיֶה וּמַה־שֶׁנַּעֲשָׂה הוּא שֶׁיֵּעָשֶׂה וְאֵין כָּל־חָדָשׁ תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: מה־שהיה הוא שיהיה ומה־שנעשה הוא שיעשה ואין כל־חדש תחת השמש
    kjvRefs:
    - Ecclesiastes 1:9
    kjvOsis:
    - Eccl.1.9
