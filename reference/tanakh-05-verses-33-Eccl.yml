  data:
    osis: Eccl.12.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:7
    ref: Ecclesiastes 12:7
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 7
    ordinal: 20225
    text: And the dust returneth to the earth as it was, and the spirit returneth unto God who gave it.
    translation: JPS 1917
    original: וְיָשֹׁב הֶעָפָר עַל־הָאָרֶץ כְּשֶׁהָיָה וְהָרוּחַ תָּשׁוּב אֶל־הָאֱלֹהִים אֲשֶׁר נְתָנָהּ׃
    hebrewPlain: וישב העפר על־הארץ כשהיה והרוח תשוב אל־האלהים אשר נתנה
    kjvRefs:
    - Ecclesiastes 12:7
    kjvOsis:
    - Eccl.12.7
