    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:11
    ref: Ecclesiastes 1:11
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 20021
    text: There is no remembrance of them of former times; neither shall there be any remembrance of them of latter times that are to come, among those that shall come after.
    translation: JPS 1917
    original: אֵין זִכְרוֹן לָרִאשֹׁנִים וְגַם לָאַחֲרֹנִים שֶׁיִּהְיוּ לֹא־יִהְיֶה לָהֶם זִכָּרוֹן עִם שֶׁיִּהְיוּ לָאַחֲרֹנָה׃
    hebrewPlain: אין זכרון לראשנים וגם לאחרנים שיהיו לא־יהיה להם זכרון עם שיהיו לאחרנה
    kjvRefs:
    - Ecclesiastes 1:11
    kjvOsis:
    - Eccl.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:12
    ref: Ecclesiastes 1:12
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 20022
    text: I Koheleth have been king over Israel in Jerusalem.
    translation: JPS 1917
    original: אֲנִי קֹהֶלֶת הָיִיתִי מֶלֶךְ עַל־יִשְׂרָאֵל בִּירוּשָׁלִָם׃
    hebrewPlain: אני קהלת הייתי מלך על־ישראל בירושלם
    kjvRefs:
    - Ecclesiastes 1:12
    kjvOsis:
    - Eccl.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:13
    ref: Ecclesiastes 1:13
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 20023
    text: And I applied my heart to seek and to search out by wisdom concerning all things that are done under heaven; it is a sore task that God hath given to the sons of men to be exercised therewith.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־לִבִּי לִדְרוֹשׁ וְלָתוּר בַּחָכְמָה עַל כָּל־אֲשֶׁר נַעֲשָׂה תַּחַת הַשָּׁמָיִם הוּא עִנְיַן רָע נָתַן אֱלֹהִים לִבְנֵי הָאָדָם לַעֲנוֹת בּוֹ׃
    hebrewPlain: ונתתי את־לבי לדרוש ולתור בחכמה על כל־אשר נעשה תחת השמים הוא ענין רע נתן אלהים לבני האדם לענות בו
    kjvRefs:
    - Ecclesiastes 1:13
    kjvOsis:
    - Eccl.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:14
    ref: Ecclesiastes 1:14
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 20024
    text: I have seen all the works that are done under the sun; and, behold, all is vanity and a striving after wind.
    translation: JPS 1917
    original: רָאִיתִי אֶת־כָּל־הַמַּעֲשִׂים שֶׁנַּעֲשׂוּ תַּחַת הַשָּׁמֶשׁ וְהִנֵּה הַכֹּל הֶבֶל וּרְעוּת רוּחַ׃
    hebrewPlain: ראיתי את־כל־המעשים שנעשו תחת השמש והנה הכל הבל ורעות רוח
    kjvRefs:
    - Ecclesiastes 1:14
    kjvOsis:
    - Eccl.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:15
    ref: Ecclesiastes 1:15
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 20025
    text: That which is crooked cannot be made straight; And that which is wanting cannot be numbered.
    translation: JPS 1917
    original: מְעֻוָּת לֹא־יוּכַל לִתְקֹן וְחֶסְרוֹן לֹא־יוּכַל לְהִמָּנוֹת׃
    hebrewPlain: מעות לא־יוכל לתקן וחסרון לא־יוכל להמנות
    kjvRefs:
    - Ecclesiastes 1:15
    kjvOsis:
    - Eccl.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:16
    ref: Ecclesiastes 1:16
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 20026
    text: 'I spoke with my own heart, saying: ‘Lo, I have gotten great wisdom, more also than all that were before me over Jerusalem’; yea, my heart hath had great experience of wisdom and knowledge.'
    translation: JPS 1917
    original: דִּבַּרְתִּי אֲנִי עִם־לִבִּי לֵאמֹר אֲנִי הִנֵּה הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה עַל כָּל־אֲשֶׁר־הָיָה לְפָנַי עַל־יְרוּשָׁלִָם וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת׃
    hebrewPlain: דברתי אני עם־לבי לאמר אני הנה הגדלתי והוספתי חכמה על כל־אשר־היה לפני על־ירושלם ולבי ראה הרבה חכמה ודעת
    kjvRefs:
    - Ecclesiastes 1:16
    kjvOsis:
    - Eccl.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:17
    ref: Ecclesiastes 1:17
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 20027
    text: And I applied my heart to know wisdom, and to know madness and folly—I perceived that this also was a striving after wind.
    translation: JPS 1917
    original: וָאֶתְּנָה לִבִּי לָדַעַת חָכְמָה וְדַעַת הוֹלֵלוֹת וְשִׂכְלוּת יָדַעְתִּי שֶׁגַּם־זֶה הוּא רַעְיוֹן רוּחַ׃
    hebrewPlain: ואתנה לבי לדעת חכמה ודעת הוללות ושכלות ידעתי שגם־זה הוא רעיון רוח
    kjvRefs:
    - Ecclesiastes 1:17
    kjvOsis:
    - Eccl.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:18
    ref: Ecclesiastes 1:18
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 20028
    text: For in much wisdom is much vexation; And he that increaseth knowledge increaseth sorrow.
    translation: JPS 1917
    original: כִּי בְּרֹב חָכְמָה רָב־כָּעַס וְיוֹסִיף דַּעַת יוֹסִיף מַכְאוֹב׃
    hebrewPlain: כי ברב חכמה רב־כעס ויוסיף דעת יוסיף מכאוב
    kjvRefs:
    - Ecclesiastes 1:18
    kjvOsis:
    - Eccl.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.2.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:1
    ref: Ecclesiastes 2:1
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 20029
    text: 'I said in my heart: ‘Come now, I will try thee with mirth, and enjoy pleasure’; and, behold, this also was vanity.'
    translation: JPS 1917
    original: אָמַרְתִּי אֲנִי בְּלִבִּי לְכָה־נָּא אֲנַסְּכָה בְשִׂמְחָה וּרְאֵה בְטוֹב וְהִנֵּה גַם־הוּא הָבֶל׃
    hebrewPlain: אמרתי אני בלבי לכה־נא אנסכה בשמחה וראה בטוב והנה גם־הוא הבל
    kjvRefs:
    - Ecclesiastes 2:1
    kjvOsis:
    - Eccl.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:2
    ref: Ecclesiastes 2:2
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 20030
    text: 'I said of laughter: ‘It is mad’; and of mirth: ‘What doth it accomplish?’'
    translation: JPS 1917
    original: לִשְׂחוֹק אָמַרְתִּי מְהוֹלָל וּלְשִׂמְחָה מַה־זֹּה עֹשָׂה׃
    hebrewPlain: לשחוק אמרתי מהולל ולשמחה מה־זה עשה
    kjvRefs:
    - Ecclesiastes 2:2
    kjvOsis:
    - Eccl.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:3
    ref: Ecclesiastes 2:3
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 20031
    text: I searched in my heart how to pamper my flesh with wine, and, my heart conducting itself with wisdom, how yet to lay hold on folly, till I might see which it was best for the sons of men that they should do under the heaven the few days of their life.
    translation: JPS 1917
    original: תַּרְתִּי בְלִבִּי לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי וְלִבִּי נֹהֵג בַּחָכְמָה וְלֶאֱחֹז בְּסִכְלוּת עַד אֲשֶׁר־אֶרְאֶה אֵי־זֶה טוֹב לִבְנֵי הָאָדָם אֲשֶׁר יַעֲשׂוּ תַּחַת הַשָּׁמַיִם מִסְפַּר יְמֵי חַיֵּיהֶם׃
    hebrewPlain: תרתי בלבי למשוך ביין את־בשרי ולבי נהג בחכמה ולאחז בסכלות עד אשר־אראה אי־זה טוב לבני האדם אשר יעשו תחת השמים מספר ימי חייהם
    kjvRefs:
    - Ecclesiastes 2:3
    kjvOsis:
    - Eccl.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:4
    ref: Ecclesiastes 2:4
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 20032
    text: I made me great works; I builded me houses; I planted me vineyards;
    translation: JPS 1917
    original: הִגְדַּלְתִּי מַעֲשָׂי בָּנִיתִי לִי בָּתִּים נָטַעְתִּי לִי כְּרָמִים׃
    hebrewPlain: הגדלתי מעשי בניתי לי בתים נטעתי לי כרמים
    kjvRefs:
    - Ecclesiastes 2:4
    kjvOsis:
    - Eccl.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:5
    ref: Ecclesiastes 2:5
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 20033
    text: I made me gardens and parks, and I planted trees in them of all kinds of fruit;
    translation: JPS 1917
    original: עָשִׂיתִי לִי גַּנּוֹת וּפַרְדֵּסִים וְנָטַעְתִּי בָהֶם עֵץ כָּל־פֶּרִי׃
    hebrewPlain: עשיתי לי גנות ופרדסים ונטעתי בהם עץ כל־פרי
    kjvRefs:
    - Ecclesiastes 2:5
    kjvOsis:
    - Eccl.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:6
    ref: Ecclesiastes 2:6
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 20034
    text: I made me pools of water, to water therefrom the wood springing up with trees;
    translation: JPS 1917
    original: עָשִׂיתִי לִי בְּרֵכוֹת מָיִם לְהַשְׁקוֹת מֵהֶם יַעַר צוֹמֵחַ עֵצִים׃
    hebrewPlain: עשיתי לי ברכות מים להשקות מהם יער צומח עצים
    kjvRefs:
    - Ecclesiastes 2:6
    kjvOsis:
    - Eccl.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:7
    ref: Ecclesiastes 2:7
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 20035
    text: I acquired men-servants and maid-servants, and had servants born in my house; also I had great possessions of herds and flocks, above all that were before me in Jerusalem;
    translation: JPS 1917
    original: קָנִיתִי עֲבָדִים וּשְׁפָחוֹת וּבְנֵי־בַיִת הָיָה לִי גַּם מִקְנֶה בָקָר וָצֹאן הַרְבֵּה הָיָה לִי מִכֹּל שֶׁהָיוּ לְפָנַי בִּירוּשָׁלִָם׃
    hebrewPlain: קניתי עבדים ושפחות ובני־בית היה לי גם מקנה בקר וצאן הרבה היה לי מכל שהיו לפני בירושלם
    kjvRefs:
    - Ecclesiastes 2:7
    kjvOsis:
    - Eccl.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:8
    ref: Ecclesiastes 2:8
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 20036
    text: I gathered me also silver and gold, and treasure such as kings and the provinces have as their own; I got me men-singers and women-singers, and the delights of the sons of men, women very many.
    translation: JPS 1917
    original: כָּנַסְתִּי לִי גַּם־כֶּסֶף וְזָהָב וּסְגֻלַּת מְלָכִים וְהַמְּדִינוֹת עָשִׂיתִי לִי שָׁרִים וְשָׁרוֹת וְתַעֲנוּגֹת בְּנֵי הָאָדָם שִׁדָּה וְשִׁדּוֹת׃
    hebrewPlain: כנסתי לי גם־כסף וזהב וסגלת מלכים והמדינות עשיתי לי שרים ושרות ותענוגת בני האדם שדה ושדות
    kjvRefs:
    - Ecclesiastes 2:8
    kjvOsis:
    - Eccl.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:9
    ref: Ecclesiastes 2:9
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 20037
    text: So I was great, and increased more than all that were before me in Jerusalem; also my wisdom stood me in stead.
    translation: JPS 1917
    original: וְגָדַלְתִּי וְהוֹסַפְתִּי מִכֹּל שֶׁהָיָה לְפָנַי בִּירוּשָׁלִָם אַף חָכְמָתִי עָמְדָה לִּי׃
    hebrewPlain: וגדלתי והוספתי מכל שהיה לפני בירושלם אף חכמתי עמדה לי
    kjvRefs:
    - Ecclesiastes 2:9
    kjvOsis:
    - Eccl.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:10
    ref: Ecclesiastes 2:10
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 20038
    text: And whatsoever mine eyes desired I kept not from them; I withheld not my heart from any joy, for my heart had joy of all my labour; and this was my portion from all my labour.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר שָׁאֲלוּ עֵינַי לֹא אָצַלְתִּי מֵהֶם לֹא־מָנַעְתִּי אֶת־לִבִּי מִכָּל־שִׂמְחָה כִּי־לִבִּי שָׂמֵחַ מִכָּל־עֲמָלִי וְזֶה־הָיָה חֶלְקִי מִכָּל־עֲמָלִי׃
    hebrewPlain: וכל אשר שאלו עיני לא אצלתי מהם לא־מנעתי את־לבי מכל־שמחה כי־לבי שמח מכל־עמלי וזה־היה חלקי מכל־עמלי
    kjvRefs:
    - Ecclesiastes 2:10
    kjvOsis:
    - Eccl.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:11
    ref: Ecclesiastes 2:11
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 20039
    text: Then I looked on all the works that my hands had wrought, and on the labour that I had laboured to do; and, behold, all was vanity and a striving after wind, and there was no profit under the sun.
    translation: JPS 1917
    original: וּפָנִיתִי אֲנִי בְּכָל־מַעֲשַׂי שֶׁעָשׂוּ יָדַי וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת וְהִנֵּה הַכֹּל הֶבֶל וּרְעוּת רוּחַ וְאֵין יִתְרוֹן תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: ופניתי אני בכל־מעשי שעשו ידי ובעמל שעמלתי לעשות והנה הכל הבל ורעות רוח ואין יתרון תחת השמש
    kjvRefs:
    - Ecclesiastes 2:11
    kjvOsis:
    - Eccl.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:12
    ref: Ecclesiastes 2:12
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 20040
    text: And I turned myself to behold wisdom, and madness and folly; for what can the man do that cometh after the king? even that which hath been already done.
    translation: JPS 1917
    original: וּפָנִיתִי אֲנִי לִרְאוֹת חָכְמָה וְהוֹלֵלוֹת וְסִכְלוּת כִּי מֶה הָאָדָם שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ אֵת אֲשֶׁר־כְּבָר עָשׂוּהוּ׃
    hebrewPlain: ופניתי אני לראות חכמה והוללות וסכלות כי מה האדם שיבוא אחרי המלך את אשר־כבר עשוהו
    kjvRefs:
    - Ecclesiastes 2:12
    kjvOsis:
    - Eccl.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:13
    ref: Ecclesiastes 2:13
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 20041
    text: Then I saw that wisdom excelleth folly, as far as light excelleth darkness.
    translation: JPS 1917
    original: וְרָאִיתִי אָנִי שֶׁיֵּשׁ יִתְרוֹן לַחָכְמָה מִן־הַסִּכְלוּת כִּיתְרוֹן הָאוֹר מִן־הַחֹשֶׁךְ׃
    hebrewPlain: וראיתי אני שיש יתרון לחכמה מן־הסכלות כיתרון האור מן־החשך
    kjvRefs:
    - Ecclesiastes 2:13
    kjvOsis:
    - Eccl.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:14
    ref: Ecclesiastes 2:14
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 20042
    text: The wise man, his eyes are in his head; But the fool walketh in darkness. And I also perceived that one event happeneth to them all.
    translation: JPS 1917
    original: הֶחָכָם עֵינָיו בְּרֹאשׁוֹ וְהַכְּסִיל בַּחֹשֶׁךְ הוֹלֵךְ וְיָדַעְתִּי גַם־אָנִי שֶׁמִּקְרֶה אֶחָד יִקְרֶה אֶת־כֻּלָּם׃
    hebrewPlain: החכם עיניו בראשו והכסיל בחשך הולך וידעתי גם־אני שמקרה אחד יקרה את־כלם
    kjvRefs:
    - Ecclesiastes 2:14
    kjvOsis:
    - Eccl.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:15
    ref: Ecclesiastes 2:15
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 20043
    text: 'Then said I in my heart: ‘As it happeneth to the fool, so will it happen even to me; and why was I then more wise?’ Then I said in my heart, that this also is vanity.'
    translation: JPS 1917
    original: וְאָמַרְתִּי אֲנִי בְּלִבִּי כְּמִקְרֵה הַכְּסִיל גַּם־אֲנִי יִקְרֵנִי וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר וְדִבַּרְתִּי בְלִבִּי שֶׁגַּם־זֶה הָבֶל׃
    hebrewPlain: ואמרתי אני בלבי כמקרה הכסיל גם־אני יקרני ולמה חכמתי אני אז יותר ודברתי בלבי שגם־זה הבל
    kjvRefs:
    - Ecclesiastes 2:15
    kjvOsis:
    - Eccl.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:16
    ref: Ecclesiastes 2:16
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 20044
    text: For of the wise man, even as of the fool, there is no remembrance for ever; seeing that in the days to come all will long ago have been forgotten. And how must the wise man die even as the fool!
    translation: JPS 1917
    original: כִּי אֵין זִכְרוֹן לֶחָכָם עִם־הַכְּסִיל לְעוֹלָם בְּשֶׁכְּבָר הַיָּמִים הַבָּאִים הַכֹּל נִשְׁכָּח וְאֵיךְ יָמוּת הֶחָכָם עִם־הַכְּסִיל׃
    hebrewPlain: כי אין זכרון לחכם עם־הכסיל לעולם בשכבר הימים הבאים הכל נשכח ואיך ימות החכם עם־הכסיל
    kjvRefs:
    - Ecclesiastes 2:16
    kjvOsis:
    - Eccl.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:17
    ref: Ecclesiastes 2:17
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 20045
    text: So I hated life; because the work that is wrought under the sun was grievous unto me; for all is vanity and a striving after wind.
    translation: JPS 1917
    original: וְשָׂנֵאתִי אֶת־הַחַיִּים כִּי רַע עָלַי הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה תַּחַת הַשָּׁמֶשׁ כִּי־הַכֹּל הֶבֶל וּרְעוּת רוּחַ׃
    hebrewPlain: ושנאתי את־החיים כי רע עלי המעשה שנעשה תחת השמש כי־הכל הבל ורעות רוח
    kjvRefs:
    - Ecclesiastes 2:17
    kjvOsis:
    - Eccl.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:18
    ref: Ecclesiastes 2:18
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 20046
    text: And I hated all my labour wherein I laboured under the sun, seeing that I must leave it unto the man that shall be after me.
    translation: JPS 1917
    original: וְשָׂנֵאתִי אֲנִי אֶת־כָּל־עֲמָלִי שֶׁאֲנִי עָמֵל תַּחַת הַשָּׁמֶשׁ שֶׁאַנִּיחֶנּוּ לָאָדָם שֶׁיִּהְיֶה אַחֲרָי׃
    hebrewPlain: ושנאתי אני את־כל־עמלי שאני עמל תחת השמש שאניחנו לאדם שיהיה אחרי
    kjvRefs:
    - Ecclesiastes 2:18
    kjvOsis:
    - Eccl.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.19
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:19
    ref: Ecclesiastes 2:19
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 20047
    text: And who knoweth whether he will be a wise man or a fool? yet will he have rule over all my labour wherein I have laboured, and wherein I have shown myself wise under the sun. This also is vanity.
    translation: JPS 1917
    original: וּמִי יוֹדֵעַ הֶחָכָם יִהְיֶה אוֹ סָכָל וְיִשְׁלַט בְּכָל־עֲמָלִי שֶׁעָמַלְתִּי וְשֶׁחָכַמְתִּי תַּחַת הַשָּׁמֶשׁ גַּם־זֶה הָבֶל׃
    hebrewPlain: ומי יודע החכם יהיה או סכל וישלט בכל־עמלי שעמלתי ושחכמתי תחת השמש גם־זה הבל
    kjvRefs:
    - Ecclesiastes 2:19
    kjvOsis:
    - Eccl.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.20
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:20
    ref: Ecclesiastes 2:20
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 20048
    text: Therefore I turned about to cause my heart to despair concerning all the labour wherein I had laboured under the sun.
    translation: JPS 1917
    original: וְסַבּוֹתִי אֲנִי לְיַאֵשׁ אֶת־לִבִּי עַל כָּל־הֶעָמָל שֶׁעָמַלְתִּי תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: וסבותי אני ליאש את־לבי על כל־העמל שעמלתי תחת השמש
    kjvRefs:
    - Ecclesiastes 2:20
    kjvOsis:
    - Eccl.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.21
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:21
    ref: Ecclesiastes 2:21
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 20049
    text: For there is a man whose labour is with wisdom, and with knowledge, and with skill; yet to a man that hath not laboured therein shall he leave it for his portion. This also is vanity and a great evil.
    translation: JPS 1917
    original: כִּי־יֵשׁ אָדָם שֶׁעֲמָלוֹ בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן וּלְאָדָם שֶׁלֹּא עָמַל־בּוֹ יִתְּנֶנּוּ חֶלְקוֹ גַּם־זֶה הֶבֶל וְרָעָה רַבָּה׃
    hebrewPlain: כי־יש אדם שעמלו בחכמה ובדעת ובכשרון ולאדם שלא עמל־בו יתננו חלקו גם־זה הבל ורעה רבה
    kjvRefs:
    - Ecclesiastes 2:21
    kjvOsis:
    - Eccl.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.22
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:22
    ref: Ecclesiastes 2:22
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 20050
    text: For what hath a man of all his labour, and of the striving of his heart, wherein he laboureth under the sun?
    translation: JPS 1917
    original: כִּי מֶה־הֹוֶה לָאָדָם בְּכָל־עֲמָלוֹ וּבְרַעְיוֹן לִבּוֹ שֶׁהוּא עָמֵל תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: כי מה־הוה לאדם בכל־עמלו וברעיון לבו שהוא עמל תחת השמש
    kjvRefs:
    - Ecclesiastes 2:22
    kjvOsis:
    - Eccl.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.23
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:23
    ref: Ecclesiastes 2:23
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 23
    ordinal: 20051
    text: For all his days are pains, and his occupation vexation; yea, even in the night his heart taketh not rest. This also is vanity.
    translation: JPS 1917
    original: כִּי כָל־יָמָיו מַכְאֹבִים וָכַעַס עִנְיָנוֹ גַּם־בַּלַּיְלָה לֹא־שָׁכַב לִבּו גַּם־זֶה הֶבֶל הוּא׃
    hebrewPlain: כי כל־ימיו מכאבים וכעס ענינו גם־בלילה לא־שכב לבו גם־זה הבל הוא
    kjvRefs:
    - Ecclesiastes 2:23
    kjvOsis:
    - Eccl.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.24
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:24
    ref: Ecclesiastes 2:24
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 24
    ordinal: 20052
    text: There is nothing better for a man than that he should eat and drink, and make his soul enjoy pleasure for his labour. This also I saw, that it is from the hand of God.
    translation: JPS 1917
    original: אֵין־טוֹב בָּאָדָם שֶׁיֹּאכַל וְשָׁתָה וְהֶרְאָה אֶת־נַפְשׁוֹ טוֹב בַּעֲמָלוֹ גַּם־זֹה רָאִיתִי אָנִי כִּי מִיַּד הָאֱלֹהִים הִיא׃
    hebrewPlain: אין־טוב באדם שיאכל ושתה והראה את־נפשו טוב בעמלו גם־זה ראיתי אני כי מיד האלהים היא
    kjvRefs:
    - Ecclesiastes 2:24
    kjvOsis:
    - Eccl.2.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.25
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:25
    ref: Ecclesiastes 2:25
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 25
    ordinal: 20053
    text: For who will eat, or who will enjoy, if not I?
    translation: JPS 1917
    original: כִּי מִי יֹאכַל וּמִי יָחוּשׁ חוּץ מִמֶּנִּי׃
    hebrewPlain: כי מי יאכל ומי יחוש חוץ ממני
    kjvRefs:
    - Ecclesiastes 2:25
    kjvOsis:
    - Eccl.2.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.2.26
    scripture: tanakh
    name: Tanakh Ecclesiastes 2:26
    ref: Ecclesiastes 2:26
    book: Eccl
    section: ketuvim
    chapter: 2
    verse: 26
    ordinal: 20054
    text: For to the man that is good in His sight He giveth wisdom, and knowledge, and joy; but to the sinner He giveth the task, to gather and to heap up, that he may leave to him that is good in the sight of God. This also is vanity and a striving after wind.
    translation: JPS 1917
    original: כִּי לְאָדָם שֶׁטּוֹב לְפָנָיו נָתַן חָכְמָה וְדַעַת וְשִׂמְחָה וְלַחוֹטֶא נָתַן עִנְיָן לֶאֱסוֹף וְלִכְנוֹס לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים גַּם־זֶה הֶבֶל וּרְעוּת רוּחַ׃
    hebrewPlain: כי לאדם שטוב לפניו נתן חכמה ודעת ושמחה ולחוטא נתן ענין לאסוף ולכנוס לתת לטוב לפני האלהים גם־זה הבל ורעות רוח
    kjvRefs:
    - Ecclesiastes 2:26
    kjvOsis:
    - Eccl.2.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.2
- type: TanakhVerse
  data:
    osis: Eccl.3.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:1
    ref: Ecclesiastes 3:1
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 20055
    text: 'To every thing there is a season, and a time to every purpose under the heaven:'
    translation: JPS 1917
    original: לַכֹּל זְמָן וְעֵת לְכָל־חֵפֶץ תַּחַת הַשָּׁמָיִם׃
    hebrewPlain: לכל זמן ועת לכל־חפץ תחת השמים
    kjvRefs:
    - Ecclesiastes 3:1
    kjvOsis:
    - Eccl.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:2
    ref: Ecclesiastes 3:2
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 20056
    text: A time to be born, and a time to die; A time to plant, and a time to pluck up that which is planted;
    translation: JPS 1917
    original: עֵת לָלֶדֶת וְעֵת לָמוּת עֵת לָטַעַת וְעֵת לַעֲקוֹר נָטוּעַ׃
    hebrewPlain: עת ללדת ועת למות עת לטעת ועת לעקור נטוע
    kjvRefs:
    - Ecclesiastes 3:2
    kjvOsis:
    - Eccl.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:3
    ref: Ecclesiastes 3:3
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 20057
    text: A time to kill, and a time to heal; A time to break down, and a time to build up;
    translation: JPS 1917
    original: עֵת לַהֲרוֹג וְעֵת לִרְפּוֹא עֵת לִפְרוֹץ וְעֵת לִבְנוֹת׃
    hebrewPlain: עת להרוג ועת לרפוא עת לפרוץ ועת לבנות
    kjvRefs:
    - Ecclesiastes 3:3
    kjvOsis:
    - Eccl.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:4
    ref: Ecclesiastes 3:4
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 20058
    text: A time to weep, and a time to laugh; A time to mourn, and a time to dance;
    translation: JPS 1917
    original: עֵת לִבְכּוֹת וְעֵת לִשְׂחוֹק עֵת סְפוֹד וְעֵת רְקוֹד׃
    hebrewPlain: עת לבכות ועת לשחוק עת ספוד ועת רקוד
    kjvRefs:
    - Ecclesiastes 3:4
    kjvOsis:
    - Eccl.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:5
    ref: Ecclesiastes 3:5
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 20059
    text: A time to cast away stones, and a time to gather stones together; A time to embrace, and a time to refrain from embracing;
    translation: JPS 1917
    original: עֵת לְהַשְׁלִיךְ אֲבָנִים וְעֵת כְּנוֹס אֲבָנִים עֵת לַחֲבוֹק וְעֵת לִרְחֹק מֵחַבֵּק׃
    hebrewPlain: עת להשליך אבנים ועת כנוס אבנים עת לחבוק ועת לרחק מחבק
    kjvRefs:
    - Ecclesiastes 3:5
    kjvOsis:
    - Eccl.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:6
    ref: Ecclesiastes 3:6
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 20060
    text: A time to seek, and a time to lose; A time to keep, and a time to cast away;
    translation: JPS 1917
    original: עֵת לְבַקֵּשׁ וְעֵת לְאַבֵּד עֵת לִשְׁמוֹר וְעֵת לְהַשְׁלִיךְ׃
    hebrewPlain: עת לבקש ועת לאבד עת לשמור ועת להשליך
    kjvRefs:
    - Ecclesiastes 3:6
    kjvOsis:
    - Eccl.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:7
    ref: Ecclesiastes 3:7
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 20061
    text: A time to rend, and a time to sew; A time to keep silence, and a time to speak;
    translation: JPS 1917
    original: עֵת לִקְרוֹעַ וְעֵת לִתְפּוֹר עֵת לַחֲשׁוֹת וְעֵת לְדַבֵּר׃
    hebrewPlain: עת לקרוע ועת לתפור עת לחשות ועת לדבר
    kjvRefs:
    - Ecclesiastes 3:7
    kjvOsis:
    - Eccl.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:8
    ref: Ecclesiastes 3:8
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 20062
    text: A time to love, and a time to hate; A time for war, and a time for peace.
    translation: JPS 1917
    original: עֵת לֶאֱהֹב וְעֵת לִשְׂנֹא עֵת מִלְחָמָה וְעֵת שָׁלוֹם׃
    hebrewPlain: עת לאהב ועת לשנא עת מלחמה ועת שלום
    kjvRefs:
    - Ecclesiastes 3:8
    kjvOsis:
    - Eccl.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:9
    ref: Ecclesiastes 3:9
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 20063
    text: What profit hath he that worketh in that he laboureth?
    translation: JPS 1917
    original: מַה־יִּתְרוֹן הָעוֹשֶׂה בַּאֲשֶׁר הוּא עָמֵל׃
    hebrewPlain: מה־יתרון העושה באשר הוא עמל
    kjvRefs:
    - Ecclesiastes 3:9
    kjvOsis:
    - Eccl.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:10
    ref: Ecclesiastes 3:10
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 20064
    text: I have seen the task which God hath given to the sons of men to be exercised therewith.
    translation: JPS 1917
    original: רָאִיתִי אֶת־הָעִנְיָן אֲשֶׁר נָתַן אֱלֹהִים לִבְנֵי הָאָדָם לַעֲנוֹת בּוֹ׃
    hebrewPlain: ראיתי את־הענין אשר נתן אלהים לבני האדם לענות בו
    kjvRefs:
    - Ecclesiastes 3:10
    kjvOsis:
    - Eccl.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:11
    ref: Ecclesiastes 3:11
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 20065
    text: He hath made every thing beautiful in its time; also He hath set the world in their heart, yet so that man cannot find out the work that God hath done from the beginning even to the end.
    translation: JPS 1917
    original: אֶת־הַכֹּל עָשָׂה יָפֶה בְעִתּוֹ גַּם אֶת־הָעֹלָם נָתַן בְּלִבָּם מִבְּלִי אֲשֶׁר לֹא־יִמְצָא הָאָדָם אֶת־הַמַּעֲשֶׂה אֲשֶׁר־עָשָׂה הָאֱלֹהִים מֵרֹאשׁ וְעַד־סוֹף׃
    hebrewPlain: את־הכל עשה יפה בעתו גם את־העלם נתן בלבם מבלי אשר לא־ימצא האדם את־המעשה אשר־עשה האלהים מראש ועד־סוף
    kjvRefs:
    - Ecclesiastes 3:11
    kjvOsis:
    - Eccl.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:12
    ref: Ecclesiastes 3:12
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 20066
    text: I know that there is nothing better for them, than to rejoice, and to get pleasure so long as they live.
    translation: JPS 1917
    original: יָדַעְתִּי כִּי אֵין טוֹב בָּם כִּי אִם־לִשְׂמוֹחַ וְלַעֲשׂוֹת טוֹב בְּחַיָּיו׃
    hebrewPlain: ידעתי כי אין טוב בם כי אם־לשמוח ולעשות טוב בחייו
    kjvRefs:
    - Ecclesiastes 3:12
    kjvOsis:
    - Eccl.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:13
    ref: Ecclesiastes 3:13
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 20067
    text: But also that every man should eat and drink, and enjoy pleasure for all his labour, is the gift of God.
    translation: JPS 1917
    original: וְגַם כָּל־הָאָדָם שֶׁיֹּאכַל וְשָׁתָה וְרָאָה טוֹב בְּכָל־עֲמָלוֹ מַתַּת אֱלֹהִים הִיא׃
    hebrewPlain: וגם כל־האדם שיאכל ושתה וראה טוב בכל־עמלו מתת אלהים היא
    kjvRefs:
    - Ecclesiastes 3:13
    kjvOsis:
    - Eccl.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:14
    ref: Ecclesiastes 3:14
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 20068
    text: I know that, whatsoever God doeth, it shall be for ever; nothing can be added to it, nor any thing taken from it; and God hath so made it, that men should fear before Him.
    translation: JPS 1917
    original: יָדַעְתִּי כִּי כָּל־אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים הוּא יִהְיֶה לְעוֹלָם עָלָיו אֵין לְהוֹסִיף וּמִמֶּנּוּ אֵין לִגְרֹעַ וְהָאֱלֹהִים עָשָׂה שֶׁיִּרְאוּ מִלְּפָנָיו׃
    hebrewPlain: ידעתי כי כל־אשר יעשה האלהים הוא יהיה לעולם עליו אין להוסיף וממנו אין לגרע והאלהים עשה שיראו מלפניו
    kjvRefs:
    - Ecclesiastes 3:14
    kjvOsis:
    - Eccl.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:15
    ref: Ecclesiastes 3:15
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 20069
    text: That which is hath been long ago, and that which is to be hath already been; and God seeketh that which is pursued.
    translation: JPS 1917
    original: מַה־שֶּׁהָיָה כְּבָר הוּא וַאֲשֶׁר לִהְיוֹת כְּבָר הָיָה וְהָאֱלֹהִים יְבַקֵּשׁ אֶת־נִרְדָּף׃
    hebrewPlain: מה־שהיה כבר הוא ואשר להיות כבר היה והאלהים יבקש את־נרדף
    kjvRefs:
    - Ecclesiastes 3:15
    kjvOsis:
    - Eccl.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:16
    ref: Ecclesiastes 3:16
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 20070
    text: And moreover I saw under the sun, in the place of justice, that wickedness was there; and in the place of righteousness, that wickedness was there.
    translation: JPS 1917
    original: וְעוֹד רָאִיתִי תַּחַת הַשָּׁמֶשׁ מְקוֹם הַמִּשְׁפָּט שָׁמָּה הָרֶשַׁע וּמְקוֹם הַצֶּדֶק שָׁמָּה הָרָשַׁע׃
    hebrewPlain: ועוד ראיתי תחת השמש מקום המשפט שמה הרשע ומקום הצדק שמה הרשע
    kjvRefs:
    - Ecclesiastes 3:16
    kjvOsis:
    - Eccl.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:17
    ref: Ecclesiastes 3:17
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 20071
    text: 'I said in my heart: ‘The righteous and the wicked God will judge; for there is a time there for every purpose and for every work.’'
    translation: JPS 1917
    original: אָמַרְתִּי אֲנִי בְּלִבִּי אֶת־הַצַּדִּיק וְאֶת־הָרָשָׁע יִשְׁפֹּט הָאֱלֹהִים כִּי־עֵת לְכָל־חֵפֶץ וְעַל כָּל־הַמַּעֲשֶׂה שָׁם׃
    hebrewPlain: אמרתי אני בלבי את־הצדיק ואת־הרשע ישפט האלהים כי־עת לכל־חפץ ועל כל־המעשה שם
    kjvRefs:
    - Ecclesiastes 3:17
    kjvOsis:
    - Eccl.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:18
    ref: Ecclesiastes 3:18
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 20072
    text: 'I said in my heart: ‘It is because of the sons of men, that God may sift them, and that they may see that they themselves are but as beasts.’'
    translation: JPS 1917
    original: אָמַרְתִּי אֲנִי בְּלִבִּי עַל־דִּבְרַת בְּנֵי הָאָדָם לְבָרָם הָאֱלֹהִים וְלִרְאוֹת שְׁהֶם־בְּהֵמָה הֵמָּה לָהֶם׃
    hebrewPlain: אמרתי אני בלבי על־דברת בני האדם לברם האלהים ולראות שהם־בהמה המה להם
    kjvRefs:
    - Ecclesiastes 3:18
    kjvOsis:
    - Eccl.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.19
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:19
    ref: Ecclesiastes 3:19
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 19
    ordinal: 20073
    text: For that which befalleth the sons of men befalleth beasts; even one thing befalleth them; as the one dieth, so dieth the other; yea, they have all one breath; so that man hath no pre-eminence above a beast; for all is vanity.
    translation: JPS 1917
    original: כִּי מִקְרֶה בְנֵי־הָאָדָם וּמִקְרֶה הַבְּהֵמָה וּמִקְרֶה אֶחָד לָהֶם כְּמוֹת זֶה כֵּן מוֹת זֶה וְרוּחַ אֶחָד לַכֹּל וּמוֹתַר הָאָדָם מִן־הַבְּהֵמָה אָיִן כִּי הַכֹּל הָבֶל׃
    hebrewPlain: כי מקרה בני־האדם ומקרה הבהמה ומקרה אחד להם כמות זה כן מות זה ורוח אחד לכל ומותר האדם מן־הבהמה אין כי הכל הבל
    kjvRefs:
    - Ecclesiastes 3:19
    kjvOsis:
    - Eccl.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.20
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:20
    ref: Ecclesiastes 3:20
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 20
    ordinal: 20074
    text: All go unto one place; all are of the dust, and all return to dust.
    translation: JPS 1917
    original: הַכֹּל הוֹלֵךְ אֶל־מָקוֹם אֶחָד הַכֹּל הָיָה מִן־הֶעָפָר וְהַכֹּל שָׁב אֶל־הֶעָפָר׃
    hebrewPlain: הכל הולך אל־מקום אחד הכל היה מן־העפר והכל שב אל־העפר
    kjvRefs:
    - Ecclesiastes 3:20
    kjvOsis:
    - Eccl.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.21
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:21
    ref: Ecclesiastes 3:21
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 21
    ordinal: 20075
    text: Who knoweth the spirit of man whether it goeth upward, and the spirit of the beast whether it goeth downward to the earth?
    translation: JPS 1917
    original: מִי יוֹדֵעַ רוּחַ בְּנֵי הָאָדָם הָעֹלָה הִיא לְמָעְלָה וְרוּחַ הַבְּהֵמָה הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ׃
    hebrewPlain: מי יודע רוח בני האדם העלה היא למעלה ורוח הבהמה הירדת היא למטה לארץ
    kjvRefs:
    - Ecclesiastes 3:21
    kjvOsis:
    - Eccl.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.3.22
    scripture: tanakh
    name: Tanakh Ecclesiastes 3:22
    ref: Ecclesiastes 3:22
    book: Eccl
    section: ketuvim
    chapter: 3
    verse: 22
    ordinal: 20076
    text: Wherefore I perceived that there is nothing better, than that a man should rejoice in his works; for that is his portion; for who shall bring him to see what shall be after him?
    translation: JPS 1917
    original: וְרָאִיתִי כִּי אֵין טוֹב מֵאֲשֶׁר יִשְׂמַח הָאָדָם בְּמַעֲשָׂיו כִּי־הוּא חֶלְקוֹ כִּי מִי יְבִיאֶנּוּ לִרְאוֹת בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו׃
    hebrewPlain: וראיתי כי אין טוב מאשר ישמח האדם במעשיו כי־הוא חלקו כי מי יביאנו לראות במה שיהיה אחריו
    kjvRefs:
    - Ecclesiastes 3:22
    kjvOsis:
    - Eccl.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.3
- type: TanakhVerse
  data:
    osis: Eccl.4.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:1
    ref: Ecclesiastes 4:1
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 20077
    text: But I returned and considered all the oppressions that are done under the sun; and behold the tears of such as were oppressed, and they had no comforter; and on the side of their oppressors there was power, but they had no comforter.
    translation: JPS 1917
    original: וְשַׁבְתִּי אֲנִי וָאֶרְאֶה אֶת־כָּל־הָעֲשֻׁקִים אֲשֶׁר נַעֲשִׂים תַּחַת הַשָּׁמֶשׁ וְהִנֵּה דִּמְעַת הָעֲשֻׁקִים וְאֵין לָהֶם מְנַחֵם וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ וְאֵין לָהֶם מְנַחֵם׃
    hebrewPlain: ושבתי אני ואראה את־כל־העשקים אשר נעשים תחת השמש והנה דמעת העשקים ואין להם מנחם ומיד עשקיהם כח ואין להם מנחם
    kjvRefs:
    - Ecclesiastes 4:1
    kjvOsis:
    - Eccl.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:2
    ref: Ecclesiastes 4:2
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 20078
    text: Wherefore I praised the dead that are already dead more than the living that are yet alive;
    translation: JPS 1917
    original: וְשַׁבֵּחַ אֲנִי אֶת־הַמֵּתִים שֶׁכְּבָר מֵתוּ מִן־הַחַיִּים אֲשֶׁר הֵמָּה חַיִּים עֲדֶנָה׃
    hebrewPlain: ושבח אני את־המתים שכבר מתו מן־החיים אשר המה חיים עדנה
    kjvRefs:
    - Ecclesiastes 4:2
    kjvOsis:
    - Eccl.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:3
    ref: Ecclesiastes 4:3
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 20079
    text: but better than they both is he that hath not yet been, who hath not seen the evil work that is done under the sun.
    translation: JPS 1917
    original: וְטוֹב מִשְּׁנֵיהֶם אֵת אֲשֶׁר־עֲדֶן לֹא הָיָה אֲשֶׁר לֹא־רָאָה אֶת־הַמַּעֲשֶׂה הָרָע אֲשֶׁר נַעֲשָׂה תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: וטוב משניהם את אשר־עדן לא היה אשר לא־ראה את־המעשה הרע אשר נעשה תחת השמש
    kjvRefs:
    - Ecclesiastes 4:3
    kjvOsis:
    - Eccl.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:4
    ref: Ecclesiastes 4:4
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 20080
    text: Again, I considered all labour and all excelling in work, that it is a man’s rivalry with his neighbour. This also is vanity and a striving after wind.
    translation: JPS 1917
    original: וְרָאִיתִי אֲנִי אֶת־כָּל־עָמָל וְאֵת כָּל־כִּשְׁרוֹן הַמַּעֲשֶׂה כִּי הִיא קִנְאַת־אִישׁ מֵרֵעֵהוּ גַּם־זֶה הֶבֶל וּרְעוּת רוּחַ׃
    hebrewPlain: וראיתי אני את־כל־עמל ואת כל־כשרון המעשה כי היא קנאת־איש מרעהו גם־זה הבל ורעות רוח
    kjvRefs:
    - Ecclesiastes 4:4
    kjvOsis:
    - Eccl.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:5
    ref: Ecclesiastes 4:5
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 20081
    text: The fool foldeth his hands together, And eateth his own flesh.
    translation: JPS 1917
    original: הַכְּסִיל חֹבֵק אֶת־יָדָיו וְאֹכֵל אֶת־בְּשָׂרוֹ׃
    hebrewPlain: הכסיל חבק את־ידיו ואכל את־בשרו
    kjvRefs:
    - Ecclesiastes 4:5
    kjvOsis:
    - Eccl.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:6
    ref: Ecclesiastes 4:6
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 20082
    text: Better is a handful of quietness, Than both the hands full of labour and striving after wind.
    translation: JPS 1917
    original: טוֹב מְלֹא כַף נָחַת מִמְּלֹא חָפְנַיִם עָמָל וּרְעוּת רוּחַ׃
    hebrewPlain: טוב מלא כף נחת ממלא חפנים עמל ורעות רוח
    kjvRefs:
    - Ecclesiastes 4:6
    kjvOsis:
    - Eccl.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:7
    ref: Ecclesiastes 4:7
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 20083
    text: Then I returned and saw vanity under the sun.
    translation: JPS 1917
    original: וְשַׁבְתִּי אֲנִי וָאֶרְאֶה הֶבֶל תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: ושבתי אני ואראה הבל תחת השמש
    kjvRefs:
    - Ecclesiastes 4:7
    kjvOsis:
    - Eccl.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:8
    ref: Ecclesiastes 4:8
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 20084
    text: 'There is one that is alone, and he hath not a second; yea, he hath neither son nor brother; yet is there no end of all his labour, neither is his eye satisfied with riches: ‘for whom then do I labour, and bereave my soul of pleasure?’ This also is vanity, yea, it is a grievous business.'
    translation: JPS 1917
    original: יֵשׁ אֶחָד וְאֵין שֵׁנִי גַּם בֵּן וָאָח אֵין־לוֹ וְאֵין קֵץ לְכָל־עֲמָלוֹ גַּם־עיניו [עֵינוֹ] לֹא־תִשְׂבַּע עֹשֶׁר וּלְמִי אֲנִי עָמֵל וּמְחַסֵּר אֶת־נַפְשִׁי מִטּוֹבָה גַּם־זֶה הֶבֶל וְעִנְיַן רָע הוּא׃
    hebrewPlain: יש אחד ואין שני גם בן ואח אין־לו ואין קץ לכל־עמלו גם־עיניו [עינו] לא־תשבע עשר ולמי אני עמל ומחסר את־נפשי מטובה גם־זה הבל וענין רע הוא
    kjvRefs:
    - Ecclesiastes 4:8
    kjvOsis:
    - Eccl.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:9
    ref: Ecclesiastes 4:9
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 20085
    text: Two are better than one; because they have a good reward for their labour.
    translation: JPS 1917
    original: טוֹבִים הַשְּׁנַיִם מִן־הָאֶחָד אֲשֶׁר יֵשׁ־לָהֶם שָׂכָר טוֹב בַּעֲמָלָם׃
    hebrewPlain: טובים השנים מן־האחד אשר יש־להם שכר טוב בעמלם
    kjvRefs:
    - Ecclesiastes 4:9
    kjvOsis:
    - Eccl.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:10
    ref: Ecclesiastes 4:10
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 20086
    text: For if they fall, the one will lift up his fellow; but woe to him that is alone when he falleth, and hath not another to lift him up.
    translation: JPS 1917
    original: כִּי אִם־יִפֹּלוּ הָאֶחָד יָקִים אֶת־חֲבֵרוֹ וְאִילוֹ הָאֶחָד שֶׁיִּפּוֹל וְאֵין שֵׁנִי לַהֲקִימוֹ׃
    hebrewPlain: כי אם־יפלו האחד יקים את־חברו ואילו האחד שיפול ואין שני להקימו
    kjvRefs:
    - Ecclesiastes 4:10
    kjvOsis:
    - Eccl.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:11
    ref: Ecclesiastes 4:11
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 20087
    text: Again, if two lie together, then they have warmth; but how can one be warm alone?
    translation: JPS 1917
    original: גַּם אִם־יִשְׁכְּבוּ שְׁנַיִם וְחַם לָהֶם וּלְאֶחָד אֵיךְ יֵחָם׃
    hebrewPlain: גם אם־ישכבו שנים וחם להם ולאחד איך יחם
    kjvRefs:
    - Ecclesiastes 4:11
    kjvOsis:
    - Eccl.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:12
    ref: Ecclesiastes 4:12
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 20088
    text: And if a man prevail against him that is alone, two shall withstand him; and a threefold cord is not quickly broken.
    translation: JPS 1917
    original: וְאִם־יִתְקְפוֹ הָאֶחָד הַשְּׁנַיִם יַעַמְדוּ נֶגְדּוֹ וְהַחוּט הַמְשֻׁלָּשׁ לֹא בִמְהֵרָה יִנָּתֵק׃
    hebrewPlain: ואם־יתקפו האחד השנים יעמדו נגדו והחוט המשלש לא במהרה ינתק
    kjvRefs:
    - Ecclesiastes 4:12
    kjvOsis:
    - Eccl.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:13
    ref: Ecclesiastes 4:13
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 20089
    text: Better is a poor and wise child than an old and foolish king, who knoweth not how to receive admonition any more.
    translation: JPS 1917
    original: טוֹב יֶלֶד מִסְכֵּן וְחָכָם מִמֶּלֶךְ זָקֵן וּכְסִיל אֲשֶׁר לֹא־יָדַע לְהִזָּהֵר עוֹד׃
    hebrewPlain: טוב ילד מסכן וחכם ממלך זקן וכסיל אשר לא־ידע להזהר עוד
    kjvRefs:
    - Ecclesiastes 4:13
    kjvOsis:
    - Eccl.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:14
    ref: Ecclesiastes 4:14
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 20090
    text: For out of prison he came forth to be king; although in his kingdom he was born poor.
    translation: JPS 1917
    original: כִּי־מִבֵּית הָסוּרִים יָצָא לִמְלֹךְ כִּי גַּם בְּמַלְכוּתוֹ נוֹלַד רָשׁ׃
    hebrewPlain: כי־מבית הסורים יצא למלך כי גם במלכותו נולד רש
    kjvRefs:
    - Ecclesiastes 4:14
    kjvOsis:
    - Eccl.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:15
    ref: Ecclesiastes 4:15
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 20091
    text: I saw all the living that walk under the sun, that they were with the child, the second, that was to stand up in his stead.
    translation: JPS 1917
    original: רָאִיתִי אֶת־כָּל־הַחַיִּים הַמְהַלְּכִים תַּחַת הַשָּׁמֶשׁ עִם הַיֶּלֶד הַשֵּׁנִי אֲשֶׁר יַעֲמֹד תַּחְתָּיו׃
    hebrewPlain: ראיתי את־כל־החיים המהלכים תחת השמש עם הילד השני אשר יעמד תחתיו
    kjvRefs:
    - Ecclesiastes 4:15
    kjvOsis:
    - Eccl.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:16
    ref: Ecclesiastes 4:16
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 20092
    text: There was no end of all the people, even of all them whom he did lead; yet they that come after shall not rejoice in him. Surely this also is vanity and a striving after wind.
    translation: JPS 1917
    original: אֵין־קֵץ לְכָל־הָעָם לְכֹל אֲשֶׁר־הָיָה לִפְנֵיהֶם גַּם הָאַחֲרוֹנִים לֹא יִשְׂמְחוּ־בוֹ כִּי־גַם־זֶה הֶבֶל וְרַעְיוֹן רוּחַ׃
    hebrewPlain: אין־קץ לכל־העם לכל אשר־היה לפניהם גם האחרונים לא ישמחו־בו כי־גם־זה הבל ורעיון רוח
    kjvRefs:
    - Ecclesiastes 4:16
    kjvOsis:
    - Eccl.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.4.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 4:17
    ref: Ecclesiastes 4:17
    book: Eccl
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 20093
    text: 'Guard thy foot when thou goest to the house of God, and be ready to hearken: it is better than when fools give sacrifices; for they know not that they do evil.'
    translation: JPS 1917
    original: שְׁמֹר רגליך [רַגְלְךָ] כַּאֲשֶׁר תֵּלֵךְ אֶל־בֵּית הָאֱלֹהִים וְקָרוֹב לִשְׁמֹעַ מִתֵּת הַכְּסִילִים זָבַח כִּי־אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע׃
    hebrewPlain: שמר רגליך [רגלך] כאשר תלך אל־בית האלהים וקרוב לשמע מתת הכסילים זבח כי־אינם יודעים לעשות רע
    kjvRefs:
    - Ecclesiastes 5:1
    kjvOsis:
    - Eccl.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.4
- type: TanakhVerse
  data:
    osis: Eccl.5.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:1
    ref: Ecclesiastes 5:1
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 20094
    text: Be not rash with thy mouth, and let not thy heart be hasty to utter a word before God; for God is in heaven, and thou upon earth; therefore let thy words be few.
    translation: JPS 1917
    original: אַל־תְּבַהֵל עַל־פִּיךָ וְלִבְּךָ אַל־יְמַהֵר לְהוֹצִיא דָבָר לִפְנֵי הָאֱלֹהִים כִּי הָאֱלֹהִים בַּשָּׁמַיִם וְאַתָּה עַל־הָאָרֶץ עַל־כֵּן יִהְיוּ דְבָרֶיךָ מְעַטִּים׃
    hebrewPlain: אל־תבהל על־פיך ולבך אל־ימהר להוציא דבר לפני האלהים כי האלהים בשמים ואתה על־הארץ על־כן יהיו דבריך מעטים
    kjvRefs:
    - Ecclesiastes 5:2
    kjvOsis:
    - Eccl.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:2
    ref: Ecclesiastes 5:2
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 20095
    text: For a dream cometh through a multitude of business; And a fool’s voice through a multitude of words.
    translation: JPS 1917
    original: כִּי בָּא הַחֲלוֹם בְּרֹב עִנְיָן וְקוֹל כְּסִיל בְּרֹב דְּבָרִים׃
    hebrewPlain: כי בא החלום ברב ענין וקול כסיל ברב דברים
    kjvRefs:
    - Ecclesiastes 5:3
    kjvOsis:
    - Eccl.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:3
    ref: Ecclesiastes 5:3
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 20096
    text: When thou vowest a vow unto God, defer not to pay it; for He hath no pleasure in fools; pay that which thou vowest.
    translation: JPS 1917
    original: כַּאֲשֶׁר תִּדֹּר נֶדֶר לֵאלֹהִים אַל־תְּאַחֵר לְשַׁלְּמוֹ כִּי אֵין חֵפֶץ בַּכְּסִילִים אֵת אֲשֶׁר־תִּדֹּר שַׁלֵּם׃
    hebrewPlain: כאשר תדר נדר לאלהים אל־תאחר לשלמו כי אין חפץ בכסילים את אשר־תדר שלם
    kjvRefs:
    - Ecclesiastes 5:4
    kjvOsis:
    - Eccl.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:4
    ref: Ecclesiastes 5:4
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 20097
    text: Better is it that thou shouldest not vow, than that thou shouldest vow and not pay.
    translation: JPS 1917
    original: טוֹב אֲשֶׁר לֹא־תִדֹּר מִשֶׁתִּדּוֹר וְלֹא תְשַׁלֵּם׃
    hebrewPlain: טוב אשר לא־תדר משתדור ולא תשלם
    kjvRefs:
    - Ecclesiastes 5:5
    kjvOsis:
    - Eccl.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:5
    ref: Ecclesiastes 5:5
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 20098
    text: Suffer not thy mouth to bring thy flesh into guilt, neither say thou before the messenger, that it was an error; wherefore should God be angry at thy voice, and destroy the work of thy hands?
    translation: JPS 1917
    original: אַל־תִּתֵּן אֶת־פִּיךָ לַחֲטִיא אֶת־בְּשָׂרֶךָ וְאַל־תֹּאמַר לִפְנֵי הַמַּלְאָךְ כִּי שְׁגָגָה הִיא לָמָּה יִקְצֹף הָאֱלֹהִים עַל־קוֹלֶךָ וְחִבֵּל אֶת־מַעֲשֵׂה יָדֶיךָ׃
    hebrewPlain: אל־תתן את־פיך לחטיא את־בשרך ואל־תאמר לפני המלאך כי שגגה היא למה יקצף האלהים על־קולך וחבל את־מעשה ידיך
    kjvRefs:
    - Ecclesiastes 5:6
    kjvOsis:
    - Eccl.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:6
    ref: Ecclesiastes 5:6
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 20099
    text: For through the multitude of dreams and vanities there are also many words; but fear thou God.
    translation: JPS 1917
    original: כִּי בְרֹב חֲלֹמוֹת וַהֲבָלִים וּדְבָרִים הַרְבֵּה כִּי אֶת־הָאֱלֹהִים יְרָא׃
    hebrewPlain: כי ברב חלמות והבלים ודברים הרבה כי את־האלהים ירא
    kjvRefs:
    - Ecclesiastes 5:7
    kjvOsis:
    - Eccl.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:7
    ref: Ecclesiastes 5:7
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 20100
    text: If thou seest the oppression of the poor, and the violent perverting of justice and righteousness in the state, marvel not at the matter; for one higher than the high watcheth, and there are higher than they.
    translation: JPS 1917
    original: אִם־עֹשֶׁק רָשׁ וְגֵזֶל מִשְׁפָּט וָצֶדֶק תִּרְאֶה בַמְּדִינָה אַל־תִּתְמַהּ עַל־הַחֵפֶץ כִּי גָבֹהַּ מֵעַל גָּבֹהַ שֹׁמֵר וּגְבֹהִים עֲלֵיהֶם׃
    hebrewPlain: אם־עשק רש וגזל משפט וצדק תראה במדינה אל־תתמה על־החפץ כי גבה מעל גבה שמר וגבהים עליהם
    kjvRefs:
    - Ecclesiastes 5:8
    kjvOsis:
    - Eccl.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:8
    ref: Ecclesiastes 5:8
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 20101
    text: But the profit of a land every way is a king that maketh himself servant to the field.
    translation: JPS 1917
    original: וְיִתְרוֹן אֶרֶץ בַּכֹּל היא [הוּא] מֶלֶךְ לְשָׂדֶה נֶעֱבָד׃
    hebrewPlain: ויתרון ארץ בכל היא [הוא] מלך לשדה נעבד
    kjvRefs:
    - Ecclesiastes 5:9
    kjvOsis:
    - Eccl.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:9
    ref: Ecclesiastes 5:9
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 20102
    text: He that loveth silver shall not be satisfied with silver; nor he that loveth abundance, with increase; this also is vanity.
    translation: JPS 1917
    original: אֹהֵב כֶּסֶף לֹא־יִשְׂבַּע כֶּסֶף וּמִי־אֹהֵב בֶּהָמוֹן לֹא תְבוּאָה גַּם־זֶה הָבֶל׃
    hebrewPlain: אהב כסף לא־ישבע כסף ומי־אהב בהמון לא תבואה גם־זה הבל
    kjvRefs:
    - Ecclesiastes 5:10
    kjvOsis:
    - Eccl.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:10
    ref: Ecclesiastes 5:10
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 20103
    text: When goods increase, they are increased that eat them; and what advantage is there to the owner thereof, saving the beholding of them with his eyes?
    translation: JPS 1917
    original: בִּרְבוֹת הַטּוֹבָה רַבּוּ אוֹכְלֶיהָ וּמַה־כִּשְׁרוֹן לִבְעָלֶיהָ כִּי אִם־ראית [רְאוּת] עֵינָיו׃
    hebrewPlain: ברבות הטובה רבו אוכליה ומה־כשרון לבעליה כי אם־ראית [ראות] עיניו
    kjvRefs:
    - Ecclesiastes 5:11
    kjvOsis:
    - Eccl.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:11
    ref: Ecclesiastes 5:11
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 20104
    text: Sweet is the sleep of a labouring man, whether he eat little or much; but the satiety of the rich will not suffer him to sleep.
    translation: JPS 1917
    original: מְתוּקָה שְׁנַת הָעֹבֵד אִם־מְעַט וְאִם־הַרְבֵּה יֹאכֵל וְהַשָּׂבָע לֶעָשִׁיר אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן׃
    hebrewPlain: מתוקה שנת העבד אם־מעט ואם־הרבה יאכל והשבע לעשיר איננו מניח לו לישון
    kjvRefs:
    - Ecclesiastes 5:12
    kjvOsis:
    - Eccl.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:12
    ref: Ecclesiastes 5:12
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 20105
    text: There is a grievous evil which I have seen under the sun, namely, riches kept by the owner thereof to his hurt;
    translation: JPS 1917
    original: יֵשׁ רָעָה חוֹלָה רָאִיתִי תַּחַת הַשָּׁמֶשׁ עֹשֶׁר שָׁמוּר לִבְעָלָיו לְרָעָתוֹ׃
    hebrewPlain: יש רעה חולה ראיתי תחת השמש עשר שמור לבעליו לרעתו
    kjvRefs:
    - Ecclesiastes 5:13
    kjvOsis:
    - Eccl.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:13
    ref: Ecclesiastes 5:13
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 20106
    text: and those riches perish by evil adventure; and if he hath begotten a son, there is nothing in his hand.
    translation: JPS 1917
    original: וְאָבַד הָעֹשֶׁר הַהוּא בְּעִנְיַן רָע וְהוֹלִיד בֵּן וְאֵין בְּיָדוֹ מְאוּמָה׃
    hebrewPlain: ואבד העשר ההוא בענין רע והוליד בן ואין בידו מאומה
    kjvRefs:
    - Ecclesiastes 5:14
    kjvOsis:
    - Eccl.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:14
    ref: Ecclesiastes 5:14
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 20107
    text: As he came forth of his mother’s womb, naked shall he go back as he came, and shall take nothing for his labour, which he may carry away in his hand.
    translation: JPS 1917
    original: כַּאֲשֶׁר יָצָא מִבֶּטֶן אִמּוֹ עָרוֹם יָשׁוּב לָלֶכֶת כְּשֶׁבָּא וּמְאוּמָה לֹא־יִשָּׂא בַעֲמָלוֹ שֶׁיֹּלֵךְ בְּיָדוֹ׃
    hebrewPlain: כאשר יצא מבטן אמו ערום ישוב ללכת כשבא ומאומה לא־ישא בעמלו שילך בידו
    kjvRefs:
    - Ecclesiastes 5:15
    kjvOsis:
    - Eccl.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:15
    ref: Ecclesiastes 5:15
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 20108
    text: And this also is a grievous evil, that in all points as he came, so shall he go; and what profit hath he that he laboureth for the wind?
    translation: JPS 1917
    original: וְגַם־זֹה רָעָה חוֹלָה כָּל־עֻמַּת שֶׁבָּא כֵּן יֵלֵךְ וּמַה־יִּתְרוֹן לוֹ שֶׁיַּעֲמֹל לָרוּחַ׃
    hebrewPlain: וגם־זה רעה חולה כל־עמת שבא כן ילך ומה־יתרון לו שיעמל לרוח
    kjvRefs:
    - Ecclesiastes 5:16
    kjvOsis:
    - Eccl.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:16
    ref: Ecclesiastes 5:16
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 20109
    text: All his days also he eateth in darkness, and he hath much vexation and sickness and wrath. .
    translation: JPS 1917
    original: גַּם כָּל־יָמָיו בַּחֹשֶׁךְ יֹאכֵל וְכָעַס הַרְבֵּה וְחָלְיוֹ וָקָצֶף׃
    hebrewPlain: גם כל־ימיו בחשך יאכל וכעס הרבה וחליו וקצף
    kjvRefs:
    - Ecclesiastes 5:17
    kjvOsis:
    - Eccl.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:17
    ref: Ecclesiastes 5:17
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 20110
    text: 'Behold that which I have seen: it is good, yea, it is comely for one to eat and to drink, and to enjoy pleasure for all his labour, wherein he laboureth under the sun, all the days of his life which God hath given him; for this is his portion.'
    translation: JPS 1917
    original: הִנֵּה אֲשֶׁר־רָאִיתִי אָנִי טוֹב אֲשֶׁר־יָפֶה לֶאֶכוֹל־וְלִשְׁתּוֹת וְלִרְאוֹת טוֹבָה בְּכָל־עֲמָלוֹ שֶׁיַּעֲמֹל תַּחַת־הַשֶּׁמֶשׁ מִסְפַּר יְמֵי־חיו [חַיָּיו] אֲשֶׁר־נָתַן־לוֹ הָאֱלֹהִים כִּי־הוּא חֶלְקוֹ׃
    hebrewPlain: הנה אשר־ראיתי אני טוב אשר־יפה לאכול־ולשתות ולראות טובה בכל־עמלו שיעמל תחת־השמש מספר ימי־חיו [חייו] אשר־נתן־לו האלהים כי־הוא חלקו
    kjvRefs:
    - Ecclesiastes 5:18
    kjvOsis:
    - Eccl.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:18
    ref: Ecclesiastes 5:18
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 20111
    text: Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labour—this is the gift of God.
    translation: JPS 1917
    original: גַּם כָּל־הָאָדָם אֲשֶׁר נָתַן־לוֹ הָאֱלֹהִים עֹשֶׁר וּנְכָסִים וְהִשְׁלִיטוֹ לֶאֱכֹל מִמֶּנּוּ וְלָשֵׂאת אֶת־חֶלְקוֹ וְלִשְׂמֹחַ בַּעֲמָלוֹ זֹה מַתַּת אֱלֹהִים הִיא׃
    hebrewPlain: גם כל־האדם אשר נתן־לו האלהים עשר ונכסים והשליטו לאכל ממנו ולשאת את־חלקו ולשמח בעמלו זה מתת אלהים היא
    kjvRefs:
    - Ecclesiastes 5:19
    kjvOsis:
    - Eccl.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.5.19
    scripture: tanakh
    name: Tanakh Ecclesiastes 5:19
    ref: Ecclesiastes 5:19
    book: Eccl
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 20112
    text: For let him remember the days of his life that they are not many; for God answereth him in the joy of his heart.
    translation: JPS 1917
    original: כִּי לֹא הַרְבֵּה יִזְכֹּר אֶת־יְמֵי חַיָּיו כִּי הָאֱלֹהִים מַעֲנֶה בְּשִׂמְחַת לִבּוֹ׃
    hebrewPlain: כי לא הרבה יזכר את־ימי חייו כי האלהים מענה בשמחת לבו
    kjvRefs:
    - Ecclesiastes 5:20
    kjvOsis:
    - Eccl.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.5
- type: TanakhVerse
  data:
    osis: Eccl.6.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:1
    ref: Ecclesiastes 6:1
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 20113
    text: 'There is an evil which I have seen under the sun, and it is heavy upon men:'
    translation: JPS 1917
    original: יֵשׁ רָעָה אֲשֶׁר רָאִיתִי תַּחַת הַשָּׁמֶשׁ וְרַבָּה הִיא עַל־הָאָדָם׃
    hebrewPlain: יש רעה אשר ראיתי תחת השמש ורבה היא על־האדם
    kjvRefs:
    - Ecclesiastes 6:1
    kjvOsis:
    - Eccl.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:2
    ref: Ecclesiastes 6:2
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 20114
    text: a man to whom God giveth riches, wealth, and honour, so that he wanteth nothing for his soul of all that he desireth, yet God giveth him not power to eat thereof, but a stranger eateth it; this is vanity, and it is an evil disease.
    translation: JPS 1917
    original: אִישׁ אֲשֶׁר יִתֶּן־לוֹ הָאֱלֹהִים עֹשֶׁר וּנְכָסִים וְכָבוֹד וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר־יִתְאַוֶּה וְלֹא־יַשְׁלִיטֶנּוּ הָאֱלֹהִים לֶאֱכֹל מִמֶּנּוּ כִּי אִישׁ נָכְרִי יֹאכֲלֶנּוּ זֶה הֶבֶל וָחֳלִי רָע הוּא׃
    hebrewPlain: איש אשר יתן־לו האלהים עשר ונכסים וכבוד ואיננו חסר לנפשו מכל אשר־יתאוה ולא־ישליטנו האלהים לאכל ממנו כי איש נכרי יאכלנו זה הבל וחלי רע הוא
    kjvRefs:
    - Ecclesiastes 6:2
    kjvOsis:
    - Eccl.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:3
    ref: Ecclesiastes 6:3
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 20115
    text: If a man beget a hundred children, and live many years, so that the days of his years are many, but his soul have not enough of good, and moreover he have no burial; I say, that an untimely birth is better than he;
    translation: JPS 1917
    original: אִם־יוֹלִיד אִישׁ מֵאָה וְשָׁנִים רַבּוֹת יִחְיֶה וְרַב שֶׁיִּהְיוּ יְמֵי־שָׁנָיו וְנַפְשׁוֹ לֹא־תִשְׂבַּע מִן־הַטּוֹבָה וְגַם־קְבוּרָה לֹא־הָיְתָה לּוֹ אָמַרְתִּי טוֹב מִמֶּנּוּ הַנָּפֶל׃
    hebrewPlain: אם־יוליד איש מאה ושנים רבות יחיה ורב שיהיו ימי־שניו ונפשו לא־תשבע מן־הטובה וגם־קבורה לא־היתה לו אמרתי טוב ממנו הנפל
    kjvRefs:
    - Ecclesiastes 6:3
    kjvOsis:
    - Eccl.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:4
    ref: Ecclesiastes 6:4
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 20116
    text: for it cometh in vanity, and departeth in darkness, and the name thereof is covered with darkness;
    translation: JPS 1917
    original: כִּי־בַהֶבֶל בָּא וּבַחֹשֶׁךְ יֵלֵךְ וּבַחֹשֶׁךְ שְׁמוֹ יְכֻסֶּה׃
    hebrewPlain: כי־בהבל בא ובחשך ילך ובחשך שמו יכסה
    kjvRefs:
    - Ecclesiastes 6:4
    kjvOsis:
    - Eccl.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:5
    ref: Ecclesiastes 6:5
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 20117
    text: moreover it hath not seen the sun nor known it; this hath gratification rather than the other;
    translation: JPS 1917
    original: גַּם־שֶׁמֶשׁ לֹא־רָאָה וְלֹא יָדָע נַחַת לָזֶה מִזֶּה׃
    hebrewPlain: גם־שמש לא־ראה ולא ידע נחת לזה מזה
    kjvRefs:
    - Ecclesiastes 6:5
    kjvOsis:
    - Eccl.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:6
    ref: Ecclesiastes 6:6
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 20118
    text: yea, though he live a thousand years twice told, and enjoy no good; do not all go to one place?
    translation: JPS 1917
    original: וְאִלּוּ חָיָה אֶלֶף שָׁנִים פַּעֲמַיִם וְטוֹבָה לֹא רָאָה הֲלֹא אֶל־מָקוֹם אֶחָד הַכֹּל הוֹלֵךְ׃
    hebrewPlain: ואלו חיה אלף שנים פעמים וטובה לא ראה הלא אל־מקום אחד הכל הולך
    kjvRefs:
    - Ecclesiastes 6:6
    kjvOsis:
    - Eccl.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:7
    ref: Ecclesiastes 6:7
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 20119
    text: All the labour of man is for his mouth, And yet the appetite is not filled.
    translation: JPS 1917
    original: כָּל־עֲמַל הָאָדָם לְפִיהוּ וְגַם־הַנֶּפֶשׁ לֹא תִמָּלֵא׃
    hebrewPlain: כל־עמל האדם לפיהו וגם־הנפש לא תמלא
    kjvRefs:
    - Ecclesiastes 6:7
    kjvOsis:
    - Eccl.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:8
    ref: Ecclesiastes 6:8
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 20120
    text: For what advantage hath the wise more than the fool? or the poor man that hath understanding, in walking before the living?
    translation: JPS 1917
    original: כִּי מַה־יּוֹתֵר לֶחָכָם מִן־הַכְּסִיל מַה־לֶּעָנִי יוֹדֵעַ לַהֲלֹךְ נֶגֶד הַחַיִּים׃
    hebrewPlain: כי מה־יותר לחכם מן־הכסיל מה־לעני יודע להלך נגד החיים
    kjvRefs:
    - Ecclesiastes 6:8
    kjvOsis:
    - Eccl.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:9
    ref: Ecclesiastes 6:9
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 20121
    text: Better is the seeing of the eyes than the wandering of the desire; this also is vanity and a striving after wind.
    translation: JPS 1917
    original: טוֹב מַרְאֵה עֵינַיִם מֵהֲלָךְ־נָפֶשׁ גַּם־זֶה הֶבֶל וּרְעוּת רוּחַ׃
    hebrewPlain: טוב מראה עינים מהלך־נפש גם־זה הבל ורעות רוח
    kjvRefs:
    - Ecclesiastes 6:9
    kjvOsis:
    - Eccl.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:10
    ref: Ecclesiastes 6:10
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 20122
    text: Whatsoever cometh into being, the name thereof was given long ago, and it is foreknown what man is; neither can he contend with Him that is mightier than he.
    translation: JPS 1917
    original: מַה־שֶּׁהָיָה כְּבָר נִקְרָא שְׁמוֹ וְנוֹדָע אֲשֶׁר־הוּא אָדָם וְלֹא־יוּכַל לָדִין עִם שהתקיף [שֶׁתַּקִּיף] מִמֶּנּוּ׃
    hebrewPlain: מה־שהיה כבר נקרא שמו ונודע אשר־הוא אדם ולא־יוכל לדין עם שהתקיף [שתקיף] ממנו
    kjvRefs:
    - Ecclesiastes 6:10
    kjvOsis:
    - Eccl.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:11
    ref: Ecclesiastes 6:11
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 20123
    text: Seeing there are many words that increase vanity, what is man the better?
    translation: JPS 1917
    original: כִּי יֵשׁ־דְּבָרִים הַרְבֵּה מַרְבִּים הָבֶל מַה־יֹּתֵר לָאָדָם׃
    hebrewPlain: כי יש־דברים הרבה מרבים הבל מה־יתר לאדם
    kjvRefs:
    - Ecclesiastes 6:11
    kjvOsis:
    - Eccl.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.6.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 6:12
    ref: Ecclesiastes 6:12
    book: Eccl
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 20124
    text: For who knoweth what is good for man in his life, all the days of his vain life which he spendeth as a shadow? for who can tell a man what shall be after him under the sun?
    translation: JPS 1917
    original: כִּי מִי־יוֹדֵעַ מַה־טּוֹב לָאָדָם בַּחַיִּים מִסְפַּר יְמֵי־חַיֵּי הֶבְלוֹ וְיַעֲשֵׂם כַּצֵּל אֲשֶׁר מִי־יַגִּיד לָאָדָם מַה־יִּהְיֶה אַחֲרָיו תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: כי מי־יודע מה־טוב לאדם בחיים מספר ימי־חיי הבלו ויעשם כצל אשר מי־יגיד לאדם מה־יהיה אחריו תחת השמש
    kjvRefs:
    - Ecclesiastes 6:12
    kjvOsis:
    - Eccl.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.6
- type: TanakhVerse
  data:
    osis: Eccl.7.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:1
    ref: Ecclesiastes 7:1
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 20125
    text: A good name is better than precious oil; And the day of death than the day of one’s birth.
    translation: JPS 1917
    original: טוֹב שֵׁם מִשֶּׁמֶן טוֹב וְיוֹם הַמָּוֶת מִיּוֹם הִוָּלְדוֹ׃
    hebrewPlain: טוב שם משמן טוב ויום המות מיום הולדו
    kjvRefs:
    - Ecclesiastes 7:1
    kjvOsis:
    - Eccl.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:2
    ref: Ecclesiastes 7:2
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 20126
    text: It is better to go to the house of mourning, Than to go to the house of feasting; For that is the end of all men, And the living will lay it to his heart.
    translation: JPS 1917
    original: טוֹב לָלֶכֶת אֶל־בֵּית־אֵבֶל מִלֶּכֶת אֶל־בֵּית מִשְׁתֶּה בַּאֲשֶׁר הוּא סוֹף כָּל־הָאָדָם וְהַחַי יִתֵּן אֶל־לִבּוֹ׃
    hebrewPlain: טוב ללכת אל־בית־אבל מלכת אל־בית משתה באשר הוא סוף כל־האדם והחי יתן אל־לבו
    kjvRefs:
    - Ecclesiastes 7:2
    kjvOsis:
    - Eccl.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:3
    ref: Ecclesiastes 7:3
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 20127
    text: Vexation is better than laughter; For by the sadness of the countenance the heart may be gladdened.
    translation: JPS 1917
    original: טוֹב כַּעַס מִשְּׂחֹק כִּי־בְרֹעַ פָּנִים יִיטַב לֵב׃
    hebrewPlain: טוב כעס משחק כי־ברע פנים ייטב לב
    kjvRefs:
    - Ecclesiastes 7:3
    kjvOsis:
    - Eccl.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:4
    ref: Ecclesiastes 7:4
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 20128
    text: The heart of the wise is in the house of mourning; But the heart of fools is in the house of mirth.
    translation: JPS 1917
    original: לֵב חֲכָמִים בְּבֵית אֵבֶל וְלֵב כְּסִילִים בְּבֵית שִׂמְחָה׃
    hebrewPlain: לב חכמים בבית אבל ולב כסילים בבית שמחה
    kjvRefs:
    - Ecclesiastes 7:4
    kjvOsis:
    - Eccl.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:5
    ref: Ecclesiastes 7:5
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 20129
    text: It is better to hear the rebuke of the wise, Than for a man to hear the song of fools.
    translation: JPS 1917
    original: טוֹב לִשְׁמֹעַ גַּעֲרַת חָכָם מֵאִישׁ שֹׁמֵעַ שִׁיר כְּסִילִים׃
    hebrewPlain: טוב לשמע גערת חכם מאיש שמע שיר כסילים
    kjvRefs:
    - Ecclesiastes 7:5
    kjvOsis:
    - Eccl.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:6
    ref: Ecclesiastes 7:6
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 20130
    text: For as the crackling of thorns under a pot, so is the laughter of the fool; this also is vanity.
    translation: JPS 1917
    original: כִּי כְקוֹל הַסִּירִים תַּחַת הַסִּיר כֵּן שְׂחֹק הַכְּסִיל וְגַם־זֶה הָבֶל׃
    hebrewPlain: כי כקול הסירים תחת הסיר כן שחק הכסיל וגם־זה הבל
    kjvRefs:
    - Ecclesiastes 7:6
    kjvOsis:
    - Eccl.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:7
    ref: Ecclesiastes 7:7
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 20131
    text: Surely oppression turneth a wise man into a fool; And a gift destroyeth the understanding.
    translation: JPS 1917
    original: כִּי הָעֹשֶׁק יְהוֹלֵל חָכָם וִיאַבֵּד אֶת־לֵב מַתָּנָה׃
    hebrewPlain: כי העשק יהולל חכם ויאבד את־לב מתנה
    kjvRefs:
    - Ecclesiastes 7:7
    kjvOsis:
    - Eccl.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:8
    ref: Ecclesiastes 7:8
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 20132
    text: Better is the end of a thing than the beginning thereof; And the patient in spirit is better than the proud in spirit.
    translation: JPS 1917
    original: טוֹב אַחֲרִית דָּבָר מֵרֵאשִׁיתוֹ טוֹב אֶרֶךְ־רוּחַ מִגְּבַהּ־רוּחַ׃
    hebrewPlain: טוב אחרית דבר מראשיתו טוב ארך־רוח מגבה־רוח
    kjvRefs:
    - Ecclesiastes 7:8
    kjvOsis:
    - Eccl.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:9
    ref: Ecclesiastes 7:9
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 20133
    text: Be not hasty in thy spirit to be angry; For anger resteth in the bosom of fools.
    translation: JPS 1917
    original: אַל־תְּבַהֵל בְּרוּחֲךָ לִכְעוֹס כִּי כַעַס בְּחֵיק כְּסִילִים יָנוּחַ׃
    hebrewPlain: אל־תבהל ברוחך לכעוס כי כעס בחיק כסילים ינוח
    kjvRefs:
    - Ecclesiastes 7:9
    kjvOsis:
    - Eccl.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:10
    ref: Ecclesiastes 7:10
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 20134
    text: 'Say not thou: ‘How was it that the former days were better than these?’ for it is not out of wisdom that thou inquirest concerning this.'
    translation: JPS 1917
    original: אַל־תֹּאמַר מֶה הָיָה שֶׁהַיָּמִים הָרִאשֹׁנִים הָיוּ טוֹבִים מֵאֵלֶּה כִּי לֹא מֵחָכְמָה שָׁאַלְתָּ עַל־זֶה׃
    hebrewPlain: אל־תאמר מה היה שהימים הראשנים היו טובים מאלה כי לא מחכמה שאלת על־זה
    kjvRefs:
    - Ecclesiastes 7:10
    kjvOsis:
    - Eccl.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:11
    ref: Ecclesiastes 7:11
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 20135
    text: Wisdom is good with an inheritance, Yea, a profit to them that see the sun.
    translation: JPS 1917
    original: טוֹבָה חָכְמָה עִם־נַחֲלָה וְיֹתֵר לְרֹאֵי הַשָּׁמֶשׁ׃
    hebrewPlain: טובה חכמה עם־נחלה ויתר לראי השמש
    kjvRefs:
    - Ecclesiastes 7:11
    kjvOsis:
    - Eccl.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:12
    ref: Ecclesiastes 7:12
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 20136
    text: For wisdom is a defence, even as money is a defence; but the excellency of knowledge is, that wisdom preserveth the life of him that hath it.
    translation: JPS 1917
    original: כִּי בְּצֵל הַחָכְמָה בְּצֵל הַכָּסֶף וְיִתְרוֹן דַּעַת הַחָכְמָה תְּחַיֶּה בְעָלֶיהָ׃
    hebrewPlain: כי בצל החכמה בצל הכסף ויתרון דעת החכמה תחיה בעליה
    kjvRefs:
    - Ecclesiastes 7:12
    kjvOsis:
    - Eccl.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:13
    ref: Ecclesiastes 7:13
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 20137
    text: Consider the work of God; for who can make that straight, which He hath made crooked?
    translation: JPS 1917
    original: רְאֵה אֶת־מַעֲשֵׂה הָאֱלֹהִים כִּי מִי יוּכַל לְתַקֵּן אֵת אֲשֶׁר עִוְּתוֹ׃
    hebrewPlain: ראה את־מעשה האלהים כי מי יוכל לתקן את אשר עותו
    kjvRefs:
    - Ecclesiastes 7:13
    kjvOsis:
    - Eccl.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:14
    ref: Ecclesiastes 7:14
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 20138
    text: In the day of prosperity be joyful, and in the day of adversity consider; God hath made even the one as well as the other, to the end that man should find nothing after him.
    translation: JPS 1917
    original: בְּיוֹם טוֹבָה הֱיֵה בְטוֹב וּבְיוֹם רָעָה רְאֵה גַּם אֶת־זֶה לְעֻמַּת־זֶה עָשָׂה הָאֱלֹהִים עַל־דִּבְרַת שֶׁלֹּא יִמְצָא הָאָדָם אַחֲרָיו מְאוּמָה׃
    hebrewPlain: ביום טובה היה בטוב וביום רעה ראה גם את־זה לעמת־זה עשה האלהים על־דברת שלא ימצא האדם אחריו מאומה
    kjvRefs:
    - Ecclesiastes 7:14
    kjvOsis:
    - Eccl.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:15
    ref: Ecclesiastes 7:15
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 20139
    text: All things have I seen in the days of my vanity; there is a righteous man that perisheth in his righteousness, and there is a wicked man that prolongeth his life in his evil-doing.
    translation: JPS 1917
    original: אֶת־הַכֹּל רָאִיתִי בִּימֵי הֶבְלִי יֵשׁ צַדִּיק אֹבֵד בְּצִדְקוֹ וְיֵשׁ רָשָׁע מַאֲרִיךְ בְּרָעָתוֹ׃
    hebrewPlain: את־הכל ראיתי בימי הבלי יש צדיק אבד בצדקו ויש רשע מאריך ברעתו
    kjvRefs:
    - Ecclesiastes 7:15
    kjvOsis:
    - Eccl.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:16
    ref: Ecclesiastes 7:16
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 20140
    text: Be not righteous overmuch; neither make thyself overwise; why shouldest thou destroy thyself?
    translation: JPS 1917
    original: אַל־תְּהִי צַדִּיק הַרְבֵּה וְאַל־תִּתְחַכַּם יוֹתֵר לָמָּה תִּשּׁוֹמֵם׃
    hebrewPlain: אל־תהי צדיק הרבה ואל־תתחכם יותר למה תשומם
    kjvRefs:
    - Ecclesiastes 7:16
    kjvOsis:
    - Eccl.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:17
    ref: Ecclesiastes 7:17
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 20141
    text: Be not overmuch wicked, neither be thou foolish; why shouldest thou die before thy time?
    translation: JPS 1917
    original: אַל־תִּרְשַׁע הַרְבֵּה וְאַל־תְּהִי סָכָל לָמָּה תָמוּת בְּלֹא עִתֶּךָ׃
    hebrewPlain: אל־תרשע הרבה ואל־תהי סכל למה תמות בלא עתך
    kjvRefs:
    - Ecclesiastes 7:17
    kjvOsis:
    - Eccl.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:18
    ref: Ecclesiastes 7:18
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 20142
    text: It is good that thou shouldest take hold of the one; yea, also from the other withdraw not thy hand; for he that feareth God shall discharge himself of them all.
    translation: JPS 1917
    original: טוֹב אֲשֶׁר תֶּאֱחֹז בָּזֶה וְגַם־מִזֶּה אַל־תַּנַּח אֶת־יָדֶךָ כִּי־יְרֵא אֱלֹהִים יֵצֵא אֶת־כֻּלָּם׃
    hebrewPlain: טוב אשר תאחז בזה וגם־מזה אל־תנח את־ידך כי־ירא אלהים יצא את־כלם
    kjvRefs:
    - Ecclesiastes 7:18
    kjvOsis:
    - Eccl.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.19
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:19
    ref: Ecclesiastes 7:19
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 20143
    text: Wisdom is a stronghold to the wise man more than ten rulers that are in a city.
    translation: JPS 1917
    original: הַחָכְמָה תָּעֹז לֶחָכָם מֵעֲשָׂרָה שַׁלִּיטִים אֲשֶׁר הָיוּ בָּעִיר׃
    hebrewPlain: החכמה תעז לחכם מעשרה שליטים אשר היו בעיר
    kjvRefs:
    - Ecclesiastes 7:19
    kjvOsis:
    - Eccl.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.20
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:20
    ref: Ecclesiastes 7:20
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 20144
    text: For there is not a righteous man upon earth, that doeth good, and sinneth not.
    translation: JPS 1917
    original: כִּי אָדָם אֵין צַדִּיק בָּאָרֶץ אֲשֶׁר יַעֲשֶׂה־טּוֹב וְלֹא יֶחֱטָא׃
    hebrewPlain: כי אדם אין צדיק בארץ אשר יעשה־טוב ולא יחטא
    kjvRefs:
    - Ecclesiastes 7:20
    kjvOsis:
    - Eccl.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.21
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:21
    ref: Ecclesiastes 7:21
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 20145
    text: Also take not heed unto all words that are spoken, lest thou hear thy servant curse thee;
    translation: JPS 1917
    original: גַּם לְכָל־הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ אַל־תִּתֵּן לִבֶּךָ אֲשֶׁר לֹא־תִשְׁמַע אֶת־עַבְדְּךָ מְקַלְלֶךָ׃
    hebrewPlain: גם לכל־הדברים אשר ידברו אל־תתן לבך אשר לא־תשמע את־עבדך מקללך
    kjvRefs:
    - Ecclesiastes 7:21
    kjvOsis:
    - Eccl.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.22
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:22
    ref: Ecclesiastes 7:22
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 22
    ordinal: 20146
    text: for oftentimes also thine own heart knoweth that thou thyself likewise hast cursed others.
    translation: JPS 1917
    original: כִּי גַּם־פְּעָמִים רַבּוֹת יָדַע לִבֶּךָ אֲשֶׁר גַּם־את [אַתָּה] קִלַּלְתָּ אֲחֵרִים׃
    hebrewPlain: כי גם־פעמים רבות ידע לבך אשר גם־את [אתה] קללת אחרים
    kjvRefs:
    - Ecclesiastes 7:22
    kjvOsis:
    - Eccl.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.23
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:23
    ref: Ecclesiastes 7:23
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 23
    ordinal: 20147
    text: 'All this have I tried by wisdom; I said: ‘I will get wisdom’; but it was far from me.'
    translation: JPS 1917
    original: כָּל־זֹה נִסִּיתִי בַחָכְמָה אָמַרְתִּי אֶחְכָּמָה וְהִיא רְחוֹקָה מִמֶּנִּי׃
    hebrewPlain: כל־זה נסיתי בחכמה אמרתי אחכמה והיא רחוקה ממני
    kjvRefs:
    - Ecclesiastes 7:23
    kjvOsis:
    - Eccl.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.24
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:24
    ref: Ecclesiastes 7:24
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 24
    ordinal: 20148
    text: That which is far off, and exceeding deep; who can find it out?
    translation: JPS 1917
    original: רָחוֹק מַה־שֶּׁהָיָה וְעָמֹק עָמֹק מִי יִמְצָאֶנּוּ׃
    hebrewPlain: רחוק מה־שהיה ועמק עמק מי ימצאנו
    kjvRefs:
    - Ecclesiastes 7:24
    kjvOsis:
    - Eccl.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.25
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:25
    ref: Ecclesiastes 7:25
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 25
    ordinal: 20149
    text: I turned about, and applied my heart to know and to search out, and to seek wisdom and the reason of things, and to know wickedness to be folly, and foolishness to be madness;
    translation: JPS 1917
    original: סַבּוֹתִי אֲנִי וְלִבִּי לָדַעַת וְלָתוּר וּבַקֵּשׁ חָכְמָה וְחֶשְׁבּוֹן וְלָדַעַת רֶשַׁע כֶּסֶל וְהַסִּכְלוּת הוֹלֵלוֹת׃
    hebrewPlain: סבותי אני ולבי לדעת ולתור ובקש חכמה וחשבון ולדעת רשע כסל והסכלות הוללות
    kjvRefs:
    - Ecclesiastes 7:25
    kjvOsis:
    - Eccl.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.26
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:26
    ref: Ecclesiastes 7:26
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 26
    ordinal: 20150
    text: and I find more bitter than death the woman, whose heart is snares and nets, and her hands as bands; whoso pleaseth God shall escape from her; but the sinner shall be taken by her.
    translation: JPS 1917
    original: וּמוֹצֶא אֲנִי מַר מִמָּוֶת אֶת־הָאִשָּׁה אֲשֶׁר־הִיא מְצוֹדִים וַחֲרָמִים לִבָּהּ אֲסוּרִים יָדֶיהָ טוֹב לִפְנֵי הָאֱלֹהִים יִמָּלֵט מִמֶּנָּה וְחוֹטֵא יִלָּכֶד בָּהּ׃
    hebrewPlain: ומוצא אני מר ממות את־האשה אשר־היא מצודים וחרמים לבה אסורים ידיה טוב לפני האלהים ימלט ממנה וחוטא ילכד בה
    kjvRefs:
    - Ecclesiastes 7:26
    kjvOsis:
    - Eccl.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.27
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:27
    ref: Ecclesiastes 7:27
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 27
    ordinal: 20151
    text: Behold, this have I found, saith Koheleth, adding one thing to another, to find out the account;
    translation: JPS 1917
    original: רְאֵה זֶה מָצָאתִי אָמְרָה קֹהֶלֶת אַחַת לְאַחַת לִמְצֹא חֶשְׁבּוֹן׃
    hebrewPlain: ראה זה מצאתי אמרה קהלת אחת לאחת למצא חשבון
    kjvRefs:
    - Ecclesiastes 7:27
    kjvOsis:
    - Eccl.7.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.28
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:28
    ref: Ecclesiastes 7:28
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 28
    ordinal: 20152
    text: which yet my soul sought, but I found not; one man among a thousand have I found; but a woman among all those have I not found.
    translation: JPS 1917
    original: אֲשֶׁר עוֹד־בִּקְשָׁה נַפְשִׁי וְלֹא מָצָאתִי אָדָם אֶחָד מֵאֶלֶף מָצָאתִי וְאִשָּׁה בְכָל־אֵלֶּה לֹא מָצָאתִי׃
    hebrewPlain: אשר עוד־בקשה נפשי ולא מצאתי אדם אחד מאלף מצאתי ואשה בכל־אלה לא מצאתי
    kjvRefs:
    - Ecclesiastes 7:28
    kjvOsis:
    - Eccl.7.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.7.29
    scripture: tanakh
    name: Tanakh Ecclesiastes 7:29
    ref: Ecclesiastes 7:29
    book: Eccl
    section: ketuvim
    chapter: 7
    verse: 29
    ordinal: 20153
    text: Behold, this only have I found, that God made man upright; but they have sought out many inventions.
    translation: JPS 1917
    original: לְבַד רְאֵה־זֶה מָצָאתִי אֲשֶׁר עָשָׂה הָאֱלֹהִים אֶת־הָאָדָם יָשָׁר וְהֵמָּה בִקְשׁוּ חִשְּׁבֹנוֹת רַבִּים׃
    hebrewPlain: לבד ראה־זה מצאתי אשר עשה האלהים את־האדם ישר והמה בקשו חשבנות רבים
    kjvRefs:
    - Ecclesiastes 7:29
    kjvOsis:
    - Eccl.7.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.7
- type: TanakhVerse
  data:
    osis: Eccl.8.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:1
    ref: Ecclesiastes 8:1
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 20154
    text: Who is as the wise man? and who knoweth the interpretation of a thing? A man’s wisdom maketh his face to shine, And the boldness of his face is changed.
    translation: JPS 1917
    original: מִי כְּהֶחָכָם וּמִי יוֹדֵעַ פֵּשֶׁר דָּבָר חָכְמַת אָדָם תָּאִיר פָּנָיו וְעֹז פָּנָיו יְשֻׁנֶּא׃
    hebrewPlain: מי כהחכם ומי יודע פשר דבר חכמת אדם תאיר פניו ועז פניו ישנא
    kjvRefs:
    - Ecclesiastes 8:1
    kjvOsis:
    - Eccl.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:2
    ref: Ecclesiastes 8:2
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 20155
    text: 'I [counsel thee]: keep the king’s command, and that in regard of the oath of God.'
    translation: JPS 1917
    original: אֲנִי פִּי־מֶלֶךְ שְׁמוֹר וְעַל דִּבְרַת שְׁבוּעַת אֱלֹהִים׃
    hebrewPlain: אני פי־מלך שמור ועל דברת שבועת אלהים
    kjvRefs:
    - Ecclesiastes 8:2
    kjvOsis:
    - Eccl.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:3
    ref: Ecclesiastes 8:3
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 20156
    text: Be not hasty to go out of his presence; stand not in an evil thing; for he doeth whatsoever pleaseth him.
    translation: JPS 1917
    original: אַל־תִּבָּהֵל מִפָּנָיו תֵּלֵךְ אַל־תַּעֲמֹד בְּדָבָר רָע כִּי כָּל־אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה׃
    hebrewPlain: אל־תבהל מפניו תלך אל־תעמד בדבר רע כי כל־אשר יחפץ יעשה
    kjvRefs:
    - Ecclesiastes 8:3
    kjvOsis:
    - Eccl.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:4
    ref: Ecclesiastes 8:4
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 20157
    text: 'Forasmuch as the king’s word hath power; and who may say unto him: ‘What doest thou?’'
    translation: JPS 1917
    original: בַּאֲשֶׁר דְּבַר־מֶלֶךְ שִׁלְטוֹן וּמִי יֹאמַר־לוֹ מַה־תַּעֲשֶׂה׃
    hebrewPlain: באשר דבר־מלך שלטון ומי יאמר־לו מה־תעשה
    kjvRefs:
    - Ecclesiastes 8:4
    kjvOsis:
    - Eccl.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:5
    ref: Ecclesiastes 8:5
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 20158
    text: Whoso keepeth the commandment shall know no evil thing; And a wise man’s heart discerneth time and judgment.
    translation: JPS 1917
    original: שׁוֹמֵר מִצְוָה לֹא יֵדַע דָּבָר רָע וְעֵת וּמִשְׁפָּט יֵדַע לֵב חָכָם׃
    hebrewPlain: שומר מצוה לא ידע דבר רע ועת ומשפט ידע לב חכם
    kjvRefs:
    - Ecclesiastes 8:5
    kjvOsis:
    - Eccl.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:6
    ref: Ecclesiastes 8:6
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 20159
    text: For to every matter there is a time and judgment; for the evil of man is great upon him.
    translation: JPS 1917
    original: כִּי לְכָל־חֵפֶץ יֵשׁ עֵת וּמִשְׁפָּט כִּי־רָעַת הָאָדָם רַבָּה עָלָיו׃
    hebrewPlain: כי לכל־חפץ יש עת ומשפט כי־רעת האדם רבה עליו
    kjvRefs:
    - Ecclesiastes 8:6
    kjvOsis:
    - Eccl.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:7
    ref: Ecclesiastes 8:7
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 20160
    text: For he knoweth not that which shall be; for even when it cometh to pass, who shall declare it unto him?
    translation: JPS 1917
    original: כִּי־אֵינֶנּוּ יֹדֵעַ מַה־שֶּׁיִּהְיֶה כִּי כַּאֲשֶׁר יִהְיֶה מִי יַגִּיד לוֹ׃
    hebrewPlain: כי־איננו ידע מה־שיהיה כי כאשר יהיה מי יגיד לו
    kjvRefs:
    - Ecclesiastes 8:7
    kjvOsis:
    - Eccl.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:8
    ref: Ecclesiastes 8:8
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 20161
    text: There is no man that hath power over the wind to retain the wind; neither hath he power over the day of death; and there is no discharge in war; neither shall wickedness deliver him that is given to it.
    translation: JPS 1917
    original: אֵין אָדָם שַׁלִּיט בָּרוּחַ לִכְלוֹא אֶת־הָרוּחַ וְאֵין שִׁלְטוֹן בְּיוֹם הַמָּוֶת וְאֵין מִשְׁלַחַת בַּמִּלְחָמָה וְלֹא־יְמַלֵּט רֶשַׁע אֶת־בְּעָלָיו׃
    hebrewPlain: אין אדם שליט ברוח לכלוא את־הרוח ואין שלטון ביום המות ואין משלחת במלחמה ולא־ימלט רשע את־בעליו
    kjvRefs:
    - Ecclesiastes 8:8
    kjvOsis:
    - Eccl.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:9
    ref: Ecclesiastes 8:9
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 20162
    text: All this have I seen, even applied my heart thereto, whatever the work that is done under the sun; what time one man had power over another to his hurt.
    translation: JPS 1917
    original: אֶת־כָּל־זֶה רָאִיתִי וְנָתוֹן אֶת־לִבִּי לְכָל־מַעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַּחַת הַשָּׁמֶשׁ עֵת אֲשֶׁר שָׁלַט הָאָדָם בְּאָדָם לְרַע לוֹ׃
    hebrewPlain: את־כל־זה ראיתי ונתון את־לבי לכל־מעשה אשר נעשה תחת השמש עת אשר שלט האדם באדם לרע לו
    kjvRefs:
    - Ecclesiastes 8:9
    kjvOsis:
    - Eccl.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:10
    ref: Ecclesiastes 8:10
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 20163
    text: And so I saw the wicked buried, and they entered into their rest; but they that had done right went away from the holy place, and were forgotten in the city; this also is vanity.
    translation: JPS 1917
    original: וּבְכֵן רָאִיתִי רְשָׁעִים קְבֻרִים וָבָאוּ וּמִמְּקוֹם קָדוֹשׁ יְהַלֵּכוּ וְיִשְׁתַּכְּחוּ בָעִיר אֲשֶׁר כֵּן־עָשׂוּ גַּם־זֶה הָבֶל׃
    hebrewPlain: ובכן ראיתי רשעים קברים ובאו וממקום קדוש יהלכו וישתכחו בעיר אשר כן־עשו גם־זה הבל
    kjvRefs:
    - Ecclesiastes 8:10
    kjvOsis:
    - Eccl.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:11
    ref: Ecclesiastes 8:11
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 20164
    text: Because sentence against an evil work is not executed speedily, therefore the heart of the sons of men is fully set in them to do evil;
    translation: JPS 1917
    original: אֲשֶׁר אֵין־נַעֲשָׂה פִתְגָם מַעֲשֵׂה הָרָעָה מְהֵרָה עַל־כֵּן מָלֵא לֵב בְּנֵי־הָאָדָם בָּהֶם לַעֲשׂוֹת רָע׃
    hebrewPlain: אשר אין־נעשה פתגם מעשה הרעה מהרה על־כן מלא לב בני־האדם בהם לעשות רע
    kjvRefs:
    - Ecclesiastes 8:11
    kjvOsis:
    - Eccl.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:12
    ref: Ecclesiastes 8:12
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 20165
    text: because a sinner doeth evil a hundred times, and prolongeth his days—though yet I know that it shall be well with them that fear God, that fear before Him;
    translation: JPS 1917
    original: אֲשֶׁר חֹטֶא עֹשֶׂה רָע מְאַת וּמַאֲרִיךְ לוֹ כִּי גַּם־יוֹדֵעַ אָנִי אֲשֶׁר יִהְיֶה־טּוֹב לְיִרְאֵי הָאֱלֹהִים אֲשֶׁר יִירְאוּ מִלְּפָנָיו׃
    hebrewPlain: אשר חטא עשה רע מאת ומאריך לו כי גם־יודע אני אשר יהיה־טוב ליראי האלהים אשר ייראו מלפניו
    kjvRefs:
    - Ecclesiastes 8:12
    kjvOsis:
    - Eccl.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:13
    ref: Ecclesiastes 8:13
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 20166
    text: but it shall not be well with the wicked, neither shall he prolong his days, which are as a shadow, because he feareth not before God.
    translation: JPS 1917
    original: וְטוֹב לֹא־יִהְיֶה לָרָשָׁע וְלֹא־יַאֲרִיךְ יָמִים כַּצֵּל אֲשֶׁר אֵינֶנּוּ יָרֵא מִלִּפְנֵי אֱלֹהִים׃
    hebrewPlain: וטוב לא־יהיה לרשע ולא־יאריך ימים כצל אשר איננו ירא מלפני אלהים
    kjvRefs:
    - Ecclesiastes 8:13
    kjvOsis:
    - Eccl.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:14
    ref: Ecclesiastes 8:14
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 20167
    text: 'There is a vanity which is done upon the earth: that there are righteous men, unto whom it happeneth according to the work of the wicked; again, there are wicked men, to whom it happeneth according to the work of the righteous—I said that this also is vanity.'
    translation: JPS 1917
    original: יֶשׁ־הֶבֶל אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ אֲשֶׁר יֵשׁ צַדִּיקִים אֲשֶׁר מַגִּיעַ אֲלֵהֶם כְּמַעֲשֵׂה הָרְשָׁעִים וְיֵשׁ רְשָׁעִים שֶׁמַּגִּיעַ אֲלֵהֶם כְּמַעֲשֵׂה הַצַּדִּיקִים אָמַרְתִּי שֶׁגַּם־זֶה הָבֶל׃
    hebrewPlain: יש־הבל אשר נעשה על־הארץ אשר יש צדיקים אשר מגיע אלהם כמעשה הרשעים ויש רשעים שמגיע אלהם כמעשה הצדיקים אמרתי שגם־זה הבל
    kjvRefs:
    - Ecclesiastes 8:14
    kjvOsis:
    - Eccl.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:15
    ref: Ecclesiastes 8:15
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 20168
    text: So I commended mirth, that a man hath no better thing under the sun, than to eat, and to drink, and to be merry, and that this should accompany him in his labour all the days of his life which God hath given him under the sun.
    translation: JPS 1917
    original: וְשִׁבַּחְתִּי אֲנִי אֶת־הַשִּׂמְחָה אֲשֶׁר אֵין־טוֹב לָאָדָם תַּחַת הַשֶּׁמֶשׁ כִּי אִם־לֶאֱכוֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ וְהוּא יִלְוֶנּוּ בַעֲמָלוֹ יְמֵי חַיָּיו אֲשֶׁר־נָתַן־לוֹ הָאֱלֹהִים תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: ושבחתי אני את־השמחה אשר אין־טוב לאדם תחת השמש כי אם־לאכול ולשתות ולשמוח והוא ילונו בעמלו ימי חייו אשר־נתן־לו האלהים תחת השמש
    kjvRefs:
    - Ecclesiastes 8:15
    kjvOsis:
    - Eccl.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:16
    ref: Ecclesiastes 8:16
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 20169
    text: When I applied my heart to know wisdom, and to see the business that is done upon the earth—for neither day nor night do men see sleep with their eyes—
    translation: JPS 1917
    original: כַּאֲשֶׁר נָתַתִּי אֶת־לִבִּי לָדַעַת חָכְמָה וְלִרְאוֹת אֶת־הָעִנְיָן אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ כִּי גַם בַּיּוֹם וּבַלַּיְלָה שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה׃
    hebrewPlain: כאשר נתתי את־לבי לדעת חכמה ולראות את־הענין אשר נעשה על־הארץ כי גם ביום ובלילה שנה בעיניו איננו ראה
    kjvRefs:
    - Ecclesiastes 8:16
    kjvOsis:
    - Eccl.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.8.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 8:17
    ref: Ecclesiastes 8:17
    book: Eccl
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 20170
    text: then I beheld all the work of God, that man cannot find out the work that is done under the sun; because though a man labour to seek it out, yet he shall not find it; yea further, though a wise man think to know it, yet shall he not be able to find it.
    translation: JPS 1917
    original: וְרָאִיתִי אֶת־כָּל־מַעֲשֵׂה הָאֱלֹהִים כִּי לֹא יוּכַל הָאָדָם לִמְצוֹא אֶת־הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת־הַשֶּׁמֶשׁ בְּשֶׁל אֲשֶׁר יַעֲמֹל הָאָדָם לְבַקֵּשׁ וְלֹא יִמְצָא וְגַם אִם־יֹאמַר הֶחָכָם לָדַעַת לֹא יוּכַל לִמְצֹא׃
    hebrewPlain: וראיתי את־כל־מעשה האלהים כי לא יוכל האדם למצוא את־המעשה אשר נעשה תחת־השמש בשל אשר יעמל האדם לבקש ולא ימצא וגם אם־יאמר החכם לדעת לא יוכל למצא
    kjvRefs:
    - Ecclesiastes 8:17
    kjvOsis:
    - Eccl.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.8
- type: TanakhVerse
  data:
    osis: Eccl.9.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:1
    ref: Ecclesiastes 9:1
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 20171
    text: 'For all this I laid to my heart, even to make clear all this: that the righteous, and the wise, and their works, are in the hand of God; whether it be love or hatred, man knoweth it not; all is before them.'
    translation: JPS 1917
    original: כִּי אֶת־כָּל־זֶה נָתַתִּי אֶל־לִבִּי וְלָבוּר אֶת־כָּל־זֶה אֲשֶׁר הַצַּדִּיקִים וְהַחֲכָמִים וַעֲבָדֵיהֶם בְּיַד הָאֱלֹהִים גַּם־אַהֲבָה גַם־שִׂנְאָה אֵין יוֹדֵעַ הָאָדָם הַכֹּל לִפְנֵיהֶם׃
    hebrewPlain: כי את־כל־זה נתתי אל־לבי ולבור את־כל־זה אשר הצדיקים והחכמים ועבדיהם ביד האלהים גם־אהבה גם־שנאה אין יודע האדם הכל לפניהם
    kjvRefs:
    - Ecclesiastes 9:1
    kjvOsis:
    - Eccl.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:2
    ref: Ecclesiastes 9:2
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 20172
    text: All things come alike to all; there is one event to the righteous and to the wicked; to the good and to the clean and to the unclean; to him that sacrificeth and to him that sacrificeth not; as is the good, so is the sinner, and he that sweareth, as he that feareth an oath.
    translation: JPS 1917
    original: הַכֹּל כַּאֲשֶׁר לַכֹּל מִקְרֶה אֶחָד לַצַּדִּיק וְלָרָשָׁע לַטּוֹב וְלַטָּהוֹר וְלַטָּמֵא וְלַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ כַּטּוֹב כַּחֹטֶא הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא׃
    hebrewPlain: הכל כאשר לכל מקרה אחד לצדיק ולרשע לטוב ולטהור ולטמא ולזבח ולאשר איננו זבח כטוב כחטא הנשבע כאשר שבועה ירא
    kjvRefs:
    - Ecclesiastes 9:2
    kjvOsis:
    - Eccl.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:3
    ref: Ecclesiastes 9:3
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 20173
    text: This is an evil in all that is done under the sun, that there is one event unto all; yea also, the heart of the sons of men is full of evil, and madness is in their heart while they live, and after that they go to the dead.
    translation: JPS 1917
    original: זֶה רָע בְּכֹל אֲשֶׁר־נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ כִּי־מִקְרֶה אֶחָד לַכֹּל וְגַם לֵב בְּנֵי־הָאָדָם מָלֵא־רָע וְהוֹלֵלוֹת בִּלְבָבָם בְּחַיֵּיהֶם וְאַחֲרָיו אֶל־הַמֵּתִים׃
    hebrewPlain: זה רע בכל אשר־נעשה תחת השמש כי־מקרה אחד לכל וגם לב בני־האדם מלא־רע והוללות בלבבם בחייהם ואחריו אל־המתים
    kjvRefs:
    - Ecclesiastes 9:3
    kjvOsis:
    - Eccl.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:4
    ref: Ecclesiastes 9:4
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 20174
    text: For to him that is joined to all the living there is hope; for a living dog is better than a dead lion.
    translation: JPS 1917
    original: כִּי־מִי אֲשֶׁר יבחר [יְחֻבַּר] אֶל כָּל־הַחַיִּים יֵשׁ בִּטָּחוֹן כִּי־לְכֶלֶב חַי הוּא טוֹב מִן־הָאַרְיֵה הַמֵּת׃
    hebrewPlain: כי־מי אשר יבחר [יחבר] אל כל־החיים יש בטחון כי־לכלב חי הוא טוב מן־האריה המת
    kjvRefs:
    - Ecclesiastes 9:4
    kjvOsis:
    - Eccl.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:5
    ref: Ecclesiastes 9:5
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 20175
    text: For the living know that they shall die; but the dead know not any thing, neither have they any more a reward; for the memory of them is forgotten.
    translation: JPS 1917
    original: כִּי הַחַיִּים יוֹדְעִים שֶׁיָּמֻתוּ וְהַמֵּתִים אֵינָם יוֹדְעִים מְאוּמָה וְאֵין־עוֹד לָהֶם שָׂכָר כִּי נִשְׁכַּח זִכְרָם׃
    hebrewPlain: כי החיים יודעים שימתו והמתים אינם יודעים מאומה ואין־עוד להם שכר כי נשכח זכרם
    kjvRefs:
    - Ecclesiastes 9:5
    kjvOsis:
    - Eccl.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:6
    ref: Ecclesiastes 9:6
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 20176
    text: As well their love, as their hatred and their envy, is long ago perished; neither have they any more a portion for ever in any thing that is done under the sun.
    translation: JPS 1917
    original: גַּם אַהֲבָתָם גַּם־שִׂנְאָתָם גַּם־קִנְאָתָם כְּבָר אָבָדָה וְחֵלֶק אֵין־לָהֶם עוֹד לְעוֹלָם בְּכֹל אֲשֶׁר־נַעֲשָׂה תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: גם אהבתם גם־שנאתם גם־קנאתם כבר אבדה וחלק אין־להם עוד לעולם בכל אשר־נעשה תחת השמש
    kjvRefs:
    - Ecclesiastes 9:6
    kjvOsis:
    - Eccl.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:7
    ref: Ecclesiastes 9:7
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 20177
    text: Go thy way, eat thy bread with joy, And drink thy wine with a merry heart; For God hath already accepted thy works.
    translation: JPS 1917
    original: לֵךְ אֱכֹל בְּשִׂמְחָה לַחְמֶךָ וּשֲׁתֵה בְלֶב־טוֹב יֵינֶךָ כִּי כְבָר רָצָה הָאֱלֹהִים אֶת־מַעֲשֶׂיךָ׃
    hebrewPlain: לך אכל בשמחה לחמך ושתה בלב־טוב יינך כי כבר רצה האלהים את־מעשיך
    kjvRefs:
    - Ecclesiastes 9:7
    kjvOsis:
    - Eccl.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:8
    ref: Ecclesiastes 9:8
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 20178
    text: Let thy garments be always white; And let thy head lack no oil.
    translation: JPS 1917
    original: בְּכָל־עֵת יִהְיוּ בְגָדֶיךָ לְבָנִים וְשֶׁמֶן עַל־רֹאשְׁךָ אַל־יֶחְסָר׃
    hebrewPlain: בכל־עת יהיו בגדיך לבנים ושמן על־ראשך אל־יחסר
    kjvRefs:
    - Ecclesiastes 9:8
    kjvOsis:
    - Eccl.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:9
    ref: Ecclesiastes 9:9
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 20179
    text: Enjoy life with the wife whom thou lovest all the days of the life of thy vanity, which He hath given thee under the sun, all the days of thy vanity; for that is thy portion in life, and in thy labour wherein thou labourest under the sun.
    translation: JPS 1917
    original: רְאֵה חַיִּים עִם־אִשָּׁה אֲשֶׁר־אָהַבְתָּ כָּל־יְמֵי חַיֵּי הֶבְלֶךָ אֲשֶׁר נָתַן־לְךָ תַּחַת הַשֶּׁמֶשׁ כֹּל יְמֵי הֶבְלֶךָ כִּי הוּא חֶלְקְךָ בַּחַיִּים וּבַעֲמָלְךָ אֲשֶׁר־אַתָּה עָמֵל תַּחַת הַשָּׁמֶשׁ׃
    hebrewPlain: ראה חיים עם־אשה אשר־אהבת כל־ימי חיי הבלך אשר נתן־לך תחת השמש כל ימי הבלך כי הוא חלקך בחיים ובעמלך אשר־אתה עמל תחת השמש
    kjvRefs:
    - Ecclesiastes 9:9
    kjvOsis:
    - Eccl.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:10
    ref: Ecclesiastes 9:10
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 20180
    text: Whatsoever thy hand attaineth to do by thy strength, that do; for there is no work, nor device, nor knowledge, nor wisdom, in the grave, whither thou goest.
    translation: JPS 1917
    original: כֹּל אֲשֶׁר תִּמְצָא יָדְךָ לַעֲשׂוֹת בְּכֹחֲךָ עֲשֵׂה כִּי אֵין מַעֲשֶׂה וְחֶשְׁבּוֹן וְדַעַת וְחָכְמָה בִּשְׁאוֹל אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה׃
    hebrewPlain: כל אשר תמצא ידך לעשות בכחך עשה כי אין מעשה וחשבון ודעת וחכמה בשאול אשר אתה הלך שמה
    kjvRefs:
    - Ecclesiastes 9:10
    kjvOsis:
    - Eccl.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:11
    ref: Ecclesiastes 9:11
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 20181
    text: I returned, and saw under the sun, that the race is not to the swift, nor the battle to the strong, neither yet bread to the wise, nor yet riches to men of understanding, nor yet favour to men of skill; but time and chance happeneth to them all.
    translation: JPS 1917
    original: שַׁבְתִּי וְרָאֹה תַחַת־הַשֶּׁמֶשׁ כִּי לֹא לַקַּלִּים הַמֵּרוֹץ וְלֹא לַגִּבּוֹרִים הַמִּלְחָמָה וְגַם לֹא לַחֲכָמִים לֶחֶם וְגַם לֹא לַנְּבֹנִים עֹשֶׁר וְגַם לֹא לַיֹּדְעִים חֵן כִּי־עֵת וָפֶגַע יִקְרֶה אֶת־כֻּלָּם׃
    hebrewPlain: שבתי וראה תחת־השמש כי לא לקלים המרוץ ולא לגבורים המלחמה וגם לא לחכמים לחם וגם לא לנבנים עשר וגם לא לידעים חן כי־עת ופגע יקרה את־כלם
    kjvRefs:
    - Ecclesiastes 9:11
    kjvOsis:
    - Eccl.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:12
    ref: Ecclesiastes 9:12
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 20182
    text: For man also knoweth not his time; as the fishes that are taken in an evil net, and as the birds that are caught in the snare, even so are the sons of men snared in an evil time, when it falleth suddenly upon them.
    translation: JPS 1917
    original: כִּי גַּם לֹא־יֵדַע הָאָדָם אֶת־עִתּוֹ כַּדָּגִים שֶׁנֶּאֱחָזִים בִּמְצוֹדָה רָעָה וְכַצִּפֳּרִים הָאֲחֻזוֹת בַּפָּח כָּהֵם יוּקָשִׁים בְּנֵי הָאָדָם לְעֵת רָעָה כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם׃
    hebrewPlain: כי גם לא־ידע האדם את־עתו כדגים שנאחזים במצודה רעה וכצפרים האחזות בפח כהם יוקשים בני האדם לעת רעה כשתפול עליהם פתאם
    kjvRefs:
    - Ecclesiastes 9:12
    kjvOsis:
