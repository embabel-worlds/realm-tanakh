  data:
    osis: Eccl.12.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:10
    ref: Ecclesiastes 12:10
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 10
    ordinal: 20228
    text: Koheleth sought to find out words of delight, and that which was written uprightly, even words of truth.
    translation: JPS 1917
    original: בִּקֵּשׁ קֹהֶלֶת לִמְצֹא דִּבְרֵי־חֵפֶץ וְכָתוּב יֹשֶׁר דִּבְרֵי אֱמֶת׃
    hebrewPlain: בקש קהלת למצא דברי־חפץ וכתוב ישר דברי אמת
    kjvRefs:
    - Ecclesiastes 12:10
    kjvOsis:
    - Eccl.12.10
