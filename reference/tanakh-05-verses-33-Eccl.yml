  data:
    osis: Eccl.12.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:9
    ref: Ecclesiastes 12:9
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 9
    ordinal: 20227
    text: And besides that Koheleth was wise, he also taught the people knowledge; yea, he pondered, and sought out, and set in order many proverbs.
    translation: JPS 1917
    original: וְיֹתֵר שֶׁהָיָה קֹהֶלֶת חָכָם עוֹד לִמַּד־דַּעַת אֶת־הָעָם וְאִזֵּן וְחִקֵּר תִּקֵּן מְשָׁלִים הַרְבֵּה׃
    hebrewPlain: ויתר שהיה קהלת חכם עוד למד־דעת את־העם ואזן וחקר תקן משלים הרבה
    kjvRefs:
    - Ecclesiastes 12:9
    kjvOsis:
    - Eccl.12.9
