- type: TanakhVerse
  data:
    osis: Eccl.12.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:11
    ref: Ecclesiastes 12:11
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 11
    ordinal: 20229
    text: The words of the wise are as goads, and as nails well fastened are those that are composed in collections; they are given from one shepherd.
    translation: JPS 1917
    original: דִּבְרֵי חֲכָמִים כַּדָּרְבֹנוֹת וּכְמַשְׂמְרוֹת נְטוּעִים בַּעֲלֵי אֲסֻפּוֹת נִתְּנוּ מֵרֹעֶה אֶחָד׃
    hebrewPlain: דברי חכמים כדרבנות וכמשמרות נטועים בעלי אספות נתנו מרעה אחד
    kjvRefs:
    - Ecclesiastes 12:11
    kjvOsis:
    - Eccl.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:12
    ref: Ecclesiastes 12:12
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 12
    ordinal: 20230
    text: 'And furthermore, my son, be admonished: of making many books there is no end; and much study is a weariness of the flesh.'
    translation: JPS 1917
    original: וְיֹתֵר מֵהֵמָּה בְּנִי הִזָּהֵר עֲשׂוֹת סְפָרִים הַרְבֵּה אֵין קֵץ וְלַהַג הַרְבֵּה יְגִעַת בָּשָׂר׃
    hebrewPlain: ויתר מהמה בני הזהר עשות ספרים הרבה אין קץ ולהג הרבה יגעת בשר
    kjvRefs:
    - Ecclesiastes 12:12
    kjvOsis:
    - Eccl.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:13
    ref: Ecclesiastes 12:13
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 13
    ordinal: 20231
    text: 'The end of the matter, all having been heard: fear God, and keep His commandments; for this is the whole man.'
    translation: JPS 1917
    original: סוֹף דָּבָר הַכֹּל נִשְׁמָע אֶת־הָאֱלֹהִים יְרָא וְאֶת־מִצְוֺתָיו שְׁמוֹר כִּי־זֶה כָּל־הָאָדָם׃
    hebrewPlain: סוף דבר הכל נשמע את־האלהים ירא ואת־מצותיו שמור כי־זה כל־האדם
    kjvRefs:
    - Ecclesiastes 12:13
    kjvOsis:
    - Eccl.12.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:14
    ref: Ecclesiastes 12:14
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 14
    ordinal: 20232
    text: 'For God shall bring every work into the judgment concerning every hidden thing, whether it be good or whether it be evil.[The end of the matter, all having been heard: fear God, and keep His Commandments; for this is the whole man.]'
    translation: JPS 1917
    original: כִּי אֶת־כָּל־מַעֲשֶׂה הָאֱלֹהִים יָבִא בְמִשְׁפָּט עַל כָּל־נֶעְלָם אִם־טוֹב וְאִם־רָע׃[סוף דבר הכל נשמע את־האלהים ירא ואת־מצותיו שמור כי־זה כל־האדם]
    hebrewPlain: כי את־כל־מעשה האלהים יבא במשפט על כל־נעלם אם־טוב ואם־רע[סוף דבר הכל נשמע את־האלהים ירא ואת־מצותיו שמור כי־זה כל־האדם]
    kjvRefs:
    - Ecclesiastes 12:14
    kjvOsis:
    - Eccl.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
