- type: TanakhVerse
  data:
    osis: Eccl.1.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:7
    ref: Ecclesiastes 1:7
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 20017
    text: All the rivers run into the sea, Yet the sea is not full; Unto the place whither the rivers go, Thither they go again.
    translation: JPS 1917
    original: כָּל־הַנְּחָלִים הֹלְכִים אֶל־הַיָּם וְהַיָּם אֵינֶנּוּ מָלֵא אֶל־מְקוֹם שֶׁהַנְּחָלִים הֹלְכִים שָׁם הֵם שָׁבִים לָלָכֶת׃
    hebrewPlain: כל־הנחלים הלכים אל־הים והים איננו מלא אל־מקום שהנחלים הלכים שם הם שבים ללכת
    kjvRefs:
