- type: TanakhVerse
  data:
    osis: Eccl.1.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:8
    ref: Ecclesiastes 1:8
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 20018
    text: All things toil to weariness; Man cannot utter it, The eye is not satisfied with seeing, Nor the ear filled with hearing.
    translation: JPS 1917
    original: כָּל־הַדְּבָרִים יְגֵעִים לֹא־יוּכַל אִישׁ לְדַבֵּר לֹא־תִשְׂבַּע עַיִן לִרְאוֹת וְלֹא־תִמָּלֵא אֹזֶן מִשְּׁמֹעַ׃
    hebrewPlain: כל־הדברים יגעים לא־יוכל איש לדבר לא־תשבע עין לראות ולא־תמלא אזן משמע
    kjvRefs:
    - Ecclesiastes 1:8
    kjvOsis:
    - Eccl.1.8
