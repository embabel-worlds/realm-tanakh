    name: Tanakh Ecclesiastes 9:13
    ref: Ecclesiastes 9:13
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 20183
    text: 'This also have I seen as wisdom under the sun, and it seemed great unto me:'
    translation: JPS 1917
    original: גַּם־זֹה רָאִיתִי חָכְמָה תַּחַת הַשָּׁמֶשׁ וּגְדוֹלָה הִיא אֵלָי׃
    hebrewPlain: גם־זה ראיתי חכמה תחת השמש וגדולה היא אלי
    kjvRefs:
    - Ecclesiastes 9:13
    kjvOsis:
    - Eccl.9.13
