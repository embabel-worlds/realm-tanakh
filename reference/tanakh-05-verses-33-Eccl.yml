    to:
      type: TanakhChapter
      osis: Eccl.1
- type: TanakhVerse
  data:
    osis: Eccl.1.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 1:10
    ref: Ecclesiastes 1:10
    book: Eccl
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 20020
    text: 'Is there a thing whereof it is said: ‘See, this is new’?—it hath been already, in the ages which were before us.'
    translation: JPS 1917
    original: יֵשׁ דָּבָר שֶׁיֹּאמַר רְאֵה־זֶה חָדָשׁ הוּא כְּבָר הָיָה לְעֹלָמִים אֲשֶׁר הָיָה מִלְּפָנֵנוּ׃
    hebrewPlain: יש דבר שיאמר ראה־זה חדש הוא כבר היה לעלמים אשר היה מלפננו
    kjvRefs:
    - Ecclesiastes 1:10
    kjvOsis:
    - Eccl.1.10
  relations:
