- type: TanakhVerse
  data:
    osis: Eccl.9.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:14
    ref: Ecclesiastes 9:14
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 20184
    text: there was a little city, and few men within it; and there came a great king against it, and besieged it, and built great bulwarks against it;
    translation: JPS 1917
    original: עִיר קְטַנָּה וַאֲנָשִׁים בָּהּ מְעָט וּבָא־אֵלֶיהָ מֶלֶךְ גָּדוֹל וְסָבַב אֹתָהּ וּבָנָה עָלֶיהָ מְצוֹדִים גְּדֹלִים׃
    hebrewPlain: עיר קטנה ואנשים בה מעט ובא־אליה מלך גדול וסבב אתה ובנה עליה מצודים גדלים
    kjvRefs:
    - Ecclesiastes 9:14
    kjvOsis:
    - Eccl.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:15
    ref: Ecclesiastes 9:15
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 20185
    text: now there was found in it a man poor and wise, and he by his wisdom delivered the city; yet no man remembered that same poor man.
    translation: JPS 1917
    original: וּמָצָא בָהּ אִישׁ מִסְכֵּן חָכָם וּמִלַּט־הוּא אֶת־הָעִיר בְּחָכְמָתוֹ וְאָדָם לֹא זָכַר אֶת־הָאִישׁ הַמִּסְכֵּן הַהּוּא׃
    hebrewPlain: ומצא בה איש מסכן חכם ומלט־הוא את־העיר בחכמתו ואדם לא זכר את־האיש המסכן ההוא
    kjvRefs:
    - Ecclesiastes 9:15
    kjvOsis:
    - Eccl.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:16
    ref: Ecclesiastes 9:16
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 20186
    text: 'Then said I: ‘Wisdom is better than strength; nevertheless the poor man’s wisdom is despised, and his words are not heard.’'
    translation: JPS 1917
    original: וְאָמַרְתִּי אָנִי טוֹבָה חָכְמָה מִגְּבוּרָה וְחָכְמַת הַמִּסְכֵּן בְּזוּיָה וּדְבָרָיו אֵינָם נִשְׁמָעִים׃
    hebrewPlain: ואמרתי אני טובה חכמה מגבורה וחכמת המסכן בזויה ודבריו אינם נשמעים
    kjvRefs:
    - Ecclesiastes 9:16
    kjvOsis:
    - Eccl.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:17
    ref: Ecclesiastes 9:17
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 20187
    text: The words of the wise spoken in quiet Are more acceptable than the cry of a ruler among fools.
    translation: JPS 1917
    original: דִּבְרֵי חֲכָמִים בְּנַחַת נִשְׁמָעִים מִזַּעֲקַת מוֹשֵׁל בַּכְּסִילִים׃
    hebrewPlain: דברי חכמים בנחת נשמעים מזעקת מושל בכסילים
    kjvRefs:
    - Ecclesiastes 9:17
    kjvOsis:
    - Eccl.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.9.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 9:18
    ref: Ecclesiastes 9:18
    book: Eccl
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 20188
    text: Wisdom is better than weapons of war; But one sinner destroyeth much good.
    translation: JPS 1917
    original: טוֹבָה חָכְמָה מִכְּלֵי קְרָב וְחוֹטֶא אֶחָד יְאַבֵּד טוֹבָה הַרְבֵּה׃
    hebrewPlain: טובה חכמה מכלי קרב וחוטא אחד יאבד טובה הרבה
    kjvRefs:
    - Ecclesiastes 9:18
    kjvOsis:
    - Eccl.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.9
- type: TanakhVerse
  data:
    osis: Eccl.10.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:1
    ref: Ecclesiastes 10:1
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 20189
    text: Dead flies make the ointment of the perfumer fetid and putrid; So doth a little folly outweigh wisdom and honour.
    translation: JPS 1917
    original: זְבוּבֵי מָוֶת יַבְאִישׁ יַבִּיעַ שֶׁמֶן רוֹקֵחַ יָקָר מֵחָכְמָה מִכָּבוֹד סִכְלוּת מְעָט׃
    hebrewPlain: זבובי מות יבאיש יביע שמן רוקח יקר מחכמה מכבוד סכלות מעט
    kjvRefs:
    - Ecclesiastes 10:1
    kjvOsis:
    - Eccl.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:2
    ref: Ecclesiastes 10:2
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 20190
    text: A wise man’s understanding is at his right hand; but a fool’s understanding at his left.
    translation: JPS 1917
    original: לֵב חָכָם לִימִינוֹ וְלֵב כְּסִיל לִשְׂמֹאלוֹ׃
    hebrewPlain: לב חכם לימינו ולב כסיל לשמאלו
    kjvRefs:
    - Ecclesiastes 10:2
    kjvOsis:
    - Eccl.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:3
    ref: Ecclesiastes 10:3
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 20191
    text: Yea also, when a fool walketh by the way, his understanding faileth him, and he saith to every one that he is a fool.
    translation: JPS 1917
    original: וְגַם־בַּדֶּרֶךְ כשהסכל [כְּשֶׁסָּכָל] הֹלֵךְ לִבּוֹ חָסֵר וְאָמַר לַכֹּל סָכָל הוּא׃
    hebrewPlain: וגם־בדרך כשהסכל [כשסכל] הלך לבו חסר ואמר לכל סכל הוא
    kjvRefs:
    - Ecclesiastes 10:3
    kjvOsis:
    - Eccl.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:4
    ref: Ecclesiastes 10:4
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 20192
    text: If the spirit of the ruler rise up against thee, leave not thy place; for gentleness allayeth great offences.
    translation: JPS 1917
    original: אִם־רוּחַ הַמּוֹשֵׁל תַּעֲלֶה עָלֶיךָ מְקוֹמְךָ אַל־תַּנַּח כִּי מַרְפֵּא יַנִּיחַ חֲטָאִים גְּדוֹלִים׃
    hebrewPlain: אם־רוח המושל תעלה עליך מקומך אל־תנח כי מרפא יניח חטאים גדולים
    kjvRefs:
    - Ecclesiastes 10:4
    kjvOsis:
    - Eccl.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:5
    ref: Ecclesiastes 10:5
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 20193
    text: 'There is an evil which I have seen under the sun, like an error which proceedeth from a ruler:'
    translation: JPS 1917
    original: יֵשׁ רָעָה רָאִיתִי תַּחַת הַשָּׁמֶשׁ כִּשְׁגָגָה שֶׁיֹּצָא מִלִּפְנֵי הַשַּׁלִּיט׃
    hebrewPlain: יש רעה ראיתי תחת השמש כשגגה שיצא מלפני השליט
    kjvRefs:
    - Ecclesiastes 10:5
    kjvOsis:
    - Eccl.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:6
    ref: Ecclesiastes 10:6
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 20194
    text: Folly is set on great heights, and the rich sit in low place.
    translation: JPS 1917
    original: נִתַּן הַסֶּכֶל בַּמְּרוֹמִים רַבִּים וַעֲשִׁירִים בַּשֵּׁפֶל יֵשֵׁבוּ׃
    hebrewPlain: נתן הסכל במרומים רבים ועשירים בשפל ישבו
    kjvRefs:
    - Ecclesiastes 10:6
    kjvOsis:
    - Eccl.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:7
    ref: Ecclesiastes 10:7
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 20195
    text: I have seen servants upon horses, and princes walking as servants upon the earth.
    translation: JPS 1917
    original: רָאִיתִי עֲבָדִים עַל־סוּסִים וְשָׂרִים הֹלְכִים כַּעֲבָדִים עַל־הָאָרֶץ׃
    hebrewPlain: ראיתי עבדים על־סוסים ושרים הלכים כעבדים על־הארץ
    kjvRefs:
    - Ecclesiastes 10:7
    kjvOsis:
    - Eccl.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:8
    ref: Ecclesiastes 10:8
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 20196
    text: He that diggeth a pit shall fall into it; and whoso breaketh through a fence, a serpent shall bite him.
    translation: JPS 1917
    original: חֹפֵר גּוּמָּץ בּוֹ יִפּוֹל וּפֹרֵץ גָּדֵר יִשְּׁכֶנּוּ נָחָשׁ׃
    hebrewPlain: חפר גומץ בו יפול ופרץ גדר ישכנו נחש
    kjvRefs:
    - Ecclesiastes 10:8
    kjvOsis:
    - Eccl.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:9
    ref: Ecclesiastes 10:9
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 20197
    text: Whoso quarrieth stones shall be hurt therewith; and he that cleaveth wood is endangered thereby.
    translation: JPS 1917
    original: מַסִּיעַ אֲבָנִים יֵעָצֵב בָּהֶם בּוֹקֵעַ עֵצִים יִסָּכֶן בָּם׃
    hebrewPlain: מסיע אבנים יעצב בהם בוקע עצים יסכן בם
    kjvRefs:
    - Ecclesiastes 10:9
    kjvOsis:
    - Eccl.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:10
    ref: Ecclesiastes 10:10
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 20198
    text: If the iron be blunt, and one do not whet the edge, then must he put to more strength; but wisdom is profitable to direct.
    translation: JPS 1917
    original: אִם־קֵהָה הַבַּרְזֶל וְהוּא לֹא־פָנִים קִלְקַל וַחֲיָלִים יְגַבֵּר וְיִתְרוֹן הכשיר [הַכְשֵׁר] חָכְמָה׃
    hebrewPlain: אם־קהה הברזל והוא לא־פנים קלקל וחילים יגבר ויתרון הכשיר [הכשר] חכמה
    kjvRefs:
    - Ecclesiastes 10:10
    kjvOsis:
    - Eccl.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.11
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:11
    ref: Ecclesiastes 10:11
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 20199
    text: If the serpent bite before it is charmed, then the charmer hath no advantage.
    translation: JPS 1917
    original: אִם־יִשֹּׁךְ הַנָּחָשׁ בְּלוֹא־לָחַשׁ וְאֵין יִתְרוֹן לְבַעַל הַלָּשׁוֹן׃
    hebrewPlain: אם־ישך הנחש בלוא־לחש ואין יתרון לבעל הלשון
    kjvRefs:
    - Ecclesiastes 10:11
    kjvOsis:
    - Eccl.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.12
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:12
    ref: Ecclesiastes 10:12
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 20200
    text: The words of a wise man’s mouth are gracious; but the lips of a fool will swallow up himself.
    translation: JPS 1917
    original: דִּבְרֵי פִי־חָכָם חֵן וְשִׂפְתוֹת כְּסִיל תְּבַלְּעֶנּוּ׃
    hebrewPlain: דברי פי־חכם חן ושפתות כסיל תבלענו
    kjvRefs:
    - Ecclesiastes 10:12
    kjvOsis:
    - Eccl.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.13
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:13
    ref: Ecclesiastes 10:13
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 20201
    text: The beginning of the words of his mouth is foolishness; and the end of his talk is grievous madness.
    translation: JPS 1917
    original: תְּחִלַּת דִּבְרֵי־פִיהוּ סִכְלוּת וְאַחֲרִית פִּיהוּ הוֹלֵלוּת רָעָה׃
    hebrewPlain: תחלת דברי־פיהו סכלות ואחרית פיהו הוללות רעה
    kjvRefs:
    - Ecclesiastes 10:13
    kjvOsis:
    - Eccl.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.14
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:14
    ref: Ecclesiastes 10:14
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 20202
    text: A fool also multiplieth words; yet man knoweth not what shall be; And that which shall be after him, Who can tell him?
    translation: JPS 1917
    original: וְהַסָּכָל יַרְבֶּה דְבָרִים לֹא־יֵדַע הָאָדָם מַה־שֶׁיִּהְיֶה וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו מִי יַגִּיד לוֹ׃
    hebrewPlain: והסכל ירבה דברים לא־ידע האדם מה־שיהיה ואשר יהיה מאחריו מי יגיד לו
    kjvRefs:
    - Ecclesiastes 10:14
    kjvOsis:
    - Eccl.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.15
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:15
    ref: Ecclesiastes 10:15
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 20203
    text: The labour of fools wearieth every one of them, for he knoweth not how to go to the city.
    translation: JPS 1917
    original: עֲמַל הַכְּסִילִים תְּיַגְּעֶנּוּ אֲשֶׁר לֹא־יָדַע לָלֶכֶת אֶל־עִיר׃
    hebrewPlain: עמל הכסילים תיגענו אשר לא־ידע ללכת אל־עיר
    kjvRefs:
    - Ecclesiastes 10:15
    kjvOsis:
    - Eccl.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.16
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:16
    ref: Ecclesiastes 10:16
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 20204
    text: Woe to thee, O land, when thy king is a boy, And thy princes feast in the morning! .
    translation: JPS 1917
    original: אִי־לָךְ אֶרֶץ שֶׁמַּלְכֵּךְ נָעַר וְשָׂרַיִךְ בַּבֹּקֶר יֹאכֵלוּ׃
    hebrewPlain: אי־לך ארץ שמלכך נער ושריך בבקר יאכלו
    kjvRefs:
    - Ecclesiastes 10:16
    kjvOsis:
    - Eccl.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.17
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:17
    ref: Ecclesiastes 10:17
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 17
    ordinal: 20205
    text: Happy art thou, O land, when thy king is a free man, And thy princes eat in due season, In strength, and not in drunkenness!
    translation: JPS 1917
    original: אַשְׁרֵיךְ אֶרֶץ שֶׁמַּלְכֵּךְ בֶּן־חוֹרִים וְשָׂרַיִךְ בָּעֵת יֹאכֵלוּ בִּגְבוּרָה וְלֹא בַשְּׁתִי׃
    hebrewPlain: אשריך ארץ שמלכך בן־חורים ושריך בעת יאכלו בגבורה ולא בשתי
    kjvRefs:
    - Ecclesiastes 10:17
    kjvOsis:
    - Eccl.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.18
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:18
    ref: Ecclesiastes 10:18
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 20206
    text: By slothfulness the rafters sink in; And through idleness of the hands the house leaketh.
    translation: JPS 1917
    original: בַּעֲצַלְתַּיִם יִמַּךְ הַמְּקָרֶה וּבְשִׁפְלוּת יָדַיִם יִדְלֹף הַבָּיִת׃
    hebrewPlain: בעצלתים ימך המקרה ובשפלות ידים ידלף הבית
    kjvRefs:
    - Ecclesiastes 10:18
    kjvOsis:
    - Eccl.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.19
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:19
    ref: Ecclesiastes 10:19
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 19
    ordinal: 20207
    text: A feast is made for laughter, And wine maketh glad the life; And money answereth all things.
    translation: JPS 1917
    original: לִשְׂחוֹק עֹשִׂים לֶחֶם וְיַיִן יְשַׂמַּח חַיִּים וְהַכֶּסֶף יַעֲנֶה אֶת־הַכֹּל׃
    hebrewPlain: לשחוק עשים לחם ויין ישמח חיים והכסף יענה את־הכל
    kjvRefs:
    - Ecclesiastes 10:19
    kjvOsis:
    - Eccl.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.10.20
    scripture: tanakh
    name: Tanakh Ecclesiastes 10:20
    ref: Ecclesiastes 10:20
    book: Eccl
    section: ketuvim
    chapter: 10
    verse: 20
    ordinal: 20208
    text: Curse not the king, no, not in thy thought, And curse not the rich in thy bedchamber; For a bird of the air shall carry the voice, And that which hath wings shall tell the matter.
    translation: JPS 1917
    original: גַּם בְּמַדָּעֲךָ מֶלֶךְ אַל־תְּקַלֵּל וּבְחַדְרֵי מִשְׁכָּבְךָ אַל־תְּקַלֵּל עָשִׁיר כִּי עוֹף הַשָּׁמַיִם יוֹלִיךְ אֶת־הַקּוֹל וּבַעַל הכנפים [כְּנָפַיִם] יַגֵּיד דָּבָר׃
    hebrewPlain: גם במדעך מלך אל־תקלל ובחדרי משכבך אל־תקלל עשיר כי עוף השמים יוליך את־הקול ובעל הכנפים [כנפים] יגיד דבר
    kjvRefs:
    - Ecclesiastes 10:20
    kjvOsis:
    - Eccl.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.10
- type: TanakhVerse
  data:
    osis: Eccl.11.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:1
    ref: Ecclesiastes 11:1
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 20209
    text: Cast thy bread upon the waters, For thou shalt find it after many days.
    translation: JPS 1917
    original: שַׁלַּח לַחְמְךָ עַל־פְּנֵי הַמָּיִם כִּי־בְרֹב הַיָּמִים תִּמְצָאֶנּוּ׃
    hebrewPlain: שלח לחמך על־פני המים כי־ברב הימים תמצאנו
    kjvRefs:
    - Ecclesiastes 11:1
    kjvOsis:
    - Eccl.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:2
    ref: Ecclesiastes 11:2
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 20210
    text: Divide a portion into seven, yea, even into eight; For thou knowest not what evil shall be upon the earth.
    translation: JPS 1917
    original: תֶּן־חֵלֶק לְשִׁבְעָה וְגַם לִשְׁמוֹנָה כִּי לֹא תֵדַע מַה־יִּהְיֶה רָעָה עַל־הָאָרֶץ׃
    hebrewPlain: תן־חלק לשבעה וגם לשמונה כי לא תדע מה־יהיה רעה על־הארץ
    kjvRefs:
    - Ecclesiastes 11:2
    kjvOsis:
    - Eccl.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:3
    ref: Ecclesiastes 11:3
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 20211
    text: If the clouds be full of rain, They empty themselves upon the earth; And if a tree fall in the south, or in the north, In the place where the tree falleth, there shall it be.
    translation: JPS 1917
    original: אִם־יִמָּלְאוּ הֶעָבִים גֶּשֶׁם עַל־הָאָרֶץ יָרִיקוּ וְאִם־יִפּוֹל עֵץ בַּדָּרוֹם וְאִם בַּצָּפוֹן מְקוֹם שֶׁיִּפּוֹל הָעֵץ שָׁם יְהוּא׃
    hebrewPlain: אם־ימלאו העבים גשם על־הארץ יריקו ואם־יפול עץ בדרום ואם בצפון מקום שיפול העץ שם יהוא
    kjvRefs:
    - Ecclesiastes 11:3
    kjvOsis:
    - Eccl.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:4
    ref: Ecclesiastes 11:4
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 20212
    text: He that observeth the wind shall not sow; And he that regardeth the clouds shall not reap.
    translation: JPS 1917
    original: שֹׁמֵר רוּחַ לֹא יִזְרָע וְרֹאֶה בֶעָבִים לֹא יִקְצוֹר׃
    hebrewPlain: שמר רוח לא יזרע וראה בעבים לא יקצור
    kjvRefs:
    - Ecclesiastes 11:4
    kjvOsis:
    - Eccl.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:5
    ref: Ecclesiastes 11:5
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 20213
    text: As thou knowest not what is the way of the wind, Nor how the bones do grow in the womb of her that is with child; Even so thou knowest not the work of God Who doeth all things.
    translation: JPS 1917
    original: כַּאֲשֶׁר אֵינְךָ יוֹדֵעַ מַה־דֶּרֶךְ הָרוּחַ כַּעֲצָמִים בְּבֶטֶן הַמְּלֵאָה כָּכָה לֹא תֵדַע אֶת־מַעֲשֵׂה הָאֱלֹהִים אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל׃
    hebrewPlain: כאשר אינך יודע מה־דרך הרוח כעצמים בבטן המלאה ככה לא תדע את־מעשה האלהים אשר יעשה את־הכל
    kjvRefs:
    - Ecclesiastes 11:5
    kjvOsis:
    - Eccl.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:6
    ref: Ecclesiastes 11:6
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 20214
    text: In the morning sow thy seed, And in the evening withhold not thy hand; For thou knowest not which shall prosper, whether this or that, Or whether they both shall be alike good.
    translation: JPS 1917
    original: בַּבֹּקֶר זְרַע אֶת־זַרְעֶךָ וְלָעֶרֶב אַל־תַּנַּח יָדֶךָ כִּי אֵינְךָ יוֹדֵע אֵי זֶה יִכְשָׁר הֲזֶה אוֹ־זֶה וְאִם־שְׁנֵיהֶם כְּאֶחָד טוֹבִים׃
    hebrewPlain: בבקר זרע את־זרעך ולערב אל־תנח ידך כי אינך יודע אי זה יכשר הזה או־זה ואם־שניהם כאחד טובים
    kjvRefs:
    - Ecclesiastes 11:6
    kjvOsis:
    - Eccl.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.7
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:7
    ref: Ecclesiastes 11:7
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 20215
    text: And the light is sweet, And a pleasant thing it is for the eyes to behold the sun.
    translation: JPS 1917
    original: וּמָתוֹק הָאוֹר וְטוֹב לַעֵינַיִם לִרְאוֹת אֶת־הַשָּׁמֶשׁ׃
    hebrewPlain: ומתוק האור וטוב לעינים לראות את־השמש
    kjvRefs:
    - Ecclesiastes 11:7
    kjvOsis:
    - Eccl.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.8
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:8
    ref: Ecclesiastes 11:8
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 20216
    text: For if a man live many years, Let him rejoice in them all, And remember the days of darkness, For they shall be many. All that cometh is vanity.
    translation: JPS 1917
    original: כִּי אִם־שָׁנִים הַרְבֵּה יִחְיֶה הָאָדָם בְּכֻלָּם יִשְׂמָח וְיִזְכֹּר אֶת־יְמֵי הַחֹשֶׁךְ כִּי־הַרְבֵּה יִהְיוּ כָּל־שֶׁבָּא הָבֶל׃
    hebrewPlain: כי אם־שנים הרבה יחיה האדם בכלם ישמח ויזכר את־ימי החשך כי־הרבה יהיו כל־שבא הבל
    kjvRefs:
    - Ecclesiastes 11:8
    kjvOsis:
    - Eccl.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.9
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:9
    ref: Ecclesiastes 11:9
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 20217
    text: Rejoice, O young man, in thy youth; And let thy heart cheer thee in the days of thy youth, And walk in the ways of thy heart, And in the sight of thine eyes; But know thou, that for all these things God will bring thee into judgment.
    translation: JPS 1917
    original: שְׂמַח בָּחוּר בְּיַלְדוּתֶיךָ וִיטִיבְךָ לִבְּךָ בִּימֵי בְחוּרוֹתֶךָ וְהַלֵּךְ בְּדַרְכֵי לִבְּךָ וּבְמַרְאֵי עֵינֶיךָ וְדָע כִּי עַל־כָּל־אֵלֶּה יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט׃
    hebrewPlain: שמח בחור בילדותיך ויטיבך לבך בימי בחורותך והלך בדרכי לבך ובמראי עיניך ודע כי על־כל־אלה יביאך האלהים במשפט
    kjvRefs:
    - Ecclesiastes 11:9
    kjvOsis:
    - Eccl.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.11.10
    scripture: tanakh
    name: Tanakh Ecclesiastes 11:10
    ref: Ecclesiastes 11:10
    book: Eccl
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 20218
    text: Therefore remove vexation from thy heart, And put away evil from thy flesh; For childhood and youth are vanity.
    translation: JPS 1917
    original: וְהָסֵר כַּעַס מִלִּבֶּךָ וְהַעֲבֵר רָעָה מִבְּשָׂרֶךָ כִּי־הַיַּלְדוּת וְהַשַּׁחֲרוּת הָבֶל׃
    hebrewPlain: והסר כעס מלבך והעבר רעה מבשרך כי־הילדות והשחרות הבל
    kjvRefs:
    - Ecclesiastes 11:10
    kjvOsis:
    - Eccl.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.11
- type: TanakhVerse
  data:
    osis: Eccl.12.1
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:1
    ref: Ecclesiastes 12:1
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 1
    ordinal: 20219
    text: 'Remember then thy Creator in the days of thy youth, and the years draw nigh, when thou shalt say: ''I have no pleasure in them'';'
    translation: JPS 1917
    original: וּזְכֹר אֶת־בּוֹרְאֶיךָ בִּימֵי בְּחוּרֹתֶיךָ עַד אֲשֶׁר לֹא־יָבֹאוּ יְמֵי הָרָעָה וְהִגִּיעוּ שָׁנִים אֲשֶׁר תֹּאמַר אֵין־לִי בָהֶם חֵפֶץ׃
    hebrewPlain: וזכר את־בוראיך בימי בחורתיך עד אשר לא־יבאו ימי הרעה והגיעו שנים אשר תאמר אין־לי בהם חפץ
    kjvRefs:
    - Ecclesiastes 12:1
    kjvOsis:
    - Eccl.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.2
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:2
    ref: Ecclesiastes 12:2
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 2
    ordinal: 20220
    text: Before the sun, and the light, and the moon, and the stars, are darkened, and the clouds return after the rain;
    translation: JPS 1917
    original: עַד אֲשֶׁר לֹא־תֶחְשַׁךְ הַשֶּׁמֶשׁ וְהָאוֹר וְהַיָּרֵחַ וְהַכּוֹכָבִים וְשָׁבוּ הֶעָבִים אַחַר הַגָּשֶׁם׃
    hebrewPlain: עד אשר לא־תחשך השמש והאור והירח והכוכבים ושבו העבים אחר הגשם
    kjvRefs:
    - Ecclesiastes 12:2
    kjvOsis:
    - Eccl.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.3
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:3
    ref: Ecclesiastes 12:3
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 3
    ordinal: 20221
    text: In the day when the keepers of the house shall tremble, and the strong men shall bow themselves, and the grinders cease because they are few, and those that look out shall be darkened in the windows,
    translation: JPS 1917
    original: בַּיּוֹם שֶׁיָּזֻעוּ שֹׁמְרֵי הַבַּיִת וְהִתְעַוְּתוּ אַנְשֵׁי הֶחָיִל וּבָטְלוּ הַטֹּחֲנוֹת כִּי מִעֵטוּ וְחָשְׁכוּ הָרֹאוֹת בָּאֲרֻבּוֹת׃
    hebrewPlain: ביום שיזעו שמרי הבית והתעותו אנשי החיל ובטלו הטחנות כי מעטו וחשכו הראות בארבות
    kjvRefs:
    - Ecclesiastes 12:3
    kjvOsis:
    - Eccl.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.4
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:4
    ref: Ecclesiastes 12:4
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 4
    ordinal: 20222
    text: And the doors shall be shut in the street, when the sound of the grinding is low; and one shall start up at the voice of a bird, and all the daughters of music shall be brought low;
    translation: JPS 1917
    original: וְסֻגְּרוּ דְלָתַיִם בַּשּׁוּק בִּשְׁפַל קוֹל הַטַּחֲנָה וְיָקוּם לְקוֹל הַצִּפּוֹר וְיִשַּׁחוּ כָּל־בְּנוֹת הַשִּׁיר׃
    hebrewPlain: וסגרו דלתים בשוק בשפל קול הטחנה ויקום לקול הצפור וישחו כל־בנות השיר
    kjvRefs:
    - Ecclesiastes 12:4
    kjvOsis:
    - Eccl.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
- type: TanakhVerse
  data:
    osis: Eccl.12.5
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:5
    ref: Ecclesiastes 12:5
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 5
    ordinal: 20223
    text: Also when they shall be afraid of that which is high, and terrors shall be in the way; and the almond-tree shall blossom, and the grasshopper shall drag itself along, and the caperberry shall fail; Because man goeth to his long home, and the mourners go about the streets;
    translation: JPS 1917
    original: גַּם מִגָּבֹהַּ יִרָאוּ וְחַתְחַתִּים בַּדֶּרֶךְ וְיָנֵאץ הַשָּׁקֵד וְיִסְתַּבֵּל הֶחָגָב וְתָפֵר הָאֲבִיּוֹנָה כִּי־הֹלֵךְ הָאָדָם אֶל־בֵּית עוֹלָמוֹ וְסָבְבוּ בָשּׁוּק הַסֹּפְדִים׃
    hebrewPlain: גם מגבה יראו וחתחתים בדרך וינאץ השקד ויסתבל החגב ותפר האביונה כי־הלך האדם אל־בית עולמו וסבבו בשוק הספדים
    kjvRefs:
    - Ecclesiastes 12:5
    kjvOsis:
    - Eccl.12.5
  relations:
  - predicate: IN
