    name: Tanakh Ecclesiastes 12:8
    ref: Ecclesiastes 12:8
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 8
    ordinal: 20226
    text: Vanity of vanities, saith Koheleth; all is vanity.
    translation: JPS 1917
    original: הֲבֵל הֲבָלִים אָמַר הַקּוֹהֶלֶת הַכֹּל הָבֶל׃
    hebrewPlain: הבל הבלים אמר הקוהלת הכל הבל
    kjvRefs:
