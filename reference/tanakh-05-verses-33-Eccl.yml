  data:
    osis: Eccl.12.6
    scripture: tanakh
    name: Tanakh Ecclesiastes 12:6
    ref: Ecclesiastes 12:6
    book: Eccl
    section: ketuvim
    chapter: 12
    verse: 6
    ordinal: 20224
    text: Before the silver cord is snapped asunder, and the golden bowl is shattered, And the pitcher is broken at the fountain, and the wheel falleth shattered, into the pit;
    translation: JPS 1917
    original: עַד אֲשֶׁר לֹא־ירחק [יֵרָתֵק] חֶבֶל הַכֶּסֶף וְתָרֻץ גֻּלַּת הַזָּהָב וְתִשָּׁבֶר כַּד עַל־הַמַּבּוּעַ וְנָרֹץ הַגַּלְגַּל אֶל־הַבּוֹר׃
    hebrewPlain: עד אשר לא־ירחק [ירתק] חבל הכסף ותרץ גלת הזהב ותשבר כד על־המבוע ונרץ הגלגל אל־הבור
    kjvRefs:
    - Ecclesiastes 12:6
    kjvOsis:
    - Eccl.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Eccl.12
