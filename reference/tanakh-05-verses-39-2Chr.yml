    translation: JPS 1917
    original: אָז אָמַר שְׁלֹמֹה יְהוָה אָמַר לִשְׁכּוֹן בָּעֲרָפֶל׃
    hebrewPlain: אז אמר שלמה יהוה אמר לשכון בערפל
