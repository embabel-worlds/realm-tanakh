    ordinal: 22387
    text: So Solomon, and all the congregation with him, went to the high place that was at Gibeon; for there was the tent of meeting of God, which Moses the servant of the LORD had made in the wilderness.
    translation: JPS 1917
    original: וַיֵּלְכוּ שְׁלֹמֹה וְכָל־הַקָּהָל עִמּוֹ לַבָּמָה אֲשֶׁר בְּגִבְעוֹן כִּי־שָׁם הָיָה אֹהֶל מוֹעֵד הָאֱלֹהִים אֲשֶׁר עָשָׂה מֹשֶׁה עֶבֶד־יְהוָה בַּמִּדְבָּר׃
    hebrewPlain: וילכו שלמה וכל הקהל עמו לבמה אשר בגבעון כי שם היה אהל מועד האלהים אשר עשה משה עבד יהוה במדבר
