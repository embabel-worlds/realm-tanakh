  data:
    osis: 2Chr.6.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:12
    ref: 2 Chronicles 6:12
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 22484
    text: And he stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands—
    translation: JPS 1917
    original: וַיַּעֲמֹד לִפְנֵי מִזְבַּח יְהוָה נֶגֶד כָּל־קְהַל יִשְׂרָאֵל וַיִּפְרֹשׂ כַּפָּיו׃
    hebrewPlain: ויעמד לפני מזבח יהוה נגד כל קהל ישראל ויפרש כפיו
    kjvRefs:
    - 2 Chronicles 6:12
    kjvOsis:
    - 2Chr.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
