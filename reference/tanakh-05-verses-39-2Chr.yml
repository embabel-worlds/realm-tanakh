  data:
    osis: 2Chr.15.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:2
    ref: 2 Chronicles 15:2
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 2
    ordinal: 22682
    text: 'and he went out to meet Asa, and said unto him: ‘Hear ye me, Asa, and all Judah and Benjamin: the LORD is with you, while ye are with Him; and if ye seek Him, He will be found of you; but if ye forsake Him, He will forsake you.'
    translation: JPS 1917
    original: וַיֵּצֵא לִפְנֵי אָסָא וַיֹּאמֶר לוֹ שְׁמָעוּנִי אָסָא וְכָל־יְהוּדָה וּבִנְיָמִן יְהוָה עִמָּכֶם בִּהְיוֹתְכֶם עִמּוֹ וְאִם־תִּדְרְשֻׁהוּ יִמָּצֵא לָכֶם וְאִם־תַּעַזְבֻהוּ יַעֲזֹב אֶתְכֶם׃
    hebrewPlain: ויצא לפני אסא ויאמר לו שמעוני אסא וכל יהודה ובנימן יהוה עמכם בהיותכם עמו ואם תדרשהו ימצא לכם ואם תעזבהו יעזב אתכם
    kjvRefs:
    - 2 Chronicles 15:2
    kjvOsis:
    - 2Chr.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:3
    ref: 2 Chronicles 15:3
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 3
    ordinal: 22683
    text: Now for long seasons Israel was without the true God, and without a teaching priest, and without law;
    translation: JPS 1917
    original: וְיָמִים רַבִּים לְיִשְׂרָאֵל לְלֹא אֱלֹהֵי אֱמֶת וּלְלֹא כֹּהֵן מוֹרֶה וּלְלֹא תוֹרָה׃
    hebrewPlain: וימים רבים לישראל ללא אלהי אמת וללא כהן מורה וללא תורה
    kjvRefs:
    - 2 Chronicles 15:3
    kjvOsis:
    - 2Chr.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:4
    ref: 2 Chronicles 15:4
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 4
    ordinal: 22684
    text: but when in their distress they turned unto the LORD, the God of Israel, and sought Him, He was found of them.
    translation: JPS 1917
    original: וַיָּשָׁב בַּצַּר־לוֹ עַל־יְהוָה אֱלֹהֵי יִשְׂרָאֵל וַיְבַקְשֻׁהוּ וַיִּמָּצֵא לָהֶם׃
    hebrewPlain: וישב בצר לו על יהוה אלהי ישראל ויבקשהו וימצא להם
    kjvRefs:
    - 2 Chronicles 15:4
    kjvOsis:
    - 2Chr.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:5
    ref: 2 Chronicles 15:5
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 5
    ordinal: 22685
    text: And in those times there was no peace to him that went out, nor to him that came in, but great discomfitures were upon all the inhabitants of the lands.
    translation: JPS 1917
    original: וּבָעִתִּים הָהֵם אֵין שָׁלוֹם לַיּוֹצֵא וְלַבָּא כִּי מְהוּמֹת רַבּוֹת עַל כָּל־יוֹשְׁבֵי הָאֲרָצוֹת׃
    hebrewPlain: ובעתים ההם אין שלום ליוצא ולבא כי מהומת רבות על כל יושבי הארצות
    kjvRefs:
    - 2 Chronicles 15:5
    kjvOsis:
    - 2Chr.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:6
    ref: 2 Chronicles 15:6
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 6
    ordinal: 22686
    text: And they were broken in pieces, nation against nation, and city against city; for God did discomfit them with all manner of adversity.
    translation: JPS 1917
    original: וְכֻתְּתוּ גוֹי־בְּגוֹי וְעִיר בְּעִיר כִּי־אֱלֹהִים הֲמָמָם בְּכָל־צָרָה׃
    hebrewPlain: וכתתו גוי בגוי ועיר בעיר כי אלהים הממם בכל צרה
    kjvRefs:
    - 2 Chronicles 15:6
    kjvOsis:
    - 2Chr.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:7
    ref: 2 Chronicles 15:7
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 7
    ordinal: 22687
    text: But be ye strong, and let not your hands be slack; for your work shall be rewarded.’ .
    translation: JPS 1917
    original: וְאַתֶּם חִזְקוּ וְאַל־יִרְפּוּ יְדֵיכֶם כִּי יֵשׁ שָׂכָר לִפְעֻלַּתְכֶם׃
    hebrewPlain: ואתם חזקו ואל ירפו ידיכם כי יש שכר לפעלתכם
    kjvRefs:
    - 2 Chronicles 15:7
    kjvOsis:
    - 2Chr.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:8
    ref: 2 Chronicles 15:8
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 8
    ordinal: 22688
    text: And when Asa heard these words, even the prophecy of Oded the prophet, he took courage, and put away the detestable things out of all the land of Judah and Benjamin, and out of the cities which he had taken from the hill-country of Ephraim; and he renewed the altar of the LORD, that was before the porch of the LORD.
    translation: JPS 1917
    original: וְכִשְׁמֹעַ אָסָא הַדְּבָרִים הָאֵלֶּה וְהַנְּבוּאָה עֹדֵד הַנָּבִיא הִתְחַזַּק וַיַּעֲבֵר הַשִּׁקּוּצִים מִכָּל־אֶרֶץ יְהוּדָה וּבִנְיָמִן וּמִן־הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם וַיְחַדֵּשׁ אֶת־מִזְבַּח יְהוָה אֲשֶׁר לִפְנֵי אוּלָם יְהוָה׃
    hebrewPlain: וכשמע אסא הדברים האלה והנבואה עדד הנביא התחזק ויעבר השקוצים מכל ארץ יהודה ובנימן ומן הערים אשר לכד מהר אפרים ויחדש את מזבח יהוה אשר לפני אולם יהוה
    kjvRefs:
    - 2 Chronicles 15:8
    kjvOsis:
    - 2Chr.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:9
    ref: 2 Chronicles 15:9
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 9
    ordinal: 22689
    text: And he gathered all Judah and Benjamin, and them that sojourned with them out of Ephraim and Manasseh, and out of Simeon; for they fell to him out of Israel in abundance, when they saw that the LORD his God was with him.
    translation: JPS 1917
    original: וַיִּקְבֹּץ אֶת־כָּל־יְהוּדָה וּבִנְיָמִן וְהַגָּרִים עִמָּהֶם מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן כִּי־נָפְלוּ עָלָיו מִיִּשְׂרָאֵל לָרֹב בִּרְאֹתָם כִּי־יְהוָה אֱלֹהָיו עִמּוֹ׃
    hebrewPlain: ויקבץ את כל יהודה ובנימן והגרים עמהם מאפרים ומנשה ומשמעון כי נפלו עליו מישראל לרב בראתם כי יהוה אלהיו עמו
    kjvRefs:
    - 2 Chronicles 15:9
    kjvOsis:
    - 2Chr.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:10
    ref: 2 Chronicles 15:10
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 10
    ordinal: 22690
    text: So they gathered themselves together at Jerusalem in the third month, in the fifteenth year of the reign of Asa.
    translation: JPS 1917
    original: וַיִּקָּבְצוּ יְרוּשָׁלִַם בַּחֹדֶשׁ הַשְּׁלִישִׁי לִשְׁנַת חֲמֵשׁ־עֶשְׂרֵה לְמַלְכוּת אָסָא׃
    hebrewPlain: ויקבצו ירושלם בחדש השלישי לשנת חמש עשרה למלכות אסא
    kjvRefs:
    - 2 Chronicles 15:10
    kjvOsis:
    - 2Chr.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:11
    ref: 2 Chronicles 15:11
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 11
    ordinal: 22691
    text: And they sacrificed unto the LORD in that day, of the spoil which they had brought, seven hundred oxen and seven thousand sheep.
    translation: JPS 1917
    original: וַיִּזְבְּחוּ לַיהוָה בַּיּוֹם הַהוּא מִן־הַשָּׁלָל הֵבִיאוּ בָּקָר שְׁבַע מֵאוֹת וְצֹאן שִׁבְעַת אֲלָפִים׃
    hebrewPlain: ויזבחו ליהוה ביום ההוא מן השלל הביאו בקר שבע מאות וצאן שבעת אלפים
    kjvRefs:
    - 2 Chronicles 15:11
    kjvOsis:
    - 2Chr.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:12
    ref: 2 Chronicles 15:12
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 12
    ordinal: 22692
    text: And they entered into the covenant to seek the LORD, the God of their fathers, with all their heart and with all their soul;
    translation: JPS 1917
    original: וַיָּבֹאוּ בַבְּרִית לִדְרוֹשׁ אֶת־יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם בְּכָל־לְבָבָם וּבְכָל־נַפְשָׁם׃
    hebrewPlain: ויבאו בברית לדרוש את יהוה אלהי אבותיהם בכל לבבם ובכל נפשם
    kjvRefs:
    - 2 Chronicles 15:12
    kjvOsis:
    - 2Chr.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:13
    ref: 2 Chronicles 15:13
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 13
    ordinal: 22693
    text: and that whosoever would not seek the LORD, the God of Israel, should be put to death, whether small or great, whether man or woman.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר לֹא־יִדְרֹשׁ לַיהוָה אֱלֹהֵי־יִשְׂרָאֵל יוּמָת לְמִן־קָטֹן וְעַד־גָּדוֹל לְמֵאִישׁ וְעַד־אִשָּׁה׃
    hebrewPlain: וכל אשר לא ידרש ליהוה אלהי ישראל יומת למן קטן ועד גדול למאיש ועד אשה
    kjvRefs:
    - 2 Chronicles 15:13
    kjvOsis:
    - 2Chr.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:14
    ref: 2 Chronicles 15:14
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 14
    ordinal: 22694
    text: And they swore unto the LORD with a loud voice, and with shouting, and with trumpets, and with horns.
    translation: JPS 1917
    original: וַיִּשָּׁבְעוּ לַיהוָה בְּקוֹל גָּדוֹל וּבִתְרוּעָה וּבַחֲצֹצְרוֹת וּבְשׁוֹפָרוֹת׃
    hebrewPlain: וישבעו ליהוה בקול גדול ובתרועה ובחצצרות ובשופרות
    kjvRefs:
    - 2 Chronicles 15:14
    kjvOsis:
    - 2Chr.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:15
    ref: 2 Chronicles 15:15
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 15
    ordinal: 22695
    text: And all Judah rejoiced at the oath; for they had sworn with all their heart, and sought Him with their whole desire; and He was found of them; and the LORD gave them rest round about.
    translation: JPS 1917
    original: וַיִּשְׂמְחוּ כָל־יְהוּדָה עַל־הַשְּׁבוּעָה כִּי בְכָל־לְבָבָם נִשְׁבָּעוּ וּבְכָל־רְצוֹנָם בִּקְשֻׁהוּ וַיִּמָּצֵא לָהֶם וַיָּנַח יְהוָה לָהֶם מִסָּבִיב׃
    hebrewPlain: וישמחו כל יהודה על השבועה כי בכל לבבם נשבעו ובכל רצונם בקשהו וימצא להם וינח יהוה להם מסביב
    kjvRefs:
    - 2 Chronicles 15:15
    kjvOsis:
    - 2Chr.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:16
    ref: 2 Chronicles 15:16
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 16
    ordinal: 22696
    text: And also Maacah the mother of Asa the king, he removed her from being queen, because she had made an abominable image for an Asherah; and Asa cut down her image, and made dust of it, and burnt it at the brook Kidron.
    translation: JPS 1917
    original: וְגַם־מַעֲכָה אֵם אָסָא הַמֶּלֶךְ הֱסִירָהּ מִגְּבִירָה אֲשֶׁר־עָשְׂתָה לַאֲשֵׁרָה מִפְלָצֶת וַיִּכְרֹת אָסָא אֶת־מִפְלַצְתָּהּ וַיָּדֶק וַיִּשְׂרֹף בְּנַחַל קִדְרוֹן׃
    hebrewPlain: וגם מעכה אם אסא המלך הסירה מגבירה אשר עשתה לאשרה מפלצת ויכרת אסא את מפלצתה וידק וישרף בנחל קדרון
    kjvRefs:
    - 2 Chronicles 15:16
    kjvOsis:
    - 2Chr.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:17
    ref: 2 Chronicles 15:17
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 17
    ordinal: 22697
    text: But the high places were not taken away out of Israel; nevertheless the heart of Asa was whole all his days.
    translation: JPS 1917
    original: וְהַבָּמוֹת לֹא־סָרוּ מִיִּשְׂרָאֵל רַק לְבַב־אָסָא הָיָה שָׁלֵם כָּל־יָמָיו׃
    hebrewPlain: והבמות לא סרו מישראל רק לבב אסא היה שלם כל ימיו
    kjvRefs:
    - 2 Chronicles 15:17
    kjvOsis:
    - 2Chr.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:18
    ref: 2 Chronicles 15:18
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 18
    ordinal: 22698
    text: And he brought into the house of God the things that his father had hallowed, and that he himself had hallowed, silver, and gold, and vessels.
    translation: JPS 1917
    original: וַיָּבֵא אֶת־קָדְשֵׁי אָבִיו וְקָדָשָׁיו בֵּית הָאֱלֹהִים כֶּסֶף וְזָהָב וְכֵלִים׃
    hebrewPlain: ויבא את קדשי אביו וקדשיו בית האלהים כסף וזהב וכלים
    kjvRefs:
    - 2 Chronicles 15:18
    kjvOsis:
    - 2Chr.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.15.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:19
    ref: 2 Chronicles 15:19
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 19
    ordinal: 22699
    text: And there was no more war unto the five and thirtieth year of the reign of Asa.
    translation: JPS 1917
    original: וּמִלְחָמָה לֹא הָיָתָה עַד שְׁנַת־שְׁלֹשִׁים וְחָמֵשׁ לְמַלְכוּת אָסָא׃
    hebrewPlain: ומלחמה לא היתה עד שנת שלשים וחמש למלכות אסא
    kjvRefs:
    - 2 Chronicles 15:19
    kjvOsis:
    - 2Chr.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.15
- type: TanakhVerse
  data:
    osis: 2Chr.16.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:1
    ref: 2 Chronicles 16:1
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 1
    ordinal: 22700
    text: In the six and thirtieth year of the reign of Asa, Baasa king of Israel went up against Judah, and built Ramah, that he might not suffer any to go out or come in to Asa king of Judah.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ לְמַלְכוּת אָסָא עָלָה בַּעְשָׁא מֶלֶךְ־יִשְׂרָאֵל עַל־יְהוּדָה וַיִּבֶן אֶת־הָרָמָה לְבִלְתִּי תֵּת יוֹצֵא וָבָא לְאָסָא מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת שלשים ושש למלכות אסא עלה בעשא מלך ישראל על יהודה ויבן את הרמה לבלתי תת יוצא ובא לאסא מלך יהודה
    kjvRefs:
    - 2 Chronicles 16:1
    kjvOsis:
    - 2Chr.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:2
    ref: 2 Chronicles 16:2
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 2
    ordinal: 22701
    text: 'Then Asa brought out silver and gold out of the treasures of the house of the LORD and of the king’s house, and sent to Ben-hadad king of Aram, that dwelt at Damascus, saying:'
    translation: JPS 1917
    original: וַיֹּצֵא אָסָא כֶּסֶף וְזָהָב מֵאֹצְרוֹת בֵּית יְהוָה וּבֵית הַמֶּלֶךְ וַיִּשְׁלַח אֶל־בֶּן־הֲדַד מֶלֶךְ אֲרָם הַיּוֹשֵׁב בְּדַרְמֶשֶׂק לֵאמֹר׃
    hebrewPlain: ויצא אסא כסף וזהב מאצרות בית יהוה ובית המלך וישלח אל בן הדד מלך ארם היושב בדרמשק לאמר
    kjvRefs:
    - 2 Chronicles 16:2
    kjvOsis:
    - 2Chr.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:3
    ref: 2 Chronicles 16:3
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 3
    ordinal: 22702
    text: ’There is a league between me and thee, as there was between my father and thy father; behold, I have sent thee silver and gold; go, break thy league with Baasa king of Israel, that he may depart from me.’
    translation: JPS 1917
    original: בְּרִית בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ הִנֵּה שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב לֵךְ הָפֵר בְּרִיתְךָ אֶת־בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל וְיַעֲלֶה מֵעָלָי׃
    hebrewPlain: ברית ביני ובינך ובין אבי ובין אביך הנה שלחתי לך כסף וזהב לך הפר בריתך את בעשא מלך ישראל ויעלה מעלי
    kjvRefs:
    - 2 Chronicles 16:3
    kjvOsis:
    - 2Chr.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:4
    ref: 2 Chronicles 16:4
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 4
    ordinal: 22703
    text: And Ben-hadad hearkened unto king Asa, and sent the captains of his armies against the cities of Israel; and they smote Ijon, and Dan, and Abelmaim, and all the store-cities of Naphtali.
    translation: JPS 1917
    original: וַיִּשְׁמַע בֶּן הֲדַד אֶל־הַמֶּלֶךְ אָסָא וַיִּשְׁלַח אֶת־שָׂרֵי הַחֲיָלִים אֲשֶׁר־לוֹ אֶל־עָרֵי יִשְׂרָאֵל וַיַּכּוּ אֶת־עִיּוֹן וְאֶת־דָּן וְאֵת אָבֵל מָיִם וְאֵת כָּל־מִסְכְּנוֹת עָרֵי נַפְתָּלִי׃
    hebrewPlain: וישמע בן הדד אל המלך אסא וישלח את שרי החילים אשר לו אל ערי ישראל ויכו את עיון ואת דן ואת אבל מים ואת כל מסכנות ערי נפתלי
    kjvRefs:
    - 2 Chronicles 16:4
    kjvOsis:
    - 2Chr.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:5
    ref: 2 Chronicles 16:5
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 5
    ordinal: 22704
    text: And it came to pass, when Baasa heard
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ בַּעְשָׁא וַיֶּחְדַּל מִבְּנוֹת אֶת־הָרָמָה וַיַּשְׁבֵּת אֶת־מְלַאכְתּוֹ׃
    hebrewPlain: ויהי כשמע בעשא ויחדל מבנות את הרמה וישבת את מלאכתו
    kjvRefs:
    - 2 Chronicles 16:5
    kjvOsis:
    - 2Chr.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:6
    ref: 2 Chronicles 16:6
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 6
    ordinal: 22705
    text: Then Asa the king took all Judah; and they carried away the stones of Ramah, and the timber thereof, wherewith Baasa had builded; and he built therewith Geba and Mizpah.
    translation: JPS 1917
    original: וְאָסָא הַמֶּלֶךְ לָקַח אֶת־כָּל־יְהוּדָה וַיִּשְׂאוּ אֶת־אַבְנֵי הָרָמָה וְאֶת־עֵצֶיהָ אֲשֶׁר בָּנָה בַּעְשָׁא וַיִּבֶן בָּהֶם אֶת־גֶּבַע וְאֶת־הַמִּצְפָּה׃
    hebrewPlain: ואסא המלך לקח את כל יהודה וישאו את אבני הרמה ואת עציה אשר בנה בעשא ויבן בהם את גבע ואת המצפה
    kjvRefs:
    - 2 Chronicles 16:6
    kjvOsis:
    - 2Chr.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:7
    ref: 2 Chronicles 16:7
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 7
    ordinal: 22706
    text: 'And at that time Hanani the seer came to Asa king of Judah, and said unto him: ‘Because thou hast relied on the king of Aram, and hast not relied on the LORD thy God, therefore is the host of the king of Aram escaped out of thy hand.'
    translation: JPS 1917
    original: וּבָעֵת הַהִיא בָּא חֲנָנִי הָרֹאֶה אֶל־אָסָא מֶלֶךְ יְהוּדָה וַיֹּאמֶר אֵלָיו בְּהִשָּׁעֶנְךָ עַל־מֶלֶךְ אֲרָם וְלֹא נִשְׁעַנְתָּ עַל־יְהוָה אֱלֹהֶיךָ עַל־כֵּן נִמְלַט חֵיל מֶלֶךְ־אֲרָם מִיָּדֶךָ׃
    hebrewPlain: ובעת ההיא בא חנני הראה אל אסא מלך יהודה ויאמר אליו בהשענך על מלך ארם ולא נשענת על יהוה אלהיך על כן נמלט חיל מלך ארם מידך
    kjvRefs:
    - 2 Chronicles 16:7
    kjvOsis:
    - 2Chr.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:8
    ref: 2 Chronicles 16:8
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 8
    ordinal: 22707
    text: Were not the Ethiopians and the Lubim a huge host, with chariots and horsemen exceeding many? yet, because thou didst rely on the LORD, He delivered them into thy hand.
    translation: JPS 1917
    original: הֲלֹא הַכּוּשִׁים וְהַלּוּבִים הָיוּ לְחַיִל לָרֹב לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד וּבְהִשָּׁעֶנְךָ עַל־יְהוָה נְתָנָם בְּיָדֶךָ׃
    hebrewPlain: הלא הכושים והלובים היו לחיל לרב לרכב ולפרשים להרבה מאד ובהשענך על יהוה נתנם בידך
    kjvRefs:
    - 2 Chronicles 16:8
    kjvOsis:
    - 2Chr.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:9
    ref: 2 Chronicles 16:9
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 9
    ordinal: 22708
    text: For the eyes of the LORD run to and fro throughout the whole earth, to show Himself strong in the behalf of them whose heart is whole toward Him. Herein thou hast done foolishly; for from henceforth thou shalt have wars.’
    translation: JPS 1917
    original: כִּי יְהוָה עֵינָיו מְשֹׁטְטוֹת בְּכָל־הָאָרֶץ לְהִתְחַזֵּק עִם־לְבָבָם שָׁלֵם אֵלָיו נִסְכַּלְתָּ עַל־זֹאת כִּי מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת׃
    hebrewPlain: כי יהוה עיניו משטטות בכל הארץ להתחזק עם לבבם שלם אליו נסכלת על זאת כי מעתה יש עמך מלחמות
    kjvRefs:
    - 2 Chronicles 16:9
    kjvOsis:
    - 2Chr.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:10
    ref: 2 Chronicles 16:10
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 10
    ordinal: 22709
    text: Then Asa was wroth with the seer, and put him in the prison-house; for he was in a rage with him because of this thing. And Asa oppressed some of the people the same time.
    translation: JPS 1917
    original: וַיִּכְעַס אָסָא אֶל־הָרֹאֶה וַיִּתְּנֵהוּ בֵּית הַמַּהְפֶּכֶת כִּי־בְזַעַף עִמּוֹ עַל־זֹאת וַיְרַצֵּץ אָסָא מִן־הָעָם בָּעֵת הַהִיא׃
    hebrewPlain: ויכעס אסא אל הראה ויתנהו בית המהפכת כי בזעף עמו על זאת וירצץ אסא מן העם בעת ההיא
    kjvRefs:
    - 2 Chronicles 16:10
    kjvOsis:
    - 2Chr.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:11
    ref: 2 Chronicles 16:11
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 11
    ordinal: 22710
    text: And, behold, the acts of Asa, first and last, lo, they are written in the book of the kings of Judah and Israel.
    translation: JPS 1917
    original: וְהִנֵּה דִּבְרֵי אָסָא הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים הִנָּם כְּתוּבִים עַל־סֵפֶר הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל׃
    hebrewPlain: והנה דברי אסא הראשונים והאחרונים הנם כתובים על ספר המלכים ליהודה וישראל
    kjvRefs:
    - 2 Chronicles 16:11
    kjvOsis:
    - 2Chr.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:12
    ref: 2 Chronicles 16:12
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 12
    ordinal: 22711
    text: And in the thirty and ninth year of his reign Asa was diseased in his feet; his disease was exceeding great; yet in his disease he sought not to the LORD, but to the physicians.
    translation: JPS 1917
    original: וַיֶּחֱלֶא אָסָא בִּשְׁנַת שְׁלוֹשִׁים וָתֵשַׁע לְמַלְכוּתוֹ בְּרַגְלָיו עַד־לְמַעְלָה חָלְיוֹ וְגַם־בְּחָלְיוֹ לֹא־דָרַשׁ אֶת־יְהוָה כִּי בָּרֹפְאִים׃
    hebrewPlain: ויחלא אסא בשנת שלושים ותשע למלכותו ברגליו עד למעלה חליו וגם בחליו לא דרש את יהוה כי ברפאים
    kjvRefs:
    - 2 Chronicles 16:12
    kjvOsis:
    - 2Chr.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:13
    ref: 2 Chronicles 16:13
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 13
    ordinal: 22712
    text: And Asa slept with his fathers, and died in the one and fortieth year of his reign.
    translation: JPS 1917
    original: וַיִּשְׁכַּב אָסָא עִם־אֲבֹתָיו וַיָּמָת בִּשְׁנַת אַרְבָּעִים וְאַחַת לְמָלְכוֹ׃
    hebrewPlain: וישכב אסא עם אבתיו וימת בשנת ארבעים ואחת למלכו
    kjvRefs:
    - 2 Chronicles 16:13
    kjvOsis:
    - 2Chr.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.16.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 16:14
    ref: 2 Chronicles 16:14
    book: 2Chr
    section: ketuvim
    chapter: 16
    verse: 14
    ordinal: 22713
    text: And they buried him in his own sepulchres, which he had hewn out for himself in the city of David, and laid him in the bed which was filled with sweet odours and divers kinds [of spices] prepared by the perfumers’ art; and they made a very great burning for him.
    translation: JPS 1917
    original: וַיִּקְבְּרֻהוּ בְקִבְרֹתָיו אֲשֶׁר כָּרָה־לוֹ בְּעִיר דָּוִיד וַיַּשְׁכִּיבֻהוּ בַּמִּשְׁכָּב אֲשֶׁר מִלֵּא בְּשָׂמִים וּזְנִים מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה וַיִּשְׂרְפוּ־לוֹ שְׂרֵפָה גְּדוֹלָה עַד־לִמְאֹד׃
    hebrewPlain: ויקברהו בקברתיו אשר כרה לו בעיר דויד וישכיבהו במשכב אשר מלא בשמים וזנים מרקחים במרקחת מעשה וישרפו לו שרפה גדולה עד למאד
    kjvRefs:
    - 2 Chronicles 16:14
    kjvOsis:
    - 2Chr.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.16
- type: TanakhVerse
  data:
    osis: 2Chr.17.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:1
    ref: 2 Chronicles 17:1
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 1
    ordinal: 22714
    text: And Jehoshaphat his son reigned in his stead, and strengthened himself against Israel.
    translation: JPS 1917
    original: וַיִּמְלֹךְ יְהוֹשָׁפָט בְּנוֹ תַּחְתָּיו וַיִּתְחַזֵּק עַל־יִשְׂרָאֵל׃
    hebrewPlain: וימלך יהושפט בנו תחתיו ויתחזק על ישראל
    kjvRefs:
    - 2 Chronicles 17:1
    kjvOsis:
    - 2Chr.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:2
    ref: 2 Chronicles 17:2
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 2
    ordinal: 22715
    text: And he placed forces in all the fortified cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim, which Asa his father had taken.
    translation: JPS 1917
    original: וַיִּתֶּן־חַיִל בְּכָל־עָרֵי יְהוּדָה הַבְּצֻרוֹת וַיִּתֵּן נְצִיבִים בְּאֶרֶץ יְהוּדָה וּבְעָרֵי אֶפְרַיִם אֲשֶׁר לָכַד אָסָא אָבִיו׃
    hebrewPlain: ויתן חיל בכל ערי יהודה הבצרות ויתן נציבים בארץ יהודה ובערי אפרים אשר לכד אסא אביו
    kjvRefs:
    - 2 Chronicles 17:2
    kjvOsis:
    - 2Chr.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:3
    ref: 2 Chronicles 17:3
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 3
    ordinal: 22716
    text: And the LORD was with Jehoshaphat, because he walked in the first ways of his father David, and sought not unto the Baalim;
    translation: JPS 1917
    original: וַיְהִי יְהוָה עִם־יְהוֹשָׁפָט כִּי הָלַךְ בְּדַרְכֵי דָּוִיד אָבִיו הָרִאשֹׁנִים וְלֹא דָרַשׁ לַבְּעָלִים׃
    hebrewPlain: ויהי יהוה עם יהושפט כי הלך בדרכי דויד אביו הראשנים ולא דרש לבעלים
    kjvRefs:
    - 2 Chronicles 17:3
    kjvOsis:
    - 2Chr.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:4
    ref: 2 Chronicles 17:4
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 4
    ordinal: 22717
    text: but sought to the God of his father, and walked in His commandments, and not after the doings of Israel.
    translation: JPS 1917
    original: כִּי לֵאלֹהֵי אָבִיו דָּרָשׁ וּבְמִצְוֺתָיו הָלָךְ וְלֹא כְּמַעֲשֵׂה יִשְׂרָאֵל׃
    hebrewPlain: כי לאלהי אביו דרש ובמצותיו הלך ולא כמעשה ישראל
    kjvRefs:
    - 2 Chronicles 17:4
    kjvOsis:
    - 2Chr.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:5
    ref: 2 Chronicles 17:5
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 5
    ordinal: 22718
    text: Therefore the LORD established the kingdom in his hand; and all Judah brought to Jehoshaphat presents; and he had riches and honour in abundance.
    translation: JPS 1917
    original: וַיָּכֶן יְהוָה אֶת־הַמַּמְלָכָה בְּיָדוֹ וַיִּתְּנוּ כָל־יְהוּדָה מִנְחָה לִיהוֹשָׁפָט וַיְהִי־לוֹ עֹשֶׁר־וְכָבוֹד לָרֹב׃
    hebrewPlain: ויכן יהוה את הממלכה בידו ויתנו כל יהודה מנחה ליהושפט ויהי לו עשר וכבוד לרב
    kjvRefs:
    - 2 Chronicles 17:5
    kjvOsis:
    - 2Chr.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:6
    ref: 2 Chronicles 17:6
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 6
    ordinal: 22719
    text: And his heart was lifted up in the ways of the LORD; and furthermore he took away the high places and the Asherim out of Judah.
    translation: JPS 1917
    original: וַיִּגְבַּהּ לִבּוֹ בְּדַרְכֵי יְהוָה וְעוֹד הֵסִיר אֶת־הַבָּמוֹת וְאֶת־הָאֲשֵׁרִים מִיהוּדָה׃
    hebrewPlain: ויגבה לבו בדרכי יהוה ועוד הסיר את הבמות ואת האשרים מיהודה
    kjvRefs:
    - 2 Chronicles 17:6
    kjvOsis:
    - 2Chr.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:7
    ref: 2 Chronicles 17:7
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 7
    ordinal: 22720
    text: Also in the third year of his reign he sent his princes, even Ben-hail, and Obadiah, and Zechariah, and Nethanel, and Micaiah, to teach in the cities of Judah;
    translation: JPS 1917
    original: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ שָׁלַח לְשָׂרָיו לְבֶן־חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ לְלַמֵּד בְּעָרֵי יְהוּדָה׃
    hebrewPlain: ובשנת שלוש למלכו שלח לשריו לבן חיל ולעבדיה ולזכריה ולנתנאל ולמיכיהו ללמד בערי יהודה
    kjvRefs:
    - 2 Chronicles 17:7
    kjvOsis:
    - 2Chr.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:8
    ref: 2 Chronicles 17:8
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 8
    ordinal: 22721
    text: and with them the Levites, even Shemaiah, and Nethaniah, and Zebadiah, and Asahel, and Shemiramoth, and Jehonathan, and Adonijah, and Tobijah, and Tob-adonijah, the Levites; and with them Elishama and Jehoram, the priests.
    translation: JPS 1917
    original: וְעִמָּהֶם הַלְוִיִּם שְׁמַעְיָהוּ וּנְתַנְיָהוּ וּזְבַדְיָהוּ וַעֲשָׂהאֵל ושמרימות [וּשְׁמִירָמוֹת] וִיהוֹנָתָן וַאֲדֹנִיָּהוּ וְטוֹבִיָּהוּ וְטוֹב אֲדוֹנִיָּה הַלְוִיִּם וְעִמָּהֶם אֱלִישָׁמָע וִיהוֹרָם הַכֹּהֲנִים׃
    hebrewPlain: ועמהם הלוים שמעיהו ונתניהו וזבדיהו ועשהאל ושמרימות [ושמירמות] ויהונתן ואדניהו וטוביהו וטוב אדוניה הלוים ועמהם אלישמע ויהורם הכהנים
    kjvRefs:
    - 2 Chronicles 17:8
    kjvOsis:
    - 2Chr.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:9
    ref: 2 Chronicles 17:9
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 9
    ordinal: 22722
    text: And they taught in Judah, having the book of the Law of the LORD with them; and they went about throughout all the cities of Judah, and taught among the people.
    translation: JPS 1917
    original: וַיְלַמְּדוּ בִּיהוּדָה וְעִמָּהֶם סֵפֶר תּוֹרַת יְהוָה וַיָּסֹבּוּ בְּכָל־עָרֵי יְהוּדָה וַיְלַמְּדוּ בָּעָם׃
    hebrewPlain: וילמדו ביהודה ועמהם ספר תורת יהוה ויסבו בכל ערי יהודה וילמדו בעם
    kjvRefs:
    - 2 Chronicles 17:9
    kjvOsis:
    - 2Chr.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:10
    ref: 2 Chronicles 17:10
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 10
    ordinal: 22723
    text: And a terror from the LORD fell upon all the kingdoms of the lands that were round about Judah, so that they made no war against Jehoshaphat.
    translation: JPS 1917
    original: וַיְהִי פַּחַד יְהוָה עַל כָּל־מַמְלְכוֹת הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹת יְהוּדָה וְלֹא נִלְחֲמוּ עִם־יְהוֹשָׁפָט׃
    hebrewPlain: ויהי פחד יהוה על כל ממלכות הארצות אשר סביבות יהודה ולא נלחמו עם יהושפט
    kjvRefs:
    - 2 Chronicles 17:10
    kjvOsis:
    - 2Chr.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:11
    ref: 2 Chronicles 17:11
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 11
    ordinal: 22724
    text: And some of the Philistines brought Jehoshaphat presents, and silver for tribute; the Arabians also brought him flocks, seven thousand and seven hundred rams, and seven thousand and seven hundred he-goats.
    translation: JPS 1917
    original: וּמִן־פְּלִשְׁתִּים מְבִיאִים לִיהוֹשָׁפָט מִנְחָה וְכֶסֶף מַשָּׂא גַּם הָעַרְבִיאִים מְבִיאִים לוֹ צֹאן אֵילִים שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת וּתְיָשִׁים שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת׃
    hebrewPlain: ומן פלשתים מביאים ליהושפט מנחה וכסף משא גם הערביאים מביאים לו צאן אילים שבעת אלפים ושבע מאות ותישים שבעת אלפים ושבע מאות
    kjvRefs:
    - 2 Chronicles 17:11
    kjvOsis:
    - 2Chr.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:12
    ref: 2 Chronicles 17:12
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 12
    ordinal: 22725
    text: And Jehoshaphat waxed great exceedingly; and he built in Judah castles and cities of store.
    translation: JPS 1917
    original: וַיְהִי יְהוֹשָׁפָט הֹלֵךְ וְגָדֵל עַד־לְמָעְלָה וַיִּבֶן בִּיהוּדָה בִּירָנִיּוֹת וְעָרֵי מִסְכְּנוֹת׃
    hebrewPlain: ויהי יהושפט הלך וגדל עד למעלה ויבן ביהודה בירניות וערי מסכנות
    kjvRefs:
    - 2 Chronicles 17:12
    kjvOsis:
    - 2Chr.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:13
    ref: 2 Chronicles 17:13
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 13
    ordinal: 22726
    text: And he had many works in the cities of Judah; and men of war, mighty men of valour, in Jerusalem.
    translation: JPS 1917
    original: וּמְלָאכָה רַבָּה הָיָה לוֹ בְּעָרֵי יְהוּדָה וְאַנְשֵׁי מִלְחָמָה גִּבּוֹרֵי חַיִל בִּירוּשָׁלִָם׃
    hebrewPlain: ומלאכה רבה היה לו בערי יהודה ואנשי מלחמה גבורי חיל בירושלם
    kjvRefs:
    - 2 Chronicles 17:13
    kjvOsis:
    - 2Chr.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:14
    ref: 2 Chronicles 17:14
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 14
    ordinal: 22727
    text: 'And this was the numbering of them according to their fathers’ houses: of Judah, the captains of thousands: Adnah the captain, and with him mighty men of valour three hundred thousand;'
    translation: JPS 1917
    original: וְאֵלֶּה פְקֻדָּתָם לְבֵית אֲבוֹתֵיהֶם לִיהוּדָה שָׂרֵי אֲלָפִים עַדְנָה הַשָּׂר וְעִמּוֹ גִּבּוֹרֵי חַיִל שְׁלֹשׁ מֵאוֹת אָלֶף׃
    hebrewPlain: ואלה פקדתם לבית אבותיהם ליהודה שרי אלפים עדנה השר ועמו גבורי חיל שלש מאות אלף
    kjvRefs:
    - 2 Chronicles 17:14
    kjvOsis:
    - 2Chr.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:15
    ref: 2 Chronicles 17:15
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 15
    ordinal: 22728
    text: and next to him Jehohanan the captain, and with him two hundred and fourscore thousand;
    translation: JPS 1917
    original: וְעַל־יָדוֹ יְהוֹחָנָן הַשָּׂר וְעִמּוֹ מָאתַיִם וּשְׁמוֹנִים אָלֶף׃
    hebrewPlain: ועל ידו יהוחנן השר ועמו מאתים ושמונים אלף
    kjvRefs:
    - 2 Chronicles 17:15
    kjvOsis:
    - 2Chr.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:16
    ref: 2 Chronicles 17:16
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 16
    ordinal: 22729
    text: and next to him Amasiah the son of Zichri, who willingly offered himself unto the LORD, and with him two hundred thousand mighty men of valour;
    translation: JPS 1917
    original: וְעַל־יָדוֹ עֲמַסְיָה בֶן־זִכְרִי הַמִּתְנַדֵּב לַיהוָה וְעִמּוֹ מָאתַיִם אֶלֶף גִּבּוֹר חָיִל׃
    hebrewPlain: ועל ידו עמסיה בן זכרי המתנדב ליהוה ועמו מאתים אלף גבור חיל
    kjvRefs:
    - 2 Chronicles 17:16
    kjvOsis:
    - 2Chr.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:17
    ref: 2 Chronicles 17:17
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 17
    ordinal: 22730
    text: 'and of Benjamin: Eliada a mighty man of valour, and with him two hundred thousand armed with bow and shield;'
    translation: JPS 1917
    original: וּמִן־בִּנְיָמִן גִּבּוֹר חַיִל אֶלְיָדָע וְעִמּוֹ נֹשְׁקֵי־קֶשֶׁת וּמָגֵן מָאתַיִם אָלֶף׃
    hebrewPlain: ומן בנימן גבור חיל אלידע ועמו נשקי קשת ומגן מאתים אלף
    kjvRefs:
    - 2 Chronicles 17:17
    kjvOsis:
    - 2Chr.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:18
    ref: 2 Chronicles 17:18
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 18
    ordinal: 22731
    text: and next to him Jehozabad, and with him a hundred and fourscore thousand ready prepared for war.
    translation: JPS 1917
    original: וְעַל־יָדוֹ יְהוֹזָבָד וְעִמּוֹ מֵאָה־וּשְׁמוֹנִים אֶלֶף חֲלוּצֵי צָבָא׃
    hebrewPlain: ועל ידו יהוזבד ועמו מאה ושמונים אלף חלוצי צבא
    kjvRefs:
    - 2 Chronicles 17:18
    kjvOsis:
    - 2Chr.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.17.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 17:19
    ref: 2 Chronicles 17:19
    book: 2Chr
    section: ketuvim
    chapter: 17
    verse: 19
    ordinal: 22732
    text: These were they that waited on the king beside those whom the king put in the fortified cities throughout all Judah.
    translation: JPS 1917
    original: אֵלֶּה הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ מִלְּבַד אֲשֶׁר־נָתַן הַמֶּלֶךְ בְּעָרֵי הַמִּבְצָר בְּכָל־יְהוּדָה׃
    hebrewPlain: אלה המשרתים את המלך מלבד אשר נתן המלך בערי המבצר בכל יהודה
    kjvRefs:
    - 2 Chronicles 17:19
    kjvOsis:
    - 2Chr.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.17
- type: TanakhVerse
  data:
    osis: 2Chr.18.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:1
    ref: 2 Chronicles 18:1
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 1
    ordinal: 22733
    text: Now Jehoshaphat had riches and honour in abundance; and he allied himself with Ahab by marriage.
    translation: JPS 1917
    original: וַיְהִי לִיהוֹשָׁפָט עֹשֶׁר וְכָבוֹד לָרֹב וַיִּתְחַתֵּן לְאַחְאָב׃
    hebrewPlain: ויהי ליהושפט עשר וכבוד לרב ויתחתן לאחאב
    kjvRefs:
    - 2 Chronicles 18:1
    kjvOsis:
    - 2Chr.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:2
    ref: 2 Chronicles 18:2
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 2
    ordinal: 22734
    text: And after a lapse of years he went down to Ahab to Samaria. And Ahab killed sheep and oxen for him in abundance, and for the people that were with him, and persuaded him to go up with him to Ramoth-gilead.
    translation: JPS 1917
    original: וַיֵּרֶד לְקֵץ שָׁנִים אֶל־אַחְאָב לְשֹׁמְרוֹן וַיִּזְבַּח־לוֹ אַחְאָב צֹאן וּבָקָר לָרֹב וְלָעָם אֲשֶׁר עִמּוֹ וַיְסִיתֵהוּ לַעֲלוֹת אֶל־רָמוֹת גִּלְעָד׃
    hebrewPlain: וירד לקץ שנים אל אחאב לשמרון ויזבח לו אחאב צאן ובקר לרב ולעם אשר עמו ויסיתהו לעלות אל רמות גלעד
    kjvRefs:
    - 2 Chronicles 18:2
    kjvOsis:
    - 2Chr.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:3
    ref: 2 Chronicles 18:3
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 3
    ordinal: 22735
    text: 'And Ahab king of Israel said unto Jehoshaphat king of Judah: ‘Wilt thou go with me to Ramoth-gilead?’ And he answered him: ‘I am as thou art, and my people as thy people; and we will be with thee in the war.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אַחְאָב מֶלֶךְ־יִשְׂרָאֵל אֶל־יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה הֲתֵלֵךְ עִמִּי רָמֹת גִּלְעָד וַיֹּאמֶר לוֹ כָּמוֹנִי כָמוֹךָ וּכְעַמְּךָ עַמִּי וְעִמְּךָ בַּמִּלְחָמָה׃
    hebrewPlain: ויאמר אחאב מלך ישראל אל יהושפט מלך יהודה התלך עמי רמת גלעד ויאמר לו כמוני כמוך וכעמך עמי ועמך במלחמה
    kjvRefs:
    - 2 Chronicles 18:3
    kjvOsis:
    - 2Chr.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:4
    ref: 2 Chronicles 18:4
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 4
    ordinal: 22736
    text: 'And Jehoshaphat said unto the king of Israel: ‘Inquire, I pray thee, at the word of the LORD today.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשָׁפָט אֶל־מֶלֶךְ יִשְׂרָאֵל דְּרָשׁ־נָא כַיּוֹם אֶת־דְּבַר יְהוָה׃
    hebrewPlain: ויאמר יהושפט אל מלך ישראל דרש נא כיום את דבר יהוה
    kjvRefs:
    - 2 Chronicles 18:4
    kjvOsis:
    - 2Chr.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:5
    ref: 2 Chronicles 18:5
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 5
    ordinal: 22737
    text: 'Then the king of Israel gathered the prophets together, four hundred men, and said unto them: ‘Shall we go to Ramoth-gilead to battle, or shall I forbear?’ And they said: ‘Go up; for God will deliver it into the hand of the king.’'
    translation: JPS 1917
    original: וַיִּקְבֹּץ מֶלֶךְ־יִשְׂרָאֵל אֶת־הַנְּבִאִים אַרְבַּע מֵאוֹת אִישׁ וַיֹּאמֶר אֲלֵהֶם הֲנֵלֵךְ אֶל־רָמֹת גִּלְעָד לַמִּלְחָמָה אִם־אֶחְדָּל וַיֹּאמְרוּ עֲלֵה וְיִתֵּן הָאֱלֹהִים בְּיַד הַמֶּלֶךְ׃
    hebrewPlain: ויקבץ מלך ישראל את הנבאים ארבע מאות איש ויאמר אלהם הנלך אל רמת גלעד למלחמה אם אחדל ויאמרו עלה ויתן האלהים ביד המלך
    kjvRefs:
    - 2 Chronicles 18:5
    kjvOsis:
    - 2Chr.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:6
    ref: 2 Chronicles 18:6
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 6
    ordinal: 22738
    text: 'But Jehoshaphat said: ‘Is there not here besides a prophet of the LORD, that we might inquire of him?’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשָׁפָט הַאֵין פֹּה נָבִיא לַיהוָה עוֹד וְנִדְרְשָׁה מֵאֹתוֹ׃
    hebrewPlain: ויאמר יהושפט האין פה נביא ליהוה עוד ונדרשה מאתו
    kjvRefs:
    - 2 Chronicles 18:6
    kjvOsis:
    - 2Chr.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:7
    ref: 2 Chronicles 18:7
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 7
    ordinal: 22739
    text: 'And the king of Israel said unto Jehoshaphat: ‘There is yet one man by whom we may inquire of the LORD; but I hate him; for he never prophesieth good concerning me, but always evil; the same is Micaiah the son of Imla.’ And Jehoshaphat said: ‘Let not the king say so.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ־יִשְׂרָאֵל אֶל־יְהוֹשָׁפָט עוֹד אִישׁ־אֶחָד לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ וַאֲנִי שְׂנֵאתִיהוּ כִּי־אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה כִּי כָל־יָמָיו לְרָעָה הוּא מִיכָיְהוּ בֶן־יִמְלָא וַיֹּאמֶר יְהוֹשָׁפָט אַל־יֹאמַר הַמֶּלֶךְ כֵּן׃
    hebrewPlain: ויאמר מלך ישראל אל יהושפט עוד איש אחד לדרוש את יהוה מאתו ואני שנאתיהו כי איננו מתנבא עלי לטובה כי כל ימיו לרעה הוא מיכיהו בן ימלא ויאמר יהושפט אל יאמר המלך כן
    kjvRefs:
    - 2 Chronicles 18:7
    kjvOsis:
    - 2Chr.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:8
    ref: 2 Chronicles 18:8
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 8
    ordinal: 22740
    text: 'Then the king of Israel called an officer, and said: ‘Fetch quickly Micaiah the son of Imla.’'
    translation: JPS 1917
    original: וַיִּקְרָא מֶלֶךְ יִשְׂרָאֵל אֶל־סָרִיס אֶחָד וַיֹּאמֶר מַהֵר מיכהו [מִיכָיְהוּ] בֶן־יִמְלָא׃
    hebrewPlain: ויקרא מלך ישראל אל סריס אחד ויאמר מהר מיכהו [מיכיהו] בן ימלא
    kjvRefs:
    - 2 Chronicles 18:8
    kjvOsis:
    - 2Chr.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:9
    ref: 2 Chronicles 18:9
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 9
    ordinal: 22741
    text: Now the king of Israel and Jehoshaphat the king of Judah sat each on his throne, arrayed in their robes, and they sat in a threshing-floor at the entrance of the gate of Samaria; and all the prophets were prophesying before them.
    translation: JPS 1917
    original: וּמֶלֶךְ יִשְׂרָאֵל וִיהוֹשָׁפָט מֶלֶךְ־יְהוּדָה יוֹשְׁבִים אִישׁ עַל־כִּסְאוֹ מְלֻבָּשִׁים בְּגָדִים וְיֹשְׁבִים בְּגֹרֶן פֶּתַח שַׁעַר שֹׁמְרוֹן וְכָל־הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם׃
    hebrewPlain: ומלך ישראל ויהושפט מלך יהודה יושבים איש על כסאו מלבשים בגדים וישבים בגרן פתח שער שמרון וכל הנביאים מתנבאים לפניהם
    kjvRefs:
    - 2 Chronicles 18:9
    kjvOsis:
    - 2Chr.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:10
    ref: 2 Chronicles 18:10
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 10
    ordinal: 22742
    text: 'And Zedekiah the son of Chenaanah made him horns of iron, and said: ‘Thus saith the LORD: With these shalt thou gore the Arameans, until they be consumed.’'
    translation: JPS 1917
    original: וַיַּעַשׂ לוֹ צִדְקִיָּהוּ בֶן־כְּנַעֲנָה קַרְנֵי בַרְזֶל וַיֹּאמֶר כֹּה־אָמַר יְהוָה בְּאֵלֶּה תְּנַגַּח אֶת־אֲרָם עַד־כַּלּוֹתָם׃
    hebrewPlain: ויעש לו צדקיהו בן כנענה קרני ברזל ויאמר כה אמר יהוה באלה תנגח את ארם עד כלותם
    kjvRefs:
    - 2 Chronicles 18:10
    kjvOsis:
    - 2Chr.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:11
    ref: 2 Chronicles 18:11
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 11
    ordinal: 22743
    text: 'And all the prophets prophesied so, saying: ‘Go up to Ramoth-gilead, and prosper; for the LORD will deliver it into the hand of the king.’'
    translation: JPS 1917
    original: וְכָל־הַנְּבִאִים נִבְּאִים כֵּן לֵאמֹר עֲלֵה רָמֹת גִּלְעָד וְהַצְלַח וְנָתַן יְהוָה בְּיַד הַמֶּלֶךְ׃
    hebrewPlain: וכל הנבאים נבאים כן לאמר עלה רמת גלעד והצלח ונתן יהוה ביד המלך
    kjvRefs:
    - 2 Chronicles 18:11
    kjvOsis:
    - 2Chr.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:12
    ref: 2 Chronicles 18:12
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 12
    ordinal: 22744
    text: 'And the messenger that went to call Micaiah spoke to him, saying: ‘Behold, the words of the prophets declare good to the king with one mouth; let thy word therefore, I pray thee, be like one of theirs, and speak thou good.’'
    translation: JPS 1917
    original: וְהַמַּלְאָךְ אֲשֶׁר־הָלַךְ לִקְרֹא לְמִיכָיְהוּ דִּבֶּר אֵלָיו לֵאמֹר הִנֵּה דִּבְרֵי הַנְּבִאִים פֶּה־אֶחָד טוֹב אֶל־הַמֶּלֶךְ וִיהִי־נָא דְבָרְךָ כְּאַחַד מֵהֶם וְדִבַּרְתָּ טּוֹב׃
    hebrewPlain: והמלאך אשר הלך לקרא למיכיהו דבר אליו לאמר הנה דברי הנבאים פה אחד טוב אל המלך ויהי נא דברך כאחד מהם ודברת טוב
    kjvRefs:
    - 2 Chronicles 18:12
    kjvOsis:
    - 2Chr.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:13
    ref: 2 Chronicles 18:13
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 13
    ordinal: 22745
    text: 'And Micaiah said: ‘As the LORD liveth, what my God saith, that will I speak.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מִיכָיְהוּ חַי־יְהוָה כִּי אֶת־אֲשֶׁר־יֹאמַר אֱלֹהַי אֹתוֹ אֲדַבֵּר׃
    hebrewPlain: ויאמר מיכיהו חי יהוה כי את אשר יאמר אלהי אתו אדבר
    kjvRefs:
    - 2 Chronicles 18:13
    kjvOsis:
    - 2Chr.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:14
    ref: 2 Chronicles 18:14
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 14
    ordinal: 22746
    text: 'And when he was come to the king, the king said unto him: ‘aMicaiah, shall we go to Ramoth-gilead to battle, or shall I forbear?’ And he said: ‘Go ye up, and prosper; and they shall be delivered into your hand.’'
    translation: JPS 1917
    original: וַיָּבֹא אֶל־הַמֶּלֶךְ וַיֹּאמֶר הַמֶּלֶךְ אֵלָיו מִיכָה הֲנֵלֵךְ אֶל־רָמֹת גִּלְעָד לַמִּלְחָמָה אִם־אֶחְדָּל וַיֹּאמֶר עֲלוּ וְהַצְלִיחוּ וְיִנָּתְנוּ בְּיֶדְכֶם׃
    hebrewPlain: ויבא אל המלך ויאמר המלך אליו מיכה הנלך אל רמת גלעד למלחמה אם אחדל ויאמר עלו והצליחו וינתנו בידכם
    kjvRefs:
    - 2 Chronicles 18:14
    kjvOsis:
    - 2Chr.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:15
    ref: 2 Chronicles 18:15
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 15
    ordinal: 22747
    text: 'And the king said to him: ‘How many times shall I adjure thee that thou speak unto me nothing but the truth in the name of the LORD.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ עַד־כַּמֶּה פְעָמִים אֲנִי מַשְׁבִּיעֶךָ אֲשֶׁר לֹא־תְדַבֵּר אֵלַי רַק־אֱמֶת בְּשֵׁם יְהוָה׃
    hebrewPlain: ויאמר אליו המלך עד כמה פעמים אני משביעך אשר לא תדבר אלי רק אמת בשם יהוה
    kjvRefs:
    - 2 Chronicles 18:15
    kjvOsis:
    - 2Chr.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:16
    ref: 2 Chronicles 18:16
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 16
    ordinal: 22748
    text: 'And he said: ‘I saw all Israel scattered upon the mountains, as sheep that have no shepherd; and the LORD said: These have no master, let them return every man to his house in peace.’'
    translation: JPS 1917
    original: וַיֹּאמֶר רָאִיתִי אֶת־כָּל־יִשְׂרָאֵל נְפוֹצִים עַל־הֶהָרִים כַּצֹּאן אֲשֶׁר אֵין־לָהֶן רֹעֶה וַיֹּאמֶר יְהוָה לֹא־אֲדֹנִים לָאֵלֶּה יָשׁוּבוּ אִישׁ־לְבֵיתוֹ בְּשָׁלוֹם׃
    hebrewPlain: ויאמר ראיתי את כל ישראל נפוצים על ההרים כצאן אשר אין להן רעה ויאמר יהוה לא אדנים לאלה ישובו איש לביתו בשלום
    kjvRefs:
    - 2 Chronicles 18:16
    kjvOsis:
    - 2Chr.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:17
    ref: 2 Chronicles 18:17
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 17
    ordinal: 22749
    text: 'And the king of Israel said to Jehoshaphat: ‘Did I not tell thee that he would not prophesy good concerning me, but evil?’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ־יִשְׂרָאֵל אֶל־יְהוֹשָׁפָט הֲלֹא אָמַרְתִּי אֵלֶיךָ לֹא־יִתְנַבֵּא עָלַי טוֹב כִּי אִם־לְרָע׃
    hebrewPlain: ויאמר מלך ישראל אל יהושפט הלא אמרתי אליך לא יתנבא עלי טוב כי אם לרע
    kjvRefs:
    - 2 Chronicles 18:17
    kjvOsis:
    - 2Chr.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:18
    ref: 2 Chronicles 18:18
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 18
    ordinal: 22750
    text: 'And he said: ‘Therefore hear ye the word of the LORD: I saw the LORD sitting upon His throne, and all the host of heaven standing on His right hand and on His left.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָכֵן שִׁמְעוּ דְבַר־יְהוָה רָאִיתִי אֶת־יְהוָה יוֹשֵׁב עַל־כִּסְאוֹ וְכָל־צְבָא הַשָּׁמַיִם עֹמְדִים עַל־יְמִינוֹ וּשְׂמֹאלוֹ׃
    hebrewPlain: ויאמר לכן שמעו דבר יהוה ראיתי את יהוה יושב על כסאו וכל צבא השמים עמדים על ימינו ושמאלו
    kjvRefs:
    - 2 Chronicles 18:18
    kjvOsis:
    - 2Chr.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:19
    ref: 2 Chronicles 18:19
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 19
    ordinal: 22751
    text: 'And the LORD said: who shall entice Ahab king of Israel, that he may go up and fall at Ramoth-gilead? And one spoke saying after this manner, and another saying after that manner.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה מִי יְפַתֶּה אֶת־אַחְאָב מֶלֶךְ־יִשְׂרָאֵל וְיַעַל וְיִפֹּל בְּרָמוֹת גִּלְעָד וַיֹּאמֶר זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה׃
    hebrewPlain: ויאמר יהוה מי יפתה את אחאב מלך ישראל ויעל ויפל ברמות גלעד ויאמר זה אמר ככה וזה אמר ככה
    kjvRefs:
    - 2 Chronicles 18:19
    kjvOsis:
    - 2Chr.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:20
    ref: 2 Chronicles 18:20
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 20
    ordinal: 22752
    text: 'And there came forth the spirit, and stood before the LORD, and said: I will entice him. And the LORD said unto him: Wherewith?'
    translation: JPS 1917
    original: וַיֵּצֵא הָרוּחַ וַיַּעֲמֹד לִפְנֵי יְהוָה וַיֹּאמֶר אֲנִי אֲפַתֶּנּוּ וַיֹּאמֶר יְהוָה אֵלָיו בַּמָּה׃
    hebrewPlain: ויצא הרוח ויעמד לפני יהוה ויאמר אני אפתנו ויאמר יהוה אליו במה
    kjvRefs:
    - 2 Chronicles 18:20
    kjvOsis:
    - 2Chr.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:21
    ref: 2 Chronicles 18:21
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 21
    ordinal: 22753
    text: 'And he said: I will go forth, and will be a lying spirit in the mouth of all his prophets. And He said: Thou shalt entice him, and shalt prevail also; go forth, and do so.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵצֵא וְהָיִיתִי לְרוּחַ שֶׁקֶר בְּפִי כָּל־נְבִיאָיו וַיֹּאמֶר תְּפַתֶּה וְגַם־תּוּכָל צֵא וַעֲשֵׂה־כֵן׃
    hebrewPlain: ויאמר אצא והייתי לרוח שקר בפי כל נביאיו ויאמר תפתה וגם תוכל צא ועשה כן
    kjvRefs:
    - 2 Chronicles 18:21
    kjvOsis:
    - 2Chr.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:22
    ref: 2 Chronicles 18:22
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 22
    ordinal: 22754
    text: Now therefore, behold, the LORD hath put a lying spirit in the mouth of these thy prophets; and the LORD hath spoken evil concerning thee.’
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה נָתַן יְהוָה רוּחַ שֶׁקֶר בְּפִי נְבִיאֶיךָ אֵלֶּה וַיהוָה דִּבֶּר עָלֶיךָ רָעָה׃
    hebrewPlain: ועתה הנה נתן יהוה רוח שקר בפי נביאיך אלה ויהוה דבר עליך רעה
    kjvRefs:
    - 2 Chronicles 18:22
    kjvOsis:
    - 2Chr.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:23
    ref: 2 Chronicles 18:23
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 23
    ordinal: 22755
    text: 'Then Zedekiah the son of Chenaanah came near, and smote Micaiah upon the check, and said: ‘Which way went the spirit of the LORD from me to speak unto thee?’'
    translation: JPS 1917
    original: וַיִּגַּשׁ צִדְקִיָּהוּ בֶן־כְּנַעֲנָה וַיַּךְ אֶת־מִיכָיְהוּ עַל־הַלֶּחִי וַיֹּאמֶר אֵי זֶה הַדֶּרֶךְ עָבַר רוּחַ־יְהוָה מֵאִתִּי לְדַבֵּר אֹתָךְ׃
    hebrewPlain: ויגש צדקיהו בן כנענה ויך את מיכיהו על הלחי ויאמר אי זה הדרך עבר רוח יהוה מאתי לדבר אתך
    kjvRefs:
    - 2 Chronicles 18:23
    kjvOsis:
    - 2Chr.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:24
    ref: 2 Chronicles 18:24
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 24
    ordinal: 22756
    text: 'And Micaiah said: ‘Behold, thou shalt see on that day, when thou shalt go into an inner chamber to hide thyself.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מִיכָיְהוּ הִנְּךָ רֹאֶה בַּיּוֹם הַהוּא אֲשֶׁר תָּבוֹא חֶדֶר בְּחֶדֶר לְהֵחָבֵא׃
    hebrewPlain: ויאמר מיכיהו הנך ראה ביום ההוא אשר תבוא חדר בחדר להחבא
    kjvRefs:
    - 2 Chronicles 18:24
    kjvOsis:
    - 2Chr.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:25
    ref: 2 Chronicles 18:25
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 25
    ordinal: 22757
    text: 'And the king of Israel said: ‘Take ye Micaiah; and carry him back unto Amon the governor of the city, and to Joash the king’s son;'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ יִשְׂרָאֵל קְחוּ אֶת־מִיכָיְהוּ וַהֲשִׁיבֻהוּ אֶל־אָמוֹן שַׂר־הָעִיר וְאֶל־יוֹאָשׁ בֶּן־הַמֶּלֶךְ׃
    hebrewPlain: ויאמר מלך ישראל קחו את מיכיהו והשיבהו אל אמון שר העיר ואל יואש בן המלך
    kjvRefs:
    - 2 Chronicles 18:25
    kjvOsis:
    - 2Chr.18.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:26
    ref: 2 Chronicles 18:26
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 26
    ordinal: 22758
    text: 'and say: Thus saith the king: Put this fellow in the prison, and feed him with scant bread and with scant water, until I return in peace.’'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם כֹּה אָמַר הַמֶּלֶךְ שִׂימוּ זֶה בֵּית הַכֶּלֶא וְהַאֲכִלֻהוּ לֶחֶם לַחַץ וּמַיִם לַחַץ עַד שׁוּבִי בְשָׁלוֹם׃
    hebrewPlain: ואמרתם כה אמר המלך שימו זה בית הכלא והאכלהו לחם לחץ ומים לחץ עד שובי בשלום
    kjvRefs:
    - 2 Chronicles 18:26
    kjvOsis:
    - 2Chr.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:27
    ref: 2 Chronicles 18:27
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 27
    ordinal: 22759
    text: 'And Micaiah said: ‘If thou return at all in peace, the LORD hath not spoken by me.’ And he said: ‘Hear, ye peoples, all of you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מִיכָיְהוּ אִם־שׁוֹב תָּשׁוּב בְּשָׁלוֹם לֹא־דִבֶּר יְהוָה בִּי וַיֹּאמֶר שִׁמְעוּ עַמִּים כֻּלָּם׃
    hebrewPlain: ויאמר מיכיהו אם שוב תשוב בשלום לא דבר יהוה בי ויאמר שמעו עמים כלם
    kjvRefs:
    - 2 Chronicles 18:27
    kjvOsis:
    - 2Chr.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:28
    ref: 2 Chronicles 18:28
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 28
    ordinal: 22760
    text: So the king of Israel and Jehoshaphat the kind of Judah went up to Ramoth-gilead.
    translation: JPS 1917
    original: וַיַּעַל מֶלֶךְ־יִשְׂרָאֵל וִיהוֹשָׁפָט מֶלֶךְ־יְהוּדָה אֶל־רָמֹת גִּלְעָד׃
    hebrewPlain: ויעל מלך ישראל ויהושפט מלך יהודה אל רמת גלעד
    kjvRefs:
    - 2 Chronicles 18:28
    kjvOsis:
    - 2Chr.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:29
    ref: 2 Chronicles 18:29
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 29
    ordinal: 22761
    text: 'And the king of Israel said unto Jehoshaphat: ‘I will disguise myself, and go into the battle; but put thou on thy robes.’ So the king of Israel disguised himself; and they went into the battle.'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ יִשְׂרָאֵל אֶל־יְהוֹשָׁפָט הִתְחַפֵּשׂ וָבוֹא בַמִּלְחָמָה וְאַתָּה לְבַשׁ בְּגָדֶיךָ וַיִּתְחַפֵּשׂ מֶלֶךְ יִשְׂרָאֵל וַיָּבֹאוּ בַּמִּלְחָמָה׃
    hebrewPlain: ויאמר מלך ישראל אל יהושפט התחפש ובוא במלחמה ואתה לבש בגדיך ויתחפש מלך ישראל ויבאו במלחמה
    kjvRefs:
    - 2 Chronicles 18:29
    kjvOsis:
    - 2Chr.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:30
    ref: 2 Chronicles 18:30
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 30
    ordinal: 22762
    text: 'Now the king of Aram had commanded the captains of his chariots, saying: ‘Fight neither with small nor great, save only with the king of Israel.’'
    translation: JPS 1917
    original: וּמֶלֶךְ אֲרָם צִוָּה אֶת־שָׂרֵי הָרֶכֶב אֲשֶׁר־לוֹ לֵאמֹר לֹא תִּלָּחֲמוּ אֶת־הַקָּטֹן אֶת־הַגָּדוֹל כִּי אִם־אֶת־מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ׃
    hebrewPlain: ומלך ארם צוה את שרי הרכב אשר לו לאמר לא תלחמו את הקטן את הגדול כי אם את מלך ישראל לבדו
    kjvRefs:
    - 2 Chronicles 18:30
    kjvOsis:
    - 2Chr.18.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:31
    ref: 2 Chronicles 18:31
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 31
    ordinal: 22763
    text: 'And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said: ‘It is the king of Israel.’ Therefore they turned about to fight against him; but Jehoshaphat cried out, and the LORD helped him; and God moved them to depart from him.'
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹת שָׂרֵי הָרֶכֶב אֶת־יְהוֹשָׁפָט וְהֵמָּה אָמְרוּ מֶלֶךְ יִשְׂרָאֵל הוּא וַיָּסֹבּוּ עָלָיו לְהִלָּחֵם וַיִּזְעַק יְהוֹשָׁפָט וַיהוָה עֲזָרוֹ וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ׃
    hebrewPlain: ויהי כראות שרי הרכב את יהושפט והמה אמרו מלך ישראל הוא ויסבו עליו להלחם ויזעק יהושפט ויהוה עזרו ויסיתם אלהים ממנו
    kjvRefs:
    - 2 Chronicles 18:31
    kjvOsis:
    - 2Chr.18.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:32
    ref: 2 Chronicles 18:32
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 32
    ordinal: 22764
    text: And it came to pass, when the captains of the chariots saw that it was not the king of Israel, that they turned back from pursuing him.
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹת שָׂרֵי הָרֶכֶב כִּי לֹא־הָיָה מֶלֶךְ יִשְׂרָאֵל וַיָּשֻׁבוּ מֵאַחֲרָיו׃
    hebrewPlain: ויהי כראות שרי הרכב כי לא היה מלך ישראל וישבו מאחריו
    kjvRefs:
    - 2 Chronicles 18:32
    kjvOsis:
    - 2Chr.18.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:33
    ref: 2 Chronicles 18:33
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 33
    ordinal: 22765
    text: 'And a certain man drew his bow at a venture, and smote the king of Israel between the lower armour and the breastplate; wherefore he said to the driver of the chariot: ‘Turn thy hand, and carry me out of the host; for I am sore wounded.’'
    translation: JPS 1917
    original: וְאִישׁ מָשַׁךְ בַּקֶּשֶׁת לְתֻמּוֹ וַיַּךְ אֶת־מֶלֶךְ יִשְׂרָאֵל בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן וַיֹּאמֶר לָרַכָּב הֲפֹךְ ידיך [יָדְךָ] וְהוֹצֵאתַנִי מִן־הַמַּחֲנֶה כִּי הָחֳלֵיתִי׃
    hebrewPlain: ואיש משך בקשת לתמו ויך את מלך ישראל בין הדבקים ובין השרין ויאמר לרכב הפך ידיך [ידך] והוצאתני מן המחנה כי החליתי
    kjvRefs:
    - 2 Chronicles 18:33
    kjvOsis:
    - 2Chr.18.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.18.34
    scripture: tanakh
    name: Tanakh 2 Chronicles 18:34
    ref: 2 Chronicles 18:34
    book: 2Chr
    section: ketuvim
    chapter: 18
    verse: 34
    ordinal: 22766
    text: And the battle increased that day; howbeit the king of Israel stayed himself up in his chariot against the Arameans until the even; and about the time of the going down of the sun he died.
    translation: JPS 1917
    original: וַתַּעַל הַמִּלְחָמָה בַּיּוֹם הַהוּא וּמֶלֶךְ יִשְׂרָאֵל הָיָה מַעֲמִיד בַּמֶּרְכָּבָה נֹכַח אֲרָם עַד־הָעָרֶב וַיָּמָת לְעֵת בּוֹא הַשָּׁמֶשׁ׃
    hebrewPlain: ותעל המלחמה ביום ההוא ומלך ישראל היה מעמיד במרכבה נכח ארם עד הערב וימת לעת בוא השמש
    kjvRefs:
    - 2 Chronicles 18:34
    kjvOsis:
    - 2Chr.18.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.18
- type: TanakhVerse
  data:
    osis: 2Chr.19.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:1
    ref: 2 Chronicles 19:1
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 1
    ordinal: 22767
    text: And Jehoshaphat the king of Judah returned to his house in peace to Jerusalem.
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹשָׁפָט מֶלֶךְ־יְהוּדָה אֶל־בֵּיתוֹ בְּשָׁלוֹם לִירוּשָׁלִָם׃
    hebrewPlain: וישב יהושפט מלך יהודה אל ביתו בשלום לירושלם
    kjvRefs:
    - 2 Chronicles 19:1
    kjvOsis:
    - 2Chr.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:2
    ref: 2 Chronicles 19:2
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 2
    ordinal: 22768
    text: 'And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat: ‘Shouldest thou help the wicked, and love them that hate the LORD? for this thing wrath is upon thee from before the LORD.'
    translation: JPS 1917
    original: וַיֵּצֵא אֶל־פָּנָיו יֵהוּא בֶן־חֲנָנִי הַחֹזֶה וַיֹּאמֶר אֶל־הַמֶּלֶךְ יְהוֹשָׁפָט הֲלָרָשָׁע לַעְזֹר וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב וּבָזֹאת עָלֶיךָ קֶּצֶף מִלִּפְנֵי יְהוָה׃
    hebrewPlain: ויצא אל פניו יהוא בן חנני החזה ויאמר אל המלך יהושפט הלרשע לעזר ולשנאי יהוה תאהב ובזאת עליך קצף מלפני יהוה
    kjvRefs:
    - 2 Chronicles 19:2
    kjvOsis:
    - 2Chr.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:3
    ref: 2 Chronicles 19:3
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 3
    ordinal: 22769
    text: Nevertheless there are good things found in thee, in that thou hast put away the Asheroth out of the land, and hast set thy heart to seek God.’
    translation: JPS 1917
    original: אֲבָל דְּבָרִים טוֹבִים נִמְצְאוּ עִמָּךְ כִּי־בִעַרְתָּ הָאֲשֵׁרוֹת מִן־הָאָרֶץ וַהֲכִינוֹתָ לְבָבְךָ לִדְרֹשׁ הָאֱלֹהִים׃
    hebrewPlain: אבל דברים טובים נמצאו עמך כי בערת האשרות מן הארץ והכינות לבבך לדרש האלהים
    kjvRefs:
    - 2 Chronicles 19:3
    kjvOsis:
    - 2Chr.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:4
    ref: 2 Chronicles 19:4
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 4
    ordinal: 22770
    text: And Jehoshaphat dwelt at Jerusalem; and he went out again among the people from Beer-sheba to the hill-country of Ephraim, and brought them back unto the LORD, the God of their fathers.
    translation: JPS 1917
    original: וַיֵּשֶׁב יְהוֹשָׁפָט בִּירוּשָׁלִָם וַיָּשָׁב וַיֵּצֵא בָעָם מִבְּאֵר שֶׁבַע עַד־הַר אֶפְרַיִם וַיְשִׁיבֵם אֶל־יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: וישב יהושפט בירושלם וישב ויצא בעם מבאר שבע עד הר אפרים וישיבם אל יהוה אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 19:4
    kjvOsis:
    - 2Chr.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:5
    ref: 2 Chronicles 19:5
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 5
    ordinal: 22771
    text: And he set judges in the land throughout all the fortified cities of Judah, city by city,
    translation: JPS 1917
    original: וַיַּעֲמֵד שֹׁפְטִים בָּאָרֶץ בְּכָל־עָרֵי יְהוּדָה הַבְּצֻרוֹת לְעִיר וָעִיר׃
    hebrewPlain: ויעמד שפטים בארץ בכל ערי יהודה הבצרות לעיר ועיר
    kjvRefs:
    - 2 Chronicles 19:5
    kjvOsis:
    - 2Chr.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:6
    ref: 2 Chronicles 19:6
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 6
    ordinal: 22772
    text: 'and said to the judges: ‘Consider what ye do; for ye judge not for man, but for the LORD; and [He is] with you in giving judgment.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־הַשֹּׁפְטִים רְאוּ מָה־אַתֶּם עֹשִׂים כִּי לֹא לְאָדָם תִּשְׁפְּטוּ כִּי לַיהוָה וְעִמָּכֶם בִּדְבַר מִשְׁפָּט׃
    hebrewPlain: ויאמר אל השפטים ראו מה אתם עשים כי לא לאדם תשפטו כי ליהוה ועמכם בדבר משפט
    kjvRefs:
    - 2 Chronicles 19:6
    kjvOsis:
    - 2Chr.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:7
    ref: 2 Chronicles 19:7
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 7
    ordinal: 22773
    text: Now therefore let the fear of the LORD be upon you; take heed and do it; for there is no iniquity with the LORD our God, nor respect of persons, nor taking of bribes.’
    translation: JPS 1917
    original: וְעַתָּה יְהִי פַחַד־יְהוָה עֲלֵיכֶם שִׁמְרוּ וַעֲשׂוּ כִּי־אֵין עִם־יְהוָה אֱלֹהֵינוּ עַוְלָה וּמַשֹּׂא פָנִים וּמִקַּח־שֹׁחַד׃
    hebrewPlain: ועתה יהי פחד יהוה עליכם שמרו ועשו כי אין עם יהוה אלהינו עולה ומשא פנים ומקח שחד
    kjvRefs:
    - 2 Chronicles 19:7
    kjvOsis:
    - 2Chr.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:8
    ref: 2 Chronicles 19:8
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 8
    ordinal: 22774
    text: Moreover in Jerusalem did Jehoshaphat set of the Levites and the priests, and of the heads of the fathers’ houses of Israel, for the judgment of the LORD, and for controversies. And they returned to Jerusalem.
    translation: JPS 1917
    original: וְגַם בִּירוּשָׁלִַם הֶעֱמִיד יְהוֹשָׁפָט מִן־הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל לְמִשְׁפַּט יְהוָה וְלָרִיב וַיָּשֻׁבוּ יְרוּשָׁלִָם׃
    hebrewPlain: וגם בירושלם העמיד יהושפט מן הלוים והכהנים ומראשי האבות לישראל למשפט יהוה ולריב וישבו ירושלם
    kjvRefs:
    - 2 Chronicles 19:8
    kjvOsis:
    - 2Chr.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:9
    ref: 2 Chronicles 19:9
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 9
    ordinal: 22775
    text: 'And he charged them, saying: ‘Thus shall ye do in the fear of the LORD, faithfully, and with a whole heart.'
    translation: JPS 1917
    original: וַיְצַו עֲלֵיהֶם לֵאמֹר כֹּה תַעֲשׂוּן בְּיִרְאַת יְהוָה בֶּאֱמוּנָה וּבְלֵבָב שָׁלֵם׃
    hebrewPlain: ויצו עליהם לאמר כה תעשון ביראת יהוה באמונה ובלבב שלם
    kjvRefs:
    - 2 Chronicles 19:9
    kjvOsis:
    - 2Chr.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:10
    ref: 2 Chronicles 19:10
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 10
    ordinal: 22776
    text: And whensoever any controversy shall come to you from your brethren that dwell in their cities, between blood and blood, between law and commandment, statutes and ordinances, ye shall warn them, that they be not guilty towards the LORD, and so wrath come upon you and upon your brethren; thus shall ye do, and ye shall not be guilty.
    translation: JPS 1917
    original: וְכָל־רִיב אֲשֶׁר־יָבוֹא עֲלֵיכֶם מֵאֲחֵיכֶם הַיֹּשְׁבִים בְּעָרֵיהֶם בֵּין־דָּם לְדָם בֵּין־תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים וְהִזְהַרְתֶּם אֹתָם וְלֹא יֶאְשְׁמוּ לַיהוָה וְהָיָה־קֶצֶף עֲלֵיכֶם וְעַל־אֲחֵיכֶם כֹּה תַעֲשׂוּן וְלֹא תֶאְשָׁמוּ׃
    hebrewPlain: וכל ריב אשר יבוא עליכם מאחיכם הישבים בעריהם בין דם לדם בין תורה למצוה לחקים ולמשפטים והזהרתם אתם ולא יאשמו ליהוה והיה קצף עליכם ועל אחיכם כה תעשון ולא תאשמו
    kjvRefs:
    - 2 Chronicles 19:10
    kjvOsis:
    - 2Chr.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.19.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 19:11
    ref: 2 Chronicles 19:11
    book: 2Chr
    section: ketuvim
    chapter: 19
    verse: 11
    ordinal: 22777
    text: And, behold, Amariah the chief priest is over you in all matters of the LORD; and Zebadiah the son of Ishmael, the ruler of the house of Judah, in all the king’s matters; also the officers of the Levites before you. Deal courageously, and the LORD be with the good.’
    translation: JPS 1917
    original: וְהִנֵּה אֲמַרְיָהוּ כֹהֵן הָרֹאשׁ עֲלֵיכֶם לְכֹל דְּבַר־יְהוָה וּזְבַדְיָהוּ בֶן־יִשְׁמָעֵאל הַנָּגִיד לְבֵית־יְהוּדָה לְכֹל דְּבַר־הַמֶּלֶךְ וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם חִזְקוּ וַעֲשׂוּ וִיהִי יְהוָה עִם־הַטּוֹב׃
    hebrewPlain: והנה אמריהו כהן הראש עליכם לכל דבר יהוה וזבדיהו בן ישמעאל הנגיד לבית יהודה לכל דבר המלך ושטרים הלוים לפניכם חזקו ועשו ויהי יהוה עם הטוב
    kjvRefs:
    - 2 Chronicles 19:11
    kjvOsis:
    - 2Chr.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.19
- type: TanakhVerse
  data:
    osis: 2Chr.20.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:1
    ref: 2 Chronicles 20:1
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 1
    ordinal: 22778
    text: And it came to pass after this, that the children of Moab, and the children of Ammon, and with them some of the Ammonites, came against Jehoshaphat to battle.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵיכֵן בָּאוּ בְנֵי־מוֹאָב וּבְנֵי עַמּוֹן וְעִמָּהֶם מֵהָעַמּוֹנִים עַל־יְהוֹשָׁפָט לַמִּלְחָמָה׃
    hebrewPlain: ויהי אחריכן באו בני מואב ובני עמון ועמהם מהעמונים על יהושפט למלחמה
    kjvRefs:
    - 2 Chronicles 20:1
    kjvOsis:
    - 2Chr.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:2
    ref: 2 Chronicles 20:2
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 2
    ordinal: 22779
    text: 'Then there came some that told Jehoshaphat, saying: ‘There cometh a great multitude against thee from beyond the sea from Aram; and, behold, they are in Hazazon-tamar’—the same is En-gedi.'
    translation: JPS 1917
    original: וַיָּבֹאוּ וַיַּגִּידוּ לִיהוֹשָׁפָט לֵאמֹר בָּא עָלֶיךָ הָמוֹן רָב מֵעֵבֶר לַיָּם מֵאֲרָם וְהִנָּם בְּחַצְצוֹן תָּמָר הִיא עֵין גֶּדִי׃
    hebrewPlain: ויבאו ויגידו ליהושפט לאמר בא עליך המון רב מעבר לים מארם והנם בחצצון תמר היא עין גדי
    kjvRefs:
    - 2 Chronicles 20:2
    kjvOsis:
    - 2Chr.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:3
    ref: 2 Chronicles 20:3
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 3
    ordinal: 22780
    text: And Jehoshaphat feared, and set himself to seek unto the LORD; and he proclaimed a fast throughout all Judah.
    translation: JPS 1917
    original: וַיִּרָא וַיִּתֵּן יְהוֹשָׁפָט אֶת־פָּנָיו לִדְרוֹשׁ לַיהוָה וַיִּקְרָא־צוֹם עַל־כָּל־יְהוּדָה׃
    hebrewPlain: וירא ויתן יהושפט את פניו לדרוש ליהוה ויקרא צום על כל יהודה
    kjvRefs:
    - 2 Chronicles 20:3
    kjvOsis:
    - 2Chr.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:4
    ref: 2 Chronicles 20:4
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 4
    ordinal: 22781
    text: And Judah gathered themselves together, to seek help of the LORD; even out of all the cities of Judah they came to seek the LORD.
    translation: JPS 1917
    original: וַיִּקָּבְצוּ יְהוּדָה לְבַקֵּשׁ מֵיְהוָה גַּם מִכָּל־עָרֵי יְהוּדָה בָּאוּ לְבַקֵּשׁ אֶת־יְהוָה׃
    hebrewPlain: ויקבצו יהודה לבקש מיהוה גם מכל ערי יהודה באו לבקש את יהוה
    kjvRefs:
    - 2 Chronicles 20:4
    kjvOsis:
    - 2Chr.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:5
    ref: 2 Chronicles 20:5
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 5
    ordinal: 22782
    text: And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of the LORD, before the new court;
    translation: JPS 1917
    original: וַיַּעֲמֹד יְהוֹשָׁפָט בִּקְהַל יְהוּדָה וִירוּשָׁלִַם בְּבֵית יְהוָה לִפְנֵי הֶחָצֵר הַחֲדָשָׁה׃
    hebrewPlain: ויעמד יהושפט בקהל יהודה וירושלם בבית יהוה לפני החצר החדשה
    kjvRefs:
    - 2 Chronicles 20:5
    kjvOsis:
    - 2Chr.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:6
    ref: 2 Chronicles 20:6
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 6
    ordinal: 22783
    text: 'and he said: ‘O LORD, the God of our fathers, art not Thou alone God in heaven? and art not Thou ruler over all the kingdoms of the nations? and in Thy hand is power and might, so that none is able to withstand Thee.'
    translation: JPS 1917
    original: וַיֹּאמַר יְהוָה אֱלֹהֵי אֲבֹתֵינוּ הֲלֹא אַתָּה־הוּא אֱלֹהִים בַּשָּׁמַיִם וְאַתָּה מוֹשֵׁל בְּכֹל מַמְלְכוֹת הַגּוֹיִם וּבְיָדְךָ כֹּחַ וּגְבוּרָה וְאֵין עִמְּךָ לְהִתְיַצֵּב׃
    hebrewPlain: ויאמר יהוה אלהי אבתינו הלא אתה הוא אלהים בשמים ואתה מושל בכל ממלכות הגוים ובידך כח וגבורה ואין עמך להתיצב
    kjvRefs:
    - 2 Chronicles 20:6
    kjvOsis:
