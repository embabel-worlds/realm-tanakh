  data:
    osis: 2Chr.4.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:17
    ref: 2 Chronicles 4:17
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 22453
    text: In the plain of the Jordan did the king cast them, in the clay ground between Succoth and Zeredah.
    translation: JPS 1917
    original: בְּכִכַּר הַיַּרְדֵּן יְצָקָם הַמֶּלֶךְ בַּעֲבִי הָאֲדָמָה בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה׃
    hebrewPlain: בככר הירדן יצקם המלך בעבי האדמה בין סכות ובין צרדתה
    kjvRefs:
    - 2 Chronicles 4:17
    kjvOsis:
    - 2Chr.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
