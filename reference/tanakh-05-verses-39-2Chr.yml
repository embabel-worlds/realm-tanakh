    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:13
    ref: 2 Chronicles 5:13
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 22471
    text: 'it came even to pass, when the trumpeters and singers were as one, to make one sound to be heard in praising and thanking the LORD; and when they lifted up their voice with the trumpets and cymbals and instruments of music, and praised the LORD: ‘for He is good, for His mercy endureth for ever’; that then the house was filled with a cloud, even the house of the LORD,'
    translation: JPS 1917
    original: וַיְהִי כְאֶחָד למחצצרים [לַמְחַצְּרִים] וְלַמְשֹׁרֲרִים לְהַשְׁמִיעַ קוֹל־אֶחָד לְהַלֵּל וּלְהֹדוֹת לַיהוָה וּכְהָרִים קוֹל בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר וּבְהַלֵּל לַיהוָה כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה׃
    hebrewPlain: ויהי כאחד למחצצרים [למחצרים] ולמשררים להשמיע קול אחד להלל ולהדות ליהוה וכהרים קול בחצצרות ובמצלתים ובכלי השיר ובהלל ליהוה כי טוב כי לעולם חסדו והבית מלא ענן בית יהוה
    kjvRefs:
    - 2 Chronicles 5:13
    kjvOsis:
    - 2Chr.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:14
    ref: 2 Chronicles 5:14
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 22472
    text: so that the priests could not stand to minister by reason of the cloud; for the glory of the LORD filled the house of God.
    translation: JPS 1917
    original: וְלֹא־יָכְלוּ הַכֹּהֲנִים לַעֲמוֹד לְשָׁרֵת מִפְּנֵי הֶעָנָן כִּי־מָלֵא כְבוֹד־יְהוָה אֶת־בֵּית הָאֱלֹהִים׃
    hebrewPlain: ולא יכלו הכהנים לעמוד לשרת מפני הענן כי מלא כבוד יהוה את בית האלהים
    kjvRefs:
    - 2 Chronicles 5:14
    kjvOsis:
    - 2Chr.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
