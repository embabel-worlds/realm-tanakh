    scripture: tanakh
    name: Tanakh 2 Chronicles 1:6
    ref: 2 Chronicles 1:6
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 22390
    text: And Solomon offered there, upon the brazen altar before the LORD, which was at the tent of meeting, he offered a thousand burnt-offerings upon it.
    translation: JPS 1917
    original: וַיַּעַל שְׁלֹמֹה שָׁם עַל־מִזְבַּח הַנְּחֹשֶׁת לִפְנֵי יְהוָה אֲשֶׁר לְאֹהֶל מוֹעֵד וַיַּעַל עָלָיו עֹלוֹת אָלֶף׃
    hebrewPlain: ויעל שלמה שם על מזבח הנחשת לפני יהוה אשר לאהל מועד ויעל עליו עלות אלף
    kjvRefs:
