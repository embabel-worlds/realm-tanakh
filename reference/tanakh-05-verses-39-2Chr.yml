    translation: JPS 1917
    original: וַיְהִי עִם־לְבַב דָּוִיד אָבִי לִבְנוֹת בַּיִת לְשֵׁם יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויהי עם לבב דויד אבי לבנות בית לשם יהוה אלהי ישראל
    kjvRefs:
    - 2 Chronicles 6:7
    kjvOsis:
    - 2Chr.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
