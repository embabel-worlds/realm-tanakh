    translation: JPS 1917
    original: וַיֹּאמֶר שְׁלֹמֹה לְכָל־יִשְׂרָאֵל לְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת וְלַשֹּׁפְטִים וּלְכֹל נָשִׂיא לְכָל־יִשְׂרָאֵל רָאשֵׁי הָאָבוֹת׃
    hebrewPlain: ויאמר שלמה לכל ישראל לשרי האלפים והמאות ולשפטים ולכל נשיא לכל ישראל ראשי האבות
