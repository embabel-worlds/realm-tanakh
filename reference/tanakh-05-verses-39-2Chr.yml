    ref: 2 Chronicles 4:15
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 22451
    text: one sea, and the twelve oxen under it.
    translation: JPS 1917
    original: אֶת־הַיָּם אֶחָד וְאֶת־הַבָּקָר שְׁנֵים־עָשָׂר תַּחְתָּיו׃
    hebrewPlain: את הים אחד ואת הבקר שנים עשר תחתיו
    kjvRefs:
