    scripture: tanakh
    name: Tanakh 2 Chronicles 5:12
    ref: 2 Chronicles 5:12
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 22470
    text: also the Levites who were the singers, all of them, even Asaph, Heman, Jeduthun, and their sons and their brethren, arrayed in fine linen, with cymbals and psalteries and harps, stood at the east end of the altar, and with them a hundred and twenty priests sounding with trumpets—
    translation: JPS 1917
    original: וְהַלְוִיִּם הַמְשֹׁרֲרִים לְכֻלָּם לְאָסָף לְהֵימָן לִידֻתוּן וְלִבְנֵיהֶם וְלַאֲחֵיהֶם מְלֻבָּשִׁים בּוּץ בִּמְצִלְתַּיִם וּבִנְבָלִים וְכִנֹּרוֹת עֹמְדִים מִזְרָח לַמִּזְבֵּחַ וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים מחצררים [מַחְצְרִים] בַּחֲצֹצְרוֹת׃
    hebrewPlain: והלוים המשררים לכלם לאסף להימן לידתון ולבניהם ולאחיהם מלבשים בוץ במצלתים ובנבלים וכנרות עמדים מזרח למזבח ועמהם כהנים למאה ועשרים מחצררים [מחצרים] בחצצרות
    kjvRefs:
    - 2 Chronicles 5:12
    kjvOsis:
    - 2Chr.5.12
