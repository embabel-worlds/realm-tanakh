- type: TanakhVerse
  data:
    osis: 2Chr.14.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:1
    ref: 2 Chronicles 14:1
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 1
    ordinal: 22667
    text: And Asa did that which was good and right in the eyes of the LORD his God;
    translation: JPS 1917
    original: וַיַּעַשׂ אָסָא הַטּוֹב וְהַיָּשָׁר בְּעֵינֵי יְהוָה אֱלֹהָיו׃
    hebrewPlain: ויעש אסא הטוב והישר בעיני יהוה אלהיו
    kjvRefs:
    - 2 Chronicles 14:2
    kjvOsis:
    - 2Chr.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:2
    ref: 2 Chronicles 14:2
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 2
    ordinal: 22668
    text: for he took away the strange altars, and the high places, and broke down the pillars, and hewed down the Asherim;
    translation: JPS 1917
    original: וַיָּסַר אֶת־מִזְבְּחוֹת הַנֵּכָר וְהַבָּמוֹת וַיְשַׁבֵּר אֶת־הַמַּצֵּבוֹת וַיְגַדַּע אֶת־הָאֲשֵׁרִים׃
    hebrewPlain: ויסר את מזבחות הנכר והבמות וישבר את המצבות ויגדע את האשרים
    kjvRefs:
    - 2 Chronicles 14:3
    kjvOsis:
    - 2Chr.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:3
    ref: 2 Chronicles 14:3
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 3
    ordinal: 22669
    text: and commanded Judah to seek the LORD, the God of their fathers, and to do the law and the commandment. .
    translation: JPS 1917
    original: וַיֹּאמֶר לִיהוּדָה לִדְרוֹשׁ אֶת־יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם וְלַעֲשׂוֹת הַתּוֹרָה וְהַמִּצְוָה׃
    hebrewPlain: ויאמר ליהודה לדרוש את יהוה אלהי אבותיהם ולעשות התורה והמצוה
    kjvRefs:
    - 2 Chronicles 14:4
    kjvOsis:
    - 2Chr.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:4
    ref: 2 Chronicles 14:4
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 4
    ordinal: 22670
    text: Also he took away out of all the cities of Judah the high places and the sun-images; and the kingdom was quiet before him.
    translation: JPS 1917
    original: וַיָּסַר מִכָּל־עָרֵי יְהוּדָה אֶת־הַבָּמוֹת וְאֶת־הַחַמָּנִים וַתִּשְׁקֹט הַמַּמְלָכָה לְפָנָיו׃
    hebrewPlain: ויסר מכל ערי יהודה את הבמות ואת החמנים ותשקט הממלכה לפניו
    kjvRefs:
    - 2 Chronicles 14:5
    kjvOsis:
    - 2Chr.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:5
    ref: 2 Chronicles 14:5
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 5
    ordinal: 22671
    text: And he built fortified cities in Judah; for the land was quiet, and he had no war in those years; because the LORD had given him rest.
    translation: JPS 1917
    original: וַיִּבֶן עָרֵי מְצוּרָה בִּיהוּדָה כִּי־שָׁקְטָה הָאָרֶץ וְאֵין־עִמּוֹ מִלְחָמָה בַּשָּׁנִים הָאֵלֶּה כִּי־הֵנִיחַ יְהוָה לוֹ׃
    hebrewPlain: ויבן ערי מצורה ביהודה כי שקטה הארץ ואין עמו מלחמה בשנים האלה כי הניח יהוה לו
    kjvRefs:
    - 2 Chronicles 14:6
    kjvOsis:
    - 2Chr.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:6
    ref: 2 Chronicles 14:6
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 6
    ordinal: 22672
    text: 'For he said unto Judah: ‘Let us build these cities, and make about them walls, and towers, gates, and bars; the land is yet before us, because we have sought the LORD our God; we have sought Him, and He hath given us rest on every side.’ So they built and prospered.'
    translation: JPS 1917
    original: וַיֹּאמֶר לִיהוּדָה נִבְנֶה אֶת־הֶעָרִים הָאֵלֶּה וְנָסֵב חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ כִּי דָרַשְׁנוּ אֶת־יְהוָה אֱלֹהֵינוּ דָּרַשְׁנוּ וַיָּנַח לָנוּ מִסָּבִיב וַיִּבְנוּ וַיַּצְלִיחוּ׃
    hebrewPlain: ויאמר ליהודה נבנה את הערים האלה ונסב חומה ומגדלים דלתים ובריחים עודנו הארץ לפנינו כי דרשנו את יהוה אלהינו דרשנו וינח לנו מסביב ויבנו ויצליחו
    kjvRefs:
    - 2 Chronicles 14:7
    kjvOsis:
    - 2Chr.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:7
    ref: 2 Chronicles 14:7
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 7
    ordinal: 22673
    text: And Asa had an army that bore bucklers and spears, out of Judah three hundred thousand; and out of Benjamin, that bore shields and drew bows, two hundred and fourscore thousand; all these were mighty men of valour.
    translation: JPS 1917
    original: וַיְהִי לְאָסָא חַיִל נֹשֵׂא צִנָּה וָרֹמַח מִיהוּדָה שְׁלֹשׁ מֵאוֹת אֶלֶף וּמִבִּנְיָמִן נֹשְׂאֵי מָגֵן וְדֹרְכֵי קֶשֶׁת מָאתַיִם וּשְׁמוֹנִים אָלֶף כָּל־אֵלֶּה גִּבּוֹרֵי חָיִל׃
    hebrewPlain: ויהי לאסא חיל נשא צנה ורמח מיהודה שלש מאות אלף ומבנימן נשאי מגן ודרכי קשת מאתים ושמונים אלף כל אלה גבורי חיל
    kjvRefs:
    - 2 Chronicles 14:8
    kjvOsis:
    - 2Chr.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:8
    ref: 2 Chronicles 14:8
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 8
    ordinal: 22674
    text: And there came out against them Zerah the Ethiopian with an army of a thousand thousand, and three hundred chariots; and he came unto Mareshah.
    translation: JPS 1917
    original: וַיֵּצֵא אֲלֵיהֶם זֶרַח הַכּוּשִׁי בְּחַיִל אֶלֶף אֲלָפִים וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת וַיָּבֹא עַד־מָרֵשָׁה׃
    hebrewPlain: ויצא אליהם זרח הכושי בחיל אלף אלפים ומרכבות שלש מאות ויבא עד מרשה
    kjvRefs:
    - 2 Chronicles 14:9
    kjvOsis:
    - 2Chr.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:9
    ref: 2 Chronicles 14:9
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 9
    ordinal: 22675
    text: Then Asa went out to meet him, and they set the battle in array in the valley of Zephath at Mareshah.
    translation: JPS 1917
    original: וַיֵּצֵא אָסָא לְפָנָיו וַיַּעַרְכוּ מִלְחָמָה בְּגֵיא צְפַתָה לְמָרֵשָׁה׃
    hebrewPlain: ויצא אסא לפניו ויערכו מלחמה בגיא צפתה למרשה
    kjvRefs:
    - 2 Chronicles 14:10
    kjvOsis:
    - 2Chr.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:10
    ref: 2 Chronicles 14:10
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 10
    ordinal: 22676
    text: 'And Asa cried unto the LORD his God, and said: ‘LORD, there is none beside Thee to help, between the mighty and him that hath no strength; help us, O LORD our God; for we rely on Thee, and in Thy name are we come against this multitude. Thou art the LORD our God; let not man prevail against Thee.’'
    translation: JPS 1917
    original: וַיִּקְרָא אָסָא אֶל־יְהוָה אֱלֹהָיו וַיֹּאמַר יְהוָה אֵין־עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ עָזְרֵנוּ יְהוָה אֱלֹהֵינוּ כִּי־עָלֶיךָ נִשְׁעַנּוּ וּבְשִׁמְךָ בָאנוּ עַל־הֶהָמוֹן הַזֶּה יְהוָה אֱלֹהֵינוּ אַתָּה אַל־יַעְצֹר עִמְּךָ אֱנוֹשׁ׃
    hebrewPlain: ויקרא אסא אל יהוה אלהיו ויאמר יהוה אין עמך לעזור בין רב לאין כח עזרנו יהוה אלהינו כי עליך נשענו ובשמך באנו על ההמון הזה יהוה אלהינו אתה אל יעצר עמך אנוש
    kjvRefs:
    - 2 Chronicles 14:11
    kjvOsis:
    - 2Chr.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:11
    ref: 2 Chronicles 14:11
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 11
    ordinal: 22677
    text: So the LORD smote the Ethiopians before Asa, and before Judah; and the Ethiopians fled.
    translation: JPS 1917
    original: וַיִּגֹּף יְהוָה אֶת־הַכּוּשִׁים לִפְנֵי אָסָא וְלִפְנֵי יְהוּדָה וַיָּנֻסוּ הַכּוּשִׁים׃
    hebrewPlain: ויגף יהוה את הכושים לפני אסא ולפני יהודה וינסו הכושים
    kjvRefs:
    - 2 Chronicles 14:12
    kjvOsis:
    - 2Chr.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:12
    ref: 2 Chronicles 14:12
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 12
    ordinal: 22678
    text: And Asa and the people that were with him pursued them unto Gerar; and there fell of the Ethiopians so that none remained alive; for they were shattered before the LORD, and before His host; and they carried away very much booty.
    translation: JPS 1917
    original: וַיִּרְדְּפֵם אָסָא וְהָעָם אֲשֶׁר־עִמּוֹ עַד־לִגְרָר וַיִּפֹּל מִכּוּשִׁים לְאֵין לָהֶם מִחְיָה כִּי־נִשְׁבְּרוּ לִפְנֵי־יְהוָה וְלִפְנֵי מַחֲנֵהוּ וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד׃
    hebrewPlain: וירדפם אסא והעם אשר עמו עד לגרר ויפל מכושים לאין להם מחיה כי נשברו לפני יהוה ולפני מחנהו וישאו שלל הרבה מאד
    kjvRefs:
    - 2 Chronicles 14:13
    kjvOsis:
    - 2Chr.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:13
    ref: 2 Chronicles 14:13
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 13
    ordinal: 22679
    text: And they smote all the cities round about Gerar; for a terror from the LORD came upon them; and they spoiled all the cities; for there was much spoil in them.
    translation: JPS 1917
    original: וַיַּכּוּ אֵת כָּל־הֶעָרִים סְבִיבוֹת גְּרָר כִּי־הָיָה פַחַד־יְהוָה עֲלֵיהֶם וַיָּבֹזּוּ אֶת־כָּל־הֶעָרִים כִּי־בִזָּה רַבָּה הָיְתָה בָהֶם׃
    hebrewPlain: ויכו את כל הערים סביבות גרר כי היה פחד יהוה עליהם ויבזו את כל הערים כי בזה רבה היתה בהם
    kjvRefs:
    - 2 Chronicles 14:14
    kjvOsis:
    - 2Chr.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.14.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 14:14
    ref: 2 Chronicles 14:14
    book: 2Chr
    section: ketuvim
    chapter: 14
    verse: 14
    ordinal: 22680
    text: They smote also the tents of cattle, and carried away sheep in abundance and camels, and returned to Jerusalem.
    translation: JPS 1917
    original: וְגַם־אָהֳלֵי מִקְנֶה הִכּוּ וַיִּשְׁבּוּ צֹאן לָרֹב וּגְמַלִּים וַיָּשֻׁבוּ יְרוּשָׁלִָם׃
    hebrewPlain: וגם אהלי מקנה הכו וישבו צאן לרב וגמלים וישבו ירושלם
    kjvRefs:
    - 2 Chronicles 14:15
    kjvOsis:
    - 2Chr.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.14
- type: TanakhVerse
  data:
    osis: 2Chr.15.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 15:1
    ref: 2 Chronicles 15:1
    book: 2Chr
    section: ketuvim
    chapter: 15
    verse: 1
    ordinal: 22681
    text: And the spirit of God came upon Azariah the son of Oded;
    translation: JPS 1917
    original: וַעֲזַרְיָהוּ בֶּן־עוֹדֵד הָיְתָה עָלָיו רוּחַ אֱלֹהִים׃
    hebrewPlain: ועזריהו בן עודד היתה עליו רוח אלהים
    kjvRefs:
    - 2 Chronicles 15:1
    kjvOsis:
