  data:
    osis: 2Chr.11.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:7
    ref: 2 Chronicles 11:7
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 22611
    text: and Beth-zur, and Soco, and Adullam,
    translation: JPS 1917
    original: וְאֶת־בֵּית־צוּר וְאֶת־שׂוֹכוֹ וְאֶת־עֲדֻלָּם׃
    hebrewPlain: ואת בית צור ואת שוכו ואת עדלם
    kjvRefs:
    - 2 Chronicles 11:7
