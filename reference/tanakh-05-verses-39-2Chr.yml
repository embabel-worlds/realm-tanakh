  data:
    osis: 2Chr.6.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:3
    ref: 2 Chronicles 6:3
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 22475
    text: And the king turned his face, and blessed all the congregation of Israel; and all the congregation of Israel stood.
    translation: JPS 1917
    original: וַיַּסֵּב הַמֶּלֶךְ אֶת־פָּנָיו וַיְבָרֶךְ אֵת כָּל־קְהַל יִשְׂרָאֵל וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד׃
    hebrewPlain: ויסב המלך את פניו ויברך את כל קהל ישראל וכל קהל ישראל עומד
    kjvRefs:
    - 2 Chronicles 6:3
    kjvOsis:
    - 2Chr.6.3
  relations:
