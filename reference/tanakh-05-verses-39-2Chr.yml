  data:
    osis: 2Chr.6.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:13
    ref: 2 Chronicles 6:13
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 22485
    text: for Solomon had made a brazen scaffold, of five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court; and upon it he stood, and kneeled down upon his knees before all the congregation of Israel, and spread forth his hands toward heaven—
    translation: JPS 1917
    original: כִּי־עָשָׂה שְׁלֹמֹה כִּיּוֹר נְחֹשֶׁת וַיִּתְּנֵהוּ בְּתוֹךְ הָעֲזָרָה חָמֵשׁ אַמּוֹת אָרְכּוֹ וְחָמֵשׁ אַמּוֹת רָחְבּוֹ וְאַמּוֹת שָׁלוֹשׁ קוֹמָתוֹ וַיַּעֲמֹד עָלָיו וַיִּבְרַךְ עַל־בִּרְכָּיו נֶגֶד כָּל־קְהַל יִשְׂרָאֵל וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה׃
    hebrewPlain: כי עשה שלמה כיור נחשת ויתנהו בתוך העזרה חמש אמות ארכו וחמש אמות רחבו ואמות שלוש קומתו ויעמד עליו ויברך על ברכיו נגד כל קהל ישראל ויפרש כפיו השמימה
    kjvRefs:
    - 2 Chronicles 6:13
    kjvOsis:
    - 2Chr.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:14
    ref: 2 Chronicles 6:14
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 22486
    text: 'and he said: ‘O LORD, the God of Israel, there is no God like Thee, in the heaven, or in the earth; who keepest covenant and mercy with Thy servants, that walk before Thee with all their heart;'
    translation: JPS 1917
    original: וַיֹּאמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֵין־כָּמוֹךָ אֱלֹהִים בַּשָּׁמַיִם וּבָאָרֶץ שֹׁמֵר הַבְּרִית וְהַחֶסֶד לַעֲבָדֶיךָ הַהֹלְכִים לְפָנֶיךָ בְּכָל־לִבָּם׃
    hebrewPlain: ויאמר יהוה אלהי ישראל אין כמוך אלהים בשמים ובארץ שמר הברית והחסד לעבדיך ההלכים לפניך בכל לבם
    kjvRefs:
    - 2 Chronicles 6:14
    kjvOsis:
    - 2Chr.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:15
    ref: 2 Chronicles 6:15
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 22487
    text: who hast kept with Thy servant David my father that which Thou didst promise him; yea, Thou spokest with Thy mouth, and hast fulfilled it with Thy hand, as it is this day.
    translation: JPS 1917
    original: אֲשֶׁר שָׁמַרְתָּ לְעַבְדְּךָ דָּוִיד אָבִי אֵת אֲשֶׁר־דִּבַּרְתָּ לוֹ וַתְּדַבֵּר בְּפִיךָ וּבְיָדְךָ מִלֵּאתָ כַּיּוֹם הַזֶּה׃
    hebrewPlain: אשר שמרת לעבדך דויד אבי את אשר דברת לו ותדבר בפיך ובידך מלאת כיום הזה
    kjvRefs:
    - 2 Chronicles 6:15
    kjvOsis:
    - 2Chr.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:16
    ref: 2 Chronicles 6:16
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 22488
    text: 'Now therefore, O LORD, the God of Israel, keep with Thy servant David my father that which Thou hast promised him, saying: There shall not fail thee a man in My sight to sit on the throne of Israel; if only thy children take heed to their way, to walk in My law as thou hast walked before Me.'
    translation: JPS 1917
    original: וְעַתָּה יְהוָה אֱלֹהֵי יִשְׂרָאֵל שְׁמֹר לְעַבְדְּךָ דָוִיד אָבִי אֵת אֲשֶׁר דִּבַּרְתָּ לּוֹ לֵאמֹר לֹא־יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי יוֹשֵׁב עַל־כִּסֵּא יִשְׂרָאֵל רַק אִם־יִשְׁמְרוּ בָנֶיךָ אֶת־דַּרְכָּם לָלֶכֶת בְּתוֹרָתִי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי׃
    hebrewPlain: ועתה יהוה אלהי ישראל שמר לעבדך דויד אבי את אשר דברת לו לאמר לא יכרת לך איש מלפני יושב על כסא ישראל רק אם ישמרו בניך את דרכם ללכת בתורתי כאשר הלכת לפני
    kjvRefs:
    - 2 Chronicles 6:16
    kjvOsis:
    - 2Chr.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:17
    ref: 2 Chronicles 6:17
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 22489
    text: Now therefore, O LORD, the God of Israel, let Thy word be verified, which Thou spokest unto Thy servant David.
    translation: JPS 1917
    original: וְעַתָּה יְהוָה אֱלֹהֵי יִשְׂרָאֵל יֵאָמֵן דְּבָרְךָ אֲשֶׁר דִּבַּרְתָּ לְעַבְדְּךָ לְדָוִיד׃
    hebrewPlain: ועתה יהוה אלהי ישראל יאמן דברך אשר דברת לעבדך לדויד
    kjvRefs:
    - 2 Chronicles 6:17
    kjvOsis:
    - 2Chr.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:18
    ref: 2 Chronicles 6:18
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 22490
    text: But will God in very truth dwell with men on the earth? behold, heaven and the heaven of heavens cannot contain Thee; how much less this house which I have builded!
    translation: JPS 1917
    original: כִּי הַאֻמְנָם יֵשֵׁב אֱלֹהִים אֶת־הָאָדָם עַל־הָאָרֶץ הִנֵּה שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם לֹא יְכַלְכְּלוּךָ אַף כִּי־הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי׃
    hebrewPlain: כי האמנם ישב אלהים את האדם על הארץ הנה שמים ושמי השמים לא יכלכלוך אף כי הבית הזה אשר בניתי
    kjvRefs:
    - 2 Chronicles 6:18
    kjvOsis:
    - 2Chr.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:19
    ref: 2 Chronicles 6:19
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 22491
    text: Yet have Thou respect unto the prayer of Thy servant, and to his supplication, O LORD my God, to hearken unto the cry and to the prayer which Thy servant prayeth before Thee;
    translation: JPS 1917
    original: וּפָנִיתָ אֶל־תְּפִלַּת עַבְדְּךָ וְאֶל־תְּחִנָּתוֹ יְהוָה אֱלֹהָי לִשְׁמֹעַ אֶל־הָרִנָּה וְאֶל־הַתְּפִלָּה אֲשֶׁר עַבְדְּךָ מִתְפַּלֵּל לְפָנֶיךָ׃
    hebrewPlain: ופנית אל תפלת עבדך ואל תחנתו יהוה אלהי לשמע אל הרנה ואל התפלה אשר עבדך מתפלל לפניך
    kjvRefs:
    - 2 Chronicles 6:19
    kjvOsis:
    - 2Chr.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:20
    ref: 2 Chronicles 6:20
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 20
    ordinal: 22492
    text: that Thine eyes may be open toward this house day and night, even toward the place whereof Thou hast said that thou wouldest put Thy name there; to hearken unto the prayer which Thy servant shall pray toward this place.
    translation: JPS 1917
    original: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת אֶל־הַבַּיִת הַזֶּה יוֹמָם וָלַיְלָה אֶל־הַמָּקוֹם אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם לִשְׁמוֹעַ אֶל־הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל עַבְדְּךָ אֶל־הַמָּקוֹם הַזֶּה׃
    hebrewPlain: להיות עיניך פתחות אל הבית הזה יומם ולילה אל המקום אשר אמרת לשום שמך שם לשמוע אל התפלה אשר יתפלל עבדך אל המקום הזה
    kjvRefs:
    - 2 Chronicles 6:20
    kjvOsis:
    - 2Chr.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:21
    ref: 2 Chronicles 6:21
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 21
    ordinal: 22493
    text: And hearken Thou to the supplications of Thy servant, and of Thy people Israel, when they shall pray toward this place; yea, hear Thou from Thy dwelling-place, even from heaven; and when Thou hearest, forgive.
    translation: JPS 1917
    original: וְשָׁמַעְתָּ אֶל־תַּחֲנוּנֵי עַבְדְּךָ וְעַמְּךָ יִשְׂרָאֵל אֲשֶׁר יִתְפַּלְלוּ אֶל־הַמָּקוֹם הַזֶּה וְאַתָּה תִּשְׁמַע מִמְּקוֹם שִׁבְתְּךָ מִן־הַשָּׁמַיִם וְשָׁמַעְתָּ וְסָלָחְתָּ׃
    hebrewPlain: ושמעת אל תחנוני עבדך ועמך ישראל אשר יתפללו אל המקום הזה ואתה תשמע ממקום שבתך מן השמים ושמעת וסלחת
    kjvRefs:
    - 2 Chronicles 6:21
    kjvOsis:
    - 2Chr.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:22
    ref: 2 Chronicles 6:22
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 22
    ordinal: 22494
    text: If a man sin against his neighbour, and an oath be exacted of him to cause him to swear, and he come and swear before Thine altar in this house;
    translation: JPS 1917
    original: אִם־יֶחֱטָא אִישׁ לְרֵעֵהוּ וְנָשָׁא־בוֹ אָלָה לְהַאֲלֹתוֹ וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ בַּבַּיִת הַזֶּה׃
    hebrewPlain: אם יחטא איש לרעהו ונשא בו אלה להאלתו ובא אלה לפני מזבחך בבית הזה
    kjvRefs:
    - 2 Chronicles 6:22
    kjvOsis:
    - 2Chr.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:23
    ref: 2 Chronicles 6:23
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 23
    ordinal: 22495
    text: then hear Thou from heaven, and do, and judge Thy servants, requiting the wicked, to bring his way upon his own head; and justifying the righteous, to give him according to his righteousness.
    translation: JPS 1917
    original: וְאַתָּה תִּשְׁמַע מִן־הַשָּׁמַיִם וְעָשִׂיתָ וְשָׁפַטְתָּ אֶת־עֲבָדֶיךָ לְהָשִׁיב לְרָשָׁע לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ וּלְהַצְדִּיק צַדִּיק לָתֶת לוֹ כְּצִדְקָתוֹ׃
    hebrewPlain: ואתה תשמע מן השמים ועשית ושפטת את עבדיך להשיב לרשע לתת דרכו בראשו ולהצדיק צדיק לתת לו כצדקתו
    kjvRefs:
    - 2 Chronicles 6:23
    kjvOsis:
    - 2Chr.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:24
    ref: 2 Chronicles 6:24
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 24
    ordinal: 22496
    text: And if Thy people Israel be smitten down before the enemy, when they sin against Thee, and shall turn again and confess Thy name, and pray and make supplication before Thee in this house;
    translation: JPS 1917
    original: וְאִם־יִנָּגֵף עַמְּךָ יִשְׂרָאֵל לִפְנֵי אוֹיֵב כִּי יֶחֶטְאוּ־לָךְ וְשָׁבוּ וְהוֹדוּ אֶת־שְׁמֶךָ וְהִתְפַּלְלוּ וְהִתְחַנְּנוּ לְפָנֶיךָ בַּבַּיִת הַזֶּה׃
    hebrewPlain: ואם ינגף עמך ישראל לפני אויב כי יחטאו לך ושבו והודו את שמך והתפללו והתחננו לפניך בבית הזה
    kjvRefs:
    - 2 Chronicles 6:24
    kjvOsis:
    - 2Chr.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:25
    ref: 2 Chronicles 6:25
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 25
    ordinal: 22497
    text: then hear Thou from heaven, and forgive the sin of Thy people Israel, and bring them back unto the land which Thou gavest to them and to their fathers.
    translation: JPS 1917
    original: וְאַתָּה תִּשְׁמַע מִן־הַשָּׁמַיִם וְסָלַחְתָּ לְחַטַּאת עַמְּךָ יִשְׂרָאֵל וַהֲשֵׁיבוֹתָם אֶל־הָאֲדָמָה אֲשֶׁר־נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם׃
    hebrewPlain: ואתה תשמע מן השמים וסלחת לחטאת עמך ישראל והשיבותם אל האדמה אשר נתתה להם ולאבתיהם
    kjvRefs:
    - 2 Chronicles 6:25
    kjvOsis:
    - 2Chr.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:26
    ref: 2 Chronicles 6:26
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 26
    ordinal: 22498
    text: When the heaven is shut up, and there is no rain, when they sin against Thee; if they pray toward this place, and confess Thy name, turning from their sin, when Thou dost afflict them;
    translation: JPS 1917
    original: בְּהֵעָצֵר הַשָּׁמַיִם וְלֹא־יִהְיֶה מָטָר כִּי יֶחֶטְאוּ־לָךְ וְהִתְפַּלְלוּ אֶל־הַמָּקוֹם הַזֶּה וְהוֹדוּ אֶת־שְׁמֶךָ מֵחַטָּאתָם יְשׁוּבוּן כִּי תַעֲנֵם׃
    hebrewPlain: בהעצר השמים ולא יהיה מטר כי יחטאו לך והתפללו אל המקום הזה והודו את שמך מחטאתם ישובון כי תענם
    kjvRefs:
    - 2 Chronicles 6:26
    kjvOsis:
    - 2Chr.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:27
    ref: 2 Chronicles 6:27
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 27
    ordinal: 22499
    text: then hear Thou in heaven, and forgive the sin of Thy servants, and of Thy people Israel, when Thou dost direct them on the good way wherein they should walk; and send rain upon Thy land, which Thou hast given to Thy people for an inheritance.
    translation: JPS 1917
    original: וְאַתָּה תִּשְׁמַע הַשָּׁמַיִם וְסָלַחְתָּ לְחַטַּאת עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל כִּי תוֹרֵם אֶל־הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ־בָהּ וְנָתַתָּה מָטָר עַל־אַרְצְךָ אֲשֶׁר־נָתַתָּה לְעַמְּךָ לְנַחֲלָה׃
    hebrewPlain: ואתה תשמע השמים וסלחת לחטאת עבדיך ועמך ישראל כי תורם אל הדרך הטובה אשר ילכו בה ונתתה מטר על ארצך אשר נתתה לעמך לנחלה
    kjvRefs:
    - 2 Chronicles 6:27
    kjvOsis:
    - 2Chr.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:28
    ref: 2 Chronicles 6:28
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 28
    ordinal: 22500
    text: If there be in the land famine, if there be pestilence, if there be blasting or mildew, locust or caterpillar; if their enemies besiege them in the land of their cities; whatsoever plague or whatsoever sickness there be;
    translation: JPS 1917
    original: רָעָב כִּי־יִהְיֶה בָאָרֶץ דֶּבֶר כִּי־יִהְיֶה שִׁדָּפוֹן וְיֵרָקוֹן אַרְבֶּה וְחָסִיל כִּי יִהְיֶה כִּי יָצַר־לוֹ אוֹיְבָיו בְּאֶרֶץ שְׁעָרָיו כָּל־נֶגַע וְכָל־מַחֲלָה׃
    hebrewPlain: רעב כי יהיה בארץ דבר כי יהיה שדפון וירקון ארבה וחסיל כי יהיה כי יצר לו אויביו בארץ שעריו כל נגע וכל מחלה
    kjvRefs:
    - 2 Chronicles 6:28
    kjvOsis:
    - 2Chr.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:29
    ref: 2 Chronicles 6:29
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 29
    ordinal: 22501
    text: what prayer and supplication soever be made by any man, or by all Thy people Israel, who shall know every man his own plague and his own pain, and shall spread forth his hands toward this house;
    translation: JPS 1917
    original: כָּל־תְּפִלָּה כָל־תְּחִנָּה אֲשֶׁר יִהְיֶה לְכָל־הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל אֲשֶׁר יֵדְעוּ אִישׁ נִגְעוֹ וּמַכְאֹבוֹ וּפָרַשׂ כַּפָּיו אֶל־הַבַּיִת הַזֶּה׃
    hebrewPlain: כל תפלה כל תחנה אשר יהיה לכל האדם ולכל עמך ישראל אשר ידעו איש נגעו ומכאבו ופרש כפיו אל הבית הזה
    kjvRefs:
    - 2 Chronicles 6:29
    kjvOsis:
    - 2Chr.6.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:30
    ref: 2 Chronicles 6:30
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 30
    ordinal: 22502
    text: then hear Thou from heaven Thy dwelling-place, and forgive, and render unto every man according to all his ways, whose heart Thou knowest—for Thou, even Thou only, knowest the hearts of the children of men—
    translation: JPS 1917
    original: וְאַתָּה תִּשְׁמַע מִן־הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ וְסָלַחְתָּ וְנָתַתָּה לָאִישׁ כְּכָל־דְּרָכָיו אֲשֶׁר תֵּדַע אֶת־לְבָבוֹ כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ אֶת־לְבַב בְּנֵי הָאָדָם׃
    hebrewPlain: ואתה תשמע מן השמים מכון שבתך וסלחת ונתתה לאיש ככל דרכיו אשר תדע את לבבו כי אתה לבדך ידעת את לבב בני האדם
    kjvRefs:
    - 2 Chronicles 6:30
    kjvOsis:
    - 2Chr.6.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:31
    ref: 2 Chronicles 6:31
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 31
    ordinal: 22503
    text: that they may fear Thee, to walk in Thy ways, all the days that they live in the land which Thou gavest unto our fathers.
    translation: JPS 1917
    original: לְמַעַן יִירָאוּךָ לָלֶכֶת בִּדְרָכֶיךָ כָּל־הַיָּמִים אֲשֶׁר־הֵם חַיִּים עַל־פְּנֵי הָאֲדָמָה אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ׃
    hebrewPlain: למען ייראוך ללכת בדרכיך כל הימים אשר הם חיים על פני האדמה אשר נתתה לאבתינו
    kjvRefs:
    - 2 Chronicles 6:31
    kjvOsis:
    - 2Chr.6.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:32
    ref: 2 Chronicles 6:32
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 32
    ordinal: 22504
    text: Moreover concerning the stranger, that is not of Thy people Israel, when he shall come out of a far country for Thy great name’s sake, and Thy mighty hand, and Thine outstretched arm; when they shall come and pray toward this house;
    translation: JPS 1917
    original: וְגַם אֶל־הַנָּכְרִי אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא וּבָא מֵאֶרֶץ רְחוֹקָה לְמַעַן שִׁמְךָ הַגָּדוֹל וְיָדְךָ הַחֲזָקָה וּזְרוֹעֲךָ הַנְּטוּיָה וּבָאוּ וְהִתְפַּלְלוּ אֶל־הַבַּיִת הַזֶּה׃
    hebrewPlain: וגם אל הנכרי אשר לא מעמך ישראל הוא ובא מארץ רחוקה למען שמך הגדול וידך החזקה וזרועך הנטויה ובאו והתפללו אל הבית הזה
    kjvRefs:
    - 2 Chronicles 6:32
    kjvOsis:
    - 2Chr.6.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:33
    ref: 2 Chronicles 6:33
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 33
    ordinal: 22505
    text: then hear Thou from heaven, even from Thy dwelling-place, and do according to all that the stranger calleth to Thee for; that all the peoples of the earth may know Thy name, and fear Thee, as doth Thy people Israel, and that they may know that Thy name is called upon this house which I have built.
    translation: JPS 1917
    original: וְאַתָּה תִּשְׁמַע מִן־הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ וְעָשִׂיתָ כְּכֹל אֲשֶׁר־יִקְרָא אֵלֶיךָ הַנָּכְרִי לְמַעַן יֵדְעוּ כָל־עַמֵּי הָאָרֶץ אֶת־שְׁמֶךָ וּלְיִרְאָה אֹתְךָ כְּעַמְּךָ יִשְׂרָאֵל וְלָדַעַת כִּי־שִׁמְךָ נִקְרָא עַל־הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי׃
    hebrewPlain: ואתה תשמע מן השמים ממכון שבתך ועשית ככל אשר יקרא אליך הנכרי למען ידעו כל עמי הארץ את שמך וליראה אתך כעמך ישראל ולדעת כי שמך נקרא על הבית הזה אשר בניתי
    kjvRefs:
    - 2 Chronicles 6:33
    kjvOsis:
    - 2Chr.6.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.34
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:34
    ref: 2 Chronicles 6:34
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 34
    ordinal: 22506
    text: If Thy people go out to battle against their enemies, by whatsoever way Thou shalt send them, and they pray unto Thee toward this city which Thou hast chosen, and the house which I have built for Thy name;
    translation: JPS 1917
    original: כִּי־יֵצֵא עַמְּךָ לַמִּלְחָמָה עַל־אוֹיְבָיו בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם וְהִתְפַּלְלוּ אֵלֶיךָ דֶּרֶךְ הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתָּ בָּהּ וְהַבַּיִת אֲשֶׁר־בָּנִיתִי לִשְׁמֶךָ׃
    hebrewPlain: כי יצא עמך למלחמה על אויביו בדרך אשר תשלחם והתפללו אליך דרך העיר הזאת אשר בחרת בה והבית אשר בניתי לשמך
    kjvRefs:
    - 2 Chronicles 6:34
    kjvOsis:
    - 2Chr.6.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.35
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:35
    ref: 2 Chronicles 6:35
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 35
    ordinal: 22507
    text: then hear Thou from heaven their prayer and their supplication, and maintain their cause.
    translation: JPS 1917
    original: וְשָׁמַעְתָּ מִן־הַשָּׁמַיִם אֶת־תְּפִלָּתָם וְאֶת־תְּחִנָּתָם וְעָשִׂיתָ מִשְׁפָּטָם׃
    hebrewPlain: ושמעת מן השמים את תפלתם ואת תחנתם ועשית משפטם
    kjvRefs:
    - 2 Chronicles 6:35
    kjvOsis:
    - 2Chr.6.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.36
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:36
    ref: 2 Chronicles 6:36
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 36
    ordinal: 22508
    text: If they sin against Thee—for there is no man that sinneth not—and Thou be angry with them, and deliver them to the enemy, so that they carry them away captive unto a land far off or near;
    translation: JPS 1917
    original: כִּי יֶחֶטְאוּ־לָךְ כִּי אֵין אָדָם אֲשֶׁר לֹא־יֶחֱטָא וְאָנַפְתָּ בָם וּנְתַתָּם לִפְנֵי אוֹיֵב וְשָׁבוּם שׁוֹבֵיהֶם אֶל־אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה׃
    hebrewPlain: כי יחטאו לך כי אין אדם אשר לא יחטא ואנפת בם ונתתם לפני אויב ושבום שוביהם אל ארץ רחוקה או קרובה
    kjvRefs:
    - 2 Chronicles 6:36
    kjvOsis:
    - 2Chr.6.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.37
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:37
    ref: 2 Chronicles 6:37
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 37
    ordinal: 22509
    text: 'yet if they shall bethink themselves in the land whither they are carried captive, and turn, and make supplication unto Thee in the land of their captivity, saying: We have sinned, we have done iniquitously, and have dealt wickedly;'
    translation: JPS 1917
    original: וְהֵשִׁיבוּ אֶל־לְבָבָם בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ־שָׁם וְשָׁבוּ וְהִתְחַנְּנוּ אֵלֶיךָ בְּאֶרֶץ שִׁבְיָם לֵאמֹר חָטָאנוּ הֶעֱוִינוּ וְרָשָׁעְנוּ׃
    hebrewPlain: והשיבו אל לבבם בארץ אשר נשבו שם ושבו והתחננו אליך בארץ שבים לאמר חטאנו העוינו ורשענו
    kjvRefs:
    - 2 Chronicles 6:37
    kjvOsis:
    - 2Chr.6.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.38
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:38
    ref: 2 Chronicles 6:38
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 38
    ordinal: 22510
    text: if they return unto Thee with all their heart and with all their soul in the land of their captivity, whither they have carried them captive, and pray toward their land, which Thou gavest unto their fathers, and the city which Thou hast chosen, and toward the house which I have built for Thy name;
    translation: JPS 1917
    original: וְשָׁבוּ אֵלֶיךָ בְּכָל־לִבָּם וּבְכָל־נַפְשָׁם בְּאֶרֶץ שִׁבְיָם אֲשֶׁר־שָׁבוּ אֹתָם וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם אֲשֶׁר נָתַתָּה לַאֲבוֹתָם וְהָעִיר אֲשֶׁר בָּחַרְתָּ וְלַבַּיִת אֲשֶׁר־בָּנִיתִי לִשְׁמֶךָ׃
    hebrewPlain: ושבו אליך בכל לבם ובכל נפשם בארץ שבים אשר שבו אתם והתפללו דרך ארצם אשר נתתה לאבותם והעיר אשר בחרת ולבית אשר בניתי לשמך
    kjvRefs:
    - 2 Chronicles 6:38
    kjvOsis:
    - 2Chr.6.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.39
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:39
    ref: 2 Chronicles 6:39
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 39
    ordinal: 22511
    text: then hear Thou from heaven, even from Thy dwelling-place, their prayer and their supplications, and maintain their cause; and forgive Thy people who have sinned against Thee.
    translation: JPS 1917
    original: וְשָׁמַעְתָּ מִן־הַשָּׁמַיִם מִמְּכוֹן שִׁבְתְּךָ אֶת־תְּפִלָּתָם וְאֶת־תְּחִנֹּתֵיהֶם וְעָשִׂיתָ מִשְׁפָּטָם וְסָלַחְתָּ לְעַמְּךָ אֲשֶׁר חָטְאוּ־לָךְ׃
    hebrewPlain: ושמעת מן השמים ממכון שבתך את תפלתם ואת תחנתיהם ועשית משפטם וסלחת לעמך אשר חטאו לך
    kjvRefs:
    - 2 Chronicles 6:39
    kjvOsis:
    - 2Chr.6.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.40
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:40
    ref: 2 Chronicles 6:40
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 40
    ordinal: 22512
    text: Now, O my God, let, I beseech Thee, Thine eyes be open, and let Thine ears be attent, unto the prayer that is made in this place.
    translation: JPS 1917
    original: עַתָּה אֱלֹהַי יִהְיוּ־נָא עֵינֶיךָ פְּתֻחוֹת וְאָזְנֶיךָ קַשֻּׁבוֹת לִתְפִלַּת הַמָּקוֹם הַזֶּה׃
    hebrewPlain: עתה אלהי יהיו נא עיניך פתחות ואזניך קשבות לתפלת המקום הזה
    kjvRefs:
    - 2 Chronicles 6:40
    kjvOsis:
    - 2Chr.6.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.41
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:41
    ref: 2 Chronicles 6:41
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 41
    ordinal: 22513
    text: Now therefore arise, O LORD God, into Thy resting-place, Thou, and the ark of Thy strength; Let Thy priests, O LORD God, be clothed with salvation, And let Thy saints rejoice in good.
    translation: JPS 1917
    original: וְעַתָּה קוּמָה יְהוָה אֱלֹהִים לְנוּחֶךָ אַתָּה וַאֲרוֹן עֻזֶּךָ כֹּהֲנֶיךָ יְהוָה אֱלֹהִים יִלְבְּשׁוּ תְשׁוּעָה וַחֲסִידֶיךָ יִשְׂמְחוּ בַטּוֹב׃
    hebrewPlain: ועתה קומה יהוה אלהים לנוחך אתה וארון עזך כהניך יהוה אלהים ילבשו תשועה וחסידיך ישמחו בטוב
    kjvRefs:
    - 2 Chronicles 6:41
    kjvOsis:
