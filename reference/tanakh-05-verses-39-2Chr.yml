  data:
    osis: 2Chr.13.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:23
    ref: 2 Chronicles 13:23
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 23
    ordinal: 22666
    text: So Abijah slept with his fathers, and they buried him in the city of David, and Asa his son reigned in his stead; in his days the land was quiet ten years.
    translation: JPS 1917
    original: וַיִּשְׁכַּב אֲבִיָּה עִם־אֲבֹתָיו וַיִּקְבְּרוּ אֹתוֹ בְּעִיר דָּוִיד וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו בְּיָמָיו שָׁקְטָה הָאָרֶץ עֶשֶׂר שָׁנִים׃
    hebrewPlain: וישכב אביה עם אבתיו ויקברו אתו בעיר דויד וימלך אסא בנו תחתיו בימיו שקטה הארץ עשר שנים
    kjvRefs:
    - 2 Chronicles 14:1
    kjvOsis:
    - 2Chr.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
