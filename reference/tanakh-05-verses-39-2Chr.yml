    ordinal: 22469
    text: And it came to pass, when the priests were come out of the holy place—for all the priests that were present had sanctified themselves, and did not keep their courses;
    translation: JPS 1917
    original: וַיְהִי בְּצֵאת הַכֹּהֲנִים מִן־הַקֹּדֶשׁ כִּי כָּל־הַכֹּהֲנִים הַנִּמְצְאִים הִתְקַדָּשׁוּ אֵין לִשְׁמוֹר לְמַחְלְקוֹת׃
    hebrewPlain: ויהי בצאת הכהנים מן הקדש כי כל הכהנים הנמצאים התקדשו אין לשמור למחלקות
