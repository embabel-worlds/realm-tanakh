- type: TanakhVerse
  data:
    osis: 2Chr.10.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:13
    ref: 2 Chronicles 10:13
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 22598
    text: And the king answered them roughly; and king Rehoboam forsook the counsel of the old men,
    translation: JPS 1917
    original: וַיַּעֲנֵם הַמֶּלֶךְ קָשָׁה וַיַּעֲזֹב הַמֶּלֶךְ רְחַבְעָם אֵת עֲצַת הַזְּקֵנִים׃
    hebrewPlain: ויענם המלך קשה ויעזב המלך רחבעם את עצת הזקנים
    kjvRefs:
    - 2 Chronicles 10:13
    kjvOsis:
    - 2Chr.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:14
    ref: 2 Chronicles 10:14
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 22599
    text: 'and spoke to them after the counsel of the young men, saying: ‘[My father] made your yoke heavy, but I will add thereto; my father chastised you with whips, but I will chastise you with scorpions.’'
    translation: JPS 1917
    original: וַיְדַבֵּר אֲלֵהֶם כַּעֲצַת הַיְלָדִים לֵאמֹר אַכְבִּיד אֶת־עֻלְּכֶם וַאֲנִי אֹסִיף עָלָיו אָבִי יִסַּר אֶתְכֶם בַּשּׁוֹטִים וַאֲנִי בָּעֲקְרַבִּים׃
    hebrewPlain: וידבר אלהם כעצת הילדים לאמר אכביד את עלכם ואני אסיף עליו אבי יסר אתכם בשוטים ואני בעקרבים
    kjvRefs:
    - 2 Chronicles 10:14
    kjvOsis:
    - 2Chr.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:15
    ref: 2 Chronicles 10:15
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 22600
    text: So the king hearkened not unto the people; for it was brought about of God, that the LORD might establish His word, which He spoke by the hand of Ahijah the Shilonite to Jeroboam the son of Nebat.
    translation: JPS 1917
    original: וְלֹא־שָׁמַע הַמֶּלֶךְ אֶל־הָעָם כִּי־הָיְתָה נְסִבָּה מֵעִם הָאֱלֹהִים לְמַעַן הָקִים יְהוָה אֶת־דְּבָרוֹ אֲשֶׁר דִּבֶּר בְּיַד אֲחִיָּהוּ הַשִּׁלוֹנִי אֶל־יָרָבְעָם בֶּן־נְבָט׃
    hebrewPlain: ולא שמע המלך אל העם כי היתה נסבה מעם האלהים למען הקים יהוה את דברו אשר דבר ביד אחיהו השלוני אל ירבעם בן נבט
    kjvRefs:
    - 2 Chronicles 10:15
    kjvOsis:
    - 2Chr.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:16
    ref: 2 Chronicles 10:16
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 22601
    text: 'And when all Israel [saw] that the king hearkened not unto them, the people answered the king, saying: ‘What portion have we in David? neither have we inheritance in the son of Jesse; every man to your tents, O Israel; now see to thine own house, David.’ So all Israel departed unto their tents.'
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל כִּי לֹא־שָׁמַע הַמֶּלֶךְ לָהֶם וַיָּשִׁיבוּ הָעָם אֶת־הַמֶּלֶךְ לֵאמֹר מַה־לָּנוּ חֵלֶק בְּדָוִיד וְלֹא־נַחֲלָה בְּבֶן־יִשַׁי אִישׁ לְאֹהָלֶיךָ יִשְׂרָאֵל עַתָּה רְאֵה בֵיתְךָ דָּוִיד וַיֵּלֶךְ כָּל־יִשְׂרָאֵל לְאֹהָלָיו׃
    hebrewPlain: וכל ישראל כי לא שמע המלך להם וישיבו העם את המלך לאמר מה לנו חלק בדויד ולא נחלה בבן ישי איש לאהליך ישראל עתה ראה ביתך דויד וילך כל ישראל לאהליו
    kjvRefs:
    - 2 Chronicles 10:16
    kjvOsis:
    - 2Chr.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:17
    ref: 2 Chronicles 10:17
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 17
    ordinal: 22602
    text: But as for the children of Israel that dwelt in the cities of Judah, Rehoboam reigned over them.
    translation: JPS 1917
    original: וּבְנֵי יִשְׂרָאֵל הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה וַיִּמְלֹךְ עֲלֵיהֶם רְחַבְעָם׃
    hebrewPlain: ובני ישראל הישבים בערי יהודה וימלך עליהם רחבעם
    kjvRefs:
    - 2 Chronicles 10:17
    kjvOsis:
    - 2Chr.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:18
    ref: 2 Chronicles 10:18
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 22603
    text: Then king Rehoboam sent Hadoram, who was over the levy; and the children of Israel stoned him with stones, so that he died. And king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem.
    translation: JPS 1917
    original: וַיִּשְׁלַח הַמֶּלֶךְ רְחַבְעָם אֶת־הֲדֹרָם אֲשֶׁר עַל־הַמַּס וַיִּרְגְּמוּ־בוֹ בְנֵי־יִשְׂרָאֵל אֶבֶן וַיָּמֹת וְהַמֶּלֶךְ רְחַבְעָם הִתְאַמֵּץ לַעֲלוֹת בַּמֶּרְכָּבָה לָנוּס יְרוּשָׁלִָם׃
    hebrewPlain: וישלח המלך רחבעם את הדרם אשר על המס וירגמו בו בני ישראל אבן וימת והמלך רחבעם התאמץ לעלות במרכבה לנוס ירושלם
    kjvRefs:
    - 2 Chronicles 10:18
    kjvOsis:
    - 2Chr.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:19
    ref: 2 Chronicles 10:19
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 19
    ordinal: 22604
    text: So Israel rebelled against the house of David unto this day.
    translation: JPS 1917
    original: וַיִּפְשְׁעוּ יִשְׂרָאֵל בְּבֵית דָּוִיד עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויפשעו ישראל בבית דויד עד היום הזה
    kjvRefs:
    - 2 Chronicles 10:19
    kjvOsis:
    - 2Chr.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.11.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:1
    ref: 2 Chronicles 11:1
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 22605
    text: And when Rehoboam was come to Jerusalem, he assembled the house of Judah and Benjamin, a hundred and fourscore thousand chosen men, that were warriors, to fight against Israel, to bring the kingdom back to Rehoboam.
    translation: JPS 1917
    original: וַיָּבֹא רְחַבְעָם יְרוּשָׁלִַם וַיַּקְהֵל אֶת־בֵּית יְהוּדָה וּבִנְיָמִן מֵאָה וּשְׁמוֹנִים אֶלֶף בָּחוּר עֹשֵׂה מִלְחָמָה לְהִלָּחֵם עִם־יִשְׂרָאֵל לְהָשִׁיב אֶת־הַמַּמְלָכָה לִרְחַבְעָם׃
    hebrewPlain: ויבא רחבעם ירושלם ויקהל את בית יהודה ובנימן מאה ושמונים אלף בחור עשה מלחמה להלחם עם ישראל להשיב את הממלכה לרחבעם
    kjvRefs:
    - 2 Chronicles 11:1
    kjvOsis:
    - 2Chr.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:2
    ref: 2 Chronicles 11:2
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 22606
    text: 'But the word of the LORD came to Shemaiah the man of God, saying:'
    translation: JPS 1917
    original: וַיְהִי דְּבַר־יְהוָה אֶל־שְׁמַעְיָהוּ אִישׁ־הָאֱלֹהִים לֵאמֹר׃
    hebrewPlain: ויהי דבר יהוה אל שמעיהו איש האלהים לאמר
    kjvRefs:
    - 2 Chronicles 11:2
    kjvOsis:
    - 2Chr.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
