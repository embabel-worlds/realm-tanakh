  data:
    osis: 2Chr.11.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:10
    ref: 2 Chronicles 11:10
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 22614
    text: and Zorah, and Aijalon, and Hebron, which are in Judah and in Benjamin, fortified cities.
    translation: JPS 1917
    original: וְאֶת־צָרְעָה וְאֶת־אַיָּלוֹן וְאֶת־חֶבְרוֹן אֲשֶׁר בִּיהוּדָה וּבְבִנְיָמִן עָרֵי מְצֻרוֹת׃
    hebrewPlain: ואת צרעה ואת אילון ואת חברון אשר ביהודה ובבנימן ערי מצרות
    kjvRefs:
    - 2 Chronicles 11:10
    kjvOsis:
    - 2Chr.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:11
    ref: 2 Chronicles 11:11
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 11
    ordinal: 22615
    text: And he fortified the strongholds, and put captains in them, and store of victual, and oil and wine.
    translation: JPS 1917
    original: וַיְחַזֵּק אֶת־הַמְּצֻרוֹת וַיִּתֵּן בָּהֶם נְגִידִים וְאֹצְרוֹת מַאֲכָל וְשֶׁמֶן וָיָיִן׃
    hebrewPlain: ויחזק את המצרות ויתן בהם נגידים ואצרות מאכל ושמן ויין
    kjvRefs:
    - 2 Chronicles 11:11
    kjvOsis:
    - 2Chr.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:12
    ref: 2 Chronicles 11:12
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 12
    ordinal: 22616
    text: And in every city he put shields and spears, and made them exceeding strong. And Judah and Benjamin adhered to him.
    translation: JPS 1917
    original: וּבְכָל־עִיר וָעִיר צִנּוֹת וּרְמָחִים וַיְחַזְּקֵם לְהַרְבֵּה מְאֹד וַיְהִי־לוֹ יְהוּדָה וּבִנְיָמִן׃
    hebrewPlain: ובכל עיר ועיר צנות ורמחים ויחזקם להרבה מאד ויהי לו יהודה ובנימן
    kjvRefs:
    - 2 Chronicles 11:12
    kjvOsis:
    - 2Chr.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:13
    ref: 2 Chronicles 11:13
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 13
    ordinal: 22617
    text: And the priests and the Levites that were in all Israel presented themselves to him out of all their border.
    translation: JPS 1917
    original: וְהַכֹּהֲנִים וְהַלְוִיִּם אֲשֶׁר בְּכָל־יִשְׂרָאֵל הִתְיַצְּבוּ עָלָיו מִכָּל־גְּבוּלָם׃
    hebrewPlain: והכהנים והלוים אשר בכל ישראל התיצבו עליו מכל גבולם
    kjvRefs:
    - 2 Chronicles 11:13
    kjvOsis:
    - 2Chr.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:14
    ref: 2 Chronicles 11:14
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 14
    ordinal: 22618
    text: For the Levites left their open land and their possession, and came to Judah and Jerusalem; for Jeroboam and his sons cast them off, that they should not execute the priest’s office unto the LORD;
    translation: JPS 1917
    original: כִּי־עָזְבוּ הַלְוִיִּם אֶת־מִגְרְשֵׁיהֶם וַאֲחֻזָּתָם וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם כִּי־הִזְנִיחָם יָרָבְעָם וּבָנָיו מִכַּהֵן לַיהוָה׃
    hebrewPlain: כי עזבו הלוים את מגרשיהם ואחזתם וילכו ליהודה ולירושלם כי הזניחם ירבעם ובניו מכהן ליהוה
    kjvRefs:
    - 2 Chronicles 11:14
    kjvOsis:
    - 2Chr.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:15
    ref: 2 Chronicles 11:15
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 15
    ordinal: 22619
    text: and he appointed him priests for the high places, and for the satyrs, and for the calves which he had made.
    translation: JPS 1917
    original: וַיַּעֲמֶד־לוֹ כֹּהֲנִים לַבָּמוֹת וְלַשְּׂעִירִים וְלָעֲגָלִים אֲשֶׁר עָשָׂה׃
    hebrewPlain: ויעמד לו כהנים לבמות ולשעירים ולעגלים אשר עשה
    kjvRefs:
    - 2 Chronicles 11:15
    kjvOsis:
    - 2Chr.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:16
    ref: 2 Chronicles 11:16
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 16
    ordinal: 22620
    text: And after them, out of all the tribes of Israel, such as set their hearts to seek the LORD, the God of Israel, came to Jerusalem to sacrifice unto the LORD, the God of their fathers.
    translation: JPS 1917
    original: וְאַחֲרֵיהֶם מִכֹּל שִׁבְטֵי יִשְׂרָאֵל הַנֹּתְנִים אֶת־לְבָבָם לְבַקֵּשׁ אֶת־יְהוָה אֱלֹהֵי יִשְׂרָאֵל בָּאוּ יְרוּשָׁלִַם לִזְבּוֹחַ לַיהוָה אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: ואחריהם מכל שבטי ישראל הנתנים את לבבם לבקש את יהוה אלהי ישראל באו ירושלם לזבוח ליהוה אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 11:16
    kjvOsis:
    - 2Chr.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:17
    ref: 2 Chronicles 11:17
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 17
    ordinal: 22621
    text: So they strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years; for they walked three years in the way of David and Solomon.
    translation: JPS 1917
    original: וַיְחַזְּקוּ אֶת־מַלְכוּת יְהוּדָה וַיְאַמְּצוּ אֶת־רְחַבְעָם בֶּן־שְׁלֹמֹה לְשָׁנִים שָׁלוֹשׁ כִּי הָלְכוּ בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה לְשָׁנִים שָׁלוֹשׁ׃
    hebrewPlain: ויחזקו את מלכות יהודה ויאמצו את רחבעם בן שלמה לשנים שלוש כי הלכו בדרך דויד ושלמה לשנים שלוש
    kjvRefs:
    - 2 Chronicles 11:17
    kjvOsis:
    - 2Chr.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:18
    ref: 2 Chronicles 11:18
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 18
    ordinal: 22622
    text: And Rehoboam took him a wife, Mahalath the daughter of Jerimoth the son of David, and of Abihail the daughter of Eliab the son of Jesse;
    translation: JPS 1917
    original: וַיִּקַּח־לוֹ רְחַבְעָם אִשָּׁה אֶת־מָחֲלַת בן־[בַּת־] יְרִימוֹת בֶּן־דָּוִיד אֲבִיהַיִל בַּת־אֱלִיאָב בֶּן־יִשָׁי׃
    hebrewPlain: ויקח לו רחבעם אשה את מחלת בן [בת ] ירימות בן דויד אביהיל בת אליאב בן ישי
    kjvRefs:
    - 2 Chronicles 11:18
    kjvOsis:
    - 2Chr.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:19
    ref: 2 Chronicles 11:19
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 19
    ordinal: 22623
    text: 'and she bore him sons: Jeush, and Shemariah, and Zaham.'
    translation: JPS 1917
    original: וַתֵּלֶד לוֹ בָּנִים אֶת־יְעוּשׁ וְאֶת־שְׁמַרְיָה וְאֶת־זָהַם׃
    hebrewPlain: ותלד לו בנים את יעוש ואת שמריה ואת זהם
    kjvRefs:
    - 2 Chronicles 11:19
    kjvOsis:
    - 2Chr.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:20
    ref: 2 Chronicles 11:20
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 20
    ordinal: 22624
    text: And after her he took Maacah the daughter of Absalom; and she bore him Abijah, and Attai, and Ziza, and Shelomith.
    translation: JPS 1917
    original: וְאַחֲרֶיהָ לָקַח אֶת־מַעֲכָה בַּת־אַבְשָׁלוֹם וַתֵּלֶד לוֹ אֶת־אֲבִיָּה וְאֶת־עַתַּי וְאֶת־זִיזָא וְאֶת־שְׁלֹמִית׃
    hebrewPlain: ואחריה לקח את מעכה בת אבשלום ותלד לו את אביה ואת עתי ואת זיזא ואת שלמית
    kjvRefs:
    - 2 Chronicles 11:20
    kjvOsis:
    - 2Chr.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:21
    ref: 2 Chronicles 11:21
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 21
    ordinal: 22625
    text: And Rehoboam loved Maacah the daughter of Absalom above all his wives and his concubines—for he took eighteen wives, and threescore concubines, and begot twenty and eight sons and threescore daughters.
    translation: JPS 1917
    original: וַיֶּאֱהַב רְחַבְעָם אֶת־מַעֲכָה בַת־אַבְשָׁלוֹם מִכָּל־נָשָׁיו וּפִילַגְשָׁיו כִּי נָשִׁים שְׁמוֹנֶה־עֶשְׂרֵה נָשָׂא וּפִילַגְשִׁים שִׁשִּׁים וַיּוֹלֶד עֶשְׂרִים וּשְׁמוֹנָה בָּנִים וְשִׁשִּׁים בָּנוֹת׃
    hebrewPlain: ויאהב רחבעם את מעכה בת אבשלום מכל נשיו ופילגשיו כי נשים שמונה עשרה נשא ופילגשים ששים ויולד עשרים ושמונה בנים וששים בנות
    kjvRefs:
    - 2 Chronicles 11:21
    kjvOsis:
    - 2Chr.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:22
    ref: 2 Chronicles 11:22
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 22
    ordinal: 22626
    text: And Rehoboam appointed Abijah the son of Maacah to be chief, even the prince among his brethren; for he was minded to make him king.
    translation: JPS 1917
    original: וַיַּעֲמֵד לָרֹאשׁ רְחַבְעָם אֶת־אֲבִיָּה בֶן־מַעֲכָה לְנָגִיד בְּאֶחָיו כִּי לְהַמְלִיכוֹ׃
    hebrewPlain: ויעמד לראש רחבעם את אביה בן מעכה לנגיד באחיו כי להמליכו
    kjvRefs:
    - 2 Chronicles 11:22
    kjvOsis:
    - 2Chr.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:23
    ref: 2 Chronicles 11:23
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 23
    ordinal: 22627
    text: And he dealt wisely, and dispersed of all his sons throughout all the lands of Judah and Benjamin, unto every fortified city; and he gave them victual in abundance. And he sought for them many wives.
    translation: JPS 1917
    original: וַיָּבֶן וַיִּפְרֹץ מִכָּל־בָּנָיו לְכָל־אַרְצוֹת יְהוּדָה וּבִנְיָמִן לְכֹל עָרֵי הַמְּצֻרוֹת וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב וַיִּשְׁאַל הֲמוֹן נָשִׁים׃
    hebrewPlain: ויבן ויפרץ מכל בניו לכל ארצות יהודה ובנימן לכל ערי המצרות ויתן להם המזון לרב וישאל המון נשים
    kjvRefs:
    - 2 Chronicles 11:23
    kjvOsis:
    - 2Chr.11.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.12.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:1
    ref: 2 Chronicles 12:1
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 1
    ordinal: 22628
    text: And it came to pass, when the kingdom of Rehoboam was established, and he was strong, that he forsook the law of the LORD, and all Israel with him.
    translation: JPS 1917
    original: וַיְהִי כְּהָכִין מַלְכוּת רְחַבְעָם וּכְחֶזְקָתוֹ עָזַב אֶת־תּוֹרַת יְהוָה וְכָל־יִשְׂרָאֵל עִמּוֹ׃
    hebrewPlain: ויהי כהכין מלכות רחבעם וכחזקתו עזב את תורת יהוה וכל ישראל עמו
    kjvRefs:
    - 2 Chronicles 12:1
    kjvOsis:
    - 2Chr.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:2
    ref: 2 Chronicles 12:2
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 2
    ordinal: 22629
    text: And it came to pass in the fifth year of king Rehoboam, that Shishak king of Egypt came up against Jerusalem, because they had dealt treacherously with the LORD,
    translation: JPS 1917
    original: וַיְהִי בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם עָלָה שִׁישַׁק מֶלֶךְ־מִצְרַיִם עַל־יְרוּשָׁלִָם כִּי מָעֲלוּ בַּיהוָה׃
    hebrewPlain: ויהי בשנה החמישית למלך רחבעם עלה שישק מלך מצרים על ירושלם כי מעלו ביהוה
    kjvRefs:
    - 2 Chronicles 12:2
    kjvOsis:
    - 2Chr.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:3
    ref: 2 Chronicles 12:3
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 3
    ordinal: 22630
    text: with twelve hundred chariots, and threescore thousand horsemen; and the people were without number that came with him out of Egypt; the Lubim, the Sukkiim, and the Ethiopians.
    translation: JPS 1917
    original: בְּאֶלֶף וּמָאתַיִם רֶכֶב וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים וְאֵין מִסְפָּר לָעָם אֲשֶׁר־בָּאוּ עִמּוֹ מִמִּצְרַיִם לוּבִים סֻכִּיִּים וְכוּשִׁים׃
    hebrewPlain: באלף ומאתים רכב ובששים אלף פרשים ואין מספר לעם אשר באו עמו ממצרים לובים סכיים וכושים
    kjvRefs:
    - 2 Chronicles 12:3
    kjvOsis:
    - 2Chr.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:4
    ref: 2 Chronicles 12:4
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 4
    ordinal: 22631
    text: And he took the fortified cities which pertained to Judah, and came unto Jerusalem.
    translation: JPS 1917
    original: וַיִּלְכֹּד אֶת־עָרֵי הַמְּצֻרוֹת אֲשֶׁר לִיהוּדָה וַיָּבֹא עַד־יְרוּשָׁלִָם׃
    hebrewPlain: וילכד את ערי המצרות אשר ליהודה ויבא עד ירושלם
    kjvRefs:
    - 2 Chronicles 12:4
    kjvOsis:
    - 2Chr.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:5
    ref: 2 Chronicles 12:5
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 5
    ordinal: 22632
    text: 'Now Shemaiah the prophet came to Rehoboam, and to the princes of Judah, that were gathered together to Jerusalem because of Shishak, and said unto them: ‘Thus saith the LORD: Ye have forsaken Me, therefore have I also left you in the hand of Shishak.’'
    translation: JPS 1917
    original: וּשְׁמַעְיָה הַנָּבִיא בָּא אֶל־רְחַבְעָם וְשָׂרֵי יְהוּדָה אֲשֶׁר־נֶאֶסְפוּ אֶל־יְרוּשָׁלִַם מִפְּנֵי שִׁישָׁק וַיֹּאמֶר לָהֶם כֹּה־אָמַר יְהוָה אַתֶּם עֲזַבְתֶּם אֹתִי וְאַף־אֲנִי עָזַבְתִּי אֶתְכֶם בְּיַד־שִׁישָׁק׃
    hebrewPlain: ושמעיה הנביא בא אל רחבעם ושרי יהודה אשר נאספו אל ירושלם מפני שישק ויאמר להם כה אמר יהוה אתם עזבתם אתי ואף אני עזבתי אתכם ביד שישק
    kjvRefs:
    - 2 Chronicles 12:5
    kjvOsis:
    - 2Chr.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:6
    ref: 2 Chronicles 12:6
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 6
    ordinal: 22633
    text: 'Then the princes of Israel and the king humbled themselves; and they said: ‘The LORD is righteous.’'
    translation: JPS 1917
    original: וַיִּכָּנְעוּ שָׂרֵי־יִשְׂרָאֵל וְהַמֶּלֶךְ וַיֹּאמְרוּ צַדִּיק יְהוָה׃
    hebrewPlain: ויכנעו שרי ישראל והמלך ויאמרו צדיק יהוה
    kjvRefs:
    - 2 Chronicles 12:6
    kjvOsis:
    - 2Chr.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:7
    ref: 2 Chronicles 12:7
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 7
    ordinal: 22634
    text: 'And when the LORD saw that they humbled themselves, the word of the LORD came to Shemaiah, saying: ‘They have humbled themselves; I will not destroy them; but I will grant them some deliverance, and My wrath shall not be poured out upon Jerusalem by the hand of Shishak.'
    translation: JPS 1917
    original: וּבִרְאוֹת יְהוָה כִּי נִכְנָעוּ הָיָה דְבַר־יְהוָה אֶל־שְׁמַעְיָה לֵאמֹר נִכְנְעוּ לֹא אַשְׁחִיתֵם וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה וְלֹא־תִתַּךְ חֲמָתִי בִּירוּשָׁלִַם בְּיַד־שִׁישָׁק׃
    hebrewPlain: ובראות יהוה כי נכנעו היה דבר יהוה אל שמעיה לאמר נכנעו לא אשחיתם ונתתי להם כמעט לפליטה ולא תתך חמתי בירושלם ביד שישק
    kjvRefs:
    - 2 Chronicles 12:7
    kjvOsis:
    - 2Chr.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:8
    ref: 2 Chronicles 12:8
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 8
    ordinal: 22635
    text: Nevertheless they shall be his servants; that they may know My service, and the service of the kingdoms of the countries.’
    translation: JPS 1917
    original: כִּי יִהְיוּ־לוֹ לַעֲבָדִים וְיֵדְעוּ עֲבוֹדָתִי וַעֲבוֹדַת מַמְלְכוֹת הָאֲרָצוֹת׃
    hebrewPlain: כי יהיו לו לעבדים וידעו עבודתי ועבודת ממלכות הארצות
    kjvRefs:
    - 2 Chronicles 12:8
    kjvOsis:
    - 2Chr.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:9
    ref: 2 Chronicles 12:9
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 9
    ordinal: 22636
    text: So Shishak king of Egypt came up against Jerusalem, and took away the treasures of the house of the LORD, and the treasures of the king’s house; he took all away; he took away also the shields of gold which Solomon had made.
    translation: JPS 1917
    original: וַיַּעַל שִׁישַׁק מֶלֶךְ־מִצְרַיִם עַל־יְרוּשָׁלִַם וַיִּקַּח אֶת־אֹצְרוֹת בֵּית־יְהוָה וְאֶת־אֹצְרוֹת בֵּית הַמֶּלֶךְ אֶת־הַכֹּל לָקָח וַיִּקַּח אֶת־מָגִנֵּי הַזָּהָב אֲשֶׁר עָשָׂה שְׁלֹמֹה׃
    hebrewPlain: ויעל שישק מלך מצרים על ירושלם ויקח את אצרות בית יהוה ואת אצרות בית המלך את הכל לקח ויקח את מגני הזהב אשר עשה שלמה
    kjvRefs:
    - 2 Chronicles 12:9
    kjvOsis:
    - 2Chr.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:10
    ref: 2 Chronicles 12:10
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 10
    ordinal: 22637
    text: And king Rehoboam made in their stead shields of brass, and committed them to the hands of the captains of the guard, that kept the door of the king’s house.
    translation: JPS 1917
    original: וַיַּעַשׂ הַמֶּלֶךְ רְחַבְעָם תַּחְתֵּיהֶם מָגִנֵּי נְחֹשֶׁת וְהִפְקִיד עַל־יַד שָׂרֵי הָרָצִים הַשֹּׁמְרִים פֶּתַח בֵּית הַמֶּלֶךְ׃
    hebrewPlain: ויעש המלך רחבעם תחתיהם מגני נחשת והפקיד על יד שרי הרצים השמרים פתח בית המלך
    kjvRefs:
    - 2 Chronicles 12:10
    kjvOsis:
    - 2Chr.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:11
    ref: 2 Chronicles 12:11
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 11
    ordinal: 22638
    text: And it was so, that as oft as the king entered into the house of the LORD, the guard came and bore them, and brought them back into the guard-chamber.
    translation: JPS 1917
    original: וַיְהִי מִדֵּי־בוֹא הַמֶּלֶךְ בֵּית יְהוָה בָּאוּ הָרָצִים וּנְשָׂאוּם וֶהֱשִׁבוּם אֶל־תָּא הָרָצִים׃
    hebrewPlain: ויהי מדי בוא המלך בית יהוה באו הרצים ונשאום והשבום אל תא הרצים
    kjvRefs:
    - 2 Chronicles 12:11
    kjvOsis:
    - 2Chr.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:12
    ref: 2 Chronicles 12:12
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 12
    ordinal: 22639
    text: And when he humbled himself, the anger of the LORD turned from him, that He would not destroy him altogether; and moreover in Judah there were good things found.
    translation: JPS 1917
    original: וּבְהִכָּנְעוֹ שָׁב מִמֶּנּוּ אַף־יְהוָה וְלֹא לְהַשְׁחִית לְכָלָה וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים׃
    hebrewPlain: ובהכנעו שב ממנו אף יהוה ולא להשחית לכלה וגם ביהודה היה דברים טובים
    kjvRefs:
    - 2 Chronicles 12:12
    kjvOsis:
    - 2Chr.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:13
    ref: 2 Chronicles 12:13
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 13
    ordinal: 22640
    text: So king Rehoboam strengthened himself in Jerusalem, and reigned; for Rehoboam was forty and one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city which the LORD had chosen out of all the tribes of Israel, to put His name there; and his mother’s name was Naamah the Ammonitess.
    translation: JPS 1917
    original: וַיִּתְחַזֵּק הַמֶּלֶךְ רְחַבְעָם בִּירוּשָׁלִַם וַיִּמְלֹךְ כִּי בֶן־אַרְבָּעִים וְאַחַת שָׁנָה רְחַבְעָם בְּמָלְכוֹ וּשֲׁבַע עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִַם הָעִיר אֲשֶׁר־בָּחַר יְהוָה לָשׂוּם אֶת־שְׁמוֹ שָׁם מִכֹּל שִׁבְטֵי יִשְׂרָאֵל וְשֵׁם אִמּוֹ נַעֲמָה הָעַמֹּנִית׃
    hebrewPlain: ויתחזק המלך רחבעם בירושלם וימלך כי בן ארבעים ואחת שנה רחבעם במלכו ושבע עשרה שנה מלך בירושלם העיר אשר בחר יהוה לשום את שמו שם מכל שבטי ישראל ושם אמו נעמה העמנית
    kjvRefs:
    - 2 Chronicles 12:13
    kjvOsis:
    - 2Chr.12.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:14
    ref: 2 Chronicles 12:14
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 14
    ordinal: 22641
    text: And he did that which was evil, because he set not his heart to seek the LORD.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרָע כִּי לֹא הֵכִין לִבּוֹ לִדְרוֹשׁ אֶת־יְהוָה׃
    hebrewPlain: ויעש הרע כי לא הכין לבו לדרוש את יהוה
    kjvRefs:
    - 2 Chronicles 12:14
    kjvOsis:
    - 2Chr.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:15
    ref: 2 Chronicles 12:15
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 15
    ordinal: 22642
    text: Now the acts of Rehoboam, first and last, are they not written in the histories of Shemaiah the prophet and of Iddo the seer, after the manner of genealogies? And there were wars between Rehoboam and Jeroboam continually.
    translation: JPS 1917
    original: וְדִבְרֵי רְחַבְעָם הָרִאשֹׁנִים וְהָאֲחַרוֹנִים הֲלֹא־הֵם כְּתוּבִים בְּדִבְרֵי שְׁמַעְיָה הַנָּבִיא וְעִדּוֹ הַחֹזֶה לְהִתְיַחֵשׂ וּמִלְחֲמוֹת רְחַבְעָם וְיָרָבְעָם כָּל־הַיָּמִים׃
    hebrewPlain: ודברי רחבעם הראשנים והאחרונים הלא הם כתובים בדברי שמעיה הנביא ועדו החזה להתיחש ומלחמות רחבעם וירבעם כל הימים
    kjvRefs:
    - 2 Chronicles 12:15
    kjvOsis:
    - 2Chr.12.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.12.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 12:16
    ref: 2 Chronicles 12:16
    book: 2Chr
    section: ketuvim
    chapter: 12
    verse: 16
    ordinal: 22643
    text: And Rehoboam slept with his fathers, and was buried in the city of David; and Abijah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב רְחַבְעָם עִם־אֲבֹתָיו וַיִּקָּבֵר בְּעִיר דָּוִיד וַיִּמְלֹךְ אֲבִיָּה בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב רחבעם עם אבתיו ויקבר בעיר דויד וימלך אביה בנו תחתיו
    kjvRefs:
    - 2 Chronicles 12:16
    kjvOsis:
    - 2Chr.12.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.12
- type: TanakhVerse
  data:
    osis: 2Chr.13.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:1
    ref: 2 Chronicles 13:1
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 1
    ordinal: 22644
    text: In the eighteenth year of king Jeroboam began Abijah to reign over Judah.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לַמֶּלֶךְ יָרָבְעָם וַיִּמְלֹךְ אֲבִיָּה עַל־יְהוּדָה׃
    hebrewPlain: בשנת שמונה עשרה למלך ירבעם וימלך אביה על יהודה
    kjvRefs:
    - 2 Chronicles 13:1
    kjvOsis:
    - 2Chr.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:2
    ref: 2 Chronicles 13:2
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 2
    ordinal: 22645
    text: Three years reigned he in Jerusalem; and his mother’s name was Micaiah the daughter of Uriel of Gibeah. And there was war between Abijah and Jeroboam.
    translation: JPS 1917
    original: שָׁלוֹשׁ שָׁנִים מָלַךְ בִּירוּשָׁלִַם וְשֵׁם אִמּוֹ מִיכָיָהוּ בַת־אוּרִיאֵל מִן־גִּבְעָה וּמִלְחָמָה הָיְתָה בֵּין אֲבִיָּה וּבֵין יָרָבְעָם׃
    hebrewPlain: שלוש שנים מלך בירושלם ושם אמו מיכיהו בת אוריאל מן גבעה ומלחמה היתה בין אביה ובין ירבעם
    kjvRefs:
    - 2 Chronicles 13:2
    kjvOsis:
    - 2Chr.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:3
    ref: 2 Chronicles 13:3
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 3
    ordinal: 22646
    text: And Abijah joined battle with an army of valiant men of war, even four hundred thousand chosen men; and Jeroboam set the battle in array against him with eight hundred thousand chosen men, who were mighty men of valour.
    translation: JPS 1917
    original: וַיֶּאְסֹר אֲבִיָּה אֶת־הַמִּלְחָמָה בְּחַיִל גִּבּוֹרֵי מִלְחָמָה אַרְבַּע־מֵאוֹת אֶלֶף אִישׁ בָּחוּר וְיָרָבְעָם עָרַךְ עִמּוֹ מִלְחָמָה בִּשְׁמוֹנֶה מֵאוֹת אֶלֶף אִישׁ בָּחוּר גִּבּוֹר חָיִל׃
    hebrewPlain: ויאסר אביה את המלחמה בחיל גבורי מלחמה ארבע מאות אלף איש בחור וירבעם ערך עמו מלחמה בשמונה מאות אלף איש בחור גבור חיל
    kjvRefs:
    - 2 Chronicles 13:3
    kjvOsis:
    - 2Chr.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:4
    ref: 2 Chronicles 13:4
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 4
    ordinal: 22647
    text: 'And Abijah stood up upon mount Zemaraim, which is in the hill-country of Ephraim, and said: ‘Hear me, O Jeroboam and all Israel;'
    translation: JPS 1917
    original: וַיָּקָם אֲבִיָּה מֵעַל לְהַר צְמָרַיִם אֲשֶׁר בְּהַר אֶפְרָיִם וַיֹּאמֶר שְׁמָעוּנִי יָרָבְעָם וְכָל־יִשְׂרָאֵל׃
    hebrewPlain: ויקם אביה מעל להר צמרים אשר בהר אפרים ויאמר שמעוני ירבעם וכל ישראל
    kjvRefs:
    - 2 Chronicles 13:4
    kjvOsis:
    - 2Chr.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:5
    ref: 2 Chronicles 13:5
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 5
    ordinal: 22648
    text: ought ye not to know that the LORD, the God of Israel, gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt?
    translation: JPS 1917
    original: הֲלֹא לָכֶם לָדַעַת כִּי יְהוָה אֱלֹהֵי יִשְׂרָאֵל נָתַן מַמְלָכָה לְדָוִיד עַל־יִשְׂרָאֵל לְעוֹלָם לוֹ וּלְבָנָיו בְּרִית מֶלַח׃
    hebrewPlain: הלא לכם לדעת כי יהוה אלהי ישראל נתן ממלכה לדויד על ישראל לעולם לו ולבניו ברית מלח
    kjvRefs:
    - 2 Chronicles 13:5
    kjvOsis:
    - 2Chr.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:6
    ref: 2 Chronicles 13:6
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 6
    ordinal: 22649
    text: Yet Jeroboam the son of Nebat, the servant of Solomon the son of David, rose up, and rebelled against his lord.
    translation: JPS 1917
    original: וַיָּקָם יָרָבְעָם בֶּן־נְבָט עֶבֶד שְׁלֹמֹה בֶן־דָּוִיד וַיִּמְרֹד עַל־אֲדֹנָיו׃
    hebrewPlain: ויקם ירבעם בן נבט עבד שלמה בן דויד וימרד על אדניו
    kjvRefs:
    - 2 Chronicles 13:6
    kjvOsis:
    - 2Chr.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:7
    ref: 2 Chronicles 13:7
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 7
    ordinal: 22650
    text: And there were gathered unto him vain men, base fellows that strengthened themselves against Rehoboam the son of Solomon, when Rehoboam was young and faint-hearted, and could not withstand them.
    translation: JPS 1917
    original: וַיִּקָּבְצוּ עָלָיו אֲנָשִׁים רֵקִים בְּנֵי בְלִיַּעַל וַיִּתְאַמְּצוּ עַל־רְחַבְעָם בֶּן־שְׁלֹמֹה וּרְחַבְעָם הָיָה נַעַר וְרַךְ־לֵבָב וְלֹא הִתְחַזַּק לִפְנֵיהֶם׃
    hebrewPlain: ויקבצו עליו אנשים רקים בני בליעל ויתאמצו על רחבעם בן שלמה ורחבעם היה נער ורך לבב ולא התחזק לפניהם
    kjvRefs:
    - 2 Chronicles 13:7
    kjvOsis:
    - 2Chr.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:8
    ref: 2 Chronicles 13:8
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 8
    ordinal: 22651
    text: And now ye think to withstand the kingdom of the LORD in the hand of the sons of David; and ye are a great multitude, and there are with you the golden calves which Jeroboam made you for gods.
    translation: JPS 1917
    original: וְעַתָּה אַתֶּם אֹמְרִים לְהִתְחַזֵּק לִפְנֵי מַמְלֶכֶת יְהוָה בְּיַד בְּנֵי דָוִיד וְאַתֶּם הָמוֹן רָב וְעִמָּכֶם עֶגְלֵי זָהָב אֲשֶׁר עָשָׂה לָכֶם יָרָבְעָם לֵאלֹהִים׃
    hebrewPlain: ועתה אתם אמרים להתחזק לפני ממלכת יהוה ביד בני דויד ואתם המון רב ועמכם עגלי זהב אשר עשה לכם ירבעם לאלהים
    kjvRefs:
    - 2 Chronicles 13:8
    kjvOsis:
    - 2Chr.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:9
    ref: 2 Chronicles 13:9
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 9
    ordinal: 22652
    text: Have ye not driven out the priests of the LORD, the sons of Aaron, and the Levites, and have made you priests after the manner of the peoples of other lands? so that whosoever cometh to consecrate himself with a young bullock and seven rams, the same becometh a priest of them that are no gods.
    translation: JPS 1917
    original: הֲלֹא הִדַּחְתֶּם אֶת־כֹּהֲנֵי יְהוָה אֶת־בְּנֵי אַהֲרֹן וְהַלְוִיִּם וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים כְּעַמֵּי הָאֲרָצוֹת כָּל־הַבָּא לְמַלֵּא יָדוֹ בְּפַר בֶּן־בָּקָר וְאֵילִם שִׁבְעָה וְהָיָה כֹהֵן לְלֹא אֱלֹהִים׃
    hebrewPlain: הלא הדחתם את כהני יהוה את בני אהרן והלוים ותעשו לכם כהנים כעמי הארצות כל הבא למלא ידו בפר בן בקר ואילם שבעה והיה כהן ללא אלהים
    kjvRefs:
    - 2 Chronicles 13:9
    kjvOsis:
    - 2Chr.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:10
    ref: 2 Chronicles 13:10
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 10
    ordinal: 22653
    text: But as for us, the LORD is our God, and we have not forsaken Him; and we have priests ministering unto the LORD, the sons of Aaron, and the Levites in their work;
    translation: JPS 1917
    original: וַאֲנַחְנוּ יְהוָה אֱלֹהֵינוּ וְלֹא עֲזַבְנֻהוּ וְכֹהֲנִים מְשָׁרְתִים לַיהוָה בְּנֵי אַהֲרֹן וְהַלְוִיִּם בַּמְלָאכֶת׃
    hebrewPlain: ואנחנו יהוה אלהינו ולא עזבנהו וכהנים משרתים ליהוה בני אהרן והלוים במלאכת
    kjvRefs:
    - 2 Chronicles 13:10
    kjvOsis:
    - 2Chr.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:11
    ref: 2 Chronicles 13:11
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 11
    ordinal: 22654
    text: and they burn unto the LORD every morning and every evening burnt-offerings and sweet incense; the showbread also set they in order upon the pure table; and the candlestick of gold with the lamps thereof, to burn every evening; for we keep the charge of the LORD our God; but ye have forsaken Him.
    translation: JPS 1917
    original: וּמַקְטִרִים לַיהוָה עֹלוֹת בַּבֹּקֶר־בַּבֹּקֶר וּבָעֶרֶב־בָּעֶרֶב וּקְטֹרֶת־סַמִּים וּמַעֲרֶכֶת לֶחֶם עַל־הַשֻּׁלְחָן הַטָּהוֹר וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר בָּעֶרֶב בָּעֶרֶב כִּי־שֹׁמְרִים אֲנַחְנוּ אֶת־מִשְׁמֶרֶת יְהוָה אֱלֹהֵינוּ וְאַתֶּם עֲזַבְתֶּם אֹתוֹ׃
    hebrewPlain: ומקטרים ליהוה עלות בבקר בבקר ובערב בערב וקטרת סמים ומערכת לחם על השלחן הטהור ומנורת הזהב ונרתיה לבער בערב בערב כי שמרים אנחנו את משמרת יהוה אלהינו ואתם עזבתם אתו
    kjvRefs:
    - 2 Chronicles 13:11
    kjvOsis:
    - 2Chr.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:12
    ref: 2 Chronicles 13:12
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 12
    ordinal: 22655
    text: And, behold, God is with us at our head, and His priests with the trumpets of alarm to sound an alarm against you. O children of Israel, fight ye not against the LORD, the God of your fathers; for ye shall not prosper.’
    translation: JPS 1917
    original: וְהִנֵּה עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים וְכֹהֲנָיו וַחֲצֹצְרוֹת הַתְּרוּעָה לְהָרִיעַ עֲלֵיכֶם בְּנֵי יִשְׂרָאֵל אַל־תִּלָּחֲמוּ עִם־יְהוָה אֱלֹהֵי־אֲבֹתֵיכֶם כִּי־לֹא תַצְלִיחוּ׃
    hebrewPlain: והנה עמנו בראש האלהים וכהניו וחצצרות התרועה להריע עליכם בני ישראל אל תלחמו עם יהוה אלהי אבתיכם כי לא תצליחו
    kjvRefs:
    - 2 Chronicles 13:12
    kjvOsis:
    - 2Chr.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:13
    ref: 2 Chronicles 13:13
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 13
    ordinal: 22656
    text: But Jeroboam caused an ambushment to come about behind them; so they were before Judah, and the ambushment was behind them.
    translation: JPS 1917
    original: וְיָרָבְעָם הֵסֵב אֶת־הַמַּאְרָב לָבוֹא מֵאַחֲרֵיהֶם וַיִּהְיוּ לִפְנֵי יְהוּדָה וְהַמַּאְרָב מֵאַחֲרֵיהֶם׃
    hebrewPlain: וירבעם הסב את המארב לבוא מאחריהם ויהיו לפני יהודה והמארב מאחריהם
    kjvRefs:
    - 2 Chronicles 13:13
    kjvOsis:
    - 2Chr.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:14
    ref: 2 Chronicles 13:14
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 14
    ordinal: 22657
    text: And when Judah looked back, behold, the battle was before and behind them; and they cried unto the LORD, and the priests sounded with the trumpets.
    translation: JPS 1917
    original: וַיִּפְנוּ יְהוּדָה וְהִנֵּה לָהֶם הַמִּלְחָמָה פָּנִים וְאָחוֹר וַיִּצְעֲקוּ לַיהוָה וְהַכֹּהֲנִים מחצצרים [מַחְצְרִים] בַּחֲצֹצְרוֹת׃
    hebrewPlain: ויפנו יהודה והנה להם המלחמה פנים ואחור ויצעקו ליהוה והכהנים מחצצרים [מחצרים] בחצצרות
    kjvRefs:
    - 2 Chronicles 13:14
    kjvOsis:
    - 2Chr.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:15
    ref: 2 Chronicles 13:15
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 15
    ordinal: 22658
    text: Then the men of Judah gave a shout; and as the men of Judah shouted, it came to pass, that God smote Jeroboam and all Israel before Abijah and Judah.
    translation: JPS 1917
    original: וַיָּרִיעוּ אִישׁ יְהוּדָה וַיְהִי בְּהָרִיעַ אִישׁ יְהוּדָה וְהָאֱלֹהִים נָגַף אֶת־יָרָבְעָם וְכָל־יִשְׂרָאֵל לִפְנֵי אֲבִיָּה וִיהוּדָה׃
    hebrewPlain: ויריעו איש יהודה ויהי בהריע איש יהודה והאלהים נגף את ירבעם וכל ישראל לפני אביה ויהודה
    kjvRefs:
    - 2 Chronicles 13:15
    kjvOsis:
    - 2Chr.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:16
    ref: 2 Chronicles 13:16
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 16
    ordinal: 22659
    text: And the children of Israel fled before Judah; and God delivered them into their hand.
    translation: JPS 1917
    original: וַיָּנוּסוּ בְנֵי־יִשְׂרָאֵל מִפְּנֵי יְהוּדָה וַיִּתְּנֵם אֱלֹהִים בְּיָדָם׃
    hebrewPlain: וינוסו בני ישראל מפני יהודה ויתנם אלהים בידם
    kjvRefs:
    - 2 Chronicles 13:16
    kjvOsis:
    - 2Chr.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:17
    ref: 2 Chronicles 13:17
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 17
    ordinal: 22660
    text: And Abijah and his people slew them with a great slaughter; so there fell down slain of Israel five hundred thousand chosen men.
    translation: JPS 1917
    original: וַיַּכּוּ בָהֶם אֲבִיָּה וְעַמּוֹ מַכָּה רַבָּה וַיִּפְּלוּ חֲלָלִים מִיִּשְׂרָאֵל חֲמֵשׁ־מֵאוֹת אֶלֶף אִישׁ בָּחוּר׃
    hebrewPlain: ויכו בהם אביה ועמו מכה רבה ויפלו חללים מישראל חמש מאות אלף איש בחור
    kjvRefs:
    - 2 Chronicles 13:17
    kjvOsis:
    - 2Chr.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:18
    ref: 2 Chronicles 13:18
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 18
    ordinal: 22661
    text: Thus the children of Israel were brought under at that time, and the children of Judah prevailed, because they relied upon the LORD, the God of their fathers.
    translation: JPS 1917
    original: וַיִּכָּנְעוּ בְנֵי־יִשְׂרָאֵל בָּעֵת הַהִיא וַיֶּאֶמְצוּ בְּנֵי יְהוּדָה כִּי נִשְׁעֲנוּ עַל־יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: ויכנעו בני ישראל בעת ההיא ויאמצו בני יהודה כי נשענו על יהוה אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 13:18
    kjvOsis:
    - 2Chr.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:19
    ref: 2 Chronicles 13:19
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 19
    ordinal: 22662
    text: And Abijah pursued after Jeroboam, and took cities from him, Bethel with the towns thereof, and Jeshanah with the towns thereof, and Ephrain with the towns thereof.
    translation: JPS 1917
    original: וַיִּרְדֹּף אֲבִיָּה אַחֲרֵי יָרָבְעָם וַיִּלְכֹּד מִמֶּנּוּ עָרִים אֶת־בֵּית־אֵל וְאֶת־בְּנוֹתֶיהָ וְאֶת־יְשָׁנָה וְאֶת־בְּנוֹתֶיהָ וְאֶת־עפרון [עֶפְרַיִן] וּבְנֹתֶיהָ׃
    hebrewPlain: וירדף אביה אחרי ירבעם וילכד ממנו ערים את בית אל ואת בנותיה ואת ישנה ואת בנותיה ואת עפרון [עפרין] ובנתיה
    kjvRefs:
    - 2 Chronicles 13:19
    kjvOsis:
    - 2Chr.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:20
    ref: 2 Chronicles 13:20
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 20
    ordinal: 22663
    text: Neither did Jeroboam recover strength again in the days of Abijah; and the LORD smote him, and he died.
    translation: JPS 1917
    original: וְלֹא־עָצַר כֹּחַ־יָרָבְעָם עוֹד בִּימֵי אֲבִיָּהוּ וַיִּגְּפֵהוּ יְהוָה וַיָּמֹת׃
    hebrewPlain: ולא עצר כח ירבעם עוד בימי אביהו ויגפהו יהוה וימת
    kjvRefs:
    - 2 Chronicles 13:20
    kjvOsis:
    - 2Chr.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.13
- type: TanakhVerse
  data:
    osis: 2Chr.13.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 13:21
    ref: 2 Chronicles 13:21
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 21
    ordinal: 22664
    text: But Abijah waxed mighty, and took unto himself fourteen wives, and begot twenty and two sons, and sixteen daughters.
    translation: JPS 1917
    original: וַיִּתְחַזֵּק אֲבִיָּהוּ וַיִּשָּׂא־לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה וַיּוֹלֶד עֶשְׂרִים וּשְׁנַיִם בָּנִים וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת׃
    hebrewPlain: ויתחזק אביהו וישא לו נשים ארבע עשרה ויולד עשרים ושנים בנים ושש עשרה בנות
    kjvRefs:
    - 2 Chronicles 13:21
    kjvOsis:
    - 2Chr.13.21
