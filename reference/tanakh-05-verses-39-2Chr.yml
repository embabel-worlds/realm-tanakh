    osis: 2Chr.11.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:8
    ref: 2 Chronicles 11:8
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 22612
    text: and Gath, and Mareshah, and Ziph,
    translation: JPS 1917
    original: וְאֶת־גַּת וְאֶת־מָרֵשָׁה וְאֶת־זִיף׃
    hebrewPlain: ואת גת ואת מרשה ואת זיף
    kjvRefs:
