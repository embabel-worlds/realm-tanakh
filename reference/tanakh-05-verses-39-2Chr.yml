- type: TanakhVerse
  data:
    osis: 2Chr.4.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:18
    ref: 2 Chronicles 4:18
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 22454
    text: Thus Solomon made all these vessels in great abundance; for the weight of the brass could not be found out.
    translation: JPS 1917
    original: וַיַּעַשׂ שְׁלֹמֹה כָּל־הַכֵּלִים הָאֵלֶּה לָרֹב מְאֹד כִּי לֹא נֶחְקַר מִשְׁקַל הַנְּחֹשֶׁת׃
    hebrewPlain: ויעש שלמה כל הכלים האלה לרב מאד כי לא נחקר משקל הנחשת
    kjvRefs:
    - 2 Chronicles 4:18
    kjvOsis:
    - 2Chr.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:19
    ref: 2 Chronicles 4:19
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 22455
    text: And Solomon made all the vessels that were in the house of God, the golden altar also, and the tables whereon was the showbread;
    translation: JPS 1917
    original: וַיַּעַשׂ שְׁלֹמֹה אֵת כָּל־הַכֵּלִים אֲשֶׁר בֵּית הָאֱלֹהִים וְאֵת מִזְבַּח הַזָּהָב וְאֶת־הַשֻּׁלְחָנוֹת וַעֲלֵיהֶם לֶחֶם הַפָּנִים׃
    hebrewPlain: ויעש שלמה את כל הכלים אשר בית האלהים ואת מזבח הזהב ואת השלחנות ועליהם לחם הפנים
    kjvRefs:
    - 2 Chronicles 4:19
    kjvOsis:
    - 2Chr.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:20
    ref: 2 Chronicles 4:20
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 22456
    text: and the candlesticks with their lamps, that they should burn according to the ordinance before the Sanctuary, of pure gold;
    translation: JPS 1917
    original: וְאֶת־הַמְּנֹרוֹת וְנֵרֹתֵיהֶם לְבַעֲרָם כַּמִּשְׁפָּט לִפְנֵי הַדְּבִיר זָהָב סָגוּר׃
    hebrewPlain: ואת המנרות ונרתיהם לבערם כמשפט לפני הדביר זהב סגור
    kjvRefs:
    - 2 Chronicles 4:20
    kjvOsis:
    - 2Chr.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:21
    ref: 2 Chronicles 4:21
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 22457
    text: and the flowers, and the lamps, and the tongs, of gold, and that perfect gold;
    translation: JPS 1917
    original: וְהַפֶּרַח וְהַנֵּרוֹת וְהַמֶּלְקַחַיִם זָהָב הוּא מִכְלוֹת זָהָב׃
    hebrewPlain: והפרח והנרות והמלקחים זהב הוא מכלות זהב
    kjvRefs:
    - 2 Chronicles 4:21
    kjvOsis:
    - 2Chr.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:22
    ref: 2 Chronicles 4:22
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 22458
    text: and the snuffers, and the basins, and the pans, and the fire-pans, of pure gold. And as for the entry of the house, the inner doors thereof for the most holy place, and the doors of the house, that is, of the temple, were of gold.
    translation: JPS 1917
    original: וְהַמְזַמְּרוֹת וְהַמִּזְרָקוֹת וְהַכַּפּוֹת וְהַמַּחְתּוֹת זָהָב סָגוּר וּפֶתַח הַבַּיִת דַּלְתוֹתָיו הַפְּנִימִיּוֹת לְקֹדֶשׁ הַקֳּדָשִׁים וְדַלְתֵי הַבַּיִת לַהֵיכָל זָהָב׃
    hebrewPlain: והמזמרות והמזרקות והכפות והמחתות זהב סגור ופתח הבית דלתותיו הפנימיות לקדש הקדשים ודלתי הבית להיכל זהב
    kjvRefs:
    - 2 Chronicles 4:22
    kjvOsis:
    - 2Chr.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.5.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:1
    ref: 2 Chronicles 5:1
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 22459
    text: Thus all the work that Solomon wrought for the house of the LORD was finished. And Solomon brought in the things that David his father had hallowed; even the silver, and the gold, and all the vessels, and put them in the treasuries of the house of God.
    translation: JPS 1917
    original: וַתִּשְׁלַם כָּל־הַמְּלָאכָה אֲשֶׁר־עָשָׂה שְׁלֹמֹה לְבֵית יְהוָה וַיָּבֵא שְׁלֹמֹה אֶת־קָדְשֵׁי דָּוִיד אָבִיו וְאֶת־הַכֶּסֶף וְאֶת־הַזָּהָב וְאֶת־כָּל־הַכֵּלִים נָתַן בְּאֹצְרוֹת בֵּית הָאֱלֹהִים׃
    hebrewPlain: ותשלם כל המלאכה אשר עשה שלמה לבית יהוה ויבא שלמה את קדשי דויד אביו ואת הכסף ואת הזהב ואת כל הכלים נתן באצרות בית האלהים
    kjvRefs:
    - 2 Chronicles 5:1
    kjvOsis:
    - 2Chr.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:2
    ref: 2 Chronicles 5:2
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 22460
    text: Then Solomon assembled the elders of Israel, and all the heads of the tribes, the princes of the fathers’ houses of the children of Israel, unto Jerusalem, to bring up the ark of the covenant of the LORD out of the city of David, which is Zion.
    translation: JPS 1917
    original: אָז יַקְהֵיל שְׁלֹמֹה אֶת־זִקְנֵי יִשְׂרָאֵל וְאֶת־כָּל־רָאשֵׁי הַמַּטּוֹת נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל אֶל־יְרוּשָׁלִָם לְהַעֲלוֹת אֶת־אֲרוֹן בְּרִית־יְהוָה מֵעִיר דָּוִיד הִיא צִיּוֹן׃
    hebrewPlain: אז יקהיל שלמה את זקני ישראל ואת כל ראשי המטות נשיאי האבות לבני ישראל אל ירושלם להעלות את ארון ברית יהוה מעיר דויד היא ציון
    kjvRefs:
    - 2 Chronicles 5:2
    kjvOsis:
    - 2Chr.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:3
    ref: 2 Chronicles 5:3
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 22461
    text: And all the men of Israel assembled themselves unto the king at the feast, which was in the seventh month.
    translation: JPS 1917
    original: וַיִּקָּהֲלוּ אֶל־הַמֶּלֶךְ כָּל־אִישׁ יִשְׂרָאֵל בֶּחָג הוּא הַחֹדֶשׁ הַשְּׁבִעִי׃
    hebrewPlain: ויקהלו אל המלך כל איש ישראל בחג הוא החדש השבעי
    kjvRefs:
    - 2 Chronicles 5:3
    kjvOsis:
    - 2Chr.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:4
    ref: 2 Chronicles 5:4
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 22462
    text: And all the elders of Israel came, and the Levites took up the ark.
    translation: JPS 1917
    original: וַיָּבֹאוּ כֹּל זִקְנֵי יִשְׂרָאֵל וַיִּשְׂאוּ הַלְוִיִּם אֶת־הָאָרוֹן׃
    hebrewPlain: ויבאו כל זקני ישראל וישאו הלוים את הארון
    kjvRefs:
    - 2 Chronicles 5:4
    kjvOsis:
    - 2Chr.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:5
    ref: 2 Chronicles 5:5
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 22463
    text: And they brought up the ark, and the tent of meeting, and all the holy vessels that were in the Tent; these did the priests and the Levites bring up.
    translation: JPS 1917
    original: וַיַּעֲלוּ אֶת־הָאָרוֹן וְאֶת־אֹהֶל מוֹעֵד וְאֶת־כָּל־כְּלֵי הַקֹּדֶשׁ אֲשֶׁר בָּאֹהֶל הֶעֱלוּ אֹתָם הַכֹּהֲנִים הַלְוִיִּם׃
    hebrewPlain: ויעלו את הארון ואת אהל מועד ואת כל כלי הקדש אשר באהל העלו אתם הכהנים הלוים
    kjvRefs:
    - 2 Chronicles 5:5
    kjvOsis:
    - 2Chr.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:6
    ref: 2 Chronicles 5:6
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 22464
    text: And king Solomon and all the congregation of Israel, that were assembled unto him, were before the ark, sacrificing sheep and oxen, that could not be counted nor numbered for multitude.
    translation: JPS 1917
    original: וְהַמֶּלֶךְ שְׁלֹמֹה וְכָל־עֲדַת יִשְׂרָאֵל הַנּוֹעָדִים עָלָיו לִפְנֵי הָאָרוֹן מְזַבְּחִים צֹאן וּבָקָר אֲשֶׁר לֹא־יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב׃
    hebrewPlain: והמלך שלמה וכל עדת ישראל הנועדים עליו לפני הארון מזבחים צאן ובקר אשר לא יספרו ולא ימנו מרב
    kjvRefs:
    - 2 Chronicles 5:6
    kjvOsis:
    - 2Chr.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:7
    ref: 2 Chronicles 5:7
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 22465
    text: And the priests brought in the ark of the covenant of the LORD unto its place, into the Sanctuary of the house, to the most holy place, even under the wings of the cherubim.
    translation: JPS 1917
    original: וַיָּבִיאוּ הַכֹּהֲנִים אֶת־אֲרוֹן בְּרִית־יְהוָה אֶל־מְקוֹמוֹ אֶל־דְּבִיר הַבַּיִת אֶל־קֹדֶשׁ הַקְּדָשִׁים אֶל־תַּחַת כַּנְפֵי הַכְּרוּבִים׃
    hebrewPlain: ויביאו הכהנים את ארון ברית יהוה אל מקומו אל דביר הבית אל קדש הקדשים אל תחת כנפי הכרובים
    kjvRefs:
    - 2 Chronicles 5:7
    kjvOsis:
    - 2Chr.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:8
    ref: 2 Chronicles 5:8
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 22466
    text: For the cherubim spread forth their wings over the place of the ark, and the cherubim covered the ark and the staves thereof above.
    translation: JPS 1917
    original: וַיִּהְיוּ הַכְּרוּבִים פֹּרְשִׂים כְּנָפַיִם עַל־מְקוֹם הָאָרוֹן וַיְכַסּוּ הַכְּרוּבִים עַל־הָאָרוֹן וְעַל־בַּדָּיו מִלְמָעְלָה׃
    hebrewPlain: ויהיו הכרובים פרשים כנפים על מקום הארון ויכסו הכרובים על הארון ועל בדיו מלמעלה
    kjvRefs:
    - 2 Chronicles 5:8
    kjvOsis:
    - 2Chr.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:9
    ref: 2 Chronicles 5:9
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 22467
    text: And the staves were so long that the ends of the staves were seen from the ark before the Sanctuary; but they could not be seen without; and there they are unto this day.
    translation: JPS 1917
    original: וַיַּאֲרִיכוּ הַבַּדִּים וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים מִן־הָאָרוֹן עַל־פְּנֵי הַדְּבִיר וְלֹא יֵרָאוּ הַחוּצָה וַיְהִי־שָׁם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאריכו הבדים ויראו ראשי הבדים מן הארון על פני הדביר ולא יראו החוצה ויהי שם עד היום הזה
    kjvRefs:
    - 2 Chronicles 5:9
    kjvOsis:
    - 2Chr.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.5
- type: TanakhVerse
  data:
    osis: 2Chr.5.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 5:10
    ref: 2 Chronicles 5:10
    book: 2Chr
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 22468
    text: There was nothing in the ark save the two tables which Moses put there at Horeb, when the LORD made a covenant with the children of Israel, when they came out of Egypt.
    translation: JPS 1917
    original: אֵין בָּאָרוֹן רַק שְׁנֵי הַלֻּחוֹת אֲשֶׁר־נָתַן מֹשֶׁה בְּחֹרֵב אֲשֶׁר כָּרַת יְהוָה עִם־בְּנֵי יִשְׂרָאֵל בְּצֵאתָם מִמִּצְרָיִם׃
    hebrewPlain: אין בארון רק שני הלחות אשר נתן משה בחרב אשר כרת יהוה עם בני ישראל בצאתם ממצרים
    kjvRefs:
