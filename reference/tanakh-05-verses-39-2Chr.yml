  data:
    osis: 2Chr.11.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:9
    ref: 2 Chronicles 11:9
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 22613
    text: and Adoraim, and Lachish, and Azekah,
    translation: JPS 1917
    original: וְאֶת־אֲדוֹרַיִם וְאֶת־לָכִישׁ וְאֶת־עֲזֵקָה׃
    hebrewPlain: ואת אדורים ואת לכיש ואת עזקה
    kjvRefs:
