    translation: JPS 1917
    original: אֲבָל אֲרוֹן הָאֱלֹהִים הֶעֱלָה דָוִיד מִקִּרְיַת יְעָרִים בַּהֵכִין לוֹ דָּוִיד כִּי נָטָה־לוֹ אֹהֶל בִּירוּשָׁלִָם׃
    hebrewPlain: אבל ארון האלהים העלה דויד מקרית יערים בהכין לו דויד כי נטה לו אהל בירושלם
