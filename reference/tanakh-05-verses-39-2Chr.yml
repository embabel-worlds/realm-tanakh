- type: TanakhVerse
  data:
    osis: 2Chr.20.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:7
    ref: 2 Chronicles 20:7
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 7
    ordinal: 22784
    text: Didst not Thou, O our God, drive out the inhabitants of this land before Thy people Israel, and gavest it to the seed of Abraham Thy friend for ever?
    translation: JPS 1917
    original: הֲלֹא אַתָּה אֱלֹהֵינוּ הוֹרַשְׁתָּ אֶת־יֹשְׁבֵי הָאָרֶץ הַזֹּאת מִלִּפְנֵי עַמְּךָ יִשְׂרָאֵל וַתִּתְּנָהּ לְזֶרַע אַבְרָהָם אֹהַבְךָ לְעוֹלָם׃
    hebrewPlain: הלא אתה אלהינו הורשת את ישבי הארץ הזאת מלפני עמך ישראל ותתנה לזרע אברהם אהבך לעולם
    kjvRefs:
    - 2 Chronicles 20:7
    kjvOsis:
    - 2Chr.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:8
    ref: 2 Chronicles 20:8
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 8
    ordinal: 22785
    text: 'And they dwelt therein, and have built Thee a sanctuary therein for Thy name, saying:'
    translation: JPS 1917
    original: וַיֵּשְׁבוּ־בָהּ וַיִּבְנוּ לְךָ בָּהּ מִקְדָּשׁ לְשִׁמְךָ לֵאמֹר׃
    hebrewPlain: וישבו בה ויבנו לך בה מקדש לשמך לאמר
    kjvRefs:
    - 2 Chronicles 20:8
    kjvOsis:
    - 2Chr.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:9
    ref: 2 Chronicles 20:9
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 9
    ordinal: 22786
    text: If evil come upon us, the sword, judgment, or pestilence, or famine, we will stand before this house, and before Thee—for Thy name is in this house—and cry unto Thee in our affliction, and Thou wilt hear and save.
    translation: JPS 1917
    original: אִם־תָּבוֹא עָלֵינוּ רָעָה חֶרֶב שְׁפוֹט וְדֶבֶר וְרָעָב נַעַמְדָה לִפְנֵי הַבַּיִת הַזֶּה וּלְפָנֶיךָ כִּי שִׁמְךָ בַּבַּיִת הַזֶּה וְנִזְעַק אֵלֶיךָ מִצָּרָתֵנוּ וְתִשְׁמַע וְתוֹשִׁיעַ׃
    hebrewPlain: אם תבוא עלינו רעה חרב שפוט ודבר ורעב נעמדה לפני הבית הזה ולפניך כי שמך בבית הזה ונזעק אליך מצרתנו ותשמע ותושיע
    kjvRefs:
    - 2 Chronicles 20:9
    kjvOsis:
    - 2Chr.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:10
    ref: 2 Chronicles 20:10
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 10
    ordinal: 22787
    text: And now, behold, the children of Ammon and Moab and mount Seir, whom Thou wouldest not let Israel invade, when they came out of the land of Egypt, but they turned aside from them, and destroyed them not;
    translation: JPS 1917
    original: וְעַתָּה הִנֵּה בְנֵי־עַמּוֹן וּמוֹאָב וְהַר־שֵׂעִיר אֲשֶׁר לֹא־נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם בְּבֹאָם מֵאֶרֶץ מִצְרָיִם כִּי סָרוּ מֵעֲלֵיהֶם וְלֹא הִשְׁמִידוּם׃
    hebrewPlain: ועתה הנה בני עמון ומואב והר שעיר אשר לא נתתה לישראל לבוא בהם בבאם מארץ מצרים כי סרו מעליהם ולא השמידום
    kjvRefs:
    - 2 Chronicles 20:10
    kjvOsis:
    - 2Chr.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:11
    ref: 2 Chronicles 20:11
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 11
    ordinal: 22788
    text: behold, they render unto us [evil], to come to cast us out of Thy possession, which Thou hast given us to inherit.
    translation: JPS 1917
    original: וְהִנֵּה־הֵם גֹּמְלִים עָלֵינוּ לָבוֹא לְגָרְשֵׁנוּ מִיְּרֻשָּׁתְךָ אֲשֶׁר הוֹרַשְׁתָּנוּ׃
    hebrewPlain: והנה הם גמלים עלינו לבוא לגרשנו מירשתך אשר הורשתנו
    kjvRefs:
    - 2 Chronicles 20:11
    kjvOsis:
    - 2Chr.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:12
    ref: 2 Chronicles 20:12
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 12
    ordinal: 22789
    text: O our God, wilt Thou not execute judgment on them? for we have no might against this great multitude that cometh against us; neither know we what to do; but our eyes are upon Thee.’
    translation: JPS 1917
    original: אֱלֹהֵינוּ הֲלֹא תִשְׁפָּט־בָּם כִּי אֵין בָּנוּ כֹּחַ לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה הַבָּא עָלֵינוּ וַאֲנַחְנוּ לֹא נֵדַע מַה־נַּעֲשֶׂה כִּי עָלֶיךָ עֵינֵינוּ׃
    hebrewPlain: אלהינו הלא תשפט בם כי אין בנו כח לפני ההמון הרב הזה הבא עלינו ואנחנו לא נדע מה נעשה כי עליך עינינו
    kjvRefs:
    - 2 Chronicles 20:12
    kjvOsis:
    - 2Chr.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:13
    ref: 2 Chronicles 20:13
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 13
    ordinal: 22790
    text: And all Judah stood before the LORD, with their little ones, their wives, and their children.
    translation: JPS 1917
    original: וְכָל־יְהוּדָה עֹמְדִים לִפְנֵי יְהוָה גַּם־טַפָּם נְשֵׁיהֶם וּבְנֵיהֶם׃
    hebrewPlain: וכל יהודה עמדים לפני יהוה גם טפם נשיהם ובניהם
    kjvRefs:
    - 2 Chronicles 20:13
    kjvOsis:
    - 2Chr.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:14
    ref: 2 Chronicles 20:14
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 14
    ordinal: 22791
    text: Then upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, the Levite, of the sons of Asaph, came the spirit of the LORD in the midst of the congregation;
    translation: JPS 1917
    original: וְיַחֲזִיאֵל בֶּן־זְכַרְיָהוּ בֶּן־בְּנָיָה בֶּן־יְעִיאֵל בֶּן־מַתַּנְיָה הַלֵּוִי מִן־בְּנֵי אָסָף הָיְתָה עָלָיו רוּחַ יְהוָה בְּתוֹךְ הַקָּהָל׃
    hebrewPlain: ויחזיאל בן זכריהו בן בניה בן יעיאל בן מתניה הלוי מן בני אסף היתה עליו רוח יהוה בתוך הקהל
    kjvRefs:
    - 2 Chronicles 20:14
    kjvOsis:
    - 2Chr.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:15
    ref: 2 Chronicles 20:15
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 15
    ordinal: 22792
    text: 'and he said: ‘Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat: thus saith the LORD unto you: Fear not ye, neither be dismayed by reason of this great multitude; for the battle is not yours, but God’s.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַקְשִׁיבוּ כָל־יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם וְהַמֶּלֶךְ יְהוֹשָׁפָט כֹּה־אָמַר יְהוָה לָכֶם אַתֶּם אַל־תִּירְאוּ וְאַל־תֵּחַתּוּ מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים׃
    hebrewPlain: ויאמר הקשיבו כל יהודה וישבי ירושלם והמלך יהושפט כה אמר יהוה לכם אתם אל תיראו ואל תחתו מפני ההמון הרב הזה כי לא לכם המלחמה כי לאלהים
    kjvRefs:
    - 2 Chronicles 20:15
    kjvOsis:
    - 2Chr.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:16
    ref: 2 Chronicles 20:16
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 16
    ordinal: 22793
    text: To-morrow go ye down against them; behold, they come up by the ascent of Ziz; and ye shall find them at the end of the valley, before the wilderness of Jeruel.
    translation: JPS 1917
    original: מָחָר רְדוּ עֲלֵיהֶם הִנָּם עֹלִים בְּמַעֲלֵה הַצִּיץ וּמְצָאתֶם אֹתָם בְּסוֹף הַנַּחַל פְּנֵי מִדְבַּר יְרוּאֵל׃
    hebrewPlain: מחר רדו עליהם הנם עלים במעלה הציץ ומצאתם אתם בסוף הנחל פני מדבר ירואל
    kjvRefs:
    - 2 Chronicles 20:16
    kjvOsis:
    - 2Chr.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:17
    ref: 2 Chronicles 20:17
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 17
    ordinal: 22794
    text: Ye shall not need to fight in this battle; set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem; fear not, nor be dismayed; to-morrow go out against them; for the LORD is with you.’
    translation: JPS 1917
    original: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת הִתְיַצְּבוּ עִמְדוּ וּרְאוּ אֶת־יְשׁוּעַת יְהוָה עִמָּכֶם יְהוּדָה וִירוּשָׁלִַם אַל־תִּירְאוּ וְאַל־תֵּחַתּוּ מָחָר צְאוּ לִפְנֵיהֶם וַיהוָה עִמָּכֶם׃
    hebrewPlain: לא לכם להלחם בזאת התיצבו עמדו וראו את ישועת יהוה עמכם יהודה וירושלם אל תיראו ואל תחתו מחר צאו לפניהם ויהוה עמכם
    kjvRefs:
    - 2 Chronicles 20:17
    kjvOsis:
    - 2Chr.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:18
    ref: 2 Chronicles 20:18
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 18
    ordinal: 22795
    text: And Jehoshaphat bowed his head with his face to the ground; and all Judah and the inhabitants of Jerusalem fell down before the LORD, worshipping the LORD.
    translation: JPS 1917
    original: וַיִּקֹּד יְהוֹשָׁפָט אַפַּיִם אָרְצָה וְכָל־יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם נָפְלוּ לִפְנֵי יְהוָה לְהִשְׁתַּחֲוֺת לַיהוָה׃
    hebrewPlain: ויקד יהושפט אפים ארצה וכל יהודה וישבי ירושלם נפלו לפני יהוה להשתחות ליהוה
    kjvRefs:
    - 2 Chronicles 20:18
    kjvOsis:
    - 2Chr.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:19
    ref: 2 Chronicles 20:19
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 19
    ordinal: 22796
    text: And the Levites, of the children of the Kohathites and of the children of the Korahites, stood up to praise the LORD, the God of Israel, with an exceeding loud voice.
    translation: JPS 1917
    original: וַיָּקֻמוּ הַלְוִיִּם מִן־בְּנֵי הַקְּהָתִים וּמִן־בְּנֵי הַקָּרְחִים לְהַלֵּל לַיהוָה אֱלֹהֵי יִשְׂרָאֵל בְּקוֹל גָּדוֹל לְמָעְלָה׃
    hebrewPlain: ויקמו הלוים מן בני הקהתים ומן בני הקרחים להלל ליהוה אלהי ישראל בקול גדול למעלה
    kjvRefs:
    - 2 Chronicles 20:19
    kjvOsis:
    - 2Chr.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:20
    ref: 2 Chronicles 20:20
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 20
    ordinal: 22797
    text: 'And they rose early in the morning, and went forth into the wilderness of Tekoa; and as they went forth, Jehoshaphat stood and said: ‘Hear me, O Judah, and ye inhabitants of Jerusalem; believe in the LORD your God, so shall ye be established; believe His prophets, so shall ye prosper.’'
    translation: JPS 1917
    original: וַיַּשְׁכִּימוּ בַבֹּקֶר וַיֵּצְאוּ לְמִדְבַּר תְּקוֹעַ וּבְצֵאתָם עָמַד יְהוֹשָׁפָט וַיֹּאמֶר שְׁמָעוּנִי יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם וְתֵאָמֵנוּ הַאֲמִינוּ בִנְבִיאָיו וְהַצְלִיחוּ׃
    hebrewPlain: וישכימו בבקר ויצאו למדבר תקוע ובצאתם עמד יהושפט ויאמר שמעוני יהודה וישבי ירושלם האמינו ביהוה אלהיכם ותאמנו האמינו בנביאיו והצליחו
    kjvRefs:
    - 2 Chronicles 20:20
    kjvOsis:
    - 2Chr.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:21
    ref: 2 Chronicles 20:21
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 21
    ordinal: 22798
    text: 'And when he had taken counsel with the people, he appointed them that should sing unto the LORD, and praise in the beauty of holiness, as they went out before the army, and say: ‘Give thanks unto the LORD, for His mercy endureth for ever.’'
    translation: JPS 1917
    original: וַיִּוָּעַץ אֶל־הָעָם וַיַּעֲמֵד מְשֹׁרֲרִים לַיהוָה וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ בְּצֵאת לִפְנֵי הֶחָלוּץ וְאֹמְרִים הוֹדוּ לַיהוָה כִּי לְעוֹלָם חַסְדּוֹ׃
    hebrewPlain: ויועץ אל העם ויעמד משררים ליהוה ומהללים להדרת קדש בצאת לפני החלוץ ואמרים הודו ליהוה כי לעולם חסדו
    kjvRefs:
    - 2 Chronicles 20:21
    kjvOsis:
    - 2Chr.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:22
    ref: 2 Chronicles 20:22
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 22
    ordinal: 22799
    text: And when they began to sing and to praise, the LORD set liers-in-wait against the children of Ammon, Moab, and mount Seir, that were come against Judah; and they were smitten.
    translation: JPS 1917
    original: וּבְעֵת הֵחֵלּוּ בְרִנָּה וּתְהִלָּה נָתַן יְהוָה מְאָרְבִים עַל־בְּנֵי עַמּוֹן מוֹאָב וְהַר־שֵׂעִיר הַבָּאִים לִיהוּדָה וַיִּנָּגֵפוּ׃
    hebrewPlain: ובעת החלו ברנה ותהלה נתן יהוה מארבים על בני עמון מואב והר שעיר הבאים ליהודה וינגפו
    kjvRefs:
    - 2 Chronicles 20:22
    kjvOsis:
    - 2Chr.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:23
    ref: 2 Chronicles 20:23
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 23
    ordinal: 22800
    text: For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy them; and when they had made an end of the inhabitants of Seir, every one helped to destroy another.
    translation: JPS 1917
    original: וַיַּעַמְדוּ בְּנֵי עַמּוֹן וּמוֹאָב עַל־יֹשְׁבֵי הַר־שֵׂעִיר לְהַחֲרִים וּלְהַשְׁמִיד וּכְכַלּוֹתָם בְּיוֹשְׁבֵי שֵׂעִיר עָזְרוּ אִישׁ־בְּרֵעֵהוּ לְמַשְׁחִית׃
    hebrewPlain: ויעמדו בני עמון ומואב על ישבי הר שעיר להחרים ולהשמיד וככלותם ביושבי שעיר עזרו איש ברעהו למשחית
    kjvRefs:
    - 2 Chronicles 20:23
    kjvOsis:
    - 2Chr.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:24
    ref: 2 Chronicles 20:24
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 24
    ordinal: 22801
    text: And when Judah came to the watch-tower of the wilderness, they looked upon the multitude; and, behold, they were dead bodies fallen to the earth, and there were none that escaped.
    translation: JPS 1917
    original: וִיהוּדָה בָּא עַל־הַמִּצְפֶּה לַמִּדְבָּר וַיִּפְנוּ אֶל־הֶהָמוֹן וְהִנָּם פְּגָרִים נֹפְלִים אַרְצָה וְאֵין פְּלֵיטָה׃
    hebrewPlain: ויהודה בא על המצפה למדבר ויפנו אל ההמון והנם פגרים נפלים ארצה ואין פליטה
    kjvRefs:
    - 2 Chronicles 20:24
    kjvOsis:
    - 2Chr.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:25
    ref: 2 Chronicles 20:25
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 25
    ordinal: 22802
    text: And when Jehoshaphat and his people came to take the spoil of them, they found among them in abundance both riches and dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away; and they were three days in taking the spoil, it was so much.
    translation: JPS 1917
    original: וַיָּבֹא יְהוֹשָׁפָט וְעַמּוֹ לָבֹז אֶת־שְׁלָלָם וַיִּמְצְאוּ בָהֶם לָרֹב וּרְכוּשׁ וּפְגָרִים וּכְלֵי חֲמֻדוֹת וַיְנַצְּלוּ לָהֶם לְאֵין מַשָּׂא וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים אֶת־הַשָּׁלָל כִּי רַב־הוּא׃
    hebrewPlain: ויבא יהושפט ועמו לבז את שללם וימצאו בהם לרב ורכוש ופגרים וכלי חמדות וינצלו להם לאין משא ויהיו ימים שלושה בזזים את השלל כי רב הוא
    kjvRefs:
    - 2 Chronicles 20:25
    kjvOsis:
    - 2Chr.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:26
    ref: 2 Chronicles 20:26
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 26
    ordinal: 22803
    text: And on the fourth day they assembled themselves in the valley of Beracah; for there they blessed the LORD; therefore the name of that place was called The valley of Beracah, unto this day.
    translation: JPS 1917
    original: וּבַיּוֹם הָרְבִעִי נִקְהֲלוּ לְעֵמֶק בְּרָכָה כִּי־שָׁם בֵּרֲכוּ אֶת־יְהוָה עַל־כֵּן קָרְאוּ אֶת־שֵׁם הַמָּקוֹם הַהוּא עֵמֶק בְּרָכָה עַד־הַיּוֹם׃
    hebrewPlain: וביום הרבעי נקהלו לעמק ברכה כי שם ברכו את יהוה על כן קראו את שם המקום ההוא עמק ברכה עד היום
    kjvRefs:
    - 2 Chronicles 20:26
    kjvOsis:
    - 2Chr.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:27
    ref: 2 Chronicles 20:27
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 27
    ordinal: 22804
    text: Then they returned, every man of Judah and Jerusalem, and Jehoshaphat in the forefront of them, to go back to Jerusalem with joy; for the LORD had made them to rejoice over their enemies.
    translation: JPS 1917
    original: וַיָּשֻׁבוּ כָּל־אִישׁ יְהוּדָה וִירוּשָׁלִַם וִיהוֹשָׁפָט בְּרֹאשָׁם לָשׁוּב אֶל־יְרוּשָׁלִַם בְּשִׂמְחָה כִּי־שִׂמְּחָם יְהוָה מֵאוֹיְבֵיהֶם׃
    hebrewPlain: וישבו כל איש יהודה וירושלם ויהושפט בראשם לשוב אל ירושלם בשמחה כי שמחם יהוה מאויביהם
    kjvRefs:
    - 2 Chronicles 20:27
    kjvOsis:
    - 2Chr.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:28
    ref: 2 Chronicles 20:28
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 28
    ordinal: 22805
    text: And they came to Jerusalem with psalteries and harps and trumpets unto the house of the LORD.
    translation: JPS 1917
    original: וַיָּבֹאוּ יְרוּשָׁלִַם בִּנְבָלִים וּבְכִנֹּרוֹת וּבַחֲצֹצְרוֹת אֶל־בֵּית יְהוָה׃
    hebrewPlain: ויבאו ירושלם בנבלים ובכנרות ובחצצרות אל בית יהוה
    kjvRefs:
    - 2 Chronicles 20:28
    kjvOsis:
    - 2Chr.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:29
    ref: 2 Chronicles 20:29
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 29
    ordinal: 22806
    text: And a terror from God was on all the kingdoms of the countries, when they heard that the LORD fought against the enemies of Israel.
    translation: JPS 1917
    original: וַיְהִי פַּחַד אֱלֹהִים עַל כָּל־מַמְלְכוֹת הָאֲרָצוֹת בְּשָׁמְעָם כִּי נִלְחַם יְהוָה עִם אוֹיְבֵי יִשְׂרָאֵל׃
    hebrewPlain: ויהי פחד אלהים על כל ממלכות הארצות בשמעם כי נלחם יהוה עם אויבי ישראל
    kjvRefs:
    - 2 Chronicles 20:29
    kjvOsis:
    - 2Chr.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:30
    ref: 2 Chronicles 20:30
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 30
    ordinal: 22807
    text: So the realm of Jehoshaphat was quiet; for his God gave him rest round about.
    translation: JPS 1917
    original: וַתִּשְׁקֹט מַלְכוּת יְהוֹשָׁפָט וַיָּנַח לוֹ אֱלֹהָיו מִסָּבִיב׃
    hebrewPlain: ותשקט מלכות יהושפט וינח לו אלהיו מסביב
    kjvRefs:
    - 2 Chronicles 20:30
    kjvOsis:
    - 2Chr.20.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:31
    ref: 2 Chronicles 20:31
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 31
    ordinal: 22808
    text: And Jehoshaphat reigned over Judah; he was thirty and five years old when he began to reign; and he reigned twenty and five years in Jerusalem; and his mother’s name was Azubah the daughter of Shilhi.
    translation: JPS 1917
    original: וַיִּמְלֹךְ יְהוֹשָׁפָט עַל־יְהוּדָה בֶּן־שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה בְּמָלְכוֹ וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ בִּירוּשָׁלִַם וְשֵׁם אִמּוֹ עֲזוּבָה בַּת־שִׁלְחִי׃
    hebrewPlain: וימלך יהושפט על יהודה בן שלשים וחמש שנה במלכו ועשרים וחמש שנה מלך בירושלם ושם אמו עזובה בת שלחי
    kjvRefs:
    - 2 Chronicles 20:31
    kjvOsis:
    - 2Chr.20.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:32
    ref: 2 Chronicles 20:32
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 32
    ordinal: 22809
    text: And he walked in the way of Asa his father, and turned not aside from it, doing that which was right in the eyes of the LORD.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו אָסָא וְלֹא־סָר מִמֶּנָּה לַעֲשׂוֹת הַיָּשָׁר בְּעֵינֵי יְהוָה׃
    hebrewPlain: וילך בדרך אביו אסא ולא סר ממנה לעשות הישר בעיני יהוה
    kjvRefs:
    - 2 Chronicles 20:32
    kjvOsis:
    - 2Chr.20.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:33
    ref: 2 Chronicles 20:33
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 33
    ordinal: 22810
    text: Howbeit the high places were not taken away; neither as yet had the people set their hearts unto the God of their fathers.
    translation: JPS 1917
    original: אַךְ הַבָּמוֹת לֹא־סָרוּ וְעוֹד הָעָם לֹא־הֵכִינוּ לְבָבָם לֵאלֹהֵי אֲבֹתֵיהֶם׃
    hebrewPlain: אך הבמות לא סרו ועוד העם לא הכינו לבבם לאלהי אבתיהם
    kjvRefs:
    - 2 Chronicles 20:33
    kjvOsis:
    - 2Chr.20.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.34
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:34
    ref: 2 Chronicles 20:34
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 34
    ordinal: 22811
    text: Now the rest of the acts of Jehoshaphat, first and last, behold, they are written in the words of Jehu the son of Hanani, which is inserted in the book of the kings of Israel.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט הָרִאשֹׁנִים וְהָאַחֲרֹנִים הִנָּם כְּתוּבִים בְּדִבְרֵי יֵהוּא בֶן־חֲנָנִי אֲשֶׁר הֹעֲלָה עַל־סֵפֶר מַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יהושפט הראשנים והאחרנים הנם כתובים בדברי יהוא בן חנני אשר העלה על ספר מלכי ישראל
    kjvRefs:
    - 2 Chronicles 20:34
    kjvOsis:
    - 2Chr.20.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.35
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:35
    ref: 2 Chronicles 20:35
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 35
    ordinal: 22812
    text: And after this did Jehoshaphat king of Judah join himself with Ahaziah king of Israel; the same did very wickedly;
    translation: JPS 1917
    original: וְאַחֲרֵיכֵן אֶתְחַבַּר יְהוֹשָׁפָט מֶלֶךְ־יְהוּדָה עִם אֲחַזְיָה מֶלֶךְ־יִשְׂרָאֵל הוּא הִרְשִׁיעַ לַעֲשׂוֹת׃
    hebrewPlain: ואחריכן אתחבר יהושפט מלך יהודה עם אחזיה מלך ישראל הוא הרשיע לעשות
    kjvRefs:
    - 2 Chronicles 20:35
    kjvOsis:
    - 2Chr.20.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.36
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:36
    ref: 2 Chronicles 20:36
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 36
    ordinal: 22813
    text: and he joined him with himself to make ships to go to Tarshish; and they made the ships in Ezion-geber.
    translation: JPS 1917
    original: וַיְחַבְּרֵהוּ עִמּוֹ לַעֲשׂוֹת אֳנִיּוֹת לָלֶכֶת תַּרְשִׁישׁ וַיַּעֲשׂוּ אֳנִיּוֹת בְּעֶצְיוֹן גָּבֶר׃
    hebrewPlain: ויחברהו עמו לעשות אניות ללכת תרשיש ויעשו אניות בעציון גבר
    kjvRefs:
    - 2 Chronicles 20:36
    kjvOsis:
    - 2Chr.20.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.20.37
    scripture: tanakh
    name: Tanakh 2 Chronicles 20:37
    ref: 2 Chronicles 20:37
    book: 2Chr
    section: ketuvim
    chapter: 20
    verse: 37
    ordinal: 22814
    text: 'Then Eliezer the son of Dodavahu of Mareshah prophesied against Jehoshaphat, saying: ‘Because thou hast joined thyself with Ahaziah, the LORD hath made a breach in thy works.’ And the ships were broken, that they were not able to go to Tarshish.'
    translation: JPS 1917
    original: וַיִּתְנַבֵּא אֱלִיעֶזֶר בֶּן־דֹּדָוָהוּ מִמָּרֵשָׁה עַל־יְהוֹשָׁפָט לֵאמֹר כְּהִתְחַבֶּרְךָ עִם־אֲחַזְיָהוּ פָּרַץ יְהוָה אֶת־מַעֲשֶׂיךָ וַיִּשָּׁבְרוּ אֳנִיּוֹת וְלֹא עָצְרוּ לָלֶכֶת אֶל־תַּרְשִׁישׁ׃
    hebrewPlain: ויתנבא אליעזר בן דדוהו ממרשה על יהושפט לאמר כהתחברך עם אחזיהו פרץ יהוה את מעשיך וישברו אניות ולא עצרו ללכת אל תרשיש
    kjvRefs:
    - 2 Chronicles 20:37
    kjvOsis:
    - 2Chr.20.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.20
- type: TanakhVerse
  data:
    osis: 2Chr.21.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:1
    ref: 2 Chronicles 21:1
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 1
    ordinal: 22815
    text: And Jehoshaphat slept with his fathers, and was buried with his fathers in the city of David; and Jehoram his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יְהוֹשָׁפָט עִם־אֲבֹתָיו וַיִּקָּבֵר עִם־אֲבֹתָיו בְּעִיר דָּוִיד וַיִּמְלֹךְ יְהוֹרָם בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יהושפט עם אבתיו ויקבר עם אבתיו בעיר דויד וימלך יהורם בנו תחתיו
    kjvRefs:
    - 2 Chronicles 21:1
    kjvOsis:
    - 2Chr.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:2
    ref: 2 Chronicles 21:2
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 2
    ordinal: 22816
    text: And he had brethren the sons of Jehoshaphat, Azariah, and Jehiel, and Zechariah, and Azariahu, and Michael, and Shephatiah; all these were the sons of Jehoshaphat king of Israel.
    translation: JPS 1917
    original: וְלוֹ־אַחִים בְּנֵי יְהוֹשָׁפָט עֲזַרְיָה וִיחִיאֵל וּזְכַרְיָהוּ וַעֲזַרְיָהוּ וּמִיכָאֵל וּשְׁפַטְיָהוּ כָּל־אֵלֶּה בְּנֵי יְהוֹשָׁפָט מֶלֶךְ־יִשְׂרָאֵל׃
    hebrewPlain: ולו אחים בני יהושפט עזריה ויחיאל וזכריהו ועזריהו ומיכאל ושפטיהו כל אלה בני יהושפט מלך ישראל
    kjvRefs:
    - 2 Chronicles 21:2
    kjvOsis:
    - 2Chr.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:3
    ref: 2 Chronicles 21:3
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 3
    ordinal: 22817
    text: And their father gave them great gifts, of silver, and of gold, and of precious things, with fortified cities in Judah; but the kingdom gave he to Jehoram, because he was the first-born.
    translation: JPS 1917
    original: וַיִּתֵּן לָהֶם אֲבִיהֶם מַתָּנוֹת רַבּוֹת לְכֶסֶף וּלְזָהָב וּלְמִגְדָּנוֹת עִם־עָרֵי מְצֻרוֹת בִּיהוּדָה וְאֶת־הַמַּמְלָכָה נָתַן לִיהוֹרָם כִּי־הוּא הַבְּכוֹר׃
    hebrewPlain: ויתן להם אביהם מתנות רבות לכסף ולזהב ולמגדנות עם ערי מצרות ביהודה ואת הממלכה נתן ליהורם כי הוא הבכור
    kjvRefs:
    - 2 Chronicles 21:3
    kjvOsis:
    - 2Chr.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:4
    ref: 2 Chronicles 21:4
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 4
    ordinal: 22818
    text: Now when Jehoram was risen up over the kingdom of his father, and had strengthened himself, he slew all his brethren with the sword, and divers also of the princes of Israel.
    translation: JPS 1917
    original: וַיָּקָם יְהוֹרָם עַל־מַמְלֶכַת אָבִיו וַיִּתְחַזַּק וַיַּהֲרֹג אֶת־כָּל־אֶחָיו בֶּחָרֶב וְגַם מִשָּׂרֵי יִשְׂרָאֵל׃
    hebrewPlain: ויקם יהורם על ממלכת אביו ויתחזק ויהרג את כל אחיו בחרב וגם משרי ישראל
    kjvRefs:
    - 2 Chronicles 21:4
    kjvOsis:
    - 2Chr.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:5
    ref: 2 Chronicles 21:5
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 5
    ordinal: 22819
    text: Jehoram was thirty and two years old when he began to reign; and he reigned eight years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה יְהוֹרָם בְּמָלְכוֹ וּשְׁמוֹנֶה שָׁנִים מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן שלשים ושתים שנה יהורם במלכו ושמונה שנים מלך בירושלם
    kjvRefs:
    - 2 Chronicles 21:5
    kjvOsis:
    - 2Chr.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:6
    ref: 2 Chronicles 21:6
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 6
    ordinal: 22820
    text: And he walked in the way of the kings of Israel, as did the house of Ahab; for he had the daughter of Ahab to wife; and he did that which was evil in the sight of the LORD.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדֶרֶךְ מַלְכֵי יִשְׂרָאֵל כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב כִּי בַּת־אַחְאָב הָיְתָה לּוֹ אִשָּׁה וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: וילך בדרך מלכי ישראל כאשר עשו בית אחאב כי בת אחאב היתה לו אשה ויעש הרע בעיני יהוה
    kjvRefs:
    - 2 Chronicles 21:6
    kjvOsis:
    - 2Chr.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:7
    ref: 2 Chronicles 21:7
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 7
    ordinal: 22821
    text: Howbeit the LORD would not destroy the house of David, because of the covenant that He had made with David, and as He promised to give a lamp to him and to his children alway.
    translation: JPS 1917
    original: וְלֹא־אָבָה יְהוָה לְהַשְׁחִית אֶת־בֵּית דָּוִיד לְמַעַן הַבְּרִית אֲשֶׁר כָּרַת לְדָוִיד וְכַאֲשֶׁר אָמַר לָתֵת לוֹ נִיר וּלְבָנָיו כָּל־הַיָּמִים׃
    hebrewPlain: ולא אבה יהוה להשחית את בית דויד למען הברית אשר כרת לדויד וכאשר אמר לתת לו ניר ולבניו כל הימים
    kjvRefs:
    - 2 Chronicles 21:7
    kjvOsis:
    - 2Chr.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:8
    ref: 2 Chronicles 21:8
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 8
    ordinal: 22822
    text: In his days Edom revolted from under the hand of Judah, and made a king over themselves.
    translation: JPS 1917
    original: בְּיָמָיו פָּשַׁע אֱדוֹם מִתַּחַת יַד־יְהוּדָה וַיַּמְלִיכוּ עֲלֵיהֶם מֶלֶךְ׃
    hebrewPlain: בימיו פשע אדום מתחת יד יהודה וימליכו עליהם מלך
    kjvRefs:
    - 2 Chronicles 21:8
    kjvOsis:
    - 2Chr.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:9
    ref: 2 Chronicles 21:9
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 9
    ordinal: 22823
    text: Then Jehoram passed over with his captains, and all his chariots with him; and he rose up by night, and smote the Edomites that compassed him about, and the captains of the chariots.
    translation: JPS 1917
    original: וַיַּעֲבֹר יְהוֹרָם עִם־שָׂרָיו וְכָל־הָרֶכֶב עִמּוֹ וַיְהִי קָם לַיְלָה וַיַּךְ אֶת־אֱדוֹם הַסּוֹבֵב אֵלָיו וְאֵת שָׂרֵי הָרָכֶב׃
    hebrewPlain: ויעבר יהורם עם שריו וכל הרכב עמו ויהי קם לילה ויך את אדום הסובב אליו ואת שרי הרכב
    kjvRefs:
    - 2 Chronicles 21:9
    kjvOsis:
    - 2Chr.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:10
    ref: 2 Chronicles 21:10
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 10
    ordinal: 22824
    text: So Edom revolted from under the hand of Judah unto this day; then did Libnah revolt at the same time from under his hand; because he had forsaken the LORD, the God of his fathers.
    translation: JPS 1917
    original: וַיִּפְשַׁע אֱדוֹם מִתַּחַת יַד־יְהוּדָה עַד הַיּוֹם הַזֶּה אָז תִּפְשַׁע לִבְנָה בָּעֵת הַהִיא מִתַּחַת יָדוֹ כִּי עָזַב אֶת־יְהוָה אֱלֹהֵי אֲבֹתָיו׃
    hebrewPlain: ויפשע אדום מתחת יד יהודה עד היום הזה אז תפשע לבנה בעת ההיא מתחת ידו כי עזב את יהוה אלהי אבתיו
    kjvRefs:
    - 2 Chronicles 21:10
    kjvOsis:
    - 2Chr.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:11
    ref: 2 Chronicles 21:11
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 11
    ordinal: 22825
    text: Moreover he made high places in the mountains of Judah, and made the inhabitants of Jerusalem to go astray, and drew Judah away.
    translation: JPS 1917
    original: גַּם־הוּא עָשָׂה־בָמוֹת בְּהָרֵי יְהוּדָה וַיֶּזֶן אֶת־יֹשְׁבֵי יְרוּשָׁלִַם וַיַּדַּח אֶת־יְהוּדָה׃
    hebrewPlain: גם הוא עשה במות בהרי יהודה ויזן את ישבי ירושלם וידח את יהודה
    kjvRefs:
    - 2 Chronicles 21:11
    kjvOsis:
    - 2Chr.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:12
    ref: 2 Chronicles 21:12
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 12
    ordinal: 22826
    text: 'And there came a writing to him from Elijah the prophet, saying: ‘Thus saith the LORD, the God of David thy father: Because thou hast not walked in the ways of Jehoshaphat thy father, nor in the ways of Asa king of Judah;'
    translation: JPS 1917
    original: וַיָּבֹא אֵלָיו מִכְתָּב מֵאֵלִיָּהוּ הַנָּבִיא לֵאמֹר כֹּה אָמַר יְהוָה אֱלֹהֵי דָּוִיד אָבִיךָ תַּחַת אֲשֶׁר לֹא־הָלַכְתָּ בְּדַרְכֵי יְהוֹשָׁפָט אָבִיךָ וּבְדַרְכֵי אָסָא מֶלֶךְ־יְהוּדָה׃
    hebrewPlain: ויבא אליו מכתב מאליהו הנביא לאמר כה אמר יהוה אלהי דויד אביך תחת אשר לא הלכת בדרכי יהושפט אביך ובדרכי אסא מלך יהודה
    kjvRefs:
    - 2 Chronicles 21:12
    kjvOsis:
    - 2Chr.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:13
    ref: 2 Chronicles 21:13
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 13
    ordinal: 22827
    text: but hast walked in the way of the kings of Israel, and hast made Judah and the inhabitants of Jerusalem to go astray, like as the house of Ahab made [Israel] to go astray; and also hast slain thy brethren of thy father’s house, who were better than thyself;
    translation: JPS 1917
    original: וַתֵּלֶךְ בְּדֶרֶךְ מַלְכֵי יִשְׂרָאֵל וַתַּזְנֶה אֶת־יְהוּדָה וְאֶת־יֹשְׁבֵי יְרוּשָׁלִַם כְּהַזְנוֹת בֵּית אַחְאָב וְגַם אֶת־אַחֶיךָ בֵית־אָבִיךָ הַטּוֹבִים מִמְּךָ הָרָגְתָּ׃
    hebrewPlain: ותלך בדרך מלכי ישראל ותזנה את יהודה ואת ישבי ירושלם כהזנות בית אחאב וגם את אחיך בית אביך הטובים ממך הרגת
    kjvRefs:
    - 2 Chronicles 21:13
    kjvOsis:
    - 2Chr.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:14
    ref: 2 Chronicles 21:14
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 14
    ordinal: 22828
    text: behold, the LORD will smite with a great plague thy people, and thy children, and thy wives, and all thy substance;
    translation: JPS 1917
    original: הִנֵּה יְהוָה נֹגֵף מַגֵּפָה גְדוֹלָה בְּעַמֶּךָ וּבְבָנֶיךָ וּבְנָשֶׁיךָ וּבְכָל־רְכוּשֶׁךָ׃
    hebrewPlain: הנה יהוה נגף מגפה גדולה בעמך ובבניך ובנשיך ובכל רכושך
    kjvRefs:
    - 2 Chronicles 21:14
    kjvOsis:
    - 2Chr.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:15
    ref: 2 Chronicles 21:15
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 15
    ordinal: 22829
    text: and thou shalt have great sickness by disease of thy bowels, until thy bowels fall out by reason of the sickness, day by day.’
    translation: JPS 1917
    original: וְאַתָּה בָּחֳלָיִים רַבִּים בְּמַחֲלֵה מֵעֶיךָ עַד־יֵצְאוּ מֵעֶיךָ מִן־הַחֹלִי יָמִים עַל־יָמִים׃
    hebrewPlain: ואתה בחליים רבים במחלה מעיך עד יצאו מעיך מן החלי ימים על ימים
    kjvRefs:
    - 2 Chronicles 21:15
    kjvOsis:
    - 2Chr.21.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:16
    ref: 2 Chronicles 21:16
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 16
    ordinal: 22830
    text: And the LORD stirred up against Jehoram the spirit of the Philistines, and of the Arabians that are beside the Ethiopians;
    translation: JPS 1917
    original: וַיָּעַר יְהוָה עַל־יְהוֹרָם אֵת רוּחַ הַפְּלִשְׁתִּים וְהָעַרְבִים אֲשֶׁר עַל־יַד כּוּשִׁים׃
    hebrewPlain: ויער יהוה על יהורם את רוח הפלשתים והערבים אשר על יד כושים
    kjvRefs:
    - 2 Chronicles 21:16
    kjvOsis:
    - 2Chr.21.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:17
    ref: 2 Chronicles 21:17
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 17
    ordinal: 22831
    text: and they came up against Judah, and broke into it, and carried away all the substance that was found in the king’s house, and his sons also, and his wives; so that there was never a son left him, save Jehoahaz, the youngest of his sons.
    translation: JPS 1917
    original: וַיַּעֲלוּ בִיהוּדָה וַיִּבְקָעוּהָ וַיִּשְׁבּוּ אֵת כָּל־הָרְכוּשׁ הַנִּמְצָא לְבֵית־הַמֶּלֶךְ וְגַם־בָּנָיו וְנָשָׁיו וְלֹא נִשְׁאַר־לוֹ בֵּן כִּי אִם־יְהוֹאָחָז קְטֹן בָּנָיו׃
    hebrewPlain: ויעלו ביהודה ויבקעוה וישבו את כל הרכוש הנמצא לבית המלך וגם בניו ונשיו ולא נשאר לו בן כי אם יהואחז קטן בניו
    kjvRefs:
    - 2 Chronicles 21:17
    kjvOsis:
    - 2Chr.21.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:18
    ref: 2 Chronicles 21:18
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 18
    ordinal: 22832
    text: And after all this the LORD smote him in his bowels with an incurable disease.
    translation: JPS 1917
    original: וְאַחֲרֵי כָּל־זֹאת נְגָפוֹ יְהוָה בְּמֵעָיו לָחֳלִי לְאֵין מַרְפֵּא׃
    hebrewPlain: ואחרי כל זאת נגפו יהוה במעיו לחלי לאין מרפא
    kjvRefs:
    - 2 Chronicles 21:18
    kjvOsis:
    - 2Chr.21.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:19
    ref: 2 Chronicles 21:19
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 19
    ordinal: 22833
    text: And it came to pass, that in process of time, at the end of two years, his bowels fell out by reason of his sickness, and he died of sore diseases. And his people made no burning for him, like the burning of his fathers.
    translation: JPS 1917
    original: וַיְהִי לְיָמִים מִיָּמִים וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם יָצְאוּ מֵעָיו עִם־חָלְיוֹ וַיָּמָת בְּתַחֲלֻאִים רָעִים וְלֹא־עָשׂוּ לוֹ עַמּוֹ שְׂרֵפָה כִּשְׂרֵפַת אֲבֹתָיו׃
    hebrewPlain: ויהי לימים מימים וכעת צאת הקץ לימים שנים יצאו מעיו עם חליו וימת בתחלאים רעים ולא עשו לו עמו שרפה כשרפת אבתיו
    kjvRefs:
    - 2 Chronicles 21:19
    kjvOsis:
    - 2Chr.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.21.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 21:20
    ref: 2 Chronicles 21:20
    book: 2Chr
    section: ketuvim
    chapter: 21
    verse: 20
    ordinal: 22834
    text: Thirty and two years old was he when he began to reign, and he reigned in Jerusalem eight years; and he departed joyless; and they buried him in the city of David, but not in the sepulchres of the kings.
    translation: JPS 1917
    original: בֶּן־שְׁלֹשִׁים וּשְׁתַּיִם הָיָה בְמָלְכוֹ וּשְׁמוֹנֶה שָׁנִים מָלַךְ בִּירוּשָׁלִָם וַיֵּלֶךְ בְּלֹא חֶמְדָּה וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא בְּקִבְרוֹת הַמְּלָכִים׃
    hebrewPlain: בן שלשים ושתים היה במלכו ושמונה שנים מלך בירושלם וילך בלא חמדה ויקברהו בעיר דויד ולא בקברות המלכים
    kjvRefs:
    - 2 Chronicles 21:20
    kjvOsis:
    - 2Chr.21.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.21
- type: TanakhVerse
  data:
    osis: 2Chr.22.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:1
    ref: 2 Chronicles 22:1
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 1
    ordinal: 22835
    text: And the inhabitants of Jerusalem made Ahaziah his youngest son king in his stead; for the band of men that came with the Arabians to the camp had slain all the eldest. So Ahaziah the son of Jehoram king of Judah reigned.
    translation: JPS 1917
    original: וַיַּמְלִיכוּ יוֹשְׁבֵי יְרוּשָׁלִַם אֶת־אֲחַזְיָהוּ בְנוֹ הַקָּטֹן תַּחְתָּיו כִּי כָל־הָרִאשֹׁנִים הָרַג הַגְּדוּד הַבָּא בָעַרְבִים לַמַּחֲנֶה וַיִּמְלֹךְ אֲחַזְיָהוּ בֶן־יְהוֹרָם מֶלֶךְ יְהוּדָה׃
    hebrewPlain: וימליכו יושבי ירושלם את אחזיהו בנו הקטן תחתיו כי כל הראשנים הרג הגדוד הבא בערבים למחנה וימלך אחזיהו בן יהורם מלך יהודה
    kjvRefs:
    - 2 Chronicles 22:1
    kjvOsis:
    - 2Chr.22.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:2
    ref: 2 Chronicles 22:2
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 2
    ordinal: 22836
    text: Forty and two years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem; and his mother’s name was Athaliah the daughter of Omri.
    translation: JPS 1917
    original: בֶּן־אַרְבָּעִים וּשְׁתַּיִם שָׁנָה אֲחַזְיָהוּ בְמָלְכוֹ וְשָׁנָה אַחַת מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ עֲתַלְיָהוּ בַּת־עָמְרִי׃
    hebrewPlain: בן ארבעים ושתים שנה אחזיהו במלכו ושנה אחת מלך בירושלם ושם אמו עתליהו בת עמרי
    kjvRefs:
    - 2 Chronicles 22:2
    kjvOsis:
    - 2Chr.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:3
    ref: 2 Chronicles 22:3
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 3
    ordinal: 22837
    text: He also walked in the ways of the house of Ahab; for his mother was his counsellor to do wickedly.
    translation: JPS 1917
    original: גַּם־הוּא הָלַךְ בְּדַרְכֵי בֵּית אַחְאָב כִּי אִמּוֹ הָיְתָה יוֹעַצְתּוֹ לְהַרְשִׁיעַ׃
    hebrewPlain: גם הוא הלך בדרכי בית אחאב כי אמו היתה יועצתו להרשיע
    kjvRefs:
    - 2 Chronicles 22:3
    kjvOsis:
    - 2Chr.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:4
    ref: 2 Chronicles 22:4
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 4
    ordinal: 22838
    text: And he did that which was evil in the sight of the LORD, as did the house of Ahab; for they were his counsellors after the death of his father, to his destruction.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּבֵית אַחְאָב כִּי־הֵמָּה הָיוּ־לוֹ יוֹעֲצִים אַחֲרֵי מוֹת אָבִיו לְמַשְׁחִית לוֹ׃
    hebrewPlain: ויעש הרע בעיני יהוה כבית אחאב כי המה היו לו יועצים אחרי מות אביו למשחית לו
    kjvRefs:
    - 2 Chronicles 22:4
    kjvOsis:
    - 2Chr.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:5
    ref: 2 Chronicles 22:5
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 5
    ordinal: 22839
    text: He walked also after their counsel, and went with Jehoram the son of Ahab king of Israel to war against Hazael king of Aram at Ramoth-gilead; and the Arameans wounded Joram.
    translation: JPS 1917
    original: גַּם בַּעֲצָתָם הָלַךְ וַיֵּלֶךְ אֶת־יְהוֹרָם בֶּן־אַחְאָב מֶלֶךְ יִשְׂרָאֵל לַמִּלְחָמָה עַל־חֲזָאֵל מֶלֶךְ־אֲרָם בְּרָמוֹת גִּלְעָד וַיַּכּוּ הָרַמִּים אֶת־יוֹרָם׃
    hebrewPlain: גם בעצתם הלך וילך את יהורם בן אחאב מלך ישראל למלחמה על חזאל מלך ארם ברמות גלעד ויכו הרמים את יורם
    kjvRefs:
    - 2 Chronicles 22:5
    kjvOsis:
    - 2Chr.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:6
    ref: 2 Chronicles 22:6
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 6
    ordinal: 22840
    text: And he returned to be healed in Jezreel of the wounds which they had given him at Ramah, when he fought against Hazael king of Aram. And Azariah the son of Jehoram king of Judah went down to see Jehoram the son of Ahab in Jezreel, because he was sick.
    translation: JPS 1917
    original: וַיָּשָׁב לְהִתְרַפֵּא בְיִזְרְעֶאל כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ בָרָמָה בְּהִלָּחֲמוֹ אֶת־חֲזָהאֵל מֶלֶךְ אֲרָם וַעֲזַרְיָהוּ בֶן־יְהוֹרָם מֶלֶךְ יְהוּדָה יָרַד לִרְאוֹת אֶת־יְהוֹרָם בֶּן־אַחְאָב בְּיִזְרְעֶאל כִּי־חֹלֶה הוּא׃
    hebrewPlain: וישב להתרפא ביזרעאל כי המכים אשר הכהו ברמה בהלחמו את חזהאל מלך ארם ועזריהו בן יהורם מלך יהודה ירד לראות את יהורם בן אחאב ביזרעאל כי חלה הוא
    kjvRefs:
    - 2 Chronicles 22:6
    kjvOsis:
    - 2Chr.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:7
    ref: 2 Chronicles 22:7
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 7
    ordinal: 22841
    text: Now the downfall of Ahaziah was of God, in that he went unto Joram; for when he was come, he went out with Jehoram against Jehu the son of Nimshi, whom the LORD had anointed to cut off the house of Ahab.
    translation: JPS 1917
    original: וּמֵאֱלֹהִים הָיְתָה תְּבוּסַת אֲחַזְיָהוּ לָבוֹא אֶל־יוֹרָם וּבְבֹאוֹ יָצָא עִם־יְהוֹרָם אֶל־יֵהוּא בֶן־נִמְשִׁי אֲשֶׁר מְשָׁחוֹ יְהוָה לְהַכְרִית אֶת־בֵּית אַחְאָב׃
    hebrewPlain: ומאלהים היתה תבוסת אחזיהו לבוא אל יורם ובבאו יצא עם יהורם אל יהוא בן נמשי אשר משחו יהוה להכרית את בית אחאב
    kjvRefs:
    - 2 Chronicles 22:7
    kjvOsis:
    - 2Chr.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:8
    ref: 2 Chronicles 22:8
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 8
    ordinal: 22842
    text: And it came to pass, when Jehu was executing judgment upon the house of Ahab, that he found the princes of Judah, and the sons of the brethren of Ahaziah, ministering to Ahaziah, and slew them.
    translation: JPS 1917
    original: וַיְהִי כְּהִשָּׁפֵט יֵהוּא עִם־בֵּית אַחְאָב וַיִּמְצָא אֶת־שָׂרֵי יְהוּדָה וּבְנֵי אֲחֵי אֲחַזְיָהוּ מְשָׁרְתִים לַאֲחַזְיָהוּ וַיַּהַרְגֵם׃
    hebrewPlain: ויהי כהשפט יהוא עם בית אחאב וימצא את שרי יהודה ובני אחי אחזיהו משרתים לאחזיהו ויהרגם
    kjvRefs:
    - 2 Chronicles 22:8
    kjvOsis:
    - 2Chr.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:9
    ref: 2 Chronicles 22:9
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 9
    ordinal: 22843
    text: 'And he sought Ahaziah, and they caught him—now he was hiding in Samaria—and they brought him to Jehu, and slew him; and they buried him, for they said: ‘He is the son of Jehoshaphat, who sought the LORD with all his heart.’ And there was none of the house of Ahaziah that had power to hold the kingdom.'
    translation: JPS 1917
    original: וַיְבַקֵּשׁ אֶת־אֲחַזְיָהוּ וַיִּלְכְּדֻהוּ וְהוּא מִתְחַבֵּא בְשֹׁמְרוֹן וַיְבִאֻהוּ אֶל־יֵהוּא וַיְמִתֻהוּ וַיִּקְבְּרֻהוּ כִּי אָמְרוּ בֶּן־יְהוֹשָׁפָט הוּא אֲשֶׁר־דָּרַשׁ אֶת־יְהוָה בְּכָל־לְבָבוֹ וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה׃
    hebrewPlain: ויבקש את אחזיהו וילכדהו והוא מתחבא בשמרון ויבאהו אל יהוא וימתהו ויקברהו כי אמרו בן יהושפט הוא אשר דרש את יהוה בכל לבבו ואין לבית אחזיהו לעצר כח לממלכה
    kjvRefs:
    - 2 Chronicles 22:9
    kjvOsis:
    - 2Chr.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:10
    ref: 2 Chronicles 22:10
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 10
    ordinal: 22844
    text: Now when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal of the house of Judah.
    translation: JPS 1917
    original: וַעֲתַלְיָהוּ אֵם אֲחַזְיָהוּ רָאֲתָה כִּי מֵת בְּנָהּ וַתָּקָם וַתְּדַבֵּר אֶת־כָּל־זֶרַע הַמַּמְלָכָה לְבֵית יְהוּדָה׃
    hebrewPlain: ועתליהו אם אחזיהו ראתה כי מת בנה ותקם ותדבר את כל זרע הממלכה לבית יהודה
    kjvRefs:
    - 2 Chronicles 22:10
    kjvOsis:
    - 2Chr.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:11
    ref: 2 Chronicles 22:11
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 11
    ordinal: 22845
    text: But Jehoshabeath, the daughter of the king, took Joash the son of Ahaziah, and stole him away from among the king’s sons that were slain, and put him and his nurse in the bed-chamber. So Jehoshabeath, the daughter of king Jehoram, the wife of Jehoiada the priest—for she was the sister of Ahaziah—hid him from Athaliah, so that she slew him not.
    translation: JPS 1917
    original: וַתִּקַּח יְהוֹשַׁבְעַת בַּת־הַמֶּלֶךְ אֶת־יוֹאָשׁ בֶּן־אֲחַזְיָהוּ וַתִּגְנֹב אֹתוֹ מִתּוֹךְ בְּנֵי־הַמֶּלֶךְ הַמּוּמָתִים וַתִּתֵּן אֹתוֹ וְאֶת־מֵינִקְתּוֹ בַּחֲדַר הַמִּטּוֹת וַתַּסְתִּירֵהוּ יְהוֹשַׁבְעַת בַּת־הַמֶּלֶךְ יְהוֹרָם אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ מִפְּנֵי עֲתַלְיָהוּ וְלֹא הֱמִיתָתְהוּ׃
    hebrewPlain: ותקח יהושבעת בת המלך את יואש בן אחזיהו ותגנב אתו מתוך בני המלך המומתים ותתן אתו ואת מינקתו בחדר המטות ותסתירהו יהושבעת בת המלך יהורם אשת יהוידע הכהן כי היא היתה אחות אחזיהו מפני עתליהו ולא המיתתהו
    kjvRefs:
    - 2 Chronicles 22:11
    kjvOsis:
    - 2Chr.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.22.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 22:12
    ref: 2 Chronicles 22:12
    book: 2Chr
    section: ketuvim
    chapter: 22
    verse: 12
    ordinal: 22846
    text: And he was with them hid in the house of God six years; and Athaliah reigned over the land.
    translation: JPS 1917
    original: וַיְהִי אִתָּם בְּבֵית הָאֱלֹהִים מִתְחַבֵּא שֵׁשׁ שָׁנִים וַעֲתַלְיָה מֹלֶכֶת עַל־הָאָרֶץ׃
    hebrewPlain: ויהי אתם בבית האלהים מתחבא שש שנים ועתליה מלכת על הארץ
    kjvRefs:
    - 2 Chronicles 22:12
    kjvOsis:
    - 2Chr.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.22
- type: TanakhVerse
  data:
    osis: 2Chr.23.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:1
    ref: 2 Chronicles 23:1
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 1
    ordinal: 22847
    text: And in the seventh year Jehoiada strengthened himself, and took the captains of hundreds, Azariah the son of Jeroham, and Ishmael the son of Jehohanan, and Azariah the son of Obed, and Maaseiah the son of Adaiah, and Elishaphat the son of Zichri, into covenant with him.
    translation: JPS 1917
    original: וּבַשָּׁנָה הַשְּׁבִעִית הִתְחַזַּק יְהוֹיָדָע וַיִּקַּח אֶת־שָׂרֵי הַמֵּאוֹת לַעֲזַרְיָהוּ בֶן־יְרֹחָם וּלְיִשְׁמָעֵאל בֶּן־יְהוֹחָנָן וְלַעֲזַרְיָהוּ בֶן־עוֹבֵד וְאֶת־מַעֲשֵׂיָהוּ בֶן־עֲדָיָהוּ וְאֶת־אֱלִישָׁפָט בֶּן־זִכְרִי עִמּוֹ בַבְּרִית׃
    hebrewPlain: ובשנה השבעית התחזק יהוידע ויקח את שרי המאות לעזריהו בן ירחם ולישמעאל בן יהוחנן ולעזריהו בן עובד ואת מעשיהו בן עדיהו ואת אלישפט בן זכרי עמו בברית
    kjvRefs:
    - 2 Chronicles 23:1
    kjvOsis:
    - 2Chr.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:2
    ref: 2 Chronicles 23:2
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 2
    ordinal: 22848
    text: And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the heads of fathers’ houses of Israel, and they came to Jerusalem.
    translation: JPS 1917
    original: וַיָּסֹבּוּ בִּיהוּדָה וַיִּקְבְּצוּ אֶת־הַלְוִיִּם מִכָּל־עָרֵי יְהוּדָה וְרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם׃
    hebrewPlain: ויסבו ביהודה ויקבצו את הלוים מכל ערי יהודה וראשי האבות לישראל ויבאו אל ירושלם
    kjvRefs:
    - 2 Chronicles 23:2
    kjvOsis:
    - 2Chr.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:3
    ref: 2 Chronicles 23:3
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 3
    ordinal: 22849
    text: 'And all the congregation made a covenant with the king in the house of God. And he said unto them: ‘Behold, the king’s son shall reign, as the LORD hath spoken concerning the sons of David.'
    translation: JPS 1917
    original: וַיִּכְרֹת כָּל־הַקָּהָל בְּרִית בְּבֵית הָאֱלֹהִים עִם־הַמֶּלֶךְ וַיֹּאמֶר לָהֶם הִנֵּה בֶן־הַמֶּלֶךְ יִמְלֹךְ כַּאֲשֶׁר דִּבֶּר יְהוָה עַל־בְּנֵי דָוִיד׃
    hebrewPlain: ויכרת כל הקהל ברית בבית האלהים עם המלך ויאמר להם הנה בן המלך ימלך כאשר דבר יהוה על בני דויד
    kjvRefs:
    - 2 Chronicles 23:3
    kjvOsis:
    - 2Chr.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:4
    ref: 2 Chronicles 23:4
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 4
    ordinal: 22850
    text: 'This is the thing that ye shall do: a third part of you, that come in on the sabbath, of the priests and of the Levites, shall be porters of the doors;'
    translation: JPS 1917
    original: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ הַשְּׁלִשִׁית מִכֶּם בָּאֵי הַשַּׁבָּת לַכֹּהֲנִים וְלַלְוִיִּם לְשֹׁעֲרֵי הַסִּפִּים׃
    hebrewPlain: זה הדבר אשר תעשו השלשית מכם באי השבת לכהנים וללוים לשערי הספים
    kjvRefs:
    - 2 Chronicles 23:4
    kjvOsis:
    - 2Chr.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:5
    ref: 2 Chronicles 23:5
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 5
    ordinal: 22851
    text: and a third part shall be at the king’s house; and a third part at the gate of the foundation; and all the people shall be in the courts of the house of the LORD.
    translation: JPS 1917
    original: וְהַשְּׁלִשִׁית בְּבֵית הַמֶּלֶךְ וְהַשְּׁלִשִׁית בְּשַׁעַר הַיְסוֹד וְכָל־הָעָם בְּחַצְרוֹת בֵּית יְהוָה׃
    hebrewPlain: והשלשית בבית המלך והשלשית בשער היסוד וכל העם בחצרות בית יהוה
    kjvRefs:
    - 2 Chronicles 23:5
    kjvOsis:
    - 2Chr.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:6
    ref: 2 Chronicles 23:6
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 6
    ordinal: 22852
    text: But let none come into the house of the LORD, save the priests, and they that minister of the Levites; they shall come in, for they are holy; but all the people shall keep the charge of the LORD.
    translation: JPS 1917
    original: וְאַל־יָבוֹא בֵית־יְהוָה כִּי אִם־הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם הֵמָּה יָבֹאוּ כִּי־קֹדֶשׁ הֵמָּה וְכָל־הָעָם יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה׃
    hebrewPlain: ואל יבוא בית יהוה כי אם הכהנים והמשרתים ללוים המה יבאו כי קדש המה וכל העם ישמרו משמרת יהוה
    kjvRefs:
    - 2 Chronicles 23:6
    kjvOsis:
    - 2Chr.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:7
    ref: 2 Chronicles 23:7
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 7
    ordinal: 22853
    text: And the Levites shall compass the king round about, every man with his weapons in his hand; and whosoever cometh into the house, let him be slain; and be ye with the king when he cometh in, and when he goeth out.’
    translation: JPS 1917
    original: וְהִקִּיפוּ הַלְוִיִּם אֶת־הַמֶּלֶךְ סָבִיב אִישׁ וְכֵלָיו בְּיָדוֹ וְהַבָּא אֶל־הַבַּיִת יוּמָת וִהְיוּ אֶת־הַמֶּלֶךְ בְּבֹאוֹ וּבְצֵאתוֹ׃
    hebrewPlain: והקיפו הלוים את המלך סביב איש וכליו בידו והבא אל הבית יומת והיו את המלך בבאו ובצאתו
    kjvRefs:
    - 2 Chronicles 23:7
    kjvOsis:
    - 2Chr.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:8
    ref: 2 Chronicles 23:8
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 8
    ordinal: 22854
    text: So the Levites and all Judah did according to all that Jehoiada the priest commanded; and they took every man his men, those that were to come in on the sabbath, with those that were to go out on the sabbath; for Jehoiada the priest dismissed not the courses.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ הַלְוִיִּם וְכָל־יְהוּדָה כְּכֹל אֲשֶׁר־צִוָּה יְהוֹיָדָע הַכֹּהֵן וַיִּקְחוּ אִישׁ אֶת־אֲנָשָׁיו בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת כִּי לֹא פָטַר יְהוֹיָדָע הַכֹּהֵן אֶת־הַמַּחְלְקוֹת׃
    hebrewPlain: ויעשו הלוים וכל יהודה ככל אשר צוה יהוידע הכהן ויקחו איש את אנשיו באי השבת עם יוצאי השבת כי לא פטר יהוידע הכהן את המחלקות
    kjvRefs:
    - 2 Chronicles 23:8
    kjvOsis:
    - 2Chr.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:9
    ref: 2 Chronicles 23:9
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 9
    ordinal: 22855
    text: And Jehoiada the priest delivered to the captains of hundreds the spears, and bucklers, and shields, that had been king David’s, which were in the house of God.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוֹיָדָע הַכֹּהֵן לְשָׂרֵי הַמֵּאוֹת אֶת־הַחֲנִיתִים וְאֶת־הַמָּגִנּוֹת וְאֶת־הַשְּׁלָטִים אֲשֶׁר לַמֶּלֶךְ דָּוִיד אֲשֶׁר בֵּית הָאֱלֹהִים׃
    hebrewPlain: ויתן יהוידע הכהן לשרי המאות את החניתים ואת המגנות ואת השלטים אשר למלך דויד אשר בית האלהים
    kjvRefs:
    - 2 Chronicles 23:9
    kjvOsis:
    - 2Chr.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:10
    ref: 2 Chronicles 23:10
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 10
    ordinal: 22856
    text: And he set all the people, every man with his weapon in his hand, from the right side of the house to the left side of the house, along by the altar and the house, by the king round about.
    translation: JPS 1917
    original: וַיַּעֲמֵד אֶת־כָּל־הָעָם וְאִישׁ שִׁלְחוֹ בְיָדוֹ מִכֶּתֶף הַבַּיִת הַיְמָנִית עַד־כֶּתֶף הַבַּיִת הַשְּׂמָאלִית לַמִּזְבֵּחַ וְלַבָּיִת עַל־הַמֶּלֶךְ סָבִיב׃
    hebrewPlain: ויעמד את כל העם ואיש שלחו בידו מכתף הבית הימנית עד כתף הבית השמאלית למזבח ולבית על המלך סביב
    kjvRefs:
    - 2 Chronicles 23:10
    kjvOsis:
    - 2Chr.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:11
    ref: 2 Chronicles 23:11
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 11
    ordinal: 22857
    text: 'Then they brought out the king’s son, and put upon him the crown and the insignia, and made him king; and Jehoiada and his sons anointed him; and they said: ‘Long live the king.’'
    translation: JPS 1917
    original: וַיּוֹצִיאוּ אֶת־בֶּן־הַמֶּלֶךְ וַיִּתְּנוּ עָלָיו אֶת־הַנֵּזֶר וְאֶת־הָעֵדוּת וַיַּמְלִיכוּ אֹתוֹ וַיִּמְשָׁחֻהוּ יְהוֹיָדָע וּבָנָיו וַיֹּאמְרוּ יְחִי הַמֶּלֶךְ׃
    hebrewPlain: ויוציאו את בן המלך ויתנו עליו את הנזר ואת העדות וימליכו אתו וימשחהו יהוידע ובניו ויאמרו יחי המלך
    kjvRefs:
    - 2 Chronicles 23:11
    kjvOsis:
    - 2Chr.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:12
    ref: 2 Chronicles 23:12
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 12
    ordinal: 22858
    text: And when Athaliah heard the noise of the people running and praising the king, she came to the people into the house of the LORD;
    translation: JPS 1917
    original: וַתִּשְׁמַע עֲתַלְיָהוּ אֶת־קוֹל הָעָם הָרָצִים וְהַמְהַלְלִים אֶת־הַמֶּלֶךְ וַתָּבוֹא אֶל־הָעָם בֵּית יְהוָה׃
    hebrewPlain: ותשמע עתליהו את קול העם הרצים והמהללים את המלך ותבוא אל העם בית יהוה
    kjvRefs:
    - 2 Chronicles 23:12
    kjvOsis:
    - 2Chr.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:13
    ref: 2 Chronicles 23:13
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 13
    ordinal: 22859
    text: 'and she looked, and, behold, the king stood on his platform at the entrance, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew with trumpets; the singers also [played] on instruments of music, and led the singing of praise. Then Athaliah rent her clothes, and said: ‘Treason, treason.’'
    translation: JPS 1917
    original: וַתֵּרֶא וְהִנֵּה הַמֶּלֶךְ עוֹמֵד עַל־עַמּוּדוֹ בַּמָּבוֹא וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל־הַמֶּלֶךְ וְכָל־עַם הָאָרֶץ שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר וּמוֹדִיעִים לְהַלֵּל וַתִּקְרַע עֲתַלְיָהוּ אֶת־בְּגָדֶיהָ וַתֹּאמֶר קֶשֶׁר קָשֶׁר׃
    hebrewPlain: ותרא והנה המלך עומד על עמודו במבוא והשרים והחצצרות על המלך וכל עם הארץ שמח ותוקע בחצצרות והמשוררים בכלי השיר ומודיעים להלל ותקרע עתליהו את בגדיה ותאמר קשר קשר
    kjvRefs:
    - 2 Chronicles 23:13
    kjvOsis:
    - 2Chr.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:14
    ref: 2 Chronicles 23:14
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 14
    ordinal: 22860
    text: 'And Jehoiada the priest brought out the captains of hundreds that were set over the host, and said unto them: ‘Have her forth between the ranks; and whoso followeth her, let him be slain with the sword’; for the priest said: ‘Slay her not in the house of the LORD.’'
    translation: JPS 1917
    original: וַיּוֹצֵא יְהוֹיָדָע הַכֹּהֵן אֶת־שָׂרֵי הַמֵּאוֹת פְּקוּדֵי הַחַיִל וַיֹּאמֶר אֲלֵהֶם הוֹצִיאוּהָ אֶל־מִבֵּית הַשְּׂדֵרוֹת וְהַבָּא אַחֲרֶיהָ יוּמַת בֶּחָרֶב כִּי אָמַר הַכֹּהֵן לֹא תְמִיתוּהָ בֵּית יְהוָה׃
    hebrewPlain: ויוצא יהוידע הכהן את שרי המאות פקודי החיל ויאמר אלהם הוציאוה אל מבית השדרות והבא אחריה יומת בחרב כי אמר הכהן לא תמיתוה בית יהוה
    kjvRefs:
    - 2 Chronicles 23:14
    kjvOsis:
    - 2Chr.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:15
    ref: 2 Chronicles 23:15
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 15
    ordinal: 22861
    text: So they made way for her; and she went to the entry of the horse gate to the king’s house; and they slew her there.
    translation: JPS 1917
    original: וַיָּשִׂימוּ לָהּ יָדַיִם וַתָּבוֹא אֶל־מְבוֹא שַׁעַר־הַסּוּסִים בֵּית הַמֶּלֶךְ וַיְמִיתוּהָ שָׁם׃
    hebrewPlain: וישימו לה ידים ותבוא אל מבוא שער הסוסים בית המלך וימיתוה שם
    kjvRefs:
    - 2 Chronicles 23:15
    kjvOsis:
    - 2Chr.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:16
    ref: 2 Chronicles 23:16
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 16
    ordinal: 22862
    text: And Jehoiada made a covenant between himself, and all the people, and the king, that they should be the LORD’S people.
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוֹיָדָע בְּרִית בֵּינוֹ וּבֵין כָּל־הָעָם וּבֵין הַמֶּלֶךְ לִהְיוֹת לְעָם לַיהוָה׃
    hebrewPlain: ויכרת יהוידע ברית בינו ובין כל העם ובין המלך להיות לעם ליהוה
    kjvRefs:
    - 2 Chronicles 23:16
    kjvOsis:
    - 2Chr.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:17
    ref: 2 Chronicles 23:17
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 17
    ordinal: 22863
    text: And all the people went to the house of Baal, and broke it down, and broke his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.
    translation: JPS 1917
    original: וַיָּבֹאוּ כָל־הָעָם בֵּית־הַבַּעַל וַיִּתְּצֻהוּ וְאֶת־מִזְבְּחֹתָיו וְאֶת־צְלָמָיו שִׁבֵּרוּ וְאֵת מַתָּן כֹּהֵן הַבַּעַל הָרְגוּ לִפְנֵי הַמִּזְבְּחוֹת׃
    hebrewPlain: ויבאו כל העם בית הבעל ויתצהו ואת מזבחתיו ואת צלמיו שברו ואת מתן כהן הבעל הרגו לפני המזבחות
    kjvRefs:
    - 2 Chronicles 23:17
    kjvOsis:
    - 2Chr.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:18
    ref: 2 Chronicles 23:18
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 18
    ordinal: 22864
    text: And Jehoiada appointed the offices of the house of the LORD under the hand of the priests the Levites, whom David had distributed in the house of the LORD, to offer the burnt-offerings of the LORD, as it is written in the Law of Moses, with rejoicing and with singing, according to the direction of David.
    translation: JPS 1917
    original: וַיָּשֶׂם יְהוֹיָדָע פְּקֻדֹּת בֵּית יְהוָה בְּיַד הַכֹּהֲנִים הַלְוִיִּם אֲשֶׁר חָלַק דָּוִיד עַל־בֵּית יְהוָה לְהַעֲלוֹת עֹלוֹת יְהוָה כַּכָּתוּב בְּתוֹרַת מֹשֶׁה בְּשִׂמְחָה וּבְשִׁיר עַל יְדֵי דָוִיד׃
    hebrewPlain: וישם יהוידע פקדת בית יהוה ביד הכהנים הלוים אשר חלק דויד על בית יהוה להעלות עלות יהוה ככתוב בתורת משה בשמחה ובשיר על ידי דויד
    kjvRefs:
    - 2 Chronicles 23:18
    kjvOsis:
    - 2Chr.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:19
    ref: 2 Chronicles 23:19
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 19
    ordinal: 22865
    text: And he set the porters at the gates of the house of the LORD, that none that was unclean in any thing should enter in.
    translation: JPS 1917
    original: וַיַּעֲמֵד הַשּׁוֹעֲרִים עַל־שַׁעֲרֵי בֵּית יְהוָה וְלֹא־יָבֹא טָמֵא לְכָל־דָּבָר׃
    hebrewPlain: ויעמד השוערים על שערי בית יהוה ולא יבא טמא לכל דבר
    kjvRefs:
    - 2 Chronicles 23:19
    kjvOsis:
    - 2Chr.23.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:20
    ref: 2 Chronicles 23:20
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 20
    ordinal: 22866
    text: And he took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of the LORD; and they came through the upper gate unto the king’s house, and set the king upon the throne of the kingdom.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־שָׂרֵי הַמֵּאוֹת וְאֶת־הָאַדִּירִים וְאֶת־הַמּוֹשְׁלִים בָּעָם וְאֵת כָּל־עַם הָאָרֶץ וַיּוֹרֶד אֶת־הַמֶּלֶךְ מִבֵּית יְהוָה וַיָּבֹאוּ בְּתוֹךְ־שַׁעַר הָעֶלְיוֹן בֵּית הַמֶּלֶךְ וַיּוֹשִׁיבוּ אֶת־הַמֶּלֶךְ עַל כִּסֵּא הַמַּמְלָכָה׃
    hebrewPlain: ויקח את שרי המאות ואת האדירים ואת המושלים בעם ואת כל עם הארץ ויורד את המלך מבית יהוה ויבאו בתוך שער העליון בית המלך ויושיבו את המלך על כסא הממלכה
    kjvRefs:
    - 2 Chronicles 23:20
    kjvOsis:
    - 2Chr.23.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.23.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 23:21
    ref: 2 Chronicles 23:21
    book: 2Chr
    section: ketuvim
    chapter: 23
    verse: 21
    ordinal: 22867
    text: So all the people of the land rejoiced, and the city was quiet; and they slew Athaliah with the sword.
    translation: JPS 1917
    original: וַיִּשְׂמְחוּ כָל־עַם־הָאָרֶץ וְהָעִיר שָׁקָטָה וְאֶת־עֲתַלְיָהוּ הֵמִיתוּ בֶחָרֶב׃
    hebrewPlain: וישמחו כל עם הארץ והעיר שקטה ואת עתליהו המיתו בחרב
    kjvRefs:
    - 2 Chronicles 23:21
    kjvOsis:
    - 2Chr.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.23
- type: TanakhVerse
  data:
    osis: 2Chr.24.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:1
    ref: 2 Chronicles 24:1
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 1
    ordinal: 22868
    text: Joash was seven years old when he began to reign; and he reigned forty years in Jerusalem; and his mother’s name was Zibiah of Beer-sheba.
    translation: JPS 1917
    original: בֶּן־שֶׁבַע שָׁנִים יֹאָשׁ בְּמָלְכוֹ וְאַרְבָּעִים שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ צִבְיָה מִבְּאֵר שָׁבַע׃
    hebrewPlain: בן שבע שנים יאש במלכו וארבעים שנה מלך בירושלם ושם אמו צביה מבאר שבע
    kjvRefs:
    - 2 Chronicles 24:1
    kjvOsis:
    - 2Chr.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:2
    ref: 2 Chronicles 24:2
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 2
    ordinal: 22869
    text: And Joash did that which was right in the eyes of the LORD all the days of Jehoiada the priest.
    translation: JPS 1917
    original: וַיַּעַשׂ יוֹאָשׁ הַיָּשָׁר בְּעֵינֵי יְהוָה כָּל־יְמֵי יְהוֹיָדָע הַכֹּהֵן׃
    hebrewPlain: ויעש יואש הישר בעיני יהוה כל ימי יהוידע הכהן
    kjvRefs:
    - 2 Chronicles 24:2
    kjvOsis:
    - 2Chr.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:3
    ref: 2 Chronicles 24:3
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 3
    ordinal: 22870
    text: And Jehoiada took for him two wives; and he begot sons and daughters.
    translation: JPS 1917
    original: וַיִּשָּׂא־לוֹ יְהוֹיָדָע נָשִׁים שְׁתָּיִם וַיּוֹלֶד בָּנִים וּבָנוֹת׃
    hebrewPlain: וישא לו יהוידע נשים שתים ויולד בנים ובנות
    kjvRefs:
    - 2 Chronicles 24:3
    kjvOsis:
    - 2Chr.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:4
    ref: 2 Chronicles 24:4
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 4
    ordinal: 22871
    text: And it came to pass after this, that Joash was minded to restore the house of the LORD.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵיכֵן הָיָה עִם־לֵב יוֹאָשׁ לְחַדֵּשׁ אֶת־בֵּית יְהוָה׃
    hebrewPlain: ויהי אחריכן היה עם לב יואש לחדש את בית יהוה
    kjvRefs:
    - 2 Chronicles 24:4
    kjvOsis:
    - 2Chr.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:5
    ref: 2 Chronicles 24:5
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 5
    ordinal: 22872
    text: 'And he gathered together the priests and the Levites, and said to them: ‘Go out unto the cities of Judah, and gather of all Israel money to repair the house of your God from year to year, and see that ye hasten the matter.’ Howbeit the Levites hastened it not.'
    translation: JPS 1917
    original: וַיִּקְבֹּץ אֶת־הַכֹּהֲנִים וְהַלְוִיִּם וַיֹּאמֶר לָהֶם צְאוּ לְעָרֵי יְהוּדָה וְקִבְצוּ מִכָּל־יִשְׂרָאֵל כֶּסֶף לְחַזֵּק אֶת־בֵּית אֱלֹהֵיכֶם מִדֵּי שָׁנָה בְּשָׁנָה וְאַתֶּם תְּמַהֲרוּ לַדָּבָר וְלֹא מִהֲרוּ הַלְוִיִּם׃
    hebrewPlain: ויקבץ את הכהנים והלוים ויאמר להם צאו לערי יהודה וקבצו מכל ישראל כסף לחזק את בית אלהיכם מדי שנה בשנה ואתם תמהרו לדבר ולא מהרו הלוים
    kjvRefs:
    - 2 Chronicles 24:5
    kjvOsis:
    - 2Chr.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:6
    ref: 2 Chronicles 24:6
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 6
    ordinal: 22873
    text: 'And the king called for Jehoiada the chief, and unto him: ‘Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the tax of Moses the servant of the LORD, and of the congregation of Israel, for the tent of the testimony?’'
    translation: JPS 1917
    original: וַיִּקְרָא הַמֶּלֶךְ לִיהוֹיָדָע הָרֹאשׁ וַיֹּאמֶר לוֹ מַדּוּעַ לֹא־דָרַשְׁתָּ עַל־הַלְוִיִּם לְהָבִיא מִיהוּדָה וּמִירוּשָׁלִַם אֶת־מַשְׂאַת מֹשֶׁה עֶבֶד־יְהוָה וְהַקָּהָל לְיִשְׂרָאֵל לְאֹהֶל הָעֵדוּת׃
    hebrewPlain: ויקרא המלך ליהוידע הראש ויאמר לו מדוע לא דרשת על הלוים להביא מיהודה ומירושלם את משאת משה עבד יהוה והקהל לישראל לאהל העדות
    kjvRefs:
    - 2 Chronicles 24:6
    kjvOsis:
    - 2Chr.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:7
    ref: 2 Chronicles 24:7
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 7
    ordinal: 22874
    text: For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the hallowed things of the house of the LORD did they bestow upon the Baalim.
    translation: JPS 1917
    original: כִּי עֲתַלְיָהוּ הַמִּרְשַׁעַת בָּנֶיהָ פָרְצוּ אֶת־בֵּית הָאֱלֹהִים וְגַם כָּל־קָדְשֵׁי בֵית־יְהוָה עָשׂוּ לַבְּעָלִים׃
    hebrewPlain: כי עתליהו המרשעת בניה פרצו את בית האלהים וגם כל קדשי בית יהוה עשו לבעלים
    kjvRefs:
    - 2 Chronicles 24:7
    kjvOsis:
    - 2Chr.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:8
    ref: 2 Chronicles 24:8
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 8
    ordinal: 22875
    text: So the king commanded, and they made a chest, and set it without at the gate of the house of the LORD.
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ וַיַּעֲשׂוּ אֲרוֹן אֶחָד וַיִּתְּנֻהוּ בְּשַׁעַר בֵּית־יְהוָה חוּצָה׃
    hebrewPlain: ויאמר המלך ויעשו ארון אחד ויתנהו בשער בית יהוה חוצה
    kjvRefs:
    - 2 Chronicles 24:8
    kjvOsis:
    - 2Chr.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:9
    ref: 2 Chronicles 24:9
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 9
    ordinal: 22876
    text: And they made a proclamation through Judah and Jerusalem, to bring in for the LORD the tax that Moses the servant of God laid upon Israel in the wilderness.
    translation: JPS 1917
    original: וַיִּתְּנוּ־קוֹל בִּיהוּדָה וּבִירוּשָׁלִַם לְהָבִיא לַיהוָה מַשְׂאַת מֹשֶׁה עֶבֶד־הָאֱלֹהִים עַל־יִשְׂרָאֵל בַּמִּדְבָּר׃
    hebrewPlain: ויתנו קול ביהודה ובירושלם להביא ליהוה משאת משה עבד האלהים על ישראל במדבר
    kjvRefs:
    - 2 Chronicles 24:9
    kjvOsis:
    - 2Chr.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:10
    ref: 2 Chronicles 24:10
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 10
    ordinal: 22877
    text: And all the princes and all the people rejoiced, and brought in, and cast into the chest, until they had made an end.
    translation: JPS 1917
    original: וַיִּשְׂמְחוּ כָל־הַשָּׂרִים וְכָל־הָעָם וַיָּבִיאוּ וַיַּשְׁלִיכוּ לָאָרוֹן עַד־לְכַלֵּה׃
    hebrewPlain: וישמחו כל השרים וכל העם ויביאו וישליכו לארון עד לכלה
    kjvRefs:
    - 2 Chronicles 24:10
    kjvOsis:
    - 2Chr.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:11
    ref: 2 Chronicles 24:11
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 11
    ordinal: 22878
    text: And it was so, that at what time the chest was brought unto the king’s officers by the hand of the Levites, and when they saw that there was much money, the king’s scribe and the chief priest’s officer came and emptied the chest, and took it, and carried it back to its place. Thus they did day by day, and gathered money in abundance.
    translation: JPS 1917
    original: וַיְהִי בְּעֵת יָבִיא אֶת־הָאָרוֹן אֶל־פְּקֻדַּת הַמֶּלֶךְ בְּיַד הַלְוִיִּם וְכִרְאוֹתָם כִּי־רַב הַכֶּסֶף וּבָא סוֹפֵר הַמֶּלֶךְ וּפְקִיד כֹּהֵן הָרֹאשׁ וִיעָרוּ אֶת־הָאָרוֹן וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל־מְקֹמוֹ כֹּה עָשׂוּ לְיוֹם בְּיוֹם וַיַּאַסְפוּ־כֶסֶף לָרֹב׃
    hebrewPlain: ויהי בעת יביא את הארון אל פקדת המלך ביד הלוים וכראותם כי רב הכסף ובא סופר המלך ופקיד כהן הראש ויערו את הארון וישאהו וישיבהו אל מקמו כה עשו ליום ביום ויאספו כסף לרב
    kjvRefs:
    - 2 Chronicles 24:11
    kjvOsis:
    - 2Chr.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:12
    ref: 2 Chronicles 24:12
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 12
    ordinal: 22879
    text: And the king and Jehoiada gave it to such as did the work of the service of the house of the LORD; and they hired masons and carpenters to restore the house of the LORD, and also such as wrought iron and brass to repair the house of the LORD.
    translation: JPS 1917
    original: וַיִּתְּנֵהוּ הַמֶּלֶךְ וִיהוֹיָדָע אֶל־עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית־יְהוָה וַיִּהְיוּ שֹׂכְרִים חֹצְבִים וְחָרָשִׁים לְחַדֵּשׁ בֵּית יְהוָה וְגַם לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת לְחַזֵּק אֶת־בֵּית יְהוָה׃
    hebrewPlain: ויתנהו המלך ויהוידע אל עושה מלאכת עבודת בית יהוה ויהיו שכרים חצבים וחרשים לחדש בית יהוה וגם לחרשי ברזל ונחשת לחזק את בית יהוה
    kjvRefs:
    - 2 Chronicles 24:12
    kjvOsis:
    - 2Chr.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:13
    ref: 2 Chronicles 24:13
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 13
    ordinal: 22880
    text: So the workmen wrought, and the work was perfected by them, and they set up the house of God in its state, and strengthened it.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה וַתַּעַל אֲרוּכָה לַמְּלָאכָה בְּיָדָם וַיַּעֲמִידוּ אֶת־בֵּית הָאֱלֹהִים עַל־מַתְכֻּנְתּוֹ וַיְאַמְּצֻהוּ׃
    hebrewPlain: ויעשו עשי המלאכה ותעל ארוכה למלאכה בידם ויעמידו את בית האלהים על מתכנתו ויאמצהו
    kjvRefs:
    - 2 Chronicles 24:13
    kjvOsis:
    - 2Chr.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:14
    ref: 2 Chronicles 24:14
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 14
    ordinal: 22881
    text: And when they had made an end, they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of the LORD, even vessels wherewith to minister, and buckets, and pans, and vessels of gold and silver. And they offered burnt-offerings in the house of the LORD continually all the days of Jehoiada.
    translation: JPS 1917
    original: וּכְכַלּוֹתָם הֵבִיאוּ לִפְנֵי הַמֶּלֶךְ וִיהוֹיָדָע אֶת־שְׁאָר הַכֶּסֶף וַיַּעֲשֵׂהוּ כֵלִים לְבֵית־יְהוָה כְּלֵי שָׁרֵת וְהַעֲלוֹת וְכַפּוֹת וּכְלֵי זָהָב וָכָסֶף וַיִּהְיוּ מַעֲלִים עֹלוֹת בְּבֵית־יְהוָה תָּמִיד כֹּל יְמֵי יְהוֹיָדָע׃
    hebrewPlain: וככלותם הביאו לפני המלך ויהוידע את שאר הכסף ויעשהו כלים לבית יהוה כלי שרת והעלות וכפות וכלי זהב וכסף ויהיו מעלים עלות בבית יהוה תמיד כל ימי יהוידע
    kjvRefs:
    - 2 Chronicles 24:14
    kjvOsis:
    - 2Chr.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:15
    ref: 2 Chronicles 24:15
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 15
    ordinal: 22882
    text: But Jehoiada waxed old and was full of days, and he died; a hundred and thirty years old was he when he died.
    translation: JPS 1917
    original: וַיִּזְקַן יְהוֹיָדָע וַיִּשְׂבַּע יָמִים וַיָּמֹת בֶּן־מֵאָה וּשְׁלֹשִׁים שָׁנָה בְּמוֹתוֹ׃
    hebrewPlain: ויזקן יהוידע וישבע ימים וימת בן מאה ושלשים שנה במותו
    kjvRefs:
    - 2 Chronicles 24:15
    kjvOsis:
    - 2Chr.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:16
    ref: 2 Chronicles 24:16
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 16
    ordinal: 22883
    text: And they buried him in the city of David among the kings, because he had done good in Israel, and toward God and His house.
    translation: JPS 1917
    original: וַיִּקְבְּרֻהוּ בְעִיר־דָּוִיד עִם־הַמְּלָכִים כִּי־עָשָׂה טוֹבָה בְּיִשְׂרָאֵל וְעִם הָאֱלֹהִים וּבֵיתוֹ׃
    hebrewPlain: ויקברהו בעיר דויד עם המלכים כי עשה טובה בישראל ועם האלהים וביתו
    kjvRefs:
    - 2 Chronicles 24:16
    kjvOsis:
    - 2Chr.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:17
    ref: 2 Chronicles 24:17
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 17
    ordinal: 22884
    text: Now after the death of Jehoiada came the princes of Judah, and prostrated themselves before the king. Then the king hearkened unto them.
    translation: JPS 1917
    original: וְאַחֲרֵי מוֹת יְהוֹיָדָע בָּאוּ שָׂרֵי יְהוּדָה וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ אָז שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם׃
    hebrewPlain: ואחרי מות יהוידע באו שרי יהודה וישתחוו למלך אז שמע המלך אליהם
    kjvRefs:
    - 2 Chronicles 24:17
    kjvOsis:
    - 2Chr.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:18
    ref: 2 Chronicles 24:18
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 18
    ordinal: 22885
    text: And they forsook the house of the LORD, the God of their fathers, and served the Asherim and the idols; and wrath came upon Judah and Jerusalem for this their guiltiness.
    translation: JPS 1917
    original: וַיַּעַזְבוּ אֶת־בֵּית יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם וַיַּעַבְדוּ אֶת־הָאֲשֵׁרִים וְאֶת־הָעֲצַבִּים וַיְהִי־קֶצֶף עַל־יְהוּדָה וִירוּשָׁלִַם בְּאַשְׁמָתָם זֹאת׃
    hebrewPlain: ויעזבו את בית יהוה אלהי אבותיהם ויעבדו את האשרים ואת העצבים ויהי קצף על יהודה וירושלם באשמתם זאת
    kjvRefs:
    - 2 Chronicles 24:18
    kjvOsis:
    - 2Chr.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:19
    ref: 2 Chronicles 24:19
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 19
    ordinal: 22886
    text: Yet He sent prophets to them, to bring them back unto the LORD; and they admonished them, but they would not give ear.
    translation: JPS 1917
    original: וַיִּשְׁלַח בָּהֶם נְבִאִים לַהֲשִׁיבָם אֶל־יְהוָה וַיָּעִידוּ בָם וְלֹא הֶאֱזִינוּ׃
    hebrewPlain: וישלח בהם נבאים להשיבם אל יהוה ויעידו בם ולא האזינו
    kjvRefs:
    - 2 Chronicles 24:19
    kjvOsis:
    - 2Chr.24.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:20
    ref: 2 Chronicles 24:20
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 20
    ordinal: 22887
    text: 'And the spirit of God clothed Zechariah the son of Jehoiada the priest; and he stood above the people, and said unto them: ‘Thus saith God: Why transgress ye the commandments of the LORD, that ye cannot prosper? because ye have forsaken the LORD, He hath also forsaken you.’'
    translation: JPS 1917
    original: וְרוּחַ אֱלֹהִים לָבְשָׁה אֶת־זְכַרְיָה בֶּן־יְהוֹיָדָע הַכֹּהֵן וַיַּעֲמֹד מֵעַל לָעָם וַיֹּאמֶר לָהֶם כֹּה אָמַר הָאֱלֹהִים לָמָה אַתֶּם עֹבְרִים אֶת־מִצְוֺת יְהוָה וְלֹא תַצְלִיחוּ כִּי־עֲזַבְתֶּם אֶת־יְהוָה וַיַּעֲזֹב אֶתְכֶם׃
    hebrewPlain: ורוח אלהים לבשה את זכריה בן יהוידע הכהן ויעמד מעל לעם ויאמר להם כה אמר האלהים למה אתם עברים את מצות יהוה ולא תצליחו כי עזבתם את יהוה ויעזב אתכם
    kjvRefs:
    - 2 Chronicles 24:20
    kjvOsis:
    - 2Chr.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:21
    ref: 2 Chronicles 24:21
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 21
    ordinal: 22888
    text: And they conspired against him, and stoned him with stones at the commandment of the king in the court of the house of the LORD.
    translation: JPS 1917
    original: וַיִּקְשְׁרוּ עָלָיו וַיִּרְגְּמֻהוּ אֶבֶן בְּמִצְוַת הַמֶּלֶךְ בַּחֲצַר בֵּית יְהוָה׃
    hebrewPlain: ויקשרו עליו וירגמהו אבן במצות המלך בחצר בית יהוה
    kjvRefs:
    - 2 Chronicles 24:21
    kjvOsis:
    - 2Chr.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:22
    ref: 2 Chronicles 24:22
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 22
    ordinal: 22889
    text: 'Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said: ‘The LORD look upon it, and require it.’'
    translation: JPS 1917
    original: וְלֹא־זָכַר יוֹאָשׁ הַמֶּלֶךְ הַחֶסֶד אֲשֶׁר עָשָׂה יְהוֹיָדָע אָבִיו עִמּוֹ וַיַּהֲרֹג אֶת־בְּנוֹ וּכְמוֹתוֹ אָמַר יֵרֶא יְהוָה וְיִדְרֹשׁ׃
    hebrewPlain: ולא זכר יואש המלך החסד אשר עשה יהוידע אביו עמו ויהרג את בנו וכמותו אמר ירא יהוה וידרש
    kjvRefs:
    - 2 Chronicles 24:22
    kjvOsis:
    - 2Chr.24.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:23
    ref: 2 Chronicles 24:23
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 23
    ordinal: 22890
    text: And it came to pass, when the year was come about, that the army of the Arameans came up against him; and they came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them unto the king of Damascus.
    translation: JPS 1917
    original: וַיְהִי לִתְקוּפַת הַשָּׁנָה עָלָה עָלָיו חֵיל אֲרָם וַיָּבֹאוּ אֶל־יְהוּדָה וִירוּשָׁלִַם וַיַּשְׁחִיתוּ אֶת־כָּל־שָׂרֵי הָעָם מֵעָם וְכָל־שְׁלָלָם שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק׃
    hebrewPlain: ויהי לתקופת השנה עלה עליו חיל ארם ויבאו אל יהודה וירושלם וישחיתו את כל שרי העם מעם וכל שללם שלחו למלך דרמשק
    kjvRefs:
    - 2 Chronicles 24:23
    kjvOsis:
    - 2Chr.24.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:24
    ref: 2 Chronicles 24:24
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 24
    ordinal: 22891
    text: For the army of the Arameans came with a small company of men; and the LORD delivered a very great host into their hand, because they had forsaken the LORD, the God of their fathers. So they executed judgment upon Joash.
    translation: JPS 1917
    original: כִּי בְמִצְעַר אֲנָשִׁים בָּאוּ חֵיל אֲרָם וַיהוָה נָתַן בְּיָדָם חַיִל לָרֹב מְאֹד כִּי עָזְבוּ אֶת־יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם וְאֶת־יוֹאָשׁ עָשׂוּ שְׁפָטִים׃
    hebrewPlain: כי במצער אנשים באו חיל ארם ויהוה נתן בידם חיל לרב מאד כי עזבו את יהוה אלהי אבותיהם ואת יואש עשו שפטים
    kjvRefs:
    - 2 Chronicles 24:24
    kjvOsis:
    - 2Chr.24.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:25
    ref: 2 Chronicles 24:25
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 25
    ordinal: 22892
    text: And when they were departed from him—for they left him in great diseases—his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died; and they buried him in the city of David, but they buried him not in the sepulchres of the kings.
    translation: JPS 1917
    original: וּבְלֶכְתָּם מִמֶּנּוּ כִּי־עָזְבוּ אֹתוֹ במחליים [בְּמַחֲלוּיִם] רַבִּים הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן וַיַּהַרְגֻהוּ עַל־מִטָּתוֹ וַיָּמֹת וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים׃
    hebrewPlain: ובלכתם ממנו כי עזבו אתו במחליים [במחלוים] רבים התקשרו עליו עבדיו בדמי בני יהוידע הכהן ויהרגהו על מטתו וימת ויקברהו בעיר דויד ולא קברהו בקברות המלכים
    kjvRefs:
    - 2 Chronicles 24:25
    kjvOsis:
    - 2Chr.24.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:26
    ref: 2 Chronicles 24:26
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 26
    ordinal: 22893
    text: 'And these are they that conspired against him: Zabad the son of Shimeath the Ammonitess, and Jehozabad the son of Shimrith the Moabitess.'
    translation: JPS 1917
    original: וְאֵלֶּה הַמִּתְקַשְּׁרִים עָלָיו זָבָד בֶּן־שִׁמְעָת הָעַמּוֹנִית וִיהוֹזָבָד בֶּן־שִׁמְרִית הַמּוֹאָבִית׃
    hebrewPlain: ואלה המתקשרים עליו זבד בן שמעת העמונית ויהוזבד בן שמרית המואבית
    kjvRefs:
    - 2 Chronicles 24:26
    kjvOsis:
    - 2Chr.24.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.24.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 24:27
    ref: 2 Chronicles 24:27
    book: 2Chr
    section: ketuvim
    chapter: 24
    verse: 27
    ordinal: 22894
    text: Now concerning his sons, and the multitude of the burdens against him, and the rebuilding of the house of God, behold, they are written in the commentary of the book of the kings. And Amaziah his son reigned in his stead.
    translation: JPS 1917
    original: וּבָנָיו ורב [יִרֶב] הַמַּשָּׂא עָלָיו וִיסוֹד בֵּית הָאֱלֹהִים הִנָּם כְּתוּבִים עַל־מִדְרַשׁ סֵפֶר הַמְּלָכִים וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: ובניו ורב [ירב] המשא עליו ויסוד בית האלהים הנם כתובים על מדרש ספר המלכים וימלך אמציהו בנו תחתיו
    kjvRefs:
    - 2 Chronicles 24:27
    kjvOsis:
    - 2Chr.24.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.24
- type: TanakhVerse
  data:
    osis: 2Chr.25.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:1
    ref: 2 Chronicles 25:1
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 1
    ordinal: 22895
    text: Amaziah was twenty and five years old when he began to reign; and he reigned twenty and nine years in Jerusalem; and his mother’s name was Jehoaddan of Jerusalem.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ אֲמַצְיָהוּ וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יְהוֹעַדָּן מִירוּשָׁלָיִם׃
    hebrewPlain: בן עשרים וחמש שנה מלך אמציהו ועשרים ותשע שנה מלך בירושלם ושם אמו יהועדן מירושלים
    kjvRefs:
    - 2 Chronicles 25:1
    kjvOsis:
    - 2Chr.25.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:2
    ref: 2 Chronicles 25:2
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 2
    ordinal: 22896
    text: And he did that which was right in the eyes of the LORD, but not with a whole heart.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה רַק לֹא בְּלֵבָב שָׁלֵם׃
    hebrewPlain: ויעש הישר בעיני יהוה רק לא בלבב שלם
    kjvRefs:
    - 2 Chronicles 25:2
    kjvOsis:
    - 2Chr.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:3
    ref: 2 Chronicles 25:3
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 3
    ordinal: 22897
    text: Now it came to pass, when the kingdom was established unto him, that he slew his servants who had killed the king his father.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר חָזְקָה הַמַּמְלָכָה עָלָיו וַיַּהֲרֹג אֶת־עֲבָדָיו הַמַּכִּים אֶת־הַמֶּלֶךְ אָבִיו׃
    hebrewPlain: ויהי כאשר חזקה הממלכה עליו ויהרג את עבדיו המכים את המלך אביו
    kjvRefs:
    - 2 Chronicles 25:3
    kjvOsis:
    - 2Chr.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:4
    ref: 2 Chronicles 25:4
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 4
    ordinal: 22898
    text: 'But he put not their children to death, but did according to that which is written in the law in the book of Moses, as the LORD commanded, saying: ‘The fathers shall not die for the children, neither shall the children die for the fathers; but every man shall die for his own sin.’'
    translation: JPS 1917
    original: וְאֶת־בְּנֵיהֶם לֹא הֵמִית כִּי כַכָּתוּב בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה אֲשֶׁר־צִוָּה יְהוָה לֵאמֹר לֹא־יָמוּתוּ אָבוֹת עַל־בָּנִים וּבָנִים לֹא־יָמוּתוּ עַל־אָבוֹת כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ׃
    hebrewPlain: ואת בניהם לא המית כי ככתוב בתורה בספר משה אשר צוה יהוה לאמר לא ימותו אבות על בנים ובנים לא ימותו על אבות כי איש בחטאו ימותו
    kjvRefs:
    - 2 Chronicles 25:4
    kjvOsis:
    - 2Chr.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:5
    ref: 2 Chronicles 25:5
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 5
    ordinal: 22899
    text: Moreover Amaziah gathered Judah together, and ordered them according to their fathers’ houses, under captains of thousands and captains of hundreds, even all Judah and Benjamin; and he numbered them from twenty years old and upward, and found them three hundred thousand chosen men, able to go forth to war, that could handle spear and shield.
    translation: JPS 1917
    original: וַיִּקְבֹּץ אֲמַצְיָהוּ אֶת־יְהוּדָה וַיַּעֲמִידֵם לְבֵית־אָבוֹת לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת לְכָל־יְהוּדָה וּבִנְיָמִן וַיִּפְקְדֵם לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה וַיִּמְצָאֵם שְׁלֹשׁ־מֵאוֹת אֶלֶף בָּחוּר יוֹצֵא צָבָא אֹחֵז רֹמַח וְצִנָּה׃
    hebrewPlain: ויקבץ אמציהו את יהודה ויעמידם לבית אבות לשרי האלפים ולשרי המאות לכל יהודה ובנימן ויפקדם למבן עשרים שנה ומעלה וימצאם שלש מאות אלף בחור יוצא צבא אחז רמח וצנה
    kjvRefs:
    - 2 Chronicles 25:5
    kjvOsis:
    - 2Chr.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:6
    ref: 2 Chronicles 25:6
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 6
    ordinal: 22900
    text: He hired also a hundred thousand mighty men of valour out of Israel for a hundred talents of silver.
    translation: JPS 1917
    original: וַיִּשְׂכֹּר מִיִּשְׂרָאֵל מֵאָה אֶלֶף גִּבּוֹר חָיִל בְּמֵאָה כִכַּר־כָּסֶף׃
    hebrewPlain: וישכר מישראל מאה אלף גבור חיל במאה ככר כסף
    kjvRefs:
    - 2 Chronicles 25:6
    kjvOsis:
    - 2Chr.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:7
    ref: 2 Chronicles 25:7
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 7
    ordinal: 22901
    text: 'But there came a man of God to him, saying: ‘O king, let not the army of Israel go with thee; for the LORD is not with Israel, even with all the children of Ephraim.'
    translation: JPS 1917
    original: וְאִישׁ הָאֱלֹהִים בָּא אֵלָיו לֵאמֹר הַמֶּלֶךְ אַל־יָבֹא עִמְּךָ צְבָא יִשְׂרָאֵל כִּי אֵין יְהוָה עִם־יִשְׂרָאֵל כֹּל בְּנֵי אֶפְרָיִם׃
    hebrewPlain: ואיש האלהים בא אליו לאמר המלך אל יבא עמך צבא ישראל כי אין יהוה עם ישראל כל בני אפרים
    kjvRefs:
    - 2 Chronicles 25:7
    kjvOsis:
    - 2Chr.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:8
    ref: 2 Chronicles 25:8
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 8
    ordinal: 22902
    text: But if thou wilt go, and do engage never so valiantly in battle, God will cast thee down before the enemy; for God hath power to help, and to cast down.’
    translation: JPS 1917
    original: כִּי אִם־בֹּא אַתָּה עֲשֵׂה חֲזַק לַמִּלְחָמָה יַכְשִׁילְךָ הָאֱלֹהִים לִפְנֵי אוֹיֵב כִּי יֶשׁ־כֹּחַ בֵּאלֹהִים לַעְזוֹר וּלְהַכְשִׁיל׃
    hebrewPlain: כי אם בא אתה עשה חזק למלחמה יכשילך האלהים לפני אויב כי יש כח באלהים לעזור ולהכשיל
    kjvRefs:
    - 2 Chronicles 25:8
    kjvOsis:
    - 2Chr.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:9
    ref: 2 Chronicles 25:9
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 9
    ordinal: 22903
    text: 'And Amaziah said to the man of God: ‘But what shall we do for the hundred talents which I have given to the army of Israel?’ And the man of God answered: ‘The LORD is able to give thee much more than this.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲמַצְיָהוּ לְאִישׁ הָאֱלֹהִים וּמַה־לַּעֲשׂוֹת לִמְאַת הַכִּכָּר אֲשֶׁר נָתַתִּי לִגְדוּד יִשְׂרָאֵל וַיֹּאמֶר אִישׁ הָאֱלֹהִים יֵשׁ לַיהוָה לָתֶת לְךָ הַרְבֵּה מִזֶּה׃
    hebrewPlain: ויאמר אמציהו לאיש האלהים ומה לעשות למאת הככר אשר נתתי לגדוד ישראל ויאמר איש האלהים יש ליהוה לתת לך הרבה מזה
    kjvRefs:
    - 2 Chronicles 25:9
    kjvOsis:
    - 2Chr.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:10
    ref: 2 Chronicles 25:10
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 10
    ordinal: 22904
    text: Then Amaziah separated them, to wit, the army that was come to him out of Ephraim, to go back home; wherefore their anger was greatly kindled against Judah, and they returned home in fierce anger.
    translation: JPS 1917
    original: וַיַּבְדִּילֵם אֲמַצְיָהוּ לְהַגְּדוּד אֲשֶׁר־בָּא אֵלָיו מֵאֶפְרַיִם לָלֶכֶת לִמְקוֹמָם וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה וַיָּשׁוּבוּ לִמְקוֹמָם בָּחֳרִי־אָף׃
    hebrewPlain: ויבדילם אמציהו להגדוד אשר בא אליו מאפרים ללכת למקומם ויחר אפם מאד ביהודה וישובו למקומם בחרי אף
    kjvRefs:
    - 2 Chronicles 25:10
    kjvOsis:
    - 2Chr.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:11
    ref: 2 Chronicles 25:11
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 11
    ordinal: 22905
    text: And Amaziah took courage, and led forth his people, and went to the Valley of Salt, and smote of the children of Seir ten thousand.
    translation: JPS 1917
    original: וַאֲמַצְיָהוּ הִתְחַזַּק וַיִּנְהַג אֶת־עַמּוֹ וַיֵּלֶךְ גֵּיא הַמֶּלַח וַיַּךְ אֶת־בְּנֵי־שֵׂעִיר עֲשֶׂרֶת אֲלָפִים׃
    hebrewPlain: ואמציהו התחזק וינהג את עמו וילך גיא המלח ויך את בני שעיר עשרת אלפים
    kjvRefs:
    - 2 Chronicles 25:11
    kjvOsis:
    - 2Chr.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:12
    ref: 2 Chronicles 25:12
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 12
    ordinal: 22906
    text: And other ten thousand did the children of Judah carry away alive, and brought them unto the top of the Rock, and cast them down from the top of the Rock, that they all were broken in pieces.
    translation: JPS 1917
    original: וַעֲשֶׂרֶת אֲלָפִים חַיִּים שָׁבוּ בְּנֵי יְהוּדָה וַיְבִיאוּם לְרֹאשׁ הַסָּלַע וַיַּשְׁלִיכוּם מֵרֹאשׁ־הַסֶּלַע וְכֻלָּם נִבְקָעוּ׃
    hebrewPlain: ועשרת אלפים חיים שבו בני יהודה ויביאום לראש הסלע וישליכום מראש הסלע וכלם נבקעו
    kjvRefs:
    - 2 Chronicles 25:12
    kjvOsis:
    - 2Chr.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:13
    ref: 2 Chronicles 25:13
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 13
    ordinal: 22907
    text: But the men of the army whom Amaziah sent back, that they should not go with him to battle, fell upon the cities of Judah, from Samaria even unto Beth-horon, and smote of them three thousand, and took much spoil.
    translation: JPS 1917
    original: וּבְנֵי הַגְּדוּד אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה וַיִּפְשְׁטוּ בְּעָרֵי יְהוּדָה מִשֹּׁמְרוֹן וְעַד־בֵּית חוֹרוֹן וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים וַיָּבֹזּוּ בִּזָּה רַבָּה׃
    hebrewPlain: ובני הגדוד אשר השיב אמציהו מלכת עמו למלחמה ויפשטו בערי יהודה משמרון ועד בית חורון ויכו מהם שלשת אלפים ויבזו בזה רבה
    kjvRefs:
    - 2 Chronicles 25:13
    kjvOsis:
    - 2Chr.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:14
    ref: 2 Chronicles 25:14
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 14
    ordinal: 22908
    text: Now it came to pass, after that Amaziah was come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up to be his gods, and prostrated himself before them, and offered unto them.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי בוֹא אֲמַצְיָהוּ מֵהַכּוֹת אֶת־אֲדוֹמִים וַיָּבֵא אֶת־אֱלֹהֵי בְּנֵי שֵׂעִיר וַיַּעֲמִידֵם לוֹ לֵאלֹהִים וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה וְלָהֶם יְקַטֵּר׃
    hebrewPlain: ויהי אחרי בוא אמציהו מהכות את אדומים ויבא את אלהי בני שעיר ויעמידם לו לאלהים ולפניהם ישתחוה ולהם יקטר
    kjvRefs:
    - 2 Chronicles 25:14
    kjvOsis:
    - 2Chr.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:15
    ref: 2 Chronicles 25:15
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 15
    ordinal: 22909
    text: 'Wherefore the anger of the LORD was kindled against Amaziah, and He sent unto him a prophet, who said unto him: ‘Why hast thou sought after the gods of the people, which have not delivered their own people out of thy hand?’'
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בַּאֲמַצְיָהוּ וַיִּשְׁלַח אֵלָיו נָבִיא וַיֹּאמֶר לוֹ לָמָּה דָרַשְׁתָּ אֶת־אֱלֹהֵי הָעָם אֲשֶׁר לֹא־הִצִּילוּ אֶת־עַמָּם מִיָּדֶךָ׃
    hebrewPlain: ויחר אף יהוה באמציהו וישלח אליו נביא ויאמר לו למה דרשת את אלהי העם אשר לא הצילו את עמם מידך
    kjvRefs:
    - 2 Chronicles 25:15
    kjvOsis:
    - 2Chr.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:16
    ref: 2 Chronicles 25:16
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 16
    ordinal: 22910
    text: 'And it came to pass, as he talked with him, that [the king] said unto him: ‘Have we made thee of the king’s counsel? forbear; why shouldest thou be smitten?’ Then the prophet forbore, and said: ‘I know that God hath determined to destroy thee, because thou hast done this, and hast not hearkened unto my counsel.’'
    translation: JPS 1917
    original: וַיְהִי בְּדַבְּרוֹ אֵלָיו וַיֹּאמֶר לוֹ הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ חֲדַל־לְךָ לָמָּה יַכּוּךָ וַיֶּחְדַּל הַנָּבִיא וַיֹּאמֶר יָדַעְתִּי כִּי־יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ כִּי־עָשִׂיתָ זֹּאת וְלֹא שָׁמַעְתָּ לַעֲצָתִי׃
    hebrewPlain: ויהי בדברו אליו ויאמר לו הליועץ למלך נתנוך חדל לך למה יכוך ויחדל הנביא ויאמר ידעתי כי יעץ אלהים להשחיתך כי עשית זאת ולא שמעת לעצתי
    kjvRefs:
    - 2 Chronicles 25:16
    kjvOsis:
    - 2Chr.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:17
    ref: 2 Chronicles 25:17
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 17
    ordinal: 22911
    text: 'Then Amaziah king of Judah took advice, and sent to Joash, the son of Jehoahaz the son of Jehu, king of Israel, saying: ‘Come, let us look one another in the face.’'
    translation: JPS 1917
    original: וַיִּוָּעַץ אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה וַיִּשְׁלַח אֶל־יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל לֵאמֹר לך [לְכָה] נִתְרָאֶה פָנִים׃
    hebrewPlain: ויועץ אמציהו מלך יהודה וישלח אל יואש בן יהואחז בן יהוא מלך ישראל לאמר לך [לכה] נתראה פנים
    kjvRefs:
    - 2 Chronicles 25:17
    kjvOsis:
    - 2Chr.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:18
    ref: 2 Chronicles 25:18
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 18
    ordinal: 22912
    text: 'And Joash king of Israel sent to Amaziah king of Judah, saying: ‘The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying: Give thy daughter to my son to wife; and there passed by the wild beasts that were in Lebanon, and trod down the thistle.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל אֶל־אֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה לֵאמֹר הַחוֹחַ אֲשֶׁר בַּלְּבָנוֹן שָׁלַח אֶל־הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן לֵאמֹר תְּנָה־אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה וַתַּעֲבֹר חַיַּת הַשָּׂדֶה אֲשֶׁר בַּלְּבָנוֹן וַתִּרְמֹס אֶת־הַחוֹחַ׃
    hebrewPlain: וישלח יואש מלך ישראל אל אמציהו מלך יהודה לאמר החוח אשר בלבנון שלח אל הארז אשר בלבנון לאמר תנה את בתך לבני לאשה ותעבר חית השדה אשר בלבנון ותרמס את החוח
    kjvRefs:
    - 2 Chronicles 25:18
    kjvOsis:
    - 2Chr.25.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:19
    ref: 2 Chronicles 25:19
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 19
    ordinal: 22913
    text: Thou sayest—lo, thou hast smitten Edom; will thy heart therefore lift thee up to glory therein? abide now at home; why shouldest thou meddle with evil, that thou shouldest fall, even thou, and Judah with thee?’
    translation: JPS 1917
    original: אָמַרְתָּ הִנֵּה הִכִּיתָ אֶת־אֱדוֹם וּנְשָׂאֲךָ לִבְּךָ לְהַכְבִּיד עַתָּה שְׁבָה בְּבֵיתֶךָ לָמָּה תִתְגָּרֶה בְּרָעָה וְנָפַלְתָּ אַתָּה וִיהוּדָה עִמָּךְ׃
    hebrewPlain: אמרת הנה הכית את אדום ונשאך לבך להכביד עתה שבה בביתך למה תתגרה ברעה ונפלת אתה ויהודה עמך
    kjvRefs:
    - 2 Chronicles 25:19
    kjvOsis:
    - 2Chr.25.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:20
    ref: 2 Chronicles 25:20
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 20
    ordinal: 22914
    text: But Amaziah would not hear; for it was of God, that He might deliver them into the hand [of their enemies], because they had sought after the gods of Edom.
    translation: JPS 1917
    original: וְלֹא־שָׁמַע אֲמַצְיָהוּ כִּי מֵהָאֱלֹהִים הִיא לְמַעַן תִּתָּם בְּיָד כִּי דָרְשׁוּ אֵת אֱלֹהֵי אֱדוֹם׃
    hebrewPlain: ולא שמע אמציהו כי מהאלהים היא למען תתם ביד כי דרשו את אלהי אדום
    kjvRefs:
    - 2 Chronicles 25:20
    kjvOsis:
    - 2Chr.25.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:21
    ref: 2 Chronicles 25:21
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 21
    ordinal: 22915
    text: So Joash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at Beth-shemesh, which belongeth to Judah.
    translation: JPS 1917
    original: וַיַּעַל יוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל וַיִּתְרָאוּ פָנִים הוּא וַאֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה בְּבֵית שֶׁמֶשׁ אֲשֶׁר לִיהוּדָה׃
    hebrewPlain: ויעל יואש מלך ישראל ויתראו פנים הוא ואמציהו מלך יהודה בבית שמש אשר ליהודה
    kjvRefs:
    - 2 Chronicles 25:21
    kjvOsis:
    - 2Chr.25.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:22
    ref: 2 Chronicles 25:22
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 22
    ordinal: 22916
    text: And Judah was put to the worse before Israel; and they fled every man to his tent.
    translation: JPS 1917
    original: וַיִּנָּגֶף יְהוּדָה לִפְנֵי יִשְׂרָאֵל וַיָּנֻסוּ אִישׁ לְאֹהָלָיו׃
    hebrewPlain: וינגף יהודה לפני ישראל וינסו איש לאהליו
    kjvRefs:
    - 2 Chronicles 25:22
    kjvOsis:
    - 2Chr.25.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:23
    ref: 2 Chronicles 25:23
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 23
    ordinal: 22917
    text: And Joash king of Israel took Amaziah king of Judah, the son of Joash, the son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem, and broke down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.
    translation: JPS 1917
    original: וְאֵת אֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה בֶּן־יוֹאָשׁ בֶּן־יְהוֹאָחָז תָּפַשׂ יוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל בְּבֵית שָׁמֶשׁ וַיְבִיאֵהוּ יְרוּשָׁלִַם וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם מִשַּׁעַר אֶפְרַיִם עַד־שַׁעַר הַפּוֹנֶה אַרְבַּע מֵאוֹת אַמָּה׃
    hebrewPlain: ואת אמציהו מלך יהודה בן יואש בן יהואחז תפש יואש מלך ישראל בבית שמש ויביאהו ירושלם ויפרץ בחומת ירושלם משער אפרים עד שער הפונה ארבע מאות אמה
    kjvRefs:
    - 2 Chronicles 25:23
    kjvOsis:
    - 2Chr.25.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:24
    ref: 2 Chronicles 25:24
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 24
    ordinal: 22918
    text: And [he took] all the gold and silver, and all the vessels that were found in the house of God with Obed-edom, and the treasures of the king’s house, the hostages also, and returned to Samaria.
    translation: JPS 1917
    original: וְכָל־הַזָּהָב וְהַכֶּסֶף וְאֵת כָּל־הַכֵּלִים הַנִּמְצְאִים בְּבֵית־הָאֱלֹהִים עִם־עֹבֵד אֱדוֹם וְאֶת־אֹצְרוֹת בֵּית הַמֶּלֶךְ וְאֵת בְּנֵי הַתַּעֲרֻבוֹת וַיָּשָׁב שֹׁמְרוֹן׃
    hebrewPlain: וכל הזהב והכסף ואת כל הכלים הנמצאים בבית האלהים עם עבד אדום ואת אצרות בית המלך ואת בני התערבות וישב שמרון
    kjvRefs:
    - 2 Chronicles 25:24
    kjvOsis:
    - 2Chr.25.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:25
    ref: 2 Chronicles 25:25
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 25
    ordinal: 22919
    text: And Amaziah the son of Joash king of Judah lived after the death of Joash son of Jehoahaz king of Israel fifteen years.
    translation: JPS 1917
    original: וַיְחִי אֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה אַחֲרֵי מוֹת יוֹאָשׁ בֶּן־יְהוֹאָחָז מֶלֶךְ יִשְׂרָאֵל חֲמֵשׁ עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: ויחי אמציהו בן יואש מלך יהודה אחרי מות יואש בן יהואחז מלך ישראל חמש עשרה שנה
    kjvRefs:
    - 2 Chronicles 25:25
    kjvOsis:
    - 2Chr.25.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:26
    ref: 2 Chronicles 25:26
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 26
    ordinal: 22920
    text: Now the rest of the acts of Amaziah, first and last, behold, are they not written in the book of the kings of Judah and Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ הָרִאשֹׁנִים וְהָאַחֲרוֹנִים הֲלֹא הִנָּם כְּתוּבִים עַל־סֵפֶר מַלְכֵי־יְהוּדָה וְיִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי אמציהו הראשנים והאחרונים הלא הנם כתובים על ספר מלכי יהודה וישראל
    kjvRefs:
    - 2 Chronicles 25:26
    kjvOsis:
    - 2Chr.25.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:27
    ref: 2 Chronicles 25:27
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 27
    ordinal: 22921
    text: Now from the time that Amaziah did turn away from following the LORD they made a conspiracy against him in Jerusalem; and he fled to Lachish; but they sent after him to Lachish, and slew him there.
    translation: JPS 1917
    original: וּמֵעֵת אֲשֶׁר־סָר אֲמַצְיָהוּ מֵאַחֲרֵי יְהוָה וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר בִּירוּשָׁלִַם וַיָּנָס לָכִישָׁה וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה וַיְמִיתֻהוּ שָׁם׃
    hebrewPlain: ומעת אשר סר אמציהו מאחרי יהוה ויקשרו עליו קשר בירושלם וינס לכישה וישלחו אחריו לכישה וימיתהו שם
    kjvRefs:
    - 2 Chronicles 25:27
    kjvOsis:
    - 2Chr.25.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.25.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 25:28
    ref: 2 Chronicles 25:28
    book: 2Chr
    section: ketuvim
    chapter: 25
    verse: 28
    ordinal: 22922
    text: And they brought him upon horses, and buried him with his fathers in the city of Judah.
    translation: JPS 1917
    original: וַיִּשָּׂאֻהוּ עַל־הַסּוּסִים וַיִּקְבְּרוּ אֹתוֹ עִם־אֲבֹתָיו בְּעִיר יְהוּדָה׃
    hebrewPlain: וישאהו על הסוסים ויקברו אתו עם אבתיו בעיר יהודה
    kjvRefs:
    - 2 Chronicles 25:28
    kjvOsis:
    - 2Chr.25.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.25
- type: TanakhVerse
  data:
    osis: 2Chr.26.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:1
    ref: 2 Chronicles 26:1
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 1
    ordinal: 22923
    text: And all the people of Judah took Uzziah, who was sixteen years old, and made him king in the room of his father Amaziah.
    translation: JPS 1917
    original: וַיִּקְחוּ כָּל־עַם יְהוּדָה אֶת־עֻזִּיָּהוּ וְהוּא בֶּן־שֵׁשׁ עֶשְׂרֵה שָׁנָה וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו אֲמַצְיָהוּ׃
    hebrewPlain: ויקחו כל עם יהודה את עזיהו והוא בן שש עשרה שנה וימליכו אתו תחת אביו אמציהו
    kjvRefs:
    - 2 Chronicles 26:1
    kjvOsis:
    - 2Chr.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:2
    ref: 2 Chronicles 26:2
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 2
    ordinal: 22924
    text: He built Eloth, and restored it to Judah, after that the king slept with his fathers.
    translation: JPS 1917
    original: הוּא בָּנָה אֶת־אֵילוֹת וַיְשִׁיבֶהָ לִיהוּדָה אַחֲרֵי שְׁכַב־הַמֶּלֶךְ עִם־אֲבֹתָיו׃
    hebrewPlain: הוא בנה את אילות וישיבה ליהודה אחרי שכב המלך עם אבתיו
    kjvRefs:
    - 2 Chronicles 26:2
    kjvOsis:
    - 2Chr.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:3
    ref: 2 Chronicles 26:3
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 3
    ordinal: 22925
    text: Sixteen years old was Uzziah when he began to reign; and he reigned fifty and two years in Jerusalem; and his mother’s name was Jecoliah of Jerusalem.
    translation: JPS 1917
    original: בֶּן־שֵׁשׁ עֶשְׂרֵה שָׁנָה עֻזִּיָּהוּ בְמָלְכוֹ וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יכיליה [יְכָלְיָה] מִן־יְרוּשָׁלִָם׃
    hebrewPlain: בן שש עשרה שנה עזיהו במלכו וחמשים ושתים שנה מלך בירושלם ושם אמו יכיליה [יכליה] מן ירושלם
    kjvRefs:
    - 2 Chronicles 26:3
    kjvOsis:
    - 2Chr.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:4
    ref: 2 Chronicles 26:4
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 4
    ordinal: 22926
    text: And he did that, which was right in the eyes of the LORD, according to all that his father Amaziah had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה אֲמַצְיָהוּ אָבִיו׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה אמציהו אביו
    kjvRefs:
    - 2 Chronicles 26:4
    kjvOsis:
    - 2Chr.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:5
    ref: 2 Chronicles 26:5
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 5
    ordinal: 22927
    text: And he set himself to seek God in the days of Zechariah, who had understanding in the vision of God; and as long as he sought the LORD, God made him to prosper.
    translation: JPS 1917
    original: וַיְהִי לִדְרֹשׁ אֱלֹהִים בִּימֵי זְכַרְיָהוּ הַמֵּבִין בִּרְאֹת הָאֱלֹהִים וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה הִצְלִיחוֹ הָאֱלֹהִים׃
    hebrewPlain: ויהי לדרש אלהים בימי זכריהו המבין בראת האלהים ובימי דרשו את יהוה הצליחו האלהים
    kjvRefs:
    - 2 Chronicles 26:5
    kjvOsis:
    - 2Chr.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:6
    ref: 2 Chronicles 26:6
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 6
    ordinal: 22928
    text: And he went forth and warred against the Philistines, and broke down the wall of Gath, and the wall of Jabneh, and the wall of Ashdod; and he built cities in [the country of] Ashdod, and among the Philistines.
    translation: JPS 1917
    original: וַיֵּצֵא וַיִּלָּחֶם בַּפְּלִשְׁתִּים וַיִּפְרֹץ אֶת־חוֹמַת גַּת וְאֵת חוֹמַת יַבְנֵה וְאֵת חוֹמַת אַשְׁדּוֹד וַיִּבְנֶה עָרִים בְּאַשְׁדּוֹד וּבַפְּלִשְׁתִּים׃
    hebrewPlain: ויצא וילחם בפלשתים ויפרץ את חומת גת ואת חומת יבנה ואת חומת אשדוד ויבנה ערים באשדוד ובפלשתים
    kjvRefs:
    - 2 Chronicles 26:6
    kjvOsis:
    - 2Chr.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:7
    ref: 2 Chronicles 26:7
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 7
    ordinal: 22929
    text: And God helped him against the Philistines, and against the Arabians that dwelt in Gur-baal, and the Meunim.
    translation: JPS 1917
    original: וַיַּעְזְרֵהוּ הָאֱלֹהִים עַל־פְּלִשְׁתִּים וְעַל־הערביים [הָעַרְבִים] הַיֹּשְׁבִים בְּגוּר־בָּעַל וְהַמְּעוּנִים׃
    hebrewPlain: ויעזרהו האלהים על פלשתים ועל הערביים [הערבים] הישבים בגור בעל והמעונים
    kjvRefs:
    - 2 Chronicles 26:7
    kjvOsis:
    - 2Chr.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:8
    ref: 2 Chronicles 26:8
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 8
    ordinal: 22930
    text: And the Ammonites gave gifts to Uzziah; and his name spread abroad even to the entrance of Egypt; for he waxed exceeding strong.
    translation: JPS 1917
    original: וַיִּתְּנוּ הָעַמּוֹנִים מִנְחָה לְעֻזִּיָּהוּ וַיֵּלֶךְ שְׁמוֹ עַד־לְבוֹא מִצְרַיִם כִּי הֶחֱזִיק עַד־לְמָעְלָה׃
    hebrewPlain: ויתנו העמונים מנחה לעזיהו וילך שמו עד לבוא מצרים כי החזיק עד למעלה
    kjvRefs:
    - 2 Chronicles 26:8
    kjvOsis:
    - 2Chr.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:9
    ref: 2 Chronicles 26:9
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 9
    ordinal: 22931
    text: Moreover Uzziah built towers in Jerusalem at the corner gate, and at the valley gate, and at the Turning, and fortified them.
    translation: JPS 1917
    original: וַיִּבֶן עֻזִּיָּהוּ מִגְדָּלִים בִּירוּשָׁלִַם עַל־שַׁעַר הַפִּנָּה וְעַל־שַׁעַר הַגַּיְא וְעַל־הַמִּקְצוֹעַ וַיְחַזְּקֵם׃
    hebrewPlain: ויבן עזיהו מגדלים בירושלם על שער הפנה ועל שער הגיא ועל המקצוע ויחזקם
    kjvRefs:
    - 2 Chronicles 26:9
    kjvOsis:
    - 2Chr.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:10
    ref: 2 Chronicles 26:10
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 10
    ordinal: 22932
    text: And be built towers in the wilderness, and hewed out many cisterns, for he had much cattle; in the Lowland also, and in the table-land; and he had husbandmen and vinedressers in the mountains and in the fruitful fields; for he loved husbandry.
    translation: JPS 1917
    original: וַיִּבֶן מִגְדָּלִים בַּמִּדְבָּר וַיַּחְצֹב בֹּרוֹת רַבִּים כִּי מִקְנֶה־רַּב הָיָה לוֹ וּבַשְּׁפֵלָה וּבַמִּישׁוֹר אִכָּרִים וְכֹרְמִים בֶּהָרִים וּבַכַּרְמֶל כִּי־אֹהֵב אֲדָמָה הָיָה׃
    hebrewPlain: ויבן מגדלים במדבר ויחצב ברות רבים כי מקנה רב היה לו ובשפלה ובמישור אכרים וכרמים בהרים ובכרמל כי אהב אדמה היה
    kjvRefs:
    - 2 Chronicles 26:10
    kjvOsis:
    - 2Chr.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:11
    ref: 2 Chronicles 26:11
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 11
    ordinal: 22933
    text: Moreover Uzziah had an army of fighting men, that went out to war by bands, according to the number of their reckoning made by Jeiel the scribe and Maaseiah the officer, under the hand of Hananiah, one of the king’s captains.
    translation: JPS 1917
    original: וַיְהִי לְעֻזִּיָּהוּ חַיִל עֹשֵׂה מִלְחָמָה יוֹצְאֵי צָבָא לִגְדוּד בְּמִסְפַּר פְּקֻדָּתָם בְּיַד יעואל [יְעִיאֵל] הַסּוֹפֵר וּמַעֲשֵׂיָהוּ הַשּׁוֹטֵר עַל יַד־חֲנַנְיָהוּ מִשָּׂרֵי הַמֶּלֶךְ׃
    hebrewPlain: ויהי לעזיהו חיל עשה מלחמה יוצאי צבא לגדוד במספר פקדתם ביד יעואל [יעיאל] הסופר ומעשיהו השוטר על יד חנניהו משרי המלך
    kjvRefs:
    - 2 Chronicles 26:11
    kjvOsis:
    - 2Chr.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:12
    ref: 2 Chronicles 26:12
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 12
    ordinal: 22934
    text: The whole number of the heads of fathers’ houses, even the mighty men of valour, was two thousand and six hundred.
    translation: JPS 1917
    original: כֹּל מִסְפַּר רָאשֵׁי הָאָבוֹת לְגִבּוֹרֵי חָיִל אַלְפַּיִם וְשֵׁשׁ מֵאוֹת׃
    hebrewPlain: כל מספר ראשי האבות לגבורי חיל אלפים ושש מאות
    kjvRefs:
    - 2 Chronicles 26:12
    kjvOsis:
    - 2Chr.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:13
    ref: 2 Chronicles 26:13
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 13
    ordinal: 22935
    text: And under their hand was a trained army, three hundred thousand and seven thousand and five hundred, that made war with mighty power, to help the king against the enemy.
    translation: JPS 1917
    original: וְעַל־יָדָם חֵיל צָבָא שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת עוֹשֵׂי מִלְחָמָה בְּכֹחַ חָיִל לַעְזֹר לַמֶּלֶךְ עַל־הָאוֹיֵב׃
    hebrewPlain: ועל ידם חיל צבא שלש מאות אלף ושבעת אלפים וחמש מאות עושי מלחמה בכח חיל לעזר למלך על האויב
    kjvRefs:
    - 2 Chronicles 26:13
    kjvOsis:
    - 2Chr.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:14
    ref: 2 Chronicles 26:14
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 14
    ordinal: 22936
    text: And Uzziah prepared for them, even for all the host, shields, and spears, and helmets, and coats of mail, and bows, and stones for slinging.
    translation: JPS 1917
    original: וַיָּכֶן לָהֶם עֻזִּיָּהוּ לְכָל־הַצָּבָא מָגִנִּים וּרְמָחִים וְכוֹבָעִים וְשִׁרְיֹנוֹת וּקְשָׁתוֹת וּלְאַבְנֵי קְלָעִים׃
    hebrewPlain: ויכן להם עזיהו לכל הצבא מגנים ורמחים וכובעים ושרינות וקשתות ולאבני קלעים
    kjvRefs:
    - 2 Chronicles 26:14
    kjvOsis:
    - 2Chr.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:15
    ref: 2 Chronicles 26:15
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 15
    ordinal: 22937
    text: And he made in Jerusalem engines, invented by skilful men, to be on the towers and upon the corners, wherewith to shoot arrows and great stones. And his name spread far abroad; for he was marvellously helped, till he was strong.
    translation: JPS 1917
    original: וַיַּעַשׂ בִּירוּשָׁלִַם חִשְּׁבֹנוֹת מַחֲשֶׁבֶת חוֹשֵׁב לִהְיוֹת עַל־הַמִּגְדָּלִים וְעַל־הַפִּנּוֹת לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת וַיֵּצֵא שְׁמוֹ עַד־לְמֵרָחוֹק כִּי־הִפְלִיא לְהֵעָזֵר עַד כִּי־חָזָק׃
    hebrewPlain: ויעש בירושלם חשבנות מחשבת חושב להיות על המגדלים ועל הפנות לירוא בחצים ובאבנים גדלות ויצא שמו עד למרחוק כי הפליא להעזר עד כי חזק
    kjvRefs:
    - 2 Chronicles 26:15
    kjvOsis:
    - 2Chr.26.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:16
    ref: 2 Chronicles 26:16
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 16
    ordinal: 22938
    text: But when he was strong, his heart was lifted up so that he did corruptly, and he trespassed against the LORD his God; for he went into the temple of the LORD to burn incense upon the altar of incense.
    translation: JPS 1917
    original: וּכְחֶזְקָתוֹ גָּבַהּ לִבּוֹ עַד־לְהַשְׁחִית וַיִּמְעַל בַּיהוָה אֱלֹהָיו וַיָּבֹא אֶל־הֵיכַל יְהוָה לְהַקְטִיר עַל־מִזְבַּח הַקְּטֹרֶת׃
    hebrewPlain: וכחזקתו גבה לבו עד להשחית וימעל ביהוה אלהיו ויבא אל היכל יהוה להקטיר על מזבח הקטרת
    kjvRefs:
    - 2 Chronicles 26:16
    kjvOsis:
    - 2Chr.26.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:17
    ref: 2 Chronicles 26:17
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 17
    ordinal: 22939
    text: And Azariah the priest went in after him, and with him fourscore priests of the LORD, that were valiant men;
    translation: JPS 1917
    original: וַיָּבֹא אַחֲרָיו עֲזַרְיָהוּ הַכֹּהֵן וְעִמּוֹ כֹּהֲנִים לַיהוָה שְׁמוֹנִים בְּנֵי־חָיִל׃
    hebrewPlain: ויבא אחריו עזריהו הכהן ועמו כהנים ליהוה שמונים בני חיל
    kjvRefs:
    - 2 Chronicles 26:17
    kjvOsis:
    - 2Chr.26.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:18
    ref: 2 Chronicles 26:18
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 18
    ordinal: 22940
    text: 'and they withstood Uzziah the king, and said unto him: ‘It pertaineth not unto thee, Uzziah, to burn incense unto the LORD, but to the priests the sons of Aaron that are consecrated it pertaineth to burn incense; go out of the sanctuary; for thou hast trespassed; neither shall it be for thy honour from the LORD God.’'
    translation: JPS 1917
    original: וַיַּעַמְדוּ עַל־עֻזִּיָּהוּ הַמֶּלֶךְ וַיֹּאמְרוּ לוֹ לֹא־לְךָ עֻזִּיָּהוּ לְהַקְטִיר לַיהוָה כִּי לַכֹּהֲנִים בְּנֵי־אַהֲרֹן הַמְקֻדָּשִׁים לְהַקְטִיר צֵא מִן־הַמִּקְדָּשׁ כִּי מָעַלְתָּ וְלֹא־לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים׃
    hebrewPlain: ויעמדו על עזיהו המלך ויאמרו לו לא לך עזיהו להקטיר ליהוה כי לכהנים בני אהרן המקדשים להקטיר צא מן המקדש כי מעלת ולא לך לכבוד מיהוה אלהים
    kjvRefs:
    - 2 Chronicles 26:18
    kjvOsis:
    - 2Chr.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:19
    ref: 2 Chronicles 26:19
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 19
    ordinal: 22941
    text: Then Uzziah was wroth; and he had a censer in his hand to burn incense; and while he was wroth with the priests, the leprosy broke forth in his forehead before the priests in the house of the LORD, beside the altar of incense.
    translation: JPS 1917
    original: וַיִּזְעַף עֻזִּיָּהוּ וּבְיָדוֹ מִקְטֶרֶת לְהַקְטִיר וּבְזַעְפּוֹ עִם־הַכֹּהֲנִים וְהַצָּרַעַת זָרְחָה בְמִצְחוֹ לִפְנֵי הַכֹּהֲנִים בְּבֵית יְהוָה מֵעַל לְמִזְבַּח הַקְּטֹרֶת׃
    hebrewPlain: ויזעף עזיהו ובידו מקטרת להקטיר ובזעפו עם הכהנים והצרעת זרחה במצחו לפני הכהנים בבית יהוה מעל למזבח הקטרת
    kjvRefs:
    - 2 Chronicles 26:19
    kjvOsis:
    - 2Chr.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:20
    ref: 2 Chronicles 26:20
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 20
    ordinal: 22942
    text: And Azariah the chief priest, and all the priests, looked upon him, and, behold, he was leprous in his forehead, and they thrust him out quickly from thence; yea, himself made haste also to go out, because the LORD had smitten him.
    translation: JPS 1917
    original: וַיִּפֶן אֵלָיו עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ וְכָל־הַכֹּהֲנִים וְהִנֵּה־הוּא מְצֹרָע בְּמִצְחוֹ וַיַּבְהִלוּהוּ מִשָּׁם וְגַם־הוּא נִדְחַף לָצֵאת כִּי נִגְּעוֹ יְהוָה׃
    hebrewPlain: ויפן אליו עזריהו כהן הראש וכל הכהנים והנה הוא מצרע במצחו ויבהלוהו משם וגם הוא נדחף לצאת כי נגעו יהוה
    kjvRefs:
    - 2 Chronicles 26:20
    kjvOsis:
    - 2Chr.26.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:21
    ref: 2 Chronicles 26:21
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 21
    ordinal: 22943
    text: And Uzziah the king was a leper unto the day of his death, and dwelt in a house set apart, being a leper; for he was cut off from the house of the LORD; and Jotham his son was over the king’s house, judging the people of the land.
    translation: JPS 1917
    original: וַיְהִי עֻזִּיָּהוּ הַמֶּלֶךְ מְצֹרָע עַד־יוֹם מוֹתוֹ וַיֵּשֶׁב בֵּית החפשות [הַחָפְשִׁית] מְצֹרָע כִּי נִגְזַר מִבֵּית יְהוָה וְיוֹתָם בְּנוֹ עַל־בֵּית הַמֶּלֶךְ שׁוֹפֵט אֶת־עַם הָאָרֶץ׃
    hebrewPlain: ויהי עזיהו המלך מצרע עד יום מותו וישב בית החפשות [החפשית] מצרע כי נגזר מבית יהוה ויותם בנו על בית המלך שופט את עם הארץ
    kjvRefs:
    - 2 Chronicles 26:21
    kjvOsis:
    - 2Chr.26.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:22
    ref: 2 Chronicles 26:22
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 22
    ordinal: 22944
    text: Now the rest of the acts of Uzziah, first and last, did Isaiah the prophet, the son of Amoz, write.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי עֻזִּיָּהוּ הָרִאשֹׁנִים וְהָאֲחֲרֹנִים כָּתַב יְשַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא׃
    hebrewPlain: ויתר דברי עזיהו הראשנים והאחרנים כתב ישעיהו בן אמוץ הנביא
    kjvRefs:
    - 2 Chronicles 26:22
    kjvOsis:
    - 2Chr.26.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.26.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 26:23
    ref: 2 Chronicles 26:23
    book: 2Chr
    section: ketuvim
    chapter: 26
    verse: 23
    ordinal: 22945
    text: 'So Uzziah slept with his fathers; and they buried him with his fathers in the field of burial which belonged to the kings; for they said: ‘He is a leper’; and Jotham his son reigned in his stead.'
    translation: JPS 1917
    original: וַיִּשְׁכַּב עֻזִּיָּהוּ עִם־אֲבֹתָיו וַיִּקְבְּרוּ אֹתוֹ עִם־אֲבֹתָיו בִּשְׂדֵה הַקְּבוּרָה אֲשֶׁר לַמְּלָכִים כִּי אָמְרוּ מְצוֹרָע הוּא וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב עזיהו עם אבתיו ויקברו אתו עם אבתיו בשדה הקבורה אשר למלכים כי אמרו מצורע הוא וימלך יותם בנו תחתיו
    kjvRefs:
    - 2 Chronicles 26:23
    kjvOsis:
    - 2Chr.26.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.26
- type: TanakhVerse
  data:
    osis: 2Chr.27.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:1
    ref: 2 Chronicles 27:1
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 1
    ordinal: 22946
    text: Jotham was twenty and five years old when he began to reign; and he reigned sixteen years in Jerusalem; and his mother’s name was Jerushah the daughter of Zadok.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה יוֹתָם בְּמָלְכוֹ וְשֵׁשׁ־עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יְרוּשָׁה בַּת־צָדוֹק׃
    hebrewPlain: בן עשרים וחמש שנה יותם במלכו ושש עשרה שנה מלך בירושלם ושם אמו ירושה בת צדוק
    kjvRefs:
    - 2 Chronicles 27:1
    kjvOsis:
    - 2Chr.27.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:2
    ref: 2 Chronicles 27:2
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 2
    ordinal: 22947
    text: And he did that which was right in the eyes of the LORD, according to all that his father Uzziah had done; howbeit he entered not into the temple of the LORD. And the people did yet corruptly.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה עֻזִּיָּהוּ אָבִיו רַק לֹא־בָא אֶל־הֵיכַל יְהוָה וְעוֹד הָעָם מַשְׁחִיתִים׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה עזיהו אביו רק לא בא אל היכל יהוה ועוד העם משחיתים
    kjvRefs:
    - 2 Chronicles 27:2
    kjvOsis:
    - 2Chr.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:3
    ref: 2 Chronicles 27:3
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 3
    ordinal: 22948
    text: He built the upper gate of the house of the LORD, and on the wall of Ophel he built much.
    translation: JPS 1917
    original: הוּא בָּנָה אֶת־שַׁעַר בֵּית־יְהוָה הָעֶלְיוֹן וּבְחוֹמַת הָעֹפֶל בָּנָה לָרֹב׃
    hebrewPlain: הוא בנה את שער בית יהוה העליון ובחומת העפל בנה לרב
    kjvRefs:
    - 2 Chronicles 27:3
    kjvOsis:
    - 2Chr.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:4
    ref: 2 Chronicles 27:4
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 4
    ordinal: 22949
    text: Moreover he built cities in the hill-country of Judah, and in the forest he built castles and towers.
    translation: JPS 1917
    original: וְעָרִים בָּנָה בְּהַר־יְהוּדָה וּבֶחֳרָשִׁים בָּנָה בִּירָנִיּוֹת וּמִגְדָּלִים׃
    hebrewPlain: וערים בנה בהר יהודה ובחרשים בנה בירניות ומגדלים
    kjvRefs:
    - 2 Chronicles 27:4
    kjvOsis:
    - 2Chr.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:5
    ref: 2 Chronicles 27:5
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 5
    ordinal: 22950
    text: He fought also with the king of the children of Ammon, and prevailed against them. And the children of Ammon gave him the same year a hundred talents of silver, and ten thousand measures of wheat, and ten thousand of barley. So much did the children of Ammon render unto him, in the second year also, and in the third.
    translation: JPS 1917
    original: וְהוּא נִלְחַם עִם־מֶלֶךְ בְּנֵי־עַמּוֹן וַיֶּחֱזַק עֲלֵיהֶם וַיִּתְּנוּ־לוֹ בְנֵי־עַמּוֹן בַּשָּׁנָה הַהִיא מֵאָה כִּכַּר־כֶּסֶף וַעֲשֶׂרֶת אֲלָפִים כֹּרִים חִטִּים וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים זֹאת הֵשִׁיבוּ לוֹ בְּנֵי עַמּוֹן וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית׃
    hebrewPlain: והוא נלחם עם מלך בני עמון ויחזק עליהם ויתנו לו בני עמון בשנה ההיא מאה ככר כסף ועשרת אלפים כרים חטים ושעורים עשרת אלפים זאת השיבו לו בני עמון ובשנה השנית והשלשית
    kjvRefs:
    - 2 Chronicles 27:5
    kjvOsis:
    - 2Chr.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:6
    ref: 2 Chronicles 27:6
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 6
    ordinal: 22951
    text: So Jotham became mighty, because he ordered his ways before the LORD his God.
    translation: JPS 1917
    original: וַיִּתְחַזֵּק יוֹתָם כִּי הֵכִין דְּרָכָיו לִפְנֵי יְהוָה אֱלֹהָיו׃
    hebrewPlain: ויתחזק יותם כי הכין דרכיו לפני יהוה אלהיו
    kjvRefs:
    - 2 Chronicles 27:6
    kjvOsis:
    - 2Chr.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:7
    ref: 2 Chronicles 27:7
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 7
    ordinal: 22952
    text: Now the rest of the acts of Jotham, and all his wars, and his ways, behold, they are written in the book of the kings of Israel and Judah.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יוֹתָם וְכָל־מִלְחֲמֹתָיו וּדְרָכָיו הִנָּם כְּתוּבִים עַל־סֵפֶר מַלְכֵי־יִשְׂרָאֵל וִיהוּדָה׃
    hebrewPlain: ויתר דברי יותם וכל מלחמתיו ודרכיו הנם כתובים על ספר מלכי ישראל ויהודה
    kjvRefs:
    - 2 Chronicles 27:7
    kjvOsis:
    - 2Chr.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:8
    ref: 2 Chronicles 27:8
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 8
    ordinal: 22953
    text: He was five and twenty years old when he began to reign, and reigned sixteen years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ וְשֵׁשׁ־עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן עשרים וחמש שנה היה במלכו ושש עשרה שנה מלך בירושלם
    kjvRefs:
    - 2 Chronicles 27:8
    kjvOsis:
    - 2Chr.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.27.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 27:9
    ref: 2 Chronicles 27:9
    book: 2Chr
    section: ketuvim
    chapter: 27
    verse: 9
    ordinal: 22954
    text: And Jotham slept with his fathers, and they buried him in the city of David; and Ahaz his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יוֹתָם עִם־אֲבֹתָיו וַיִּקְבְּרוּ אֹתוֹ בְּעִיר דָּוִיד וַיִּמְלֹךְ אָחָז בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יותם עם אבתיו ויקברו אתו בעיר דויד וימלך אחז בנו תחתיו
    kjvRefs:
    - 2 Chronicles 27:9
    kjvOsis:
    - 2Chr.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.27
- type: TanakhVerse
  data:
    osis: 2Chr.28.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:1
    ref: 2 Chronicles 28:1
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 1
    ordinal: 22955
    text: Ahaz was twenty years old when he began to reign; and he reigned sixteen years in Jerusalem; and he did not that which was right in the eyes of the LORD, like David his father;
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים שָׁנָה אָחָז בְּמָלְכוֹ וְשֵׁשׁ־עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְלֹא־עָשָׂה הַיָּשָׁר בְּעֵינֵי יְהוָה כְּדָוִיד אָבִיו׃
    hebrewPlain: בן עשרים שנה אחז במלכו ושש עשרה שנה מלך בירושלם ולא עשה הישר בעיני יהוה כדויד אביו
    kjvRefs:
    - 2 Chronicles 28:1
    kjvOsis:
    - 2Chr.28.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:2
    ref: 2 Chronicles 28:2
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 2
    ordinal: 22956
    text: but he walked in the ways of the kings of Israel, and made also molten images for the Baalim.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדַרְכֵי מַלְכֵי יִשְׂרָאֵל וְגַם מַסֵּכוֹת עָשָׂה לַבְּעָלִים׃
    hebrewPlain: וילך בדרכי מלכי ישראל וגם מסכות עשה לבעלים
    kjvRefs:
    - 2 Chronicles 28:2
    kjvOsis:
    - 2Chr.28.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:3
    ref: 2 Chronicles 28:3
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 3
    ordinal: 22957
    text: Moreover he offered in the valley of the son of Hinnom, and burnt his children in the fire, according to the abominations of the heathen, whom the LORD cast out before the children of Israel.
    translation: JPS 1917
    original: וְהוּא הִקְטִיר בְּגֵיא בֶן־הִנֹּם וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ כְּתֹעֲבוֹת הַגּוֹיִם אֲשֶׁר הֹרִישׁ יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: והוא הקטיר בגיא בן הנם ויבער את בניו באש כתעבות הגוים אשר הריש יהוה מפני בני ישראל
    kjvRefs:
    - 2 Chronicles 28:3
    kjvOsis:
    - 2Chr.28.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:4
    ref: 2 Chronicles 28:4
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 4
    ordinal: 22958
    text: And he sacrificed and offered in the high places, and on the hills, and under every leafy tree.
    translation: JPS 1917
    original: וַיְזַבֵּחַ וַיְקַטֵּר בַּבָּמוֹת וְעַל־הַגְּבָעוֹת וְתַחַת כָּל־עֵץ רַעֲנָן׃
    hebrewPlain: ויזבח ויקטר בבמות ועל הגבעות ותחת כל עץ רענן
    kjvRefs:
    - 2 Chronicles 28:4
    kjvOsis:
    - 2Chr.28.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:5
    ref: 2 Chronicles 28:5
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 5
    ordinal: 22959
    text: Wherefore the LORD his God delivered him into the hand of the king of Aram; and they smote him, and carried away of his a great multitude of captives, and brought them to Damascus. And he was also delivered into the hand of the king of Israel, who smote him with a great slaughter.
    translation: JPS 1917
    original: וַיִּתְּנֵהוּ יְהוָה אֱלֹהָיו בְּיַד מֶלֶךְ אֲרָם וַיַּכּוּ־בוֹ וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה וַיָּבִיאוּ דַּרְמָשֶׂק וְגַם בְּיַד־מֶלֶךְ יִשְׂרָאֵל נִתָּן וַיַּךְ־בּוֹ מַכָּה גְדוֹלָה׃
    hebrewPlain: ויתנהו יהוה אלהיו ביד מלך ארם ויכו בו וישבו ממנו שביה גדולה ויביאו דרמשק וגם ביד מלך ישראל נתן ויך בו מכה גדולה
    kjvRefs:
    - 2 Chronicles 28:5
    kjvOsis:
    - 2Chr.28.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:6
    ref: 2 Chronicles 28:6
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 6
    ordinal: 22960
    text: For Pekah the son of Remaliah slew in Judah a hundred and twenty thousand in one day, all of them valiant men; because they had forsaken the LORD, the God of their fathers.
    translation: JPS 1917
    original: וַיַּהֲרֹג פֶּקַח בֶּן־רְמַלְיָהוּ בִּיהוּדָה מֵאָה וְעֶשְׂרִים אֶלֶף בְּיוֹם אֶחָד הַכֹּל בְּנֵי־חָיִל בְּעָזְבָם אֶת־יְהוָה אֱלֹהֵי אֲבוֹתָם׃
    hebrewPlain: ויהרג פקח בן רמליהו ביהודה מאה ועשרים אלף ביום אחד הכל בני חיל בעזבם את יהוה אלהי אבותם
    kjvRefs:
    - 2 Chronicles 28:6
    kjvOsis:
    - 2Chr.28.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:7
    ref: 2 Chronicles 28:7
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 7
    ordinal: 22961
    text: And Zichri, a mighty man of Ephraim, slew Maaseiah the king’s son, and Azrikam the ruler of the house, and Elkanah that was next to the king.
    translation: JPS 1917
    original: וַיַּהֲרֹג זִכְרִי גִּבּוֹר אֶפְרַיִם אֶת־מַעֲשֵׂיָהוּ בֶּן־הַמֶּלֶךְ וְאֶת־עַזְרִיקָם נְגִיד הַבָּיִת וְאֶת־אֶלְקָנָה מִשְׁנֵה הַמֶּלֶךְ׃
    hebrewPlain: ויהרג זכרי גבור אפרים את מעשיהו בן המלך ואת עזריקם נגיד הבית ואת אלקנה משנה המלך
    kjvRefs:
    - 2 Chronicles 28:7
    kjvOsis:
    - 2Chr.28.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:8
    ref: 2 Chronicles 28:8
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 8
    ordinal: 22962
    text: And the children of Israel carried away captive of their brethren two hundred thousand women, sons, and daughters, and took also away much spoil from them, and brought the spoil to Samaria.
    translation: JPS 1917
    original: וַיִּשְׁבּוּ בְנֵי־יִשְׂרָאֵל מֵאֲחֵיהֶם מָאתַיִם אֶלֶף נָשִׁים בָּנִים וּבָנוֹת וְגַם־שָׁלָל רָב בָּזְזוּ מֵהֶם וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן׃
    hebrewPlain: וישבו בני ישראל מאחיהם מאתים אלף נשים בנים ובנות וגם שלל רב בזזו מהם ויביאו את השלל לשמרון
    kjvRefs:
    - 2 Chronicles 28:8
    kjvOsis:
    - 2Chr.28.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:9
    ref: 2 Chronicles 28:9
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 9
    ordinal: 22963
    text: 'But a prophet of the LORD was there, whose name was Oded; and he went out to meet the host that came to Samaria, and said unto them: ‘Behold, because the LORD, the God of your fathers, was wroth with Judah, He hath delivered them into your hand, and ye have slain them in a rage which hath reached up unto heaven.'
    translation: JPS 1917
    original: וְשָׁם הָיָה נָבִיא לַיהוָה עֹדֵד שְׁמוֹ וַיֵּצֵא לִפְנֵי הַצָּבָא הַבָּא לְשֹׁמְרוֹן וַיֹּאמֶר לָהֶם הִנֵּה בַּחֲמַת יְהוָה אֱלֹהֵי־אֲבוֹתֵיכֶם עַל־יְהוּדָה נְתָנָם בְּיֶדְכֶם וַתַּהַרְגוּ־בָם בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ׃
    hebrewPlain: ושם היה נביא ליהוה עדד שמו ויצא לפני הצבא הבא לשמרון ויאמר להם הנה בחמת יהוה אלהי אבותיכם על יהודה נתנם בידכם ותהרגו בם בזעף עד לשמים הגיע
    kjvRefs:
    - 2 Chronicles 28:9
    kjvOsis:
    - 2Chr.28.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:10
    ref: 2 Chronicles 28:10
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 10
    ordinal: 22964
    text: And now ye purpose to bring the children of Judah and Jerusalem into subjection for bondmen and bondwomen unto you; but are there not even with you acts of guilt of your own against the LORD your God?
    translation: JPS 1917
    original: וְעַתָּה בְּנֵי־יְהוּדָה וִירוּשָׁלִַם אַתֶּם אֹמְרִים לִכְבֹּשׁ לַעֲבָדִים וְלִשְׁפָחוֹת לָכֶם הֲלֹא רַק־אַתֶּם עִמָּכֶם אֲשָׁמוֹת לַיהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ועתה בני יהודה וירושלם אתם אמרים לכבש לעבדים ולשפחות לכם הלא רק אתם עמכם אשמות ליהוה אלהיכם
    kjvRefs:
    - 2 Chronicles 28:10
    kjvOsis:
    - 2Chr.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:11
    ref: 2 Chronicles 28:11
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 11
    ordinal: 22965
    text: Now hear me therefore, and send back the captives, that ye have taken captive of your brethren; for the fierce wrath of the LORD is upon you.’
    translation: JPS 1917
    original: וְעַתָּה שְׁמָעוּנִי וְהָשִׁיבוּ הַשִּׁבְיָה אֲשֶׁר שְׁבִיתֶם מֵאֲחֵיכֶם כִּי חֲרוֹן אַף־יְהוָה עֲלֵיכֶם׃
    hebrewPlain: ועתה שמעוני והשיבו השביה אשר שביתם מאחיכם כי חרון אף יהוה עליכם
    kjvRefs:
    - 2 Chronicles 28:11
    kjvOsis:
    - 2Chr.28.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:12
    ref: 2 Chronicles 28:12
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 12
    ordinal: 22966
    text: Then certain of the heads of the children of Ephraim, Azariah the son of Jehohanan, Berechiah the son of Meshillemoth, and Jehizkiah the son of Shallum, and Amasa the son of Hadlai, stood up against them that came from the war,
    translation: JPS 1917
    original: וַיָּקֻמוּ אֲנָשִׁים מֵרָאשֵׁי בְנֵי־אֶפְרַיִם עֲזַרְיָהוּ בֶן־יְהוֹחָנָן בֶּרֶכְיָהוּ בֶן־מְשִׁלֵּמוֹת וִיחִזְקִיָּהוּ בֶּן־שַׁלֻּם וַעֲמָשָׂא בֶּן־חַדְלָי עַל־הַבָּאִים מִן־הַצָּבָא׃
    hebrewPlain: ויקמו אנשים מראשי בני אפרים עזריהו בן יהוחנן ברכיהו בן משלמות ויחזקיהו בן שלם ועמשא בן חדלי על הבאים מן הצבא
    kjvRefs:
    - 2 Chronicles 28:12
    kjvOsis:
    - 2Chr.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:13
    ref: 2 Chronicles 28:13
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 13
    ordinal: 22967
    text: 'and said unto them: ‘Ye shall not bring in the captives hither; for ye purpose that which will bring upon us guilt against the LORD, to add unto our sins and to our guilt; for our guilt is great, and there is fierce wrath against Israel.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לָהֶם לֹא־תָבִיאוּ אֶת־הַשִּׁבְיָה הֵנָּה כִּי לְאַשְׁמַת יְהוָה עָלֵינוּ אַתֶּם אֹמְרִים לְהֹסִיף עַל־חַטֹּאתֵינוּ וְעַל־אַשְׁמָתֵינוּ כִּי־רַבָּה אַשְׁמָה לָנוּ וַחֲרוֹן אָף עַל־יִשְׂרָאֵל׃
    hebrewPlain: ויאמרו להם לא תביאו את השביה הנה כי לאשמת יהוה עלינו אתם אמרים להסיף על חטאתינו ועל אשמתינו כי רבה אשמה לנו וחרון אף על ישראל
    kjvRefs:
    - 2 Chronicles 28:13
    kjvOsis:
    - 2Chr.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:14
    ref: 2 Chronicles 28:14
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 14
    ordinal: 22968
    text: So the armed men left the captives and the spoil before the princes and all the congregation.
    translation: JPS 1917
    original: וַיַּעֲזֹב הֶחָלוּץ אֶת־הַשִּׁבְיָה וְאֶת־הַבִּזָּה לִפְנֵי הַשָּׂרִים וְכָל־הַקָּהָל׃
    hebrewPlain: ויעזב החלוץ את השביה ואת הבזה לפני השרים וכל הקהל
    kjvRefs:
    - 2 Chronicles 28:14
    kjvOsis:
    - 2Chr.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:15
    ref: 2 Chronicles 28:15
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 15
    ordinal: 22969
    text: And the men that have been mentioned by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of palm-trees, unto their brethren; then they returned to Samaria.
    translation: JPS 1917
    original: וַיָּקֻמוּ הָאֲנָשִׁים אֲשֶׁר־נִקְּבוּ בְשֵׁמוֹת וַיַּחֲזִיקוּ בַשִּׁבְיָה וְכָל־מַעֲרֻמֵּיהֶם הִלְבִּישׁוּ מִן־הַשָּׁלָל וַיַּלְבִּשׁוּם וַיַּנְעִלוּם וַיַּאֲכִלוּם וַיַּשְׁקוּם וַיְסֻכוּם וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל־כּוֹשֵׁל וַיְבִיאוּם יְרֵחוֹ עִיר־הַתְּמָרִים אֵצֶל אֲחֵיהֶם וַיָּשׁוּבוּ שֹׁמְרוֹן׃
    hebrewPlain: ויקמו האנשים אשר נקבו בשמות ויחזיקו בשביה וכל מערמיהם הלבישו מן השלל וילבשום וינעלום ויאכלום וישקום ויסכום וינהלום בחמרים לכל כושל ויביאום ירחו עיר התמרים אצל אחיהם וישובו שמרון
    kjvRefs:
    - 2 Chronicles 28:15
    kjvOsis:
    - 2Chr.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:16
    ref: 2 Chronicles 28:16
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 16
    ordinal: 22970
    text: At that time did king Ahaz send unto the kings of Assyria to help him.
    translation: JPS 1917
    original: בָּעֵת הַהִיא שָׁלַח הַמֶּלֶךְ אָחָז עַל־מַלְכֵי אַשּׁוּר לַעְזֹר לוֹ׃
    hebrewPlain: בעת ההיא שלח המלך אחז על מלכי אשור לעזר לו
    kjvRefs:
    - 2 Chronicles 28:16
    kjvOsis:
    - 2Chr.28.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:17
    ref: 2 Chronicles 28:17
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 17
    ordinal: 22971
    text: For again the Edomites had come and smitten Judah, and carried away captives.
    translation: JPS 1917
    original: וְעוֹד אֲדוֹמִים בָּאוּ וַיַּכּוּ בִיהוּדָה וַיִּשְׁבּוּ־שֶׁבִי׃
    hebrewPlain: ועוד אדומים באו ויכו ביהודה וישבו שבי
    kjvRefs:
    - 2 Chronicles 28:17
    kjvOsis:
    - 2Chr.28.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:18
    ref: 2 Chronicles 28:18
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 18
    ordinal: 22972
    text: The Philistines also had invaded the cities of the Lowland, and of the South of Judah, and had taken Beth-shemesh, and Aijalon, and Gederoth, and Soco with the towns thereof, and Timnah with the towns thereof, Gimzo also and the towns thereof; and they dwelt there.
    translation: JPS 1917
    original: וּפְלִשְׁתִּים פָּשְׁטוּ בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה וַיִּלְכְּדוּ אֶת־בֵּית־שֶׁמֶשׁ וְאֶת־אַיָּלוֹן וְאֶת־הַגְּדֵרוֹת וְאֶת־שׂוֹכוֹ וּבְנוֹתֶיהָ וְאֶת־תִּמְנָה וּבְנוֹתֶיהָ וְאֶת־גִּמְזוֹ וְאֶת־בְּנֹתֶיהָ וַיֵּשְׁבוּ שָׁם׃
    hebrewPlain: ופלשתים פשטו בערי השפלה והנגב ליהודה וילכדו את בית שמש ואת אילון ואת הגדרות ואת שוכו ובנותיה ואת תמנה ובנותיה ואת גמזו ואת בנתיה וישבו שם
    kjvRefs:
    - 2 Chronicles 28:18
    kjvOsis:
    - 2Chr.28.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:19
    ref: 2 Chronicles 28:19
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 19
    ordinal: 22973
    text: For the LORD brought Judah low because of Ahaz king of Israel; for he had cast away restraint in Judah, and acted treacherously against the LORD.
    translation: JPS 1917
    original: כִּי־הִכְנִיעַ יְהוָה אֶת־יְהוּדָה בַּעֲבוּר אָחָז מֶלֶךְ־יִשְׂרָאֵל כִּי הִפְרִיעַ בִּיהוּדָה וּמָעוֹל מַעַל בַּיהוָה׃
    hebrewPlain: כי הכניע יהוה את יהודה בעבור אחז מלך ישראל כי הפריע ביהודה ומעול מעל ביהוה
    kjvRefs:
    - 2 Chronicles 28:19
    kjvOsis:
    - 2Chr.28.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:20
    ref: 2 Chronicles 28:20
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 20
    ordinal: 22974
    text: And Tillegath-pilneser king of Assyria came unto him, and distressed him, but strengthened him not.
    translation: JPS 1917
    original: וַיָּבֹא עָלָיו תִּלְּגַת פִּלְנְאֶסֶר מֶלֶךְ אַשּׁוּר וַיָּצַר לוֹ וְלֹא חֲזָקוֹ׃
    hebrewPlain: ויבא עליו תלגת פלנאסר מלך אשור ויצר לו ולא חזקו
    kjvRefs:
    - 2 Chronicles 28:20
    kjvOsis:
    - 2Chr.28.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:21
    ref: 2 Chronicles 28:21
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 21
    ordinal: 22975
    text: For Ahaz stripped the house of the LORD, and the house of the king and the princes, and gave thereof unto the king of Assyria; but it helped him not.
    translation: JPS 1917
    original: כִּי־חָלַק אָחָז אֶת־בֵּית יְהוָה וְאֶת־בֵּית הַמֶּלֶךְ וְהַשָּׂרִים וַיִּתֵּן לְמֶלֶךְ אַשּׁוּר וְלֹא לְעֶזְרָה לוֹ׃
    hebrewPlain: כי חלק אחז את בית יהוה ואת בית המלך והשרים ויתן למלך אשור ולא לעזרה לו
    kjvRefs:
    - 2 Chronicles 28:21
    kjvOsis:
    - 2Chr.28.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:22
    ref: 2 Chronicles 28:22
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 22
    ordinal: 22976
    text: And in the time of his distress did he act even more treacherously against the LORD, this same king Ahaz.
    translation: JPS 1917
    original: וּבְעֵת הָצֵר לוֹ וַיּוֹסֶף לִמְעוֹל בַּיהוָה הוּא הַמֶּלֶךְ אָחָז׃
    hebrewPlain: ובעת הצר לו ויוסף למעול ביהוה הוא המלך אחז
    kjvRefs:
    - 2 Chronicles 28:22
    kjvOsis:
    - 2Chr.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:23
    ref: 2 Chronicles 28:23
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 23
    ordinal: 22977
    text: 'For he sacrificed unto the gods of Damascus, which smote him; and he said: ‘Because the gods of the kings of Aram helped them, therefore will I sacrifice to them, that they may help me.’ But they were the ruin of him, and of all Israel.'
    translation: JPS 1917
    original: וַיִּזְבַּח לֵאלֹהֵי דַרְמֶשֶׂק הַמַּכִּים בּוֹ וַיֹּאמֶר כִּי אֱלֹהֵי מַלְכֵי־אֲרָם הֵם מַעְזְרִים אוֹתָם לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי וְהֵם הָיוּ־לוֹ לְהַכְשִׁילוֹ וּלְכָל־יִשְׂרָאֵל׃
    hebrewPlain: ויזבח לאלהי דרמשק המכים בו ויאמר כי אלהי מלכי ארם הם מעזרים אותם להם אזבח ויעזרוני והם היו לו להכשילו ולכל ישראל
    kjvRefs:
    - 2 Chronicles 28:23
    kjvOsis:
    - 2Chr.28.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:24
    ref: 2 Chronicles 28:24
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 24
    ordinal: 22978
    text: And Ahaz gathered together the vessels of the house of God, and cut in pieces the vessels of the house of God, and shut up the doors of the house of the LORD; and he made him altars in every corner of Jerusalem.
    translation: JPS 1917
    original: וַיֶּאֱסֹף אָחָז אֶת־כְּלֵי בֵית־הָאֱלֹהִים וַיְקַצֵּץ אֶת־כְּלֵי בֵית־הָאֱלֹהִים וַיִּסְגֹּר אֶת־דַּלְתוֹת בֵּית־יְהוָה וַיַּעַשׂ לוֹ מִזְבְּחוֹת בְּכָל־פִּנָּה בִּירוּשָׁלִָם׃
    hebrewPlain: ויאסף אחז את כלי בית האלהים ויקצץ את כלי בית האלהים ויסגר את דלתות בית יהוה ויעש לו מזבחות בכל פנה בירושלם
    kjvRefs:
    - 2 Chronicles 28:24
    kjvOsis:
    - 2Chr.28.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:25
    ref: 2 Chronicles 28:25
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 25
    ordinal: 22979
    text: And in every city of Judah he made high places to offer unto other gods, and provoked the LORD, the God of his fathers.
    translation: JPS 1917
    original: וּבְכָל־עִיר וָעִיר לִיהוּדָה עָשָׂה בָמוֹת לְקַטֵּר לֵאלֹהִים אֲחֵרִים וַיַּכְעֵס אֶת־יְהוָה אֱלֹהֵי אֲבֹתָיו׃
    hebrewPlain: ובכל עיר ועיר ליהודה עשה במות לקטר לאלהים אחרים ויכעס את יהוה אלהי אבתיו
    kjvRefs:
    - 2 Chronicles 28:25
    kjvOsis:
    - 2Chr.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:26
    ref: 2 Chronicles 28:26
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 26
    ordinal: 22980
    text: Now the rest of his acts, and all his ways, first and last, behold, they are written in the book of the kings of Judah and Israel.
    translation: JPS 1917
    original: וְיֶתֶר דְּבָרָיו וְכָל־דְּרָכָיו הָרִאשֹׁנִים וְהָאַחֲרוֹנִים הִנָּם כְּתוּבִים עַל־סֵפֶר מַלְכֵי־יְהוּדָה וְיִשְׂרָאֵל׃
    hebrewPlain: ויתר דבריו וכל דרכיו הראשנים והאחרונים הנם כתובים על ספר מלכי יהודה וישראל
    kjvRefs:
    - 2 Chronicles 28:26
    kjvOsis:
    - 2Chr.28.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.28.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 28:27
    ref: 2 Chronicles 28:27
    book: 2Chr
    section: ketuvim
    chapter: 28
    verse: 27
    ordinal: 22981
    text: And Ahaz slept with his fathers, and they buried him in the city, even in Jerusalem; for they brought him not into the sepulchres of the kings of Israel; and Hezekiah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב אָחָז עִם־אֲבֹתָיו וַיִּקְבְּרֻהוּ בָעִיר בִּירוּשָׁלִַם כִּי לֹא הֱבִיאֻהוּ לְקִבְרֵי מַלְכֵי יִשְׂרָאֵל וַיִּמְלֹךְ יְחִזְקִיָּהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב אחז עם אבתיו ויקברהו בעיר בירושלם כי לא הביאהו לקברי מלכי ישראל וימלך יחזקיהו בנו תחתיו
    kjvRefs:
    - 2 Chronicles 28:27
    kjvOsis:
    - 2Chr.28.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.28
- type: TanakhVerse
  data:
    osis: 2Chr.29.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:1
    ref: 2 Chronicles 29:1
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 1
    ordinal: 22982
    text: Hezekiah began to reign when he was five and twenty years old; and he reigned nine and twenty years in Jerusalem; and his mother’s name was Abijah the daughter of Zechariah.
    translation: JPS 1917
    original: יְחִזְקִיָּהוּ מָלַךְ בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ אֲבִיָּה בַּת־זְכַרְיָהוּ׃
    hebrewPlain: יחזקיהו מלך בן עשרים וחמש שנה ועשרים ותשע שנה מלך בירושלם ושם אמו אביה בת זכריהו
    kjvRefs:
    - 2 Chronicles 29:1
    kjvOsis:
    - 2Chr.29.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:2
    ref: 2 Chronicles 29:2
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 2
    ordinal: 22983
    text: And he did that which was right in the eyes of the LORD, according to all that David his father had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה דָּוִיד אָבִיו׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה דויד אביו
    kjvRefs:
    - 2 Chronicles 29:2
    kjvOsis:
    - 2Chr.29.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:3
    ref: 2 Chronicles 29:3
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 3
    ordinal: 22984
    text: He in the first year of his reign, in the first month, opened the doors of the house of the LORD, and repaired them.
    translation: JPS 1917
    original: הוּא בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ בַּחֹדֶשׁ הָרִאשׁוֹן פָּתַח אֶת־דַּלְתוֹת בֵּית־יְהוָה וַיְחַזְּקֵם׃
    hebrewPlain: הוא בשנה הראשונה למלכו בחדש הראשון פתח את דלתות בית יהוה ויחזקם
    kjvRefs:
    - 2 Chronicles 29:3
    kjvOsis:
    - 2Chr.29.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:4
    ref: 2 Chronicles 29:4
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 4
    ordinal: 22985
    text: And he brought in the priests and the Levites, and gathered them together into the broad place on the east;
    translation: JPS 1917
    original: וַיָּבֵא אֶת־הַכֹּהֲנִים וְאֶת־הַלְוִיִּם וַיַּאַסְפֵם לִרְחוֹב הַמִּזְרָח׃
    hebrewPlain: ויבא את הכהנים ואת הלוים ויאספם לרחוב המזרח
    kjvRefs:
    - 2 Chronicles 29:4
    kjvOsis:
    - 2Chr.29.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:5
    ref: 2 Chronicles 29:5
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 5
    ordinal: 22986
    text: 'and said unto them: ‘Hear me, ye Levites: now sanctify yourselves, and sanctify the house of the LORD, the God of your fathers, and carry forth the filthiness out of the holy place.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם שְׁמָעוּנִי הַלְוִיִּם עַתָּה הִתְקַדְּשׁוּ וְקַדְּשׁוּ אֶת־בֵּית יְהוָה אֱלֹהֵי אֲבֹתֵיכֶם וְהוֹצִיאוּ אֶת־הַנִּדָּה מִן־הַקֹּדֶשׁ׃
    hebrewPlain: ויאמר להם שמעוני הלוים עתה התקדשו וקדשו את בית יהוה אלהי אבתיכם והוציאו את הנדה מן הקדש
    kjvRefs:
    - 2 Chronicles 29:5
    kjvOsis:
    - 2Chr.29.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:6
    ref: 2 Chronicles 29:6
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 6
    ordinal: 22987
    text: For our fathers have acted treacherously, and done that which was evil in the sight of the LORD our God, and have forsaken Him, and have turned away their faces from the habitation of the LORD, and turned their backs.
    translation: JPS 1917
    original: כִּי־מָעֲלוּ אֲבֹתֵינוּ וְעָשׂוּ הָרַע בְּעֵינֵי יְהוָה־אֱלֹהֵינוּ וַיַּעַזְבֻהוּ וַיַּסֵּבּוּ פְנֵיהֶם מִמִּשְׁכַּן יְהוָה וַיִּתְּנוּ־עֹרֶף׃
    hebrewPlain: כי מעלו אבתינו ועשו הרע בעיני יהוה אלהינו ויעזבהו ויסבו פניהם ממשכן יהוה ויתנו ערף
    kjvRefs:
    - 2 Chronicles 29:6
    kjvOsis:
    - 2Chr.29.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:7
    ref: 2 Chronicles 29:7
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 7
    ordinal: 22988
    text: Also they have shut up the doors of the porch, and put out the lamps, and have not burned incense nor offered burnt-offerings in the holy place unto the God of Israel.
    translation: JPS 1917
    original: גַּם סָגְרוּ דַּלְתוֹת הָאוּלָם וַיְכַבּוּ אֶת־הַנֵּרוֹת וּקְטֹרֶת לֹא הִקְטִירוּ וְעֹלָה לֹא־הֶעֱלוּ בַקֹּדֶשׁ לֵאלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: גם סגרו דלתות האולם ויכבו את הנרות וקטרת לא הקטירו ועלה לא העלו בקדש לאלהי ישראל
    kjvRefs:
    - 2 Chronicles 29:7
    kjvOsis:
    - 2Chr.29.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:8
    ref: 2 Chronicles 29:8
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 8
    ordinal: 22989
    text: Wherefore the wrath of the LORD was upon Judah and Jerusalem, and He hath delivered them to be a horror, an astonishment, and a hissing, as ye see with your eyes.
    translation: JPS 1917
    original: וַיְהִי קֶצֶף יְהוָה עַל־יְהוּדָה וִירוּשָׁלִָם וַיִּתְּנֵם לזועה [לְזַעֲוָה] לְשַׁמָּה וְלִשְׁרֵקָה כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם׃
    hebrewPlain: ויהי קצף יהוה על יהודה וירושלם ויתנם לזועה [לזעוה] לשמה ולשרקה כאשר אתם ראים בעיניכם
    kjvRefs:
    - 2 Chronicles 29:8
    kjvOsis:
    - 2Chr.29.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:9
    ref: 2 Chronicles 29:9
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 9
    ordinal: 22990
    text: For, lo, our fathers have fallen by the sword, and our sons and our daughters and our wives are in captivity for this.
    translation: JPS 1917
    original: וְהִנֵּה נָפְלוּ אֲבוֹתֵינוּ בֶּחָרֶב וּבָנֵינוּ וּבְנוֹתֵינוּ וְנָשֵׁינוּ בַּשְּׁבִי עַל־זֹאת׃
    hebrewPlain: והנה נפלו אבותינו בחרב ובנינו ובנותינו ונשינו בשבי על זאת
    kjvRefs:
    - 2 Chronicles 29:9
    kjvOsis:
    - 2Chr.29.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:10
    ref: 2 Chronicles 29:10
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 10
    ordinal: 22991
    text: Now it is in my heart to make a covenant with the LORD, the God of Israel, that His fierce anger may turn away from us.
    translation: JPS 1917
    original: עַתָּה עִם־לְבָבִי לִכְרוֹת בְּרִית לַיהוָה אֱלֹהֵי יִשְׂרָאֵל וְיָשֹׁב מִמֶּנּוּ חֲרוֹן אַפּוֹ׃
    hebrewPlain: עתה עם לבבי לכרות ברית ליהוה אלהי ישראל וישב ממנו חרון אפו
    kjvRefs:
    - 2 Chronicles 29:10
    kjvOsis:
    - 2Chr.29.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:11
    ref: 2 Chronicles 29:11
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 11
    ordinal: 22992
    text: My sons, be not now negligent; for the LORD hath chosen you to stand before Him, to minister unto Him, and that ye should be His ministers, and offer unto Him.’
    translation: JPS 1917
    original: בָּנַי עַתָּה אַל־תִּשָּׁלוּ כִּי־בָכֶם בָּחַר יְהוָה לַעֲמֹד לְפָנָיו לְשָׁרְתוֹ וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים׃
    hebrewPlain: בני עתה אל תשלו כי בכם בחר יהוה לעמד לפניו לשרתו ולהיות לו משרתים ומקטרים
    kjvRefs:
    - 2 Chronicles 29:11
    kjvOsis:
    - 2Chr.29.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:12
    ref: 2 Chronicles 29:12
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 12
    ordinal: 22993
    text: Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azariah, of the sons of the Kohathites; and of the sons of Merari, Kish the son of Abdi, and Azariah the son of Jehallelel; and of the Gershonites, Joah the son of Zimmah, and Eden the son of Joah;
    translation: JPS 1917
    original: וַיָּקֻמוּ הַלְוִיִּם מַחַת בֶּן־עֲמָשַׂי וְיוֹאֵל בֶּן־עֲזַרְיָהוּ מִן־בְּנֵי הַקְּהָתִי וּמִן־בְּנֵי מְרָרִי קִישׁ בֶּן־עַבְדִּי וַעֲזַרְיָהוּ בֶּן־יְהַלֶּלְאֵל וּמִן־הַגֵּרְשֻׁנִּי יוֹאָח בֶּן־זִמָּה וְעֵדֶן בֶּן־יוֹאָח׃
    hebrewPlain: ויקמו הלוים מחת בן עמשי ויואל בן עזריהו מן בני הקהתי ומן בני מררי קיש בן עבדי ועזריהו בן יהללאל ומן הגרשני יואח בן זמה ועדן בן יואח
    kjvRefs:
    - 2 Chronicles 29:12
    kjvOsis:
    - 2Chr.29.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:13
    ref: 2 Chronicles 29:13
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 13
    ordinal: 22994
    text: and of the sons of Elizaphan, Shimri and Jeiel; and of the sons of Asaph, Zechariah and Mattaniah;
    translation: JPS 1917
    original: וּמִן־בְּנֵי אֱלִיצָפָן שִׁמְרִי ויעואל [וִיעִיאֵל] וּמִן־בְּנֵי אָסָף זְכַרְיָהוּ וּמַתַּנְיָהוּ׃
    hebrewPlain: ומן בני אליצפן שמרי ויעואל [ויעיאל] ומן בני אסף זכריהו ומתניהו
    kjvRefs:
    - 2 Chronicles 29:13
    kjvOsis:
    - 2Chr.29.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:14
    ref: 2 Chronicles 29:14
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 14
    ordinal: 22995
    text: and of the sons of Heman, Jehiel and Shimei; and of the sons of Jeduthun, Shemaiah and Uzziel.
    translation: JPS 1917
    original: וּמִן־בְּנֵי הֵימָן יחואל [יְחִיאֵל] וְשִׁמְעִי וּמִן־בְּנֵי יְדוּתוּן שְׁמַעְיָה וְעֻזִּיאֵל׃
    hebrewPlain: ומן בני הימן יחואל [יחיאל] ושמעי ומן בני ידותון שמעיה ועזיאל
    kjvRefs:
    - 2 Chronicles 29:14
    kjvOsis:
    - 2Chr.29.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:15
    ref: 2 Chronicles 29:15
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 15
    ordinal: 22996
    text: And they gathered their brethren, and sanctified themselves, and went in, according to the commandment of the king by the words of the LORD, to cleanse the house of the LORD.
    translation: JPS 1917
    original: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם וַיִּתְקַדְּשׁוּ וַיָּבֹאוּ כְמִצְוַת־הַמֶּלֶךְ בְּדִבְרֵי יְהוָה לְטַהֵר בֵּית יְהוָה׃
    hebrewPlain: ויאספו את אחיהם ויתקדשו ויבאו כמצות המלך בדברי יהוה לטהר בית יהוה
    kjvRefs:
    - 2 Chronicles 29:15
    kjvOsis:
    - 2Chr.29.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:16
    ref: 2 Chronicles 29:16
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 16
    ordinal: 22997
    text: And the priests went in unto the inner part of the house of the LORD, to cleanse it, and brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD. And the Levites took it, to carry it out abroad to the brook Kidron.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַכֹּהֲנִים לִפְנִימָה בֵית־יְהוָה לְטַהֵר וַיּוֹצִיאוּ אֵת כָּל־הַטֻּמְאָה אֲשֶׁר מָצְאוּ בְּהֵיכַל יְהוָה לַחֲצַר בֵּית יְהוָה וַיְקַבְּלוּ הַלְוִיִּם לְהוֹצִיא לְנַחַל־קִדְרוֹן חוּצָה׃
    hebrewPlain: ויבאו הכהנים לפנימה בית יהוה לטהר ויוציאו את כל הטמאה אשר מצאו בהיכל יהוה לחצר בית יהוה ויקבלו הלוים להוציא לנחל קדרון חוצה
    kjvRefs:
    - 2 Chronicles 29:16
    kjvOsis:
    - 2Chr.29.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:17
    ref: 2 Chronicles 29:17
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 17
    ordinal: 22998
    text: Now they began on the first day of the first month to sanctify, and on the eighth day of the month came they to the porch of the LORD; and they sanctified the house of the LORD in eight days; and on the sixteenth day of the first month they made an end.
    translation: JPS 1917
    original: וַיָּחֵלּוּ בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן לְקַדֵּשׁ וּבְיוֹם שְׁמוֹנָה לַחֹדֶשׁ בָּאוּ לְאוּלָם יְהוָה וַיְקַדְּשׁוּ אֶת־בֵּית־יְהוָה לְיָמִים שְׁמוֹנָה וּבְיוֹם שִׁשָּׁה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן כִּלּוּ׃
    hebrewPlain: ויחלו באחד לחדש הראשון לקדש וביום שמונה לחדש באו לאולם יהוה ויקדשו את בית יהוה לימים שמונה וביום ששה עשר לחדש הראשון כלו
    kjvRefs:
    - 2 Chronicles 29:17
    kjvOsis:
    - 2Chr.29.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:18
    ref: 2 Chronicles 29:18
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 18
    ordinal: 22999
    text: 'Then they went in to Hezekiah the king within [the palace], and said: ‘We have cleansed all the house of the LORD, even the altar of burnt-offering, with all the vessels thereof, and the table of showbread, with all the vessels thereof.'
    translation: JPS 1917
    original: וַיָּבוֹאוּ פְנִימָה אֶל־חִזְקִיָּהוּ הַמֶּלֶךְ וַיֹּאמְרוּ טִהַרְנוּ אֶת־כָּל־בֵּית יְהוָה אֶת־מִזְבַּח הָעוֹלָה וְאֶת־כָּל־כֵּלָיו וְאֶת־שֻׁלְחַן הַמַּעֲרֶכֶת וְאֶת־כָּל־כֵּלָיו׃
    hebrewPlain: ויבואו פנימה אל חזקיהו המלך ויאמרו טהרנו את כל בית יהוה את מזבח העולה ואת כל כליו ואת שלחן המערכת ואת כל כליו
    kjvRefs:
    - 2 Chronicles 29:18
    kjvOsis:
    - 2Chr.29.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:19
    ref: 2 Chronicles 29:19
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 19
    ordinal: 23000
    text: Moreover all the vessels, which king Ahaz in his reign did cast away when he acted treacherously, have we prepared and sanctified; and, behold, they are before the altar of the LORD.’
    translation: JPS 1917
    original: וְאֵת כָּל־הַכֵּלִים אֲשֶׁר הִזְנִיחַ הַמֶּלֶךְ אָחָז בְּמַלְכוּתוֹ בְּמַעֲלוֹ הֵכַנּוּ וְהִקְדָּשְׁנוּ וְהִנָּם לִפְנֵי מִזְבַּח יְהוָה׃
    hebrewPlain: ואת כל הכלים אשר הזניח המלך אחז במלכותו במעלו הכנו והקדשנו והנם לפני מזבח יהוה
    kjvRefs:
    - 2 Chronicles 29:19
    kjvOsis:
    - 2Chr.29.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:20
    ref: 2 Chronicles 29:20
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 20
    ordinal: 23001
    text: Then Hezekiah the king arose early, and gathered the princes of the city, and went up to the house of the LORD.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְחִזְקִיָּהוּ הַמֶּלֶךְ וַיֶּאֱסֹף אֵת שָׂרֵי הָעִיר וַיַּעַל בֵּית יְהוָה׃
    hebrewPlain: וישכם יחזקיהו המלך ויאסף את שרי העיר ויעל בית יהוה
    kjvRefs:
    - 2 Chronicles 29:20
    kjvOsis:
    - 2Chr.29.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:21
    ref: 2 Chronicles 29:21
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 21
    ordinal: 23002
    text: And they brought seven bullocks, and seven rams, and seven lambs, and seven he-goats, for a sin-offering for the kingdom and for the sanctuary and for Judah. And he commanded the priests the sons of Aaron to offer them on the altar of the LORD.
    translation: JPS 1917
    original: וַיָּבִיאוּ פָרִים־שִׁבְעָה וְאֵילִים שִׁבְעָה וּכְבָשִׂים שִׁבְעָה וּצְפִירֵי עִזִּים שִׁבְעָה לְחַטָּאת עַל־הַמַּמְלָכָה וְעַל־הַמִּקְדָּשׁ וְעַל־יְהוּדָה וַיֹּאמֶר לִבְנֵי אַהֲרֹן הַכֹּהֲנִים לְהַעֲלוֹת עַל־מִזְבַּח יְהוָה׃
    hebrewPlain: ויביאו פרים שבעה ואילים שבעה וכבשים שבעה וצפירי עזים שבעה לחטאת על הממלכה ועל המקדש ועל יהודה ויאמר לבני אהרן הכהנים להעלות על מזבח יהוה
    kjvRefs:
    - 2 Chronicles 29:21
    kjvOsis:
    - 2Chr.29.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:22
    ref: 2 Chronicles 29:22
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 22
    ordinal: 23003
    text: So they killed the bullocks, and the priests received the blood, and dashed it against the altar; and they killed the rams, and dashed the blood against the altar; they killed also the lambs, and dashed the blood against the altar.
    translation: JPS 1917
    original: וַיִּשְׁחֲטוּ הַבָּקָר וַיְקַבְּלוּ הַכֹּהֲנִים אֶת־הַדָּם וַיִּזְרְקוּ הַמִּזְבֵּחָה וַיִּשְׁחֲטוּ הָאֵלִים וַיִּזְרְקוּ הַדָּם הַמִּזְבֵּחָה וַיִּשְׁחֲטוּ הַכְּבָשִׂים וַיִּזְרְקוּ הַדָּם הַמִּזְבֵּחָה׃
    hebrewPlain: וישחטו הבקר ויקבלו הכהנים את הדם ויזרקו המזבחה וישחטו האלים ויזרקו הדם המזבחה וישחטו הכבשים ויזרקו הדם המזבחה
    kjvRefs:
    - 2 Chronicles 29:22
    kjvOsis:
    - 2Chr.29.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:23
    ref: 2 Chronicles 29:23
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 23
    ordinal: 23004
    text: And they brought near the he-goats for the sin-offering before the king and the congregation, and they laid their hands upon them;
    translation: JPS 1917
    original: וַיַּגִּישׁוּ אֶת־שְׂעִירֵי הַחַטָּאת לִפְנֵי הַמֶּלֶךְ וְהַקָּהָל וַיִּסְמְכוּ יְדֵיהֶם עֲלֵיהֶם׃
    hebrewPlain: ויגישו את שעירי החטאת לפני המלך והקהל ויסמכו ידיהם עליהם
    kjvRefs:
    - 2 Chronicles 29:23
    kjvOsis:
    - 2Chr.29.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:24
    ref: 2 Chronicles 29:24
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 24
    ordinal: 23005
    text: and the priests killed them, and they made a sin-offering with their blood upon the altar, to make atonement for all Israel; for the king commanded that the burnt-offering and the sin-offering should be made for all Israel.
    translation: JPS 1917
    original: וַיִּשְׁחָטוּם הַכֹּהֲנִים וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה לְכַפֵּר עַל־כָּל־יִשְׂרָאֵל כִּי לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ הָעוֹלָה וְהַחַטָּאת׃
    hebrewPlain: וישחטום הכהנים ויחטאו את דמם המזבחה לכפר על כל ישראל כי לכל ישראל אמר המלך העולה והחטאת
    kjvRefs:
    - 2 Chronicles 29:24
    kjvOsis:
    - 2Chr.29.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:25
    ref: 2 Chronicles 29:25
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 25
    ordinal: 23006
    text: And he set the Levites in the house of the LORD with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king’s seer, and Nathan the prophet; for the commandment was of the LORD by His prophets.
    translation: JPS 1917
    original: וַיַּעֲמֵד אֶת־הַלְוִיִּם בֵּית יְהוָה בִּמְצִלְתַּיִם בִּנְבָלִים וּבְכִנֹּרוֹת בְּמִצְוַת דָּוִיד וְגָד חֹזֵה־הַמֶּלֶךְ וְנָתָן הַנָּבִיא כִּי בְיַד־יְהוָה הַמִּצְוָה בְּיַד־נְבִיאָיו׃
    hebrewPlain: ויעמד את הלוים בית יהוה במצלתים בנבלים ובכנרות במצות דויד וגד חזה המלך ונתן הנביא כי ביד יהוה המצוה ביד נביאיו
    kjvRefs:
    - 2 Chronicles 29:25
    kjvOsis:
    - 2Chr.29.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:26
    ref: 2 Chronicles 29:26
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 26
    ordinal: 23007
    text: And the Levites stood with the instruments of David, and the priests with the trumpets.
    translation: JPS 1917
    original: וַיַּעַמְדוּ הַלְוִיִּם בִּכְלֵי דָוִיד וְהַכֹּהֲנִים בַּחֲצֹצְרוֹת׃
    hebrewPlain: ויעמדו הלוים בכלי דויד והכהנים בחצצרות
    kjvRefs:
    - 2 Chronicles 29:26
    kjvOsis:
    - 2Chr.29.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:27
    ref: 2 Chronicles 29:27
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 27
    ordinal: 23008
    text: And Hezekiah commanded to offer the burnt-offering upon the altar. And when the burnt-offering began, the song of the LORD began also, and the trumpets, together with the instruments of David king of Israel.
    translation: JPS 1917
    original: וַיֹּאמֶר חִזְקִיָּהוּ לְהַעֲלוֹת הָעֹלָה לְהַמִּזְבֵּחַ וּבְעֵת הֵחֵל הָעוֹלָה הֵחֵל שִׁיר־יְהוָה וְהַחֲצֹצְרוֹת וְעַל־יְדֵי כְּלֵי דָּוִיד מֶלֶךְ־יִשְׂרָאֵל׃
    hebrewPlain: ויאמר חזקיהו להעלות העלה להמזבח ובעת החל העולה החל שיר יהוה והחצצרות ועל ידי כלי דויד מלך ישראל
    kjvRefs:
    - 2 Chronicles 29:27
    kjvOsis:
    - 2Chr.29.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:28
    ref: 2 Chronicles 29:28
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 28
    ordinal: 23009
    text: And all the congregation prostrated themselves, and the singers sang, and the trumpeters sounded; all this continued until the burnt-offering was finished.
    translation: JPS 1917
    original: וְכָל־הַקָּהָל מִשְׁתַּחֲוִים וְהַשִּׁיר מְשׁוֹרֵר וְהַחֲצֹצְרוֹת מחצצרים [מַחְצְרִים] הַכֹּל עַד לִכְלוֹת הָעֹלָה׃
    hebrewPlain: וכל הקהל משתחוים והשיר משורר והחצצרות מחצצרים [מחצרים] הכל עד לכלות העלה
    kjvRefs:
    - 2 Chronicles 29:28
    kjvOsis:
    - 2Chr.29.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:29
    ref: 2 Chronicles 29:29
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 29
    ordinal: 23010
    text: And when they had made an end of offering, the king and all that were present with him bowed themselves and prostrated themselves.
    translation: JPS 1917
    original: וּכְכַלּוֹת לְהַעֲלוֹת כָּרְעוּ הַמֶּלֶךְ וְכָל־הַנִּמְצְאִים אִתּוֹ וַיִּשְׁתַּחֲווּ׃
    hebrewPlain: וככלות להעלות כרעו המלך וכל הנמצאים אתו וישתחוו
    kjvRefs:
    - 2 Chronicles 29:29
    kjvOsis:
    - 2Chr.29.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:30
    ref: 2 Chronicles 29:30
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 30
    ordinal: 23011
    text: Moreover Hezekiah the king and the princes commanded the Levites to sing praises unto the LORD with the words of David, and of Asaph the seer. And they sang praises with gladness, and they bowed their heads and prostrated themselves.
    translation: JPS 1917
    original: וַיֹּאמֶר יְחִזְקִיָּהוּ הַמֶּלֶךְ וְהַשָּׂרִים לַלְוִיִּם לְהַלֵּל לַיהוָה בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה וַיְהַלְלוּ עַד־לְשִׂמְחָה וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ׃
    hebrewPlain: ויאמר יחזקיהו המלך והשרים ללוים להלל ליהוה בדברי דויד ואסף החזה ויהללו עד לשמחה ויקדו וישתחוו
    kjvRefs:
    - 2 Chronicles 29:30
    kjvOsis:
    - 2Chr.29.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:31
    ref: 2 Chronicles 29:31
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 31
    ordinal: 23012
    text: 'Then Hezekiah answered and said: ‘Now ye have consecrated yourselves unto the LORD, come near and bring sacrifices and thank-offerings into the house of the LORD.’ And the congregation brought in sacrifices and thank-offerings; and as many as were of a willing heart brought burnt-offerings.'
    translation: JPS 1917
    original: וַיַּעַן יְחִזְקִיָּהוּ וַיֹּאמֶר עַתָּה מִלֵּאתֶם יֶדְכֶם לַיהוָה גֹּשׁוּ וְהָבִיאוּ זְבָחִים וְתוֹדוֹת לְבֵית יְהוָה וַיָּבִיאוּ הַקָּהָל זְבָחִים וְתוֹדוֹת וְכָל־נְדִיב לֵב עֹלוֹת׃
    hebrewPlain: ויען יחזקיהו ויאמר עתה מלאתם ידכם ליהוה גשו והביאו זבחים ותודות לבית יהוה ויביאו הקהל זבחים ותודות וכל נדיב לב עלות
    kjvRefs:
    - 2 Chronicles 29:31
    kjvOsis:
    - 2Chr.29.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:32
    ref: 2 Chronicles 29:32
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 32
    ordinal: 23013
    text: And the number of the burnt-offerings, which the congregation brought, was threescore and ten bullocks, a hundred rams, and two hundred lambs; all these were for a burnt-offering to the LORD.
    translation: JPS 1917
    original: וַיְהִי מִסְפַּר הָעֹלָה אֲשֶׁר הֵבִיאוּ הַקָּהָל בָּקָר שִׁבְעִים אֵילִים מֵאָה כְּבָשִׂים מָאתָיִם לְעֹלָה לַיהוָה כָּל־אֵלֶּה׃
    hebrewPlain: ויהי מספר העלה אשר הביאו הקהל בקר שבעים אילים מאה כבשים מאתים לעלה ליהוה כל אלה
    kjvRefs:
    - 2 Chronicles 29:32
    kjvOsis:
    - 2Chr.29.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:33
    ref: 2 Chronicles 29:33
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 33
    ordinal: 23014
    text: And the consecrated things were six hundred oxen and three thousand sheep.
    translation: JPS 1917
    original: וְהַקֳּדָשִׁים בָּקָר שֵׁשׁ מֵאוֹת וְצֹאן שְׁלֹשֶׁת אֲלָפִים׃
    hebrewPlain: והקדשים בקר שש מאות וצאן שלשת אלפים
    kjvRefs:
    - 2 Chronicles 29:33
    kjvOsis:
    - 2Chr.29.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.34
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:34
    ref: 2 Chronicles 29:34
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 34
    ordinal: 23015
    text: But the priests were too few, so that they could not flay all the burnt-offerings; wherefore their brethren the Levites did help them, till the work was ended, and until the priests had sanctified themselves; for the Levites were more upright in heart to sanctify themselves than the priests.
    translation: JPS 1917
    original: רַק הַכֹּהֲנִים הָיוּ לִמְעָט וְלֹא יָכְלוּ לְהַפְשִׁיט אֶת־כָּל־הָעֹלוֹת וַיְּחַזְּקוּם אֲחֵיהֶם הַלְוִיִּם עַד־כְּלוֹת הַמְּלָאכָה וְעַד יִתְקַדְּשׁוּ הַכֹּהֲנִים כִּי הַלְוִיִּם יִשְׁרֵי לֵבָב לְהִתְקַדֵּשׁ מֵהַכֹּהֲנִים׃
    hebrewPlain: רק הכהנים היו למעט ולא יכלו להפשיט את כל העלות ויחזקום אחיהם הלוים עד כלות המלאכה ועד יתקדשו הכהנים כי הלוים ישרי לבב להתקדש מהכהנים
    kjvRefs:
    - 2 Chronicles 29:34
    kjvOsis:
    - 2Chr.29.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.35
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:35
    ref: 2 Chronicles 29:35
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 35
    ordinal: 23016
    text: And also the burnt-offerings were in abundance, with the fat of the peace-offerings, and the drink-offerings for every burnt-offering. So the service of the house of the LORD was firmly established.
    translation: JPS 1917
    original: וְגַם־עֹלָה לָרֹב בְּחֶלְבֵי הַשְּׁלָמִים וּבַנְּסָכִים לָעֹלָה וַתִּכּוֹן עֲבוֹדַת בֵּית־יְהוָה׃
    hebrewPlain: וגם עלה לרב בחלבי השלמים ובנסכים לעלה ותכון עבודת בית יהוה
    kjvRefs:
    - 2 Chronicles 29:35
    kjvOsis:
    - 2Chr.29.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.29.36
    scripture: tanakh
    name: Tanakh 2 Chronicles 29:36
    ref: 2 Chronicles 29:36
    book: 2Chr
    section: ketuvim
    chapter: 29
    verse: 36
    ordinal: 23017
    text: And Hezekiah rejoiced, and all the people, because of that which God had prepared for the people; for the thing was done suddenly.
    translation: JPS 1917
    original: וַיִּשְׂמַח יְחִזְקִיָּהוּ וְכָל־הָעָם עַל הַהֵכִין הָאֱלֹהִים לָעָם כִּי בְּפִתְאֹם הָיָה הַדָּבָר׃
    hebrewPlain: וישמח יחזקיהו וכל העם על ההכין האלהים לעם כי בפתאם היה הדבר
    kjvRefs:
    - 2 Chronicles 29:36
    kjvOsis:
    - 2Chr.29.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.29
- type: TanakhVerse
  data:
    osis: 2Chr.30.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:1
    ref: 2 Chronicles 30:1
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 1
    ordinal: 23018
    text: And Hezekiah sent to all Israel and Judah, and wrote letters also to Ephraim and Manasseh, that they should come to the house of the LORD at Jerusalem, to keep the passover unto the LORD, the God of Israel.
    translation: JPS 1917
    original: וַיִּשְׁלַח יְחִזְקִיָּהוּ עַל־כָּל־יִשְׂרָאֵל וִיהוּדָה וְגַם־אִגְּרוֹת כָּתַב עַל־אֶפְרַיִם וּמְנַשֶּׁה לָבוֹא לְבֵית־יְהוָה בִּירוּשָׁלִָם לַעֲשׂוֹת פֶּסַח לַיהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: וישלח יחזקיהו על כל ישראל ויהודה וגם אגרות כתב על אפרים ומנשה לבוא לבית יהוה בירושלם לעשות פסח ליהוה אלהי ישראל
    kjvRefs:
    - 2 Chronicles 30:1
    kjvOsis:
    - 2Chr.30.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:2
    ref: 2 Chronicles 30:2
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 2
    ordinal: 23019
    text: For the king had taken counsel, and his princes, and all the congregation in Jerusalem, to keep the passover in the second month.
    translation: JPS 1917
    original: וַיִּוָּעַץ הַמֶּלֶךְ וְשָׂרָיו וְכָל־הַקָּהָל בִּירוּשָׁלִָם לַעֲשׂוֹת הַפֶּסַח בַּחֹדֶשׁ הַשֵּׁנִי׃
    hebrewPlain: ויועץ המלך ושריו וכל הקהל בירושלם לעשות הפסח בחדש השני
    kjvRefs:
    - 2 Chronicles 30:2
    kjvOsis:
    - 2Chr.30.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:3
    ref: 2 Chronicles 30:3
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 3
    ordinal: 23020
    text: For they could not keep it at that time, because the priests had not sanctified themselves in sufficient number, neither had the people gathered themselves together to Jerusalem.
    translation: JPS 1917
    original: כִּי לֹא יָכְלוּ לַעֲשֹׂתוֹ בָּעֵת הַהִיא כִּי הַכֹּהֲנִים לֹא־הִתְקַדְּשׁוּ לְמַדַּי וְהָעָם לֹא־נֶאֶסְפוּ לִירוּשָׁלִָם׃
    hebrewPlain: כי לא יכלו לעשתו בעת ההיא כי הכהנים לא התקדשו למדי והעם לא נאספו לירושלם
    kjvRefs:
    - 2 Chronicles 30:3
    kjvOsis:
    - 2Chr.30.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:4
    ref: 2 Chronicles 30:4
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 4
    ordinal: 23021
    text: And the thing was right in the eyes of the king and of all the congregation.
    translation: JPS 1917
    original: וַיִּישַׁר הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ וּבְעֵינֵי כָּל־הַקָּהָל׃
    hebrewPlain: ויישר הדבר בעיני המלך ובעיני כל הקהל
    kjvRefs:
    - 2 Chronicles 30:4
    kjvOsis:
    - 2Chr.30.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:5
    ref: 2 Chronicles 30:5
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 5
    ordinal: 23022
    text: So they established a decree to make proclamation throughout all Israel, from Beer-sheba even to Dan, that they should come to keep the passover unto the LORD, the God of Israel, at Jerusalem; for they had not kept it in great numbers according as it is written.
    translation: JPS 1917
    original: וַיַּעֲמִידוּ דָבָר לְהַעֲבִיר קוֹל בְּכָל־יִשְׂרָאֵל מִבְּאֵר־שֶׁבַע וְעַד־דָּן לָבוֹא לַעֲשׂוֹת פֶּסַח לַיהוָה אֱלֹהֵי־יִשְׂרָאֵל בִּירוּשָׁלִָם כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב׃
    hebrewPlain: ויעמידו דבר להעביר קול בכל ישראל מבאר שבע ועד דן לבוא לעשות פסח ליהוה אלהי ישראל בירושלם כי לא לרב עשו ככתוב
    kjvRefs:
    - 2 Chronicles 30:5
    kjvOsis:
    - 2Chr.30.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:6
    ref: 2 Chronicles 30:6
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 6
    ordinal: 23023
    text: 'So the posts went with the letters from the king and his princes throughout all Israel and Judah, and according to the commandment of the king, saying: ‘Ye children of Israel, turn back unto the LORD, the God of Abraham, Isaac, and Israel, that He may return to the remnant that are escaped of you out of the hand of the kings of Assyria.'
    translation: JPS 1917
    original: וַיֵּלְכוּ הָרָצִים בָּאִגְּרוֹת מִיַּד הַמֶּלֶךְ וְשָׂרָיו בְּכָל־יִשְׂרָאֵל וִיהוּדָה וּכְמִצְוַת הַמֶּלֶךְ לֵאמֹר בְּנֵי יִשְׂרָאֵל שׁוּבוּ אֶל־יְהוָה אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל וְיָשֹׁב אֶל־הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם מִכַּף מַלְכֵי אַשּׁוּר׃
    hebrewPlain: וילכו הרצים באגרות מיד המלך ושריו בכל ישראל ויהודה וכמצות המלך לאמר בני ישראל שובו אל יהוה אלהי אברהם יצחק וישראל וישב אל הפליטה הנשארת לכם מכף מלכי אשור
    kjvRefs:
    - 2 Chronicles 30:6
    kjvOsis:
    - 2Chr.30.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:7
    ref: 2 Chronicles 30:7
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 7
    ordinal: 23024
    text: And be not ye like your fathers, and like your brethren, who acted treacherously against the LORD, the God of their fathers, so that He delivered them to be an astonishment, as ye see.
    translation: JPS 1917
    original: וְאַל־תִּהְיוּ כַּאֲבוֹתֵיכֶם וְכַאֲחֵיכֶם אֲשֶׁר מָעֲלוּ בַּיהוָה אֱלֹהֵי אֲבוֹתֵיהֶם וַיִּתְּנֵם לְשַׁמָּה כַּאֲשֶׁר אַתֶּם רֹאִים׃
    hebrewPlain: ואל תהיו כאבותיכם וכאחיכם אשר מעלו ביהוה אלהי אבותיהם ויתנם לשמה כאשר אתם ראים
    kjvRefs:
    - 2 Chronicles 30:7
    kjvOsis:
    - 2Chr.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:8
    ref: 2 Chronicles 30:8
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 8
    ordinal: 23025
    text: Now be ye not stiffnecked, as your fathers were; but yield yourselves unto the LORD, and enter into His sanctuary, which He hath sanctified for ever, and serve the LORD your God, that His fierce anger may turn away from you.
    translation: JPS 1917
    original: עַתָּה אַל־תַּקְשׁוּ עָרְפְּכֶם כַּאֲבוֹתֵיכֶם תְּנוּ־יָד לַיהוָה וּבֹאוּ לְמִקְדָּשׁוֹ אֲשֶׁר הִקְדִּישׁ לְעוֹלָם וְעִבְדוּ אֶת־יְהוָה אֱלֹהֵיכֶם וְיָשֹׁב מִכֶּם חֲרוֹן אַפּוֹ׃
    hebrewPlain: עתה אל תקשו ערפכם כאבותיכם תנו יד ליהוה ובאו למקדשו אשר הקדיש לעולם ועבדו את יהוה אלהיכם וישב מכם חרון אפו
    kjvRefs:
    - 2 Chronicles 30:8
    kjvOsis:
    - 2Chr.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:9
    ref: 2 Chronicles 30:9
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 9
    ordinal: 23026
    text: For if ye turn back unto the LORD, your brethren and your children shall find compassion before them that led them captive, and shall come back into this land; for the LORD your God is gracious and merciful, and will not turn away His face from you, if ye return unto Him.’
    translation: JPS 1917
    original: כִּי בְשׁוּבְכֶם עַל־יְהוָה אֲחֵיכֶם וּבְנֵיכֶם לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם וְלָשׁוּב לָאָרֶץ הַזֹּאת כִּי־חַנּוּן וְרַחוּם יְהוָה אֱלֹהֵיכֶם וְלֹא־יָסִיר פָּנִים מִכֶּם אִם־תָּשׁוּבוּ אֵלָיו׃
    hebrewPlain: כי בשובכם על יהוה אחיכם ובניכם לרחמים לפני שוביהם ולשוב לארץ הזאת כי חנון ורחום יהוה אלהיכם ולא יסיר פנים מכם אם תשובו אליו
    kjvRefs:
    - 2 Chronicles 30:9
    kjvOsis:
    - 2Chr.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:10
    ref: 2 Chronicles 30:10
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 10
    ordinal: 23027
    text: So the posts passed from city to city through the country of Ephraim and Manasseh, even unto Zebulun; but they laughed them to scorn, and mocked them.
    translation: JPS 1917
    original: וַיִּהְיוּ הָרָצִים עֹבְרִים מֵעִיר לָעִיר בְּאֶרֶץ־אֶפְרַיִם וּמְנַשֶּׁה וְעַד־זְבֻלוּן וַיִּהְיוּ מַשְׂחִיקִים עֲלֵיהֶם וּמַלְעִגִים בָּם׃
    hebrewPlain: ויהיו הרצים עברים מעיר לעיר בארץ אפרים ומנשה ועד זבלון ויהיו משחיקים עליהם ומלעגים בם
    kjvRefs:
    - 2 Chronicles 30:10
    kjvOsis:
    - 2Chr.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:11
    ref: 2 Chronicles 30:11
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 11
    ordinal: 23028
    text: Nevertheless divers of Asher and Manasseh and of Zebulun humbled themselves, and came to Jerusalem.
    translation: JPS 1917
    original: אַךְ־אֲנָשִׁים מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן נִכְנְעוּ וַיָּבֹאוּ לִירוּשָׁלִָם׃
    hebrewPlain: אך אנשים מאשר ומנשה ומזבלון נכנעו ויבאו לירושלם
    kjvRefs:
    - 2 Chronicles 30:11
    kjvOsis:
    - 2Chr.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:12
    ref: 2 Chronicles 30:12
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 12
    ordinal: 23029
    text: Also in Judah was the hand of God to give them one heart, to do the commandment of the king and of the princes by the word of the LORD.
    translation: JPS 1917
    original: גַּם בִּיהוּדָה הָיְתָה יַד הָאֱלֹהִים לָתֵת לָהֶם לֵב אֶחָד לַעֲשׂוֹת מִצְוַת הַמֶּלֶךְ וְהַשָּׂרִים בִּדְבַר יְהוָה׃
    hebrewPlain: גם ביהודה היתה יד האלהים לתת להם לב אחד לעשות מצות המלך והשרים בדבר יהוה
    kjvRefs:
    - 2 Chronicles 30:12
    kjvOsis:
    - 2Chr.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:13
    ref: 2 Chronicles 30:13
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 13
    ordinal: 23030
    text: And there assembled at Jerusalem much people to keep the feast of unleavened bread in the second month, a very great congregation.
    translation: JPS 1917
    original: וַיֵּאָסְפוּ יְרוּשָׁלִַם עַם־רָב לַעֲשׂוֹת אֶת־חַג הַמַּצּוֹת בַּחֹדֶשׁ הַשֵּׁנִי קָהָל לָרֹב מְאֹד׃
    hebrewPlain: ויאספו ירושלם עם רב לעשות את חג המצות בחדש השני קהל לרב מאד
    kjvRefs:
    - 2 Chronicles 30:13
    kjvOsis:
    - 2Chr.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:14
    ref: 2 Chronicles 30:14
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 14
    ordinal: 23031
    text: And they arose and took away the altars that were in Jerusalem, and all the altars for incense took they away, and cast them into the brook Kidron.
    translation: JPS 1917
    original: וַיָּקֻמוּ וַיָּסִירוּ אֶת־הַמִּזְבְּחוֹת אֲשֶׁר בִּירוּשָׁלִָם וְאֵת כָּל־הַמְקַטְּרוֹת הֵסִירוּ וַיַּשְׁלִיכוּ לְנַחַל קִדְרוֹן׃
    hebrewPlain: ויקמו ויסירו את המזבחות אשר בירושלם ואת כל המקטרות הסירו וישליכו לנחל קדרון
    kjvRefs:
    - 2 Chronicles 30:14
    kjvOsis:
    - 2Chr.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:15
    ref: 2 Chronicles 30:15
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 15
    ordinal: 23032
    text: Then they killed the passover lamb on the fourteenth day of the second month; and the priests and the Levites were ashamed, and sanctified themselves, and brought burnt-offerings into the house of the LORD.
    translation: JPS 1917
    original: וַיִּשְׁחֲטוּ הַפֶּסַח בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי וְהַכֹּהֲנִים וְהַלְוִיִּם נִכְלְמוּ וַיִּתְקַדְּשׁוּ וַיָּבִיאוּ עֹלוֹת בֵּית יְהוָה׃
    hebrewPlain: וישחטו הפסח בארבעה עשר לחדש השני והכהנים והלוים נכלמו ויתקדשו ויביאו עלות בית יהוה
    kjvRefs:
    - 2 Chronicles 30:15
    kjvOsis:
    - 2Chr.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:16
    ref: 2 Chronicles 30:16
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 16
    ordinal: 23033
    text: And they stood in their place after their order, according to the law of Moses the man of God; the priests dashed the blood, which they received of the hand of the Levites.
    translation: JPS 1917
    original: וַיַּעַמְדוּ עַל־עָמְדָם כְּמִשְׁפָּטָם כְּתוֹרַת מֹשֶׁה אִישׁ־הָאֱלֹהִים הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם מִיַּד הַלְוִיִּם׃
    hebrewPlain: ויעמדו על עמדם כמשפטם כתורת משה איש האלהים הכהנים זרקים את הדם מיד הלוים
    kjvRefs:
    - 2 Chronicles 30:16
    kjvOsis:
    - 2Chr.30.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:17
    ref: 2 Chronicles 30:17
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 17
    ordinal: 23034
    text: For there were many in the congregation that had not sanctified themselves; therefore the Levites had the charge of killing the passover lambs for every one that was not clean, to sanctify them unto the LORD.
    translation: JPS 1917
    original: כִּי־רַבַּת בַּקָּהָל אֲשֶׁר לֹא־הִתְקַדָּשׁוּ וְהַלְוִיִּם עַל־שְׁחִיטַת הַפְּסָחִים לְכֹל לֹא טָהוֹר לְהַקְדִּישׁ לַיהוָה׃
    hebrewPlain: כי רבת בקהל אשר לא התקדשו והלוים על שחיטת הפסחים לכל לא טהור להקדיש ליהוה
    kjvRefs:
    - 2 Chronicles 30:17
    kjvOsis:
    - 2Chr.30.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:18
    ref: 2 Chronicles 30:18
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 18
    ordinal: 23035
    text: 'For a multitude of the people, even many of Ephraim and Manasseh, Issachar and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it is written. For Hezekiah had prayed for them, saying: ‘The good LORD pardon'
    translation: JPS 1917
    original: כִּי מַרְבִּית הָעָם רַבַּת מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן לֹא הִטֶּהָרוּ כִּי־אָכְלוּ אֶת־הַפֶּסַח בְּלֹא כַכָּתוּב כִּי הִתְפַּלֵּל יְחִזְקִיָּהוּ עֲלֵיהֶם לֵאמֹר יְהוָה הַטּוֹב יְכַפֵּר בְּעַד׃
    hebrewPlain: כי מרבית העם רבת מאפרים ומנשה יששכר וזבלון לא הטהרו כי אכלו את הפסח בלא ככתוב כי התפלל יחזקיהו עליהם לאמר יהוה הטוב יכפר בעד
    kjvRefs:
    - 2 Chronicles 30:18
    kjvOsis:
    - 2Chr.30.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:19
    ref: 2 Chronicles 30:19
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 19
    ordinal: 23036
    text: every one that setteth his heart to seek God, the LORD, the God of his fathers, though [he be] not [cleansed] according to the purification that pertaineth to holy things.’
    translation: JPS 1917
    original: כָּל־לְבָבוֹ הֵכִין לִדְרוֹשׁ הָאֱלֹהִים יְהוָה אֱלֹהֵי אֲבוֹתָיו וְלֹא כְּטָהֳרַת הַקֹּדֶשׁ׃
    hebrewPlain: כל לבבו הכין לדרוש האלהים יהוה אלהי אבותיו ולא כטהרת הקדש
    kjvRefs:
    - 2 Chronicles 30:19
    kjvOsis:
    - 2Chr.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:20
    ref: 2 Chronicles 30:20
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 20
    ordinal: 23037
    text: And the LORD hearkened to Hezekiah, and healed the people.
    translation: JPS 1917
    original: וַיִּשְׁמַע יְהוָה אֶל־יְחִזְקִיָּהוּ וַיִּרְפָּא אֶת־הָעָם׃
    hebrewPlain: וישמע יהוה אל יחזקיהו וירפא את העם
    kjvRefs:
    - 2 Chronicles 30:20
    kjvOsis:
    - 2Chr.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:21
    ref: 2 Chronicles 30:21
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 21
    ordinal: 23038
    text: And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness; and the Levites and the priests praised the LORD day by day, singing with loud instruments unto the LORD.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־יִשְׂרָאֵל הַנִּמְצְאִים בִּירוּשָׁלִַם אֶת־חַג הַמַּצּוֹת שִׁבְעַת יָמִים בְּשִׂמְחָה גְדוֹלָה וּמְהַלְלִים לַיהוָה יוֹם בְּיוֹם הַלְוִיִּם וְהַכֹּהֲנִים בִּכְלֵי־עֹז לַיהוָה׃
    hebrewPlain: ויעשו בני ישראל הנמצאים בירושלם את חג המצות שבעת ימים בשמחה גדולה ומהללים ליהוה יום ביום הלוים והכהנים בכלי עז ליהוה
    kjvRefs:
    - 2 Chronicles 30:21
    kjvOsis:
    - 2Chr.30.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:22
    ref: 2 Chronicles 30:22
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 22
    ordinal: 23039
    text: And Hezekiah spoke encouragingly unto all the Levites that were well skilled in the service of the LORD. So they did eat throughout the feast for the seven days, offering sacrifices of peace-offerings, and giving thanks to the LORD, the God of their fathers.
    translation: JPS 1917
    original: וַיְדַבֵּר יְחִזְקִיָּהוּ עַל־לֵב כָּל־הַלְוִיִּם הַמַּשְׂכִּילִים שֵׂכֶל־טוֹב לַיהוָה וַיֹּאכְלוּ אֶת־הַמּוֹעֵד שִׁבְעַת הַיָּמִים מְזַבְּחִים זִבְחֵי שְׁלָמִים וּמִתְוַדִּים לַיהוָה אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: וידבר יחזקיהו על לב כל הלוים המשכילים שכל טוב ליהוה ויאכלו את המועד שבעת הימים מזבחים זבחי שלמים ומתודים ליהוה אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 30:22
    kjvOsis:
    - 2Chr.30.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:23
    ref: 2 Chronicles 30:23
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 23
    ordinal: 23040
    text: And the whole congregation took counsel to keep other seven days; and they kept other seven days with gladness.
    translation: JPS 1917
    original: וַיִּוָּעֲצוּ כָּל־הַקָּהָל לַעֲשׂוֹת שִׁבְעַת יָמִים אֲחֵרִים וַיַּעֲשׂוּ שִׁבְעַת־יָמִים שִׂמְחָה׃
    hebrewPlain: ויועצו כל הקהל לעשות שבעת ימים אחרים ויעשו שבעת ימים שמחה
    kjvRefs:
    - 2 Chronicles 30:23
    kjvOsis:
    - 2Chr.30.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:24
    ref: 2 Chronicles 30:24
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 24
    ordinal: 23041
    text: For Hezekiah king of Judah did give to the congregation for offerings a thousand bullocks and seven thousand sheep; and the princes gave to the congregation a thousand bullocks and ten thousand sheep; and priests sanctified themselves in great numbers.
    translation: JPS 1917
    original: כִּי חִזְקִיָּהוּ מֶלֶךְ־יְהוּדָה הֵרִים לַקָּהָל אֶלֶף פָּרִים וְשִׁבְעַת אֲלָפִים צֹאן וְהַשָּׂרִים הֵרִימוּ לַקָּהָל פָּרִים אֶלֶף וְצֹאן עֲשֶׂרֶת אֲלָפִים וַיִּתְקַדְּשׁוּ כֹהֲנִים לָרֹב׃
    hebrewPlain: כי חזקיהו מלך יהודה הרים לקהל אלף פרים ושבעת אלפים צאן והשרים הרימו לקהל פרים אלף וצאן עשרת אלפים ויתקדשו כהנים לרב
    kjvRefs:
    - 2 Chronicles 30:24
    kjvOsis:
    - 2Chr.30.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:25
    ref: 2 Chronicles 30:25
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 25
    ordinal: 23042
    text: And all the congregation of Judah, with the priests and the Levites, and all the congregation that came out of Israel, and the strangers that came out of the land of Israel, and that dwelt in Judah, rejoiced.
    translation: JPS 1917
    original: וַיִּשְׂמְחוּ כָּל־קְהַל יְהוּדָה וְהַכֹּהֲנִים וְהַלְוִיִּם וְכָל־הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל וְהַגֵּרִים הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל וְהַיּוֹשְׁבִים בִּיהוּדָה׃
    hebrewPlain: וישמחו כל קהל יהודה והכהנים והלוים וכל הקהל הבאים מישראל והגרים הבאים מארץ ישראל והיושבים ביהודה
    kjvRefs:
    - 2 Chronicles 30:25
    kjvOsis:
    - 2Chr.30.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:26
    ref: 2 Chronicles 30:26
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 26
    ordinal: 23043
    text: So there was great joy in Jerusalem; for since the time of Solomon the son of David king of Israel there was not the like in Jerusalem.
    translation: JPS 1917
    original: וַתְּהִי שִׂמְחָה־גְדוֹלָה בִּירוּשָׁלִָם כִּי מִימֵי שְׁלֹמֹה בֶן־דָּוִיד מֶלֶךְ יִשְׂרָאֵל לֹא כָזֹאת בִּירוּשָׁלִָם׃
    hebrewPlain: ותהי שמחה גדולה בירושלם כי מימי שלמה בן דויד מלך ישראל לא כזאת בירושלם
    kjvRefs:
    - 2 Chronicles 30:26
    kjvOsis:
    - 2Chr.30.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.30.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 30:27
    ref: 2 Chronicles 30:27
    book: 2Chr
    section: ketuvim
    chapter: 30
    verse: 27
    ordinal: 23044
    text: Then the priests the Levites arose and blessed the people; and their voice was heard [of the LORD], and their prayer came up to His holy habitation, even unto heaven.
    translation: JPS 1917
    original: וַיָּקֻמוּ הַכֹּהֲנִים הַלְוִיִּם וַיְבָרֲכוּ אֶת־הָעָם וַיִּשָּׁמַע בְּקוֹלָם וַתָּבוֹא תְפִלָּתָם לִמְעוֹן קָדְשׁוֹ לַשָּׁמָיִם׃
    hebrewPlain: ויקמו הכהנים הלוים ויברכו את העם וישמע בקולם ותבוא תפלתם למעון קדשו לשמים
    kjvRefs:
    - 2 Chronicles 30:27
    kjvOsis:
    - 2Chr.30.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.30
- type: TanakhVerse
  data:
    osis: 2Chr.31.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:1
    ref: 2 Chronicles 31:1
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 1
    ordinal: 23045
    text: Now when all this was finished, all Israel that were present went out to the cities of Judah, and broke in pieces the pillars, and hewed down the Asherim, and broke down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had destroyed them all. Then all the children of Israel returned, every man to his possession, into their own cities.
    translation: JPS 1917
    original: וּכְכַלּוֹת כָּל־זֹאת יָצְאוּ כָּל־יִשְׂרָאֵל הַנִּמְצְאִים לְעָרֵי יְהוּדָה וַיְשַׁבְּרוּ הַמַּצֵּבוֹת וַיְגַדְּעוּ הָאֲשֵׁרִים וַיְנַתְּצוּ אֶת־הַבָּמוֹת וְאֶת־הַמִּזְבְּחֹת מִכָּל־יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה עַד־לְכַלֵּה וַיָּשׁוּבוּ כָּל־בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם׃
    hebrewPlain: וככלות כל זאת יצאו כל ישראל הנמצאים לערי יהודה וישברו המצבות ויגדעו האשרים וינתצו את הבמות ואת המזבחת מכל יהודה ובנימן ובאפרים ומנשה עד לכלה וישובו כל בני ישראל איש לאחזתו לעריהם
    kjvRefs:
    - 2 Chronicles 31:1
    kjvOsis:
    - 2Chr.31.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:2
    ref: 2 Chronicles 31:2
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 2
    ordinal: 23046
    text: And Hezekiah appointed the courses of the priest and the Levites after their courses, every man according to his service, both the priests and the Levites, for burnt-offerings and for peace-offerings, to minister, and to give thanks, and to praise in the gates of the camp of the LORD.
    translation: JPS 1917
    original: וַיַּעֲמֵד יְחִזְקִיָּהוּ אֶת־מַחְלְקוֹת הַכֹּהֲנִים וְהַלְוִיִּם עַל־מַחְלְקוֹתָם אִישׁ כְּפִי עֲבֹדָתוֹ לַכֹּהֲנִים וְלַלְוִיִּם לְעֹלָה וְלִשְׁלָמִים לְשָׁרֵת וּלְהֹדוֹת וּלְהַלֵּל בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה׃
    hebrewPlain: ויעמד יחזקיהו את מחלקות הכהנים והלוים על מחלקותם איש כפי עבדתו לכהנים וללוים לעלה ולשלמים לשרת ולהדות ולהלל בשערי מחנות יהוה
    kjvRefs:
    - 2 Chronicles 31:2
    kjvOsis:
    - 2Chr.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:3
    ref: 2 Chronicles 31:3
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 3
    ordinal: 23047
    text: He appointed also the king’s portion of his substance for the burnt-offerings, to wit, for the morning and evening burnt-offerings, and the burnt-offerings for the sabbaths, and for the new moons, and for the appointed seasons, as it is written in the Law of the LORD.
    translation: JPS 1917
    original: וּמְנָת הַמֶּלֶךְ מִן־רְכוּשׁוֹ לָעֹלוֹת לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים כַּכָּתוּב בְּתוֹרַת יְהוָה׃
    hebrewPlain: ומנת המלך מן רכושו לעלות לעלות הבקר והערב והעלות לשבתות ולחדשים ולמעדים ככתוב בתורת יהוה
    kjvRefs:
    - 2 Chronicles 31:3
    kjvOsis:
    - 2Chr.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:4
    ref: 2 Chronicles 31:4
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 4
    ordinal: 23048
    text: Moreover he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might give themselves to the law of the LORD.
    translation: JPS 1917
    original: וַיֹּאמֶר לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם לָתֵת מְנָת הַכֹּהֲנִים וְהַלְוִיִּם לְמַעַן יֶחֶזְקוּ בְּתוֹרַת יְהוָה׃
    hebrewPlain: ויאמר לעם ליושבי ירושלם לתת מנת הכהנים והלוים למען יחזקו בתורת יהוה
    kjvRefs:
    - 2 Chronicles 31:4
    kjvOsis:
    - 2Chr.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:5
    ref: 2 Chronicles 31:5
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 5
    ordinal: 23049
    text: And as soon as the commandment came abroad, the children of Israel gave in abundance the first-fruits of corn, wine, and oil, and honey, and of all the increase of the field; and the tithe of all things brought they in abundantly.
    translation: JPS 1917
    original: וְכִפְרֹץ הַדָּבָר הִרְבּוּ בְנֵי־יִשְׂרָאֵל רֵאשִׁית דָּגָן תִּירוֹשׁ וְיִצְהָר וּדְבַשׁ וְכֹל תְּבוּאַת שָׂדֶה וּמַעְשַׂר הַכֹּל לָרֹב הֵבִיאוּ׃
    hebrewPlain: וכפרץ הדבר הרבו בני ישראל ראשית דגן תירוש ויצהר ודבש וכל תבואת שדה ומעשר הכל לרב הביאו
    kjvRefs:
    - 2 Chronicles 31:5
    kjvOsis:
    - 2Chr.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:6
    ref: 2 Chronicles 31:6
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 6
    ordinal: 23050
    text: And the children of Israel and Judah, that dwelt in the cities of Judah, they also brought in the tithe of oxen and sheep, and the tithe of hallowed things which were hallowed unto the LORD their God, and laid them by heaps.
    translation: JPS 1917
    original: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה גַּם־הֵם מַעְשַׂר בָּקָר וָצֹאן וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים לַיהוָה אֱלֹהֵיהֶם הֵבִיאוּ וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת׃
    hebrewPlain: ובני ישראל ויהודה היושבים בערי יהודה גם הם מעשר בקר וצאן ומעשר קדשים המקדשים ליהוה אלהיהם הביאו ויתנו ערמות ערמות
    kjvRefs:
    - 2 Chronicles 31:6
    kjvOsis:
    - 2Chr.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:7
    ref: 2 Chronicles 31:7
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 7
    ordinal: 23051
    text: In the third month they began to lay the foundation of the heaps, and finished them in the seventh month.
    translation: JPS 1917
    original: בַּחֹדֶשׁ הַשְּׁלִשִׁי הֵחֵלּוּ הָעֲרֵמוֹת לְיִסּוֹד וּבַחֹדֶשׁ הַשְּׁבִיעִי כִּלּוּ׃
    hebrewPlain: בחדש השלשי החלו הערמות ליסוד ובחדש השביעי כלו
    kjvRefs:
    - 2 Chronicles 31:7
    kjvOsis:
    - 2Chr.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:8
    ref: 2 Chronicles 31:8
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 8
    ordinal: 23052
    text: And when Hezekiah and the princes came and saw the heaps, they blessed the LORD, and His people Israel.
    translation: JPS 1917
    original: וַיָּבֹאוּ יְחִזְקִיָּהוּ וְהַשָּׂרִים וַיִּרְאוּ אֶת־הָעֲרֵמוֹת וַיְבָרֲכוּ אֶת־יְהוָה וְאֵת עַמּוֹ יִשְׂרָאֵל׃
    hebrewPlain: ויבאו יחזקיהו והשרים ויראו את הערמות ויברכו את יהוה ואת עמו ישראל
    kjvRefs:
    - 2 Chronicles 31:8
    kjvOsis:
    - 2Chr.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:9
    ref: 2 Chronicles 31:9
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 9
    ordinal: 23053
    text: Then Hezekiah questioned the priests and the Levites concerning the heaps.
    translation: JPS 1917
    original: וַיִּדְרֹשׁ יְחִזְקִיָּהוּ עַל־הַכֹּהֲנִים וְהַלְוִיִּם עַל־הָעֲרֵמוֹת׃
    hebrewPlain: וידרש יחזקיהו על הכהנים והלוים על הערמות
    kjvRefs:
    - 2 Chronicles 31:9
    kjvOsis:
    - 2Chr.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:10
    ref: 2 Chronicles 31:10
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 10
    ordinal: 23054
    text: 'And Azariah the chief priest, of the house of Zadok, answered him and said: ‘Since the people began to bring the offerings into the house of the LORD, we have eaten and had enough, and have left plenty; for the LORD hath blessed His people; and that which is left is this great store.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו עֲזַרְיָהוּ הַכֹּהֵן הָרֹאשׁ לְבֵית צָדוֹק וַיֹּאמֶר מֵהָחֵל הַתְּרוּמָה לָבִיא בֵית־יְהוָה אָכוֹל וְשָׂבוֹעַ וְהוֹתֵר עַד־לָרוֹב כִּי יְהוָה בֵּרַךְ אֶת־עַמּוֹ וְהַנּוֹתָר אֶת־הֶהָמוֹן הַזֶּה׃
    hebrewPlain: ויאמר אליו עזריהו הכהן הראש לבית צדוק ויאמר מהחל התרומה לביא בית יהוה אכול ושבוע והותר עד לרוב כי יהוה ברך את עמו והנותר את ההמון הזה
    kjvRefs:
    - 2 Chronicles 31:10
    kjvOsis:
    - 2Chr.31.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:11
    ref: 2 Chronicles 31:11
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 11
    ordinal: 23055
    text: Then Hezekiah commanded to prepare chambers in the house of the LORD; and they prepared them.
    translation: JPS 1917
    original: וַיֹּאמֶר יְחִזְקִיָּהוּ לְהָכִין לְשָׁכוֹת בְּבֵית יְהוָה וַיָּכִינוּ׃
    hebrewPlain: ויאמר יחזקיהו להכין לשכות בבית יהוה ויכינו
    kjvRefs:
    - 2 Chronicles 31:11
    kjvOsis:
    - 2Chr.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:12
    ref: 2 Chronicles 31:12
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 12
    ordinal: 23056
    text: And they brought in the offerings and the tithes and the hallowed things faithfully; and over them Conaniah the Levite was ruler, and Shimei his brother was second.
    translation: JPS 1917
    original: וַיָּבִיאוּ אֶת־הַתְּרוּמָה וְהַמַּעֲשֵׂר וְהַקֳּדָשִׁים בֶּאֱמוּנָה וַעֲלֵיהֶם נָגִיד כונניהו [כָּנַנְיָהוּ] הַלֵּוִי וְשִׁמְעִי אָחִיהוּ מִשְׁנֶה׃
    hebrewPlain: ויביאו את התרומה והמעשר והקדשים באמונה ועליהם נגיד כונניהו [כנניהו] הלוי ושמעי אחיהו משנה
    kjvRefs:
    - 2 Chronicles 31:12
    kjvOsis:
    - 2Chr.31.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:13
    ref: 2 Chronicles 31:13
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 13
    ordinal: 23057
    text: And Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, were overseers under the hand of Conaniah and Shimei his brother, by the appointment of Hezekiah the king, and Azariah the ruler of the house of God.
    translation: JPS 1917
    original: וִיחִיאֵל וַעֲזַזְיָהוּ וְנַחַת וַעֲשָׂהאֵל וִירִימוֹת וְיוֹזָבָד וֶאֱלִיאֵל וְיִסְמַכְיָהוּ וּמַחַת וּבְנָיָהוּ פְּקִידִים מִיַּד כונניהו [כָּנַנְיָהוּ] וְשִׁמְעִי אָחִיו בְּמִפְקַד יְחִזְקִיָּהוּ הַמֶּלֶךְ וַעֲזַרְיָהוּ נְגִיד בֵּית־הָאֱלֹהִים׃
    hebrewPlain: ויחיאל ועזזיהו ונחת ועשהאל וירימות ויוזבד ואליאל ויסמכיהו ומחת ובניהו פקידים מיד כונניהו [כנניהו] ושמעי אחיו במפקד יחזקיהו המלך ועזריהו נגיד בית האלהים
    kjvRefs:
    - 2 Chronicles 31:13
    kjvOsis:
    - 2Chr.31.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:14
    ref: 2 Chronicles 31:14
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 14
    ordinal: 23058
    text: And Kore the son of Imnah the Levite, the porter at the east gate, was over the freewill-offerings of God, to distribute the offerings of the LORD, and the most holy things.
    translation: JPS 1917
    original: וְקוֹרֵא בֶן־יִמְנָה הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה עַל נִדְבוֹת הָאֱלֹהִים לָתֵת תְּרוּמַת יְהוָה וְקָדְשֵׁי הַקֳּדָשִׁים׃
    hebrewPlain: וקורא בן ימנה הלוי השוער למזרחה על נדבות האלהים לתת תרומת יהוה וקדשי הקדשים
    kjvRefs:
    - 2 Chronicles 31:14
    kjvOsis:
    - 2Chr.31.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:15
    ref: 2 Chronicles 31:15
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 15
    ordinal: 23059
    text: And under him were Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shecaniah, in the cities of the priests, in their office of trust, to give to their brethren by courses, as well to the great as to the small;
    translation: JPS 1917
    original: וְעַל־יָדוֹ עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ בְּעָרֵי הַכֹּהֲנִים בֶּאֱמוּנָה לָתֵת לַאֲחֵיהֶם בְּמַחְלְקוֹת כַּגָּדוֹל כַּקָּטָן׃
    hebrewPlain: ועל ידו עדן ומנימן וישוע ושמעיהו אמריהו ושכניהו בערי הכהנים באמונה לתת לאחיהם במחלקות כגדול כקטן
    kjvRefs:
    - 2 Chronicles 31:15
    kjvOsis:
    - 2Chr.31.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:16
    ref: 2 Chronicles 31:16
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 16
    ordinal: 23060
    text: beside them that were reckoned by genealogy of males, from three years old and upward, even every one that entered into the house of the LORD, for his daily portion, for their service in their charges according to their courses;
    translation: JPS 1917
    original: מִלְּבַד הִתְיַחְשָׂם לִזְכָרִים מִבֶּן שָׁלוֹשׁ שָׁנִים וּלְמַעְלָה לְכָל־הַבָּא לְבֵית־יְהוָה לִדְבַר־יוֹם בְּיוֹמוֹ לַעֲבוֹדָתָם בְּמִשְׁמְרוֹתָם כְּמַחְלְקוֹתֵיהֶם׃
    hebrewPlain: מלבד התיחשם לזכרים מבן שלוש שנים ולמעלה לכל הבא לבית יהוה לדבר יום ביומו לעבודתם במשמרותם כמחלקותיהם
    kjvRefs:
    - 2 Chronicles 31:16
    kjvOsis:
    - 2Chr.31.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:17
    ref: 2 Chronicles 31:17
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 17
    ordinal: 23061
    text: and them that were reckoned by genealogy of the priests by their fathers’ houses, and the Levites from twenty years old and upward, in their charges by their courses;
    translation: JPS 1917
    original: וְאֵת הִתְיַחֵשׂ הַכֹּהֲנִים לְבֵית אֲבוֹתֵיהֶם וְהַלְוִיִּם מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה בְּמִשְׁמְרוֹתֵיהֶם בְּמַחְלְקוֹתֵיהֶם׃
    hebrewPlain: ואת התיחש הכהנים לבית אבותיהם והלוים מבן עשרים שנה ולמעלה במשמרותיהם במחלקותיהם
    kjvRefs:
    - 2 Chronicles 31:17
    kjvOsis:
    - 2Chr.31.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:18
    ref: 2 Chronicles 31:18
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 18
    ordinal: 23062
    text: even to give to them that were reckoned by genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation; for in their office of trust they administered the sacred gifts;
    translation: JPS 1917
    original: וּלְהִתְיַחֵשׂ בְּכָל־טַפָּם נְשֵׁיהֶם וּבְנֵיהֶם וּבְנוֹתֵיהֶם לְכָל־קָהָל כִּי בֶאֱמוּנָתָם יִתְקַדְּשׁוּ־קֹדֶשׁ׃
    hebrewPlain: ולהתיחש בכל טפם נשיהם ובניהם ובנותיהם לכל קהל כי באמונתם יתקדשו קדש
    kjvRefs:
    - 2 Chronicles 31:18
    kjvOsis:
    - 2Chr.31.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:19
    ref: 2 Chronicles 31:19
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 19
    ordinal: 23063
    text: also for the sons of Aaron the priests, that were in the fields of the open land about their cities, in every city, there were men that were mentioned by name, to give portions to all the males among the priests, and to all that were reckoned by genealogy among the Levites.
    translation: JPS 1917
    original: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם בְּכָל־עִיר וָעִיר אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת לָתֵת מָנוֹת לְכָל־זָכָר בַּכֹּהֲנִים וּלְכָל־הִתְיַחֵשׂ בַּלְוִיִּם׃
    hebrewPlain: ולבני אהרן הכהנים בשדי מגרש עריהם בכל עיר ועיר אנשים אשר נקבו בשמות לתת מנות לכל זכר בכהנים ולכל התיחש בלוים
    kjvRefs:
    - 2 Chronicles 31:19
    kjvOsis:
    - 2Chr.31.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:20
    ref: 2 Chronicles 31:20
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 20
    ordinal: 23064
    text: And thus did Hezekiah throughout all Judah; and he wrought that which was good and right and faithful before the LORD his God.
    translation: JPS 1917
    original: וַיַּעַשׂ כָּזֹאת יְחִזְקִיָּהוּ בְּכָל־יְהוּדָה וַיַּעַשׂ הַטּוֹב וְהַיָּשָׁר וְהָאֱמֶת לִפְנֵי יְהוָה אֱלֹהָיו׃
    hebrewPlain: ויעש כזאת יחזקיהו בכל יהודה ויעש הטוב והישר והאמת לפני יהוה אלהיו
    kjvRefs:
    - 2 Chronicles 31:20
    kjvOsis:
    - 2Chr.31.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.31.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 31:21
    ref: 2 Chronicles 31:21
    book: 2Chr
    section: ketuvim
    chapter: 31
    verse: 21
    ordinal: 23065
    text: And in every work that he began in the service of the house of God, and in the law, and in the commandments, to seek his God, he did it with all his heart, and prospered.
    translation: JPS 1917
    original: וּבְכָל־מַעֲשֶׂה אֲשֶׁר־הֵחֵל בַּעֲבוֹדַת בֵּית־הָאֱלֹהִים וּבַתּוֹרָה וּבַמִּצְוָה לִדְרֹשׁ לֵאלֹהָיו בְּכָל־לְבָבוֹ עָשָׂה וְהִצְלִיחַ׃
    hebrewPlain: ובכל מעשה אשר החל בעבודת בית האלהים ובתורה ובמצוה לדרש לאלהיו בכל לבבו עשה והצליח
    kjvRefs:
    - 2 Chronicles 31:21
    kjvOsis:
    - 2Chr.31.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.31
- type: TanakhVerse
  data:
    osis: 2Chr.32.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:1
    ref: 2 Chronicles 32:1
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 1
    ordinal: 23066
    text: After these things, and this faithfulness, Sennacherib king of Assyria came, and entered into Judah, and encamped against the fortified cities, and thought to make a breach therein for himself.
    translation: JPS 1917
    original: אַחֲרֵי הַדְּבָרִים וְהָאֱמֶת הָאֵלֶּה בָּא סַנְחֵרִיב מֶלֶךְ־אַשּׁוּר וַיָּבֹא בִיהוּדָה וַיִּחַן עַל־הֶעָרִים הַבְּצֻרוֹת וַיֹּאמֶר לְבִקְעָם אֵלָיו׃
    hebrewPlain: אחרי הדברים והאמת האלה בא סנחריב מלך אשור ויבא ביהודה ויחן על הערים הבצרות ויאמר לבקעם אליו
    kjvRefs:
    - 2 Chronicles 32:1
    kjvOsis:
    - 2Chr.32.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:2
    ref: 2 Chronicles 32:2
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 2
    ordinal: 23067
    text: And when Hezekiah saw that Sennacherib was come, and that he was purposed to fight against Jerusalem,
    translation: JPS 1917
    original: וַיַּרְא יְחִזְקִיָּהוּ כִּי־בָא סַנְחֵרִיב וּפָנָיו לַמִּלְחָמָה עַל־יְרוּשָׁלִָם׃
    hebrewPlain: וירא יחזקיהו כי בא סנחריב ופניו למלחמה על ירושלם
    kjvRefs:
    - 2 Chronicles 32:2
    kjvOsis:
    - 2Chr.32.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:3
    ref: 2 Chronicles 32:3
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 3
    ordinal: 23068
    text: he took counsel with his princes and his mighty men to stop the waters of the fountains which were without the city; and they helped him.
    translation: JPS 1917
    original: וַיִּוָּעַץ עִם־שָׂרָיו וְגִבֹּרָיו לִסְתּוֹם אֶת־מֵימֵי הָעֲיָנוֹת אֲשֶׁר מִחוּץ לָעִיר וַיַּעְזְרוּהוּ׃
    hebrewPlain: ויועץ עם שריו וגבריו לסתום את מימי העינות אשר מחוץ לעיר ויעזרוהו
    kjvRefs:
    - 2 Chronicles 32:3
    kjvOsis:
    - 2Chr.32.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:4
    ref: 2 Chronicles 32:4
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 4
    ordinal: 23069
    text: 'So there was gathered much people together, and they stopped all the fountains, and the brook that flowed through the midst of the land, saying: ‘Why should the kings of Assyria come, and find much water?’'
    translation: JPS 1917
    original: וַיִּקָּבְצוּ עַם־רָב וַיִּסְתְּמוּ אֶת־כָּל־הַמַּעְיָנוֹת וְאֶת־הַנַּחַל הַשּׁוֹטֵף בְּתוֹךְ־הָאָרֶץ לֵאמֹר לָמָּה יָבוֹאוּ מַלְכֵי אַשּׁוּר וּמָצְאוּ מַיִם רַבִּים׃
    hebrewPlain: ויקבצו עם רב ויסתמו את כל המעינות ואת הנחל השוטף בתוך הארץ לאמר למה יבואו מלכי אשור ומצאו מים רבים
    kjvRefs:
    - 2 Chronicles 32:4
    kjvOsis:
    - 2Chr.32.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:5
    ref: 2 Chronicles 32:5
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 5
    ordinal: 23070
    text: And he took courage, and built up all the wall that was broken down, and raised it up to the towers, and another wall without, and strengthened Millo in the city of David, and made weapons and shields in abundance.
    translation: JPS 1917
    original: וַיִּתְחַזַּק וַיִּבֶן אֶת־כָּל־הַחוֹמָה הַפְּרוּצָה וַיַּעַל עַל־הַמִּגְדָּלוֹת וְלַחוּצָה הַחוֹמָה אַחֶרֶת וַיְחַזֵּק אֶת־הַמִּלּוֹא עִיר דָּוִיד וַיַּעַשׂ שֶׁלַח לָרֹב וּמָגִנִּים׃
    hebrewPlain: ויתחזק ויבן את כל החומה הפרוצה ויעל על המגדלות ולחוצה החומה אחרת ויחזק את המלוא עיר דויד ויעש שלח לרב ומגנים
    kjvRefs:
    - 2 Chronicles 32:5
    kjvOsis:
    - 2Chr.32.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:6
    ref: 2 Chronicles 32:6
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 6
    ordinal: 23071
    text: 'And he set captains of war over the people, and gathered them together to him in the broad place at the gate of the city, and spoke encouragingly to them, saying:'
    translation: JPS 1917
    original: וַיִּתֵּן שָׂרֵי מִלְחָמוֹת עַל־הָעָם וַיִּקְבְּצֵם אֵלָיו אֶל־רְחוֹב שַׁעַר הָעִיר וַיְדַבֵּר עַל־לְבָבָם לֵאמֹר׃
    hebrewPlain: ויתן שרי מלחמות על העם ויקבצם אליו אל רחוב שער העיר וידבר על לבבם לאמר
    kjvRefs:
    - 2 Chronicles 32:6
    kjvOsis:
    - 2Chr.32.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:7
    ref: 2 Chronicles 32:7
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 7
    ordinal: 23072
    text: '’Be strong and of good courage, be not afraid nor dismayed for the king of Assyria, nor for all the multitude that is with him; for there is a Greater with us than with him:'
    translation: JPS 1917
    original: חִזְקוּ וְאִמְצוּ אַל־תִּירְאוּ וְאַל־תֵּחַתּוּ מִפְּנֵי מֶלֶךְ אַשּׁוּר וּמִלִּפְנֵי כָּל־הֶהָמוֹן אֲשֶׁר־עִמּוֹ כִּי־עִמָּנוּ רַב מֵעִמּוֹ׃
    hebrewPlain: חזקו ואמצו אל תיראו ואל תחתו מפני מלך אשור ומלפני כל ההמון אשר עמו כי עמנו רב מעמו
    kjvRefs:
    - 2 Chronicles 32:7
    kjvOsis:
    - 2Chr.32.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:8
    ref: 2 Chronicles 32:8
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 8
    ordinal: 23073
    text: with him is an arm of flesh; but with us is the LORD our God to help us, and to fight our battles.’ And the people rested themselves upon the words of Hezekiah king of Judah.
    translation: JPS 1917
    original: עִמּוֹ זְרוֹעַ בָּשָׂר וְעִמָּנוּ יְהוָה אֱלֹהֵינוּ לְעָזְרֵנוּ וּלְהִלָּחֵם מִלְחֲמֹתֵנוּ וַיִּסָּמְכוּ הָעָם עַל־דִּבְרֵי יְחִזְקִיָּהוּ מֶלֶךְ־יְהוּדָה׃
    hebrewPlain: עמו זרוע בשר ועמנו יהוה אלהינו לעזרנו ולהלחם מלחמתנו ויסמכו העם על דברי יחזקיהו מלך יהודה
    kjvRefs:
    - 2 Chronicles 32:8
    kjvOsis:
    - 2Chr.32.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:9
    ref: 2 Chronicles 32:9
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 9
    ordinal: 23074
    text: 'After this did Sennacherib king of Assyria send his servants to Jerusalem—now he was before Lachish, and all his power with him—unto Hezekiah king of Judah, and unto all Judah that were at Jerusalem, saying:'
    translation: JPS 1917
    original: אַחַר זֶה שָׁלַח סַנְחֵרִיב מֶלֶךְ־אַשּׁוּר עֲבָדָיו יְרוּשָׁלַיְמָה וְהוּא עַל־לָכִישׁ וְכָל־מֶמְשַׁלְתּוֹ עִמּוֹ עַל־יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וְעַל־כָּל־יְהוּדָה אֲשֶׁר בִּירוּשָׁלִַם לֵאמֹר׃
    hebrewPlain: אחר זה שלח סנחריב מלך אשור עבדיו ירושלימה והוא על לכיש וכל ממשלתו עמו על יחזקיהו מלך יהודה ועל כל יהודה אשר בירושלם לאמר
    kjvRefs:
    - 2 Chronicles 32:9
    kjvOsis:
    - 2Chr.32.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:10
    ref: 2 Chronicles 32:10
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 10
    ordinal: 23075
    text: '’Thus saith Sennacherib king of Assyria: Whereon do ye trust, that ye abide the siege in Jerusalem?'
    translation: JPS 1917
    original: כֹּה אָמַר סַנְחֵרִיב מֶלֶךְ אַשּׁוּר עַל־מָה אַתֶּם בֹּטְחִים וְיֹשְׁבִים בְּמָצוֹר בִּירוּשָׁלִָם׃
    hebrewPlain: כה אמר סנחריב מלך אשור על מה אתם בטחים וישבים במצור בירושלם
    kjvRefs:
    - 2 Chronicles 32:10
    kjvOsis:
    - 2Chr.32.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:11
    ref: 2 Chronicles 32:11
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 11
    ordinal: 23076
    text: 'Doth not Hezekiah persuade you, to give you over to die by famine and by thirst, saying: The LORD our God will deliver us out of the hand of the king of Assyria?'
    translation: JPS 1917
    original: הֲלֹא יְחִזְקִיָּהוּ מַסִּית אֶתְכֶם לָתֵת אֶתְכֶם לָמוּת בְּרָעָב וּבְצָמָא לֵאמֹר יְהוָה אֱלֹהֵינוּ יַצִּילֵנוּ מִכַּף מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: הלא יחזקיהו מסית אתכם לתת אתכם למות ברעב ובצמא לאמר יהוה אלהינו יצילנו מכף מלך אשור
    kjvRefs:
    - 2 Chronicles 32:11
    kjvOsis:
    - 2Chr.32.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:12
    ref: 2 Chronicles 32:12
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 12
    ordinal: 23077
    text: 'Hath not the same Hezekiah taken away His high places and His altars, and commanded Judah and Jerusalem, saying: Ye shall worship before one altar, and upon it shall ye offer?'
    translation: JPS 1917
    original: הֲלֹא־הוּא יְחִזְקִיָּהוּ הֵסִיר אֶת־בָּמֹתָיו וְאֶת־מִזְבְּחֹתָיו וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר לִפְנֵי מִזְבֵּחַ אֶחָד תִּשְׁתַּחֲווּ וְעָלָיו תַּקְטִירוּ׃
    hebrewPlain: הלא הוא יחזקיהו הסיר את במתיו ואת מזבחתיו ויאמר ליהודה ולירושלם לאמר לפני מזבח אחד תשתחוו ועליו תקטירו
    kjvRefs:
    - 2 Chronicles 32:12
    kjvOsis:
    - 2Chr.32.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:13
    ref: 2 Chronicles 32:13
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 13
    ordinal: 23078
    text: Know ye not what I and my fathers have done unto all the peoples of the lands? Were the gods of the nations of the lands in any wise able to deliver their land out of my hand?
    translation: JPS 1917
    original: הֲלֹא תֵדְעוּ מֶה עָשִׂיתִי אֲנִי וַאֲבוֹתַי לְכֹל עַמֵּי הָאֲרָצוֹת הֲיָכוֹל יָכְלוּ אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת לְהַצִּיל אֶת־אַרְצָם מִיָּדִי׃
    hebrewPlain: הלא תדעו מה עשיתי אני ואבותי לכל עמי הארצות היכול יכלו אלהי גוי הארצות להציל את ארצם מידי
    kjvRefs:
    - 2 Chronicles 32:13
    kjvOsis:
    - 2Chr.32.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:14
    ref: 2 Chronicles 32:14
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 14
    ordinal: 23079
    text: Who was there among all the gods of those nations which my fathers utterly destroyed, that could deliver his people out of my hand, that your God should be able to deliver you out of my hand?
    translation: JPS 1917
    original: מִי בְּכָל־אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי אֲשֶׁר יָכוֹל לְהַצִּיל אֶת־עַמּוֹ מִיָּדִי כִּי יוּכַל אֱלֹהֵיכֶם לְהַצִּיל אֶתְכֶם מִיָּדִי׃
    hebrewPlain: מי בכל אלהי הגוים האלה אשר החרימו אבותי אשר יכול להציל את עמו מידי כי יוכל אלהיכם להציל אתכם מידי
    kjvRefs:
    - 2 Chronicles 32:14
    kjvOsis:
    - 2Chr.32.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:15
    ref: 2 Chronicles 32:15
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 15
    ordinal: 23080
    text: Now therefore let not Hezekiah beguile you, nor persuade you after this manner, neither believe ye him; for no god of any nation or kingdom was able to deliver his people out of my hand, and out of the hand of my fathers; how much less shall your God deliver you out of my hand?’
    translation: JPS 1917
    original: וְעַתָּה אַל־יַשִּׁיא אֶתְכֶם חִזְקִיָּהוּ וְאַל־יַסִּית אֶתְכֶם כָּזֹאת וְאַל־תַּאֲמִינוּ לוֹ כִּי־לֹא יוּכַל כָּל־אֱלוֹהַ כָּל־גּוֹי וּמַמְלָכָה לְהַצִּיל עַמּוֹ מִיָּדִי וּמִיַּד אֲבוֹתָי אַף כִּי אֱ‍לֹהֵיכֶם לֹא־יַצִּילוּ אֶתְכֶם מִיָּדִי׃
    hebrewPlain: ועתה אל ישיא אתכם חזקיהו ואל יסית אתכם כזאת ואל תאמינו לו כי לא יוכל כל אלוה כל גוי וממלכה להציל עמו מידי ומיד אבותי אף כי א‍להיכם לא יצילו אתכם מידי
    kjvRefs:
    - 2 Chronicles 32:15
    kjvOsis:
    - 2Chr.32.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:16
    ref: 2 Chronicles 32:16
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 16
    ordinal: 23081
    text: And his servants spoke yet more against the LORD God, and against His servant Hezekiah.
    translation: JPS 1917
    original: וְעוֹד דִּבְּרוּ עֲבָדָיו עַל־יְהוָה הָאֱלֹהִים וְעַל יְחִזְקִיָּהוּ עַבְדּוֹ׃
    hebrewPlain: ועוד דברו עבדיו על יהוה האלהים ועל יחזקיהו עבדו
    kjvRefs:
    - 2 Chronicles 32:16
    kjvOsis:
    - 2Chr.32.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:17
    ref: 2 Chronicles 32:17
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 17
    ordinal: 23082
    text: 'He wrote also a letter, to taunt the LORD, the God of Israel, and to speak against Him, saying: ‘As the gods of the nations of the lands, which have not delivered their people out of my hand, so shall not the God of Hezekiah deliver His people out of my hand.’'
    translation: JPS 1917
    original: וּסְפָרִים כָּתַב לְחָרֵף לַיהוָה אֱלֹהֵי יִשְׂרָאֵל וְלֵאמֹר עָלָיו לֵאמֹר כֵּאלֹהֵי גּוֹיֵ הָאֲרָצוֹת אֲשֶׁר לֹא־הִצִּילוּ עַמָּם מִיָּדִי כֵּן לֹא־יַצִּיל אֱלֹהֵי יְחִזְקִיָּהוּ עַמּוֹ מִיָּדִי׃
    hebrewPlain: וספרים כתב לחרף ליהוה אלהי ישראל ולאמר עליו לאמר כאלהי גוי הארצות אשר לא הצילו עמם מידי כן לא יציל אלהי יחזקיהו עמו מידי
    kjvRefs:
    - 2 Chronicles 32:17
    kjvOsis:
    - 2Chr.32.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:18
    ref: 2 Chronicles 32:18
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 18
    ordinal: 23083
    text: And they cried with a loud voice in the Jews’ language unto the people of Jerusalem that were on the wall, to terrify them, and to affright them; that they might take the city.
    translation: JPS 1917
    original: וַיִּקְרְאוּ בְקוֹל־גָּדוֹל יְהוּדִית עַל־עַם יְרוּשָׁלִַם אֲשֶׁר עַל־הַחוֹמָה לְיָרְאָם וּלְבַהֲלָם לְמַעַן יִלְכְּדוּ אֶת־הָעִיר׃
    hebrewPlain: ויקראו בקול גדול יהודית על עם ירושלם אשר על החומה ליראם ולבהלם למען ילכדו את העיר
    kjvRefs:
    - 2 Chronicles 32:18
    kjvOsis:
    - 2Chr.32.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:19
    ref: 2 Chronicles 32:19
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 19
    ordinal: 23084
    text: And they spoke of the God of Jerusalem, as of the gods of the peoples of the earth, which are the work of men’s hands.
    translation: JPS 1917
    original: וַיְדַבְּרוּ אֶל־אֱלֹהֵי יְרוּשָׁלִָם כְּעַל אֱלֹהֵי עַמֵּי הָאָרֶץ מַעֲשֵׂה יְדֵי הָאָדָם׃
    hebrewPlain: וידברו אל אלהי ירושלם כעל אלהי עמי הארץ מעשה ידי האדם
    kjvRefs:
    - 2 Chronicles 32:19
    kjvOsis:
    - 2Chr.32.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:20
    ref: 2 Chronicles 32:20
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 20
    ordinal: 23085
    text: And Hezekiah the king, and Isaiah the prophet the son of Amoz, prayed because of this, and cried to heaven.
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל יְחִזְקִיָּהוּ הַמֶּלֶךְ וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא עַל־זֹאת וַיִּזְעֲקוּ הַשָּׁמָיִם׃
    hebrewPlain: ויתפלל יחזקיהו המלך וישעיהו בן אמוץ הנביא על זאת ויזעקו השמים
    kjvRefs:
    - 2 Chronicles 32:20
    kjvOsis:
    - 2Chr.32.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:21
    ref: 2 Chronicles 32:21
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 21
    ordinal: 23086
    text: And the LORD sent an angel, who cut off all the mighty men of valour, and the leaders and captains, in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he was come into the house of his god, they that came forth of his own bowels slew him there with the sword.
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוָה מַלְאָךְ וַיַּכְחֵד כָּל־גִּבּוֹר חַיִל וְנָגִיד וְשָׂר בְּמַחֲנֵה מֶלֶךְ אַשּׁוּר וַיָּשָׁב בְּבֹשֶׁת פָּנִים לְאַרְצוֹ וַיָּבֹא בֵּית אֱלֹהָיו ומיציאו [וּמִיצִיאֵי] מֵעָיו שָׁם הִפִּילֻהוּ בֶחָרֶב׃
    hebrewPlain: וישלח יהוה מלאך ויכחד כל גבור חיל ונגיד ושר במחנה מלך אשור וישב בבשת פנים לארצו ויבא בית אלהיו ומיציאו [ומיציאי] מעיו שם הפילהו בחרב
    kjvRefs:
    - 2 Chronicles 32:21
    kjvOsis:
    - 2Chr.32.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:22
    ref: 2 Chronicles 32:22
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 22
    ordinal: 23087
    text: Thus the LORD saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all, and guided them on every side.
    translation: JPS 1917
    original: וַיּוֹשַׁע יְהוָה אֶת־יְחִזְקִיָּהוּ וְאֵת יֹשְׁבֵי יְרוּשָׁלִַם מִיַּד סַנְחֵרִיב מֶלֶךְ־אַשּׁוּר וּמִיַּד־כֹּל וַיְנַהֲלֵם מִסָּבִיב׃
    hebrewPlain: ויושע יהוה את יחזקיהו ואת ישבי ירושלם מיד סנחריב מלך אשור ומיד כל וינהלם מסביב
    kjvRefs:
    - 2 Chronicles 32:22
    kjvOsis:
    - 2Chr.32.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:23
    ref: 2 Chronicles 32:23
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 23
    ordinal: 23088
    text: And many brought gifts unto the LORD to Jerusalem, and precious things to Hezekiah king of Judah; so that he was exalted in the sight of all nations from thenceforth.
    translation: JPS 1917
    original: וְרַבִּים מְבִיאִים מִנְחָה לַיהוָה לִירוּשָׁלִַם וּמִגְדָּנוֹת לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וַיִּנַּשֵּׂא לְעֵינֵי כָל־הַגּוֹיִם מֵאַחֲרֵי־כֵן׃
    hebrewPlain: ורבים מביאים מנחה ליהוה לירושלם ומגדנות ליחזקיהו מלך יהודה וינשא לעיני כל הגוים מאחרי כן
    kjvRefs:
    - 2 Chronicles 32:23
    kjvOsis:
    - 2Chr.32.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:24
    ref: 2 Chronicles 32:24
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 24
    ordinal: 23089
    text: In those days Hezekiah was sick even unto death; and he prayed unto the LORD; and He spoke unto him, and gave him a sign.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם חָלָה יְחִזְקִיָּהוּ עַד־לָמוּת וַיִּתְפַּלֵּל אֶל־יְהוָה וַיֹּאמֶר לוֹ וּמוֹפֵת נָתַן לוֹ׃
    hebrewPlain: בימים ההם חלה יחזקיהו עד למות ויתפלל אל יהוה ויאמר לו ומופת נתן לו
    kjvRefs:
    - 2 Chronicles 32:24
    kjvOsis:
    - 2Chr.32.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:25
    ref: 2 Chronicles 32:25
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 25
    ordinal: 23090
    text: But Hezekiah rendered not according to the benefit done unto him; for his heart was lifted up; therefore there was wrath upon him, and upon Judah and Jerusalem.
    translation: JPS 1917
    original: וְלֹא־כִגְמֻל עָלָיו הֵשִׁיב יְחִזְקִיָּהוּ כִּי גָבַהּ לִבּוֹ וַיְהִי עָלָיו קֶצֶף וְעַל־יְהוּדָה וִירוּשָׁלִָם׃
    hebrewPlain: ולא כגמל עליו השיב יחזקיהו כי גבה לבו ויהי עליו קצף ועל יהודה וירושלם
    kjvRefs:
    - 2 Chronicles 32:25
    kjvOsis:
    - 2Chr.32.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:26
    ref: 2 Chronicles 32:26
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 26
    ordinal: 23091
    text: Notwithstanding Hezekiah humbled himself for the pride of his heart, both he and the inhabitants of Jerusalem, so that the wrath of the LORD came not upon them in the days of Hezekiah.
    translation: JPS 1917
    original: וַיִּכָּנַע יְחִזְקִיָּהוּ בְּגֹבַהּ לִבּוֹ הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם וְלֹא־בָא עֲלֵיהֶם קֶצֶף יְהוָה בִּימֵי יְחִזְקִיָּהוּ׃
    hebrewPlain: ויכנע יחזקיהו בגבה לבו הוא וישבי ירושלם ולא בא עליהם קצף יהוה בימי יחזקיהו
    kjvRefs:
    - 2 Chronicles 32:26
    kjvOsis:
    - 2Chr.32.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:27
    ref: 2 Chronicles 32:27
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 27
    ordinal: 23092
    text: And Hezekiah had exceeding much riches and honour; and he provided him treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of goodly vessels;
    translation: JPS 1917
    original: וַיְהִי לִיחִזְקִיָּהוּ עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד וְאֹצָרוֹת עָשָׂה־לוֹ לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה וְלִבְשָׂמִים וּלְמָגִנִּים וּלְכֹל כְּלֵי חֶמְדָּה׃
    hebrewPlain: ויהי ליחזקיהו עשר וכבוד הרבה מאד ואצרות עשה לו לכסף ולזהב ולאבן יקרה ולבשמים ולמגנים ולכל כלי חמדה
    kjvRefs:
    - 2 Chronicles 32:27
    kjvOsis:
    - 2Chr.32.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:28
    ref: 2 Chronicles 32:28
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 28
    ordinal: 23093
    text: store-houses also for the increase of corn, and wine, and oil; and stalls for all manner of beasts, and flocks in folds.
    translation: JPS 1917
    original: וּמִסְכְּנוֹת לִתְבוּאַת דָּגָן וְתִירוֹשׁ וְיִצְהָר וְאֻרָוֺת לְכָל־בְּהֵמָה וּבְהֵמָה וַעֲדָרִים לָאֲוֵרוֹת׃
    hebrewPlain: ומסכנות לתבואת דגן ותירוש ויצהר וארות לכל בהמה ובהמה ועדרים לאורות
    kjvRefs:
    - 2 Chronicles 32:28
    kjvOsis:
    - 2Chr.32.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:29
    ref: 2 Chronicles 32:29
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 29
    ordinal: 23094
    text: Moreover he provided him cities, and possessions of flocks and herds in abundance; for God had given him very much substance.
    translation: JPS 1917
    original: וְעָרִים עָשָׂה לוֹ וּמִקְנֵה־צֹאן וּבָקָר לָרֹב כִּי נָתַן־לוֹ אֱלֹהִים רְכוּשׁ רַב מְאֹד׃
    hebrewPlain: וערים עשה לו ומקנה צאן ובקר לרב כי נתן לו אלהים רכוש רב מאד
    kjvRefs:
    - 2 Chronicles 32:29
    kjvOsis:
    - 2Chr.32.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:30
    ref: 2 Chronicles 32:30
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 30
    ordinal: 23095
    text: This same Hezekiah also stopped the upper spring of the waters of Gihon, and brought them straight down on the west side of the city of David. And Hezekiah prospered in all his works.
    translation: JPS 1917
    original: וְהוּא יְחִזְקִיָּהוּ סָתַם אֶת־מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן וַיַּישְּׁרֵם לְמַטָּה־מַּעְרָבָה לְעִיר דָּוִיד וַיַּצְלַח יְחִזְקִיָּהוּ בְּכָל־מַעֲשֵׂהוּ׃
    hebrewPlain: והוא יחזקיהו סתם את מוצא מימי גיחון העליון ויישרם למטה מערבה לעיר דויד ויצלח יחזקיהו בכל מעשהו
    kjvRefs:
    - 2 Chronicles 32:30
    kjvOsis:
    - 2Chr.32.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:31
    ref: 2 Chronicles 32:31
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 31
    ordinal: 23096
    text: Howbeit in the business of the ambassadors of the princes of Babylon, who sent unto him to inquire of the wonder that was done in the land, God left him, to try him, that He might know all that was in his heart.
    translation: JPS 1917
    original: וְכֵן בִּמְלִיצֵי שָׂרֵי בָּבֶל הַמְשַׁלְּחִים עָלָיו לִדְרֹשׁ הַמּוֹפֵת אֲשֶׁר הָיָה בָאָרֶץ עֲזָבוֹ הָאֱלֹהִים לְנַסּוֹתוֹ לָדַעַת כָּל־בִּלְבָבוֹ׃
    hebrewPlain: וכן במליצי שרי בבל המשלחים עליו לדרש המופת אשר היה בארץ עזבו האלהים לנסותו לדעת כל בלבבו
    kjvRefs:
    - 2 Chronicles 32:31
    kjvOsis:
    - 2Chr.32.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:32
    ref: 2 Chronicles 32:32
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 32
    ordinal: 23097
    text: Now the rest of the acts of Hezekiah, and his good deeds, behold, they are written in the vision of Isaiah the prophet the son of Amoz, and in the book of the kings of Judah and Israel.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ וַחֲסָדָיו הִנָּם כְּתוּבִים בַּחֲזוֹן יְשַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא עַל־סֵפֶר מַלְכֵי־יְהוּדָה וְיִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יחזקיהו וחסדיו הנם כתובים בחזון ישעיהו בן אמוץ הנביא על ספר מלכי יהודה וישראל
    kjvRefs:
    - 2 Chronicles 32:32
    kjvOsis:
    - 2Chr.32.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.32.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 32:33
    ref: 2 Chronicles 32:33
    book: 2Chr
    section: ketuvim
    chapter: 32
    verse: 33
    ordinal: 23098
    text: And Hezekiah slept with his fathers, and they buried him in the ascent of the sepulchres of the sons of David; and all Judah and the inhabitants of Jerusalem did him honour at his death. And Manasseh his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יְחִזְקִיָּהוּ עִם־אֲבֹתָיו וַיִּקְבְּרֻהוּ בְּמַעֲלֵה קִבְרֵי בְנֵי־דָוִיד וְכָבוֹד עָשׂוּ־לוֹ בְמוֹתוֹ כָּל־יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם וַיִּמְלֹךְ מְנַשֶּׁה בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יחזקיהו עם אבתיו ויקברהו במעלה קברי בני דויד וכבוד עשו לו במותו כל יהודה וישבי ירושלם וימלך מנשה בנו תחתיו
    kjvRefs:
    - 2 Chronicles 32:33
    kjvOsis:
    - 2Chr.32.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.32
- type: TanakhVerse
  data:
    osis: 2Chr.33.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:1
    ref: 2 Chronicles 33:1
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 1
    ordinal: 23099
    text: Manasseh was twelve years old when he began to reign; and he reigned fifty and five years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־שְׁתֵּים עֶשְׂרֵה שָׁנָה מְנַשֶּׁה בְמָלְכוֹ וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן שתים עשרה שנה מנשה במלכו וחמשים וחמש שנה מלך בירושלם
    kjvRefs:
    - 2 Chronicles 33:1
    kjvOsis:
    - 2Chr.33.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:2
    ref: 2 Chronicles 33:2
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 2
    ordinal: 23100
    text: And he did that which was evil in the sight of the LORD, after the abominations of the nations, whom the LORD cast out before the children of Israel.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּתוֹעֲבוֹת הַגּוֹיִם אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויעש הרע בעיני יהוה כתועבות הגוים אשר הוריש יהוה מפני בני ישראל
    kjvRefs:
    - 2 Chronicles 33:2
    kjvOsis:
    - 2Chr.33.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:3
    ref: 2 Chronicles 33:3
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 3
    ordinal: 23101
    text: For he built again the high places which Hezekiah his father had broken down; and he reared up altars for the Baalim, and made Asheroth, and worshipped all the host of heaven, and served them.
    translation: JPS 1917
    original: וַיָּשָׁב וַיִּבֶן אֶת־הַבָּמוֹת אֲשֶׁר נִתַּץ יְחִזְקִיָּהוּ אָבִיו וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים וַיַּעַשׂ אֲשֵׁרוֹת וַיִּשְׁתַּחוּ לְכָל־צְבָא הַשָּׁמַיִם וַיַּעֲבֹד אֹתָם׃
    hebrewPlain: וישב ויבן את הבמות אשר נתץ יחזקיהו אביו ויקם מזבחות לבעלים ויעש אשרות וישתחו לכל צבא השמים ויעבד אתם
    kjvRefs:
    - 2 Chronicles 33:3
    kjvOsis:
    - 2Chr.33.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:4
    ref: 2 Chronicles 33:4
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 4
    ordinal: 23102
    text: 'And he built altars in the house of the LORD, whereof the LORD said: ‘In Jerusalem shall My name be for ever.’'
    translation: JPS 1917
    original: וּבָנָה מִזְבְּחוֹת בְּבֵית יְהוָה אֲשֶׁר אָמַר יְהוָה בִּירוּשָׁלִַם יִהְיֶה־שְּׁמִי לְעוֹלָם׃
    hebrewPlain: ובנה מזבחות בבית יהוה אשר אמר יהוה בירושלם יהיה שמי לעולם
    kjvRefs:
    - 2 Chronicles 33:4
    kjvOsis:
    - 2Chr.33.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:5
    ref: 2 Chronicles 33:5
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 5
    ordinal: 23103
    text: And he built altars for all the host of heaven in the two courts of the house of the LORD.
    translation: JPS 1917
    original: וַיִּבֶן מִזְבְּחוֹת לְכָל־צְבָא הַשָּׁמָיִם בִּשְׁתֵּי חַצְרוֹת בֵּית־יְהוָה׃
    hebrewPlain: ויבן מזבחות לכל צבא השמים בשתי חצרות בית יהוה
    kjvRefs:
    - 2 Chronicles 33:5
    kjvOsis:
    - 2Chr.33.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:6
    ref: 2 Chronicles 33:6
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 6
    ordinal: 23104
    text: He also made his children to pass through the fire in the valley of the son of Hinnom; and he practised soothsaying, and used enchantments, and practised sorcery, and appointed them that divined by a ghost or a familiar spirit; he wrought much evil in the sight of the LORD, to provoke Him.
    translation: JPS 1917
    original: וְהוּא הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ בְּגֵי בֶן־הִנֹּם וְעוֹנֵן וְנִחֵשׁ וְכִשֵּׁף וְעָשָׂה אוֹב וְיִדְּעוֹנִי הִרְבָּה לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה לְהַכְעִיסוֹ׃
    hebrewPlain: והוא העביר את בניו באש בגי בן הנם ועונן ונחש וכשף ועשה אוב וידעוני הרבה לעשות הרע בעיני יהוה להכעיסו
    kjvRefs:
    - 2 Chronicles 33:6
    kjvOsis:
    - 2Chr.33.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:7
    ref: 2 Chronicles 33:7
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 7
    ordinal: 23105
    text: 'And he set the graven image of the idol, which he had made, in the house of God, of which God said to David and to Solomon his son: ‘In this house, and in Jerusalem, which I have chosen out of all the tribes of Israel, will I put My name for ever;'
    translation: JPS 1917
    original: וַיָּשֶׂם אֶת־פֶּסֶל הַסֶּמֶל אֲשֶׁר עָשָׂה בְּבֵית הָאֱלֹהִים אֲשֶׁר אָמַר אֱלֹהִים אֶל־דָּוִיד וְאֶל־שְׁלֹמֹה בְנוֹ בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל אָשִׂים אֶת־שְׁמִי לְעֵילוֹם׃
    hebrewPlain: וישם את פסל הסמל אשר עשה בבית האלהים אשר אמר אלהים אל דויד ואל שלמה בנו בבית הזה ובירושלם אשר בחרתי מכל שבטי ישראל אשים את שמי לעילום
    kjvRefs:
    - 2 Chronicles 33:7
    kjvOsis:
    - 2Chr.33.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:8
    ref: 2 Chronicles 33:8
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 8
    ordinal: 23106
    text: neither will I any more remove the foot of Israel from off the land which I have appointed for your fathers; if only they will observe to do all that I have commanded them, even all the law and the statutes and the ordinances by the hand of Moses.’
    translation: JPS 1917
    original: וְלֹא אוֹסִיף לְהָסִיר אֶת־רֶגֶל יִשְׂרָאֵל מֵעַל הָאֲדָמָה אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם רַק אִם־יִשְׁמְרוּ לַעֲשׂוֹת אֵת כָּל־אֲשֶׁר צִוִּיתִים לְכָל־הַתּוֹרָה וְהַחֻקִּים וְהַמִּשְׁפָּטִים בְּיַד־מֹשֶׁה׃
    hebrewPlain: ולא אוסיף להסיר את רגל ישראל מעל האדמה אשר העמדתי לאבתיכם רק אם ישמרו לעשות את כל אשר צויתים לכל התורה והחקים והמשפטים ביד משה
    kjvRefs:
    - 2 Chronicles 33:8
    kjvOsis:
    - 2Chr.33.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:9
    ref: 2 Chronicles 33:9
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 9
    ordinal: 23107
    text: And Manasseh made Judah and the inhabitants of Jerusalem to err, so that they did evil more than did the nations, whom the LORD destroyed before the children of Israel.
    translation: JPS 1917
    original: וַיֶּתַע מְנַשֶּׁה אֶת־יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם לַעֲשׂוֹת רָע מִן־הַגּוֹיִם אֲשֶׁר הִשְׁמִיד יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתע מנשה את יהודה וישבי ירושלם לעשות רע מן הגוים אשר השמיד יהוה מפני בני ישראל
    kjvRefs:
    - 2 Chronicles 33:9
    kjvOsis:
    - 2Chr.33.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:10
    ref: 2 Chronicles 33:10
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 10
    ordinal: 23108
    text: And the LORD spoke to Manasseh, and to his people; but they gave no heed.
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מְנַשֶּׁה וְאֶל־עַמּוֹ וְלֹא הִקְשִׁיבוּ׃
    hebrewPlain: וידבר יהוה אל מנשה ואל עמו ולא הקשיבו
    kjvRefs:
    - 2 Chronicles 33:10
    kjvOsis:
    - 2Chr.33.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:11
    ref: 2 Chronicles 33:11
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 11
    ordinal: 23109
    text: Wherefore the LORD brought upon them the captains of the host of the king of Assyria, who took Manasseh with hooks, and bound him with fetters, and carried him to Babylon.
    translation: JPS 1917
    original: וַיָּבֵא יְהוָה עֲלֵיהֶם אֶת־שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר וַיִּלְכְּדוּ אֶת־מְנַשֶּׁה בַּחֹחִים וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם וַיּוֹלִיכֻהוּ בָּבֶלָה׃
    hebrewPlain: ויבא יהוה עליהם את שרי הצבא אשר למלך אשור וילכדו את מנשה בחחים ויאסרהו בנחשתים ויוליכהו בבלה
    kjvRefs:
    - 2 Chronicles 33:11
    kjvOsis:
    - 2Chr.33.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:12
    ref: 2 Chronicles 33:12
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 12
    ordinal: 23110
    text: And when he was in distress, he besought the LORD his God, and humbled himself greatly before the God of his fathers.
    translation: JPS 1917
    original: וּכְהָצֵר לוֹ חִלָּה אֶת־פְּנֵי יְהוָה אֱלֹהָיו וַיִּכָּנַע מְאֹד מִלִּפְנֵי אֱלֹהֵי אֲבֹתָיו׃
    hebrewPlain: וכהצר לו חלה את פני יהוה אלהיו ויכנע מאד מלפני אלהי אבתיו
    kjvRefs:
    - 2 Chronicles 33:12
    kjvOsis:
    - 2Chr.33.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:13
    ref: 2 Chronicles 33:13
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 13
    ordinal: 23111
    text: And he prayed unto Him; and He was entreated of him, and heard his supplication, and brought him back to Jerusalem into his kingdom. Then Manasseh knew that the LORD He was God.
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל אֵלָיו וַיֵּעָתֶר לוֹ וַיִּשְׁמַע תְּחִנָּתוֹ וַיְשִׁיבֵהוּ יְרוּשָׁלִַם לְמַלְכוּתוֹ וַיֵּדַע מְנַשֶּׁה כִּי יְהוָה הוּא הָאֱלֹהִים׃
    hebrewPlain: ויתפלל אליו ויעתר לו וישמע תחנתו וישיבהו ירושלם למלכותו וידע מנשה כי יהוה הוא האלהים
    kjvRefs:
    - 2 Chronicles 33:13
    kjvOsis:
    - 2Chr.33.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:14
    ref: 2 Chronicles 33:14
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 14
    ordinal: 23112
    text: Now after this he built an outer wall to the city of David, on the west side of Gihon, in the valley, even to the entrance at the fish gate; and he compassed about Ophel, and raised it up a very great height; and he put captains of the army in all the fortified cities of Judah.
    translation: JPS 1917
    original: וְאַחֲרֵי־כֵן בָּנָה חוֹמָה חִיצוֹנָה לְעִיר־דָּוִיד מַעְרָבָה לְגִיחוֹן בַּנַּחַל וְלָבוֹא בְשַׁעַר הַדָּגִים וְסָבַב לָעֹפֶל וַיַּגְבִּיהֶהָ מְאֹד וַיָּשֶׂם שָׂרֵי־חַיִל בְּכָל־הֶעָרִים הַבְּצֻרוֹת בִּיהוּדָה׃
    hebrewPlain: ואחרי כן בנה חומה חיצונה לעיר דויד מערבה לגיחון בנחל ולבוא בשער הדגים וסבב לעפל ויגביהה מאד וישם שרי חיל בכל הערים הבצרות ביהודה
    kjvRefs:
    - 2 Chronicles 33:14
    kjvOsis:
    - 2Chr.33.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:15
    ref: 2 Chronicles 33:15
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 15
    ordinal: 23113
    text: And he took away the strange gods, and the idol out of the house of the LORD, and all the altars that he had built in the mount of the house of the LORD, and in Jerusalem, and cast them out of the city.
    translation: JPS 1917
    original: וַיָּסַר אֶת־אֱלֹהֵי הַנֵּכָר וְאֶת־הַסֶּמֶל מִבֵּית יְהוָה וְכָל־הַמִּזְבְּחוֹת אֲשֶׁר בָּנָה בְּהַר בֵּית־יְהוָה וּבִירוּשָׁלִָם וַיַּשְׁלֵךְ חוּצָה לָעִיר׃
    hebrewPlain: ויסר את אלהי הנכר ואת הסמל מבית יהוה וכל המזבחות אשר בנה בהר בית יהוה ובירושלם וישלך חוצה לעיר
    kjvRefs:
    - 2 Chronicles 33:15
    kjvOsis:
    - 2Chr.33.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:16
    ref: 2 Chronicles 33:16
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 16
    ordinal: 23114
    text: And he built up the altar of the LORD, and offered thereon sacrifices of peace-offerings and of thanksgiving, and commanded Judah to serve the LORD, the God of Israel.
    translation: JPS 1917
    original: ויכן [וַיִּבֶן] אֶת־מִזְבַּח יְהוָה וַיִּזְבַּח עָלָיו זִבְחֵי שְׁלָמִים וְתוֹדָה וַיֹּאמֶר לִיהוּדָה לַעֲבוֹד אֶת־יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכן [ויבן] את מזבח יהוה ויזבח עליו זבחי שלמים ותודה ויאמר ליהודה לעבוד את יהוה אלהי ישראל
    kjvRefs:
    - 2 Chronicles 33:16
    kjvOsis:
    - 2Chr.33.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:17
    ref: 2 Chronicles 33:17
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 17
    ordinal: 23115
    text: Nevertheless the people did sacrifice still in the high places, but only unto the LORD their God. .
    translation: JPS 1917
    original: אֲבָל עוֹד הָעָם זֹבְחִים בַּבָּמוֹת רַק לַיהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: אבל עוד העם זבחים בבמות רק ליהוה אלהיהם
    kjvRefs:
    - 2 Chronicles 33:17
    kjvOsis:
    - 2Chr.33.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:18
    ref: 2 Chronicles 33:18
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 18
    ordinal: 23116
    text: Now the rest of the acts of Manasseh, and his prayer unto his God, and the words of the seers that spoke to him in the name of the LORD, the God of Israel, behold, they are written among the acts of the kings of Israel.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה וּתְפִלָּתוֹ אֶל־אֱלֹהָיו וְדִבְרֵי הַחֹזִים הַמְדַבְּרִים אֵלָיו בְּשֵׁם יְהוָה אֱלֹהֵי יִשְׂרָאֵל הִנָּם עַל־דִּבְרֵי מַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי מנשה ותפלתו אל אלהיו ודברי החזים המדברים אליו בשם יהוה אלהי ישראל הנם על דברי מלכי ישראל
    kjvRefs:
    - 2 Chronicles 33:18
    kjvOsis:
    - 2Chr.33.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:19
    ref: 2 Chronicles 33:19
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 19
    ordinal: 23117
    text: His prayer also, and how [God] was entreated of him, and all his sin and his transgression, and the places wherein he built high places, and set up the Asherim and the graven images, before he humbled himself; behold, they are written in the history of the seers.
    translation: JPS 1917
    original: וּתְפִלָּתוֹ וְהֵעָתֶר־לוֹ וְכָל־חַטָּאתוֹ וּמַעְלוֹ וְהַמְּקֹמוֹת אֲשֶׁר בָּנָה בָהֶם בָּמוֹת וְהֶעֱמִיד הָאֲשֵׁרִים וְהַפְּסִלִים לִפְנֵי הִכָּנְעוֹ הִנָּם כְּתוּבִים עַל דִּבְרֵי חוֹזָי׃
    hebrewPlain: ותפלתו והעתר לו וכל חטאתו ומעלו והמקמות אשר בנה בהם במות והעמיד האשרים והפסלים לפני הכנעו הנם כתובים על דברי חוזי
    kjvRefs:
    - 2 Chronicles 33:19
    kjvOsis:
    - 2Chr.33.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:20
    ref: 2 Chronicles 33:20
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 20
    ordinal: 23118
    text: So Manasseh slept with his fathers, and they buried him in his own house; and Amon his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב מְנַשֶּׁה עִם־אֲבֹתָיו וַיִּקְבְּרֻהוּ בֵּיתוֹ וַיִּמְלֹךְ אָמוֹן בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב מנשה עם אבתיו ויקברהו ביתו וימלך אמון בנו תחתיו
    kjvRefs:
    - 2 Chronicles 33:20
    kjvOsis:
    - 2Chr.33.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:21
    ref: 2 Chronicles 33:21
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 21
    ordinal: 23119
    text: Amon was twenty and two years old when he began to reign; and he reigned two years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וּשְׁתַּיִם שָׁנָה אָמוֹן בְּמָלְכוֹ וּשְׁתַּיִם שָׁנִים מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן עשרים ושתים שנה אמון במלכו ושתים שנים מלך בירושלם
    kjvRefs:
    - 2 Chronicles 33:21
    kjvOsis:
    - 2Chr.33.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:22
    ref: 2 Chronicles 33:22
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 22
    ordinal: 23120
    text: And he did that which was evil in the sight of the LORD, as did Manasseh his father; and Amon sacrificed unto all the graven images which Manasseh his father had made, and served them.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו וּלְכָל־הַפְּסִילִים אֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו זִבַּח אָמוֹן וַיַּעַבְדֵם׃
    hebrewPlain: ויעש הרע בעיני יהוה כאשר עשה מנשה אביו ולכל הפסילים אשר עשה מנשה אביו זבח אמון ויעבדם
    kjvRefs:
    - 2 Chronicles 33:22
    kjvOsis:
    - 2Chr.33.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:23
    ref: 2 Chronicles 33:23
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 23
    ordinal: 23121
    text: And he humbled not himself before the LORD, as Manasseh his father had humbled himself; but this same Amon became guilty more and more.
    translation: JPS 1917
    original: וְלֹא נִכְנַע מִלִּפְנֵי יְהוָה כְּהִכָּנַע מְנַשֶּׁה אָבִיו כִּי הוּא אָמוֹן הִרְבָּה אַשְׁמָה׃
    hebrewPlain: ולא נכנע מלפני יהוה כהכנע מנשה אביו כי הוא אמון הרבה אשמה
    kjvRefs:
    - 2 Chronicles 33:23
    kjvOsis:
    - 2Chr.33.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:24
    ref: 2 Chronicles 33:24
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 24
    ordinal: 23122
    text: And his servants conspired against him, and put him to death in his own house.
    translation: JPS 1917
    original: וַיִּקְשְׁרוּ עָלָיו עֲבָדָיו וַיְמִיתֻהוּ בְּבֵיתוֹ׃
    hebrewPlain: ויקשרו עליו עבדיו וימיתהו בביתו
    kjvRefs:
    - 2 Chronicles 33:24
    kjvOsis:
    - 2Chr.33.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.33.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 33:25
    ref: 2 Chronicles 33:25
    book: 2Chr
    section: ketuvim
    chapter: 33
    verse: 25
    ordinal: 23123
    text: But the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.
    translation: JPS 1917
    original: וַיַּכּוּ עַם־הָאָרֶץ אֵת כָּל־הַקֹּשְׁרִים עַל־הַמֶּלֶךְ אָמוֹן וַיַּמְלִיכוּ עַם־הָאָרֶץ אֶת־יֹאשִׁיָּהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: ויכו עם הארץ את כל הקשרים על המלך אמון וימליכו עם הארץ את יאשיהו בנו תחתיו
    kjvRefs:
    - 2 Chronicles 33:25
    kjvOsis:
    - 2Chr.33.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.33
- type: TanakhVerse
  data:
    osis: 2Chr.34.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:1
    ref: 2 Chronicles 34:1
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 1
    ordinal: 23124
    text: Josiah was eight years old when he began to reign; and he reigned thirty and one years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־שְׁמוֹנֶה שָׁנִים יֹאשִׁיָּהוּ בְמָלְכוֹ וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן שמונה שנים יאשיהו במלכו ושלשים ואחת שנה מלך בירושלם
    kjvRefs:
    - 2 Chronicles 34:1
    kjvOsis:
    - 2Chr.34.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:2
    ref: 2 Chronicles 34:2
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 2
    ordinal: 23125
    text: And he did that which was right in the eyes of the LORD, and walked in the ways of David his father, and turned not aside to the right hand or to the left.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה וַיֵּלֶךְ בְּדַרְכֵי דָּוִיד אָבִיו וְלֹא־סָר יָמִין וּשְׂמֹאול׃
    hebrewPlain: ויעש הישר בעיני יהוה וילך בדרכי דויד אביו ולא סר ימין ושמאול
    kjvRefs:
    - 2 Chronicles 34:2
    kjvOsis:
    - 2Chr.34.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:3
    ref: 2 Chronicles 34:3
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 3
    ordinal: 23126
    text: For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father; and in the twelfth year he began to purge Judah and Jerusalem from the high places, and the Asherim, and the graven images, and the molten images.
    translation: JPS 1917
    original: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ וְהוּא עוֹדֶנּוּ נַעַר הֵחֵל לִדְרוֹשׁ לֵאלֹהֵי דָּוִיד אָבִיו וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה הֵחֵל לְטַהֵר אֶת־יְהוּדָה וִירוּשָׁלִַם מִן־הַבָּמוֹת וְהָאֲשֵׁרִים וְהַפְּסִלִים וְהַמַּסֵּכוֹת׃
    hebrewPlain: ובשמונה שנים למלכו והוא עודנו נער החל לדרוש לאלהי דויד אביו ובשתים עשרה שנה החל לטהר את יהודה וירושלם מן הבמות והאשרים והפסלים והמסכות
    kjvRefs:
    - 2 Chronicles 34:3
    kjvOsis:
    - 2Chr.34.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:4
    ref: 2 Chronicles 34:4
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 4
    ordinal: 23127
    text: And they broke down the altars of the Baalim in his presence; and the sun-images, that were on high above them, he hewed down; and the Asherim, and the graven images, and the molten images, he broke in pieces, and made dust of them, and strewed it upon the graves of them that had sacrificed unto them.
    translation: JPS 1917
    original: וַיְנַתְּצוּ לְפָנָיו אֵת מִזְבְּחוֹת הַבְּעָלִים וְהַחַמָּנִים אֲשֶׁר־לְמַעְלָה מֵעֲלֵיהֶם גִּדֵּעַ וְהָאֲשֵׁרִים וְהַפְּסִלִים וְהַמַּסֵּכוֹת שִׁבַּר וְהֵדַק וַיִּזְרֹק עַל־פְּנֵי הַקְּבָרִים הַזֹּבְחִים לָהֶם׃
    hebrewPlain: וינתצו לפניו את מזבחות הבעלים והחמנים אשר למעלה מעליהם גדע והאשרים והפסלים והמסכות שבר והדק ויזרק על פני הקברים הזבחים להם
    kjvRefs:
    - 2 Chronicles 34:4
    kjvOsis:
    - 2Chr.34.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:5
    ref: 2 Chronicles 34:5
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 5
    ordinal: 23128
    text: And he burnt the bones of the priests upon their altars, and purged Judah and Jerusalem.
    translation: JPS 1917
    original: וְעַצְמוֹת כֹּהֲנִים שָׂרַף עַל־מזבחותים [מִזְבְּחוֹתָם] וַיְטַהֵר אֶת־יְהוּדָה וְאֶת־יְרוּשָׁלִָם׃
    hebrewPlain: ועצמות כהנים שרף על מזבחותים [מזבחותם] ויטהר את יהודה ואת ירושלם
    kjvRefs:
    - 2 Chronicles 34:5
    kjvOsis:
    - 2Chr.34.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:6
    ref: 2 Chronicles 34:6
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 6
    ordinal: 23129
    text: And so did he in the cities of Manasseh and Ephraim and Simeon, even unto Naphtali, with their axes round about.
    translation: JPS 1917
    original: וּבְעָרֵי מְנַשֶּׁה וְאֶפְרַיִם וְשִׁמְעוֹן וְעַד־נַפְתָּלִי בהר בתיהם [בְּחַרְבֹתֵיהֶם] סָבִיב׃
    hebrewPlain: ובערי מנשה ואפרים ושמעון ועד נפתלי בהר בתיהם [בחרבתיהם] סביב
    kjvRefs:
    - 2 Chronicles 34:6
    kjvOsis:
    - 2Chr.34.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:7
    ref: 2 Chronicles 34:7
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 7
    ordinal: 23130
    text: And he broke down the altars, and beat the Asherim and the graven images into powder, and hewed down all the sun-images throughout all the land of Israel, and returned to Jerusalem.
    translation: JPS 1917
    original: וַיְנַתֵּץ אֶת־הַמִּזְבְּחוֹת וְאֶת־הָאֲשֵׁרִים וְהַפְּסִלִים כִּתַּת לְהֵדַק וְכָל־הַחַמָּנִים גִּדַּע בְּכָל־אֶרֶץ יִשְׂרָאֵל וַיָּשָׁב לִירוּשָׁלִָם׃
    hebrewPlain: וינתץ את המזבחות ואת האשרים והפסלים כתת להדק וכל החמנים גדע בכל ארץ ישראל וישב לירושלם
    kjvRefs:
    - 2 Chronicles 34:7
    kjvOsis:
    - 2Chr.34.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:8
    ref: 2 Chronicles 34:8
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 8
    ordinal: 23131
    text: Now in the eighteenth year of his reign, when he had purged the land, and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the recorder, to repair the house of the LORD his God.
    translation: JPS 1917
    original: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ לְטַהֵר הָאָרֶץ וְהַבָּיִת שָׁלַח אֶת־שָׁפָן בֶּן־אֲצַלְיָהוּ וְאֶת־מַעֲשֵׂיָהוּ שַׂר־הָעִיר וְאֵת יוֹאָח בֶּן־יוֹאָחָז הַמַּזְכִּיר לְחַזֵּק אֶת־בֵּית יְהוָה אֱלֹהָיו׃
    hebrewPlain: ובשנת שמונה עשרה למלכו לטהר הארץ והבית שלח את שפן בן אצליהו ואת מעשיהו שר העיר ואת יואח בן יואחז המזכיר לחזק את בית יהוה אלהיו
    kjvRefs:
    - 2 Chronicles 34:8
    kjvOsis:
    - 2Chr.34.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:9
    ref: 2 Chronicles 34:9
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 9
    ordinal: 23132
    text: And they came to Hilkiah the high priest, and delivered the money that was brought into the house of God, which the Levites, the keepers of the door, had gathered of the hand of Manasseh and Ephraim, and of all the remnant of Israel, and of all Judah and Benjamin, and they returned to Jerusalem.
    translation: JPS 1917
    original: וַיָּבֹאוּ אֶל־חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל וַיִּתְּנוּ אֶת־הַכֶּסֶף הַמּוּבָא בֵית־אֱלֹהִים אֲשֶׁר אָסְפוּ־הַלְוִיִּם שֹׁמְרֵי הַסַּף מִיַּד מְנַשֶּׁה וְאֶפְרַיִם וּמִכֹּל שְׁאֵרִית יִשְׂרָאֵל וּמִכָּל־יְהוּדָה וּבִנְיָמִן וישבי [וַיָּשֻׁבוּ] יְרוּשָׁלִָם׃
    hebrewPlain: ויבאו אל חלקיהו הכהן הגדול ויתנו את הכסף המובא בית אלהים אשר אספו הלוים שמרי הסף מיד מנשה ואפרים ומכל שארית ישראל ומכל יהודה ובנימן וישבי [וישבו] ירושלם
    kjvRefs:
    - 2 Chronicles 34:9
    kjvOsis:
    - 2Chr.34.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:10
    ref: 2 Chronicles 34:10
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 10
    ordinal: 23133
    text: And they delivered it into the hand of the workmen that had the oversight of the house of the LORD; and the workmen that wrought in the house of the LORD gave it to mend and repair the house;
    translation: JPS 1917
    original: וַיִּתְּנוּ עַל־יַד עֹשֵׂה הַמְּלָאכָה הַמֻּפְקָדִים בְּבֵית יְהוָה וַיִּתְּנוּ אֹתוֹ עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים בְּבֵית יְהוָה לִבְדּוֹק וּלְחַזֵּק הַבָּיִת׃
    hebrewPlain: ויתנו על יד עשה המלאכה המפקדים בבית יהוה ויתנו אתו עושי המלאכה אשר עשים בבית יהוה לבדוק ולחזק הבית
    kjvRefs:
    - 2 Chronicles 34:10
    kjvOsis:
    - 2Chr.34.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:11
    ref: 2 Chronicles 34:11
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 11
    ordinal: 23134
    text: even to the carpenters and to the builders gave they it, to buy hewn stone, and timber for couplings, and to make beams for the houses which the kings of Judah had destroyed.
    translation: JPS 1917
    original: וַיִּתְּנוּ לֶחָרָשִׁים וְלַבֹּנִים לִקְנוֹת אַבְנֵי מַחְצֵב וְעֵצִים לַמְחַבְּרוֹת וּלְקָרוֹת אֶת־הַבָּתִּים אֲשֶׁר הִשְׁחִיתוּ מַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתנו לחרשים ולבנים לקנות אבני מחצב ועצים למחברות ולקרות את הבתים אשר השחיתו מלכי יהודה
    kjvRefs:
    - 2 Chronicles 34:11
    kjvOsis:
    - 2Chr.34.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:12
    ref: 2 Chronicles 34:12
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 12
    ordinal: 23135
    text: And the men did the work faithfully; and the overseers of them were Jahath and Obadiah, the Levites, of the sons of Merari; and Zechariah and Meshullam, of the sons of the Kohathites, to preside over it; and other of the Levites, all that had skill with instruments of music.
    translation: JPS 1917
    original: וְהָאֲנָשִׁים עֹשִׂים בֶּאֱמוּנָה בַּמְּלָאכָה וַעֲלֵיהֶם מֻפְקָדִים יַחַת וְעֹבַדְיָהוּ הַלְוִיִּם מִן־בְּנֵי מְרָרִי וּזְכַרְיָה וּמְשֻׁלָּם מִן־בְּנֵי הַקְּהָתִים לְנַצֵּחַ וְהַלְוִיִּם כָּל־מֵבִין בִּכְלֵי־שִׁיר׃
    hebrewPlain: והאנשים עשים באמונה במלאכה ועליהם מפקדים יחת ועבדיהו הלוים מן בני מררי וזכריה ומשלם מן בני הקהתים לנצח והלוים כל מבין בכלי שיר
    kjvRefs:
    - 2 Chronicles 34:12
    kjvOsis:
    - 2Chr.34.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:13
    ref: 2 Chronicles 34:13
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 13
    ordinal: 23136
    text: Also they were over the bearers of burdens, and presided over all that did the work in every manner of service; and of the Levites there were scribes, and officers, and porters.
    translation: JPS 1917
    original: וְעַל הַסַּבָּלִים וּמְנַצְּחִים לְכֹל עֹשֵׂה מְלָאכָה לַעֲבוֹדָה וַעֲבוֹדָה וּמֵהַלְוִיִּם סוֹפְרִים וְשֹׁטְרִים וְשׁוֹעֲרִים׃
    hebrewPlain: ועל הסבלים ומנצחים לכל עשה מלאכה לעבודה ועבודה ומהלוים סופרים ושטרים ושוערים
    kjvRefs:
    - 2 Chronicles 34:13
    kjvOsis:
    - 2Chr.34.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:14
    ref: 2 Chronicles 34:14
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 14
    ordinal: 23137
    text: And when they brought out the money that was brought into the house of the LORD, Hilkiah the priest found the book of the Law of the LORD given by Moses.
    translation: JPS 1917
    original: וּבְהוֹצִיאָם אֶת־הַכֶּסֶף הַמּוּבָא בֵּית יְהוָה מָצָא חִלְקִיָּהוּ הַכֹּהֵן אֶת־סֵפֶר תּוֹרַת־יְהוָה בְּיַד־מֹשֶׁה׃
    hebrewPlain: ובהוציאם את הכסף המובא בית יהוה מצא חלקיהו הכהן את ספר תורת יהוה ביד משה
    kjvRefs:
    - 2 Chronicles 34:14
    kjvOsis:
    - 2Chr.34.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:15
    ref: 2 Chronicles 34:15
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 15
    ordinal: 23138
    text: 'and Hilkiah answered and said to Shaphan the scribe: ‘I have found the book of the Law in the house of the LORD.’ And Hilkiah delivered the book to Shaphan.'
    translation: JPS 1917
    original: וַיַּעַן חִלְקִיָּהוּ וַיֹּאמֶר אֶל־שָׁפָן הַסּוֹפֵר סֵפֶר הַתּוֹרָה מָצָאתִי בְּבֵית יְהוָה וַיִּתֵּן חִלְקִיָּהוּ אֶת־הַסֵּפֶר אֶל־שָׁפָן׃
    hebrewPlain: ויען חלקיהו ויאמר אל שפן הסופר ספר התורה מצאתי בבית יהוה ויתן חלקיהו את הספר אל שפן
    kjvRefs:
    - 2 Chronicles 34:15
    kjvOsis:
    - 2Chr.34.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:16
    ref: 2 Chronicles 34:16
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 16
    ordinal: 23139
    text: 'And Shaphan carried the book to the king, and moreover brought back word unto the king, saying: ‘All that was committed to thy servants, they do it.'
    translation: JPS 1917
    original: וַיָּבֵא שָׁפָן אֶת־הַסֵּפֶר אֶל־הַמֶּלֶךְ וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר לֵאמֹר כֹּל אֲשֶׁר־נִתַּן בְּיַד־עֲבָדֶיךָ הֵם עֹשִׂים׃
    hebrewPlain: ויבא שפן את הספר אל המלך וישב עוד את המלך דבר לאמר כל אשר נתן ביד עבדיך הם עשים
    kjvRefs:
    - 2 Chronicles 34:16
    kjvOsis:
    - 2Chr.34.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:17
    ref: 2 Chronicles 34:17
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 17
    ordinal: 23140
    text: And they have poured out the money that was found in the house of the LORD, and have delivered it into the hand of the overseers, and into the hand of the workmen.’
    translation: JPS 1917
    original: וַיַּתִּיכוּ אֶת־הַכֶּסֶף הַנִּמְצָא בְּבֵית־יְהוָה וַיִּתְּנוּהוּ עַל־יַד הַמֻּפְקָדִים וְעַל־יַד עוֹשֵׂי הַמְּלָאכָה׃
    hebrewPlain: ויתיכו את הכסף הנמצא בבית יהוה ויתנוהו על יד המפקדים ועל יד עושי המלאכה
    kjvRefs:
    - 2 Chronicles 34:17
    kjvOsis:
    - 2Chr.34.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:18
    ref: 2 Chronicles 34:18
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 18
    ordinal: 23141
    text: 'And Shaphan the scribe told the king, saying: ‘Hilkiah the priest hath delivered me a book.’ And Shaphan read therein before the king.'
    translation: JPS 1917
    original: וַיַּגֵּד שָׁפָן הַסּוֹפֵר לַמֶּלֶךְ לֵאמֹר סֵפֶר נָתַן לִי חִלְקִיָּהוּ הַכֹּהֵן וַיִּקְרָא־בוֹ שָׁפָן לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויגד שפן הסופר למלך לאמר ספר נתן לי חלקיהו הכהן ויקרא בו שפן לפני המלך
    kjvRefs:
    - 2 Chronicles 34:18
    kjvOsis:
    - 2Chr.34.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:19
    ref: 2 Chronicles 34:19
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 19
    ordinal: 23142
    text: And it came to pass, when the king had heard the words of the Law, that he rent his clothes.
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ הַמֶּלֶךְ אֵת דִּבְרֵי הַתּוֹרָה וַיִּקְרַע אֶת־בְּגָדָיו׃
    hebrewPlain: ויהי כשמע המלך את דברי התורה ויקרע את בגדיו
    kjvRefs:
    - 2 Chronicles 34:19
    kjvOsis:
    - 2Chr.34.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:20
    ref: 2 Chronicles 34:20
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 20
    ordinal: 23143
    text: 'And the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah the king’s servant, saying:'
    translation: JPS 1917
    original: וַיְצַו הַמֶּלֶךְ אֶת־חִלְקִיָּהוּ וְאֶת־אֲחִיקָם בֶּן־שָׁפָן וְאֶת־עַבְדּוֹן בֶּן־מִיכָה וְאֵת שָׁפָן הַסּוֹפֵר וְאֵת עֲשָׂיָה עֶבֶד־הַמֶּלֶךְ לֵאמֹר׃
    hebrewPlain: ויצו המלך את חלקיהו ואת אחיקם בן שפן ואת עבדון בן מיכה ואת שפן הסופר ואת עשיה עבד המלך לאמר
    kjvRefs:
    - 2 Chronicles 34:20
    kjvOsis:
    - 2Chr.34.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:21
    ref: 2 Chronicles 34:21
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 21
    ordinal: 23144
    text: ’Go ye, inquire of the LORD for me, and for them that are left in Israel and in Judah, concerning the words of the book that is found; for great is the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD, to do according unto all that is written in this book.’
    translation: JPS 1917
    original: לְכוּ דִרְשׁוּ אֶת־יְהוָה בַּעֲדִי וּבְעַד הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה עַל־דִּבְרֵי הַסֵּפֶר אֲשֶׁר נִמְצָא כִּי־גְדוֹלָה חֲמַת־יְהוָה אֲשֶׁר נִתְּכָה בָנוּ עַל אֲשֶׁר לֹא־שָׁמְרוּ אֲבוֹתֵינוּ אֶת־דְּבַר יְהוָה לַעֲשׂוֹת כְּכָל־הַכָּתוּב עַל־הַסֵּפֶר הַזֶּה׃
    hebrewPlain: לכו דרשו את יהוה בעדי ובעד הנשאר בישראל וביהודה על דברי הספר אשר נמצא כי גדולה חמת יהוה אשר נתכה בנו על אשר לא שמרו אבותינו את דבר יהוה לעשות ככל הכתוב על הספר הזה
    kjvRefs:
    - 2 Chronicles 34:21
    kjvOsis:
    - 2Chr.34.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:22
    ref: 2 Chronicles 34:22
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 22
    ordinal: 23145
    text: So Hilkiah, and they whom the king [had commanded], went to Huldah the prophetess, the wife of Shallum the son of Tokhath, the son of Hasrah, keeper of the wardrobe—now she dwelt in Jerusalem in the second quarter—and they spoke to her to that effect.
    translation: JPS 1917
    original: וַיֵּלֶךְ חִלְקִיָּהוּ וַאֲשֶׁר הַמֶּלֶךְ אֶל־חֻלְדָּה הַנְּבִיאָה אֵשֶׁת שַׁלֻּם בֶּן־תוקהת [תָּקְהַת] בֶּן־חַסְרָה שׁוֹמֵר הַבְּגָדִים וְהִיא יוֹשֶׁבֶת בִּירוּשָׁלִַם בַּמִּשְׁנֶה וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת׃
    hebrewPlain: וילך חלקיהו ואשר המלך אל חלדה הנביאה אשת שלם בן תוקהת [תקהת] בן חסרה שומר הבגדים והיא יושבת בירושלם במשנה וידברו אליה כזאת
    kjvRefs:
    - 2 Chronicles 34:22
    kjvOsis:
    - 2Chr.34.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:23
    ref: 2 Chronicles 34:23
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 23
    ordinal: 23146
    text: 'And she said unto them: ‘Thus saith the LORD, the God of Israel: Tell ye the man that sent you unto me:'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהֶם כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אִמְרוּ לָאִישׁ אֲשֶׁר־שָׁלַח אֶתְכֶם אֵלָי׃
    hebrewPlain: ותאמר להם כה אמר יהוה אלהי ישראל אמרו לאיש אשר שלח אתכם אלי
    kjvRefs:
    - 2 Chronicles 34:23
    kjvOsis:
    - 2Chr.34.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:24
    ref: 2 Chronicles 34:24
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 24
    ordinal: 23147
    text: 'Thus saith the LORD: Behold, I will bring evil upon this place, and upon the inhabitants thereof, even all the curses that are written in the book which they have read before the king of Judah;'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה הִנְנִי מֵבִיא רָעָה עַל־הַמָּקוֹם הַזֶּה וְעַל־יוֹשְׁבָיו אֵת כָּל־הָאָלוֹת הַכְּתוּבוֹת עַל־הַסֵּפֶר אֲשֶׁר קָרְאוּ לִפְנֵי מֶלֶךְ יְהוּדָה׃
    hebrewPlain: כה אמר יהוה הנני מביא רעה על המקום הזה ועל יושביו את כל האלות הכתובות על הספר אשר קראו לפני מלך יהודה
    kjvRefs:
    - 2 Chronicles 34:24
    kjvOsis:
    - 2Chr.34.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:25
    ref: 2 Chronicles 34:25
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 25
    ordinal: 23148
    text: because they have forsaken Me, and have offered unto other gods, that they might provoke Me with all the works of their hands; therefore is My wrath poured out upon this place, and it shall not be quenched.
    translation: JPS 1917
    original: תַּחַת אֲשֶׁר עֲזָבוּנִי ויקטירו [וַיְקַטְּרוּ] לֵאלֹהִים אֲחֵרִים לְמַעַן הַכְעִיסֵנִי בְּכֹל מַעֲשֵׂי יְדֵיהֶם וְתִתַּךְ חֲמָתִי בַּמָּקוֹם הַזֶּה וְלֹא תִכְבֶּה׃
    hebrewPlain: תחת אשר עזבוני ויקטירו [ויקטרו] לאלהים אחרים למען הכעיסני בכל מעשי ידיהם ותתך חמתי במקום הזה ולא תכבה
    kjvRefs:
    - 2 Chronicles 34:25
    kjvOsis:
    - 2Chr.34.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:26
    ref: 2 Chronicles 34:26
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 26
    ordinal: 23149
    text: 'But unto the king of Judah, who sent you to inquire of the LORD, thus shall ye say to him: Thus saith the LORD, the God of Israel: As touching the words which thou hast heard,'
    translation: JPS 1917
    original: וְאֶל־מֶלֶךְ יְהוּדָה הַשֹּׁלֵחַ אֶתְכֶם לִדְרוֹשׁ בַּיהוָה כֹּה תֹאמְרוּ אֵלָיו כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ׃
    hebrewPlain: ואל מלך יהודה השלח אתכם לדרוש ביהוה כה תאמרו אליו כה אמר יהוה אלהי ישראל הדברים אשר שמעת
    kjvRefs:
    - 2 Chronicles 34:26
    kjvOsis:
    - 2Chr.34.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:27
    ref: 2 Chronicles 34:27
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 27
    ordinal: 23150
    text: because thy heart was tender, and thou didst humble thyself before God, when thou heardest His words against this place, and against the inhabitants thereof, and hast humbled thyself before Me, and hast rent thy clothes, and wept before Me; I also have heard thee, saith the LORD.
    translation: JPS 1917
    original: יַעַן רַךְ־לְבָבְךָ וַתִּכָּנַע מִלִּפְנֵי אֱלֹהִים בְּשָׁמְעֲךָ אֶת־דְּבָרָיו עַל־הַמָּקוֹם הַזֶּה וְעַל־יֹשְׁבָיו וַתִּכָּנַע לְפָנַי וַתִּקְרַע אֶת־בְּגָדֶיךָ וַתֵּבְךְּ לְפָנָי וְגַם־אֲנִי שָׁמַעְתִּי נְאֻם־יְהוָה׃
    hebrewPlain: יען רך לבבך ותכנע מלפני אלהים בשמעך את דבריו על המקום הזה ועל ישביו ותכנע לפני ותקרע את בגדיך ותבך לפני וגם אני שמעתי נאם יהוה
    kjvRefs:
    - 2 Chronicles 34:27
    kjvOsis:
    - 2Chr.34.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:28
    ref: 2 Chronicles 34:28
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 28
    ordinal: 23151
    text: Behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil that I will bring upon this place, and upon the inhabitants thereof.’ And they brought back word unto the king.
    translation: JPS 1917
    original: הִנְנִי אֹסִפְךָ אֶל־אֲבֹתֶיךָ וְנֶאֱסַפְתָּ אֶל־קִבְרֹתֶיךָ בְּשָׁלוֹם וְלֹא־תִרְאֶינָה עֵינֶיךָ בְּכֹל הָרָעָה אֲשֶׁר אֲנִי מֵבִיא עַל־הַמָּקוֹם הַזֶּה וְעַל־יֹשְׁבָיו וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר׃
    hebrewPlain: הנני אספך אל אבתיך ונאספת אל קברתיך בשלום ולא תראינה עיניך בכל הרעה אשר אני מביא על המקום הזה ועל ישביו וישיבו את המלך דבר
    kjvRefs:
    - 2 Chronicles 34:28
    kjvOsis:
    - 2Chr.34.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:29
    ref: 2 Chronicles 34:29
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 29
    ordinal: 23152
    text: Then the king sent and gathered together all the elders of Judah and Jerusalem.
    translation: JPS 1917
    original: וַיִּשְׁלַח הַמֶּלֶךְ וַיֶּאֱסֹף אֶת־כָּל־זִקְנֵי יְהוּדָה וִירוּשָׁלִָם׃
    hebrewPlain: וישלח המלך ויאסף את כל זקני יהודה וירושלם
    kjvRefs:
    - 2 Chronicles 34:29
    kjvOsis:
    - 2Chr.34.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:30
    ref: 2 Chronicles 34:30
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 30
    ordinal: 23153
    text: And the king went up to the house of the LORD, and all the men of Judah and the inhabitants of Jerusalem, and the priests, and the Levites, and all the people, both great and small; and he read in their ears all the words of the book of the covenant that was found in the house of the LORD.
    translation: JPS 1917
    original: וַיַּעַל הַמֶּלֶךְ בֵּית־יְהוָה וְכָל־אִישׁ יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם וְהַכֹּהֲנִים וְהַלְוִיִּם וְכָל־הָעָם מִגָּדוֹל וְעַד־קָטָן וַיִּקְרָא בְאָזְנֵיהֶם אֶת־כָּל־דִּבְרֵי סֵפֶר הַבְּרִית הַנִּמְצָא בֵּית יְהוָה׃
    hebrewPlain: ויעל המלך בית יהוה וכל איש יהודה וישבי ירושלם והכהנים והלוים וכל העם מגדול ועד קטן ויקרא באזניהם את כל דברי ספר הברית הנמצא בית יהוה
    kjvRefs:
    - 2 Chronicles 34:30
    kjvOsis:
    - 2Chr.34.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:31
    ref: 2 Chronicles 34:31
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 31
    ordinal: 23154
    text: And the king stood in his place, and made a covenant before the LORD, to walk after the LORD, and to keep His commandments, and His testimonies, and His statutes, with all his heart, and with all his soul, to perform the words of the covenant that were written in this book.
    translation: JPS 1917
    original: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ וַיִּכְרֹת אֶת־הַבְּרִית לִפְנֵי יְהוָה לָלֶכֶת אַחֲרֵי יְהוָה וְלִשְׁמוֹר אֶת־מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית הַכְּתוּבִים עַל־הַסֵּפֶר הַזֶּה׃
    hebrewPlain: ויעמד המלך על עמדו ויכרת את הברית לפני יהוה ללכת אחרי יהוה ולשמור את מצותיו ועדותיו וחקיו בכל לבבו ובכל נפשו לעשות את דברי הברית הכתובים על הספר הזה
    kjvRefs:
    - 2 Chronicles 34:31
    kjvOsis:
    - 2Chr.34.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.32
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:32
    ref: 2 Chronicles 34:32
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 32
    ordinal: 23155
    text: And he caused all that were found in Jerusalem and Benjamin to stand to it. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.
    translation: JPS 1917
    original: וַיַּעֲמֵד אֵת כָּל־הַנִּמְצָא בִירוּשָׁלִַם וּבִנְיָמִן וַיַּעֲשׂוּ יֹשְׁבֵי יְרוּשָׁלִַם כִּבְרִית אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: ויעמד את כל הנמצא בירושלם ובנימן ויעשו ישבי ירושלם כברית אלהים אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 34:32
    kjvOsis:
    - 2Chr.34.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.34.33
    scripture: tanakh
    name: Tanakh 2 Chronicles 34:33
    ref: 2 Chronicles 34:33
    book: 2Chr
    section: ketuvim
    chapter: 34
    verse: 33
    ordinal: 23156
    text: And Josiah took away all the abominations out of all the countries that pertained to the children of Israel, and made all that were found in Israel to serve, even to serve the LORD their God. All his days they departed not from following the LORD, the God of their fathers.
    translation: JPS 1917
    original: וַיָּסַר יֹאשִׁיָּהוּ אֶת־כָּל־הַתּוֹעֵבוֹת מִכָּל־הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל וַיַּעֲבֵד אֵת כָּל־הַנִּמְצָא בְּיִשְׂרָאֵל לַעֲבוֹד אֶת־יְהוָה אֱלֹהֵיהֶם כָּל־יָמָיו לֹא סָרוּ מֵאַחֲרֵי יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם׃
    hebrewPlain: ויסר יאשיהו את כל התועבות מכל הארצות אשר לבני ישראל ויעבד את כל הנמצא בישראל לעבוד את יהוה אלהיהם כל ימיו לא סרו מאחרי יהוה אלהי אבותיהם
    kjvRefs:
    - 2 Chronicles 34:33
    kjvOsis:
    - 2Chr.34.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.34
- type: TanakhVerse
  data:
    osis: 2Chr.35.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:1
    ref: 2 Chronicles 35:1
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 1
    ordinal: 23157
    text: And Josiah kept a passover unto the LORD in Jerusalem; and they killed the passover lamb on the fourteenth day of the first month.
    translation: JPS 1917
    original: וַיַּעַשׂ יֹאשִׁיָּהוּ בִירוּשָׁלִַם פֶּסַח לַיהוָה וַיִּשְׁחֲטוּ הַפֶּסַח בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן׃
    hebrewPlain: ויעש יאשיהו בירושלם פסח ליהוה וישחטו הפסח בארבעה עשר לחדש הראשון
    kjvRefs:
    - 2 Chronicles 35:1
    kjvOsis:
    - 2Chr.35.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:2
    ref: 2 Chronicles 35:2
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 2
    ordinal: 23158
    text: And he set the priests in their charges, and encouraged them to the service of the house of the LORD.
    translation: JPS 1917
    original: וַיַּעֲמֵד הַכֹּהֲנִים עַל־מִשְׁמְרוֹתָם וַיְחַזְּקֵם לַעֲבוֹדַת בֵּית יְהוָה׃
    hebrewPlain: ויעמד הכהנים על משמרותם ויחזקם לעבודת בית יהוה
    kjvRefs:
    - 2 Chronicles 35:2
    kjvOsis:
    - 2Chr.35.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:3
    ref: 2 Chronicles 35:3
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 3
    ordinal: 23159
    text: 'And he said unto the Levites that taught all Israel, that were holy unto the LORD: ‘Put the holy ark in the house which Solomon the son of David king of Israel did build; there shall no more be a burden upon your shoulders; now serve the LORD your God, and His people Israel.'
    translation: JPS 1917
    original: וַיֹּאמֶר לַלְוִיִּם המבונים [הַמְּבִינִים] לְכָל־יִשְׂרָאֵל הַקְּדוֹשִׁים לַיהוָה תְּנוּ אֶת־אֲרוֹן־הַקֹּדֶשׁ בַּבַּיִת אֲשֶׁר בָּנָה שְׁלֹמֹה בֶן־דָּוִיד מֶלֶךְ יִשְׂרָאֵל אֵין־לָכֶם מַשָּׂא בַּכָּתֵף עַתָּה עִבְדוּ אֶת־יְהוָה אֱלֹהֵיכֶם וְאֵת עַמּוֹ יִשְׂרָאֵל׃
    hebrewPlain: ויאמר ללוים המבונים [המבינים] לכל ישראל הקדושים ליהוה תנו את ארון הקדש בבית אשר בנה שלמה בן דויד מלך ישראל אין לכם משא בכתף עתה עבדו את יהוה אלהיכם ואת עמו ישראל
    kjvRefs:
    - 2 Chronicles 35:3
    kjvOsis:
    - 2Chr.35.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:4
    ref: 2 Chronicles 35:4
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 4
    ordinal: 23160
    text: And prepare ye after your fathers’ houses by your courses, according to the writing of David king of Israel, and according to the writing of Solomon his son.
    translation: JPS 1917
    original: וְהָכִונוּ לְבֵית־אֲבוֹתֵיכֶם כְּמַחְלְקוֹתֵיכֶם בִּכְתָב דָּוִיד מֶלֶךְ יִשְׂרָאֵל וּבְמִכְתַּב שְׁלֹמֹה בְנוֹ׃
    hebrewPlain: והכונו לבית אבותיכם כמחלקותיכם בכתב דויד מלך ישראל ובמכתב שלמה בנו
    kjvRefs:
    - 2 Chronicles 35:4
    kjvOsis:
    - 2Chr.35.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:5
    ref: 2 Chronicles 35:5
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 5
    ordinal: 23161
    text: And stand in the holy place according to the divisions of the fathers’ houses of your brethren the children of the people, and [let there be for each] a portion of a father’s house of the Levites.
    translation: JPS 1917
    original: וְעִמְדוּ בַקֹּדֶשׁ לִפְלֻגּוֹת בֵּית הָאָבוֹת לַאֲחֵיכֶם בְּנֵי הָעָם וַחֲלֻקַּת בֵּית־אָב לַלְוִיִּם׃
    hebrewPlain: ועמדו בקדש לפלגות בית האבות לאחיכם בני העם וחלקת בית אב ללוים
    kjvRefs:
    - 2 Chronicles 35:5
    kjvOsis:
    - 2Chr.35.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:6
    ref: 2 Chronicles 35:6
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 6
    ordinal: 23162
    text: And kill the passover lamb, and sanctify yourselves, and prepare for your brethren, to do according to the word of the LORD by the hand of Moses.’
    translation: JPS 1917
    original: וְשַׁחֲטוּ הַפָּסַח וְהִתְקַדְּשׁוּ וְהָכִינוּ לַאֲחֵיכֶם לַעֲשׂוֹת כִּדְבַר־יְהוָה בְּיַד־מֹשֶׁה׃
    hebrewPlain: ושחטו הפסח והתקדשו והכינו לאחיכם לעשות כדבר יהוה ביד משה
    kjvRefs:
    - 2 Chronicles 35:6
    kjvOsis:
    - 2Chr.35.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:7
    ref: 2 Chronicles 35:7
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 7
    ordinal: 23163
    text: And Josiah gave to the children of the people, of the flock, lambs and kids, all of them for the passover-offerings, unto all that were present, to the number of thirty thousand, and three thousand bullocks; these were of the king’s substance.
    translation: JPS 1917
    original: וַיָּרֶם יֹאשִׁיָּהוּ לִבְנֵי הָעָם צֹאן כְּבָשִׂים וּבְנֵי־עִזִּים הַכֹּל לַפְּסָחִים לְכָל־הַנִּמְצָא לְמִסְפַּר שְׁלֹשִׁים אֶלֶף וּבָקָר שְׁלֹשֶׁת אֲלָפִים אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ׃
    hebrewPlain: וירם יאשיהו לבני העם צאן כבשים ובני עזים הכל לפסחים לכל הנמצא למספר שלשים אלף ובקר שלשת אלפים אלה מרכוש המלך
    kjvRefs:
    - 2 Chronicles 35:7
    kjvOsis:
    - 2Chr.35.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:8
    ref: 2 Chronicles 35:8
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 8
    ordinal: 23164
    text: And his princes gave willingly unto the people, to the priests, and to the Levites. Hilkiah and Zechariah and Jehiel, the rulers of the house of God, gave unto the priests for the passover-offerings two thousand and six hundred [small cattle], and three hundred oxen.
    translation: JPS 1917
    original: וְשָׂרָיו לִנְדָבָה לָעָם לַכֹּהֲנִים וְלַלְוִיִּם הֵרִימוּ חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל נְגִידֵי בֵּית הָאֱלֹהִים לַכֹּהֲנִים נָתְנוּ לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּבָקָר שְׁלֹשׁ מֵאוֹת׃
    hebrewPlain: ושריו לנדבה לעם לכהנים וללוים הרימו חלקיה וזכריהו ויחיאל נגידי בית האלהים לכהנים נתנו לפסחים אלפים ושש מאות ובקר שלש מאות
    kjvRefs:
    - 2 Chronicles 35:8
    kjvOsis:
    - 2Chr.35.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:9
    ref: 2 Chronicles 35:9
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 9
    ordinal: 23165
    text: Conaniah also, and Shemaiah and Nethanel, his brethren, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, gave unto the Levites for the passover-offerings five thousand [small cattle], and five hundred oxen.
    translation: JPS 1917
    original: וכונניהו [וְכָנַנְיָהוּ] וּשְׁמַעְיָהוּ וּנְתַנְאֵל אֶחָיו וַחֲשַׁבְיָהוּ וִיעִיאֵל וְיוֹזָבָד שָׂרֵי הַלְוִיִּם הֵרִימוּ לַלְוִיִּם לַפְּסָחִים חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת׃
    hebrewPlain: וכונניהו [וכנניהו] ושמעיהו ונתנאל אחיו וחשביהו ויעיאל ויוזבד שרי הלוים הרימו ללוים לפסחים חמשת אלפים ובקר חמש מאות
    kjvRefs:
    - 2 Chronicles 35:9
    kjvOsis:
    - 2Chr.35.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:10
    ref: 2 Chronicles 35:10
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 10
    ordinal: 23166
    text: So the service was prepared, and the priests stood in their place, and the Levites by their courses, according to the king’s commandment.
    translation: JPS 1917
    original: וַתִּכּוֹן הָעֲבוֹדָה וַיַּעַמְדוּ הַכֹּהֲנִים עַל־עָמְדָם וְהַלְוִיִּם עַל־מַחְלְקוֹתָם כְּמִצְוַת הַמֶּלֶךְ׃
    hebrewPlain: ותכון העבודה ויעמדו הכהנים על עמדם והלוים על מחלקותם כמצות המלך
    kjvRefs:
    - 2 Chronicles 35:10
    kjvOsis:
    - 2Chr.35.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:11
    ref: 2 Chronicles 35:11
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 11
    ordinal: 23167
    text: And they killed the passover lamb, and the priests dashed [the blood, which they received] of their hand, and the Levites flayed them.
    translation: JPS 1917
    original: וַיִּשְׁחֲטוּ הַפָּסַח וַיִּזְרְקוּ הַכֹּהֲנִים מִיָּדָם וְהַלְוִיִּם מַפְשִׁיטִים׃
    hebrewPlain: וישחטו הפסח ויזרקו הכהנים מידם והלוים מפשיטים
    kjvRefs:
    - 2 Chronicles 35:11
    kjvOsis:
    - 2Chr.35.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:12
    ref: 2 Chronicles 35:12
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 12
    ordinal: 23168
    text: And they removed the portions that were to be burnt, that they might give them to the divisions of the fathers’ houses of the children of the people, to present unto the LORD, as it is written in the book of Moses. And so did they with the oxen.
    translation: JPS 1917
    original: וַיָּסִירוּ הָעֹלָה לְתִתָּם לְמִפְלַגּוֹת לְבֵית־אָבוֹת לִבְנֵי הָעָם לְהַקְרִיב לַיהוָה כַּכָּתוּב בְּסֵפֶר מֹשֶׁה וְכֵן לַבָּקָר׃
    hebrewPlain: ויסירו העלה לתתם למפלגות לבית אבות לבני העם להקריב ליהוה ככתוב בספר משה וכן לבקר
    kjvRefs:
    - 2 Chronicles 35:12
    kjvOsis:
    - 2Chr.35.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:13
    ref: 2 Chronicles 35:13
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 13
    ordinal: 23169
    text: And they roasted the passover with fire according to the ordinance; and the holy offerings sod they in pots, and in caldrons, and in pans, and carried them quickly to all the children of the people.
    translation: JPS 1917
    original: וַיְבַשְּׁלוּ הַפֶּסַח בָּאֵשׁ כַּמִּשְׁפָּט וְהַקֳּדָשִׁים בִּשְּׁלוּ בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת וַיָּרִיצוּ לְכָל־בְּנֵי הָעָם׃
    hebrewPlain: ויבשלו הפסח באש כמשפט והקדשים בשלו בסירות ובדודים ובצלחות ויריצו לכל בני העם
    kjvRefs:
    - 2 Chronicles 35:13
    kjvOsis:
    - 2Chr.35.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:14
    ref: 2 Chronicles 35:14
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 14
    ordinal: 23170
    text: And afterward they prepared for themselves, and for the priests; because the priests the sons of Aaron were busied in offering the portions that were to be burnt and the fat until night; therefore the Levites prepared for themselves, and for the priests the sons of Aaron.
    translation: JPS 1917
    original: וְאַחַר הֵכִינוּ לָהֶם וְלַכֹּהֲנִים כִּי הַכֹּהֲנִים בְּנֵי אַהֲרֹן בְּהַעֲלוֹת הָעוֹלָה וְהַחֲלָבִים עַד־לָיְלָה וְהַלְוִיִּם הֵכִינוּ לָהֶם וְלַכֹּהֲנִים בְּנֵי אַהֲרֹן׃
    hebrewPlain: ואחר הכינו להם ולכהנים כי הכהנים בני אהרן בהעלות העולה והחלבים עד לילה והלוים הכינו להם ולכהנים בני אהרן
    kjvRefs:
    - 2 Chronicles 35:14
    kjvOsis:
    - 2Chr.35.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:15
    ref: 2 Chronicles 35:15
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 15
    ordinal: 23171
    text: And the singers the sons of Asaph were in their place, according to the commandment of David, and Asaph, and Heman, and Jeduthun the king’s seer; and the porters were at every gate; they needed not to depart from their service, for their brethren the Levites prepared for them.
    translation: JPS 1917
    original: וְהַמְשֹׁרֲרִים בְּנֵי־אָסָף עַל־מַעֲמָדָם כְּמִצְוַת דָּוִיד וְאָסָף וְהֵימָן וִידֻתוּן חוֹזֵה הַמֶּלֶךְ וְהַשֹּׁעֲרִים לְשַׁעַר וָשָׁעַר אֵין לָהֶם לָסוּר מֵעַל עֲבֹדָתָם כִּי־אֲחֵיהֶם הַלְוִיִּם הֵכִינוּ לָהֶם׃
    hebrewPlain: והמשררים בני אסף על מעמדם כמצות דויד ואסף והימן וידתון חוזה המלך והשערים לשער ושער אין להם לסור מעל עבדתם כי אחיהם הלוים הכינו להם
    kjvRefs:
    - 2 Chronicles 35:15
    kjvOsis:
    - 2Chr.35.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:16
    ref: 2 Chronicles 35:16
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 16
    ordinal: 23172
    text: So all the service of the LORD was prepared the same day, to keep the passover, and to offer burnt-offerings upon the altar of the LORD, according to the commandment of king Josiah.
    translation: JPS 1917
    original: וַתִּכּוֹן כָּל־עֲבוֹדַת יְהוָה בַּיּוֹם הַהוּא לַעֲשׂוֹת הַפֶּסַח וְהַעֲלוֹת עֹלוֹת עַל מִזְבַּח יְהוָה כְּמִצְוַת הַמֶּלֶךְ יֹאשִׁיָּהוּ׃
    hebrewPlain: ותכון כל עבודת יהוה ביום ההוא לעשות הפסח והעלות עלות על מזבח יהוה כמצות המלך יאשיהו
    kjvRefs:
    - 2 Chronicles 35:16
    kjvOsis:
    - 2Chr.35.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:17
    ref: 2 Chronicles 35:17
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 17
    ordinal: 23173
    text: And the children of Israel that were present kept the passover at that time, and the feast of unleavened bread seven days.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־יִשְׂרָאֵל הַנִּמְצְאִים אֶת־הַפֶּסַח בָּעֵת הַהִיא וְאֶת־חַג הַמַּצּוֹת שִׁבְעַת יָמִים׃
    hebrewPlain: ויעשו בני ישראל הנמצאים את הפסח בעת ההיא ואת חג המצות שבעת ימים
    kjvRefs:
    - 2 Chronicles 35:17
    kjvOsis:
    - 2Chr.35.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:18
    ref: 2 Chronicles 35:18
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 18
    ordinal: 23174
    text: And there was no passover like to that kept in Israel from the days of Samuel the prophet; neither did any of the kings of Israel keep such a passover as Josiah kept, and the priests, and the Levites, and all Judah and Israel that were present, and the inhabitants of Jerusalem.
    translation: JPS 1917
    original: וְלֹא־נַעֲשָׂה פֶסַח כָּמֹהוּ בְּיִשְׂרָאֵל מִימֵי שְׁמוּאֵל הַנָּבִיא וְכָל־מַלְכֵי יִשְׂרָאֵל לֹא־עָשׂוּ כַּפֶּסַח אֲשֶׁר־עָשָׂה יֹאשִׁיָּהוּ וְהַכֹּהֲנִים וְהַלְוִיִּם וְכָל־יְהוּדָה וְיִשְׂרָאֵל הַנִּמְצָא וְיוֹשְׁבֵי יְרוּשָׁלִָם׃
    hebrewPlain: ולא נעשה פסח כמהו בישראל מימי שמואל הנביא וכל מלכי ישראל לא עשו כפסח אשר עשה יאשיהו והכהנים והלוים וכל יהודה וישראל הנמצא ויושבי ירושלם
    kjvRefs:
    - 2 Chronicles 35:18
    kjvOsis:
    - 2Chr.35.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:19
    ref: 2 Chronicles 35:19
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 19
    ordinal: 23175
    text: In the eighteenth year of the reign of Josiah was this passover kept.
    translation: JPS 1917
    original: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה לְמַלְכוּת יֹאשִׁיָּהוּ נַעֲשָׂה הַפֶּסַח הַזֶּה׃
    hebrewPlain: בשמונה עשרה שנה למלכות יאשיהו נעשה הפסח הזה
    kjvRefs:
    - 2 Chronicles 35:19
    kjvOsis:
    - 2Chr.35.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:20
    ref: 2 Chronicles 35:20
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 20
    ordinal: 23176
    text: After all this, when Josiah had prepared the temple, Neco king of Egypt went up to fight against Carchemish by the Euphrates; and Josiah went out against him.
    translation: JPS 1917
    original: אַחֲרֵי כָל־זֹאת אֲשֶׁר הֵכִין יֹאשִׁיָּהוּ אֶת־הַבַּיִת עָלָה נְכוֹ מֶלֶךְ־מִצְרַיִם לְהִלָּחֵם בְּכַרְכְּמִישׁ עַל־פְּרָת וַיֵּצֵא לִקְרָאתוֹ יֹאשִׁיָּהוּ׃
    hebrewPlain: אחרי כל זאת אשר הכין יאשיהו את הבית עלה נכו מלך מצרים להלחם בכרכמיש על פרת ויצא לקראתו יאשיהו
    kjvRefs:
    - 2 Chronicles 35:20
    kjvOsis:
    - 2Chr.35.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:21
    ref: 2 Chronicles 35:21
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 21
    ordinal: 23177
    text: 'But he sent ambassadors to him, saying: ‘What have I to do with thee, thou king of Judah? I come not against thee this day, but against the house wherewith I have war; and God hath given command to speed me; forbear thee from meddling with God, who is with me, that He destroy thee not.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֵלָיו מַלְאָכִים לֵאמֹר מַה־לִּי וָלָךְ מֶלֶךְ יְהוּדָה לֹא־עָלֶיךָ אַתָּה הַיּוֹם כִּי אֶל־בֵּית מִלְחַמְתִּי וֵאלֹהִים אָמַר לְבַהֲלֵנִי חֲדַל־לְךָ מֵאֱלֹהִים אֲשֶׁר־עִמִּי וְאַל־יַשְׁחִיתֶךָ׃
    hebrewPlain: וישלח אליו מלאכים לאמר מה לי ולך מלך יהודה לא עליך אתה היום כי אל בית מלחמתי ואלהים אמר לבהלני חדל לך מאלהים אשר עמי ואל ישחיתך
    kjvRefs:
    - 2 Chronicles 35:21
    kjvOsis:
    - 2Chr.35.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:22
    ref: 2 Chronicles 35:22
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 22
    ordinal: 23178
    text: Nevertheless Josiah would not turn his face from him, but disguised himself, that he might fight with him, and hearkened not unto the words of Neco, from the mouth of God, and came to fight in the valley of Megiddo.
    translation: JPS 1917
    original: וְלֹא־הֵסֵב יֹאשִׁיָּהוּ פָנָיו מִמֶּנּוּ כִּי לְהִלָּחֵם־בּוֹ הִתְחַפֵּשׂ וְלֹא שָׁמַע אֶל־דִּבְרֵי נְכוֹ מִפִּי אֱלֹהִים וַיָּבֹא לְהִלָּחֵם בְּבִקְעַת מְגִדּוֹ׃
    hebrewPlain: ולא הסב יאשיהו פניו ממנו כי להלחם בו התחפש ולא שמע אל דברי נכו מפי אלהים ויבא להלחם בבקעת מגדו
    kjvRefs:
    - 2 Chronicles 35:22
    kjvOsis:
    - 2Chr.35.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:23
    ref: 2 Chronicles 35:23
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 23
    ordinal: 23179
    text: 'And the archers shot at king Josiah; and the king said to his servants: ‘Have me away; for I am sore wounded.’'
    translation: JPS 1917
    original: וַיֹּרוּ הַיֹּרִים לַמֶּלֶךְ יֹאשִׁיָּהוּ וַיֹּאמֶר הַמֶּלֶךְ לַעֲבָדָיו הַעֲבִירוּנִי כִּי הָחֳלֵיתִי מְאֹד׃
    hebrewPlain: וירו הירים למלך יאשיהו ויאמר המלך לעבדיו העבירוני כי החליתי מאד
    kjvRefs:
    - 2 Chronicles 35:23
    kjvOsis:
    - 2Chr.35.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:24
    ref: 2 Chronicles 35:24
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 24
    ordinal: 23180
    text: So his servants took him out of the chariot, and put him in the second chariot that he had, and brought him to Jerusalem; and he died, and was buried in the sepulchres of his fathers. And all Judah and Jerusalem mourned for Josiah.
    translation: JPS 1917
    original: וַיַּעֲבִירֻהוּ עֲבָדָיו מִן־הַמֶּרְכָּבָה וַיַּרְכִּיבֻהוּ עַל רֶכֶב הַמִּשְׁנֶה אֲשֶׁר־לוֹ וַיּוֹלִיכֻהוּ יְרוּשָׁלִַם וַיָּמָת וַיִּקָּבֵר בְּקִבְרוֹת אֲבֹתָיו וְכָל־יְהוּדָה וִירוּשָׁלִַם מִתְאַבְּלִים עַל־יֹאשִׁיָּהוּ׃
    hebrewPlain: ויעבירהו עבדיו מן המרכבה וירכיבהו על רכב המשנה אשר לו ויוליכהו ירושלם וימת ויקבר בקברות אבתיו וכל יהודה וירושלם מתאבלים על יאשיהו
    kjvRefs:
    - 2 Chronicles 35:24
    kjvOsis:
    - 2Chr.35.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:25
    ref: 2 Chronicles 35:25
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 25
    ordinal: 23181
    text: And Jeremiah lamented for Josiah; and all the singing men and singing women spoke of Josiah in their lamentations, unto this day; and they made them an ordinance in Israel; and, behold, they are written in the lamentations.
    translation: JPS 1917
    original: וַיְקוֹנֵן יִרְמְיָהוּ עַל־יֹאשִׁיָּהוּ וַיֹּאמְרוּ כָל־הַשָּׁרִים וְהַשָּׁרוֹת בְּקִינוֹתֵיהֶם עַל־יֹאשִׁיָּהוּ עַד־הַיּוֹם וַיִּתְּנוּם לְחֹק עַל־יִשְׂרָאֵל וְהִנָּם כְּתוּבִים עַל־הַקִּינוֹת׃
    hebrewPlain: ויקונן ירמיהו על יאשיהו ויאמרו כל השרים והשרות בקינותיהם על יאשיהו עד היום ויתנום לחק על ישראל והנם כתובים על הקינות
    kjvRefs:
    - 2 Chronicles 35:25
    kjvOsis:
    - 2Chr.35.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:26
    ref: 2 Chronicles 35:26
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 26
    ordinal: 23182
    text: Now the rest of the acts of Josiah, and his good deeds, according to that which is written in the Law of the LORD,
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ וַחֲסָדָיו כַּכָּתוּב בְּתוֹרַת יְהוָה׃
    hebrewPlain: ויתר דברי יאשיהו וחסדיו ככתוב בתורת יהוה
    kjvRefs:
    - 2 Chronicles 35:26
    kjvOsis:
    - 2Chr.35.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.35.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 35:27
    ref: 2 Chronicles 35:27
    book: 2Chr
    section: ketuvim
    chapter: 35
    verse: 27
    ordinal: 23183
    text: and his acts, first and last, behold, they are written in the book of the kings of Israel and Judah.
    translation: JPS 1917
    original: וּדְבָרָיו הָרִאשֹׁנִים וְהָאַחֲרֹנִים הִנָּם כְּתוּבִים עַל־סֵפֶר מַלְכֵי־יִשְׂרָאֵל וִיהוּדָה׃
    hebrewPlain: ודבריו הראשנים והאחרנים הנם כתובים על ספר מלכי ישראל ויהודה
    kjvRefs:
    - 2 Chronicles 35:27
    kjvOsis:
    - 2Chr.35.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.35
- type: TanakhVerse
  data:
    osis: 2Chr.36.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:1
    ref: 2 Chronicles 36:1
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 1
    ordinal: 23184
    text: Then the people of the land took Jehoahaz the son of Josiah, and made him king in his father’s stead in Jerusalem.
    translation: JPS 1917
    original: וַיִּקְחוּ עַם־הָאָרֶץ אֶת־יְהוֹאָחָז בֶּן־יֹאשִׁיָּהוּ וַיַּמְלִיכֻהוּ תַחַת־אָבִיו בִּירוּשָׁלִָם׃
    hebrewPlain: ויקחו עם הארץ את יהואחז בן יאשיהו וימליכהו תחת אביו בירושלם
    kjvRefs:
    - 2 Chronicles 36:1
    kjvOsis:
    - 2Chr.36.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:2
    ref: 2 Chronicles 36:2
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 2
    ordinal: 23185
    text: Joahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem.
    translation: JPS 1917
    original: בֶּן־שָׁלוֹשׁ וְעֶשְׂרִים שָׁנָה יוֹאָחָז בְּמָלְכוֹ וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן שלוש ועשרים שנה יואחז במלכו ושלשה חדשים מלך בירושלם
    kjvRefs:
    - 2 Chronicles 36:2
    kjvOsis:
    - 2Chr.36.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:3
    ref: 2 Chronicles 36:3
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 3
    ordinal: 23186
    text: And the king of Egypt deposed him at Jerusalem, and fined the land a hundred talents of silver and a talent of gold.
    translation: JPS 1917
    original: וַיְסִירֵהוּ מֶלֶךְ־מִצְרַיִם בִּירוּשָׁלִָם וַיַּעֲנֹשׁ אֶת־הָאָרֶץ מֵאָה כִכַּר־כֶּסֶף וְכִכַּר זָהָב׃
    hebrewPlain: ויסירהו מלך מצרים בירושלם ויענש את הארץ מאה ככר כסף וככר זהב
    kjvRefs:
    - 2 Chronicles 36:3
    kjvOsis:
    - 2Chr.36.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:4
    ref: 2 Chronicles 36:4
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 4
    ordinal: 23187
    text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and changed his name to Jehoiakim. And Neco took Joahaz his brother, and carried him to Egypt.
    translation: JPS 1917
    original: וַיַּמְלֵךְ מֶלֶךְ־מִצְרַיִם אֶת־אֶלְיָקִים אָחִיו עַל־יְהוּדָה וִירוּשָׁלִַם וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים וְאֶת־יוֹאָחָז אָחִיו לָקַח נְכוֹ וַיְבִיאֵהוּ מִצְרָיְמָה׃
    hebrewPlain: וימלך מלך מצרים את אליקים אחיו על יהודה וירושלם ויסב את שמו יהויקים ואת יואחז אחיו לקח נכו ויביאהו מצרימה
    kjvRefs:
    - 2 Chronicles 36:4
    kjvOsis:
    - 2Chr.36.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:5
    ref: 2 Chronicles 36:5
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 5
    ordinal: 23188
    text: Jehoiakim was twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem; and he did that which was evil in the sight of the LORD his God.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה יְהוֹיָקִים בְּמָלְכוֹ וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה אֱלֹהָיו׃
    hebrewPlain: בן עשרים וחמש שנה יהויקים במלכו ואחת עשרה שנה מלך בירושלם ויעש הרע בעיני יהוה אלהיו
    kjvRefs:
    - 2 Chronicles 36:5
    kjvOsis:
    - 2Chr.36.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:6
    ref: 2 Chronicles 36:6
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 6
    ordinal: 23189
    text: Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon.
    translation: JPS 1917
    original: עָלָיו עָלָה נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל וַיַּאַסְרֵהוּ בַּנְחֻשְׁתַּיִם לְהֹלִיכוֹ בָּבֶלָה׃
    hebrewPlain: עליו עלה נבוכדנאצר מלך בבל ויאסרהו בנחשתים להליכו בבלה
    kjvRefs:
    - 2 Chronicles 36:6
    kjvOsis:
    - 2Chr.36.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:7
    ref: 2 Chronicles 36:7
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 7
    ordinal: 23190
    text: Nebuchadnezzar also carried of the vessels of the house of the LORD to Babylon, and put them in his temple at Babylon.
    translation: JPS 1917
    original: וּמִכְּלֵי בֵּית יְהוָה הֵבִיא נְבוּכַדְנֶאצַּר לְבָבֶל וַיִּתְּנֵם בְּהֵיכָלוֹ בְּבָבֶל׃
    hebrewPlain: ומכלי בית יהוה הביא נבוכדנאצר לבבל ויתנם בהיכלו בבבל
    kjvRefs:
    - 2 Chronicles 36:7
    kjvOsis:
    - 2Chr.36.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:8
    ref: 2 Chronicles 36:8
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 8
    ordinal: 23191
    text: Now the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they are written in the book of the kings of Israel and Judah; and Jehoiachin his son reigned in his stead. .
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים וְתֹעֲבֹתָיו אֲשֶׁר־עָשָׂה וְהַנִּמְצָא עָלָיו הִנָּם כְּתוּבִים עַל־סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: ויתר דברי יהויקים ותעבתיו אשר עשה והנמצא עליו הנם כתובים על ספר מלכי ישראל ויהודה וימלך יהויכין בנו תחתיו
    kjvRefs:
    - 2 Chronicles 36:8
    kjvOsis:
    - 2Chr.36.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:9
    ref: 2 Chronicles 36:9
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 9
    ordinal: 23192
    text: Jehoiachin was eight years old when he began to reign; and he reigned three months and ten days in Jerusalem; and he did that which was evil in the sight of the LORD.
    translation: JPS 1917
    original: בֶּן־שְׁמוֹנֶה שָׁנִים יְהוֹיָכִין בְּמָלְכוֹ וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים מָלַךְ בִּירוּשָׁלִָם וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: בן שמונה שנים יהויכין במלכו ושלשה חדשים ועשרת ימים מלך בירושלם ויעש הרע בעיני יהוה
    kjvRefs:
    - 2 Chronicles 36:9
    kjvOsis:
    - 2Chr.36.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:10
    ref: 2 Chronicles 36:10
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 10
    ordinal: 23193
    text: And at the return of the year king Nebuchadnezzar sent, and brought him to Babylon, with the goodly vessels of the house of the LORD, and made Zedekiah his brother king over Judah and Jerusalem.
    translation: JPS 1917
    original: וְלִתְשׁוּבַת הַשָּׁנָה שָׁלַח הַמֶּלֶךְ נְבוּכַדְנֶאצַּר וַיְבִאֵהוּ בָבֶלָה עִם־כְּלֵי חֶמְדַּת בֵּית־יְהוָה וַיַּמְלֵךְ אֶת־צִדְקִיָּהוּ אָחִיו עַל־יְהוּדָה וִירוּשָׁלִָם׃
    hebrewPlain: ולתשובת השנה שלח המלך נבוכדנאצר ויבאהו בבלה עם כלי חמדת בית יהוה וימלך את צדקיהו אחיו על יהודה וירושלם
    kjvRefs:
    - 2 Chronicles 36:10
    kjvOsis:
    - 2Chr.36.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:11
    ref: 2 Chronicles 36:11
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 11
    ordinal: 23194
    text: Zedekiah was twenty and one years old when he began to reign; and he reigned eleven years in Jerusalem;
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְאַחַת שָׁנָה צִדְקִיָּהוּ בְמָלְכוֹ וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן עשרים ואחת שנה צדקיהו במלכו ואחת עשרה שנה מלך בירושלם
    kjvRefs:
    - 2 Chronicles 36:11
    kjvOsis:
    - 2Chr.36.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:12
    ref: 2 Chronicles 36:12
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 12
    ordinal: 23195
    text: and he did that which was evil in the sight of the LORD his God; he humbled not himself before Jeremiah the prophet speaking from the mouth of the LORD.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה אֱלֹהָיו לֹא נִכְנַע מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא מִפִּי יְהוָה׃
    hebrewPlain: ויעש הרע בעיני יהוה אלהיו לא נכנע מלפני ירמיהו הנביא מפי יהוה
    kjvRefs:
    - 2 Chronicles 36:12
    kjvOsis:
    - 2Chr.36.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:13
    ref: 2 Chronicles 36:13
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 13
    ordinal: 23196
    text: And he also rebelled against king Nebuchadnezzar, who had made him swear by God; but he stiffened his neck, and hardened his heart from turning unto the LORD, the God of Israel.
    translation: JPS 1917
    original: וְגַם בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים וַיֶּקֶשׁ אֶת־עָרְפּוֹ וַיְאַמֵּץ אֶת־לְבָבוֹ מִשּׁוּב אֶל־יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: וגם במלך נבוכדנאצר מרד אשר השביעו באלהים ויקש את ערפו ויאמץ את לבבו משוב אל יהוה אלהי ישראל
    kjvRefs:
    - 2 Chronicles 36:13
    kjvOsis:
    - 2Chr.36.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:14
    ref: 2 Chronicles 36:14
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 14
    ordinal: 23197
    text: Moreover all the chiefs of the priests, and the people, transgressed very greatly after all the abominations of the nations; and they polluted the house of the LORD which He had hallowed in Jerusalem.
    translation: JPS 1917
    original: גַּם כָּל־שָׂרֵי הַכֹּהֲנִים וְהָעָם הִרְבּוּ לִמְעָול־מַעַל כְּכֹל תֹּעֲבוֹת הַגּוֹיִם וַיְטַמְּאוּ אֶת־בֵּית יְהוָה אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם׃
    hebrewPlain: גם כל שרי הכהנים והעם הרבו למעול מעל ככל תעבות הגוים ויטמאו את בית יהוה אשר הקדיש בירושלם
    kjvRefs:
    - 2 Chronicles 36:14
    kjvOsis:
    - 2Chr.36.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:15
    ref: 2 Chronicles 36:15
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 15
    ordinal: 23198
    text: And the LORD, the God of their fathers, sent to them by His messengers, sending betimes and often; because He had compassion on His people, and on His dwelling-place;
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם עֲלֵיהֶם בְּיַד מַלְאָכָיו הַשְׁכֵּם וְשָׁלוֹחַ כִּי־חָמַל עַל־עַמּוֹ וְעַל־מְעוֹנוֹ׃
    hebrewPlain: וישלח יהוה אלהי אבותיהם עליהם ביד מלאכיו השכם ושלוח כי חמל על עמו ועל מעונו
    kjvRefs:
    - 2 Chronicles 36:15
    kjvOsis:
    - 2Chr.36.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:16
    ref: 2 Chronicles 36:16
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 16
    ordinal: 23199
    text: but they mocked the messengers of God, and despised His words, and scoffed at His prophets, until the wrath of the LORD arose against His people, till there was no remedy.
    translation: JPS 1917
    original: וַיִּהְיוּ מַלְעִבִים בְּמַלְאֲכֵי הָאֱלֹהִים וּבוֹזִים דְּבָרָיו וּמִתַּעְתְּעִים בִּנְבִאָיו עַד עֲלוֹת חֲמַת־יְהוָה בְּעַמּוֹ עַד־לְאֵין מַרְפֵּא׃
    hebrewPlain: ויהיו מלעבים במלאכי האלהים ובוזים דבריו ומתעתעים בנבאיו עד עלות חמת יהוה בעמו עד לאין מרפא
    kjvRefs:
    - 2 Chronicles 36:16
    kjvOsis:
    - 2Chr.36.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:17
    ref: 2 Chronicles 36:17
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 17
    ordinal: 23200
    text: Therefore He brought upon them the king of the Chaldeans, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man or hoary-headed; He gave them all into his hand.
    translation: JPS 1917
    original: וַיַּעַל עֲלֵיהֶם אֶת־מֶלֶךְ כשדיים [כַּשְׂדִּים] וַיַּהֲרֹג בַּחוּרֵיהֶם בַּחֶרֶב בְּבֵית מִקְדָּשָׁם וְלֹא חָמַל עַל־בָּחוּר וּבְתוּלָה זָקֵן וְיָשֵׁשׁ הַכֹּל נָתַן בְּיָדוֹ׃
    hebrewPlain: ויעל עליהם את מלך כשדיים [כשדים] ויהרג בחוריהם בחרב בבית מקדשם ולא חמל על בחור ובתולה זקן וישש הכל נתן בידו
    kjvRefs:
    - 2 Chronicles 36:17
    kjvOsis:
    - 2Chr.36.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:18
    ref: 2 Chronicles 36:18
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 18
    ordinal: 23201
    text: And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all these he brought to Babylon.
    translation: JPS 1917
    original: וְכֹל כְּלֵי בֵּית הָאֱלֹהִים הַגְּדֹלִים וְהַקְּטַנִּים וְאֹצְרוֹת בֵּית יְהוָה וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו הַכֹּל הֵבִיא בָבֶל׃
    hebrewPlain: וכל כלי בית האלהים הגדלים והקטנים ואצרות בית יהוה ואצרות המלך ושריו הכל הביא בבל
    kjvRefs:
    - 2 Chronicles 36:18
    kjvOsis:
    - 2Chr.36.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:19
    ref: 2 Chronicles 36:19
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 19
    ordinal: 23202
    text: And they burnt the house of God, and broke down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof.
    translation: JPS 1917
    original: וַיִּשְׂרְפוּ אֶת־בֵּית הָאֱלֹהִים וַיְנַתְּצוּ אֵת חוֹמַת יְרוּשָׁלִָם וְכָל־אַרְמְנוֹתֶיהָ שָׂרְפוּ בָאֵשׁ וְכָל־כְּלֵי מַחֲמַדֶּיהָ לְהַשְׁחִית׃
    hebrewPlain: וישרפו את בית האלהים וינתצו את חומת ירושלם וכל ארמנותיה שרפו באש וכל כלי מחמדיה להשחית
    kjvRefs:
    - 2 Chronicles 36:19
    kjvOsis:
    - 2Chr.36.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:20
    ref: 2 Chronicles 36:20
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 20
    ordinal: 23203
    text: And them that had escaped from the sword carried he away to Babylon; and they were servants to him and his sons until the reign of the kingdom of Persia;
    translation: JPS 1917
    original: וַיֶּגֶל הַשְּׁאֵרִית מִן־הַחֶרֶב אֶל־בָּבֶל וַיִּהְיוּ־לוֹ וּלְבָנָיו לַעֲבָדִים עַד־מְלֹךְ מַלְכוּת פָּרָס׃
    hebrewPlain: ויגל השארית מן החרב אל בבל ויהיו לו ולבניו לעבדים עד מלך מלכות פרס
    kjvRefs:
    - 2 Chronicles 36:20
    kjvOsis:
    - 2Chr.36.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:21
    ref: 2 Chronicles 36:21
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 21
    ordinal: 23204
    text: to fulfil the word of the LORD by the mouth of Jeremiah, until the land had been paid her sabbaths; for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.
    translation: JPS 1917
    original: לְמַלֹּאות דְּבַר־יְהוָה בְּפִי יִרְמְיָהוּ עַד־רָצְתָה הָאָרֶץ אֶת־שַׁבְּתוֹתֶיהָ כָּל־יְמֵי הָשַּׁמָּה שָׁבָתָה לְמַלֹּאות שִׁבְעִים שָׁנָה׃
    hebrewPlain: למלאות דבר יהוה בפי ירמיהו עד רצתה הארץ את שבתותיה כל ימי השמה שבתה למלאות שבעים שנה
    kjvRefs:
    - 2 Chronicles 36:21
    kjvOsis:
    - 2Chr.36.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:22
    ref: 2 Chronicles 36:22
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 22
    ordinal: 23205
    text: 'Now in the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying:'
    translation: JPS 1917
    original: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס לִכְלוֹת דְּבַר־יְהוָה בְּפִי יִרְמְיָהוּ הֵעִיר יְהוָה אֶת־רוּחַ כּוֹרֶשׁ מֶלֶךְ־פָּרַס וַיַּעֲבֶר־קוֹל בְּכָל־מַלְכוּתוֹ וְגַם־בְּמִכְתָּב לֵאמֹר׃
    hebrewPlain: ובשנת אחת לכורש מלך פרס לכלות דבר יהוה בפי ירמיהו העיר יהוה את רוח כורש מלך פרס ויעבר קול בכל מלכותו וגם במכתב לאמר
    kjvRefs:
    - 2 Chronicles 36:22
    kjvOsis:
    - 2Chr.36.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
- type: TanakhVerse
  data:
    osis: 2Chr.36.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 36:23
    ref: 2 Chronicles 36:23
    book: 2Chr
    section: ketuvim
    chapter: 36
    verse: 23
    ordinal: 23206
    text: '’Thus saith Cyrus king of Persia: All the kingdoms of the earth hath the LORD, the God of heaven, given me; and He hath charged me to build Him a house in Jerusalem, which is in Judah. Whosoever there is among you of all His people—the LORD his God be with him—let him go up.’'
    translation: JPS 1917
    original: כֹּה־אָמַר כּוֹרֶשׁ מֶלֶךְ פָּרַס כָּל־מַמְלְכוֹת הָאָרֶץ נָתַן לִי יְהוָה אֱלֹהֵי הַשָּׁמַיִם וְהוּא־פָקַד עָלַי לִבְנוֹת־לוֹ בַיִת בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה מִי־בָכֶם מִכָּל־עַמּוֹ יְהוָה אֱלֹהָיו עִמּוֹ וְיָעַל׃
    hebrewPlain: כה אמר כורש מלך פרס כל ממלכות הארץ נתן לי יהוה אלהי השמים והוא פקד עלי לבנות לו בית בירושלם אשר ביהודה מי בכם מכל עמו יהוה אלהיו עמו ויעל
    kjvRefs:
    - 2 Chronicles 36:23
    kjvOsis:
    - 2Chr.36.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.36
