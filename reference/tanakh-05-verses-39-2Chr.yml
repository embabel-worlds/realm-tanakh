    name: Tanakh 2 Chronicles 13:22
    ref: 2 Chronicles 13:22
    book: 2Chr
    section: ketuvim
    chapter: 13
    verse: 22
    ordinal: 22665
    text: And the rest of the acts of Abijah, and his ways, and his sayings, are written in the commentary of the prophet Iddo.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אֲבִיָּה וּדְרָכָיו וּדְבָרָיו כְּתוּבִים בְּמִדְרַשׁ הַנָּבִיא עִדּוֹ׃
    hebrewPlain: ויתר דברי אביה ודרכיו ודבריו כתובים במדרש הנביא עדו
    kjvRefs:
    - 2 Chronicles 13:22
    kjvOsis:
    - 2Chr.13.22
  relations:
