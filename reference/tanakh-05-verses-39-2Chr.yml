  data:
    osis: 2Chr.6.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:8
    ref: 2 Chronicles 6:8
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 22480
    text: 'But the LORD said unto David my father: Whereas it was in thy heart to build a house for My name, thou didst well that it was in thy heart;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־דָּוִיד אָבִי יַעַן אֲשֶׁר הָיָה עִם־לְבָבְךָ לִבְנוֹת בַּיִת לִשְׁמִי הֱ‍טִיבוֹתָ כִּי הָיָה עִם־לְבָבֶךָ׃
    hebrewPlain: ויאמר יהוה אל דויד אבי יען אשר היה עם לבבך לבנות בית לשמי ה‍טיבות כי היה עם לבבך
    kjvRefs:
    - 2 Chronicles 6:8
    kjvOsis:
    - 2Chr.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:9
    ref: 2 Chronicles 6:9
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 22481
    text: nevertheless thou shalt not build the house, but thy son that shall come forth out of thy loins, he shall build the house for My name.
    translation: JPS 1917
    original: רַק אַתָּה לֹא תִבְנֶה הַבָּיִת כִּי בִנְךָ הַיּוֹצֵא מֵחֲלָצֶיךָ הוּא־יִבְנֶה הַבַּיִת לִשְׁמִי׃
    hebrewPlain: רק אתה לא תבנה הבית כי בנך היוצא מחלציך הוא יבנה הבית לשמי
    kjvRefs:
    - 2 Chronicles 6:9
    kjvOsis:
    - 2Chr.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:10
    ref: 2 Chronicles 6:10
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 22482
    text: And the LORD hath established His word that He spoke; for I am risen up in the room of David my father, and sit on the throne of Israel, as the LORD promised, and have built the house for the name of the LORD, the God of Israel.
    translation: JPS 1917
    original: וַיָּקֶם יְהוָה אֶת־דְּבָרוֹ אֲשֶׁר דִּבֵּר וָאָקוּם תַּחַת דָּוִיד אָבִי וָאֵשֵׁב עַל־כִּסֵּא יִשְׂרָאֵל כַּאֲשֶׁר דִּבֶּר יְהוָה וָאֶבְנֶה הַבַּיִת לְשֵׁם יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויקם יהוה את דברו אשר דבר ואקום תחת דויד אבי ואשב על כסא ישראל כאשר דבר יהוה ואבנה הבית לשם יהוה אלהי ישראל
    kjvRefs:
    - 2 Chronicles 6:10
    kjvOsis:
    - 2Chr.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:11
    ref: 2 Chronicles 6:11
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 22483
    text: And there have I set the ark, wherein is the covenant of the LORD, which He made with the children of Israel.’ .
    translation: JPS 1917
    original: וָאָשִׂים שָׁם אֶת־הָאָרוֹן אֲשֶׁר־שָׁם בְּרִית יְהוָה אֲשֶׁר כָּרַת עִם־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ואשים שם את הארון אשר שם ברית יהוה אשר כרת עם בני ישראל
    kjvRefs:
    - 2 Chronicles 6:11
    kjvOsis:
    - 2Chr.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
