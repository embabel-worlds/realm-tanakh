  data:
    osis: 2Chr.11.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:3
    ref: 2 Chronicles 11:3
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 22607
    text: '’Speak unto Rehoboam the son of Solomon, king of Judah, and to all Israel in Judah and Benjamin, saying:'
    translation: JPS 1917
    original: אֱמֹר אֶל־רְחַבְעָם בֶּן־שְׁלֹמֹה מֶלֶךְ יְהוּדָה וְאֶל כָּל־יִשְׂרָאֵל בִּיהוּדָה וּבִנְיָמִן לֵאמֹר׃
    hebrewPlain: אמר אל רחבעם בן שלמה מלך יהודה ואל כל ישראל ביהודה ובנימן לאמר
    kjvRefs:
    - 2 Chronicles 11:3
    kjvOsis:
    - 2Chr.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
