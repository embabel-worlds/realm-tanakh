  data:
    osis: 2Chr.6.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:5
    ref: 2 Chronicles 6:5
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 22477
    text: Since the day that I brought forth My people out of the land of Egypt, I chose no city out of all the tribes of Israel to build a house in, that My name might be there; neither chose I any man to be prince over My people Israel;
    translation: JPS 1917
    original: מִן־הַיּוֹם אֲשֶׁר הוֹצֵאתִי אֶת־עַמִּי מֵאֶרֶץ מִצְרַיִם לֹא־בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל לִבְנוֹת בַּיִת לִהְיוֹת שְׁמִי שָׁם וְלֹא־בָחַרְתִּי בְאִישׁ לִהְיוֹת נָגִיד עַל־עַמִּי יִשְׂרָאֵל׃
    hebrewPlain: מן היום אשר הוצאתי את עמי מארץ מצרים לא בחרתי בעיר מכל שבטי ישראל לבנות בית להיות שמי שם ולא בחרתי באיש להיות נגיד על עמי ישראל
    kjvRefs:
    - 2 Chronicles 6:5
    kjvOsis:
    - 2Chr.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:6
    ref: 2 Chronicles 6:6
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 22478
    text: but I have chosen Jerusalem, that My name might be there; and have chosen David to be over My people Israel.
    translation: JPS 1917
    original: וָאֶבְחַר בִּירוּשָׁלִַם לִהְיוֹת שְׁמִי שָׁם וָאֶבְחַר בְּדָוִיד לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל׃
    hebrewPlain: ואבחר בירושלם להיות שמי שם ואבחר בדויד להיות על עמי ישראל
    kjvRefs:
    - 2 Chronicles 6:6
    kjvOsis:
    - 2Chr.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.6.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:7
    ref: 2 Chronicles 6:7
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 22479
