    name: Tanakh 2 Chronicles 6:2
    ref: 2 Chronicles 6:2
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 22474
    text: But I have built Thee a house of habitation, And a place for Thee to dwell in for ever.
    translation: JPS 1917
    original: וַאֲנִי בָּנִיתִי בֵית־זְבֻל לָךְ וּמָכוֹן לְשִׁבְתְּךָ עוֹלָמִים׃
    hebrewPlain: ואני בניתי בית זבל לך ומכון לשבתך עולמים
