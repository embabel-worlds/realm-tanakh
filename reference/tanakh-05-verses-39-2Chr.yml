- type: TanakhVerse
  data:
    osis: 2Chr.1.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:8
    ref: 2 Chronicles 1:8
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 22392
    text: 'And Solomon said unto God: ‘Thou hast shown great kindness unto David my father, and hast made me king in his stead.'
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁלֹמֹה לֵאלֹהִים אַתָּה עָשִׂיתָ עִם־דָּוִיד אָבִי חֶסֶד גָּדוֹל וְהִמְלַכְתַּנִי תַּחְתָּיו׃
    hebrewPlain: ויאמר שלמה לאלהים אתה עשית עם דויד אבי חסד גדול והמלכתני תחתיו
    kjvRefs:
    - 2 Chronicles 1:8
    kjvOsis:
    - 2Chr.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:9
    ref: 2 Chronicles 1:9
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 22393
    text: Now, O LORD God, let Thy promise unto David my father be established; for Thou hast made me king over a people like the dust of the earth in multitude.
    translation: JPS 1917
    original: עַתָּה יְהוָה אֱלֹהִים יֵאָמֵן דְּבָרְךָ עִם דָּוִיד אָבִי כִּי אַתָּה הִמְלַכְתַּנִי עַל־עַם רַב כַּעֲפַר הָאָרֶץ׃
    hebrewPlain: עתה יהוה אלהים יאמן דברך עם דויד אבי כי אתה המלכתני על עם רב כעפר הארץ
    kjvRefs:
    - 2 Chronicles 1:9
    kjvOsis:
    - 2Chr.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:10
    ref: 2 Chronicles 1:10
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 22394
    text: Give me now wisdom and knowledge, that I may go out and come in before this people; for who can judge this Thy people, that is so great?’
    translation: JPS 1917
    original: עַתָּה חָכְמָה וּמַדָּע תֶּן־לִי וְאֵצְאָה לִפְנֵי הָעָם־הַזֶּה וְאָבוֹאָה כִּי־מִי יִשְׁפֹּט אֶת־עַמְּךָ הַזֶּה הַגָּדוֹל׃
    hebrewPlain: עתה חכמה ומדע תן לי ואצאה לפני העם הזה ואבואה כי מי ישפט את עמך הזה הגדול
    kjvRefs:
    - 2 Chronicles 1:10
    kjvOsis:
    - 2Chr.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:11
    ref: 2 Chronicles 1:11
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 22395
    text: 'And God said to Solomon: ‘Because this was in thy heart, and thou hast not asked riches, wealth, or honour, nor the life of them that hate thee, neither yet hast asked long life, but hast asked wisdom and knowledge for thyself, that thou mayest judge My people, over whom I have made thee king;'
    translation: JPS 1917
    original: וַיֹּאמֶר־אֱלֹהִים לִשְׁלֹמֹה יַעַן אֲשֶׁר הָיְתָה זֹאת עִם־לְבָבֶךָ וְלֹא־שָׁאַלְתָּ עֹשֶׁר נְכָסִים וְכָבוֹד וְאֵת נֶפֶשׁ שֹׂנְאֶיךָ וְגַם־יָמִים רַבִּים לֹא שָׁאָלְתָּ וַתִּשְׁאַל־לְךָ חָכְמָה וּמַדָּע אֲשֶׁר תִּשְׁפּוֹט אֶת־עַמִּי אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו׃
    hebrewPlain: ויאמר אלהים לשלמה יען אשר היתה זאת עם לבבך ולא שאלת עשר נכסים וכבוד ואת נפש שנאיך וגם ימים רבים לא שאלת ותשאל לך חכמה ומדע אשר תשפוט את עמי אשר המלכתיך עליו
    kjvRefs:
    - 2 Chronicles 1:11
    kjvOsis:
    - 2Chr.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:12
    ref: 2 Chronicles 1:12
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 22396
    text: wisdom and knowledge is granted unto thee, and I will give thee riches, and wealth, and honour, such as none of the kings have had that have been before thee, neither shall there any after thee have the like.’
    translation: JPS 1917
    original: הַחָכְמָה וְהַמַּדָּע נָתוּן לָךְ וְעֹשֶׁר וּנְכָסִים וְכָבוֹד אֶתֶּן־לָךְ אֲשֶׁר לֹא־הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ וְאַחֲרֶיךָ לֹא יִהְיֶה־כֵּן׃
    hebrewPlain: החכמה והמדע נתון לך ועשר ונכסים וכבוד אתן לך אשר לא היה כן למלכים אשר לפניך ואחריך לא יהיה כן
    kjvRefs:
    - 2 Chronicles 1:12
    kjvOsis:
    - 2Chr.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:13
    ref: 2 Chronicles 1:13
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 22397
    text: So Solomon came [from his journey] to the high place that was at Gibeon, from before the tent of meeting, unto Jerusalem; and he reigned over Israel.
    translation: JPS 1917
    original: וַיָּבֹא שְׁלֹמֹה לַבָּמָה אֲשֶׁר־בְּגִבְעוֹן יְרוּשָׁלִַם מִלִּפְנֵי אֹהֶל מוֹעֵד וַיִּמְלֹךְ עַל־יִשְׂרָאֵל׃
    hebrewPlain: ויבא שלמה לבמה אשר בגבעון ירושלם מלפני אהל מועד וימלך על ישראל
    kjvRefs:
    - 2 Chronicles 1:13
    kjvOsis:
    - 2Chr.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:14
    ref: 2 Chronicles 1:14
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 22398
    text: And Solomon gathered chariots and horsemen; and he had a thousand and four hundred chariots, and twelve thousand horsemen, that he placed in the chariot cities, and with the king at Jerusalem.
    translation: JPS 1917
    original: וַיֶּאֱסֹף שְׁלֹמֹה רֶכֶב וּפָרָשִׁים וַיְהִי־לוֹ אֶלֶף וְאַרְבַּע־מֵאוֹת רֶכֶב וּשְׁנֵים־עָשָׂר אֶלֶף פָּרָשִׁים וַיַּנִּיחֵם בְּעָרֵי הָרֶכֶב וְעִם־הַמֶּלֶךְ בִּירוּשָׁלִָם׃
    hebrewPlain: ויאסף שלמה רכב ופרשים ויהי לו אלף וארבע מאות רכב ושנים עשר אלף פרשים ויניחם בערי הרכב ועם המלך בירושלם
    kjvRefs:
    - 2 Chronicles 1:14
    kjvOsis:
    - 2Chr.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:15
    ref: 2 Chronicles 1:15
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 22399
    text: And the king made silver and gold to be in Jerusalem as stones, and cedars made he to be as the sycamore-trees that are in the Lowland, for abundance.
    translation: JPS 1917
    original: וַיִּתֵּן הַמֶּלֶךְ אֶת־הַכֶּסֶף וְאֶת־הַזָּהָב בִּירוּשָׁלִַם כָּאֲבָנִים וְאֵת הָאֲרָזִים נָתַן כַּשִּׁקְמִים אֲשֶׁר־בַּשְּׁפֵלָה לָרֹב׃
    hebrewPlain: ויתן המלך את הכסף ואת הזהב בירושלם כאבנים ואת הארזים נתן כשקמים אשר בשפלה לרב
    kjvRefs:
    - 2 Chronicles 1:15
    kjvOsis:
    - 2Chr.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:16
    ref: 2 Chronicles 1:16
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 22400
    text: And the horses which Solomon had were brought out of Egypt; also out of Keve, the king’s merchants buying them of the men of Keve at a price.
    translation: JPS 1917
    original: וּמוֹצָא הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה מִמִּצְרָיִם וּמִקְוֵא סֹחֲרֵי הַמֶּלֶךְ מִקְוֵא יִקְחוּ בִּמְחִיר׃
    hebrewPlain: ומוצא הסוסים אשר לשלמה ממצרים ומקוא סחרי המלך מקוא יקחו במחיר
    kjvRefs:
    - 2 Chronicles 1:16
    kjvOsis:
    - 2Chr.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:17
    ref: 2 Chronicles 1:17
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 22401
    text: And they fetched up, and brought out of Egypt a chariot for six hundred shekels of silver, and a horse for a hundred and fifty; and so for all the kings of the Hittites, and the kings of Aram, did they bring them out by their means.
    translation: JPS 1917
    original: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם מֶרְכָּבָה בְּשֵׁשׁ מֵאוֹת כֶּסֶף וְסוּס בַּחֲמִשִּׁים וּמֵאָה וְכֵן לְכָל־מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם בְּיָדָם יוֹצִיאוּ׃
    hebrewPlain: ויעלו ויוציאו ממצרים מרכבה בשש מאות כסף וסוס בחמשים ומאה וכן לכל מלכי החתים ומלכי ארם בידם יוציאו
    kjvRefs:
    - 2 Chronicles 1:17
    kjvOsis:
    - 2Chr.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.1.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:18
    ref: 2 Chronicles 1:18
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 22402
    text: Now Solomon purposed to build a house for the name of the LORD, and a house for his kingdom.
    translation: JPS 1917
    original: וַיֹּאמֶר שְׁלֹמֹה לִבְנוֹת בַּיִת לְשֵׁם יְהוָה וּבַיִת לְמַלְכוּתוֹ׃
    hebrewPlain: ויאמר שלמה לבנות בית לשם יהוה ובית למלכותו
    kjvRefs:
    - 2 Chronicles 2:1
    kjvOsis:
    - 2Chr.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.1
- type: TanakhVerse
  data:
    osis: 2Chr.2.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:1
    ref: 2 Chronicles 2:1
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 22403
    text: And Solomon counted out threescore and ten thousand men to bear burdens, and fourscore thousand men that were hewers in the mountains, and three thousand and six hundred to oversee them.
    translation: JPS 1917
    original: וַיִּסְפֹּר שְׁלֹמֹה שִׁבְעִים אֶלֶף אִישׁ סַבָּל וּשְׁמוֹנִים אֶלֶף אִישׁ חֹצֵב בָּהָר וּמְנַצְּחִים עֲלֵיהֶם שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת׃
    hebrewPlain: ויספר שלמה שבעים אלף איש סבל ושמונים אלף איש חצב בהר ומנצחים עליהם שלשת אלפים ושש מאות
    kjvRefs:
    - 2 Chronicles 2:2
    kjvOsis:
    - 2Chr.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:2
    ref: 2 Chronicles 2:2
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 22404
    text: 'And Solomon sent to Huram the king of Tyre, saying: ‘As thou didst deal with David my father, and didst send him cedars to build him a house to dwell therein [, even so deal with me].'
    translation: JPS 1917
    original: וַיִּשְׁלַח שְׁלֹמֹה אֶל־חוּרָם מֶלֶךְ־צֹר לֵאמֹר כַּאֲשֶׁר עָשִׂיתָ עִם־דָּוִיד אָבִי וַתִּשְׁלַח־לוֹ אֲרָזִים לִבְנוֹת־לוֹ בַיִת לָשֶׁבֶת בּוֹ׃
    hebrewPlain: וישלח שלמה אל חורם מלך צר לאמר כאשר עשית עם דויד אבי ותשלח לו ארזים לבנות לו בית לשבת בו
    kjvRefs:
    - 2 Chronicles 2:3
    kjvOsis:
    - 2Chr.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:3
    ref: 2 Chronicles 2:3
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 22405
    text: Behold, I am about to build a house for the name of the LORD my God, to dedicate it to Him, and to burn before Him incense of sweet spices, and for the continual showbread, and for the burnt-offerings morning and evening, on the sabbaths, and on the new moons, and on the appointed seasons of the LORD our God. This is an ordinance for ever to Israel.
    translation: JPS 1917
    original: הִנֵּה אֲנִי בוֹנֶה־בַּיִת לְשֵׁם יְהוָה אֱלֹהָי לְהַקְדִּישׁ לוֹ לְהַקְטִיר לְפָנָיו קְטֹרֶת־סַמִּים וּמַעֲרֶכֶת תָּמִיד וְעֹלוֹת לַבֹּקֶר וְלָעֶרֶב לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי יְהוָה אֱלֹהֵינוּ לְעוֹלָם זֹאת עַל־יִשְׂרָאֵל׃
    hebrewPlain: הנה אני בונה בית לשם יהוה אלהי להקדיש לו להקטיר לפניו קטרת סמים ומערכת תמיד ועלות לבקר ולערב לשבתות ולחדשים ולמועדי יהוה אלהינו לעולם זאת על ישראל
    kjvRefs:
    - 2 Chronicles 2:4
    kjvOsis:
    - 2Chr.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:4
    ref: 2 Chronicles 2:4
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 22406
    text: And the house which I build is great; for great is our God above all gods.
    translation: JPS 1917
    original: וְהַבַּיִת אֲשֶׁר־אֲנִי בוֹנֶה גָּדוֹל כִּי־גָדוֹל אֱלֹהֵינוּ מִכָּל־הָאֱלֹהִים׃
    hebrewPlain: והבית אשר אני בונה גדול כי גדול אלהינו מכל האלהים
    kjvRefs:
    - 2 Chronicles 2:5
    kjvOsis:
    - 2Chr.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:5
    ref: 2 Chronicles 2:5
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 22407
    text: But who is able to build Him a house, seeing the heaven and the heaven of heavens cannot contain Him? who am I then, that I should build Him a house, save only to offer before Him?
    translation: JPS 1917
    original: וּמִי יַעֲצָר־כֹּחַ לִבְנוֹת־לוֹ בַיִת כִּי הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם לֹא יְכַלְכְּלֻהוּ וּמִי אֲנִי אֲשֶׁר אֶבְנֶה־לּוֹ בַיִת כִּי אִם־לְהַקְטִיר לְפָנָיו׃
    hebrewPlain: ומי יעצר כח לבנות לו בית כי השמים ושמי השמים לא יכלכלהו ומי אני אשר אבנה לו בית כי אם להקטיר לפניו
    kjvRefs:
    - 2 Chronicles 2:6
    kjvOsis:
    - 2Chr.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:6
    ref: 2 Chronicles 2:6
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 22408
    text: Now therefore send me a man skilful to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and that hath skill to grave all manner of gravings, to be with the skilful men that are with me in Judah and in Jerusalem, whom David my father did provide.
    translation: JPS 1917
    original: וְעַתָּה שְׁלַח־לִי אִישׁ־חָכָם לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל וּבָאַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת וְיֹדֵעַ לְפַתֵּחַ פִּתּוּחִים עִם־הַחֲכָמִים אֲשֶׁר עִמִּי בִּיהוּדָה וּבִירוּשָׁלִַם אֲשֶׁר הֵכִין דָּוִיד אָבִי׃
    hebrewPlain: ועתה שלח לי איש חכם לעשות בזהב ובכסף ובנחשת ובברזל ובארגון וכרמיל ותכלת וידע לפתח פתוחים עם החכמים אשר עמי ביהודה ובירושלם אשר הכין דויד אבי
    kjvRefs:
    - 2 Chronicles 2:7
    kjvOsis:
    - 2Chr.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:7
    ref: 2 Chronicles 2:7
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 22409
    text: Send me also cedar-trees, cypress-trees, and sandal-wood, out of Lebanon; for I know that thy servants have skill to cut timber in Lebanon; and, behold, my servants shall be with thy servants,
    translation: JPS 1917
    original: וּשְׁלַח־לִי עֲצֵי אֲרָזִים בְּרוֹשִׁים וְאַלְגּוּמִּים מֵהַלְּבָנוֹן כִּי אֲנִי יָדַעְתִּי אֲשֶׁר עֲבָדֶיךָ יוֹדְעִים לִכְרוֹת עֲצֵי לְבָנוֹן וְהִנֵּה עֲבָדַי עִם־עֲבָדֶיךָ׃
    hebrewPlain: ושלח לי עצי ארזים ברושים ואלגומים מהלבנון כי אני ידעתי אשר עבדיך יודעים לכרות עצי לבנון והנה עבדי עם עבדיך
    kjvRefs:
    - 2 Chronicles 2:8
    kjvOsis:
    - 2Chr.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:8
    ref: 2 Chronicles 2:8
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 22410
    text: even to prepare me timber in abundance; for the house which I am about to build shall be great and wonderful.
    translation: JPS 1917
    original: וּלְהָכִין לִי עֵצִים לָרֹב כִּי הַבַּיִת אֲשֶׁר־אֲנִי בוֹנֶה גָּדוֹל וְהַפְלֵא׃
    hebrewPlain: ולהכין לי עצים לרב כי הבית אשר אני בונה גדול והפלא
    kjvRefs:
    - 2 Chronicles 2:9
    kjvOsis:
    - 2Chr.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:9
    ref: 2 Chronicles 2:9
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 22411
    text: And, behold, I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.’
    translation: JPS 1917
    original: וְהִנֵּה לַחֹטְבִים לְכֹרְתֵי הָעֵצִים נָתַתִּי חִטִּים מַכּוֹת לַעֲבָדֶיךָ כֹּרִים עֶשְׂרִים אֶלֶף וּשְׂעֹרִים כֹּרִים עֶשְׂרִים אָלֶף וְיַיִן בַּתִּים עֶשְׂרִים אֶלֶף וְשֶׁמֶן בַּתִּים עֶשְׂרִים אָלֶף׃
    hebrewPlain: והנה לחטבים לכרתי העצים נתתי חטים מכות לעבדיך כרים עשרים אלף ושערים כרים עשרים אלף ויין בתים עשרים אלף ושמן בתים עשרים אלף
    kjvRefs:
    - 2 Chronicles 2:10
    kjvOsis:
    - 2Chr.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:10
    ref: 2 Chronicles 2:10
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 22412
    text: 'Then Huram the king of Tyre answered in writing, which he sent to Solomon: ‘Because the LORD loveth His people, He hath made thee king over them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חוּרָם מֶלֶךְ־צֹר בִּכְתָב וַיִּשְׁלַח אֶל־שְׁלֹמֹה בְּאַהֲבַת יְהוָה אֶת־עַמּוֹ נְתָנְךָ עֲלֵיהֶם מֶלֶךְ׃
    hebrewPlain: ויאמר חורם מלך צר בכתב וישלח אל שלמה באהבת יהוה את עמו נתנך עליהם מלך
    kjvRefs:
    - 2 Chronicles 2:11
    kjvOsis:
    - 2Chr.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:11
    ref: 2 Chronicles 2:11
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 22413
    text: 'Huram said moreover: ‘Blessed be the LORD, the God of Israel, that made heaven and earth, who hath given to David the king a wise son, endued with discretion and understanding, that should build a house for the LORD, and a house for his kingdom.'
    translation: JPS 1917
    original: וַיֹּאמֶר חוּרָם בָּרוּךְ יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ אֲשֶׁר נָתַן לְדָוִיד הַמֶּלֶךְ בֵּן חָכָם יוֹדֵעַ שֵׂכֶל וּבִינָה אֲשֶׁר יִבְנֶה־בַּיִת לַיהוָה וּבַיִת לְמַלְכוּתוֹ׃
    hebrewPlain: ויאמר חורם ברוך יהוה אלהי ישראל אשר עשה את השמים ואת הארץ אשר נתן לדויד המלך בן חכם יודע שכל ובינה אשר יבנה בית ליהוה ובית למלכותו
    kjvRefs:
    - 2 Chronicles 2:12
    kjvOsis:
    - 2Chr.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:12
    ref: 2 Chronicles 2:12
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 22414
    text: And now I have sent a skilful man, endued with understanding, even Huram my master craftsman,
    translation: JPS 1917
    original: וְעַתָּה שָׁלַחְתִּי אִישׁ־חָכָם יוֹדֵעַ בִּינָה לְחוּרָם אָבִי׃
    hebrewPlain: ועתה שלחתי איש חכם יודע בינה לחורם אבי
    kjvRefs:
    - 2 Chronicles 2:13
    kjvOsis:
    - 2Chr.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:13
    ref: 2 Chronicles 2:13
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 22415
    text: the son of a woman of the daughters of Dan, and his father was a man of Tyre, skilful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson; also to grave any manner of graving, and to devise any device; to do whatever may be set before him, with thy skilful men, and with the skilful men of my lord David thy father.
    translation: JPS 1917
    original: בֶּן־אִשָּׁה מִן־בְּנוֹת דָּן וְאָבִיו אִישׁ־צֹרִי יוֹדֵעַ לַעֲשׂוֹת בַּזָּהָב־וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל וּלְפַתֵּחַ כָּל־פִּתּוּחַ וְלַחְשֹׁב כָּל־מַחֲשָׁבֶת אֲשֶׁר יִנָּתֶן־לוֹ עִם־חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ׃
    hebrewPlain: בן אשה מן בנות דן ואביו איש צרי יודע לעשות בזהב ובכסף בנחשת בברזל באבנים ובעצים בארגמן בתכלת ובבוץ ובכרמיל ולפתח כל פתוח ולחשב כל מחשבת אשר ינתן לו עם חכמיך וחכמי אדני דויד אביך
    kjvRefs:
    - 2 Chronicles 2:14
    kjvOsis:
    - 2Chr.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:14
    ref: 2 Chronicles 2:14
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 22416
    text: Now therefore the wheat and the barley, the oil and the wine, which my lord hath spoken of, let him send unto his servants;
    translation: JPS 1917
    original: וְעַתָּה הַחִטִּים וְהַשְּׂעֹרִים הַשֶּׁמֶן וְהַיַּיִן אֲשֶׁר אָמַר אֲדֹנִי יִשְׁלַח לַעֲבָדָיו׃
    hebrewPlain: ועתה החטים והשערים השמן והיין אשר אמר אדני ישלח לעבדיו
    kjvRefs:
    - 2 Chronicles 2:15
    kjvOsis:
    - 2Chr.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:15
    ref: 2 Chronicles 2:15
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 22417
    text: and we will cut wood out of Lebanon, as much as thou shalt need; and we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem.’
    translation: JPS 1917
    original: וַאֲנַחְנוּ נִכְרֹת עֵצִים מִן־הַלְּבָנוֹן כְּכָל־צָרְכֶּךָ וּנְבִיאֵם לְךָ רַפְסֹדוֹת עַל־יָם יָפוֹ וְאַתָּה תַּעֲלֶה אֹתָם יְרוּשָׁלִָם׃
    hebrewPlain: ואנחנו נכרת עצים מן הלבנון ככל צרכך ונביאם לך רפסדות על ים יפו ואתה תעלה אתם ירושלם
    kjvRefs:
    - 2 Chronicles 2:16
    kjvOsis:
    - 2Chr.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:16
    ref: 2 Chronicles 2:16
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 22418
    text: And Solomon numbered all the strangers that were in the land of Israel, after the numbering wherewith David his father had numbered them; and they were found a hundred and fifty thousand and three thousand and six hundred.
    translation: JPS 1917
    original: וַיִּסְפֹּר שְׁלֹמֹה כָּל־הָאֲנָשִׁים הַגֵּירִים אֲשֶׁר בְּאֶרֶץ יִשְׂרָאֵל אַחֲרֵי הַסְּפָר אֲשֶׁר סְפָרָם דָּוִיד אָבִיו וַיִּמָּצְאוּ מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת׃
    hebrewPlain: ויספר שלמה כל האנשים הגירים אשר בארץ ישראל אחרי הספר אשר ספרם דויד אביו וימצאו מאה וחמשים אלף ושלשת אלפים ושש מאות
    kjvRefs:
    - 2 Chronicles 2:17
    kjvOsis:
    - 2Chr.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.2.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 2:17
    ref: 2 Chronicles 2:17
    book: 2Chr
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 22419
    text: And he set threescore and ten thousand of them to bear burdens, and fourscore thousand to be hewers in the mountains, and three thousand and six hundred overseers to set the people at work.
    translation: JPS 1917
    original: וַיַּעַשׂ מֵהֶם שִׁבְעִים אֶלֶף סַבָּל וּשְׁמֹנִים אֶלֶף חֹצֵב בָּהָר וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת מְנַצְּחִים לְהַעֲבִיד אֶת־הָעָם׃
    hebrewPlain: ויעש מהם שבעים אלף סבל ושמנים אלף חצב בהר ושלשת אלפים ושש מאות מנצחים להעביד את העם
    kjvRefs:
    - 2 Chronicles 2:18
    kjvOsis:
    - 2Chr.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.2
- type: TanakhVerse
  data:
    osis: 2Chr.3.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:1
    ref: 2 Chronicles 3:1
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 22420
    text: Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where [the LORD] appeared unto David his father; for which provision had been made in the Place of David, in the threshingfloor of Ornan the Jebusite.
    translation: JPS 1917
    original: וַיָּחֶל שְׁלֹמֹה לִבְנוֹת אֶת־בֵּית־יְהוָה בִּירוּשָׁלִַם בְּהַר הַמּוֹרִיָּה אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד בְּגֹרֶן אָרְנָן הַיְבוּסִי׃
    hebrewPlain: ויחל שלמה לבנות את בית יהוה בירושלם בהר המוריה אשר נראה לדויד אביהו אשר הכין במקום דויד בגרן ארנן היבוסי
    kjvRefs:
    - 2 Chronicles 3:1
    kjvOsis:
    - 2Chr.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:2
    ref: 2 Chronicles 3:2
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 22421
    text: And he began to build in the second day of the second month, in the fourth year of his reign.
    translation: JPS 1917
    original: וַיָּחֶל לִבְנוֹת בַּחֹדֶשׁ הַשֵּׁנִי בַּשֵּׁנִי בִּשְׁנַת אַרְבַּע לְמַלְכוּתוֹ׃
    hebrewPlain: ויחל לבנות בחדש השני בשני בשנת ארבע למלכותו
    kjvRefs:
    - 2 Chronicles 3:2
    kjvOsis:
    - 2Chr.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:3
    ref: 2 Chronicles 3:3
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 22422
    text: Now these are the foundations which Solomon laid for the building of the house of God. The length by cubits after the ancient measure was threescore cubits, and the breadth twenty cubits.
    translation: JPS 1917
    original: וְאֵלֶּה הוּסַד שְׁלֹמֹה לִבְנוֹת אֶת־בֵּית הָאֱלֹהִים הָאֹרֶךְ אַמּוֹת בַּמִּדָּה הָרִאשׁוֹנָה אַמּוֹת שִׁשִּׁים וְרֹחַב אַמּוֹת עֶשְׂרִים׃
    hebrewPlain: ואלה הוסד שלמה לבנות את בית האלהים הארך אמות במדה הראשונה אמות ששים ורחב אמות עשרים
    kjvRefs:
    - 2 Chronicles 3:3
    kjvOsis:
    - 2Chr.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:4
    ref: 2 Chronicles 3:4
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 22423
    text: And the porch that was before [the house], the length of it, according to the breadth of the house, was twenty cubits, and the height a hundred and twenty; and he overlaid it within with pure gold.
    translation: JPS 1917
    original: וְהָאוּלָם אֲשֶׁר עַל־פְּנֵי הָאֹרֶךְ עַל־פְּנֵי רֹחַב־הַבַּיִת אַמּוֹת עֶשְׂרִים וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים וַיְצַפֵּהוּ מִפְּנִימָה זָהָב טָהוֹר׃
    hebrewPlain: והאולם אשר על פני הארך על פני רחב הבית אמות עשרים והגבה מאה ועשרים ויצפהו מפנימה זהב טהור
    kjvRefs:
    - 2 Chronicles 3:4
    kjvOsis:
    - 2Chr.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:5
    ref: 2 Chronicles 3:5
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 22424
    text: And the greater house he covered with cypress-wood, which he overlaid with fine gold, and wrought thereon palm-trees and chains.
    translation: JPS 1917
    original: וְאֵת הַבַּיִת הַגָּדוֹל חִפָּה עֵץ בְּרוֹשִׁים וַיְחַפֵּהוּ זָהָב טוֹב וַיַּעַל עָלָיו תִּמֹרִים וְשַׁרְשְׁרוֹת׃
    hebrewPlain: ואת הבית הגדול חפה עץ ברושים ויחפהו זהב טוב ויעל עליו תמרים ושרשרות
    kjvRefs:
    - 2 Chronicles 3:5
    kjvOsis:
    - 2Chr.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:6
    ref: 2 Chronicles 3:6
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 22425
    text: And he garnished the house with precious stones for beauty; and the gold was gold of Parvaim.
    translation: JPS 1917
    original: וַיְצַף אֶת־הַבַּיִת אֶבֶן יְקָרָה לְתִפְאָרֶת וְהַזָּהָב זְהַב פַּרְוָיִם׃
    hebrewPlain: ויצף את הבית אבן יקרה לתפארת והזהב זהב פרוים
    kjvRefs:
    - 2 Chronicles 3:6
    kjvOsis:
    - 2Chr.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:7
    ref: 2 Chronicles 3:7
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 22426
    text: He overlaid also the house, the beams, the thresholds, and the walls thereof, and the doors thereof, with gold; and graved cherubim on the walls.
    translation: JPS 1917
    original: וַיְחַף אֶת־הַבַּיִת הַקֹּרוֹת הַסִּפִּים וְקִירוֹתָיו וְדַלְתוֹתָיו זָהָב וּפִתַּח כְּרוּבִים עַל־הַקִּירוֹת׃
    hebrewPlain: ויחף את הבית הקרות הספים וקירותיו ודלתותיו זהב ופתח כרובים על הקירות
    kjvRefs:
    - 2 Chronicles 3:7
    kjvOsis:
    - 2Chr.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:8
    ref: 2 Chronicles 3:8
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 22427
    text: And he made the most holy place; the length thereof, according to the breadth of the house, was twenty cubits, and the breadth thereof twenty cubits; and he overlaid it with fine gold, amounting to six hundred talents.
    translation: JPS 1917
    original: וַיַּעַשׂ אֶת־בֵּית־קֹדֶשׁ הַקֳּדָשִׁים אָרְכּוֹ עַל־פְּנֵי רֹחַב־הַבַּיִת אַמּוֹת עֶשְׂרִים וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים וַיְחַפֵּהוּ זָהָב טוֹב לְכִכָּרִים שֵׁשׁ מֵאוֹת׃
    hebrewPlain: ויעש את בית קדש הקדשים ארכו על פני רחב הבית אמות עשרים ורחבו אמות עשרים ויחפהו זהב טוב לככרים שש מאות
    kjvRefs:
    - 2 Chronicles 3:8
    kjvOsis:
    - 2Chr.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:9
    ref: 2 Chronicles 3:9
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 22428
    text: And the weight of the nails was fifty shekels of gold. And he overlaid the upper chambers with gold.
    translation: JPS 1917
    original: וּמִשְׁקָל לְמִסְמְרוֹת לִשְׁקָלִים חֲמִשִּׁים זָהָב וְהָעֲלִיּוֹת חִפָּה זָהָב׃
    hebrewPlain: ומשקל למסמרות לשקלים חמשים זהב והעליות חפה זהב
    kjvRefs:
    - 2 Chronicles 3:9
    kjvOsis:
    - 2Chr.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:10
    ref: 2 Chronicles 3:10
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 22429
    text: And in the most holy place he made two cherubim of image work; and they overlaid them with gold.
    translation: JPS 1917
    original: וַיַּעַשׂ בְּבֵית־קֹדֶשׁ הַקֳּדָשִׁים כְּרוּבִים שְׁנַיִם מַעֲשֵׂה צַעֲצֻעִים וַיְצַפּוּ אֹתָם זָהָב׃
    hebrewPlain: ויעש בבית קדש הקדשים כרובים שנים מעשה צעצעים ויצפו אתם זהב
    kjvRefs:
    - 2 Chronicles 3:10
    kjvOsis:
    - 2Chr.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:11
    ref: 2 Chronicles 3:11
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 22430
    text: 'And the wings of the cherubim were twenty cubits long: the wing of the one cherub was five cubits, reaching to the wall of the house; and the other wing was likewise five cubits, reaching to the wing of the other cherub.'
    translation: JPS 1917
    original: וְכַנְפֵי הַכְּרוּבִים אָרְכָּם אַמּוֹת עֶשְׂרִים כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ מַגַּעַת לְקִיר הַבַּיִת וְהַכָּנָף הָאַחֶרֶת אַמּוֹת חָמֵשׁ מַגִּיעַ לִכְנַף הַכְּרוּב הָאַחֵר׃
    hebrewPlain: וכנפי הכרובים ארכם אמות עשרים כנף האחד לאמות חמש מגעת לקיר הבית והכנף האחרת אמות חמש מגיע לכנף הכרוב האחר
    kjvRefs:
    - 2 Chronicles 3:11
    kjvOsis:
    - 2Chr.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:12
    ref: 2 Chronicles 3:12
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 22431
    text: And the wing of the other cherub was five cubits, reaching to the wall of the house; and the other wing was five cubits also, joining to the wing of the other cherub.
    translation: JPS 1917
    original: וּכְנַף הַכְּרוּב הָאֶחָד אַמּוֹת חָמֵשׁ מַגִּיעַ לְקִיר הַבָּיִת וְהַכָּנָף הָאַחֶרֶת אַמּוֹת חָמֵשׁ דְּבֵקָה לִכְנַף הַכְּרוּב הָאַחֵר׃
    hebrewPlain: וכנף הכרוב האחד אמות חמש מגיע לקיר הבית והכנף האחרת אמות חמש דבקה לכנף הכרוב האחר
    kjvRefs:
    - 2 Chronicles 3:12
    kjvOsis:
    - 2Chr.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:13
    ref: 2 Chronicles 3:13
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 22432
    text: The wings of these cherubim spread themselves forth twenty cubits; and they stood on their feet, and their faces were inward.
    translation: JPS 1917
    original: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה פֹּרְשִׂים אַמּוֹת עֶשְׂרִים וְהֵם עֹמְדִים עַל־רַגְלֵיהֶם וּפְנֵיהֶם לַבָּיִת׃
    hebrewPlain: כנפי הכרובים האלה פרשים אמות עשרים והם עמדים על רגליהם ופניהם לבית
    kjvRefs:
    - 2 Chronicles 3:13
    kjvOsis:
    - 2Chr.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:14
    ref: 2 Chronicles 3:14
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 22433
    text: And he made the veil of blue, and purple, and crimson, and fine linen, and wrought cherubim thereon.
    translation: JPS 1917
    original: וַיַּעַשׂ אֶת־הַפָּרֹכֶת תְּכֵלֶת וְאַרְגָּמָן וְכַרְמִיל וּבוּץ וַיַּעַל עָלָיו כְּרוּבִים׃
    hebrewPlain: ויעש את הפרכת תכלת וארגמן וכרמיל ובוץ ויעל עליו כרובים
    kjvRefs:
    - 2 Chronicles 3:14
    kjvOsis:
    - 2Chr.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:15
    ref: 2 Chronicles 3:15
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 22434
    text: Also he made before the house two pillars of thirty and five cubits high, and the capital that was on the top of each of them was five cubits.
    translation: JPS 1917
    original: וַיַּעַשׂ לִפְנֵי הַבַּיִת עַמּוּדִים שְׁנַיִם אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ וְהַצֶּפֶת אֲשֶׁר־עַל־רֹאשׁוֹ אַמּוֹת חָמֵשׁ׃
    hebrewPlain: ויעש לפני הבית עמודים שנים אמות שלשים וחמש ארך והצפת אשר על ראשו אמות חמש
    kjvRefs:
    - 2 Chronicles 3:15
    kjvOsis:
    - 2Chr.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:16
    ref: 2 Chronicles 3:16
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 22435
    text: And he made chains in the Sanctuary, and put them on the tops of the pillars; and he made a hundred pomegranates, and put them on the chains.
    translation: JPS 1917
    original: וַיַּעַשׂ שַׁרְשְׁרוֹת בַּדְּבִיר וַיִּתֵּן עַל־רֹאשׁ הָעַמֻּדִים וַיַּעַשׂ רִמּוֹנִים מֵאָה וַיִּתֵּן בַּשַּׁרְשְׁרוֹת׃
    hebrewPlain: ויעש שרשרות בדביר ויתן על ראש העמדים ויעש רמונים מאה ויתן בשרשרות
    kjvRefs:
    - 2 Chronicles 3:16
    kjvOsis:
    - 2Chr.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.3.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 3:17
    ref: 2 Chronicles 3:17
    book: 2Chr
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 22436
    text: And he set up the pillars before the temple, one on the right hand, and the other on the left; and called the name of that on the right hand Jachin, and the name of that on the left Boaz.
    translation: JPS 1917
    original: וַיָּקֶם אֶת־הָעַמּוּדִים עַל־פְּנֵי הַהֵיכָל אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול וַיִּקְרָא שֵׁם־הימיני [הַיְמָנִי] יָכִין וְשֵׁם הַשְּׂמָאלִי בֹּעַז׃
    hebrewPlain: ויקם את העמודים על פני ההיכל אחד מימין ואחד מהשמאול ויקרא שם הימיני [הימני] יכין ושם השמאלי בעז
    kjvRefs:
    - 2 Chronicles 3:17
    kjvOsis:
    - 2Chr.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.3
- type: TanakhVerse
  data:
    osis: 2Chr.4.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:1
    ref: 2 Chronicles 4:1
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 22437
    text: Moreover he made an altar of brass, twenty cubits the length thereof, and twenty cubits the breadth thereof, and ten cubits the height thereof.
    translation: JPS 1917
    original: וַיַּעַשׂ מִזְבַּח נְחֹשֶׁת עֶשְׂרִים אַמָּה אָרְכּוֹ וְעֶשְׂרִים אַמָּה רָחְבּוֹ וְעֶשֶׂר אַמּוֹת קוֹמָתוֹ׃
    hebrewPlain: ויעש מזבח נחשת עשרים אמה ארכו ועשרים אמה רחבו ועשר אמות קומתו
    kjvRefs:
    - 2 Chronicles 4:1
    kjvOsis:
    - 2Chr.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:2
    ref: 2 Chronicles 4:2
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 22438
    text: Also he made the molten sea of ten cubits from brim to brim, round in compass, and the height thereof was five cubits; and a line of thirty cubits did compass it round about.
    translation: JPS 1917
    original: וַיַּעַשׂ אֶת־הַיָּם מוּצָק עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ אֶל־שְׂפָתוֹ עָגוֹל סָבִיב וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ וְקָו שְׁלֹשִׁים בָּאַמָּה יָסֹב אֹתוֹ סָבִיב׃
    hebrewPlain: ויעש את הים מוצק עשר באמה משפתו אל שפתו עגול סביב וחמש באמה קומתו וקו שלשים באמה יסב אתו סביב
    kjvRefs:
    - 2 Chronicles 4:2
    kjvOsis:
    - 2Chr.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:3
    ref: 2 Chronicles 4:3
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 22439
    text: And under it was the similitude of oxen, which did compass it round about, for ten cubits, compassing the sea round about. The oxen were in two rows, cast when it was cast.
    translation: JPS 1917
    original: וּדְמוּת בְּקָרִים תַּחַת לוֹ סָבִיב סָבִיב סוֹבְבִים אֹתוֹ עֶשֶׂר בָּאַמָּה מַקִּיפִים אֶת־הַיָּם סָבִיב שְׁנַיִם טוּרִים הַבָּקָר יְצוּקִים בְּמֻצַקְתּוֹ׃
    hebrewPlain: ודמות בקרים תחת לו סביב סביב סובבים אתו עשר באמה מקיפים את הים סביב שנים טורים הבקר יצוקים במצקתו
    kjvRefs:
    - 2 Chronicles 4:3
    kjvOsis:
    - 2Chr.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:4
    ref: 2 Chronicles 4:4
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 22440
    text: It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east; and the sea was set upon them above, and all their hinder parts were inward.
    translation: JPS 1917
    original: עוֹמֵד עַל־שְׁנֵים עָשָׂר בָּקָר שְׁלֹשָׁה פֹנִים צָפוֹנָה וּשְׁלוֹשָׁה פֹנִים יָמָּה וּשְׁלֹשָׁה פֹּנִים נֶגְבָּה וּשְׁלֹשָׁה פֹּנִים מִזְרָחָה וְהַיָּם עֲלֵיהֶם מִלְמָעְלָה וְכָל־אֲחֹרֵיהֶם בָּיְתָה׃
    hebrewPlain: עומד על שנים עשר בקר שלשה פנים צפונה ושלושה פנים ימה ושלשה פנים נגבה ושלשה פנים מזרחה והים עליהם מלמעלה וכל אחריהם ביתה
    kjvRefs:
    - 2 Chronicles 4:4
    kjvOsis:
    - 2Chr.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:5
    ref: 2 Chronicles 4:5
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 22441
    text: 'And it was a handbreadth thick; and the brim thereof was wrought like the brim of a cup, like the flower of a lily: it received and held three thousand baths.'
    translation: JPS 1917
    original: וְעָבְיוֹ טֶפַח וּשְׂפָתוֹ כְּמַעֲשֵׂה שְׂפַת־כּוֹס פֶּרַח שׁוֹשַׁנָּה מַחֲזִיק בַּתִּים שְׁלֹשֶׁת אֲלָפִים יָכִיל׃
    hebrewPlain: ועביו טפח ושפתו כמעשה שפת כוס פרח שושנה מחזיק בתים שלשת אלפים יכיל
    kjvRefs:
    - 2 Chronicles 4:5
    kjvOsis:
    - 2Chr.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:6
    ref: 2 Chronicles 4:6
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 22442
    text: He made also ten lavers, and put five on the right hand, and five on the left, to wash in them; such things as belonged to the burnt-offering they washed in them; but the sea was for the priests to wash in.
    translation: JPS 1917
    original: וַיַּעַשׂ כִּיּוֹרִים עֲשָׂרָה וַיִּתֵּן חֲמִשָּׁה מִיָּמִין וַחֲמִשָּׁה מִשְּׂמֹאול לְרָחְצָה בָהֶם אֶת־מַעֲשֵׂה הָעוֹלָה יָדִיחוּ בָם וְהַיָּם לְרָחְצָה לַכֹּהֲנִים בּוֹ׃
    hebrewPlain: ויעש כיורים עשרה ויתן חמשה מימין וחמשה משמאול לרחצה בהם את מעשה העולה ידיחו בם והים לרחצה לכהנים בו
    kjvRefs:
    - 2 Chronicles 4:6
    kjvOsis:
    - 2Chr.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:7
    ref: 2 Chronicles 4:7
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 22443
    text: And he made the ten candlesticks of gold according to the ordinance concerning them; and he set them in the temple, five on the right hand, and five on the left.
    translation: JPS 1917
    original: וַיַּעַשׂ אֶת־מְנֹרוֹת הַזָּהָב עֶשֶׂר כְּמִשְׁפָּטָם וַיִּתֵּן בַּהֵיכָל חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול׃
    hebrewPlain: ויעש את מנרות הזהב עשר כמשפטם ויתן בהיכל חמש מימין וחמש משמאול
    kjvRefs:
    - 2 Chronicles 4:7
    kjvOsis:
    - 2Chr.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:8
    ref: 2 Chronicles 4:8
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 22444
    text: He made also ten tables, and placed them in the temple, five on the right side, and five on the left. And he made a hundred basins of gold.
    translation: JPS 1917
    original: וַיַּעַשׂ שֻׁלְחָנוֹת עֲשָׂרָה וַיַּנַּח בַּהֵיכָל חֲמִשָּׁה מִיָּמִין וַחֲמִשָּׁה מִשְּׂמֹאול וַיַּעַשׂ מִזְרְקֵי זָהָב מֵאָה׃
    hebrewPlain: ויעש שלחנות עשרה וינח בהיכל חמשה מימין וחמשה משמאול ויעש מזרקי זהב מאה
    kjvRefs:
    - 2 Chronicles 4:8
    kjvOsis:
    - 2Chr.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:9
    ref: 2 Chronicles 4:9
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 22445
    text: Furthermore he made the court of the priests, and the great court, and doors for the court, and overlaid the doors of them with brass.
    translation: JPS 1917
    original: וַיַּעַשׂ חֲצַר הַכֹּהֲנִים וְהָעֲזָרָה הַגְּדוֹלָה וּדְלָתוֹת לָעֲזָרָה וְדַלְתוֹתֵיהֶם צִפָּה נְחֹשֶׁת׃
    hebrewPlain: ויעש חצר הכהנים והעזרה הגדולה ודלתות לעזרה ודלתותיהם צפה נחשת
    kjvRefs:
    - 2 Chronicles 4:9
    kjvOsis:
    - 2Chr.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:10
    ref: 2 Chronicles 4:10
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 22446
    text: And he set the sea on the right side [of the house] eastward, toward the south.
    translation: JPS 1917
    original: וְאֶת־הַיָּם נָתַן מִכֶּתֶף הַיְמָנִית קֵדְמָה מִמּוּל נֶגְבָּה׃
    hebrewPlain: ואת הים נתן מכתף הימנית קדמה ממול נגבה
    kjvRefs:
    - 2 Chronicles 4:10
    kjvOsis:
    - 2Chr.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:11
    ref: 2 Chronicles 4:11
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 22447
    text: 'And Huram made the pots, and the shovels, and the basins. So Huram made an end of doing the work that he wrought for king Solomon in the house of God:'
    translation: JPS 1917
    original: וַיַּעַשׂ חוּרָם אֶת־הַסִּירוֹת וְאֶת־הַיָּעִים וְאֶת־הַמִּזְרָקוֹת וַיְכַל חירם [חוּרָם] לַעֲשׂוֹת אֶת־הַמְּלָאכָה אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה בְּבֵית הָאֱלֹהִים׃
    hebrewPlain: ויעש חורם את הסירות ואת היעים ואת המזרקות ויכל חירם [חורם] לעשות את המלאכה אשר עשה למלך שלמה בבית האלהים
    kjvRefs:
    - 2 Chronicles 4:11
    kjvOsis:
    - 2Chr.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:12
    ref: 2 Chronicles 4:12
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 22448
    text: the two pillars, and the bowls, and the two capitals which were on the top of the pillars; and the two networks to cover the two bowls of the capitals that were on the top of the pillars;
    translation: JPS 1917
    original: עַמּוּדִים שְׁנַיִם וְהַגֻּלּוֹת וְהַכֹּתָרוֹת עַל־רֹאשׁ הָעַמּוּדִים שְׁתָּיִם וְהַשְּׂבָכוֹת שְׁתַּיִם לְכַסּוֹת אֶת־שְׁתֵּי גֻּלּוֹת הַכֹּתָרוֹת אֲשֶׁר עַל־רֹאשׁ הָעַמּוּדִים׃
    hebrewPlain: עמודים שנים והגלות והכתרות על ראש העמודים שתים והשבכות שתים לכסות את שתי גלות הכתרות אשר על ראש העמודים
    kjvRefs:
    - 2 Chronicles 4:12
    kjvOsis:
    - 2Chr.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:13
    ref: 2 Chronicles 4:13
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 22449
    text: 'and the four hundred pomegranates for the two networks: two rows of pomegranates for each network, to cover the two bowls of the capitals that were upon the top of the pillars.'
    translation: JPS 1917
    original: וְאֶת־הָרִמּוֹנִים אַרְבַּע מֵאוֹת לִשְׁתֵּי הַשְּׂבָכוֹת שְׁנַיִם טוּרִים רִמּוֹנִים לַשְּׂבָכָה הָאֶחָת לְכַסּוֹת אֶת־שְׁתֵּי גֻּלּוֹת הַכֹּתָרוֹת אֲשֶׁר עַל־פְּנֵי הָעַמּוּדִים׃
    hebrewPlain: ואת הרמונים ארבע מאות לשתי השבכות שנים טורים רמונים לשבכה האחת לכסות את שתי גלות הכתרות אשר על פני העמודים
    kjvRefs:
    - 2 Chronicles 4:13
    kjvOsis:
    - 2Chr.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.4
- type: TanakhVerse
  data:
    osis: 2Chr.4.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:14
    ref: 2 Chronicles 4:14
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 22450
    text: He made also the bases, and the lavers made he upon the bases;
    translation: JPS 1917
    original: וְאֶת־הַמְּכֹנוֹת עָשָׂה וְאֶת־הַכִּיֹּרוֹת עָשָׂה עַל־הַמְּכֹנוֹת׃
    hebrewPlain: ואת המכנות עשה ואת הכירות עשה על המכנות
    kjvRefs:
    - 2 Chronicles 4:14
    kjvOsis:
    - 2Chr.4.14
