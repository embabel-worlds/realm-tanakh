- type: TanakhVerse
  data:
    osis: 2Chr.6.42
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:42
    ref: 2 Chronicles 6:42
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 42
    ordinal: 22514
    text: O LORD God, turn not away the face of Thine anointed; Remember the good deeds of David Thy servant.’
    translation: JPS 1917
    original: יְהוָה אֱלֹהִים אַל־תָּשֵׁב פְּנֵי מְשִׁיחֶיךָ זָכְרָה לְחַסְדֵי דָּוִיד עַבְדֶּךָ׃
    hebrewPlain: יהוה אלהים אל תשב פני משיחיך זכרה לחסדי דויד עבדך
    kjvRefs:
    - 2 Chronicles 6:42
    kjvOsis:
    - 2Chr.6.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.6
- type: TanakhVerse
  data:
    osis: 2Chr.7.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:1
    ref: 2 Chronicles 7:1
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 22515
    text: Now when Solomon had made an end of praying, the fire came down from heaven, and consumed the burnt-offering and the sacrifices; and the glory of the LORD filled the house.
    translation: JPS 1917
    original: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם וַתֹּאכַל הָעֹלָה וְהַזְּבָחִים וּכְבוֹד יְהוָה מָלֵא אֶת־הַבָּיִת׃
    hebrewPlain: וככלות שלמה להתפלל והאש ירדה מהשמים ותאכל העלה והזבחים וכבוד יהוה מלא את הבית
    kjvRefs:
    - 2 Chronicles 7:1
    kjvOsis:
    - 2Chr.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:2
    ref: 2 Chronicles 7:2
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 22516
    text: And the priests could not enter into the house of the LORD, because the glory of the LORD filled the LORD’S house.
    translation: JPS 1917
    original: וְלֹא יָכְלוּ הַכֹּהֲנִים לָבוֹא אֶל־בֵּית יְהוָה כִּי־מָלֵא כְבוֹד־יְהוָה אֶת־בֵּית יְהוָה׃
    hebrewPlain: ולא יכלו הכהנים לבוא אל בית יהוה כי מלא כבוד יהוה את בית יהוה
    kjvRefs:
    - 2 Chronicles 7:2
    kjvOsis:
    - 2Chr.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:3
    ref: 2 Chronicles 7:3
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 22517
    text: And all the children of Israel looked on, when the fire came down, and the glory of the LORD was upon the house; and they bowed themselves with their faces to the ground upon the pavement, and prostrated themselves, and gave thanks unto the LORD; ‘for He is good, for His mercy endureth for ever.’
    translation: JPS 1917
    original: וְכֹל בְּנֵי יִשְׂרָאֵל רֹאִים בְּרֶדֶת הָאֵשׁ וּכְבוֹד יְהוָה עַל־הַבָּיִת וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל־הָרִצְפָה וַיִּשְׁתַּחֲווּ וְהוֹדוֹת לַיהוָה כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ׃
    hebrewPlain: וכל בני ישראל ראים ברדת האש וכבוד יהוה על הבית ויכרעו אפים ארצה על הרצפה וישתחוו והודות ליהוה כי טוב כי לעולם חסדו
    kjvRefs:
    - 2 Chronicles 7:3
    kjvOsis:
    - 2Chr.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:4
    ref: 2 Chronicles 7:4
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 22518
    text: And the king and all the people offered sacrifice before the LORD.
    translation: JPS 1917
    original: וְהַמֶּלֶךְ וְכָל־הָעָם זֹבְחִים זֶבַח לִפְנֵי יְהוָה׃
    hebrewPlain: והמלך וכל העם זבחים זבח לפני יהוה
    kjvRefs:
    - 2 Chronicles 7:4
    kjvOsis:
    - 2Chr.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:5
    ref: 2 Chronicles 7:5
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 22519
    text: And king Solomon offered a sacrifice of twenty and two thousand oxen, and a hundred and twenty thousand sheep. So the king and all the people dedicated the house of God.
    translation: JPS 1917
    original: וַיִּזְבַּח הַמֶּלֶךְ שְׁלֹמֹה אֶת־זֶבַח הַבָּקָר עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְצֹאן מֵאָה וְעֶשְׂרִים אָלֶף וַיַּחְנְכוּ אֶת־בֵּית הָאֱלֹהִים הַמֶּלֶךְ וְכָל־הָעָם׃
    hebrewPlain: ויזבח המלך שלמה את זבח הבקר עשרים ושנים אלף וצאן מאה ועשרים אלף ויחנכו את בית האלהים המלך וכל העם
    kjvRefs:
    - 2 Chronicles 7:5
    kjvOsis:
    - 2Chr.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:6
    ref: 2 Chronicles 7:6
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 22520
    text: And the priests stood, according to their offices; the Levites also with instruments of music of the LORD, which David the king had made, to give thanks unto the LORD, for His mercy endureth for ever, with the praises of David by their hand; and the priests sounded trumpets over against them; and all Israel stood.
    translation: JPS 1917
    original: וְהַכֹּהֲנִים עַל־מִשְׁמְרוֹתָם עֹמְדִים וְהַלְוִיִּם בִּכְלֵי־שִׁיר יְהוָה אֲשֶׁר עָשָׂה דָּוִיד הַמֶּלֶךְ לְהֹדוֹת לַיהוָה כִּי־לְעוֹלָם חַסְדּוֹ בְּהַלֵּל דָּוִיד בְּיָדָם וְהַכֹּהֲנִים מחצצרים [מַחְצְרִים] נֶגְדָּם וְכָל־יִשְׂרָאֵל עֹמְדִים׃
    hebrewPlain: והכהנים על משמרותם עמדים והלוים בכלי שיר יהוה אשר עשה דויד המלך להדות ליהוה כי לעולם חסדו בהלל דויד בידם והכהנים מחצצרים [מחצרים] נגדם וכל ישראל עמדים
    kjvRefs:
    - 2 Chronicles 7:6
    kjvOsis:
    - 2Chr.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:7
    ref: 2 Chronicles 7:7
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 22521
    text: Moreover Solomon hallowed the middle of the court that was before the house of the LORD; for there he offered the burnt-offerings, and the fat of the peace-offerings; because the brazen altar which Solomon had made was not able to receive the burnt-offering, and the meal-offering, and the fat.
    translation: JPS 1917
    original: וַיְקַדֵּשׁ שְׁלֹמֹה אֶת־תּוֹךְ הֶחָצֵר אֲשֶׁר לִפְנֵי בֵית־יְהוָה כִּי־עָשָׂה שָׁם הָעֹלוֹת וְאֵת חֶלְבֵי הַשְּׁלָמִים כִּי־מִזְבַּח הַנְּחֹשֶׁת אֲשֶׁר עָשָׂה שְׁלֹמֹה לֹא יָכוֹל לְהָכִיל אֶת־הָעֹלָה וְאֶת־הַמִּנְחָה וְאֶת־הַחֲלָבִים׃
    hebrewPlain: ויקדש שלמה את תוך החצר אשר לפני בית יהוה כי עשה שם העלות ואת חלבי השלמים כי מזבח הנחשת אשר עשה שלמה לא יכול להכיל את העלה ואת המנחה ואת החלבים
    kjvRefs:
    - 2 Chronicles 7:7
    kjvOsis:
    - 2Chr.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:8
    ref: 2 Chronicles 7:8
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 22522
    text: So Solomon held the feast at that time seven days, and all Israel with him, a very great congregation, from the entrance of Hamath unto the Brook of Egypt.
    translation: JPS 1917
    original: וַיַּעַשׂ שְׁלֹמֹה אֶת־הֶחָג בָּעֵת הַהִיא שִׁבְעַת יָמִים וְכָל־יִשְׂרָאֵל עִמּוֹ קָהָל גָּדוֹל מְאֹד מִלְּבוֹא חֲמָת עַד־נַחַל מִצְרָיִם׃
    hebrewPlain: ויעש שלמה את החג בעת ההיא שבעת ימים וכל ישראל עמו קהל גדול מאד מלבוא חמת עד נחל מצרים
    kjvRefs:
    - 2 Chronicles 7:8
    kjvOsis:
    - 2Chr.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:9
    ref: 2 Chronicles 7:9
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 22523
    text: And on the eighth day they held a solemn assembly; for they kept the dedication of the altar seven days, and the feast seven days.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בַּיּוֹם הַשְּׁמִינִי עֲצָרֶת כִּי חֲנֻכַּת הַמִּזְבֵּחַ עָשׂוּ שִׁבְעַת יָמִים וְהֶחָג שִׁבְעַת יָמִים׃
    hebrewPlain: ויעשו ביום השמיני עצרת כי חנכת המזבח עשו שבעת ימים והחג שבעת ימים
    kjvRefs:
    - 2 Chronicles 7:9
    kjvOsis:
    - 2Chr.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:10
    ref: 2 Chronicles 7:10
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 22524
    text: And on the three and twentieth day of the seventh month he sent the people away unto their tents, joyful and glad of heart for the goodness that the LORD had shown unto David, and to Solomon, and to Israel His people.
    translation: JPS 1917
    original: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי שִׁלַּח אֶת־הָעָם לְאָהֳלֵיהֶם שְׂמֵחִים וְטוֹבֵי לֵב עַל־הַטּוֹבָה אֲשֶׁר עָשָׂה יְהוָה לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ׃
    hebrewPlain: וביום עשרים ושלשה לחדש השביעי שלח את העם לאהליהם שמחים וטובי לב על הטובה אשר עשה יהוה לדויד ולשלמה ולישראל עמו
    kjvRefs:
    - 2 Chronicles 7:10
    kjvOsis:
    - 2Chr.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:11
    ref: 2 Chronicles 7:11
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 22525
    text: Thus Solomon finished the house of the LORD, and the king’s house; and all that came into Solomon’s heart to make in the house of the LORD, and in his own house, he prosperously effected.
    translation: JPS 1917
    original: וַיְכַל שְׁלֹמֹה אֶת־בֵּית יְהוָה וְאֶת־בֵּית הַמֶּלֶךְ וְאֵת כָּל־הַבָּא עַל־לֵב שְׁלֹמֹה לַעֲשׂוֹת בְּבֵית־יְהוָה וּבְבֵיתוֹ הִצְלִיחַ׃
    hebrewPlain: ויכל שלמה את בית יהוה ואת בית המלך ואת כל הבא על לב שלמה לעשות בבית יהוה ובביתו הצליח
    kjvRefs:
    - 2 Chronicles 7:11
    kjvOsis:
    - 2Chr.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:12
    ref: 2 Chronicles 7:12
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 22526
    text: 'And the LORD appeared to Solomon by night, and said unto him: ‘I have heard thy prayer, and have chosen this place to Myself for a house of sacrifice.'
    translation: JPS 1917
    original: וַיֵּרָא יְהוָה אֶל־שְׁלֹמֹה בַּלָּיְלָה וַיֹּאמֶר לוֹ שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ וּבָחַרְתִּי בַּמָּקוֹם הַזֶּה לִי לְבֵית זָבַח׃
    hebrewPlain: וירא יהוה אל שלמה בלילה ויאמר לו שמעתי את תפלתך ובחרתי במקום הזה לי לבית זבח
    kjvRefs:
    - 2 Chronicles 7:12
    kjvOsis:
    - 2Chr.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:13
    ref: 2 Chronicles 7:13
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 22527
    text: If I shut up heaven that there be no rain, or if I command the locust to devour the land, or if I send pestilence among My people;
    translation: JPS 1917
    original: הֵן אֶעֱצֹר הַשָּׁמַיִם וְלֹא־יִהְיֶה מָטָר וְהֵן־אֲצַוֶּה עַל־חָגָב לֶאֱכוֹל הָאָרֶץ וְאִם־אֲשַׁלַּח דֶּבֶר בְּעַמִּי׃
    hebrewPlain: הן אעצר השמים ולא יהיה מטר והן אצוה על חגב לאכול הארץ ואם אשלח דבר בעמי
    kjvRefs:
    - 2 Chronicles 7:13
    kjvOsis:
    - 2Chr.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:14
    ref: 2 Chronicles 7:14
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 22528
    text: if My people, upon whom My name is called, shall humble themselves, and pray, and seek My face, and turn from their evil ways; then will I hear from heaven, and will forgive their sin, and will heal their land.
    translation: JPS 1917
    original: וְיִכָּנְעוּ עַמִּי אֲשֶׁר נִקְרָא־שְׁמִי עֲלֵיהֶם וְיִתְפַּלְלוּ וִיבַקְשׁוּ פָנַי וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים וַאֲנִי אֶשְׁמַע מִן־הַשָּׁמַיִם וְאֶסְלַח לְחַטָּאתָם וְאֶרְפָּא אֶת־אַרְצָם׃
    hebrewPlain: ויכנעו עמי אשר נקרא שמי עליהם ויתפללו ויבקשו פני וישבו מדרכיהם הרעים ואני אשמע מן השמים ואסלח לחטאתם וארפא את ארצם
    kjvRefs:
    - 2 Chronicles 7:14
    kjvOsis:
    - 2Chr.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:15
    ref: 2 Chronicles 7:15
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 22529
    text: Now Mine eyes shall be open, and Mine ears attent, unto the prayer that is made in this place.
    translation: JPS 1917
    original: עַתָּה עֵינַי יִהְיוּ פְתֻחוֹת וְאָזְנַי קַשֻּׁבוֹת לִתְפִלַּת הַמָּקוֹם הַזֶּה׃
    hebrewPlain: עתה עיני יהיו פתחות ואזני קשבות לתפלת המקום הזה
    kjvRefs:
    - 2 Chronicles 7:15
    kjvOsis:
    - 2Chr.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:16
    ref: 2 Chronicles 7:16
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 22530
    text: For now have I chosen and hallowed this house, that My name may be there for ever; and Mine eyes and My heart shall be there perpetually.
    translation: JPS 1917
    original: וְעַתָּה בָּחַרְתִּי וְהִקְדַּשְׁתִּי אֶת־הַבַּיִת הַזֶּה לִהְיוֹת־שְׁמִי שָׁם עַד־עוֹלָם וְהָיוּ עֵינַי וְלִבִּי שָׁם כָּל־הַיָּמִים׃
    hebrewPlain: ועתה בחרתי והקדשתי את הבית הזה להיות שמי שם עד עולם והיו עיני ולבי שם כל הימים
    kjvRefs:
    - 2 Chronicles 7:16
    kjvOsis:
    - 2Chr.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:17
    ref: 2 Chronicles 7:17
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 22531
    text: And as for thee, if thou wilt walk before Me as David thy father walked, and do according to all that I have commanded thee, and wilt keep My statutes and Mine ordinances;
    translation: JPS 1917
    original: וְאַתָּה אִם־תֵּלֵךְ לְפָנַי כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ וְחֻקַּי וּמִשְׁפָּטַי תִּשְׁמוֹר׃
    hebrewPlain: ואתה אם תלך לפני כאשר הלך דויד אביך ולעשות ככל אשר צויתיך וחקי ומשפטי תשמור
    kjvRefs:
    - 2 Chronicles 7:17
    kjvOsis:
    - 2Chr.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:18
    ref: 2 Chronicles 7:18
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 22532
    text: 'then I will establish the throne of thy kingdom, according as I covenanted with David thy father, saying: There shall not fail thee a man to be ruler in Israel.'
    translation: JPS 1917
    original: וַהֲקִימוֹתִי אֵת כִּסֵּא מַלְכוּתֶךָ כַּאֲשֶׁר כָּרַתִּי לְדָוִיד אָבִיךָ לֵאמֹר לֹא־יִכָּרֵת לְךָ אִישׁ מוֹשֵׁל בְּיִשְׂרָאֵל׃
    hebrewPlain: והקימותי את כסא מלכותך כאשר כרתי לדויד אביך לאמר לא יכרת לך איש מושל בישראל
    kjvRefs:
    - 2 Chronicles 7:18
    kjvOsis:
    - 2Chr.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:19
    ref: 2 Chronicles 7:19
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 22533
    text: But if ye turn away, and forsake My statutes and My commandments which I have set before you, and shall go and serve other gods, and worship them;
    translation: JPS 1917
    original: וְאִם־תְּשׁוּבוּן אַתֶּם וַעֲזַבְתֶּם חֻקּוֹתַי וּמִצְוֺתַי אֲשֶׁר נָתַתִּי לִפְנֵיכֶם וַהֲלַכְתֶּם וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים וְהִשְׁתַּחֲוִיתֶם לָהֶם׃
    hebrewPlain: ואם תשובון אתם ועזבתם חקותי ומצותי אשר נתתי לפניכם והלכתם ועבדתם אלהים אחרים והשתחויתם להם
    kjvRefs:
    - 2 Chronicles 7:19
    kjvOsis:
    - 2Chr.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:20
    ref: 2 Chronicles 7:20
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 22534
    text: then will I pluck them up by the roots out of My land which I have given them; and this house, which I have hallowed for My name, will I cast out of My sight, and I will make it a proverb and a byword among all peoples.
    translation: JPS 1917
    original: וּנְתַשְׁתִּים מֵעַל אַדְמָתִי אֲשֶׁר נָתַתִּי לָהֶם וְאֶת־הַבַּיִת הַזֶּה אֲשֶׁר הִקְדַּשְׁתִּי לִשְׁמִי אַשְׁלִיךְ מֵעַל פָּנָי וְאֶתְּנֶנּוּ לְמָשָׁל וְלִשְׁנִינָה בְּכָל־הָעַמִּים׃
    hebrewPlain: ונתשתים מעל אדמתי אשר נתתי להם ואת הבית הזה אשר הקדשתי לשמי אשליך מעל פני ואתננו למשל ולשנינה בכל העמים
    kjvRefs:
    - 2 Chronicles 7:20
    kjvOsis:
    - 2Chr.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:21
    ref: 2 Chronicles 7:21
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 22535
    text: 'And this house, which is so high, every one that passeth by it shall be astonished, and shall say: Why hath the LORD done thus unto this land, and to this house?'
    translation: JPS 1917
    original: וְהַבַּיִת הַזֶּה אֲשֶׁר הָיָה עֶלְיוֹן לְכָל־עֹבֵר עָלָיו יִשֹּׁם וְאָמַר בַּמֶּה עָשָׂה יְהוָה כָּכָה לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה׃
    hebrewPlain: והבית הזה אשר היה עליון לכל עבר עליו ישם ואמר במה עשה יהוה ככה לארץ הזאת ולבית הזה
    kjvRefs:
    - 2 Chronicles 7:21
    kjvOsis:
    - 2Chr.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.7.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 7:22
    ref: 2 Chronicles 7:22
    book: 2Chr
    section: ketuvim
    chapter: 7
    verse: 22
    ordinal: 22536
    text: 'And they shall answer: Because they forsook the LORD, the God of their fathers, who brought them forth out of the land of Egypt, and laid hold on other gods, and worshipped them, and served them; therefore hath He brought all this evil upon them.’'
    translation: JPS 1917
    original: וְאָמְרוּ עַל אֲשֶׁר עָזְבוּ אֶת־יְהוָה אֱלֹהֵי אֲבֹתֵיהֶם אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים וַיִּשְׁתַּחֲווּ לָהֶם וַיַּעַבְדוּם עַל־כֵּן הֵבִיא עֲלֵיהֶם אֵת כָּל־הָרָעָה הַזֹּאת׃
    hebrewPlain: ואמרו על אשר עזבו את יהוה אלהי אבתיהם אשר הוציאם מארץ מצרים ויחזיקו באלהים אחרים וישתחוו להם ויעבדום על כן הביא עליהם את כל הרעה הזאת
    kjvRefs:
    - 2 Chronicles 7:22
    kjvOsis:
    - 2Chr.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.7
- type: TanakhVerse
  data:
    osis: 2Chr.8.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:1
    ref: 2 Chronicles 8:1
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 22537
    text: And it came to pass at the end of twenty years, wherein Solomon had built the house of the LORD, and his own house,
    translation: JPS 1917
    original: וַיְהִי מִקֵּץ עֶשְׂרִים שָׁנָה אֲשֶׁר בָּנָה שְׁלֹמֹה אֶת־בֵּית יְהוָה וְאֶת־בֵּיתוֹ׃
    hebrewPlain: ויהי מקץ עשרים שנה אשר בנה שלמה את בית יהוה ואת ביתו
    kjvRefs:
    - 2 Chronicles 8:1
    kjvOsis:
    - 2Chr.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:2
    ref: 2 Chronicles 8:2
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 22538
    text: that the cities which Huram had given to Solomon, Solomon built them, and caused the children of Israel to dwell there.
    translation: JPS 1917
    original: וְהֶעָרִים אֲשֶׁר נָתַן חוּרָם לִשְׁלֹמֹה בָּנָה שְׁלֹמֹה אֹתָם וַיּוֹשֶׁב שָׁם אֶת־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: והערים אשר נתן חורם לשלמה בנה שלמה אתם ויושב שם את בני ישראל
    kjvRefs:
    - 2 Chronicles 8:2
    kjvOsis:
    - 2Chr.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:3
    ref: 2 Chronicles 8:3
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 22539
    text: And Solomon went to Hamath-zobah, and prevailed against it.
    translation: JPS 1917
    original: וַיֵּלֶךְ שְׁלֹמֹה חֲמָת צוֹבָה וַיֶּחֱזַק עָלֶיהָ׃
    hebrewPlain: וילך שלמה חמת צובה ויחזק עליה
    kjvRefs:
    - 2 Chronicles 8:3
    kjvOsis:
    - 2Chr.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:4
    ref: 2 Chronicles 8:4
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 22540
    text: And he built Tadmor in the wilderness, and all the store-cities, which he built in Hamath.
    translation: JPS 1917
    original: וַיִּבֶן אֶת־תַּדְמֹר בַּמִּדְבָּר וְאֵת כָּל־עָרֵי הַמִּסְכְּנוֹת אֲשֶׁר בָּנָה בַּחֲמָת׃
    hebrewPlain: ויבן את תדמר במדבר ואת כל ערי המסכנות אשר בנה בחמת
    kjvRefs:
    - 2 Chronicles 8:4
    kjvOsis:
    - 2Chr.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:5
    ref: 2 Chronicles 8:5
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 22541
    text: Also he built Beth-horon the upper, and Beth-horon the nether, fortified cities, with walls, gates, and bars;
    translation: JPS 1917
    original: וַיִּבֶן אֶת־בֵּית חוֹרוֹן הָעֶלְיוֹן וְאֶת־בֵּית חוֹרוֹן הַתַּחְתּוֹן עָרֵי מָצוֹר חוֹמוֹת דְּלָתַיִם וּבְרִיחַ׃
    hebrewPlain: ויבן את בית חורון העליון ואת בית חורון התחתון ערי מצור חומות דלתים ובריח
    kjvRefs:
    - 2 Chronicles 8:5
    kjvOsis:
    - 2Chr.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:6
    ref: 2 Chronicles 8:6
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 22542
    text: and Baalath, and all the store-cities that Solomon had, and all the cities for his chariots, and the cities for his horsemen, and all that Solomon desired to build for his pleasure in Jerusalem, and in Lebanon, and in all the land of his dominion.
    translation: JPS 1917
    original: וְאֶת־בַּעֲלָת וְאֵת כָּל־עָרֵי הַמִּסְכְּנוֹת אֲשֶׁר הָיוּ לִשְׁלֹמֹה וְאֵת כָּל־עָרֵי הָרֶכֶב וְאֵת עָרֵי הַפָּרָשִׁים וְאֵת כָּל־חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק לִבְנוֹת בִּירוּשָׁלִַם וּבַלְּבָנוֹן וּבְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ׃
    hebrewPlain: ואת בעלת ואת כל ערי המסכנות אשר היו לשלמה ואת כל ערי הרכב ואת ערי הפרשים ואת כל חשק שלמה אשר חשק לבנות בירושלם ובלבנון ובכל ארץ ממשלתו
    kjvRefs:
    - 2 Chronicles 8:6
    kjvOsis:
    - 2Chr.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:7
    ref: 2 Chronicles 8:7
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 22543
    text: As for all the people that were left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, who were not of Israel;
    translation: JPS 1917
    original: כָּל־הָעָם הַנּוֹתָר מִן־הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה׃
    hebrewPlain: כל העם הנותר מן החתי והאמרי והפרזי והחוי והיבוסי אשר לא מישראל המה
    kjvRefs:
    - 2 Chronicles 8:7
    kjvOsis:
    - 2Chr.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:8
    ref: 2 Chronicles 8:8
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 22544
    text: of their children that were left after them in the land, whom the children of Israel consumed not, of them did Solomon raise a levy of bondservants, unto this day.
    translation: JPS 1917
    original: מִן־בְּנֵיהֶם אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם בָּאָרֶץ אֲשֶׁר לֹא־כִלּוּם בְּנֵי יִשְׂרָאֵל וַיַּעֲלֵם שְׁלֹמֹה לְמַס עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: מן בניהם אשר נותרו אחריהם בארץ אשר לא כלום בני ישראל ויעלם שלמה למס עד היום הזה
    kjvRefs:
    - 2 Chronicles 8:8
    kjvOsis:
    - 2Chr.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:9
    ref: 2 Chronicles 8:9
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 22545
    text: But of the children of Israel did Solomon make no servants for his work; but they were men of war, and chief of his captains, and rulers of his chariots and of his horsemen.
    translation: JPS 1917
    original: וּמִן־בְּנֵי יִשְׂרָאֵל אֲשֶׁר לֹא־נָתַן שְׁלֹמֹה לַעֲבָדִים לִמְלַאכְתּוֹ כִּי־הֵמָּה אַנְשֵׁי מִלְחָמָה וְשָׂרֵי שָׁלִישָׁיו וְשָׂרֵי רִכְבּוֹ וּפָרָשָׁיו׃
    hebrewPlain: ומן בני ישראל אשר לא נתן שלמה לעבדים למלאכתו כי המה אנשי מלחמה ושרי שלישיו ושרי רכבו ופרשיו
    kjvRefs:
    - 2 Chronicles 8:9
    kjvOsis:
    - 2Chr.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:10
    ref: 2 Chronicles 8:10
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 22546
    text: And these were the chief officers of king Solomon, even two hundred and fifty, that bore rule over the people.
    translation: JPS 1917
    original: וְאֵלֶּה שָׂרֵי הנציבים [הַנִּצָּבִים] אֲשֶׁר־לַמֶּלֶךְ שְׁלֹמֹה חֲמִשִּׁים וּמָאתָיִם הָרֹדִים בָּעָם׃
    hebrewPlain: ואלה שרי הנציבים [הנצבים] אשר למלך שלמה חמשים ומאתים הרדים בעם
    kjvRefs:
    - 2 Chronicles 8:10
    kjvOsis:
    - 2Chr.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:11
    ref: 2 Chronicles 8:11
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 22547
    text: 'And Solomon brought up the daughter of Pharaoh out of the city of David unto the house that he had built for her; for he said: ‘No wife of mine shall dwell in the house of David king of Israel, because the places are holy, whereunto the ark of the LORD hath come.’'
    translation: JPS 1917
    original: וְאֶת־בַּת־פַּרְעֹה הֶעֱלָה שְׁלֹמֹה מֵעִיר דָּוִיד לַבַּיִת אֲשֶׁר בָּנָה־לָהּ כִּי אָמַר לֹא־תֵשֵׁב אִשָּׁה לִי בְּבֵית דָּוִיד מֶלֶךְ־יִשְׂרָאֵל כִּי־קֹדֶשׁ הֵמָּה אֲשֶׁר־בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה׃
    hebrewPlain: ואת בת פרעה העלה שלמה מעיר דויד לבית אשר בנה לה כי אמר לא תשב אשה לי בבית דויד מלך ישראל כי קדש המה אשר באה אליהם ארון יהוה
    kjvRefs:
    - 2 Chronicles 8:11
    kjvOsis:
    - 2Chr.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:12
    ref: 2 Chronicles 8:12
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 22548
    text: Then Solomon offered burnt-offerings unto the LORD on the altar of the LORD, which he had built before the porch,
    translation: JPS 1917
    original: אָז הֶעֱלָה שְׁלֹמֹה עֹלוֹת לַיהוָה עַל מִזְבַּח יְהוָה אֲשֶׁר בָּנָה לִפְנֵי הָאוּלָם׃
    hebrewPlain: אז העלה שלמה עלות ליהוה על מזבח יהוה אשר בנה לפני האולם
    kjvRefs:
    - 2 Chronicles 8:12
    kjvOsis:
    - 2Chr.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:13
    ref: 2 Chronicles 8:13
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 22549
    text: even as the duty of every day required, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the appointed seasons, three times in the year, even in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.
    translation: JPS 1917
    original: וּבִדְבַר־יוֹם בְּיוֹם לְהַעֲלוֹת כְּמִצְוַת מֹשֶׁה לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמּוֹעֲדוֹת שָׁלוֹשׁ פְּעָמִים בַּשָּׁנָה בְּחַג הַמַּצּוֹת וּבְחַג הַשָּׁבֻעוֹת וּבְחַג הַסֻּכּוֹת׃
    hebrewPlain: ובדבר יום ביום להעלות כמצות משה לשבתות ולחדשים ולמועדות שלוש פעמים בשנה בחג המצות ובחג השבעות ובחג הסכות
    kjvRefs:
    - 2 Chronicles 8:13
    kjvOsis:
    - 2Chr.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:14
    ref: 2 Chronicles 8:14
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 22550
    text: And he appointed, according to the ordinance of David his father, the courses of the priests to their service, and the Levites to their charges, to praise, and to minister before the priests, as the duty of every day required; the doorkeepers also by their courses at every gate; for so had David the man of God commanded.
    translation: JPS 1917
    original: וַיַּעֲמֵד כְּמִשְׁפַּט דָּוִיד־אָבִיו אֶת־מַחְלְקוֹת הַכֹּהֲנִים עַל־עֲבֹדָתָם וְהַלְוִיִּם עַל־מִשְׁמְרוֹתָם לְהַלֵּל וּלְשָׁרֵת נֶגֶד הַכֹּהֲנִים לִדְבַר־יוֹם בְּיוֹמוֹ וְהַשּׁוֹעֲרִים בְּמַחְלְקוֹתָם לְשַׁעַר וָשָׁעַר כִּי כֵן מִצְוַת דָּוִיד אִישׁ־הָאֱלֹהִים׃
    hebrewPlain: ויעמד כמשפט דויד אביו את מחלקות הכהנים על עבדתם והלוים על משמרותם להלל ולשרת נגד הכהנים לדבר יום ביומו והשוערים במחלקותם לשער ושער כי כן מצות דויד איש האלהים
    kjvRefs:
    - 2 Chronicles 8:14
    kjvOsis:
    - 2Chr.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:15
    ref: 2 Chronicles 8:15
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 22551
    text: And they departed not from the commandment of the king unto the priests and Levites concerning any matter, or concerning the treasures.
    translation: JPS 1917
    original: וְלֹא סָרוּ מִצְוַת הַמֶּלֶךְ עַל־הַכֹּהֲנִים וְהַלְוִיִּם לְכָל־דָּבָר וְלָאֹצָרוֹת׃
    hebrewPlain: ולא סרו מצות המלך על הכהנים והלוים לכל דבר ולאצרות
    kjvRefs:
    - 2 Chronicles 8:15
    kjvOsis:
    - 2Chr.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:16
    ref: 2 Chronicles 8:16
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 22552
    text: So all the work of Solomon was set in order from the day of the foundation of the house of the LORD, and until it was finished. So the house of the LORD was perfected.
    translation: JPS 1917
    original: וַתִּכֹּן כָּל־מְלֶאכֶת שְׁלֹמֹה עַד־הַיּוֹם מוּסַד בֵּית־יְהוָה וְעַד־כְּלֹתוֹ שָׁלֵם בֵּית יְהוָה׃
    hebrewPlain: ותכן כל מלאכת שלמה עד היום מוסד בית יהוה ועד כלתו שלם בית יהוה
    kjvRefs:
    - 2 Chronicles 8:16
    kjvOsis:
    - 2Chr.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:17
    ref: 2 Chronicles 8:17
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 22553
    text: Then went Solomon to Ezion-geber, and to Eloth, on the sea-shore in the land of Edom.
    translation: JPS 1917
    original: אָז הָלַךְ שְׁלֹמֹה לְעֶצְיוֹן־גֶּבֶר וְאֶל־אֵילוֹת עַל־שְׂפַת הַיָּם בְּאֶרֶץ אֱדוֹם׃
    hebrewPlain: אז הלך שלמה לעציון גבר ואל אילות על שפת הים בארץ אדום
    kjvRefs:
    - 2 Chronicles 8:17
    kjvOsis:
    - 2Chr.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.8.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 8:18
    ref: 2 Chronicles 8:18
    book: 2Chr
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 22554
    text: And Huram sent him by the hands of his servants ships, and servants that had knowledge of the sea; and they came with the servants of Solomon to Ophir, and fetched from thence four hundred and fifty talents of gold, and brought them to king Solomon.
    translation: JPS 1917
    original: וַיִּשְׁלַח־לוֹ חוּרָם בְּיַד־עֲבָדָיו אוניות [אֳנִיּוֹת] וַעֲבָדִים יוֹדְעֵי יָם וַיָּבֹאוּ עִם־עַבְדֵי שְׁלֹמֹה אוֹפִירָה וַיִּקְחוּ מִשָּׁם אַרְבַּע־מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב וַיָּבִיאוּ אֶל־הַמֶּלֶךְ שְׁלֹמֹה׃
    hebrewPlain: וישלח לו חורם ביד עבדיו אוניות [אניות] ועבדים יודעי ים ויבאו עם עבדי שלמה אופירה ויקחו משם ארבע מאות וחמשים ככר זהב ויביאו אל המלך שלמה
    kjvRefs:
    - 2 Chronicles 8:18
    kjvOsis:
    - 2Chr.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.8
- type: TanakhVerse
  data:
    osis: 2Chr.9.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:1
    ref: 2 Chronicles 9:1
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 22555
    text: And when the queen of Sheba heard of the fame of Solomon, she came to prove Solomon with hard questions at Jerusalem, with a very great train, and camels that bore spices and gold in abundance, and precious stones; and when she was come to Solomon, she spoke with him of all that was in her heart.
    translation: JPS 1917
    original: וּמַלְכַּת־שְׁבָא שָׁמְעָה אֶת־שֵׁמַע שְׁלֹמֹה וַתָּבוֹא לְנַסּוֹת אֶת־שְׁלֹמֹה בְחִידוֹת בִּירוּשָׁלִַם בְּחַיִל כָּבֵד מְאֹד וּגְמַלִּים נֹשְׂאִים בְּשָׂמִים וְזָהָב לָרֹב וְאֶבֶן יְקָרָה וַתָּבוֹא אֶל־שְׁלֹמֹה וַתְּדַבֵּר עִמּוֹ אֵת כָּל־אֲשֶׁר הָיָה עִם־לְבָבָהּ׃
    hebrewPlain: ומלכת שבא שמעה את שמע שלמה ותבוא לנסות את שלמה בחידות בירושלם בחיל כבד מאד וגמלים נשאים בשמים וזהב לרב ואבן יקרה ותבוא אל שלמה ותדבר עמו את כל אשר היה עם לבבה
    kjvRefs:
    - 2 Chronicles 9:1
    kjvOsis:
    - 2Chr.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:2
    ref: 2 Chronicles 9:2
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 22556
    text: And Solomon told her all her questions; and there was not any thing hid from Solomon which he told her not.
    translation: JPS 1917
    original: וַיַּגֶּד־לָהּ שְׁלֹמֹה אֶת־כָּל־דְּבָרֶיהָ וְלֹא־נֶעְלַם דָּבָר מִשְּׁלֹמֹה אֲשֶׁר לֹא הִגִּיד לָהּ׃
    hebrewPlain: ויגד לה שלמה את כל דבריה ולא נעלם דבר משלמה אשר לא הגיד לה
    kjvRefs:
    - 2 Chronicles 9:2
    kjvOsis:
    - 2Chr.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:3
    ref: 2 Chronicles 9:3
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 22557
    text: And when the queen of Sheba had seen the wisdom of Solomon, and the house that he had built,
    translation: JPS 1917
    original: וַתֵּרֶא מַלְכַּת־שְׁבָא אֵת חָכְמַת שְׁלֹמֹה וְהַבַּיִת אֲשֶׁר בָּנָה׃
    hebrewPlain: ותרא מלכת שבא את חכמת שלמה והבית אשר בנה
    kjvRefs:
    - 2 Chronicles 9:3
    kjvOsis:
    - 2Chr.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:4
    ref: 2 Chronicles 9:4
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 22558
    text: and the food of his table, and the sitting of his servants, and the attendance of his ministers, and their apparel; his cupbearers also, and their apparel; and his ascent by which he went up into the house of the LORD; there was no more spirit in her.
    translation: JPS 1917
    original: וּמַאֲכַל שֻׁלְחָנוֹ וּמוֹשַׁב עֲבָדָיו וּמַעֲמַד מְשָׁרְתָיו וּמַלְבּוּשֵׁיהֶם וּמַשְׁקָיו וּמַלְבּוּשֵׁיהֶם וַעֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה וְלֹא־הָיָה עוֹד בָּהּ רוּחַ׃
    hebrewPlain: ומאכל שלחנו ומושב עבדיו ומעמד משרתיו ומלבושיהם ומשקיו ומלבושיהם ועליתו אשר יעלה בית יהוה ולא היה עוד בה רוח
    kjvRefs:
    - 2 Chronicles 9:4
    kjvOsis:
    - 2Chr.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:5
    ref: 2 Chronicles 9:5
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 22559
    text: 'And she said to the king: ‘It was a true report that I heard in mine own land of thine acts, and of thy wisdom.'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶל־הַמֶּלֶךְ אֱמֶת הַדָּבָר אֲשֶׁר שָׁמַעְתִּי בְּאַרְצִי עַל־דְּבָרֶיךָ וְעַל־חָכְמָתֶךָ׃
    hebrewPlain: ותאמר אל המלך אמת הדבר אשר שמעתי בארצי על דבריך ועל חכמתך
    kjvRefs:
    - 2 Chronicles 9:5
    kjvOsis:
    - 2Chr.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:6
    ref: 2 Chronicles 9:6
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 22560
    text: Howbeit I believed not their words, until I came, and mine eyes had seen it; and, behold, the half of the greatness of thy wisdom was not told me; thou exceedest the fame that I heard.
    translation: JPS 1917
    original: וְלֹא־הֶאֱמַנְתִּי לְדִבְרֵיהֶם עַד אֲשֶׁר־בָּאתִי וַתִּרְאֶינָה עֵינַי וְהִנֵּה לֹא הֻגַּד־לִי חֲצִי מַרְבִּית חָכְמָתֶךָ יָסַפְתָּ עַל־הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי׃
    hebrewPlain: ולא האמנתי לדבריהם עד אשר באתי ותראינה עיני והנה לא הגד לי חצי מרבית חכמתך יספת על השמועה אשר שמעתי
    kjvRefs:
    - 2 Chronicles 9:6
    kjvOsis:
    - 2Chr.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:7
    ref: 2 Chronicles 9:7
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 22561
    text: Happy are thy men, and happy are these thy servants, that stand continually before thee, and hear thy wisdom.
    translation: JPS 1917
    original: אַשְׁרֵי אֲנָשֶׁיךָ וְאַשְׁרֵי עֲבָדֶיךָ אֵלֶּה הָעֹמְדִים לְפָנֶיךָ תָּמִיד וְשֹׁמְעִים אֶת־חָכְמָתֶךָ׃
    hebrewPlain: אשרי אנשיך ואשרי עבדיך אלה העמדים לפניך תמיד ושמעים את חכמתך
    kjvRefs:
    - 2 Chronicles 9:7
    kjvOsis:
    - 2Chr.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:8
    ref: 2 Chronicles 9:8
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 22562
    text: Blessed be the LORD thy God, who delighted in thee, to set thee on His throne, to be king for the LORD thy God; because thy God loved Israel, to establish them for ever, therefore made He thee king over them, to do justice and righteousness.’
    translation: JPS 1917
    original: יְהִי יְהוָה אֱלֹהֶיךָ בָּרוּךְ אֲשֶׁר חָפֵץ בְּךָ לְתִתְּךָ עַל־כִּסְאוֹ לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ בְּאַהֲבַת אֱלֹהֶיךָ אֶת־יִשְׂרָאֵל לְהַעֲמִידוֹ לְעוֹלָם וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה׃
    hebrewPlain: יהי יהוה אלהיך ברוך אשר חפץ בך לתתך על כסאו למלך ליהוה אלהיך באהבת אלהיך את ישראל להעמידו לעולם ויתנך עליהם למלך לעשות משפט וצדקה
    kjvRefs:
    - 2 Chronicles 9:8
    kjvOsis:
    - 2Chr.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:9
    ref: 2 Chronicles 9:9
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 22563
    text: And she gave the king a hundred and twenty talents of gold, and spices in great abundance, and precious stones; neither was there any such spice as the queen of Sheba gave to king Solomon.
    translation: JPS 1917
    original: וַתִּתֵּן לַמֶּלֶךְ מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב וּבְשָׂמִים לָרֹב מְאֹד וְאֶבֶן יְקָרָה וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא אֲשֶׁר־נָתְנָה מַלְכַּת־שְׁבָא לַמֶּלֶךְ שְׁלֹמֹה׃
    hebrewPlain: ותתן למלך מאה ועשרים ככר זהב ובשמים לרב מאד ואבן יקרה ולא היה כבשם ההוא אשר נתנה מלכת שבא למלך שלמה
    kjvRefs:
    - 2 Chronicles 9:9
    kjvOsis:
    - 2Chr.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:10
    ref: 2 Chronicles 9:10
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 22564
    text: And the servants also of Huram, and the servants of Solomon that brought gold from Ophir, brought sandal-wood and precious stones.
    translation: JPS 1917
    original: וְגַם־עַבְדֵי חירם [חוּרָם] וְעַבְדֵי שְׁלֹמֹה אֲשֶׁר־הֵבִיאוּ זָהָב מֵאוֹפִיר הֵבִיאוּ עֲצֵי אַלְגּוּמִּים וְאֶבֶן יְקָרָה׃
    hebrewPlain: וגם עבדי חירם [חורם] ועבדי שלמה אשר הביאו זהב מאופיר הביאו עצי אלגומים ואבן יקרה
    kjvRefs:
    - 2 Chronicles 9:10
    kjvOsis:
    - 2Chr.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:11
    ref: 2 Chronicles 9:11
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 22565
    text: And the king made of the sandal-wood paths for the house of the LORD, and for the king’s house, and harps and psalteries for the singers; and there were none such seen before in the land of Judah.
    translation: JPS 1917
    original: וַיַּעַשׂ הַמֶּלֶךְ אֶת־עֲצֵי הָאַלְגּוּמִּים מְסִלּוֹת לְבֵית־יְהוָה וּלְבֵית הַמֶּלֶךְ וְכִנֹּרוֹת וּנְבָלִים לַשָּׁרִים וְלֹא־נִרְאוּ כָהֵם לְפָנִים בְּאֶרֶץ יְהוּדָה׃
    hebrewPlain: ויעש המלך את עצי האלגומים מסלות לבית יהוה ולבית המלך וכנרות ונבלים לשרים ולא נראו כהם לפנים בארץ יהודה
    kjvRefs:
    - 2 Chronicles 9:11
    kjvOsis:
    - 2Chr.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:12
    ref: 2 Chronicles 9:12
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 22566
    text: And king Solomon gave to the queen of Sheba all her desire, whatsoever she asked, beside that which she had brought unto the king. So she turned, and went to her own land, she and her servants.
    translation: JPS 1917
    original: וְהַמֶּלֶךְ שְׁלֹמֹה נָתַן לְמַלְכַּת־שְׁבָא אֶת־כָּל־חֶפְצָהּ אֲשֶׁר שָׁאָלָה מִלְּבַד אֲשֶׁר־הֵבִיאָה אֶל־הַמֶּלֶךְ וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ הִיא וַעֲבָדֶיהָ׃
    hebrewPlain: והמלך שלמה נתן למלכת שבא את כל חפצה אשר שאלה מלבד אשר הביאה אל המלך ותהפך ותלך לארצה היא ועבדיה
    kjvRefs:
    - 2 Chronicles 9:12
    kjvOsis:
    - 2Chr.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.13
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:13
    ref: 2 Chronicles 9:13
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 22567
    text: Now the weight of gold that came to Solomon in one year was six hundred and threescore and six talents of gold;
    translation: JPS 1917
    original: וַיְהִי מִשְׁקַל הַזָּהָב אֲשֶׁר־בָּא לִשְׁלֹמֹה בְּשָׁנָה אֶחָת שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ כִּכְּרֵי זָהָב׃
    hebrewPlain: ויהי משקל הזהב אשר בא לשלמה בשנה אחת שש מאות וששים ושש ככרי זהב
    kjvRefs:
    - 2 Chronicles 9:13
    kjvOsis:
    - 2Chr.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.14
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:14
    ref: 2 Chronicles 9:14
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 22568
    text: beside that which the traffickers and merchants brought; and all the kings of Arabia and the governors of the country brought gold and silver to Solomon.
    translation: JPS 1917
    original: לְבַד מֵאַנְשֵׁי הַתָּרִים וְהַסֹּחֲרִים מְבִיאִים וְכָל־מַלְכֵי עֲרַב וּפַחוֹת הָאָרֶץ מְבִיאִים זָהָב וָכֶסֶף לִשְׁלֹמֹה׃
    hebrewPlain: לבד מאנשי התרים והסחרים מביאים וכל מלכי ערב ופחות הארץ מביאים זהב וכסף לשלמה
    kjvRefs:
    - 2 Chronicles 9:14
    kjvOsis:
    - 2Chr.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.15
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:15
    ref: 2 Chronicles 9:15
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 22569
    text: 'And king Solomon made two hundred targets of beaten gold: six hundred shekels of beaten gold went to one target;'
    translation: JPS 1917
    original: וַיַּעַשׂ הַמֶּלֶךְ שְׁלֹמֹה מָאתַיִם צִנָּה זָהָב שָׁחוּט שֵׁשׁ מֵאוֹת זָהָב שָׁחוּט יַעֲלֶה עַל־הַצִּנָּה הָאֶחָת׃
    hebrewPlain: ויעש המלך שלמה מאתים צנה זהב שחוט שש מאות זהב שחוט יעלה על הצנה האחת
    kjvRefs:
    - 2 Chronicles 9:15
    kjvOsis:
    - 2Chr.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:16
    ref: 2 Chronicles 9:16
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 22570
    text: 'three hundred shields of beaten gold also: three hundred shekels of gold went to one shield; and the king put them in the house of the forest of Lebanon.'
    translation: JPS 1917
    original: וּשְׁלֹשׁ־מֵאוֹת מָגִנִּים זָהָב שָׁחוּט שְׁלֹשׁ מֵאוֹת זָהָב יַעֲלֶה עַל־הַמָּגֵן הָאֶחָת וַיִּתְּנֵם הַמֶּלֶךְ בְּבֵית יַעַר הַלְּבָנוֹן׃
    hebrewPlain: ושלש מאות מגנים זהב שחוט שלש מאות זהב יעלה על המגן האחת ויתנם המלך בבית יער הלבנון
    kjvRefs:
    - 2 Chronicles 9:16
    kjvOsis:
    - 2Chr.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.17
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:17
    ref: 2 Chronicles 9:17
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 22571
    text: Moreover the king made a great throne of ivory, and overlaid it with pure gold.
    translation: JPS 1917
    original: וַיַּעַשׂ הַמֶּלֶךְ כִּסֵּא־שֵׁן גָּדוֹל וַיְצַפֵּהוּ זָהָב טָהוֹר׃
    hebrewPlain: ויעש המלך כסא שן גדול ויצפהו זהב טהור
    kjvRefs:
    - 2 Chronicles 9:17
    kjvOsis:
    - 2Chr.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.18
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:18
    ref: 2 Chronicles 9:18
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 22572
    text: And there were six steps to the throne, with a footstool of gold, which were fastened to the throne, and arms on either side by the place of the seat, and two lions standing beside the arms.
    translation: JPS 1917
    original: וְשֵׁשׁ מַעֲלוֹת לַכִּסֵּא וְכֶבֶשׁ בַּזָּהָב לַכִּסֵּא מָאֳחָזִים וְיָדוֹת מִזֶּה וּמִזֶּה עַל־מְקוֹם הַשָּׁבֶת וּשְׁנַיִם אֲרָיוֹת עֹמְדִים אֵצֶל הַיָּדוֹת׃
    hebrewPlain: ושש מעלות לכסא וכבש בזהב לכסא מאחזים וידות מזה ומזה על מקום השבת ושנים אריות עמדים אצל הידות
    kjvRefs:
    - 2 Chronicles 9:18
    kjvOsis:
    - 2Chr.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.19
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:19
    ref: 2 Chronicles 9:19
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 19
    ordinal: 22573
    text: And twelve lions stood there on the one side and on the other upon the six steps; there was not the like made in any kingdom.
    translation: JPS 1917
    original: וּשְׁנֵים עָשָׂר אֲרָיוֹת עֹמְדִים שָׁם עַל־שֵׁשׁ הַמַּעֲלוֹת מִזֶּה וּמִזֶּה לֹא־נַעֲשָׂה כֵן לְכָל־מַמְלָכָה׃
    hebrewPlain: ושנים עשר אריות עמדים שם על שש המעלות מזה ומזה לא נעשה כן לכל ממלכה
    kjvRefs:
    - 2 Chronicles 9:19
    kjvOsis:
    - 2Chr.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.20
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:20
    ref: 2 Chronicles 9:20
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 20
    ordinal: 22574
    text: And all king Solomon’s drinking-vessels were of gold, and all the vessels of the house of the forest of Lebanon were of pure gold; silver was nothing accounted of in the days of Solomon.
    translation: JPS 1917
    original: וְכֹל כְּלֵי מַשְׁקֵה הַמֶּלֶךְ שְׁלֹמֹה זָהָב וְכֹל כְּלֵי בֵּית־יַעַר הַלְּבָנוֹן זָהָב סָגוּר אֵין כֶּסֶף נֶחְשָׁב בִּימֵי שְׁלֹמֹה לִמְאוּמָה׃
    hebrewPlain: וכל כלי משקה המלך שלמה זהב וכל כלי בית יער הלבנון זהב סגור אין כסף נחשב בימי שלמה למאומה
    kjvRefs:
    - 2 Chronicles 9:20
    kjvOsis:
    - 2Chr.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.21
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:21
    ref: 2 Chronicles 9:21
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 21
    ordinal: 22575
    text: For the king had ships that went to Tarshish with the servants of Huram; once every three years came the ships of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks.
    translation: JPS 1917
    original: כִּי־אֳנִיּוֹת לַמֶּלֶךְ הֹלְכוֹת תַּרְשִׁישׁ עִם עַבְדֵי חוּרָם אַחַת לְשָׁלוֹשׁ שָׁנִים תָּבוֹאנָה אֳנִיּוֹת תַּרְשִׁישׁ נֹשְׂאוֹת זָהָב וָכֶסֶף שֶׁנְהַבִּים וְקוֹפִים וְתוּכִּיִּים׃
    hebrewPlain: כי אניות למלך הלכות תרשיש עם עבדי חורם אחת לשלוש שנים תבואנה אניות תרשיש נשאות זהב וכסף שנהבים וקופים ותוכיים
    kjvRefs:
    - 2 Chronicles 9:21
    kjvOsis:
    - 2Chr.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.22
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:22
    ref: 2 Chronicles 9:22
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 22
    ordinal: 22576
    text: So king Solomon exceeded all the kings of the earth in riches and wisdom.
    translation: JPS 1917
    original: וַיִּגְדַּל הַמֶּלֶךְ שְׁלֹמֹה מִכֹּל מַלְכֵי הָאָרֶץ לְעֹשֶׁר וְחָכְמָה׃
    hebrewPlain: ויגדל המלך שלמה מכל מלכי הארץ לעשר וחכמה
    kjvRefs:
    - 2 Chronicles 9:22
    kjvOsis:
    - 2Chr.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.23
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:23
    ref: 2 Chronicles 9:23
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 23
    ordinal: 22577
    text: And all the kings of the earth sought the presence of Solomon, to hear his wisdom, which God had put in his heart.
    translation: JPS 1917
    original: וְכֹל מַלְכֵי הָאָרֶץ מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה לִשְׁמֹעַ אֶת־חָכְמָתוֹ אֲשֶׁר־נָתַן הָאֱלֹהִים בְּלִבּוֹ׃
    hebrewPlain: וכל מלכי הארץ מבקשים את פני שלמה לשמע את חכמתו אשר נתן האלהים בלבו
    kjvRefs:
    - 2 Chronicles 9:23
    kjvOsis:
    - 2Chr.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.24
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:24
    ref: 2 Chronicles 9:24
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 24
    ordinal: 22578
    text: And they brought every man his present, vessels of silver, and vessels of gold, and raiment, armour, and spices, horses, and mules, a rate year by year.
    translation: JPS 1917
    original: וְהֵם מְבִיאִים אִישׁ מִנְחָתוֹ כְּלֵי כֶסֶף וּכְלֵי זָהָב וּשְׂלָמוֹת נֵשֶׁק וּבְשָׂמִים סוּסִים וּפְרָדִים דְּבַר־שָׁנָה בְּשָׁנָה׃
    hebrewPlain: והם מביאים איש מנחתו כלי כסף וכלי זהב ושלמות נשק ובשמים סוסים ופרדים דבר שנה בשנה
    kjvRefs:
    - 2 Chronicles 9:24
    kjvOsis:
    - 2Chr.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.25
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:25
    ref: 2 Chronicles 9:25
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 25
    ordinal: 22579
    text: And Solomon had four thousand stalls for horses and chariots, and twelve thousand horsemen, that he bestowed in the chariot cities, and with the king at Jerusalem.
    translation: JPS 1917
    original: וַיְהִי לִשְׁלֹמֹה אַרְבַּעַת אֲלָפִים אֻרְיוֹת סוּסִים וּמַרְכָּבוֹת וּשְׁנֵים־עָשָׂר אֶלֶף פָּרָשִׁים וַיַּנִּיחֵם בְּעָרֵי הָרֶכֶב וְעִם־הַמֶּלֶךְ בִּירוּשָׁלִָם׃
    hebrewPlain: ויהי לשלמה ארבעת אלפים אריות סוסים ומרכבות ושנים עשר אלף פרשים ויניחם בערי הרכב ועם המלך בירושלם
    kjvRefs:
    - 2 Chronicles 9:25
    kjvOsis:
    - 2Chr.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.26
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:26
    ref: 2 Chronicles 9:26
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 26
    ordinal: 22580
    text: And he ruled over all the kings from the River even unto the land of the Philistines, and to the border of Egypt.
    translation: JPS 1917
    original: וַיְהִי מוֹשֵׁל בְּכָל־הַמְּלָכִים מִן־הַנָּהָר וְעַד־אֶרֶץ פְּלִשְׁתִּים וְעַד גְּבוּל מִצְרָיִם׃
    hebrewPlain: ויהי מושל בכל המלכים מן הנהר ועד ארץ פלשתים ועד גבול מצרים
    kjvRefs:
    - 2 Chronicles 9:26
    kjvOsis:
    - 2Chr.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.27
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:27
    ref: 2 Chronicles 9:27
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 27
    ordinal: 22581
    text: And the king made silver to be in Jerusalem as stones, and cedars made he to be as the sycamore-trees that are in the Lowland, for abundance.
    translation: JPS 1917
    original: וַיִּתֵּן הַמֶּלֶךְ אֶת־הַכֶּסֶף בִּירוּשָׁלִַם כָּאֲבָנִים וְאֵת הָאֲרָזִים נָתַן כַּשִּׁקְמִים אֲשֶׁר־בַּשְּׁפֵלָה לָרֹב׃
    hebrewPlain: ויתן המלך את הכסף בירושלם כאבנים ואת הארזים נתן כשקמים אשר בשפלה לרב
    kjvRefs:
    - 2 Chronicles 9:27
    kjvOsis:
    - 2Chr.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.28
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:28
    ref: 2 Chronicles 9:28
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 28
    ordinal: 22582
    text: And they brought horses for Solomon out of Egypt, and out of all lands.
    translation: JPS 1917
    original: וּמוֹצִיאִים סוּסִים מִמִּצְרַיִם לִשְׁלֹמֹה וּמִכָּל־הָאֲרָצוֹת׃
    hebrewPlain: ומוציאים סוסים ממצרים לשלמה ומכל הארצות
    kjvRefs:
    - 2 Chronicles 9:28
    kjvOsis:
    - 2Chr.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.29
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:29
    ref: 2 Chronicles 9:29
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 29
    ordinal: 22583
    text: Now the rest of the acts of Solomon, first and last, are they not written in the words of Nathan the prophet, and in the prophecy of Ahijah the Shilonite, and in the visions of Jedo the seer concerning Jeroboam the son of Nebat?
    translation: JPS 1917
    original: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים הֲלֹא־הֵם כְּתוּבִים עַל־דִּבְרֵי נָתָן הַנָּבִיא וְעַל־נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי וּבַחֲזוֹת יעדי [יֶעְדּוֹ] הַחֹזֶה עַל־יָרָבְעָם בֶּן־נְבָט׃
    hebrewPlain: ושאר דברי שלמה הראשנים והאחרונים הלא הם כתובים על דברי נתן הנביא ועל נבואת אחיה השילוני ובחזות יעדי [יעדו] החזה על ירבעם בן נבט
    kjvRefs:
    - 2 Chronicles 9:29
    kjvOsis:
    - 2Chr.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.30
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:30
    ref: 2 Chronicles 9:30
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 30
    ordinal: 22584
    text: And Solomon reigned in Jerusalem over all Israel forty years.
    translation: JPS 1917
    original: וַיִּמְלֹךְ שְׁלֹמֹה בִירוּשָׁלִַם עַל־כָּל־יִשְׂרָאֵל אַרְבָּעִים שָׁנָה׃
    hebrewPlain: וימלך שלמה בירושלם על כל ישראל ארבעים שנה
    kjvRefs:
    - 2 Chronicles 9:30
    kjvOsis:
    - 2Chr.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.9.31
    scripture: tanakh
    name: Tanakh 2 Chronicles 9:31
    ref: 2 Chronicles 9:31
    book: 2Chr
    section: ketuvim
    chapter: 9
    verse: 31
    ordinal: 22585
    text: And Solomon slept with his fathers; they buried him in the city of David his father; and Rehoboam his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב שְׁלֹמֹה עִם־אֲבֹתָיו וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד אָבִיו וַיִּמְלֹךְ רְחַבְעָם בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב שלמה עם אבתיו ויקברהו בעיר דויד אביו וימלך רחבעם בנו תחתיו
    kjvRefs:
    - 2 Chronicles 9:31
    kjvOsis:
    - 2Chr.9.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.9
- type: TanakhVerse
  data:
    osis: 2Chr.10.1
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:1
    ref: 2 Chronicles 10:1
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 22586
    text: And Rehoboam went to Shechem; for all Israel were come to Shechem to make him king.
    translation: JPS 1917
    original: וַיֵּלֶךְ רְחַבְעָם שְׁכֶמָה כִּי שְׁכֶם בָּאוּ כָל־יִשְׂרָאֵל לְהַמְלִיךְ אֹתוֹ׃
    hebrewPlain: וילך רחבעם שכמה כי שכם באו כל ישראל להמליך אתו
    kjvRefs:
    - 2 Chronicles 10:1
    kjvOsis:
    - 2Chr.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.2
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:2
    ref: 2 Chronicles 10:2
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 22587
    text: And it came to pass, when Jeroboam the son of Nebat heard of it—for he was in Egypt, whither he had fled from the presence of king Solomon—that Jeroboam returned out of Egypt.
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ יָרָבְעָם בֶּן־נְבָט וְהוּא בְמִצְרַיִם אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ וַיָּשָׁב יָרָבְעָם מִמִּצְרָיִם׃
    hebrewPlain: ויהי כשמע ירבעם בן נבט והוא במצרים אשר ברח מפני שלמה המלך וישב ירבעם ממצרים
    kjvRefs:
    - 2 Chronicles 10:2
    kjvOsis:
    - 2Chr.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.3
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:3
    ref: 2 Chronicles 10:3
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 22588
    text: 'And they sent and called him; and Jeroboam and all Israel came, and they spoke to Rehoboam, saying:'
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ וַיִּקְרְאוּ־לוֹ וַיָּבֹא יָרָבְעָם וְכָל־יִשְׂרָאֵל וַיְדַבְּרוּ אֶל־רְחַבְעָם לֵאמֹר׃
    hebrewPlain: וישלחו ויקראו לו ויבא ירבעם וכל ישראל וידברו אל רחבעם לאמר
    kjvRefs:
    - 2 Chronicles 10:3
    kjvOsis:
    - 2Chr.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:4
    ref: 2 Chronicles 10:4
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 22589
    text: ’Thy father made our yoke grievous; now therefore make thou the grievous service of thy father, and his heavy yoke which he put upon us, lighter, and we will serve thee.’
    translation: JPS 1917
    original: אָבִיךָ הִקְשָׁה אֶת־עֻלֵּנוּ וְעַתָּה הָקֵל מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה וּמֵעֻלּוֹ הַכָּבֵד אֲשֶׁר־נָתַן עָלֵינוּ וְנַעַבְדֶךָּ׃
    hebrewPlain: אביך הקשה את עלנו ועתה הקל מעבדת אביך הקשה ומעלו הכבד אשר נתן עלינו ונעבדך
    kjvRefs:
    - 2 Chronicles 10:4
    kjvOsis:
    - 2Chr.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:5
    ref: 2 Chronicles 10:5
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 22590
    text: 'And he said unto them: ‘Come again unto me after three days.’ And the people departed.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם עוֹד שְׁלֹשֶׁת יָמִים וְשׁוּבוּ אֵלָי וַיֵּלֶךְ הָעָם׃
    hebrewPlain: ויאמר אלהם עוד שלשת ימים ושובו אלי וילך העם
    kjvRefs:
    - 2 Chronicles 10:5
    kjvOsis:
    - 2Chr.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:6
    ref: 2 Chronicles 10:6
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 22591
    text: 'And king Rehoboam took counsel with the old men, that had stood before Solomon his father while he yet lived, saying: ‘What counsel give ye me to return answer to this people?’'
    translation: JPS 1917
    original: וַיִּוָּעַץ הַמֶּלֶךְ רְחַבְעָם אֶת־הַזְּקֵנִים אֲשֶׁר־הָיוּ עֹמְדִים לִפְנֵי שְׁלֹמֹה אָבִיו בִּהְיֹתוֹ חַי לֵאמֹר אֵיךְ אַתֶּם נוֹעָצִים לְהָשִׁיב לָעָם־הַזֶּה דָּבָר׃
    hebrewPlain: ויועץ המלך רחבעם את הזקנים אשר היו עמדים לפני שלמה אביו בהיתו חי לאמר איך אתם נועצים להשיב לעם הזה דבר
    kjvRefs:
    - 2 Chronicles 10:6
    kjvOsis:
    - 2Chr.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:7
    ref: 2 Chronicles 10:7
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 22592
    text: 'And they spoke unto him, saying: ‘If thou be kind to this people, and please them, and speak good words to them, then they will be thy servants for ever.’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ אֵלָיו לֵאמֹר אִם־תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה וּרְצִיתָם וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים וְהָיוּ לְךָ עֲבָדִים כָּל־הַיָּמִים׃
    hebrewPlain: וידברו אליו לאמר אם תהיה לטוב להעם הזה ורציתם ודברת אלהם דברים טובים והיו לך עבדים כל הימים
    kjvRefs:
    - 2 Chronicles 10:7
    kjvOsis:
    - 2Chr.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.8
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:8
    ref: 2 Chronicles 10:8
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 22593
    text: But he forsook the counsel of the old men which they had given him, and took counsel with the young men that were grown up with him, that stood before him.
    translation: JPS 1917
    original: וַיַּעֲזֹב אֶת־עֲצַת הַזְּקֵנִים אֲשֶׁר יְעָצֻהוּ וַיִּוָּעַץ אֶת־הַיְלָדִים אֲשֶׁר גָּדְלוּ אִתּוֹ הָעֹמְדִים לְפָנָיו׃
    hebrewPlain: ויעזב את עצת הזקנים אשר יעצהו ויועץ את הילדים אשר גדלו אתו העמדים לפניו
    kjvRefs:
    - 2 Chronicles 10:8
    kjvOsis:
    - 2Chr.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.9
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:9
    ref: 2 Chronicles 10:9
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 22594
    text: 'And he said unto them: ‘What counsel give ye, that we may return answer to this people, who have spoken to me, saying: Make the yoke that thy father did put upon us lighter?’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם מָה אַתֶּם נוֹעָצִים וְנָשִׁיב דָּבָר אֶת־הָעָם הַזֶּה אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר הָקֵל מִן־הָעֹל אֲשֶׁר־נָתַן אָבִיךָ עָלֵינוּ׃
    hebrewPlain: ויאמר אלהם מה אתם נועצים ונשיב דבר את העם הזה אשר דברו אלי לאמר הקל מן העל אשר נתן אביך עלינו
    kjvRefs:
    - 2 Chronicles 10:9
    kjvOsis:
    - 2Chr.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.10
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:10
    ref: 2 Chronicles 10:10
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 22595
    text: 'And the young men that were grown up with him spoke unto him, saying: ‘Thus shalt thou say unto the people that spoke unto thee, saying: Thy father made our yoke heavy, but make thou it lighter unto us; thus shalt thou say unto them: My little finger is thicker than my father’s loins.'
    translation: JPS 1917
    original: וַיְדַבְּרוּ אִתּוֹ הַיְלָדִים אֲשֶׁר גָּדְלוּ אִתּוֹ לֵאמֹר כֹּה־תֹאמַר לָעָם אֲשֶׁר־דִּבְּרוּ אֵלֶיךָ לֵאמֹר אָבִיךָ הִכְבִּיד אֶת־עֻלֵּנוּ וְאַתָּה הָקֵל מֵעָלֵינוּ כֹּה תֹּאמַר אֲלֵהֶם קָטָנִּי עָבָה מִמָּתְנֵי אָבִי׃
    hebrewPlain: וידברו אתו הילדים אשר גדלו אתו לאמר כה תאמר לעם אשר דברו אליך לאמר אביך הכביד את עלנו ואתה הקל מעלינו כה תאמר אלהם קטני עבה ממתני אבי
    kjvRefs:
    - 2 Chronicles 10:10
    kjvOsis:
    - 2Chr.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.11
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:11
    ref: 2 Chronicles 10:11
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 22596
    text: And now whereas my father did lade you with a heavy yoke, I will add to your yoke; my father chastised you with whips, but I will chastise you with scorpions.’
    translation: JPS 1917
    original: וְעַתָּה אָבִי הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד וַאֲנִי אֹסִיף עַל־עֻלְּכֶם אָבִי יִסַּר אֶתְכֶם בַּשּׁוֹטִים וַאֲנִי בָּעֲקְרַבִּים׃
    hebrewPlain: ועתה אבי העמיס עליכם על כבד ואני אסיף על עלכם אבי יסר אתכם בשוטים ואני בעקרבים
    kjvRefs:
    - 2 Chronicles 10:11
    kjvOsis:
    - 2Chr.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.10
- type: TanakhVerse
  data:
    osis: 2Chr.10.12
    scripture: tanakh
    name: Tanakh 2 Chronicles 10:12
    ref: 2 Chronicles 10:12
    book: 2Chr
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 22597
    text: 'So Jeroboam and all the people came to Rehoboam the third day, as the king bade, saying: ‘Come to me again the third day.’'
    translation: JPS 1917
    original: וַיָּבֹא יָרָבְעָם וְכָל־הָעָם אֶל־רְחַבְעָם בַּיּוֹם הַשְּׁלִשִׁי כַּאֲשֶׁר דִּבֶּר הַמֶּלֶךְ לֵאמֹר שׁוּבוּ אֵלַי בַּיּוֹם הַשְּׁלִשִׁי׃
    hebrewPlain: ויבא ירבעם וכל העם אל רחבעם ביום השלשי כאשר דבר המלך לאמר שובו אלי ביום השלשי
    kjvRefs:
    - 2 Chronicles 10:12
    kjvOsis:
    - 2Chr.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
