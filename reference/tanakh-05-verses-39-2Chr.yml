  data:
    osis: 2Chr.11.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:4
    ref: 2 Chronicles 11:4
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 22608
    text: 'Thus saith the LORD: Ye shall not go up, nor fight against your brethren; return every man to his house, for this thing is of Me.’ So they hearkened unto the words of the LORD, and returned from going against Jeroboam.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה לֹא־תַעֲלוּ וְלֹא־תִלָּחֲמוּ עִם־אֲחֵיכֶם שׁוּבוּ אִישׁ לְבֵיתוֹ כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה וַיִּשְׁמְעוּ אֶת־דִּבְרֵי יְהוָה וַיָּשֻׁבוּ מִלֶּכֶת אֶל־יָרָבְעָם׃
    hebrewPlain: כה אמר יהוה לא תעלו ולא תלחמו עם אחיכם שובו איש לביתו כי מאתי נהיה הדבר הזה וישמעו את דברי יהוה וישבו מלכת אל ירבעם
    kjvRefs:
    - 2 Chronicles 11:4
    kjvOsis:
    - 2Chr.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.5
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:5
    ref: 2 Chronicles 11:5
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 22609
    text: And Rehoboam dwelt in Jerusalem, and built cities for defence in Judah.
    translation: JPS 1917
    original: וַיֵּשֶׁב רְחַבְעָם בִּירוּשָׁלִָם וַיִּבֶן עָרִים לְמָצוֹר בִּיהוּדָה׃
    hebrewPlain: וישב רחבעם בירושלם ויבן ערים למצור ביהודה
    kjvRefs:
    - 2 Chronicles 11:5
    kjvOsis:
    - 2Chr.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
- type: TanakhVerse
  data:
    osis: 2Chr.11.6
    scripture: tanakh
    name: Tanakh 2 Chronicles 11:6
    ref: 2 Chronicles 11:6
    book: 2Chr
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 22610
    text: He built even Beth-lehem, and Etam, and Tekoa,
    translation: JPS 1917
    original: וַיִּבֶן אֶת־בֵּית־לֶחֶם וְאֶת־עֵיטָם וְאֶת־תְּקוֹעַ׃
    hebrewPlain: ויבן את בית לחם ואת עיטם ואת תקוע
    kjvRefs:
    - 2 Chronicles 11:6
    kjvOsis:
    - 2Chr.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Chr.11
