  data:
    osis: 2Chr.6.4
    scripture: tanakh
    name: Tanakh 2 Chronicles 6:4
    ref: 2 Chronicles 6:4
    book: 2Chr
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 22476
    text: 'And he said: ‘Blessed be the LORD, the God of Israel, who spoke with His mouth unto David my father, and hath with His hands fulfilled it, saying:'
    translation: JPS 1917
    original: וַיֹּאמֶר בָּרוּךְ יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר דִּבֶּר בְּפִיו אֵת דָּוִיד אָבִי וּבְיָדָיו מִלֵּא לֵאמֹר׃
    hebrewPlain: ויאמר ברוך יהוה אלהי ישראל אשר דבר בפיו את דויד אבי ובידיו מלא לאמר
    kjvRefs:
    - 2 Chronicles 6:4
    kjvOsis:
    - 2Chr.6.4
