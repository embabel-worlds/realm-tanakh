    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 22389
    text: Moreover the brazen altar, that Bezalel the son of Uri, the son of Hur, had made, had been put before the tabernacle of the LORD; and Solomon and the congregation sought unto it.
    translation: JPS 1917
    original: וּמִזְבַּח הַנְּחֹשֶׁת אֲשֶׁר עָשָׂה בְּצַלְאֵל בֶּן־אוּרִי בֶן־חוּר שָׂם לִפְנֵי מִשְׁכַּן יְהוָה וַיִּדְרְשֵׁהוּ שְׁלֹמֹה וְהַקָּהָל׃
    hebrewPlain: ומזבח הנחשת אשר עשה בצלאל בן אורי בן חור שם לפני משכן יהוה וידרשהו שלמה והקהל
