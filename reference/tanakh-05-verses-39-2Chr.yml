  data:
    osis: 2Chr.1.7
    scripture: tanakh
    name: Tanakh 2 Chronicles 1:7
    ref: 2 Chronicles 1:7
    book: 2Chr
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 22391
    text: 'In that night did God, appear unto Solomon, and said unto him: ‘Ask what I shall give thee.’'
    translation: JPS 1917
    original: בַּלַּיְלָה הַהוּא נִרְאָה אֱלֹהִים לִשְׁלֹמֹה וַיֹּאמֶר לוֹ שְׁאַל מָה אֶתֶּן־לָךְ׃
    hebrewPlain: בלילה ההוא נראה אלהים לשלמה ויאמר לו שאל מה אתן לך
    kjvRefs:
    - 2 Chronicles 1:7
