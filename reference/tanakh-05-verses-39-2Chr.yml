  data:
    osis: 2Chr.4.16
    scripture: tanakh
    name: Tanakh 2 Chronicles 4:16
    ref: 2 Chronicles 4:16
    book: 2Chr
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 22452
    text: The pots also, and the shovels, and the flesh-hooks, and all the vessels thereof, did Huram his master craftsman make for king Solomon for the house of the LORD of bright brass.
    translation: JPS 1917
    original: וְאֶת־הַסִּירוֹת וְאֶת־הַיָּעִים וְאֶת־הַמִּזְלָגוֹת וְאֶת־כָּל־כְּלֵיהֶם עָשָׂה חוּרָם אָבִיו לַמֶּלֶךְ שְׁלֹמֹה לְבֵית יְהוָה נְחֹשֶׁת מָרוּק׃
    hebrewPlain: ואת הסירות ואת היעים ואת המזלגות ואת כל כליהם עשה חורם אביו למלך שלמה לבית יהוה נחשת מרוק
    kjvRefs:
    - 2 Chronicles 4:16
    kjvOsis:
    - 2Chr.4.16
  relations:
  - predicate: IN
    to:
