    ref: Nahum 1:2
    book: Nah
    section: neviim
    chapter: 1
    verse: 2
    ordinal: 14684
    text: The LORD is a jealous and avenging God, The LORD avengeth and is full of wrath; The LORD taketh vengeance on His adversaries, And He reserveth wrath for His enemies.
    translation: JPS 1917
    original: אֵל קַנּוֹא וְנֹקֵם יְהוָה נֹקֵם יְהוָה וּבַעַל חֵמָה נֹקֵם יְהוָה לְצָרָיו וְנוֹטֵר הוּא לְאֹיְבָיו׃
    hebrewPlain: אל קנוא ונקם יהוה נקם יהוה ובעל חמה נקם יהוה לצריו ונוטר הוא לאיביו
    kjvRefs:
    - Nahum 1:2
    kjvOsis:
    - Nah.1.2
