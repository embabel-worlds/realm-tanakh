- type: TanakhVerse
  data:
    osis: Nah.3.12
    scripture: tanakh
    name: Tanakh Nahum 3:12
    ref: Nahum 3:12
    book: Nah
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 14722
    text: 'All thy fortresses shall be like fig-trees with the first-ripe figs: If they be shaken, they fall into the mouth of the eater.'
    translation: JPS 1917
    original: כָּל־מִבְצָרַיִךְ תְּאֵנִים עִם־בִּכּוּרִים אִם־יִנּוֹעוּ וְנָפְלוּ עַל־פִּי אוֹכֵל׃
    hebrewPlain: כל מבצריך תאנים עם בכורים אם ינועו ונפלו על פי אוכל
    kjvRefs:
    - Nahum 3:12
    kjvOsis:
    - Nah.3.12
  relations:
  - predicate: IN
    to:
