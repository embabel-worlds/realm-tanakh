- type: TanakhVerse
  data:
    osis: Nah.1.3
    scripture: tanakh
    name: Tanakh Nahum 1:3
    ref: Nahum 1:3
    book: Nah
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14685
    text: The LORD is long-suffering, and great in power, And will by no means clear the guilty; The LORD, in the whirlwind and in the storm is His way, And the clouds are the dust of His feet.
    translation: JPS 1917
    original: יְהֹוָה אֶרֶךְ אַפַּיִם וגדול־[וּגְדָל־] כֹּחַ וְנַקֵּה לֹא יְנַקֶּה יְהוָה בְּסוּפָה וּבִשְׂעָרָה דַּרְכּוֹ וְעָנָן אֲבַק רַגְלָיו׃
    hebrewPlain: יהוה ארך אפים וגדול [וגדל ] כח ונקה לא ינקה יהוה בסופה ובשערה דרכו וענן אבק רגליו
    kjvRefs:
    - Nahum 1:3
    kjvOsis:
    - Nah.1.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.4
    scripture: tanakh
    name: Tanakh Nahum 1:4
    ref: Nahum 1:4
    book: Nah
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14686
    text: He rebuketh the sea, and maketh it dry, And drieth up all the rivers; Bashan languisheth, and Carmel, And the flower of Lebanon languisheth.
    translation: JPS 1917
    original: גּוֹעֵר בַּיָּם וַיַּבְּשֵׁהוּ וְכָל־הַנְּהָרוֹת הֶחֱרִיב אֻמְלַל בָּשָׁן וְכַרְמֶל וּפֶרַח לְבָנוֹן אֻמְלָל׃
    hebrewPlain: גוער בים ויבשהו וכל הנהרות החריב אמלל בשן וכרמל ופרח לבנון אמלל
    kjvRefs:
    - Nahum 1:4
    kjvOsis:
    - Nah.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.5
    scripture: tanakh
    name: Tanakh Nahum 1:5
    ref: Nahum 1:5
    book: Nah
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14687
    text: The mountains quake at Him, And the hills melt; And the earth is upheaved at His presence, Yea, the world, and all that dwell therein.
    translation: JPS 1917
    original: הָרִים רָעֲשׁוּ מִמֶּנּוּ וְהַגְּבָעוֹת הִתְמֹגָגוּ וַתִּשָּׂא הָאָרֶץ מִפָּנָיו וְתֵבֵל וְכָל־יֹשְׁבֵי בָהּ׃
    hebrewPlain: הרים רעשו ממנו והגבעות התמגגו ותשא הארץ מפניו ותבל וכל ישבי בה
    kjvRefs:
    - Nahum 1:5
    kjvOsis:
    - Nah.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.6
    scripture: tanakh
    name: Tanakh Nahum 1:6
    ref: Nahum 1:6
    book: Nah
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14688
    text: Who can stand before His indignation? And who can abide in the fierceness of His anger? His fury is poured out like fire, And the rocks are broken asunder before Him.
    translation: JPS 1917
    original: לִפְנֵי זַעְמוֹ מִי יַעֲמוֹד וּמִי יָקוּם בַּחֲרוֹן אַפּוֹ חֲמָתוֹ נִתְּכָה כָאֵשׁ וְהַצֻּרִים נִתְּצוּ מִמֶּנּוּ׃
    hebrewPlain: לפני זעמו מי יעמוד ומי יקום בחרון אפו חמתו נתכה כאש והצרים נתצו ממנו
    kjvRefs:
    - Nahum 1:6
    kjvOsis:
    - Nah.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.7
    scripture: tanakh
    name: Tanakh Nahum 1:7
    ref: Nahum 1:7
    book: Nah
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14689
    text: The LORD is good, A stronghold in the day of trouble; And He knoweth them that take refuge in Him.
    translation: JPS 1917
    original: טוֹב יְהוָה לְמָעוֹז בְּיוֹם צָרָה וְיֹדֵעַ חֹסֵי בוֹ׃
    hebrewPlain: טוב יהוה למעוז ביום צרה וידע חסי בו
    kjvRefs:
    - Nahum 1:7
    kjvOsis:
    - Nah.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.8
    scripture: tanakh
    name: Tanakh Nahum 1:8
    ref: Nahum 1:8
    book: Nah
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14690
    text: But with an overrunning flood He will make a full end of the place thereof, And darkness shall pursue His enemies.
    translation: JPS 1917
    original: וּבְשֶׁטֶף עֹבֵר כָּלָה יַעֲשֶׂה מְקוֹמָהּ וְאֹיְבָיו יְרַדֶּף־חֹשֶׁךְ׃
    hebrewPlain: ובשטף עבר כלה יעשה מקומה ואיביו ירדף חשך
    kjvRefs:
    - Nahum 1:8
    kjvOsis:
    - Nah.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.9
    scripture: tanakh
    name: Tanakh Nahum 1:9
    ref: Nahum 1:9
    book: Nah
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14691
    text: What do ye devise against the LORD? He will make a full end; Trouble shall not rise up the second time. .
    translation: JPS 1917
    original: מַה־תְּחַשְּׁבוּן אֶל־יְהוָה כָּלָה הוּא עֹשֶׂה לֹא־תָקוּם פַּעֲמַיִם צָרָה׃
    hebrewPlain: מה תחשבון אל יהוה כלה הוא עשה לא תקום פעמים צרה
    kjvRefs:
    - Nahum 1:9
    kjvOsis:
    - Nah.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.10
    scripture: tanakh
    name: Tanakh Nahum 1:10
    ref: Nahum 1:10
    book: Nah
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 14692
    text: For though they be like tangled thorns, And be drunken according to their drink, They shall be devoured as stubble fully dry.
    translation: JPS 1917
    original: כִּי עַד־סִירִים סְבֻכִים וּכְסָבְאָם סְבוּאִים אֻכְּלוּ כְּקַשׁ יָבֵשׁ מָלֵא׃
    hebrewPlain: כי עד סירים סבכים וכסבאם סבואים אכלו כקש יבש מלא
    kjvRefs:
    - Nahum 1:10
    kjvOsis:
    - Nah.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.11
    scripture: tanakh
    name: Tanakh Nahum 1:11
    ref: Nahum 1:11
    book: Nah
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14693
    text: Out of thee came he forth, That deviseth evil against the LORD, That counselleth wickedness.
    translation: JPS 1917
    original: מִמֵּךְ יָצָא חֹשֵׁב עַל־יְהוָה רָעָה יֹעֵץ בְּלִיָּעַל׃
    hebrewPlain: ממך יצא חשב על יהוה רעה יעץ בליעל
    kjvRefs:
    - Nahum 1:11
    kjvOsis:
    - Nah.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.12
    scripture: tanakh
    name: Tanakh Nahum 1:12
    ref: Nahum 1:12
    book: Nah
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14694
    text: 'Thus saith the LORD: Though they be in full strength, and likewise many, Even so shall they be cut down, and he shall pass away; And though I have afflicted thee, I will afflict thee no more.'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה אִם־שְׁלֵמִים וְכֵן רַבִּים וְכֵן נָגֹזּוּ וְעָבָר וְעִנִּתִךְ לֹא אֲעַנֵּךְ עוֹד׃
    hebrewPlain: כה אמר יהוה אם שלמים וכן רבים וכן נגזו ועבר וענתך לא אענך עוד
    kjvRefs:
    - Nahum 1:12
    kjvOsis:
    - Nah.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.13
    scripture: tanakh
    name: Tanakh Nahum 1:13
    ref: Nahum 1:13
    book: Nah
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14695
    text: And now will I break his yoke from off thee, And will burst thy bonds in sunder.
    translation: JPS 1917
    original: וְעַתָּה אֶשְׁבֹּר מֹטֵהוּ מֵעָלָיִךְ וּמוֹסְרֹתַיִךְ אֲנַתֵּק׃
    hebrewPlain: ועתה אשבר מטהו מעליך ומוסרתיך אנתק
    kjvRefs:
    - Nahum 1:13
    kjvOsis:
    - Nah.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.1.14
    scripture: tanakh
    name: Tanakh Nahum 1:14
    ref: Nahum 1:14
    book: Nah
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14696
    text: And the LORD hath given commandment concerning thee, That no more of thy name be sown; Out of the house of thy god will I cut off The graven image and the molten image; I will make thy grave; for thou art become worthless.
    translation: JPS 1917
    original: וְצִוָּה עָלֶיךָ יְהוָה לֹא־יִזָּרַע מִשִּׁמְךָ עוֹד מִבֵּית אֱלֹהֶיךָ אַכְרִית פֶּסֶל וּמַסֵּכָה אָשִׂים קִבְרֶךָ כִּי קַלּוֹתָ׃
    hebrewPlain: וצוה עליך יהוה לא יזרע משמך עוד מבית אלהיך אכרית פסל ומסכה אשים קברך כי קלות
    kjvRefs:
    - Nahum 1:14
    kjvOsis:
    - Nah.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.1
- type: TanakhVerse
  data:
    osis: Nah.2.1
    scripture: tanakh
    name: Tanakh Nahum 2:1
    ref: Nahum 2:1
    book: Nah
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14697
    text: Behold upon the mountains the feet of him That bringeth good tidings, that announceth peace! Keep thy feasts, O Judah, Perform thy vows; For the wicked one shall no more pass through thee; He is utterly cut off.
    translation: JPS 1917
    original: הִנֵּה עַל־הֶהָרִים רַגְלֵי מְבַשֵּׂר מַשְׁמִיעַ שָׁלוֹם חָגִּי יְהוּדָה חַגַּיִךְ שַׁלְּמִי נְדָרָיִךְ כִּי לֹא יוֹסִיף עוֹד לעבור־[לַעֲבָר־] בָּךְ בְּלִיַּעַל כֻּלֹּה נִכְרָת׃
    hebrewPlain: הנה על ההרים רגלי מבשר משמיע שלום חגי יהודה חגיך שלמי נדריך כי לא יוסיף עוד לעבור [לעבר ] בך בליעל כלה נכרת
    kjvRefs:
    - Nahum 1:15
    kjvOsis:
    - Nah.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.2
    scripture: tanakh
    name: Tanakh Nahum 2:2
    ref: Nahum 2:2
    book: Nah
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14698
    text: A maul is come up before thy face; Guard the defences, Watch the way, make thy loins strong, Fortify thy power mightily!—
    translation: JPS 1917
    original: עָלָה מֵפִיץ עַל־פָּנַיִךְ נָצוֹר מְצֻרָה צַפֵּה־דֶרֶךְ חַזֵּק מָתְנַיִם אַמֵּץ כֹּחַ מְאֹד׃
    hebrewPlain: עלה מפיץ על פניך נצור מצרה צפה דרך חזק מתנים אמץ כח מאד
    kjvRefs:
    - Nahum 2:1
    kjvOsis:
    - Nah.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.3
    scripture: tanakh
    name: Tanakh Nahum 2:3
    ref: Nahum 2:3
    book: Nah
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14699
    text: For the LORD restoreth the pride of Jacob, As the pride of Israel; For the emptiers have emptied them out, And marred their vine-branches.—
    translation: JPS 1917
    original: כִּי שָׁב יְהוָה אֶת־גְּאוֹן יַעֲקֹב כִּגְאוֹן יִשְׂרָאֵל כִּי בְקָקוּם בֹּקְקִים וּזְמֹרֵיהֶם שִׁחֵתוּ׃
    hebrewPlain: כי שב יהוה את גאון יעקב כגאון ישראל כי בקקום בקקים וזמריהם שחתו
    kjvRefs:
    - Nahum 2:2
    kjvOsis:
    - Nah.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.4
    scripture: tanakh
    name: Tanakh Nahum 2:4
    ref: Nahum 2:4
    book: Nah
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14700
    text: The shield of his mighty men is made red, The valiant men are in scarlet; The chariots are fire of steel in the day of his preparation, And the cypress spears are made to quiver.
    translation: JPS 1917
    original: מָגֵן גִּבֹּרֵיהוּ מְאָדָּם אַנְשֵׁי־חַיִל מְתֻלָּעִים בְּאֵשׁ־פְּלָדוֹת הָרֶכֶב בְּיוֹם הֲכִינוֹ וְהַבְּרֹשִׁים הָרְעָלוּ׃
    hebrewPlain: מגן גבריהו מאדם אנשי חיל מתלעים באש פלדות הרכב ביום הכינו והברשים הרעלו
    kjvRefs:
    - Nahum 2:3
    kjvOsis:
    - Nah.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.5
    scripture: tanakh
    name: Tanakh Nahum 2:5
    ref: Nahum 2:5
    book: Nah
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14701
    text: The chariots rush madly in the streets, They jostle one against another in the broad places; The appearance of them is like torches, They run to and fro like the lightnings.
    translation: JPS 1917
    original: בַּחוּצוֹת יִתְהוֹלְלוּ הָרֶכֶב יִשְׁתַּקְשְׁקוּן בָּרְחֹבוֹת מַרְאֵיהֶן כַּלַּפִּידִם כַּבְּרָקִים יְרוֹצֵצוּ׃
    hebrewPlain: בחוצות יתהוללו הרכב ישתקשקון ברחבות מראיהן כלפידם כברקים ירוצצו
    kjvRefs:
    - Nahum 2:4
    kjvOsis:
    - Nah.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.6
    scripture: tanakh
    name: Tanakh Nahum 2:6
    ref: Nahum 2:6
    book: Nah
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14702
    text: He bethinketh himself of his worthies; They stumble in their march; They make haste to the wall thereof, And the mantelet is prepared.
    translation: JPS 1917
    original: יִזְכֹּר אַדִּירָיו יִכָּשְׁלוּ בהלכותם [בַּהֲלִיכָתָם] יְמַהֲרוּ חוֹמָתָהּ וְהֻכַן הַסֹּכֵךְ׃
    hebrewPlain: יזכר אדיריו יכשלו בהלכותם [בהליכתם] ימהרו חומתה והכן הסכך
    kjvRefs:
    - Nahum 2:5
    kjvOsis:
    - Nah.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.7
    scripture: tanakh
    name: Tanakh Nahum 2:7
    ref: Nahum 2:7
    book: Nah
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14703
    text: The gates of the rivers are opened, And the palace is dissolved.
    translation: JPS 1917
    original: שַׁעֲרֵי הַנְּהָרוֹת נִפְתָּחוּ וְהַהֵיכָל נָמוֹג׃
    hebrewPlain: שערי הנהרות נפתחו וההיכל נמוג
    kjvRefs:
    - Nahum 2:6
    kjvOsis:
    - Nah.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.8
    scripture: tanakh
    name: Tanakh Nahum 2:8
    ref: Nahum 2:8
    book: Nah
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14704
    text: And the queen is uncovered, she is carried away, And her handmaids moan as with the voice of doves, Tabering upon their breasts.
    translation: JPS 1917
    original: וְהֻצַּב גֻּלְּתָה הֹעֲלָתָה וְאַמְהֹתֶיהָ מְנַהֲגוֹת כְּקוֹל יוֹנִים מְתֹפְפֹת עַל־לִבְבֵהֶן׃
    hebrewPlain: והצב גלתה העלתה ואמהתיה מנהגות כקול יונים מתפפת על לבבהן
    kjvRefs:
    - Nahum 2:7
    kjvOsis:
    - Nah.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.9
    scripture: tanakh
    name: Tanakh Nahum 2:9
    ref: Nahum 2:9
    book: Nah
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14705
    text: But Nineveh hath been from of old like a pool of water; Yet they flee away; ‘Stand, stand’; But none looketh back.
    translation: JPS 1917
    original: וְנִינְוֵה כִבְרֵכַת־מַיִם מִימֵי הִיא וְהֵמָּה נָסִים עִמְדוּ עֲמֹדוּ וְאֵין מַפְנֶה׃
    hebrewPlain: ונינוה כברכת מים מימי היא והמה נסים עמדו עמדו ואין מפנה
    kjvRefs:
    - Nahum 2:8
    kjvOsis:
    - Nah.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.10
    scripture: tanakh
    name: Tanakh Nahum 2:10
    ref: Nahum 2:10
    book: Nah
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14706
    text: Take ye the spoil of silver, take the spoil of gold; For there is no end of the store, Rich with all precious vessels.
    translation: JPS 1917
    original: בֹּזּוּ כֶסֶף בֹּזּוּ זָהָב וְאֵין קֵצֶה לַתְּכוּנָה כָּבֹד מִכֹּל כְּלִי חֶמְדָּה׃
    hebrewPlain: בזו כסף בזו זהב ואין קצה לתכונה כבד מכל כלי חמדה
    kjvRefs:
    - Nahum 2:9
    kjvOsis:
    - Nah.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.11
    scripture: tanakh
    name: Tanakh Nahum 2:11
    ref: Nahum 2:11
    book: Nah
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14707
    text: She is empty, and void, and waste; And the heart melteth, and the knees smite together, And convulsion is in all loins, And the faces of them all have gathered blackness.
    translation: JPS 1917
    original: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה וְלֵב נָמֵס וּפִק בִּרְכַּיִם וְחַלְחָלָה בְּכָל־מָתְנַיִם וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר׃
    hebrewPlain: בוקה ומבוקה ומבלקה ולב נמס ופק ברכים וחלחלה בכל מתנים ופני כלם קבצו פארור
    kjvRefs:
    - Nahum 2:10
    kjvOsis:
    - Nah.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.12
    scripture: tanakh
    name: Tanakh Nahum 2:12
    ref: Nahum 2:12
    book: Nah
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14708
    text: Where is the den of the lions, Which was the feeding-place of the young lions, Where the lion and the lioness walked, and the lion’s whelp, And none made them afraid?
    translation: JPS 1917
    original: אַיֵּה מְעוֹן אֲרָיוֹת וּמִרְעֶה הוּא לַכְּפִרִים אֲשֶׁר הָלַךְ אַרְיֵה לָבִיא שָׁם גּוּר אַרְיֵה וְאֵין מַחֲרִיד׃
    hebrewPlain: איה מעון אריות ומרעה הוא לכפרים אשר הלך אריה לביא שם גור אריה ואין מחריד
    kjvRefs:
    - Nahum 2:11
    kjvOsis:
    - Nah.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.13
    scripture: tanakh
    name: Tanakh Nahum 2:13
    ref: Nahum 2:13
    book: Nah
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14709
    text: The lion did tear in pieces enough for his whelps, And strangled for his lionesses, And filled his caves with prey, And his dens with ravin.
    translation: JPS 1917
    original: אַרְיֵה טֹרֵף בְּדֵי גֹרוֹתָיו וּמְחַנֵּק לְלִבְאֹתָיו וַיְמַלֵּא־טֶרֶף חֹרָיו וּמְעֹנֹתָיו טְרֵפָה׃
    hebrewPlain: אריה טרף בדי גרותיו ומחנק ללבאתיו וימלא טרף חריו ומענתיו טרפה
    kjvRefs:
    - Nahum 2:12
    kjvOsis:
    - Nah.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.2.14
    scripture: tanakh
    name: Tanakh Nahum 2:14
    ref: Nahum 2:14
    book: Nah
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14710
    text: Behold, I am against thee, saith the LORD of hosts, And I will burn her chariots in the smoke, And the sword shall devour thy young lions; And I will cut off thy prey from the earth, And the voice of thy messengers shall no more be heard.
    translation: JPS 1917
    original: הִנְנִי אֵלַיִךְ נְאֻם יְהוָה צְבָאוֹת וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ וּכְפִירַיִךְ תֹּאכַל חָרֶב וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ וְלֹא־יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה׃
    hebrewPlain: הנני אליך נאם יהוה צבאות והבערתי בעשן רכבה וכפיריך תאכל חרב והכרתי מארץ טרפך ולא ישמע עוד קול מלאככה
    kjvRefs:
    - Nahum 2:13
    kjvOsis:
    - Nah.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.2
- type: TanakhVerse
  data:
    osis: Nah.3.1
    scripture: tanakh
    name: Tanakh Nahum 3:1
    ref: Nahum 3:1
    book: Nah
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14711
    text: Woe to the bloody city! It is all full of lies and rapine; The prey departeth not.
    translation: JPS 1917
    original: הוֹי עִיר דָּמִים כֻּלָּהּ כַּחַשׁ פֶּרֶק מְלֵאָה לֹא יָמִישׁ טָרֶף׃
    hebrewPlain: הוי עיר דמים כלה כחש פרק מלאה לא ימיש טרף
    kjvRefs:
    - Nahum 3:1
    kjvOsis:
    - Nah.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.2
    scripture: tanakh
    name: Tanakh Nahum 3:2
    ref: Nahum 3:2
    book: Nah
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14712
    text: Hark! the whip, and hark! the rattling of the wheels; And prancing horses, and bounding chariots;
    translation: JPS 1917
    original: קוֹל שׁוֹט וְקוֹל רַעַשׁ אוֹפָן וְסוּס דֹּהֵר וּמֶרְכָּבָה מְרַקֵּדָה׃
    hebrewPlain: קול שוט וקול רעש אופן וסוס דהר ומרכבה מרקדה
    kjvRefs:
    - Nahum 3:2
    kjvOsis:
    - Nah.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.3
    scripture: tanakh
    name: Tanakh Nahum 3:3
    ref: Nahum 3:3
    book: Nah
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14713
    text: The horseman charging, And the flashing sword, and the glittering spear; And a multitude of slain, and a heap of carcases; And there is no end of the corpses, and they stumble upon their corpses;
    translation: JPS 1917
    original: פָּרָשׁ מַעֲלֶה וְלַהַב חֶרֶב וּבְרַק חֲנִית וְרֹב חָלָל וְכֹבֶד פָּגֶר וְאֵין קֵצֶה לַגְּוִיָּה יכשלו [וְכָשְׁלוּ] בִּגְוִיָּתָם׃
    hebrewPlain: פרש מעלה ולהב חרב וברק חנית ורב חלל וכבד פגר ואין קצה לגויה יכשלו [וכשלו] בגויתם
    kjvRefs:
    - Nahum 3:3
    kjvOsis:
    - Nah.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.4
    scripture: tanakh
    name: Tanakh Nahum 3:4
    ref: Nahum 3:4
    book: Nah
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14714
    text: Because of the multitude of the harlotries of the well-favoured harlot, The mistress of witchcrafts, That selleth nations through her harlotries, And families through her witchcrafts.
    translation: JPS 1917
    original: מֵרֹב זְנוּנֵי זוֹנָה טוֹבַת חֵן בַּעֲלַת כְּשָׁפִים הַמֹּכֶרֶת גּוֹיִם בִּזְנוּנֶיהָ וּמִשְׁפָּחוֹת בִּכְשָׁפֶיהָ׃
    hebrewPlain: מרב זנוני זונה טובת חן בעלת כשפים המכרת גוים בזנוניה ומשפחות בכשפיה
    kjvRefs:
    - Nahum 3:4
    kjvOsis:
    - Nah.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.5
    scripture: tanakh
    name: Tanakh Nahum 3:5
    ref: Nahum 3:5
    book: Nah
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14715
    text: Behold, I am against thee, saith the LORD of hosts, And I will uncover thy skirts upon thy face, And I will shew the nations thy nakedness, And the kingdoms thy shame.
    translation: JPS 1917
    original: הִנְנִי אֵלַיִךְ נְאֻם יְהוָה צְבָאוֹת וְגִלֵּיתִי שׁוּלַיִךְ עַל־פָּנָיִךְ וְהַרְאֵיתִי גוֹיִם מַעְרֵךְ וּמַמְלָכוֹת קְלוֹנֵךְ׃
    hebrewPlain: הנני אליך נאם יהוה צבאות וגליתי שוליך על פניך והראיתי גוים מערך וממלכות קלונך
    kjvRefs:
    - Nahum 3:5
    kjvOsis:
    - Nah.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.6
    scripture: tanakh
    name: Tanakh Nahum 3:6
    ref: Nahum 3:6
    book: Nah
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14716
    text: And I will cast detestable things upon thee, and make thee vile, And will make thee as dung.
    translation: JPS 1917
    original: וְהִשְׁלַכְתִּי עָלַיִךְ שִׁקֻּצִים וְנִבַּלְתִּיךְ וְשַׂמְתִּיךְ כְּרֹאִי׃
    hebrewPlain: והשלכתי עליך שקצים ונבלתיך ושמתיך כראי
    kjvRefs:
    - Nahum 3:6
    kjvOsis:
    - Nah.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.7
    scripture: tanakh
    name: Tanakh Nahum 3:7
    ref: Nahum 3:7
    book: Nah
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14717
    text: 'And it shall come to pass, that all they that look upon thee Shall flee from thee, And say: ‘Nineveh is laid waste; Who will bemoan her? Whence shall I seek comforters for thee?’'
    translation: JPS 1917
    original: וְהָיָה כָל־רֹאַיִךְ יִדּוֹד מִמֵּךְ וְאָמַר שָׁדְּדָה נִינְוֵה מִי יָנוּד לָהּ מֵאַיִן אֲבַקֵּשׁ מְנַחֲמִים לָךְ׃
    hebrewPlain: והיה כל ראיך ידוד ממך ואמר שדדה נינוה מי ינוד לה מאין אבקש מנחמים לך
    kjvRefs:
    - Nahum 3:7
    kjvOsis:
    - Nah.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.8
    scripture: tanakh
    name: Tanakh Nahum 3:8
    ref: Nahum 3:8
    book: Nah
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14718
    text: Art thou better than No-amon, That was situate among the rivers, That had the waters round about her; Whose rampart was the sea, and of the sea her wall?
    translation: JPS 1917
    original: הֲתֵיטְבִי מִנֹּא אָמוֹן הַיֹּשְׁבָה בַּיְאֹרִים מַיִם סָבִיב לָהּ אֲשֶׁר־חֵיל יָם מִיָּם חוֹמָתָהּ׃
    hebrewPlain: התיטבי מנא אמון הישבה ביארים מים סביב לה אשר חיל ים מים חומתה
    kjvRefs:
    - Nahum 3:8
    kjvOsis:
    - Nah.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.9
    scripture: tanakh
    name: Tanakh Nahum 3:9
    ref: Nahum 3:9
    book: Nah
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14719
    text: Ethiopia and Egypt were thy strength, and it was infinite; Put and Lubim were thy helpers.
    translation: JPS 1917
    original: כּוּשׁ עָצְמָה וּמִצְרַיִם וְאֵין קֵצֶה פּוּט וְלוּבִים הָיוּ בְּעֶזְרָתֵךְ׃
    hebrewPlain: כוש עצמה ומצרים ואין קצה פוט ולובים היו בעזרתך
    kjvRefs:
    - Nahum 3:9
    kjvOsis:
    - Nah.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.10
    scripture: tanakh
    name: Tanakh Nahum 3:10
    ref: Nahum 3:10
    book: Nah
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14720
    text: Yet was she carried away, She went into captivity; Her young children also were dashed in pieces At the head of all the streets; And they cast lots for her honourable men, And all her great men were bound in chains.
    translation: JPS 1917
    original: גַּם־הִיא לַגֹּלָה הָלְכָה בַשֶּׁבִי גַּם עֹלָלֶיהָ יְרֻטְּשׁוּ בְּרֹאשׁ כָּל־חוּצוֹת וְעַל־נִכְבַּדֶּיהָ יַדּוּ גוֹרָל וְכָל־גְּדוֹלֶיהָ רֻתְּקוּ בַזִּקִּים׃
    hebrewPlain: גם היא לגלה הלכה בשבי גם עלליה ירטשו בראש כל חוצות ועל נכבדיה ידו גורל וכל גדוליה רתקו בזקים
    kjvRefs:
    - Nahum 3:10
    kjvOsis:
    - Nah.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.11
    scripture: tanakh
    name: Tanakh Nahum 3:11
    ref: Nahum 3:11
    book: Nah
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 14721
    text: Thou also shalt be drunken, Thou shalt swoon; Thou also shalt seek a refuge Because of the enemy.
    translation: JPS 1917
    original: גַּם־אַתְּ תִּשְׁכְּרִי תְּהִי נַעֲלָמָה גַּם־אַתְּ תְּבַקְשִׁי מָעוֹז מֵאוֹיֵב׃
    hebrewPlain: גם את תשכרי תהי נעלמה גם את תבקשי מעוז מאויב
