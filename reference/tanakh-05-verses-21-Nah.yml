- type: TanakhVerse
  data:
    osis: Nah.3.13
    scripture: tanakh
    name: Tanakh Nahum 3:13
    ref: Nahum 3:13
    book: Nah
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 14723
    text: Behold, thy people in the midst of thee are women; The gates of thy land are set wide open unto thine enemies; The fire hath devoured thy bars.
    translation: JPS 1917
    original: הִנֵּה עַמֵּךְ נָשִׁים בְּקִרְבֵּךְ לְאֹיְבַיִךְ פָּתוֹחַ נִפְתְּחוּ שַׁעֲרֵי אַרְצֵךְ אָכְלָה אֵשׁ בְּרִיחָיִך׃
    hebrewPlain: הנה עמך נשים בקרבך לאיביך פתוח נפתחו שערי ארצך אכלה אש בריחיך
    kjvRefs:
    - Nahum 3:13
    kjvOsis:
    - Nah.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.14
    scripture: tanakh
    name: Tanakh Nahum 3:14
    ref: Nahum 3:14
    book: Nah
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 14724
    text: Draw thee water for the siege, Strengthen thy fortresses; Go into the clay, and tread the mortar, Lay hold of the brickmould.
    translation: JPS 1917
    original: מֵי מָצוֹר שַׁאֲבִי־לָךְ חַזְּקִי מִבְצָרָיִךְ בֹּאִי בַטִּיט וְרִמְסִי בַחֹמֶר הַחֲזִיקִי מַלְבֵּן׃
    hebrewPlain: מי מצור שאבי לך חזקי מבצריך באי בטיט ורמסי בחמר החזיקי מלבן
    kjvRefs:
    - Nahum 3:14
    kjvOsis:
    - Nah.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.15
    scripture: tanakh
    name: Tanakh Nahum 3:15
    ref: Nahum 3:15
    book: Nah
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 14725
    text: There shall the fire devour thee; The sword shall cut thee off, It shall devour thee like the canker-worm; Make thyself many as the canker-worm, Make thyself many as the locusts.
    translation: JPS 1917
    original: שָׁם תֹּאכְלֵךְ אֵשׁ תַּכְרִיתֵךְ חֶרֶב תֹּאכְלֵךְ כַּיָּלֶק הִתְכַּבֵּד כַּיֶּלֶק הִתְכַּבְּדִי כָּאַרְבֶּה׃
    hebrewPlain: שם תאכלך אש תכריתך חרב תאכלך כילק התכבד כילק התכבדי כארבה
    kjvRefs:
    - Nahum 3:15
    kjvOsis:
    - Nah.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.16
    scripture: tanakh
    name: Tanakh Nahum 3:16
    ref: Nahum 3:16
    book: Nah
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 14726
    text: Thou hast multiplied thy merchants Above the stars of heaven; The canker-worm spreadeth itself, and flieth away.
    translation: JPS 1917
    original: הִרְבֵּית רֹכְלַיִךְ מִכּוֹכְבֵי הַשָּׁמָיִם יֶלֶק פָּשַׁט וַיָּעֹף׃
    hebrewPlain: הרבית רכליך מכוכבי השמים ילק פשט ויעף
    kjvRefs:
    - Nahum 3:16
    kjvOsis:
    - Nah.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.17
    scripture: tanakh
    name: Tanakh Nahum 3:17
    ref: Nahum 3:17
    book: Nah
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 14727
    text: Thy crowned are as the locusts, And thy marshals as the swarms of grasshoppers, Which camp in the walls in the cold day, But when the sun ariseth they flee away, And their place is not known where they are.
    translation: JPS 1917
    original: מִנְּזָרַיִךְ כָּאַרְבֶּה וְטַפְסְרַיִךְ כְּגוֹב גֹּבָי הַחוֹנִים בַּגְּדֵרוֹת בְּיוֹם קָרָה שֶׁמֶשׁ זָרְחָה וְנוֹדַד וְלֹא־נוֹדַע מְקוֹמוֹ אַיָּם׃
    hebrewPlain: מנזריך כארבה וטפסריך כגוב גבי החונים בגדרות ביום קרה שמש זרחה ונודד ולא נודע מקומו אים
    kjvRefs:
    - Nahum 3:17
    kjvOsis:
    - Nah.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.18
    scripture: tanakh
    name: Tanakh Nahum 3:18
    ref: Nahum 3:18
    book: Nah
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 14728
    text: Thy shepherds slumber, O king of Assyria, Thy worthies are at rest; Thy people are scattered upon the mountains, And there is none to gather them.
    translation: JPS 1917
    original: נָמוּ רֹעֶיךָ מֶלֶךְ אַשּׁוּר יִשְׁכְּנוּ אַדִּירֶיךָ נָפֹשׁוּ עַמְּךָ עַל־הֶהָרִים וְאֵין מְקַבֵּץ׃
    hebrewPlain: נמו רעיך מלך אשור ישכנו אדיריך נפשו עמך על ההרים ואין מקבץ
    kjvRefs:
    - Nahum 3:18
    kjvOsis:
    - Nah.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Nah.3
- type: TanakhVerse
  data:
    osis: Nah.3.19
    scripture: tanakh
    name: Tanakh Nahum 3:19
    ref: Nahum 3:19
    book: Nah
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 14729
    text: There is no assuaging of thy hurt, Thy wound is grievous; All that hear the report of thee Clap the hands over thee; For upon whom hath not thy wickedness passed continually?
    translation: JPS 1917
    original: אֵין־כֵּהָה לְשִׁבְרֶךָ נַחְלָה מַכָּתֶךָ כֹּל שֹׁמְעֵי שִׁמְעֲךָ תָּקְעוּ כַף עָלֶיךָ כִּי עַל־מִי לֹא־עָבְרָה רָעָתְךָ תָּמִיד׃
    hebrewPlain: אין כהה לשברך נחלה מכתך כל שמעי שמעך תקעו כף עליך כי על מי לא עברה רעתך תמיד
    kjvRefs:
    - Nahum 3:19
    kjvOsis:
    - Nah.3.19
  relations:
