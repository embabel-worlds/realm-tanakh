    translation: JPS 1917
    original: קָרוֹב יוֹם־יְהוָה הַגָּדוֹל קָרוֹב וּמַהֵר מְאֹד קוֹל יוֹם יְהוָה מַר צֹרֵחַ שָׁם גִּבּוֹר׃
    hebrewPlain: קרוב יום יהוה הגדול קרוב ומהר מאד קול יום יהוה מר צרח שם גבור
