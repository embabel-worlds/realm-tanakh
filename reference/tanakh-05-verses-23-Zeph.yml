    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14800
    text: That day is a day of wrath, A day of trouble and distress, A day of wasteness and desolation, A day of darkness and gloominess, A day of clouds and thick darkness,
    translation: JPS 1917
    original: יוֹם עֶבְרָה הַיּוֹם הַהוּא יוֹם צָרָה וּמְצוּקָה יוֹם שֹׁאָה וּמְשׁוֹאָה יוֹם חֹשֶׁךְ וַאֲפֵלָה יוֹם עָנָן וַעֲרָפֶל׃
