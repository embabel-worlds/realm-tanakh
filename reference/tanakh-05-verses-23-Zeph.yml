    verse: 3
    ordinal: 14788
    text: I will consume man and beast, I will consume the fowls of the heaven, and the fishes of the sea, And the stumblingblocks with the wicked; And I will cut off man from off the face of the earth, Saith the LORD.
    translation: JPS 1917
    original: אָסֵף אָדָם וּבְהֵמָה אָסֵף עוֹף־הַשָּׁמַיִם וּדְגֵי הַיָּם וְהַמַּכְשֵׁלוֹת אֶת־הָרְשָׁעִים וְהִכְרַתִּי אֶת־הָאָדָם מֵעַל פְּנֵי הָאֲדָמָה נְאֻם־יְהוָה׃
    hebrewPlain: אסף אדם ובהמה אסף עוף השמים ודגי הים והמכשלות את הרשעים והכרתי את האדם מעל פני האדמה נאם יהוה
    kjvRefs:
    - Zephaniah 1:3
    kjvOsis:
    - Zeph.1.3
