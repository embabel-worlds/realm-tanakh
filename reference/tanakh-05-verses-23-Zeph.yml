    translation: JPS 1917
    original: וְהָיָה בָּעֵת הַהִיא אֲחַפֵּשׂ אֶת־יְרוּשָׁלִַם בַּנֵּרוֹת וּפָקַדְתִּי עַל־הָאֲנָשִׁים הַקֹּפְאִים עַל־שִׁמְרֵיהֶם הָאֹמְרִים בִּלְבָבָם לֹא־יֵיטִיב יְהוָה וְלֹא יָרֵעַ׃
    hebrewPlain: והיה בעת ההיא אחפש את ירושלם בנרות ופקדתי על האנשים הקפאים על שמריהם האמרים בלבבם לא ייטיב יהוה ולא ירע
