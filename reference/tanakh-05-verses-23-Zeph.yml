    chapter: 1
    verse: 13
    ordinal: 14798
    text: Therefore their wealth shall become a booty, And their houses a desolation; Yea, they shall build houses, but shall not inhabit them, And they shall plant vineyards, but shall not drink the wine thereof.
    translation: JPS 1917
    original: וְהָיָה חֵילָם לִמְשִׁסָּה וּבָתֵּיהֶם לִשְׁמָמָה וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ וְנָטְעוּ כְרָמִים וְלֹא יִשְׁתּוּ אֶת־יֵינָם׃
    hebrewPlain: והיה חילם למשסה ובתיהם לשממה ובנו בתים ולא ישבו ונטעו כרמים ולא ישתו את יינם
