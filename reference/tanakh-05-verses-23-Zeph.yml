    ordinal: 14789
    text: And I will stretch out My hand upon Judah, And upon all the inhabitants of Jerusalem; And I will cut off the remnant of Baal from this place, And the name of the idolatrous priests with the priests;
    translation: JPS 1917
    original: וְנָטִיתִי יָדִי עַל־יְהוּדָה וְעַל כָּל־יוֹשְׁבֵי יְרוּשָׁלִָם וְהִכְרַתִּי מִן־הַמָּקוֹם הַזֶּה אֶת־שְׁאָר הַבַּעַל אֶת־שֵׁם הַכְּמָרִים עִם־הַכֹּהֲנִים׃
    hebrewPlain: ונטיתי ידי על יהודה ועל כל יושבי ירושלם והכרתי מן המקום הזה את שאר הבעל את שם הכמרים עם הכהנים
    kjvRefs:
    - Zephaniah 1:4
    kjvOsis:
