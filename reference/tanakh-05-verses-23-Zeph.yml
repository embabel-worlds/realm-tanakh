  data:
    osis: Zeph.1.18
    scripture: tanakh
    name: Tanakh Zephaniah 1:18
    ref: Zephaniah 1:18
    book: Zeph
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 14803
    text: Neither their silver nor their gold Shall be able to deliver them In the day of the LORD’S wrath; But the whole earth shall be devoured by the fire of His jealousy; For He will make and end, yea, a terrible end, Of all them that dwell in the earth.
    translation: JPS 1917
    original: גַּם־כַּסְפָּם גַּם־זְהָבָם לֹא־יוּכַל לְהַצִּילָם בְּיוֹם עֶבְרַת יְהוָה וּבְאֵשׁ קִנְאָתוֹ תֵּאָכֵל כָּל־הָאָרֶץ כִּי־כָלָה אַךְ־נִבְהָלָה יַעֲשֶׂה אֵת כָּל־יֹשְׁבֵי הָאָרֶץ׃
    hebrewPlain: גם כספם גם זהבם לא יוכל להצילם ביום עברת יהוה ובאש קנאתו תאכל כל הארץ כי כלה אך נבהלה יעשה את כל ישבי הארץ
    kjvRefs:
    - Zephaniah 1:18
    kjvOsis:
    - Zeph.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.1
- type: TanakhVerse
  data:
    osis: Zeph.2.1
    scripture: tanakh
    name: Tanakh Zephaniah 2:1
    ref: Zephaniah 2:1
    book: Zeph
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14804
    text: Gather yourselves together, yea, gather together, O shameless nation;
    translation: JPS 1917
    original: הִתְקוֹשְׁשׁוּ וָקוֹשּׁוּ הַגּוֹי לֹא נִכְסָף׃
    hebrewPlain: התקוששו וקושו הגוי לא נכסף
    kjvRefs:
    - Zephaniah 2:1
    kjvOsis:
    - Zeph.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.2
    scripture: tanakh
    name: Tanakh Zephaniah 2:2
    ref: Zephaniah 2:2
    book: Zeph
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14805
    text: Before the decree bring forth The day when one passeth as the chaff, Before the fierce anger of the LORD come upon you, Before the day of the LORD’S anger come upon you.
    translation: JPS 1917
    original: בְּטֶרֶם לֶדֶת חֹק כְּמֹץ עָבַר יוֹם בְּטֶרֶם לֹא־יָבוֹא עֲלֵיכֶם חֲרוֹן אַף־יְהוָה בְּטֶרֶם לֹא־יָבוֹא עֲלֵיכֶם יוֹם אַף־יְהוָה׃
    hebrewPlain: בטרם לדת חק כמץ עבר יום בטרם לא יבוא עליכם חרון אף יהוה בטרם לא יבוא עליכם יום אף יהוה
    kjvRefs:
    - Zephaniah 2:2
    kjvOsis:
    - Zeph.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.3
    scripture: tanakh
    name: Tanakh Zephaniah 2:3
    ref: Zephaniah 2:3
    book: Zeph
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14806
    text: Seek ye the LORD, all ye humble of the earth, That have executed His ordinance; Seek righteousness, seek humility. It may be ye shall be hid in the day of the LORD’S anger.
    translation: JPS 1917
    original: בַּקְּשׁוּ אֶת־יְהוָה כָּל־עַנְוֵי הָאָרֶץ אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ בַּקְּשׁוּ־צֶדֶק בַּקְּשׁוּ עֲנָוָה אוּלַי תִּסָּתְרוּ בְּיוֹם אַף־יְהוָה׃
    hebrewPlain: בקשו את יהוה כל ענוי הארץ אשר משפטו פעלו בקשו צדק בקשו ענוה אולי תסתרו ביום אף יהוה
    kjvRefs:
    - Zephaniah 2:3
    kjvOsis:
    - Zeph.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.4
    scripture: tanakh
    name: Tanakh Zephaniah 2:4
    ref: Zephaniah 2:4
    book: Zeph
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14807
    text: For Gaza shall be forsaken, And Ashkelon a desolation; They shall drive out Ashdod at the noonday, And Ekron shall be rooted up.
    translation: JPS 1917
    original: כִּי עַזָּה עֲזוּבָה תִהְיֶה וְאַשְׁקְלוֹן לִשְׁמָמָה אַשְׁדּוֹד בַּצָּהֳרַיִם יְגָרְשׁוּהָ וְעֶקְרוֹן תֵּעָקֵר׃
    hebrewPlain: כי עזה עזובה תהיה ואשקלון לשממה אשדוד בצהרים יגרשוה ועקרון תעקר
    kjvRefs:
    - Zephaniah 2:4
    kjvOsis:
    - Zeph.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.5
    scripture: tanakh
    name: Tanakh Zephaniah 2:5
    ref: Zephaniah 2:5
    book: Zeph
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14808
    text: Woe unto the inhabitants of the sea-coast, The nation of the Cherethites! The word of the LORD is against you, O Canaan, the land of the Philistines; I will even destroy thee, that there shall be no inhabitant.
    translation: JPS 1917
    original: הוֹי יֹשְׁבֵי חֶבֶל הַיָּם גּוֹי כְּרֵתִים דְּבַר־יְהוָה עֲלֵיכֶם כְּנַעַן אֶרֶץ פְּלִשְׁתִּים וְהַאֲבַדְתִּיךְ מֵאֵין יוֹשֵׁב׃
    hebrewPlain: הוי ישבי חבל הים גוי כרתים דבר יהוה עליכם כנען ארץ פלשתים והאבדתיך מאין יושב
    kjvRefs:
    - Zephaniah 2:5
    kjvOsis:
    - Zeph.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.6
    scripture: tanakh
    name: Tanakh Zephaniah 2:6
    ref: Zephaniah 2:6
    book: Zeph
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14809
    text: And the sea-coast shall be pastures, Even meadows for shepherds, and folds for flocks.
    translation: JPS 1917
    original: וְהָיְתָה חֶבֶל הַיָּם נְוֺת כְּרֹת רֹעִים וְגִדְרוֹת צֹאן׃
    hebrewPlain: והיתה חבל הים נות כרת רעים וגדרות צאן
    kjvRefs:
    - Zephaniah 2:6
    kjvOsis:
    - Zeph.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.7
    scripture: tanakh
    name: Tanakh Zephaniah 2:7
    ref: Zephaniah 2:7
    book: Zeph
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14810
    text: And it shall be a portion for the remnant of the house of Judah, Whereon they shall feed; In the houses of Ashkelon shall they lie down in the evening; For the LORD their God will remember them, And turn their captivity.
    translation: JPS 1917
    original: וְהָיָה חֶבֶל לִשְׁאֵרִית בֵּית יְהוּדָה עֲלֵיהֶם יִרְעוּן בְּבָתֵּי אַשְׁקְלוֹן בָּעֶרֶב יִרְבָּצוּן כִּי יִפְקְדֵם יְהוָה אֱלֹהֵיהֶם וְשָׁב שבותם [שְׁבִיתָם׃]
    hebrewPlain: והיה חבל לשארית בית יהודה עליהם ירעון בבתי אשקלון בערב ירבצון כי יפקדם יהוה אלהיהם ושב שבותם [שביתם]
    kjvRefs:
    - Zephaniah 2:7
    kjvOsis:
    - Zeph.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.8
    scripture: tanakh
    name: Tanakh Zephaniah 2:8
    ref: Zephaniah 2:8
    book: Zeph
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14811
    text: I have heard the taunt of Moab, And the revilings of the children of Ammon, Wherewith they have taunted My people, And spoken boastfully concerning their border.
    translation: JPS 1917
    original: שָׁמַעְתִּי חֶרְפַּת מוֹאָב וְגִדּוּפֵי בְּנֵי עַמּוֹן אֲשֶׁר חֵרְפוּ אֶת־עַמִּי וַיַּגְדִּילוּ עַל־גְּבוּלָם׃
    hebrewPlain: שמעתי חרפת מואב וגדופי בני עמון אשר חרפו את עמי ויגדילו על גבולם
    kjvRefs:
    - Zephaniah 2:8
    kjvOsis:
    - Zeph.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.9
    scripture: tanakh
    name: Tanakh Zephaniah 2:9
    ref: Zephaniah 2:9
    book: Zeph
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14812
    text: 'Therefore as I live, Saith the LORD of hosts, the God of Israel: Surely Moab shall be as Sodom, And the children of Ammon as Gomorrah, Even the breeding-place of nettles, and saltpits, And a desolation, for ever; The residue of My people shall spoil them, And the remnant of My nation shall inherit them.'
    translation: JPS 1917
    original: לָכֵן חַי־אָנִי נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל כִּי־מוֹאָב כִּסְדֹם תִּהְיֶה וּבְנֵי עַמּוֹן כַּעֲמֹרָה מִמְשַׁק חָרוּל וּמִכְרֵה־מֶלַח וּשְׁמָמָה עַד־עוֹלָם שְׁאֵרִית עַמִּי יְבָזּוּם וְיֶתֶר גוי [גּוֹיִי] יִנְחָלוּם׃
    hebrewPlain: לכן חי אני נאם יהוה צבאות אלהי ישראל כי מואב כסדם תהיה ובני עמון כעמרה ממשק חרול ומכרה מלח ושממה עד עולם שארית עמי יבזום ויתר גוי [גויי] ינחלום
    kjvRefs:
    - Zephaniah 2:9
    kjvOsis:
    - Zeph.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.10
    scripture: tanakh
    name: Tanakh Zephaniah 2:10
    ref: Zephaniah 2:10
    book: Zeph
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14813
    text: This shall they have for their pride, Because they have taunted and spoken boastfully Against the people of the LORD of hosts.
    translation: JPS 1917
    original: זֹאת לָהֶם תַּחַת גְּאוֹנָם כִּי חֵרְפוּ וַיַּגְדִּלוּ עַל־עַם יְהוָה צְבָאוֹת׃
    hebrewPlain: זאת להם תחת גאונם כי חרפו ויגדלו על עם יהוה צבאות
    kjvRefs:
    - Zephaniah 2:10
    kjvOsis:
    - Zeph.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.11
    scripture: tanakh
    name: Tanakh Zephaniah 2:11
    ref: Zephaniah 2:11
    book: Zeph
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14814
    text: The LORD will be terrible unto them; For He will famish all the gods of the earth; Then shall all the isles of the nations worship Him, Every one from its place.
    translation: JPS 1917
    original: נוֹרָא יְהוָה עֲלֵיהֶם כִּי רָזָה אֵת כָּל־אֱלֹהֵי הָאָרֶץ וְיִשְׁתַּחֲווּ־לוֹ אִישׁ מִמְּקוֹמוֹ כֹּל אִיֵּי הַגּוֹיִם׃
    hebrewPlain: נורא יהוה עליהם כי רזה את כל אלהי הארץ וישתחוו לו איש ממקומו כל איי הגוים
    kjvRefs:
    - Zephaniah 2:11
    kjvOsis:
    - Zeph.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.12
    scripture: tanakh
    name: Tanakh Zephaniah 2:12
    ref: Zephaniah 2:12
    book: Zeph
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14815
    text: Ye Ethiopians also, Ye shall be slain by My sword.
    translation: JPS 1917
    original: גַּם־אַתֶּם כּוּשִׁים חַלְלֵי חַרְבִּי הֵמָּה׃
    hebrewPlain: גם אתם כושים חללי חרבי המה
    kjvRefs:
    - Zephaniah 2:12
    kjvOsis:
    - Zeph.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.13
    scripture: tanakh
    name: Tanakh Zephaniah 2:13
    ref: Zephaniah 2:13
    book: Zeph
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14816
    text: And He will stretch out His hand against the north, And destroy Assyria; And will make Nineveh a desolation, And dry like the wilderness.
    translation: JPS 1917
    original: וְיֵט יָדוֹ עַל־צָפוֹן וִיאַבֵּד אֶת־אַשּׁוּר וְיָשֵׂם אֶת־נִינְוֵה לִשְׁמָמָה צִיָּה כַּמִּדְבָּר׃
    hebrewPlain: ויט ידו על צפון ויאבד את אשור וישם את נינוה לשממה ציה כמדבר
    kjvRefs:
    - Zephaniah 2:13
    kjvOsis:
    - Zeph.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.14
    scripture: tanakh
    name: Tanakh Zephaniah 2:14
    ref: Zephaniah 2:14
    book: Zeph
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14817
    text: And all beasts of every kind Shall lie down in the midst of her in herds; Both the pelican and the bittern Shall lodge in the capitals thereof; Voices shall sing in the windows; Desolation shall be in the posts; For the cedar-work thereof shall be uncovered.
    translation: JPS 1917
    original: וְרָבְצוּ בְתוֹכָהּ עֲדָרִים כָּל־חַיְתוֹ־גוֹי גַּם־קָאַת גַּם־קִפֹּד בְּכַפְתֹּרֶיהָ יָלִינוּ קוֹל יְשׁוֹרֵר בַּחַלּוֹן חֹרֶב בַּסַּף כִּי אַרְזָה עֵרָה׃
    hebrewPlain: ורבצו בתוכה עדרים כל חיתו גוי גם קאת גם קפד בכפתריה ילינו קול ישורר בחלון חרב בסף כי ארזה ערה
    kjvRefs:
    - Zephaniah 2:14
    kjvOsis:
    - Zeph.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.2.15
    scripture: tanakh
    name: Tanakh Zephaniah 2:15
    ref: Zephaniah 2:15
    book: Zeph
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 14818
    text: 'This is the joyous city That dwelt without care, That said in her heart: ‘I am, and there is none else beside me’; How is she become a desolation, A place for beasts to lie down in! Every one that passeth by her Shall hiss, and wag his hand.'
    translation: JPS 1917
    original: זֹאת הָעִיר הָעַלִּיזָה הַיּוֹשֶׁבֶת לָבֶטַח הָאֹמְרָה בִּלְבָבָהּ אֲנִי וְאַפְסִי עוֹד אֵיךְ הָיְתָה לְשַׁמָּה מַרְבֵּץ לַחַיָּה כֹּל עוֹבֵר עָלֶיהָ יִשְׁרֹק יָנִיעַ יָדוֹ׃
    hebrewPlain: זאת העיר העליזה היושבת לבטח האמרה בלבבה אני ואפסי עוד איך היתה לשמה מרבץ לחיה כל עובר עליה ישרק יניע ידו
    kjvRefs:
    - Zephaniah 2:15
    kjvOsis:
    - Zeph.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.2
- type: TanakhVerse
  data:
    osis: Zeph.3.1
    scripture: tanakh
    name: Tanakh Zephaniah 3:1
    ref: Zephaniah 3:1
    book: Zeph
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14819
    text: Woe to her that is filthy and polluted, To the oppressing city!
    translation: JPS 1917
    original: הוֹי מֹרְאָה וְנִגְאָלָה הָעִיר הַיּוֹנָה׃
    hebrewPlain: הוי מראה ונגאלה העיר היונה
    kjvRefs:
    - Zephaniah 3:1
    kjvOsis:
    - Zeph.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.2
    scripture: tanakh
    name: Tanakh Zephaniah 3:2
    ref: Zephaniah 3:2
    book: Zeph
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14820
    text: She hearkened not the voice, She received not correction; She trusted not in the LORD, She drew not near to her God.
    translation: JPS 1917
    original: לֹא שָׁמְעָה בְּקוֹל לֹא לָקְחָה מוּסָר בַּיהוָה לֹא בָטָחָה אֶל־אֱלֹהֶיהָ לֹא קָרֵבָה׃
    hebrewPlain: לא שמעה בקול לא לקחה מוסר ביהוה לא בטחה אל אלהיה לא קרבה
    kjvRefs:
    - Zephaniah 3:2
    kjvOsis:
    - Zeph.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.3
    scripture: tanakh
    name: Tanakh Zephaniah 3:3
    ref: Zephaniah 3:3
    book: Zeph
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14821
    text: Her princes in the midst of her are roaring lions; Her judges are wolves of the desert, They leave not a bone for the morrow.
    translation: JPS 1917
    original: שָׂרֶיהָ בְקִרְבָּהּ אֲרָיוֹת שֹׁאֲגִים שֹׁפְטֶיהָ זְאֵבֵי עֶרֶב לֹא גָרְמוּ לַבֹּקֶר׃
    hebrewPlain: שריה בקרבה אריות שאגים שפטיה זאבי ערב לא גרמו לבקר
    kjvRefs:
    - Zephaniah 3:3
    kjvOsis:
    - Zeph.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.4
    scripture: tanakh
    name: Tanakh Zephaniah 3:4
    ref: Zephaniah 3:4
    book: Zeph
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14822
    text: Her prophets are wanton And treacherous persons; Her priests have profaned that which is holy, They have done violence to the law.
    translation: JPS 1917
    original: נְבִיאֶיהָ פֹּחֲזִים אַנְשֵׁי בֹּגְדוֹת כֹּהֲנֶיהָ חִלְּלוּ־קֹדֶשׁ חָמְסוּ תּוֹרָה׃
    hebrewPlain: נביאיה פחזים אנשי בגדות כהניה חללו קדש חמסו תורה
    kjvRefs:
    - Zephaniah 3:4
    kjvOsis:
    - Zeph.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.5
    scripture: tanakh
    name: Tanakh Zephaniah 3:5
    ref: Zephaniah 3:5
    book: Zeph
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14823
    text: The LORD who is righteous is in the midst of her, He will not do unrighteousness; Every morning doth He bring His right to light, It faileth not; But the unrighteous knoweth no shame.
    translation: JPS 1917
    original: יְהוָה צַדִּיק בְּקִרְבָּהּ לֹא יַעֲשֶׂה עַוְלָה בַּבֹּקֶר בַּבֹּקֶר מִשְׁפָּטוֹ יִתֵּן לָאוֹר לֹא נֶעְדָּר וְלֹא־יוֹדֵעַ עַוָּל בֹּשֶׁת׃
    hebrewPlain: יהוה צדיק בקרבה לא יעשה עולה בבקר בבקר משפטו יתן לאור לא נעדר ולא יודע עול בשת
    kjvRefs:
    - Zephaniah 3:5
    kjvOsis:
    - Zeph.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.6
    scripture: tanakh
    name: Tanakh Zephaniah 3:6
    ref: Zephaniah 3:6
    book: Zeph
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 14824
    text: I have cut off nations, Their corners are desolate; I have made their streets waste, So that none passeth by; Their cities are destroyed, so that there is no man, So that there is no inhabitant.
    translation: JPS 1917
    original: הִכְרַתִּי גוֹיִם נָשַׁמּוּ פִּנּוֹתָם הֶחֱרַבְתִּי חוּצוֹתָם מִבְּלִי עוֹבֵר נִצְדּוּ עָרֵיהֶם מִבְּלִי־אִישׁ מֵאֵין יוֹשֵׁב׃
    hebrewPlain: הכרתי גוים נשמו פנותם החרבתי חוצותם מבלי עובר נצדו עריהם מבלי איש מאין יושב
    kjvRefs:
    - Zephaniah 3:6
    kjvOsis:
    - Zeph.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.7
    scripture: tanakh
    name: Tanakh Zephaniah 3:7
    ref: Zephaniah 3:7
    book: Zeph
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 14825
    text: 'I said: ‘Surely thou wilt fear Me, Thou wilt receive correction; So her dwelling shall not be cut off, Despite all that I have visited upon her’; But they betimes corrupted all their doings.'
    translation: JPS 1917
    original: אָמַרְתִּי אַךְ־תִּירְאִי אוֹתִי תִּקְחִי מוּסָר וְלֹא־יִכָּרֵת מְעוֹנָהּ כֹּל אֲשֶׁר־פָּקַדְתִּי עָלֶיהָ אָכֵן הִשְׁכִּימוּ הִשְׁחִיתוּ כֹּל עֲלִילוֹתָם׃
    hebrewPlain: אמרתי אך תיראי אותי תקחי מוסר ולא יכרת מעונה כל אשר פקדתי עליה אכן השכימו השחיתו כל עלילותם
    kjvRefs:
    - Zephaniah 3:7
    kjvOsis:
    - Zeph.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.8
    scripture: tanakh
    name: Tanakh Zephaniah 3:8
    ref: Zephaniah 3:8
    book: Zeph
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 14826
    text: Therefore wait ye for Me, saith the LORD, Until the day that I rise up to the prey; For My determination is to gather the nations, That I may assemble the kingdoms, To pour upon them Mine indignation, Even all My fierce anger; For all the earth shall be devoured With the fire of My jealousy.
    translation: JPS 1917
    original: לָכֵן חַכּוּ־לִי נְאֻם־יְהוָה לְיוֹם קוּמִי לְעַד כִּי מִשְׁפָּטִי לֶאֱסֹף גּוֹיִם לְקָבְצִי מַמְלָכוֹת לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי כֹּל חֲרוֹן אַפִּי כִּי בְּאֵשׁ קִנְאָתִי תֵּאָכֵל כָּל־הָאָרֶץ׃
    hebrewPlain: לכן חכו לי נאם יהוה ליום קומי לעד כי משפטי לאסף גוים לקבצי ממלכות לשפך עליהם זעמי כל חרון אפי כי באש קנאתי תאכל כל הארץ
    kjvRefs:
    - Zephaniah 3:8
    kjvOsis:
    - Zeph.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.9
    scripture: tanakh
    name: Tanakh Zephaniah 3:9
    ref: Zephaniah 3:9
    book: Zeph
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 14827
    text: For then will I turn to the peoples A pure language, That they may all call upon the name of the LORD, To serve Him with one consent.
    translation: JPS 1917
    original: כִּי־אָז אֶהְפֹּךְ אֶל־עַמִּים שָׂפָה בְרוּרָה לִקְרֹא כֻלָּם בְּשֵׁם יְהוָה לְעָבְדוֹ שְׁכֶם אֶחָד׃
    hebrewPlain: כי אז אהפך אל עמים שפה ברורה לקרא כלם בשם יהוה לעבדו שכם אחד
    kjvRefs:
    - Zephaniah 3:9
    kjvOsis:
    - Zeph.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.10
    scripture: tanakh
    name: Tanakh Zephaniah 3:10
    ref: Zephaniah 3:10
    book: Zeph
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 14828
    text: From beyond the rivers of Ethiopia Shall they bring My suppliants, Even the daughter of My dispersed, As Mine offering.
    translation: JPS 1917
    original: מֵעֵבֶר לְנַהֲרֵי־כוּשׁ עֲתָרַי בַּת־פוּצַי יוֹבִלוּן מִנְחָתִי׃
    hebrewPlain: מעבר לנהרי כוש עתרי בת פוצי יובלון מנחתי
    kjvRefs:
    - Zephaniah 3:10
    kjvOsis:
    - Zeph.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.11
    scripture: tanakh
    name: Tanakh Zephaniah 3:11
    ref: Zephaniah 3:11
    book: Zeph
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 14829
    text: In that day shalt thou not be ashamed for all thy doings, Wherein thou hast transgressed against Me; For then I will take away out of the midst of thee Thy proudly exulting ones, And thou shalt no more be haughty In My holy mountain.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא לֹא תֵבוֹשִׁי מִכֹּל עֲלִילֹתַיִךְ אֲשֶׁר פָּשַׁעַתְּ בִּי כִּי־אָז אָסִיר מִקִּרְבֵּךְ עַלִּיזֵי גַּאֲוָתֵךְ וְלֹא־תוֹסִפִי לְגָבְהָה עוֹד בְּהַר קָדְשִׁי׃
    hebrewPlain: ביום ההוא לא תבושי מכל עלילתיך אשר פשעת בי כי אז אסיר מקרבך עליזי גאותך ולא תוספי לגבהה עוד בהר קדשי
    kjvRefs:
    - Zephaniah 3:11
    kjvOsis:
    - Zeph.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.12
    scripture: tanakh
    name: Tanakh Zephaniah 3:12
    ref: Zephaniah 3:12
    book: Zeph
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 14830
    text: And I will leave in the midst of thee An afflicted and poor people, And they shall take refuge in the name of the LORD.
    translation: JPS 1917
    original: וְהִשְׁאַרְתִּי בְקִרְבֵּךְ עַם עָנִי וָדָל וְחָסוּ בְּשֵׁם יְהוָה׃
    hebrewPlain: והשארתי בקרבך עם עני ודל וחסו בשם יהוה
    kjvRefs:
    - Zephaniah 3:12
    kjvOsis:
    - Zeph.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.13
    scripture: tanakh
    name: Tanakh Zephaniah 3:13
    ref: Zephaniah 3:13
    book: Zeph
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 14831
    text: The remnant of Israel shall not do iniquity, Nor speak lies, Neither shall a deceitful tongue be found in their mouth; For they shall feed and lie down, And none shall make them afraid.
    translation: JPS 1917
    original: שְׁאֵרִית יִשְׂרָאֵל לֹא־יַעֲשׂוּ עַוְלָה וְלֹא־יְדַבְּרוּ כָזָב וְלֹא־יִמָּצֵא בְּפִיהֶם לְשׁוֹן תַּרְמִית כִּי־הֵמָּה יִרְעוּ וְרָבְצוּ וְאֵין מַחֲרִיד׃
    hebrewPlain: שארית ישראל לא יעשו עולה ולא ידברו כזב ולא ימצא בפיהם לשון תרמית כי המה ירעו ורבצו ואין מחריד
    kjvRefs:
    - Zephaniah 3:13
    kjvOsis:
    - Zeph.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.14
    scripture: tanakh
    name: Tanakh Zephaniah 3:14
    ref: Zephaniah 3:14
    book: Zeph
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 14832
    text: Sing, O daughter of Zion, Shout, O Israel; Be glad and rejoice with all the heart, O daughter of Jerusalem.
    translation: JPS 1917
    original: רָנִּי בַּת־צִיּוֹן הָרִיעוּ יִשְׂרָאֵל שִׂמְחִי וְעָלְזִי בְּכָל־לֵב בַּת יְרוּשָׁלִָם׃
    hebrewPlain: רני בת ציון הריעו ישראל שמחי ועלזי בכל לב בת ירושלם
    kjvRefs:
    - Zephaniah 3:14
    kjvOsis:
    - Zeph.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.15
    scripture: tanakh
    name: Tanakh Zephaniah 3:15
    ref: Zephaniah 3:15
    book: Zeph
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 14833
    text: The LORD hath taken away thy judgments, He hath cast out thine enemy; The King of Israel, even the LORD, is in the midst of thee; Thou shalt not fear evil any more.
    translation: JPS 1917
    original: הֵסִיר יְהוָה מִשְׁפָּטַיִךְ פִּנָּה אֹיְבֵךְ מֶלֶךְ יִשְׂרָאֵל יְהוָה בְּקִרְבֵּךְ לֹא־תִירְאִי רָע עוֹד׃
    hebrewPlain: הסיר יהוה משפטיך פנה איבך מלך ישראל יהוה בקרבך לא תיראי רע עוד
    kjvRefs:
    - Zephaniah 3:15
    kjvOsis:
    - Zeph.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.16
    scripture: tanakh
    name: Tanakh Zephaniah 3:16
    ref: Zephaniah 3:16
    book: Zeph
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 14834
    text: 'In that day it shall be said to Jerusalem: ‘Fear thou not; O Zion, let not thy hands be slack.'
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא יֵאָמֵר לִירוּשָׁלִַם אַל־תִּירָאִי צִיּוֹן אַל־יִרְפּוּ יָדָיִךְ׃
    hebrewPlain: ביום ההוא יאמר לירושלם אל תיראי ציון אל ירפו ידיך
    kjvRefs:
    - Zephaniah 3:16
    kjvOsis:
    - Zeph.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.17
    scripture: tanakh
    name: Tanakh Zephaniah 3:17
    ref: Zephaniah 3:17
    book: Zeph
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 14835
    text: The LORD thy God is in the midst of thee, A Mighty One who will save; He will rejoice over thee with joy, He will be silent in His love, He will joy over thee with singing.’
    translation: JPS 1917
    original: יְהוָה אֱלֹהַיִךְ בְּקִרְבֵּך גִּבּוֹר יוֹשִׁיעַ יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה יַחֲרִישׁ בְּאַהֲבָתוֹ יָגִיל עָלַיִךְ בְּרִנָּה׃
    hebrewPlain: יהוה אלהיך בקרבך גבור יושיע ישיש עליך בשמחה יחריש באהבתו יגיל עליך ברנה
    kjvRefs:
    - Zephaniah 3:17
    kjvOsis:
    - Zeph.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.18
    scripture: tanakh
    name: Tanakh Zephaniah 3:18
    ref: Zephaniah 3:18
    book: Zeph
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 14836
    text: I will gather them that are far from the appointed season, who are of thee, That hast borne the burden of reproach.
    translation: JPS 1917
    original: נוּגֵי מִמּוֹעֵד אָסַפְתִּי מִמֵּךְ הָיוּ מַשְׂאֵת עָלֶיהָ חֶרְפָּה׃
    hebrewPlain: נוגי ממועד אספתי ממך היו משאת עליה חרפה
    kjvRefs:
    - Zephaniah 3:18
    kjvOsis:
    - Zeph.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.19
    scripture: tanakh
    name: Tanakh Zephaniah 3:19
    ref: Zephaniah 3:19
    book: Zeph
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 14837
    text: Behold, at that time I will deal with all them that afflict thee; And I will save her that is lame, And gather her that was driven away; And I will make them to be a praise and a name, Whose shame hath been in all the earth.
    translation: JPS 1917
    original: הִנְנִי עֹשֶׂה אֶת־כָּל־מְעַנַּיִךְ בָּעֵת הַהִיא וְהוֹשַׁעְתִּי אֶת־הַצֹּלֵעָה וְהַנִּדָּחָה אֲקַבֵּץ וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם בְּכָל־הָאָרֶץ בָּשְׁתָּם׃
    hebrewPlain: הנני עשה את כל מעניך בעת ההיא והושעתי את הצלעה והנדחה אקבץ ושמתים לתהלה ולשם בכל הארץ בשתם
    kjvRefs:
    - Zephaniah 3:19
    kjvOsis:
    - Zeph.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
- type: TanakhVerse
  data:
    osis: Zeph.3.20
    scripture: tanakh
    name: Tanakh Zephaniah 3:20
    ref: Zephaniah 3:20
    book: Zeph
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 14838
    text: At that time will I bring you in, And at that time will I gather you; For I will make you to be a name and a praise Among all the peoples of the earth, When I turn your captivity before your eyes, Saith the LORD.
    translation: JPS 1917
    original: בָּעֵת הַהִיא אָבִיא אֶתְכֶם וּבָעֵת קַבְּצִי אֶתְכֶם כִּי־אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה בְּכֹל עַמֵּי הָאָרֶץ בְּשׁוּבִי אֶת־שְׁבוּתֵיכֶם לְעֵינֵיכֶם אָמַר יְהוָה׃
    hebrewPlain: בעת ההיא אביא אתכם ובעת קבצי אתכם כי אתן אתכם לשם ולתהלה בכל עמי הארץ בשובי את שבותיכם לעיניכם אמר יהוה
    kjvRefs:
    - Zephaniah 3:20
    kjvOsis:
    - Zeph.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Zeph.3
