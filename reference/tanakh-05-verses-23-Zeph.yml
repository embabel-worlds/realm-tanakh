    verse: 10
    ordinal: 14795
    text: And in that day, saith the LORD, Hark! a cry from the fish gate, And a wailing from the second quarter, And a great crashing from the hills.
    translation: JPS 1917
    original: וְהָיָה בַיּוֹם הַהוּא נְאֻם־יְהוָה קוֹל צְעָקָה מִשַּׁעַר הַדָּגִים וִילָלָה מִן־הַמִּשְׁנֶה וְשֶׁבֶר גָּדוֹל מֵהַגְּבָעוֹת׃
    hebrewPlain: והיה ביום ההוא נאם יהוה קול צעקה משער הדגים ויללה מן המשנה ושבר גדול מהגבעות
