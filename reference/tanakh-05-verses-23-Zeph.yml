    ordinal: 14793
    text: And it shall come to pass in the day of the LORD’S sacrifice, That I will punish the princes, and the king’s sons, And all such as are clothed with foreign apparel.
    translation: JPS 1917
    original: וְהָיָה בְּיוֹם זֶבַח יְהוָה וּפָקַדְתִּי עַל־הַשָּׂרִים וְעַל־בְּנֵי הַמֶּלֶךְ וְעַל כָּל־הַלֹּבְשִׁים מַלְבּוּשׁ נָכְרִי׃
    hebrewPlain: והיה ביום זבח יהוה ופקדתי על השרים ועל בני המלך ועל כל הלבשים מלבוש נכרי
