    section: neviim
    chapter: 1
    verse: 17
    ordinal: 14802
    text: And I will bring distress upon men, That they shall walk like the blind, Because they have sinned against the LORD; And their blood shall be poured out as dust, And their flesh as dung.
    translation: JPS 1917
    original: וַהֲצֵרֹתִי לָאָדָם וְהָלְכוּ כַּעִוְרִים כִּי לַיהוָה חָטָאוּ וְשֻׁפַּךְ דָּמָם כֶּעָפָר וּלְחֻמָם כַּגְּלָלִים׃
    hebrewPlain: והצרתי לאדם והלכו כעורים כי ליהוה חטאו ושפך דמם כעפר ולחמם כגללים
