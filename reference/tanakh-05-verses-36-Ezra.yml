    scripture: tanakh
    name: Tanakh Ezra 8:34
    ref: Ezra 8:34
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 34
    ordinal: 20975
    text: the whole by number and by weight; and all the weight was written at that time.
    translation: JPS 1917
    original: בְּמִסְפָּר בְּמִשְׁקָל לַכֹּל וַיִּכָּתֵב כָּל־הַמִּשְׁקָל בָּעֵת הַהִיא׃
    hebrewPlain: במספר במשקל לכל ויכתב כל המשקל בעת ההיא
    kjvRefs:
