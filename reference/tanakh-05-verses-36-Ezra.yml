  data:
    osis: Ezra.4.18
    scripture: tanakh
    name: Tanakh Ezra 4:18
    ref: Ezra 4:18
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 20868
    text: the letter which ye sent unto us hath been plainly read before me.
    translation: JPS 1917
    original: נִשְׁתְּוָנָא דִּי שְׁלַחְתּוּן עֲלֶינָא מְפָרַשׁ קֱרִי קָדָמָי׃
    hebrewPlain: נשתונא די שלחתון עלינא מפרש קרי קדמי
    kjvRefs:
    - Ezra 4:18
    kjvOsis:
    - Ezra.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.19
    scripture: tanakh
    name: Tanakh Ezra 4:19
    ref: Ezra 4:19
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 20869
    text: And I decreed, and search hath been made, and it is found that this city of old time hath made insurrection against kings, and that rebellion and sedition have been made therein.
    translation: JPS 1917
    original: וּמִנִּי שִׂים טְעֵם וּבַקַּרוּ וְהַשְׁכַּחוּ דִּי קִרְיְתָא דָךְ מִן־יוֹמָת עָלְמָא עַל־מַלְכִין מִתְנַשְּׂאָה וּמְרַד וְאֶשְׁתַּדּוּר מִתְעֲבֶד־בַּהּ׃
    hebrewPlain: ומני שים טעם ובקרו והשכחו די קריתא דך מן יומת עלמא על מלכין מתנשאה ומרד ואשתדור מתעבד בה
    kjvRefs:
    - Ezra 4:19
    kjvOsis:
    - Ezra.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.20
    scripture: tanakh
    name: Tanakh Ezra 4:20
    ref: Ezra 4:20
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 20870
    text: There have been mighty kings also over Jerusalem, who have ruled over all the country beyond the River; and tribute, impost, and toll, was paid unto them.
    translation: JPS 1917
    original: וּמַלְכִין תַּקִּיפִין הֲווֹ עַל־יְרוּשְׁלֶם וְשַׁלִּיטִין בְּכֹל עֲבַר נַהֲרָה וּמִדָּה בְלוֹ וַהֲלָךְ מִתְיְהֵב לְהוֹן׃
    hebrewPlain: ומלכין תקיפין הוו על ירושלם ושליטין בכל עבר נהרה ומדה בלו והלך מתיהב להון
    kjvRefs:
    - Ezra 4:20
    kjvOsis:
    - Ezra.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.21
    scripture: tanakh
    name: Tanakh Ezra 4:21
    ref: Ezra 4:21
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 20871
    text: Make ye now a decree to cause these men to cease, and that this city be not builded, until a decree shall be made by me.
    translation: JPS 1917
    original: כְּעַן שִׂימוּ טְּעֵם לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא עַד־מִנִּי טַעְמָא יִתְּשָׂם׃
    hebrewPlain: כען שימו טעם לבטלא גבריא אלך וקריתא דך לא תתבנא עד מני טעמא יתשם
    kjvRefs:
    - Ezra 4:21
    kjvOsis:
    - Ezra.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.22
    scripture: tanakh
    name: Tanakh Ezra 4:22
    ref: Ezra 4:22
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 20872
    text: And take heed that ye be not slack herein; why should damage grow to the hurt of the kings?’
    translation: JPS 1917
    original: וּזְהִירִין הֱווֹ שָׁלוּ לְמֶעְבַּד עַל־דְּנָה לְמָה יִשְׂגֵּא חֲבָלָא לְהַנְזָקַת מַלְכִין׃
    hebrewPlain: וזהירין הוו שלו למעבד על דנה למה ישגא חבלא להנזקת מלכין
    kjvRefs:
    - Ezra 4:22
    kjvOsis:
    - Ezra.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.23
    scripture: tanakh
    name: Tanakh Ezra 4:23
    ref: Ezra 4:23
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 23
    ordinal: 20873
    text: Then when the copy of king Artaxerxes’ letter was read before Rehum, and Shimshai the scribe, and their companions, they went in haste to Jerusalem unto the Jews, and made them to cease by force and power.
    translation: JPS 1917
    original: אֱדַיִן מִן־דִּי פַּרְשֶׁגֶן נִשְׁתְּוָנָא דִּי ארתחששתא [אַרְתַּחְשַׁשְׂתְּ] מַלְכָּא קֱרִי קֳדָם־רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן אֲזַלוּ בִבְהִילוּ לִירוּשְׁלֶם עַל־יְהוּדָיֵא וּבַטִּלוּ הִמּוֹ בְּאֶדְרָע וְחָיִל׃
    hebrewPlain: אדין מן די פרשגן נשתונא די ארתחששתא [ארתחששת] מלכא קרי קדם רחום ושמשי ספרא וכנותהון אזלו בבהילו לירושלם על יהודיא ובטלו המו באדרע וחיל
    kjvRefs:
    - Ezra 4:23
    kjvOsis:
    - Ezra.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.24
    scripture: tanakh
    name: Tanakh Ezra 4:24
    ref: Ezra 4:24
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 24
    ordinal: 20874
    text: Then ceased the work of the house of God which is at Jerusalem; and it ceased unto the second year of the reign of Darius king of Persia.
    translation: JPS 1917
    original: בֵּאדַיִן בְּטֵלַת עֲבִידַת בֵּית־אֱלָהָא דִּי בִּירוּשְׁלֶם וַהֲוָת בָּטְלָא עַד שְׁנַת תַּרְתֵּין לְמַלְכוּת דָּרְיָוֶשׁ מֶלֶךְ־פָּרָס׃
    hebrewPlain: באדין בטלת עבידת בית אלהא די בירושלם והות בטלא עד שנת תרתין למלכות דריוש מלך פרס
    kjvRefs:
    - Ezra 4:24
    kjvOsis:
    - Ezra.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.5.1
    scripture: tanakh
    name: Tanakh Ezra 5:1
    ref: Ezra 5:1
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 20875
    text: Now the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that were in Judah and Jerusalem; in the name of the God of Israel prophesied they unto them.
    translation: JPS 1917
    original: וְהִתְנַבִּי חַגַּי נביאה [נְבִיָּא] וּזְכַרְיָה בַר־עִדּוֹא נביאיא [נְבִיַּיָּא] עַל־יְהוּדָיֵא דִּי בִיהוּד וּבִירוּשְׁלֶם בְּשֻׁם אֱלָהּ יִשְׂרָאֵל עֲלֵיהוֹן׃
    hebrewPlain: והתנבי חגי נביאה [נביא] וזכריה בר עדוא נביאיא [נבייא] על יהודיא די ביהוד ובירושלם בשם אלה ישראל עליהון
    kjvRefs:
    - Ezra 5:1
    kjvOsis:
    - Ezra.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.2
    scripture: tanakh
    name: Tanakh Ezra 5:2
    ref: Ezra 5:2
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 20876
    text: Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which is at Jerusalem; and with them were the prophets of God, helping them.
    translation: JPS 1917
    original: בֵּאדַיִן קָמוּ זְרֻבָּבֶל בַּר־שְׁאַלְתִּיאֵל וְיֵשׁוּעַ בַּר־יוֹצָדָק וְשָׁרִיו לְמִבְנֵא בֵּית אֱלָהָא דִּי בִירוּשְׁלֶם וְעִמְּהוֹן נביאיא [נְבִיַּיָּא] דִי־אֱלָהָא מְסָעֲדִין לְהוֹן׃
    hebrewPlain: באדין קמו זרבבל בר שאלתיאל וישוע בר יוצדק ושריו למבנא בית אלהא די בירושלם ועמהון נביאיא [נבייא] די אלהא מסעדין להון
    kjvRefs:
    - Ezra 5:2
    kjvOsis:
    - Ezra.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.3
    scripture: tanakh
    name: Tanakh Ezra 5:3
    ref: Ezra 5:3
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 20877
    text: 'At the same time came to them Tattenai, the governor beyond the River, and Shethar-bozenai, and their companions, and said thus unto them: ‘Who gave you a decree to build this house, and to finish this structure?’'
    translation: JPS 1917
    original: בֵּהּ־זִמְנָא אֲתָא עֲלֵיהוֹן תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה וּשְׁתַר בּוֹזְנַי וּכְנָוָתְהוֹן וְכֵן אָמְרִין לְהֹם מַן־שָׂם לְכֹם טְעֵם בַּיְתָא דְנָה לִבְּנֵא וְאֻשַּׁרְנָא דְנָה לְשַׁכְלָלָה׃
    hebrewPlain: בה זמנא אתא עליהון תתני פחת עבר נהרה ושתר בוזני וכנותהון וכן אמרין להם מן שם לכם טעם ביתא דנה לבנא ואשרנא דנה לשכללה
    kjvRefs:
    - Ezra 5:3
    kjvOsis:
    - Ezra.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.4
    scripture: tanakh
    name: Tanakh Ezra 5:4
    ref: Ezra 5:4
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 20878
    text: '’Then spoke we unto them after this manner [, wrote they]: What are the names of the men that build this building?’'
    translation: JPS 1917
    original: אֱדַיִן כְּנֵמָא אֲמַרְנָא לְּהֹם מַן־אִנּוּן שְׁמָהָת גֻּבְרַיָּא דִּי־דְנָה בִנְיָנָא בָּנַיִן׃
    hebrewPlain: אדין כנמא אמרנא להם מן אנון שמהת גבריא די דנה בנינא בנין
    kjvRefs:
    - Ezra 5:4
    kjvOsis:
    - Ezra.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.5
    scripture: tanakh
    name: Tanakh Ezra 5:5
    ref: Ezra 5:5
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 20879
    text: But the eye of their God was upon the elders of the Jews, and they did not make them cease, till the matter should come to Darius, and then answer should be returned by letter concerning it.
    translation: JPS 1917
    original: וְעֵין אֱלָהֲהֹם הֲוָת עַל־שָׂבֵי יְהוּדָיֵא וְלָא־בַטִּלוּ הִמּוֹ עַד־טַעְמָא לְדָרְיָוֶשׁ יְהָךְ וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל־דְּנָה׃
    hebrewPlain: ועין אלההם הות על שבי יהודיא ולא בטלו המו עד טעמא לדריוש יהך ואדין יתיבון נשתונא על דנה
    kjvRefs:
    - Ezra 5:5
    kjvOsis:
    - Ezra.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.6
    scripture: tanakh
    name: Tanakh Ezra 5:6
    ref: Ezra 5:6
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 20880
    text: The copy of the letter that Tattenai, the governor beyond the River, and Shethar-bozenai, and his companions the Apharesachites, who were beyond the River, sent unto Darius the king;
    translation: JPS 1917
    original: פַּרְשֶׁגֶן אִגַּרְתָּא דִּי־שְׁלַח תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה וּשְׁתַר בּוֹזְנַי וּכְנָוָתֵהּ אֲפַרְסְכָיֵא דִּי בַּעֲבַר נַהֲרָה עַל־דָּרְיָוֶשׁ מַלְכָּא׃
    hebrewPlain: פרשגן אגרתא די שלח תתני פחת עבר נהרה ושתר בוזני וכנותה אפרסכיא די בעבר נהרה על דריוש מלכא
    kjvRefs:
    - Ezra 5:6
    kjvOsis:
    - Ezra.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.7
    scripture: tanakh
    name: Tanakh Ezra 5:7
    ref: Ezra 5:7
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 20881
    text: 'they sent a letter unto him, wherein was written thus: ‘Unto Darius the king, all peace.'
    translation: JPS 1917
    original: פִּתְגָמָא שְׁלַחוּ עֲלוֹהִי וְכִדְנָה כְּתִיב בְּגַוֵּהּ לְדָרְיָוֶשׁ מַלְכָּא שְׁלָמָא כֹלָּא׃
    hebrewPlain: פתגמא שלחו עלוהי וכדנה כתיב בגוה לדריוש מלכא שלמא כלא
    kjvRefs:
    - Ezra 5:7
    kjvOsis:
    - Ezra.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.8
    scripture: tanakh
    name: Tanakh Ezra 5:8
    ref: Ezra 5:8
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 20882
    text: Be it known unto the king, that we went into the province of Judah, to the house of the great God, which is builded with great stones, and timber is laid in the walls, and this work goeth on with diligence and prospereth in their hands.
    translation: JPS 1917
    original: יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִּי־אֲזַלְנָא לִיהוּד מְדִינְתָּא לְבֵית אֱלָהָא רַבָּא וְהוּא מִתְבְּנֵא אֶבֶן גְּלָל וְאָע מִתְּשָׂם בְּכֻתְלַיָּא וַעֲבִידְתָּא דָךְ אָסְפַּרְנָא מִתְעַבְדָא וּמַצְלַח בְּיֶדְהֹם׃
    hebrewPlain: ידיע להוא למלכא די אזלנא ליהוד מדינתא לבית אלהא רבא והוא מתבנא אבן גלל ואע מתשם בכתליא ועבידתא דך אספרנא מתעבדא ומצלח בידהם
    kjvRefs:
    - Ezra 5:8
    kjvOsis:
    - Ezra.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.9
    scripture: tanakh
    name: Tanakh Ezra 5:9
    ref: Ezra 5:9
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 20883
    text: 'Then asked we those elders, and said unto them thus: Who gave you a decree to build this house, and to finish this wall?'
    translation: JPS 1917
    original: אֱדַיִן שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ כְּנֵמָא אֲמַרְנָא לְּהֹם מַן־שָׂם לְכֹם טְעֵם בַּיְתָא דְנָה לְמִבְנְיָה וְאֻשַּׁרְנָא דְנָה לְשַׁכְלָלָה׃
    hebrewPlain: אדין שאלנא לשביא אלך כנמא אמרנא להם מן שם לכם טעם ביתא דנה למבניה ואשרנא דנה לשכללה
    kjvRefs:
    - Ezra 5:9
    kjvOsis:
    - Ezra.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.10
    scripture: tanakh
    name: Tanakh Ezra 5:10
    ref: Ezra 5:10
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 20884
    text: We asked them their names also, to announce to thee, that we might write the names of the men that were at the head of them.
    translation: JPS 1917
    original: וְאַף שְׁמָהָתְהֹם שְׁאֵלְנָא לְּהֹם לְהוֹדָעוּתָךְ דִּי נִכְתֻּב שֻׁם־גֻּבְרַיָּא דִּי בְרָאשֵׁיהֹם׃
    hebrewPlain: ואף שמהתהם שאלנא להם להודעותך די נכתב שם גבריא די בראשיהם
    kjvRefs:
    - Ezra 5:10
    kjvOsis:
    - Ezra.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.11
    scripture: tanakh
    name: Tanakh Ezra 5:11
    ref: Ezra 5:11
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 20885
    text: 'And thus they returned us answer, saying: We are the servants of the God of heaven and earth, and build the house that was builded these many years ago, which a great king of Israel builded and finished.'
    translation: JPS 1917
    original: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא לְמֵמַר אֲנַחְנָא הִמּוֹ עַבְדוֹהִי דִי־אֱלָהּ שְׁמַיָּא וְאַרְעָא וּבָנַיִן בַּיְתָא דִּי־הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן וּמֶלֶךְ לְיִשְׂרָאֵל רַב בְּנָהִי וְשַׁכְלְלֵהּ׃
    hebrewPlain: וכנמא פתגמא התיבונא לממר אנחנא המו עבדוהי די אלה שמיא וארעא ובנין ביתא די הוא בנה מקדמת דנה שנין שגיאן ומלך לישראל רב בנהי ושכללה
    kjvRefs:
    - Ezra 5:11
    kjvOsis:
    - Ezra.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.12
    scripture: tanakh
    name: Tanakh Ezra 5:12
    ref: Ezra 5:12
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 20886
    text: But because that our fathers had provoked the God of heaven, He gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean, who destroyed this house, and carried the people away into Babylon.
    translation: JPS 1917
    original: לָהֵן מִן־דִּי הַרְגִּזוּ אֲבָהֳתַנָא לֶאֱלָהּ שְׁמַיָּא יְהַב הִמּוֹ בְּיַד נְבוּכַדְנֶצַּר מֶלֶךְ־בָּבֶל כסדיא [כַּסְדָּאָה] וּבַיְתָה דְנָה סַתְרֵהּ וְעַמָּה הַגְלִי לְבָבֶל׃
    hebrewPlain: להן מן די הרגזו אבהתנא לאלה שמיא יהב המו ביד נבוכדנצר מלך בבל כסדיא [כסדאה] וביתה דנה סתרה ועמה הגלי לבבל
    kjvRefs:
    - Ezra 5:12
    kjvOsis:
    - Ezra.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.13
    scripture: tanakh
    name: Tanakh Ezra 5:13
    ref: Ezra 5:13
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 20887
    text: But in the first year of Cyrus king of Babylon, Cyrus the king made a decree to build this house of God.
    translation: JPS 1917
    original: בְּרַם בִּשְׁנַת חֲדָה לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל כּוֹרֶשׁ מַלְכָּא שָׂם טְעֵם בֵּית־אֱלָהָא דְנָה לִבְּנֵא׃
    hebrewPlain: ברם בשנת חדה לכורש מלכא די בבל כורש מלכא שם טעם בית אלהא דנה לבנא
    kjvRefs:
    - Ezra 5:13
    kjvOsis:
    - Ezra.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.14
    scripture: tanakh
    name: Tanakh Ezra 5:14
    ref: Ezra 5:14
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 20888
    text: And the gold and silver vessels also of the house of God, which Nebuchadnezzar took out of the temple that was in Jerusalem, and brought them into the temple of Babylon, those did Cyrus the king take out of the temple of Babylon, and they were delivered unto one whose name was Sheshbazzar, whom he had made governor;
    translation: JPS 1917
    original: וְאַף מָאנַיָּא דִי־בֵית־אֱלָהָא דִּי דַהֲבָה וְכַסְפָּא דִּי נְבוּכַדְנֶצַּר הַנְפֵּק מִן־הֵיכְלָא דִּי בִירוּשְׁלֶם וְהֵיבֵל הִמּוֹ לְהֵיכְלָא דִּי בָבֶל הַנְפֵּק הִמּוֹ כּוֹרֶשׁ מַלְכָּא מִן־הֵיכְלָא דִּי בָבֶל וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ דִּי פֶחָה שָׂמֵהּ׃
    hebrewPlain: ואף מאניא די בית אלהא די דהבה וכספא די נבוכדנצר הנפק מן היכלא די בירושלם והיבל המו להיכלא די בבל הנפק המו כורש מלכא מן היכלא די בבל ויהיבו לששבצר שמה די פחה שמה
    kjvRefs:
    - Ezra 5:14
    kjvOsis:
    - Ezra.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.15
    scripture: tanakh
    name: Tanakh Ezra 5:15
    ref: Ezra 5:15
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 20889
    text: 'and he said unto him: Take these vessels, go, put them in the temple that is in Jerusalem, and let the house of God be builded in its place.'
    translation: JPS 1917
    original: וַאֲמַר־לֵהּ אלה [אֵל] מָאנַיָּא שֵׂא אֵזֶל־אֲחֵת הִמּוֹ בְּהֵיכְלָא דִּי בִירוּשְׁלֶם וּבֵית אֱלָהָא יִתְבְּנֵא עַל־אַתְרֵהּ׃
    hebrewPlain: ואמר לה אלה [אל] מאניא שא אזל אחת המו בהיכלא די בירושלם ובית אלהא יתבנא על אתרה
    kjvRefs:
    - Ezra 5:15
    kjvOsis:
    - Ezra.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.16
    scripture: tanakh
    name: Tanakh Ezra 5:16
    ref: Ezra 5:16
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 20890
    text: Then came the same Sheshbazzar, and laid the foundations of the house of God which is in Jerusalem; and since that time even until now hath it been in building, and yet it is not completed.
    translation: JPS 1917
    original: אֱדַיִן שֵׁשְׁבַּצַּר דֵּךְ אֲתָא יְהַב אֻשַּׁיָּא דִּי־בֵית אֱלָהָא דִּי בִירוּשְׁלֶם וּמִן־אֱדַיִן וְעַד־כְּעַן מִתְבְּנֵא וְלָא שְׁלִם׃
    hebrewPlain: אדין ששבצר דך אתא יהב אשיא די בית אלהא די בירושלם ומן אדין ועד כען מתבנא ולא שלם
    kjvRefs:
    - Ezra 5:16
    kjvOsis:
    - Ezra.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.5.17
    scripture: tanakh
    name: Tanakh Ezra 5:17
    ref: Ezra 5:17
    book: Ezra
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 20891
    text: Now therefore, if it seem good to the king, let search be made in the king’s treasure-house there, which is at Babylon, whether it be so, that a decree was made of Cyrus the king to build this house of God at Jerusalem, and let the king send his pleasure to us concerning this matter.’
    translation: JPS 1917
    original: וּכְעַן הֵן עַל־מַלְכָּא טָב יִתְבַּקַּר בְּבֵית גִּנְזַיָּא דִּי־מַלְכָּא תַמָּה דִּי בְּבָבֶל הֵן אִיתַי דִּי־מִן־כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם לְמִבְנֵא בֵּית־אֱלָהָא דֵךְ בִּירוּשְׁלֶם וּרְעוּת מַלְכָּא עַל־דְּנָה יִשְׁלַח עֲלֶינָא׃
    hebrewPlain: וכען הן על מלכא טב יתבקר בבית גנזיא די מלכא תמה די בבבל הן איתי די מן כורש מלכא שים טעם למבנא בית אלהא דך בירושלם ורעות מלכא על דנה ישלח עלינא
    kjvRefs:
    - Ezra 5:17
    kjvOsis:
    - Ezra.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.5
- type: TanakhVerse
  data:
    osis: Ezra.6.1
    scripture: tanakh
    name: Tanakh Ezra 6:1
    ref: Ezra 6:1
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 20892
    text: Then Darius the king made a decree, and search was made in the house of the archives, where the treasures were laid up, in Babylon.
    translation: JPS 1917
    original: בֵּאדַיִן דָּרְיָוֶשׁ מַלְכָּא שָׂם טְעֵם וּבַקַּרוּ בְּבֵית סִפְרַיָּא דִּי גִנְזַיָּא מְהַחֲתִין תַּמָּה בְּבָבֶל׃
    hebrewPlain: באדין דריוש מלכא שם טעם ובקרו בבית ספריא די גנזיא מהחתין תמה בבבל
    kjvRefs:
    - Ezra 6:1
    kjvOsis:
    - Ezra.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.2
    scripture: tanakh
    name: Tanakh Ezra 6:2
    ref: Ezra 6:2
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 20893
    text: 'And there was found at Ahmetha, in the palace that is in the province of Media, a roll, and therein was thus written: ‘A record.'
    translation: JPS 1917
    original: וְהִשְׁתְּכַח בְּאַחְמְתָא בְּבִירְתָא דִּי בְּמָדַי מְדִינְתָּה מְגִלָּה חֲדָה וְכֵן־כְּתִיב בְּגַוַּהּ דִּכְרוֹנָה׃
    hebrewPlain: והשתכח באחמתא בבירתא די במדי מדינתה מגלה חדה וכן כתיב בגוה דכרונה
    kjvRefs:
    - Ezra 6:2
    kjvOsis:
    - Ezra.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.3
    scripture: tanakh
    name: Tanakh Ezra 6:3
    ref: Ezra 6:3
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 20894
    text: 'In the first year of Cyrus the king, Cyrus the king made a decree: Concerning the house of God at Jerusalem, let the house be builded, the place where they offer sacrifices, and let the foundations thereof be strongly laid; the height thereof threescore cubits, and the breadth thereof threescore cubits;'
    translation: JPS 1917
    original: בִּשְׁנַת חֲדָה לְכוֹרֶשׁ מַלְכָּא כּוֹרֶשׁ מַלְכָּא שָׂם טְעֵם בֵּית־אֱלָהָא בִירוּשְׁלֶם בַּיְתָא יִתְבְּנֵא אֲתַר דִּי־דָבְחִין דִּבְחִין וְאֻשּׁוֹהִי מְסוֹבְלִין רוּמֵהּ אַמִּין שִׁתִּין פְּתָיֵהּ אַמִּין שִׁתִּין׃
    hebrewPlain: בשנת חדה לכורש מלכא כורש מלכא שם טעם בית אלהא בירושלם ביתא יתבנא אתר די דבחין דבחין ואשוהי מסובלין רומה אמין שתין פתיה אמין שתין
    kjvRefs:
    - Ezra 6:3
    kjvOsis:
    - Ezra.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.4
    scripture: tanakh
    name: Tanakh Ezra 6:4
    ref: Ezra 6:4
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 20895
    text: with three rows of great stones, and a row of new timber, and let the expenses be given out of the king’s house;
    translation: JPS 1917
    original: נִדְבָּכִין דִּי־אֶבֶן גְּלָל תְּלָתָא וְנִדְבָּךְ דִּי־אָע חֲדַת וְנִפְקְתָא מִן־בֵּית מַלְכָּא תִּתְיְהִב׃
    hebrewPlain: נדבכין די אבן גלל תלתא ונדבך די אע חדת ונפקתא מן בית מלכא תתיהב
    kjvRefs:
    - Ezra 6:4
    kjvOsis:
    - Ezra.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.5
    scripture: tanakh
    name: Tanakh Ezra 6:5
    ref: Ezra 6:5
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 20896
    text: and also let the gold and silver vessels of the house of God, which Nebuchadnezzar took forth out of the temple which is at Jerusalem, and brought unto Babylon, be restored, and brought back unto the temple which is at Jerusalem, every one to its place, and thou shalt put them in the house of God.’
    translation: JPS 1917
    original: וְאַף מָאנֵי בֵית־אֱלָהָא דִּי דַהֲבָה וְכַסְפָּא דִּי נְבוּכַדְנֶצַּר הַנְפֵּק מִן־הֵיכְלָא דִי־בִירוּשְׁלֶם וְהֵיבֵל לְבָבֶל יַהֲתִיבוּן וִיהָךְ לְהֵיכְלָא דִי־בִירוּשְׁלֶם לְאַתְרֵהּ וְתַחֵת בְּבֵית אֱלָהָא׃
    hebrewPlain: ואף מאני בית אלהא די דהבה וכספא די נבוכדנצר הנפק מן היכלא די בירושלם והיבל לבבל יהתיבון ויהך להיכלא די בירושלם לאתרה ותחת בבית אלהא
    kjvRefs:
    - Ezra 6:5
    kjvOsis:
    - Ezra.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.6
    scripture: tanakh
    name: Tanakh Ezra 6:6
    ref: Ezra 6:6
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 20897
    text: ’Now therefore, Tattenai, governor beyond the River, Shethar-bozenai, and your companions the Apharesachites, who are beyond the River, be ye far from thence;
    translation: JPS 1917
    original: כְּעַן תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה שְׁתַר בּוֹזְנַי וּכְנָוָתְהוֹן אֲפַרְסְכָיֵא דִּי בַּעֲבַר נַהֲרָה רַחִיקִין הֲווֹ מִן־תַּמָּה׃
    hebrewPlain: כען תתני פחת עבר נהרה שתר בוזני וכנותהון אפרסכיא די בעבר נהרה רחיקין הוו מן תמה
    kjvRefs:
    - Ezra 6:6
    kjvOsis:
    - Ezra.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.7
    scripture: tanakh
    name: Tanakh Ezra 6:7
    ref: Ezra 6:7
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 20898
    text: let the work of this house of God alone; let the governor of the Jews and the elders of the Jews build this house of God in its place.
    translation: JPS 1917
    original: שְׁבֻקוּ לַעֲבִידַת בֵּית־אֱלָהָא דֵךְ פַּחַת יְהוּדָיֵא וּלְשָׂבֵי יְהוּדָיֵא בֵּית־אֱלָהָא דֵךְ יִבְנוֹן עַל־אַתְרֵהּ׃
    hebrewPlain: שבקו לעבידת בית אלהא דך פחת יהודיא ולשבי יהודיא בית אלהא דך יבנון על אתרה
    kjvRefs:
    - Ezra 6:7
    kjvOsis:
    - Ezra.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.8
    scripture: tanakh
    name: Tanakh Ezra 6:8
    ref: Ezra 6:8
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 20899
    text: Moreover I make a decree concerning what ye shall do to these elders of the Jews for the building of this house of God; that of the king’s goods, even of the tribute beyond the River, expenses be given with all diligence unto these men, that they be not hindered.
    translation: JPS 1917
    original: וּמִנִּי שִׂים טְעֵם לְמָא דִי־תַעַבְדוּן עִם־שָׂבֵי יְהוּדָיֵא אִלֵּךְ לְמִבְנֵא בֵּית־אֱלָהָא דֵךְ וּמִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה אָסְפַּרְנָא נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ דִּי־לָא לְבַטָּלָא׃
    hebrewPlain: ומני שים טעם למא די תעבדון עם שבי יהודיא אלך למבנא בית אלהא דך ומנכסי מלכא די מדת עבר נהרה אספרנא נפקתא תהוא מתיהבא לגבריא אלך די לא לבטלא
    kjvRefs:
    - Ezra 6:8
    kjvOsis:
    - Ezra.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.9
    scripture: tanakh
    name: Tanakh Ezra 6:9
    ref: Ezra 6:9
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 20900
    text: And that which they have need of, both young bullocks, and rams, and lambs, for burnt-offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests that are at Jerusalem, let it be given them day by day without fail;
    translation: JPS 1917
    original: וּמָה חַשְׁחָן וּבְנֵי תוֹרִין וְדִכְרִין וְאִמְּרִין לַעֲלָוָן לֶאֱלָהּ שְׁמַיָּא חִנְטִין מְלַח חֲמַר וּמְשַׁח כְּמֵאמַר כָּהֲנַיָּא דִי־בִירוּשְׁלֶם לֶהֱוֵא מִתְיְהֵב לְהֹם יוֹם בְּיוֹם דִּי־לָא שָׁלוּ׃
    hebrewPlain: ומה חשחן ובני תורין ודכרין ואמרין לעלון לאלה שמיא חנטין מלח חמר ומשח כמאמר כהניא די בירושלם להוא מתיהב להם יום ביום די לא שלו
    kjvRefs:
    - Ezra 6:9
    kjvOsis:
    - Ezra.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.10
    scripture: tanakh
    name: Tanakh Ezra 6:10
    ref: Ezra 6:10
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 20901
    text: that they may offer sacrifices of sweet savour unto the God of heaven, and pray for the life of the king, and of his sons.
    translation: JPS 1917
    original: דִּי־לֶהֱוֺן מְהַקְרְבִין נִיחוֹחִין לֶאֱלָהּ שְׁמַיָּא וּמְצַלַּיִן לְחַיֵּי מַלְכָּא וּבְנוֹהִי׃
    hebrewPlain: די להון מהקרבין ניחוחין לאלה שמיא ומצלין לחיי מלכא ובנוהי
    kjvRefs:
    - Ezra 6:10
    kjvOsis:
    - Ezra.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.11
    scripture: tanakh
    name: Tanakh Ezra 6:11
    ref: Ezra 6:11
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 20902
    text: Also I have made a decree, that whosoever shall alter this word, let a beam be pulled out from his house, and let him be lifted up and fastened thereon; and let his house be made a dunghill for this;
    translation: JPS 1917
    original: וּמִנִּי שִׂים טְעֵם דִּי כָל־אֱנָשׁ דִּי יְהַשְׁנֵא פִּתְגָמָא דְנָה יִתְנְסַח אָע מִן־בַּיְתֵהּ וּזְקִיף יִתְמְחֵא עֲלֹהִי וּבַיְתֵהּ נְוָלוּ יִתְעֲבֵד עַל־דְּנָה׃
    hebrewPlain: ומני שים טעם די כל אנש די יהשנא פתגמא דנה יתנסח אע מן ביתה וזקיף יתמחא עלהי וביתה נולו יתעבד על דנה
    kjvRefs:
    - Ezra 6:11
    kjvOsis:
    - Ezra.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.12
    scripture: tanakh
    name: Tanakh Ezra 6:12
    ref: Ezra 6:12
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 20903
    text: and may the God that hath caused His name to dwell there overthrow all kings and peoples, that shall put forth their hand to alter the same, to destroy this house of God which is at Jerusalem. I Darius have made a decree; let it be done with all diligence.’
    translation: JPS 1917
    original: וֵאלָהָא דִּי שַׁכִּן שְׁמֵהּ תַּמָּה יְמַגַּר כָּל־מֶלֶךְ וְעַם דִּי יִשְׁלַח יְדֵהּ לְהַשְׁנָיָה לְחַבָּלָה בֵּית־אֱלָהָא דֵךְ דִּי בִירוּשְׁלֶם אֲנָה דָרְיָוֶשׁ שָׂמֶת טְעֵם אָסְפַּרְנָא יִתְעֲבִד׃
    hebrewPlain: ואלהא די שכן שמה תמה ימגר כל מלך ועם די ישלח ידה להשניה לחבלה בית אלהא דך די בירושלם אנה דריוש שמת טעם אספרנא יתעבד
    kjvRefs:
    - Ezra 6:12
    kjvOsis:
    - Ezra.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.13
    scripture: tanakh
    name: Tanakh Ezra 6:13
    ref: Ezra 6:13
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 20904
    text: Then Tattenai, the governor beyond the River, Shethar-bozenai, and their companions, because that Darius the king had thus sent, acted with all diligence.
    translation: JPS 1917
    original: אֱדַיִן תַּתְּנַי פַּחַת עֲבַר־נַהֲרָה שְׁתַר בּוֹזְנַי וּכְנָוָתְהוֹן לָקֳבֵל דִּי־שְׁלַח דָּרְיָוֶשׁ מַלְכָּא כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ׃
    hebrewPlain: אדין תתני פחת עבר נהרה שתר בוזני וכנותהון לקבל די שלח דריוש מלכא כנמא אספרנא עבדו
    kjvRefs:
    - Ezra 6:13
    kjvOsis:
    - Ezra.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.14
    scripture: tanakh
    name: Tanakh Ezra 6:14
    ref: Ezra 6:14
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 20905
    text: And the elders of the Jews builded and prospered, through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they builded and finished it, according to the commandment of the God of Israel, and according to the decree of Cyrus, and Darius, and Artaxerxes king of Persia.
    translation: JPS 1917
    original: וְשָׂבֵי יְהוּדָיֵא בָּנַיִן וּמַצְלְחִין בִּנְבוּאַת חַגַּי נביאה [נְבִיָּא] וּזְכַרְיָה בַּר־עִדּוֹא וּבְנוֹ וְשַׁכְלִלוּ מִן־טַעַם אֱלָהּ יִשְׂרָאֵל וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא מֶלֶךְ פָּרָס׃
    hebrewPlain: ושבי יהודיא בנין ומצלחין בנבואת חגי נביאה [נביא] וזכריה בר עדוא ובנו ושכללו מן טעם אלה ישראל ומטעם כורש ודריוש וארתחששתא מלך פרס
    kjvRefs:
    - Ezra 6:14
    kjvOsis:
    - Ezra.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
