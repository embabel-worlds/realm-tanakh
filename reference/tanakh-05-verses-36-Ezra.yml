    translation: JPS 1917
    original: וּמִבְּנֵי עַזְגָּד יוֹחָנָן בֶּן־הַקָּטָן וְעִמּוֹ מֵאָה וַעֲשָׂרָה הַזְּכָרִים׃
    hebrewPlain: ומבני עזגד יוחנן בן הקטן ועמו מאה ועשרה הזכרים
