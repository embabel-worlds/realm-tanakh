  data:
    osis: Ezra.4.12
    scripture: tanakh
    name: Tanakh Ezra 4:12
    ref: Ezra 4:12
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 20862
    text: be it known unto the king, that the Jews that came up from thee are come to us unto Jerusalem; they are building the rebellious and the bad city, and have finished the walls, and are digging out the foundations.
    translation: JPS 1917
    original: יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִּי יְהוּדָיֵא דִּי סְלִקוּ מִן־לְוָתָךְ עֲלֶינָא אֲתוֹ לִירוּשְׁלֶם קִרְיְתָא מָרָדְתָּא ובאישתא [וּבִישְׁתָּא] בָּנַיִן ושורי [וְשׁוּרַיָּא] אשכללו [שַׁכְלִילוּ] וְאֻשַּׁיָּא יַחִיטוּ׃
    hebrewPlain: ידיע להוא למלכא די יהודיא די סלקו מן לותך עלינא אתו לירושלם קריתא מרדתא ובאישתא [ובישתא] בנין ושורי [ושוריא] אשכללו [שכלילו] ואשיא יחיטו
    kjvRefs:
    - Ezra 4:12
