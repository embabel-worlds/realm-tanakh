    ordinal: 20832
    text: beside their men-servants and their maid-servants, of whom there were seven thousand three hundred thirty and seven; and they had two hundred singing men and singing women.
    translation: JPS 1917
    original: מִלְּבַד עַבְדֵיהֶם וְאַמְהֹתֵיהֶם אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה וְלָהֶם מְשֹׁרְרִים וּמְשֹׁרְרוֹת מָאתָיִם׃
    hebrewPlain: מלבד עבדיהם ואמהתיהם אלה שבעת אלפים שלש מאות שלשים ושבעה ולהם משררים ומשררות מאתים
