    name: Tanakh Ezra 10:18
    ref: Ezra 10:18
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 21010
    text: 'And among the sons of the priests there were found that had married foreign women, namely: of the sons of Jeshua, the son of Jozadak, and his brethren, Maaseiah, and Eliezer, and Jarib, and Gedaliah.'
    translation: JPS 1917
    original: וַיִּמָּצֵא מִבְּנֵי הַכֹּהֲנִים אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת מִבְּנֵי יֵשׁוּעַ בֶּן־יוֹצָדָק וְאֶחָיו מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה׃
    hebrewPlain: וימצא מבני הכהנים אשר השיבו נשים נכריות מבני ישוע בן יוצדק ואחיו מעשיה ואליעזר ויריב וגדליה
    kjvRefs:
    - Ezra 10:18
    kjvOsis:
    - Ezra.10.18
  relations:
