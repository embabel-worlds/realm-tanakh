    translation: JPS 1917
    original: מִבְּנֵי שְׁכַנְיָה מִבְּנֵי פַרְעֹשׁ זְכַרְיָה וְעִמּוֹ הִתְיַחֵשׂ לִזְכָרִים מֵאָה וַחֲמִשִּׁים׃
