    name: Tanakh Ezra 6:21
    ref: Ezra 6:21
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 21
    ordinal: 20912
    text: And the children of Israel, that were come back out of the captivity, and all such as had separated themselves unto them from the filthiness of the nations of the land, to seek the LORD, the God of Israel, did eat,
    translation: JPS 1917
    original: וַיֹּאכְלוּ בְנֵי־יִשְׂרָאֵל הַשָּׁבִים מֵהַגּוֹלָה וְכֹל הַנִּבְדָּל מִטֻּמְאַת גּוֹיֵ־הָאָרֶץ אֲלֵהֶם לִדְרֹשׁ לַיהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויאכלו בני ישראל השבים מהגולה וכל הנבדל מטמאת גוי הארץ אלהם לדרש ליהוה אלהי ישראל
    kjvRefs:
    - Ezra 6:21
    kjvOsis:
    - Ezra.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.22
    scripture: tanakh
    name: Tanakh Ezra 6:22
    ref: Ezra 6:22
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 22
    ordinal: 20913
    text: and kept the feast of unleavened bread seven days with joy; for the LORD had made them joyful, and had turned the heart of the king of Assyria unto them, to strengthen their hands in the work of the house of God, the God of Israel.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ חַג־מַצּוֹת שִׁבְעַת יָמִים בְּשִׂמְחָה כִּי שִׂמְּחָם יְהוָה וְהֵסֵב לֵב מֶלֶךְ־אַשּׁוּר עֲלֵיהֶם לְחַזֵּק יְדֵיהֶם בִּמְלֶאכֶת בֵּית־הָאֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: ויעשו חג מצות שבעת ימים בשמחה כי שמחם יהוה והסב לב מלך אשור עליהם לחזק ידיהם במלאכת בית האלהים אלהי ישראל
    kjvRefs:
    - Ezra 6:22
    kjvOsis:
    - Ezra.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
