    to:
      type: TanakhChapter
      osis: Ezra.1
- type: TanakhVerse
  data:
    osis: Ezra.1.3
    scripture: tanakh
    name: Tanakh Ezra 1:3
    ref: Ezra 1:3
    book: Ezra
    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 20759
    text: Whosoever there is among you of all His people—his God be with him—let him go up to Jerusalem, which is in Judah, and build the house of the LORD, the God of Israel, He is the God who is in Jerusalem.
    translation: JPS 1917
    original: מִי־בָכֶם מִכָּל־עַמּוֹ יְהִי אֱלֹהָיו עִמּוֹ וְיַעַל לִירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה וְיִבֶן אֶת־בֵּית יְהוָה אֱלֹהֵי יִשְׂרָאֵל הוּא הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלִָם׃
    hebrewPlain: מי בכם מכל עמו יהי אלהיו עמו ויעל לירושלם אשר ביהודה ויבן את בית יהוה אלהי ישראל הוא האלהים אשר בירושלם
    kjvRefs:
    - Ezra 1:3
    kjvOsis:
    - Ezra.1.3
  relations:
