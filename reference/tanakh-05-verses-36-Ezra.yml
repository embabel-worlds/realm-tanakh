    original: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס לִכְלוֹת דְּבַר־יְהוָה מִפִּי יִרְמְיָה הֵעִיר יְהוָה אֶת־רוּחַ כֹּרֶשׁ מֶלֶךְ־פָּרַס וַיַּעֲבֶר־קוֹל בְּכָל־מַלְכוּתוֹ וְגַם־בְּמִכְתָּב לֵאמֹר׃
    hebrewPlain: ובשנת אחת לכורש מלך פרס לכלות דבר יהוה מפי ירמיה העיר יהוה את רוח כרש מלך פרס ויעבר קול בכל מלכותו וגם במכתב לאמר
    kjvRefs:
    - Ezra 1:1
    kjvOsis:
