- type: TanakhVerse
  data:
    osis: Ezra.4.14
    scripture: tanakh
    name: Tanakh Ezra 4:14
    ref: Ezra 4:14
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 20864
    text: Now because we eat the salt of the palace, and it is not meet for us to see the king’s dishonour, therefore have we sent and announced to the king,
    translation: JPS 1917
    original: כְּעַן כָּל־קֳבֵל דִּי־מְלַח הֵיכְלָא מְלַחְנָא וְעַרְוַת מַלְכָּא לָא אֲ‍רִיךְ לַנָא לְמֶחֱזֵא עַל־דְּנָה שְׁלַחְנָא וְהוֹדַעְנָא לְמַלְכָּא׃
    hebrewPlain: כען כל קבל די מלח היכלא מלחנא וערות מלכא לא א‍ריך לנא למחזא על דנה שלחנא והודענא למלכא
    kjvRefs:
    - Ezra 4:14
    kjvOsis:
    - Ezra.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.15
    scripture: tanakh
    name: Tanakh Ezra 4:15
    ref: Ezra 4:15
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 20865
    text: that search may be made in the book of the records of thy fathers; so shalt thou find in the book of the records, and know that this city is a rebellious city, and hurtful unto kings and provinces, and that they have moved sedition within the same of old time; for which cause was this city laid waste.
    translation: JPS 1917
    original: דִּי יְבַקַּר בִּסְפַר־דָּכְרָנַיָּא דִּי אֲבָהָתָךְ וּתְהַשְׁכַּח בִּסְפַר דָּכְרָנַיָּא וְתִנְדַּע דִּי קִרְיְתָא דָךְ קִרְיָא מָרָדָא וּמְהַנְזְקַת מַלְכִין וּמְדִנָן וְאֶשְׁתַּדּוּר עָבְדִין בְּגַוַּהּ מִן־יוֹמָת עָלְמָא עַל־דְּנָה קִרְיְתָא דָךְ הָחָרְבַת׃
    hebrewPlain: די יבקר בספר דכרניא די אבהתך ותהשכח בספר דכרניא ותנדע די קריתא דך קריא מרדא ומהנזקת מלכין ומדנן ואשתדור עבדין בגוה מן יומת עלמא על דנה קריתא דך החרבת
    kjvRefs:
    - Ezra 4:15
    kjvOsis:
    - Ezra.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.16
    scripture: tanakh
    name: Tanakh Ezra 4:16
    ref: Ezra 4:16
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 20866
    text: We announce to the king that, if this city be builded, and the walls finished, by this means thou shalt have no portion beyond the River.’
    translation: JPS 1917
    original: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא דִּי הֵן קִרְיְתָא דָךְ תִּתְבְּנֵא וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן לָקֳבֵל דְּנָה חֲלָק בַּעֲבַר נַהֲרָא לָא אִיתַי לָךְ׃
    hebrewPlain: מהודעין אנחנה למלכא די הן קריתא דך תתבנא ושוריה ישתכללון לקבל דנה חלק בעבר נהרא לא איתי לך
    kjvRefs:
    - Ezra 4:16
    kjvOsis:
    - Ezra.4.16
