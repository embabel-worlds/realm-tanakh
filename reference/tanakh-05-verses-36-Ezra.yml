    original: וְכָל־הַנִּשְׁאָר מִכָּל־הַמְּקֹמוֹת אֲשֶׁר הוּא גָר־שָׁם יְנַשְּׂאוּהוּ אַנְשֵׁי מְקֹמוֹ בְּכֶסֶף וּבְזָהָב וּבִרְכוּשׁ וּבִבְהֵמָה עִם־הַנְּדָבָה לְבֵית הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלִָם׃
    hebrewPlain: וכל הנשאר מכל המקמות אשר הוא גר שם ינשאוהו אנשי מקמו בכסף ובזהב וברכוש ובבהמה עם הנדבה לבית האלהים אשר בירושלם
    kjvRefs:
