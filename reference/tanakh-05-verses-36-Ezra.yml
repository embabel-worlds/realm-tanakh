- type: TanakhVerse
  data:
    osis: Ezra.10.13
    scripture: tanakh
    name: Tanakh Ezra 10:13
    ref: Ezra 10:13
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 21005
    text: But the people are many, and it is a time of much rain, and we are not able to stand without, neither is this a work of one day or two; for we have greatly transgressed in this matter.
    translation: JPS 1917
    original: אֲבָל הָעָם רָב וְהָעֵת גְּשָׁמִים וְאֵין כֹּחַ לַעֲמוֹד בַּחוּץ וְהַמְּלָאכָה לֹא־לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם כִּי־הִרְבִּינוּ לִפְשֹׁעַ בַּדָּבָר הַזֶּה׃
    hebrewPlain: אבל העם רב והעת גשמים ואין כח לעמוד בחוץ והמלאכה לא ליום אחד ולא לשנים כי הרבינו לפשע בדבר הזה
    kjvRefs:
    - Ezra 10:13
    kjvOsis:
    - Ezra.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.14
    scripture: tanakh
    name: Tanakh Ezra 10:14
    ref: Ezra 10:14
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 21006
    text: Let now our princes of all the congregation stand, and let all them that are in our cities that have married foreign women come at appointed times, and with them the elders of every city, and the judges thereof, until the fierce wrath of our God be turned from us, as touching this matter.’
    translation: JPS 1917
    original: יַעֲמְדוּ־נָא שָׂרֵינוּ לְכָל־הַקָּהָל וְכֹל אֲשֶׁר בֶּעָרֵינוּ הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת יָבֹא לְעִתִּים מְזֻמָּנִים וְעִמָּהֶם זִקְנֵי־עִיר וָעִיר וְשֹׁפְטֶיהָ עַד לְהָשִׁיב חֲרוֹן אַף־אֱלֹהֵינוּ מִמֶּנּוּ עַד לַדָּבָר הַזֶּה׃
    hebrewPlain: יעמדו נא שרינו לכל הקהל וכל אשר בערינו ההשיב נשים נכריות יבא לעתים מזמנים ועמהם זקני עיר ועיר ושפטיה עד להשיב חרון אף אלהינו ממנו עד לדבר הזה
    kjvRefs:
    - Ezra 10:14
    kjvOsis:
    - Ezra.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.15
    scripture: tanakh
    name: Tanakh Ezra 10:15
    ref: Ezra 10:15
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 21007
    text: Only Jonathan the son of Asahel and Jahzeiah the son of Tikvah stood up against this matter; and Meshullam and Shabbethai the Levite helped them.
    translation: JPS 1917
    original: אַךְ יוֹנָתָן בֶּן־עֲשָׂהאֵל וְיַחְזְיָה בֶן־תִּקְוָה עָמְדוּ עַל־זֹאת וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי עֲזָרֻם׃
    hebrewPlain: אך יונתן בן עשהאל ויחזיה בן תקוה עמדו על זאת ומשלם ושבתי הלוי עזרם
    kjvRefs:
    - Ezra 10:15
    kjvOsis:
    - Ezra.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.16
    scripture: tanakh
    name: Tanakh Ezra 10:16
    ref: Ezra 10:16
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 21008
    text: And the children of the captivity did so. And Ezra the priest, with certain heads of fathers’ houses, after their fathers’ houses, and all of them by their names, were separated; and they sat down in the first day of the tenth month to examine the matter.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ־כֵן בְּנֵי הַגּוֹלָה וַיִּבָּדְלוּ עֶזְרָא הַכֹּהֵן אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם וְכֻלָּם בְּשֵׁמוֹת וַיֵּשְׁבוּ בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי לְדַרְיוֹשׁ הַדָּבָר׃
    hebrewPlain: ויעשו כן בני הגולה ויבדלו עזרא הכהן אנשים ראשי האבות לבית אבתם וכלם בשמות וישבו ביום אחד לחדש העשירי לדריוש הדבר
    kjvRefs:
    - Ezra 10:16
    kjvOsis:
    - Ezra.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
