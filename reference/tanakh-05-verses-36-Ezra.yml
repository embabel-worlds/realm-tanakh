    verse: 11
    ordinal: 20861
    text: this is the copy of the letter that they sent unto him, even unto Artaxerxes the king—thy servants the men beyond the River—and now
    translation: JPS 1917
    original: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא דִּי שְׁלַחוּ עֲלוֹהִי עַל־אַרְתַּחְשַׁשְׂתְּא מַלְכָּא עַבְדָיךְ אֱנָשׁ עֲבַר־נַהֲרָה וּכְעֶנֶת׃
    hebrewPlain: דנה פרשגן אגרתא די שלחו עלוהי על ארתחששתא מלכא עבדיך אנש עבר נהרה וכענת
