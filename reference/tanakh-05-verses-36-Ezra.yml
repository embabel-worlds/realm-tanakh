    scripture: tanakh
    name: Tanakh Ezra 8:16
    ref: Ezra 8:16
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 20957
    text: Then sent I for Eliezer, for Ariel, for Shemaiah, and for Elnathan, and for Jarib, and for Elnathan, and for Nathan, and for Zechariah, and for Meshullam, chief men; also for Joiarib, and for Elnathan, teachers.
    translation: JPS 1917
    original: וָאֶשְׁלְחָה לֶאֱלִיעֶזֶר לַאֲרִיאֵל לִשְׁמַעְיָה וּלְאֶלְנָתָן וּלְיָרִיב וּלְאֶלְנָתָן וּלְנָתָן וְלִזְכַרְיָה וְלִמְשֻׁלָּם רָאשִׁים וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים׃
    hebrewPlain: ואשלחה לאליעזר לאריאל לשמעיה ולאלנתן וליריב ולאלנתן ולנתן ולזכריה ולמשלם ראשים וליויריב ולאלנתן מבינים
    kjvRefs:
    - Ezra 8:16
    kjvOsis:
    - Ezra.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.17
    scripture: tanakh
    name: Tanakh Ezra 8:17
    ref: Ezra 8:17
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 20958
    text: And I gave them commandment unto Iddo the chief at the place Casiphia; and I told them what they should say unto Iddo [and] his brother, who were set over the place Casiphia, that they should bring unto us ministers for the house of our God.
    translation: JPS 1917
    original: ואוצאה [וָאֲצַוֶּה] אוֹתָם עַל־אִדּוֹ הָרֹאשׁ בְּכָסִפְיָא הַמָּקוֹם וָאָשִׂימָה בְּפִיהֶם דְּבָרִים לְדַבֵּר אֶל־אִדּוֹ אָחִיו הנתונים [הַנְּתִינִים] בְּכָסִפְיָא הַמָּקוֹם לְהָבִיא־לָנוּ מְשָׁרְתִים לְבֵית אֱלֹהֵינוּ׃
    hebrewPlain: ואוצאה [ואצוה] אותם על אדו הראש בכספיא המקום ואשימה בפיהם דברים לדבר אל אדו אחיו הנתונים [הנתינים] בכספיא המקום להביא לנו משרתים לבית אלהינו
    kjvRefs:
    - Ezra 8:17
    kjvOsis:
    - Ezra.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.18
    scripture: tanakh
    name: Tanakh Ezra 8:18
    ref: Ezra 8:18
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 20959
    text: And according to the good hand of our God upon us they brought us a man of discretion, of the sons of Mahli, the son of Levi, the son of Israel; and Sherebiah, with his sons and his brethren, eighteen;
    translation: JPS 1917
    original: וַיָּבִיאּוּ לָנוּ כְּיַד־אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ אִישׁ שֶׂכֶל מִבְּנֵי מַחְלִי בֶּן־לֵוִי בֶּן־יִשְׂרָאֵל וְשֵׁרֵבְיָה וּבָנָיו וְאֶחָיו שְׁמֹנָה עָשָׂר׃
    hebrewPlain: ויביאו לנו כיד אלהינו הטובה עלינו איש שכל מבני מחלי בן לוי בן ישראל ושרביה ובניו ואחיו שמנה עשר
    kjvRefs:
    - Ezra 8:18
    kjvOsis:
    - Ezra.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.19
    scripture: tanakh
    name: Tanakh Ezra 8:19
    ref: Ezra 8:19
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 19
    ordinal: 20960
    text: and Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;
    translation: JPS 1917
    original: וְאֶת־חֲשַׁבְיָה וְאִתּוֹ יְשַׁעְיָה מִבְּנֵי מְרָרִי אֶחָיו וּבְנֵיהֶם עֶשְׂרִים׃
    hebrewPlain: ואת חשביה ואתו ישעיה מבני מררי אחיו ובניהם עשרים
    kjvRefs:
    - Ezra 8:19
    kjvOsis:
    - Ezra.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.20
    scripture: tanakh
    name: Tanakh Ezra 8:20
    ref: Ezra 8:20
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 20
    ordinal: 20961
    text: and of the Nethinim, whom David and the princes had given for the service of the Levites, two hundred and twenty Nethinim; all of them were mentioned by name.
    translation: JPS 1917
    original: וּמִן־הַנְּתִינִים שֶׁנָּתַן דָּוִיד וְהַשָּׂרִים לַעֲבֹדַת הַלְוִיִּם נְתִינִים מָאתַיִם וְעֶשְׂרִים כֻּלָּם נִקְּבוּ בְשֵׁמוֹת׃
    hebrewPlain: ומן הנתינים שנתן דויד והשרים לעבדת הלוים נתינים מאתים ועשרים כלם נקבו בשמות
    kjvRefs:
    - Ezra 8:20
    kjvOsis:
    - Ezra.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.21
    scripture: tanakh
    name: Tanakh Ezra 8:21
    ref: Ezra 8:21
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 21
    ordinal: 20962
    text: Then I proclaimed a fast there, at the river Ahava, that we might humble ourselves before our God, to seek of Him a straight way, for us, and for our little ones, and for all our substance.
    translation: JPS 1917
    original: וָאֶקְרָא שָׁם צוֹם עַל־הַנָּהָר אַהֲוָא לְהִתְעַנּוֹת לִפְנֵי אֱלֹהֵינוּ לְבַקֵּשׁ מִמֶּנּוּ דֶּרֶךְ יְשָׁרָה לָנוּ וּלְטַפֵּנוּ וּלְכָל־רְכוּשֵׁנוּ׃
    hebrewPlain: ואקרא שם צום על הנהר אהוא להתענות לפני אלהינו לבקש ממנו דרך ישרה לנו ולטפנו ולכל רכושנו
    kjvRefs:
    - Ezra 8:21
    kjvOsis:
    - Ezra.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.22
    scripture: tanakh
    name: Tanakh Ezra 8:22
    ref: Ezra 8:22
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 22
    ordinal: 20963
    text: 'For I was ashamed to ask of the king a band of soldiers and horsemen to help us against the enemy in the way; because we had spoken unto the king, saying: ‘The hand of our God is upon all them that seek Him, for good; but His power and His wrath is against all them that forsake Him.’'
    translation: JPS 1917
    original: כִּי בֹשְׁתִּי לִשְׁאוֹל מִן־הַמֶּלֶךְ חַיִל וּפָרָשִׁים לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ כִּי־אָמַרְנוּ לַמֶּלֶךְ לֵאמֹר יַד־אֱלֹהֵינוּ עַל־כָּל־מְבַקְשָׁיו לְטוֹבָה וְעֻזּוֹ וְאַפּוֹ עַל כָּל־עֹזְבָיו׃
    hebrewPlain: כי בשתי לשאול מן המלך חיל ופרשים לעזרנו מאויב בדרך כי אמרנו למלך לאמר יד אלהינו על כל מבקשיו לטובה ועזו ואפו על כל עזביו
    kjvRefs:
    - Ezra 8:22
    kjvOsis:
    - Ezra.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.23
    scripture: tanakh
    name: Tanakh Ezra 8:23
    ref: Ezra 8:23
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 23
    ordinal: 20964
    text: So we fasted and besought our God for this; and He was entreated of us.
    translation: JPS 1917
    original: וַנָּצוּמָה וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ עַל־זֹאת וַיֵּעָתֵר לָנוּ׃
    hebrewPlain: ונצומה ונבקשה מאלהינו על זאת ויעתר לנו
    kjvRefs:
    - Ezra 8:23
    kjvOsis:
    - Ezra.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.24
    scripture: tanakh
    name: Tanakh Ezra 8:24
    ref: Ezra 8:24
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 24
    ordinal: 20965
    text: Then I separated twelve of the chiefs of the priests, besides Sherebiah, Hashabiah, and ten of their brethren with them,
    translation: JPS 1917
    original: וָאַבְדִּילָה מִשָּׂרֵי הַכֹּהֲנִים שְׁנֵים עָשָׂר לְשֵׁרֵבְיָה חֲשַׁבְיָה וְעִמָּהֶם מֵאֲחֵיהֶם עֲשָׂרָה׃
    hebrewPlain: ואבדילה משרי הכהנים שנים עשר לשרביה חשביה ועמהם מאחיהם עשרה
    kjvRefs:
    - Ezra 8:24
    kjvOsis:
    - Ezra.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.25
    scripture: tanakh
    name: Tanakh Ezra 8:25
    ref: Ezra 8:25
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 25
    ordinal: 20966
    text: and weighed unto them the silver, and the gold, and the vessels, even the offering for the house of our God, which the king, and his counsellors, and his princes, and all Israel there present, had offered;
    translation: JPS 1917
    original: ואשקולה [וָאֶשְׁקֳלָה] לָהֶם אֶת־הַכֶּסֶף וְאֶת־הַזָּהָב וְאֶת־הַכֵּלִים תְּרוּמַת בֵּית־אֱלֹהֵינוּ הַהֵרִימוּ הַמֶּלֶךְ וְיֹעֲצָיו וְשָׂרָיו וְכָל־יִשְׂרָאֵל הַנִּמְצָאִים׃
    hebrewPlain: ואשקולה [ואשקלה] להם את הכסף ואת הזהב ואת הכלים תרומת בית אלהינו ההרימו המלך ויעציו ושריו וכל ישראל הנמצאים
    kjvRefs:
    - Ezra 8:25
    kjvOsis:
    - Ezra.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.26
    scripture: tanakh
    name: Tanakh Ezra 8:26
    ref: Ezra 8:26
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 26
    ordinal: 20967
    text: I even weighed into their hand six hundred and fifty talents of silver, and silver vessels a hundred talents; of gold a hundred talents;
    translation: JPS 1917
    original: וָאֶשְׁקֲלָה עַל־יָדָם כֶּסֶף כִּכָּרִים שֵׁשׁ־מֵאוֹת וַחֲמִשִּׁים וּכְלֵי־כֶסֶף מֵאָה לְכִכָּרִים זָהָב מֵאָה כִכָּר׃
    hebrewPlain: ואשקלה על ידם כסף ככרים שש מאות וחמשים וכלי כסף מאה לככרים זהב מאה ככר
    kjvRefs:
    - Ezra 8:26
    kjvOsis:
    - Ezra.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.27
    scripture: tanakh
    name: Tanakh Ezra 8:27
    ref: Ezra 8:27
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 27
    ordinal: 20968
    text: and twenty bowls of gold, of a thousand darics; and two vessels of fine bright brass, precious as gold.
    translation: JPS 1917
    original: וּכְפֹרֵי זָהָב עֶשְׂרִים לַאֲדַרְכֹנִים אָלֶף וּכְלֵי נְחֹשֶׁת מֻצְהָב טוֹבָה שְׁנַיִם חֲמוּדֹת כַּזָּהָב׃
    hebrewPlain: וכפרי זהב עשרים לאדרכנים אלף וכלי נחשת מצהב טובה שנים חמודת כזהב
    kjvRefs:
    - Ezra 8:27
    kjvOsis:
    - Ezra.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.28
    scripture: tanakh
    name: Tanakh Ezra 8:28
    ref: Ezra 8:28
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 28
    ordinal: 20969
    text: 'And I said unto them: ‘Ye are holy unto the LORD, and the vessels are holy; and the silver and the gold are a freewill-offering unto the LORD, the God of your fathers.'
    translation: JPS 1917
    original: וָאֹמְרָה אֲלֵהֶם אַתֶּם קֹדֶשׁ לַיהוָה וְהַכֵּלִים קֹדֶשׁ וְהַכֶּסֶף וְהַזָּהָב נְדָבָה לַיהוָה אֱלֹהֵי אֲבֹתֵיכֶם׃
    hebrewPlain: ואמרה אלהם אתם קדש ליהוה והכלים קדש והכסף והזהב נדבה ליהוה אלהי אבתיכם
    kjvRefs:
    - Ezra 8:28
    kjvOsis:
    - Ezra.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.29
    scripture: tanakh
    name: Tanakh Ezra 8:29
    ref: Ezra 8:29
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 29
    ordinal: 20970
    text: Watch ye, and keep them, until ye weigh them before the chiefs of the priests and the Levites, and the princes of the fathers’ houses of Israel, at Jerusalem, in the chambers of the house of the LORD.’
    translation: JPS 1917
    original: שִׁקְדוּ וְשִׁמְרוּ עַד־תִּשְׁקְלוּ לִפְנֵי שָׂרֵי הַכֹּהֲנִים וְהַלְוִיִּם וְשָׂרֵי־הָאָבוֹת לְיִשְׂרָאֵל בִּירוּשָׁלִָם הַלִּשְׁכוֹת בֵּית יְהוָה׃
    hebrewPlain: שקדו ושמרו עד תשקלו לפני שרי הכהנים והלוים ושרי האבות לישראל בירושלם הלשכות בית יהוה
    kjvRefs:
    - Ezra 8:29
    kjvOsis:
    - Ezra.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.30
    scripture: tanakh
    name: Tanakh Ezra 8:30
    ref: Ezra 8:30
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 30
    ordinal: 20971
    text: So the priests and the Levites received the weight of the silver and the gold, and the vessels, to bring them to Jerusalem unto the house of our God.
    translation: JPS 1917
    original: וְקִבְּלוּ הַכֹּהֲנִים וְהַלְוִיִּם מִשְׁקַל הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים לְהָבִיא לִירוּשָׁלִַם לְבֵית אֱלֹהֵינוּ׃
    hebrewPlain: וקבלו הכהנים והלוים משקל הכסף והזהב והכלים להביא לירושלם לבית אלהינו
    kjvRefs:
    - Ezra 8:30
    kjvOsis:
    - Ezra.8.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.31
    scripture: tanakh
    name: Tanakh Ezra 8:31
    ref: Ezra 8:31
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 31
    ordinal: 20972
    text: Then we departed from the river of Ahava on the twelfth day of the first month, to go unto Jerusalem; and the hand of our God was upon us, and He delivered us from the hand of the enemy and lier-in-wait by the way.
    translation: JPS 1917
    original: וַנִּסְעָה מִנְּהַר אַהֲוָא בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן לָלֶכֶת יְרוּשָׁלִָם וְיַד־אֱלֹהֵינוּ הָיְתָה עָלֵינוּ וַיַּצִּילֵנוּ מִכַּף אוֹיֵב וְאוֹרֵב עַל־הַדָּרֶךְ׃
    hebrewPlain: ונסעה מנהר אהוא בשנים עשר לחדש הראשון ללכת ירושלם ויד אלהינו היתה עלינו ויצילנו מכף אויב ואורב על הדרך
    kjvRefs:
    - Ezra 8:31
    kjvOsis:
    - Ezra.8.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.32
    scripture: tanakh
    name: Tanakh Ezra 8:32
    ref: Ezra 8:32
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 32
    ordinal: 20973
    text: And we came to Jerusalem, and abode there three days.
    translation: JPS 1917
    original: וַנָּבוֹא יְרוּשָׁלִָם וַנֵּשֶׁב שָׁם יָמִים שְׁלֹשָׁה׃
    hebrewPlain: ונבוא ירושלם ונשב שם ימים שלשה
    kjvRefs:
    - Ezra 8:32
    kjvOsis:
    - Ezra.8.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.33
    scripture: tanakh
    name: Tanakh Ezra 8:33
    ref: Ezra 8:33
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 33
    ordinal: 20974
    text: And on the fourth day was the silver and the gold and the vessels weighed in the house of our God into the hand of Meremoth the son of Uriah the priest; and with him was Eleazar the son of Phinehas; and with them was Jozabad the son of Jeshua, and Noadiah the son of Binnui, the Levites;
    translation: JPS 1917
    original: וּבַיּוֹם הָרְבִיעִי נִשְׁקַל הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים בְּבֵית אֱלֹהֵינוּ עַל יַד־מְרֵמוֹת בֶּן־אוּרִיָּה הַכֹּהֵן וְעִמּוֹ אֶלְעָזָר בֶּן־פִּינְחָס וְעִמָּהֶם יוֹזָבָד בֶּן־יֵשׁוּעַ וְנוֹעַדְיָה בֶן־בִּנּוּי הַלְוִיִּם׃
    hebrewPlain: וביום הרביעי נשקל הכסף והזהב והכלים בבית אלהינו על יד מרמות בן אוריה הכהן ועמו אלעזר בן פינחס ועמהם יוזבד בן ישוע ונועדיה בן בנוי הלוים
    kjvRefs:
    - Ezra 8:33
    kjvOsis:
    - Ezra.8.33
  relations:
