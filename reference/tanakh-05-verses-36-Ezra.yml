  data:
    osis: Ezra.7.6
    scripture: tanakh
    name: Tanakh Ezra 7:6
    ref: Ezra 7:6
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 20919
    text: this Ezra went up from Babylon; and he was a ready scribe in the Law of Moses, which the LORD, the God of Israel, had given; and the king granted him all his request, according to the hand of the LORD his God upon him.
    translation: JPS 1917
    original: הוּא עֶזְרָא עָלָה מִבָּבֶל וְהוּא־סֹפֵר מָהִיר בְּתוֹרַת מֹשֶׁה אֲשֶׁר־נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל וַיִּתֶּן־לוֹ הַמֶּלֶךְ כְּיַד־יְהוָה אֱלֹהָיו עָלָיו כֹּל בַּקָּשָׁתוֹ׃
    hebrewPlain: הוא עזרא עלה מבבל והוא ספר מהיר בתורת משה אשר נתן יהוה אלהי ישראל ויתן לו המלך כיד יהוה אלהיו עליו כל בקשתו
    kjvRefs:
    - Ezra 7:6
    kjvOsis:
    - Ezra.7.6
