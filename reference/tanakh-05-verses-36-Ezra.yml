  data:
    osis: Ezra.2.69
    scripture: tanakh
    name: Tanakh Ezra 2:69
    ref: Ezra 2:69
    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 69
    ordinal: 20836
    text: they gave after their ability into the treasury of the work threescore and one thousand darics of gold, and five thousand pounds of silver, and one hundred priests’ tunics.
    translation: JPS 1917
    original: כְּכֹחָם נָתְנוּ לְאוֹצַר הַמְּלָאכָה זָהָב דַּרְכְּמוֹנִים שֵׁשׁ־רִבֹּאות וָאֶלֶף וְכֶסֶף מָנִים חֲמֵשֶׁת אֲלָפִים וְכָתְנֹת כֹּהֲנִים מֵאָה׃
    hebrewPlain: ככחם נתנו לאוצר המלאכה זהב דרכמונים שש רבאות ואלף וכסף מנים חמשת אלפים וכתנת כהנים מאה
    kjvRefs:
    - Ezra 2:69
    kjvOsis:
    - Ezra.2.69
