    name: Tanakh Ezra 6:15
    ref: Ezra 6:15
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 20906
    text: And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.
    translation: JPS 1917
    original: וְשֵׁיצִיא בַּיְתָה דְנָה עַד יוֹם תְּלָתָה לִירַח אֲדָר דִּי־הִיא שְׁנַת־שֵׁת לְמַלְכוּת דָּרְיָוֶשׁ מַלְכָּא׃
    hebrewPlain: ושיציא ביתה דנה עד יום תלתה לירח אדר די היא שנת שת למלכות דריוש מלכא
    kjvRefs:
