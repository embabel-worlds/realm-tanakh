    scripture: tanakh
    name: Tanakh Ezra 7:28
    ref: Ezra 7:28
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 28
    ordinal: 20941
    text: and hath extended mercy unto me before the king, and his counsellors, and before all the king’s mighty princes. And I was strengthened according to the hand of the LORD my God upon me, and I gathered together out of Israel chief men to go up with me.
    translation: JPS 1917
    original: וְעָלַי הִטָּה־חֶסֶד לִפְנֵי הַמֶּלֶךְ וְיוֹעֲצָיו וּלְכָל־שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים וַאֲנִי הִתְחַזַּקְתִּי כְּיַד־יְהוָה אֱלֹהַי עָלַי וָאֶקְבְּצָה מִיִּשְׂרָאֵל רָאשִׁים לַעֲלוֹת עִמִּי׃
    hebrewPlain: ועלי הטה חסד לפני המלך ויועציו ולכל שרי המלך הגברים ואני התחזקתי כיד יהוה אלהי עלי ואקבצה מישראל ראשים לעלות עמי
    kjvRefs:
    - Ezra 7:28
    kjvOsis:
    - Ezra.7.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
