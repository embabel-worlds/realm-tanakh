  data:
    osis: Ezra.2.68
    scripture: tanakh
    name: Tanakh Ezra 2:68
    ref: Ezra 2:68
    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 68
    ordinal: 20835
    text: And some of the heads of fathers’ houses, when they came to the house of the LORD which is in Jerusalem, offered willingly for the house of God to set it up in its place;
    translation: JPS 1917
    original: וּמֵרָאשֵׁי הָאָבוֹת בְּבוֹאָם לְבֵית יְהוָה אֲשֶׁר בִּירוּשָׁלִָם הִתְנַדְּבוּ לְבֵית הָאֱלֹהִים לְהַעֲמִידוֹ עַל־מְכוֹנוֹ׃
    hebrewPlain: ומראשי האבות בבואם לבית יהוה אשר בירושלם התנדבו לבית האלהים להעמידו על מכונו
    kjvRefs:
    - Ezra 2:68
    kjvOsis:
    - Ezra.2.68
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
