  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.2
- type: TanakhVerse
  data:
    osis: Ezra.3.1
    scripture: tanakh
    name: Tanakh Ezra 3:1
    ref: Ezra 3:1
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 20838
    text: And when the seventh month was come, and the children of Israel were in the cities, the people gathered themselves together as one man to Jerusalem.
    translation: JPS 1917
    original: וַיִּגַּע הַחֹדֶשׁ הַשְּׁבִיעִי וּבְנֵי יִשְׂרָאֵל בֶּעָרִים וַיֵּאָסְפוּ הָעָם כְּאִישׁ אֶחָד אֶל־יְרוּשָׁלִָם׃
    hebrewPlain: ויגע החדש השביעי ובני ישראל בערים ויאספו העם כאיש אחד אל ירושלם
    kjvRefs:
    - Ezra 3:1
    kjvOsis:
    - Ezra.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.2
    scripture: tanakh
    name: Tanakh Ezra 3:2
    ref: Ezra 3:2
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 20839
    text: Then stood up Jeshua the son of Jozadak, and his brethren the priests, and Zerubbabel the son of Shealtiel, and his brethren, and builded the altar of the God of Israel, to offer burnt-offerings thereon, as it is written in the Law of Moses the man of God.
    translation: JPS 1917
    original: וַיָּקָם יֵשׁוּעַ בֶּן־יוֹצָדָק וְאֶחָיו הַכֹּהֲנִים וּזְרֻבָּבֶל בֶּן־שְׁאַלְתִּיאֵל וְאֶחָיו וַיִּבְנוּ אֶת־מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל לְהַעֲלוֹת עָלָיו עֹלוֹת כַּכָּתוּב בְּתוֹרַת מֹשֶׁה אִישׁ־הָאֱלֹהִים׃
    hebrewPlain: ויקם ישוע בן יוצדק ואחיו הכהנים וזרבבל בן שאלתיאל ואחיו ויבנו את מזבח אלהי ישראל להעלות עליו עלות ככתוב בתורת משה איש האלהים
    kjvRefs:
    - Ezra 3:2
    kjvOsis:
    - Ezra.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.3
    scripture: tanakh
    name: Tanakh Ezra 3:3
    ref: Ezra 3:3
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 20840
    text: And they set the altar upon its bases; for fear was upon them because of the people of the countries, and they offered burnt-offerings thereon unto the LORD, even burnt-offerings morning and evening.
    translation: JPS 1917
    original: וַיָּכִינוּ הַמִּזְבֵּחַ עַל־מְכוֹנֹתָיו כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת ויעל [וַיַּעֲלוּ] עָלָיו עֹלוֹת לַיהוָה עֹלוֹת לַבֹּקֶר וְלָעָרֶב׃
    hebrewPlain: ויכינו המזבח על מכונתיו כי באימה עליהם מעמי הארצות ויעל [ויעלו] עליו עלות ליהוה עלות לבקר ולערב
    kjvRefs:
    - Ezra 3:3
    kjvOsis:
    - Ezra.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.4
    scripture: tanakh
    name: Tanakh Ezra 3:4
    ref: Ezra 3:4
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 20841
    text: And they kept the feast of tabernacles, as it is written, and offered the daily burnt-offerings by number, according to the ordinance, as the duty of every day required;
    translation: JPS 1917
    original: וַיַּעֲשׂוּ אֶת־חַג הַסֻּכּוֹת כַּכָּתוּב וְעֹלַת יוֹם בְּיוֹם בְּמִסְפָּר כְּמִשְׁפַּט דְּבַר־יוֹם בְּיוֹמוֹ׃
    hebrewPlain: ויעשו את חג הסכות ככתוב ועלת יום ביום במספר כמשפט דבר יום ביומו
    kjvRefs:
    - Ezra 3:4
    kjvOsis:
    - Ezra.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.5
    scripture: tanakh
    name: Tanakh Ezra 3:5
    ref: Ezra 3:5
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 20842
    text: and afterward the continual burnt-offering, and the offerings of the new moons, and of all the appointed seasons of the LORD that were hallowed, and of every one that willingly offered a freewill-offering unto the LORD.
    translation: JPS 1917
    original: וְאַחֲרֵיכֵן עֹלַת תָּמִיד וְלֶחֳדָשִׁים וּלְכָל־מוֹעֲדֵי יְהוָה הַמְקֻדָּשִׁים וּלְכֹל מִתְנַדֵּב נְדָבָה לַיהוָה׃
    hebrewPlain: ואחריכן עלת תמיד ולחדשים ולכל מועדי יהוה המקדשים ולכל מתנדב נדבה ליהוה
    kjvRefs:
    - Ezra 3:5
    kjvOsis:
    - Ezra.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.6
    scripture: tanakh
    name: Tanakh Ezra 3:6
    ref: Ezra 3:6
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 20843
    text: From the first day of the seventh month began they to offer burnt-offerings unto the LORD; but the foundation of the temple of the LORD was not yet laid.
    translation: JPS 1917
    original: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי הֵחֵלּוּ לְהַעֲלוֹת עֹלוֹת לַיהוָה וְהֵיכַל יְהוָה לֹא יֻסָּד׃
    hebrewPlain: מיום אחד לחדש השביעי החלו להעלות עלות ליהוה והיכל יהוה לא יסד
    kjvRefs:
    - Ezra 3:6
    kjvOsis:
    - Ezra.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.7
    scripture: tanakh
    name: Tanakh Ezra 3:7
    ref: Ezra 3:7
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 20844
    text: They gave money also unto the hewers, and to the carpenters; and food, and drink, and oil, unto them of Zidon, and to them of Tyre, to bring cedar-trees from Lebanon to the sea, unto Joppa, according to the grant that they had of Cyrus king of Persia.
    translation: JPS 1917
    original: וַיִּתְּנוּ־כֶסֶף לַחֹצְבִים וְלֶחָרָשִׁים וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן לַצִּדֹנִים וְלַצֹּרִים לְהָבִיא עֲצֵי אֲרָזִים מִן־הַלְּבָנוֹן אֶל־יָם יָפוֹא כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ־פָּרַס עֲלֵיהֶם׃
    hebrewPlain: ויתנו כסף לחצבים ולחרשים ומאכל ומשתה ושמן לצדנים ולצרים להביא עצי ארזים מן הלבנון אל ים יפוא כרשיון כורש מלך פרס עליהם
    kjvRefs:
    - Ezra 3:7
    kjvOsis:
    - Ezra.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
