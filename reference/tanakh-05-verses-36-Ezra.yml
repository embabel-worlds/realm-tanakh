- type: TanakhVerse
  data:
    osis: Ezra.8.35
    scripture: tanakh
    name: Tanakh Ezra 8:35
    ref: Ezra 8:35
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 35
    ordinal: 20976
    text: The children of the captivity, that were come out of exile, offered burnt-offerings unto the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he-goats for a sin-offering; all this was a burnt-offering unto the LORD.
    translation: JPS 1917
    original: הַבָּאִים מֵהַשְּׁבִי בְנֵי־הַגּוֹלָה הִקְרִיבוּ עֹלוֹת לֵאלֹהֵי יִשְׂרָאֵל פָּרִים שְׁנֵים־עָשָׂר עַל־כָּל־יִשְׂרָאֵל אֵילִים תִּשְׁעִים וְשִׁשָּׁה כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה צְפִירֵי חַטָּאת שְׁנֵים עָשָׂר הַכֹּל עוֹלָה לַיהוָה׃
    hebrewPlain: הבאים מהשבי בני הגולה הקריבו עלות לאלהי ישראל פרים שנים עשר על כל ישראל אילים תשעים וששה כבשים שבעים ושבעה צפירי חטאת שנים עשר הכל עולה ליהוה
    kjvRefs:
    - Ezra 8:35
    kjvOsis:
    - Ezra.8.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.8.36
    scripture: tanakh
    name: Tanakh Ezra 8:36
    ref: Ezra 8:36
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 36
    ordinal: 20977
    text: And they delivered the king’s commissions unto the king’s satraps, and to the governors beyond the River; and they furthered the people and the house of God.
    translation: JPS 1917
    original: וַיִּתְּנוּ אֶת־דָּתֵי הַמֶּלֶךְ לַאֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ וּפַחֲווֹת עֵבֶר הַנָּהָר וְנִשְּׂאוּ אֶת־הָעָם וְאֶת־בֵּית־הָאֱלֹהִים׃
    hebrewPlain: ויתנו את דתי המלך לאחשדרפני המלך ופחוות עבר הנהר ונשאו את העם ואת בית האלהים
    kjvRefs:
    - Ezra 8:36
    kjvOsis:
    - Ezra.8.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.8
- type: TanakhVerse
  data:
    osis: Ezra.9.1
    scripture: tanakh
    name: Tanakh Ezra 9:1
    ref: Ezra 9:1
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 20978
    text: 'Now when these things were done, the princes drew near unto me, saying: ‘The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, doing according to their abominations, even of the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.'
    translation: JPS 1917
    original: וּכְכַלּוֹת אֵלֶּה נִגְּשׁוּ אֵלַי הַשָּׂרִים לֵאמֹר לֹא־נִבְדְּלוּ הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם מֵעַמֵּי הָאֲרָצוֹת כְּתוֹעֲבֹתֵיהֶם לַכְּנַעֲנִי הַחִתִּי הַפְּרִזִּי הַיְבוּסִי הָעַמֹּנִי הַמֹּאָבִי הַמִּצְרִי וְהָאֱמֹרִי׃
    hebrewPlain: וככלות אלה נגשו אלי השרים לאמר לא נבדלו העם ישראל והכהנים והלוים מעמי הארצות כתועבתיהם לכנעני החתי הפרזי היבוסי העמני המאבי המצרי והאמרי
    kjvRefs:
    - Ezra 9:1
    kjvOsis:
    - Ezra.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.2
    scripture: tanakh
    name: Tanakh Ezra 9:2
    ref: Ezra 9:2
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 20979
    text: For they have taken of their daughters for themselves and for their sons; so that the holy seed have mingled themselves with the peoples of the lands; yea, the hand of the princes and rulers hath been first in this faithlessness.’
    translation: JPS 1917
    original: כִּי־נָשְׂאוּ מִבְּנֹתֵיהֶם לָהֶם וְלִבְנֵיהֶם וְהִתְעָרְבוּ זֶרַע הַקֹּדֶשׁ בְּעַמֵּי הָאֲרָצוֹת וְיַד הַשָּׂרִים וְהַסְּגָנִים הָיְתָה בַּמַּעַל הַזֶּה רִאשׁוֹנָה׃
    hebrewPlain: כי נשאו מבנתיהם להם ולבניהם והתערבו זרע הקדש בעמי הארצות ויד השרים והסגנים היתה במעל הזה ראשונה
    kjvRefs:
    - Ezra 9:2
    kjvOsis:
    - Ezra.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.3
    scripture: tanakh
    name: Tanakh Ezra 9:3
    ref: Ezra 9:3
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 20980
    text: And when I heard this thing, I rent my garment and my mantle, and plucked off the hair of my head and of my beard, and sat down appalled.
    translation: JPS 1917
    original: וּכְשָׁמְעִי אֶת־הַדָּבָר הַזֶּה קָרַעְתִּי אֶת־בִּגְדִי וּמְעִילִי וָאֶמְרְטָה מִשְּׂעַר רֹאשִׁי וּזְקָנִי וָאֵשְׁבָה מְשׁוֹמֵם׃
    hebrewPlain: וכשמעי את הדבר הזה קרעתי את בגדי ומעילי ואמרטה משער ראשי וזקני ואשבה משומם
    kjvRefs:
    - Ezra 9:3
    kjvOsis:
    - Ezra.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.4
    scripture: tanakh
    name: Tanakh Ezra 9:4
    ref: Ezra 9:4
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 20981
    text: Then were assembled unto me every one that trembled at the words of the God of Israel, because of the faithlessness of them of the captivity; and I sat appalled until the evening offering.
    translation: JPS 1917
    original: וְאֵלַי יֵאָסְפוּ כֹּל חָרֵד בְּדִבְרֵי אֱלֹהֵי־יִשְׂרָאֵל עַל מַעַל הַגּוֹלָה וַאֲנִי יֹשֵׁב מְשׁוֹמֵם עַד לְמִנְחַת הָעָרֶב׃
    hebrewPlain: ואלי יאספו כל חרד בדברי אלהי ישראל על מעל הגולה ואני ישב משומם עד למנחת הערב
    kjvRefs:
    - Ezra 9:4
    kjvOsis:
    - Ezra.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.5
    scripture: tanakh
    name: Tanakh Ezra 9:5
    ref: Ezra 9:5
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 20982
    text: And at the evening offering I arose up from my fasting, even with my garment and my mantle rent; and I fell upon my knees, and spread out my hands unto the LORD my God;
    translation: JPS 1917
    original: וּבְמִנְחַת הָעֶרֶב קַמְתִּי מִתַּעֲנִיתִי וּבְקָרְעִי בִגְדִי וּמְעִילִי וָאֶכְרְעָה עַל־בִּרְכַּי וָאֶפְרְשָׂה כַפַּי אֶל־יְהוָה אֱלֹהָי׃
    hebrewPlain: ובמנחת הערב קמתי מתעניתי ובקרעי בגדי ומעילי ואכרעה על ברכי ואפרשה כפי אל יהוה אלהי
    kjvRefs:
    - Ezra 9:5
    kjvOsis:
    - Ezra.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.6
    scripture: tanakh
    name: Tanakh Ezra 9:6
    ref: Ezra 9:6
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 20983
    text: 'and I said: ‘O my God, I am ashamed and blush to lift up my face to Thee, my God; for our iniquities are increased over our head, and our guiltiness is grown up unto the heavens.'
    translation: JPS 1917
    original: וָאֹמְרָה אֱלֹהַי בֹּשְׁתִּי וְנִכְלַמְתִּי לְהָרִים אֱלֹהַי פָּנַי אֵלֶיךָ כִּי עֲוֺנֹתֵינוּ רָבוּ לְמַעְלָה רֹּאשׁ וְאַשְׁמָתֵנוּ גָדְלָה עַד לַשָּׁמָיִם׃
    hebrewPlain: ואמרה אלהי בשתי ונכלמתי להרים אלהי פני אליך כי עונתינו רבו למעלה ראש ואשמתנו גדלה עד לשמים
    kjvRefs:
    - Ezra 9:6
    kjvOsis:
    - Ezra.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.7
    scripture: tanakh
    name: Tanakh Ezra 9:7
    ref: Ezra 9:7
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 20984
    text: Since the days of our fathers we have been exceeding guilty unto this day; and for our iniquities have we, our kings, and our priests, been delivered into the hand of the kings of the lands, to the sword, to captivity, and to spoiling, and to confusion of face, as it is this day.
    translation: JPS 1917
    original: מִימֵי אֲבֹתֵינוּ אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה עַד הַיּוֹם הַזֶּה וּבַעֲוֺנֹתֵינוּ נִתַּנּוּ אֲנַחְנוּ מְלָכֵינוּ כֹהֲנֵינוּ בְּיַד מַלְכֵי הָאֲרָצוֹת בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה וּבְבֹשֶׁת פָּנִים כְּהַיּוֹם הַזֶּה׃
    hebrewPlain: מימי אבתינו אנחנו באשמה גדלה עד היום הזה ובעונתינו נתנו אנחנו מלכינו כהנינו ביד מלכי הארצות בחרב בשבי ובבזה ובבשת פנים כהיום הזה
    kjvRefs:
    - Ezra 9:7
    kjvOsis:
    - Ezra.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.8
    scripture: tanakh
    name: Tanakh Ezra 9:8
    ref: Ezra 9:8
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 20985
    text: And now for a little moment grace hath been shown from the LORD our God, to leave us a remnant to escape, and to give us a nail in His holy place, that our God may lighten our eyes, and give us a little reviving in our bondage.
    translation: JPS 1917
    original: וְעַתָּה כִּמְעַט־רֶגַע הָיְתָה תְחִנָּה מֵאֵת יְהוָה אֱלֹהֵינוּ לְהַשְׁאִיר לָנוּ פְּלֵיטָה וְלָתֶת־לָנוּ יָתֵד בִּמְקוֹם קָדְשׁוֹ לְהָאִיר עֵינֵינוּ אֱלֹהֵינוּ וּלְתִתֵּנוּ מִחְיָה מְעַט בְּעַבְדֻתֵנוּ׃
    hebrewPlain: ועתה כמעט רגע היתה תחנה מאת יהוה אלהינו להשאיר לנו פליטה ולתת לנו יתד במקום קדשו להאיר עינינו אלהינו ולתתנו מחיה מעט בעבדתנו
    kjvRefs:
    - Ezra 9:8
    kjvOsis:
    - Ezra.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.9
    scripture: tanakh
    name: Tanakh Ezra 9:9
    ref: Ezra 9:9
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 20986
    text: For we are bondmen; yet our God hath not forsaken us in our bondage, but hath extended mercy unto us in the sight of the kings of Persia, to give us a reviving, to set up the house of our God, and to repair the ruins thereof, and to give us a fence in Judah and in Jerusalem.
    translation: JPS 1917
    original: כִּי־עֲבָדִים אֲנַחְנוּ וּבְעַבְדֻתֵנוּ לֹא עֲזָבָנוּ אֱלֹהֵינוּ וַיַּט־עָלֵינוּ חֶסֶד לִפְנֵי מַלְכֵי פָרַס לָתֶת־לָנוּ מִחְיָה לְרוֹמֵם אֶת־בֵּית אֱלֹהֵינוּ וּלְהַעֲמִיד אֶת־חָרְבֹתָיו וְלָתֶת־לָנוּ גָדֵר בִּיהוּדָה וּבִירוּשָׁלִָם׃
    hebrewPlain: כי עבדים אנחנו ובעבדתנו לא עזבנו אלהינו ויט עלינו חסד לפני מלכי פרס לתת לנו מחיה לרומם את בית אלהינו ולהעמיד את חרבתיו ולתת לנו גדר ביהודה ובירושלם
    kjvRefs:
    - Ezra 9:9
    kjvOsis:
    - Ezra.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.10
    scripture: tanakh
    name: Tanakh Ezra 9:10
    ref: Ezra 9:10
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 20987
    text: And now, O our God, what shall we say after this? for we have forsaken Thy commandments,
    translation: JPS 1917
    original: וְעַתָּה מַה־נֹּאמַר אֱלֹהֵינוּ אַחֲרֵי־זֹאת כִּי עָזַבְנוּ מִצְוֺתֶיךָ׃
    hebrewPlain: ועתה מה נאמר אלהינו אחרי זאת כי עזבנו מצותיך
    kjvRefs:
    - Ezra 9:10
    kjvOsis:
    - Ezra.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.11
    scripture: tanakh
    name: Tanakh Ezra 9:11
    ref: Ezra 9:11
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 20988
    text: 'which Thou hast commanded by Thy servants the prophets, saying: The land, unto which ye go to possess it, is an unclean land through the uncleanness of the peoples of the lands, through their abominations, wherewith they have filled it from one end to another with their filthiness.'
    translation: JPS 1917
    original: אֲשֶׁר צִוִּיתָ בְּיַד עֲבָדֶיךָ הַנְּבִיאִים לֵאמֹר הָאָרֶץ אֲשֶׁר אַתֶּם בָּאִים לְרִשְׁתָּהּ אֶרֶץ נִדָּה הִיא בְּנִדַּת עַמֵּי הָאֲרָצוֹת בְּתוֹעֲבֹתֵיהֶם אֲשֶׁר מִלְאוּהָ מִפֶּה אֶל־פֶּה בְּטֻמְאָתָם׃
    hebrewPlain: אשר צוית ביד עבדיך הנביאים לאמר הארץ אשר אתם באים לרשתה ארץ נדה היא בנדת עמי הארצות בתועבתיהם אשר מלאוה מפה אל פה בטמאתם
    kjvRefs:
    - Ezra 9:11
    kjvOsis:
    - Ezra.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.12
    scripture: tanakh
    name: Tanakh Ezra 9:12
    ref: Ezra 9:12
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 20989
    text: Now therefore give not your daughters unto their sons, neither take their daughters unto your sons, nor seek their peace or their prosperity for ever; that ye may be strong, and eat the good of the land, and leave it for an inheritance to your children for ever.
    translation: JPS 1917
    original: וְעַתָּה בְּנוֹתֵיכֶם אַל־תִּתְּנוּ לִבְנֵיהֶם וּבְנֹתֵיהֶם אַל־תִּשְׂאוּ לִבְנֵיכֶם וְלֹא־תִדְרְשׁוּ שְׁלֹמָם וְטוֹבָתָם עַד־עוֹלָם לְמַעַן תֶּחֶזְקוּ וַאֲכַלְתֶּם אֶת־טוּב הָאָרֶץ וְהוֹרַשְׁתֶּם לִבְנֵיכֶם עַד־עוֹלָם׃
    hebrewPlain: ועתה בנותיכם אל תתנו לבניהם ובנתיהם אל תשאו לבניכם ולא תדרשו שלמם וטובתם עד עולם למען תחזקו ואכלתם את טוב הארץ והורשתם לבניכם עד עולם
    kjvRefs:
    - Ezra 9:12
    kjvOsis:
    - Ezra.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.13
    scripture: tanakh
    name: Tanakh Ezra 9:13
    ref: Ezra 9:13
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 20990
    text: And after all that is come upon us for our evil deeds, and for our great guilt, seeing that Thou our God hast punished us less than our iniquities deserve, and hast given us such a remnant,
    translation: JPS 1917
    original: וְאַחֲרֵי כָּל־הַבָּא עָלֵינוּ בְּמַעֲשֵׂינוּ הָרָעִים וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה כִּי אַתָּה אֱלֹהֵינוּ חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ וְנָתַתָּה לָּנוּ פְּלֵיטָה כָּזֹאת׃
    hebrewPlain: ואחרי כל הבא עלינו במעשינו הרעים ובאשמתנו הגדלה כי אתה אלהינו חשכת למטה מעוננו ונתתה לנו פליטה כזאת
    kjvRefs:
    - Ezra 9:13
    kjvOsis:
    - Ezra.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.14
    scripture: tanakh
    name: Tanakh Ezra 9:14
    ref: Ezra 9:14
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 20991
    text: shall we again break Thy commandments, and make marriages with the peoples that do these abominations? wouldest not Thou be angry with us till Thou hadst consumed us, so that there should be no remnant, nor any to escape?
    translation: JPS 1917
    original: הֲנָשׁוּב לְהָפֵר מִצְוֺתֶיךָ וּלְהִתְחַתֵּן בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה הֲלוֹא תֶאֱנַף־בָּנוּ עַד־כַּלֵּה לְאֵין שְׁאֵרִית וּפְלֵיטָה׃
    hebrewPlain: הנשוב להפר מצותיך ולהתחתן בעמי התעבות האלה הלוא תאנף בנו עד כלה לאין שארית ופליטה
    kjvRefs:
    - Ezra 9:14
    kjvOsis:
    - Ezra.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.9.15
    scripture: tanakh
    name: Tanakh Ezra 9:15
    ref: Ezra 9:15
    book: Ezra
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 20992
    text: O LORD, the God of Israel, Thou art righteous; for we are left a remnant that is escaped, as it is this day; behold, we are before Thee in our guiltiness; for none can stand before Thee because of this.’
    translation: JPS 1917
    original: יְהוָה אֱלֹהֵי יִשְׂרָאֵל צַדִּיק אַתָּה כִּי־נִשְׁאַרְנוּ פְלֵיטָה כְּהַיּוֹם הַזֶּה הִנְנוּ לְפָנֶיךָ בְּאַשְׁמָתֵינוּ כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל־זֹאת׃
    hebrewPlain: יהוה אלהי ישראל צדיק אתה כי נשארנו פליטה כהיום הזה הננו לפניך באשמתינו כי אין לעמוד לפניך על זאת
    kjvRefs:
    - Ezra 9:15
    kjvOsis:
    - Ezra.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.9
- type: TanakhVerse
  data:
    osis: Ezra.10.1
    scripture: tanakh
    name: Tanakh Ezra 10:1
    ref: Ezra 10:1
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 20993
    text: Now while Ezra prayed, and made confession, weeping and casting himself down before the house of God, there was gathered together unto him out of Israel a very great congregation of men and women and children; for the people wept very sore.
    translation: JPS 1917
    original: וּכְהִתְפַּלֵּל עֶזְרָא וּכְהִתְוַדֹּתוֹ בֹּכֶה וּמִתְנַפֵּל לִפְנֵי בֵּית הָאֱלֹהִים נִקְבְּצוּ אֵלָיו מִיִּשְׂרָאֵל קָהָל רַב־מְאֹד אֲנָשִׁים וְנָשִׁים וִילָדִים כִּי־בָכוּ הָעָם הַרְבֵּה־בֶכֶה׃
    hebrewPlain: וכהתפלל עזרא וכהתודתו בכה ומתנפל לפני בית האלהים נקבצו אליו מישראל קהל רב מאד אנשים ונשים וילדים כי בכו העם הרבה בכה
    kjvRefs:
    - Ezra 10:1
    kjvOsis:
    - Ezra.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.2
    scripture: tanakh
    name: Tanakh Ezra 10:2
    ref: Ezra 10:2
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 20994
    text: 'And Shecaniah the son of Jehiel, one of the sons of Elam, answered and said unto Ezra: ‘We have broken faith with our God, and have married foreign women of the peoples of the land; yet now there is hope for Israel concerning this thing.'
    translation: JPS 1917
    original: וַיַּעַן שְׁכַנְיָה בֶן־יְחִיאֵל מִבְּנֵי עולם [עֵילָם] וַיֹּאמֶר לְעֶזְרָא אֲנַחְנוּ מָעַלְנוּ בֵאלֹהֵינוּ וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת מֵעַמֵּי הָאָרֶץ וְעַתָּה יֵשׁ־מִקְוֶה לְיִשְׂרָאֵל עַל־זֹאת׃
    hebrewPlain: ויען שכניה בן יחיאל מבני עולם [עילם] ויאמר לעזרא אנחנו מעלנו באלהינו ונשב נשים נכריות מעמי הארץ ועתה יש מקוה לישראל על זאת
    kjvRefs:
    - Ezra 10:2
    kjvOsis:
    - Ezra.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.3
    scripture: tanakh
    name: Tanakh Ezra 10:3
    ref: Ezra 10:3
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 20995
    text: Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of the LORD, and of those that tremble at the commandment of our God; and let it be done according to the law.
    translation: JPS 1917
    original: וְעַתָּה נִכְרָת־בְּרִית לֵאלֹהֵינוּ לְהוֹצִיא כָל־נָשִׁים וְהַנּוֹלָד מֵהֶם בַּעֲצַת אֲדֹנָי וְהַחֲרֵדִים בְּמִצְוַת אֱלֹהֵינוּ וְכַתּוֹרָה יֵעָשֶׂה׃
    hebrewPlain: ועתה נכרת ברית לאלהינו להוציא כל נשים והנולד מהם בעצת אדני והחרדים במצות אלהינו וכתורה יעשה
    kjvRefs:
    - Ezra 10:3
    kjvOsis:
    - Ezra.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.4
    scripture: tanakh
    name: Tanakh Ezra 10:4
    ref: Ezra 10:4
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 20996
    text: Arise; for the matter belongeth unto thee, and we are with thee; be of good courage, and do it.’
    translation: JPS 1917
    original: קוּם כִּי־עָלֶיךָ הַדָּבָר וַאֲנַחְנוּ עִמָּךְ חֲזַק וַעֲשֵׂה׃
    hebrewPlain: קום כי עליך הדבר ואנחנו עמך חזק ועשה
    kjvRefs:
    - Ezra 10:4
    kjvOsis:
    - Ezra.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.5
    scripture: tanakh
    name: Tanakh Ezra 10:5
    ref: Ezra 10:5
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 20997
    text: Then arose Ezra, and made the chiefs of the priests, the Levites, and all Israel, to swear that they would do according to this word. So they swore.
    translation: JPS 1917
    original: וַיָּקָם עֶזְרָא וַיַּשְׁבַּע אֶת־שָׂרֵי הַכֹּהֲנִים הַלְוִיִּם וְכָל־יִשְׂרָאֵל לַעֲשׂוֹת כַּדָּבָר הַזֶּה וַיִּשָּׁבֵעוּ׃
    hebrewPlain: ויקם עזרא וישבע את שרי הכהנים הלוים וכל ישראל לעשות כדבר הזה וישבעו
    kjvRefs:
    - Ezra 10:5
    kjvOsis:
    - Ezra.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.6
    scripture: tanakh
    name: Tanakh Ezra 10:6
    ref: Ezra 10:6
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 20998
    text: Then Ezra rose up from before the house of God, and went into the chamber of Jehohanan the son of Eliashib; and when he came thither, he did eat no bread, nor drink water; for he mourned because of the faithlessness of them of the captivity.
    translation: JPS 1917
    original: וַיָּקָם עֶזְרָא מִלִּפְנֵי בֵּית הָאֱלֹהִים וַיֵּלֶךְ אֶל־לִשְׁכַּת יְהוֹחָנָן בֶּן־אֶלְיָשִׁיב וַיֵּלֶךְ שָׁם לֶחֶם לֹא־אָכַל וּמַיִם לֹא־שָׁתָה כִּי מִתְאַבֵּל עַל־מַעַל הַגּוֹלָה׃
    hebrewPlain: ויקם עזרא מלפני בית האלהים וילך אל לשכת יהוחנן בן אלישיב וילך שם לחם לא אכל ומים לא שתה כי מתאבל על מעל הגולה
    kjvRefs:
    - Ezra 10:6
    kjvOsis:
    - Ezra.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.7
    scripture: tanakh
    name: Tanakh Ezra 10:7
    ref: Ezra 10:7
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 20999
    text: And they made proclamation throughout Judah and Jerusalem unto all the children of the captivity, that they should gather themselves together unto Jerusalem;
    translation: JPS 1917
    original: וַיַּעֲבִירוּ קוֹל בִּיהוּדָה וִירוּשָׁלִַם לְכֹל בְּנֵי הַגּוֹלָה לְהִקָּבֵץ יְרוּשָׁלִָם׃
    hebrewPlain: ויעבירו קול ביהודה וירושלם לכל בני הגולה להקבץ ירושלם
    kjvRefs:
    - Ezra 10:7
    kjvOsis:
    - Ezra.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.8
    scripture: tanakh
    name: Tanakh Ezra 10:8
    ref: Ezra 10:8
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 21000
    text: and that whosoever came not within three days, according to the counsel of the princes and the elders, all his substance should be forfeited, and himself separated from the congregation of the captivity.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר לֹא־יָבוֹא לִשְׁלֹשֶׁת הַיָּמִים כַּעֲצַת הַשָּׂרִים וְהַזְּקֵנִים יָחֳרַם כָּל־רְכוּשׁוֹ וְהוּא יִבָּדֵל מִקְּהַל הַגּוֹלָה׃
    hebrewPlain: וכל אשר לא יבוא לשלשת הימים כעצת השרים והזקנים יחרם כל רכושו והוא יבדל מקהל הגולה
    kjvRefs:
    - Ezra 10:8
    kjvOsis:
    - Ezra.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.9
    scripture: tanakh
    name: Tanakh Ezra 10:9
    ref: Ezra 10:9
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 21001
    text: Then all the men of Judah and Benjamin gathered themselves together unto Jerusalem within the three days; it was the ninth month, on the twentieth day of the month; and all the people sat in the broad place before the house of God, trembling because of this matter, and for the great rain.
    translation: JPS 1917
    original: וַיִּקָּבְצוּ כָל־אַנְשֵׁי־יְהוּדָה וּבִנְיָמִן יְרוּשָׁלִַם לִשְׁלֹשֶׁת הַיָּמִים הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ וַיֵּשְׁבוּ כָל־הָעָם בִּרְחוֹב בֵּית הָאֱלֹהִים מַרְעִידִים עַל־הַדָּבָר וּמֵהַגְּשָׁמִים׃
    hebrewPlain: ויקבצו כל אנשי יהודה ובנימן ירושלם לשלשת הימים הוא חדש התשיעי בעשרים בחדש וישבו כל העם ברחוב בית האלהים מרעידים על הדבר ומהגשמים
    kjvRefs:
    - Ezra 10:9
    kjvOsis:
    - Ezra.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.10
    scripture: tanakh
    name: Tanakh Ezra 10:10
    ref: Ezra 10:10
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 21002
    text: 'And Ezra the priest stood up, and said unto them: ‘Ye have broken faith, and have married foreign women, to increase the guilt of Israel.'
    translation: JPS 1917
    original: וַיָּקָם עֶזְרָא הַכֹּהֵן וַיֹּאמֶר אֲלֵהֶם אַתֶּם מְעַלְתֶּם וַתֹּשִׁיבוּ נָשִׁים נָכְרִיּוֹת לְהוֹסִיף עַל־אַשְׁמַת יִשְׂרָאֵל׃
    hebrewPlain: ויקם עזרא הכהן ויאמר אלהם אתם מעלתם ותשיבו נשים נכריות להוסיף על אשמת ישראל
    kjvRefs:
    - Ezra 10:10
    kjvOsis:
    - Ezra.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.10
- type: TanakhVerse
  data:
    osis: Ezra.10.11
    scripture: tanakh
    name: Tanakh Ezra 10:11
    ref: Ezra 10:11
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 21003
    text: Now therefore make confession unto the LORD, the God of your fathers, and do His pleasure; and separate yourselves from the peoples of the land, and from the foreign women.’
    translation: JPS 1917
    original: וְעַתָּה תְּנוּ תוֹדָה לַיהוָה אֱלֹהֵי־אֲבֹתֵיכֶם וַעֲשׂוּ רְצוֹנוֹ וְהִבָּדְלוּ מֵעַמֵּי הָאָרֶץ וּמִן־הַנָּשִׁים הַנָּכְרִיּוֹת׃
    hebrewPlain: ועתה תנו תודה ליהוה אלהי אבתיכם ועשו רצונו והבדלו מעמי הארץ ומן הנשים הנכריות
    kjvRefs:
