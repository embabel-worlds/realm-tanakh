    original: וַיִּתְּנוּ יָדָם לְהוֹצִיא נְשֵׁיהֶם וַאֲשֵׁמִים אֵיל־צֹאן עַל־אַשְׁמָתָם׃
    hebrewPlain: ויתנו ידם להוציא נשיהם ואשמים איל צאן על אשמתם
