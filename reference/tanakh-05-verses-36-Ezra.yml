    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 67
    ordinal: 20834
    text: their camels, four hundred thirty and five; their asses, six thousand seven hundred and twenty.
    translation: JPS 1917
    original: גְּמַלֵּיהֶם אַרְבַּע מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה חֲמֹרִים שֵׁשֶׁת אֲלָפִים שְׁבַע מֵאוֹת וְעֶשְׂרִים׃
