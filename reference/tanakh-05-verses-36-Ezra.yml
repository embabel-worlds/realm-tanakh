  data:
    osis: Ezra.2.66
    scripture: tanakh
    name: Tanakh Ezra 2:66
    ref: Ezra 2:66
    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 66
    ordinal: 20833
    text: Their horses were seven hundred thirty and six; their mules, two hundred forty and five;
    translation: JPS 1917
    original: סוּסֵיהֶם שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה פִּרְדֵיהֶם מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה׃
    hebrewPlain: סוסיהם שבע מאות שלשים וששה פרדיהם מאתים ארבעים וחמשה
