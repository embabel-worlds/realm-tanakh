    ref: Ezra 8:11
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 20952
    text: And of the sons of Bebai, Zechariah the son of Bebai; and with him twenty and eight males.
    translation: JPS 1917
    original: וּמִבְּנֵי בֵבַי זְכַרְיָה בֶּן־בֵּבָי וְעִמּוֹ עֶשְׂרִים וּשְׁמֹנָה הַזְּכָרִים׃
