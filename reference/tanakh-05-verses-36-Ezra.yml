    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 62
    ordinal: 20829
    text: These sought their register, that is, the genealogy, but it was not found; therefore were they deemed polluted and put from the priesthood.
    translation: JPS 1917
    original: אֵלֶּה בִּקְשׁוּ כְתָבָם הַמִּתְיַחְשִׂים וְלֹא נִמְצָאוּ וַיְגֹאֲלוּ מִן־הַכְּהֻנָּה׃
    hebrewPlain: אלה בקשו כתבם המתיחשים ולא נמצאו ויגאלו מן הכהנה
