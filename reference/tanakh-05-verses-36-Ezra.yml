    translation: JPS 1917
    original: וּמִבְּנֵי בִגְוַי עוּתַי וזבוד [וְזַכּוּר] וְעִמּוֹ שִׁבְעִים הַזְּכָרִים׃
    hebrewPlain: ומבני בגוי עותי וזבוד [וזכור] ועמו שבעים הזכרים
    kjvRefs:
    - Ezra 8:14
