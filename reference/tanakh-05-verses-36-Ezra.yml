  data:
    osis: Ezra.6.16
    scripture: tanakh
    name: Tanakh Ezra 6:16
    ref: Ezra 6:16
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 20907
    text: And the children of Israel, the priests and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy.
    translation: JPS 1917
    original: וַעֲבַדוּ בְנֵי־יִשְׂרָאֵל כָּהֲנַיָּא וְלֵוָיֵא וּשְׁאָר בְּנֵי־גָלוּתָא חֲנֻכַּת בֵּית־אֱלָהָא דְנָה בְּחֶדְוָה׃
    hebrewPlain: ועבדו בני ישראל כהניא ולויא ושאר בני גלותא חנכת בית אלהא דנה בחדוה
    kjvRefs:
    - Ezra 6:16
    kjvOsis:
    - Ezra.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
