  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.7
    scripture: tanakh
    name: Tanakh Ezra 7:7
    ref: Ezra 7:7
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 20920
    text: And there went up some of the children of Israel, and of the priests, and the Levites, and the singers, and the porters, and the Nethinim, unto Jerusalem, in the seventh year of Artaxerxes the king.
    translation: JPS 1917
    original: וַיַּעֲלוּ מִבְּנֵי־יִשְׂרָאֵל וּמִן־הַכֹּהֲנִים וְהַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים וְהַנְּתִינִים אֶל־יְרוּשָׁלִָם בִּשְׁנַת־שֶׁבַע לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ׃
    hebrewPlain: ויעלו מבני ישראל ומן הכהנים והלוים והמשררים והשערים והנתינים אל ירושלם בשנת שבע לארתחשסתא המלך
    kjvRefs:
    - Ezra 7:7
    kjvOsis:
    - Ezra.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.8
    scripture: tanakh
    name: Tanakh Ezra 7:8
    ref: Ezra 7:8
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 20921
    text: And he came to Jerusalem in the fifth month, which was in the seventh year of the king.
    translation: JPS 1917
    original: וַיָּבֹא יְרוּשָׁלִַם בַּחֹדֶשׁ הַחֲמִישִׁי הִיא שְׁנַת הַשְּׁבִיעִית לַמֶּלֶךְ׃
    hebrewPlain: ויבא ירושלם בחדש החמישי היא שנת השביעית למלך
    kjvRefs:
    - Ezra 7:8
    kjvOsis:
    - Ezra.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.9
    scripture: tanakh
    name: Tanakh Ezra 7:9
    ref: Ezra 7:9
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 20922
    text: For upon the first day of the first month began he to go up from Babylon, and on the first day of the fifth month came he to Jerusalem, according to the good hand of his God upon him.
    translation: JPS 1917
    original: כִּי בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן הוּא יְסֻד הַמַּעֲלָה מִבָּבֶל וּבְאֶחָד לַחֹדֶשׁ הַחֲמִישִׁי בָּא אֶל־יְרוּשָׁלִַם כְּיַד־אֱלֹהָיו הַטּוֹבָה עָלָיו׃
    hebrewPlain: כי באחד לחדש הראשון הוא יסד המעלה מבבל ובאחד לחדש החמישי בא אל ירושלם כיד אלהיו הטובה עליו
    kjvRefs:
    - Ezra 7:9
    kjvOsis:
    - Ezra.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.10
    scripture: tanakh
    name: Tanakh Ezra 7:10
    ref: Ezra 7:10
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 20923
    text: For Ezra had set his heart to seek the law of the LORD, and to do it, and to teach in Israel statutes and ordinances.
    translation: JPS 1917
    original: כִּי עֶזְרָא הֵכִין לְבָבוֹ לִדְרוֹשׁ אֶת־תּוֹרַת יְהוָה וְלַעֲשֹׂת וּלְלַמֵּד בְּיִשְׂרָאֵל חֹק וּמִשְׁפָּט׃
    hebrewPlain: כי עזרא הכין לבבו לדרוש את תורת יהוה ולעשת וללמד בישראל חק ומשפט
    kjvRefs:
    - Ezra 7:10
    kjvOsis:
    - Ezra.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.11
    scripture: tanakh
    name: Tanakh Ezra 7:11
    ref: Ezra 7:11
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 20924
    text: 'Now this is the copy of the letter that the king Artaxerxes gave unto Ezra the priest, the scribe, even the scribe of the words of the commandments of the LORD, and of His statutes to Israel:'
    translation: JPS 1917
    original: וְזֶה פַּרְשֶׁגֶן הַנִּשְׁתְּוָן אֲשֶׁר נָתַן הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא לְעֶזְרָא הַכֹּהֵן הַסֹּפֵר סֹפֵר דִּבְרֵי מִצְוֺת־יְהוָה וְחֻקָּיו עַל־יִשְׂרָאֵל׃
    hebrewPlain: וזה פרשגן הנשתון אשר נתן המלך ארתחשסתא לעזרא הכהן הספר ספר דברי מצות יהוה וחקיו על ישראל
    kjvRefs:
    - Ezra 7:11
    kjvOsis:
    - Ezra.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.12
    scripture: tanakh
    name: Tanakh Ezra 7:12
    ref: Ezra 7:12
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 20925
    text: ’Artaxerxes, king of kings, unto Ezra the priest, the scribe of the Law of the God of heaven, and so forth. And now
    translation: JPS 1917
    original: אַרְתַּחְשַׁסְתְּא מֶלֶךְ מַלְכַיָּא לְעֶזְרָא כָהֲנָא סָפַר דָּתָא דִּי־אֱלָהּ שְׁמַיָּא גְּמִיר וּכְעֶנֶת׃
    hebrewPlain: ארתחשסתא מלך מלכיא לעזרא כהנא ספר דתא די אלה שמיא גמיר וכענת
    kjvRefs:
    - Ezra 7:12
    kjvOsis:
    - Ezra.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.13
    scripture: tanakh
    name: Tanakh Ezra 7:13
    ref: Ezra 7:13
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 20926
    text: I make a decree, that all they of the people of Israel, and their priests and the Levites, in my realm, that are minded of their own free will to go with thee to Jerusalem, go.
    translation: JPS 1917
    original: מִנִּי שִׂים טְעֵם דִּי כָל־מִתְנַדַּב בְּמַלְכוּתִי מִן־עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ יְהָךְ׃
    hebrewPlain: מני שים טעם די כל מתנדב במלכותי מן עמה ישראל וכהנוהי ולויא למהך לירושלם עמך יהך
    kjvRefs:
    - Ezra 7:13
    kjvOsis:
    - Ezra.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.14
    scripture: tanakh
    name: Tanakh Ezra 7:14
    ref: Ezra 7:14
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 20927
    text: Forasmuch as thou art sent of the king and his seven counsellors, to inquire concerning Judah and Jerusalem, according to the law of thy God which is in thy hand;
    translation: JPS 1917
    original: כָּל־קֳבֵל דִּי מִן־קֳדָם מַלְכָּא וְשִׁבְעַת יָעֲטֹהִי שְׁלִיחַ לְבַקָּרָא עַל־יְהוּד וְלִירוּשְׁלֶם בְּדָת אֱלָהָךְ דִּי בִידָךְ׃
    hebrewPlain: כל קבל די מן קדם מלכא ושבעת יעטהי שליח לבקרא על יהוד ולירושלם בדת אלהך די בידך
    kjvRefs:
    - Ezra 7:14
    kjvOsis:
    - Ezra.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.15
    scripture: tanakh
    name: Tanakh Ezra 7:15
    ref: Ezra 7:15
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 20928
    text: and to carry the silver and gold, which the king and his counsellors have freely offered unto the God of Israel, whose habitation is in Jerusalem,
    translation: JPS 1917
    original: וּלְהֵיבָלָה כְּסַף וּדְהַב דִּי־מַלְכָּא וְיָעֲטוֹהִי הִתְנַדַּבוּ לֶאֱלָהּ יִשְׂרָאֵל דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ׃
    hebrewPlain: ולהיבלה כסף ודהב די מלכא ויעטוהי התנדבו לאלה ישראל די בירושלם משכנה
    kjvRefs:
    - Ezra 7:15
    kjvOsis:
    - Ezra.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.16
    scripture: tanakh
    name: Tanakh Ezra 7:16
    ref: Ezra 7:16
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 20929
    text: and all the silver and gold that thou shalt find in all the province of Babylon, with the freewill-offering of the people, and of the priests, offering willingly for the house of their God which is in Jerusalem;
    translation: JPS 1917
    original: וְכֹל כְּסַף וּדְהַב דִּי תְהַשְׁכַּח בְּכֹל מְדִינַת בָּבֶל עִם הִתְנַדָּבוּת עַמָּא וְכָהֲנַיָּא מִתְנַדְּבִין לְבֵית אֱלָהֲהֹם דִּי בִירוּשְׁלֶם׃
    hebrewPlain: וכל כסף ודהב די תהשכח בכל מדינת בבל עם התנדבות עמא וכהניא מתנדבין לבית אלההם די בירושלם
    kjvRefs:
    - Ezra 7:16
    kjvOsis:
    - Ezra.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.17
    scripture: tanakh
    name: Tanakh Ezra 7:17
    ref: Ezra 7:17
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 20930
    text: therefore thou shalt with all diligence buy with this money bullocks, rams, lambs, with their meal-offerings and their drink-offerings, and shalt offer them upon the altar of the house of your God which is in Jerusalem.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה אָסְפַּרְנָא תִקְנֵא בְּכַסְפָּא דְנָה תּוֹרִין דִּכְרִין אִמְּרִין וּמִנְחָתְהוֹן וְנִסְכֵּיהוֹן וּתְקָרֵב הִמּוֹ עַל־מַדְבְּחָה דִּי בֵּית אֱלָהֲכֹם דִּי בִירוּשְׁלֶם׃
    hebrewPlain: כל קבל דנה אספרנא תקנא בכספא דנה תורין דכרין אמרין ומנחתהון ונסכיהון ותקרב המו על מדבחה די בית אלהכם די בירושלם
    kjvRefs:
    - Ezra 7:17
    kjvOsis:
    - Ezra.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.18
    scripture: tanakh
    name: Tanakh Ezra 7:18
    ref: Ezra 7:18
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 20931
    text: And whatsoever shall seem good to thee and to thy brethren to do with the rest of the silver and the gold, that do ye after the will of your God.
    translation: JPS 1917
    original: וּמָה דִי עליך [עֲלָךְ] וְעַל־אחיך [אֶחָךְ] יֵיטַב בִּשְׁאָר כַּסְפָּא וְדַהֲבָה לְמֶעְבַּד כִּרְעוּת אֱלָהֲכֹם תַּעַבְדוּן׃
    hebrewPlain: ומה די עליך [עלך] ועל אחיך [אחך] ייטב בשאר כספא ודהבה למעבד כרעות אלהכם תעבדון
    kjvRefs:
    - Ezra 7:18
    kjvOsis:
    - Ezra.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.19
    scripture: tanakh
    name: Tanakh Ezra 7:19
    ref: Ezra 7:19
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 20932
    text: And the vessels that are given thee for the service of the house of thy God, deliver thou before the God of Jerusalem.
    translation: JPS 1917
    original: וּמָאנַיָּא דִּי־מִתְיַהֲבִין לָךְ לְפָלְחָן בֵּית אֱלָהָךְ הַשְׁלֵם קֳדָם אֱלָהּ יְרוּשְׁלֶם׃
    hebrewPlain: ומאניא די מתיהבין לך לפלחן בית אלהך השלם קדם אלה ירושלם
    kjvRefs:
    - Ezra 7:19
    kjvOsis:
    - Ezra.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.20
    scripture: tanakh
    name: Tanakh Ezra 7:20
    ref: Ezra 7:20
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 20933
    text: And whatsoever more shall be needful for the house of thy God, which thou shalt have occasion to bestow, bestow it out of the king’s treasure-house.
    translation: JPS 1917
    original: וּשְׁאָר חַשְׁחוּת בֵּית אֱלָהָךְ דִּי יִפֶּל־לָךְ לְמִנְתַּן תִּנְתֵּן מִן־בֵּית גִּנְזֵי מַלְכָּא׃
    hebrewPlain: ושאר חשחות בית אלהך די יפל לך למנתן תנתן מן בית גנזי מלכא
    kjvRefs:
    - Ezra 7:20
    kjvOsis:
    - Ezra.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.21
    scripture: tanakh
    name: Tanakh Ezra 7:21
    ref: Ezra 7:21
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 20934
    text: And I, even I Artaxerxes the king, do make a decree to all the treasurers that are beyond the River, that whatsoever Ezra the priest, the scribe of the Law of the God of heaven, shall require of you, it be done with all diligence,
    translation: JPS 1917
    original: וּמִנִּי אֲנָה אַרְתַּחְשַׁסְתְּא מַלְכָּא שִׂים טְעֵם לְכֹל גִּזַּבְרַיָּא דִּי בַּעֲבַר נַהֲרָה דִּי כָל־דִּי יִשְׁאֲלֶנְכוֹן עֶזְרָא כָהֲנָה סָפַר דָּתָא דִּי־אֱלָהּ שְׁמַיָּא אָסְפַּרְנָא יִתְעֲבִד׃
    hebrewPlain: ומני אנה ארתחשסתא מלכא שים טעם לכל גזבריא די בעבר נהרה די כל די ישאלנכון עזרא כהנה ספר דתא די אלה שמיא אספרנא יתעבד
    kjvRefs:
    - Ezra 7:21
    kjvOsis:
    - Ezra.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.22
    scripture: tanakh
    name: Tanakh Ezra 7:22
    ref: Ezra 7:22
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 22
    ordinal: 20935
    text: unto a hundred talents of silver, and to a hundred measures of wheat, and to a hundred baths of wine, and to a hundred baths of oil, and salt without prescribing how much.
    translation: JPS 1917
    original: עַד־כְּסַף כַּכְּרִין מְאָה וְעַד־חִנְטִין כֹּרִין מְאָה וְעַד־חֲמַר בַּתִּין מְאָה וְעַד־בַּתִּין מְשַׁח מְאָה וּמְלַח דִּי־לָא כְתָב׃
    hebrewPlain: עד כסף ככרין מאה ועד חנטין כרין מאה ועד חמר בתין מאה ועד בתין משח מאה ומלח די לא כתב
    kjvRefs:
    - Ezra 7:22
    kjvOsis:
    - Ezra.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.23
    scripture: tanakh
    name: Tanakh Ezra 7:23
    ref: Ezra 7:23
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 23
    ordinal: 20936
    text: Whatsoever is commanded by the God of heaven, let it be done exactly for the house of the God of heaven; for why should there be wrath against the realm of the king and his sons?
    translation: JPS 1917
    original: כָּל־דִּי מִן־טַעַם אֱלָהּ שְׁמַיָּא יִתְעֲבֵד אַדְרַזְדָּא לְבֵית אֱלָהּ שְׁמַיָּא דִּי־לְמָה לֶהֱוֵא קְצַף עַל־מַלְכוּת מַלְכָּא וּבְנוֹהִי׃
    hebrewPlain: כל די מן טעם אלה שמיא יתעבד אדרזדא לבית אלה שמיא די למה להוא קצף על מלכות מלכא ובנוהי
    kjvRefs:
    - Ezra 7:23
    kjvOsis:
    - Ezra.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.24
    scripture: tanakh
    name: Tanakh Ezra 7:24
    ref: Ezra 7:24
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 24
    ordinal: 20937
    text: Also we announce to you, that touching any of the priests and Levites, the singers, porters, Nethinim, or servants of this house of God, it shall not be lawful to impose tribute, impost, or toll, upon them.
    translation: JPS 1917
    original: וּלְכֹם מְהוֹדְעִין דִּי כָל־כָּהֲנַיָּא וְלֵוָיֵא זַמָּרַיָּא תָרָעַיָּא נְתִינַיָּא וּפָלְחֵי בֵּית אֱלָהָא דְנָה מִנְדָּה בְלוֹ וַהֲלָךְ לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם׃
    hebrewPlain: ולכם מהודעין די כל כהניא ולויא זמריא תרעיא נתיניא ופלחי בית אלהא דנה מנדה בלו והלך לא שליט למרמא עליהם
    kjvRefs:
    - Ezra 7:24
    kjvOsis:
    - Ezra.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.25
    scripture: tanakh
    name: Tanakh Ezra 7:25
    ref: Ezra 7:25
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 25
    ordinal: 20938
    text: And thou, Ezra, after the wisdom of thy God that is in thy hand, appoint magistrates and judges, who may judge all the people that are beyond the River, all such as know the laws of thy God; and teach ye him that knoweth them not.
    translation: JPS 1917
    original: וְאַנְתְּ עֶזְרָא כְּחָכְמַת אֱלָהָךְ דִּי־בִידָךְ מֶנִּי שָׁפְטִין וְדַיָּנִין דִּי־לֶהֱוֺן דאנין [דָּאיְנִין] לְכָל־עַמָּה דִּי בַּעֲבַר נַהֲרָה לְכָל־יָדְעֵי דָּתֵי אֱלָהָךְ וְדִי לָא יָדַע תְּהוֹדְעוּן׃
    hebrewPlain: ואנת עזרא כחכמת אלהך די בידך מני שפטין ודינין די להון דאנין [דאינין] לכל עמה די בעבר נהרה לכל ידעי דתי אלהך ודי לא ידע תהודעון
    kjvRefs:
    - Ezra 7:25
    kjvOsis:
    - Ezra.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.26
    scripture: tanakh
    name: Tanakh Ezra 7:26
    ref: Ezra 7:26
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 26
    ordinal: 20939
    text: And whosoever will not do the law of thy God, and the law of the king, let judgment be executed upon him with all diligence, whether it be unto death, or to banishment, or to confiscation of goods, or to imprisonment.’ .
    translation: JPS 1917
    original: וְכָל־דִּי־לָא לֶהֱוֵא עָבֵד דָּתָא דִי־אֱלָהָךְ וְדָתָא דִּי מַלְכָּא אָסְפַּרְנָא דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ הֵן לְמוֹת הֵן לשרשו [לִשְׁרֹשִׁי] הֵן־לַעֲנָשׁ נִכְסִין וְלֶאֱסוּרִין׃
    hebrewPlain: וכל די לא להוא עבד דתא די אלהך ודתא די מלכא אספרנא דינה להוא מתעבד מנה הן למות הן לשרשו [לשרשי] הן לענש נכסין ולאסורין
    kjvRefs:
    - Ezra 7:26
    kjvOsis:
    - Ezra.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
    osis: Ezra.7.27
    scripture: tanakh
    name: Tanakh Ezra 7:27
    ref: Ezra 7:27
    book: Ezra
    section: ketuvim
    chapter: 7
    verse: 27
    ordinal: 20940
    text: Blessed be the LORD, the God of our fathers, who hath put such a thing as this in the king’s heart, to beautify the house of the LORD which is in Jerusalem;
    translation: JPS 1917
    original: בָּרוּךְ יְהוָה אֱלֹהֵי אֲבוֹתֵינוּ אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ לְפָאֵר אֶת־בֵּית יְהוָה אֲשֶׁר בִּירוּשָׁלִָם׃
    hebrewPlain: ברוך יהוה אלהי אבותינו אשר נתן כזאת בלב המלך לפאר את בית יהוה אשר בירושלם
    kjvRefs:
    - Ezra 7:27
    kjvOsis:
    - Ezra.7.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.7
- type: TanakhVerse
  data:
