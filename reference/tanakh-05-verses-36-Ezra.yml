    verse: 8
    ordinal: 20845
    text: Now in the second year of their coming unto the house of God at Jerusalem, in the second month, began Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and the rest of their brethren the priests and the Levites, and all they that were come out of the captivity unto Jerusalem; and appointed the Levites, from twenty years old and upward, to have the oversight of the work of the house of the LORD.
    translation: JPS 1917
    original: וּבַשָּׁנָה הַשֵּׁנִית לְבוֹאָם אֶל־בֵּית הָאֱלֹהִים לִירוּשָׁלִַם בַּחֹדֶשׁ הַשֵּׁנִי הֵחֵלּוּ זְרֻבָּבֶל בֶּן־שְׁאַלְתִּיאֵל וְיֵשׁוּעַ בֶּן־יוֹצָדָק וּשְׁאָר אֲחֵיהֶם הַכֹּהֲנִים וְהַלְוִיִּם וְכָל־הַבָּאִים מֵהַשְּׁבִי יְרוּשָׁלִַם וַיַּעֲמִידוּ אֶת־הַלְוִיִּם מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה לְנַצֵּחַ עַל־מְלֶאכֶת בֵּית־יְהוָה׃
    hebrewPlain: ובשנה השנית לבואם אל בית האלהים לירושלם בחדש השני החלו זרבבל בן שאלתיאל וישוע בן יוצדק ושאר אחיהם הכהנים והלוים וכל הבאים מהשבי ירושלם ויעמידו את הלוים מבן עשרים שנה ומעלה לנצח על מלאכת בית יהוה
    kjvRefs:
    - Ezra 3:8
    kjvOsis:
    - Ezra.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.9
    scripture: tanakh
    name: Tanakh Ezra 3:9
    ref: Ezra 3:9
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 20846
    text: Then stood Jeshua with his sons and his brethren, and Kadmiel and his sons, the sons of Judah, together, to have the oversight of the workmen in the house of God; the sons of Henadad also, with their sons and their brethren the Levites.
    translation: JPS 1917
    original: וַיַּעֲמֹד יֵשׁוּעַ בָּנָיו וְאֶחָיו קַדְמִיאֵל וּבָנָיו בְּנֵי־יְהוּדָה כְּאֶחָד לְנַצֵּחַ עַל־עֹשֵׂה הַמְּלָאכָה בְּבֵית הָאֱלֹהִים בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם׃
    hebrewPlain: ויעמד ישוע בניו ואחיו קדמיאל ובניו בני יהודה כאחד לנצח על עשה המלאכה בבית האלהים בני חנדד בניהם ואחיהם הלוים
    kjvRefs:
    - Ezra 3:9
    kjvOsis:
    - Ezra.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.10
    scripture: tanakh
    name: Tanakh Ezra 3:10
    ref: Ezra 3:10
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 20847
    text: And when the builders laid the foundation of the temple of the LORD, they set the priests in their apparel with trumpets, and the Levites the sons of Asaph with cymbals, to praise the LORD, according to the direction of David king of Israel.
    translation: JPS 1917
    original: וְיִסְּדוּ הַבֹּנִים אֶת־הֵיכַל יְהוָה וַיַּעֲמִידוּ הַכֹּהֲנִים מְלֻבָּשִׁים בַּחֲצֹצְרוֹת וְהַלְוִיִּם בְּנֵי־אָסָף בַּמְצִלְתַּיִם לְהַלֵּל אֶת־יְהוָה עַל־יְדֵי דָּוִיד מֶלֶךְ־יִשְׂרָאֵל׃
    hebrewPlain: ויסדו הבנים את היכל יהוה ויעמידו הכהנים מלבשים בחצצרות והלוים בני אסף במצלתים להלל את יהוה על ידי דויד מלך ישראל
    kjvRefs:
    - Ezra 3:10
    kjvOsis:
    - Ezra.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.11
    scripture: tanakh
    name: Tanakh Ezra 3:11
    ref: Ezra 3:11
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 20848
    text: 'And they sang one to another in praising and giving thanks unto the LORD: ‘for He is good, for His mercy endureth for ever toward Israel.’ And all the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid.'
    translation: JPS 1917
    original: וַיַּעֲנוּ בְּהַלֵּל וּבְהוֹדֹת לַיהוָה כִּי טוֹב כִּי־לְעוֹלָם חַסְדּוֹ עַל־יִשְׂרָאֵל וְכָל־הָעָם הֵרִיעוּ תְרוּעָה גְדוֹלָה בְהַלֵּל לַיהוָה עַל הוּסַד בֵּית־יְהוָה׃
    hebrewPlain: ויענו בהלל ובהודת ליהוה כי טוב כי לעולם חסדו על ישראל וכל העם הריעו תרועה גדולה בהלל ליהוה על הוסד בית יהוה
    kjvRefs:
    - Ezra 3:11
    kjvOsis:
    - Ezra.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.12
    scripture: tanakh
    name: Tanakh Ezra 3:12
    ref: Ezra 3:12
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 20849
    text: But many of the priests and Levites and heads of fathers’ houses, the old men that had seen the first house standing on its foundation, wept with a loud voice, when this house was before their eyes; and many shouted aloud for joy;
    translation: JPS 1917
    original: וְרַבִּים מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת הַזְּקֵנִים אֲשֶׁר רָאוּ אֶת־הַבַּיִת הָרִאשׁוֹן בְּיָסְדוֹ זֶה הַבַּיִת בְּעֵינֵיהֶם בֹּכִים בְּקוֹל גָּדוֹל וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל׃
    hebrewPlain: ורבים מהכהנים והלוים וראשי האבות הזקנים אשר ראו את הבית הראשון ביסדו זה הבית בעיניהם בכים בקול גדול ורבים בתרועה בשמחה להרים קול
    kjvRefs:
    - Ezra 3:12
    kjvOsis:
    - Ezra.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.3.13
    scripture: tanakh
    name: Tanakh Ezra 3:13
    ref: Ezra 3:13
    book: Ezra
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 20850
    text: so that the people could not discern the noise of the shout of joy from the noise of the weeping of the people; for the people shouted with a loud shout, and the noise was heard afar off.
    translation: JPS 1917
    original: וְאֵין הָעָם מַכִּירִים קוֹל תְּרוּעַת הַשִּׂמְחָה לְקוֹל בְּכִי הָעָם כִּי הָעָם מְרִיעִים תְּרוּעָה גְדוֹלָה וְהַקּוֹל נִשְׁמַע עַד־לְמֵרָחוֹק׃
    hebrewPlain: ואין העם מכירים קול תרועת השמחה לקול בכי העם כי העם מריעים תרועה גדולה והקול נשמע עד למרחוק
    kjvRefs:
    - Ezra 3:13
    kjvOsis:
    - Ezra.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.3
- type: TanakhVerse
  data:
    osis: Ezra.4.1
    scripture: tanakh
    name: Tanakh Ezra 4:1
    ref: Ezra 4:1
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 20851
    text: Now when the adversaries of Judah and Benjamin heard that the children of the captivity were building a temple unto the LORD, the God of Israel;
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ צָרֵי יְהוּדָה וּבִנְיָמִן כִּי־בְנֵי הַגּוֹלָה בּוֹנִים הֵיכָל לַיהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: וישמעו צרי יהודה ובנימן כי בני הגולה בונים היכל ליהוה אלהי ישראל
    kjvRefs:
    - Ezra 4:1
    kjvOsis:
    - Ezra.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.2
    scripture: tanakh
    name: Tanakh Ezra 4:2
    ref: Ezra 4:2
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 20852
    text: 'then they drew near to Zerubbabel, and to the heads of fathers’ houses, and said unto them: ‘Let us build with you; for we seek your God, as ye do; and we do sacrifice unto Him since the days of Esarhaddon king of Assyria, who brought us up hither.’'
    translation: JPS 1917
    original: וַיִּגְּשׁוּ אֶל־זְרֻבָּבֶל וְאֶל־רָאשֵׁי הָאָבוֹת וַיֹּאמְרוּ לָהֶם נִבְנֶה עִמָּכֶם כִּי כָכֶם נִדְרוֹשׁ לֵאלֹהֵיכֶם ולא [וְלוֹ ] אֲנַחְנוּ זֹבְחִים מִימֵי אֵסַר חַדֹּן מֶלֶךְ אַשּׁוּר הַמַּעֲלֶה אֹתָנוּ פֹּה׃
    hebrewPlain: ויגשו אל זרבבל ואל ראשי האבות ויאמרו להם נבנה עמכם כי ככם נדרוש לאלהיכם ולא [ולו ] אנחנו זבחים מימי אסר חדן מלך אשור המעלה אתנו פה
    kjvRefs:
    - Ezra 4:2
    kjvOsis:
    - Ezra.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.3
    scripture: tanakh
    name: Tanakh Ezra 4:3
    ref: Ezra 4:3
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 20853
    text: 'But Zerubbabel, and Jeshua, and the rest of the heads of fathers’ houses of Israel, said unto them: ‘Ye have nothing to do with us to build a house unto our God; but we ourselves together will build unto the LORD, the God of Israel, as king Cyrus the king of Persia hath commanded us.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם זְרֻבָּבֶל וְיֵשׁוּעַ וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל לֹא־לָכֶם וָלָנוּ לִבְנוֹת בַּיִת לֵאלֹהֵינוּ כִּי אֲנַחְנוּ יַחַד נִבְנֶה לַיהוָה אֱלֹהֵי יִשְׂרָאֵל כַּאֲשֶׁר צִוָּנוּ הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ־פָּרָס׃
    hebrewPlain: ויאמר להם זרבבל וישוע ושאר ראשי האבות לישראל לא לכם ולנו לבנות בית לאלהינו כי אנחנו יחד נבנה ליהוה אלהי ישראל כאשר צונו המלך כורש מלך פרס
    kjvRefs:
    - Ezra 4:3
    kjvOsis:
    - Ezra.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.4
    scripture: tanakh
    name: Tanakh Ezra 4:4
    ref: Ezra 4:4
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 20854
    text: Then the people of the land weakened the hands of the people of Judah, and harried them while they were building,
    translation: JPS 1917
    original: וַיְהִי עַם־הָאָרֶץ מְרַפִּים יְדֵי עַם־יְהוּדָה ומבלהים [וּמְבַהֲלִים] אוֹתָם לִבְנוֹת׃
    hebrewPlain: ויהי עם הארץ מרפים ידי עם יהודה ומבלהים [ומבהלים] אותם לבנות
    kjvRefs:
    - Ezra 4:4
    kjvOsis:
    - Ezra.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.5
    scripture: tanakh
    name: Tanakh Ezra 4:5
    ref: Ezra 4:5
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 20855
    text: and hired counsellors against them, to frustrate their purpose, all the days of Cyrus king of Persia, even until the reign of Darius king of Persia.
    translation: JPS 1917
    original: וְסֹכְרִים עֲלֵיהֶם יוֹעֲצִים לְהָפֵר עֲצָתָם כָּל־יְמֵי כּוֹרֶשׁ מֶלֶךְ פָּרַס וְעַד־מַלְכוּת דָּרְיָוֶשׁ מֶלֶךְ־פָּרָס׃
    hebrewPlain: וסכרים עליהם יועצים להפר עצתם כל ימי כורש מלך פרס ועד מלכות דריוש מלך פרס
    kjvRefs:
    - Ezra 4:5
    kjvOsis:
    - Ezra.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.6
    scripture: tanakh
    name: Tanakh Ezra 4:6
    ref: Ezra 4:6
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 20856
    text: And in the reign of Ahasuerus, in the beginning of his reign, wrote they an accusation against the inhabitants of Judah and Jerusalem.
    translation: JPS 1917
    original: וּבְמַלְכוּת אֲחַשְׁוֵרוֹשׁ בִּתְחִלַּת מַלְכוּתוֹ כָּתְבוּ שִׂטְנָה עַל־יֹשְׁבֵי יְהוּדָה וִירוּשָׁלִָם׃
    hebrewPlain: ובמלכות אחשורוש בתחלת מלכותו כתבו שטנה על ישבי יהודה וירושלם
    kjvRefs:
    - Ezra 4:6
    kjvOsis:
    - Ezra.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.7
    scripture: tanakh
    name: Tanakh Ezra 4:7
    ref: Ezra 4:7
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 20857
    text: And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of his companions, unto Artaxerxes king of Persia; and the writing of the letter was written in the Aramaic character, and set forth in the Aramaic tongue.
    translation: JPS 1917
    original: וּבִימֵי אַרְתַּחְשַׁשְׂתָּא כָּתַב בִּשְׁלָם מִתְרְדָת טָבְאֵל וּשְׁאָר כנותו [כְּנָוֺתָיו] עַל־ארתחששתא [אַרְתַּחְשַׁשְׂתְּ] מֶלֶךְ פָּרָס וּכְתָב הַנִּשְׁתְּוָן כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית׃
    hebrewPlain: ובימי ארתחששתא כתב בשלם מתרדת טבאל ושאר כנותו [כנותיו] על ארתחששתא [ארתחששת] מלך פרס וכתב הנשתון כתוב ארמית ומתרגם ארמית
    kjvRefs:
    - Ezra 4:7
    kjvOsis:
    - Ezra.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.8
    scripture: tanakh
    name: Tanakh Ezra 4:8
    ref: Ezra 4:8
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 20858
    text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to Artaxerxes the king in this sort—
    translation: JPS 1917
    original: רְחוּם בְּעֵל־טְעֵם וְשִׁמְשַׁי סָפְרָא כְּתַבוּ אִגְּרָה חֲדָה עַל־יְרוּשְׁלֶם לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא כְּנֵמָא׃
    hebrewPlain: רחום בעל טעם ושמשי ספרא כתבו אגרה חדה על ירושלם לארתחששתא מלכא כנמא
    kjvRefs:
    - Ezra 4:8
    kjvOsis:
    - Ezra.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.4
- type: TanakhVerse
  data:
    osis: Ezra.4.9
    scripture: tanakh
    name: Tanakh Ezra 4:9
    ref: Ezra 4:9
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 20859
    text: then wrote Rehum the commander, and Shimshai the scribe, and the rest of their companions; the Dinites, and the Apharesattechites, the Tarpelites, the Apharesites, the Archevites, the Babylonians, the Shushanchites, the Dehites, the Elamites,
    translation: JPS 1917
    original: אֱדַיִן רְחוּם בְּעֵל־טְעֵם וְשִׁמְשַׁי סָפְרָא וּשְׁאָר כְּנָוָתְהוֹן דִּינָיֵא וַאֲפַרְסַתְכָיֵא טַרְפְּלָיֵא אֲפָרְסָיֵא ארכוי [אַרְכְּוָיֵא] בָבְלָיֵא שׁוּשַׁנְכָיֵא דהוא [דֶּהָיֵא] עֵלְמָיֵא׃
    hebrewPlain: אדין רחום בעל טעם ושמשי ספרא ושאר כנותהון דיניא ואפרסתכיא טרפליא אפרסיא ארכוי [ארכויא] בבליא שושנכיא דהוא [דהיא] עלמיא
