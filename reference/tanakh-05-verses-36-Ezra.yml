  data:
    osis: Ezra.6.20
    scripture: tanakh
    name: Tanakh Ezra 6:20
    ref: Ezra 6:20
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 20
    ordinal: 20911
    text: For the priests and the Levites had purified themselves together; all of them were pure; and they killed the passover lamb for all the children of the captivity, and for their brethren the priests, and for themselves.
    translation: JPS 1917
    original: כִּי הִטַּהֲרוּ הַכֹּהֲנִים וְהַלְוִיִּם כְּאֶחָד כֻּלָּם טְהוֹרִים וַיִּשְׁחֲטוּ הַפֶּסַח לְכָל־בְּנֵי הַגּוֹלָה וְלַאֲחֵיהֶם הַכֹּהֲנִים וְלָהֶם׃
    hebrewPlain: כי הטהרו הכהנים והלוים כאחד כלם טהורים וישחטו הפסח לכל בני הגולה ולאחיהם הכהנים ולהם
    kjvRefs:
    - Ezra 6:20
    kjvOsis:
    - Ezra.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
