  data:
    osis: Ezra.10.12
    scripture: tanakh
    name: Tanakh Ezra 10:12
    ref: Ezra 10:12
    book: Ezra
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 21004
    text: 'Then all the congregation answered and said with a loud voice: ‘As thou hast said, so it is for us to do.'
    translation: JPS 1917
    original: וַיַּעְנוּ כָל־הַקָּהָל וַיֹּאמְרוּ קוֹל גָּדוֹל כֵּן כדבריך [כִּדְבָרְךָ] עָלֵינוּ לַעֲשׂוֹת׃
    hebrewPlain: ויענו כל הקהל ויאמרו קול גדול כן כדבריך [כדברך] עלינו לעשות
    kjvRefs:
