  data:
    osis: Ezra.4.17
    scripture: tanakh
    name: Tanakh Ezra 4:17
    ref: Ezra 4:17
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 20867
    text: 'Then sent the king an answer unto Rehum the commander, and to Shimshai the scribe, and to the rest of their companions that dwell in Samaria, and unto the rest beyond the River: ‘Peace, and now'
    translation: JPS 1917
    original: פִּתְגָמָא שְׁלַח מַלְכָּא עַל־רְחוּם בְּעֵל־טְעֵם וְשִׁמְשַׁי סָפְרָא וּשְׁאָר כְּנָוָתְהוֹן דִּי יָתְבִין בְּשָׁמְרָיִן וּשְׁאָר עֲבַר־נַהֲרָה שְׁלָם וּכְעֶת׃
    hebrewPlain: פתגמא שלח מלכא על רחום בעל טעם ושמשי ספרא ושאר כנותהון די יתבין בשמרין ושאר עבר נהרה שלם וכעת
    kjvRefs:
