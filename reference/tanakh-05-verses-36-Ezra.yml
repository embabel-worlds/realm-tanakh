- type: TanakhVerse
  data:
    osis: Ezra.2.70
    scripture: tanakh
    name: Tanakh Ezra 2:70
    ref: Ezra 2:70
    book: Ezra
    section: ketuvim
    chapter: 2
    verse: 70
    ordinal: 20837
    text: So the priests, and the Levites, and some of the people, and the singers, and the porters, and the Nethinim, dwelt in their cities, and all Israel in their cities.
    translation: JPS 1917
    original: וַיֵּשְׁבוּ הַכֹּהֲנִים וְהַלְוִיִּם וּמִן־הָעָם וְהַמְשֹׁרְרִים וְהַשּׁוֹעֲרִים וְהַנְּתִינִים בְּעָרֵיהֶם וְכָל־יִשְׂרָאֵל בְּעָרֵיהֶם׃
    hebrewPlain: וישבו הכהנים והלוים ומן העם והמשררים והשוערים והנתינים בעריהם וכל ישראל בעריהם
    kjvRefs:
    - Ezra 2:70
    kjvOsis:
    - Ezra.2.70
