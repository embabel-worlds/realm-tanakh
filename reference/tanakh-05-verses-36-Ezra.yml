    translation: JPS 1917
    original: וַיְכַלּוּ בַכֹּל אֲנָשִׁים הַהֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן׃
    hebrewPlain: ויכלו בכל אנשים ההשיבו נשים נכריות עד יום אחד לחדש הראשון
