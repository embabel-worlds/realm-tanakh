  data:
    osis: Ezra.4.13
    scripture: tanakh
    name: Tanakh Ezra 4:13
    ref: Ezra 4:13
    book: Ezra
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 20863
    text: Be it known now unto the king, that, if this city be builded, and the walls finished, they will not pay tribute, impost, or toll, and so thou wilt endamage the revenue of the kings.
    translation: JPS 1917
    original: כְּעַן יְדִיעַ לֶהֱוֵא לְמַלְכָּא דִּי הֵן קִרְיְתָא דָךְ תִּתְבְּנֵא וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן מִנְדָּה־בְלוֹ וַהֲלָךְ לָא יִנְתְּנוּן וְאַפְּתֹם מַלְכִים תְּהַנְזִק׃
    hebrewPlain: כען ידיע להוא למלכא די הן קריתא דך תתבנא ושוריה ישתכללון מנדה בלו והלך לא ינתנון ואפתם מלכים תהנזק
    kjvRefs:
    - Ezra 4:13
    kjvOsis:
    - Ezra.4.13
  relations:
  - predicate: IN
    to:
