    scripture: tanakh
    name: Tanakh Ezra 8:15
    ref: Ezra 8:15
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 20956
    text: And I gathered them together to the river that runneth to Ahava; and there we encamped three days; and I viewed the people, and the priests, and found there none of the sons of Levi.
    translation: JPS 1917
    original: וָאֶקְבְּצֵם אֶל־הַנָּהָר הַבָּא אֶל־אַהֲוָא וַנַּחֲנֶה שָׁם יָמִים שְׁלֹשָׁה וָאָבִינָה בָעָם וּבַכֹּהֲנִים וּמִבְּנֵי לֵוִי לֹא־מָצָאתִי שָׁם׃
    hebrewPlain: ואקבצם אל הנהר הבא אל אהוא ונחנה שם ימים שלשה ואבינה בעם ובכהנים ומבני לוי לא מצאתי שם
    kjvRefs:
    - Ezra 8:15
    kjvOsis:
    - Ezra.8.15
