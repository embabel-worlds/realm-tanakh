    ordinal: 20860
    text: and the rest of the nations whom the great and noble Asenappar brought over, and set in the city of Samaria, and the rest that are in the country beyond the River:— ‘And now—
    translation: JPS 1917
    original: וּשְׁאָר אֻמַּיָּא דִּי הַגְלִי אָסְנַפַּר רַבָּא וְיַקִּירָא וְהוֹתֵב הִמּוֹ בְּקִרְיָה דִּי שָׁמְרָיִן וּשְׁאָר עֲבַר־נַהֲרָה וּכְעֶנֶת׃
    hebrewPlain: ושאר אמיא די הגלי אסנפר רבא ויקירא והותב המו בקריה די שמרין ושאר עבר נהרה וכענת
