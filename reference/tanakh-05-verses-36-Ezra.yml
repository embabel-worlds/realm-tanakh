- type: TanakhVerse
  data:
    osis: Ezra.6.17
    scripture: tanakh
    name: Tanakh Ezra 6:17
    ref: Ezra 6:17
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 20908
    text: And they offered at the dedication of this house of God a hundred bullocks, two hundred rams, four hundred lambs; and for a sin-offering for all Israel, twelve he-goats, according to the number of the tribes of Israel.
    translation: JPS 1917
    original: וְהַקְרִבוּ לַחֲנֻכַּת בֵּית־אֱלָהָא דְנָה תּוֹרִין מְאָה דִּכְרִין מָאתַיִן אִמְּרִין אַרְבַּע מְאָה וּצְפִירֵי עִזִּין לחטיא [לְחַטָּאָה] עַל־כָּל־יִשְׂרָאֵל תְּרֵי־עֲשַׂר לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל׃
    hebrewPlain: והקרבו לחנכת בית אלהא דנה תורין מאה דכרין מאתין אמרין ארבע מאה וצפירי עזין לחטיא [לחטאה] על כל ישראל תרי עשר למנין שבטי ישראל
    kjvRefs:
    - Ezra 6:17
    kjvOsis:
    - Ezra.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.18
    scripture: tanakh
    name: Tanakh Ezra 6:18
    ref: Ezra 6:18
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 20909
    text: And they set the priests in their divisions, and the Levites in their courses, for the service of God, which is at Jerusalem; as it is written in the book of Moses.
    translation: JPS 1917
    original: וַהֲקִימוּ כָהֲנַיָּא בִּפְלֻגָּתְהוֹן וְלֵוָיֵא בְּמַחְלְקָתְהוֹן עַל־עֲבִידַת אֱלָהָא דִּי בִירוּשְׁלֶם כִּכְתָב סְפַר מֹשֶׁה׃
    hebrewPlain: והקימו כהניא בפלגתהון ולויא במחלקתהון על עבידת אלהא די בירושלם ככתב ספר משה
    kjvRefs:
    - Ezra 6:18
    kjvOsis:
    - Ezra.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ezra.6
- type: TanakhVerse
  data:
    osis: Ezra.6.19
    scripture: tanakh
    name: Tanakh Ezra 6:19
    ref: Ezra 6:19
    book: Ezra
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 20910
    text: And the children of the captivity kept the passover upon the fourteenth day of the first month.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־הַגּוֹלָה אֶת־הַפָּסַח בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן׃
    hebrewPlain: ויעשו בני הגולה את הפסח בארבעה עשר לחדש הראשון
    kjvRefs:
    - Ezra 6:19
    kjvOsis:
    - Ezra.6.19
  relations:
  - predicate: IN
    to:
