    translation: JPS 1917
    original: מִבְּנֵי יוֹאָב עֹבַדְיָה בֶּן־יְחִיאֵל וְעִמּוֹ מָאתַיִם וּשְׁמֹנָה עָשָׂר הַזְּכָרִים׃
