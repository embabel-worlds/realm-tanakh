    scripture: tanakh
    name: Tanakh Ezra 8:13
    ref: Ezra 8:13
    book: Ezra
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 20954
    text: And of the sons of Adonikam, that were the last; and these are their names, Eliphelet, Jeiel, and Shemaiah; and with them threescore males.
    translation: JPS 1917
    original: וּמִבְּנֵי אֲדֹנִיקָם אַחֲרֹנִים וְאֵלֶּה שְׁמוֹתָם אֱלִיפֶלֶט יְעִיאֵל וּשְׁמַעְיָה וְעִמָּהֶם שִׁשִּׁים הַזְּכָרִים׃
    hebrewPlain: ומבני אדניקם אחרנים ואלה שמותם אליפלט יעיאל ושמעיה ועמהם ששים הזכרים
