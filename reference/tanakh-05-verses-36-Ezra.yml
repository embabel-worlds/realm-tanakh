    ordinal: 20918
    text: the son of Abishua, the son of Phinehas, the son of Eleazar, the son of Aaron the chief priest—
    translation: JPS 1917
    original: בֶּן־אֲבִישׁוּעַ בֶּן־פִּינְחָס בֶּן־אֶלְעָזָר בֶּן־אַהֲרֹן הַכֹּהֵן הָרֹאשׁ׃
