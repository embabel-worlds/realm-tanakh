  data:
    osis: Neh.7.71
    scripture: tanakh
    name: Tanakh Nehemiah 7:71
    ref: Nehemiah 7:71
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 71
    ordinal: 21231
    text: And that which the rest of the people gave was twenty thousand darics of gold, and two thousand pounds of silver, and threescore and seven priests’ tunics.
    translation: JPS 1917
    original: וַאֲשֶׁר נָתְנוּ שְׁאֵרִית הָעָם זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹא וְכֶסֶף מָנִים אַלְפָּיִם וְכָתְנֹת כֹּהֲנִים שִׁשִּׁים וְשִׁבְעָה׃
    hebrewPlain: ואשר נתנו שארית העם זהב דרכמונים שתי רבוא וכסף מנים אלפים וכתנת כהנים ששים ושבעה
    kjvRefs:
    - Nehemiah 7:72
    kjvOsis:
    - Neh.7.72
