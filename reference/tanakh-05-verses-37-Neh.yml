  data:
    osis: Neh.1.4
    scripture: tanakh
    name: Tanakh Nehemiah 1:4
    ref: Nehemiah 1:4
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 21040
    text: And it came to pass, when I heard these words, that I sat down and wept, and mourned certain days; and I fasted and prayed before the God of heaven,
    translation: JPS 1917
    original: וַיְהִי כְּשָׁמְעִי אֶת־הַדְּבָרִים הָאֵלֶּה יָשַׁבְתִּי וָאֶבְכֶּה וָאֶתְאַבְּלָה יָמִים וָאֱהִי צָם וּמִתְפַּלֵּל לִפְנֵי אֱלֹהֵי הַשָּׁמָיִם׃
    hebrewPlain: ויהי כשמעי את הדברים האלה ישבתי ואבכה ואתאבלה ימים ואהי צם ומתפלל לפני אלהי השמים
    kjvRefs:
    - Nehemiah 1:4
    kjvOsis:
    - Neh.1.4
