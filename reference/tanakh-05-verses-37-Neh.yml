    original: וְאֶת־מְלָכֵינוּ שָׂרֵינוּ כֹּהֲנֵינוּ וַאֲבֹתֵינוּ לֹא עָשׂוּ תּוֹרָתֶךָ וְלֹא הִקְשִׁיבוּ אֶל־מִצְוֺתֶיךָ וּלְעֵדְוֺתֶיךָ אֲשֶׁר הַעִידֹתָ בָּהֶם׃
    hebrewPlain: ואת מלכינו שרינו כהנינו ואבתינו לא עשו תורתך ולא הקשיבו אל מצותיך ולעדותיך אשר העידת בהם
