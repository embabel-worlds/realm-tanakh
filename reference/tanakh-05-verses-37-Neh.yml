- type: TanakhVerse
  data:
    osis: Neh.1.10
    scripture: tanakh
    name: Tanakh Nehemiah 1:10
    ref: Nehemiah 1:10
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 21046
    text: Now these are Thy servants and Thy people, whom Thou hast redeemed by Thy great power, and by Thy strong hand.
    translation: JPS 1917
    original: וְהֵם עֲבָדֶיךָ וְעַמֶּךָ אֲשֶׁר פָּדִיתָ בְּכֹחֲךָ הַגָּדוֹל וּבְיָדְךָ הַחֲזָקָה׃
    hebrewPlain: והם עבדיך ועמך אשר פדית בכחך הגדול ובידך החזקה
    kjvRefs:
