- type: TanakhVerse
  data:
    osis: Neh.1.11
    scripture: tanakh
    name: Tanakh Nehemiah 1:11
    ref: Nehemiah 1:11
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 21047
    text: O Lord, I beseech Thee, let now Thine ear be attentive to the prayer of Thy servant, and to the prayer of Thy servants, who delight to fear Thy name; and prosper, I pray Thee, Thy servant this day, and grant him mercy in the sight of this man.’ Now I was cupbearer to the king.
    translation: JPS 1917
    original: אָנָּא אֲדֹנָי תְּהִי נָא אָזְנְךָ־קַשֶּׁבֶת אֶל־תְּפִלַּת עַבְדְּךָ וְאֶל־תְּפִלַּת עֲבָדֶיךָ הַחֲפֵצִים לְיִרְאָה אֶת־שְׁמֶךָ וְהַצְלִיחָה־נָּא לְעַבְדְּךָ הַיּוֹם וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ׃
    hebrewPlain: אנא אדני תהי נא אזנך קשבת אל תפלת עבדך ואל תפלת עבדיך החפצים ליראה את שמך והצליחה נא לעבדך היום ותנהו לרחמים לפני האיש הזה ואני הייתי משקה למלך
    kjvRefs:
    - Nehemiah 1:11
    kjvOsis:
    - Neh.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.1
- type: TanakhVerse
  data:
    osis: Neh.2.1
    scripture: tanakh
    name: Tanakh Nehemiah 2:1
    ref: Nehemiah 2:1
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 21048
    text: And it came to pass in the month Nisan, in the twentieth year of Artaxerxes the king, when wine was before him, that I took up the wine, and gave it unto the king. Now I had not been beforetime sad in his presence.
    translation: JPS 1917
    original: וַיְהִי בְּחֹדֶשׁ נִיסָן שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ יַיִן לְפָנָיו וָאֶשָּׂא אֶת־הַיַּיִן וָאֶתְּנָה לַמֶּלֶךְ וְלֹא־הָיִיתִי רַע לְפָנָיו׃
    hebrewPlain: ויהי בחדש ניסן שנת עשרים לארתחשסתא המלך יין לפניו ואשא את היין ואתנה למלך ולא הייתי רע לפניו
    kjvRefs:
    - Nehemiah 2:1
    kjvOsis:
    - Neh.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.2
    scripture: tanakh
    name: Tanakh Nehemiah 2:2
    ref: Nehemiah 2:2
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 21049
    text: 'And the king said unto me: ‘Why is thy countenance sad, seeing thou art not sick? this is nothing else but sorrow of heart.’ Then I was very sore afraid.'
    translation: JPS 1917
    original: וַיֹּאמֶר לִי הַמֶּלֶךְ מַדּוּעַ פָּנֶיךָ רָעִים וְאַתָּה אֵינְךָ חוֹלֶה אֵין זֶה כִּי־אִם רֹעַ לֵב וָאִירָא הַרְבֵּה מְאֹד׃
    hebrewPlain: ויאמר לי המלך מדוע פניך רעים ואתה אינך חולה אין זה כי אם רע לב ואירא הרבה מאד
    kjvRefs:
    - Nehemiah 2:2
    kjvOsis:
    - Neh.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.3
    scripture: tanakh
    name: Tanakh Nehemiah 2:3
    ref: Nehemiah 2:3
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 21050
    text: 'And I said unto the king: ‘Let the king live for ever: why should not my countenance be sad, when the city, the place of my fathers’ sepulchres, lieth waste, and the gates thereof are consumed with fire?’'
    translation: JPS 1917
    original: וָאֹמַר לַמֶּלֶךְ הַמֶּלֶךְ לְעוֹלָם יִחְיֶה מַדּוּעַ לֹא־יֵרְעוּ פָנַי אֲשֶׁר הָעִיר בֵּית־קִבְרוֹת אֲבֹתַי חֲרֵבָה וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ׃
    hebrewPlain: ואמר למלך המלך לעולם יחיה מדוע לא ירעו פני אשר העיר בית קברות אבתי חרבה ושעריה אכלו באש
    kjvRefs:
    - Nehemiah 2:3
    kjvOsis:
    - Neh.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.4
    scripture: tanakh
    name: Tanakh Nehemiah 2:4
    ref: Nehemiah 2:4
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 21051
    text: 'Then the king said unto me: ‘For what dost thou make request?’ So I prayed to the God of heaven.'
    translation: JPS 1917
    original: וַיֹּאמֶר לִי הַמֶּלֶךְ עַל־מַה־זֶּה אַתָּה מְבַקֵּשׁ וָאֶתְפַּלֵּל אֶל־אֱלֹהֵי הַשָּׁמָיִם׃
    hebrewPlain: ויאמר לי המלך על מה זה אתה מבקש ואתפלל אל אלהי השמים
    kjvRefs:
    - Nehemiah 2:4
    kjvOsis:
    - Neh.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.5
    scripture: tanakh
    name: Tanakh Nehemiah 2:5
    ref: Nehemiah 2:5
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 21052
    text: 'And I said unto the king: ‘If it please the king, and if thy servant have found favour in thy sight, that thou wouldest send me unto Judah, unto the city of my fathers’ sepulchres, that I may build it.’'
    translation: JPS 1917
    original: וָאֹמַר לַמֶּלֶךְ אִם־עַל־הַמֶּלֶךְ טוֹב וְאִם־יִיטַב עַבְדְּךָ לְפָנֶיךָ אֲשֶׁר תִּשְׁלָחֵנִי אֶל־יְהוּדָה אֶל־עִיר קִבְרוֹת אֲבֹתַי וְאֶבְנֶנָּה׃
    hebrewPlain: ואמר למלך אם על המלך טוב ואם ייטב עבדך לפניך אשר תשלחני אל יהודה אל עיר קברות אבתי ואבננה
    kjvRefs:
    - Nehemiah 2:5
    kjvOsis:
    - Neh.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.6
    scripture: tanakh
    name: Tanakh Nehemiah 2:6
    ref: Nehemiah 2:6
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 21053
    text: 'And the king said unto me, the queen also sitting by him: ‘For how long shall thy journey be? and when wilt thou return?’ So it pleased the king to send me; and I set him a time.'
    translation: JPS 1917
    original: וַיֹּאמֶר לִי הַמֶּלֶךְ וְהַשֵּׁגַל יוֹשֶׁבֶת אֶצְלוֹ עַד־מָתַי יִהְיֶה מַהֲלָכֲךָ וּמָתַי תָּשׁוּב וַיִּיטַב לִפְנֵי־הַמֶּלֶךְ וַיִּשְׁלָחֵנִי וָאֶתְּנָה לוֹ זְמָן׃
    hebrewPlain: ויאמר לי המלך והשגל יושבת אצלו עד מתי יהיה מהלכך ומתי תשוב וייטב לפני המלך וישלחני ואתנה לו זמן
    kjvRefs:
    - Nehemiah 2:6
    kjvOsis:
    - Neh.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.7
    scripture: tanakh
    name: Tanakh Nehemiah 2:7
    ref: Nehemiah 2:7
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 21054
    text: 'Moreover I said unto the king: ‘If it please the king, let letters be given me to the governors beyond the River, that they may let me pass through till I come unto Judah;'
    translation: JPS 1917
    original: וָאוֹמַר לַמֶּלֶךְ אִם־עַל־הַמֶּלֶךְ טוֹב אִגְּרוֹת יִתְּנוּ־לִי עַל־פַּחֲווֹת עֵבֶר הַנָּהָר אֲשֶׁר יַעֲבִירוּנִי עַד אֲשֶׁר־אָבוֹא אֶל־יְהוּדָה׃
    hebrewPlain: ואומר למלך אם על המלך טוב אגרות יתנו לי על פחוות עבר הנהר אשר יעבירוני עד אשר אבוא אל יהודה
    kjvRefs:
    - Nehemiah 2:7
    kjvOsis:
    - Neh.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.8
    scripture: tanakh
    name: Tanakh Nehemiah 2:8
    ref: Nehemiah 2:8
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 21055
    text: and a letter unto Asaph the keeper of the king’s park, that he may give me timber to make beams for the gates of the castle which appertaineth to the house, and for the wall of the city, and for the house that I shall enter into.’ And the king granted me, according to the good hand of my God upon me.
    translation: JPS 1917
    original: וְאִגֶּרֶת אֶל־אָסָף שֹׁמֵר הַפַּרְדֵּס אֲשֶׁר לַמֶּלֶךְ אֲשֶׁר יִתֶּן־לִי עֵצִים לְקָרוֹת אֶת־שַׁעֲרֵי הַבִּירָה אֲשֶׁר־לַבַּיִת וּלְחוֹמַת הָעִיר וְלַבַּיִת אֲשֶׁר־אָבוֹא אֵלָיו וַיִּתֶּן־לִי הַמֶּלֶךְ כְּיַד־אֱלֹהַי הַטּוֹבָה עָלָי׃
    hebrewPlain: ואגרת אל אסף שמר הפרדס אשר למלך אשר יתן לי עצים לקרות את שערי הבירה אשר לבית ולחומת העיר ולבית אשר אבוא אליו ויתן לי המלך כיד אלהי הטובה עלי
    kjvRefs:
    - Nehemiah 2:8
    kjvOsis:
    - Neh.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.9
    scripture: tanakh
    name: Tanakh Nehemiah 2:9
    ref: Nehemiah 2:9
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 21056
    text: Then I came to the governors beyond the River, and gave them the king’s letters. Now the king had sent with me captains of the army and horsemen.
    translation: JPS 1917
    original: וָאָבוֹא אֶל־פַּחֲווֹת עֵבֶר הַנָּהָר וָאֶתְּנָה לָהֶם אֵת אִגְּרוֹת הַמֶּלֶךְ וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ שָׂרֵי חַיִל וּפָרָשִׁים׃
    hebrewPlain: ואבוא אל פחוות עבר הנהר ואתנה להם את אגרות המלך וישלח עמי המלך שרי חיל ופרשים
    kjvRefs:
    - Nehemiah 2:9
    kjvOsis:
    - Neh.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.10
    scripture: tanakh
    name: Tanakh Nehemiah 2:10
    ref: Nehemiah 2:10
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 21057
    text: And when Sanballat the Horonite, and Tobiah the servant, the Ammonite, heard of it, it grieved them exceedingly, for that there was come a man to seek the welfare of the children of Israel.
    translation: JPS 1917
    original: וַיִּשְׁמַע סַנְבַלַּט הַחֹרֹנִי וְטוֹבִיָּה הָעֶבֶד הָעַמֹּנִי וַיֵּרַע לָהֶם רָעָה גְדֹלָה אֲשֶׁר־בָּא אָדָם לְבַקֵּשׁ טוֹבָה לִבְנֵי יִשְׂרָאֵל׃
    hebrewPlain: וישמע סנבלט החרני וטוביה העבד העמני וירע להם רעה גדלה אשר בא אדם לבקש טובה לבני ישראל
    kjvRefs:
    - Nehemiah 2:10
    kjvOsis:
    - Neh.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.11
    scripture: tanakh
    name: Tanakh Nehemiah 2:11
    ref: Nehemiah 2:11
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 21058
    text: So I came to Jerusalem, and was there three days.
    translation: JPS 1917
    original: וָאָבוֹא אֶל־יְרוּשָׁלִָם וָאֱהִי־שָׁם יָמִים שְׁלֹשָׁה׃
    hebrewPlain: ואבוא אל ירושלם ואהי שם ימים שלשה
    kjvRefs:
    - Nehemiah 2:11
    kjvOsis:
    - Neh.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.12
    scripture: tanakh
    name: Tanakh Nehemiah 2:12
    ref: Nehemiah 2:12
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 21059
    text: And I arose in the night, I and some few men with me; neither told I any man what my God put into my heart to do for Jerusalem; neither was there any beast with me, save the beast that I rode upon.
    translation: JPS 1917
    original: וָאָקוּם לַיְלָה אֲנִי וַאֲנָשִׁים מְעַט עִמִּי וְלֹא־הִגַּדְתִּי לְאָדָם מָה אֱלֹהַי נֹתֵן אֶל־לִבִּי לַעֲשׂוֹת לִירוּשָׁלִָם וּבְהֵמָה אֵין עִמִּי כִּי אִם־הַבְּהֵמָה אֲשֶׁר אֲנִי רֹכֵב בָּהּ׃
    hebrewPlain: ואקום לילה אני ואנשים מעט עמי ולא הגדתי לאדם מה אלהי נתן אל לבי לעשות לירושלם ובהמה אין עמי כי אם הבהמה אשר אני רכב בה
    kjvRefs:
    - Nehemiah 2:12
    kjvOsis:
    - Neh.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.13
    scripture: tanakh
    name: Tanakh Nehemiah 2:13
    ref: Nehemiah 2:13
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 21060
    text: And I went out by night by the valley gate, even toward the dragon’s well, and to the dung gate, and viewed the walls of Jerusalem, which were broken down, and the gates thereof were consumed with fire.
    translation: JPS 1917
    original: וָאֵצְאָה בְשַׁעַר־הַגַּיא לַיְלָה וְאֶל־פְּנֵי עֵין הַתַּנִּין וְאֶל־שַׁעַר הָאַשְׁפֹּת וָאֱהִי שֹׂבֵר בְּחוֹמֹת יְרוּשָׁלִַם אֲשֶׁר־המפרוצים [הֵם ] [פְּרוּצִים] וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ׃
    hebrewPlain: ואצאה בשער הגיא לילה ואל פני עין התנין ואל שער האשפת ואהי שבר בחומת ירושלם אשר המפרוצים [הם ] [פרוצים] ושעריה אכלו באש
    kjvRefs:
    - Nehemiah 2:13
    kjvOsis:
    - Neh.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.14
    scripture: tanakh
    name: Tanakh Nehemiah 2:14
    ref: Nehemiah 2:14
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 21061
    text: Then I went on to the fountain gate and to the king’s pool; but there was no place for the beast that was under me to pass.
    translation: JPS 1917
    original: וָאֶעֱבֹר אֶל־שַׁעַר הָעַיִן וְאֶל־בְּרֵכַת הַמֶּלֶךְ וְאֵין־מָקוֹם לַבְּהֵמָה לַעֲבֹר תַּחְתָּי׃
    hebrewPlain: ואעבר אל שער העין ואל ברכת המלך ואין מקום לבהמה לעבר תחתי
    kjvRefs:
    - Nehemiah 2:14
    kjvOsis:
    - Neh.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.15
    scripture: tanakh
    name: Tanakh Nehemiah 2:15
    ref: Nehemiah 2:15
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 21062
    text: Then went I up in the night in the valley, and viewed the wall; and I turned back, and entered by the valley gate, and so returned.
    translation: JPS 1917
    original: וָאֱהִי עֹלֶה בַנַּחַל לַיְלָה וָאֱהִי שֹׂבֵר בַּחוֹמָה וָאָשׁוּב וָאָבוֹא בְּשַׁעַר הַגַּיְא וָאָשׁוּב׃
    hebrewPlain: ואהי עלה בנחל לילה ואהי שבר בחומה ואשוב ואבוא בשער הגיא ואשוב
    kjvRefs:
    - Nehemiah 2:15
    kjvOsis:
    - Neh.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.16
    scripture: tanakh
    name: Tanakh Nehemiah 2:16
    ref: Nehemiah 2:16
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 21063
    text: And the rulers knew not whither I went, or what I did; neither had I as yet told it to the Jews, nor to the priests, nor to the nobles, nor to the rulers, nor to the rest that did the work. .
    translation: JPS 1917
    original: וְהַסְּגָנִים לֹא יָדְעוּ אָנָה הָלַכְתִּי וּמָה אֲנִי עֹשֶׂה וְלַיְּהוּדִים וְלַכֹּהֲנִים וְלַחֹרִים וְלַסְּגָנִים וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה עַד־כֵּן לֹא הִגַּדְתִּי׃
    hebrewPlain: והסגנים לא ידעו אנה הלכתי ומה אני עשה וליהודים ולכהנים ולחרים ולסגנים וליתר עשה המלאכה עד כן לא הגדתי
    kjvRefs:
    - Nehemiah 2:16
    kjvOsis:
    - Neh.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.17
    scripture: tanakh
    name: Tanakh Nehemiah 2:17
    ref: Nehemiah 2:17
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 21064
    text: 'Then said I unto them: ‘Ye see the evil case that we are in, how Jerusalem lieth waste, and the gates thereof are burned with fire; come and let us build up the wall of Jerusalem, that we be no more a reproach.’'
    translation: JPS 1917
    original: וָאוֹמַר אֲלֵהֶם אַתֶּם רֹאִים הָרָעָה אֲשֶׁר אֲנַחְנוּ בָהּ אֲשֶׁר יְרוּשָׁלִַם חֲרֵבָה וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ לְכוּ וְנִבְנֶה אֶת־חוֹמַת יְרוּשָׁלִַם וְלֹא־נִהְיֶה עוֹד חֶרְפָּה׃
    hebrewPlain: ואומר אלהם אתם ראים הרעה אשר אנחנו בה אשר ירושלם חרבה ושעריה נצתו באש לכו ונבנה את חומת ירושלם ולא נהיה עוד חרפה
    kjvRefs:
    - Nehemiah 2:17
    kjvOsis:
    - Neh.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.18
    scripture: tanakh
    name: Tanakh Nehemiah 2:18
    ref: Nehemiah 2:18
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 21065
    text: 'And I told them of the hand of my God which was good upon me; as also of the king’s words that he had spoken unto me. And they said: ‘Let us rise up and build.’ So they strengthened their hands for the good work.'
    translation: JPS 1917
    original: וָאַגִּיד לָהֶם אֶת־יַד אֱלֹהַי אֲשֶׁר־הִיא טוֹבָה עָלַי וְאַף־דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר־לִי וַיֹּאמְרוּ נָקוּם וּבָנִינוּ וַיְחַזְּקוּ יְדֵיהֶם לַטּוֹבָה׃
    hebrewPlain: ואגיד להם את יד אלהי אשר היא טובה עלי ואף דברי המלך אשר אמר לי ויאמרו נקום ובנינו ויחזקו ידיהם לטובה
    kjvRefs:
    - Nehemiah 2:18
    kjvOsis:
    - Neh.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.19
    scripture: tanakh
    name: Tanakh Nehemiah 2:19
    ref: Nehemiah 2:19
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 21066
    text: 'But when Sanballat the Horonite, and Tobiah the servant, the Ammonite, and Geshem the Arabian, heard it, they laughed us to scorn, and despised us, and said: ‘What is this thing that ye do? will ye rebel against the king?’'
    translation: JPS 1917
    original: וַיִּשְׁמַע סַנְבַלַּט הַחֹרֹנִי וְטֹבִיָּה הָעֶבֶד הָעַמּוֹנִי וְגֶשֶׁם הָעַרְבִי וַיַּלְעִגוּ לָנוּ וַיִּבְזוּ עָלֵינוּ וַיֹּאמְרוּ מָה־הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים׃
    hebrewPlain: וישמע סנבלט החרני וטביה העבד העמוני וגשם הערבי וילעגו לנו ויבזו עלינו ויאמרו מה הדבר הזה אשר אתם עשים העל המלך אתם מרדים
    kjvRefs:
    - Nehemiah 2:19
    kjvOsis:
    - Neh.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.2.20
    scripture: tanakh
    name: Tanakh Nehemiah 2:20
    ref: Nehemiah 2:20
    book: Neh
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 21067
    text: 'Then answered I them, and said unto them: ‘The God of heaven, He will prosper us; therefore we His servants will arise and build; but ye have no portion, nor right, nor memorial, in Jerusalem.’'
    translation: JPS 1917
    original: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם אֱלֹהֵי הַשָּׁמַיִם הוּא יַצְלִיחַ לָנוּ וַאֲנַחְנוּ עֲבָדָיו נָקוּם וּבָנִינוּ וְלָכֶם אֵין־חֵלֶק וּצְדָקָה וְזִכָּרוֹן בִּירוּשָׁלִָם׃
    hebrewPlain: ואשיב אותם דבר ואומר להם אלהי השמים הוא יצליח לנו ואנחנו עבדיו נקום ובנינו ולכם אין חלק וצדקה וזכרון בירושלם
    kjvRefs:
    - Nehemiah 2:20
    kjvOsis:
    - Neh.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.2
- type: TanakhVerse
  data:
    osis: Neh.3.1
    scripture: tanakh
    name: Tanakh Nehemiah 3:1
    ref: Nehemiah 3:1
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 21068
    text: Then Eliashib the high priest rose up with his brethren the priests, and they builded the sheep gate; they sanctified it, and set up the doors of it; even unto the tower of Hammeah they sanctified it, unto the tower of Hananel.
    translation: JPS 1917
    original: וַיָּקָם אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל וְאֶחָיו הַכֹּהֲנִים וַיִּבְנוּ אֶת־שַׁעַר הַצֹּאן הֵמָּה קִדְּשׁוּהוּ וַיַּעֲמִידוּ דַּלְתֹתָיו וְעַד־מִגְדַּל הַמֵּאָה קִדְּשׁוּהוּ עַד מִגְדַּל חֲנַנְאֵל׃
    hebrewPlain: ויקם אלישיב הכהן הגדול ואחיו הכהנים ויבנו את שער הצאן המה קדשוהו ויעמידו דלתתיו ועד מגדל המאה קדשוהו עד מגדל חננאל
    kjvRefs:
    - Nehemiah 3:1
    kjvOsis:
    - Neh.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.2
    scripture: tanakh
    name: Tanakh Nehemiah 3:2
    ref: Nehemiah 3:2
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 21069
    text: And next unto him builded the men of Jericho. And next to them builded Zaccur the son of Imri.
    translation: JPS 1917
    original: וְעַל־יָדוֹ בָנוּ אַנְשֵׁי יְרֵחוֹ וְעַל־יָדוֹ בָנָה זַכּוּר בֶּן־אִמְרִי׃
    hebrewPlain: ועל ידו בנו אנשי ירחו ועל ידו בנה זכור בן אמרי
    kjvRefs:
    - Nehemiah 3:2
    kjvOsis:
    - Neh.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.3
    scripture: tanakh
    name: Tanakh Nehemiah 3:3
    ref: Nehemiah 3:3
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 21070
    text: And the fish gate did the sons of Hassenaah build; they laid the beams thereof, and set up the doors thereof, the bolts thereof, and the bars thereof.
    translation: JPS 1917
    original: וְאֵת שַׁעַר הַדָּגִים בָּנוּ בְּנֵי הַסְּנָאָה הֵמָּה קֵרוּהוּ וַיַּעֲמִידוּ דַּלְתֹתָיו מַנְעוּלָיו וּבְרִיחָיו׃
    hebrewPlain: ואת שער הדגים בנו בני הסנאה המה קרוהו ויעמידו דלתתיו מנעוליו ובריחיו
    kjvRefs:
    - Nehemiah 3:3
    kjvOsis:
    - Neh.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.4
    scripture: tanakh
    name: Tanakh Nehemiah 3:4
    ref: Nehemiah 3:4
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 21071
    text: And next unto them repaired Meremoth the son of Uriah, the son of Hakkoz. And next unto them repaired Meshullam the son of Berechiah, the son of Meshezabel. And next unto them repaired Zadok the son of Baana.
    translation: JPS 1917
    original: וְעַל־יָדָם הֶחֱזִיק מְרֵמוֹת בֶּן־אוּרִיָּה בֶּן־הַקּוֹץ וְעַל־יָדָם הֶחֱזִיק מְשֻׁלָּם בֶּן־בֶּרֶכְיָה בֶּן־מְשֵׁיזַבְאֵל וְעַל־יָדָם הֶחֱזִיק צָדוֹק בֶּן־בַּעֲנָא׃
    hebrewPlain: ועל ידם החזיק מרמות בן אוריה בן הקוץ ועל ידם החזיק משלם בן ברכיה בן משיזבאל ועל ידם החזיק צדוק בן בענא
    kjvRefs:
    - Nehemiah 3:4
    kjvOsis:
    - Neh.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.5
    scripture: tanakh
    name: Tanakh Nehemiah 3:5
    ref: Nehemiah 3:5
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 21072
    text: And next unto them the Tekoites repaired; and their nobles put not their necks to the work of their lord.
    translation: JPS 1917
    original: וְעַל־יָדָם הֶחֱזִיקוּ הַתְּקוֹעִים וְאַדִּירֵיהֶם לֹא־הֵבִיאוּ צַוָּרָם בַּעֲבֹדַת אֲדֹנֵיהֶם׃
    hebrewPlain: ועל ידם החזיקו התקועים ואדיריהם לא הביאו צורם בעבדת אדניהם
    kjvRefs:
    - Nehemiah 3:5
    kjvOsis:
    - Neh.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.6
    scripture: tanakh
    name: Tanakh Nehemiah 3:6
    ref: Nehemiah 3:6
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 21073
    text: And the gate of the old city repaired Joiada the son of Paseah and Meshullam the son of Besodeiah; they laid the beams thereof, and set up the doors thereof, and the bolts thereof, and the bars thereof.
    translation: JPS 1917
    original: וְאֵת שַׁעַר הַיְשָׁנָה הֶחֱזִיקוּ יוֹיָדָע בֶּן־פָּסֵחַ וּמְשֻׁלָּם בֶּן־בְּסוֹדְיָה הֵמָּה קֵרוּהוּ וַיַּעֲמִידוּ דַּלְתֹתָיו וּמַנְעֻלָיו וּבְרִיחָיו׃
    hebrewPlain: ואת שער הישנה החזיקו יוידע בן פסח ומשלם בן בסודיה המה קרוהו ויעמידו דלתתיו ומנעליו ובריחיו
    kjvRefs:
    - Nehemiah 3:6
    kjvOsis:
    - Neh.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.7
    scripture: tanakh
    name: Tanakh Nehemiah 3:7
    ref: Nehemiah 3:7
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 21074
    text: And next unto them repaired Melatiah the Gibeonite, and Jadon the Meronothite, the men of Gibeon, and of Mizpah, for them that appertained to the throne of the governor beyond the River.
    translation: JPS 1917
    original: וְעַל־יָדָם הֶחֱזִיק מְלַטְיָה הַגִּבְעֹנִי וְיָדוֹן הַמֵּרֹנֹתִי אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה לְכִסֵּא פַּחַת עֵבֶר הַנָּהָר׃
    hebrewPlain: ועל ידם החזיק מלטיה הגבעני וידון המרנתי אנשי גבעון והמצפה לכסא פחת עבר הנהר
    kjvRefs:
    - Nehemiah 3:7
    kjvOsis:
    - Neh.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.8
    scripture: tanakh
    name: Tanakh Nehemiah 3:8
    ref: Nehemiah 3:8
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 21075
    text: Next unto him repaired Uzziel the son of Harhaiah, goldsmiths. And next unto him repaired Hananiah one of the perfumers, and they restored Jerusalem even unto the broad wall.
    translation: JPS 1917
    original: עַל־יָדוֹ הֶחֱזִיק עֻזִּיאֵל בֶּן־חַרְהֲיָה צוֹרְפִים וְעַל־יָדוֹ הֶחֱזִיק חֲנַנְיָה בֶּן־הָרַקָּחִים וַיַּעַזְבוּ יְרוּשָׁלִַם עַד הַחוֹמָה הָרְחָבָה׃
    hebrewPlain: על ידו החזיק עזיאל בן חרהיה צורפים ועל ידו החזיק חנניה בן הרקחים ויעזבו ירושלם עד החומה הרחבה
    kjvRefs:
    - Nehemiah 3:8
    kjvOsis:
    - Neh.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.9
    scripture: tanakh
    name: Tanakh Nehemiah 3:9
    ref: Nehemiah 3:9
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 21076
    text: And next unto them repaired Rephaiah the son of Hur, the ruler of half the district of Jerusalem.
    translation: JPS 1917
    original: וְעַל־יָדָם הֶחֱזִיק רְפָיָה בֶן־חוּר שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם׃
    hebrewPlain: ועל ידם החזיק רפיה בן חור שר חצי פלך ירושלם
    kjvRefs:
    - Nehemiah 3:9
    kjvOsis:
    - Neh.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.10
    scripture: tanakh
    name: Tanakh Nehemiah 3:10
    ref: Nehemiah 3:10
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 21077
    text: And next unto them repaired Jedaiah the son of Harumaph, even over against his house. And next unto him repaired Hattush the son of Hashabneiah.
    translation: JPS 1917
    original: וְעַל־יָדָם הֶחֱזִיק יְדָיָה בֶן־חֲרוּמַף וְנֶגֶד בֵּיתוֹ וְעַל־יָדוֹ הֶחֱזִיק חַטּוּשׁ בֶּן־חֲשַׁבְנְיָה׃
    hebrewPlain: ועל ידם החזיק ידיה בן חרומף ונגד ביתו ועל ידו החזיק חטוש בן חשבניה
    kjvRefs:
    - Nehemiah 3:10
    kjvOsis:
    - Neh.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.11
    scripture: tanakh
    name: Tanakh Nehemiah 3:11
    ref: Nehemiah 3:11
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 21078
    text: Malchijah the son of Harim, and Hasshub the son of Pahath-moab, repaired another portion, and the tower of the furnaces.
    translation: JPS 1917
    original: מִדָּה שֵׁנִית הֶחֱזִיק מַלְכִּיָּה בֶן־חָרִם וְחַשּׁוּב בֶּן־פַּחַת מוֹאָב וְאֵת מִגְדַּל הַתַּנּוּרִים׃
    hebrewPlain: מדה שנית החזיק מלכיה בן חרם וחשוב בן פחת מואב ואת מגדל התנורים
    kjvRefs:
    - Nehemiah 3:11
    kjvOsis:
    - Neh.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.12
    scripture: tanakh
    name: Tanakh Nehemiah 3:12
    ref: Nehemiah 3:12
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 21079
    text: And next unto him repaired Shallum the son of Hallohesh, the ruler of half the district of Jerusalem, he and his daughters.
    translation: JPS 1917
    original: וְעַל־יָדוֹ הֶחֱזִיק שַׁלּוּם בֶּן־הַלּוֹחֵשׁ שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם הוּא וּבְנוֹתָיו׃
    hebrewPlain: ועל ידו החזיק שלום בן הלוחש שר חצי פלך ירושלם הוא ובנותיו
    kjvRefs:
    - Nehemiah 3:12
    kjvOsis:
    - Neh.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.13
    scripture: tanakh
    name: Tanakh Nehemiah 3:13
    ref: Nehemiah 3:13
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 21080
    text: The valley gate repaired Hanun, and the inhabitants of Zanoah; they built it, and set up the doors thereof, the bolts thereof, and the bars thereof, and a thousand cubits of the wall unto the dung gate.
    translation: JPS 1917
    original: אֵת שַׁעַר הַגַּיְא הֶחֱזִיק חָנוּן וְיֹשְׁבֵי זָנוֹחַ הֵמָּה בָנוּהוּ וַיַּעֲמִידוּ דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו וְאֶלֶף אַמָּה בַּחוֹמָה עַד שַׁעַר הָשֲׁפוֹת׃
    hebrewPlain: את שער הגיא החזיק חנון וישבי זנוח המה בנוהו ויעמידו דלתתיו מנעליו ובריחיו ואלף אמה בחומה עד שער השפות
    kjvRefs:
    - Nehemiah 3:13
    kjvOsis:
    - Neh.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.14
    scripture: tanakh
    name: Tanakh Nehemiah 3:14
    ref: Nehemiah 3:14
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 21081
    text: And the dung gate repaired Malchijah the son of Rechab, the ruler of the district of Beth-cherem; he built it, and set up the doors thereof, the bolts thereof, and the bars thereof.
    translation: JPS 1917
    original: וְאֵת שַׁעַר הָאַשְׁפּוֹת הֶחֱזִיק מַלְכִּיָּה בֶן־רֵכָב שַׂר פֶּלֶךְ בֵּית־הַכָּרֶם הוּא יִבְנֶנּוּ וְיַעֲמִיד דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו׃
    hebrewPlain: ואת שער האשפות החזיק מלכיה בן רכב שר פלך בית הכרם הוא יבננו ויעמיד דלתתיו מנעליו ובריחיו
    kjvRefs:
    - Nehemiah 3:14
    kjvOsis:
    - Neh.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.15
    scripture: tanakh
    name: Tanakh Nehemiah 3:15
    ref: Nehemiah 3:15
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 21082
    text: And the fountain gate repaired Shallun the son of Colhozeh, the ruler of the district of Mizpah; he built it, and covered it, and set up the doors thereof, the bolts thereof, and the bars thereof, and the wall of the pool of Shelah by the king’s garden, even unto the stairs that go down from the city of David.
    translation: JPS 1917
    original: וְאֵת שַׁעַר הָעַיִן הֶחֱזִיק שַׁלּוּן בֶּן־כָּל־חֹזֶה שַׂר פֶּלֶךְ הַמִּצְפָּה הוּא יִבְנֶנּוּ וִיטַלְלֶנּוּ ויעמידו [וְיַעֲמִיד] דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו וְאֵת חוֹמַת בְּרֵכַת הַשֶּׁלַח לְגַן־הַמֶּלֶךְ וְעַד־הַמַּעֲלוֹת הַיּוֹרְדוֹת מֵעִיר דָּוִיד׃
    hebrewPlain: ואת שער העין החזיק שלון בן כל חזה שר פלך המצפה הוא יבננו ויטללנו ויעמידו [ויעמיד] דלתתיו מנעליו ובריחיו ואת חומת ברכת השלח לגן המלך ועד המעלות היורדות מעיר דויד
    kjvRefs:
    - Nehemiah 3:15
    kjvOsis:
    - Neh.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.16
    scripture: tanakh
    name: Tanakh Nehemiah 3:16
    ref: Nehemiah 3:16
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 21083
    text: After him repaired Nehemiah the son of Azbuk, the ruler of half the district of Beth-zur, unto the place over against the sepulchres of David, and unto the pool that was made, and unto the house of the mighty men.
    translation: JPS 1917
