  data:
    osis: Neh.10.29
    scripture: tanakh
    name: Tanakh Nehemiah 10:29
    ref: Nehemiah 10:29
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 29
    ordinal: 21316
    text: And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinim, and all they that had separated themselves from the peoples of the lands unto the law of God, their wives, their sons, and their daughters, every one that had knowledge and understanding;
    translation: JPS 1917
    original: וּשְׁאָר הָעָם הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים הַנְּתִינִים וְכָל־הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל־תּוֹרַת הָאֱלֹהִים נְשֵׁיהֶם בְּנֵיהֶם וּבְנֹתֵיהֶם כֹּל יוֹדֵעַ מֵבִין׃
    hebrewPlain: ושאר העם הכהנים הלוים השוערים המשררים הנתינים וכל הנבדל מעמי הארצות אל תורת האלהים נשיהם בניהם ובנתיהם כל יודע מבין
    kjvRefs:
    - Nehemiah 10:28
    kjvOsis:
    - Neh.10.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.30
    scripture: tanakh
    name: Tanakh Nehemiah 10:30
    ref: Nehemiah 10:30
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 30
    ordinal: 21317
    text: they cleaved to their brethren, their nobles, and entered into a curse, and into an oath, to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord, and His ordinances and His statutes;
    translation: JPS 1917
    original: מַחֲזִיקִים עַל־אֲחֵיהֶם אַדִּירֵיהֶם וּבָאִים בְּאָלָה וּבִשְׁבוּעָה לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה עֶבֶד־הָאֱלֹהִים וְלִשְׁמוֹר וְלַעֲשׂוֹת אֶת־כָּל־מִצְוֺת יְהוָה אֲדֹנֵינוּ וּמִשְׁפָּטָיו וְחֻקָּיו׃
    hebrewPlain: מחזיקים על אחיהם אדיריהם ובאים באלה ובשבועה ללכת בתורת האלהים אשר נתנה ביד משה עבד האלהים ולשמור ולעשות את כל מצות יהוה אדנינו ומשפטיו וחקיו
    kjvRefs:
    - Nehemiah 10:29
    kjvOsis:
    - Neh.10.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.31
    scripture: tanakh
    name: Tanakh Nehemiah 10:31
    ref: Nehemiah 10:31
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 31
    ordinal: 21318
    text: and that we would not give our daughters unto the peoples of the land, nor take their daughters for our sons;
    translation: JPS 1917
    original: וַאֲשֶׁר לֹא־נִתֵּן בְּנֹתֵינוּ לְעַמֵּי הָאָרֶץ וְאֶת־בְּנֹתֵיהֶם לֹא נִקַּח לְבָנֵינוּ׃
    hebrewPlain: ואשר לא נתן בנתינו לעמי הארץ ואת בנתיהם לא נקח לבנינו
    kjvRefs:
    - Nehemiah 10:30
    kjvOsis:
    - Neh.10.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.32
    scripture: tanakh
    name: Tanakh Nehemiah 10:32
    ref: Nehemiah 10:32
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 32
    ordinal: 21319
    text: and if the peoples of the land bring ware or any victuals on the sabbath day to sell, that we would not buy of them on the sabbath, or on a holy day; and that we would forego the seventh year, and the exaction of every debt.
    translation: JPS 1917
    original: וְעַמֵּי הָאָרֶץ הַמְבִיאִים אֶת־הַמַּקָּחוֹת וְכָל־שֶׁבֶר בְּיוֹם הַשַּׁבָּת לִמְכּוֹר לֹא־נִקַּח מֵהֶם בַּשַּׁבָּת וּבְיוֹם קֹדֶשׁ וְנִטֹּשׁ אֶת־הַשָּׁנָה הַשְּׁבִיעִית וּמַשָּׁא כָל־יָד׃
    hebrewPlain: ועמי הארץ המביאים את המקחות וכל שבר ביום השבת למכור לא נקח מהם בשבת וביום קדש ונטש את השנה השביעית ומשא כל יד
    kjvRefs:
    - Nehemiah 10:31
    kjvOsis:
    - Neh.10.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.33
    scripture: tanakh
    name: Tanakh Nehemiah 10:33
    ref: Nehemiah 10:33
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 33
    ordinal: 21320
    text: Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;
    translation: JPS 1917
    original: וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת לָתֵת עָלֵינוּ שְׁלִשִׁית הַשֶּׁקֶל בַּשָּׁנָה לַעֲבֹדַת בֵּית אֱלֹהֵינוּ׃
    hebrewPlain: והעמדנו עלינו מצות לתת עלינו שלשית השקל בשנה לעבדת בית אלהינו
    kjvRefs:
    - Nehemiah 10:32
    kjvOsis:
    - Neh.10.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.34
    scripture: tanakh
    name: Tanakh Nehemiah 10:34
    ref: Nehemiah 10:34
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 34
    ordinal: 21321
    text: for the showbread, and for the continual meal-offering, and for the continual burnt-offering, of the sabbaths, of the new moons, for the appointed seasons, and for the holy things, and for the sin-offerings to make atonement for Israel, and for all the work of the house of our God.
    translation: JPS 1917
    original: לְלֶחֶם הַמַּעֲרֶכֶת וּמִנְחַת הַתָּמִיד וּלְעוֹלַת הַתָּמִיד הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים וְלַקֳּדָשִׁים וְלַחַטָּאוֹת לְכַפֵּר עַל־יִשְׂרָאֵל וְכֹל מְלֶאכֶת בֵּית־אֱלֹהֵינוּ׃
    hebrewPlain: ללחם המערכת ומנחת התמיד ולעולת התמיד השבתות החדשים למועדים ולקדשים ולחטאות לכפר על ישראל וכל מלאכת בית אלהינו
    kjvRefs:
    - Nehemiah 10:33
    kjvOsis:
    - Neh.10.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.35
    scripture: tanakh
    name: Tanakh Nehemiah 10:35
    ref: Nehemiah 10:35
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 35
    ordinal: 21322
    text: And we cast lots, the priests, the Levites, and the people, for the wood-offering, to bring it into the house of our God, according to our fathers’ houses, at times appointed, year by year, to burn upon the altar of the LORD our God, as it is written in the Law;
    translation: JPS 1917
    original: וְהַגּוֹרָלוֹת הִפַּלְנוּ עַל־קֻרְבַּן הָעֵצִים הַכֹּהֲנִים הַלְוִיִּם וְהָעָם לְהָבִיא לְבֵית אֱלֹהֵינוּ לְבֵית־אֲבֹתֵינוּ לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה לְבַעֵר עַל־מִזְבַּח יְהוָה אֱלֹהֵינוּ כַּכָּתוּב בַּתּוֹרָה׃
    hebrewPlain: והגורלות הפלנו על קרבן העצים הכהנים הלוים והעם להביא לבית אלהינו לבית אבתינו לעתים מזמנים שנה בשנה לבער על מזבח יהוה אלהינו ככתוב בתורה
    kjvRefs:
    - Nehemiah 10:34
    kjvOsis:
    - Neh.10.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.36
    scripture: tanakh
    name: Tanakh Nehemiah 10:36
    ref: Nehemiah 10:36
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 36
    ordinal: 21323
    text: and to bring the first-fruits of our land, and the first-fruits of all fruit of all manner of trees, year by year, unto the house of the LORD;
    translation: JPS 1917
    original: וּלְהָבִיא אֶת־בִּכּוּרֵי אַדְמָתֵנוּ וּבִכּוּרֵי כָּל־פְּרִי כָל־עֵץ שָׁנָה בְשָׁנָה לְבֵית יְהוָה׃
    hebrewPlain: ולהביא את בכורי אדמתנו ובכורי כל פרי כל עץ שנה בשנה לבית יהוה
    kjvRefs:
    - Nehemiah 10:35
    kjvOsis:
    - Neh.10.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.37
    scripture: tanakh
    name: Tanakh Nehemiah 10:37
    ref: Nehemiah 10:37
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 37
    ordinal: 21324
    text: also the first-born of our sons, and of our cattle, as it is written in the Law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God;
    translation: JPS 1917
    original: וְאֶת־בְּכֹרוֹת בָּנֵינוּ וּבְהֶמְתֵּינוּ כַּכָּתוּב בַּתּוֹרָה וְאֶת־בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ לְהָבִיא לְבֵית אֱלֹהֵינוּ לַכֹּהֲנִים הַמְשָׁרְתִים בְּבֵית אֱלֹהֵינוּ׃
    hebrewPlain: ואת בכרות בנינו ובהמתינו ככתוב בתורה ואת בכורי בקרינו וצאנינו להביא לבית אלהינו לכהנים המשרתים בבית אלהינו
    kjvRefs:
    - Nehemiah 10:36
    kjvOsis:
    - Neh.10.36
