    text: 'And these were they that went up from Tel-melah, Tel-harsha, Cherub, Addon, and Immer; but they could not tell their fathers’ houses, nor their seed, whether they were of Israel:'
    translation: JPS 1917
    original: וְאֵלֶּה הָעוֹלִים מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר וְלֹא יָכְלוּ לְהַגִּיד בֵּית־אֲבוֹתָם וְזַרְעָם אִם מִיִּשְׂרָאֵל הֵם׃
