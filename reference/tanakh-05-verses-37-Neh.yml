- type: TanakhVerse
  data:
    osis: Neh.12.35
    scripture: tanakh
    name: Tanakh Nehemiah 12:35
    ref: Nehemiah 12:35
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 35
    ordinal: 21398
    text: 'and certain of the priests’ sons with trumpets: Zechariah the son of Jonathan, the son of Shemaiah, the son of Mattaniah, the son of Micaiah, the son of Zaccur, the son of Asaph;'
    translation: JPS 1917
    original: וּמִבְּנֵי הַכֹּהֲנִים בַּחֲצֹצְרוֹת זְכַרְיָה בֶן־יוֹנָתָן בֶּן־שְׁמַעְיָה בֶּן־מַתַּנְיָה בֶּן־מִיכָיָה בֶּן־זַכּוּר בֶּן־אָסָף׃
    hebrewPlain: ומבני הכהנים בחצצרות זכריה בן יונתן בן שמעיה בן מתניה בן מיכיה בן זכור בן אסף
    kjvRefs:
    - Nehemiah 12:35
    kjvOsis:
    - Neh.12.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.36
    scripture: tanakh
    name: Tanakh Nehemiah 12:36
    ref: Nehemiah 12:36
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 36
    ordinal: 21399
    text: and his brethren, Shemaiah, and Azarel, Milalai, Gilalai, Maai, Nethanel, and Judah, Hanani, with the musical instruments of David the man of God; and Ezra the scribe was before them;
    translation: JPS 1917
    original: וְאֶחָיו שְׁמַעְיָה וַעֲזַרְאֵל מִלֲלַי גִּלֲלַי מָעַי נְתַנְאֵל וִיהוּדָה חֲנָנִי בִּכְלֵי־שִׁיר דָּוִיד אִישׁ הָאֱלֹהִים וְעֶזְרָא הַסּוֹפֵר לִפְנֵיהֶם׃
    hebrewPlain: ואחיו שמעיה ועזראל מללי גללי מעי נתנאל ויהודה חנני בכלי שיר דויד איש האלהים ועזרא הסופר לפניהם
    kjvRefs:
    - Nehemiah 12:36
    kjvOsis:
    - Neh.12.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.37
    scripture: tanakh
    name: Tanakh Nehemiah 12:37
    ref: Nehemiah 12:37
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 37
    ordinal: 21400
    text: and by the fountain gate, and straight before them, they went up by the stairs of the city of David, at the going up of the wall, above the house of David, even unto the water gate eastward.
    translation: JPS 1917
    original: וְעַל שַׁעַר הָעַיִן וְנֶגְדָּם עָלוּ עַל־מַעֲלוֹת עִיר דָּוִיד בַּמַּעֲלֶה לַחוֹמָה מֵעַל לְבֵית דָּוִיד וְעַד שַׁעַר הַמַּיִם מִזְרָח׃
    hebrewPlain: ועל שער העין ונגדם עלו על מעלות עיר דויד במעלה לחומה מעל לבית דויד ועד שער המים מזרח
    kjvRefs:
    - Nehemiah 12:37
    kjvOsis:
    - Neh.12.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.38
    scripture: tanakh
    name: Tanakh Nehemiah 12:38
    ref: Nehemiah 12:38
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 38
    ordinal: 21401
    text: And the other company of them that gave thanks went to meet them, and I after them, with the half of the people, upon the wall, above the tower of the furnaces, even unto the broad wall;
    translation: JPS 1917
    original: וְהַתּוֹדָה הַשֵּׁנִית הַהוֹלֶכֶת לְמוֹאל וַאֲנִי אַחֲרֶיהָ וַחֲצִי הָעָם מֵעַל לְהַחוֹמָה מֵעַל לְמִגְדַּל הַתַּנּוּרִים וְעַד הַחוֹמָה הָרְחָבָה׃
    hebrewPlain: והתודה השנית ההולכת למואל ואני אחריה וחצי העם מעל להחומה מעל למגדל התנורים ועד החומה הרחבה
    kjvRefs:
    - Nehemiah 12:38
    kjvOsis:
    - Neh.12.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.39
    scripture: tanakh
    name: Tanakh Nehemiah 12:39
    ref: Nehemiah 12:39
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 39
    ordinal: 21402
    text: and above the gate of Ephraim, and by the gate of the old city and by the fish gate, and the tower of Hananel, and the tower of Hammeah, even unto the sheep gate; and they stood still in the gate of the guard.
    translation: JPS 1917
    original: וּמֵעַל לְשַׁעַר־אֶפְרַיִם וְעַל־שַׁעַר הַיְשָׁנָה וְעַל־שַׁעַר הַדָּגִים וּמִגְדַּל חֲנַנְאֵל וּמִגְדַּל הַמֵּאָה וְעַד שַׁעַר הַצֹּאן וְעָמְדוּ בְּשַׁעַר הַמַּטָּרָה׃
    hebrewPlain: ומעל לשער אפרים ועל שער הישנה ועל שער הדגים ומגדל חננאל ומגדל המאה ועד שער הצאן ועמדו בשער המטרה
    kjvRefs:
    - Nehemiah 12:39
    kjvOsis:
    - Neh.12.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.40
    scripture: tanakh
    name: Tanakh Nehemiah 12:40
    ref: Nehemiah 12:40
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 40
    ordinal: 21403
    text: So stood the two companies of them that gave thanks in the house of God, and I, and the half of the rulers with me;
    translation: JPS 1917
    original: וַתַּעֲמֹדְנָה שְׁתֵּי הַתּוֹדֹת בְּבֵית הָאֱלֹהִים וַאֲנִי וַחֲצִי הַסְּגָנִים עִמִּי׃
    hebrewPlain: ותעמדנה שתי התודת בבית האלהים ואני וחצי הסגנים עמי
    kjvRefs:
    - Nehemiah 12:40
    kjvOsis:
    - Neh.12.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.41
    scripture: tanakh
    name: Tanakh Nehemiah 12:41
    ref: Nehemiah 12:41
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 41
    ordinal: 21404
    text: and the priests, Eliakim, Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets;
    translation: JPS 1917
    original: וְהַכֹּהֲנִים אֶלְיָקִים מַעֲשֵׂיָה מִנְיָמִין מִיכָיָה אֶלְיוֹעֵינַי זְכַרְיָה חֲנַנְיָה בַּחֲצֹצְרוֹת׃
    hebrewPlain: והכהנים אליקים מעשיה מנימין מיכיה אליועיני זכריה חנניה בחצצרות
    kjvRefs:
    - Nehemiah 12:41
    kjvOsis:
    - Neh.12.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.42
    scripture: tanakh
    name: Tanakh Nehemiah 12:42
    ref: Nehemiah 12:42
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 42
    ordinal: 21405
    text: and Maaseiah, and Shemaiah, and Eleazar, and Uzzi, and Jehohanan, and Malchijah, and Elam, and Ezer. And the singers sang loud, with Jezrahiah their overseer.
    translation: JPS 1917
    original: וּמַעֲשֵׂיָה וּשְׁמַעְיָה וְאֶלְעָזָר וְעֻזִּי וִיהוֹחָנָן וּמַלְכִּיָּה וְעֵילָם וָעָזֶר וַיַּשְׁמִיעוּ הַמְשֹׁרְרִים וְיִזְרַחְיָה הַפָּקִיד׃
    hebrewPlain: ומעשיה ושמעיה ואלעזר ועזי ויהוחנן ומלכיה ועילם ועזר וישמיעו המשררים ויזרחיה הפקיד
    kjvRefs:
    - Nehemiah 12:42
    kjvOsis:
    - Neh.12.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.43
    scripture: tanakh
    name: Tanakh Nehemiah 12:43
    ref: Nehemiah 12:43
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 43
    ordinal: 21406
    text: And they offered great sacrifices that day, and rejoiced; for God had made them rejoice with great joy; and the women also and the children rejoiced; so that the joy of Jerusalem was heard even afar off.
    translation: JPS 1917
    original: וַיִּזְבְּחוּ בַיּוֹם־הַהוּא זְבָחִים גְּדוֹלִים וַיִּשְׂמָחוּ כִּי הָאֱלֹהִים שִׂמְּחָם שִׂמְחָה גְדוֹלָה וְגַם הַנָּשִׁים וְהַיְלָדִים שָׂמֵחוּ וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק׃
    hebrewPlain: ויזבחו ביום ההוא זבחים גדולים וישמחו כי האלהים שמחם שמחה גדולה וגם הנשים והילדים שמחו ותשמע שמחת ירושלם מרחוק
    kjvRefs:
    - Nehemiah 12:43
    kjvOsis:
    - Neh.12.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.44
    scripture: tanakh
    name: Tanakh Nehemiah 12:44
    ref: Nehemiah 12:44
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 44
    ordinal: 21407
    text: And on that day were men appointed over the chambers for the treasures, for the heave-offerings, for the first-fruits, and for the tithes, to gather into them, according to the fields of the cities, the portions appointed by the law for the priests and Levites; for Judah rejoiced for the priests and for the Levites that took their stations.
    translation: JPS 1917
    original: וַיִּפָּקְדוּ בַיּוֹם הַהוּא אֲנָשִׁים עַל־הַנְּשָׁכוֹת לָאוֹצָרוֹת לַתְּרוּמוֹת לָרֵאשִׁית וְלַמַּעַשְׂרוֹת לִכְנוֹס בָּהֶם לִשְׂדֵי הֶעָרִים מְנָאוֹת הַתּוֹרָה לַכֹּהֲנִים וְלַלְוִיִּם כִּי שִׂמְחַת יְהוּדָה עַל־הַכֹּהֲנִים וְעַל־הַלְוִיִּם הָעֹמְדִים׃
    hebrewPlain: ויפקדו ביום ההוא אנשים על הנשכות לאוצרות לתרומות לראשית ולמעשרות לכנוס בהם לשדי הערים מנאות התורה לכהנים וללוים כי שמחת יהודה על הכהנים ועל הלוים העמדים
    kjvRefs:
    - Nehemiah 12:44
    kjvOsis:
    - Neh.12.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.45
    scripture: tanakh
    name: Tanakh Nehemiah 12:45
    ref: Nehemiah 12:45
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 45
    ordinal: 21408
    text: And they kept the ward of their God, and the ward of the purification, and so did the singers and the porters, according to the commandment of David, and of Solomon his son.
    translation: JPS 1917
    original: וַיִּשְׁמְרוּ מִשְׁמֶרֶת אֱלֹהֵיהֶם וּמִשְׁמֶרֶת הַטָּהֳרָה וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים כְּמִצְוַת דָּוִיד שְׁלֹמֹה בְנוֹ׃
    hebrewPlain: וישמרו משמרת אלהיהם ומשמרת הטהרה והמשררים והשערים כמצות דויד שלמה בנו
    kjvRefs:
    - Nehemiah 12:45
    kjvOsis:
    - Neh.12.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.46
    scripture: tanakh
    name: Tanakh Nehemiah 12:46
    ref: Nehemiah 12:46
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 46
    ordinal: 21409
    text: For in the days of David and Asaph of old there were chief of the singers, and songs of praise and thanksgiving unto God.
    translation: JPS 1917
    original: כִּי־בִימֵי דָוִיד וְאָסָף מִקֶּדֶם ראש [רָאשֵׁי] הַמְשֹׁרְרִים וְשִׁיר־תְּהִלָּה וְהֹדוֹת לֵאלֹהִים׃
    hebrewPlain: כי בימי דויד ואסף מקדם ראש [ראשי] המשררים ושיר תהלה והדות לאלהים
    kjvRefs:
    - Nehemiah 12:46
    kjvOsis:
    - Neh.12.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.47
    scripture: tanakh
    name: Tanakh Nehemiah 12:47
    ref: Nehemiah 12:47
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 47
    ordinal: 21410
    text: And all Israel in the days of Zerubbabel, and in the days of Nehemiah, gave the portions of the singers and the porters, as every day required; and they hallowed for the Levites; and the Levites hallowed for the sons of Aaron.
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה נֹתְנִים מְנָיוֹת הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים דְּבַר־יוֹם בְּיוֹמוֹ וּמַקְדִּשִׁים לַלְוִיִּם וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן׃
    hebrewPlain: וכל ישראל בימי זרבבל ובימי נחמיה נתנים מניות המשררים והשערים דבר יום ביומו ומקדשים ללוים והלוים מקדשים לבני אהרן
    kjvRefs:
    - Nehemiah 12:47
    kjvOsis:
    - Neh.12.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.13.1
    scripture: tanakh
    name: Tanakh Nehemiah 13:1
    ref: Nehemiah 13:1
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 1
    ordinal: 21411
    text: On that day they read in the book of Moses in the hearing of the people; and therein was found written, that an Ammonite and a Moabite should not enter into the assembly of God for ever;
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא נִקְרָא בְּסֵפֶר מֹשֶׁה בְּאָזְנֵי הָעָם וְנִמְצָא כָּתוּב בּוֹ אֲשֶׁר לֹא־יָבוֹא עַמֹּנִי וּמֹאָבִי בִּקְהַל הָאֱלֹהִים עַד־עוֹלָם׃
    hebrewPlain: ביום ההוא נקרא בספר משה באזני העם ונמצא כתוב בו אשר לא יבוא עמני ומאבי בקהל האלהים עד עולם
    kjvRefs:
    - Nehemiah 13:1
    kjvOsis:
    - Neh.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.2
    scripture: tanakh
    name: Tanakh Nehemiah 13:2
    ref: Nehemiah 13:2
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 2
    ordinal: 21412
    text: because they met not the children of Israel with bread and with water, but hired Balaam against them, to curse them; howbeit our God turned the curse into a blessing.
    translation: JPS 1917
    original: כִּי לֹא קִדְּמוּ אֶת־בְּנֵי יִשְׂרָאֵל בַּלֶּחֶם וּבַמָּיִם וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם לְקַלְלוֹ וַיַּהֲפֹךְ אֱלֹהֵינוּ הַקְּלָלָה לִבְרָכָה׃
    hebrewPlain: כי לא קדמו את בני ישראל בלחם ובמים וישכר עליו את בלעם לקללו ויהפך אלהינו הקללה לברכה
    kjvRefs:
    - Nehemiah 13:2
    kjvOsis:
    - Neh.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.3
    scripture: tanakh
    name: Tanakh Nehemiah 13:3
    ref: Nehemiah 13:3
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 3
    ordinal: 21413
    text: And it came to pass, when they had heard the law, that they separated from Israel all the alien mixture.
    translation: JPS 1917
    original: וַיְהִי כְּשָׁמְעָם אֶת־הַתּוֹרָה וַיַּבְדִּילוּ כָל־עֵרֶב מִיִּשְׂרָאֵל׃
    hebrewPlain: ויהי כשמעם את התורה ויבדילו כל ערב מישראל
    kjvRefs:
    - Nehemiah 13:3
    kjvOsis:
    - Neh.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.4
    scripture: tanakh
    name: Tanakh Nehemiah 13:4
    ref: Nehemiah 13:4
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 4
    ordinal: 21414
    text: Now before this, Eliashib the priest, who was appointed over the chambers of the house of our God, being allied unto Tobiah,
    translation: JPS 1917
    original: וְלִפְנֵי מִזֶּה אֶלְיָשִׁיב הַכֹּהֵן נָתוּן בְּלִשְׁכַּת בֵּית־אֱלֹהֵינוּ קָרוֹב לְטוֹבִיָּה׃
    hebrewPlain: ולפני מזה אלישיב הכהן נתון בלשכת בית אלהינו קרוב לטוביה
    kjvRefs:
    - Nehemiah 13:4
    kjvOsis:
    - Neh.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.5
    scripture: tanakh
    name: Tanakh Nehemiah 13:5
    ref: Nehemiah 13:5
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 5
    ordinal: 21415
    text: had prepared for him a great chamber, where aforetime they laid the meal-offerings, the frankincense, and the vessels, and the tithes of the corn, the wine, and the oil, which were given by commandment to the Levites, and the singers, and the porters; and the heave-offerings for the priests.
    translation: JPS 1917
    original: וַיַּעַשׂ לוֹ לִשְׁכָּה גְדוֹלָה וְשָׁם הָיוּ לְפָנִים נֹתְנִים אֶת־הַמִּנְחָה הַלְּבוֹנָה וְהַכֵּלִים וּמַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים וּתְרוּמַת הַכֹּהֲנִים׃
    hebrewPlain: ויעש לו לשכה גדולה ושם היו לפנים נתנים את המנחה הלבונה והכלים ומעשר הדגן התירוש והיצהר מצות הלוים והמשררים והשערים ותרומת הכהנים
    kjvRefs:
    - Nehemiah 13:5
    kjvOsis:
    - Neh.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.6
    scripture: tanakh
    name: Tanakh Nehemiah 13:6
    ref: Nehemiah 13:6
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 6
    ordinal: 21416
    text: But in all this time I was not at Jerusalem; for in the two and thirtieth year of Artaxerxes king of Babylon I went unto the king, and after certain days asked I leave of the king;
    translation: JPS 1917
    original: וּבְכָל־זֶה לֹא הָיִיתִי בִּירוּשָׁלִָם כִּי בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא מֶלֶךְ־בָּבֶל בָּאתִי אֶל־הַמֶּלֶךְ וּלְקֵץ יָמִים נִשְׁאַלְתִּי מִן־הַמֶּלֶךְ׃
    hebrewPlain: ובכל זה לא הייתי בירושלם כי בשנת שלשים ושתים לארתחשסתא מלך בבל באתי אל המלך ולקץ ימים נשאלתי מן המלך
    kjvRefs:
    - Nehemiah 13:6
    kjvOsis:
    - Neh.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.7
    scripture: tanakh
    name: Tanakh Nehemiah 13:7
    ref: Nehemiah 13:7
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 7
    ordinal: 21417
    text: and I came to Jerusalem, and understood the evil that Eliashib had done for Tobiah, in preparing him a chamber in the courts of the house of God.
    translation: JPS 1917
    original: וָאָבוֹא לִירוּשָׁלִָם וָאָבִינָה בָרָעָה אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה לַעֲשׂוֹת לוֹ נִשְׁכָּה בְּחַצְרֵי בֵּית הָאֱלֹהִים׃
    hebrewPlain: ואבוא לירושלם ואבינה ברעה אשר עשה אלישיב לטוביה לעשות לו נשכה בחצרי בית האלהים
    kjvRefs:
    - Nehemiah 13:7
    kjvOsis:
    - Neh.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.8
    scripture: tanakh
    name: Tanakh Nehemiah 13:8
    ref: Nehemiah 13:8
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 8
    ordinal: 21418
    text: And it grieved me sore; therefore I cast forth all the household stuff of Tobiah out of the chamber.
    translation: JPS 1917
    original: וַיֵּרַע לִי מְאֹד וָאַשְׁלִיכָה אֶת־כָּל־כְּלֵי בֵית־טוֹבִיָּה הַחוּץ מִן־הַלִּשְׁכָּה׃
    hebrewPlain: וירע לי מאד ואשליכה את כל כלי בית טוביה החוץ מן הלשכה
    kjvRefs:
    - Nehemiah 13:8
    kjvOsis:
    - Neh.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.9
    scripture: tanakh
    name: Tanakh Nehemiah 13:9
    ref: Nehemiah 13:9
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 9
    ordinal: 21419
    text: Then I commanded, and they cleansed the chambers; and thither brought I again the vessels of the house of God, with the meal-offerings and the frankincense.
    translation: JPS 1917
    original: וָאֹמְרָה וַיְטַהֲרוּ הַלְּשָׁכוֹת וָאָשִׁיבָה שָּׁם כְּלֵי בֵּית הָאֱלֹהִים אֶת־הַמִּנְחָה וְהַלְּבוֹנָה׃
    hebrewPlain: ואמרה ויטהרו הלשכות ואשיבה שם כלי בית האלהים את המנחה והלבונה
    kjvRefs:
    - Nehemiah 13:9
    kjvOsis:
    - Neh.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.10
    scripture: tanakh
    name: Tanakh Nehemiah 13:10
    ref: Nehemiah 13:10
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 10
    ordinal: 21420
    text: And I perceived that the portions of the Levites had not been given them; so that the Levites and the singers, that did the work, were fled every one to his field.
    translation: JPS 1917
    original: וָאֵדְעָה כִּי־מְנָיוֹת הַלְוִיִּם לֹא נִתָּנָה וַיִּבְרְחוּ אִישׁ־לְשָׂדֵהוּ הַלְוִיִּם וְהַמְשֹׁרְרִים עֹשֵׂי הַמְּלָאכָה׃
    hebrewPlain: ואדעה כי מניות הלוים לא נתנה ויברחו איש לשדהו הלוים והמשררים עשי המלאכה
    kjvRefs:
    - Nehemiah 13:10
    kjvOsis:
    - Neh.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.11
    scripture: tanakh
    name: Tanakh Nehemiah 13:11
    ref: Nehemiah 13:11
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 11
    ordinal: 21421
    text: 'Then contended I with the rulers, and said: ‘Why is the house of God forsaken?’ And I gathered them together, and set them in their place.'
    translation: JPS 1917
    original: וָאָרִיבָה אֶת־הַסְּגָנִים וָאֹמְרָה מַדּוּעַ נֶעֱזַב בֵּית־הָאֱלֹהִים וָאֶקְבְּצֵם וָאַעֲמִדֵם עַל־עָמְדָם׃
    hebrewPlain: ואריבה את הסגנים ואמרה מדוע נעזב בית האלהים ואקבצם ואעמדם על עמדם
    kjvRefs:
    - Nehemiah 13:11
    kjvOsis:
    - Neh.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.12
    scripture: tanakh
    name: Tanakh Nehemiah 13:12
    ref: Nehemiah 13:12
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 12
    ordinal: 21422
    text: Then brought all Judah the tithe of the corn and the wine and the oil unto the treasuries.
    translation: JPS 1917
    original: וְכָל־יְהוּדָה הֵבִיאוּ מַעְשַׂר הַדָּגָן וְהַתִּירוֹשׁ וְהַיִּצְהָר לָאוֹצָרוֹת׃
    hebrewPlain: וכל יהודה הביאו מעשר הדגן והתירוש והיצהר לאוצרות
    kjvRefs:
    - Nehemiah 13:12
    kjvOsis:
    - Neh.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.13
    scripture: tanakh
    name: Tanakh Nehemiah 13:13
    ref: Nehemiah 13:13
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 13
    ordinal: 21423
    text: And I made treasurers over the treasuries, Shelemiah the priest, and Zadok the scribe, and of the Levites, Pedaiah; and next to them was Hanan the son of Zaccur, the son of Mattaniah; for they were counted faithful, and their office was to distribute unto their brethren.
    translation: JPS 1917
    original: וָאוֹצְרָה עַל־אוֹצָרוֹת שֶׁלֶמְיָה הַכֹּהֵן וְצָדוֹק הַסּוֹפֵר וּפְדָיָה מִן־הַלְוִיִּם וְעַל־יָדָם חָנָן בֶּן־זַכּוּר בֶּן־מַתַּנְיָה כִּי נֶאֱמָנִים נֶחְשָׁבוּ וַעֲלֵיהֶם לַחֲלֹק לַאֲחֵיהֶם׃
    hebrewPlain: ואוצרה על אוצרות שלמיה הכהן וצדוק הסופר ופדיה מן הלוים ועל ידם חנן בן זכור בן מתניה כי נאמנים נחשבו ועליהם לחלק לאחיהם
    kjvRefs:
    - Nehemiah 13:13
    kjvOsis:
    - Neh.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.14
    scripture: tanakh
    name: Tanakh Nehemiah 13:14
    ref: Nehemiah 13:14
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 14
    ordinal: 21424
    text: Remember me, O my God, concerning this, and wipe not out my good deeds that I have done for the house of my God, and for the wards thereof.
    translation: JPS 1917
    original: זָכְרָה־לִּי אֱלֹהַי עַל־זֹאת וְאַל־תֶּמַח חֲסָדַי אֲשֶׁר עָשִׂיתִי בְּבֵית אֱלֹהַי וּבְמִשְׁמָרָיו׃
    hebrewPlain: זכרה לי אלהי על זאת ואל תמח חסדי אשר עשיתי בבית אלהי ובמשמריו
    kjvRefs:
    - Nehemiah 13:14
    kjvOsis:
    - Neh.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.15
    scripture: tanakh
    name: Tanakh Nehemiah 13:15
    ref: Nehemiah 13:15
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 15
    ordinal: 21425
    text: In those days saw I in Judah some treading winepresses on the sabbath, and bringing in heaps of corn, and lading asses therewith; as also wine, grapes, and figs, and all manner of burdens, which they brought into Jerusalem on the sabbath day; and I forewarned them in the day wherein they sold victuals.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵמָּה רָאִיתִי בִיהוּדָה דֹּרְכִים־גִּתּוֹת בַּשַּׁבָּת וּמְבִיאִים הָעֲרֵמוֹת וְעֹמְסִים עַל־הַחֲמֹרִים וְאַף־יַיִן עֲנָבִים וּתְאֵנִים וְכָל־מַשָּׂא וּמְבִיאִים יְרוּשָׁלִַם בְּיוֹם הַשַּׁבָּת וָאָעִיד בְּיוֹם מִכְרָם צָיִד׃
    hebrewPlain: בימים ההמה ראיתי ביהודה דרכים גתות בשבת ומביאים הערמות ועמסים על החמרים ואף יין ענבים ותאנים וכל משא ומביאים ירושלם ביום השבת ואעיד ביום מכרם ציד
    kjvRefs:
    - Nehemiah 13:15
    kjvOsis:
    - Neh.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.16
    scripture: tanakh
    name: Tanakh Nehemiah 13:16
    ref: Nehemiah 13:16
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 16
    ordinal: 21426
    text: There dwelt men of Tyre also therein, who brought in fish, and all manner of ware, and sold on the sabbath unto the children of Judah, and in Jerusalem.
    translation: JPS 1917
    original: וְהַצֹּרִים יָשְׁבוּ בָהּ מְבִיאִים דָּאג וְכָל־מֶכֶר וּמֹכְרִים בַּשַּׁבָּת לִבְנֵי יְהוּדָה וּבִירוּשָׁלִָם׃
    hebrewPlain: והצרים ישבו בה מביאים דאג וכל מכר ומכרים בשבת לבני יהודה ובירושלם
    kjvRefs:
    - Nehemiah 13:16
    kjvOsis:
    - Neh.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.17
    scripture: tanakh
    name: Tanakh Nehemiah 13:17
    ref: Nehemiah 13:17
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 17
    ordinal: 21427
    text: 'Then I contended with the nobles of Judah, and said unto them: ‘What evil thing is this that ye do, and profane the sabbath day?'
    translation: JPS 1917
    original: וָאָרִיבָה אֵת חֹרֵי יְהוּדָה וָאֹמְרָה לָהֶם מָה־הַדָּבָר הָרָע הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים וּמְחַלְּלִים אֶת־יוֹם הַשַּׁבָּת׃
    hebrewPlain: ואריבה את חרי יהודה ואמרה להם מה הדבר הרע הזה אשר אתם עשים ומחללים את יום השבת
    kjvRefs:
    - Nehemiah 13:17
    kjvOsis:
    - Neh.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.18
    scripture: tanakh
    name: Tanakh Nehemiah 13:18
    ref: Nehemiah 13:18
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 18
    ordinal: 21428
    text: Did not your fathers thus, and did not our God bring all this evil upon us, and upon this city? yet ye bring more wrath upon Israel by profaning the sabbath.’
    translation: JPS 1917
    original: הֲלוֹא כֹה עָשׂוּ אֲבֹתֵיכֶם וַיָּבֵא אֱלֹהֵינוּ עָלֵינוּ אֵת כָּל־הָרָעָה הַזֹּאת וְעַל הָעִיר הַזֹּאת וְאַתֶּם מוֹסִיפִים חָרוֹן עַל־יִשְׂרָאֵל לְחַלֵּל אֶת־הַשַּׁבָּת׃
    hebrewPlain: הלוא כה עשו אבתיכם ויבא אלהינו עלינו את כל הרעה הזאת ועל העיר הזאת ואתם מוסיפים חרון על ישראל לחלל את השבת
    kjvRefs:
    - Nehemiah 13:18
    kjvOsis:
    - Neh.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.19
    scripture: tanakh
    name: Tanakh Nehemiah 13:19
    ref: Nehemiah 13:19
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 19
    ordinal: 21429
    text: And it came to pass that, when the gates of Jerusalem began to be dark before the sabbath, I commanded that the doors should be shut, and commanded that they should not be opened till after the sabbath; and some of my servants set I over the gates, that there should no burden be brought in on the sabbath day.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר צָלֲלוּ שַׁעֲרֵי יְרוּשָׁלִַם לִפְנֵי הַשַּׁבָּת וָאֹמְרָה וַיִּסָּגְרוּ הַדְּלָתוֹת וָאֹמְרָה אֲשֶׁר לֹא יִפְתָּחוּם עַד אַחַר הַשַּׁבָּת וּמִנְּעָרַי הֶעֱמַדְתִּי עַל־הַשְּׁעָרִים לֹא־יָבוֹא מַשָּׂא בְּיוֹם הַשַּׁבָּת׃
    hebrewPlain: ויהי כאשר צללו שערי ירושלם לפני השבת ואמרה ויסגרו הדלתות ואמרה אשר לא יפתחום עד אחר השבת ומנערי העמדתי על השערים לא יבוא משא ביום השבת
    kjvRefs:
    - Nehemiah 13:19
    kjvOsis:
    - Neh.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.20
    scripture: tanakh
    name: Tanakh Nehemiah 13:20
    ref: Nehemiah 13:20
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 20
    ordinal: 21430
    text: So the merchants and sellers of all kind of ware lodged without Jerusalem once or twice.
    translation: JPS 1917
    original: וַיָּלִינוּ הָרֹכְלִים וּמֹכְרֵי כָל־מִמְכָּר מִחוּץ לִירוּשָׁלִָם פַּעַם וּשְׁתָּיִם׃
    hebrewPlain: וילינו הרכלים ומכרי כל ממכר מחוץ לירושלם פעם ושתים
    kjvRefs:
    - Nehemiah 13:20
    kjvOsis:
    - Neh.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.21
    scripture: tanakh
    name: Tanakh Nehemiah 13:21
    ref: Nehemiah 13:21
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 21
    ordinal: 21431
    text: 'Then I forewarned them, and said unto them: ‘Why lodge ye about the wall? if ye do so again, I will lay hands on you.’ From that time forth came they no more on the sabbath.'
    translation: JPS 1917
    original: וָאָעִידָה בָהֶם וָאֹמְרָה אֲלֵיהֶם מַדּוּעַ אַתֶּם לֵנִים נֶגֶד הַחוֹמָה אִם־תִּשְׁנוּ יָד אֶשְׁלַח בָּכֶם מִן־הָעֵת הַהִיא לֹא־בָאוּ בַּשַּׁבָּת׃
    hebrewPlain: ואעידה בהם ואמרה אליהם מדוע אתם לנים נגד החומה אם תשנו יד אשלח בכם מן העת ההיא לא באו בשבת
    kjvRefs:
    - Nehemiah 13:21
    kjvOsis:
    - Neh.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.22
    scripture: tanakh
    name: Tanakh Nehemiah 13:22
    ref: Nehemiah 13:22
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 22
    ordinal: 21432
    text: And I commanded the Levites that they should purify themselves, and that they should come and keep the gates, to sanctify the sabbath day. Remember unto me, O my God, this also, and spare me according to the greatness of Thy mercy.
    translation: JPS 1917
    original: וָאֹמְרָה לַלְוִיִּם אֲשֶׁר יִהְיוּ מִטַּהֲרִים וּבָאִים שֹׁמְרִים הַשְּׁעָרִים לְקַדֵּשׁ אֶת־יוֹם הַשַּׁבָּת גַּם־זֹאת זָכְרָה־לִּי אֱלֹהַי וְחוּסָה עָלַי כְּרֹב חַסְדֶּךָ׃
    hebrewPlain: ואמרה ללוים אשר יהיו מטהרים ובאים שמרים השערים לקדש את יום השבת גם זאת זכרה לי אלהי וחוסה עלי כרב חסדך
    kjvRefs:
    - Nehemiah 13:22
    kjvOsis:
    - Neh.13.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.23
    scripture: tanakh
    name: Tanakh Nehemiah 13:23
    ref: Nehemiah 13:23
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 23
    ordinal: 21433
    text: In those days also saw I the Jews that had married women of Ashdod, of Ammon, and of Moab;
    translation: JPS 1917
    original: גַּם בַּיָּמִים הָהֵם רָאִיתִי אֶת־הַיְּהוּדִים הֹשִׁיבוּ נָשִׁים אשדודיות [אַשְׁדֳּדִיּוֹת] עמוניות [עַמֳּנִיּוֹת] מוֹאֲבִיּוֹת׃
    hebrewPlain: גם בימים ההם ראיתי את היהודים השיבו נשים אשדודיות [אשדדיות] עמוניות [עמניות] מואביות
    kjvRefs:
    - Nehemiah 13:23
    kjvOsis:
    - Neh.13.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.24
    scripture: tanakh
    name: Tanakh Nehemiah 13:24
    ref: Nehemiah 13:24
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 24
    ordinal: 21434
    text: and their children spoke half in the speech of Ashdod, and could not speak in the Jews’ language, but according to the language of each people.
    translation: JPS 1917
    original: וּבְנֵיהֶם חֲצִי מְדַבֵּר אַשְׁדּוֹדִית וְאֵינָם מַכִּירִים לְדַבֵּר יְהוּדִית וְכִלְשׁוֹן עַם וָעָם׃
    hebrewPlain: ובניהם חצי מדבר אשדודית ואינם מכירים לדבר יהודית וכלשון עם ועם
    kjvRefs:
    - Nehemiah 13:24
    kjvOsis:
    - Neh.13.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.25
    scripture: tanakh
    name: Tanakh Nehemiah 13:25
    ref: Nehemiah 13:25
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 25
    ordinal: 21435
    text: 'And I contended with them, and cursed them, and smote certain of them, and plucked off their hair, and made them swear by God: ‘Ye shall not give your daughters unto their sons, nor take their daughters for your sons, or for yourselves.'
    translation: JPS 1917
    original: וָאָרִיב עִמָּם וָאֲקַלְלֵם וָאַכֶּה מֵהֶם אֲנָשִׁים וָאֶמְרְטֵם וָאַשְׁבִּיעֵם בֵּאלֹהִים אִם־תִּתְּנוּ בְנֹתֵיכֶם לִבְנֵיהֶם וְאִם־תִּשְׂאוּ מִבְּנֹתֵיהֶם לִבְנֵיכֶם וְלָכֶם׃
    hebrewPlain: ואריב עמם ואקללם ואכה מהם אנשים ואמרטם ואשביעם באלהים אם תתנו בנתיכם לבניהם ואם תשאו מבנתיהם לבניכם ולכם
    kjvRefs:
    - Nehemiah 13:25
    kjvOsis:
    - Neh.13.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.26
    scripture: tanakh
    name: Tanakh Nehemiah 13:26
    ref: Nehemiah 13:26
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 26
    ordinal: 21436
    text: Did not Solomon king of Israel sin by these things? yet among many nations was there no king like him, and he was beloved of his God, and God made him king over all Israel; nevertheless even him did the foreign women cause to sin.
    translation: JPS 1917
    original: הֲלוֹא עַל־אֵלֶּה חָטָא־שְׁלֹמֹה מֶלֶךְ יִשְׂרָאֵל וּבַגּוֹיִם הָרַבִּים לֹא־הָיָה מֶלֶךְ כָּמֹהוּ וְאָהוּב לֵאלֹהָיו הָיָה וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ עַל־כָּל־יִשְׂרָאֵל גַּם־אוֹתוֹ הֶחֱטִיאוּ הַנָּשִׁים הַנָּכְרִיּוֹת׃
    hebrewPlain: הלוא על אלה חטא שלמה מלך ישראל ובגוים הרבים לא היה מלך כמהו ואהוב לאלהיו היה ויתנהו אלהים מלך על כל ישראל גם אותו החטיאו הנשים הנכריות
    kjvRefs:
    - Nehemiah 13:26
    kjvOsis:
    - Neh.13.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.27
    scripture: tanakh
    name: Tanakh Nehemiah 13:27
    ref: Nehemiah 13:27
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 27
    ordinal: 21437
    text: Shall we then hearken unto you to do all this great evil, to break faith with our God in marrying foreign women?’
    translation: JPS 1917
    original: וְלָכֶם הֲנִשְׁמַע לַעֲשֹׂת אֵת כָּל־הָרָעָה הַגְּדוֹלָה הַזֹּאת לִמְעֹל בֵּאלֹהֵינוּ לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת׃
    hebrewPlain: ולכם הנשמע לעשת את כל הרעה הגדולה הזאת למעל באלהינו להשיב נשים נכריות
    kjvRefs:
    - Nehemiah 13:27
    kjvOsis:
    - Neh.13.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.13
- type: TanakhVerse
  data:
    osis: Neh.13.28
    scripture: tanakh
    name: Tanakh Nehemiah 13:28
    ref: Nehemiah 13:28
    book: Neh
    section: ketuvim
    chapter: 13
    verse: 28
    ordinal: 21438
    text: And one of the sons of Joiada, the son of Eliashib the high priest, was son-in-law to Sanballat the Horonite; therefore I chased him from me.
    translation: JPS 1917
    original: וּמִבְּנֵי יוֹיָדָע בֶּן־אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל חָתָן לְסַנְבַלַּט הַחֹרֹנִי וָאַבְרִיחֵהוּ מֵעָלָי׃
