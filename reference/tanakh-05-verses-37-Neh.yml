    name: Tanakh Nehemiah 7:65
    ref: Nehemiah 7:65
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 65
    ordinal: 21225
    text: And the Tirshatha said unto them, that they should not eat of the most holy things, till there stood up a priest with Urim and Thummim.
    translation: JPS 1917
    original: וַיֹּאמֶר הַתִּרְשָׁתָא לָהֶם אֲשֶׁר לֹא־יֹאכְלוּ מִקֹּדֶשׁ הַקֳּדָשִׁים עַד עֲמֹד הַכֹּהֵן לְאוּרִים וְתוּמִּים׃
    hebrewPlain: ויאמר התרשתא להם אשר לא יאכלו מקדש הקדשים עד עמד הכהן לאורים ותומים
    kjvRefs:
