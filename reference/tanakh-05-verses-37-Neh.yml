- type: TanakhVerse
  data:
    osis: Neh.1.9
    scripture: tanakh
    name: Tanakh Nehemiah 1:9
    ref: Nehemiah 1:9
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 21045
    text: but if ye return unto Me, and keep My commandments and do them, though your dispersed were in the uttermost part of the heaven, yet will I gather them from thence, and will bring them unto the place that I have chosen to cause My name to dwell there.
    translation: JPS 1917
    original: וְשַׁבְתֶּם אֵלַי וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם אִם־יִהְיֶה נִדַּחֲכֶם בִּקְצֵה הַשָּׁמַיִם מִשָּׁם אֲקַבְּצֵם והבואתים [וַהֲבִיאוֹתִים] אֶל־הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי לְשַׁכֵּן אֶת־שְׁמִי שָׁם׃
    hebrewPlain: ושבתם אלי ושמרתם מצותי ועשיתם אתם אם יהיה נדחכם בקצה השמים משם אקבצם והבואתים [והביאותים] אל המקום אשר בחרתי לשכן את שמי שם
    kjvRefs:
    - Nehemiah 1:9
    kjvOsis:
    - Neh.1.9
