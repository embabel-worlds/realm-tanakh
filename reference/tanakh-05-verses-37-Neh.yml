    verse: 38
    ordinal: 21325
    text: and that we should bring the first of our dough, and our heave-offerings, and the fruit of all manner of trees, the wine and the oil, unto the priests, to the chambers of the house of our God; and the tithes of our land unto the Levites; for they, the Levites, take the tithes in all the cities of our tillage.
    translation: JPS 1917
    original: וְאֶת־רֵאשִׁית עֲרִיסֹתֵינוּ וּתְרוּמֹתֵינוּ וּפְרִי כָל־עֵץ תִּירוֹשׁ וְיִצְהָר נָבִיא לַכֹּהֲנִים אֶל־לִשְׁכוֹת בֵּית־אֱלֹהֵינוּ וּמַעְשַׂר אַדְמָתֵנוּ לַלְוִיִּם וְהֵם הַלְוִיִּם הַמְעַשְּׂרִים בְּכֹל עָרֵי עֲבֹדָתֵנוּ׃
    hebrewPlain: ואת ראשית עריסתינו ותרומתינו ופרי כל עץ תירוש ויצהר נביא לכהנים אל לשכות בית אלהינו ומעשר אדמתנו ללוים והם הלוים המעשרים בכל ערי עבדתנו
    kjvRefs:
    - Nehemiah 10:37
    kjvOsis:
    - Neh.10.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.39
    scripture: tanakh
    name: Tanakh Nehemiah 10:39
    ref: Nehemiah 10:39
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 39
    ordinal: 21326
    text: And the priest the son of Aaron shall be with the Levites, when the Levites take tithes; and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure-house. .
    translation: JPS 1917
    original: וְהָיָה הַכֹּהֵן בֶּן־אַהֲרֹן עִם־הַלְוִיִּם בַּעְשֵׂר הַלְוִיִּם וְהַלְוִיִּם יַעֲלוּ אֶת־מַעֲשַׂר הַמַּעֲשֵׂר לְבֵית אֱלֹהֵינוּ אֶל־הַלְּשָׁכוֹת לְבֵית הָאוֹצָר׃
    hebrewPlain: והיה הכהן בן אהרן עם הלוים בעשר הלוים והלוים יעלו את מעשר המעשר לבית אלהינו אל הלשכות לבית האוצר
    kjvRefs:
    - Nehemiah 10:38
    kjvOsis:
    - Neh.10.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.10.40
    scripture: tanakh
    name: Tanakh Nehemiah 10:40
    ref: Nehemiah 10:40
    book: Neh
    section: ketuvim
    chapter: 10
    verse: 40
    ordinal: 21327
    text: For the children of Israel and the children of Levi shall bring the heave-offering of the corn, of the wine, and of the oil, unto the chambers, where are the vessels of the sanctuary, and the priests that minister, and the porters, and the singers; and we will not forsake the house of our God.
    translation: JPS 1917
    original: כִּי אֶל־הַלְּשָׁכוֹת יָבִיאוּ בְנֵי־יִשְׂרָאֵל וּבְנֵי הַלֵּוִי אֶת־תְּרוּמַת הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר וְשָׁם כְּלֵי הַמִּקְדָּשׁ וְהַכֹּהֲנִים הַמְשָׁרְתִים וְהַשּׁוֹעֲרִים וְהַמְשֹׁרְרִים וְלֹא נַעֲזֹב אֶת־בֵּית אֱלֹהֵינוּ׃
    hebrewPlain: כי אל הלשכות יביאו בני ישראל ובני הלוי את תרומת הדגן התירוש והיצהר ושם כלי המקדש והכהנים המשרתים והשוערים והמשררים ולא נעזב את בית אלהינו
    kjvRefs:
    - Nehemiah 10:39
    kjvOsis:
    - Neh.10.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.10
- type: TanakhVerse
  data:
    osis: Neh.11.1
    scripture: tanakh
    name: Tanakh Nehemiah 11:1
    ref: Nehemiah 11:1
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 21328
    text: And the princes of the people dwelt in Jerusalem; the rest of the people also cast lots, to bring one of ten to dwell in Jerusalem the holy city, and nine parts in the other cities.
    translation: JPS 1917
    original: וַיֵּשְׁבוּ שָׂרֵי־הָעָם בִּירוּשָׁלִָם וּשְׁאָר הָעָם הִפִּילוּ גוֹרָלוֹת לְהָבִיא אֶחָד מִן־הָעֲשָׂרָה לָשֶׁבֶת בִּירוּשָׁלִַם עִיר הַקֹּדֶשׁ וְתֵשַׁע הַיָּדוֹת בֶּעָרִים׃
    hebrewPlain: וישבו שרי העם בירושלם ושאר העם הפילו גורלות להביא אחד מן העשרה לשבת בירושלם עיר הקדש ותשע הידות בערים
    kjvRefs:
    - Nehemiah 11:1
    kjvOsis:
    - Neh.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.2
    scripture: tanakh
    name: Tanakh Nehemiah 11:2
    ref: Nehemiah 11:2
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 21329
    text: And the people blessed all the men that willingly offered themselves to dwell in Jerusalem.
    translation: JPS 1917
    original: וַיְבָרֲכוּ הָעָם לְכֹל הָאֲנָשִׁים הַמִּתְנַדְּבִים לָשֶׁבֶת בִּירוּשָׁלִָם׃
    hebrewPlain: ויברכו העם לכל האנשים המתנדבים לשבת בירושלם
    kjvRefs:
    - Nehemiah 11:2
    kjvOsis:
    - Neh.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.3
    scripture: tanakh
    name: Tanakh Nehemiah 11:3
    ref: Nehemiah 11:3
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 21330
    text: Now these are the chiefs of the province that dwelt in Jerusalem; but in the cities of Judah dwelt every one in his possession in their cities, to wit, Israelites, the priests, and the Levites, and the Nethinim, and the children of Solomon’s servants.
    translation: JPS 1917
    original: וְאֵלֶּה רָאשֵׁי הַמְּדִינָה אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם וּבְעָרֵי יְהוּדָה יָשְׁבוּ אִישׁ בַּאֲחֻזָּתוֹ בְּעָרֵיהֶם יִשְׂרָאֵל הַכֹּהֲנִים וְהַלְוִיִּם וְהַנְּתִינִים וּבְנֵי עַבְדֵי שְׁלֹמֹה׃
    hebrewPlain: ואלה ראשי המדינה אשר ישבו בירושלם ובערי יהודה ישבו איש באחזתו בעריהם ישראל הכהנים והלוים והנתינים ובני עבדי שלמה
    kjvRefs:
    - Nehemiah 11:3
    kjvOsis:
    - Neh.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.4
    scripture: tanakh
    name: Tanakh Nehemiah 11:4
    ref: Nehemiah 11:4
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 21331
    text: 'And in Jerusalem dwelt certain of the children of Judah, and of the children of Benjamin. Of the children of Judah: Athaiah the son of Uzziah, the son of Zechariah, the son of Amariah, the son of Shephatiah, the son of Mahalalel, of the children of Perez;'
    translation: JPS 1917
    original: וּבִירוּשָׁלִַם יָשְׁבוּ מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן מִבְּנֵי יְהוּדָה עֲתָיָה בֶן־עֻזִּיָּה בֶּן־זְכַרְיָה בֶן־אֲמַרְיָה בֶּן־שְׁפַטְיָה בֶן־מַהֲלַלְאֵל מִבְּנֵי־פָרֶץ׃
    hebrewPlain: ובירושלם ישבו מבני יהודה ומבני בנימן מבני יהודה עתיה בן עזיה בן זכריה בן אמריה בן שפטיה בן מהללאל מבני פרץ
    kjvRefs:
    - Nehemiah 11:4
    kjvOsis:
    - Neh.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.5
    scripture: tanakh
    name: Tanakh Nehemiah 11:5
    ref: Nehemiah 11:5
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 21332
    text: and Maaseiah the son of Baruch, the son of Colhozeh, the son of Hazaiah, the son of Adaiah, the son of Joiarib, the son of Zechariah, the son of the Shilonite.
    translation: JPS 1917
    original: וּמַעֲשֵׂיָה בֶן־בָּרוּךְ בֶּן־כָּל־חֹזֶה בֶּן־חֲזָיָה בֶן־עֲדָיָה בֶן־יוֹיָרִיב בֶּן־זְכַרְיָה בֶּן־הַשִּׁלֹנִי׃
    hebrewPlain: ומעשיה בן ברוך בן כל חזה בן חזיה בן עדיה בן יויריב בן זכריה בן השלני
    kjvRefs:
    - Nehemiah 11:5
    kjvOsis:
    - Neh.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.6
    scripture: tanakh
    name: Tanakh Nehemiah 11:6
    ref: Nehemiah 11:6
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 21333
    text: All the sons of Perez that dwelt in Jerusalem were four hundred threescore and eight valiant men.
    translation: JPS 1917
    original: כָּל־בְּנֵי־פֶרֶץ הַיֹּשְׁבִים בִּירוּשָׁלִָם אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה אַנְשֵׁי־חָיִל׃
    hebrewPlain: כל בני פרץ הישבים בירושלם ארבע מאות ששים ושמנה אנשי חיל
    kjvRefs:
    - Nehemiah 11:6
    kjvOsis:
    - Neh.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.7
    scripture: tanakh
    name: Tanakh Nehemiah 11:7
    ref: Nehemiah 11:7
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 21334
    text: 'And these are the sons of Benjamin: Sallu the son of Meshullam, the son of Joed, the son of Pedaiah, the son of Kolaiah, the son of Maaseiah, the son of Ithiel, the son of Jeshaiah.'
    translation: JPS 1917
    original: וְאֵלֶּה בְּנֵי בִנְיָמִן סַלֻּא בֶּן־מְשֻׁלָּם בֶּן־יוֹעֵד בֶּן־פְּדָיָה בֶן־קוֹלָיָה בֶן־מַעֲשֵׂיָה בֶּן־אִיתִיאֵל בֶּן־יְשַׁעְיָה׃
    hebrewPlain: ואלה בני בנימן סלא בן משלם בן יועד בן פדיה בן קוליה בן מעשיה בן איתיאל בן ישעיה
    kjvRefs:
    - Nehemiah 11:7
    kjvOsis:
    - Neh.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.8
    scripture: tanakh
    name: Tanakh Nehemiah 11:8
    ref: Nehemiah 11:8
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 21335
    text: And after him Gabbai, Sallai, nine hundred twenty and eight.
    translation: JPS 1917
    original: וְאַחֲרָיו גַּבַּי סַלָּי תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה׃
    hebrewPlain: ואחריו גבי סלי תשע מאות עשרים ושמנה
    kjvRefs:
    - Nehemiah 11:8
    kjvOsis:
    - Neh.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.9
    scripture: tanakh
    name: Tanakh Nehemiah 11:9
    ref: Nehemiah 11:9
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 21336
    text: And Joel the son of Zichri was their overseer; and Judah the son of Hassenuah was second over the city.
    translation: JPS 1917
    original: וְיוֹאֵל בֶּן־זִכְרִי פָּקִיד עֲלֵיהֶם וִיהוּדָה בֶן־הַסְּנוּאָה עַל־הָעִיר מִשְׁנֶה׃
    hebrewPlain: ויואל בן זכרי פקיד עליהם ויהודה בן הסנואה על העיר משנה
    kjvRefs:
    - Nehemiah 11:9
    kjvOsis:
    - Neh.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.10
    scripture: tanakh
    name: Tanakh Nehemiah 11:10
    ref: Nehemiah 11:10
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 21337
    text: 'Of the priests: Jedaiah the son of Joiarib, Jachin,'
    translation: JPS 1917
    original: מִן־הַכֹּהֲנִים יְדַעְיָה בֶן־יוֹיָרִיב יָכִין׃
    hebrewPlain: מן הכהנים ידעיה בן יויריב יכין
    kjvRefs:
    - Nehemiah 11:10
    kjvOsis:
    - Neh.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.11
    scripture: tanakh
    name: Tanakh Nehemiah 11:11
    ref: Nehemiah 11:11
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 11
    ordinal: 21338
    text: Seraiah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God,
    translation: JPS 1917
    original: שְׂרָיָה בֶן־חִלְקִיָּה בֶּן־מְשֻׁלָּם בֶּן־צָדוֹק בֶּן־מְרָיוֹת בֶּן־אֲחִיטוּב נְגִד בֵּית הָאֱלֹהִים׃
    hebrewPlain: שריה בן חלקיה בן משלם בן צדוק בן מריות בן אחיטוב נגד בית האלהים
    kjvRefs:
    - Nehemiah 11:11
    kjvOsis:
    - Neh.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.12
    scripture: tanakh
    name: Tanakh Nehemiah 11:12
    ref: Nehemiah 11:12
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 12
    ordinal: 21339
    text: and their brethren that did the work of the house, eight hundred twenty and two; and Adaiah the son of Jeroham, the son of Pelaliah, the son of Amzi, the son of Zechariah, the son of Pashhur, the son of Malchijah,
    translation: JPS 1917
    original: וַאֲחֵיהֶם עֹשֵׂי הַמְּלָאכָה לַבַּיִת שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם וַעֲדָיָה בֶּן־יְרֹחָם בֶּן־פְּלַלְיָה בֶּן־אַמְצִי בֶן־זְכַרְיָה בֶּן־פַּשְׁחוּר בֶּן־מַלְכִּיָּה׃
    hebrewPlain: ואחיהם עשי המלאכה לבית שמנה מאות עשרים ושנים ועדיה בן ירחם בן פלליה בן אמצי בן זכריה בן פשחור בן מלכיה
    kjvRefs:
    - Nehemiah 11:12
    kjvOsis:
    - Neh.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.13
    scripture: tanakh
    name: Tanakh Nehemiah 11:13
    ref: Nehemiah 11:13
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 13
    ordinal: 21340
    text: and his brethren, chiefs of fathers’ houses, two hundred forty and two; and Amashsai the son of Azarel, the son of Ahzai, the son of Meshillemoth, the son of Immer,
    translation: JPS 1917
    original: וְאֶחָיו רָאשִׁים לְאָבוֹת מָאתַיִם אַרְבָּעִים וּשְׁנָיִם וַעֲמַשְׁסַי בֶּן־עֲזַרְאֵל בֶּן־אַחְזַי בֶּן־מְשִׁלֵּמוֹת בֶּן־אִמֵּר׃
    hebrewPlain: ואחיו ראשים לאבות מאתים ארבעים ושנים ועמשסי בן עזראל בן אחזי בן משלמות בן אמר
    kjvRefs:
    - Nehemiah 11:13
    kjvOsis:
    - Neh.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.11
- type: TanakhVerse
  data:
    osis: Neh.11.14
    scripture: tanakh
    name: Tanakh Nehemiah 11:14
    ref: Nehemiah 11:14
    book: Neh
    section: ketuvim
    chapter: 11
    verse: 14
    ordinal: 21341
    text: and their brethren, mighty men of valour, a hundred twenty and eight; and their overseer was Zabdiel, the son of Haggedolim.
    translation: JPS 1917
    original: וַאֲחֵיהֶם גִּבּוֹרֵי חַיִל מֵאָה עֶשְׂרִים וּשְׁמֹנָה וּפָקִיד עֲלֵיהֶם זַבְדִּיאֵל בֶּן־הַגְּדוֹלִים׃
