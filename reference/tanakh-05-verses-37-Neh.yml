    section: ketuvim
    chapter: 3
    verse: 33
    ordinal: 21100
    text: But it came to pass that, when Sanballat heard that we builded the wall, he was wroth, and took great indignation, and mocked the Jews.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר שָׁמַע סַנְבַלַּט כִּי־אֲנַחְנוּ בוֹנִים אֶת־הַחוֹמָה וַיִּחַר לוֹ וַיִּכְעַס הַרְבֵּה וַיַּלְעֵג עַל־הַיְּהוּדִים׃
    hebrewPlain: ויהי כאשר שמע סנבלט כי אנחנו בונים את החומה ויחר לו ויכעס הרבה וילעג על היהודים
