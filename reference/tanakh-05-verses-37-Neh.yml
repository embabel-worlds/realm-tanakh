  data:
    osis: Neh.7.72
    scripture: tanakh
    name: Tanakh Nehemiah 7:72
    ref: Nehemiah 7:72
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 72
    ordinal: 21232
    text: So the priests, and the Levites, and the porters, and the singers, and some of the people, and the Nethinim, and all Israel, dwelt in their cities. And when the seventh month was come, and the children of Israel were in their cities,
    translation: JPS 1917
    original: וַיֵּשְׁבוּ הַכֹּהֲנִים וְהַלְוִיִּם וְהַשּׁוֹעֲרִים וְהַמְשֹׁרְרִים וּמִן־הָעָם וְהַנְּתִינִים וְכָל־יִשְׂרָאֵל בְּעָרֵיהֶם וַיִּגַּע הַחֹדֶשׁ הַשְּׁבִיעִי וּבְנֵי יִשְׂרָאֵל בְּעָרֵיהֶם׃
    hebrewPlain: וישבו הכהנים והלוים והשוערים והמשררים ומן העם והנתינים וכל ישראל בעריהם ויגע החדש השביעי ובני ישראל בעריהם
    kjvRefs:
    - Nehemiah 7:73
    kjvOsis:
    - Neh.7.73
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.8.1
    scripture: tanakh
    name: Tanakh Nehemiah 8:1
    ref: Nehemiah 8:1
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 21233
    text: all the people gathered themselves together as one man into the broad place that was before the water gate; and they spoke unto Ezra the scribe to bring the book of the Law of Moses, which the LORD had commanded to Israel.
    translation: JPS 1917
    original: וַיֵּאָסְפוּ כָל־הָעָם כְּאִישׁ אֶחָד אֶל־הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר־הַמָּיִם וַיֹּאמְרוּ לְעֶזְרָא הַסֹּפֵר לְהָבִיא אֶת־סֵפֶר תּוֹרַת מֹשֶׁה אֲשֶׁר־צִוָּה יְהוָה אֶת־יִשְׂרָאֵל׃
    hebrewPlain: ויאספו כל העם כאיש אחד אל הרחוב אשר לפני שער המים ויאמרו לעזרא הספר להביא את ספר תורת משה אשר צוה יהוה את ישראל
    kjvRefs:
    - Nehemiah 8:1
    kjvOsis:
    - Neh.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.2
    scripture: tanakh
    name: Tanakh Nehemiah 8:2
    ref: Nehemiah 8:2
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 21234
    text: And Ezra the priest brought the Law before the congregation, both men and women, and all that could hear with understanding, upon the first day of the seventh month.
    translation: JPS 1917
    original: וַיָּבִיא עֶזְרָא הַכֹּהֵן אֶת־הַתּוֹרָה לִפְנֵי הַקָּהָל מֵאִישׁ וְעַד־אִשָּׁה וְכֹל מֵבִין לִשְׁמֹעַ בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי׃
    hebrewPlain: ויביא עזרא הכהן את התורה לפני הקהל מאיש ועד אשה וכל מבין לשמע ביום אחד לחדש השביעי
    kjvRefs:
    - Nehemiah 8:2
    kjvOsis:
    - Neh.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.3
    scripture: tanakh
    name: Tanakh Nehemiah 8:3
    ref: Nehemiah 8:3
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 21235
    text: And he read therein before the broad place that was before the water gate from early morning until midday, in the presence of the men and the women, and of those that could understand; and the ears of all the people were attentive unto the book of the Law.
    translation: JPS 1917
    original: וַיִּקְרָא־בוֹ לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר־הַמַּיִם מִן־הָאוֹר עַד־מַחֲצִית הַיּוֹם נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים וְאָזְנֵי כָל־הָעָם אֶל־סֵפֶר הַתּוֹרָה׃
    hebrewPlain: ויקרא בו לפני הרחוב אשר לפני שער המים מן האור עד מחצית היום נגד האנשים והנשים והמבינים ואזני כל העם אל ספר התורה
    kjvRefs:
    - Nehemiah 8:3
    kjvOsis:
    - Neh.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.4
    scripture: tanakh
    name: Tanakh Nehemiah 8:4
    ref: Nehemiah 8:4
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 21236
    text: And Ezra the scribe stood upon a pulpit of wood, which they had made for the purpose; and beside him stood Mattithiah, and Shema, and Anaiah, and Uriah, and Hilkiah, and Maaseiah, on his right hand; and on his left hand, Pedaiah, and Mishael, and Malchijah, and Hashum, and Hashbaddanah, Zechariah, and Meshullam.
    translation: JPS 1917
    original: וַיַּעֲמֹד עֶזְרָא הַסֹּפֵר עַל־מִגְדַּל־עֵץ אֲשֶׁר עָשׂוּ לַדָּבָר וַיַּעֲמֹד אֶצְלוֹ מַתִּתְיָה וְשֶׁמַע וַעֲנָיָה וְאוּרִיָּה וְחִלְקִיָּה וּמַעֲשֵׂיָה עַל־יְמִינוֹ וּמִשְּׂמֹאלוֹ פְּדָיָה וּמִישָׁאֵל וּמַלְכִּיָּה וְחָשֻׁם וְחַשְׁבַּדָּנָה זְכַרְיָה מְשֻׁלָּם׃
    hebrewPlain: ויעמד עזרא הספר על מגדל עץ אשר עשו לדבר ויעמד אצלו מתתיה ושמע ועניה ואוריה וחלקיה ומעשיה על ימינו ומשמאלו פדיה ומישאל ומלכיה וחשם וחשבדנה זכריה משלם
    kjvRefs:
    - Nehemiah 8:4
    kjvOsis:
    - Neh.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.5
    scripture: tanakh
    name: Tanakh Nehemiah 8:5
    ref: Nehemiah 8:5
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 21237
    text: And Ezra opened the book in the sight of all the people—for he was above all the people—and when he opened it, all the people stood up.
    translation: JPS 1917
    original: וַיִּפְתַּח עֶזְרָא הַסֵּפֶר לְעֵינֵי כָל־הָעָם כִּי־מֵעַל כָּל־הָעָם הָיָה וּכְפִתְחוֹ עָמְדוּ כָל־הָעָם׃
    hebrewPlain: ויפתח עזרא הספר לעיני כל העם כי מעל כל העם היה וכפתחו עמדו כל העם
    kjvRefs:
    - Nehemiah 8:5
    kjvOsis:
    - Neh.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.6
    scripture: tanakh
    name: Tanakh Nehemiah 8:6
    ref: Nehemiah 8:6
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 21238
    text: 'And Ezra blessed the LORD, the great God. And all the people answered: ‘Amen, Amen’, with the lifting up of their hands; and they bowed their heads, and fell down before the LORD with their faces to the ground.'
    translation: JPS 1917
    original: וַיְבָרֶךְ עֶזְרָא אֶת־יְהוָה הָאֱלֹהִים הַגָּדוֹל וַיַּעֲנוּ כָל־הָעָם אָמֵן אָמֵן בְּמֹעַל יְדֵיהֶם וַיִּקְּדוּ וַיִּשְׁתַּחֲוֻּ לַיהוָה אַפַּיִם אָרְצָה׃
    hebrewPlain: ויברך עזרא את יהוה האלהים הגדול ויענו כל העם אמן אמן במעל ידיהם ויקדו וישתחו ליהוה אפים ארצה
    kjvRefs:
    - Nehemiah 8:6
    kjvOsis:
    - Neh.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.7
    scripture: tanakh
    name: Tanakh Nehemiah 8:7
    ref: Nehemiah 8:7
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 21239
    text: Also Jeshua, and Bani, and Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan, Pelaiah, even the Levites, caused the people to understand the Law; and the people stood in their place.
    translation: JPS 1917
    original: וְיֵשׁוּעַ וּבָנִי וְשֵׁרֵבְיָה יָמִין עַקּוּב שַׁבְּתַי הוֹדִיָּה מַעֲשֵׂיָה קְלִיטָא עֲזַרְיָה יוֹזָבָד חָנָן פְּלָאיָה וְהַלְוִיִּם מְבִינִים אֶת־הָעָם לַתּוֹרָה וְהָעָם עַל־עָמְדָם׃
    hebrewPlain: וישוע ובני ושרביה ימין עקוב שבתי הודיה מעשיה קליטא עזריה יוזבד חנן פלאיה והלוים מבינים את העם לתורה והעם על עמדם
    kjvRefs:
    - Nehemiah 8:7
    kjvOsis:
    - Neh.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.8
    scripture: tanakh
    name: Tanakh Nehemiah 8:8
    ref: Nehemiah 8:8
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 21240
    text: And they read in the book, in the Law of God, distinctly; and they gave the sense, and caused them to understand the reading.
    translation: JPS 1917
    original: וַיִּקְרְאוּ בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים מְפֹרָשׁ וְשׂוֹם שֶׂכֶל וַיָּבִינוּ בַּמִּקְרָא׃
    hebrewPlain: ויקראו בספר בתורת האלהים מפרש ושום שכל ויבינו במקרא
    kjvRefs:
    - Nehemiah 8:8
    kjvOsis:
    - Neh.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.9
    scripture: tanakh
    name: Tanakh Nehemiah 8:9
    ref: Nehemiah 8:9
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 21241
    text: 'And Nehemiah, who was the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people: ‘This day is holy unto the LORD your God; mourn not, nor weep.’ For all the people wept, when they heard the words of the Law.'
    translation: JPS 1917
    original: וַיֹּאמֶר נְחֶמְיָה הוּא הַתִּרְשָׁתָא וְעֶזְרָא הַכֹּהֵן הַסֹּפֵר וְהַלְוִיִּם הַמְּבִינִים אֶת־הָעָם לְכָל־הָעָם הַיּוֹם קָדֹשׁ־הוּא לַיהוָה אֱלֹהֵיכֶם אַל־תִּתְאַבְּלוּ וְאַל־תִּבְכּוּ כִּי בוֹכִים כָּל־הָעָם כְּשָׁמְעָם אֶת־דִּבְרֵי הַתּוֹרָה׃
    hebrewPlain: ויאמר נחמיה הוא התרשתא ועזרא הכהן הספר והלוים המבינים את העם לכל העם היום קדש הוא ליהוה אלהיכם אל תתאבלו ואל תבכו כי בוכים כל העם כשמעם את דברי התורה
    kjvRefs:
    - Nehemiah 8:9
    kjvOsis:
    - Neh.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.10
    scripture: tanakh
    name: Tanakh Nehemiah 8:10
    ref: Nehemiah 8:10
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 21242
    text: 'Then he said unto them: ‘Go your way, eat the fat, and drink the sweet, and send portions unto him for whom nothing is prepared; for this day is holy unto our Lord; neither be ye grieved; for the joy of the LORD is your strength.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם לְכוּ אִכְלוּ מַשְׁמַנִּים וּשְׁתוּ מַמְתַקִּים וְשִׁלְחוּ מָנוֹת לְאֵין נָכוֹן לוֹ כִּי־קָדוֹשׁ הַיּוֹם לַאֲדֹנֵינוּ וְאַל־תֵּעָצֵבוּ כִּי־חֶדְוַת יְהוָה הִיא מָעֻזְּכֶם׃
    hebrewPlain: ויאמר להם לכו אכלו משמנים ושתו ממתקים ושלחו מנות לאין נכון לו כי קדוש היום לאדנינו ואל תעצבו כי חדות יהוה היא מעזכם
    kjvRefs:
    - Nehemiah 8:10
    kjvOsis:
    - Neh.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.11
    scripture: tanakh
    name: Tanakh Nehemiah 8:11
    ref: Nehemiah 8:11
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 21243
    text: 'So the Levites stilled all the people, saying: ‘Hold your peace, for the day is holy; neither be ye grieved.’'
    translation: JPS 1917
    original: וְהַלְוִיִּם מַחְשִׁים לְכָל־הָעָם לֵאמֹר הַסּוּ כִּי הַיּוֹם קָדֹשׁ וְאַל־תֵּעָצֵבוּ׃
    hebrewPlain: והלוים מחשים לכל העם לאמר הסו כי היום קדש ואל תעצבו
    kjvRefs:
    - Nehemiah 8:11
    kjvOsis:
    - Neh.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.12
    scripture: tanakh
    name: Tanakh Nehemiah 8:12
    ref: Nehemiah 8:12
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 21244
    text: And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.
    translation: JPS 1917
    original: וַיֵּלְכוּ כָל־הָעָם לֶאֱכֹל וְלִשְׁתּוֹת וּלְשַׁלַּח מָנוֹת וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה כִּי הֵבִינוּ בַּדְּבָרִים אֲשֶׁר הוֹדִיעוּ לָהֶם׃
    hebrewPlain: וילכו כל העם לאכל ולשתות ולשלח מנות ולעשות שמחה גדולה כי הבינו בדברים אשר הודיעו להם
    kjvRefs:
    - Nehemiah 8:12
    kjvOsis:
    - Neh.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.13
    scripture: tanakh
    name: Tanakh Nehemiah 8:13
    ref: Nehemiah 8:13
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 21245
    text: And on the second day were gathered together the heads of fathers’ houses of all the people, the priests, and the Levites, unto Ezra the scribe, even to give attention to the words of the Law.
    translation: JPS 1917
    original: וּבַיּוֹם הַשֵּׁנִי נֶאֶסְפוּ רָאשֵׁי הָאָבוֹת לְכָל־הָעָם הַכֹּהֲנִים וְהַלְוִיִּם אֶל־עֶזְרָא הַסֹּפֵר וּלְהַשְׂכִּיל אֶל־דִּבְרֵי הַתּוֹרָה׃
    hebrewPlain: וביום השני נאספו ראשי האבות לכל העם הכהנים והלוים אל עזרא הספר ולהשכיל אל דברי התורה
    kjvRefs:
    - Nehemiah 8:13
    kjvOsis:
    - Neh.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.14
    scripture: tanakh
    name: Tanakh Nehemiah 8:14
    ref: Nehemiah 8:14
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 21246
    text: And they found written in the Law, how that the LORD had commanded by Moses, that the children of Israel should dwell in booths in the feast of the seventh month;
    translation: JPS 1917
    original: וַיִּמְצְאוּ כָּתוּב בַּתּוֹרָה אֲשֶׁר צִוָּה יְהוָה בְּיַד־מֹשֶׁה אֲשֶׁר יֵשְׁבוּ בְנֵי־יִשְׂרָאֵל בַּסֻּכּוֹת בֶּחָג בַּחֹדֶשׁ הַשְּׁבִיעִי׃
    hebrewPlain: וימצאו כתוב בתורה אשר צוה יהוה ביד משה אשר ישבו בני ישראל בסכות בחג בחדש השביעי
    kjvRefs:
    - Nehemiah 8:14
    kjvOsis:
    - Neh.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.15
    scripture: tanakh
    name: Tanakh Nehemiah 8:15
    ref: Nehemiah 8:15
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 21247
    text: 'and that they should publish and proclaim in all their cities, and in Jerusalem, saying: ‘Go forth unto the mount, and fetch olive branches, and branches of wild olive, and myrtle branches, and palm branches, and branches of thick trees, to make booths, as it is written.’'
    translation: JPS 1917
    original: וַאֲשֶׁר יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל בְּכָל־עָרֵיהֶם וּבִירוּשָׁלִַם לֵאמֹר צְאוּ הָהָר וְהָבִיאוּ עֲלֵי־זַיִת וַעֲלֵי־עֵץ שֶׁמֶן וַעֲלֵי הֲדַס וַעֲלֵי תְמָרִים וַעֲלֵי עֵץ עָבֹת לַעֲשֹׂת סֻכֹּת כַּכָּתוּב׃
    hebrewPlain: ואשר ישמיעו ויעבירו קול בכל עריהם ובירושלם לאמר צאו ההר והביאו עלי זית ועלי עץ שמן ועלי הדס ועלי תמרים ועלי עץ עבת לעשת סכת ככתוב
    kjvRefs:
    - Nehemiah 8:15
    kjvOsis:
    - Neh.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.16
    scripture: tanakh
    name: Tanakh Nehemiah 8:16
    ref: Nehemiah 8:16
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 21248
    text: So the people went forth, and brought them, and made themselves booths, every one upon the roof of his house, and in their courts, and in the courts of the house of God, and in the broad place of the water gate, and in the broad place of the gate of Ephraim.
    translation: JPS 1917
    original: וַיֵּצְאוּ הָעָם וַיָּבִיאוּ וַיַּעֲשׂוּ לָהֶם סֻכּוֹת אִישׁ עַל־גַּגּוֹ וּבְחַצְרֹתֵיהֶם וּבְחַצְרוֹת בֵּית הָאֱלֹהִים וּבִרְחוֹב שַׁעַר הַמַּיִם וּבִרְחוֹב שַׁעַר אֶפְרָיִם׃
    hebrewPlain: ויצאו העם ויביאו ויעשו להם סכות איש על גגו ובחצרתיהם ובחצרות בית האלהים וברחוב שער המים וברחוב שער אפרים
    kjvRefs:
    - Nehemiah 8:16
    kjvOsis:
    - Neh.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.17
    scripture: tanakh
    name: Tanakh Nehemiah 8:17
    ref: Nehemiah 8:17
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 21249
    text: And all the congregation of them that were come back out of the captivity made booths, and dwelt in the booths; for since the days of Joshua the son of Nun unto that day had not the children of Israel done so. And there was very great gladness.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ כָל־הַקָּהָל הַשָּׁבִים מִן־הַשְּׁבִי סֻכּוֹת וַיֵּשְׁבוּ בַסֻּכּוֹת כִּי לֹא־עָשׂוּ מִימֵי יֵשׁוּעַ בִּן־נוּן כֵּן בְּנֵי יִשְׂרָאֵל עַד הַיּוֹם הַהוּא וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד׃
    hebrewPlain: ויעשו כל הקהל השבים מן השבי סכות וישבו בסכות כי לא עשו מימי ישוע בן נון כן בני ישראל עד היום ההוא ותהי שמחה גדולה מאד
    kjvRefs:
    - Nehemiah 8:17
    kjvOsis:
    - Neh.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.8
- type: TanakhVerse
  data:
    osis: Neh.8.18
    scripture: tanakh
    name: Tanakh Nehemiah 8:18
    ref: Nehemiah 8:18
    book: Neh
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 21250
    text: Also day by day, from the first day unto the last day, he read in the book of the Law of God. And they kept the feast seven days;
    translation: JPS 1917
    original: וַיִּקְרָא בְּסֵפֶר תּוֹרַת הָאֱלֹהִים יוֹם בְּיוֹם מִן־הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן וַיַּעֲשׂוּ־חָג שִׁבְעַת יָמִים וּבַיּוֹם הַשְּׁמִינִי עֲצֶרֶת כַּמִּשְׁפָּט׃
    hebrewPlain: ויקרא בספר תורת האלהים יום ביום מן היום הראשון עד היום האחרון ויעשו חג שבעת ימים וביום השמיני עצרת כמשפט
    kjvRefs:
    - Nehemiah 8:18
    kjvOsis:
    - Neh.8.18
  relations:
  - predicate: IN
