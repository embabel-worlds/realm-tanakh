  data:
    osis: Neh.9.32
    scripture: tanakh
    name: Tanakh Nehemiah 9:32
    ref: Nehemiah 9:32
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 32
    ordinal: 21282
    text: Now therefore, our God, the great, the mighty, and the awful God, who keepest covenant and mercy, let not all the travail seem little before Thee, that hath come upon us, on our kings, on our princes, and on our priests, and on our prophets, and on our fathers, and on all Thy people, since the time of the kings of Assyria unto this day.
    translation: JPS 1917
    original: וְעַתָּה אֱלֹהֵינוּ הָאֵל הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא שׁוֹמֵר הַבְּרִית וְהַחֶסֶד אַל־יִמְעַט לְפָנֶיךָ אֵת כָּל־הַתְּלָאָה אֲשֶׁר־מְצָאַתְנוּ לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵנוּ וְלַאֲבֹתֵינוּ וּלְכָל־עַמֶּךָ מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ועתה אלהינו האל הגדול הגבור והנורא שומר הברית והחסד אל ימעט לפניך את כל התלאה אשר מצאתנו למלכינו לשרינו ולכהנינו ולנביאנו ולאבתינו ולכל עמך מימי מלכי אשור עד היום הזה
    kjvRefs:
    - Nehemiah 9:32
    kjvOsis:
    - Neh.9.32
