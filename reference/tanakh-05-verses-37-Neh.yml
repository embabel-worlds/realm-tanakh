- type: TanakhVerse
  data:
    osis: Neh.1.6
    scripture: tanakh
    name: Tanakh Nehemiah 1:6
    ref: Nehemiah 1:6
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 21042
    text: let Thine ear now be attentive, and Thine eyes open, that Thou mayest hearken unto the prayer of Thy servant, which I pray before Thee at this time, day and night, for the children of Israel Thy servants, while I confess the sins of the children of Israel, which we have sinned against Thee; yea, I and my father’s house have sinned.
    translation: JPS 1917
    original: תְּהִי נָא אָזְנְךָ־קַשֶּׁבֶת וְעֵינֶיךָ פְתֻוּחוֹת לִשְׁמֹעַ אֶל־תְּפִלַּת עַבְדְּךָ אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה עַל־בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ וּמִתְוַדֶּה עַל־חַטֹּאות בְּנֵי־יִשְׂרָאֵל אֲשֶׁר חָטָאנוּ לָךְ וַאֲנִי וּבֵית־אָבִי חָטָאנוּ׃
    hebrewPlain: תהי נא אזנך קשבת ועיניך פתוחות לשמע אל תפלת עבדך אשר אנכי מתפלל לפניך היום יומם ולילה על בני ישראל עבדיך ומתודה על חטאות בני ישראל אשר חטאנו לך ואני ובית אבי חטאנו
    kjvRefs:
    - Nehemiah 1:6
    kjvOsis:
    - Neh.1.6
