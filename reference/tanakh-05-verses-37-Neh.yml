    section: ketuvim
    chapter: 9
    verse: 33
    ordinal: 21283
    text: Howbeit Thou art just in all that is come upon us; for Thou hast dealt truly, but we have done wickedly;
    translation: JPS 1917
    original: וְאַתָּה צַדִּיק עַל כָּל־הַבָּא עָלֵינוּ כִּי־אֱמֶת עָשִׂיתָ וַאֲנַחְנוּ הִרְשָׁעְנוּ׃
    hebrewPlain: ואתה צדיק על כל הבא עלינו כי אמת עשית ואנחנו הרשענו
    kjvRefs:
    - Nehemiah 9:33
    kjvOsis:
    - Neh.9.33
