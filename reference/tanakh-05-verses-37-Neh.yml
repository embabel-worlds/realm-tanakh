- type: TanakhVerse
  data:
    osis: Neh.12.26
    scripture: tanakh
    name: Tanakh Nehemiah 12:26
    ref: Nehemiah 12:26
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 26
    ordinal: 21389
    text: These were in the days of Joiakim the son of Jeshua, the son of Jozadak, and in the days of Nehemiah the governor, and of Ezra the priest the scribe.
    translation: JPS 1917
    original: אֵלֶּה בִּימֵי יוֹיָקִים בֶּן־יֵשׁוּעַ בֶּן־יוֹצָדָק וּבִימֵי נְחֶמְיָה הַפֶּחָה וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר׃
    hebrewPlain: אלה בימי יויקים בן ישוע בן יוצדק ובימי נחמיה הפחה ועזרא הכהן הסופר
    kjvRefs:
    - Nehemiah 12:26
    kjvOsis:
    - Neh.12.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.27
    scripture: tanakh
    name: Tanakh Nehemiah 12:27
    ref: Nehemiah 12:27
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 27
    ordinal: 21390
    text: And at the dedication of the wall of Jerusalem they sought the Levites out of all their places, to bring them to Jerusalem, to keep the dedication with gladness, both with thanksgivings, and with singing, with cymbals, psalteries, and with harps.
    translation: JPS 1917
    original: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם בִּקְשׁוּ אֶת־הַלְוִיִּם מִכָּל־מְקוֹמֹתָם לַהֲבִיאָם לִירוּשָׁלִָם לַעֲשֹׂת חֲנֻכָּה וְשִׂמְחָה וּבְתוֹדוֹת וּבְשִׁיר מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת׃
    hebrewPlain: ובחנכת חומת ירושלם בקשו את הלוים מכל מקומתם להביאם לירושלם לעשת חנכה ושמחה ובתודות ובשיר מצלתים נבלים ובכנרות
    kjvRefs:
    - Nehemiah 12:27
    kjvOsis:
    - Neh.12.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.28
    scripture: tanakh
    name: Tanakh Nehemiah 12:28
    ref: Nehemiah 12:28
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 28
    ordinal: 21391
    text: And the sons of the singers gathered themselves together, both out of the Plain round about Jerusalem, and from the villages of the Netophathites;
    translation: JPS 1917
    original: וַיֵּאָסְפוּ בְּנֵי הַמְשֹׁרְרִים וּמִן־הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם וּמִן־חַצְרֵי נְטֹפָתִי׃
    hebrewPlain: ויאספו בני המשררים ומן הככר סביבות ירושלם ומן חצרי נטפתי
    kjvRefs:
    - Nehemiah 12:28
    kjvOsis:
    - Neh.12.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.29
    scripture: tanakh
    name: Tanakh Nehemiah 12:29
    ref: Nehemiah 12:29
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 29
    ordinal: 21392
    text: also from Beth-gilgal, and out of the fields of Geba and Azmaveth; for the singers had builded them villages round about Jerusalem.
    translation: JPS 1917
    original: וּמִבֵּית הַגִּלְגָּל וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת כִּי חֲצֵרִים בָּנוּ לָהֶם הַמְשֹׁרֲרִים סְבִיבוֹת יְרוּשָׁלִָם׃
    hebrewPlain: ומבית הגלגל ומשדות גבע ועזמות כי חצרים בנו להם המשררים סביבות ירושלם
    kjvRefs:
    - Nehemiah 12:29
    kjvOsis:
    - Neh.12.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.30
    scripture: tanakh
    name: Tanakh Nehemiah 12:30
    ref: Nehemiah 12:30
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 30
    ordinal: 21393
    text: And the priests and the Levites purified themselves; and they purified the people, and the gates, and the wall.
    translation: JPS 1917
    original: וַיִּטַּהֲרוּ הַכֹּהֲנִים וְהַלְוִיִּם וַיְטַהֲרוּ אֶת־הָעָם וְאֶת־הַשְּׁעָרִים וְאֶת־הַחוֹמָה׃
    hebrewPlain: ויטהרו הכהנים והלוים ויטהרו את העם ואת השערים ואת החומה
    kjvRefs:
    - Nehemiah 12:30
    kjvOsis:
    - Neh.12.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.31
    scripture: tanakh
    name: Tanakh Nehemiah 12:31
    ref: Nehemiah 12:31
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 31
    ordinal: 21394
    text: 'Then I brought up the princes of Judah upon the wall, and appointed two great companies that gave thanks and went in procession: on the right hand upon the wall toward the dung gate;'
    translation: JPS 1917
    original: וָאַעֲלֶה אֶת־שָׂרֵי יְהוּדָה מֵעַל לַחוֹמָה וָאַעֲמִידָה שְׁתֵּי תוֹדֹת גְּדוֹלֹת וְתַהֲלֻכֹת לַיָּמִין מֵעַל לַחוֹמָה לְשַׁעַר הָאַשְׁפֹּת׃
    hebrewPlain: ואעלה את שרי יהודה מעל לחומה ואעמידה שתי תודת גדולת ותהלכת לימין מעל לחומה לשער האשפת
    kjvRefs:
    - Nehemiah 12:31
    kjvOsis:
    - Neh.12.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.32
    scripture: tanakh
    name: Tanakh Nehemiah 12:32
    ref: Nehemiah 12:32
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 32
    ordinal: 21395
    text: and after them went Hoshaiah, and half of the princes of Judah;
    translation: JPS 1917
    original: וַיֵּלֶךְ אַחֲרֵיהֶם הוֹשַׁעְיָה וַחֲצִי שָׂרֵי יְהוּדָה׃
    hebrewPlain: וילך אחריהם הושעיה וחצי שרי יהודה
    kjvRefs:
    - Nehemiah 12:32
    kjvOsis:
    - Neh.12.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.33
    scripture: tanakh
    name: Tanakh Nehemiah 12:33
    ref: Nehemiah 12:33
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 33
    ordinal: 21396
    text: and Azariah, Ezra, and Meshullam,
    translation: JPS 1917
    original: וַעֲזַרְיָה עֶזְרָא וּמְשֻׁלָּם׃
    hebrewPlain: ועזריה עזרא ומשלם
    kjvRefs:
    - Nehemiah 12:33
    kjvOsis:
    - Neh.12.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.12
- type: TanakhVerse
  data:
    osis: Neh.12.34
    scripture: tanakh
    name: Tanakh Nehemiah 12:34
    ref: Nehemiah 12:34
    book: Neh
    section: ketuvim
    chapter: 12
    verse: 34
    ordinal: 21397
    text: Judah, and Benjamin, and Shemaiah, and Jeremiah;
    translation: JPS 1917
    original: יְהוּדָה וּבִנְיָמִן וּשְׁמַעְיָה וְיִרְמְיָה׃
    hebrewPlain: יהודה ובנימן ושמעיה וירמיה
    kjvRefs:
    - Nehemiah 12:34
    kjvOsis:
    - Neh.12.34
  relations:
