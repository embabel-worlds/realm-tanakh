    verse: 25
    ordinal: 21388
    text: Mattaniah, and Bakbukiah, Obadiah, Meshullam, Talmon, Akkub, were porters keeping the ward at the store-houses of the gates.
    translation: JPS 1917
    original: מַתַּנְיָה וּבַקְבֻּקְיָה עֹבַדְיָה מְשֻׁלָּם טַלְמוֹן עַקּוּב שֹׁמְרִים שׁוֹעֲרִים מִשְׁמָר בַּאֲסֻפֵּי הַשְּׁעָרִים׃
    hebrewPlain: מתניה ובקבקיה עבדיה משלם טלמון עקוב שמרים שוערים משמר באספי השערים
    kjvRefs:
    - Nehemiah 12:25
    kjvOsis:
    - Neh.12.25
