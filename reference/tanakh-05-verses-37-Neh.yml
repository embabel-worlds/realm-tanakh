    name: Tanakh Nehemiah 7:64
    ref: Nehemiah 7:64
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 64
    ordinal: 21224
    text: These sought their register, that is, the genealogy, but it was not found; therefore were they deemed polluted and put from the priesthood.
    translation: JPS 1917
    original: אֵלֶּה בִּקְשׁוּ כְתָבָם הַמִּתְיַחְשִׂים וְלֹא נִמְצָא וַיְגֹאֲלוּ מִן־הַכְּהֻנָּה׃
    hebrewPlain: אלה בקשו כתבם המתיחשים ולא נמצא ויגאלו מן הכהנה
