- type: TanakhVerse
  data:
    osis: Neh.1.3
    scripture: tanakh
    name: Tanakh Nehemiah 1:3
    ref: Nehemiah 1:3
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 21039
    text: 'And they said unto me: ‘The remnant that are left of the captivity there in the province are in great affliction and reproach; the wall of Jerusalem also is broken down, and the gates thereof are burned with fire.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לִי הַנִּשְׁאָרִים אֲשֶׁר־נִשְׁאֲרוּ מִן־הַשְּׁבִי שָׁם בַּמְּדִינָה בְּרָעָה גְדֹלָה וּבְחֶרְפָּה וְחוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ׃
    hebrewPlain: ויאמרו לי הנשארים אשר נשארו מן השבי שם במדינה ברעה גדלה ובחרפה וחומת ירושלם מפרצת ושעריה נצתו באש
    kjvRefs:
    - Nehemiah 1:3
    kjvOsis:
    - Neh.1.3
