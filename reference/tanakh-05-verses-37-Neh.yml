    name: Tanakh Nehemiah 7:69
    ref: Nehemiah 7:69
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 69
    ordinal: 21229
    text: And some from among the heads of fathers’ houses gave unto the work. The Tirshatha gave to the treasury a thousand darics of gold, fifty basins, five hundred and thirty priests’ tunics.
    translation: JPS 1917
    original: וּמִקְצָת רָאשֵׁי הָאָבוֹת נָתְנוּ לַמְּלָאכָה הַתִּרְשָׁתָא נָתַן לָאוֹצָר זָהָב דַּרְכְּמֹנִים אֶלֶף מִזְרָקוֹת חֲמִשִּׁים כָּתְנוֹת כֹּהֲנִים שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת׃
    hebrewPlain: ומקצת ראשי האבות נתנו למלאכה התרשתא נתן לאוצר זהב דרכמנים אלף מזרקות חמשים כתנות כהנים שלשים וחמש מאות
    kjvRefs:
