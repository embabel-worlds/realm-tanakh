    original: וְהֵם בְּמַלְכוּתָם וּבְטוּבְךָ הָרָב אֲשֶׁר־נָתַתָּ לָהֶם וּבְאֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה אֲשֶׁר־נָתַתָּ לִפְנֵיהֶם לֹא עֲבָדוּךָ וְלֹא־שָׁבוּ מִמַּעַלְלֵיהֶם הָרָעִים׃
    hebrewPlain: והם במלכותם ובטובך הרב אשר נתת להם ובארץ הרחבה והשמנה אשר נתת לפניהם לא עבדוך ולא שבו ממעלליהם הרעים
