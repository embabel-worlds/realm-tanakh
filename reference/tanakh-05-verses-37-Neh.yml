- type: TanakhVerse
  data:
    osis: Neh.1.5
    scripture: tanakh
    name: Tanakh Nehemiah 1:5
    ref: Nehemiah 1:5
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 21041
    text: 'and said: ‘I beseech Thee, O LORD, the God of heaven, the great and awful God, that keepeth covenant and mercy with them that love Him and keep His commandments;'
    translation: JPS 1917
    original: וָאֹמַר אָנָּא יְהוָה אֱלֹהֵי הַשָּׁמַיִם הָאֵל הַגָּדוֹל וְהַנּוֹרָא שֹׁמֵר הַבְּרִית וָחֶסֶד לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו׃
    hebrewPlain: ואמר אנא יהוה אלהי השמים האל הגדול והנורא שמר הברית וחסד לאהביו ולשמרי מצותיו
    kjvRefs:
    - Nehemiah 1:5
    kjvOsis:
    - Neh.1.5
