  data:
    osis: Neh.7.70
    scripture: tanakh
    name: Tanakh Nehemiah 7:70
    ref: Nehemiah 7:70
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 70
    ordinal: 21230
    text: And some of the heads of fathers’ houses gave into the treasury of the work twenty thousand darics of gold, and two thousand and two hundred pounds of silver.
    translation: JPS 1917
    original: וּמֵרָאשֵׁי הָאָבוֹת נָתְנוּ לְאוֹצַר הַמְּלָאכָה זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם׃
    hebrewPlain: ומראשי האבות נתנו לאוצר המלאכה זהב דרכמונים שתי רבות וכסף מנים אלפים ומאתים
    kjvRefs:
    - Nehemiah 7:71
    kjvOsis:
    - Neh.7.71
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
