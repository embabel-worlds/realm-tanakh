    original: וּתְבוּאָתָהּ מַרְבָּה לַמְּלָכִים אֲשֶׁר־נָתַתָּה עָלֵינוּ בְּחַטֹּאותֵינוּ וְעַל גְּוִיֹּתֵינוּ מֹשְׁלִים וּבִבְהֶמְתֵּנוּ כִּרְצוֹנָם וּבְצָרָה גְדוֹלָה אֲנָחְנוּ׃
    hebrewPlain: ותבואתה מרבה למלכים אשר נתתה עלינו בחטאותינו ועל גויתינו משלים ובבהמתנו כרצונם ובצרה גדולה אנחנו
