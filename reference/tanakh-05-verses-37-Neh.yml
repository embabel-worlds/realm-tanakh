    section: ketuvim
    chapter: 3
    verse: 34
    ordinal: 21101
    text: 'And he spoke before his brethren and the army of Samaria, and said: ‘What do these feeble Jews? will they restore at will? will they sacrifice? will they make an end this day? will they revive the stones out of the heaps of rubbish, seeing they are burned?’'
    translation: JPS 1917
    original: וַיֹּאמֶר לִפְנֵי אֶחָיו וְחֵיל שֹׁמְרוֹן וַיֹּאמֶר מָה הַיְּהוּדִים הָאֲמֵלָלִים עֹשִׂים הֲיַעַזְבוּ לָהֶם הֲיִזְבָּחוּ הַיְכַלּוּ בַיּוֹם הַיְחַיּוּ אֶת־הָאֲבָנִים מֵעֲרֵמוֹת הֶעָפָר וְהֵמָּה שְׂרוּפוֹת׃
    hebrewPlain: ויאמר לפני אחיו וחיל שמרון ויאמר מה היהודים האמללים עשים היעזבו להם היזבחו היכלו ביום היחיו את האבנים מערמות העפר והמה שרופות
    kjvRefs:
    - Nehemiah 4:2
    kjvOsis:
    - Neh.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.35
    scripture: tanakh
    name: Tanakh Nehemiah 3:35
    ref: Nehemiah 3:35
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 35
    ordinal: 21102
    text: 'Now Tobiah the Ammonite was by him, and he said: ‘Even that which they build, if a fox go up, he shall break down their stone wall.’'
    translation: JPS 1917
    original: וְטוֹבִיָּה הָעַמֹּנִי אֶצְלוֹ וַיֹּאמֶר גַּם אֲשֶׁר־הֵם בּוֹנִים אִם־יַעֲלֶה שׁוּעָל וּפָרַץ חוֹמַת אַבְנֵיהֶם׃
    hebrewPlain: וטוביה העמני אצלו ויאמר גם אשר הם בונים אם יעלה שועל ופרץ חומת אבניהם
    kjvRefs:
    - Nehemiah 4:3
    kjvOsis:
    - Neh.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.36
    scripture: tanakh
    name: Tanakh Nehemiah 3:36
    ref: Nehemiah 3:36
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 36
    ordinal: 21103
    text: Hear, O our God; for we are despised; and turn back their reproach upon their own head, and give them up to spoiling in a land of captivity;
    translation: JPS 1917
    original: שְׁמַע אֱלֹהֵינוּ כִּי־הָיִינוּ בוּזָה וְהָשֵׁב חֶרְפָּתָם אֶל־רֹאשָׁם וּתְנֵם לְבִזָּה בְּאֶרֶץ שִׁבְיָה׃
    hebrewPlain: שמע אלהינו כי היינו בוזה והשב חרפתם אל ראשם ותנם לבזה בארץ שביה
    kjvRefs:
    - Nehemiah 4:4
    kjvOsis:
    - Neh.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.37
    scripture: tanakh
    name: Tanakh Nehemiah 3:37
    ref: Nehemiah 3:37
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 37
    ordinal: 21104
    text: and cover not their iniquity, and let not their sin be blotted out from before Thee; for they have vexed Thee before the builders.
    translation: JPS 1917
    original: וְאַל־תְּכַס עַל־עֲוֺנָם וְחַטָּאתָם מִלְּפָנֶיךָ אַל־תִּמָּחֶה כִּי הִכְעִיסוּ לְנֶגֶד הַבּוֹנִים׃
    hebrewPlain: ואל תכס על עונם וחטאתם מלפניך אל תמחה כי הכעיסו לנגד הבונים
    kjvRefs:
    - Nehemiah 4:5
    kjvOsis:
    - Neh.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.3.38
    scripture: tanakh
    name: Tanakh Nehemiah 3:38
    ref: Nehemiah 3:38
    book: Neh
    section: ketuvim
    chapter: 3
    verse: 38
    ordinal: 21105
    text: So we built the wall; and all the wall was joined together unto half the height thereof; for the people had a mind to work.
    translation: JPS 1917
    original: וַנִּבְנֶה אֶת־הַחוֹמָה וַתִּקָּשֵׁר כָּל־הַחוֹמָה עַד־חֶצְיָהּ וַיְהִי לֵב לָעָם לַעֲשׂוֹת׃
    hebrewPlain: ונבנה את החומה ותקשר כל החומה עד חציה ויהי לב לעם לעשות
    kjvRefs:
    - Nehemiah 4:6
    kjvOsis:
    - Neh.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.3
- type: TanakhVerse
  data:
    osis: Neh.4.1
    scripture: tanakh
    name: Tanakh Nehemiah 4:1
    ref: Nehemiah 4:1
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 21106
    text: But it came to pass that, when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the repairing of the walls of Jerusalem went forward, and that the breaches began to be stopped, then they were very wroth;
    translation: JPS 1917
    original: וַיְהִי כַאֲשֶׁר שָׁמַע סַנְבַלַּט וְטוֹבִיָּה וְהָעַרְבִים וְהָעַמֹּנִים וְהָאַשְׁדּוֹדִים כִּי־עָלְתָה אֲרוּכָה לְחֹמוֹת יְרוּשָׁלִַם כִּי־הֵחֵלּוּ הַפְּרֻצִים לְהִסָּתֵם וַיִּחַר לָהֶם מְאֹד׃
    hebrewPlain: ויהי כאשר שמע סנבלט וטוביה והערבים והעמנים והאשדודים כי עלתה ארוכה לחמות ירושלם כי החלו הפרצים להסתם ויחר להם מאד
    kjvRefs:
    - Nehemiah 4:7
    kjvOsis:
    - Neh.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.2
    scripture: tanakh
    name: Tanakh Nehemiah 4:2
    ref: Nehemiah 4:2
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 21107
    text: and they conspired all of them together to come and fight against Jerusalem, and to cause confusion therein.
    translation: JPS 1917
    original: וַיִּקְשְׁרוּ כֻלָּם יַחְדָּו לָבוֹא לְהִלָּחֵם בִּירוּשָׁלִָם וְלַעֲשׂוֹת לוֹ תּוֹעָה׃
    hebrewPlain: ויקשרו כלם יחדו לבוא להלחם בירושלם ולעשות לו תועה
    kjvRefs:
    - Nehemiah 4:8
    kjvOsis:
    - Neh.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.3
    scripture: tanakh
    name: Tanakh Nehemiah 4:3
    ref: Nehemiah 4:3
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 21108
    text: But we made our prayer unto our God, and set a watch against them day and night, because of them.
    translation: JPS 1917
    original: וַנִּתְפַּלֵּל אֶל־אֱלֹהֵינוּ וַנַּעֲמִיד מִשְׁמָר עֲלֵיהֶם יוֹמָם וָלַיְלָה מִפְּנֵיהֶם׃
    hebrewPlain: ונתפלל אל אלהינו ונעמיד משמר עליהם יומם ולילה מפניהם
    kjvRefs:
    - Nehemiah 4:9
    kjvOsis:
    - Neh.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.4
    scripture: tanakh
    name: Tanakh Nehemiah 4:4
    ref: Nehemiah 4:4
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 21109
    text: 'And Judah said: ‘The strength of the bearers of burdens is decayed, and there is much rubbish; so that we are not able to build the wall.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוּדָה כָּשַׁל כֹּחַ הַסַּבָּל וְהֶעָפָר הַרְבֵּה וַאֲנַחְנוּ לֹא נוּכַל לִבְנוֹת בַּחוֹמָה׃
    hebrewPlain: ויאמר יהודה כשל כח הסבל והעפר הרבה ואנחנו לא נוכל לבנות בחומה
    kjvRefs:
    - Nehemiah 4:10
    kjvOsis:
    - Neh.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.5
    scripture: tanakh
    name: Tanakh Nehemiah 4:5
    ref: Nehemiah 4:5
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 21110
    text: 'And our adversaries said: ‘They shall not know, neither see, till we come into the midst of them, and slay them, and cause the work to cease.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ צָרֵינוּ לֹא יֵדְעוּ וְלֹא יִרְאוּ עַד אֲשֶׁר־נָבוֹא אֶל־תּוֹכָם וַהֲרַגְנוּם וְהִשְׁבַּתְנוּ אֶת־הַמְּלָאכָה׃
    hebrewPlain: ויאמרו צרינו לא ידעו ולא יראו עד אשר נבוא אל תוכם והרגנום והשבתנו את המלאכה
    kjvRefs:
    - Nehemiah 4:11
    kjvOsis:
    - Neh.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.6
    scripture: tanakh
    name: Tanakh Nehemiah 4:6
    ref: Nehemiah 4:6
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 21111
    text: 'And it came to pass that, when the Jews that dwelt by them came, they said unto us ten times: ‘Ye must return unto us from all places.’'
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־בָּאוּ הַיְּהוּדִים הַיֹּשְׁבִים אֶצְלָם וַיֹּאמְרוּ לָנוּ עֶשֶׂר פְּעָמִים מִכָּל־הַמְּקֹמוֹת אֲשֶׁר־תָּשׁוּבוּ עָלֵינוּ׃
    hebrewPlain: ויהי כאשר באו היהודים הישבים אצלם ויאמרו לנו עשר פעמים מכל המקמות אשר תשובו עלינו
    kjvRefs:
    - Nehemiah 4:12
    kjvOsis:
    - Neh.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.7
    scripture: tanakh
    name: Tanakh Nehemiah 4:7
    ref: Nehemiah 4:7
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 21112
    text: Therefore set I in the lowest parts of the space behind the wall, in the open places, I even set the people after their families with their swords, their spears, and their bows.
    translation: JPS 1917
    original: וָאַעֲמִיד מִתַּחְתִּיּוֹת לַמָּקוֹם מֵאַחֲרֵי לַחוֹמָה בצחחיים [בַּצְּחִיחִים] וָאַעֲמִיד אֶת־הָעָם לְמִשְׁפָּחוֹת עִם־חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם׃
    hebrewPlain: ואעמיד מתחתיות למקום מאחרי לחומה בצחחיים [בצחיחים] ואעמיד את העם למשפחות עם חרבתיהם רמחיהם וקשתתיהם
    kjvRefs:
    - Nehemiah 4:13
    kjvOsis:
    - Neh.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.8
    scripture: tanakh
    name: Tanakh Nehemiah 4:8
    ref: Nehemiah 4:8
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 21113
    text: 'And I looked, and rose up, and said unto the nobles, and to the rulers, and to the rest of the people: ‘Be not ye afraid of them; remember the Lord, who is great and awful, and fight for your brethren, your sons and your daughters, your wives and your houses.’'
    translation: JPS 1917
    original: וָאֵרֶא וָאָקוּם וָאֹמַר אֶל־הַחֹרִים וְאֶל־הַסְּגָנִים וְאֶל־יֶתֶר הָעָם אַל־תִּירְאוּ מִפְּנֵיהֶם אֶת־אֲדֹנָי הַגָּדוֹל וְהַנּוֹרָא זְכֹרוּ וְהִלָּחֲמוּ עַל־אֲחֵיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם׃
    hebrewPlain: וארא ואקום ואמר אל החרים ואל הסגנים ואל יתר העם אל תיראו מפניהם את אדני הגדול והנורא זכרו והלחמו על אחיכם בניכם ובנתיכם נשיכם ובתיכם
    kjvRefs:
    - Nehemiah 4:14
    kjvOsis:
    - Neh.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.9
    scripture: tanakh
    name: Tanakh Nehemiah 4:9
    ref: Nehemiah 4:9
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 21114
    text: And it came to pass, when our enemies heard that it was known unto us, and God had brought their counsel to nought, that we returned all of us to the wall, every one unto his work.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־שָׁמְעוּ אוֹיְבֵינוּ כִּי־נוֹדַע לָנוּ וַיָּפֶר הָאֱלֹהִים אֶת־עֲצָתָם ונשוב [וַנָּשָׁב] כֻּלָּנוּ אֶל־הַחוֹמָה אִישׁ אֶל־מְלַאכְתּוֹ׃
    hebrewPlain: ויהי כאשר שמעו אויבינו כי נודע לנו ויפר האלהים את עצתם ונשוב [ונשב] כלנו אל החומה איש אל מלאכתו
    kjvRefs:
    - Nehemiah 4:15
    kjvOsis:
    - Neh.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.10
    scripture: tanakh
    name: Tanakh Nehemiah 4:10
    ref: Nehemiah 4:10
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 21115
    text: And it came to pass from that time forth, that half of my servants wrought in the work, and half of them held the spears, the shields, and the bows, and the coats of mail; and the rulers were behind all the house of Judah.
    translation: JPS 1917
    original: וַיְהִי מִן־הַיּוֹם הַהוּא חֲצִי נְעָרַי עֹשִׂים בַּמְּלָאכָה וְחֶצְיָם מַחֲזִיקִים וְהָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת וְהַשִּׁרְיֹנִים וְהַשָּׂרִים אַחֲרֵי כָּל־בֵּית יְהוּדָה׃
    hebrewPlain: ויהי מן היום ההוא חצי נערי עשים במלאכה וחצים מחזיקים והרמחים המגנים והקשתות והשרינים והשרים אחרי כל בית יהודה
    kjvRefs:
    - Nehemiah 4:16
    kjvOsis:
    - Neh.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.11
    scripture: tanakh
    name: Tanakh Nehemiah 4:11
    ref: Nehemiah 4:11
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 21116
    text: They that builded the wall and they that bore burdens laded themselves, every one with one of his hands wrought in the work, and with the other held his weapon;
    translation: JPS 1917
    original: הַבּוֹנִים בַּחוֹמָה וְהַנֹּשְׂאִים בַּסֶּבֶל עֹמְשִׂים בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה וְאַחַת מַחֲזֶקֶת הַשָּׁלַח׃
    hebrewPlain: הבונים בחומה והנשאים בסבל עמשים באחת ידו עשה במלאכה ואחת מחזקת השלח
    kjvRefs:
    - Nehemiah 4:17
    kjvOsis:
    - Neh.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.12
    scripture: tanakh
    name: Tanakh Nehemiah 4:12
    ref: Nehemiah 4:12
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 21117
    text: and the builders, every one had his sword girded by his side, and so builded. And he that sounded the horn was by me.
    translation: JPS 1917
    original: וְהַבּוֹנִים אִישׁ חַרְבּוֹ אֲסוּרִים עַל־מָתְנָיו וּבוֹנִים וְהַתּוֹקֵעַ בַּשּׁוֹפָר אֶצְלִי׃
    hebrewPlain: והבונים איש חרבו אסורים על מתניו ובונים והתוקע בשופר אצלי
    kjvRefs:
    - Nehemiah 4:18
    kjvOsis:
    - Neh.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.13
    scripture: tanakh
    name: Tanakh Nehemiah 4:13
    ref: Nehemiah 4:13
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 21118
    text: 'And I said unto the nobles, and to the rulers and to the rest of the people: ‘The work is great and large, and we are separated upon the wall, one far from another;'
    translation: JPS 1917
    original: וָאֹמַר אֶל־הַחֹרִים וְאֶל־הַסְּגָנִים וְאֶל־יֶתֶר הָעָם הַמְּלָאכָה הַרְבֵּה וּרְחָבָה וַאֲנַחְנוּ נִפְרָדִים עַל־הַחוֹמָה רְחוֹקִים אִישׁ מֵאָחִיו׃
    hebrewPlain: ואמר אל החרים ואל הסגנים ואל יתר העם המלאכה הרבה ורחבה ואנחנו נפרדים על החומה רחוקים איש מאחיו
    kjvRefs:
    - Nehemiah 4:19
    kjvOsis:
    - Neh.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.14
    scripture: tanakh
    name: Tanakh Nehemiah 4:14
    ref: Nehemiah 4:14
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 21119
    text: in what place soever ye hear the sound of the horn, resort ye thither unto us; our God will fight for us.’
    translation: JPS 1917
    original: בִּמְקוֹם אֲשֶׁר תִּשְׁמְעוּ אֶת־קוֹל הַשּׁוֹפָר שָׁמָּה תִּקָּבְצוּ אֵלֵינוּ אֱלֹהֵינוּ יִלָּחֶם לָנוּ׃
    hebrewPlain: במקום אשר תשמעו את קול השופר שמה תקבצו אלינו אלהינו ילחם לנו
    kjvRefs:
    - Nehemiah 4:20
    kjvOsis:
    - Neh.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.15
    scripture: tanakh
    name: Tanakh Nehemiah 4:15
    ref: Nehemiah 4:15
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 21120
    text: So we wrought in the work; and half of them held the spears from the rising of the morning till the stars appeared.
    translation: JPS 1917
    original: וַאֲנַחְנוּ עֹשִׂים בַּמְּלָאכָה וְחֶצְיָם מַחֲזִיקִים בָּרְמָחִים מֵעֲלוֹת הַשַּׁחַר עַד צֵאת הַכּוֹכָבִים׃
    hebrewPlain: ואנחנו עשים במלאכה וחצים מחזיקים ברמחים מעלות השחר עד צאת הכוכבים
    kjvRefs:
    - Nehemiah 4:21
    kjvOsis:
    - Neh.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.16
    scripture: tanakh
    name: Tanakh Nehemiah 4:16
    ref: Nehemiah 4:16
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 21121
    text: 'Likewise at the same time said I unto the people: ‘Let every one with his servant lodge within Jerusalem, that in the night they may be a guard to us, and may labour in the day.’'
    translation: JPS 1917
    original: גַּם בָּעֵת הַהִיא אָמַרְתִּי לָעָם אִישׁ וְנַעֲרוֹ יָלִינוּ בְּתוֹךְ יְרוּשָׁלִָם וְהָיוּ־לָנוּ הַלַּיְלָה מִשְׁמָר וְהַיּוֹם מְלָאכָה׃
    hebrewPlain: גם בעת ההיא אמרתי לעם איש ונערו ילינו בתוך ירושלם והיו לנו הלילה משמר והיום מלאכה
    kjvRefs:
    - Nehemiah 4:22
    kjvOsis:
    - Neh.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.4.17
    scripture: tanakh
    name: Tanakh Nehemiah 4:17
    ref: Nehemiah 4:17
    book: Neh
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 21122
    text: So neither I, nor my brethren, nor my servants, nor the men of the guard that followed me, none of us put off our clothes, every one that went to the water had his weapon.
    translation: JPS 1917
    original: וְאֵין אֲנִי וְאַחַי וּנְעָרַי וְאַנְשֵׁי הַמִּשְׁמָר אֲשֶׁר אַחֲרַי אֵין־אֲנַחְנוּ פֹשְׁטִים בְּגָדֵינוּ אִישׁ שִׁלְחוֹ הַמָּיִם׃
    hebrewPlain: ואין אני ואחי ונערי ואנשי המשמר אשר אחרי אין אנחנו פשטים בגדינו איש שלחו המים
    kjvRefs:
    - Nehemiah 4:23
    kjvOsis:
    - Neh.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.4
- type: TanakhVerse
  data:
    osis: Neh.5.1
    scripture: tanakh
    name: Tanakh Nehemiah 5:1
    ref: Nehemiah 5:1
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 21123
    text: Then there arose a great cry of the people and of their wives against their brethren the Jews.
    translation: JPS 1917
    original: וַתְּהִי צַעֲקַת הָעָם וּנְשֵׁיהֶם גְּדוֹלָה אֶל־אֲחֵיהֶם הַיְּהוּדִים׃
    hebrewPlain: ותהי צעקת העם ונשיהם גדולה אל אחיהם היהודים
    kjvRefs:
    - Nehemiah 5:1
    kjvOsis:
    - Neh.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.2
    scripture: tanakh
    name: Tanakh Nehemiah 5:2
    ref: Nehemiah 5:2
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 21124
    text: 'For there were that said: ‘We, our sons and our daughters, are many; let us get for them corn, that we may eat and live.’'
    translation: JPS 1917
    original: וְיֵשׁ אֲשֶׁר אֹמְרִים בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים וְנִקְחָה דָגָן וְנֹאכְלָה וְנִחְיֶה׃
    hebrewPlain: ויש אשר אמרים בנינו ובנתינו אנחנו רבים ונקחה דגן ונאכלה ונחיה
    kjvRefs:
    - Nehemiah 5:2
    kjvOsis:
    - Neh.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.3
    scripture: tanakh
    name: Tanakh Nehemiah 5:3
    ref: Nehemiah 5:3
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 21125
    text: 'Some also there were that said: ‘We are mortgaging our fields, and our vineyards, and our houses; let us get corn, because of the dearth.’'
    translation: JPS 1917
    original: וְיֵשׁ אֲשֶׁר אֹמְרִים שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ אֲנַחְנוּ עֹרְבִים וְנִקְחָה דָגָן בָּרָעָב׃
    hebrewPlain: ויש אשר אמרים שדתינו וכרמינו ובתינו אנחנו ערבים ונקחה דגן ברעב
    kjvRefs:
    - Nehemiah 5:3
    kjvOsis:
    - Neh.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.4
    scripture: tanakh
    name: Tanakh Nehemiah 5:4
    ref: Nehemiah 5:4
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 21126
    text: 'There were also that said: ‘We have borrowed money for the king’s tribute upon our fields and our vineyards.'
    translation: JPS 1917
    original: וְיֵשׁ אֲשֶׁר אֹמְרִים לָוִינוּ כֶסֶף לְמִדַּת הַמֶּלֶךְ שְׂדֹתֵינוּ וּכְרָמֵינוּ׃
    hebrewPlain: ויש אשר אמרים לוינו כסף למדת המלך שדתינו וכרמינו
    kjvRefs:
    - Nehemiah 5:4
    kjvOsis:
    - Neh.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.5
    scripture: tanakh
    name: Tanakh Nehemiah 5:5
    ref: Nehemiah 5:5
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 21127
    text: Yet now our flesh is as the flesh of our brethren, our children as their children; and, lo, we bring into bondage our sons and our daughters to be servants, and some of our daughters are brought into bondage already; neither is it in our power to help it; for other men have our fields and our vineyards.’
    translation: JPS 1917
    original: וְעַתָּה כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ כִּבְנֵיהֶם בָּנֵינוּ וְהִנֵּה אֲנַחְנוּ כֹבְשִׁים אֶת־בָּנֵינוּ וְאֶת־בְּנֹתֵינוּ לַעֲבָדִים וְיֵשׁ מִבְּנֹתֵינוּ נִכְבָּשׁוֹת וְאֵין לְאֵל יָדֵנוּ וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים׃
    hebrewPlain: ועתה כבשר אחינו בשרנו כבניהם בנינו והנה אנחנו כבשים את בנינו ואת בנתינו לעבדים ויש מבנתינו נכבשות ואין לאל ידנו ושדתינו וכרמינו לאחרים
    kjvRefs:
    - Nehemiah 5:5
    kjvOsis:
    - Neh.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.6
    scripture: tanakh
    name: Tanakh Nehemiah 5:6
    ref: Nehemiah 5:6
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 21128
    text: And I was very angry when I heard their cry and these words.
    translation: JPS 1917
    original: וַיִּחַר לִי מְאֹד כַּאֲשֶׁר שָׁמַעְתִּי אֶת־זַעֲקָתָם וְאֵת הַדְּבָרִים הָאֵלֶּה׃
    hebrewPlain: ויחר לי מאד כאשר שמעתי את זעקתם ואת הדברים האלה
    kjvRefs:
    - Nehemiah 5:6
    kjvOsis:
    - Neh.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.7
    scripture: tanakh
    name: Tanakh Nehemiah 5:7
    ref: Nehemiah 5:7
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 21129
    text: 'Then I consulted with myself, and contended with the nobles and the rulers, and said unto them: ‘Ye lend upon pledge, every one to his brother.’ And I held a great assembly against them.'
    translation: JPS 1917
    original: וַיִּמָּלֵךְ לִבִּי עָלַי וָאָרִיבָה אֶת־הַחֹרִים וְאֶת־הַסְּגָנִים וָאֹמְרָה לָהֶם מַשָּׁא אִישׁ־בְּאָחִיו אַתֶּם נשאים [נֹשִׁים] וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה׃
    hebrewPlain: וימלך לבי עלי ואריבה את החרים ואת הסגנים ואמרה להם משא איש באחיו אתם נשאים [נשים] ואתן עליהם קהלה גדולה
    kjvRefs:
    - Nehemiah 5:7
    kjvOsis:
    - Neh.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.8
    scripture: tanakh
    name: Tanakh Nehemiah 5:8
    ref: Nehemiah 5:8
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 21130
    text: 'And I said unto them: ‘We after our ability have redeemed our brethren the Jews, that sold themselves unto the heathen; and would ye nevertheless sell your brethren, and should they sell themselves unto us?’ Then held they their peace, and found never a word.'
    translation: JPS 1917
    original: וָאֹמְרָה לָהֶם אֲנַחְנוּ קָנִינוּ אֶת־אַחֵינוּ הַיְּהוּדִים הַנִּמְכָּרִים לַגּוֹיִם כְּדֵי בָנוּ וְגַם־אַתֶּם תִּמְכְּרוּ אֶת־אֲחֵיכֶם וְנִמְכְּרוּ־לָנוּ וַיַּחֲרִישׁוּ וְלֹא מָצְאוּ דָּבָר׃
    hebrewPlain: ואמרה להם אנחנו קנינו את אחינו היהודים הנמכרים לגוים כדי בנו וגם אתם תמכרו את אחיכם ונמכרו לנו ויחרישו ולא מצאו דבר
    kjvRefs:
    - Nehemiah 5:8
    kjvOsis:
    - Neh.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.9
    scripture: tanakh
    name: Tanakh Nehemiah 5:9
    ref: Nehemiah 5:9
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 21131
    text: 'Also I said: ‘The thing that ye do is not good; ought ye not to walk in the fear of our God, because of the reproach of the heathen our enemies?'
    translation: JPS 1917
    original: ויאמר [וָאוֹמַר] לֹא־טוֹב הַדָּבָר אֲשֶׁר־אַתֶּם עֹשִׂים הֲלוֹא בְּיִרְאַת אֱלֹהֵינוּ תֵּלֵכוּ מֵחֶרְפַּת הַגּוֹיִם אוֹיְבֵינוּ׃
    hebrewPlain: ויאמר [ואומר] לא טוב הדבר אשר אתם עשים הלוא ביראת אלהינו תלכו מחרפת הגוים אויבינו
    kjvRefs:
    - Nehemiah 5:9
    kjvOsis:
    - Neh.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.10
    scripture: tanakh
    name: Tanakh Nehemiah 5:10
    ref: Nehemiah 5:10
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 21132
    text: And I likewise, my brethren and my servants, have lent them money and corn. I pray you, let us leave off this exaction.
    translation: JPS 1917
    original: וְגַם־אֲנִי אַחַי וּנְעָרַי נֹשִׁים בָּהֶם כֶּסֶף וְדָגָן נַעַזְבָה־נָּא אֶת־הַמַּשָּׁא הַזֶּה׃
    hebrewPlain: וגם אני אחי ונערי נשים בהם כסף ודגן נעזבה נא את המשא הזה
    kjvRefs:
    - Nehemiah 5:10
    kjvOsis:
    - Neh.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.11
    scripture: tanakh
    name: Tanakh Nehemiah 5:11
    ref: Nehemiah 5:11
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 21133
    text: Restore, I pray you, to them, even this day, their fields, their vineyards, their oliveyards, and their houses, also the hundred pieces of silver, and the corn, the wine, and the oil, that ye exact of them.’
    translation: JPS 1917
    original: הָשִׁיבוּ נָא לָהֶם כְּהַיּוֹם שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם וּמְאַת הַכֶּסֶף וְהַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר אֲשֶׁר אַתֶּם נֹשִׁים בָּהֶם׃
    hebrewPlain: השיבו נא להם כהיום שדתיהם כרמיהם זיתיהם ובתיהם ומאת הכסף והדגן התירוש והיצהר אשר אתם נשים בהם
    kjvRefs:
    - Nehemiah 5:11
    kjvOsis:
    - Neh.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.12
    scripture: tanakh
    name: Tanakh Nehemiah 5:12
    ref: Nehemiah 5:12
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 21134
    text: 'Then said they: ‘We will restore them, and will require nothing of them; so will we do, even as thou sayest.’ Then I called the priests, and took an oath of them, that they should do according to this promise.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ נָשִׁיב וּמֵהֶם לֹא נְבַקֵּשׁ כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר וָאֶקְרָא אֶת־הַכֹּהֲנִים וָאַשְׁבִּיעֵם לַעֲשׂוֹת כַּדָּבָר הַזֶּה׃
    hebrewPlain: ויאמרו נשיב ומהם לא נבקש כן נעשה כאשר אתה אומר ואקרא את הכהנים ואשביעם לעשות כדבר הזה
    kjvRefs:
    - Nehemiah 5:12
    kjvOsis:
    - Neh.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.13
    scripture: tanakh
    name: Tanakh Nehemiah 5:13
    ref: Nehemiah 5:13
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 21135
    text: 'Also I shook out my lap, and said: ‘So God shake out every man from his house, and from his labour, that performeth not this promise; even thus be he shaken out, and emptied.’ And all the congregation said: ‘Amen’, and praised the LORD. And the people did according to this promise.'
    translation: JPS 1917
    original: גַּם־חָצְנִי נָעַרְתִּי וָאֹמְרָה כָּכָה יְנַעֵר הָאֱלֹהִים אֶת־כָּל־הָאִישׁ אֲשֶׁר לֹא־יָקִים אֶת־הַדָּבָר הַזֶּה מִבֵּיתוֹ וּמִיגִיעוֹ וְכָכָה יִהְיֶה נָעוּר וָרֵק וַיֹּאמְרוּ כָל־הַקָּהָל אָמֵן וַיְהַלְלוּ אֶת־יְהוָה וַיַּעַשׂ הָעָם כַּדָּבָר הַזֶּה׃
    hebrewPlain: גם חצני נערתי ואמרה ככה ינער האלהים את כל האיש אשר לא יקים את הדבר הזה מביתו ומיגיעו וככה יהיה נעור ורק ויאמרו כל הקהל אמן ויהללו את יהוה ויעש העם כדבר הזה
    kjvRefs:
    - Nehemiah 5:13
    kjvOsis:
    - Neh.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.14
    scripture: tanakh
    name: Tanakh Nehemiah 5:14
    ref: Nehemiah 5:14
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 21136
    text: Moreover from the time that I was appointed to be their governor in the land of Judah, from the twentieth year even unto the two and thirtieth year of Artaxerxes the king, that is, twelve years, I and my brethren have not eaten the bread of the governor.
    translation: JPS 1917
    original: גַּם מִיּוֹם אֲשֶׁר־צִוָּה אֹתִי לִהְיוֹת פֶּחָם בְּאֶרֶץ יְהוּדָה מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ שָׁנִים שְׁתֵּים עֶשְׂרֵה אֲנִי וְאַחַי לֶחֶם הַפֶּחָה לֹא אָכַלְתִּי׃
    hebrewPlain: גם מיום אשר צוה אתי להיות פחם בארץ יהודה משנת עשרים ועד שנת שלשים ושתים לארתחשסתא המלך שנים שתים עשרה אני ואחי לחם הפחה לא אכלתי
    kjvRefs:
    - Nehemiah 5:14
    kjvOsis:
    - Neh.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.15
    scripture: tanakh
    name: Tanakh Nehemiah 5:15
    ref: Nehemiah 5:15
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 21137
    text: But the former governors that were before me laid burdens upon the people, and took of them for bread and wine above forty shekels of silver; yea, even their servants lorded over the people; but so did not I, because of the fear of God.
    translation: JPS 1917
    original: וְהַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר־לְפָנַי הִכְבִּידוּ עַל־הָעָם וַיִּקְחוּ מֵהֶם בְּלֶחֶם וָיַיִן אַחַר כֶּסֶף־שְׁקָלִים אַרְבָּעִים גַּם נַעֲרֵיהֶם שָׁלְטוּ עַל־הָעָם וַאֲנִי לֹא־עָשִׂיתִי כֵן מִפְּנֵי יִרְאַת אֱלֹהִים׃
    hebrewPlain: והפחות הראשנים אשר לפני הכבידו על העם ויקחו מהם בלחם ויין אחר כסף שקלים ארבעים גם נעריהם שלטו על העם ואני לא עשיתי כן מפני יראת אלהים
    kjvRefs:
    - Nehemiah 5:15
    kjvOsis:
    - Neh.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.16
    scripture: tanakh
    name: Tanakh Nehemiah 5:16
    ref: Nehemiah 5:16
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 21138
    text: Yea, also I set hand to the work of this wall, neither bought we any land; and all my servants were gathered thither unto the work.
    translation: JPS 1917
    original: וְגַם בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת הֶחֱזַקְתִּי וְשָׂדֶה לֹא קָנִינוּ וְכָל־נְעָרַי קְבוּצִים שָׁם עַל־הַמְּלָאכָה׃
    hebrewPlain: וגם במלאכת החומה הזאת החזקתי ושדה לא קנינו וכל נערי קבוצים שם על המלאכה
    kjvRefs:
    - Nehemiah 5:16
    kjvOsis:
    - Neh.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.17
    scripture: tanakh
    name: Tanakh Nehemiah 5:17
    ref: Nehemiah 5:17
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 21139
    text: Moreover there were at my table of the Jews and the rulers a hundred and fifty men, beside those that came unto us from among the nations that were round about us.
    translation: JPS 1917
    original: וְהַיְּהוּדִים וְהַסְּגָנִים מֵאָה וַחֲמִשִּׁים אִישׁ וְהַבָּאִים אֵלֵינוּ מִן־הַגּוֹיִם אֲשֶׁר־סְבִיבֹתֵינוּ עַל־שֻׁלְחָנִי׃
    hebrewPlain: והיהודים והסגנים מאה וחמשים איש והבאים אלינו מן הגוים אשר סביבתינו על שלחני
    kjvRefs:
    - Nehemiah 5:17
    kjvOsis:
    - Neh.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.18
    scripture: tanakh
    name: Tanakh Nehemiah 5:18
    ref: Nehemiah 5:18
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 21140
    text: Now that which was prepared for one day was one ox and six choice sheep, also fowls were prepared for me; and once in ten days store of all sorts of wine; yet for all this I demanded not the bread of the governor, because the service was heavy upon this people.
    translation: JPS 1917
    original: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד שׁוֹר אֶחָד צֹאן שֵׁשׁ־בְּרֻרוֹת וְצִפֳּרִים נַעֲשׂוּ־לִי וּבֵין עֲשֶׂרֶת יָמִים בְּכָל־יַיִן לְהַרְבֵּה וְעִם־זֶה לֶחֶם הַפֶּחָה לֹא בִקַּשְׁתִּי כִּי־כָבְדָה הָעֲבֹדָה עַל־הָעָם הַזֶּה׃
    hebrewPlain: ואשר היה נעשה ליום אחד שור אחד צאן שש בררות וצפרים נעשו לי ובין עשרת ימים בכל יין להרבה ועם זה לחם הפחה לא בקשתי כי כבדה העבדה על העם הזה
    kjvRefs:
    - Nehemiah 5:18
    kjvOsis:
    - Neh.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.5.19
    scripture: tanakh
    name: Tanakh Nehemiah 5:19
    ref: Nehemiah 5:19
    book: Neh
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 21141
    text: Remember unto me, O my God, for good, all that I have done for this people.
    translation: JPS 1917
    original: זָכְרָה־לִּי אֱלֹהַי לְטוֹבָה כֹּל אֲשֶׁר־עָשִׂיתִי עַל־הָעָם הַזֶּה׃
    hebrewPlain: זכרה לי אלהי לטובה כל אשר עשיתי על העם הזה
    kjvRefs:
    - Nehemiah 5:19
    kjvOsis:
    - Neh.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.5
- type: TanakhVerse
  data:
    osis: Neh.6.1
    scripture: tanakh
    name: Tanakh Nehemiah 6:1
    ref: Nehemiah 6:1
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 21142
    text: Now it came to pass, when it was reported to Sanballat and Tobiah, and to Geshem the Arabian, and unto the rest of our enemies, that I had builded the wall, and that there was no breach left therein—though even unto that time I had not set up the doors in the gates—
    translation: JPS 1917
    original: וַיְהִי כַאֲשֶׁר נִשְׁמַע לְסַנְבַלַּט וְטוֹבִיָּה וּלְגֶשֶׁם הָעַרְבִי וּלְיֶתֶר אֹיְבֵינוּ כִּי בָנִיתִי אֶת־הַחוֹמָה וְלֹא־נוֹתַר בָּהּ פָּרֶץ גַּם עַד־הָעֵת הַהִיא דְּלָתוֹת לֹא־הֶעֱמַדְתִּי בַשְּׁעָרִים׃
    hebrewPlain: ויהי כאשר נשמע לסנבלט וטוביה ולגשם הערבי וליתר איבינו כי בניתי את החומה ולא נותר בה פרץ גם עד העת ההיא דלתות לא העמדתי בשערים
    kjvRefs:
    - Nehemiah 6:1
    kjvOsis:
    - Neh.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.2
    scripture: tanakh
    name: Tanakh Nehemiah 6:2
    ref: Nehemiah 6:2
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 21143
    text: 'that Sanballat and Geshem sent unto me, saying: ‘Come, let us meet together in one of the villages in the plain of Ono.’ But they thought to do me mischief.'
    translation: JPS 1917
    original: וַיִּשְׁלַח סַנְבַלַּט וְגֶשֶׁם אֵלַי לֵאמֹר לְכָה וְנִוָּעֲדָה יַחְדָּו בַּכְּפִירִים בְּבִקְעַת אוֹנוֹ וְהֵמָּה חֹשְׁבִים לַעֲשׂוֹת לִי רָעָה׃
    hebrewPlain: וישלח סנבלט וגשם אלי לאמר לכה ונועדה יחדו בכפירים בבקעת אונו והמה חשבים לעשות לי רעה
    kjvRefs:
    - Nehemiah 6:2
    kjvOsis:
    - Neh.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.3
    scripture: tanakh
    name: Tanakh Nehemiah 6:3
    ref: Nehemiah 6:3
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 21144
    text: 'And I sent messengers unto them, saying: ‘I am doing a great work, so that I cannot come down; why should the work cease, whilst I leave it, and come down to you?’'
    translation: JPS 1917
    original: וָאֶשְׁלְחָה עֲלֵיהֶם מַלְאָכִים לֵאמֹר מְלָאכָה גְדוֹלָה אֲנִי עֹשֶׂה וְלֹא אוּכַל לָרֶדֶת לָמָּה תִשְׁבַּת הַמְּלָאכָה כַּאֲשֶׁר אַרְפֶּהָ וְיָרַדְתִּי אֲלֵיכֶם׃
    hebrewPlain: ואשלחה עליהם מלאכים לאמר מלאכה גדולה אני עשה ולא אוכל לרדת למה תשבת המלאכה כאשר ארפה וירדתי אליכם
    kjvRefs:
    - Nehemiah 6:3
    kjvOsis:
    - Neh.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.4
    scripture: tanakh
    name: Tanakh Nehemiah 6:4
    ref: Nehemiah 6:4
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 21145
    text: And they sent unto me four times after this sort; and I answered them after the same manner.
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ אֵלַי כַּדָּבָר הַזֶּה אַרְבַּע פְּעָמִים וָאָשִׁיב אוֹתָם כַּדָּבָר הַזֶּה׃
    hebrewPlain: וישלחו אלי כדבר הזה ארבע פעמים ואשיב אותם כדבר הזה
    kjvRefs:
    - Nehemiah 6:4
    kjvOsis:
    - Neh.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.5
    scripture: tanakh
    name: Tanakh Nehemiah 6:5
    ref: Nehemiah 6:5
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 21146
    text: Then sent Sanballat his servant unto me in like manner the fifth time with an open letter in his hand;
    translation: JPS 1917
    original: וַיִּשְׁלַח אֵלַי סַנְבַלַּט כַּדָּבָר הַזֶּה פַּעַם חֲמִישִׁית אֶת־נַעֲרוֹ וְאִגֶּרֶת פְּתוּחָה בְּיָדוֹ׃
    hebrewPlain: וישלח אלי סנבלט כדבר הזה פעם חמישית את נערו ואגרת פתוחה בידו
    kjvRefs:
    - Nehemiah 6:5
    kjvOsis:
    - Neh.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.6
    scripture: tanakh
    name: Tanakh Nehemiah 6:6
    ref: Nehemiah 6:6
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 21147
    text: 'wherein was written: ‘It is reported among the nations, and Geshem saith it, that thou and the Jews think to rebel; for which cause thou buildest the wall; and thou wouldest be their king, even according to these words.'
    translation: JPS 1917
    original: כָּתוּב בָּהּ בַּגּוֹיִם נִשְׁמָע וְגַשְׁמוּ אֹמֵר אַתָּה וְהַיְּהוּדִים חֹשְׁבִים לִמְרוֹד עַל־כֵּן אַתָּה בוֹנֶה הַחוֹמָה וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ כַּדְּבָרִים הָאֵלֶּה׃
    hebrewPlain: כתוב בה בגוים נשמע וגשמו אמר אתה והיהודים חשבים למרוד על כן אתה בונה החומה ואתה הוה להם למלך כדברים האלה
    kjvRefs:
    - Nehemiah 6:6
    kjvOsis:
    - Neh.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.7
    scripture: tanakh
    name: Tanakh Nehemiah 6:7
    ref: Nehemiah 6:7
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 21148
    text: 'And thou hast also appointed prophets to proclaim of thee at Jerusalem, saying: There is a king in Judah; and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together.'''
    translation: JPS 1917
    original: וְגַם־נְבִיאִים הֶעֱמַדְתָּ לִקְרֹא עָלֶיךָ בִירוּשָׁלִַם לֵאמֹר מֶלֶךְ בִּיהוּדָה וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה וְעַתָּה לְכָה וְנִוָּעֲצָה יַחְדָּו׃
    hebrewPlain: וגם נביאים העמדת לקרא עליך בירושלם לאמר מלך ביהודה ועתה ישמע למלך כדברים האלה ועתה לכה ונועצה יחדו
    kjvRefs:
    - Nehemiah 6:7
    kjvOsis:
    - Neh.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.8
    scripture: tanakh
    name: Tanakh Nehemiah 6:8
    ref: Nehemiah 6:8
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 21149
    text: 'Then I sent unto him, saying: ‘There are no such things done as thou sayest, but thou feignest them out of thine own heart.’'
    translation: JPS 1917
    original: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה אֲשֶׁר אַתָּה אוֹמֵר כִּי מִלִּבְּךָ אַתָּה בוֹדָאם׃
    hebrewPlain: ואשלחה אליו לאמר לא נהיה כדברים האלה אשר אתה אומר כי מלבך אתה בודאם
    kjvRefs:
    - Nehemiah 6:8
    kjvOsis:
    - Neh.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.9
    scripture: tanakh
    name: Tanakh Nehemiah 6:9
    ref: Nehemiah 6:9
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 21150
    text: 'For they all would have us afraid, saying: ‘Their hands shall be weakened from the work, that it be not done.’ But now, strengthen Thou my hands.'
    translation: JPS 1917
    original: כִּי כֻלָּם מְיָרְאִים אוֹתָנוּ לֵאמֹר יִרְפּוּ יְדֵיהֶם מִן־הַמְּלָאכָה וְלֹא תֵעָשֶׂה וְעַתָּה חַזֵּק אֶת־יָדָי׃
    hebrewPlain: כי כלם מיראים אותנו לאמר ירפו ידיהם מן המלאכה ולא תעשה ועתה חזק את ידי
    kjvRefs:
    - Nehemiah 6:9
    kjvOsis:
    - Neh.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.10
    scripture: tanakh
    name: Tanakh Nehemiah 6:10
    ref: Nehemiah 6:10
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 21151
    text: 'And as for me, I went unto the house of Shemaiah the son of Delaiah the son of Mehetabel, who was shut up; and he said: ‘Let us meet together in the house of God, within the temple, and let us shut the doors of the temple; for they will come to slay thee; yea, in the night will they come to slay thee.’'
    translation: JPS 1917
    original: וַאֲנִי־בָאתִי בֵּית שְׁמַעְיָה בֶן־דְּלָיָה בֶּן־מְהֵיטַבְאֵל וְהוּא עָצוּר וַיֹּאמֶר נִוָּעֵד אֶל־בֵּית הָאֱלֹהִים אֶל־תּוֹךְ הַהֵיכָל וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל כִּי בָּאִים לְהָרְגֶךָ וְלַיְלָה בָּאִים לְהָרְגֶךָ׃
    hebrewPlain: ואני באתי בית שמעיה בן דליה בן מהיטבאל והוא עצור ויאמר נועד אל בית האלהים אל תוך ההיכל ונסגרה דלתות ההיכל כי באים להרגך ולילה באים להרגך
    kjvRefs:
    - Nehemiah 6:10
    kjvOsis:
    - Neh.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.11
    scripture: tanakh
    name: Tanakh Nehemiah 6:11
    ref: Nehemiah 6:11
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 21152
    text: 'And I said: ‘Should such a man as I flee? and who is there, that, being such as I, could go into the temple and live? I will not go in.’'
    translation: JPS 1917
    original: וָאֹמְרָה הַאִישׁ כָּמוֹנִי יִבְרָח וּמִי כָמוֹנִי אֲשֶׁר־יָבוֹא אֶל־הַהֵיכָל וָחָי לֹא אָבוֹא׃
    hebrewPlain: ואמרה האיש כמוני יברח ומי כמוני אשר יבוא אל ההיכל וחי לא אבוא
    kjvRefs:
    - Nehemiah 6:11
    kjvOsis:
    - Neh.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.12
    scripture: tanakh
    name: Tanakh Nehemiah 6:12
    ref: Nehemiah 6:12
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 21153
    text: And I discerned, and, lo, God had not sent him; for he pronounced this prophecy against me, whereas Tobiah and Sanballat had hired him.
    translation: JPS 1917
    original: וָאַכִּירָה וְהִנֵּה לֹא־אֱלֹהִים שְׁלָחוֹ כִּי הַנְּבוּאָה דִּבֶּר עָלַי וְטוֹבִיָּה וְסַנְבַלַּט שְׂכָרוֹ׃
    hebrewPlain: ואכירה והנה לא אלהים שלחו כי הנבואה דבר עלי וטוביה וסנבלט שכרו
    kjvRefs:
    - Nehemiah 6:12
    kjvOsis:
    - Neh.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.13
    scripture: tanakh
    name: Tanakh Nehemiah 6:13
    ref: Nehemiah 6:13
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 21154
    text: For this cause was he hired, that I should be afraid, and do so, and sin, and that they might have matter for an evil report, that they might taunt me.
    translation: JPS 1917
    original: לְמַעַן שָׂכוּר הוּא לְמַעַן־אִירָא וְאֶעֱשֶׂה־כֵּן וְחָטָאתִי וְהָיָה לָהֶם לְשֵׁם רָע לְמַעַן יְחָרְפוּנִי׃
    hebrewPlain: למען שכור הוא למען אירא ואעשה כן וחטאתי והיה להם לשם רע למען יחרפוני
    kjvRefs:
    - Nehemiah 6:13
    kjvOsis:
    - Neh.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.14
    scripture: tanakh
    name: Tanakh Nehemiah 6:14
    ref: Nehemiah 6:14
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 21155
    text: Remember, O my God, Tobiah and Sanballat according to these their works, and also the prophetess Noadiah, and the rest of the prophets, that would have me put in fear.
    translation: JPS 1917
    original: זָכְרָה אֱלֹהַי לְטוֹבִיָּה וּלְסַנְבַלַּט כְּמַעֲשָׂיו אֵלֶּה וְגַם לְנוֹעַדְיָה הַנְּבִיאָה וּלְיֶתֶר הַנְּבִיאִים אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי׃
    hebrewPlain: זכרה אלהי לטוביה ולסנבלט כמעשיו אלה וגם לנועדיה הנביאה וליתר הנביאים אשר היו מיראים אותי
    kjvRefs:
    - Nehemiah 6:14
    kjvOsis:
    - Neh.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.15
    scripture: tanakh
    name: Tanakh Nehemiah 6:15
    ref: Nehemiah 6:15
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 21156
    text: So the wall was finished in the twenty and fifth day of the month Elul, in fifty and two days.
    translation: JPS 1917
    original: וַתִּשְׁלַם הַחוֹמָה בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל לַחֲמִשִּׁים וּשְׁנַיִם יוֹם׃
    hebrewPlain: ותשלם החומה בעשרים וחמשה לאלול לחמשים ושנים יום
    kjvRefs:
    - Nehemiah 6:15
    kjvOsis:
    - Neh.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.16
    scripture: tanakh
    name: Tanakh Nehemiah 6:16
    ref: Nehemiah 6:16
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 21157
    text: And it came to pass, when all our enemies heard thereof, that all the nations that were about us feared, and were much cast down in their own eyes; for they perceived that this work was wrought of our God.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר שָׁמְעוּ כָּל־אוֹיְבֵינוּ וַיִּרְאוּ כָּל־הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם וַיֵּדְעוּ כִּי מֵאֵת אֱלֹהֵינוּ נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת׃
    hebrewPlain: ויהי כאשר שמעו כל אויבינו ויראו כל הגוים אשר סביבתינו ויפלו מאד בעיניהם וידעו כי מאת אלהינו נעשתה המלאכה הזאת
    kjvRefs:
    - Nehemiah 6:16
    kjvOsis:
    - Neh.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.17
    scripture: tanakh
    name: Tanakh Nehemiah 6:17
    ref: Nehemiah 6:17
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 21158
    text: Moreover in those days the nobles of Judah sent many letters unto Tobiah, and the letters of Tobiah came unto them.
    translation: JPS 1917
    original: גַּם בַּיָּמִים הָהֵם מַרְבִּים חֹרֵי יְהוּדָה אִגְּרֹתֵיהֶם הוֹלְכוֹת עַל־טוֹבִיָּה וַאֲשֶׁר לְטוֹבִיָּה בָּאוֹת אֲלֵיהֶם׃
    hebrewPlain: גם בימים ההם מרבים חרי יהודה אגרתיהם הולכות על טוביה ואשר לטוביה באות אליהם
    kjvRefs:
    - Nehemiah 6:17
    kjvOsis:
    - Neh.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.18
    scripture: tanakh
    name: Tanakh Nehemiah 6:18
    ref: Nehemiah 6:18
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 21159
    text: For there were many in Judah sworn unto him, because he was the son-in-law of Shecaniah the son of Arah; and his son Jehohanan had taken the daughter of Meshullam the son of Berechiah to wife.
    translation: JPS 1917
    original: כִּי־רַבִּים בִּיהוּדָה בַּעֲלֵי שְׁבוּעָה לוֹ כִּי־חָתָן הוּא לִשְׁכַנְיָה בֶן־אָרַח וִיהוֹחָנָן בְּנוֹ לָקַח אֶת־בַּת־מְשֻׁלָּם בֶּן בֶּרֶכְיָה׃
    hebrewPlain: כי רבים ביהודה בעלי שבועה לו כי חתן הוא לשכניה בן ארח ויהוחנן בנו לקח את בת משלם בן ברכיה
    kjvRefs:
    - Nehemiah 6:18
    kjvOsis:
    - Neh.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.6.19
    scripture: tanakh
    name: Tanakh Nehemiah 6:19
    ref: Nehemiah 6:19
    book: Neh
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 21160
    text: Also they spoke of his good deeds before me, and reported my words to him. And Tobiah sent letters to put me in fear.
    translation: JPS 1917
    original: גַּם טוֹבֹתָיו הָיוּ אֹמְרִים לְפָנַי וּדְבָרַי הָיוּ מוֹצִיאִים לוֹ אִגְּרוֹת שָׁלַח טוֹבִיָּה לְיָרְאֵנִי׃
    hebrewPlain: גם טובתיו היו אמרים לפני ודברי היו מוציאים לו אגרות שלח טוביה ליראני
    kjvRefs:
    - Nehemiah 6:19
    kjvOsis:
    - Neh.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.6
- type: TanakhVerse
  data:
    osis: Neh.7.1
    scripture: tanakh
    name: Tanakh Nehemiah 7:1
    ref: Nehemiah 7:1
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 21161
    text: Now it came to pass, when the wall was built, and I had set up the doors, and the porters and the singers and the Levites were appointed,
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר נִבְנְתָה הַחוֹמָה וָאַעֲמִיד הַדְּלָתוֹת וַיִּפָּקְדוּ הַשּׁוֹעֲרִים וְהַמְשֹׁרְרִים וְהַלְוִיִּם׃
    hebrewPlain: ויהי כאשר נבנתה החומה ואעמיד הדלתות ויפקדו השוערים והמשררים והלוים
    kjvRefs:
    - Nehemiah 7:1
    kjvOsis:
    - Neh.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.2
    scripture: tanakh
    name: Tanakh Nehemiah 7:2
    ref: Nehemiah 7:2
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 21162
    text: that I gave my brother Hanani, and Hananiah the governor of the castle, charge over Jerusalem; for he was a faithful man, and feared God above many.
    translation: JPS 1917
    original: וָאֲצַוֶּה אֶת־חֲנָנִי אָחִי וְאֶת־חֲנַנְיָה שַׂר הַבִּירָה עַל־יְרוּשָׁלִָם כִּי־הוּא כְּאִישׁ אֱמֶת וְיָרֵא אֶת־הָאֱלֹהִים מֵרַבִּים׃
    hebrewPlain: ואצוה את חנני אחי ואת חנניה שר הבירה על ירושלם כי הוא כאיש אמת וירא את האלהים מרבים
    kjvRefs:
    - Nehemiah 7:2
    kjvOsis:
    - Neh.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.3
    scripture: tanakh
    name: Tanakh Nehemiah 7:3
    ref: Nehemiah 7:3
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 21163
    text: 'And I said unto them: ‘Let not the gates of Jerusalem be opened until the sun be hot; and while they stand on guard, let them shut the doors, and bar ye them; and let watches be appointed of the inhabitants of Jerusalem, every one in his watch, and every one to be over against his house.’'
    translation: JPS 1917
    original: ויאמר [וָאֹמַר] לָהֶם לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם עַד־חֹם הַשֶּׁמֶשׁ וְעַד הֵם עֹמְדִים יָגִיפוּ הַדְּלָתוֹת וֶאֱחֹזוּ וְהַעֲמֵיד מִשְׁמְרוֹת יֹשְׁבֵי יְרוּשָׁלִַם אִישׁ בְּמִשְׁמָרוֹ וְאִישׁ נֶגֶד בֵּיתוֹ׃
    hebrewPlain: ויאמר [ואמר] להם לא יפתחו שערי ירושלם עד חם השמש ועד הם עמדים יגיפו הדלתות ואחזו והעמיד משמרות ישבי ירושלם איש במשמרו ואיש נגד ביתו
    kjvRefs:
    - Nehemiah 7:3
    kjvOsis:
    - Neh.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.4
    scripture: tanakh
    name: Tanakh Nehemiah 7:4
    ref: Nehemiah 7:4
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 21164
    text: Now the city was wide and large; but the people were few therein, and the houses were not builded.
    translation: JPS 1917
    original: וְהָעִיר רַחֲבַת יָדַיִם וּגְדוֹלָה וְהָעָם מְעַט בְּתוֹכָהּ וְאֵין בָּתִּים בְּנוּיִם׃
    hebrewPlain: והעיר רחבת ידים וגדולה והעם מעט בתוכה ואין בתים בנוים
    kjvRefs:
    - Nehemiah 7:4
    kjvOsis:
    - Neh.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.5
    scripture: tanakh
    name: Tanakh Nehemiah 7:5
    ref: Nehemiah 7:5
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 21165
    text: 'And my God put into my heart to gather together the nobles, and the rulers, and the people, that they might be reckoned by genealogy. And I found the book of the genealogy of them that came up at the first, and I found written therein:'
    translation: JPS 1917
    original: וַיִּתֵּן אֱלֹהַי אֶל־לִבִּי וָאֶקְבְּצָה אֶת־הַחֹרִים וְאֶת־הַסְּגָנִים וְאֶת־הָעָם לְהִתְיַחֵשׂ וָאֶמְצָא סֵפֶר הַיַּחַשׂ הָעוֹלִים בָּרִאשׁוֹנָה וָאֶמְצָא כָּתוּב בּוֹ׃
    hebrewPlain: ויתן אלהי אל לבי ואקבצה את החרים ואת הסגנים ואת העם להתיחש ואמצא ספר היחש העולים בראשונה ואמצא כתוב בו
    kjvRefs:
    - Nehemiah 7:5
    kjvOsis:
    - Neh.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.6
    scripture: tanakh
    name: Tanakh Nehemiah 7:6
    ref: Nehemiah 7:6
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 21166
    text: These are the children of the province, that went up out of the captivity of those that had been carried away, whom Nebuchadnezzar the king of Babylon had carried away, and that returned unto Jerusalem and to Judah, every one unto his city;
    translation: JPS 1917
    original: אֵלֶּה בְּנֵי הַמְּדִינָה הָעֹלִים מִשְּׁבִי הַגּוֹלָה אֲשֶׁר הֶגְלָה נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל וַיָּשׁוּבוּ לִירוּשָׁלִַם וְלִיהוּדָה אִישׁ לְעִירוֹ׃
    hebrewPlain: אלה בני המדינה העלים משבי הגולה אשר הגלה נבוכדנצר מלך בבל וישובו לירושלם וליהודה איש לעירו
    kjvRefs:
    - Nehemiah 7:6
    kjvOsis:
    - Neh.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.7
- type: TanakhVerse
  data:
    osis: Neh.7.7
