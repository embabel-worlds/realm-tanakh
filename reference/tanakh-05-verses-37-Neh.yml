    name: Tanakh Nehemiah 7:67
    ref: Nehemiah 7:67
    book: Neh
    section: ketuvim
    chapter: 7
    verse: 67
    ordinal: 21227
    text: beside their men-servants and their maid-servants, of whom there were seven thousand three hundred thirty and seven; and they had two hundred forty and five singing men and singing women.
    translation: JPS 1917
    original: מִלְּבַד עַבְדֵיהֶם וְאַמְהֹתֵיהֶם אֵלֶּה שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה וְלָהֶם מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה׃
    hebrewPlain: מלבד עבדיהם ואמהתיהם אלה שבעת אלפים שלש מאות שלשים ושבעה ולהם משררים ומשררות מאתים וארבעים וחמשה
    kjvRefs:
