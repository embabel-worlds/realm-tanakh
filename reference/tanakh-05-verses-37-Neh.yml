- type: TanakhVerse
  data:
    osis: Neh.1.7
    scripture: tanakh
    name: Tanakh Nehemiah 1:7
    ref: Nehemiah 1:7
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 21043
    text: We have dealt very corruptly against Thee, and have not kept the commandments, nor the statutes, nor the ordinances which Thou didst command Thy servant Moses.
    translation: JPS 1917
    original: חֲבֹל חָבַלְנוּ לָךְ וְלֹא־שָׁמַרְנוּ אֶת־הַמִּצְוֺת וְאֶת־הַחֻקִּים וְאֶת־הַמִּשְׁפָּטִים אֲשֶׁר צִוִּיתָ אֶת־מֹשֶׁה עַבְדֶּךָ׃
    hebrewPlain: חבל חבלנו לך ולא שמרנו את המצות ואת החקים ואת המשפטים אשר צוית את משה עבדך
    kjvRefs:
    - Nehemiah 1:7
    kjvOsis:
    - Neh.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.1
- type: TanakhVerse
  data:
    osis: Neh.1.8
    scripture: tanakh
    name: Tanakh Nehemiah 1:8
    ref: Nehemiah 1:8
    book: Neh
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 21044
    text: 'Remember, I beseech Thee, the word that Thou didst command Thy servant Moses, saying: If ye deal treacherously, I will scatter you abroad among the peoples;'
    translation: JPS 1917
    original: זְכָר־נָא אֶת־הַדָּבָר אֲשֶׁר צִוִּיתָ אֶת־מֹשֶׁה עַבְדְּךָ לֵאמֹר אַתֶּם תִּמְעָלוּ אֲנִי אָפִיץ אֶתְכֶם בָּעַמִּים׃
    hebrewPlain: זכר נא את הדבר אשר צוית את משה עבדך לאמר אתם תמעלו אני אפיץ אתכם בעמים
    kjvRefs:
    - Nehemiah 1:8
    kjvOsis:
    - Neh.1.8
