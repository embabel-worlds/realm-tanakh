- type: TanakhVerse
  data:
    osis: Neh.9.1
    scripture: tanakh
    name: Tanakh Nehemiah 9:1
    ref: Nehemiah 9:1
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 21251
    text: Now in the twenty and fourth day of this month the children of Israel were assembled with fasting, and with sackcloth, and earth upon them.
    translation: JPS 1917
    original: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה נֶאֶסְפוּ בְנֵי־יִשְׂרָאֵל בְּצוֹם וּבְשַׂקִּים וַאֲדָמָה עֲלֵיהֶם׃
    hebrewPlain: וביום עשרים וארבעה לחדש הזה נאספו בני ישראל בצום ובשקים ואדמה עליהם
    kjvRefs:
    - Nehemiah 9:1
    kjvOsis:
    - Neh.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.2
    scripture: tanakh
    name: Tanakh Nehemiah 9:2
    ref: Nehemiah 9:2
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 21252
    text: And the seed of Israel separated themselves from all foreigners, and stood and confessed their sins, and the iniquities of their fathers.
    translation: JPS 1917
    original: וַיִּבָּדְלוּ זֶרַע יִשְׂרָאֵל מִכֹּל בְּנֵי נֵכָר וַיַּעַמְדוּ וַיִּתְוַדּוּ עַל־חַטֹּאתֵיהֶם וַעֲוֺנוֹת אֲבֹתֵיהֶם׃
    hebrewPlain: ויבדלו זרע ישראל מכל בני נכר ויעמדו ויתודו על חטאתיהם ועונות אבתיהם
    kjvRefs:
    - Nehemiah 9:2
    kjvOsis:
    - Neh.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.3
    scripture: tanakh
    name: Tanakh Nehemiah 9:3
    ref: Nehemiah 9:3
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 21253
    text: And they stood up in their place, and read in the book of the Law of the LORD their God a fourth part of the day; and another fourth part they confessed, and prostrated themselves before the LORD their God.
    translation: JPS 1917
    original: וַיָּקוּמוּ עַל־עָמְדָם וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת יְהוָה אֱלֹהֵיהֶם רְבִעִית הַיּוֹם וּרְבִעִית מִתְוַדִּים וּמִשְׁתַּחֲוִים לַיהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: ויקומו על עמדם ויקראו בספר תורת יהוה אלהיהם רבעית היום ורבעית מתודים ומשתחוים ליהוה אלהיהם
    kjvRefs:
    - Nehemiah 9:3
    kjvOsis:
    - Neh.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.4
    scripture: tanakh
    name: Tanakh Nehemiah 9:4
    ref: Nehemiah 9:4
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 21254
    text: Then stood up upon the platform of the Levites, Jeshua, and Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Chenani, and cried with a loud voice unto the LORD their God.
    translation: JPS 1917
    original: וַיָּקָם עַל־מַעֲלֵה הַלְוִיִּם יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי וַיִּזְעֲקוּ בְּקוֹל גָּדוֹל אֶל־יְהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: ויקם על מעלה הלוים ישוע ובני קדמיאל שבניה בני שרביה בני כנני ויזעקו בקול גדול אל יהוה אלהיהם
    kjvRefs:
    - Nehemiah 9:4
    kjvOsis:
    - Neh.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.5
    scripture: tanakh
    name: Tanakh Nehemiah 9:5
    ref: Nehemiah 9:5
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 21255
    text: 'Then the Levites, Jeshua, and Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah, said: ‘Stand up and bless the LORD your God from everlasting to everlasting; and let them say: Blessed be Thy glorious Name, that is exalted above all blessing and praise.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הַלְוִיִּם יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה קוּמוּ בָּרֲכוּ אֶת־יְהוָה אֱלֹהֵיכֶם מִן־הָעוֹלָם עַד־הָעוֹלָם וִיבָרְכוּ שֵׁם כְּבוֹדֶךָ וּמְרוֹמַם עַל־כָּל־בְּרָכָה וּתְהִלָּה׃
    hebrewPlain: ויאמרו הלוים ישוע וקדמיאל בני חשבניה שרביה הודיה שבניה פתחיה קומו ברכו את יהוה אלהיכם מן העולם עד העולם ויברכו שם כבודך ומרומם על כל ברכה ותהלה
    kjvRefs:
    - Nehemiah 9:5
    kjvOsis:
    - Neh.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.6
    scripture: tanakh
    name: Tanakh Nehemiah 9:6
    ref: Nehemiah 9:6
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 21256
    text: Thou art the LORD, even Thou alone; Thou hast made heaven, the heaven of heavens, with all their host, the earth and all things that are thereon, the seas and all that is in them, and Thou preservest them all; and the host of heaven worshippeth Thee.
    translation: JPS 1917
    original: אַתָּה־הוּא יְהוָה לְבַדֶּךָ את [אַתָּה] עָשִׂיתָ אֶת־הַשָּׁמַיִם שְׁמֵי הַשָּׁמַיִם וְכָל־צְבָאָם הָאָרֶץ וְכָל־אֲשֶׁר עָלֶיהָ הַיַּמִּים וְכָל־אֲשֶׁר בָּהֶם וְאַתָּה מְחַיֶּה אֶת־כֻּלָּם וּצְבָא הַשָּׁמַיִם לְךָ מִשְׁתַּחֲוִים׃
    hebrewPlain: אתה הוא יהוה לבדך את [אתה] עשית את השמים שמי השמים וכל צבאם הארץ וכל אשר עליה הימים וכל אשר בהם ואתה מחיה את כלם וצבא השמים לך משתחוים
    kjvRefs:
    - Nehemiah 9:6
    kjvOsis:
    - Neh.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.7
    scripture: tanakh
    name: Tanakh Nehemiah 9:7
    ref: Nehemiah 9:7
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 21257
    text: Thou art the LORD the God, who didst choose Abram, and broughtest him forth out of Ur of the Chaldees, and gavest him the name of Abraham;
    translation: JPS 1917
    original: אַתָּה־הוּא יְהוָה הָאֱלֹהִים אֲשֶׁר בָּחַרְתָּ בְּאַבְרָם וְהוֹצֵאתוֹ מֵאוּר כַּשְׂדִּים וְשַׂמְתָּ שְּׁמוֹ אַבְרָהָם׃
    hebrewPlain: אתה הוא יהוה האלהים אשר בחרת באברם והוצאתו מאור כשדים ושמת שמו אברהם
    kjvRefs:
    - Nehemiah 9:7
    kjvOsis:
    - Neh.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.8
    scripture: tanakh
    name: Tanakh Nehemiah 9:8
    ref: Nehemiah 9:8
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 21258
    text: and foundest his heart faithful before Thee, and madest a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, and the Perizzite, and the Jebusite, and the Girgashite, even to give it unto his seed, and hast performed Thy words; for Thou art righteous;
    translation: JPS 1917
    original: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ וְכָרוֹת עִמּוֹ הַבְּרִית לָתֵת אֶת־אֶרֶץ הַכְּנַעֲנִי הַחִתִּי הָאֱמֹרִי וְהַפְּרִזִּי וְהַיְבוּסִי וְהַגִּרְגָּשִׁי לָתֵת לְזַרְעוֹ וַתָּקֶם אֶת־דְּבָרֶיךָ כִּי צַדִּיק אָתָּה׃
    hebrewPlain: ומצאת את לבבו נאמן לפניך וכרות עמו הברית לתת את ארץ הכנעני החתי האמרי והפרזי והיבוסי והגרגשי לתת לזרעו ותקם את דבריך כי צדיק אתה
    kjvRefs:
    - Nehemiah 9:8
    kjvOsis:
    - Neh.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.9
    scripture: tanakh
    name: Tanakh Nehemiah 9:9
    ref: Nehemiah 9:9
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 21259
    text: And Thou sawest the affliction of our fathers in Egypt, and heardest their cry by the Red Sea;
    translation: JPS 1917
    original: וַתֵּרֶא אֶת־עֳנִי אֲבֹתֵינוּ בְּמִצְרָיִם וְאֶת־זַעֲקָתָם שָׁמַעְתָּ עַל־יַם־סוּף׃
    hebrewPlain: ותרא את עני אבתינו במצרים ואת זעקתם שמעת על ים סוף
    kjvRefs:
    - Nehemiah 9:9
    kjvOsis:
    - Neh.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.10
    scripture: tanakh
    name: Tanakh Nehemiah 9:10
    ref: Nehemiah 9:10
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 21260
    text: and didst show signs and wonders upon Pharaoh, and on all his servants, and on all the people of his land; for Thou knewest that they dealt proudly against them; and didst get Thee a name, as it is this day.
    translation: JPS 1917
    original: וַתִּתֵּן אֹתֹת וּמֹפְתִים בְּפַרְעֹה וּבְכָל־עֲבָדָיו וּבְכָל־עַם אַרְצוֹ כִּי יָדַעְתָּ כִּי הֵזִידוּ עֲלֵיהֶם וַתַּעַשׂ־לְךָ שֵׁם כְּהַיּוֹם הַזֶּה׃
    hebrewPlain: ותתן אתת ומפתים בפרעה ובכל עבדיו ובכל עם ארצו כי ידעת כי הזידו עליהם ותעש לך שם כהיום הזה
    kjvRefs:
    - Nehemiah 9:10
    kjvOsis:
    - Neh.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.11
    scripture: tanakh
    name: Tanakh Nehemiah 9:11
    ref: Nehemiah 9:11
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 21261
    text: And Thou didst divide the sea before them, so that they went through the midst of the sea on the dry land; and their pursuers Thou didst cast into the depths, as a stone into the mighty waters.
    translation: JPS 1917
    original: וְהַיָּם בָּקַעְתָּ לִפְנֵיהֶם וַיַּעַבְרוּ בְתוֹךְ־הַיָּם בַּיַּבָּשָׁה וְאֶת־רֹדְפֵיהֶם הִשְׁלַכְתָּ בִמְצוֹלֹת כְּמוֹ־אֶבֶן בְּמַיִם עַזִּים׃
    hebrewPlain: והים בקעת לפניהם ויעברו בתוך הים ביבשה ואת רדפיהם השלכת במצולת כמו אבן במים עזים
    kjvRefs:
    - Nehemiah 9:11
    kjvOsis:
    - Neh.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.12
    scripture: tanakh
    name: Tanakh Nehemiah 9:12
    ref: Nehemiah 9:12
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 21262
    text: Moreover in a pillar of cloud Thou didst lead them by day; and in a pillar of fire by night, to give them light in the way wherein they should go.
    translation: JPS 1917
    original: וּבְעַמּוּד עָנָן הִנְחִיתָם יוֹמָם וּבְעַמּוּד אֵשׁ לַיְלָה לְהָאִיר לָהֶם אֶת־הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ־בָהּ׃
    hebrewPlain: ובעמוד ענן הנחיתם יומם ובעמוד אש לילה להאיר להם את הדרך אשר ילכו בה
    kjvRefs:
    - Nehemiah 9:12
    kjvOsis:
    - Neh.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.13
    scripture: tanakh
    name: Tanakh Nehemiah 9:13
    ref: Nehemiah 9:13
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 21263
    text: Thou camest down also upon mount Sinai, and spokest with them from heaven, and gavest them right ordinances and laws of truth, good statutes and commandments;
    translation: JPS 1917
    original: וְעַל הַר־סִינַי יָרַדְתָּ וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם וַתִּתֵּן לָהֶם מִשְׁפָּטִים יְשָׁרִים וְתוֹרוֹת אֱמֶת חֻקִּים וּמִצְוֺת טוֹבִים׃
    hebrewPlain: ועל הר סיני ירדת ודבר עמהם משמים ותתן להם משפטים ישרים ותורות אמת חקים ומצות טובים
    kjvRefs:
    - Nehemiah 9:13
    kjvOsis:
    - Neh.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.14
    scripture: tanakh
    name: Tanakh Nehemiah 9:14
    ref: Nehemiah 9:14
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 21264
    text: and madest known unto them Thy holy sabbath, and didst command them commandments, and statutes, and a law, by the hand of Moses Thy servant;
    translation: JPS 1917
    original: וְאֶת־שַׁבַּת קָדְשְׁךָ הוֹדַעַתָ לָהֶם וּמִצְווֹת וְחֻקִּים וְתוֹרָה צִוִּיתָ לָהֶם בְּיַד מֹשֶׁה עַבְדֶּךָ׃
    hebrewPlain: ואת שבת קדשך הודעת להם ומצוות וחקים ותורה צוית להם ביד משה עבדך
    kjvRefs:
    - Nehemiah 9:14
    kjvOsis:
    - Neh.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.15
    scripture: tanakh
    name: Tanakh Nehemiah 9:15
    ref: Nehemiah 9:15
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 21265
    text: and gavest them bread from heaven for their hunger, and broughtest forth water for them out of the rock for their thirst, and didst command them that they should go in to possess the land which Thou hadst lifted up Thy hand to give them.
    translation: JPS 1917
    original: וְלֶחֶם מִשָּׁמַיִם נָתַתָּה לָהֶם לִרְעָבָם וּמַיִם מִסֶּלַע הוֹצֵאתָ לָהֶם לִצְמָאָם וַתֹּאמֶר לָהֶם לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ אֲשֶׁר־נָשָׂאתָ אֶת־יָדְךָ לָתֵת לָהֶם׃
    hebrewPlain: ולחם משמים נתתה להם לרעבם ומים מסלע הוצאת להם לצמאם ותאמר להם לבוא לרשת את הארץ אשר נשאת את ידך לתת להם
    kjvRefs:
    - Nehemiah 9:15
    kjvOsis:
    - Neh.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.16
    scripture: tanakh
    name: Tanakh Nehemiah 9:16
    ref: Nehemiah 9:16
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 21266
    text: But they and our fathers dealt proudly, and hardened their neck, and hearkened not to Thy commandments,
    translation: JPS 1917
    original: וְהֵם וַאֲבֹתֵינוּ הֵזִידוּ וַיַּקְשׁוּ אֶת־עָרְפָּם וְלֹא שָׁמְעוּ אֶל־מִצְוֺתֶיךָ׃
    hebrewPlain: והם ואבתינו הזידו ויקשו את ערפם ולא שמעו אל מצותיך
    kjvRefs:
    - Nehemiah 9:16
    kjvOsis:
    - Neh.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.17
    scripture: tanakh
    name: Tanakh Nehemiah 9:17
    ref: Nehemiah 9:17
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 21267
    text: and refused to hearken, neither were mindful of Thy wonders that Thou didst among them; but hardened their neck, and in their rebellion appointed a captain to return to their bondage; but Thou art a God ready to pardon, gracious and full of compassion, slow to anger, and plenteous in mercy, and forsookest them not.
    translation: JPS 1917
    original: וַיְמָאֲנוּ לִשְׁמֹעַ וְלֹא־זָכְרוּ נִפְלְאֹתֶיךָ אֲשֶׁר עָשִׂיתָ עִמָּהֶם וַיַּקְשׁוּ אֶת־עָרְפָּם וַיִּתְּנוּ־רֹאשׁ לָשׁוּב לְעַבְדֻתָם בְּמִרְיָם וְאַתָּה אֱלוֹהַּ סְלִיחוֹת חַנּוּן וְרַחוּם אֶרֶךְ־אַפַּיִם וְרַב־וחסד [חֶסֶד] וְלֹא עֲזַבְתָּם׃
    hebrewPlain: וימאנו לשמע ולא זכרו נפלאתיך אשר עשית עמהם ויקשו את ערפם ויתנו ראש לשוב לעבדתם במרים ואתה אלוה סליחות חנון ורחום ארך אפים ורב וחסד [חסד] ולא עזבתם
    kjvRefs:
    - Nehemiah 9:17
    kjvOsis:
    - Neh.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.18
    scripture: tanakh
    name: Tanakh Nehemiah 9:18
    ref: Nehemiah 9:18
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 21268
    text: 'Yea, when they had made them a molten calf, and said: ‘This is thy God that brought thee up out of Egypt, and had wrought great provocations;'
    translation: JPS 1917
    original: אַף כִּי־עָשׂוּ לָהֶם עֵגֶל מַסֵּכָה וַיֹּאמְרוּ זֶה אֱלֹהֶיךָ אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת׃
    hebrewPlain: אף כי עשו להם עגל מסכה ויאמרו זה אלהיך אשר העלך ממצרים ויעשו נאצות גדלות
    kjvRefs:
    - Nehemiah 9:18
    kjvOsis:
    - Neh.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.19
    scripture: tanakh
    name: Tanakh Nehemiah 9:19
    ref: Nehemiah 9:19
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 19
    ordinal: 21269
    text: yet Thou in Thy manifold mercies forsookest them not in the wilderness; the pillar of cloud departed not from over them by day, to lead them in the way; neither the pillar of fire by night, to show them light, and the way wherein they should go.
    translation: JPS 1917
    original: וְאַתָּה בְּרַחֲמֶיךָ הָרַבִּים לֹא עֲזַבְתָּם בַּמִּדְבָּר אֶת־עַמּוּד הֶעָנָן לֹא־סָר מֵעֲלֵיהֶם בְּיוֹמָם לְהַנְחֹתָם בְּהַדֶּרֶךְ וְאֶת־עַמּוּד הָאֵשׁ בְּלַיְלָה לְהָאִיר לָהֶם וְאֶת־הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ־בָהּ׃
    hebrewPlain: ואתה ברחמיך הרבים לא עזבתם במדבר את עמוד הענן לא סר מעליהם ביומם להנחתם בהדרך ואת עמוד האש בלילה להאיר להם ואת הדרך אשר ילכו בה
    kjvRefs:
    - Nehemiah 9:19
    kjvOsis:
    - Neh.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.20
    scripture: tanakh
    name: Tanakh Nehemiah 9:20
    ref: Nehemiah 9:20
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 20
    ordinal: 21270
    text: Thou gavest also Thy good spirit to instruct them, and withheldest not Thy manna from their mouth, and gavest them water for their thirst.
    translation: JPS 1917
    original: וְרוּחֲךָ הַטּוֹבָה נָתַתָּ לְהַשְׂכִּילָם וּמַנְךָ לֹא־מָנַעְתָּ מִפִּיהֶם וּמַיִם נָתַתָּה לָהֶם לִצְמָאָם׃
    hebrewPlain: ורוחך הטובה נתת להשכילם ומנך לא מנעת מפיהם ומים נתתה להם לצמאם
    kjvRefs:
    - Nehemiah 9:20
    kjvOsis:
    - Neh.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.21
    scripture: tanakh
    name: Tanakh Nehemiah 9:21
    ref: Nehemiah 9:21
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 21
    ordinal: 21271
    text: Yea, forty years didst Thou sustain them in the wilderness, and they lacked nothing; their clothes waxed not old, and their feet swelled not.
    translation: JPS 1917
    original: וְאַרְבָּעִים שָׁנָה כִּלְכַּלְתָּם בַּמִּדְבָּר לֹא חָסֵרוּ שַׂלְמֹתֵיהֶם לֹא בָלוּ וְרַגְלֵיהֶם לֹא בָצֵקוּ׃
    hebrewPlain: וארבעים שנה כלכלתם במדבר לא חסרו שלמתיהם לא בלו ורגליהם לא בצקו
    kjvRefs:
    - Nehemiah 9:21
    kjvOsis:
    - Neh.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.22
    scripture: tanakh
    name: Tanakh Nehemiah 9:22
    ref: Nehemiah 9:22
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 22
    ordinal: 21272
    text: Moreover Thou gavest them kingdoms and peoples, which Thou didst allot quarter by quarter; so they possessed the land of Sihon, even the land of the king of Heshbon, and the land of Og king of Bashan.
    translation: JPS 1917
    original: וַתִּתֵּן לָהֶם מַמְלָכוֹת וַעֲמָמִים וַתַּחְלְקֵם לְפֵאָה וַיִּירְשׁוּ אֶת־אֶרֶץ סִיחוֹן וְאֶת־אֶרֶץ מֶלֶךְ חֶשְׁבּוֹן וְאֶת־אֶרֶץ עוֹג מֶלֶךְ־הַבָּשָׁן׃
    hebrewPlain: ותתן להם ממלכות ועממים ותחלקם לפאה ויירשו את ארץ סיחון ואת ארץ מלך חשבון ואת ארץ עוג מלך הבשן
    kjvRefs:
    - Nehemiah 9:22
    kjvOsis:
    - Neh.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.23
    scripture: tanakh
    name: Tanakh Nehemiah 9:23
    ref: Nehemiah 9:23
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 23
    ordinal: 21273
    text: Their children also didst Thou multiply as the stars of heaven, and didst bring them into the land, concerning which Thou didst say to their fathers, that they should go in to possess it.
    translation: JPS 1917
    original: וּבְנֵיהֶם הִרְבִּיתָ כְּכֹכְבֵי הַשָּׁמָיִם וַתְּבִיאֵם אֶל־הָאָרֶץ אֲשֶׁר־אָמַרְתָּ לַאֲבֹתֵיהֶם לָבוֹא לָרָשֶׁת׃
    hebrewPlain: ובניהם הרבית כככבי השמים ותביאם אל הארץ אשר אמרת לאבתיהם לבוא לרשת
    kjvRefs:
    - Nehemiah 9:23
    kjvOsis:
    - Neh.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.24
    scripture: tanakh
    name: Tanakh Nehemiah 9:24
    ref: Nehemiah 9:24
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 24
    ordinal: 21274
    text: So the children went in and possessed the land, and Thou didst subdue before them the inhabitants of the land, the Canaanites, and gavest them into their hands, with their kings, and the peoples of the land, that they might do with them as they would.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַבָּנִים וַיִּירְשׁוּ אֶת־הָאָרֶץ וַתַּכְנַע לִפְנֵיהֶם אֶת־יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים וַתִּתְּנֵם בְּיָדָם וְאֶת־מַלְכֵיהֶם וְאֶת־עַמְמֵי הָאָרֶץ לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם׃
    hebrewPlain: ויבאו הבנים ויירשו את הארץ ותכנע לפניהם את ישבי הארץ הכנענים ותתנם בידם ואת מלכיהם ואת עממי הארץ לעשות בהם כרצונם
    kjvRefs:
    - Nehemiah 9:24
    kjvOsis:
    - Neh.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.25
    scripture: tanakh
    name: Tanakh Nehemiah 9:25
    ref: Nehemiah 9:25
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 25
    ordinal: 21275
    text: And they took fortified cities, and a fat land, and possessed houses full of all good things, cisterns hewn out, vineyards, and oliveyards, and fruit-trees in abundance; so they did eat, and were filled, and became fat, and luxuriated in Thy great goodness.
    translation: JPS 1917
    original: וַיִּלְכְּדוּ עָרִים בְּצֻרוֹת וַאֲדָמָה שְׁמֵנָה וַיִּירְשׁוּ בָּתִּים מְלֵאִים־כָּל־טוּב בֹּרוֹת חֲצוּבִים כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב וַיֹּאכְלוּ וַיִּשְׂבְּעוּ וַיַּשְׁמִינוּ וַיִּתְעַדְּנוּ בְּטוּבְךָ הַגָּדוֹל׃
    hebrewPlain: וילכדו ערים בצרות ואדמה שמנה ויירשו בתים מלאים כל טוב ברות חצובים כרמים וזיתים ועץ מאכל לרב ויאכלו וישבעו וישמינו ויתעדנו בטובך הגדול
    kjvRefs:
    - Nehemiah 9:25
    kjvOsis:
    - Neh.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.26
    scripture: tanakh
    name: Tanakh Nehemiah 9:26
    ref: Nehemiah 9:26
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 26
    ordinal: 21276
    text: Nevertheless they were disobedient, and rebelled against Thee, and cast Thy law behind their back, and slew Thy prophets that did forewarn them to turn them back unto Thee, and they wrought great provocations.
    translation: JPS 1917
    original: וַיַּמְרוּ וַיִּמְרְדוּ בָּךְ וַיַּשְׁלִכוּ אֶת־תּוֹרָתְךָ אַחֲרֵי גַוָּם וְאֶת־נְבִיאֶיךָ הָרָגוּ אֲשֶׁר־הֵעִידוּ בָם לַהֲשִׁיבָם אֵלֶיךָ וַיַּעֲשׂוּ נֶאָצוֹת גְּדוֹלֹת׃
    hebrewPlain: וימרו וימרדו בך וישלכו את תורתך אחרי גום ואת נביאיך הרגו אשר העידו בם להשיבם אליך ויעשו נאצות גדולת
    kjvRefs:
    - Nehemiah 9:26
    kjvOsis:
    - Neh.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.27
    scripture: tanakh
    name: Tanakh Nehemiah 9:27
    ref: Nehemiah 9:27
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 27
    ordinal: 21277
    text: Therefore Thou didst deliver them into the hand of their adversaries, who distressed them; and in the time of their trouble, when they cried unto Thee, Thou heardest from heaven; and according to Thy manifold mercies Thou gavest them saviours who might save them out of the hand of their adversaries.
    translation: JPS 1917
    original: וַתִּתְּנֵם בְּיַד צָרֵיהֶם וַיָּצֵרוּ לָהֶם וּבְעֵת צָרָתָם יִצְעֲקוּ אֵלֶיךָ וְאַתָּה מִשָּׁמַיִם תִּשְׁמָע וּכְרַחֲמֶיךָ הָרַבִּים תִּתֵּן לָהֶם מוֹשִׁיעִים וְיוֹשִׁיעוּם מִיַּד צָרֵיהֶם׃
    hebrewPlain: ותתנם ביד צריהם ויצרו להם ובעת צרתם יצעקו אליך ואתה משמים תשמע וכרחמיך הרבים תתן להם מושיעים ויושיעום מיד צריהם
    kjvRefs:
    - Nehemiah 9:27
    kjvOsis:
    - Neh.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.28
    scripture: tanakh
    name: Tanakh Nehemiah 9:28
    ref: Nehemiah 9:28
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 28
    ordinal: 21278
    text: But after they had rest, they did evil again before Thee; therefore didst Thou leave them in the hand of their enemies, so that they had the dominion over them; yet when they returned, and cried unto Thee, many times didst Thou hear from heaven, and deliver them according to Thy mercies;
    translation: JPS 1917
    original: וּכְנוֹחַ לָהֶם יָשׁוּבוּ לַעֲשׂוֹת רַע לְפָנֶיךָ וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם וַיִּרְדּוּ בָהֶם וַיָּשׁוּבוּ וַיִּזְעָקוּךָ וְאַתָּה מִשָּׁמַיִם תִּשְׁמַע וְתַצִּילֵם כְּרַחֲמֶיךָ רַבּוֹת עִתִּים׃
    hebrewPlain: וכנוח להם ישובו לעשות רע לפניך ותעזבם ביד איביהם וירדו בהם וישובו ויזעקוך ואתה משמים תשמע ותצילם כרחמיך רבות עתים
    kjvRefs:
    - Nehemiah 9:28
    kjvOsis:
    - Neh.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.29
    scripture: tanakh
    name: Tanakh Nehemiah 9:29
    ref: Nehemiah 9:29
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 29
    ordinal: 21279
    text: and didst forewarn them, that Thou mightest bring them back unto Thy law; yet they dealt proudly, and hearkened not unto Thy commandments, but sinned against Thine ordinances, which if a man do, he shall live by them, and presented a stubborn shoulder, and hardened their neck, and would not hear.
    translation: JPS 1917
    original: וַתָּעַד בָּהֶם לַהֲשִׁיבָם אֶל־תּוֹרָתֶךָ וְהֵמָּה הֵזִידוּ וְלֹא־שָׁמְעוּ לְמִצְוֺתֶיךָ וּבְמִשְׁפָּטֶיךָ חָטְאוּ־בָם אֲשֶׁר־יַעֲשֶׂה אָדָם וְחָיָה בָהֶם וַיִּתְּנוּ כָתֵף סוֹרֶרֶת וְעָרְפָּם הִקְשׁוּ וְלֹא שָׁמֵעוּ׃
    hebrewPlain: ותעד בהם להשיבם אל תורתך והמה הזידו ולא שמעו למצותיך ובמשפטיך חטאו בם אשר יעשה אדם וחיה בהם ויתנו כתף סוררת וערפם הקשו ולא שמעו
    kjvRefs:
    - Nehemiah 9:29
    kjvOsis:
    - Neh.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.30
    scripture: tanakh
    name: Tanakh Nehemiah 9:30
    ref: Nehemiah 9:30
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 30
    ordinal: 21280
    text: Yet many years didst Thou extend mercy unto them, and didst forewarn them by Thy spirit through Thy prophets; yet would they not give ear; therefore gavest Thou them into the hand of the peoples of the lands.
    translation: JPS 1917
    original: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת וַתָּעַד בָּם בְּרוּחֲךָ בְּיַד־נְבִיאֶיךָ וְלֹא הֶאֱזִינוּ וַתִּתְּנֵם בְּיַד עַמֵּי הָאֲרָצֹת׃
    hebrewPlain: ותמשך עליהם שנים רבות ותעד בם ברוחך ביד נביאיך ולא האזינו ותתנם ביד עמי הארצת
    kjvRefs:
    - Nehemiah 9:30
    kjvOsis:
    - Neh.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Neh.9
- type: TanakhVerse
  data:
    osis: Neh.9.31
    scripture: tanakh
    name: Tanakh Nehemiah 9:31
    ref: Nehemiah 9:31
    book: Neh
    section: ketuvim
    chapter: 9
    verse: 31
    ordinal: 21281
    text: Nevertheless in Thy manifold mercies Thou didst not utterly consume them, nor forsake them; for Thou art a gracious and merciful God.
    translation: JPS 1917
    original: וּבְרַחֲמֶיךָ הָרַבִּים לֹא־עֲשִׂיתָם כָּלָה וְלֹא עֲזַבְתָּם כִּי אֵל־חַנּוּן וְרַחוּם אָתָּה׃
    hebrewPlain: וברחמיך הרבים לא עשיתם כלה ולא עזבתם כי אל חנון ורחום אתה
    kjvRefs:
