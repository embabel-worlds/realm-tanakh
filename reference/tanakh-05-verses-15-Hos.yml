    to:
      type: TanakhChapter
      osis: Hos.1
- type: TanakhVerse
  data:
    osis: Hos.1.7
    scripture: tanakh
    name: Tanakh Hosea 1:7
    ref: Hosea 1:7
    book: Hos
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14099
    text: But I will have compassion upon the house of Judah, and will save them by the LORD their God, and will not save them by bow, nor by sword, nor by battle, nor by horses, nor by horsemen.’
    translation: JPS 1917
    original: וְאֶת־בֵּית יְהוּדָה אֲרַחֵם וְהוֹשַׁעְתִּים בַּיהוָה אֱלֹהֵיהֶם וְלֹא אוֹשִׁיעֵם בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה בְּסוּסִים וּבְפָרָשִׁים׃
    hebrewPlain: ואת בית יהודה ארחם והושעתים ביהוה אלהיהם ולא אושיעם בקשת ובחרב ובמלחמה בסוסים ובפרשים
    kjvRefs:
    - Hosea 1:7
    kjvOsis:
