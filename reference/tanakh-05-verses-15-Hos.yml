    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14100
    text: Now when she had weaned Lo-ruhamah, she conceived, and bore a son.
    translation: JPS 1917
    original: וַתִּגְמֹל אֶת־לֹא רֻחָמָה וַתַּהַר וַתֵּלֶד בֵּן׃
    hebrewPlain: ותגמל את לא רחמה ותהר ותלד בן
