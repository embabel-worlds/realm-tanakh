- type: TanakhVerse
  data:
    osis: Hos.13.6
    scripture: tanakh
    name: Tanakh Hosea 13:6
    ref: Hosea 13:6
    book: Hos
    section: neviim
    chapter: 13
    verse: 6
    ordinal: 14270
    text: When they were fed, they became full, They were filled, and their heart was exalted; Therefore have they forgotten Me.
    translation: JPS 1917
    original: כְּמַרְעִיתָם וַיִּשְׂבָּעוּ שָׂבְעוּ וַיָּרָם לִבָּם עַל־כֵּן שְׁכֵחוּנִי׃
    hebrewPlain: כמרעיתם וישבעו שבעו וירם לבם על כן שכחוני
    kjvRefs:
    - Hosea 13:6
    kjvOsis:
    - Hos.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.7
    scripture: tanakh
    name: Tanakh Hosea 13:7
    ref: Hosea 13:7
    book: Hos
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 14271
    text: Therefore am I become unto them as a lion; As a leopard will I watch by the way;
    translation: JPS 1917
    original: וָאֱהִי לָהֶם כְּמוֹ־שָׁחַל כְּנָמֵר עַל־דֶּרֶךְ אָשׁוּר׃
    hebrewPlain: ואהי להם כמו שחל כנמר על דרך אשור
    kjvRefs:
    - Hosea 13:7
    kjvOsis:
    - Hos.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.8
    scripture: tanakh
    name: Tanakh Hosea 13:8
    ref: Hosea 13:8
    book: Hos
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 14272
    text: I will meet them as a bear that is bereaved of her whelps, And will rend the enclosure of their heart; And there will I devour them like a lioness; The wild beast shall tear them.
    translation: JPS 1917
    original: אֶפְגְּשֵׁם כְּדֹב שַׁכּוּל וְאֶקְרַע סְגוֹר לִבָּם וְאֹכְלֵם שָׁם כְּלָבִיא חַיַּת הַשָּׂדֶה תְּבַקְּעֵם׃
    hebrewPlain: אפגשם כדב שכול ואקרע סגור לבם ואכלם שם כלביא חית השדה תבקעם
    kjvRefs:
    - Hosea 13:8
    kjvOsis:
    - Hos.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.9
    scripture: tanakh
    name: Tanakh Hosea 13:9
    ref: Hosea 13:9
    book: Hos
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 14273
    text: It is thy destruction, O Israel, That thou art against Me, against thy help.
    translation: JPS 1917
    original: שִׁחֶתְךָ יִשְׂרָאֵל כִּי־בִי בְעֶזְרֶךָ׃
    hebrewPlain: שחתך ישראל כי בי בעזרך
    kjvRefs:
    - Hosea 13:9
    kjvOsis:
    - Hos.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.10
    scripture: tanakh
    name: Tanakh Hosea 13:10
    ref: Hosea 13:10
    book: Hos
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 14274
    text: 'Ho, now, thy king, That he may save thee in all thy cities! And thy judges, of whom thou saidst: ‘Give me a king and princes! ’'
    translation: JPS 1917
    original: אֱהִי מַלְכְּךָ אֵפוֹא וְיוֹשִׁיעֲךָ בְּכָל־עָרֶיךָ וְשֹׁפְטֶיךָ אֲשֶׁר אָמַרְתָּ תְּנָה־לִּי מֶלֶךְ וְשָׂרִים׃
    hebrewPlain: אהי מלכך אפוא ויושיעך בכל עריך ושפטיך אשר אמרת תנה לי מלך ושרים
    kjvRefs:
    - Hosea 13:10
    kjvOsis:
    - Hos.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.11
    scripture: tanakh
    name: Tanakh Hosea 13:11
    ref: Hosea 13:11
    book: Hos
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 14275
    text: I give thee a king in Mine anger, And take him away in My wrath.
    translation: JPS 1917
    original: אֶתֶּן־לְךָ מֶלֶךְ בְּאַפִּי וְאֶקַּח בְּעֶבְרָתִי׃
    hebrewPlain: אתן לך מלך באפי ואקח בעברתי
    kjvRefs:
    - Hosea 13:11
    kjvOsis:
    - Hos.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.12
    scripture: tanakh
    name: Tanakh Hosea 13:12
    ref: Hosea 13:12
    book: Hos
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 14276
    text: The iniquity of Ephraim is bound up; His sin is laid up in store.
    translation: JPS 1917
    original: צָרוּר עֲוֺן אֶפְרָיִם צְפוּנָה חַטָּאתוֹ׃
    hebrewPlain: צרור עון אפרים צפונה חטאתו
    kjvRefs:
    - Hosea 13:12
    kjvOsis:
    - Hos.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.13
    scripture: tanakh
    name: Tanakh Hosea 13:13
    ref: Hosea 13:13
    book: Hos
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 14277
    text: The throes of a travailing woman shall come upon him; He is an unwise son; For it is time he should not tarry In the place of the breaking forth of children.
    translation: JPS 1917
    original: חֶבְלֵי יוֹלֵדָה יָבֹאוּ לוֹ הוּא־בֵן לֹא חָכָם כִּי־עֵת לֹא־יַעֲמֹד בְּמִשְׁבַּר בָּנִים׃
    hebrewPlain: חבלי יולדה יבאו לו הוא בן לא חכם כי עת לא יעמד במשבר בנים
    kjvRefs:
    - Hosea 13:13
    kjvOsis:
    - Hos.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.14
    scripture: tanakh
    name: Tanakh Hosea 13:14
    ref: Hosea 13:14
    book: Hos
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 14278
    text: Shall I ransom them from the power of the nether-world? Shall I redeem them from death? Ho, thy plagues, O death! Ho, thy destruction, O netherworld! Repentance be hid from Mine eyes!
    translation: JPS 1917
    original: מִיַּד שְׁאוֹל אֶפְדֵּם מִמָּוֶת אֶגְאָלֵם אֱהִי דְבָרֶיךָ מָוֶת אֱהִי קָטָבְךָ שְׁאוֹל נֹחַם יִסָּתֵר מֵעֵינָי׃
    hebrewPlain: מיד שאול אפדם ממות אגאלם אהי דבריך מות אהי קטבך שאול נחם יסתר מעיני
    kjvRefs:
    - Hosea 13:14
    kjvOsis:
    - Hos.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.15
    scripture: tanakh
    name: Tanakh Hosea 13:15
    ref: Hosea 13:15
    book: Hos
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 14279
    text: For though he be fruitful among the reed-plants, An east wind shall come, the wind of the LORD coming up from the wilderness, And his spring shall become dry, and his fountain shall be dried up; He shall spoil the treasure of all precious vessels.
    translation: JPS 1917
    original: כִּי הוּא בֵּן אַחִים יַפְרִיא יָבוֹא קָדִים רוּחַ יְהוָה מִמִּדְבָּר עֹלֶה וְיֵבוֹשׁ מְקוֹרוֹ וְיֶחֱרַב מַעְיָנוֹ הוּא יִשְׁסֶה אוֹצַר כָּל־כְּלִי חֶמְדָּה׃
    hebrewPlain: כי הוא בן אחים יפריא יבוא קדים רוח יהוה ממדבר עלה ויבוש מקורו ויחרב מעינו הוא ישסה אוצר כל כלי חמדה
    kjvRefs:
    - Hosea 13:15
    kjvOsis:
    - Hos.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.14.1
    scripture: tanakh
    name: Tanakh Hosea 14:1
    ref: Hosea 14:1
    book: Hos
    section: neviim
    chapter: 14
    verse: 1
    ordinal: 14280
    text: Samaria shall bear her guilt, For she hath rebelled against her God; They shall fall by the sword; Their infants shall be dashed in pieces, And their women with child shall be ripped up.
    translation: JPS 1917
    original: תֶּאְשַׁם שֹׁמְרוֹן כִּי מָרְתָה בֵּאלֹהֶיהָ בַּחֶרֶב יִפֹּלוּ עֹלְלֵיהֶם יְרֻטָּשׁוּ וְהָרִיּוֹתָיו יְבֻקָּעוּ׃
    hebrewPlain: תאשם שמרון כי מרתה באלהיה בחרב יפלו עלליהם ירטשו והריותיו יבקעו
    kjvRefs:
    - Hosea 13:16
    kjvOsis:
    - Hos.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.2
    scripture: tanakh
    name: Tanakh Hosea 14:2
    ref: Hosea 14:2
    book: Hos
    section: neviim
    chapter: 14
    verse: 2
    ordinal: 14281
    text: Return, O Israel, unto the LORD thy God; For thou hast stumbled in thine iniquity.
    translation: JPS 1917
    original: שׁוּבָה יִשְׂרָאֵל עַד יְהוָה אֱלֹהֶיךָ כִּי כָשַׁלְתָּ בַּעֲוֺנֶךָ׃
    hebrewPlain: שובה ישראל עד יהוה אלהיך כי כשלת בעונך
    kjvRefs:
    - Hosea 14:1
    kjvOsis:
    - Hos.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.3
    scripture: tanakh
    name: Tanakh Hosea 14:3
    ref: Hosea 14:3
    book: Hos
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 14282
    text: 'Take with you words, And return unto the LORD; Say unto Him: ‘Forgive all iniquity, And accept that which is good; So will we render for bullocks the offering of our lips.'
    translation: JPS 1917
    original: קְחוּ עִמָּכֶם דְּבָרִים וְשׁוּבוּ אֶל־יְהוָה אִמְרוּ אֵלָיו כָּל־תִּשָּׂא עָוֺן וְקַח־טוֹב וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ׃
    hebrewPlain: קחו עמכם דברים ושובו אל יהוה אמרו אליו כל תשא עון וקח טוב ונשלמה פרים שפתינו
    kjvRefs:
    - Hosea 14:2
    kjvOsis:
    - Hos.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.4
    scripture: tanakh
    name: Tanakh Hosea 14:4
    ref: Hosea 14:4
    book: Hos
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 14283
    text: Asshur shall not save us; We will not ride upon horses; Neither will we call any more the work of our hands our gods; For in Thee the fatherless findeth mercy.’
    translation: JPS 1917
    original: אַשּׁוּר לֹא יוֹשִׁיעֵנוּ עַל־סוּס לֹא נִרְכָּב וְלֹא־נֹאמַר עוֹד אֱלֹהֵינוּ לְמַעֲשֵׂה יָדֵינוּ אֲשֶׁר־בְּךָ יְרֻחַם יָתוֹם׃
    hebrewPlain: אשור לא יושיענו על סוס לא נרכב ולא נאמר עוד אלהינו למעשה ידינו אשר בך ירחם יתום
    kjvRefs:
    - Hosea 14:3
    kjvOsis:
    - Hos.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.5
    scripture: tanakh
    name: Tanakh Hosea 14:5
    ref: Hosea 14:5
    book: Hos
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 14284
    text: I will heal their backsliding, I will love them freely; For Mine anger is turned away from him.
    translation: JPS 1917
    original: אֶרְפָּא מְשׁוּבָתָם אֹהֲבֵם נְדָבָה כִּי שָׁב אַפִּי מִמֶּנּוּ׃
    hebrewPlain: ארפא משובתם אהבם נדבה כי שב אפי ממנו
    kjvRefs:
    - Hosea 14:4
    kjvOsis:
    - Hos.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.6
    scripture: tanakh
    name: Tanakh Hosea 14:6
    ref: Hosea 14:6
    book: Hos
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 14285
    text: I will be as the dew unto Israel; He shall blossom as the lily, And cast forth his roots as Lebanon.
    translation: JPS 1917
    original: אֶהְיֶה כַטַּל לְיִשְׂרָאֵל יִפְרַח כַּשּׁוֹשַׁנָּה וְיַךְ שָׁרָשָׁיו כַּלְּבָנוֹן׃
    hebrewPlain: אהיה כטל לישראל יפרח כשושנה ויך שרשיו כלבנון
    kjvRefs:
    - Hosea 14:5
    kjvOsis:
    - Hos.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.7
    scripture: tanakh
    name: Tanakh Hosea 14:7
    ref: Hosea 14:7
    book: Hos
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 14286
    text: His branches shall spread, And his beauty shall be as the olive-tree, And his fragrance as Lebanon.
    translation: JPS 1917
    original: יֵלְכוּ יֹנְקוֹתָיו וִיהִי כַזַּיִת הוֹדוֹ וְרֵיחַ לוֹ כַּלְּבָנוֹן׃
    hebrewPlain: ילכו ינקותיו ויהי כזית הודו וריח לו כלבנון
    kjvRefs:
    - Hosea 14:6
    kjvOsis:
    - Hos.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.8
    scripture: tanakh
    name: Tanakh Hosea 14:8
    ref: Hosea 14:8
    book: Hos
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 14287
    text: They that dwell under his shadow shall again Make corn to grow, And shall blossom as the vine; The scent thereof shall be as the wine of Lebanon.
    translation: JPS 1917
    original: יָשֻׁבוּ יֹשְׁבֵי בְצִלּוֹ יְחַיּוּ דָגָן וְיִפְרְחוּ כַגָּפֶן זִכְרוֹ כְּיֵין לְבָנוֹן׃
    hebrewPlain: ישבו ישבי בצלו יחיו דגן ויפרחו כגפן זכרו כיין לבנון
    kjvRefs:
    - Hosea 14:7
    kjvOsis:
    - Hos.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.9
    scripture: tanakh
    name: Tanakh Hosea 14:9
    ref: Hosea 14:9
    book: Hos
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 14288
    text: 'Ephraim [shall say]: ‘What have I to do any more with idols?’ As for Me, I respond and look on him; I am like a leafy cypress-tree; From Me is thy fruit found.'
    translation: JPS 1917
    original: אֶפְרַיִם מַה־לִּי עוֹד לָעֲצַבִּים אֲנִי עָנִיתִי וַאֲשׁוּרֶנּוּ אֲנִי כִּבְרוֹשׁ רַעֲנָן מִמֶּנִּי פֶּרְיְךָ נִמְצָא׃
    hebrewPlain: אפרים מה לי עוד לעצבים אני עניתי ואשורנו אני כברוש רענן ממני פריך נמצא
    kjvRefs:
    - Hosea 14:8
    kjvOsis:
    - Hos.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.14
- type: TanakhVerse
  data:
    osis: Hos.14.10
    scripture: tanakh
    name: Tanakh Hosea 14:10
    ref: Hosea 14:10
    book: Hos
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 14289
    text: Whoso is wise, let him understand these things, Whoso is prudent, let him know them. For the ways of the LORD are right, And the just do walk in them; But transgressors do stumble therein.
    translation: JPS 1917
    original: מִי חָכָם וְיָבֵן אֵלֶּה נָבוֹן וְיֵדָעֵם כִּי־יְשָׁרִים דַּרְכֵי יְהוָה וְצַדִּקִים יֵלְכוּ בָם וּפֹשְׁעִים יִכָּשְׁלוּ בָם׃
    hebrewPlain: מי חכם ויבן אלה נבון וידעם כי ישרים דרכי יהוה וצדקים ילכו בם ופשעים יכשלו בם
    kjvRefs:
    - Hosea 14:9
    kjvOsis:
    - Hos.14.9
  relations:
  - predicate: IN
