    scripture: tanakh
    name: Tanakh Hosea 1:4
    ref: Hosea 1:4
    book: Hos
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14096
    text: 'And the LORD said unto him: ‘Call his name Jezreel; for yet a little while, and I will visit the blood of Jezreel upon the house of Jehu, and will cause to cease the kingdom of the house of Israel.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלָיו קְרָא שְׁמוֹ יִזְרְעֶאל כִּי־עוֹד מְעַט וּפָקַדְתִּי אֶת־דְּמֵי יִזְרְעֶאל עַל־בֵּית יֵהוּא וְהִשְׁבַּתִּי מַמְלְכוּת בֵּית יִשְׂרָאֵל׃
    hebrewPlain: ויאמר יהוה אליו קרא שמו יזרעאל כי עוד מעט ופקדתי את דמי יזרעאל על בית יהוא והשבתי ממלכות בית ישראל
    kjvRefs:
    - Hosea 1:4
    kjvOsis:
