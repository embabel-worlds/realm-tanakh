- type: TanakhVerse
  data:
    osis: Hos.1.9
    scripture: tanakh
    name: Tanakh Hosea 1:9
    ref: Hosea 1:9
    book: Hos
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14101
    text: 'And He said: ‘Call his name Lo-ammi; for ye are not My people, and I will not be yours.’'
    translation: JPS 1917
    original: וַיֹּאמֶר קְרָא שְׁמוֹ לֹא עַמִּי כִּי אַתֶּם לֹא עַמִּי וְאָנֹכִי לֹא־אֶהְיֶה לָכֶם׃
    hebrewPlain: ויאמר קרא שמו לא עמי כי אתם לא עמי ואנכי לא אהיה לכם
