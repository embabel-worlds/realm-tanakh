- type: TanakhVerse
  data:
    osis: Hos.2.1
    scripture: tanakh
    name: Tanakh Hosea 2:1
    ref: Hosea 2:1
    book: Hos
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 14102
    text: 'Yet the number of the children of Israel shall be as the sand of the sea, which cannot be measured nor numbered; and it shall come to pass that, instead of that which was said unto them: ‘Ye are not My people’, it shall be said unto them: ‘Ye are the children of the living God.’'
    translation: JPS 1917
    original: וְהָיָה מִסְפַּר בְּנֵי־יִשְׂרָאֵל כְּחוֹל הַיָּם אֲשֶׁר לֹא־יִמַּד וְלֹא יִסָּפֵר וְהָיָה בִּמְקוֹם אֲשֶׁר־יֵאָמֵר לָהֶם לֹא־עַמִּי אַתֶּם יֵאָמֵר לָהֶם בְּנֵי אֵל־חָי׃
    hebrewPlain: והיה מספר בני ישראל כחול הים אשר לא ימד ולא יספר והיה במקום אשר יאמר להם לא עמי אתם יאמר להם בני אל חי
    kjvRefs:
    - Hosea 1:10
    kjvOsis:
    - Hos.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.2
    scripture: tanakh
    name: Tanakh Hosea 2:2
    ref: Hosea 2:2
    book: Hos
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 14103
    text: And the children of Judah and the children of Israel shall be gathered together, and they shall appoint themselves one head, and shall go up out of the land; for great shall be the day of Jezreel.
    translation: JPS 1917
    original: וְנִקְבְּצוּ בְּנֵי־יְהוּדָה וּבְנֵי־יִשְׂרָאֵל יַחְדָּו וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד וְעָלוּ מִן־הָאָרֶץ כִּי גָדוֹל יוֹם יִזְרְעֶאל׃
    hebrewPlain: ונקבצו בני יהודה ובני ישראל יחדו ושמו להם ראש אחד ועלו מן הארץ כי גדול יום יזרעאל
    kjvRefs:
    - Hosea 1:11
    kjvOsis:
    - Hos.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
