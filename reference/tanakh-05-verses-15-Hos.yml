    ref: Hosea 1:5
    book: Hos
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14097
    text: And it shall come to pass at that day, that I will break the bow of Israel in the valley of Jezreel.’
    translation: JPS 1917
    original: וְהָיָה בַּיּוֹם הַהוּא וְשָׁבַרְתִּי אֶת־קֶשֶׁת יִשְׂרָאֵל בְּעֵמֶק יִזְרְעֶאל׃
    hebrewPlain: והיה ביום ההוא ושברתי את קשת ישראל בעמק יזרעאל
