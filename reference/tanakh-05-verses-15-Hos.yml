- type: TanakhVerse
  data:
    osis: Hos.1.6
    scripture: tanakh
    name: Tanakh Hosea 1:6
    ref: Hosea 1:6
    book: Hos
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14098
    text: 'And she conceived again, and bore a daughter. And He said unto him: ‘Call her name Lo-ruhamah; for I will no more have compassion upon the house of Israel, that I should in any wise pardon them.'
    translation: JPS 1917
    original: וַתַּהַר עוֹד וַתֵּלֶד בַּת וַיֹּאמֶר לוֹ קְרָא שְׁמָהּ לֹא רֻחָמָה כִּי לֹא אוֹסִיף עוֹד אֲרַחֵם אֶת־בֵּית יִשְׂרָאֵל כִּי־נָשֹׂא אֶשָּׂא לָהֶם׃
    hebrewPlain: ותהר עוד ותלד בת ויאמר לו קרא שמה לא רחמה כי לא אוסיף עוד ארחם את בית ישראל כי נשא אשא להם
    kjvRefs:
    - Hosea 1:6
    kjvOsis:
    - Hos.1.6
  relations:
