    ref: Hosea 2:3
    book: Hos
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 14104
    text: 'Say ye unto your brethren: ‘Ammi’; and to your sisters, ‘Ruhamah.’'
    translation: JPS 1917
    original: אִמְרוּ לַאֲחֵיכֶם עַמִּי וְלַאֲחוֹתֵיכֶם רֻחָמָה׃
    hebrewPlain: אמרו לאחיכם עמי ולאחותיכם רחמה
    kjvRefs:
    - Hosea 2:1
    kjvOsis:
    - Hos.2.1
