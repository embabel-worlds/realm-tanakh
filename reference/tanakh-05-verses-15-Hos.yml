    scripture: tanakh
    name: Tanakh Hosea 2:4
    ref: Hosea 2:4
    book: Hos
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 14105
    text: Plead with your mother, plead; For she is not My wife, neither am I her husband; And let her put away her harlotries from her face, And her adulteries from between her breasts;
    translation: JPS 1917
    original: רִיבוּ בְאִמְּכֶם רִיבוּ כִּי־הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ וְתָסֵר זְנוּנֶיהָ מִפָּנֶיה וְנַאֲפוּפֶיהָ מִבֵּין שָׁדֶיהָ׃
    hebrewPlain: ריבו באמכם ריבו כי היא לא אשתי ואנכי לא אישה ותסר זנוניה מפניה ונאפופיה מבין שדיה
    kjvRefs:
    - Hosea 2:2
    kjvOsis:
    - Hos.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.5
    scripture: tanakh
    name: Tanakh Hosea 2:5
    ref: Hosea 2:5
    book: Hos
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 14106
    text: Lest I strip her naked, And set her as in the day that she was born, And make her as a wilderness, And set her like a dry land, And slay her with thirst.
    translation: JPS 1917
    original: פֶּן־אַפְשִׁיטֶנָּה עֲרֻמָּה וְהִצַּגְתִּיהָ כְּיוֹם הִוָּלְדָהּ וְשַׂמְתִּיהָ כַמִּדְבָּר וְשַׁתִּהָ כְּאֶרֶץ צִיָּה וַהֲמִתִּיהָ בַּצָּמָא׃
    hebrewPlain: פן אפשיטנה ערמה והצגתיה כיום הולדה ושמתיה כמדבר ושתה כארץ ציה והמתיה בצמא
    kjvRefs:
    - Hosea 2:3
    kjvOsis:
    - Hos.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.6
    scripture: tanakh
    name: Tanakh Hosea 2:6
    ref: Hosea 2:6
    book: Hos
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 14107
    text: And I will not have compassion upon her children; For they are children of harlotry.
    translation: JPS 1917
    original: וְאֶת־בָּנֶיהָ לֹא אֲרַחֵם כִּי־בְנֵי זְנוּנִים הֵמָּה׃
    hebrewPlain: ואת בניה לא ארחם כי בני זנונים המה
    kjvRefs:
    - Hosea 2:4
    kjvOsis:
    - Hos.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.7
    scripture: tanakh
    name: Tanakh Hosea 2:7
    ref: Hosea 2:7
    book: Hos
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 14108
    text: 'For their mother hath played the harlot, She that conceived them hath done shamefully; For she said: ‘I will go after my lovers, That give me my bread and my water, My wool and my flax, mine oil and my drink.’'
    translation: JPS 1917
    original: כִּי זָנְתָה אִמָּם הֹבִישָׁה הוֹרָתָם כִּי אָמְרָה אֵלְכָה אַחֲרֵי מְאַהֲבַי נֹתְנֵי לַחְמִי וּמֵימַי צַמְרִי וּפִשְׁתִּי שַׁמְנִי וְשִׁקּוּיָי׃
    hebrewPlain: כי זנתה אמם הבישה הורתם כי אמרה אלכה אחרי מאהבי נתני לחמי ומימי צמרי ופשתי שמני ושקויי
    kjvRefs:
    - Hosea 2:5
    kjvOsis:
    - Hos.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.8
    scripture: tanakh
    name: Tanakh Hosea 2:8
    ref: Hosea 2:8
    book: Hos
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 14109
    text: Therefore, behold, I will hedge up thy way with thorns, And I will make a wall against her, That she shall not find her paths.
    translation: JPS 1917
    original: לָכֵן הִנְנִי־שָׂךְ אֶת־דַּרְכֵּךְ בַּסִּירִים וְגָדַרְתִּי אֶת־גְּדֵרָהּ וּנְתִיבוֹתֶיהָ לֹא תִמְצָא׃
    hebrewPlain: לכן הנני שך את דרכך בסירים וגדרתי את גדרה ונתיבותיה לא תמצא
    kjvRefs:
    - Hosea 2:6
    kjvOsis:
    - Hos.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.9
    scripture: tanakh
    name: Tanakh Hosea 2:9
    ref: Hosea 2:9
    book: Hos
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 14110
    text: 'And she shall run after her lovers, but she shall not overtake them, And she shall seek them, but shall not find them; Then shall she say: ‘I will go and return to my first husband; For then was it better with me than now.’'
    translation: JPS 1917
    original: וְרִדְּפָה אֶת־מְאַהֲבֶיהָ וְלֹא־תַשִּׂיג אֹתָם וּבִקְשָׁתַם וְלֹא תִמְצָא וְאָמְרָה אֵלְכָה וְאָשׁוּבָה אֶל־אִישִׁי הָרִאשׁוֹן כִּי טוֹב לִי אָז מֵעָתָּה׃
    hebrewPlain: ורדפה את מאהביה ולא תשיג אתם ובקשתם ולא תמצא ואמרה אלכה ואשובה אל אישי הראשון כי טוב לי אז מעתה
    kjvRefs:
    - Hosea 2:7
    kjvOsis:
    - Hos.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.10
    scripture: tanakh
    name: Tanakh Hosea 2:10
    ref: Hosea 2:10
    book: Hos
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 14111
    text: For she did not know that it was I that gave her The corn, and the wine, and the oil, And multiplied unto her silver and gold, Which they used for Baal.
    translation: JPS 1917
    original: וְהִיא לֹא יָדְעָה כִּי אָנֹכִי נָתַתִּי לָהּ הַדָּגָן וְהַתִּירוֹשׁ וְהַיִּצְהָר וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב עָשׂוּ לַבָּעַל׃
    hebrewPlain: והיא לא ידעה כי אנכי נתתי לה הדגן והתירוש והיצהר וכסף הרביתי לה וזהב עשו לבעל
    kjvRefs:
    - Hosea 2:8
    kjvOsis:
    - Hos.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.11
    scripture: tanakh
    name: Tanakh Hosea 2:11
    ref: Hosea 2:11
    book: Hos
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 14112
    text: Therefore will I take back My corn in the time thereof, And My wine in the season thereof, And will snatch away My wool and My flax Given to cover her nakedness.
    translation: JPS 1917
    original: לָכֵן אָשׁוּב וְלָקַחְתִּי דְגָנִי בְּעִתּוֹ וְתִירוֹשִׁי בְּמוֹעֲדוֹ וְהִצַּלְתִּי צַמְרִי וּפִשְׁתִּי לְכַסּוֹת אֶת־עֶרְוָתָהּ׃
    hebrewPlain: לכן אשוב ולקחתי דגני בעתו ותירושי במועדו והצלתי צמרי ופשתי לכסות את ערותה
    kjvRefs:
    - Hosea 2:9
    kjvOsis:
    - Hos.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.12
    scripture: tanakh
    name: Tanakh Hosea 2:12
    ref: Hosea 2:12
    book: Hos
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 14113
    text: And now will I uncover her shame in the sight of her lovers, And none shall deliver her out of My hand.
    translation: JPS 1917
    original: וְעַתָּה אֲגַלֶּה אֶת־נַבְלֻתָהּ לְעֵינֵי מְאַהֲבֶיהָ וְאִישׁ לֹא־יַצִּילֶנָּה מִיָּדִי׃
    hebrewPlain: ועתה אגלה את נבלתה לעיני מאהביה ואיש לא יצילנה מידי
    kjvRefs:
    - Hosea 2:10
    kjvOsis:
    - Hos.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.13
    scripture: tanakh
    name: Tanakh Hosea 2:13
    ref: Hosea 2:13
    book: Hos
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 14114
    text: I will also cause all her mirth to cease, Her feasts, her new moons, and her sabbaths, And all her appointed seasons.
    translation: JPS 1917
    original: וְהִשְׁבַּתִּי כָּל־מְשׂוֹשָׂהּ חַגָּהּ חָדְשָׁהּ וְשַׁבַּתָּהּ וְכֹל מוֹעֲדָהּ׃
    hebrewPlain: והשבתי כל משושה חגה חדשה ושבתה וכל מועדה
    kjvRefs:
    - Hosea 2:11
    kjvOsis:
    - Hos.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.14
    scripture: tanakh
    name: Tanakh Hosea 2:14
    ref: Hosea 2:14
    book: Hos
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 14115
    text: 'And I will lay waste her vines and her fig-trees, Whereof she hath said: ‘These are my hire That my lovers have given me’; And I will make them a forest, And the beasts of the field shall eat them.'
    translation: JPS 1917
    original: וַהֲשִׁמֹּתִי גַּפְנָהּ וּתְאֵנָתָהּ אֲשֶׁר אָמְרָה אֶתְנָה הֵמָּה לִי אֲשֶׁר נָתְנוּ־לִי מְאַהֲבָי וְשַׂמְתִּים לְיַעַר וַאֲכָלָתַם חַיַּת הַשָּׂדֶה׃
    hebrewPlain: והשמתי גפנה ותאנתה אשר אמרה אתנה המה לי אשר נתנו לי מאהבי ושמתים ליער ואכלתם חית השדה
    kjvRefs:
    - Hosea 2:12
    kjvOsis:
    - Hos.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.15
    scripture: tanakh
    name: Tanakh Hosea 2:15
    ref: Hosea 2:15
    book: Hos
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 14116
    text: And I will visit upon her the days of the Baalim, Wherein she offered unto them, And decked herself with her ear-rings and her jewels, And went after her lovers, And forgot Me, saith the LORD.
    translation: JPS 1917
    original: וּפָקַדְתִּי עָלֶיהָ אֶת־יְמֵי הַבְּעָלִים אֲשֶׁר תַּקְטִיר לָהֶם וַתַּעַד נִזְמָהּ וְחֶלְיָתָהּ וַתֵּלֶךְ אַחֲרֵי מְאַהֲבֶיהָ וְאֹתִי שָׁכְחָה נְאֻם־יְהוָה׃
    hebrewPlain: ופקדתי עליה את ימי הבעלים אשר תקטיר להם ותעד נזמה וחליתה ותלך אחרי מאהביה ואתי שכחה נאם יהוה
    kjvRefs:
    - Hosea 2:13
    kjvOsis:
    - Hos.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.16
    scripture: tanakh
    name: Tanakh Hosea 2:16
    ref: Hosea 2:16
    book: Hos
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 14117
    text: Therefore, behold, I will allure her, And bring her into the wilderness, And speak tenderly unto her.
    translation: JPS 1917
    original: לָכֵן הִנֵּה אָנֹכִי מְפַתֶּיהָ וְהֹלַכְתִּיהָ הַמִּדְבָּר וְדִבַּרְתִּי עַל לִבָּהּ׃
    hebrewPlain: לכן הנה אנכי מפתיה והלכתיה המדבר ודברתי על לבה
    kjvRefs:
    - Hosea 2:14
    kjvOsis:
    - Hos.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.17
    scripture: tanakh
    name: Tanakh Hosea 2:17
    ref: Hosea 2:17
    book: Hos
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 14118
    text: And I will give her her vineyards from thence, And the valley of Achor for a door of hope; And she shall respond there, as in the days of her youth, And as in the day when she came up out of the land of Egypt.
    translation: JPS 1917
    original: וְנָתַתִּי לָהּ אֶת־כְּרָמֶיהָ מִשָּׁם וְאֶת־עֵמֶק עָכוֹר לְפֶתַח תִּקְוָה וְעָנְתָה שָּׁמָּה כִּימֵי נְעוּרֶיהָ וִּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ־מִצְרָיִם׃
    hebrewPlain: ונתתי לה את כרמיה משם ואת עמק עכור לפתח תקוה וענתה שמה כימי נעוריה וכיום עלתה מארץ מצרים
    kjvRefs:
    - Hosea 2:15
    kjvOsis:
    - Hos.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.18
    scripture: tanakh
    name: Tanakh Hosea 2:18
    ref: Hosea 2:18
    book: Hos
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 14119
    text: And it shall be at that day, saith the LORD, That thou shalt call Me Ishi, And shalt call Me no more Baali.
    translation: JPS 1917
    original: וְהָיָה בַיּוֹם־הַהוּא נְאֻם־יְהוָה תִּקְרְאִי אִישִׁי וְלֹא־תִקְרְאִי־לִי עוֹד בַּעְלִי׃
    hebrewPlain: והיה ביום ההוא נאם יהוה תקראי אישי ולא תקראי לי עוד בעלי
    kjvRefs:
    - Hosea 2:16
    kjvOsis:
    - Hos.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.19
    scripture: tanakh
    name: Tanakh Hosea 2:19
    ref: Hosea 2:19
    book: Hos
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 14120
    text: For I will take away the names of the Baalim out of her mouth, And they shall no more be mentioned by their name.
    translation: JPS 1917
    original: וַהֲסִרֹתִי אֶת־שְׁמוֹת הַבְּעָלִים מִפִּיהָ וְלֹא־יִזָּכְרוּ עוֹד בִּשְׁמָם׃
    hebrewPlain: והסרתי את שמות הבעלים מפיה ולא יזכרו עוד בשמם
    kjvRefs:
    - Hosea 2:17
    kjvOsis:
    - Hos.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.20
    scripture: tanakh
    name: Tanakh Hosea 2:20
    ref: Hosea 2:20
    book: Hos
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 14121
    text: And in that day will I make a covenant for them With the beasts of the field, and with the fowls of heaven, And with the creeping things of the ground; And I will break the bow and the sword and the battle out of the land, And will make them to lie down safely.
    translation: JPS 1917
    original: וְכָרַתִּי לָהֶם בְּרִית בַּיּוֹם הַהוּא עִם־חַיַּת הַשָּׂדֶה וְעִם־עוֹף הַשָּׁמַיִם וְרֶמֶשׂ הָאֲדָמָה וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה אֶשְׁבּוֹר מִן־הָאָרֶץ וְהִשְׁכַּבְתִּים לָבֶטַח׃
    hebrewPlain: וכרתי להם ברית ביום ההוא עם חית השדה ועם עוף השמים ורמש האדמה וקשת וחרב ומלחמה אשבור מן הארץ והשכבתים לבטח
    kjvRefs:
    - Hosea 2:18
    kjvOsis:
    - Hos.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.21
    scripture: tanakh
    name: Tanakh Hosea 2:21
    ref: Hosea 2:21
    book: Hos
    section: neviim
    chapter: 2
    verse: 21
    ordinal: 14122
    text: And I will betroth thee unto Me for ever; Yea, I will betroth thee unto Me in righteousness, and in justice, And in lovingkindness, and in compassion.
    translation: JPS 1917
    original: וְאֵרַשְׂתִּיךְ לִי לְעוֹלָם וְאֵרַשְׂתִּיךְ לִי בְּצֶדֶק וּבְמִשְׁפָּט וּבְחֶסֶד וּבְרַחֲמִים׃
    hebrewPlain: וארשתיך לי לעולם וארשתיך לי בצדק ובמשפט ובחסד וברחמים
    kjvRefs:
    - Hosea 2:19
    kjvOsis:
    - Hos.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.22
    scripture: tanakh
    name: Tanakh Hosea 2:22
    ref: Hosea 2:22
    book: Hos
    section: neviim
    chapter: 2
    verse: 22
    ordinal: 14123
    text: And I will betroth thee unto Me in faithfulness; And thou shalt know the LORD.
    translation: JPS 1917
    original: וְאֵרַשְׂתִּיךְ לִי בֶּאֱמוּנָה וְיָדַעַתְּ אֶת־יְהוָה׃
    hebrewPlain: וארשתיך לי באמונה וידעת את יהוה
    kjvRefs:
    - Hosea 2:20
    kjvOsis:
    - Hos.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.23
    scripture: tanakh
    name: Tanakh Hosea 2:23
    ref: Hosea 2:23
    book: Hos
    section: neviim
    chapter: 2
    verse: 23
    ordinal: 14124
    text: And it shall come to pass in that day, I will respond, saith the LORD, I will respond to the heavens, And they shall respond to the earth;
    translation: JPS 1917
    original: וְהָיָה בַּיּוֹם הַהוּא אֶעֱנֶה נְאֻם־יְהוָה אֶעֱנֶה אֶת־הַשָּׁמָיִם וְהֵם יַעֲנוּ אֶת־הָאָרֶץ׃
    hebrewPlain: והיה ביום ההוא אענה נאם יהוה אענה את השמים והם יענו את הארץ
    kjvRefs:
    - Hosea 2:21
    kjvOsis:
    - Hos.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.24
    scripture: tanakh
    name: Tanakh Hosea 2:24
    ref: Hosea 2:24
    book: Hos
    section: neviim
    chapter: 2
    verse: 24
    ordinal: 14125
    text: And the earth shall respond to the corn, and the wine, and the oil; And they shall respond to Jezreel.
    translation: JPS 1917
    original: וְהָאָרֶץ תַּעֲנֶה אֶת־הַדָּגָן וְאֶת־הַתִּירוֹשׁ וְאֶת־הַיִּצְהָר וְהֵם יַעֲנוּ אֶת־יִזְרְעֶאל׃
    hebrewPlain: והארץ תענה את הדגן ואת התירוש ואת היצהר והם יענו את יזרעאל
    kjvRefs:
    - Hosea 2:22
    kjvOsis:
    - Hos.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.2.25
    scripture: tanakh
    name: Tanakh Hosea 2:25
    ref: Hosea 2:25
    book: Hos
    section: neviim
    chapter: 2
    verse: 25
    ordinal: 14126
    text: 'And I will sow her unto Me in the land; And I will have compassion upon her that had not obtained compassion; And I will say to them that were not My people: ‘Thou art My people’; And they shall say: ‘Thou art my God.’'
    translation: JPS 1917
    original: וּזְרַעְתִּיהָ לִּי בָּאָרֶץ וְרִחַמְתִּי אֶת־לֹא רֻחָמָה וְאָמַרְתִּי לְלֹא־עַמִּי עַמִּי־אַתָּה וְהוּא יֹאמַר אֱלֹהָי׃
    hebrewPlain: וזרעתיה לי בארץ ורחמתי את לא רחמה ואמרתי ללא עמי עמי אתה והוא יאמר אלהי
    kjvRefs:
    - Hosea 2:23
    kjvOsis:
    - Hos.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.2
- type: TanakhVerse
  data:
    osis: Hos.3.1
    scripture: tanakh
    name: Tanakh Hosea 3:1
    ref: Hosea 3:1
    book: Hos
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 14127
    text: 'And the LORD said unto me: ‘Go yet, love a woman beloved of her friend and an adulteress, even as the LORD loveth the children of Israel, though they turn unto other gods, and love cakes of raisins.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֵלַי עוֹד לֵךְ אֱ‍הַב־אִשָּׁה אֲהֻבַת רֵעַ וּמְנָאָפֶת כְּאַהֲבַת יְהוָה אֶת־בְּנֵי יִשְׂרָאֵל וְהֵם פֹּנִים אֶל־אֱלֹהִים אֲחֵרִים וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים׃
    hebrewPlain: ויאמר יהוה אלי עוד לך א‍הב אשה אהבת רע ומנאפת כאהבת יהוה את בני ישראל והם פנים אל אלהים אחרים ואהבי אשישי ענבים
    kjvRefs:
    - Hosea 3:1
    kjvOsis:
    - Hos.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.3
- type: TanakhVerse
  data:
    osis: Hos.3.2
    scripture: tanakh
    name: Tanakh Hosea 3:2
    ref: Hosea 3:2
    book: Hos
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 14128
    text: So I bought her to me for fifteen pieces of silver and a homer of barley, and a half-homer of barley;
    translation: JPS 1917
    original: וָאֶכְּרֶהָ לִּי בַּחֲמִשָּׁה עָשָׂר כָּסֶף וְחֹמֶר שְׂעֹרִים וְלֵתֶךְ שְׂעֹרִים׃
    hebrewPlain: ואכרה לי בחמשה עשר כסף וחמר שערים ולתך שערים
    kjvRefs:
    - Hosea 3:2
    kjvOsis:
    - Hos.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.3
- type: TanakhVerse
  data:
    osis: Hos.3.3
    scripture: tanakh
    name: Tanakh Hosea 3:3
    ref: Hosea 3:3
    book: Hos
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 14129
    text: 'and I said unto her: ‘Thou shalt sit solitary for me many days; thou shalt not play the harlot, and thou shalt not be any man’s wife; nor will I be thine.’'
    translation: JPS 1917
    original: וָאֹמַר אֵלֶיהָ יָמִים רַבִּים תֵּשְׁבִי לִי לֹא תִזְנִי וְלֹא תִהְיִי לְאִישׁ וְגַם־אֲנִי אֵלָיִךְ׃
    hebrewPlain: ואמר אליה ימים רבים תשבי לי לא תזני ולא תהיי לאיש וגם אני אליך
    kjvRefs:
    - Hosea 3:3
    kjvOsis:
    - Hos.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.3
- type: TanakhVerse
  data:
    osis: Hos.3.4
    scripture: tanakh
    name: Tanakh Hosea 3:4
    ref: Hosea 3:4
    book: Hos
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 14130
    text: For the children of Israel shall sit solitary many days without king, and without prince, and without sacrifice, and without pillar, and without ephod or teraphim;
    translation: JPS 1917
    original: כִּי יָמִים רַבִּים יֵשְׁבוּ בְּנֵי יִשְׂרָאֵל אֵין מֶלֶךְ וְאֵין שָׂר וְאֵין זֶבַח וְאֵין מַצֵּבָה וְאֵין אֵפוֹד וּתְרָפִים׃
    hebrewPlain: כי ימים רבים ישבו בני ישראל אין מלך ואין שר ואין זבח ואין מצבה ואין אפוד ותרפים
    kjvRefs:
    - Hosea 3:4
    kjvOsis:
    - Hos.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.3
- type: TanakhVerse
  data:
    osis: Hos.3.5
    scripture: tanakh
    name: Tanakh Hosea 3:5
    ref: Hosea 3:5
    book: Hos
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 14131
    text: afterward shall the children of Israel return, and seek the LORD their God, and David their king; and shall come trembling unto the LORD and to His goodness in the end of days.
    translation: JPS 1917
    original: אַחַר יָשֻׁבוּ בְּנֵי יִשְׂרָאֵל וּבִקְשׁוּ אֶת־יְהוָה אֱלֹהֵיהֶם וְאֵת דָּוִד מַלְכָּם וּפָחֲדוּ אֶל־יְהוָה וְאֶל־טוּבוֹ בְּאַחֲרִית הַיָּמִים׃
    hebrewPlain: אחר ישבו בני ישראל ובקשו את יהוה אלהיהם ואת דוד מלכם ופחדו אל יהוה ואל טובו באחרית הימים
    kjvRefs:
    - Hosea 3:5
    kjvOsis:
    - Hos.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.3
- type: TanakhVerse
  data:
    osis: Hos.4.1
    scripture: tanakh
    name: Tanakh Hosea 4:1
    ref: Hosea 4:1
    book: Hos
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 14132
    text: Hear the word of the LORD, ye children of Israel! For the LORD hath a controversy with the inhabitants of the land, Because there is no truth, nor mercy, Nor knowledge of God in the land.
    translation: JPS 1917
    original: שִׁמְעוּ דְבַר־יְהוָה בְּנֵי יִשְׂרָאֵל כִּי רִיב לַיהוָה עִם־יוֹשְׁבֵי הָאָרֶץ כִּי אֵין־אֱמֶת וְאֵין־חֶסֶד וְאֵין־דַּעַת אֱלֹהִים בָּאָרֶץ׃
    hebrewPlain: שמעו דבר יהוה בני ישראל כי ריב ליהוה עם יושבי הארץ כי אין אמת ואין חסד ואין דעת אלהים בארץ
    kjvRefs:
    - Hosea 4:1
    kjvOsis:
    - Hos.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.2
    scripture: tanakh
    name: Tanakh Hosea 4:2
    ref: Hosea 4:2
    book: Hos
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 14133
    text: Swearing and lying, and killing, and stealing, and committing adultery! They break all bounds, and blood toucheth blood.
    translation: JPS 1917
    original: אָלֹה וְכַחֵשׁ וְרָצֹחַ וְגָנֹב וְנָאֹף פָּרָצוּ וְדָמִים בְּדָמִים נָגָעוּ׃
    hebrewPlain: אלה וכחש ורצח וגנב ונאף פרצו ודמים בדמים נגעו
    kjvRefs:
    - Hosea 4:2
    kjvOsis:
    - Hos.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.3
    scripture: tanakh
    name: Tanakh Hosea 4:3
    ref: Hosea 4:3
    book: Hos
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 14134
    text: Therefore doth the land mourn, And every one that dwelleth therein doth languish, With the beasts of the field, and the fowls of heaven; Yea, the fishes of the sea also are taken away.
    translation: JPS 1917
    original: עַל־כֵּן תֶּאֱבַל הָאָרֶץ וְאֻמְלַל כָּל־יוֹשֵׁב בָּהּ בְּחַיַּת הַשָּׂדֶה וּבְעוֹף הַשָּׁמָיִם וְגַם־דְּגֵי הַיָּם יֵאָסֵפוּ׃
    hebrewPlain: על כן תאבל הארץ ואמלל כל יושב בה בחית השדה ובעוף השמים וגם דגי הים יאספו
    kjvRefs:
    - Hosea 4:3
    kjvOsis:
    - Hos.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.4
    scripture: tanakh
    name: Tanakh Hosea 4:4
    ref: Hosea 4:4
    book: Hos
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 14135
    text: Yet let no man strive, neither let any man reprove; For thy people are as they that strive with the priest.
    translation: JPS 1917
    original: אַךְ אִישׁ אַל־יָרֵב וְאַל־יוֹכַח אִישׁ וְעַמְּךָ כִּמְרִיבֵי כֹהֵן׃
    hebrewPlain: אך איש אל ירב ואל יוכח איש ועמך כמריבי כהן
    kjvRefs:
    - Hosea 4:4
    kjvOsis:
    - Hos.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.5
    scripture: tanakh
    name: Tanakh Hosea 4:5
    ref: Hosea 4:5
    book: Hos
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 14136
    text: Therefore shalt thou stumble in the day, And the prophet also shall stumble with thee in the night; And I will destroy thy mother.
    translation: JPS 1917
    original: וְכָשַׁלְתָּ הַיּוֹם וְכָשַׁל גַּם־נָבִיא עִמְּךָ לָיְלָה וְדָמִיתִי אִמֶּךָ׃
    hebrewPlain: וכשלת היום וכשל גם נביא עמך לילה ודמיתי אמך
    kjvRefs:
    - Hosea 4:5
    kjvOsis:
    - Hos.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.6
    scripture: tanakh
    name: Tanakh Hosea 4:6
    ref: Hosea 4:6
    book: Hos
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 14137
    text: My people are destroyed for lack of knowledge; Because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to Me; Seeing thou hast forgotten the law of thy God, I also will forget thy children.
    translation: JPS 1917
    original: נִדְמוּ עַמִּי מִבְּלִי הַדָּעַת כִּי־אַתָּה הַדַּעַת מָאַסְתָּ וְאֶמְאָסְאךָ מִכַּהֵן לִי וַתִּשְׁכַּח תּוֹרַת אֱלֹהֶיךָ אֶשְׁכַּח בָּנֶיךָ גַּם־אָנִי׃
    hebrewPlain: נדמו עמי מבלי הדעת כי אתה הדעת מאסת ואמאסאך מכהן לי ותשכח תורת אלהיך אשכח בניך גם אני
    kjvRefs:
    - Hosea 4:6
    kjvOsis:
    - Hos.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.7
    scripture: tanakh
    name: Tanakh Hosea 4:7
    ref: Hosea 4:7
    book: Hos
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 14138
    text: The more they were increased, the more they sinned against Me; I will change their glory into shame.
    translation: JPS 1917
    original: כְּרֻבָּם כֵּן חָטְאוּ־לִי כְּבוֹדָם בְּקָלוֹן אָמִיר׃
    hebrewPlain: כרבם כן חטאו לי כבודם בקלון אמיר
    kjvRefs:
    - Hosea 4:7
    kjvOsis:
    - Hos.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.8
    scripture: tanakh
    name: Tanakh Hosea 4:8
    ref: Hosea 4:8
    book: Hos
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 14139
    text: They feed on the sin of My people, And set their heart on their iniquity.
    translation: JPS 1917
    original: חַטַּאת עַמִּי יֹאכֵלוּ וְאֶל־עֲוֺנָם יִשְׂאוּ נַפְשׁוֹ׃
    hebrewPlain: חטאת עמי יאכלו ואל עונם ישאו נפשו
    kjvRefs:
    - Hosea 4:8
    kjvOsis:
    - Hos.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.9
    scripture: tanakh
    name: Tanakh Hosea 4:9
    ref: Hosea 4:9
    book: Hos
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 14140
    text: And it is like people, like priest; And I will punish him for his ways, And will recompense him his doings.
    translation: JPS 1917
    original: וְהָיָה כָעָם כַּכֹּהֵן וּפָקַדְתִּי עָלָיו דְּרָכָיו וּמַעֲלָלָיו אָשִׁיב לוֹ׃
    hebrewPlain: והיה כעם ככהן ופקדתי עליו דרכיו ומעלליו אשיב לו
    kjvRefs:
    - Hosea 4:9
    kjvOsis:
    - Hos.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.10
    scripture: tanakh
    name: Tanakh Hosea 4:10
    ref: Hosea 4:10
    book: Hos
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 14141
    text: And they shall eat, and not have enough, They shall commit harlotry, and shall not increase; Because they have left off to take heed to the LORD.
    translation: JPS 1917
    original: וְאָכְלוּ וְלֹא יִשְׂבָּעוּ הִזְנוּ וְלֹא יִפְרֹצוּ כִּי־אֶת־יְהוָה עָזְבוּ לִשְׁמֹר׃
    hebrewPlain: ואכלו ולא ישבעו הזנו ולא יפרצו כי את יהוה עזבו לשמר
    kjvRefs:
    - Hosea 4:10
    kjvOsis:
    - Hos.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.11
    scripture: tanakh
    name: Tanakh Hosea 4:11
    ref: Hosea 4:11
    book: Hos
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 14142
    text: Harlotry, wine, and new wine take away the heart.
    translation: JPS 1917
    original: זְנוּת וְיַיִן וְתִירוֹשׁ יִקַּח־לֵב׃
    hebrewPlain: זנות ויין ותירוש יקח לב
    kjvRefs:
    - Hosea 4:11
    kjvOsis:
    - Hos.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.12
    scripture: tanakh
    name: Tanakh Hosea 4:12
    ref: Hosea 4:12
    book: Hos
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 14143
    text: My people ask counsel at their stock, And their staff declareth unto them; For the spirit of harlotry hath caused them to err, And they have gone astray from under their God.
    translation: JPS 1917
    original: עַמִּי בְּעֵצוֹ יִשְׁאָל וּמַקְלוֹ יַגִּיד לוֹ כִּי רוּחַ זְנוּנִים הִתְעָה וַיִּזְנוּ מִתַּחַת אֱלֹהֵיהֶם׃
    hebrewPlain: עמי בעצו ישאל ומקלו יגיד לו כי רוח זנונים התעה ויזנו מתחת אלהיהם
    kjvRefs:
    - Hosea 4:12
    kjvOsis:
    - Hos.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.13
    scripture: tanakh
    name: Tanakh Hosea 4:13
    ref: Hosea 4:13
    book: Hos
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 14144
    text: They sacrifice upon the tops of the mountains, And offer upon the hills, Under oaks and poplars and terebinths, Because the shadow thereof is good; Therefore your daughters commit harlotry, And your daughters-in-law commit adultery. .
    translation: JPS 1917
    original: עַל־רָאשֵׁי הֶהָרִים יְזַבֵּחוּ וְעַל־הַגְּבָעוֹת יְקַטֵּרוּ תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה כִּי טוֹב צִלָּהּ עַל־כֵּן תִּזְנֶינָה בְּנוֹתֵיכֶם וְכַלּוֹתֵיכֶם תְּנָאַפְנָה׃
    hebrewPlain: על ראשי ההרים יזבחו ועל הגבעות יקטרו תחת אלון ולבנה ואלה כי טוב צלה על כן תזנינה בנותיכם וכלותיכם תנאפנה
    kjvRefs:
    - Hosea 4:13
    kjvOsis:
    - Hos.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.14
    scripture: tanakh
    name: Tanakh Hosea 4:14
    ref: Hosea 4:14
    book: Hos
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 14145
    text: I will not punish your daughters when they commit harlotry, Nor your daughters-in-law when they commit adultery; For they themselves consort with lewd women, And they sacrifice with harlots; And the people that is without understanding is distraught.
    translation: JPS 1917
    original: לֹא־אֶפְקוֹד עַל־בְּנוֹתֵיכֶם כִּי תִזְנֶינָה וְעַל־כַּלּוֹתֵיכֶם כִּי תְנָאַפְנָה כִּי־הֵם עִם־הַזֹּנוֹת יְפָרֵדוּ וְעִם־הַקְּדֵשׁוֹת יְזַבֵּחוּ וְעָם לֹא־יָבִין יִלָּבֵט׃
    hebrewPlain: לא אפקוד על בנותיכם כי תזנינה ועל כלותיכם כי תנאפנה כי הם עם הזנות יפרדו ועם הקדשות יזבחו ועם לא יבין ילבט
    kjvRefs:
    - Hosea 4:14
    kjvOsis:
    - Hos.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.15
    scripture: tanakh
    name: Tanakh Hosea 4:15
    ref: Hosea 4:15
    book: Hos
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 14146
    text: 'Though thou, Israel, play the harlot, Yet let not Judah become guilty; And come not ye unto Gilgal, Neither go ye up to Beth-aven, Nor swear: ‘As the LORD liveth.’'
    translation: JPS 1917
    original: אִם־זֹנֶה אַתָּה יִשְׂרָאֵל אַל־יֶאְשַׁם יְהוּדָה וְאַל־תָּבֹאוּ הַגִּלְגָּל וְאַל־תַּעֲלוּ בֵּית אָוֶן וְאַל־תִּשָּׁבְעוּ חַי־יְהוָה׃
    hebrewPlain: אם זנה אתה ישראל אל יאשם יהודה ואל תבאו הגלגל ואל תעלו בית און ואל תשבעו חי יהוה
    kjvRefs:
    - Hosea 4:15
    kjvOsis:
    - Hos.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.16
    scripture: tanakh
    name: Tanakh Hosea 4:16
    ref: Hosea 4:16
    book: Hos
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 14147
    text: For Israel is stubborn like a stubborn heifer; Now shall the LORD feed them as a lamb in a large place?
    translation: JPS 1917
    original: כִּי כְּפָרָה סֹרֵרָה סָרַר יִשְׂרָאֵל עַתָּה יִרְעֵם יְהוָה כְּכֶבֶשׂ בַּמֶּרְחָב׃
    hebrewPlain: כי כפרה סררה סרר ישראל עתה ירעם יהוה ככבש במרחב
    kjvRefs:
    - Hosea 4:16
    kjvOsis:
    - Hos.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.17
    scripture: tanakh
    name: Tanakh Hosea 4:17
    ref: Hosea 4:17
    book: Hos
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 14148
    text: Ephraim is joined to idols; Let him alone.
    translation: JPS 1917
    original: חֲבוּר עֲצַבִּים אֶפְרָיִם הַנַּח־לוֹ׃
    hebrewPlain: חבור עצבים אפרים הנח לו
    kjvRefs:
    - Hosea 4:17
    kjvOsis:
    - Hos.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.18
    scripture: tanakh
    name: Tanakh Hosea 4:18
    ref: Hosea 4:18
    book: Hos
    section: neviim
    chapter: 4
    verse: 18
    ordinal: 14149
    text: When their carouse is over, They take to harlotry; Her rulers deeply love dishonour.
    translation: JPS 1917
    original: סָר סָבְאָם הַזְנֵה הִזְנוּ אָהֲבוּ הֵבוּ קָלוֹן מָגִנֶּיהָ׃
    hebrewPlain: סר סבאם הזנה הזנו אהבו הבו קלון מגניה
    kjvRefs:
    - Hosea 4:18
    kjvOsis:
    - Hos.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.4.19
    scripture: tanakh
    name: Tanakh Hosea 4:19
    ref: Hosea 4:19
    book: Hos
    section: neviim
    chapter: 4
    verse: 19
    ordinal: 14150
    text: The wind hath bound her up in her skirts; And they shall be ashamed because of their sacrifices.
    translation: JPS 1917
    original: צָרַר רוּחַ אוֹתָהּ בִּכְנָפֶיהָ וְיֵבֹשׁוּ מִזִּבְחוֹתָם
    hebrewPlain: צרר רוח אותה בכנפיה ויבשו מזבחותם
    kjvRefs:
    - Hosea 4:19
    kjvOsis:
    - Hos.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.4
- type: TanakhVerse
  data:
    osis: Hos.5.1
    scripture: tanakh
    name: Tanakh Hosea 5:1
    ref: Hosea 5:1
    book: Hos
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 14151
    text: Hear this, O ye priests, And attend, ye house of Israel, And give ear, O house of the king, For unto you pertaineth the judgment; For ye have been a snare on Mizpah, And a net spread upon Tabor.
    translation: JPS 1917
    original: שִׁמְעוּ־זֹאת הַכֹּהֲנִים וְהַקְשִׁיבוּ בֵּית יִשְׂרָאֵל וּבֵית הַמֶּלֶךְ הַאֲזִינוּ כִּי לָכֶם הַמִּשְׁפָּט כִּי־פַח הֱיִיתֶם לְמִצְפָּה וְרֶשֶׁת פְּרוּשָׂה עַל־תָּבוֹר׃
    hebrewPlain: שמעו זאת הכהנים והקשיבו בית ישראל ובית המלך האזינו כי לכם המשפט כי פח הייתם למצפה ורשת פרושה על תבור
    kjvRefs:
    - Hosea 5:1
    kjvOsis:
    - Hos.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.2
    scripture: tanakh
    name: Tanakh Hosea 5:2
    ref: Hosea 5:2
    book: Hos
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 14152
    text: And they that fall away are gone deep in making slaughter; And I am rejected of them all.
    translation: JPS 1917
    original: וְשַׁחֲטָה שֵׂטִים הֶעְמִיקוּ וַאֲנִי מוּסָר לְכֻלָּם׃
    hebrewPlain: ושחטה שטים העמיקו ואני מוסר לכלם
    kjvRefs:
    - Hosea 5:2
    kjvOsis:
    - Hos.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.3
    scripture: tanakh
    name: Tanakh Hosea 5:3
    ref: Hosea 5:3
    book: Hos
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 14153
    text: I, even I, know Ephraim, And Israel is not hid from Me; For now, O Ephraim, thou hast committed harlotry, Israel is defiled.
    translation: JPS 1917
    original: אֲנִי יָדַעְתִּי אֶפְרַיִם וְיִשְׂרָאֵל לֹא־נִכְחַד מִמֶּנִּי כִּי עַתָּה הִזְנֵיתָ אֶפְרַיִם נִטְמָא יִשְׂרָאֵל׃
    hebrewPlain: אני ידעתי אפרים וישראל לא נכחד ממני כי עתה הזנית אפרים נטמא ישראל
    kjvRefs:
    - Hosea 5:3
    kjvOsis:
    - Hos.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.4
    scripture: tanakh
    name: Tanakh Hosea 5:4
    ref: Hosea 5:4
    book: Hos
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 14154
    text: Their doings will not suffer them To return unto their God; For the spirit of harlotry is within them, And they know not the LORD.
    translation: JPS 1917
    original: לֹא יִתְּנוּ מַעַלְלֵיהֶם לָשׁוּב אֶל־אֱלֹהֵיהֶם כִּי רוּחַ זְנוּנִים בְּקִרְבָּם וְאֶת־יְהוָה לֹא יָדָעוּ׃
    hebrewPlain: לא יתנו מעלליהם לשוב אל אלהיהם כי רוח זנונים בקרבם ואת יהוה לא ידעו
    kjvRefs:
    - Hosea 5:4
    kjvOsis:
    - Hos.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.5
    scripture: tanakh
    name: Tanakh Hosea 5:5
    ref: Hosea 5:5
    book: Hos
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 14155
    text: But the pride of Israel shall testify to his face; And Israel and Ephraim shall stumble in their iniquity, Judah also shall stumble with them.
    translation: JPS 1917
    original: וְעָנָה גְאוֹן־יִשְׂרָאֵל בְּפָנָיו וְיִשְׂרָאֵל וְאֶפְרַיִם יִכָּשְׁלוּ בַּעֲוֺנָם כָּשַׁל גַּם־יְהוּדָה עִמָּם׃
    hebrewPlain: וענה גאון ישראל בפניו וישראל ואפרים יכשלו בעונם כשל גם יהודה עמם
    kjvRefs:
    - Hosea 5:5
    kjvOsis:
    - Hos.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.6
    scripture: tanakh
    name: Tanakh Hosea 5:6
    ref: Hosea 5:6
    book: Hos
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 14156
    text: With their flocks and with their herds they shall go To seek the LORD, but they shall not find Him; He hath withdrawn Himself from them.
    translation: JPS 1917
    original: בְּצֹאנָם וּבִבְקָרָם יֵלְכוּ לְבַקֵּשׁ אֶת־יְהוָה וְלֹא יִמְצָאוּ חָלַץ מֵהֶם׃
    hebrewPlain: בצאנם ובבקרם ילכו לבקש את יהוה ולא ימצאו חלץ מהם
    kjvRefs:
    - Hosea 5:6
    kjvOsis:
    - Hos.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.7
    scripture: tanakh
    name: Tanakh Hosea 5:7
    ref: Hosea 5:7
    book: Hos
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 14157
    text: They have dealt treacherously against the LORD, For they have begotten strange children; Now shall the new moon devour them with their portions.
    translation: JPS 1917
    original: בַּיהוָה בָּגָדוּ כִּי־בָנִים זָרִים יָלָדוּ עַתָּה יֹאכְלֵם חֹדֶשׁ אֶת־חֶלְקֵיהֶם׃
    hebrewPlain: ביהוה בגדו כי בנים זרים ילדו עתה יאכלם חדש את חלקיהם
    kjvRefs:
    - Hosea 5:7
    kjvOsis:
    - Hos.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.8
    scripture: tanakh
    name: Tanakh Hosea 5:8
    ref: Hosea 5:8
    book: Hos
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 14158
    text: 'Blow ye the horn in Gibeah, And the trumpet in Ramah; Sound an alarm at Beth-aven: ‘Behind thee, O Benjamin! ’'
    translation: JPS 1917
    original: תִּקְעוּ שׁוֹפָר בַּגִּבְעָה חֲצֹצְרָה בָּרָמָה הָרִיעוּ בֵּית אָוֶן אַחֲרֶיךָ בִּנְיָמִין׃
    hebrewPlain: תקעו שופר בגבעה חצצרה ברמה הריעו בית און אחריך בנימין
    kjvRefs:
    - Hosea 5:8
    kjvOsis:
    - Hos.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.9
    scripture: tanakh
    name: Tanakh Hosea 5:9
    ref: Hosea 5:9
    book: Hos
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 14159
    text: Ephraim shall be desolate in the day of rebuke; Among the tribes of Israel do I make known that which shall surely be. .
    translation: JPS 1917
    original: אֶפְרַיִם לְשַׁמָּה תִהְיֶה בְּיוֹם תּוֹכֵחָה בְּשִׁבְטֵי יִשְׂרָאֵל הוֹדַעְתִּי נֶאֱמָנָה׃
    hebrewPlain: אפרים לשמה תהיה ביום תוכחה בשבטי ישראל הודעתי נאמנה
    kjvRefs:
    - Hosea 5:9
    kjvOsis:
    - Hos.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.10
    scripture: tanakh
    name: Tanakh Hosea 5:10
    ref: Hosea 5:10
    book: Hos
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 14160
    text: The princes of Judah are like them that remove the landmark; I will pour out My wrath upon them like water.
    translation: JPS 1917
    original: הָיוּ שָׂרֵי יְהוּדָה כְּמַסִּיגֵי גְּבוּל עֲלֵיהֶם אֶשְׁפּוֹךְ כַּמַּיִם עֶבְרָתִי׃
    hebrewPlain: היו שרי יהודה כמסיגי גבול עליהם אשפוך כמים עברתי
    kjvRefs:
    - Hosea 5:10
    kjvOsis:
    - Hos.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.11
    scripture: tanakh
    name: Tanakh Hosea 5:11
    ref: Hosea 5:11
    book: Hos
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 14161
    text: Oppressed is Ephraim, crushed in his right; Because he willingly walked after filth.
    translation: JPS 1917
    original: עָשׁוּק אֶפְרַיִם רְצוּץ מִשְׁפָּט כִּי הוֹאִיל הָלַךְ אַחֲרֵי־צָו׃
    hebrewPlain: עשוק אפרים רצוץ משפט כי הואיל הלך אחרי צו
    kjvRefs:
    - Hosea 5:11
    kjvOsis:
    - Hos.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.12
    scripture: tanakh
    name: Tanakh Hosea 5:12
    ref: Hosea 5:12
    book: Hos
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 14162
    text: Therefore am I unto Ephraim as a moth, And to the house of Judah as rottenness.
    translation: JPS 1917
    original: וַאֲנִי כָעָשׁ לְאֶפְרָיִם וְכָרָקָב לְבֵית יְהוּדָה׃
    hebrewPlain: ואני כעש לאפרים וכרקב לבית יהודה
    kjvRefs:
    - Hosea 5:12
    kjvOsis:
    - Hos.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.13
    scripture: tanakh
    name: Tanakh Hosea 5:13
    ref: Hosea 5:13
    book: Hos
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 14163
    text: And when Ephraim saw his sickness, And Judah his wound, Ephraim went to Assyria, And sent to King Contentious; But he is not able to heal you, Neither shall he cure you of your wound.
    translation: JPS 1917
    original: וַיַּרְא אֶפְרַיִם אֶת־חָלְיוֹ וִיהוּדָה אֶת־מְזֹרוֹ וַיֵּלֶךְ אֶפְרַיִם אֶל־אַשּׁוּר וַיִּשְׁלַח אֶל־מֶלֶךְ יָרֵב וְהוּא לֹא יוּכַל לִרְפֹּא לָכֶם וְלֹא־יִגְהֶה מִכֶּם מָזוֹר׃
    hebrewPlain: וירא אפרים את חליו ויהודה את מזרו וילך אפרים אל אשור וישלח אל מלך ירב והוא לא יוכל לרפא לכם ולא יגהה מכם מזור
    kjvRefs:
    - Hosea 5:13
    kjvOsis:
    - Hos.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.14
    scripture: tanakh
    name: Tanakh Hosea 5:14
    ref: Hosea 5:14
    book: Hos
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 14164
    text: For I will be unto Ephraim as a lion, And as a young lion to the house of Judah; I, even I, will tear and go away, I will take away, and there shall be none to deliver.
    translation: JPS 1917
    original: כִּי אָנֹכִי כַשַּׁחַל לְאֶפְרַיִם וְכַכְּפִיר לְבֵית יְהוּדָה אֲנִי אֲנִי אֶטְרֹף וְאֵלֵךְ אֶשָּׂא וְאֵין מַצִּיל׃
    hebrewPlain: כי אנכי כשחל לאפרים וככפיר לבית יהודה אני אני אטרף ואלך אשא ואין מציל
    kjvRefs:
    - Hosea 5:14
    kjvOsis:
    - Hos.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.5.15
    scripture: tanakh
    name: Tanakh Hosea 5:15
    ref: Hosea 5:15
    book: Hos
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 14165
    text: 'I will go and return to My place, Till they acknowledge their guilt, and seek My face; In their trouble they will seek Me earnestly:'
    translation: JPS 1917
    original: אֵלֵךְ אָשׁוּבָה אֶל־מְקוֹמִי עַד אֲשֶׁר־יֶאְשְׁמוּ וּבִקְשׁוּ פָנָי בַּצַּר לָהֶם יְשַׁחֲרֻנְנִי׃
    hebrewPlain: אלך אשובה אל מקומי עד אשר יאשמו ובקשו פני בצר להם ישחרנני
    kjvRefs:
    - Hosea 5:15
    kjvOsis:
    - Hos.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.5
- type: TanakhVerse
  data:
    osis: Hos.6.1
    scripture: tanakh
    name: Tanakh Hosea 6:1
    ref: Hosea 6:1
    book: Hos
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 14166
    text: ’Come, and let us return unto the LORD; For He hath torn, and He will heal us, He hath smitten, and He will bind us up.
    translation: JPS 1917
    original: לְכוּ וְנָשׁוּבָה אֶל־יְהוָה כִּי הוּא טָרָף וְיִרְפָּאֵנוּ יַךְ וְיַחְבְּשֵׁנוּ׃
    hebrewPlain: לכו ונשובה אל יהוה כי הוא טרף וירפאנו יך ויחבשנו
    kjvRefs:
    - Hosea 6:1
    kjvOsis:
    - Hos.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.2
    scripture: tanakh
    name: Tanakh Hosea 6:2
    ref: Hosea 6:2
    book: Hos
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 14167
    text: After two days will He revive us, On the third day He will raise us up, that we may live in His presence.
    translation: JPS 1917
    original: יְחַיֵּנוּ מִיֹּמָיִם בַּיּוֹם הַשְּׁלִישִׁי יְקִמֵנוּ וְנִחְיֶה לְפָנָיו׃
    hebrewPlain: יחינו מימים ביום השלישי יקמנו ונחיה לפניו
    kjvRefs:
    - Hosea 6:2
    kjvOsis:
    - Hos.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.3
    scripture: tanakh
    name: Tanakh Hosea 6:3
    ref: Hosea 6:3
    book: Hos
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 14168
    text: And let us know, eagerly strive to know the LORD, His going forth is sure as the morning; And He shall come unto us as the rain, As the latter rain that watereth the earth.’
    translation: JPS 1917
    original: וְנֵדְעָה נִרְדְּפָה לָדַעַת אֶת־יְהוָה כְּשַׁחַר נָכוֹן מוֹצָאוֹ וְיָבוֹא כַגֶּשֶׁם לָנוּ כְּמַלְקוֹשׁ יוֹרֶה אָרֶץ׃
    hebrewPlain: ונדעה נרדפה לדעת את יהוה כשחר נכון מוצאו ויבוא כגשם לנו כמלקוש יורה ארץ
    kjvRefs:
    - Hosea 6:3
    kjvOsis:
    - Hos.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.4
    scripture: tanakh
    name: Tanakh Hosea 6:4
    ref: Hosea 6:4
    book: Hos
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 14169
    text: O Ephraim, what shall I do unto thee? O Judah, what shall I do unto thee? For your goodness is as a morning cloud, And as the dew that early passeth away.
    translation: JPS 1917
    original: מָה אֶעֱשֶׂה־לְּךָ אֶפְרַיִם מָה אֶעֱשֶׂה־לְּךָ יְהוּדָה וְחַסְדְּכֶם כַּעֲנַן־בֹּקֶר וְכַטַּל מַשְׁכִּים הֹלֵךְ׃
    hebrewPlain: מה אעשה לך אפרים מה אעשה לך יהודה וחסדכם כענן בקר וכטל משכים הלך
    kjvRefs:
    - Hosea 6:4
    kjvOsis:
    - Hos.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.5
    scripture: tanakh
    name: Tanakh Hosea 6:5
    ref: Hosea 6:5
    book: Hos
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 14170
    text: Therefore have I hewed them by the prophets, I have slain them by the words of My mouth; And thy judgment goeth forth as the light.
    translation: JPS 1917
    original: עַל־כֵּן חָצַבְתִּי בַּנְּבִיאִים הֲרַגְתִּים בְּאִמְרֵי־פִי וּמִשְׁפָּטֶיךָ אוֹר יֵצֵא׃
    hebrewPlain: על כן חצבתי בנביאים הרגתים באמרי פי ומשפטיך אור יצא
    kjvRefs:
    - Hosea 6:5
    kjvOsis:
    - Hos.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.6
    scripture: tanakh
    name: Tanakh Hosea 6:6
    ref: Hosea 6:6
    book: Hos
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 14171
    text: For I desire mercy, and not sacrifice, And the knowledge of God rather than burnt-offerings.
    translation: JPS 1917
    original: כִּי חֶסֶד חָפַצְתִּי וְלֹא־זָבַח וְדַעַת אֱלֹהִים מֵעֹלוֹת׃
    hebrewPlain: כי חסד חפצתי ולא זבח ודעת אלהים מעלות
    kjvRefs:
    - Hosea 6:6
    kjvOsis:
    - Hos.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.7
    scripture: tanakh
    name: Tanakh Hosea 6:7
    ref: Hosea 6:7
    book: Hos
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 14172
    text: But they like men have transgressed the covenant; There have they dealt treacherously against Me.
    translation: JPS 1917
    original: וְהֵמָּה כְּאָדָם עָבְרוּ בְרִית שָׁם בָּגְדוּ בִי׃
    hebrewPlain: והמה כאדם עברו ברית שם בגדו בי
    kjvRefs:
    - Hosea 6:7
    kjvOsis:
    - Hos.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.8
    scripture: tanakh
    name: Tanakh Hosea 6:8
    ref: Hosea 6:8
    book: Hos
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 14173
    text: Gilead is a city of them that work iniquity, It is covered with footprints of blood.
    translation: JPS 1917
    original: גִּלְעָד קִרְיַת פֹּעֲלֵי אָוֶן עֲקֻבָּה מִדָּם׃
    hebrewPlain: גלעד קרית פעלי און עקבה מדם
    kjvRefs:
    - Hosea 6:8
    kjvOsis:
    - Hos.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.9
    scripture: tanakh
    name: Tanakh Hosea 6:9
    ref: Hosea 6:9
    book: Hos
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 14174
    text: And as troops of robbers wait for a man, So doth the company of priests; They murder in the way toward Shechem; Yea, they commit enormity.
    translation: JPS 1917
    original: וּכְחַכֵּי אִישׁ גְּדוּדִים חֶבֶר כֹּהֲנִים דֶּרֶךְ יְרַצְּחוּ־שֶׁכְמָה כִּי זִמָּה עָשׂוּ׃
    hebrewPlain: וכחכי איש גדודים חבר כהנים דרך ירצחו שכמה כי זמה עשו
    kjvRefs:
    - Hosea 6:9
    kjvOsis:
    - Hos.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.10
    scripture: tanakh
    name: Tanakh Hosea 6:10
    ref: Hosea 6:10
    book: Hos
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 14175
    text: In the house of Israel I have seen a horrible thing; There harlotry is found in Ephraim, Israel is defiled.
    translation: JPS 1917
    original: בְּבֵית יִשְׂרָאֵל רָאִיתִי שעריריה [שַׁעֲרוּרִיָּה] שָׁם זְנוּת לְאֶפְרַיִם נִטְמָא יִשְׂרָאֵל׃
    hebrewPlain: בבית ישראל ראיתי שעריריה [שערוריה] שם זנות לאפרים נטמא ישראל
    kjvRefs:
    - Hosea 6:10
    kjvOsis:
    - Hos.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.6.11
    scripture: tanakh
    name: Tanakh Hosea 6:11
    ref: Hosea 6:11
    book: Hos
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 14176
    text: Also, O Judah, there is a harvest appointed for thee! When I would turn the captivity of My people,
    translation: JPS 1917
    original: גַּם־יְהוּדָה שָׁת קָצִיר לָךְ בְּשׁוּבִי שְׁבוּת עַמִּי׃
    hebrewPlain: גם יהודה שת קציר לך בשובי שבות עמי
    kjvRefs:
    - Hosea 6:11
    kjvOsis:
    - Hos.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.6
- type: TanakhVerse
  data:
    osis: Hos.7.1
    scripture: tanakh
    name: Tanakh Hosea 7:1
    ref: Hosea 7:1
    book: Hos
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 14177
    text: When I would heal Israel, Then is the iniquity of Ephraim uncovered, And the wickedness of Samaria, For they commit falsehood; And the thief entereth in, And the troop of robbers maketh a raid without.
    translation: JPS 1917
    original: כְּרָפְאִי לְיִשְׂרָאֵל וְנִגְלָה עֲוֺן אֶפְרַיִם וְרָעוֹת שֹׁמְרוֹן כִּי פָעֲלוּ שָׁקֶר וְגַנָּב יָבוֹא פָּשַׁט גְּדוּד בַּחוּץ׃
    hebrewPlain: כרפאי לישראל ונגלה עון אפרים ורעות שמרון כי פעלו שקר וגנב יבוא פשט גדוד בחוץ
    kjvRefs:
    - Hosea 7:1
    kjvOsis:
    - Hos.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.2
    scripture: tanakh
    name: Tanakh Hosea 7:2
    ref: Hosea 7:2
    book: Hos
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 14178
    text: And let them not say to their heart— I remember all their wickedness; Now their own doings have beset them about, They are before My face.
    translation: JPS 1917
    original: וּבַל־יֹאמְרוּ לִלְבָבָם כָּל־רָעָתָם זָכָרְתִּי עַתָּה סְבָבוּם מַעַלְלֵיהֶם נֶגֶד פָּנַי הָיוּ׃
    hebrewPlain: ובל יאמרו ללבבם כל רעתם זכרתי עתה סבבום מעלליהם נגד פני היו
    kjvRefs:
    - Hosea 7:2
    kjvOsis:
    - Hos.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.3
    scripture: tanakh
    name: Tanakh Hosea 7:3
    ref: Hosea 7:3
    book: Hos
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 14179
    text: They make the king glad with their wickedness, And the princes with their lies.
    translation: JPS 1917
    original: בְּרָעָתָם יְשַׂמְּחוּ־מֶלֶךְ וּבְכַחֲשֵׁיהֶם שָׂרִים׃
    hebrewPlain: ברעתם ישמחו מלך ובכחשיהם שרים
    kjvRefs:
    - Hosea 7:3
    kjvOsis:
    - Hos.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.4
    scripture: tanakh
    name: Tanakh Hosea 7:4
    ref: Hosea 7:4
    book: Hos
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 14180
    text: They are all adulterers, As an oven heated by the baker, Who ceaseth to stir From the kneading of the dough until it be leavened.
    translation: JPS 1917
    original: כֻּלָּם מְנָאֲפִים כְּמוֹ תַנּוּר בֹּעֵרָה מֵאֹפֶה יִשְׁבּוֹת מֵעִיר מִלּוּשׁ בָּצֵק עַד־חֻמְצָתוֹ׃
    hebrewPlain: כלם מנאפים כמו תנור בערה מאפה ישבות מעיר מלוש בצק עד חמצתו
    kjvRefs:
    - Hosea 7:4
    kjvOsis:
    - Hos.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.5
    scripture: tanakh
    name: Tanakh Hosea 7:5
    ref: Hosea 7:5
    book: Hos
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 14181
    text: On the day of our king The princes make him sick with the heat of wine, He stretcheth out his hand with scorners.
    translation: JPS 1917
    original: יוֹם מַלְכֵּנוּ הֶחֱלוּ שָׂרִים חֲמַת מִיָּיִן מָשַׁךְ יָדוֹ אֶת־לֹצְצִים׃
    hebrewPlain: יום מלכנו החלו שרים חמת מיין משך ידו את לצצים
    kjvRefs:
    - Hosea 7:5
    kjvOsis:
    - Hos.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.6
    scripture: tanakh
    name: Tanakh Hosea 7:6
    ref: Hosea 7:6
    book: Hos
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 14182
    text: For they have made ready their heart like an oven, while they lie in wait; Their baker sleepeth all the night, In the morning it burneth as a flaming fire.
    translation: JPS 1917
    original: כִּי־קֵרְבוּ כַתַּנּוּר לִבָּם בְּאָרְבָּם כָּל־הַלַּיְלָה יָשֵׁן אֹפֵהֶם בֹּקֶר הוּא בֹעֵר כְּאֵשׁ לֶהָבָה׃
    hebrewPlain: כי קרבו כתנור לבם בארבם כל הלילה ישן אפהם בקר הוא בער כאש להבה
    kjvRefs:
    - Hosea 7:6
    kjvOsis:
    - Hos.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.7
    scripture: tanakh
    name: Tanakh Hosea 7:7
    ref: Hosea 7:7
    book: Hos
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 14183
    text: They are all hot as an oven, And devour their judges; All their kings are fallen, There is none among them that calleth unto Me.
    translation: JPS 1917
    original: כֻּלָּם יֵחַמּוּ כַּתַּנּוּר וְאָכְלוּ אֶת־שֹׁפְטֵיהֶם כָּל־מַלְכֵיהֶם נָפָלוּ אֵין־קֹרֵא בָהֶם אֵלָי׃
    hebrewPlain: כלם יחמו כתנור ואכלו את שפטיהם כל מלכיהם נפלו אין קרא בהם אלי
    kjvRefs:
    - Hosea 7:7
    kjvOsis:
    - Hos.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.8
    scripture: tanakh
    name: Tanakh Hosea 7:8
    ref: Hosea 7:8
    book: Hos
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 14184
    text: Ephraim, he mixeth himself with the peoples; Ephraim is become a cake not turned.
    translation: JPS 1917
    original: אֶפְרַיִם בָּעַמִּים הוּא יִתְבּוֹלָל אֶפְרַיִם הָיָה עֻגָה בְּלִי הֲפוּכָה׃
    hebrewPlain: אפרים בעמים הוא יתבולל אפרים היה עגה בלי הפוכה
    kjvRefs:
    - Hosea 7:8
    kjvOsis:
    - Hos.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.9
    scripture: tanakh
    name: Tanakh Hosea 7:9
    ref: Hosea 7:9
    book: Hos
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 14185
    text: Strangers have devoured his strength, And he knoweth it not; Yea, gray hairs are here and there upon him, And he knoweth it not.
    translation: JPS 1917
    original: אָכְלוּ זָרִים כֹּחוֹ וְהוּא לֹא יָדָע גַּם־שֵׂיבָה זָרְקָה בּוֹ וְהוּא לֹא יָדָע׃
    hebrewPlain: אכלו זרים כחו והוא לא ידע גם שיבה זרקה בו והוא לא ידע
    kjvRefs:
    - Hosea 7:9
    kjvOsis:
    - Hos.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.10
    scripture: tanakh
    name: Tanakh Hosea 7:10
    ref: Hosea 7:10
    book: Hos
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 14186
    text: And the pride of Israel testifieth to his face; But they have not returned unto the LORD their God, Nor sought Him, for all this.
    translation: JPS 1917
    original: וְעָנָה גְאוֹן־יִשְׂרָאֵל בְּפָנָיו וְלֹא־שָׁבוּ אֶל־יְהוָה אֱלֹהֵיהֶם וְלֹא בִקְשֻׁהוּ בְּכָל־זֹאת׃
    hebrewPlain: וענה גאון ישראל בפניו ולא שבו אל יהוה אלהיהם ולא בקשהו בכל זאת
    kjvRefs:
    - Hosea 7:10
    kjvOsis:
    - Hos.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.11
    scripture: tanakh
    name: Tanakh Hosea 7:11
    ref: Hosea 7:11
    book: Hos
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 14187
    text: And Ephraim is become like a silly dove, without understanding; They call unto Egypt, they go to Assyria.
    translation: JPS 1917
    original: וַיְהִי אֶפְרַיִם כְּיוֹנָה פוֹתָה אֵין לֵב מִצְרַיִם קָרָאוּ אַשּׁוּר הָלָכוּ׃
    hebrewPlain: ויהי אפרים כיונה פותה אין לב מצרים קראו אשור הלכו
    kjvRefs:
    - Hosea 7:11
    kjvOsis:
    - Hos.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.12
    scripture: tanakh
    name: Tanakh Hosea 7:12
    ref: Hosea 7:12
    book: Hos
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 14188
    text: Even as they go, I will spread My net upon them; I will bring them down as the fowls of the heaven; I will chastise them, as their congregation hath been made to hear.
    translation: JPS 1917
    original: כַּאֲשֶׁר יֵלֵכוּ אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי כְּעוֹף הַשָּׁמַיִם אוֹרִידֵם אַיְסִרֵם כְּשֵׁמַע לַעֲדָתָם׃
    hebrewPlain: כאשר ילכו אפרוש עליהם רשתי כעוף השמים אורידם איסרם כשמע לעדתם
    kjvRefs:
    - Hosea 7:12
    kjvOsis:
    - Hos.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.13
    scripture: tanakh
    name: Tanakh Hosea 7:13
    ref: Hosea 7:13
    book: Hos
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 14189
    text: Woe unto them! for they have strayed from Me; Destruction unto them! for they have transgressed against Me; Shall I then redeem them, Seeing they have spoken lies against Me?
    translation: JPS 1917
    original: אוֹי לָהֶם כִּי־נָדְדוּ מִמֶּנִּי שֹׁד לָהֶם כִּי־פָשְׁעוּ בִי וְאָנֹכִי אֶפְדֵּם וְהֵמָּה דִּבְּרוּ עָלַי כְּזָבִים׃
    hebrewPlain: אוי להם כי נדדו ממני שד להם כי פשעו בי ואנכי אפדם והמה דברו עלי כזבים
    kjvRefs:
    - Hosea 7:13
    kjvOsis:
    - Hos.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.14
    scripture: tanakh
    name: Tanakh Hosea 7:14
    ref: Hosea 7:14
    book: Hos
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 14190
    text: And they have not cried unto Me with their heart, Though they wail upon their beds; They assemble themselves for corn and wine, they rebel against Me.
    translation: JPS 1917
    original: וְלֹא־זָעֲקוּ אֵלַי בְּלִבָּם כִּי יְיֵלִילוּ עַל־מִשְׁכְּבוֹתָם עַל־דָּגָן וְתִירוֹשׁ יִתְגּוֹרָרוּ יָסוּרוּ בִי׃
    hebrewPlain: ולא זעקו אלי בלבם כי יילילו על משכבותם על דגן ותירוש יתגוררו יסורו בי
    kjvRefs:
    - Hosea 7:14
    kjvOsis:
    - Hos.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.15
    scripture: tanakh
    name: Tanakh Hosea 7:15
    ref: Hosea 7:15
    book: Hos
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 14191
    text: Though I have trained and strengthened their arms, Yet do they devise evil against Me.
    translation: JPS 1917
    original: וַאֲנִי יִסַּרְתִּי חִזַּקְתִּי זְרוֹעֹתָם וְאֵלַי יְחַשְּׁבוּ־רָע׃
    hebrewPlain: ואני יסרתי חזקתי זרועתם ואלי יחשבו רע
    kjvRefs:
    - Hosea 7:15
    kjvOsis:
    - Hos.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.7.16
    scripture: tanakh
    name: Tanakh Hosea 7:16
    ref: Hosea 7:16
    book: Hos
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 14192
    text: They return, but not upwards; They are become like a deceitful bow; Their princes shall fall by the sword for the rage of their tongue; This shall be their derision in the land of Egypt.
    translation: JPS 1917
    original: יָשׁוּבוּ לֹא עָל הָיוּ כְּקֶשֶׁת רְמִיָּה יִפְּלוּ בַחֶרֶב שָׂרֵיהֶם מִזַּעַם לְשׁוֹנָם זוֹ לַעְגָּם בְּאֶרֶץ מִצְרָיִם׃
    hebrewPlain: ישובו לא על היו כקשת רמיה יפלו בחרב שריהם מזעם לשונם זו לעגם בארץ מצרים
    kjvRefs:
    - Hosea 7:16
    kjvOsis:
    - Hos.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.7
- type: TanakhVerse
  data:
    osis: Hos.8.1
    scripture: tanakh
    name: Tanakh Hosea 8:1
    ref: Hosea 8:1
    book: Hos
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 14193
    text: Set the horn to thy mouth. As a vulture he cometh against the house of the LORD; Because they have transgressed My covenant, And trespassed against My law.
    translation: JPS 1917
    original: אֶל־חִכְּךָ שֹׁפָר כַּנֶּשֶׁר עַל־בֵּית יְהוָה יַעַן עָבְרוּ בְרִיתִי וְעַל־תּוֹרָתִי פָּשָׁעוּ׃
    hebrewPlain: אל חכך שפר כנשר על בית יהוה יען עברו בריתי ועל תורתי פשעו
    kjvRefs:
    - Hosea 8:1
    kjvOsis:
    - Hos.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.2
    scripture: tanakh
    name: Tanakh Hosea 8:2
    ref: Hosea 8:2
    book: Hos
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 14194
    text: 'Will they cry unto Me: ‘My God, we Israel know Thee’?'
    translation: JPS 1917
    original: לִי יִזְעָקוּ אֱלֹהַי יְדַעֲנוּךָ יִשְׂרָאֵל׃
    hebrewPlain: לי יזעקו אלהי ידענוך ישראל
    kjvRefs:
    - Hosea 8:2
    kjvOsis:
    - Hos.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.3
    scripture: tanakh
    name: Tanakh Hosea 8:3
    ref: Hosea 8:3
    book: Hos
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 14195
    text: Israel hath cast off that which is good; the enemy shall pursue him.
    translation: JPS 1917
    original: זָנַח יִשְׂרָאֵל טוֹב אוֹיֵב יִרְדְּפוֹ׃
    hebrewPlain: זנח ישראל טוב אויב ירדפו
    kjvRefs:
    - Hosea 8:3
    kjvOsis:
    - Hos.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.4
    scripture: tanakh
    name: Tanakh Hosea 8:4
    ref: Hosea 8:4
    book: Hos
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 14196
    text: They have set up kings, but not from Me, they have made princes, and I knew it not; of their silver and their gold have they made them idols, that they may be cut off.
    translation: JPS 1917
    original: הֵם הִמְלִיכוּ וְלֹא מִמֶּנִּי הֵשִׂירוּ וְלֹא יָדָעְתִּי כַּסְפָּם וּזְהָבָם עָשׂוּ לָהֶם עֲצַבִּים לְמַעַן יִכָּרֵת׃
    hebrewPlain: הם המליכו ולא ממני השירו ולא ידעתי כספם וזהבם עשו להם עצבים למען יכרת
    kjvRefs:
    - Hosea 8:4
    kjvOsis:
    - Hos.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.5
    scripture: tanakh
    name: Tanakh Hosea 8:5
    ref: Hosea 8:5
    book: Hos
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 14197
    text: Thy calf, O Samaria, is cast off; mine anger is kindled against them; how long will it be ere they attain to innocency?
    translation: JPS 1917
    original: זָנַח עֶגְלֵךְ שֹׁמְרוֹן חָרָה אַפִּי בָּם עַד־מָתַי לֹא יוּכְלוּ נִקָּיֹן׃
    hebrewPlain: זנח עגלך שמרון חרה אפי בם עד מתי לא יוכלו נקין
    kjvRefs:
    - Hosea 8:5
    kjvOsis:
    - Hos.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.6
    scripture: tanakh
    name: Tanakh Hosea 8:6
    ref: Hosea 8:6
    book: Hos
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 14198
    text: 'For from Israel is even this: The craftsman made it, and it is no God; yea, the calf of Samaria shall be broken in shivers.'
    translation: JPS 1917
    original: כִּי מִיִּשְׂרָאֵל וְהוּא חָרָשׁ עָשָׂהוּ וְלֹא אֱלֹהִים הוּא כִּי־שְׁבָבִים יִהְיֶה עֵגֶל שֹׁמְרוֹן׃
    hebrewPlain: כי מישראל והוא חרש עשהו ולא אלהים הוא כי שבבים יהיה עגל שמרון
    kjvRefs:
    - Hosea 8:6
    kjvOsis:
    - Hos.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.7
    scripture: tanakh
    name: Tanakh Hosea 8:7
    ref: Hosea 8:7
    book: Hos
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 14199
    text: For they sow the wind, and they shall reap the whirlwind; it hath no stalk, the bud that shall yield no meal; if so be it yield, strangers shall swallow it up.
    translation: JPS 1917
    original: כִּי רוּחַ יִזְרָעוּ וְסוּפָתָה יִקְצֹרוּ קָמָה אֵין־לוֹ צֶמַח בְּלִי יַעֲשֶׂה־קֶּמַח אוּלַי יַעֲשֶׂה זָרִים יִבְלָעֻהוּ׃
    hebrewPlain: כי רוח יזרעו וסופתה יקצרו קמה אין לו צמח בלי יעשה קמח אולי יעשה זרים יבלעהו
    kjvRefs:
    - Hosea 8:7
    kjvOsis:
    - Hos.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.8
    scripture: tanakh
    name: Tanakh Hosea 8:8
    ref: Hosea 8:8
    book: Hos
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 14200
    text: Israel is swallowed up; now are they become among the nations as a vessel wherein is no value.
    translation: JPS 1917
    original: נִבְלַע יִשְׂרָאֵל עַתָּה הָיוּ בַגּוֹיִם כִּכְלִי אֵין־חֵפֶץ בּוֹ׃
    hebrewPlain: נבלע ישראל עתה היו בגוים ככלי אין חפץ בו
    kjvRefs:
    - Hosea 8:8
    kjvOsis:
    - Hos.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.9
    scripture: tanakh
    name: Tanakh Hosea 8:9
    ref: Hosea 8:9
    book: Hos
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 14201
    text: For they are gone up to Assyria, like a wild ass alone by himself; Ephraim hath hired lovers.
    translation: JPS 1917
    original: כִּי־הֵמָּה עָלוּ אַשּׁוּר פֶּרֶא בּוֹדֵד לוֹ אֶפְרַיִם הִתְנוּ אֲהָבִים
    hebrewPlain: כי המה עלו אשור פרא בודד לו אפרים התנו אהבים
    kjvRefs:
    - Hosea 8:9
    kjvOsis:
    - Hos.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.10
    scripture: tanakh
    name: Tanakh Hosea 8:10
    ref: Hosea 8:10
    book: Hos
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 14202
    text: Yea, though they hire among the nations, now will I gather them up; and they begin to be minished by reason of the burden of king and princes.
    translation: JPS 1917
    original: גַּם כִּי־יִתְנוּ בַגּוֹיִם עַתָּה אֲקַבְּצֵם וַיָּחֵלּוּ מְּעָט מִמַּשָּׂא מֶלֶךְ שָׂרִים׃
    hebrewPlain: גם כי יתנו בגוים עתה אקבצם ויחלו מעט ממשא מלך שרים
    kjvRefs:
    - Hosea 8:10
    kjvOsis:
    - Hos.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.11
    scripture: tanakh
    name: Tanakh Hosea 8:11
    ref: Hosea 8:11
    book: Hos
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 14203
    text: For Ephraim hath multiplied altars to sin, yea, altars have been unto him to sin. .
    translation: JPS 1917
    original: כִּי־הִרְבָּה אֶפְרַיִם מִזְבְּחֹת לַחֲטֹא הָיוּ־לוֹ מִזְבְּחוֹת לַחֲטֹא׃
    hebrewPlain: כי הרבה אפרים מזבחת לחטא היו לו מזבחות לחטא
    kjvRefs:
    - Hosea 8:11
    kjvOsis:
    - Hos.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.12
    scripture: tanakh
    name: Tanakh Hosea 8:12
    ref: Hosea 8:12
    book: Hos
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 14204
    text: Though I write for him never so many things of My Law, they are accounted as a stranger’s.
    translation: JPS 1917
    original: אכתוב־[אֶכְתָּב־] לוֹ רבו [רֻבֵּי] תּוֹרָתִי כְּמוֹ־זָר נֶחְשָׁבוּ׃
    hebrewPlain: אכתוב [אכתב ] לו רבו [רבי] תורתי כמו זר נחשבו
    kjvRefs:
    - Hosea 8:12
    kjvOsis:
    - Hos.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.13
    scripture: tanakh
    name: Tanakh Hosea 8:13
    ref: Hosea 8:13
    book: Hos
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 14205
    text: As for the sacrifices that are made by fire unto Me, let them sacrifice flesh and eat it, For the LORD accepteth them not. Now will He remember their iniquity, and punish their sins; They shall return to Egypt.
    translation: JPS 1917
    original: זִבְחֵי הַבְהָבַי יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ יְהוָה לֹא רָצָם עַתָּה יִזְכֹּר עֲוֺנָם וְיִפְקֹד חַטֹּאותָם הֵמָּה מִצְרַיִם יָשׁוּבוּ׃
    hebrewPlain: זבחי הבהבי יזבחו בשר ויאכלו יהוה לא רצם עתה יזכר עונם ויפקד חטאותם המה מצרים ישובו
    kjvRefs:
    - Hosea 8:13
    kjvOsis:
    - Hos.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.8.14
    scripture: tanakh
    name: Tanakh Hosea 8:14
    ref: Hosea 8:14
    book: Hos
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 14206
    text: For Israel hath forgotten his Maker, And builded palaces, And Judah hath multiplied fortified cities; But I will send a fire upon his cities, And it shall devour the castles thereof.
    translation: JPS 1917
    original: וַיִּשְׁכַּח יִשְׂרָאֵל אֶת־עֹשֵׂהוּ וַיִּבֶן הֵיכָלוֹת וִיהוּדָה הִרְבָּה עָרִים בְּצֻרוֹת וְשִׁלַּחְתִּי־אֵשׁ בְּעָרָיו וְאָכְלָה אַרְמְנֹתֶיהָ׃
    hebrewPlain: וישכח ישראל את עשהו ויבן היכלות ויהודה הרבה ערים בצרות ושלחתי אש בעריו ואכלה ארמנתיה
    kjvRefs:
    - Hosea 8:14
    kjvOsis:
    - Hos.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.8
- type: TanakhVerse
  data:
    osis: Hos.9.1
    scripture: tanakh
    name: Tanakh Hosea 9:1
    ref: Hosea 9:1
    book: Hos
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 14207
    text: Rejoice not, O Israel, unto exultation, like the peoples, For thou hast gone astray from thy God, Thou hast loved a harlot’s hire upon every corn-floor.
    translation: JPS 1917
    original: אַל־תִּשְׂמַח יִשְׂרָאֵל אֶל־גִּיל כָּעַמִּים כִּי זָנִיתָ מֵעַל אֱלֹהֶיךָ אָהַבְתָּ אֶתְנָן עַל כָּל־גָּרְנוֹת דָּגָן׃
    hebrewPlain: אל תשמח ישראל אל גיל כעמים כי זנית מעל אלהיך אהבת אתנן על כל גרנות דגן
    kjvRefs:
    - Hosea 9:1
    kjvOsis:
    - Hos.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.2
    scripture: tanakh
    name: Tanakh Hosea 9:2
    ref: Hosea 9:2
    book: Hos
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 14208
    text: The threshing-floor and the wine-press shall not feed them, And the new wine shall fail her.
    translation: JPS 1917
    original: גֹּרֶן וָיֶקֶב לֹא יִרְעֵם וְתִירוֹשׁ יְכַחֶשׁ בָּהּ׃
    hebrewPlain: גרן ויקב לא ירעם ותירוש יכחש בה
    kjvRefs:
    - Hosea 9:2
    kjvOsis:
    - Hos.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.3
    scripture: tanakh
    name: Tanakh Hosea 9:3
    ref: Hosea 9:3
    book: Hos
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 14209
    text: They shall not dwell in the LORD’S land; But Ephraim shall return to Egypt, And they shall eat unclean food in Assyria.
    translation: JPS 1917
    original: לֹא יֵשְׁבוּ בְּאֶרֶץ יְהוָה וְשָׁב אֶפְרַיִם מִצְרַיִם וּבְאַשּׁוּר טָמֵא יֹאכֵלוּ׃
    hebrewPlain: לא ישבו בארץ יהוה ושב אפרים מצרים ובאשור טמא יאכלו
    kjvRefs:
    - Hosea 9:3
    kjvOsis:
    - Hos.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.4
    scripture: tanakh
    name: Tanakh Hosea 9:4
    ref: Hosea 9:4
    book: Hos
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 14210
    text: They shall not pour out wine-offerings to the LORD, Neither shall they be pleasing unto Him; Their sacrifices shall be unto them as the bread of mourners, All that eat thereof shall be polluted; For their bread shall be for their appetite, It shall not come into the house of the LORD.
    translation: JPS 1917
    original: לֹא־יִסְּכוּ לַיהוָה יַיִן וְלֹא יֶעֶרְבוּ־לוֹ זִבְחֵיהֶם כְּלֶחֶם אוֹנִים לָהֶם כָּל־אֹכְלָיו יִטַמָּאוּ כִּי־לַחְמָם לְנַפְשָׁם לֹא יָבוֹא בֵּית יְהוָה׃
    hebrewPlain: לא יסכו ליהוה יין ולא יערבו לו זבחיהם כלחם אונים להם כל אכליו יטמאו כי לחמם לנפשם לא יבוא בית יהוה
    kjvRefs:
    - Hosea 9:4
    kjvOsis:
    - Hos.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.5
    scripture: tanakh
    name: Tanakh Hosea 9:5
    ref: Hosea 9:5
    book: Hos
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 14211
    text: What will ye do in the day of the appointed season, And in the day of the feast of the LORD?
    translation: JPS 1917
    original: מַה־תַּעֲשׂוּ לְיוֹם מוֹעֵד וּלְיוֹם חַג־יְהוָה׃
    hebrewPlain: מה תעשו ליום מועד וליום חג יהוה
    kjvRefs:
    - Hosea 9:5
    kjvOsis:
    - Hos.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.6
    scripture: tanakh
    name: Tanakh Hosea 9:6
    ref: Hosea 9:6
    book: Hos
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 14212
    text: For, lo, they are gone away from destruction, Yet Egypt shall gather them up, Memphis shall bury them; Their precious treasures of silver, nettles shall possess them, Thorns shall be in their tents.
    translation: JPS 1917
    original: כִּי־הִנֵּה הָלְכוּ מִשֹּׁד מִצְרַיִם תְּקַבְּצֵם מֹף תְּקַבְּרֵם מַחְמַד לְכַסְפָּם קִמּוֹשׂ יִירָשֵׁם חוֹחַ בְּאָהֳלֵיהֶם׃
    hebrewPlain: כי הנה הלכו משד מצרים תקבצם מף תקברם מחמד לכספם קמוש יירשם חוח באהליהם
    kjvRefs:
    - Hosea 9:6
    kjvOsis:
    - Hos.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.7
    scripture: tanakh
    name: Tanakh Hosea 9:7
    ref: Hosea 9:7
    book: Hos
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 14213
    text: The days of visitation are come, The days of recompense are come, Israel shall know it. The prophet is a fool, the man of the spirit is mad! For the multitude of thine iniquity, the enmity is great.
    translation: JPS 1917
    original: בָּאוּ יְמֵי הַפְּקֻדָּה בָּאוּ יְמֵי הַשִׁלֻּם יֵדְעוּ יִשְׂרָאֵל אֱוִיל הַנָּבִיא מְשֻׁגָּע אִישׁ הָרוּחַ עַל רֹב עֲוֺנְךָ וְרַבָּה מַשְׂטֵמָה׃
    hebrewPlain: באו ימי הפקדה באו ימי השלם ידעו ישראל אויל הנביא משגע איש הרוח על רב עונך ורבה משטמה
    kjvRefs:
    - Hosea 9:7
    kjvOsis:
    - Hos.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.8
    scripture: tanakh
    name: Tanakh Hosea 9:8
    ref: Hosea 9:8
    book: Hos
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 14214
    text: Ephraim is a watchman with my God; As for the prophet, a fowler’s snare is in all his ways, And enmity in the house of his God.
    translation: JPS 1917
    original: צֹפֶה אֶפְרַיִם עִם־אֱלֹהָי נָבִיא פַּח יָקוֹשׁ עַל־כָּל־דְּרָכָיו מַשְׂטֵמָה בְּבֵית אֱלֹהָיו׃
    hebrewPlain: צפה אפרים עם אלהי נביא פח יקוש על כל דרכיו משטמה בבית אלהיו
    kjvRefs:
    - Hosea 9:8
    kjvOsis:
    - Hos.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.9
    scripture: tanakh
    name: Tanakh Hosea 9:9
    ref: Hosea 9:9
    book: Hos
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 14215
    text: They have deeply corrupted themselves, As in the days of Gibeah; He will remember their iniquity, He will punish their sins.
    translation: JPS 1917
    original: הֶעְמִיקוּ־שִׁחֵתוּ כִּימֵי הַגִּבְעָה יִזְכּוֹר עֲוֺנָם יִפְקוֹד חַטֹּאותָם׃
    hebrewPlain: העמיקו שחתו כימי הגבעה יזכור עונם יפקוד חטאותם
    kjvRefs:
    - Hosea 9:9
    kjvOsis:
    - Hos.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.10
    scripture: tanakh
    name: Tanakh Hosea 9:10
    ref: Hosea 9:10
    book: Hos
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 14216
    text: I found Israel like grapes in the wilderness, I saw your fathers as the first-ripe in the fig-tree at her first season; But so soon as they came to Baal-peor, They separated themselves unto the shameful thing, And became detestable like that which they loved.
    translation: JPS 1917
    original: כַּעֲנָבִים בַּמִּדְבָּר מָצָאתִי יִשְׂרָאֵל כְּבִכּוּרָה בִתְאֵנָה בְּרֵאשִׁיתָהּ רָאִיתִי אֲבוֹתֵיכֶם הֵמָּה בָּאוּ בַעַל־פְּעוֹר וַיִּנָּזְרוּ לַבֹּשֶׁת וַיִּהְיוּ שִׁקּוּצִים כְּאָהֳבָם׃
    hebrewPlain: כענבים במדבר מצאתי ישראל כבכורה בתאנה בראשיתה ראיתי אבותיכם המה באו בעל פעור וינזרו לבשת ויהיו שקוצים כאהבם
    kjvRefs:
    - Hosea 9:10
    kjvOsis:
    - Hos.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.11
    scripture: tanakh
    name: Tanakh Hosea 9:11
    ref: Hosea 9:11
    book: Hos
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 14217
    text: As for Ephraim, their glory shall fly away like a bird; There shall be no birth, and none with child, and no conception.
    translation: JPS 1917
    original: אֶפְרַיִם כָּעוֹף יִתְעוֹפֵף כְּבוֹדָם מִלֵּדָה וּמִבֶּטֶן וּמֵהֵרָיוֹן׃
    hebrewPlain: אפרים כעוף יתעופף כבודם מלדה ומבטן ומהריון
    kjvRefs:
    - Hosea 9:11
    kjvOsis:
    - Hos.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.12
    scripture: tanakh
    name: Tanakh Hosea 9:12
    ref: Hosea 9:12
    book: Hos
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 14218
    text: Yea, though they bring up their children, Yet will I bereave them, that there be not a man left; Yea, woe also to them when I depart from them!
    translation: JPS 1917
    original: כִּי אִם־יְגַדְּלוּ אֶת־בְּנֵיהֶם וְשִׁכַּלְתִּים מֵאָדָם כִּי־גַם־אוֹי לָהֶם בְּשׂוּרִי מֵהֶם׃
    hebrewPlain: כי אם יגדלו את בניהם ושכלתים מאדם כי גם אוי להם בשורי מהם
    kjvRefs:
    - Hosea 9:12
    kjvOsis:
    - Hos.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.13
    scripture: tanakh
    name: Tanakh Hosea 9:13
    ref: Hosea 9:13
    book: Hos
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 14219
    text: Ephraim, like as I have seen Tyre, is planted in a pleasant place; But Ephraim shall bring forth his children to the slayer.
    translation: JPS 1917
    original: אֶפְרַיִם כַּאֲשֶׁר־רָאִיתִי לְצוֹר שְׁתוּלָה בְנָוֶה וְאֶפְרַיִם לְהוֹצִיא אֶל־הֹרֵג בָּנָיו׃
    hebrewPlain: אפרים כאשר ראיתי לצור שתולה בנוה ואפרים להוציא אל הרג בניו
    kjvRefs:
    - Hosea 9:13
    kjvOsis:
    - Hos.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.14
    scripture: tanakh
    name: Tanakh Hosea 9:14
    ref: Hosea 9:14
    book: Hos
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 14220
    text: Give them, O LORD, whatsoever Thou wilt give; Give them a miscarrying womb and dry breasts.
    translation: JPS 1917
    original: תֵּן־לָהֶם יְהוָה מַה־תִּתֵּן תֵּן־לָהֶם רֶחֶם מַשְׁכִּיל וְשָׁדַיִם צֹמְקִים׃
    hebrewPlain: תן להם יהוה מה תתן תן להם רחם משכיל ושדים צמקים
    kjvRefs:
    - Hosea 9:14
    kjvOsis:
    - Hos.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.15
    scripture: tanakh
    name: Tanakh Hosea 9:15
    ref: Hosea 9:15
    book: Hos
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 14221
    text: All their wickedness is in Gilgal, For there I hated them; Because of the wickedness of their doings I will drive them out of My house; I will love them no more, All their princes are rebellious.
    translation: JPS 1917
    original: כָּל־רָעָתָם בַּגִּלְגָּל כִּי־שָׁם שְׂנֵאתִים עַל רֹעַ מַעַלְלֵיהֶם מִבֵּיתִי אֲגָרְשֵׁם לֹא אוֹסֵף אַהֲבָתָם כָּל־שָׂרֵיהֶם סֹרְרִים׃
    hebrewPlain: כל רעתם בגלגל כי שם שנאתים על רע מעלליהם מביתי אגרשם לא אוסף אהבתם כל שריהם סררים
    kjvRefs:
    - Hosea 9:15
    kjvOsis:
    - Hos.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.16
    scripture: tanakh
    name: Tanakh Hosea 9:16
    ref: Hosea 9:16
    book: Hos
    section: neviim
    chapter: 9
    verse: 16
    ordinal: 14222
    text: Ephraim is smitten, Their root is dried up, They shall bear no fruit; Yea, though they bring forth, Yet will I slay the beloved fruit of their womb.
    translation: JPS 1917
    original: הֻכָּה אֶפְרַיִם שָׁרְשָׁם יָבֵשׁ פְּרִי בלי־[בַל־] יַעֲשׂוּן גַּם כִּי יֵלֵדוּן וְהֵמַתִּי מַחֲמַדֵּי בִטְנָם׃
    hebrewPlain: הכה אפרים שרשם יבש פרי בלי [בל ] יעשון גם כי ילדון והמתי מחמדי בטנם
    kjvRefs:
    - Hosea 9:16
    kjvOsis:
    - Hos.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.9.17
    scripture: tanakh
    name: Tanakh Hosea 9:17
    ref: Hosea 9:17
    book: Hos
    section: neviim
    chapter: 9
    verse: 17
    ordinal: 14223
    text: My God will cast them away, Because they did not hearken unto Him; And they shall be wanderers among the nations.
    translation: JPS 1917
    original: יִמְאָסֵם אֱלֹהַי כִּי לֹא שָׁמְעוּ לוֹ וְיִהְיוּ נֹדְדִים בַּגּוֹיִם׃
    hebrewPlain: ימאסם אלהי כי לא שמעו לו ויהיו נדדים בגוים
    kjvRefs:
    - Hosea 9:17
    kjvOsis:
    - Hos.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.9
- type: TanakhVerse
  data:
    osis: Hos.10.1
    scripture: tanakh
    name: Tanakh Hosea 10:1
    ref: Hosea 10:1
    book: Hos
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 14224
    text: 'Israel was a luxuriant vine, Which put forth fruit freely: As his fruit increased, He increased his altars; The more goodly his land was, The more goodly were his pillars.'
    translation: JPS 1917
    original: גֶּפֶן בּוֹקֵק יִשְׂרָאֵל פְּרִי יְשַׁוֶּה־לּוֹ כְּרֹב לְפִרְיוֹ הִרְבָּה לַמִּזְבְּחוֹת כְּטוֹב לְאַרְצוֹ הֵיטִיבוּ מַצֵּבוֹת׃
    hebrewPlain: גפן בוקק ישראל פרי ישוה לו כרב לפריו הרבה למזבחות כטוב לארצו היטיבו מצבות
    kjvRefs:
    - Hosea 10:1
    kjvOsis:
    - Hos.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.2
    scripture: tanakh
    name: Tanakh Hosea 10:2
    ref: Hosea 10:2
    book: Hos
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 14225
    text: Their heart is divided; Now shall they bear their guilt; He will break down their altars, He will spoil their pillars.
    translation: JPS 1917
    original: חָלַק לִבָּם עַתָּה יֶאְשָׁמוּ הוּא יַעֲרֹף מִזְבְּחוֹתָם יְשֹׁדֵד מַצֵּבוֹתָם׃
    hebrewPlain: חלק לבם עתה יאשמו הוא יערף מזבחותם ישדד מצבותם
    kjvRefs:
    - Hosea 10:2
    kjvOsis:
    - Hos.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.3
    scripture: tanakh
    name: Tanakh Hosea 10:3
    ref: Hosea 10:3
    book: Hos
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 14226
    text: 'Surely now shall they say: ‘We have no king; For we feared not the LORD; And the king, what can he do for us?’'
    translation: JPS 1917
    original: כִּי עַתָּה יֹאמְרוּ אֵין מֶלֶךְ לָנוּ כִּי לֹא יָרֵאנוּ אֶת־יְהֹוָה וְהַמֶּלֶךְ מַה־יַּעֲשֶׂה־לָּנוּ׃
    hebrewPlain: כי עתה יאמרו אין מלך לנו כי לא יראנו את יהוה והמלך מה יעשה לנו
    kjvRefs:
    - Hosea 10:3
    kjvOsis:
    - Hos.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.4
    scripture: tanakh
    name: Tanakh Hosea 10:4
    ref: Hosea 10:4
    book: Hos
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 14227
    text: They speak words, They swear falsely, they make covenants; Thus judgment springeth up as hemlock In the furrows of the field.
    translation: JPS 1917
    original: דִּבְּרוּ דְבָרִים אָלוֹת שָׁוְא כָּרֹת בְּרִית וּפָרַח כָּרֹאשׁ מִשְׁפָּט עַל תַּלְמֵי שָׂדָי׃
    hebrewPlain: דברו דברים אלות שוא כרת ברית ופרח כראש משפט על תלמי שדי
    kjvRefs:
    - Hosea 10:4
    kjvOsis:
    - Hos.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.5
    scripture: tanakh
    name: Tanakh Hosea 10:5
    ref: Hosea 10:5
    book: Hos
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 14228
    text: The inhabitants of Samaria shall be in dread For the calves of Beth-aven; For the people thereof shall mourn over it, And the priests thereof shall tremble for it, For its glory, because it is departed from it.
    translation: JPS 1917
    original: לְעֶגְלוֹת בֵּית אָוֶן יָגוּרוּ שְׁכַן שֹׁמְרוֹן כִּי־אָבַל עָלָיו עַמּוֹ וּכְמָרָיו עָלָיו יָגִילוּ עַל־כְּבוֹדוֹ כִּי־גָלָה מִמֶּנּוּ׃
    hebrewPlain: לעגלות בית און יגורו שכן שמרון כי אבל עליו עמו וכמריו עליו יגילו על כבודו כי גלה ממנו
    kjvRefs:
    - Hosea 10:5
    kjvOsis:
    - Hos.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.6
    scripture: tanakh
    name: Tanakh Hosea 10:6
    ref: Hosea 10:6
    book: Hos
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 14229
    text: It also shall be carried unto Assyria, For a present to King Contentious; Ephraim shall receive shame, And Israel shall be ashamed of his own counsel.
    translation: JPS 1917
    original: גַּם־אוֹתוֹ לְאַשּׁוּר יוּבָל מִנְחָה לְמֶלֶךְ יָרֵב בָּשְׁנָה אֶפְרַיִם יִקָּח וְיֵבוֹשׁ יִשְׂרָאֵל מֵעֲצָתוֹ׃
    hebrewPlain: גם אותו לאשור יובל מנחה למלך ירב בשנה אפרים יקח ויבוש ישראל מעצתו
    kjvRefs:
    - Hosea 10:6
    kjvOsis:
    - Hos.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.7
    scripture: tanakh
    name: Tanakh Hosea 10:7
    ref: Hosea 10:7
    book: Hos
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 14230
    text: As for Samaria, her king is cut off, As foam upon the water.
    translation: JPS 1917
    original: נִדְמֶה שֹׁמְרוֹן מַלְכָּהּ כְּקֶצֶף עַל־פְּנֵי־מָיִם׃
    hebrewPlain: נדמה שמרון מלכה כקצף על פני מים
    kjvRefs:
    - Hosea 10:7
    kjvOsis:
    - Hos.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.8
    scripture: tanakh
    name: Tanakh Hosea 10:8
    ref: Hosea 10:8
    book: Hos
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 14231
    text: 'The high places also of Aven shall be destroyed, Even the sin of Israel. The thorn and the thistle shall come up on their altars; And they shall say to the mountains: ‘Cover us’, And to the hills: ‘Fall on us.’'
    translation: JPS 1917
    original: וְנִשְׁמְדוּ בָּמוֹת אָוֶן חַטַּאת יִשְׂרָאֵל קוֹץ וְדַרְדַּר יַעֲלֶה עַל־מִזְבְּחוֹתָם וְאָמְרוּ לֶהָרִים כַּסּוּנוּ וְלַגְּבָעוֹת נִפְלוּ עָלֵינוּ׃
    hebrewPlain: ונשמדו במות און חטאת ישראל קוץ ודרדר יעלה על מזבחותם ואמרו להרים כסונו ולגבעות נפלו עלינו
    kjvRefs:
    - Hosea 10:8
    kjvOsis:
    - Hos.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.9
    scripture: tanakh
    name: Tanakh Hosea 10:9
    ref: Hosea 10:9
    book: Hos
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 14232
    text: From the days of Gibeah thou hast sinned, O Israel; There they stood; No battle was to overtake them in Gibeah, Nor the children of arrogancy.
    translation: JPS 1917
    original: מִימֵי הַגִּבְעָה חָטָאתָ יִשְׂרָאֵל שָׁם עָמָדוּ לֹא־תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל־בְּנֵי עַלְוָה׃
    hebrewPlain: מימי הגבעה חטאת ישראל שם עמדו לא תשיגם בגבעה מלחמה על בני עלוה
    kjvRefs:
    - Hosea 10:9
    kjvOsis:
    - Hos.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.10
    scripture: tanakh
    name: Tanakh Hosea 10:10
    ref: Hosea 10:10
    book: Hos
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 14233
    text: When it is My desire, I will chastise them; And the peoples shall be gathered against them, When they are yoked to their two rings.
    translation: JPS 1917
    original: בְּאַוָּתִי וְאֶסֳּרֵם וְאֻסְּפוּ עֲלֵיהֶם עַמִּים בְּאָסְרָם לִשְׁתֵּי עינתם [עוֹנֹתָם׃]
    hebrewPlain: באותי ואסרם ואספו עליהם עמים באסרם לשתי עינתם [עונתם]
    kjvRefs:
    - Hosea 10:10
    kjvOsis:
    - Hos.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.11
    scripture: tanakh
    name: Tanakh Hosea 10:11
    ref: Hosea 10:11
    book: Hos
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 14234
    text: And Ephraim is a heifer well broken, That loveth to thresh, And I have passed over upon her fair neck; I will make Ephraim to ride, Judah shall plow, Jacob shall break his clods.
    translation: JPS 1917
    original: וְאֶפְרַיִם עֶגְלָה מְלֻמָּדָה אֹהַבְתִּי לָדוּשׁ וַאֲנִי עָבַרְתִּי עַל־טוּב צַוָּארָהּ אַרְכִּיב אֶפְרַיִם יַחֲרוֹשׁ יְהוּדָה יְשַׂדֶּד־לוֹ יַעֲקֹב׃
    hebrewPlain: ואפרים עגלה מלמדה אהבתי לדוש ואני עברתי על טוב צוארה ארכיב אפרים יחרוש יהודה ישדד לו יעקב
    kjvRefs:
    - Hosea 10:11
    kjvOsis:
    - Hos.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.12
    scripture: tanakh
    name: Tanakh Hosea 10:12
    ref: Hosea 10:12
    book: Hos
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 14235
    text: Sow to yourselves according to righteousness, Reap according to mercy, Break up your fallow ground; For it is time to seek the LORD, Till He come and cause righteousness to rain upon you.
    translation: JPS 1917
    original: זִרְעוּ לָכֶם לִצְדָקָה קִצְרוּ לְפִי־חֶסֶד נִירוּ לָכֶם נִיר וְעֵת לִדְרוֹשׁ אֶת־יְהוָה עַד־יָבוֹא וְיֹרֶה צֶדֶק לָכֶם׃
    hebrewPlain: זרעו לכם לצדקה קצרו לפי חסד נירו לכם ניר ועת לדרוש את יהוה עד יבוא וירה צדק לכם
    kjvRefs:
    - Hosea 10:12
    kjvOsis:
    - Hos.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.13
    scripture: tanakh
    name: Tanakh Hosea 10:13
    ref: Hosea 10:13
    book: Hos
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 14236
    text: Ye have plowed wickedness, ye have reaped iniquity, Ye have eaten the fruit of lies; For thou didst trust in thy way, In the multitude of thy mighty men.
    translation: JPS 1917
    original: חֲרַשְׁתֶּם־רֶשַׁע עַוְלָתָה קְצַרְתֶּם אֲכַלְתֶּם פְּרִי־כָחַשׁ כִּי־בָטַחְתָּ בְדַרְכְּךָ בְּרֹב גִּבּוֹרֶיךָ׃
    hebrewPlain: חרשתם רשע עולתה קצרתם אכלתם פרי כחש כי בטחת בדרכך ברב גבוריך
    kjvRefs:
    - Hosea 10:13
    kjvOsis:
    - Hos.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.14
    scripture: tanakh
    name: Tanakh Hosea 10:14
    ref: Hosea 10:14
    book: Hos
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 14237
    text: Therefore shall a tumult arise among thy hosts, And all thy fortresses shall be spoiled, As Shalman spoiled Beth-arbel in the day of battle; The mother was dashed in pieces with her children.
    translation: JPS 1917
    original: וְקָאם שָׁאוֹן בְּעַמֶּךָ וְכָל־מִבְצָרֶיךָ יוּשַּׁד כְּשֹׁד שַׁלְמַן בֵּית אַרְבֵאל בְּיוֹם מִלְחָמָה אֵם עַל־בָּנִים רֻטָּשָׁה׃
    hebrewPlain: וקאם שאון בעמך וכל מבצריך יושד כשד שלמן בית ארבאל ביום מלחמה אם על בנים רטשה
    kjvRefs:
    - Hosea 10:14
    kjvOsis:
    - Hos.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.10.15
    scripture: tanakh
    name: Tanakh Hosea 10:15
    ref: Hosea 10:15
    book: Hos
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 14238
    text: So hath Beth-el done unto you Because of your great wickedness; At daybreak is the king of Israel utterly cut off.
    translation: JPS 1917
    original: כָּכָה עָשָׂה לָכֶם בֵּית־אֵל מִפְּנֵי רָעַת רָעַתְכֶם בַּשַּׁחַר נִדְמֹה נִדְמָה מֶלֶךְ יִשְׂרָאֵל׃
    hebrewPlain: ככה עשה לכם בית אל מפני רעת רעתכם בשחר נדמה נדמה מלך ישראל
    kjvRefs:
    - Hosea 10:15
    kjvOsis:
    - Hos.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.10
- type: TanakhVerse
  data:
    osis: Hos.11.1
    scripture: tanakh
    name: Tanakh Hosea 11:1
    ref: Hosea 11:1
    book: Hos
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 14239
    text: When Israel was a child, then I loved him, And out of Egypt I called My son.
    translation: JPS 1917
    original: כִּי נַעַר יִשְׂרָאֵל וָאֹהֲבֵהוּ וּמִמִּצְרַיִם קָרָאתִי לִבְנִי׃
    hebrewPlain: כי נער ישראל ואהבהו וממצרים קראתי לבני
    kjvRefs:
    - Hosea 11:1
    kjvOsis:
    - Hos.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.2
    scripture: tanakh
    name: Tanakh Hosea 11:2
    ref: Hosea 11:2
    book: Hos
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 14240
    text: The more they called them, the more they went from them; They sacrificed unto the Baalim, And offered to graven images.
    translation: JPS 1917
    original: קָרְאוּ לָהֶם כֵּן הָלְכוּ מִפְּנֵיהֶם לַבְּעָלִים יְזַבֵּחוּ וְלַפְּסִלִים יְקַטֵּרוּן׃
    hebrewPlain: קראו להם כן הלכו מפניהם לבעלים יזבחו ולפסלים יקטרון
    kjvRefs:
    - Hosea 11:2
    kjvOsis:
    - Hos.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.3
    scripture: tanakh
    name: Tanakh Hosea 11:3
    ref: Hosea 11:3
    book: Hos
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 14241
    text: And I, I taught Ephraim to walk, Taking them by their arms; But they knew not that I healed them.
    translation: JPS 1917
    original: וְאָנֹכִי תִרְגַּלְתִּי לְאֶפְרַיִם קָחָם עַל־זְרוֹעֹתָיו וְלֹא יָדְעוּ כִּי רְפָאתִים׃
    hebrewPlain: ואנכי תרגלתי לאפרים קחם על זרועתיו ולא ידעו כי רפאתים
    kjvRefs:
    - Hosea 11:3
    kjvOsis:
    - Hos.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.4
    scripture: tanakh
    name: Tanakh Hosea 11:4
    ref: Hosea 11:4
    book: Hos
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 14242
    text: I drew them with cords of a man, With bands of love; And I was to them as they that take off the yoke on their jaws, And I fed them gently.
    translation: JPS 1917
    original: בְּחַבְלֵי אָדָם אֶמְשְׁכֵם בַּעֲבֹתוֹת אַהֲבָה וָאֶהְיֶה לָהֶם כִּמְרִימֵי עֹל עַל לְחֵיהֶם וְאַט אֵלָיו אוֹכִיל׃
    hebrewPlain: בחבלי אדם אמשכם בעבתות אהבה ואהיה להם כמרימי על על לחיהם ואט אליו אוכיל
    kjvRefs:
    - Hosea 11:4
    kjvOsis:
    - Hos.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.5
    scripture: tanakh
    name: Tanakh Hosea 11:5
    ref: Hosea 11:5
    book: Hos
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 14243
    text: He shall not return into the land of Egypt, But the Assyrian shall be his king, Because they refused to return.
    translation: JPS 1917
    original: לֹא יָשׁוּב אֶל־אֶרֶץ מִצְרַיִם וְאַשּׁוּר הוּא מַלְכּוֹ כִּי מֵאֲנוּ לָשׁוּב׃
    hebrewPlain: לא ישוב אל ארץ מצרים ואשור הוא מלכו כי מאנו לשוב
    kjvRefs:
    - Hosea 11:5
    kjvOsis:
    - Hos.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.6
    scripture: tanakh
    name: Tanakh Hosea 11:6
    ref: Hosea 11:6
    book: Hos
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 14244
    text: And the sword shall fall upon his cities, And shall consume his bars, and devour them, Because of their own counsels.
    translation: JPS 1917
    original: וְחָלָה חֶרֶב בְּעָרָיו וְכִלְּתָה בַדָּיו וְאָכָלָה מִמֹּעֲצוֹתֵיהֶם׃
    hebrewPlain: וחלה חרב בעריו וכלתה בדיו ואכלה ממעצותיהם
    kjvRefs:
    - Hosea 11:6
    kjvOsis:
    - Hos.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.7
    scripture: tanakh
    name: Tanakh Hosea 11:7
    ref: Hosea 11:7
    book: Hos
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 14245
    text: And My people are in suspense about returning to Me; And though they call them upwards, None at all will lift himself up.
    translation: JPS 1917
    original: וְעַמִּי תְלוּאִים לִמְשׁוּבָתִי וְאֶל־עַל יִקְרָאֻהוּ יַחַד לֹא יְרוֹמֵם׃
    hebrewPlain: ועמי תלואים למשובתי ואל על יקראהו יחד לא ירומם
    kjvRefs:
    - Hosea 11:7
    kjvOsis:
    - Hos.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.8
    scripture: tanakh
    name: Tanakh Hosea 11:8
    ref: Hosea 11:8
    book: Hos
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 14246
    text: How shall I give thee up, Ephraim? How shall I surrender thee, Israel? How shall I make thee as Admah? How shall I set thee as Zeboim? My heart is turned within Me, My compassions are kindled together.
    translation: JPS 1917
    original: אֵיךְ אֶתֶּנְךָ אֶפְרַיִם אֲמַגֶּנְךָ יִשְׂרָאֵל אֵיךְ אֶתֶּנְךָ כְאַדְמָה אֲשִׂימְךָ כִּצְבֹאיִם נֶהְפַּךְ עָלַי לִבִּי יַחַד נִכְמְרוּ נִחוּמָי׃
    hebrewPlain: איך אתנך אפרים אמגנך ישראל איך אתנך כאדמה אשימך כצבאים נהפך עלי לבי יחד נכמרו נחומי
    kjvRefs:
    - Hosea 11:8
    kjvOsis:
    - Hos.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.9
    scripture: tanakh
    name: Tanakh Hosea 11:9
    ref: Hosea 11:9
    book: Hos
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 14247
    text: I will not execute the fierceness of Mine anger, I will not return to destroy Ephraim; For I am God, and not man, The Holy One in the midst of thee; And I will not come in fury.
    translation: JPS 1917
    original: לֹא אֶעֱשֶׂה חֲרוֹן אַפִּי לֹא אָשׁוּב לְשַׁחֵת אֶפְרָיִם כִּי אֵל אָנֹכִי וְלֹא־אִישׁ בְּקִרְבְּךָ קָדוֹשׁ וְלֹא אָבוֹא בְּעִיר׃
    hebrewPlain: לא אעשה חרון אפי לא אשוב לשחת אפרים כי אל אנכי ולא איש בקרבך קדוש ולא אבוא בעיר
    kjvRefs:
    - Hosea 11:9
    kjvOsis:
    - Hos.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.10
    scripture: tanakh
    name: Tanakh Hosea 11:10
    ref: Hosea 11:10
    book: Hos
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 14248
    text: They shall walk after the LORD, Who shall roar like a lion; For He shall roar, And the children shall come trembling from the west.
    translation: JPS 1917
    original: אַחֲרֵי יְהוָה יֵלְכוּ כְּאַרְיֵה יִשְׁאָג כִּי־הוּא יִשְׁאַג וְיֶחֶרְדוּ בָנִים מִיָּם׃
    hebrewPlain: אחרי יהוה ילכו כאריה ישאג כי הוא ישאג ויחרדו בנים מים
    kjvRefs:
    - Hosea 11:10
    kjvOsis:
    - Hos.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.11.11
    scripture: tanakh
    name: Tanakh Hosea 11:11
    ref: Hosea 11:11
    book: Hos
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 14249
    text: They shall come trembling as a bird out of Egypt, And as a dove out of the land of Assyria; And I will make them to dwell in their houses, saith the LORD.
    translation: JPS 1917
    original: יֶחֶרְדוּ כְצִפּוֹר מִמִּצְרַיִם וּכְיוֹנָה מֵאֶרֶץ אַשּׁוּר וְהוֹשַׁבְתִּים עַל־בָּתֵּיהֶם נְאֻם־יְהוָה׃
    hebrewPlain: יחרדו כצפור ממצרים וכיונה מארץ אשור והושבתים על בתיהם נאם יהוה
    kjvRefs:
    - Hosea 11:11
    kjvOsis:
    - Hos.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.11
- type: TanakhVerse
  data:
    osis: Hos.12.1
    scripture: tanakh
    name: Tanakh Hosea 12:1
    ref: Hosea 12:1
    book: Hos
    section: neviim
    chapter: 12
    verse: 1
    ordinal: 14250
    text: Ephraim compasseth Me about with lies, And the house of Israel with deceit; And Judah is yet wayward towards God, And towards the Holy One who is faithful.
    translation: JPS 1917
    original: סְבָבֻנִי בְכַחַשׁ אֶפְרַיִם וּבְמִרְמָה בֵּית יִשְׂרָאֵל וִיהוּדָה עֹד רָד עִם־אֵל וְעִם־קְדוֹשִׁים נֶאֱמָן׃
    hebrewPlain: סבבני בכחש אפרים ובמרמה בית ישראל ויהודה עד רד עם אל ועם קדושים נאמן
    kjvRefs:
    - Hosea 11:12
    kjvOsis:
    - Hos.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.2
    scripture: tanakh
    name: Tanakh Hosea 12:2
    ref: Hosea 12:2
    book: Hos
    section: neviim
    chapter: 12
    verse: 2
    ordinal: 14251
    text: Ephraim striveth after wind, and followeth after the east wind; All the day he multiplieth lies and desolation; And they make a covenant with Assyria, And oil is carried into Egypt.
    translation: JPS 1917
    original: אֶפְרַיִם רֹעֶה רוּחַ וְרֹדֵף קָדִים כָּל־הַיּוֹם כָּזָב וָשֹׁד יַרְבֶּה וּבְרִית עִם־אַשּׁוּר יִכְרֹתוּ וְשֶׁמֶן לְמִצְרַיִם יוּבָל׃
    hebrewPlain: אפרים רעה רוח ורדף קדים כל היום כזב ושד ירבה וברית עם אשור יכרתו ושמן למצרים יובל
    kjvRefs:
    - Hosea 12:1
    kjvOsis:
    - Hos.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.3
    scripture: tanakh
    name: Tanakh Hosea 12:3
    ref: Hosea 12:3
    book: Hos
    section: neviim
    chapter: 12
    verse: 3
    ordinal: 14252
    text: The LORD hath also a controversy with Judah, And will punish Jacob according to his ways, According to his doings will He recompense him.
    translation: JPS 1917
    original: וְרִיב לַיהוָה עִם־יְהוּדָה וְלִפְקֹד עַל־יַעֲקֹב כִּדְרָכָיו כְּמַעֲלָלָיו יָשִׁיב לוֹ׃
    hebrewPlain: וריב ליהוה עם יהודה ולפקד על יעקב כדרכיו כמעלליו ישיב לו
    kjvRefs:
    - Hosea 12:2
    kjvOsis:
    - Hos.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.4
    scripture: tanakh
    name: Tanakh Hosea 12:4
    ref: Hosea 12:4
    book: Hos
    section: neviim
    chapter: 12
    verse: 4
    ordinal: 14253
    text: In the womb he took his brother by the heel, And by his strength he strove with a godlike being;
    translation: JPS 1917
    original: בַּבֶּטֶן עָקַב אֶת־אָחִיו וּבְאוֹנוֹ שָׂרָה אֶת־אֱלֹהִים׃
    hebrewPlain: בבטן עקב את אחיו ובאונו שרה את אלהים
    kjvRefs:
    - Hosea 12:3
    kjvOsis:
    - Hos.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.5
    scripture: tanakh
    name: Tanakh Hosea 12:5
    ref: Hosea 12:5
    book: Hos
    section: neviim
    chapter: 12
    verse: 5
    ordinal: 14254
    text: So he strove with an angel, and prevailed; He wept, and made supplication unto him; At Beth-el he would find him, And there he would speak with us;
    translation: JPS 1917
    original: וָיָּשַׂר אֶל־מַלְאָךְ וַיֻּכָל בָּכָה וַיִּתְחַנֶּן־לוֹ בֵּית־אֵל יִמְצָאֶנּוּ וְשָׁם יְדַבֵּר עִמָּנוּ׃
    hebrewPlain: וישר אל מלאך ויכל בכה ויתחנן לו בית אל ימצאנו ושם ידבר עמנו
    kjvRefs:
    - Hosea 12:4
    kjvOsis:
    - Hos.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.6
    scripture: tanakh
    name: Tanakh Hosea 12:6
    ref: Hosea 12:6
    book: Hos
    section: neviim
    chapter: 12
    verse: 6
    ordinal: 14255
    text: But the LORD, the God of hosts, The LORD is His name.
    translation: JPS 1917
    original: וַיהוָה אֱלֹהֵי הַצְּבָאוֹת יְהוָה זִכְרוֹ׃
    hebrewPlain: ויהוה אלהי הצבאות יהוה זכרו
    kjvRefs:
    - Hosea 12:5
    kjvOsis:
    - Hos.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.7
    scripture: tanakh
    name: Tanakh Hosea 12:7
    ref: Hosea 12:7
    book: Hos
    section: neviim
    chapter: 12
    verse: 7
    ordinal: 14256
    text: Therefore turn thou to thy God; Keep mercy and justice, And wait for thy God continually.
    translation: JPS 1917
    original: וְאַתָּה בֵּאלֹהֶיךָ תָשׁוּב חֶסֶד וּמִשְׁפָּט שְׁמֹר וְקַוֵּה אֶל־אֱלֹהֶיךָ תָּמִיד׃
    hebrewPlain: ואתה באלהיך תשוב חסד ומשפט שמר וקוה אל אלהיך תמיד
    kjvRefs:
    - Hosea 12:6
    kjvOsis:
    - Hos.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.8
    scripture: tanakh
    name: Tanakh Hosea 12:8
    ref: Hosea 12:8
    book: Hos
    section: neviim
    chapter: 12
    verse: 8
    ordinal: 14257
    text: As for the trafficker, the balances of deceit are in his hand. He loveth to oppress.
    translation: JPS 1917
    original: כְּנַעַן בְּיָדוֹ מֹאזְנֵי מִרְמָה לַעֲשֹׁק אָהֵב׃
    hebrewPlain: כנען בידו מאזני מרמה לעשק אהב
    kjvRefs:
    - Hosea 12:7
    kjvOsis:
    - Hos.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.9
    scripture: tanakh
    name: Tanakh Hosea 12:9
    ref: Hosea 12:9
    book: Hos
    section: neviim
    chapter: 12
    verse: 9
    ordinal: 14258
    text: 'And Ephraim said: ‘Surely I am become rich, I have found me wealth; In all my labours they shall find in me No iniquity that were sin.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶפְרַיִם אַךְ עָשַׁרְתִּי מָצָאתִי אוֹן לִי כָּל־יְגִיעַי לֹא יִמְצְאוּ־לִי עָוֺן אֲשֶׁר־חֵטְא׃
    hebrewPlain: ויאמר אפרים אך עשרתי מצאתי און לי כל יגיעי לא ימצאו לי עון אשר חטא
    kjvRefs:
    - Hosea 12:8
    kjvOsis:
    - Hos.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.10
    scripture: tanakh
    name: Tanakh Hosea 12:10
    ref: Hosea 12:10
    book: Hos
    section: neviim
    chapter: 12
    verse: 10
    ordinal: 14259
    text: But I am the LORD thy God From the land of Egypt; I will yet again make thee to dwell in tents, As in the days of the appointed season.
    translation: JPS 1917
    original: וְאָנֹכִי יְהוָה אֱלֹהֶיךָ מֵאֶרֶץ מִצְרָיִם עֹד אוֹשִׁיבְךָ בָאֳהָלִים כִּימֵי מוֹעֵד׃
    hebrewPlain: ואנכי יהוה אלהיך מארץ מצרים עד אושיבך באהלים כימי מועד
    kjvRefs:
    - Hosea 12:9
    kjvOsis:
    - Hos.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.11
    scripture: tanakh
    name: Tanakh Hosea 12:11
    ref: Hosea 12:11
    book: Hos
    section: neviim
    chapter: 12
    verse: 11
    ordinal: 14260
    text: I have also spoken unto the prophets, And I have multiplied visions; And by the ministry of the prophets have I used similitudes.
    translation: JPS 1917
    original: וְדִבַּרְתִּי עַל־הַנְּבִיאִים וְאָנֹכִי חָזוֹן הִרְבֵּיתִי וּבְיַד הַנְּבִיאִים אֲדַמֶּה׃
    hebrewPlain: ודברתי על הנביאים ואנכי חזון הרביתי וביד הנביאים אדמה
    kjvRefs:
    - Hosea 12:10
    kjvOsis:
    - Hos.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.12
    scripture: tanakh
    name: Tanakh Hosea 12:12
    ref: Hosea 12:12
    book: Hos
    section: neviim
    chapter: 12
    verse: 12
    ordinal: 14261
    text: If Gilead be given to iniquity Becoming altogether vanity, In Gilgal they sacrifice unto bullocks; Yea, their altars shall be as heaps In the furrows of the field.
    translation: JPS 1917
    original: אִם־גִּלְעָד אָוֶן אַךְ־שָׁוְא הָיוּ בַּגִּלְגָּל שְׁוָרִים זִבֵּחוּ גַּם מִזְבְּחוֹתָם כְּגַלִּים עַל תַּלְמֵי שָׂדָי׃
    hebrewPlain: אם גלעד און אך שוא היו בגלגל שורים זבחו גם מזבחותם כגלים על תלמי שדי
    kjvRefs:
    - Hosea 12:11
    kjvOsis:
    - Hos.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.13
    scripture: tanakh
    name: Tanakh Hosea 12:13
    ref: Hosea 12:13
    book: Hos
    section: neviim
    chapter: 12
    verse: 13
    ordinal: 14262
    text: And Jacob fled into the field of Aram, And Israel served for a wife, And for a wife he kept sheep.
    translation: JPS 1917
    original: וַיִּבְרַח יַעֲקֹב שְׂדֵה אֲרָם וַיַּעֲבֹד יִשְׂרָאֵל בְּאִשָּׁה וּבְאִשָּׁה שָׁמָר׃
    hebrewPlain: ויברח יעקב שדה ארם ויעבד ישראל באשה ובאשה שמר
    kjvRefs:
    - Hosea 12:12
    kjvOsis:
    - Hos.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.14
    scripture: tanakh
    name: Tanakh Hosea 12:14
    ref: Hosea 12:14
    book: Hos
    section: neviim
    chapter: 12
    verse: 14
    ordinal: 14263
    text: And by a prophet the LORD brought Israel up out of Egypt, And by a prophet was he kept.
    translation: JPS 1917
    original: וּבְנָבִיא הֶעֱלָה יְהוָה אֶת־יִשְׂרָאֵל מִמִּצְרָיִם וּבְנָבִיא נִשְׁמָר׃
    hebrewPlain: ובנביא העלה יהוה את ישראל ממצרים ובנביא נשמר
    kjvRefs:
    - Hosea 12:13
    kjvOsis:
    - Hos.12.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.12.15
    scripture: tanakh
    name: Tanakh Hosea 12:15
    ref: Hosea 12:15
    book: Hos
    section: neviim
    chapter: 12
    verse: 15
    ordinal: 14264
    text: Ephraim hath provoked most bitterly; Therefore shall his blood be cast upon him, And his reproach shall his Lord return unto him.
    translation: JPS 1917
    original: הִכְעִיס אֶפְרַיִם תַּמְרוּרִים וְדָמָיו עָלָיו יִטּוֹשׁ וְחֶרְפָּתוֹ יָשִׁיב לוֹ אֲדֹנָיו׃
    hebrewPlain: הכעיס אפרים תמרורים ודמיו עליו יטוש וחרפתו ישיב לו אדניו
    kjvRefs:
    - Hosea 12:14
    kjvOsis:
    - Hos.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.12
- type: TanakhVerse
  data:
    osis: Hos.13.1
    scripture: tanakh
    name: Tanakh Hosea 13:1
    ref: Hosea 13:1
    book: Hos
    section: neviim
    chapter: 13
    verse: 1
    ordinal: 14265
    text: When Ephraim spoke, there was trembling, He exalted himself in Israel; But when he became guilty through Baal, he died.
    translation: JPS 1917
    original: כְּדַבֵּר אֶפְרַיִם רְתֵת נָשָׂא הוּא בְּיִשְׂרָאֵל וַיֶּאְשַׁם בַּבַּעַל וַיָּמֹת׃
    hebrewPlain: כדבר אפרים רתת נשא הוא בישראל ויאשם בבעל וימת
    kjvRefs:
    - Hosea 13:1
    kjvOsis:
    - Hos.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.2
    scripture: tanakh
    name: Tanakh Hosea 13:2
    ref: Hosea 13:2
    book: Hos
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 14266
    text: 'And now they sin more and more, And have made them molten images of their silver, According to their own understanding, even idols, All of them the work of the craftsmen; Of them they say: ‘They that sacrifice men kiss calves.’'
    translation: JPS 1917
    original: וְעַתָּה יוֹסִפוּ לַחֲטֹא וַיַּעְשׂוּ לָהֶם מַסֵּכָה מִכַּסְפָּם כִּתְבוּנָם עֲצַבִּים מַעֲשֵׂה חָרָשִׁים כֻּלֹּה לָהֶם הֵם אֹמְרִים זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן׃
    hebrewPlain: ועתה יוספו לחטא ויעשו להם מסכה מכספם כתבונם עצבים מעשה חרשים כלה להם הם אמרים זבחי אדם עגלים ישקון
    kjvRefs:
    - Hosea 13:2
    kjvOsis:
    - Hos.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.3
    scripture: tanakh
    name: Tanakh Hosea 13:3
    ref: Hosea 13:3
    book: Hos
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 14267
    text: Therefore they shall be as the morning cloud, And as the dew that early passeth away, As the chaff that is driven with the wind out of the threshing-floor, And as the smoke out of the window.
    translation: JPS 1917
    original: לָכֵן יִהְיוּ כַּעֲנַן־בֹּקֶר וְכַטַּל מַשְׁכִּים הֹלֵךְ כְּמֹץ יְסֹעֵר מִגֹּרֶן וּכְעָשָׁן מֵאֲרֻבָּה׃
    hebrewPlain: לכן יהיו כענן בקר וכטל משכים הלך כמץ יסער מגרן וכעשן מארבה
    kjvRefs:
    - Hosea 13:3
    kjvOsis:
    - Hos.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Hos.13
- type: TanakhVerse
  data:
    osis: Hos.13.4
    scripture: tanakh
    name: Tanakh Hosea 13:4
    ref: Hosea 13:4
    book: Hos
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 14268
    text: Yet I am the LORD thy God From the land of Egypt; And thou knowest no God but Me, And beside Me there is no saviour.
    translation: JPS 1917
    original: וְאָנֹכִי יְהוָה אֱלֹהֶיךָ מֵאֶרֶץ מִצְרָיִם וֵאלֹהִים זוּלָתִי לֹא תֵדָע וּמוֹשִׁיעַ אַיִן בִּלְתִּי׃
    hebrewPlain: ואנכי יהוה אלהיך מארץ מצרים ואלהים זולתי לא תדע ומושיע אין בלתי
    kjvRefs:
    - Hosea 13:4
    kjvOsis:
    - Hos.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
