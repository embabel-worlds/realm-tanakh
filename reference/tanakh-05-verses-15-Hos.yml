- type: TanakhVerse
  data:
    osis: Hos.13.5
    scripture: tanakh
    name: Tanakh Hosea 13:5
    ref: Hosea 13:5
    book: Hos
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 14269
    text: I did know thee in the wilderness, In the land of great drought.
    translation: JPS 1917
    original: אֲנִי יְדַעְתִּיךָ בַּמִּדְבָּר בְּאֶרֶץ תַּלְאֻבוֹת׃
    hebrewPlain: אני ידעתיך במדבר בארץ תלאבות
    kjvRefs:
    - Hosea 13:5
    kjvOsis:
    - Hos.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
