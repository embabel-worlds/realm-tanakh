    section: neviim
    chapter: 1
    verse: 2
    ordinal: 14094
    text: 'When the LORD spoke at first with Hosea, the LORD said unto Hosea: ‘Go, take unto thee a wife of harlotry and children of harlotry; for the land doth commit great harlotry, departing from the LORD.’'
    translation: JPS 1917
    original: תְּחִלַּת דִּבֶּר־יְהוָה בְּהוֹשֵׁעַ וַיֹּאמֶר יְהוָה אֶל־הוֹשֵׁעַ לֵךְ קַח־לְךָ אֵשֶׁת זְנוּנִים וְיַלְדֵי זְנוּנִים כִּי־זָנֹה תִזְנֶה הָאָרֶץ מֵאַחֲרֵי יְהוָה׃
    hebrewPlain: תחלת דבר יהוה בהושע ויאמר יהוה אל הושע לך קח לך אשת זנונים וילדי זנונים כי זנה תזנה הארץ מאחרי יהוה
    kjvRefs:
    - Hosea 1:2
    kjvOsis:
