    section: ketuvim
    chapter: 1
    verse: 1
    ordinal: 19857
    text: How doth the city sit solitary, That was full of people! How is she become as a widow! She that was great among the nations, And princess among the provinces, How is she become tributary!
    translation: JPS 1917
    original: אֵיכָה יָשְׁבָה בָדָד הָעִיר רַבָּתִי עָם הָיְתָה כְּאַלְמָנָה רַּבָּתִי בַגּוֹיִם שָׂרָתִי בַּמְּדִינוֹת הָיְתָה לָמַס׃
    hebrewPlain: איכה ישבה בדד העיר רבתי עם היתה כאלמנה רבתי בגוים שרתי במדינות היתה למס
    kjvRefs:
    - Lamentations 1:1
    kjvOsis:
    - Lam.1.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.2
    scripture: tanakh
    name: Tanakh Lamentations 1:2
    ref: Lamentations 1:2
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 2
    ordinal: 19858
    text: She weepeth sore in the night, And her tears are on her cheeks; She hath none to comfort her Among all her lovers; All her friends have dealt treacherously with her, They are become her enemies.
    translation: JPS 1917
    original: בָּכוֹ תִבְכֶּה בַּלַּיְלָה וְדִמְעָתָהּ עַל לֶחֱיָהּ אֵין־לָהּ מְנַחֵם מִכָּל־אֹהֲבֶיהָ כָּל־רֵעֶיהָ בָּגְדוּ בָהּ הָיוּ לָהּ לְאֹיְבִים׃
    hebrewPlain: בכו תבכה בלילה ודמעתה על לחיה אין לה מנחם מכל אהביה כל רעיה בגדו בה היו לה לאיבים
    kjvRefs:
    - Lamentations 1:2
    kjvOsis:
    - Lam.1.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.3
    scripture: tanakh
    name: Tanakh Lamentations 1:3
    ref: Lamentations 1:3
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 19859
    text: Judah is gone into exile because of affliction, And because of great servitude; She dwelleth among the nations, She findeth no rest; All her pursuers overtook her within the straits.
    translation: JPS 1917
    original: גָּלְתָה יְהוּדָה מֵעֹנִי וּמֵרֹב עֲבֹדָה הִיא יָשְׁבָה בַגּוֹיִם לֹא מָצְאָה מָנוֹחַ כָּל־רֹדְפֶיהָ הִשִּׂיגוּהָ בֵּין הַמְּצָרִים׃
    hebrewPlain: גלתה יהודה מעני ומרב עבדה היא ישבה בגוים לא מצאה מנוח כל רדפיה השיגוה בין המצרים
    kjvRefs:
    - Lamentations 1:3
    kjvOsis:
    - Lam.1.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.4
    scripture: tanakh
    name: Tanakh Lamentations 1:4
    ref: Lamentations 1:4
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 19860
    text: The ways of Zion do mourn, Because none come to the solemn assembly; All her gates are desolate, Her priests sigh; Her virgins are afflicted, And she herself is in bitterness.
    translation: JPS 1917
    original: דַּרְכֵי צִיּוֹן אֲבֵלוֹת מִבְּלִי בָּאֵי מוֹעֵד כָּל־שְׁעָרֶיהָ שׁוֹמֵמִין כֹּהֲנֶיהָ נֶאֱנָחִים בְּתוּלֹתֶיהָ נּוּגוֹת וְהִיא מַר־לָהּ׃
    hebrewPlain: דרכי ציון אבלות מבלי באי מועד כל שעריה שוממין כהניה נאנחים בתולתיה נוגות והיא מר לה
    kjvRefs:
    - Lamentations 1:4
    kjvOsis:
    - Lam.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.5
    scripture: tanakh
    name: Tanakh Lamentations 1:5
    ref: Lamentations 1:5
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 19861
    text: Her adversaries are become the head, Her enemies are at ease; For the LORD hath afflicted her For the multitude of her transgressions; Her young children are gone into captivity Before the adversary.
    translation: JPS 1917
    original: הָיוּ צָרֶיהָ לְרֹאשׁ אֹיְבֶיהָ שָׁלוּ כִּי־יְהוָה הוֹגָהּ עַל רֹב־פְּשָׁעֶיהָ עוֹלָלֶיהָ הָלְכוּ שְׁבִי לִפְנֵי־צָר׃
    hebrewPlain: היו צריה לראש איביה שלו כי יהוה הוגה על רב פשעיה עולליה הלכו שבי לפני צר
    kjvRefs:
    - Lamentations 1:5
    kjvOsis:
    - Lam.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.6
    scripture: tanakh
    name: Tanakh Lamentations 1:6
    ref: Lamentations 1:6
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 19862
    text: And gone is from the daughter of Zion All her splendour; Her princes are become like harts That find no pasture, And they are gone without strength Before the pursuer.
    translation: JPS 1917
    original: וַיֵּצֵא מן־בת־[מִבַּת־] צִיּוֹן כָּל־הֲדָרָהּ הָיוּ שָׂרֶיהָ כְּאַיָּלִים לֹא־מָצְאוּ מִרְעֶה וַיֵּלְכוּ בְלֹא־כֹחַ לִפְנֵי רוֹדֵף׃
    hebrewPlain: ויצא מן בת [מבת ] ציון כל הדרה היו שריה כאילים לא מצאו מרעה וילכו בלא כח לפני רודף
    kjvRefs:
    - Lamentations 1:6
    kjvOsis:
    - Lam.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.7
    scripture: tanakh
    name: Tanakh Lamentations 1:7
    ref: Lamentations 1:7
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 19863
    text: Jerusalem remembereth In the days of her affliction and of her anguish All her treasures that she had From the days of old; Now that her people fall by the hand of the adversary, And none doth help her, The adversaries have seen her, They have mocked at her desolations.
    translation: JPS 1917
    original: זָכְרָה יְרוּשָׁלִַם יְמֵי עָנְיָהּ וּמְרוּדֶיהָ כֹּל מַחֲמֻדֶיהָ אֲשֶׁר הָיוּ מִימֵי קֶדֶם בִּנְפֹל עַמָּהּ בְּיַד־צָר וְאֵין עוֹזֵר לָהּ רָאוּהָ צָרִים שָׂחֲקוּ עַל מִשְׁבַּתֶּהָ׃
    hebrewPlain: זכרה ירושלם ימי עניה ומרודיה כל מחמדיה אשר היו מימי קדם בנפל עמה ביד צר ואין עוזר לה ראוה צרים שחקו על משבתה
    kjvRefs:
    - Lamentations 1:7
    kjvOsis:
    - Lam.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.8
    scripture: tanakh
    name: Tanakh Lamentations 1:8
    ref: Lamentations 1:8
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 19864
    text: Jerusalem hath grievously sinned, Therefore she is become as one unclean; All that honoured her despise her, Because they have seen her nakedness; She herself also sigheth, And turneth backward.
    translation: JPS 1917
    original: חֵטְא חָטְאָה יְרוּשָׁלִַם עַל־כֵּן לְנִידָה הָיָתָה כָּל־מְכַבְּדֶיהָ הִזִּילוּהָ כִּי־רָאוּ עֶרְוָתָהּ גַּם־הִיא נֶאֶנְחָה וַתָּשָׁב אָחוֹר׃
    hebrewPlain: חטא חטאה ירושלם על כן לנידה היתה כל מכבדיה הזילוה כי ראו ערותה גם היא נאנחה ותשב אחור
    kjvRefs:
    - Lamentations 1:8
    kjvOsis:
    - Lam.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.9
    scripture: tanakh
    name: Tanakh Lamentations 1:9
    ref: Lamentations 1:9
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 19865
    text: Her filthiness was in her skirts, She was not mindful of her end; Therefore is she come down wonderfully, She hath no comforter. ‘Behold, O LORD, My affliction, For the enemy hath magnified himself.’
    translation: JPS 1917
    original: טֻמְאָתָהּ בְּשׁוּלֶיהָ לֹא זָכְרָה אַחֲרִיתָהּ וַתֵּרֶד פְּלָאִים אֵין מְנַחֵם לָהּ רְאֵה יְהוָה אֶת־עָנְיִי כִּי הִגְדִּיל אוֹיֵב׃
    hebrewPlain: טמאתה בשוליה לא זכרה אחריתה ותרד פלאים אין מנחם לה ראה יהוה את עניי כי הגדיל אויב
    kjvRefs:
    - Lamentations 1:9
    kjvOsis:
    - Lam.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.10
    scripture: tanakh
    name: Tanakh Lamentations 1:10
    ref: Lamentations 1:10
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 19866
    text: The adversary hath spread out his hand Upon all her treasures; For she hath seen that the heathen Are entered into her sanctuary, Concerning whom Thou didst command That they should not enter into Thy congregation.
    translation: JPS 1917
    original: יָדוֹ פָּרַשׂ צָר עַל כָּל־מַחֲמַדֶּיהָ כִּי־רָאֲתָה גוֹיִם בָּאוּ מִקְדָּשָׁהּ אֲשֶׁר צִוִּיתָה לֹא־יָבֹאוּ בַקָּהָל לָךְ׃
    hebrewPlain: ידו פרש צר על כל מחמדיה כי ראתה גוים באו מקדשה אשר צויתה לא יבאו בקהל לך
    kjvRefs:
    - Lamentations 1:10
    kjvOsis:
    - Lam.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.11
    scripture: tanakh
    name: Tanakh Lamentations 1:11
    ref: Lamentations 1:11
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 19867
    text: All her people sigh, They seek bread; They have given their pleasant things for food To refresh the soul. ‘See, O LORD, And behold, How abject I am become.’
    translation: JPS 1917
    original: כָּל־עַמָּהּ נֶאֱנָחִים מְבַקְּשִׁים לֶחֶם נָתְנוּ מחמודיהם [מַחֲמַדֵּיהֶם] בְּאֹכֶל לְהָשִׁיב נָפֶשׁ רְאֵה יְהוָה וְהַבִּיטָה כִּי הָיִיתִי זוֹלֵלָה׃
    hebrewPlain: כל עמה נאנחים מבקשים לחם נתנו מחמודיהם [מחמדיהם] באכל להשיב נפש ראה יהוה והביטה כי הייתי זוללה
    kjvRefs:
    - Lamentations 1:11
    kjvOsis:
    - Lam.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.12
    scripture: tanakh
    name: Tanakh Lamentations 1:12
    ref: Lamentations 1:12
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 19868
    text: Let it not come unto you, All ye that pass by! Behold, And see If there be any pain like unto my pain, Which is done unto me, Wherewith the LORD hath afflicted me In the day of His fierce anger.
    translation: JPS 1917
    original: לוֹא אֲלֵיכֶם כָּל־עֹבְרֵי דֶרֶךְ הַבִּיטוּ וּרְאוּ אִם־יֵשׁ מַכְאוֹב כְּמַכְאֹבִי אֲשֶׁר עוֹלַל לִי אֲשֶׁר הוֹגָה יְהוָה בְּיוֹם חֲרוֹן אַפּוֹ׃
    hebrewPlain: לוא אליכם כל עברי דרך הביטו וראו אם יש מכאוב כמכאבי אשר עולל לי אשר הוגה יהוה ביום חרון אפו
    kjvRefs:
    - Lamentations 1:12
    kjvOsis:
    - Lam.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.13
    scripture: tanakh
    name: Tanakh Lamentations 1:13
    ref: Lamentations 1:13
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 19869
    text: From on high hath He sent fire into my bones, And it prevaileth against them; He hath spread a net for my feet, He hath turned me back; He hath made me desolate And faint all the day.
    translation: JPS 1917
    original: מִמָּרוֹם שָׁלַח־אֵשׁ בְּעַצְמֹתַי וַיִּרְדֶּנָּה פָּרַשׂ רֶשֶׁת לְרַגְלַי הֱשִׁיבַנִי אָחוֹר נְתָנַנִי שֹׁמֵמָה כָּל־הַיּוֹם דָּוָה׃
    hebrewPlain: ממרום שלח אש בעצמתי וירדנה פרש רשת לרגלי השיבני אחור נתנני שממה כל היום דוה
    kjvRefs:
    - Lamentations 1:13
    kjvOsis:
    - Lam.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.14
    scripture: tanakh
    name: Tanakh Lamentations 1:14
    ref: Lamentations 1:14
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 19870
    text: The yoke of my transgressions is impressed by His hand; They are knit together, They are come up upon my neck; He hath made my strength to fail; The Lord hath delivered me into their hands, Against whom I am not able to stand.
    translation: JPS 1917
    original: נִשְׂקַד עֹל פְּשָׁעַי בְּיָדוֹ יִשְׂתָּרְגוּ עָלוּ עַל־צַוָּארִי הִכְשִׁיל כֹּחִי נְתָנַנִי אֲדֹנָי בִּידֵי לֹא־אוּכַל קוּם׃
    hebrewPlain: נשקד על פשעי בידו ישתרגו עלו על צוארי הכשיל כחי נתנני אדני בידי לא אוכל קום
    kjvRefs:
    - Lamentations 1:14
    kjvOsis:
    - Lam.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.15
    scripture: tanakh
    name: Tanakh Lamentations 1:15
    ref: Lamentations 1:15
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 19871
    text: The Lord hath set at nought All my mighty men in the midst of me; He hath called a solemn assembly against me To crush my young men; The Lord hath trodden as in a winepress The virgin the daughter of Judah.’
    translation: JPS 1917
    original: סִלָּה כָל־אַבִּירַי אֲדֹנָי בְּקִרְבִּי קָרָא עָלַי מוֹעֵד לִשְׁבֹּר בַּחוּרָי גַּת דָּרַךְ אֲדֹנָי לִבְתוּלַת בַּת־יְהוּדָה׃
    hebrewPlain: סלה כל אבירי אדני בקרבי קרא עלי מועד לשבר בחורי גת דרך אדני לבתולת בת יהודה
    kjvRefs:
    - Lamentations 1:15
    kjvOsis:
    - Lam.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.16
    scripture: tanakh
    name: Tanakh Lamentations 1:16
    ref: Lamentations 1:16
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 19872
    text: For these things I weep; Mine eye, Mine eye runneth down with water; Because the comforter is far from me, Even he that should refresh my soul; My children are desolate, Because the enemy hath prevailed.’
    translation: JPS 1917
    original: עַל־אֵלֶּה אֲנִי בוֹכִיָּה עֵינִי עֵינִי יֹרְדָה מַּיִם כִּי־רָחַק מִמֶּנִּי מְנַחֵם מֵשִׁיב נַפְשִׁי הָיוּ בָנַי שׁוֹמֵמִים כִּי גָבַר אוֹיֵב׃
    hebrewPlain: על אלה אני בוכיה עיני עיני ירדה מים כי רחק ממני מנחם משיב נפשי היו בני שוממים כי גבר אויב
    kjvRefs:
    - Lamentations 1:16
    kjvOsis:
    - Lam.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.17
    scripture: tanakh
    name: Tanakh Lamentations 1:17
    ref: Lamentations 1:17
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 19873
    text: Zion spreadeth forth her hands; There is none to comfort her; The LORD hath commanded concerning Jacob, That they that are round about him should be his adversaries; Jerusalem is among them As one unclean.
    translation: JPS 1917
    original: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ אֵין מְנַחֵם לָהּ צִוָּה יְהוָה לְיַעֲקֹב סְבִיבָיו צָרָיו הָיְתָה יְרוּשָׁלִַם לְנִדָּה בֵּינֵיהֶם׃
    hebrewPlain: פרשה ציון בידיה אין מנחם לה צוה יהוה ליעקב סביביו צריו היתה ירושלם לנדה ביניהם
    kjvRefs:
    - Lamentations 1:17
    kjvOsis:
    - Lam.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.18
    scripture: tanakh
    name: Tanakh Lamentations 1:18
    ref: Lamentations 1:18
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 19874
    text: 'The LORD is righteous; For I have rebelled against His word; Hear, I pray you, All ye peoples, And behold my pain: My virgins and my young men Are gone into captivity.'
    translation: JPS 1917
    original: צַדִּיק הוּא יְהוָה כִּי פִיהוּ מָרִיתִי שִׁמְעוּ־נָא כָל־עמים [הָעַמִּים] וּרְאוּ מַכְאֹבִי בְּתוּלֹתַי וּבַחוּרַי הָלְכוּ בַשֶּׁבִי׃
    hebrewPlain: צדיק הוא יהוה כי פיהו מריתי שמעו נא כל עמים [העמים] וראו מכאבי בתולתי ובחורי הלכו בשבי
    kjvRefs:
    - Lamentations 1:18
    kjvOsis:
    - Lam.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.19
    scripture: tanakh
    name: Tanakh Lamentations 1:19
    ref: Lamentations 1:19
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 19
    ordinal: 19875
    text: I called for my lovers, But they deceived me; My priests and mine elders Perished in the city, While they sought them food To refresh their souls.
    translation: JPS 1917
    original: קָרָאתִי לַמְאַהֲבַי הֵמָּה רִמּוּנִי כֹּהֲנַי וּזְקֵנַי בָּעִיר גָּוָעוּ כִּי־בִקְשׁוּ אֹכֶל לָמוֹ וְיָשִׁיבוּ אֶת־נַפְשָׁם׃
    hebrewPlain: קראתי למאהבי המה רמוני כהני וזקני בעיר גועו כי בקשו אכל למו וישיבו את נפשם
    kjvRefs:
    - Lamentations 1:19
    kjvOsis:
    - Lam.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.20
    scripture: tanakh
    name: Tanakh Lamentations 1:20
    ref: Lamentations 1:20
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 19876
    text: Behold, O LORD, For I am in distress, Mine inwards burn; My heart is turned within me, For I have grievously rebelled. Abroad the sword bereaveth, At home there is the like of death.
    translation: JPS 1917
    original: רְאֵה יְהוָה כִּי־צַר־לִי מֵעַי חֳמַרְמָרוּ נֶהְפַּךְ לִבִּי בְּקִרְבִּי כִּי מָרוֹ מָרִיתִי מִחוּץ שִׁכְּלָה־חֶרֶב בַּבַּיִת כַּמָּוֶת׃
    hebrewPlain: ראה יהוה כי צר לי מעי חמרמרו נהפך לבי בקרבי כי מרו מריתי מחוץ שכלה חרב בבית כמות
    kjvRefs:
    - Lamentations 1:20
    kjvOsis:
    - Lam.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.21
    scripture: tanakh
    name: Tanakh Lamentations 1:21
    ref: Lamentations 1:21
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 19877
    text: They have heard that I sigh, There is none to comfort me; All mine enemies have heard of my trouble, And are glad, For Thou hast done it; Thou wilt bring the day that Thou hast proclaimed, And they shall be like unto me.
    translation: JPS 1917
    original: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי אֵין מְנַחֵם לִי כָּל־אֹיְבַי שָׁמְעוּ רָעָתִי שָׂשׂוּ כִּי אַתָּה עָשִׂיתָ הֵבֵאתָ יוֹם־קָרָאתָ וְיִהְיוּ כָמוֹנִי׃
    hebrewPlain: שמעו כי נאנחה אני אין מנחם לי כל איבי שמעו רעתי ששו כי אתה עשית הבאת יום קראת ויהיו כמוני
    kjvRefs:
    - Lamentations 1:21
    kjvOsis:
    - Lam.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.1.22
    scripture: tanakh
    name: Tanakh Lamentations 1:22
    ref: Lamentations 1:22
    book: Lam
    section: ketuvim
    chapter: 1
    verse: 22
    ordinal: 19878
    text: Let all their wickedness come before Thee; And do unto them, As Thou hast done unto me For all my transgressions; For my sighs are many And my heart is faint.’
    translation: JPS 1917
    original: תָּבֹא כָל־רָעָתָם לְפָנֶיךָ וְעוֹלֵל לָמוֹ כַּאֲשֶׁר עוֹלַלְתָּ לִי עַל כָּל־פְּשָׁעָי כִּי־רַבּוֹת אַנְחֹתַי וְלִבִּי דַוָּי׃
    hebrewPlain: תבא כל רעתם לפניך ועולל למו כאשר עוללת לי על כל פשעי כי רבות אנחתי ולבי דוי
    kjvRefs:
    - Lamentations 1:22
    kjvOsis:
    - Lam.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.1
- type: TanakhVerse
  data:
    osis: Lam.2.1
    scripture: tanakh
    name: Tanakh Lamentations 2:1
    ref: Lamentations 2:1
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 19879
    text: How hath the Lord covered with a cloud The daughter of Zion in His anger! He hath cast down from heaven unto the earth The beauty of Israel, And hath not remembered His footstool In the day of His anger.
    translation: JPS 1917
    original: אֵיכָה יָעִיב בְּאַפּוֹ אֲדֹנָי אֶת־בַּת־צִיּוֹן הִשְׁלִיךְ מִשָּׁמַיִם אֶרֶץ תִּפְאֶרֶת יִשְׂרָאֵל וְלֹא־זָכַר הֲדֹם־רַגְלָיו בְּיוֹם אַפּוֹ׃
    hebrewPlain: איכה יעיב באפו אדני את בת ציון השליך משמים ארץ תפארת ישראל ולא זכר הדם רגליו ביום אפו
    kjvRefs:
    - Lamentations 2:1
    kjvOsis:
    - Lam.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.2
    scripture: tanakh
    name: Tanakh Lamentations 2:2
    ref: Lamentations 2:2
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 19880
    text: The Lord hath swallowed up unsparingly All the habitations of Jacob; He hath thrown down in His wrath The strongholds of the daughter of Judah; He hath brought them down to the ground; He hath profaned the kingdom and the princes thereof.
    translation: JPS 1917
    original: בִּלַּע אֲדֹנָי לא [וְלֹא] חָמַל אֵת כָּל־נְאוֹת יַעֲקֹב הָרַס בְּעֶבְרָתוֹ מִבְצְרֵי בַת־יְהוּדָה הִגִּיעַ לָאָרֶץ חִלֵּל מַמְלָכָה וְשָׂרֶיהָ׃
    hebrewPlain: בלע אדני לא [ולא] חמל את כל נאות יעקב הרס בעברתו מבצרי בת יהודה הגיע לארץ חלל ממלכה ושריה
    kjvRefs:
    - Lamentations 2:2
    kjvOsis:
    - Lam.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.3
    scripture: tanakh
    name: Tanakh Lamentations 2:3
    ref: Lamentations 2:3
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 19881
    text: He hath cut off in fierce anger All the horn of Israel; He hath drawn back His right hand From before the enemy; And He hath burned in Jacob like a flaming fire, Which devoureth round about.
    translation: JPS 1917
    original: גָּדַע בָּחֳרִי אַף כֹּל קֶרֶן יִשְׂרָאֵל הֵשִׁיב אָחוֹר יְמִינוֹ מִפְּנֵי אוֹיֵב וַיִּבְעַר בְּיַעֲקֹב כְּאֵשׁ לֶהָבָה אָכְלָה סָבִיב׃
    hebrewPlain: גדע בחרי אף כל קרן ישראל השיב אחור ימינו מפני אויב ויבער ביעקב כאש להבה אכלה סביב
    kjvRefs:
    - Lamentations 2:3
    kjvOsis:
    - Lam.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.4
    scripture: tanakh
    name: Tanakh Lamentations 2:4
    ref: Lamentations 2:4
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 19882
    text: He hath bent His bow like an enemy, Standing with His right hand as an adversary, And hath slain all that were pleasant to the eye; In the tent of the daughter of Zion He hath poured out His fury like fire.
    translation: JPS 1917
    original: דָּרַךְ קַשְׁתּוֹ כְּאוֹיֵב נִצָּב יְמִינוֹ כְּצָר וַיַּהֲרֹג כֹּל מַחֲמַדֵּי־עָיִן בְּאֹהֶל בַּת־צִיּוֹן שָׁפַךְ כָּאֵשׁ חֲמָתוֹ׃
    hebrewPlain: דרך קשתו כאויב נצב ימינו כצר ויהרג כל מחמדי עין באהל בת ציון שפך כאש חמתו
    kjvRefs:
    - Lamentations 2:4
    kjvOsis:
    - Lam.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.5
    scripture: tanakh
    name: Tanakh Lamentations 2:5
    ref: Lamentations 2:5
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 19883
    text: The Lord is become as an enemy, He hath swallowed up Israel; He hath swallowed up all her palaces, He hath destroyed his strongholds; And He hath multiplied in the daughter of Judah Mourning and moaning.
    translation: JPS 1917
    original: הָיָה אֲדֹנָי כְּאוֹיֵב בִּלַּע יִשְׂרָאֵל בִּלַּע כָּל־אַרְמְנוֹתֶיהָ שִׁחֵת מִבְצָרָיו וַיֶּרֶב בְּבַת־יְהוּדָה תַּאֲנִיָּה וַאֲנִיָּה׃
    hebrewPlain: היה אדני כאויב בלע ישראל בלע כל ארמנותיה שחת מבצריו וירב בבת יהודה תאניה ואניה
    kjvRefs:
    - Lamentations 2:5
    kjvOsis:
    - Lam.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.6
    scripture: tanakh
    name: Tanakh Lamentations 2:6
    ref: Lamentations 2:6
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 19884
    text: And He hath stripped His tabernacle, as if it were a garden, He hath destroyed His place of assembly; The LORD hath caused to be forgotten in Zion Appointed season and sabbath, And hath rejected in the indignation of His anger The king and the priest.
    translation: JPS 1917
    original: וַיַּחְמֹס כַּגַּן שֻׂכּוֹ שִׁחֵת מוֹעֲדוֹ שִׁכַּח יְהוָה בְּצִיּוֹן מוֹעֵד וְשַׁבָּת וַיִּנְאַץ בְּזַעַם־אַפּוֹ מֶלֶךְ וְכֹהֵן׃
    hebrewPlain: ויחמס כגן שכו שחת מועדו שכח יהוה בציון מועד ושבת וינאץ בזעם אפו מלך וכהן
    kjvRefs:
    - Lamentations 2:6
    kjvOsis:
    - Lam.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.7
    scripture: tanakh
    name: Tanakh Lamentations 2:7
    ref: Lamentations 2:7
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 19885
    text: The Lord hath cast off His altar, He hath abhorred His sanctuary, He hath given up into the hand of the enemy The walls of her palaces; They have made a noise in the house of the LORD, As in the day of a solemn assembly.
    translation: JPS 1917
    original: זָנַח אֲדֹנָי מִזְבְּחוֹ נִאֵר מִקְדָּשׁוֹ הִסְגִּיר בְּיַד־אוֹיֵב חוֹמֹת אַרְמְנוֹתֶיהָ קוֹל נָתְנוּ בְּבֵית־יְהוָה כְּיוֹם מוֹעֵד׃
    hebrewPlain: זנח אדני מזבחו נאר מקדשו הסגיר ביד אויב חומת ארמנותיה קול נתנו בבית יהוה כיום מועד
    kjvRefs:
    - Lamentations 2:7
    kjvOsis:
    - Lam.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.8
    scripture: tanakh
    name: Tanakh Lamentations 2:8
    ref: Lamentations 2:8
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 19886
    text: The LORD hath purposed to destroy The wall of the daughter of Zion; He hath stretched out the line, He hath not withdrawn His hand from destroying; But He hath made the rampart and wall to mourn, They languish together.
    translation: JPS 1917
    original: חָשַׁב יְהוָה לְהַשְׁחִית חוֹמַת בַּת־צִיּוֹן נָטָה קָו לֹא־הֵשִׁיב יָדוֹ מִבַּלֵּעַ וַיַּאֲבֶל־חֵל וְחוֹמָה יַחְדָּו אֻמְלָלוּ׃
    hebrewPlain: חשב יהוה להשחית חומת בת ציון נטה קו לא השיב ידו מבלע ויאבל חל וחומה יחדו אמללו
    kjvRefs:
    - Lamentations 2:8
    kjvOsis:
    - Lam.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.9
    scripture: tanakh
    name: Tanakh Lamentations 2:9
    ref: Lamentations 2:9
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 19887
    text: Her gates are sunk into the ground; He hath destroyed and broken her bars; Her king and her princes are among the nations, Instruction is no more; Yea, her prophets find No vision from the LORD.
    translation: JPS 1917
    original: טָבְעוּ בָאָרֶץ שְׁעָרֶיהָ אִבַּד וְשִׁבַּר בְּרִיחֶיהָ מַלְכָּהּ וְשָׂרֶיהָ בַגּוֹיִם אֵין תּוֹרָה גַּם־נְבִיאֶיהָ לֹא־מָצְאוּ חָזוֹן מֵיְהוָה׃
    hebrewPlain: טבעו בארץ שעריה אבד ושבר בריחיה מלכה ושריה בגוים אין תורה גם נביאיה לא מצאו חזון מיהוה
    kjvRefs:
    - Lamentations 2:9
    kjvOsis:
    - Lam.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.10
    scripture: tanakh
    name: Tanakh Lamentations 2:10
    ref: Lamentations 2:10
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 19888
    text: They sit upon the ground, and keep silence, The elders of the daughter of Zion; They have cast up dust upon their heads, They have girded themselves with sackcloth; The virgins of Jerusalem hang down Their heads to the ground.
    translation: JPS 1917
    original: יֵשְׁבוּ לָאָרֶץ יִדְּמוּ זִקְנֵי בַת־צִיּוֹן הֶעֱלוּ עָפָר עַל־רֹאשָׁם חָגְרוּ שַׂקִּים הוֹרִידוּ לָאָרֶץ רֹאשָׁן בְּתוּלֹת יְרוּשָׁלִָם׃
    hebrewPlain: ישבו לארץ ידמו זקני בת ציון העלו עפר על ראשם חגרו שקים הורידו לארץ ראשן בתולת ירושלם
    kjvRefs:
    - Lamentations 2:10
    kjvOsis:
    - Lam.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.11
    scripture: tanakh
    name: Tanakh Lamentations 2:11
    ref: Lamentations 2:11
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 19889
    text: Mine eyes do fail with tears, Mine inwards burn, My liver is poured upon the earth, For the breach of the daughter of my people; Because the young children and the sucklings swoon In the broad places of the city.
    translation: JPS 1917
    original: כָּלוּ בַדְּמָעוֹת עֵינַי חֳמַרְמְרוּ מֵעַי נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי עַל־שֶׁבֶר בַּת־עַמִּי בֵּעָטֵף עוֹלֵל וְיוֹנֵק בִּרְחֹבוֹת קִרְיָה׃
    hebrewPlain: כלו בדמעות עיני חמרמרו מעי נשפך לארץ כבדי על שבר בת עמי בעטף עולל ויונק ברחבות קריה
    kjvRefs:
    - Lamentations 2:11
    kjvOsis:
    - Lam.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.12
    scripture: tanakh
    name: Tanakh Lamentations 2:12
    ref: Lamentations 2:12
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 19890
    text: 'They say to their mothers: ‘Where is corn and wine?’ When they swoon as the wounded In the broad places of the city, When their soul is poured out Into their mothers’ bosom.'
    translation: JPS 1917
    original: לְאִמֹּתָם יֹאמְרוּ אַיֵּה דָּגָן וָיָיִן בְּהִתְעַטְּפָם כֶּחָלָל בִּרְחֹבוֹת עִיר בְּהִשְׁתַּפֵּךְ נַפְשָׁם אֶל־חֵיק אִמֹּתָם׃
    hebrewPlain: לאמתם יאמרו איה דגן ויין בהתעטפם כחלל ברחבות עיר בהשתפך נפשם אל חיק אמתם
    kjvRefs:
    - Lamentations 2:12
    kjvOsis:
    - Lam.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.13
    scripture: tanakh
    name: Tanakh Lamentations 2:13
    ref: Lamentations 2:13
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 19891
    text: What shall I take to witness for thee? What shall I liken to thee, O daughter of Jerusalem? What shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? For thy breach is great like the sea; Who can heal thee?
    translation: JPS 1917
    original: מָה־אֲעִידֵךְ מָה אֲדַמֶּה־לָּךְ הַבַּת יְרוּשָׁלִַם מָה אַשְׁוֶה־לָּךְ וַאֲנַחֲמֵךְ בְּתוּלַת בַּת־צִיּוֹן כִּי־גָדוֹל כַּיָּם שִׁבְרֵךְ מִי יִרְפָּא־לָךְ׃
    hebrewPlain: מה אעידך מה אדמה לך הבת ירושלם מה אשוה לך ואנחמך בתולת בת ציון כי גדול כים שברך מי ירפא לך
    kjvRefs:
    - Lamentations 2:13
    kjvOsis:
    - Lam.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.14
    scripture: tanakh
    name: Tanakh Lamentations 2:14
    ref: Lamentations 2:14
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 19892
    text: Thy prophets have seen visions for thee Of vanity and delusion; And they have not uncovered thine iniquity, To bring back thy captivity; But have prophesied for thee burdens Of vanity and seduction.
    translation: JPS 1917
    original: נְבִיאַיִךְ חָזוּ לָךְ שָׁוְא וְתָפֵל וְלֹא־גִלּוּ עַל־עֲוֺנֵךְ לְהָשִׁיב שביתך [שְׁבוּתֵךְ] וַיֶּחֱזוּ לָךְ מַשְׂאוֹת שָׁוְא וּמַדּוּחִים׃
    hebrewPlain: נביאיך חזו לך שוא ותפל ולא גלו על עונך להשיב שביתך [שבותך] ויחזו לך משאות שוא ומדוחים
    kjvRefs:
    - Lamentations 2:14
    kjvOsis:
    - Lam.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.15
    scripture: tanakh
    name: Tanakh Lamentations 2:15
    ref: Lamentations 2:15
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 19893
    text: 'All that pass by clap Their hands at thee; They hiss and wag their head At the daughter of Jerusalem: ‘Is this the city that men called The perfection of beauty, The joy of the whole earth?’ .'
    translation: JPS 1917
    original: סָפְקוּ עָלַיִךְ כַּפַּיִם כָּל־עֹבְרֵי דֶרֶךְ שָׁרְקוּ וַיָּנִעוּ רֹאשָׁם עַל־בַּת יְרוּשָׁלִָם הֲזֹאת הָעִיר שֶׁיֹּאמְרוּ כְּלִילַת יֹפִי מָשׂוֹשׂ לְכָל־הָאָרֶץ׃
    hebrewPlain: ספקו עליך כפים כל עברי דרך שרקו וינעו ראשם על בת ירושלם הזאת העיר שיאמרו כלילת יפי משוש לכל הארץ
    kjvRefs:
    - Lamentations 2:15
    kjvOsis:
    - Lam.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.16
    scripture: tanakh
    name: Tanakh Lamentations 2:16
    ref: Lamentations 2:16
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 19894
    text: 'All thine enemies have opened Their mouth wide against thee; They hiss and gnash the teeth; They say: ‘We have swallowed her up; Certainly this is the day that we looked for; We have found, we have seen it.’'
    translation: JPS 1917
    original: פָּצוּ עָלַיִךְ פִּיהֶם כָּל־אוֹיְבַיִךְ שָׁרְקוּ וַיַּחַרְקוּ־שֵׁן אָמְרוּ בִּלָּעְנוּ אַךְ זֶה הַיּוֹם שֶׁקִּוִּינֻהוּ מָצָאנוּ רָאִינוּ׃
    hebrewPlain: פצו עליך פיהם כל אויביך שרקו ויחרקו שן אמרו בלענו אך זה היום שקוינהו מצאנו ראינו
    kjvRefs:
    - Lamentations 2:16
    kjvOsis:
    - Lam.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.17
    scripture: tanakh
    name: Tanakh Lamentations 2:17
    ref: Lamentations 2:17
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 19895
    text: The LORD hath done that which He devised; He hath performed His word That He commanded in the days of old; He hath thrown down unsparingly; And He hath caused the enemy to rejoice over thee, He hath exalted the horn of thine adversaries.
    translation: JPS 1917
    original: עָשָׂה יְהוָה אֲשֶׁר זָמָם בִּצַּע אֶמְרָתוֹ אֲשֶׁר צִוָּה מִימֵי־קֶדֶם הָרַס וְלֹא חָמָל וַיְשַׂמַּח עָלַיִךְ אוֹיֵב הֵרִים קֶרֶן צָרָיִךְ׃
    hebrewPlain: עשה יהוה אשר זמם בצע אמרתו אשר צוה מימי קדם הרס ולא חמל וישמח עליך אויב הרים קרן צריך
    kjvRefs:
    - Lamentations 2:17
    kjvOsis:
    - Lam.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.18
    scripture: tanakh
    name: Tanakh Lamentations 2:18
    ref: Lamentations 2:18
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 19896
    text: 'Their heart cried unto the Lord: ‘O wall of the daughter of Zion, Let tears run down like a river Day and night; Give thyself no respite; Let not the apple of thine eye cease.'
    translation: JPS 1917
    original: צָעַק לִבָּם אֶל־אֲדֹנָי חוֹמַת בַּת־צִיּוֹן הוֹרִידִי כַנַּחַל דִּמְעָה יוֹמָם וָלַיְלָה אַל־תִּתְּנִי פוּגַת לָךְ אַל־תִּדֹּם בַּת־עֵינֵךְ׃
    hebrewPlain: צעק לבם אל אדני חומת בת ציון הורידי כנחל דמעה יומם ולילה אל תתני פוגת לך אל תדם בת עינך
    kjvRefs:
    - Lamentations 2:18
    kjvOsis:
    - Lam.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.19
    scripture: tanakh
    name: Tanakh Lamentations 2:19
    ref: Lamentations 2:19
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 19897
    text: Arise, cry out in the night, At the beginning of the watches; Pour out thy heart like water Before the face of the Lord; Lift up thy hands toward Him For the life of thy young children, That faint for hunger At the head of every street.’
    translation: JPS 1917
    original: קוּמִי רֹנִּי בליל [בַלַּיְלָה] לְרֹאשׁ אַשְׁמֻרוֹת שִׁפְכִי כַמַּיִם לִבֵּךְ נֹכַח פְּנֵי אֲדֹנָי שְׂאִי אֵלָיו כַּפַּיִךְ עַל־נֶפֶשׁ עוֹלָלַיִךְ הָעֲטוּפִים בְּרָעָב בְּרֹאשׁ כָּל־חוּצוֹת׃
    hebrewPlain: קומי רני בליל [בלילה] לראש אשמרות שפכי כמים לבך נכח פני אדני שאי אליו כפיך על נפש עולליך העטופים ברעב בראש כל חוצות
    kjvRefs:
    - Lamentations 2:19
    kjvOsis:
    - Lam.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.20
    scripture: tanakh
    name: Tanakh Lamentations 2:20
    ref: Lamentations 2:20
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 19898
    text: ’See, O LORD, and consider, To whom Thou hast done thus! Shall the women eat their fruit, The children that are dandled in the hands? Shall the priest and the prophet be slain In the sanctuary of the Lord?
    translation: JPS 1917
    original: רְאֵה יְהוָה וְהַבִּיטָה לְמִי עוֹלַלְתָּ כֹּה אִם־תֹּאכַלְנָה נָשִׁים פִּרְיָם עֹלֲלֵי טִפֻּחִים אִם־יֵהָרֵג בְּמִקְדַּשׁ אֲדֹנָי כֹּהֵן וְנָבִיא׃
    hebrewPlain: ראה יהוה והביטה למי עוללת כה אם תאכלנה נשים פרים עללי טפחים אם יהרג במקדש אדני כהן ונביא
    kjvRefs:
    - Lamentations 2:20
    kjvOsis:
    - Lam.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.21
    scripture: tanakh
    name: Tanakh Lamentations 2:21
    ref: Lamentations 2:21
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 19899
    text: The youth and the old man lie On the ground in the streets; My virgins and my young men Are fallen by the sword; Thou hast slain them in the day of Thine anger; Thou hast slaughtered unsparingly.
    translation: JPS 1917
    original: שָׁכְבוּ לָאָרֶץ חוּצוֹת נַעַר וְזָקֵן בְּתוּלֹתַי וּבַחוּרַי נָפְלוּ בֶחָרֶב הָרַגְתָּ בְּיוֹם אַפֶּךָ טָבַחְתָּ לֹא חָמָלְתָּ׃
    hebrewPlain: שכבו לארץ חוצות נער וזקן בתולתי ובחורי נפלו בחרב הרגת ביום אפך טבחת לא חמלת
    kjvRefs:
    - Lamentations 2:21
    kjvOsis:
    - Lam.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.2.22
    scripture: tanakh
    name: Tanakh Lamentations 2:22
    ref: Lamentations 2:22
    book: Lam
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 19900
    text: Thou hast called, as in the day of a solemn assembly, My terrors on every side, And there was none in the day of the LORD’S anger That escaped or remained; Those that I have dandled and brought up Hath mine enemy consumed.’
    translation: JPS 1917
    original: תִּקְרָא כְיוֹם מוֹעֵד מְגוּרַי מִסָּבִיב וְלֹא הָיָה בְּיוֹם אַף־יְהוָה פָּלִיט וְשָׂרִיד אֲשֶׁר־טִפַּחְתִּי וְרִבִּיתִי אֹיְבִי כִלָּם׃
    hebrewPlain: תקרא כיום מועד מגורי מסביב ולא היה ביום אף יהוה פליט ושריד אשר טפחתי ורביתי איבי כלם
    kjvRefs:
    - Lamentations 2:22
    kjvOsis:
    - Lam.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.2
- type: TanakhVerse
  data:
    osis: Lam.3.1
    scripture: tanakh
    name: Tanakh Lamentations 3:1
    ref: Lamentations 3:1
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 19901
    text: I am the man that hath seen affliction By the rod of His wrath.
    translation: JPS 1917
    original: אֲנִי הַגֶּבֶר רָאָה עֳנִי בְּשֵׁבֶט עֶבְרָתוֹ׃
    hebrewPlain: אני הגבר ראה עני בשבט עברתו
    kjvRefs:
    - Lamentations 3:1
    kjvOsis:
    - Lam.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.2
    scripture: tanakh
    name: Tanakh Lamentations 3:2
    ref: Lamentations 3:2
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 19902
    text: He hath led me and caused me to walk in darkness and not in light.
    translation: JPS 1917
    original: אוֹתִי נָהַג וַיֹּלַךְ חֹשֶׁךְ וְלֹא־אוֹר׃
    hebrewPlain: אותי נהג וילך חשך ולא אור
    kjvRefs:
    - Lamentations 3:2
    kjvOsis:
    - Lam.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.3
    scripture: tanakh
    name: Tanakh Lamentations 3:3
    ref: Lamentations 3:3
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 19903
    text: Surely against me He turneth His hand again and again all the day.
    translation: JPS 1917
    original: אַךְ בִּי יָשֻׁב יַהֲפֹךְ יָדוֹ כָּל־הַיּוֹם׃
    hebrewPlain: אך בי ישב יהפך ידו כל היום
    kjvRefs:
    - Lamentations 3:3
    kjvOsis:
    - Lam.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.4
    scripture: tanakh
    name: Tanakh Lamentations 3:4
    ref: Lamentations 3:4
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 19904
    text: My flesh and my skin hath He worn out; He hath broken my bones.
    translation: JPS 1917
    original: בִּלָּה בְשָׂרִי וְעוֹרִי שִׁבַּר עַצְמוֹתָי׃
    hebrewPlain: בלה בשרי ועורי שבר עצמותי
    kjvRefs:
    - Lamentations 3:4
    kjvOsis:
    - Lam.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.5
    scripture: tanakh
    name: Tanakh Lamentations 3:5
    ref: Lamentations 3:5
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 19905
    text: He hath builded against me, and compassed me With gall and travail.
    translation: JPS 1917
    original: בָּנָה עָלַי וַיַּקַּף רֹאשׁ וּתְלָאָה׃
    hebrewPlain: בנה עלי ויקף ראש ותלאה
    kjvRefs:
    - Lamentations 3:5
    kjvOsis:
    - Lam.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.6
    scripture: tanakh
    name: Tanakh Lamentations 3:6
    ref: Lamentations 3:6
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 19906
    text: He hath made me to dwell in dark places, As those that have been long dead. .
    translation: JPS 1917
    original: בְּמַחֲשַׁכִּים הוֹשִׁיבַנִי כְּמֵתֵי עוֹלָם׃
    hebrewPlain: במחשכים הושיבני כמתי עולם
    kjvRefs:
    - Lamentations 3:6
    kjvOsis:
    - Lam.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.7
    scripture: tanakh
    name: Tanakh Lamentations 3:7
    ref: Lamentations 3:7
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 19907
    text: He hath hedged me about, that I cannot go forth; He hath made my chain heavy.
    translation: JPS 1917
    original: גָּדַר בַּעֲדִי וְלֹא אֵצֵא הִכְבִּיד נְחָשְׁתִּי׃
    hebrewPlain: גדר בעדי ולא אצא הכביד נחשתי
    kjvRefs:
    - Lamentations 3:7
    kjvOsis:
    - Lam.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.8
    scripture: tanakh
    name: Tanakh Lamentations 3:8
    ref: Lamentations 3:8
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 19908
    text: Yea, when I cry and call for help, He shutteth out my prayer.
    translation: JPS 1917
    original: גַּם כִּי אֶזְעַק וַאֲשַׁוֵּעַ שָׂתַם תְּפִלָּתִי׃
    hebrewPlain: גם כי אזעק ואשוע שתם תפלתי
    kjvRefs:
    - Lamentations 3:8
    kjvOsis:
    - Lam.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.9
    scripture: tanakh
    name: Tanakh Lamentations 3:9
    ref: Lamentations 3:9
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 19909
    text: He hath enclosed my ways with hewn stone, He hath made my paths crooked.
    translation: JPS 1917
    original: גָּדַר דְּרָכַי בְּגָזִית נְתִיבֹתַי עִוָּה׃
    hebrewPlain: גדר דרכי בגזית נתיבתי עוה
    kjvRefs:
    - Lamentations 3:9
    kjvOsis:
    - Lam.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.10
    scripture: tanakh
    name: Tanakh Lamentations 3:10
    ref: Lamentations 3:10
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 19910
    text: He is unto me as a bear lying in wait, As a lion in secret places.
    translation: JPS 1917
    original: דֹּב אֹרֵב הוּא לִי אריה [אֲרִי] בְּמִסְתָּרִים׃
    hebrewPlain: דב ארב הוא לי אריה [ארי] במסתרים
    kjvRefs:
    - Lamentations 3:10
    kjvOsis:
    - Lam.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.11
    scripture: tanakh
    name: Tanakh Lamentations 3:11
    ref: Lamentations 3:11
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 19911
    text: He hath turned aside my ways, and pulled me in pieces; He hath made me desolate.
    translation: JPS 1917
    original: דְּרָכַי סוֹרֵר וַיְפַשְּׁחֵנִי שָׂמַנִי שֹׁמֵם׃
    hebrewPlain: דרכי סורר ויפשחני שמני שמם
    kjvRefs:
    - Lamentations 3:11
    kjvOsis:
    - Lam.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.12
    scripture: tanakh
    name: Tanakh Lamentations 3:12
    ref: Lamentations 3:12
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 19912
    text: He hath bent His bow, and set me As a mark for the arrow.
    translation: JPS 1917
    original: דָּרַךְ קַשְׁתוֹ וַיַּצִּיבֵנִי כַּמַּטָּרָא לַחֵץ׃
    hebrewPlain: דרך קשתו ויציבני כמטרא לחץ
    kjvRefs:
    - Lamentations 3:12
    kjvOsis:
    - Lam.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.13
    scripture: tanakh
    name: Tanakh Lamentations 3:13
    ref: Lamentations 3:13
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 19913
    text: He hath caused the arrows of His quiver To enter into my reins.
    translation: JPS 1917
    original: הֵבִיא בְּכִלְיוֹתָי בְּנֵי אַשְׁפָּתוֹ׃
    hebrewPlain: הביא בכליותי בני אשפתו
    kjvRefs:
    - Lamentations 3:13
    kjvOsis:
    - Lam.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.14
    scripture: tanakh
    name: Tanakh Lamentations 3:14
    ref: Lamentations 3:14
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 19914
    text: I am become a derision to all my people, And their song all the day.
    translation: JPS 1917
    original: הָיִיתִי שְּׂחֹק לְכָל־עַמִּי נְגִינָתָם כָּל־הַיּוֹם׃
    hebrewPlain: הייתי שחק לכל עמי נגינתם כל היום
    kjvRefs:
    - Lamentations 3:14
    kjvOsis:
    - Lam.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.15
    scripture: tanakh
    name: Tanakh Lamentations 3:15
    ref: Lamentations 3:15
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 19915
    text: He hath filled me with bitterness, He hath sated me with wormwood.
    translation: JPS 1917
    original: הִשְׂבִּיעַנִי בַמְּרוֹרִים הִרְוַנִי לַעֲנָה׃
    hebrewPlain: השביעני במרורים הרוני לענה
    kjvRefs:
    - Lamentations 3:15
    kjvOsis:
    - Lam.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.16
    scripture: tanakh
    name: Tanakh Lamentations 3:16
    ref: Lamentations 3:16
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 19916
    text: He hath also broken my teeth with gravel stones, He hath made me to wallow in ashes.
    translation: JPS 1917
    original: וַיַּגְרֵס בֶּחָצָץ שִׁנָּי הִכְפִּישַׁנִי בָּאֵפֶר׃
    hebrewPlain: ויגרס בחצץ שני הכפישני באפר
    kjvRefs:
    - Lamentations 3:16
    kjvOsis:
    - Lam.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.17
    scripture: tanakh
    name: Tanakh Lamentations 3:17
    ref: Lamentations 3:17
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 19917
    text: And my soul is removed far off from peace, I forgot prosperity.
    translation: JPS 1917
    original: וַתִּזְנַח מִשָּׁלוֹם נַפְשִׁי נָשִׁיתִי טוֹבָה׃
    hebrewPlain: ותזנח משלום נפשי נשיתי טובה
    kjvRefs:
    - Lamentations 3:17
    kjvOsis:
    - Lam.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.18
    scripture: tanakh
    name: Tanakh Lamentations 3:18
    ref: Lamentations 3:18
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 19918
    text: 'And I said: ‘My strength is perished, And mine expectation from the LORD.’'
    translation: JPS 1917
    original: וָאֹמַר אָבַד נִצְחִי וְתוֹחַלְתִּי מֵיְהוָה׃
    hebrewPlain: ואמר אבד נצחי ותוחלתי מיהוה
    kjvRefs:
    - Lamentations 3:18
    kjvOsis:
    - Lam.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.19
    scripture: tanakh
    name: Tanakh Lamentations 3:19
    ref: Lamentations 3:19
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 19
    ordinal: 19919
    text: Remember mine affliction and mine anguish, The wormwood and the gall.
    translation: JPS 1917
    original: זְכָר־עָנְיִי וּמְרוּדִי לַעֲנָה וָרֹאשׁ׃
    hebrewPlain: זכר עניי ומרודי לענה וראש
    kjvRefs:
    - Lamentations 3:19
    kjvOsis:
    - Lam.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.20
    scripture: tanakh
    name: Tanakh Lamentations 3:20
    ref: Lamentations 3:20
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 20
    ordinal: 19920
    text: My soul hath them still in remembrance, And is bowed down within me.
    translation: JPS 1917
    original: זָכוֹר תִּזְכּוֹר ותשיח [וְתָשׁוֹחַ] עָלַי נַפְשִׁי׃
    hebrewPlain: זכור תזכור ותשיח [ותשוח] עלי נפשי
    kjvRefs:
    - Lamentations 3:20
    kjvOsis:
    - Lam.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.21
    scripture: tanakh
    name: Tanakh Lamentations 3:21
    ref: Lamentations 3:21
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 21
    ordinal: 19921
    text: This I recall to my mind, Therefore have I hope.
    translation: JPS 1917
    original: זֹאת אָשִׁיב אֶל־לִבִּי עַל־כֵּן אוֹחִיל׃
    hebrewPlain: זאת אשיב אל לבי על כן אוחיל
    kjvRefs:
    - Lamentations 3:21
    kjvOsis:
    - Lam.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.22
    scripture: tanakh
    name: Tanakh Lamentations 3:22
    ref: Lamentations 3:22
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 22
    ordinal: 19922
    text: Surely the LORD’S mercies are not consumed, Surely His compassions fail not.
    translation: JPS 1917
    original: חַסְדֵי יְהוָה כִּי לֹא־תָמְנוּ כִּי לֹא־כָלוּ רַחֲמָיו׃
    hebrewPlain: חסדי יהוה כי לא תמנו כי לא כלו רחמיו
    kjvRefs:
    - Lamentations 3:22
    kjvOsis:
    - Lam.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.23
    scripture: tanakh
    name: Tanakh Lamentations 3:23
    ref: Lamentations 3:23
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 23
    ordinal: 19923
    text: They are new every morning; Great is Thy faithfulness.
    translation: JPS 1917
    original: חֲדָשִׁים לַבְּקָרִים רַבָּה אֱמוּנָתֶךָ׃
    hebrewPlain: חדשים לבקרים רבה אמונתך
    kjvRefs:
    - Lamentations 3:23
    kjvOsis:
    - Lam.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.24
    scripture: tanakh
    name: Tanakh Lamentations 3:24
    ref: Lamentations 3:24
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 24
    ordinal: 19924
    text: ’The LORD is my portion’, saith my soul; ‘Therefore will I hope in Him.’
    translation: JPS 1917
    original: חֶלְקִי יְהוָה אָמְרָה נַפְשִׁי עַל־כֵּן אוֹחִיל לוֹ׃
    hebrewPlain: חלקי יהוה אמרה נפשי על כן אוחיל לו
    kjvRefs:
    - Lamentations 3:24
    kjvOsis:
    - Lam.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.25
    scripture: tanakh
    name: Tanakh Lamentations 3:25
    ref: Lamentations 3:25
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 25
    ordinal: 19925
    text: The LORD is good unto them that wait for Him, To the soul that seeketh Him.
    translation: JPS 1917
    original: טוֹב יְהוָה לְקוָֹו לְנֶפֶשׁ תִּדְרְשֶׁנּוּ׃
    hebrewPlain: טוב יהוה לקוו לנפש תדרשנו
    kjvRefs:
    - Lamentations 3:25
    kjvOsis:
    - Lam.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.26
    scripture: tanakh
    name: Tanakh Lamentations 3:26
    ref: Lamentations 3:26
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 26
    ordinal: 19926
    text: It is good that a man should quietly wait For the salvation of the LORD.
    translation: JPS 1917
    original: טוֹב וְיָחִיל וְדוּמָם לִתְשׁוּעַת יְהוָה׃
    hebrewPlain: טוב ויחיל ודומם לתשועת יהוה
    kjvRefs:
    - Lamentations 3:26
    kjvOsis:
    - Lam.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.27
    scripture: tanakh
    name: Tanakh Lamentations 3:27
    ref: Lamentations 3:27
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 27
    ordinal: 19927
    text: It is good for a man that he bear The yoke in his youth.
    translation: JPS 1917
    original: טוֹב לַגֶּבֶר כִּי־יִשָּׂא עֹל בִּנְעוּרָיו׃
    hebrewPlain: טוב לגבר כי ישא על בנעוריו
    kjvRefs:
    - Lamentations 3:27
    kjvOsis:
    - Lam.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.28
    scripture: tanakh
    name: Tanakh Lamentations 3:28
    ref: Lamentations 3:28
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 28
    ordinal: 19928
    text: Let him sit alone and keep silence, Because He hath laid it upon him.
    translation: JPS 1917
    original: יֵשֵׁב בָּדָד וְיִדֹּם כִּי נָטַל עָלָיו׃
    hebrewPlain: ישב בדד וידם כי נטל עליו
    kjvRefs:
    - Lamentations 3:28
    kjvOsis:
    - Lam.3.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.29
    scripture: tanakh
    name: Tanakh Lamentations 3:29
    ref: Lamentations 3:29
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 29
    ordinal: 19929
    text: Let him put his mouth in the dust, If so be there may be hope.
    translation: JPS 1917
    original: יִתֵּן בֶּעָפָר פִּיהוּ אוּלַי יֵשׁ תִּקְוָה׃
    hebrewPlain: יתן בעפר פיהו אולי יש תקוה
    kjvRefs:
    - Lamentations 3:29
    kjvOsis:
    - Lam.3.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.30
    scripture: tanakh
    name: Tanakh Lamentations 3:30
    ref: Lamentations 3:30
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 30
    ordinal: 19930
    text: Let him give his cheek to him that smiteth him Let him be filled full with reproach.
    translation: JPS 1917
    original: יִתֵּן לְמַכֵּהוּ לֶחִי יִשְׂבַּע בְּחֶרְפָּה׃
    hebrewPlain: יתן למכהו לחי ישבע בחרפה
    kjvRefs:
    - Lamentations 3:30
    kjvOsis:
    - Lam.3.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.31
    scripture: tanakh
    name: Tanakh Lamentations 3:31
    ref: Lamentations 3:31
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 31
    ordinal: 19931
    text: For the Lord will not cast off For ever.
    translation: JPS 1917
    original: כִּי לֹא יִזְנַח לְעוֹלָם אֲדֹנָי׃
    hebrewPlain: כי לא יזנח לעולם אדני
    kjvRefs:
    - Lamentations 3:31
    kjvOsis:
    - Lam.3.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.32
    scripture: tanakh
    name: Tanakh Lamentations 3:32
    ref: Lamentations 3:32
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 32
    ordinal: 19932
    text: For though He cause grief, yet will He have compassion According to the multitude of His mercies.
    translation: JPS 1917
    original: כִּי אִם־הוֹגָה וְרִחַם כְּרֹב חסדו [חֲסָדָיו׃]
    hebrewPlain: כי אם הוגה ורחם כרב חסדו [חסדיו]
    kjvRefs:
    - Lamentations 3:32
    kjvOsis:
    - Lam.3.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.33
    scripture: tanakh
    name: Tanakh Lamentations 3:33
    ref: Lamentations 3:33
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 33
    ordinal: 19933
    text: For He doth not afflict willingly, Nor grieve the children of men.
    translation: JPS 1917
    original: כִּי לֹא עִנָּה מִלִּבּוֹ וַיַּגֶּה בְנֵי־אִישׁ׃
    hebrewPlain: כי לא ענה מלבו ויגה בני איש
    kjvRefs:
    - Lamentations 3:33
    kjvOsis:
    - Lam.3.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.34
    scripture: tanakh
    name: Tanakh Lamentations 3:34
    ref: Lamentations 3:34
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 34
    ordinal: 19934
    text: To crush under foot All the prisoners of the earth,
    translation: JPS 1917
    original: לְדַכֵּא תַּחַת רַגְלָיו כֹּל אֲסִירֵי אָרֶץ׃
    hebrewPlain: לדכא תחת רגליו כל אסירי ארץ
    kjvRefs:
    - Lamentations 3:34
    kjvOsis:
    - Lam.3.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.35
    scripture: tanakh
    name: Tanakh Lamentations 3:35
    ref: Lamentations 3:35
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 35
    ordinal: 19935
    text: To turn aside the right of a man Before the face of the Most High,
    translation: JPS 1917
    original: לְהַטּוֹת מִשְׁפַּט־גָּבֶר נֶגֶד פְּנֵי עֶלְיוֹן׃
    hebrewPlain: להטות משפט גבר נגד פני עליון
    kjvRefs:
    - Lamentations 3:35
    kjvOsis:
    - Lam.3.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.36
    scripture: tanakh
    name: Tanakh Lamentations 3:36
    ref: Lamentations 3:36
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 36
    ordinal: 19936
    text: To subvert a man in his cause, The Lord approveth not.
    translation: JPS 1917
    original: לְעַוֵּת אָדָם בְּרִיבוֹ אֲדֹנָי לֹא רָאָה׃
    hebrewPlain: לעות אדם בריבו אדני לא ראה
    kjvRefs:
    - Lamentations 3:36
    kjvOsis:
    - Lam.3.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.37
    scripture: tanakh
    name: Tanakh Lamentations 3:37
    ref: Lamentations 3:37
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 37
    ordinal: 19937
    text: Who is he that saith, and it cometh to pass, When the Lord commandeth it not?
    translation: JPS 1917
    original: מִי זֶה אָמַר וַתֶּהִי אֲדֹנָי לֹא צִוָּה׃
    hebrewPlain: מי זה אמר ותהי אדני לא צוה
    kjvRefs:
    - Lamentations 3:37
    kjvOsis:
    - Lam.3.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.38
    scripture: tanakh
    name: Tanakh Lamentations 3:38
    ref: Lamentations 3:38
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 38
    ordinal: 19938
    text: Out of the mouth of the Most High proceedeth not Evil and good?
    translation: JPS 1917
    original: מִפִּי עֶלְיוֹן לֹא תֵצֵא הָרָעוֹת וְהַטּוֹב׃
    hebrewPlain: מפי עליון לא תצא הרעות והטוב
    kjvRefs:
    - Lamentations 3:38
    kjvOsis:
    - Lam.3.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.39
    scripture: tanakh
    name: Tanakh Lamentations 3:39
    ref: Lamentations 3:39
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 39
    ordinal: 19939
    text: Wherefore doth a living man complain, A strong man because of his sins?
    translation: JPS 1917
    original: מַה־יִּתְאוֹנֵן אָדָם חָי גֶּבֶר עַל־חטאו [חֲטָאָיו׃]
    hebrewPlain: מה יתאונן אדם חי גבר על חטאו [חטאיו]
    kjvRefs:
    - Lamentations 3:39
    kjvOsis:
    - Lam.3.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.40
    scripture: tanakh
    name: Tanakh Lamentations 3:40
    ref: Lamentations 3:40
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 40
    ordinal: 19940
    text: Let us search and try our ways, And return to the LORD.
    translation: JPS 1917
    original: נַחְפְּשָׂה דְרָכֵינוּ וְנַחְקֹרָה וְנָשׁוּבָה עַד־יְהוָה׃
    hebrewPlain: נחפשה דרכינו ונחקרה ונשובה עד יהוה
    kjvRefs:
    - Lamentations 3:40
    kjvOsis:
    - Lam.3.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.41
    scripture: tanakh
    name: Tanakh Lamentations 3:41
    ref: Lamentations 3:41
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 41
    ordinal: 19941
    text: Let us lift up our heart with our hands Unto God in the heavens.
    translation: JPS 1917
    original: נִשָּׂא לְבָבֵנוּ אֶל־כַּפָּיִם אֶל־אֵל בַּשָּׁמָיִם׃
    hebrewPlain: נשא לבבנו אל כפים אל אל בשמים
    kjvRefs:
    - Lamentations 3:41
    kjvOsis:
    - Lam.3.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.42
    scripture: tanakh
    name: Tanakh Lamentations 3:42
    ref: Lamentations 3:42
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 42
    ordinal: 19942
    text: We have transgressed and have rebelled; Thou hast not pardoned.
    translation: JPS 1917
    original: נַחְנוּ פָשַׁעְנוּ וּמָרִינוּ אַתָּה לֹא סָלָחְתָּ׃
    hebrewPlain: נחנו פשענו ומרינו אתה לא סלחת
    kjvRefs:
    - Lamentations 3:42
    kjvOsis:
    - Lam.3.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.43
    scripture: tanakh
    name: Tanakh Lamentations 3:43
    ref: Lamentations 3:43
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 43
    ordinal: 19943
    text: Thou hast covered with anger and pursued us; Thou hast slain unsparingly.
    translation: JPS 1917
    original: סַכֹּתָה בָאַף וַתִּרְדְּפֵנוּ הָרַגְתָּ לֹא חָמָלְתָּ׃
    hebrewPlain: סכתה באף ותרדפנו הרגת לא חמלת
    kjvRefs:
    - Lamentations 3:43
    kjvOsis:
    - Lam.3.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.44
    scripture: tanakh
    name: Tanakh Lamentations 3:44
    ref: Lamentations 3:44
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 44
    ordinal: 19944
    text: Thou hast covered Thyself with a cloud, So that no prayer can pass through.
    translation: JPS 1917
    original: סַכּוֹתָה בֶעָנָן לָךְ מֵעֲבוֹר תְּפִלָּה׃
    hebrewPlain: סכותה בענן לך מעבור תפלה
    kjvRefs:
    - Lamentations 3:44
    kjvOsis:
    - Lam.3.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.45
    scripture: tanakh
    name: Tanakh Lamentations 3:45
    ref: Lamentations 3:45
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 45
    ordinal: 19945
    text: Thou hast made us as the offscouring and refuse In the midst of the peoples.
    translation: JPS 1917
    original: סְחִי וּמָאוֹס תְּשִׂימֵנוּ בְּקֶרֶב הָעַמִּים׃
    hebrewPlain: סחי ומאוס תשימנו בקרב העמים
    kjvRefs:
    - Lamentations 3:45
    kjvOsis:
    - Lam.3.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.46
    scripture: tanakh
    name: Tanakh Lamentations 3:46
    ref: Lamentations 3:46
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 46
    ordinal: 19946
    text: All our enemies have opened their mouth Wide against us.
    translation: JPS 1917
    original: פָּצוּ עָלֵינוּ פִּיהֶם כָּל־אֹיְבֵינוּ׃
    hebrewPlain: פצו עלינו פיהם כל איבינו
    kjvRefs:
    - Lamentations 3:46
    kjvOsis:
    - Lam.3.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.47
    scripture: tanakh
    name: Tanakh Lamentations 3:47
    ref: Lamentations 3:47
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 47
    ordinal: 19947
    text: Terror and the pit are come upon us, Desolation and destruction.
    translation: JPS 1917
    original: פַּחַד וָפַחַת הָיָה לָנוּ הַשֵּׁאת וְהַשָּׁבֶר׃
    hebrewPlain: פחד ופחת היה לנו השאת והשבר
    kjvRefs:
    - Lamentations 3:47
    kjvOsis:
    - Lam.3.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.48
    scripture: tanakh
    name: Tanakh Lamentations 3:48
    ref: Lamentations 3:48
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 48
    ordinal: 19948
    text: Mine eye runneth down with rivers of water, For the breach of the daughter of my people.
    translation: JPS 1917
    original: פַּלְגֵי־מַיִם תֵּרַד עֵינִי עַל־שֶׁבֶר בַּת־עַמִּי׃
    hebrewPlain: פלגי מים תרד עיני על שבר בת עמי
    kjvRefs:
    - Lamentations 3:48
    kjvOsis:
    - Lam.3.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.49
    scripture: tanakh
    name: Tanakh Lamentations 3:49
    ref: Lamentations 3:49
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 49
    ordinal: 19949
    text: Mine eye is poured out, and ceaseth not, Without any intermission,
    translation: JPS 1917
    original: עֵינִי נִגְּרָה וְלֹא תִדְמֶה מֵאֵין הֲפֻגוֹת׃
    hebrewPlain: עיני נגרה ולא תדמה מאין הפגות
    kjvRefs:
    - Lamentations 3:49
    kjvOsis:
    - Lam.3.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.50
    scripture: tanakh
    name: Tanakh Lamentations 3:50
    ref: Lamentations 3:50
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 50
    ordinal: 19950
    text: Till the LORD look forth, And behold from heaven.
    translation: JPS 1917
    original: עַד־יַשְׁקִיף וְיֵרֶא יְהוָה מִשָּׁמָיִם׃
    hebrewPlain: עד ישקיף וירא יהוה משמים
    kjvRefs:
    - Lamentations 3:50
    kjvOsis:
    - Lam.3.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.51
    scripture: tanakh
    name: Tanakh Lamentations 3:51
    ref: Lamentations 3:51
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 51
    ordinal: 19951
    text: Mine eye affected my soul, Because of all the daughters of my city.
    translation: JPS 1917
    original: עֵינִי עוֹלְלָה לְנַפְשִׁי מִכֹּל בְּנוֹת עִירִי׃
    hebrewPlain: עיני עוללה לנפשי מכל בנות עירי
    kjvRefs:
    - Lamentations 3:51
    kjvOsis:
    - Lam.3.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.52
    scripture: tanakh
    name: Tanakh Lamentations 3:52
    ref: Lamentations 3:52
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 52
    ordinal: 19952
    text: They have chased me sore like a bird, That are mine enemies without cause.
    translation: JPS 1917
    original: צוֹד צָדוּנִי כַּצִּפּוֹר אֹיְבַי חִנָּם׃
    hebrewPlain: צוד צדוני כצפור איבי חנם
    kjvRefs:
    - Lamentations 3:52
    kjvOsis:
    - Lam.3.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.53
    scripture: tanakh
    name: Tanakh Lamentations 3:53
    ref: Lamentations 3:53
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 53
    ordinal: 19953
    text: They have cut off my life in the dungeon, And have cast stones upon me.
    translation: JPS 1917
    original: צָמְתוּ בַבּוֹר חַיָּי וַיַּדּוּ־אֶבֶן בִּי׃
    hebrewPlain: צמתו בבור חיי וידו אבן בי
    kjvRefs:
    - Lamentations 3:53
    kjvOsis:
    - Lam.3.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.54
    scripture: tanakh
    name: Tanakh Lamentations 3:54
    ref: Lamentations 3:54
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 54
    ordinal: 19954
    text: 'Waters flowed over my head; I said: ‘I am cut off.’'
    translation: JPS 1917
    original: צָפוּ־מַיִם עַל־רֹאשִׁי אָמַרְתִּי נִגְזָרְתִּי׃
    hebrewPlain: צפו מים על ראשי אמרתי נגזרתי
    kjvRefs:
    - Lamentations 3:54
    kjvOsis:
    - Lam.3.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.55
    scripture: tanakh
    name: Tanakh Lamentations 3:55
    ref: Lamentations 3:55
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 55
    ordinal: 19955
    text: I called upon Thy name, O LORD, Out of the lowest dungeon.
    translation: JPS 1917
    original: קָרָאתִי שִׁמְךָ יְהוָה מִבּוֹר תַּחְתִּיּוֹת׃
    hebrewPlain: קראתי שמך יהוה מבור תחתיות
    kjvRefs:
    - Lamentations 3:55
    kjvOsis:
    - Lam.3.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.56
    scripture: tanakh
    name: Tanakh Lamentations 3:56
    ref: Lamentations 3:56
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 56
    ordinal: 19956
    text: Thou heardest my voice; hide not Thine ear at my sighing, at my cry.
    translation: JPS 1917
    original: קוֹלִי שָׁמָעְתָּ אַל־תַּעְלֵם אָזְנְךָ לְרַוְחָתִי לְשַׁוְעָתִי׃
    hebrewPlain: קולי שמעת אל תעלם אזנך לרוחתי לשועתי
    kjvRefs:
    - Lamentations 3:56
    kjvOsis:
    - Lam.3.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.57
    scripture: tanakh
    name: Tanakh Lamentations 3:57
    ref: Lamentations 3:57
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 57
    ordinal: 19957
    text: 'Thou drewest near in the day that I called upon Thee; Thou saidst: ‘Fear not.’ .'
    translation: JPS 1917
    original: קָרַבְתָּ בְּיוֹם אֶקְרָאֶךָּ אָמַרְתָּ אַל־תִּירָא׃
    hebrewPlain: קרבת ביום אקראך אמרת אל תירא
    kjvRefs:
    - Lamentations 3:57
    kjvOsis:
    - Lam.3.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.58
    scripture: tanakh
    name: Tanakh Lamentations 3:58
    ref: Lamentations 3:58
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 58
    ordinal: 19958
    text: O Lord, Thou hast pleaded the causes of my soul; Thou hast redeemed my life.
    translation: JPS 1917
    original: רַבְתָּ אֲדֹנָי רִיבֵי נַפְשִׁי גָּאַלְתָּ חַיָּי׃
    hebrewPlain: רבת אדני ריבי נפשי גאלת חיי
    kjvRefs:
    - Lamentations 3:58
    kjvOsis:
    - Lam.3.58
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.59
    scripture: tanakh
    name: Tanakh Lamentations 3:59
    ref: Lamentations 3:59
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 59
    ordinal: 19959
    text: O LORD, Thou hast seen my wrong; Judge Thou my cause.
    translation: JPS 1917
    original: רָאִיתָה יְהוָה עַוָּתָתִי שָׁפְטָה מִשְׁפָּטִי׃
    hebrewPlain: ראיתה יהוה עותתי שפטה משפטי
    kjvRefs:
    - Lamentations 3:59
    kjvOsis:
    - Lam.3.59
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.60
    scripture: tanakh
    name: Tanakh Lamentations 3:60
    ref: Lamentations 3:60
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 60
    ordinal: 19960
    text: Thou hast seen all their vengeance And all their devices against me.
    translation: JPS 1917
    original: רָאִיתָה כָּל־נִקְמָתָם כָּל־מַחְשְׁבֹתָם לִי׃
    hebrewPlain: ראיתה כל נקמתם כל מחשבתם לי
    kjvRefs:
    - Lamentations 3:60
    kjvOsis:
    - Lam.3.60
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.61
    scripture: tanakh
    name: Tanakh Lamentations 3:61
    ref: Lamentations 3:61
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 61
    ordinal: 19961
    text: Thou hast heard their taunt, O LORD, And all their devices against me;
    translation: JPS 1917
    original: שָׁמַעְתָּ חֶרְפָּתָם יְהוָה כָּל־מַחְשְׁבֹתָם עָלָי׃
    hebrewPlain: שמעת חרפתם יהוה כל מחשבתם עלי
    kjvRefs:
    - Lamentations 3:61
    kjvOsis:
    - Lam.3.61
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.62
    scripture: tanakh
    name: Tanakh Lamentations 3:62
    ref: Lamentations 3:62
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 62
    ordinal: 19962
    text: The lips of those that rose up against me, And their muttering against me all the day.
    translation: JPS 1917
    original: שִׂפְתֵי קָמַי וְהֶגְיוֹנָם עָלַי כָּל־הַיּוֹם׃
    hebrewPlain: שפתי קמי והגיונם עלי כל היום
    kjvRefs:
    - Lamentations 3:62
    kjvOsis:
    - Lam.3.62
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.63
    scripture: tanakh
    name: Tanakh Lamentations 3:63
    ref: Lamentations 3:63
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 63
    ordinal: 19963
    text: Behold Thou their sitting down, and their rising up; I am their song.
    translation: JPS 1917
    original: שִׁבְתָּם וְקִימָתָם הַבִּיטָה אֲנִי מַנְגִּינָתָם׃
    hebrewPlain: שבתם וקימתם הביטה אני מנגינתם
    kjvRefs:
    - Lamentations 3:63
    kjvOsis:
    - Lam.3.63
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.64
    scripture: tanakh
    name: Tanakh Lamentations 3:64
    ref: Lamentations 3:64
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 64
    ordinal: 19964
    text: Thou wilt render unto them a recompense, O LORD, According to the work of their hands.
    translation: JPS 1917
    original: תָּשִׁיב לָהֶם גְּמוּל יְהוָה כְּמַעֲשֵׂה יְדֵיהֶם׃
    hebrewPlain: תשיב להם גמול יהוה כמעשה ידיהם
    kjvRefs:
    - Lamentations 3:64
    kjvOsis:
    - Lam.3.64
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.65
    scripture: tanakh
    name: Tanakh Lamentations 3:65
    ref: Lamentations 3:65
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 65
    ordinal: 19965
    text: Thou wilt give them hardness of heart, Thy curse unto them.
    translation: JPS 1917
    original: תִּתֵּן לָהֶם מְגִנַּת־לֵב תַּאֲלָתְךָ לָהֶם׃
    hebrewPlain: תתן להם מגנת לב תאלתך להם
    kjvRefs:
    - Lamentations 3:65
    kjvOsis:
    - Lam.3.65
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.3.66
    scripture: tanakh
    name: Tanakh Lamentations 3:66
    ref: Lamentations 3:66
    book: Lam
    section: ketuvim
    chapter: 3
    verse: 66
    ordinal: 19966
    text: Thou wilt pursue them in anger, and destroy them From under the heavens of the LORD.
    translation: JPS 1917
    original: תִּרְדֹּף בְּאַף וְתַשְׁמִידֵם מִתַּחַת שְׁמֵי יְהוָה׃
    hebrewPlain: תרדף באף ותשמידם מתחת שמי יהוה
    kjvRefs:
    - Lamentations 3:66
    kjvOsis:
    - Lam.3.66
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.3
- type: TanakhVerse
  data:
    osis: Lam.4.1
    scripture: tanakh
    name: Tanakh Lamentations 4:1
    ref: Lamentations 4:1
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 19967
    text: How is the gold become dim! How is the most fine gold changed! The hallowed stones are poured out At the head of every street.
    translation: JPS 1917
    original: אֵיכָה יוּעַם זָהָב יִשְׁנֶא הַכֶּתֶם הַטּוֹב תִּשְׁתַּפֵּכְנָה אַבְנֵי־קֹדֶשׁ בְּרֹאשׁ כָּל־חוּצוֹת׃
    hebrewPlain: איכה יועם זהב ישנא הכתם הטוב תשתפכנה אבני קדש בראש כל חוצות
    kjvRefs:
    - Lamentations 4:1
    kjvOsis:
    - Lam.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.2
    scripture: tanakh
    name: Tanakh Lamentations 4:2
    ref: Lamentations 4:2
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 19968
    text: The precious sons of Zion, Comparable to fine gold, How are they esteemed as earthen pitchers, The work of the hands of the potter!
    translation: JPS 1917
    original: בְּנֵי צִיּוֹן הַיְקָרִים הַמְסֻלָּאִים בַּפָּז אֵיכָה נֶחְשְׁבוּ לְנִבְלֵי־חֶרֶשׂ מַעֲשֵׂה יְדֵי יוֹצֵר׃
    hebrewPlain: בני ציון היקרים המסלאים בפז איכה נחשבו לנבלי חרש מעשה ידי יוצר
    kjvRefs:
    - Lamentations 4:2
    kjvOsis:
    - Lam.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.3
    scripture: tanakh
    name: Tanakh Lamentations 4:3
    ref: Lamentations 4:3
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 19969
    text: Even the jackals draw out the breast, They give suck to their young ones; The daughter of my people is become cruel, Like the ostriches in the wilderness.
    translation: JPS 1917
    original: גַּם־תנין [תַּנִּים] חָלְצוּ שַׁד הֵינִיקוּ גּוּרֵיהֶן בַּת־עַמִּי לְאַכְזָר כי ענים [כַּיְעֵנִים] בַּמִּדְבָּר׃
    hebrewPlain: גם תנין [תנים] חלצו שד היניקו גוריהן בת עמי לאכזר כי ענים [כיענים] במדבר
    kjvRefs:
    - Lamentations 4:3
    kjvOsis:
    - Lam.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.4
    scripture: tanakh
    name: Tanakh Lamentations 4:4
    ref: Lamentations 4:4
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 19970
    text: The tongue of the sucking child cleaveth To the roof of his mouth for thirst; The young children ask bread, And none breaketh it unto them.
    translation: JPS 1917
    original: דָּבַק לְשׁוֹן יוֹנֵק אֶל־חִכּוֹ בַּצָּמָא עוֹלָלִים שָׁאֲלוּ לֶחֶם פֹּרֵשׂ אֵין לָהֶם׃
    hebrewPlain: דבק לשון יונק אל חכו בצמא עוללים שאלו לחם פרש אין להם
    kjvRefs:
    - Lamentations 4:4
    kjvOsis:
    - Lam.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.5
    scripture: tanakh
    name: Tanakh Lamentations 4:5
    ref: Lamentations 4:5
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 19971
    text: They that did feed on dainties Are desolate in the streets; They that were brought up in scarlet Embrace dunghills.
    translation: JPS 1917
    original: הָאֹכְלִים לְמַעֲדַנִּים נָשַׁמּוּ בַּחוּצוֹת הָאֱמֻנִים עֲלֵי תוֹלָע חִבְּקוּ אַשְׁפַּתּוֹת׃
    hebrewPlain: האכלים למעדנים נשמו בחוצות האמנים עלי תולע חבקו אשפתות
    kjvRefs:
    - Lamentations 4:5
    kjvOsis:
    - Lam.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.6
    scripture: tanakh
    name: Tanakh Lamentations 4:6
    ref: Lamentations 4:6
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 19972
    text: For the iniquity of the daughter of my people is greater Than the sin of Sodom, That was overthrown as in a moment, And no hands fell upon her.
    translation: JPS 1917
    original: וַיִּגְדַּל עֲוֺן בַּת־עַמִּי מֵחַטַּאת סְדֹם הַהֲפוּכָה כְמוֹ־רָגַע וְלֹא־חָלוּ בָהּ יָדָיִם׃
    hebrewPlain: ויגדל עון בת עמי מחטאת סדם ההפוכה כמו רגע ולא חלו בה ידים
    kjvRefs:
    - Lamentations 4:6
    kjvOsis:
    - Lam.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.7
    scripture: tanakh
    name: Tanakh Lamentations 4:7
    ref: Lamentations 4:7
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 19973
    text: Her princes were purer than snow, They were whiter than milk, They were more ruddy in body than rubies, Their polishing was as of sapphire;
    translation: JPS 1917
    original: זַכּוּ נְזִירֶיהָ מִשֶּׁלֶג צַחוּ מֵחָלָב אָדְמוּ עֶצֶם מִפְּנִינִים סַפִּיר גִּזְרָתָם׃
    hebrewPlain: זכו נזיריה משלג צחו מחלב אדמו עצם מפנינים ספיר גזרתם
    kjvRefs:
    - Lamentations 4:7
    kjvOsis:
    - Lam.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.8
    scripture: tanakh
    name: Tanakh Lamentations 4:8
    ref: Lamentations 4:8
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 19974
    text: Their visage is blacker than a coal; They are not known in the streets; Their skin is shrivelled upon their bones; It is withered, it is become like a stick.
    translation: JPS 1917
    original: חָשַׁךְ מִשְּׁחוֹר תָּאֳרָם לֹא נִכְּרוּ בַּחוּצוֹת צָפַד עוֹרָם עַל־עַצְמָם יָבֵשׁ הָיָה כָעֵץ׃
    hebrewPlain: חשך משחור תארם לא נכרו בחוצות צפד עורם על עצמם יבש היה כעץ
    kjvRefs:
    - Lamentations 4:8
    kjvOsis:
    - Lam.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.9
    scripture: tanakh
    name: Tanakh Lamentations 4:9
    ref: Lamentations 4:9
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 19975
    text: They that are slain with the sword are better Than they that are slain with hunger; For these pine away, stricken through, For want of the fruits of the field.
    translation: JPS 1917
    original: טוֹבִים הָיוּ חַלְלֵי־חֶרֶב מֵחַלְלֵי רָעָב שֶׁהֵם יָזוּבוּ מְדֻקָּרִים מִתְּנוּבֹת שָׂדָי׃
    hebrewPlain: טובים היו חללי חרב מחללי רעב שהם יזובו מדקרים מתנובת שדי
    kjvRefs:
    - Lamentations 4:9
    kjvOsis:
    - Lam.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.10
    scripture: tanakh
    name: Tanakh Lamentations 4:10
    ref: Lamentations 4:10
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 19976
    text: The hands of women full of compassion Have sodden their own children; They were their food In the destruction of the daughter of my people.
    translation: JPS 1917
    original: יְדֵי נָשִׁים רַחֲמָנִיּוֹת בִּשְּׁלוּ יַלְדֵיהֶן הָיוּ לְבָרוֹת לָמוֹ בְּשֶׁבֶר בַּת־עַמִּי׃
    hebrewPlain: ידי נשים רחמניות בשלו ילדיהן היו לברות למו בשבר בת עמי
    kjvRefs:
    - Lamentations 4:10
    kjvOsis:
    - Lam.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.11
    scripture: tanakh
    name: Tanakh Lamentations 4:11
    ref: Lamentations 4:11
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 19977
    text: The LORD hath accomplished His fury, He hath poured out His fierce anger; And He hath kindled a fire in Zion, Which hath devoured the foundations thereof.
    translation: JPS 1917
    original: כִּלָּה יְהוָה אֶת־חֲמָתוֹ שָׁפַךְ חֲרוֹן אַפּוֹ וַיַּצֶּת־אֵשׁ בְּצִיּוֹן וַתֹּאכַל יְסוֹדֹתֶיהָ׃
    hebrewPlain: כלה יהוה את חמתו שפך חרון אפו ויצת אש בציון ותאכל יסודתיה
    kjvRefs:
    - Lamentations 4:11
    kjvOsis:
    - Lam.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.12
    scripture: tanakh
    name: Tanakh Lamentations 4:12
    ref: Lamentations 4:12
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 19978
    text: The kings of the earth believed not, Neither all the inhabitants of the world, That the adversary and the enemy would enter Into the gates of Jerusalem.
    translation: JPS 1917
    original: לֹא הֶאֱמִינוּ מַלְכֵי־אֶרֶץ וכל [כֹּל] יֹשְׁבֵי תֵבֵל כִּי יָבֹא צַר וְאוֹיֵב בְּשַׁעֲרֵי יְרוּשָׁלִָם׃
    hebrewPlain: לא האמינו מלכי ארץ וכל [כל] ישבי תבל כי יבא צר ואויב בשערי ירושלם
    kjvRefs:
    - Lamentations 4:12
    kjvOsis:
    - Lam.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.13
    scripture: tanakh
    name: Tanakh Lamentations 4:13
    ref: Lamentations 4:13
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 19979
    text: It is because of the sins of her prophets, And the iniquities of her priests, That have shed the blood of the just In the midst of her.
    translation: JPS 1917
    original: מֵחַטֹּאת נְבִיאֶיהָ עֲוֺנוֹת כֹּהֲנֶיהָ הַשֹּׁפְכִים בְּקִרְבָּהּ דַּם צַדִּיקִים׃
    hebrewPlain: מחטאת נביאיה עונות כהניה השפכים בקרבה דם צדיקים
    kjvRefs:
    - Lamentations 4:13
    kjvOsis:
    - Lam.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.14
    scripture: tanakh
    name: Tanakh Lamentations 4:14
    ref: Lamentations 4:14
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 19980
    text: They wander as blind men in the streets, They are polluted with blood, So that men cannot Touch their garments.
    translation: JPS 1917
    original: נָעוּ עִוְרִים בַּחוּצוֹת נְגֹאֲלוּ בַּדָּם בְּלֹא יוּכְלוּ יִגְּעוּ בִּלְבֻשֵׁיהֶם׃
    hebrewPlain: נעו עורים בחוצות נגאלו בדם בלא יוכלו יגעו בלבשיהם
    kjvRefs:
    - Lamentations 4:14
    kjvOsis:
    - Lam.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.15
    scripture: tanakh
    name: Tanakh Lamentations 4:15
    ref: Lamentations 4:15
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 19981
    text: '’Depart ye! unclean! ’ men cried unto them, ‘Depart, depart, touch not’; Yea, they fled away and wandered; Men said among the nations: ‘They shall no more sojourn here.’'
    translation: JPS 1917
    original: סוּרוּ טָמֵא קָרְאוּ לָמוֹ סוּרוּ סוּרוּ אַל־תִּגָּעוּ כִּי נָצוּ גַּם־נָעוּ אָמְרוּ בַּגּוֹיִם לֹא יוֹסִיפוּ לָגוּר׃
    hebrewPlain: סורו טמא קראו למו סורו סורו אל תגעו כי נצו גם נעו אמרו בגוים לא יוסיפו לגור
    kjvRefs:
    - Lamentations 4:15
    kjvOsis:
    - Lam.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.16
    scripture: tanakh
    name: Tanakh Lamentations 4:16
    ref: Lamentations 4:16
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 19982
    text: The anger of the LORD hath divided them; He will no more regard them; They respected not the persons of the priests, They were not gracious unto the elders.
    translation: JPS 1917
    original: פְּנֵי יְהוָה חִלְּקָם לֹא יוֹסִיף לְהַבִּיטָם פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ זקנים [וּזְקֵנִים] לֹא חָנָנוּ׃
    hebrewPlain: פני יהוה חלקם לא יוסיף להביטם פני כהנים לא נשאו זקנים [וזקנים] לא חננו
    kjvRefs:
    - Lamentations 4:16
    kjvOsis:
    - Lam.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.17
    scripture: tanakh
    name: Tanakh Lamentations 4:17
    ref: Lamentations 4:17
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 19983
    text: As for us, our eyes do yet fail For our vain help; In our watching we have watched For a nation that could not save.
    translation: JPS 1917
    original: עודינה [עוֹדֵינוּ] תִּכְלֶינָה עֵינֵינוּ אֶל־עֶזְרָתֵנוּ הָבֶל בְּצִפִּיָּתֵנוּ צִפִּינוּ אֶל־גּוֹי לֹא יוֹשִׁעַ׃
    hebrewPlain: עודינה [עודינו] תכלינה עינינו אל עזרתנו הבל בצפיתנו צפינו אל גוי לא יושע
    kjvRefs:
    - Lamentations 4:17
    kjvOsis:
    - Lam.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.18
    scripture: tanakh
    name: Tanakh Lamentations 4:18
    ref: Lamentations 4:18
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 19984
    text: They hunt our steps, That we cannot go in our broad places; Our end is near, our days are fulfilled; For our end is come.
    translation: JPS 1917
    original: צָדוּ צְעָדֵינוּ מִלֶּכֶת בִּרְחֹבֹתֵינוּ קָרַב קִצֵּינוּ מָלְאוּ יָמֵינוּ כִּי־בָא קִצֵּינוּ׃
    hebrewPlain: צדו צעדינו מלכת ברחבתינו קרב קצינו מלאו ימינו כי בא קצינו
    kjvRefs:
    - Lamentations 4:18
    kjvOsis:
    - Lam.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.19
    scripture: tanakh
    name: Tanakh Lamentations 4:19
    ref: Lamentations 4:19
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 19985
    text: Our pursuers were swifter Than the eagles of the heaven; They chased us upon the mountains, They lay in wait for us in the wilderness.
    translation: JPS 1917
    original: קַלִּים הָיוּ רֹדְפֵינוּ מִנִּשְׁרֵי שָׁמָיִם עַל־הֶהָרִים דְּלָקֻנוּ בַּמִּדְבָּר אָרְבוּ לָנוּ׃
    hebrewPlain: קלים היו רדפינו מנשרי שמים על ההרים דלקנו במדבר ארבו לנו
    kjvRefs:
    - Lamentations 4:19
    kjvOsis:
    - Lam.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.20
    scripture: tanakh
    name: Tanakh Lamentations 4:20
    ref: Lamentations 4:20
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 19986
    text: 'The breath of our nostrils, the anointed of the LORD, Was taken in their pits; Of whom we said: ‘Under his shadow We shall live among the nations.’'
    translation: JPS 1917
    original: רוּחַ אַפֵּינוּ מְשִׁיחַ יְהוָה נִלְכַּד בִּשְׁחִיתוֹתָם אֲשֶׁר אָמַרְנוּ בְּצִלּוֹ נִחְיֶה בַגּוֹיִם׃
    hebrewPlain: רוח אפינו משיח יהוה נלכד בשחיתותם אשר אמרנו בצלו נחיה בגוים
    kjvRefs:
    - Lamentations 4:20
    kjvOsis:
    - Lam.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.21
    scripture: tanakh
    name: Tanakh Lamentations 4:21
    ref: Lamentations 4:21
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 19987
    text: 'Rejoice and be glad, O daughter of Edom, That dwellest in the land of Uz: The cup shall pass over unto thee also; Thou shalt be drunken, and shalt make thyself naked.'
    translation: JPS 1917
    original: שִׂישִׂי וְשִׂמְחִי בַּת־אֱדוֹם יושבתי [יוֹשֶׁבֶת] בְּאֶרֶץ עוּץ גַּם־עָלַיִךְ תַּעֲבָר־כּוֹס תִּשְׁכְּרִי וְתִתְעָרִי׃
    hebrewPlain: שישי ושמחי בת אדום יושבתי [יושבת] בארץ עוץ גם עליך תעבר כוס תשכרי ותתערי
    kjvRefs:
    - Lamentations 4:21
    kjvOsis:
    - Lam.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.4.22
    scripture: tanakh
    name: Tanakh Lamentations 4:22
    ref: Lamentations 4:22
    book: Lam
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 19988
    text: The punishment of thine iniquity is accomplished, O daughter of Zion, He will no more carry thee away into captivity; He will punish thine iniquity, O daughter of Edom, He will uncover thy sins.
    translation: JPS 1917
    original: תַּם־עֲוֺנֵךְ בַּת־צִיּוֹן לֹא יוֹסִיף לְהַגְלוֹתֵךְ פָּקַד עֲוֺנֵךְ בַּת־אֱדוֹם גִּלָּה עַל־חַטֹּאתָיִךְ׃
    hebrewPlain: תם עונך בת ציון לא יוסיף להגלותך פקד עונך בת אדום גלה על חטאתיך
    kjvRefs:
    - Lamentations 4:22
    kjvOsis:
    - Lam.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.4
- type: TanakhVerse
  data:
    osis: Lam.5.1
    scripture: tanakh
    name: Tanakh Lamentations 5:1
    ref: Lamentations 5:1
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 19989
    text: Remember, O LORD, what is come upon us; Behold, and see our reproach.
    translation: JPS 1917
    original: זְכֹר יְהוָה מֶה־הָיָה לָנוּ הביט [הַבִּיטָה] וּרְאֵה אֶת־חֶרְפָּתֵנוּ׃
    hebrewPlain: זכר יהוה מה היה לנו הביט [הביטה] וראה את חרפתנו
    kjvRefs:
    - Lamentations 5:1
    kjvOsis:
    - Lam.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.2
    scripture: tanakh
    name: Tanakh Lamentations 5:2
    ref: Lamentations 5:2
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 19990
    text: Our inheritance is turned unto strangers, Our houses unto aliens.
    translation: JPS 1917
    original: נַחֲלָתֵנוּ נֶהֶפְכָה לְזָרִים בָּתֵּינוּ לְנָכְרִים׃
    hebrewPlain: נחלתנו נהפכה לזרים בתינו לנכרים
    kjvRefs:
    - Lamentations 5:2
    kjvOsis:
    - Lam.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.3
    scripture: tanakh
    name: Tanakh Lamentations 5:3
    ref: Lamentations 5:3
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 19991
    text: We are become orphans and fatherless, Our mothers are as widows.
    translation: JPS 1917
    original: יְתוֹמִים הָיִינוּ אין [וְאֵין] אָב אִמֹּתֵינוּ כְּאַלְמָנוֹת׃
    hebrewPlain: יתומים היינו אין [ואין] אב אמתינו כאלמנות
    kjvRefs:
    - Lamentations 5:3
    kjvOsis:
    - Lam.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.4
    scripture: tanakh
    name: Tanakh Lamentations 5:4
    ref: Lamentations 5:4
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 19992
    text: We have drunk our water for money; Our wood cometh to us for price.
    translation: JPS 1917
    original: מֵימֵינוּ בְּכֶסֶף שָׁתִינוּ עֵצֵינוּ בִּמְחִיר יָבֹאוּ׃
    hebrewPlain: מימינו בכסף שתינו עצינו במחיר יבאו
    kjvRefs:
    - Lamentations 5:4
    kjvOsis:
    - Lam.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.5
    scripture: tanakh
    name: Tanakh Lamentations 5:5
    ref: Lamentations 5:5
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 19993
    text: To our very necks we are pursued; We labour, and have no rest.
    translation: JPS 1917
    original: עַל צַוָּארֵנוּ נִרְדָּפְנוּ יָגַעְנוּ לא [וְלֹא] הוּנַח לָנוּ׃
    hebrewPlain: על צוארנו נרדפנו יגענו לא [ולא] הונח לנו
    kjvRefs:
    - Lamentations 5:5
    kjvOsis:
    - Lam.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.6
    scripture: tanakh
    name: Tanakh Lamentations 5:6
    ref: Lamentations 5:6
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 19994
    text: We have given the hand to Egypt, And to Assyria, to have bread enough;
    translation: JPS 1917
    original: מִצְרַיִם נָתַנּוּ יָד אַשּׁוּר לִשְׂבֹּעַ לָחֶם׃
    hebrewPlain: מצרים נתנו יד אשור לשבע לחם
    kjvRefs:
    - Lamentations 5:6
    kjvOsis:
    - Lam.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.7
    scripture: tanakh
    name: Tanakh Lamentations 5:7
    ref: Lamentations 5:7
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 19995
    text: Our fathers have sinned, and are not; And we have borne their iniquities.
    translation: JPS 1917
    original: אֲבֹתֵינוּ חָטְאוּ אינם [וְאֵינָם] אנחנו [וַאֲנַחְנוּ] עֲוֺנֹתֵיהֶם סָבָלְנוּ׃
    hebrewPlain: אבתינו חטאו אינם [ואינם] אנחנו [ואנחנו] עונתיהם סבלנו
    kjvRefs:
    - Lamentations 5:7
    kjvOsis:
    - Lam.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.8
    scripture: tanakh
    name: Tanakh Lamentations 5:8
    ref: Lamentations 5:8
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 19996
    text: Servants rule over us; There is none to deliver us out of their hand.
    translation: JPS 1917
    original: עֲבָדִים מָשְׁלוּ בָנוּ פֹּרֵק אֵין מִיָּדָם׃
    hebrewPlain: עבדים משלו בנו פרק אין מידם
    kjvRefs:
    - Lamentations 5:8
    kjvOsis:
    - Lam.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.9
    scripture: tanakh
    name: Tanakh Lamentations 5:9
    ref: Lamentations 5:9
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 19997
    text: We get our bread with the peril of our lives Because of the sword of the wilderness.
    translation: JPS 1917
    original: בְּנַפְשֵׁנוּ נָבִיא לַחְמֵנוּ מִפְּנֵי חֶרֶב הַמִּדְבָּר׃
    hebrewPlain: בנפשנו נביא לחמנו מפני חרב המדבר
    kjvRefs:
    - Lamentations 5:9
    kjvOsis:
    - Lam.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.10
    scripture: tanakh
    name: Tanakh Lamentations 5:10
    ref: Lamentations 5:10
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 19998
    text: Our skin is hot like an oven Because of the burning heat of famine.
    translation: JPS 1917
    original: עוֹרֵנוּ כְּתַנּוּר נִכְמָרוּ מִפְּנֵי זַלְעֲפוֹת רָעָב׃
    hebrewPlain: עורנו כתנור נכמרו מפני זלעפות רעב
    kjvRefs:
    - Lamentations 5:10
    kjvOsis:
    - Lam.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.11
    scripture: tanakh
    name: Tanakh Lamentations 5:11
    ref: Lamentations 5:11
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 19999
    text: They have ravished the women in Zion, The maidens in the cities of Judah.
    translation: JPS 1917
    original: נָשִׁים בְּצִיּוֹן עִנּוּ בְּתֻלֹת בְּעָרֵי יְהוּדָה׃
    hebrewPlain: נשים בציון ענו בתלת בערי יהודה
    kjvRefs:
    - Lamentations 5:11
    kjvOsis:
    - Lam.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.12
    scripture: tanakh
    name: Tanakh Lamentations 5:12
    ref: Lamentations 5:12
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 20000
    text: Princes are hanged up by their hand; The faces of elders are not honoured.
    translation: JPS 1917
    original: שָׂרִים בְּיָדָם נִתְלוּ פְּנֵי זְקֵנִים לֹא נֶהְדָּרוּ׃
    hebrewPlain: שרים בידם נתלו פני זקנים לא נהדרו
    kjvRefs:
    - Lamentations 5:12
    kjvOsis:
    - Lam.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.13
    scripture: tanakh
    name: Tanakh Lamentations 5:13
    ref: Lamentations 5:13
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 20001
    text: The young men have borne the mill, And the children have stumbled under the wood.
    translation: JPS 1917
    original: בַּחוּרִים טְחוֹן נָשָׂאוּ וּנְעָרִים בָּעֵץ כָּשָׁלוּ׃
    hebrewPlain: בחורים טחון נשאו ונערים בעץ כשלו
    kjvRefs:
    - Lamentations 5:13
    kjvOsis:
    - Lam.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.14
    scripture: tanakh
    name: Tanakh Lamentations 5:14
    ref: Lamentations 5:14
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 20002
    text: The elders have ceased from the gate, The young men from their music.
    translation: JPS 1917
    original: זְקֵנִים מִשַּׁעַר שָׁבָתוּ בַּחוּרִים מִנְּגִינָתָם׃
    hebrewPlain: זקנים משער שבתו בחורים מנגינתם
    kjvRefs:
    - Lamentations 5:14
    kjvOsis:
    - Lam.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.15
    scripture: tanakh
    name: Tanakh Lamentations 5:15
    ref: Lamentations 5:15
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 20003
    text: The joy of our heart is ceased; Our dance is turned into mourning.
    translation: JPS 1917
    original: שָׁבַת מְשׂוֹשׂ לִבֵּנוּ נֶהְפַּךְ לְאֵבֶל מְחֹלֵנוּ׃
    hebrewPlain: שבת משוש לבנו נהפך לאבל מחלנו
    kjvRefs:
    - Lamentations 5:15
    kjvOsis:
    - Lam.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.16
    scripture: tanakh
    name: Tanakh Lamentations 5:16
    ref: Lamentations 5:16
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 20004
    text: The crown is fallen from our head; Woe unto us! for we have sinned.
    translation: JPS 1917
    original: נָפְלָה עֲטֶרֶת רֹאשֵׁנוּ אוֹי־נָא לָנוּ כִּי חָטָאנוּ׃
    hebrewPlain: נפלה עטרת ראשנו אוי נא לנו כי חטאנו
    kjvRefs:
    - Lamentations 5:16
    kjvOsis:
    - Lam.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.17
    scripture: tanakh
    name: Tanakh Lamentations 5:17
    ref: Lamentations 5:17
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 20005
    text: For this our heart is faint, For these things our eyes are dim;
    translation: JPS 1917
    original: עַל־זֶה הָיָה דָוֶה לִבֵּנוּ עַל־אֵלֶּה חָשְׁכוּ עֵינֵינוּ׃
    hebrewPlain: על זה היה דוה לבנו על אלה חשכו עינינו
    kjvRefs:
    - Lamentations 5:17
    kjvOsis:
    - Lam.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.18
    scripture: tanakh
    name: Tanakh Lamentations 5:18
    ref: Lamentations 5:18
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 20006
    text: For the mountain of Zion, which is desolate, The foxes walk upon it.
    translation: JPS 1917
    original: עַל הַר־צִיּוֹן שֶׁשָּׁמֵם שׁוּעָלִים הִלְּכוּ־בוֹ׃
    hebrewPlain: על הר ציון ששמם שועלים הלכו בו
    kjvRefs:
    - Lamentations 5:18
    kjvOsis:
    - Lam.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.19
    scripture: tanakh
    name: Tanakh Lamentations 5:19
    ref: Lamentations 5:19
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 20007
    text: Thou, O LORD, art enthroned for ever, Thy throne is from generation to generation.
    translation: JPS 1917
    original: אַתָּה יְהוָה לְעוֹלָם תֵּשֵׁב כִּסְאֲךָ לְדֹר וָדוֹר׃
    hebrewPlain: אתה יהוה לעולם תשב כסאך לדר ודור
    kjvRefs:
    - Lamentations 5:19
    kjvOsis:
    - Lam.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lam.5
- type: TanakhVerse
  data:
    osis: Lam.5.20
    scripture: tanakh
    name: Tanakh Lamentations 5:20
    ref: Lamentations 5:20
    book: Lam
    section: ketuvim
    chapter: 5
    verse: 20
    ordinal: 20008
    text: Wherefore dost Thou forget us for ever, And forsake us so long time?
    translation: JPS 1917
    original: לָמָּה לָנֶצַח תִּשְׁכָּחֵנוּ תַּעַזְבֵנוּ לְאֹרֶךְ יָמִים׃
    hebrewPlain: למה לנצח תשכחנו תעזבנו לארך ימים
    kjvRefs:
    - Lamentations 5:20
    kjvOsis:
