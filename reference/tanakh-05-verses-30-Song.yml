    translation: JPS 1917
    original: קֹרוֹת בָּתֵּינוּ אֲרָזִים רחיטנו [רַהִיטֵנוּ] בְּרוֹתִים׃
    hebrewPlain: קרות בתינו ארזים רחיטנו [רהיטנו] ברותים
