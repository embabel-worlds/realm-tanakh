  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.6
    scripture: tanakh
    name: Tanakh Song of Songs 3:6
    ref: Song of Songs 3:6
    book: Song
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 19694
    text: Who is this that cometh up out of the wilderness Like pillars of smoke, Perfumed with myrrh and frankincense, With all powders of the merchant?
    translation: JPS 1917
    original: מִי זֹאת עֹלָה מִן־הַמִּדְבָּר כְּתִימֲרוֹת עָשָׁן מְקֻטֶּרֶת מוֹר וּלְבוֹנָה מִכֹּל אַבְקַת רוֹכֵל׃
    hebrewPlain: מי זאת עלה מן המדבר כתימרות עשן מקטרת מור ולבונה מכל אבקת רוכל
    kjvRefs:
    - Song of Solomon 3:6
    kjvOsis:
    - Song.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.7
    scripture: tanakh
    name: Tanakh Song of Songs 3:7
    ref: Song of Songs 3:7
    book: Song
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 19695
    text: Behold, it is the litter of Solomon; Threescore mighty men are about it, Of the mighty men of Israel.
    translation: JPS 1917
    original: הִנֵּה מִטָּתוֹ שֶׁלִּשְׁלֹמֹה שִׁשִּׁים גִּבֹּרִים סָבִיב לָהּ מִגִּבֹּרֵי יִשְׂרָאֵל׃
    hebrewPlain: הנה מטתו שלשלמה ששים גברים סביב לה מגברי ישראל
    kjvRefs:
    - Song of Solomon 3:7
    kjvOsis:
    - Song.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.8
    scripture: tanakh
    name: Tanakh Song of Songs 3:8
    ref: Song of Songs 3:8
    book: Song
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 19696
    text: They all handle the sword, And are expert in war; Every man hath his sword upon his thigh, Because of dread in the night.
    translation: JPS 1917
    original: כֻּלָּם אֲחֻזֵי חֶרֶב מְלֻמְּדֵי מִלְחָמָה אִישׁ חַרְבּוֹ עַל־יְרֵכוֹ מִפַּחַד בַּלֵּילּוֹת׃
    hebrewPlain: כלם אחזי חרב מלמדי מלחמה איש חרבו על ירכו מפחד בלילות
    kjvRefs:
    - Song of Solomon 3:8
    kjvOsis:
    - Song.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.9
    scripture: tanakh
    name: Tanakh Song of Songs 3:9
    ref: Song of Songs 3:9
    book: Song
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 19697
    text: King Solomon made himself a palanquin Of the wood of Lebanon.
    translation: JPS 1917
    original: אַפִּרְיוֹן עָשָׂה לוֹ הַמֶּלֶךְ שְׁלֹמֹה מֵעֲצֵי הַלְּבָנוֹן׃
    hebrewPlain: אפריון עשה לו המלך שלמה מעצי הלבנון
    kjvRefs:
    - Song of Solomon 3:9
    kjvOsis:
    - Song.3.9
  relations:
