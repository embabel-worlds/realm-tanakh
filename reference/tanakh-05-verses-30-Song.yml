    chapter: 1
    verse: 12
    ordinal: 19666
    text: While the king sat at his table, My spikenard sent forth its fragrance.
    translation: JPS 1917
    original: עַד־שֶׁהַמֶּלֶךְ בִּמְסִבּוֹ נִרְדִּי נָתַן רֵיחוֹ׃
