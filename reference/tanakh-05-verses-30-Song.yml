    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.10
    scripture: tanakh
    name: Tanakh Song of Songs 3:10
    ref: Song of Songs 3:10
    book: Song
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 19698
    text: He made the pillars thereof of silver, The top thereof of gold, The seat of it of purple, The inside thereof being inlaid with love, From the daughters of Jerusalem.
    translation: JPS 1917
    original: עַמּוּדָיו עָשָׂה כֶסֶף רְפִידָתוֹ זָהָב מֶרְכָּבוֹ אַרְגָּמָן תּוֹכוֹ רָצוּף אַהֲבָה מִבְּנוֹת יְרוּשָׁלִָם׃
    hebrewPlain: עמודיו עשה כסף רפידתו זהב מרכבו ארגמן תוכו רצוף אהבה מבנות ירושלם
    kjvRefs:
    - Song of Solomon 3:10
    kjvOsis:
    - Song.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.11
    scripture: tanakh
    name: Tanakh Song of Songs 3:11
    ref: Song of Songs 3:11
    book: Song
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 19699
    text: Go forth, O ye daughters of Zion, And gaze upon king Solomon, Even upon the crown wherewith his mother hath crowned him in the day of his espousals, And in the day of the gladness of his heart.
    translation: JPS 1917
    original: צְאֶינָה וּרְאֶינָה בְּנוֹת צִיּוֹן בַּמֶּלֶךְ שְׁלֹמֹה בָּעֲטָרָה שֶׁעִטְּרָה־לּוֹ אִמּוֹ בְּיוֹם חֲתֻנָּתוֹ וּבְיוֹם שִׂמְחַת לִבּוֹ׃
    hebrewPlain: צאינה וראינה בנות ציון במלך שלמה בעטרה שעטרה לו אמו ביום חתנתו וביום שמחת לבו
    kjvRefs:
    - Song of Solomon 3:11
    kjvOsis:
    - Song.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.4.1
    scripture: tanakh
    name: Tanakh Song of Songs 4:1
    ref: Song of Songs 4:1
    book: Song
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 19700
    text: Behold, thou art fair, my love; behold, thou art fair; Thine eyes are as doves behind thy veil; Thy hair is as a flock of goats, that trail down from mount Gilead.
    translation: JPS 1917
    original: הִנָּךְ יָפָה רַעְיָתִי הִנָּךְ יָפָה עֵינַיִךְ יוֹנִים מִבַּעַד לְצַמָּתֵךְ שַׂעְרֵךְ כְּעֵדֶר הָעִזִּים שֶׁגָּלְשׁוּ מֵהַר גִּלְעָד׃
    hebrewPlain: הנך יפה רעיתי הנך יפה עיניך יונים מבעד לצמתך שערך כעדר העזים שגלשו מהר גלעד
    kjvRefs:
    - Song of Solomon 4:1
    kjvOsis:
    - Song.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.2
    scripture: tanakh
    name: Tanakh Song of Songs 4:2
    ref: Song of Songs 4:2
    book: Song
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 19701
    text: Thy teeth are like a flock of ewes all shaped alike, Which are come up from the washing; Whereof all are paired, and none faileth among them.
    translation: JPS 1917
    original: שִׁנַּיִךְ כְּעֵדֶר הַקְּצוּבוֹת שֶׁעָלוּ מִן־הָרַחְצָה שֶׁכֻּלָּם מַתְאִימוֹת וְשַׁכֻּלָה אֵין בָּהֶם׃
    hebrewPlain: שניך כעדר הקצובות שעלו מן הרחצה שכלם מתאימות ושכלה אין בהם
    kjvRefs:
    - Song of Solomon 4:2
    kjvOsis:
    - Song.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.3
    scripture: tanakh
    name: Tanakh Song of Songs 4:3
    ref: Song of Songs 4:3
    book: Song
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 19702
    text: Thy lips are like a thread of scarlet, And thy mouth is comely; Thy temples are like a pomegranate split open Behind thy veil.
    translation: JPS 1917
    original: כְּחוּט הַשָּׁנִי שִׂפְתֹתַיִךְ וּמִדְבָּרֵיךְ נָאוֶה כְּפֶלַח הָרִמּוֹן רַקָּתֵךְ מִבַּעַד לְצַמָּתֵךְ׃
    hebrewPlain: כחוט השני שפתתיך ומדבריך נאוה כפלח הרמון רקתך מבעד לצמתך
    kjvRefs:
    - Song of Solomon 4:3
    kjvOsis:
    - Song.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.4
    scripture: tanakh
    name: Tanakh Song of Songs 4:4
    ref: Song of Songs 4:4
    book: Song
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 19703
    text: Thy neck is like the tower of David Builded with turrets, Whereon there hang a thousand shields, All the armour of the mighty men.
    translation: JPS 1917
    original: כְּמִגְדַּל דָּוִיד צַוָּארֵךְ בָּנוּי לְתַלְפִּיּוֹת אֶלֶף הַמָּגֵן תָּלוּי עָלָיו כֹּל שִׁלְטֵי הַגִּבּוֹרִים׃
    hebrewPlain: כמגדל דויד צוארך בנוי לתלפיות אלף המגן תלוי עליו כל שלטי הגבורים
    kjvRefs:
    - Song of Solomon 4:4
    kjvOsis:
    - Song.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.5
    scripture: tanakh
    name: Tanakh Song of Songs 4:5
    ref: Song of Songs 4:5
    book: Song
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 19704
    text: Thy two breasts are like two fawns That are twins of a gazelle, Which feed among the lilies.
    translation: JPS 1917
    original: שְׁנֵי שָׁדַיִךְ כִּשְׁנֵי עֳפָרִים תְּאוֹמֵי צְבִיָּה הָרוֹעִים בַּשּׁוֹשַׁנִּים׃
    hebrewPlain: שני שדיך כשני עפרים תאומי צביה הרועים בשושנים
    kjvRefs:
    - Song of Solomon 4:5
    kjvOsis:
    - Song.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.6
    scripture: tanakh
    name: Tanakh Song of Songs 4:6
    ref: Song of Songs 4:6
    book: Song
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 19705
    text: Until the day breathe, And the shadows flee away, I will get me to the mountain of myrrh, And to the hill of frankincense.
    translation: JPS 1917
    original: עַד שֶׁיָּפוּחַ הַיּוֹם וְנָסוּ הַצְּלָלִים אֵלֶךְ לִי אֶל־הַר הַמּוֹר וְאֶל־גִּבְעַת הַלְּבוֹנָה׃
    hebrewPlain: עד שיפוח היום ונסו הצללים אלך לי אל הר המור ואל גבעת הלבונה
    kjvRefs:
    - Song of Solomon 4:6
    kjvOsis:
    - Song.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.7
    scripture: tanakh
    name: Tanakh Song of Songs 4:7
    ref: Song of Songs 4:7
    book: Song
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 19706
    text: Thou art all fair, my love; And there is no spot in thee.
    translation: JPS 1917
    original: כֻּלָּךְ יָפָה רַעְיָתִי וּמוּם אֵין בָּךְ׃
    hebrewPlain: כלך יפה רעיתי ומום אין בך
    kjvRefs:
    - Song of Solomon 4:7
    kjvOsis:
    - Song.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.8
    scripture: tanakh
    name: Tanakh Song of Songs 4:8
    ref: Song of Songs 4:8
    book: Song
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 19707
    text: Come with me from Lebanon, my bride, With me from Lebanon; Look from the top of Amana, From the top of Senir and Hermon, From the lions’ dens, From the mountains of the leopards.
    translation: JPS 1917
    original: אִתִּי מִלְּבָנוֹן כַּלָּה אִתִּי מִלְּבָנוֹן תָּבוֹאִי תָּשׁוּרִי מֵרֹאשׁ אֲמָנָה מֵרֹאשׁ שְׂנִיר וְחֶרְמוֹן מִמְּעֹנוֹת אֲרָיוֹת מֵהַרְרֵי נְמֵרִים׃
    hebrewPlain: אתי מלבנון כלה אתי מלבנון תבואי תשורי מראש אמנה מראש שניר וחרמון ממענות אריות מהררי נמרים
    kjvRefs:
    - Song of Solomon 4:8
    kjvOsis:
    - Song.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.9
    scripture: tanakh
    name: Tanakh Song of Songs 4:9
    ref: Song of Songs 4:9
    book: Song
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 19708
    text: Thou hast ravished my heart, my sister, my bride; Thou hast ravished my heart with one of thine eyes, With one bead of thy necklace.
    translation: JPS 1917
    original: לִבַּבְתִּנִי אֲחֹתִי כַלָּה לִבַּבְתִּינִי באחד [בְּאַחַת] מֵעֵינַיִךְ בְּאַחַד עֲנָק מִצַּוְּרֹנָיִךְ׃
    hebrewPlain: לבבתני אחתי כלה לבבתיני באחד [באחת] מעיניך באחד ענק מצורניך
    kjvRefs:
    - Song of Solomon 4:9
    kjvOsis:
    - Song.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.10
    scripture: tanakh
    name: Tanakh Song of Songs 4:10
    ref: Song of Songs 4:10
    book: Song
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 19709
    text: How fair is thy love, my sister, my bride! How much better is thy love than wine! And the smell of thine ointments than all manner of spices!
    translation: JPS 1917
    original: מַה־יָּפוּ דֹדַיִךְ אֲחֹתִי כַלָּה מַה־טֹּבוּ דֹדַיִךְ מִיַּיִן וְרֵיחַ שְׁמָנַיִךְ מִכָּל־בְּשָׂמִים׃
    hebrewPlain: מה יפו דדיך אחתי כלה מה טבו דדיך מיין וריח שמניך מכל בשמים
    kjvRefs:
    - Song of Solomon 4:10
    kjvOsis:
    - Song.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.11
    scripture: tanakh
    name: Tanakh Song of Songs 4:11
    ref: Song of Songs 4:11
    book: Song
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 19710
    text: Thy lips, O my bride, drop honey— Honey and milk are under thy tongue; And the smell of thy garments is like the smell of Lebanon.
    translation: JPS 1917
    original: נֹפֶת תִּטֹּפְנָה שִׂפְתוֹתַיִךְ כַּלָּה דְּבַשׁ וְחָלָב תַּחַת לְשׁוֹנֵךְ וְרֵיחַ שַׂלְמֹתַיִךְ כְּרֵיחַ לְבָנוֹן׃
    hebrewPlain: נפת תטפנה שפתותיך כלה דבש וחלב תחת לשונך וריח שלמתיך כריח לבנון
    kjvRefs:
    - Song of Solomon 4:11
    kjvOsis:
    - Song.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.12
    scripture: tanakh
    name: Tanakh Song of Songs 4:12
    ref: Song of Songs 4:12
    book: Song
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 19711
    text: A garden shut up is my sister, my bride; A spring shut up, a fountain sealed.
    translation: JPS 1917
    original: גַּן נָעוּל אֲחֹתִי כַלָּה גַּל נָעוּל מַעְיָן חָתוּם׃
    hebrewPlain: גן נעול אחתי כלה גל נעול מעין חתום
    kjvRefs:
    - Song of Solomon 4:12
    kjvOsis:
    - Song.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.13
    scripture: tanakh
    name: Tanakh Song of Songs 4:13
    ref: Song of Songs 4:13
    book: Song
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 19712
    text: Thy shoots are a park of pomegranates, With precious fruits; Henna with spikenard plants,
    translation: JPS 1917
    original: שְׁלָחַיִךְ פַּרְדֵּס רִמּוֹנִים עִם פְּרִי מְגָדִים כְּפָרִים עִם־נְרָדִים׃
    hebrewPlain: שלחיך פרדס רמונים עם פרי מגדים כפרים עם נרדים
    kjvRefs:
    - Song of Solomon 4:13
    kjvOsis:
    - Song.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.14
    scripture: tanakh
    name: Tanakh Song of Songs 4:14
    ref: Song of Songs 4:14
    book: Song
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 19713
    text: Spikenard and saffron, calamus and cinnamon, With all trees of frankincense; Myrrh and aloes, with all the chief spices.
    translation: JPS 1917
    original: נֵרְדְּ וְכַרְכֹּם קָנֶה וְקִנָּמוֹן עִם כָּל־עֲצֵי לְבוֹנָה מֹר וַאֲהָלוֹת עִם כָּל־רָאשֵׁי בְשָׂמִים׃
    hebrewPlain: נרד וכרכם קנה וקנמון עם כל עצי לבונה מר ואהלות עם כל ראשי בשמים
    kjvRefs:
    - Song of Solomon 4:14
    kjvOsis:
    - Song.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.15
    scripture: tanakh
    name: Tanakh Song of Songs 4:15
    ref: Song of Songs 4:15
    book: Song
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 19714
    text: Thou art a fountain of gardens, A well of living waters, And flowing streams from Lebanon.
    translation: JPS 1917
    original: מַעְיַן גַּנִּים בְּאֵר מַיִם חַיִּים וְנֹזְלִים מִן־לְבָנוֹן׃
    hebrewPlain: מעין גנים באר מים חיים ונזלים מן לבנון
    kjvRefs:
    - Song of Solomon 4:15
    kjvOsis:
    - Song.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.4.16
    scripture: tanakh
    name: Tanakh Song of Songs 4:16
    ref: Song of Songs 4:16
    book: Song
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 19715
    text: Awake, O north wind; And come, thou south; Blow upon my garden, That the spices thereof may flow out. Let my beloved come into his garden, And eat his precious fruits.
    translation: JPS 1917
    original: עוּרִי צָפוֹן וּבוֹאִי תֵימָן הָפִיחִי גַנִּי יִזְּלוּ בְשָׂמָיו יָבֹא דוֹדִי לְגַנּוֹ וְיֹאכַל פְּרִי מְגָדָיו׃
    hebrewPlain: עורי צפון ובואי תימן הפיחי גני יזלו בשמיו יבא דודי לגנו ויאכל פרי מגדיו
    kjvRefs:
    - Song of Solomon 4:16
    kjvOsis:
    - Song.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.4
- type: TanakhVerse
  data:
    osis: Song.5.1
    scripture: tanakh
    name: Tanakh Song of Songs 5:1
    ref: Song of Songs 5:1
    book: Song
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 19716
    text: I am come into my garden, my sister, my bride; I have gathered my myrrh with my spice; I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, O friends; Drink, yea, drink abundantly, O beloved.
    translation: JPS 1917
    original: בָּאתִי לְגַנִּי אֲחֹתִי כַלָּה אָרִיתִי מוֹרִי עִם־בְּשָׂמִי אָכַלְתִּי יַעְרִי עִם־דִּבְשִׁי שָׁתִיתִי יֵינִי עִם־חֲלָבִי אִכְלוּ רֵעִים שְׁתוּ וְשִׁכְרוּ דּוֹדִים׃
    hebrewPlain: באתי לגני אחתי כלה אריתי מורי עם בשמי אכלתי יערי עם דבשי שתיתי ייני עם חלבי אכלו רעים שתו ושכרו דודים
    kjvRefs:
    - Song of Solomon 5:1
    kjvOsis:
    - Song.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.2
    scripture: tanakh
    name: Tanakh Song of Songs 5:2
    ref: Song of Songs 5:2
    book: Song
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 19717
    text: 'I sleep, but my heart waketh; Hark! my beloved knocketh: ‘Open to me, my sister, my love, my dove, my undefiled; For my head is filled with dew, My locks with the drops of the night.’'
    translation: JPS 1917
    original: אֲנִי יְשֵׁנָה וְלִבִּי עֵר קוֹל דּוֹדִי דוֹפֵק פִּתְחִי־לִי אֲחֹתִי רַעְיָתִי יוֹנָתִי תַמָּתִי שֶׁרֹּאשִׁי נִמְלָא־טָל קְוֻּצּוֹתַי רְסִיסֵי לָיְלָה׃
    hebrewPlain: אני ישנה ולבי ער קול דודי דופק פתחי לי אחתי רעיתי יונתי תמתי שראשי נמלא טל קוצותי רסיסי לילה
    kjvRefs:
    - Song of Solomon 5:2
    kjvOsis:
    - Song.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.3
    scripture: tanakh
    name: Tanakh Song of Songs 5:3
    ref: Song of Songs 5:3
    book: Song
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 19718
    text: I have put off my coat; How shall I put it on? I have washed my feet; How shall I defile them?
    translation: JPS 1917
    original: פָּשַׁטְתִּי אֶת־כֻּתָּנְתִּי אֵיכָכָה אֶלְבָּשֶׁנָּה רָחַצְתִּי אֶת־רַגְלַי אֵיכָכָה אֲטַנְּפֵם׃
    hebrewPlain: פשטתי את כתנתי איככה אלבשנה רחצתי את רגלי איככה אטנפם
    kjvRefs:
    - Song of Solomon 5:3
    kjvOsis:
    - Song.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.4
    scripture: tanakh
    name: Tanakh Song of Songs 5:4
    ref: Song of Songs 5:4
    book: Song
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 19719
    text: My beloved put in his hand by the hole of the door, And my heart was moved for him.
    translation: JPS 1917
    original: דּוֹדִי שָׁלַח יָדוֹ מִן־הַחֹר וּמֵעַי הָמוּ עָלָיו׃
    hebrewPlain: דודי שלח ידו מן החר ומעי המו עליו
    kjvRefs:
    - Song of Solomon 5:4
    kjvOsis:
    - Song.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.5
    scripture: tanakh
    name: Tanakh Song of Songs 5:5
    ref: Song of Songs 5:5
    book: Song
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 19720
    text: I rose up to open to my beloved; And my hands dropped with myrrh, And my fingers with flowing myrrh, Upon the handles of the bar.
    translation: JPS 1917
    original: קַמְתִּי אֲנִי לִפְתֹּחַ לְדוֹדִי וְיָדַי נָטְפוּ־מוֹר וְאֶצְבְּעֹתַי מוֹר עֹבֵר עַל כַּפּוֹת הַמַּנְעוּל׃
    hebrewPlain: קמתי אני לפתח לדודי וידי נטפו מור ואצבעתי מור עבר על כפות המנעול
    kjvRefs:
    - Song of Solomon 5:5
    kjvOsis:
    - Song.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.6
    scripture: tanakh
    name: Tanakh Song of Songs 5:6
    ref: Song of Songs 5:6
    book: Song
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 19721
    text: I opened to my beloved; But my beloved had turned away, and was gone. My soul failed me when he spoke. I sought him, but I could not find him; I called him, but he gave me no answer.
    translation: JPS 1917
    original: פָּתַחְתִּי אֲנִי לְדוֹדִי וְדוֹדִי חָמַק עָבָר נַפְשִׁי יָצְאָה בְדַבְּרוֹ בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ קְרָאתִיו וְלֹא עָנָנִי׃
    hebrewPlain: פתחתי אני לדודי ודודי חמק עבר נפשי יצאה בדברו בקשתיהו ולא מצאתיהו קראתיו ולא ענני
    kjvRefs:
    - Song of Solomon 5:6
    kjvOsis:
    - Song.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.7
    scripture: tanakh
    name: Tanakh Song of Songs 5:7
    ref: Song of Songs 5:7
    book: Song
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 19722
    text: The watchmen that go about the city found me, They smote me, they wounded me; The keepers of the walls took away my mantle from me.
    translation: JPS 1917
    original: מְצָאֻנִי הַשֹּׁמְרִים הַסֹּבְבִים בָּעִיר הִכּוּנִי פְצָעוּנִי נָשְׂאוּ אֶת־רְדִידִי מֵעָלַי שֹׁמְרֵי הַחֹמוֹת׃
    hebrewPlain: מצאני השמרים הסבבים בעיר הכוני פצעוני נשאו את רדידי מעלי שמרי החמות
    kjvRefs:
    - Song of Solomon 5:7
    kjvOsis:
    - Song.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.8
    scripture: tanakh
    name: Tanakh Song of Songs 5:8
    ref: Song of Songs 5:8
    book: Song
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 19723
    text: ’I adjure you, O daughters of Jerusalem, If ye find my beloved, what will ye tell him? That I am love-sick.’
    translation: JPS 1917
    original: הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִָם אִם־תִּמְצְאוּ אֶת־דּוֹדִי מַה־תַּגִּידוּ לוֹ שֶׁחוֹלַת אַהֲבָה אָנִי׃
    hebrewPlain: השבעתי אתכם בנות ירושלם אם תמצאו את דודי מה תגידו לו שחולת אהבה אני
    kjvRefs:
    - Song of Solomon 5:8
    kjvOsis:
    - Song.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.9
    scripture: tanakh
    name: Tanakh Song of Songs 5:9
    ref: Song of Songs 5:9
    book: Song
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 19724
    text: ’What is thy beloved more than another beloved, O thou fairest among women? What is thy beloved more than another beloved, That thou dost so adjure us?’
    translation: JPS 1917
    original: מַה־דּוֹדֵךְ מִדּוֹד הַיָּפָה בַּנָּשִׁים מַה־דּוֹדֵךְ מִדּוֹד שֶׁכָּכָה הִשְׁבַּעְתָּנוּ׃
    hebrewPlain: מה דודך מדוד היפה בנשים מה דודך מדוד שככה השבעתנו
    kjvRefs:
    - Song of Solomon 5:9
    kjvOsis:
    - Song.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.10
    scripture: tanakh
    name: Tanakh Song of Songs 5:10
    ref: Song of Songs 5:10
    book: Song
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 19725
    text: ’My beloved is white and ruddy, Pre-eminent above ten thousand.
    translation: JPS 1917
    original: דּוֹדִי צַח וְאָדוֹם דָּגוּל מֵרְבָבָה׃
    hebrewPlain: דודי צח ואדום דגול מרבבה
    kjvRefs:
    - Song of Solomon 5:10
    kjvOsis:
    - Song.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.11
    scripture: tanakh
    name: Tanakh Song of Songs 5:11
    ref: Song of Songs 5:11
    book: Song
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 19726
    text: His head is as the most fine gold, His locks are curled, And black as a raven.
    translation: JPS 1917
    original: רֹאשׁוֹ כֶּתֶם פָּז קְוּצּוֹתָיו תַּלְתַּלִּים שְׁחֹרוֹת כָּעוֹרֵב׃
    hebrewPlain: ראשו כתם פז קוצותיו תלתלים שחרות כעורב
    kjvRefs:
    - Song of Solomon 5:11
    kjvOsis:
    - Song.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.12
    scripture: tanakh
    name: Tanakh Song of Songs 5:12
    ref: Song of Songs 5:12
    book: Song
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 19727
    text: His eyes are like doves Beside the water-brooks; Washed with milk, And fitly set.
    translation: JPS 1917
    original: עֵינָיו כְּיוֹנִים עַל־אֲפִיקֵי מָיִם רֹחֲצוֹת בֶּחָלָב יֹשְׁבוֹת עַל־מִלֵּאת׃
    hebrewPlain: עיניו כיונים על אפיקי מים רחצות בחלב ישבות על מלאת
    kjvRefs:
    - Song of Solomon 5:12
    kjvOsis:
    - Song.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.13
    scripture: tanakh
    name: Tanakh Song of Songs 5:13
    ref: Song of Songs 5:13
    book: Song
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 19728
    text: His cheeks are as a bed of spices, As banks of sweet herbs; His lips are as lilies, Dropping with flowing myrrh.
    translation: JPS 1917
    original: לְחָיָו כַּעֲרוּגַת הַבֹּשֶׂם מִגְדְּלוֹת מֶרְקָחִים שִׂפְתוֹתָיו שׁוֹשַׁנִּים נֹטְפוֹת מוֹר עֹבֵר׃
    hebrewPlain: לחיו כערוגת הבשם מגדלות מרקחים שפתותיו שושנים נטפות מור עבר
    kjvRefs:
    - Song of Solomon 5:13
    kjvOsis:
    - Song.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.14
    scripture: tanakh
    name: Tanakh Song of Songs 5:14
    ref: Song of Songs 5:14
    book: Song
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 19729
    text: His hands are as rods of gold Set with beryl; His body is as polished ivory Overlaid with sapphires.
    translation: JPS 1917
    original: יָדָיו גְּלִילֵי זָהָב מְמֻלָּאִים בַּתַּרְשִׁישׁ מֵעָיו עֶשֶׁת שֵׁן מְעֻלֶּפֶת סַפִּירִים׃
    hebrewPlain: ידיו גלילי זהב ממלאים בתרשיש מעיו עשת שן מעלפת ספירים
    kjvRefs:
    - Song of Solomon 5:14
    kjvOsis:
    - Song.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.15
    scripture: tanakh
    name: Tanakh Song of Songs 5:15
    ref: Song of Songs 5:15
    book: Song
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 19730
    text: His legs are as pillars of marble, Set upon sockets of fine gold; His aspect is like Lebanon, Excellent as the cedars.
    translation: JPS 1917
    original: שׁוֹקָיו עַמּוּדֵי שֵׁשׁ מְיֻסָּדִים עַל־אַדְנֵי־פָז מַרְאֵהוּ כַּלְּבָנוֹן בָּחוּר כָּאֲרָזִים׃
    hebrewPlain: שוקיו עמודי שש מיסדים על אדני פז מראהו כלבנון בחור כארזים
    kjvRefs:
    - Song of Solomon 5:15
    kjvOsis:
    - Song.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.5.16
    scripture: tanakh
    name: Tanakh Song of Songs 5:16
    ref: Song of Songs 5:16
    book: Song
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 19731
    text: His mouth is most sweet; Yea, he is altogether lovely. This is my beloved, and this is my friend, O daughters of Jerusalem.’
    translation: JPS 1917
    original: חִכּוֹ מַמְתַקִּים וְכֻלּוֹ מַחֲּמַדִּים זֶה דוֹדִי וְזֶה רֵעִי בְּנוֹת יְרוּשָׁלִָם׃
    hebrewPlain: חכו ממתקים וכלו מחמדים זה דודי וזה רעי בנות ירושלם
    kjvRefs:
    - Song of Solomon 5:16
    kjvOsis:
    - Song.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.5
- type: TanakhVerse
  data:
    osis: Song.6.1
    scripture: tanakh
    name: Tanakh Song of Songs 6:1
    ref: Song of Songs 6:1
    book: Song
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 19732
    text: ’Whither is thy beloved gone, O thou fairest among women? Whither hath thy beloved turned him, That we may seek him with thee?’
    translation: JPS 1917
    original: אָנָה הָלַךְ דּוֹדֵךְ הַיָּפָה בַּנָּשִׁים אָנָה פָּנָה דוֹדֵךְ וּנְבַקְשֶׁנּוּ עִמָּךְ׃
    hebrewPlain: אנה הלך דודך היפה בנשים אנה פנה דודך ונבקשנו עמך
    kjvRefs:
    - Song of Solomon 6:1
    kjvOsis:
    - Song.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.2
    scripture: tanakh
    name: Tanakh Song of Songs 6:2
    ref: Song of Songs 6:2
    book: Song
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 19733
    text: ’My beloved is gone down into his garden, To the beds of spices, To feed in the gardens, And to gather lilies.
    translation: JPS 1917
    original: דּוֹדִי יָרַד לְגַנּוֹ לַעֲרוּגוֹת הַבֹּשֶׂם לִרְעוֹת בַּגַּנִּים וְלִלְקֹט שׁוֹשַׁנִּים׃
    hebrewPlain: דודי ירד לגנו לערוגות הבשם לרעות בגנים וללקט שושנים
    kjvRefs:
    - Song of Solomon 6:2
    kjvOsis:
    - Song.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.3
    scripture: tanakh
    name: Tanakh Song of Songs 6:3
    ref: Song of Songs 6:3
    book: Song
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 19734
    text: I am my beloved’s, and my beloved is mine, That feedeth among the lilies.’
    translation: JPS 1917
    original: אֲנִי לְדוֹדִי וְדוֹדִי לִי הָרֹעֶה בַּשׁוֹשַׁנִּים׃
    hebrewPlain: אני לדודי ודודי לי הרעה בשושנים
    kjvRefs:
    - Song of Solomon 6:3
    kjvOsis:
    - Song.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.4
    scripture: tanakh
    name: Tanakh Song of Songs 6:4
    ref: Song of Songs 6:4
    book: Song
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 19735
    text: Thou art beautiful, O my love, as Tirzah, Comely as Jerusalem, Terrible as an army with banners.
    translation: JPS 1917
    original: יָפָה אַתְּ רַעְיָתִי כְּתִרְצָה נָאוָה כִּירוּשָׁלִָם אֲיֻמָּה כַּנִּדְגָּלוֹת׃
    hebrewPlain: יפה את רעיתי כתרצה נאוה כירושלם אימה כנדגלות
    kjvRefs:
    - Song of Solomon 6:4
    kjvOsis:
    - Song.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.5
    scripture: tanakh
    name: Tanakh Song of Songs 6:5
    ref: Song of Songs 6:5
    book: Song
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 19736
    text: Turn away thine eyes from me, For they have overcome me. Thy hair is as a flock of goats, That trail down from Gilead.
    translation: JPS 1917
    original: הָסֵבִּי עֵינַיִךְ מִנֶּגְדִּי שֶׁהֵם הִרְהִיבֻנִי שַׂעְרֵךְ כְּעֵדֶר הָעִזִּים שֶׁגָּלְשׁוּ מִן־הַגִּלְעָד׃
    hebrewPlain: הסבי עיניך מנגדי שהם הרהיבני שערך כעדר העזים שגלשו מן הגלעד
    kjvRefs:
    - Song of Solomon 6:5
    kjvOsis:
    - Song.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.6
    scripture: tanakh
    name: Tanakh Song of Songs 6:6
    ref: Song of Songs 6:6
    book: Song
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 19737
    text: Thy teeth are like a flock of ewes, Which are come up from the washing; Whereof all are paired, And none faileth among them.
    translation: JPS 1917
    original: שִׁנַּיִךְ כְּעֵדֶר הָרְחֵלִים שֶׁעָלוּ מִן־הָרַחְצָה שֶׁכֻּלָּם מַתְאִימוֹת וְשַׁכֻּלָה אֵין בָּהֶם׃
    hebrewPlain: שניך כעדר הרחלים שעלו מן הרחצה שכלם מתאימות ושכלה אין בהם
    kjvRefs:
    - Song of Solomon 6:6
    kjvOsis:
    - Song.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.7
    scripture: tanakh
    name: Tanakh Song of Songs 6:7
    ref: Song of Songs 6:7
    book: Song
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 19738
    text: Thy temples are like a pomegranate split open Behind thy veil.
    translation: JPS 1917
    original: כְּפֶלַח הָרִמּוֹן רַקָּתֵךְ מִבַּעַד לְצַמָּתֵךְ׃
    hebrewPlain: כפלח הרמון רקתך מבעד לצמתך
    kjvRefs:
    - Song of Solomon 6:7
    kjvOsis:
    - Song.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.8
    scripture: tanakh
    name: Tanakh Song of Songs 6:8
    ref: Song of Songs 6:8
    book: Song
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 19739
    text: There are threescore queens, And fourscore concubines, And maidens without number.
    translation: JPS 1917
    original: שִׁשִּׁים הֵמָּה מְּלָכוֹת וּשְׁמֹנִים פִּילַגְשִׁים וַעֲלָמוֹת אֵין מִסְפָּר׃
    hebrewPlain: ששים המה מלכות ושמנים פילגשים ועלמות אין מספר
    kjvRefs:
    - Song of Solomon 6:8
    kjvOsis:
    - Song.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.9
    scripture: tanakh
    name: Tanakh Song of Songs 6:9
    ref: Song of Songs 6:9
    book: Song
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 19740
    text: My dove, my undefiled, is but one; She is the only one of her mother; She is the choice one of her that bore her. The daughters saw her, and called her happy; Yea, the queens and the concubines, and they praised her.
    translation: JPS 1917
    original: אַחַת הִיא יוֹנָתִי תַמָּתִי אַחַת הִיא לְאִמָּהּ בָּרָה הִיא לְיוֹלַדְתָּהּ רָאוּהָ בָנוֹת וַיְאַשְּׁרוּהָ מְלָכוֹת וּפִילַגְשִׁים וַיְהַלְלוּהָ׃
    hebrewPlain: אחת היא יונתי תמתי אחת היא לאמה ברה היא ליולדתה ראוה בנות ויאשרוה מלכות ופילגשים ויהללוה
    kjvRefs:
    - Song of Solomon 6:9
    kjvOsis:
    - Song.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.10
    scripture: tanakh
    name: Tanakh Song of Songs 6:10
    ref: Song of Songs 6:10
    book: Song
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 19741
    text: Who is she that looketh forth as the dawn, Fair as the moon, Clear as the sun, Terrible as an army with banners?
    translation: JPS 1917
    original: מִי־זֹאת הַנִּשְׁקָפָה כְּמוֹ־שָׁחַר יָפָה כַלְּבָנָה בָּרָה כַּחַמָּה אֲיֻמָּה כַּנִּדְגָּלוֹת׃
    hebrewPlain: מי זאת הנשקפה כמו שחר יפה כלבנה ברה כחמה אימה כנדגלות
    kjvRefs:
    - Song of Solomon 6:10
    kjvOsis:
    - Song.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.11
    scripture: tanakh
    name: Tanakh Song of Songs 6:11
    ref: Song of Songs 6:11
    book: Song
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 19742
    text: I went down into the garden of nuts, To look at the green plants of the valley, To see whether the vine budded, And the pomegranates were in flower.
    translation: JPS 1917
    original: אֶל־גִּנַּת אֱגוֹז יָרַדְתִּי לִרְאוֹת בְּאִבֵּי הַנָּחַל לִרְאוֹת הֲפָרְחָה הַגֶּפֶן הֵנֵצוּ הָרִמֹּנִים׃
    hebrewPlain: אל גנת אגוז ירדתי לראות באבי הנחל לראות הפרחה הגפן הנצו הרמנים
    kjvRefs:
    - Song of Solomon 6:11
    kjvOsis:
    - Song.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.6.12
    scripture: tanakh
    name: Tanakh Song of Songs 6:12
    ref: Song of Songs 6:12
    book: Song
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 19743
    text: Before I was aware, my soul set me Upon the chariots of my princely people.
    translation: JPS 1917
    original: לֹא יָדַעְתִּי נַפְשִׁי שָׂמַתְנִי מַרְכְּבוֹת עַמִּי־נָדִיב׃
    hebrewPlain: לא ידעתי נפשי שמתני מרכבות עמי נדיב
    kjvRefs:
    - Song of Solomon 6:12
    kjvOsis:
    - Song.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.6
- type: TanakhVerse
  data:
    osis: Song.7.1
    scripture: tanakh
    name: Tanakh Song of Songs 7:1
    ref: Song of Songs 7:1
    book: Song
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 19744
    text: Return, return, O Shulammite; Return, return, that we may look upon thee. What will ye see in the Shulammite? As it were a dance of two companies.
    translation: JPS 1917
    original: שׁוּבִי שׁוּבִי הַשּׁוּלַמִּית שׁוּבִי שׁוּבִי וְנֶחֱזֶה־בָּךְ מַה־תֶּחֱזוּ בַּשּׁוּלַמִּית כִּמְחֹלַת הַמַּחֲנָיִם׃
    hebrewPlain: שובי שובי השולמית שובי שובי ונחזה בך מה תחזו בשולמית כמחלת המחנים
    kjvRefs:
    - Song of Solomon 6:13
    kjvOsis:
    - Song.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.2
    scripture: tanakh
    name: Tanakh Song of Songs 7:2
    ref: Song of Songs 7:2
    book: Song
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 19745
    text: How beautiful are thy steps in sandals, O prince’s daughter! The roundings of thy thighs are like the links of a chain, The work of the hands of a skilled workman.
    translation: JPS 1917
    original: מַה־יָּפוּ פְעָמַיִךְ בַּנְּעָלִים בַּת־נָדִיב חַמּוּקֵי יְרֵכַיִךְ כְּמוֹ חֲלָאִים מַעֲשֵׂה יְדֵי אָמָּן׃
    hebrewPlain: מה יפו פעמיך בנעלים בת נדיב חמוקי ירכיך כמו חלאים מעשה ידי אמן
    kjvRefs:
    - Song of Solomon 7:1
    kjvOsis:
    - Song.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.3
    scripture: tanakh
    name: Tanakh Song of Songs 7:3
    ref: Song of Songs 7:3
    book: Song
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 19746
    text: Thy navel is like a round goblet, wherein no mingled wine is wanting; Thy belly is like a heap of wheat Set about with lilies.
    translation: JPS 1917
    original: שָׁרְרֵךְ אַגַּן הַסַּהַר אַל־יֶחְסַר הַמָּזֶג בִּטְנֵךְ עֲרֵמַת חִטִּים סוּגָה בַּשּׁוֹשַׁנִּים׃
    hebrewPlain: שררך אגן הסהר אל יחסר המזג בטנך ערמת חטים סוגה בשושנים
    kjvRefs:
    - Song of Solomon 7:2
    kjvOsis:
    - Song.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.4
    scripture: tanakh
    name: Tanakh Song of Songs 7:4
    ref: Song of Songs 7:4
    book: Song
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 19747
    text: Thy two breasts are like two fawns that are twins of a gazelle.
    translation: JPS 1917
    original: שְׁנֵי שָׁדַיִךְ כִּשְׁנֵי עֳפָרִים תָּאֳמֵי צְבִיָּה׃
    hebrewPlain: שני שדיך כשני עפרים תאמי צביה
    kjvRefs:
    - Song of Solomon 7:3
    kjvOsis:
    - Song.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.5
    scripture: tanakh
    name: Tanakh Song of Songs 7:5
    ref: Song of Songs 7:5
    book: Song
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 19748
    text: Thy neck is as a tower of ivory; Thine eyes as the pools in Heshbon, By the gate of Bath-rabbim; Thy nose is like the tower of Lebanon Which looketh toward Damascus.
    translation: JPS 1917
    original: צַוָּארֵךְ כְּמִגְדַּל הַשֵּׁן עֵינַיִךְ בְּרֵכוֹת בְּחֶשְׁבּוֹן עַל־שַׁעַר בַּת־רַבִּים אַפֵּךְ כְּמִגְדַּל הַלְּבָנוֹן צוֹפֶה פְּנֵי דַמָּשֶׂק׃
    hebrewPlain: צוארך כמגדל השן עיניך ברכות בחשבון על שער בת רבים אפך כמגדל הלבנון צופה פני דמשק
    kjvRefs:
    - Song of Solomon 7:4
    kjvOsis:
    - Song.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.6
    scripture: tanakh
    name: Tanakh Song of Songs 7:6
    ref: Song of Songs 7:6
    book: Song
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 19749
    text: Thy head upon thee is like Carmel, and the hair of thy head like purple; The king is held captive in the tresses thereof.
    translation: JPS 1917
    original: רֹאשֵׁךְ עָלַיִךְ כַּכַּרְמֶל וְדַלַּת רֹאשֵׁךְ כָּאַרְגָּמָן מֶלֶךְ אָסוּר בָּרְהָטִים׃
    hebrewPlain: ראשך עליך ככרמל ודלת ראשך כארגמן מלך אסור ברהטים
    kjvRefs:
    - Song of Solomon 7:5
    kjvOsis:
    - Song.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.7
    scripture: tanakh
    name: Tanakh Song of Songs 7:7
    ref: Song of Songs 7:7
    book: Song
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 19750
    text: How fair and how pleasant art thou, O love, for delights! .
    translation: JPS 1917
    original: מַה־יָּפִית וּמַה־נָּעַמְתְּ אַהֲבָה בַּתַּעֲנוּגִים׃
    hebrewPlain: מה יפית ומה נעמת אהבה בתענוגים
    kjvRefs:
    - Song of Solomon 7:6
    kjvOsis:
    - Song.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.8
    scripture: tanakh
    name: Tanakh Song of Songs 7:8
    ref: Song of Songs 7:8
    book: Song
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 19751
    text: This thy stature is like to a palm-tree, and thy breasts to clusters of grapes.
    translation: JPS 1917
    original: זֹאת קוֹמָתֵךְ דָּמְתָה לְתָמָר וְשָׁדַיִךְ לְאַשְׁכֹּלוֹת׃
    hebrewPlain: זאת קומתך דמתה לתמר ושדיך לאשכלות
    kjvRefs:
    - Song of Solomon 7:7
    kjvOsis:
    - Song.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.9
    scripture: tanakh
    name: Tanakh Song of Songs 7:9
    ref: Song of Songs 7:9
    book: Song
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 19752
    text: 'I said: ‘I will climb up into the palm-tree, I will take hold of the branches thereof; and let thy breasts be as clusters of the vine, And the smell of thy countenance like apples;'
    translation: JPS 1917
    original: אָמַרְתִּי אֶעֱלֶה בְתָמָר אֹחֲזָה בְּסַנְסִנָּיו וְיִהְיוּ־נָא שָׁדַיִךְ כְּאֶשְׁכְּלוֹת הַגֶּפֶן וְרֵיחַ אַפֵּךְ כַּתַּפּוּחִים׃
    hebrewPlain: אמרתי אעלה בתמר אחזה בסנסניו ויהיו נא שדיך כאשכלות הגפן וריח אפך כתפוחים
    kjvRefs:
    - Song of Solomon 7:8
    kjvOsis:
    - Song.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.10
    scripture: tanakh
    name: Tanakh Song of Songs 7:10
    ref: Song of Songs 7:10
    book: Song
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 19753
    text: And the roof of thy mouth like the best wine, That glideth down smoothly for my beloved, moving gently the lips of those that are asleep.’
    translation: JPS 1917
    original: וְחִכֵּךְ כְּיֵין הַטּוֹב הוֹלֵךְ לְדוֹדִי לְמֵישָׁרִים דּוֹבֵב שִׂפְתֵי יְשֵׁנִים׃
    hebrewPlain: וחכך כיין הטוב הולך לדודי למישרים דובב שפתי ישנים
    kjvRefs:
    - Song of Solomon 7:9
    kjvOsis:
    - Song.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.11
    scripture: tanakh
    name: Tanakh Song of Songs 7:11
    ref: Song of Songs 7:11
    book: Song
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 19754
    text: I am my beloved’s, and his desire is toward me.
    translation: JPS 1917
    original: אֲנִי לְדוֹדִי וְעָלַי תְּשׁוּקָתוֹ׃
    hebrewPlain: אני לדודי ועלי תשוקתו
    kjvRefs:
    - Song of Solomon 7:10
    kjvOsis:
    - Song.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.12
    scripture: tanakh
    name: Tanakh Song of Songs 7:12
    ref: Song of Songs 7:12
    book: Song
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 19755
    text: Come, my beloved, let us go forth into the field; let us lodge in the villages.
    translation: JPS 1917
    original: לְכָה דוֹדִי נֵצֵא הַשָּׂדֶה נָלִינָה בַּכְּפָרִים׃
    hebrewPlain: לכה דודי נצא השדה נלינה בכפרים
    kjvRefs:
    - Song of Solomon 7:11
    kjvOsis:
    - Song.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.13
    scripture: tanakh
    name: Tanakh Song of Songs 7:13
    ref: Song of Songs 7:13
    book: Song
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 19756
    text: Let us get up early to the vineyards; let us see whether the vine hath budded, whether the vine-blossom be opened, and the pomegranates be in flower; there will I give thee my love.
    translation: JPS 1917
    original: נַשְׁכִּימָה לַכְּרָמִים נִרְאֶה אִם פָּרְחָה הַגֶּפֶן פִּתַּח הַסְּמָדַר הֵנֵצוּ הָרִמּוֹנִים שָׁם אֶתֵּן אֶת־דֹּדַי לָךְ׃
    hebrewPlain: נשכימה לכרמים נראה אם פרחה הגפן פתח הסמדר הנצו הרמונים שם אתן את דדי לך
    kjvRefs:
    - Song of Solomon 7:12
    kjvOsis:
    - Song.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.7.14
    scripture: tanakh
    name: Tanakh Song of Songs 7:14
    ref: Song of Songs 7:14
    book: Song
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 19757
    text: The mandrakes give forth fragrance, and at our doors are all manner of precious fruits, new and old, which I have laid up for thee, O my beloved.
    translation: JPS 1917
    original: הַדּוּדָאִים נָתְנוּ־רֵיחַ וְעַל־פְּתָחֵינוּ כָּל־מְגָדִים חֲדָשִׁים גַּם־יְשָׁנִים דּוֹדִי צָפַנְתִּי לָךְ׃
    hebrewPlain: הדודאים נתנו ריח ועל פתחינו כל מגדים חדשים גם ישנים דודי צפנתי לך
    kjvRefs:
    - Song of Solomon 7:13
    kjvOsis:
    - Song.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.7
- type: TanakhVerse
  data:
    osis: Song.8.1
    scripture: tanakh
    name: Tanakh Song of Songs 8:1
    ref: Song of Songs 8:1
    book: Song
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 19758
    text: Oh that thou wert as my brother, That sucked the breasts of my mother! When I should find thee without, I would kiss thee; Yea, and none would despise me.
    translation: JPS 1917
    original: מִי יִתֶּנְךָ כְּאָח לִי יוֹנֵק שְׁדֵי אִמִּי אֶמְצָאֲךָ בַחוּץ אֶשָׁקְךָ גַּם לֹא־יָבוּזוּ לִי׃
    hebrewPlain: מי יתנך כאח לי יונק שדי אמי אמצאך בחוץ אשקך גם לא יבוזו לי
    kjvRefs:
    - Song of Solomon 8:1
    kjvOsis:
    - Song.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.2
    scripture: tanakh
    name: Tanakh Song of Songs 8:2
    ref: Song of Songs 8:2
    book: Song
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 19759
    text: I would lead thee, and bring thee into my mother’s house, That thou mightest instruct me; I would cause thee to drink of spiced wine, Of the juice of my pomegranate.
    translation: JPS 1917
    original: אֶנְהָגֲךָ אֲבִיאֲךָ אֶל־בֵּית אִמִּי תְּלַמְּדֵנִי אַשְׁקְךָ מִיַּיִן הָרֶקַח מֵעֲסִיס רִמֹּנִי׃
    hebrewPlain: אנהגך אביאך אל בית אמי תלמדני אשקך מיין הרקח מעסיס רמני
    kjvRefs:
    - Song of Solomon 8:2
    kjvOsis:
    - Song.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.3
    scripture: tanakh
    name: Tanakh Song of Songs 8:3
    ref: Song of Songs 8:3
    book: Song
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 19760
    text: His left hand should be under my head, And his right hand should embrace me.
    translation: JPS 1917
    original: שְׂמֹאלוֹ תַּחַת רֹאשִׁי וִימִינוֹ תְּחַבְּקֵנִי׃
    hebrewPlain: שמאלו תחת ראשי וימינו תחבקני
    kjvRefs:
    - Song of Solomon 8:3
    kjvOsis:
    - Song.8.3
  relations:
  - predicate: IN
    to:
