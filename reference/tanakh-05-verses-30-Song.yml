    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 19676
    text: ’Stay ye me with dainties, refresh me with apples; For I am love-sick.’
    translation: JPS 1917
    original: סַמְּכוּנִי בָּאֲשִׁישׁוֹת רַפְּדוּנִי בַּתַּפּוּחִים כִּי־חוֹלַת אַהֲבָה אָנִי׃
    hebrewPlain: סמכוני באשישות רפדוני בתפוחים כי חולת אהבה אני
