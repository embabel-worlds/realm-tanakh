      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.12
    scripture: tanakh
    name: Tanakh Song of Songs 2:12
    ref: Song of Songs 2:12
    book: Song
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 19683
    text: The flowers appear on the earth; The time of singing is come, And the voice of the turtle is heard in our land;
    translation: JPS 1917
    original: הַנִּצָּנִים נִרְאוּ בָאָרֶץ עֵת הַזָּמִיר הִגִּיעַ וְקוֹל הַתּוֹר נִשְׁמַע בְּאַרְצֵנוּ׃
    hebrewPlain: הנצנים נראו בארץ עת הזמיר הגיע וקול התור נשמע בארצנו
    kjvRefs:
    - Song of Solomon 2:12
    kjvOsis:
    - Song.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.13
    scripture: tanakh
    name: Tanakh Song of Songs 2:13
    ref: Song of Songs 2:13
    book: Song
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 19684
    text: The fig-tree putteth forth her green figs, And the vines in blossom give forth their fragrance. Arise, my love, my fair one, and come away.
    translation: JPS 1917
    original: הַתְּאֵנָה חָנְטָה פַגֶּיהָ וְהַגְּפָנִים סְמָדַר נָתְנוּ רֵיחַ קוּמִי לכי [לָךְ] רַעְיָתִי יָפָתִי וּלְכִי־לָךְ׃
    hebrewPlain: התאנה חנטה פגיה והגפנים סמדר נתנו ריח קומי לכי [לך] רעיתי יפתי ולכי לך
    kjvRefs:
    - Song of Solomon 2:13
    kjvOsis:
    - Song.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.14
    scripture: tanakh
    name: Tanakh Song of Songs 2:14
    ref: Song of Songs 2:14
    book: Song
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 19685
    text: O my dove, that art in the clefts of the rock, in the covert of the cliff, Let me see thy countenance, let me hear thy voice; For sweet is thy voice, and thy countenance is comely.’
    translation: JPS 1917
    original: יוֹנָתִי בְּחַגְוֵי הַסֶּלַע בְּסֵתֶר הַמַּדְרֵגָה הַרְאִינִי אֶתּ־מַרְאַיִךְ הַשְׁמִיעִינִי אֶת־קוֹלֵךְ כִּי־קוֹלֵךְ עָרֵב וּמַרְאֵיךְ נָאוֶה׃
    hebrewPlain: יונתי בחגוי הסלע בסתר המדרגה הראיני את מראיך השמיעיני את קולך כי קולך ערב ומראיך נאוה
    kjvRefs:
    - Song of Solomon 2:14
    kjvOsis:
    - Song.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.15
    scripture: tanakh
    name: Tanakh Song of Songs 2:15
    ref: Song of Songs 2:15
    book: Song
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 19686
    text: ’Take us the foxes, the little foxes, that spoil the vineyards; For our vineyards are in blossom.’
    translation: JPS 1917
    original: אֶחֱזוּ־לָנוּ שׁוּעָלִים שׁוּעָלִים קְטַנִּים מְחַבְּלִים כְּרָמִים וּכְרָמֵינוּ סְמָדַר׃
    hebrewPlain: אחזו לנו שועלים שועלים קטנים מחבלים כרמים וכרמינו סמדר
    kjvRefs:
    - Song of Solomon 2:15
    kjvOsis:
    - Song.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.16
    scripture: tanakh
    name: Tanakh Song of Songs 2:16
    ref: Song of Songs 2:16
    book: Song
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 19687
    text: My beloved is mine, and I am his, That feedeth among the lilies.
    translation: JPS 1917
    original: דּוֹדִי לִי וַאֲנִי לוֹ הָרֹעֶה בַּשּׁוֹשַׁנִּים׃
    hebrewPlain: דודי לי ואני לו הרעה בשושנים
    kjvRefs:
    - Song of Solomon 2:16
    kjvOsis:
    - Song.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.17
    scripture: tanakh
    name: Tanakh Song of Songs 2:17
    ref: Song of Songs 2:17
    book: Song
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 19688
    text: Until the day breathe, and the shadows flee away, Turn, my beloved, and be thou like a gazelle or a young hart Upon the mountains of spices.
    translation: JPS 1917
    original: עַד שֶׁיָּפוּחַ הַיּוֹם וְנָסוּ הַצְּלָלִים סֹב דְּמֵה־לְךָ דוֹדִי לִצְבִי אוֹ לְעֹפֶר הָאַיָּלִים עַל־הָרֵי בָתֶר׃
    hebrewPlain: עד שיפוח היום ונסו הצללים סב דמה לך דודי לצבי או לעפר האילים על הרי בתר
    kjvRefs:
    - Song of Solomon 2:17
    kjvOsis:
    - Song.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.3.1
    scripture: tanakh
    name: Tanakh Song of Songs 3:1
    ref: Song of Songs 3:1
    book: Song
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 19689
    text: By night on my bed I sought him whom my soul loveth; I sought him, but I found him not.
    translation: JPS 1917
    original: עַל־מִשְׁכָּבִי בַּלֵּילוֹת בִּקַּשְׁתִּי אֵת שֶׁאָהֲבָה נַפְשִׁי בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו׃
    hebrewPlain: על משכבי בלילות בקשתי את שאהבה נפשי בקשתיו ולא מצאתיו
    kjvRefs:
    - Song of Solomon 3:1
    kjvOsis:
    - Song.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.2
    scripture: tanakh
    name: Tanakh Song of Songs 3:2
    ref: Song of Songs 3:2
    book: Song
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 19690
    text: ’I will rise now, and go about the city, In the streets and in the broad ways, I will seek him whom my soul loveth.’ I sought him, but I found him not.
    translation: JPS 1917
    original: אָקוּמָה נָּא וַאֲסוֹבְבָה בָעִיר בַּשְּׁוָקִים וּבָרְחֹבוֹת אֲבַקְשָׁה אֵת שֶׁאָהֲבָה נַפְשִׁי בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו׃
    hebrewPlain: אקומה נא ואסובבה בעיר בשוקים וברחבות אבקשה את שאהבה נפשי בקשתיו ולא מצאתיו
    kjvRefs:
    - Song of Solomon 3:2
    kjvOsis:
    - Song.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.3
    scripture: tanakh
    name: Tanakh Song of Songs 3:3
    ref: Song of Songs 3:3
    book: Song
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 19691
    text: 'The watchmen that go about the city found me: ‘Saw ye him whom my soul loveth?’'
    translation: JPS 1917
    original: מְצָאוּנִי הַשֹּׁמְרִים הַסֹּבְבִים בָּעִיר אֵת שֶׁאָהֲבָה נַפְשִׁי רְאִיתֶם׃
    hebrewPlain: מצאוני השמרים הסבבים בעיר את שאהבה נפשי ראיתם
    kjvRefs:
    - Song of Solomon 3:3
    kjvOsis:
    - Song.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
  data:
    osis: Song.3.4
    scripture: tanakh
    name: Tanakh Song of Songs 3:4
    ref: Song of Songs 3:4
    book: Song
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 19692
    text: 'Scarce had I passed from them, When I found him whom my soul loveth: I held him, and would not let him go, Until I had brought him into my mother’s house, And into the chamber of her that conceived me.'
    translation: JPS 1917
    original: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם עַד שֶׁמָּצָאתִי אֵת שֶׁאָהֲבָה נַפְשִׁי אֲחַזְתִּיו וְלֹא אַרְפֶּנּוּ עַד־שֶׁהֲבֵיאתִיו אֶל־בֵּית אִמִּי וְאֶל־חֶדֶר הוֹרָתִי׃
    hebrewPlain: כמעט שעברתי מהם עד שמצאתי את שאהבה נפשי אחזתיו ולא ארפנו עד שהביאתיו אל בית אמי ואל חדר הורתי
    kjvRefs:
    - Song of Solomon 3:4
    kjvOsis:
    - Song.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.3
- type: TanakhVerse
