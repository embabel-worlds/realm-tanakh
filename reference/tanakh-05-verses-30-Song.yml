  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.9
    scripture: tanakh
    name: Tanakh Song of Songs 2:9
    ref: Song of Songs 2:9
    book: Song
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 19680
    text: My beloved is like a gazelle or a young hart; Behold, he standeth behind our wall, He looketh in through the windows, He peereth through the lattice.
    translation: JPS 1917
    original: דּוֹמֶה דוֹדִי לִצְבִי אוֹ לְעֹפֶר הָאַיָּלִים הִנֵּה־זֶה עוֹמֵד אַחַר כָּתְלֵנוּ מַשְׁגִּיחַ מִן־הַחֲלֹּנוֹת מֵצִיץ מִן־הַחֲרַכִּים׃
    hebrewPlain: דומה דודי לצבי או לעפר האילים הנה זה עומד אחר כתלנו משגיח מן החלנות מציץ מן החרכים
    kjvRefs:
    - Song of Solomon 2:9
    kjvOsis:
    - Song.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.10
    scripture: tanakh
    name: Tanakh Song of Songs 2:10
    ref: Song of Songs 2:10
    book: Song
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 19681
    text: 'My beloved spoke, and said unto me: ‘Rise up, my love, my fair one, and come away.'
    translation: JPS 1917
    original: עָנָה דוֹדִי וְאָמַר לִי קוּמִי לָךְ רַעְיָתִי יָפָתִי וּלְכִי־לָךְ׃
    hebrewPlain: ענה דודי ואמר לי קומי לך רעיתי יפתי ולכי לך
    kjvRefs:
    - Song of Solomon 2:10
    kjvOsis:
    - Song.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.2
- type: TanakhVerse
  data:
    osis: Song.2.11
    scripture: tanakh
    name: Tanakh Song of Songs 2:11
    ref: Song of Songs 2:11
    book: Song
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 19682
    text: For, lo, the winter is past, The rain is over and gone;
    translation: JPS 1917
    original: כִּי־הִנֵּה הסתו [הַסְּתָיו] עָבָר הַגֶּשֶׁם חָלַף הָלַךְ לוֹ׃
    hebrewPlain: כי הנה הסתו [הסתיו] עבר הגשם חלף הלך לו
    kjvRefs:
    - Song of Solomon 2:11
    kjvOsis:
    - Song.2.11
  relations:
