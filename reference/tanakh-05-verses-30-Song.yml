    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 19657
    text: Thine ointments have a goodly fragrance; Thy name is as ointment poured forth; Therefore do the maidens love thee.
    translation: JPS 1917
    original: לְרֵיחַ שְׁמָנֶיךָ טוֹבִים שֶׁמֶן תּוּרַק שְׁמֶךָ עַל־כֵּן עֲלָמוֹת אֲהֵבוּךָ׃
    hebrewPlain: לריח שמניך טובים שמן תורק שמך על כן עלמות אהבוך
