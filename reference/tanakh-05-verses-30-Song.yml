    ref: Song of Songs 2:7
    book: Song
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 19678
    text: ’I adjure you, O daughters of Jerusalem, By the gazelles, and by the hinds of the field, That ye awaken not, nor stir up love, until it please.’
    translation: JPS 1917
    original: הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִַם בִּצְבָאוֹת אוֹ בְּאַיְלוֹת הַשָּׂדֶה אִם־תָּעִירוּ וְאִם־תְּעוֹרְרוּ אֶת־הָאַהֲבָה עַד שֶׁתֶּחְפָּץ׃
    hebrewPlain: השבעתי אתכם בנות ירושלם בצבאות או באילות השדה אם תעירו ואם תעוררו את האהבה עד שתחפץ
    kjvRefs:
