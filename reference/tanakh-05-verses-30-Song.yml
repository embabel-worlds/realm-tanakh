    name: Tanakh Song of Songs 2:3
    ref: Song of Songs 2:3
    book: Song
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 19674
    text: As an apple-tree among the trees of the wood, So is my beloved among the sons. Under its shadow I delighted to sit, And its fruit was sweet to my taste.
    translation: JPS 1917
    original: כְּתַפּוּחַ בַּעֲצֵי הַיַּעַר כֵּן דּוֹדִי בֵּין הַבָּנִים בְּצִלּוֹ חִמַּדְתִּי וְיָשַׁבְתִּי וּפִרְיוֹ מָתוֹק לְחִכִּי׃
    hebrewPlain: כתפוח בעצי היער כן דודי בין הבנים בצלו חמדתי וישבתי ופריו מתוק לחכי
    kjvRefs:
    - Song of Solomon 2:3
    kjvOsis:
    - Song.2.3
  relations:
