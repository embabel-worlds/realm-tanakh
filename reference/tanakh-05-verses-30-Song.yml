    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 19662
    text: If thou know not, O thou fairest among women, Go thy way forth by the footsteps of the flock And feed thy kids, beside the shepherds’ tents.
    translation: JPS 1917
    original: אִם־לֹא תֵדְעִי לָךְ הַיָּפָה בַּנָּשִׁים צְאִי־לָךְ בְּעִקְבֵי הַצֹּאן וּרְעִי אֶת־גְּדִיֹּתַיִךְ עַל מִשְׁכְּנוֹת הָרֹעִים׃
    hebrewPlain: אם לא תדעי לך היפה בנשים צאי לך בעקבי הצאן ורעי את גדיתיך על משכנות הרעים
