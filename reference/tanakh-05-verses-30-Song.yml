    to:
      type: TanakhChapter
      osis: Song.1
- type: TanakhVerse
  data:
    osis: Song.1.6
    scripture: tanakh
    name: Tanakh Song of Songs 1:6
    ref: Song of Songs 1:6
    book: Song
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 19660
    text: Look not upon me, that I am swarthy, That the sun hath tanned me; My mother’s sons were incensed against me, They made me keeper of the vineyards; But mine own vineyard have I not kept.’
    translation: JPS 1917
    original: אַל־תִּרְאוּנִי שֶׁאֲנִי שְׁחַרְחֹרֶת שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ בְּנֵי אִמִּי נִחֲרוּ־בִי שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים כַּרְמִי שֶׁלִּי לֹא נָטָרְתִּי׃
    hebrewPlain: אל תראוני שאני שחרחרת ששזפתני השמש בני אמי נחרו בי שמני נטרה את הכרמים כרמי שלי לא נטרתי
    kjvRefs:
    - Song of Solomon 1:6
    kjvOsis:
    - Song.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.1
- type: TanakhVerse
  data:
