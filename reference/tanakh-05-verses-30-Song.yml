    translation: JPS 1917
    original: כְּשׁוֹשַׁנָּה בֵּין הַחוֹחִים כֵּן רַעְיָתִי בֵּין הַבָּנוֹת׃
    hebrewPlain: כשושנה בין החוחים כן רעיתי בין הבנות
