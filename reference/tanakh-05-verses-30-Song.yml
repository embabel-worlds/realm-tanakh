    chapter: 1
    verse: 15
    ordinal: 19669
    text: Behold, thou art fair, my love; behold, thou art fair; Thine eyes are as doves. .
    translation: JPS 1917
    original: הִנָּךְ יָפָה רַעְיָתִי הִנָּךְ יָפָה עֵינַיִךְ יוֹנִים׃
    hebrewPlain: הנך יפה רעיתי הנך יפה עיניך יונים
