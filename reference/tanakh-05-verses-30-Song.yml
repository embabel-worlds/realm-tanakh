  data:
    osis: Song.2.8
    scripture: tanakh
    name: Tanakh Song of Songs 2:8
    ref: Song of Songs 2:8
    book: Song
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 19679
    text: Hark! my beloved! behold, he cometh, Leaping upon the mountains, skipping upon the hills.
    translation: JPS 1917
    original: קוֹל דּוֹדִי הִנֵּה־זֶה בָּא מְדַלֵּג עַל־הֶהָרִים מְקַפֵּץ עַל־הַגְּבָעוֹת׃
    hebrewPlain: קול דודי הנה זה בא מדלג על ההרים מקפץ על הגבעות
    kjvRefs:
    - Song of Solomon 2:8
    kjvOsis:
    - Song.2.8
