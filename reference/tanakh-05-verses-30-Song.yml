- type: TanakhVerse
  data:
    osis: Song.1.4
    scripture: tanakh
    name: Tanakh Song of Songs 1:4
    ref: Song of Songs 1:4
    book: Song
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 19658
    text: Draw me, we will run after thee; The king hath brought me into his chambers; We will be glad and rejoice in thee, We will find thy love more fragrant than wine! Sincerely do they love thee.
    translation: JPS 1917
    original: מָשְׁכֵנִי אַחֲרֶיךָ נָּרוּצָה הֱבִיאַנִי הַמֶּלֶךְ חֲדָרָיו נָגִילָה וְנִשְׂמְחָה בָּךְ נַזְכִּירָה דֹדֶיךָ מִיַּיִן מֵישָׁרִים אֲהֵבוּךָ׃
    hebrewPlain: משכני אחריך נרוצה הביאני המלך חדריו נגילה ונשמחה בך נזכירה דדיך מיין מישרים אהבוך
    kjvRefs:
    - Song of Solomon 1:4
    kjvOsis:
    - Song.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.1
- type: TanakhVerse
  data:
    osis: Song.1.5
