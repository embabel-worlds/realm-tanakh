    scripture: tanakh
    name: Tanakh Song of Songs 1:7
    ref: Song of Songs 1:7
    book: Song
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 19661
    text: Tell me, O thou whom my soul loveth, Where thou feedest, where thou makest thy flock to rest at noon; For why should I be as one that veileth herself Beside the flocks of thy companions?
    translation: JPS 1917
    original: הַגִּידָה לִּי שֶׁאָהֲבָה נַפְשִׁי אֵיכָה תִרְעֶה אֵיכָה תַּרְבִּיץ בַּצָּהֳרָיִם שַׁלָּמָה אֶהְיֶה כְּעֹטְיָה עַל עֶדְרֵי חֲבֵרֶיךָ׃
    hebrewPlain: הגידה לי שאהבה נפשי איכה תרעה איכה תרביץ בצהרים שלמה אהיה כעטיה על עדרי חבריך
    kjvRefs:
    - Song of Solomon 1:7
    kjvOsis:
    - Song.1.7
