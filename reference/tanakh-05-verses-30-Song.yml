    ref: Song of Songs 1:16
    book: Song
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 19670
    text: Behold, thou art fair, my beloved, yea, pleasant; Also our couch is leafy.
    translation: JPS 1917
    original: הִנְּךָ יָפֶה דוֹדִי אַף נָעִים אַף־עַרְשֵׂנוּ רַעֲנָנָה׃
    hebrewPlain: הנך יפה דודי אף נעים אף ערשנו רעננה
