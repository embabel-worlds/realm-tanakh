    name: Tanakh Song of Songs 1:5
    ref: Song of Songs 1:5
    book: Song
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 19659
    text: ’I am black, but comely, O ye daughters of Jerusalem, As the tents of Kedar, As the curtains of Solomon.
    translation: JPS 1917
    original: שְׁחוֹרָה אֲנִי וְנָאוָה בְּנוֹת יְרוּשָׁלִָם כְּאָהֳלֵי קֵדָר כִּירִיעוֹת שְׁלֹמֹה׃
    hebrewPlain: שחורה אני ונאוה בנות ירושלם כאהלי קדר כיריעות שלמה
    kjvRefs:
    - Song of Solomon 1:5
    kjvOsis:
    - Song.1.5
  relations:
