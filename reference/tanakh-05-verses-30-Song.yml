      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.4
    scripture: tanakh
    name: Tanakh Song of Songs 8:4
    ref: Song of Songs 8:4
    book: Song
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 19761
    text: '’I adjure you, O daughters of Jerusalem: Why should ye awaken, or stir up love, Until it please?’'
    translation: JPS 1917
    original: הִשְׁבַּעְתִּי אֶתְכֶם בְּנוֹת יְרוּשָׁלִָם מַה־תָּעִירוּ וּמַה־תְּעֹרְרוּ אֶת־הָאַהֲבָה עַד שֶׁתֶּחְפָּץ׃
    hebrewPlain: השבעתי אתכם בנות ירושלם מה תעירו ומה תעררו את האהבה עד שתחפץ
    kjvRefs:
    - Song of Solomon 8:4
    kjvOsis:
    - Song.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.5
    scripture: tanakh
    name: Tanakh Song of Songs 8:5
    ref: Song of Songs 8:5
    book: Song
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 19762
    text: Who is this that cometh up from the wilderness, Leaning upon her beloved? Under the apple-tree I awakened thee; There thy mother was in travail with thee; There was she in travail and brought thee forth.
    translation: JPS 1917
    original: מִי זֹאת עֹלָה מִן־הַמִּדְבָּר מִתְרַפֶּקֶת עַל־דּוֹדָהּ תַּחַת הַתַּפּוּחַ עוֹרַרְתִּיךָ שָׁמָּה חִבְּלַתְךָ אִמֶּךָ שָׁמָּה חִבְּלָה יְלָדַתְךָ׃
    hebrewPlain: מי זאת עלה מן המדבר מתרפקת על דודה תחת התפוח עוררתיך שמה חבלתך אמך שמה חבלה ילדתך
    kjvRefs:
    - Song of Solomon 8:5
    kjvOsis:
    - Song.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.6
    scripture: tanakh
    name: Tanakh Song of Songs 8:6
    ref: Song of Songs 8:6
    book: Song
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 19763
    text: Set me as a seal upon thy heart, As a seal upon thine arm; For love is strong as death, Jealousy is cruel as the grave; The flashes thereof are flashes of fire, A very flame of the LORD.
    translation: JPS 1917
    original: שִׂימֵנִי כַחוֹתָם עַל־לִבֶּךָ כַּחוֹתָם עַל־זְרוֹעֶךָ כִּי־עַזָּה כַמָּוֶת אַהֲבָה קָשָׁה כִשְׁאוֹל קִנְאָה רְשָׁפֶיהָ רִשְׁפֵּי אֵשׁ שַׁלְהֶבֶתְיָה׃
    hebrewPlain: שימני כחותם על לבך כחותם על זרועך כי עזה כמות אהבה קשה כשאול קנאה רשפיה רשפי אש שלהבתיה
    kjvRefs:
    - Song of Solomon 8:6
    kjvOsis:
    - Song.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.7
    scripture: tanakh
    name: Tanakh Song of Songs 8:7
    ref: Song of Songs 8:7
    book: Song
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 19764
    text: Many waters cannot quench love, Neither can the floods drown it; If a man would give all the substance of his house for love, He would utterly be contemned.
    translation: JPS 1917
    original: מַיִם רַבִּים לֹא יוּכְלוּ לְכַבּוֹת אֶת־הָאַהֲבָה וּנְהָרוֹת לֹא יִשְׁטְפוּהָ אִם־יִתֵּן אִישׁ אֶת־כָּל־הוֹן בֵּיתוֹ בָּאַהֲבָה בּוֹז יָבוּזוּ לוֹ׃
    hebrewPlain: מים רבים לא יוכלו לכבות את האהבה ונהרות לא ישטפוה אם יתן איש את כל הון ביתו באהבה בוז יבוזו לו
    kjvRefs:
    - Song of Solomon 8:7
    kjvOsis:
    - Song.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.8
    scripture: tanakh
    name: Tanakh Song of Songs 8:8
    ref: Song of Songs 8:8
    book: Song
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 19765
    text: We have a little sister, And she hath no breasts; What shall we do for our sister In the day when she shall be spoken for?
    translation: JPS 1917
    original: אָחוֹת לָנוּ קְטַנָּה וְשָׁדַיִם אֵין לָהּ מַה־נַּעֲשֶׂה לַאֲחֹתֵנוּ בַּיּוֹם שֶׁיְּדֻבַּר־בָּהּ׃
    hebrewPlain: אחות לנו קטנה ושדים אין לה מה נעשה לאחתנו ביום שידבר בה
    kjvRefs:
    - Song of Solomon 8:8
    kjvOsis:
    - Song.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.9
    scripture: tanakh
    name: Tanakh Song of Songs 8:9
    ref: Song of Songs 8:9
    book: Song
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 19766
    text: If she be a wall, We will build upon her a turret of silver; And if she be a door, We will enclose her with boards of cedar.
    translation: JPS 1917
    original: אִם־חוֹמָה הִיא נִבְנֶה עָלֶיהָ טִירַת כָּסֶף וְאִם־דֶּלֶת הִיא נָצוּר עָלֶיהָ לוּחַ אָרֶז׃
    hebrewPlain: אם חומה היא נבנה עליה טירת כסף ואם דלת היא נצור עליה לוח ארז
    kjvRefs:
    - Song of Solomon 8:9
    kjvOsis:
    - Song.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.10
    scripture: tanakh
    name: Tanakh Song of Songs 8:10
    ref: Song of Songs 8:10
    book: Song
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 19767
    text: I am a wall, And my breasts like the towers thereof; Then was I in his eyes As one that found peace.
    translation: JPS 1917
    original: אֲנִי חוֹמָה וְשָׁדַי כַּמִּגְדָּלוֹת אָז הָיִיתִי בְעֵינָיו כְּמוֹצְאֵת שָׁלוֹם׃
    hebrewPlain: אני חומה ושדי כמגדלות אז הייתי בעיניו כמוצאת שלום
    kjvRefs:
    - Song of Solomon 8:10
    kjvOsis:
    - Song.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.11
    scripture: tanakh
    name: Tanakh Song of Songs 8:11
    ref: Song of Songs 8:11
    book: Song
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 19768
    text: Solomon had a vineyard at Baal-hamon; He gave over the vineyard unto keepers; Every one for the fruit thereof Brought in a thousand pieces of silver.
    translation: JPS 1917
    original: כֶּרֶם הָיָה לִשְׁלֹמֹה בְּבַעַל הָמוֹן נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים אִישׁ יָבִא בְּפִרְיוֹ אֶלֶף כָּסֶף׃
    hebrewPlain: כרם היה לשלמה בבעל המון נתן את הכרם לנטרים איש יבא בפריו אלף כסף
    kjvRefs:
    - Song of Solomon 8:11
    kjvOsis:
    - Song.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.12
    scripture: tanakh
    name: Tanakh Song of Songs 8:12
    ref: Song of Songs 8:12
    book: Song
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 19769
    text: My vineyard, which is mine, is before me; Thou, O Solomon, shalt have the thousand, And those that keep the fruit thereof two hundred.
    translation: JPS 1917
    original: כָּרְמִי שֶׁלִּי לְפָנָי הָאֶלֶף לְךָ שְׁלֹמֹה וּמָאתַיִם לְנֹטְרִים אֶת־פִּרְיוֹ׃
    hebrewPlain: כרמי שלי לפני האלף לך שלמה ומאתים לנטרים את פריו
    kjvRefs:
    - Song of Solomon 8:12
    kjvOsis:
    - Song.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.13
    scripture: tanakh
    name: Tanakh Song of Songs 8:13
    ref: Song of Songs 8:13
    book: Song
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 19770
    text: 'Thou that dwellest in the gardens, The companions hearken for thy voice: ‘Cause me to hear it.’'
    translation: JPS 1917
    original: הַיוֹשֶׁבֶת בַּגַּנִּים חֲבֵרִים מַקְשִׁיבִים לְקוֹלֵךְ הַשְׁמִיעִינִי׃
    hebrewPlain: היושבת בגנים חברים מקשיבים לקולך השמיעיני
    kjvRefs:
    - Song of Solomon 8:13
    kjvOsis:
    - Song.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Song.8
- type: TanakhVerse
  data:
    osis: Song.8.14
    scripture: tanakh
    name: Tanakh Song of Songs 8:14
    ref: Song of Songs 8:14
    book: Song
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 19771
    text: Make haste, my beloved, And be thou like to a gazelle or to a young hart Upon the mountains of spices.
    translation: JPS 1917
    original: בְּרַח דּוֹדִי וּדְמֵה־לְךָ לִצְבִי אוֹ לְעֹפֶר הָאַיָּלִים עַל הָרֵי בְשָׂמִים׃
    hebrewPlain: ברח דודי ודמה לך לצבי או לעפר האילים על הרי בשמים
    kjvRefs:
    - Song of Solomon 8:14
    kjvOsis:
    - Song.8.14
  relations:
