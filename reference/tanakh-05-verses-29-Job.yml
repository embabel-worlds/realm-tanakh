    osis: Job.40.16
    scripture: tanakh
    name: Tanakh Job 40:16
    ref: Job 40:16
    book: Job
    section: ketuvim
    chapter: 40
    verse: 16
    ordinal: 19595
    text: Lo now, his strength is in his loins, And his force is in the stays of his body.
    translation: JPS 1917
    original: הִנֵּה־נָא כֹחוֹ בְמָתְנָיו וְאֹנוֹ בִּשְׁרִירֵי בִטְנוֹ׃
    hebrewPlain: הנה נא כחו במתניו ואנו בשרירי בטנו
