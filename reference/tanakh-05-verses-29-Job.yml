    scripture: tanakh
    name: Tanakh Job 40:11
    ref: Job 40:11
    book: Job
    section: ketuvim
    chapter: 40
    verse: 11
    ordinal: 19590
    text: Cast abroad the rage of thy wrath; And look upon every one that is proud, and abase him.
    translation: JPS 1917
    original: הָפֵץ עֶבְרוֹת אַפֶּךָ וּרְאֵה כָל־גֵּאֶה וְהַשְׁפִּילֵהוּ׃
    hebrewPlain: הפץ עברות אפך וראה כל גאה והשפילהו
