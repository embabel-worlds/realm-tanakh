  data:
    osis: Job.40.13
    scripture: tanakh
    name: Tanakh Job 40:13
    ref: Job 40:13
    book: Job
    section: ketuvim
    chapter: 40
    verse: 13
    ordinal: 19592
    text: Hide them in the dust together; Bind their faces in the hidden place.
    translation: JPS 1917
    original: טָמְנֵם בֶּעָפָר יָחַד פְּנֵיהֶם חֲבֹשׁ בַּטָּמוּן׃
    hebrewPlain: טמנם בעפר יחד פניהם חבש בטמון
    kjvRefs:
    - Job 40:13
    kjvOsis:
    - Job.40.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.14
    scripture: tanakh
    name: Tanakh Job 40:14
    ref: Job 40:14
    book: Job
    section: ketuvim
    chapter: 40
    verse: 14
    ordinal: 19593
    text: Then will I also confess unto thee That thine own right hand can save thee.
    translation: JPS 1917
    original: וְגַם־אֲנִי אוֹדֶךָּ כִּי־תוֹשִׁעַ לְךָ יְמִינֶךָ׃
    hebrewPlain: וגם אני אודך כי תושע לך ימינך
