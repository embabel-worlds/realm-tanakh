    scripture: tanakh
    name: Tanakh Job 12:20
    ref: Job 12:20
    book: Job
    section: ketuvim
    chapter: 12
    verse: 20
    ordinal: 18863
    text: He removeth the speech of men of trust, And taketh away the sense of the elders.
    translation: JPS 1917
    original: מֵסִיר שָׂפָה לְנֶאֱמָנִים וְטַעַם זְקֵנִים יִקָּח׃
    hebrewPlain: מסיר שפה לנאמנים וטעם זקנים יקח
