    book: Job
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 18598
    text: 'that there came a messenger unto Job, and said: ‘The oxen were plowing, and the asses feeding beside them;'
    translation: JPS 1917
    original: וּמַלְאָךְ בָּא אֶל־אִיּוֹב וַיֹּאמַר הַבָּקָר הָיוּ חֹרְשׁוֹת וְהָאֲתֹנוֹת רֹעוֹת עַל־יְדֵיהֶם׃
    hebrewPlain: ומלאך בא אל איוב ויאמר הבקר היו חרשות והאתנות רעות על ידיהם
    kjvRefs:
