    name: Tanakh Job 40:10
    ref: Job 40:10
    book: Job
    section: ketuvim
    chapter: 40
    verse: 10
    ordinal: 19589
    text: Deck thyself now with majesty and excellency, And array thyself with glory and beauty.
    translation: JPS 1917
    original: עֲדֵה נָא גָאוֹן וָגֹבַהּ וְהוֹד וְהָדָר תִּלְבָּשׁ׃
    hebrewPlain: עדה נא גאון וגבה והוד והדר תלבש
