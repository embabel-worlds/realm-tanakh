  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.25
    scripture: tanakh
    name: Tanakh Job 13:25
    ref: Job 13:25
    book: Job
    section: ketuvim
    chapter: 13
    verse: 25
    ordinal: 18893
    text: Wilt Thou harass a driven leaf? And wilt Thou pursue the dry stubble?
    translation: JPS 1917
    original: הֶעָלֶה נִדָּף תַּעֲרוֹץ וְאֶת־קַשׁ יָבֵשׁ תִּרְדֹּף׃
    hebrewPlain: העלה נדף תערוץ ואת קש יבש תרדף
    kjvRefs:
    - Job 13:25
    kjvOsis:
    - Job.13.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.26
    scripture: tanakh
    name: Tanakh Job 13:26
    ref: Job 13:26
    book: Job
    section: ketuvim
    chapter: 13
    verse: 26
    ordinal: 18894
    text: That Thou shouldest write bitter things against me, And make me to inherit the iniquities of my youth.
    translation: JPS 1917
    original: כִּי־תִכְתֹּב עָלַי מְרֹרוֹת וְתוֹרִישֵׁנִי עֲוֺנוֹת נְעוּרָי׃
    hebrewPlain: כי תכתב עלי מררות ותורישני עונות נעורי
    kjvRefs:
    - Job 13:26
    kjvOsis:
    - Job.13.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.27
    scripture: tanakh
    name: Tanakh Job 13:27
    ref: Job 13:27
    book: Job
    section: ketuvim
    chapter: 13
    verse: 27
    ordinal: 18895
    text: Thou puttest my feet also in the stocks, And lookest narrowly unto all my paths; Thou drawest Thee a line about the soles of my feet;
    translation: JPS 1917
    original: וְתָשֵׂם בַּסַּד רַגְלַי וְתִשְׁמוֹר כָּל־אָרְחוֹתָי עַל־שָׁרְשֵׁי רַגְלַי תִּתְחַקֶּה׃
    hebrewPlain: ותשם בסד רגלי ותשמור כל ארחותי על שרשי רגלי תתחקה
    kjvRefs:
    - Job 13:27
    kjvOsis:
    - Job.13.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.28
    scripture: tanakh
    name: Tanakh Job 13:28
    ref: Job 13:28
    book: Job
    section: ketuvim
    chapter: 13
    verse: 28
    ordinal: 18896
    text: Though I am like a wine-skin that consumeth, Like a garment that is moth-eaten.
    translation: JPS 1917
    original: וְהוּא כְּרָקָב יִבְלֶה כְּבֶגֶד אֲכָלוֹ עָשׁ׃
    hebrewPlain: והוא כרקב יבלה כבגד אכלו עש
    kjvRefs:
    - Job 13:28
    kjvOsis:
    - Job.13.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.14.1
    scripture: tanakh
    name: Tanakh Job 14:1
    ref: Job 14:1
    book: Job
    section: ketuvim
    chapter: 14
    verse: 1
    ordinal: 18897
    text: Man that is born of a woman Is of few days, and full of trouble.
    translation: JPS 1917
    original: אָדָם יְלוּד אִשָּׁה קְצַר יָמִים וּשְׂבַע־רֹגֶז׃
    hebrewPlain: אדם ילוד אשה קצר ימים ושבע רגז
    kjvRefs:
    - Job 14:1
    kjvOsis:
    - Job.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.2
    scripture: tanakh
    name: Tanakh Job 14:2
    ref: Job 14:2
    book: Job
    section: ketuvim
    chapter: 14
    verse: 2
    ordinal: 18898
    text: He cometh forth like a flower, and withereth; He fleeth also as a shadow, and continueth not.
    translation: JPS 1917
    original: כְּצִיץ יָצָא וַיִּמָּל וַיִּבְרַח כַּצֵּל וְלֹא יַעֲמוֹד׃
    hebrewPlain: כציץ יצא וימל ויברח כצל ולא יעמוד
    kjvRefs:
    - Job 14:2
    kjvOsis:
    - Job.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.3
    scripture: tanakh
    name: Tanakh Job 14:3
    ref: Job 14:3
    book: Job
    section: ketuvim
    chapter: 14
    verse: 3
    ordinal: 18899
    text: And dost Thou open Thine eyes upon such a one, And bringest me into judgment with Thee?
    translation: JPS 1917
    original: אַף־עַל־זֶה פָּקַחְתָּ עֵינֶךָ וְאֹתִי תָבִיא בְמִשְׁפָּט עִמָּךְ׃
    hebrewPlain: אף על זה פקחת עינך ואתי תביא במשפט עמך
    kjvRefs:
    - Job 14:3
    kjvOsis:
    - Job.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.4
    scripture: tanakh
    name: Tanakh Job 14:4
    ref: Job 14:4
    book: Job
    section: ketuvim
    chapter: 14
    verse: 4
    ordinal: 18900
    text: Who can bring a clean thing out of an unclean? not one.
    translation: JPS 1917
    original: מִי־יִתֵּן טָהוֹר מִטָּמֵא לֹא אֶחָד׃
    hebrewPlain: מי יתן טהור מטמא לא אחד
    kjvRefs:
    - Job 14:4
    kjvOsis:
    - Job.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.5
    scripture: tanakh
    name: Tanakh Job 14:5
    ref: Job 14:5
    book: Job
    section: ketuvim
    chapter: 14
    verse: 5
    ordinal: 18901
    text: Seeing his days are determined, The number of his months is with Thee, And Thou hast appointed his bounds that he cannot pass;
    translation: JPS 1917
    original: אִם חֲרוּצִים יָמָיו מִסְפַּר־חֳדָשָׁיו אִתָּךְ חקו [חֻקָּיו] עָשִׂיתָ וְלֹא יַעֲבוֹר׃
    hebrewPlain: אם חרוצים ימיו מספר חדשיו אתך חקו [חקיו] עשית ולא יעבור
    kjvRefs:
    - Job 14:5
    kjvOsis:
    - Job.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.6
    scripture: tanakh
    name: Tanakh Job 14:6
    ref: Job 14:6
    book: Job
    section: ketuvim
    chapter: 14
    verse: 6
    ordinal: 18902
    text: Look away from him, that he may rest, Till he shall accomplish, as a hireling, his day.
    translation: JPS 1917
    original: שְׁעֵה מֵעָלָיו וְיֶחְדָּל עַד־יִרְצֶה כְּשָׂכִיר יוֹמוֹ׃
    hebrewPlain: שעה מעליו ויחדל עד ירצה כשכיר יומו
    kjvRefs:
    - Job 14:6
    kjvOsis:
    - Job.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.7
    scripture: tanakh
    name: Tanakh Job 14:7
    ref: Job 14:7
    book: Job
    section: ketuvim
    chapter: 14
    verse: 7
    ordinal: 18903
    text: For there is hope of a tree, If it be cut down, that it will sprout again, And that the tender branch thereof will not cease.
    translation: JPS 1917
    original: כִּי יֵשׁ לָעֵץ תִּקְוָה אִם־יִכָּרֵת וְעוֹד יַחֲלִיף וְיֹנַקְתּוֹ לֹא תֶחְדָּל׃
    hebrewPlain: כי יש לעץ תקוה אם יכרת ועוד יחליף וינקתו לא תחדל
    kjvRefs:
    - Job 14:7
    kjvOsis:
    - Job.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.8
    scripture: tanakh
    name: Tanakh Job 14:8
    ref: Job 14:8
    book: Job
    section: ketuvim
    chapter: 14
    verse: 8
    ordinal: 18904
    text: Though the root thereof wax old in the earth, And the stock thereof die in the ground;
    translation: JPS 1917
    original: אִם־יַזְקִין בָּאָרֶץ שָׁרְשׁוֹ וּבֶעָפָר יָמוּת גִּזְעוֹ׃
    hebrewPlain: אם יזקין בארץ שרשו ובעפר ימות גזעו
    kjvRefs:
    - Job 14:8
    kjvOsis:
    - Job.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.9
    scripture: tanakh
    name: Tanakh Job 14:9
    ref: Job 14:9
    book: Job
    section: ketuvim
    chapter: 14
    verse: 9
    ordinal: 18905
    text: Yet through the scent of water it will bud, And put forth boughs like a plant.
    translation: JPS 1917
    original: מֵרֵיחַ מַיִם יַפְרִחַ וְעָשָׂה קָצִיר כְּמוֹ־נָטַע׃
    hebrewPlain: מריח מים יפרח ועשה קציר כמו נטע
    kjvRefs:
    - Job 14:9
    kjvOsis:
    - Job.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.10
    scripture: tanakh
    name: Tanakh Job 14:10
    ref: Job 14:10
    book: Job
    section: ketuvim
    chapter: 14
    verse: 10
    ordinal: 18906
    text: But man dieth, and lieth low; Yea, man perisheth, and where is he?
    translation: JPS 1917
    original: וְגֶבֶר יָמוּת וַיֶּחֱלָשׁ וַיִּגְוַע אָדָם וְאַיּוֹ׃
    hebrewPlain: וגבר ימות ויחלש ויגוע אדם ואיו
    kjvRefs:
    - Job 14:10
    kjvOsis:
    - Job.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.11
    scripture: tanakh
    name: Tanakh Job 14:11
    ref: Job 14:11
    book: Job
    section: ketuvim
    chapter: 14
    verse: 11
    ordinal: 18907
    text: As the waters fail from the sea, And the river is drained dry;
    translation: JPS 1917
    original: אָזְלוּ־מַיִם מִנִּי־יָם וְנָהָר יֶחֱרַב וְיָבֵשׁ׃
    hebrewPlain: אזלו מים מני ים ונהר יחרב ויבש
    kjvRefs:
    - Job 14:11
    kjvOsis:
    - Job.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.12
    scripture: tanakh
    name: Tanakh Job 14:12
    ref: Job 14:12
    book: Job
    section: ketuvim
    chapter: 14
    verse: 12
    ordinal: 18908
    text: So man lieth down and riseth not; Till the heavens be no more, they shall not awake, Nor be roused out of their sleep.
    translation: JPS 1917
    original: וְאִישׁ שָׁכַב וְלֹא־יָקוּם עַד־בִּלְתִּי שָׁמַיִם לֹא יָקִיצוּ וְלֹא־יֵעֹרוּ מִשְּׁנָתָם׃
    hebrewPlain: ואיש שכב ולא יקום עד בלתי שמים לא יקיצו ולא יערו משנתם
    kjvRefs:
    - Job 14:12
    kjvOsis:
    - Job.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.13
    scripture: tanakh
    name: Tanakh Job 14:13
    ref: Job 14:13
    book: Job
    section: ketuvim
    chapter: 14
    verse: 13
    ordinal: 18909
    text: Oh that Thou wouldest hide me in the nether-world, That Thou wouldest keep me secret, until Thy wrath be past, That Thou wouldest appoint me a set time, and remember me!—
    translation: JPS 1917
    original: מִי יִתֵּן בִּשְׁאוֹל תַּצְפִּנֵנִי תַּסְתִּירֵנִי עַד־שׁוּב אַפֶּךָ תָּשִׁית לִי חֹק וְתִזְכְּרֵנִי׃
    hebrewPlain: מי יתן בשאול תצפנני תסתירני עד שוב אפך תשית לי חק ותזכרני
    kjvRefs:
    - Job 14:13
    kjvOsis:
    - Job.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.14
    scripture: tanakh
    name: Tanakh Job 14:14
    ref: Job 14:14
    book: Job
    section: ketuvim
    chapter: 14
    verse: 14
    ordinal: 18910
    text: If a man die, may he live again? All the days of my service would I wait, till my relief should come—
    translation: JPS 1917
    original: אִם־יָמוּת גֶּבֶר הֲיִחְיֶה כָּל־יְמֵי צְבָאִי אֲיַחֵל עַד־בּוֹא חֲלִיפָתִי׃
    hebrewPlain: אם ימות גבר היחיה כל ימי צבאי איחל עד בוא חליפתי
    kjvRefs:
    - Job 14:14
    kjvOsis:
    - Job.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.15
    scripture: tanakh
    name: Tanakh Job 14:15
    ref: Job 14:15
    book: Job
    section: ketuvim
    chapter: 14
    verse: 15
    ordinal: 18911
    text: Thou wouldest call, and I would answer Thee; Thou wouldest have a desire to the work of Thy hands.
    translation: JPS 1917
    original: תִּקְרָא וְאָנֹכִי אֶעֱנֶךָּ לְמַעֲשֵׂה יָדֶיךָ תִכְסֹף׃
    hebrewPlain: תקרא ואנכי אענך למעשה ידיך תכסף
    kjvRefs:
    - Job 14:15
    kjvOsis:
    - Job.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.16
    scripture: tanakh
    name: Tanakh Job 14:16
    ref: Job 14:16
    book: Job
    section: ketuvim
    chapter: 14
    verse: 16
    ordinal: 18912
    text: But now Thou numberest my steps, Thou dost not even wait for my sin;
    translation: JPS 1917
    original: כִּי־עַתָּה צְעָדַי תִּסְפּוֹר לֹא־תִשְׁמוֹר עַל־חַטָּאתִי׃
    hebrewPlain: כי עתה צעדי תספור לא תשמור על חטאתי
    kjvRefs:
    - Job 14:16
    kjvOsis:
    - Job.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.17
    scripture: tanakh
    name: Tanakh Job 14:17
    ref: Job 14:17
    book: Job
    section: ketuvim
    chapter: 14
    verse: 17
    ordinal: 18913
    text: My transgression is sealed up in a bag, And Thou heapest up mine iniquity.
    translation: JPS 1917
    original: חָתֻם בִּצְרוֹר פִּשְׁעִי וַתִּטְפֹּל עַל־עֲוֺנִי׃
    hebrewPlain: חתם בצרור פשעי ותטפל על עוני
    kjvRefs:
    - Job 14:17
    kjvOsis:
    - Job.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.18
    scripture: tanakh
    name: Tanakh Job 14:18
    ref: Job 14:18
    book: Job
    section: ketuvim
    chapter: 14
    verse: 18
    ordinal: 18914
    text: And surely the mountain falling crumbleth away, And the rock is removed out of its place;
    translation: JPS 1917
    original: וְאוּלָם הַר־נוֹפֵל יִבּוֹל וְצוּר יֶעְתַּק מִמְּקֹמוֹ׃
    hebrewPlain: ואולם הר נופל יבול וצור יעתק ממקמו
    kjvRefs:
    - Job 14:18
    kjvOsis:
    - Job.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.19
    scripture: tanakh
    name: Tanakh Job 14:19
    ref: Job 14:19
    book: Job
    section: ketuvim
    chapter: 14
    verse: 19
    ordinal: 18915
    text: The waters wear the stones; The overflowings thereof wash away the dust of the earth; So Thou destroyest the hope of man.
    translation: JPS 1917
    original: אֲבָנִים שָׁחֲקוּ מַיִם תִּשְׁטֹף־סְפִיחֶיהָ עֲפַר־אָרֶץ וְתִקְוַת אֱנוֹשׁ הֶאֱבַדְתָּ׃
    hebrewPlain: אבנים שחקו מים תשטף ספיחיה עפר ארץ ותקות אנוש האבדת
    kjvRefs:
    - Job 14:19
    kjvOsis:
    - Job.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.20
    scripture: tanakh
    name: Tanakh Job 14:20
    ref: Job 14:20
    book: Job
    section: ketuvim
    chapter: 14
    verse: 20
    ordinal: 18916
    text: Thou prevailest for ever against him, and he passeth; Thou changest his countenance, and sendest him away.
    translation: JPS 1917
    original: תִּתְקְפֵהוּ לָנֶצַח וַיַּהֲלֹךְ מְשַׁנֶּה פָנָיו וַתְּשַׁלְּחֵהוּ׃
    hebrewPlain: תתקפהו לנצח ויהלך משנה פניו ותשלחהו
    kjvRefs:
    - Job 14:20
    kjvOsis:
    - Job.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.21
    scripture: tanakh
    name: Tanakh Job 14:21
    ref: Job 14:21
    book: Job
    section: ketuvim
    chapter: 14
    verse: 21
    ordinal: 18917
    text: His sons come to honour, and he knoweth it not; And they are brought low, but he regardeth them not.
    translation: JPS 1917
    original: יִכְבְּדוּ בָנָיו וְלֹא יֵדָע וְיִצְעֲרוּ וְלֹא־יָבִין לָמוֹ׃
    hebrewPlain: יכבדו בניו ולא ידע ויצערו ולא יבין למו
    kjvRefs:
    - Job 14:21
    kjvOsis:
    - Job.14.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.14.22
    scripture: tanakh
    name: Tanakh Job 14:22
    ref: Job 14:22
    book: Job
    section: ketuvim
    chapter: 14
    verse: 22
    ordinal: 18918
    text: But his flesh grieveth for him, And his soul mourneth over him.
    translation: JPS 1917
    original: אַךְ־בְּשָׂרוֹ עָלָיו יִכְאָב וְנַפְשׁוֹ עָלָיו תֶּאֱבָל׃
    hebrewPlain: אך בשרו עליו יכאב ונפשו עליו תאבל
    kjvRefs:
    - Job 14:22
    kjvOsis:
    - Job.14.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.14
- type: TanakhVerse
  data:
    osis: Job.15.1
    scripture: tanakh
    name: Tanakh Job 15:1
    ref: Job 15:1
    book: Job
    section: ketuvim
    chapter: 15
    verse: 1
    ordinal: 18919
    text: 'Then answered Eliphaz the Temanite, and said:'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיפַז הַתֵּימָנִי וַיֹּאמַר׃
    hebrewPlain: ויען אליפז התימני ויאמר
    kjvRefs:
    - Job 15:1
    kjvOsis:
    - Job.15.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.2
    scripture: tanakh
    name: Tanakh Job 15:2
    ref: Job 15:2
    book: Job
    section: ketuvim
    chapter: 15
    verse: 2
    ordinal: 18920
    text: Should a wise man make answer with windy knowledge, And fill his belly with the east wind?
    translation: JPS 1917
    original: הֶחָכָם יַעֲנֶה דַעַת־רוּחַ וִימַלֵּא קָדִים בִּטְנוֹ׃
    hebrewPlain: החכם יענה דעת רוח וימלא קדים בטנו
    kjvRefs:
    - Job 15:2
    kjvOsis:
    - Job.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.3
    scripture: tanakh
    name: Tanakh Job 15:3
    ref: Job 15:3
    book: Job
    section: ketuvim
    chapter: 15
    verse: 3
    ordinal: 18921
    text: Should he reason with unprofitable talk, Or with speeches wherewith he can do no good?
    translation: JPS 1917
    original: הוֹכֵחַ בְּדָבָר לֹא יִסְכּוֹן וּמִלִּים לֹא־יוֹעִיל בָּם׃
    hebrewPlain: הוכח בדבר לא יסכון ומלים לא יועיל בם
    kjvRefs:
    - Job 15:3
    kjvOsis:
    - Job.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.4
    scripture: tanakh
    name: Tanakh Job 15:4
    ref: Job 15:4
    book: Job
    section: ketuvim
    chapter: 15
    verse: 4
    ordinal: 18922
    text: Yea, thou doest away with fear, And impairest devotion before God.
    translation: JPS 1917
    original: אַף־אַתָּה תָּפֵר יִרְאָה וְתִגְרַע שִׂיחָה לִפְנֵי־אֵל׃
    hebrewPlain: אף אתה תפר יראה ותגרע שיחה לפני אל
    kjvRefs:
    - Job 15:4
    kjvOsis:
    - Job.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.5
    scripture: tanakh
    name: Tanakh Job 15:5
    ref: Job 15:5
    book: Job
    section: ketuvim
    chapter: 15
    verse: 5
    ordinal: 18923
    text: For thine iniquity teacheth thy mouth, And thou choosest the tongue of the crafty.
    translation: JPS 1917
    original: כִּי יְאַלֵּף עֲוֺנְךָ פִיךָ וְתִבְחַר לְשׁוֹן עֲרוּמִים׃
    hebrewPlain: כי יאלף עונך פיך ותבחר לשון ערומים
    kjvRefs:
    - Job 15:5
    kjvOsis:
    - Job.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.6
    scripture: tanakh
    name: Tanakh Job 15:6
    ref: Job 15:6
    book: Job
    section: ketuvim
    chapter: 15
    verse: 6
    ordinal: 18924
    text: Thine own mouth condemneth thee, and not I; Yea, thine own lips testify against thee.
    translation: JPS 1917
    original: יַרְשִׁיעֲךָ פִיךָ וְלֹא־אָנִי וּשְׂפָתֶיךָ יַעֲנוּ־בָךְ׃
    hebrewPlain: ירשיעך פיך ולא אני ושפתיך יענו בך
    kjvRefs:
    - Job 15:6
    kjvOsis:
    - Job.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.7
    scripture: tanakh
    name: Tanakh Job 15:7
    ref: Job 15:7
    book: Job
    section: ketuvim
    chapter: 15
    verse: 7
    ordinal: 18925
    text: Art thou the first man that was born? Or wast thou brought forth before the hills?
    translation: JPS 1917
    original: הֲרִאישׁוֹן אָדָם תִּוָּלֵד וְלִפְנֵי גְבָעוֹת חוֹלָלְתָּ׃
    hebrewPlain: הראישון אדם תולד ולפני גבעות חוללת
    kjvRefs:
    - Job 15:7
    kjvOsis:
    - Job.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.8
    scripture: tanakh
    name: Tanakh Job 15:8
    ref: Job 15:8
    book: Job
    section: ketuvim
    chapter: 15
    verse: 8
    ordinal: 18926
    text: Dost thou hearken in the council of God? And dost thou restrain wisdom to thyself?
    translation: JPS 1917
    original: הַבְסוֹד אֱלוֹהַ תִּשְׁמָע וְתִגְרַע אֵלֶיךָ חָכְמָה׃
    hebrewPlain: הבסוד אלוה תשמע ותגרע אליך חכמה
    kjvRefs:
    - Job 15:8
    kjvOsis:
    - Job.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.9
    scripture: tanakh
    name: Tanakh Job 15:9
    ref: Job 15:9
    book: Job
    section: ketuvim
    chapter: 15
    verse: 9
    ordinal: 18927
    text: What knowest thou, that we know not? What understandest thou, which is not in us?
    translation: JPS 1917
    original: מַה־יָּדַעְתָּ וְלֹא נֵדָע תָּבִין וְלֹא־עִמָּנוּ הוּא׃
    hebrewPlain: מה ידעת ולא נדע תבין ולא עמנו הוא
    kjvRefs:
    - Job 15:9
    kjvOsis:
    - Job.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.10
    scripture: tanakh
    name: Tanakh Job 15:10
    ref: Job 15:10
    book: Job
    section: ketuvim
    chapter: 15
    verse: 10
    ordinal: 18928
    text: With us are both the gray-headed and the very aged men, Much older than thy father.
    translation: JPS 1917
    original: גַּם־שָׂב גַּם־יָשִׁישׁ בָּנוּ כַּבִּיר מֵאָבִיךָ יָמִים׃
    hebrewPlain: גם שב גם ישיש בנו כביר מאביך ימים
    kjvRefs:
    - Job 15:10
    kjvOsis:
    - Job.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.11
    scripture: tanakh
    name: Tanakh Job 15:11
    ref: Job 15:11
    book: Job
    section: ketuvim
    chapter: 15
    verse: 11
    ordinal: 18929
    text: Are the consolations of God too small for thee, And the word that dealeth gently with thee?
    translation: JPS 1917
    original: הַמְעַט מִמְּךָ תַּנְחֻמוֹת אֵל וְדָבָר לָאַט עִמָּךְ׃
    hebrewPlain: המעט ממך תנחמות אל ודבר לאט עמך
    kjvRefs:
    - Job 15:11
    kjvOsis:
    - Job.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.12
    scripture: tanakh
    name: Tanakh Job 15:12
    ref: Job 15:12
    book: Job
    section: ketuvim
    chapter: 15
    verse: 12
    ordinal: 18930
    text: Why doth thy heart carry thee away? And why do thine eyes wink?
    translation: JPS 1917
    original: מַה־יִּקָּחֲךָ לִבֶּךָ וּמַה־יִּרְזְמוּן עֵינֶיךָ׃
    hebrewPlain: מה יקחך לבך ומה ירזמון עיניך
    kjvRefs:
    - Job 15:12
    kjvOsis:
    - Job.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.13
    scripture: tanakh
    name: Tanakh Job 15:13
    ref: Job 15:13
    book: Job
    section: ketuvim
    chapter: 15
    verse: 13
    ordinal: 18931
    text: That thou turnest thy spirit against God, And lettest such words go out of thy mouth.
    translation: JPS 1917
    original: כִּי־תָשִׁיב אֶל־אֵל רוּחֶךָ וְהֹצֵאתָ מִפִּיךָ מִלִּין׃
    hebrewPlain: כי תשיב אל אל רוחך והצאת מפיך מלין
    kjvRefs:
    - Job 15:13
    kjvOsis:
    - Job.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.14
    scripture: tanakh
    name: Tanakh Job 15:14
    ref: Job 15:14
    book: Job
    section: ketuvim
    chapter: 15
    verse: 14
    ordinal: 18932
    text: What is man, that he should be clean? And he that is born of a woman, that he should be righteous?
    translation: JPS 1917
    original: מָה־אֱנוֹשׁ כִּי־יִזְכֶּה וְכִי־יִצְדַּק יְלוּד אִשָּׁה׃
    hebrewPlain: מה אנוש כי יזכה וכי יצדק ילוד אשה
    kjvRefs:
    - Job 15:14
    kjvOsis:
    - Job.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.15
    scripture: tanakh
    name: Tanakh Job 15:15
    ref: Job 15:15
    book: Job
    section: ketuvim
    chapter: 15
    verse: 15
    ordinal: 18933
    text: Behold, He putteth no trust in His holy ones; Yea, the heavens are not clean in His sight.
    translation: JPS 1917
    original: הֵן בקדשו [בִּקְדֹשָׁיו] לֹא יַאֲמִין וְשָׁמַיִם לֹא־זַכּוּ בְעֵינָיו׃
    hebrewPlain: הן בקדשו [בקדשיו] לא יאמין ושמים לא זכו בעיניו
    kjvRefs:
    - Job 15:15
    kjvOsis:
    - Job.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.16
    scripture: tanakh
    name: Tanakh Job 15:16
    ref: Job 15:16
    book: Job
    section: ketuvim
    chapter: 15
    verse: 16
    ordinal: 18934
    text: How much less one that is abominable and impure, Man who drinketh iniquity like water! .
    translation: JPS 1917
    original: אַף כִּי־נִתְעָב וְנֶאֱלָח אִישׁ־שֹׁתֶה כַמַּיִם עַוְלָה׃
    hebrewPlain: אף כי נתעב ונאלח איש שתה כמים עולה
    kjvRefs:
    - Job 15:16
    kjvOsis:
    - Job.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.17
    scripture: tanakh
    name: Tanakh Job 15:17
    ref: Job 15:17
    book: Job
    section: ketuvim
    chapter: 15
    verse: 17
    ordinal: 18935
    text: I will tell thee, hear thou me; And that which I have seen I will declare—
    translation: JPS 1917
    original: אֲחַוְךָ שְׁמַע־לִי וְזֶה־חָזִיתִי וַאֲסַפֵּרָה׃
    hebrewPlain: אחוך שמע לי וזה חזיתי ואספרה
    kjvRefs:
    - Job 15:17
    kjvOsis:
    - Job.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.18
    scripture: tanakh
    name: Tanakh Job 15:18
    ref: Job 15:18
    book: Job
    section: ketuvim
    chapter: 15
    verse: 18
    ordinal: 18936
    text: Which wise men have told From their fathers, and have not hid it;
    translation: JPS 1917
    original: אֲשֶׁר־חֲכָמִים יַגִּידוּ וְלֹא כִחֲדוּ מֵאֲבוֹתָם׃
    hebrewPlain: אשר חכמים יגידו ולא כחדו מאבותם
    kjvRefs:
    - Job 15:18
    kjvOsis:
    - Job.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.19
    scripture: tanakh
    name: Tanakh Job 15:19
    ref: Job 15:19
    book: Job
    section: ketuvim
    chapter: 15
    verse: 19
    ordinal: 18937
    text: Unto whom alone the land was given, And no stranger passed among them.
    translation: JPS 1917
    original: לָהֶם לְבַדָּם נִתְּנָה הָאָרֶץ וְלֹא־עָבַר זָר בְּתוֹכָם׃
    hebrewPlain: להם לבדם נתנה הארץ ולא עבר זר בתוכם
    kjvRefs:
    - Job 15:19
    kjvOsis:
    - Job.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.20
    scripture: tanakh
    name: Tanakh Job 15:20
    ref: Job 15:20
    book: Job
    section: ketuvim
    chapter: 15
    verse: 20
    ordinal: 18938
    text: The wicked man travaileth with pain all his days, Even the number of years that are laid up for the oppressor.
    translation: JPS 1917
    original: כָּל־יְמֵי רָשָׁע הוּא מִתְחוֹלֵל וּמִסְפַּר שָׁנִים נִצְפְּנוּ לֶעָרִיץ׃
    hebrewPlain: כל ימי רשע הוא מתחולל ומספר שנים נצפנו לעריץ
    kjvRefs:
    - Job 15:20
    kjvOsis:
    - Job.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.21
    scripture: tanakh
    name: Tanakh Job 15:21
    ref: Job 15:21
    book: Job
    section: ketuvim
    chapter: 15
    verse: 21
    ordinal: 18939
    text: 'A sound of terrors is in his ears: In prosperity the destroyer shall come upon him.'
    translation: JPS 1917
    original: קוֹל־פְּחָדִים בְּאָזְנָיו בַּשָּׁלוֹם שׁוֹדֵד יְבוֹאֶנּוּ׃
    hebrewPlain: קול פחדים באזניו בשלום שודד יבואנו
    kjvRefs:
    - Job 15:21
    kjvOsis:
    - Job.15.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.22
    scripture: tanakh
    name: Tanakh Job 15:22
    ref: Job 15:22
    book: Job
    section: ketuvim
    chapter: 15
    verse: 22
    ordinal: 18940
    text: He believeth not that he shall return out of darkness, And he is waited for of the sword.
    translation: JPS 1917
    original: לֹא־יַאֲמִין שׁוּב מִנִּי־חֹשֶׁךְ וצפו [וְצָפוּי] הוּא אֱלֵי־חָרֶב׃
    hebrewPlain: לא יאמין שוב מני חשך וצפו [וצפוי] הוא אלי חרב
    kjvRefs:
    - Job 15:22
    kjvOsis:
    - Job.15.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.23
    scripture: tanakh
    name: Tanakh Job 15:23
    ref: Job 15:23
    book: Job
    section: ketuvim
    chapter: 15
    verse: 23
    ordinal: 18941
    text: 'He wandereth abroad for bread: ‘Where is it?’ He knoweth that the day of darkness is ready at his hand.'
    translation: JPS 1917
    original: נֹדֵד הוּא לַלֶּחֶם אַיֵּה יָדַע כִּי־נָכוֹן בְּיָדוֹ יוֹם־חֹשֶׁךְ׃
    hebrewPlain: נדד הוא ללחם איה ידע כי נכון בידו יום חשך
    kjvRefs:
    - Job 15:23
    kjvOsis:
    - Job.15.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.24
    scripture: tanakh
    name: Tanakh Job 15:24
    ref: Job 15:24
    book: Job
    section: ketuvim
    chapter: 15
    verse: 24
    ordinal: 18942
    text: Distress and anguish overwhelm him; They prevail against him, as a king ready to the battle.
    translation: JPS 1917
    original: יְבַעֲתֻהוּ צַר וּמְצוּקָה תִּתְקְפֵהוּ כְּמֶלֶךְ עָתִיד לַכִּידוֹר׃
    hebrewPlain: יבעתהו צר ומצוקה תתקפהו כמלך עתיד לכידור
    kjvRefs:
    - Job 15:24
    kjvOsis:
    - Job.15.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.25
    scripture: tanakh
    name: Tanakh Job 15:25
    ref: Job 15:25
    book: Job
    section: ketuvim
    chapter: 15
    verse: 25
    ordinal: 18943
    text: Because he hath stretched out his hand against God, And behaveth himself proudly against the Almighty;
    translation: JPS 1917
    original: כִּי־נָטָה אֶל־אֵל יָדוֹ וְאֶל־שַׁדַּי יִתְגַּבָּר׃
    hebrewPlain: כי נטה אל אל ידו ואל שדי יתגבר
    kjvRefs:
    - Job 15:25
    kjvOsis:
    - Job.15.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.26
    scripture: tanakh
    name: Tanakh Job 15:26
    ref: Job 15:26
    book: Job
    section: ketuvim
    chapter: 15
    verse: 26
    ordinal: 18944
    text: He runneth upon him with a stiff neck, With the thick bosses of his bucklers.
    translation: JPS 1917
    original: יָרוּץ אֵלָיו בְּצַוָּאר בַּעֲבִי גַּבֵּי מָגִנָּיו׃
    hebrewPlain: ירוץ אליו בצואר בעבי גבי מגניו
    kjvRefs:
    - Job 15:26
    kjvOsis:
    - Job.15.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.27
    scripture: tanakh
    name: Tanakh Job 15:27
    ref: Job 15:27
    book: Job
    section: ketuvim
    chapter: 15
    verse: 27
    ordinal: 18945
    text: Because he hath covered his face with his fatness, And made collops of fat on his loins;
    translation: JPS 1917
    original: כִּי־כִסָּה פָנָיו בְּחֶלְבּוֹ וַיַּעַשׂ פִּימָה עֲלֵי־כָסֶל׃
    hebrewPlain: כי כסה פניו בחלבו ויעש פימה עלי כסל
    kjvRefs:
    - Job 15:27
    kjvOsis:
    - Job.15.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.28
    scripture: tanakh
    name: Tanakh Job 15:28
    ref: Job 15:28
    book: Job
    section: ketuvim
    chapter: 15
    verse: 28
    ordinal: 18946
    text: And he hath dwelt in desolate cities, In houses which no man would inhabit, Which were ready to become heaps.
    translation: JPS 1917
    original: וַיִּשְׁכּוֹן עָרִים נִכְחָדוֹת בָּתִּים לֹא־יֵשְׁבוּ לָמוֹ אֲשֶׁר הִתְעַתְּדוּ לְגַלִּים׃
    hebrewPlain: וישכון ערים נכחדות בתים לא ישבו למו אשר התעתדו לגלים
    kjvRefs:
    - Job 15:28
    kjvOsis:
    - Job.15.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.29
    scripture: tanakh
    name: Tanakh Job 15:29
    ref: Job 15:29
    book: Job
    section: ketuvim
    chapter: 15
    verse: 29
    ordinal: 18947
    text: He shall not be rich, neither shall his substance continue, Neither shall their produce bend to the earth.
    translation: JPS 1917
    original: לֹא־יֶעְשַׁר וְלֹא־יָקוּם חֵילוֹ וְלֹא־יִטֶּה לָאָרֶץ מִנְלָם׃
    hebrewPlain: לא יעשר ולא יקום חילו ולא יטה לארץ מנלם
    kjvRefs:
    - Job 15:29
    kjvOsis:
    - Job.15.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.30
    scripture: tanakh
    name: Tanakh Job 15:30
    ref: Job 15:30
    book: Job
    section: ketuvim
    chapter: 15
    verse: 30
    ordinal: 18948
    text: He shall not depart out of darkness; The flame shall dry up his branches, And by the breath of His mouth shall he go away.
    translation: JPS 1917
    original: לֹא־יָסוּר מִנִּי־חֹשֶׁךְ יֹנַקְתּוֹ תְּיַבֵּשׁ שַׁלְהָבֶת וְיָסוּר בְּרוּחַ פִּיו׃
    hebrewPlain: לא יסור מני חשך ינקתו תיבש שלהבת ויסור ברוח פיו
    kjvRefs:
    - Job 15:30
    kjvOsis:
    - Job.15.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.31
    scripture: tanakh
    name: Tanakh Job 15:31
    ref: Job 15:31
    book: Job
    section: ketuvim
    chapter: 15
    verse: 31
    ordinal: 18949
    text: Let him not trust in vanity, deceiving himself; For vanity shall be his recompense.
    translation: JPS 1917
    original: אַל־יַאֲמֵן בשו [בַּשָּׁיו] נִתְעָה כִּי־שָׁוְא תִּהְיֶה תְמוּרָתוֹ׃
    hebrewPlain: אל יאמן בשו [בשיו] נתעה כי שוא תהיה תמורתו
    kjvRefs:
    - Job 15:31
    kjvOsis:
    - Job.15.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.32
    scripture: tanakh
    name: Tanakh Job 15:32
    ref: Job 15:32
    book: Job
    section: ketuvim
    chapter: 15
    verse: 32
    ordinal: 18950
    text: It shall be accomplished before his time, And his branch shall not be leafy.
    translation: JPS 1917
    original: בְּלֹא־יוֹמוֹ תִּמָּלֵא וְכִפָּתוֹ לֹא רַעֲנָנָה׃
    hebrewPlain: בלא יומו תמלא וכפתו לא רעננה
    kjvRefs:
    - Job 15:32
    kjvOsis:
    - Job.15.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.33
    scripture: tanakh
    name: Tanakh Job 15:33
    ref: Job 15:33
    book: Job
    section: ketuvim
    chapter: 15
    verse: 33
    ordinal: 18951
    text: He shall shake off his unripe grape as the vine, And shall cast off his flower as the olive.
    translation: JPS 1917
    original: יַחְמֹס כַּגֶּפֶן בִּסְרוֹ וְיַשְׁלֵךְ כַּזַּיִת נִצָּתוֹ׃
    hebrewPlain: יחמס כגפן בסרו וישלך כזית נצתו
    kjvRefs:
    - Job 15:33
    kjvOsis:
    - Job.15.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.34
    scripture: tanakh
    name: Tanakh Job 15:34
    ref: Job 15:34
    book: Job
    section: ketuvim
    chapter: 15
    verse: 34
    ordinal: 18952
    text: For the company of the godless shall be desolate, And fire shall consume the tents of bribery.
    translation: JPS 1917
    original: כִּי־עֲדַת חָנֵף גַּלְמוּד וְאֵשׁ אָכְלָה אָהֳלֵי־שֹׁחַד׃
    hebrewPlain: כי עדת חנף גלמוד ואש אכלה אהלי שחד
    kjvRefs:
    - Job 15:34
    kjvOsis:
    - Job.15.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.15.35
    scripture: tanakh
    name: Tanakh Job 15:35
    ref: Job 15:35
    book: Job
    section: ketuvim
    chapter: 15
    verse: 35
    ordinal: 18953
    text: They conceive mischief, and bring forth iniquity, And their belly prepareth deceit.
    translation: JPS 1917
    original: הָרֹה עָמָל וְיָלֹד אָוֶן וּבִטְנָם תָּכִין מִרְמָה׃
    hebrewPlain: הרה עמל וילד און ובטנם תכין מרמה
    kjvRefs:
    - Job 15:35
    kjvOsis:
    - Job.15.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.15
- type: TanakhVerse
  data:
    osis: Job.16.1
    scripture: tanakh
    name: Tanakh Job 16:1
    ref: Job 16:1
    book: Job
    section: ketuvim
    chapter: 16
    verse: 1
    ordinal: 18954
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 16:1
    kjvOsis:
    - Job.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.2
    scripture: tanakh
    name: Tanakh Job 16:2
    ref: Job 16:2
    book: Job
    section: ketuvim
    chapter: 16
    verse: 2
    ordinal: 18955
    text: I have heard many such things; Sorry comforters are ye all.
    translation: JPS 1917
    original: שָׁמַעְתִּי כְאֵלֶּה רַבּוֹת מְנַחֲמֵי עָמָל כֻּלְּכֶם׃
    hebrewPlain: שמעתי כאלה רבות מנחמי עמל כלכם
    kjvRefs:
    - Job 16:2
    kjvOsis:
    - Job.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.3
    scripture: tanakh
    name: Tanakh Job 16:3
    ref: Job 16:3
    book: Job
    section: ketuvim
    chapter: 16
    verse: 3
    ordinal: 18956
    text: Shall windy words have an end? Or what provoketh thee that thou answerest?
    translation: JPS 1917
    original: הֲקֵץ לְדִבְרֵי־רוּחַ אוֹ מַה־יַּמְרִיצְךָ כִּי תַעֲנֶה׃
    hebrewPlain: הקץ לדברי רוח או מה ימריצך כי תענה
    kjvRefs:
    - Job 16:3
    kjvOsis:
    - Job.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.4
    scripture: tanakh
    name: Tanakh Job 16:4
    ref: Job 16:4
    book: Job
    section: ketuvim
    chapter: 16
    verse: 4
    ordinal: 18957
    text: I also could speak as ye do; If your soul were in my soul’s stead, I could join words together against you, And shake my head at you.
    translation: JPS 1917
    original: גַּם אָנֹכִי כָּכֶם אֲדַבֵּרָה לוּ־יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי׃
    hebrewPlain: גם אנכי ככם אדברה לו יש נפשכם תחת נפשי אחבירה עליכם במלים ואניעה עליכם במו ראשי
    kjvRefs:
    - Job 16:4
    kjvOsis:
    - Job.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.5
    scripture: tanakh
    name: Tanakh Job 16:5
    ref: Job 16:5
    book: Job
    section: ketuvim
    chapter: 16
    verse: 5
    ordinal: 18958
    text: I would strengthen you with my mouth, And the moving of my lips would assuage your grief.
    translation: JPS 1917
    original: אֲאַמִּצְכֶם בְּמוֹ־פִי וְנִיד שְׂפָתַי יַחְשֹׂךְ׃
    hebrewPlain: אאמצכם במו פי וניד שפתי יחשך
    kjvRefs:
    - Job 16:5
    kjvOsis:
    - Job.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.6
    scripture: tanakh
    name: Tanakh Job 16:6
    ref: Job 16:6
    book: Job
    section: ketuvim
    chapter: 16
    verse: 6
    ordinal: 18959
    text: Though I speak, my pain is not assuaged; And though I forbear, what am I eased?
    translation: JPS 1917
    original: אִם־אֲדַבְּרָה לֹא־יֵחָשֵׂךְ כְּאֵבִי וְאַחְדְּלָה מַה־מִנִּי יַהֲלֹךְ׃
    hebrewPlain: אם אדברה לא יחשך כאבי ואחדלה מה מני יהלך
    kjvRefs:
    - Job 16:6
    kjvOsis:
    - Job.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.7
    scripture: tanakh
    name: Tanakh Job 16:7
    ref: Job 16:7
    book: Job
    section: ketuvim
    chapter: 16
    verse: 7
    ordinal: 18960
    text: But now He hath made me weary; Thou hast made desolate all my company.
    translation: JPS 1917
    original: אַךְ־עַתָּה הֶלְאָנִי הֲשִׁמּוֹתָ כָּל־עֲדָתִי׃
    hebrewPlain: אך עתה הלאני השמות כל עדתי
    kjvRefs:
    - Job 16:7
    kjvOsis:
    - Job.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.8
    scripture: tanakh
    name: Tanakh Job 16:8
    ref: Job 16:8
    book: Job
    section: ketuvim
    chapter: 16
    verse: 8
    ordinal: 18961
    text: And Thou hast shrivelled me up, which is a witness against me; And my leanness riseth up against me, it testifieth to my face.
    translation: JPS 1917
    original: וַתִּקְמְטֵנִי לְעֵד הָיָה וַיָּקָם בִּי כַחֲשִׁי בְּפָנַי יַעֲנֶה׃
    hebrewPlain: ותקמטני לעד היה ויקם בי כחשי בפני יענה
    kjvRefs:
    - Job 16:8
    kjvOsis:
    - Job.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.9
    scripture: tanakh
    name: Tanakh Job 16:9
    ref: Job 16:9
    book: Job
    section: ketuvim
    chapter: 16
    verse: 9
    ordinal: 18962
    text: He hath torn me in His wrath, and hated me; He hath gnashed upon me with His teeth; Mine adversary sharpeneth his eyes upon me.
    translation: JPS 1917
    original: אַפּוֹ טָרַף וַיִּשְׂטְמֵנִי חָרַק עָלַי בְּשִׁנָּיו צָרִי יִלְטוֹשׁ עֵינָיו לִי׃
    hebrewPlain: אפו טרף וישטמני חרק עלי בשניו צרי ילטוש עיניו לי
    kjvRefs:
    - Job 16:9
    kjvOsis:
    - Job.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.10
    scripture: tanakh
    name: Tanakh Job 16:10
    ref: Job 16:10
    book: Job
    section: ketuvim
    chapter: 16
    verse: 10
    ordinal: 18963
    text: They have gaped upon me with their mouth; They have smitten me upon the cheek scornfully; They gather themselves together against me.
    translation: JPS 1917
    original: פָּעֲרוּ עָלַי בְּפִיהֶם בְּחֶרְפָּה הִכּוּ לְחָיָי יַחַד עָלַי יִתְמַלָּאוּן׃
    hebrewPlain: פערו עלי בפיהם בחרפה הכו לחיי יחד עלי יתמלאון
    kjvRefs:
    - Job 16:10
    kjvOsis:
    - Job.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.11
    scripture: tanakh
    name: Tanakh Job 16:11
    ref: Job 16:11
    book: Job
    section: ketuvim
    chapter: 16
    verse: 11
    ordinal: 18964
    text: God delivereth me to the ungodly, And casteth me into the hands of the wicked.
    translation: JPS 1917
    original: יַסְגִּירֵנִי אֵל אֶל עֲוִיל וְעַל־יְדֵי רְשָׁעִים יִרְטֵנִי׃
    hebrewPlain: יסגירני אל אל עויל ועל ידי רשעים ירטני
    kjvRefs:
    - Job 16:11
    kjvOsis:
    - Job.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.12
    scripture: tanakh
    name: Tanakh Job 16:12
    ref: Job 16:12
    book: Job
    section: ketuvim
    chapter: 16
    verse: 12
    ordinal: 18965
    text: I was at ease, and He broke me asunder; Yea, He hath taken me by the neck, and dashed me to pieces; He hath also set me up for His mark.
    translation: JPS 1917
    original: שָׁלֵו הָיִיתִי וַיְפַרְפְּרֵנִי וְאָחַז בְּעָרְפִּי וַיְפַצְפְּצֵנִי וַיְקִימֵנִי לוֹ לְמַטָּרָה׃
    hebrewPlain: שלו הייתי ויפרפרני ואחז בערפי ויפצפצני ויקימני לו למטרה
    kjvRefs:
    - Job 16:12
    kjvOsis:
    - Job.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.13
    scripture: tanakh
    name: Tanakh Job 16:13
    ref: Job 16:13
    book: Job
    section: ketuvim
    chapter: 16
    verse: 13
    ordinal: 18966
    text: His archers compass me round about, He cleaveth my reins asunder, and doth not spare; He poureth out my gall upon the ground.
    translation: JPS 1917
    original: יָסֹבּוּ עָלַי רַבָּיו יְפַלַּח כִּלְיוֹתַי וְלֹא יַחְמוֹל יִשְׁפֹּךְ לָאָרֶץ מְרֵרָתִי׃
    hebrewPlain: יסבו עלי רביו יפלח כליותי ולא יחמול ישפך לארץ מררתי
    kjvRefs:
    - Job 16:13
    kjvOsis:
    - Job.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.14
    scripture: tanakh
    name: Tanakh Job 16:14
    ref: Job 16:14
    book: Job
    section: ketuvim
    chapter: 16
    verse: 14
    ordinal: 18967
    text: He breaketh me with breach upon breach; He runneth upon me like a giant.
    translation: JPS 1917
    original: יִפְרְצֵנִי פֶרֶץ עַל־פְּנֵי־פָרֶץ יָרֻץ עָלַי כְּגִבּוֹר׃
    hebrewPlain: יפרצני פרץ על פני פרץ ירץ עלי כגבור
    kjvRefs:
    - Job 16:14
    kjvOsis:
    - Job.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.15
    scripture: tanakh
    name: Tanakh Job 16:15
    ref: Job 16:15
    book: Job
    section: ketuvim
    chapter: 16
    verse: 15
    ordinal: 18968
    text: I have sewed sackcloth upon my skin, And have laid my horn in the dust.
    translation: JPS 1917
    original: שַׂק תָּפַרְתִּי עֲלֵי גִלְדִּי וְעֹלַלְתִּי בֶעָפָר קַרְנִי׃
    hebrewPlain: שק תפרתי עלי גלדי ועללתי בעפר קרני
    kjvRefs:
    - Job 16:15
    kjvOsis:
    - Job.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.16
    scripture: tanakh
    name: Tanakh Job 16:16
    ref: Job 16:16
    book: Job
    section: ketuvim
    chapter: 16
    verse: 16
    ordinal: 18969
    text: My face is reddened with weeping, And on my eyelids is the shadow of death;
    translation: JPS 1917
    original: פָּנַי חמרמרה [חֳמַרְמְרוּ] מִנִּי־בֶכִי וְעַל עַפְעַפַּי צַלְמָוֶת׃
    hebrewPlain: פני חמרמרה [חמרמרו] מני בכי ועל עפעפי צלמות
    kjvRefs:
    - Job 16:16
    kjvOsis:
    - Job.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.17
    scripture: tanakh
    name: Tanakh Job 16:17
    ref: Job 16:17
    book: Job
    section: ketuvim
    chapter: 16
    verse: 17
    ordinal: 18970
    text: Although there is no violence in my hands, And my prayer is pure.
    translation: JPS 1917
    original: עַל לֹא־חָמָס בְּכַפָּי וּתְפִלָּתִי זַכָּה׃
    hebrewPlain: על לא חמס בכפי ותפלתי זכה
    kjvRefs:
    - Job 16:17
    kjvOsis:
    - Job.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.18
    scripture: tanakh
    name: Tanakh Job 16:18
    ref: Job 16:18
    book: Job
    section: ketuvim
    chapter: 16
    verse: 18
    ordinal: 18971
    text: O earth, cover not thou my blood, And let my cry have no resting-place.
    translation: JPS 1917
    original: אֶרֶץ אַל־תְּכַסִּי דָמִי וְאַל־יְהִי מָקוֹם לְזַעֲקָתִי׃
    hebrewPlain: ארץ אל תכסי דמי ואל יהי מקום לזעקתי
    kjvRefs:
    - Job 16:18
    kjvOsis:
    - Job.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.19
    scripture: tanakh
    name: Tanakh Job 16:19
    ref: Job 16:19
    book: Job
    section: ketuvim
    chapter: 16
    verse: 19
    ordinal: 18972
    text: Even now, behold, my Witness is in heaven, And He that testifieth of me is on high.
    translation: JPS 1917
    original: גַּם־עַתָּה הִנֵּה־בַשָּׁמַיִם עֵדִי וְשָׂהֲדִי בַּמְּרוֹמִים׃
    hebrewPlain: גם עתה הנה בשמים עדי ושהדי במרומים
    kjvRefs:
    - Job 16:19
    kjvOsis:
    - Job.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.20
    scripture: tanakh
    name: Tanakh Job 16:20
    ref: Job 16:20
    book: Job
    section: ketuvim
    chapter: 16
    verse: 20
    ordinal: 18973
    text: Mine inward thoughts are my intercessors, Mine eye poureth out tears unto God;
    translation: JPS 1917
    original: מְלִיצַי רֵעָי אֶל־אֱלוֹהַ דָּלְפָה עֵינִי׃
    hebrewPlain: מליצי רעי אל אלוה דלפה עיני
    kjvRefs:
    - Job 16:20
    kjvOsis:
    - Job.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.21
    scripture: tanakh
    name: Tanakh Job 16:21
    ref: Job 16:21
    book: Job
    section: ketuvim
    chapter: 16
    verse: 21
    ordinal: 18974
    text: That He would set aright a man contending with God, As a son of man setteth aright his neighbour! .
    translation: JPS 1917
    original: וְיוֹכַח לְגֶבֶר עִם־אֱלוֹהַּ וּבֶן־אָדָם לְרֵעֵהוּ׃
    hebrewPlain: ויוכח לגבר עם אלוה ובן אדם לרעהו
    kjvRefs:
    - Job 16:21
    kjvOsis:
    - Job.16.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.16.22
    scripture: tanakh
    name: Tanakh Job 16:22
    ref: Job 16:22
    book: Job
    section: ketuvim
    chapter: 16
    verse: 22
    ordinal: 18975
    text: For the years that are few are coming on, And I shall go the way whence I shall not return.
    translation: JPS 1917
    original: כִּי־שְׁנוֹת מִסְפָּר יֶאֱתָיוּ וְאֹרַח לֹא־אָשׁוּב אֶהֱלֹךְ׃
    hebrewPlain: כי שנות מספר יאתיו וארח לא אשוב אהלך
    kjvRefs:
    - Job 16:22
    kjvOsis:
    - Job.16.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.16
- type: TanakhVerse
  data:
    osis: Job.17.1
    scripture: tanakh
    name: Tanakh Job 17:1
    ref: Job 17:1
    book: Job
    section: ketuvim
    chapter: 17
    verse: 1
    ordinal: 18976
    text: My spirit consumed, my days are extinct, The grave is ready for me.
    translation: JPS 1917
    original: רוּחִי חֻבָּלָה יָמַי נִזְעָכוּ קְבָרִים לִי׃
    hebrewPlain: רוחי חבלה ימי נזעכו קברים לי
    kjvRefs:
    - Job 17:1
    kjvOsis:
    - Job.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.2
    scripture: tanakh
    name: Tanakh Job 17:2
    ref: Job 17:2
    book: Job
    section: ketuvim
    chapter: 17
    verse: 2
    ordinal: 18977
    text: Surely there are mockers with me, And mine eye abideth in their provocation.
    translation: JPS 1917
    original: אִם־לֹא הֲתֻלִים עִמָּדִי וּבְהַמְּרוֹתָם תָּלַן עֵינִי׃
    hebrewPlain: אם לא התלים עמדי ובהמרותם תלן עיני
    kjvRefs:
    - Job 17:2
    kjvOsis:
    - Job.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.3
    scripture: tanakh
    name: Tanakh Job 17:3
    ref: Job 17:3
    book: Job
    section: ketuvim
    chapter: 17
    verse: 3
    ordinal: 18978
    text: Give now a pledge, be surety for me with Thyself; Who else is there that will strike hands with me?
    translation: JPS 1917
    original: שִׂימָה־נָּא עָרְבֵנִי עִמָּךְ מִי הוּא לְיָדִי יִתָּקֵעַ׃
    hebrewPlain: שימה נא ערבני עמך מי הוא לידי יתקע
    kjvRefs:
    - Job 17:3
    kjvOsis:
    - Job.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.4
    scripture: tanakh
    name: Tanakh Job 17:4
    ref: Job 17:4
    book: Job
    section: ketuvim
    chapter: 17
    verse: 4
    ordinal: 18979
    text: For Thou hast hid their heart from understanding; Therefore shalt Thou not exalt them.
    translation: JPS 1917
    original: כִּי־לִבָּם צָפַנְתָּ מִּשָּׂכֶל עַל־כֵּן לֹא תְרֹמֵם׃
    hebrewPlain: כי לבם צפנת משכל על כן לא תרמם
    kjvRefs:
    - Job 17:4
    kjvOsis:
    - Job.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.5
    scripture: tanakh
    name: Tanakh Job 17:5
    ref: Job 17:5
    book: Job
    section: ketuvim
    chapter: 17
    verse: 5
    ordinal: 18980
    text: He that denounceth his friends for the sake of flattery, Even the eyes of his children shall fail.
    translation: JPS 1917
    original: לְחֵלֶק יַגִּיד רֵעִים וְעֵינֵי בָנָיו תִּכְלֶנָה׃
    hebrewPlain: לחלק יגיד רעים ועיני בניו תכלנה
    kjvRefs:
    - Job 17:5
    kjvOsis:
    - Job.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.6
    scripture: tanakh
    name: Tanakh Job 17:6
    ref: Job 17:6
    book: Job
    section: ketuvim
    chapter: 17
    verse: 6
    ordinal: 18981
    text: He hath made me also a byword of the people; And I am become one in whose face they spit.
    translation: JPS 1917
    original: וְהִצִּגַנִי לִמְשֹׁל עַמִּים וְתֹפֶת לְפָנִים אֶהְיֶה׃
    hebrewPlain: והצגני למשל עמים ותפת לפנים אהיה
    kjvRefs:
    - Job 17:6
    kjvOsis:
    - Job.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.7
    scripture: tanakh
    name: Tanakh Job 17:7
    ref: Job 17:7
    book: Job
    section: ketuvim
    chapter: 17
    verse: 7
    ordinal: 18982
    text: Mine eye also is dimmed by reason of vexation, And all my members are as a shadow.
    translation: JPS 1917
    original: וַתֵּכַהּ מִכַּעַשׂ עֵינִי וִיצֻרַי כַּצֵּל כֻּלָּם׃
    hebrewPlain: ותכה מכעש עיני ויצרי כצל כלם
    kjvRefs:
    - Job 17:7
    kjvOsis:
    - Job.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.8
    scripture: tanakh
    name: Tanakh Job 17:8
    ref: Job 17:8
    book: Job
    section: ketuvim
    chapter: 17
    verse: 8
    ordinal: 18983
    text: Upright men are astonished at this, And the innocent stirreth up himself against the godless.
    translation: JPS 1917
    original: יָשֹׁמּוּ יְשָׁרִים עַל־זֹאת וְנָקִי עַל־חָנֵף יִתְעֹרָר׃
    hebrewPlain: ישמו ישרים על זאת ונקי על חנף יתערר
    kjvRefs:
    - Job 17:8
    kjvOsis:
    - Job.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.9
    scripture: tanakh
    name: Tanakh Job 17:9
    ref: Job 17:9
    book: Job
    section: ketuvim
    chapter: 17
    verse: 9
    ordinal: 18984
    text: Yet the righteous holdeth on his way, And he that hath clean hands waxeth stronger and stronger.
    translation: JPS 1917
    original: וְיֹאחֵז צַדִּיק דַּרְכּוֹ וּטֳהָר־יָדַיִם יֹסִיף אֹמֶץ׃
    hebrewPlain: ויאחז צדיק דרכו וטהר ידים יסיף אמץ
    kjvRefs:
    - Job 17:9
    kjvOsis:
    - Job.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.10
    scripture: tanakh
    name: Tanakh Job 17:10
    ref: Job 17:10
    book: Job
    section: ketuvim
    chapter: 17
    verse: 10
    ordinal: 18985
    text: But as for you all, do ye return, and come now; And I shall not find a wise man among you.
    translation: JPS 1917
    original: וְאוּלָם כֻּלָּם תָּשֻׁבוּ וּבֹאוּ נָא וְלֹא־אֶמְצָא בָכֶם חָכָם׃
    hebrewPlain: ואולם כלם תשבו ובאו נא ולא אמצא בכם חכם
    kjvRefs:
    - Job 17:10
    kjvOsis:
    - Job.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.11
    scripture: tanakh
    name: Tanakh Job 17:11
    ref: Job 17:11
    book: Job
    section: ketuvim
    chapter: 17
    verse: 11
    ordinal: 18986
    text: My days are past, my purposes are broken off, Even the thoughts of my heart.
    translation: JPS 1917
    original: יָמַי עָבְרוּ זִמֹּתַי נִתְּקוּ מוֹרָשֵׁי לְבָבִי׃
    hebrewPlain: ימי עברו זמתי נתקו מורשי לבבי
    kjvRefs:
    - Job 17:11
    kjvOsis:
    - Job.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.12
    scripture: tanakh
    name: Tanakh Job 17:12
    ref: Job 17:12
    book: Job
    section: ketuvim
    chapter: 17
    verse: 12
    ordinal: 18987
    text: They change the night into day; The light is short because of darkness.
    translation: JPS 1917
    original: לַיְלָה לְיוֹם יָשִׂימוּ אוֹר קָרוֹב מִפְּנֵי־חֹשֶׁךְ׃
    hebrewPlain: לילה ליום ישימו אור קרוב מפני חשך
    kjvRefs:
    - Job 17:12
    kjvOsis:
    - Job.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.13
    scripture: tanakh
    name: Tanakh Job 17:13
    ref: Job 17:13
    book: Job
    section: ketuvim
    chapter: 17
    verse: 13
    ordinal: 18988
    text: If I look for the nether-world as my house; If I have spread my couch in the darkness;
    translation: JPS 1917
    original: אִם־אֲקַוֶּה שְׁאוֹל בֵּיתִי בַּחֹשֶׁךְ רִפַּדְתִּי יְצוּעָי׃
    hebrewPlain: אם אקוה שאול ביתי בחשך רפדתי יצועי
    kjvRefs:
    - Job 17:13
    kjvOsis:
    - Job.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.14
    scripture: tanakh
    name: Tanakh Job 17:14
    ref: Job 17:14
    book: Job
    section: ketuvim
    chapter: 17
    verse: 14
    ordinal: 18989
    text: 'If I have said to corruption: ‘Thou art my father’, To the worm: ‘Thou art my mother, and my sister’;'
    translation: JPS 1917
    original: לַשַּׁחַת קָרָאתִי אָבִי אָתָּה אִמִּי וַאֲחֹתִי לָרִמָּה׃
    hebrewPlain: לשחת קראתי אבי אתה אמי ואחתי לרמה
    kjvRefs:
    - Job 17:14
    kjvOsis:
    - Job.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.15
    scripture: tanakh
    name: Tanakh Job 17:15
    ref: Job 17:15
    book: Job
    section: ketuvim
    chapter: 17
    verse: 15
    ordinal: 18990
    text: Where then is my hope? And as for my hope, who shall see it?
    translation: JPS 1917
    original: וְאַיֵּה אֵפוֹ תִקְוָתִי וְתִקְוָתִי מִי יְשׁוּרֶנָּה׃
    hebrewPlain: ואיה אפו תקותי ותקותי מי ישורנה
    kjvRefs:
    - Job 17:15
    kjvOsis:
    - Job.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.17.16
    scripture: tanakh
    name: Tanakh Job 17:16
    ref: Job 17:16
    book: Job
    section: ketuvim
    chapter: 17
    verse: 16
    ordinal: 18991
    text: They shall go down to the bars of the nether-world, When we are at rest together in the dust.
    translation: JPS 1917
    original: בַּדֵּי שְׁאֹל תֵּרַדְנָה אִם־יַחַד עַל־עָפָר נָחַת׃
    hebrewPlain: בדי שאל תרדנה אם יחד על עפר נחת
    kjvRefs:
    - Job 17:16
    kjvOsis:
    - Job.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.17
- type: TanakhVerse
  data:
    osis: Job.18.1
    scripture: tanakh
    name: Tanakh Job 18:1
    ref: Job 18:1
    book: Job
    section: ketuvim
    chapter: 18
    verse: 1
    ordinal: 18992
    text: 'Then answered Bildad the Shuhite, and said:'
    translation: JPS 1917
    original: וַיַּעַן בִּלְדַּד הַשֻּׁחִי וַיֹּאמַר׃
    hebrewPlain: ויען בלדד השחי ויאמר
    kjvRefs:
    - Job 18:1
    kjvOsis:
    - Job.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.2
    scripture: tanakh
    name: Tanakh Job 18:2
    ref: Job 18:2
    book: Job
    section: ketuvim
    chapter: 18
    verse: 2
    ordinal: 18993
    text: How long will ye lay snares for words? Consider, and afterwards we will speak.
    translation: JPS 1917
    original: עַד־אָנָה תְּשִׂימוּן קִנְצֵי לְמִלִּין תָּבִינוּ וְאַחַר נְדַבֵּר׃
    hebrewPlain: עד אנה תשימון קנצי למלין תבינו ואחר נדבר
    kjvRefs:
    - Job 18:2
    kjvOsis:
    - Job.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.3
    scripture: tanakh
    name: Tanakh Job 18:3
    ref: Job 18:3
    book: Job
    section: ketuvim
    chapter: 18
    verse: 3
    ordinal: 18994
    text: Wherefore are we counted as beasts, And reputed dull in your sight?
    translation: JPS 1917
    original: מַדּוּעַ נֶחְשַׁבְנוּ כַבְּהֵמָה נִטְמִינוּ בְּעֵינֵיכֶם׃
    hebrewPlain: מדוע נחשבנו כבהמה נטמינו בעיניכם
    kjvRefs:
    - Job 18:3
    kjvOsis:
    - Job.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.4
    scripture: tanakh
    name: Tanakh Job 18:4
    ref: Job 18:4
    book: Job
    section: ketuvim
    chapter: 18
    verse: 4
    ordinal: 18995
    text: Thou that tearest thyself in thine anger, Shall the earth be forsaken for thee? Or shall the rock be removed out of its place? .
    translation: JPS 1917
    original: טֹרֵף נַפְשׁוֹ בְּאַפּוֹ הַלְמַעַנְךָ תֵּעָזַב אָרֶץ וְיֶעְתַּק־צוּר מִמְּקֹמוֹ׃
    hebrewPlain: טרף נפשו באפו הלמענך תעזב ארץ ויעתק צור ממקמו
    kjvRefs:
    - Job 18:4
    kjvOsis:
    - Job.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.5
    scripture: tanakh
    name: Tanakh Job 18:5
    ref: Job 18:5
    book: Job
    section: ketuvim
    chapter: 18
    verse: 5
    ordinal: 18996
    text: Yea, the light of the wicked shall be put out, And the spark of his fire shall not shine.
    translation: JPS 1917
    original: גַּם אוֹר רְשָׁעִים יִדְעָךְ וְלֹא־יִגַּהּ שְׁבִיב אִשּׁוֹ׃
    hebrewPlain: גם אור רשעים ידעך ולא יגה שביב אשו
    kjvRefs:
    - Job 18:5
    kjvOsis:
    - Job.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.6
    scripture: tanakh
    name: Tanakh Job 18:6
    ref: Job 18:6
    book: Job
    section: ketuvim
    chapter: 18
    verse: 6
    ordinal: 18997
    text: The light shall be dark in his tent, And his lamp over him shall be put out.
    translation: JPS 1917
    original: אוֹר חָשַׁךְ בְּאָהֳלוֹ וְנֵרוֹ עָלָיו יִדְעָךְ׃
    hebrewPlain: אור חשך באהלו ונרו עליו ידעך
    kjvRefs:
    - Job 18:6
    kjvOsis:
    - Job.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.7
    scripture: tanakh
    name: Tanakh Job 18:7
    ref: Job 18:7
    book: Job
    section: ketuvim
    chapter: 18
    verse: 7
    ordinal: 18998
    text: The steps of his strength shall be straitened, And his own counsel shall cast him down.
    translation: JPS 1917
    original: יֵצְרוּ צַעֲדֵי אוֹנוֹ וְתַשְׁלִיכֵהוּ עֲצָתוֹ׃
    hebrewPlain: יצרו צעדי אונו ותשליכהו עצתו
    kjvRefs:
    - Job 18:7
    kjvOsis:
    - Job.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.8
    scripture: tanakh
    name: Tanakh Job 18:8
    ref: Job 18:8
    book: Job
    section: ketuvim
    chapter: 18
    verse: 8
    ordinal: 18999
    text: For he is cast into a net by his own feet, And he walketh upon the toils.
    translation: JPS 1917
    original: כִּי־שֻׁלַּח בְּרֶשֶׁת בְּרַגְלָיו וְעַל־שְׂבָכָה יִתְהַלָּךְ׃
    hebrewPlain: כי שלח ברשת ברגליו ועל שבכה יתהלך
    kjvRefs:
    - Job 18:8
    kjvOsis:
    - Job.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.9
    scripture: tanakh
    name: Tanakh Job 18:9
    ref: Job 18:9
    book: Job
    section: ketuvim
    chapter: 18
    verse: 9
    ordinal: 19000
    text: A gin shall take him by the heel, And a snare shall lay hold on him.
    translation: JPS 1917
    original: יֹאחֵז בְּעָקֵב פָּח יַחֲזֵק עָלָיו צַמִּים׃
    hebrewPlain: יאחז בעקב פח יחזק עליו צמים
    kjvRefs:
    - Job 18:9
    kjvOsis:
    - Job.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.10
    scripture: tanakh
    name: Tanakh Job 18:10
    ref: Job 18:10
    book: Job
    section: ketuvim
    chapter: 18
    verse: 10
    ordinal: 19001
    text: A noose is hid for him in the ground, And a trap for him in the way.
    translation: JPS 1917
    original: טָמוּן בָּאָרֶץ חַבְלוֹ וּמַלְכֻּדְתּוֹ עֲלֵי נָתִיב׃
    hebrewPlain: טמון בארץ חבלו ומלכדתו עלי נתיב
    kjvRefs:
    - Job 18:10
    kjvOsis:
    - Job.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.11
    scripture: tanakh
    name: Tanakh Job 18:11
    ref: Job 18:11
    book: Job
    section: ketuvim
    chapter: 18
    verse: 11
    ordinal: 19002
    text: Terrors shall overwhelm him on every side, And shall entrap him at his feet.
    translation: JPS 1917
    original: סָבִיב בִּעֲתֻהוּ בַלָּהוֹת וֶהֱפִיצֻהוּ לְרַגְלָיו׃
    hebrewPlain: סביב בעתהו בלהות והפיצהו לרגליו
    kjvRefs:
    - Job 18:11
    kjvOsis:
    - Job.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.12
    scripture: tanakh
    name: Tanakh Job 18:12
    ref: Job 18:12
    book: Job
    section: ketuvim
    chapter: 18
    verse: 12
    ordinal: 19003
    text: His trouble shall be ravenous, And calamity shall be ready for his fall.
    translation: JPS 1917
    original: יְהִי־רָעֵב אֹנוֹ וְאֵיד נָכוֹן לְצַלְעוֹ׃
    hebrewPlain: יהי רעב אנו ואיד נכון לצלעו
    kjvRefs:
    - Job 18:12
    kjvOsis:
    - Job.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.13
    scripture: tanakh
    name: Tanakh Job 18:13
    ref: Job 18:13
    book: Job
    section: ketuvim
    chapter: 18
    verse: 13
    ordinal: 19004
    text: It shall devour the members of his body, Yea, the first-born of death shall devour his members.
    translation: JPS 1917
    original: יֹאכַל בַּדֵּי עוֹרוֹ יֹאכַל בַּדָּיו בְּכוֹר מָוֶת׃
    hebrewPlain: יאכל בדי עורו יאכל בדיו בכור מות
    kjvRefs:
    - Job 18:13
    kjvOsis:
    - Job.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.14
    scripture: tanakh
    name: Tanakh Job 18:14
    ref: Job 18:14
    book: Job
    section: ketuvim
    chapter: 18
    verse: 14
    ordinal: 19005
    text: That wherein he trusteth shall be plucked out of his tent; And he shall be brought to the king of terrors.
    translation: JPS 1917
    original: יִנָּתֵק מֵאָהֳלוֹ מִבְטַחוֹ וְתַצְעִדֵהוּ לְמֶלֶךְ בַּלָּהוֹת׃
    hebrewPlain: ינתק מאהלו מבטחו ותצעדהו למלך בלהות
    kjvRefs:
    - Job 18:14
    kjvOsis:
    - Job.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.15
    scripture: tanakh
    name: Tanakh Job 18:15
    ref: Job 18:15
    book: Job
    section: ketuvim
    chapter: 18
    verse: 15
    ordinal: 19006
    text: There shall dwell in his tent that which is none of his; Brimstone shall be scattered upon his habitation.
    translation: JPS 1917
    original: תִּשְׁכּוֹן בְּאָהֳלוֹ מִבְּלִי־לוֹ יְזֹרֶה עַל־נָוֵהוּ גָפְרִית׃
    hebrewPlain: תשכון באהלו מבלי לו יזרה על נוהו גפרית
    kjvRefs:
    - Job 18:15
    kjvOsis:
    - Job.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.16
    scripture: tanakh
    name: Tanakh Job 18:16
    ref: Job 18:16
    book: Job
    section: ketuvim
    chapter: 18
    verse: 16
    ordinal: 19007
    text: His roots shall dry up beneath, And above shall his branch wither.
    translation: JPS 1917
    original: מִתַּחַת שָׁרָשָׁיו יִבָשׁוּ וּמִמַּעַל יִמַּל קְצִירוֹ׃
    hebrewPlain: מתחת שרשיו יבשו וממעל ימל קצירו
    kjvRefs:
    - Job 18:16
    kjvOsis:
    - Job.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.17
    scripture: tanakh
    name: Tanakh Job 18:17
    ref: Job 18:17
    book: Job
    section: ketuvim
    chapter: 18
    verse: 17
    ordinal: 19008
    text: His remembrance shall perish from the earth, And he shall have no name abroad.
    translation: JPS 1917
    original: זִכְרוֹ־אָבַד מִנִּי־אָרֶץ וְלֹא־שֵׁם לוֹ עַל־פְּנֵי־חוּץ׃
    hebrewPlain: זכרו אבד מני ארץ ולא שם לו על פני חוץ
    kjvRefs:
    - Job 18:17
    kjvOsis:
    - Job.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.18
    scripture: tanakh
    name: Tanakh Job 18:18
    ref: Job 18:18
    book: Job
    section: ketuvim
    chapter: 18
    verse: 18
    ordinal: 19009
    text: He shall be driven from light into darkness, And chased out of the world.
    translation: JPS 1917
    original: יֶהְדְּפֻהוּ מֵאוֹר אֶל־חֹשֶׁךְ וּמִתֵּבֵל יְנִדֻּהוּ׃
    hebrewPlain: יהדפהו מאור אל חשך ומתבל ינדהו
    kjvRefs:
    - Job 18:18
    kjvOsis:
    - Job.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.19
    scripture: tanakh
    name: Tanakh Job 18:19
    ref: Job 18:19
    book: Job
    section: ketuvim
    chapter: 18
    verse: 19
    ordinal: 19010
    text: He shall have neither son nor son’s son among his people, Nor any remaining in his dwellings.
    translation: JPS 1917
    original: לֹא נִין לוֹ וְלֹא־נֶכֶד בְּעַמּוֹ וְאֵין שָׂרִיד בִּמְגוּרָיו׃
    hebrewPlain: לא נין לו ולא נכד בעמו ואין שריד במגוריו
    kjvRefs:
    - Job 18:19
    kjvOsis:
    - Job.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.20
    scripture: tanakh
    name: Tanakh Job 18:20
    ref: Job 18:20
    book: Job
    section: ketuvim
    chapter: 18
    verse: 20
    ordinal: 19011
    text: They that come after shall be astonished at his day, As they that went before are affrighted.
    translation: JPS 1917
    original: עַל־יוֹמוֹ נָשַׁמּוּ אַחֲרֹנִים וְקַדְמֹנִים אָחֲזוּ שָׂעַר׃
    hebrewPlain: על יומו נשמו אחרנים וקדמנים אחזו שער
    kjvRefs:
    - Job 18:20
    kjvOsis:
    - Job.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.18.21
    scripture: tanakh
    name: Tanakh Job 18:21
    ref: Job 18:21
    book: Job
    section: ketuvim
    chapter: 18
    verse: 21
    ordinal: 19012
    text: Surely such are the dwellings of the wicked, And this is the place of him that knoweth not God.
    translation: JPS 1917
    original: אַךְ־אֵלֶּה מִשְׁכְּנוֹת עַוָּל וְזֶה מְקוֹם לֹא־יָדַע־אֵל׃
    hebrewPlain: אך אלה משכנות עול וזה מקום לא ידע אל
    kjvRefs:
    - Job 18:21
    kjvOsis:
    - Job.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.18
- type: TanakhVerse
  data:
    osis: Job.19.1
    scripture: tanakh
    name: Tanakh Job 19:1
    ref: Job 19:1
    book: Job
    section: ketuvim
    chapter: 19
    verse: 1
    ordinal: 19013
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 19:1
    kjvOsis:
    - Job.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.2
    scripture: tanakh
    name: Tanakh Job 19:2
    ref: Job 19:2
    book: Job
    section: ketuvim
    chapter: 19
    verse: 2
    ordinal: 19014
    text: How long will ye vex my soul, And crush me with words?
    translation: JPS 1917
    original: עַד־אָנָה תּוֹגְיוּן נַפְשִׁי וּתְדַכְּאוּנַנִי בְמִלִּים׃
    hebrewPlain: עד אנה תוגיון נפשי ותדכאונני במלים
    kjvRefs:
    - Job 19:2
    kjvOsis:
    - Job.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.3
    scripture: tanakh
    name: Tanakh Job 19:3
    ref: Job 19:3
    book: Job
    section: ketuvim
    chapter: 19
    verse: 3
    ordinal: 19015
    text: These ten times have ye reproached me; Ye are not ashamed that ye deal harshly with me.
    translation: JPS 1917
    original: זֶה עֶשֶׂר פְּעָמִים תַּכְלִימוּנִי לֹא־תֵבֹשׁוּ תַּהְכְּרוּ־לִי׃
    hebrewPlain: זה עשר פעמים תכלימוני לא תבשו תהכרו לי
    kjvRefs:
    - Job 19:3
    kjvOsis:
    - Job.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.4
    scripture: tanakh
    name: Tanakh Job 19:4
    ref: Job 19:4
    book: Job
    section: ketuvim
    chapter: 19
    verse: 4
    ordinal: 19016
    text: And be it indeed that I have erred, Mine error remaineth with myself.
    translation: JPS 1917
    original: וְאַף־אָמְנָם שָׁגִיתִי אִתִּי תָּלִין מְשׁוּגָתִי׃
    hebrewPlain: ואף אמנם שגיתי אתי תלין משוגתי
    kjvRefs:
    - Job 19:4
    kjvOsis:
    - Job.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.5
    scripture: tanakh
    name: Tanakh Job 19:5
    ref: Job 19:5
    book: Job
    section: ketuvim
    chapter: 19
    verse: 5
    ordinal: 19017
    text: If indeed ye will magnify yourselves against me, And plead against me my reproach;
    translation: JPS 1917
    original: אִם־אָמְנָם עָלַי תַּגְדִּילוּ וְתוֹכִיחוּ עָלַי חֶרְפָּתִּי׃
    hebrewPlain: אם אמנם עלי תגדילו ותוכיחו עלי חרפתי
    kjvRefs:
    - Job 19:5
    kjvOsis:
    - Job.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.6
    scripture: tanakh
    name: Tanakh Job 19:6
    ref: Job 19:6
    book: Job
    section: ketuvim
    chapter: 19
    verse: 6
    ordinal: 19018
    text: Know now that God hath subverted my cause, And hath compassed me with His net.
    translation: JPS 1917
    original: דְּעוּ־אֵפוֹ כִּי־אֱלוֹהַּ עִוְּתָנִי וּמְצוּדוֹ עָלַי הִקִּיף׃
    hebrewPlain: דעו אפו כי אלוה עותני ומצודו עלי הקיף
    kjvRefs:
    - Job 19:6
    kjvOsis:
    - Job.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.7
    scripture: tanakh
    name: Tanakh Job 19:7
    ref: Job 19:7
    book: Job
    section: ketuvim
    chapter: 19
    verse: 7
    ordinal: 19019
    text: 'Behold, I cry out: ‘Violence! ’ but I am not heard; I cry aloud, but there is no justice. .'
    translation: JPS 1917
    original: הֵן אֶצְעַק חָמָס וְלֹא אֵעָנֶה אֲשַׁוַּע וְאֵין מִשְׁפָּט׃
    hebrewPlain: הן אצעק חמס ולא אענה אשוע ואין משפט
    kjvRefs:
    - Job 19:7
    kjvOsis:
    - Job.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.8
    scripture: tanakh
    name: Tanakh Job 19:8
    ref: Job 19:8
    book: Job
    section: ketuvim
    chapter: 19
    verse: 8
    ordinal: 19020
    text: He hath fenced up my way that I cannot pass, And hath set darkness in my paths.
    translation: JPS 1917
    original: אָרְחִי גָדַר וְלֹא אֶעֱבוֹר וְעַל נְתִיבוֹתַי חֹשֶׁךְ יָשִׂים׃
    hebrewPlain: ארחי גדר ולא אעבור ועל נתיבותי חשך ישים
    kjvRefs:
    - Job 19:8
    kjvOsis:
    - Job.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.9
    scripture: tanakh
    name: Tanakh Job 19:9
    ref: Job 19:9
    book: Job
    section: ketuvim
    chapter: 19
    verse: 9
    ordinal: 19021
    text: He hath stripped me of my glory, And taken the crown from my head.
    translation: JPS 1917
    original: כְּבוֹדִי מֵעָלַי הִפְשִׁיט וַיָּסַר עֲטֶרֶת רֹאשִׁי׃
    hebrewPlain: כבודי מעלי הפשיט ויסר עטרת ראשי
    kjvRefs:
    - Job 19:9
    kjvOsis:
    - Job.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.10
    scripture: tanakh
    name: Tanakh Job 19:10
    ref: Job 19:10
    book: Job
    section: ketuvim
    chapter: 19
    verse: 10
    ordinal: 19022
    text: He hath broken me down on every side, and I am gone; And my hope hath He plucked up like a tree.
    translation: JPS 1917
    original: יִתְּצֵנִי סָבִיב וָאֵלַךְ וַיַּסַּע כָּעֵץ תִּקְוָתִי׃
    hebrewPlain: יתצני סביב ואלך ויסע כעץ תקותי
    kjvRefs:
    - Job 19:10
    kjvOsis:
    - Job.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.11
    scripture: tanakh
    name: Tanakh Job 19:11
    ref: Job 19:11
    book: Job
    section: ketuvim
    chapter: 19
    verse: 11
    ordinal: 19023
    text: He hath also kindled His wrath against me, And He counteth me unto Him as one of His adversaries.
    translation: JPS 1917
    original: וַיַּחַר עָלַי אַפּוֹ וַיַּחְשְׁבֵנִי לוֹ כְצָרָיו׃
    hebrewPlain: ויחר עלי אפו ויחשבני לו כצריו
    kjvRefs:
    - Job 19:11
    kjvOsis:
    - Job.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.12
    scripture: tanakh
    name: Tanakh Job 19:12
    ref: Job 19:12
    book: Job
    section: ketuvim
    chapter: 19
    verse: 12
    ordinal: 19024
    text: His troops come on together, And cast up their way against me, And encamp round about my tent.
    translation: JPS 1917
    original: יַחַד יָבֹאוּ גְדוּדָיו וַיָּסֹלּוּ עָלַי דַּרְכָּם וַיַּחֲנוּ סָבִיב לְאָהֳלִי׃
    hebrewPlain: יחד יבאו גדודיו ויסלו עלי דרכם ויחנו סביב לאהלי
    kjvRefs:
    - Job 19:12
    kjvOsis:
    - Job.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.13
    scripture: tanakh
    name: Tanakh Job 19:13
    ref: Job 19:13
    book: Job
    section: ketuvim
    chapter: 19
    verse: 13
    ordinal: 19025
    text: He hath put my brethren far from me, And mine acquaintance are wholly estranged from me.
    translation: JPS 1917
    original: אַחַי מֵעָלַי הִרְחִיק וְיֹדְעַי אַךְ־זָרוּ מִמֶּנִּי׃
    hebrewPlain: אחי מעלי הרחיק וידעי אך זרו ממני
    kjvRefs:
    - Job 19:13
    kjvOsis:
    - Job.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.14
    scripture: tanakh
    name: Tanakh Job 19:14
    ref: Job 19:14
    book: Job
    section: ketuvim
    chapter: 19
    verse: 14
    ordinal: 19026
    text: My kinsfolk have failed, And my familiar friends have forgotten me.
    translation: JPS 1917
    original: חָדְלוּ קְרוֹבָי וּמְיֻדָּעַי שְׁכֵחוּנִי׃
    hebrewPlain: חדלו קרובי ומידעי שכחוני
    kjvRefs:
    - Job 19:14
    kjvOsis:
    - Job.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.15
    scripture: tanakh
    name: Tanakh Job 19:15
    ref: Job 19:15
    book: Job
    section: ketuvim
    chapter: 19
    verse: 15
    ordinal: 19027
    text: They that dwell in my house, and my maids, count me for a stranger; I am become an alien in their sight.
    translation: JPS 1917
    original: גָּרֵי בֵיתִי וְאַמְהֹתַי לְזָר תַּחְשְׁבֻנִי נָכְרִי הָיִיתִי בְעֵינֵיהֶם׃
    hebrewPlain: גרי ביתי ואמהתי לזר תחשבני נכרי הייתי בעיניהם
    kjvRefs:
    - Job 19:15
    kjvOsis:
    - Job.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.16
    scripture: tanakh
    name: Tanakh Job 19:16
    ref: Job 19:16
    book: Job
    section: ketuvim
    chapter: 19
    verse: 16
    ordinal: 19028
    text: I call unto my servant, and he giveth me no answer, Though I entreat him with my mouth.
    translation: JPS 1917
    original: לְעַבְדִּי קָרָאתִי וְלֹא יַעֲנֶה בְּמוֹ־פִי אֶתְחַנֶּן־לוֹ׃
    hebrewPlain: לעבדי קראתי ולא יענה במו פי אתחנן לו
    kjvRefs:
    - Job 19:16
    kjvOsis:
    - Job.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.17
    scripture: tanakh
    name: Tanakh Job 19:17
    ref: Job 19:17
    book: Job
    section: ketuvim
    chapter: 19
    verse: 17
    ordinal: 19029
    text: My breath is abhorred of my wife, And I am loathsome to the children of my tribe.
    translation: JPS 1917
    original: רוּחִי זָרָה לְאִשְׁתִּי וְחַנֹּתִי לִבְנֵי בִטְנִי׃
    hebrewPlain: רוחי זרה לאשתי וחנתי לבני בטני
    kjvRefs:
    - Job 19:17
    kjvOsis:
    - Job.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.18
    scripture: tanakh
    name: Tanakh Job 19:18
    ref: Job 19:18
    book: Job
    section: ketuvim
    chapter: 19
    verse: 18
    ordinal: 19030
    text: Even urchins despised me; If I arise, they speak against me.
    translation: JPS 1917
    original: גַּם־עֲוִילִים מָאֲסוּ בִי אָקוּמָה וַיְדַבְּרוּ־בִי׃
    hebrewPlain: גם עוילים מאסו בי אקומה וידברו בי
    kjvRefs:
    - Job 19:18
    kjvOsis:
    - Job.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.19
    scripture: tanakh
    name: Tanakh Job 19:19
    ref: Job 19:19
    book: Job
    section: ketuvim
    chapter: 19
    verse: 19
    ordinal: 19031
    text: All my intimate friends abhor me; And they whom I loved are turned against me.
    translation: JPS 1917
    original: תִּעֲבוּנִי כָּל־מְתֵי סוֹדִי וְזֶה־אָהַבְתִּי נֶהְפְּכוּ־בִי׃
    hebrewPlain: תעבוני כל מתי סודי וזה אהבתי נהפכו בי
    kjvRefs:
    - Job 19:19
    kjvOsis:
    - Job.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.20
    scripture: tanakh
    name: Tanakh Job 19:20
    ref: Job 19:20
    book: Job
    section: ketuvim
    chapter: 19
    verse: 20
    ordinal: 19032
    text: My bone cleaveth to my skin and to my flesh, And I am escaped with the skin of my teeth.
    translation: JPS 1917
    original: בְּעוֹרִי וּבִבְשָׂרִי דָּבְקָה עַצְמִי וָאֶתְמַלְּטָה בְּעוֹר שִׁנָּי׃
    hebrewPlain: בעורי ובבשרי דבקה עצמי ואתמלטה בעור שני
    kjvRefs:
    - Job 19:20
    kjvOsis:
    - Job.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.21
    scripture: tanakh
    name: Tanakh Job 19:21
    ref: Job 19:21
    book: Job
    section: ketuvim
    chapter: 19
    verse: 21
    ordinal: 19033
    text: Have pity upon me, have pity upon me, O ye my friends; For the hand of God hath touched me.
    translation: JPS 1917
    original: חָנֻּנִי חָנֻּנִי אַתֶּם רֵעָי כִּי יַד־אֱלוֹהַּ נָגְעָה בִּי׃
    hebrewPlain: חנני חנני אתם רעי כי יד אלוה נגעה בי
    kjvRefs:
    - Job 19:21
    kjvOsis:
    - Job.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.22
    scripture: tanakh
    name: Tanakh Job 19:22
    ref: Job 19:22
    book: Job
    section: ketuvim
    chapter: 19
    verse: 22
    ordinal: 19034
    text: Why do ye persecute me as God, And are not satisfied with my flesh?
    translation: JPS 1917
    original: לָמָּה תִּרְדְּפֻנִי כְמוֹ־אֵל וּמִבְּשָׂרִי לֹא תִשְׂבָּעוּ׃
    hebrewPlain: למה תרדפני כמו אל ומבשרי לא תשבעו
    kjvRefs:
    - Job 19:22
    kjvOsis:
    - Job.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.23
    scripture: tanakh
    name: Tanakh Job 19:23
    ref: Job 19:23
    book: Job
    section: ketuvim
    chapter: 19
    verse: 23
    ordinal: 19035
    text: Oh that my words were now written! Oh that they were inscribed in a book!
    translation: JPS 1917
    original: מִי־יִתֵּן אֵפוֹ וְיִכָּתְבוּן מִלָּי מִי־יִתֵּן בַּסֵּפֶר וְיֻחָקוּ׃
    hebrewPlain: מי יתן אפו ויכתבון מלי מי יתן בספר ויחקו
    kjvRefs:
    - Job 19:23
    kjvOsis:
    - Job.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.24
    scripture: tanakh
    name: Tanakh Job 19:24
    ref: Job 19:24
    book: Job
    section: ketuvim
    chapter: 19
    verse: 24
    ordinal: 19036
    text: That with an iron pen and lead They were graven in the rock for ever!
    translation: JPS 1917
    original: בְּעֵט־בַּרְזֶל וְעֹפָרֶת לָעַד בַּצּוּר יֵחָצְבוּן׃
    hebrewPlain: בעט ברזל ועפרת לעד בצור יחצבון
    kjvRefs:
    - Job 19:24
    kjvOsis:
    - Job.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.25
    scripture: tanakh
    name: Tanakh Job 19:25
    ref: Job 19:25
    book: Job
    section: ketuvim
    chapter: 19
    verse: 25
    ordinal: 19037
    text: But as for me, I know that my Redeemer liveth, And that He will witness at the last upon the dust;
    translation: JPS 1917
    original: וַאֲנִי יָדַעְתִּי גֹּאֲלִי חָי וְאַחֲרוֹן עַל־עָפָר יָקוּם׃
    hebrewPlain: ואני ידעתי גאלי חי ואחרון על עפר יקום
    kjvRefs:
    - Job 19:25
    kjvOsis:
    - Job.19.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.26
    scripture: tanakh
    name: Tanakh Job 19:26
    ref: Job 19:26
    book: Job
    section: ketuvim
    chapter: 19
    verse: 26
    ordinal: 19038
    text: And when after my skin this is destroyed, Then without my flesh shall I see God;
    translation: JPS 1917
    original: וְאַחַר עוֹרִי נִקְּפוּ־זֹאת וּמִבְּשָׂרִי אֶחֱזֶה אֱלוֹהַּ׃
    hebrewPlain: ואחר עורי נקפו זאת ומבשרי אחזה אלוה
    kjvRefs:
    - Job 19:26
    kjvOsis:
    - Job.19.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.27
    scripture: tanakh
    name: Tanakh Job 19:27
    ref: Job 19:27
    book: Job
    section: ketuvim
    chapter: 19
    verse: 27
    ordinal: 19039
    text: Whom I, even I, shall see for myself, And mine eyes shall behold, and not another’s. My reins are consumed within me.
    translation: JPS 1917
    original: אֲשֶׁר אֲנִי אֶחֱזֶה־לִּי וְעֵינַי רָאוּ וְלֹא־זָר כָּלוּ כִלְיֹתַי בְּחֵקִי׃
    hebrewPlain: אשר אני אחזה לי ועיני ראו ולא זר כלו כליתי בחקי
    kjvRefs:
    - Job 19:27
    kjvOsis:
    - Job.19.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.28
    scripture: tanakh
    name: Tanakh Job 19:28
    ref: Job 19:28
    book: Job
    section: ketuvim
    chapter: 19
    verse: 28
    ordinal: 19040
    text: 'If ye say: ‘How we will persecute him! ’ Seeing that the root of the matter is found in me;'
    translation: JPS 1917
    original: כִּי תֹאמְרוּ מַה־נִּרְדָּף־לוֹ וְשֹׁרֶשׁ דָּבָר נִמְצָא־בִי׃
    hebrewPlain: כי תאמרו מה נרדף לו ושרש דבר נמצא בי
    kjvRefs:
    - Job 19:28
    kjvOsis:
    - Job.19.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.19.29
    scripture: tanakh
    name: Tanakh Job 19:29
    ref: Job 19:29
    book: Job
    section: ketuvim
    chapter: 19
    verse: 29
    ordinal: 19041
    text: Be ye afraid of the sword; For wrath bringeth the punishments of the sword, That ye may know there is a judgment.
    translation: JPS 1917
    original: גּוּרוּ לָכֶם מִפְּנֵי־חֶרֶב כִּי־חֵמָה עֲוֺנוֹת חָרֶב לְמַעַן תֵּדְעוּן שדין [שַׁדּוּן׃]
    hebrewPlain: גורו לכם מפני חרב כי חמה עונות חרב למען תדעון שדין [שדון]
    kjvRefs:
    - Job 19:29
    kjvOsis:
    - Job.19.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.19
- type: TanakhVerse
  data:
    osis: Job.20.1
    scripture: tanakh
    name: Tanakh Job 20:1
    ref: Job 20:1
    book: Job
    section: ketuvim
    chapter: 20
    verse: 1
    ordinal: 19042
    text: 'Then answered Zophar the Naamathite, and said:'
    translation: JPS 1917
    original: וַיַּעַן צֹפַר הַנַּעֲמָתִי וַיֹּאמַר׃
    hebrewPlain: ויען צפר הנעמתי ויאמר
    kjvRefs:
    - Job 20:1
    kjvOsis:
    - Job.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.2
    scripture: tanakh
    name: Tanakh Job 20:2
    ref: Job 20:2
    book: Job
    section: ketuvim
    chapter: 20
    verse: 2
    ordinal: 19043
    text: Therefore do my thoughts give answer to me, Even by reason of mine agitation that is in me.
    translation: JPS 1917
    original: לָכֵן שְׂעִפַּי יְשִׁיבוּנִי וּבַעֲבוּר חוּשִׁי בִי׃
    hebrewPlain: לכן שעפי ישיבוני ובעבור חושי בי
    kjvRefs:
    - Job 20:2
    kjvOsis:
    - Job.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.3
    scripture: tanakh
    name: Tanakh Job 20:3
    ref: Job 20:3
    book: Job
    section: ketuvim
    chapter: 20
    verse: 3
    ordinal: 19044
    text: I have heard the reproof which putteth me to shame, But out of my understanding my spirit answereth me.
    translation: JPS 1917
    original: מוּסַר כְּלִמָּתִי אֶשְׁמָע וְרוּחַ מִבִּינָתִי יַעֲנֵנִי׃
    hebrewPlain: מוסר כלמתי אשמע ורוח מבינתי יענני
    kjvRefs:
    - Job 20:3
    kjvOsis:
    - Job.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.4
    scripture: tanakh
    name: Tanakh Job 20:4
    ref: Job 20:4
    book: Job
    section: ketuvim
    chapter: 20
    verse: 4
    ordinal: 19045
    text: Knowest thou not this of old time, Since man was placed upon earth,
    translation: JPS 1917
    original: הֲזֹאת יָדַעְתָּ מִנִּי־עַד מִנִּי שִׂים אָדָם עֲלֵי־אָרֶץ׃
    hebrewPlain: הזאת ידעת מני עד מני שים אדם עלי ארץ
    kjvRefs:
    - Job 20:4
    kjvOsis:
    - Job.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.5
    scripture: tanakh
    name: Tanakh Job 20:5
    ref: Job 20:5
    book: Job
    section: ketuvim
    chapter: 20
    verse: 5
    ordinal: 19046
    text: That the triumphing of the wicked is short, And the joy of the godless but for a moment?
    translation: JPS 1917
    original: כִּי רִנְנַת רְשָׁעִים מִקָּרוֹב וְשִׂמְחַת חָנֵף עֲדֵי־רָגַע׃
    hebrewPlain: כי רננת רשעים מקרוב ושמחת חנף עדי רגע
    kjvRefs:
    - Job 20:5
    kjvOsis:
    - Job.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.6
    scripture: tanakh
    name: Tanakh Job 20:6
    ref: Job 20:6
    book: Job
    section: ketuvim
    chapter: 20
    verse: 6
    ordinal: 19047
    text: Though his excellency mount up to the heavens, And his head reach unto the clouds;
    translation: JPS 1917
    original: אִם־יַעֲלֶה לַשָּׁמַיִם שִׂיאוֹ וְרֹאשׁוֹ לָעָב יַגִּיעַ׃
    hebrewPlain: אם יעלה לשמים שיאו וראשו לעב יגיע
    kjvRefs:
    - Job 20:6
    kjvOsis:
    - Job.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.7
    scripture: tanakh
    name: Tanakh Job 20:7
    ref: Job 20:7
    book: Job
    section: ketuvim
    chapter: 20
    verse: 7
    ordinal: 19048
    text: 'Yet he shall perish for ever like his own dung; They that have seen him shall say: ‘Where is he?’'
    translation: JPS 1917
    original: כְּגֶלֲלוֹ לָנֶצַח יֹאבֵד רֹאָיו יֹאמְרוּ אַיּוֹ׃
    hebrewPlain: כגללו לנצח יאבד ראיו יאמרו איו
    kjvRefs:
    - Job 20:7
    kjvOsis:
    - Job.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.8
    scripture: tanakh
    name: Tanakh Job 20:8
    ref: Job 20:8
    book: Job
    section: ketuvim
    chapter: 20
    verse: 8
    ordinal: 19049
    text: He shall fly away as a dream, and shall not be found; Yea, he shall be chased away as a vision of the night.
    translation: JPS 1917
    original: כַּחֲלוֹם יָעוּף וְלֹא יִמְצָאוּהוּ וְיֻדַּד כְּחֶזְיוֹן לָיְלָה׃
    hebrewPlain: כחלום יעוף ולא ימצאוהו וידד כחזיון לילה
    kjvRefs:
    - Job 20:8
    kjvOsis:
    - Job.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.9
    scripture: tanakh
    name: Tanakh Job 20:9
    ref: Job 20:9
    book: Job
    section: ketuvim
    chapter: 20
    verse: 9
    ordinal: 19050
    text: The eye which saw him shall see him no more; Neither shall his place any more behold him.
    translation: JPS 1917
    original: עַיִן שְׁזָפַתּוּ וְלֹא תוֹסִיף וְלֹא־עוֹד תְּשׁוּרֶנּוּ מְקוֹמוֹ׃
    hebrewPlain: עין שזפתו ולא תוסיף ולא עוד תשורנו מקומו
    kjvRefs:
    - Job 20:9
    kjvOsis:
    - Job.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.10
    scripture: tanakh
    name: Tanakh Job 20:10
    ref: Job 20:10
    book: Job
    section: ketuvim
    chapter: 20
    verse: 10
    ordinal: 19051
    text: His children shall appease the poor, And his hands shall restore his wealth.
    translation: JPS 1917
    original: בָּנָיו יְרַצּוּ דַלִּים וְיָדָיו תָּשֵׁבְנָה אוֹנוֹ׃
    hebrewPlain: בניו ירצו דלים וידיו תשבנה אונו
    kjvRefs:
    - Job 20:10
    kjvOsis:
    - Job.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.11
    scripture: tanakh
    name: Tanakh Job 20:11
    ref: Job 20:11
    book: Job
    section: ketuvim
    chapter: 20
    verse: 11
    ordinal: 19052
    text: His bones are full of his youth, But it shall lie down with him in the dust.
    translation: JPS 1917
    original: עַצְמוֹתָיו מָלְאוּ עלומו [עֲלוּמָיו] וְעִמּוֹ עַל־עָפָר תִּשְׁכָּב׃
    hebrewPlain: עצמותיו מלאו עלומו [עלומיו] ועמו על עפר תשכב
    kjvRefs:
    - Job 20:11
    kjvOsis:
    - Job.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.12
    scripture: tanakh
    name: Tanakh Job 20:12
    ref: Job 20:12
    book: Job
    section: ketuvim
    chapter: 20
    verse: 12
    ordinal: 19053
    text: Though wickedness be sweet in his mouth, Though he hide it under his tongue;
    translation: JPS 1917
    original: אִם־תַּמְתִּיק בְּפִיו רָעָה יַכְחִידֶנָּה תַּחַת לְשׁוֹנוֹ׃
    hebrewPlain: אם תמתיק בפיו רעה יכחידנה תחת לשונו
    kjvRefs:
    - Job 20:12
    kjvOsis:
    - Job.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.13
    scripture: tanakh
    name: Tanakh Job 20:13
    ref: Job 20:13
    book: Job
    section: ketuvim
    chapter: 20
    verse: 13
    ordinal: 19054
    text: Though he spare it, and will not let it go, But keep it still within his mouth;
    translation: JPS 1917
    original: יַחְמֹל עָלֶיהָ וְלֹא יַעַזְבֶנָּה וְיִמְנָעֶנָּה בְּתוֹךְ חִכּוֹ׃
    hebrewPlain: יחמל עליה ולא יעזבנה וימנענה בתוך חכו
    kjvRefs:
    - Job 20:13
    kjvOsis:
    - Job.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.14
    scripture: tanakh
    name: Tanakh Job 20:14
    ref: Job 20:14
    book: Job
    section: ketuvim
    chapter: 20
    verse: 14
    ordinal: 19055
    text: Yet his food in his bowels is turned, It is the gall of asps within him.
    translation: JPS 1917
    original: לַחְמוֹ בְּמֵעָיו נֶהְפָּךְ מְרוֹרַת פְּתָנִים בְּקִרְבּוֹ׃
    hebrewPlain: לחמו במעיו נהפך מרורת פתנים בקרבו
    kjvRefs:
    - Job 20:14
    kjvOsis:
    - Job.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.15
    scripture: tanakh
    name: Tanakh Job 20:15
    ref: Job 20:15
    book: Job
    section: ketuvim
    chapter: 20
    verse: 15
    ordinal: 19056
    text: He hath swallowed down riches, and he shall vomit them up again; God shall cast them out of his belly.
    translation: JPS 1917
    original: חַיִל בָּלַע וַיְקִאֶנּוּ מִבִּטְנוֹ יוֹרִשֶׁנּוּ אֵל׃
    hebrewPlain: חיל בלע ויקאנו מבטנו יורשנו אל
    kjvRefs:
    - Job 20:15
    kjvOsis:
    - Job.20.15
  relations:
  - predicate: IN
    to:
