  data:
    osis: Job.13.2
    scripture: tanakh
    name: Tanakh Job 13:2
    ref: Job 13:2
    book: Job
    section: ketuvim
    chapter: 13
    verse: 2
    ordinal: 18870
    text: What ye know, do I know also; I am not inferior unto you.
    translation: JPS 1917
    original: כְּדַעְתְּכֶם יָדַעְתִּי גַם־אָנִי לֹא־נֹפֵל אָנֹכִי מִכֶּם׃
    hebrewPlain: כדעתכם ידעתי גם אני לא נפל אנכי מכם
    kjvRefs:
    - Job 13:2
    kjvOsis:
    - Job.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.3
    scripture: tanakh
    name: Tanakh Job 13:3
    ref: Job 13:3
    book: Job
    section: ketuvim
    chapter: 13
    verse: 3
    ordinal: 18871
    text: Notwithstanding I would speak to the Almighty, And I desire to reason with God.
    translation: JPS 1917
    original: אוּלָם אֲנִי אֶל־שַׁדַּי אֲדַבֵּר וְהוֹכֵחַ אֶל־אֵל אֶחְפָּץ׃
    hebrewPlain: אולם אני אל שדי אדבר והוכח אל אל אחפץ
    kjvRefs:
    - Job 13:3
    kjvOsis:
    - Job.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.4
    scripture: tanakh
    name: Tanakh Job 13:4
    ref: Job 13:4
    book: Job
    section: ketuvim
    chapter: 13
    verse: 4
    ordinal: 18872
    text: But ye are plasterers of lies, Ye are all physicians of no value.
    translation: JPS 1917
    original: וְאוּלָם אַתֶּם טֹפְלֵי־שָׁקֶר רֹפְאֵי אֱלִל כֻּלְּכֶם׃
    hebrewPlain: ואולם אתם טפלי שקר רפאי אלל כלכם
    kjvRefs:
    - Job 13:4
    kjvOsis:
    - Job.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.5
    scripture: tanakh
    name: Tanakh Job 13:5
    ref: Job 13:5
    book: Job
    section: ketuvim
    chapter: 13
    verse: 5
    ordinal: 18873
    text: Oh that ye would altogether hold your peace! And it would be your wisdom.
    translation: JPS 1917
    original: מִי־יִתֵּן הַחֲרֵשׁ תַּחֲרִישׁוּן וּתְהִי לָכֶם לְחָכְמָה׃
    hebrewPlain: מי יתן החרש תחרישון ותהי לכם לחכמה
    kjvRefs:
    - Job 13:5
    kjvOsis:
    - Job.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
