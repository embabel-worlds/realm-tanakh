    scripture: tanakh
    name: Tanakh Job 40:20
    ref: Job 40:20
    book: Job
    section: ketuvim
    chapter: 40
    verse: 20
    ordinal: 19599
    text: Surely the mountains bring him forth food, And all the beasts of the field play there.
    translation: JPS 1917
    original: כִּי־בוּל הָרִים יִשְׂאוּ־לוֹ וְכָל־חַיַּת הַשָּׂדֶה יְשַׂחֲקוּ־שָׁם׃
    hebrewPlain: כי בול הרים ישאו לו וכל חית השדה ישחקו שם
    kjvRefs:
