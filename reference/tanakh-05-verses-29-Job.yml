    ordinal: 19651
    text: And he called the name of the first, Jemimah; and the name of the second, Keziah; and the name of the third, Keren-happuch.
    translation: JPS 1917
    original: וַיִּקְרָא שֵׁם־הָאַחַת יְמִימָה וְשֵׁם הַשֵּׁנִית קְצִיעָה וְשֵׁם הַשְּׁלִישִׁית קֶרֶן הַפּוּךְ׃
    hebrewPlain: ויקרא שם האחת ימימה ושם השנית קציעה ושם השלישית קרן הפוך
