    text: 'While he was yet speaking, there came also another, and said: ‘Thy sons and thy daughters were eating and drinking wine in their eldest brother’s house;'
    translation: JPS 1917
    original: עַד זֶה מְדַבֵּר וְזֶה בָּא וַיֹּאמַר בָּנֶיךָ וּבְנוֹתֶיךָ אֹכְלִים וְשֹׁתִים יַיִן בְּבֵית אֲחִיהֶם הַבְּכוֹר׃
    hebrewPlain: עד זה מדבר וזה בא ויאמר בניך ובנותיך אכלים ושתים יין בבית אחיהם הבכור
    kjvRefs:
    - Job 1:18
    kjvOsis:
    - Job.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.19
    scripture: tanakh
    name: Tanakh Job 1:19
    ref: Job 1:19
    book: Job
    section: ketuvim
    chapter: 1
    verse: 19
    ordinal: 18603
    text: And, behold, there came a great wind from across the wilderness, and smote the four corners of the house, and it fell upon the young people, and they are dead; and I only am escaped alone to tell thee.’
    translation: JPS 1917
    original: וְהִנֵּה רוּחַ גְּדוֹלָה בָּאָה מֵעֵבֶר הַמִּדְבָּר וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת וַיִּפֹּל עַל־הַנְּעָרִים וַיָּמוּתוּ וָאִמָּלְטָה רַק־אֲנִי לְבַדִּי לְהַגִּיד לָךְ׃
    hebrewPlain: והנה רוח גדולה באה מעבר המדבר ויגע בארבע פנות הבית ויפל על הנערים וימותו ואמלטה רק אני לבדי להגיד לך
    kjvRefs:
    - Job 1:19
    kjvOsis:
    - Job.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.20
    scripture: tanakh
    name: Tanakh Job 1:20
    ref: Job 1:20
    book: Job
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 18604
    text: Then Job arose, and rent his mantle, and shaved his head, and fell down upon the ground, and worshipped;
    translation: JPS 1917
    original: וַיָּקָם אִיּוֹב וַיִּקְרַע אֶת־מְעִלוֹ וַיָּגָז אֶת־רֹאשׁוֹ וַיִּפֹּל אַרְצָה וַיִּשְׁתָּחוּ׃
    hebrewPlain: ויקם איוב ויקרע את מעלו ויגז את ראשו ויפל ארצה וישתחו
    kjvRefs:
    - Job 1:20
    kjvOsis:
    - Job.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.21
    scripture: tanakh
    name: Tanakh Job 1:21
    ref: Job 1:21
    book: Job
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 18605
    text: And he said; Naked came I out of my mother’s womb, And naked shall I return thither; The LORD gave, and the LORD hath taken away; Blessed be the name of the LORD.
    translation: JPS 1917
    original: וַיֹּאמֶר עָרֹם יצתי [יָצָאתִי] מִבֶּטֶן אִמִּי וְעָרֹם אָשׁוּב שָׁמָה יְהוָה נָתַן וַיהוָה לָקָח יְהִי שֵׁם יְהוָה מְבֹרָךְ׃
    hebrewPlain: ויאמר ערם יצתי [יצאתי] מבטן אמי וערם אשוב שמה יהוה נתן ויהוה לקח יהי שם יהוה מברך
    kjvRefs:
    - Job 1:21
    kjvOsis:
    - Job.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.22
    scripture: tanakh
    name: Tanakh Job 1:22
    ref: Job 1:22
    book: Job
    section: ketuvim
    chapter: 1
    verse: 22
    ordinal: 18606
    text: For all this Job sinned not, nor ascribed aught unseemly to God.
    translation: JPS 1917
    original: בְּכָל־זֹאת לֹא־חָטָא אִיּוֹב וְלֹא־נָתַן תִּפְלָה לֵאלֹהִים׃
    hebrewPlain: בכל זאת לא חטא איוב ולא נתן תפלה לאלהים
    kjvRefs:
    - Job 1:22
    kjvOsis:
    - Job.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.2.1
    scripture: tanakh
    name: Tanakh Job 2:1
    ref: Job 2:1
    book: Job
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 18607
    text: Again it fell upon a day, that the sons of God came to present themselves before the LORD, and Satan came also among them to present himself before the LORD.
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיָּבֹאוּ בְּנֵי הָאֱלֹהִים לְהִתְיַצֵּב עַל־יְהוָה וַיָּבוֹא גַם־הַשָּׂטָן בְּתֹכָם לְהִתְיַצֵּב עַל־יְהוָה׃
    hebrewPlain: ויהי היום ויבאו בני האלהים להתיצב על יהוה ויבוא גם השטן בתכם להתיצב על יהוה
    kjvRefs:
    - Job 2:1
    kjvOsis:
    - Job.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.2
    scripture: tanakh
    name: Tanakh Job 2:2
    ref: Job 2:2
    book: Job
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 18608
    text: 'And the LORD said unto Satan: ‘From whence comest thou?’ And Satan answered the LORD, and said: ‘From going to and fro in the earth, and from walking up and down in it.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן אֵי מִזֶּה תָּבֹא וַיַּעַן הַשָּׂטָן אֶת־יְהוָה וַיֹּאמַר מִשֻּׁט בָּאָרֶץ וּמֵהִתְהַלֵּךְ בָּהּ׃
    hebrewPlain: ויאמר יהוה אל השטן אי מזה תבא ויען השטן את יהוה ויאמר משט בארץ ומהתהלך בה
    kjvRefs:
    - Job 2:2
    kjvOsis:
    - Job.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.3
    scripture: tanakh
    name: Tanakh Job 2:3
    ref: Job 2:3
    book: Job
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 18609
    text: 'And the LORD said unto Satan: ‘Hast thou considered my servant Job, that there is none like him in the earth, a whole-hearted and an upright man, one that feareth God, and shunneth evil? and he still holdeth fast his integrity, although thou didst move Me against him, to destroy him without cause.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן הֲשַׂמְתָּ לִבְּךָ אֶל־עַבְדִּי אִיּוֹב כִּי אֵין כָּמֹהוּ בָּאָרֶץ אִישׁ תָּם וְיָשָׁר יְרֵא אֱלֹהִים וְסָר מֵרָע וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ וַתְּסִיתֵנִי בוֹ לְבַלְּעוֹ חִנָּם׃
    hebrewPlain: ויאמר יהוה אל השטן השמת לבך אל עבדי איוב כי אין כמהו בארץ איש תם וישר ירא אלהים וסר מרע ועדנו מחזיק בתמתו ותסיתני בו לבלעו חנם
    kjvRefs:
    - Job 2:3
    kjvOsis:
    - Job.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.4
    scripture: tanakh
    name: Tanakh Job 2:4
    ref: Job 2:4
    book: Job
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 18610
    text: 'And Satan answered the LORD, and said: ‘Skin for skin, yea, all that a man hath will he give for his life.'
    translation: JPS 1917
    original: וַיַּעַן הַשָּׂטָן אֶת־יְהוָה וַיֹּאמַר עוֹר בְּעַד־עוֹר וְכֹל אֲשֶׁר לָאִישׁ יִתֵּן בְּעַד נַפְשׁוֹ׃
    hebrewPlain: ויען השטן את יהוה ויאמר עור בעד עור וכל אשר לאיש יתן בעד נפשו
    kjvRefs:
    - Job 2:4
    kjvOsis:
    - Job.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.5
    scripture: tanakh
    name: Tanakh Job 2:5
    ref: Job 2:5
    book: Job
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 18611
    text: But put forth Thy hand now, and touch his bone and his flesh, surely he will blaspheme Thee to Thy face.’
    translation: JPS 1917
    original: אוּלָם שְׁלַח־נָא יָדְךָ וְגַע אֶל־עַצְמוֹ וְאֶל־בְּשָׂרוֹ אִם־לֹא אֶל־פָּנֶיךָ יְבָרֲכֶךָּ׃
    hebrewPlain: אולם שלח נא ידך וגע אל עצמו ואל בשרו אם לא אל פניך יברכך
    kjvRefs:
    - Job 2:5
    kjvOsis:
    - Job.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.6
    scripture: tanakh
    name: Tanakh Job 2:6
    ref: Job 2:6
    book: Job
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 18612
    text: 'And the LORD said unto Satan: ‘Behold, he is in thy hand; only spare his life.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן הִנּוֹ בְיָדֶךָ אַךְ אֶת־נַפְשׁוֹ שְׁמֹר׃
    hebrewPlain: ויאמר יהוה אל השטן הנו בידך אך את נפשו שמר
    kjvRefs:
    - Job 2:6
    kjvOsis:
    - Job.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.7
    scripture: tanakh
    name: Tanakh Job 2:7
    ref: Job 2:7
    book: Job
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 18613
    text: So Satan went forth from the presence of the LORD, and smote Job with sore boils from the sole of his foot even unto his crown.
    translation: JPS 1917
    original: וַיֵּצֵא הַשָּׂטָן מֵאֵת פְּנֵי יְהוָה וַיַּךְ אֶת־אִיּוֹב בִּשְׁחִין רָע מִכַּף רַגְלוֹ עד [וְעַד] קָדְקֳדוֹ׃
    hebrewPlain: ויצא השטן מאת פני יהוה ויך את איוב בשחין רע מכף רגלו עד [ועד] קדקדו
    kjvRefs:
    - Job 2:7
    kjvOsis:
    - Job.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.8
    scripture: tanakh
    name: Tanakh Job 2:8
    ref: Job 2:8
    book: Job
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 18614
    text: And he took him a potsherd to scrape himself therewith; and he sat among the ashes.
    translation: JPS 1917
    original: וַיִּקַּח־לוֹ חֶרֶשׂ לְהִתְגָּרֵד בּוֹ וְהוּא יֹשֵׁב בְּתוֹךְ־הָאֵפֶר׃
    hebrewPlain: ויקח לו חרש להתגרד בו והוא ישב בתוך האפר
    kjvRefs:
    - Job 2:8
    kjvOsis:
    - Job.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.9
    scripture: tanakh
    name: Tanakh Job 2:9
    ref: Job 2:9
    book: Job
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 18615
    text: 'Then said his wife unto him: ‘Dost thou still hold fast thine integrity? blaspheme God, and die.’'
    translation: JPS 1917
    original: וַתֹּאמֶר לוֹ אִשְׁתּוֹ עֹדְךָ מַחֲזִיק בְּתֻמָּתֶךָ בָּרֵךְ אֱלֹהִים וָמֻת׃
    hebrewPlain: ותאמר לו אשתו עדך מחזיק בתמתך ברך אלהים ומת
    kjvRefs:
    - Job 2:9
    kjvOsis:
    - Job.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.10
    scripture: tanakh
    name: Tanakh Job 2:10
    ref: Job 2:10
    book: Job
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 18616
    text: 'But he said unto her: ‘Thou speakest as one of the impious women speaketh. What? shall we receive good at the hand of God, and shall we not receive evil?’ For all this did not Job sin with his lips.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים וְאֶת־הָרָע לֹא נְקַבֵּל בְּכָל־זֹאת לֹא־חָטָא אִיּוֹב בִּשְׂפָתָיו׃
    hebrewPlain: ויאמר אליה כדבר אחת הנבלות תדברי גם את הטוב נקבל מאת האלהים ואת הרע לא נקבל בכל זאת לא חטא איוב בשפתיו
    kjvRefs:
    - Job 2:10
    kjvOsis:
    - Job.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.11
    scripture: tanakh
    name: Tanakh Job 2:11
    ref: Job 2:11
    book: Job
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 18617
    text: Now when Job’s three friends heard of all this evil that was come upon him, they came every one from his own place, Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite; and they made an appointment together to come to bemoan him and to comfort him.
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ שְׁלֹשֶׁת רֵעֵי אִיּוֹב אֵת כָּל־הָרָעָה הַזֹּאת הַבָּאָה עָלָיו וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ אֱלִיפַז הַתֵּימָנִי וּבִלְדַּד הַשּׁוּחִי וְצוֹפַר הַנַּעֲמָתִי וַיִּוָּעֲדוּ יַחְדָּו לָבוֹא לָנוּד־לוֹ וּלְנַחֲמוֹ׃
    hebrewPlain: וישמעו שלשת רעי איוב את כל הרעה הזאת הבאה עליו ויבאו איש ממקמו אליפז התימני ובלדד השוחי וצופר הנעמתי ויועדו יחדו לבוא לנוד לו ולנחמו
    kjvRefs:
    - Job 2:11
    kjvOsis:
    - Job.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.12
    scripture: tanakh
    name: Tanakh Job 2:12
    ref: Job 2:12
    book: Job
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 18618
    text: And when they lifted up their eyes afar off, and knew him not, they lifted up their voice, and wept; and they rent every one his mantle, and threw dust upon their heads toward heaven.
    translation: JPS 1917
    original: וַיִּשְׂאוּ אֶת־עֵינֵיהֶם מֵרָחוֹק וְלֹא הִכִּירֻהוּ וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ וַיִּקְרְעוּ אִישׁ מְעִלוֹ וַיִּזְרְקוּ עָפָר עַל־רָאשֵׁיהֶם הַשָּׁמָיְמָה׃
    hebrewPlain: וישאו את עיניהם מרחוק ולא הכירהו וישאו קולם ויבכו ויקרעו איש מעלו ויזרקו עפר על ראשיהם השמימה
    kjvRefs:
    - Job 2:12
    kjvOsis:
    - Job.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.2.13
    scripture: tanakh
    name: Tanakh Job 2:13
    ref: Job 2:13
    book: Job
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 18619
    text: So they sat down with him upon the ground seven days and seven nights, and none spoke a word unto him; for they saw that his grief was very great.
    translation: JPS 1917
    original: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת וְאֵין־דֹּבֵר אֵלָיו דָּבָר כִּי רָאוּ כִּי־גָדַל הַכְּאֵב מְאֹד׃
    hebrewPlain: וישבו אתו לארץ שבעת ימים ושבעת לילות ואין דבר אליו דבר כי ראו כי גדל הכאב מאד
    kjvRefs:
    - Job 2:13
    kjvOsis:
    - Job.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.2
- type: TanakhVerse
  data:
    osis: Job.3.1
    scripture: tanakh
    name: Tanakh Job 3:1
    ref: Job 3:1
    book: Job
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 18620
    text: After this opened Job his mouth, and cursed his day.
    translation: JPS 1917
    original: אַחֲרֵי־כֵן פָּתַח אִיּוֹב אֶת־פִּיהוּ וַיְקַלֵּל אֶת־יוֹמוֹ׃
    hebrewPlain: אחרי כן פתח איוב את פיהו ויקלל את יומו
    kjvRefs:
    - Job 3:1
    kjvOsis:
    - Job.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.2
    scripture: tanakh
    name: Tanakh Job 3:2
    ref: Job 3:2
    book: Job
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 18621
    text: 'And Job spoke, and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 3:2
    kjvOsis:
    - Job.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.3
    scripture: tanakh
    name: Tanakh Job 3:3
    ref: Job 3:3
    book: Job
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 18622
    text: 'Let the day perish wherein I was born, And the night wherein it was said: ‘A man-child is brought forth.’'
    translation: JPS 1917
    original: יֹאבַד יוֹם אִוָּלֶד בּוֹ וְהַלַּיְלָה אָמַר הֹרָה גָבֶר׃
    hebrewPlain: יאבד יום אולד בו והלילה אמר הרה גבר
    kjvRefs:
    - Job 3:3
    kjvOsis:
    - Job.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.4
    scripture: tanakh
    name: Tanakh Job 3:4
    ref: Job 3:4
    book: Job
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 18623
    text: Let that day be darkness; Let not God inquire after it from above, Neither let the light shine upon it.
    translation: JPS 1917
    original: הַיּוֹם הַהוּא יְהִי חֹשֶׁךְ אַל־יִדְרְשֵׁהוּ אֱלוֹהַּ מִמָּעַל וְאַל־תּוֹפַע עָלָיו נְהָרָה׃
    hebrewPlain: היום ההוא יהי חשך אל ידרשהו אלוה ממעל ואל תופע עליו נהרה
    kjvRefs:
    - Job 3:4
    kjvOsis:
    - Job.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.5
    scripture: tanakh
    name: Tanakh Job 3:5
    ref: Job 3:5
    book: Job
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 18624
    text: Let darkness and the shadow of death claim it for their own; Let a cloud dwell upon it; Let all that maketh black the day terrify it.
    translation: JPS 1917
    original: יִגְאָלֻהוּ חֹשֶׁךְ וְצַלְמָוֶת תִּשְׁכָּן־עָלָיו עֲנָנָה יְבַעֲתֻהוּ כִּמְרִירֵי יוֹם׃
    hebrewPlain: יגאלהו חשך וצלמות תשכן עליו עננה יבעתהו כמרירי יום
    kjvRefs:
    - Job 3:5
    kjvOsis:
    - Job.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.6
    scripture: tanakh
    name: Tanakh Job 3:6
    ref: Job 3:6
    book: Job
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 18625
    text: As for that night, let thick darkness seize upon it; Let it not rejoice among the days of the year; Let it not come into the number of the months.
    translation: JPS 1917
    original: הַלַּיְלָה הַהוּא יִקָּחֵהוּ אֹפֶל אַל־יִחַדְּ בִּימֵי שָׁנָה בְּמִסְפַּר יְרָחִים אַל־יָבֹא׃
    hebrewPlain: הלילה ההוא יקחהו אפל אל יחד בימי שנה במספר ירחים אל יבא
    kjvRefs:
    - Job 3:6
    kjvOsis:
    - Job.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.7
    scripture: tanakh
    name: Tanakh Job 3:7
    ref: Job 3:7
    book: Job
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 18626
    text: Lo, let that night be desolate; Let no joyful voice come therein.
    translation: JPS 1917
    original: הִנֵּה הַלַּיְלָה הַהוּא יְהִי גַלְמוּד אַל־תָּבֹא רְנָנָה בוֹ׃
    hebrewPlain: הנה הלילה ההוא יהי גלמוד אל תבא רננה בו
    kjvRefs:
    - Job 3:7
    kjvOsis:
    - Job.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.8
    scripture: tanakh
    name: Tanakh Job 3:8
    ref: Job 3:8
    book: Job
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 18627
    text: Let them curse it that curse the day, Who are ready to rouse up leviathan.
    translation: JPS 1917
    original: יִקְּבֻהוּ אֹרְרֵי־יוֹם הָעֲתִידִים עֹרֵר לִוְיָתָן׃
    hebrewPlain: יקבהו אררי יום העתידים ערר לויתן
    kjvRefs:
    - Job 3:8
    kjvOsis:
    - Job.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.9
    scripture: tanakh
    name: Tanakh Job 3:9
    ref: Job 3:9
    book: Job
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 18628
    text: Let the stars of the twilight thereof be dark; Let it look for light, but have none; Neither let it behold the eyelids of the morning;
    translation: JPS 1917
    original: יֶחְשְׁכוּ כּוֹכְבֵי נִשְׁפּוֹ יְקַו־לְאוֹר וָאַיִן וְאַל־יִרְאֶה בְּעַפְעַפֵּי־שָׁחַר׃
    hebrewPlain: יחשכו כוכבי נשפו יקו לאור ואין ואל יראה בעפעפי שחר
    kjvRefs:
    - Job 3:9
    kjvOsis:
    - Job.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.10
    scripture: tanakh
    name: Tanakh Job 3:10
    ref: Job 3:10
    book: Job
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 18629
    text: Because it shut not up the doors of my [mother’s] womb, Nor hid trouble from mine eyes.
    translation: JPS 1917
    original: כִּי לֹא סָגַר דַּלְתֵי בִטְנִי וַיַּסְתֵּר עָמָל מֵעֵינָי׃
    hebrewPlain: כי לא סגר דלתי בטני ויסתר עמל מעיני
    kjvRefs:
    - Job 3:10
    kjvOsis:
    - Job.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.11
    scripture: tanakh
    name: Tanakh Job 3:11
    ref: Job 3:11
    book: Job
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 18630
    text: Why died I not from the womb? Why did I not perish at birth?
    translation: JPS 1917
    original: לָמָּה לֹּא מֵרֶחֶם אָמוּת מִבֶּטֶן יָצָאתִי וְאֶגְוָע׃
    hebrewPlain: למה לא מרחם אמות מבטן יצאתי ואגוע
    kjvRefs:
    - Job 3:11
    kjvOsis:
    - Job.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.12
    scripture: tanakh
    name: Tanakh Job 3:12
    ref: Job 3:12
    book: Job
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 18631
    text: Why did the knees receive me? And wherefore the breasts, that I should suck?
    translation: JPS 1917
    original: מַדּוּעַ קִדְּמוּנִי בִרְכָּיִם וּמַה־שָּׁדַיִם כִּי אִינָק׃
    hebrewPlain: מדוע קדמוני ברכים ומה שדים כי אינק
    kjvRefs:
    - Job 3:12
    kjvOsis:
    - Job.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.13
    scripture: tanakh
    name: Tanakh Job 3:13
    ref: Job 3:13
    book: Job
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 18632
    text: For now should I have lain still and been quiet; I should have slept; then had I been at rest—
    translation: JPS 1917
    original: כִּי־עַתָּה שָׁכַבְתִּי וְאֶשְׁקוֹט יָשַׁנְתִּי אָז יָנוּחַ לִי׃
    hebrewPlain: כי עתה שכבתי ואשקוט ישנתי אז ינוח לי
    kjvRefs:
    - Job 3:13
    kjvOsis:
    - Job.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.14
    scripture: tanakh
    name: Tanakh Job 3:14
    ref: Job 3:14
    book: Job
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 18633
    text: With kings and counsellors of the earth, Who built up waste places for themselves;
    translation: JPS 1917
    original: עִם־מְלָכִים וְיֹעֲצֵי אָרֶץ הַבֹּנִים חֳרָבוֹת לָמוֹ׃
    hebrewPlain: עם מלכים ויעצי ארץ הבנים חרבות למו
    kjvRefs:
    - Job 3:14
    kjvOsis:
    - Job.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.15
    scripture: tanakh
    name: Tanakh Job 3:15
    ref: Job 3:15
    book: Job
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 18634
    text: Or with princes that had gold, Who filled their houses with silver;
    translation: JPS 1917
    original: אוֹ עִם־שָׂרִים זָהָב לָהֶם הַמְמַלְאִים בָּתֵּיהֶם כָּסֶף׃
    hebrewPlain: או עם שרים זהב להם הממלאים בתיהם כסף
    kjvRefs:
    - Job 3:15
    kjvOsis:
    - Job.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.16
    scripture: tanakh
    name: Tanakh Job 3:16
    ref: Job 3:16
    book: Job
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 18635
    text: Or as a hidden untimely birth I had not been; As infants that never saw light.
    translation: JPS 1917
    original: אוֹ כְנֵפֶל טָמוּן לֹא אֶהְיֶה כְּעֹלְלִים לֹא־רָאוּ אוֹר׃
    hebrewPlain: או כנפל טמון לא אהיה כעללים לא ראו אור
    kjvRefs:
    - Job 3:16
    kjvOsis:
    - Job.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.17
    scripture: tanakh
    name: Tanakh Job 3:17
    ref: Job 3:17
    book: Job
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 18636
    text: There the wicked cease from troubling; And there the weary are at rest.
    translation: JPS 1917
    original: שָׁם רְשָׁעִים חָדְלוּ רֹגֶז וְשָׁם יָנוּחוּ יְגִיעֵי כֹחַ׃
    hebrewPlain: שם רשעים חדלו רגז ושם ינוחו יגיעי כח
    kjvRefs:
    - Job 3:17
    kjvOsis:
    - Job.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.18
    scripture: tanakh
    name: Tanakh Job 3:18
    ref: Job 3:18
    book: Job
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 18637
    text: There the prisoners are at ease together; They hear not the voice of the taskmaster.
    translation: JPS 1917
    original: יַחַד אֲסִירִים שַׁאֲנָנוּ לֹא שָׁמְעוּ קוֹל נֹגֵשׂ׃
    hebrewPlain: יחד אסירים שאננו לא שמעו קול נגש
    kjvRefs:
    - Job 3:18
    kjvOsis:
    - Job.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.19
    scripture: tanakh
    name: Tanakh Job 3:19
    ref: Job 3:19
    book: Job
    section: ketuvim
    chapter: 3
    verse: 19
    ordinal: 18638
    text: The small and great are there alike; And the servant is free from his master.
    translation: JPS 1917
    original: קָטֹן וְגָדוֹל שָׁם הוּא וְעֶבֶד חָפְשִׁי מֵאֲדֹנָיו׃
    hebrewPlain: קטן וגדול שם הוא ועבד חפשי מאדניו
    kjvRefs:
    - Job 3:19
    kjvOsis:
    - Job.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.20
    scripture: tanakh
    name: Tanakh Job 3:20
    ref: Job 3:20
    book: Job
    section: ketuvim
    chapter: 3
    verse: 20
    ordinal: 18639
    text: Wherewith is light given to him that is in misery, And life unto the bitter in soul—
    translation: JPS 1917
    original: לָמָּה יִתֵּן לְעָמֵל אוֹר וְחַיִּים לְמָרֵי נָפֶשׁ׃
    hebrewPlain: למה יתן לעמל אור וחיים למרי נפש
    kjvRefs:
    - Job 3:20
    kjvOsis:
    - Job.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.21
    scripture: tanakh
    name: Tanakh Job 3:21
    ref: Job 3:21
    book: Job
    section: ketuvim
    chapter: 3
    verse: 21
    ordinal: 18640
    text: Who long for death, but it cometh not; And dig for it more than for hid treasures;
    translation: JPS 1917
    original: הַמְחַכִּים לַמָּוֶת וְאֵינֶנּוּ וַיַּחְפְּרֻהוּ מִמַּטְמוֹנִים׃
    hebrewPlain: המחכים למות ואיננו ויחפרהו ממטמונים
    kjvRefs:
    - Job 3:21
    kjvOsis:
    - Job.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.22
    scripture: tanakh
    name: Tanakh Job 3:22
    ref: Job 3:22
    book: Job
    section: ketuvim
    chapter: 3
    verse: 22
    ordinal: 18641
    text: Who rejoice unto exultation, And are glad, when they can find the grave?—
    translation: JPS 1917
    original: הַשְּׂמֵחִים אֱלֵי־גִיל יָשִׂישׂוּ כִּי יִמְצְאוּ־קָבֶר׃
    hebrewPlain: השמחים אלי גיל ישישו כי ימצאו קבר
    kjvRefs:
    - Job 3:22
    kjvOsis:
    - Job.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.23
    scripture: tanakh
    name: Tanakh Job 3:23
    ref: Job 3:23
    book: Job
    section: ketuvim
    chapter: 3
    verse: 23
    ordinal: 18642
    text: To a man whose way is hid, And whom God hath hedged in?
    translation: JPS 1917
    original: לְגֶבֶר אֲשֶׁר־דַּרְכּוֹ נִסְתָּרָה וַיָּסֶךְ אֱלוֹהַּ בַּעֲדוֹ׃
    hebrewPlain: לגבר אשר דרכו נסתרה ויסך אלוה בעדו
    kjvRefs:
    - Job 3:23
    kjvOsis:
    - Job.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.24
    scripture: tanakh
    name: Tanakh Job 3:24
    ref: Job 3:24
    book: Job
    section: ketuvim
    chapter: 3
    verse: 24
    ordinal: 18643
    text: For my sighing cometh instead of my food, And my roarings are poured out like water.
    translation: JPS 1917
    original: כִּי־לִפְנֵי לַחְמִי אַנְחָתִי תָבֹא וַיִּתְּכוּ כַמַּיִם שַׁאֲגֹתָי׃
    hebrewPlain: כי לפני לחמי אנחתי תבא ויתכו כמים שאגתי
    kjvRefs:
    - Job 3:24
    kjvOsis:
    - Job.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.25
    scripture: tanakh
    name: Tanakh Job 3:25
    ref: Job 3:25
    book: Job
    section: ketuvim
    chapter: 3
    verse: 25
    ordinal: 18644
    text: For the thing which I did fear is come upon me, And that which I was afraid of hath overtaken me.
    translation: JPS 1917
    original: כִּי פַחַד פָּחַדְתִּי וַיֶּאֱתָיֵנִי וַאֲשֶׁר יָגֹרְתִּי יָבֹא לִי׃
    hebrewPlain: כי פחד פחדתי ויאתיני ואשר יגרתי יבא לי
    kjvRefs:
    - Job 3:25
    kjvOsis:
    - Job.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.3.26
    scripture: tanakh
    name: Tanakh Job 3:26
    ref: Job 3:26
    book: Job
    section: ketuvim
    chapter: 3
    verse: 26
    ordinal: 18645
    text: I was not at ease, neither was I quiet, Neither had I rest; but trouble came.
    translation: JPS 1917
    original: לֹא שָׁלַוְתִּי וְלֹא שָׁקַטְתִּי וְלֹא־נָחְתִּי וַיָּבֹא רֹגֶז׃
    hebrewPlain: לא שלותי ולא שקטתי ולא נחתי ויבא רגז
    kjvRefs:
    - Job 3:26
    kjvOsis:
    - Job.3.26
  relations:
