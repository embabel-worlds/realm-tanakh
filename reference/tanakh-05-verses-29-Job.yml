      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.12
    scripture: tanakh
    name: Tanakh Job 13:12
    ref: Job 13:12
    book: Job
    section: ketuvim
    chapter: 13
    verse: 12
    ordinal: 18880
    text: Your memorials shall be like unto ashes, Your eminences to eminences of clay.
    translation: JPS 1917
    original: זִכְרֹנֵיכֶם מִשְׁלֵי־אֵפֶר לְגַבֵּי־חֹמֶר גַּבֵּיכֶם׃
    hebrewPlain: זכרניכם משלי אפר לגבי חמר גביכם
    kjvRefs:
    - Job 13:12
    kjvOsis:
    - Job.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.13
    scripture: tanakh
    name: Tanakh Job 13:13
    ref: Job 13:13
    book: Job
    section: ketuvim
    chapter: 13
    verse: 13
    ordinal: 18881
    text: Hold your peace, let me alone, that I may speak, And let come on me what will.
    translation: JPS 1917
    original: הַחֲרִישׁוּ מִמֶּנִּי וַאֲדַבְּרָה־אָנִי וְיַעֲבֹר עָלַי מָה׃
    hebrewPlain: החרישו ממני ואדברה אני ויעבר עלי מה
    kjvRefs:
    - Job 13:13
    kjvOsis:
    - Job.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.14
    scripture: tanakh
    name: Tanakh Job 13:14
    ref: Job 13:14
    book: Job
    section: ketuvim
    chapter: 13
    verse: 14
    ordinal: 18882
    text: Wherefore? I will take my flesh in my teeth, And put my life in my hand.
    translation: JPS 1917
    original: עַל־מָה אֶשָּׂא בְשָׂרִי בְשִׁנָּי וְנַפְשִׁי אָשִׂים בְּכַפִּי׃
    hebrewPlain: על מה אשא בשרי בשני ונפשי אשים בכפי
    kjvRefs:
    - Job 13:14
    kjvOsis:
    - Job.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.15
    scripture: tanakh
    name: Tanakh Job 13:15
    ref: Job 13:15
    book: Job
    section: ketuvim
    chapter: 13
    verse: 15
    ordinal: 18883
    text: Though He slay me, yet will I trust in Him; But I will argue my ways before Him.
    translation: JPS 1917
    original: הֵן יִקְטְלֵנִי לא [לוֹ] אֲיַחֵל אַךְ־דְּרָכַי אֶל־פָּנָיו אוֹכִיחַ׃
    hebrewPlain: הן יקטלני לא [לו] איחל אך דרכי אל פניו אוכיח
    kjvRefs:
    - Job 13:15
    kjvOsis:
    - Job.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.16
    scripture: tanakh
    name: Tanakh Job 13:16
    ref: Job 13:16
    book: Job
    section: ketuvim
    chapter: 13
    verse: 16
    ordinal: 18884
    text: This also shall be my salvation, That a hypocrite cannot come before Him.
    translation: JPS 1917
    original: גַּם־הוּא־לִי לִישׁוּעָה כִּי־לֹא לְפָנָיו חָנֵף יָבוֹא׃
    hebrewPlain: גם הוא לי לישועה כי לא לפניו חנף יבוא
    kjvRefs:
    - Job 13:16
    kjvOsis:
    - Job.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.17
    scripture: tanakh
    name: Tanakh Job 13:17
    ref: Job 13:17
    book: Job
    section: ketuvim
    chapter: 13
    verse: 17
    ordinal: 18885
    text: Hear diligently my speech, And let my declaration be in your ears.
    translation: JPS 1917
    original: שִׁמְעוּ שָׁמוֹעַ מִלָּתִי וְאַחֲוָתִי בְּאָזְנֵיכֶם׃
    hebrewPlain: שמעו שמוע מלתי ואחותי באזניכם
    kjvRefs:
    - Job 13:17
    kjvOsis:
    - Job.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.18
    scripture: tanakh
    name: Tanakh Job 13:18
    ref: Job 13:18
    book: Job
    section: ketuvim
    chapter: 13
    verse: 18
    ordinal: 18886
    text: Behold now, I have ordered my cause; I know that I shall be justified.
    translation: JPS 1917
    original: הִנֵּה־נָא עָרַכְתִּי מִשְׁפָּט יָדַעְתִּי כִּי־אֲנִי אֶצְדָּק׃
    hebrewPlain: הנה נא ערכתי משפט ידעתי כי אני אצדק
    kjvRefs:
    - Job 13:18
    kjvOsis:
    - Job.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.19
    scripture: tanakh
    name: Tanakh Job 13:19
    ref: Job 13:19
    book: Job
    section: ketuvim
    chapter: 13
    verse: 19
    ordinal: 18887
    text: Who is he that will contend with me? For then would I hold my peace and die.
    translation: JPS 1917
    original: מִי־הוּא יָרִיב עִמָּדִי כִּי־עַתָּה אַחֲרִישׁ וְאֶגְוָע׃
    hebrewPlain: מי הוא יריב עמדי כי עתה אחריש ואגוע
    kjvRefs:
    - Job 13:19
    kjvOsis:
    - Job.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.20
    scripture: tanakh
    name: Tanakh Job 13:20
    ref: Job 13:20
    book: Job
    section: ketuvim
    chapter: 13
    verse: 20
    ordinal: 18888
    text: 'Only do not two things unto me, Then will I not hide myself from Thee:'
    translation: JPS 1917
    original: אַךְ־שְׁתַּיִם אַל־תַּעַשׂ עִמָּדִי אָז מִפָּנֶיךָ לֹא אֶסָּתֵר׃
    hebrewPlain: אך שתים אל תעש עמדי אז מפניך לא אסתר
    kjvRefs:
    - Job 13:20
    kjvOsis:
    - Job.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.21
    scripture: tanakh
    name: Tanakh Job 13:21
    ref: Job 13:21
    book: Job
    section: ketuvim
    chapter: 13
    verse: 21
    ordinal: 18889
    text: Withdraw Thy hand far from me; And let not Thy terror make me afraid.
    translation: JPS 1917
    original: כַּפְּךָ מֵעָלַי הַרְחַק וְאֵמָתְךָ אַל־תְּבַעֲתַנִּי׃
    hebrewPlain: כפך מעלי הרחק ואמתך אל תבעתני
    kjvRefs:
    - Job 13:21
    kjvOsis:
    - Job.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.22
    scripture: tanakh
    name: Tanakh Job 13:22
    ref: Job 13:22
    book: Job
    section: ketuvim
    chapter: 13
    verse: 22
    ordinal: 18890
    text: Then call Thou, and I will answer; Or let me speak, and answer Thou me.
    translation: JPS 1917
    original: וּקְרָא וְאָנֹכִי אֶעֱנֶה אוֹ־אֲדַבֵּר וַהֲשִׁיבֵנִי׃
    hebrewPlain: וקרא ואנכי אענה או אדבר והשיבני
