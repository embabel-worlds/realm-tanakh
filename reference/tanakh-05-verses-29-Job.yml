    osis: Job.41.4
    scripture: tanakh
    name: Tanakh Job 41:4
    ref: Job 41:4
    book: Job
    section: ketuvim
    chapter: 41
    verse: 4
    ordinal: 19615
    text: Would I keep silence concerning his boastings, or his proud talk, or his fair array of words?
    translation: JPS 1917
    original: לא־[לוֹ־] אַחֲרִישׁ בַּדָּיו וּדְבַר־גְּבוּרוֹת וְחִין עֶרְכּוֹ׃
    hebrewPlain: לא [לו ] אחריש בדיו ודבר גבורות וחין ערכו
    kjvRefs:
    - Job 41:12
    kjvOsis:
    - Job.41.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.5
    scripture: tanakh
    name: Tanakh Job 41:5
    ref: Job 41:5
    book: Job
    section: ketuvim
    chapter: 41
    verse: 5
    ordinal: 19616
    text: Who can uncover the face of his garment? Who shall come within his double bridle?
    translation: JPS 1917
    original: מִי־גִלָּה פְּנֵי לְבוּשׁוֹ בְּכֶפֶל רִסְנוֹ מִי יָבוֹא׃
    hebrewPlain: מי גלה פני לבושו בכפל רסנו מי יבוא
    kjvRefs:
    - Job 41:13
    kjvOsis:
    - Job.41.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.6
    scripture: tanakh
    name: Tanakh Job 41:6
    ref: Job 41:6
    book: Job
    section: ketuvim
    chapter: 41
    verse: 6
    ordinal: 19617
    text: Who can open the doors of his face? Round about his teeth is terror.
    translation: JPS 1917
    original: דַּלְתֵי פָנָיו מִי פִתֵּחַ סְבִיבוֹת שִׁנָּיו אֵימָה׃
    hebrewPlain: דלתי פניו מי פתח סביבות שניו אימה
    kjvRefs:
    - Job 41:14
    kjvOsis:
    - Job.41.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.7
    scripture: tanakh
    name: Tanakh Job 41:7
    ref: Job 41:7
    book: Job
    section: ketuvim
    chapter: 41
    verse: 7
    ordinal: 19618
    text: His scales are his pride, shut up together as with a close seal.
    translation: JPS 1917
    original: גַּאֲוָה אֲפִיקֵי מָגִנִּים סָגוּר חוֹתָם צָר׃
    hebrewPlain: גאוה אפיקי מגנים סגור חותם צר
    kjvRefs:
    - Job 41:15
    kjvOsis:
    - Job.41.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.8
    scripture: tanakh
    name: Tanakh Job 41:8
    ref: Job 41:8
    book: Job
    section: ketuvim
    chapter: 41
    verse: 8
    ordinal: 19619
    text: One is so near to another, that no air can come between them.
    translation: JPS 1917
    original: אֶחָד בְּאֶחָד יִגַּשׁוּ וְרוּחַ לֹא־יָבוֹא בֵינֵיהֶם׃
    hebrewPlain: אחד באחד יגשו ורוח לא יבוא ביניהם
    kjvRefs:
    - Job 41:16
    kjvOsis:
    - Job.41.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.9
    scripture: tanakh
    name: Tanakh Job 41:9
    ref: Job 41:9
    book: Job
    section: ketuvim
    chapter: 41
    verse: 9
    ordinal: 19620
    text: They are joined one to another; They stick together, that they cannot be sundered.
    translation: JPS 1917
    original: אִישׁ־בְּאָחִיהוּ יְדֻבָּקוּ יִתְלַכְּדוּ וְלֹא יִתְפָּרָדוּ׃
    hebrewPlain: איש באחיהו ידבקו יתלכדו ולא יתפרדו
    kjvRefs:
    - Job 41:17
    kjvOsis:
    - Job.41.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.10
    scripture: tanakh
    name: Tanakh Job 41:10
    ref: Job 41:10
    book: Job
    section: ketuvim
    chapter: 41
    verse: 10
    ordinal: 19621
    text: His sneezings flash forth light, and his eyes are like the eyelids of the morning.
    translation: JPS 1917
    original: עֲ‍טִישֹׁתָיו תָּהֶל אוֹר וְעֵינָיו כְּעַפְעַפֵּי־שָׁחַר׃
    hebrewPlain: ע‍טישתיו תהל אור ועיניו כעפעפי שחר
    kjvRefs:
    - Job 41:18
    kjvOsis:
    - Job.41.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.11
    scripture: tanakh
    name: Tanakh Job 41:11
    ref: Job 41:11
    book: Job
    section: ketuvim
    chapter: 41
    verse: 11
    ordinal: 19622
    text: Out of his mouth go burning torches, and sparks of fire leap forth.
    translation: JPS 1917
    original: מִפִּיו לַפִּידִים יַהֲלֹכוּ כִּידוֹדֵי אֵשׁ יִתְמַלָּטוּ׃
    hebrewPlain: מפיו לפידים יהלכו כידודי אש יתמלטו
    kjvRefs:
    - Job 41:19
    kjvOsis:
    - Job.41.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.12
    scripture: tanakh
    name: Tanakh Job 41:12
    ref: Job 41:12
    book: Job
    section: ketuvim
    chapter: 41
    verse: 12
    ordinal: 19623
    text: Out of his nostrils goeth smoke, as out of a seething pot and burning rushes.
    translation: JPS 1917
    original: מִנְּחִירָיו יֵצֵא עָשָׁן כְּדוּד נָפוּחַ וְאַגְמֹן׃
    hebrewPlain: מנחיריו יצא עשן כדוד נפוח ואגמן
    kjvRefs:
    - Job 41:20
    kjvOsis:
    - Job.41.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.13
    scripture: tanakh
    name: Tanakh Job 41:13
    ref: Job 41:13
    book: Job
    section: ketuvim
    chapter: 41
    verse: 13
    ordinal: 19624
    text: His breath kindleth coals, and a flame goeth out of his mouth.
    translation: JPS 1917
    original: נַפְשׁוֹ גֶּחָלִים תְּלַהֵט וְלַהַב מִפִּיו יֵצֵא׃
    hebrewPlain: נפשו גחלים תלהט ולהב מפיו יצא
    kjvRefs:
    - Job 41:21
    kjvOsis:
    - Job.41.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.14
    scripture: tanakh
    name: Tanakh Job 41:14
    ref: Job 41:14
    book: Job
    section: ketuvim
    chapter: 41
    verse: 14
    ordinal: 19625
    text: In his neck abideth strength, and dismay danceth before him.
    translation: JPS 1917
    original: בְּצַוָּארוֹ יָלִין עֹז וּלְפָנָיו תָּדוּץ דְּאָבָה׃
    hebrewPlain: בצוארו ילין עז ולפניו תדוץ דאבה
    kjvRefs:
    - Job 41:22
    kjvOsis:
    - Job.41.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.15
    scripture: tanakh
    name: Tanakh Job 41:15
    ref: Job 41:15
    book: Job
    section: ketuvim
    chapter: 41
    verse: 15
    ordinal: 19626
    text: The flakes of his flesh are joined together; they are firm upon him; they cannot be moved.
    translation: JPS 1917
    original: מַפְּלֵי בְשָׂרוֹ דָבֵקוּ יָצוּק עָלָיו בַּל־יִמּוֹט׃
    hebrewPlain: מפלי בשרו דבקו יצוק עליו בל ימוט
    kjvRefs:
    - Job 41:23
    kjvOsis:
    - Job.41.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.16
    scripture: tanakh
    name: Tanakh Job 41:16
    ref: Job 41:16
    book: Job
    section: ketuvim
    chapter: 41
    verse: 16
    ordinal: 19627
    text: His heart is as firm as a stone; yea, firm as the nether millstone.
    translation: JPS 1917
    original: לִבּוֹ יָצוּק כְּמוֹ־אָבֶן וְיָצוּק כְּפֶלַח תַּחְתִּית׃
    hebrewPlain: לבו יצוק כמו אבן ויצוק כפלח תחתית
    kjvRefs:
    - Job 41:24
    kjvOsis:
    - Job.41.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.17
    scripture: tanakh
    name: Tanakh Job 41:17
    ref: Job 41:17
    book: Job
    section: ketuvim
    chapter: 41
    verse: 17
    ordinal: 19628
    text: When he raiseth himself up, the mighty are afraid; by reason of despair they are beside themselves.
    translation: JPS 1917
    original: מִשֵּׂתוֹ יָגוּרוּ אֵלִים מִשְּׁבָרִים יִתְחַטָּאוּ׃
    hebrewPlain: משתו יגורו אלים משברים יתחטאו
    kjvRefs:
    - Job 41:25
    kjvOsis:
    - Job.41.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.18
    scripture: tanakh
    name: Tanakh Job 41:18
    ref: Job 41:18
    book: Job
    section: ketuvim
    chapter: 41
    verse: 18
    ordinal: 19629
    text: If one lay at him with the sword, it will not hold; nor the spear, the dart, nor the pointed shaft.
    translation: JPS 1917
    original: מַשִּׂיגֵהוּ חֶרֶב בְּלִי תָקוּם חֲנִית מַסָּע וְשִׁרְיָה׃
    hebrewPlain: משיגהו חרב בלי תקום חנית מסע ושריה
    kjvRefs:
    - Job 41:26
    kjvOsis:
    - Job.41.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.19
    scripture: tanakh
    name: Tanakh Job 41:19
    ref: Job 41:19
    book: Job
    section: ketuvim
    chapter: 41
    verse: 19
    ordinal: 19630
    text: He esteemeth iron as straw, and brass as rotten wood.
    translation: JPS 1917
    original: יַחְשֹׁב לְתֶבֶן בַּרְזֶל לְעֵץ רִקָּבוֹן נְחוּשָׁה׃
    hebrewPlain: יחשב לתבן ברזל לעץ רקבון נחושה
    kjvRefs:
    - Job 41:27
    kjvOsis:
    - Job.41.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.20
    scripture: tanakh
    name: Tanakh Job 41:20
    ref: Job 41:20
    book: Job
    section: ketuvim
    chapter: 41
    verse: 20
    ordinal: 19631
    text: The arrow cannot make him flee; slingstones are turned with him into stubble.
    translation: JPS 1917
    original: לֹא־יַבְרִיחֶנּוּ בֶן־קָשֶׁת לְקַשׁ נֶהְפְּכוּ־לוֹ אַבְנֵי־קָלַע׃
    hebrewPlain: לא יבריחנו בן קשת לקש נהפכו לו אבני קלע
    kjvRefs:
    - Job 41:28
    kjvOsis:
    - Job.41.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.21
    scripture: tanakh
    name: Tanakh Job 41:21
    ref: Job 41:21
    book: Job
    section: ketuvim
    chapter: 41
    verse: 21
    ordinal: 19632
    text: Clubs are accounted as stubble; He laugheth at the rattling of the javelin.
    translation: JPS 1917
    original: כְּקַשׁ נֶחְשְׁבוּ תוֹתָח וְיִשְׂחַק לְרַעַשׁ כִּידוֹן׃
    hebrewPlain: כקש נחשבו תותח וישחק לרעש כידון
    kjvRefs:
    - Job 41:29
    kjvOsis:
    - Job.41.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.22
    scripture: tanakh
    name: Tanakh Job 41:22
    ref: Job 41:22
    book: Job
    section: ketuvim
    chapter: 41
    verse: 22
    ordinal: 19633
    text: Sharpest potsherds are under him; He spreadeth a threshing-sledge upon the mire.
    translation: JPS 1917
    original: תַּחְתָּיו חַדּוּדֵי חָרֶשׂ יִרְפַּד חָרוּץ עֲלֵי־טִיט׃
    hebrewPlain: תחתיו חדודי חרש ירפד חרוץ עלי טיט
    kjvRefs:
    - Job 41:30
    kjvOsis:
    - Job.41.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.23
    scripture: tanakh
    name: Tanakh Job 41:23
    ref: Job 41:23
    book: Job
    section: ketuvim
    chapter: 41
    verse: 23
    ordinal: 19634
    text: He maketh the deep to boil like a pot; He maketh the sea like a seething mixture.
    translation: JPS 1917
    original: יַרְתִּיחַ כַּסִּיר מְצוּלָה יָם יָשִׂים כַּמֶּרְקָחָה׃
    hebrewPlain: ירתיח כסיר מצולה ים ישים כמרקחה
    kjvRefs:
    - Job 41:31
    kjvOsis:
    - Job.41.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.24
    scripture: tanakh
    name: Tanakh Job 41:24
    ref: Job 41:24
    book: Job
    section: ketuvim
    chapter: 41
    verse: 24
    ordinal: 19635
    text: He maketh a path to shine after him; One would think the deep to be hoary.
    translation: JPS 1917
    original: אַחֲרָיו יָאִיר נָתִיב יַחְשֹׁב תְּהוֹם לְשֵׂיבָה׃
    hebrewPlain: אחריו יאיר נתיב יחשב תהום לשיבה
    kjvRefs:
    - Job 41:32
    kjvOsis:
    - Job.41.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.25
    scripture: tanakh
    name: Tanakh Job 41:25
    ref: Job 41:25
    book: Job
    section: ketuvim
    chapter: 41
    verse: 25
    ordinal: 19636
    text: Upon earth there is not his like who is made to be fearless.
    translation: JPS 1917
    original: אֵין־עַל־עָפָר מָשְׁלוֹ הֶעָשׂוּ לִבְלִי־חָת׃
    hebrewPlain: אין על עפר משלו העשו לבלי חת
    kjvRefs:
    - Job 41:33
    kjvOsis:
    - Job.41.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.41.26
    scripture: tanakh
    name: Tanakh Job 41:26
    ref: Job 41:26
    book: Job
    section: ketuvim
    chapter: 41
    verse: 26
    ordinal: 19637
    text: He looketh at all high things; He is king over all the proud beasts.
    translation: JPS 1917
    original: אֵת־כָּל־גָּבֹהַּ יִרְאֶה הוּא מֶלֶךְ עַל־כָּל־בְּנֵי־שָׁחַץ׃
    hebrewPlain: את כל גבה יראה הוא מלך על כל בני שחץ
    kjvRefs:
    - Job 41:34
    kjvOsis:
    - Job.41.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.41
- type: TanakhVerse
  data:
    osis: Job.42.1
    scripture: tanakh
    name: Tanakh Job 42:1
    ref: Job 42:1
    book: Job
    section: ketuvim
    chapter: 42
    verse: 1
    ordinal: 19638
    text: 'Then Job answered the LORD, and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב אֶת־יְהוָה וַיֹּאמַר׃
    hebrewPlain: ויען איוב את יהוה ויאמר
    kjvRefs:
    - Job 42:1
    kjvOsis:
    - Job.42.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.2
    scripture: tanakh
    name: Tanakh Job 42:2
    ref: Job 42:2
    book: Job
    section: ketuvim
    chapter: 42
    verse: 2
    ordinal: 19639
    text: I know that Thou canst do every thing, And that no purpose can be withholden from Thee.
    translation: JPS 1917
    original: ידעת [יָדַעְתִּי] כִּי־כֹל תּוּכָל וְלֹא־יִבָּצֵר מִמְּךָ מְזִמָּה׃
    hebrewPlain: ידעת [ידעתי] כי כל תוכל ולא יבצר ממך מזמה
    kjvRefs:
    - Job 42:2
    kjvOsis:
    - Job.42.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.3
    scripture: tanakh
    name: Tanakh Job 42:3
    ref: Job 42:3
    book: Job
    section: ketuvim
    chapter: 42
    verse: 3
    ordinal: 19640
    text: Who is this that hideth counsel without knowledge? Therefore have I uttered that which I understood not, Things too wonderful for me, which I knew not.
    translation: JPS 1917
    original: מִי זֶה מַעְלִים עֵצָה בְּלִי דָעַת לָכֵן הִגַּדְתִּי וְלֹא אָבִין נִפְלָאוֹת מִמֶּנִּי וְלֹא אֵדָע׃
    hebrewPlain: מי זה מעלים עצה בלי דעת לכן הגדתי ולא אבין נפלאות ממני ולא אדע
    kjvRefs:
    - Job 42:3
    kjvOsis:
    - Job.42.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.4
    scripture: tanakh
    name: Tanakh Job 42:4
    ref: Job 42:4
    book: Job
    section: ketuvim
    chapter: 42
    verse: 4
    ordinal: 19641
    text: Hear, I beseech Thee, and I will speak; I will demand of Thee, and declare Thou unto me.
    translation: JPS 1917
    original: שְׁמַע־נָא וְאָנֹכִי אֲדַבֵּר אֶשְׁאָלְךָ וְהוֹדִיעֵנִי׃
    hebrewPlain: שמע נא ואנכי אדבר אשאלך והודיעני
    kjvRefs:
    - Job 42:4
    kjvOsis:
    - Job.42.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.5
    scripture: tanakh
    name: Tanakh Job 42:5
    ref: Job 42:5
    book: Job
    section: ketuvim
    chapter: 42
    verse: 5
    ordinal: 19642
    text: I had heard of Thee by the hearing of the ear; But now mine eye seeth Thee;
    translation: JPS 1917
    original: לְשֵׁמַע־אֹזֶן שְׁמַעְתִּיךָ וְעַתָּה עֵינִי רָאָתְךָ׃
    hebrewPlain: לשמע אזן שמעתיך ועתה עיני ראתך
    kjvRefs:
    - Job 42:5
    kjvOsis:
    - Job.42.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.6
    scripture: tanakh
    name: Tanakh Job 42:6
    ref: Job 42:6
    book: Job
    section: ketuvim
    chapter: 42
    verse: 6
    ordinal: 19643
    text: Wherefore I abhor my words, and repent, Seeing I am dust and ashes.
    translation: JPS 1917
    original: עַל־כֵּן אֶמְאַס וְנִחַמְתִּי עַל־עָפָר וָאֵפֶר׃
    hebrewPlain: על כן אמאס ונחמתי על עפר ואפר
    kjvRefs:
    - Job 42:6
    kjvOsis:
    - Job.42.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.7
    scripture: tanakh
    name: Tanakh Job 42:7
    ref: Job 42:7
    book: Job
    section: ketuvim
    chapter: 42
    verse: 7
    ordinal: 19644
    text: 'And it was so, that after the LORD had spoken these words unto Job, the LORD said to Eliphaz the Temanite: ‘My wrath is kindled against thee, and against thy two friends; for ye have not spoken of Me the thing that is right, as My servant Job hath.'
    translation: JPS 1917
    original: וַיְהִי אַחַר דִּבֶּר יְהוָה אֶת־הַדְּבָרִים הָאֵלֶּה אֶל־אִיּוֹב וַיֹּאמֶר יְהוָה אֶל־אֱלִיפַז הַתֵּימָנִי חָרָה אַפִּי בְךָ וּבִשְׁנֵי רֵעֶיךָ כִּי לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה כְּעַבְדִּי אִיּוֹב׃
    hebrewPlain: ויהי אחר דבר יהוה את הדברים האלה אל איוב ויאמר יהוה אל אליפז התימני חרה אפי בך ובשני רעיך כי לא דברתם אלי נכונה כעבדי איוב
    kjvRefs:
    - Job 42:7
    kjvOsis:
    - Job.42.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.8
    scripture: tanakh
    name: Tanakh Job 42:8
    ref: Job 42:8
    book: Job
    section: ketuvim
    chapter: 42
    verse: 8
    ordinal: 19645
    text: Now therefore, take unto you seven bullocks and seven rams, and go to My servant Job, and offer up for yourselves a burnt-offering; and My servant Job shall pray for you; for him will I accept, that I do not unto you aught unseemly; for ye have not spoken of Me the thing that is right, as my servant Job hath.’
    translation: JPS 1917
    original: וְעַתָּה קְחוּ־לָכֶם שִׁבְעָה־פָרִים וְשִׁבְעָה אֵילִים וּלְכוּ אֶל־עַבְדִּי אִיּוֹב וְהַעֲלִיתֶם עוֹלָה בַּעַדְכֶם וְאִיּוֹב עַבְדִּי יִתְפַּלֵּל עֲלֵיכֶם כִּי אִם־פָּנָיו אֶשָּׂא לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה כִּי לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה כְּעַבְדִּי אִיּוֹב׃
    hebrewPlain: ועתה קחו לכם שבעה פרים ושבעה אילים ולכו אל עבדי איוב והעליתם עולה בעדכם ואיוב עבדי יתפלל עליכם כי אם פניו אשא לבלתי עשות עמכם נבלה כי לא דברתם אלי נכונה כעבדי איוב
    kjvRefs:
    - Job 42:8
    kjvOsis:
    - Job.42.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.9
    scripture: tanakh
    name: Tanakh Job 42:9
    ref: Job 42:9
    book: Job
    section: ketuvim
    chapter: 42
    verse: 9
    ordinal: 19646
    text: So Eliphaz the Temanite and Bildad the Shuhite and Zophar the Naamathite went, and did according as the LORD commanded them; and the LORD accepted Job.
    translation: JPS 1917
    original: וַיֵּלְכוּ אֱלִיפַז הַתֵּימָנִי וּבִלְדַּד הַשּׁוּחִי צֹפַר הַנַּעֲמָתִי וַיַּעֲשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם יְהוָה וַיִּשָּׂא יְהוָה אֶת־פְּנֵי אִיּוֹב׃
    hebrewPlain: וילכו אליפז התימני ובלדד השוחי צפר הנעמתי ויעשו כאשר דבר אליהם יהוה וישא יהוה את פני איוב
    kjvRefs:
    - Job 42:9
    kjvOsis:
    - Job.42.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.42
- type: TanakhVerse
  data:
    osis: Job.42.10
    scripture: tanakh
    name: Tanakh Job 42:10
    ref: Job 42:10
    book: Job
    section: ketuvim
    chapter: 42
    verse: 10
    ordinal: 19647
    text: And the LORD changed the fortune of Job, when he prayed for his friends; and the LORD gave Job twice as much as he had before.
    translation: JPS 1917
    original: וַיהוָה שָׁב אֶת־שבית [שְׁבוּת] אִיּוֹב בְּהִתְפַּלְלוֹ בְּעַד רֵעֵהוּ וַיֹּסֶף יְהוָה אֶת־כָּל־אֲשֶׁר לְאִיּוֹב לְמִשְׁנֶה׃
    hebrewPlain: ויהוה שב את שבית [שבות] איוב בהתפללו בעד רעהו ויסף יהוה את כל אשר לאיוב למשנה
    kjvRefs:
