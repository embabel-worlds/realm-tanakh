    scripture: tanakh
    name: Tanakh Job 39:25
    ref: Job 39:25
    book: Job
    section: ketuvim
    chapter: 39
    verse: 25
    ordinal: 19574
    text: 'As oft as he heareth the horn he saith: ‘Ha, ha! ’ And he smelleth the battle afar off, The thunder of the captains, and the shouting.'
    translation: JPS 1917
    original: בְּדֵי שֹׁפָר יֹאמַר הֶאָח וּמֵרָחוֹק יָרִיחַ מִלְחָמָה רַעַם שָׂרִים וּתְרוּעָה׃
    hebrewPlain: בדי שפר יאמר האח ומרחוק יריח מלחמה רעם שרים ותרועה
    kjvRefs:
