    name: Tanakh Job 39:29
    ref: Job 39:29
    book: Job
    section: ketuvim
    chapter: 39
    verse: 29
    ordinal: 19578
    text: From thence she spieth out the prey; Her eyes behold it afar off.
    translation: JPS 1917
    original: מִשָּׁם חָפַר־אֹכֶל לְמֵרָחוֹק עֵינָיו יַבִּיטוּ׃
    hebrewPlain: משם חפר אכל למרחוק עיניו יביטו
