    name: Tanakh Job 40:7
    ref: Job 40:7
    book: Job
    section: ketuvim
    chapter: 40
    verse: 7
    ordinal: 19586
    text: Gird up thy loins now like a man; I will demand of thee, and declare thou unto Me. .
    translation: JPS 1917
    original: אֱזָר־נָא כְגֶבֶר חֲלָצֶיךָ אֶשְׁאָלְךָ וְהוֹדִיעֵנִי׃
    hebrewPlain: אזר נא כגבר חלציך אשאלך והודיעני
