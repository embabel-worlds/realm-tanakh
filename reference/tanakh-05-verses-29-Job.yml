    scripture: tanakh
    name: Tanakh Job 12:9
    ref: Job 12:9
    book: Job
    section: ketuvim
    chapter: 12
    verse: 9
    ordinal: 18852
    text: Who knoweth not among all these, That the hand of the LORD hath wrought this?
    translation: JPS 1917
    original: מִי לֹא־יָדַע בְּכָל־אֵלֶּה כִּי יַד־יְהוָה עָשְׂתָה זֹּאת׃
    hebrewPlain: מי לא ידע בכל אלה כי יד יהוה עשתה זאת
    kjvRefs:
    - Job 12:9
    kjvOsis:
    - Job.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.10
    scripture: tanakh
    name: Tanakh Job 12:10
    ref: Job 12:10
    book: Job
    section: ketuvim
    chapter: 12
    verse: 10
    ordinal: 18853
    text: In whose hand is the soul of every living thing, And the breath of all mankind.—
    translation: JPS 1917
    original: אֲשֶׁר בְּיָדוֹ נֶפֶשׁ כָּל־חָי וְרוּחַ כָּל־בְּשַׂר־אִישׁ׃
    hebrewPlain: אשר בידו נפש כל חי ורוח כל בשר איש
