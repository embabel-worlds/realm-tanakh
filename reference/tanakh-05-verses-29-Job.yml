  data:
    osis: Job.40.12
    scripture: tanakh
    name: Tanakh Job 40:12
    ref: Job 40:12
    book: Job
    section: ketuvim
    chapter: 40
    verse: 12
    ordinal: 19591
    text: Look on every one that is proud, and bring him low; And tread down the wicked in their place.
    translation: JPS 1917
    original: רְאֵה כָל־גֵּאֶה הַכְנִיעֵהוּ וַהֲדֹךְ רְשָׁעִים תַּחְתָּם׃
    hebrewPlain: ראה כל גאה הכניעהו והדך רשעים תחתם
