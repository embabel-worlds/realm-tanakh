    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 18587
    text: His possessions also were seven thousand sheep, and three thousand camels, and five hundred yoke of oxen, and five hundred she-asses, and a very great household; so that this man was the greatest of all the children of the east.
    translation: JPS 1917
    original: וַיְהִי מִקְנֵהוּ שִׁבְעַת אַלְפֵי־צֹאן וּשְׁלֹשֶׁת אַלְפֵי גְמַלִּים וַחֲמֵשׁ מֵאוֹת צֶמֶד־בָּקָר וַחֲמֵשׁ מֵאוֹת אֲתוֹנוֹת וַעֲבֻדָּה רַבָּה מְאֹד וַיְהִי הָאִישׁ הַהוּא גָּדוֹל מִכָּל־בְּנֵי־קֶדֶם׃
    hebrewPlain: ויהי מקנהו שבעת אלפי צאן ושלשת אלפי גמלים וחמש מאות צמד בקר וחמש מאות אתונות ועבדה רבה מאד ויהי האיש ההוא גדול מכל בני קדם
    kjvRefs:
    - Job 1:3
    kjvOsis:
    - Job.1.3
