    scripture: tanakh
    name: Tanakh Job 40:6
    ref: Job 40:6
    book: Job
    section: ketuvim
    chapter: 40
    verse: 6
    ordinal: 19585
    text: 'Then the LORD answered Job out of the whirlwind, and said:'
    translation: JPS 1917
    original: וַיַּעַן־יְהוָה אֶת־אִיּוֹב מנ סערה [מִן ] [סְעָרָה] וַיֹּאמַר׃
