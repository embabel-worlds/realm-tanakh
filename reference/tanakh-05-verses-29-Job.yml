- type: TanakhVerse
  data:
    osis: Job.40.2
    scripture: tanakh
    name: Tanakh Job 40:2
    ref: Job 40:2
    book: Job
    section: ketuvim
    chapter: 40
    verse: 2
    ordinal: 19581
    text: Shall he that reproveth contend with the Almighty? He that argueth with God, let him answer it.
    translation: JPS 1917
    original: הֲרֹב עִם־שַׁדַּי יִסּוֹר מוֹכִיחַ אֱלוֹהַּ יַעֲנֶנָּה׃
    hebrewPlain: הרב עם שדי יסור מוכיח אלוה יעננה
    kjvRefs:
    - Job 40:2
    kjvOsis:
    - Job.40.2
