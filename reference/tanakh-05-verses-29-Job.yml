    osis: Job.40.32
    scripture: tanakh
    name: Tanakh Job 40:32
    ref: Job 40:32
    book: Job
    section: ketuvim
    chapter: 40
    verse: 32
    ordinal: 19611
    text: Lay thy hand upon him; Think upon the battle, thou wilt do so no more.
    translation: JPS 1917
    original: שִׂים־עָלָיו כַּפֶּךָ זְכֹר מִלְחָמָה אַל־תּוֹסַף׃
    hebrewPlain: שים עליו כפך זכר מלחמה אל תוסף
    kjvRefs:
    - Job 41:8
    kjvOsis:
    - Job.41.8
