    scripture: tanakh
    name: Tanakh Job 41:2
    ref: Job 41:2
    book: Job
    section: ketuvim
    chapter: 41
    verse: 2
    ordinal: 19613
    text: None is so fierce that dare stir him up; Who then is able to stand before Me?
    translation: JPS 1917
    original: לֹא־אַכְזָר כִּי יְעוּרֶנּוּ וּמִי הוּא לְפָנַי יִתְיַצָּב׃
    hebrewPlain: לא אכזר כי יעורנו ומי הוא לפני יתיצב
