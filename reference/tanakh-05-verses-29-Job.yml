    book: Job
    section: ketuvim
    chapter: 12
    verse: 18
    ordinal: 18861
    text: He looseth the bond of kings, And bindeth their loins with a girdle.
    translation: JPS 1917
    original: מוּסַר מְלָכִים פִּתֵּחַ וַיֶּאְסֹר אֵזוֹר בְּמָתְנֵיהֶם׃
    hebrewPlain: מוסר מלכים פתח ויאסר אזור במתניהם
    kjvRefs:
    - Job 12:18
    kjvOsis:
    - Job.12.18
