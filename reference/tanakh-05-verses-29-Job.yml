    scripture: tanakh
    name: Tanakh Job 12:17
    ref: Job 12:17
    book: Job
    section: ketuvim
    chapter: 12
    verse: 17
    ordinal: 18860
    text: He leadeth counsellors away stripped, And judges maketh He fools.
    translation: JPS 1917
    original: מוֹלִיךְ יוֹעֲצִים שׁוֹלָל וְשֹׁפְטִים יְהוֹלֵל׃
    hebrewPlain: מוליך יועצים שולל ושפטים יהולל
    kjvRefs:
    - Job 12:17
    kjvOsis:
    - Job.12.17
