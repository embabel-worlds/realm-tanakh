    osis: Job.40.18
    scripture: tanakh
    name: Tanakh Job 40:18
    ref: Job 40:18
    book: Job
    section: ketuvim
    chapter: 40
    verse: 18
    ordinal: 19597
    text: His bones are as pipes of brass; His gristles are like bars of iron.
    translation: JPS 1917
    original: עֲצָמָיו אֲפִיקֵי נְחוּשָׁה גְּרָמָיו כִּמְטִיל בַּרְזֶל׃
    hebrewPlain: עצמיו אפיקי נחושה גרמיו כמטיל ברזל
