    scripture: tanakh
    name: Tanakh Job 40:27
    ref: Job 40:27
    book: Job
    section: ketuvim
    chapter: 40
    verse: 27
    ordinal: 19606
    text: Will he make many supplications unto thee? Or will he speak soft words unto thee?
    translation: JPS 1917
    original: הֲיַרְבֶּה אֵלֶיךָ תַּחֲנוּנִים אִם־יְדַבֵּר אֵלֶיךָ רַכּוֹת׃
    hebrewPlain: הירבה אליך תחנונים אם ידבר אליך רכות
    kjvRefs:
    - Job 41:3
    kjvOsis:
    - Job.41.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.28
    scripture: tanakh
    name: Tanakh Job 40:28
    ref: Job 40:28
    book: Job
    section: ketuvim
    chapter: 40
    verse: 28
    ordinal: 19607
    text: Will he make a covenant with thee, That thou shouldest take him for a servant for ever?
    translation: JPS 1917
    original: הֲיִכְרֹת בְּרִית עִמָּךְ תִּקָּחֶנּוּ לְעֶבֶד עוֹלָם׃
    hebrewPlain: היכרת ברית עמך תקחנו לעבד עולם
    kjvRefs:
    - Job 41:4
    kjvOsis:
    - Job.41.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.29
    scripture: tanakh
    name: Tanakh Job 40:29
    ref: Job 40:29
    book: Job
    section: ketuvim
    chapter: 40
    verse: 29
    ordinal: 19608
    text: Wilt thou play with him as with a bird? Or wilt thou bind him for thy maidens? .
    translation: JPS 1917
    original: הַתְשַׂחֶק־בּוֹ כַּצִּפּוֹר וְתִקְשְׁרֶנּוּ לְנַעֲרוֹתֶיךָ׃
    hebrewPlain: התשחק בו כצפור ותקשרנו לנערותיך
    kjvRefs:
    - Job 41:5
    kjvOsis:
    - Job.41.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.30
    scripture: tanakh
    name: Tanakh Job 40:30
    ref: Job 40:30
    book: Job
    section: ketuvim
    chapter: 40
    verse: 30
    ordinal: 19609
    text: Will the bands of fishermen make a banquet of him? Will they part him among the merchants?
    translation: JPS 1917
    original: יִכְרוּ עָלָיו חַבָּרִים יֶחֱצוּהוּ בֵּין כְּנַעֲנִים׃
    hebrewPlain: יכרו עליו חברים יחצוהו בין כנענים
    kjvRefs:
    - Job 41:6
    kjvOsis:
    - Job.41.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
