    scripture: tanakh
    name: Tanakh Job 12:11
    ref: Job 12:11
    book: Job
    section: ketuvim
    chapter: 12
    verse: 11
    ordinal: 18854
    text: Doth not the ear try words, Even as the palate tasteth its food?
    translation: JPS 1917
    original: הֲלֹא־אֹזֶן מִלִּין תִּבְחָן וְחֵךְ אֹכֶל יִטְעַם־לוֹ׃
    hebrewPlain: הלא אזן מלין תבחן וחך אכל יטעם לו
    kjvRefs:
    - Job 12:11
    kjvOsis:
