    verse: 9
    ordinal: 18877
    text: Would it be good that He should search you out? Or as one mocketh a man, will ye mock Him?
    translation: JPS 1917
    original: הֲטוֹב כִּי־יַחְקֹר אֶתְכֶם אִם־כְּהָתֵל בֶּאֱנוֹשׁ תְּהָתֵלּוּ בוֹ׃
    hebrewPlain: הטוב כי יחקר אתכם אם כהתל באנוש תהתלו בו
