    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.11
    scripture: tanakh
    name: Tanakh Job 13:11
    ref: Job 13:11
    book: Job
    section: ketuvim
    chapter: 13
    verse: 11
    ordinal: 18879
    text: Shall not His majesty terrify you, And His dread fall upon you?
    translation: JPS 1917
    original: הֲלֹא שְׂאֵתוֹ תְּבַעֵת אֶתְכֶם וּפַחְדּוֹ יִפֹּל עֲלֵיכֶם׃
    hebrewPlain: הלא שאתו תבעת אתכם ופחדו יפל עליכם
