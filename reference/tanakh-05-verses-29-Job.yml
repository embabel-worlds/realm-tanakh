    scripture: tanakh
    name: Tanakh Job 12:21
    ref: Job 12:21
    book: Job
    section: ketuvim
    chapter: 12
    verse: 21
    ordinal: 18864
    text: He poureth contempt upon princes, And looseth the belt of the strong.
    translation: JPS 1917
    original: שׁוֹפֵךְ בּוּז עַל־נְדִיבִים וּמְזִיחַ אֲפִיקִים רִפָּה׃
    hebrewPlain: שופך בוז על נדיבים ומזיח אפיקים רפה
    kjvRefs:
    - Job 12:21
    kjvOsis:
    - Job.12.21
