- type: TanakhVerse
  data:
    osis: Job.40.22
    scripture: tanakh
    name: Tanakh Job 40:22
    ref: Job 40:22
    book: Job
    section: ketuvim
    chapter: 40
    verse: 22
    ordinal: 19601
    text: The lotus-trees cover him with their shadow; The willows of the brook compass him about.
    translation: JPS 1917
    original: יְסֻכֻּהוּ צֶאֱלִים צִלֲלוֹ יְסֻבּוּהוּ עַרְבֵי־נָחַל׃
    hebrewPlain: יסכהו צאלים צללו יסבוהו ערבי נחל
    kjvRefs:
