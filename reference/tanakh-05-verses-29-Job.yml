    scripture: tanakh
    name: Tanakh Job 40:21
    ref: Job 40:21
    book: Job
    section: ketuvim
    chapter: 40
    verse: 21
    ordinal: 19600
    text: He lieth under the lotus-trees, In the covert of the reed, and fens.
    translation: JPS 1917
    original: תַּחַת־צֶאֱלִים יִשְׁכָּב בְּסֵתֶר קָנֶה וּבִצָּה׃
    hebrewPlain: תחת צאלים ישכב בסתר קנה ובצה
