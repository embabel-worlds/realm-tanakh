  data:
    osis: Job.1.13
    scripture: tanakh
    name: Tanakh Job 1:13
    ref: Job 1:13
    book: Job
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 18597
    text: And it fell on a day when his sons and his daughters were eating and drinking wine in their eldest brother’s house,
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וּבָנָיו וּבְנֹתָיו אֹכְלִים וְשֹׁתִים יַיִן בְּבֵית אֲחִיהֶם הַבְּכוֹר׃
    hebrewPlain: ויהי היום ובניו ובנתיו אכלים ושתים יין בבית אחיהם הבכור
