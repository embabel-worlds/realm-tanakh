    osis: Job.40.19
    scripture: tanakh
    name: Tanakh Job 40:19
    ref: Job 40:19
    book: Job
    section: ketuvim
    chapter: 40
    verse: 19
    ordinal: 19598
    text: He is the beginning of the ways of God; He only that made him can make His sword to approach unto him.
    translation: JPS 1917
    original: הוּא רֵאשִׁית דַּרְכֵי־אֵל הָעֹשׂוֹ יַגֵּשׁ חַרְבּוֹ׃
