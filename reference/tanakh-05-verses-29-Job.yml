    original: אוֹ שִׂיחַ לָאָרֶץ וְתֹרֶךָּ וִיסַפְּרוּ לְךָ דְּגֵי הַיָּם׃
    hebrewPlain: או שיח לארץ ותרך ויספרו לך דגי הים
