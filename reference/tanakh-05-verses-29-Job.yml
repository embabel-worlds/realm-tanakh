    text: And after this Job lived a hundred and forty years, and saw his sons, and his sons’ sons, even four generations.
    translation: JPS 1917
    original: וַיְחִי אִיּוֹב אַחֲרֵי־זֹאת מֵאָה וְאַרְבָּעִים שָׁנָה וירא [וַיִּרְאֶה] אֶת־בָּנָיו וְאֶת־בְּנֵי בָנָיו אַרְבָּעָה דֹּרוֹת׃
    hebrewPlain: ויחי איוב אחרי זאת מאה וארבעים שנה וירא [ויראה] את בניו ואת בני בניו ארבעה דרות
