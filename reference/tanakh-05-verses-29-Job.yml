- type: TanakhVerse
  data:
    osis: Job.1.4
    scripture: tanakh
    name: Tanakh Job 1:4
    ref: Job 1:4
    book: Job
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 18588
    text: And his sons used to go and hold a feast in the house of each one upon his day; and they would send and invite their three sisters to eat and to drink with them.
    translation: JPS 1917
    original: וְהָלְכוּ בָנָיו וְעָשׂוּ מִשְׁתֶּה בֵּית אִישׁ יוֹמוֹ וְשָׁלְחוּ וְקָרְאוּ לִשְׁלֹשֶׁת אחיתיהם [אַחְיוֹתֵיהֶם] לֶאֱכֹל וְלִשְׁתּוֹת עִמָּהֶם׃
    hebrewPlain: והלכו בניו ועשו משתה בית איש יומו ושלחו וקראו לשלשת אחיתיהם [אחיותיהם] לאכל ולשתות עמהם
    kjvRefs:
    - Job 1:4
    kjvOsis:
    - Job.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.5
    scripture: tanakh
    name: Tanakh Job 1:5
    ref: Job 1:5
    book: Job
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 18589
    text: 'And it was so, when the days of their feasting were gone about, that Job sent and sanctified them, and rose up early in the morning, and offered burnt-offerings according to the number of them all; for Job said: ‘It may be that my sons have sinned, and blasphemed God in their hearts.’ Thus did Job continually.'
    translation: JPS 1917
    original: וַיְהִי כִּי הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה וַיִּשְׁלַח אִיּוֹב וַיְקַדְּשֵׁם וְהִשְׁכִּים בַּבֹּקֶר וְהֶעֱלָה עֹלוֹת מִסְפַּר כֻּלָּם כִּי אָמַר אִיּוֹב אוּלַי חָטְאוּ בָנַי וּבֵרֲכוּ אֱלֹהִים בִּלְבָבָם כָּכָה יַעֲשֶׂה אִיּוֹב כָּל־הַיָּמִים׃
    hebrewPlain: ויהי כי הקיפו ימי המשתה וישלח איוב ויקדשם והשכים בבקר והעלה עלות מספר כלם כי אמר איוב אולי חטאו בני וברכו אלהים בלבבם ככה יעשה איוב כל הימים
    kjvRefs:
    - Job 1:5
    kjvOsis:
    - Job.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.6
    scripture: tanakh
    name: Tanakh Job 1:6
    ref: Job 1:6
    book: Job
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 18590
    text: Now it fell upon a day, that the sons of God came to present themselves before the LORD, and Satan came also among them.
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיָּבֹאוּ בְּנֵי הָאֱלֹהִים לְהִתְיַצֵּב עַל־יְהוָה וַיָּבוֹא גַם־הַשָּׂטָן בְּתוֹכָם׃
    hebrewPlain: ויהי היום ויבאו בני האלהים להתיצב על יהוה ויבוא גם השטן בתוכם
    kjvRefs:
    - Job 1:6
    kjvOsis:
    - Job.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.7
    scripture: tanakh
    name: Tanakh Job 1:7
    ref: Job 1:7
    book: Job
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 18591
    text: 'And the LORD said unto Satan: ‘Whence comest thou?’ Then Satan answered the LORD, and said: ‘From going to and fro in the earth, and from walking up and down in it.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן מֵאַיִן תָּבֹא וַיַּעַן הַשָּׂטָן אֶת־יְהוָה וַיֹּאמַר מִשּׁוּט בָּאָרֶץ וּמֵהִתְהַלֵּךְ בָּהּ׃
    hebrewPlain: ויאמר יהוה אל השטן מאין תבא ויען השטן את יהוה ויאמר משוט בארץ ומהתהלך בה
    kjvRefs:
    - Job 1:7
    kjvOsis:
    - Job.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.8
    scripture: tanakh
    name: Tanakh Job 1:8
    ref: Job 1:8
    book: Job
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 18592
    text: 'And the LORD said unto Satan: ‘Hast thou considered My servant Job, that there is none like him in the earth, a whole-hearted and an upright man, one that feareth God, and shunneth evil?’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן הֲשַׂמְתָּ לִבְּךָ עַל־עַבְדִּי אִיּוֹב כִּי אֵין כָּמֹהוּ בָּאָרֶץ אִישׁ תָּם וְיָשָׁר יְרֵא אֱלֹהִים וְסָר מֵרָע׃
    hebrewPlain: ויאמר יהוה אל השטן השמת לבך על עבדי איוב כי אין כמהו בארץ איש תם וישר ירא אלהים וסר מרע
    kjvRefs:
    - Job 1:8
    kjvOsis:
    - Job.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
