    section: ketuvim
    chapter: 42
    verse: 12
    ordinal: 19649
    text: So the LORD blessed the latter end of Job more than his beginning; and he had fourteen thousand sheep, and six thousand camels, and a thousand yoke of oxen, and a thousand she-asses. .
    translation: JPS 1917
    original: וַיהוָה בֵּרַךְ אֶת־אַחֲרִית אִיּוֹב מֵרֵאשִׁתוֹ וַיְהִי־לוֹ אַרְבָּעָה עָשָׂר אֶלֶף צֹאן וְשֵׁשֶׁת אֲלָפִים גְּמַלִּים וְאֶלֶף־צֶמֶד בָּקָר וְאֶלֶף אֲתוֹנוֹת׃
    hebrewPlain: ויהוה ברך את אחרית איוב מראשתו ויהי לו ארבעה עשר אלף צאן וששת אלפים גמלים ואלף צמד בקר ואלף אתונות
    kjvRefs:
    - Job 42:12
