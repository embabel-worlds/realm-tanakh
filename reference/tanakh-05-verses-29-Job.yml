    book: Job
    section: ketuvim
    chapter: 39
    verse: 24
    ordinal: 19573
    text: He swalloweth the ground with storm and rage; Neither believeth he that it is the voice of the horn.
    translation: JPS 1917
    original: בְּרַעַשׁ וְרֹגֶז יְגַמֶּא־אָרֶץ וְלֹא־יַאֲמִין כִּי־קוֹל שׁוֹפָר׃
    hebrewPlain: ברעש ורגז יגמא ארץ ולא יאמין כי קול שופר
