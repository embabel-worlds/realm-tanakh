    scripture: tanakh
    name: Tanakh Job 41:1
    ref: Job 41:1
    book: Job
    section: ketuvim
    chapter: 41
    verse: 1
    ordinal: 19612
    text: Behold, the hope of him is in vain; Shall not one be cast down even at the sight of him?
    translation: JPS 1917
    original: הֵן־תֹּחַלְתּוֹ נִכְזָבָה הֲגַם אֶל־מַרְאָיו יֻטָל׃
    hebrewPlain: הן תחלתו נכזבה הגם אל מראיו יטל
