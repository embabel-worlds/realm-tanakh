    scripture: tanakh
    name: Tanakh Job 39:28
    ref: Job 39:28
    book: Job
    section: ketuvim
    chapter: 39
    verse: 28
    ordinal: 19577
    text: She dwelleth and abideth on the rock, Upon the crag of the rock, and the stronghold.
    translation: JPS 1917
    original: סֶלַע יִשְׁכֹּן וְיִתְלֹנָן עַל־שֶׁן־סֶלַע וּמְצוּדָה׃
    hebrewPlain: סלע ישכן ויתלנן על שן סלע ומצודה
