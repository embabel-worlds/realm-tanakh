    translation: JPS 1917
    original: הוֹכֵחַ יוֹכִיחַ אֶתְכֶם אִם־בַּסֵּתֶר פָּנִים תִּשָּׂאוּן׃
    hebrewPlain: הוכח יוכיח אתכם אם בסתר פנים תשאון
