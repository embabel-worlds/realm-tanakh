    scripture: tanakh
    name: Tanakh Job 40:8
    ref: Job 40:8
    book: Job
    section: ketuvim
    chapter: 40
    verse: 8
    ordinal: 19587
    text: Wilt thou even make void My judgment? Wilt thou condemn Me, that thou mayest be justified?
    translation: JPS 1917
    original: הַאַף תָּפֵר מִשְׁפָּטִי תַּרְשִׁיעֵנִי לְמַעַן תִּצְדָּק׃
    hebrewPlain: האף תפר משפטי תרשיעני למען תצדק
