  data:
    osis: Job.40.15
    scripture: tanakh
    name: Tanakh Job 40:15
    ref: Job 40:15
    book: Job
    section: ketuvim
    chapter: 40
    verse: 15
    ordinal: 19594
    text: Behold now behemoth, which I made with thee; He eateth grass as an ox.
    translation: JPS 1917
    original: הִנֵּה־נָא בְהֵמוֹת אֲשֶׁר־עָשִׂיתִי עִמָּךְ חָצִיר כַּבָּקָר יֹאכֵל׃
    hebrewPlain: הנה נא בהמות אשר עשיתי עמך חציר כבקר יאכל
