  data:
    osis: Job.1.15
    scripture: tanakh
    name: Tanakh Job 1:15
    ref: Job 1:15
    book: Job
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 18599
    text: and the Sabeans made a raid, and took them away; yea, they have slain the servants with the edge of the sword; and I only am escaped alone to tell thee.’
    translation: JPS 1917
    original: וַתִּפֹּל שְׁבָא וַתִּקָּחֵם וְאֶת־הַנְּעָרִים הִכּוּ לְפִי־חָרֶב וָאִמָּלְטָה רַק־אֲנִי לְבַדִּי לְהַגִּיד לָךְ׃
    hebrewPlain: ותפל שבא ותקחם ואת הנערים הכו לפי חרב ואמלטה רק אני לבדי להגיד לך
    kjvRefs:
    - Job 1:15
    kjvOsis:
    - Job.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.16
    scripture: tanakh
    name: Tanakh Job 1:16
    ref: Job 1:16
    book: Job
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 18600
    text: 'While he was yet speaking, there came also another, and said: ‘A fire of God is fallen from heaven, and hath burned up the sheep, and the servants, and consumed them; and I only am escaped alone to tell thee.’'
    translation: JPS 1917
    original: עוֹד זֶה מְדַבֵּר וְזֶה בָּא וַיֹּאמַר אֵשׁ אֱלֹהִים נָפְלָה מִן־הַשָּׁמַיִם וַתִּבְעַר בַּצֹּאן וּבַנְּעָרִים וַתֹּאכְלֵם וָאִמָּלְטָה רַק־אֲנִי לְבַדִּי לְהַגִּיד לָךְ׃
    hebrewPlain: עוד זה מדבר וזה בא ויאמר אש אלהים נפלה מן השמים ותבער בצאן ובנערים ותאכלם ואמלטה רק אני לבדי להגיד לך
    kjvRefs:
    - Job 1:16
    kjvOsis:
    - Job.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.17
    scripture: tanakh
    name: Tanakh Job 1:17
    ref: Job 1:17
    book: Job
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 18601
    text: 'While he was yet speaking, there came also another, and said: ‘The Chaldeans set themselves in three bands, and fell upon the camels, and have taken them away, yea, and slain the servants with the edge of the sword; and I only am escaped alone to tell thee.’'
    translation: JPS 1917
    original: עוֹד זֶה מְדַבֵּר וְזֶה בָּא וַיֹּאמַר כַּשְׂדִּים שָׂמוּ שְׁלֹשָׁה רָאשִׁים וַיִּפְשְׁטוּ עַל־הַגְּמַלִּים וַיִּקָּחוּם וְאֶת־הַנְּעָרִים הִכּוּ לְפִי־חָרֶב וָאִמָּלְטָה רַק־אֲנִי לְבַדִּי לְהַגִּיד לָךְ׃
    hebrewPlain: עוד זה מדבר וזה בא ויאמר כשדים שמו שלשה ראשים ויפשטו על הגמלים ויקחום ואת הנערים הכו לפי חרב ואמלטה רק אני לבדי להגיד לך
    kjvRefs:
    - Job 1:17
    kjvOsis:
    - Job.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
