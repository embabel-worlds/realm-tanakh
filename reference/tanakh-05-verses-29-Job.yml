    osis: Job.13.6
    scripture: tanakh
    name: Tanakh Job 13:6
    ref: Job 13:6
    book: Job
    section: ketuvim
    chapter: 13
    verse: 6
    ordinal: 18874
    text: Hear now my reasoning, And hearken to the pleadings of my lips.
    translation: JPS 1917
    original: שִׁמְעוּ־נָא תוֹכַחְתִּי וְרִבוֹת שְׂפָתַי הַקְשִׁיבוּ׃
    hebrewPlain: שמעו נא תוכחתי ורבות שפתי הקשיבו
    kjvRefs:
    - Job 13:6
    kjvOsis:
    - Job.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
