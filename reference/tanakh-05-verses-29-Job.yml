    translation: JPS 1917
    original: מַשְׂגִּיא לַגּוֹיִם וַיְאַבְּדֵם שֹׁטֵחַ לַגּוֹיִם וַיַּנְחֵם׃
    hebrewPlain: משגיא לגוים ויאבדם שטח לגוים וינחם
    kjvRefs:
    - Job 12:23
    kjvOsis:
    - Job.12.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.24
    scripture: tanakh
    name: Tanakh Job 12:24
    ref: Job 12:24
    book: Job
    section: ketuvim
    chapter: 12
    verse: 24
    ordinal: 18867
    text: He taketh away the heart of the chiefs of the people of the land, And causeth them to wander in a wilderness where there is no way.
    translation: JPS 1917
    original: מֵסִיר לֵב רָאשֵׁי עַם־הָאָרֶץ וַיַּתְעֵם בְּתֹהוּ לֹא־דָרֶךְ׃
    hebrewPlain: מסיר לב ראשי עם הארץ ויתעם בתהו לא דרך
    kjvRefs:
    - Job 12:24
    kjvOsis:
    - Job.12.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.25
    scripture: tanakh
    name: Tanakh Job 12:25
    ref: Job 12:25
    book: Job
    section: ketuvim
    chapter: 12
    verse: 25
    ordinal: 18868
    text: They grope in the dark without light, And He maketh them to stagger like a drunken man.
    translation: JPS 1917
    original: יְמַשְׁשׁוּ־חֹשֶׁךְ וְלֹא־אוֹר וַיַּתְעֵם כַּשִּׁכּוֹר׃
    hebrewPlain: ימששו חשך ולא אור ויתעם כשכור
    kjvRefs:
    - Job 12:25
    kjvOsis:
    - Job.12.25
