- type: TanakhVerse
  data:
    osis: Job.20.16
    scripture: tanakh
    name: Tanakh Job 20:16
    ref: Job 20:16
    book: Job
    section: ketuvim
    chapter: 20
    verse: 16
    ordinal: 19057
    text: He shall suck the poison of asps; The viper’s tongue shall slay him.
    translation: JPS 1917
    original: רֹאשׁ־פְּתָנִים יִינָק תַּהַרְגֵהוּ לְשׁוֹן אֶפְעֶה׃
    hebrewPlain: ראש פתנים יינק תהרגהו לשון אפעה
    kjvRefs:
    - Job 20:16
    kjvOsis:
    - Job.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.17
    scripture: tanakh
    name: Tanakh Job 20:17
    ref: Job 20:17
    book: Job
    section: ketuvim
    chapter: 20
    verse: 17
    ordinal: 19058
    text: He shall not look upon the rivers, The flowing streams of honey and curd.
    translation: JPS 1917
    original: אַל־יֵרֶא בִפְלַגּוֹת נַהֲרֵי נַחֲלֵי דְּבַשׁ וְחֶמְאָה׃
    hebrewPlain: אל ירא בפלגות נהרי נחלי דבש וחמאה
    kjvRefs:
    - Job 20:17
    kjvOsis:
    - Job.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.18
    scripture: tanakh
    name: Tanakh Job 20:18
    ref: Job 20:18
    book: Job
    section: ketuvim
    chapter: 20
    verse: 18
    ordinal: 19059
    text: That which he laboured for shall he give back, and shall not swallow it down; According to the substance that he hath gotten, he shall not rejoice.
    translation: JPS 1917
    original: מֵשִׁיב יָגָע וְלֹא יִבְלָע כְּחֵיל תְּמוּרָתוֹ וְלֹא יַעֲלֹס׃
    hebrewPlain: משיב יגע ולא יבלע כחיל תמורתו ולא יעלס
    kjvRefs:
    - Job 20:18
    kjvOsis:
    - Job.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.19
    scripture: tanakh
    name: Tanakh Job 20:19
    ref: Job 20:19
    book: Job
    section: ketuvim
    chapter: 20
    verse: 19
    ordinal: 19060
    text: For he hath oppressed and forsaken the poor; He hath violently taken away a house, and he shall not build it up.
    translation: JPS 1917
    original: כִּי־רִצַּץ עָזַב דַּלִּים בַּיִת גָּזַל וְלֹא יִבֶנֵהוּ׃
    hebrewPlain: כי רצץ עזב דלים בית גזל ולא יבנהו
    kjvRefs:
    - Job 20:19
    kjvOsis:
    - Job.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.20
    scripture: tanakh
    name: Tanakh Job 20:20
    ref: Job 20:20
    book: Job
    section: ketuvim
    chapter: 20
    verse: 20
    ordinal: 19061
    text: Because he knew no quietness within him, In his greed he suffered nought to escape,
    translation: JPS 1917
    original: כִּי לֹא־יָדַע שָׁלֵו בְּבִטְנוֹ בַּחֲמוּדוֹ לֹא יְמַלֵּט׃
    hebrewPlain: כי לא ידע שלו בבטנו בחמודו לא ימלט
    kjvRefs:
    - Job 20:20
    kjvOsis:
    - Job.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.21
    scripture: tanakh
    name: Tanakh Job 20:21
    ref: Job 20:21
    book: Job
    section: ketuvim
    chapter: 20
    verse: 21
    ordinal: 19062
    text: There was nothing left that he devoured not— Therefore his prosperity shall not endure. .
    translation: JPS 1917
    original: אֵין־שָׂרִיד לְאָכְלוֹ עַל־כֵּן לֹא־יָחִיל טוּבוֹ׃
    hebrewPlain: אין שריד לאכלו על כן לא יחיל טובו
    kjvRefs:
    - Job 20:21
    kjvOsis:
    - Job.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.22
    scripture: tanakh
    name: Tanakh Job 20:22
    ref: Job 20:22
    book: Job
    section: ketuvim
    chapter: 20
    verse: 22
    ordinal: 19063
    text: In the fulness of his sufficiency he shall be in straits; The hand of every one that is in misery shall come upon him.
    translation: JPS 1917
    original: בִּמְלֹאות שִׂפְקוֹ יֵצֶר לוֹ כָּל־יַד עָמֵל תְּבוֹאֶנּוּ׃
    hebrewPlain: במלאות שפקו יצר לו כל יד עמל תבואנו
    kjvRefs:
    - Job 20:22
    kjvOsis:
    - Job.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.23
    scripture: tanakh
    name: Tanakh Job 20:23
    ref: Job 20:23
    book: Job
    section: ketuvim
    chapter: 20
    verse: 23
    ordinal: 19064
    text: It shall be for the filling of his belly; He shall cast the fierceness of His wrath upon him, And shall cause it to rain upon him into his flesh.
    translation: JPS 1917
    original: יְהִי לְמַלֵּא בִטְנוֹ יְשַׁלַּח־בּוֹ חֲרוֹן אַפּוֹ וְיַמְטֵר עָלֵימוֹ בִּלְחוּמוֹ׃
    hebrewPlain: יהי למלא בטנו ישלח בו חרון אפו וימטר עלימו בלחומו
    kjvRefs:
    - Job 20:23
    kjvOsis:
    - Job.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.24
    scripture: tanakh
    name: Tanakh Job 20:24
    ref: Job 20:24
    book: Job
    section: ketuvim
    chapter: 20
    verse: 24
    ordinal: 19065
    text: If he flee from the iron weapon, The bow of brass shall strike him through.
    translation: JPS 1917
    original: יִבְרַח מִנֵּשֶׁק בַּרְזֶל תַּחְלְפֵהוּ קֶשֶׁת נְחוּשָׁה׃
    hebrewPlain: יברח מנשק ברזל תחלפהו קשת נחושה
    kjvRefs:
    - Job 20:24
    kjvOsis:
    - Job.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.25
    scripture: tanakh
    name: Tanakh Job 20:25
    ref: Job 20:25
    book: Job
    section: ketuvim
    chapter: 20
    verse: 25
    ordinal: 19066
    text: He draweth it forth, and it cometh out of his body; Yea, the glittering point cometh out of his gall; Terrors are upon him.
    translation: JPS 1917
    original: שָׁלַף וַיֵּצֵא מִגֵּוָה וּבָרָק מִמְּרֹרָתוֹ יַהֲלֹךְ עָלָיו אֵמִים׃
    hebrewPlain: שלף ויצא מגוה וברק ממררתו יהלך עליו אמים
    kjvRefs:
    - Job 20:25
    kjvOsis:
    - Job.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.26
    scripture: tanakh
    name: Tanakh Job 20:26
    ref: Job 20:26
    book: Job
    section: ketuvim
    chapter: 20
    verse: 26
    ordinal: 19067
    text: All darkness is laid up for his treasures; A fire not blown by man shall consume him; It shall go ill with him that is left in his tent.
    translation: JPS 1917
    original: כָּל־חֹשֶׁךְ טָמוּן לִצְפּוּנָיו תְּאָכְלֵהוּ אֵשׁ לֹא־נֻפָּח יֵרַע שָׂרִיד בְּאָהֳלוֹ׃
    hebrewPlain: כל חשך טמון לצפוניו תאכלהו אש לא נפח ירע שריד באהלו
    kjvRefs:
    - Job 20:26
    kjvOsis:
    - Job.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.27
    scripture: tanakh
    name: Tanakh Job 20:27
    ref: Job 20:27
    book: Job
    section: ketuvim
    chapter: 20
    verse: 27
    ordinal: 19068
    text: The heavens shall reveal his iniquity, And the earth shall rise up against him.
    translation: JPS 1917
    original: יְגַלּוּ שָׁמַיִם עֲוֺנוֹ וְאֶרֶץ מִתְקוֹמָמָה לוֹ׃
    hebrewPlain: יגלו שמים עונו וארץ מתקוממה לו
    kjvRefs:
    - Job 20:27
    kjvOsis:
    - Job.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.28
    scripture: tanakh
    name: Tanakh Job 20:28
    ref: Job 20:28
    book: Job
    section: ketuvim
    chapter: 20
    verse: 28
    ordinal: 19069
    text: The increase of his house shall depart, His goods shall flow away in the day of his wrath.
    translation: JPS 1917
    original: יִגֶל יְבוּל בֵּיתוֹ נִגָּרוֹת בְּיוֹם אַפּוֹ׃
    hebrewPlain: יגל יבול ביתו נגרות ביום אפו
    kjvRefs:
    - Job 20:28
    kjvOsis:
    - Job.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.20.29
    scripture: tanakh
    name: Tanakh Job 20:29
    ref: Job 20:29
    book: Job
    section: ketuvim
    chapter: 20
    verse: 29
    ordinal: 19070
    text: This is the portion of a wicked man from God, And the heritage appointed unto him by God.
    translation: JPS 1917
    original: זֶה חֵלֶק־אָדָם רָשָׁע מֵאֱלֹהִים וְנַחֲלַת אִמְרוֹ מֵאֵל׃
    hebrewPlain: זה חלק אדם רשע מאלהים ונחלת אמרו מאל
    kjvRefs:
    - Job 20:29
    kjvOsis:
    - Job.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.20
- type: TanakhVerse
  data:
    osis: Job.21.1
    scripture: tanakh
    name: Tanakh Job 21:1
    ref: Job 21:1
    book: Job
    section: ketuvim
    chapter: 21
    verse: 1
    ordinal: 19071
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 21:1
    kjvOsis:
    - Job.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.2
    scripture: tanakh
    name: Tanakh Job 21:2
    ref: Job 21:2
    book: Job
    section: ketuvim
    chapter: 21
    verse: 2
    ordinal: 19072
    text: Hear diligently my speech; And let this be your consolations.
    translation: JPS 1917
    original: שִׁמְעוּ שָׁמוֹעַ מִלָּתִי וּתְהִי־זֹאת תַּנְחוּמֹתֵיכֶם׃
    hebrewPlain: שמעו שמוע מלתי ותהי זאת תנחומתיכם
    kjvRefs:
    - Job 21:2
    kjvOsis:
    - Job.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.3
    scripture: tanakh
    name: Tanakh Job 21:3
    ref: Job 21:3
    book: Job
    section: ketuvim
    chapter: 21
    verse: 3
    ordinal: 19073
    text: Suffer me, that I may speak; And after that I have spoken, mock on.
    translation: JPS 1917
    original: שָׂאוּנִי וְאָנֹכִי אֲדַבֵּר וְאַחַר דַּבְּרִי תַלְעִיג׃
    hebrewPlain: שאוני ואנכי אדבר ואחר דברי תלעיג
    kjvRefs:
    - Job 21:3
    kjvOsis:
    - Job.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.4
    scripture: tanakh
    name: Tanakh Job 21:4
    ref: Job 21:4
    book: Job
    section: ketuvim
    chapter: 21
    verse: 4
    ordinal: 19074
    text: As for me, is my complaint to man? Or why should I not be impatient?
    translation: JPS 1917
    original: הֶאָנֹכִי לְאָדָם שִׂיחִי וְאִם־מַדּוּעַ לֹא־תִקְצַר רוּחִי׃
    hebrewPlain: האנכי לאדם שיחי ואם מדוע לא תקצר רוחי
    kjvRefs:
    - Job 21:4
    kjvOsis:
    - Job.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.5
    scripture: tanakh
    name: Tanakh Job 21:5
    ref: Job 21:5
    book: Job
    section: ketuvim
    chapter: 21
    verse: 5
    ordinal: 19075
    text: Turn unto me, and be astonished, And lay your hand upon your mouth.
    translation: JPS 1917
    original: פְּנוּ־אֵלַי וְהָשַׁמּוּ וְשִׂימוּ יָד עַל־פֶּה׃
    hebrewPlain: פנו אלי והשמו ושימו יד על פה
    kjvRefs:
    - Job 21:5
    kjvOsis:
    - Job.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.6
    scripture: tanakh
    name: Tanakh Job 21:6
    ref: Job 21:6
    book: Job
    section: ketuvim
    chapter: 21
    verse: 6
    ordinal: 19076
    text: Even when I remember I am affrighted, And horror hath taketh hold on my flesh.
    translation: JPS 1917
    original: וְאִם־זָכַרְתִּי וְנִבְהָלְתִּי וְאָחַז בְּשָׂרִי פַּלָּצוּת׃
    hebrewPlain: ואם זכרתי ונבהלתי ואחז בשרי פלצות
    kjvRefs:
    - Job 21:6
    kjvOsis:
    - Job.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.7
    scripture: tanakh
    name: Tanakh Job 21:7
    ref: Job 21:7
    book: Job
    section: ketuvim
    chapter: 21
    verse: 7
    ordinal: 19077
    text: Wherefore do the wicked live, Become old, yea, wax mighty in power?
    translation: JPS 1917
    original: מַדּוּעַ רְשָׁעִים יִחְיוּ עָתְקוּ גַּם־גָּבְרוּ חָיִל׃
    hebrewPlain: מדוע רשעים יחיו עתקו גם גברו חיל
    kjvRefs:
    - Job 21:7
    kjvOsis:
    - Job.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.8
    scripture: tanakh
    name: Tanakh Job 21:8
    ref: Job 21:8
    book: Job
    section: ketuvim
    chapter: 21
    verse: 8
    ordinal: 19078
    text: Their seed is established in their sight with them, And their offspring before their eyes.
    translation: JPS 1917
    original: זַרְעָם נָכוֹן לִפְנֵיהֶם עִמָּם וְצֶאֱצָאֵיהֶם לְעֵינֵיהֶם׃
    hebrewPlain: זרעם נכון לפניהם עמם וצאצאיהם לעיניהם
    kjvRefs:
    - Job 21:8
    kjvOsis:
    - Job.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.9
    scripture: tanakh
    name: Tanakh Job 21:9
    ref: Job 21:9
    book: Job
    section: ketuvim
    chapter: 21
    verse: 9
    ordinal: 19079
    text: Their houses are safe, without fear, Neither is the rod of God upon them.
    translation: JPS 1917
    original: בָּתֵּיהֶם שָׁלוֹם מִפָּחַד וְלֹא שֵׁבֶט אֱלוֹהַּ עֲלֵיהֶם׃
    hebrewPlain: בתיהם שלום מפחד ולא שבט אלוה עליהם
    kjvRefs:
    - Job 21:9
    kjvOsis:
    - Job.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.10
    scripture: tanakh
    name: Tanakh Job 21:10
    ref: Job 21:10
    book: Job
    section: ketuvim
    chapter: 21
    verse: 10
    ordinal: 19080
    text: Their bull gendereth, and faileth not; Their cow calveth, and casteth not her calf.
    translation: JPS 1917
    original: שׁוֹרוֹ עִבַּר וְלֹא יַגְעִל תְּפַלֵּט פָּרָתוֹ וְלֹא תְשַׁכֵּל׃
    hebrewPlain: שורו עבר ולא יגעל תפלט פרתו ולא תשכל
    kjvRefs:
    - Job 21:10
    kjvOsis:
    - Job.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.11
    scripture: tanakh
    name: Tanakh Job 21:11
    ref: Job 21:11
    book: Job
    section: ketuvim
    chapter: 21
    verse: 11
    ordinal: 19081
    text: They send forth their little ones like a flock, And their children dance.
    translation: JPS 1917
    original: יְשַׁלְּחוּ כַצֹּאן עֲוִילֵיהֶם וְיַלְדֵיהֶם יְרַקֵּדוּן׃
    hebrewPlain: ישלחו כצאן עויליהם וילדיהם ירקדון
    kjvRefs:
    - Job 21:11
    kjvOsis:
    - Job.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.12
    scripture: tanakh
    name: Tanakh Job 21:12
    ref: Job 21:12
    book: Job
    section: ketuvim
    chapter: 21
    verse: 12
    ordinal: 19082
    text: They sing to the timbrel and harp, And rejoice at the sound of the pipe.
    translation: JPS 1917
    original: יִשְׂאוּ כְּתֹף וְכִנּוֹר וְיִשְׂמְחוּ לְקוֹל עוּגָב׃
    hebrewPlain: ישאו כתף וכנור וישמחו לקול עוגב
    kjvRefs:
    - Job 21:12
    kjvOsis:
    - Job.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.13
    scripture: tanakh
    name: Tanakh Job 21:13
    ref: Job 21:13
    book: Job
    section: ketuvim
    chapter: 21
    verse: 13
    ordinal: 19083
    text: They spend their days in prosperity, And peacefully they go down to the grave.
    translation: JPS 1917
    original: יבלו [יְכַלּוּ] בַטּוֹב יְמֵיהֶם וּבְרֶגַע שְׁאוֹל יֵחָתּוּ׃
    hebrewPlain: יבלו [יכלו] בטוב ימיהם וברגע שאול יחתו
    kjvRefs:
    - Job 21:13
    kjvOsis:
    - Job.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.14
    scripture: tanakh
    name: Tanakh Job 21:14
    ref: Job 21:14
    book: Job
    section: ketuvim
    chapter: 21
    verse: 14
    ordinal: 19084
    text: 'Yet they said unto God: ‘Depart from us; For we desire not the knowledge of Thy ways.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לָאֵל סוּר מִמֶּנּוּ וְדַעַת דְּרָכֶיךָ לֹא חָפָצְנוּ׃
    hebrewPlain: ויאמרו לאל סור ממנו ודעת דרכיך לא חפצנו
    kjvRefs:
    - Job 21:14
    kjvOsis:
    - Job.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.15
    scripture: tanakh
    name: Tanakh Job 21:15
    ref: Job 21:15
    book: Job
    section: ketuvim
    chapter: 21
    verse: 15
    ordinal: 19085
    text: What is the Almighty, that we should serve Him? And what profit should we have, if we pray unto Him?’—
    translation: JPS 1917
    original: מַה־שַׁדַּי כִּי־נַעַבְדֶנּוּ וּמַה־נּוֹעִיל כִּי נִפְגַּע־בּוֹ׃
    hebrewPlain: מה שדי כי נעבדנו ומה נועיל כי נפגע בו
    kjvRefs:
    - Job 21:15
    kjvOsis:
    - Job.21.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.16
    scripture: tanakh
    name: Tanakh Job 21:16
    ref: Job 21:16
    book: Job
    section: ketuvim
    chapter: 21
    verse: 16
    ordinal: 19086
    text: Lo, their prosperity is not in their hand; The counsel of the wicked is far from me.
    translation: JPS 1917
    original: הֵן לֹא בְיָדָם טוּבָם עֲצַת רְשָׁעִים רָחֲקָה מֶנִּי׃
    hebrewPlain: הן לא בידם טובם עצת רשעים רחקה מני
    kjvRefs:
    - Job 21:16
    kjvOsis:
    - Job.21.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.17
    scripture: tanakh
    name: Tanakh Job 21:17
    ref: Job 21:17
    book: Job
    section: ketuvim
    chapter: 21
    verse: 17
    ordinal: 19087
    text: How oft is it that the lamp of the wicked is put out? That their calamity cometh upon them? That He distributeth pains in His anger?
    translation: JPS 1917
    original: כַּמָּה נֵר־רְשָׁעִים יִדְעָךְ וְיָבֹא עָלֵימוֹ אֵידָם חֲבָלִים יְחַלֵּק בְּאַפּוֹ׃
    hebrewPlain: כמה נר רשעים ידעך ויבא עלימו אידם חבלים יחלק באפו
    kjvRefs:
    - Job 21:17
    kjvOsis:
    - Job.21.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.18
    scripture: tanakh
    name: Tanakh Job 21:18
    ref: Job 21:18
    book: Job
    section: ketuvim
    chapter: 21
    verse: 18
    ordinal: 19088
    text: That they are as stubble before the wind, And as chaff that the storm stealeth away?
    translation: JPS 1917
    original: יִהְיוּ כְּתֶבֶן לִפְנֵי־רוּחַ וּכְמֹץ גְּנָבַתּוּ סוּפָה׃
    hebrewPlain: יהיו כתבן לפני רוח וכמץ גנבתו סופה
    kjvRefs:
    - Job 21:18
    kjvOsis:
    - Job.21.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.19
    scripture: tanakh
    name: Tanakh Job 21:19
    ref: Job 21:19
    book: Job
    section: ketuvim
    chapter: 21
    verse: 19
    ordinal: 19089
    text: ’God layeth up his iniquity for his children! ’— Let Him recompense it unto himself, that he may know it.
    translation: JPS 1917
    original: אֱלוֹהַּ יִצְפֹּן־לְבָנָיו אוֹנוֹ יְשַׁלֵּם אֵלָיו וְיֵדָע׃
    hebrewPlain: אלוה יצפן לבניו אונו ישלם אליו וידע
    kjvRefs:
    - Job 21:19
    kjvOsis:
    - Job.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.20
    scripture: tanakh
    name: Tanakh Job 21:20
    ref: Job 21:20
    book: Job
    section: ketuvim
    chapter: 21
    verse: 20
    ordinal: 19090
    text: Let his own eyes see his destruction, And let him drink of the wrath of the Almighty.
    translation: JPS 1917
    original: יִרְאוּ עינו [עֵינָיו] כִּידוֹ וּמֵחֲמַת שַׁדַּי יִשְׁתֶּה׃
    hebrewPlain: יראו עינו [עיניו] כידו ומחמת שדי ישתה
    kjvRefs:
    - Job 21:20
    kjvOsis:
    - Job.21.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.21
    scripture: tanakh
    name: Tanakh Job 21:21
    ref: Job 21:21
    book: Job
    section: ketuvim
    chapter: 21
    verse: 21
    ordinal: 19091
    text: For what pleasure hath he in his house after him? Seeing the number of his months is determined.
    translation: JPS 1917
    original: כִּי מַה־חֶפְצוֹ בְּבֵיתוֹ אַחֲרָיו וּמִסְפַּר חֳדָשָׁיו חֻצָּצוּ׃
    hebrewPlain: כי מה חפצו בביתו אחריו ומספר חדשיו חצצו
    kjvRefs:
    - Job 21:21
    kjvOsis:
    - Job.21.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.22
    scripture: tanakh
    name: Tanakh Job 21:22
    ref: Job 21:22
    book: Job
    section: ketuvim
    chapter: 21
    verse: 22
    ordinal: 19092
    text: Shall any teach God knowledge? Seeing it is He that judgeth those that are high.
    translation: JPS 1917
    original: הַלְאֵל יְלַמֶּד־דָּעַת וְהוּא רָמִים יִשְׁפּוֹט׃
    hebrewPlain: הלאל ילמד דעת והוא רמים ישפוט
    kjvRefs:
    - Job 21:22
    kjvOsis:
    - Job.21.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.23
    scripture: tanakh
    name: Tanakh Job 21:23
    ref: Job 21:23
    book: Job
    section: ketuvim
    chapter: 21
    verse: 23
    ordinal: 19093
    text: One dieth in his full strength, Being wholly at ease and quiet;
    translation: JPS 1917
    original: זֶה יָמוּת בְּעֶצֶם תֻּמּוֹ כֻּלּוֹ שַׁלְאֲנַן וְשָׁלֵיו׃
    hebrewPlain: זה ימות בעצם תמו כלו שלאנן ושליו
    kjvRefs:
    - Job 21:23
    kjvOsis:
    - Job.21.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.24
    scripture: tanakh
    name: Tanakh Job 21:24
    ref: Job 21:24
    book: Job
    section: ketuvim
    chapter: 21
    verse: 24
    ordinal: 19094
    text: His pails are full of milk, And the marrow of his bones is moistened.
    translation: JPS 1917
    original: עֲטִינָיו מָלְאוּ חָלָב וּמֹחַ עַצְמוֹתָיו יְשֻׁקֶּה׃
    hebrewPlain: עטיניו מלאו חלב ומח עצמותיו ישקה
    kjvRefs:
    - Job 21:24
    kjvOsis:
    - Job.21.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.25
    scripture: tanakh
    name: Tanakh Job 21:25
    ref: Job 21:25
    book: Job
    section: ketuvim
    chapter: 21
    verse: 25
    ordinal: 19095
    text: And another dieth in bitterness of soul, And hath never tasted of good.
    translation: JPS 1917
    original: וְזֶה יָמוּת בְּנֶפֶשׁ מָרָה וְלֹא־אָכַל בַּטּוֹבָה׃
    hebrewPlain: וזה ימות בנפש מרה ולא אכל בטובה
    kjvRefs:
    - Job 21:25
    kjvOsis:
    - Job.21.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.26
    scripture: tanakh
    name: Tanakh Job 21:26
    ref: Job 21:26
    book: Job
    section: ketuvim
    chapter: 21
    verse: 26
    ordinal: 19096
    text: They lie down alike in the dust, And the worm covereth them.
    translation: JPS 1917
    original: יַחַד עַל־עָפָר יִשְׁכָּבוּ וְרִמָּה תְּכַסֶּה עֲלֵיהֶם׃
    hebrewPlain: יחד על עפר ישכבו ורמה תכסה עליהם
    kjvRefs:
    - Job 21:26
    kjvOsis:
    - Job.21.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.27
    scripture: tanakh
    name: Tanakh Job 21:27
    ref: Job 21:27
    book: Job
    section: ketuvim
    chapter: 21
    verse: 27
    ordinal: 19097
    text: Behold, I know your thoughts, And the devices which ye wrongfully imagine against me.
    translation: JPS 1917
    original: הֵן יָדַעְתִּי מַחְשְׁבוֹתֵיכֶם וּמְזִמּוֹת עָלַי תַּחְמֹסוּ׃
    hebrewPlain: הן ידעתי מחשבותיכם ומזמות עלי תחמסו
    kjvRefs:
    - Job 21:27
    kjvOsis:
    - Job.21.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.28
    scripture: tanakh
    name: Tanakh Job 21:28
    ref: Job 21:28
    book: Job
    section: ketuvim
    chapter: 21
    verse: 28
    ordinal: 19098
    text: 'For ye say: ‘Where is the house of the prince? And where is the tent wherein the wicked dwelt?’'
    translation: JPS 1917
    original: כִּי תֹאמְרוּ אַיֵּה בֵית־נָדִיב וְאַיֵּה אֹהֶל מִשְׁכְּנוֹת רְשָׁעִים׃
    hebrewPlain: כי תאמרו איה בית נדיב ואיה אהל משכנות רשעים
    kjvRefs:
    - Job 21:28
    kjvOsis:
    - Job.21.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.29
    scripture: tanakh
    name: Tanakh Job 21:29
    ref: Job 21:29
    book: Job
    section: ketuvim
    chapter: 21
    verse: 29
    ordinal: 19099
    text: Have ye not asked them that go by the way; And will ye misdeem their tokens,
    translation: JPS 1917
    original: הֲלֹא שְׁאֶלְתֶּם עוֹבְרֵי דָרֶךְ וְאֹתֹתָם לֹא תְנַכֵּרוּ׃
    hebrewPlain: הלא שאלתם עוברי דרך ואתתם לא תנכרו
    kjvRefs:
    - Job 21:29
    kjvOsis:
    - Job.21.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.30
    scripture: tanakh
    name: Tanakh Job 21:30
    ref: Job 21:30
    book: Job
    section: ketuvim
    chapter: 21
    verse: 30
    ordinal: 19100
    text: That the evil man is reserved to the day of calamity, That they are led forth to the day of wrath?
    translation: JPS 1917
    original: כִּי לְיוֹם אֵיד יֵחָשֶׂךְ רָע לְיוֹם עֲבָרוֹת יוּבָלוּ׃
    hebrewPlain: כי ליום איד יחשך רע ליום עברות יובלו
    kjvRefs:
    - Job 21:30
    kjvOsis:
    - Job.21.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.31
    scripture: tanakh
    name: Tanakh Job 21:31
    ref: Job 21:31
    book: Job
    section: ketuvim
    chapter: 21
    verse: 31
    ordinal: 19101
    text: But who shall declare his way to his face? And who shall repay him what he hath done?
    translation: JPS 1917
    original: מִי־יַגִּיד עַל־פָּנָיו דַּרְכּוֹ וְהוּא־עָשָׂה מִי יְשַׁלֶּם־לוֹ׃
    hebrewPlain: מי יגיד על פניו דרכו והוא עשה מי ישלם לו
    kjvRefs:
    - Job 21:31
    kjvOsis:
    - Job.21.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.32
    scripture: tanakh
    name: Tanakh Job 21:32
    ref: Job 21:32
    book: Job
    section: ketuvim
    chapter: 21
    verse: 32
    ordinal: 19102
    text: For he is borne to the grave, And watch is kept over his tomb.
    translation: JPS 1917
    original: וְהוּא לִקְבָרוֹת יוּבָל וְעַל־גָּדִישׁ יִשְׁקוֹד׃
    hebrewPlain: והוא לקברות יובל ועל גדיש ישקוד
    kjvRefs:
    - Job 21:32
    kjvOsis:
    - Job.21.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.33
    scripture: tanakh
    name: Tanakh Job 21:33
    ref: Job 21:33
    book: Job
    section: ketuvim
    chapter: 21
    verse: 33
    ordinal: 19103
    text: The clods of the valley are sweet unto him, And all men draw after him, As there were innumerable before him.
    translation: JPS 1917
    original: מָתְקוּ־לוֹ רִגְבֵי נָחַל וְאַחֲרָיו כָּל־אָדָם יִמְשׁוֹךְ וּלְפָנָיו אֵין מִסְפָּר׃
    hebrewPlain: מתקו לו רגבי נחל ואחריו כל אדם ימשוך ולפניו אין מספר
    kjvRefs:
    - Job 21:33
    kjvOsis:
    - Job.21.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.21.34
    scripture: tanakh
    name: Tanakh Job 21:34
    ref: Job 21:34
    book: Job
    section: ketuvim
    chapter: 21
    verse: 34
    ordinal: 19104
    text: How then comfort ye me in vain? And as for your answers, there remaineth only faithlessness?
    translation: JPS 1917
    original: וְאֵיךְ תְּנַחֲמוּנִי הָבֶל וּתְשׁוּבֹתֵיכֶם נִשְׁאַר־מָעַל׃
    hebrewPlain: ואיך תנחמוני הבל ותשובתיכם נשאר מעל
    kjvRefs:
    - Job 21:34
    kjvOsis:
    - Job.21.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.21
- type: TanakhVerse
  data:
    osis: Job.22.1
    scripture: tanakh
    name: Tanakh Job 22:1
    ref: Job 22:1
    book: Job
    section: ketuvim
    chapter: 22
    verse: 1
    ordinal: 19105
    text: 'Then answered Eliphaz the Temanite, and said:'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיפַז הַתֵּמָנִי וַיֹּאמַר׃
    hebrewPlain: ויען אליפז התמני ויאמר
    kjvRefs:
    - Job 22:1
    kjvOsis:
    - Job.22.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.2
    scripture: tanakh
    name: Tanakh Job 22:2
    ref: Job 22:2
    book: Job
    section: ketuvim
    chapter: 22
    verse: 2
    ordinal: 19106
    text: Can a man be profitable unto God? Or can he that is wise be profitable unto Him?
    translation: JPS 1917
    original: הַלְאֵל יִסְכָּן־גָּבֶר כִּי־יִסְכֹּן עָלֵימוֹ מַשְׂכִּיל׃
    hebrewPlain: הלאל יסכן גבר כי יסכן עלימו משכיל
    kjvRefs:
    - Job 22:2
    kjvOsis:
    - Job.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.3
    scripture: tanakh
    name: Tanakh Job 22:3
    ref: Job 22:3
    book: Job
    section: ketuvim
    chapter: 22
    verse: 3
    ordinal: 19107
    text: Is it any advantage to the Almighty, that thou art righteous? Or is it gain to Him, that thou makest thy ways blameless?
    translation: JPS 1917
    original: הַחֵפֶץ לְשַׁדַּי כִּי תִצְדָּק וְאִם־בֶּצַע כִּי־תַתֵּם דְּרָכֶיךָ׃
    hebrewPlain: החפץ לשדי כי תצדק ואם בצע כי תתם דרכיך
    kjvRefs:
    - Job 22:3
    kjvOsis:
    - Job.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.4
    scripture: tanakh
    name: Tanakh Job 22:4
    ref: Job 22:4
    book: Job
    section: ketuvim
    chapter: 22
    verse: 4
    ordinal: 19108
    text: Is it for thy fear of Him that He reproveth thee, That He entereth with thee into judgment?
    translation: JPS 1917
    original: הֲמִיִּרְאָתְךָ יֹכִיחֶךָ יָבוֹא עִמְּךָ בַּמִּשְׁפָּט׃
    hebrewPlain: המיראתך יכיחך יבוא עמך במשפט
    kjvRefs:
    - Job 22:4
    kjvOsis:
    - Job.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.5
    scripture: tanakh
    name: Tanakh Job 22:5
    ref: Job 22:5
    book: Job
    section: ketuvim
    chapter: 22
    verse: 5
    ordinal: 19109
    text: Is not thy wickedness great? And are not thine iniquities without end?
    translation: JPS 1917
    original: הֲלֹא רָעָתְךָ רַבָּה וְאֵין־קֵץ לַעֲוֺנֹתֶיךָ׃
    hebrewPlain: הלא רעתך רבה ואין קץ לעונתיך
    kjvRefs:
    - Job 22:5
    kjvOsis:
    - Job.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.6
    scripture: tanakh
    name: Tanakh Job 22:6
    ref: Job 22:6
    book: Job
    section: ketuvim
    chapter: 22
    verse: 6
    ordinal: 19110
    text: For thou hast taken pledges of thy brother for nought, And stripped the naked of their clothing.
    translation: JPS 1917
    original: כִּי־תַחְבֹּל אַחֶיךָ חִנָּם וּבִגְדֵי עֲרוּמִּים תַּפְשִׁיט׃
    hebrewPlain: כי תחבל אחיך חנם ובגדי ערומים תפשיט
    kjvRefs:
    - Job 22:6
    kjvOsis:
    - Job.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.7
    scripture: tanakh
    name: Tanakh Job 22:7
    ref: Job 22:7
    book: Job
    section: ketuvim
    chapter: 22
    verse: 7
    ordinal: 19111
    text: Thou hast not given water to the weary to drink, And thou hast withholden bread from the hungry.
    translation: JPS 1917
    original: לֹא־מַיִם עָיֵף תַּשְׁקֶה וּמֵרָעֵב תִּמְנַע־לָחֶם׃
    hebrewPlain: לא מים עיף תשקה ומרעב תמנע לחם
    kjvRefs:
    - Job 22:7
    kjvOsis:
    - Job.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.8
    scripture: tanakh
    name: Tanakh Job 22:8
    ref: Job 22:8
    book: Job
    section: ketuvim
    chapter: 22
    verse: 8
    ordinal: 19112
    text: And as a mighty man, who hath the earth, And as a man of rank, who dwelleth in it,
    translation: JPS 1917
    original: וְאִישׁ זְרוֹעַ לוֹ הָאָרֶץ וּנְשׂוּא פָנִים יֵשֶׁב בָּהּ׃
    hebrewPlain: ואיש זרוע לו הארץ ונשוא פנים ישב בה
    kjvRefs:
    - Job 22:8
    kjvOsis:
    - Job.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.9
    scripture: tanakh
    name: Tanakh Job 22:9
    ref: Job 22:9
    book: Job
    section: ketuvim
    chapter: 22
    verse: 9
    ordinal: 19113
    text: Thou hast sent widows away empty, And the arms of the fatherless have been broken.
    translation: JPS 1917
    original: אַלְמָנוֹת שִׁלַּחְתָּ רֵיקָם וּזְרֹעוֹת יְתֹמִים יְדֻכָּא׃
    hebrewPlain: אלמנות שלחת ריקם וזרעות יתמים ידכא
    kjvRefs:
    - Job 22:9
    kjvOsis:
    - Job.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.10
    scripture: tanakh
    name: Tanakh Job 22:10
    ref: Job 22:10
    book: Job
    section: ketuvim
    chapter: 22
    verse: 10
    ordinal: 19114
    text: Therefore snares are round about thee, And sudden dread affrighted thee,
    translation: JPS 1917
    original: עַל־כֵּן סְבִיבוֹתֶיךָ פַחִים וִיבַהֶלְךָ פַּחַד פִּתְאֹם׃
    hebrewPlain: על כן סביבותיך פחים ויבהלך פחד פתאם
    kjvRefs:
    - Job 22:10
    kjvOsis:
    - Job.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.11
    scripture: tanakh
    name: Tanakh Job 22:11
    ref: Job 22:11
    book: Job
    section: ketuvim
    chapter: 22
    verse: 11
    ordinal: 19115
    text: Or darkness, that thou canst not see, And abundance of waters cover thee.
    translation: JPS 1917
    original: אוֹ־חֹשֶׁךְ לֹא־תִרְאֶה וְשִׁפְעַת־מַיִם תְּכַסֶּךָּ׃
    hebrewPlain: או חשך לא תראה ושפעת מים תכסך
    kjvRefs:
    - Job 22:11
    kjvOsis:
    - Job.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.12
    scripture: tanakh
    name: Tanakh Job 22:12
    ref: Job 22:12
    book: Job
    section: ketuvim
    chapter: 22
    verse: 12
    ordinal: 19116
    text: Is not God in the height of heaven? And behold the topmost of the stars, how high they are!
    translation: JPS 1917
    original: הֲ‍לֹא־אֱלוֹהַּ גֹּבַהּ שָׁמָיִם וּרְאֵה רֹאשׁ כּוֹכָבִים כִּי־רָמּוּ׃
    hebrewPlain: ה‍לא אלוה גבה שמים וראה ראש כוכבים כי רמו
    kjvRefs:
    - Job 22:12
    kjvOsis:
    - Job.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.13
    scripture: tanakh
    name: Tanakh Job 22:13
    ref: Job 22:13
    book: Job
    section: ketuvim
    chapter: 22
    verse: 13
    ordinal: 19117
    text: 'And thou sayest: ‘What doth God know? Can He judge through the dark cloud?'
    translation: JPS 1917
    original: וְאָמַרְתָּ מַה־יָּדַע אֵל הַבְעַד עֲרָפֶל יִשְׁפּוֹט׃
    hebrewPlain: ואמרת מה ידע אל הבעד ערפל ישפוט
    kjvRefs:
    - Job 22:13
    kjvOsis:
    - Job.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.14
    scripture: tanakh
    name: Tanakh Job 22:14
    ref: Job 22:14
    book: Job
    section: ketuvim
    chapter: 22
    verse: 14
    ordinal: 19118
    text: Thick clouds are a covering to Him, that He seeth not; And He walketh in the circuit of heaven.’
    translation: JPS 1917
    original: עָבִים סֵתֶר־לוֹ וְלֹא יִרְאֶה וְחוּג שָׁמַיִם יִתְהַלָּךְ׃
    hebrewPlain: עבים סתר לו ולא יראה וחוג שמים יתהלך
    kjvRefs:
    - Job 22:14
    kjvOsis:
    - Job.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.15
    scripture: tanakh
    name: Tanakh Job 22:15
    ref: Job 22:15
    book: Job
    section: ketuvim
    chapter: 22
    verse: 15
    ordinal: 19119
    text: Wilt thou keep the old way Which wicked men have trodden?
    translation: JPS 1917
    original: הַאֹרַח עוֹלָם תִּשְׁמֹר אֲשֶׁר דָּרְכוּ מְתֵי־אָוֶן׃
    hebrewPlain: הארח עולם תשמר אשר דרכו מתי און
    kjvRefs:
    - Job 22:15
    kjvOsis:
    - Job.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.16
    scripture: tanakh
    name: Tanakh Job 22:16
    ref: Job 22:16
    book: Job
    section: ketuvim
    chapter: 22
    verse: 16
    ordinal: 19120
    text: Who were snatched away before their time, Whose foundation was poured out as a stream;
    translation: JPS 1917
    original: אֲשֶׁר־קֻמְּטוּ וְלֹא־עֵת נָהָר יוּצַק יְסוֹדָם׃
    hebrewPlain: אשר קמטו ולא עת נהר יוצק יסודם
    kjvRefs:
    - Job 22:16
    kjvOsis:
    - Job.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.17
    scripture: tanakh
    name: Tanakh Job 22:17
    ref: Job 22:17
    book: Job
    section: ketuvim
    chapter: 22
    verse: 17
    ordinal: 19121
    text: 'Who said unto God: ‘Depart from us’; And what could the Almighty do unto them?'
    translation: JPS 1917
    original: הָאֹמְרִים לָאֵל סוּר מִמֶּנּוּ וּמַה־יִּפְעַל שַׁדַּי לָמוֹ׃
    hebrewPlain: האמרים לאל סור ממנו ומה יפעל שדי למו
    kjvRefs:
    - Job 22:17
    kjvOsis:
    - Job.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.18
    scripture: tanakh
    name: Tanakh Job 22:18
    ref: Job 22:18
    book: Job
    section: ketuvim
    chapter: 22
    verse: 18
    ordinal: 19122
    text: Yet He filled their houses with good things— But the counsel of the wicked is far from me.
    translation: JPS 1917
    original: וְהוּא מִלֵּא בָתֵּיהֶם טוֹב וַעֲצַת רְשָׁעִים רָחֲקָה מֶנִּי׃
    hebrewPlain: והוא מלא בתיהם טוב ועצת רשעים רחקה מני
    kjvRefs:
    - Job 22:18
    kjvOsis:
    - Job.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.19
    scripture: tanakh
    name: Tanakh Job 22:19
    ref: Job 22:19
    book: Job
    section: ketuvim
    chapter: 22
    verse: 19
    ordinal: 19123
    text: 'The righteous saw it, and were glad, And the innocent laugh them to scorn:'
    translation: JPS 1917
    original: יִרְאוּ צַדִּיקִים וְיִשְׂמָחוּ וְנָקִי יִלְעַג־לָמוֹ׃
    hebrewPlain: יראו צדיקים וישמחו ונקי ילעג למו
    kjvRefs:
    - Job 22:19
    kjvOsis:
    - Job.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.20
    scripture: tanakh
    name: Tanakh Job 22:20
    ref: Job 22:20
    book: Job
    section: ketuvim
    chapter: 22
    verse: 20
    ordinal: 19124
    text: ’Surely their substance is cut off, And their abundance the fire hath consumed.’
    translation: JPS 1917
    original: אִם־לֹא נִכְחַד קִימָנוּ וְיִתְרָם אָכְלָה אֵשׁ׃
    hebrewPlain: אם לא נכחד קימנו ויתרם אכלה אש
    kjvRefs:
    - Job 22:20
    kjvOsis:
    - Job.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.21
    scripture: tanakh
    name: Tanakh Job 22:21
    ref: Job 22:21
    book: Job
    section: ketuvim
    chapter: 22
    verse: 21
    ordinal: 19125
    text: Acquaint now thyself with Him, and be at peace; Thereby shall thine increase be good.
    translation: JPS 1917
    original: הַסְכֶּן־נָא עִמּוֹ וּשְׁלם בָּהֶם תְּבוֹאַתְךָ טוֹבָה׃
    hebrewPlain: הסכן נא עמו ושלם בהם תבואתך טובה
    kjvRefs:
    - Job 22:21
    kjvOsis:
    - Job.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.22
    scripture: tanakh
    name: Tanakh Job 22:22
    ref: Job 22:22
    book: Job
    section: ketuvim
    chapter: 22
    verse: 22
    ordinal: 19126
    text: Receive, I pray thee, instruction from His mouth, And lay up His words in thy heart.
    translation: JPS 1917
    original: קַח־נָא מִפִּיו תּוֹרָה וְשִׂים אֲמָרָיו בִּלְבָבֶךָ׃
    hebrewPlain: קח נא מפיו תורה ושים אמריו בלבבך
    kjvRefs:
    - Job 22:22
    kjvOsis:
    - Job.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.23
    scripture: tanakh
    name: Tanakh Job 22:23
    ref: Job 22:23
    book: Job
    section: ketuvim
    chapter: 22
    verse: 23
    ordinal: 19127
    text: If thou return to the Almighty, thou shalt be built up— If thou put away unrighteousness far from thy tents,
    translation: JPS 1917
    original: אִם־תָּשׁוּב עַד־שַׁדַּי תִּבָּנֶה תַּרְחִיק עַוְלָה מֵאָהֳלֶךָ׃
    hebrewPlain: אם תשוב עד שדי תבנה תרחיק עולה מאהלך
    kjvRefs:
    - Job 22:23
    kjvOsis:
    - Job.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.24
    scripture: tanakh
    name: Tanakh Job 22:24
    ref: Job 22:24
    book: Job
    section: ketuvim
    chapter: 22
    verse: 24
    ordinal: 19128
    text: And lay thy treasure in the dust, And the gold of Ophir among the stones of the brooks;
    translation: JPS 1917
    original: וְשִׁית־עַל־עָפָר בָּצֶר וּבְצוּר נְחָלִים אוֹפִיר׃
    hebrewPlain: ושית על עפר בצר ובצור נחלים אופיר
    kjvRefs:
    - Job 22:24
    kjvOsis:
    - Job.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.25
    scripture: tanakh
    name: Tanakh Job 22:25
    ref: Job 22:25
    book: Job
    section: ketuvim
    chapter: 22
    verse: 25
    ordinal: 19129
    text: And the Almighty be thy treasure, And precious silver unto thee;
    translation: JPS 1917
    original: וְהָיָה שַׁדַּי בְּצָרֶיךָ וְכֶסֶף תּוֹעָפוֹת לָךְ׃
    hebrewPlain: והיה שדי בצריך וכסף תועפות לך
    kjvRefs:
    - Job 22:25
    kjvOsis:
    - Job.22.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.26
    scripture: tanakh
    name: Tanakh Job 22:26
    ref: Job 22:26
    book: Job
    section: ketuvim
    chapter: 22
    verse: 26
    ordinal: 19130
    text: Then surely shalt thou have thy delight in the Almighty, And shalt lift up thy face unto God.
    translation: JPS 1917
    original: כִּי־אָז עַל־שַׁדַּי תִּתְעַנָּג וְתִשָּׂא אֶל־אֱלוֹהַּ פָּנֶיךָ׃
    hebrewPlain: כי אז על שדי תתענג ותשא אל אלוה פניך
    kjvRefs:
    - Job 22:26
    kjvOsis:
    - Job.22.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.27
    scripture: tanakh
    name: Tanakh Job 22:27
    ref: Job 22:27
    book: Job
    section: ketuvim
    chapter: 22
    verse: 27
    ordinal: 19131
    text: Thou shalt make thy prayer unto Him, and He will hear thee, And thou shalt pay thy vows;
    translation: JPS 1917
    original: תַּעְתִּיר אֵלָיו וְיִשְׁמָעֶךָּ וּנְדָרֶיךָ תְשַׁלֵּם׃
    hebrewPlain: תעתיר אליו וישמעך ונדריך תשלם
    kjvRefs:
    - Job 22:27
    kjvOsis:
    - Job.22.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.28
    scripture: tanakh
    name: Tanakh Job 22:28
    ref: Job 22:28
    book: Job
    section: ketuvim
    chapter: 22
    verse: 28
    ordinal: 19132
    text: Thou shalt also decree a thing, and it shall be established unto thee, And light shall shine upon thy ways.
    translation: JPS 1917
    original: וְתִגְזַר־אוֹמֶר וְיָקָם לָךְ וְעַל־דְּרָכֶיךָ נָגַהּ אוֹר׃
    hebrewPlain: ותגזר אומר ויקם לך ועל דרכיך נגה אור
    kjvRefs:
    - Job 22:28
    kjvOsis:
    - Job.22.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.29
    scripture: tanakh
    name: Tanakh Job 22:29
    ref: Job 22:29
    book: Job
    section: ketuvim
    chapter: 22
    verse: 29
    ordinal: 19133
    text: 'When they cast thee down, thou shalt say: ‘There is lifting up’; For the humble person He saveth.'
    translation: JPS 1917
    original: כִּי־הִשְׁפִּילוּ וַתֹּאמֶר גֵּוָה וְשַׁח עֵינַיִם יוֹשִׁעַ׃
    hebrewPlain: כי השפילו ותאמר גוה ושח עינים יושע
    kjvRefs:
    - Job 22:29
    kjvOsis:
    - Job.22.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.22.30
    scripture: tanakh
    name: Tanakh Job 22:30
    ref: Job 22:30
    book: Job
    section: ketuvim
    chapter: 22
    verse: 30
    ordinal: 19134
    text: He delivereth him that is innocent, Yea, thou shalt be delivered through the cleanness of thy hands.
    translation: JPS 1917
    original: יְמַלֵּט אִי־נָקִי וְנִמְלַט בְּבֹר כַּפֶּיךָ׃
    hebrewPlain: ימלט אי נקי ונמלט בבר כפיך
    kjvRefs:
    - Job 22:30
    kjvOsis:
    - Job.22.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.22
- type: TanakhVerse
  data:
    osis: Job.23.1
    scripture: tanakh
    name: Tanakh Job 23:1
    ref: Job 23:1
    book: Job
    section: ketuvim
    chapter: 23
    verse: 1
    ordinal: 19135
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 23:1
    kjvOsis:
    - Job.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.2
    scripture: tanakh
    name: Tanakh Job 23:2
    ref: Job 23:2
    book: Job
    section: ketuvim
    chapter: 23
    verse: 2
    ordinal: 19136
    text: Even to-day is my complaint bitter; My hand is become heavy because of my groaning.
    translation: JPS 1917
    original: גַּם־הַיּוֹם מְרִי שִׂחִי יָדִי כָּבְדָה עַל־אַנְחָתִי׃
    hebrewPlain: גם היום מרי שחי ידי כבדה על אנחתי
    kjvRefs:
    - Job 23:2
    kjvOsis:
    - Job.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.3
    scripture: tanakh
    name: Tanakh Job 23:3
    ref: Job 23:3
    book: Job
    section: ketuvim
    chapter: 23
    verse: 3
    ordinal: 19137
    text: Oh that I knew where I might find Him, That I might come even to His seat!
    translation: JPS 1917
    original: מִי־יִתֵּן יָדַעְתִּי וְאֶמְצָאֵהוּ אָבוֹא עַד־תְּכוּנָתוֹ׃
    hebrewPlain: מי יתן ידעתי ואמצאהו אבוא עד תכונתו
    kjvRefs:
    - Job 23:3
    kjvOsis:
    - Job.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.4
    scripture: tanakh
    name: Tanakh Job 23:4
    ref: Job 23:4
    book: Job
    section: ketuvim
    chapter: 23
    verse: 4
    ordinal: 19138
    text: I would order my cause before Him, And fill my mouth with arguments.
    translation: JPS 1917
    original: אֶעֶרְכָה לְפָנָיו מִשְׁפָּט וּפִי אֲמַלֵּא תוֹכָחוֹת׃
    hebrewPlain: אערכה לפניו משפט ופי אמלא תוכחות
    kjvRefs:
    - Job 23:4
    kjvOsis:
    - Job.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.5
    scripture: tanakh
    name: Tanakh Job 23:5
    ref: Job 23:5
    book: Job
    section: ketuvim
    chapter: 23
    verse: 5
    ordinal: 19139
    text: I would know the words which He would answer me, And understand what He would say unto me.
    translation: JPS 1917
    original: אֵדְעָה מִלִּים יַעֲנֵנִי וְאָבִינָה מַה־יֹּאמַר לִי׃
    hebrewPlain: אדעה מלים יענני ואבינה מה יאמר לי
    kjvRefs:
    - Job 23:5
    kjvOsis:
    - Job.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.6
    scripture: tanakh
    name: Tanakh Job 23:6
    ref: Job 23:6
    book: Job
    section: ketuvim
    chapter: 23
    verse: 6
    ordinal: 19140
    text: Would He contend with me in His great power? Nay; but He would give heed unto me.
    translation: JPS 1917
    original: הַבְּרָב־כֹּחַ יָרִיב עִמָּדִי לֹא אַךְ־הוּא יָשִׂם בִּי׃
    hebrewPlain: הברב כח יריב עמדי לא אך הוא ישם בי
    kjvRefs:
    - Job 23:6
    kjvOsis:
    - Job.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.7
    scripture: tanakh
    name: Tanakh Job 23:7
    ref: Job 23:7
    book: Job
    section: ketuvim
    chapter: 23
    verse: 7
    ordinal: 19141
    text: There the upright might reason with Him; So should I be delivered for ever from my Judge.
    translation: JPS 1917
    original: שָׁם יָשָׁר נוֹכָח עִמּוֹ וַאֲפַלְּטָה לָנֶצַח מִשֹּׁפְטִי׃
    hebrewPlain: שם ישר נוכח עמו ואפלטה לנצח משפטי
    kjvRefs:
    - Job 23:7
    kjvOsis:
    - Job.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.8
    scripture: tanakh
    name: Tanakh Job 23:8
    ref: Job 23:8
    book: Job
    section: ketuvim
    chapter: 23
    verse: 8
    ordinal: 19142
    text: Behold, I go forward, but He is not there, And backward, but I cannot perceive Him;
    translation: JPS 1917
    original: הֵן קֶדֶם אֶהֱלֹךְ וְאֵינֶנּוּ וְאָחוֹר וְלֹא־אָבִין לוֹ׃
    hebrewPlain: הן קדם אהלך ואיננו ואחור ולא אבין לו
    kjvRefs:
    - Job 23:8
    kjvOsis:
    - Job.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.9
    scripture: tanakh
    name: Tanakh Job 23:9
    ref: Job 23:9
    book: Job
    section: ketuvim
    chapter: 23
    verse: 9
    ordinal: 19143
    text: On the left hand, when He doth work, but I cannot behold Him, He turneth Himself to the right hand, but I cannot see Him.
    translation: JPS 1917
    original: שְׂמֹאול בַּעֲשֹׂתוֹ וְלֹא־אָחַז יַעְטֹף יָמִין וְלֹא אֶרְאֶה׃
    hebrewPlain: שמאול בעשתו ולא אחז יעטף ימין ולא אראה
    kjvRefs:
    - Job 23:9
    kjvOsis:
    - Job.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.10
    scripture: tanakh
    name: Tanakh Job 23:10
    ref: Job 23:10
    book: Job
    section: ketuvim
    chapter: 23
    verse: 10
    ordinal: 19144
    text: For He knoweth the way that I take; When He hath tried me, I shall come forth as gold.
    translation: JPS 1917
    original: כִּי־יָדַע דֶּרֶךְ עִמָּדִי בְּחָנַנִי כַּזָּהָב אֵצֵא׃
    hebrewPlain: כי ידע דרך עמדי בחנני כזהב אצא
    kjvRefs:
    - Job 23:10
    kjvOsis:
    - Job.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.11
    scripture: tanakh
    name: Tanakh Job 23:11
    ref: Job 23:11
    book: Job
    section: ketuvim
    chapter: 23
    verse: 11
    ordinal: 19145
    text: My foot hath held fast to His steps, His way have I kept, and turned not aside.
    translation: JPS 1917
    original: בַּאֲשֻׁרוֹ אָחֲזָה רַגְלִי דַּרְכּוֹ שָׁמַרְתִּי וְלֹא־אָט׃
    hebrewPlain: באשרו אחזה רגלי דרכו שמרתי ולא אט
    kjvRefs:
    - Job 23:11
    kjvOsis:
    - Job.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.12
    scripture: tanakh
    name: Tanakh Job 23:12
    ref: Job 23:12
    book: Job
    section: ketuvim
    chapter: 23
    verse: 12
    ordinal: 19146
    text: I have not gone back from the commandment of His lips; I have treasured up the words of His mouth more than my necessary food.
    translation: JPS 1917
    original: מִצְוַת שְׂפָתָיו וְלֹא אָמִישׁ מֵחֻקִּי צָפַנְתִּי אִמְרֵי־פִיו׃
    hebrewPlain: מצות שפתיו ולא אמיש מחקי צפנתי אמרי פיו
    kjvRefs:
    - Job 23:12
    kjvOsis:
    - Job.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.13
    scripture: tanakh
    name: Tanakh Job 23:13
    ref: Job 23:13
    book: Job
    section: ketuvim
    chapter: 23
    verse: 13
    ordinal: 19147
    text: But He is at one with Himself, and who can turn Him? And what His soul desireth, even that He doeth. .
    translation: JPS 1917
    original: וְהוּא בְאֶחָד וּמִי יְשִׁיבֶנּוּ וְנַפְשׁוֹ אִוְּתָה וַיָּעַשׂ׃
    hebrewPlain: והוא באחד ומי ישיבנו ונפשו אותה ויעש
    kjvRefs:
    - Job 23:13
    kjvOsis:
    - Job.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.14
    scripture: tanakh
    name: Tanakh Job 23:14
    ref: Job 23:14
    book: Job
    section: ketuvim
    chapter: 23
    verse: 14
    ordinal: 19148
    text: For He will perform that which is appointed for me; And many such things are with Him.
    translation: JPS 1917
    original: כִּי יַשְׁלִים חֻקִּי וְכָהֵנָּה רַבּוֹת עִמּוֹ׃
    hebrewPlain: כי ישלים חקי וכהנה רבות עמו
    kjvRefs:
    - Job 23:14
    kjvOsis:
    - Job.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.15
    scripture: tanakh
    name: Tanakh Job 23:15
    ref: Job 23:15
    book: Job
    section: ketuvim
    chapter: 23
    verse: 15
    ordinal: 19149
    text: Therefore am I affrighted at His presence; When I consider, I am afraid of Him.
    translation: JPS 1917
    original: עַל־כֵּן מִפָּנָיו אֶבָּהֵל אֶתְבּוֹנֵן וְאֶפְחַד מִמֶּנּוּ׃
    hebrewPlain: על כן מפניו אבהל אתבונן ואפחד ממנו
    kjvRefs:
    - Job 23:15
    kjvOsis:
    - Job.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.16
    scripture: tanakh
    name: Tanakh Job 23:16
    ref: Job 23:16
    book: Job
    section: ketuvim
    chapter: 23
    verse: 16
    ordinal: 19150
    text: Yea, God hath made my heart faint, And the Almighty hath affrighted me;
    translation: JPS 1917
    original: וְאֵל הֵרַךְ לִבִּי וְשַׁדַּי הִבְהִילָנִי׃
    hebrewPlain: ואל הרך לבי ושדי הבהילני
    kjvRefs:
    - Job 23:16
    kjvOsis:
    - Job.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.23.17
    scripture: tanakh
    name: Tanakh Job 23:17
    ref: Job 23:17
    book: Job
    section: ketuvim
    chapter: 23
    verse: 17
    ordinal: 19151
    text: Because I was not cut off before the darkness, Neither did He cover the thick darkness from my face.
    translation: JPS 1917
    original: כִּי־לֹא נִצְמַתִּי מִפְּנֵי־חֹשֶׁךְ וּמִפָּנַי כִּסָּה־אֹפֶל׃
    hebrewPlain: כי לא נצמתי מפני חשך ומפני כסה אפל
    kjvRefs:
    - Job 23:17
    kjvOsis:
    - Job.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.23
- type: TanakhVerse
  data:
    osis: Job.24.1
    scripture: tanakh
    name: Tanakh Job 24:1
    ref: Job 24:1
    book: Job
    section: ketuvim
    chapter: 24
    verse: 1
    ordinal: 19152
    text: Why are times not laid up by the Almighty? And why do not they that know Him see His days?
    translation: JPS 1917
    original: מַדּוּעַ מִשַּׁדַּי לֹא־נִצְפְּנוּ עִתִּים וידעו [וְיֹדְעָיו] לֹא־חָזוּ יָמָיו׃
    hebrewPlain: מדוע משדי לא נצפנו עתים וידעו [וידעיו] לא חזו ימיו
    kjvRefs:
    - Job 24:1
    kjvOsis:
    - Job.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.2
    scripture: tanakh
    name: Tanakh Job 24:2
    ref: Job 24:2
    book: Job
    section: ketuvim
    chapter: 24
    verse: 2
    ordinal: 19153
    text: There are that remove the landmarks; They violently take away flocks, and feed them.
    translation: JPS 1917
    original: גְּבֻלוֹת יַשִּׂיגוּ עֵדֶר גָּזְלוּ וַיִּרְעוּ׃
    hebrewPlain: גבלות ישיגו עדר גזלו וירעו
    kjvRefs:
    - Job 24:2
    kjvOsis:
    - Job.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.3
    scripture: tanakh
    name: Tanakh Job 24:3
    ref: Job 24:3
    book: Job
    section: ketuvim
    chapter: 24
    verse: 3
    ordinal: 19154
    text: They drive away the ass of the fatherless, They take the widow’s ox for a pledge.
    translation: JPS 1917
    original: חֲמוֹר יְתוֹמִים יִנְהָגוּ יַחְבְּלוּ שׁוֹר אַלְמָנָה׃
    hebrewPlain: חמור יתומים ינהגו יחבלו שור אלמנה
    kjvRefs:
    - Job 24:3
    kjvOsis:
    - Job.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.4
    scripture: tanakh
    name: Tanakh Job 24:4
    ref: Job 24:4
    book: Job
    section: ketuvim
    chapter: 24
    verse: 4
    ordinal: 19155
    text: They turn the needy out of the way; The poor of the earth hide themselves together.
    translation: JPS 1917
    original: יַטּוּ אֶבְיוֹנִים מִדָּרֶךְ יַחַד חֻבְּאוּ עֲנִיֵּי־אָרֶץ׃
    hebrewPlain: יטו אביונים מדרך יחד חבאו עניי ארץ
    kjvRefs:
    - Job 24:4
    kjvOsis:
    - Job.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.5
    scripture: tanakh
    name: Tanakh Job 24:5
    ref: Job 24:5
    book: Job
    section: ketuvim
    chapter: 24
    verse: 5
    ordinal: 19156
    text: Behold, as wild asses in the wilderness They go forth to their work, seeking diligently for food; The desert yieldeth them bread for their children.
    translation: JPS 1917
    original: הֵן פְּרָאִים בַּמִּדְבָּר יָצְאוּ בְּפָעֳלָם מְשַׁחֲרֵי לַטָּרֶף עֲרָבָה לוֹ לֶחֶם לַנְּעָרִים׃
    hebrewPlain: הן פראים במדבר יצאו בפעלם משחרי לטרף ערבה לו לחם לנערים
    kjvRefs:
    - Job 24:5
    kjvOsis:
    - Job.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.6
    scripture: tanakh
    name: Tanakh Job 24:6
    ref: Job 24:6
    book: Job
    section: ketuvim
    chapter: 24
    verse: 6
    ordinal: 19157
    text: They cut his provender in the field; And they despoil the vineyard of the wicked.
    translation: JPS 1917
    original: בַּשָּׂדֶה בְּלִילוֹ יקצירו [יִקְצוֹרוּ] וְכֶרֶם רָשָׁע יְלַקֵּשׁוּ׃
    hebrewPlain: בשדה בלילו יקצירו [יקצורו] וכרם רשע ילקשו
    kjvRefs:
    - Job 24:6
    kjvOsis:
    - Job.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.7
    scripture: tanakh
    name: Tanakh Job 24:7
    ref: Job 24:7
    book: Job
    section: ketuvim
    chapter: 24
    verse: 7
    ordinal: 19158
    text: They lie all night naked without clothing, And have no covering in the cold.
    translation: JPS 1917
    original: עָרוֹם יָלִינוּ מִבְּלִי לְבוּשׁ וְאֵין כְּסוּת בַּקָּרָה׃
    hebrewPlain: ערום ילינו מבלי לבוש ואין כסות בקרה
    kjvRefs:
    - Job 24:7
    kjvOsis:
    - Job.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.8
    scripture: tanakh
    name: Tanakh Job 24:8
    ref: Job 24:8
    book: Job
    section: ketuvim
    chapter: 24
    verse: 8
    ordinal: 19159
    text: They are wet with the showers of the mountains, And embrace the rock for want of a shelter.
    translation: JPS 1917
    original: מִזֶּרֶם הָרִים יִרְטָבוּ וּמִבְּלִי מַחְסֶה חִבְּקוּ־צוּר׃
    hebrewPlain: מזרם הרים ירטבו ומבלי מחסה חבקו צור
    kjvRefs:
    - Job 24:8
    kjvOsis:
    - Job.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.9
    scripture: tanakh
    name: Tanakh Job 24:9
    ref: Job 24:9
    book: Job
    section: ketuvim
    chapter: 24
    verse: 9
    ordinal: 19160
    text: There are that pluck the fatherless from the breast, And take a pledge of the poor;
    translation: JPS 1917
    original: יִגְזְלוּ מִשֹּׁד יָתוֹם וְעַל־עָנִי יַחְבֹּלוּ׃
    hebrewPlain: יגזלו משד יתום ועל עני יחבלו
    kjvRefs:
    - Job 24:9
    kjvOsis:
    - Job.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.10
    scripture: tanakh
    name: Tanakh Job 24:10
    ref: Job 24:10
    book: Job
    section: ketuvim
    chapter: 24
    verse: 10
    ordinal: 19161
    text: So that they go about naked without clothing, And being hungry they carry the sheaves;
    translation: JPS 1917
    original: עָרוֹם הִלְּכוּ בְּלִי לְבוּשׁ וּרְעֵבִים נָשְׂאוּ עֹמֶר׃
    hebrewPlain: ערום הלכו בלי לבוש ורעבים נשאו עמר
    kjvRefs:
    - Job 24:10
    kjvOsis:
    - Job.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.11
    scripture: tanakh
    name: Tanakh Job 24:11
    ref: Job 24:11
    book: Job
    section: ketuvim
    chapter: 24
    verse: 11
    ordinal: 19162
    text: They make oil within the rows of these men; They tread their winepresses, and suffer thirst.
    translation: JPS 1917
    original: בֵּין־שׁוּרֹתָם יַצְהִירוּ יְקָבִים דָּרְכוּ וַיִּצְמָאוּ׃
    hebrewPlain: בין שורתם יצהירו יקבים דרכו ויצמאו
    kjvRefs:
    - Job 24:11
    kjvOsis:
    - Job.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.12
    scripture: tanakh
    name: Tanakh Job 24:12
    ref: Job 24:12
    book: Job
    section: ketuvim
    chapter: 24
    verse: 12
    ordinal: 19163
    text: From out of the populous city men groan, And the soul of the wounded crieth out; Yet God imputeth it not for unseemliness.
    translation: JPS 1917
    original: מֵעִיר מְתִים יִנְאָקוּ וְנֶפֶשׁ־חֲלָלִים תְּשַׁוֵּעַ וֶאֱלוֹהַּ לֹא־יָשִׂים תִּפְלָה׃
    hebrewPlain: מעיר מתים ינאקו ונפש חללים תשוע ואלוה לא ישים תפלה
    kjvRefs:
    - Job 24:12
    kjvOsis:
    - Job.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.13
    scripture: tanakh
    name: Tanakh Job 24:13
    ref: Job 24:13
    book: Job
    section: ketuvim
    chapter: 24
    verse: 13
    ordinal: 19164
    text: These are of them that rebel against the light; They know not the ways thereof, nor abide in the paths thereof.
    translation: JPS 1917
    original: הֵמָּה הָיוּ בְּמֹרְדֵי־אוֹר לֹא־הִכִּירוּ דְרָכָיו וְלֹא יָשְׁבוּ בִּנְתִיבֹתָיו׃
    hebrewPlain: המה היו במרדי אור לא הכירו דרכיו ולא ישבו בנתיבתיו
    kjvRefs:
    - Job 24:13
    kjvOsis:
    - Job.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.14
    scripture: tanakh
    name: Tanakh Job 24:14
    ref: Job 24:14
    book: Job
    section: ketuvim
    chapter: 24
    verse: 14
    ordinal: 19165
    text: The murderer riseth with the light, to kill the poor and needy; And in the night he is as a thief.
    translation: JPS 1917
    original: לָאוֹר יָקוּם רוֹצֵחַ יִקְטָל־עָנִי וְאֶבְיוֹן וּבַלַּיְלָה יְהִי כַגַּנָּב׃
    hebrewPlain: לאור יקום רוצח יקטל עני ואביון ובלילה יהי כגנב
    kjvRefs:
    - Job 24:14
    kjvOsis:
    - Job.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.15
    scripture: tanakh
    name: Tanakh Job 24:15
    ref: Job 24:15
    book: Job
    section: ketuvim
    chapter: 24
    verse: 15
    ordinal: 19166
    text: 'The eye also of the adulterer waiteth for the twilight, Saying: ‘No eye shall see me’; And he putteth a covering on his face. .'
    translation: JPS 1917
    original: וְעֵין נֹאֵף שָׁמְרָה נֶשֶׁף לֵאמֹר לֹא־תְשׁוּרֵנִי עָיִן וְסֵתֶר פָּנִים יָשִׂים׃
    hebrewPlain: ועין נאף שמרה נשף לאמר לא תשורני עין וסתר פנים ישים
    kjvRefs:
    - Job 24:15
    kjvOsis:
    - Job.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.16
    scripture: tanakh
    name: Tanakh Job 24:16
    ref: Job 24:16
    book: Job
    section: ketuvim
    chapter: 24
    verse: 16
    ordinal: 19167
    text: In the dark they dig through houses; They shut themselves up in the day-time; They know not the light.
    translation: JPS 1917
    original: חָתַר בַּחֹשֶׁךְ בָּתִּים יוֹמָם חִתְּמוּ־לָמוֹ לֹא־יָדְעוּ אוֹר׃
    hebrewPlain: חתר בחשך בתים יומם חתמו למו לא ידעו אור
    kjvRefs:
    - Job 24:16
    kjvOsis:
    - Job.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.17
    scripture: tanakh
    name: Tanakh Job 24:17
    ref: Job 24:17
    book: Job
    section: ketuvim
    chapter: 24
    verse: 17
    ordinal: 19168
    text: For the shadow of death is to all of them as the morning; For they know the terrors of the shadow of death.
    translation: JPS 1917
    original: כִּי יַחְדָּו בֹּקֶר לָמוֹ צַלְמָוֶת כִּי־יַכִּיר בַּלְהוֹת צַלְמָוֶת׃
    hebrewPlain: כי יחדו בקר למו צלמות כי יכיר בלהות צלמות
    kjvRefs:
    - Job 24:17
    kjvOsis:
    - Job.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.18
    scripture: tanakh
    name: Tanakh Job 24:18
    ref: Job 24:18
    book: Job
    section: ketuvim
    chapter: 24
    verse: 18
    ordinal: 19169
    text: He is swift upon the face of the waters; Their portion is cursed in the earth; He turneth not by the way of the vineyards.
    translation: JPS 1917
    original: קַל־הוּא עַל־פְּנֵי־מַיִם תְּקֻלַּל חֶלְקָתָם בָּאָרֶץ לֹא־יִפְנֶה דֶּרֶךְ כְּרָמִים׃
    hebrewPlain: קל הוא על פני מים תקלל חלקתם בארץ לא יפנה דרך כרמים
    kjvRefs:
    - Job 24:18
    kjvOsis:
    - Job.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.19
    scripture: tanakh
    name: Tanakh Job 24:19
    ref: Job 24:19
    book: Job
    section: ketuvim
    chapter: 24
    verse: 19
    ordinal: 19170
    text: Drought and heat consume the snow waters; So doth the nether-world those that have sinned.
    translation: JPS 1917
    original: צִיָּה גַם־חֹם יִגְזְלוּ מֵימֵי־שֶׁלֶג שְׁאוֹל חָטָאוּ׃
    hebrewPlain: ציה גם חם יגזלו מימי שלג שאול חטאו
    kjvRefs:
    - Job 24:19
    kjvOsis:
    - Job.24.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.20
    scripture: tanakh
    name: Tanakh Job 24:20
    ref: Job 24:20
    book: Job
    section: ketuvim
    chapter: 24
    verse: 20
    ordinal: 19171
    text: The womb forgetteth him; the worm feedeth sweetly on him; He shall be no more remembered; And unrighteousness is broken as a tree.
    translation: JPS 1917
    original: יִשְׁכָּחֵהוּ רֶחֶם מְתָקוֹ רִמָּה עוֹד לֹא־יִזָּכֵר וַתִּשָּׁבֵר כָּעֵץ עַוְלָה׃
    hebrewPlain: ישכחהו רחם מתקו רמה עוד לא יזכר ותשבר כעץ עולה
    kjvRefs:
    - Job 24:20
    kjvOsis:
    - Job.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.21
    scripture: tanakh
    name: Tanakh Job 24:21
    ref: Job 24:21
    book: Job
    section: ketuvim
    chapter: 24
    verse: 21
    ordinal: 19172
    text: He devoureth the barren that beareth not; And doeth not good to the widow.
    translation: JPS 1917
    original: רֹעֶה עֲקָרָה לֹא תֵלֵד וְאַלְמָנָה לֹא יְיֵטִיב׃
    hebrewPlain: רעה עקרה לא תלד ואלמנה לא ייטיב
    kjvRefs:
    - Job 24:21
    kjvOsis:
    - Job.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.22
    scripture: tanakh
    name: Tanakh Job 24:22
    ref: Job 24:22
    book: Job
    section: ketuvim
    chapter: 24
    verse: 22
    ordinal: 19173
    text: He draweth away the mighty also by his power; He riseth up, and he trusteth not his own life.
    translation: JPS 1917
    original: וּמָשַׁךְ אַבִּירִים בְּכֹחוֹ יָקוּם וְלֹא־יַאֲמִין בַּחַיִּין׃
    hebrewPlain: ומשך אבירים בכחו יקום ולא יאמין בחיין
    kjvRefs:
    - Job 24:22
    kjvOsis:
    - Job.24.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.23
    scripture: tanakh
    name: Tanakh Job 24:23
    ref: Job 24:23
    book: Job
    section: ketuvim
    chapter: 24
    verse: 23
    ordinal: 19174
    text: Though it be given him to be in safety, whereon he resteth, Yet His eyes are upon their ways.
    translation: JPS 1917
    original: יִתֶּן־לוֹ לָבֶטַח וְיִשָּׁעֵן וְעֵינֵיהוּ עַל־דַּרְכֵיהֶם׃
    hebrewPlain: יתן לו לבטח וישען ועיניהו על דרכיהם
    kjvRefs:
    - Job 24:23
    kjvOsis:
    - Job.24.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.24
    scripture: tanakh
    name: Tanakh Job 24:24
    ref: Job 24:24
    book: Job
    section: ketuvim
    chapter: 24
    verse: 24
    ordinal: 19175
    text: They are exalted for a little while, and they are gone; Yea, they are brought low, they are gathered in as all others, And wither as the tops of the ears of corn.
    translation: JPS 1917
    original: רוֹמּוּ מְּעַט וְאֵינֶנּוּ וְהֻמְּכוּ כַּכֹּל יִקָּפְצוּן וּכְרֹאשׁ שִׁבֹּלֶת יִמָּלוּ׃
    hebrewPlain: רומו מעט ואיננו והמכו ככל יקפצון וכראש שבלת ימלו
    kjvRefs:
    - Job 24:24
    kjvOsis:
    - Job.24.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.24.25
    scripture: tanakh
    name: Tanakh Job 24:25
    ref: Job 24:25
    book: Job
    section: ketuvim
    chapter: 24
    verse: 25
    ordinal: 19176
    text: And if it be not so now, who will prove me a liar, And make my speech nothing worth?
    translation: JPS 1917
    original: וְאִם־לֹא אֵפוֹ מִי יַכְזִיבֵנִי וְיָשֵׂם לְאַל מִלָּתִי׃
    hebrewPlain: ואם לא אפו מי יכזיבני וישם לאל מלתי
    kjvRefs:
    - Job 24:25
    kjvOsis:
    - Job.24.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.24
- type: TanakhVerse
  data:
    osis: Job.25.1
    scripture: tanakh
    name: Tanakh Job 25:1
    ref: Job 25:1
    book: Job
    section: ketuvim
    chapter: 25
    verse: 1
    ordinal: 19177
    text: 'Then answered Bildad the Shuhite, and said:'
    translation: JPS 1917
    original: וַיַּעַן בִּלְדַּד הַשֻּׁחִי וַיֹּאמַר׃
    hebrewPlain: ויען בלדד השחי ויאמר
    kjvRefs:
    - Job 25:1
    kjvOsis:
    - Job.25.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.25.2
    scripture: tanakh
    name: Tanakh Job 25:2
    ref: Job 25:2
    book: Job
    section: ketuvim
    chapter: 25
    verse: 2
    ordinal: 19178
    text: Dominion and fear are with Him; He maketh peace in His high places.
    translation: JPS 1917
    original: הַמְשֵׁל וָפַחַד עִמּוֹ עֹשֶׂה שָׁלוֹם בִּמְרוֹמָיו׃
    hebrewPlain: המשל ופחד עמו עשה שלום במרומיו
    kjvRefs:
    - Job 25:2
    kjvOsis:
    - Job.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.25.3
    scripture: tanakh
    name: Tanakh Job 25:3
    ref: Job 25:3
    book: Job
    section: ketuvim
    chapter: 25
    verse: 3
    ordinal: 19179
    text: Is there any number of His armies? And upon whom doth not His light arise?
    translation: JPS 1917
    original: הֲיֵשׁ מִסְפָּר לִגְדוּדָיו וְעַל־מִי לֹא־יָקוּם אוֹרֵהוּ׃
    hebrewPlain: היש מספר לגדודיו ועל מי לא יקום אורהו
    kjvRefs:
    - Job 25:3
    kjvOsis:
    - Job.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.25.4
    scripture: tanakh
    name: Tanakh Job 25:4
    ref: Job 25:4
    book: Job
    section: ketuvim
    chapter: 25
    verse: 4
    ordinal: 19180
    text: How then can man be just with God? Or how can he be clean that is born of a woman?
    translation: JPS 1917
    original: וּמַה־יִּצְדַּק אֱנוֹשׁ עִם־אֵל וּמַה־יִּזְכֶּה יְלוּד אִשָּׁה׃
    hebrewPlain: ומה יצדק אנוש עם אל ומה יזכה ילוד אשה
    kjvRefs:
    - Job 25:4
    kjvOsis:
    - Job.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.25.5
    scripture: tanakh
    name: Tanakh Job 25:5
    ref: Job 25:5
    book: Job
    section: ketuvim
    chapter: 25
    verse: 5
    ordinal: 19181
    text: Behold, even the moon hath no brightness, And the stars are not pure in His sight;
    translation: JPS 1917
    original: הֵן עַד־יָרֵחַ וְלֹא יַאֲהִיל וְכוֹכָבִים לֹא־זַכּוּ בְעֵינָיו׃
    hebrewPlain: הן עד ירח ולא יאהיל וכוכבים לא זכו בעיניו
    kjvRefs:
    - Job 25:5
    kjvOsis:
    - Job.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.25.6
    scripture: tanakh
    name: Tanakh Job 25:6
    ref: Job 25:6
    book: Job
    section: ketuvim
    chapter: 25
    verse: 6
    ordinal: 19182
    text: How much less man, that is a worm! And the son of man, that is a maggot!
    translation: JPS 1917
    original: אַף כִּי־אֱנוֹשׁ רִמָּה וּבֶן־אָדָם תּוֹלֵעָה׃
    hebrewPlain: אף כי אנוש רמה ובן אדם תולעה
    kjvRefs:
    - Job 25:6
    kjvOsis:
    - Job.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.25
- type: TanakhVerse
  data:
    osis: Job.26.1
    scripture: tanakh
    name: Tanakh Job 26:1
    ref: Job 26:1
    book: Job
    section: ketuvim
    chapter: 26
    verse: 1
    ordinal: 19183
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 26:1
    kjvOsis:
    - Job.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.2
    scripture: tanakh
    name: Tanakh Job 26:2
    ref: Job 26:2
    book: Job
    section: ketuvim
    chapter: 26
    verse: 2
    ordinal: 19184
    text: How hast thou helped him that is without power! How hast thou saved the arm that hath no strength!
    translation: JPS 1917
    original: מֶה־עָזַרְתָּ לְלֹא־כֹחַ הוֹשַׁעְתָּ זְרוֹעַ לֹא־עֹז׃
    hebrewPlain: מה עזרת ללא כח הושעת זרוע לא עז
    kjvRefs:
    - Job 26:2
    kjvOsis:
    - Job.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.3
    scripture: tanakh
    name: Tanakh Job 26:3
    ref: Job 26:3
    book: Job
    section: ketuvim
    chapter: 26
    verse: 3
    ordinal: 19185
    text: How hast thou counselled him that hath no wisdom, And plentifully declared sound knowledge!
    translation: JPS 1917
    original: מַה־יָּעַצְתָּ לְלֹא חָכְמָה וְתוּשִׁיָּה לָרֹב הוֹדָעְתָּ׃
    hebrewPlain: מה יעצת ללא חכמה ותושיה לרב הודעת
    kjvRefs:
    - Job 26:3
    kjvOsis:
    - Job.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.4
    scripture: tanakh
    name: Tanakh Job 26:4
    ref: Job 26:4
    book: Job
    section: ketuvim
    chapter: 26
    verse: 4
    ordinal: 19186
    text: With whose help hast thou uttered words? And whose spirit came forth from thee?
    translation: JPS 1917
    original: אֶת־מִי הִגַּדְתָּ מִלִּין וְנִשְׁמַת־מִי יָצְאָה מִמֶּךָּ׃
    hebrewPlain: את מי הגדת מלין ונשמת מי יצאה ממך
    kjvRefs:
    - Job 26:4
    kjvOsis:
    - Job.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.5
    scripture: tanakh
    name: Tanakh Job 26:5
    ref: Job 26:5
    book: Job
    section: ketuvim
    chapter: 26
    verse: 5
    ordinal: 19187
    text: The shades tremble Beneath the waters and the inhabitants thereof.
    translation: JPS 1917
    original: הָרְפָאִים יְחוֹלָלוּ מִתַּחַת מַיִם וְשֹׁכְנֵיהֶם׃
    hebrewPlain: הרפאים יחוללו מתחת מים ושכניהם
    kjvRefs:
    - Job 26:5
    kjvOsis:
    - Job.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.6
    scripture: tanakh
    name: Tanakh Job 26:6
    ref: Job 26:6
    book: Job
    section: ketuvim
    chapter: 26
    verse: 6
    ordinal: 19188
    text: The nether-world is naked before Him, And Destruction hath no covering.
    translation: JPS 1917
    original: עָרוֹם שְׁאוֹל נֶגְדּוֹ וְאֵין כְּסוּת לָאֲבַדּוֹן׃
    hebrewPlain: ערום שאול נגדו ואין כסות לאבדון
    kjvRefs:
    - Job 26:6
    kjvOsis:
    - Job.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.7
    scripture: tanakh
    name: Tanakh Job 26:7
    ref: Job 26:7
    book: Job
    section: ketuvim
    chapter: 26
    verse: 7
    ordinal: 19189
    text: He stretcheth out the north over the empty space, And hangeth the earth over nothing.
    translation: JPS 1917
    original: נֹטֶה צָפוֹן עַל־תֹּהוּ תֹּלֶה אֶרֶץ עַל־בְּלִי־מָה׃
    hebrewPlain: נטה צפון על תהו תלה ארץ על בלי מה
    kjvRefs:
    - Job 26:7
    kjvOsis:
    - Job.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.8
    scripture: tanakh
    name: Tanakh Job 26:8
    ref: Job 26:8
    book: Job
    section: ketuvim
    chapter: 26
    verse: 8
    ordinal: 19190
    text: He bindeth up the waters in His thick clouds; And the cloud is not rent under them.
    translation: JPS 1917
    original: צֹרֵר־מַיִם בְּעָבָיו וְלֹא־נִבְקַע עָנָן תַּחְתָּם׃
    hebrewPlain: צרר מים בעביו ולא נבקע ענן תחתם
    kjvRefs:
    - Job 26:8
    kjvOsis:
    - Job.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.9
    scripture: tanakh
    name: Tanakh Job 26:9
    ref: Job 26:9
    book: Job
    section: ketuvim
    chapter: 26
    verse: 9
    ordinal: 19191
    text: He closeth in the face of His throne, And spreadeth His cloud upon it.
    translation: JPS 1917
    original: מְאַחֵז פְּנֵי־כִסֵּה פַּרְשֵׁז עָלָיו עֲנָנוֹ׃
    hebrewPlain: מאחז פני כסה פרשז עליו עננו
    kjvRefs:
    - Job 26:9
    kjvOsis:
    - Job.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.10
    scripture: tanakh
    name: Tanakh Job 26:10
    ref: Job 26:10
    book: Job
    section: ketuvim
    chapter: 26
    verse: 10
    ordinal: 19192
    text: He hath described a boundary upon the face of the waters, Unto the confines of light and darkness.
    translation: JPS 1917
    original: חֹק־חָג עַל־פְּנֵי־מָיִם עַד־תַּכְלִית אוֹר עִם־חֹשֶׁךְ׃
    hebrewPlain: חק חג על פני מים עד תכלית אור עם חשך
    kjvRefs:
    - Job 26:10
    kjvOsis:
    - Job.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.11
    scripture: tanakh
    name: Tanakh Job 26:11
    ref: Job 26:11
    book: Job
    section: ketuvim
    chapter: 26
    verse: 11
    ordinal: 19193
    text: The pillars of heaven tremble And are astonished at His rebuke.
    translation: JPS 1917
    original: עַמּוּדֵי שָׁמַיִם יְרוֹפָפוּ וְיִתְמְהוּ מִגַּעֲרָתוֹ׃
    hebrewPlain: עמודי שמים ירופפו ויתמהו מגערתו
    kjvRefs:
    - Job 26:11
    kjvOsis:
    - Job.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.12
    scripture: tanakh
    name: Tanakh Job 26:12
    ref: Job 26:12
    book: Job
    section: ketuvim
    chapter: 26
    verse: 12
    ordinal: 19194
    text: He stirreth up the sea with His power, And by His understanding He smiteth through Rahab.
    translation: JPS 1917
    original: בְּכֹחוֹ רָגַע הַיָּם ובתובנתו [וּבִתְבוּנָתוֹ] מָחַץ רָהַב׃
    hebrewPlain: בכחו רגע הים ובתובנתו [ובתבונתו] מחץ רהב
    kjvRefs:
    - Job 26:12
    kjvOsis:
    - Job.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.13
    scripture: tanakh
    name: Tanakh Job 26:13
    ref: Job 26:13
    book: Job
    section: ketuvim
    chapter: 26
    verse: 13
    ordinal: 19195
    text: By His breath the heavens are serene; His hand hath pierced the slant serpent.
    translation: JPS 1917
    original: בְּרוּחוֹ שָׁמַיִם שִׁפְרָה חֹלֲלָה יָדוֹ נָחָשׁ בָּרִיחַ׃
    hebrewPlain: ברוחו שמים שפרה חללה ידו נחש בריח
    kjvRefs:
    - Job 26:13
    kjvOsis:
    - Job.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.26.14
    scripture: tanakh
    name: Tanakh Job 26:14
    ref: Job 26:14
    book: Job
    section: ketuvim
    chapter: 26
    verse: 14
    ordinal: 19196
    text: Lo, these are but the outskirts of His ways; And how small a whisper is heard of Him! But the thunder of His mighty deeds who can understand?
    translation: JPS 1917
    original: הֶן־אֵלֶּה קְצוֹת דרכו [דְּרָכָיו] וּמַה־שֵּׁמֶץ דָּבָר נִשְׁמַע־בּוֹ וְרַעַם גבורתו [גְּבוּרוֹתָיו] מִי יִתְבּוֹנָן׃
    hebrewPlain: הן אלה קצות דרכו [דרכיו] ומה שמץ דבר נשמע בו ורעם גבורתו [גבורותיו] מי יתבונן
    kjvRefs:
    - Job 26:14
    kjvOsis:
    - Job.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.26
- type: TanakhVerse
  data:
    osis: Job.27.1
    scripture: tanakh
    name: Tanakh Job 27:1
    ref: Job 27:1
    book: Job
    section: ketuvim
    chapter: 27
    verse: 1
    ordinal: 19197
    text: 'And Job again took up his parable, and said:'
    translation: JPS 1917
    original: וַיֹּסֶף אִיּוֹב שְׂאֵת מְשָׁלוֹ וַיֹּאמַר׃
    hebrewPlain: ויסף איוב שאת משלו ויאמר
    kjvRefs:
    - Job 27:1
    kjvOsis:
    - Job.27.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.2
    scripture: tanakh
    name: Tanakh Job 27:2
    ref: Job 27:2
    book: Job
    section: ketuvim
    chapter: 27
    verse: 2
    ordinal: 19198
    text: As God liveth, who hath taken away my right; And the Almighty, who hath dealt bitterly with me;
    translation: JPS 1917
    original: חַי־אֵל הֵסִיר מִשְׁפָּטִי וְשַׁדַּי הֵמַר נַפְשִׁי׃
    hebrewPlain: חי אל הסיר משפטי ושדי המר נפשי
    kjvRefs:
    - Job 27:2
    kjvOsis:
    - Job.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.3
    scripture: tanakh
    name: Tanakh Job 27:3
    ref: Job 27:3
    book: Job
    section: ketuvim
    chapter: 27
    verse: 3
    ordinal: 19199
    text: All the while my breath is in me And the spirit of God is in my nostrils,
    translation: JPS 1917
    original: כִּי־כָל־עוֹד נִשְׁמָתִי בִי וְרוּחַ אֱלוֹהַּ בְּאַפִּי׃
    hebrewPlain: כי כל עוד נשמתי בי ורוח אלוה באפי
    kjvRefs:
    - Job 27:3
    kjvOsis:
    - Job.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.4
    scripture: tanakh
    name: Tanakh Job 27:4
    ref: Job 27:4
    book: Job
    section: ketuvim
    chapter: 27
    verse: 4
    ordinal: 19200
    text: Surely my lips shall not speak unrighteousness, Neither shall my tongue utter deceit;
    translation: JPS 1917
    original: אִם־תְּדַבֵּרְנָה שְׂפָתַי עַוְלָה וּלְשׁוֹנִי אִם־יֶהְגֶּה רְמִיָּה׃
    hebrewPlain: אם תדברנה שפתי עולה ולשוני אם יהגה רמיה
    kjvRefs:
    - Job 27:4
    kjvOsis:
    - Job.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.5
    scripture: tanakh
    name: Tanakh Job 27:5
    ref: Job 27:5
    book: Job
    section: ketuvim
    chapter: 27
    verse: 5
    ordinal: 19201
    text: Far be it from me that I should justify you; Till I die I will not put away mine integrity from me.
    translation: JPS 1917
    original: חָלִילָה לִּי אִם־אַצְדִּיק אֶתְכֶם עַד־אֶגְוָע לֹא־אָסִיר תֻּמָּתִי מִמֶּנִּי׃
    hebrewPlain: חלילה לי אם אצדיק אתכם עד אגוע לא אסיר תמתי ממני
    kjvRefs:
    - Job 27:5
    kjvOsis:
    - Job.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.6
    scripture: tanakh
    name: Tanakh Job 27:6
    ref: Job 27:6
    book: Job
    section: ketuvim
    chapter: 27
    verse: 6
    ordinal: 19202
    text: My righteousness I hold fast, and will not let it go; My heart shall not reproach me so long as I live.
    translation: JPS 1917
    original: בְּצִדְקָתִי הֶחֱזַקְתִּי וְלֹא אַרְפֶּהָ לֹא־יֶחֱרַף לְבָבִי מִיָּמָי׃
    hebrewPlain: בצדקתי החזקתי ולא ארפה לא יחרף לבבי מימי
    kjvRefs:
    - Job 27:6
    kjvOsis:
    - Job.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.7
    scripture: tanakh
    name: Tanakh Job 27:7
    ref: Job 27:7
    book: Job
    section: ketuvim
    chapter: 27
    verse: 7
    ordinal: 19203
    text: Let mine enemy be as the wicked, And let him that riseth up against me be as the unrighteous.
    translation: JPS 1917
    original: יְהִי כְרָשָׁע אֹיְבִי וּמִתְקוֹמְמִי כְעַוָּל׃
    hebrewPlain: יהי כרשע איבי ומתקוממי כעול
    kjvRefs:
    - Job 27:7
    kjvOsis:
    - Job.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.8
    scripture: tanakh
    name: Tanakh Job 27:8
    ref: Job 27:8
    book: Job
    section: ketuvim
    chapter: 27
    verse: 8
    ordinal: 19204
    text: For what is the hope of the godless, though he get him gain, When God taketh away his soul?
    translation: JPS 1917
    original: כִּי מַה־תִּקְוַת חָנֵף כִּי יִבְצָע כִּי יֵשֶׁל אֱלוֹהַּ נַפְשׁוֹ׃
    hebrewPlain: כי מה תקות חנף כי יבצע כי ישל אלוה נפשו
    kjvRefs:
    - Job 27:8
    kjvOsis:
    - Job.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.9
    scripture: tanakh
    name: Tanakh Job 27:9
    ref: Job 27:9
    book: Job
    section: ketuvim
    chapter: 27
    verse: 9
    ordinal: 19205
    text: Will God hear his cry, When trouble cometh upon him?
    translation: JPS 1917
    original: הַצַעֲקָתוֹ יִשְׁמַע אֵל כִּי־תָבוֹא עָלָיו צָרָה׃
    hebrewPlain: הצעקתו ישמע אל כי תבוא עליו צרה
    kjvRefs:
    - Job 27:9
    kjvOsis:
    - Job.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.10
    scripture: tanakh
    name: Tanakh Job 27:10
    ref: Job 27:10
    book: Job
    section: ketuvim
    chapter: 27
    verse: 10
    ordinal: 19206
    text: Will he have his delight in the Almighty, And call upon God at all times?
    translation: JPS 1917
    original: אִם־עַל־שַׁדַּי יִתְעַנָּג יִקְרָא אֱלוֹהַּ בְּכָל־עֵת׃
    hebrewPlain: אם על שדי יתענג יקרא אלוה בכל עת
    kjvRefs:
    - Job 27:10
    kjvOsis:
    - Job.27.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.11
    scripture: tanakh
    name: Tanakh Job 27:11
    ref: Job 27:11
    book: Job
    section: ketuvim
    chapter: 27
    verse: 11
    ordinal: 19207
    text: I will teach you concerning the hand of God; That which is with the Almighty will I not conceal.
    translation: JPS 1917
    original: אוֹרֶה אֶתְכֶם בְּיַד־אֵל אֲשֶׁר עִם־שַׁדַּי לֹא אֲכַחֵד׃
    hebrewPlain: אורה אתכם ביד אל אשר עם שדי לא אכחד
    kjvRefs:
    - Job 27:11
    kjvOsis:
    - Job.27.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.12
    scripture: tanakh
    name: Tanakh Job 27:12
    ref: Job 27:12
    book: Job
    section: ketuvim
    chapter: 27
    verse: 12
    ordinal: 19208
    text: Behold, all ye yourselves have seen it; Why then are ye become altogether vain?
    translation: JPS 1917
    original: הֵן־אַתֶּם כֻּלְּכֶם חֲזִיתֶם וְלָמָּה־זֶּה הֶבֶל תֶּהְבָּלוּ׃
    hebrewPlain: הן אתם כלכם חזיתם ולמה זה הבל תהבלו
    kjvRefs:
    - Job 27:12
    kjvOsis:
    - Job.27.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.13
    scripture: tanakh
    name: Tanakh Job 27:13
    ref: Job 27:13
    book: Job
    section: ketuvim
    chapter: 27
    verse: 13
    ordinal: 19209
    text: This is the portion of a wicked man with God, And the heritage of oppressors, which they receive from the Almighty.
    translation: JPS 1917
    original: זֶה חֵלֶק־אָדָם רָשָׁע עִם־אֵל וְנַחֲלַת עָרִיצִים מִשַּׁדַּי יִקָּחוּ׃
    hebrewPlain: זה חלק אדם רשע עם אל ונחלת עריצים משדי יקחו
    kjvRefs:
    - Job 27:13
    kjvOsis:
    - Job.27.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.14
    scripture: tanakh
    name: Tanakh Job 27:14
    ref: Job 27:14
    book: Job
    section: ketuvim
    chapter: 27
    verse: 14
    ordinal: 19210
    text: If his children be multiplied, it is for the sword; And his offspring shall not have bread enough.
    translation: JPS 1917
    original: אִם־יִרְבּוּ בָנָיו לְמוֹ־חָרֶב וְצֶאֱצָאָיו לֹא יִשְׂבְּעוּ־לָחֶם׃
    hebrewPlain: אם ירבו בניו למו חרב וצאצאיו לא ישבעו לחם
    kjvRefs:
    - Job 27:14
    kjvOsis:
    - Job.27.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.15
    scripture: tanakh
    name: Tanakh Job 27:15
    ref: Job 27:15
    book: Job
    section: ketuvim
    chapter: 27
    verse: 15
    ordinal: 19211
    text: Those that remain of him shall be buried by pestilence, And his widows shall make no lamentation.
    translation: JPS 1917
    original: שרידו [שְׂרִידָיו] בַּמָּוֶת יִקָּבֵרוּ וְאַלְמְנֹתָיו לֹא תִבְכֶּינָה׃
    hebrewPlain: שרידו [שרידיו] במות יקברו ואלמנתיו לא תבכינה
    kjvRefs:
    - Job 27:15
    kjvOsis:
    - Job.27.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.16
    scripture: tanakh
    name: Tanakh Job 27:16
    ref: Job 27:16
    book: Job
    section: ketuvim
    chapter: 27
    verse: 16
    ordinal: 19212
    text: Though he heap up silver as the dust, And prepare raiment as the clay;
    translation: JPS 1917
    original: אִם־יִצְבֹּר כֶּעָפָר כָּסֶף וְכַחֹמֶר יָכִין מַלְבּוּשׁ׃
    hebrewPlain: אם יצבר כעפר כסף וכחמר יכין מלבוש
    kjvRefs:
    - Job 27:16
    kjvOsis:
    - Job.27.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.17
    scripture: tanakh
    name: Tanakh Job 27:17
    ref: Job 27:17
    book: Job
    section: ketuvim
    chapter: 27
    verse: 17
    ordinal: 19213
    text: He may prepare it, but the just shall put it on, And the innocent shall divide the silver.
    translation: JPS 1917
    original: יָכִין וְצַדִּיק יִלְבָּשׁ וְכֶסֶף נָקִי יַחֲלֹק׃
    hebrewPlain: יכין וצדיק ילבש וכסף נקי יחלק
    kjvRefs:
    - Job 27:17
    kjvOsis:
    - Job.27.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.18
    scripture: tanakh
    name: Tanakh Job 27:18
    ref: Job 27:18
    book: Job
    section: ketuvim
    chapter: 27
    verse: 18
    ordinal: 19214
    text: He buildeth his house as a moth, And as a booth which the keeper maketh.
    translation: JPS 1917
    original: בָּנָה כָעָשׁ בֵּיתוֹ וּכְסֻכָּה עָשָׂה נֹצֵר׃
    hebrewPlain: בנה כעש ביתו וכסכה עשה נצר
    kjvRefs:
    - Job 27:18
    kjvOsis:
    - Job.27.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.19
    scripture: tanakh
    name: Tanakh Job 27:19
    ref: Job 27:19
    book: Job
    section: ketuvim
    chapter: 27
    verse: 19
    ordinal: 19215
    text: He lieth down rich, but there shall be nought to gather; He openeth his eyes, and his wealth is not.
    translation: JPS 1917
    original: עָשִׁיר יִשְׁכַּב וְלֹא יֵאָסֵף עֵינָיו פָּקַח וְאֵינֶנּוּ׃
    hebrewPlain: עשיר ישכב ולא יאסף עיניו פקח ואיננו
    kjvRefs:
    - Job 27:19
    kjvOsis:
    - Job.27.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.20
    scripture: tanakh
    name: Tanakh Job 27:20
    ref: Job 27:20
    book: Job
    section: ketuvim
    chapter: 27
    verse: 20
    ordinal: 19216
    text: Terrors overtake him like waters; A tempest stealeth him away in the night.
    translation: JPS 1917
    original: תַּשִּׂיגֵהוּ כַמַּיִם בַּלָּהוֹת לַיְלָה גְּנָבַתּוּ סוּפָה׃
    hebrewPlain: תשיגהו כמים בלהות לילה גנבתו סופה
    kjvRefs:
    - Job 27:20
    kjvOsis:
    - Job.27.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.21
    scripture: tanakh
    name: Tanakh Job 27:21
    ref: Job 27:21
    book: Job
    section: ketuvim
    chapter: 27
    verse: 21
    ordinal: 19217
    text: The east wind carrieth him away, and he departeth; And it sweepeth him out of his place.
    translation: JPS 1917
    original: יִשָּׂאֵהוּ קָדִים וְיֵלַךְ וִישָׂעֲרֵהוּ מִמְּקֹמוֹ׃
    hebrewPlain: ישאהו קדים וילך וישערהו ממקמו
    kjvRefs:
    - Job 27:21
    kjvOsis:
    - Job.27.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.22
    scripture: tanakh
    name: Tanakh Job 27:22
    ref: Job 27:22
    book: Job
    section: ketuvim
    chapter: 27
    verse: 22
    ordinal: 19218
    text: Yea, it hurleth at him, and spareth not; He would fain flee from its power.
    translation: JPS 1917
    original: וְיַשְׁלֵךְ עָלָיו וְלֹא יַחְמֹל מִיָּדוֹ בָּרוֹחַ יִבְרָח׃
    hebrewPlain: וישלך עליו ולא יחמל מידו ברוח יברח
    kjvRefs:
    - Job 27:22
    kjvOsis:
    - Job.27.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.27.23
    scripture: tanakh
    name: Tanakh Job 27:23
    ref: Job 27:23
    book: Job
    section: ketuvim
    chapter: 27
    verse: 23
    ordinal: 19219
    text: Men shall clap their hands at him, And shall hiss him out of his place.
    translation: JPS 1917
    original: יִשְׂפֹּק עָלֵימוֹ כַפֵּימוֹ וְיִשְׁרֹק עָלָיו מִמְּקֹמוֹ׃
    hebrewPlain: ישפק עלימו כפימו וישרק עליו ממקמו
    kjvRefs:
    - Job 27:23
    kjvOsis:
    - Job.27.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.27
- type: TanakhVerse
  data:
    osis: Job.28.1
    scripture: tanakh
    name: Tanakh Job 28:1
    ref: Job 28:1
    book: Job
    section: ketuvim
    chapter: 28
    verse: 1
    ordinal: 19220
    text: For there is a mine for silver, And a place for gold which they refine.
    translation: JPS 1917
    original: כִּי יֵשׁ לַכֶּסֶף מוֹצָא וּמָקוֹם לַזָּהָב יָזֹקּוּ׃
    hebrewPlain: כי יש לכסף מוצא ומקום לזהב יזקו
    kjvRefs:
    - Job 28:1
    kjvOsis:
    - Job.28.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.2
    scripture: tanakh
    name: Tanakh Job 28:2
    ref: Job 28:2
    book: Job
    section: ketuvim
    chapter: 28
    verse: 2
    ordinal: 19221
    text: Iron is taken out of the dust, And brass is molten out of the stone.
    translation: JPS 1917
    original: בַּרְזֶל מֵעָפָר יֻקָּח וְאֶבֶן יָצוּק נְחוּשָׁה׃
    hebrewPlain: ברזל מעפר יקח ואבן יצוק נחושה
    kjvRefs:
    - Job 28:2
    kjvOsis:
    - Job.28.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.3
    scripture: tanakh
    name: Tanakh Job 28:3
    ref: Job 28:3
    book: Job
    section: ketuvim
    chapter: 28
    verse: 3
    ordinal: 19222
    text: Man setteth an end to darkness, And searcheth out to the furthest bound The stones of thick darkness and of the shadow of death.
    translation: JPS 1917
    original: קֵץ שָׂם לַחֹשֶׁךְ וּלְכָל־תַּכְלִית הוּא חוֹקֵר אֶבֶן אֹפֶל וְצַלְמָוֶת׃
    hebrewPlain: קץ שם לחשך ולכל תכלית הוא חוקר אבן אפל וצלמות
    kjvRefs:
    - Job 28:3
    kjvOsis:
    - Job.28.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.4
    scripture: tanakh
    name: Tanakh Job 28:4
    ref: Job 28:4
    book: Job
    section: ketuvim
    chapter: 28
    verse: 4
    ordinal: 19223
    text: He breaketh open a shaft away from where men sojourn; They are forgotten of the foot that passeth by; They hang afar from men, they swing to and fro.
    translation: JPS 1917
    original: פָּרַץ נַחַל מֵעִם־גָּר הַנִּשְׁכָּחִים מִנִּי־רָגֶל דַּלּוּ מֵאֱנוֹשׁ נָעוּ׃
    hebrewPlain: פרץ נחל מעם גר הנשכחים מני רגל דלו מאנוש נעו
    kjvRefs:
    - Job 28:4
    kjvOsis:
    - Job.28.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.5
    scripture: tanakh
    name: Tanakh Job 28:5
    ref: Job 28:5
    book: Job
    section: ketuvim
    chapter: 28
    verse: 5
    ordinal: 19224
    text: As for the earth, out of it cometh bread, And underneath it is turned up as it were by fire.
    translation: JPS 1917
    original: אֶרֶץ מִמֶּנָּה יֵצֵא־לָחֶם וְתַחְתֶּיהָ נֶהְפַּךְ כְּמוֹ־אֵשׁ׃
    hebrewPlain: ארץ ממנה יצא לחם ותחתיה נהפך כמו אש
    kjvRefs:
    - Job 28:5
    kjvOsis:
    - Job.28.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.6
    scripture: tanakh
    name: Tanakh Job 28:6
    ref: Job 28:6
    book: Job
    section: ketuvim
    chapter: 28
    verse: 6
    ordinal: 19225
    text: The stones thereof are the place of sapphires, And it hath dust of gold.
    translation: JPS 1917
    original: מְקוֹם־סַפִּיר אֲבָנֶיהָ וְעַפְרֹת זָהָב לוֹ׃
    hebrewPlain: מקום ספיר אבניה ועפרת זהב לו
    kjvRefs:
    - Job 28:6
    kjvOsis:
    - Job.28.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.7
    scripture: tanakh
    name: Tanakh Job 28:7
    ref: Job 28:7
    book: Job
    section: ketuvim
    chapter: 28
    verse: 7
    ordinal: 19226
    text: That path no bird of prey knoweth, Neither hath the falcon’s eye seen it;
    translation: JPS 1917
    original: נָתִיב לֹא־יְדָעוֹ עָיִט וְלֹא שְׁזָפַתּוּ עֵין אַיָּה׃
    hebrewPlain: נתיב לא ידעו עיט ולא שזפתו עין איה
    kjvRefs:
    - Job 28:7
    kjvOsis:
    - Job.28.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.8
    scripture: tanakh
    name: Tanakh Job 28:8
    ref: Job 28:8
    book: Job
    section: ketuvim
    chapter: 28
    verse: 8
    ordinal: 19227
    text: The proud beasts have not trodden it, Nor hath the lion passed thereby.
    translation: JPS 1917
    original: לֹא־הִדְרִיכֻהוּ בְנֵי־שָׁחַץ לֹא־עָדָה עָלָיו שָׁחַל׃
    hebrewPlain: לא הדריכהו בני שחץ לא עדה עליו שחל
    kjvRefs:
    - Job 28:8
    kjvOsis:
    - Job.28.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.9
    scripture: tanakh
    name: Tanakh Job 28:9
    ref: Job 28:9
    book: Job
    section: ketuvim
    chapter: 28
    verse: 9
    ordinal: 19228
    text: He putteth forth his hand upon the flinty rock; He overturneth the mountains by the roots.
    translation: JPS 1917
    original: בַּחַלָּמִישׁ שָׁלַח יָדוֹ הָפַךְ מִשֹּׁרֶשׁ הָרִים׃
    hebrewPlain: בחלמיש שלח ידו הפך משרש הרים
    kjvRefs:
    - Job 28:9
    kjvOsis:
    - Job.28.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.10
    scripture: tanakh
    name: Tanakh Job 28:10
    ref: Job 28:10
    book: Job
    section: ketuvim
    chapter: 28
    verse: 10
    ordinal: 19229
    text: He cutteth out channels among the rocks; And his eye seeth every precious thing. .
    translation: JPS 1917
    original: בַּצּוּרוֹת יְאֹרִים בִּקֵּעַ וְכָל־יְקָר רָאֲתָה עֵינוֹ׃
    hebrewPlain: בצורות יארים בקע וכל יקר ראתה עינו
    kjvRefs:
    - Job 28:10
    kjvOsis:
    - Job.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.11
    scripture: tanakh
    name: Tanakh Job 28:11
    ref: Job 28:11
    book: Job
    section: ketuvim
    chapter: 28
    verse: 11
    ordinal: 19230
    text: He bindeth the streams that they trickle not; And the thing that is hid bringeth he forth to light.
    translation: JPS 1917
    original: מִבְּכִי נְהָרוֹת חִבֵּשׁ וְתַעֲלֻמָהּ יֹצִא אוֹר׃
    hebrewPlain: מבכי נהרות חבש ותעלמה יצא אור
    kjvRefs:
    - Job 28:11
    kjvOsis:
    - Job.28.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.12
    scripture: tanakh
    name: Tanakh Job 28:12
    ref: Job 28:12
    book: Job
    section: ketuvim
    chapter: 28
    verse: 12
    ordinal: 19231
    text: But wisdom, where shall it be found? And where is the place of understanding?
    translation: JPS 1917
    original: וְהַחָכְמָה מֵאַיִן תִּמָּצֵא וְאֵי זֶה מְקוֹם בִּינָה׃
    hebrewPlain: והחכמה מאין תמצא ואי זה מקום בינה
    kjvRefs:
    - Job 28:12
    kjvOsis:
    - Job.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.13
    scripture: tanakh
    name: Tanakh Job 28:13
    ref: Job 28:13
    book: Job
    section: ketuvim
    chapter: 28
    verse: 13
    ordinal: 19232
    text: Man knoweth not the price thereof; Neither is it found in the land of the living.
    translation: JPS 1917
    original: לֹא־יָדַע אֱנוֹשׁ עֶרְכָּהּ וְלֹא תִמָּצֵא בְּאֶרֶץ הַחַיִּים׃
    hebrewPlain: לא ידע אנוש ערכה ולא תמצא בארץ החיים
    kjvRefs:
    - Job 28:13
    kjvOsis:
    - Job.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.14
    scripture: tanakh
    name: Tanakh Job 28:14
    ref: Job 28:14
    book: Job
    section: ketuvim
    chapter: 28
    verse: 14
    ordinal: 19233
    text: 'The deep saith: ‘It is not in me’; And the sea saith: ‘It is not with me.’'
    translation: JPS 1917
    original: תְּהוֹם אָמַר לֹא בִי־הִיא וְיָם אָמַר אֵין עִמָּדִי׃
    hebrewPlain: תהום אמר לא בי היא וים אמר אין עמדי
    kjvRefs:
    - Job 28:14
    kjvOsis:
    - Job.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.15
    scripture: tanakh
    name: Tanakh Job 28:15
    ref: Job 28:15
    book: Job
    section: ketuvim
    chapter: 28
    verse: 15
    ordinal: 19234
    text: It cannot be gotten for gold, Neither shall silver be weighed for the price thereof.
    translation: JPS 1917
    original: לֹא־יֻתַּן סְגוֹר תַּחְתֶּיהָ וְלֹא יִשָּׁקֵל כֶּסֶף מְחִירָהּ׃
    hebrewPlain: לא יתן סגור תחתיה ולא ישקל כסף מחירה
    kjvRefs:
    - Job 28:15
    kjvOsis:
    - Job.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.16
    scripture: tanakh
    name: Tanakh Job 28:16
    ref: Job 28:16
    book: Job
    section: ketuvim
    chapter: 28
    verse: 16
    ordinal: 19235
    text: It cannot be valued with the gold of Ophir, With the precious onyx, or the sapphire.
    translation: JPS 1917
    original: לֹא־תְסֻלֶּה בְּכֶתֶם אוֹפִיר בְּשֹׁהַם יָקָר וְסַפִּיר׃
    hebrewPlain: לא תסלה בכתם אופיר בשהם יקר וספיר
    kjvRefs:
    - Job 28:16
    kjvOsis:
    - Job.28.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.17
    scripture: tanakh
    name: Tanakh Job 28:17
    ref: Job 28:17
    book: Job
    section: ketuvim
    chapter: 28
    verse: 17
    ordinal: 19236
    text: Gold and glass cannot equal it; Neither shall the exchange thereof be vessels of fine gold.
    translation: JPS 1917
    original: לֹא־יַעַרְכֶנָּה זָהָב וּזְכוֹכִית וּתְמוּרָתָהּ כְּלִי־פָז׃
    hebrewPlain: לא יערכנה זהב וזכוכית ותמורתה כלי פז
    kjvRefs:
    - Job 28:17
    kjvOsis:
    - Job.28.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.18
    scripture: tanakh
    name: Tanakh Job 28:18
    ref: Job 28:18
    book: Job
    section: ketuvim
    chapter: 28
    verse: 18
    ordinal: 19237
    text: No mention shall be made of coral or of crystal; Yea, the price of wisdom is above rubies.
    translation: JPS 1917
    original: רָאמוֹת וְגָבִישׁ לֹא יִזָּכֵר וּמֶשֶׁךְ חָכְמָה מִפְּנִינִים׃
    hebrewPlain: ראמות וגביש לא יזכר ומשך חכמה מפנינים
    kjvRefs:
    - Job 28:18
    kjvOsis:
    - Job.28.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.19
    scripture: tanakh
    name: Tanakh Job 28:19
    ref: Job 28:19
    book: Job
    section: ketuvim
    chapter: 28
    verse: 19
    ordinal: 19238
    text: The topaz of Ethiopia shall not equal it, Neither shall it be valued with pure gold.
    translation: JPS 1917
    original: לֹא־יַעַרְכֶנָּה פִּטְדַת־כּוּשׁ בְּכֶתֶם טָהוֹר לֹא תְסֻלֶּה׃
    hebrewPlain: לא יערכנה פטדת כוש בכתם טהור לא תסלה
    kjvRefs:
    - Job 28:19
    kjvOsis:
    - Job.28.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.20
    scripture: tanakh
    name: Tanakh Job 28:20
    ref: Job 28:20
    book: Job
    section: ketuvim
    chapter: 28
    verse: 20
    ordinal: 19239
    text: Whence then cometh wisdom? And where is the place of understanding?
    translation: JPS 1917
    original: וְהַחָכְמָה מֵאַיִן תָּבוֹא וְאֵי זֶה מְקוֹם בִּינָה׃
    hebrewPlain: והחכמה מאין תבוא ואי זה מקום בינה
    kjvRefs:
    - Job 28:20
    kjvOsis:
    - Job.28.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.21
    scripture: tanakh
    name: Tanakh Job 28:21
    ref: Job 28:21
    book: Job
    section: ketuvim
    chapter: 28
    verse: 21
    ordinal: 19240
    text: Seeing it is hid from the eyes of all living, And kept close from the fowls of the air.
    translation: JPS 1917
    original: וְנֶעֶלְמָה מֵעֵינֵי כָל־חָי וּמֵעוֹף הַשָּׁמַיִם נִסְתָּרָה׃
    hebrewPlain: ונעלמה מעיני כל חי ומעוף השמים נסתרה
    kjvRefs:
    - Job 28:21
    kjvOsis:
    - Job.28.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.22
    scripture: tanakh
    name: Tanakh Job 28:22
    ref: Job 28:22
    book: Job
    section: ketuvim
    chapter: 28
    verse: 22
    ordinal: 19241
    text: 'Destruction and Death say: ‘We have heard a rumor thereof with our ears.’'
    translation: JPS 1917
    original: אֲבַדּוֹן וָמָוֶת אָמְרוּ בְּאָזְנֵינוּ שָׁמַעְנוּ שִׁמְעָהּ׃
    hebrewPlain: אבדון ומות אמרו באזנינו שמענו שמעה
    kjvRefs:
    - Job 28:22
    kjvOsis:
    - Job.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.23
    scripture: tanakh
    name: Tanakh Job 28:23
    ref: Job 28:23
    book: Job
    section: ketuvim
    chapter: 28
    verse: 23
    ordinal: 19242
    text: God understandeth the way thereof, And He knoweth the place thereof.
    translation: JPS 1917
    original: אֱלֹהִים הֵבִין דַּרְכָּהּ וְהוּא יָדַע אֶת־מְקוֹמָהּ׃
    hebrewPlain: אלהים הבין דרכה והוא ידע את מקומה
    kjvRefs:
    - Job 28:23
    kjvOsis:
    - Job.28.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.24
    scripture: tanakh
    name: Tanakh Job 28:24
    ref: Job 28:24
    book: Job
    section: ketuvim
    chapter: 28
    verse: 24
    ordinal: 19243
    text: For He looketh to the ends of the earth, And seeth under the whole heaven;
    translation: JPS 1917
    original: כִּי־הוּא לִקְצוֹת־הָאָרֶץ יַבִּיט תַּחַת כָּל־הַשָּׁמַיִם יִרְאֶה׃
    hebrewPlain: כי הוא לקצות הארץ יביט תחת כל השמים יראה
    kjvRefs:
    - Job 28:24
    kjvOsis:
    - Job.28.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.25
    scripture: tanakh
    name: Tanakh Job 28:25
    ref: Job 28:25
    book: Job
    section: ketuvim
    chapter: 28
    verse: 25
    ordinal: 19244
    text: When He maketh a weight for the wind, And meteth out the waters by measure.
    translation: JPS 1917
    original: לַעֲשׂוֹת לָרוּחַ מִשְׁקָל וּמַיִם תִּכֵּן בְּמִדָּה׃
    hebrewPlain: לעשות לרוח משקל ומים תכן במדה
    kjvRefs:
    - Job 28:25
    kjvOsis:
    - Job.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.26
    scripture: tanakh
    name: Tanakh Job 28:26
    ref: Job 28:26
    book: Job
    section: ketuvim
    chapter: 28
    verse: 26
    ordinal: 19245
    text: When He made a decree for the rain, And a way for the storm of thunders;
    translation: JPS 1917
    original: בַּעֲשֹׂתוֹ לַמָּטָר חֹק וְדֶרֶךְ לַחֲזִיז קֹלוֹת׃
    hebrewPlain: בעשתו למטר חק ודרך לחזיז קלות
    kjvRefs:
    - Job 28:26
    kjvOsis:
    - Job.28.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.27
    scripture: tanakh
    name: Tanakh Job 28:27
    ref: Job 28:27
    book: Job
    section: ketuvim
    chapter: 28
    verse: 27
    ordinal: 19246
    text: Then did He see it, and declare it; He established it, yea, and searched it out.
    translation: JPS 1917
    original: אָז רָאָהּ וַיְסַפְּרָהּ הֱכִינָהּ וְגַם־חֲקָרָהּ׃
    hebrewPlain: אז ראה ויספרה הכינה וגם חקרה
    kjvRefs:
    - Job 28:27
    kjvOsis:
    - Job.28.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.28.28
    scripture: tanakh
    name: Tanakh Job 28:28
    ref: Job 28:28
    book: Job
    section: ketuvim
    chapter: 28
    verse: 28
    ordinal: 19247
    text: 'And unto man He said: ‘Behold, the fear of the Lord, that is wisdom; And to depart from evil is understanding.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָאָדָם הֵן יִרְאַת אֲדֹנָי הִיא חָכְמָה וְסוּר מֵרָע בִּינָה׃
    hebrewPlain: ויאמר לאדם הן יראת אדני היא חכמה וסור מרע בינה
    kjvRefs:
    - Job 28:28
    kjvOsis:
    - Job.28.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.28
- type: TanakhVerse
  data:
    osis: Job.29.1
    scripture: tanakh
    name: Tanakh Job 29:1
    ref: Job 29:1
    book: Job
    section: ketuvim
    chapter: 29
    verse: 1
    ordinal: 19248
    text: 'And Job again took up his parable, and said:'
    translation: JPS 1917
    original: וַיֹּסֶף אִיּוֹב שְׂאֵת מְשָׁלוֹ וַיֹּאמַר׃
    hebrewPlain: ויסף איוב שאת משלו ויאמר
    kjvRefs:
    - Job 29:1
    kjvOsis:
    - Job.29.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.2
    scripture: tanakh
    name: Tanakh Job 29:2
    ref: Job 29:2
    book: Job
    section: ketuvim
    chapter: 29
    verse: 2
    ordinal: 19249
    text: Oh that I were as in the months of old, As in the days when God watched over me;
    translation: JPS 1917
    original: מִי־יִתְּנֵנִי כְיַרְחֵי־קֶדֶם כִּימֵי אֱלוֹהַּ יִשְׁמְרֵנִי׃
    hebrewPlain: מי יתנני כירחי קדם כימי אלוה ישמרני
    kjvRefs:
    - Job 29:2
    kjvOsis:
    - Job.29.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.3
    scripture: tanakh
    name: Tanakh Job 29:3
    ref: Job 29:3
    book: Job
    section: ketuvim
    chapter: 29
    verse: 3
    ordinal: 19250
    text: When His lamp shined above my head, And by His light I walked through darkness;
    translation: JPS 1917
    original: בְּהִלּוֹ נֵרוֹ עֲלֵי רֹאשִׁי לְאוֹרוֹ אֵלֶךְ חֹשֶׁךְ׃
    hebrewPlain: בהלו נרו עלי ראשי לאורו אלך חשך
    kjvRefs:
    - Job 29:3
    kjvOsis:
    - Job.29.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.4
    scripture: tanakh
    name: Tanakh Job 29:4
    ref: Job 29:4
    book: Job
    section: ketuvim
    chapter: 29
    verse: 4
    ordinal: 19251
    text: As I was in the days of my youth, When the converse of God was upon my tent;
    translation: JPS 1917
    original: כַּאֲשֶׁר הָיִיתִי בִּימֵי חָרְפִּי בְּסוֹד אֱלוֹהַּ עֲלֵי אָהֳלִי׃
    hebrewPlain: כאשר הייתי בימי חרפי בסוד אלוה עלי אהלי
    kjvRefs:
    - Job 29:4
    kjvOsis:
    - Job.29.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.5
    scripture: tanakh
    name: Tanakh Job 29:5
    ref: Job 29:5
    book: Job
    section: ketuvim
    chapter: 29
    verse: 5
    ordinal: 19252
    text: When the Almighty was yet with me, And my children were about me;
    translation: JPS 1917
    original: בְּעוֹד שַׁדַּי עִמָּדִי סְבִיבוֹתַי נְעָרָי׃
    hebrewPlain: בעוד שדי עמדי סביבותי נערי
    kjvRefs:
    - Job 29:5
    kjvOsis:
    - Job.29.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.6
    scripture: tanakh
    name: Tanakh Job 29:6
    ref: Job 29:6
    book: Job
    section: ketuvim
    chapter: 29
    verse: 6
    ordinal: 19253
    text: When my steps were washed with butter, And the rock poured me out rivers of oil!
    translation: JPS 1917
    original: בִּרְחֹץ הֲלִיכַי בְּחֵמָה וְצוּר יָצוּק עִמָּדִי פַּלְגֵי־שָׁמֶן׃
    hebrewPlain: ברחץ הליכי בחמה וצור יצוק עמדי פלגי שמן
    kjvRefs:
    - Job 29:6
    kjvOsis:
    - Job.29.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.7
    scripture: tanakh
    name: Tanakh Job 29:7
    ref: Job 29:7
    book: Job
    section: ketuvim
    chapter: 29
    verse: 7
    ordinal: 19254
    text: When I went forth to the gate unto the city, When I prepared my seat in the broad place,
    translation: JPS 1917
    original: בְּצֵאתִי שַׁעַר עֲלֵי־קָרֶת בָּרְחוֹב אָכִין מוֹשָׁבִי׃
    hebrewPlain: בצאתי שער עלי קרת ברחוב אכין מושבי
    kjvRefs:
    - Job 29:7
    kjvOsis:
    - Job.29.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.8
    scripture: tanakh
    name: Tanakh Job 29:8
    ref: Job 29:8
    book: Job
    section: ketuvim
    chapter: 29
    verse: 8
    ordinal: 19255
    text: The young men saw me and hid themselves, And the aged rose up and stood;
    translation: JPS 1917
    original: רָאוּנִי נְעָרִים וְנֶחְבָּאוּ וִישִׁישִׁים קָמוּ עָמָדוּ׃
    hebrewPlain: ראוני נערים ונחבאו וישישים קמו עמדו
    kjvRefs:
    - Job 29:8
    kjvOsis:
    - Job.29.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.9
    scripture: tanakh
    name: Tanakh Job 29:9
    ref: Job 29:9
    book: Job
    section: ketuvim
    chapter: 29
    verse: 9
    ordinal: 19256
    text: The princes refrained talking, And laid their hand on their mouth;
    translation: JPS 1917
    original: שָׂרִים עָצְרוּ בְמִלִּים וְכַף יָשִׂימוּ לְפִיהֶם׃
    hebrewPlain: שרים עצרו במלים וכף ישימו לפיהם
    kjvRefs:
    - Job 29:9
    kjvOsis:
    - Job.29.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.10
    scripture: tanakh
    name: Tanakh Job 29:10
    ref: Job 29:10
    book: Job
    section: ketuvim
    chapter: 29
    verse: 10
    ordinal: 19257
    text: The voice of the nobles was hushed, And their tongue cleaved to the roof of their mouth.
    translation: JPS 1917
    original: קוֹל־נְגִידִים נֶחְבָּאוּ וּלְשׁוֹנָם לְחִכָּם דָּבֵקָה׃
    hebrewPlain: קול נגידים נחבאו ולשונם לחכם דבקה
    kjvRefs:
    - Job 29:10
    kjvOsis:
    - Job.29.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.11
    scripture: tanakh
    name: Tanakh Job 29:11
    ref: Job 29:11
    book: Job
    section: ketuvim
    chapter: 29
    verse: 11
    ordinal: 19258
    text: For when the ear heard me, then it blessed me, And when the eye saw me, it gave witness unto me;
    translation: JPS 1917
    original: כִּי אֹזֶן שָׁמְעָה וַתְּאַשְּׁרֵנִי וְעַיִן רָאֲתָה וַתְּעִידֵנִי׃
    hebrewPlain: כי אזן שמעה ותאשרני ועין ראתה ותעידני
    kjvRefs:
    - Job 29:11
    kjvOsis:
    - Job.29.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.12
    scripture: tanakh
    name: Tanakh Job 29:12
    ref: Job 29:12
    book: Job
    section: ketuvim
    chapter: 29
    verse: 12
    ordinal: 19259
    text: Because I delivered the poor that cried, The fatherless also, that had none to help him.
    translation: JPS 1917
    original: כִּי־אֲמַלֵּט עָנִי מְשַׁוֵּעַ וְיָתוֹם וְלֹא־עֹזֵר לוֹ׃
    hebrewPlain: כי אמלט עני משוע ויתום ולא עזר לו
    kjvRefs:
    - Job 29:12
    kjvOsis:
    - Job.29.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.13
    scripture: tanakh
    name: Tanakh Job 29:13
    ref: Job 29:13
    book: Job
    section: ketuvim
    chapter: 29
    verse: 13
    ordinal: 19260
    text: The blessing of him that was ready to perish came upon me; and I caused the widow’s heart to sing for joy.
    translation: JPS 1917
    original: בִּרְכַּת אֹבֵד עָלַי תָּבֹא וְלֵב אַלְמָנָה אַרְנִן׃
    hebrewPlain: ברכת אבד עלי תבא ולב אלמנה ארנן
    kjvRefs:
    - Job 29:13
    kjvOsis:
    - Job.29.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.14
    scripture: tanakh
    name: Tanakh Job 29:14
    ref: Job 29:14
    book: Job
    section: ketuvim
    chapter: 29
    verse: 14
    ordinal: 19261
    text: I put on righteousness, and it clothed itself with me; My justice was as a robe and a diadem.
    translation: JPS 1917
    original: צֶדֶק לָבַשְׁתִּי וַיִּלְבָּשֵׁנִי כִּמְעִיל וְצָנִיף מִשְׁפָּטִי׃
    hebrewPlain: צדק לבשתי וילבשני כמעיל וצניף משפטי
    kjvRefs:
    - Job 29:14
    kjvOsis:
    - Job.29.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.15
    scripture: tanakh
    name: Tanakh Job 29:15
    ref: Job 29:15
    book: Job
    section: ketuvim
    chapter: 29
    verse: 15
    ordinal: 19262
    text: I was eyes to the blind, And feet was I to the lame.
    translation: JPS 1917
    original: עֵינַיִם הָיִיתִי לַעִוֵּר וְרַגְלַיִם לַפִּסֵּחַ אָנִי׃
    hebrewPlain: עינים הייתי לעור ורגלים לפסח אני
    kjvRefs:
    - Job 29:15
    kjvOsis:
    - Job.29.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.16
    scripture: tanakh
    name: Tanakh Job 29:16
    ref: Job 29:16
    book: Job
    section: ketuvim
    chapter: 29
    verse: 16
    ordinal: 19263
    text: I was a father to the needy; And the cause of him that I knew not I searched out.
    translation: JPS 1917
    original: אָב אָנֹכִי לָאֶבְיוֹנִים וְרִב לֹא־יָדַעְתִּי אֶחְקְרֵהוּ׃
    hebrewPlain: אב אנכי לאביונים ורב לא ידעתי אחקרהו
    kjvRefs:
    - Job 29:16
    kjvOsis:
    - Job.29.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.17
    scripture: tanakh
    name: Tanakh Job 29:17
    ref: Job 29:17
    book: Job
    section: ketuvim
    chapter: 29
    verse: 17
    ordinal: 19264
    text: And I broke the jaws of the unrighteous, And plucked the prey out of his teeth.
    translation: JPS 1917
    original: וָאֲשַׁבְּרָה מְתַלְּעוֹת עַוָּל וּמִשִּׁנָּיו אַשְׁלִיךְ טָרֶף׃
    hebrewPlain: ואשברה מתלעות עול ומשניו אשליך טרף
    kjvRefs:
    - Job 29:17
    kjvOsis:
    - Job.29.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.18
    scripture: tanakh
    name: Tanakh Job 29:18
    ref: Job 29:18
    book: Job
    section: ketuvim
    chapter: 29
    verse: 18
    ordinal: 19265
    text: 'Then I said: ‘I shall die with my nest, And I shall multiply my days as the phoenix;'
    translation: JPS 1917
    original: וָאֹמַר עִם־קִנִּי אֶגְוָע וְכַחוֹל אַרְבֶּה יָמִים׃
    hebrewPlain: ואמר עם קני אגוע וכחול ארבה ימים
    kjvRefs:
    - Job 29:18
    kjvOsis:
    - Job.29.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.19
    scripture: tanakh
    name: Tanakh Job 29:19
    ref: Job 29:19
    book: Job
    section: ketuvim
    chapter: 29
    verse: 19
    ordinal: 19266
    text: My root shall be spread out to the waters, And the dew shall lie all night upon my branch;
    translation: JPS 1917
    original: שָׁרְשִׁי פָתוּחַ אֱלֵי־מָיִם וְטַל יָלִין בִּקְצִירִי׃
    hebrewPlain: שרשי פתוח אלי מים וטל ילין בקצירי
    kjvRefs:
    - Job 29:19
    kjvOsis:
    - Job.29.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.20
    scripture: tanakh
    name: Tanakh Job 29:20
    ref: Job 29:20
    book: Job
    section: ketuvim
    chapter: 29
    verse: 20
    ordinal: 19267
    text: My glory shall be fresh in me, And my bow shall be renewed in my hand.’
    translation: JPS 1917
    original: כְּבוֹדִי חָדָשׁ עִמָּדִי וְקַשְׁתִּי בְּיָדִי תַחֲלִיף׃
    hebrewPlain: כבודי חדש עמדי וקשתי בידי תחליף
    kjvRefs:
    - Job 29:20
    kjvOsis:
    - Job.29.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.21
    scripture: tanakh
    name: Tanakh Job 29:21
    ref: Job 29:21
    book: Job
    section: ketuvim
    chapter: 29
    verse: 21
    ordinal: 19268
    text: Unto me men gave ear, and waited, And kept silence for my counsel.
    translation: JPS 1917
    original: לִי־שָׁמְעוּ וְיִחֵלּוּ וְיִדְּמוּ לְמוֹ עֲצָתִי׃
    hebrewPlain: לי שמעו ויחלו וידמו למו עצתי
    kjvRefs:
    - Job 29:21
    kjvOsis:
    - Job.29.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.22
    scripture: tanakh
    name: Tanakh Job 29:22
    ref: Job 29:22
    book: Job
    section: ketuvim
    chapter: 29
    verse: 22
    ordinal: 19269
    text: After my words they spoke not again; And my speech dropped upon them.
    translation: JPS 1917
    original: אַחֲרֵי דְבָרִי לֹא יִשְׁנוּ וְעָלֵימוֹ תִּטֹּף מִלָּתִי׃
    hebrewPlain: אחרי דברי לא ישנו ועלימו תטף מלתי
    kjvRefs:
    - Job 29:22
    kjvOsis:
    - Job.29.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.23
    scripture: tanakh
    name: Tanakh Job 29:23
    ref: Job 29:23
    book: Job
    section: ketuvim
    chapter: 29
    verse: 23
    ordinal: 19270
    text: And they waited for me as for the rain; And they opened their mouth wide as for the latter rain.
    translation: JPS 1917
    original: וְיִחֲלוּ כַמָּטָר לִי וּפִיהֶם פָּעֲרוּ לְמַלְקוֹשׁ׃
    hebrewPlain: ויחלו כמטר לי ופיהם פערו למלקוש
    kjvRefs:
    - Job 29:23
    kjvOsis:
    - Job.29.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.24
    scripture: tanakh
    name: Tanakh Job 29:24
    ref: Job 29:24
    book: Job
    section: ketuvim
    chapter: 29
    verse: 24
    ordinal: 19271
    text: If I laughed on them, they believed it not; And the light of my countenance they cast not down.
    translation: JPS 1917
    original: אֶשְׂחַק אֲלֵהֶם לֹא יַאֲמִינוּ וְאוֹר פָּנַי לֹא יַפִּילוּן׃
    hebrewPlain: אשחק אלהם לא יאמינו ואור פני לא יפילון
    kjvRefs:
    - Job 29:24
    kjvOsis:
    - Job.29.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.29.25
    scripture: tanakh
    name: Tanakh Job 29:25
    ref: Job 29:25
    book: Job
    section: ketuvim
    chapter: 29
    verse: 25
    ordinal: 19272
    text: I chose out their way, and sat as chief, And dwelt as a king in the army, As one that comforteth the mourners.
    translation: JPS 1917
    original: אֶבֲחַר דַּרְכָּם וְאֵשֵׁב רֹאשׁ וְאֶשְׁכּוֹן כְּמֶלֶךְ בַּגְּדוּד כַּאֲשֶׁר אֲבֵלִים יְנַחֵם׃
    hebrewPlain: אבחר דרכם ואשב ראש ואשכון כמלך בגדוד כאשר אבלים ינחם
    kjvRefs:
    - Job 29:25
    kjvOsis:
    - Job.29.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.29
- type: TanakhVerse
  data:
    osis: Job.30.1
    scripture: tanakh
    name: Tanakh Job 30:1
    ref: Job 30:1
    book: Job
    section: ketuvim
    chapter: 30
    verse: 1
    ordinal: 19273
    text: But now they that are younger than I have me in derision, Whose fathers I disdained to set with the dogs of my flock.
    translation: JPS 1917
    original: וְעַתָּה שָׂחֲקוּ עָלַי צְעִירִים מִמֶּנִּי לְיָמִים אֲשֶׁר־מָאַסְתִּי אֲבוֹתָם לָשִׁית עִם־כַּלְבֵי צֹאנִי׃
    hebrewPlain: ועתה שחקו עלי צעירים ממני לימים אשר מאסתי אבותם לשית עם כלבי צאני
    kjvRefs:
    - Job 30:1
    kjvOsis:
    - Job.30.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.2
    scripture: tanakh
    name: Tanakh Job 30:2
    ref: Job 30:2
    book: Job
    section: ketuvim
    chapter: 30
    verse: 2
    ordinal: 19274
    text: Yea, the strength of their hands, whereto should it profit me? Men in whom ripe age is perished.
    translation: JPS 1917
    original: גַּם־כֹּחַ יְדֵיהֶם לָמָּה לִּי עָלֵימוֹ אָבַד כָּלַח׃
    hebrewPlain: גם כח ידיהם למה לי עלימו אבד כלח
    kjvRefs:
    - Job 30:2
    kjvOsis:
    - Job.30.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.3
    scripture: tanakh
    name: Tanakh Job 30:3
    ref: Job 30:3
    book: Job
    section: ketuvim
    chapter: 30
    verse: 3
    ordinal: 19275
    text: They are gaunt with want and famine; They gnaw the dry ground, in the gloom of wasteness and desolation.
    translation: JPS 1917
    original: בְּחֶסֶר וּבְכָפָן גַּלְמוּד הַעֹרְקִים צִיָּה אֶמֶשׁ שׁוֹאָה וּמְשֹׁאָה׃
    hebrewPlain: בחסר ובכפן גלמוד הערקים ציה אמש שואה ומשאה
    kjvRefs:
    - Job 30:3
    kjvOsis:
    - Job.30.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.4
    scripture: tanakh
    name: Tanakh Job 30:4
    ref: Job 30:4
    book: Job
    section: ketuvim
    chapter: 30
    verse: 4
    ordinal: 19276
    text: They pluck salt-wort with wormwood; And the roots of the broom are their food.
    translation: JPS 1917
    original: הַקֹּטְפִים מַלּוּחַ עֲלֵי־שִׂיחַ וְשֹׁרֶשׁ רְתָמִים לַחְמָם׃
    hebrewPlain: הקטפים מלוח עלי שיח ושרש רתמים לחמם
    kjvRefs:
    - Job 30:4
    kjvOsis:
    - Job.30.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.5
    scripture: tanakh
    name: Tanakh Job 30:5
    ref: Job 30:5
    book: Job
    section: ketuvim
    chapter: 30
    verse: 5
    ordinal: 19277
    text: They are driven forth from the midst of men; They cry after them as after a thief.
    translation: JPS 1917
    original: מִן־גֵּו יְגֹרָשׁוּ יָרִיעוּ עָלֵימוֹ כַּגַּנָּב׃
    hebrewPlain: מן גו יגרשו יריעו עלימו כגנב
    kjvRefs:
    - Job 30:5
    kjvOsis:
    - Job.30.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.6
    scripture: tanakh
    name: Tanakh Job 30:6
    ref: Job 30:6
    book: Job
    section: ketuvim
    chapter: 30
    verse: 6
    ordinal: 19278
    text: In the clefts of the valleys must they dwell, In holes of the earth and of the rocks.
    translation: JPS 1917
    original: בַּעֲרוּץ נְחָלִים לִשְׁכֹּן חֹרֵי עָפָר וְכֵפִים׃
    hebrewPlain: בערוץ נחלים לשכן חרי עפר וכפים
    kjvRefs:
    - Job 30:6
    kjvOsis:
    - Job.30.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.7
    scripture: tanakh
    name: Tanakh Job 30:7
    ref: Job 30:7
    book: Job
    section: ketuvim
    chapter: 30
    verse: 7
    ordinal: 19279
    text: Among the bushes they bray; Under the nettles they are gathered together.
    translation: JPS 1917
    original: בֵּין־שִׂיחִים יִנְהָקוּ תַּחַת חָרוּל יְסֻפָּחוּ׃
    hebrewPlain: בין שיחים ינהקו תחת חרול יספחו
    kjvRefs:
    - Job 30:7
    kjvOsis:
    - Job.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.8
    scripture: tanakh
    name: Tanakh Job 30:8
    ref: Job 30:8
    book: Job
    section: ketuvim
    chapter: 30
    verse: 8
    ordinal: 19280
    text: They are children of churls, yea, children of ignoble men; They were scourged out of the land.
    translation: JPS 1917
    original: בְּנֵי־נָבָל גַּם־בְּנֵי בְלִי־שֵׁם נִכְּאוּ מִן־הָאָרֶץ׃
    hebrewPlain: בני נבל גם בני בלי שם נכאו מן הארץ
    kjvRefs:
    - Job 30:8
    kjvOsis:
    - Job.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.9
    scripture: tanakh
    name: Tanakh Job 30:9
    ref: Job 30:9
    book: Job
    section: ketuvim
    chapter: 30
    verse: 9
    ordinal: 19281
    text: And now I am become their song, Yea, I am a byword unto them.
    translation: JPS 1917
    original: וְעַתָּה נְגִינָתָם הָיִיתִי וָאֱהִי לָהֶם לְמִלָּה׃
    hebrewPlain: ועתה נגינתם הייתי ואהי להם למלה
    kjvRefs:
    - Job 30:9
    kjvOsis:
    - Job.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.10
    scripture: tanakh
    name: Tanakh Job 30:10
    ref: Job 30:10
    book: Job
    section: ketuvim
    chapter: 30
    verse: 10
    ordinal: 19282
    text: They abhor me, they flee far from me, And spare not to spit in my face.
    translation: JPS 1917
    original: תִּעֲבוּנִי רָחֲקוּ מֶנִּי וּמִפָּנַי לֹא־חָשְׂכוּ רֹק׃
    hebrewPlain: תעבוני רחקו מני ומפני לא חשכו רק
    kjvRefs:
    - Job 30:10
    kjvOsis:
    - Job.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.11
    scripture: tanakh
    name: Tanakh Job 30:11
    ref: Job 30:11
    book: Job
    section: ketuvim
    chapter: 30
    verse: 11
    ordinal: 19283
    text: For He hath loosed my cord, and afflicted me, And they have cast off the bridle before me.
    translation: JPS 1917
    original: כִּי־יתרו [יִתְרִי] פִתַּח וַיְעַנֵּנִי וְרֶסֶן מִפָּנַי שִׁלֵּחוּ׃
    hebrewPlain: כי יתרו [יתרי] פתח ויענני ורסן מפני שלחו
    kjvRefs:
    - Job 30:11
    kjvOsis:
    - Job.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.12
    scripture: tanakh
    name: Tanakh Job 30:12
    ref: Job 30:12
    book: Job
    section: ketuvim
    chapter: 30
    verse: 12
    ordinal: 19284
    text: Upon my right hand rise the brood; They entangle my feet, And they cast up against me their ways of destruction.
    translation: JPS 1917
    original: עַל־יָמִין פִּרְחַח יָקוּמוּ רַגְלַי שִׁלֵּחוּ וַיָּסֹלּוּ עָלַי אָרְחוֹת אֵידָם׃
    hebrewPlain: על ימין פרחח יקומו רגלי שלחו ויסלו עלי ארחות אידם
    kjvRefs:
    - Job 30:12
    kjvOsis:
    - Job.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.13
    scripture: tanakh
    name: Tanakh Job 30:13
    ref: Job 30:13
    book: Job
    section: ketuvim
    chapter: 30
    verse: 13
    ordinal: 19285
    text: They break up my path, They further my calamity, Even men that have no helper.
    translation: JPS 1917
    original: נָתְסוּ נְתִיבָתִי לְהַוָּתִי יֹעִילוּ לֹא עֹזֵר לָמוֹ׃
    hebrewPlain: נתסו נתיבתי להותי יעילו לא עזר למו
    kjvRefs:
    - Job 30:13
    kjvOsis:
    - Job.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.14
    scripture: tanakh
    name: Tanakh Job 30:14
    ref: Job 30:14
    book: Job
    section: ketuvim
    chapter: 30
    verse: 14
    ordinal: 19286
    text: As through a wide breach they come; In the midst of the ruin they roll themselves upon me.
    translation: JPS 1917
    original: כְּפֶרֶץ רָחָב יֶאֱתָיוּ תַּחַת שֹׁאָה הִתְגַּלְגָּלוּ׃
    hebrewPlain: כפרץ רחב יאתיו תחת שאה התגלגלו
    kjvRefs:
    - Job 30:14
    kjvOsis:
    - Job.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.15
    scripture: tanakh
    name: Tanakh Job 30:15
    ref: Job 30:15
    book: Job
    section: ketuvim
    chapter: 30
    verse: 15
    ordinal: 19287
    text: Terrors are turned upon me, They chase mine honour as the wind; And my welfare is passed away as a cloud.
    translation: JPS 1917
    original: הָהְפַּךְ עָלַי בַּלָּהוֹת תִּרְדֹּף כָּרוּחַ נְדִבָתִי וּכְעָב עָבְרָה יְשֻׁעָתִי׃
    hebrewPlain: ההפך עלי בלהות תרדף כרוח נדבתי וכעב עברה ישעתי
    kjvRefs:
    - Job 30:15
    kjvOsis:
    - Job.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.16
    scripture: tanakh
    name: Tanakh Job 30:16
    ref: Job 30:16
    book: Job
    section: ketuvim
    chapter: 30
    verse: 16
    ordinal: 19288
    text: And now my soul is poured out within me; Days of affliction have taken hold upon me.
    translation: JPS 1917
    original: וְעַתָּה עָלַי תִּשְׁתַּפֵּךְ נַפְשִׁי יֹאחֲזוּנִי יְמֵי־עֹנִי׃
    hebrewPlain: ועתה עלי תשתפך נפשי יאחזוני ימי עני
    kjvRefs:
    - Job 30:16
    kjvOsis:
    - Job.30.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.17
    scripture: tanakh
    name: Tanakh Job 30:17
    ref: Job 30:17
    book: Job
    section: ketuvim
    chapter: 30
    verse: 17
    ordinal: 19289
    text: In the night my bones are pierced, and fall from me, And my sinews take no rest.
    translation: JPS 1917
    original: לַיְלָה עֲצָמַי נִקַּר מֵעָלָי וְעֹרְקַי לֹא יִשְׁכָּבוּן׃
    hebrewPlain: לילה עצמי נקר מעלי וערקי לא ישכבון
    kjvRefs:
    - Job 30:17
    kjvOsis:
    - Job.30.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.18
    scripture: tanakh
    name: Tanakh Job 30:18
    ref: Job 30:18
    book: Job
    section: ketuvim
    chapter: 30
    verse: 18
    ordinal: 19290
    text: By the great force [of my disease] is my garment disfigured; It bindeth me about as the collar of my coat.
    translation: JPS 1917
    original: בְּרָב־כֹּחַ יִתְחַפֵּשׂ לְבוּשִׁי כְּפִי כֻתָּנְתִּי יַאַזְרֵנִי׃
    hebrewPlain: ברב כח יתחפש לבושי כפי כתנתי יאזרני
    kjvRefs:
    - Job 30:18
    kjvOsis:
    - Job.30.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.19
    scripture: tanakh
    name: Tanakh Job 30:19
    ref: Job 30:19
    book: Job
    section: ketuvim
    chapter: 30
    verse: 19
    ordinal: 19291
    text: He hath cast me into the mire, And I am become like dust and ashes.
    translation: JPS 1917
    original: הֹרָנִי לַחֹמֶר וָאֶתְמַשֵּׁל כֶּעָפָר וָאֵפֶר׃
    hebrewPlain: הרני לחמר ואתמשל כעפר ואפר
    kjvRefs:
    - Job 30:19
    kjvOsis:
    - Job.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.20
    scripture: tanakh
    name: Tanakh Job 30:20
    ref: Job 30:20
    book: Job
    section: ketuvim
    chapter: 30
    verse: 20
    ordinal: 19292
    text: I cry unto Thee, and Thou dost not answer me; I stand up, and Thou lookest at me. .
    translation: JPS 1917
    original: אֲשַׁוַּע אֵלֶיךָ וְלֹא תַעֲנֵנִי עָמַדְתִּי וַתִּתְבֹּנֶן בִּי׃
    hebrewPlain: אשוע אליך ולא תענני עמדתי ותתבנן בי
    kjvRefs:
    - Job 30:20
    kjvOsis:
    - Job.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.21
    scripture: tanakh
    name: Tanakh Job 30:21
    ref: Job 30:21
    book: Job
    section: ketuvim
    chapter: 30
    verse: 21
    ordinal: 19293
    text: Thou art turned to be cruel to me; With the might of Thy hand Thou hatest me.
    translation: JPS 1917
    original: תֵּהָפֵךְ לְאַכְזָר לִי בְּעֹצֶם יָדְךָ תִשְׂטְמֵנִי׃
    hebrewPlain: תהפך לאכזר לי בעצם ידך תשטמני
    kjvRefs:
    - Job 30:21
    kjvOsis:
    - Job.30.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.22
    scripture: tanakh
    name: Tanakh Job 30:22
    ref: Job 30:22
    book: Job
    section: ketuvim
    chapter: 30
    verse: 22
    ordinal: 19294
    text: Thou liftest me up to the wind, Thou causest me to ride upon it; And Thou dissolvest my substance.
    translation: JPS 1917
    original: תִּשָּׂאֵנִי אֶל־רוּחַ תַּרְכִּיבֵנִי וּתְמֹגְגֵנִי תשוה [תּוּשִׁיָּה׃]
    hebrewPlain: תשאני אל רוח תרכיבני ותמגגני תשוה [תושיה]
    kjvRefs:
    - Job 30:22
    kjvOsis:
    - Job.30.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.23
    scripture: tanakh
    name: Tanakh Job 30:23
    ref: Job 30:23
    book: Job
    section: ketuvim
    chapter: 30
    verse: 23
    ordinal: 19295
    text: For I know that Thou wilt bring me to death, And to the house appointed for all living.
    translation: JPS 1917
    original: כִּי־יָדַעְתִּי מָוֶת תְּשִׁיבֵנִי וּבֵית מוֹעֵד לְכָל־חָי׃
    hebrewPlain: כי ידעתי מות תשיבני ובית מועד לכל חי
    kjvRefs:
    - Job 30:23
    kjvOsis:
    - Job.30.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.24
    scripture: tanakh
    name: Tanakh Job 30:24
    ref: Job 30:24
    book: Job
    section: ketuvim
    chapter: 30
    verse: 24
    ordinal: 19296
    text: Surely none shall put forth his hand to a ruinous heap, Neither because of these things shall help come in one’s calamity,
    translation: JPS 1917
    original: אַךְ לֹא־בְעִי יִשְׁלַח־יָד אִם־בְּפִידוֹ לָהֶן שׁוּעַ׃
    hebrewPlain: אך לא בעי ישלח יד אם בפידו להן שוע
    kjvRefs:
    - Job 30:24
    kjvOsis:
    - Job.30.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.25
    scripture: tanakh
    name: Tanakh Job 30:25
    ref: Job 30:25
    book: Job
    section: ketuvim
    chapter: 30
    verse: 25
    ordinal: 19297
    text: If I have not wept for him that was in trouble, And if my soul grieved not for the needy.
    translation: JPS 1917
    original: אִם־לֹא בָכִיתִי לִקְשֵׁה־יוֹם עָגְמָה נַפְשִׁי לָאֶבְיוֹן׃
    hebrewPlain: אם לא בכיתי לקשה יום עגמה נפשי לאביון
    kjvRefs:
    - Job 30:25
    kjvOsis:
    - Job.30.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.26
    scripture: tanakh
    name: Tanakh Job 30:26
    ref: Job 30:26
    book: Job
    section: ketuvim
    chapter: 30
    verse: 26
    ordinal: 19298
    text: Yet, when I looked for good, there came evil; And when I waited for light, there came darkness.
    translation: JPS 1917
    original: כִּי טוֹב קִוִּיתִי וַיָּבֹא רָע וַאֲיַחֲלָה לְאוֹר וַיָּבֹא אֹפֶל׃
    hebrewPlain: כי טוב קויתי ויבא רע ואיחלה לאור ויבא אפל
    kjvRefs:
    - Job 30:26
    kjvOsis:
    - Job.30.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.27
    scripture: tanakh
    name: Tanakh Job 30:27
    ref: Job 30:27
    book: Job
    section: ketuvim
    chapter: 30
    verse: 27
    ordinal: 19299
    text: Mine inwards boil, and rest not; Days of affliction are come upon me.
    translation: JPS 1917
    original: מֵעַי רֻתְּחוּ וְלֹא־דָמּוּ קִדְּמֻנִי יְמֵי־עֹנִי׃
    hebrewPlain: מעי רתחו ולא דמו קדמני ימי עני
    kjvRefs:
    - Job 30:27
    kjvOsis:
    - Job.30.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.28
    scripture: tanakh
    name: Tanakh Job 30:28
    ref: Job 30:28
    book: Job
    section: ketuvim
    chapter: 30
    verse: 28
    ordinal: 19300
    text: I go mourning without the sun; I stand up in the assembly, and cry for help.
    translation: JPS 1917
    original: קֹדֵר הִלַּכְתִּי בְּלֹא חַמָּה קַמְתִּי בַקָּהָל אֲשַׁוֵּעַ׃
    hebrewPlain: קדר הלכתי בלא חמה קמתי בקהל אשוע
    kjvRefs:
    - Job 30:28
    kjvOsis:
    - Job.30.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.29
    scripture: tanakh
    name: Tanakh Job 30:29
    ref: Job 30:29
    book: Job
    section: ketuvim
    chapter: 30
    verse: 29
    ordinal: 19301
    text: I am become a brother to jackals, And a companion to ostriches.
    translation: JPS 1917
    original: אָח הָיִיתִי לְתַנִּים וְרֵעַ לִבְנוֹת יַעֲנָה׃
    hebrewPlain: אח הייתי לתנים ורע לבנות יענה
    kjvRefs:
    - Job 30:29
    kjvOsis:
    - Job.30.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.30
    scripture: tanakh
    name: Tanakh Job 30:30
    ref: Job 30:30
    book: Job
    section: ketuvim
    chapter: 30
    verse: 30
    ordinal: 19302
    text: My skin is black, and falleth from me, And my bones are burned with heat.
    translation: JPS 1917
    original: עוֹרִי שָׁחַר מֵעָלָי וְעַצְמִי־חָרָה מִנִּי־חֹרֶב׃
    hebrewPlain: עורי שחר מעלי ועצמי חרה מני חרב
    kjvRefs:
    - Job 30:30
    kjvOsis:
    - Job.30.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.30.31
    scripture: tanakh
    name: Tanakh Job 30:31
    ref: Job 30:31
    book: Job
    section: ketuvim
    chapter: 30
    verse: 31
    ordinal: 19303
    text: Therefore is my harp turned to mourning, And my pipe into the voice of them that weep.
    translation: JPS 1917
    original: וַיְהִי לְאֵבֶל כִּנֹּרִי וְעֻגָבִי לְקוֹל בֹּכִים׃
    hebrewPlain: ויהי לאבל כנרי ועגבי לקול בכים
    kjvRefs:
    - Job 30:31
    kjvOsis:
    - Job.30.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.30
- type: TanakhVerse
  data:
    osis: Job.31.1
    scripture: tanakh
    name: Tanakh Job 31:1
    ref: Job 31:1
    book: Job
    section: ketuvim
    chapter: 31
    verse: 1
    ordinal: 19304
    text: I made a covenant with mine eyes; How then should I look upon a maid?
    translation: JPS 1917
    original: בְּרִית כָּרַתִּי לְעֵינָי וּמָה אֶתְבּוֹנֵן עַל־בְּתוּלָה׃
    hebrewPlain: ברית כרתי לעיני ומה אתבונן על בתולה
    kjvRefs:
    - Job 31:1
    kjvOsis:
    - Job.31.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.2
    scripture: tanakh
    name: Tanakh Job 31:2
    ref: Job 31:2
    book: Job
    section: ketuvim
    chapter: 31
    verse: 2
    ordinal: 19305
    text: For what would be the portion of God from above, And the heritage of the Almighty from on high?
    translation: JPS 1917
    original: וּמֶה חֵלֶק אֱלוֹהַּ מִמָּעַל וְנַחֲלַת שַׁדַּי מִמְּרֹמִים׃
    hebrewPlain: ומה חלק אלוה ממעל ונחלת שדי ממרמים
    kjvRefs:
    - Job 31:2
    kjvOsis:
    - Job.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.3
    scripture: tanakh
    name: Tanakh Job 31:3
    ref: Job 31:3
    book: Job
    section: ketuvim
    chapter: 31
    verse: 3
    ordinal: 19306
    text: Is it not calamity to the unrighteous, And disaster to the workers of iniquity?
    translation: JPS 1917
    original: הֲלֹא־אֵיד לְעַוָּל וְנֵכֶר לְפֹעֲלֵי אָוֶן׃
    hebrewPlain: הלא איד לעול ונכר לפעלי און
    kjvRefs:
    - Job 31:3
    kjvOsis:
    - Job.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.4
    scripture: tanakh
    name: Tanakh Job 31:4
    ref: Job 31:4
    book: Job
    section: ketuvim
    chapter: 31
    verse: 4
    ordinal: 19307
    text: Doth not He see my ways, And count all my steps?
    translation: JPS 1917
    original: הֲלֹא־הוּא יִרְאֶה דְרָכָי וְכָל־צְעָדַי יִסְפּוֹר׃
    hebrewPlain: הלא הוא יראה דרכי וכל צעדי יספור
    kjvRefs:
    - Job 31:4
    kjvOsis:
    - Job.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.5
    scripture: tanakh
    name: Tanakh Job 31:5
    ref: Job 31:5
    book: Job
    section: ketuvim
    chapter: 31
    verse: 5
    ordinal: 19308
    text: If I have walked with vanity, And my foot hath hasted to deceit—
    translation: JPS 1917
    original: אִם־הָלַכְתִּי עִם־שָׁוְא וַתַּחַשׁ עַל־מִרְמָה רַגְלִי׃
    hebrewPlain: אם הלכתי עם שוא ותחש על מרמה רגלי
    kjvRefs:
    - Job 31:5
    kjvOsis:
    - Job.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.6
    scripture: tanakh
    name: Tanakh Job 31:6
    ref: Job 31:6
    book: Job
    section: ketuvim
    chapter: 31
    verse: 6
    ordinal: 19309
    text: Let me be weighed in a just balance, That God may know mine integrity—
    translation: JPS 1917
    original: יִשְׁקְלֵנִי בְמֹאזְנֵי־צֶדֶק וְיֵדַע אֱלוֹהַּ תֻּמָּתִי׃
    hebrewPlain: ישקלני במאזני צדק וידע אלוה תמתי
    kjvRefs:
    - Job 31:6
    kjvOsis:
    - Job.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.7
    scripture: tanakh
    name: Tanakh Job 31:7
    ref: Job 31:7
    book: Job
    section: ketuvim
    chapter: 31
    verse: 7
    ordinal: 19310
    text: If my step hath turned out of the way, And my heart walked after mine eyes, And if any spot hath cleaved to my hands;
    translation: JPS 1917
    original: אִם תִּטֶּה אַשֻּׁרִי מִנִּי הַדָּרֶךְ וְאַחַר עֵינַי הָלַךְ לִבִּי וּבְכַפַּי דָּבַק מֻאוּם׃
    hebrewPlain: אם תטה אשרי מני הדרך ואחר עיני הלך לבי ובכפי דבק מאום
    kjvRefs:
    - Job 31:7
    kjvOsis:
    - Job.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.8
    scripture: tanakh
    name: Tanakh Job 31:8
    ref: Job 31:8
    book: Job
    section: ketuvim
    chapter: 31
    verse: 8
    ordinal: 19311
    text: Then let me sow, and let another eat; Yea, let the produce of my field be rooted out.
    translation: JPS 1917
    original: אֶזְרְעָה וְאַחֵר יֹאכֵל וְצֶאֱצָאַי יְשֹׁרָשׁוּ׃
    hebrewPlain: אזרעה ואחר יאכל וצאצאי ישרשו
    kjvRefs:
    - Job 31:8
    kjvOsis:
    - Job.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.9
    scripture: tanakh
    name: Tanakh Job 31:9
    ref: Job 31:9
    book: Job
    section: ketuvim
    chapter: 31
    verse: 9
    ordinal: 19312
    text: If my heart have been enticed unto a woman, And I have lain in wait at my neighbour’s door;
    translation: JPS 1917
    original: אִם־נִפְתָּה לִבִּי עַל־אִשָּׁה וְעַל־פֶּתַח רֵעִי אָרָבְתִּי׃
    hebrewPlain: אם נפתה לבי על אשה ועל פתח רעי ארבתי
    kjvRefs:
    - Job 31:9
    kjvOsis:
    - Job.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.10
    scripture: tanakh
    name: Tanakh Job 31:10
    ref: Job 31:10
    book: Job
    section: ketuvim
    chapter: 31
    verse: 10
    ordinal: 19313
    text: Then let my wife grind unto another, And let others bow down upon her. .
    translation: JPS 1917
    original: תִּטְחַן לְאַחֵר אִשְׁתִּי וְעָלֶיהָ יִכְרְעוּן אֲחֵרִין׃
    hebrewPlain: תטחן לאחר אשתי ועליה יכרעון אחרין
    kjvRefs:
    - Job 31:10
    kjvOsis:
    - Job.31.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.11
    scripture: tanakh
    name: Tanakh Job 31:11
    ref: Job 31:11
    book: Job
    section: ketuvim
    chapter: 31
    verse: 11
    ordinal: 19314
    text: For that were a heinous crime; Yea, it were an iniquity to be punished by the judges.
    translation: JPS 1917
    original: כִּי־הוא [הִיא] זִמָּה והיא [וְהוּא] עָוֺן פְּלִילִים׃
    hebrewPlain: כי הוא [היא] זמה והיא [והוא] עון פלילים
    kjvRefs:
    - Job 31:11
    kjvOsis:
    - Job.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.12
    scripture: tanakh
    name: Tanakh Job 31:12
    ref: Job 31:12
    book: Job
    section: ketuvim
    chapter: 31
    verse: 12
    ordinal: 19315
    text: For it is a fire that consumeth unto destruction, And would root out all mine increase.
    translation: JPS 1917
    original: כִּי אֵשׁ הִיא עַד־אֲבַדּוֹן תֹּאכֵל וּבְכָל־תְּבוּאָתִי תְשָׁרֵשׁ׃
    hebrewPlain: כי אש היא עד אבדון תאכל ובכל תבואתי תשרש
    kjvRefs:
    - Job 31:12
    kjvOsis:
    - Job.31.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.13
    scripture: tanakh
    name: Tanakh Job 31:13
    ref: Job 31:13
    book: Job
    section: ketuvim
    chapter: 31
    verse: 13
    ordinal: 19316
    text: If I did despise the cause of my man-servant, Or of my maid-servant, when they contended with me—
    translation: JPS 1917
    original: אִם־אֶמְאַס מִשְׁפַּט עַבְדִּי וַאֲמָתִי בְּרִבָם עִמָּדִי׃
    hebrewPlain: אם אמאס משפט עבדי ואמתי ברבם עמדי
    kjvRefs:
    - Job 31:13
    kjvOsis:
    - Job.31.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.14
    scripture: tanakh
    name: Tanakh Job 31:14
    ref: Job 31:14
    book: Job
    section: ketuvim
    chapter: 31
    verse: 14
    ordinal: 19317
    text: What then shall I do when God riseth up? And when He remembereth, what shall I answer Him?
    translation: JPS 1917
    original: וּמָה אֶעֱשֶׂה כִּי־יָקוּם אֵל וְכִי־יִפְקֹד מָה אֲשִׁיבֶנּוּ׃
    hebrewPlain: ומה אעשה כי יקום אל וכי יפקד מה אשיבנו
    kjvRefs:
    - Job 31:14
    kjvOsis:
    - Job.31.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.15
    scripture: tanakh
    name: Tanakh Job 31:15
    ref: Job 31:15
    book: Job
    section: ketuvim
    chapter: 31
    verse: 15
    ordinal: 19318
    text: Did not He that made me in the womb make him? And did not One fashion us in the womb?
    translation: JPS 1917
    original: הֲ‍לֹא־בַבֶּטֶן עֹשֵׂנִי עָשָׂהוּ וַיְכֻנֶנּוּ בָּרֶחֶם אֶחָד׃
    hebrewPlain: ה‍לא בבטן עשני עשהו ויכננו ברחם אחד
    kjvRefs:
    - Job 31:15
    kjvOsis:
    - Job.31.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.16
    scripture: tanakh
    name: Tanakh Job 31:16
    ref: Job 31:16
    book: Job
    section: ketuvim
    chapter: 31
    verse: 16
    ordinal: 19319
    text: If I have withheld aught that the poor desired, Or have caused the eyes of the widow to fail;
    translation: JPS 1917
    original: אִם־אֶמְנַע מֵחֵפֶץ דַּלִּים וְעֵינֵי אַלְמָנָה אֲכַלֶּה׃
    hebrewPlain: אם אמנע מחפץ דלים ועיני אלמנה אכלה
    kjvRefs:
    - Job 31:16
    kjvOsis:
    - Job.31.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.17
    scripture: tanakh
    name: Tanakh Job 31:17
    ref: Job 31:17
    book: Job
    section: ketuvim
    chapter: 31
    verse: 17
    ordinal: 19320
    text: Or have eaten my morsel myself alone, And the fatherless hath not eaten thereof—
    translation: JPS 1917
    original: וְאֹכַל פִּתִּי לְבַדִּי וְלֹא־אָכַל יָתוֹם מִמֶּנָּה׃
    hebrewPlain: ואכל פתי לבדי ולא אכל יתום ממנה
    kjvRefs:
    - Job 31:17
    kjvOsis:
    - Job.31.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.18
    scripture: tanakh
    name: Tanakh Job 31:18
    ref: Job 31:18
    book: Job
    section: ketuvim
    chapter: 31
    verse: 18
    ordinal: 19321
    text: Nay, from my youth he grew up with me as with a father, And I have been her guide from my mother’s womb.
    translation: JPS 1917
    original: כִּי מִנְּעוּרַי גְּדֵלַנִי כְאָב וּמִבֶּטֶן אִמִּי אַנְחֶנָּה׃
    hebrewPlain: כי מנעורי גדלני כאב ומבטן אמי אנחנה
    kjvRefs:
    - Job 31:18
    kjvOsis:
    - Job.31.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.19
    scripture: tanakh
    name: Tanakh Job 31:19
    ref: Job 31:19
    book: Job
    section: ketuvim
    chapter: 31
    verse: 19
    ordinal: 19322
    text: If I have seen any wanderer in want of clothing, Or that the needy had no covering;
    translation: JPS 1917
    original: אִם־אֶרְאֶה אוֹבֵד מִבְּלִי לְבוּשׁ וְאֵין כְּסוּת לָאֶבְיוֹן׃
    hebrewPlain: אם אראה אובד מבלי לבוש ואין כסות לאביון
    kjvRefs:
    - Job 31:19
    kjvOsis:
    - Job.31.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.20
    scripture: tanakh
    name: Tanakh Job 31:20
    ref: Job 31:20
    book: Job
    section: ketuvim
    chapter: 31
    verse: 20
    ordinal: 19323
    text: If his loins have not blessed me, And if he were not warmed with the fleece of my sheep;
    translation: JPS 1917
    original: אִם־לֹא בֵרֲכוּנִי חלצו [חֲלָצָיו] וּמִגֵּז כְּבָשַׂי יִתְחַמָּם׃
    hebrewPlain: אם לא ברכוני חלצו [חלציו] ומגז כבשי יתחמם
    kjvRefs:
    - Job 31:20
    kjvOsis:
    - Job.31.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.21
    scripture: tanakh
    name: Tanakh Job 31:21
    ref: Job 31:21
    book: Job
    section: ketuvim
    chapter: 31
    verse: 21
    ordinal: 19324
    text: If I have lifted up my hand against the fatherless, Because I saw my help in the gate;
    translation: JPS 1917
    original: אִם־הֲנִיפוֹתִי עַל־יָתוֹם יָדִי כִּי־אֶרְאֶה בַשַּׁעַר עֶזְרָתִי׃
    hebrewPlain: אם הניפותי על יתום ידי כי אראה בשער עזרתי
    kjvRefs:
    - Job 31:21
    kjvOsis:
    - Job.31.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.22
    scripture: tanakh
    name: Tanakh Job 31:22
    ref: Job 31:22
    book: Job
    section: ketuvim
    chapter: 31
    verse: 22
    ordinal: 19325
    text: Then let my shoulder fall from the shoulder-blade, And mine arm be broken from the bone.
    translation: JPS 1917
    original: כְּתֵפִי מִשִּׁכְמָה תִפּוֹל וְאֶזְרֹעִי מִקָּנָה תִשָּׁבֵר׃
    hebrewPlain: כתפי משכמה תפול ואזרעי מקנה תשבר
    kjvRefs:
    - Job 31:22
    kjvOsis:
    - Job.31.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.23
    scripture: tanakh
    name: Tanakh Job 31:23
    ref: Job 31:23
    book: Job
    section: ketuvim
    chapter: 31
    verse: 23
    ordinal: 19326
    text: For calamity from God was a terror to me, And by reason of His majesty I could do nothing.
    translation: JPS 1917
    original: כִּי פַחַד אֵלַי אֵיד אֵל וּמִשְּׂאֵתוֹ לֹא אוּכָל׃
    hebrewPlain: כי פחד אלי איד אל ומשאתו לא אוכל
    kjvRefs:
    - Job 31:23
    kjvOsis:
    - Job.31.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.24
    scripture: tanakh
    name: Tanakh Job 31:24
    ref: Job 31:24
    book: Job
    section: ketuvim
    chapter: 31
    verse: 24
    ordinal: 19327
    text: 'If I have made gold my hope, And have said to the fine gold: ‘Thou art my confidence’;'
    translation: JPS 1917
    original: אִם־שַׂמְתִּי זָהָב כִּסְלִי וְלַכֶּתֶם אָמַרְתִּי מִבְטַחִי׃
    hebrewPlain: אם שמתי זהב כסלי ולכתם אמרתי מבטחי
    kjvRefs:
    - Job 31:24
    kjvOsis:
    - Job.31.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.25
    scripture: tanakh
    name: Tanakh Job 31:25
    ref: Job 31:25
    book: Job
    section: ketuvim
    chapter: 31
    verse: 25
    ordinal: 19328
    text: If I rejoiced because my wealth was great, And because my hand had gotten much;
    translation: JPS 1917
    original: אִם־אֶשְׂמַח כִּי־רַב חֵילִי וְכִי־כַבִּיר מָצְאָה יָדִי׃
    hebrewPlain: אם אשמח כי רב חילי וכי כביר מצאה ידי
    kjvRefs:
    - Job 31:25
    kjvOsis:
    - Job.31.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.26
    scripture: tanakh
    name: Tanakh Job 31:26
    ref: Job 31:26
    book: Job
    section: ketuvim
    chapter: 31
    verse: 26
    ordinal: 19329
    text: If I beheld the sun when it shined, Or the moon walking in brightness;
    translation: JPS 1917
    original: אִם־אֶרְאֶה אוֹר כִּי יָהֵל וְיָרֵחַ יָקָר הֹלֵךְ׃
    hebrewPlain: אם אראה אור כי יהל וירח יקר הלך
    kjvRefs:
    - Job 31:26
    kjvOsis:
    - Job.31.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.27
    scripture: tanakh
    name: Tanakh Job 31:27
    ref: Job 31:27
    book: Job
    section: ketuvim
    chapter: 31
    verse: 27
    ordinal: 19330
    text: And my heart hath been secretly enticed, And my mouth hath kissed my hand;
    translation: JPS 1917
    original: וַיִּפְתְּ בַּסֵּתֶר לִבִּי וַתִּשַּׁק יָדִי לְפִי׃
    hebrewPlain: ויפת בסתר לבי ותשק ידי לפי
    kjvRefs:
    - Job 31:27
    kjvOsis:
    - Job.31.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.28
    scripture: tanakh
    name: Tanakh Job 31:28
    ref: Job 31:28
    book: Job
    section: ketuvim
    chapter: 31
    verse: 28
    ordinal: 19331
    text: This also were an iniquity to be punished by the judges; For I should have lied to God that is above.
    translation: JPS 1917
    original: גַּם־הוּא עָוֺן פְּלִילִי כִּי־כִחַשְׁתִּי לָאֵל מִמָּעַל׃
    hebrewPlain: גם הוא עון פלילי כי כחשתי לאל ממעל
    kjvRefs:
    - Job 31:28
    kjvOsis:
    - Job.31.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.29
    scripture: tanakh
    name: Tanakh Job 31:29
    ref: Job 31:29
    book: Job
    section: ketuvim
    chapter: 31
    verse: 29
    ordinal: 19332
    text: If I rejoiced at the destruction of him that hated me, Or exulted when evil found him—
    translation: JPS 1917
    original: אִם־אֶשְׂמַח בְּפִיד מְשַׂנְאִי וְהִתְעֹרַרְתִּי כִּי־מְצָאוֹ רָע׃
    hebrewPlain: אם אשמח בפיד משנאי והתעררתי כי מצאו רע
    kjvRefs:
    - Job 31:29
    kjvOsis:
    - Job.31.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.30
    scripture: tanakh
    name: Tanakh Job 31:30
    ref: Job 31:30
    book: Job
    section: ketuvim
    chapter: 31
    verse: 30
    ordinal: 19333
    text: Yea, I suffered not my mouth to sin By asking his life with a curse.
    translation: JPS 1917
    original: וְלֹא־נָתַתִּי לַחֲטֹא חִכִּי לִשְׁאֹל בְּאָלָה נַפְשׁוֹ׃
    hebrewPlain: ולא נתתי לחטא חכי לשאל באלה נפשו
    kjvRefs:
    - Job 31:30
    kjvOsis:
    - Job.31.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.31
    scripture: tanakh
    name: Tanakh Job 31:31
    ref: Job 31:31
    book: Job
    section: ketuvim
    chapter: 31
    verse: 31
    ordinal: 19334
    text: 'If the men of my tent said not: ‘Who can find one that hath not been satisfied with his meat?’ .'
    translation: JPS 1917
    original: אִם־לֹא אָמְרוּ מְתֵי אָהֳלִי מִי־יִתֵּן מִבְּשָׂרוֹ לֹא נִשְׂבָּע׃
    hebrewPlain: אם לא אמרו מתי אהלי מי יתן מבשרו לא נשבע
    kjvRefs:
    - Job 31:31
    kjvOsis:
    - Job.31.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.32
    scripture: tanakh
    name: Tanakh Job 31:32
    ref: Job 31:32
    book: Job
    section: ketuvim
    chapter: 31
    verse: 32
    ordinal: 19335
    text: The stranger did not lodge in the street; My doors I opened to the roadside.
    translation: JPS 1917
    original: בַּחוּץ לֹא־יָלִין גֵּר דְּלָתַי לָאֹרַח אֶפְתָּח׃
    hebrewPlain: בחוץ לא ילין גר דלתי לארח אפתח
    kjvRefs:
    - Job 31:32
    kjvOsis:
    - Job.31.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.33
    scripture: tanakh
    name: Tanakh Job 31:33
    ref: Job 31:33
    book: Job
    section: ketuvim
    chapter: 31
    verse: 33
    ordinal: 19336
    text: If after the manner of men I covered my transgressions, By hiding mine iniquity in my bosom—
    translation: JPS 1917
    original: אִם־כִּסִּיתִי כְאָדָם פְּשָׁעָי לִטְמוֹן בְּחֻבִּי עֲוֺנִי׃
    hebrewPlain: אם כסיתי כאדם פשעי לטמון בחבי עוני
    kjvRefs:
    - Job 31:33
    kjvOsis:
    - Job.31.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.34
    scripture: tanakh
    name: Tanakh Job 31:34
    ref: Job 31:34
    book: Job
    section: ketuvim
    chapter: 31
    verse: 34
    ordinal: 19337
    text: Because I feared the great multitude, And the most contemptible among families terrified me, So that I kept silence, and went not out of the door.
    translation: JPS 1917
    original: כִּי אֶעֱרוֹץ הָמוֹן רַבָּה וּבוּז־מִשְׁפָּחוֹת יְחִתֵּנִי וָאֶדֹּם לֹא־אֵצֵא פָתַח׃
    hebrewPlain: כי אערוץ המון רבה ובוז משפחות יחתני ואדם לא אצא פתח
    kjvRefs:
    - Job 31:34
    kjvOsis:
    - Job.31.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.35
    scripture: tanakh
    name: Tanakh Job 31:35
    ref: Job 31:35
    book: Job
    section: ketuvim
    chapter: 31
    verse: 35
    ordinal: 19338
    text: Oh that I had one to hear me!— Lo, here is my signature, let the Almighty answer me— And that I had the indictment which mine adversary hath written!
    translation: JPS 1917
    original: מִי יִתֶּן־לִי שֹׁמֵעַ לִי הֶן־תָּוִי שַׁדַּי יַעֲנֵנִי וְסֵפֶר כָּתַב אִישׁ רִיבִי׃
    hebrewPlain: מי יתן לי שמע לי הן תוי שדי יענני וספר כתב איש ריבי
    kjvRefs:
    - Job 31:35
    kjvOsis:
    - Job.31.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.36
    scripture: tanakh
    name: Tanakh Job 31:36
    ref: Job 31:36
    book: Job
    section: ketuvim
    chapter: 31
    verse: 36
    ordinal: 19339
    text: Surely I would carry it upon my shoulder; I would bind it unto me as a crown.
    translation: JPS 1917
    original: אִם־לֹא עַל־שִׁכְמִי אֶשָּׂאֶנּוּ אֶעֶנְדֶנּוּ עֲטָרוֹת לִי׃
    hebrewPlain: אם לא על שכמי אשאנו אענדנו עטרות לי
    kjvRefs:
    - Job 31:36
    kjvOsis:
    - Job.31.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.37
    scripture: tanakh
    name: Tanakh Job 31:37
    ref: Job 31:37
    book: Job
    section: ketuvim
    chapter: 31
    verse: 37
    ordinal: 19340
    text: I would declare unto him the number of my steps; As a prince would I go near unto him.
    translation: JPS 1917
    original: מִסְפַּר צְעָדַי אַגִּידֶנּוּ כְּמוֹ־נָגִיד אֲקָרֲבֶנּוּ׃
    hebrewPlain: מספר צעדי אגידנו כמו נגיד אקרבנו
    kjvRefs:
    - Job 31:37
    kjvOsis:
    - Job.31.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.38
    scripture: tanakh
    name: Tanakh Job 31:38
    ref: Job 31:38
    book: Job
    section: ketuvim
    chapter: 31
    verse: 38
    ordinal: 19341
    text: If my land cry out against me, And the furrows thereof weep together;
    translation: JPS 1917
    original: אִם־עָלַי אַדְמָתִי תִזְעָק וְיַחַד תְּלָמֶיהָ יִבְכָּיוּן׃
    hebrewPlain: אם עלי אדמתי תזעק ויחד תלמיה יבכיון
    kjvRefs:
    - Job 31:38
    kjvOsis:
    - Job.31.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.39
    scripture: tanakh
    name: Tanakh Job 31:39
    ref: Job 31:39
    book: Job
    section: ketuvim
    chapter: 31
    verse: 39
    ordinal: 19342
    text: If I have eaten the fruits thereof without money, Or have caused the tillers thereof to be disappointed—
    translation: JPS 1917
    original: אִם־כֹּחָהּ אָכַלְתִּי בְלִי־כָסֶף וְנֶפֶשׁ בְּעָלֶיהָ הִפָּחְתִּי׃
    hebrewPlain: אם כחה אכלתי בלי כסף ונפש בעליה הפחתי
    kjvRefs:
    - Job 31:39
    kjvOsis:
    - Job.31.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.31.40
    scripture: tanakh
    name: Tanakh Job 31:40
    ref: Job 31:40
    book: Job
    section: ketuvim
    chapter: 31
    verse: 40
    ordinal: 19343
    text: Let thistles grow instead of wheat, And noisome weeds instead of barley. The words of Job are ended.
    translation: JPS 1917
    original: תַּחַת חִטָּה יֵצֵא חוֹחַ וְתַחַת־שְׂעֹרָה בָאְשָׁה תַּמּוּ דִּבְרֵי אִיּוֹב׃
    hebrewPlain: תחת חטה יצא חוח ותחת שערה באשה תמו דברי איוב
    kjvRefs:
    - Job 31:40
    kjvOsis:
    - Job.31.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.31
- type: TanakhVerse
  data:
    osis: Job.32.1
    scripture: tanakh
    name: Tanakh Job 32:1
    ref: Job 32:1
    book: Job
    section: ketuvim
    chapter: 32
    verse: 1
    ordinal: 19344
    text: So these three men ceased to answer Job, because he was righteous in his own eyes.
    translation: JPS 1917
    original: וַיִּשְׁבְּתוּ שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה מֵעֲנוֹת אֶת־אִיּוֹב כִּי הוּא צַדִּיק בְּעֵינָיו׃
    hebrewPlain: וישבתו שלשת האנשים האלה מענות את איוב כי הוא צדיק בעיניו
    kjvRefs:
    - Job 32:1
    kjvOsis:
    - Job.32.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.2
    scripture: tanakh
    name: Tanakh Job 32:2
    ref: Job 32:2
    book: Job
    section: ketuvim
    chapter: 32
    verse: 2
    ordinal: 19345
    text: Then was kindled the wrath of Elihu the son of Barachel the Buzite, of the family of Ram; against Job was his wrath kindled, because he justified himself rather than God.
    translation: JPS 1917
    original: וַיִּחַר אַף אֱלִיהוּא בֶן־בַּרַכְאֵל הַבּוּזִי מִמִּשְׁפַּחַת רָם בְּאִיּוֹב חָרָה אַפּוֹ עַל־צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים׃
    hebrewPlain: ויחר אף אליהוא בן ברכאל הבוזי ממשפחת רם באיוב חרה אפו על צדקו נפשו מאלהים
    kjvRefs:
    - Job 32:2
    kjvOsis:
    - Job.32.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.3
    scripture: tanakh
    name: Tanakh Job 32:3
    ref: Job 32:3
    book: Job
    section: ketuvim
    chapter: 32
    verse: 3
    ordinal: 19346
    text: Also against his three friends was his wrath kindled, because they had found no answer, and yet had condemned Job.
    translation: JPS 1917
    original: וּבִשְׁלֹשֶׁת רֵעָיו חָרָה אַפּוֹ עַל אֲשֶׁר לֹא־מָצְאוּ מַעֲנֶה וַיַּרְשִׁיעוּ אֶת־אִיּוֹב׃
    hebrewPlain: ובשלשת רעיו חרה אפו על אשר לא מצאו מענה וירשיעו את איוב
    kjvRefs:
    - Job 32:3
    kjvOsis:
    - Job.32.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.4
    scripture: tanakh
    name: Tanakh Job 32:4
    ref: Job 32:4
    book: Job
    section: ketuvim
    chapter: 32
    verse: 4
    ordinal: 19347
    text: Now Elihu had waited to speak unto Job, because they were older than he.
    translation: JPS 1917
    original: וֶאֱלִיהוּ חִכָּה אֶת־אִיּוֹב בִּדְבָרִים כִּי זְקֵנִים־הֵמָּה מִמֶּנּוּ לְיָמִים׃
    hebrewPlain: ואליהו חכה את איוב בדברים כי זקנים המה ממנו לימים
    kjvRefs:
    - Job 32:4
    kjvOsis:
    - Job.32.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.5
    scripture: tanakh
    name: Tanakh Job 32:5
    ref: Job 32:5
    book: Job
    section: ketuvim
    chapter: 32
    verse: 5
    ordinal: 19348
    text: And when Elihu saw that there was no answer in the mouth of these three men, his wrath was kindled.
    translation: JPS 1917
    original: וַיַּרְא אֱלִיהוּא כִּי אֵין מַעֲנֶה בְּפִי שְׁלֹשֶׁת הָאֲנָשִׁים וַיִּחַר אַפּוֹ׃
    hebrewPlain: וירא אליהוא כי אין מענה בפי שלשת האנשים ויחר אפו
    kjvRefs:
    - Job 32:5
    kjvOsis:
    - Job.32.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.6
    scripture: tanakh
    name: Tanakh Job 32:6
    ref: Job 32:6
    book: Job
    section: ketuvim
    chapter: 32
    verse: 6
    ordinal: 19349
    text: 'And Elihu the son of Barachel the Buzite answered and said: I am young, and ye are very old; Wherefore I held back, and durst not declare you mine opinion.'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיהוּא בֶן־בַּרַכְאֵל הַבּוּזִי וַיֹּאמַר צָעִיר אֲנִי לְיָמִים וְאַתֶּם יְשִׁישִׁים עַל־כֵּן זָחַלְתִּי וָאִירָא מֵחַוֺּת דֵּעִי אֶתְכֶם׃
    hebrewPlain: ויען אליהוא בן ברכאל הבוזי ויאמר צעיר אני לימים ואתם ישישים על כן זחלתי ואירא מחות דעי אתכם
    kjvRefs:
    - Job 32:6
    kjvOsis:
    - Job.32.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.7
    scripture: tanakh
    name: Tanakh Job 32:7
    ref: Job 32:7
    book: Job
    section: ketuvim
    chapter: 32
    verse: 7
    ordinal: 19350
    text: 'I said: ‘Days should speak, And multitude of years should teach wisdom.’'
    translation: JPS 1917
    original: אָמַרְתִּי יָמִים יְדַבֵּרוּ וְרֹב שָׁנִים יֹדִיעוּ חָכְמָה׃
    hebrewPlain: אמרתי ימים ידברו ורב שנים ידיעו חכמה
    kjvRefs:
    - Job 32:7
    kjvOsis:
    - Job.32.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.8
    scripture: tanakh
    name: Tanakh Job 32:8
    ref: Job 32:8
    book: Job
    section: ketuvim
    chapter: 32
    verse: 8
    ordinal: 19351
    text: But it is a spirit in man, And the breath of the Almighty, that giveth them understanding.
    translation: JPS 1917
    original: אָכֵן רוּחַ־הִיא בֶאֱנוֹשׁ וְנִשְׁמַת שַׁדַּי תְּבִינֵם׃
    hebrewPlain: אכן רוח היא באנוש ונשמת שדי תבינם
    kjvRefs:
    - Job 32:8
    kjvOsis:
    - Job.32.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.9
    scripture: tanakh
    name: Tanakh Job 32:9
    ref: Job 32:9
    book: Job
    section: ketuvim
    chapter: 32
    verse: 9
    ordinal: 19352
    text: It is not the great that are wise, Nor the aged that discern judgment.
    translation: JPS 1917
    original: לֹא־רַבִּים יֶחְכָּמוּ וּזְקֵנִים יָבִינוּ מִשְׁפָּט׃
    hebrewPlain: לא רבים יחכמו וזקנים יבינו משפט
    kjvRefs:
    - Job 32:9
    kjvOsis:
    - Job.32.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.10
    scripture: tanakh
    name: Tanakh Job 32:10
    ref: Job 32:10
    book: Job
    section: ketuvim
    chapter: 32
    verse: 10
    ordinal: 19353
    text: 'Therefore I say: ‘Hearken to me; I also will declare mine opinion.’'
    translation: JPS 1917
    original: לָכֵן אָמַרְתִּי שִׁמְעָה־לִּי אֲחַוֶּה דֵּעִי אַף־אָנִי׃
    hebrewPlain: לכן אמרתי שמעה לי אחוה דעי אף אני
    kjvRefs:
    - Job 32:10
    kjvOsis:
    - Job.32.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.11
    scripture: tanakh
    name: Tanakh Job 32:11
    ref: Job 32:11
    book: Job
    section: ketuvim
    chapter: 32
    verse: 11
    ordinal: 19354
    text: Behold, I waited for your words, I listened for your reasons, Whilst ye searched out what to say.
    translation: JPS 1917
    original: הֵן הוֹחַלְתִּי לְדִבְרֵיכֶם אָזִין עַד־תְּבוּנֹתֵיכֶם עַד־תַּחְקְרוּן מִלִּין׃
    hebrewPlain: הן הוחלתי לדבריכם אזין עד תבונתיכם עד תחקרון מלין
    kjvRefs:
    - Job 32:11
    kjvOsis:
    - Job.32.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.12
    scripture: tanakh
    name: Tanakh Job 32:12
    ref: Job 32:12
    book: Job
    section: ketuvim
    chapter: 32
    verse: 12
    ordinal: 19355
    text: Yea, I attended unto you, And, behold, there was none that convinced Job, Or that answered his words, among you.
    translation: JPS 1917
    original: וְעָדֵיכֶם אֶתְבּוֹנָן וְהִנֵּה אֵין לְאִיּוֹב מוֹכִיחַ עוֹנֶה אֲמָרָיו מִכֶּם׃
    hebrewPlain: ועדיכם אתבונן והנה אין לאיוב מוכיח עונה אמריו מכם
    kjvRefs:
    - Job 32:12
    kjvOsis:
    - Job.32.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.13
    scripture: tanakh
    name: Tanakh Job 32:13
    ref: Job 32:13
    book: Job
    section: ketuvim
    chapter: 32
    verse: 13
    ordinal: 19356
    text: 'Beware lest ye say: ‘We have found wisdom; God may vanquish him, not man! ’'
    translation: JPS 1917
    original: פֶּן־תֹּאמְרוּ מָצָאנוּ חָכְמָה אֵל יִדְּפֶנּוּ לֹא־אִישׁ׃
    hebrewPlain: פן תאמרו מצאנו חכמה אל ידפנו לא איש
    kjvRefs:
    - Job 32:13
    kjvOsis:
    - Job.32.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.14
    scripture: tanakh
    name: Tanakh Job 32:14
    ref: Job 32:14
    book: Job
    section: ketuvim
    chapter: 32
    verse: 14
    ordinal: 19357
    text: For he hath not directed his words against me; Neither will I answer him with your speeches.
    translation: JPS 1917
    original: וְלֹא־עָרַךְ אֵלַי מִלִּין וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ׃
    hebrewPlain: ולא ערך אלי מלין ובאמריכם לא אשיבנו
    kjvRefs:
    - Job 32:14
    kjvOsis:
    - Job.32.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.15
    scripture: tanakh
    name: Tanakh Job 32:15
    ref: Job 32:15
    book: Job
    section: ketuvim
    chapter: 32
    verse: 15
    ordinal: 19358
    text: They are amazed, they answer no more; Words are departed from them.
    translation: JPS 1917
    original: חַתּוּ לֹא־עָנוּ עוֹד הֶעְתִּיקוּ מֵהֶם מִלִּים׃
    hebrewPlain: חתו לא ענו עוד העתיקו מהם מלים
    kjvRefs:
    - Job 32:15
    kjvOsis:
    - Job.32.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.16
    scripture: tanakh
    name: Tanakh Job 32:16
    ref: Job 32:16
    book: Job
    section: ketuvim
    chapter: 32
    verse: 16
    ordinal: 19359
    text: And shall I wait, because they speak not, Because they stand still, and answer no more?
    translation: JPS 1917
    original: וְהוֹחַלְתִּי כִּי־לֹא יְדַבֵּרוּ כִּי עָמְדוּ לֹא־עָנוּ עוֹד׃
    hebrewPlain: והוחלתי כי לא ידברו כי עמדו לא ענו עוד
    kjvRefs:
    - Job 32:16
    kjvOsis:
    - Job.32.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.17
    scripture: tanakh
    name: Tanakh Job 32:17
    ref: Job 32:17
    book: Job
    section: ketuvim
    chapter: 32
    verse: 17
    ordinal: 19360
    text: I also will answer my part, I also will declare mine opinion.
    translation: JPS 1917
    original: אַעֲנֶה אַף־אֲנִי חֶלְקִי אֲחַוֶּה דֵעִי אַף־אָנִי׃
    hebrewPlain: אענה אף אני חלקי אחוה דעי אף אני
    kjvRefs:
    - Job 32:17
    kjvOsis:
    - Job.32.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.18
    scripture: tanakh
    name: Tanakh Job 32:18
    ref: Job 32:18
    book: Job
    section: ketuvim
    chapter: 32
    verse: 18
    ordinal: 19361
    text: For I am full of words; The spirit within me constraineth me.
    translation: JPS 1917
    original: כִּי מָלֵתִי מִלִּים הֱצִיקַתְנִי רוּחַ בִּטְנִי׃
    hebrewPlain: כי מלתי מלים הציקתני רוח בטני
    kjvRefs:
    - Job 32:18
    kjvOsis:
    - Job.32.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.19
    scripture: tanakh
    name: Tanakh Job 32:19
    ref: Job 32:19
    book: Job
    section: ketuvim
    chapter: 32
    verse: 19
    ordinal: 19362
    text: Behold, mine inwards are as wine which hath no vent; Like new wine-skins which are ready to burst.
    translation: JPS 1917
    original: הִנֵּה־בִטְנִי כְּיַיִן לֹא־יִפָּתֵחַ כְּאֹבוֹת חֲדָשִׁים יִבָּקֵעַ׃
    hebrewPlain: הנה בטני כיין לא יפתח כאבות חדשים יבקע
    kjvRefs:
    - Job 32:19
    kjvOsis:
    - Job.32.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.20
    scripture: tanakh
    name: Tanakh Job 32:20
    ref: Job 32:20
    book: Job
    section: ketuvim
    chapter: 32
    verse: 20
    ordinal: 19363
    text: I will speak, that I may find relief; I will open my lips and answer.
    translation: JPS 1917
    original: אֲדַבְּרָה וְיִרְוַח־לִי אֶפְתַּח שְׂפָתַי וְאֶעֱנֶה׃
    hebrewPlain: אדברה וירוח לי אפתח שפתי ואענה
    kjvRefs:
    - Job 32:20
    kjvOsis:
    - Job.32.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.21
    scripture: tanakh
    name: Tanakh Job 32:21
    ref: Job 32:21
    book: Job
    section: ketuvim
    chapter: 32
    verse: 21
    ordinal: 19364
    text: Let me not, I pray you, respect any man’s person; Neither will I give flattering titles unto any man.
    translation: JPS 1917
    original: אַל־נָא אֶשָּׂא פְנֵי־אִישׁ וְאֶל־אָדָם לֹא אֲכַנֶּה׃
    hebrewPlain: אל נא אשא פני איש ואל אדם לא אכנה
    kjvRefs:
    - Job 32:21
    kjvOsis:
    - Job.32.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.32.22
    scripture: tanakh
    name: Tanakh Job 32:22
    ref: Job 32:22
    book: Job
    section: ketuvim
    chapter: 32
    verse: 22
    ordinal: 19365
    text: For I know not to give flattering titles; Else would my Maker soon take me away
    translation: JPS 1917
    original: כִּי לֹא יָדַעְתִּי אֲכַנֶּה כִּמְעַט יִשָּׂאֵנִי עֹשֵׂנִי׃
    hebrewPlain: כי לא ידעתי אכנה כמעט ישאני עשני
    kjvRefs:
    - Job 32:22
    kjvOsis:
    - Job.32.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.32
- type: TanakhVerse
  data:
    osis: Job.33.1
    scripture: tanakh
    name: Tanakh Job 33:1
    ref: Job 33:1
    book: Job
    section: ketuvim
    chapter: 33
    verse: 1
    ordinal: 19366
    text: Howbeit, Job, I pray thee, hear my speech, And hearken to all my words.
    translation: JPS 1917
    original: וְאוּלָם שְׁמַע־נָא אִיּוֹב מִלָּי וְכָל־דְּבָרַי הַאֲזִינָה׃
    hebrewPlain: ואולם שמע נא איוב מלי וכל דברי האזינה
    kjvRefs:
    - Job 33:1
    kjvOsis:
    - Job.33.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.2
    scripture: tanakh
    name: Tanakh Job 33:2
    ref: Job 33:2
    book: Job
    section: ketuvim
    chapter: 33
    verse: 2
    ordinal: 19367
    text: Behold now, I have opened my mouth, My tongue hath spoken in my mouth.
    translation: JPS 1917
    original: הִנֵּה־נָא פָּתַחְתִּי פִי דִּבְּרָה לְשׁוֹנִי בְחִכִּי׃
    hebrewPlain: הנה נא פתחתי פי דברה לשוני בחכי
    kjvRefs:
    - Job 33:2
    kjvOsis:
    - Job.33.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.3
    scripture: tanakh
    name: Tanakh Job 33:3
    ref: Job 33:3
    book: Job
    section: ketuvim
    chapter: 33
    verse: 3
    ordinal: 19368
    text: My words shall utter the uprightness of my heart; And that which my lips know they shall speak sincerely.
    translation: JPS 1917
    original: יֹשֶׁר־לִבִּי אֲמָרָי וְדַעַת שְׂפָתַי בָּרוּר מִלֵּלוּ׃
    hebrewPlain: ישר לבי אמרי ודעת שפתי ברור מללו
    kjvRefs:
    - Job 33:3
    kjvOsis:
    - Job.33.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.4
    scripture: tanakh
    name: Tanakh Job 33:4
    ref: Job 33:4
    book: Job
    section: ketuvim
    chapter: 33
    verse: 4
    ordinal: 19369
    text: The spirit of God hath made me, And the breath of the Almighty given me life.
    translation: JPS 1917
    original: רוּחַ־אֵל עָשָׂתְנִי וְנִשְׁמַת שַׁדַּי תְּחַיֵּנִי׃
    hebrewPlain: רוח אל עשתני ונשמת שדי תחיני
    kjvRefs:
    - Job 33:4
    kjvOsis:
    - Job.33.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.5
    scripture: tanakh
    name: Tanakh Job 33:5
    ref: Job 33:5
    book: Job
    section: ketuvim
    chapter: 33
    verse: 5
    ordinal: 19370
    text: If thou canst, answer thou me, Set thy words in order before me, stand forth.
    translation: JPS 1917
    original: אִם־תּוּכַל הֲשִׁיבֵנִי עֶרְכָה לְפָנַי הִתְיַצָּבָה׃
    hebrewPlain: אם תוכל השיבני ערכה לפני התיצבה
    kjvRefs:
    - Job 33:5
    kjvOsis:
    - Job.33.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.6
    scripture: tanakh
    name: Tanakh Job 33:6
    ref: Job 33:6
    book: Job
    section: ketuvim
    chapter: 33
    verse: 6
    ordinal: 19371
    text: Behold, I am toward God even as thou art; I also am formed out of the clay.
    translation: JPS 1917
    original: הֵן־אֲנִי כְפִיךָ לָאֵל מֵחֹמֶר קֹרַצְתִּי גַם־אָנִי׃
    hebrewPlain: הן אני כפיך לאל מחמר קרצתי גם אני
    kjvRefs:
    - Job 33:6
    kjvOsis:
    - Job.33.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.7
    scripture: tanakh
    name: Tanakh Job 33:7
    ref: Job 33:7
    book: Job
    section: ketuvim
    chapter: 33
    verse: 7
    ordinal: 19372
    text: Behold, my terror shall not make thee afraid, Neither shall my pressure be heavy upon thee.
    translation: JPS 1917
    original: הִנֵּה אֵמָתִי לֹא תְבַעֲתֶךָּ וְאַכְפִּי עָלֶיךָ לֹא־יִכְבָּד׃
    hebrewPlain: הנה אמתי לא תבעתך ואכפי עליך לא יכבד
    kjvRefs:
    - Job 33:7
    kjvOsis:
    - Job.33.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.8
    scripture: tanakh
    name: Tanakh Job 33:8
    ref: Job 33:8
    book: Job
    section: ketuvim
    chapter: 33
    verse: 8
    ordinal: 19373
    text: Surely thou hast spoken in my hearing, And I have heard the voice of thy words;
    translation: JPS 1917
    original: אַךְ אָמַרְתָּ בְאָזְנָי וְקוֹל מִלִּין אֶשְׁמָע׃
    hebrewPlain: אך אמרת באזני וקול מלין אשמע
    kjvRefs:
    - Job 33:8
    kjvOsis:
    - Job.33.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.9
    scripture: tanakh
    name: Tanakh Job 33:9
    ref: Job 33:9
    book: Job
    section: ketuvim
    chapter: 33
    verse: 9
    ordinal: 19374
    text: ’I am clean, without transgression, I am innocent, neither is there iniquity in me;
    translation: JPS 1917
    original: זַךְ אֲנִי בְּלִי פָשַׁע חַף אָנֹכִי וְלֹא עָוֺן לִי׃
    hebrewPlain: זך אני בלי פשע חף אנכי ולא עון לי
    kjvRefs:
    - Job 33:9
    kjvOsis:
    - Job.33.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.10
    scripture: tanakh
    name: Tanakh Job 33:10
    ref: Job 33:10
    book: Job
    section: ketuvim
    chapter: 33
    verse: 10
    ordinal: 19375
    text: Behold, He findeth occasions against me, He counteth me for His enemy;
    translation: JPS 1917
    original: הֵן תְּנוּאוֹת עָלַי יִמְצָא יַחְשְׁבֵנִי לְאוֹיֵב לוֹ׃
    hebrewPlain: הן תנואות עלי ימצא יחשבני לאויב לו
    kjvRefs:
    - Job 33:10
    kjvOsis:
    - Job.33.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.11
    scripture: tanakh
    name: Tanakh Job 33:11
    ref: Job 33:11
    book: Job
    section: ketuvim
    chapter: 33
    verse: 11
    ordinal: 19376
    text: He putteth my feet in the stocks, He marketh all my paths.’ .
    translation: JPS 1917
    original: יָשֵׂם בַּסַּד רַגְלָי יִשְׁמֹר כָּל־אָרְחֹתָי׃
    hebrewPlain: ישם בסד רגלי ישמר כל ארחתי
    kjvRefs:
    - Job 33:11
    kjvOsis:
    - Job.33.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.12
    scripture: tanakh
    name: Tanakh Job 33:12
    ref: Job 33:12
    book: Job
    section: ketuvim
    chapter: 33
    verse: 12
    ordinal: 19377
    text: 'Behold, I answer thee: In this thou art not right, That God is too great for man;'
    translation: JPS 1917
    original: הֶן־זֹאת לֹא־צָדַקְתָּ אֶעֱנֶךָּ כִּי־יִרְבֶּה אֱלוֹהַ מֵאֱנוֹשׁ׃
    hebrewPlain: הן זאת לא צדקת אענך כי ירבה אלוה מאנוש
    kjvRefs:
    - Job 33:12
    kjvOsis:
    - Job.33.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.13
    scripture: tanakh
    name: Tanakh Job 33:13
    ref: Job 33:13
    book: Job
    section: ketuvim
    chapter: 33
    verse: 13
    ordinal: 19378
    text: Why hast thou striven against Him? Seeing that He will not answer any of his words.
    translation: JPS 1917
    original: מַדּוּעַ אֵלָיו רִיבוֹתָ כִּי כָל־דְּבָרָיו לֹא־יַעֲנֶה׃
    hebrewPlain: מדוע אליו ריבות כי כל דבריו לא יענה
    kjvRefs:
    - Job 33:13
    kjvOsis:
    - Job.33.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.14
    scripture: tanakh
    name: Tanakh Job 33:14
    ref: Job 33:14
    book: Job
    section: ketuvim
    chapter: 33
    verse: 14
    ordinal: 19379
    text: For God speaketh in one way, Yea in two, though man perceiveth it not.
    translation: JPS 1917
    original: כִּי־בְאַחַת יְדַבֶּר־אֵל וּבִשְׁתַּיִם לֹא יְשׁוּרֶנָּה׃
    hebrewPlain: כי באחת ידבר אל ובשתים לא ישורנה
    kjvRefs:
    - Job 33:14
    kjvOsis:
    - Job.33.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.15
    scripture: tanakh
    name: Tanakh Job 33:15
    ref: Job 33:15
    book: Job
    section: ketuvim
    chapter: 33
    verse: 15
    ordinal: 19380
    text: In a dream, in a vision of the night, When deep sleep falleth upon men, In slumberings upon the bed;
    translation: JPS 1917
    original: בַּחֲלוֹם חֶזְיוֹן לַיְלָה בִּנְפֹל תַּרְדֵּמָה עַל־אֲנָשִׁים בִּתְנוּמוֹת עֲלֵי מִשְׁכָּב׃
    hebrewPlain: בחלום חזיון לילה בנפל תרדמה על אנשים בתנומות עלי משכב
    kjvRefs:
    - Job 33:15
    kjvOsis:
    - Job.33.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.16
    scripture: tanakh
    name: Tanakh Job 33:16
    ref: Job 33:16
    book: Job
    section: ketuvim
    chapter: 33
    verse: 16
    ordinal: 19381
    text: Then He openeth the ears of men, And by their chastisement sealeth the decree,
    translation: JPS 1917
    original: אָז יִגְלֶה אֹזֶן אֲנָשִׁים וּבְמֹסָרָם יַחְתֹּם׃
    hebrewPlain: אז יגלה אזן אנשים ובמסרם יחתם
    kjvRefs:
    - Job 33:16
    kjvOsis:
    - Job.33.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.17
    scripture: tanakh
    name: Tanakh Job 33:17
    ref: Job 33:17
    book: Job
    section: ketuvim
    chapter: 33
    verse: 17
    ordinal: 19382
    text: That men may put away their purpose, And that He may hide pride from man;
    translation: JPS 1917
    original: לְהָסִיר אָדָם מַעֲשֶׂה וְגֵוָה מִגֶּבֶר יְכַסֶּה׃
    hebrewPlain: להסיר אדם מעשה וגוה מגבר יכסה
    kjvRefs:
    - Job 33:17
    kjvOsis:
    - Job.33.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.18
    scripture: tanakh
    name: Tanakh Job 33:18
    ref: Job 33:18
    book: Job
    section: ketuvim
    chapter: 33
    verse: 18
    ordinal: 19383
    text: That He may keep back his soul from the pit, And his life from perishing by the sword.
    translation: JPS 1917
    original: יַחְשֹׂךְ נַפְשׁוֹ מִנִּי־שָׁחַת וְחַיָּתוֹ מֵעֲבֹר בַּשָּׁלַח׃
    hebrewPlain: יחשך נפשו מני שחת וחיתו מעבר בשלח
    kjvRefs:
    - Job 33:18
    kjvOsis:
    - Job.33.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.19
    scripture: tanakh
    name: Tanakh Job 33:19
    ref: Job 33:19
    book: Job
    section: ketuvim
    chapter: 33
    verse: 19
    ordinal: 19384
    text: He is chastened also with pain upon his bed, And all his bones grow stiff;
    translation: JPS 1917
    original: וְהוּכַח בְּמַכְאוֹב עַל־מִשְׁכָּבוֹ וריב [וְרוֹב] עֲצָמָיו אֵתָן׃
    hebrewPlain: והוכח במכאוב על משכבו וריב [ורוב] עצמיו אתן
    kjvRefs:
    - Job 33:19
    kjvOsis:
    - Job.33.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.20
    scripture: tanakh
    name: Tanakh Job 33:20
    ref: Job 33:20
    book: Job
    section: ketuvim
    chapter: 33
    verse: 20
    ordinal: 19385
    text: So that his life maketh him to abhor bread, And his soul dainty food.
    translation: JPS 1917
    original: וְזִהֲמַתּוּ חַיָּתוֹ לָחֶם וְנַפְשׁוֹ מַאֲכַל תַּאֲוָה׃
    hebrewPlain: וזהמתו חיתו לחם ונפשו מאכל תאוה
    kjvRefs:
    - Job 33:20
    kjvOsis:
    - Job.33.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.21
    scripture: tanakh
    name: Tanakh Job 33:21
    ref: Job 33:21
    book: Job
    section: ketuvim
    chapter: 33
    verse: 21
    ordinal: 19386
    text: His flesh is consumed away, that it cannot be seen; And his bones corrode to unsightliness.
    translation: JPS 1917
    original: יִכֶל בְּשָׂרוֹ מֵרֹאִי ושפי [וְשֻׁפּוּ] עַצְמוֹתָיו לֹא רֻאּוּ׃
    hebrewPlain: יכל בשרו מראי ושפי [ושפו] עצמותיו לא ראו
    kjvRefs:
    - Job 33:21
    kjvOsis:
    - Job.33.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.22
    scripture: tanakh
    name: Tanakh Job 33:22
    ref: Job 33:22
    book: Job
    section: ketuvim
    chapter: 33
    verse: 22
    ordinal: 19387
    text: Yea, his soul draweth near unto the pit, And his life to the destroyers.
    translation: JPS 1917
    original: וַתִּקְרַב לַשַּׁחַת נַפְשׁוֹ וְחַיָּתוֹ לַמְמִתִים׃
    hebrewPlain: ותקרב לשחת נפשו וחיתו לממתים
    kjvRefs:
    - Job 33:22
    kjvOsis:
    - Job.33.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.23
    scripture: tanakh
    name: Tanakh Job 33:23
    ref: Job 33:23
    book: Job
    section: ketuvim
    chapter: 33
    verse: 23
    ordinal: 19388
    text: If there be for him an angel, An intercessor, one among a thousand, To vouch for a man’s uprightness;
    translation: JPS 1917
    original: אִם־יֵשׁ עָלָיו מַלְאָךְ מֵלִיץ אֶחָד מִנִּי־אָלֶף לְהַגִּיד לְאָדָם יָשְׁרוֹ׃
    hebrewPlain: אם יש עליו מלאך מליץ אחד מני אלף להגיד לאדם ישרו
    kjvRefs:
    - Job 33:23
    kjvOsis:
    - Job.33.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.24
    scripture: tanakh
    name: Tanakh Job 33:24
    ref: Job 33:24
    book: Job
    section: ketuvim
    chapter: 33
    verse: 24
    ordinal: 19389
    text: 'Then He is gracious unto him, and saith: ‘Deliver him from going down to the pit, I have found a ransom.’'
    translation: JPS 1917
    original: וַיְחֻנֶּנּוּ וַיֹּאמֶר פְּדָעֵהוּ מֵרֶדֶת שָׁחַת מָצָאתִי כֹפֶר׃
    hebrewPlain: ויחננו ויאמר פדעהו מרדת שחת מצאתי כפר
    kjvRefs:
    - Job 33:24
    kjvOsis:
    - Job.33.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.25
    scripture: tanakh
    name: Tanakh Job 33:25
    ref: Job 33:25
    book: Job
    section: ketuvim
    chapter: 33
    verse: 25
    ordinal: 19390
    text: His flesh is tenderer than a child’s; He returneth to the days of his youth;
    translation: JPS 1917
    original: רֻטֲפַשׁ בְּשָׂרוֹ מִנֹּעַר יָשׁוּב לִימֵי עֲלוּמָיו׃
    hebrewPlain: רטפש בשרו מנער ישוב לימי עלומיו
    kjvRefs:
    - Job 33:25
    kjvOsis:
    - Job.33.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.26
    scripture: tanakh
    name: Tanakh Job 33:26
    ref: Job 33:26
    book: Job
    section: ketuvim
    chapter: 33
    verse: 26
    ordinal: 19391
    text: He prayeth unto God, and He is favourable unto him; So that he seeth His face with joy; And He restoreth unto man his righteousness.
    translation: JPS 1917
    original: יֶעְתַּר אֶל־אֱלוֹהַּ וַיִּרְצֵהוּ וַיַּרְא פָּנָיו בִּתְרוּעָה וַיָּשֶׁב לֶאֱנוֹשׁ צִדְקָתוֹ׃
    hebrewPlain: יעתר אל אלוה וירצהו וירא פניו בתרועה וישב לאנוש צדקתו
    kjvRefs:
    - Job 33:26
    kjvOsis:
    - Job.33.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.27
    scripture: tanakh
    name: Tanakh Job 33:27
    ref: Job 33:27
    book: Job
    section: ketuvim
    chapter: 33
    verse: 27
    ordinal: 19392
    text: 'He cometh before men, and saith: ‘I have sinned, and perverted that which was right, And it profited me not.’'
    translation: JPS 1917
    original: יָשֹׁר עַל־אֲנָשִׁים וַיֹּאמֶר חָטָאתִי וְיָשָׁר הֶעֱוֵיתִי וְלֹא־שָׁוָה לִי׃
    hebrewPlain: ישר על אנשים ויאמר חטאתי וישר העויתי ולא שוה לי
    kjvRefs:
    - Job 33:27
    kjvOsis:
    - Job.33.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.28
    scripture: tanakh
    name: Tanakh Job 33:28
    ref: Job 33:28
    book: Job
    section: ketuvim
    chapter: 33
    verse: 28
    ordinal: 19393
    text: So He redeemeth his soul from going into the pit, And his life beholdeth the light.
    translation: JPS 1917
    original: פָּדָה נפשי [נַפְשׁוֹ] מֵעֲבֹר בַּשָּׁחַת וחיתי [וְחַיָּתוֹ] בָּאוֹר תִּרְאֶה׃
    hebrewPlain: פדה נפשי [נפשו] מעבר בשחת וחיתי [וחיתו] באור תראה
    kjvRefs:
    - Job 33:28
    kjvOsis:
    - Job.33.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.29
    scripture: tanakh
    name: Tanakh Job 33:29
    ref: Job 33:29
    book: Job
    section: ketuvim
    chapter: 33
    verse: 29
    ordinal: 19394
    text: Lo, all these things doth God work, Twice, yea thrice, with a man,
    translation: JPS 1917
    original: הֶן־כָּל־אֵלֶּה יִפְעַל־אֵל פַּעֲמַיִם שָׁלוֹשׁ עִם־גָּבֶר׃
    hebrewPlain: הן כל אלה יפעל אל פעמים שלוש עם גבר
    kjvRefs:
    - Job 33:29
    kjvOsis:
    - Job.33.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.30
    scripture: tanakh
    name: Tanakh Job 33:30
    ref: Job 33:30
    book: Job
    section: ketuvim
    chapter: 33
    verse: 30
    ordinal: 19395
    text: To bring back his soul from the pit, That he may be enlightened with the light of the living.
    translation: JPS 1917
    original: לְהָשִׁיב נַפְשׁוֹ מִנִּי־שָׁחַת לֵאוֹר בְּאוֹר הַחַיִּים׃
    hebrewPlain: להשיב נפשו מני שחת לאור באור החיים
    kjvRefs:
    - Job 33:30
    kjvOsis:
    - Job.33.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.31
    scripture: tanakh
    name: Tanakh Job 33:31
    ref: Job 33:31
    book: Job
    section: ketuvim
    chapter: 33
    verse: 31
    ordinal: 19396
    text: Mark well, O Job, hearken unto me; Hold thy peace, and I will speak.
    translation: JPS 1917
    original: הַקְשֵׁב אִיּוֹב שְׁמַע־לִי הַחֲרֵשׁ וְאָנֹכִי אֲדַבֵּר׃
    hebrewPlain: הקשב איוב שמע לי החרש ואנכי אדבר
    kjvRefs:
    - Job 33:31
    kjvOsis:
    - Job.33.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.32
    scripture: tanakh
    name: Tanakh Job 33:32
    ref: Job 33:32
    book: Job
    section: ketuvim
    chapter: 33
    verse: 32
    ordinal: 19397
    text: If thou hast any thing to say, answer me; Speak, for I desire to justify thee.
    translation: JPS 1917
    original: אִם־יֵשׁ־מִלִּין הֲשִׁיבֵנִי דַּבֵּר כִּי־חָפַצְתִּי צַדְּקֶךָּ׃
    hebrewPlain: אם יש מלין השיבני דבר כי חפצתי צדקך
    kjvRefs:
    - Job 33:32
    kjvOsis:
    - Job.33.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.33.33
    scripture: tanakh
    name: Tanakh Job 33:33
    ref: Job 33:33
    book: Job
    section: ketuvim
    chapter: 33
    verse: 33
    ordinal: 19398
    text: If not, hearken thou unto me; Hold thy peace, and I will teach thee wisdom.
    translation: JPS 1917
    original: אִם־אַיִן אַתָּה שְׁמַע־לִי הַחֲרֵשׁ וַאֲאַלֶּפְךָ חָכְמָה׃
    hebrewPlain: אם אין אתה שמע לי החרש ואאלפך חכמה
    kjvRefs:
    - Job 33:33
    kjvOsis:
    - Job.33.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.33
- type: TanakhVerse
  data:
    osis: Job.34.1
    scripture: tanakh
    name: Tanakh Job 34:1
    ref: Job 34:1
    book: Job
    section: ketuvim
    chapter: 34
    verse: 1
    ordinal: 19399
    text: 'Moreover Elihu answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיהוּא וַיֹּאמַר׃
    hebrewPlain: ויען אליהוא ויאמר
    kjvRefs:
    - Job 34:1
    kjvOsis:
    - Job.34.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.2
    scripture: tanakh
    name: Tanakh Job 34:2
    ref: Job 34:2
    book: Job
    section: ketuvim
    chapter: 34
    verse: 2
    ordinal: 19400
    text: Hear my words, ye wise men; And give ear unto me, ye that have knowledge.
    translation: JPS 1917
    original: שִׁמְעוּ חֲכָמִים מִלָּי וְיֹדְעִים הַאֲזִינוּ לִי׃
    hebrewPlain: שמעו חכמים מלי וידעים האזינו לי
    kjvRefs:
    - Job 34:2
    kjvOsis:
    - Job.34.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.3
    scripture: tanakh
    name: Tanakh Job 34:3
    ref: Job 34:3
    book: Job
    section: ketuvim
    chapter: 34
    verse: 3
    ordinal: 19401
    text: For the ear trieth words, As the palate tasteth food.
    translation: JPS 1917
    original: כִּי־אֹזֶן מִלִּין תִּבְחָן וְחֵךְ יִטְעַם לֶאֱכֹל׃
    hebrewPlain: כי אזן מלין תבחן וחך יטעם לאכל
    kjvRefs:
    - Job 34:3
    kjvOsis:
    - Job.34.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.4
    scripture: tanakh
    name: Tanakh Job 34:4
    ref: Job 34:4
    book: Job
    section: ketuvim
    chapter: 34
    verse: 4
    ordinal: 19402
    text: Let us choose for us that which is right; Let us know among ourselves what is good.
    translation: JPS 1917
    original: מִשְׁפָּט נִבְחֲרָה־לָּנוּ נֵדְעָה בֵינֵינוּ מַה־טּוֹב׃
    hebrewPlain: משפט נבחרה לנו נדעה בינינו מה טוב
    kjvRefs:
    - Job 34:4
    kjvOsis:
    - Job.34.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.5
    scripture: tanakh
    name: Tanakh Job 34:5
    ref: Job 34:5
    book: Job
    section: ketuvim
    chapter: 34
    verse: 5
    ordinal: 19403
    text: 'For Job hath said: ‘I am righteous, And God hath taken away my right;'
    translation: JPS 1917
    original: כִּי־אָמַר אִיּוֹב צָדַקְתִּי וְאֵל הֵסִיר מִשְׁפָּטִי׃
    hebrewPlain: כי אמר איוב צדקתי ואל הסיר משפטי
    kjvRefs:
    - Job 34:5
    kjvOsis:
    - Job.34.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.6
    scripture: tanakh
    name: Tanakh Job 34:6
    ref: Job 34:6
    book: Job
    section: ketuvim
    chapter: 34
    verse: 6
    ordinal: 19404
    text: Notwithstanding my right I am accounted a liar; My wound is incurable, though I am without transgression.’
    translation: JPS 1917
    original: עַל־מִשְׁפָּטִי אֲכַזֵּב אָנוּשׁ חִצִּי בְלִי־פָשַׁע׃
    hebrewPlain: על משפטי אכזב אנוש חצי בלי פשע
    kjvRefs:
    - Job 34:6
    kjvOsis:
    - Job.34.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.7
    scripture: tanakh
    name: Tanakh Job 34:7
    ref: Job 34:7
    book: Job
    section: ketuvim
    chapter: 34
    verse: 7
    ordinal: 19405
    text: What man is like Job, Who drinketh up scorning like water?
    translation: JPS 1917
    original: מִי־גֶבֶר כְּאִיּוֹב יִשְׁתֶּה־לַּעַג כַּמָּיִם׃
    hebrewPlain: מי גבר כאיוב ישתה לעג כמים
    kjvRefs:
    - Job 34:7
    kjvOsis:
    - Job.34.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.8
    scripture: tanakh
    name: Tanakh Job 34:8
    ref: Job 34:8
    book: Job
    section: ketuvim
    chapter: 34
    verse: 8
    ordinal: 19406
    text: Who goeth in company with the workers of iniquity, And walketh with wicked men.
    translation: JPS 1917
    original: וְאָרַח לְחֶבְרָה עִם־פֹּעֲלֵי אָוֶן וְלָלֶכֶת עִם־אַנְשֵׁי־רֶשַׁע׃
    hebrewPlain: וארח לחברה עם פעלי און וללכת עם אנשי רשע
    kjvRefs:
    - Job 34:8
    kjvOsis:
    - Job.34.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.9
    scripture: tanakh
    name: Tanakh Job 34:9
    ref: Job 34:9
    book: Job
    section: ketuvim
    chapter: 34
    verse: 9
    ordinal: 19407
    text: 'For he hath said: ‘It profiteth a man nothing That he should be in accord with God.’'
    translation: JPS 1917
    original: כִּי־אָמַר לֹא יִסְכָּן־גָּבֶר בִּרְצֹתוֹ עִם־אֱלֹהִים׃
    hebrewPlain: כי אמר לא יסכן גבר ברצתו עם אלהים
    kjvRefs:
    - Job 34:9
    kjvOsis:
    - Job.34.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.10
    scripture: tanakh
    name: Tanakh Job 34:10
    ref: Job 34:10
    book: Job
    section: ketuvim
    chapter: 34
    verse: 10
    ordinal: 19408
    text: 'Therefore hearken unto me, ye men of understanding: Far be it from God, that He should do wickedness; And from the Almighty, that He should commit iniquity.'
    translation: JPS 1917
    original: לָכֵן אַנֲשֵׁי לֵבָב שִׁמְעוּ לִי חָלִלָה לָאֵל מֵרֶשַׁע וְשַׁדַּי מֵעָוֶל׃
    hebrewPlain: לכן אנשי לבב שמעו לי חללה לאל מרשע ושדי מעול
    kjvRefs:
    - Job 34:10
    kjvOsis:
    - Job.34.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.11
    scripture: tanakh
    name: Tanakh Job 34:11
    ref: Job 34:11
    book: Job
    section: ketuvim
    chapter: 34
    verse: 11
    ordinal: 19409
    text: For the work of a man will He requite unto him, And cause every man to find according to his ways.
    translation: JPS 1917
    original: כִּי פֹעַל אָדָם יְשַׁלֶּם־לוֹ וּכְאֹרַח אִישׁ יַמְצִאֶנּוּ׃
    hebrewPlain: כי פעל אדם ישלם לו וכארח איש ימצאנו
    kjvRefs:
    - Job 34:11
    kjvOsis:
    - Job.34.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.12
    scripture: tanakh
    name: Tanakh Job 34:12
    ref: Job 34:12
    book: Job
    section: ketuvim
    chapter: 34
    verse: 12
    ordinal: 19410
    text: Yea, of a surety, God will not do wickedly, Neither will the Almighty pervert justice.
    translation: JPS 1917
    original: אַף־אָמְנָם אֵל לֹא־יַרְשִׁיעַ וְשַׁדַּי לֹא־יְעַוֵּת מִשְׁפָּט׃
    hebrewPlain: אף אמנם אל לא ירשיע ושדי לא יעות משפט
    kjvRefs:
    - Job 34:12
    kjvOsis:
    - Job.34.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.13
    scripture: tanakh
    name: Tanakh Job 34:13
    ref: Job 34:13
    book: Job
    section: ketuvim
    chapter: 34
    verse: 13
    ordinal: 19411
    text: Who gave Him a charge over the earth? Or who hath disposed the whole world?
    translation: JPS 1917
    original: מִי־פָקַד עָלָיו אָרְצָה וּמִי שָׂם תֵּבֵל כֻּלָּהּ׃
    hebrewPlain: מי פקד עליו ארצה ומי שם תבל כלה
    kjvRefs:
    - Job 34:13
    kjvOsis:
    - Job.34.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.14
    scripture: tanakh
    name: Tanakh Job 34:14
    ref: Job 34:14
    book: Job
    section: ketuvim
    chapter: 34
    verse: 14
    ordinal: 19412
    text: If He set His heart upon man, If He gather unto Himself his spirit and his breath;
    translation: JPS 1917
    original: אִם־יָשִׂים אֵלָיו לִבּוֹ רוּחוֹ וְנִשְׁמָתוֹ אֵלָיו יֶאֱסֹף׃
    hebrewPlain: אם ישים אליו לבו רוחו ונשמתו אליו יאסף
    kjvRefs:
    - Job 34:14
    kjvOsis:
    - Job.34.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.15
    scripture: tanakh
    name: Tanakh Job 34:15
    ref: Job 34:15
    book: Job
    section: ketuvim
    chapter: 34
    verse: 15
    ordinal: 19413
    text: All flesh shall perish together, And man shall return unto dust.
    translation: JPS 1917
    original: יִגְוַע כָּל־בָּשָׂר יָחַד וְאָדָם עַל־עָפָר יָשׁוּב׃
    hebrewPlain: יגוע כל בשר יחד ואדם על עפר ישוב
    kjvRefs:
    - Job 34:15
    kjvOsis:
    - Job.34.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.16
    scripture: tanakh
    name: Tanakh Job 34:16
    ref: Job 34:16
    book: Job
    section: ketuvim
    chapter: 34
    verse: 16
    ordinal: 19414
    text: If now thou hast understanding, hear this; Hearken to the voice of my words.
    translation: JPS 1917
    original: וְאִם־בִּינָה שִׁמְעָה־זֹּאת הַאֲזִינָה לְקוֹל מִלָּי׃
    hebrewPlain: ואם בינה שמעה זאת האזינה לקול מלי
    kjvRefs:
    - Job 34:16
    kjvOsis:
    - Job.34.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.17
    scripture: tanakh
    name: Tanakh Job 34:17
    ref: Job 34:17
    book: Job
    section: ketuvim
    chapter: 34
    verse: 17
    ordinal: 19415
    text: Shall even one that hateth right govern? And wilt thou condemn Him that is just and mighty—
    translation: JPS 1917
    original: הַאַף שׂוֹנֵא מִשְׁפָּט יַחֲבוֹשׁ וְאִם־צַדִּיק כַּבִּיר תַּרְשִׁיעַ׃
    hebrewPlain: האף שונא משפט יחבוש ואם צדיק כביר תרשיע
    kjvRefs:
    - Job 34:17
    kjvOsis:
    - Job.34.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.18
    scripture: tanakh
    name: Tanakh Job 34:18
    ref: Job 34:18
    book: Job
    section: ketuvim
    chapter: 34
    verse: 18
    ordinal: 19416
    text: 'Is it fit to say to a king: ‘Thou art base’? Or to nobles: ‘Ye are wicked’?—'
    translation: JPS 1917
    original: הַאֲמֹר לְמֶלֶךְ בְּלִיָּעַל רָשָׁע אֶל־נְדִיבִים׃
    hebrewPlain: האמר למלך בליעל רשע אל נדיבים
    kjvRefs:
    - Job 34:18
    kjvOsis:
    - Job.34.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.19
    scripture: tanakh
    name: Tanakh Job 34:19
    ref: Job 34:19
    book: Job
    section: ketuvim
    chapter: 34
    verse: 19
    ordinal: 19417
    text: That respecteth not the persons of princes, Nor regardeth the rich more than the poor? For they all are the work of His hands.
    translation: JPS 1917
    original: אֲשֶׁר לֹא־נָשָׂא פְּנֵי שָׂרִים וְלֹא נִכַּר־שׁוֹעַ לִפְנֵי־דָל כִּי־מַעֲשֵׂה יָדָיו כֻּלָּם׃
    hebrewPlain: אשר לא נשא פני שרים ולא נכר שוע לפני דל כי מעשה ידיו כלם
    kjvRefs:
    - Job 34:19
    kjvOsis:
    - Job.34.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.20
    scripture: tanakh
    name: Tanakh Job 34:20
    ref: Job 34:20
    book: Job
    section: ketuvim
    chapter: 34
    verse: 20
    ordinal: 19418
    text: In a moment they die, even at midnight; The people are shaken and pass away, And the mighty are taken away without hand. .
    translation: JPS 1917
    original: רֶגַע יָמֻתוּ וַחֲצוֹת לָיְלָה יְגֹעֲשׁוּ עָם וְיַעֲבֹרוּ וְיָסִירוּ אַבִּיר לֹא בְיָד׃
    hebrewPlain: רגע ימתו וחצות לילה יגעשו עם ויעברו ויסירו אביר לא ביד
    kjvRefs:
    - Job 34:20
    kjvOsis:
    - Job.34.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.21
    scripture: tanakh
    name: Tanakh Job 34:21
    ref: Job 34:21
    book: Job
    section: ketuvim
    chapter: 34
    verse: 21
    ordinal: 19419
    text: For His eyes are upon the ways of a man, And He seeth all his goings.
    translation: JPS 1917
    original: כִּי־עֵינָיו עַל־דַּרְכֵי־אִישׁ וְכָל־צְעָדָיו יִרְאֶה׃
    hebrewPlain: כי עיניו על דרכי איש וכל צעדיו יראה
    kjvRefs:
    - Job 34:21
    kjvOsis:
    - Job.34.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.22
    scripture: tanakh
    name: Tanakh Job 34:22
    ref: Job 34:22
    book: Job
    section: ketuvim
    chapter: 34
    verse: 22
    ordinal: 19420
    text: There is no darkness, nor shadow of death, Where the workers of iniquity may hide themselves.
    translation: JPS 1917
    original: אֵין־חֹשֶׁךְ וְאֵין צַלְמָוֶת לְהִסָּתֶר שָׁם פֹּעֲלֵי אָוֶן׃
    hebrewPlain: אין חשך ואין צלמות להסתר שם פעלי און
    kjvRefs:
    - Job 34:22
    kjvOsis:
    - Job.34.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.23
    scripture: tanakh
    name: Tanakh Job 34:23
    ref: Job 34:23
    book: Job
    section: ketuvim
    chapter: 34
    verse: 23
    ordinal: 19421
    text: For He doth not appoint a time unto any man, When he should go before God in judgment.
    translation: JPS 1917
    original: כִּי לֹא עַל־אִישׁ יָשִׂים עוֹד לַהֲלֹךְ אֶל־אֵל בַּמִּשְׁפָּט׃
    hebrewPlain: כי לא על איש ישים עוד להלך אל אל במשפט
    kjvRefs:
    - Job 34:23
    kjvOsis:
    - Job.34.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.24
    scripture: tanakh
    name: Tanakh Job 34:24
    ref: Job 34:24
    book: Job
    section: ketuvim
    chapter: 34
    verse: 24
    ordinal: 19422
    text: He breaketh in pieces mighty men without inquisition, And setteth others in their stead.
    translation: JPS 1917
    original: יָרֹעַ כַּבִּירִים לֹא־חֵקֶר וַיַּעֲמֵד אֲחֵרִים תַּחְתָּם׃
    hebrewPlain: ירע כבירים לא חקר ויעמד אחרים תחתם
    kjvRefs:
    - Job 34:24
    kjvOsis:
    - Job.34.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.25
    scripture: tanakh
    name: Tanakh Job 34:25
    ref: Job 34:25
    book: Job
    section: ketuvim
    chapter: 34
    verse: 25
    ordinal: 19423
    text: Therefore He taketh knowledge of their works; And He overturneth them in the night, so that they are crushed.
    translation: JPS 1917
    original: לָכֵן יַכִּיר מַעְבָּדֵיהֶם וְהָפַךְ לַיְלָה וְיִדַּכָּאוּ׃
    hebrewPlain: לכן יכיר מעבדיהם והפך לילה וידכאו
    kjvRefs:
    - Job 34:25
    kjvOsis:
    - Job.34.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.26
    scripture: tanakh
    name: Tanakh Job 34:26
    ref: Job 34:26
    book: Job
    section: ketuvim
    chapter: 34
    verse: 26
    ordinal: 19424
    text: He striketh them as wicked men In the open sight of others;
    translation: JPS 1917
    original: תַּחַת־רְשָׁעִים סְפָקָם בִּמְקוֹם רֹאִים׃
    hebrewPlain: תחת רשעים ספקם במקום ראים
    kjvRefs:
    - Job 34:26
    kjvOsis:
    - Job.34.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.27
    scripture: tanakh
    name: Tanakh Job 34:27
    ref: Job 34:27
    book: Job
    section: ketuvim
    chapter: 34
    verse: 27
    ordinal: 19425
    text: Because they turned aside from following Him, And would not have regard to any of His ways;
    translation: JPS 1917
    original: אֲשֶׁר עַל־כֵּן סָרוּ מֵאַחֲרָיו וְכָל־דְּרָכָיו לֹא הִשְׂכִּילוּ׃
    hebrewPlain: אשר על כן סרו מאחריו וכל דרכיו לא השכילו
    kjvRefs:
    - Job 34:27
    kjvOsis:
    - Job.34.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.28
    scripture: tanakh
    name: Tanakh Job 34:28
    ref: Job 34:28
    book: Job
    section: ketuvim
    chapter: 34
    verse: 28
    ordinal: 19426
    text: So that they cause the cry of the poor to come unto Him, And He heareth the cry of the afflicted.
    translation: JPS 1917
    original: לְהָבִיא עָלָיו צַעֲקַת־דָּל וְצַעֲקַת עֲנִיִּים יִשְׁמָע׃
    hebrewPlain: להביא עליו צעקת דל וצעקת עניים ישמע
    kjvRefs:
    - Job 34:28
    kjvOsis:
    - Job.34.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.29
    scripture: tanakh
    name: Tanakh Job 34:29
    ref: Job 34:29
    book: Job
    section: ketuvim
    chapter: 34
    verse: 29
    ordinal: 19427
    text: When He giveth quietness, who then can condemn? And when He hideth His face, who then can behold Him? Whether it be done unto a nation, or unto a man, alike;
    translation: JPS 1917
    original: וְהוּא יַשְׁקִט וּמִי יַרְשִׁעַ וְיַסְתֵּר פָּנִים וּמִי יְשׁוּרֶנּוּ וְעַל־גּוֹי וְעַל־אָדָם יָחַד׃
    hebrewPlain: והוא ישקט ומי ירשע ויסתר פנים ומי ישורנו ועל גוי ועל אדם יחד
    kjvRefs:
    - Job 34:29
    kjvOsis:
    - Job.34.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.30
    scripture: tanakh
    name: Tanakh Job 34:30
    ref: Job 34:30
    book: Job
    section: ketuvim
    chapter: 34
    verse: 30
    ordinal: 19428
    text: That the godless man reign not, That there be none to ensnare the people.
    translation: JPS 1917
    original: מִמְּלֹךְ אָדָם חָנֵף מִמֹּקְשֵׁי עָם׃
    hebrewPlain: ממלך אדם חנף ממקשי עם
    kjvRefs:
    - Job 34:30
    kjvOsis:
    - Job.34.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.31
    scripture: tanakh
    name: Tanakh Job 34:31
    ref: Job 34:31
    book: Job
    section: ketuvim
    chapter: 34
    verse: 31
    ordinal: 19429
    text: 'For hath any said unto God: ‘I have borne chastisement, though I offend not;'
    translation: JPS 1917
    original: כִּי־אֶל־אֵל הֶאָמַר נָשָׂאתִי לֹא אֶחְבֹּל׃
    hebrewPlain: כי אל אל האמר נשאתי לא אחבל
    kjvRefs:
    - Job 34:31
    kjvOsis:
    - Job.34.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.32
    scripture: tanakh
    name: Tanakh Job 34:32
    ref: Job 34:32
    book: Job
    section: ketuvim
    chapter: 34
    verse: 32
    ordinal: 19430
    text: That which I see not teach Thou me; If I have done iniquity, I will do it no more’?
    translation: JPS 1917
    original: בִּלְעֲדֵי אֶחֱזֶה אַתָּה הֹרֵנִי אִם־עָוֶל פָּעַלְתִּי לֹא אֹסִיף׃
    hebrewPlain: בלעדי אחזה אתה הרני אם עול פעלתי לא אסיף
    kjvRefs:
    - Job 34:32
    kjvOsis:
    - Job.34.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.33
    scripture: tanakh
    name: Tanakh Job 34:33
    ref: Job 34:33
    book: Job
    section: ketuvim
    chapter: 34
    verse: 33
    ordinal: 19431
    text: Shall His recompense be as thou wilt? For thou loathest it, So that thou must choose, and not I; Therefore speak what thou knowest.
    translation: JPS 1917
    original: הַמֵעִמְּךָ יְשַׁלְמֶנָּה כִּי־מָאַסְתָּ כִּי־אַתָּה תִבְחַר וְלֹא־אָנִי וּמַה־יָדַעְתָּ דַבֵּר׃
    hebrewPlain: המעמך ישלמנה כי מאסת כי אתה תבחר ולא אני ומה ידעת דבר
    kjvRefs:
    - Job 34:33
    kjvOsis:
    - Job.34.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.34
    scripture: tanakh
    name: Tanakh Job 34:34
    ref: Job 34:34
    book: Job
    section: ketuvim
    chapter: 34
    verse: 34
    ordinal: 19432
    text: 'Men of understanding will say unto me, Yea, every wise man that heareth me:'
    translation: JPS 1917
    original: אַנְשֵׁי לֵבָב יֹאמְרוּ לִי וְגֶבֶר חָכָם שֹׁמֵעַ לִי׃
    hebrewPlain: אנשי לבב יאמרו לי וגבר חכם שמע לי
    kjvRefs:
    - Job 34:34
    kjvOsis:
    - Job.34.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.35
    scripture: tanakh
    name: Tanakh Job 34:35
    ref: Job 34:35
    book: Job
    section: ketuvim
    chapter: 34
    verse: 35
    ordinal: 19433
    text: ’Job speaketh without knowledge, And his words are without discernment.’
    translation: JPS 1917
    original: אִיּוֹב לֹא־בְדַעַת יְדַבֵּר וּדְבָרָיו לֹא בְהַשְׂכֵּיל׃
    hebrewPlain: איוב לא בדעת ידבר ודבריו לא בהשכיל
    kjvRefs:
    - Job 34:35
    kjvOsis:
    - Job.34.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.36
    scripture: tanakh
    name: Tanakh Job 34:36
    ref: Job 34:36
    book: Job
    section: ketuvim
    chapter: 34
    verse: 36
    ordinal: 19434
    text: Would that Job were tried unto the end, Because of his answering like wicked men.
    translation: JPS 1917
    original: אָבִי יִבָּחֵן אִיּוֹב עַד־נֶצַח עַל־תְּשֻׁבֹת בְּאַנְשֵׁי־אָוֶן׃
    hebrewPlain: אבי יבחן איוב עד נצח על תשבת באנשי און
    kjvRefs:
    - Job 34:36
    kjvOsis:
    - Job.34.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.34.37
    scripture: tanakh
    name: Tanakh Job 34:37
    ref: Job 34:37
    book: Job
    section: ketuvim
    chapter: 34
    verse: 37
    ordinal: 19435
    text: For he addeth rebellion unto his sin, He clappeth his hands among us, And multiplieth his words against God.
    translation: JPS 1917
    original: כִּי יֹסִיף עַל־חַטָּאתוֹ פֶשַׁע בֵּינֵינוּ יִסְפּוֹק וְיֶרֶב אֲמָרָיו לָאֵל׃
    hebrewPlain: כי יסיף על חטאתו פשע בינינו יספוק וירב אמריו לאל
    kjvRefs:
    - Job 34:37
    kjvOsis:
    - Job.34.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.34
- type: TanakhVerse
  data:
    osis: Job.35.1
    scripture: tanakh
    name: Tanakh Job 35:1
    ref: Job 35:1
    book: Job
    section: ketuvim
    chapter: 35
    verse: 1
    ordinal: 19436
    text: 'Moreover Elihu answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיהוּ וַיֹּאמַר׃
    hebrewPlain: ויען אליהו ויאמר
    kjvRefs:
    - Job 35:1
    kjvOsis:
    - Job.35.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.2
    scripture: tanakh
    name: Tanakh Job 35:2
    ref: Job 35:2
    book: Job
    section: ketuvim
    chapter: 35
    verse: 2
    ordinal: 19437
    text: 'Thinkest thou this to be thy right, Or sayest thou: ‘I am righteousness before God’,'
    translation: JPS 1917
    original: הֲזֹאת חָשַׁבְתָּ לְמִשְׁפָּט אָמַרְתָּ צִדְקִי מֵאֵל׃
    hebrewPlain: הזאת חשבת למשפט אמרת צדקי מאל
    kjvRefs:
    - Job 35:2
    kjvOsis:
    - Job.35.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.3
    scripture: tanakh
    name: Tanakh Job 35:3
    ref: Job 35:3
    book: Job
    section: ketuvim
    chapter: 35
    verse: 3
    ordinal: 19438
    text: 'That thou inquirest: ‘What advantage will it be unto Thee?’ And: ‘What profit shall I have, more than if I had sinned?’'
    translation: JPS 1917
    original: כִּי־תֹאמַר מַה־יִּסְכָּן־לָךְ מָה־אֹעִיל מֵחַטָּאתִי׃
    hebrewPlain: כי תאמר מה יסכן לך מה אעיל מחטאתי
    kjvRefs:
    - Job 35:3
    kjvOsis:
    - Job.35.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.4
    scripture: tanakh
    name: Tanakh Job 35:4
    ref: Job 35:4
    book: Job
    section: ketuvim
    chapter: 35
    verse: 4
    ordinal: 19439
    text: I will give thee answer, And thy companions with thee.
    translation: JPS 1917
    original: אֲנִי אֲשִׁיבְךָ מִלִּין וְאֶת־רֵעֶיךָ עִמָּךְ׃
    hebrewPlain: אני אשיבך מלין ואת רעיך עמך
    kjvRefs:
    - Job 35:4
    kjvOsis:
    - Job.35.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.5
    scripture: tanakh
    name: Tanakh Job 35:5
    ref: Job 35:5
    book: Job
    section: ketuvim
    chapter: 35
    verse: 5
    ordinal: 19440
    text: Look unto the heavens, and see; And behold the skies, which are higher than thou.
    translation: JPS 1917
    original: הַבֵּט שָׁמַיִם וּרְאֵה וְשׁוּר שְׁחָקִים גָּבְהוּ מִמֶּךָּ׃
    hebrewPlain: הבט שמים וראה ושור שחקים גבהו ממך
    kjvRefs:
    - Job 35:5
    kjvOsis:
    - Job.35.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.6
    scripture: tanakh
    name: Tanakh Job 35:6
    ref: Job 35:6
    book: Job
    section: ketuvim
    chapter: 35
    verse: 6
    ordinal: 19441
    text: If thou hast sinned, what doest thou against Him? And if thy transgressions be multiplied, what doest thou unto Him?
    translation: JPS 1917
    original: אִם־חָטָאתָ מַה־תִּפְעָל־בּוֹ וְרַבּוּ פְשָׁעֶיךָ מַה־תַּעֲשֶׂה־לּוֹ׃
    hebrewPlain: אם חטאת מה תפעל בו ורבו פשעיך מה תעשה לו
    kjvRefs:
    - Job 35:6
    kjvOsis:
    - Job.35.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.7
    scripture: tanakh
    name: Tanakh Job 35:7
    ref: Job 35:7
    book: Job
    section: ketuvim
    chapter: 35
    verse: 7
    ordinal: 19442
    text: If thou be righteous, what givest thou Him? Or what receiveth He of thy hand?
    translation: JPS 1917
    original: אִם־צָדַקְתָּ מַה־תִּתֶּן־לוֹ אוֹ מַה־מִיָּדְךָ יִקָּח׃
    hebrewPlain: אם צדקת מה תתן לו או מה מידך יקח
    kjvRefs:
    - Job 35:7
    kjvOsis:
    - Job.35.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.8
    scripture: tanakh
    name: Tanakh Job 35:8
    ref: Job 35:8
    book: Job
    section: ketuvim
    chapter: 35
    verse: 8
    ordinal: 19443
    text: Thy wickedness concerneth a man as thou art; And thy righteousness a son of man.
    translation: JPS 1917
    original: לְאִישׁ־כָּמוֹךָ רִשְׁעֶךָ וּלְבֶן־אָדָם צִדְקָתֶךָ׃
    hebrewPlain: לאיש כמוך רשעך ולבן אדם צדקתך
    kjvRefs:
    - Job 35:8
    kjvOsis:
    - Job.35.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.9
    scripture: tanakh
    name: Tanakh Job 35:9
    ref: Job 35:9
    book: Job
    section: ketuvim
    chapter: 35
    verse: 9
    ordinal: 19444
    text: By reason of the multitude of oppressions they cry out; They cry for help by reason of the arm of the mighty.
    translation: JPS 1917
    original: מֵרֹב עֲשׁוּקִים יַזְעִיקוּ יְשַׁוְּעוּ מִזְּרוֹעַ רַבִּים׃
    hebrewPlain: מרב עשוקים יזעיקו ישועו מזרוע רבים
    kjvRefs:
    - Job 35:9
    kjvOsis:
    - Job.35.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.10
    scripture: tanakh
    name: Tanakh Job 35:10
    ref: Job 35:10
    book: Job
    section: ketuvim
    chapter: 35
    verse: 10
    ordinal: 19445
    text: 'But none saith: ‘Where is God my Maker, Who giveth songs in the night;'
    translation: JPS 1917
    original: וְלֹא־אָמַר אַיֵּה אֱלוֹהַּ עֹשָׂי נֹתֵן זְמִרוֹת בַּלָּיְלָה׃
    hebrewPlain: ולא אמר איה אלוה עשי נתן זמרות בלילה
    kjvRefs:
    - Job 35:10
    kjvOsis:
    - Job.35.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.11
    scripture: tanakh
    name: Tanakh Job 35:11
    ref: Job 35:11
    book: Job
    section: ketuvim
    chapter: 35
    verse: 11
    ordinal: 19446
    text: Who teacheth us more than the beasts of the earth, And maketh us wiser than the fowls of heaven?’
    translation: JPS 1917
    original: מַלְּפֵנוּ מִבַּהֲמוֹת אָרֶץ וּמֵעוֹף הַשָּׁמַיִם יְחַכְּמֵנוּ׃
    hebrewPlain: מלפנו מבהמות ארץ ומעוף השמים יחכמנו
    kjvRefs:
    - Job 35:11
    kjvOsis:
    - Job.35.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.12
    scripture: tanakh
    name: Tanakh Job 35:12
    ref: Job 35:12
    book: Job
    section: ketuvim
    chapter: 35
    verse: 12
    ordinal: 19447
    text: There they cry, but none giveth answer, Because of the pride of evil men.
    translation: JPS 1917
    original: שָׁם יִצְעֲקוּ וְלֹא יַעֲנֶה מִפְּנֵי גְּאוֹן רָעִים׃
    hebrewPlain: שם יצעקו ולא יענה מפני גאון רעים
    kjvRefs:
    - Job 35:12
    kjvOsis:
    - Job.35.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.13
    scripture: tanakh
    name: Tanakh Job 35:13
    ref: Job 35:13
    book: Job
    section: ketuvim
    chapter: 35
    verse: 13
    ordinal: 19448
    text: Surely God will not hear vanity, Neither will the Almighty regard it.
    translation: JPS 1917
    original: אַךְ־שָׁוְא לֹא־יִשְׁמַע אֵל וְשַׁדַּי לֹא יְשׁוּרֶנָּה׃
    hebrewPlain: אך שוא לא ישמע אל ושדי לא ישורנה
    kjvRefs:
    - Job 35:13
    kjvOsis:
    - Job.35.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.14
    scripture: tanakh
    name: Tanakh Job 35:14
    ref: Job 35:14
    book: Job
    section: ketuvim
    chapter: 35
    verse: 14
    ordinal: 19449
    text: Yea, when thou sayest thou canst not see Him— The cause is before Him; therefore wait thou for Him.
    translation: JPS 1917
    original: אַף כִּי־תֹאמַר לֹא תְשׁוּרֶנּוּ דִּין לְפָנָיו וּתְחוֹלֵל לוֹ׃
    hebrewPlain: אף כי תאמר לא תשורנו דין לפניו ותחולל לו
    kjvRefs:
    - Job 35:14
    kjvOsis:
    - Job.35.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.15
    scripture: tanakh
    name: Tanakh Job 35:15
    ref: Job 35:15
    book: Job
    section: ketuvim
    chapter: 35
    verse: 15
    ordinal: 19450
    text: And now, is it for nought that He punished in His anger? And hath He not full knowledge of arrogance?
    translation: JPS 1917
    original: וְעַתָּה כִּי־אַיִן פָּקַד אַפּוֹ וְלֹא־יָדַע בַּפַּשׁ מְאֹד׃
    hebrewPlain: ועתה כי אין פקד אפו ולא ידע בפש מאד
    kjvRefs:
    - Job 35:15
    kjvOsis:
    - Job.35.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.35.16
    scripture: tanakh
    name: Tanakh Job 35:16
    ref: Job 35:16
    book: Job
    section: ketuvim
    chapter: 35
    verse: 16
    ordinal: 19451
    text: But Job doth open his mouth in vanity; He multiplieth words without knowledge.
    translation: JPS 1917
    original: וְאִיּוֹב הֶבֶל יִפְצֶה־פִּיהוּ בִּבְלִי־דַעַת מִלִּין יַכְבִּר׃
    hebrewPlain: ואיוב הבל יפצה פיהו בבלי דעת מלין יכבר
    kjvRefs:
    - Job 35:16
    kjvOsis:
    - Job.35.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.35
- type: TanakhVerse
  data:
    osis: Job.36.1
    scripture: tanakh
    name: Tanakh Job 36:1
    ref: Job 36:1
    book: Job
    section: ketuvim
    chapter: 36
    verse: 1
    ordinal: 19452
    text: 'Elihu also proceeded, and said:'
    translation: JPS 1917
    original: וַיֹּסֶף אֱלִיהוּא וַיֹּאמַר׃
    hebrewPlain: ויסף אליהוא ויאמר
    kjvRefs:
    - Job 36:1
    kjvOsis:
    - Job.36.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.2
    scripture: tanakh
    name: Tanakh Job 36:2
    ref: Job 36:2
    book: Job
    section: ketuvim
    chapter: 36
    verse: 2
    ordinal: 19453
    text: Suffer me a little, and I will tell thee; For there are yet words on God’s behalf.
    translation: JPS 1917
    original: כַּתַּר־לִי זְעֵיר וַאֲחַוֶּךָּ כִּי עוֹד לֶאֱלוֹהַּ מִלִּים׃
    hebrewPlain: כתר לי זעיר ואחוך כי עוד לאלוה מלים
    kjvRefs:
    - Job 36:2
    kjvOsis:
    - Job.36.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.3
    scripture: tanakh
    name: Tanakh Job 36:3
    ref: Job 36:3
    book: Job
    section: ketuvim
    chapter: 36
    verse: 3
    ordinal: 19454
    text: I will fetch my knowledge from afar, And will ascribe righteousness to my Maker.
    translation: JPS 1917
    original: אֶשָּׂא דֵעִי לְמֵרָחוֹק וּלְפֹעֲלִי אֶתֵּן־צֶדֶק׃
    hebrewPlain: אשא דעי למרחוק ולפעלי אתן צדק
    kjvRefs:
    - Job 36:3
    kjvOsis:
    - Job.36.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.4
    scripture: tanakh
    name: Tanakh Job 36:4
    ref: Job 36:4
    book: Job
    section: ketuvim
    chapter: 36
    verse: 4
    ordinal: 19455
    text: For truly my words are not false; One that is upright in mind is with thee.
    translation: JPS 1917
    original: כִּי־אָמְנָם לֹא־שֶׁקֶר מִלָּי תְּמִים דֵּעוֹת עִמָּךְ׃
    hebrewPlain: כי אמנם לא שקר מלי תמים דעות עמך
    kjvRefs:
    - Job 36:4
    kjvOsis:
    - Job.36.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.5
    scripture: tanakh
    name: Tanakh Job 36:5
    ref: Job 36:5
    book: Job
    section: ketuvim
    chapter: 36
    verse: 5
    ordinal: 19456
    text: Behold, God is mighty, yet He despiseth not any; He is mighty in strength of understanding.
    translation: JPS 1917
    original: הֶן־אֵל כַּבִּיר וְלֹא יִמְאָס כַּבִּיר כֹּחַ לֵב׃
    hebrewPlain: הן אל כביר ולא ימאס כביר כח לב
    kjvRefs:
    - Job 36:5
    kjvOsis:
    - Job.36.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.6
    scripture: tanakh
    name: Tanakh Job 36:6
    ref: Job 36:6
    book: Job
    section: ketuvim
    chapter: 36
    verse: 6
    ordinal: 19457
    text: He preserveth not the life of the wicked; But giveth to the poor their right.
    translation: JPS 1917
    original: לֹא־יְחַיֶּה רָשָׁע וּמִשְׁפַּט עֲנִיִּים יִתֵּן׃
    hebrewPlain: לא יחיה רשע ומשפט עניים יתן
    kjvRefs:
    - Job 36:6
    kjvOsis:
    - Job.36.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.7
    scripture: tanakh
    name: Tanakh Job 36:7
    ref: Job 36:7
    book: Job
    section: ketuvim
    chapter: 36
    verse: 7
    ordinal: 19458
    text: He withdraweth not His eyes from the righteous; But with kings upon the throne He setteth them for ever, and they are exalted.
    translation: JPS 1917
    original: לֹא־יִגְרַע מִצַּדִּיק עֵינָיו וְאֶת־מְלָכִים לַכִּסֵּא וַיֹּשִׁיבֵם לָנֶצַח וַיִּגְבָּהוּ׃
    hebrewPlain: לא יגרע מצדיק עיניו ואת מלכים לכסא וישיבם לנצח ויגבהו
    kjvRefs:
    - Job 36:7
    kjvOsis:
    - Job.36.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.8
    scripture: tanakh
    name: Tanakh Job 36:8
    ref: Job 36:8
    book: Job
    section: ketuvim
    chapter: 36
    verse: 8
    ordinal: 19459
    text: And if they be bound in fetters, And be holden in cords of affliction;
    translation: JPS 1917
    original: וְאִם־אֲסוּרִים בַּזִּקִּים יִלָּכְדוּן בְּחַבְלֵי־עֹנִי׃
    hebrewPlain: ואם אסורים בזקים ילכדון בחבלי עני
    kjvRefs:
    - Job 36:8
    kjvOsis:
    - Job.36.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.9
    scripture: tanakh
    name: Tanakh Job 36:9
    ref: Job 36:9
    book: Job
    section: ketuvim
    chapter: 36
    verse: 9
    ordinal: 19460
    text: Then He declareth unto them their work, And their transgressions, that they have behaved themselves proudly.
    translation: JPS 1917
    original: וַיַּגֵּד לָהֶם פָּעֳלָם וּפִשְׁעֵיהֶם כִּי יִתְגַּבָּרוּ׃
    hebrewPlain: ויגד להם פעלם ופשעיהם כי יתגברו
    kjvRefs:
    - Job 36:9
    kjvOsis:
    - Job.36.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.10
    scripture: tanakh
    name: Tanakh Job 36:10
    ref: Job 36:10
    book: Job
    section: ketuvim
    chapter: 36
    verse: 10
    ordinal: 19461
    text: He openeth also their ear to discipline, And commandeth that they return from iniquity.
    translation: JPS 1917
    original: וַיִּגֶל אָזְנָם לַמּוּסָר וַיֹּאמֶר כִּי־יְשֻׁבוּן מֵאָוֶן׃
    hebrewPlain: ויגל אזנם למוסר ויאמר כי ישבון מאון
    kjvRefs:
    - Job 36:10
    kjvOsis:
    - Job.36.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.11
    scripture: tanakh
    name: Tanakh Job 36:11
    ref: Job 36:11
    book: Job
    section: ketuvim
    chapter: 36
    verse: 11
    ordinal: 19462
    text: If they hearken and serve Him, They shall spend their days in prosperity, And their years in pleasures.
    translation: JPS 1917
    original: אִם־יִשְׁמְעוּ וְיַעֲבֹדוּ יְכַלּוּ יְמֵיהֶם בַּטּוֹב וּשְׁנֵיהֶם בַּנְּעִימִים׃
    hebrewPlain: אם ישמעו ויעבדו יכלו ימיהם בטוב ושניהם בנעימים
    kjvRefs:
    - Job 36:11
    kjvOsis:
    - Job.36.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.12
    scripture: tanakh
    name: Tanakh Job 36:12
    ref: Job 36:12
    book: Job
    section: ketuvim
    chapter: 36
    verse: 12
    ordinal: 19463
    text: But if they hearken not, they shall perish by the sword, And they shall die without knowledge.
    translation: JPS 1917
    original: וְאִם־לֹא יִשְׁמְעוּ בְּשֶׁלַח יַעֲבֹרוּ וְיִגְוְעוּ כִּבְלִי־דָעַת׃
    hebrewPlain: ואם לא ישמעו בשלח יעברו ויגועו כבלי דעת
    kjvRefs:
    - Job 36:12
    kjvOsis:
    - Job.36.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.13
    scripture: tanakh
    name: Tanakh Job 36:13
    ref: Job 36:13
    book: Job
    section: ketuvim
    chapter: 36
    verse: 13
    ordinal: 19464
    text: But they that are godless in heart lay up anger; They cry not for help when He bindeth them.
    translation: JPS 1917
    original: וְחַנְפֵי־לֵב יָשִׂימוּ אָף לֹא יְשַׁוְּעוּ כִּי אֲסָרָם׃
    hebrewPlain: וחנפי לב ישימו אף לא ישועו כי אסרם
    kjvRefs:
    - Job 36:13
    kjvOsis:
    - Job.36.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.14
    scripture: tanakh
    name: Tanakh Job 36:14
    ref: Job 36:14
    book: Job
    section: ketuvim
    chapter: 36
    verse: 14
    ordinal: 19465
    text: Their soul perisheth in youth, And their life as that of the depraved.
    translation: JPS 1917
    original: תָּמֹת בַּנֹּעַר נַפְשָׁם וְחַיָּתָם בַּקְּדֵשִׁים׃
    hebrewPlain: תמת בנער נפשם וחיתם בקדשים
    kjvRefs:
    - Job 36:14
    kjvOsis:
    - Job.36.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.15
    scripture: tanakh
    name: Tanakh Job 36:15
    ref: Job 36:15
    book: Job
    section: ketuvim
    chapter: 36
    verse: 15
    ordinal: 19466
    text: He delivereth the afflicted by His affliction, And openeth their ear by tribulation.
    translation: JPS 1917
    original: יְחַלֵּץ עָנִי בְעָנְיוֹ וְיִגֶל בַּלַּחַץ אָזְנָם׃
    hebrewPlain: יחלץ עני בעניו ויגל בלחץ אזנם
    kjvRefs:
    - Job 36:15
    kjvOsis:
    - Job.36.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.16
    scripture: tanakh
    name: Tanakh Job 36:16
    ref: Job 36:16
    book: Job
    section: ketuvim
    chapter: 36
    verse: 16
    ordinal: 19467
    text: Yea, He hath allured thee out of distress Into a broad place, where there is no straitness; And that which is set on thy table is full of fatness;
    translation: JPS 1917
    original: וְאַף הֲסִיתְךָ מִפִּי־צָר רַחַב לֹא־מוּצָק תַּחְתֶּיהָ וְנַחַת שֻׁלְחָנְךָ מָלֵא דָשֶׁן׃
    hebrewPlain: ואף הסיתך מפי צר רחב לא מוצק תחתיה ונחת שלחנך מלא דשן
    kjvRefs:
    - Job 36:16
    kjvOsis:
    - Job.36.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.17
    scripture: tanakh
    name: Tanakh Job 36:17
    ref: Job 36:17
    book: Job
    section: ketuvim
    chapter: 36
    verse: 17
    ordinal: 19468
    text: And thou art full of the judgment of the wicked; Judgment and justice take hold on them.
    translation: JPS 1917
    original: וְדִין־רָשָׁע מָלֵאתָ דִּין וּמִשְׁפָּט יִתְמֹכוּ׃
    hebrewPlain: ודין רשע מלאת דין ומשפט יתמכו
    kjvRefs:
    - Job 36:17
    kjvOsis:
    - Job.36.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.18
    scripture: tanakh
    name: Tanakh Job 36:18
    ref: Job 36:18
    book: Job
    section: ketuvim
    chapter: 36
    verse: 18
    ordinal: 19469
    text: For beware of wrath, lest thou be led away by thy sufficiency; Neither let the greatness of the ransom turn thee aside.
    translation: JPS 1917
    original: כִּי־חֵמָה פֶּן־יְסִיתְךָ בְסָפֶק וְרָב־כֹּפֶר אַל־יַטֶּךָּ׃
    hebrewPlain: כי חמה פן יסיתך בספק ורב כפר אל יטך
    kjvRefs:
    - Job 36:18
    kjvOsis:
    - Job.36.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.19
    scripture: tanakh
    name: Tanakh Job 36:19
    ref: Job 36:19
    book: Job
    section: ketuvim
    chapter: 36
    verse: 19
    ordinal: 19470
    text: Will thy riches avail, that are without stint, Or all the forces of thy strength?
    translation: JPS 1917
    original: הֲיַעֲרֹךְ שׁוּעֲךָ לֹא בְצָר וְכֹל מַאֲמַצֵּי־כֹחַ׃
    hebrewPlain: היערך שועך לא בצר וכל מאמצי כח
    kjvRefs:
    - Job 36:19
    kjvOsis:
    - Job.36.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.20
    scripture: tanakh
    name: Tanakh Job 36:20
    ref: Job 36:20
    book: Job
    section: ketuvim
    chapter: 36
    verse: 20
    ordinal: 19471
    text: Desire not the night, When peoples are cut off in their place.
    translation: JPS 1917
    original: אַל־תִּשְׁאַף הַלָּיְלָה לַעֲלוֹת עַמִּים תַּחְתָּם׃
    hebrewPlain: אל תשאף הלילה לעלות עמים תחתם
    kjvRefs:
    - Job 36:20
    kjvOsis:
    - Job.36.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.21
    scripture: tanakh
    name: Tanakh Job 36:21
    ref: Job 36:21
    book: Job
    section: ketuvim
    chapter: 36
    verse: 21
    ordinal: 19472
    text: Take heed, regard not iniquity; For this hast thou chosen rather than affliction.
    translation: JPS 1917
    original: הִשָּׁמֶר אַל־תֵּפֶן אֶל־אָוֶן כִּי־עַל־זֶה בָּחַרְתָּ מֵעֹנִי׃
    hebrewPlain: השמר אל תפן אל און כי על זה בחרת מעני
    kjvRefs:
    - Job 36:21
    kjvOsis:
    - Job.36.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.22
    scripture: tanakh
    name: Tanakh Job 36:22
    ref: Job 36:22
    book: Job
    section: ketuvim
    chapter: 36
    verse: 22
    ordinal: 19473
    text: Behold, God doeth loftily in His power; Who is a teacher like Him?
    translation: JPS 1917
    original: הֶן־אֵל יַשְׂגִּיב בְּכֹחוֹ מִי כָמֹהוּ מוֹרֶה׃
    hebrewPlain: הן אל ישגיב בכחו מי כמהו מורה
    kjvRefs:
    - Job 36:22
    kjvOsis:
    - Job.36.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.23
    scripture: tanakh
    name: Tanakh Job 36:23
    ref: Job 36:23
    book: Job
    section: ketuvim
    chapter: 36
    verse: 23
    ordinal: 19474
    text: 'Who hath enjoined Him His way? Or who hath said: ‘Thou hast wrought unrighteousness’?'
    translation: JPS 1917
    original: מִי־פָקַד עָלָיו דַּרְכּוֹ וּמִי־אָמַר פָּעַלְתָּ עַוְלָה׃
    hebrewPlain: מי פקד עליו דרכו ומי אמר פעלת עולה
    kjvRefs:
    - Job 36:23
    kjvOsis:
    - Job.36.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.24
    scripture: tanakh
    name: Tanakh Job 36:24
    ref: Job 36:24
    book: Job
    section: ketuvim
    chapter: 36
    verse: 24
    ordinal: 19475
    text: Remember that thou magnify His work, Whereof men have sung.
    translation: JPS 1917
    original: זְכֹר כִּי־תַשְׂגִּיא פָעֳלוֹ אֲשֶׁר שֹׁרְרוּ אֲנָשִׁים׃
    hebrewPlain: זכר כי תשגיא פעלו אשר שררו אנשים
    kjvRefs:
    - Job 36:24
    kjvOsis:
    - Job.36.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.25
    scripture: tanakh
    name: Tanakh Job 36:25
    ref: Job 36:25
    book: Job
    section: ketuvim
    chapter: 36
    verse: 25
    ordinal: 19476
    text: All men have looked thereon; Man beholdeth it afar off.
    translation: JPS 1917
    original: כָּל־אָדָם חָזוּ־בוֹ אֱנוֹשׁ יַבִּיט מֵרָחוֹק׃
    hebrewPlain: כל אדם חזו בו אנוש יביט מרחוק
    kjvRefs:
    - Job 36:25
    kjvOsis:
    - Job.36.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.26
    scripture: tanakh
    name: Tanakh Job 36:26
    ref: Job 36:26
    book: Job
    section: ketuvim
    chapter: 36
    verse: 26
    ordinal: 19477
    text: Behold, God is great, beyond our knowledge; The number of His years is unsearchable.
    translation: JPS 1917
    original: הֶן־אֵל שַׂגִּיא וְלֹא נֵדָע מִסְפַּר שָׁנָיו וְלֹא־חֵקֶר׃
    hebrewPlain: הן אל שגיא ולא נדע מספר שניו ולא חקר
    kjvRefs:
    - Job 36:26
    kjvOsis:
    - Job.36.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.27
    scripture: tanakh
    name: Tanakh Job 36:27
    ref: Job 36:27
    book: Job
    section: ketuvim
    chapter: 36
    verse: 27
    ordinal: 19478
    text: For He draweth away the drops of water, Which distil rain from His vapour;
    translation: JPS 1917
    original: כִּי יְגָרַע נִטְפֵי־מָיִם יָזֹקּוּ מָטָר לְאֵדוֹ׃
    hebrewPlain: כי יגרע נטפי מים יזקו מטר לאדו
    kjvRefs:
    - Job 36:27
    kjvOsis:
    - Job.36.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.28
    scripture: tanakh
    name: Tanakh Job 36:28
    ref: Job 36:28
    book: Job
    section: ketuvim
    chapter: 36
    verse: 28
    ordinal: 19479
    text: Which the skies pour down And drop upon the multitudes of men.
    translation: JPS 1917
    original: אֲשֶׁר־יִזְּלוּ שְׁחָקִים יִרְעֲפוּ עֲלֵי אָדָם רָב׃
    hebrewPlain: אשר יזלו שחקים ירעפו עלי אדם רב
    kjvRefs:
    - Job 36:28
    kjvOsis:
    - Job.36.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.29
    scripture: tanakh
    name: Tanakh Job 36:29
    ref: Job 36:29
    book: Job
    section: ketuvim
    chapter: 36
    verse: 29
    ordinal: 19480
    text: Yea, can any understand the spreadings of the clouds, The crashings of His pavilion?
    translation: JPS 1917
    original: אַף אִם־יָבִין מִפְרְשֵׂי־עָב תְּשֻׁאוֹת סֻכָּתוֹ׃
    hebrewPlain: אף אם יבין מפרשי עב תשאות סכתו
    kjvRefs:
    - Job 36:29
    kjvOsis:
    - Job.36.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.30
    scripture: tanakh
    name: Tanakh Job 36:30
    ref: Job 36:30
    book: Job
    section: ketuvim
    chapter: 36
    verse: 30
    ordinal: 19481
    text: Behold, He spreadeth His light upon it; And He covereth the depths of the sea.
    translation: JPS 1917
    original: הֵן־פָּרַשׂ עָלָיו אוֹרוֹ וְשָׁרְשֵׁי הַיָּם כִּסָּה׃
    hebrewPlain: הן פרש עליו אורו ושרשי הים כסה
    kjvRefs:
    - Job 36:30
    kjvOsis:
    - Job.36.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.31
    scripture: tanakh
    name: Tanakh Job 36:31
    ref: Job 36:31
    book: Job
    section: ketuvim
    chapter: 36
    verse: 31
    ordinal: 19482
    text: For by these He judgeth the peoples; He giveth food in abundance.
    translation: JPS 1917
    original: כִּי־בָם יָדִין עַמִּים יִתֶּן־אֹכֶל לְמַכְבִּיר׃
    hebrewPlain: כי בם ידין עמים יתן אכל למכביר
    kjvRefs:
    - Job 36:31
    kjvOsis:
    - Job.36.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.32
    scripture: tanakh
    name: Tanakh Job 36:32
    ref: Job 36:32
    book: Job
    section: ketuvim
    chapter: 36
    verse: 32
    ordinal: 19483
    text: He covereth His hands with the lightning, And giveth it a charge that it strike the mark.
    translation: JPS 1917
    original: עַל־כַּפַּיִם כִּסָּה־אוֹר וַיְצַו עָלֶיהָ בְמַפְגִּיעַ׃
    hebrewPlain: על כפים כסה אור ויצו עליה במפגיע
    kjvRefs:
    - Job 36:32
    kjvOsis:
    - Job.36.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.36.33
    scripture: tanakh
    name: Tanakh Job 36:33
    ref: Job 36:33
    book: Job
    section: ketuvim
    chapter: 36
    verse: 33
    ordinal: 19484
    text: The noise thereof telleth concerning it, The cattle also concerning the storm that cometh up.
    translation: JPS 1917
    original: יַגִּיד עָלָיו רֵעוֹ מִקְנֶה אַף עַל־עוֹלֶה׃
    hebrewPlain: יגיד עליו רעו מקנה אף על עולה
    kjvRefs:
    - Job 36:33
    kjvOsis:
    - Job.36.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.36
- type: TanakhVerse
  data:
    osis: Job.37.1
    scripture: tanakh
    name: Tanakh Job 37:1
    ref: Job 37:1
    book: Job
    section: ketuvim
    chapter: 37
    verse: 1
    ordinal: 19485
    text: At this also my heart trembleth, And is moved out of its place.
    translation: JPS 1917
    original: אַף־לְזֹאת יֶחֱרַד לִבִּי וְיִתַּר מִמְּקוֹמוֹ׃
    hebrewPlain: אף לזאת יחרד לבי ויתר ממקומו
    kjvRefs:
    - Job 37:1
    kjvOsis:
    - Job.37.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.2
    scripture: tanakh
    name: Tanakh Job 37:2
    ref: Job 37:2
    book: Job
    section: ketuvim
    chapter: 37
    verse: 2
    ordinal: 19486
    text: Hear attentively the noise of His voice, And the sound that goeth out of His mouth.
    translation: JPS 1917
    original: שִׁמְעוּ שָׁמוֹעַ בְּרֹגֶז קֹלוֹ וְהֶגֶה מִפִּיו יֵצֵא׃
    hebrewPlain: שמעו שמוע ברגז קלו והגה מפיו יצא
    kjvRefs:
    - Job 37:2
    kjvOsis:
    - Job.37.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.3
    scripture: tanakh
    name: Tanakh Job 37:3
    ref: Job 37:3
    book: Job
    section: ketuvim
    chapter: 37
    verse: 3
    ordinal: 19487
    text: He sendeth it forth under the whole heaven, And His lightning unto the ends of the earth.
    translation: JPS 1917
    original: תַּחַת־כָּל־הַשָּׁמַיִם יִשְׁרֵהוּ וְאוֹרוֹ עַל־כַּנְפוֹת הָאָרֶץ׃
    hebrewPlain: תחת כל השמים ישרהו ואורו על כנפות הארץ
    kjvRefs:
    - Job 37:3
    kjvOsis:
    - Job.37.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.4
    scripture: tanakh
    name: Tanakh Job 37:4
    ref: Job 37:4
    book: Job
    section: ketuvim
    chapter: 37
    verse: 4
    ordinal: 19488
    text: After it a voice roareth; He thundereth with the voice of His majesty; And He stayeth them not when His voice is heard.
    translation: JPS 1917
    original: אַחֲרָיו יִשְׁאַג־קוֹל יַרְעֵם בְּקוֹל גְּאוֹנוֹ וְלֹא יְעַקְּבֵם כִּי־יִשָּׁמַע קוֹלוֹ׃
    hebrewPlain: אחריו ישאג קול ירעם בקול גאונו ולא יעקבם כי ישמע קולו
    kjvRefs:
    - Job 37:4
    kjvOsis:
    - Job.37.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.5
    scripture: tanakh
    name: Tanakh Job 37:5
    ref: Job 37:5
    book: Job
    section: ketuvim
    chapter: 37
    verse: 5
    ordinal: 19489
    text: God thundereth marvellously with His voice; Great things doeth He, which we cannot comprehend.
    translation: JPS 1917
    original: יַרְעֵם אֵל בְּקוֹלוֹ נִפְלָאוֹת עֹשֶׂה גְדֹלוֹת וְלֹא נֵדָע׃
    hebrewPlain: ירעם אל בקולו נפלאות עשה גדלות ולא נדע
    kjvRefs:
    - Job 37:5
    kjvOsis:
    - Job.37.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.6
    scripture: tanakh
    name: Tanakh Job 37:6
    ref: Job 37:6
    book: Job
    section: ketuvim
    chapter: 37
    verse: 6
    ordinal: 19490
    text: 'For He saith to the snow: ‘Fall thou on the earth’; Likewise to the shower of rain, and to the showers of His mighty rain.'
    translation: JPS 1917
    original: כִּי לַשֶּׁלַג יֹאמַר הֱוֵא אָרֶץ וְגֶשֶׁם מָטָר וְגֶשֶׁם מִטְרוֹת עֻזּוֹ׃
    hebrewPlain: כי לשלג יאמר הוא ארץ וגשם מטר וגשם מטרות עזו
    kjvRefs:
    - Job 37:6
    kjvOsis:
    - Job.37.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.7
    scripture: tanakh
    name: Tanakh Job 37:7
    ref: Job 37:7
    book: Job
    section: ketuvim
    chapter: 37
    verse: 7
    ordinal: 19491
    text: He sealeth up the hand of every man, That all men whom He hath made may know it.
    translation: JPS 1917
    original: בְּיַד־כָּל־אָדָם יַחְתּוֹם לָדַעַת כָּל־אַנְשֵׁי מַעֲשֵׂהוּ׃
    hebrewPlain: ביד כל אדם יחתום לדעת כל אנשי מעשהו
    kjvRefs:
    - Job 37:7
    kjvOsis:
    - Job.37.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.8
    scripture: tanakh
    name: Tanakh Job 37:8
    ref: Job 37:8
    book: Job
    section: ketuvim
    chapter: 37
    verse: 8
    ordinal: 19492
    text: Then the beasts go into coverts, And remain in their dens.
    translation: JPS 1917
    original: וַתָּבֹא חַיָּה בְמוֹ־אָרֶב וּבִמְעוֹנֹתֶיהָ תִשְׁכֹּן׃
    hebrewPlain: ותבא חיה במו ארב ובמעונתיה תשכן
    kjvRefs:
    - Job 37:8
    kjvOsis:
    - Job.37.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.9
    scripture: tanakh
    name: Tanakh Job 37:9
    ref: Job 37:9
    book: Job
    section: ketuvim
    chapter: 37
    verse: 9
    ordinal: 19493
    text: Out of the Chamber cometh the storm; And cold out of the north.
    translation: JPS 1917
    original: מִן־הַחֶדֶר תָּבוֹא סוּפָה וּמִמְּזָרִים קָרָה׃
    hebrewPlain: מן החדר תבוא סופה וממזרים קרה
    kjvRefs:
    - Job 37:9
    kjvOsis:
    - Job.37.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.10
    scripture: tanakh
    name: Tanakh Job 37:10
    ref: Job 37:10
    book: Job
    section: ketuvim
    chapter: 37
    verse: 10
    ordinal: 19494
    text: By the breath of God ice is given, And the breadth of the waters is straitened.
    translation: JPS 1917
    original: מִנִּשְׁמַת־אֵל יִתֶּן־קָרַח וְרֹחַב מַיִם בְּמוּצָק׃
    hebrewPlain: מנשמת אל יתן קרח ורחב מים במוצק
    kjvRefs:
    - Job 37:10
    kjvOsis:
    - Job.37.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.11
    scripture: tanakh
    name: Tanakh Job 37:11
    ref: Job 37:11
    book: Job
    section: ketuvim
    chapter: 37
    verse: 11
    ordinal: 19495
    text: Yea, He ladeth the thick cloud with moister, He spreadeth abroad the cloud of His lightning;
    translation: JPS 1917
    original: אַף־בְּרִי יַטְרִיחַ עָב יָפִיץ עֲנַן אוֹרוֹ׃
    hebrewPlain: אף ברי יטריח עב יפיץ ענן אורו
    kjvRefs:
    - Job 37:11
    kjvOsis:
    - Job.37.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.12
    scripture: tanakh
    name: Tanakh Job 37:12
    ref: Job 37:12
    book: Job
    section: ketuvim
    chapter: 37
    verse: 12
    ordinal: 19496
    text: 'And they are turned round about by His guidance, That they may do whatsoever He commandeth them Upon the face of the habitable world:'
    translation: JPS 1917
    original: וְהוּא מְסִבּוֹת מִתְהַפֵּךְ בתחבולתו [בְּתַחְבּוּלֹתָיו] לְפָעֳלָם כֹּל אֲשֶׁר יְצַוֵּם עַל־פְּנֵי תֵבֵל אָרְצָה׃
    hebrewPlain: והוא מסבות מתהפך בתחבולתו [בתחבולתיו] לפעלם כל אשר יצום על פני תבל ארצה
    kjvRefs:
    - Job 37:12
    kjvOsis:
    - Job.37.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.13
    scripture: tanakh
    name: Tanakh Job 37:13
    ref: Job 37:13
    book: Job
    section: ketuvim
    chapter: 37
    verse: 13
    ordinal: 19497
    text: Whether it be for correction, or for His earth, Or for mercy, that He cause it to come.
    translation: JPS 1917
    original: אִם־לְשֵׁבֶט אִם־לְאַרְצוֹ אִם־לְחֶסֶד יַמְצִאֵהוּ׃
    hebrewPlain: אם לשבט אם לארצו אם לחסד ימצאהו
    kjvRefs:
    - Job 37:13
    kjvOsis:
    - Job.37.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.14
    scripture: tanakh
    name: Tanakh Job 37:14
    ref: Job 37:14
    book: Job
    section: ketuvim
    chapter: 37
    verse: 14
    ordinal: 19498
    text: Hearken unto this, O Job; Stand still, and consider the wondrous works of God.
    translation: JPS 1917
    original: הַאֲזִינָה זֹּאת אִיּוֹב עֲמֹד וְהִתְבּוֹנֵן נִפְלְאוֹת אֵל׃
    hebrewPlain: האזינה זאת איוב עמד והתבונן נפלאות אל
    kjvRefs:
    - Job 37:14
    kjvOsis:
    - Job.37.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.15
    scripture: tanakh
    name: Tanakh Job 37:15
    ref: Job 37:15
    book: Job
    section: ketuvim
    chapter: 37
    verse: 15
    ordinal: 19499
    text: Dost thou know how God enjoineth them, And causeth the lightning of His cloud to shine?
    translation: JPS 1917
    original: הֲתֵדַע בְּשׂוּם־אֱלוֹהַּ עֲלֵיהֶם וְהוֹפִיעַ אוֹר עֲנָנוֹ׃
    hebrewPlain: התדע בשום אלוה עליהם והופיע אור עננו
    kjvRefs:
    - Job 37:15
    kjvOsis:
    - Job.37.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.16
    scripture: tanakh
    name: Tanakh Job 37:16
    ref: Job 37:16
    book: Job
    section: ketuvim
    chapter: 37
    verse: 16
    ordinal: 19500
    text: Dost thou know the balancings of the clouds, The wondrous works of Him who is perfect in knowledge?
    translation: JPS 1917
    original: הֲתֵדַע עַל־מִפְלְשֵׂי־עָב מִפְלְאוֹת תְּמִים דֵּעִים׃
    hebrewPlain: התדע על מפלשי עב מפלאות תמים דעים
    kjvRefs:
    - Job 37:16
    kjvOsis:
    - Job.37.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.17
    scripture: tanakh
    name: Tanakh Job 37:17
    ref: Job 37:17
    book: Job
    section: ketuvim
    chapter: 37
    verse: 17
    ordinal: 19501
    text: Thou whose garments are warm, When the earth is still by reason of the south wind;
    translation: JPS 1917
    original: אֲשֶׁר־בְּגָדֶיךָ חַמִּים בְּהַשְׁקִט אֶרֶץ מִדָּרוֹם׃
    hebrewPlain: אשר בגדיך חמים בהשקט ארץ מדרום
    kjvRefs:
    - Job 37:17
    kjvOsis:
    - Job.37.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.18
    scripture: tanakh
    name: Tanakh Job 37:18
    ref: Job 37:18
    book: Job
    section: ketuvim
    chapter: 37
    verse: 18
    ordinal: 19502
    text: Canst thou with Him spread out the sky, Which is strong as a molten mirror?
    translation: JPS 1917
    original: תַּרְקִיעַ עִמּוֹ לִשְׁחָקִים חֲזָקִים כִּרְאִי מוּצָק׃
    hebrewPlain: תרקיע עמו לשחקים חזקים כראי מוצק
    kjvRefs:
    - Job 37:18
    kjvOsis:
    - Job.37.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.19
    scripture: tanakh
    name: Tanakh Job 37:19
    ref: Job 37:19
    book: Job
    section: ketuvim
    chapter: 37
    verse: 19
    ordinal: 19503
    text: Teach us what we shall say unto Him; For we cannot order our speech by reason of darkness.
    translation: JPS 1917
    original: הוֹדִיעֵנוּ מַה־נֹּאמַר לוֹ לֹא־נַעֲרֹךְ מִפְּנֵי־חֹשֶׁךְ׃
    hebrewPlain: הודיענו מה נאמר לו לא נערך מפני חשך
    kjvRefs:
    - Job 37:19
    kjvOsis:
    - Job.37.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.20
    scripture: tanakh
    name: Tanakh Job 37:20
    ref: Job 37:20
    book: Job
    section: ketuvim
    chapter: 37
    verse: 20
    ordinal: 19504
    text: Shall it be told Him that I would speak? Or should a man wish that he were swallowed up?
    translation: JPS 1917
    original: הַיְסֻפַּר־לוֹ כִּי אֲדַבֵּר אִם־אָמַר אִישׁ כִּי יְבֻלָּע׃
    hebrewPlain: היספר לו כי אדבר אם אמר איש כי יבלע
    kjvRefs:
    - Job 37:20
    kjvOsis:
    - Job.37.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.21
    scripture: tanakh
    name: Tanakh Job 37:21
    ref: Job 37:21
    book: Job
    section: ketuvim
    chapter: 37
    verse: 21
    ordinal: 19505
    text: And now men see not the light which is bright in the skies; But the wind passeth, and cleanseth them.
    translation: JPS 1917
    original: וְעַתָּה לֹא רָאוּ אוֹר בָּהִיר הוּא בַּשְּׁחָקִים וְרוּחַ עָבְרָה וַתְּטַהֲרֵם׃
    hebrewPlain: ועתה לא ראו אור בהיר הוא בשחקים ורוח עברה ותטהרם
    kjvRefs:
    - Job 37:21
    kjvOsis:
    - Job.37.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.22
    scripture: tanakh
    name: Tanakh Job 37:22
    ref: Job 37:22
    book: Job
    section: ketuvim
    chapter: 37
    verse: 22
    ordinal: 19506
    text: Out of the north cometh golden splendour, About God is terrible majesty.
    translation: JPS 1917
    original: מִצָּפוֹן זָהָב יֶאֱתֶה עַל־אֱלוֹהַּ נוֹרָא הוֹד׃
    hebrewPlain: מצפון זהב יאתה על אלוה נורא הוד
    kjvRefs:
    - Job 37:22
    kjvOsis:
    - Job.37.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.23
    scripture: tanakh
    name: Tanakh Job 37:23
    ref: Job 37:23
    book: Job
    section: ketuvim
    chapter: 37
    verse: 23
    ordinal: 19507
    text: The Almighty, whom we cannot find out, is excellent in power, Yet to judgment and plenteous justice He doeth no violence.
    translation: JPS 1917
    original: שַׁדַּי לֹא־מְצָאנֻהוּ שַׂגִּיא־כֹחַ וּמִשְׁפָּט וְרֹב־צְדָקָה לֹא יְעַנֶּה׃
    hebrewPlain: שדי לא מצאנהו שגיא כח ומשפט ורב צדקה לא יענה
    kjvRefs:
    - Job 37:23
    kjvOsis:
    - Job.37.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.37.24
    scripture: tanakh
    name: Tanakh Job 37:24
    ref: Job 37:24
    book: Job
    section: ketuvim
    chapter: 37
    verse: 24
    ordinal: 19508
    text: Men do therefore fear Him; He regardeth not any that are wise of heart.
    translation: JPS 1917
    original: לָכֵן יְרֵאוּהוּ אֲנָשִׁים לֹא־יִרְאֶה כָּל־חַכְמֵי־לֵב׃
    hebrewPlain: לכן יראוהו אנשים לא יראה כל חכמי לב
    kjvRefs:
    - Job 37:24
    kjvOsis:
    - Job.37.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.37
- type: TanakhVerse
  data:
    osis: Job.38.1
    scripture: tanakh
    name: Tanakh Job 38:1
    ref: Job 38:1
    book: Job
    section: ketuvim
    chapter: 38
    verse: 1
    ordinal: 19509
    text: 'Then the LORD answered Job out of the whirlwind, and said:'
    translation: JPS 1917
    original: וַיַּעַן־יְהוָה אֶת־אִיּוֹב מנ הסערה [מִן ] [הַסְּעָרָה] וַיֹּאמַר׃
    hebrewPlain: ויען יהוה את איוב מנ הסערה [מן ] [הסערה] ויאמר
    kjvRefs:
    - Job 38:1
    kjvOsis:
    - Job.38.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.2
    scripture: tanakh
    name: Tanakh Job 38:2
    ref: Job 38:2
    book: Job
    section: ketuvim
    chapter: 38
    verse: 2
    ordinal: 19510
    text: Who is this that darkeneth counsel By words without knowledge?
    translation: JPS 1917
    original: מִי זֶה מַחְשִׁיךְ עֵצָה בְמִלִּין בְּלִי־דָעַת׃
    hebrewPlain: מי זה מחשיך עצה במלין בלי דעת
    kjvRefs:
    - Job 38:2
    kjvOsis:
    - Job.38.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.3
    scripture: tanakh
    name: Tanakh Job 38:3
    ref: Job 38:3
    book: Job
    section: ketuvim
    chapter: 38
    verse: 3
    ordinal: 19511
    text: Gird up now thy loins like a man; For I will demand of thee, and declare thou unto Me.
    translation: JPS 1917
    original: אֱזָר־נָא כְגֶבֶר חֲלָצֶיךָ וְאֶשְׁאָלְךָ וְהוֹדִיעֵנִי׃
    hebrewPlain: אזר נא כגבר חלציך ואשאלך והודיעני
    kjvRefs:
    - Job 38:3
    kjvOsis:
    - Job.38.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.4
    scripture: tanakh
    name: Tanakh Job 38:4
    ref: Job 38:4
    book: Job
    section: ketuvim
    chapter: 38
    verse: 4
    ordinal: 19512
    text: Where wast thou when I laid the foundations of the earth? Declare, if thou hast the understanding.
    translation: JPS 1917
    original: אֵיפֹה הָיִיתָ בְּיָסְדִי־אָרֶץ הַגֵּד אִם־יָדַעְתָּ בִינָה׃
    hebrewPlain: איפה היית ביסדי ארץ הגד אם ידעת בינה
    kjvRefs:
    - Job 38:4
    kjvOsis:
    - Job.38.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.5
    scripture: tanakh
    name: Tanakh Job 38:5
    ref: Job 38:5
    book: Job
    section: ketuvim
    chapter: 38
    verse: 5
    ordinal: 19513
    text: Who determined the measures thereof, if thou knowest? Or who stretched the line upon it?
    translation: JPS 1917
    original: מִי־שָׂם מְמַדֶּיהָ כִּי תֵדָע אוֹ מִי־נָטָה עָלֶיהָ קָּו׃
    hebrewPlain: מי שם ממדיה כי תדע או מי נטה עליה קו
    kjvRefs:
    - Job 38:5
    kjvOsis:
    - Job.38.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.6
    scripture: tanakh
    name: Tanakh Job 38:6
    ref: Job 38:6
    book: Job
    section: ketuvim
    chapter: 38
    verse: 6
    ordinal: 19514
    text: Whereupon were the foundations thereof fastened? Or who laid the corner-stone thereof,
    translation: JPS 1917
    original: עַל־מָה אֲדָנֶיהָ הָטְבָּעוּ אוֹ מִי־יָרָה אֶבֶן פִּנָּתָהּ׃
    hebrewPlain: על מה אדניה הטבעו או מי ירה אבן פנתה
    kjvRefs:
    - Job 38:6
    kjvOsis:
    - Job.38.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.7
    scripture: tanakh
    name: Tanakh Job 38:7
    ref: Job 38:7
    book: Job
    section: ketuvim
    chapter: 38
    verse: 7
    ordinal: 19515
    text: When the morning stars sang together, And all the sons of God shouted for joy?
    translation: JPS 1917
    original: בְּרָן־יַחַד כּוֹכְבֵי בֹקֶר וַיָּרִיעוּ כָּל־בְּנֵי אֱלֹהִים׃
    hebrewPlain: ברן יחד כוכבי בקר ויריעו כל בני אלהים
    kjvRefs:
    - Job 38:7
    kjvOsis:
    - Job.38.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.8
    scripture: tanakh
    name: Tanakh Job 38:8
    ref: Job 38:8
    book: Job
    section: ketuvim
    chapter: 38
    verse: 8
    ordinal: 19516
    text: Or who shut up the sea with doors, When it broke forth, and issued out of the womb;
    translation: JPS 1917
    original: וַיָּסֶךְ בִּדְלָתַיִם יָם בְּגִיחוֹ מֵרֶחֶם יֵצֵא׃
    hebrewPlain: ויסך בדלתים ים בגיחו מרחם יצא
    kjvRefs:
    - Job 38:8
    kjvOsis:
    - Job.38.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.9
    scripture: tanakh
    name: Tanakh Job 38:9
    ref: Job 38:9
    book: Job
    section: ketuvim
    chapter: 38
    verse: 9
    ordinal: 19517
    text: When I made the cloud the garment thereof, And thick darkness a swaddlingband for it,
    translation: JPS 1917
    original: בְּשׂוּמִי עָנָן לְבֻשׁוֹ וַעֲרָפֶל חֲתֻלָּתוֹ׃
    hebrewPlain: בשומי ענן לבשו וערפל חתלתו
    kjvRefs:
    - Job 38:9
    kjvOsis:
    - Job.38.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.10
    scripture: tanakh
    name: Tanakh Job 38:10
    ref: Job 38:10
    book: Job
    section: ketuvim
    chapter: 38
    verse: 10
    ordinal: 19518
    text: And prescribed for it My decree, And set bars and doors,
    translation: JPS 1917
    original: וָאֶשְׁבֹּר עָלָיו חֻקִּי וָאָשִׂים בְּרִיחַ וּדְלָתָיִם׃
    hebrewPlain: ואשבר עליו חקי ואשים בריח ודלתים
    kjvRefs:
    - Job 38:10
    kjvOsis:
    - Job.38.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.11
    scripture: tanakh
    name: Tanakh Job 38:11
    ref: Job 38:11
    book: Job
    section: ketuvim
    chapter: 38
    verse: 11
    ordinal: 19519
    text: 'And said: ‘Thus far shalt thou come, but no further; And here shall thy proud waves be stayed’?'
    translation: JPS 1917
    original: וָאֹמַר עַד־פֹּה תָבוֹא וְלֹא תֹסִיף וּפֹא־יָשִׁית בִּגְאוֹן גַּלֶּיךָ׃
    hebrewPlain: ואמר עד פה תבוא ולא תסיף ופא ישית בגאון גליך
    kjvRefs:
    - Job 38:11
    kjvOsis:
    - Job.38.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.12
    scripture: tanakh
    name: Tanakh Job 38:12
    ref: Job 38:12
    book: Job
    section: ketuvim
    chapter: 38
    verse: 12
    ordinal: 19520
    text: Hast thou commanded the morning since thy days began, And caused the dayspring to know its place;
    translation: JPS 1917
    original: הְמִיָּמֶיךָ צִוִּיתָ בֹּקֶר ידעתה שחר [יִדַּעְתָּה] [הַשַּׁחַר] מְקֹמוֹ׃
    hebrewPlain: המימיך צוית בקר ידעתה שחר [ידעתה] [השחר] מקמו
    kjvRefs:
    - Job 38:12
    kjvOsis:
    - Job.38.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.13
    scripture: tanakh
    name: Tanakh Job 38:13
    ref: Job 38:13
    book: Job
    section: ketuvim
    chapter: 38
    verse: 13
    ordinal: 19521
    text: That it might take hold of the ends of the earth, And the wicked be shaken out of it?
    translation: JPS 1917
    original: לֶאֱחֹז בְּכַנְפוֹת הָאָרֶץ וְיִנָּעֲרוּ רְשָׁעִים מִמֶּנָּה׃
    hebrewPlain: לאחז בכנפות הארץ וינערו רשעים ממנה
    kjvRefs:
    - Job 38:13
    kjvOsis:
    - Job.38.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.14
    scripture: tanakh
    name: Tanakh Job 38:14
    ref: Job 38:14
    book: Job
    section: ketuvim
    chapter: 38
    verse: 14
    ordinal: 19522
    text: It is changed as clay under the seal; And they stand as a garment.
    translation: JPS 1917
    original: תִּתְהַפֵּךְ כְּחֹמֶר חוֹתָם וְיִתְיַצְּבוּ כְּמוֹ לְבוּשׁ׃
    hebrewPlain: תתהפך כחמר חותם ויתיצבו כמו לבוש
    kjvRefs:
    - Job 38:14
    kjvOsis:
    - Job.38.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.15
    scripture: tanakh
    name: Tanakh Job 38:15
    ref: Job 38:15
    book: Job
    section: ketuvim
    chapter: 38
    verse: 15
    ordinal: 19523
    text: But from the wicked their light is withholden, And the high arm is broken.
    translation: JPS 1917
    original: וְיִמָּנַע מֵרְשָׁעִים אוֹרָם וּזְרוֹעַ רָמָה תִּשָּׁבֵר׃
    hebrewPlain: וימנע מרשעים אורם וזרוע רמה תשבר
    kjvRefs:
    - Job 38:15
    kjvOsis:
    - Job.38.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.16
    scripture: tanakh
    name: Tanakh Job 38:16
    ref: Job 38:16
    book: Job
    section: ketuvim
    chapter: 38
    verse: 16
    ordinal: 19524
    text: Hast thou entered into the springs of the sea? Or hast thou walked in the recesses of the deep? .
    translation: JPS 1917
    original: הֲבָאתָ עַד־נִבְכֵי־יָם וּבְחֵקֶר תְּהוֹם הִתְהַלָּכְתָּ׃
    hebrewPlain: הבאת עד נבכי ים ובחקר תהום התהלכת
    kjvRefs:
    - Job 38:16
    kjvOsis:
    - Job.38.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.17
    scripture: tanakh
    name: Tanakh Job 38:17
    ref: Job 38:17
    book: Job
    section: ketuvim
    chapter: 38
    verse: 17
    ordinal: 19525
    text: Have the gates of death been revealed unto thee? Or hast thou seen the gates of the shadow of death?
    translation: JPS 1917
    original: הֲנִגְלוּ לְךָ שַׁעֲרֵי־מָוֶת וְשַׁעֲרֵי צַלְמָוֶת תִּרְאֶה׃
    hebrewPlain: הנגלו לך שערי מות ושערי צלמות תראה
    kjvRefs:
    - Job 38:17
    kjvOsis:
    - Job.38.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.18
    scripture: tanakh
    name: Tanakh Job 38:18
    ref: Job 38:18
    book: Job
    section: ketuvim
    chapter: 38
    verse: 18
    ordinal: 19526
    text: Hast thou surveyed unto the breadths of the earth? Declare, if thou knowest it all.
    translation: JPS 1917
    original: הִתְבֹּנַנְתָּ עַד־רַחֲבֵי־אָרֶץ הַגֵּד אִם־יָדַעְתָּ כֻלָּהּ׃
    hebrewPlain: התבננת עד רחבי ארץ הגד אם ידעת כלה
    kjvRefs:
    - Job 38:18
    kjvOsis:
    - Job.38.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.19
    scripture: tanakh
    name: Tanakh Job 38:19
    ref: Job 38:19
    book: Job
    section: ketuvim
    chapter: 38
    verse: 19
    ordinal: 19527
    text: Where is the way to the dwelling of light, And as for darkness, where is the place thereof;
    translation: JPS 1917
    original: אֵי־זֶה הַדֶּרֶךְ יִשְׁכָּן־אוֹר וְחֹשֶׁךְ אֵי־זֶה מְקֹמוֹ׃
    hebrewPlain: אי זה הדרך ישכן אור וחשך אי זה מקמו
    kjvRefs:
    - Job 38:19
    kjvOsis:
    - Job.38.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.20
    scripture: tanakh
    name: Tanakh Job 38:20
    ref: Job 38:20
    book: Job
    section: ketuvim
    chapter: 38
    verse: 20
    ordinal: 19528
    text: That thou shouldest take it to the bound thereof, And that thou shouldest know the paths to the house thereof?
    translation: JPS 1917
    original: כִּי תִקָּחֶנּוּ אֶל־גְּבוּלוֹ וְכִי־תָבִין נְתִיבוֹת בֵּיתוֹ׃
    hebrewPlain: כי תקחנו אל גבולו וכי תבין נתיבות ביתו
    kjvRefs:
    - Job 38:20
    kjvOsis:
    - Job.38.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.21
    scripture: tanakh
    name: Tanakh Job 38:21
    ref: Job 38:21
    book: Job
    section: ketuvim
    chapter: 38
    verse: 21
    ordinal: 19529
    text: Thou knowest it, for thou wast then born, And the number of thy days is great!
    translation: JPS 1917
    original: יָדַעְתָּ כִּי־אָז תִּוָּלֵד וּמִסְפַּר יָמֶיךָ רַבִּים׃
    hebrewPlain: ידעת כי אז תולד ומספר ימיך רבים
    kjvRefs:
    - Job 38:21
    kjvOsis:
    - Job.38.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.22
    scripture: tanakh
    name: Tanakh Job 38:22
    ref: Job 38:22
    book: Job
    section: ketuvim
    chapter: 38
    verse: 22
    ordinal: 19530
    text: Hast thou entered the treasuries of the snow, Or hast thou seen the treasuries of the hail,
    translation: JPS 1917
    original: הֲבָאתָ אֶל־אֹצְרוֹת שָׁלֶג וְאֹצְרוֹת בָּרָד תִּרְאֶה׃
    hebrewPlain: הבאת אל אצרות שלג ואצרות ברד תראה
    kjvRefs:
    - Job 38:22
    kjvOsis:
    - Job.38.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.23
    scripture: tanakh
    name: Tanakh Job 38:23
    ref: Job 38:23
    book: Job
    section: ketuvim
    chapter: 38
    verse: 23
    ordinal: 19531
    text: Which I have reserved against the time of trouble, Against the day of battle and war?
    translation: JPS 1917
    original: אֲשֶׁר־חָשַׂכְתִּי לְעֶת־צָר לְיוֹם קְרָב וּמִלְחָמָה׃
    hebrewPlain: אשר חשכתי לעת צר ליום קרב ומלחמה
    kjvRefs:
    - Job 38:23
    kjvOsis:
    - Job.38.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.24
    scripture: tanakh
    name: Tanakh Job 38:24
    ref: Job 38:24
    book: Job
    section: ketuvim
    chapter: 38
    verse: 24
    ordinal: 19532
    text: By what way is the light parted, Or the east wind scattered upon the earth?
    translation: JPS 1917
    original: אֵי־זֶה הַדֶּרֶךְ יֵחָלֶק אוֹר יָפֵץ קָדִים עֲלֵי־אָרֶץ׃
    hebrewPlain: אי זה הדרך יחלק אור יפץ קדים עלי ארץ
    kjvRefs:
    - Job 38:24
    kjvOsis:
    - Job.38.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.25
    scripture: tanakh
    name: Tanakh Job 38:25
    ref: Job 38:25
    book: Job
    section: ketuvim
    chapter: 38
    verse: 25
    ordinal: 19533
    text: Who hath cleft a channel for the waterflood, Or a way for the lightning of the thunder;
    translation: JPS 1917
    original: מִי־פִלַּג לַשֶּׁטֶף תְּעָלָה וְדֶרֶךְ לַחֲזִיז קֹלוֹת׃
    hebrewPlain: מי פלג לשטף תעלה ודרך לחזיז קלות
    kjvRefs:
    - Job 38:25
    kjvOsis:
    - Job.38.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.26
    scripture: tanakh
    name: Tanakh Job 38:26
    ref: Job 38:26
    book: Job
    section: ketuvim
    chapter: 38
    verse: 26
    ordinal: 19534
    text: To cause it to rain on a land where no man is, On the wilderness, wherein there is no man;
    translation: JPS 1917
    original: לְהַמְטִיר עַל־אֶרֶץ לֹא־אִישׁ מִדְבָּר לֹא־אָדָם בּוֹ׃
    hebrewPlain: להמטיר על ארץ לא איש מדבר לא אדם בו
    kjvRefs:
    - Job 38:26
    kjvOsis:
    - Job.38.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.27
    scripture: tanakh
    name: Tanakh Job 38:27
    ref: Job 38:27
    book: Job
    section: ketuvim
    chapter: 38
    verse: 27
    ordinal: 19535
    text: To satisfy the desolate and waste ground, And to cause the bud of the tender herb to spring forth?
    translation: JPS 1917
    original: לְהַשְׂבִּיעַ שֹׁאָה וּמְשֹׁאָה וּלְהַצְמִיחַ מֹצָא דֶשֶׁא׃
    hebrewPlain: להשביע שאה ומשאה ולהצמיח מצא דשא
    kjvRefs:
    - Job 38:27
    kjvOsis:
    - Job.38.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.28
    scripture: tanakh
    name: Tanakh Job 38:28
    ref: Job 38:28
    book: Job
    section: ketuvim
    chapter: 38
    verse: 28
    ordinal: 19536
    text: Hath the rain a father? Or who hath begotten the drops of dew?
    translation: JPS 1917
    original: הֲיֵשׁ־לַמָּטָר אָב אוֹ מִי־הוֹלִיד אֶגְלֵי־טָל׃
    hebrewPlain: היש למטר אב או מי הוליד אגלי טל
    kjvRefs:
    - Job 38:28
    kjvOsis:
    - Job.38.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.29
    scripture: tanakh
    name: Tanakh Job 38:29
    ref: Job 38:29
    book: Job
    section: ketuvim
    chapter: 38
    verse: 29
    ordinal: 19537
    text: Out of whose womb came the ice? And the hoar-frost of heaven, who hath gendered it?
    translation: JPS 1917
    original: מִבֶּטֶן מִי יָצָא הַקָּרַח וּכְפֹר שָׁמַיִם מִי יְלָדוֹ׃
    hebrewPlain: מבטן מי יצא הקרח וכפר שמים מי ילדו
    kjvRefs:
    - Job 38:29
    kjvOsis:
    - Job.38.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.30
    scripture: tanakh
    name: Tanakh Job 38:30
    ref: Job 38:30
    book: Job
    section: ketuvim
    chapter: 38
    verse: 30
    ordinal: 19538
    text: The waters are congealed like stone, And the face of the deep is frozen.
    translation: JPS 1917
    original: כָּאֶבֶן מַיִם יִתְחַבָּאוּ וּפְנֵי תְהוֹם יִתְלַכָּדוּ׃
    hebrewPlain: כאבן מים יתחבאו ופני תהום יתלכדו
    kjvRefs:
    - Job 38:30
    kjvOsis:
    - Job.38.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.31
    scripture: tanakh
    name: Tanakh Job 38:31
    ref: Job 38:31
    book: Job
    section: ketuvim
    chapter: 38
    verse: 31
    ordinal: 19539
    text: Canst thou bind the chains of the Pleiades, Or loose the bands of Orion?
    translation: JPS 1917
    original: הַתְקַשֵּׁר מַעֲדַנּוֹת כִּימָה אוֹ־מֹשְׁכוֹת כְּסִיל תְּפַתֵּחַ׃
    hebrewPlain: התקשר מעדנות כימה או משכות כסיל תפתח
    kjvRefs:
    - Job 38:31
    kjvOsis:
    - Job.38.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.32
    scripture: tanakh
    name: Tanakh Job 38:32
    ref: Job 38:32
    book: Job
    section: ketuvim
    chapter: 38
    verse: 32
    ordinal: 19540
    text: Canst thou lead forth the Mazzaroth in their season? Or canst thou guide the Bear with her sons?
    translation: JPS 1917
    original: הֲתֹצִיא מַזָּרוֹת בְּעִתּוֹ וְעַיִשׁ עַל־בָּנֶיהָ תַנְחֵם׃
    hebrewPlain: התציא מזרות בעתו ועיש על בניה תנחם
    kjvRefs:
    - Job 38:32
    kjvOsis:
    - Job.38.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.33
    scripture: tanakh
    name: Tanakh Job 38:33
    ref: Job 38:33
    book: Job
    section: ketuvim
    chapter: 38
    verse: 33
    ordinal: 19541
    text: Knowest thou the ordinances of the heavens? Canst thou establish the dominion thereof in the earth?
    translation: JPS 1917
    original: הֲיָדַעְתָּ חֻקּוֹת שָׁמָיִם אִם־תָּשִׂים מִשְׁטָרוֹ בָאָרֶץ׃
    hebrewPlain: הידעת חקות שמים אם תשים משטרו בארץ
    kjvRefs:
    - Job 38:33
    kjvOsis:
    - Job.38.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.34
    scripture: tanakh
    name: Tanakh Job 38:34
    ref: Job 38:34
    book: Job
    section: ketuvim
    chapter: 38
    verse: 34
    ordinal: 19542
    text: Canst thou lift up thy voice to the clouds, That abundance of waters may cover thee?
    translation: JPS 1917
    original: הֲתָרִים לָעָב קוֹלֶךָ וְשִׁפְעַת־מַיִם תְּכַסֶּךָּ׃
    hebrewPlain: התרים לעב קולך ושפעת מים תכסך
    kjvRefs:
    - Job 38:34
    kjvOsis:
    - Job.38.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.35
    scripture: tanakh
    name: Tanakh Job 38:35
    ref: Job 38:35
    book: Job
    section: ketuvim
    chapter: 38
    verse: 35
    ordinal: 19543
    text: 'Canst thou send forth lightnings, that they may go, And say unto thee: ‘Here we are’?'
    translation: JPS 1917
    original: הַתְשַׁלַּח בְּרָקִים וְיֵלֵכוּ וְיֹאמְרוּ לְךָ הִנֵּנוּ׃
    hebrewPlain: התשלח ברקים וילכו ויאמרו לך הננו
    kjvRefs:
    - Job 38:35
    kjvOsis:
    - Job.38.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.36
    scripture: tanakh
    name: Tanakh Job 38:36
    ref: Job 38:36
    book: Job
    section: ketuvim
    chapter: 38
    verse: 36
    ordinal: 19544
    text: Who hath put wisdom in the inward parts? Or who hath given understanding to the mind?
    translation: JPS 1917
    original: מִי־שָׁת בַּטֻּחוֹת חָכְמָה אוֹ מִי־נָתַן לַשֶּׂכְוִי בִינָה׃
    hebrewPlain: מי שת בטחות חכמה או מי נתן לשכוי בינה
    kjvRefs:
    - Job 38:36
    kjvOsis:
    - Job.38.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.37
    scripture: tanakh
    name: Tanakh Job 38:37
    ref: Job 38:37
    book: Job
    section: ketuvim
    chapter: 38
    verse: 37
    ordinal: 19545
    text: Who can number the clouds by wisdom? Or who can pour out the bottles of heaven,
    translation: JPS 1917
    original: מִי־יְסַפֵּר שְׁחָקִים בְּחָכְמָה וְנִבְלֵי שָׁמַיִם מִי יַשְׁכִּיב׃
    hebrewPlain: מי יספר שחקים בחכמה ונבלי שמים מי ישכיב
    kjvRefs:
    - Job 38:37
    kjvOsis:
    - Job.38.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.38
    scripture: tanakh
    name: Tanakh Job 38:38
    ref: Job 38:38
    book: Job
    section: ketuvim
    chapter: 38
    verse: 38
    ordinal: 19546
    text: When the dust runneth into a mass, And the clods cleave fast together?
    translation: JPS 1917
    original: בְּצֶקֶת עָפָר לַמּוּצָק וּרְגָבִים יְדֻבָּקוּ׃
    hebrewPlain: בצקת עפר למוצק ורגבים ידבקו
    kjvRefs:
    - Job 38:38
    kjvOsis:
    - Job.38.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.39
    scripture: tanakh
    name: Tanakh Job 38:39
    ref: Job 38:39
    book: Job
    section: ketuvim
    chapter: 38
    verse: 39
    ordinal: 19547
    text: Wilt thou hunt the prey for the lioness? Or satisfy the appetite of the young lions,
    translation: JPS 1917
    original: הֲתָצוּד לְלָבִיא טָרֶף וְחַיַּת כְּפִירִים תְּמַלֵּא׃
    hebrewPlain: התצוד ללביא טרף וחית כפירים תמלא
    kjvRefs:
    - Job 38:39
    kjvOsis:
    - Job.38.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.40
    scripture: tanakh
    name: Tanakh Job 38:40
    ref: Job 38:40
    book: Job
    section: ketuvim
    chapter: 38
    verse: 40
    ordinal: 19548
    text: When they couch in their dens, And abide in the covert to lie in wait?
    translation: JPS 1917
    original: כִּי־יָשֹׁחוּ בַמְּעוֹנוֹת יֵשְׁבוּ בַסֻּכָּה לְמוֹ־אָרֶב׃
    hebrewPlain: כי ישחו במעונות ישבו בסכה למו ארב
    kjvRefs:
    - Job 38:40
    kjvOsis:
    - Job.38.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.38.41
    scripture: tanakh
    name: Tanakh Job 38:41
    ref: Job 38:41
    book: Job
    section: ketuvim
    chapter: 38
    verse: 41
    ordinal: 19549
    text: Who provideth for the raven his prey, When his young ones cry unto God, and wander for lack of food?
    translation: JPS 1917
    original: מִי יָכִין לָעֹרֵב צֵידוֹ כִּי־ילדו [יְלָדָיו] אֶל־אֵל יְשַׁוֵּעוּ יִתְעוּ לִבְלִי־אֹכֶל׃
    hebrewPlain: מי יכין לערב צידו כי ילדו [ילדיו] אל אל ישועו יתעו לבלי אכל
    kjvRefs:
    - Job 38:41
    kjvOsis:
    - Job.38.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.38
- type: TanakhVerse
  data:
    osis: Job.39.1
    scripture: tanakh
    name: Tanakh Job 39:1
    ref: Job 39:1
    book: Job
    section: ketuvim
    chapter: 39
    verse: 1
    ordinal: 19550
    text: Knowest thou the time when the wild goats of the rock bring forth? Or canst thou mark when the hinds do calve?
    translation: JPS 1917
    original: הֲיָדַעְתָּ עֵת לֶדֶת יַעֲלֵי־סָלַע חֹלֵל אַיָּלוֹת תִּשְׁמֹר׃
    hebrewPlain: הידעת עת לדת יעלי סלע חלל אילות תשמר
    kjvRefs:
    - Job 39:1
    kjvOsis:
    - Job.39.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.2
    scripture: tanakh
    name: Tanakh Job 39:2
    ref: Job 39:2
    book: Job
    section: ketuvim
    chapter: 39
    verse: 2
    ordinal: 19551
    text: Canst thou number the months that they fulfil? Or knowest thou the time when they bring forth?
    translation: JPS 1917
    original: תִּסְפֹּר יְרָחִים תְּמַלֶּאנָה וְיָדַעְתָּ עֵת לִדְתָּנָה׃
    hebrewPlain: תספר ירחים תמלאנה וידעת עת לדתנה
    kjvRefs:
    - Job 39:2
    kjvOsis:
    - Job.39.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.3
    scripture: tanakh
    name: Tanakh Job 39:3
    ref: Job 39:3
    book: Job
    section: ketuvim
    chapter: 39
    verse: 3
    ordinal: 19552
    text: They bow themselves, they bring forth their young, They cast out their fruit.
    translation: JPS 1917
    original: תִּכְרַעְנָה יַלְדֵיהֶן תְּפַלַּחְנָה חֶבְלֵיהֶם תְּשַׁלַּחְנָה׃
    hebrewPlain: תכרענה ילדיהן תפלחנה חבליהם תשלחנה
    kjvRefs:
    - Job 39:3
    kjvOsis:
    - Job.39.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.4
    scripture: tanakh
    name: Tanakh Job 39:4
    ref: Job 39:4
    book: Job
    section: ketuvim
    chapter: 39
    verse: 4
    ordinal: 19553
    text: Their young ones wax strong, they grow up in the open field; They go forth, and return not again.
    translation: JPS 1917
    original: יַחְלְמוּ בְנֵיהֶם יִרְבּוּ בַבָּר יָצְאוּ וְלֹא־שָׁבוּ לָמוֹ׃
    hebrewPlain: יחלמו בניהם ירבו בבר יצאו ולא שבו למו
    kjvRefs:
    - Job 39:4
    kjvOsis:
    - Job.39.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.5
    scripture: tanakh
    name: Tanakh Job 39:5
    ref: Job 39:5
    book: Job
    section: ketuvim
    chapter: 39
    verse: 5
    ordinal: 19554
    text: Who hath sent out the wild ass free? Or who hath loosed the bands of the wild ass?
    translation: JPS 1917
    original: מִי־שִׁלַּח פֶּרֶא חָפְשִׁי וּמֹסְרוֹת עָרוֹד מִי פִתֵּחַ׃
    hebrewPlain: מי שלח פרא חפשי ומסרות ערוד מי פתח
    kjvRefs:
    - Job 39:5
    kjvOsis:
    - Job.39.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.6
    scripture: tanakh
    name: Tanakh Job 39:6
    ref: Job 39:6
    book: Job
    section: ketuvim
    chapter: 39
    verse: 6
    ordinal: 19555
    text: Whose house I have made the wilderness, And the salt land his dwelling-place.
    translation: JPS 1917
    original: אֲשֶׁר־שַׂמְתִּי עֲרָבָה בֵיתוֹ וּמִשְׁכְּנוֹתָיו מְלֵחָה׃
    hebrewPlain: אשר שמתי ערבה ביתו ומשכנותיו מלחה
    kjvRefs:
    - Job 39:6
    kjvOsis:
    - Job.39.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.7
    scripture: tanakh
    name: Tanakh Job 39:7
    ref: Job 39:7
    book: Job
    section: ketuvim
    chapter: 39
    verse: 7
    ordinal: 19556
    text: He scorneth the tumult of the city, Neither heareth he the shoutings of the driver.
    translation: JPS 1917
    original: יִשְׂחַק לַהֲמוֹן קִרְיָה תְּשֻׁאוֹת נוֹגֵשׂ לֹא יִשְׁמָע׃
    hebrewPlain: ישחק להמון קריה תשאות נוגש לא ישמע
    kjvRefs:
    - Job 39:7
    kjvOsis:
    - Job.39.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.8
    scripture: tanakh
    name: Tanakh Job 39:8
    ref: Job 39:8
    book: Job
    section: ketuvim
    chapter: 39
    verse: 8
    ordinal: 19557
    text: The range of the mountains is his pasture, And he searcheth after every green thing.
    translation: JPS 1917
    original: יְתוּר הָרִים מִרְעֵהוּ וְאַחַר כָּל־יָרוֹק יִדְרוֹשׁ׃
    hebrewPlain: יתור הרים מרעהו ואחר כל ירוק ידרוש
    kjvRefs:
    - Job 39:8
    kjvOsis:
    - Job.39.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.9
    scripture: tanakh
    name: Tanakh Job 39:9
    ref: Job 39:9
    book: Job
    section: ketuvim
    chapter: 39
    verse: 9
    ordinal: 19558
    text: Will the wild-ox be willing to serve thee? Or will he abide by thy crib?
    translation: JPS 1917
    original: הֲיֹאבֶה רֵּים עָבְדֶךָ אִם־יָלִין עַל־אֲבוּסֶךָ׃
    hebrewPlain: היאבה רים עבדך אם ילין על אבוסך
    kjvRefs:
    - Job 39:9
    kjvOsis:
    - Job.39.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.10
    scripture: tanakh
    name: Tanakh Job 39:10
    ref: Job 39:10
    book: Job
    section: ketuvim
    chapter: 39
    verse: 10
    ordinal: 19559
    text: Canst thou bind the wild-ox with his band in the furrow? Or will he harrow the valleys after thee?
    translation: JPS 1917
    original: הֲ‍תִקְשָׁר־רֵים בְּתֶלֶם עֲבֹתוֹ אִם־יְשַׂדֵּד עֲמָקִים אַחֲרֶיךָ׃
    hebrewPlain: ה‍תקשר רים בתלם עבתו אם ישדד עמקים אחריך
    kjvRefs:
    - Job 39:10
    kjvOsis:
    - Job.39.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.11
    scripture: tanakh
    name: Tanakh Job 39:11
    ref: Job 39:11
    book: Job
    section: ketuvim
    chapter: 39
    verse: 11
    ordinal: 19560
    text: Wilt thou trust him, because his strength is great? Or wilt thou leave thy labour to him?
    translation: JPS 1917
    original: הֲתִבְטַח־בּוֹ כִּי־רַב כֹּחוֹ וְתַעֲזֹב אֵלָיו יְגִיעֶךָ׃
    hebrewPlain: התבטח בו כי רב כחו ותעזב אליו יגיעך
    kjvRefs:
    - Job 39:11
    kjvOsis:
    - Job.39.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.12
    scripture: tanakh
    name: Tanakh Job 39:12
    ref: Job 39:12
    book: Job
    section: ketuvim
    chapter: 39
    verse: 12
    ordinal: 19561
    text: Wilt thou rely on him, that he will bring home thy seed, And gather the corn of thy threshing-floor?
    translation: JPS 1917
    original: הֲתַאֲמִין בּוֹ כִּי־ישוב [יָשִׁיב] זַרְעֶךָ וְגָרְנְךָ יֶאֱסֹף׃
    hebrewPlain: התאמין בו כי ישוב [ישיב] זרעך וגרנך יאסף
    kjvRefs:
    - Job 39:12
    kjvOsis:
    - Job.39.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.13
    scripture: tanakh
    name: Tanakh Job 39:13
    ref: Job 39:13
    book: Job
    section: ketuvim
    chapter: 39
    verse: 13
    ordinal: 19562
    text: The wing of the ostrich beateth joyously; But are her pinions and feathers the kindly stork’s?
    translation: JPS 1917
    original: כְּנַף־רְנָנִים נֶעֱלָסָה אִם־אֶבְרָה חֲסִידָה וְנֹצָה׃
    hebrewPlain: כנף רננים נעלסה אם אברה חסידה ונצה
    kjvRefs:
    - Job 39:13
    kjvOsis:
    - Job.39.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.14
    scripture: tanakh
    name: Tanakh Job 39:14
    ref: Job 39:14
    book: Job
    section: ketuvim
    chapter: 39
    verse: 14
    ordinal: 19563
    text: For she leaveth her eggs on the earth, And warmeth them in dust,
    translation: JPS 1917
    original: כִּי־תַעֲזֹב לָאָרֶץ בֵּצֶיהָ וְעַל־עָפָר תְּחַמֵּם׃
    hebrewPlain: כי תעזב לארץ בציה ועל עפר תחמם
    kjvRefs:
    - Job 39:14
    kjvOsis:
    - Job.39.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.15
    scripture: tanakh
    name: Tanakh Job 39:15
    ref: Job 39:15
    book: Job
    section: ketuvim
    chapter: 39
    verse: 15
    ordinal: 19564
    text: And forgetteth that the foot may crush them, Or that the wild beast may trample them.
    translation: JPS 1917
    original: וַתִּשְׁכַּח כִּי־רֶגֶל תְּזוּרֶהָ וְחַיַּת הַשָּׂדֶה תְּדוּשֶׁהָ׃
    hebrewPlain: ותשכח כי רגל תזורה וחית השדה תדושה
    kjvRefs:
    - Job 39:15
    kjvOsis:
    - Job.39.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.16
    scripture: tanakh
    name: Tanakh Job 39:16
    ref: Job 39:16
    book: Job
    section: ketuvim
    chapter: 39
    verse: 16
    ordinal: 19565
    text: She is hardened against her young ones, as if they were not hers; Though her labour be in vain, she is without fear; .
    translation: JPS 1917
    original: הִקְשִׁיחַ בָּנֶיהָ לְּלֹא־לָהּ לְרִיק יְגִיעָהּ בְּלִי־פָחַד׃
    hebrewPlain: הקשיח בניה ללא לה לריק יגיעה בלי פחד
    kjvRefs:
    - Job 39:16
    kjvOsis:
    - Job.39.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.17
    scripture: tanakh
    name: Tanakh Job 39:17
    ref: Job 39:17
    book: Job
    section: ketuvim
    chapter: 39
    verse: 17
    ordinal: 19566
    text: Because God hath deprived her of wisdom, Neither hath He imparted to her understanding.
    translation: JPS 1917
    original: כִּי־הִשָּׁהּ אֱלוֹהַּ חָכְמָה וְלֹא־חָלַק לָהּ בַּבִּינָה׃
    hebrewPlain: כי השה אלוה חכמה ולא חלק לה בבינה
    kjvRefs:
    - Job 39:17
    kjvOsis:
    - Job.39.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.18
    scripture: tanakh
    name: Tanakh Job 39:18
    ref: Job 39:18
    book: Job
    section: ketuvim
    chapter: 39
    verse: 18
    ordinal: 19567
    text: When the time cometh, she raiseth her wings on high, And scorneth the horse and his rider.
    translation: JPS 1917
    original: כָּעֵת בַּמָּרוֹם תַּמְרִיא תִּשְׂחַק לַסּוּס וּלְרֹכְבוֹ׃
    hebrewPlain: כעת במרום תמריא תשחק לסוס ולרכבו
    kjvRefs:
    - Job 39:18
    kjvOsis:
    - Job.39.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.19
    scripture: tanakh
    name: Tanakh Job 39:19
    ref: Job 39:19
    book: Job
    section: ketuvim
    chapter: 39
    verse: 19
    ordinal: 19568
    text: Hast thou given the horse his strength? Hast thou clothed his neck with fierceness?
    translation: JPS 1917
    original: הֲתִתֵּן לַסּוּס גְּבוּרָה הֲתַלְבִּישׁ צַוָּארוֹ רַעְמָה׃
    hebrewPlain: התתן לסוס גבורה התלביש צוארו רעמה
    kjvRefs:
    - Job 39:19
    kjvOsis:
    - Job.39.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.20
    scripture: tanakh
    name: Tanakh Job 39:20
    ref: Job 39:20
    book: Job
    section: ketuvim
    chapter: 39
    verse: 20
    ordinal: 19569
    text: Hast thou made him to leap as a locust? The glory of his snorting is terrible.
    translation: JPS 1917
    original: הְתַרְעִישֶׁנּוּ כָּאַרְבֶּה הוֹד נַחְרוֹ אֵימָה׃
    hebrewPlain: התרעישנו כארבה הוד נחרו אימה
    kjvRefs:
    - Job 39:20
    kjvOsis:
    - Job.39.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.21
    scripture: tanakh
    name: Tanakh Job 39:21
    ref: Job 39:21
    book: Job
    section: ketuvim
    chapter: 39
    verse: 21
    ordinal: 19570
    text: He paweth in the valley, and rejoiceth in his strength; He goeth out to meet the clash of arms.
    translation: JPS 1917
    original: יַחְפְּרוּ בָעֵמֶק וְיָשִׂישׂ בְּכֹחַ יֵצֵא לִקְרַאת־נָשֶׁק׃
    hebrewPlain: יחפרו בעמק וישיש בכח יצא לקראת נשק
    kjvRefs:
    - Job 39:21
    kjvOsis:
    - Job.39.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.22
    scripture: tanakh
    name: Tanakh Job 39:22
    ref: Job 39:22
    book: Job
    section: ketuvim
    chapter: 39
    verse: 22
    ordinal: 19571
    text: He mocketh at fear, and is not affrighted; Neither turneth he back from the sword.
    translation: JPS 1917
    original: יִשְׂחַק לְפַחַד וְלֹא יֵחָת וְלֹא־יָשׁוּב מִפְּנֵי־חָרֶב׃
    hebrewPlain: ישחק לפחד ולא יחת ולא ישוב מפני חרב
    kjvRefs:
    - Job 39:22
    kjvOsis:
    - Job.39.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.39
- type: TanakhVerse
  data:
    osis: Job.39.23
    scripture: tanakh
    name: Tanakh Job 39:23
    ref: Job 39:23
    book: Job
