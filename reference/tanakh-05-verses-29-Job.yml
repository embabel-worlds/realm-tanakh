    kjvOsis:
    - Job.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.1
- type: TanakhVerse
  data:
    osis: Job.1.11
    scripture: tanakh
    name: Tanakh Job 1:11
    ref: Job 1:11
    book: Job
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 18595
    text: But put forth Thy hand now, and touch all that he hath, surely he will blaspheme Thee to Thy face.’
    translation: JPS 1917
    original: וְאוּלָם שְׁלַח־נָא יָדְךָ וְגַע בְּכָל־אֲשֶׁר־לוֹ אִם־לֹא עַל־פָּנֶיךָ יְבָרֲכֶךָּ׃
    hebrewPlain: ואולם שלח נא ידך וגע בכל אשר לו אם לא על פניך יברכך
    kjvRefs:
