    scripture: tanakh
    name: Tanakh Job 40:24
    ref: Job 40:24
    book: Job
    section: ketuvim
    chapter: 40
    verse: 24
    ordinal: 19603
    text: Shall any take him by his eyes, Or pierce through his nose with a snare?
    translation: JPS 1917
    original: בְּעֵינָיו יִקָּחֶנּוּ בְּמוֹקְשִׁים יִנְקָב־אָף׃
