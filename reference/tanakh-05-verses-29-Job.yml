    book: Job
    section: ketuvim
    chapter: 42
    verse: 15
    ordinal: 19652
    text: And in all the land were no women found so fair as the daughters of Job; and their father gave them inheritance among their brethren.
    translation: JPS 1917
    original: וְלֹא נִמְצָא נָשִׁים יָפוֹת כִּבְנוֹת אִיּוֹב בְּכָל־הָאָרֶץ וַיִּתֵּן לָהֶם אֲבִיהֶם נַחֲלָה בְּתוֹךְ אֲחֵיהֶם׃
    hebrewPlain: ולא נמצא נשים יפות כבנות איוב בכל הארץ ויתן להם אביהם נחלה בתוך אחיהם
    kjvRefs:
