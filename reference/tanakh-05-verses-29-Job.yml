  data:
    osis: Job.13.23
    scripture: tanakh
    name: Tanakh Job 13:23
    ref: Job 13:23
    book: Job
    section: ketuvim
    chapter: 13
    verse: 23
    ordinal: 18891
    text: How many are mine iniquities and sins? Make me to know my transgression and my sin.
    translation: JPS 1917
    original: כַּמָּה לִי עֲוֺנוֹת וְחַטָּאוֹת פִּשְׁעִי וְחַטָּאתִי הֹדִיעֵנִי׃
    hebrewPlain: כמה לי עונות וחטאות פשעי וחטאתי הדיעני
