    scripture: tanakh
    name: Tanakh Job 40:9
    ref: Job 40:9
    book: Job
    section: ketuvim
    chapter: 40
    verse: 9
    ordinal: 19588
    text: Or hast thou an arm like God? And canst thou thunder with a voice like Him?
    translation: JPS 1917
    original: וְאִם־זְרוֹעַ כָּאֵל לָךְ וּבְקוֹל כָּמֹהוּ תַרְעֵם׃
    hebrewPlain: ואם זרוע כאל לך ובקול כמהו תרעם
