  data:
    osis: Job.1.12
    scripture: tanakh
    name: Tanakh Job 1:12
    ref: Job 1:12
    book: Job
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 18596
    text: 'And the LORD said unto Satan: ‘Behold, all that he hath is in thy power; only upon himself put not forth thy hand.’ So Satan went forth from the presence of the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־הַשָּׂטָן הִנֵּה כָל־אֲשֶׁר־לוֹ בְּיָדֶךָ רַק אֵלָיו אַל־תִּשְׁלַח יָדֶךָ וַיֵּצֵא הַשָּׂטָן מֵעִם פְּנֵי יְהוָה׃
    hebrewPlain: ויאמר יהוה אל השטן הנה כל אשר לו בידך רק אליו אל תשלח ידך ויצא השטן מעם פני יהוה
