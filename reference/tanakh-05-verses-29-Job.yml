    to:
      type: TanakhChapter
      osis: Job.3
- type: TanakhVerse
  data:
    osis: Job.4.1
    scripture: tanakh
    name: Tanakh Job 4:1
    ref: Job 4:1
    book: Job
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 18646
    text: 'Then answered Eliphaz the Temanite, and said:'
    translation: JPS 1917
    original: וַיַּעַן אֱלִיפַז הַתֵּימָנִי וַיֹּאמַר׃
    hebrewPlain: ויען אליפז התימני ויאמר
    kjvRefs:
    - Job 4:1
    kjvOsis:
    - Job.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.2
    scripture: tanakh
    name: Tanakh Job 4:2
    ref: Job 4:2
    book: Job
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 18647
    text: If one venture a word unto thee, wilt thou be weary? But who can withhold himself from speaking?
    translation: JPS 1917
    original: הֲנִסָּה דָבָר אֵלֶיךָ תִּלְאֶה וַעְצֹר בְּמִלִּין מִי יוּכָל׃
    hebrewPlain: הנסה דבר אליך תלאה ועצר במלין מי יוכל
    kjvRefs:
    - Job 4:2
    kjvOsis:
    - Job.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.3
    scripture: tanakh
    name: Tanakh Job 4:3
    ref: Job 4:3
    book: Job
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 18648
    text: Behold, thou hast instructed many, And thou hast strengthened the weak hands.
    translation: JPS 1917
    original: הִנֵּה יִסַּרְתָּ רַבִּים וְיָדַיִם רָפוֹת תְּחַזֵּק׃
    hebrewPlain: הנה יסרת רבים וידים רפות תחזק
    kjvRefs:
    - Job 4:3
    kjvOsis:
    - Job.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.4
    scripture: tanakh
    name: Tanakh Job 4:4
    ref: Job 4:4
    book: Job
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 18649
    text: Thy words have upholden him that was falling, And thou hast strengthened the feeble knees.
    translation: JPS 1917
    original: כּוֹשֵׁל יְקִימוּן מִלֶּיךָ וּבִרְכַּיִם כֹּרְעוֹת תְּאַמֵּץ׃
    hebrewPlain: כושל יקימון מליך וברכים כרעות תאמץ
    kjvRefs:
    - Job 4:4
    kjvOsis:
    - Job.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.5
    scripture: tanakh
    name: Tanakh Job 4:5
    ref: Job 4:5
    book: Job
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 18650
    text: But now it is come upon thee, and thou art weary; It toucheth thee, and thou art affrighted.
    translation: JPS 1917
    original: כִּי עַתָּה תָּבוֹא אֵלֶיךָ וַתֵּלֶא תִּגַּע עָדֶיךָ וַתִּבָּהֵל׃
    hebrewPlain: כי עתה תבוא אליך ותלא תגע עדיך ותבהל
    kjvRefs:
    - Job 4:5
    kjvOsis:
    - Job.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.6
    scripture: tanakh
    name: Tanakh Job 4:6
    ref: Job 4:6
    book: Job
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 18651
    text: Is not thy fear of God thy confidence, And thy hope the integrity of thy ways?
    translation: JPS 1917
    original: הֲלֹא יִרְאָתְךָ כִּסְלָתֶךָ תִּקְוָתְךָ וְתֹם דְּרָכֶיךָ׃
    hebrewPlain: הלא יראתך כסלתך תקותך ותם דרכיך
    kjvRefs:
    - Job 4:6
    kjvOsis:
    - Job.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.7
    scripture: tanakh
    name: Tanakh Job 4:7
    ref: Job 4:7
    book: Job
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 18652
    text: Remember, I pray thee, who ever perished, being innocent? Or where were the upright cut off?
    translation: JPS 1917
    original: זְכָר־נָא מִי הוּא נָקִי אָבָד וְאֵיפֹה יְשָׁרִים נִכְחָדוּ׃
    hebrewPlain: זכר נא מי הוא נקי אבד ואיפה ישרים נכחדו
    kjvRefs:
    - Job 4:7
    kjvOsis:
    - Job.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.8
    scripture: tanakh
    name: Tanakh Job 4:8
    ref: Job 4:8
    book: Job
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 18653
    text: According as I have seen, they that plow iniquity, And sow mischief, reap the same.
    translation: JPS 1917
    original: כַּאֲשֶׁר רָאִיתִי חֹרְשֵׁי אָוֶן וְזֹרְעֵי עָמָל יִקְצְרֻהוּ׃
    hebrewPlain: כאשר ראיתי חרשי און וזרעי עמל יקצרהו
    kjvRefs:
    - Job 4:8
    kjvOsis:
    - Job.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.9
    scripture: tanakh
    name: Tanakh Job 4:9
    ref: Job 4:9
    book: Job
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 18654
    text: By the breath of God they perish, And by the blast of His anger are they consumed.
    translation: JPS 1917
    original: מִנִּשְׁמַת אֱלוֹהַ יֹאבֵדוּ וּמֵרוּחַ אַפּוֹ יִכְלוּ׃
    hebrewPlain: מנשמת אלוה יאבדו ומרוח אפו יכלו
    kjvRefs:
    - Job 4:9
    kjvOsis:
    - Job.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.10
    scripture: tanakh
    name: Tanakh Job 4:10
    ref: Job 4:10
    book: Job
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 18655
    text: The lion roareth, and the fierce lion howleth— Yet the teeth of the young lions are broken.
    translation: JPS 1917
    original: שַׁאֲגַת אַרְיֵה וְקוֹל שָׁחַל וְשִׁנֵּי כְפִירִים נִתָּעוּ׃
    hebrewPlain: שאגת אריה וקול שחל ושני כפירים נתעו
    kjvRefs:
    - Job 4:10
    kjvOsis:
    - Job.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.11
    scripture: tanakh
    name: Tanakh Job 4:11
    ref: Job 4:11
    book: Job
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 18656
    text: The old lion perisheth for lack of prey, And the whelps of the lioness are scattered abroad.
    translation: JPS 1917
    original: לַיִשׁ אֹבֵד מִבְּלִי־טָרֶף וּבְנֵי לָבִיא יִתְפָּרָדוּ׃
    hebrewPlain: ליש אבד מבלי טרף ובני לביא יתפרדו
    kjvRefs:
    - Job 4:11
    kjvOsis:
    - Job.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.12
    scripture: tanakh
    name: Tanakh Job 4:12
    ref: Job 4:12
    book: Job
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 18657
    text: Now a word was secretly brought to me, And mine ear received a whisper thereof.
    translation: JPS 1917
    original: וְאֵלַי דָּבָר יְגֻנָּב וַתִּקַּח אָזְנִי שֵׁמֶץ מֶנְהוּ׃
    hebrewPlain: ואלי דבר יגנב ותקח אזני שמץ מנהו
    kjvRefs:
    - Job 4:12
    kjvOsis:
    - Job.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.13
    scripture: tanakh
    name: Tanakh Job 4:13
    ref: Job 4:13
    book: Job
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 18658
    text: In thoughts from the visions of the night, When deep sleep falleth on men,
    translation: JPS 1917
    original: בִּשְׂעִפִּים מֵחֶזְיֹנוֹת לָיְלָה בִּנְפֹל תַּרְדֵּמָה עַל־אֲנָשִׁים׃
    hebrewPlain: בשעפים מחזינות לילה בנפל תרדמה על אנשים
    kjvRefs:
    - Job 4:13
    kjvOsis:
    - Job.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.14
    scripture: tanakh
    name: Tanakh Job 4:14
    ref: Job 4:14
    book: Job
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 18659
    text: Fear came upon me, and trembling, And all my bones were made to shake. .
    translation: JPS 1917
    original: פַּחַד קְרָאַנִי וּרְעָדָה וְרֹב עַצְמוֹתַי הִפְחִיד׃
    hebrewPlain: פחד קראני ורעדה ורב עצמותי הפחיד
    kjvRefs:
    - Job 4:14
    kjvOsis:
    - Job.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.15
    scripture: tanakh
    name: Tanakh Job 4:15
    ref: Job 4:15
    book: Job
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 18660
    text: Then a spirit passed before my face, That made the hair of my flesh to stand up.
    translation: JPS 1917
    original: וְרוּחַ עַל־פָּנַי יַחֲלֹף תְּסַמֵּר שַׂעֲרַת בְּשָׂרִי׃
    hebrewPlain: ורוח על פני יחלף תסמר שערת בשרי
    kjvRefs:
    - Job 4:15
    kjvOsis:
    - Job.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.16
    scripture: tanakh
    name: Tanakh Job 4:16
    ref: Job 4:16
    book: Job
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 18661
    text: 'It stood still, but I could not discern the appearance thereof; A form was before mine eyes; I heard a still voice:'
    translation: JPS 1917
    original: יַעֲמֹד וְלֹא־אַכִּיר מַרְאֵהוּ תְּמוּנָה לְנֶגֶד עֵינָי דְּמָמָה וָקוֹל אֶשְׁמָע׃
    hebrewPlain: יעמד ולא אכיר מראהו תמונה לנגד עיני דממה וקול אשמע
    kjvRefs:
    - Job 4:16
    kjvOsis:
    - Job.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.17
    scripture: tanakh
    name: Tanakh Job 4:17
    ref: Job 4:17
    book: Job
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 18662
    text: ’Shall mortal man be just before God? Shall a man be pure before his Maker?
    translation: JPS 1917
    original: הַאֱנוֹשׁ מֵאֱלוֹהַ יִצְדָּק אִם מֵעֹשֵׂהוּ יִטְהַר־גָּבֶר׃
    hebrewPlain: האנוש מאלוה יצדק אם מעשהו יטהר גבר
    kjvRefs:
    - Job 4:17
    kjvOsis:
    - Job.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.18
    scripture: tanakh
    name: Tanakh Job 4:18
    ref: Job 4:18
    book: Job
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 18663
    text: Behold, He putteth no trust in His servants, And His angels He chargeth with folly;
    translation: JPS 1917
    original: הֵן בַּעֲבָדָיו לֹא יַאֲמִין וּבְמַלְאָכָיו יָשִׂים תָּהֳלָה׃
    hebrewPlain: הן בעבדיו לא יאמין ובמלאכיו ישים תהלה
    kjvRefs:
    - Job 4:18
    kjvOsis:
    - Job.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.19
    scripture: tanakh
    name: Tanakh Job 4:19
    ref: Job 4:19
    book: Job
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 18664
    text: How much more them that dwell in houses of clay, Whose foundation is in the dust, who are crushed before the moth!
    translation: JPS 1917
    original: אַף שֹׁכְנֵי בָתֵּי־חֹמֶר אֲשֶׁר־בֶּעָפָר יְסוֹדָם יְדַכְּאוּם לִפְנֵי־עָשׁ׃
    hebrewPlain: אף שכני בתי חמר אשר בעפר יסודם ידכאום לפני עש
    kjvRefs:
    - Job 4:19
    kjvOsis:
    - Job.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.20
    scripture: tanakh
    name: Tanakh Job 4:20
    ref: Job 4:20
    book: Job
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 18665
    text: Betwixt morning and evening they are shattered; They perish for ever without any regarding it.
    translation: JPS 1917
    original: מִבֹּקֶר לָעֶרֶב יֻכַּתּוּ מִבְּלִי מֵשִׂים לָנֶצַח יֹאבֵדוּ׃
    hebrewPlain: מבקר לערב יכתו מבלי משים לנצח יאבדו
    kjvRefs:
    - Job 4:20
    kjvOsis:
    - Job.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.4.21
    scripture: tanakh
    name: Tanakh Job 4:21
    ref: Job 4:21
    book: Job
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 18666
    text: Is not their tent-cord plucked up within them? They die, and that without wisdom.’
    translation: JPS 1917
    original: הֲלֹא־נִסַּע יִתְרָם בָּם יָמוּתוּ וְלֹא בְחָכְמָה׃
    hebrewPlain: הלא נסע יתרם בם ימותו ולא בחכמה
    kjvRefs:
    - Job 4:21
    kjvOsis:
    - Job.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.4
- type: TanakhVerse
  data:
    osis: Job.5.1
    scripture: tanakh
    name: Tanakh Job 5:1
    ref: Job 5:1
    book: Job
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 18667
    text: Call now; is there any that will answer thee? And to which of the holy ones wilt thou turn?
    translation: JPS 1917
    original: קְרָא־נָא הֲיֵשׁ עוֹנֶךָּ וְאֶל־מִי מִקְּדֹשִׁים תִּפְנֶה׃
    hebrewPlain: קרא נא היש עונך ואל מי מקדשים תפנה
    kjvRefs:
    - Job 5:1
    kjvOsis:
    - Job.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.2
    scripture: tanakh
    name: Tanakh Job 5:2
    ref: Job 5:2
    book: Job
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 18668
    text: For anger killeth the foolish man, And envy slayeth the silly one.
    translation: JPS 1917
    original: כִּי־לֶאֱוִיל יַהֲרָג־כָּעַשׂ וּפֹתֶה תָּמִית קִנְאָה׃
    hebrewPlain: כי לאויל יהרג כעש ופתה תמית קנאה
    kjvRefs:
    - Job 5:2
    kjvOsis:
    - Job.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.3
    scripture: tanakh
    name: Tanakh Job 5:3
    ref: Job 5:3
    book: Job
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 18669
    text: I have seen the foolish taking root; But suddenly I beheld his habitation cursed.
    translation: JPS 1917
    original: אֲ‍נִי־רָאִיתִי אֱוִיל מַשְׁרִישׁ וָאֶקּוֹב נָוֵהוּ פִתְאֹם׃
    hebrewPlain: א‍ני ראיתי אויל משריש ואקוב נוהו פתאם
    kjvRefs:
    - Job 5:3
    kjvOsis:
    - Job.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.4
    scripture: tanakh
    name: Tanakh Job 5:4
    ref: Job 5:4
    book: Job
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 18670
    text: His children are far from safety, And are crushed in the gate, with none to deliver them.
    translation: JPS 1917
    original: יִרְחֲקוּ בָנָיו מִיֶּשַׁע וְיִדַּכְּאוּ בַשַּׁעַר וְאֵין מַצִּיל׃
    hebrewPlain: ירחקו בניו מישע וידכאו בשער ואין מציל
    kjvRefs:
    - Job 5:4
    kjvOsis:
    - Job.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.5
    scripture: tanakh
    name: Tanakh Job 5:5
    ref: Job 5:5
    book: Job
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 18671
    text: Whose harvest the hungry eateth up, And taketh it even out of the thorns, and the snare gapeth for their substance.
    translation: JPS 1917
    original: אֲשֶׁר קְצִירוֹ רָעֵב יֹאכֵל וְאֶל־מִצִּנִּים יִקָּחֵהוּ וְשָׁאַף צַמִּים חֵילָם׃
    hebrewPlain: אשר קצירו רעב יאכל ואל מצנים יקחהו ושאף צמים חילם
    kjvRefs:
    - Job 5:5
    kjvOsis:
    - Job.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.6
    scripture: tanakh
    name: Tanakh Job 5:6
    ref: Job 5:6
    book: Job
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 18672
    text: For affliction cometh not forth from the dust, Neither doth trouble spring out of the ground;
    translation: JPS 1917
    original: כִּי לֹא־יֵצֵא מֵעָפָר אָוֶן וּמֵאֲדָמָה לֹא־יִצְמַח עָמָל׃
    hebrewPlain: כי לא יצא מעפר און ומאדמה לא יצמח עמל
    kjvRefs:
    - Job 5:6
    kjvOsis:
    - Job.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.7
    scripture: tanakh
    name: Tanakh Job 5:7
    ref: Job 5:7
    book: Job
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 18673
    text: But man is born unto trouble, As the sparks fly upward.
    translation: JPS 1917
    original: כִּי־אָדָם לְעָמָל יוּלָּד וּבְנֵי־רֶשֶׁף יַגְבִּיהוּ עוּף׃
    hebrewPlain: כי אדם לעמל יולד ובני רשף יגביהו עוף
    kjvRefs:
    - Job 5:7
    kjvOsis:
    - Job.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.8
    scripture: tanakh
    name: Tanakh Job 5:8
    ref: Job 5:8
    book: Job
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 18674
    text: But as for me, I would seek unto God, And unto God would I commit my cause;
    translation: JPS 1917
    original: אוּלָם אֲנִי אֶדְרֹשׁ אֶל־אֵל וְאֶל־אֱלֹהִים אָשִׂים דִּבְרָתִי׃
    hebrewPlain: אולם אני אדרש אל אל ואל אלהים אשים דברתי
    kjvRefs:
    - Job 5:8
    kjvOsis:
    - Job.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.9
    scripture: tanakh
    name: Tanakh Job 5:9
    ref: Job 5:9
    book: Job
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 18675
    text: Who doeth great things and unsearchable, Marvellous things without number;
    translation: JPS 1917
    original: עֹשֶׂה גְדֹלוֹת וְאֵין חֵקֶר נִפְלָאוֹת עַד־אֵין מִסְפָּר׃
    hebrewPlain: עשה גדלות ואין חקר נפלאות עד אין מספר
    kjvRefs:
    - Job 5:9
    kjvOsis:
    - Job.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.10
    scripture: tanakh
    name: Tanakh Job 5:10
    ref: Job 5:10
    book: Job
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 18676
    text: Who giveth rain upon the earth, And sendeth waters upon the fields;
    translation: JPS 1917
    original: הַנֹּתֵן מָטָר עַל־פְּנֵי־אָרֶץ וְשֹׁלֵחַ מַיִם עַל־פְּנֵי חוּצוֹת׃
    hebrewPlain: הנתן מטר על פני ארץ ושלח מים על פני חוצות
    kjvRefs:
    - Job 5:10
    kjvOsis:
    - Job.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.11
    scripture: tanakh
    name: Tanakh Job 5:11
    ref: Job 5:11
    book: Job
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 18677
    text: So that He setteth up on high those that are low, And those that mourn are exalted to safety.
    translation: JPS 1917
    original: לָשׂוּם שְׁפָלִים לְמָרוֹם וְקֹדְרִים שָׂגְבוּ יֶשַׁע׃
    hebrewPlain: לשום שפלים למרום וקדרים שגבו ישע
    kjvRefs:
    - Job 5:11
    kjvOsis:
    - Job.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.12
    scripture: tanakh
    name: Tanakh Job 5:12
    ref: Job 5:12
    book: Job
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 18678
    text: He frustrateth the devices of the crafty, So that their hands can perform nothing substantial.
    translation: JPS 1917
    original: מֵפֵר מַחְשְׁבוֹת עֲרוּמִים וְלֹא־תַעֲשֶׂינָה יְדֵיהֶם תּוּשִׁיָּה׃
    hebrewPlain: מפר מחשבות ערומים ולא תעשינה ידיהם תושיה
    kjvRefs:
    - Job 5:12
    kjvOsis:
    - Job.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.13
    scripture: tanakh
    name: Tanakh Job 5:13
    ref: Job 5:13
    book: Job
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 18679
    text: He taketh the wise in their own craftiness; And the counsel of the wily is carried headlong.
    translation: JPS 1917
    original: לֹכֵד חֲכָמִים בְּעָרְמָם וַעֲצַת נִפְתָּלִים נִמְהָרָה׃
    hebrewPlain: לכד חכמים בערמם ועצת נפתלים נמהרה
    kjvRefs:
    - Job 5:13
    kjvOsis:
    - Job.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.14
    scripture: tanakh
    name: Tanakh Job 5:14
    ref: Job 5:14
    book: Job
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 18680
    text: They meet with darkness in the day-time, And grope at noonday as in the night. .
    translation: JPS 1917
    original: יוֹמָם יְפַגְּשׁוּ־חֹשֶׁךְ וְכַלַּיְלָה יְמַשְׁשׁוּ בַצָּהֳרָיִם׃
    hebrewPlain: יומם יפגשו חשך וכלילה ימששו בצהרים
    kjvRefs:
    - Job 5:14
    kjvOsis:
    - Job.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.15
    scripture: tanakh
    name: Tanakh Job 5:15
    ref: Job 5:15
    book: Job
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 18681
    text: But He saveth from the sword of their mouth, Even the needy from the hand of the mighty.
    translation: JPS 1917
    original: וַיֹּשַׁע מֵחֶרֶב מִפִּיהֶם וּמִיַּד חָזָק אֶבְיוֹן׃
    hebrewPlain: וישע מחרב מפיהם ומיד חזק אביון
    kjvRefs:
    - Job 5:15
    kjvOsis:
    - Job.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.16
    scripture: tanakh
    name: Tanakh Job 5:16
    ref: Job 5:16
    book: Job
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 18682
    text: So the poor hath hope, And iniquity stoppeth her mouth.
    translation: JPS 1917
    original: וַתְּהִי לַדַּל תִּקְוָה וְעֹלָתָה קָפְצָה פִּיהָ׃
    hebrewPlain: ותהי לדל תקוה ועלתה קפצה פיה
    kjvRefs:
    - Job 5:16
    kjvOsis:
    - Job.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.17
    scripture: tanakh
    name: Tanakh Job 5:17
    ref: Job 5:17
    book: Job
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 18683
    text: Behold, happy is the man whom God correcteth; Therefore despise not thou the chastening of the Almighty.
    translation: JPS 1917
    original: הִנֵּה אַשְׁרֵי אֱנוֹשׁ יוֹכִחֶנּוּ אֱלוֹהַּ וּמוּסַר שַׁדַּי אַל־תִּמְאָס׃
    hebrewPlain: הנה אשרי אנוש יוכחנו אלוה ומוסר שדי אל תמאס
    kjvRefs:
    - Job 5:17
    kjvOsis:
    - Job.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.18
    scripture: tanakh
    name: Tanakh Job 5:18
    ref: Job 5:18
    book: Job
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 18684
    text: For He maketh sore, and bindeth up; He woundeth, and His hands make whole.
    translation: JPS 1917
    original: כִּי הוּא יַכְאִיב וְיֶחְבָּשׁ יִמְחַץ וידו [וְיָדָיו] תִּרְפֶּינָה׃
    hebrewPlain: כי הוא יכאיב ויחבש ימחץ וידו [וידיו] תרפינה
    kjvRefs:
    - Job 5:18
    kjvOsis:
    - Job.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.19
    scripture: tanakh
    name: Tanakh Job 5:19
    ref: Job 5:19
    book: Job
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 18685
    text: He will deliver thee in six troubles; Yea, in seven there shall no evil touch thee.
    translation: JPS 1917
    original: בְּשֵׁשׁ צָרוֹת יַצִּילֶךָּ וּבְשֶׁבַע לֹא־יִגַּע בְּךָ רָע׃
    hebrewPlain: בשש צרות יצילך ובשבע לא יגע בך רע
    kjvRefs:
    - Job 5:19
    kjvOsis:
    - Job.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.20
    scripture: tanakh
    name: Tanakh Job 5:20
    ref: Job 5:20
    book: Job
    section: ketuvim
    chapter: 5
    verse: 20
    ordinal: 18686
    text: In famine He will redeem thee from death; And in war from the power of the sword.
    translation: JPS 1917
    original: בְּרָעָב פָּדְךָ מִמָּוֶת וּבְמִלְחָמָה מִידֵי חָרֶב׃
    hebrewPlain: ברעב פדך ממות ובמלחמה מידי חרב
    kjvRefs:
    - Job 5:20
    kjvOsis:
    - Job.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.21
    scripture: tanakh
    name: Tanakh Job 5:21
    ref: Job 5:21
    book: Job
    section: ketuvim
    chapter: 5
    verse: 21
    ordinal: 18687
    text: Thou shalt be hid from the scourge of the tongue; Neither shalt thou be afraid of destruction when it cometh.
    translation: JPS 1917
    original: בְּשׁוֹט לָשׁוֹן תֵּחָבֵא וְלֹא־תִירָא מִשֹּׁד כִּי יָבוֹא׃
    hebrewPlain: בשוט לשון תחבא ולא תירא משד כי יבוא
    kjvRefs:
    - Job 5:21
    kjvOsis:
    - Job.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.22
    scripture: tanakh
    name: Tanakh Job 5:22
    ref: Job 5:22
    book: Job
    section: ketuvim
    chapter: 5
    verse: 22
    ordinal: 18688
    text: At destruction and famine thou shalt laugh; Neither shalt thou be afraid of the beasts of the earth.
    translation: JPS 1917
    original: לְשֹׁד וּלְכָפָן תִּשְׂחָק וּמֵחַיַּת הָאָרֶץ אַל־תִּירָא׃
    hebrewPlain: לשד ולכפן תשחק ומחית הארץ אל תירא
    kjvRefs:
    - Job 5:22
    kjvOsis:
    - Job.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.23
    scripture: tanakh
    name: Tanakh Job 5:23
    ref: Job 5:23
    book: Job
    section: ketuvim
    chapter: 5
    verse: 23
    ordinal: 18689
    text: For thou shalt be in league with the stones of the field; And the beasts of the field shall be at peace with thee.
    translation: JPS 1917
    original: כִּי עִם־אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ וְחַיַּת הַשָּׂדֶה הָשְׁלְמָה־לָךְ׃
    hebrewPlain: כי עם אבני השדה בריתך וחית השדה השלמה לך
    kjvRefs:
    - Job 5:23
    kjvOsis:
    - Job.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.24
    scripture: tanakh
    name: Tanakh Job 5:24
    ref: Job 5:24
    book: Job
    section: ketuvim
    chapter: 5
    verse: 24
    ordinal: 18690
    text: And thou shalt know that thy tent is in peace; And thou shalt visit thy habitation, and shalt miss nothing.
    translation: JPS 1917
    original: וְיָדַעְתָּ כִּי־שָׁלוֹם אָהֳלֶךָ וּפָקַדְתָּ נָוְךָ וְלֹא תֶחֱטָא׃
    hebrewPlain: וידעת כי שלום אהלך ופקדת נוך ולא תחטא
    kjvRefs:
    - Job 5:24
    kjvOsis:
    - Job.5.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.25
    scripture: tanakh
    name: Tanakh Job 5:25
    ref: Job 5:25
    book: Job
    section: ketuvim
    chapter: 5
    verse: 25
    ordinal: 18691
    text: Thou shalt know also that thy seed shall be great, And thine offspring as the grass of the earth.
    translation: JPS 1917
    original: וְיָדַעְתָּ כִּי־רַב זַרְעֶךָ וְצֶאֱצָאֶיךָ כְּעֵשֶׂב הָאָרֶץ׃
    hebrewPlain: וידעת כי רב זרעך וצאצאיך כעשב הארץ
    kjvRefs:
    - Job 5:25
    kjvOsis:
    - Job.5.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.26
    scripture: tanakh
    name: Tanakh Job 5:26
    ref: Job 5:26
    book: Job
    section: ketuvim
    chapter: 5
    verse: 26
    ordinal: 18692
    text: Thou shalt come to thy grave in a ripe age, Like as a shock of corn cometh in in its season.
    translation: JPS 1917
    original: תָּבוֹא בְכֶלַח אֱלֵי־קָבֶר כַּעֲלוֹת גָּדִישׁ בְּעִתּוֹ׃
    hebrewPlain: תבוא בכלח אלי קבר כעלות גדיש בעתו
    kjvRefs:
    - Job 5:26
    kjvOsis:
    - Job.5.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.5.27
    scripture: tanakh
    name: Tanakh Job 5:27
    ref: Job 5:27
    book: Job
    section: ketuvim
    chapter: 5
    verse: 27
    ordinal: 18693
    text: Lo this, we have searched it, So it is; hear it, and know thou it for thy good.
    translation: JPS 1917
    original: הִנֵּה־זֹאת חֲקַרְנוּהָ כֶּן־הִיא שְׁמָעֶנָּה וְאַתָּה דַע־לָךְ׃
    hebrewPlain: הנה זאת חקרנוה כן היא שמענה ואתה דע לך
    kjvRefs:
    - Job 5:27
    kjvOsis:
    - Job.5.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.5
- type: TanakhVerse
  data:
    osis: Job.6.1
    scripture: tanakh
    name: Tanakh Job 6:1
    ref: Job 6:1
    book: Job
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 18694
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 6:1
    kjvOsis:
    - Job.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.2
    scripture: tanakh
    name: Tanakh Job 6:2
    ref: Job 6:2
    book: Job
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 18695
    text: Oh that my vexation were but weighed, and my calamity laid in the balances altogether!
    translation: JPS 1917
    original: לוּ שָׁקוֹל יִשָּׁקֵל כַּעְשִׂי והיתי [וְהַוָּתִי] בְּמֹאזְנַיִם יִשְׂאוּ־יָחַד׃
    hebrewPlain: לו שקול ישקל כעשי והיתי [והותי] במאזנים ישאו יחד
    kjvRefs:
    - Job 6:2
    kjvOsis:
    - Job.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.3
    scripture: tanakh
    name: Tanakh Job 6:3
    ref: Job 6:3
    book: Job
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 18696
    text: For now it would be heavier than the sand of the seas; therefore are my words broken.
    translation: JPS 1917
    original: כִּי־עַתָּה מֵחוֹל יַמִּים יִכְבָּד עַל־כֵּן דְּבָרַי לָעוּ׃
    hebrewPlain: כי עתה מחול ימים יכבד על כן דברי לעו
    kjvRefs:
    - Job 6:3
    kjvOsis:
    - Job.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.4
    scripture: tanakh
    name: Tanakh Job 6:4
    ref: Job 6:4
    book: Job
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 18697
    text: For the arrows of the Almighty are within me, the poison whereof my spirit drinketh up; the terrors of God do set themselves in array against me.
    translation: JPS 1917
    original: כִּי חִצֵּי שַׁדַּי עִמָּדִי אֲשֶׁר חֲמָתָם שֹׁתָה רוּחִי בִּעוּתֵי אֱלוֹהַּ יַעַרְכוּנִי׃
    hebrewPlain: כי חצי שדי עמדי אשר חמתם שתה רוחי בעותי אלוה יערכוני
    kjvRefs:
    - Job 6:4
    kjvOsis:
    - Job.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.5
    scripture: tanakh
    name: Tanakh Job 6:5
    ref: Job 6:5
    book: Job
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 18698
    text: Doth the wild ass bray when he hath grass? Or loweth the ox over his fodder?
    translation: JPS 1917
    original: הֲיִנְהַק־פֶּרֶא עֲלֵי־דֶשֶׁא אִם יִגְעֶה־שּׁוֹר עַל־בְּלִילוֹ׃
    hebrewPlain: הינהק פרא עלי דשא אם יגעה שור על בלילו
    kjvRefs:
    - Job 6:5
    kjvOsis:
    - Job.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.6
    scripture: tanakh
    name: Tanakh Job 6:6
    ref: Job 6:6
    book: Job
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 18699
    text: Can that which hath no savour be eaten without salt? Or is there any taste in the juice of mallows?
    translation: JPS 1917
    original: הֲיֵאָכֵל תָּפֵל מִבְּלִי־מֶלַח אִם־יֶשׁ־טַעַם בְּרִיר חַלָּמוּת׃
    hebrewPlain: היאכל תפל מבלי מלח אם יש טעם בריר חלמות
    kjvRefs:
    - Job 6:6
    kjvOsis:
    - Job.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.7
    scripture: tanakh
    name: Tanakh Job 6:7
    ref: Job 6:7
    book: Job
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 18700
    text: My soul refuseth to touch them; they are as the sickness of my flesh.
    translation: JPS 1917
    original: מֵאֲנָה לִנְגּוֹעַ נַפְשִׁי הֵמָּה כִּדְוֵי לַחְמִי׃
    hebrewPlain: מאנה לנגוע נפשי המה כדוי לחמי
    kjvRefs:
    - Job 6:7
    kjvOsis:
    - Job.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.8
    scripture: tanakh
    name: Tanakh Job 6:8
    ref: Job 6:8
    book: Job
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 18701
    text: Oh that I might have my request, and that God would grant me the thing that I long for! .
    translation: JPS 1917
    original: מִי־יִתֵּן תָּבוֹא שֶׁאֱלָתִי וְתִקְוָתִי יִתֵּן אֱלוֹהַּ׃
    hebrewPlain: מי יתן תבוא שאלתי ותקותי יתן אלוה
    kjvRefs:
    - Job 6:8
    kjvOsis:
    - Job.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.9
    scripture: tanakh
    name: Tanakh Job 6:9
    ref: Job 6:9
    book: Job
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 18702
    text: Even that it would please God to crush me; that He would let loose His hand, and cut me off!
    translation: JPS 1917
    original: וְיֹאֵל אֱלוֹהַּ וִידַכְּאֵנִי יַתֵּר יָדוֹ וִיבַצְּעֵנִי׃
    hebrewPlain: ויאל אלוה וידכאני יתר ידו ויבצעני
    kjvRefs:
    - Job 6:9
    kjvOsis:
    - Job.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.10
    scripture: tanakh
    name: Tanakh Job 6:10
    ref: Job 6:10
    book: Job
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 18703
    text: Then should I yet have comfort; yea, I would exult in pain, though He spare not; For I have not denied the words of the Holy One.
    translation: JPS 1917
    original: וּתְהִי עוֹד נֶחָמָתִי וַאֲסַלְּדָה בְחִילָה לֹא יַחְמוֹל כִּי־לֹא כִחַדְתִּי אִמְרֵי קָדוֹשׁ׃
    hebrewPlain: ותהי עוד נחמתי ואסלדה בחילה לא יחמול כי לא כחדתי אמרי קדוש
    kjvRefs:
    - Job 6:10
    kjvOsis:
    - Job.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.11
    scripture: tanakh
    name: Tanakh Job 6:11
    ref: Job 6:11
    book: Job
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 18704
    text: What is my strength, that I should wait? And what is mine end, that I should be patient?
    translation: JPS 1917
    original: מַה־כֹּחִי כִי־אֲיַחֵל וּמַה־קִּצִּי כִּי־אַאֲרִיךְ נַפְשִׁי׃
    hebrewPlain: מה כחי כי איחל ומה קצי כי אאריך נפשי
    kjvRefs:
    - Job 6:11
    kjvOsis:
    - Job.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.12
    scripture: tanakh
    name: Tanakh Job 6:12
    ref: Job 6:12
    book: Job
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 18705
    text: Is my strength the strength of stones? Or is my flesh of brass?
    translation: JPS 1917
    original: אִם־כֹּחַ אֲבָנִים כֹּחִי אִם־בְּשָׂרִי נָחוּשׁ׃
    hebrewPlain: אם כח אבנים כחי אם בשרי נחוש
    kjvRefs:
    - Job 6:12
    kjvOsis:
    - Job.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.13
    scripture: tanakh
    name: Tanakh Job 6:13
    ref: Job 6:13
    book: Job
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 18706
    text: Is it that I have no help in me, and that sound wisdom is driven quite from me?
    translation: JPS 1917
    original: הַאִם אֵין עֶזְרָתִי בִי וְתֻשִׁיָּה נִדְּחָה מִמֶּנִּי׃
    hebrewPlain: האם אין עזרתי בי ותשיה נדחה ממני
    kjvRefs:
    - Job 6:13
    kjvOsis:
    - Job.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.14
    scripture: tanakh
    name: Tanakh Job 6:14
    ref: Job 6:14
    book: Job
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 18707
    text: To him that is ready to faint kindness is due from his friend, Even to him that forsaketh the fear of the Almighty.
    translation: JPS 1917
    original: לַמָּס מֵרֵעֵהוּ חָסֶד וְיִרְאַת שַׁדַּי יַעֲזוֹב׃
    hebrewPlain: למס מרעהו חסד ויראת שדי יעזוב
    kjvRefs:
    - Job 6:14
    kjvOsis:
    - Job.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.15
    scripture: tanakh
    name: Tanakh Job 6:15
    ref: Job 6:15
    book: Job
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 18708
    text: My brethren have dealt deceitfully as a brook, As the channel of brooks that overflow,
    translation: JPS 1917
    original: אַחַי בָּגְדוּ כְמוֹ־נָחַל כַּאֲפִיק נְחָלִים יַעֲבֹרוּ׃
    hebrewPlain: אחי בגדו כמו נחל כאפיק נחלים יעברו
    kjvRefs:
    - Job 6:15
    kjvOsis:
    - Job.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.16
    scripture: tanakh
    name: Tanakh Job 6:16
    ref: Job 6:16
    book: Job
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 18709
    text: Which are black by reason of the ice, And wherein the snow hideth itself;
    translation: JPS 1917
    original: הַקֹּדְרִים מִנִּי־קָרַח עָלֵימוֹ יִתְעַלֶּם־שָׁלֶג׃
    hebrewPlain: הקדרים מני קרח עלימו יתעלם שלג
    kjvRefs:
    - Job 6:16
    kjvOsis:
    - Job.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.17
    scripture: tanakh
    name: Tanakh Job 6:17
    ref: Job 6:17
    book: Job
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 18710
    text: What time they wax warm, they vanish, When it is hot, they are consumed out of their place.
    translation: JPS 1917
    original: בְּעֵת יְזֹרְבוּ נִצְמָתוּ בְּחֻמּוֹ נִדְעֲכוּ מִמְּקוֹמָם׃
    hebrewPlain: בעת יזרבו נצמתו בחמו נדעכו ממקומם
    kjvRefs:
    - Job 6:17
    kjvOsis:
    - Job.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.18
    scripture: tanakh
    name: Tanakh Job 6:18
    ref: Job 6:18
    book: Job
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 18711
    text: The paths of their way do wind, They go up into the waste, and are lost.
    translation: JPS 1917
    original: יִלָּפְתוּ אָרְחוֹת דַּרְכָּם יַעֲלוּ בַתֹּהוּ וְיֹאבֵדוּ׃
    hebrewPlain: ילפתו ארחות דרכם יעלו בתהו ויאבדו
    kjvRefs:
    - Job 6:18
    kjvOsis:
    - Job.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.19
    scripture: tanakh
    name: Tanakh Job 6:19
    ref: Job 6:19
    book: Job
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 18712
    text: The caravans of Tema looked, The companies of Sheba waited for them—
    translation: JPS 1917
    original: הִבִּיטוּ אָרְחוֹת תֵּמָא הֲלִיכֹת שְׁבָא קִוּוּ־לָמוֹ׃
    hebrewPlain: הביטו ארחות תמא הליכת שבא קוו למו
    kjvRefs:
    - Job 6:19
    kjvOsis:
    - Job.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.20
    scripture: tanakh
    name: Tanakh Job 6:20
    ref: Job 6:20
    book: Job
    section: ketuvim
    chapter: 6
    verse: 20
    ordinal: 18713
    text: They were ashamed because they had hoped; They came thither, and were confounded.
    translation: JPS 1917
    original: בֹּשׁוּ כִּי־בָטָח בָּאוּ עָדֶיהָ וַיֶּחְפָּרוּ׃
    hebrewPlain: בשו כי בטח באו עדיה ויחפרו
    kjvRefs:
    - Job 6:20
    kjvOsis:
    - Job.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.21
    scripture: tanakh
    name: Tanakh Job 6:21
    ref: Job 6:21
    book: Job
    section: ketuvim
    chapter: 6
    verse: 21
    ordinal: 18714
    text: For now ye are become His; Ye see a terror, and are afraid.
    translation: JPS 1917
    original: כִּי־עַתָּה הֱיִיתֶם לא [לוֹ] תִּרְאוּ חֲתַת וַתִּירָאוּ׃
    hebrewPlain: כי עתה הייתם לא [לו] תראו חתת ותיראו
    kjvRefs:
    - Job 6:21
    kjvOsis:
    - Job.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.22
    scripture: tanakh
    name: Tanakh Job 6:22
    ref: Job 6:22
    book: Job
    section: ketuvim
    chapter: 6
    verse: 22
    ordinal: 18715
    text: 'Did I say: ‘Give unto me’? Or: ‘Offer a present for me of your substance’?'
    translation: JPS 1917
    original: הֲ‍כִי־אָמַרְתִּי הָבוּ לִי וּמִכֹּחֲכֶם שִׁחֲדוּ בַעֲדִי׃
    hebrewPlain: ה‍כי אמרתי הבו לי ומכחכם שחדו בעדי
    kjvRefs:
    - Job 6:22
    kjvOsis:
    - Job.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.23
    scripture: tanakh
    name: Tanakh Job 6:23
    ref: Job 6:23
    book: Job
    section: ketuvim
    chapter: 6
    verse: 23
    ordinal: 18716
    text: 'or: ‘Deliver me from the adversary’s hand’? Or: ‘Redeem me from the hand of the oppressors’?'
    translation: JPS 1917
    original: וּמַלְּטוּנִי מִיַּד־צָר וּמִיַּד עָרִיצִים תִּפְדּוּנִי׃
    hebrewPlain: ומלטוני מיד צר ומיד עריצים תפדוני
    kjvRefs:
    - Job 6:23
    kjvOsis:
    - Job.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.24
    scripture: tanakh
    name: Tanakh Job 6:24
    ref: Job 6:24
    book: Job
    section: ketuvim
    chapter: 6
    verse: 24
    ordinal: 18717
    text: Teach me, and I will hold my peace; And cause me to understand wherein I have erred.
    translation: JPS 1917
    original: הוֹרוּנִי וַאֲנִי אַחֲרִישׁ וּמַה־שָּׁגִיתִי הָבִינוּ לִי׃
    hebrewPlain: הורוני ואני אחריש ומה שגיתי הבינו לי
    kjvRefs:
    - Job 6:24
    kjvOsis:
    - Job.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.25
    scripture: tanakh
    name: Tanakh Job 6:25
    ref: Job 6:25
    book: Job
    section: ketuvim
    chapter: 6
    verse: 25
    ordinal: 18718
    text: How forcible are words of uprightness! But what doth your arguing argue?
    translation: JPS 1917
    original: מַה־נִּמְרְצוּ אִמְרֵי־יֹשֶׁר וּמַה־יּוֹכִיחַ הוֹכֵחַ מִכֶּם׃
    hebrewPlain: מה נמרצו אמרי ישר ומה יוכיח הוכח מכם
    kjvRefs:
    - Job 6:25
    kjvOsis:
    - Job.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.26
    scripture: tanakh
    name: Tanakh Job 6:26
    ref: Job 6:26
    book: Job
    section: ketuvim
    chapter: 6
    verse: 26
    ordinal: 18719
    text: Do ye hold words to be an argument, But the speeches of one that is desperate to be wind?
    translation: JPS 1917
    original: הַלְהוֹכַח מִלִּים תַּחְשֹׁבוּ וּלְרוּחַ אִמְרֵי נֹאָשׁ׃
    hebrewPlain: הלהוכח מלים תחשבו ולרוח אמרי נאש
    kjvRefs:
    - Job 6:26
    kjvOsis:
    - Job.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.27
    scripture: tanakh
    name: Tanakh Job 6:27
    ref: Job 6:27
    book: Job
    section: ketuvim
    chapter: 6
    verse: 27
    ordinal: 18720
    text: Yea, ye would cast lots upon the fatherless, And dig a pit for your friend.
    translation: JPS 1917
    original: אַף־עַל־יָתוֹם תַּפִּילוּ וְתִכְרוּ עַל־רֵיעֲכֶם׃
    hebrewPlain: אף על יתום תפילו ותכרו על ריעכם
    kjvRefs:
    - Job 6:27
    kjvOsis:
    - Job.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.28
    scripture: tanakh
    name: Tanakh Job 6:28
    ref: Job 6:28
    book: Job
    section: ketuvim
    chapter: 6
    verse: 28
    ordinal: 18721
    text: Now therefore be pleased to look upon me; For surely I shall not lie to your face.
    translation: JPS 1917
    original: וְעַתָּה הוֹאִילוּ פְנוּ־בִי וְעַל־פְּנֵיכֶם אִם־אֲכַזֵּב׃
    hebrewPlain: ועתה הואילו פנו בי ועל פניכם אם אכזב
    kjvRefs:
    - Job 6:28
    kjvOsis:
    - Job.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.29
    scripture: tanakh
    name: Tanakh Job 6:29
    ref: Job 6:29
    book: Job
    section: ketuvim
    chapter: 6
    verse: 29
    ordinal: 18722
    text: Return, I pray you, let there be no injustice; Yea, return again, my cause is righteous.
    translation: JPS 1917
    original: שֻׁבוּ־נָא אַל־תְּהִי עַוְלָה ושבי [וְשׁוּבוּ] עוֹד צִדְקִי־בָהּ׃
    hebrewPlain: שבו נא אל תהי עולה ושבי [ושובו] עוד צדקי בה
    kjvRefs:
    - Job 6:29
    kjvOsis:
    - Job.6.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.6.30
    scripture: tanakh
    name: Tanakh Job 6:30
    ref: Job 6:30
    book: Job
    section: ketuvim
    chapter: 6
    verse: 30
    ordinal: 18723
    text: Is there injustice on my tongue? Cannot my taste discern crafty devices?
    translation: JPS 1917
    original: הֲיֵשׁ־בִּלְשׁוֹנִי עַוְלָה אִם־חִכִּי לֹא־יָבִין הַוּוֹת׃
    hebrewPlain: היש בלשוני עולה אם חכי לא יבין הוות
    kjvRefs:
    - Job 6:30
    kjvOsis:
    - Job.6.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.6
- type: TanakhVerse
  data:
    osis: Job.7.1
    scripture: tanakh
    name: Tanakh Job 7:1
    ref: Job 7:1
    book: Job
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 18724
    text: Is there not a time of service to man upon earth? And are not his days like the days of a hireling?
    translation: JPS 1917
    original: הֲלֹא־צָבָא לֶאֱנוֹשׁ על־[עֲלֵי־] אָרֶץ וְכִימֵי שָׂכִיר יָמָיו׃
    hebrewPlain: הלא צבא לאנוש על [עלי ] ארץ וכימי שכיר ימיו
    kjvRefs:
    - Job 7:1
    kjvOsis:
    - Job.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.2
    scripture: tanakh
    name: Tanakh Job 7:2
    ref: Job 7:2
    book: Job
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 18725
    text: As a servant that eagerly longeth for the shadow, And as a hireling that looketh for his wages;
    translation: JPS 1917
    original: כְּעֶבֶד יִשְׁאַף־צֵל וּכְשָׂכִיר יְקַוֶּה פָעֳלוֹ׃
    hebrewPlain: כעבד ישאף צל וכשכיר יקוה פעלו
    kjvRefs:
    - Job 7:2
    kjvOsis:
    - Job.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.3
    scripture: tanakh
    name: Tanakh Job 7:3
    ref: Job 7:3
    book: Job
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 18726
    text: So am I made to possess—months of vanity, And wearisome nights are appointed to me.
    translation: JPS 1917
    original: כֵּן הָנְחַלְתִּי לִי יַרְחֵי־שָׁוְא וְלֵילוֹת עָמָל מִנּוּ־לִי׃
    hebrewPlain: כן הנחלתי לי ירחי שוא ולילות עמל מנו לי
    kjvRefs:
    - Job 7:3
    kjvOsis:
    - Job.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.4
    scripture: tanakh
    name: Tanakh Job 7:4
    ref: Job 7:4
    book: Job
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 18727
    text: 'When I lie down, I say: ‘When shall I arise?’ But the night is long, and I am full of tossings to and fro unto the dawning of the day.'
    translation: JPS 1917
    original: אִם־שָׁכַבְתִּי וְאָמַרְתִּי מָתַי אָקוּם וּמִדַּד־עָרֶב וְשָׂבַעְתִּי נְדֻדִים עֲדֵי־נָשֶׁף׃
    hebrewPlain: אם שכבתי ואמרתי מתי אקום ומדד ערב ושבעתי נדדים עדי נשף
    kjvRefs:
    - Job 7:4
    kjvOsis:
    - Job.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.5
    scripture: tanakh
    name: Tanakh Job 7:5
    ref: Job 7:5
    book: Job
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 18728
    text: My flesh is clothed with worms and clods of dust; My skin closeth up and breaketh out afresh.
    translation: JPS 1917
    original: לָבַשׁ בְּשָׂרִי רִמָּה וגיש [וְגוּשׁ] עָפָר עוֹרִי רָגַע וַיִּמָּאֵס׃
    hebrewPlain: לבש בשרי רמה וגיש [וגוש] עפר עורי רגע וימאס
    kjvRefs:
    - Job 7:5
    kjvOsis:
    - Job.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.6
    scripture: tanakh
    name: Tanakh Job 7:6
    ref: Job 7:6
    book: Job
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 18729
    text: My days are swifter than a weaver’s shuttle, And are spent without hope.
    translation: JPS 1917
    original: יָמַי קַלּוּ מִנִּי־אָרֶג וַיִּכְלוּ בְּאֶפֶס תִּקְוָה׃
    hebrewPlain: ימי קלו מני ארג ויכלו באפס תקוה
    kjvRefs:
    - Job 7:6
    kjvOsis:
    - Job.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.7
    scripture: tanakh
    name: Tanakh Job 7:7
    ref: Job 7:7
    book: Job
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 18730
    text: O remember that my life is a breath; Mine eye shall no more see good.
    translation: JPS 1917
    original: זְכֹר כִּי־רוּחַ חַיָּי לֹא־תָשׁוּב עֵינִי לִרְאוֹת טוֹב׃
    hebrewPlain: זכר כי רוח חיי לא תשוב עיני לראות טוב
    kjvRefs:
    - Job 7:7
    kjvOsis:
    - Job.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.8
    scripture: tanakh
    name: Tanakh Job 7:8
    ref: Job 7:8
    book: Job
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 18731
    text: The eye of him that seeth me shall behold me no more; While Thine eyes are upon me, I am gone.
    translation: JPS 1917
    original: לֹא־תְשׁוּרֵנִי עֵין רֹאִי עֵינֶיךָ בִּי וְאֵינֶנִּי׃
    hebrewPlain: לא תשורני עין ראי עיניך בי ואינני
    kjvRefs:
    - Job 7:8
    kjvOsis:
    - Job.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.9
    scripture: tanakh
    name: Tanakh Job 7:9
    ref: Job 7:9
    book: Job
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 18732
    text: As the cloud is consumed and vanisheth away, So he that goeth down to the grave shall come up no more.
    translation: JPS 1917
    original: כָּלָה עָנָן וַיֵּלַךְ כֵּן יוֹרֵד שְׁאוֹל לֹא יַעֲלֶה׃
    hebrewPlain: כלה ענן וילך כן יורד שאול לא יעלה
    kjvRefs:
    - Job 7:9
    kjvOsis:
    - Job.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.10
    scripture: tanakh
    name: Tanakh Job 7:10
    ref: Job 7:10
    book: Job
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 18733
    text: He shall return no more to his house, Neither shall his place know him any more.
    translation: JPS 1917
    original: לֹא־יָשׁוּב עוֹד לְבֵיתוֹ וְלֹא־יַכִּירֶנּוּ עוֹד מְקֹמוֹ׃
    hebrewPlain: לא ישוב עוד לביתו ולא יכירנו עוד מקמו
    kjvRefs:
    - Job 7:10
    kjvOsis:
    - Job.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.11
    scripture: tanakh
    name: Tanakh Job 7:11
    ref: Job 7:11
    book: Job
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 18734
    text: Therefore I will not refrain my mouth; I will speak in the anguish of my spirit; I will complain in the bitterness of my soul.
    translation: JPS 1917
    original: גַּם־אֲנִי לֹא אֶחֱשָׂךְ פִּי אֲ‍דַבְּרָה בְּצַר רוּחִי אָשִׂיחָה בְּמַר נַפְשִׁי׃
    hebrewPlain: גם אני לא אחשך פי א‍דברה בצר רוחי אשיחה במר נפשי
    kjvRefs:
    - Job 7:11
    kjvOsis:
    - Job.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.12
    scripture: tanakh
    name: Tanakh Job 7:12
    ref: Job 7:12
    book: Job
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 18735
    text: Am I a sea, or a sea-monster, That Thou settest a watch over me?
    translation: JPS 1917
    original: הֲ‍יָם־אָנִי אִם־תַּנִּין כִּי־תָשִׂים עָלַי מִשְׁמָר׃
    hebrewPlain: ה‍ים אני אם תנין כי תשים עלי משמר
    kjvRefs:
    - Job 7:12
    kjvOsis:
    - Job.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.13
    scripture: tanakh
    name: Tanakh Job 7:13
    ref: Job 7:13
    book: Job
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 18736
    text: 'When I say: ‘My bed shall comfort me, My couch shall ease my complaint’;'
    translation: JPS 1917
    original: כִּי־אָמַרְתִּי תְּנַחֲמֵנִי עַרְשִׂי יִשָּׂא בְשִׂיחִי מִשְׁכָּבִי׃
    hebrewPlain: כי אמרתי תנחמני ערשי ישא בשיחי משכבי
    kjvRefs:
    - Job 7:13
    kjvOsis:
    - Job.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.14
    scripture: tanakh
    name: Tanakh Job 7:14
    ref: Job 7:14
    book: Job
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 18737
    text: Then Thou scarest me with dreams, And terrifiest me through visions;
    translation: JPS 1917
    original: וְחִתַּתַּנִי בַחֲלֹמוֹת וּמֵחֶזְיֹנוֹת תְּבַעֲתַנִּי׃
    hebrewPlain: וחתתני בחלמות ומחזינות תבעתני
    kjvRefs:
    - Job 7:14
    kjvOsis:
    - Job.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.15
    scripture: tanakh
    name: Tanakh Job 7:15
    ref: Job 7:15
    book: Job
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 18738
    text: So that my soul chooseth strangling, And death rather than these my bones.
    translation: JPS 1917
    original: וַתִּבְחַר מַחֲנָק נַפְשִׁי מָוֶת מֵעַצְמוֹתָי׃
    hebrewPlain: ותבחר מחנק נפשי מות מעצמותי
    kjvRefs:
    - Job 7:15
    kjvOsis:
    - Job.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.16
    scripture: tanakh
    name: Tanakh Job 7:16
    ref: Job 7:16
    book: Job
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 18739
    text: I loathe it; I shall not live alway; Let me alone; for my days are vanity.
    translation: JPS 1917
    original: מָאַסְתִּי לֹא־לְעֹלָם אֶחְיֶה חֲדַל מִמֶּנִּי כִּי־הֶבֶל יָמָי׃
    hebrewPlain: מאסתי לא לעלם אחיה חדל ממני כי הבל ימי
    kjvRefs:
    - Job 7:16
    kjvOsis:
    - Job.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.17
    scripture: tanakh
    name: Tanakh Job 7:17
    ref: Job 7:17
    book: Job
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 18740
    text: What is man, that Thou shouldest magnify him, And that Thou shouldest set Thy heart upon him,
    translation: JPS 1917
    original: מָה־אֱנוֹשׁ כִּי תְגַדְּלֶנּוּ וְכִי־תָשִׁית אֵלָיו לִבֶּךָ׃
    hebrewPlain: מה אנוש כי תגדלנו וכי תשית אליו לבך
    kjvRefs:
    - Job 7:17
    kjvOsis:
    - Job.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.18
    scripture: tanakh
    name: Tanakh Job 7:18
    ref: Job 7:18
    book: Job
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 18741
    text: And that Thou shouldest remember him every morning, And try him every moment?
    translation: JPS 1917
    original: וַתִּפְקְדֶנּוּ לִבְקָרִים לִרְגָעִים תִּבְחָנֶנּוּ׃
    hebrewPlain: ותפקדנו לבקרים לרגעים תבחננו
    kjvRefs:
    - Job 7:18
    kjvOsis:
    - Job.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.19
    scripture: tanakh
    name: Tanakh Job 7:19
    ref: Job 7:19
    book: Job
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 18742
    text: How long wilt Thou not look away from me, Nor let me alone till I swallow down my spittle?
    translation: JPS 1917
    original: כַּמָּה לֹא־תִשְׁעֶה מִמֶּנִּי לֹא־תַרְפֵּנִי עַד־בִּלְעִי רֻקִּי׃
    hebrewPlain: כמה לא תשעה ממני לא תרפני עד בלעי רקי
    kjvRefs:
    - Job 7:19
    kjvOsis:
    - Job.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.20
    scripture: tanakh
    name: Tanakh Job 7:20
    ref: Job 7:20
    book: Job
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 18743
    text: If I have sinned, what do I unto Thee, O Thou watcher of men? Why hast Thou set me as a mark for Thee, So that I am a burden to myself?
    translation: JPS 1917
    original: חָטָאתִי מָה אֶפְעַל לָךְ נֹצֵר הָאָדָם לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ וָאֶהְיֶה עָלַי לְמַשָּׂא׃
    hebrewPlain: חטאתי מה אפעל לך נצר האדם למה שמתני למפגע לך ואהיה עלי למשא
    kjvRefs:
    - Job 7:20
    kjvOsis:
    - Job.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.7.21
    scripture: tanakh
    name: Tanakh Job 7:21
    ref: Job 7:21
    book: Job
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 18744
    text: And why dost Thou not pardon my transgression, And take away mine iniquity? For now shall I lie down in the dust; And Thou wilt seek me, but I shall not be.
    translation: JPS 1917
    original: וּמֶה לֹא־תִשָּׂא פִשְׁעִי וְתַעֲבִיר אֶת־עֲוֺנִי כִּי־עַתָּה לֶעָפָר אֶשְׁכָּב וְשִׁחֲרְתַּנִי וְאֵינֶנִּי׃
    hebrewPlain: ומה לא תשא פשעי ותעביר את עוני כי עתה לעפר אשכב ושחרתני ואינני
    kjvRefs:
    - Job 7:21
    kjvOsis:
    - Job.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.7
- type: TanakhVerse
  data:
    osis: Job.8.1
    scripture: tanakh
    name: Tanakh Job 8:1
    ref: Job 8:1
    book: Job
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 18745
    text: 'Then answered Bildad the Shuhite, and said:'
    translation: JPS 1917
    original: וַיַּעַן בִּלְדַּד הַשּׁוּחִי וַיֹאמַר׃
    hebrewPlain: ויען בלדד השוחי ויאמר
    kjvRefs:
    - Job 8:1
    kjvOsis:
    - Job.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.2
    scripture: tanakh
    name: Tanakh Job 8:2
    ref: Job 8:2
    book: Job
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 18746
    text: How long wilt thou speak these things, Seeing that the words of thy mouth are as a mighty wind?
    translation: JPS 1917
    original: עַד־אָן תְּמַלֶּל־אֵלֶּה וְרוּחַ כַּבִּיר אִמְרֵי־פִיךָ׃
    hebrewPlain: עד אן תמלל אלה ורוח כביר אמרי פיך
    kjvRefs:
    - Job 8:2
    kjvOsis:
    - Job.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.3
    scripture: tanakh
    name: Tanakh Job 8:3
    ref: Job 8:3
    book: Job
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 18747
    text: Doth God pervert judgment? Or doth the Almighty pervert justice?
    translation: JPS 1917
    original: הַאֵל יְעַוֵּת מִשְׁפָּט וְאִם־שַׁדַּי יְעַוֵּת־צֶדֶק׃
    hebrewPlain: האל יעות משפט ואם שדי יעות צדק
    kjvRefs:
    - Job 8:3
    kjvOsis:
    - Job.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.4
    scripture: tanakh
    name: Tanakh Job 8:4
    ref: Job 8:4
    book: Job
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 18748
    text: If thy children sinned against Him, He delivered them into the hand of their transgression.
    translation: JPS 1917
    original: אִם־בָּנֶיךָ חָטְאוּ־לוֹ וַיְשַׁלְּחֵם בְּיַד־פִּשְׁעָם׃
    hebrewPlain: אם בניך חטאו לו וישלחם ביד פשעם
    kjvRefs:
    - Job 8:4
    kjvOsis:
    - Job.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.5
    scripture: tanakh
    name: Tanakh Job 8:5
    ref: Job 8:5
    book: Job
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 18749
    text: If thou wouldest seek earnestly unto God, And make thy supplication to the Almighty;
    translation: JPS 1917
    original: אִם־אַתָּה תְּשַׁחֵר אֶל־אֵל וְאֶל־שַׁדַּי תִּתְחַנָּן׃
    hebrewPlain: אם אתה תשחר אל אל ואל שדי תתחנן
    kjvRefs:
    - Job 8:5
    kjvOsis:
    - Job.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.6
    scripture: tanakh
    name: Tanakh Job 8:6
    ref: Job 8:6
    book: Job
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 18750
    text: If thou wert pure and upright; Surely now He would awake for thee, And make the habitation of thy righteousness prosperous.
    translation: JPS 1917
    original: אִם־זַךְ וְיָשָׁר אָתָּה כִּי־עַתָּה יָעִיר עָלֶיךָ וְשִׁלַּם נְוַת צִדְקֶךָ׃
    hebrewPlain: אם זך וישר אתה כי עתה יעיר עליך ושלם נות צדקך
    kjvRefs:
    - Job 8:6
    kjvOsis:
    - Job.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.7
    scripture: tanakh
    name: Tanakh Job 8:7
    ref: Job 8:7
    book: Job
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 18751
    text: And though thy beginning was small, Yet thy end should greatly increase.
    translation: JPS 1917
    original: וְהָיָה רֵאשִׁיתְךָ מִצְעָר וְאַחֲרִיתְךָ יִשְׂגֶּה מְאֹד׃
    hebrewPlain: והיה ראשיתך מצער ואחריתך ישגה מאד
    kjvRefs:
    - Job 8:7
    kjvOsis:
    - Job.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.8
    scripture: tanakh
    name: Tanakh Job 8:8
    ref: Job 8:8
    book: Job
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 18752
    text: For inquire, I pray thee, of the former generation, And apply thyself to that which their fathers have searched out—
    translation: JPS 1917
    original: כִּי־שְׁאַל־נָא לְדֹר רִישׁוֹן וְכוֹנֵן לְחֵקֶר אֲבוֹתָם׃
    hebrewPlain: כי שאל נא לדר רישון וכונן לחקר אבותם
    kjvRefs:
    - Job 8:8
    kjvOsis:
    - Job.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.9
    scripture: tanakh
    name: Tanakh Job 8:9
    ref: Job 8:9
    book: Job
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 18753
    text: For we are but of yesterday, and know nothing, Because our days upon earth are a shadow—
    translation: JPS 1917
    original: כִּי־תְמוֹל אֲנַחְנוּ וְלֹא נֵדָע כִּי צֵל יָמֵינוּ עֲלֵי־אָרֶץ׃
    hebrewPlain: כי תמול אנחנו ולא נדע כי צל ימינו עלי ארץ
    kjvRefs:
    - Job 8:9
    kjvOsis:
    - Job.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.10
    scripture: tanakh
    name: Tanakh Job 8:10
    ref: Job 8:10
    book: Job
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 18754
    text: Shall not they teach thee, and tell thee, And utter words out of their heart?
    translation: JPS 1917
    original: הֲלֹא־הֵם יוֹרוּךָ יֹאמְרוּ לָךְ וּמִלִּבָּם יוֹצִאוּ מִלִּים׃
    hebrewPlain: הלא הם יורוך יאמרו לך ומלבם יוצאו מלים
    kjvRefs:
    - Job 8:10
    kjvOsis:
    - Job.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.11
    scripture: tanakh
    name: Tanakh Job 8:11
    ref: Job 8:11
    book: Job
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 18755
    text: Can the rush shoot up without mire? Can the reed-grass grow without water?
    translation: JPS 1917
    original: הֲיִגְאֶה־גֹּמֶא בְּלֹא בִצָּה יִשְׂגֶּה־אָחוּ בְלִי־מָיִם׃
    hebrewPlain: היגאה גמא בלא בצה ישגה אחו בלי מים
    kjvRefs:
    - Job 8:11
    kjvOsis:
    - Job.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.12
    scripture: tanakh
    name: Tanakh Job 8:12
    ref: Job 8:12
    book: Job
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 18756
    text: Whilst it is yet in its greenness, and not cut down, It withereth before any other herb.
    translation: JPS 1917
    original: עֹדֶנּוּ בְאִבּוֹ לֹא יִקָּטֵף וְלִפְנֵי כָל־חָצִיר יִיבָשׁ׃
    hebrewPlain: עדנו באבו לא יקטף ולפני כל חציר ייבש
    kjvRefs:
    - Job 8:12
    kjvOsis:
    - Job.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.13
    scripture: tanakh
    name: Tanakh Job 8:13
    ref: Job 8:13
    book: Job
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 18757
    text: So are the paths of all that forget God; And the hope of the godless man shall perish;
    translation: JPS 1917
    original: כֵּן אָרְחוֹת כָּל־שֹׁכְחֵי אֵל וְתִקְוַת חָנֵף תֹּאבֵד׃
    hebrewPlain: כן ארחות כל שכחי אל ותקות חנף תאבד
    kjvRefs:
    - Job 8:13
    kjvOsis:
    - Job.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.14
    scripture: tanakh
    name: Tanakh Job 8:14
    ref: Job 8:14
    book: Job
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 18758
    text: Whose confidence is gossamer, And whose trust is a spider’s web.
    translation: JPS 1917
    original: אֲשֶׁר־יָקוֹט כִּסְלוֹ וּבֵית עַכָּבִישׁ מִבְטַחוֹ׃
    hebrewPlain: אשר יקוט כסלו ובית עכביש מבטחו
    kjvRefs:
    - Job 8:14
    kjvOsis:
    - Job.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.15
    scripture: tanakh
    name: Tanakh Job 8:15
    ref: Job 8:15
    book: Job
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 18759
    text: He shall lean upon his house, but it shall not stand; He shall hold fast thereby, but it shall not endure.
    translation: JPS 1917
    original: יִשָּׁעֵן עַל־בֵּיתוֹ וְלֹא יַעֲמֹד יַחֲזִיק בּוֹ וְלֹא יָקוּם׃
    hebrewPlain: ישען על ביתו ולא יעמד יחזיק בו ולא יקום
    kjvRefs:
    - Job 8:15
    kjvOsis:
    - Job.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.16
    scripture: tanakh
    name: Tanakh Job 8:16
    ref: Job 8:16
    book: Job
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 18760
    text: He is green before the sun, And his shoots go forth over his garden.
    translation: JPS 1917
    original: רָטֹב הוּא לִפְנֵי־שָׁמֶשׁ וְעַל גַּנָּתוֹ יֹנַקְתּוֹ תֵצֵא׃
    hebrewPlain: רטב הוא לפני שמש ועל גנתו ינקתו תצא
    kjvRefs:
    - Job 8:16
    kjvOsis:
    - Job.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.17
    scripture: tanakh
    name: Tanakh Job 8:17
    ref: Job 8:17
    book: Job
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 18761
    text: His roots are wrapped about the heap, He beholdeth the place of stones.
    translation: JPS 1917
    original: עַל־גַּל שָׁרָשָׁיו יְסֻבָּכוּ בֵּית אֲבָנִים יֶחֱזֶה׃
    hebrewPlain: על גל שרשיו יסבכו בית אבנים יחזה
    kjvRefs:
    - Job 8:17
    kjvOsis:
    - Job.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.18
    scripture: tanakh
    name: Tanakh Job 8:18
    ref: Job 8:18
    book: Job
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 18762
    text: 'If he be destroyed from his place, Then it shall deny him: ‘I have not seen thee.’'
    translation: JPS 1917
    original: אִם־יְבַלְּעֶנּוּ מִמְּקוֹמוֹ וְכִחֶשׁ בּוֹ לֹא רְאִיתִיךָ׃
    hebrewPlain: אם יבלענו ממקומו וכחש בו לא ראיתיך
    kjvRefs:
    - Job 8:18
    kjvOsis:
    - Job.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.19
    scripture: tanakh
    name: Tanakh Job 8:19
    ref: Job 8:19
    book: Job
    section: ketuvim
    chapter: 8
    verse: 19
    ordinal: 18763
    text: Behold, this is the joy of his way, And out of the earth shall others spring.
    translation: JPS 1917
    original: הֶן־הוּא מְשׂוֹשׂ דַּרְכּוֹ וּמֵעָפָר אַחֵר יִצְמָחוּ׃
    hebrewPlain: הן הוא משוש דרכו ומעפר אחר יצמחו
    kjvRefs:
    - Job 8:19
    kjvOsis:
    - Job.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.20
    scripture: tanakh
    name: Tanakh Job 8:20
    ref: Job 8:20
    book: Job
    section: ketuvim
    chapter: 8
    verse: 20
    ordinal: 18764
    text: Behold, God will not cast away an innocent man, Neither will He uphold the evil-doers;
    translation: JPS 1917
    original: הֶן־אֵל לֹא יִמְאַס־תָּם וְלֹא־יַחֲזִיק בְּיַד־מְרֵעִים׃
    hebrewPlain: הן אל לא ימאס תם ולא יחזיק ביד מרעים
    kjvRefs:
    - Job 8:20
    kjvOsis:
    - Job.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.21
    scripture: tanakh
    name: Tanakh Job 8:21
    ref: Job 8:21
    book: Job
    section: ketuvim
    chapter: 8
    verse: 21
    ordinal: 18765
    text: Till He fill thy mouth with laughter, And thy lips with shouting.
    translation: JPS 1917
    original: עַד־יְמַלֵּה שְׂחוֹק פִּיךָ וּשְׂפָתֶיךָ תְרוּעָה׃
    hebrewPlain: עד ימלה שחוק פיך ושפתיך תרועה
    kjvRefs:
    - Job 8:21
    kjvOsis:
    - Job.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.8.22
    scripture: tanakh
    name: Tanakh Job 8:22
    ref: Job 8:22
    book: Job
    section: ketuvim
    chapter: 8
    verse: 22
    ordinal: 18766
    text: They that hate thee shall be clothed with shame; And the tent of the wicked shall be no more.
    translation: JPS 1917
    original: שֹׂנְאֶיךָ יִלְבְּשׁוּ־בֹשֶׁת וְאֹהֶל רְשָׁעִים אֵינֶנּוּ׃
    hebrewPlain: שנאיך ילבשו בשת ואהל רשעים איננו
    kjvRefs:
    - Job 8:22
    kjvOsis:
    - Job.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.8
- type: TanakhVerse
  data:
    osis: Job.9.1
    scripture: tanakh
    name: Tanakh Job 9:1
    ref: Job 9:1
    book: Job
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 18767
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 9:1
    kjvOsis:
    - Job.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.2
    scripture: tanakh
    name: Tanakh Job 9:2
    ref: Job 9:2
    book: Job
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 18768
    text: Of a truth I know that it is so; And how can man be just with God?
    translation: JPS 1917
    original: אָמְנָם יָדַעְתִּי כִי־כֵן וּמַה־יִּצְדַּק אֱנוֹשׁ עִם־אֵל׃
    hebrewPlain: אמנם ידעתי כי כן ומה יצדק אנוש עם אל
    kjvRefs:
    - Job 9:2
    kjvOsis:
    - Job.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.3
    scripture: tanakh
    name: Tanakh Job 9:3
    ref: Job 9:3
    book: Job
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 18769
    text: If one should desire to contend with Him, He could not answer Him one of a thousand.
    translation: JPS 1917
    original: אִם־יַחְפֹּץ לָרִיב עִמּוֹ לֹא־יַעֲנֶנּוּ אַחַת מִנִּי־אָלֶף׃
    hebrewPlain: אם יחפץ לריב עמו לא יעננו אחת מני אלף
    kjvRefs:
    - Job 9:3
    kjvOsis:
    - Job.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.4
    scripture: tanakh
    name: Tanakh Job 9:4
    ref: Job 9:4
    book: Job
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 18770
    text: He is wise in heart, and mighty in strength; Who hath hardened himself against Him, and prospered?
    translation: JPS 1917
    original: חֲכַם לֵבָב וְאַמִּיץ כֹּחַ מִי־הִקְשָׁה אֵלָיו וַיִּשְׁלָם׃
    hebrewPlain: חכם לבב ואמיץ כח מי הקשה אליו וישלם
    kjvRefs:
    - Job 9:4
    kjvOsis:
    - Job.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.5
    scripture: tanakh
    name: Tanakh Job 9:5
    ref: Job 9:5
    book: Job
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 18771
    text: Who removeth the mountains, and they know it not, When He overturneth them in His anger.
    translation: JPS 1917
    original: הַמַּעְתִּיק הָרִים וְלֹא יָדָעוּ אֲשֶׁר הֲפָכָם בְּאַפּוֹ׃
    hebrewPlain: המעתיק הרים ולא ידעו אשר הפכם באפו
    kjvRefs:
    - Job 9:5
    kjvOsis:
    - Job.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.6
    scripture: tanakh
    name: Tanakh Job 9:6
    ref: Job 9:6
    book: Job
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 18772
    text: Who shaketh the earth out of her place, And the pillars thereof tremble.
    translation: JPS 1917
    original: הַמַּרְגִּיז אֶרֶץ מִמְּקוֹמָהּ וְעַמּוּדֶיהָ יִתְפַלָּצוּן׃
    hebrewPlain: המרגיז ארץ ממקומה ועמודיה יתפלצון
    kjvRefs:
    - Job 9:6
    kjvOsis:
    - Job.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.7
    scripture: tanakh
    name: Tanakh Job 9:7
    ref: Job 9:7
    book: Job
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 18773
    text: Who commandeth the sun, and it riseth not; And sealeth up the stars.
    translation: JPS 1917
    original: הָאֹמֵר לַחֶרֶס וְלֹא יִזְרָח וּבְעַד כּוֹכָבִים יַחְתֹּם׃
    hebrewPlain: האמר לחרס ולא יזרח ובעד כוכבים יחתם
    kjvRefs:
    - Job 9:7
    kjvOsis:
    - Job.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.8
    scripture: tanakh
    name: Tanakh Job 9:8
    ref: Job 9:8
    book: Job
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 18774
    text: Who alone stretcheth out the heavens, And treadeth upon the waves of the sea.
    translation: JPS 1917
    original: נֹטֶה שָׁמַיִם לְבַדּוֹ וְדוֹרֵךְ עַל־בָּמֳתֵי יָם׃
    hebrewPlain: נטה שמים לבדו ודורך על במתי ים
    kjvRefs:
    - Job 9:8
    kjvOsis:
    - Job.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.9
    scripture: tanakh
    name: Tanakh Job 9:9
    ref: Job 9:9
    book: Job
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 18775
    text: Who maketh the Bear, Orion, and the Pleiades, And the chambers of the south.
    translation: JPS 1917
    original: עֹשֶׂה־עָשׁ כְּסִיל וְכִימָה וְחַדְרֵי תֵמָן׃
    hebrewPlain: עשה עש כסיל וכימה וחדרי תמן
    kjvRefs:
    - Job 9:9
    kjvOsis:
    - Job.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.10
    scripture: tanakh
    name: Tanakh Job 9:10
    ref: Job 9:10
    book: Job
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 18776
    text: Who doeth great things past finding out; Yea, marvellous things without number.
    translation: JPS 1917
    original: עֹשֶׂה גְדֹלוֹת עַד־אֵין חֵקֶר וְנִפְלָאוֹת עַד־אֵין מִסְפָּר׃
    hebrewPlain: עשה גדלות עד אין חקר ונפלאות עד אין מספר
    kjvRefs:
    - Job 9:10
    kjvOsis:
    - Job.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.11
    scripture: tanakh
    name: Tanakh Job 9:11
    ref: Job 9:11
    book: Job
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 18777
    text: Lo, He goeth by me, and I see Him not. He passeth on also, but I perceive Him not.
    translation: JPS 1917
    original: הֵן יַעֲבֹר עָלַי וְלֹא אֶרְאֶה וְיַחֲלֹף וְלֹא־אָבִין לוֹ׃
    hebrewPlain: הן יעבר עלי ולא אראה ויחלף ולא אבין לו
    kjvRefs:
    - Job 9:11
    kjvOsis:
    - Job.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.12
    scripture: tanakh
    name: Tanakh Job 9:12
    ref: Job 9:12
    book: Job
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 18778
    text: 'Behold, He snatcheth away, who can hinder Him? Who will say unto Him: ‘What doest Thou?’'
    translation: JPS 1917
    original: הֵן יַחְתֹּף מִי יְשִׁיבֶנּוּ מִי־יֹאמַר אֵלָיו מַה־תַּעֲשֶׂה׃
    hebrewPlain: הן יחתף מי ישיבנו מי יאמר אליו מה תעשה
    kjvRefs:
    - Job 9:12
    kjvOsis:
    - Job.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.13
    scripture: tanakh
    name: Tanakh Job 9:13
    ref: Job 9:13
    book: Job
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 18779
    text: God will not withdraw His anger; The helpers of Rahab did stoop under Him.
    translation: JPS 1917
    original: אֱלוֹהַּ לֹא־יָשִׁיב אַפּוֹ תחתו [תַּחְתָּיו] שָׁחֲחוּ עֹזְרֵי רָהַב׃
    hebrewPlain: אלוה לא ישיב אפו תחתו [תחתיו] שחחו עזרי רהב
    kjvRefs:
    - Job 9:13
    kjvOsis:
    - Job.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.14
    scripture: tanakh
    name: Tanakh Job 9:14
    ref: Job 9:14
    book: Job
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 18780
    text: How much less shall I answer Him, And choose out my arguments with Him?
    translation: JPS 1917
    original: אַף כִּי־אָנֹכִי אֶעֱנֶנּוּ אֶבְחֲרָה דְבָרַי עִמּוֹ׃
    hebrewPlain: אף כי אנכי אעננו אבחרה דברי עמו
    kjvRefs:
    - Job 9:14
    kjvOsis:
    - Job.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.15
    scripture: tanakh
    name: Tanakh Job 9:15
    ref: Job 9:15
    book: Job
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 18781
    text: Whom, though I were righteous, yet would I not answer; I would make supplication to Him that contendeth with me.
    translation: JPS 1917
    original: אֲשֶׁר אִם־צָדַקְתִּי לֹא אֶעֱנֶה לִמְשֹׁפְטִי אֶתְחַנָּן׃
    hebrewPlain: אשר אם צדקתי לא אענה למשפטי אתחנן
    kjvRefs:
    - Job 9:15
    kjvOsis:
    - Job.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.16
    scripture: tanakh
    name: Tanakh Job 9:16
    ref: Job 9:16
    book: Job
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 18782
    text: If I had called, and He had answered me; Yet would I not believe that He would hearken unto my voice—
    translation: JPS 1917
    original: אִם־קָרָאתִי וַיַּעֲנֵנִי לֹא־אַאֲמִין כִּי־יַאֲזִין קוֹלִי׃
    hebrewPlain: אם קראתי ויענני לא אאמין כי יאזין קולי
    kjvRefs:
    - Job 9:16
    kjvOsis:
    - Job.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.17
    scripture: tanakh
    name: Tanakh Job 9:17
    ref: Job 9:17
    book: Job
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 18783
    text: He that would break me with a tempest, And multiply my wounds without cause;
    translation: JPS 1917
    original: אֲשֶׁר־בִּשְׂעָרָה יְשׁוּפֵנִי וְהִרְבָּה פְצָעַי חִנָּם׃
    hebrewPlain: אשר בשערה ישופני והרבה פצעי חנם
    kjvRefs:
    - Job 9:17
    kjvOsis:
    - Job.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.18
    scripture: tanakh
    name: Tanakh Job 9:18
    ref: Job 9:18
    book: Job
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 18784
    text: That would not suffer me to take my breath, But fill me with bitterness.
    translation: JPS 1917
    original: לֹא־יִתְּנֵנִי הָשֵׁב רוּחִי כִּי יַשְׂבִּעַנִי מַמְּרֹרִים׃
    hebrewPlain: לא יתנני השב רוחי כי ישבעני ממררים
    kjvRefs:
    - Job 9:18
    kjvOsis:
    - Job.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.19
    scripture: tanakh
    name: Tanakh Job 9:19
    ref: Job 9:19
    book: Job
    section: ketuvim
    chapter: 9
    verse: 19
    ordinal: 18785
    text: If it be a matter of strength, lo, He is mighty! And if of justice, who will appoint me a time? .
    translation: JPS 1917
    original: אִם־לְכֹחַ אַמִּיץ הִנֵּה וְאִם־לְמִשְׁפָּט מִי יוֹעִידֵנִי׃
    hebrewPlain: אם לכח אמיץ הנה ואם למשפט מי יועידני
    kjvRefs:
    - Job 9:19
    kjvOsis:
    - Job.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.20
    scripture: tanakh
    name: Tanakh Job 9:20
    ref: Job 9:20
    book: Job
    section: ketuvim
    chapter: 9
    verse: 20
    ordinal: 18786
    text: Though I be righteous, mine own mouth shall condemn me; Though I be innocent, He shall prove me perverse.
    translation: JPS 1917
    original: אִם־אֶצְדָּק פִּי יַרְשִׁיעֵנִי תָּם־אָנִי וַיַּעְקְשֵׁנִי׃
    hebrewPlain: אם אצדק פי ירשיעני תם אני ויעקשני
    kjvRefs:
    - Job 9:20
    kjvOsis:
    - Job.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.21
    scripture: tanakh
    name: Tanakh Job 9:21
    ref: Job 9:21
    book: Job
    section: ketuvim
    chapter: 9
    verse: 21
    ordinal: 18787
    text: I am innocent—I regard not myself, I despise my life.
    translation: JPS 1917
    original: תָּם־אָנִי לֹא־אֵדַע נַפְשִׁי אֶמְאַס חַיָּי׃
    hebrewPlain: תם אני לא אדע נפשי אמאס חיי
    kjvRefs:
    - Job 9:21
    kjvOsis:
    - Job.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.22
    scripture: tanakh
    name: Tanakh Job 9:22
    ref: Job 9:22
    book: Job
    section: ketuvim
    chapter: 9
    verse: 22
    ordinal: 18788
    text: 'It is all one—therefore I say: He destroyeth the innocent and the wicked.'
    translation: JPS 1917
    original: אַחַת הִיא עַל־כֵּן אָמַרְתִּי תָּם וְרָשָׁע הוּא מְכַלֶּה׃
    hebrewPlain: אחת היא על כן אמרתי תם ורשע הוא מכלה
    kjvRefs:
    - Job 9:22
    kjvOsis:
    - Job.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.23
    scripture: tanakh
    name: Tanakh Job 9:23
    ref: Job 9:23
    book: Job
    section: ketuvim
    chapter: 9
    verse: 23
    ordinal: 18789
    text: If the scourge slay suddenly, He will mock at the calamity of the guiltless.
    translation: JPS 1917
    original: אִם־שׁוֹט יָמִית פִּתְאֹם לְמַסַּת נְקִיִּם יִלְעָג׃
    hebrewPlain: אם שוט ימית פתאם למסת נקים ילעג
    kjvRefs:
    - Job 9:23
    kjvOsis:
    - Job.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.24
    scripture: tanakh
    name: Tanakh Job 9:24
    ref: Job 9:24
    book: Job
    section: ketuvim
    chapter: 9
    verse: 24
    ordinal: 18790
    text: The earth is given into the hand of the wicked; He covereth the faces of the judges thereof; If it be not He, who then is it?
    translation: JPS 1917
    original: אֶרֶץ נִתְּנָה בְיַד־רָשָׁע פְּנֵי־שֹׁפְטֶיהָ יְכַסֶּה אִם־לֹא אֵפוֹא מִי־הוּא׃
    hebrewPlain: ארץ נתנה ביד רשע פני שפטיה יכסה אם לא אפוא מי הוא
    kjvRefs:
    - Job 9:24
    kjvOsis:
    - Job.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.25
    scripture: tanakh
    name: Tanakh Job 9:25
    ref: Job 9:25
    book: Job
    section: ketuvim
    chapter: 9
    verse: 25
    ordinal: 18791
    text: Now my days are swifter than a runner; They flee away, they see no good.
    translation: JPS 1917
    original: וְיָמַי קַלּוּ מִנִּי־רָץ בָּרְחוּ לֹא־רָאוּ טוֹבָה׃
    hebrewPlain: וימי קלו מני רץ ברחו לא ראו טובה
    kjvRefs:
    - Job 9:25
    kjvOsis:
    - Job.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.26
    scripture: tanakh
    name: Tanakh Job 9:26
    ref: Job 9:26
    book: Job
    section: ketuvim
    chapter: 9
    verse: 26
    ordinal: 18792
    text: They are passed away as the swift ships; As the vulture that swoopeth on the prey.
    translation: JPS 1917
    original: חָלְפוּ עִם־אֳנִיּוֹת אֵבֶה כְּנֶשֶׁר יָטוּשׂ עֲלֵי־אֹכֶל׃
    hebrewPlain: חלפו עם אניות אבה כנשר יטוש עלי אכל
    kjvRefs:
    - Job 9:26
    kjvOsis:
    - Job.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.27
    scripture: tanakh
    name: Tanakh Job 9:27
    ref: Job 9:27
    book: Job
    section: ketuvim
    chapter: 9
    verse: 27
    ordinal: 18793
    text: 'If I say: ‘I will forget my complaint, I will put off my sad countenance, and be of good cheer’,'
    translation: JPS 1917
    original: אִם־אָמְרִי אֶשְׁכְּחָה שִׂיחִי אֶעֶזְבָה פָנַי וְאַבְלִיגָה׃
    hebrewPlain: אם אמרי אשכחה שיחי אעזבה פני ואבליגה
    kjvRefs:
    - Job 9:27
    kjvOsis:
    - Job.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.28
    scripture: tanakh
    name: Tanakh Job 9:28
    ref: Job 9:28
    book: Job
    section: ketuvim
    chapter: 9
    verse: 28
    ordinal: 18794
    text: I am afraid of all my pains, I know that Thou wilt not hold me guiltless.
    translation: JPS 1917
    original: יָגֹרְתִּי כָל־עַצְּבֹתָי יָדַעְתִּי כִּי־לֹא תְנַקֵּנִי׃
    hebrewPlain: יגרתי כל עצבתי ידעתי כי לא תנקני
    kjvRefs:
    - Job 9:28
    kjvOsis:
    - Job.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.29
    scripture: tanakh
    name: Tanakh Job 9:29
    ref: Job 9:29
    book: Job
    section: ketuvim
    chapter: 9
    verse: 29
    ordinal: 18795
    text: I shall be condemned; Why then do I labour in vain?
    translation: JPS 1917
    original: אָנֹכִי אֶרְשָׁע לָמָּה־זֶּה הֶבֶל אִיגָע׃
    hebrewPlain: אנכי ארשע למה זה הבל איגע
    kjvRefs:
    - Job 9:29
    kjvOsis:
    - Job.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.30
    scripture: tanakh
    name: Tanakh Job 9:30
    ref: Job 9:30
    book: Job
    section: ketuvim
    chapter: 9
    verse: 30
    ordinal: 18796
    text: If I wash myself with snow water, And make my hands never so clean;
    translation: JPS 1917
    original: אִם־הִתְרָחַצְתִּי במו־[בְמֵי־] שָׁלֶג וַהֲזִכּוֹתִי בְּבֹר כַּפָּי׃
    hebrewPlain: אם התרחצתי במו [במי ] שלג והזכותי בבר כפי
    kjvRefs:
    - Job 9:30
    kjvOsis:
    - Job.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.31
    scripture: tanakh
    name: Tanakh Job 9:31
    ref: Job 9:31
    book: Job
    section: ketuvim
    chapter: 9
    verse: 31
    ordinal: 18797
    text: Yet wilt Thou plunge me in the ditch, And mine own clothes shall abhor me.
    translation: JPS 1917
    original: אָז בַּשַּׁחַת תִּטְבְּלֵנִי וְתִעֲבוּנִי שַׂלְמוֹתָי׃
    hebrewPlain: אז בשחת תטבלני ותעבוני שלמותי
    kjvRefs:
    - Job 9:31
    kjvOsis:
    - Job.9.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.32
    scripture: tanakh
    name: Tanakh Job 9:32
    ref: Job 9:32
    book: Job
    section: ketuvim
    chapter: 9
    verse: 32
    ordinal: 18798
    text: For He is not a man, as I am, that I should answer Him, That we should come together in judgment.
    translation: JPS 1917
    original: כִּי־לֹא־אִישׁ כָּמֹנִי אֶעֱנֶנּוּ נָבוֹא יַחְדָּו בַּמִּשְׁפָּט׃
    hebrewPlain: כי לא איש כמני אעננו נבוא יחדו במשפט
    kjvRefs:
    - Job 9:32
    kjvOsis:
    - Job.9.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.33
    scripture: tanakh
    name: Tanakh Job 9:33
    ref: Job 9:33
    book: Job
    section: ketuvim
    chapter: 9
    verse: 33
    ordinal: 18799
    text: There is no arbiter betwixt us, That might lay his hand upon us both.
    translation: JPS 1917
    original: לֹא יֵשׁ־בֵּינֵינוּ מוֹכִיחַ יָשֵׁת יָדוֹ עַל־שְׁנֵינוּ׃
    hebrewPlain: לא יש בינינו מוכיח ישת ידו על שנינו
    kjvRefs:
    - Job 9:33
    kjvOsis:
    - Job.9.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.34
    scripture: tanakh
    name: Tanakh Job 9:34
    ref: Job 9:34
    book: Job
    section: ketuvim
    chapter: 9
    verse: 34
    ordinal: 18800
    text: Let Him take His rod away from me, And let not His terror make me afraid;
    translation: JPS 1917
    original: יָסֵר מֵעָלַי שִׁבְטוֹ וְאֵמָתוֹ אַל־תְּבַעֲתַנִּי׃
    hebrewPlain: יסר מעלי שבטו ואמתו אל תבעתני
    kjvRefs:
    - Job 9:34
    kjvOsis:
    - Job.9.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.9.35
    scripture: tanakh
    name: Tanakh Job 9:35
    ref: Job 9:35
    book: Job
    section: ketuvim
    chapter: 9
    verse: 35
    ordinal: 18801
    text: Then would I speak, and not fear Him; For I am not so with myself.
    translation: JPS 1917
    original: אַדַבְּרָה וְלֹא אִירָאֶנּוּ כִּי לֹא־כֵן אָנֹכִי עִמָּדִי׃
    hebrewPlain: אדברה ולא איראנו כי לא כן אנכי עמדי
    kjvRefs:
    - Job 9:35
    kjvOsis:
    - Job.9.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.9
- type: TanakhVerse
  data:
    osis: Job.10.1
    scripture: tanakh
    name: Tanakh Job 10:1
    ref: Job 10:1
    book: Job
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 18802
    text: My soul is weary of my life; I will give free course to my complaint; I will speak in the bitterness of my soul.
    translation: JPS 1917
    original: נָקְטָה נַפְשִׁי בְּחַיָּי אֶעֶזְבָה עָלַי שִׂיחִי אֲדַבְּרָה בְּמַר נַפְשִׁי׃
    hebrewPlain: נקטה נפשי בחיי אעזבה עלי שיחי אדברה במר נפשי
    kjvRefs:
    - Job 10:1
    kjvOsis:
    - Job.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.2
    scripture: tanakh
    name: Tanakh Job 10:2
    ref: Job 10:2
    book: Job
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 18803
    text: 'I will say unto God: Do not condemn me; Make me know wherefore Thou contendest with me.'
    translation: JPS 1917
    original: אֹמַר אֶל־אֱלוֹהַּ אַל־תַּרְשִׁיעֵנִי הוֹדִיעֵנִי עַל מַה־תְּרִיבֵנִי׃
    hebrewPlain: אמר אל אלוה אל תרשיעני הודיעני על מה תריבני
    kjvRefs:
    - Job 10:2
    kjvOsis:
    - Job.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.3
    scripture: tanakh
    name: Tanakh Job 10:3
    ref: Job 10:3
    book: Job
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 18804
    text: Is it good unto Thee that Thou shouldest oppress, That Thou shouldest despise the work of Thy hands, And shine upon the counsel of the wicked?
    translation: JPS 1917
    original: הֲטוֹב לְךָ כִּי־תַעֲשֹׁק כִּי־תִמְאַס יְגִיעַ כַּפֶּיךָ וְעַל־עֲצַת רְשָׁעִים הוֹפָעְתָּ׃
    hebrewPlain: הטוב לך כי תעשק כי תמאס יגיע כפיך ועל עצת רשעים הופעת
    kjvRefs:
    - Job 10:3
    kjvOsis:
    - Job.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.4
    scripture: tanakh
    name: Tanakh Job 10:4
    ref: Job 10:4
    book: Job
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 18805
    text: Hast Thou eyes of flesh? Or seest Thou as man seeth?
    translation: JPS 1917
    original: הַעֵינֵי בָשָׂר לָךְ אִם־כִּרְאוֹת אֱנוֹשׁ תִּרְאֶה׃
    hebrewPlain: העיני בשר לך אם כראות אנוש תראה
    kjvRefs:
    - Job 10:4
    kjvOsis:
    - Job.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.5
    scripture: tanakh
    name: Tanakh Job 10:5
    ref: Job 10:5
    book: Job
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 18806
    text: Are Thy days as the days of man, Or Thy years as a man’s days,
    translation: JPS 1917
    original: הֲכִימֵי אֱנוֹשׁ יָמֶיךָ אִם־שְׁנוֹתֶיךָ כִּימֵי גָבֶר׃
    hebrewPlain: הכימי אנוש ימיך אם שנותיך כימי גבר
    kjvRefs:
    - Job 10:5
    kjvOsis:
    - Job.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.6
    scripture: tanakh
    name: Tanakh Job 10:6
    ref: Job 10:6
    book: Job
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 18807
    text: That Thou inquirest after mine iniquity, And searchest after my sin, .
    translation: JPS 1917
    original: כִּי־תְבַקֵּשׁ לַעֲוֺנִי וּלְחַטָּאתִי תִדְרוֹשׁ׃
    hebrewPlain: כי תבקש לעוני ולחטאתי תדרוש
    kjvRefs:
    - Job 10:6
    kjvOsis:
    - Job.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.7
    scripture: tanakh
    name: Tanakh Job 10:7
    ref: Job 10:7
    book: Job
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 18808
    text: Although Thou knowest that I shall not be condemned; And there is none that can deliver out of Thy hand?
    translation: JPS 1917
    original: עַל־דַּעְתְּךָ כִּי־לֹא אֶרְשָׁע וְאֵין מִיָּדְךָ מַצִּיל׃
    hebrewPlain: על דעתך כי לא ארשע ואין מידך מציל
    kjvRefs:
    - Job 10:7
    kjvOsis:
    - Job.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.8
    scripture: tanakh
    name: Tanakh Job 10:8
    ref: Job 10:8
    book: Job
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 18809
    text: Thy hands have framed me and fashioned me Together round about; yet Thou dost destroy me!
    translation: JPS 1917
    original: יָדֶיךָ עִצְּבוּנִי וַיַּעֲשׂוּנִי יַחַד סָבִיב וַתְּבַלְּעֵנִי׃
    hebrewPlain: ידיך עצבוני ויעשוני יחד סביב ותבלעני
    kjvRefs:
    - Job 10:8
    kjvOsis:
    - Job.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.9
    scripture: tanakh
    name: Tanakh Job 10:9
    ref: Job 10:9
    book: Job
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 18810
    text: Remember, I beseech Thee, that Thou hast fashioned me as clay; And wilt Thou bring me into dust again?
    translation: JPS 1917
    original: זְכָר־נָא כִּי־כַחֹמֶר עֲשִׂיתָנִי וְאֶל־עָפָר תְּשִׁיבֵנִי׃
    hebrewPlain: זכר נא כי כחמר עשיתני ואל עפר תשיבני
    kjvRefs:
    - Job 10:9
    kjvOsis:
    - Job.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.10
    scripture: tanakh
    name: Tanakh Job 10:10
    ref: Job 10:10
    book: Job
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 18811
    text: Hast Thou not poured me out as milk, And curdled me like cheese?
    translation: JPS 1917
    original: הֲלֹא כֶחָלָב תַּתִּיכֵנִי וְכַגְּבִנָּה תַּקְפִּיאֵנִי׃
    hebrewPlain: הלא כחלב תתיכני וכגבנה תקפיאני
    kjvRefs:
    - Job 10:10
    kjvOsis:
    - Job.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.11
    scripture: tanakh
    name: Tanakh Job 10:11
    ref: Job 10:11
    book: Job
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 18812
    text: Thou hast clothed me with skin and flesh, And knit me together with bones and sinews.
    translation: JPS 1917
    original: עוֹר וּבָשָׂר תַּלְבִּישֵׁנִי וּבַעֲצָמוֹת וְגִידִים תְּסֹכְכֵנִי׃
    hebrewPlain: עור ובשר תלבישני ובעצמות וגידים תסככני
    kjvRefs:
    - Job 10:11
    kjvOsis:
    - Job.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.12
    scripture: tanakh
    name: Tanakh Job 10:12
    ref: Job 10:12
    book: Job
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 18813
    text: Thou hast granted me life and favour, And Thy providence hath preserved my spirit.
    translation: JPS 1917
    original: חַיִּים וָחֶסֶד עָשִׂיתָ עִמָּדִי וּפְקֻדָּתְךָ שָׁמְרָה רוּחִי׃
    hebrewPlain: חיים וחסד עשית עמדי ופקדתך שמרה רוחי
    kjvRefs:
    - Job 10:12
    kjvOsis:
    - Job.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.13
    scripture: tanakh
    name: Tanakh Job 10:13
    ref: Job 10:13
    book: Job
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 18814
    text: Yet these things Thou didst hide in Thy heart; I know that this is with Thee;
    translation: JPS 1917
    original: וְאֵלֶּה צָפַנְתָּ בִלְבָבֶךָ יָדַעְתִּי כִּי־זֹאת עִמָּךְ׃
    hebrewPlain: ואלה צפנת בלבבך ידעתי כי זאת עמך
    kjvRefs:
    - Job 10:13
    kjvOsis:
    - Job.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.14
    scripture: tanakh
    name: Tanakh Job 10:14
    ref: Job 10:14
    book: Job
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 18815
    text: If I sin, then Thou markest me, And Thou wilt not acquit me from mine iniquity.
    translation: JPS 1917
    original: אִם־חָטָאתִי וּשְׁמַרְתָּנִי וּמֵעֲוֺנִי לֹא תְנַקֵּנִי׃
    hebrewPlain: אם חטאתי ושמרתני ומעוני לא תנקני
    kjvRefs:
    - Job 10:14
    kjvOsis:
    - Job.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.15
    scripture: tanakh
    name: Tanakh Job 10:15
    ref: Job 10:15
    book: Job
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 18816
    text: If I be wicked, woe unto me; And if I be righteous, yet shall I not lift up my head— Being filled with ignominy And looking upon mine affliction.
    translation: JPS 1917
    original: אִם־רָשַׁעְתִּי אַלְלַי לִי וְצָדַקְתִּי לֹא־אֶשָּׂא רֹאשִׁי שְׂבַע קָלוֹן וּרְאֵה עָנְיִי׃
    hebrewPlain: אם רשעתי אללי לי וצדקתי לא אשא ראשי שבע קלון וראה עניי
    kjvRefs:
    - Job 10:15
    kjvOsis:
    - Job.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.16
    scripture: tanakh
    name: Tanakh Job 10:16
    ref: Job 10:16
    book: Job
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 18817
    text: And if it exalt itself, Thou huntest me as a lion; And again Thou showest Thyself marvellous upon me.
    translation: JPS 1917
    original: וְיִגְאֶה כַּשַּׁחַל תְּצוּדֵנִי וְתָשֹׁב תִּתְפַּלָּא־בִי׃
    hebrewPlain: ויגאה כשחל תצודני ותשב תתפלא בי
    kjvRefs:
    - Job 10:16
    kjvOsis:
    - Job.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.17
    scripture: tanakh
    name: Tanakh Job 10:17
    ref: Job 10:17
    book: Job
    section: ketuvim
    chapter: 10
    verse: 17
    ordinal: 18818
    text: Thou renewest Thy witnesses against me, And increasest Thine indignation upon me; Host succeeding host against me.
    translation: JPS 1917
    original: תְּחַדֵּשׁ עֵדֶיךָ נֶגְדִּי וְתֶרֶב כַּעַשְׂךָ עִמָּדִי חֲלִיפוֹת וְצָבָא עִמִּי׃
    hebrewPlain: תחדש עדיך נגדי ותרב כעשך עמדי חליפות וצבא עמי
    kjvRefs:
    - Job 10:17
    kjvOsis:
    - Job.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.18
    scripture: tanakh
    name: Tanakh Job 10:18
    ref: Job 10:18
    book: Job
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 18819
    text: Wherefore then hast Thou brought me forth out of the womb? Would that I had perished, and no eye had seen me!
    translation: JPS 1917
    original: וְלָמָּה מֵרֶחֶם הֹצֵאתָנִי אֶגְוַע וְעַיִן לֹא־תִרְאֵנִי׃
    hebrewPlain: ולמה מרחם הצאתני אגוע ועין לא תראני
    kjvRefs:
    - Job 10:18
    kjvOsis:
    - Job.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.19
    scripture: tanakh
    name: Tanakh Job 10:19
    ref: Job 10:19
    book: Job
    section: ketuvim
    chapter: 10
    verse: 19
    ordinal: 18820
    text: I should have been as though I had not been; I should have been carried from the womb to the grave.
    translation: JPS 1917
    original: כַּאֲשֶׁר לֹא־הָיִיתִי אֶהְיֶה מִבֶּטֶן לַקֶּבֶר אוּבָל׃
    hebrewPlain: כאשר לא הייתי אהיה מבטן לקבר אובל
    kjvRefs:
    - Job 10:19
    kjvOsis:
    - Job.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.20
    scripture: tanakh
    name: Tanakh Job 10:20
    ref: Job 10:20
    book: Job
    section: ketuvim
    chapter: 10
    verse: 20
    ordinal: 18821
    text: Are not my days few? Cease then, And let me alone, that I may take comfort a little,
    translation: JPS 1917
    original: הֲלֹא־מְעַט יָמַי יחדל [וַחֲדָל] ישית [וְשִׁית] מִמֶּנִּי וְאַבְלִיגָה מְּעָט׃
    hebrewPlain: הלא מעט ימי יחדל [וחדל] ישית [ושית] ממני ואבליגה מעט
    kjvRefs:
    - Job 10:20
    kjvOsis:
    - Job.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.21
    scripture: tanakh
    name: Tanakh Job 10:21
    ref: Job 10:21
    book: Job
    section: ketuvim
    chapter: 10
    verse: 21
    ordinal: 18822
    text: Before I go whence I shall not return, Even to the land of darkness and of the shadow of death;
    translation: JPS 1917
    original: בְּטֶרֶם אֵלֵךְ וְלֹא אָשׁוּב אֶל־אֶרֶץ חֹשֶׁךְ וְצַלְמָוֶת׃
    hebrewPlain: בטרם אלך ולא אשוב אל ארץ חשך וצלמות
    kjvRefs:
    - Job 10:21
    kjvOsis:
    - Job.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.10.22
    scripture: tanakh
    name: Tanakh Job 10:22
    ref: Job 10:22
    book: Job
    section: ketuvim
    chapter: 10
    verse: 22
    ordinal: 18823
    text: A land of thick darkness, as darkness itself; A land of the shadow of death, without any order, And where the light is as darkness.
    translation: JPS 1917
    original: אֶרֶץ עֵיפָתָה כְּמוֹ אֹפֶל צַלְמָוֶת וְלֹא סְדָרִים וַתֹּפַע כְּמוֹ־אֹפֶל׃
    hebrewPlain: ארץ עיפתה כמו אפל צלמות ולא סדרים ותפע כמו אפל
    kjvRefs:
    - Job 10:22
    kjvOsis:
    - Job.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.10
- type: TanakhVerse
  data:
    osis: Job.11.1
    scripture: tanakh
    name: Tanakh Job 11:1
    ref: Job 11:1
    book: Job
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 18824
    text: 'Then answered Zophar the Naamathite, and said:'
    translation: JPS 1917
    original: וַיַּעַן צֹפַר הַנַּעֲמָתִי וַיֹּאמַר׃
    hebrewPlain: ויען צפר הנעמתי ויאמר
    kjvRefs:
    - Job 11:1
    kjvOsis:
    - Job.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.2
    scripture: tanakh
    name: Tanakh Job 11:2
    ref: Job 11:2
    book: Job
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 18825
    text: Should not the multitude of words be answered? And should a man full of talk be accounted right?
    translation: JPS 1917
    original: הֲרֹב דְּבָרִים לֹא יֵעָנֶה וְאִם־אִישׁ שְׂפָתַיִם יִצְדָּק׃
    hebrewPlain: הרב דברים לא יענה ואם איש שפתים יצדק
    kjvRefs:
    - Job 11:2
    kjvOsis:
    - Job.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.3
    scripture: tanakh
    name: Tanakh Job 11:3
    ref: Job 11:3
    book: Job
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 18826
    text: Thy boastings have made men hold their peace, And thou hast mocked, with none to make thee ashamed;
    translation: JPS 1917
    original: בַּדֶּיךָ מְתִים יַחֲרִישׁו וַתִּלְעַג וְאֵין מַכְלִם׃
    hebrewPlain: בדיך מתים יחרישו ותלעג ואין מכלם
    kjvRefs:
    - Job 11:3
    kjvOsis:
    - Job.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.4
    scripture: tanakh
    name: Tanakh Job 11:4
    ref: Job 11:4
    book: Job
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 18827
    text: 'And thou hast said: ‘My doctrine is pure, And I am clean in Thine eyes.’'
    translation: JPS 1917
    original: וַתֹּאמֶר זַךְ לִקְחִי וּבַר הָיִיתִי בְעֵינֶיךָ׃
    hebrewPlain: ותאמר זך לקחי ובר הייתי בעיניך
    kjvRefs:
    - Job 11:4
    kjvOsis:
    - Job.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.5
    scripture: tanakh
    name: Tanakh Job 11:5
    ref: Job 11:5
    book: Job
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 18828
    text: But oh that God would speak, And open His lips against thee;
    translation: JPS 1917
    original: וְאוּלָם מִי־יִתֵּן אֱלוֹהַּ דַּבֵּר וְיִפְתַּח שְׂפָתָיו עִמָּךְ׃
    hebrewPlain: ואולם מי יתן אלוה דבר ויפתח שפתיו עמך
    kjvRefs:
    - Job 11:5
    kjvOsis:
    - Job.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.6
    scripture: tanakh
    name: Tanakh Job 11:6
    ref: Job 11:6
    book: Job
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 18829
    text: And that He would tell thee the secrets of wisdom, That sound wisdom is manifold! Know therefore that God exacteth of thee less than thine iniquity deserveth.
    translation: JPS 1917
    original: וְיַגֶּד־לְךָ תַּעֲלֻמוֹת חָכְמָה כִּי־כִפְלַיִם לְתוּשִׁיָּה וְדַע כִּי־יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ׃
    hebrewPlain: ויגד לך תעלמות חכמה כי כפלים לתושיה ודע כי ישה לך אלוה מעונך
    kjvRefs:
    - Job 11:6
    kjvOsis:
    - Job.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.7
    scripture: tanakh
    name: Tanakh Job 11:7
    ref: Job 11:7
    book: Job
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 18830
    text: Canst thou find out the deep things of God? Canst thou attain unto the purpose of the Almighty?
    translation: JPS 1917
    original: הַחֵקֶר אֱלוֹהַ תִּמְצָא אִם עַד־תַּכְלִית שַׁדַּי תִּמְצָא׃
    hebrewPlain: החקר אלוה תמצא אם עד תכלית שדי תמצא
    kjvRefs:
    - Job 11:7
    kjvOsis:
    - Job.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.8
    scripture: tanakh
    name: Tanakh Job 11:8
    ref: Job 11:8
    book: Job
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 18831
    text: It is high as heaven; what canst thou do? Deeper than the nether-world; what canst thou know?
    translation: JPS 1917
    original: גָּבְהֵי שָׁמַיִם מַה־תִּפְעָל עֲמֻקָּה מִשְּׁאוֹל מַה־תֵּדָע׃
    hebrewPlain: גבהי שמים מה תפעל עמקה משאול מה תדע
    kjvRefs:
    - Job 11:8
    kjvOsis:
    - Job.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.9
    scripture: tanakh
    name: Tanakh Job 11:9
    ref: Job 11:9
    book: Job
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 18832
    text: The measure thereof is longer than the earth, and broader than the sea.
    translation: JPS 1917
    original: אֲרֻכָּה מֵאֶרֶץ מִדָּהּ וּרְחָבָה מִנִּי־יָם׃
    hebrewPlain: ארכה מארץ מדה ורחבה מני ים
    kjvRefs:
    - Job 11:9
    kjvOsis:
    - Job.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.10
    scripture: tanakh
    name: Tanakh Job 11:10
    ref: Job 11:10
    book: Job
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 18833
    text: If He pass by, and shut up, Or gather in, then who can hinder Him?
    translation: JPS 1917
    original: אִם־יַחֲלֹף וְיַסְגִּיר וְיַקְהִיל וּמִי יְשִׁיבֶנּוּ׃
    hebrewPlain: אם יחלף ויסגיר ויקהיל ומי ישיבנו
    kjvRefs:
    - Job 11:10
    kjvOsis:
    - Job.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.11
    scripture: tanakh
    name: Tanakh Job 11:11
    ref: Job 11:11
    book: Job
    section: ketuvim
    chapter: 11
    verse: 11
    ordinal: 18834
    text: For He knoweth base men; and when He seeth iniquity, will He not then consider it?
    translation: JPS 1917
    original: כִּי־הוּא יָדַע מְתֵי־שָׁוְא וַיַּרְא־אָוֶן וְלֹא יִתְבּוֹנָן׃
    hebrewPlain: כי הוא ידע מתי שוא וירא און ולא יתבונן
    kjvRefs:
    - Job 11:11
    kjvOsis:
    - Job.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.12
    scripture: tanakh
    name: Tanakh Job 11:12
    ref: Job 11:12
    book: Job
    section: ketuvim
    chapter: 11
    verse: 12
    ordinal: 18835
    text: But an empty man will get understanding, when a wild ass’ s colt is born a man.
    translation: JPS 1917
    original: וְאִישׁ נָבוּב יִלָּבֵב וְעַיִר פֶּרֶא אָדָם יִוָּלֵד׃
    hebrewPlain: ואיש נבוב ילבב ועיר פרא אדם יולד
    kjvRefs:
    - Job 11:12
    kjvOsis:
    - Job.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.13
    scripture: tanakh
    name: Tanakh Job 11:13
    ref: Job 11:13
    book: Job
    section: ketuvim
    chapter: 11
    verse: 13
    ordinal: 18836
    text: If thou set thy heart aright, and stretch out thy hands toward Him—
    translation: JPS 1917
    original: אִם־אַתָּה הֲכִינוֹתָ לִבֶּךָ וּפָרַשְׂתָּ אֵלָיו כַּפֶּךָ׃
    hebrewPlain: אם אתה הכינות לבך ופרשת אליו כפך
    kjvRefs:
    - Job 11:13
    kjvOsis:
    - Job.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.14
    scripture: tanakh
    name: Tanakh Job 11:14
    ref: Job 11:14
    book: Job
    section: ketuvim
    chapter: 11
    verse: 14
    ordinal: 18837
    text: If iniquity be in thy hand, put it far away, and let not unrighteousness dwell in thy tents—
    translation: JPS 1917
    original: אִם־אָוֶן בְּיָדְךָ הַרְחִיקֵהוּ וְאַל־תַּשְׁכֵּן בְּאֹהָלֶיךָ עַוְלָה׃
    hebrewPlain: אם און בידך הרחיקהו ואל תשכן באהליך עולה
    kjvRefs:
    - Job 11:14
    kjvOsis:
    - Job.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.15
    scripture: tanakh
    name: Tanakh Job 11:15
    ref: Job 11:15
    book: Job
    section: ketuvim
    chapter: 11
    verse: 15
    ordinal: 18838
    text: Surely then shalt thou lift up thy face without spot; Yea, thou shalt be stedfast, and shalt not fear;
    translation: JPS 1917
    original: כִּי־אָז תִּשָּׂא פָנֶיךָ מִמּוּם וְהָיִיתָ מֻצָק וְלֹא תִירָא׃
    hebrewPlain: כי אז תשא פניך ממום והיית מצק ולא תירא
    kjvRefs:
    - Job 11:15
    kjvOsis:
    - Job.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.16
    scripture: tanakh
    name: Tanakh Job 11:16
    ref: Job 11:16
    book: Job
    section: ketuvim
    chapter: 11
    verse: 16
    ordinal: 18839
    text: For thou shalt forget thy misery; Thou shalt remember it as waters that are passed away;
    translation: JPS 1917
    original: כִּי־אַתָּה עָמָל תִּשְׁכָּח כְּמַיִם עָבְרוּ תִזְכֹּר׃
    hebrewPlain: כי אתה עמל תשכח כמים עברו תזכר
    kjvRefs:
    - Job 11:16
    kjvOsis:
    - Job.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.17
    scripture: tanakh
    name: Tanakh Job 11:17
    ref: Job 11:17
    book: Job
    section: ketuvim
    chapter: 11
    verse: 17
    ordinal: 18840
    text: And thy life shall be clearer than the noonday; though there be darkness, it shall be as the morning.
    translation: JPS 1917
    original: וּמִצָּהֳרַיִם יָקוּם חָלֶד תָּעֻפָה כַּבֹּקֶר תִּהְיֶה׃
    hebrewPlain: ומצהרים יקום חלד תעפה כבקר תהיה
    kjvRefs:
    - Job 11:17
    kjvOsis:
    - Job.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.18
    scripture: tanakh
    name: Tanakh Job 11:18
    ref: Job 11:18
    book: Job
    section: ketuvim
    chapter: 11
    verse: 18
    ordinal: 18841
    text: And thou shalt be secure, because there is hope; yea, thou shalt look about thee, and shalt take thy rest in safety.
    translation: JPS 1917
    original: וּבָטַחְתָּ כִּי־יֵשׁ תִּקְוָה וְחָפַרְתָּ לָבֶטַח תִּשְׁכָּב׃
    hebrewPlain: ובטחת כי יש תקוה וחפרת לבטח תשכב
    kjvRefs:
    - Job 11:18
    kjvOsis:
    - Job.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.19
    scripture: tanakh
    name: Tanakh Job 11:19
    ref: Job 11:19
    book: Job
    section: ketuvim
    chapter: 11
    verse: 19
    ordinal: 18842
    text: Also thou shalt lie down, and none shall make thee afraid; Yea, many shall make suit unto thee.
    translation: JPS 1917
    original: וְרָבַצְתָּ וְאֵין מַחֲרִיד וְחִלּוּ פָנֶיךָ רַבִּים׃
    hebrewPlain: ורבצת ואין מחריד וחלו פניך רבים
    kjvRefs:
    - Job 11:19
    kjvOsis:
    - Job.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.11.20
    scripture: tanakh
    name: Tanakh Job 11:20
    ref: Job 11:20
    book: Job
    section: ketuvim
    chapter: 11
    verse: 20
    ordinal: 18843
    text: But the eyes of the wicked shall fail, And they shall have no way to flee, And their hope shall be the drooping of the soul.
    translation: JPS 1917
    original: וְעֵינֵי רְשָׁעִים תִּכְלֶינָה וּמָנוֹס אָבַד מִנְהֶם וְתִקְוָתָם מַפַּח־נָפֶשׁ׃
    hebrewPlain: ועיני רשעים תכלינה ומנוס אבד מנהם ותקותם מפח נפש
    kjvRefs:
    - Job 11:20
    kjvOsis:
    - Job.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.11
- type: TanakhVerse
  data:
    osis: Job.12.1
    scripture: tanakh
    name: Tanakh Job 12:1
    ref: Job 12:1
    book: Job
    section: ketuvim
    chapter: 12
    verse: 1
    ordinal: 18844
    text: 'Then Job answered and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען איוב ויאמר
    kjvRefs:
    - Job 12:1
    kjvOsis:
    - Job.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.2
    scripture: tanakh
    name: Tanakh Job 12:2
    ref: Job 12:2
    book: Job
    section: ketuvim
    chapter: 12
    verse: 2
    ordinal: 18845
    text: No doubt but ye are the people, And wisdom shall die with you.
    translation: JPS 1917
    original: אָמְנָם כִּי אַתֶּם־עָם וְעִמָּכֶם תָּמוּת חָכְמָה׃
    hebrewPlain: אמנם כי אתם עם ועמכם תמות חכמה
    kjvRefs:
    - Job 12:2
    kjvOsis:
    - Job.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.3
    scripture: tanakh
    name: Tanakh Job 12:3
    ref: Job 12:3
    book: Job
    section: ketuvim
    chapter: 12
    verse: 3
    ordinal: 18846
    text: But I have understanding as well as you; I am not inferior to you; Yea, who knoweth not such things as these?
    translation: JPS 1917
    original: גַּם־לִי לֵבָב כְּמוֹכֶם לֹא־נֹפֵל אָנֹכִי מִכֶּם וְאֶת־מִי־אֵין כְּמוֹ־אֵלֶּה׃
    hebrewPlain: גם לי לבב כמוכם לא נפל אנכי מכם ואת מי אין כמו אלה
    kjvRefs:
    - Job 12:3
    kjvOsis:
    - Job.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.4
    scripture: tanakh
    name: Tanakh Job 12:4
    ref: Job 12:4
    book: Job
    section: ketuvim
    chapter: 12
    verse: 4
    ordinal: 18847
    text: I am as one that is a laughing-stock to his neighbour, A man that called upon God, And He answered him; The just, the innocent man is a laughing-stock,
    translation: JPS 1917
    original: שְׂחֹק לְרֵעֵהוּ אֶהְיֶה קֹרֵא לֶאֱלוֹהַּ וַיַּעֲנֵהוּ שְׂחוֹק צַדִּיק תָּמִים׃
    hebrewPlain: שחק לרעהו אהיה קרא לאלוה ויענהו שחוק צדיק תמים
    kjvRefs:
    - Job 12:4
    kjvOsis:
    - Job.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.5
    scripture: tanakh
    name: Tanakh Job 12:5
    ref: Job 12:5
    book: Job
    section: ketuvim
    chapter: 12
    verse: 5
    ordinal: 18848
    text: A contemptible brand in the thought of him that is at ease, A thing ready for them whose foot slippeth.
    translation: JPS 1917
    original: לַפִּיד בּוּז לְעַשְׁתּוּת שַׁאֲנָן נָכוֹן לְמוֹעֲדֵי רָגֶל׃
    hebrewPlain: לפיד בוז לעשתות שאנן נכון למועדי רגל
    kjvRefs:
    - Job 12:5
    kjvOsis:
    - Job.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.6
    scripture: tanakh
    name: Tanakh Job 12:6
    ref: Job 12:6
    book: Job
    section: ketuvim
    chapter: 12
    verse: 6
    ordinal: 18849
    text: The tents of robbers prosper, And they that provoke God are secure, In whatsoever God bringeth into their hand.
    translation: JPS 1917
    original: יִשְׁלָיוּ אֹהָלִים לְשֹׁדְדִים וּבַטֻּחוֹת לְמַרְגִּיזֵי אֵל לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ׃
    hebrewPlain: ישליו אהלים לשדדים ובטחות למרגיזי אל לאשר הביא אלוה בידו
    kjvRefs:
    - Job 12:6
    kjvOsis:
    - Job.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.7
    scripture: tanakh
    name: Tanakh Job 12:7
    ref: Job 12:7
    book: Job
    section: ketuvim
    chapter: 12
    verse: 7
    ordinal: 18850
    text: But ask now the beasts, and they shall teach thee; And the fowls of the air, and they shall tell thee;
    translation: JPS 1917
    original: וְאוּלָם שְׁאַל־נָא בְהֵמוֹת וְתֹרֶךָּ וְעוֹף הַשָּׁמַיִם וְיַגֶּד־לָךְ׃
