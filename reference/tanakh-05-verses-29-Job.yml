    osis: Job.13.7
    scripture: tanakh
    name: Tanakh Job 13:7
    ref: Job 13:7
    book: Job
    section: ketuvim
    chapter: 13
    verse: 7
    ordinal: 18875
    text: Will ye speak unrighteously for God, And talk deceitfully for Him?
    translation: JPS 1917
    original: הַלְאֵל תְּדַבְּרוּ עַוְלָה וְלוֹ תְּדַבְּרוּ רְמִיָּה׃
    hebrewPlain: הלאל תדברו עולה ולו תדברו רמיה
    kjvRefs:
    - Job 13:7
    kjvOsis:
    - Job.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
- type: TanakhVerse
  data:
    osis: Job.13.8
    scripture: tanakh
    name: Tanakh Job 13:8
    ref: Job 13:8
    book: Job
    section: ketuvim
    chapter: 13
    verse: 8
    ordinal: 18876
    text: Will ye show Him favour? Will ye contend for God?
    translation: JPS 1917
    original: הֲפָנָיו תִּשָּׂאוּן אִם־לָאֵל תְּרִיבוּן׃
    hebrewPlain: הפניו תשאון אם לאל תריבון
    kjvRefs:
    - Job 13:8
    kjvOsis:
    - Job.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
