  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.13
    scripture: tanakh
    name: Tanakh Job 12:13
    ref: Job 12:13
    book: Job
    section: ketuvim
    chapter: 12
    verse: 13
    ordinal: 18856
    text: With Him is wisdom and might; He hath counsel and understanding.
    translation: JPS 1917
    original: עִמּוֹ חָכְמָה וּגְבוּרָה לוֹ עֵצָה וּתְבוּנָה׃
    hebrewPlain: עמו חכמה וגבורה לו עצה ותבונה
