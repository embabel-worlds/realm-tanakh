  data:
    osis: Job.40.4
    scripture: tanakh
    name: Tanakh Job 40:4
    ref: Job 40:4
    book: Job
    section: ketuvim
    chapter: 40
    verse: 4
    ordinal: 19583
    text: Behold, I am of small account; what shall I answer Thee? I lay my hand upon my mouth.
    translation: JPS 1917
    original: הֵן קַלֹּתִי מָה אֲשִׁיבֶךָּ יָדִי שַׂמְתִּי לְמוֹ־פִי׃
    hebrewPlain: הן קלתי מה אשיבך ידי שמתי למו פי
