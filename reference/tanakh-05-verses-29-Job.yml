    osis: Job.12.22
    scripture: tanakh
    name: Tanakh Job 12:22
    ref: Job 12:22
    book: Job
    section: ketuvim
    chapter: 12
    verse: 22
    ordinal: 18865
    text: He uncovereth deep things out of darkness, And bringeth out to light the shadow of death.
    translation: JPS 1917
    original: מְגַלֶּה עֲמֻקוֹת מִנִּי־חֹשֶׁךְ וַיֹּצֵא לָאוֹר צַלְמָוֶת׃
