  data:
    osis: Job.13.24
    scripture: tanakh
    name: Tanakh Job 13:24
    ref: Job 13:24
    book: Job
    section: ketuvim
    chapter: 13
    verse: 24
    ordinal: 18892
    text: Wherefore hidest Thou Thy face, And holdest me for Thine enemy?
    translation: JPS 1917
    original: לָמָּה־פָנֶיךָ תַסְתִּיר וְתַחְשְׁבֵנִי לְאוֹיֵב לָךְ׃
    hebrewPlain: למה פניך תסתיר ותחשבני לאויב לך
