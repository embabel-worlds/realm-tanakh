    scripture: tanakh
    name: Tanakh Job 40:17
    ref: Job 40:17
    book: Job
    section: ketuvim
    chapter: 40
    verse: 17
    ordinal: 19596
    text: He straineth his tail like a cedar; The sinews of his thighs are knit together.
    translation: JPS 1917
    original: יַחְפֹּץ זְנָבוֹ כְמוֹ־אָרֶז גִּידֵי פחדו [פַחֲדָיו] יְשֹׂרָגוּ׃
    hebrewPlain: יחפץ זנבו כמו ארז גידי פחדו [פחדיו] ישרגו
