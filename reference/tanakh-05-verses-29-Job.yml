    name: Tanakh Job 1:10
    ref: Job 1:10
    book: Job
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 18594
    text: Hast not Thou made a hedge about him, and about his house, and about all that he hath, on every side? Thou hast blessed the work of his hands, and his possessions are increased in the land.
    translation: JPS 1917
    original: הֲלֹא־את [אַתָּה] שַׂכְתָּ בַעֲדוֹ וּבְעַד־בֵּיתוֹ וּבְעַד כָּל־אֲשֶׁר־לוֹ מִסָּבִיב מַעֲשֵׂה יָדָיו בֵּרַכְתָּ וּמִקְנֵהוּ פָּרַץ בָּאָרֶץ׃
    hebrewPlain: הלא את [אתה] שכת בעדו ובעד ביתו ובעד כל אשר לו מסביב מעשה ידיו ברכת ומקנהו פרץ בארץ
    kjvRefs:
