    scripture: tanakh
    name: Tanakh Job 12:19
    ref: Job 12:19
    book: Job
    section: ketuvim
    chapter: 12
    verse: 19
    ordinal: 18862
    text: He leadeth priests away stripped, And overthroweth the mighty.
    translation: JPS 1917
    original: מוֹלִיךְ כֹּהֲנִים שׁוֹלָל וְאֵתָנִים יְסַלֵּף׃
    hebrewPlain: מוליך כהנים שולל ואתנים יסלף
