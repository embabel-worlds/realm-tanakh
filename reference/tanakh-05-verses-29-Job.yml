  data:
    osis: Job.39.30
    scripture: tanakh
    name: Tanakh Job 39:30
    ref: Job 39:30
    book: Job
    section: ketuvim
    chapter: 39
    verse: 30
    ordinal: 19579
    text: Her young ones also suck up blood; And where the slain are, there is she.
    translation: JPS 1917
    original: ואפרחו [וְאֶפְרֹחָיו] יְעַלְעוּ־דָם וּבַאֲשֶׁר חֲלָלִים שָׁם הוּא׃
    hebrewPlain: ואפרחו [ואפרחיו] יעלעו דם ובאשר חללים שם הוא
