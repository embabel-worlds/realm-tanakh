    scripture: tanakh
    name: Tanakh Job 39:27
    ref: Job 39:27
    book: Job
    section: ketuvim
    chapter: 39
    verse: 27
    ordinal: 19576
    text: Doth the vulture mount up at thy command, And make her nest on high?
    translation: JPS 1917
    original: אִם־עַל־פִּיךָ יַגְבִּיהַּ נָשֶׁר וְכִי יָרִים קִנּוֹ׃
    hebrewPlain: אם על פיך יגביה נשר וכי ירים קנו
