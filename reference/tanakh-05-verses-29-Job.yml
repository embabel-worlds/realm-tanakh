    scripture: tanakh
    name: Tanakh Job 12:14
    ref: Job 12:14
    book: Job
    section: ketuvim
    chapter: 12
    verse: 14
    ordinal: 18857
    text: Behold, He breaketh down, and it cannot be built again; He shutteth up a man, and there can be no opening.
    translation: JPS 1917
    original: הֵן יַהֲרוֹס וְלֹא יִבָּנֶה יִסְגֹּר עַל־אִישׁ וְלֹא יִפָּתֵחַ׃
    hebrewPlain: הן יהרוס ולא יבנה יסגר על איש ולא יפתח
    kjvRefs:
    - Job 12:14
    kjvOsis:
    - Job.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.15
    scripture: tanakh
    name: Tanakh Job 12:15
    ref: Job 12:15
    book: Job
    section: ketuvim
    chapter: 12
    verse: 15
    ordinal: 18858
    text: Behold, He withholdeth the waters, and they dry up; Also He sendeth them out, and they overturn the earth.
    translation: JPS 1917
    original: הֵן יַעְצֹר בַּמַּיִם וְיִבָשׁוּ וִישַׁלְּחֵם וְיַהַפְכוּ אָרֶץ׃
    hebrewPlain: הן יעצר במים ויבשו וישלחם ויהפכו ארץ
    kjvRefs:
    - Job 12:15
    kjvOsis:
    - Job.12.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.12.16
    scripture: tanakh
    name: Tanakh Job 12:16
    ref: Job 12:16
    book: Job
    section: ketuvim
    chapter: 12
    verse: 16
    ordinal: 18859
    text: With Him is strength and sound wisdom; The deceived and the deceiver are His.
    translation: JPS 1917
    original: עִמּוֹ עֹז וְתוּשִׁיָּה לוֹ שֹׁגֵג וּמַשְׁגֶּה׃
    hebrewPlain: עמו עז ותושיה לו שגג ומשגה
    kjvRefs:
    - Job 12:16
    kjvOsis:
    - Job.12.16
