    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.26
    scripture: tanakh
    name: Tanakh Job 40:26
    ref: Job 40:26
    book: Job
    section: ketuvim
    chapter: 40
    verse: 26
    ordinal: 19605
    text: Canst thou put a ring into his nose? Or bore his jaw through with a hook?
    translation: JPS 1917
    original: הֲתָשִׂים אַגְמוֹן בְּאַפּוֹ וּבְחוֹחַ תִּקּוֹב לֶחֱיוֹ׃
    hebrewPlain: התשים אגמון באפו ובחוח תקוב לחיו
