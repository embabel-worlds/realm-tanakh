    scripture: tanakh
    name: Tanakh Job 40:1
    ref: Job 40:1
    book: Job
    section: ketuvim
    chapter: 40
    verse: 1
    ordinal: 19580
    text: 'Moreover the LORD answered Job, and said:'
    translation: JPS 1917
    original: וַיַּעַן יְהוָה אֶת־אִיּוֹב וַיֹּאמַר׃
    hebrewPlain: ויען יהוה את איוב ויאמר
    kjvRefs:
    - Job 40:1
    kjvOsis:
