  data:
    osis: Job.40.31
    scripture: tanakh
    name: Tanakh Job 40:31
    ref: Job 40:31
    book: Job
    section: ketuvim
    chapter: 40
    verse: 31
    ordinal: 19610
    text: Canst thou fill his skin with barbed irons? Or his head with fish-spears?
    translation: JPS 1917
    original: הַתְמַלֵּא בְשֻׂכּוֹת עוֹרוֹ וּבְצִלְצַל דָּגִים רֹאשׁוֹ׃
    hebrewPlain: התמלא בשכות עורו ובצלצל דגים ראשו
