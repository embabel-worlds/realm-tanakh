  data:
    osis: Job.40.5
    scripture: tanakh
    name: Tanakh Job 40:5
    ref: Job 40:5
    book: Job
    section: ketuvim
    chapter: 40
    verse: 5
    ordinal: 19584
    text: Once have I spoken, but I will not answer again; Yea, twice, but I will proceed no further.
    translation: JPS 1917
    original: אַחַת דִּבַּרְתִּי וְלֹא אֶעֱנֶה וּשְׁתַּיִם וְלֹא אוֹסִיף׃
    hebrewPlain: אחת דברתי ולא אענה ושתים ולא אוסיף
