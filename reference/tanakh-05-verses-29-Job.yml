    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
    osis: Job.40.23
    scripture: tanakh
    name: Tanakh Job 40:23
    ref: Job 40:23
    book: Job
    section: ketuvim
    chapter: 40
    verse: 23
    ordinal: 19602
    text: Behold, if a river overflow, he trembleth not; He is confident, though the Jordan rush forth to his mouth.
    translation: JPS 1917
    original: הֵן יַעֲשֹׁק נָהָר לֹא יַחְפּוֹז יִבְטַח כִּי־יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ׃
    hebrewPlain: הן יעשק נהר לא יחפוז יבטח כי יגיח ירדן אל פיהו
    kjvRefs:
    - Job 40:23
    kjvOsis:
    - Job.40.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.40
- type: TanakhVerse
  data:
