    scripture: tanakh
    name: Tanakh Job 41:3
    ref: Job 41:3
    book: Job
    section: ketuvim
    chapter: 41
    verse: 3
    ordinal: 19614
    text: Who hath given Me anything beforehand, that I should repay him? Whatsoever is under the whole heaven is Mine.
    translation: JPS 1917
    original: מִי הִקְדִּימַנִי וַאֲשַׁלֵּם תַּחַת כָּל־הַשָּׁמַיִם לִי־הוּא׃
    hebrewPlain: מי הקדימני ואשלם תחת כל השמים לי הוא
