    name: Tanakh Job 39:26
    ref: Job 39:26
    book: Job
    section: ketuvim
    chapter: 39
    verse: 26
    ordinal: 19575
    text: Doth the hawk soar by thy wisdom, And stretch her wings toward the south?
    translation: JPS 1917
    original: הֲ‍מִבִּינָתְךָ יַאֲבֶר־נֵץ יִפְרֹשׂ כנפו [כְּנָפָיו] לְתֵימָן׃
    hebrewPlain: ה‍מבינתך יאבר נץ יפרש כנפו [כנפיו] לתימן
