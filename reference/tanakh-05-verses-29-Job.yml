  data:
    osis: Job.42.11
    scripture: tanakh
    name: Tanakh Job 42:11
    ref: Job 42:11
    book: Job
    section: ketuvim
    chapter: 42
    verse: 11
    ordinal: 19648
    text: Then came there unto him all his brethren, and all his sisters, and all they that had been of his acquaintance before, and did eat bread with him in his house; and they bemoaned him, and comforted him concerning all the evil that the LORD had brought upon him; every man also gave him a piece of money, and every one a ring of gold.
    translation: JPS 1917
    original: וַיָּבֹאוּ אֵלָיו כָּל־אֶחָיו וְכָל־אחיתיו [אַחְיוֹתָיו] וְכָל־יֹדְעָיו לְפָנִים וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ וַיָּנֻדוּ לוֹ וַיְנַחֲמוּ אֹתוֹ עַל כָּל־הָרָעָה אֲשֶׁר־הֵבִיא יְהוָה עָלָיו וַיִּתְּנוּ־לוֹ אִישׁ קְשִׂיטָה אֶחָת וְאִישׁ נֶזֶם זָהָב אֶחָד׃
    hebrewPlain: ויבאו אליו כל אחיו וכל אחיתיו [אחיותיו] וכל ידעיו לפנים ויאכלו עמו לחם בביתו וינדו לו וינחמו אתו על כל הרעה אשר הביא יהוה עליו ויתנו לו איש קשיטה אחת ואיש נזם זהב אחד
    kjvRefs:
    - Job 42:11
    kjvOsis:
    - Job.42.11
