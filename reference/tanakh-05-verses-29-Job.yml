- type: TanakhVerse
  data:
    osis: Job.40.25
    scripture: tanakh
    name: Tanakh Job 40:25
    ref: Job 40:25
    book: Job
    section: ketuvim
    chapter: 40
    verse: 25
    ordinal: 19604
    text: Canst thou draw out leviathan with a fish-hook? Or press down his tongue with a cord?
    translation: JPS 1917
    original: תִּמְשֹׁךְ לִוְיָתָן בְּחַכָּה וּבְחֶבֶל תַּשְׁקִיעַ לְשֹׁנוֹ׃
    hebrewPlain: תמשך לויתן בחכה ובחבל תשקיע לשנו
