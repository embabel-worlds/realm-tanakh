    scripture: tanakh
    name: Tanakh Job 40:3
    ref: Job 40:3
    book: Job
    section: ketuvim
    chapter: 40
    verse: 3
    ordinal: 19582
    text: 'Then Job answered the LORD, and said:'
    translation: JPS 1917
    original: וַיַּעַן אִיּוֹב אֶת־יְהוָה וַיֹּאמַר׃
    hebrewPlain: ויען איוב את יהוה ויאמר
