    scripture: tanakh
    name: Tanakh Job 12:12
    ref: Job 12:12
    book: Job
    section: ketuvim
    chapter: 12
    verse: 12
    ordinal: 18855
    text: Is wisdom with aged men, And understanding in length of days?—
    translation: JPS 1917
    original: בִּישִׁישִׁים חָכְמָה וְאֹרֶךְ יָמִים תְּבוּנָה׃
    hebrewPlain: בישישים חכמה וארך ימים תבונה
