  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.12
- type: TanakhVerse
  data:
    osis: Job.13.1
    scripture: tanakh
    name: Tanakh Job 13:1
    ref: Job 13:1
    book: Job
    section: ketuvim
    chapter: 13
    verse: 1
    ordinal: 18869
    text: Lo, mine eye hath seen all this, Mine ear hath heard and understood it.
    translation: JPS 1917
    original: הֶן־כֹּל רָאֲתָה עֵינִי שָׁמְעָה אָזְנִי וַתָּבֶן לָהּ׃
    hebrewPlain: הן כל ראתה עיני שמעה אזני ותבן לה
    kjvRefs:
    - Job 13:1
    kjvOsis:
    - Job.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Job.13
