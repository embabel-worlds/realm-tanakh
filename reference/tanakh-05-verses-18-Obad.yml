    verse: 2
    ordinal: 14510
    text: Behold, I make thee small among the nations; Thou art greatly despised.
    translation: JPS 1917
    original: הִנֵּה קָטֹן נְתַתִּיךָ בַּגּוֹיִם בָּזוּי אַתָּה מְאֹד׃
    hebrewPlain: הנה קטן נתתיך בגוים בזוי אתה מאד
