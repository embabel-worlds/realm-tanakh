    ref: Obadiah 1:3
    book: Obad
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 14511
    text: 'The pride of thy heart hath beguiled thee, O thou that dwellest in the clefts of the rock, Thy habitation on high; That sayest in thy heart: ‘Who shall bring me down to the ground?’'
    translation: JPS 1917
    original: זְדוֹן לִבְּךָ הִשִּׁיאֶךָ שֹׁכְנִי בְחַגְוֵי־סֶּלַע מְרוֹם שִׁבְתּוֹ אֹמֵר בְּלִבּוֹ מִי יוֹרִדֵנִי אָרֶץ׃
    hebrewPlain: זדון לבך השיאך שכני בחגוי סלע מרום שבתו אמר בלבו מי יורדני ארץ
    kjvRefs:
    - Obadiah 1:3
    kjvOsis:
