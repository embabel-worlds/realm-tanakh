    text: 'The vision of Obadiah. Thus saith the Lord GOD concerning Edom: We have heard a message from the LORD, And an ambassador is sent among the nations: ‘Arise ye, and let us rise up against her in battle.’'
    translation: JPS 1917
    original: חֲזוֹן עֹבַדְיָה כֹּה־אָמַר אֲדֹנָי יְהוִה לֶאֱדוֹם שְׁמוּעָה שָׁמַעְנוּ מֵאֵת יְהוָה וְצִיר בַּגּוֹיִם שֻׁלָּח קוּמוּ וְנָקוּמָה עָלֶיהָ לַמִּלְחָמָה׃
    hebrewPlain: חזון עבדיה כה אמר אדני יהוה לאדום שמועה שמענו מאת יהוה וציר בגוים שלח קומו ונקומה עליה למלחמה
    kjvRefs:
