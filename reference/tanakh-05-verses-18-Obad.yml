- type: TanakhVerse
  data:
    osis: Obad.1.7
    scripture: tanakh
    name: Tanakh Obadiah 1:7
    ref: Obadiah 1:7
    book: Obad
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 14515
    text: All the men of thy confederacy Have conducted thee to the border; The men that were at peace with thee Have beguiled thee, and prevailed against thee; They that eat thy bread lay a snare under thee, In whom there is no discernment.
    translation: JPS 1917
    original: עַד־הַגְּבוּל שִׁלְּחוּךָ כֹּל אַנְשֵׁי בְרִיתֶךָ הִשִּׁיאוּךָ יָכְלוּ לְךָ אַנְשֵׁי שְׁלֹמֶךָ לַחְמְךָ יָשִׂימוּ מָזוֹר תַּחְתֶּיךָ אֵין תְּבוּנָה בּוֹ׃
    hebrewPlain: עד הגבול שלחוך כל אנשי בריתך השיאוך יכלו לך אנשי שלמך לחמך ישימו מזור תחתיך אין תבונה בו
    kjvRefs:
    - Obadiah 1:7
    kjvOsis:
    - Obad.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.8
    scripture: tanakh
    name: Tanakh Obadiah 1:8
    ref: Obadiah 1:8
    book: Obad
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 14516
    text: Shall I not in that day, saith the LORD, Destroy the wise men out of Edom, And discernment out of the mount of Esau?
    translation: JPS 1917
    original: הֲלוֹא בַּיּוֹם הַהוּא נְאֻם־יְהוָה וְהַאֲבַדְתִּי חֲכָמִים מֵאֱדוֹם וּתְבוּנָה מֵהַר עֵשָׂו׃
    hebrewPlain: הלוא ביום ההוא נאם יהוה והאבדתי חכמים מאדום ותבונה מהר עשו
    kjvRefs:
    - Obadiah 1:8
    kjvOsis:
    - Obad.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.9
    scripture: tanakh
    name: Tanakh Obadiah 1:9
    ref: Obadiah 1:9
    book: Obad
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 14517
    text: And thy mighty men, O Teman, shall be dismayed, To the end that every one may be cut off from the mount of Esau by slaughter.
    translation: JPS 1917
    original: וְחַתּוּ גִבּוֹרֶיךָ תֵּימָן לְמַעַן יִכָּרֶת־אִישׁ מֵהַר עֵשָׂו מִקָּטֶל׃
    hebrewPlain: וחתו גבוריך תימן למען יכרת איש מהר עשו מקטל
    kjvRefs:
    - Obadiah 1:9
    kjvOsis:
    - Obad.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.10
    scripture: tanakh
    name: Tanakh Obadiah 1:10
    ref: Obadiah 1:10
    book: Obad
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 14518
    text: For the violence done to thy brother Jacob shame shall cover thee, And thou shalt be cut off for ever.
    translation: JPS 1917
    original: מֵחֲמַס אָחִיךָ יַעֲקֹב תְּכַסְּךָ בוּשָׁה וְנִכְרַתָּ לְעוֹלָם׃
    hebrewPlain: מחמס אחיך יעקב תכסך בושה ונכרת לעולם
    kjvRefs:
    - Obadiah 1:10
    kjvOsis:
    - Obad.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.11
    scripture: tanakh
    name: Tanakh Obadiah 1:11
    ref: Obadiah 1:11
    book: Obad
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 14519
    text: In the day that thou didst stand aloof, In the day that strangers carried away his substance, And foreigners entered into his gates, And cast lots upon Jerusalem, Even thou wast as one of them.
    translation: JPS 1917
    original: בְּיוֹם עֲמָדְךָ מִנֶּגֶד בְּיוֹם שְׁבוֹת זָרִים חֵילוֹ וְנָכְרִים בָּאוּ שערו [שְׁעָרָיו] וְעַל־יְרוּשָׁלִַם יַדּוּ גוֹרָל גַּם־אַתָּה כְּאַחַד מֵהֶם׃
    hebrewPlain: ביום עמדך מנגד ביום שבות זרים חילו ונכרים באו שערו [שעריו] ועל ירושלם ידו גורל גם אתה כאחד מהם
    kjvRefs:
    - Obadiah 1:11
    kjvOsis:
    - Obad.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.12
    scripture: tanakh
    name: Tanakh Obadiah 1:12
    ref: Obadiah 1:12
    book: Obad
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 14520
    text: But thou shouldest not have gazed on the day of thy brother In the day of his disaster, Neither shouldest thou have rejoiced over the children of Judah In the day of their destruction; Neither shouldest thou have spoken proudly In the day of distress.
    translation: JPS 1917
    original: וְאַל־תֵּרֶא בְיוֹם־אָחִיךָ בְּיוֹם נָכְרוֹ וְאַל־תִּשְׂמַח לִבְנֵי־יְהוּדָה בְּיוֹם אָבְדָם וְאַל־תַּגְדֵּל פִּיךָ בְּיוֹם צָרָה׃
    hebrewPlain: ואל תרא ביום אחיך ביום נכרו ואל תשמח לבני יהודה ביום אבדם ואל תגדל פיך ביום צרה
    kjvRefs:
    - Obadiah 1:12
    kjvOsis:
    - Obad.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.13
    scripture: tanakh
    name: Tanakh Obadiah 1:13
    ref: Obadiah 1:13
    book: Obad
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 14521
    text: Thou shouldest not have entered into the gate of My people In the day of their calamity; Yea, thou shouldest not have gazed on their affliction In the day of their calamity, Nor have laid hands on their substance In the day of their calamity.
    translation: JPS 1917
    original: אַל־תָּבוֹא בְשַׁעַר־עַמִּי בְּיוֹם אֵידָם אַל־תֵּרֶא גַם־אַתָּה בְּרָעָתוֹ בְּיוֹם אֵידוֹ וְאַל־תִּשְׁלַחְנָה בְחֵילוֹ בְּיוֹם אֵידוֹ׃
    hebrewPlain: אל תבוא בשער עמי ביום אידם אל תרא גם אתה ברעתו ביום אידו ואל תשלחנה בחילו ביום אידו
    kjvRefs:
    - Obadiah 1:13
    kjvOsis:
    - Obad.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.14
    scripture: tanakh
    name: Tanakh Obadiah 1:14
    ref: Obadiah 1:14
    book: Obad
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 14522
    text: Neither shouldest thou have stood in the crossway, To cut off those of his that escape; Neither shouldest thou have delivered up those of his That did remain in the day of distress.
    translation: JPS 1917
    original: וְאַל־תַּעֲמֹד עַל־הַפֶּרֶק לְהַכְרִית אֶת־פְּלִיטָיו וְאַל־תַּסְגֵּר שְׂרִידָיו בְּיוֹם צָרָה׃
    hebrewPlain: ואל תעמד על הפרק להכרית את פליטיו ואל תסגר שרידיו ביום צרה
    kjvRefs:
    - Obadiah 1:14
    kjvOsis:
    - Obad.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.15
    scripture: tanakh
    name: Tanakh Obadiah 1:15
    ref: Obadiah 1:15
    book: Obad
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 14523
    text: For the day of the LORD is near upon all the nations; As thou hast done, it shall be done unto thee; Thy dealing shall return upon thine own head. .
    translation: JPS 1917
    original: כִּי־קָרוֹב יוֹם־יְהוָה עַל־כָּל־הַגּוֹיִם כַּאֲשֶׁר עָשִׂיתָ יֵעָשֶׂה לָּךְ גְּמֻלְךָ יָשׁוּב בְּרֹאשֶׁךָ׃
    hebrewPlain: כי קרוב יום יהוה על כל הגוים כאשר עשית יעשה לך גמלך ישוב בראשך
    kjvRefs:
    - Obadiah 1:15
    kjvOsis:
    - Obad.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.16
    scripture: tanakh
    name: Tanakh Obadiah 1:16
    ref: Obadiah 1:16
    book: Obad
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 14524
    text: For as ye have drunk upon My holy mountain, So shall all the nations drink continually, Yea, they shall drink, and swallow down, And shall be as though they had not been.
    translation: JPS 1917
    original: כִּי כַּאֲשֶׁר שְׁתִיתֶם עַל־הַר קָדְשִׁי יִשְׁתּוּ כָל־הַגּוֹיִם תָּמִיד וְשָׁתוּ וְלָעוּ וְהָיוּ כְּלוֹא הָיוּ׃
    hebrewPlain: כי כאשר שתיתם על הר קדשי ישתו כל הגוים תמיד ושתו ולעו והיו כלוא היו
    kjvRefs:
    - Obadiah 1:16
    kjvOsis:
    - Obad.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.17
    scripture: tanakh
    name: Tanakh Obadiah 1:17
    ref: Obadiah 1:17
    book: Obad
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 14525
    text: But in mount Zion there shall be those that escape, And it shall be holy; And the house of Jacob shall possess their possessions.
    translation: JPS 1917
    original: וּבְהַר צִיּוֹן תִּהְיֶה פְלֵיטָה וְהָיָה קֹדֶשׁ וְיָרְשׁוּ בֵּית יַעֲקֹב אֵת מוֹרָשֵׁיהֶם׃
    hebrewPlain: ובהר ציון תהיה פליטה והיה קדש וירשו בית יעקב את מורשיהם
    kjvRefs:
    - Obadiah 1:17
    kjvOsis:
    - Obad.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.18
    scripture: tanakh
    name: Tanakh Obadiah 1:18
    ref: Obadiah 1:18
    book: Obad
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 14526
    text: And the house of Jacob shall be a fire, And the house of Joseph a flame, And the house of Esau for stubble, And they shall kindle in them, and devour them; And there shall not be any remaining of the house of Esau; For the LORD hath spoken.
    translation: JPS 1917
    original: וְהָיָה בֵית־יַעֲקֹב אֵשׁ וּבֵית יוֹסֵף לֶהָבָה וּבֵית עֵשָׂו לְקַשׁ וְדָלְקוּ בָהֶם וַאֲכָלוּם וְלֹא־יִהְיֶה שָׂרִיד לְבֵית עֵשָׂו כִּי יְהוָה דִּבֵּר׃
    hebrewPlain: והיה בית יעקב אש ובית יוסף להבה ובית עשו לקש ודלקו בהם ואכלום ולא יהיה שריד לבית עשו כי יהוה דבר
    kjvRefs:
    - Obadiah 1:18
    kjvOsis:
    - Obad.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.19
    scripture: tanakh
    name: Tanakh Obadiah 1:19
    ref: Obadiah 1:19
    book: Obad
    section: neviim
    chapter: 1
    verse: 19
    ordinal: 14527
    text: And they of the South shall possess the mount of Esau, And they of the Lowland the Philistines; And they shall possess the field of Ephraim, And the field of Samaria; And Benjamin shall possess Gilead.
    translation: JPS 1917
    original: וְיָרְשׁוּ הַנֶּגֶב אֶת־הַר עֵשָׂו וְהַשְּׁפֵלָה אֶת־פְּלִשְׁתִּים וְיָרְשׁוּ אֶת־שְׂדֵה אֶפְרַיִם וְאֵת שְׂדֵה שֹׁמְרוֹן וּבִנְיָמִן אֶת־הַגִּלְעָד׃
    hebrewPlain: וירשו הנגב את הר עשו והשפלה את פלשתים וירשו את שדה אפרים ואת שדה שמרון ובנימן את הגלעד
    kjvRefs:
    - Obadiah 1:19
