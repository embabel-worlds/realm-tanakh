    scripture: tanakh
    name: Tanakh Obadiah 1:4
    ref: Obadiah 1:4
    book: Obad
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 14512
    text: Though thou make thy nest as high as the eagle, And though thou set it among the stars, I will bring thee down from thence, saith the LORD.
    translation: JPS 1917
    original: אִם־תַּגְבִּיהַּ כַּנֶּשֶׁר וְאִם־בֵּין כּוֹכָבִים שִׂים קִנֶּךָ מִשָּׁם אוֹרִידְךָ נְאֻם־יְהוָה׃
    hebrewPlain: אם תגביה כנשר ואם בין כוכבים שים קנך משם אורידך נאם יהוה
    kjvRefs:
    - Obadiah 1:4
    kjvOsis:
