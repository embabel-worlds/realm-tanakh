- type: TanakhVerse
  data:
    osis: Obad.1.5
    scripture: tanakh
    name: Tanakh Obadiah 1:5
    ref: Obadiah 1:5
    book: Obad
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 14513
    text: If thieves came to thee, if robbers by night— How art thou cut off!— Would they not steal till they had enough? If grape-gatherers came to thee, Would they not leave some gleaning grapes?
    translation: JPS 1917
    original: אִם־גַּנָּבִים בָּאוּ־לְךָ אִם־שׁוֹדְדֵי לַיְלָה אֵיךְ נִדְמֵיתָה הֲלוֹא יִגְנְבוּ דַּיָּם אִם־בֹּצְרִים בָּאוּ לָךְ הֲלוֹא יַשְׁאִירוּ עֹלֵלוֹת׃
    hebrewPlain: אם גנבים באו לך אם שודדי לילה איך נדמיתה הלוא יגנבו דים אם בצרים באו לך הלוא ישאירו עללות
    kjvRefs:
    - Obadiah 1:5
    kjvOsis:
    - Obad.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Obad.1
- type: TanakhVerse
  data:
    osis: Obad.1.6
    scripture: tanakh
    name: Tanakh Obadiah 1:6
    ref: Obadiah 1:6
    book: Obad
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 14514
    text: How is Esau searched out! How are his hidden places sought out!
    translation: JPS 1917
    original: אֵיךְ נֶחְפְּשׂוּ עֵשָׂו נִבְעוּ מַצְפֻּנָיו׃
    hebrewPlain: איך נחפשו עשו נבעו מצפניו
    kjvRefs:
    - Obadiah 1:6
    kjvOsis:
    - Obad.1.6
  relations:
