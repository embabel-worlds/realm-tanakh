    book: Judg
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 6508
    text: And Judah went up; and the LORD delivered the Canaanites and the Perizzites into their hand; and they smote of them in Bezek ten thousand men.
    translation: JPS 1917
    original: וַיַּעַל יְהוּדָה וַיִּתֵּן יְהוָה אֶת־הַכְּנַעֲנִי וְהַפְּרִזִּי בְּיָדָם וַיַּכּוּם בְּבֶזֶק עֲשֶׂרֶת אֲלָפִים אִישׁ׃
    hebrewPlain: ויעל יהודה ויתן יהוה את הכנעני והפרזי בידם ויכום בבזק עשרת אלפים איש
    kjvRefs:
