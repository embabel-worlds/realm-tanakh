  data:
    osis: Judg.12.12
    scripture: tanakh
    name: Tanakh Judges 12:12
    ref: Judges 12:12
    book: Judg
    section: neviim
    chapter: 12
    verse: 12
    ordinal: 6876
    text: And Elon the Zebulunite died, and was buried in Aijalon in the land of Zebulun.
    translation: JPS 1917
    original: וַיָּמָת אֵלוֹן הַזְּבוּלֹנִי וַיִּקָּבֵר בְּאַיָּלוֹן בְּאֶרֶץ זְבוּלֻן׃
    hebrewPlain: וימת אלון הזבולני ויקבר באילון בארץ זבולן
    kjvRefs:
