    text: 'AND IT came to pass after the death of Joshua, that the children of Israel asked the LORD, saying: ‘Who shall go up for us first against the Canaanites, to fight against them?’'
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ וַיִּשְׁאֲלוּ בְּנֵי יִשְׂרָאֵל בַּיהוָה לֵאמֹר מִי יַעֲלֶה־לָּנוּ אֶל־הַכְּנַעֲנִי בַּתְּחִלָּה לְהִלָּחֶם בּוֹ׃
    hebrewPlain: ויהי אחרי מות יהושע וישאלו בני ישראל ביהוה לאמר מי יעלה לנו אל הכנעני בתחלה להלחם בו
    kjvRefs:
