      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.7
    scripture: tanakh
    name: Tanakh Judges 1:7
    ref: Judges 1:7
    book: Judg
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 6511
    text: 'And Adoni-bezek said: ‘Threescore and ten kings, having their thumbs and their great toes cut off, gathered food under my table; as I have done, so God hath requited me.’ And they brought him to Jerusalem, and he died there.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲדֹנִי־בֶזֶק שִׁבְעִים מְלָכִים בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם מְקֻצָּצִים הָיוּ מְלַקְּטִים תַּחַת שֻׁלְחָנִי כַּאֲשֶׁר עָשִׂיתִי כֵּן שִׁלַּם־לִי אֱלֹהִים וַיְבִיאֻהוּ יְרוּשָׁלִַם וַיָּמָת שָׁם׃
    hebrewPlain: ויאמר אדני בזק שבעים מלכים בהנות ידיהם ורגליהם מקצצים היו מלקטים תחת שלחני כאשר עשיתי כן שלם לי אלהים ויביאהו ירושלם וימת שם
    kjvRefs:
    - Judges 1:7
    kjvOsis:
    - Judg.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.8
    scripture: tanakh
    name: Tanakh Judges 1:8
    ref: Judges 1:8
    book: Judg
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 6512
    text: And the children of Judah fought Jerusalem, and took it, and smote it with the edge of the sword, and set the city on fire.
    translation: JPS 1917
    original: וַיִּלָּחֲמוּ בְנֵי־יְהוּדָה בִּירוּשָׁלִַם וַיִּלְכְּדוּ אוֹתָהּ וַיַּכּוּהָ לְפִי־חָרֶב וְאֶת־הָעִיר שִׁלְּחוּ בָאֵשׁ׃
    hebrewPlain: וילחמו בני יהודה בירושלם וילכדו אותה ויכוה לפי חרב ואת העיר שלחו באש
