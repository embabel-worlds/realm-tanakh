- type: TanakhVerse
  data:
    osis: Judg.4.16
    scripture: tanakh
    name: Tanakh Judges 4:16
    ref: Judges 4:16
    book: Judg
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 6610
    text: But Barak pursued after the chariots, and after the host, unto Harosheth-goiim; and all the host of Sisera fell by the edge of the sword; there was not a man left.
    translation: JPS 1917
    original: וּבָרָק רָדַף אַחֲרֵי הָרֶכֶב וְאַחֲרֵי הַמַּחֲנֶה עַד חֲרֹשֶׁת הַגּוֹיִם וַיִּפֹּל כָּל־מַחֲנֵה סִיסְרָא לְפִי־חֶרֶב לֹא נִשְׁאַר עַד־אֶחָד׃
    hebrewPlain: וברק רדף אחרי הרכב ואחרי המחנה עד חרשת הגוים ויפל כל מחנה סיסרא לפי חרב לא נשאר עד אחד
    kjvRefs:
    - Judges 4:16
    kjvOsis:
    - Judg.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.17
    scripture: tanakh
    name: Tanakh Judges 4:17
    ref: Judges 4:17
    book: Judg
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 6611
    text: Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite; for there was peace between Jabin the king of Hazor and the house of Heber the Kenite.
    translation: JPS 1917
    original: וְסִיסְרָא נָס בְּרַגְלָיו אֶל־אֹהֶל יָעֵל אֵשֶּׁת חֶבֶר הַקֵּינִי כִּי שָׁלוֹם בֵּין יָבִין מֶלֶךְ־חָצוֹר וּבֵין בֵּית חֶבֶר הַקֵּינִי׃
    hebrewPlain: וסיסרא נס ברגליו אל אהל יעל אשת חבר הקיני כי שלום בין יבין מלך חצור ובין בית חבר הקיני
    kjvRefs:
    - Judges 4:17
    kjvOsis:
    - Judg.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.18
    scripture: tanakh
    name: Tanakh Judges 4:18
    ref: Judges 4:18
    book: Judg
    section: neviim
    chapter: 4
    verse: 18
    ordinal: 6612
    text: 'And Jael went out to meet Sisera, and said unto him: ‘Turn in, my lord, turn in to me; fear not.’ And he turned in unto her into the tent, and she covered him with a rug.'
    translation: JPS 1917
    original: וַתֵּצֵא יָעֵל לִקְרַאת סִיסְרָא וַתֹּאמֶר אֵלָיו סוּרָה אֲדֹנִי סוּרָה אֵלַי אַל־תִּירָא וַיָּסַר אֵלֶיהָ הָאֹהֱלָה וַתְּכַסֵּהוּ בַּשְּׂמִיכָה׃
    hebrewPlain: ותצא יעל לקראת סיסרא ותאמר אליו סורה אדני סורה אלי אל תירא ויסר אליה האהלה ותכסהו בשמיכה
    kjvRefs:
    - Judges 4:18
    kjvOsis:
    - Judg.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.19
    scripture: tanakh
    name: Tanakh Judges 4:19
    ref: Judges 4:19
    book: Judg
    section: neviim
    chapter: 4
    verse: 19
    ordinal: 6613
    text: 'And he said unto her: ‘Give me, I pray thee, a little water to drink; for I am thirsty.’ And she opened a bottle of milk, and gave him drink, and covered him.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ הַשְׁקִינִי־נָא מְעַט־מַיִם כִּי צָמֵאתִי וַתִּפְתַּח אֶת־נֹאוד הֶחָלָב וַתַּשְׁקֵהוּ וַתְּכַסֵּהוּ׃
    hebrewPlain: ויאמר אליה השקיני נא מעט מים כי צמאתי ותפתח את נאוד החלב ותשקהו ותכסהו
    kjvRefs:
    - Judges 4:19
    kjvOsis:
    - Judg.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.20
    scripture: tanakh
    name: Tanakh Judges 4:20
    ref: Judges 4:20
    book: Judg
    section: neviim
    chapter: 4
    verse: 20
    ordinal: 6614
    text: 'And he said unto her: ‘Stand in the door of the tent, and it shall be, when any man doth come and inquire of thee, and say: Is there any man here? that thou shalt say: No.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ עֲמֹד פֶּתַח הָאֹהֶל וְהָיָה אִם־אִישׁ יָבוֹא וּשְׁאֵלֵךְ וְאָמַר הֲיֵשׁ־פֹּה אִישׁ וְאָמַרְתְּ אָיִן׃
    hebrewPlain: ויאמר אליה עמד פתח האהל והיה אם איש יבוא ושאלך ואמר היש פה איש ואמרת אין
    kjvRefs:
    - Judges 4:20
    kjvOsis:
    - Judg.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.21
    scripture: tanakh
    name: Tanakh Judges 4:21
    ref: Judges 4:21
    book: Judg
    section: neviim
    chapter: 4
    verse: 21
    ordinal: 6615
    text: Then Jael Heber’s wife took a tent-pin, and took a hammer in her hand, and went softly unto him, and smote the pin into his temples, and it pierced through into the ground; for he was in a deep sleep; so he swooned and died.
    translation: JPS 1917
    original: וַתִּקַּח יָעֵל אֵשֶׁת־חֶבֶר אֶת־יְתַד הָאֹהֶל וַתָּשֶׂם אֶת־הַמַּקֶּבֶת בְּיָדָהּ וַתָּבוֹא אֵלָיו בַּלָּאט וַתִּתְקַע אֶת־הַיָּתֵד בְּרַקָּתוֹ וַתִּצְנַח בָּאָרֶץ וְהוּא־נִרְדָּם וַיָּעַף וַיָּמֹת׃
    hebrewPlain: ותקח יעל אשת חבר את יתד האהל ותשם את המקבת בידה ותבוא אליו בלאט ותתקע את היתד ברקתו ותצנח בארץ והוא נרדם ויעף וימת
    kjvRefs:
    - Judges 4:21
    kjvOsis:
    - Judg.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.22
    scripture: tanakh
    name: Tanakh Judges 4:22
    ref: Judges 4:22
    book: Judg
    section: neviim
    chapter: 4
    verse: 22
    ordinal: 6616
    text: 'And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him: ‘Come, and I will show thee the man whom thou seekest.’ And he came unto her; and, behold, Sisera lay dead, and the tent-pin was in his temples.'
    translation: JPS 1917
    original: וְהִנֵּה בָרָק רֹדֵף אֶת־סִיסְרָא וַתֵּצֵא יָעֵל לִקְרָאתוֹ וַתֹּאמֶר לוֹ לֵךְ וְאַרְאֶךָּ אֶת־הָאִישׁ אֲשֶׁר־אַתָּה מְבַקֵּשׁ וַיָּבֹא אֵלֶיהָ וְהִנֵּה סִיסְרָא נֹפֵל מֵת וְהַיָּתֵד בְּרַקָּתוֹ׃
    hebrewPlain: והנה ברק רדף את סיסרא ותצא יעל לקראתו ותאמר לו לך ואראך את האיש אשר אתה מבקש ויבא אליה והנה סיסרא נפל מת והיתד ברקתו
    kjvRefs:
    - Judges 4:22
    kjvOsis:
    - Judg.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.23
    scripture: tanakh
    name: Tanakh Judges 4:23
    ref: Judges 4:23
    book: Judg
    section: neviim
    chapter: 4
    verse: 23
    ordinal: 6617
    text: So God subdued on that day Jabin the king of Canaan before the children of Israel.
    translation: JPS 1917
    original: וַיַּכְנַע אֱלֹהִים בַּיּוֹם הַהוּא אֵת יָבִין מֶלֶךְ־כְּנָעַן לִפְנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכנע אלהים ביום ההוא את יבין מלך כנען לפני בני ישראל
    kjvRefs:
    - Judges 4:23
    kjvOsis:
    - Judg.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.24
    scripture: tanakh
    name: Tanakh Judges 4:24
    ref: Judges 4:24
    book: Judg
    section: neviim
    chapter: 4
    verse: 24
    ordinal: 6618
    text: And the hand of the children of Israel prevailed more and more against Jabin the king of Canaan, until they had destroyed Jabin king of Canaan.
    translation: JPS 1917
    original: וַתֵּלֶךְ יַד בְּנֵי־יִשְׂרָאֵל הָלוֹךְ וְקָשָׁה עַל יָבִין מֶלֶךְ־כְּנָעַן עַד אֲשֶׁר הִכְרִיתוּ אֵת יָבִין מֶלֶךְ־כְּנָעַן׃
    hebrewPlain: ותלך יד בני ישראל הלוך וקשה על יבין מלך כנען עד אשר הכריתו את יבין מלך כנען
    kjvRefs:
    - Judges 4:24
    kjvOsis:
    - Judg.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.5.1
    scripture: tanakh
    name: Tanakh Judges 5:1
    ref: Judges 5:1
    book: Judg
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 6619
    text: 'Then sang Deborah and Barak the son of Abinoam on that day, saying:'
    translation: JPS 1917
    original: וַתָּשַׁר דְּבוֹרָה וּבָרָק בֶּן־אֲבִינֹעַם בַּיּוֹם הַהוּא לֵאמֹר׃
    hebrewPlain: ותשר דבורה וברק בן אבינעם ביום ההוא לאמר
    kjvRefs:
    - Judges 5:1
    kjvOsis:
    - Judg.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.2
    scripture: tanakh
    name: Tanakh Judges 5:2
    ref: Judges 5:2
    book: Judg
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 6620
    text: When men let grow their hair in Israel, When the people offer themselves willingly, Bless ye the LORD.
    translation: JPS 1917
    original: בִּפְרֹעַ פְּרָעוֹת בְּיִשְׂרָאֵל בְּהִתְנַדֵּב עָם בָּרֲכוּ יְהוָה׃
    hebrewPlain: בפרע פרעות בישראל בהתנדב עם ברכו יהוה
    kjvRefs:
    - Judges 5:2
    kjvOsis:
    - Judg.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.3
    scripture: tanakh
    name: Tanakh Judges 5:3
    ref: Judges 5:3
    book: Judg
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 6621
    text: Hear, O ye kings; give ear, O ye princes; I, unto the LORD will I sing; I will sing praise to the LORD, the God of Israel.
    translation: JPS 1917
    original: שִׁמְעוּ מְלָכִים הַאֲזִינוּ רֹזְנִים אָנֹכִי לַיהוָה אָנֹכִי אָשִׁירָה אֲזַמֵּר לַיהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: שמעו מלכים האזינו רזנים אנכי ליהוה אנכי אשירה אזמר ליהוה אלהי ישראל
    kjvRefs:
    - Judges 5:3
    kjvOsis:
    - Judg.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.4
    scripture: tanakh
    name: Tanakh Judges 5:4
    ref: Judges 5:4
    book: Judg
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 6622
    text: LORD, when Thou didst go forth out of Seir, When Thou didst march out of the field of Edom, The earth trembled, the heavens also dropped, Yea, the clouds dropped water.
    translation: JPS 1917
    original: יְהוָה בְּצֵאתְךָ מִשֵּׂעִיר בְּצַעְדְּךָ מִשְּׂדֵה אֱדוֹם אֶרֶץ רָעָשָׁה גַּם־שָׁמַיִם נָטָפוּ גַּם־עָבִים נָטְפוּ מָיִם׃
    hebrewPlain: יהוה בצאתך משעיר בצעדך משדה אדום ארץ רעשה גם שמים נטפו גם עבים נטפו מים
    kjvRefs:
    - Judges 5:4
    kjvOsis:
    - Judg.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.5
    scripture: tanakh
    name: Tanakh Judges 5:5
    ref: Judges 5:5
    book: Judg
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 6623
    text: The mountains quaked at the presence of the LORD, Even yon Sinai at the presence of the LORD, the God of Israel.
    translation: JPS 1917
    original: הָרִים נָזְלוּ מִפְּנֵי יְהוָה זֶה סִינַי מִפְּנֵי יְהוָה אֱלֹהֵי יִשְׂרָאֵל׃
    hebrewPlain: הרים נזלו מפני יהוה זה סיני מפני יהוה אלהי ישראל
    kjvRefs:
    - Judges 5:5
    kjvOsis:
    - Judg.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.6
    scripture: tanakh
    name: Tanakh Judges 5:6
    ref: Judges 5:6
    book: Judg
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 6624
    text: In the days of Shamgar the son of Anath, In the days of Jael, the highways ceased, And the travellers walked through byways.
    translation: JPS 1917
    original: בִּימֵי שַׁמְגַּר בֶּן־עֲנָת בִּימֵי יָעֵל חָדְלוּ אֳרָחוֹת וְהֹלְכֵי נְתִיבוֹת יֵלְכוּ אֳרָחוֹת עֲקַלְקַלּוֹת׃
    hebrewPlain: בימי שמגר בן ענת בימי יעל חדלו ארחות והלכי נתיבות ילכו ארחות עקלקלות
    kjvRefs:
    - Judges 5:6
    kjvOsis:
    - Judg.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.7
    scripture: tanakh
    name: Tanakh Judges 5:7
    ref: Judges 5:7
    book: Judg
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 6625
    text: The rulers ceased in Israel, they ceased, Until that thou didst arise, Deborah, That thou didst arise a mother in Israel. .
    translation: JPS 1917
    original: חָדְלוּ פְרָזוֹן בְּיִשְׂרָאֵל חָדֵלּוּ עַד שַׁקַּמְתִּי דְּבוֹרָה שַׁקַּמְתִּי אֵם בְּיִשְׂרָאֵל׃
    hebrewPlain: חדלו פרזון בישראל חדלו עד שקמתי דבורה שקמתי אם בישראל
    kjvRefs:
    - Judges 5:7
    kjvOsis:
    - Judg.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.8
    scripture: tanakh
    name: Tanakh Judges 5:8
    ref: Judges 5:8
    book: Judg
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 6626
    text: They chose new gods; Then was war in the gates; Was there a shield or spear seen Among forty thousand in Israel?
    translation: JPS 1917
    original: יִבְחַר אֱלֹהִים חֲדָשִׁים אָז לָחֶם שְׁעָרִים מָגֵן אִם־יֵרָאֶה וָרֹמַח בְּאַרְבָּעִים אֶלֶף בְּיִשְׂרָאֵל׃
    hebrewPlain: יבחר אלהים חדשים אז לחם שערים מגן אם יראה ורמח בארבעים אלף בישראל
    kjvRefs:
    - Judges 5:8
    kjvOsis:
    - Judg.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.9
    scripture: tanakh
    name: Tanakh Judges 5:9
    ref: Judges 5:9
    book: Judg
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 6627
    text: My heart is toward the governors of Israel, That offered themselves willingly among the people. Bless ye the LORD.
    translation: JPS 1917
    original: לִבִּי לְחוֹקְקֵי יִשְׂרָאֵל הַמִּתְנַדְּבִים בָּעָם בָּרֲכוּ יְהוָה׃
    hebrewPlain: לבי לחוקקי ישראל המתנדבים בעם ברכו יהוה
    kjvRefs:
    - Judges 5:9
    kjvOsis:
    - Judg.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.10
    scripture: tanakh
    name: Tanakh Judges 5:10
    ref: Judges 5:10
    book: Judg
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 6628
    text: Ye that ride on white asses, Ye that sit on rich cloths, And ye that walk by the way, tell of it;
    translation: JPS 1917
    original: רֹכְבֵי אֲתֹנוֹת צְחֹרוֹת יֹשְׁבֵי עַל־מִדִּין וְהֹלְכֵי עַל־דֶּרֶךְ שִׂיחוּ׃
    hebrewPlain: רכבי אתנות צחרות ישבי על מדין והלכי על דרך שיחו
    kjvRefs:
    - Judges 5:10
    kjvOsis:
    - Judg.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.11
    scripture: tanakh
    name: Tanakh Judges 5:11
    ref: Judges 5:11
    book: Judg
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 6629
    text: Louder than the voice of archers, by the watering-troughs! There shall they rehearse the righteous acts of the LORD, Even the righteous acts of His rulers in Israel. Then the people of the LORD went down to the gates.
    translation: JPS 1917
    original: מִקּוֹל מְחַצְצִים בֵּין מַשְׁאַבִּים שָׁם יְתַנּוּ צִדְקוֹת יְהוָה צִדְקֹת פִּרְזֹנוֹ בְּיִשְׂרָאֵל אָז יָרְדוּ לַשְּׁעָרִים עַם־יְהוָה׃
    hebrewPlain: מקול מחצצים בין משאבים שם יתנו צדקות יהוה צדקת פרזנו בישראל אז ירדו לשערים עם יהוה
    kjvRefs:
    - Judges 5:11
    kjvOsis:
    - Judg.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.12
    scripture: tanakh
    name: Tanakh Judges 5:12
    ref: Judges 5:12
    book: Judg
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 6630
    text: Awake, awake, Deborah; Awake, awake, utter a song; Arise, Barak, and lead thy captivity captive, thou son of Abinoam.
    translation: JPS 1917
    original: עוּרִי עוּרִי דְּבוֹרָה עוּרִי עוּרִי דַּבְּרִי־שִׁיר קוּם בָּרָק וּשֲׁבֵה שֶׁבְיְךָ בֶּן־אֲבִינֹעַם׃
    hebrewPlain: עורי עורי דבורה עורי עורי דברי שיר קום ברק ושבה שביך בן אבינעם
    kjvRefs:
    - Judges 5:12
    kjvOsis:
    - Judg.5.12
