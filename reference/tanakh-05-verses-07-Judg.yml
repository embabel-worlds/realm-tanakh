- type: TanakhVerse
  data:
    osis: Judg.1.10
    scripture: tanakh
    name: Tanakh Judges 1:10
    ref: Judges 1:10
    book: Judg
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 6514
    text: And Judah went against the Canaanites that dwelt in Hebron—now the name of Hebron beforetime was Kiriath-arba—and they smote Sheshai, and Ahiman, and Talmai.
    translation: JPS 1917
    original: וַיֵּלֶךְ יְהוּדָה אֶל־הַכְּנַעֲנִי הַיּוֹשֵׁב בְּחֶבְרוֹן וְשֵׁם־חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע וַיַּכּוּ אֶת־שֵׁשַׁי וְאֶת־אֲחִימַן וְאֶת־תַּלְמָי׃
    hebrewPlain: וילך יהודה אל הכנעני היושב בחברון ושם חברון לפנים קרית ארבע ויכו את ששי ואת אחימן ואת תלמי
    kjvRefs:
    - Judges 1:10
    kjvOsis:
    - Judg.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.11
    scripture: tanakh
    name: Tanakh Judges 1:11
    ref: Judges 1:11
    book: Judg
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 6515
    text: And from thence he went against the inhabitants of Debir—now the name of Debir beforetime was Kiriath-sepher.
    translation: JPS 1917
    original: וַיֵּלֶךְ מִשָּׁם אֶל־יוֹשְׁבֵי דְּבִיר וְשֵׁם־דְּבִיר לְפָנִים קִרְיַת־סֵפֶר׃
    hebrewPlain: וילך משם אל יושבי דביר ושם דביר לפנים קרית ספר
    kjvRefs:
    - Judges 1:11
    kjvOsis:
    - Judg.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.12
    scripture: tanakh
    name: Tanakh Judges 1:12
    ref: Judges 1:12
    book: Judg
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 6516
    text: 'And Caleb said: ‘He that smiteth Kiriath-sepher, and taketh it, to him will I give Achsah my daughter to wife.’'
    translation: JPS 1917
    original: וַיֹּאמֶר כָּלֵב אֲשֶׁר־יַכֶּה אֶת־קִרְיַת־סֵפֶר וּלְכָדָהּ וְנָתַתִּי לוֹ אֶת־עַכְסָה בִתִּי לְאִשָּׁה׃
    hebrewPlain: ויאמר כלב אשר יכה את קרית ספר ולכדה ונתתי לו את עכסה בתי לאשה
    kjvRefs:
    - Judges 1:12
    kjvOsis:
    - Judg.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.13
    scripture: tanakh
    name: Tanakh Judges 1:13
    ref: Judges 1:13
    book: Judg
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 6517
    text: And Othniel the son of Kenaz, Caleb’s younger brother, took it; and he gave him Achsah his daughter to wife.
    translation: JPS 1917
    original: וַיִּלְכְּדָהּ עָתְנִיאֵל בֶּן־קְנַז אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ וַיִּתֶּן־לוֹ אֶת־עַכְסָה בִתּוֹ לְאִשָּׁה׃
    hebrewPlain: וילכדה עתניאל בן קנז אחי כלב הקטן ממנו ויתן לו את עכסה בתו לאשה
    kjvRefs:
    - Judges 1:13
    kjvOsis:
    - Judg.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.14
    scripture: tanakh
    name: Tanakh Judges 1:14
    ref: Judges 1:14
    book: Judg
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 6518
    text: 'And it came to pass, when she came unto him, that she moved him to ask of her father a field; and she alighted from off her ass; and Caleb said unto her: ‘What wouldest thou?’'
    translation: JPS 1917
    original: וַיְהִי בְּבוֹאָהּ וַתְּסִיתֵהוּ לִשְׁאוֹל מֵאֵת־אָבִיהָ הַשָּׂדֶה וַתִּצְנַח מֵעַל הַחֲמוֹר וַיֹּאמֶר־לָהּ כָּלֵב מַה־לָּךְ׃
    hebrewPlain: ויהי בבואה ותסיתהו לשאול מאת אביה השדה ותצנח מעל החמור ויאמר לה כלב מה לך
    kjvRefs:
    - Judges 1:14
    kjvOsis:
    - Judg.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.15
    scripture: tanakh
    name: Tanakh Judges 1:15
    ref: Judges 1:15
    book: Judg
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 6519
    text: 'And she said unto him: ‘Give me a blessing; for that thou hast set me in the Southland, give me therefore springs of water.’ And Caleb gave her the Upper Springs and the Nether Springs.'
    translation: JPS 1917
    original: וַתֹּאמֶר לוֹ הָבָה־לִּי בְרָכָה כִּי אֶרֶץ הַנֶּגֶב נְתַתָּנִי וְנָתַתָּה לִי גֻּלֹּת מָיִם וַיִּתֶּן־לָהּ כָּלֵב אֵת גֻּלֹּת עִלִּית וְאֵת גֻּלֹּת תַּחְתִּית׃
    hebrewPlain: ותאמר לו הבה לי ברכה כי ארץ הנגב נתתני ונתתה לי גלת מים ויתן לה כלב את גלת עלית ואת גלת תחתית
    kjvRefs:
    - Judges 1:15
    kjvOsis:
    - Judg.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.16
    scripture: tanakh
    name: Tanakh Judges 1:16
    ref: Judges 1:16
    book: Judg
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 6520
    text: And the children of the Kenite, Moses’ father-in-law, went up out of the city of palm-trees with the children of Judah into the wilderness of Judah, which is in the south of Arad; and they went and dwelt with the people.
    translation: JPS 1917
    original: וּבְנֵי קֵינִי חֹתֵן מֹשֶׁה עָלוּ מֵעִיר הַתְּמָרִים אֶת־בְּנֵי יְהוּדָה מִדְבַּר יְהוּדָה אֲשֶׁר בְּנֶגֶב עֲרָד וַיֵּלֶךְ וַיֵּשֶׁב אֶת־הָעָם׃
    hebrewPlain: ובני קיני חתן משה עלו מעיר התמרים את בני יהודה מדבר יהודה אשר בנגב ערד וילך וישב את העם
    kjvRefs:
    - Judges 1:16
    kjvOsis:
    - Judg.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.17
    scripture: tanakh
    name: Tanakh Judges 1:17
    ref: Judges 1:17
    book: Judg
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 6521
    text: And Judah went with Simeon his brother, and they smote the Canaanites that inhabited Zephath, and utterly destroyed it. And the name of the city was called Hormah.
    translation: JPS 1917
    original: וַיֵּלֶךְ יְהוּדָה אֶת־שִׁמְעוֹן אָחִיו וַיַּכּוּ אֶת־הַכְּנַעֲנִי יוֹשֵׁב צְפַת וַיַּחֲרִימוּ אוֹתָהּ וַיִּקְרָא אֶת־שֵׁם־הָעִיר חָרְמָה׃
    hebrewPlain: וילך יהודה את שמעון אחיו ויכו את הכנעני יושב צפת ויחרימו אותה ויקרא את שם העיר חרמה
    kjvRefs:
    - Judges 1:17
    kjvOsis:
    - Judg.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.18
    scripture: tanakh
    name: Tanakh Judges 1:18
    ref: Judges 1:18
    book: Judg
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 6522
    text: Also Judah took Gaza with the border thereof, and Ashkelon with the border thereof, and Ekron with the border thereof.
    translation: JPS 1917
    original: וַיִּלְכֹּד יְהוּדָה אֶת־עַזָּה וְאֶת־גְּבוּלָהּ וְאֶת־אַשְׁקְלוֹן וְאֶת־גְּבוּלָהּ וְאֶת־עֶקְרוֹן וְאֶת־גְּבוּלָהּ׃
    hebrewPlain: וילכד יהודה את עזה ואת גבולה ואת אשקלון ואת גבולה ואת עקרון ואת גבולה
    kjvRefs:
    - Judges 1:18
    kjvOsis:
    - Judg.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.19
    scripture: tanakh
    name: Tanakh Judges 1:19
    ref: Judges 1:19
    book: Judg
    section: neviim
    chapter: 1
    verse: 19
    ordinal: 6523
    text: And the LORD was with Judah; and he drove out the inhabitants of the hill-country; for he could not drive out the inhabitants of the valley, because they had chariots of iron.
    translation: JPS 1917
    original: וַיְהִי יְהוָה אֶתּ־יְהוּדָה וַיֹּרֶשׁ אֶת־הָהָר כִּי לֹא לְהוֹרִישׁ אֶת־יֹשְׁבֵי הָעֵמֶק כִּי־רֶכֶב בַּרְזֶל לָהֶם׃
    hebrewPlain: ויהי יהוה את יהודה וירש את ההר כי לא להוריש את ישבי העמק כי רכב ברזל להם
    kjvRefs:
    - Judges 1:19
    kjvOsis:
    - Judg.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.20
    scripture: tanakh
    name: Tanakh Judges 1:20
    ref: Judges 1:20
    book: Judg
    section: neviim
    chapter: 1
    verse: 20
    ordinal: 6524
    text: And they gave Hebron unto Caleb, as Moses had spoken; and he drove out thence the three sons of Anak.
    translation: JPS 1917
    original: וַיִּתְּנוּ לְכָלֵב אֶת־חֶבְרוֹן כַּאֲשֶׁר דִּבֶּר מֹשֶׁה וַיּוֹרֶשׁ מִשָּׁם אֶת־שְׁלֹשָׁה בְּנֵי הָעֲנָק׃
    hebrewPlain: ויתנו לכלב את חברון כאשר דבר משה ויורש משם את שלשה בני הענק
    kjvRefs:
    - Judges 1:20
    kjvOsis:
    - Judg.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.21
    scripture: tanakh
    name: Tanakh Judges 1:21
    ref: Judges 1:21
    book: Judg
    section: neviim
    chapter: 1
    verse: 21
    ordinal: 6525
    text: And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwelt with the children of Benjamin in Jerusalem, unto this day.
    translation: JPS 1917
    original: וְאֶת־הַיְבוּסִי יֹשֵׁב יְרוּשָׁלִַם לֹא הוֹרִישׁוּ בְּנֵי בִנְיָמִן וַיֵּשֶׁב הַיְבוּסִי אֶת־בְּנֵי בִנְיָמִן בִּירוּשָׁלִַם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ואת היבוסי ישב ירושלם לא הורישו בני בנימן וישב היבוסי את בני בנימן בירושלם עד היום הזה
    kjvRefs:
    - Judges 1:21
    kjvOsis:
    - Judg.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.22
    scripture: tanakh
    name: Tanakh Judges 1:22
    ref: Judges 1:22
    book: Judg
    section: neviim
    chapter: 1
    verse: 22
    ordinal: 6526
    text: And the house of Joseph, they also went up against Beth-el; and the LORD was with them.
    translation: JPS 1917
    original: וַיַּעֲלוּ בֵית־יוֹסֵף גַּם־הֵם בֵּית־אֵל וַיהוָה עִמָּם׃
    hebrewPlain: ויעלו בית יוסף גם הם בית אל ויהוה עמם
    kjvRefs:
    - Judges 1:22
    kjvOsis:
    - Judg.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.23
    scripture: tanakh
    name: Tanakh Judges 1:23
    ref: Judges 1:23
    book: Judg
    section: neviim
    chapter: 1
    verse: 23
    ordinal: 6527
    text: And the house of Joseph sent to spy out Beth-el—now the name of the city beforetime was Luz.
    translation: JPS 1917
    original: וַיָּתִירוּ בֵית־יוֹסֵף בְּבֵית־אֵל וְשֵׁם־הָעִיר לְפָנִים לוּז׃
    hebrewPlain: ויתירו בית יוסף בבית אל ושם העיר לפנים לוז
    kjvRefs:
    - Judges 1:23
    kjvOsis:
    - Judg.1.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.24
    scripture: tanakh
    name: Tanakh Judges 1:24
    ref: Judges 1:24
    book: Judg
    section: neviim
    chapter: 1
    verse: 24
    ordinal: 6528
    text: 'And the watchers saw a man come forth out of the city, and they said unto him: ‘Show us, we pray thee, the entrance into the city, and we will deal kindly with thee.’'
    translation: JPS 1917
    original: וַיִּרְאוּ הַשֹּׁמְרִים אִישׁ יוֹצֵא מִן־הָעִיר וַיֹּאמְרוּ לוֹ הַרְאֵנוּ נָא אֶת־מְבוֹא הָעִיר וְעָשִׂינוּ עִמְּךָ חָסֶד׃
    hebrewPlain: ויראו השמרים איש יוצא מן העיר ויאמרו לו הראנו נא את מבוא העיר ועשינו עמך חסד
    kjvRefs:
    - Judges 1:24
    kjvOsis:
    - Judg.1.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.25
    scripture: tanakh
    name: Tanakh Judges 1:25
    ref: Judges 1:25
    book: Judg
    section: neviim
    chapter: 1
    verse: 25
    ordinal: 6529
    text: And he showed them the entrance into the city, and they smote the city with the edge of the sword; but they let the man go and all his family.
    translation: JPS 1917
    original: וַיַּרְאֵם אֶת־מְבוֹא הָעִיר וַיַּכּוּ אֶת־הָעִיר לְפִי־חָרֶב וְאֶת־הָאִישׁ וְאֶת־כָּל־מִשְׁפַּחְתּוֹ שִׁלֵּחוּ׃
    hebrewPlain: ויראם את מבוא העיר ויכו את העיר לפי חרב ואת האיש ואת כל משפחתו שלחו
    kjvRefs:
    - Judges 1:25
    kjvOsis:
    - Judg.1.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.26
    scripture: tanakh
    name: Tanakh Judges 1:26
    ref: Judges 1:26
    book: Judg
    section: neviim
    chapter: 1
    verse: 26
    ordinal: 6530
    text: And the man went into the land of the Hittites, and built a city, and called the name thereof Luz, which is the name thereof unto this day.
    translation: JPS 1917
    original: וַיֵּלֶךְ הָאִישׁ אֶרֶץ הַחִתִּים וַיִּבֶן עִיר וַיִּקְרָא שְׁמָהּ לוּז הוּא שְׁמָהּ עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: וילך האיש ארץ החתים ויבן עיר ויקרא שמה לוז הוא שמה עד היום הזה
    kjvRefs:
    - Judges 1:26
    kjvOsis:
    - Judg.1.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.27
    scripture: tanakh
    name: Tanakh Judges 1:27
    ref: Judges 1:27
    book: Judg
    section: neviim
    chapter: 1
    verse: 27
    ordinal: 6531
    text: And Manasseh did not drive out the inhabitants of Beth-shean and its towns, nor of Taanach and its towns, nor the inhabitants of Dor and its towns, nor the inhabitants of Ibleam and its towns, nor the inhabitants of Megiddo and its towns; but the Canaanites were resolved to dwell in that land.
    translation: JPS 1917
    original: וְלֹא־הוֹרִישׁ מְנַשֶּׁה אֶת־בֵּית־שְׁאָן וְאֶת־בְּנוֹתֶיהָ וְאֶת־תַּעְנַךְ וְאֶת־בְּנֹתֶיהָ וְאֶת־ישב [יֹשְׁבֵי] דוֹר וְאֶת־בְּנוֹתֶיהָ וְאֶת־יוֹשְׁבֵי יִבְלְעָם וְאֶת־בְּנֹתֶיהָ וְאֶת־יוֹשְׁבֵי מְגִדּוֹ וְאֶת־בְּנוֹתֶיהָ וַיּוֹאֶל הַכְּנַעֲנִי לָשֶׁבֶת בָּאָרֶץ הַזֹּאת׃
    hebrewPlain: ולא הוריש מנשה את בית שאן ואת בנותיה ואת תענך ואת בנתיה ואת ישב [ישבי] דור ואת בנותיה ואת יושבי יבלעם ואת בנתיה ואת יושבי מגדו ואת בנותיה ויואל הכנעני לשבת בארץ הזאת
    kjvRefs:
    - Judges 1:27
    kjvOsis:
    - Judg.1.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.28
    scripture: tanakh
    name: Tanakh Judges 1:28
    ref: Judges 1:28
    book: Judg
    section: neviim
    chapter: 1
    verse: 28
    ordinal: 6532
    text: And it came to pass, when Israel was waxen strong, that they put the Canaanites to task-work, but did in no wise drive them out.
    translation: JPS 1917
    original: וַיְהִי כִּי־חָזַק יִשְׂרָאֵל וַיָּשֶׂם אֶת־הַכְּנַעֲנִי לָמַס וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ׃
    hebrewPlain: ויהי כי חזק ישראל וישם את הכנעני למס והוריש לא הורישו
    kjvRefs:
    - Judges 1:28
    kjvOsis:
    - Judg.1.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.29
    scripture: tanakh
    name: Tanakh Judges 1:29
    ref: Judges 1:29
    book: Judg
    section: neviim
    chapter: 1
    verse: 29
    ordinal: 6533
    text: And Ephraim drove not out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.
    translation: JPS 1917
    original: וְאֶפְרַיִם לֹא הוֹרִישׁ אֶת־הַכְּנַעֲנִי הַיּוֹשֵׁב בְּגָזֶר וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ בְּגָזֶר׃
    hebrewPlain: ואפרים לא הוריש את הכנעני היושב בגזר וישב הכנעני בקרבו בגזר
    kjvRefs:
    - Judges 1:29
    kjvOsis:
    - Judg.1.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.30
    scripture: tanakh
    name: Tanakh Judges 1:30
    ref: Judges 1:30
    book: Judg
    section: neviim
    chapter: 1
    verse: 30
    ordinal: 6534
    text: 'Zebulun drove not out the inhabitants of Kitron, nor the: inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributary.'
    translation: JPS 1917
    original: זְבוּלֻן לֹא הוֹרִישׁ אֶת־יוֹשְׁבֵי קִטְרוֹן וְאֶת־יוֹשְׁבֵי נַהֲלֹל וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ וַיִּהְיוּ לָמַס׃
    hebrewPlain: זבולן לא הוריש את יושבי קטרון ואת יושבי נהלל וישב הכנעני בקרבו ויהיו למס
    kjvRefs:
    - Judges 1:30
    kjvOsis:
    - Judg.1.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.31
    scripture: tanakh
    name: Tanakh Judges 1:31
    ref: Judges 1:31
    book: Judg
    section: neviim
    chapter: 1
    verse: 31
    ordinal: 6535
    text: Asher drove not out the inhabitants of Acco, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob;
    translation: JPS 1917
    original: אָשֵׁר לֹא הוֹרִישׁ אֶת־יֹשְׁבֵי עַכּוֹ וְאֶת־יוֹשְׁבֵי צִידוֹן וְאֶת־אַחְלָב וְאֶת־אַכְזִיב וְאֶת־חֶלְבָּה וְאֶת־אֲפִיק וְאֶת־רְחֹב׃
    hebrewPlain: אשר לא הוריש את ישבי עכו ואת יושבי צידון ואת אחלב ואת אכזיב ואת חלבה ואת אפיק ואת רחב
    kjvRefs:
    - Judges 1:31
    kjvOsis:
    - Judg.1.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.32
    scripture: tanakh
    name: Tanakh Judges 1:32
    ref: Judges 1:32
    book: Judg
    section: neviim
    chapter: 1
    verse: 32
    ordinal: 6536
    text: but the Asherites dwelt among the Canaanites, the inhabitants of the land; for they did not drive them out.
    translation: JPS 1917
    original: וַיֵּשֶׁב הָאָשֵׁרִי בְּקֶרֶב הַכְּנַעֲנִי יֹשְׁבֵי הָאָרֶץ כִּי לֹא הוֹרִישׁוֹ׃
    hebrewPlain: וישב האשרי בקרב הכנעני ישבי הארץ כי לא הורישו
    kjvRefs:
    - Judges 1:32
    kjvOsis:
    - Judg.1.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.33
    scripture: tanakh
    name: Tanakh Judges 1:33
    ref: Judges 1:33
    book: Judg
    section: neviim
    chapter: 1
    verse: 33
    ordinal: 6537
    text: Naphtali drove not out the inhabitants of Beth-shemesh, nor the inhabitants of Beth-anath; but he dwelt among the Canaanites, the inhabitants of the land; nevertheless the inhabitants of Beth-shemesh and of Beth-anath became tributary unto them.
    translation: JPS 1917
    original: נַפְתָּלִי לֹא־הוֹרִישׁ אֶת־יֹשְׁבֵי בֵית־שֶׁמֶשׁ וְאֶת־יֹשְׁבֵי בֵית־עֲנָת וַיֵּשֶׁב בְּקֶרֶב הַכְּנַעֲנִי יֹשְׁבֵי הָאָרֶץ וְיֹשְׁבֵי בֵית־שֶׁמֶשׁ וּבֵית עֲנָת הָיוּ לָהֶם לָמַס׃
    hebrewPlain: נפתלי לא הוריש את ישבי בית שמש ואת ישבי בית ענת וישב בקרב הכנעני ישבי הארץ וישבי בית שמש ובית ענת היו להם למס
    kjvRefs:
    - Judges 1:33
    kjvOsis:
    - Judg.1.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.34
    scripture: tanakh
    name: Tanakh Judges 1:34
    ref: Judges 1:34
    book: Judg
    section: neviim
    chapter: 1
    verse: 34
    ordinal: 6538
    text: And the Amorites forced the children of Dan into the hill-country; for they would not suffer them to come down to the valley.
    translation: JPS 1917
    original: וַיִּלְחֲצוּ הָאֱמֹרִי אֶת־בְּנֵי־דָן הָהָרָה כִּי־לֹא נְתָנוֹ לָרֶדֶת לָעֵמֶק׃
    hebrewPlain: וילחצו האמרי את בני דן ההרה כי לא נתנו לרדת לעמק
    kjvRefs:
    - Judges 1:34
    kjvOsis:
    - Judg.1.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.35
    scripture: tanakh
    name: Tanakh Judges 1:35
    ref: Judges 1:35
    book: Judg
    section: neviim
    chapter: 1
    verse: 35
    ordinal: 6539
    text: But the Amorites were resolved to dwell in Harheres, in Aijalon, and in Shaalbim; yet the hand of the house of Joseph prevailed, so that they became tributary.
    translation: JPS 1917
    original: וַיּוֹאֶל הָאֱמֹרִי לָשֶׁבֶת בְּהַר־חֶרֶס בְּאַיָּלוֹן וּבְשַׁעַלְבִים וַתִּכְבַּד יַד בֵּית־יוֹסֵף וַיִּהְיוּ לָמַס׃
    hebrewPlain: ויואל האמרי לשבת בהר חרס באילון ובשעלבים ותכבד יד בית יוסף ויהיו למס
    kjvRefs:
    - Judges 1:35
    kjvOsis:
    - Judg.1.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.1.36
    scripture: tanakh
    name: Tanakh Judges 1:36
    ref: Judges 1:36
    book: Judg
    section: neviim
    chapter: 1
    verse: 36
    ordinal: 6540
    text: And the border of the Amorites was from the ascent of Akrabbim, from Sela, and upward.
    translation: JPS 1917
    original: וּגְבוּל הָאֱמֹרִי מִמַּעֲלֵה עַקְרַבִּים מֵהַסֶּלַע וָמָעְלָה׃
    hebrewPlain: וגבול האמרי ממעלה עקרבים מהסלע ומעלה
    kjvRefs:
    - Judges 1:36
    kjvOsis:
    - Judg.1.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.1
- type: TanakhVerse
  data:
    osis: Judg.2.1
    scripture: tanakh
    name: Tanakh Judges 2:1
    ref: Judges 2:1
    book: Judg
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 6541
    text: 'And the angel of the LORD came up from Gilgal to Bochim. And he said: ‘...I made you to go up out of Egypt, and have brought you unto the land which I swore unto your fathers; and I said: I will never break My covenant with you;'
    translation: JPS 1917
    original: וַיַּעַל מַלְאַךְ־יְהוָה מִן־הַגִּלְגָּל אֶל־הַבֹּכִים וַיֹּאמֶר אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם וָאָבִיא אֶתְכֶם אֶל־הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם וָאֹמַר לֹא־אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם׃
    hebrewPlain: ויעל מלאך יהוה מן הגלגל אל הבכים ויאמר אעלה אתכם ממצרים ואביא אתכם אל הארץ אשר נשבעתי לאבתיכם ואמר לא אפר בריתי אתכם לעולם
    kjvRefs:
    - Judges 2:1
    kjvOsis:
    - Judg.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.2
    scripture: tanakh
    name: Tanakh Judges 2:2
    ref: Judges 2:2
    book: Judg
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 6542
    text: and ye shall make no covenant with the inhabitants of this land; ye shall break down their altars; but ye have not hearkened unto My voice; what is this ye have done?
    translation: JPS 1917
    original: וְאַתֶּם לֹא־תִכְרְתוּ בְרִית לְיוֹשְׁבֵי הָאָרֶץ הַזֹּאת מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן וְלֹא־שְׁמַעְתֶּם בְּקֹלִי מַה־זֹּאת עֲשִׂיתֶם׃
    hebrewPlain: ואתם לא תכרתו ברית ליושבי הארץ הזאת מזבחותיהם תתצון ולא שמעתם בקלי מה זאת עשיתם
    kjvRefs:
    - Judges 2:2
    kjvOsis:
    - Judg.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.3
    scripture: tanakh
    name: Tanakh Judges 2:3
    ref: Judges 2:3
    book: Judg
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 6543
    text: 'Wherefore I also said: I will not drive them out from before you; but they shall be unto you as snares, and their gods shall be a trap unto you.’'
    translation: JPS 1917
    original: וְגַם אָמַרְתִּי לֹא־אֲגָרֵשׁ אוֹתָם מִפְּנֵיכֶם וְהָיוּ לָכֶם לְצִדִּים וֵאלֹהֵיהֶם יִהְיוּ לָכֶם לְמוֹקֵשׁ׃
    hebrewPlain: וגם אמרתי לא אגרש אותם מפניכם והיו לכם לצדים ואלהיהם יהיו לכם למוקש
    kjvRefs:
    - Judges 2:3
    kjvOsis:
    - Judg.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.4
    scripture: tanakh
    name: Tanakh Judges 2:4
    ref: Judges 2:4
    book: Judg
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 6544
    text: And it came to pass, when the angel of the LORD spoke these words unto all the children of Israel, that the people lifted up their voice, and wept.
    translation: JPS 1917
    original: וַיְהִי כְּדַבֵּר מַלְאַךְ יְהוָה אֶת־הַדְּבָרִים הָאֵלֶּה אֶל־כָּל־בְּנֵי יִשְׂרָאֵל וַיִּשְׂאוּ הָעָם אֶת־קוֹלָם וַיִּבְכּוּ׃
    hebrewPlain: ויהי כדבר מלאך יהוה את הדברים האלה אל כל בני ישראל וישאו העם את קולם ויבכו
    kjvRefs:
    - Judges 2:4
    kjvOsis:
    - Judg.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.5
    scripture: tanakh
    name: Tanakh Judges 2:5
    ref: Judges 2:5
    book: Judg
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 6545
    text: And they called the name of that place Bochim; and they sacrificed there unto the LORD.
    translation: JPS 1917
    original: וַיִּקְרְאוּ שֵׁם־הַמָּקוֹם הַהוּא בֹּכִים וַיִּזְבְּחוּ־שָׁם לַיהוָה׃
    hebrewPlain: ויקראו שם המקום ההוא בכים ויזבחו שם ליהוה
    kjvRefs:
    - Judges 2:5
    kjvOsis:
    - Judg.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.6
    scripture: tanakh
    name: Tanakh Judges 2:6
    ref: Judges 2:6
    book: Judg
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 6546
    text: Now when Joshua had sent the people away, the children of Israel went every man unto his inheritance to possess the land.
    translation: JPS 1917
    original: וַיְשַׁלַּח יְהוֹשֻׁעַ אֶת־הָעָם וַיֵּלְכוּ בְנֵי־יִשְׂרָאֵל אִישׁ לְנַחֲלָתוֹ לָרֶשֶׁת אֶת־הָאָרֶץ׃
    hebrewPlain: וישלח יהושע את העם וילכו בני ישראל איש לנחלתו לרשת את הארץ
    kjvRefs:
    - Judges 2:6
    kjvOsis:
    - Judg.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.7
    scripture: tanakh
    name: Tanakh Judges 2:7
    ref: Judges 2:7
    book: Judg
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 6547
    text: And the people served the LORD all the days of Joshua, and all the days of the elders that outlived Joshua, who had seen all the great work of the LORD, that He had wrought for Israel.
    translation: JPS 1917
    original: וַיַּעַבְדוּ הָעָם אֶת־יְהוָה כֹּל יְמֵי יְהוֹשֻׁעַ וְכֹל יְמֵי הַזְּקֵנִים אֲשֶׁר הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשׁוּעַ אֲשֶׁר רָאוּ אֵת כָּל־מַעֲשֵׂה יְהוָה הַגָּדוֹל אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל׃
    hebrewPlain: ויעבדו העם את יהוה כל ימי יהושע וכל ימי הזקנים אשר האריכו ימים אחרי יהושוע אשר ראו את כל מעשה יהוה הגדול אשר עשה לישראל
    kjvRefs:
    - Judges 2:7
    kjvOsis:
    - Judg.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.8
    scripture: tanakh
    name: Tanakh Judges 2:8
    ref: Judges 2:8
    book: Judg
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 6548
    text: And Joshua the son of Nun, the servant of the LORD, died, being a hundred and ten years old.
    translation: JPS 1917
    original: וַיָּמָת יְהוֹשֻׁעַ בִּן־נוּן עֶבֶד יְהוָה בֶּן־מֵאָה וָעֶשֶׂר שָׁנִים׃
    hebrewPlain: וימת יהושע בן נון עבד יהוה בן מאה ועשר שנים
    kjvRefs:
    - Judges 2:8
    kjvOsis:
    - Judg.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.9
    scripture: tanakh
    name: Tanakh Judges 2:9
    ref: Judges 2:9
    book: Judg
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 6549
    text: And they buried him in the border of his inheritance in Timnath-heres, in the hill-country of Ephraim, on the north of the mountain of Gaash.
    translation: JPS 1917
    original: וַיִּקְבְּרוּ אוֹתוֹ בִּגְבוּל נַחֲלָתוֹ בְּתִמְנַת־חֶרֶס בְּהַר אֶפְרָיִם מִצְּפוֹן לְהַר־גָּעַשׁ׃
    hebrewPlain: ויקברו אותו בגבול נחלתו בתמנת חרס בהר אפרים מצפון להר געש
    kjvRefs:
    - Judges 2:9
    kjvOsis:
    - Judg.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.10
    scripture: tanakh
    name: Tanakh Judges 2:10
    ref: Judges 2:10
    book: Judg
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 6550
    text: And also all that generation were gathered unto their fathers; and there arose another generation after them, that knew not the LORD, nor yet the work which He had wrought for Israel.
    translation: JPS 1917
    original: וְגַם כָּל־הַדּוֹר הַהוּא נֶאֶסְפוּ אֶל־אֲבוֹתָיו וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם אֲשֶׁר לֹא־יָדְעוּ אֶת־יְהוָה וְגַם אֶת־הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל׃
    hebrewPlain: וגם כל הדור ההוא נאספו אל אבותיו ויקם דור אחר אחריהם אשר לא ידעו את יהוה וגם את המעשה אשר עשה לישראל
    kjvRefs:
    - Judges 2:10
    kjvOsis:
    - Judg.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.11
    scripture: tanakh
    name: Tanakh Judges 2:11
    ref: Judges 2:11
    book: Judg
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 6551
    text: And the children of Israel did that which was evil in the sight of the LORD, and served the Baalim.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־יִשְׂרָאֵל אֶת־הָרַע בְּעֵינֵי יְהוָה וַיַּעַבְדוּ אֶת־הַבְּעָלִים׃
    hebrewPlain: ויעשו בני ישראל את הרע בעיני יהוה ויעבדו את הבעלים
    kjvRefs:
    - Judges 2:11
    kjvOsis:
    - Judg.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.12
    scripture: tanakh
    name: Tanakh Judges 2:12
    ref: Judges 2:12
    book: Judg
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 6552
    text: And they forsook the LORD, the God of their fathers, who brought them out of the land of Egypt, and followed other gods, of the gods of the peoples that were round about them, and worshipped them; and they provoked the LORD.
    translation: JPS 1917
    original: וַיַּעַזְבוּ אֶת־יְהוָה אֱלֹהֵי אֲבוֹתָם הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם וַיִּשְׁתַּחֲווּ לָהֶם וַיַּכְעִסוּ אֶת־יְהוָה׃
    hebrewPlain: ויעזבו את יהוה אלהי אבותם המוציא אותם מארץ מצרים וילכו אחרי אלהים אחרים מאלהי העמים אשר סביבותיהם וישתחוו להם ויכעסו את יהוה
    kjvRefs:
    - Judges 2:12
    kjvOsis:
    - Judg.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.13
    scripture: tanakh
    name: Tanakh Judges 2:13
    ref: Judges 2:13
    book: Judg
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 6553
    text: And they forsook the LORD, and served Baal and the Ashtaroth.
    translation: JPS 1917
    original: וַיַּעַזְבוּ אֶת־יְהוָה וַיַּעַבְדוּ לַבַּעַל וְלָעַשְׁתָּרוֹת׃
    hebrewPlain: ויעזבו את יהוה ויעבדו לבעל ולעשתרות
    kjvRefs:
    - Judges 2:13
    kjvOsis:
    - Judg.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.14
    scripture: tanakh
    name: Tanakh Judges 2:14
    ref: Judges 2:14
    book: Judg
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 6554
    text: And the anger of the LORD was kindled against Israel, and He delivered them into the hands of spoilers that spoiled them, and He gave them over into the hands of their enemies round about, so that they could not any longer stand before their enemies.
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בְּיִשְׂרָאֵל וַיִּתְּנֵם בְּיַד־שֹׁסִים וַיָּשֹׁסּוּ אוֹתָם וַיִּמְכְּרֵם בְּיַד אוֹיְבֵיהֶם מִסָּבִיב וְלֹא־יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי אוֹיְבֵיהֶם׃
    hebrewPlain: ויחר אף יהוה בישראל ויתנם ביד שסים וישסו אותם וימכרם ביד אויביהם מסביב ולא יכלו עוד לעמד לפני אויביהם
    kjvRefs:
    - Judges 2:14
    kjvOsis:
    - Judg.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.15
    scripture: tanakh
    name: Tanakh Judges 2:15
    ref: Judges 2:15
    book: Judg
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 6555
    text: Whithersoever they went out, the hand of the LORD was against them for evil, as the LORD had spoken, and as the LORD had sworn unto them; and they were sore distressed.
    translation: JPS 1917
    original: בְּכֹל אֲשֶׁר יָצְאוּ יַד־יְהוָה הָיְתָה־בָּם לְרָעָה כַּאֲשֶׁר דִּבֶּר יְהוָה וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם וַיֵּצֶר לָהֶם מְאֹד׃
    hebrewPlain: בכל אשר יצאו יד יהוה היתה בם לרעה כאשר דבר יהוה וכאשר נשבע יהוה להם ויצר להם מאד
    kjvRefs:
    - Judges 2:15
    kjvOsis:
    - Judg.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.16
    scripture: tanakh
    name: Tanakh Judges 2:16
    ref: Judges 2:16
    book: Judg
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 6556
    text: And the LORD raised up judges, who saved them out of the hand of those that spoiled them.
    translation: JPS 1917
    original: וַיָּקֶם יְהוָה שֹׁפְטִים וַיּוֹשִׁיעוּם מִיַּד שֹׁסֵיהֶם׃
    hebrewPlain: ויקם יהוה שפטים ויושיעום מיד שסיהם
    kjvRefs:
    - Judges 2:16
    kjvOsis:
    - Judg.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.17
    scripture: tanakh
    name: Tanakh Judges 2:17
    ref: Judges 2:17
    book: Judg
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 6557
    text: And yet they hearkened not unto their judges, for they went astray after other gods, and worshipped them; they turned aside quickly out of the way wherein their fathers walked, obeying the commandments of the LORD; they did not so.
    translation: JPS 1917
    original: וְגַם אֶל־שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ כִּי זָנוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים וַיִּשְׁתַּחֲווּ לָהֶם סָרוּ מַהֵר מִן־הַדֶּרֶךְ אֲשֶׁר הָלְכוּ אֲבוֹתָם לִשְׁמֹעַ מִצְוֺת־יְהוָה לֹא־עָשׂוּ כֵן׃
    hebrewPlain: וגם אל שפטיהם לא שמעו כי זנו אחרי אלהים אחרים וישתחוו להם סרו מהר מן הדרך אשר הלכו אבותם לשמע מצות יהוה לא עשו כן
    kjvRefs:
    - Judges 2:17
    kjvOsis:
    - Judg.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.18
    scripture: tanakh
    name: Tanakh Judges 2:18
    ref: Judges 2:18
    book: Judg
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 6558
    text: And when the LORD raised them up judges, then the LORD was with the judge, and saved them out of the hand of their enemies all the days of the judge; for it repented the LORD because of their groaning by reason of them that oppressed them and crushed them.
    translation: JPS 1917
    original: וְכִי־הֵקִים יְהוָה לָהֶם שֹׁפְטִים וְהָיָה יְהוָה עִם־הַשֹּׁפֵט וְהוֹשִׁיעָם מִיַּד אֹיְבֵיהֶם כֹּל יְמֵי הַשּׁוֹפֵט כִּי־יִנָּחֵם יְהוָה מִנַּאֲקָתָם מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם׃
    hebrewPlain: וכי הקים יהוה להם שפטים והיה יהוה עם השפט והושיעם מיד איביהם כל ימי השופט כי ינחם יהוה מנאקתם מפני לחציהם ודחקיהם
    kjvRefs:
    - Judges 2:18
    kjvOsis:
    - Judg.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.19
    scripture: tanakh
    name: Tanakh Judges 2:19
    ref: Judges 2:19
    book: Judg
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 6559
    text: But it came to pass, when the judge was dead, that they turned back, and dealt more corruptly than their fathers, in following other gods to serve them, and to worship them; they left nothing undone of their practices, nor of their stubborn way.
    translation: JPS 1917
    original: וְהָיָה בְּמוֹת הַשּׁוֹפֵט יָשֻׁבוּ וְהִשְׁחִיתוּ מֵאֲבוֹתָם לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם וּמִדַּרְכָּם הַקָּשָׁה׃
    hebrewPlain: והיה במות השופט ישבו והשחיתו מאבותם ללכת אחרי אלהים אחרים לעבדם ולהשתחות להם לא הפילו ממעלליהם ומדרכם הקשה
    kjvRefs:
    - Judges 2:19
    kjvOsis:
    - Judg.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.20
    scripture: tanakh
    name: Tanakh Judges 2:20
    ref: Judges 2:20
    book: Judg
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 6560
    text: 'And the anger of the LORD was kindled against Israel; and He said: ‘Because this nation have transgressed My covenant which I commanded their fathers, and have not hearkened unto My voice;'
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בְּיִשְׂרָאֵל וַיֹּאמֶר יַעַן אֲשֶׁר עָבְרוּ הַגּוֹי הַזֶּה אֶת־בְּרִיתִי אֲשֶׁר צִוִּיתִי אֶת־אֲבוֹתָם וְלֹא שָׁמְעוּ לְקוֹלִי׃
    hebrewPlain: ויחר אף יהוה בישראל ויאמר יען אשר עברו הגוי הזה את בריתי אשר צויתי את אבותם ולא שמעו לקולי
    kjvRefs:
    - Judges 2:20
    kjvOsis:
    - Judg.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.21
    scripture: tanakh
    name: Tanakh Judges 2:21
    ref: Judges 2:21
    book: Judg
    section: neviim
    chapter: 2
    verse: 21
    ordinal: 6561
    text: I also will not henceforth drive out any from before them of the nations that Joshua left when he died;
    translation: JPS 1917
    original: גַּם־אֲנִי לֹא אוֹסִיף לְהוֹרִישׁ אִישׁ מִפְּנֵיהֶם מִן־הַגּוֹיִם אֲשֶׁר־עָזַב יְהוֹשֻׁעַ וַיָּמֹת׃
    hebrewPlain: גם אני לא אוסיף להוריש איש מפניהם מן הגוים אשר עזב יהושע וימת
    kjvRefs:
    - Judges 2:21
    kjvOsis:
    - Judg.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.22
    scripture: tanakh
    name: Tanakh Judges 2:22
    ref: Judges 2:22
    book: Judg
    section: neviim
    chapter: 2
    verse: 22
    ordinal: 6562
    text: that by them I may prove Israel, whether they will keep the way of the LORD to walk therein, as their fathers did keep it, or not.’
    translation: JPS 1917
    original: לְמַעַן נַסּוֹת בָּם אֶת־יִשְׂרָאֵל הֲשֹׁמְרִים הֵם אֶת־דֶּרֶךְ יְהוָה לָלֶכֶת בָּם כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם אִם־לֹא׃
    hebrewPlain: למען נסות בם את ישראל השמרים הם את דרך יהוה ללכת בם כאשר שמרו אבותם אם לא
    kjvRefs:
    - Judges 2:22
    kjvOsis:
    - Judg.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.2.23
    scripture: tanakh
    name: Tanakh Judges 2:23
    ref: Judges 2:23
    book: Judg
    section: neviim
    chapter: 2
    verse: 23
    ordinal: 6563
    text: So the LORD left those nations, without driving them out hastily; neither delivered He them into the hand of Joshua.
    translation: JPS 1917
    original: וַיַּנַּח יְהוָה אֶת־הַגּוֹיִם הָאֵלֶּה לְבִלְתִּי הוֹרִישָׁם מַהֵר וְלֹא נְתָנָם בְּיַד־יְהוֹשֻׁעַ׃
    hebrewPlain: וינח יהוה את הגוים האלה לבלתי הורישם מהר ולא נתנם ביד יהושע
    kjvRefs:
    - Judges 2:23
    kjvOsis:
    - Judg.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.2
- type: TanakhVerse
  data:
    osis: Judg.3.1
    scripture: tanakh
    name: Tanakh Judges 3:1
    ref: Judges 3:1
    book: Judg
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 6564
    text: Now these are the nations which the LORD left, to prove Israel by them, even as many as had not known all the wars of Canaan;
    translation: JPS 1917
    original: וְאֵלֶּה הַגּוֹיִם אֲשֶׁר הִנִּיחַ יְהוָה לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל אֵת כָּל־אֲשֶׁר לֹא־יָדְעוּ אֵת כָּל־מִלְחֲמוֹת כְּנָעַן׃
    hebrewPlain: ואלה הגוים אשר הניח יהוה לנסות בם את ישראל את כל אשר לא ידעו את כל מלחמות כנען
    kjvRefs:
    - Judges 3:1
    kjvOsis:
    - Judg.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.2
    scripture: tanakh
    name: Tanakh Judges 3:2
    ref: Judges 3:2
    book: Judg
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 6565
    text: only that the generations of the children of Israel might know, to teach them war, at the least such as beforetime knew nothing thereof;
    translation: JPS 1917
    original: רַק לְמַעַן דַּעַת דֹּרוֹת בְּנֵי־יִשְׂרָאֵל לְלַמְּדָם מִלְחָמָה רַק אֲשֶׁר־לְפָנִים לֹא יְדָעוּם׃
    hebrewPlain: רק למען דעת דרות בני ישראל ללמדם מלחמה רק אשר לפנים לא ידעום
    kjvRefs:
    - Judges 3:2
    kjvOsis:
    - Judg.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.3
    scripture: tanakh
    name: Tanakh Judges 3:3
    ref: Judges 3:3
    book: Judg
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 6566
    text: namely, the five lords of the Philistines, and all the Canaanites, and the Zidonians, and the Hivites that dwelt in mount Lebanon, from mount Baal-hermon unto the entrance of Hamath.
    translation: JPS 1917
    original: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים וְכָל־הַכְּנַעֲנִי וְהַצִּידֹנִי וְהַחִוִּי יֹשֵׁב הַר הַלְּבָנוֹן מֵהַר בַּעַל חֶרְמוֹן עַד לְבוֹא חֲמָת׃
    hebrewPlain: חמשת סרני פלשתים וכל הכנעני והצידני והחוי ישב הר הלבנון מהר בעל חרמון עד לבוא חמת
    kjvRefs:
    - Judges 3:3
    kjvOsis:
    - Judg.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.4
    scripture: tanakh
    name: Tanakh Judges 3:4
    ref: Judges 3:4
    book: Judg
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 6567
    text: And they were there, to prove Israel by them, to know whether they would hearken unto the commandments of the LORD, which He commanded their fathers by the hand of Moses.
    translation: JPS 1917
    original: וַיִּהְיוּ לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל לָדַעַת הֲיִשְׁמְעוּ אֶת־מִצְוֺת יְהוָה אֲשֶׁר־צִוָּה אֶת־אֲבוֹתָם בְּיַד־מֹשֶׁה׃
    hebrewPlain: ויהיו לנסות בם את ישראל לדעת הישמעו את מצות יהוה אשר צוה את אבותם ביד משה
    kjvRefs:
    - Judges 3:4
    kjvOsis:
    - Judg.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.5
    scripture: tanakh
    name: Tanakh Judges 3:5
    ref: Judges 3:5
    book: Judg
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 6568
    text: And the children of Israel dwelt among the Canaanites, the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites;
    translation: JPS 1917
    original: וּבְנֵי יִשְׂרָאֵל יָשְׁבוּ בְּקֶרֶב הַכְּנַעֲנִי הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי׃
    hebrewPlain: ובני ישראל ישבו בקרב הכנעני החתי והאמרי והפרזי והחוי והיבוסי
    kjvRefs:
    - Judges 3:5
    kjvOsis:
    - Judg.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.6
    scripture: tanakh
    name: Tanakh Judges 3:6
    ref: Judges 3:6
    book: Judg
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 6569
    text: and they took their daughters to be their wives, and gave their own daughters to their sons, and served their gods.
    translation: JPS 1917
    original: וַיִּקְחוּ אֶת־בְּנוֹתֵיהֶם לָהֶם לְנָשִׁים וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם וַיַּעַבְדוּ אֶת־אֱלֹהֵיהֶם׃
    hebrewPlain: ויקחו את בנותיהם להם לנשים ואת בנותיהם נתנו לבניהם ויעבדו את אלהיהם
    kjvRefs:
    - Judges 3:6
    kjvOsis:
    - Judg.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.7
    scripture: tanakh
    name: Tanakh Judges 3:7
    ref: Judges 3:7
    book: Judg
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 6570
    text: And the children of Israel did that which was evil in the sight of the LORD, and forgot the LORD their God, and served the Baalim and the Asheroth.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־יִשְׂרָאֵל אֶת־הָרַע בְּעֵינֵי יְהוָה וַיִּשְׁכְּחוּ אֶת־יְהוָה אֱלֹהֵיהֶם וַיַּעַבְדוּ אֶת־הַבְּעָלִים וְאֶת־הָאֲשֵׁרוֹת׃
    hebrewPlain: ויעשו בני ישראל את הרע בעיני יהוה וישכחו את יהוה אלהיהם ויעבדו את הבעלים ואת האשרות
    kjvRefs:
    - Judges 3:7
    kjvOsis:
    - Judg.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.8
    scripture: tanakh
    name: Tanakh Judges 3:8
    ref: Judges 3:8
    book: Judg
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 6571
    text: Therefore the anger of the LORD was kindled against Israel, and He gave them over into the hand of Cushan-rishathaim king of Aram-naharaim; and the children of Israel served Cushan-rishathaim eight years.
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בְּיִשְׂרָאֵל וַיִּמְכְּרֵם בְּיַד כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ אֲרַם נַהֲרָיִם וַיַּעַבְדוּ בְנֵי־יִשְׂרָאֵל אֶת־כּוּשַׁן רִשְׁעָתַיִם שְׁמֹנֶה שָׁנִים׃
    hebrewPlain: ויחר אף יהוה בישראל וימכרם ביד כושן רשעתים מלך ארם נהרים ויעבדו בני ישראל את כושן רשעתים שמנה שנים
    kjvRefs:
    - Judges 3:8
    kjvOsis:
    - Judg.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.9
    scripture: tanakh
    name: Tanakh Judges 3:9
    ref: Judges 3:9
    book: Judg
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 6572
    text: And when the children of Israel cried unto the LORD, the LORD raised up a saviour to the children of Israel, who saved them, even Othniel the son of Kenaz, Caleb’s younger brother.
    translation: JPS 1917
    original: וַיִּזְעֲקוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה וַיָּקֶם יְהוָה מוֹשִׁיעַ לִבְנֵי יִשְׂרָאֵל וַיּוֹשִׁיעֵם אֵת עָתְנִיאֵל בֶּן־קְנַז אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ׃
    hebrewPlain: ויזעקו בני ישראל אל יהוה ויקם יהוה מושיע לבני ישראל ויושיעם את עתניאל בן קנז אחי כלב הקטן ממנו
    kjvRefs:
    - Judges 3:9
    kjvOsis:
    - Judg.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.10
    scripture: tanakh
    name: Tanakh Judges 3:10
    ref: Judges 3:10
    book: Judg
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 6573
    text: And the spirit of the LORD came upon him, and he judged Israel; and he went out to war, and the LORD delivered Cushan-rishathaim king of Aram into his hand; and his hand prevailed against Cushan-rishathaim.
    translation: JPS 1917
    original: וַתְּהִי עָלָיו רוּחַ־יְהוָה וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל וַיֵּצֵא לַמִּלְחָמָה וַיִּתֵּן יְהוָה בְּיָדוֹ אֶת־כּוּשַׁן רִשְׁעָתַיִם מֶלֶךְ אֲרָם וַתָּעָז יָדוֹ עַל כּוּשַׁן רִשְׁעָתָיִם׃
    hebrewPlain: ותהי עליו רוח יהוה וישפט את ישראל ויצא למלחמה ויתן יהוה בידו את כושן רשעתים מלך ארם ותעז ידו על כושן רשעתים
    kjvRefs:
    - Judges 3:10
    kjvOsis:
    - Judg.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.11
    scripture: tanakh
    name: Tanakh Judges 3:11
    ref: Judges 3:11
    book: Judg
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 6574
    text: And the land had rest forty years. And Othniel the son of Kenaz died.
    translation: JPS 1917
    original: וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה וַיָּמָת עָתְנִיאֵל בֶּן־קְנַז׃
    hebrewPlain: ותשקט הארץ ארבעים שנה וימת עתניאל בן קנז
    kjvRefs:
    - Judges 3:11
    kjvOsis:
    - Judg.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.12
    scripture: tanakh
    name: Tanakh Judges 3:12
    ref: Judges 3:12
    book: Judg
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 6575
    text: And the children of Israel again did that which was evil in the sight of the LORD; and the LORD strengthened Eglon the king of Moab against Israel, because they had done that which was evil in the sight of the LORD.
    translation: JPS 1917
    original: וַיֹּסִפוּ בְּנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה וַיְחַזֵּק יְהוָה אֶת־עֶגְלוֹן מֶלֶךְ־מוֹאָב עַל־יִשְׂרָאֵל עַל כִּי־עָשׂוּ אֶת־הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: ויספו בני ישראל לעשות הרע בעיני יהוה ויחזק יהוה את עגלון מלך מואב על ישראל על כי עשו את הרע בעיני יהוה
    kjvRefs:
    - Judges 3:12
    kjvOsis:
    - Judg.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.13
    scripture: tanakh
    name: Tanakh Judges 3:13
    ref: Judges 3:13
    book: Judg
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 6576
    text: And he gathered unto him the children of Ammon and Amalek; and he went and smote Israel, and they possessed the city of palm-trees.
    translation: JPS 1917
    original: וַיֶּאֱסֹף אֵלָיו אֶת־בְּנֵי עַמּוֹן וַעֲמָלֵק וַיֵּלֶךְ וַיַּךְ אֶת־יִשְׂרָאֵל וַיִּירְשׁוּ אֶת־עִיר הַתְּמָרִים׃
    hebrewPlain: ויאסף אליו את בני עמון ועמלק וילך ויך את ישראל ויירשו את עיר התמרים
    kjvRefs:
    - Judges 3:13
    kjvOsis:
    - Judg.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.14
    scripture: tanakh
    name: Tanakh Judges 3:14
    ref: Judges 3:14
    book: Judg
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 6577
    text: And the children of Israel served Eglon the king of Moab eighteen years.
    translation: JPS 1917
    original: וַיַּעַבְדוּ בְנֵי־יִשְׂרָאֵל אֶת־עֶגְלוֹן מֶלֶךְ־מוֹאָב שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: ויעבדו בני ישראל את עגלון מלך מואב שמונה עשרה שנה
    kjvRefs:
    - Judges 3:14
    kjvOsis:
    - Judg.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.15
    scripture: tanakh
    name: Tanakh Judges 3:15
    ref: Judges 3:15
    book: Judg
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 6578
    text: But when the children of Israel cried unto the LORD, the LORD raised them up a saviour, Ehud the son of Gera, the Benjamite, a man left-handed; and the children of Israel sent a present by him unto Eglon the king of Moab.
    translation: JPS 1917
    original: וַיִּזְעֲקוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה וַיָּקֶם יְהוָה לָהֶם מוֹשִׁיעַ אֶת־אֵהוּד בֶּן־גֵּרָא בֶּן־הַיְמִינִי אִישׁ אִטֵּר יַד־יְמִינוֹ וַיִּשְׁלְחוּ בְנֵי־יִשְׂרָאֵל בְּיָדוֹ מִנְחָה לְעֶגְלוֹן מֶלֶךְ מוֹאָב׃
    hebrewPlain: ויזעקו בני ישראל אל יהוה ויקם יהוה להם מושיע את אהוד בן גרא בן הימיני איש אטר יד ימינו וישלחו בני ישראל בידו מנחה לעגלון מלך מואב
    kjvRefs:
    - Judges 3:15
    kjvOsis:
    - Judg.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.16
    scripture: tanakh
    name: Tanakh Judges 3:16
    ref: Judges 3:16
    book: Judg
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 6579
    text: And Ehud made him a sword which had two edges, of a cubit length; and he girded it under his raiment upon his right thigh.
    translation: JPS 1917
    original: וַיַּעַשׂ לוֹ אֵהוּד חֶרֶב וְלָהּ שְׁנֵי פֵיוֹת גֹּמֶד אָרְכָּהּ וַיַּחְגֹּר אוֹתָהּ מִתַּחַת לְמַדָּיו עַל יֶרֶךְ יְמִינוֹ׃
    hebrewPlain: ויעש לו אהוד חרב ולה שני פיות גמד ארכה ויחגר אותה מתחת למדיו על ירך ימינו
    kjvRefs:
    - Judges 3:16
    kjvOsis:
    - Judg.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.17
    scripture: tanakh
    name: Tanakh Judges 3:17
    ref: Judges 3:17
    book: Judg
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 6580
    text: And he offered the present unto Eglon king of Moab—now Eglon was a very fat man.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־הַמִּנְחָה לְעֶגְלוֹן מֶלֶךְ מוֹאָב וְעֶגְלוֹן אִישׁ בָּרִיא מְאֹד׃
    hebrewPlain: ויקרב את המנחה לעגלון מלך מואב ועגלון איש בריא מאד
    kjvRefs:
    - Judges 3:17
    kjvOsis:
    - Judg.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.18
    scripture: tanakh
    name: Tanakh Judges 3:18
    ref: Judges 3:18
    book: Judg
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 6581
    text: And when he had made an end of offering the present, he sent away the people that bore the present.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר כִּלָּה לְהַקְרִיב אֶת־הַמִּנְחָה וַיְשַׁלַּח אֶת־הָעָם נֹשְׂאֵי הַמִּנְחָה׃
    hebrewPlain: ויהי כאשר כלה להקריב את המנחה וישלח את העם נשאי המנחה
    kjvRefs:
    - Judges 3:18
    kjvOsis:
    - Judg.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.19
    scripture: tanakh
    name: Tanakh Judges 3:19
    ref: Judges 3:19
    book: Judg
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 6582
    text: 'But he himself turned back from the quarries that were by Gilgal, and said: ‘I have a secret errand unto thee, O king.’ And he said: ‘Keep silence.’ And all that stood by him went out from him.'
    translation: JPS 1917
    original: וְהוּא שָׁב מִן־הַפְּסִילִים אֲשֶׁר אֶת־הַגִּלְגָּל וַיֹּאמֶר דְּבַר־סֵתֶר לִי אֵלֶיךָ הַמֶּלֶךְ וַיֹּאמֶר הָס וַיֵּצְאוּ מֵעָלָיו כָּל־הָעֹמְדִים עָלָיו׃
    hebrewPlain: והוא שב מן הפסילים אשר את הגלגל ויאמר דבר סתר לי אליך המלך ויאמר הס ויצאו מעליו כל העמדים עליו
    kjvRefs:
    - Judges 3:19
    kjvOsis:
    - Judg.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.20
    scripture: tanakh
    name: Tanakh Judges 3:20
    ref: Judges 3:20
    book: Judg
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 6583
    text: 'And Ehud came unto him; and he was sitting by himself alone in his cool upper chamber. And Ehud said: ‘I have a message from God unto thee.’ And he arose out of his seat.'
    translation: JPS 1917
    original: וְאֵהוּד בָּא אֵלָיו וְהוּא־יֹשֵׁב בַּעֲלִיַּת הַמְּקֵרָה אֲשֶׁר־לוֹ לְבַדּוֹ וַיֹּאמֶר אֵהוּד דְּבַר־אֱלֹהִים לִי אֵלֶיךָ וַיָּקָם מֵעַל הַכִּסֵּא׃
    hebrewPlain: ואהוד בא אליו והוא ישב בעלית המקרה אשר לו לבדו ויאמר אהוד דבר אלהים לי אליך ויקם מעל הכסא
    kjvRefs:
    - Judges 3:20
    kjvOsis:
    - Judg.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.21
    scripture: tanakh
    name: Tanakh Judges 3:21
    ref: Judges 3:21
    book: Judg
    section: neviim
    chapter: 3
    verse: 21
    ordinal: 6584
    text: And Ehud put forth his left hand, and took the sword from his right thigh, and thrust it into his belly.
    translation: JPS 1917
    original: וַיִּשְׁלַח אֵהוּד אֶת־יַד שְׂמֹאלוֹ וַיִּקַּח אֶת־הַחֶרֶב מֵעַל יֶרֶךְ יְמִינוֹ וַיִּתְקָעֶהָ בְּבִטְנוֹ׃
    hebrewPlain: וישלח אהוד את יד שמאלו ויקח את החרב מעל ירך ימינו ויתקעה בבטנו
    kjvRefs:
    - Judges 3:21
    kjvOsis:
    - Judg.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.22
    scripture: tanakh
    name: Tanakh Judges 3:22
    ref: Judges 3:22
    book: Judg
    section: neviim
    chapter: 3
    verse: 22
    ordinal: 6585
    text: And the haft also went in after the blade; and the fat closed upon the blade, for he drew not the sword out of his belly; and it came out behind.
    translation: JPS 1917
    original: וַיָּבֹא גַם־הַנִּצָּב אַחַר הַלַּהַב וַיִּסְגֹּר הַחֵלֶב בְּעַד הַלַּהַב כִּי לֹא שָׁלַף הַחֶרֶב מִבִּטְנוֹ וַיֵּצֵא הַפַּרְשְׁדֹנָה׃
    hebrewPlain: ויבא גם הנצב אחר הלהב ויסגר החלב בעד הלהב כי לא שלף החרב מבטנו ויצא הפרשדנה
    kjvRefs:
    - Judges 3:22
    kjvOsis:
    - Judg.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.23
    scripture: tanakh
    name: Tanakh Judges 3:23
    ref: Judges 3:23
    book: Judg
    section: neviim
    chapter: 3
    verse: 23
    ordinal: 6586
    text: Then Ehud went forth into the porch, and shut the doors of the upper chamber upon him, and locked them.
    translation: JPS 1917
    original: וַיֵּצֵא אֵהוּד הַמִּסְדְּרוֹנָה וַיִּסְגֹּר דַּלְתוֹת הָעַלִיָּה בַּעֲדוֹ וְנָעָל׃
    hebrewPlain: ויצא אהוד המסדרונה ויסגר דלתות העליה בעדו ונעל
    kjvRefs:
    - Judges 3:23
    kjvOsis:
    - Judg.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.24
    scripture: tanakh
    name: Tanakh Judges 3:24
    ref: Judges 3:24
    book: Judg
    section: neviim
    chapter: 3
    verse: 24
    ordinal: 6587
    text: 'Now when he was gone out, his servants came; and they saw, and, behold, the doors of the upper chamber were locked; and they, said: ‘Surely he is covering his feet in the cabinet of the cool chamber.’'
    translation: JPS 1917
    original: וְהוּא יָצָא וַעֲבָדָיו בָּאוּ וַיִּרְאוּ וְהִנֵּה דַּלְתוֹת הָעֲלִיָּה נְעֻלוֹת וַיֹּאמְרוּ אַךְ מֵסִיךְ הוּא אֶת־רַגְלָיו בַּחֲדַר הַמְּקֵרָה׃
    hebrewPlain: והוא יצא ועבדיו באו ויראו והנה דלתות העליה נעלות ויאמרו אך מסיך הוא את רגליו בחדר המקרה
    kjvRefs:
    - Judges 3:24
    kjvOsis:
    - Judg.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.25
    scripture: tanakh
    name: Tanakh Judges 3:25
    ref: Judges 3:25
    book: Judg
    section: neviim
    chapter: 3
    verse: 25
    ordinal: 6588
    text: And they tarried till they were ashamed; and, behold, he opened not the doors of the upper chamber; therefore they took the key, and opened them; and, behold, their lord was fallen down dead on the earth.
    translation: JPS 1917
    original: וַיָּחִילוּ עַד־בּוֹשׁ וְהְנֵּה אֵינֶנּוּ פֹתֵחַ דַּלְתוֹת הָעֲלִיָּה וַיִּקְחוּ אֶת־הַמַּפְתֵּחַ וַיִּפְתָּחוּ וְהִנֵּה אֲדֹנֵיהֶם נֹפֵל אַרְצָה מֵת׃
    hebrewPlain: ויחילו עד בוש והנה איננו פתח דלתות העליה ויקחו את המפתח ויפתחו והנה אדניהם נפל ארצה מת
    kjvRefs:
    - Judges 3:25
    kjvOsis:
    - Judg.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.26
    scripture: tanakh
    name: Tanakh Judges 3:26
    ref: Judges 3:26
    book: Judg
    section: neviim
    chapter: 3
    verse: 26
    ordinal: 6589
    text: And Ehud escaped while they lingered, having passed beyond the quarries, and escaped unto Seirah.
    translation: JPS 1917
    original: וְאֵהוּד נִמְלַט עַד הִתְמַהְמְהָם וְהוּא עָבַר אֶת־הַפְּסִילִים וַיִּמָּלֵט הַשְּׂעִירָתָה׃
    hebrewPlain: ואהוד נמלט עד התמהמהם והוא עבר את הפסילים וימלט השעירתה
    kjvRefs:
    - Judges 3:26
    kjvOsis:
    - Judg.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.27
    scripture: tanakh
    name: Tanakh Judges 3:27
    ref: Judges 3:27
    book: Judg
    section: neviim
    chapter: 3
    verse: 27
    ordinal: 6590
    text: And it came to pass, when he was come, that he blew a horn in the hill-country of Ephraim, and the children of Israel went down with him from the hill-country, and he before them.
    translation: JPS 1917
    original: וַיְהִי בְּבוֹאוֹ וַיִּתְקַע בַּשּׁוֹפָר בְּהַר אֶפְרָיִם וַיֵּרְדוּ עִמּוֹ בְנֵי־יִשְׂרָאֵל מִן־הָהָר וְהוּא לִפְנֵיהֶם׃
    hebrewPlain: ויהי בבואו ויתקע בשופר בהר אפרים וירדו עמו בני ישראל מן ההר והוא לפניהם
    kjvRefs:
    - Judges 3:27
    kjvOsis:
    - Judg.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.28
    scripture: tanakh
    name: Tanakh Judges 3:28
    ref: Judges 3:28
    book: Judg
    section: neviim
    chapter: 3
    verse: 28
    ordinal: 6591
    text: 'And he said unto them: ‘Follow after me; for the LORD hath delivered your enemies the Moabites into your hand.’ And they went down after him, and took the fords of the Jordan against the Moabites, and suffered not a man to pass over.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם רִדְפוּ אַחֲרַי כִּי־נָתַן יְהוָה אֶת־אֹיְבֵיכֶם אֶת־מוֹאָב בְּיֶדְכֶם וַיֵּרְדוּ אַחֲרָיו וַיִּלְכְּדוּ אֶת־מַעְבְּרוֹת הַיַּרְדֵּן לְמוֹאָב וְלֹא־נָתְנוּ אִישׁ לַעֲבֹר׃
    hebrewPlain: ויאמר אלהם רדפו אחרי כי נתן יהוה את איביכם את מואב בידכם וירדו אחריו וילכדו את מעברות הירדן למואב ולא נתנו איש לעבר
    kjvRefs:
    - Judges 3:28
    kjvOsis:
    - Judg.3.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.29
    scripture: tanakh
    name: Tanakh Judges 3:29
    ref: Judges 3:29
    book: Judg
    section: neviim
    chapter: 3
    verse: 29
    ordinal: 6592
    text: And they smote of Moab at that time about ten thousand men, every lusty man, and every man of valour; and there escaped not a man. .
    translation: JPS 1917
    original: וַיַּכּוּ אֶת־מוֹאָב בָּעֵת הַהִיא כַּעֲשֶׂרֶת אֲלָפִים אִישׁ כָּל־שָׁמֵן וְכָל־אִישׁ חָיִל וְלֹא נִמְלַט אִישׁ׃
    hebrewPlain: ויכו את מואב בעת ההיא כעשרת אלפים איש כל שמן וכל איש חיל ולא נמלט איש
    kjvRefs:
    - Judges 3:29
    kjvOsis:
    - Judg.3.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.30
    scripture: tanakh
    name: Tanakh Judges 3:30
    ref: Judges 3:30
    book: Judg
    section: neviim
    chapter: 3
    verse: 30
    ordinal: 6593
    text: So Moab was subdued that day under the hand of Israel. And the land had rest fourscore years.
    translation: JPS 1917
    original: וַתִּכָּנַע מוֹאָב בַּיּוֹם הַהוּא תַּחַת יַד יִשְׂרָאֵל וַתִּשְׁקֹט הָאָרֶץ שְׁמוֹנִים שָׁנָה׃
    hebrewPlain: ותכנע מואב ביום ההוא תחת יד ישראל ותשקט הארץ שמונים שנה
    kjvRefs:
    - Judges 3:30
    kjvOsis:
    - Judg.3.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.3.31
    scripture: tanakh
    name: Tanakh Judges 3:31
    ref: Judges 3:31
    book: Judg
    section: neviim
    chapter: 3
    verse: 31
    ordinal: 6594
    text: And after him was Shamgar the son of Anath, who smote of the Philistines six hundred men with an ox-goad; and he also saved Israel.
    translation: JPS 1917
    original: וְאַחֲרָיו הָיָה שַׁמְגַּר בֶּן־עֲנָת וַיַּךְ אֶת־פְּלִשְׁתִּים שֵׁשׁ־מֵאוֹת אִישׁ בְּמַלְמַד הַבָּקָר וַיֹּשַׁע גַּם־הוּא אֶת־יִשְׂרָאֵל׃
    hebrewPlain: ואחריו היה שמגר בן ענת ויך את פלשתים שש מאות איש במלמד הבקר וישע גם הוא את ישראל
    kjvRefs:
    - Judges 3:31
    kjvOsis:
    - Judg.3.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.3
- type: TanakhVerse
  data:
    osis: Judg.4.1
    scripture: tanakh
    name: Tanakh Judges 4:1
    ref: Judges 4:1
    book: Judg
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 6595
    text: And the children of Israel again did that which was evil in the sight of the LORD, when Ehud was dead.
    translation: JPS 1917
    original: וַיֹּסִפוּ בְּנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה וְאֵהוּד מֵת׃
    hebrewPlain: ויספו בני ישראל לעשות הרע בעיני יהוה ואהוד מת
    kjvRefs:
    - Judges 4:1
    kjvOsis:
    - Judg.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.2
    scripture: tanakh
    name: Tanakh Judges 4:2
    ref: Judges 4:2
    book: Judg
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 6596
    text: And the LORD gave them over into the hand of Jabin king of Canaan, that reigned in Hazor; the captain of whose host was Sisera, who dwelt in Harosheth-goiim.
    translation: JPS 1917
    original: וַיִּמְכְּרֵם יְהוָה בְּיַד יָבִין מֶלֶךְ־כְּנַעַן אֲשֶׁר מָלַךְ בְּחָצוֹר וְשַׂר־צְבָאוֹ סִיסְרָא וְהוּא יוֹשֵׁב בַּחֲרֹשֶׁת הַגּוֹיִם׃
    hebrewPlain: וימכרם יהוה ביד יבין מלך כנען אשר מלך בחצור ושר צבאו סיסרא והוא יושב בחרשת הגוים
    kjvRefs:
    - Judges 4:2
    kjvOsis:
    - Judg.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.3
    scripture: tanakh
    name: Tanakh Judges 4:3
    ref: Judges 4:3
    book: Judg
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 6597
    text: And the children of Israel cried unto the LORD; for he had nine hundred chariots of iron; and twenty years he mightily oppressed the children of Israel.
    translation: JPS 1917
    original: וַיִּצְעֲקוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה כִּי תְּשַׁע מֵאוֹת רֶכֶב־בַּרְזֶל לוֹ וְהוּא לָחַץ אֶת־בְּנֵי יִשְׂרָאֵל בְּחָזְקָה עֶשְׂרִים שָׁנָה׃
    hebrewPlain: ויצעקו בני ישראל אל יהוה כי תשע מאות רכב ברזל לו והוא לחץ את בני ישראל בחזקה עשרים שנה
    kjvRefs:
    - Judges 4:3
    kjvOsis:
    - Judg.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.4
    scripture: tanakh
    name: Tanakh Judges 4:4
    ref: Judges 4:4
    book: Judg
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 6598
    text: Now Deborah, a prophetess, the wife of Lappidoth, she judged Israel at that time.
    translation: JPS 1917
    original: וּדְבוֹרָה אִשָּׁה נְבִיאָה אֵשֶׁת לַפִּידוֹת הִיא שֹׁפְטָה אֶת־יִשְׂרָאֵל בָּעֵת הַהִיא׃
    hebrewPlain: ודבורה אשה נביאה אשת לפידות היא שפטה את ישראל בעת ההיא
    kjvRefs:
    - Judges 4:4
    kjvOsis:
    - Judg.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.5
    scripture: tanakh
    name: Tanakh Judges 4:5
    ref: Judges 4:5
    book: Judg
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 6599
    text: And she sat under the palm-tree of Deborah between Ramah and Beth-el in the hill-country of Ephraim; and the children of Israel came up to her for judgment.
    translation: JPS 1917
    original: וְהִיא יוֹשֶׁבֶת תַּחַת־תֹּמֶר דְּבוֹרָה בֵּין הָרָמָה וּבֵין בֵּית־אֵל בְּהַר אֶפְרָיִם וַיַּעֲלוּ אֵלֶיהָ בְּנֵי יִשְׂרָאֵל לַמִּשְׁפָּט׃
    hebrewPlain: והיא יושבת תחת תמר דבורה בין הרמה ובין בית אל בהר אפרים ויעלו אליה בני ישראל למשפט
    kjvRefs:
    - Judges 4:5
    kjvOsis:
    - Judg.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.6
    scripture: tanakh
    name: Tanakh Judges 4:6
    ref: Judges 4:6
    book: Judg
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 6600
    text: 'And she sent and called Barak the son of Abinoam out of Kedesh-naphtali, and said unto him: ‘Hath not the LORD, the God of Israel, commanded, saying: Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?'
    translation: JPS 1917
    original: וַתִּשְׁלַח וַתִּקְרָא לְבָרָק בֶּן־אֲבִינֹעַם מִקֶּדֶשׁ נַפְתָּלִי וַתֹּאמֶר אֵלָיו הֲלֹא צִוָּה יְהוָה אֱלֹהֵי־יִשְׂרָאֵל לֵךְ וּמָשַׁכְתָּ בְּהַר תָּבוֹר וְלָקַחְתָּ עִמְּךָ עֲשֶׂרֶת אֲלָפִים אִישׁ מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן׃
    hebrewPlain: ותשלח ותקרא לברק בן אבינעם מקדש נפתלי ותאמר אליו הלא צוה יהוה אלהי ישראל לך ומשכת בהר תבור ולקחת עמך עשרת אלפים איש מבני נפתלי ומבני זבלון
    kjvRefs:
    - Judges 4:6
    kjvOsis:
    - Judg.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.7
    scripture: tanakh
    name: Tanakh Judges 4:7
    ref: Judges 4:7
    book: Judg
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 6601
    text: And I will draw unto thee to the brook Kishon Sisera, the captain of Jabin’s army, with his chariots and his multitude; and I will deliver him into thy hand.
    translation: JPS 1917
    original: וּמָשַׁכְתִּי אֵלֶיךָ אֶל־נַחַל קִישׁוֹן אֶת־סִיסְרָא שַׂר־צְבָא יָבִין וְאֶת־רִכְבּוֹ וְאֶת־הֲמוֹנוֹ וּנְתַתִּיהוּ בְּיָדֶךָ׃
    hebrewPlain: ומשכתי אליך אל נחל קישון את סיסרא שר צבא יבין ואת רכבו ואת המונו ונתתיהו בידך
    kjvRefs:
    - Judges 4:7
    kjvOsis:
    - Judg.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.8
    scripture: tanakh
    name: Tanakh Judges 4:8
    ref: Judges 4:8
    book: Judg
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 6602
    text: 'And Barak said unto her: ‘If thou wilt go with me, then I will go; but if thou wilt not go with me, I will not go.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ בָּרָק אִם־תֵּלְכִי עִמִּי וְהָלָכְתִּי וְאִם־לֹא תֵלְכִי עִמִּי לֹא אֵלֵךְ׃
    hebrewPlain: ויאמר אליה ברק אם תלכי עמי והלכתי ואם לא תלכי עמי לא אלך
    kjvRefs:
    - Judges 4:8
    kjvOsis:
    - Judg.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.9
    scripture: tanakh
    name: Tanakh Judges 4:9
    ref: Judges 4:9
    book: Judg
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 6603
    text: 'And she said: ‘I will surely go with thee; notwithstanding the journey that thou takest shall not be for thy honour; for the LORD will give Sisera over into the hand of a woman.’ And Deborah arose, and went with Barak to Kedesh.'
    translation: JPS 1917
    original: וַתֹּאמֶר הָלֹךְ אֵלֵךְ עִמָּךְ אֶפֶס כִּי לֹא תִהְיֶה תִּפְאַרְתְּךָ עַל־הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ כִּי בְיַד־אִשָּׁה יִמְכֹּר יְהוָה אֶת־סִיסְרָא וַתָּקָם דְּבוֹרָה וַתֵּלֶך עִם־בָּרָק קֶדְשָׁה׃
    hebrewPlain: ותאמר הלך אלך עמך אפס כי לא תהיה תפארתך על הדרך אשר אתה הולך כי ביד אשה ימכר יהוה את סיסרא ותקם דבורה ותלך עם ברק קדשה
    kjvRefs:
    - Judges 4:9
    kjvOsis:
    - Judg.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.10
    scripture: tanakh
    name: Tanakh Judges 4:10
    ref: Judges 4:10
    book: Judg
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 6604
    text: And Barak called Zebulun and Naphtali together to Kedesh; and there went up ten thousand men at his feet; and Deborah went up with him.
    translation: JPS 1917
    original: וַיַּזְעֵק בָּרָק אֶת־זְבוּלֻן וְאֶת־נַפְתָּלִי קֶדְשָׁה וַיַּעַל בְּרַגְלָיו עֲשֶׂרֶת אַלְפֵי אִישׁ וַתַּעַל עִמּוֹ דְּבוֹרָה׃
    hebrewPlain: ויזעק ברק את זבולן ואת נפתלי קדשה ויעל ברגליו עשרת אלפי איש ותעל עמו דבורה
    kjvRefs:
    - Judges 4:10
    kjvOsis:
    - Judg.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.11
    scripture: tanakh
    name: Tanakh Judges 4:11
    ref: Judges 4:11
    book: Judg
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 6605
    text: Now Heber the Kenite had severed himself from the Kenites, even from the children of Hobab the father-in-law of Moses, and had pitched his tent as far as Elon-bezaanannim, which is by Kedesh.
    translation: JPS 1917
    original: וְחֶבֶר הַקֵּינִי נִפְרָד מִקַּיִן מִבְּנֵי חֹבָב חֹתֵן מֹשֶׁה וַיֵּט אָהֳלוֹ עַד־אֵלוֹן בצענים [בְּצַעֲנַנִּים] אֲשֶׁר אֶת־קֶדֶשׁ׃
    hebrewPlain: וחבר הקיני נפרד מקין מבני חבב חתן משה ויט אהלו עד אלון בצענים [בצעננים] אשר את קדש
    kjvRefs:
    - Judges 4:11
    kjvOsis:
    - Judg.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.12
    scripture: tanakh
    name: Tanakh Judges 4:12
    ref: Judges 4:12
    book: Judg
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 6606
    text: And they told Sisera that Barak the son of Abinoam was gone up to mount Tabor.
    translation: JPS 1917
    original: וַיַּגִּדוּ לְסִיסְרָא כִּי עָלָה בָּרָק בֶּן־אֲבִינֹעַם הַר־תָּבוֹר׃
    hebrewPlain: ויגדו לסיסרא כי עלה ברק בן אבינעם הר תבור
    kjvRefs:
    - Judges 4:12
    kjvOsis:
    - Judg.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.13
    scripture: tanakh
    name: Tanakh Judges 4:13
    ref: Judges 4:13
    book: Judg
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 6607
    text: And Sisera gathered together all his chariots, even nine hundred chariots of iron, and all the people that were with him, from Harosheth-goiim, unto the brook Kishon.
    translation: JPS 1917
    original: וַיַּזְעֵק סִיסְרָא אֶת־כָּל־רִכְבּוֹ תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל וְאֶת־כָּל־הָעָם אֲשֶׁר אִתּוֹ מֵחֲרֹשֶׁת הַגּוֹיִם אֶל־נַחַל קִישׁוֹן׃
    hebrewPlain: ויזעק סיסרא את כל רכבו תשע מאות רכב ברזל ואת כל העם אשר אתו מחרשת הגוים אל נחל קישון
    kjvRefs:
    - Judges 4:13
    kjvOsis:
    - Judg.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.14
    scripture: tanakh
    name: Tanakh Judges 4:14
    ref: Judges 4:14
    book: Judg
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 6608
    text: 'And Deborah said unto Barak: ‘Up; for this is the day in which the LORD hath delivered Sisera into thy hand; is not the LORD gone out before thee?’ So Barak went down from mount Tabor, and ten thousand men after him.'
    translation: JPS 1917
    original: וַתֹּאמֶר דְּבֹרָה אֶל־בָּרָק קוּם כִּי זֶה הַיּוֹם אֲשֶׁר נָתַן יְהוָה אֶת־סִיסְרָא בְּיָדֶךָ הֲלֹא יְהוָה יָצָא לְפָנֶיךָ וַיֵּרֶד בָּרָק מֵהַר תָּבוֹר וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו׃
    hebrewPlain: ותאמר דברה אל ברק קום כי זה היום אשר נתן יהוה את סיסרא בידך הלא יהוה יצא לפניך וירד ברק מהר תבור ועשרת אלפים איש אחריו
    kjvRefs:
    - Judges 4:14
    kjvOsis:
    - Judg.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.4
- type: TanakhVerse
  data:
    osis: Judg.4.15
    scripture: tanakh
    name: Tanakh Judges 4:15
    ref: Judges 4:15
    book: Judg
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 6609
    text: And the LORD discomfited Sisera, and all his chariots, and all his host, with the edge of the sword before Barak; and Sisera alighted from his chariot, and fled away on his feet.
    translation: JPS 1917
    original: וַיָּהָם יְהוָה אֶת־סִיסְרָא וְאֶת־כָּל־הָרֶכֶב וְאֶת־כָּל־הַמַּחֲנֶה לְפִי־חֶרֶב לִפְנֵי בָרָק וַיֵּרֶד סִיסְרָא מֵעַל הַמֶּרְכָּבָה וַיָּנָס בְּרַגְלָיו׃
    hebrewPlain: ויהם יהוה את סיסרא ואת כל הרכב ואת כל המחנה לפי חרב לפני ברק וירד סיסרא מעל המרכבה וינס ברגליו
    kjvRefs:
    - Judges 4:15
    kjvOsis:
    - Judg.4.15
  relations:
  - predicate: IN
    to:
