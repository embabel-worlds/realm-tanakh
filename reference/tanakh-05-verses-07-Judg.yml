  data:
    osis: Judg.12.13
    scripture: tanakh
    name: Tanakh Judges 12:13
    ref: Judges 12:13
    book: Judg
    section: neviim
    chapter: 12
    verse: 13
    ordinal: 6877
    text: And after him Abdon the son of Hillel the Pirathonite judged Israel.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט אַחֲרָיו אֶת־יִשְׂרָאֵל עַבְדּוֹן בֶּן־הִלֵּל הַפִּרְעָתוֹנִי׃
    hebrewPlain: וישפט אחריו את ישראל עבדון בן הלל הפרעתוני
    kjvRefs:
    - Judges 12:13
    kjvOsis:
    - Judg.12.13
  relations:
  - predicate: IN
