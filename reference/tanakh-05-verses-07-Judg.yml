    chapter: 13
    verse: 6
    ordinal: 6885
    text: 'Then the woman came and told her husband, saying: ‘A man of God came unto me, and his countenance was like the countenance of the angel of God, very terrible; and I asked him not whence he was, neither told he me his name;'
    translation: JPS 1917
    original: וַתָּבֹא הָאִשָּׁה וַתֹּאמֶר לְאִישָׁהּ לֵאמֹר אִישׁ הָאֱלֹהִים בָּא אֵלַי וּמַרְאֵהוּ כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים נוֹרָא מְאֹד וְלֹא שְׁאִלְתִּיהוּ אֵי־מִזֶּה הוּא וְאֶת־שְׁמוֹ לֹא־הִגִּיד לִי׃
    hebrewPlain: ותבא האשה ותאמר לאישה לאמר איש האלהים בא אלי ומראהו כמראה מלאך האלהים נורא מאד ולא שאלתיהו אי מזה הוא ואת שמו לא הגיד לי
    kjvRefs:
    - Judges 13:6
    kjvOsis:
    - Judg.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.7
    scripture: tanakh
    name: Tanakh Judges 13:7
    ref: Judges 13:7
    book: Judg
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 6886
    text: 'but he said unto me: Behold, thou shalt conceive, and bear a son; and now drink no wine nor strong drink, and eat not any unclean thing; for the child shall be a Nazirite unto God from the womb to the day of his death.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לִי הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן וְעַתָּה אַל־תִּשְׁתִּי יַיִן וְשֵׁכָר וְאַל־תֹּאכְלִי כָּל־טֻמְאָה כִּי־נְזִיר אֱלֹהִים יִהְיֶה הַנַּעַר מִן־הַבֶּטֶן עַד־יוֹם מוֹתוֹ׃
    hebrewPlain: ויאמר לי הנך הרה וילדת בן ועתה אל תשתי יין ושכר ואל תאכלי כל טמאה כי נזיר אלהים יהיה הנער מן הבטן עד יום מותו
    kjvRefs:
    - Judges 13:7
    kjvOsis:
    - Judg.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.8
    scripture: tanakh
    name: Tanakh Judges 13:8
    ref: Judges 13:8
    book: Judg
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 6887
    text: 'Then Manoah entreated the LORD, and said: ‘Oh, LORD, I pray Thee, let the man of God whom Thou didst send come again unto us, and teach us what we shall do unto the child that shall be born.’'
    translation: JPS 1917
    original: וַיֶּעְתַּר מָנוֹחַ אֶל־יְהוָה וַיֹּאמַר בִּי אֲדוֹנָי אִישׁ הָאֱלֹהִים אֲשֶׁר שָׁלַחְתָּ יָבוֹא־נָא עוֹד אֵלֵינוּ וְיוֹרֵנוּ מַה־נַּעֲשֶׂה לַנַּעַר הַיּוּלָּד׃
    hebrewPlain: ויעתר מנוח אל יהוה ויאמר בי אדוני איש האלהים אשר שלחת יבוא נא עוד אלינו ויורנו מה נעשה לנער היולד
    kjvRefs:
    - Judges 13:8
    kjvOsis:
    - Judg.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.9
    scripture: tanakh
    name: Tanakh Judges 13:9
    ref: Judges 13:9
    book: Judg
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 6888
    text: And God hearkened to the voice of Manoah; and the angel of God came again unto the woman as she sat in the field; but Manoah her husband was not with her.
    translation: JPS 1917
    original: וַיִּשְׁמַע הָאֱלֹהִים בְּקוֹל מָנוֹחַ וַיָּבֹא מַלְאַךְ הָאֱלֹהִים עוֹד אֶל־הָאִשָּׁה וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה וּמָנוֹחַ אִישָׁהּ אֵין עִמָּהּ׃
    hebrewPlain: וישמע האלהים בקול מנוח ויבא מלאך האלהים עוד אל האשה והיא יושבת בשדה ומנוח אישה אין עמה
    kjvRefs:
    - Judges 13:9
    kjvOsis:
    - Judg.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.10
    scripture: tanakh
    name: Tanakh Judges 13:10
    ref: Judges 13:10
    book: Judg
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 6889
    text: 'And the woman made haste, and ran, and told her husband, and said unto him: ‘Behold, the man hath appeared unto me, that came unto me that day.’'
    translation: JPS 1917
    original: וַתְּמַהֵר הָאִשָּׁה וַתָּרָץ וַתַּגֵּד לְאִישָׁהּ וַתֹּאמֶר אֵלָיו הִנֵּה נִרְאָה אֵלַי הָאִישׁ אֲשֶׁר־בָּא בַיּוֹם אֵלָי׃
    hebrewPlain: ותמהר האשה ותרץ ותגד לאישה ותאמר אליו הנה נראה אלי האיש אשר בא ביום אלי
    kjvRefs:
    - Judges 13:10
    kjvOsis:
    - Judg.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.11
    scripture: tanakh
    name: Tanakh Judges 13:11
    ref: Judges 13:11
    book: Judg
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 6890
    text: 'And Manoah arose, and went after his wife, and came to the man, and said unto him: ‘Art thou the man that spokest unto the woman?’ And he said: ‘I am.’'
    translation: JPS 1917
    original: וַיָּקָם וַיֵּלֶךְ מָנוֹחַ אַחֲרֵי אִשְׁתּוֹ וַיָּבֹא אֶל־הָאִישׁ וַיֹּאמֶר לוֹ הַאַתָּה הָאִישׁ אֲשֶׁר־דִּבַּרְתָּ אֶל־הָאִשָּׁה וַיֹּאמֶר אָנִי׃
    hebrewPlain: ויקם וילך מנוח אחרי אשתו ויבא אל האיש ויאמר לו האתה האיש אשר דברת אל האשה ויאמר אני
    kjvRefs:
    - Judges 13:11
    kjvOsis:
    - Judg.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.12
    scripture: tanakh
    name: Tanakh Judges 13:12
    ref: Judges 13:12
    book: Judg
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 6891
    text: 'And Manoah said: ‘Now when thy word cometh to pass, what shall be the rule for the child, and what shall be done with him?’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָנוֹחַ עַתָּה יָבֹא דְבָרֶיךָ מַה־יִּהְיֶה מִשְׁפַּט־הַנַּעַר וּמַעֲשֵׂהוּ׃
    hebrewPlain: ויאמר מנוח עתה יבא דבריך מה יהיה משפט הנער ומעשהו
    kjvRefs:
    - Judges 13:12
    kjvOsis:
    - Judg.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.13
    scripture: tanakh
    name: Tanakh Judges 13:13
    ref: Judges 13:13
    book: Judg
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 6892
    text: 'And the angel of the LORD said unto Manoah: ‘Of all that I said unto the woman let her beware.'
    translation: JPS 1917
    original: וַיֹּאמֶר מַלְאַךְ יְהוָה אֶל־מָנוֹחַ מִכֹּל אֲשֶׁר־אָמַרְתִּי אֶל־הָאִשָּׁה תִּשָּׁמֵר׃
    hebrewPlain: ויאמר מלאך יהוה אל מנוח מכל אשר אמרתי אל האשה תשמר
    kjvRefs:
    - Judges 13:13
    kjvOsis:
    - Judg.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.14
    scripture: tanakh
    name: Tanakh Judges 13:14
    ref: Judges 13:14
    book: Judg
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 6893
    text: She may not eat of any thing that cometh of the grapevine, neither let her drink wine or strong drink, nor eat any unclean thing; all that I commanded her let her observe.’
    translation: JPS 1917
    original: מִכֹּל אֲשֶׁר־יֵצֵא מִגֶּפֶן הַיַּיִן לֹא תֹאכַל וְיַיִן וְשֵׁכָר אַל־תֵּשְׁתְּ וְכָל־טֻמְאָה אַל־תֹּאכַל כֹּל אֲשֶׁר־צִוִּיתִיהָ תִּשְׁמֹר׃
    hebrewPlain: מכל אשר יצא מגפן היין לא תאכל ויין ושכר אל תשת וכל טמאה אל תאכל כל אשר צויתיה תשמר
    kjvRefs:
    - Judges 13:14
    kjvOsis:
    - Judg.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.15
    scripture: tanakh
    name: Tanakh Judges 13:15
    ref: Judges 13:15
    book: Judg
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 6894
    text: 'And Manoah said unto the angel of the LORD: ‘I pray thee, let us detain thee, that we may make ready a kid for thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָנוֹחַ אֶל־מַלְאַךְ יְהוָה נַעְצְרָה־נָּא אוֹתָךְ וְנַעֲשֶׂה לְפָנֶיךָ גְּדִי עִזִּים׃
    hebrewPlain: ויאמר מנוח אל מלאך יהוה נעצרה נא אותך ונעשה לפניך גדי עזים
    kjvRefs:
    - Judges 13:15
    kjvOsis:
    - Judg.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.16
    scripture: tanakh
    name: Tanakh Judges 13:16
    ref: Judges 13:16
    book: Judg
    section: neviim
    chapter: 13
    verse: 16
    ordinal: 6895
    text: 'And the angel of the LORD said unto Manoah: ‘Though thou detain me, I will not eat of thy bread; and if thou wilt make ready a burnt-offering, thou must offer it unto the LORD.’ For Manoah knew not that he was the angel of the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר מַלְאַךְ יְהוָה אֶל־מָנוֹחַ אִם־תַּעְצְרֵנִי לֹא־אֹכַל בְּלַחְמֶךָ וְאִם־תַּעֲשֶׂה עֹלָה לַיהוָה תַּעֲלֶנָּה כִּי לֹא־יָדַע מָנוֹחַ כִּי־מַלְאַךְ יְהוָה הוּא׃
    hebrewPlain: ויאמר מלאך יהוה אל מנוח אם תעצרני לא אכל בלחמך ואם תעשה עלה ליהוה תעלנה כי לא ידע מנוח כי מלאך יהוה הוא
    kjvRefs:
    - Judges 13:16
    kjvOsis:
    - Judg.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.17
    scripture: tanakh
    name: Tanakh Judges 13:17
    ref: Judges 13:17
    book: Judg
    section: neviim
    chapter: 13
    verse: 17
    ordinal: 6896
    text: 'And Manoah said unto the angel of the LORD: ‘What is thy name, that when thy words come to pass we may do thee honour?’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָנוֹחַ אֶל־מַלְאַךְ יְהוָה מִי שְׁמֶךָ כִּי־יָבֹא דבריך [דְבָרְךָ] וְכִבַּדְנוּךָ׃
    hebrewPlain: ויאמר מנוח אל מלאך יהוה מי שמך כי יבא דבריך [דברך] וכבדנוך
    kjvRefs:
    - Judges 13:17
    kjvOsis:
    - Judg.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.18
    scripture: tanakh
    name: Tanakh Judges 13:18
    ref: Judges 13:18
    book: Judg
    section: neviim
    chapter: 13
    verse: 18
    ordinal: 6897
    text: 'And the angel of the LORD said unto him: ‘Wherefore askest thou after my name, seeing it is hidden?’'
    translation: JPS 1917
    original: וַיֹּאמֶר לּוֹ מַלְאַךְ יְהוָה לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי וְהוּא־פֶלִאי׃
    hebrewPlain: ויאמר לו מלאך יהוה למה זה תשאל לשמי והוא פלאי
    kjvRefs:
    - Judges 13:18
    kjvOsis:
    - Judg.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.19
    scripture: tanakh
    name: Tanakh Judges 13:19
    ref: Judges 13:19
    book: Judg
    section: neviim
    chapter: 13
    verse: 19
    ordinal: 6898
    text: So Manoah took the kid with the meal-offering, and offered it upon the rock unto the LORD; and [the angel] did wondrously, and Manoah and his wife looked on.
    translation: JPS 1917
    original: וַיִּקַּח מָנוֹחַ אֶת־גְּדִי הָעִזִּים וְאֶת־הַמִּנְחָה וַיַּעַל עַל־הַצּוּר לַיהוָה וּמַפְלִא לַעֲשׂוֹת וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים׃
    hebrewPlain: ויקח מנוח את גדי העזים ואת המנחה ויעל על הצור ליהוה ומפלא לעשות ומנוח ואשתו ראים
    kjvRefs:
    - Judges 13:19
    kjvOsis:
    - Judg.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.20
    scripture: tanakh
    name: Tanakh Judges 13:20
    ref: Judges 13:20
    book: Judg
    section: neviim
    chapter: 13
    verse: 20
    ordinal: 6899
    text: For it came to pass, when the flame went up toward heaven from off the altar, that the angel of the LORD ascended in the flame of the altar; and Manoah and his wife looked on; and they fell on their faces to the ground.
    translation: JPS 1917
    original: וַיְהִי בַעֲלוֹת הַלַּהַב מֵעַל הַמִּזְבֵּחַ הַשָּׁמַיְמָה וַיַּעַל מַלְאַךְ־יְהוָה בְּלַהַב הַמִּזְבֵּחַ וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה׃
    hebrewPlain: ויהי בעלות הלהב מעל המזבח השמימה ויעל מלאך יהוה בלהב המזבח ומנוח ואשתו ראים ויפלו על פניהם ארצה
    kjvRefs:
    - Judges 13:20
    kjvOsis:
    - Judg.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.21
    scripture: tanakh
    name: Tanakh Judges 13:21
    ref: Judges 13:21
    book: Judg
    section: neviim
    chapter: 13
    verse: 21
    ordinal: 6900
    text: But the angel of the LORD did no more appear to Manoah or to his wife. Then Manoah knew that he was the angel of the LORD.
    translation: JPS 1917
    original: וְלֹא־יָסַף עוֹד מַלְאַךְ יְהוָה לְהֵרָאֹה אֶל־מָנוֹחַ וְאֶל־אִשְׁתּוֹ אָז יָדַע מָנוֹחַ כִּי־מַלְאַךְ יְהוָה הוּא׃
    hebrewPlain: ולא יסף עוד מלאך יהוה להראה אל מנוח ואל אשתו אז ידע מנוח כי מלאך יהוה הוא
    kjvRefs:
    - Judges 13:21
    kjvOsis:
    - Judg.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.22
    scripture: tanakh
    name: Tanakh Judges 13:22
    ref: Judges 13:22
    book: Judg
    section: neviim
    chapter: 13
    verse: 22
    ordinal: 6901
    text: 'And Manoah said unto his wife: ‘We shall surely die, because we have seen God.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָנוֹחַ אֶל־אִשְׁתּוֹ מוֹת נָמוּת כִּי אֱלֹהִים רָאִינוּ׃
    hebrewPlain: ויאמר מנוח אל אשתו מות נמות כי אלהים ראינו
    kjvRefs:
    - Judges 13:22
    kjvOsis:
    - Judg.13.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.23
    scripture: tanakh
    name: Tanakh Judges 13:23
    ref: Judges 13:23
    book: Judg
    section: neviim
    chapter: 13
    verse: 23
    ordinal: 6902
    text: 'But his wife said unto him: ‘If the LORD were pleased to kill us, He would not have received a burnt-offering and a meal-offering at our hand, neither would He have shown us all these things, nor would at this time have told such things as these.’'
    translation: JPS 1917
    original: וַתֹּאמֶר לוֹ אִשְׁתּוֹ לוּ חָפֵץ יְהוָה לַהֲמִיתֵנוּ לֹא־לָקַח מִיָּדֵנוּ עֹלָה וּמִנְחָה וְלֹא הֶרְאָנוּ אֶת־כָּל־אֵלֶּה וְכָעֵת לֹא הִשְׁמִיעָנוּ כָּזֹאת׃
    hebrewPlain: ותאמר לו אשתו לו חפץ יהוה להמיתנו לא לקח מידנו עלה ומנחה ולא הראנו את כל אלה וכעת לא השמיענו כזאת
    kjvRefs:
    - Judges 13:23
    kjvOsis:
    - Judg.13.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.24
    scripture: tanakh
    name: Tanakh Judges 13:24
    ref: Judges 13:24
    book: Judg
    section: neviim
    chapter: 13
    verse: 24
    ordinal: 6903
    text: And the woman bore a son, and called his name Samson; and the child grew, and the LORD blessed him.
    translation: JPS 1917
    original: וַתֵּלֶד הָאִשָּׁה בֵּן וַתִּקְרָא אֶת־שְׁמוֹ שִׁמְשׁוֹן וַיִּגְדַּל הַנַּעַר וַיְבָרְכֵהוּ יְהוָה׃
    hebrewPlain: ותלד האשה בן ותקרא את שמו שמשון ויגדל הנער ויברכהו יהוה
    kjvRefs:
    - Judges 13:24
    kjvOsis:
    - Judg.13.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.25
    scripture: tanakh
    name: Tanakh Judges 13:25
    ref: Judges 13:25
    book: Judg
    section: neviim
    chapter: 13
    verse: 25
    ordinal: 6904
    text: And the spirit of the LORD began to move him in Mahaneh-dan, between Zorah and Eshtaol.
    translation: JPS 1917
    original: וַתָּחֶל רוּחַ יְהוָה לְפַעֲמוֹ בְּמַחֲנֵה־דָן בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל׃
    hebrewPlain: ותחל רוח יהוה לפעמו במחנה דן בין צרעה ובין אשתאל
    kjvRefs:
    - Judges 13:25
    kjvOsis:
    - Judg.13.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.14.1
    scripture: tanakh
    name: Tanakh Judges 14:1
    ref: Judges 14:1
    book: Judg
    section: neviim
    chapter: 14
    verse: 1
    ordinal: 6905
    text: And Samson went down to Timnah, and saw a woman in Timnah of the daughters of the Philistines.
    translation: JPS 1917
    original: וַיֵּרֶד שִׁמְשׁוֹן תִּמְנָתָה וַיַּרְא אִשָּׁה בְּתִמְנָתָה מִבְּנוֹת פְּלִשְׁתִּים׃
    hebrewPlain: וירד שמשון תמנתה וירא אשה בתמנתה מבנות פלשתים
    kjvRefs:
    - Judges 14:1
    kjvOsis:
    - Judg.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.2
    scripture: tanakh
    name: Tanakh Judges 14:2
    ref: Judges 14:2
    book: Judg
    section: neviim
    chapter: 14
    verse: 2
    ordinal: 6906
    text: 'And he came up, and told his father and his mother, and said: ‘I have seen a woman in Timnah of the daughters of the Philistines; now therefore get her for me to wife.’'
    translation: JPS 1917
    original: וַיַּעַל וַיַּגֵּד לְאָבִיו וּלְאִמּוֹ וַיֹּאמֶר אִשָּׁה רָאִיתִי בְתִמְנָתָה מִבְּנוֹת פְּלִשְׁתִּים וְעַתָּה קְחוּ־אוֹתָהּ לִּי לְאִשָּׁה׃
    hebrewPlain: ויעל ויגד לאביו ולאמו ויאמר אשה ראיתי בתמנתה מבנות פלשתים ועתה קחו אותה לי לאשה
    kjvRefs:
    - Judges 14:2
    kjvOsis:
    - Judg.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.3
    scripture: tanakh
    name: Tanakh Judges 14:3
    ref: Judges 14:3
    book: Judg
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 6907
    text: 'Then his father and his mother said unto him: ‘Is there never a woman among the daughters of thy brethren, or among all my people, that thou goest to take a wife of the uncircumcised Philistines?’ And Samson said unto his father: ‘Get her for me; for she pleaseth me well.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ אָבִיו וְאִמּוֹ הַאֵין בִּבְנוֹת אַחֶיךָ וּבְכָל־עַמִּי אִשָּׁה כִּי־אַתָּה הוֹלֵךְ לָקַחַת אִשָּׁה מִפְּלִשְׁתִּים הָעֲרֵלִים וַיֹּאמֶר שִׁמְשׁוֹן אֶל־אָבִיו אוֹתָהּ קַח־לִי כִּי־הִיא יָשְׁרָה בְעֵינָי׃
    hebrewPlain: ויאמר לו אביו ואמו האין בבנות אחיך ובכל עמי אשה כי אתה הולך לקחת אשה מפלשתים הערלים ויאמר שמשון אל אביו אותה קח לי כי היא ישרה בעיני
    kjvRefs:
    - Judges 14:3
    kjvOsis:
    - Judg.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.4
    scripture: tanakh
    name: Tanakh Judges 14:4
    ref: Judges 14:4
    book: Judg
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 6908
    text: But his father and his mother knew not that it was of the LORD; for he sought an occasion against the Philistines. Now at that time the Philistines had rule over Israel.
    translation: JPS 1917
    original: וְאָבִיו וְאִמּוֹ לֹא יָדְעוּ כִּי מֵיְהוָה הִיא כִּי־תֹאֲנָה הוּא־מְבַקֵּשׁ מִפְּלִשְׁתִּים וּבָעֵת הַהִיא פְּלִשְׁתִּים מֹשְׁלִים בְּיִשְׂרָאֵל׃
    hebrewPlain: ואביו ואמו לא ידעו כי מיהוה היא כי תאנה הוא מבקש מפלשתים ובעת ההיא פלשתים משלים בישראל
    kjvRefs:
    - Judges 14:4
    kjvOsis:
    - Judg.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.5
    scripture: tanakh
    name: Tanakh Judges 14:5
    ref: Judges 14:5
    book: Judg
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 6909
    text: Then went Samson down, and his father and his mother, to Timnah, and came to the vineyards of Timnah; and, behold, a young lion roared against him.
    translation: JPS 1917
    original: וַיֵּרֶד שִׁמְשׁוֹן וְאָבִיו וְאִמּוֹ תִּמְנָתָה וַיָּבֹאוּ עַד־כַּרְמֵי תִמְנָתָה וְהִנֵּה כְּפִיר אֲרָיוֹת שֹׁאֵג לִקְרָאתוֹ׃
    hebrewPlain: וירד שמשון ואביו ואמו תמנתה ויבאו עד כרמי תמנתה והנה כפיר אריות שאג לקראתו
    kjvRefs:
    - Judges 14:5
    kjvOsis:
    - Judg.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.6
    scripture: tanakh
    name: Tanakh Judges 14:6
    ref: Judges 14:6
    book: Judg
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 6910
    text: And the spirit of the LORD came mightily upon him, and he rent him as one would have rent a kid, and he had nothing in his hand; but he told not his father or his mother what he had done.
    translation: JPS 1917
    original: וַתִּצְלַח עָלָיו רוּחַ יְהוָה וַיְשַׁסְּעֵהוּ כְּשַׁסַּע הַגְּדִי וּמְאוּמָה אֵין בְּיָדוֹ וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ אֵת אֲשֶׁר עָשָׂה׃
    hebrewPlain: ותצלח עליו רוח יהוה וישסעהו כשסע הגדי ומאומה אין בידו ולא הגיד לאביו ולאמו את אשר עשה
    kjvRefs:
    - Judges 14:6
    kjvOsis:
    - Judg.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.7
    scripture: tanakh
    name: Tanakh Judges 14:7
    ref: Judges 14:7
    book: Judg
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 6911
    text: And he went down, and talked with the woman; and she pleased Samson well.
    translation: JPS 1917
    original: וַיֵּרֶד וַיְדַבֵּר לָאִשָּׁה וַתִּישַׁר בְּעֵינֵי שִׁמְשׁוֹן׃
    hebrewPlain: וירד וידבר לאשה ותישר בעיני שמשון
    kjvRefs:
    - Judges 14:7
    kjvOsis:
    - Judg.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.8
    scripture: tanakh
    name: Tanakh Judges 14:8
    ref: Judges 14:8
    book: Judg
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 6912
    text: And after a while he returned to take her, and he turned aside to see the carcass of the lion; and, behold, there was a swarm of bees in the body of the lion, and honey.
    translation: JPS 1917
    original: וַיָּשָׁב מִיָּמִים לְקַחְתָּהּ וַיָּסַר לִרְאוֹת אֵת מַפֶּלֶת הָאַרְיֵה וְהִנֵּה עֲדַת דְּבוֹרִים בִּגְוִיַּת הָאַרְיֵה וּדְבָשׁ׃
    hebrewPlain: וישב מימים לקחתה ויסר לראות את מפלת האריה והנה עדת דבורים בגוית האריה ודבש
    kjvRefs:
    - Judges 14:8
    kjvOsis:
    - Judg.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.9
    scripture: tanakh
    name: Tanakh Judges 14:9
    ref: Judges 14:9
    book: Judg
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 6913
    text: And he scraped it out into his hands, and went on, eating as he went, and he came to his father and mother, and gave unto them, and they did eat; but he told them not that he had scraped the honey out of the body of the lion.
    translation: JPS 1917
    original: וַיִּרְדֵּהוּ אֶל־כַּפָּיו וַיֵּלֶךְ הָלוֹךְ וְאָכֹל וַיֵּלֶךְ אֶל־אָבִיו וְאֶל־אִמּוֹ וַיִּתֵּן לָהֶם וַיֹּאכֵלוּ וְלֹא־הִגִּיד לָהֶם כִּי מִגְּוִיַּת הָאַרְיֵה רָדָה הַדְּבָשׁ׃
    hebrewPlain: וירדהו אל כפיו וילך הלוך ואכל וילך אל אביו ואל אמו ויתן להם ויאכלו ולא הגיד להם כי מגוית האריה רדה הדבש
    kjvRefs:
    - Judges 14:9
    kjvOsis:
    - Judg.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.10
    scripture: tanakh
    name: Tanakh Judges 14:10
    ref: Judges 14:10
    book: Judg
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 6914
    text: And his father went down unto the woman; and Samson made there a feast; for so used the young men to do.
    translation: JPS 1917
    original: וַיֵּרֶד אָבִיהוּ אֶל־הָאִשָּׁה וַיַּעַשׂ שָׁם שִׁמְשׁוֹן מִשְׁתֶּה כִּי כֵּן יַעֲשׂוּ הַבַּחוּרִים׃
    hebrewPlain: וירד אביהו אל האשה ויעש שם שמשון משתה כי כן יעשו הבחורים
    kjvRefs:
    - Judges 14:10
    kjvOsis:
    - Judg.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.11
    scripture: tanakh
    name: Tanakh Judges 14:11
    ref: Judges 14:11
    book: Judg
    section: neviim
    chapter: 14
    verse: 11
    ordinal: 6915
    text: And it came to pass, when they saw him, that they brought thirty companions to be with him.
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹתָם אוֹתוֹ וַיִּקְחוּ שְׁלֹשִׁים מֵרֵעִים וַיִּהְיוּ אִתּוֹ׃
    hebrewPlain: ויהי כראותם אותו ויקחו שלשים מרעים ויהיו אתו
    kjvRefs:
    - Judges 14:11
    kjvOsis:
    - Judg.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.12
    scripture: tanakh
    name: Tanakh Judges 14:12
    ref: Judges 14:12
    book: Judg
    section: neviim
    chapter: 14
    verse: 12
    ordinal: 6916
    text: 'And Samson said unto them: ‘Let me now put forth a riddle unto you; if ye can declare it me within the seven days of the feast, and find it out, then I will give you thirty linen garments and thirty changes of raiment;'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם שִׁמְשׁוֹן אָחוּדָה־נָּא לָכֶם חִידָה אִם־הַגֵּד תַּגִּידוּ אוֹתָהּ לִי שִׁבְעַת יְמֵי הַמִּשְׁתֶּה וּמְצָאתֶם וְנָתַתִּי לָכֶם שְׁלֹשִׁים סְדִינִים וּשְׁלֹשִׁים חֲלִפֹת בְּגָדִים׃
    hebrewPlain: ויאמר להם שמשון אחודה נא לכם חידה אם הגד תגידו אותה לי שבעת ימי המשתה ומצאתם ונתתי לכם שלשים סדינים ושלשים חלפת בגדים
    kjvRefs:
    - Judges 14:12
    kjvOsis:
    - Judg.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.13
    scripture: tanakh
    name: Tanakh Judges 14:13
    ref: Judges 14:13
    book: Judg
    section: neviim
    chapter: 14
    verse: 13
    ordinal: 6917
    text: 'but if ye cannot declare it me, then shall ye give me thirty linen garments and thirty changes of raiment.’ And they said unto him: ‘Put forth thy riddle, that we may hear it.’'
    translation: JPS 1917
    original: וְאִם־לֹא תוּכְלוּ לְהַגִּיד לִי וּנְתַתֶּם אַתֶּם לִי שְׁלֹשִׁים סְדִינִים וּשְׁלֹשִׁים חֲלִיפוֹת בְּגָדִים וַיֹּאמְרוּ לוֹ חוּדָה חִידָתְךָ וְנִשְׁמָעֶנָּה׃
    hebrewPlain: ואם לא תוכלו להגיד לי ונתתם אתם לי שלשים סדינים ושלשים חליפות בגדים ויאמרו לו חודה חידתך ונשמענה
    kjvRefs:
    - Judges 14:13
    kjvOsis:
    - Judg.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.14
    scripture: tanakh
    name: Tanakh Judges 14:14
    ref: Judges 14:14
    book: Judg
    section: neviim
    chapter: 14
    verse: 14
    ordinal: 6918
    text: 'And he said unto them: Out of the eater came forth food, And out of the strong came forth sweetness. And they could not in three days declare the riddle.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם מֵהָאֹכֵל יָצָא מַאֲכָל וּמֵעַז יָצָא מָתוֹק וְלֹא יָכְלוּ לְהַגִּיד הַחִידָה שְׁלֹשֶׁת יָמִים׃
    hebrewPlain: ויאמר להם מהאכל יצא מאכל ומעז יצא מתוק ולא יכלו להגיד החידה שלשת ימים
    kjvRefs:
    - Judges 14:14
    kjvOsis:
    - Judg.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.15
    scripture: tanakh
    name: Tanakh Judges 14:15
    ref: Judges 14:15
    book: Judg
    section: neviim
    chapter: 14
    verse: 15
    ordinal: 6919
    text: 'And it came to pass on the seventh day, that they said unto Samson’s wife: ‘Entice thy husband, that he may declare unto us the riddle, lest we burn thee and thy father’s house with fire; have ye called us hither to impoverish us?’'
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי וַיֹּאמְרוּ לְאֵשֶׁת־שִׁמְשׁוֹן פַּתִּי אֶת־אִישֵׁךְ וְיַגֶּד־לָנוּ אֶת־הַחִידָה פֶּן־נִשְׂרֹף אוֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ הַלְיָרְשֵׁנוּ קְרָאתֶם לָנוּ הֲלֹא׃
    hebrewPlain: ויהי ביום השביעי ויאמרו לאשת שמשון פתי את אישך ויגד לנו את החידה פן נשרף אותך ואת בית אביך באש הלירשנו קראתם לנו הלא
    kjvRefs:
    - Judges 14:15
    kjvOsis:
    - Judg.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.16
    scripture: tanakh
    name: Tanakh Judges 14:16
    ref: Judges 14:16
    book: Judg
    section: neviim
    chapter: 14
    verse: 16
    ordinal: 6920
    text: 'And Samson’s wife wept before him, and said: ‘Thou dost but hate me, and lovest me not; thou hast put forth a riddle unto the children of my people, and wilt thou not tell it me?’ And he said unto her: ‘Behold, I have not told it my father nor my mother, and shall I tell thee?’'
    translation: JPS 1917
    original: וַתֵּבְךְּ אֵשֶׁת שִׁמְשׁוֹן עָלָיו וַתֹּאמֶר רַק־שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי הַחִידָה חַדְתָּ לִבְנֵי עַמִּי וְלִי לֹא הִגַּדְתָּה וַיֹּאמֶר לָהּ הִנֵּה לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי וְלָךְ אַגִּיד׃
    hebrewPlain: ותבך אשת שמשון עליו ותאמר רק שנאתני ולא אהבתני החידה חדת לבני עמי ולי לא הגדתה ויאמר לה הנה לאבי ולאמי לא הגדתי ולך אגיד
    kjvRefs:
    - Judges 14:16
    kjvOsis:
    - Judg.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.17
    scripture: tanakh
    name: Tanakh Judges 14:17
    ref: Judges 14:17
    book: Judg
    section: neviim
    chapter: 14
    verse: 17
    ordinal: 6921
    text: And she wept before him the seven days, while their feast lasted; and it came to pass on the seventh day, that he told her, because she pressed him sore; and she told the riddle to the children of her people.
    translation: JPS 1917
    original: וַתֵּבְךְּ עָלָיו שִׁבְעַת הַיָּמִים אֲשֶׁר־הָיָה לָהֶם הַמִּשְׁתֶּה וַיְהִי בַּיּוֹם הַשְּׁבִיעִי וַיַּגֶּד־לָהּ כִּי הֱצִיקַתְהוּ וַתַּגֵּד הַחִידָה לִבְנֵי עַמָּהּ׃
    hebrewPlain: ותבך עליו שבעת הימים אשר היה להם המשתה ויהי ביום השביעי ויגד לה כי הציקתהו ותגד החידה לבני עמה
    kjvRefs:
    - Judges 14:17
    kjvOsis:
    - Judg.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.18
    scripture: tanakh
    name: Tanakh Judges 14:18
    ref: Judges 14:18
    book: Judg
    section: neviim
    chapter: 14
    verse: 18
    ordinal: 6922
    text: 'And the men of the city said unto him on the seventh day before the sun went down: What is sweeter than honey? And what is stronger than a lion? And he said unto them: If ye had not plowed with my heifer, Ye had not found out my riddle.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ אַנְשֵׁי הָעִיר בַּיּוֹם הַשְּׁבִיעִי בְּטֶרֶם יָבֹא הַחַרְסָה מַה־מָּתוֹק מִדְּבַשׁ וּמֶה עַז מֵאֲרִי וַיֹּאמֶר לָהֶם לוּלֵא חֲרַשְׁתֶּם בְּעֶגְלָתִי לֹא מְצָאתֶם חִידָתִי׃
    hebrewPlain: ויאמרו לו אנשי העיר ביום השביעי בטרם יבא החרסה מה מתוק מדבש ומה עז מארי ויאמר להם לולא חרשתם בעגלתי לא מצאתם חידתי
    kjvRefs:
    - Judges 14:18
    kjvOsis:
    - Judg.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.19
    scripture: tanakh
    name: Tanakh Judges 14:19
    ref: Judges 14:19
    book: Judg
    section: neviim
    chapter: 14
    verse: 19
    ordinal: 6923
    text: And the spirit of the LORD came mightily upon him, and he went down to Ashkelon, and smote thirty men of them, and took their spoil, and gave the changes of raiment unto them that declared the riddle. And his anger was kindled, and he went up to his father’s house.
    translation: JPS 1917
    original: וַתִּצְלַח עָלָיו רוּחַ יְהוָה וַיֵּרֶד אַשְׁקְלוֹן וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ וַיִּקַּח אֶת־חֲלִיצוֹתָם וַיִּתֵּן הַחֲלִיפוֹת לְמַגִּידֵי הַחִידָה וַיִּחַר אַפּוֹ וַיַּעַל בֵּית אָבִיהוּ׃
    hebrewPlain: ותצלח עליו רוח יהוה וירד אשקלון ויך מהם שלשים איש ויקח את חליצותם ויתן החליפות למגידי החידה ויחר אפו ויעל בית אביהו
    kjvRefs:
    - Judges 14:19
    kjvOsis:
    - Judg.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.14.20
    scripture: tanakh
    name: Tanakh Judges 14:20
    ref: Judges 14:20
    book: Judg
    section: neviim
    chapter: 14
    verse: 20
    ordinal: 6924
    text: But Samson’s wife was given to his companion, whom he had had for his friend.
    translation: JPS 1917
    original: וַתְּהִי אֵשֶׁת שִׁמְשׁוֹן לְמֵרֵעֵהוּ אֲשֶׁר רֵעָה לוֹ׃
    hebrewPlain: ותהי אשת שמשון למרעהו אשר רעה לו
    kjvRefs:
    - Judges 14:20
    kjvOsis:
    - Judg.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.14
- type: TanakhVerse
  data:
    osis: Judg.15.1
    scripture: tanakh
    name: Tanakh Judges 15:1
    ref: Judges 15:1
    book: Judg
    section: neviim
    chapter: 15
    verse: 1
    ordinal: 6925
    text: 'But it came to pass after a while, in the time of wheat harvest, that Samson visited his wife with a kid; and he said: ‘I will go in to my wife into the chamber.’ But her father would not suffer him to go in.'
    translation: JPS 1917
    original: וַיְהִי מִיָּמִים בִּימֵי קְצִיר־חִטִּים וַיִּפְקֹד שִׁמְשׁוֹן אֶת־אִשְׁתּוֹ בִּגְדִי עִזִּים וַיֹּאמֶר אָבֹאָה אֶל־אִשְׁתִּי הֶחָדְרָה וְלֹא־נְתָנוֹ אָבִיהָ לָבוֹא׃
    hebrewPlain: ויהי מימים בימי קציר חטים ויפקד שמשון את אשתו בגדי עזים ויאמר אבאה אל אשתי החדרה ולא נתנו אביה לבוא
    kjvRefs:
    - Judges 15:1
    kjvOsis:
    - Judg.15.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.2
    scripture: tanakh
    name: Tanakh Judges 15:2
    ref: Judges 15:2
    book: Judg
    section: neviim
    chapter: 15
    verse: 2
    ordinal: 6926
    text: 'And her father said: ‘I verily thought that thou hadst utterly hated her; therefore I gave her to thy companion; is not her younger sister fairer than she? take her, I pray thee, instead of her.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אָבִיהָ אָמֹר אָמַרְתִּי כִּי־שָׂנֹא שְׂנֵאתָהּ וָאֶתְּנֶנָּה לְמֵרֵעֶךָ הֲלֹא אֲחֹתָהּ הַקְּטַנָּה טוֹבָה מִמֶּנָּה תְּהִי־נָא לְךָ תַּחְתֶּיהָ׃
    hebrewPlain: ויאמר אביה אמר אמרתי כי שנא שנאתה ואתננה למרעך הלא אחתה הקטנה טובה ממנה תהי נא לך תחתיה
    kjvRefs:
    - Judges 15:2
    kjvOsis:
    - Judg.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.3
    scripture: tanakh
    name: Tanakh Judges 15:3
    ref: Judges 15:3
    book: Judg
    section: neviim
    chapter: 15
    verse: 3
    ordinal: 6927
    text: 'And Samson said unto them: ‘This time shall I be quits with the Philistines, when I do them a mischief.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם שִׁמְשׁוֹן נִקֵּיתִי הַפַּעַם מִפְּלִשְׁתִּים כִּי־עֹשֶׂה אֲנִי עִמָּם רָעָה׃
    hebrewPlain: ויאמר להם שמשון נקיתי הפעם מפלשתים כי עשה אני עמם רעה
    kjvRefs:
    - Judges 15:3
    kjvOsis:
    - Judg.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.4
    scripture: tanakh
    name: Tanakh Judges 15:4
    ref: Judges 15:4
    book: Judg
    section: neviim
    chapter: 15
    verse: 4
    ordinal: 6928
    text: And Samson went and caught three hundred foxes, and took torches, and turned tail to tail, and put a torch in the midst between every two tails.
    translation: JPS 1917
    original: וַיֵּלֶךְ שִׁמְשׁוֹן וַיִּלְכֹּד שְׁלֹשׁ־מֵאוֹת שׁוּעָלִים וַיִּקַּח לַפִּדִים וַיֶּפֶן זָנָב אֶל־זָנָב וַיָּשֶׂם לַפִּיד אֶחָד בֵּין־שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ׃
    hebrewPlain: וילך שמשון וילכד שלש מאות שועלים ויקח לפדים ויפן זנב אל זנב וישם לפיד אחד בין שני הזנבות בתוך
    kjvRefs:
    - Judges 15:4
    kjvOsis:
    - Judg.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.5
    scripture: tanakh
    name: Tanakh Judges 15:5
    ref: Judges 15:5
    book: Judg
    section: neviim
    chapter: 15
    verse: 5
    ordinal: 6929
    text: And when he had set the torches on fire, he let them go into the standing corn of the Philistines, and burnt up both the shocks and the standing corn, and also the oliveyards.
    translation: JPS 1917
    original: וַיַּבְעֶר־אֵשׁ בַּלַּפִּידִים וַיְשַׁלַּח בְּקָמוֹת פְּלִשְׁתִּים וַיַּבְעֵר מִגָּדִישׁ וְעַד־קָמָה וְעַד־כֶּרֶם זָיִת׃
    hebrewPlain: ויבער אש בלפידים וישלח בקמות פלשתים ויבער מגדיש ועד קמה ועד כרם זית
    kjvRefs:
    - Judges 15:5
    kjvOsis:
    - Judg.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.6
    scripture: tanakh
    name: Tanakh Judges 15:6
    ref: Judges 15:6
    book: Judg
    section: neviim
    chapter: 15
    verse: 6
    ordinal: 6930
    text: 'Then the Philistines said: ‘Who hath done this?’ And they said: ‘Samson, the son-in-law of the Timnite, because he hath taken his wife, and given her to his companion.’ And the Philistines came up, and burnt her and her father with fire.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ פְלִשְׁתִּים מִי עָשָׂה זֹאת וַיֹּאמְרוּ שִׁמְשׁוֹן חֲתַן הַתִּמְנִי כִּי לָקַח אֶת־אִשְׁתּוֹ וַיִּתְּנָהּ לְמֵרֵעֵהוּ וַיַּעֲלוּ פְלִשְׁתִּים וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת־אָבִיהָ בָּאֵשׁ׃
    hebrewPlain: ויאמרו פלשתים מי עשה זאת ויאמרו שמשון חתן התמני כי לקח את אשתו ויתנה למרעהו ויעלו פלשתים וישרפו אותה ואת אביה באש
    kjvRefs:
    - Judges 15:6
    kjvOsis:
    - Judg.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.7
    scripture: tanakh
    name: Tanakh Judges 15:7
    ref: Judges 15:7
    book: Judg
    section: neviim
    chapter: 15
    verse: 7
    ordinal: 6931
    text: 'And Samson said unto them: ‘If ye do after this manner, surely I will be avenged of you, and after that I will cease.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם שִׁמְשׁוֹן אִם־תַּעֲשׂוּן כָּזֹאת כִּי אִם־נִקַּמְתִּי בָכֶם וְאַחַר אֶחְדָּל׃
    hebrewPlain: ויאמר להם שמשון אם תעשון כזאת כי אם נקמתי בכם ואחר אחדל
    kjvRefs:
    - Judges 15:7
    kjvOsis:
    - Judg.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.8
    scripture: tanakh
    name: Tanakh Judges 15:8
    ref: Judges 15:8
    book: Judg
    section: neviim
    chapter: 15
    verse: 8
    ordinal: 6932
    text: And he smote them hip and thigh with a great slaughter; and he went down and dwelt in the cleft of the rock of Etam.
    translation: JPS 1917
    original: וַיַּךְ אוֹתָם שׁוֹק עַל־יָרֵךְ מַכָּה גְדוֹלָה וַיֵּרֶד וַיֵּשֶׁב בִּסְעִיף סֶלַע עֵיטָם׃
    hebrewPlain: ויך אותם שוק על ירך מכה גדולה וירד וישב בסעיף סלע עיטם
    kjvRefs:
    - Judges 15:8
    kjvOsis:
    - Judg.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.9
    scripture: tanakh
    name: Tanakh Judges 15:9
    ref: Judges 15:9
    book: Judg
    section: neviim
    chapter: 15
    verse: 9
    ordinal: 6933
    text: Then the Philistines went up, and pitched in Judah, and spread themselves against Lehi.
    translation: JPS 1917
    original: וַיַּעֲלוּ פְלִשְׁתִּים וַיַּחֲנוּ בִּיהוּדָה וַיִּנָּטְשׁוּ בַּלֶּחִי׃
    hebrewPlain: ויעלו פלשתים ויחנו ביהודה וינטשו בלחי
    kjvRefs:
    - Judges 15:9
    kjvOsis:
    - Judg.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.10
    scripture: tanakh
    name: Tanakh Judges 15:10
    ref: Judges 15:10
    book: Judg
    section: neviim
    chapter: 15
    verse: 10
    ordinal: 6934
    text: 'And the men of Judah said: ‘Why are ye come up against us?’ And they said: ‘To bind Samson are we come up, to do to him as he hath done to us.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אִישׁ יְהוּדָה לָמָה עֲלִיתֶם עָלֵינוּ וַיֹּאמְרוּ לֶאֱסוֹר אֶת־שִׁמְשׁוֹן עָלִינוּ לַעֲשׂוֹת לוֹ כַּאֲשֶׁר עָשָׂה לָנוּ׃
    hebrewPlain: ויאמרו איש יהודה למה עליתם עלינו ויאמרו לאסור את שמשון עלינו לעשות לו כאשר עשה לנו
    kjvRefs:
    - Judges 15:10
    kjvOsis:
    - Judg.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.11
    scripture: tanakh
    name: Tanakh Judges 15:11
    ref: Judges 15:11
    book: Judg
    section: neviim
    chapter: 15
    verse: 11
    ordinal: 6935
    text: 'Then three thousand men of Judah went down to the cleft of the rock of Etam, and said to Samson: ‘Knowest thou not that the Philistines are rulers over us? what then is this that thou hast done unto us?’ And he said unto them: ‘As they did unto me, so have I done unto them.’'
    translation: JPS 1917
    original: וַיֵּרְדוּ שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה אֶל־סְעִיף סֶלַע עֵיטָם וַיֹּאמְרוּ לְשִׁמְשׁוֹן הֲלֹא יָדַעְתָּ כִּי־מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים וּמַה־זֹּאת עָשִׂיתָ לָּנוּ וַיֹּאמֶר לָהֶם כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם׃
    hebrewPlain: וירדו שלשת אלפים איש מיהודה אל סעיף סלע עיטם ויאמרו לשמשון הלא ידעת כי משלים בנו פלשתים ומה זאת עשית לנו ויאמר להם כאשר עשו לי כן עשיתי להם
    kjvRefs:
    - Judges 15:11
    kjvOsis:
    - Judg.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.12
    scripture: tanakh
    name: Tanakh Judges 15:12
    ref: Judges 15:12
    book: Judg
    section: neviim
    chapter: 15
    verse: 12
    ordinal: 6936
    text: 'And they said unto him: ‘We are come down to bind thee, that we may deliver thee into the hand of the Philistines.’ And Samson said unto them: ‘Swear unto me, that ye will not fall upon me yourselves.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ לֶאֱסָרְךָ יָרַדְנוּ לְתִתְּךָ בְּיַד־פְּלִשְׁתִּים וַיֹּאמֶר לָהֶם שִׁמְשׁוֹן הִשָּׁבְעוּ לִי פֶּן־תִּפְגְּעוּן בִּי אַתֶּם׃
    hebrewPlain: ויאמרו לו לאסרך ירדנו לתתך ביד פלשתים ויאמר להם שמשון השבעו לי פן תפגעון בי אתם
    kjvRefs:
    - Judges 15:12
    kjvOsis:
    - Judg.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.13
    scripture: tanakh
    name: Tanakh Judges 15:13
    ref: Judges 15:13
    book: Judg
    section: neviim
    chapter: 15
    verse: 13
    ordinal: 6937
    text: 'And they spoke unto him, saying: ‘No; but we will bind thee fast, and deliver thee into their hand; but surely we will not kill thee.’ And they bound him with two new ropes, and brought him up from the rock.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ לֵאמֹר לֹא כִּי־אָסֹר נֶאֱסָרְךָ וּנְתַנּוּךָ בְיָדָם וְהָמֵת לֹא נְמִיתֶךָ וַיַּאַסְרֻהוּ בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים וַיַּעֲלוּהוּ מִן־הַסָּלַע׃
    hebrewPlain: ויאמרו לו לאמר לא כי אסר נאסרך ונתנוך בידם והמת לא נמיתך ויאסרהו בשנים עבתים חדשים ויעלוהו מן הסלע
    kjvRefs:
    - Judges 15:13
    kjvOsis:
    - Judg.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.14
    scripture: tanakh
    name: Tanakh Judges 15:14
    ref: Judges 15:14
    book: Judg
    section: neviim
    chapter: 15
    verse: 14
    ordinal: 6938
    text: When he came unto Lehi, the Philistines shouted as they met him; and the spirit of the LORD came mightily upon him, and the ropes that were upon his arms became as flax that was burnt with fire, and his bands dropped from off his hands.
    translation: JPS 1917
    original: הוּא־בָא עַד־לֶחִי וּפְלִשִׁתִּים הֵרִיעוּ לִקְרָאתוֹ וַתִּצְלַח עָלָיו רוּחַ יְהוָה וַתִּהְיֶינָה הָעֲבֹתִים אֲשֶׁר עַל־זְרוֹעוֹתָיו כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו׃
    hebrewPlain: הוא בא עד לחי ופלשתים הריעו לקראתו ותצלח עליו רוח יהוה ותהיינה העבתים אשר על זרועותיו כפשתים אשר בערו באש וימסו אסוריו מעל ידיו
    kjvRefs:
    - Judges 15:14
    kjvOsis:
    - Judg.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.15
    scripture: tanakh
    name: Tanakh Judges 15:15
    ref: Judges 15:15
    book: Judg
    section: neviim
    chapter: 15
    verse: 15
    ordinal: 6939
    text: And he found a new jawbone of an ass, and put forth his hand, and took it, and smote a thousand men therewith.
    translation: JPS 1917
    original: וַיִּמְצָא לְחִי־חֲמוֹר טְרִיָּה וַיִּשְׁלַח יָדוֹ וַיִּקָּחֶהָ וַיַּךְ־בָּהּ אֶלֶף אִישׁ׃
    hebrewPlain: וימצא לחי חמור טריה וישלח ידו ויקחה ויך בה אלף איש
    kjvRefs:
    - Judges 15:15
    kjvOsis:
    - Judg.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.16
    scripture: tanakh
    name: Tanakh Judges 15:16
    ref: Judges 15:16
    book: Judg
    section: neviim
    chapter: 15
    verse: 16
    ordinal: 6940
    text: 'And Samson said: With the jawbone of an ass, heaps upon heaps, With the jawbone of an ass have I smitten a thousand men.'
    translation: JPS 1917
    original: וַיֹּאמֶר שִׁמְשׁוֹן בִּלְחִי הַחֲמוֹר חֲמוֹר חֲמֹרָתָיִם בִּלְחִי הַחֲמוֹר הִכֵּיתִי אֶלֶף אִישׁ׃
    hebrewPlain: ויאמר שמשון בלחי החמור חמור חמרתים בלחי החמור הכיתי אלף איש
    kjvRefs:
    - Judges 15:16
    kjvOsis:
    - Judg.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.17
    scripture: tanakh
    name: Tanakh Judges 15:17
    ref: Judges 15:17
    book: Judg
    section: neviim
    chapter: 15
    verse: 17
    ordinal: 6941
    text: And it came to pass, when he had made an end of speaking, that he cast away the jawbone out of his hand; and that place was called Ramath-lehi.
    translation: JPS 1917
    original: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר וַיַּשְׁלֵךְ הַלְּחִי מִיָּדוֹ וַיִּקְרָא לַמָּקוֹם הַהוּא רָמַת לֶחִי׃
    hebrewPlain: ויהי ככלתו לדבר וישלך הלחי מידו ויקרא למקום ההוא רמת לחי
    kjvRefs:
    - Judges 15:17
    kjvOsis:
    - Judg.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.18
    scripture: tanakh
    name: Tanakh Judges 15:18
    ref: Judges 15:18
    book: Judg
    section: neviim
    chapter: 15
    verse: 18
    ordinal: 6942
    text: 'And he was sore athirst, and called on the LORD, and said: ‘Thou hast given this great deliverance by the hand of Thy servant; and now shall I die for thirst, and fall into the hand of the uncircumcised?’'
    translation: JPS 1917
    original: וַיִּצְמָא מְאֹד וַיִּקְרָא אֶל־יְהוָה וַיֹּאמַר אַתָּה נָתַתָּ בְיַד־עַבְדְּךָ אֶת־הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת וְעַתָּה אָמוּת בַּצָּמָא וְנָפַלְתִּי בְּיַד הָעֲרֵלִים׃
    hebrewPlain: ויצמא מאד ויקרא אל יהוה ויאמר אתה נתת ביד עבדך את התשועה הגדלה הזאת ועתה אמות בצמא ונפלתי ביד הערלים
    kjvRefs:
    - Judges 15:18
    kjvOsis:
    - Judg.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.19
    scripture: tanakh
    name: Tanakh Judges 15:19
    ref: Judges 15:19
    book: Judg
    section: neviim
    chapter: 15
    verse: 19
    ordinal: 6943
    text: But God cleaved the hollow place that is in Lehi, and there came water thereout; and when he had drunk, his spirit came back, and he revived; wherefore the name thereof was called En-hakkore, which is in Lehi unto this day.
    translation: JPS 1917
    original: וַיִּבְקַע אֱלֹהִים אֶת־הַמַּכְתֵּשׁ אֲשֶׁר־בַּלֶּחִי וַיֵּצְאוּ מִמֶּנּוּ מַיִם וַיֵּשְׁתְּ וַתָּשָׁב רוּחוֹ וַיֶּחִי עַל־כֵּן קָרָא שְׁמָהּ עֵין הַקּוֹרֵא אֲשֶׁר בַּלֶּחִי עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויבקע אלהים את המכתש אשר בלחי ויצאו ממנו מים וישת ותשב רוחו ויחי על כן קרא שמה עין הקורא אשר בלחי עד היום הזה
    kjvRefs:
    - Judges 15:19
    kjvOsis:
    - Judg.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.15.20
    scripture: tanakh
    name: Tanakh Judges 15:20
    ref: Judges 15:20
    book: Judg
    section: neviim
    chapter: 15
    verse: 20
    ordinal: 6944
    text: And he judged Israel in the days of the Philistines twenty years.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל בִּימֵי פְלִשְׁתִּים עֶשְׂרִים שָׁנָה׃
    hebrewPlain: וישפט את ישראל בימי פלשתים עשרים שנה
    kjvRefs:
    - Judges 15:20
    kjvOsis:
    - Judg.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.15
- type: TanakhVerse
  data:
    osis: Judg.16.1
    scripture: tanakh
    name: Tanakh Judges 16:1
    ref: Judges 16:1
    book: Judg
    section: neviim
    chapter: 16
    verse: 1
    ordinal: 6945
    text: And Samson went to Gaza, and saw there a harlot, and went in unto her.
    translation: JPS 1917
    original: וַיֵּלֶךְ שִׁמְשׁוֹן עַזָּתָה וַיַּרְא־שָׁם אִשָּׁה זוֹנָה וַיָּבֹא אֵלֶיהָ׃
    hebrewPlain: וילך שמשון עזתה וירא שם אשה זונה ויבא אליה
    kjvRefs:
    - Judges 16:1
    kjvOsis:
    - Judg.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.2
    scripture: tanakh
    name: Tanakh Judges 16:2
    ref: Judges 16:2
    book: Judg
    section: neviim
    chapter: 16
    verse: 2
    ordinal: 6946
    text: '[And it was told] the Gazites, saying: ‘Samson is come hither.’ And they compassed him in, and lay in wait for him all night in the gate of the city, and were quiet all the night, saying: ‘Let be till morning light, then we will kill him.’'
    translation: JPS 1917
    original: לַעַזָּתִים לֵאמֹר בָּא שִׁמְשׁוֹן הֵנָּה וַיָּסֹבּוּ וַיֶּאֶרְבוּ־לוֹ כָל־הַלַּיְלָה בְּשַׁעַר הָעִיר וַיִּתְחָרְשׁוּ כָל־הַלַּיְלָה לֵאמֹר עַד־אוֹר הַבֹּקֶר וַהֲרְגְנֻהוּ׃
    hebrewPlain: לעזתים לאמר בא שמשון הנה ויסבו ויארבו לו כל הלילה בשער העיר ויתחרשו כל הלילה לאמר עד אור הבקר והרגנהו
    kjvRefs:
    - Judges 16:2
    kjvOsis:
    - Judg.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.3
    scripture: tanakh
    name: Tanakh Judges 16:3
    ref: Judges 16:3
    book: Judg
    section: neviim
    chapter: 16
    verse: 3
    ordinal: 6947
    text: And Samson lay till midnight, and arose at midnight, and laid hold of the doors of the gate of the city, and the two posts, and plucked them up, bar and all, and put them upon his shoulders, and carried them up to the top of the mountain that is before Hebron.
    translation: JPS 1917
    original: וַיִּשְׁכַּב שִׁמְשׁוֹן עַד־חֲצִי הַלַּיְלָה וַיָּקָם בַּחֲצִי הַלַּיְלָה וַיֶּאֱחֹז בְּדַלְתוֹת שַׁעַר־הָעִיר וּבִשְׁתֵּי הַמְּזוּזוֹת וַיִּסָּעֵם עִם־הַבְּרִיחַ וַיָּשֶׂם עַל־כְּתֵפָיו וַיַּעֲלֵם אֶל־רֹאשׁ הָהָר אֲשֶׁר עַל־פְּנֵי חֶבְרוֹן׃
    hebrewPlain: וישכב שמשון עד חצי הלילה ויקם בחצי הלילה ויאחז בדלתות שער העיר ובשתי המזוזות ויסעם עם הבריח וישם על כתפיו ויעלם אל ראש ההר אשר על פני חברון
    kjvRefs:
    - Judges 16:3
    kjvOsis:
    - Judg.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.4
    scripture: tanakh
    name: Tanakh Judges 16:4
    ref: Judges 16:4
    book: Judg
    section: neviim
    chapter: 16
    verse: 4
    ordinal: 6948
    text: And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי־כֵן וַיֶּאֱהַב אִשָּׁה בְּנַחַל שֹׂרֵק וּשְׁמָהּ דְּלִילָה׃
    hebrewPlain: ויהי אחרי כן ויאהב אשה בנחל שרק ושמה דלילה
    kjvRefs:
    - Judges 16:4
    kjvOsis:
    - Judg.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.5
    scripture: tanakh
    name: Tanakh Judges 16:5
    ref: Judges 16:5
    book: Judg
    section: neviim
    chapter: 16
    verse: 5
    ordinal: 6949
    text: 'And the lords of the Philistines came up unto her, and said unto her: ‘Entice him, and see wherein his great strength lieth, and by what means we may prevail against him, that we may bind him to afflict him; and we will give thee every one of us eleven hundred pieces of silver.’'
    translation: JPS 1917
    original: וַיַּעֲלוּ אֵלֶיהָ סַרְנֵי פְלִשְׁתִּים וַיֹּאמְרוּ לָהּ פַּתִּי אוֹתוֹ וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל וּבַמֶּה נוּכַל לוֹ וַאֲסַרְנֻהוּ לְעַנֹּתוֹ וַאֲנַחְנוּ נִתַּן־לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף׃
    hebrewPlain: ויעלו אליה סרני פלשתים ויאמרו לה פתי אותו וראי במה כחו גדול ובמה נוכל לו ואסרנהו לענתו ואנחנו נתן לך איש אלף ומאה כסף
    kjvRefs:
    - Judges 16:5
    kjvOsis:
    - Judg.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.6
    scripture: tanakh
    name: Tanakh Judges 16:6
    ref: Judges 16:6
    book: Judg
    section: neviim
    chapter: 16
    verse: 6
    ordinal: 6950
    text: 'And Delilah said to Samson: ‘Tell me, I pray thee, wherein thy great strength lieth, and wherewith thou mightest be bound to afflict thee.’'
    translation: JPS 1917
    original: וַתֹּאמֶר דְּלִילָה אֶל־שִׁמְשׁוֹן הַגִּידָה־נָּא לִי בַּמֶּה כֹּחֲךָ גָדוֹל וּבַמֶּה תֵאָסֵר לְעַנּוֹתֶךָ׃
    hebrewPlain: ותאמר דלילה אל שמשון הגידה נא לי במה כחך גדול ובמה תאסר לענותך
    kjvRefs:
    - Judges 16:6
    kjvOsis:
    - Judg.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.7
    scripture: tanakh
    name: Tanakh Judges 16:7
    ref: Judges 16:7
    book: Judg
    section: neviim
    chapter: 16
    verse: 7
    ordinal: 6951
    text: 'And Samson said unto her: ‘If they bind me with seven fresh bowstrings that were never dried, then shall I become weak, and be as any other man.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן אִם־יַאַסְרֻנִי בְּשִׁבְעָה יְתָרִים לַחִים אֲשֶׁר לֹא־חֹרָבוּ וְחָלִיתִי וְהָיִיתִי כְּאַחַד הָאָדָם׃
    hebrewPlain: ויאמר אליה שמשון אם יאסרני בשבעה יתרים לחים אשר לא חרבו וחליתי והייתי כאחד האדם
    kjvRefs:
    - Judges 16:7
    kjvOsis:
    - Judg.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.8
    scripture: tanakh
    name: Tanakh Judges 16:8
    ref: Judges 16:8
    book: Judg
    section: neviim
    chapter: 16
    verse: 8
    ordinal: 6952
    text: Then the lords of the Philistines brought up to her seven fresh bowstrings which had not been dried, and she bound him with them.
    translation: JPS 1917
    original: וַיַּעֲלוּ־לָהּ סַרְנֵי פְלִשְׁתִּים שִׁבְעָה יְתָרִים לַחִים אֲשֶׁר לֹא־חֹרָבוּ וַתַּאַסְרֵהוּ בָּהֶם׃
    hebrewPlain: ויעלו לה סרני פלשתים שבעה יתרים לחים אשר לא חרבו ותאסרהו בהם
    kjvRefs:
    - Judges 16:8
    kjvOsis:
    - Judg.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.9
    scripture: tanakh
    name: Tanakh Judges 16:9
    ref: Judges 16:9
    book: Judg
    section: neviim
    chapter: 16
    verse: 9
    ordinal: 6953
    text: 'Now she had liers-in-wait abiding in the inner chamber. And she said unto him: ‘The Philistines are upon thee, Samson.’ And he broke the bowstrings as a string of tow is broken when it toucheth the fire. So his strength was not known.'
    translation: JPS 1917
    original: וְהָאֹרֵב יֹשֵׁב לָהּ בַּחֶדֶר וַתֹּאמֶר אֵלָיו פְּלִשְׁתִּים עָלֶיךָ שִׁמְשׁוֹן וַיְנַתֵּק אֶת־הַיְתָרִים כַּאֲשֶׁר יִנָּתֵק פְּתִיל־הַנְּעֹרֶת בַּהֲרִיחוֹ אֵשׁ וְלֹא נוֹדַע כֹּחוֹ׃
    hebrewPlain: והארב ישב לה בחדר ותאמר אליו פלשתים עליך שמשון וינתק את היתרים כאשר ינתק פתיל הנערת בהריחו אש ולא נודע כחו
    kjvRefs:
    - Judges 16:9
    kjvOsis:
    - Judg.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.10
    scripture: tanakh
    name: Tanakh Judges 16:10
    ref: Judges 16:10
    book: Judg
    section: neviim
    chapter: 16
    verse: 10
    ordinal: 6954
    text: 'And Delilah said unto Samson: ‘Behold, thou hast mocked me, and told me lies; now tell me, I pray thee, wherewith thou mightest be bound.’'
    translation: JPS 1917
    original: וַתֹּאמֶר דְּלִילָה אֶל־שִׁמְשׁוֹן הִנֵּה הֵתַלְתָּ בִּי וַתְּדַבֵּר אֵלַי כְּזָבִים עַתָּה הַגִּידָה־נָּא לִי בַּמֶּה תֵּאָסֵר׃
    hebrewPlain: ותאמר דלילה אל שמשון הנה התלת בי ותדבר אלי כזבים עתה הגידה נא לי במה תאסר
    kjvRefs:
    - Judges 16:10
    kjvOsis:
    - Judg.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.11
    scripture: tanakh
    name: Tanakh Judges 16:11
    ref: Judges 16:11
    book: Judg
    section: neviim
    chapter: 16
    verse: 11
    ordinal: 6955
    text: 'And he said unto her: ‘If they only bind me with new ropes wherewith no work, hath been done, then shall I become weak, and be as any other man.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ אִם־אָסוֹר יַאַסְרוּנִי בַּעֲבֹתִים חֲדָשִׁים אֲשֶׁר לֹא־נַעֲשָׂה בָהֶם מְלָאכָה וְחָלִיתִי וְהָיִיתִי כְּאַחַד הָאָדָם׃
    hebrewPlain: ויאמר אליה אם אסור יאסרוני בעבתים חדשים אשר לא נעשה בהם מלאכה וחליתי והייתי כאחד האדם
    kjvRefs:
    - Judges 16:11
    kjvOsis:
    - Judg.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.12
    scripture: tanakh
    name: Tanakh Judges 16:12
    ref: Judges 16:12
    book: Judg
    section: neviim
    chapter: 16
    verse: 12
    ordinal: 6956
    text: 'So Delilah took new ropes, and bound him therewith, and said unto him: ‘The Philistines are upon thee, Samson.’ And the liers-in-wait were abiding in the inner chamber. And he broke them from off his arms like a thread.'
    translation: JPS 1917
    original: וַתִּקַּח דְּלִילָה עֲבֹתִים חֲדָשִׁים וַתַּאַסְרֵהוּ בָהֶם וַתֹּאמֶר אֵלָיו פְּלִשְׁתִּים עָלֶיךָ שִׁמְשׁוֹן וְהָאֹרֵב יֹשֵׁב בֶּחָדֶר וַיְנַתְּקֵם מֵעַל זְרֹעֹתָיו כַּחוּט׃
    hebrewPlain: ותקח דלילה עבתים חדשים ותאסרהו בהם ותאמר אליו פלשתים עליך שמשון והארב ישב בחדר וינתקם מעל זרעתיו כחוט
    kjvRefs:
    - Judges 16:12
    kjvOsis:
    - Judg.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.13
    scripture: tanakh
    name: Tanakh Judges 16:13
    ref: Judges 16:13
    book: Judg
    section: neviim
    chapter: 16
    verse: 13
    ordinal: 6957
    text: 'And Delilah said unto Samson: ‘Hitherto thou hast mocked me, and told me lies; tell me wherewith thou mightest be bound.’ And he said unto her: ‘If thou weavest the seven locks of my head with the web.’'
    translation: JPS 1917
    original: וַתֹּאמֶר דְּלִילָה אֶל־שִׁמְשׁוֹן עַד־הֵנָּה הֵתַלְתָּ בִּי וַתְּדַבֵּר אֵלַי כְּזָבִים הַגִּידָה לִּי בַּמֶּה תֵּאָסֵר וַיֹּאמֶר אֵלֶיהָ אִם־תַּאַרְגִי אֶת־שֶׁבַע מַחְלְפוֹת רֹאשִׁי עִם־הַמַּסָּכֶת׃
    hebrewPlain: ותאמר דלילה אל שמשון עד הנה התלת בי ותדבר אלי כזבים הגידה לי במה תאסר ויאמר אליה אם תארגי את שבע מחלפות ראשי עם המסכת
    kjvRefs:
    - Judges 16:13
    kjvOsis:
    - Judg.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.14
    scripture: tanakh
    name: Tanakh Judges 16:14
    ref: Judges 16:14
    book: Judg
    section: neviim
    chapter: 16
    verse: 14
    ordinal: 6958
    text: 'And she fastened it with the pin, and said unto him: ‘The Philistines are upon thee, Samson.’ And he awoke out of his sleep, and plucked away the pin of the beam, and the web.'
    translation: JPS 1917
    original: וַתִּתְקַע בַּיָּתֵד וַתֹּאמֶר אֵלָיו פְּלִשְׁתִּים עָלֶיךָ שִׁמְשׁוֹן וַיִּיקַץ מִשְּׁנָתוֹ וַיִּסַּע אֶת־הַיְתַד הָאֶרֶג וְאֶת־הַמַּסָּכֶת׃
    hebrewPlain: ותתקע ביתד ותאמר אליו פלשתים עליך שמשון וייקץ משנתו ויסע את היתד הארג ואת המסכת
    kjvRefs:
    - Judges 16:14
    kjvOsis:
    - Judg.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.15
    scripture: tanakh
    name: Tanakh Judges 16:15
    ref: Judges 16:15
    book: Judg
    section: neviim
    chapter: 16
    verse: 15
    ordinal: 6959
    text: 'And she said unto him: ‘How canst thou say: I love thee, when thy heart is not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength lieth.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֵלָיו אֵיךְ תֹּאמַר אֲהַבְתִּיךְ וְלִבְּךָ אֵין אִתִּי זֶה שָׁלֹשׁ פְּעָמִים הֵתַלְתָּ בִּי וְלֹא־הִגַּדְתָּ לִּי בַּמֶּה כֹּחֲךָ גָדוֹל׃
    hebrewPlain: ותאמר אליו איך תאמר אהבתיך ולבך אין אתי זה שלש פעמים התלת בי ולא הגדת לי במה כחך גדול
    kjvRefs:
    - Judges 16:15
    kjvOsis:
    - Judg.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.16
    scripture: tanakh
    name: Tanakh Judges 16:16
    ref: Judges 16:16
    book: Judg
    section: neviim
    chapter: 16
    verse: 16
    ordinal: 6960
    text: And it came to pass, when she pressed him daily with her words, and urged him, that his soul was vexed unto death.
    translation: JPS 1917
    original: וַיְהִי כִּי־הֵצִיקָה לּוֹ בִדְבָרֶיהָ כָּל־הַיָּמִים וַתְּאַלֲצֵהוּ וַתִּקְצַר נַפְשׁוֹ לָמוּת׃
    hebrewPlain: ויהי כי הציקה לו בדבריה כל הימים ותאלצהו ותקצר נפשו למות
    kjvRefs:
    - Judges 16:16
    kjvOsis:
    - Judg.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.17
    scripture: tanakh
    name: Tanakh Judges 16:17
    ref: Judges 16:17
    book: Judg
    section: neviim
    chapter: 16
    verse: 17
    ordinal: 6961
    text: 'And he told her all his heart, and said unto her: ‘There hath not come a razor upon my head; for I have been a Nazirite unto God from my mother’s womb; if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man.’'
    translation: JPS 1917
    original: וַיַּגֶּד־לָהּ אֶת־כָּל־לִבּוֹ וַיֹּאמֶר לָהּ מוֹרָה לֹא־עָלָה עַל־רֹאשִׁי כִּי־נְזִיר אֱלֹהִים אֲנִי מִבֶּטֶן אִמִּי אִם־גֻּלַּחְתִּי וְסָר מִמֶּנִּי כֹחִי וְחָלִיתִי וְהָיִיתִי כְּכָל־הָאָדָם׃
    hebrewPlain: ויגד לה את כל לבו ויאמר לה מורה לא עלה על ראשי כי נזיר אלהים אני מבטן אמי אם גלחתי וסר ממני כחי וחליתי והייתי ככל האדם
    kjvRefs:
    - Judges 16:17
    kjvOsis:
    - Judg.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.18
    scripture: tanakh
    name: Tanakh Judges 16:18
    ref: Judges 16:18
    book: Judg
    section: neviim
    chapter: 16
    verse: 18
    ordinal: 6962
    text: 'And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying: ‘Come up this once, for he hath told me all his heart.’ Then the lords of the Philistines came up unto her, and brought the money in their hand.'
    translation: JPS 1917
    original: וַתֵּרֶא דְלִילָה כִּי־הִגִּיד לָהּ אֶת־כָּל־לִבּוֹ וַתִּשְׁלַח וַתִּקְרָא לְסַרְנֵי פְלִשְׁתִּים לֵאמֹר עֲלוּ הַפַּעַם כִּי־הִגִּיד לה [לִי] אֶת־כָּל־לִבּוֹ וְעָלוּ אֵלֶיהָ סַרְנֵי פְלִשְׁתִּים וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם׃
    hebrewPlain: ותרא דלילה כי הגיד לה את כל לבו ותשלח ותקרא לסרני פלשתים לאמר עלו הפעם כי הגיד לה [לי] את כל לבו ועלו אליה סרני פלשתים ויעלו הכסף בידם
    kjvRefs:
    - Judges 16:18
    kjvOsis:
    - Judg.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.19
    scripture: tanakh
    name: Tanakh Judges 16:19
    ref: Judges 16:19
    book: Judg
    section: neviim
    chapter: 16
    verse: 19
    ordinal: 6963
    text: And she made him sleep upon her knees; and she called for a man, and had the seven locks of his head shaven off; and she began to afflict him, and his strength went from him.
    translation: JPS 1917
    original: וַתְּיַשְּׁנֵהוּ עַל־בִּרְכֶּיהָ וַתִּקְרָא לָאִישׁ וַתְּגַלַּח אֶת־שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ וַתָּחֶל לְעַנּוֹתוֹ וַיָּסַר כֹּחוֹ מֵעָלָיו׃
    hebrewPlain: ותישנהו על ברכיה ותקרא לאיש ותגלח את שבע מחלפות ראשו ותחל לענותו ויסר כחו מעליו
    kjvRefs:
    - Judges 16:19
    kjvOsis:
    - Judg.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.20
    scripture: tanakh
    name: Tanakh Judges 16:20
    ref: Judges 16:20
    book: Judg
    section: neviim
    chapter: 16
    verse: 20
    ordinal: 6964
    text: 'And she said: ‘The Philistines are upon thee, Samson.’ And he awoke out of his sleep, and said: ‘I will go out as at other times, and shake myself.’ But he knew not that the LORD was departed from him.'
    translation: JPS 1917
    original: וַתֹּאמֶר פְּלִשְׁתִּים עָלֶיךָ שִׁמְשׁוֹן וַיִּקַץ מִשְּׁנָתוֹ וַיֹּאמֶר אֵצֵא כְּפַעַם בְּפַעַם וְאִנָּעֵר וְהוּא לֹא יָדַע כִּי יְהוָה סָר מֵעָלָיו׃
    hebrewPlain: ותאמר פלשתים עליך שמשון ויקץ משנתו ויאמר אצא כפעם בפעם ואנער והוא לא ידע כי יהוה סר מעליו
    kjvRefs:
    - Judges 16:20
    kjvOsis:
    - Judg.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.21
    scripture: tanakh
    name: Tanakh Judges 16:21
    ref: Judges 16:21
    book: Judg
    section: neviim
    chapter: 16
    verse: 21
    ordinal: 6965
    text: And the Philistines laid hold on him, and put out his eyes; and they brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison-house.
    translation: JPS 1917
    original: וַיֹּאחֲזוּהוּ פְלִשְׁתִּים וַיְנַקְּרוּ אֶת־עֵינָיו וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם וַיְהִי טוֹחֵן בְּבֵית האסירים [הָאֲסוּרִים׃]
    hebrewPlain: ויאחזוהו פלשתים וינקרו את עיניו ויורידו אותו עזתה ויאסרוהו בנחשתים ויהי טוחן בבית האסירים [האסורים]
    kjvRefs:
    - Judges 16:21
    kjvOsis:
    - Judg.16.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.22
    scripture: tanakh
    name: Tanakh Judges 16:22
    ref: Judges 16:22
    book: Judg
    section: neviim
    chapter: 16
    verse: 22
    ordinal: 6966
    text: Howbeit the hair of his head began to grow again after he was shaven.
    translation: JPS 1917
    original: וַיָּחֶל שְׂעַר־רֹאשׁוֹ לְצַמֵּחַ כַּאֲשֶׁר גֻּלָּח׃
    hebrewPlain: ויחל שער ראשו לצמח כאשר גלח
    kjvRefs:
    - Judges 16:22
    kjvOsis:
    - Judg.16.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.23
    scripture: tanakh
    name: Tanakh Judges 16:23
    ref: Judges 16:23
    book: Judg
    section: neviim
    chapter: 16
    verse: 23
    ordinal: 6967
    text: 'And the lords of the Philistines gathered them together to offer a great sacrifice unto Dagon their god, and to rejoice; for they said: ‘Our god hath delivered Samson our enemy into our hand.’'
    translation: JPS 1917
    original: וְסַרְנֵי פְלִשְׁתִּים נֶאֱסְפוּ לִזְבֹּחַ זֶבַח־גָּדוֹל לְדָגוֹן אֱלֹהֵיהֶם וּלְשִׂמְחָה וַיֹּאמְרוּ נָתַן אֱלֹהֵינוּ בְּיָדֵנוּ אֵת שִׁמְשׁוֹן אוֹיְבֵינוּ׃
    hebrewPlain: וסרני פלשתים נאספו לזבח זבח גדול לדגון אלהיהם ולשמחה ויאמרו נתן אלהינו בידנו את שמשון אויבינו
    kjvRefs:
    - Judges 16:23
    kjvOsis:
    - Judg.16.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.24
    scripture: tanakh
    name: Tanakh Judges 16:24
    ref: Judges 16:24
    book: Judg
    section: neviim
    chapter: 16
    verse: 24
    ordinal: 6968
    text: 'And when the people saw him, they praised their god; for they said: ‘Our god hath delivered into our hand our enemy, and the destroyer of our country, who hath slain many of us.’'
    translation: JPS 1917
    original: וַיִּרְאוּ אֹתוֹ הָעָם וַיְהַלְלוּ אֶת־אֱלֹהֵיהֶם כִּי אָמְרוּ נָתַן אֱלֹהֵינוּ בְיָדֵנוּ אֶת־אוֹיְבֵנוּ וְאֵת מַחֲרִיב אַרְצֵנוּ וַאֲשֶׁר הִרְבָּה אֶת־חֲלָלֵינוּ׃
    hebrewPlain: ויראו אתו העם ויהללו את אלהיהם כי אמרו נתן אלהינו בידנו את אויבנו ואת מחריב ארצנו ואשר הרבה את חללינו
    kjvRefs:
    - Judges 16:24
    kjvOsis:
    - Judg.16.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.25
    scripture: tanakh
    name: Tanakh Judges 16:25
    ref: Judges 16:25
    book: Judg
    section: neviim
    chapter: 16
    verse: 25
    ordinal: 6969
    text: 'And it came to pass, when their hearts were merry, that they said: ‘Call for Samson, that he may make us sport.’ And they called for Samson out of the prison-house; and he made sport before them; and they set him between the pillars.'
    translation: JPS 1917
    original: וַיְהִי כי טוב [כְּטוֹב] לִבָּם וַיֹּאמְרוּ קִרְאוּ לְשִׁמְשׁוֹן וִישַׂחֶק־לָנוּ וַיִּקְרְאוּ לְשִׁמְשׁוֹן מִבֵּית האסירים [הָאֲסוּרִים] וַיְצַחֵק לִפְנֵיהֶם וַיַּעֲמִידוּ אוֹתוֹ בֵּין הָעַמּוּדִים׃
    hebrewPlain: ויהי כי טוב [כטוב] לבם ויאמרו קראו לשמשון וישחק לנו ויקראו לשמשון מבית האסירים [האסורים] ויצחק לפניהם ויעמידו אותו בין העמודים
    kjvRefs:
    - Judges 16:25
    kjvOsis:
    - Judg.16.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.26
    scripture: tanakh
    name: Tanakh Judges 16:26
    ref: Judges 16:26
    book: Judg
    section: neviim
    chapter: 16
    verse: 26
    ordinal: 6970
    text: 'And Samson said unto the lad that held him by the hand: ‘Suffer me that I may feel the pillars whereupon the house resteth, that I may lean upon them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שִׁמְשׁוֹן אֶל־הַנַּעַר הַמַּחֲזִיק בְּיָדוֹ הַנִּיחָה אוֹתִי והימשני [וַהֲמִשֵׁנִי] אֶת־הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם וְאֶשָּׁעֵן עֲלֵיהֶם׃
    hebrewPlain: ויאמר שמשון אל הנער המחזיק בידו הניחה אותי והימשני [והמשני] את העמדים אשר הבית נכון עליהם ואשען עליהם
    kjvRefs:
    - Judges 16:26
    kjvOsis:
    - Judg.16.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.27
    scripture: tanakh
    name: Tanakh Judges 16:27
    ref: Judges 16:27
    book: Judg
    section: neviim
    chapter: 16
    verse: 27
    ordinal: 6971
    text: Now the house was full of men and women; and all the lords of the Philistines were there; and there were upon the roof about three thousand men and women, that beheld while Samson made sport.
    translation: JPS 1917
    original: וְהַבַּיִת מָלֵא הָאֲנָשִׁים וְהַנָּשִׁים וְשָׁמָּה כֹּל סַרְנֵי פְלִשְׁתִּים וְעַל־הַגָּג כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ וְאִשָּׁה הָרֹאִים בִּשְׂחוֹק שִׁמְשׁוֹן׃
    hebrewPlain: והבית מלא האנשים והנשים ושמה כל סרני פלשתים ועל הגג כשלשת אלפים איש ואשה הראים בשחוק שמשון
    kjvRefs:
    - Judges 16:27
    kjvOsis:
    - Judg.16.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.28
    scripture: tanakh
    name: Tanakh Judges 16:28
    ref: Judges 16:28
    book: Judg
    section: neviim
    chapter: 16
    verse: 28
    ordinal: 6972
    text: 'And Samson called unto the LORD, and said: ‘O Lord GOD, remember me, I pray Thee, and strengthen me, I pray Thee, only this once, O God, that I may be this once avenged of the Philistines for my two eyes.’'
    translation: JPS 1917
    original: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה וַיֹּאמַר אֲדֹנָי יֱהֹוִה זָכְרֵנִי נָא וְחַזְּקֵנִי נָא אַךְ הַפַּעַם הַזֶּה הָאֱלֹהִים וְאִנָּקְמָה נְקַם־אַחַת מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים׃
    hebrewPlain: ויקרא שמשון אל יהוה ויאמר אדני יהוה זכרני נא וחזקני נא אך הפעם הזה האלהים ואנקמה נקם אחת משתי עיני מפלשתים
    kjvRefs:
    - Judges 16:28
    kjvOsis:
    - Judg.16.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.29
    scripture: tanakh
    name: Tanakh Judges 16:29
    ref: Judges 16:29
    book: Judg
    section: neviim
    chapter: 16
    verse: 29
    ordinal: 6973
    text: And Samson took fast hold of the two middle pillars upon which the house rested, and leaned upon them, the one with his right hand, and the other with his left.
    translation: JPS 1917
    original: וַיִּלְפֹּת שִׁמְשׁוֹן אֶת־שְׁנֵי עַמּוּדֵי הַתָּוֶךְ אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם וַיִּסָּמֵךְ עֲלֵיהֶם אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ׃
    hebrewPlain: וילפת שמשון את שני עמודי התוך אשר הבית נכון עליהם ויסמך עליהם אחד בימינו ואחד בשמאלו
    kjvRefs:
    - Judges 16:29
    kjvOsis:
    - Judg.16.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.30
    scripture: tanakh
    name: Tanakh Judges 16:30
    ref: Judges 16:30
    book: Judg
    section: neviim
    chapter: 16
    verse: 30
    ordinal: 6974
    text: 'And Samson said: ‘Let me die with the Philistines.’ And he bent with all his might; and the house fell upon the lords, and upon all the people that were therein. So the dead that he slew at his death were more than they that he slew in his life.'
    translation: JPS 1917
    original: וַיֹּאמֶר שִׁמְשׁוֹן תָּמוֹת נַפְשִׁי עִם־פְּלִשְׁתִּים וַיֵּט בְּכֹחַ וַיִּפֹּל הַבַּיִת עַל־הַסְּרָנִים וְעַל־כָּל־הָעָם אֲשֶׁר־בּוֹ וַיִּהְיוּ הַמֵּתִים אֲשֶׁר הֵמִית בְּמוֹתוֹ רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו׃
    hebrewPlain: ויאמר שמשון תמות נפשי עם פלשתים ויט בכח ויפל הבית על הסרנים ועל כל העם אשר בו ויהיו המתים אשר המית במותו רבים מאשר המית בחייו
    kjvRefs:
    - Judges 16:30
    kjvOsis:
    - Judg.16.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.16.31
    scripture: tanakh
    name: Tanakh Judges 16:31
    ref: Judges 16:31
    book: Judg
    section: neviim
    chapter: 16
    verse: 31
    ordinal: 6975
    text: Then his brethren and all the house of his father came down, and took him, and brought him up, and buried him between Zorah and Eshtaol in the burying-place of Manoah his father. And he judged Israel twenty years.
    translation: JPS 1917
    original: וַיֵּרְדוּ אֶחָיו וְכָל־בֵּית אָבִיהוּ וַיִּשְׂאוּ אֹתוֹ וַיַּעֲלוּ וַיִּקְבְּרוּ אוֹתוֹ בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל בְּקֶבֶר מָנוֹחַ אָבִיו וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל עֶשְׂרִים שָׁנָה׃
    hebrewPlain: וירדו אחיו וכל בית אביהו וישאו אתו ויעלו ויקברו אותו בין צרעה ובין אשתאל בקבר מנוח אביו והוא שפט את ישראל עשרים שנה
    kjvRefs:
    - Judges 16:31
    kjvOsis:
    - Judg.16.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.16
- type: TanakhVerse
  data:
    osis: Judg.17.1
    scripture: tanakh
    name: Tanakh Judges 17:1
    ref: Judges 17:1
    book: Judg
    section: neviim
    chapter: 17
    verse: 1
    ordinal: 6976
    text: Now there was a man of the hill-country of Ephraim, whose name was Micah.
    translation: JPS 1917
    original: וַיְהִי־אִישׁ מֵהַר־אֶפְרָיִם וּשְׁמוֹ מִיכָיְהוּ׃
    hebrewPlain: ויהי איש מהר אפרים ושמו מיכיהו
    kjvRefs:
    - Judges 17:1
    kjvOsis:
    - Judg.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.2
    scripture: tanakh
    name: Tanakh Judges 17:2
    ref: Judges 17:2
    book: Judg
    section: neviim
    chapter: 17
    verse: 2
    ordinal: 6977
    text: 'And he said unto his mother: ‘The eleven hundred pieces of silver that were taken from thee, about which thou didst utter a curse, and didst also speak it in mine ears, behold, the silver is with me; I took it.’ And his mother said: ‘Blessed be my son of the LORD.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לְאִמּוֹ אֶלֶף וּמֵאָה הַכֶּסֶף אֲשֶׁר לֻקַּח־לָךְ ואתי [וְאַתְּ] אָלִית וְגַם אָמַרְתְּ בְּאָזְנַי הִנֵּה־הַכֶּסֶף אִתִּי אֲנִי לְקַחְתִּיו וַתֹּאמֶר אִמּוֹ בָּרוּךְ בְּנִי לַיהוָה׃
    hebrewPlain: ויאמר לאמו אלף ומאה הכסף אשר לקח לך ואתי [ואת] אלית וגם אמרת באזני הנה הכסף אתי אני לקחתיו ותאמר אמו ברוך בני ליהוה
    kjvRefs:
    - Judges 17:2
    kjvOsis:
    - Judg.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.3
    scripture: tanakh
    name: Tanakh Judges 17:3
    ref: Judges 17:3
    book: Judg
    section: neviim
    chapter: 17
    verse: 3
    ordinal: 6978
    text: 'And he restored the eleven hundred pieces of silver to his mother, and his mother said: ‘I verily dedicate the silver unto the LORD from my hand for my son, to make a graven image and a molten image; now therefore I will restore it unto thee.’'
    translation: JPS 1917
    original: וַיָּשֶׁב אֶת־אֶלֶף־וּמֵאָה הַכֶּסֶף לְאִמּוֹ וַתֹּאמֶר אִמּוֹ הַקְדֵּשׁ הִקְדַּשְׁתִּי אֶת־הַכֶּסֶף לַיהוָה מִיָּדִי לִבְנִי לַעֲשׂוֹת פֶּסֶל וּמַסֵּכָה וְעַתָּה אֲשִׁיבֶנּוּ לָךְ׃
    hebrewPlain: וישב את אלף ומאה הכסף לאמו ותאמר אמו הקדש הקדשתי את הכסף ליהוה מידי לבני לעשות פסל ומסכה ועתה אשיבנו לך
    kjvRefs:
    - Judges 17:3
    kjvOsis:
    - Judg.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.4
    scripture: tanakh
    name: Tanakh Judges 17:4
    ref: Judges 17:4
    book: Judg
    section: neviim
    chapter: 17
    verse: 4
    ordinal: 6979
    text: And when he restored the money unto his mother, his mother took two hundred pieces of silver, and gave them to the founder, who made thereof a graven image and a molten image; and it was in the house of Micah.
    translation: JPS 1917
    original: וַיָּשֶׁב אֶת־הַכֶּסֶף לְאִמּוֹ וַתִּקַּח אִמּוֹ מָאתַיִם כֶּסֶף וַתִּתְּנֵהוּ לַצּוֹרֵף וַיַּעֲשֵׂהוּ פֶּסֶל וּמַסֵּכָה וַיְהִי בְּבֵית מִיכָיְהוּ׃
    hebrewPlain: וישב את הכסף לאמו ותקח אמו מאתים כסף ותתנהו לצורף ויעשהו פסל ומסכה ויהי בבית מיכיהו
    kjvRefs:
    - Judges 17:4
    kjvOsis:
    - Judg.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.5
    scripture: tanakh
    name: Tanakh Judges 17:5
    ref: Judges 17:5
    book: Judg
    section: neviim
    chapter: 17
    verse: 5
    ordinal: 6980
    text: And the man Micah had a house of God, and he made an ephod, and teraphim, and consecrated one of his sons, who became his priest.
    translation: JPS 1917
    original: וְהָאִישׁ מִיכָה לוֹ בֵּית אֱלֹהִים וַיַּעַשׂ אֵפוֹד וּתְרָפִים וַיְמַלֵּא אֶת־יַד אַחַד מִבָּנָיו וַיְהִי־לוֹ לְכֹהֵן׃
    hebrewPlain: והאיש מיכה לו בית אלהים ויעש אפוד ותרפים וימלא את יד אחד מבניו ויהי לו לכהן
    kjvRefs:
    - Judges 17:5
    kjvOsis:
    - Judg.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.6
    scripture: tanakh
    name: Tanakh Judges 17:6
    ref: Judges 17:6
    book: Judg
    section: neviim
    chapter: 17
    verse: 6
    ordinal: 6981
    text: In those days there was no king in Israel; every man did that which was right in his own eyes.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם אֵין מֶלֶךְ בְּיִשְׂרָאֵל אִישׁ הַיָּשָׁר בְּעֵינָיו יַעֲשֶׂה׃
    hebrewPlain: בימים ההם אין מלך בישראל איש הישר בעיניו יעשה
    kjvRefs:
    - Judges 17:6
    kjvOsis:
    - Judg.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.7
    scripture: tanakh
    name: Tanakh Judges 17:7
    ref: Judges 17:7
    book: Judg
    section: neviim
    chapter: 17
    verse: 7
    ordinal: 6982
    text: And there was a young man out of Beth-lehem in Judah—in the family of Judah—who was a Levite, and he sojourned there.
    translation: JPS 1917
    original: וַיְהִי־נַעַר מִבֵּית לֶחֶם יְהוּדָה מִמִּשְׁפַּחַת יְהוּדָה וְהוּא לֵוִי וְהוּא גָר־שָׁם׃
    hebrewPlain: ויהי נער מבית לחם יהודה ממשפחת יהודה והוא לוי והוא גר שם
    kjvRefs:
    - Judges 17:7
    kjvOsis:
    - Judg.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.8
    scripture: tanakh
    name: Tanakh Judges 17:8
    ref: Judges 17:8
    book: Judg
    section: neviim
    chapter: 17
    verse: 8
    ordinal: 6983
    text: And the man departed out of the city, out of Beth-lehem in Judah, to sojourn where he could find a place; and he came to the hill-country of Ephraim to the house of Micah, as he journeyed.
    translation: JPS 1917
    original: וַיֵּלֶךְ הָאִישׁ מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה לָגוּר בַּאֲשֶׁר יִמְצָא וַיָּבֹא הַר־אֶפְרַיִם עַד־בֵּית מִיכָה לַעֲשׂוֹת דַּרְכּוֹ׃
    hebrewPlain: וילך האיש מהעיר מבית לחם יהודה לגור באשר ימצא ויבא הר אפרים עד בית מיכה לעשות דרכו
    kjvRefs:
    - Judges 17:8
    kjvOsis:
    - Judg.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.9
    scripture: tanakh
    name: Tanakh Judges 17:9
    ref: Judges 17:9
    book: Judg
    section: neviim
    chapter: 17
    verse: 9
    ordinal: 6984
    text: 'And Micah said unto him: ‘Whence comest thou?’ And he said unto him: ‘I am a Levite of Beth-lehem in Judah, and I go to sojourn where I may find a place.’'
    translation: JPS 1917
    original: וַיֹּאמֶר־לוֹ מִיכָה מֵאַיִן תָּבוֹא וַיֹּאמֶר אֵלָיו לֵוִי אָנֹכִי מִבֵּית לֶחֶם יְהוּדָה וְאָנֹכִי הֹלֵךְ לָגוּר בַּאֲשֶׁר אֶמְצָא׃
    hebrewPlain: ויאמר לו מיכה מאין תבוא ויאמר אליו לוי אנכי מבית לחם יהודה ואנכי הלך לגור באשר אמצא
    kjvRefs:
    - Judges 17:9
    kjvOsis:
    - Judg.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.10
    scripture: tanakh
    name: Tanakh Judges 17:10
    ref: Judges 17:10
    book: Judg
    section: neviim
    chapter: 17
    verse: 10
    ordinal: 6985
    text: 'And Micah said unto him: ‘Dwell with me, and be unto me a father and a priest, and I will give thee ten pieces of silver by the year, and a suit of apparel, and thy victuals.’ So the Levite went in.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ מִיכָה שְׁבָה עִמָּדִי וֶהְיֵה־לִי לְאָב וּלְכֹהֵן וְאָנֹכִי אֶתֶּן־לְךָ עֲשֶׂרֶת כֶּסֶף לַיָּמִים וְעֵרֶךְ בְּגָדִים וּמִחְיָתֶךָ וַיֵּלֶךְ הַלֵּוִי׃
    hebrewPlain: ויאמר לו מיכה שבה עמדי והיה לי לאב ולכהן ואנכי אתן לך עשרת כסף לימים וערך בגדים ומחיתך וילך הלוי
    kjvRefs:
    - Judges 17:10
    kjvOsis:
    - Judg.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.11
    scripture: tanakh
    name: Tanakh Judges 17:11
    ref: Judges 17:11
    book: Judg
    section: neviim
    chapter: 17
    verse: 11
    ordinal: 6986
    text: And the Levite was content to dwell with the man; and the young man was unto him as one of his sons.
    translation: JPS 1917
    original: וַיּוֹאֶל הַלֵּוִי לָשֶׁבֶת אֶת־הָאִישׁ וַיְהִי הַנַּעַר לוֹ כְּאַחַד מִבָּנָיו׃
    hebrewPlain: ויואל הלוי לשבת את האיש ויהי הנער לו כאחד מבניו
    kjvRefs:
    - Judges 17:11
    kjvOsis:
    - Judg.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.12
    scripture: tanakh
    name: Tanakh Judges 17:12
    ref: Judges 17:12
    book: Judg
    section: neviim
    chapter: 17
    verse: 12
    ordinal: 6987
    text: And Micah consecrated the Levite, and the young man became his priest, and was in the house of Micah.
    translation: JPS 1917
    original: וַיְמַלֵּא מִיכָה אֶת־יַד הַלֵּוִי וַיְהִי־לוֹ הַנַּעַר לְכֹהֵן וַיְהִי בְּבֵית מִיכָה׃
    hebrewPlain: וימלא מיכה את יד הלוי ויהי לו הנער לכהן ויהי בבית מיכה
    kjvRefs:
    - Judges 17:12
    kjvOsis:
    - Judg.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.17.13
    scripture: tanakh
    name: Tanakh Judges 17:13
    ref: Judges 17:13
    book: Judg
    section: neviim
    chapter: 17
    verse: 13
    ordinal: 6988
    text: 'Then said Micah: ‘Now know I that the LORD will do me good, seeing I have a Levite as my priest.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מִיכָה עַתָּה יָדַעְתִּי כִּי־יֵיטִיב יְהוָה לִי כִּי הָיָה־לִי הַלֵּוִי לְכֹהֵן׃
    hebrewPlain: ויאמר מיכה עתה ידעתי כי ייטיב יהוה לי כי היה לי הלוי לכהן
    kjvRefs:
    - Judges 17:13
    kjvOsis:
    - Judg.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.17
- type: TanakhVerse
  data:
    osis: Judg.18.1
    scripture: tanakh
    name: Tanakh Judges 18:1
    ref: Judges 18:1
    book: Judg
    section: neviim
    chapter: 18
    verse: 1
    ordinal: 6989
    text: In those days there was no king in Israel; and in those days the tribe of the Danites sought them an inheritance to dwell in; for unto that day there had nothing been allotted unto them among the tribes of Israel for an inheritance.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם אֵין מֶלֶךְ בְּיִשְׂרָאֵל וּבַיָּמִים הָהֵם שֵׁבֶט הַדָּנִי מְבַקֶּשׁ־לוֹ נַחֲלָה לָשֶׁבֶת כִּי לֹא־נָפְלָה לּוֹ עַד־הַיּוֹם הַהוּא בְּתוֹךְ־שִׁבְטֵי יִשְׂרָאֵל בְּנַחֲלָה׃
    hebrewPlain: בימים ההם אין מלך בישראל ובימים ההם שבט הדני מבקש לו נחלה לשבת כי לא נפלה לו עד היום ההוא בתוך שבטי ישראל בנחלה
    kjvRefs:
    - Judges 18:1
    kjvOsis:
    - Judg.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.2
    scripture: tanakh
    name: Tanakh Judges 18:2
    ref: Judges 18:2
    book: Judg
    section: neviim
    chapter: 18
    verse: 2
    ordinal: 6990
    text: 'And the children of Dan sent of their family five men from their whole number, men of valour, from Zorah, and from Eshtaol, to spy out the land, and to search it; and they said unto them: ‘Go, search the land’; and they came to the hill-country of Ephraim, unto the house of Micah, and lodged there.'
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ בְנֵי־דָן מִמִּשְׁפַּחְתָּם חֲמִשָּׁה אֲנָשִׁים מִקְצוֹתָם אֲנָשִׁים בְּנֵי־חַיִל מִצָּרְעָה וּמֵאֶשְׁתָּאֹל לְרַגֵּל אֶת־הָאָרֶץ וּלְחָקְרָהּ וַיֹּאמְרוּ אֲלֵהֶם לְכוּ חִקְרוּ אֶת־הָאָרֶץ וַיָּבֹאוּ הַר־אֶפְרַיִם עַד־בֵּית מִיכָה וַיָּלִינוּ שָׁם׃
    hebrewPlain: וישלחו בני דן ממשפחתם חמשה אנשים מקצותם אנשים בני חיל מצרעה ומאשתאל לרגל את הארץ ולחקרה ויאמרו אלהם לכו חקרו את הארץ ויבאו הר אפרים עד בית מיכה וילינו שם
    kjvRefs:
    - Judges 18:2
    kjvOsis:
    - Judg.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.3
    scripture: tanakh
    name: Tanakh Judges 18:3
    ref: Judges 18:3
    book: Judg
    section: neviim
    chapter: 18
    verse: 3
    ordinal: 6991
    text: 'When they were by the house of Micah, they knew the voice of the young man the Levite; and they turned aside thither, and said unto him: ‘Who brought thee hither? and what doest thou in this place? and what hast thou here?’'
    translation: JPS 1917
    original: הֵמָּה עִם־בֵּית מִיכָה וְהֵמָּה הִכִּירוּ אֶת־קוֹל הַנַּעַר הַלֵּוִי וַיָּסוּרוּ שָׁם וַיֹּאמְרוּ לוֹ מִי־הֱבִיאֲךָ הֲלֹם וּמָה־אַתָּה עֹשֶׂה בָּזֶה וּמַה־לְּךָ פֹה׃
    hebrewPlain: המה עם בית מיכה והמה הכירו את קול הנער הלוי ויסורו שם ויאמרו לו מי הביאך הלם ומה אתה עשה בזה ומה לך פה
    kjvRefs:
    - Judges 18:3
    kjvOsis:
    - Judg.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.4
    scripture: tanakh
    name: Tanakh Judges 18:4
    ref: Judges 18:4
    book: Judg
    section: neviim
    chapter: 18
    verse: 4
    ordinal: 6992
    text: 'And he said unto them: ‘Thus and thus hath Micah dealt with me, and he hath hired me, and I am become his priest.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם כָּזֹה וְכָזֶה עָשָׂה לִי מִיכָה וַיִּשְׂכְּרֵנִי וָאֱהִי־לוֹ לְכֹהֵן׃
    hebrewPlain: ויאמר אלהם כזה וכזה עשה לי מיכה וישכרני ואהי לו לכהן
    kjvRefs:
    - Judges 18:4
    kjvOsis:
    - Judg.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.5
    scripture: tanakh
    name: Tanakh Judges 18:5
    ref: Judges 18:5
    book: Judg
    section: neviim
    chapter: 18
    verse: 5
    ordinal: 6993
    text: 'And they said unto him: ‘Ask counsel, we pray thee, of God, that we may know whether our way which we are going shall be prosperous.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ שְׁאַל־נָא בֵאלֹהִים וְנֵדְעָה הֲתַצְלִיחַ דַּרְכֵּנוּ אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ׃
    hebrewPlain: ויאמרו לו שאל נא באלהים ונדעה התצליח דרכנו אשר אנחנו הלכים עליה
    kjvRefs:
    - Judges 18:5
    kjvOsis:
    - Judg.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.6
    scripture: tanakh
    name: Tanakh Judges 18:6
    ref: Judges 18:6
    book: Judg
    section: neviim
    chapter: 18
    verse: 6
    ordinal: 6994
    text: 'And the priest said unto them: ‘Go in peace; before the LORD is your way wherein ye go.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם הַכֹּהֵן לְכוּ לְשָׁלוֹם נֹכַח יְהוָה דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ־בָהּ׃
    hebrewPlain: ויאמר להם הכהן לכו לשלום נכח יהוה דרככם אשר תלכו בה
    kjvRefs:
    - Judges 18:6
    kjvOsis:
    - Judg.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.7
    scripture: tanakh
    name: Tanakh Judges 18:7
    ref: Judges 18:7
    book: Judg
    section: neviim
    chapter: 18
    verse: 7
    ordinal: 6995
    text: Then the five men departed, and came to Laish, and saw the people that were therein, how they dwelt in security, after the manner of the Zidonians, quiet and secure; for there was none in the land, possessing authority, that might put them to shame in any thing, and they were far from the Zidonians, and had no dealings with any man.
    translation: JPS 1917
    original: וַיֵּלְכוּ חֲמֵשֶׁת הָאֲנָשִׁים וַיָּבֹאוּ לָיְשָׁה וַיִּרְאוּ אֶת־הָעָם אֲשֶׁר־בְּקִרְבָּהּ יוֹשֶׁבֶת־לָבֶטַח כְּמִשְׁפַּט צִדֹנִים שֹׁקֵט וּבֹטֵחַ וְאֵין־מַכְלִים דָּבָר בָּאָרֶץ יוֹרֵשׁ עֶצֶר וּרְחֹקִים הֵמָּה מִצִּדֹנִים וְדָבָר אֵין־לָהֶם עִם־אָדָם׃
    hebrewPlain: וילכו חמשת האנשים ויבאו לישה ויראו את העם אשר בקרבה יושבת לבטח כמשפט צדנים שקט ובטח ואין מכלים דבר בארץ יורש עצר ורחקים המה מצדנים ודבר אין להם עם אדם
    kjvRefs:
    - Judges 18:7
    kjvOsis:
    - Judg.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.8
    scripture: tanakh
    name: Tanakh Judges 18:8
    ref: Judges 18:8
    book: Judg
    section: neviim
    chapter: 18
    verse: 8
    ordinal: 6996
    text: 'And they came unto their brethren to Zorah and Eshtaol; and their brethren said unto them: ‘What say ye?’'
    translation: JPS 1917
    original: וַיָּבֹאוּ אֶל־אֲחֵיהֶם צָרְעָה וְאֶשְׁתָּאֹל וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם מָה אַתֶּם׃
    hebrewPlain: ויבאו אל אחיהם צרעה ואשתאל ויאמרו להם אחיהם מה אתם
    kjvRefs:
    - Judges 18:8
    kjvOsis:
    - Judg.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.9
    scripture: tanakh
    name: Tanakh Judges 18:9
    ref: Judges 18:9
    book: Judg
    section: neviim
    chapter: 18
    verse: 9
    ordinal: 6997
    text: 'And they said: ‘Arise, and let us go up against them; for we have seen the land, and, behold, it is very good; and are ye still? be not slothful to go and to enter in to possess the land.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ קוּמָה וְנַעֲלֶה עֲלֵיהֶם כִּי רָאִינוּ אֶת־הָאָרֶץ וְהִנֵּה טוֹבָה מְאֹד וְאַתֶּם מַחְשִׁים אַל־תֵּעָצְלוּ לָלֶכֶת לָבֹא לָרֶשֶׁת אֶת־הָאָרֶץ׃
    hebrewPlain: ויאמרו קומה ונעלה עליהם כי ראינו את הארץ והנה טובה מאד ואתם מחשים אל תעצלו ללכת לבא לרשת את הארץ
    kjvRefs:
    - Judges 18:9
    kjvOsis:
    - Judg.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.10
    scripture: tanakh
    name: Tanakh Judges 18:10
    ref: Judges 18:10
    book: Judg
    section: neviim
    chapter: 18
    verse: 10
    ordinal: 6998
    text: When ye go, ye shall come unto a people secure, and the land is large; for God hath given it into your hand; a place where there is no want; it hath every thing that is in the earth.’
    translation: JPS 1917
    original: כְּבֹאֲכֶם תָּבֹאוּ אֶל־עַם בֹּטֵחַ וְהָאָרֶץ רַחֲבַת יָדַיִם כִּי־נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם מָקוֹם אֲשֶׁר אֵין־שָׁם מַחְסוֹר כָּל־דָּבָר אֲשֶׁר בָּאָרֶץ׃
    hebrewPlain: כבאכם תבאו אל עם בטח והארץ רחבת ידים כי נתנה אלהים בידכם מקום אשר אין שם מחסור כל דבר אשר בארץ
    kjvRefs:
    - Judges 18:10
    kjvOsis:
    - Judg.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.11
    scripture: tanakh
    name: Tanakh Judges 18:11
    ref: Judges 18:11
    book: Judg
    section: neviim
    chapter: 18
    verse: 11
    ordinal: 6999
    text: And there set forth from thence of the family of the Danites, out of Zorah and out of Eshtaol, six hundred men girt with weapons of war.
    translation: JPS 1917
    original: וַיִּסְעוּ מִשָּׁם מִמִּשְׁפַּחַת הַדָּנִי מִצָּרְעָה וּמֵאֶשְׁתָּאֹל שֵׁשׁ־מֵאוֹת אִישׁ חָגוּר כְּלֵי מִלְחָמָה׃
    hebrewPlain: ויסעו משם ממשפחת הדני מצרעה ומאשתאל שש מאות איש חגור כלי מלחמה
    kjvRefs:
    - Judges 18:11
    kjvOsis:
    - Judg.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.12
    scripture: tanakh
    name: Tanakh Judges 18:12
    ref: Judges 18:12
    book: Judg
    section: neviim
    chapter: 18
    verse: 12
    ordinal: 7000
    text: And they went up, and encamped in Kiriath-jearim, in Judah; wherefore that place was called Mahaneh-dan unto this day; behold, it is behind Kiriath-jearim.
    translation: JPS 1917
    original: וַיַּעֲלוּ וַיַּחֲנוּ בְּקִרְיַת יְעָרִים בִּיהוּדָה עַל־כֵּן קָרְאוּ לַמָּקוֹם הַהוּא מַחֲנֵה־דָן עַד הַיּוֹם הַזֶּה הִנֵּה אַחֲרֵי קִרְיַת יְעָרִים׃
    hebrewPlain: ויעלו ויחנו בקרית יערים ביהודה על כן קראו למקום ההוא מחנה דן עד היום הזה הנה אחרי קרית יערים
    kjvRefs:
    - Judges 18:12
    kjvOsis:
    - Judg.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.13
    scripture: tanakh
    name: Tanakh Judges 18:13
    ref: Judges 18:13
    book: Judg
    section: neviim
    chapter: 18
    verse: 13
    ordinal: 7001
    text: And they passed thence unto the hill-country of Ephraim, and came unto the house of Micah.
    translation: JPS 1917
    original: וַיַּעַבְרוּ מִשָּׁם הַר־אֶפְרָיִם וַיָּבֹאוּ עַד־בֵּית מִיכָה׃
    hebrewPlain: ויעברו משם הר אפרים ויבאו עד בית מיכה
    kjvRefs:
    - Judges 18:13
    kjvOsis:
    - Judg.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.14
    scripture: tanakh
    name: Tanakh Judges 18:14
    ref: Judges 18:14
    book: Judg
    section: neviim
    chapter: 18
    verse: 14
    ordinal: 7002
    text: 'Then answered the five men that went to spy out the country of Laish, and said unto their brethren: ‘Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? now therefore consider what ye have to do.’'
    translation: JPS 1917
    original: וַיַּעֲנוּ חֲמֵשֶׁת הָאֲנָשִׁים הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ לַיִשׁ וַיֹּאמְרוּ אֶל־אֲחֵיהֶם הַיְדַעְתֶּם כִּי יֵשׁ בַּבָּתִּים הָאֵלֶּה אֵפוֹד וּתְרָפִים וּפֶסֶל וּמַסֵּכָה וְעַתָּה דְּעוּ מַה־תַּעֲשׂוּ׃
    hebrewPlain: ויענו חמשת האנשים ההלכים לרגל את הארץ ליש ויאמרו אל אחיהם הידעתם כי יש בבתים האלה אפוד ותרפים ופסל ומסכה ועתה דעו מה תעשו
    kjvRefs:
    - Judges 18:14
    kjvOsis:
    - Judg.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.15
    scripture: tanakh
    name: Tanakh Judges 18:15
    ref: Judges 18:15
    book: Judg
    section: neviim
    chapter: 18
    verse: 15
    ordinal: 7003
    text: And they turned aside thither, and came to the house of the young man the Levite, even unto the house of Micah, and asked him of his welfare.
    translation: JPS 1917
    original: וַיָּסוּרוּ שָׁמָּה וַיָּבֹאוּ אֶל־בֵּית־הַנַּעַר הַלֵּוִי בֵּית מִיכָה וַיִּשְׁאֲלוּ־לוֹ לְשָׁלוֹם׃
    hebrewPlain: ויסורו שמה ויבאו אל בית הנער הלוי בית מיכה וישאלו לו לשלום
    kjvRefs:
    - Judges 18:15
    kjvOsis:
    - Judg.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.16
    scripture: tanakh
    name: Tanakh Judges 18:16
    ref: Judges 18:16
    book: Judg
    section: neviim
    chapter: 18
    verse: 16
    ordinal: 7004
    text: And the six hundred men girt with their weapons of war, who were of the children of Dan, stood by the entrance of the gate.
    translation: JPS 1917
    original: וְשֵׁשׁ־מֵאוֹת אִישׁ חֲגוּרִים כְּלֵי מִלְחַמְתָּם נִצָּבִים פֶּתַח הַשָּׁעַר אֲשֶׁר מִבְּנֵי־דָן׃
    hebrewPlain: ושש מאות איש חגורים כלי מלחמתם נצבים פתח השער אשר מבני דן
    kjvRefs:
    - Judges 18:16
    kjvOsis:
    - Judg.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.17
    scripture: tanakh
    name: Tanakh Judges 18:17
    ref: Judges 18:17
    book: Judg
    section: neviim
    chapter: 18
    verse: 17
    ordinal: 7005
    text: And the five men that went to spy out the land went up, and came in thither, and took the graven image, and the ephod, and the teraphim, and the molten image; and the priest stood by the entrance of the gate with the six hundred men girt with weapons of war.
    translation: JPS 1917
    original: וַיַּעֲלוּ חֲמֵשֶׁת הָאֲנָשִׁים הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ בָּאוּ שָׁמָּה לָקְחוּ אֶת־הַפֶּסֶל וְאֶת־הָאֵפוֹד וְאֶת־הַתְּרָפִים וְאֶת־הַמַּסֵּכָה וְהַכֹּהֵן נִצָּב פֶּתַח הַשַּׁעַר וְשֵׁשׁ־מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה׃
    hebrewPlain: ויעלו חמשת האנשים ההלכים לרגל את הארץ באו שמה לקחו את הפסל ואת האפוד ואת התרפים ואת המסכה והכהן נצב פתח השער ושש מאות האיש החגור כלי המלחמה
    kjvRefs:
    - Judges 18:17
    kjvOsis:
    - Judg.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.18
    scripture: tanakh
    name: Tanakh Judges 18:18
    ref: Judges 18:18
    book: Judg
    section: neviim
    chapter: 18
    verse: 18
    ordinal: 7006
    text: 'And when these went into Micah’s house, and fetched the graven image of the ephod, and the teraphim, and the molten image, the priest said unto them: ‘What do ye?’'
    translation: JPS 1917
    original: וְאֵלֶּה בָּאוּ בֵּית מִיכָה וַיִּקְחוּ אֶת־פֶּסֶל הָאֵפוֹד וְאֶת־הַתְּרָפִים וְאֶת־הַמַּסֵּכָה וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן מָה אַתֶּם עֹשִׂים׃
    hebrewPlain: ואלה באו בית מיכה ויקחו את פסל האפוד ואת התרפים ואת המסכה ויאמר אליהם הכהן מה אתם עשים
    kjvRefs:
    - Judges 18:18
    kjvOsis:
    - Judg.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.19
    scripture: tanakh
    name: Tanakh Judges 18:19
    ref: Judges 18:19
    book: Judg
    section: neviim
    chapter: 18
    verse: 19
    ordinal: 7007
    text: 'And they said unto him: ‘Hold thy peace, lay thy hand upon thy mouth, and go with us, and be to us a father and a priest; is it better for thee to be priest unto the house of one man, or to be priest unto a tribe and a family in Israel?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ הַחֲרֵשׁ שִׂים־יָדְךָ עַל־פִּיךָ וְלֵךְ עִמָּנוּ וֶהְיֵה־לָנוּ לְאָב וּלְכֹהֵן הֲטוֹב הֱיוֹתְךָ כֹהֵן לְבֵית אִישׁ אֶחָד אוֹ הֱיוֹתְךָ כֹהֵן לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל׃
    hebrewPlain: ויאמרו לו החרש שים ידך על פיך ולך עמנו והיה לנו לאב ולכהן הטוב היותך כהן לבית איש אחד או היותך כהן לשבט ולמשפחה בישראל
    kjvRefs:
    - Judges 18:19
    kjvOsis:
    - Judg.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.20
    scripture: tanakh
    name: Tanakh Judges 18:20
    ref: Judges 18:20
    book: Judg
    section: neviim
    chapter: 18
    verse: 20
    ordinal: 7008
    text: And the priest’s heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.
    translation: JPS 1917
    original: וַיִּיטַב לֵב הַכֹּהֵן וַיִּקַּח אֶת־הָאֵפוֹד וְאֶת־הַתְּרָפִים וְאֶת־הַפָּסֶל וַיָּבֹא בְּקֶרֶב הָעָם׃
    hebrewPlain: וייטב לב הכהן ויקח את האפוד ואת התרפים ואת הפסל ויבא בקרב העם
    kjvRefs:
    - Judges 18:20
    kjvOsis:
    - Judg.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.21
    scripture: tanakh
    name: Tanakh Judges 18:21
    ref: Judges 18:21
    book: Judg
    section: neviim
    chapter: 18
    verse: 21
    ordinal: 7009
    text: So they turned and departed, and put the little ones and the cattle and the goods before them.
    translation: JPS 1917
    original: וַיִּפְנוּ וַיֵּלֵכוּ וַיָּשִׂימוּ אֶת־הַטַּף וְאֶת־הַמִּקְנֶה וְאֶת־הַכְּבוּדָּה לִפְנֵיהֶם׃
    hebrewPlain: ויפנו וילכו וישימו את הטף ואת המקנה ואת הכבודה לפניהם
    kjvRefs:
    - Judges 18:21
    kjvOsis:
    - Judg.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.22
    scripture: tanakh
    name: Tanakh Judges 18:22
    ref: Judges 18:22
    book: Judg
    section: neviim
    chapter: 18
    verse: 22
    ordinal: 7010
    text: When they were a good way from the house of Micah, the men that were in the houses near to Micah’s house were gathered together, and overtook the children of Dan.
    translation: JPS 1917
    original: הֵמָּה הִרְחִיקוּ מִבֵּית מִיכָה וְהָאֲנָשִׁים אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם־בֵּית מִיכָה נִזְעֲקוּ וַיַּדְבִּיקוּ אֶת־בְּנֵי־דָן׃
    hebrewPlain: המה הרחיקו מבית מיכה והאנשים אשר בבתים אשר עם בית מיכה נזעקו וידביקו את בני דן
    kjvRefs:
    - Judges 18:22
    kjvOsis:
    - Judg.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.23
    scripture: tanakh
    name: Tanakh Judges 18:23
    ref: Judges 18:23
    book: Judg
    section: neviim
    chapter: 18
    verse: 23
    ordinal: 7011
    text: 'And they cried unto the children of Dan. And they turned their faces, and said unto Micah: ‘What aileth thee, that thou comest with such a company?’'
    translation: JPS 1917
    original: וַיִּקְרְאוּ אֶל־בְּנֵי־דָן וַיַּסֵּבּוּ פְּנֵיהֶם וַיֹּאמְרוּ לְמִיכָה מַה־לְּךָ כִּי נִזְעָקְתָּ׃
    hebrewPlain: ויקראו אל בני דן ויסבו פניהם ויאמרו למיכה מה לך כי נזעקת
    kjvRefs:
    - Judges 18:23
    kjvOsis:
    - Judg.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.24
    scripture: tanakh
    name: Tanakh Judges 18:24
    ref: Judges 18:24
    book: Judg
    section: neviim
    chapter: 18
    verse: 24
    ordinal: 7012
    text: 'And he said: ‘Ye have taken away my god which I made, and the priest, and are gone away, and what have I more? and how then say ye unto me: What aileth thee?’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶת־אֱלֹהַי אֲשֶׁר־עָשִׂיתִי לְקַחְתֶּם וְאֶת־הַכֹּהֵן וַתֵּלְכוּ וּמַה־לִּי עוֹד וּמַה־זֶּה תֹּאמְרוּ אֵלַי מַה־לָּךְ׃
    hebrewPlain: ויאמר את אלהי אשר עשיתי לקחתם ואת הכהן ותלכו ומה לי עוד ומה זה תאמרו אלי מה לך
    kjvRefs:
    - Judges 18:24
    kjvOsis:
    - Judg.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.25
    scripture: tanakh
    name: Tanakh Judges 18:25
    ref: Judges 18:25
    book: Judg
    section: neviim
    chapter: 18
    verse: 25
    ordinal: 7013
    text: 'And the children of Dan said unto him: ‘Let not thy voice be heard among us, lest angry fellows fall upon you, and thou lose thy life, with the lives of thy household.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו בְּנֵי־דָן אַל־תַּשְׁמַע קוֹלְךָ עִמָּנוּ פֶּן־יִפְגְּעוּ בָכֶם אֲנָשִׁים מָרֵי נֶפֶשׁ וְאָסַפְתָּה נַפְשְׁךָ וְנֶפֶשׁ בֵּיתֶךָ׃
    hebrewPlain: ויאמרו אליו בני דן אל תשמע קולך עמנו פן יפגעו בכם אנשים מרי נפש ואספתה נפשך ונפש ביתך
    kjvRefs:
    - Judges 18:25
    kjvOsis:
    - Judg.18.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.26
    scripture: tanakh
    name: Tanakh Judges 18:26
    ref: Judges 18:26
    book: Judg
    section: neviim
    chapter: 18
    verse: 26
    ordinal: 7014
    text: And the children of Dan went their way; and when Micah saw that they were too strong for him, he turned and went back unto his house.
    translation: JPS 1917
    original: וַיֵּלְכוּ בְנֵי־דָן לְדַרְכָּם וַיַּרְא מִיכָה כִּי־חֲזָקִים הֵמָּה מִמֶּנּוּ וַיִּפֶן וַיָּשָׁב אֶל־בֵּיתוֹ׃
    hebrewPlain: וילכו בני דן לדרכם וירא מיכה כי חזקים המה ממנו ויפן וישב אל ביתו
    kjvRefs:
    - Judges 18:26
    kjvOsis:
    - Judg.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.27
    scripture: tanakh
    name: Tanakh Judges 18:27
    ref: Judges 18:27
    book: Judg
    section: neviim
    chapter: 18
    verse: 27
    ordinal: 7015
    text: And they took that which Micah had made, and the priest whom he had, and came unto Laish, unto a people quiet and secure, and smote them with the edge of the sword; and they burnt the city with fire.
    translation: JPS 1917
    original: וְהֵמָּה לָקְחוּ אֵת אֲשֶׁר־עָשָׂה מִיכָה וְאֶת־הַכֹּהֵן אֲשֶׁר הָיָה־לוֹ וַיָּבֹאוּ עַל־לַיִשׁ עַל־עַם שֹׁקֵט וּבֹטֵחַ וַיַּכּוּ אוֹתָם לְפִי־חָרֶב וְאֶת־הָעִיר שָׂרְפוּ בָאֵשׁ׃
    hebrewPlain: והמה לקחו את אשר עשה מיכה ואת הכהן אשר היה לו ויבאו על ליש על עם שקט ובטח ויכו אותם לפי חרב ואת העיר שרפו באש
    kjvRefs:
    - Judges 18:27
    kjvOsis:
    - Judg.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.28
    scripture: tanakh
    name: Tanakh Judges 18:28
    ref: Judges 18:28
    book: Judg
    section: neviim
    chapter: 18
    verse: 28
    ordinal: 7016
    text: And there was no deliverer, because it was far from Zidon, and they had no dealings with any man; and it was in the valley that lieth by Beth-rehob. And they built the city, and dwelt therein.
    translation: JPS 1917
    original: וְאֵין מַצִּיל כִּי רְחוֹקָה־הִיא מִצִּידוֹן וְדָבָר אֵין־לָהֶם עִם־אָדָם וְהִיא בָּעֵמֶק אֲשֶׁר לְבֵית־רְחוֹב וַיִּבְנוּ אֶת־הָעִיר וַיֵּשְׁבוּ בָהּ׃
    hebrewPlain: ואין מציל כי רחוקה היא מצידון ודבר אין להם עם אדם והיא בעמק אשר לבית רחוב ויבנו את העיר וישבו בה
    kjvRefs:
    - Judges 18:28
    kjvOsis:
    - Judg.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.29
    scripture: tanakh
    name: Tanakh Judges 18:29
    ref: Judges 18:29
    book: Judg
    section: neviim
    chapter: 18
    verse: 29
    ordinal: 7017
    text: And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel; howbeit the name of the city was Laish at the first.
    translation: JPS 1917
    original: וַיִּקְרְאוּ שֵׁם־הָעִיר דָּן בְּשֵׁם דָּן אֲבִיהֶם אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל וְאוּלָם לַיִשׁ שֵׁם־הָעִיר לָרִאשֹׁנָה׃
    hebrewPlain: ויקראו שם העיר דן בשם דן אביהם אשר יולד לישראל ואולם ליש שם העיר לראשנה
    kjvRefs:
    - Judges 18:29
    kjvOsis:
    - Judg.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.30
    scripture: tanakh
    name: Tanakh Judges 18:30
    ref: Judges 18:30
    book: Judg
    section: neviim
    chapter: 18
    verse: 30
    ordinal: 7018
    text: And the children of Dan set up for themselves the graven image; and Jonathan, the son of Gershom, the son of Manasseh, he and his sons were priests to the tribe of the Danites until the day of the captivity of the land.
    translation: JPS 1917
    original: וַיָּקִימוּ לָהֶם בְּנֵי־דָן אֶת־הַפָּסֶל וִיהוֹנָתָן בֶּן־גֵּרְשֹׁם בֶּן־מְנַשֶּׁה הוּא וּבָנָיו הָיוּ כֹהֲנִים לְשֵׁבֶט הַדָּנִי עַד־יוֹם גְּלוֹת הָאָרֶץ׃
    hebrewPlain: ויקימו להם בני דן את הפסל ויהונתן בן גרשם בן מנשה הוא ובניו היו כהנים לשבט הדני עד יום גלות הארץ
    kjvRefs:
    - Judges 18:30
    kjvOsis:
    - Judg.18.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.18.31
    scripture: tanakh
    name: Tanakh Judges 18:31
    ref: Judges 18:31
    book: Judg
    section: neviim
    chapter: 18
    verse: 31
    ordinal: 7019
    text: So they set them up Micah’s graven image which he made, all the time that the house of God was in Shiloh.
    translation: JPS 1917
    original: וַיָּשִׂימוּ לָהֶם אֶת־פֶּסֶל מִיכָה אֲשֶׁר עָשָׂה כָּל־יְמֵי הֱיוֹת בֵּית־הָאֱלֹהִים בְּשִׁלֹה׃
    hebrewPlain: וישימו להם את פסל מיכה אשר עשה כל ימי היות בית האלהים בשלה
    kjvRefs:
    - Judges 18:31
    kjvOsis:
    - Judg.18.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.18
- type: TanakhVerse
  data:
    osis: Judg.19.1
    scripture: tanakh
    name: Tanakh Judges 19:1
    ref: Judges 19:1
    book: Judg
    section: neviim
    chapter: 19
    verse: 1
    ordinal: 7020
    text: And it came to pass in those days, when there was no king in Israel, that there was a certain Levite sojourning on the farther side of the hill-country of Ephraim, who took to him a concubine out of Beth-lehem in Judah.
    translation: JPS 1917
    original: וַיְהִי בַּיָּמִים הָהֵם וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל וַיְהִי אִישׁ לֵוִי גָּר בְּיַרְכְּתֵי הַר־אֶפְרַיִם וַיִּקַּח־לוֹ אִשָּׁה פִילֶגֶשׁ מִבֵּית לֶחֶם יְהוּדָה׃
    hebrewPlain: ויהי בימים ההם ומלך אין בישראל ויהי איש לוי גר בירכתי הר אפרים ויקח לו אשה פילגש מבית לחם יהודה
    kjvRefs:
    - Judges 19:1
    kjvOsis:
    - Judg.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.2
    scripture: tanakh
    name: Tanakh Judges 19:2
    ref: Judges 19:2
    book: Judg
    section: neviim
    chapter: 19
    verse: 2
    ordinal: 7021
    text: And his concubine played the harlot against him, and went away from him unto her father’s house to Beth-lehem in Judah, and was there the space of four months.
    translation: JPS 1917
    original: וַתִּזְנֶה עָלָיו פִּילַגְשׁוֹ וַתֵּלֶךְ מֵאִתּוֹ אֶל־בֵּית אָבִיהָ אֶל־בֵּית לֶחֶם יְהוּדָה וַתְּהִי־שָׁם יָמִים אַרְבָּעָה חֳדָשִׁים׃
    hebrewPlain: ותזנה עליו פילגשו ותלך מאתו אל בית אביה אל בית לחם יהודה ותהי שם ימים ארבעה חדשים
    kjvRefs:
    - Judges 19:2
    kjvOsis:
    - Judg.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.3
    scripture: tanakh
    name: Tanakh Judges 19:3
    ref: Judges 19:3
    book: Judg
    section: neviim
    chapter: 19
    verse: 3
    ordinal: 7022
    text: And her husband arose, and went after her, to speak kindly unto her, to bring her back, having his servant with him, and a couple of asses; and she brought him into her father’s house; and when the father of the damsel saw him, he rejoiced to meet him.
    translation: JPS 1917
    original: וַיָּקָם אִישָׁהּ וַיֵּלֶךְ אַחֲרֶיהָ לְדַבֵּר עַל־לִבָּהּ להשיבו [לַהֲשִׁיבָהּ] וְנַעֲרוֹ עִמּוֹ וְצֶמֶד חֲמֹרִים וַתְּבִיאֵהוּ בֵּית אָבִיהָ וַיִּרְאֵהוּ אֲבִי הַנַּעֲרָה וַיִּשְׂמַח לִקְרָאתוֹ׃
    hebrewPlain: ויקם אישה וילך אחריה לדבר על לבה להשיבו [להשיבה] ונערו עמו וצמד חמרים ותביאהו בית אביה ויראהו אבי הנערה וישמח לקראתו
    kjvRefs:
    - Judges 19:3
    kjvOsis:
    - Judg.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.4
    scripture: tanakh
    name: Tanakh Judges 19:4
    ref: Judges 19:4
    book: Judg
    section: neviim
    chapter: 19
    verse: 4
    ordinal: 7023
    text: And his father-in-law, the damsel’s father, retained him; and he abode with him three days; so they did eat and drink, and lodged there.
    translation: JPS 1917
    original: וַיֶּחֱזַק־בּוֹ חֹתְנוֹ אֲבִי הַנַּעֲרָה וַיֵּשֶׁב אִתּוֹ שְׁלֹשֶׁת יָמִים וַיֹּאכְלוּ וַיִּשְׁתּוּ וַיָּלִינוּ שָׁם׃
    hebrewPlain: ויחזק בו חתנו אבי הנערה וישב אתו שלשת ימים ויאכלו וישתו וילינו שם
    kjvRefs:
    - Judges 19:4
    kjvOsis:
    - Judg.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.5
    scripture: tanakh
    name: Tanakh Judges 19:5
    ref: Judges 19:5
    book: Judg
    section: neviim
    chapter: 19
    verse: 5
    ordinal: 7024
    text: 'And it came to pass on the fourth day, that they arose early in the morning, and he rose up to depart; and the damsel’s father said unto his son-in-law: ‘Stay thy heart with a morsel of bread, and afterward ye shall go your way.’'
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הָרְבִיעִי וַיַּשְׁכִּימוּ בַבֹּקֶר וַיָּקָם לָלֶכֶת וַיֹּאמֶר אֲבִי הַנַּעֲרָה אֶל־חֲתָנוֹ סְעָד לִבְּךָ פַּת־לֶחֶם וְאַחַר תֵּלֵכוּ׃
    hebrewPlain: ויהי ביום הרביעי וישכימו בבקר ויקם ללכת ויאמר אבי הנערה אל חתנו סעד לבך פת לחם ואחר תלכו
    kjvRefs:
    - Judges 19:5
    kjvOsis:
    - Judg.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.6
    scripture: tanakh
    name: Tanakh Judges 19:6
    ref: Judges 19:6
    book: Judg
    section: neviim
    chapter: 19
    verse: 6
    ordinal: 7025
    text: 'So they sat down, and did eat and drink, both of them together; and the damsel’s father said unto the man: ‘Be content, I pray thee, and tarry all night, and let thy heart be merry.’'
    translation: JPS 1917
    original: וַיֵּשְׁבוּ וַיֹּאכְלוּ שְׁנֵיהֶם יַחְדָּו וַיִּשְׁתּוּ וַיֹּאמֶר אֲבִי הַנַּעֲרָה אֶל־הָאִישׁ הוֹאֶל־נָא וְלִין וְיִטַב לִבֶּךָ׃
    hebrewPlain: וישבו ויאכלו שניהם יחדו וישתו ויאמר אבי הנערה אל האיש הואל נא ולין ויטב לבך
    kjvRefs:
    - Judges 19:6
    kjvOsis:
    - Judg.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.7
    scripture: tanakh
    name: Tanakh Judges 19:7
    ref: Judges 19:7
    book: Judg
    section: neviim
    chapter: 19
    verse: 7
    ordinal: 7026
    text: And the man rose up to depart; but his father-in-law urged him, and he lodged there again.
    translation: JPS 1917
    original: וַיָּקָם הָאִישׁ לָלֶכֶת וַיִּפְצַר־בּוֹ חֹתְנוֹ וַיָּשָׁב וַיָּלֶן שָׁם׃
    hebrewPlain: ויקם האיש ללכת ויפצר בו חתנו וישב וילן שם
    kjvRefs:
    - Judges 19:7
    kjvOsis:
    - Judg.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.8
    scripture: tanakh
    name: Tanakh Judges 19:8
    ref: Judges 19:8
    book: Judg
    section: neviim
    chapter: 19
    verse: 8
    ordinal: 7027
    text: 'And he arose early in the morning on the fifth day to depart; and the damsel’s father said: ‘Stay thy heart, I pray thee, and tarry ye until the day declineth’; and they did eat, both of them.'
    translation: JPS 1917
    original: וַיַּשְׁכֵּם בַּבֹּקֶר בַּיּוֹם הַחֲמִישִׁי לָלֶכֶת וַיֹּאמֶר אֲבִי הַנַּעֲרָה סְעָד־נָא לְבָבְךָ וְהִתְמַהְמְהוּ עַד־נְטוֹת הַיּוֹם וַיֹּאכְלוּ שְׁנֵיהֶם׃
    hebrewPlain: וישכם בבקר ביום החמישי ללכת ויאמר אבי הנערה סעד נא לבבך והתמהמהו עד נטות היום ויאכלו שניהם
    kjvRefs:
    - Judges 19:8
    kjvOsis:
    - Judg.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.9
    scripture: tanakh
    name: Tanakh Judges 19:9
    ref: Judges 19:9
    book: Judg
    section: neviim
    chapter: 19
    verse: 9
    ordinal: 7028
    text: 'And when the man rose up to depart, he, and his concubine, and his servant, his father-in-law, the damsel’s father, said unto him: ‘Behold, now the day draweth toward evening; tarry, I pray you, all night; behold, the day groweth to an end; lodge here, that thy heart may be merry; and to-morrow get you early on your way, that thou mayest go home.’'
    translation: JPS 1917
    original: וַיָּקָם הָאִישׁ לָלֶכֶת הוּא וּפִילַגְשׁוֹ וְנַעֲרוֹ וַיֹּאמֶר לוֹ חֹתְנוֹ אֲבִי הַנַּעֲרָה הִנֵּה נָא רָפָה הַיּוֹם לַעֲרֹב לִינוּ־נָא הִנֵּה חֲנוֹת הַיּוֹם לִין פֹּה וְיִיטַב לְבָבֶךָ וְהִשְׁכַּמְתֶּם מָחָר לְדַרְכְּכֶם וְהָלַכְתָּ לְאֹהָלֶךָ׃
    hebrewPlain: ויקם האיש ללכת הוא ופילגשו ונערו ויאמר לו חתנו אבי הנערה הנה נא רפה היום לערב לינו נא הנה חנות היום לין פה וייטב לבבך והשכמתם מחר לדרככם והלכת לאהלך
    kjvRefs:
    - Judges 19:9
    kjvOsis:
    - Judg.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.10
    scripture: tanakh
    name: Tanakh Judges 19:10
    ref: Judges 19:10
    book: Judg
    section: neviim
    chapter: 19
    verse: 10
    ordinal: 7029
    text: But the man would not tarry that night, but he rose up and departed, and came over against Jebus—the same is Jerusalem; and there were with him a couple of asses saddled; his concubine also was with him.
    translation: JPS 1917
    original: וְלֹא־אָבָה הָאִישׁ לָלוּן וַיָּקָם וַיֵּלֶךְ וַיָּבֹא עַד־נֹכַח יְבוּס הִיא יְרוּשָׁלִָם וְעִמּוֹ צֶמֶד חֲמוֹרִים חֲבוּשִׁים וּפִילַגְשׁוֹ עִמּוֹ׃
    hebrewPlain: ולא אבה האיש ללון ויקם וילך ויבא עד נכח יבוס היא ירושלם ועמו צמד חמורים חבושים ופילגשו עמו
    kjvRefs:
    - Judges 19:10
    kjvOsis:
    - Judg.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.11
    scripture: tanakh
    name: Tanakh Judges 19:11
    ref: Judges 19:11
    book: Judg
    section: neviim
    chapter: 19
    verse: 11
    ordinal: 7030
    text: 'When they were by Jebus—the day was far spent—the servant said unto his master: ‘Come, I pray thee, and let us turn aside into this city of the Jebusites, and lodge in it.’'
    translation: JPS 1917
    original: הֵם עִם־יְבוּס וְהַיּוֹם רַד מְאֹד וַיֹּאמֶר הַנַּעַר אֶל־אֲדֹנָיו לְכָה־נָּא וְנָסוּרָה אֶל־עִיר־הַיְבוּסִי הַזֹּאת וְנָלִין בָּהּ׃
    hebrewPlain: הם עם יבוס והיום רד מאד ויאמר הנער אל אדניו לכה נא ונסורה אל עיר היבוסי הזאת ונלין בה
    kjvRefs:
    - Judges 19:11
    kjvOsis:
    - Judg.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.12
    scripture: tanakh
    name: Tanakh Judges 19:12
    ref: Judges 19:12
    book: Judg
    section: neviim
    chapter: 19
    verse: 12
    ordinal: 7031
    text: 'And his master said unto him: ‘We will not turn aside into the city of a foreigner, that is not of the children of Israel; but we will pass over to Gibeah.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו אֲדֹנָיו לֹא נָסוּר אֶל־עִיר נָכְרִי אֲשֶׁר לֹא־מִבְּנֵי יִשְׂרָאֵל הֵנָּה וְעָבַרְנוּ עַד־גִּבְעָה׃
    hebrewPlain: ויאמר אליו אדניו לא נסור אל עיר נכרי אשר לא מבני ישראל הנה ועברנו עד גבעה
    kjvRefs:
    - Judges 19:12
    kjvOsis:
    - Judg.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.13
    scripture: tanakh
    name: Tanakh Judges 19:13
    ref: Judges 19:13
    book: Judg
    section: neviim
    chapter: 19
    verse: 13
    ordinal: 7032
    text: 'And he said unto his servant: ‘Come and let us draw near to one of these places; and we will lodge in Gibeah, or in Ramah.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לְנַעֲרוֹ לְךָ וְנִקְרְבָה בְּאַחַד הַמְּקֹמוֹת וְלַנּוּ בַגִּבְעָה אוֹ בָרָמָה׃
    hebrewPlain: ויאמר לנערו לך ונקרבה באחד המקמות ולנו בגבעה או ברמה
    kjvRefs:
    - Judges 19:13
    kjvOsis:
    - Judg.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.14
    scripture: tanakh
    name: Tanakh Judges 19:14
    ref: Judges 19:14
    book: Judg
    section: neviim
    chapter: 19
    verse: 14
    ordinal: 7033
    text: So they passed on and went their way; and the sun went down upon them near to Gibeah, which belongeth to Benjamin.
    translation: JPS 1917
    original: וַיַּעַבְרוּ וַיֵּלֵכוּ וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ אֵצֶל הַגִּבְעָה אֲשֶׁר לְבִנְיָמִן׃
    hebrewPlain: ויעברו וילכו ותבא להם השמש אצל הגבעה אשר לבנימן
    kjvRefs:
    - Judges 19:14
    kjvOsis:
    - Judg.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.15
    scripture: tanakh
    name: Tanakh Judges 19:15
    ref: Judges 19:15
    book: Judg
    section: neviim
    chapter: 19
    verse: 15
    ordinal: 7034
    text: And they turned aside thither, to go in to lodge in Gibeah; and he went in, and sat him down in the broad place of the city; for there was no man that took them into his house to lodge.
    translation: JPS 1917
    original: וַיָּסֻרוּ שָׁם לָבוֹא לָלוּן בַּגִּבְעָה וַיָּבֹא וַיֵּשֶׁב בִּרְחוֹב הָעִיר וְאֵין אִישׁ מְאַסֵּף־אוֹתָם הַבַּיְתָה לָלוּן׃
    hebrewPlain: ויסרו שם לבוא ללון בגבעה ויבא וישב ברחוב העיר ואין איש מאסף אותם הביתה ללון
    kjvRefs:
    - Judges 19:15
    kjvOsis:
    - Judg.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.16
    scripture: tanakh
    name: Tanakh Judges 19:16
    ref: Judges 19:16
    book: Judg
    section: neviim
    chapter: 19
    verse: 16
    ordinal: 7035
    text: And, behold, there came an old man from his work out of the field at even; now the man was of the hill-country of Ephraim, and he sojourned in Gibeah; but the men of the place were Benjamites.
    translation: JPS 1917
    original: וְהִנֵּה אִישׁ זָקֵן בָּא מִן־מַעֲשֵׂהוּ מִן־הַשָּׂדֶה בָּעֶרֶב וְהָאִישׁ מֵהַר אֶפְרַיִם וְהוּא־גָר בַּגִּבְעָה וְאַנְשֵׁי הַמָּקוֹם בְּנֵי יְמִינִי׃
    hebrewPlain: והנה איש זקן בא מן מעשהו מן השדה בערב והאיש מהר אפרים והוא גר בגבעה ואנשי המקום בני ימיני
    kjvRefs:
    - Judges 19:16
    kjvOsis:
    - Judg.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.17
    scripture: tanakh
    name: Tanakh Judges 19:17
    ref: Judges 19:17
    book: Judg
    section: neviim
    chapter: 19
    verse: 17
    ordinal: 7036
    text: 'And he lifted up his eyes, and saw the wayfaring man in the broad place of the city; and the old man said: ‘Whither goest thou? and whence comest thou?’'
    translation: JPS 1917
    original: וַיִּשָּׂא עֵינָיו וַיַּרְא אֶת־הָאִישׁ הָאֹרֵחַ בִּרְחֹב הָעִיר וַיֹּאמֶר הָאִישׁ הַזָּקֵן אָנָה תֵלֵךְ וּמֵאַיִן תָּבוֹא׃
    hebrewPlain: וישא עיניו וירא את האיש הארח ברחב העיר ויאמר האיש הזקן אנה תלך ומאין תבוא
    kjvRefs:
    - Judges 19:17
    kjvOsis:
    - Judg.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.18
    scripture: tanakh
    name: Tanakh Judges 19:18
    ref: Judges 19:18
    book: Judg
    section: neviim
    chapter: 19
    verse: 18
    ordinal: 7037
    text: 'And he said unto him: ‘We are passing from Beth-lehem in Judah unto the farther side of the hill-country of Ephraim; from thence am I, and I went to Beth-lehem in Judah, and I am now going to the house of the LORD; and there is no man that taketh me into his house.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו עֹבְרִים אֲנַחְנוּ מִבֵּית־לֶחֶם יְהוּדָה עַד־יַרְכְּתֵי הַר־אֶפְרַיִם מִשָּׁם אָנֹכִי וָאֵלֵךְ עַד־בֵּית לֶחֶם יְהוּדָה וְאֶת־בֵּית יְהוָה אֲנִי הֹלֵךְ וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה׃
    hebrewPlain: ויאמר אליו עברים אנחנו מבית לחם יהודה עד ירכתי הר אפרים משם אנכי ואלך עד בית לחם יהודה ואת בית יהוה אני הלך ואין איש מאסף אותי הביתה
    kjvRefs:
    - Judges 19:18
    kjvOsis:
    - Judg.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.19
    scripture: tanakh
    name: Tanakh Judges 19:19
    ref: Judges 19:19
    book: Judg
    section: neviim
    chapter: 19
    verse: 19
    ordinal: 7038
    text: Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man that is with thy servants; there is no want of any thing.’
    translation: JPS 1917
    original: וְגַם־תֶּבֶן גַּם־מִסְפּוֹא יֵשׁ לַחֲמוֹרֵינוּ וְגַם לֶחֶם וָיַיִן יֶשׁ־לִי וְלַאֲמָתֶךָ וְלַנַּעַר עִם־עֲבָדֶיךָ אֵין מַחְסוֹר כָּל־דָּבָר׃
    hebrewPlain: וגם תבן גם מספוא יש לחמורינו וגם לחם ויין יש לי ולאמתך ולנער עם עבדיך אין מחסור כל דבר
    kjvRefs:
    - Judges 19:19
    kjvOsis:
    - Judg.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.20
    scripture: tanakh
    name: Tanakh Judges 19:20
    ref: Judges 19:20
    book: Judg
    section: neviim
    chapter: 19
    verse: 20
    ordinal: 7039
    text: 'And the old man said: ‘Peace be unto thee; howsoever let all thy wants lie upon me; only lodge not in the broad place.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הָאִישׁ הַזָּקֵן שָׁלוֹם לָךְ רַק כָּל־מַחְסוֹרְךָ עָלָי רַק בָּרְחוֹב אַל־תָּלַן׃
    hebrewPlain: ויאמר האיש הזקן שלום לך רק כל מחסורך עלי רק ברחוב אל תלן
    kjvRefs:
    - Judges 19:20
    kjvOsis:
    - Judg.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.21
    scripture: tanakh
    name: Tanakh Judges 19:21
    ref: Judges 19:21
    book: Judg
    section: neviim
    chapter: 19
    verse: 21
    ordinal: 7040
    text: So he brought him into his house, and gave the asses fodder; and they washed their feet, and did eat and drink.
    translation: JPS 1917
    original: וַיְבִיאֵהוּ לְבֵיתוֹ וַיָּבָול לַחֲמוֹרִים וַיִּרְחֲצוּ רַגְלֵיהֶם וַיֹּאכְלוּ וַיִּשְׁתּוּ׃
    hebrewPlain: ויביאהו לביתו ויבול לחמורים וירחצו רגליהם ויאכלו וישתו
    kjvRefs:
    - Judges 19:21
    kjvOsis:
    - Judg.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.22
    scripture: tanakh
    name: Tanakh Judges 19:22
    ref: Judges 19:22
    book: Judg
    section: neviim
    chapter: 19
    verse: 22
    ordinal: 7041
    text: 'As they were making their hearts merry, behold, the men of the city, certain base fellows, beset the house round about, beating at the door; and they spoke to the master of the house, the old man, saying: ‘Bring forth the man that came into thy house, that we may know him.’'
    translation: JPS 1917
    original: הֵמָּה מֵיטִיבִים אֶת־לִבָּם וְהִנֵּה אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי־בְלִיַּעַל נָסַבּוּ אֶת־הַבַּיִת מִתְדַּפְּקִים עַל־הַדָּלֶת וַיֹּאמְרוּ אֶל־הָאִישׁ בַּעַל הַבַּיִת הַזָּקֵן לֵאמֹר הוֹצֵא אֶת־הָאִישׁ אֲשֶׁר־בָּא אֶל־בֵּיתְךָ וְנֵדָעֶנּוּ׃
    hebrewPlain: המה מיטיבים את לבם והנה אנשי העיר אנשי בני בליעל נסבו את הבית מתדפקים על הדלת ויאמרו אל האיש בעל הבית הזקן לאמר הוצא את האיש אשר בא אל ביתך ונדענו
    kjvRefs:
    - Judges 19:22
    kjvOsis:
    - Judg.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.23
    scripture: tanakh
    name: Tanakh Judges 19:23
    ref: Judges 19:23
    book: Judg
    section: neviim
    chapter: 19
    verse: 23
    ordinal: 7042
    text: 'And the man, the master of the house, went out unto them, and said unto them: ‘Nay, my brethren, I pray you, do not so wickedly; seeing that this man is come into my house, do not this wanton deed.'
    translation: JPS 1917
    original: וַיֵּצֵא אֲלֵיהֶם הָאִישׁ בַּעַל הַבַּיִת וַיֹּאמֶר אֲלֵהֶם אַל־אַחַי אַל־תָּרֵעוּ נָא אַחֲרֵי אֲשֶׁר־בָּא הָאִישׁ הַזֶּה אַל־בֵּיתִי אַל־תַּעֲשׂוּ אֶת־הַנְּבָלָה הַזֹּאת׃
    hebrewPlain: ויצא אליהם האיש בעל הבית ויאמר אלהם אל אחי אל תרעו נא אחרי אשר בא האיש הזה אל ביתי אל תעשו את הנבלה הזאת
    kjvRefs:
    - Judges 19:23
    kjvOsis:
    - Judg.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.24
    scripture: tanakh
    name: Tanakh Judges 19:24
    ref: Judges 19:24
    book: Judg
    section: neviim
    chapter: 19
    verse: 24
    ordinal: 7043
    text: Behold, here is my daughter a virgin, and his concubine; I will bring them out now, and humble ye them, and do with them what seemeth good unto you; but unto this man do not so wanton a thing.’
    translation: JPS 1917
    original: הִנֵּה בִתִּי הַבְּתוּלָה וּפִילַגְשֵׁהוּ אוֹצִיאָה־נָּא אוֹתָם וְעַנּוּ אוֹתָם וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ דְּבַר הַנְּבָלָה הַזֹּאת׃
    hebrewPlain: הנה בתי הבתולה ופילגשהו אוציאה נא אותם וענו אותם ועשו להם הטוב בעיניכם ולאיש הזה לא תעשו דבר הנבלה הזאת
    kjvRefs:
    - Judges 19:24
    kjvOsis:
    - Judg.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.25
    scripture: tanakh
    name: Tanakh Judges 19:25
    ref: Judges 19:25
    book: Judg
    section: neviim
    chapter: 19
    verse: 25
    ordinal: 7044
    text: But the men would not hearken to him; so the man laid hold on his concubine, and brought her forth unto them; and they knew her, and abused her all the night until the morning; and when the day began to spring, they let her go.
    translation: JPS 1917
    original: וְלֹא־אָבוּ הָאֲנָשִׁים לִשְׁמֹעַ לוֹ וַיַּחֲזֵק הָאִישׁ בְּפִילַגְשׁוֹ וַיֹּצֵא אֲלֵיהֶם הַחוּץ וַיֵּדְעוּ אוֹתָהּ וַיִּתְעַלְּלוּ־בָהּ כָּל־הַלַּיְלָה עַד־הַבֹּקֶר וַיְשַׁלְּחוּהָ בעלות [כַּעֲלוֹת] הַשָּׁחַר׃
    hebrewPlain: ולא אבו האנשים לשמע לו ויחזק האיש בפילגשו ויצא אליהם החוץ וידעו אותה ויתעללו בה כל הלילה עד הבקר וישלחוה בעלות [כעלות] השחר
    kjvRefs:
    - Judges 19:25
    kjvOsis:
    - Judg.19.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.26
    scripture: tanakh
    name: Tanakh Judges 19:26
    ref: Judges 19:26
    book: Judg
    section: neviim
    chapter: 19
    verse: 26
    ordinal: 7045
    text: Then came the woman in the dawning of the day, and fell down at the door of the man’s house where her lord was, till it was light.
    translation: JPS 1917
    original: וַתָּבֹא הָאִשָּׁה לִפְנוֹת הַבֹּקֶר וַתִּפֹּל פֶּתַח בֵּית־הָאִישׁ אֲשֶׁר־אֲדוֹנֶיהָ שָּׁם עַד־הָאוֹר׃
    hebrewPlain: ותבא האשה לפנות הבקר ותפל פתח בית האיש אשר אדוניה שם עד האור
    kjvRefs:
    - Judges 19:26
    kjvOsis:
    - Judg.19.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.27
    scripture: tanakh
    name: Tanakh Judges 19:27
    ref: Judges 19:27
    book: Judg
    section: neviim
    chapter: 19
    verse: 27
    ordinal: 7046
    text: And her lord rose up in the morning, and opened the doors of the house, and went out to go his way; and, behold, the woman his concubine was fallen down at the door of the house, with her hands upon the threshold.
    translation: JPS 1917
    original: וַיָּקָם אֲדֹנֶיהָ בַּבֹּקֶר וַיִּפְתַּח דַּלְתוֹת הַבַּיִת וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ וְהִנֵּה הָאִשָּׁה פִילַגְשׁוֹ נֹפֶלֶת פֶּתַח הַבַּיִת וְיָדֶיהָ עַל־הַסַּף׃
    hebrewPlain: ויקם אדניה בבקר ויפתח דלתות הבית ויצא ללכת לדרכו והנה האשה פילגשו נפלת פתח הבית וידיה על הסף
    kjvRefs:
    - Judges 19:27
    kjvOsis:
    - Judg.19.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.28
    scripture: tanakh
    name: Tanakh Judges 19:28
    ref: Judges 19:28
    book: Judg
    section: neviim
    chapter: 19
    verse: 28
    ordinal: 7047
    text: And he said unto her. 'Up, and let us be going'; but none answered; then he took her up upon the ass; and the man rose up, and got him unto his place.
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ קוּמִי וְנֵלֵכָה וְאֵין עֹנֶה וַיִּקָּחֶהָ עַל־הַחֲמוֹר וַיָּקָם הָאִישׁ וַיֵּלֶךְ לִמְקֹמוֹ׃
    hebrewPlain: ויאמר אליה קומי ונלכה ואין ענה ויקחה על החמור ויקם האיש וילך למקמו
    kjvRefs:
    - Judges 19:28
    kjvOsis:
    - Judg.19.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.29
    scripture: tanakh
    name: Tanakh Judges 19:29
    ref: Judges 19:29
    book: Judg
    section: neviim
    chapter: 19
    verse: 29
    ordinal: 7048
    text: And when he was come into his house, he took a knife, and laid hold on his concubine, and divided her, limb by limb, into twelve pieces, and sent her throughout all the borders of Israel.
    translation: JPS 1917
    original: וַיָּבֹא אֶל־בֵּיתוֹ וַיִּקַּח אֶת־הַמַּאֲכֶלֶת וַיַּחֲזֵק בְּפִילַגְשׁוֹ וַיְנַתְּחֶהָ לַעֲצָמֶיהָ לִשְׁנֵים עָשָׂר נְתָחִים וַיְשַׁלְּחֶהָ בְּכֹל גְּבוּל יִשְׂרָאֵל׃
    hebrewPlain: ויבא אל ביתו ויקח את המאכלת ויחזק בפילגשו וינתחה לעצמיה לשנים עשר נתחים וישלחה בכל גבול ישראל
    kjvRefs:
    - Judges 19:29
    kjvOsis:
    - Judg.19.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.19.30
    scripture: tanakh
    name: Tanakh Judges 19:30
    ref: Judges 19:30
    book: Judg
    section: neviim
    chapter: 19
    verse: 30
    ordinal: 7049
    text: 'And it was so, that all that saw it said: ‘Such a thing hath not happened nor been seen from the day that the children of Israel came up out of the land of Egypt unto this day; consider it, take counsel, and speak.’'
    translation: JPS 1917
    original: וְהָיָה כָל־הָרֹאֶה וְאָמַר לֹא־נִהְיְתָה וְלֹא־נִרְאֲתָה כָּזֹאת לְמִיּוֹם עֲלוֹת בְּנֵי־יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם עַד הַיּוֹם הַזֶּה שִׂימוּ־לָכֶם עָלֶיהָ עֻצוּ וְדַבֵּרוּ׃
    hebrewPlain: והיה כל הראה ואמר לא נהיתה ולא נראתה כזאת למיום עלות בני ישראל מארץ מצרים עד היום הזה שימו לכם עליה עצו ודברו
    kjvRefs:
    - Judges 19:30
    kjvOsis:
    - Judg.19.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.19
- type: TanakhVerse
  data:
    osis: Judg.20.1
    scripture: tanakh
    name: Tanakh Judges 20:1
    ref: Judges 20:1
    book: Judg
    section: neviim
    chapter: 20
    verse: 1
    ordinal: 7050
    text: Then all the children of Israel went out, and the congregation was assembled as one man, from Dan even to Beer-sheba, with the land of Gilead, unto the LORD at Mizpah.
    translation: JPS 1917
    original: וַיֵּצְאוּ כָּל־בְּנֵי יִשְׂרָאֵל וַתִּקָּהֵל הָעֵדָה כְּאִישׁ אֶחָד לְמִדָּן וְעַד־בְּאֵר שֶׁבַע וְאֶרֶץ הַגִּלְעָד אֶל־יְהוָה הַמִּצְפָּה׃
    hebrewPlain: ויצאו כל בני ישראל ותקהל העדה כאיש אחד למדן ועד באר שבע וארץ הגלעד אל יהוה המצפה
    kjvRefs:
    - Judges 20:1
    kjvOsis:
    - Judg.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.2
    scripture: tanakh
    name: Tanakh Judges 20:2
    ref: Judges 20:2
    book: Judg
    section: neviim
    chapter: 20
    verse: 2
    ordinal: 7051
    text: And the chiefs of all the people, even of all the tribes of Israel, presented themselves in the assembly of the people of God, four hundred thousand footmen that drew sword.—
    translation: JPS 1917
    original: וַיִּתְיַצְּבוּ פִּנּוֹת כָּל־הָעָם כֹּל שִׁבְטֵי יִשְׂרָאֵל בִּקְהַל עַם הָאֱלֹהִים אַרְבַּע מֵאוֹת אֶלֶף אִישׁ רַגְלִי שֹׁלֵף חָרֶב׃
    hebrewPlain: ויתיצבו פנות כל העם כל שבטי ישראל בקהל עם האלהים ארבע מאות אלף איש רגלי שלף חרב
    kjvRefs:
    - Judges 20:2
    kjvOsis:
    - Judg.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.3
    scripture: tanakh
    name: Tanakh Judges 20:3
    ref: Judges 20:3
    book: Judg
    section: neviim
    chapter: 20
    verse: 3
    ordinal: 7052
    text: 'Now the children of Benjamin heard that the children of Israel were gone up to Mizpah.—And the children of Israel said: ‘Tell us, how was this wickedness brought to pass?’'
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ בְּנֵי בִנְיָמִן כִּי־עָלוּ בְנֵי־יִשְׂרָאֵל הַמִּצְפָּה וַיֹּאמְרוּ בְּנֵי יִשְׂרָאֵל דַּבְּרוּ אֵיכָה נִהְיְתָה הָרָעָה הַזֹּאת׃
    hebrewPlain: וישמעו בני בנימן כי עלו בני ישראל המצפה ויאמרו בני ישראל דברו איכה נהיתה הרעה הזאת
    kjvRefs:
    - Judges 20:3
    kjvOsis:
    - Judg.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.4
    scripture: tanakh
    name: Tanakh Judges 20:4
    ref: Judges 20:4
    book: Judg
    section: neviim
    chapter: 20
    verse: 4
    ordinal: 7053
    text: 'And the Levite, the husband of the woman that was murdered, answered and said: ‘I came into Gibeah that belongeth to Benjamin, I and my concubine, to lodge.'
    translation: JPS 1917
    original: וַיַּעַן הָאִישׁ הַלֵּוִי אִישׁ הָאִשָּׁה הַנִּרְצָחָה וַיֹּאמַר הַגִּבְעָתָה אֲשֶׁר לְבִנְיָמִן בָּאתִי אֲנִי וּפִילַגְשִׁי לָלוּן׃
    hebrewPlain: ויען האיש הלוי איש האשה הנרצחה ויאמר הגבעתה אשר לבנימן באתי אני ופילגשי ללון
    kjvRefs:
    - Judges 20:4
    kjvOsis:
    - Judg.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.5
    scripture: tanakh
    name: Tanakh Judges 20:5
    ref: Judges 20:5
    book: Judg
    section: neviim
    chapter: 20
    verse: 5
    ordinal: 7054
    text: And the men of Gibeah rose against me, and beset the house round about upon me by night; me they thought to have slain, and my concubine they forced, and she is dead.
    translation: JPS 1917
    original: וַיָּקֻמוּ עָלַי בַּעֲלֵי הַגִּבְעָה וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת לָיְלָה אוֹתִי דִּמּוּ לַהֲרֹג וְאֶת־פִּילַגְשִׁי עִנּוּ וַתָּמֹת׃
    hebrewPlain: ויקמו עלי בעלי הגבעה ויסבו עלי את הבית לילה אותי דמו להרג ואת פילגשי ענו ותמת
    kjvRefs:
    - Judges 20:5
    kjvOsis:
    - Judg.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.6
    scripture: tanakh
    name: Tanakh Judges 20:6
    ref: Judges 20:6
    book: Judg
    section: neviim
    chapter: 20
    verse: 6
    ordinal: 7055
    text: And I took my concubine, and cut her in pieces, and sent her throughout all the country of the inheritance of Israel; for they have committed lewdness and wantonness in Israel
    translation: JPS 1917
    original: וָאֹחֵז בְּפִילַגְשִׁי וָאֲנַתְּחֶהָ וָאֲשַׁלְּחֶהָ בְּכָל־שְׂדֵה נַחֲלַת יִשְׂרָאֵל כִּי עָשׂוּ זִמָּה וּנְבָלָה בְּיִשְׂרָאֵל׃
    hebrewPlain: ואחז בפילגשי ואנתחה ואשלחה בכל שדה נחלת ישראל כי עשו זמה ונבלה בישראל
    kjvRefs:
    - Judges 20:6
    kjvOsis:
    - Judg.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.7
    scripture: tanakh
    name: Tanakh Judges 20:7
    ref: Judges 20:7
    book: Judg
    section: neviim
    chapter: 20
    verse: 7
    ordinal: 7056
    text: Behold, ye are all here, children of Israel, give here your advice and council.’
    translation: JPS 1917
    original: הִנֵּה כֻלְּכֶם בְּנֵי יִשְׂרָאֵל הָבוּ לָכֶם דָּבָר וְעֵצָה הֲלֹם׃
    hebrewPlain: הנה כלכם בני ישראל הבו לכם דבר ועצה הלם
    kjvRefs:
    - Judges 20:7
    kjvOsis:
    - Judg.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.8
    scripture: tanakh
    name: Tanakh Judges 20:8
    ref: Judges 20:8
    book: Judg
    section: neviim
    chapter: 20
    verse: 8
    ordinal: 7057
    text: 'And all the people arose as one man, saying: ‘We will not any of us go to his tent, neither will we any of us turn unto his house.'
    translation: JPS 1917
    original: וַיָּקָם כָּל־הָעָם כְּאִישׁ אֶחָד לֵאמֹר לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ וְלֹא נָסוּר אִישׁ לְבֵיתוֹ׃
    hebrewPlain: ויקם כל העם כאיש אחד לאמר לא נלך איש לאהלו ולא נסור איש לביתו
    kjvRefs:
    - Judges 20:8
    kjvOsis:
    - Judg.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.9
    scripture: tanakh
    name: Tanakh Judges 20:9
    ref: Judges 20:9
    book: Judg
    section: neviim
    chapter: 20
    verse: 9
    ordinal: 7058
    text: 'But now this is the thing which we will do to Gibeah: we will go up against it by lot;'
    translation: JPS 1917
    original: וְעַתָּה זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה לַגִּבְעָה עָלֶיהָ בְּגוֹרָל׃
    hebrewPlain: ועתה זה הדבר אשר נעשה לגבעה עליה בגורל
    kjvRefs:
    - Judges 20:9
    kjvOsis:
    - Judg.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.10
    scripture: tanakh
    name: Tanakh Judges 20:10
    ref: Judges 20:10
    book: Judg
    section: neviim
    chapter: 20
    verse: 10
    ordinal: 7059
    text: and we will take ten men of a hundred throughout all the tribes of Israel, and a hundred of a thousand, and a thousand out of ten thousand, to fetch victuals for the people, that they may do, when they come to Gibeah of Benjamin, according to all the wantonness that they have wrought in Israel.’
    translation: JPS 1917
    original: וְלָקַחְנוּ עֲשָׂרָה אֲנָשִׁים לַמֵּאָה לְכֹל שִׁבְטֵי יִשְׂרָאֵל וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה לָקַחַת צֵדָה לָעָם לַעֲשׂוֹת לְבוֹאָם לְגֶבַע בִּנְיָמִן כְּכָל־הַנְּבָלָה אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל׃
    hebrewPlain: ולקחנו עשרה אנשים למאה לכל שבטי ישראל ומאה לאלף ואלף לרבבה לקחת צדה לעם לעשות לבואם לגבע בנימן ככל הנבלה אשר עשה בישראל
    kjvRefs:
    - Judges 20:10
    kjvOsis:
    - Judg.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.11
    scripture: tanakh
    name: Tanakh Judges 20:11
    ref: Judges 20:11
    book: Judg
    section: neviim
    chapter: 20
    verse: 11
    ordinal: 7060
    text: So all the men of Israel were gathered against the city, knit together as one man.
    translation: JPS 1917
    original: וַיֵּאָסֵף כָּל־אִישׁ יִשְׂרָאֵל אֶל־הָעִיר כְּאִישׁ אֶחָד חֲבֵרִים׃
    hebrewPlain: ויאסף כל איש ישראל אל העיר כאיש אחד חברים
    kjvRefs:
    - Judges 20:11
    kjvOsis:
    - Judg.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.12
    scripture: tanakh
    name: Tanakh Judges 20:12
    ref: Judges 20:12
    book: Judg
    section: neviim
    chapter: 20
    verse: 12
    ordinal: 7061
    text: 'And the tribes of Israel sent men through all the tribe of Benjamin, saying: ‘What wickedness is this that is come to pass among you?'
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ שִׁבְטֵי יִשְׂרָאֵל אֲנָשִׁים בְּכָל־שִׁבְטֵי בִנְיָמִן לֵאמֹר מָה הָרָעָה הַזֹּאת אֲשֶׁר נִהְיְתָה בָּכֶם׃
    hebrewPlain: וישלחו שבטי ישראל אנשים בכל שבטי בנימן לאמר מה הרעה הזאת אשר נהיתה בכם
    kjvRefs:
    - Judges 20:12
    kjvOsis:
    - Judg.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.13
    scripture: tanakh
    name: Tanakh Judges 20:13
    ref: Judges 20:13
    book: Judg
    section: neviim
    chapter: 20
    verse: 13
    ordinal: 7062
    text: Now therefore deliver up the men, the base fellows that are in Gibeah, that we may put them to death, and put away evil from Israel.’ But the children of Benjamin would not hearken to the voice of their brethren the children of Israel.
    translation: JPS 1917
    original: וְעַתָּה תְּנוּ אֶת־הָאֲנָשִׁים בְּנֵי־בְלִיַּעַל אֲשֶׁר בַּגִּבְעָה וּנְמִיתֵם וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל וְלֹא אָבוּ [בְּנֵי] בִּנְיָמִן לִשְׁמֹעַ בְּקוֹל אֲחֵיהֶם בְּנֵי־יִשְׂרָאֵל׃
    hebrewPlain: ועתה תנו את האנשים בני בליעל אשר בגבעה ונמיתם ונבערה רעה מישראל ולא אבו [בני] בנימן לשמע בקול אחיהם בני ישראל
    kjvRefs:
    - Judges 20:13
    kjvOsis:
    - Judg.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.14
    scripture: tanakh
    name: Tanakh Judges 20:14
    ref: Judges 20:14
    book: Judg
    section: neviim
    chapter: 20
    verse: 14
    ordinal: 7063
    text: And the children of Benjamin gathered themselves together out of their cities unto Gibeah, to go out to battle against the children of Israel.
    translation: JPS 1917
    original: וַיֵּאָסְפוּ בְנֵי־בִנְיָמִן מִן־הֶעָרִים הַגִּבְעָתָה לָצֵאת לַמִּלְחָמָה עִם־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויאספו בני בנימן מן הערים הגבעתה לצאת למלחמה עם בני ישראל
    kjvRefs:
    - Judges 20:14
    kjvOsis:
    - Judg.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.15
    scripture: tanakh
    name: Tanakh Judges 20:15
    ref: Judges 20:15
    book: Judg
    section: neviim
    chapter: 20
    verse: 15
    ordinal: 7064
    text: And the children of Benjamin numbered on that day out of the cities twenty and six thousand men that drew sword, besides the inhabitants of Gibeah, who numbered seven hundred chosen men.
    translation: JPS 1917
    original: וַיִּתְפָּקְדוּ בְנֵי בִנְיָמִן בַּיּוֹם הַהוּא מֵהֶעָרִים עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ שֹׁלֵף חָרֶב לְבַד מִיֹּשְׁבֵי הַגִּבְעָה הִתְפָּקְדוּ שְׁבַע מֵאוֹת אִישׁ בָּחוּר׃
    hebrewPlain: ויתפקדו בני בנימן ביום ההוא מהערים עשרים וששה אלף איש שלף חרב לבד מישבי הגבעה התפקדו שבע מאות איש בחור
    kjvRefs:
    - Judges 20:15
    kjvOsis:
    - Judg.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.16
    scripture: tanakh
    name: Tanakh Judges 20:16
    ref: Judges 20:16
    book: Judg
    section: neviim
    chapter: 20
    verse: 16
    ordinal: 7065
    text: All this people, even seven hundred chosen men, were left-handed; every one could sling stones at a hair-breadth, and not miss.
    translation: JPS 1917
    original: מִכֹּל הָעָם הַזֶּה שְׁבַע מֵאוֹת אִישׁ בָּחוּר אִטֵּר יַד־יְמִינוֹ כָּל־זֶה קֹלֵעַ בָּאֶבֶן אֶל־הַשַּׂעֲרָה וְלֹא יַחֲטִא׃
    hebrewPlain: מכל העם הזה שבע מאות איש בחור אטר יד ימינו כל זה קלע באבן אל השערה ולא יחטא
    kjvRefs:
    - Judges 20:16
    kjvOsis:
    - Judg.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.17
    scripture: tanakh
    name: Tanakh Judges 20:17
    ref: Judges 20:17
    book: Judg
    section: neviim
    chapter: 20
    verse: 17
    ordinal: 7066
    text: And the men of Israel, beside Benjamin, numbered four hundred thousand men that drew sword; all these were men of war.
    translation: JPS 1917
    original: וְאִישׁ יִשְׂרָאֵל הִתְפָּקְדוּ לְבַד מִבִּנְיָמִן אַרְבַּע מֵאוֹת אֶלֶף אִישׁ שֹׁלֵף חָרֶב כָּל־זֶה אִישׁ מִלְחָמָה׃
    hebrewPlain: ואיש ישראל התפקדו לבד מבנימן ארבע מאות אלף איש שלף חרב כל זה איש מלחמה
    kjvRefs:
    - Judges 20:17
    kjvOsis:
    - Judg.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.18
    scripture: tanakh
    name: Tanakh Judges 20:18
    ref: Judges 20:18
    book: Judg
    section: neviim
    chapter: 20
    verse: 18
    ordinal: 7067
    text: 'And the children of Israel arose, and went up to Beth-el, and asked counsel of God; and they said: ‘Who shall go up for us first to battle against the children of Benjamin?’ And the LORD said: ‘Judah first.’'
    translation: JPS 1917
    original: וַיָּקֻמוּ וַיַּעֲלוּ בֵית־אֵל וַיִּשְׁאֲלוּ בֵאלֹהִים וַיֹּאמְרוּ בְּנֵי יִשְׂרָאֵל מִי יַעֲלֶה־לָּנוּ בַתְּחִלָּה לַמִּלְחָמָה עִם־בְּנֵי בִנְיָמִן וַיֹּאמֶר יְהוָה יְהוּדָה בַתְּחִלָּה׃
    hebrewPlain: ויקמו ויעלו בית אל וישאלו באלהים ויאמרו בני ישראל מי יעלה לנו בתחלה למלחמה עם בני בנימן ויאמר יהוה יהודה בתחלה
    kjvRefs:
    - Judges 20:18
    kjvOsis:
    - Judg.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.19
    scripture: tanakh
    name: Tanakh Judges 20:19
    ref: Judges 20:19
    book: Judg
    section: neviim
    chapter: 20
    verse: 19
    ordinal: 7068
    text: And the children of Israel rose up in the morning, and encamped against Gibeah.
    translation: JPS 1917
    original: וַיָּקוּמוּ בְנֵי־יִשְׂרָאֵל בַּבֹּקֶר וַיַּחֲנוּ עַל־הַגִּבְעָה׃
    hebrewPlain: ויקומו בני ישראל בבקר ויחנו על הגבעה
    kjvRefs:
    - Judges 20:19
    kjvOsis:
    - Judg.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.20
    scripture: tanakh
    name: Tanakh Judges 20:20
    ref: Judges 20:20
    book: Judg
    section: neviim
    chapter: 20
    verse: 20
    ordinal: 7069
    text: And the men of Israel went out to battle against Benjamin; and the men of Israel set the battle in array against them at Gibeah.
    translation: JPS 1917
    original: וַיֵּצֵא אִישׁ יִשְׂרָאֵל לַמִּלְחָמָה עִם־בִּנְיָמִן וַיַּעַרְכוּ אִתָּם אִישׁ־יִשְׂרָאֵל מִלְחָמָה אֶל־הַגִּבְעָה׃
    hebrewPlain: ויצא איש ישראל למלחמה עם בנימן ויערכו אתם איש ישראל מלחמה אל הגבעה
    kjvRefs:
    - Judges 20:20
    kjvOsis:
    - Judg.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.21
    scripture: tanakh
    name: Tanakh Judges 20:21
    ref: Judges 20:21
    book: Judg
    section: neviim
    chapter: 20
    verse: 21
    ordinal: 7070
    text: And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites on that day twenty and two thousand men.
    translation: JPS 1917
    original: וַיֵּצְאוּ בְנֵי־בִנְיָמִן מִן־הַגִּבְעָה וַיַּשְׁחִיתוּ בְיִשְׂרָאֵל בַּיּוֹם הַהוּא שְׁנַיִם וְעֶשְׂרִים אֶלֶף אִישׁ אָרְצָה׃
    hebrewPlain: ויצאו בני בנימן מן הגבעה וישחיתו בישראל ביום ההוא שנים ועשרים אלף איש ארצה
    kjvRefs:
    - Judges 20:21
    kjvOsis:
    - Judg.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.22
    scripture: tanakh
    name: Tanakh Judges 20:22
    ref: Judges 20:22
    book: Judg
    section: neviim
    chapter: 20
    verse: 22
    ordinal: 7071
    text: And the people, the men of Israel, encouraged themselves, and set the battle again in array in the place where they set themselves in array the first day.
    translation: JPS 1917
    original: וַיִּתְחַזֵּק הָעָם אִישׁ יִשְׂרָאֵל וַיֹּסִפוּ לַעֲרֹךְ מִלְחָמָה בַּמָּקוֹם אֲשֶׁר־עָרְכוּ שָׁם בַּיּוֹם הָרִאשׁוֹן׃
    hebrewPlain: ויתחזק העם איש ישראל ויספו לערך מלחמה במקום אשר ערכו שם ביום הראשון
    kjvRefs:
    - Judges 20:22
    kjvOsis:
    - Judg.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.23
    scripture: tanakh
    name: Tanakh Judges 20:23
    ref: Judges 20:23
    book: Judg
    section: neviim
    chapter: 20
    verse: 23
    ordinal: 7072
    text: 'And the children of Israel went up and wept before the LORD until even; and they asked of the LORD, saying: ‘Shall I again draw nigh to battle against the children of Benjamin my brother?’ And the LORD said: ‘Go up against him.’'
    translation: JPS 1917
    original: וַיַּעֲלוּ בְנֵי־יִשְׂרָאֵל וַיִּבְכּוּ לִפְנֵי־יְהוָה עַד־הָעֶרֶב וַיִּשְׁאֲלוּ בַיהוָה לֵאמֹר הַאוֹסִיף לָגֶשֶׁת לַמִּלְחָמָה עִם־בְּנֵי בִנְיָמִן אָחִי וַיֹּאמֶר יְהוָה עֲלוּ אֵלָיו׃
    hebrewPlain: ויעלו בני ישראל ויבכו לפני יהוה עד הערב וישאלו ביהוה לאמר האוסיף לגשת למלחמה עם בני בנימן אחי ויאמר יהוה עלו אליו
    kjvRefs:
    - Judges 20:23
    kjvOsis:
    - Judg.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.24
    scripture: tanakh
    name: Tanakh Judges 20:24
    ref: Judges 20:24
    book: Judg
    section: neviim
    chapter: 20
    verse: 24
    ordinal: 7073
    text: And the children of Israel came near against the children of Benjamin the second day.
    translation: JPS 1917
    original: וַיִּקְרְבוּ בְנֵי־יִשְׂרָאֵל אֶל־בְּנֵי בִנְיָמִן בַּיּוֹם הַשֵּׁנִי׃
    hebrewPlain: ויקרבו בני ישראל אל בני בנימן ביום השני
    kjvRefs:
    - Judges 20:24
    kjvOsis:
    - Judg.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.25
    scripture: tanakh
    name: Tanakh Judges 20:25
    ref: Judges 20:25
    book: Judg
    section: neviim
    chapter: 20
    verse: 25
    ordinal: 7074
    text: And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.
    translation: JPS 1917
    original: וַיֵּצֵא בִנְיָמִן לִקְרָאתָם מִן־הַגִּבְעָה בַּיּוֹם הַשֵּׁנִי וַיַּשְׁחִיתוּ בִבְנֵי יִשְׂרָאֵל עוֹד שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ אָרְצָה כָּל־אֵלֶּה שֹׁלְפֵי חָרֶב׃
    hebrewPlain: ויצא בנימן לקראתם מן הגבעה ביום השני וישחיתו בבני ישראל עוד שמנת עשר אלף איש ארצה כל אלה שלפי חרב
    kjvRefs:
    - Judges 20:25
    kjvOsis:
    - Judg.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.26
    scripture: tanakh
    name: Tanakh Judges 20:26
    ref: Judges 20:26
    book: Judg
    section: neviim
    chapter: 20
    verse: 26
    ordinal: 7075
    text: Then all the children of Israel, and all the people, went up, and came unto Beth-el, and wept, and sat there before the LORD, and fasted that day until even; and they offered burnt-offerings and peace-offerings before the LORD.
    translation: JPS 1917
    original: וַיַּעֲלוּ כָל־בְּנֵי יִשְׂרָאֵל וְכָל־הָעָם וַיָּבֹאוּ בֵית־אֵל וַיִּבְכּוּ וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה וַיָּצוּמוּ בַיּוֹם־הַהוּא עַד־הָעָרֶב וַיַּעֲלוּ עֹלוֹת וּשְׁלָמִים לִפְנֵי יְהוָה׃
    hebrewPlain: ויעלו כל בני ישראל וכל העם ויבאו בית אל ויבכו וישבו שם לפני יהוה ויצומו ביום ההוא עד הערב ויעלו עלות ושלמים לפני יהוה
    kjvRefs:
    - Judges 20:26
    kjvOsis:
    - Judg.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.27
    scripture: tanakh
    name: Tanakh Judges 20:27
    ref: Judges 20:27
    book: Judg
    section: neviim
    chapter: 20
    verse: 27
    ordinal: 7076
    text: And the children of Israel asked of the LORD—for the ark of the covenant of God was there in those days,
    translation: JPS 1917
    original: וַיִּשְׁאֲלוּ בְנֵי־יִשְׂרָאֵל בַּיהוָה וְשָׁם אֲרוֹן בְּרִית הָאֱלֹהִים בַּיָּמִים הָהֵם׃
    hebrewPlain: וישאלו בני ישראל ביהוה ושם ארון ברית האלהים בימים ההם
    kjvRefs:
    - Judges 20:27
    kjvOsis:
    - Judg.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.28
    scripture: tanakh
    name: Tanakh Judges 20:28
    ref: Judges 20:28
    book: Judg
    section: neviim
    chapter: 20
    verse: 28
    ordinal: 7077
    text: 'and Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days—saying: ‘Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease?’ And the LORD said: ‘Go up; for to-morrow I will deliver him into thy hand.’'
    translation: JPS 1917
    original: וּפִינְחָס בֶּן־אֶלְעָזָר בֶּן־אַהֲרֹן עֹמֵד לְפָנָיו בַּיָּמִים הָהֵם לֵאמֹר הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה עִם־בְּנֵי־בִנְיָמִן אָחִי אִם־אֶחְדָּל וַיֹּאמֶר יְהוָה עֲלוּ כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ׃
    hebrewPlain: ופינחס בן אלעזר בן אהרן עמד לפניו בימים ההם לאמר האוסף עוד לצאת למלחמה עם בני בנימן אחי אם אחדל ויאמר יהוה עלו כי מחר אתננו בידך
    kjvRefs:
    - Judges 20:28
    kjvOsis:
    - Judg.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.29
    scripture: tanakh
    name: Tanakh Judges 20:29
    ref: Judges 20:29
    book: Judg
    section: neviim
    chapter: 20
    verse: 29
    ordinal: 7078
    text: And Israel set liers-in-wait against Gibeah round about.
    translation: JPS 1917
    original: וַיָּשֶׂם יִשְׂרָאֵל אֹרְבִים אֶל־הַגִּבְעָה סָבִיב׃
    hebrewPlain: וישם ישראל ארבים אל הגבעה סביב
    kjvRefs:
    - Judges 20:29
    kjvOsis:
    - Judg.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.30
    scripture: tanakh
    name: Tanakh Judges 20:30
    ref: Judges 20:30
    book: Judg
    section: neviim
    chapter: 20
    verse: 30
    ordinal: 7079
    text: And the children of Israel went up against the children of Benjamin on the third day, and set themselves in array against Gibeah, as at other times.
    translation: JPS 1917
    original: וַיַּעֲלוּ בְנֵי־יִשְׂרָאֵל אֶל־בְּנֵי בִנְיָמִן בַּיּוֹם הַשְּׁלִישִׁי וַיַּעַרְכוּ אֶל־הַגִּבְעָה כְּפַעַם בְּפָעַם׃
    hebrewPlain: ויעלו בני ישראל אל בני בנימן ביום השלישי ויערכו אל הגבעה כפעם בפעם
    kjvRefs:
    - Judges 20:30
    kjvOsis:
    - Judg.20.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.31
    scripture: tanakh
    name: Tanakh Judges 20:31
    ref: Judges 20:31
    book: Judg
    section: neviim
    chapter: 20
    verse: 31
    ordinal: 7080
    text: And the children of Benjamin went out against the people, and were drawn away from the city; and they began to smite and kill of the people, as at other times, in the field, in the highways, of which one goeth up to Beth-el, and the other to Gibeah, about thirty men of Israel.
    translation: JPS 1917
    original: וַיֵּצְאוּ בְנֵי־בִנְיָמִן לִקְרַאת הָעָם הָנְתְּקוּ מִן־הָעִיר וַיָּחֵלּוּ לְהַכּוֹת מֵהָעָם חֲלָלִים כְּפַעַם בְּפַעַם בַּמְסִלּוֹת אֲשֶׁר אַחַת עֹלָה בֵית־אֵל וְאַחַת גִּבְעָתָה בַּשָּׂדֶה כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל׃
    hebrewPlain: ויצאו בני בנימן לקראת העם הנתקו מן העיר ויחלו להכות מהעם חללים כפעם בפעם במסלות אשר אחת עלה בית אל ואחת גבעתה בשדה כשלשים איש בישראל
    kjvRefs:
    - Judges 20:31
    kjvOsis:
    - Judg.20.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.32
    scripture: tanakh
    name: Tanakh Judges 20:32
    ref: Judges 20:32
    book: Judg
    section: neviim
    chapter: 20
    verse: 32
    ordinal: 7081
    text: 'And the children of Benjamin said: ‘They are smitten down before us, as at the first.’ But the children of Israel said: ‘Let us flee, and draw them away from the city unto the highways.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ בְּנֵי בִנְיָמִן נִגָּפִים הֵם לְפָנֵינוּ כְּבָרִאשֹׁנָה וּבְנֵי יִשְׂרָאֵל אָמְרוּ נָנוּסָה וּנְתַקְּנֻהוּ מִן־הָעִיר אֶל־הַמְסִלּוֹת׃
    hebrewPlain: ויאמרו בני בנימן נגפים הם לפנינו כבראשנה ובני ישראל אמרו ננוסה ונתקנהו מן העיר אל המסלות
    kjvRefs:
    - Judges 20:32
    kjvOsis:
    - Judg.20.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.33
    scripture: tanakh
    name: Tanakh Judges 20:33
    ref: Judges 20:33
    book: Judg
    section: neviim
    chapter: 20
    verse: 33
    ordinal: 7082
    text: And all the men of Israel rose up out of their place, and set themselves in array at Baal-tamar; and the liers-in-wait of Israel broke forth out of their place, even out of Maareh-geba.
    translation: JPS 1917
    original: וְכֹל אִישׁ יִשְׂרָאֵל קָמוּ מִמְּקוֹמוֹ וַיַּעַרְכוּ בְּבַעַל תָּמָר וְאֹרֵב יִשְׂרָאֵל מֵגִיחַ מִמְּקֹמוֹ מִמַּעֲרֵה־גָבַע׃
    hebrewPlain: וכל איש ישראל קמו ממקומו ויערכו בבעל תמר וארב ישראל מגיח ממקמו ממערה גבע
    kjvRefs:
    - Judges 20:33
    kjvOsis:
    - Judg.20.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.34
    scripture: tanakh
    name: Tanakh Judges 20:34
    ref: Judges 20:34
    book: Judg
    section: neviim
    chapter: 20
    verse: 34
    ordinal: 7083
    text: And there came over against Gibeah ten thousand chosen men out of all Israel, and the battle was sore; but they knew not that evil was close upon them.
    translation: JPS 1917
    original: וַיָּבֹאוּ מִנֶּגֶד לַגִּבְעָה עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר מִכָּל־יִשְׂרָאֵל וְהַמִּלְחָמָה כָּבֵדָה וְהֵם לֹא יָדְעוּ כִּי־נֹגַעַת עֲלֵיהֶם הָרָעָה׃
    hebrewPlain: ויבאו מנגד לגבעה עשרת אלפים איש בחור מכל ישראל והמלחמה כבדה והם לא ידעו כי נגעת עליהם הרעה
    kjvRefs:
    - Judges 20:34
    kjvOsis:
    - Judg.20.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.35
    scripture: tanakh
    name: Tanakh Judges 20:35
    ref: Judges 20:35
    book: Judg
    section: neviim
    chapter: 20
    verse: 35
    ordinal: 7084
    text: And the LORD smote Benjamin before Israel; and the children of Israel destroyed of Benjamin that day twenty and five thousand and a hundred men; all these drew the sword.
    translation: JPS 1917
    original: וַיִּגֹּף יְהוָה אֶת־בִּנְיָמִן לִפְנֵי יִשְׂרָאֵל וַיַּשְׁחִיתוּ בְנֵי יִשְׂרָאֵל בְּבִנְיָמִן בַּיּוֹם הַהוּא עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ כָּל־אֵלֶּה שֹׁלֵף חָרֶב׃
    hebrewPlain: ויגף יהוה את בנימן לפני ישראל וישחיתו בני ישראל בבנימן ביום ההוא עשרים וחמשה אלף ומאה איש כל אלה שלף חרב
    kjvRefs:
    - Judges 20:35
    kjvOsis:
    - Judg.20.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.36
    scripture: tanakh
    name: Tanakh Judges 20:36
    ref: Judges 20:36
    book: Judg
    section: neviim
    chapter: 20
    verse: 36
    ordinal: 7085
    text: So the children of Benjamin saw that they were smitten. And the men of Israel gave place to Benjamin, because they trusted unto the liers-in-wait whom they had set against Gibeah.—
    translation: JPS 1917
    original: וַיִּרְאוּ בְנֵי־בִנְיָמִן כִּי נִגָּפוּ וַיִּתְּנוּ אִישׁ־יִשְׂרָאֵל מָקוֹם לְבִנְיָמִן כִּי בָטְחוּ אֶל־הָאֹרֵב אֲשֶׁר שָׂמוּ אֶל־הַגִּבְעָה׃
    hebrewPlain: ויראו בני בנימן כי נגפו ויתנו איש ישראל מקום לבנימן כי בטחו אל הארב אשר שמו אל הגבעה
    kjvRefs:
    - Judges 20:36
    kjvOsis:
    - Judg.20.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.37
    scripture: tanakh
    name: Tanakh Judges 20:37
    ref: Judges 20:37
    book: Judg
    section: neviim
    chapter: 20
    verse: 37
    ordinal: 7086
    text: And the liers-in-wait hastened, and rushed upon Gibeah; and the liers-in-wait drew forth, and smote all the city with the edge of the sword.
    translation: JPS 1917
    original: וְהָאֹרֵב הֵחִישׁוּ וַיִּפְשְׁטוּ אֶל־הַגִּבְעָה וַיִּמְשֹׁךְ הָאֹרֵב וַיַּךְ אֶת־כָּל־הָעִיר לְפִי־חָרֶב׃
    hebrewPlain: והארב החישו ויפשטו אל הגבעה וימשך הארב ויך את כל העיר לפי חרב
    kjvRefs:
    - Judges 20:37
    kjvOsis:
    - Judg.20.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.38
    scripture: tanakh
    name: Tanakh Judges 20:38
    ref: Judges 20:38
    book: Judg
    section: neviim
    chapter: 20
    verse: 38
    ordinal: 7087
    text: Now there was an appointed sign between the men of Israel and the liers-in-wait, that they should make a great beacon of smoke rise up out of the city.—
    translation: JPS 1917
    original: וְהַמּוֹעֵד הָיָה לְאִישׁ יִשְׂרָאֵל עִם־הָאֹרֵב הֶרֶב לְהַעֲלוֹתָם מַשְׂאַת הֶעָשָׁן מִן־הָעִיר׃
    hebrewPlain: והמועד היה לאיש ישראל עם הארב הרב להעלותם משאת העשן מן העיר
    kjvRefs:
    - Judges 20:38
    kjvOsis:
    - Judg.20.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.39
    scripture: tanakh
    name: Tanakh Judges 20:39
    ref: Judges 20:39
    book: Judg
    section: neviim
    chapter: 20
    verse: 39
    ordinal: 7088
    text: 'And the men of Israel turned in the battle, and Benjamin began to smite and kill of the men of Israel about thirty persons; for they said: ‘Surely they are smitten down before us, as in the first battle.’'
    translation: JPS 1917
    original: וַיַּהֲפֹךְ אִישׁ־יִשְׂרָאֵל בַּמִּלְחָמָה וּבִנְיָמִן הֵחֵל לְהַכּוֹת חֲלָלִים בְּאִישׁ־יִשְׂרָאֵל כִּשְׁלֹשִׁים אִישׁ כִּי אָמְרוּ אַךְ נִגּוֹף נִגָּף הוּא לְפָנֵינוּ כַּמִּלְחָמָה הָרִאשֹׁנָה׃
    hebrewPlain: ויהפך איש ישראל במלחמה ובנימן החל להכות חללים באיש ישראל כשלשים איש כי אמרו אך נגוף נגף הוא לפנינו כמלחמה הראשנה
    kjvRefs:
    - Judges 20:39
    kjvOsis:
    - Judg.20.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.40
    scripture: tanakh
    name: Tanakh Judges 20:40
    ref: Judges 20:40
    book: Judg
    section: neviim
    chapter: 20
    verse: 40
    ordinal: 7089
    text: But when the beacon began to arise up out of the city in a pillar of smoke, the Benjamites looked behind them, and, behold, the whole of the city went up in smoke to heaven.
    translation: JPS 1917
    original: וְהַמַּשְׂאֵת הֵחֵלָּה לַעֲלוֹת מִן־הָעִיר עַמּוּד עָשָׁן וַיִּפֶן בִּנְיָמִן אַחֲרָיו וְהִנֵּה עָלָה כְלִיל־הָעִיר הַשָּׁמָיְמָה׃
    hebrewPlain: והמשאת החלה לעלות מן העיר עמוד עשן ויפן בנימן אחריו והנה עלה כליל העיר השמימה
    kjvRefs:
    - Judges 20:40
    kjvOsis:
    - Judg.20.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.41
    scripture: tanakh
    name: Tanakh Judges 20:41
    ref: Judges 20:41
    book: Judg
    section: neviim
    chapter: 20
    verse: 41
    ordinal: 7090
    text: And the men of Israel turned, and the men of Benjamin were amazed; for they saw that evil was come upon them.
    translation: JPS 1917
    original: וְאִישׁ יִשְׂרָאֵל הָפַךְ וַיִּבָּהֵל אִישׁ בִּנְיָמִן כִּי רָאָה כִּי־נָגְעָה עָלָיו הָרָעָה׃
    hebrewPlain: ואיש ישראל הפך ויבהל איש בנימן כי ראה כי נגעה עליו הרעה
    kjvRefs:
    - Judges 20:41
    kjvOsis:
    - Judg.20.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.42
    scripture: tanakh
    name: Tanakh Judges 20:42
    ref: Judges 20:42
    book: Judg
    section: neviim
    chapter: 20
    verse: 42
    ordinal: 7091
    text: Therefore they turned their backs before the men of Israel unto the way of the wilderness; but the battle followed hard after them; and they that came out of the city destroyed them in the midst of the men of Israel.
    translation: JPS 1917
    original: וַיִּפְנוּ לִפְנֵי אִישׁ יִשְׂרָאֵל אֶל־דֶּרֶךְ הַמִּדְבָּר וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ וַאֲשֶׁר מֵהֶעָרִים מַשְׁחִיתִים אוֹתוֹ בְּתוֹכוֹ׃
    hebrewPlain: ויפנו לפני איש ישראל אל דרך המדבר והמלחמה הדביקתהו ואשר מהערים משחיתים אותו בתוכו
    kjvRefs:
    - Judges 20:42
    kjvOsis:
    - Judg.20.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.43
    scripture: tanakh
    name: Tanakh Judges 20:43
    ref: Judges 20:43
    book: Judg
    section: neviim
    chapter: 20
    verse: 43
    ordinal: 7092
    text: They inclosed the Benjamites round about, and chased them, and overtook them at their resting-place, as far as over against Gibeah toward the sunrising.
    translation: JPS 1917
    original: כִּתְּרוּ אֶת־בִּנְיָמִן הִרְדִיפֻהוּ מְנוּחָה הִדְרִיכֻהוּ עַד נֹכַח הַגִּבְעָה מִמִּזְרַח־שָׁמֶשׁ׃
    hebrewPlain: כתרו את בנימן הרדיפהו מנוחה הדריכהו עד נכח הגבעה ממזרח שמש
    kjvRefs:
    - Judges 20:43
    kjvOsis:
    - Judg.20.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.44
    scripture: tanakh
    name: Tanakh Judges 20:44
    ref: Judges 20:44
    book: Judg
    section: neviim
    chapter: 20
    verse: 44
    ordinal: 7093
    text: And there fell of Benjamin eighteen thousand men; all these were men of valour.
    translation: JPS 1917
    original: וַיִּפְּלוּ מִבִּנְיָמִן שְׁמֹנָה־עָשָׂר אֶלֶף אִישׁ אֶת־כָּל־אֵלֶּה אַנְשֵׁי־חָיִל׃
    hebrewPlain: ויפלו מבנימן שמנה עשר אלף איש את כל אלה אנשי חיל
    kjvRefs:
    - Judges 20:44
    kjvOsis:
    - Judg.20.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.45
    scripture: tanakh
    name: Tanakh Judges 20:45
    ref: Judges 20:45
    book: Judg
    section: neviim
    chapter: 20
    verse: 45
    ordinal: 7094
    text: And they turned and fled toward the wilderness unto the rock of Rimmon; and they gleaned of them in the highways five thousand men; and followed hard after them unto Gidom, and smote of them two thousand men.
    translation: JPS 1917
    original: וַיִּפְנוּ וַיָּנֻסוּ הַמִּדְבָּרָה אֶל־סֶלַע הָרִמּוֹן וַיְעֹלְלֻהוּ בַּמְסִלּוֹת חֲמֵשֶׁת אֲלָפִים אִישׁ וַיַּדְבִּיקוּ אַחֲרָיו עַד־גִּדְעֹם וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ׃
    hebrewPlain: ויפנו וינסו המדברה אל סלע הרמון ויעללהו במסלות חמשת אלפים איש וידביקו אחריו עד גדעם ויכו ממנו אלפים איש
    kjvRefs:
    - Judges 20:45
    kjvOsis:
    - Judg.20.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.46
    scripture: tanakh
    name: Tanakh Judges 20:46
    ref: Judges 20:46
    book: Judg
    section: neviim
    chapter: 20
    verse: 46
    ordinal: 7095
    text: So that all who fell that day of Benjamin were twenty and five thousand men that drew the sword; all these were men of valour.
    translation: JPS 1917
    original: וַיְהִי כָל־הַנֹּפְלִים מִבִּנְיָמִן עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ שֹׁלֵף חֶרֶב בַּיּוֹם הַהוּא אֶת־כָּל־אֵלֶּה אַנְשֵׁי־חָיִל׃
    hebrewPlain: ויהי כל הנפלים מבנימן עשרים וחמשה אלף איש שלף חרב ביום ההוא את כל אלה אנשי חיל
    kjvRefs:
    - Judges 20:46
    kjvOsis:
    - Judg.20.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.47
    scripture: tanakh
    name: Tanakh Judges 20:47
    ref: Judges 20:47
    book: Judg
    section: neviim
    chapter: 20
    verse: 47
    ordinal: 7096
    text: But six hundred men turned and fled toward the wilderness unto the rock of Rimmon, and abode in the rock of Rimmon four months.
    translation: JPS 1917
    original: וַיִּפְנוּ וַיָּנֻסוּ הַמִּדְבָּרָה אֶל־סֶלַע הָרִמּוֹן שֵׁשׁ מֵאוֹת אִישׁ וַיֵּשְׁבוּ בְּסֶלַע רִמּוֹן אַרְבָּעָה חֳדָשִׁים׃
    hebrewPlain: ויפנו וינסו המדברה אל סלע הרמון שש מאות איש וישבו בסלע רמון ארבעה חדשים
    kjvRefs:
    - Judges 20:47
    kjvOsis:
    - Judg.20.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.20.48
    scripture: tanakh
    name: Tanakh Judges 20:48
    ref: Judges 20:48
    book: Judg
    section: neviim
    chapter: 20
    verse: 48
    ordinal: 7097
    text: And the men of Israel turned back upon the children of Benjamin, and smote them with the edge of the sword, both the entire city, and the cattle, and all that they found; moreover all the cities which they found they set on fire.
    translation: JPS 1917
    original: וְאִישׁ יִשְׂרָאֵל שָׁבוּ אֶל־בְּנֵי בִנְיָמִן וַיַּכּוּם לְפִי־חֶרֶב מֵעִיר מְתֹם עַד־בְּהֵמָה עַד כָּל־הַנִּמְצָא גַּם כָּל־הֶעָרִים הַנִּמְצָאוֹת שִׁלְּחוּ בָאֵשׁ׃
    hebrewPlain: ואיש ישראל שבו אל בני בנימן ויכום לפי חרב מעיר מתם עד בהמה עד כל הנמצא גם כל הערים הנמצאות שלחו באש
    kjvRefs:
    - Judges 20:48
    kjvOsis:
    - Judg.20.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.20
- type: TanakhVerse
  data:
    osis: Judg.21.1
    scripture: tanakh
    name: Tanakh Judges 21:1
    ref: Judges 21:1
    book: Judg
    section: neviim
    chapter: 21
    verse: 1
    ordinal: 7098
    text: 'Now the men of Israel had sworn in Mizpah, saying: ‘There shall not any of us give his daughter unto Benjamin to wife.’'
    translation: JPS 1917
    original: וְאִישׁ יִשְׂרָאֵל נִשְׁבַּע בַּמִּצְפָּה לֵאמֹר אִישׁ מִמֶּנּוּ לֹא־יִתֵּן בִּתּוֹ לְבִנְיָמִן לְאִשָּׁה׃
    hebrewPlain: ואיש ישראל נשבע במצפה לאמר איש ממנו לא יתן בתו לבנימן לאשה
    kjvRefs:
    - Judges 21:1
    kjvOsis:
    - Judg.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.2
    scripture: tanakh
    name: Tanakh Judges 21:2
    ref: Judges 21:2
    book: Judg
    section: neviim
    chapter: 21
    verse: 2
    ordinal: 7099
    text: And the people came to Beth-el, and sat there till even before God, and lifted up their voices, and wept sore.
    translation: JPS 1917
    original: וַיָּבֹא הָעָם בֵּית־אֵל וַיֵּשְׁבוּ שָׁם עַד־הָעֶרֶב לִפְנֵי הָאֱלֹהִים וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ בְּכִי גָדוֹל׃
    hebrewPlain: ויבא העם בית אל וישבו שם עד הערב לפני האלהים וישאו קולם ויבכו בכי גדול
    kjvRefs:
    - Judges 21:2
    kjvOsis:
    - Judg.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.3
    scripture: tanakh
    name: Tanakh Judges 21:3
    ref: Judges 21:3
    book: Judg
    section: neviim
    chapter: 21
    verse: 3
    ordinal: 7100
    text: 'And they said: ‘O LORD, the God of Israel, why is this come to pass in Israel, that there should be to-day one tribe lacking in Israel?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לָמָה יְהוָה אֱלֹהֵי יִשְׂרָאֵל הָיְתָה זֹּאת בְּיִשְׂרָאֵל לְהִפָּקֵד הַיּוֹם מִיִּשְׂרָאֵל שֵׁבֶט אֶחָד׃
    hebrewPlain: ויאמרו למה יהוה אלהי ישראל היתה זאת בישראל להפקד היום מישראל שבט אחד
    kjvRefs:
    - Judges 21:3
    kjvOsis:
    - Judg.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.4
    scripture: tanakh
    name: Tanakh Judges 21:4
    ref: Judges 21:4
    book: Judg
    section: neviim
    chapter: 21
    verse: 4
    ordinal: 7101
    text: And it came to pass on the morrow that the people rose early, and built there an altar, and offered burnt-offerings and peace-offerings.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַיַּשְׁכִּימוּ הָעָם וַיִּבְנוּ־שָׁם מִזְבֵּחַ וַיַּעֲלוּ עֹלוֹת וּשְׁלָמִים׃
    hebrewPlain: ויהי ממחרת וישכימו העם ויבנו שם מזבח ויעלו עלות ושלמים
    kjvRefs:
    - Judges 21:4
    kjvOsis:
    - Judg.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.5
    scripture: tanakh
    name: Tanakh Judges 21:5
    ref: Judges 21:5
    book: Judg
    section: neviim
    chapter: 21
    verse: 5
    ordinal: 7102
    text: 'And the children of Israel said: ‘Who is there among all the tribes of Israel that came not up in the assembly unto the LORD?’ For they had made a great oath concerning him that came not up unto the LORD to Mizpah, saying: ‘He shall surely be put to death.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ בְּנֵי יִשְׂרָאֵל מִי אֲשֶׁר לֹא־עָלָה בַקָּהָל מִכָּל־שִׁבְטֵי יִשְׂרָאֵל אֶל־יְהוָה כִּי הַשְּׁבוּעָה הַגְּדוֹלָה הָיְתָה לַאֲשֶׁר לֹא־עָלָה אֶל־יְהוָה הַמִּצְפָּה לֵאמֹר מוֹת יוּמָת׃
    hebrewPlain: ויאמרו בני ישראל מי אשר לא עלה בקהל מכל שבטי ישראל אל יהוה כי השבועה הגדולה היתה לאשר לא עלה אל יהוה המצפה לאמר מות יומת
    kjvRefs:
    - Judges 21:5
    kjvOsis:
    - Judg.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.6
    scripture: tanakh
    name: Tanakh Judges 21:6
    ref: Judges 21:6
    book: Judg
    section: neviim
    chapter: 21
    verse: 6
    ordinal: 7103
    text: 'And the children of Israel repented them for Benjamin their brother, and said: ‘There is one tribe cut off from Israel this day.'
    translation: JPS 1917
    original: וַיִּנָּחֲמוּ בְּנֵי יִשְׂרָאֵל אֶל־בִּנְיָמִן אָחִיו וַיֹּאמְרוּ נִגְדַּע הַיּוֹם שֵׁבֶט אֶחָד מִיִּשְׂרָאֵל׃
    hebrewPlain: וינחמו בני ישראל אל בנימן אחיו ויאמרו נגדע היום שבט אחד מישראל
    kjvRefs:
    - Judges 21:6
    kjvOsis:
    - Judg.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.7
    scripture: tanakh
    name: Tanakh Judges 21:7
    ref: Judges 21:7
    book: Judg
    section: neviim
    chapter: 21
    verse: 7
    ordinal: 7104
    text: How shall we do for wives for them that remain, seeing we have sworn by the LORD that we will not give them of our daughters to wives?’
    translation: JPS 1917
    original: מַה־נַּעֲשֶׂה לָהֶם לַנּוֹתָרִים לְנָשִׁים וַאֲנַחְנוּ נִשְׁבַּעְנוּ בַיהוָה לְבִלְתִּי תֵּת־לָהֶם מִבְּנוֹתֵינוּ לְנָשִׁים׃
    hebrewPlain: מה נעשה להם לנותרים לנשים ואנחנו נשבענו ביהוה לבלתי תת להם מבנותינו לנשים
    kjvRefs:
    - Judges 21:7
    kjvOsis:
    - Judg.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.8
    scripture: tanakh
    name: Tanakh Judges 21:8
    ref: Judges 21:8
    book: Judg
    section: neviim
    chapter: 21
    verse: 8
    ordinal: 7105
    text: 'And they said: ‘What one is there of the tribes of Israel that came not up unto the LORD to Mizpah?’ And, behold, there came none to the camp from Jabesh-gilead to the assembly.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל אֲשֶׁר לֹא־עָלָה אֶל־יְהוָה הַמִּצְפָּה וְהִנֵּה לֹא בָא־אִישׁ אֶל־הַמַּחֲנֶה מִיָּבֵישׁ גִּלְעָד אֶל־הַקָּהָל׃
    hebrewPlain: ויאמרו מי אחד משבטי ישראל אשר לא עלה אל יהוה המצפה והנה לא בא איש אל המחנה מיביש גלעד אל הקהל
    kjvRefs:
    - Judges 21:8
    kjvOsis:
    - Judg.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.9
    scripture: tanakh
    name: Tanakh Judges 21:9
    ref: Judges 21:9
    book: Judg
    section: neviim
    chapter: 21
    verse: 9
    ordinal: 7106
    text: For when the people were numbered, behold, there were none of the inhabitants of Jabesh-gilead there.
    translation: JPS 1917
    original: וַיִּתְפָּקֵד הָעָם וְהִנֵּה אֵין־שָׁם אִישׁ מִיּוֹשְׁבֵי יָבֵשׁ גִּלְעָד׃
    hebrewPlain: ויתפקד העם והנה אין שם איש מיושבי יבש גלעד
    kjvRefs:
    - Judges 21:9
    kjvOsis:
    - Judg.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.10
    scripture: tanakh
    name: Tanakh Judges 21:10
    ref: Judges 21:10
    book: Judg
    section: neviim
    chapter: 21
    verse: 10
    ordinal: 7107
    text: 'And the congregation sent thither twelve thousand men of the valiantest, and commanded them, saying: ‘Go and smite the inhabitants of Jabesh-gilead with the edge of the sword, with the women and the little ones.'
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ־שָׁם הָעֵדָה שְׁנֵים־עָשָׂר אֶלֶף אִישׁ מִבְּנֵי הֶחָיִל וַיְצַוּוּ אוֹתָם לֵאמֹר לְכוּ וְהִכִּיתֶם אֶת־יוֹשְׁבֵי יָבֵשׁ גִּלְעָד לְפִי־חֶרֶב וְהַנָּשִׁים וְהַטָּף׃
    hebrewPlain: וישלחו שם העדה שנים עשר אלף איש מבני החיל ויצוו אותם לאמר לכו והכיתם את יושבי יבש גלעד לפי חרב והנשים והטף
    kjvRefs:
    - Judges 21:10
    kjvOsis:
    - Judg.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.11
    scripture: tanakh
    name: Tanakh Judges 21:11
    ref: Judges 21:11
    book: Judg
    section: neviim
    chapter: 21
    verse: 11
    ordinal: 7108
    text: 'And this is the thing that ye shall do: ye shall utterly destroy every male, and every woman that hath lain by man.’'
    translation: JPS 1917
    original: וְזֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ כָּל־זָכָר וְכָל־אִשָּׁה יֹדַעַת מִשְׁכַּב־זָכָר תַּחֲרִימוּ׃
    hebrewPlain: וזה הדבר אשר תעשו כל זכר וכל אשה ידעת משכב זכר תחרימו
    kjvRefs:
    - Judges 21:11
    kjvOsis:
    - Judg.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.12
    scripture: tanakh
    name: Tanakh Judges 21:12
    ref: Judges 21:12
    book: Judg
    section: neviim
    chapter: 21
    verse: 12
    ordinal: 7109
    text: And they found among the inhabitants of Jabesh-gilead four hundred young virgins, that had not known man by lying with him; and they brought them unto the camp to Shiloh, which is in the land of Canaan.
    translation: JPS 1917
    original: וַיִּמְצְאוּ מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד אַרְבַּע מֵאוֹת נַעֲרָה בְתוּלָה אֲשֶׁר לֹא־יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר וַיָּבִיאוּ אוֹתָם אֶל־הַמַּחֲנֶה שִׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן׃
    hebrewPlain: וימצאו מיושבי יביש גלעד ארבע מאות נערה בתולה אשר לא ידעה איש למשכב זכר ויביאו אותם אל המחנה שלה אשר בארץ כנען
    kjvRefs:
    - Judges 21:12
    kjvOsis:
    - Judg.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.13
    scripture: tanakh
    name: Tanakh Judges 21:13
    ref: Judges 21:13
    book: Judg
    section: neviim
    chapter: 21
    verse: 13
    ordinal: 7110
    text: And the whole congregation sent and spoke to the children of Benjamin that were in the rock of Rimmon, and proclaimed peace unto them.
    translation: JPS 1917
    original: וַיִּשְׁלְחוּ כָּל־הָעֵדָה וַיְדַבְּרוּ אֶל־בְּנֵי בִנְיָמִן אֲשֶׁר בְּסֶלַע רִמּוֹן וַיִּקְרְאוּ לָהֶם שָׁלוֹם׃
    hebrewPlain: וישלחו כל העדה וידברו אל בני בנימן אשר בסלע רמון ויקראו להם שלום
    kjvRefs:
    - Judges 21:13
    kjvOsis:
    - Judg.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.14
    scripture: tanakh
    name: Tanakh Judges 21:14
    ref: Judges 21:14
    book: Judg
    section: neviim
    chapter: 21
    verse: 14
    ordinal: 7111
    text: And Benjamin returned at that time; and they gave them the women whom they had saved alive of the women of Jabesh-gilead; and yet so they sufficed them not.
    translation: JPS 1917
    original: וַיָּשָׁב בִּנְיָמִן בָּעֵת הַהִיא וַיִּתְּנוּ לָהֶם הַנָּשִׁים אֲשֶׁר חִיּוּ מִנְּשֵׁי יָבֵשׁ גִּלְעָד וְלֹא־מָצְאוּ לָהֶם כֵּן׃
    hebrewPlain: וישב בנימן בעת ההיא ויתנו להם הנשים אשר חיו מנשי יבש גלעד ולא מצאו להם כן
    kjvRefs:
    - Judges 21:14
    kjvOsis:
    - Judg.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.15
    scripture: tanakh
    name: Tanakh Judges 21:15
    ref: Judges 21:15
    book: Judg
    section: neviim
    chapter: 21
    verse: 15
    ordinal: 7112
    text: And the people repented them for Benjamin, because that the LORD had made a breach in the tribes of Israel.
    translation: JPS 1917
    original: וְהָעָם נִחָם לְבִנְיָמִן כִּי־עָשָׂה יְהוָה פֶּרֶץ בְּשִׁבְטֵי יִשְׂרָאֵל׃
    hebrewPlain: והעם נחם לבנימן כי עשה יהוה פרץ בשבטי ישראל
    kjvRefs:
    - Judges 21:15
    kjvOsis:
    - Judg.21.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.16
    scripture: tanakh
    name: Tanakh Judges 21:16
    ref: Judges 21:16
    book: Judg
    section: neviim
    chapter: 21
    verse: 16
    ordinal: 7113
    text: 'Then the elders of the congregation said: ‘How shall we do for wives for them that remain, seeing the women are destroyed out of Benjamin?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ זִקְנֵי הָעֵדָה מַה־נַּעֲשֶׂה לַנּוֹתָרִים לְנָשִׁים כִּי־נִשְׁמְדָה מִבִּנְיָמִן אִשָּׁה׃
    hebrewPlain: ויאמרו זקני העדה מה נעשה לנותרים לנשים כי נשמדה מבנימן אשה
    kjvRefs:
    - Judges 21:16
    kjvOsis:
    - Judg.21.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.17
    scripture: tanakh
    name: Tanakh Judges 21:17
    ref: Judges 21:17
    book: Judg
    section: neviim
    chapter: 21
    verse: 17
    ordinal: 7114
    text: 'And they said: ‘They that are escaped must be as an inheritance for Benjamin, that a tribe be not blotted out from Israel.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ יְרֻשַּׁת פְּלֵיטָה לְבִנְיָמִן וְלֹא־יִמָּחֶה שֵׁבֶט מִיִּשְׂרָאֵל׃
    hebrewPlain: ויאמרו ירשת פליטה לבנימן ולא ימחה שבט מישראל
    kjvRefs:
    - Judges 21:17
    kjvOsis:
    - Judg.21.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.18
    scripture: tanakh
    name: Tanakh Judges 21:18
    ref: Judges 21:18
    book: Judg
    section: neviim
    chapter: 21
    verse: 18
    ordinal: 7115
    text: 'Howbeit we may not give them wives of our daughters.’ For the children of Israel had sworn, saying: ‘Cursed be he that giveth a wife to Benjamin.’'
    translation: JPS 1917
    original: וַאֲנַחְנוּ לֹא נוּכַל לָתֵת־לָהֶם נָשִׁים מִבְּנוֹתֵינוּ כִּי־נִשְׁבְּעוּ בְנֵי־יִשְׂרָאֵל לֵאמֹר אָרוּר נֹתֵן אִשָּׁה לְבִנְיָמִן׃
    hebrewPlain: ואנחנו לא נוכל לתת להם נשים מבנותינו כי נשבעו בני ישראל לאמר ארור נתן אשה לבנימן
    kjvRefs:
    - Judges 21:18
    kjvOsis:
    - Judg.21.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.19
    scripture: tanakh
    name: Tanakh Judges 21:19
    ref: Judges 21:19
    book: Judg
    section: neviim
    chapter: 21
    verse: 19
    ordinal: 7116
    text: 'And they said: ‘Behold, there is the feast of the LORD from year to year in Shiloh, which is on the north of Beth-el, on the east side of the highway that goeth up from Beth-el to Shechem, and on the south of Lebonah.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הִנֵּה חַג־יְהוָה בְּשִׁלוֹ מִיָּמִים יָמִימָה אֲשֶׁר מִצְּפוֹנָה לְבֵית־אֵל מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה הָעֹלָה מִבֵּית־אֵל שְׁכֶמָה וּמִנֶּגֶב לִלְבוֹנָה׃
    hebrewPlain: ויאמרו הנה חג יהוה בשלו מימים ימימה אשר מצפונה לבית אל מזרחה השמש למסלה העלה מבית אל שכמה ומנגב ללבונה
    kjvRefs:
    - Judges 21:19
    kjvOsis:
    - Judg.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.20
    scripture: tanakh
    name: Tanakh Judges 21:20
    ref: Judges 21:20
    book: Judg
    section: neviim
    chapter: 21
    verse: 20
    ordinal: 7117
    text: 'And they commanded the children of Benjamin, saying: ‘Go and lie in wait in the vineyards;'
    translation: JPS 1917
    original: ויצו [וַיְצַוּוּ] אֶת־בְּנֵי בִנְיָמִן לֵאמֹר לְכוּ וַאֲרַבְתֶּם בַּכְּרָמִים׃
    hebrewPlain: ויצו [ויצוו] את בני בנימן לאמר לכו וארבתם בכרמים
    kjvRefs:
    - Judges 21:20
    kjvOsis:
    - Judg.21.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.21
    scripture: tanakh
    name: Tanakh Judges 21:21
    ref: Judges 21:21
    book: Judg
    section: neviim
    chapter: 21
    verse: 21
    ordinal: 7118
    text: and see, and, behold, if the daughters of Shiloh come out to dance in the dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.
    translation: JPS 1917
    original: וּרְאִיתֶם וְהִנֵּה אִם־יֵצְאוּ בְנוֹת־שִׁילוֹ לָחוּל בַּמְּחֹלוֹת וִיצָאתֶם מִן־הַכְּרָמִים וַחֲטַפְתֶּם לָכֶם אִישׁ אִשְׁתּוֹ מִבְּנוֹת שִׁילוֹ וַהֲלַכְתֶּם אֶרֶץ בִּנְיָמִן׃
    hebrewPlain: וראיתם והנה אם יצאו בנות שילו לחול במחלות ויצאתם מן הכרמים וחטפתם לכם איש אשתו מבנות שילו והלכתם ארץ בנימן
    kjvRefs:
    - Judges 21:21
    kjvOsis:
    - Judg.21.21
