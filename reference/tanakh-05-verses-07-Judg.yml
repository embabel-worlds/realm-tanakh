  data:
    osis: Judg.5.30
    scripture: tanakh
    name: Tanakh Judges 5:30
    ref: Judges 5:30
    book: Judg
    section: neviim
    chapter: 5
    verse: 30
    ordinal: 6648
    text: ’Are they not finding, are they not dividing the spoil? A damsel, two damsels to every man; To Sisera a spoil of dyed garments, A spoil of dyed garments of embroidery, Two dyed garments of broidery for the neck of every spoiler?’
    translation: JPS 1917
    original: הֲלֹא יִמְצְאוּ יְחַלְּקוּ שָׁלָל רַחַם רַחֲמָתַיִם לְרֹאשׁ גֶּבֶר שְׁלַל צְבָעִים לְסִיסְרָא שְׁלַל צְבָעִים רִקְמָה צֶבַע רִקְמָתַיִם לְצַוְּארֵי שָׁלָל׃
    hebrewPlain: הלא ימצאו יחלקו שלל רחם רחמתים לראש גבר שלל צבעים לסיסרא שלל צבעים רקמה צבע רקמתים לצוארי שלל
    kjvRefs:
    - Judges 5:30
    kjvOsis:
    - Judg.5.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.31
    scripture: tanakh
    name: Tanakh Judges 5:31
    ref: Judges 5:31
    book: Judg
    section: neviim
    chapter: 5
    verse: 31
    ordinal: 6649
    text: So perish all Thine enemies, O LORD; But they that love Him be as the sun when he goeth forth in his might. And the land had rest forty years.
    translation: JPS 1917
    original: כֵּן יֹאבְדוּ כָל־אוֹיְבֶיךָ יְהוָה וְאֹהֲבָיו כְּצֵאת הַשֶּׁמֶשׁ בִּגְבֻרָתוֹ וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה׃
    hebrewPlain: כן יאבדו כל אויביך יהוה ואהביו כצאת השמש בגברתו ותשקט הארץ ארבעים שנה
    kjvRefs:
    - Judges 5:31
    kjvOsis:
    - Judg.5.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.6.1
    scripture: tanakh
    name: Tanakh Judges 6:1
    ref: Judges 6:1
    book: Judg
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 6650
    text: And the children of Israel did that which was evil in the sight of the LORD; and the LORD delivered them into the hand of Midian seven years.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ בְנֵי־יִשְׂרָאֵל הָרַע בְּעֵינֵי יְהוָה וַיִּתְּנֵם יְהוָה בְּיַד־מִדְיָן שֶׁבַע שָׁנִים׃
    hebrewPlain: ויעשו בני ישראל הרע בעיני יהוה ויתנם יהוה ביד מדין שבע שנים
    kjvRefs:
    - Judges 6:1
    kjvOsis:
    - Judg.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.2
    scripture: tanakh
    name: Tanakh Judges 6:2
    ref: Judges 6:2
    book: Judg
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 6651
    text: And the hand of Midian prevailed against Israel; and because of Midian the children of Israel made them the dens which are in the mountains, and the caves, and the strongholds.
    translation: JPS 1917
    original: וַתָּעָז יַד־מִדְיָן עַל־יִשְׂרָאֵל מִפְּנֵי מִדְיָן עָשׂוּ לָהֶם בְּנֵי יִשְׂרָאֵל אֶת־הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים וְאֶת־הַמְּעָרוֹת וְאֶת־הַמְּצָדוֹת׃
    hebrewPlain: ותעז יד מדין על ישראל מפני מדין עשו להם בני ישראל את המנהרות אשר בהרים ואת המערות ואת המצדות
    kjvRefs:
    - Judges 6:2
    kjvOsis:
    - Judg.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.3
    scripture: tanakh
    name: Tanakh Judges 6:3
    ref: Judges 6:3
    book: Judg
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 6652
    text: And so it was, when Israel had sown, that the Midianites came up, and the Amalekites, and the children of the east; they came up against them;
    translation: JPS 1917
    original: וְהָיָה אִם־זָרַע יִשְׂרָאֵל וְעָלָה מִדְיָן וַעֲמָלֵק וּבְנֵי־קֶדֶם וְעָלוּ עָלָיו׃
    hebrewPlain: והיה אם זרע ישראל ועלה מדין ועמלק ובני קדם ועלו עליו
    kjvRefs:
    - Judges 6:3
    kjvOsis:
    - Judg.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.4
    scripture: tanakh
    name: Tanakh Judges 6:4
    ref: Judges 6:4
    book: Judg
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 6653
    text: and they encamped against them, and destroyed the produce of the earth, till thou come unto Gaza, and left no sustenance in Israel, neither sheep, nor ox, nor ass.
    translation: JPS 1917
    original: וַיַּחֲנוּ עֲלֵיהֶם וַיַּשְׁחִיתוּ אֶת־יְבוּל הָאָרֶץ עַד־בּוֹאֲךָ עַזָּה וְלֹא־יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל וְשֶׂה וָשׁוֹר וַחֲמוֹר׃
    hebrewPlain: ויחנו עליהם וישחיתו את יבול הארץ עד בואך עזה ולא ישאירו מחיה בישראל ושה ושור וחמור
    kjvRefs:
    - Judges 6:4
    kjvOsis:
    - Judg.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.5
    scripture: tanakh
    name: Tanakh Judges 6:5
    ref: Judges 6:5
    book: Judg
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 6654
    text: For they came up with their cattle and their tents, and they came in as locusts for multitude; both they and their camels were without number; and they came into the land to destroy it.
    translation: JPS 1917
    original: כִּי הֵם וּמִקְנֵיהֶם יַעֲלוּ וְאָהֳלֵיהֶם יבאו [וּבָאוּ] כְדֵי־אַרְבֶּה לָרֹב וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר וַיָּבֹאוּ בָאָרֶץ לְשַׁחֲתָהּ׃
    hebrewPlain: כי הם ומקניהם יעלו ואהליהם יבאו [ובאו] כדי ארבה לרב ולהם ולגמליהם אין מספר ויבאו בארץ לשחתה
    kjvRefs:
    - Judges 6:5
    kjvOsis:
    - Judg.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.6
    scripture: tanakh
    name: Tanakh Judges 6:6
    ref: Judges 6:6
    book: Judg
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 6655
    text: And Israel was brought very low because of Midian; and the children of Israel cried unto the LORD.
    translation: JPS 1917
    original: וַיִּדַּל יִשְׂרָאֵל מְאֹד מִפְּנֵי מִדְיָן וַיִּזְעֲקוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה׃
    hebrewPlain: וידל ישראל מאד מפני מדין ויזעקו בני ישראל אל יהוה
    kjvRefs:
    - Judges 6:6
    kjvOsis:
    - Judg.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.7
    scripture: tanakh
    name: Tanakh Judges 6:7
    ref: Judges 6:7
    book: Judg
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 6656
    text: And it came to pass, when the children of Israel cried unto the LORD because of Midian,
    translation: JPS 1917
    original: וַיְהִי כִּי־זָעֲקוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה עַל אֹדוֹת מִדְיָן׃
    hebrewPlain: ויהי כי זעקו בני ישראל אל יהוה על אדות מדין
    kjvRefs:
    - Judges 6:7
    kjvOsis:
    - Judg.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.8
    scripture: tanakh
    name: Tanakh Judges 6:8
    ref: Judges 6:8
    book: Judg
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 6657
    text: 'that the LORD sent a prophet unto the children of Israel; and he said unto them: ‘Thus saith the LORD, the God of Israel: I brought you up from Egypt, and brought you forth out of the house of bondage;'
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוָה אִישׁ נָבִיא אֶל־בְּנֵי יִשְׂרָאֵל וַיֹּאמֶר לָהֶם כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אָנֹכִי הֶעֱלֵיתִי אֶתְכֶם מִמִּצְרַיִם וָאֹצִיא אֶתְכֶם מִבֵּית עֲבָדִים׃
    hebrewPlain: וישלח יהוה איש נביא אל בני ישראל ויאמר להם כה אמר יהוה אלהי ישראל אנכי העליתי אתכם ממצרים ואציא אתכם מבית עבדים
    kjvRefs:
    - Judges 6:8
    kjvOsis:
    - Judg.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.9
    scripture: tanakh
    name: Tanakh Judges 6:9
    ref: Judges 6:9
    book: Judg
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 6658
    text: and I delivered you out of the hand of the Egyptians, and out of the hand of all that oppressed you, and drove them out from before you, and gave you their land.
    translation: JPS 1917
    original: וָאַצִּל אֶתְכֶם מִיַּד מִצְרַיִם וּמִיַּד כָּל־לֹחֲצֵיכֶם וָאֲגָרֵשׁ אוֹתָם מִפְּנֵיכֶם וָאֶתְּנָה לָכֶם אֶת־אַרְצָם׃
    hebrewPlain: ואצל אתכם מיד מצרים ומיד כל לחציכם ואגרש אותם מפניכם ואתנה לכם את ארצם
    kjvRefs:
    - Judges 6:9
    kjvOsis:
    - Judg.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.10
    scripture: tanakh
    name: Tanakh Judges 6:10
    ref: Judges 6:10
    book: Judg
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 6659
    text: 'And I said unto you: I am the LORD your God; ye shall not fear the gods of the Amorites, in whose land ye dwell; but ye have not hearkened unto My voice.’'
    translation: JPS 1917
    original: וָאֹמְרָה לָכֶם אֲנִי יְהוָה אֱלֹהֵיכֶם לֹא תִירְאוּ אֶת־אֱלֹהֵי הָאֱמֹרִי אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם וְלֹא שְׁמַעְתֶּם בְּקוֹלִי׃
    hebrewPlain: ואמרה לכם אני יהוה אלהיכם לא תיראו את אלהי האמרי אשר אתם יושבים בארצם ולא שמעתם בקולי
    kjvRefs:
    - Judges 6:10
    kjvOsis:
    - Judg.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.11
    scripture: tanakh
    name: Tanakh Judges 6:11
    ref: Judges 6:11
    book: Judg
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 6660
    text: And the angel of the LORD came, and sat under the terebinth which was in Ophrah, that belonged unto Joash the Abiezrite; and his son Gideon was beating out wheat in the winepress, to hide it from the Midianites.
    translation: JPS 1917
    original: וַיָּבֹא מַלְאַךְ יְהוָה וַיֵּשֶׁב תַּחַת הָאֵלָה אֲשֶׁר בְּעָפְרָה אֲשֶׁר לְיוֹאָשׁ אֲבִי הָעֶזְרִי וְגִדְעוֹן בְּנוֹ חֹבֵט חִטִּים בַּגַּת לְהָנִיס מִפְּנֵי מִדְיָן׃
    hebrewPlain: ויבא מלאך יהוה וישב תחת האלה אשר בעפרה אשר ליואש אבי העזרי וגדעון בנו חבט חטים בגת להניס מפני מדין
    kjvRefs:
    - Judges 6:11
    kjvOsis:
    - Judg.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.12
    scripture: tanakh
    name: Tanakh Judges 6:12
    ref: Judges 6:12
    book: Judg
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 6661
    text: 'And the angel of the LORD appeared unto him, and said unto him: ‘The LORD is with thee, thou mighty man of valour.’'
    translation: JPS 1917
    original: וַיֵּרָא אֵלָיו מַלְּאַךְ יְהוָה וַיֹּאמֶר אֵלָיו יְהוָה עִמְּךָ גִּבּוֹר הֶחָיִל׃
    hebrewPlain: וירא אליו מלאך יהוה ויאמר אליו יהוה עמך גבור החיל
    kjvRefs:
    - Judges 6:12
    kjvOsis:
    - Judg.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.13
    scripture: tanakh
    name: Tanakh Judges 6:13
    ref: Judges 6:13
    book: Judg
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 6662
    text: 'And Gideon said unto him: ‘Oh, my lord, if the LORD be with us, why then is all this befallen us? and where are all His wondrous works which our fathers told us of, saying: Did not the LORD bring us up from Egypt? but now the LORD hath cast us off, and delivered us into the hand of Midian.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו גִּדְעוֹן בִּי אֲדֹנִי וְיֵשׁ יְהוָה עִמָּנוּ וְלָמָּה מְצָאַתְנוּ כָּל־זֹאת וְאַיֵּה כָל־נִפְלְאֹתָיו אֲשֶׁר סִפְּרוּ־לָנוּ אֲבוֹתֵינוּ לֵאמֹר הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה וְעַתָּה נְטָשָׁנוּ יְהוָה וַיִּתְּנֵנוּ בְּכַף־מִדְיָן׃
    hebrewPlain: ויאמר אליו גדעון בי אדני ויש יהוה עמנו ולמה מצאתנו כל זאת ואיה כל נפלאתיו אשר ספרו לנו אבותינו לאמר הלא ממצרים העלנו יהוה ועתה נטשנו יהוה ויתננו בכף מדין
    kjvRefs:
    - Judges 6:13
    kjvOsis:
    - Judg.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.14
    scripture: tanakh
    name: Tanakh Judges 6:14
    ref: Judges 6:14
    book: Judg
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 6663
    text: 'And the LORD turned towards him, and said: ‘Go in this thy might, and save Israel from the hand of Midian; have not I sent thee?’'
    translation: JPS 1917
    original: וַיִּפֶן אֵלָיו יְהוָה וַיֹּאמֶר לֵךְ בְּכֹחֲךָ זֶה וְהוֹשַׁעְתָּ אֶת־יִשְׂרָאֵל מִכַּף מִדְיָן הֲלֹא שְׁלַחְתִּיךָ׃
    hebrewPlain: ויפן אליו יהוה ויאמר לך בכחך זה והושעת את ישראל מכף מדין הלא שלחתיך
    kjvRefs:
    - Judges 6:14
    kjvOsis:
    - Judg.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.15
    scripture: tanakh
    name: Tanakh Judges 6:15
    ref: Judges 6:15
    book: Judg
    section: neviim
    chapter: 6
    verse: 15
    ordinal: 6664
    text: 'And he said unto him: ‘Oh, my lord, wherewith shall I save Israel? behold, my family is the poorest in Manasseh, and I am the least in my father’s house.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו בִּי אֲדֹנָי בַּמָּה אוֹשִׁיעַ אֶת־יִשְׂרָאֵל הִנֵּה אַלְפִּי הַדַּל בִּמְנַשֶּׁה וְאָנֹכִי הַצָּעִיר בְּבֵית אָבִי׃
    hebrewPlain: ויאמר אליו בי אדני במה אושיע את ישראל הנה אלפי הדל במנשה ואנכי הצעיר בבית אבי
    kjvRefs:
    - Judges 6:15
    kjvOsis:
    - Judg.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.16
    scripture: tanakh
    name: Tanakh Judges 6:16
    ref: Judges 6:16
    book: Judg
    section: neviim
    chapter: 6
    verse: 16
    ordinal: 6665
    text: 'And the LORD said unto him: ‘Surely I will be with thee, and thou shalt smite the Midianites as one man.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו יְהוָה כִּי אֶהְיֶה עִמָּךְ וְהִכִּיתָ אֶת־מִדְיָן כְּאִישׁ אֶחָד׃
    hebrewPlain: ויאמר אליו יהוה כי אהיה עמך והכית את מדין כאיש אחד
    kjvRefs:
    - Judges 6:16
    kjvOsis:
    - Judg.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.17
    scripture: tanakh
    name: Tanakh Judges 6:17
    ref: Judges 6:17
    book: Judg
    section: neviim
    chapter: 6
    verse: 17
    ordinal: 6666
    text: 'And he said unto him: ‘If now I have found favour in thy sight, then show me a sign that it is thou that talkest with me.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו אִם־נָא מָצָאתִי חֵן בְּעֵינֶיךָ וְעָשִׂיתָ לִּי אוֹת שָׁאַתָּה מְדַבֵּר עִמִּי׃
    hebrewPlain: ויאמר אליו אם נא מצאתי חן בעיניך ועשית לי אות שאתה מדבר עמי
    kjvRefs:
    - Judges 6:17
    kjvOsis:
    - Judg.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.18
    scripture: tanakh
    name: Tanakh Judges 6:18
    ref: Judges 6:18
    book: Judg
    section: neviim
    chapter: 6
    verse: 18
    ordinal: 6667
    text: 'Depart not hence, I pray thee, until I come unto thee, and bring forth my present, and lay it before thee.’ And he said: ‘I will tarry until thou come back.’'
    translation: JPS 1917
    original: אַל־נָא תָמֻשׁ מִזֶּה עַד־בֹּאִי אֵלֶיךָ וְהֹצֵאתִי אֶת־מִנְחָתִי וְהִנַּחְתִּי לְפָנֶיךָ וַיֹּאמַר אָנֹכִי אֵשֵׁב עַד שׁוּבֶךָ׃
    hebrewPlain: אל נא תמש מזה עד באי אליך והצאתי את מנחתי והנחתי לפניך ויאמר אנכי אשב עד שובך
    kjvRefs:
    - Judges 6:18
    kjvOsis:
    - Judg.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.19
    scripture: tanakh
    name: Tanakh Judges 6:19
    ref: Judges 6:19
    book: Judg
    section: neviim
    chapter: 6
    verse: 19
    ordinal: 6668
    text: And Gideon went in, and made ready a kid, and unleavened cakes of an ephah of meal; the flesh he put in a basket, and he put the broth in a pot, and brought it out unto him under the terebinth, and presented it.
    translation: JPS 1917
    original: וְגִדְעוֹן בָּא וַיַּעַשׂ גְּדִי־עִזִּים וְאֵיפַת־קֶמַח מַצּוֹת הַבָּשָׂר שָׂם בַּסַּל וְהַמָּרַק שָׂם בַּפָּרוּר וַיּוֹצֵא אֵלָיו אֶל־תַּחַת הָאֵלָה וַיַּגַּשׁ׃
    hebrewPlain: וגדעון בא ויעש גדי עזים ואיפת קמח מצות הבשר שם בסל והמרק שם בפרור ויוצא אליו אל תחת האלה ויגש
    kjvRefs:
    - Judges 6:19
    kjvOsis:
    - Judg.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.20
    scripture: tanakh
    name: Tanakh Judges 6:20
    ref: Judges 6:20
    book: Judg
    section: neviim
    chapter: 6
    verse: 20
    ordinal: 6669
    text: 'And the angel of God said unto him: ‘Take the flesh and the unleavened cakes, and lay them upon this rock, and pour out the broth.’ And he did so.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו מַלְאַךְ הָאֱלֹהִים קַח אֶת־הַבָּשָׂר וְאֶת־הַמַּצּוֹת וְהַנַּח אֶל־הַסֶּלַע הַלָּז וְאֶת־הַמָּרַק שְׁפוֹךְ וַיַּעַשׂ כֵּן׃
    hebrewPlain: ויאמר אליו מלאך האלהים קח את הבשר ואת המצות והנח אל הסלע הלז ואת המרק שפוך ויעש כן
    kjvRefs:
    - Judges 6:20
    kjvOsis:
    - Judg.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.21
    scripture: tanakh
    name: Tanakh Judges 6:21
    ref: Judges 6:21
    book: Judg
    section: neviim
    chapter: 6
    verse: 21
    ordinal: 6670
    text: Then the angel of the LORD put forth the end of the staff that was in his hand, and touched the flesh and the unleavened cakes; and there went up fire out of the rock, and consumed the flesh and the unleavened cakes; and the angel of the LORD departed out of his sight.
    translation: JPS 1917
    original: וַיִּשְׁלַח מַלְאַךְ יְהוָה אֶת־קְצֵה הַמִּשְׁעֶנֶת אֲשֶׁר בְּיָדוֹ וַיִּגַּע בַּבָּשָׂר וּבַמַּצּוֹת וַתַּעַל הָאֵשׁ מִן־הַצּוּר וַתֹּאכַל אֶת־הַבָּשָׂר וְאֶת־הַמַּצּוֹת וּמַלְאַךְ יְהוָה הָלַךְ מֵעֵינָיו׃
    hebrewPlain: וישלח מלאך יהוה את קצה המשענת אשר בידו ויגע בבשר ובמצות ותעל האש מן הצור ותאכל את הבשר ואת המצות ומלאך יהוה הלך מעיניו
    kjvRefs:
    - Judges 6:21
    kjvOsis:
    - Judg.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.22
    scripture: tanakh
    name: Tanakh Judges 6:22
    ref: Judges 6:22
    book: Judg
    section: neviim
    chapter: 6
    verse: 22
    ordinal: 6671
    text: 'And Gideon saw that he was the angel of the LORD; and Gideon said: ‘Alas, O Lord GOD! forasmuch as I have seen the angel of the LORD face to face.’'
    translation: JPS 1917
    original: וַיַּרְא גִּדְעוֹן כִּי־מַלְאַךְ יְהוָה הוּא וַיֹּאמֶר גִּדְעוֹן אֲהָהּ אֲדֹנָי יְהוִה כִּי־עַל־כֵּן רָאִיתִי מַלְאַךְ יְהוָה פָּנִים אֶל־פָּנִים׃
    hebrewPlain: וירא גדעון כי מלאך יהוה הוא ויאמר גדעון אהה אדני יהוה כי על כן ראיתי מלאך יהוה פנים אל פנים
    kjvRefs:
    - Judges 6:22
    kjvOsis:
    - Judg.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.23
    scripture: tanakh
    name: Tanakh Judges 6:23
    ref: Judges 6:23
    book: Judg
    section: neviim
    chapter: 6
    verse: 23
    ordinal: 6672
    text: 'And the LORD said unto him: ‘Peace be unto thee; fear not; thou shalt not die.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ יְהוָה שָׁלוֹם לְךָ אַל־תִּירָא לֹא תָּמוּת׃
    hebrewPlain: ויאמר לו יהוה שלום לך אל תירא לא תמות
    kjvRefs:
    - Judges 6:23
    kjvOsis:
    - Judg.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.24
    scripture: tanakh
    name: Tanakh Judges 6:24
    ref: Judges 6:24
    book: Judg
    section: neviim
    chapter: 6
    verse: 24
    ordinal: 6673
    text: Then Gideon built an altar there unto the LORD, and called it a‘Adonai-shalom’; unto this day it is yet in Ophrah of the Abiezrites.
    translation: JPS 1917
    original: וַיִּבֶן שָׁם גִּדְעוֹן מִזְבֵּחַ לַיהוָה וַיִּקְרָא־לוֹ יְהוָה שָׁלוֹם עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ בְּעָפְרָת אֲבִי הָעֶזְרִי׃
    hebrewPlain: ויבן שם גדעון מזבח ליהוה ויקרא לו יהוה שלום עד היום הזה עודנו בעפרת אבי העזרי
    kjvRefs:
    - Judges 6:24
    kjvOsis:
    - Judg.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.25
    scripture: tanakh
    name: Tanakh Judges 6:25
    ref: Judges 6:25
    book: Judg
    section: neviim
    chapter: 6
    verse: 25
    ordinal: 6674
    text: 'And it came to pass the same night, that the LORD said unto him: ‘Take thy father’s bullock, and the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the Asherah that is by it;'
    translation: JPS 1917
    original: וַיְהִי בַּלַּיְלָה הַהוּא וַיֹּאמֶר לוֹ יְהוָה קַח אֶת־פַּר־הַשּׁוֹר אֲשֶׁר לְאָבִיךָ וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים וְהָרַסְתָּ אֶת־מִזְבַּח הַבַּעַל אֲשֶׁר לְאָבִיךָ וְאֶת־הָאֲשֵׁרָה אֲשֶׁר־עָלָיו תִּכְרֹת׃
    hebrewPlain: ויהי בלילה ההוא ויאמר לו יהוה קח את פר השור אשר לאביך ופר השני שבע שנים והרסת את מזבח הבעל אשר לאביך ואת האשרה אשר עליו תכרת
    kjvRefs:
    - Judges 6:25
    kjvOsis:
    - Judg.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.26
    scripture: tanakh
    name: Tanakh Judges 6:26
    ref: Judges 6:26
    book: Judg
    section: neviim
    chapter: 6
    verse: 26
    ordinal: 6675
    text: and build an altar unto the LORD thy God upon the top of this stronghold, in the ordered place, and take the second bullock, and offer a burnt-offering with the wood of the Asherah which thou shalt cut down.’
    translation: JPS 1917
    original: וּבָנִיתָ מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ עַל רֹאשׁ הַמָּעוֹז הַזֶּה בַּמַּעֲרָכָה וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי וְהַעֲלִיתָ עוֹלָה בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת׃
    hebrewPlain: ובנית מזבח ליהוה אלהיך על ראש המעוז הזה במערכה ולקחת את הפר השני והעלית עולה בעצי האשרה אשר תכרת
    kjvRefs:
    - Judges 6:26
    kjvOsis:
    - Judg.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.27
    scripture: tanakh
    name: Tanakh Judges 6:27
    ref: Judges 6:27
    book: Judg
    section: neviim
    chapter: 6
    verse: 27
    ordinal: 6676
    text: Then Gideon took ten men of his servants, and did as the LORD had spoken unto him; and it came to pass, because he feared his father’s household and the men of the city, so that he could not do it by day, that he did it by night.
    translation: JPS 1917
    original: וַיִּקַּח גִּדְעוֹן עֲשָׂרָה אֲנָשִׁים מֵעֲבָדָיו וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה וַיְהִי כַּאֲשֶׁר יָרֵא אֶת־בֵּית אָבִיו וְאֶת־אַנְשֵׁי הָעִיר מֵעֲשׂוֹת יוֹמָם וַיַּעַשׂ לָיְלָה׃
    hebrewPlain: ויקח גדעון עשרה אנשים מעבדיו ויעש כאשר דבר אליו יהוה ויהי כאשר ירא את בית אביו ואת אנשי העיר מעשות יומם ויעש לילה
    kjvRefs:
    - Judges 6:27
    kjvOsis:
    - Judg.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.28
    scripture: tanakh
    name: Tanakh Judges 6:28
    ref: Judges 6:28
    book: Judg
    section: neviim
    chapter: 6
    verse: 28
    ordinal: 6677
    text: And when the men of the city arose early in the morning, behold, the altar of Baal was broken down, and the Asherah was cut down that was by it, and the second bullock was offered upon the altar that was built.
    translation: JPS 1917
    original: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר וְהִנֵּה נֻתַּץ מִזְבַּח הַבַּעַל וְהָאֲשֵׁרָה אֲשֶׁר־עָלָיו כֹּרָתָה וְאֵת הַפָּר הַשֵּׁנִי הֹעֲלָה עַל־הַמִּזְבֵּחַ הַבָּנוּי׃
    hebrewPlain: וישכימו אנשי העיר בבקר והנה נתץ מזבח הבעל והאשרה אשר עליו כרתה ואת הפר השני העלה על המזבח הבנוי
    kjvRefs:
    - Judges 6:28
    kjvOsis:
    - Judg.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.29
    scripture: tanakh
    name: Tanakh Judges 6:29
    ref: Judges 6:29
    book: Judg
    section: neviim
    chapter: 6
    verse: 29
    ordinal: 6678
    text: 'And they said one to another: ‘Who hath done this thing?’ And when they inquired and asked, they said: ‘Gideon the son of Joash hath done this thing.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ מִי עָשָׂה הַדָּבָר הַזֶּה וַיִּדְרְשׁוּ וַיְבַקְשׁוּ וַיֹּאמְרוּ גִּדְעוֹן בֶּן־יוֹאָשׁ עָשָׂה הַדָּבָר הַזֶּה׃
    hebrewPlain: ויאמרו איש אל רעהו מי עשה הדבר הזה וידרשו ויבקשו ויאמרו גדעון בן יואש עשה הדבר הזה
    kjvRefs:
    - Judges 6:29
    kjvOsis:
    - Judg.6.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.30
    scripture: tanakh
    name: Tanakh Judges 6:30
    ref: Judges 6:30
    book: Judg
    section: neviim
    chapter: 6
    verse: 30
    ordinal: 6679
    text: 'Then the men of the city said unto Joash: ‘Bring out thy son, that he may die; because he hath broken down the altar of Baal, and because he hath cut down the Asherah that was by it.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אַנְשֵׁי הָעִיר אֶל־יוֹאָשׁ הוֹצֵא אֶת־בִּנְךָ וְיָמֹת כִּי נָתַץ אֶת־מִזְבַּח הַבַּעַל וְכִי כָרַת הָאֲשֵׁרָה אֲשֶׁר־עָלָיו׃
    hebrewPlain: ויאמרו אנשי העיר אל יואש הוצא את בנך וימת כי נתץ את מזבח הבעל וכי כרת האשרה אשר עליו
    kjvRefs:
    - Judges 6:30
    kjvOsis:
    - Judg.6.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.31
    scripture: tanakh
    name: Tanakh Judges 6:31
    ref: Judges 6:31
    book: Judg
    section: neviim
    chapter: 6
    verse: 31
    ordinal: 6680
    text: 'And Joash said unto all that stood against him: ‘Will ye contend for Baal? or will ye save him? he that will contend for him, shall be put to death before morning; if he be a god, let him contend for himself, because one hath broken down his altar.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יוֹאָשׁ לְכֹל אֲשֶׁר־עָמְדוּ עָלָיו הַאַתֶּם תְּרִיבוּן לַבַּעַל אִם־אַתֶּם תּוֹשִׁיעוּן אוֹתוֹ אֲשֶׁר יָרִיב לוֹ יוּמַת עַד־הַבֹּקֶר אִם־אֱלֹהִים הוּא יָרֶב לוֹ כִּי נָתַץ אֶת־מִזְבְּחוֹ׃
    hebrewPlain: ויאמר יואש לכל אשר עמדו עליו האתם תריבון לבעל אם אתם תושיעון אותו אשר יריב לו יומת עד הבקר אם אלהים הוא ירב לו כי נתץ את מזבחו
    kjvRefs:
    - Judges 6:31
    kjvOsis:
    - Judg.6.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.32
    scripture: tanakh
    name: Tanakh Judges 6:32
    ref: Judges 6:32
    book: Judg
    section: neviim
    chapter: 6
    verse: 32
    ordinal: 6681
    text: 'Therefore on that day he was called Jerubbaal, saying: ‘Let Baal contend against him, because he hath broken down his altar.’'
    translation: JPS 1917
    original: וַיִּקְרָא־לוֹ בַיּוֹם־הַהוּא יְרֻבַּעַל לֵאמֹר יָרֶב בּוֹ הַבַּעַל כִּי נָתַץ אֶת־מִזְבְּחוֹ׃
    hebrewPlain: ויקרא לו ביום ההוא ירבעל לאמר ירב בו הבעל כי נתץ את מזבחו
    kjvRefs:
    - Judges 6:32
    kjvOsis:
    - Judg.6.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.33
    scripture: tanakh
    name: Tanakh Judges 6:33
    ref: Judges 6:33
    book: Judg
    section: neviim
    chapter: 6
    verse: 33
    ordinal: 6682
    text: Now all the Midianites and the Amalekites and the children of the east assembled themselves together; and they passed over, and pitched in the valley of Jezreel.
    translation: JPS 1917
    original: וְכָל־מִדְיָן וַעֲמָלֵק וּבְנֵי־קֶדֶם נֶאֶסְפוּ יַחְדָּו וַיַּעַבְרוּ וַיַּחֲנוּ בְּעֵמֶק יִזְרְעֶאל׃
    hebrewPlain: וכל מדין ועמלק ובני קדם נאספו יחדו ויעברו ויחנו בעמק יזרעאל
    kjvRefs:
    - Judges 6:33
    kjvOsis:
    - Judg.6.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.34
    scripture: tanakh
    name: Tanakh Judges 6:34
    ref: Judges 6:34
    book: Judg
    section: neviim
    chapter: 6
    verse: 34
    ordinal: 6683
    text: But the spirit of the LORD clothed Gideon; and he blew a horn; and Abiezer was gathered together after him.
    translation: JPS 1917
    original: וְרוּחַ יְהוָה לָבְשָׁה אֶת־גִּדְעוֹן וַיִּתְקַע בַּשּׁוֹפָר וַיִזָּעֵק אֲבִיעֶזֶר אַחֲרָיו׃
    hebrewPlain: ורוח יהוה לבשה את גדעון ויתקע בשופר ויזעק אביעזר אחריו
    kjvRefs:
    - Judges 6:34
    kjvOsis:
    - Judg.6.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.35
    scripture: tanakh
    name: Tanakh Judges 6:35
    ref: Judges 6:35
    book: Judg
    section: neviim
    chapter: 6
    verse: 35
    ordinal: 6684
    text: And he sent messengers throughout all Manasseh; and they also were gathered together after him; and he sent messengers unto Asher, and unto Zebulun, and unto Naphtali; and they came up to meet them.
    translation: JPS 1917
    original: וּמַלְאָכִים שָׁלַח בְּכָל־מְנַשֶּׁה וַיִזָּעֵק גַּם־הוּא אַחֲרָיו וּמַלְאָכִים שָׁלַח בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי וַיַּעֲלוּ לִקְרָאתָם׃
    hebrewPlain: ומלאכים שלח בכל מנשה ויזעק גם הוא אחריו ומלאכים שלח באשר ובזבלון ובנפתלי ויעלו לקראתם
    kjvRefs:
    - Judges 6:35
    kjvOsis:
    - Judg.6.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.36
    scripture: tanakh
    name: Tanakh Judges 6:36
    ref: Judges 6:36
    book: Judg
    section: neviim
    chapter: 6
    verse: 36
    ordinal: 6685
    text: 'And Gideon said unto God: ‘If Thou wilt save Israel by my hand, as Thou hast spoken,'
    translation: JPS 1917
    original: וַיֹּאמֶר גִּדְעוֹן אֶל־הָאֱלֹהִים אִם־יֶשְׁךָ מוֹשִׁיעַ בְּיָדִי אֶת־יִשְׂרָאֵל כַּאֲשֶׁר דִּבַּרְתָּ׃
    hebrewPlain: ויאמר גדעון אל האלהים אם ישך מושיע בידי את ישראל כאשר דברת
    kjvRefs:
    - Judges 6:36
    kjvOsis:
    - Judg.6.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.37
    scripture: tanakh
    name: Tanakh Judges 6:37
    ref: Judges 6:37
    book: Judg
    section: neviim
    chapter: 6
    verse: 37
    ordinal: 6686
    text: behold, I will put a fleece of wool on the threshing-floor; if there be dew on the fleece only, and it be dry upon all the ground, then shall I know that Thou wilt save Israel by my hand, as Thou hast spoken.’
    translation: JPS 1917
    original: הִנֵּה אָנֹכִי מַצִּיג אֶת־גִּזַּת הַצֶּמֶר בַּגֹּרֶן אִם טַל יִהְיֶה עַל־הַגִּזָּה לְבַדָּהּ וְעַל־כָּל־הָאָרֶץ חֹרֶב וְיָדַעְתִּי כִּי־תוֹשִׁיעַ בְּיָדִי אֶת־יִשְׂרָאֵל כַּאֲשֶׁר דִּבַּרְתָּ׃
    hebrewPlain: הנה אנכי מציג את גזת הצמר בגרן אם טל יהיה על הגזה לבדה ועל כל הארץ חרב וידעתי כי תושיע בידי את ישראל כאשר דברת
    kjvRefs:
    - Judges 6:37
    kjvOsis:
    - Judg.6.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.38
    scripture: tanakh
    name: Tanakh Judges 6:38
    ref: Judges 6:38
    book: Judg
    section: neviim
    chapter: 6
    verse: 38
    ordinal: 6687
    text: And it was so; for he rose up early on the morrow, and pressed the fleece together, and wrung dew out of the fleece, a bowlful of water.
    translation: JPS 1917
    original: וַיְהִי־כֵן וַיַּשְׁכֵּם מִמָּחֳרָת וַיָּזַר אֶת־הַגִּזָּה וַיִּמֶץ טַל מִן־הַגִּזָּה מְלוֹא הַסֵּפֶל מָיִם׃
    hebrewPlain: ויהי כן וישכם ממחרת ויזר את הגזה וימץ טל מן הגזה מלוא הספל מים
    kjvRefs:
    - Judges 6:38
    kjvOsis:
    - Judg.6.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.39
    scripture: tanakh
    name: Tanakh Judges 6:39
    ref: Judges 6:39
    book: Judg
    section: neviim
    chapter: 6
    verse: 39
    ordinal: 6688
    text: 'And Gideon said unto God: ‘Let not Thine anger be kindled against me, and I will speak but this once: let me make trial, I pray Thee, but this once with the fleece; let it now be dry only upon the fleece, and upon all the ground let there be dew.’'
    translation: JPS 1917
    original: וַיֹּאמֶר גִּדְעוֹן אֶל־הָאֱלֹהִים אַל־יִחַר אַפְּךָ בִּי וַאֲדַבְּרָה אַךְ הַפָּעַם אֲנַסֶּה נָּא־רַק־הַפַּעַם בַּגִּזָּה יְהִי־נָא חֹרֶב אֶל־הַגִּזָּה לְבַדָּהּ וְעַל־כָּל־הָאָרֶץ יִהְיֶה־טָּל׃
    hebrewPlain: ויאמר גדעון אל האלהים אל יחר אפך בי ואדברה אך הפעם אנסה נא רק הפעם בגזה יהי נא חרב אל הגזה לבדה ועל כל הארץ יהיה טל
    kjvRefs:
    - Judges 6:39
    kjvOsis:
    - Judg.6.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.6.40
    scripture: tanakh
    name: Tanakh Judges 6:40
    ref: Judges 6:40
    book: Judg
    section: neviim
    chapter: 6
    verse: 40
    ordinal: 6689
    text: And God did so that night; for it was dry upon the fleece only, and there was dew on all the ground.
    translation: JPS 1917
    original: וַיַּעַשׂ אֱלֹהִים כֵּן בַּלַּיְלָה הַהוּא וַיְהִי־חֹרֶב אֶל־הַגִּזָּה לְבַדָּהּ וְעַל־כָּל־הָאָרֶץ הָיָה טָל׃
    hebrewPlain: ויעש אלהים כן בלילה ההוא ויהי חרב אל הגזה לבדה ועל כל הארץ היה טל
    kjvRefs:
    - Judges 6:40
    kjvOsis:
    - Judg.6.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.6
- type: TanakhVerse
  data:
    osis: Judg.7.1
    scripture: tanakh
    name: Tanakh Judges 7:1
    ref: Judges 7:1
    book: Judg
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 6690
    text: Then Jerubbaal, who is Gideon, and all the people that were with him, rose up early, and pitched beside En-harod; and the camp of Midian was on the north side of them, by Gibeath-moreh, in the valley.
    translation: JPS 1917
    original: וַיַּשְׁכֵּם יְרֻבַּעַל הוּא גִדְעוֹן וְכָל־הָעָם אֲשֶׁר אִתּוֹ וַיַּחֲנוּ עַל־עֵין חֲרֹד וּמַחֲנֵה מִדְיָן הָיָה־לוֹ מִצָּפוֹן מִגִּבְעַת הַמּוֹרֶה בָּעֵמֶק׃
    hebrewPlain: וישכם ירבעל הוא גדעון וכל העם אשר אתו ויחנו על עין חרד ומחנה מדין היה לו מצפון מגבעת המורה בעמק
    kjvRefs:
    - Judges 7:1
    kjvOsis:
    - Judg.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.2
    scripture: tanakh
    name: Tanakh Judges 7:2
    ref: Judges 7:2
    book: Judg
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 6691
    text: 'And the LORD said unto Gideon: ‘The people that are with thee are too many for Me to give the Midianites into their hand, lest Israel vaunt themselves against Me, saying: mine own hand hath saved me.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־גִּדְעוֹן רַב הָעָם אֲשֶׁר אִתָּךְ מִתִּתִּי אֶת־מִדְיָן בְּיָדָם פֶּן־יִתְפָּאֵר עָלַי יִשְׂרָאֵל לֵאמֹר יָדִי הוֹשִׁיעָה לִּי׃
    hebrewPlain: ויאמר יהוה אל גדעון רב העם אשר אתך מתתי את מדין בידם פן יתפאר עלי ישראל לאמר ידי הושיעה לי
    kjvRefs:
    - Judges 7:2
    kjvOsis:
    - Judg.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.3
    scripture: tanakh
    name: Tanakh Judges 7:3
    ref: Judges 7:3
    book: Judg
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 6692
    text: 'Now therefore make proclamation in the ears of the people, saying: Whosoever is fearful and trembling, let him return and depart early from mount Gilead.’ And there returned of the people twenty and two thousand; and there remained ten thousand.'
    translation: JPS 1917
    original: וְעַתָּה קְרָא נָא בְּאָזְנֵי הָעָם לֵאמֹר מִי־יָרֵא וְחָרֵד יָשֹׁב וְיִצְפֹּר מֵהַר הַגִּלְעָד וַיָּשָׁב מִן־הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ׃
    hebrewPlain: ועתה קרא נא באזני העם לאמר מי ירא וחרד ישב ויצפר מהר הגלעד וישב מן העם עשרים ושנים אלף ועשרת אלפים נשארו
    kjvRefs:
    - Judges 7:3
    kjvOsis:
    - Judg.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.4
    scripture: tanakh
    name: Tanakh Judges 7:4
    ref: Judges 7:4
    book: Judg
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 6693
    text: 'And the LORD said unto Gideon: ‘The people are yet too many; bring them down unto the water, and I will try them for thee there; and it shall be, that of whom I say to thee: This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee: This shall not go with thee, the same shall not go.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־גִּדְעוֹן עוֹד הָעָם רָב הוֹרֵד אוֹתָם אֶל־הַמַּיִם וְאֶצְרְפֶנּוּ לְךָ שָׁם וְהָיָה אֲשֶׁר אֹמַר אֵלֶיךָ זֶה יֵלֵךְ אִתָּךְ הוּא יֵלֵךְ אִתָּךְ וְכֹל אֲשֶׁר־אֹמַר אֵלֶיךָ זֶה לֹא־יֵלֵךְ עִמָּךְ הוּא לֹא יֵלֵךְ׃
    hebrewPlain: ויאמר יהוה אל גדעון עוד העם רב הורד אותם אל המים ואצרפנו לך שם והיה אשר אמר אליך זה ילך אתך הוא ילך אתך וכל אשר אמר אליך זה לא ילך עמך הוא לא ילך
    kjvRefs:
    - Judges 7:4
    kjvOsis:
    - Judg.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.5
    scripture: tanakh
    name: Tanakh Judges 7:5
    ref: Judges 7:5
    book: Judg
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 6694
    text: 'So he brought down the people unto the water; and the LORD said unto Gideon: ‘Everyone that lappeth of the water with his tongue, as a dog lappeth, him shalt thou set by himself; likewise every one that boweth down upon his knees to drink.’'
    translation: JPS 1917
    original: וַיּוֹרֶד אֶת־הָעָם אֶל־הַמָּיִם וַיֹּאמֶר יְהוָה אֶל־גִּדְעוֹן כֹּל אֲשֶׁר־יָלֹק בִּלְשׁוֹנוֹ מִן־הַמַּיִם כַּאֲשֶׁר יָלֹק הַכֶּלֶב תַּצִּיג אוֹתוֹ לְבָד וְכֹל אֲשֶׁר־יִכְרַע עַל־בִּרְכָּיו לִשְׁתּוֹת׃
    hebrewPlain: ויורד את העם אל המים ויאמר יהוה אל גדעון כל אשר ילק בלשונו מן המים כאשר ילק הכלב תציג אותו לבד וכל אשר יכרע על ברכיו לשתות
    kjvRefs:
    - Judges 7:5
    kjvOsis:
    - Judg.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.6
    scripture: tanakh
    name: Tanakh Judges 7:6
    ref: Judges 7:6
    book: Judg
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 6695
    text: And the number of them that lapped, putting their hand to their mouth, was three hundred men; but all the rest of the people bowed down upon their knees to drink water.
    translation: JPS 1917
    original: וַיְהִי מִסְפַּר הַמֲלַקְקִים בְּיָדָם אֶל־פִּיהֶם שְׁלֹשׁ מֵאוֹת אִישׁ וְכֹל יֶתֶר הָעָם כָּרְעוּ עַל־בִּרְכֵיהֶם לִשְׁתּוֹת מָיִם׃
    hebrewPlain: ויהי מספר המלקקים בידם אל פיהם שלש מאות איש וכל יתר העם כרעו על ברכיהם לשתות מים
    kjvRefs:
    - Judges 7:6
    kjvOsis:
    - Judg.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.7
    scripture: tanakh
    name: Tanakh Judges 7:7
    ref: Judges 7:7
    book: Judg
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 6696
    text: 'And the LORD said unto Gideon: ‘By the three hundred men that lapped will I save you, and deliver the Midianites into thy hand; and let all the people go every man unto his place.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־גִּדְעוֹן בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ הַמֲלַקְקִים אוֹשִׁיעַ אֶתְכֶם וְנָתַתִּי אֶת־מִדְיָן בְּיָדֶךָ וְכָל־הָעָם יֵלְכוּ אִישׁ לִמְקֹמוֹ׃
    hebrewPlain: ויאמר יהוה אל גדעון בשלש מאות האיש המלקקים אושיע אתכם ונתתי את מדין בידך וכל העם ילכו איש למקמו
    kjvRefs:
    - Judges 7:7
    kjvOsis:
    - Judg.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.8
    scripture: tanakh
    name: Tanakh Judges 7:8
    ref: Judges 7:8
    book: Judg
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 6697
    text: So they took the victuals of the people in their hand, and their horns; and he sent all the men of Israel every man unto his tent, but retained the three hundred men; and the camp of Midian was beneath him in the valley.
    translation: JPS 1917
    original: וַיִּקְחוּ אֶת־צֵדָה הָעָם בְּיָדָם וְאֵת שׁוֹפְרֹתֵיהֶם וְאֵת כָּל־אִישׁ יִשְׂרָאֵל שִׁלַּח אִישׁ לְאֹהָלָיו וּבִשְׁלֹשׁ־מֵאוֹת הָאִישׁ הֶחֱזִיק וּמַחֲנֵה מִדְיָן הָיָה לוֹ מִתַּחַת בָּעֵמֶק׃
    hebrewPlain: ויקחו את צדה העם בידם ואת שופרתיהם ואת כל איש ישראל שלח איש לאהליו ובשלש מאות האיש החזיק ומחנה מדין היה לו מתחת בעמק
    kjvRefs:
    - Judges 7:8
    kjvOsis:
    - Judg.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.9
    scripture: tanakh
    name: Tanakh Judges 7:9
    ref: Judges 7:9
    book: Judg
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 6698
    text: 'And it came to pass the same night, that the LORD said unto him: ‘Arise, get thee down upon the camp; for I have delivered it into thy hand.'
    translation: JPS 1917
    original: וַיְהִי בַּלַּיְלָה הַהוּא וַיֹּאמֶר אֵלָיו יְהוָה קוּם רֵד בַּמַּחֲנֶה כִּי נְתַתִּיו בְּיָדֶךָ׃
    hebrewPlain: ויהי בלילה ההוא ויאמר אליו יהוה קום רד במחנה כי נתתיו בידך
    kjvRefs:
    - Judges 7:9
    kjvOsis:
    - Judg.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.10
    scripture: tanakh
    name: Tanakh Judges 7:10
    ref: Judges 7:10
    book: Judg
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 6699
    text: But if thou fear to go down, go thou with Purah thy servant down to the camp.
    translation: JPS 1917
    original: וְאִם־יָרֵא אַתָּה לָרֶדֶת רֵד אַתָּה וּפֻרָה נַעַרְךָ אֶל־הַמַּחֲנֶה׃
    hebrewPlain: ואם ירא אתה לרדת רד אתה ופרה נערך אל המחנה
    kjvRefs:
    - Judges 7:10
    kjvOsis:
    - Judg.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.11
    scripture: tanakh
    name: Tanakh Judges 7:11
    ref: Judges 7:11
    book: Judg
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 6700
    text: And thou shalt hear what they say; and afterward shall thy hands be strengthened to go down upon the camp.’ Then went he down with Purah his servant unto the outermost part of the armed men that were in the camp.
    translation: JPS 1917
    original: וְשָׁמַעְתָּ מַה־יְדַבֵּרוּ וְאַחַר תֶּחֱזַקְנָה יָדֶיךָ וְיָרַדְתָּ בַּמַּחֲנֶה וַיֵּרֶד הוּא וּפֻרָה נַעֲרוֹ אֶל־קְצֵה הַחֲמֻשִׁים אֲשֶׁר בַּמַּחֲנֶה׃
    hebrewPlain: ושמעת מה ידברו ואחר תחזקנה ידיך וירדת במחנה וירד הוא ופרה נערו אל קצה החמשים אשר במחנה
    kjvRefs:
    - Judges 7:11
    kjvOsis:
    - Judg.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.12
    scripture: tanakh
    name: Tanakh Judges 7:12
    ref: Judges 7:12
    book: Judg
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 6701
    text: Now the Midianites and the Amalekites and all the children of the east lay along in the valley like locusts for multitude; and their camels were without number, as the sand which is upon the sea-shore for multitude.
    translation: JPS 1917
    original: וּמִדְיָן וַעֲמָלֵק וְכָל־בְּנֵי־קֶדֶם נֹפְלִים בָּעֵמֶק כָּאַרְבֶּה לָרֹב וְלִגְמַלֵּיהֶם אֵין מִסְפָּר כַּחוֹל שֶׁעַל־שְׂפַת הַיָּם לָרֹב׃
    hebrewPlain: ומדין ועמלק וכל בני קדם נפלים בעמק כארבה לרב ולגמליהם אין מספר כחול שעל שפת הים לרב
    kjvRefs:
    - Judges 7:12
    kjvOsis:
    - Judg.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.13
    scripture: tanakh
    name: Tanakh Judges 7:13
    ref: Judges 7:13
    book: Judg
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 6702
    text: 'And when Gideon was come, behold, there was a man telling a dream unto his follow, and saying: ‘Behold, I dreamed a dream, and, lo, a cake of barley bread tumbled into the camp of Midian, and came unto the tent, and smote it that it fell, and turned it upside down, that the tent lay flat.’'
    translation: JPS 1917
    original: וַיָּבֹא גִדְעוֹן וְהִנֵּה־אִישׁ מְסַפֵּר לְרֵעֵהוּ חֲלוֹם וַיֹּאמֶר הִנֵּה חֲלוֹם חָלַמְתִּי וְהִנֵּה צלול [צְלִיל] לֶחֶם שְׂעֹרִים מִתְהַפֵּךְ בְּמַחֲנֵה מִדְיָן וַיָּבֹא עַד־הָאֹהֶל וַיַּכֵּהוּ וַיִּפֹּל וַיַּהַפְכֵהוּ לְמַעְלָה וְנָפַל הָאֹהֶל׃
    hebrewPlain: ויבא גדעון והנה איש מספר לרעהו חלום ויאמר הנה חלום חלמתי והנה צלול [צליל] לחם שערים מתהפך במחנה מדין ויבא עד האהל ויכהו ויפל ויהפכהו למעלה ונפל האהל
    kjvRefs:
    - Judges 7:13
    kjvOsis:
    - Judg.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.14
    scripture: tanakh
    name: Tanakh Judges 7:14
    ref: Judges 7:14
    book: Judg
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 6703
    text: 'And his fellow answered and said: ‘This is nothing else save the sword of Gideon the son of Joash, a man of Israel: into his hand God hath delivered Midian, and all the host.’'
    translation: JPS 1917
    original: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר אֵין זֹאת בִּלְתִּי אִם־חֶרֶב גִּדְעוֹן בֶּן־יוֹאָשׁ אִישׁ יִשְׂרָאֵל נָתַן הָאֱלֹהִים בְּיָדוֹ אֶת־מִדְיָן וְאֶת־כָּל־הַמַּחֲנֶה׃
    hebrewPlain: ויען רעהו ויאמר אין זאת בלתי אם חרב גדעון בן יואש איש ישראל נתן האלהים בידו את מדין ואת כל המחנה
    kjvRefs:
    - Judges 7:14
    kjvOsis:
    - Judg.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.15
    scripture: tanakh
    name: Tanakh Judges 7:15
    ref: Judges 7:15
    book: Judg
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 6704
    text: 'And it was so, when Gideon heard the telling of the dream, and the interpretation thereof, that he worshipped; and he returned into the camp of Israel, and said: ‘Arise; for the LORD hath delivered into your hand the host of Midian.’'
    translation: JPS 1917
    original: וַיְהִי כִשְׁמֹעַ גִּדְעוֹן אֶת־מִסְפַּר הַחֲלוֹם וְאֶת־שִׁבְרוֹ וַיִּשְׁתָּחוּ וַיָּשָׁב אֶל־מַחֲנֵה יִשְׂרָאֵל וַיֹּאמֶר קוּמוּ כִּי־נָתַן יְהוָה בְּיֶדְכֶם אֶת־מַחֲנֵה מִדְיָן׃
    hebrewPlain: ויהי כשמע גדעון את מספר החלום ואת שברו וישתחו וישב אל מחנה ישראל ויאמר קומו כי נתן יהוה בידכם את מחנה מדין
    kjvRefs:
    - Judges 7:15
    kjvOsis:
    - Judg.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.16
    scripture: tanakh
    name: Tanakh Judges 7:16
    ref: Judges 7:16
    book: Judg
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 6705
    text: And he divided the three hundred men into three companies, and he put into the hands of all of them horns, and empty pitchers, with torches within the pitchers.
    translation: JPS 1917
    original: וַיַּחַץ אֶת־שְׁלֹשׁ־מֵאוֹת הָאִישׁ שְׁלֹשָׁה רָאשִׁים וַיִּתֵּן שׁוֹפָרוֹת בְּיַד־כֻּלָּם וְכַדִּים רֵקִים וְלַפִּדִים בְּתוֹךְ הַכַּדִּים׃
    hebrewPlain: ויחץ את שלש מאות האיש שלשה ראשים ויתן שופרות ביד כלם וכדים רקים ולפדים בתוך הכדים
    kjvRefs:
    - Judges 7:16
    kjvOsis:
    - Judg.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.17
    scripture: tanakh
    name: Tanakh Judges 7:17
    ref: Judges 7:17
    book: Judg
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 6706
    text: 'And he said unto them: ‘Look on me, and do likewise; and, behold, when I come to the outermost part of the camp, it shall be that, as I do, so shall ye do.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם מִמֶּנִּי תִרְאוּ וְכֵן תַּעֲשׂוּ וְהִנֵּה אָנֹכִי בָא בִּקְצֵה הַמַּחֲנֶה וְהָיָה כַאֲשֶׁר־אֶעֱשֶׂה כֵּן תַּעֲשׂוּן׃
    hebrewPlain: ויאמר אליהם ממני תראו וכן תעשו והנה אנכי בא בקצה המחנה והיה כאשר אעשה כן תעשון
    kjvRefs:
    - Judges 7:17
    kjvOsis:
    - Judg.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.18
    scripture: tanakh
    name: Tanakh Judges 7:18
    ref: Judges 7:18
    book: Judg
    section: neviim
    chapter: 7
    verse: 18
    ordinal: 6707
    text: 'When I blow the horn, I and all that are with me, then blow ye the horns also on every side of all the camp, and say: For the LORD and for Gideon! ’'
    translation: JPS 1917
    original: וְתָקַעְתִּי בַּשּׁוֹפָר אָנֹכִי וְכָל־אֲשֶׁר אִתִּי וּתְקַעְתֶּם בַּשּׁוֹפָרוֹת גַּם־אַתֶּם סְבִיבוֹת כָּל־הַמַּחֲנֶה וַאֲמַרְתֶּם לַיהוָה וּלְגִדְעוֹן׃
    hebrewPlain: ותקעתי בשופר אנכי וכל אשר אתי ותקעתם בשופרות גם אתם סביבות כל המחנה ואמרתם ליהוה ולגדעון
    kjvRefs:
    - Judges 7:18
    kjvOsis:
    - Judg.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.19
    scripture: tanakh
    name: Tanakh Judges 7:19
    ref: Judges 7:19
    book: Judg
    section: neviim
    chapter: 7
    verse: 19
    ordinal: 6708
    text: So Gideon, and the hundred men that were with him, came unto the outermost part of the camp in the beginning of the middle watch, when they had but newly set the watch; and they blew the horns, and broke in pieces the pitchers that were in their hands.
    translation: JPS 1917
    original: וַיָּבֹא גִדְעוֹן וּמֵאָה־אִישׁ אֲשֶׁר־אִתּוֹ בִּקְצֵה הַמַּחֲנֶה רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת וְנָפוֹץ הַכַּדִּים אֲשֶׁר בְּיָדָם׃
    hebrewPlain: ויבא גדעון ומאה איש אשר אתו בקצה המחנה ראש האשמרת התיכונה אך הקם הקימו את השמרים ויתקעו בשופרות ונפוץ הכדים אשר בידם
    kjvRefs:
    - Judges 7:19
    kjvOsis:
    - Judg.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.20
    scripture: tanakh
    name: Tanakh Judges 7:20
    ref: Judges 7:20
    book: Judg
    section: neviim
    chapter: 7
    verse: 20
    ordinal: 6709
    text: 'And the three companies blew the horns, and broke the pitchers, and held the torches in their left hands, and the horns in their right hands wherewith to blow; and they cried: ‘The sword for the LORD and for Gideon! ’'
    translation: JPS 1917
    original: וַיִּתְקְעוּ שְׁלֹשֶׁת הָרָאשִׁים בַּשּׁוֹפָרוֹת וַיִּשְׁבְּרוּ הַכַּדִּים וַיַּחֲזִיקוּ בְיַד־שְׂמאוֹלָם בַּלַּפִּדִים וּבְיַד־יְמִינָם הַשּׁוֹפָרוֹת לִתְקוֹעַ וַיִּקְרְאוּ חֶרֶב לַיהוָה וּלְגִדְעוֹן׃
    hebrewPlain: ויתקעו שלשת הראשים בשופרות וישברו הכדים ויחזיקו ביד שמאולם בלפדים וביד ימינם השופרות לתקוע ויקראו חרב ליהוה ולגדעון
    kjvRefs:
    - Judges 7:20
    kjvOsis:
    - Judg.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.21
    scripture: tanakh
    name: Tanakh Judges 7:21
    ref: Judges 7:21
    book: Judg
    section: neviim
    chapter: 7
    verse: 21
    ordinal: 6710
    text: And they stood every man in his place round about the camp; and all the host ran; and they shouted, and fled.
    translation: JPS 1917
    original: וַיַּעַמְדוּ אִישׁ תַּחְתָּיו סָבִיב לַמַּחֲנֶה וַיָּרָץ כָּל־הַמַּחֲנֶה וַיָּרִיעוּ ויניסו [וַיָּנוּסוּ׃]
    hebrewPlain: ויעמדו איש תחתיו סביב למחנה וירץ כל המחנה ויריעו ויניסו [וינוסו]
    kjvRefs:
    - Judges 7:21
    kjvOsis:
    - Judg.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.22
    scripture: tanakh
    name: Tanakh Judges 7:22
    ref: Judges 7:22
    book: Judg
    section: neviim
    chapter: 7
    verse: 22
    ordinal: 6711
    text: And they blew the three hundred horns, and the LORD set every man’s sword a against his fellow, even throughout all the host; and the host fled as far as Beth-shittah toward Zererah, as far as the border of Abel-meholah, by Tabbath.
    translation: JPS 1917
    original: וַיִּתְקְעוּ שְׁלֹשׁ־מֵאוֹת הַשּׁוֹפָרוֹת וַיָּשֶׂם יְהוָה אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ וּבְכָל־הַמַּחֲנֶה וַיָּנָס הַמַּחֲנֶה עַד־בֵּית הַשִּׁטָּה צְרֵרָתָה עַד שְׂפַת־אָבֵל מְחוֹלָה עַל־טַבָּת׃
    hebrewPlain: ויתקעו שלש מאות השופרות וישם יהוה את חרב איש ברעהו ובכל המחנה וינס המחנה עד בית השטה צררתה עד שפת אבל מחולה על טבת
    kjvRefs:
    - Judges 7:22
    kjvOsis:
    - Judg.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.23
    scripture: tanakh
    name: Tanakh Judges 7:23
    ref: Judges 7:23
    book: Judg
    section: neviim
    chapter: 7
    verse: 23
    ordinal: 6712
    text: And the men of Israel were gathered together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after Midian.
    translation: JPS 1917
    original: וַיִּצָּעֵק אִישׁ־יִשְׂרָאֵל מִנַּפְתָּלִי וּמִן־אָשֵׁר וּמִן־כָּל־מְנַשֶּׁה וַיִּרְדְּפוּ אַחֲרֵי מִדְיָן׃
    hebrewPlain: ויצעק איש ישראל מנפתלי ומן אשר ומן כל מנשה וירדפו אחרי מדין
    kjvRefs:
    - Judges 7:23
    kjvOsis:
    - Judg.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.24
    scripture: tanakh
    name: Tanakh Judges 7:24
    ref: Judges 7:24
    book: Judg
    section: neviim
    chapter: 7
    verse: 24
    ordinal: 6713
    text: 'And Gideon sent messengers throughout all the hill-country of Ephraim, saying: ‘Come down against Midian, and take before them the waters, as far as Beth-barah, and also the Jordan.’ So all the men of Ephraim were gathered together, and took the waters as far as Beth-barah, and also the Jordan.'
    translation: JPS 1917
    original: וּמַלְאָכִים שָׁלַח גִּדְעוֹן בְּכָל־הַר אֶפְרַיִם לֵאמֹר רְדוּ לִקְרַאת מִדְיָן וְלִכְדוּ לָהֶם אֶת־הַמַּיִם עַד בֵּית בָּרָה וְאֶת־הַיַּרְדֵּן וַיִּצָּעֵק כָּל־אִישׁ אֶפְרַיִם וַיִּלְכְּדוּ אֶת־הַמַּיִם עַד בֵּית בָּרָה וְאֶת־הַיַּרְדֵּן׃
    hebrewPlain: ומלאכים שלח גדעון בכל הר אפרים לאמר רדו לקראת מדין ולכדו להם את המים עד בית ברה ואת הירדן ויצעק כל איש אפרים וילכדו את המים עד בית ברה ואת הירדן
    kjvRefs:
    - Judges 7:24
    kjvOsis:
    - Judg.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.7.25
    scripture: tanakh
    name: Tanakh Judges 7:25
    ref: Judges 7:25
    book: Judg
    section: neviim
    chapter: 7
    verse: 25
    ordinal: 6714
    text: And they took the two princes of Midian, Oreb and Zeeb; and they slew Oreb at the Rock of Oreb, and Zeeb they slew at the Winepress of Zeeb, and pursued Midian; and they brought the heads of Oreb and Zeeb to Gideon beyond the Jordan.
    translation: JPS 1917
    original: וַיִּלְכְּדוּ שְׁנֵי־שָׂרֵי מִדְיָן אֶת־עֹרֵב וְאֶת־זְאֵב וַיַּהַרְגוּ אֶת־עוֹרֵב בְּצוּר־עוֹרֵב וְאֶת־זְאֵב הָרְגוּ בְיֶקֶב־זְאֵב וַיִּרְדְּפוּ אֶל־מִדְיָן וְרֹאשׁ־עֹרֵב וּזְאֵב הֵבִיאוּ אֶל־גִּדְעוֹן מֵעֵבֶר לַיַּרְדֵּן׃
    hebrewPlain: וילכדו שני שרי מדין את ערב ואת זאב ויהרגו את עורב בצור עורב ואת זאב הרגו ביקב זאב וירדפו אל מדין וראש ערב וזאב הביאו אל גדעון מעבר לירדן
    kjvRefs:
    - Judges 7:25
    kjvOsis:
    - Judg.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.7
- type: TanakhVerse
  data:
    osis: Judg.8.1
    scripture: tanakh
    name: Tanakh Judges 8:1
    ref: Judges 8:1
    book: Judg
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 6715
    text: 'And the men of Ephraim said unto him: ‘Why hast thou served us thus, that thou didst not call us when thou wentest to fight with Midian?’ And they did chide with him sharply.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו אִישׁ אֶפְרַיִם מָה־הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ לְבִלְתִּי קְרֹאות לָנוּ כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן וַיְרִיבוּן אִתּוֹ בְּחָזְקָה׃
    hebrewPlain: ויאמרו אליו איש אפרים מה הדבר הזה עשית לנו לבלתי קראות לנו כי הלכת להלחם במדין ויריבון אתו בחזקה
    kjvRefs:
    - Judges 8:1
    kjvOsis:
    - Judg.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.2
    scripture: tanakh
    name: Tanakh Judges 8:2
    ref: Judges 8:2
    book: Judg
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 6716
    text: 'And he said unto them: ‘What have I now done in comparison with you? Is not the gleaning of Ephraim better than the vintage of Abiezer?'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם מֶה־עָשִׂיתִי עַתָּה כָּכֶם הֲלוֹא טוֹב עֹלְלוֹת אֶפְרַיִם מִבְצִיר אֲבִיעֶזֶר׃
    hebrewPlain: ויאמר אליהם מה עשיתי עתה ככם הלוא טוב עללות אפרים מבציר אביעזר
    kjvRefs:
    - Judges 8:2
    kjvOsis:
    - Judg.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.3
    scripture: tanakh
    name: Tanakh Judges 8:3
    ref: Judges 8:3
    book: Judg
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 6717
    text: God hath delivered into your hand the princes of Midian, Oreb and Zeeb; and what was I able to do in comparison with you?’ Then their anger was abated toward him, when he had said that.
    translation: JPS 1917
    original: בְּיֶדְכֶם נָתַן אֱלֹהִים אֶת־שָׂרֵי מִדְיָן אֶת־עֹרֵב וְאֶת־זְאֵב וּמַה־יָּכֹלְתִּי עֲשׂוֹת כָּכֶם אָז רָפְתָה רוּחָם מֵעָלָיו בְּדַבְּרוֹ הַדָּבָר הַזֶּה׃
    hebrewPlain: בידכם נתן אלהים את שרי מדין את ערב ואת זאב ומה יכלתי עשות ככם אז רפתה רוחם מעליו בדברו הדבר הזה
    kjvRefs:
    - Judges 8:3
    kjvOsis:
    - Judg.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.4
    scripture: tanakh
    name: Tanakh Judges 8:4
    ref: Judges 8:4
    book: Judg
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 6718
    text: And Gideon came to the Jordan, and passed over, he, and the three hundred men that were with him, faint, yet pursuing.
    translation: JPS 1917
    original: וַיָּבֹא גִדְעוֹן הַיַּרְדֵּנָה עֹבֵר הוּא וּשְׁלֹשׁ־מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ עֲיֵפִים וְרֹדְפִים׃
    hebrewPlain: ויבא גדעון הירדנה עבר הוא ושלש מאות האיש אשר אתו עיפים ורדפים
    kjvRefs:
    - Judges 8:4
    kjvOsis:
    - Judg.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.5
    scripture: tanakh
    name: Tanakh Judges 8:5
    ref: Judges 8:5
    book: Judg
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 6719
    text: 'And he said unto the men of Succoth: ‘Give, I pray you, loaves of bread unto the people that follow me; for they are faint, and I am pursuing after Zebah and Zalmunna, the kings of Midian.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לְאַנְשֵׁי סֻכּוֹת תְּנוּ־נָא כִּכְּרוֹת לֶחֶם לָעָם אֲשֶׁר בְּרַגְלָי כִּי־עֲיֵפִים הֵם וְאָנֹכִי רֹדֵף אַחֲרֵי זֶבַח וְצַלְמֻנָּע מַלְכֵי מִדְיָן׃
    hebrewPlain: ויאמר לאנשי סכות תנו נא ככרות לחם לעם אשר ברגלי כי עיפים הם ואנכי רדף אחרי זבח וצלמנע מלכי מדין
    kjvRefs:
    - Judges 8:5
    kjvOsis:
    - Judg.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.6
    scripture: tanakh
    name: Tanakh Judges 8:6
    ref: Judges 8:6
    book: Judg
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 6720
    text: 'And the princes of Succoth said: ‘Are the hands of Zebah and Zalmunna now in thy power, that we should give bread unto thine army?’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׂרֵי סֻכּוֹת הֲכַף זֶבַח וְצַלְמֻנָּע עַתָּה בְּיָדֶךָ כִּי־נִתֵּן לִצְבָאֲךָ לָחֶם׃
    hebrewPlain: ויאמר שרי סכות הכף זבח וצלמנע עתה בידך כי נתן לצבאך לחם
    kjvRefs:
    - Judges 8:6
    kjvOsis:
    - Judg.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.7
    scripture: tanakh
    name: Tanakh Judges 8:7
    ref: Judges 8:7
    book: Judg
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 6721
    text: 'And Gideon said: ‘Therefore when the LORD hath delivered Zebah and Zalmunna into my hand, then I will tear your flesh with the thorns of the wilderness and with briers.’'
    translation: JPS 1917
    original: וַיֹּאמֶר גִּדְעוֹן לָכֵן בְּתֵת יְהוָה אֶת־זֶבַח וְאֶת־צַלְמֻנָּע בְּיָדִי וְדַשְׁתִּי אֶת־בְּשַׂרְכֶם אֶת־קוֹצֵי הַמִּדְבָּר וְאֶת־הַבַּרְקֳנִים׃
    hebrewPlain: ויאמר גדעון לכן בתת יהוה את זבח ואת צלמנע בידי ודשתי את בשרכם את קוצי המדבר ואת הברקנים
    kjvRefs:
    - Judges 8:7
    kjvOsis:
    - Judg.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.8
    scripture: tanakh
    name: Tanakh Judges 8:8
    ref: Judges 8:8
    book: Judg
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 6722
    text: And he went up thence to Penuel, and spoke unto them in like manner; and the men of Penuel answered him as the men of Succoth had answered.
    translation: JPS 1917
    original: וַיַּעַל מִשָּׁם פְּנוּאֵל וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת וַיַּעֲנוּ אוֹתוֹ אַנְשֵׁי פְנוּאֵל כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת׃
    hebrewPlain: ויעל משם פנואל וידבר אליהם כזאת ויענו אותו אנשי פנואל כאשר ענו אנשי סכות
    kjvRefs:
    - Judges 8:8
    kjvOsis:
    - Judg.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.9
    scripture: tanakh
    name: Tanakh Judges 8:9
    ref: Judges 8:9
    book: Judg
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 6723
    text: 'And he spoke also unto the men of Penuel, saying: ‘When I come back in peace, I will break down this tower.’'
    translation: JPS 1917
    original: וַיֹּאמֶר גַּם־לְאַנְשֵׁי פְנוּאֵל לֵאמֹר בְּשׁוּבִי בְשָׁלוֹם אֶתֹּץ אֶת־הַמִּגְדָּל הַזֶּה׃
    hebrewPlain: ויאמר גם לאנשי פנואל לאמר בשובי בשלום אתץ את המגדל הזה
    kjvRefs:
    - Judges 8:9
    kjvOsis:
    - Judg.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.10
    scripture: tanakh
    name: Tanakh Judges 8:10
    ref: Judges 8:10
    book: Judg
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 6724
    text: Now Zebah and Zalmunna were in Karkor, and their hosts with them, about fifteen thousand men, all that were left of all the host of the children of the east; for there fell a hundred and twenty thousand men that drew sword.
    translation: JPS 1917
    original: וְזֶבַח וְצַלְמֻנָּע בַּקַּרְקֹר וּמַחֲנֵיהֶם עִמָּם כַּחֲמֵשֶׁת עָשָׂר אֶלֶף כֹּל הַנּוֹתָרִים מִכֹּל מַחֲנֵה בְנֵי־קֶדֶם וְהַנֹּפְלִים מֵאָה וְעֶשְׂרִים אֶלֶף אִישׁ שֹׁלֵף חָרֶב׃
    hebrewPlain: וזבח וצלמנע בקרקר ומחניהם עמם כחמשת עשר אלף כל הנותרים מכל מחנה בני קדם והנפלים מאה ועשרים אלף איש שלף חרב
    kjvRefs:
    - Judges 8:10
    kjvOsis:
    - Judg.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.11
    scripture: tanakh
    name: Tanakh Judges 8:11
    ref: Judges 8:11
    book: Judg
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 6725
    text: And Gideon went up by the way of them that dwelt in tents on the east of Nobah and Jogbehah, and smote the host; for the host was secure.
    translation: JPS 1917
    original: וַיַּעַל גִּדְעוֹן דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה וַיַּךְ אֶת־הַמַּחֲנֶה וְהַמַּחֲנֶה הָיָה בֶטַח׃
    hebrewPlain: ויעל גדעון דרך השכוני באהלים מקדם לנבח ויגבהה ויך את המחנה והמחנה היה בטח
    kjvRefs:
    - Judges 8:11
    kjvOsis:
    - Judg.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.12
    scripture: tanakh
    name: Tanakh Judges 8:12
    ref: Judges 8:12
    book: Judg
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 6726
    text: And Zebah and Zalmunna fled; and he pursued after them; and he took the two kings of Midian, Zebah and Zalmunna, and discomfited all the host.
    translation: JPS 1917
    original: וַיָּנוּסוּ זֶבַח וְצַלְמֻנָּע וַיִּרְדֹּף אַחֲרֵיהֶם וַיִּלְכֹּד אֶת־שְׁנֵי מַלְכֵי מִדְיָן אֶת־זֶבַח וְאֶת־צַלְמֻנָּע וְכָל־הַמַּחֲנֶה הֶחֱרִיד׃
    hebrewPlain: וינוסו זבח וצלמנע וירדף אחריהם וילכד את שני מלכי מדין את זבח ואת צלמנע וכל המחנה החריד
    kjvRefs:
    - Judges 8:12
    kjvOsis:
    - Judg.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.13
    scripture: tanakh
    name: Tanakh Judges 8:13
    ref: Judges 8:13
    book: Judg
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 6727
    text: And Gideon the son of Joash returned from the battle from the ascent of Heres.
    translation: JPS 1917
    original: וַיָּשָׁב גִּדְעוֹן בֶּן־יוֹאָשׁ מִן־הַמִּלְחָמָה מִלְמַעֲלֵה הֶחָרֶס׃
    hebrewPlain: וישב גדעון בן יואש מן המלחמה מלמעלה החרס
    kjvRefs:
    - Judges 8:13
    kjvOsis:
    - Judg.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.14
    scripture: tanakh
    name: Tanakh Judges 8:14
    ref: Judges 8:14
    book: Judg
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 6728
    text: And he caught a young man of the men of Succoth, and inquired of him; and he wrote down for him the princes of Succoth, and the elders thereof, seventy and seven men.
    translation: JPS 1917
    original: וַיִּלְכָּד־נַעַר מֵאַנְשֵׁי סֻכּוֹת וַיִּשְׁאָלֵהוּ וַיִּכְתֹּב אֵלָיו אֶת־שָׂרֵי סֻכּוֹת וְאֶת־זְקֵנֶיהָ שִׁבְעִים וְשִׁבְעָה אִישׁ׃
    hebrewPlain: וילכד נער מאנשי סכות וישאלהו ויכתב אליו את שרי סכות ואת זקניה שבעים ושבעה איש
    kjvRefs:
    - Judges 8:14
    kjvOsis:
    - Judg.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.15
    scripture: tanakh
    name: Tanakh Judges 8:15
    ref: Judges 8:15
    book: Judg
    section: neviim
    chapter: 8
    verse: 15
    ordinal: 6729
    text: 'And he came unto the men of Succoth, and said: ‘Behold Zebah and Zalmunna, concerning whom ye did taunt me, saying: Are the hands of Zebah and Zalmunna now in thy power, that we should give bread unto thy men that are weary?’'
    translation: JPS 1917
    original: וַיָּבֹא אֶל־אַנְשֵׁי סֻכּוֹת וַיֹּאמֶר הִנֵּה זֶבַח וְצַלְמֻנָּע אֲשֶׁר חֵרַפְתֶּם אוֹתִי לֵאמֹר הֲכַף זֶבַח וְצַלְמֻנָּע עַתָּה בְּיָדֶךָ כִּי נִתֵּן לַאֲנָשֶׁיךָ הַיְּעֵפִים לָחֶם׃
    hebrewPlain: ויבא אל אנשי סכות ויאמר הנה זבח וצלמנע אשר חרפתם אותי לאמר הכף זבח וצלמנע עתה בידך כי נתן לאנשיך היעפים לחם
    kjvRefs:
    - Judges 8:15
    kjvOsis:
    - Judg.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.16
    scripture: tanakh
    name: Tanakh Judges 8:16
    ref: Judges 8:16
    book: Judg
    section: neviim
    chapter: 8
    verse: 16
    ordinal: 6730
    text: And he took the elders of the city, and thorns of the wilderness and briers, and with them he taught the men of Succoth.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־זִקְנֵי הָעִיר וְאֶת־קוֹצֵי הַמִּדְבָּר וְאֶת־הַבַּרְקֳנִים וַיֹּדַע בָּהֶם אֵת אַנְשֵׁי סֻכּוֹת׃
    hebrewPlain: ויקח את זקני העיר ואת קוצי המדבר ואת הברקנים וידע בהם את אנשי סכות
    kjvRefs:
    - Judges 8:16
    kjvOsis:
    - Judg.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.17
    scripture: tanakh
    name: Tanakh Judges 8:17
    ref: Judges 8:17
    book: Judg
    section: neviim
    chapter: 8
    verse: 17
    ordinal: 6731
    text: And he broke down the tower of Penuel, and slew the men of the city.
    translation: JPS 1917
    original: וְאֶת־מִגְדַּל פְּנוּאֵל נָתָץ וַיַּהֲרֹג אֶת־אַנְשֵׁי הָעִיר׃
    hebrewPlain: ואת מגדל פנואל נתץ ויהרג את אנשי העיר
    kjvRefs:
    - Judges 8:17
    kjvOsis:
    - Judg.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.18
    scripture: tanakh
    name: Tanakh Judges 8:18
    ref: Judges 8:18
    book: Judg
    section: neviim
    chapter: 8
    verse: 18
    ordinal: 6732
    text: 'Then said he unto Zebah and Zalmunna: ‘Where are the men whom ye slew at Tabor?’ And they answered: ‘As thou art, so were they; of one form with the children of a king.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־זֶבַח וְאֶל־צַלְמֻנָּע אֵיפֹה הָאֲנָשִׁים אֲשֶׁר הֲרַגְתֶּם בְּתָבוֹר וַיֹּאמרוּ כָּמוֹךָ כְמוֹהֶם אֶחָד כְּתֹאַר בְּנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויאמר אל זבח ואל צלמנע איפה האנשים אשר הרגתם בתבור ויאמרו כמוך כמוהם אחד כתאר בני המלך
    kjvRefs:
    - Judges 8:18
    kjvOsis:
    - Judg.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.19
    scripture: tanakh
    name: Tanakh Judges 8:19
    ref: Judges 8:19
    book: Judg
    section: neviim
    chapter: 8
    verse: 19
    ordinal: 6733
    text: 'And he said: ‘They were my brethren, the sons of my mother; as the LORD liveth, if ye had saved them alive, I would not slay you.’'
    translation: JPS 1917
    original: וַיֹּאמַר אַחַי בְּנֵי־אִמִּי הֵם חַי־יְהוָה לוּ הַחֲיִתֶם אוֹתָם לֹא הָרַגְתִּי אֶתְכֶם׃
    hebrewPlain: ויאמר אחי בני אמי הם חי יהוה לו החיתם אותם לא הרגתי אתכם
    kjvRefs:
    - Judges 8:19
    kjvOsis:
    - Judg.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.20
    scripture: tanakh
    name: Tanakh Judges 8:20
    ref: Judges 8:20
    book: Judg
    section: neviim
    chapter: 8
    verse: 20
    ordinal: 6734
    text: 'And he said unto Jether his first-born: ‘Up, and slay them.’ But the youth drew not his sword; for he feared, because he was yet a youth.'
    translation: JPS 1917
    original: וַיֹּאמֶר לְיֶתֶר בְּכוֹרוֹ קוּם הֲרֹג אוֹתָם וְלֹא־שָׁלַף הַנַּעַר חַרְבּוֹ כִּי יָרֵא כִּי עוֹדֶנּוּ נָעַר׃
    hebrewPlain: ויאמר ליתר בכורו קום הרג אותם ולא שלף הנער חרבו כי ירא כי עודנו נער
    kjvRefs:
    - Judges 8:20
    kjvOsis:
    - Judg.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.21
    scripture: tanakh
    name: Tanakh Judges 8:21
    ref: Judges 8:21
    book: Judg
    section: neviim
    chapter: 8
    verse: 21
    ordinal: 6735
    text: 'Then Zebah and Zalmunna said: ‘Rise thou, and fall upon us; for as the man is, so is his strength.’ And Gideon arose, and slew Zebah and Zalmunna, and took the crescents that were on their camels’ necks.'
    translation: JPS 1917
    original: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע קוּם אַתָּה וּפְגַע־בָּנוּ כִּי כָאִישׁ גְּבוּרָתוֹ וַיָּקָם גִּדְעוֹן וַיַּהֲרֹג אֶת־זֶבַח וְאֶת־צַלְמֻנָּע וַיִּקַּח אֶת־הַשַּׂהֲרֹנִים אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם׃
    hebrewPlain: ויאמר זבח וצלמנע קום אתה ופגע בנו כי כאיש גבורתו ויקם גדעון ויהרג את זבח ואת צלמנע ויקח את השהרנים אשר בצוארי גמליהם
    kjvRefs:
    - Judges 8:21
    kjvOsis:
    - Judg.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.22
    scripture: tanakh
    name: Tanakh Judges 8:22
    ref: Judges 8:22
    book: Judg
    section: neviim
    chapter: 8
    verse: 22
    ordinal: 6736
    text: 'Then the men of Israel said unto Gideon: ‘Rule thou over us, both thou, and thy son, and thy son’s son also; for thou hast saved us out of the hand of Midian.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אִישׁ־יִשְׂרָאֵל אֶל־גִּדְעוֹן מְשָׁל־בָּנוּ גַּם־אַתָּה גַּם־בִּנְךָ גַּם בֶּן־בְּנֶךָ כִּי הוֹשַׁעְתָּנוּ מִיַּד מִדְיָן׃
    hebrewPlain: ויאמרו איש ישראל אל גדעון משל בנו גם אתה גם בנך גם בן בנך כי הושעתנו מיד מדין
    kjvRefs:
    - Judges 8:22
    kjvOsis:
    - Judg.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.23
    scripture: tanakh
    name: Tanakh Judges 8:23
    ref: Judges 8:23
    book: Judg
    section: neviim
    chapter: 8
    verse: 23
    ordinal: 6737
    text: 'And Gideon said unto them: ‘I will not rule over you, neither shall my son rule over you; the LORD shall rule over you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם גִּדְעוֹן לֹא־אֶמְשֹׁל אֲנִי בָּכֶם וְלֹא־יִמְשֹׁל בְּנִי בָּכֶם יְהוָה יִמְשֹׁל בָּכֶם׃
    hebrewPlain: ויאמר אלהם גדעון לא אמשל אני בכם ולא ימשל בני בכם יהוה ימשל בכם
    kjvRefs:
    - Judges 8:23
    kjvOsis:
    - Judg.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.24
    scripture: tanakh
    name: Tanakh Judges 8:24
    ref: Judges 8:24
    book: Judg
    section: neviim
    chapter: 8
    verse: 24
    ordinal: 6738
    text: 'And Gideon said unto them: ‘I would make a request of you, that ye would give me every man the ear-rings of his spoil.’—For they had golden ear-rings, because they were Ishmaelites.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם גִּדְעוֹן אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה וּתְנוּ־לִי אִישׁ נֶזֶם שְׁלָלוֹ כִּי־נִזְמֵי זָהָב לָהֶם כִּי יִשְׁמְעֵאלִים הֵם׃
    hebrewPlain: ויאמר אלהם גדעון אשאלה מכם שאלה ותנו לי איש נזם שללו כי נזמי זהב להם כי ישמעאלים הם
    kjvRefs:
    - Judges 8:24
    kjvOsis:
    - Judg.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.25
    scripture: tanakh
    name: Tanakh Judges 8:25
    ref: Judges 8:25
    book: Judg
    section: neviim
    chapter: 8
    verse: 25
    ordinal: 6739
    text: 'And they answered: ‘We will willingly give them.’ And they spread a garment, and did cast therein every man the ear-rings of his spoil.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ נָתוֹן נִתֵּן וַיִּפְרְשׂוּ אֶת־הַשִּׂמְלָה וַיַּשְׁלִיכוּ שָׁמָּה אִישׁ נֶזֶם שְׁלָלוֹ׃
    hebrewPlain: ויאמרו נתון נתן ויפרשו את השמלה וישליכו שמה איש נזם שללו
    kjvRefs:
    - Judges 8:25
    kjvOsis:
    - Judg.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.26
    scripture: tanakh
    name: Tanakh Judges 8:26
    ref: Judges 8:26
    book: Judg
    section: neviim
    chapter: 8
    verse: 26
    ordinal: 6740
    text: And the weight of the golden ear-rings that he requested was a thousand and seven hundred shekels of gold; beside the crescents, and the pendants, and the purple raiment that was on the kings of Midian, and beside the chains that were about their camels’ necks.
    translation: JPS 1917
    original: וַיְהִי מִשְׁקַל נִזְמֵי הַזָּהָב אֲשֶׁר שָׁאָל אֶלֶף וּשְׁבַע־מֵאוֹת זָהָב לְבַד מִן־הַשַּׂהֲרֹנִים וְהַנְּטִפוֹת וּבִגְדֵי הָאַרְגָּמָן שֶׁעַל מַלְכֵי מִדְיָן וּלְבַד מִן־הָעֲנָקוֹת אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם׃
    hebrewPlain: ויהי משקל נזמי הזהב אשר שאל אלף ושבע מאות זהב לבד מן השהרנים והנטפות ובגדי הארגמן שעל מלכי מדין ולבד מן הענקות אשר בצוארי גמליהם
    kjvRefs:
    - Judges 8:26
    kjvOsis:
    - Judg.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.27
    scripture: tanakh
    name: Tanakh Judges 8:27
    ref: Judges 8:27
    book: Judg
    section: neviim
    chapter: 8
    verse: 27
    ordinal: 6741
    text: And Gideon made an ephod thereof, and put it in his city, even in Ophrah; and all Israel went astray after it there; and it became a snare unto Gideon, and to his house.
    translation: JPS 1917
    original: וַיַּעַשׂ אוֹתוֹ גִדְעוֹן לְאֵפוֹד וַיַּצֵּג אוֹתוֹ בְעִירוֹ בְּעָפְרָה וַיִּזְנוּ כָל־יִשְׂרָאֵל אַחֲרָיו שָׁם וַיְהִי לְגִדְעוֹן וּלְבֵיתוֹ לְמוֹקֵשׁ׃
    hebrewPlain: ויעש אותו גדעון לאפוד ויצג אותו בעירו בעפרה ויזנו כל ישראל אחריו שם ויהי לגדעון ולביתו למוקש
    kjvRefs:
    - Judges 8:27
    kjvOsis:
    - Judg.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.28
    scripture: tanakh
    name: Tanakh Judges 8:28
    ref: Judges 8:28
    book: Judg
    section: neviim
    chapter: 8
    verse: 28
    ordinal: 6742
    text: So Midian was subdued before the children of Israel, and they lifted up their heads no more. And the land had rest forty years in the days of Gideon.
    translation: JPS 1917
    original: וַיִּכָּנַע מִדְיָן לִפְנֵי בְּנֵי יִשְׂרָאֵל וְלֹא יָסְפוּ לָשֵׂאת רֹאשָׁם וַתִּשְׁקֹט הָאָרֶץ אַרְבָּעִים שָׁנָה בִּימֵי גִדְעוֹן׃
    hebrewPlain: ויכנע מדין לפני בני ישראל ולא יספו לשאת ראשם ותשקט הארץ ארבעים שנה בימי גדעון
    kjvRefs:
    - Judges 8:28
    kjvOsis:
    - Judg.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.29
    scripture: tanakh
    name: Tanakh Judges 8:29
    ref: Judges 8:29
    book: Judg
    section: neviim
    chapter: 8
    verse: 29
    ordinal: 6743
    text: And Jerubbaal the son of Joash went and dwelt in his own house.
    translation: JPS 1917
    original: וַיֵּלֶךְ יְרֻבַּעַל בֶּן־יוֹאָשׁ וַיֵּשֶׁב בְּבֵיתוֹ׃
    hebrewPlain: וילך ירבעל בן יואש וישב בביתו
    kjvRefs:
    - Judges 8:29
    kjvOsis:
    - Judg.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.30
    scripture: tanakh
    name: Tanakh Judges 8:30
    ref: Judges 8:30
    book: Judg
    section: neviim
    chapter: 8
    verse: 30
    ordinal: 6744
    text: And Gideon had threescore and ten sons of his body begotten; for he had many wives.
    translation: JPS 1917
    original: וּלְגִדְעוֹן הָיוּ שִׁבְעִים בָּנִים יֹצְאֵי יְרֵכוֹ כִּי־נָשִׁים רַבּוֹת הָיוּ לוֹ׃
    hebrewPlain: ולגדעון היו שבעים בנים יצאי ירכו כי נשים רבות היו לו
    kjvRefs:
    - Judges 8:30
    kjvOsis:
    - Judg.8.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.31
    scripture: tanakh
    name: Tanakh Judges 8:31
    ref: Judges 8:31
    book: Judg
    section: neviim
    chapter: 8
    verse: 31
    ordinal: 6745
    text: And his concubine that was in Shechem, she also bore him a son, and he called his name Abimelech.
    translation: JPS 1917
    original: וּפִילַגְשׁוֹ אֲשֶׁר בִּשְׁכֶם יָלְדָה־לּוֹ גַם־הִיא בֵּן וַיָּשֶׂם אֶת־שְׁמוֹ אֲבִימֶלֶךְ׃
    hebrewPlain: ופילגשו אשר בשכם ילדה לו גם היא בן וישם את שמו אבימלך
    kjvRefs:
    - Judges 8:31
    kjvOsis:
    - Judg.8.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.32
    scripture: tanakh
    name: Tanakh Judges 8:32
    ref: Judges 8:32
    book: Judg
    section: neviim
    chapter: 8
    verse: 32
    ordinal: 6746
    text: And Gideon the son of Joash died in a good old age, and was buried in the sepulchre of Joash his father, in Ophrah of the Abiezrites.
    translation: JPS 1917
    original: וַיָּמָת גִּדְעוֹן בֶּן־יוֹאָשׁ בְּשֵׂיבָה טוֹבָה וַיִּקָּבֵר בְּקֶבֶר יוֹאָשׁ אָבִיו בְּעָפְרָה אֲבִי הָעֶזְרִי׃
    hebrewPlain: וימת גדעון בן יואש בשיבה טובה ויקבר בקבר יואש אביו בעפרה אבי העזרי
    kjvRefs:
    - Judges 8:32
    kjvOsis:
    - Judg.8.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.33
    scripture: tanakh
    name: Tanakh Judges 8:33
    ref: Judges 8:33
    book: Judg
    section: neviim
    chapter: 8
    verse: 33
    ordinal: 6747
    text: And it came to pass, as soon as Gideon was dead, that the children of Israel again went astray after the Baalim, and made Baal-berith their god.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר מֵת גִּדְעוֹן וַיָּשׁוּבוּ בְּנֵי יִשְׂרָאֵל וַיִּזְנוּ אַחֲרֵי הַבְּעָלִים וַיָּשִׂימוּ לָהֶם בַּעַל בְּרִית לֵאלֹהִים׃
    hebrewPlain: ויהי כאשר מת גדעון וישובו בני ישראל ויזנו אחרי הבעלים וישימו להם בעל ברית לאלהים
    kjvRefs:
    - Judges 8:33
    kjvOsis:
    - Judg.8.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.34
    scripture: tanakh
    name: Tanakh Judges 8:34
    ref: Judges 8:34
    book: Judg
    section: neviim
    chapter: 8
    verse: 34
    ordinal: 6748
    text: And the children of Israel remembered not the LORD their God, who had delivered them out of the hand of all their enemies on every side;
    translation: JPS 1917
    original: וְלֹא זָכְרוּ בְּנֵי יִשְׂרָאֵל אֶת־יְהוָה אֱלֹהֵיהֶם הַמַּצִּיל אוֹתָם מִיַּד כָּל־אֹיְבֵיהֶם מִסָּבִיב׃
    hebrewPlain: ולא זכרו בני ישראל את יהוה אלהיהם המציל אותם מיד כל איביהם מסביב
    kjvRefs:
    - Judges 8:34
    kjvOsis:
    - Judg.8.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.8.35
    scripture: tanakh
    name: Tanakh Judges 8:35
    ref: Judges 8:35
    book: Judg
    section: neviim
    chapter: 8
    verse: 35
    ordinal: 6749
    text: neither showed they kindness to the house of Jerubbaal, namely Gideon, according to all the goodness which he had shown unto Israel.
    translation: JPS 1917
    original: וְלֹא־עָשׂוּ חֶסֶד עִם־בֵּית יְרֻבַּעַל גִּדְעוֹן כְּכָל־הַטּוֹבָה אֲשֶׁר עָשָׂה עִם־יִשְׂרָאֵל׃
    hebrewPlain: ולא עשו חסד עם בית ירבעל גדעון ככל הטובה אשר עשה עם ישראל
    kjvRefs:
    - Judges 8:35
    kjvOsis:
    - Judg.8.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.8
- type: TanakhVerse
  data:
    osis: Judg.9.1
    scripture: tanakh
    name: Tanakh Judges 9:1
    ref: Judges 9:1
    book: Judg
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 6750
    text: 'And Abimelech the son of Jerubbaal went to Shechem unto his mother’s brethren, and spoke with them, and with all the family of the house of his mother’s father, saying:'
    translation: JPS 1917
    original: וַיֵּלֶךְ אֲבִימֶלֶךְ בֶּן־יְרֻבַּעַל שְׁכֶמָה אֶל־אֲחֵי אִמּוֹ וַיְדַבֵּר אֲלֵיהֶם וְאֶל־כָּל־מִשְׁפַּחַת בֵּית־אֲבִי אִמּוֹ לֵאמֹר׃
    hebrewPlain: וילך אבימלך בן ירבעל שכמה אל אחי אמו וידבר אליהם ואל כל משפחת בית אבי אמו לאמר
    kjvRefs:
    - Judges 9:1
    kjvOsis:
    - Judg.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.2
    scripture: tanakh
    name: Tanakh Judges 9:2
    ref: Judges 9:2
    book: Judg
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 6751
    text: '’Speak, I pray you, in the ears of all the men of Shechem: Which is better for you, that all the sons of Jerubbaal, who are threescore and ten persons, rule over you, or that one rule over you? remember also that I am your bone and your flesh.’'
    translation: JPS 1917
    original: דַּבְּרוּ־נָא בְּאָזְנֵי כָל־בַּעֲלֵי שְׁכֶם מַה־טּוֹב לָכֶם הַמְשֹׁל בָּכֶם שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל אִם־מְשֹׁל בָּכֶם אִישׁ אֶחָד וּזְכַרְתֶּם כִּי־עַצְמֵכֶם וּבְשַׂרְכֶם אָנִי׃
    hebrewPlain: דברו נא באזני כל בעלי שכם מה טוב לכם המשל בכם שבעים איש כל בני ירבעל אם משל בכם איש אחד וזכרתם כי עצמכם ובשרכם אני
    kjvRefs:
    - Judges 9:2
    kjvOsis:
    - Judg.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.3
    scripture: tanakh
    name: Tanakh Judges 9:3
    ref: Judges 9:3
    book: Judg
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 6752
    text: 'And his mother’s brethren spoke of him in the ears of all the men of Shechem all these words; and their hearts inclined to follow Abimelech; for they said: ‘He is our brother.’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ אֲחֵי־אִמּוֹ עָלָיו בְּאָזְנֵי כָּל־בַּעֲלֵי שְׁכֶם אֵת כָּל־הַדְּבָרִים הָאֵלֶּה וַיֵּט לִבָּם אַחֲרֵי אֲבִימֶלֶךְ כִּי אָמְרוּ אָחִינוּ הוּא׃
    hebrewPlain: וידברו אחי אמו עליו באזני כל בעלי שכם את כל הדברים האלה ויט לבם אחרי אבימלך כי אמרו אחינו הוא
    kjvRefs:
    - Judges 9:3
    kjvOsis:
    - Judg.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.4
    scripture: tanakh
    name: Tanakh Judges 9:4
    ref: Judges 9:4
    book: Judg
    section: neviim
    chapter: 9
    verse: 4
    ordinal: 6753
    text: And they gave him threescore and ten pieces of silver out of the house of Baal-berith, wherewith Abimelech hired vain and light fellows, who followed him.
    translation: JPS 1917
    original: וַיִּתְּנוּ־לוֹ שִׁבְעִים כֶּסֶף מִבֵּיתּ בַעַל בְּרִית וַיִּשְׂכֹּר בָּהֶם אֲבִימֶלֶךְ אֲנָשִׁים רֵיקִים וּפֹחֲזִים וַיֵּלְכוּ אַחֲרָיו׃
    hebrewPlain: ויתנו לו שבעים כסף מבית בעל ברית וישכר בהם אבימלך אנשים ריקים ופחזים וילכו אחריו
    kjvRefs:
    - Judges 9:4
    kjvOsis:
    - Judg.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.5
    scripture: tanakh
    name: Tanakh Judges 9:5
    ref: Judges 9:5
    book: Judg
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 6754
    text: And he went unto his father’s house at Ophrah, and slew his brethren the sons of Jerubbaal, being threescore and ten persons, upon one stone; but Jotham the youngest son of Jerubbaal was left; for he hid himself.
    translation: JPS 1917
    original: וַיָּבֹא בֵית־אָבִיו עָפְרָתָה וַיַּהֲרֹג אֶת־אֶחָיו בְּנֵי־יְרֻבַּעַל שִׁבְּעִים אִישׁ עַל־אֶבֶן אֶחָת וַיִּוָּתֵר יוֹתָם בֶּן־יְרֻבַּעַל הַקָּטֹן כִּי נֶחְבָּא׃
    hebrewPlain: ויבא בית אביו עפרתה ויהרג את אחיו בני ירבעל שבעים איש על אבן אחת ויותר יותם בן ירבעל הקטן כי נחבא
    kjvRefs:
    - Judges 9:5
    kjvOsis:
    - Judg.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.6
    scripture: tanakh
    name: Tanakh Judges 9:6
    ref: Judges 9:6
    book: Judg
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 6755
    text: And all the men of Shechem assembled themselves together, and all Beth-millo, and went and made Abimelech king, by the terebinth of the pillar that was in Shechem.
    translation: JPS 1917
    original: וַיֵּאָסְפוּ כָּל־בַּעֲלֵי שְׁכֶם וְכָל־בֵּית מִלּוֹא וַיֵּלְכוּ וַיַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ לְמֶלֶךְ עִם־אֵלוֹן מֻצָּב אֲשֶׁר בִּשְׁכֶם׃
    hebrewPlain: ויאספו כל בעלי שכם וכל בית מלוא וילכו וימליכו את אבימלך למלך עם אלון מצב אשר בשכם
    kjvRefs:
    - Judges 9:6
    kjvOsis:
    - Judg.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.7
    scripture: tanakh
    name: Tanakh Judges 9:7
    ref: Judges 9:7
    book: Judg
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 6756
    text: 'And when they told it to Jotham, he went and stood in the top of mount Gerizim, and lifted up his voice, and cried, and said unto them: ‘Hearken unto me, ye men of Shechem, that God may hearken unto you.'
    translation: JPS 1917
    original: וַיַּגִּדוּ לְיוֹתָם וַיֵּלֶךְ וַיַּעֲמֹד בְּרֹאשׁ הַר־גְּרִזִים וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא וַיֹּאמֶר לָהֶם שִׁמְעוּ אֵלַי בַּעֲלֵי שְׁכֶם וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים׃
    hebrewPlain: ויגדו ליותם וילך ויעמד בראש הר גרזים וישא קולו ויקרא ויאמר להם שמעו אלי בעלי שכם וישמע אליכם אלהים
    kjvRefs:
    - Judges 9:7
    kjvOsis:
    - Judg.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.8
    scripture: tanakh
    name: Tanakh Judges 9:8
    ref: Judges 9:8
    book: Judg
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 6757
    text: 'The trees went forth on a time to anoint a king over them; and they said unto the olive-tree: Reign thou over us.'
    translation: JPS 1917
    original: הָלוֹךְ הָלְכוּ הָעֵצִים לִמְשֹׁחַ עֲלֵיהֶם מֶלֶךְ וַיֹּאמְרוּ לַזַּיִת מלוכה [מָלְכָה] עָלֵינוּ׃
    hebrewPlain: הלוך הלכו העצים למשח עליהם מלך ויאמרו לזית מלוכה [מלכה] עלינו
    kjvRefs:
    - Judges 9:8
    kjvOsis:
    - Judg.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.9
    scripture: tanakh
    name: Tanakh Judges 9:9
    ref: Judges 9:9
    book: Judg
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 6758
    text: 'But the olive-tree said unto them: Should I leave my fatness, seeing that by me they honour God and man, and go to hold sway over the trees?'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם הַזַּיִת הֶחֳדַלְתִּי אֶת־דִּשְׁנִי אֲשֶׁר־בִּי יְכַבְּדוּ אֱלֹהִים וַאֲנָשִׁים וְהָלַכְתִּי לָנוּעַ עַל־הָעֵצִים׃
    hebrewPlain: ויאמר להם הזית החדלתי את דשני אשר בי יכבדו אלהים ואנשים והלכתי לנוע על העצים
    kjvRefs:
    - Judges 9:9
    kjvOsis:
    - Judg.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.10
    scripture: tanakh
    name: Tanakh Judges 9:10
    ref: Judges 9:10
    book: Judg
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 6759
    text: 'And the trees said to the fig-tree: Come thou, and reign over us.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הָעֵצִים לַתְּאֵנָה לְכִי־אַתְּ מָלְכִי עָלֵינוּ׃
    hebrewPlain: ויאמרו העצים לתאנה לכי את מלכי עלינו
    kjvRefs:
    - Judges 9:10
    kjvOsis:
    - Judg.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.11
    scripture: tanakh
    name: Tanakh Judges 9:11
    ref: Judges 9:11
    book: Judg
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 6760
    text: 'But the fig-tree said unto them: Should I leave my sweetness, and my good fruitage, and go to hold sway over the trees?'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהֶם הַתְּאֵנָה הֶחֳדַלְתִּי אֶת־מָתְקִי וְאֶת־תְּנוּבָתִי הַטּוֹבָה וְהָלַכְתִּי לָנוּעַ עַל־הָעֵצִים׃
    hebrewPlain: ותאמר להם התאנה החדלתי את מתקי ואת תנובתי הטובה והלכתי לנוע על העצים
    kjvRefs:
    - Judges 9:11
    kjvOsis:
    - Judg.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.12
    scripture: tanakh
    name: Tanakh Judges 9:12
    ref: Judges 9:12
    book: Judg
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 6761
    text: 'And the trees said unto the vine: Come thou, and reign over us.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הָעֵצִים לַגָּפֶן לְכִי־אַתְּ מלוכי [מָלְכִי] עָלֵינוּ׃
    hebrewPlain: ויאמרו העצים לגפן לכי את מלוכי [מלכי] עלינו
    kjvRefs:
    - Judges 9:12
    kjvOsis:
    - Judg.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.13
    scripture: tanakh
    name: Tanakh Judges 9:13
    ref: Judges 9:13
    book: Judg
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 6762
    text: 'And the vine said unto them: Should I leave my wine, which cheereth God and man, and go to hold sway over the trees?'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהֶם הַגֶּפֶן הֶחֳדַלְתִּי אֶת־תִּירוֹשִׁי הַמְשַׂמֵּחַ אֱלֹהִים וַאֲנָשִׁים וְהָלַכְתִּי לָנוּעַ עַל־הָעֵצִים׃
    hebrewPlain: ותאמר להם הגפן החדלתי את תירושי המשמח אלהים ואנשים והלכתי לנוע על העצים
    kjvRefs:
    - Judges 9:13
    kjvOsis:
    - Judg.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.14
    scripture: tanakh
    name: Tanakh Judges 9:14
    ref: Judges 9:14
    book: Judg
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 6763
    text: 'Then said all the trees unto the bramble: Come thou, and reign over us.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ כָל־הָעֵצִים אֶל־הָאָטָד לֵךְ אַתָּה מְלָךְ־עָלֵינוּ׃
    hebrewPlain: ויאמרו כל העצים אל האטד לך אתה מלך עלינו
    kjvRefs:
    - Judges 9:14
    kjvOsis:
    - Judg.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.15
    scripture: tanakh
    name: Tanakh Judges 9:15
    ref: Judges 9:15
    book: Judg
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 6764
    text: 'And the bramble said unto the trees: If in truth ye anoint me king over you, then come and take refuge in my shadow; and if not, let fire come out of the bramble, and devour the cedars of Lebanon.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָאָטָד אֶל־הָעֵצִים אִם בֶּאֱמֶת אַתֶּם מֹשְׁחִים אֹתִי לְמֶלֶךְ עֲלֵיכֶם בֹּאוּ חֲסוּ בְצִלִּי וְאִם־אַיִן תֵּצֵא אֵשׁ מִן־הָאָטָד וְתֹאכַל אֶת־אַרְזֵי הַלְּבָנוֹן׃
    hebrewPlain: ויאמר האטד אל העצים אם באמת אתם משחים אתי למלך עליכם באו חסו בצלי ואם אין תצא אש מן האטד ותאכל את ארזי הלבנון
    kjvRefs:
    - Judges 9:15
    kjvOsis:
    - Judg.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.16
    scripture: tanakh
    name: Tanakh Judges 9:16
    ref: Judges 9:16
    book: Judg
    section: neviim
    chapter: 9
    verse: 16
    ordinal: 6765
    text: Now therefore, if ye have dealt truly and uprightly, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands—
    translation: JPS 1917
    original: וְעַתָּה אִם־בֶּאֱמֶת וּבְתָמִים עֲשִׂיתֶם וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ וְאִם־טוֹבָה עֲשִׂיתֶם עִם־יְרֻבַּעַל וְעִם־בֵּיתוֹ וְאִם־כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ׃
    hebrewPlain: ועתה אם באמת ובתמים עשיתם ותמליכו את אבימלך ואם טובה עשיתם עם ירבעל ועם ביתו ואם כגמול ידיו עשיתם לו
    kjvRefs:
    - Judges 9:16
    kjvOsis:
    - Judg.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.17
    scripture: tanakh
    name: Tanakh Judges 9:17
    ref: Judges 9:17
    book: Judg
    section: neviim
    chapter: 9
    verse: 17
    ordinal: 6766
    text: for my father fought for you, and adventured his life, and delivered you out of the hand of Midian;
    translation: JPS 1917
    original: אֲשֶׁר־נִלְחַם אָבִי עֲלֵיכֶם וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד וַיַּצֵּל אֶתְכֶם מִיַּד מִדְיָן׃
    hebrewPlain: אשר נלחם אבי עליכם וישלך את נפשו מנגד ויצל אתכם מיד מדין
    kjvRefs:
    - Judges 9:17
    kjvOsis:
    - Judg.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.18
    scripture: tanakh
    name: Tanakh Judges 9:18
    ref: Judges 9:18
    book: Judg
    section: neviim
    chapter: 9
    verse: 18
    ordinal: 6767
    text: and ye are risen up against my father’s house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made Abimelech, the son of his maid-servant, king over the men of Shechem, because he is your brother—
    translation: JPS 1917
    original: וְאַתֶּם קַמְתֶּם עַל־בֵּית אָבִי הַיּוֹם וַתַּהַרְגוּ אֶת־בָּנָיו שִׁבְעִים אִישׁ עַל־אֶבֶן אֶחָת וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ בֶּן־אֲמָתוֹ עַל־בַּעֲלֵי שְׁכֶם כִּי אֲחִיכֶם הוּא׃
    hebrewPlain: ואתם קמתם על בית אבי היום ותהרגו את בניו שבעים איש על אבן אחת ותמליכו את אבימלך בן אמתו על בעלי שכם כי אחיכם הוא
    kjvRefs:
    - Judges 9:18
    kjvOsis:
    - Judg.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.19
    scripture: tanakh
    name: Tanakh Judges 9:19
    ref: Judges 9:19
    book: Judg
    section: neviim
    chapter: 9
    verse: 19
    ordinal: 6768
    text: if ye then have dealt truly and uprightly with Jerubbaal and with his house this day, then rejoice ye in Abimelech, and let him also rejoice in you.
    translation: JPS 1917
    original: וְאִם־בֶּאֱמֶת וּבְתָמִים עֲשִׂיתֶם עִם־יְרֻבַּעַל וְעִם־בֵּיתוֹ הַיּוֹם הַזֶּה שִׂמְחוּ בַּאֲבִימֶלֶךְ וְיִשְׂמַח גַּם־הוּא בָּכֶם׃
    hebrewPlain: ואם באמת ובתמים עשיתם עם ירבעל ועם ביתו היום הזה שמחו באבימלך וישמח גם הוא בכם
    kjvRefs:
    - Judges 9:19
    kjvOsis:
    - Judg.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.20
    scripture: tanakh
    name: Tanakh Judges 9:20
    ref: Judges 9:20
    book: Judg
    section: neviim
    chapter: 9
    verse: 20
    ordinal: 6769
    text: But if not, let fire come out from Abimelech, and devour the men of Shechem, and Beth-millo; and let fire come out from the men of Shechem, and from Beth-millo, and devour Abimelech.’
    translation: JPS 1917
    original: וְאִם־אַיִן תֵּצֵא אֵשׁ מֵאֲבִימֶלֶךְ וְתֹאכַל אֶת־בַּעֲלֵי שְׁכֶם וְאֶת־בֵּית מִלּוֹא וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא וְתֹאכַל אֶת־אֲבִימֶלֶךְ׃
    hebrewPlain: ואם אין תצא אש מאבימלך ותאכל את בעלי שכם ואת בית מלוא ותצא אש מבעלי שכם ומבית מלוא ותאכל את אבימלך
    kjvRefs:
    - Judges 9:20
    kjvOsis:
    - Judg.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.21
    scripture: tanakh
    name: Tanakh Judges 9:21
    ref: Judges 9:21
    book: Judg
    section: neviim
    chapter: 9
    verse: 21
    ordinal: 6770
    text: And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother.
    translation: JPS 1917
    original: וַיָּנָס יוֹתָם וַיִּבְרַח וַיֵּלֶךְ בְּאֵרָה וַיֵּשֶׁב שָׁם מִפְּנֵי אֲבִימֶלֶךְ אָחִיו׃
    hebrewPlain: וינס יותם ויברח וילך בארה וישב שם מפני אבימלך אחיו
    kjvRefs:
    - Judges 9:21
    kjvOsis:
    - Judg.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.22
    scripture: tanakh
    name: Tanakh Judges 9:22
    ref: Judges 9:22
    book: Judg
    section: neviim
    chapter: 9
    verse: 22
    ordinal: 6771
    text: And Abimelech was prince over Israel three years.
    translation: JPS 1917
    original: וַיָּשַׂר אֲבִימֶלֶךְ עַל־יִשְׂרָאֵל שָׁלֹשׁ שָׁנִים׃
    hebrewPlain: וישר אבימלך על ישראל שלש שנים
    kjvRefs:
    - Judges 9:22
    kjvOsis:
    - Judg.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.23
    scripture: tanakh
    name: Tanakh Judges 9:23
    ref: Judges 9:23
    book: Judg
    section: neviim
    chapter: 9
    verse: 23
    ordinal: 6772
    text: And God sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem dealt treacherously with Abimelech;
    translation: JPS 1917
    original: וַיִּשְׁלַח אֱלֹהִים רוּחַ רָעָה בֵּין אֲבִימֶלֶךְ וּבֵין בַּעֲלֵי שְׁכֶם וַיִּבְגְּדוּ בַעֲלֵי־שְׁכֶם בַּאֲבִימֶלֶךְ׃
    hebrewPlain: וישלח אלהים רוח רעה בין אבימלך ובין בעלי שכם ויבגדו בעלי שכם באבימלך
    kjvRefs:
    - Judges 9:23
    kjvOsis:
    - Judg.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.24
    scripture: tanakh
    name: Tanakh Judges 9:24
    ref: Judges 9:24
    book: Judg
    section: neviim
    chapter: 9
    verse: 24
    ordinal: 6773
    text: that the violence done to the threescore and ten sons of Jerubbaal might come, and that their blood might be laid upon Abimelech their brother, who slew them, and upon the men of Shechem, who strengthened his hands to slay his brethren.
    translation: JPS 1917
    original: לָבוֹא חֲמַס שִׁבְעִים בְּנֵי־יְרֻבָּעַל וְדָמָם לָשׂוּם עַל־אֲבִימֶלֶךְ אֲחִיהֶם אֲשֶׁר הָרַג אוֹתָם וְעַל בַּעֲלֵי שְׁכֶם אֲשֶׁר־חִזְּקוּ אֶת־יָדָיו לַהֲרֹג אֶת־אֶחָיו׃
    hebrewPlain: לבוא חמס שבעים בני ירבעל ודמם לשום על אבימלך אחיהם אשר הרג אותם ועל בעלי שכם אשר חזקו את ידיו להרג את אחיו
    kjvRefs:
    - Judges 9:24
    kjvOsis:
    - Judg.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.25
    scripture: tanakh
    name: Tanakh Judges 9:25
    ref: Judges 9:25
    book: Judg
    section: neviim
    chapter: 9
    verse: 25
    ordinal: 6774
    text: And the men of Shechem set liers-in-wait for him on the tops of the mountains, and they robbed all that came along that way by them; and it was told Abimelech.
    translation: JPS 1917
    original: וַיָּשִׂימוּ לוֹ בַעֲלֵי שְׁכֶם מְאָרְבִים עַל רָאשֵׁי הֶהָרִים וַיִּגְזְלוּ אֵת כָּל־אֲשֶׁר־יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ וַיֻּגַּד לַאֲבִימֶלֶךְ׃
    hebrewPlain: וישימו לו בעלי שכם מארבים על ראשי ההרים ויגזלו את כל אשר יעבר עליהם בדרך ויגד לאבימלך
    kjvRefs:
    - Judges 9:25
    kjvOsis:
    - Judg.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.26
    scripture: tanakh
    name: Tanakh Judges 9:26
    ref: Judges 9:26
    book: Judg
    section: neviim
    chapter: 9
    verse: 26
    ordinal: 6775
    text: And Gaal the son of Ebed came with his brethren, and went on to Shechem; and the men of Shechem put their trust in him.
    translation: JPS 1917
    original: וַיָּבֹא גַּעַל בֶּן־עֶבֶד וְאֶחָיו וַיַּעַבְרוּ בִּשְׁכֶם וַיִּבְטְחוּ־בוֹ בַּעֲלֵי שְׁכֶם׃
    hebrewPlain: ויבא געל בן עבד ואחיו ויעברו בשכם ויבטחו בו בעלי שכם
    kjvRefs:
    - Judges 9:26
    kjvOsis:
    - Judg.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.27
    scripture: tanakh
    name: Tanakh Judges 9:27
    ref: Judges 9:27
    book: Judg
    section: neviim
    chapter: 9
    verse: 27
    ordinal: 6776
    text: And they went out into the field, and gathered their vineyards, and trod the grapes, and held festival, and went into the house of their god, and did eat and drink, and cursed Abimelech.
    translation: JPS 1917
    original: וַיֵּצְאוּ הַשָּׂדֶה וַיִּבְצְרוּ אֶת־כַּרְמֵיהֶם וַיִּדְרְכוּ וַיַּעֲשׂוּ הִלּוּלִים וַיָּבֹאוּ בֵּית אֱ‍לֹהֵיהֶם וַיֹּאכְלוּ וַיִּשְׁתּוּ וַיְקַלְלוּ אֶת־אֲבִימֶלֶךְ׃
    hebrewPlain: ויצאו השדה ויבצרו את כרמיהם וידרכו ויעשו הלולים ויבאו בית א‍להיהם ויאכלו וישתו ויקללו את אבימלך
    kjvRefs:
    - Judges 9:27
    kjvOsis:
    - Judg.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.28
    scripture: tanakh
    name: Tanakh Judges 9:28
    ref: Judges 9:28
    book: Judg
    section: neviim
    chapter: 9
    verse: 28
    ordinal: 6777
    text: 'And Gaal the son of Ebed said: ‘Who is Abimelech, and who is Shechem, that we should serve him? is not he the son of Jerubbaal? and Zebul his officer? serve ye the men of Hamor the father of Shechem; but why should we serve him?'
    translation: JPS 1917
    original: וַיֹּאמֶר גַּעַל בֶּן־עֶבֶד מִי־אֲבִימֶלֶךְ וּמִי־שְׁכֶם כִּי נַעַבְדֶנּוּ הֲלֹא בֶן־יְרֻבַּעַל וּזְבֻל פְּקִידוֹ עִבְדוּ אֶת־אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ׃
    hebrewPlain: ויאמר געל בן עבד מי אבימלך ומי שכם כי נעבדנו הלא בן ירבעל וזבל פקידו עבדו את אנשי חמור אבי שכם ומדוע נעבדנו אנחנו
    kjvRefs:
    - Judges 9:28
    kjvOsis:
    - Judg.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.29
    scripture: tanakh
    name: Tanakh Judges 9:29
    ref: Judges 9:29
    book: Judg
    section: neviim
    chapter: 9
    verse: 29
    ordinal: 6778
    text: 'And would that this people were under my hand! then would I remove Abimelech.’ And he said to Abimelech: ‘Increase thine army, and come out.’'
    translation: JPS 1917
    original: וּמִי יִתֵּן אֶת־הָעָם הַזֶּה בְּיָדִי וְאָסִירָה אֶת־אֲבִימֶלֶךְ וַיֹּאמֶר לַאֲבִימֶלֶךְ רַבֶּה צְבָאֲךָ וָצֵאָה׃
    hebrewPlain: ומי יתן את העם הזה בידי ואסירה את אבימלך ויאמר לאבימלך רבה צבאך וצאה
    kjvRefs:
    - Judges 9:29
    kjvOsis:
    - Judg.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.30
    scripture: tanakh
    name: Tanakh Judges 9:30
    ref: Judges 9:30
    book: Judg
    section: neviim
    chapter: 9
    verse: 30
    ordinal: 6779
    text: And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled.
    translation: JPS 1917
    original: וַיִּשְׁמַע זְבֻל שַׂר־הָעִיר אֶת־דִּבְרֵי גַּעַל בֶּן־עָבֶד וַיִּחַר אַפּוֹ׃
    hebrewPlain: וישמע זבל שר העיר את דברי געל בן עבד ויחר אפו
    kjvRefs:
    - Judges 9:30
    kjvOsis:
    - Judg.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.31
    scripture: tanakh
    name: Tanakh Judges 9:31
    ref: Judges 9:31
    book: Judg
    section: neviim
    chapter: 9
    verse: 31
    ordinal: 6780
    text: 'And he sent messengers unto Abimelech in Tormah, saying: ‘Behold, Gaal the son of Ebed and his brethren are come to Shechem; and, behold, they will incite the city against thee.'
    translation: JPS 1917
    original: וַיִּשְׁלַח מַלְאָכִים אֶל־אֲבִימֶלֶךְ בְּתָרְמָה לֵאמֹר הִנֵּה גַעַל בֶּן־עֶבֶד וְאֶחָיו בָּאִים שְׁכֶמָה וְהִנָּם צָרִים אֶת־הָעִיר עָלֶיךָ׃
    hebrewPlain: וישלח מלאכים אל אבימלך בתרמה לאמר הנה געל בן עבד ואחיו באים שכמה והנם צרים את העיר עליך
    kjvRefs:
    - Judges 9:31
    kjvOsis:
    - Judg.9.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.32
    scripture: tanakh
    name: Tanakh Judges 9:32
    ref: Judges 9:32
    book: Judg
    section: neviim
    chapter: 9
    verse: 32
    ordinal: 6781
    text: Now therefore, up by night, thou and the people that are with thee, and lie in wait in the field.
    translation: JPS 1917
    original: וְעַתָּה קוּם לַיְלָה אַתָּה וְהָעָם אֲשֶׁר־אִתָּךְ וֶאֱרֹב בַּשָּׂדֶה׃
    hebrewPlain: ועתה קום לילה אתה והעם אשר אתך וארב בשדה
    kjvRefs:
    - Judges 9:32
    kjvOsis:
    - Judg.9.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.33
    scripture: tanakh
    name: Tanakh Judges 9:33
    ref: Judges 9:33
    book: Judg
    section: neviim
    chapter: 9
    verse: 33
    ordinal: 6782
    text: And it shall be, that in the morning, as soon as the sun is up, thou shalt rise early, and set upon the city; and, behold, when he and the people that are with him come out against thee, then mayest thou do to them as thou shalt be able.’
    translation: JPS 1917
    original: וְהָיָה בַבֹּקֶר כִּזְרֹחַ הַשֶּׁמֶשׁ תַּשְׁכִּים וּפָשַׁטְתָּ עַל־הָעִיר וְהִנֵּה־הוּא וְהָעָם אֲשֶׁר־אִתּוֹ יֹצְאִים אֵלֶיךָ וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר תִּמְצָא יָדֶךָ׃
    hebrewPlain: והיה בבקר כזרח השמש תשכים ופשטת על העיר והנה הוא והעם אשר אתו יצאים אליך ועשית לו כאשר תמצא ידך
    kjvRefs:
    - Judges 9:33
    kjvOsis:
    - Judg.9.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.34
    scripture: tanakh
    name: Tanakh Judges 9:34
    ref: Judges 9:34
    book: Judg
    section: neviim
    chapter: 9
    verse: 34
    ordinal: 6783
    text: And Abimelech rose up, and all the people that were with him, by night, and they lay in wait against Shechem in four companies.
    translation: JPS 1917
    original: וַיָּקָם אֲבִימֶלֶךְ וְכָל־הָעָם אֲשֶׁר־עִמּוֹ לָיְלָה וַיֶּאֶרְבוּ עַל־שְׁכֶם אַרְבָּעָה רָאשִׁים׃
    hebrewPlain: ויקם אבימלך וכל העם אשר עמו לילה ויארבו על שכם ארבעה ראשים
    kjvRefs:
    - Judges 9:34
    kjvOsis:
    - Judg.9.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.35
    scripture: tanakh
    name: Tanakh Judges 9:35
    ref: Judges 9:35
    book: Judg
    section: neviim
    chapter: 9
    verse: 35
    ordinal: 6784
    text: And Gaal the son of Ebed went out, and stood in the entrance of the gate of the city; and Abimelech rose up, and the people that were with him, from the ambushment.
    translation: JPS 1917
    original: וַיֵּצֵא גַּעַל בֶּן־עֶבֶד וַיַּעֲמֹד פֶּתַח שַׁעַר הָעִיר וַיָּקָם אֲבִימֶלֶךְ וְהָעָם אֲשֶׁר־אִתּוֹ מִן־הַמַּאְרָב׃
    hebrewPlain: ויצא געל בן עבד ויעמד פתח שער העיר ויקם אבימלך והעם אשר אתו מן המארב
    kjvRefs:
    - Judges 9:35
    kjvOsis:
    - Judg.9.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.36
    scripture: tanakh
    name: Tanakh Judges 9:36
    ref: Judges 9:36
    book: Judg
    section: neviim
    chapter: 9
    verse: 36
    ordinal: 6785
    text: 'And when Gaal saw the people, he said to Zebul: ‘Behold, there come people down from the tops of the mountains.’ And Zebul said unto him: ‘Thou seest the shadow of the mountains as if they were men.’'
    translation: JPS 1917
    original: וַיַּרְא־גַּעַל אֶת־הָעָם וַיֹּאמֶר אֶל־זְבֻל הִנֵּה־עָם יוֹרֵד מֵרָאשֵׁי הֶהָרִים וַיֹּאמֶר אֵלָיו זְבֻל אֵת צֵל הֶהָרִים אַתָּה רֹאֶה כָּאֲנָשִׁים׃
    hebrewPlain: וירא געל את העם ויאמר אל זבל הנה עם יורד מראשי ההרים ויאמר אליו זבל את צל ההרים אתה ראה כאנשים
    kjvRefs:
    - Judges 9:36
    kjvOsis:
    - Judg.9.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.37
    scripture: tanakh
    name: Tanakh Judges 9:37
    ref: Judges 9:37
    book: Judg
    section: neviim
    chapter: 9
    verse: 37
    ordinal: 6786
    text: 'And Gaal spoke again and said: ‘See, there come people down by the middle of the land, and one company cometh by the way of Elon-meonenim.’'
    translation: JPS 1917
    original: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר וַיֹּאמֶר הִנֵּה־עָם יוֹרְדִים מֵעִם טַבּוּר הָאָרֶץ וְרֹאשׁ־אֶחָד בָּא מִדֶּרֶךְ אֵלוֹן מְעוֹנְנִים׃
    hebrewPlain: ויסף עוד געל לדבר ויאמר הנה עם יורדים מעם טבור הארץ וראש אחד בא מדרך אלון מעוננים
    kjvRefs:
    - Judges 9:37
    kjvOsis:
    - Judg.9.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.38
    scripture: tanakh
    name: Tanakh Judges 9:38
    ref: Judges 9:38
    book: Judg
    section: neviim
    chapter: 9
    verse: 38
    ordinal: 6787
    text: 'Then said Zebul unto him: ‘Where is now thy mouth, that thou saidst: Who is Abimelech, that we should serve him? is not this the people that thou hast despised? go out now, I pray, and fight with them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו זְבֻל אַיֵּה אֵפוֹא פִיךָ אֲשֶׁר תֹּאמַר מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ הֲלֹא זֶה הָעָם אֲשֶׁר מָאַסְתָּה בּוֹ צֵא־נָא עַתָּה וְהִלָּחֶם בּוֹ׃
    hebrewPlain: ויאמר אליו זבל איה אפוא פיך אשר תאמר מי אבימלך כי נעבדנו הלא זה העם אשר מאסתה בו צא נא עתה והלחם בו
    kjvRefs:
    - Judges 9:38
    kjvOsis:
    - Judg.9.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.39
    scripture: tanakh
    name: Tanakh Judges 9:39
    ref: Judges 9:39
    book: Judg
    section: neviim
    chapter: 9
    verse: 39
    ordinal: 6788
    text: And Gaal went out before the men of Shechem, and fought with Abimelech.
    translation: JPS 1917
    original: וַיֵּצֵא גַעַל לִפְנֵי בַּעֲלֵי שְׁכֶם וַיִּלָּחֶם בַּאֲבִימֶלֶךְ׃
    hebrewPlain: ויצא געל לפני בעלי שכם וילחם באבימלך
    kjvRefs:
    - Judges 9:39
    kjvOsis:
    - Judg.9.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.40
    scripture: tanakh
    name: Tanakh Judges 9:40
    ref: Judges 9:40
    book: Judg
    section: neviim
    chapter: 9
    verse: 40
    ordinal: 6789
    text: And Abimelech chased him, and he fled before him, and there fell many wounded, even unto the entrance of the gate.
    translation: JPS 1917
    original: וַיִּרְדְּפֵהוּ אֲבִימֶלֶךְ וַיָּנָס מִפָּנָיו וַיִּפְּלוּ חֲלָלִים רַבִּים עַד־פֶּתַח הַשָּׁעַר׃
    hebrewPlain: וירדפהו אבימלך וינס מפניו ויפלו חללים רבים עד פתח השער
    kjvRefs:
    - Judges 9:40
    kjvOsis:
    - Judg.9.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.41
    scripture: tanakh
    name: Tanakh Judges 9:41
    ref: Judges 9:41
    book: Judg
    section: neviim
    chapter: 9
    verse: 41
    ordinal: 6790
    text: And Abimelech dwelt at Arumah; and Zebul drove out Gaal and his brethren, that they should not dwell in Shechem.
    translation: JPS 1917
    original: וַיֵּשֶׁב אֲבִימֶלֶךְ בָּארוּמָה וַיְגָרֶשׁ זְבֻל אֶת־גַּעַל וְאֶת־אֶחָיו מִשֶּׁבֶת בִּשְׁכֶם׃
    hebrewPlain: וישב אבימלך בארומה ויגרש זבל את געל ואת אחיו משבת בשכם
    kjvRefs:
    - Judges 9:41
    kjvOsis:
    - Judg.9.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.42
    scripture: tanakh
    name: Tanakh Judges 9:42
    ref: Judges 9:42
    book: Judg
    section: neviim
    chapter: 9
    verse: 42
    ordinal: 6791
    text: And it came to pass on the morrow, that the people went out into the field; and it was told Abimelech.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַיֵּצֵא הָעָם הַשָּׂדֶה וַיַּגִּדוּ לַאֲבִימֶלֶךְ׃
    hebrewPlain: ויהי ממחרת ויצא העם השדה ויגדו לאבימלך
    kjvRefs:
    - Judges 9:42
    kjvOsis:
    - Judg.9.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.43
    scripture: tanakh
    name: Tanakh Judges 9:43
    ref: Judges 9:43
    book: Judg
    section: neviim
    chapter: 9
    verse: 43
    ordinal: 6792
    text: And he took the people, and divided them into three companies, and lay in wait in the field; and he looked, and, behold, the people were coming forth out of the city; and he rose up against them, and smote them.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־הָעָם וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים וַיֶּאֱרֹב בַּשָּׂדֶה וַיַּרְא וְהִנֵּה הָעָם יֹצֵא מִן־הָעִיר וַיָּקָם עֲלֵיהֶם וַיַּכֵּם׃
    hebrewPlain: ויקח את העם ויחצם לשלשה ראשים ויארב בשדה וירא והנה העם יצא מן העיר ויקם עליהם ויכם
    kjvRefs:
    - Judges 9:43
    kjvOsis:
    - Judg.9.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.44
    scripture: tanakh
    name: Tanakh Judges 9:44
    ref: Judges 9:44
    book: Judg
    section: neviim
    chapter: 9
    verse: 44
    ordinal: 6793
    text: And Abimelech, and the companies that were with him, rushed forward, and stood in the entrance of the gate of the city; and the two companies rushed upon all that were in the field, and smote them.
    translation: JPS 1917
    original: וַאֲבִימֶלֶךְ וְהָרָאשִׁים אֲשֶׁר עִמּוֹ פָּשְׁטוּ וַיַּעַמְדוּ פֶּתַח שַׁעַר הָעִיר וּשְׁנֵי הָרָאשִׁים פָּשְׁטוּ עַל־כָּל־אֲשֶׁר בַּשָּׂדֶה וַיַּכּוּם׃
    hebrewPlain: ואבימלך והראשים אשר עמו פשטו ויעמדו פתח שער העיר ושני הראשים פשטו על כל אשר בשדה ויכום
    kjvRefs:
    - Judges 9:44
    kjvOsis:
    - Judg.9.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.45
    scripture: tanakh
    name: Tanakh Judges 9:45
    ref: Judges 9:45
    book: Judg
    section: neviim
    chapter: 9
    verse: 45
    ordinal: 6794
    text: And Abimelech fought against the city all that day; and he took the city, and slew the people that were therein; and he beat down the city, and sowed it with salt.
    translation: JPS 1917
    original: וַאֲבִימֶלֶךְ נִלְחָם בָּעִיר כֹּל הַיּוֹם הַהוּא וַיִּלְכֹּד אֶת־הָעִיר וְאֶת־הָעָם אֲשֶׁר־בָּהּ הָרָג וַיִּתֹּץ אֶת־הָעִיר וַיִּזְרָעֶהָ מֶלַח׃
    hebrewPlain: ואבימלך נלחם בעיר כל היום ההוא וילכד את העיר ואת העם אשר בה הרג ויתץ את העיר ויזרעה מלח
    kjvRefs:
    - Judges 9:45
    kjvOsis:
    - Judg.9.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.46
    scripture: tanakh
    name: Tanakh Judges 9:46
    ref: Judges 9:46
    book: Judg
    section: neviim
    chapter: 9
    verse: 46
    ordinal: 6795
    text: And when all the men of the tower of Shechem heard thereof, they entered into the hold of the house of El-berith.
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ כָּל־בַּעֲלֵי מִגְדַּל־שְׁכֶם וַיָּבֹאוּ אֶל־צְרִיחַ בֵּית אֵל בְּרִית׃
    hebrewPlain: וישמעו כל בעלי מגדל שכם ויבאו אל צריח בית אל ברית
    kjvRefs:
    - Judges 9:46
    kjvOsis:
    - Judg.9.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.47
    scripture: tanakh
    name: Tanakh Judges 9:47
    ref: Judges 9:47
    book: Judg
    section: neviim
    chapter: 9
    verse: 47
    ordinal: 6796
    text: And it was told Abimelech that all the men of the tower of Shechem were gathered together.
    translation: JPS 1917
    original: וַיֻּגַּד לַאֲבִימֶלֶךְ כִּי הִתְקַבְּצוּ כָּל־בַּעֲלֵי מִגְדַּל־שְׁכֶם׃
    hebrewPlain: ויגד לאבימלך כי התקבצו כל בעלי מגדל שכם
    kjvRefs:
    - Judges 9:47
    kjvOsis:
    - Judg.9.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.48
    scripture: tanakh
    name: Tanakh Judges 9:48
    ref: Judges 9:48
    book: Judg
    section: neviim
    chapter: 9
    verse: 48
    ordinal: 6797
    text: 'And Abimelech got him up to mount Zalmon, he and all the people that were with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it up, and laid it on his shoulder; and he said unto the people that were with him: ‘What ye have seen me do, make haste, and do as I have done.’'
    translation: JPS 1917
    original: וַיַּעַל אֲבִימֶלֶךְ הַר־צַלְמוֹן הוּא וְכָל־הָעָם אֲשֶׁר־אִתּוֹ וַיִּקַּח אֲבִימֶלֶךְ אֶת־הַקַּרְדֻּמּוֹת בְּיָדוֹ וַיִּכְרֹת שׂוֹכַת עֵצִים וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל־שִׁכְמוֹ וַיֹּאמֶר אֶל־הָעָם אֲשֶׁר־עִמּוֹ מָה רְאִיתֶם עָשִׂיתִי מַהֲרוּ עֲשׂוּ כָמוֹנִי׃
    hebrewPlain: ויעל אבימלך הר צלמון הוא וכל העם אשר אתו ויקח אבימלך את הקרדמות בידו ויכרת שוכת עצים וישאה וישם על שכמו ויאמר אל העם אשר עמו מה ראיתם עשיתי מהרו עשו כמוני
    kjvRefs:
    - Judges 9:48
    kjvOsis:
    - Judg.9.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.49
    scripture: tanakh
    name: Tanakh Judges 9:49
    ref: Judges 9:49
    book: Judg
    section: neviim
    chapter: 9
    verse: 49
    ordinal: 6798
    text: And all the people likewise cut down every man his bough, and followed Abimelech, and put them to the hold, and set the hold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women.
    translation: JPS 1917
    original: וַיִּכְרְתוּ גַם־כָּל־הָעָם אִישׁ שׂוֹכֹה וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ וַיָּשִׂימוּ עַל־הַצְּרִיחַ וַיַּצִּיתוּ עֲלֵיהֶם אֶת־הַצְּרִיחַ בָּאֵשׁ וַיָּמֻתוּ גַּם כָּל־אַנְשֵׁי מִגְדַּל־שְׁכֶם כְּאֶלֶף אִישׁ וְאִשָּׁה׃
    hebrewPlain: ויכרתו גם כל העם איש שוכה וילכו אחרי אבימלך וישימו על הצריח ויציתו עליהם את הצריח באש וימתו גם כל אנשי מגדל שכם כאלף איש ואשה
    kjvRefs:
    - Judges 9:49
    kjvOsis:
    - Judg.9.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.50
    scripture: tanakh
    name: Tanakh Judges 9:50
    ref: Judges 9:50
    book: Judg
    section: neviim
    chapter: 9
    verse: 50
    ordinal: 6799
    text: Then went Abimelech to Thebez, and encamped against Thebez, and took it.
    translation: JPS 1917
    original: וַיֵּלֶךְ אֲבִימֶלֶךְ אֶל־תֵּבֵץ וַיִּחַן בְּתֵבֵץ וַיִּלְכְּדָהּ׃
    hebrewPlain: וילך אבימלך אל תבץ ויחן בתבץ וילכדה
    kjvRefs:
    - Judges 9:50
    kjvOsis:
    - Judg.9.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.51
    scripture: tanakh
    name: Tanakh Judges 9:51
    ref: Judges 9:51
    book: Judg
    section: neviim
    chapter: 9
    verse: 51
    ordinal: 6800
    text: But there was a strong tower within the city, and thither fled all the men and women, even all they of the city, and shut themselves in, and got them up to the roof of the tower.
    translation: JPS 1917
    original: וּמִגְדַּל־עֹז הָיָה בְתוֹךְ־הָעִיר וַיָּנֻסוּ שָׁמָּה כָּל־הָאֲנָשִׁים וְהַנָּשִׁים וְכֹל בַּעֲלֵי הָעִיר וַיִּסְגְּרוּ בַּעֲדָם וַיַּעֲלוּ עַל־גַּג הַמִּגְדָּל׃
    hebrewPlain: ומגדל עז היה בתוך העיר וינסו שמה כל האנשים והנשים וכל בעלי העיר ויסגרו בעדם ויעלו על גג המגדל
    kjvRefs:
    - Judges 9:51
    kjvOsis:
    - Judg.9.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.52
    scripture: tanakh
    name: Tanakh Judges 9:52
    ref: Judges 9:52
    book: Judg
    section: neviim
    chapter: 9
    verse: 52
    ordinal: 6801
    text: And Abimelech came unto the tower, and fought against it, and went close unto the door of the tower to burn it with fire.
    translation: JPS 1917
    original: וַיָּבֹא אֲבִימֶלֶךְ עַד־הַמִּגְדָּל וַיִּלָּחֶם בּוֹ וַיִּגַּשׁ עַד־פֶּתַח הַמִּגְדָּל לְשָׂרְפוֹ בָאֵשׁ׃
    hebrewPlain: ויבא אבימלך עד המגדל וילחם בו ויגש עד פתח המגדל לשרפו באש
    kjvRefs:
    - Judges 9:52
    kjvOsis:
    - Judg.9.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.53
    scripture: tanakh
    name: Tanakh Judges 9:53
    ref: Judges 9:53
    book: Judg
    section: neviim
    chapter: 9
    verse: 53
    ordinal: 6802
    text: And a certain woman cast an upper millstone upon Abimelech’s head, and broke his skull.
    translation: JPS 1917
    original: וַתַּשְׁלֵךְ אִשָּׁה אַחַת פֶּלַח רֶכֶב עַל־רֹאשׁ אֲבִימֶלֶךְ וַתָּרִץ אֶת־גֻּלְגָּלְתּוֹ׃
    hebrewPlain: ותשלך אשה אחת פלח רכב על ראש אבימלך ותרץ את גלגלתו
    kjvRefs:
    - Judges 9:53
    kjvOsis:
    - Judg.9.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.54
    scripture: tanakh
    name: Tanakh Judges 9:54
    ref: Judges 9:54
    book: Judg
    section: neviim
    chapter: 9
    verse: 54
    ordinal: 6803
    text: 'Then he called hastily unto the young man his armour-bearer, and said unto him: ‘Draw thy sword, and kill me, that men say not of me: A woman slew him.’ And his young man thrust him through, and he died.'
    translation: JPS 1917
    original: וַיִּקְרָא מְהֵרָה אֶל־הַנַּעַר נֹשֵׂא כֵלָיו וַיֹּאמֶר לוֹ שְׁלֹף חַרְבְּךָ וּמוֹתְתֵנִי פֶּן־יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ וַיִּדְקְרֵהוּ נַעֲרוֹ וַיָּמֹת׃
    hebrewPlain: ויקרא מהרה אל הנער נשא כליו ויאמר לו שלף חרבך ומותתני פן יאמרו לי אשה הרגתהו וידקרהו נערו וימת
    kjvRefs:
    - Judges 9:54
    kjvOsis:
    - Judg.9.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.55
    scripture: tanakh
    name: Tanakh Judges 9:55
    ref: Judges 9:55
    book: Judg
    section: neviim
    chapter: 9
    verse: 55
    ordinal: 6804
    text: And when the men of Israel saw that Abimelech was dead, they departed every man unto his place.
    translation: JPS 1917
    original: וַיִּרְאוּ אִישׁ־יִשְׂרָאֵל כִּי מֵת אֲבִימֶלֶךְ וַיֵּלְכוּ אִישׁ לִמְקֹמוֹ׃
    hebrewPlain: ויראו איש ישראל כי מת אבימלך וילכו איש למקמו
    kjvRefs:
    - Judges 9:55
    kjvOsis:
    - Judg.9.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.56
    scripture: tanakh
    name: Tanakh Judges 9:56
    ref: Judges 9:56
    book: Judg
    section: neviim
    chapter: 9
    verse: 56
    ordinal: 6805
    text: Thus God requited the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren;
    translation: JPS 1917
    original: וַיָּשֶׁב אֱלֹהִים אֵת רָעַת אֲבִימֶלֶךְ אֲשֶׁר עָשָׂה לְאָבִיו לַהֲרֹג אֶת־שִׁבְעִים אֶחָיו׃
    hebrewPlain: וישב אלהים את רעת אבימלך אשר עשה לאביו להרג את שבעים אחיו
    kjvRefs:
    - Judges 9:56
    kjvOsis:
    - Judg.9.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.9.57
    scripture: tanakh
    name: Tanakh Judges 9:57
    ref: Judges 9:57
    book: Judg
    section: neviim
    chapter: 9
    verse: 57
    ordinal: 6806
    text: and all the wickedness of the men of Shechem did God requite upon their heads; and upon them came the curse of Jotham the son of Jerubbaal.
    translation: JPS 1917
    original: וְאֵת כָּל־רָעַת אַנְשֵׁי שְׁכֶם הֵשִׁיב אֱלֹהִים בְּרֹאשָׁם וַתָּבֹא אֲלֵיהֶם קִלֲלַת יוֹתָם בֶּן־יְרֻבָּעַל׃
    hebrewPlain: ואת כל רעת אנשי שכם השיב אלהים בראשם ותבא אליהם קללת יותם בן ירבעל
    kjvRefs:
    - Judges 9:57
    kjvOsis:
    - Judg.9.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.9
- type: TanakhVerse
  data:
    osis: Judg.10.1
    scripture: tanakh
    name: Tanakh Judges 10:1
    ref: Judges 10:1
    book: Judg
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 6807
    text: And after Abimelech there arose to save Israel Tola the son of Puah, the son of Dodo, a man of Issachar; and he dwelt in Shamir in the hill-country of Ephraim.
    translation: JPS 1917
    original: וַיָּקָם אַחֲרֵי אֲבִימֶלֶךְ לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל תּוֹלָע בֶּן־פּוּאָה בֶּן־דּוֹדוֹ אִישׁ יִשָּׂשכָר וְהוּא־יֹשֵׁב בְּשָׁמִיר בְּהַר אֶפְרָיִם׃
    hebrewPlain: ויקם אחרי אבימלך להושיע את ישראל תולע בן פואה בן דודו איש יששכר והוא ישב בשמיר בהר אפרים
    kjvRefs:
    - Judges 10:1
    kjvOsis:
    - Judg.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.2
    scripture: tanakh
    name: Tanakh Judges 10:2
    ref: Judges 10:2
    book: Judg
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 6808
    text: And he judged Israel twenty and three years, and died, and was buried in Shamir.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה וַיָּמָת וַיִּקָּבֵר בְּשָׁמִיר׃
    hebrewPlain: וישפט את ישראל עשרים ושלש שנה וימת ויקבר בשמיר
    kjvRefs:
    - Judges 10:2
    kjvOsis:
    - Judg.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.3
    scripture: tanakh
    name: Tanakh Judges 10:3
    ref: Judges 10:3
    book: Judg
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 6809
    text: And after him arose Jair, the Gileadite; and he judged Israel twenty and two years.
    translation: JPS 1917
    original: וַיָּקָם אַחֲרָיו יָאִיר הַגִּלְעָדִי וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל עֶשְׂרִים וּשְׁתַּיִם שָׁנָה׃
    hebrewPlain: ויקם אחריו יאיר הגלעדי וישפט את ישראל עשרים ושתים שנה
    kjvRefs:
    - Judges 10:3
    kjvOsis:
    - Judg.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.4
    scripture: tanakh
    name: Tanakh Judges 10:4
    ref: Judges 10:4
    book: Judg
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 6810
    text: And he had thirty sons that rode on thirty ass colts, and they had thirty cities, which are called Havvoth-jair unto this day, which are in the land of Gilead.
    translation: JPS 1917
    original: וַיְהִי־לוֹ שְׁלֹשִׁים בָּנִים רֹכְבִים עַל־שְׁלֹשִׁים עֲיָרִים וּשְׁלֹשִׁים עֲיָרִים לָהֶם לָהֶם יִקְרְאוּ חַוֺּת יָאִיר עַד הַיּוֹם הַזֶּה אֲשֶׁר בְּאֶרֶץ הַגִּלְעָד׃
    hebrewPlain: ויהי לו שלשים בנים רכבים על שלשים עירים ושלשים עירים להם להם יקראו חות יאיר עד היום הזה אשר בארץ הגלעד
    kjvRefs:
    - Judges 10:4
    kjvOsis:
    - Judg.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.5
    scripture: tanakh
    name: Tanakh Judges 10:5
    ref: Judges 10:5
    book: Judg
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 6811
    text: And Jair died, and was buried in Kamon.
    translation: JPS 1917
    original: וַיָּמָת יָאִיר וַיִּקָּבֵר בְּקָמוֹן׃
    hebrewPlain: וימת יאיר ויקבר בקמון
    kjvRefs:
    - Judges 10:5
    kjvOsis:
    - Judg.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.6
    scripture: tanakh
    name: Tanakh Judges 10:6
    ref: Judges 10:6
    book: Judg
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 6812
    text: And the children of Israel again did that which was evil in the sight of the LORD, and served the Baalim, and the Ashtaroth, and the gods of Aram, and the gods of Zidon, and the gods of Moab, and the gods of the children of Ammon, and the gods of the Philistines; and they forsook the LORD, and served Him not.
    translation: JPS 1917
    original: וַיֹּסִפוּ בְּנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה וַיַּעַבְדוּ אֶת־הַבְּעָלִים וְאֶת־הָעַשְׁתָּרוֹת וְאֶת־אֱלֹהֵי אֲרָם וְאֶת־אֱלֹהֵי צִידוֹן וְאֵת אֱלֹהֵי מוֹאָב וְאֵת אֱלֹהֵי בְנֵי־עַמּוֹן וְאֵת אֱלֹהֵי פְלִשְׁתִּים וַיַּעַזְבוּ אֶת־יְהוָה וְלֹא עֲבָדוּהוּ׃
    hebrewPlain: ויספו בני ישראל לעשות הרע בעיני יהוה ויעבדו את הבעלים ואת העשתרות ואת אלהי ארם ואת אלהי צידון ואת אלהי מואב ואת אלהי בני עמון ואת אלהי פלשתים ויעזבו את יהוה ולא עבדוהו
    kjvRefs:
    - Judges 10:6
    kjvOsis:
    - Judg.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.7
    scripture: tanakh
    name: Tanakh Judges 10:7
    ref: Judges 10:7
    book: Judg
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 6813
    text: And the anger of the LORD was kindled against Israel, and He gave them over into the hand of the Philistines, and into the hand of the children of Ammon.
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בְּיִשְׂרָאֵל וַיִּמְכְּרֵם בְּיַד־פְּלִשְׁתִּים וּבְיַד בְּנֵי עַמּוֹן׃
    hebrewPlain: ויחר אף יהוה בישראל וימכרם ביד פלשתים וביד בני עמון
    kjvRefs:
    - Judges 10:7
    kjvOsis:
    - Judg.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.8
    scripture: tanakh
    name: Tanakh Judges 10:8
    ref: Judges 10:8
    book: Judg
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 6814
    text: And they oppressed and crushed the children of Israel that year; eighteen years [oppressed they] all the children of Israel that were beyond the Jordan in the land of the Amorites, which is in Gilead.
    translation: JPS 1917
    original: וַיִּרְעֲצוּ וַיְרֹצְצוּ אֶת־בְּנֵי יִשְׂרָאֵל בַּשָּׁנָה הַהִיא שְׁמֹנֶה עֶשְׂרֵה שָׁנָה אֶת־כָּל־בְּנֵי יִשְׂרָאֵל אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן בְּאֶרֶץ הָאֱמֹרִי אֲשֶׁר בַּגִּלְעָד׃
    hebrewPlain: וירעצו וירצצו את בני ישראל בשנה ההיא שמנה עשרה שנה את כל בני ישראל אשר בעבר הירדן בארץ האמרי אשר בגלעד
    kjvRefs:
    - Judges 10:8
    kjvOsis:
    - Judg.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.9
    scripture: tanakh
    name: Tanakh Judges 10:9
    ref: Judges 10:9
    book: Judg
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 6815
    text: And the children of Ammon passed over the Jordan to fight also against Judah, and against Benjamin, and against the house of Ephraim, so that Israel was sore distressed.
    translation: JPS 1917
    original: וַיַּעַבְרוּ בְנֵי־עַמּוֹן אֶת־הַיַּרְדֵּן לְהִלָּחֵם גַּם־בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד׃
    hebrewPlain: ויעברו בני עמון את הירדן להלחם גם ביהודה ובבנימין ובבית אפרים ותצר לישראל מאד
    kjvRefs:
    - Judges 10:9
    kjvOsis:
    - Judg.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.10
    scripture: tanakh
    name: Tanakh Judges 10:10
    ref: Judges 10:10
    book: Judg
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 6816
    text: 'And the children of Israel cried unto the LORD, saying: ‘We have sinned against Thee, in that we have forsaken our God, and have served the Baalim.’'
    translation: JPS 1917
    original: וַיִּזְעֲקוּ בְּנֵי יִשְׂרָאֵל אֶל־יְהוָה לֵאמֹר חָטָאנוּ לָךְ וְכִי עָזַבְנוּ אֶת־אֱלֹהֵינוּ וַנַּעֲבֹד אֶת־הַבְּעָלִים׃
    hebrewPlain: ויזעקו בני ישראל אל יהוה לאמר חטאנו לך וכי עזבנו את אלהינו ונעבד את הבעלים
    kjvRefs:
    - Judges 10:10
    kjvOsis:
    - Judg.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.11
    scripture: tanakh
    name: Tanakh Judges 10:11
    ref: Judges 10:11
    book: Judg
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 6817
    text: 'And the LORD said unto the children of Israel: ‘Did not I save you from the Egyptians, and from the Amorites, from the children of Ammon, and from the Philistines?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־בְּנֵי יִשְׂרָאֵל הֲלֹא מִמִּצְרַיִם וּמִן־הָאֱמֹרִי וּמִן־בְּנֵי עַמּוֹן וּמִן־פְּלִשְׁתִּים׃
    hebrewPlain: ויאמר יהוה אל בני ישראל הלא ממצרים ומן האמרי ומן בני עמון ומן פלשתים
    kjvRefs:
    - Judges 10:11
    kjvOsis:
    - Judg.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.12
    scripture: tanakh
    name: Tanakh Judges 10:12
    ref: Judges 10:12
    book: Judg
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 6818
    text: The Zidonians also, and the Amalekites, and the Maonites, did oppress you; and ye cried unto Me, and I saved you out of their hand.
    translation: JPS 1917
    original: וְצִידוֹנִים וַעֲמָלֵק וּמָעוֹן לָחֲצוּ אֶתְכֶם וַתִּצְעֲקוּ אֵלַי וָאוֹשִׁיעָה אֶתְכֶם מִיָּדָם׃
    hebrewPlain: וצידונים ועמלק ומעון לחצו אתכם ותצעקו אלי ואושיעה אתכם מידם
    kjvRefs:
    - Judges 10:12
    kjvOsis:
    - Judg.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.13
    scripture: tanakh
    name: Tanakh Judges 10:13
    ref: Judges 10:13
    book: Judg
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 6819
    text: Yet ye have forsaken Me, and served other gods; wherefore I will save you no more.
    translation: JPS 1917
    original: וְאַתֶּם עֲזַבְתֶּם אוֹתִי וַתַּעַבְדוּ אֱלֹהִים אֲחֵרִים לָכֵן לֹא־אוֹסִיף לְהוֹשִׁיעַ אֶתְכֶם׃
    hebrewPlain: ואתם עזבתם אותי ותעבדו אלהים אחרים לכן לא אוסיף להושיע אתכם
    kjvRefs:
    - Judges 10:13
    kjvOsis:
    - Judg.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.14
    scripture: tanakh
    name: Tanakh Judges 10:14
    ref: Judges 10:14
    book: Judg
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 6820
    text: Go and cry unto the gods which ye have chosen; let them save you in the time of your distress.’
    translation: JPS 1917
    original: לְכוּ וְזַעֲקוּ אֶל־הָאֱלֹהִים אֲשֶׁר בְּחַרְתֶּם בָּם הֵמָּה יוֹשִׁיעוּ לָכֶם בְּעֵת צָרַתְכֶם׃
    hebrewPlain: לכו וזעקו אל האלהים אשר בחרתם בם המה יושיעו לכם בעת צרתכם
    kjvRefs:
    - Judges 10:14
    kjvOsis:
    - Judg.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.15
    scripture: tanakh
    name: Tanakh Judges 10:15
    ref: Judges 10:15
    book: Judg
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 6821
    text: 'And the children of Israel said unto the LORD: ‘We have sinned; do Thou unto us whatsoever seemeth good unto Thee; only deliver us, we pray Thee, this day.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ בְנֵי־יִשְׂרָאֵל אֶל־יְהוָה חָטָאנוּ עֲשֵׂה־אַתָּה לָנוּ כְּכָל־הַטּוֹב בְּעֵינֶיךָ אַךְ הַצִּילֵנוּ נָא הַיּוֹם הַזֶּה׃
    hebrewPlain: ויאמרו בני ישראל אל יהוה חטאנו עשה אתה לנו ככל הטוב בעיניך אך הצילנו נא היום הזה
    kjvRefs:
    - Judges 10:15
    kjvOsis:
    - Judg.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.16
    scripture: tanakh
    name: Tanakh Judges 10:16
    ref: Judges 10:16
    book: Judg
    section: neviim
    chapter: 10
    verse: 16
    ordinal: 6822
    text: And they put away the strange gods from among them, and served the LORD; and His soul was grieved for the misery of Israel.
    translation: JPS 1917
    original: וַיָּסִירוּ אֶת־אֱלֹהֵי הַנֵּכָר מִקִּרְבָּם וַיַּעַבְדוּ אֶת־יְהוָה וַתִּקְצַר נַפְשׁוֹ בַּעֲמַל יִשְׂרָאֵל׃
    hebrewPlain: ויסירו את אלהי הנכר מקרבם ויעבדו את יהוה ותקצר נפשו בעמל ישראל
    kjvRefs:
    - Judges 10:16
    kjvOsis:
    - Judg.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.17
    scripture: tanakh
    name: Tanakh Judges 10:17
    ref: Judges 10:17
    book: Judg
    section: neviim
    chapter: 10
    verse: 17
    ordinal: 6823
    text: Then the children of Ammon were gathered together, and encamped in Gilead. And the children of Israel assembled themselves together, and encamped in Mizpah.
    translation: JPS 1917
    original: וַיִּצָּעֲקוּ בְּנֵי עַמּוֹן וַיַּחֲנוּ בַּגִּלְעָד וַיֵּאָסְפוּ בְּנֵי יִשְׂרָאֵל וַיַּחֲנוּ בַּמִּצְפָּה׃
    hebrewPlain: ויצעקו בני עמון ויחנו בגלעד ויאספו בני ישראל ויחנו במצפה
    kjvRefs:
    - Judges 10:17
    kjvOsis:
    - Judg.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.10.18
    scripture: tanakh
    name: Tanakh Judges 10:18
    ref: Judges 10:18
    book: Judg
    section: neviim
    chapter: 10
    verse: 18
    ordinal: 6824
    text: 'And the people, the princes of Gilead, said one to another: ‘What man is he that will begin to fight against the children of Ammon? he shall be head over all the inhabitants of Gilead.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ הָעָם שָׂרֵי גִלְעָד אִישׁ אֶל־רֵעֵהוּ מִי הָאִישׁ אֲשֶׁר יָחֵל לְהִלָּחֵם בִּבְנֵי עַמּוֹן יִהְיֶה לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד׃
    hebrewPlain: ויאמרו העם שרי גלעד איש אל רעהו מי האיש אשר יחל להלחם בבני עמון יהיה לראש לכל ישבי גלעד
    kjvRefs:
    - Judges 10:18
    kjvOsis:
    - Judg.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.10
- type: TanakhVerse
  data:
    osis: Judg.11.1
    scripture: tanakh
    name: Tanakh Judges 11:1
    ref: Judges 11:1
    book: Judg
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 6825
    text: Now Jephthah the Gileadite was a mighty man of valour, and he was the son of a harlot; and Gilead begot Jephthah.
    translation: JPS 1917
    original: וְיִפְתָּח הַגִּלְעָדִי הָיָה גִּבּוֹר חַיִל וְהוּא בֶּן־אִשָּׁה זוֹנָה וַיּוֹלֶד גִּלְעָד אֶת־יִפְתָּח׃
    hebrewPlain: ויפתח הגלעדי היה גבור חיל והוא בן אשה זונה ויולד גלעד את יפתח
    kjvRefs:
    - Judges 11:1
    kjvOsis:
    - Judg.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.2
    scripture: tanakh
    name: Tanakh Judges 11:2
    ref: Judges 11:2
    book: Judg
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 6826
    text: 'And Gilead’s wife bore him sons; and when his wife’s sons grew up, they drove out Jephthah, and said unto him: ‘Thou shalt not inherit in our father’s house; for thou art the son of another woman.’'
    translation: JPS 1917
    original: וַתֵּלֶד אֵשֶׁת־גִּלְעָד לוֹ בָּנִים וַיִּגְדְּלוּ בְנֵי־הָאִשָּׁה וַיְגָרְשׁוּ אֶת־יִפְתָּח וַיֹּאמְרוּ לוֹ לֹא־תִנְחַל בְּבֵית־אָבִינוּ כִּי בֶּן־אִשָּׁה אַחֶרֶת אָתָּה׃
    hebrewPlain: ותלד אשת גלעד לו בנים ויגדלו בני האשה ויגרשו את יפתח ויאמרו לו לא תנחל בבית אבינו כי בן אשה אחרת אתה
    kjvRefs:
    - Judges 11:2
    kjvOsis:
    - Judg.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.3
    scripture: tanakh
    name: Tanakh Judges 11:3
    ref: Judges 11:3
    book: Judg
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 6827
    text: Then Jephthah fled from his brethren, and dwelt in the land of Tob; and there were gathered vain fellows to Jephthah, and they went out with him.
    translation: JPS 1917
    original: וַיִּבְרַח יִפְתָּח מִפְּנֵי אֶחָיו וַיֵּשֶׁב בְּאֶרֶץ טוֹב וַיִּתְלַקְּטוּ אֶל־יִפְתָּח אֲנָשִׁים רֵיקִים וַיֵּצְאוּ עִמּוֹ׃
    hebrewPlain: ויברח יפתח מפני אחיו וישב בארץ טוב ויתלקטו אל יפתח אנשים ריקים ויצאו עמו
    kjvRefs:
    - Judges 11:3
    kjvOsis:
    - Judg.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.4
    scripture: tanakh
    name: Tanakh Judges 11:4
    ref: Judges 11:4
    book: Judg
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 6828
    text: And it came to pass after a while, that the children of Ammon made war against Israel.
    translation: JPS 1917
    original: וַיְהִי מִיָּמִים וַיִּלָּחֲמוּ בְנֵי־עַמּוֹן עִם־יִשְׂרָאֵל׃
    hebrewPlain: ויהי מימים וילחמו בני עמון עם ישראל
    kjvRefs:
    - Judges 11:4
    kjvOsis:
    - Judg.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.5
    scripture: tanakh
    name: Tanakh Judges 11:5
    ref: Judges 11:5
    book: Judg
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 6829
    text: And it was so, that when the children of Ammon made war against Israel, the elders of Gilead went to fetch Jephthah out of the land of Tob.
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר־נִלְחֲמוּ בְנֵי־עַמּוֹן עִם־יִשְׂרָאֵל וַיֵּלְכוּ זִקְנֵי גִלְעָד לָקַחַת אֶת־יִפְתָּח מֵאֶרֶץ טוֹב׃
    hebrewPlain: ויהי כאשר נלחמו בני עמון עם ישראל וילכו זקני גלעד לקחת את יפתח מארץ טוב
    kjvRefs:
    - Judges 11:5
    kjvOsis:
    - Judg.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.6
    scripture: tanakh
    name: Tanakh Judges 11:6
    ref: Judges 11:6
    book: Judg
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 6830
    text: 'And they said unto Jephthah: ‘Come and be our chief, that we may fight with the children of Ammon.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לְיִפְתָּח לְכָה וְהָיִיתָה לָּנוּ לְקָצִין וְנִלָּחֲמָה בִּבְנֵי עַמּוֹן׃
    hebrewPlain: ויאמרו ליפתח לכה והייתה לנו לקצין ונלחמה בבני עמון
    kjvRefs:
    - Judges 11:6
    kjvOsis:
    - Judg.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.7
    scripture: tanakh
    name: Tanakh Judges 11:7
    ref: Judges 11:7
    book: Judg
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 6831
    text: 'And Jephthah said unto the elders of Gilead: ‘Did not ye hate me, and drive me out of my father’s house? and why are ye come unto me now when ye are in distress?’'
    translation: JPS 1917
    original: וַיֹּאמֶר יִפְתָּח לְזִקְנֵי גִלְעָד הֲלֹא אַתֶּם שְׂנֵאתֶם אוֹתִי וַתְּגָרְשׁוּנִי מִבֵּית אָבִי וּמַדּוּעַ בָּאתֶם אֵלַי עַתָּה כַּאֲשֶׁר צַר לָכֶם׃
    hebrewPlain: ויאמר יפתח לזקני גלעד הלא אתם שנאתם אותי ותגרשוני מבית אבי ומדוע באתם אלי עתה כאשר צר לכם
    kjvRefs:
    - Judges 11:7
    kjvOsis:
    - Judg.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.8
    scripture: tanakh
    name: Tanakh Judges 11:8
    ref: Judges 11:8
    book: Judg
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 6832
    text: 'And the elders of Gilead said unto Jephthah: ‘Therefore are we returned to thee now, that thou mayest go with us, and fight with the children of Ammon, and thou shalt be our head over all the inhabitants of Gilead.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ זִקְנֵי גִלְעָד אֶל־יִפְתָּח לָכֵן עַתָּה שַׁבְנוּ אֵלֶיךָ וְהָלַכְתָּ עִמָּנוּ וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד׃
    hebrewPlain: ויאמרו זקני גלעד אל יפתח לכן עתה שבנו אליך והלכת עמנו ונלחמת בבני עמון והיית לנו לראש לכל ישבי גלעד
    kjvRefs:
    - Judges 11:8
    kjvOsis:
    - Judg.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.9
    scripture: tanakh
    name: Tanakh Judges 11:9
    ref: Judges 11:9
    book: Judg
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 6833
    text: 'And Jephthah said unto the elders of Gilead: ‘If ye bring me back home to fight with the children of Ammon, and the LORD deliver them before me, I will be your head.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יִפְתָּח אֶל־זִקְנֵי גִלְעָד אִם־מְשִׁיבִים אַתֶּם אוֹתִי לְהִלָּחֵם בִּבְנֵי עַמּוֹן וְנָתַן יְהוָה אוֹתָם לְפָנָי אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ׃
    hebrewPlain: ויאמר יפתח אל זקני גלעד אם משיבים אתם אותי להלחם בבני עמון ונתן יהוה אותם לפני אנכי אהיה לכם לראש
    kjvRefs:
    - Judges 11:9
    kjvOsis:
    - Judg.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.10
    scripture: tanakh
    name: Tanakh Judges 11:10
    ref: Judges 11:10
    book: Judg
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 6834
    text: 'And the elders of Gilead said unto Jephthah: ‘The LORD shall be witness between us; surely according to thy word so will we do.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ זִקְנֵי־גִלְעָד אֶל־יִפְתָּח יְהוָה יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ אִם־לֹא כִדְבָרְךָ כֵּן נַעֲשֶׂה׃
    hebrewPlain: ויאמרו זקני גלעד אל יפתח יהוה יהיה שמע בינותינו אם לא כדברך כן נעשה
    kjvRefs:
    - Judges 11:10
    kjvOsis:
    - Judg.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.11
    scripture: tanakh
    name: Tanakh Judges 11:11
    ref: Judges 11:11
    book: Judg
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 6835
    text: Then Jephthah went with the elders of Gilead, and the people made him head and chief over them; and Jephthah spoke all his words before the LORD in Mizpah.
    translation: JPS 1917
    original: וַיֵּלֶךְ יִפְתָּח עִם־זִקְנֵי גִלְעָד וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם לְרֹאשׁ וּלְקָצִין וַיְדַבֵּר יִפְתָּח אֶת־כָּל־דְּבָרָיו לִפְנֵי יְהוָה בַּמִּצְפָּה׃
    hebrewPlain: וילך יפתח עם זקני גלעד וישימו העם אותו עליהם לראש ולקצין וידבר יפתח את כל דבריו לפני יהוה במצפה
    kjvRefs:
    - Judges 11:11
    kjvOsis:
    - Judg.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.12
    scripture: tanakh
    name: Tanakh Judges 11:12
    ref: Judges 11:12
    book: Judg
    section: neviim
    chapter: 11
    verse: 12
    ordinal: 6836
    text: 'And Jephthah sent messengers unto the king of the children of Ammon, saying: ‘What hast thou to do with me, that thou art come unto me to fight against my land?’'
    translation: JPS 1917
    original: וַיִּשְׁלַח יִפְתָּח מַלְאָכִים אֶל־מֶלֶךְ בְּנֵי־עַמּוֹן לֵאמֹר מַה־לִּי וָלָךְ כִּי־בָאתָ אֵלַי לְהִלָּחֵם בְּאַרְצִי׃
    hebrewPlain: וישלח יפתח מלאכים אל מלך בני עמון לאמר מה לי ולך כי באת אלי להלחם בארצי
    kjvRefs:
    - Judges 11:12
    kjvOsis:
    - Judg.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.13
    scripture: tanakh
    name: Tanakh Judges 11:13
    ref: Judges 11:13
    book: Judg
    section: neviim
    chapter: 11
    verse: 13
    ordinal: 6837
    text: 'And the king of the children of Ammon answered unto the messengers of Jephthah: ‘Because Israel took away my land, when he came up out of Egypt, from the Arnon even unto the Jabbok, and unto the Jordan; now therefore restore those cities peaceably.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ בְּנֵי־עַמּוֹן אֶל־מַלְאֲכֵי יִפְתָּח כִּי־לָקַח יִשְׂרָאֵל אֶת־אַרְצִי בַּעֲלוֹתוֹ מִמִּצְרַיִם מֵאַרְנוֹן וְעַד־הַיַּבֹּק וְעַד־הַיַּרְדֵּן וְעַתָּה הָשִׁיבָה אֶתְהֶן בְּשָׁלוֹם׃
    hebrewPlain: ויאמר מלך בני עמון אל מלאכי יפתח כי לקח ישראל את ארצי בעלותו ממצרים מארנון ועד היבק ועד הירדן ועתה השיבה אתהן בשלום
    kjvRefs:
    - Judges 11:13
    kjvOsis:
    - Judg.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.14
    scripture: tanakh
    name: Tanakh Judges 11:14
    ref: Judges 11:14
    book: Judg
    section: neviim
    chapter: 11
    verse: 14
    ordinal: 6838
    text: And Jephthah sent messengers again unto the king of the children of Ammon;
    translation: JPS 1917
    original: וַיּוֹסֶף עוֹד יִפְתָּח וַיִּשְׁלַח מַלְאָכִים אֶל־מֶלֶךְ בְּנֵי עַמּוֹן׃
    hebrewPlain: ויוסף עוד יפתח וישלח מלאכים אל מלך בני עמון
    kjvRefs:
    - Judges 11:14
    kjvOsis:
    - Judg.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.15
    scripture: tanakh
    name: Tanakh Judges 11:15
    ref: Judges 11:15
    book: Judg
    section: neviim
    chapter: 11
    verse: 15
    ordinal: 6839
    text: 'and he said unto him: ‘Thus saith Jephthah: Israel took not away the land of Moab, nor the land of the children of Ammon.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ כֹּה אָמַר יִפְתָּח לֹא־לָקַח יִשְׂרָאֵל אֶת־אֶרֶץ מוֹאָב וְאֶת־אֶרֶץ בְּנֵי עַמּוֹן׃
    hebrewPlain: ויאמר לו כה אמר יפתח לא לקח ישראל את ארץ מואב ואת ארץ בני עמון
    kjvRefs:
    - Judges 11:15
    kjvOsis:
    - Judg.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.16
    scripture: tanakh
    name: Tanakh Judges 11:16
    ref: Judges 11:16
    book: Judg
    section: neviim
    chapter: 11
    verse: 16
    ordinal: 6840
    text: But when they came up from Egypt, and Israel walked through the wilderness unto the Red Sea, and came to Kadesh;
    translation: JPS 1917
    original: כִּי בַּעֲלוֹתָם מִמִּצְרָיִם וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר עַד־יַם־סוּף וַיָּבֹא קָדֵשָׁה׃
    hebrewPlain: כי בעלותם ממצרים וילך ישראל במדבר עד ים סוף ויבא קדשה
    kjvRefs:
    - Judges 11:16
    kjvOsis:
    - Judg.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.17
    scripture: tanakh
    name: Tanakh Judges 11:17
    ref: Judges 11:17
    book: Judg
    section: neviim
    chapter: 11
    verse: 17
    ordinal: 6841
    text: 'then Israel sent messengers unto the king of Edom, saying: Let me, I pray thee, pass through thy land; but the king of Edom hearkened not. And in like manner he sent unto the king of Moab; but he would not; and Israel abode in Kadesh.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יִשְׂרָאֵל מַלְאָכִים אֶל־מֶלֶךְ אֱדוֹם לֵאמֹר אֶעְבְּרָה־נָּא בְאַרְצֶךָ וְלֹא שָׁמַע מֶלֶךְ אֱדוֹם וְגַם אֶל־מֶלֶךְ מוֹאָב שָׁלַח וְלֹא אָבָה וַיֵּשֶׁב יִשְׂרָאֵל בְּקָדֵשׁ׃
    hebrewPlain: וישלח ישראל מלאכים אל מלך אדום לאמר אעברה נא בארצך ולא שמע מלך אדום וגם אל מלך מואב שלח ולא אבה וישב ישראל בקדש
    kjvRefs:
    - Judges 11:17
    kjvOsis:
    - Judg.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.18
    scripture: tanakh
    name: Tanakh Judges 11:18
    ref: Judges 11:18
    book: Judg
    section: neviim
    chapter: 11
    verse: 18
    ordinal: 6842
    text: Then he walked through the wilderness, and compassed the land of Edom, and the land of Moab, and came by the east side of the land of Moab, and they pitched on the other side of the Arnon; but they came not within the border of Moab, for the Arnon was the border of Moab.
    translation: JPS 1917
    original: וַיֵּלֶךְ בַּמִּדְבָּר וַיָּסָב אֶת־אֶרֶץ אֱדוֹם וְאֶת־אֶרֶץ מוֹאָב וַיָּבֹא מִמִּזְרַח־שֶׁמֶשׁ לְאֶרֶץ מוֹאָב וַיַּחֲנוּן בְּעֵבֶר אַרְנוֹן וְלֹא־בָאוּ בִּגְבוּל מוֹאָב כִּי אַרְנוֹן גְּבוּל מוֹאָב׃
    hebrewPlain: וילך במדבר ויסב את ארץ אדום ואת ארץ מואב ויבא ממזרח שמש לארץ מואב ויחנון בעבר ארנון ולא באו בגבול מואב כי ארנון גבול מואב
    kjvRefs:
    - Judges 11:18
    kjvOsis:
    - Judg.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.19
    scripture: tanakh
    name: Tanakh Judges 11:19
    ref: Judges 11:19
    book: Judg
    section: neviim
    chapter: 11
    verse: 19
    ordinal: 6843
    text: 'And Israel sent messengers unto Sihon king of the Amorites, the king of Heshbon; and Israel said unto him: Let us pass, we pray thee, through thy land unto my place.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יִשְׂרָאֵל מַלְאָכִים אֶל־סִיחוֹן מֶלֶךְ־הָאֱמֹרִי מֶלֶךְ חֶשְׁבּוֹן וַיֹּאמֶר לוֹ יִשְׂרָאֵל נַעְבְּרָה־נָּא בְאַרְצְךָ עַד־מְקוֹמִי׃
    hebrewPlain: וישלח ישראל מלאכים אל סיחון מלך האמרי מלך חשבון ויאמר לו ישראל נעברה נא בארצך עד מקומי
    kjvRefs:
    - Judges 11:19
    kjvOsis:
    - Judg.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.20
    scripture: tanakh
    name: Tanakh Judges 11:20
    ref: Judges 11:20
    book: Judg
    section: neviim
    chapter: 11
    verse: 20
    ordinal: 6844
    text: But Sihon trusted not Israel to pass through his border; but Sihon gathered all his people together, and pitched in Jahaz, and fought against Israel.
    translation: JPS 1917
    original: וְלֹא־הֶאֱמִין סִיחוֹן אֶת־יִשְׂרָאֵל עֲבֹר בִּגְבֻלוֹ וַיֶּאֱסֹף סִיחוֹן אֶת־כָּל־עַמּוֹ וַיַּחֲנוּ בְּיָהְצָה וַיִּלָּחֶם עִם־יִשְׂרָאֵל׃
    hebrewPlain: ולא האמין סיחון את ישראל עבר בגבלו ויאסף סיחון את כל עמו ויחנו ביהצה וילחם עם ישראל
    kjvRefs:
    - Judges 11:20
    kjvOsis:
    - Judg.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.21
    scripture: tanakh
    name: Tanakh Judges 11:21
    ref: Judges 11:21
    book: Judg
    section: neviim
    chapter: 11
    verse: 21
    ordinal: 6845
    text: And the LORD, the God of Israel, delivered Sihon and all his people into the hand of Israel, and they smote them; so Israel possessed all the land of the Amorites, the inhabitants of that country.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה אֱלֹהֵי־יִשְׂרָאֵל אֶת־סִיחוֹן וְאֶת־כָּל־עַמּוֹ בְּיַד יִשְׂרָאֵל וַיַּכּוּם וַיִּירַשׁ יִשְׂרָאֵל אֵת כָּל־אֶרֶץ הָאֱמֹרִי יוֹשֵׁב הָאָרֶץ הַהִיא׃
    hebrewPlain: ויתן יהוה אלהי ישראל את סיחון ואת כל עמו ביד ישראל ויכום ויירש ישראל את כל ארץ האמרי יושב הארץ ההיא
    kjvRefs:
    - Judges 11:21
    kjvOsis:
    - Judg.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.22
    scripture: tanakh
    name: Tanakh Judges 11:22
    ref: Judges 11:22
    book: Judg
    section: neviim
    chapter: 11
    verse: 22
    ordinal: 6846
    text: And they possessed all the border of the Amorites, from the Arnon even unto the Jabbok, and from the wilderness even unto the Jordan.
    translation: JPS 1917
    original: וַיִּירְשׁוּ אֵת כָּל־גְּבוּל הָאֱמֹרִי מֵאַרְנוֹן וְעַד־הַיַּבֹּק וּמִן־הַמִּדְבָּר וְעַד־הַיַּרְדֵּן׃
    hebrewPlain: ויירשו את כל גבול האמרי מארנון ועד היבק ומן המדבר ועד הירדן
    kjvRefs:
    - Judges 11:22
    kjvOsis:
    - Judg.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.23
    scripture: tanakh
    name: Tanakh Judges 11:23
    ref: Judges 11:23
    book: Judg
    section: neviim
    chapter: 11
    verse: 23
    ordinal: 6847
    text: So now the LORD, the God of Israel, hath dispossessed the Amorites from before His people Israel, and shouldest thou possess them?
    translation: JPS 1917
    original: וְעַתָּה יְהוָה אֱלֹהֵי יִשְׂרָאֵל הוֹרִישׁ אֶת־הָאֱמֹרִי מִפְּנֵי עַמּוֹ יִשְׂרָאֵל וְאַתָּה תִּירָשֶׁנּוּ׃
    hebrewPlain: ועתה יהוה אלהי ישראל הוריש את האמרי מפני עמו ישראל ואתה תירשנו
    kjvRefs:
    - Judges 11:23
    kjvOsis:
    - Judg.11.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.24
    scripture: tanakh
    name: Tanakh Judges 11:24
    ref: Judges 11:24
    book: Judg
    section: neviim
    chapter: 11
    verse: 24
    ordinal: 6848
    text: Wilt not thou possess that which Chemosh thy god giveth thee to possess? So whomsoever the LORD our God hath dispossessed from before us, them will we possess.
    translation: JPS 1917
    original: הֲלֹא אֵת אֲשֶׁר יוֹרִישְׁךָ כְּמוֹשׁ אֱלֹהֶיךָ אוֹתוֹ תִירָשׁ וְאֵת כָּל־אֲשֶׁר הוֹרִישׁ יְהוָה אֱלֹהֵינוּ מִפָּנֵינוּ אוֹתוֹ נִירָשׁ׃
    hebrewPlain: הלא את אשר יורישך כמוש אלהיך אותו תירש ואת כל אשר הוריש יהוה אלהינו מפנינו אותו נירש
    kjvRefs:
    - Judges 11:24
    kjvOsis:
    - Judg.11.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.25
    scripture: tanakh
    name: Tanakh Judges 11:25
    ref: Judges 11:25
    book: Judg
    section: neviim
    chapter: 11
    verse: 25
    ordinal: 6849
    text: And now art thou any thing better than Balak the son of Zippor, king of Moab? did he ever strive against Israel, or did he ever fight against them?
    translation: JPS 1917
    original: וְעַתָּה הֲטוֹב טוֹב אַתָּה מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב הֲרוֹב רָב עִם־יִשְׂרָאֵל אִם־נִלְחֹם נִלְחַם בָּם׃
    hebrewPlain: ועתה הטוב טוב אתה מבלק בן צפור מלך מואב הרוב רב עם ישראל אם נלחם נלחם בם
    kjvRefs:
    - Judges 11:25
    kjvOsis:
    - Judg.11.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.26
    scripture: tanakh
    name: Tanakh Judges 11:26
    ref: Judges 11:26
    book: Judg
    section: neviim
    chapter: 11
    verse: 26
    ordinal: 6850
    text: While Israel dwelt in Heshbon and its towns, and in Aroer and its towns, and in all the cities that are along by the side of the Arnon, three hundred years; wherefore did ye not recover them within that time?
    translation: JPS 1917
    original: בְּשֶׁבֶת יִשְׂרָאֵל בְּחֶשְׁבּוֹן וּבִבְנוֹתֶיהָ וּבְעַרְעוֹר וּבִבְנוֹתֶיהָ וּבְכָל־הֶעָרִים אֲשֶׁר עַל־יְדֵי אַרְנוֹן שְׁלֹשׁ מֵאוֹת שָׁנָה וּמַדּוּעַ לֹא־הִצַּלְתֶּם בָּעֵת הַהִיא׃
    hebrewPlain: בשבת ישראל בחשבון ובבנותיה ובערעור ובבנותיה ובכל הערים אשר על ידי ארנון שלש מאות שנה ומדוע לא הצלתם בעת ההיא
    kjvRefs:
    - Judges 11:26
    kjvOsis:
    - Judg.11.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.27
    scripture: tanakh
    name: Tanakh Judges 11:27
    ref: Judges 11:27
    book: Judg
    section: neviim
    chapter: 11
    verse: 27
    ordinal: 6851
    text: I therefore have not sinned against thee, but thou doest me wrong to war against me; the LORD, the Judge, be judge this day between the children of Israel and the children of Ammon.’
    translation: JPS 1917
    original: וְאָנֹכִי לֹא־חָטָאתִי לָךְ וְאַתָּה עֹשֶׂה אִתִּי רָעָה לְהִלָּחֶם בִּי יִשְׁפֹּט יְהוָה הַשֹּׁפֵט הַיּוֹם בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן׃
    hebrewPlain: ואנכי לא חטאתי לך ואתה עשה אתי רעה להלחם בי ישפט יהוה השפט היום בין בני ישראל ובין בני עמון
    kjvRefs:
    - Judges 11:27
    kjvOsis:
    - Judg.11.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.28
    scripture: tanakh
    name: Tanakh Judges 11:28
    ref: Judges 11:28
    book: Judg
    section: neviim
    chapter: 11
    verse: 28
    ordinal: 6852
    text: Howbeit the king of the children of Ammon hearkened not unto the words of Jephthah which he sent him.
    translation: JPS 1917
    original: וְלֹא שָׁמַע מֶלֶךְ בְּנֵי עַמּוֹן אֶל־דִּבְרֵי יִפְתָּח אֲשֶׁר שָׁלַח אֵלָיו׃
    hebrewPlain: ולא שמע מלך בני עמון אל דברי יפתח אשר שלח אליו
    kjvRefs:
    - Judges 11:28
    kjvOsis:
    - Judg.11.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.29
    scripture: tanakh
    name: Tanakh Judges 11:29
    ref: Judges 11:29
    book: Judg
    section: neviim
    chapter: 11
    verse: 29
    ordinal: 6853
    text: Then the spirit of the LORD came upon Jephthah, and he passed over Gilead and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over unto the children of Ammon.
    translation: JPS 1917
    original: וַתְּהִי עַל־יִפְתָּח רוּחַ יְהוָה וַיַּעֲבֹר אֶת־הַגִּלְעָד וְאֶת־מְנַשֶּׁה וַיַּעֲבֹר אֶת־מִצְפֵּה גִלְעָד וּמִמִּצְפֵּה גִלְעָד עָבַר בְּנֵי עַמּוֹן׃
    hebrewPlain: ותהי על יפתח רוח יהוה ויעבר את הגלעד ואת מנשה ויעבר את מצפה גלעד וממצפה גלעד עבר בני עמון
    kjvRefs:
    - Judges 11:29
    kjvOsis:
    - Judg.11.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.30
    scripture: tanakh
    name: Tanakh Judges 11:30
    ref: Judges 11:30
    book: Judg
    section: neviim
    chapter: 11
    verse: 30
    ordinal: 6854
    text: 'And Jephthah vowed a vow unto the LORD, and said: ‘If Thou wilt indeed deliver the children of Ammon into my hand,'
    translation: JPS 1917
    original: וַיִּדַּר יִפְתָּח נֶדֶר לַיהוָה וַיֹּאמַר אִם־נָתוֹן תִּתֵּן אֶת־בְּנֵי עַמּוֹן בְּיָדִי׃
    hebrewPlain: וידר יפתח נדר ליהוה ויאמר אם נתון תתן את בני עמון בידי
    kjvRefs:
    - Judges 11:30
    kjvOsis:
    - Judg.11.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.31
    scripture: tanakh
    name: Tanakh Judges 11:31
    ref: Judges 11:31
    book: Judg
    section: neviim
    chapter: 11
    verse: 31
    ordinal: 6855
    text: then it shall be, that whatsoever cometh forth of the doors of my house to meet me, when I return in peace from the children of Ammon, it shall be the LORD’S, and I will offer it up for a burnt-offering.’
    translation: JPS 1917
    original: וְהָיָה הַיּוֹצֵא אֲשֶׁר יֵצֵא מִדַּלְתֵי בֵיתִי לִקְרָאתִי בְּשׁוּבִי בְשָׁלוֹם מִבְּנֵי עַמּוֹן וְהָיָה לַיהוָה וְהַעֲלִיתִהוּ עוֹלָה׃
    hebrewPlain: והיה היוצא אשר יצא מדלתי ביתי לקראתי בשובי בשלום מבני עמון והיה ליהוה והעליתהו עולה
    kjvRefs:
    - Judges 11:31
    kjvOsis:
    - Judg.11.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.32
    scripture: tanakh
    name: Tanakh Judges 11:32
    ref: Judges 11:32
    book: Judg
    section: neviim
    chapter: 11
    verse: 32
    ordinal: 6856
    text: So Jephthah passed over unto the children of Ammon to fight against them; and the LORD delivered them into his hand.
    translation: JPS 1917
    original: וַיַּעֲבֹר יִפְתָּח אֶל־בְּנֵי עַמּוֹן לְהִלָּחֶם בָּם וַיִתְּנֵם יְהוָה בְּיָדוֹ׃
    hebrewPlain: ויעבר יפתח אל בני עמון להלחם בם ויתנם יהוה בידו
    kjvRefs:
    - Judges 11:32
    kjvOsis:
    - Judg.11.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.33
    scripture: tanakh
    name: Tanakh Judges 11:33
    ref: Judges 11:33
    book: Judg
    section: neviim
    chapter: 11
    verse: 33
    ordinal: 6857
    text: And he smote them from Aroer until thou come to Minnith, even twenty cities, and unto Abel-cheramim, with a very great slaughter. So the children of Ammon were subdued before the children of Israel.
    translation: JPS 1917
    original: וַיַּכֵּם מֵעֲרוֹעֵר וְעַד־בּוֹאֲךָ מִנִּית עֶשְׂרִים עִיר וְעַד אָבֵל כְּרָמִים מַכָּה גְּדוֹלָה מְאֹד וַיִּכָּנְעוּ בְּנֵי עַמּוֹן מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויכם מערוער ועד בואך מנית עשרים עיר ועד אבל כרמים מכה גדולה מאד ויכנעו בני עמון מפני בני ישראל
    kjvRefs:
    - Judges 11:33
    kjvOsis:
    - Judg.11.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.34
    scripture: tanakh
    name: Tanakh Judges 11:34
    ref: Judges 11:34
    book: Judg
    section: neviim
    chapter: 11
    verse: 34
    ordinal: 6858
    text: And Jephthah came to Mizpah unto his house, and, behold, his daughter came out to meet him with timbrels and with dances; and she was his only child; beside her he had neither son nor daughter.
    translation: JPS 1917
    original: וַיָּבֹא יִפְתָּח הַמִּצְפָּה אֶל־בֵּיתוֹ וְהִנֵּה בִתּוֹ יֹצֵאת לִקְרָאתוֹ בְתֻפִּים וּבִמְחֹלוֹת וְרַק הִיא יְחִידָה אֵין־לוֹ מִמֶּנּוּ בֵּן אוֹ־בַת׃
    hebrewPlain: ויבא יפתח המצפה אל ביתו והנה בתו יצאת לקראתו בתפים ובמחלות ורק היא יחידה אין לו ממנו בן או בת
    kjvRefs:
    - Judges 11:34
    kjvOsis:
    - Judg.11.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.35
    scripture: tanakh
    name: Tanakh Judges 11:35
    ref: Judges 11:35
    book: Judg
    section: neviim
    chapter: 11
    verse: 35
    ordinal: 6859
    text: 'And it came to pass, when he saw her, that he rent his clothes, and said: ‘Alas, my daughter! thou hast brought me very low, and thou art become my troubler; for I have opened my mouth unto the LORD, and I cannot go back.’'
    translation: JPS 1917
    original: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ וַיִּקְרַע אֶת־בְּגָדָיו וַיֹּאמֶר אֲהָהּ בִּתִּי הַכְרֵעַ הִכְרַעְתִּנִי וְאַתְּ הָיִיתְ בְּעֹכְרָי וְאָנֹכִי פָּצִיתִי־פִי אֶל־יְהוָה וְלֹא אוּכַל לָשׁוּב׃
    hebrewPlain: ויהי כראותו אותה ויקרע את בגדיו ויאמר אהה בתי הכרע הכרעתני ואת היית בעכרי ואנכי פציתי פי אל יהוה ולא אוכל לשוב
    kjvRefs:
    - Judges 11:35
    kjvOsis:
    - Judg.11.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.36
    scripture: tanakh
    name: Tanakh Judges 11:36
    ref: Judges 11:36
    book: Judg
    section: neviim
    chapter: 11
    verse: 36
    ordinal: 6860
    text: 'And she said unto him: ‘My father, thou hast opened thy mouth unto the LORD; do unto me according to that which hath proceeded out of thy mouth; forasmuch as the LORD hath taken vengeance for thee of thine enemies, even of the children of Ammon.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֵלָיו אָבִי פָּצִיתָה אֶת־פִּיךָ אֶל־יְהוָה עֲשֵׂה לִי כַּאֲשֶׁר יָצָא מִפִּיךָ אַחֲרֵי אֲשֶׁר עָשָׂה לְךָ יְהוָה נְקָמוֹת מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן׃
    hebrewPlain: ותאמר אליו אבי פציתה את פיך אל יהוה עשה לי כאשר יצא מפיך אחרי אשר עשה לך יהוה נקמות מאיביך מבני עמון
    kjvRefs:
    - Judges 11:36
    kjvOsis:
    - Judg.11.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.37
    scripture: tanakh
    name: Tanakh Judges 11:37
    ref: Judges 11:37
    book: Judg
    section: neviim
    chapter: 11
    verse: 37
    ordinal: 6861
    text: 'And she said unto her father: ‘Let this thing be done for me: let me alone two months, that I may depart and go down upon the mountains, and bewail my virginity, I and my companions.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶל־אָבִיהָ יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה הַרְפֵּה מִמֶּנִּי שְׁנַיִם חֳדָשִׁים וְאֵלְכָה וְיָרַדְתִּי עַל־הֶהָרִים וְאֶבְכֶּה עַל־בְּתוּלַי אָנֹכִי ורעיתי [וְרֵעוֹתָי׃]
    hebrewPlain: ותאמר אל אביה יעשה לי הדבר הזה הרפה ממני שנים חדשים ואלכה וירדתי על ההרים ואבכה על בתולי אנכי ורעיתי [ורעותי]
    kjvRefs:
    - Judges 11:37
    kjvOsis:
    - Judg.11.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.38
    scripture: tanakh
    name: Tanakh Judges 11:38
    ref: Judges 11:38
    book: Judg
    section: neviim
    chapter: 11
    verse: 38
    ordinal: 6862
    text: 'And he said: ‘Go.’ And he sent her away for two months; and she departed, she and her companions, and bewailed her virginity upon the mountains.'
    translation: JPS 1917
    original: וַיֹּאמֶר לֵכִי וַיִּשְׁלַח אוֹתָהּ שְׁנֵי חֳדָשִׁים וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ וַתֵּבְךְּ עַל־בְּתוּלֶיהָ עַל־הֶהָרִים׃
    hebrewPlain: ויאמר לכי וישלח אותה שני חדשים ותלך היא ורעותיה ותבך על בתוליה על ההרים
    kjvRefs:
    - Judges 11:38
    kjvOsis:
    - Judg.11.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.39
    scripture: tanakh
    name: Tanakh Judges 11:39
    ref: Judges 11:39
    book: Judg
    section: neviim
    chapter: 11
    verse: 39
    ordinal: 6863
    text: And it came to pass at the end of two months, that she returned unto her father, who did with her according to his vow which he had vowed; and she had not known man. And it was a custom in Israel,
    translation: JPS 1917
    original: וַיְהִי מִקֵּץ שְׁנַיִם חֳדָשִׁים וַתָּשָׁב אֶל־אָבִיהָ וַיַּעַשׂ לָהּ אֶת־נִדְרוֹ אֲשֶׁר נָדָר וְהִיא לֹא־יָדְעָה אִישׁ וַתְּהִי־חֹק בְּיִשְׂרָאֵל׃
    hebrewPlain: ויהי מקץ שנים חדשים ותשב אל אביה ויעש לה את נדרו אשר נדר והיא לא ידעה איש ותהי חק בישראל
    kjvRefs:
    - Judges 11:39
    kjvOsis:
    - Judg.11.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.11.40
    scripture: tanakh
    name: Tanakh Judges 11:40
    ref: Judges 11:40
    book: Judg
    section: neviim
    chapter: 11
    verse: 40
    ordinal: 6864
    text: that the daughters of Israel went yearly to lament the daughter of Jephthah the Gileadite four days in a year.
    translation: JPS 1917
    original: מִיָּמִים יָמִימָה תֵּלַכְנָה בְּנוֹת יִשְׂרָאֵל לְתַנּוֹת לְבַת־יִפְתָּח הַגִּלְעָדִי אַרְבַּעַת יָמִים בַּשָּׁנָה׃
    hebrewPlain: מימים ימימה תלכנה בנות ישראל לתנות לבת יפתח הגלעדי ארבעת ימים בשנה
    kjvRefs:
    - Judges 11:40
    kjvOsis:
    - Judg.11.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.11
- type: TanakhVerse
  data:
    osis: Judg.12.1
    scripture: tanakh
    name: Tanakh Judges 12:1
    ref: Judges 12:1
    book: Judg
    section: neviim
    chapter: 12
    verse: 1
    ordinal: 6865
    text: 'And the men of Ephraim were gathered together, and passed to Zaphon; and they said unto Jephthah: ‘Wherefore didst thou pass over to fight against the children of Ammon, and didst not call us to go with thee? we will burn thy house upon thee with fire.’'
    translation: JPS 1917
    original: וַיִּצָּעֵק אִישׁ אֶפְרַיִם וַיַּעֲבֹר צָפוֹנָה וַיֹּאמְרוּ לְיִפְתָּח מַדּוּעַ עָבַרְתָּ לְהִלָּחֵם בִּבְנֵי־עַמּוֹן וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ׃
    hebrewPlain: ויצעק איש אפרים ויעבר צפונה ויאמרו ליפתח מדוע עברת להלחם בבני עמון ולנו לא קראת ללכת עמך ביתך נשרף עליך באש
    kjvRefs:
    - Judges 12:1
    kjvOsis:
    - Judg.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.2
    scripture: tanakh
    name: Tanakh Judges 12:2
    ref: Judges 12:2
    book: Judg
    section: neviim
    chapter: 12
    verse: 2
    ordinal: 6866
    text: 'And Jephthah said unto them: ‘I and my people were at great strife with the children of Ammon; and when I called you, ye saved me not out of their hand.'
    translation: JPS 1917
    original: וַיֹּאמֶר יִפְתָּח אֲלֵיהֶם אִישׁ רִיב הָיִיתִי אֲנִי וְעַמִּי וּבְנֵי־עַמּוֹן מְאֹד וָאֶזְעַק אֶתְכֶם וְלֹא־הוֹשַׁעְתֶּם אוֹתִי מִיָּדָם׃
    hebrewPlain: ויאמר יפתח אליהם איש ריב הייתי אני ועמי ובני עמון מאד ואזעק אתכם ולא הושעתם אותי מידם
    kjvRefs:
    - Judges 12:2
    kjvOsis:
    - Judg.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.3
    scripture: tanakh
    name: Tanakh Judges 12:3
    ref: Judges 12:3
    book: Judg
    section: neviim
    chapter: 12
    verse: 3
    ordinal: 6867
    text: And when I saw that ye saved me not, I put my life in my hand, and passed over against the children of Ammon, and the LORD delivered them into my hand; wherefore then are ye come up unto me this day, to fight against me?’
    translation: JPS 1917
    original: וָאֶרְאֶה כִּי־אֵינְךָ מוֹשִׁיע וָאָשִׂימָה נַפְשִׁי בְכַפִּי וָאֶעְבְּרָה אֶל־בְּנֵי עַמּוֹן וַיִּתְּנֵם יְהוָה בְּיָדִי וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה לְהִלָּחֶם בִּי׃
    hebrewPlain: ואראה כי אינך מושיע ואשימה נפשי בכפי ואעברה אל בני עמון ויתנם יהוה בידי ולמה עליתם אלי היום הזה להלחם בי
    kjvRefs:
    - Judges 12:3
    kjvOsis:
    - Judg.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.4
    scripture: tanakh
    name: Tanakh Judges 12:4
    ref: Judges 12:4
    book: Judg
    section: neviim
    chapter: 12
    verse: 4
    ordinal: 6868
    text: 'Then Jephthah gathered together all the men of Gilead, and fought with Ephraim; and the men of Gilead smote Ephraim, because they said: ‘Ye are fugitives of Ephraim, ye Gileadites, in the midst of Ephraim, and in the midst of Manasseh.’'
    translation: JPS 1917
    original: וַיִּקְבֹּץ יִפְתָּח אֶת־כָּל־אַנְשֵׁי גִלְעָד וַיִּלָּחֶם אֶת־אֶפְרָיִם וַיַּכּוּ אַנְשֵׁי גִלְעָד אֶת־אֶפְרַיִם כִּי אָמְרוּ פְּלִיטֵי אֶפְרַיִם אַתֶּם גִּלְעָד בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה׃
    hebrewPlain: ויקבץ יפתח את כל אנשי גלעד וילחם את אפרים ויכו אנשי גלעד את אפרים כי אמרו פליטי אפרים אתם גלעד בתוך אפרים בתוך מנשה
    kjvRefs:
    - Judges 12:4
    kjvOsis:
    - Judg.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.5
    scripture: tanakh
    name: Tanakh Judges 12:5
    ref: Judges 12:5
    book: Judg
    section: neviim
    chapter: 12
    verse: 5
    ordinal: 6869
    text: 'And the Gileadites took the fords of the Jordan against the Ephraimites; and it was so, that when any of the fugitives of Ephraim said: ''Let me go over,'' the men of Gilead said unto him: ‘Art thou an Ephraimite?’ If he said: ‘Nay’;'
    translation: JPS 1917
    original: וַיִּלְכֹּד גִּלְעָד אֶת־מַעְבְּרוֹת הַיַּרְדֵּן לְאֶפְרָיִם וְהָיָה כִּי יֹאמְרוּ פְּלִיטֵי אֶפְרַיִם אֶעֱבֹרָה וַיֹּאמְרוּ לוֹ אַנְשֵׁי־גִלְעָד הַאֶפְרָתִי אַתָּה וַיֹּאמֶר לֹא׃
    hebrewPlain: וילכד גלעד את מעברות הירדן לאפרים והיה כי יאמרו פליטי אפרים אעברה ויאמרו לו אנשי גלעד האפרתי אתה ויאמר לא
    kjvRefs:
    - Judges 12:5
    kjvOsis:
    - Judg.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.6
    scripture: tanakh
    name: Tanakh Judges 12:6
    ref: Judges 12:6
    book: Judg
    section: neviim
    chapter: 12
    verse: 6
    ordinal: 6870
    text: 'then said they unto him: ‘Say now Shibboleth’; and he said ‘Sibboleth’; for he could not frame to pronounce it right; then they laid hold on him, and slew him at the fords of the Jordan; and there fell at that time of Ephraim forty and two thousand.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לוֹ אֱמָר־נָא שִׁבֹּלֶת וַיֹּאמֶר סִבֹּלֶת וְלֹא יָכִין לְדַבֵּר כֵּן וַיֹּאחֲזוּ אוֹתוֹ וַיִּשְׁחָטוּהוּ אֶל־מַעְבְּרוֹת הַיַּרְדֵּן וַיִּפֹּל בָּעֵת הַהִיא מֵאֶפְרַיִם אַרְבָּעִים וּשְׁנַיִם אָלֶף׃
    hebrewPlain: ויאמרו לו אמר נא שבלת ויאמר סבלת ולא יכין לדבר כן ויאחזו אותו וישחטוהו אל מעברות הירדן ויפל בעת ההיא מאפרים ארבעים ושנים אלף
    kjvRefs:
    - Judges 12:6
    kjvOsis:
    - Judg.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.7
    scripture: tanakh
    name: Tanakh Judges 12:7
    ref: Judges 12:7
    book: Judg
    section: neviim
    chapter: 12
    verse: 7
    ordinal: 6871
    text: And Jephthah judged Israel six years. Then died Jephthah the Gileadite, and was buried in one of the cities of Gilead.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט יִפְתָּח אֶת־יִשְׂרָאֵל שֵׁשׁ שָׁנִים וַיָּמָת יִפְתָּח הַגִּלְעָדִי וַיִּקָּבֵר בְּעָרֵי גִלְעָד׃
    hebrewPlain: וישפט יפתח את ישראל שש שנים וימת יפתח הגלעדי ויקבר בערי גלעד
    kjvRefs:
    - Judges 12:7
    kjvOsis:
    - Judg.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.8
    scripture: tanakh
    name: Tanakh Judges 12:8
    ref: Judges 12:8
    book: Judg
    section: neviim
    chapter: 12
    verse: 8
    ordinal: 6872
    text: And after him Ibzan of Beth-lehem judged Israel.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט אַחֲרָיו אֶת־יִשְׂרָאֵל אִבְצָן מִבֵּית לָחֶם׃
    hebrewPlain: וישפט אחריו את ישראל אבצן מבית לחם
    kjvRefs:
    - Judges 12:8
    kjvOsis:
    - Judg.12.8
  relations:
  - predicate: IN
