    name: Tanakh Judges 12:10
    ref: Judges 12:10
    book: Judg
    section: neviim
    chapter: 12
    verse: 10
    ordinal: 6874
    text: and Ibzan died, and was buried at Beth-lehem. .
    translation: JPS 1917
    original: וַיָּמָת אִבְצָן וַיִּקָּבֵר בְּבֵית לָחֶם׃
    hebrewPlain: וימת אבצן ויקבר בבית לחם
    kjvRefs:
