- type: TanakhVerse
  data:
    osis: Judg.12.9
    scripture: tanakh
    name: Tanakh Judges 12:9
    ref: Judges 12:9
    book: Judg
    section: neviim
    chapter: 12
    verse: 9
    ordinal: 6873
    text: And he had thirty sons, and thirty daughters he sent abroad, and thirty daughters he brought in from abroad for his sons. And he judged Israel seven years.
    translation: JPS 1917
    original: וַיְהִי־לוֹ שְׁלֹשִׁים בָּנִים וּשְׁלֹשִׁים בָּנוֹת שִׁלַּח הַחוּצָה וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן־הַחוּץ וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל שֶׁבַע שָׁנִים׃
    hebrewPlain: ויהי לו שלשים בנים ושלשים בנות שלח החוצה ושלשים בנות הביא לבניו מן החוץ וישפט את ישראל שבע שנים
    kjvRefs:
    - Judges 12:9
    kjvOsis:
    - Judg.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
