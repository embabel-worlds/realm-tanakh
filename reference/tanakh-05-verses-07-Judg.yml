  data:
    osis: Judg.1.5
    scripture: tanakh
    name: Tanakh Judges 1:5
    ref: Judges 1:5
    book: Judg
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 6509
    text: And they found Adoni-bezek in Bezek; and they fought against him, and they smote the Canaanites and the Perizzites.
    translation: JPS 1917
    original: וַיִּמְצְאוּ אֶת־אֲדֹנִי בֶזֶק בְּבֶזֶק וַיִּלָּחֲמוּ בּוֹ וַיַּכּוּ אֶת־הַכְּנַעֲנִי וְאֶת־הַפְּרִזִּי׃
    hebrewPlain: וימצאו את אדני בזק בבזק וילחמו בו ויכו את הכנעני ואת הפרזי
    kjvRefs:
    - Judges 1:5
    kjvOsis:
