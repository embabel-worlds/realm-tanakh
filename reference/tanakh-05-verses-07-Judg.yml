    name: Tanakh Judges 21:24
    ref: Judges 21:24
    book: Judg
    section: neviim
    chapter: 21
    verse: 24
    ordinal: 7121
    text: And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.
    translation: JPS 1917
    original: וַיִּתְהַלְּכוּ מִשָּׁם בְּנֵי־יִשְׂרָאֵל בָּעֵת הַהִיא אִישׁ לְשִׁבְטוֹ וּלְמִשְׁפַּחְתּוֹ וַיֵּצְאוּ מִשָּׁם אִישׁ לְנַחֲלָתוֹ׃
    hebrewPlain: ויתהלכו משם בני ישראל בעת ההיא איש לשבטו ולמשפחתו ויצאו משם איש לנחלתו
    kjvRefs:
    - Judges 21:24
    kjvOsis:
    - Judg.21.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
