- type: TanakhVerse
  data:
    osis: Judg.21.22
    scripture: tanakh
    name: Tanakh Judges 21:22
    ref: Judges 21:22
    book: Judg
    section: neviim
    chapter: 21
    verse: 22
    ordinal: 7119
    text: 'And it shall be, when their fathers or their brethren come to strive with us, that we will say unto them: Grant them graciously unto us; because we took not for each man of them his wife in battle; neither did ye give them unto them, that ye should now be guilty.’'
    translation: JPS 1917
    original: וְהָיָה כִּי־יָבֹאוּ אֲבוֹתָם אוֹ אֲחֵיהֶם לרוב [לָרִיב ] אֵלֵינוּ וְאָמַרְנוּ אֲלֵיהֶם חָנּוּנוּ אוֹתָם כִּי לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה כִּי לֹא אַתֶּם נְתַתֶּם לָהֶם כָּעֵת תֶּאְשָׁמוּ׃
    hebrewPlain: והיה כי יבאו אבותם או אחיהם לרוב [לריב ] אלינו ואמרנו אליהם חנונו אותם כי לא לקחנו איש אשתו במלחמה כי לא אתם נתתם להם כעת תאשמו
    kjvRefs:
    - Judges 21:22
    kjvOsis:
    - Judg.21.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
    osis: Judg.21.23
    scripture: tanakh
    name: Tanakh Judges 21:23
    ref: Judges 21:23
    book: Judg
    section: neviim
    chapter: 21
    verse: 23
    ordinal: 7120
    text: And the children of Benjamin did so, and took them wives, according to their number, of them that danced, whom they carried off; and they went and returned unto their inheritance, and built the cities, and dwelt in them.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ־כֵן בְּנֵי בִנְיָמִן וַיִּשְׂאוּ נָשִׁים לְמִסְפָּרָם מִן־הַמְּחֹלְלוֹת אֲשֶׁר גָּזָלוּ וַיֵּלְכוּ וַיָּשׁוּבוּ אֶל־נַחֲלָתָם וַיִּבְנוּ אֶת־הֶעָרִים וַיֵּשְׁבוּ בָּהֶם׃
    hebrewPlain: ויעשו כן בני בנימן וישאו נשים למספרם מן המחללות אשר גזלו וילכו וישובו אל נחלתם ויבנו את הערים וישבו בהם
    kjvRefs:
    - Judges 21:23
    kjvOsis:
    - Judg.21.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.21
- type: TanakhVerse
  data:
