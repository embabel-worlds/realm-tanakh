    name: Tanakh Judges 21:25
    ref: Judges 21:25
    book: Judg
    section: neviim
    chapter: 21
    verse: 25
    ordinal: 7122
    text: In those days there was no king in Israel; every man did that which was right in his own eyes.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם אֵין מֶלֶךְ בְּיִשְׂרָאֵל אִישׁ הַיָּשָׁר בְּעֵינָיו יַעֲשֶׂה׃
    hebrewPlain: בימים ההם אין מלך בישראל איש הישר בעיניו יעשה
