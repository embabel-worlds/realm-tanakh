- type: TanakhVerse
  data:
    osis: Judg.5.13
    scripture: tanakh
    name: Tanakh Judges 5:13
    ref: Judges 5:13
    book: Judg
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 6631
    text: Then made He a remnant to have dominion over the nobles and the people; The LORD made me have dominion over the mighty.
    translation: JPS 1917
    original: אָז יְרַד שָׂרִיד לְאַדִּירִים עָם יְהוָה יְרַד־לִי בַּגִּבּוֹרִים׃
    hebrewPlain: אז ירד שריד לאדירים עם יהוה ירד לי בגבורים
    kjvRefs:
    - Judges 5:13
    kjvOsis:
    - Judg.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.14
    scripture: tanakh
    name: Tanakh Judges 5:14
    ref: Judges 5:14
    book: Judg
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 6632
    text: Out of Ephraim came they whose root is in Amalek; After thee, Benjamin, among thy peoples; Out of Machir came down governors, And out of Zebulun they that handle the marshal’s staff.
    translation: JPS 1917
    original: מִנִּי אֶפְרַיִם שָׁרְשָׁם בַּעֲמָלֵק אַחֲרֶיךָ בִנְיָמִין בַּעֲמָמֶיךָ מִנִּי מָכִיר יָרְדוּ מְחֹקְקִים וּמִזְּבוּלֻן מֹשְׁכִים בְּשֵׁבֶט סֹפֵר׃
    hebrewPlain: מני אפרים שרשם בעמלק אחריך בנימין בעממיך מני מכיר ירדו מחקקים ומזבולן משכים בשבט ספר
    kjvRefs:
    - Judges 5:14
    kjvOsis:
    - Judg.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.15
    scripture: tanakh
    name: Tanakh Judges 5:15
    ref: Judges 5:15
    book: Judg
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 6633
    text: And the princes of Issachar were with Deborah; As was Issachar, so was Barak; Into the valley they rushed forth at his feet. Among the divisions of Reuben There were great resolves of heart.
    translation: JPS 1917
    original: וְשָׂרַי בְּיִשָּׂשכָר עִם־דְּבֹרָה וְיִשָּׂשכָר כֵּן בָּרָק בָּעֵמֶק שֻׁלַּח בְּרַגְלָיו בִּפְלַגּוֹת רְאוּבֵן גְּדֹלִים חִקְקֵי־לֵב׃
    hebrewPlain: ושרי ביששכר עם דברה ויששכר כן ברק בעמק שלח ברגליו בפלגות ראובן גדלים חקקי לב
    kjvRefs:
    - Judges 5:15
    kjvOsis:
    - Judg.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.16
    scripture: tanakh
    name: Tanakh Judges 5:16
    ref: Judges 5:16
    book: Judg
    section: neviim
    chapter: 5
    verse: 16
    ordinal: 6634
    text: Why sattest thou among the sheep-folds, To hear the pipings for the flocks? At the divisions of Reuben There were great searchings of heart.
    translation: JPS 1917
    original: לָמָּה יָשַׁבְתָּ בֵּין הַמִּשְׁפְּתַיִם לִשְׁמֹעַ שְׁרִקוֹת עֲדָרִים לִפְלַגּוֹת רְאוּבֵן גְּדוֹלִים חִקְרֵי־לֵב׃
    hebrewPlain: למה ישבת בין המשפתים לשמע שרקות עדרים לפלגות ראובן גדולים חקרי לב
    kjvRefs:
    - Judges 5:16
    kjvOsis:
    - Judg.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.17
    scripture: tanakh
    name: Tanakh Judges 5:17
    ref: Judges 5:17
    book: Judg
    section: neviim
    chapter: 5
    verse: 17
    ordinal: 6635
    text: Gilead abode beyond the Jordan; And Dan, why doth he sojourn by the ships? Asher dwelt at the shore of the sea, And abideth by its bays.
    translation: JPS 1917
    original: גִּלְעָד בְּעֵבֶר הַיַּרְדֵּן שָׁכֵן וְדָן לָמָּה יָגוּר אֳנִיּוֹת אָשֵׁר יָשַׁב לְחוֹף יַמִּים וְעַל מִפְרָצָיו יִשְׁכּוֹן׃
    hebrewPlain: גלעד בעבר הירדן שכן ודן למה יגור אניות אשר ישב לחוף ימים ועל מפרציו ישכון
    kjvRefs:
    - Judges 5:17
    kjvOsis:
    - Judg.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.18
    scripture: tanakh
    name: Tanakh Judges 5:18
    ref: Judges 5:18
    book: Judg
    section: neviim
    chapter: 5
    verse: 18
    ordinal: 6636
    text: Zebulun is a people that jeoparded their lives unto the death, And Naphtali, upon the high places of the field.
    translation: JPS 1917
    original: זְבֻלוּן עַם חֵרֵף נַפְשׁוֹ לָמוּת וְנַפְתָּלִי עַל מְרוֹמֵי שָׂדֶה׃
    hebrewPlain: זבלון עם חרף נפשו למות ונפתלי על מרומי שדה
    kjvRefs:
    - Judges 5:18
    kjvOsis:
    - Judg.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.19
    scripture: tanakh
    name: Tanakh Judges 5:19
    ref: Judges 5:19
    book: Judg
    section: neviim
    chapter: 5
    verse: 19
    ordinal: 6637
    text: The kings came, they fought; Then fought the kings of Canaan, In Taanach by the waters of Megiddo; They took no gain of money.
    translation: JPS 1917
    original: בָּאוּ מְלָכִים נִלְחָמוּ אָז נִלְחֲמוּ מַלְכֵי כְנַעַן בְּתַעְנַךְ עַל־מֵי מְגִדּוֹ בֶּצַע כֶּסֶף לֹא לָקָחוּ׃
    hebrewPlain: באו מלכים נלחמו אז נלחמו מלכי כנען בתענך על מי מגדו בצע כסף לא לקחו
    kjvRefs:
    - Judges 5:19
    kjvOsis:
    - Judg.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.20
    scripture: tanakh
    name: Tanakh Judges 5:20
    ref: Judges 5:20
    book: Judg
    section: neviim
    chapter: 5
    verse: 20
    ordinal: 6638
    text: They fought from heaven, The stars in their courses fought against Sisera.
    translation: JPS 1917
    original: מִן־שָׁמַיִם נִלְחָמוּ הַכּוֹכָבִים מִמְּסִלּוֹתָם נִלְחֲמוּ עִם־סִיסְרָא׃
    hebrewPlain: מן שמים נלחמו הכוכבים ממסלותם נלחמו עם סיסרא
    kjvRefs:
    - Judges 5:20
    kjvOsis:
    - Judg.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.21
    scripture: tanakh
    name: Tanakh Judges 5:21
    ref: Judges 5:21
    book: Judg
    section: neviim
    chapter: 5
    verse: 21
    ordinal: 6639
    text: The brook Kishon swept them away, That ancient brook, the brook Kishon. O my soul, tread them down with strength.
    translation: JPS 1917
    original: נַחַל קִישׁוֹן גְּרָפָם נַחַל קְדוּמִים נַחַל קִישׁוֹן תִּדְרְכִי נַפְשִׁי עֹז׃
    hebrewPlain: נחל קישון גרפם נחל קדומים נחל קישון תדרכי נפשי עז
    kjvRefs:
    - Judges 5:21
    kjvOsis:
    - Judg.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.22
    scripture: tanakh
    name: Tanakh Judges 5:22
    ref: Judges 5:22
    book: Judg
    section: neviim
    chapter: 5
    verse: 22
    ordinal: 6640
    text: Then did the horsehoofs stamp By reason of the prancings, the prancings of their mighty ones.
    translation: JPS 1917
    original: אָז הָלְמוּ עִקְּבֵי־סוּס מִדַּהֲרוֹת דַּהֲרוֹת אַבִּירָיו׃
    hebrewPlain: אז הלמו עקבי סוס מדהרות דהרות אביריו
    kjvRefs:
    - Judges 5:22
    kjvOsis:
    - Judg.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.23
    scripture: tanakh
    name: Tanakh Judges 5:23
    ref: Judges 5:23
    book: Judg
    section: neviim
    chapter: 5
    verse: 23
    ordinal: 6641
    text: ’Curse ye Meroz’, said the angel of the LORD, ‘Curse ye bitterly the inhabitants thereof, Because they came not to the help of the LORD, To the help of the LORD against the mighty.’
    translation: JPS 1917
    original: אוֹרוּ מֵרוֹז אָמַר מַלְאַךְ יְהוָה אֹרוּ אָרוֹר יֹשְׁבֶיהָ כִּי לֹא־בָאוּ לְעֶזְרַת יְהוָה לְעֶזְרַת יְהוָה בַּגִּבּוֹרִים׃
    hebrewPlain: אורו מרוז אמר מלאך יהוה ארו ארור ישביה כי לא באו לעזרת יהוה לעזרת יהוה בגבורים
    kjvRefs:
    - Judges 5:23
    kjvOsis:
    - Judg.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.24
    scripture: tanakh
    name: Tanakh Judges 5:24
    ref: Judges 5:24
    book: Judg
    section: neviim
    chapter: 5
    verse: 24
    ordinal: 6642
    text: Blessed above women shall Jael be, The wife of Heber the Kenite, Above women in the tent shall she be blessed.
    translation: JPS 1917
    original: תְּבֹרַךְ מִנָּשִׁים יָעֵל אֵשֶׁת חֶבֶר הַקֵּינִי מִנָּשִׁים בָּאֹהֶל תְּבֹרָךְ׃
    hebrewPlain: תברך מנשים יעל אשת חבר הקיני מנשים באהל תברך
    kjvRefs:
    - Judges 5:24
    kjvOsis:
    - Judg.5.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.25
    scripture: tanakh
    name: Tanakh Judges 5:25
    ref: Judges 5:25
    book: Judg
    section: neviim
    chapter: 5
    verse: 25
    ordinal: 6643
    text: Water he asked, milk she gave him; In a lordly bowl she brought him curd.
    translation: JPS 1917
    original: מַיִם שָׁאַל חָלָב נָתָנָה בְּסֵפֶל אַדִּירִים הִקְרִיבָה חֶמְאָה׃
    hebrewPlain: מים שאל חלב נתנה בספל אדירים הקריבה חמאה
    kjvRefs:
    - Judges 5:25
    kjvOsis:
    - Judg.5.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.26
    scripture: tanakh
    name: Tanakh Judges 5:26
    ref: Judges 5:26
    book: Judg
    section: neviim
    chapter: 5
    verse: 26
    ordinal: 6644
    text: Her hand she put to the tent-pin, And her right hand to the workmen’s hammer; And with the hammer she smote Sisera, she smote through his head, Yea, she pierced and struck through his temples.
    translation: JPS 1917
    original: יָדָהּ לַיָּתֵד תִּשְׁלַחְנָה וִימִינָהּ לְהַלְמוּת עֲמֵלִים וְהָלְמָה סִיסְרָא מָחֲקָה רֹאשׁוֹ וּמָחֲצָה וְחָלְפָה רַקָּתוֹ׃
    hebrewPlain: ידה ליתד תשלחנה וימינה להלמות עמלים והלמה סיסרא מחקה ראשו ומחצה וחלפה רקתו
    kjvRefs:
    - Judges 5:26
    kjvOsis:
    - Judg.5.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.27
    scripture: tanakh
    name: Tanakh Judges 5:27
    ref: Judges 5:27
    book: Judg
    section: neviim
    chapter: 5
    verse: 27
    ordinal: 6645
    text: At her feet he sunk, he fell, he lay; At her feet he sunk, he fell; Where he sunk, there he fell down dead.
    translation: JPS 1917
    original: בֵּין רַגְלֶיהָ כָּרַע נָפַל שָׁכָב בֵּין רַגְלֶיהָ כָּרַע נָפָל בַּאֲשֶׁר כָּרַע שָׁם נָפַל שָׁדוּד׃
    hebrewPlain: בין רגליה כרע נפל שכב בין רגליה כרע נפל באשר כרע שם נפל שדוד
    kjvRefs:
    - Judges 5:27
    kjvOsis:
    - Judg.5.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.28
    scripture: tanakh
    name: Tanakh Judges 5:28
    ref: Judges 5:28
    book: Judg
    section: neviim
    chapter: 5
    verse: 28
    ordinal: 6646
    text: 'Through the window she looked forth, and peered, The mother of Sisera, through the lattice: ‘Why is his chariot so long in coming? Why tarry the wheels of his chariots?'
    translation: JPS 1917
    original: בְּעַד הַחַלּוֹן נִשְׁקְפָה וַתְּיַבֵּב אֵם סִיסְרָא בְּעַד הָאֶשְׁנָב מַדּוּעַ בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא מַדּוּעַ אֶחֱרוּ פַּעֲמֵי מַרְכְּבוֹתָיו׃
    hebrewPlain: בעד החלון נשקפה ותיבב אם סיסרא בעד האשנב מדוע בשש רכבו לבוא מדוע אחרו פעמי מרכבותיו
    kjvRefs:
    - Judges 5:28
    kjvOsis:
    - Judg.5.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
- type: TanakhVerse
  data:
    osis: Judg.5.29
    scripture: tanakh
    name: Tanakh Judges 5:29
    ref: Judges 5:29
    book: Judg
    section: neviim
    chapter: 5
    verse: 29
    ordinal: 6647
    text: 'The wisest of her princesses answer her, Yea, she returneth answer to herself:'
    translation: JPS 1917
    original: חַכְמוֹת שָׂרוֹתֶיהָ תַּעֲנֶינָּה אַף־הִיא תָּשִׁיב אֲמָרֶיהָ לָהּ׃
    hebrewPlain: חכמות שרותיה תענינה אף היא תשיב אמריה לה
    kjvRefs:
    - Judges 5:29
    kjvOsis:
    - Judg.5.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.5
