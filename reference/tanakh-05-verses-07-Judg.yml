  data:
    osis: Judg.12.11
    scripture: tanakh
    name: Tanakh Judges 12:11
    ref: Judges 12:11
    book: Judg
    section: neviim
    chapter: 12
    verse: 11
    ordinal: 6875
    text: And after him Elon the Zebulunite judged Israel; and he judged Israel ten years.
    translation: JPS 1917
    original: וַיִּשְׁפֹּט אַחֲרָיו אֶת־יִשְׂרָאֵל אֵילוֹן הַזְּבוּלֹנִי וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל עֶשֶׂר שָׁנִים׃
    hebrewPlain: וישפט אחריו את ישראל אילון הזבולני וישפט את ישראל עשר שנים
    kjvRefs:
