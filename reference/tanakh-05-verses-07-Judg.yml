  data:
    osis: Judg.1.6
    scripture: tanakh
    name: Tanakh Judges 1:6
    ref: Judges 1:6
    book: Judg
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 6510
    text: But Adoni-bezek fled; and they pursued after him, and caught him, and cut off his thumbs and his great toes.
    translation: JPS 1917
    original: וַיָּנָס אֲדֹנִי בֶזֶק וַיִּרְדְּפוּ אַחֲרָיו וַיֹּאחֲזוּ אֹתוֹ וַיְקַצְּצוּ אֶת־בְּהֹנוֹת יָדָיו וְרַגְלָיו׃
    hebrewPlain: וינס אדני בזק וירדפו אחריו ויאחזו אתו ויקצצו את בהנות ידיו ורגליו
    kjvRefs:
    - Judges 1:6
    kjvOsis:
    - Judg.1.6
  relations:
  - predicate: IN
    to:
