- type: TanakhVerse
  data:
    osis: Judg.1.3
    scripture: tanakh
    name: Tanakh Judges 1:3
    ref: Judges 1:3
    book: Judg
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 6507
    text: 'And Judah said unto Simeon his brother: ‘Come up with me into my lot, that we may fight against the Canaanites; and I likewise will go with thee into thy lot.’ So Simeon went with him.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוּדָה לְשִׁמְעוֹן אָחִיו עֲלֵה אִתִּי בְגוֹרָלִי וְנִלָּחֲמָה בַּכְּנַעֲנִי וְהָלַכְתִּי גַם־אֲנִי אִתְּךָ בְּגוֹרָלֶךָ וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן׃
    hebrewPlain: ויאמר יהודה לשמעון אחיו עלה אתי בגורלי ונלחמה בכנעני והלכתי גם אני אתך בגורלך וילך אתו שמעון
    kjvRefs:
    - Judges 1:3
    kjvOsis:
    - Judg.1.3
