    scripture: tanakh
    name: Tanakh Judges 1:9
    ref: Judges 1:9
    book: Judg
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 6513
    text: And afterward the children of Judah went down to fight against the Canaanites that dwelt in the hill-country, and in the South, and in the Lowland.
    translation: JPS 1917
    original: וְאַחַר יָרְדוּ בְּנֵי יְהוּדָה לְהִלָּחֵם בַּכְּנַעֲנִי יוֹשֵׁב הָהָר וְהַנֶּגֶב וְהַשְּׁפֵלָה׃
    hebrewPlain: ואחר ירדו בני יהודה להלחם בכנעני יושב ההר והנגב והשפלה
    kjvRefs:
    - Judges 1:9
    kjvOsis:
    - Judg.1.9
