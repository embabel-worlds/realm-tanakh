    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה יְהוּדָה יַעֲלֶה הִנֵּה נָתַתִּי אֶת־הָאָרֶץ בְּיָדוֹ׃
    hebrewPlain: ויאמר יהוה יהודה יעלה הנה נתתי את הארץ בידו
    kjvRefs:
