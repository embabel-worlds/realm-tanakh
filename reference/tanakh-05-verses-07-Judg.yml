- type: TanakhVerse
  data:
    osis: Judg.12.14
    scripture: tanakh
    name: Tanakh Judges 12:14
    ref: Judges 12:14
    book: Judg
    section: neviim
    chapter: 12
    verse: 14
    ordinal: 6878
    text: And he had forty sons and thirty sons’ sons, that rode on threescore and ten ass colts; and he judged Israel eight years.
    translation: JPS 1917
    original: וַיְהִי־לוֹ אַרְבָּעִים בָּנִים וּשְׁלֹשִׁים בְּנֵי בָנִים רֹכְבִים עַל־שִׁבְעִים עֲיָרִם וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל שְׁמֹנֶה שָׁנִים׃
    hebrewPlain: ויהי לו ארבעים בנים ושלשים בני בנים רכבים על שבעים עירם וישפט את ישראל שמנה שנים
    kjvRefs:
    - Judges 12:14
    kjvOsis:
    - Judg.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.12.15
    scripture: tanakh
    name: Tanakh Judges 12:15
    ref: Judges 12:15
    book: Judg
    section: neviim
    chapter: 12
    verse: 15
    ordinal: 6879
    text: And Abdon the son of Hillel the Pirathonite died, and was buried in Pirathon in the land of Ephraim, in the hill-country of the Amalekites.
    translation: JPS 1917
    original: וַיָּמָת עַבְדּוֹן בֶּן־הִלֵּל הַפִּרְעָתוֹנִי וַיִּקָּבֵר בְּפִרְעָתוֹן בְּאֶרֶץ אֶפְרַיִם בְּהַר הָעֲמָלֵקִי׃
    hebrewPlain: וימת עבדון בן הלל הפרעתוני ויקבר בפרעתון בארץ אפרים בהר העמלקי
    kjvRefs:
    - Judges 12:15
    kjvOsis:
    - Judg.12.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.12
- type: TanakhVerse
  data:
    osis: Judg.13.1
    scripture: tanakh
    name: Tanakh Judges 13:1
    ref: Judges 13:1
    book: Judg
    section: neviim
    chapter: 13
    verse: 1
    ordinal: 6880
    text: And the children of Israel again did that which was evil in the sight of the LORD; and the LORD delivered them into the hand of the Philistines forty years.
    translation: JPS 1917
    original: וַיֹּסִפוּ בְּנֵי יִשְׂרָאֵל לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה וַיִּתְּנֵם יְהוָה בְּיַד־פְּלִשְׁתִּים אַרְבָּעִים שָׁנָה׃
    hebrewPlain: ויספו בני ישראל לעשות הרע בעיני יהוה ויתנם יהוה ביד פלשתים ארבעים שנה
    kjvRefs:
    - Judges 13:1
    kjvOsis:
    - Judg.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.2
    scripture: tanakh
    name: Tanakh Judges 13:2
    ref: Judges 13:2
    book: Judg
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 6881
    text: And there was a certain man of Zorah, of the family of the Danites, whose name was Manoah; and his wife was barren, and bore not.
    translation: JPS 1917
    original: וַיְהִי אִישׁ אֶחָד מִצָּרְעָה מִמִּשְׁפַּחַת הַדָּנִי וּשְׁמוֹ מָנוֹחַ וְאִשְׁתּוֹ עֲקָרָה וְלֹא יָלָדָה׃
    hebrewPlain: ויהי איש אחד מצרעה ממשפחת הדני ושמו מנוח ואשתו עקרה ולא ילדה
    kjvRefs:
    - Judges 13:2
    kjvOsis:
    - Judg.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.3
    scripture: tanakh
    name: Tanakh Judges 13:3
    ref: Judges 13:3
    book: Judg
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 6882
    text: 'And the angel of the LORD appeared unto the woman, and said unto her: ‘Behold now, thou art barren, and hast not borne; but thou shalt conceive, and bear a son.'
    translation: JPS 1917
    original: וַיֵּרָא מַלְאַךְ־יְהוָה אֶל־הָאִשָּׁה וַיֹּאמֶר אֵלֶיהָ הִנֵּה־נָא אַתְּ־עֲקָרָה וְלֹא יָלַדְתְּ וְהָרִית וְיָלַדְתְּ בֵּן׃
    hebrewPlain: וירא מלאך יהוה אל האשה ויאמר אליה הנה נא את עקרה ולא ילדת והרית וילדת בן
    kjvRefs:
    - Judges 13:3
    kjvOsis:
    - Judg.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.4
    scripture: tanakh
    name: Tanakh Judges 13:4
    ref: Judges 13:4
    book: Judg
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 6883
    text: Now therefore beware, I pray thee, and drink no wine nor strong drink, and eat not any unclean thing.
    translation: JPS 1917
    original: וְעַתָּה הִשָּׁמְרִי נָא וְאַל־תִּשְׁתִּי יַיִן וְשֵׁכָר וְאַל־תֹּאכְלִי כָּל־טָמֵא׃
    hebrewPlain: ועתה השמרי נא ואל תשתי יין ושכר ואל תאכלי כל טמא
    kjvRefs:
    - Judges 13:4
    kjvOsis:
    - Judg.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
- type: TanakhVerse
  data:
    osis: Judg.13.5
    scripture: tanakh
    name: Tanakh Judges 13:5
    ref: Judges 13:5
    book: Judg
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 6884
    text: For, lo, thou shalt conceive, and bear a son; and no razor shall come upon his head; for the child shall be a Nazirite unto God from the womb; and he shall begin to save Israel out of the hand of the Philistines.’
    translation: JPS 1917
    original: כִּי הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן וּמוֹרָה לֹא־יַעֲלֶה עַל־רֹאשׁוֹ כִּי־נְזִיר אֱלֹהִים יִהְיֶה הַנַּעַר מִן־הַבָּטֶן וְהוּא יָחֵל לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל מִיַּד פְּלִשְׁתִּים׃
    hebrewPlain: כי הנך הרה וילדת בן ומורה לא יעלה על ראשו כי נזיר אלהים יהיה הנער מן הבטן והוא יחל להושיע את ישראל מיד פלשתים
    kjvRefs:
    - Judges 13:5
    kjvOsis:
    - Judg.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Judg.13
