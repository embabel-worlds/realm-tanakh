  data:
    osis: 2Kgs.9.9
    scripture: tanakh
    name: Tanakh 2 Kings 9:9
    ref: 2 Kings 9:9
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 9
    ordinal: 9677
    text: And I will make the house of Ahab like the house of Jeroboam the son of Nebat, and like the house of Baasa the son of Ahijah.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־בֵּית אַחְאָב כְּבֵית יָרָבְעָם בֶּן־נְבָט וּכְבֵית בַּעְשָׁא בֶן־אֲחִיָּה׃
    hebrewPlain: ונתתי את בית אחאב כבית ירבעם בן נבט וכבית בעשא בן אחיה
    kjvRefs:
    - 2 Kings 9:9
    kjvOsis:
