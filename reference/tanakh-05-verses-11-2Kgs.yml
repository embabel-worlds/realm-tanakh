    name: Tanakh 2 Kings 1:7
    ref: 2 Kings 1:7
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 9452
    text: 'And he said unto them: ‘What manner of man was he that came up to meet you, and told you these words?’'
    translation: JPS 1917
    original: וַיְדַבֵּר אֲלֵהֶם מֶה מִשְׁפַּט הָאִישׁ אֲשֶׁר עָלָה לִקְרַאתְכֶם וַיְדַבֵּר אֲלֵיכֶם אֶת־הַדְּבָרִים הָאֵלֶּה׃
    hebrewPlain: וידבר אלהם מה משפט האיש אשר עלה לקראתכם וידבר אליכם את הדברים האלה
    kjvRefs:
    - 2 Kings 1:7
    kjvOsis:
    - 2Kgs.1.7
  relations:
