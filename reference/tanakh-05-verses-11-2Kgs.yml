- type: TanakhVerse
  data:
    osis: 2Kgs.1.3
    scripture: tanakh
    name: Tanakh 2 Kings 1:3
    ref: 2 Kings 1:3
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 9448
    text: 'But an angel of the LORD said to Elijah the Tishbite: ‘Arise, go up to meet the messengers of the king of Samaria, and say unto them: Is it because there is no God in Israel, that ye go to inquire of Baal-zebub the god of Ekron?'
    translation: JPS 1917
    original: וּמַלְאַךְ יְהוָה דִּבֶּר אֶל־אֵלִיָּה הַתִּשְׁבִּי קוּם עֲלֵה לִקְרַאת מַלְאֲכֵי מֶלֶךְ־שֹׁמְרוֹן וְדַבֵּר אֲלֵהֶם הַמִבְּלִי אֵין־אֱלֹהִים בְּיִשְׂרָאֵל אַתֶּם הֹלְכִים לִדְרֹשׁ בְּבַעַל זְבוּב אֱלֹהֵי עֶקְרוֹן׃
    hebrewPlain: ומלאך יהוה דבר אל אליה התשבי קום עלה לקראת מלאכי מלך שמרון ודבר אלהם המבלי אין אלהים בישראל אתם הלכים לדרש בבעל זבוב אלהי עקרון
    kjvRefs:
    - 2 Kings 1:3
    kjvOsis:
    - 2Kgs.1.3
  relations:
