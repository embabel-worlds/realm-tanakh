    text: because they have done that which is evil in My sight, and have provoked Me, since the day their fathers came forth out of Egypt, even unto this day.’
    translation: JPS 1917
    original: יַעַן אֲשֶׁר עָשׂוּ אֶת־הָרַע בְּעֵינַי וַיִּהְיוּ מַכְעִסִים אֹתִי מִן־הַיּוֹם אֲשֶׁר יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם וְעַד הַיּוֹם הַזֶּה׃
    hebrewPlain: יען אשר עשו את הרע בעיני ויהיו מכעסים אתי מן היום אשר יצאו אבותם ממצרים ועד היום הזה
    kjvRefs:
    - 2 Kings 21:15
    kjvOsis:
    - 2Kgs.21.15
