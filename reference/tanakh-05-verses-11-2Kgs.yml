    scripture: tanakh
    name: Tanakh 2 Kings 21:23
    ref: 2 Kings 21:23
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 23
    ordinal: 10054
    text: And the servants of Amon conspired against him, and put the king to death in his own house.
    translation: JPS 1917
    original: וַיִּקְשְׁרוּ עַבְדֵי־אָמוֹן עָלָיו וַיָּמִיתוּ אֶת־הַמֶּלֶךְ בְּבֵיתוֹ׃
    hebrewPlain: ויקשרו עבדי אמון עליו וימיתו את המלך בביתו
    kjvRefs:
    - 2 Kings 21:23
    kjvOsis:
    - 2Kgs.21.23
  relations:
