    verse: 14
    ordinal: 9459
    text: Behold, there came fire down from heaven, and consumed the two former captains of fifty with their fifties; but now let my life be precious in thy sight’
    translation: JPS 1917
    original: הִנֵּה יָרְדָה אֵשׁ מִן־הַשָּׁמַיִם וַתֹּאכַל אֶת־שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים וְאֶת־חֲמִשֵּׁיהֶם וְעַתָּה תִּיקַר נַפְשִׁי בְּעֵינֶיךָ׃
    hebrewPlain: הנה ירדה אש מן השמים ותאכל את שני שרי החמשים הראשנים ואת חמשיהם ועתה תיקר נפשי בעיניך
    kjvRefs:
