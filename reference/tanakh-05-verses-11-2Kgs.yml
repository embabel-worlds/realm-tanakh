  data:
    osis: 2Kgs.17.39
    scripture: tanakh
    name: Tanakh 2 Kings 17:39
    ref: 2 Kings 17:39
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 39
    ordinal: 9934
    text: but the LORD your God shall ye fear; and He will deliver you out of the hand of all your enemies.’
    translation: JPS 1917
    original: כִּי אִם־אֶת־יְהוָה אֱלֹהֵיכֶם תִּירָאוּ וְהוּא יַצִּיל אֶתְכֶם מִיַּד כָּל־אֹיְבֵיכֶם׃
    hebrewPlain: כי אם את יהוה אלהיכם תיראו והוא יציל אתכם מיד כל איביכם
    kjvRefs:
