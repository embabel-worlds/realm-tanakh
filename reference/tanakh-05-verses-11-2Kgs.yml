  data:
    osis: 2Kgs.4.21
    scripture: tanakh
    name: Tanakh 2 Kings 4:21
    ref: 2 Kings 4:21
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 21
    ordinal: 9536
    text: And she went up, and laid him on the bed of the man of God, and shut the door upon him, and went out.
    translation: JPS 1917
    original: וַתַּעַל וַתַּשְׁכִּבֵהוּ עַל־מִטַּת אִישׁ הָאֱלֹהִים וַתִּסְגֹּר בַּעֲדוֹ וַתֵּצֵא׃
    hebrewPlain: ותעל ותשכבהו על מטת איש האלהים ותסגר בעדו ותצא
    kjvRefs:
    - 2 Kings 4:21
    kjvOsis:
    - 2Kgs.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.22
    scripture: tanakh
    name: Tanakh 2 Kings 4:22
    ref: 2 Kings 4:22
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 22
    ordinal: 9537
    text: 'And she called unto her husband, and said: ‘Send me, I pray thee, one of the servants, and one of the asses, that I may run to the man of God, and come back.’'
    translation: JPS 1917
    original: וַתִּקְרָא אֶל־אִישָׁהּ וַתֹּאמֶר שִׁלְחָה נָא לִי אֶחָד מִן־הַנְּעָרִים וְאַחַת הָאֲתֹנוֹת וְאָרוּצָה עַד־אִישׁ הָאֱלֹהִים וְאָשׁוּבָה׃
    hebrewPlain: ותקרא אל אישה ותאמר שלחה נא לי אחד מן הנערים ואחת האתנות וארוצה עד איש האלהים ואשובה
    kjvRefs:
    - 2 Kings 4:22
    kjvOsis:
    - 2Kgs.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.23
    scripture: tanakh
    name: Tanakh 2 Kings 4:23
    ref: 2 Kings 4:23
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 23
    ordinal: 9538
    text: 'And he said: Wherefore wilt thou go to him today? it is neither new moon nor sabbath.’ And she said: ‘It shall be well.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מַדּוּעַ אתי [אַתְּ] הלכתי [הֹלֶכֶת] אֵלָיו הַיּוֹם לֹא־חֹדֶשׁ וְלֹא שַׁבָּת וַתֹּאמֶר שָׁלוֹם׃
    hebrewPlain: ויאמר מדוע אתי [את] הלכתי [הלכת] אליו היום לא חדש ולא שבת ותאמר שלום
    kjvRefs:
    - 2 Kings 4:23
    kjvOsis:
    - 2Kgs.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.24
    scripture: tanakh
    name: Tanakh 2 Kings 4:24
    ref: 2 Kings 4:24
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 24
    ordinal: 9539
    text: 'Then she saddled an ass, and said to her servant: ‘Drive, and go forward; slacken me not the riding, except I bid thee.’'
    translation: JPS 1917
    original: וַתַּחֲבֹשׁ הָאָתוֹן וַתֹּאמֶר אֶל־נַעֲרָהּ נְהַג וָלֵךְ אַל־תַּעֲצָר־לִי לִרְכֹּב כִּי אִם־אָמַרְתִּי לָךְ׃
    hebrewPlain: ותחבש האתון ותאמר אל נערה נהג ולך אל תעצר לי לרכב כי אם אמרתי לך
    kjvRefs:
    - 2 Kings 4:24
    kjvOsis:
    - 2Kgs.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.25
    scripture: tanakh
    name: Tanakh 2 Kings 4:25
    ref: 2 Kings 4:25
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 25
    ordinal: 9540
    text: 'So she went, and came unto the man of God to mount Carmel. And it came to pass, when the man of God saw her afar off, that he said to Gehazi his servant: ‘Behold, yonder is that Shunammite.'
    translation: JPS 1917
    original: וַתֵּלֶךְ וַתָּבוֹא אֶל־אִישׁ הָאֱלֹהִים אֶל־הַר הַכַּרְמֶל וַיְהִי כִּרְאוֹת אִישׁ־הָאֱלֹהִים אֹתָהּ מִנֶּגֶד וַיֹּאמֶר אֶל־גֵּיחֲזִי נַעֲרוֹ הִנֵּה הַשּׁוּנַמִּית הַלָּז׃
    hebrewPlain: ותלך ותבוא אל איש האלהים אל הר הכרמל ויהי כראות איש האלהים אתה מנגד ויאמר אל גיחזי נערו הנה השונמית הלז
    kjvRefs:
    - 2 Kings 4:25
    kjvOsis:
    - 2Kgs.4.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.26
    scripture: tanakh
    name: Tanakh 2 Kings 4:26
    ref: 2 Kings 4:26
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 26
    ordinal: 9541
    text: 'Run, I pray thee, now to meet her, and say unto her: Is it well with thee? is it well with thy husband? is it well with the child?’ And she answered: ‘It is well.’'
    translation: JPS 1917
    original: עַתָּה רוּץ־נָא לִקְרָאתָהּ וֶאֱמָר־לָהּ הֲשָׁלוֹם לָךְ הֲשָׁלוֹם לְאִישֵׁךְ הֲשָׁלוֹם לַיָּלֶד וַתֹּאמֶר שָׁלוֹם׃
    hebrewPlain: עתה רוץ נא לקראתה ואמר לה השלום לך השלום לאישך השלום לילד ותאמר שלום
    kjvRefs:
    - 2 Kings 4:26
    kjvOsis:
    - 2Kgs.4.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.27
    scripture: tanakh
    name: Tanakh 2 Kings 4:27
    ref: 2 Kings 4:27
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 27
    ordinal: 9542
    text: 'And when she came to the man of God to the hill, she caught hold of his feet. And Gehazi came near to thrust her away; but the man of God said: ‘Let her alone; for her soul is bitter within her; and the LORD hath hid it from me, and hath not told Me.’'
    translation: JPS 1917
    original: וַתָּבֹא אֶל־אִישׁ הָאֱלֹהִים אֶל־הָהָר וַתַּחֲזֵק בְּרַגְלָיו וַיִּגַּשׁ גֵּיחֲזִי לְהָדְפָהּ וַיֹּאמֶר אִישׁ הָאֱלֹהִים הַרְפֵּה־לָהּ כִּי־נַפְשָׁהּ מָרָה־לָהּ וַיהוָה הֶעְלִים מִמֶּנִּי וְלֹא הִגִּיד לִי׃
    hebrewPlain: ותבא אל איש האלהים אל ההר ותחזק ברגליו ויגש גיחזי להדפה ויאמר איש האלהים הרפה לה כי נפשה מרה לה ויהוה העלים ממני ולא הגיד לי
    kjvRefs:
    - 2 Kings 4:27
    kjvOsis:
    - 2Kgs.4.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.28
    scripture: tanakh
    name: Tanakh 2 Kings 4:28
    ref: 2 Kings 4:28
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 28
    ordinal: 9543
    text: 'Then she said: ‘Did I desire a son of my lord? did I not say: Do not deceive me?’'
    translation: JPS 1917
    original: וַתֹּאמֶר הֲשָׁאַלְתִּי בֵן מֵאֵת אֲדֹנִי הֲלֹא אָמַרְתִּי לֹא תַשְׁלֶה אֹתִי׃
    hebrewPlain: ותאמר השאלתי בן מאת אדני הלא אמרתי לא תשלה אתי
    kjvRefs:
    - 2 Kings 4:28
    kjvOsis:
    - 2Kgs.4.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.29
    scripture: tanakh
    name: Tanakh 2 Kings 4:29
    ref: 2 Kings 4:29
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 29
    ordinal: 9544
    text: 'Then he said to Gehazi: ‘Gird up thy loins, and take my staff in thy hand, and go thy way; if thou meet any man, salute him not; and if any salute thee, answer him not; and lay my staff upon the face of the child.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לְגֵיחֲזִי חֲגֹר מָתְנֶיךָ וְקַח מִשְׁעַנְתִּי בְיָדְךָ וָלֵךְ כִּי־תִמְצָא אִישׁ לֹא תְבָרְכֶנּוּ וְכִי־יְבָרֶכְךָ אִישׁ לֹא תַעֲנֶנּוּ וְשַׂמְתָּ מִשְׁעַנְתִּי עַל־פְּנֵי הַנָּעַר׃
    hebrewPlain: ויאמר לגיחזי חגר מתניך וקח משענתי בידך ולך כי תמצא איש לא תברכנו וכי יברכך איש לא תעננו ושמת משענתי על פני הנער
    kjvRefs:
    - 2 Kings 4:29
    kjvOsis:
    - 2Kgs.4.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.30
    scripture: tanakh
    name: Tanakh 2 Kings 4:30
    ref: 2 Kings 4:30
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 30
    ordinal: 9545
    text: 'And the mother of the child said: ‘As the LORD liveth, and as thy soul liveth, I will not leave thee.’ And he arose, and followed her.'
    translation: JPS 1917
    original: וַתֹּאמֶר אֵם הַנַּעַר חַי־יְהוָה וְחֵי־נַפְשְׁךָ אִם־אֶעֶזְבֶךָּ וַיָּקָם וַיֵּלֶךְ אַחֲרֶיהָ׃
    hebrewPlain: ותאמר אם הנער חי יהוה וחי נפשך אם אעזבך ויקם וילך אחריה
    kjvRefs:
    - 2 Kings 4:30
    kjvOsis:
    - 2Kgs.4.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.31
    scripture: tanakh
    name: Tanakh 2 Kings 4:31
    ref: 2 Kings 4:31
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 31
    ordinal: 9546
    text: 'And Gehazi passed on before them, and laid the staff upon the face of the child; but there was neither voice, nor hearing. Wherefore he returned to meet him, and told him, saying: ‘The child is not awaked.’'
    translation: JPS 1917
    original: וְגֵחֲזִי עָבַר לִפְנֵיהֶם וַיָּשֶׂם אֶת־הַמִּשְׁעֶנֶת עַל־פְּנֵי הַנַּעַר וְאֵין קוֹל וְאֵין קָשֶׁב וַיָּשָׁב לִקְרָאתוֹ וַיַּגֶּד־לוֹ לֵאמֹר לֹא הֵקִיץ הַנָּעַר׃
    hebrewPlain: וגחזי עבר לפניהם וישם את המשענת על פני הנער ואין קול ואין קשב וישב לקראתו ויגד לו לאמר לא הקיץ הנער
    kjvRefs:
    - 2 Kings 4:31
    kjvOsis:
    - 2Kgs.4.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.32
    scripture: tanakh
    name: Tanakh 2 Kings 4:32
    ref: 2 Kings 4:32
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 32
    ordinal: 9547
    text: And when Elisha was come into the house, behold, the child was dead, and laid upon his bed.
    translation: JPS 1917
    original: וַיָּבֹא אֱלִישָׁע הַבָּיְתָה וְהִנֵּה הַנַּעַר מֵת מֻשְׁכָּב עַל־מִטָּתוֹ׃
    hebrewPlain: ויבא אלישע הביתה והנה הנער מת משכב על מטתו
    kjvRefs:
    - 2 Kings 4:32
    kjvOsis:
    - 2Kgs.4.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.33
    scripture: tanakh
    name: Tanakh 2 Kings 4:33
    ref: 2 Kings 4:33
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 33
    ordinal: 9548
    text: He went in therefore, and shut the door upon them twain, and prayed unto the LORD.
    translation: JPS 1917
    original: וַיָּבֹא וַיִּסְגֹּר הַדֶּלֶת בְּעַד שְׁנֵיהֶם וַיִּתְפַּלֵּל אֶל־יְהוָה׃
    hebrewPlain: ויבא ויסגר הדלת בעד שניהם ויתפלל אל יהוה
    kjvRefs:
    - 2 Kings 4:33
    kjvOsis:
    - 2Kgs.4.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.34
    scripture: tanakh
    name: Tanakh 2 Kings 4:34
    ref: 2 Kings 4:34
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 34
    ordinal: 9549
    text: And he went up, and lay upon the child, and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands; and he stretched himself upon him; and the flesh of the child waxed warm.
    translation: JPS 1917
    original: וַיַּעַל וַיִּשְׁכַּב עַל־הַיֶּלֶד וַיָּשֶׂם פִּיו עַל־פִּיו וְעֵינָיו עַל־עֵינָיו וְכַפָּיו עַל־כפו [כַּפָּיו] וַיִּגְהַר עָלָיו וַיָּחָם בְּשַׂר הַיָּלֶד׃
    hebrewPlain: ויעל וישכב על הילד וישם פיו על פיו ועיניו על עיניו וכפיו על כפו [כפיו] ויגהר עליו ויחם בשר הילד
    kjvRefs:
    - 2 Kings 4:34
    kjvOsis:
    - 2Kgs.4.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.35
    scripture: tanakh
    name: Tanakh 2 Kings 4:35
    ref: 2 Kings 4:35
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 35
    ordinal: 9550
    text: Then he returned, and walked in the house once to and fro; and went up, and stretched himself upon him; and the child sneezed seven times, and the child opened his eyes.
    translation: JPS 1917
    original: וַיָּשָׁב וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה וַיַּעַל וַיִּגְהַר עָלָיו וַיְזוֹרֵר הַנַּעַר עַד־שֶׁבַע פְּעָמִים וַיִּפְקַח הַנַּעַר אֶת־עֵינָיו׃
    hebrewPlain: וישב וילך בבית אחת הנה ואחת הנה ויעל ויגהר עליו ויזורר הנער עד שבע פעמים ויפקח הנער את עיניו
    kjvRefs:
    - 2 Kings 4:35
    kjvOsis:
    - 2Kgs.4.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.36
    scripture: tanakh
    name: Tanakh 2 Kings 4:36
    ref: 2 Kings 4:36
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 36
    ordinal: 9551
    text: 'And he called Gehazi, and said: ‘Call this Shunammite.’ So he called her. And when she was come in unto him, he said: ‘Take up thy son.’'
    translation: JPS 1917
    original: וַיִּקְרָא אֶל־גֵּיחֲזִי וַיֹּאמֶר קְרָא אֶל־הַשֻּׁנַמִּית הַזֹּאת וַיִּקְרָאֶהָ וַתָּבוֹא אֵלָיו וַיֹּאמֶר שְׂאִי בְנֵךְ׃
    hebrewPlain: ויקרא אל גיחזי ויאמר קרא אל השנמית הזאת ויקראה ותבוא אליו ויאמר שאי בנך
    kjvRefs:
    - 2 Kings 4:36
    kjvOsis:
    - 2Kgs.4.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.37
    scripture: tanakh
    name: Tanakh 2 Kings 4:37
    ref: 2 Kings 4:37
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 37
    ordinal: 9552
    text: Then she went in, and fell at his feet, and bowed down to the ground; and she took up her son, and went out.
    translation: JPS 1917
    original: וַתָּבֹא וַתִּפֹּל עַל־רַגְלָיו וַתִּשְׁתַּחוּ אָרְצָה וַתִּשָּׂא אֶת־בְּנָהּ וַתֵּצֵא׃
    hebrewPlain: ותבא ותפל על רגליו ותשתחו ארצה ותשא את בנה ותצא
    kjvRefs:
    - 2 Kings 4:37
    kjvOsis:
    - 2Kgs.4.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.38
    scripture: tanakh
    name: Tanakh 2 Kings 4:38
    ref: 2 Kings 4:38
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 38
    ordinal: 9553
    text: 'And Elisha came again to Gilgal; and there was a dearth in the land; and the sons of the prophets were sitting before him; and he said unto his servant: ‘Set on the great pot, and seethe pottage for the sons of the prophets.’'
    translation: JPS 1917
    original: וֶאֱלִישָׁע שָׁב הַגִּלְגָּלָה וְהָרָעָב בָּאָרֶץ וּבְנֵי הַנְּבִיאִים יֹשְׁבִים לְפָנָיו וַיֹּאמֶר לְנַעֲרוֹ שְׁפֹת הַסִּיר הַגְּדוֹלָה וּבַשֵּׁל נָזִיד לִבְנֵי הַנְּבִיאִים׃
    hebrewPlain: ואלישע שב הגלגלה והרעב בארץ ובני הנביאים ישבים לפניו ויאמר לנערו שפת הסיר הגדולה ובשל נזיד לבני הנביאים
    kjvRefs:
    - 2 Kings 4:38
    kjvOsis:
    - 2Kgs.4.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.39
    scripture: tanakh
    name: Tanakh 2 Kings 4:39
    ref: 2 Kings 4:39
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 39
    ordinal: 9554
    text: And one went out into the field to gather herbs, and found a wild vine, and gathered thereof wild gourds his lap full, and came and shred them into the pot of pottage; for they knew them not.
    translation: JPS 1917
    original: וַיֵּצֵא אֶחָד אֶל־הַשָּׂדֶה לְלַקֵּט אֹרֹת וַיִּמְצָא גֶּפֶן שָׂדֶה וַיְלַקֵּט מִמֶּנּוּ פַּקֻּעֹת שָׂדֶה מְלֹא בִגְדוֹ וַיָּבֹא וַיְפַלַּח אֶל־סִיר הַנָּזִיד כִּי־לֹא יָדָעוּ׃
    hebrewPlain: ויצא אחד אל השדה ללקט ארת וימצא גפן שדה וילקט ממנו פקעת שדה מלא בגדו ויבא ויפלח אל סיר הנזיד כי לא ידעו
    kjvRefs:
    - 2 Kings 4:39
    kjvOsis:
    - 2Kgs.4.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.40
    scripture: tanakh
    name: Tanakh 2 Kings 4:40
    ref: 2 Kings 4:40
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 40
    ordinal: 9555
    text: 'So they poured out for the men to eat. And it came to pass, as they were eating of the pottage, that they cried out, and said: ‘O man of God, there is death in the pot.’ And they could not eat thereof.'
    translation: JPS 1917
    original: וַיִּצְקוּ לַאֲנָשִׁים לֶאֱכוֹל וַיְהִי כְּאָכְלָם מֵהַנָּזִיד וְהֵמָּה צָעָקוּ וַיֹּאמְרוּ מָוֶת בַּסִּיר אִישׁ הָאֱלֹהִים וְלֹא יָכְלוּ לֶאֱכֹל׃
    hebrewPlain: ויצקו לאנשים לאכול ויהי כאכלם מהנזיד והמה צעקו ויאמרו מות בסיר איש האלהים ולא יכלו לאכל
    kjvRefs:
    - 2 Kings 4:40
    kjvOsis:
    - 2Kgs.4.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.41
    scripture: tanakh
    name: Tanakh 2 Kings 4:41
    ref: 2 Kings 4:41
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 41
    ordinal: 9556
    text: 'But he said: ‘Then bring meal.’ And he cast it into the pot; and he said: ‘Pour out for the people, that they may eat.’ And there was no harm in the pot.'
    translation: JPS 1917
    original: וַיֹּאמֶר וּקְחוּ־קֶמַח וַיַּשְׁלֵךְ אֶל־הַסִּיר וַיֹּאמֶר צַק לָעָם וְיֹאכֵלוּ וְלֹא הָיָה דָּבָר רָע בַּסִּיר׃
    hebrewPlain: ויאמר וקחו קמח וישלך אל הסיר ויאמר צק לעם ויאכלו ולא היה דבר רע בסיר
    kjvRefs:
    - 2 Kings 4:41
    kjvOsis:
    - 2Kgs.4.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.42
    scripture: tanakh
    name: Tanakh 2 Kings 4:42
    ref: 2 Kings 4:42
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 42
    ordinal: 9557
    text: 'And there came a man from Baal-shalishah, and brought the man of God bread of the first-fruits, twenty loaves of barley, and fresh ears of corn in his sack. And he said: ‘Give unto the people, that they may eat.’'
    translation: JPS 1917
    original: וְאִישׁ בָּא מִבַּעַל שָׁלִשָׁה וַיָּבֵא לְאִישׁ הָאֱלֹהִים לֶחֶם בִּכּוּרִים עֶשְׂרִים־לֶחֶם שְׂעֹרִים וְכַרְמֶל בְּצִקְלֹנוֹ וַיֹּאמֶר תֵּן לָעָם וְיֹאכֵלוּ׃
    hebrewPlain: ואיש בא מבעל שלשה ויבא לאיש האלהים לחם בכורים עשרים לחם שערים וכרמל בצקלנו ויאמר תן לעם ויאכלו
    kjvRefs:
    - 2 Kings 4:42
    kjvOsis:
    - 2Kgs.4.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.43
    scripture: tanakh
    name: Tanakh 2 Kings 4:43
    ref: 2 Kings 4:43
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 43
    ordinal: 9558
    text: 'And his servant said: ‘How should I set this before a hundred men?’ But he said: ‘Give the people, that they may eat; for thus saith the LORD: They shall eat, and shall leave thereof.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מְשָׁרְתוֹ מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ וַיֹּאמֶר תֵּן לָעָם וְיֹאכֵלוּ כִּי כֹה אָמַר יְהוָה אָכֹל וְהוֹתֵר׃
    hebrewPlain: ויאמר משרתו מה אתן זה לפני מאה איש ויאמר תן לעם ויאכלו כי כה אמר יהוה אכל והותר
    kjvRefs:
    - 2 Kings 4:43
    kjvOsis:
    - 2Kgs.4.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.44
    scripture: tanakh
    name: Tanakh 2 Kings 4:44
    ref: 2 Kings 4:44
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 44
    ordinal: 9559
    text: So he set it before them, and they did eat, and left thereof, according to the word of the LORD.
    translation: JPS 1917
    original: וַיִּתֵּן לִפְנֵיהֶם וַיֹּאכְלוּ וַיּוֹתִרוּ כִּדְבַר יְהוָה׃
    hebrewPlain: ויתן לפניהם ויאכלו ויותרו כדבר יהוה
    kjvRefs:
    - 2 Kings 4:44
    kjvOsis:
    - 2Kgs.4.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.5.1
    scripture: tanakh
    name: Tanakh 2 Kings 5:1
    ref: 2 Kings 5:1
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 1
    ordinal: 9560
    text: Now Naaman, captain of the host of the king of Aram, was a great man with his master, and held in esteem, because by him the LORD had given victory unto Aram; he was also a mighty man of valour, but he was a leper.
    translation: JPS 1917
    original: וְנַעֲמָן שַׂר־צְבָא מֶלֶךְ־אֲרָם הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו וּנְשֻׂא פָנִים כִּי־בוֹ נָתַן־יְהוָה תְּשׁוּעָה לַאֲרָם וְהָאִישׁ הָיָה גִּבּוֹר חַיִל מְצֹרָע׃
    hebrewPlain: ונעמן שר צבא מלך ארם היה איש גדול לפני אדניו ונשא פנים כי בו נתן יהוה תשועה לארם והאיש היה גבור חיל מצרע
    kjvRefs:
    - 2 Kings 5:1
    kjvOsis:
    - 2Kgs.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.2
    scripture: tanakh
    name: Tanakh 2 Kings 5:2
    ref: 2 Kings 5:2
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 2
    ordinal: 9561
    text: And the Arameans had gone out in bands, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman’s wife.
    translation: JPS 1917
    original: וַאֲרָם יָצְאוּ גְדוּדִים וַיִּשְׁבּוּ מֵאֶרֶץ יִשְׂרָאֵל נַעֲרָה קְטַנָּה וַתְּהִי לִפְנֵי אֵשֶׁת נַעֲמָן׃
    hebrewPlain: וארם יצאו גדודים וישבו מארץ ישראל נערה קטנה ותהי לפני אשת נעמן
    kjvRefs:
    - 2 Kings 5:2
    kjvOsis:
    - 2Kgs.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.3
    scripture: tanakh
    name: Tanakh 2 Kings 5:3
    ref: 2 Kings 5:3
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 3
    ordinal: 9562
    text: 'And she said unto her mistress: ‘Would that my lord were with the prophet that is in Samaria! then would he recover him of his leprosy.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶל־גְּבִרְתָּהּ אַחֲלֵי אֲדֹנִי לִפְנֵי הַנָּבִיא אֲשֶׁר בְּשֹׁמְרוֹן אָז יֶאֱסֹף אֹתוֹ מִצָּרַעְתּוֹ׃
    hebrewPlain: ותאמר אל גברתה אחלי אדני לפני הנביא אשר בשמרון אז יאסף אתו מצרעתו
    kjvRefs:
    - 2 Kings 5:3
    kjvOsis:
    - 2Kgs.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.4
    scripture: tanakh
    name: Tanakh 2 Kings 5:4
    ref: 2 Kings 5:4
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 4
    ordinal: 9563
    text: 'And he went in, and told his lord, saying: ‘Thus and thus said the maid that is of the land of Israel.’'
    translation: JPS 1917
    original: וַיָּבֹא וַיַּגֵּד לַאדֹנָיו לֵאמֹר כָּזֹאת וְכָזֹאת דִּבְּרָה הַנַּעֲרָה אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל׃
    hebrewPlain: ויבא ויגד לאדניו לאמר כזאת וכזאת דברה הנערה אשר מארץ ישראל
    kjvRefs:
    - 2 Kings 5:4
    kjvOsis:
    - 2Kgs.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.5
    scripture: tanakh
    name: Tanakh 2 Kings 5:5
    ref: 2 Kings 5:5
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 5
    ordinal: 9564
    text: 'And the king of Aram said: ‘Go now, and I will send a letter unto the king of Israel.’ And he departed, and took with him ten talents of silver, and six thousand pieces of gold, and ten changes of raiment.'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ־אֲרָם לֶךְ־בֹּא וְאֶשְׁלְחָה סֵפֶר אֶל־מֶלֶךְ יִשְׂרָאֵל וַיֵּלֶךְ וַיִּקַּח בְּיָדוֹ עֶשֶׂר כִּכְּרֵי־כֶסֶף וְשֵׁשֶׁת אֲלָפִים זָהָב וְעֶשֶׂר חֲלִיפוֹת בְּגָדִים׃
    hebrewPlain: ויאמר מלך ארם לך בא ואשלחה ספר אל מלך ישראל וילך ויקח בידו עשר ככרי כסף וששת אלפים זהב ועשר חליפות בגדים
    kjvRefs:
    - 2 Kings 5:5
    kjvOsis:
    - 2Kgs.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.6
    scripture: tanakh
    name: Tanakh 2 Kings 5:6
    ref: 2 Kings 5:6
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 6
    ordinal: 9565
    text: 'And he brought the letter to the king of Israel, saying: ‘And now when this letter is come unto thee, behold, I have sent Naaman my servant to thee, that thou mayest recover him of his leprosy.’'
    translation: JPS 1917
    original: וַיָּבֵא הַסֵּפֶר אֶל־מֶלֶךְ יִשְׂרָאֵל לֵאמֹר וְעַתָּה כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ הִנֵּה שָׁלַחְתִּי אֵלֶיךָ אֶת־נַעֲמָן עַבְדִּי וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ׃
    hebrewPlain: ויבא הספר אל מלך ישראל לאמר ועתה כבוא הספר הזה אליך הנה שלחתי אליך את נעמן עבדי ואספתו מצרעתו
    kjvRefs:
    - 2 Kings 5:6
    kjvOsis:
    - 2Kgs.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.7
    scripture: tanakh
    name: Tanakh 2 Kings 5:7
    ref: 2 Kings 5:7
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 7
    ordinal: 9566
    text: 'And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said: ‘Am I God, to kill and to make alive, that this man doth send unto me to recover a man of his leprosy? but consider, I pray you, and see how he seeketh an occasion against me.’'
    translation: JPS 1917
    original: וַיְהִי כִּקְרֹא מֶלֶךְ־יִשְׂרָאֵל אֶת־הַסֵּפֶר וַיִּקְרַע בְּגָדָיו וַיֹּאמֶר הַאֱלֹהִים אָנִי לְהָמִית וּלְהַחֲיוֹת כִּי־זֶה שֹׁלֵחַ אֵלַי לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ כִּי אַךְ־דְּעוּ־נָא וּרְאוּ כִּי־מִתְאַנֶּה הוּא לִי׃
    hebrewPlain: ויהי כקרא מלך ישראל את הספר ויקרע בגדיו ויאמר האלהים אני להמית ולהחיות כי זה שלח אלי לאסף איש מצרעתו כי אך דעו נא וראו כי מתאנה הוא לי
    kjvRefs:
    - 2 Kings 5:7
    kjvOsis:
    - 2Kgs.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.8
    scripture: tanakh
    name: Tanakh 2 Kings 5:8
    ref: 2 Kings 5:8
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 8
    ordinal: 9567
    text: 'And it was so, when Elisha the man of God heard that the king of Israel had rent his clothes, that he sent to the king, saying: ‘Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.’'
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ אֱלִישָׁע אִישׁ־הָאֱלֹהִים כִּי־קָרַע מֶלֶךְ־יִשְׂרָאֵל אֶת־בְּגָדָיו וַיִּשְׁלַח אֶל־הַמֶּלֶךְ לֵאמֹר לָמָּה קָרַעְתָּ בְּגָדֶיךָ יָבֹא־נָא אֵלַי וְיֵדַע כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל׃
    hebrewPlain: ויהי כשמע אלישע איש האלהים כי קרע מלך ישראל את בגדיו וישלח אל המלך לאמר למה קרעת בגדיך יבא נא אלי וידע כי יש נביא בישראל
    kjvRefs:
    - 2 Kings 5:8
    kjvOsis:
    - 2Kgs.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.9
    scripture: tanakh
    name: Tanakh 2 Kings 5:9
    ref: 2 Kings 5:9
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 9
    ordinal: 9568
    text: So Naaman came with his horses and with his chariots, and stood at the door of the house of Elisha.
    translation: JPS 1917
    original: וַיָּבֹא נַעֲמָן בסוסו [בְּסוּסָיו] וּבְרִכְבּוֹ וַיַּעֲמֹד פֶּתַח־הַבַּיִת לֶאֱלִישָׁע׃
    hebrewPlain: ויבא נעמן בסוסו [בסוסיו] וברכבו ויעמד פתח הבית לאלישע
    kjvRefs:
    - 2 Kings 5:9
    kjvOsis:
    - 2Kgs.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.10
    scripture: tanakh
    name: Tanakh 2 Kings 5:10
    ref: 2 Kings 5:10
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 10
    ordinal: 9569
    text: 'And Elisha sent a messenger unto him, saying: ‘Go and wash in the Jordan seven times, and thy flesh shall come back to thee, and thou shalt be clean.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֵלָיו אֱלִישָׁע מַלְאָךְ לֵאמֹר הָלוֹךְ וְרָחַצְתָּ שֶׁבַע־פְּעָמִים בַּיַּרְדֵּן וְיָשֹׁב בְּשָׂרְךָ לְךָ וּטְהָר׃
    hebrewPlain: וישלח אליו אלישע מלאך לאמר הלוך ורחצת שבע פעמים בירדן וישב בשרך לך וטהר
    kjvRefs:
    - 2 Kings 5:10
    kjvOsis:
    - 2Kgs.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.11
    scripture: tanakh
    name: Tanakh 2 Kings 5:11
    ref: 2 Kings 5:11
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 11
    ordinal: 9570
    text: 'But Naaman was wroth, and went away, and said: ‘Behold, I thought: He will surely come out to me, and stand, and call on the name of the LORD his God, and wave his hand over the place, and recover the leper.'
    translation: JPS 1917
    original: וַיִּקְצֹף נַעֲמָן וַיֵּלַךְ וַיֹּאמֶר הִנֵּה אָמַרְתִּי אֵלַי יֵצֵא יָצוֹא וְעָמַד וְקָרָא בְּשֵׁם־יְהוָה אֱלֹהָיו וְהֵנִיף יָדוֹ אֶל־הַמָּקוֹם וְאָסַף הַמְּצֹרָע׃
    hebrewPlain: ויקצף נעמן וילך ויאמר הנה אמרתי אלי יצא יצוא ועמד וקרא בשם יהוה אלהיו והניף ידו אל המקום ואסף המצרע
    kjvRefs:
    - 2 Kings 5:11
    kjvOsis:
    - 2Kgs.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.12
    scripture: tanakh
    name: Tanakh 2 Kings 5:12
    ref: 2 Kings 5:12
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 12
    ordinal: 9571
    text: Are not Amanah and Pharpar, the rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean?’ So he turned, and went away in a rage.
    translation: JPS 1917
    original: הֲלֹא טוֹב אבנה [אֲמָנָה] וּפַרְפַּר נַהֲרוֹת דַּמֶּשֶׂק מִכֹּל מֵימֵי יִשְׂרָאֵל הֲלֹא־אֶרְחַץ בָּהֶם וְטָהָרְתִּי וַיִּפֶן וַיֵּלֶךְ בְּחֵמָה׃
    hebrewPlain: הלא טוב אבנה [אמנה] ופרפר נהרות דמשק מכל מימי ישראל הלא ארחץ בהם וטהרתי ויפן וילך בחמה
    kjvRefs:
    - 2 Kings 5:12
    kjvOsis:
    - 2Kgs.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.13
    scripture: tanakh
    name: Tanakh 2 Kings 5:13
    ref: 2 Kings 5:13
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 13
    ordinal: 9572
    text: 'And his servants came near, and spoke unto him, and said: ‘My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? how much rather then, when he saith to thee: Wash, and be clean?’'
    translation: JPS 1917
    original: וַיִּגְּשׁוּ עֲבָדָיו וַיְדַבְּרוּ אֵלָיו וַיֹּאמְרוּ אָבִי דָּבָר גָּדוֹל הַנָּבִיא דִּבֶּר אֵלֶיךָ הֲלוֹא תַעֲשֶׂה וְאַף כִּי־אָמַר אֵלֶיךָ רְחַץ וּטְהָר׃
    hebrewPlain: ויגשו עבדיו וידברו אליו ויאמרו אבי דבר גדול הנביא דבר אליך הלוא תעשה ואף כי אמר אליך רחץ וטהר
    kjvRefs:
    - 2 Kings 5:13
    kjvOsis:
    - 2Kgs.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.14
    scripture: tanakh
    name: Tanakh 2 Kings 5:14
    ref: 2 Kings 5:14
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 14
    ordinal: 9573
    text: Then went he down, and dipped himself seven times in the Jordan, according to the saying of the man of God; and his flesh came back like unto the flesh of a little child, and he was clean.
    translation: JPS 1917
    original: וַיֵּרֶד וַיִּטְבֹּל בַּיַּרְדֵּן שֶׁבַע פְּעָמִים כִּדְבַר אִישׁ הָאֱלֹהִים וַיָּשָׁב בְּשָׂרוֹ כִּבְשַׂר נַעַר קָטֹן וַיִּטְהָר׃
    hebrewPlain: וירד ויטבל בירדן שבע פעמים כדבר איש האלהים וישב בשרו כבשר נער קטן ויטהר
    kjvRefs:
    - 2 Kings 5:14
    kjvOsis:
    - 2Kgs.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.15
    scripture: tanakh
    name: Tanakh 2 Kings 5:15
    ref: 2 Kings 5:15
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 15
    ordinal: 9574
    text: 'And he returned to the man of God, he and all his company, and came, and stood before him; and he said: ‘Behold now, I know that there is no God in all the earth, but in Israel; now therefore, I pray thee, take a present of thy servant.’'
    translation: JPS 1917
    original: וַיָּשָׁב אֶל־אִישׁ הָאֱלֹהִים הוּא וְכָל־מַחֲנֵהוּ וַיָּבֹא וַיַּעֲמֹד לְפָנָיו וַיֹּאמֶר הִנֵּה־נָא יָדַעְתִּי כִּי אֵין אֱלֹהִים בְּכָל־הָאָרֶץ כִּי אִם־בְּיִשְׂרָאֵל וְעַתָּה קַח־נָא בְרָכָה מֵאֵת עַבְדֶּךָ׃
    hebrewPlain: וישב אל איש האלהים הוא וכל מחנהו ויבא ויעמד לפניו ויאמר הנה נא ידעתי כי אין אלהים בכל הארץ כי אם בישראל ועתה קח נא ברכה מאת עבדך
    kjvRefs:
    - 2 Kings 5:15
    kjvOsis:
    - 2Kgs.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.16
    scripture: tanakh
    name: Tanakh 2 Kings 5:16
    ref: 2 Kings 5:16
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 16
    ordinal: 9575
    text: 'But he said: ‘As the LORD liveth, before whom I stand, I will receive none.’ And he urged him to take it; but he refused.'
    translation: JPS 1917
    original: וַיֹּאמֶר חַי־יְהוָה אֲשֶׁר־עָמַדְתִּי לְפָנָיו אִם־אֶקָּח וַיִּפְצַר־בּוֹ לָקַחַת וַיְמָאֵן׃
    hebrewPlain: ויאמר חי יהוה אשר עמדתי לפניו אם אקח ויפצר בו לקחת וימאן
    kjvRefs:
    - 2 Kings 5:16
    kjvOsis:
    - 2Kgs.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.17
    scripture: tanakh
    name: Tanakh 2 Kings 5:17
    ref: 2 Kings 5:17
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 17
    ordinal: 9576
    text: 'And Naaman said: ‘If not, yet I pray thee let there be given to thy servant two mules’ burden of earth; for thy servant will henceforth offer neither burnt-offering nor sacrifice unto other gods, but unto the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר נַעֲמָן וָלֹא יֻתַּן־נָא לְעַבְדְּךָ מַשָּׂא צֶמֶד־פְּרָדִים אֲדָמָה כִּי לוֹא־יַעֲשֶׂה עוֹד עַבְדְּךָ עֹלָה וָזֶבַח לֵאלֹהִים אֲחֵרִים כִּי אִם־לַיהוָה׃
    hebrewPlain: ויאמר נעמן ולא יתן נא לעבדך משא צמד פרדים אדמה כי לוא יעשה עוד עבדך עלה וזבח לאלהים אחרים כי אם ליהוה
    kjvRefs:
    - 2 Kings 5:17
    kjvOsis:
    - 2Kgs.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
