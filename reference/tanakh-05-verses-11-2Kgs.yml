  data:
    osis: 2Kgs.14.28
    scripture: tanakh
    name: Tanakh 2 Kings 14:28
    ref: 2 Kings 14:28
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 28
    ordinal: 9836
    text: Now the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered Damascus, and Hamath, for Judah in Israel, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יָרָבְעָם וְכָל־אֲשֶׁר עָשָׂה וּגְבוּרָתוֹ אֲשֶׁר־נִלְחָם וַאֲשֶׁר הֵשִׁיב אֶת־דַּמֶּשֶׂק וְאֶת־חֲמָת לִיהוּדָה בְּיִשְׂרָאֵל הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי ירבעם וכל אשר עשה וגבורתו אשר נלחם ואשר השיב את דמשק ואת חמת ליהודה בישראל הלא הם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 14:28
    kjvOsis:
    - 2Kgs.14.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.29
    scripture: tanakh
    name: Tanakh 2 Kings 14:29
    ref: 2 Kings 14:29
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 29
    ordinal: 9837
    text: And Jeroboam slept with his fathers, even with the kings of Israel; and Zechariah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יָרָבְעָם עִם־אֲבֹתָיו עִם מַלְכֵי יִשְׂרָאֵל וַיִּמְלֹךְ זְכַרְיָה בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב ירבעם עם אבתיו עם מלכי ישראל וימלך זכריה בנו תחתיו
    kjvRefs:
