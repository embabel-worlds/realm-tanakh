- type: TanakhVerse
  data:
    osis: 2Kgs.25.23
    scripture: tanakh
    name: Tanakh 2 Kings 25:23
    ref: 2 Kings 25:23
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 23
    ordinal: 10157
    text: Now when all the captains of the forces, they and their men, heard that the king of Babylon had made Gedaliah governor, they came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Kareah, and Seraiah the son of Tanhumeth the Netophathite and Jaazaniah the son of the Maacathite, they and their men.
    translation: JPS 1917
    original: וַיִּשְׁמְעוּ כָל־שָׂרֵי הַחֲיָלִים הֵמָּה וְהָאֲנָשִׁים כִּי־הִפְקִיד מֶלֶךְ־בָּבֶל אֶת־גְּדַלְיָהוּ וַיָּבֹאוּ אֶל־גְּדַלְיָהוּ הַמִּצְפָּה וְיִשְׁמָעֵאל בֶּן־נְתַנְיָה וְיוֹחָנָן בֶּן־קָרֵחַ וּשְׂרָיָה בֶן־תַּנְחֻמֶת הַנְּטֹפָתִי וְיַאֲזַנְיָהוּ בֶּן־הַמַּעֲכָתִי הֵמָּה וְאַנְשֵׁיהֶם׃
    hebrewPlain: וישמעו כל שרי החילים המה והאנשים כי הפקיד מלך בבל את גדליהו ויבאו אל גדליהו המצפה וישמעאל בן נתניה ויוחנן בן קרח ושריה בן תנחמת הנטפתי ויאזניהו בן המעכתי המה ואנשיהם
    kjvRefs:
    - 2 Kings 25:23
    kjvOsis:
    - 2Kgs.25.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.24
    scripture: tanakh
    name: Tanakh 2 Kings 25:24
    ref: 2 Kings 25:24
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 24
    ordinal: 10158
    text: 'And Gedaliah swore to them and to their men, and said unto them: ‘Fear not because of the servants of the Chaldeans; dwell in the land, and serve the king of Babylon, and it shall be well with you.’'
    translation: JPS 1917
    original: וַיִּשָּׁבַע לָהֶם גְּדַלְיָהוּ וּלְאַנְשֵׁיהֶם וַיֹּאמֶר לָהֶם אַל־תִּירְאוּ מֵעַבְדֵי הַכַּשְׂדִּים שְׁבוּ בָאָרֶץ וְעִבְדוּ אֶת־מֶלֶךְ בָּבֶל וְיִטַב לָכֶם׃
    hebrewPlain: וישבע להם גדליהו ולאנשיהם ויאמר להם אל תיראו מעבדי הכשדים שבו בארץ ועבדו את מלך בבל ויטב לכם
    kjvRefs:
    - 2 Kings 25:24
    kjvOsis:
    - 2Kgs.25.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.25
    scripture: tanakh
    name: Tanakh 2 Kings 25:25
    ref: 2 Kings 25:25
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 25
    ordinal: 10159
    text: But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldeans that were with him at Mizpah.
    translation: JPS 1917
    original: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי בָּא יִשְׁמָעֵאל בֶּן־נְתַנְיָה בֶּן־אֱלִישָׁמָע מִזֶּרַע הַמְּלוּכָה וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ וַיַּכּוּ אֶת־גְּדַלְיָהוּ וַיָּמֹת וְאֶת־הַיְּהוּדִים וְאֶת־הַכַּשְׂדִּים אֲשֶׁר־הָיוּ אִתּוֹ בַּמִּצְפָּה׃
    hebrewPlain: ויהי בחדש השביעי בא ישמעאל בן נתניה בן אלישמע מזרע המלוכה ועשרה אנשים אתו ויכו את גדליהו וימת ואת היהודים ואת הכשדים אשר היו אתו במצפה
    kjvRefs:
    - 2 Kings 25:25
    kjvOsis:
    - 2Kgs.25.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.26
    scripture: tanakh
    name: Tanakh 2 Kings 25:26
    ref: 2 Kings 25:26
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 26
    ordinal: 10160
    text: And all the people, both small and great, and the captains of the forces, arose, and came to Egypt; for they were afraid of the Chaldeans.
    translation: JPS 1917
    original: וַיָּקֻמוּ כָל־הָעָם מִקָּטֹן וְעַד־גָּדוֹל וְשָׂרֵי הַחֲיָלִים וַיָּבֹאוּ מִצְרָיִם כִּי יָרְאוּ מִפְּנֵי כַשְׂדִּים׃
    hebrewPlain: ויקמו כל העם מקטן ועד גדול ושרי החילים ויבאו מצרים כי יראו מפני כשדים
    kjvRefs:
    - 2 Kings 25:26
    kjvOsis:
    - 2Kgs.25.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.27
    scripture: tanakh
    name: Tanakh 2 Kings 25:27
    ref: 2 Kings 25:27
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 27
    ordinal: 10161
    text: And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth day of the month, that Evil-merodach king of Babylon, in the year that he began to reign, did lift up the head of Jehoiachin king of Judah out of prison.
    translation: JPS 1917
    original: וַיְהִי בִשְׁלֹשִׁים וָשֶׁבַע שָׁנָה לְגָלוּת יְהוֹיָכִין מֶלֶךְ־יְהוּדָה בִּשְׁנֵים עָשָׂר חֹדֶשׁ בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ נָשָׂא אֱוִיל מְרֹדַךְ מֶלֶךְ בָּבֶל בִּשְׁנַת מָלְכוֹ אֶת־רֹאשׁ יְהוֹיָכִין מֶלֶךְ־יְהוּדָה מִבֵּית כֶּלֶא׃
    hebrewPlain: ויהי בשלשים ושבע שנה לגלות יהויכין מלך יהודה בשנים עשר חדש בעשרים ושבעה לחדש נשא אויל מרדך מלך בבל בשנת מלכו את ראש יהויכין מלך יהודה מבית כלא
    kjvRefs:
    - 2 Kings 25:27
    kjvOsis:
    - 2Kgs.25.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.28
    scripture: tanakh
    name: Tanakh 2 Kings 25:28
    ref: 2 Kings 25:28
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 28
    ordinal: 10162
    text: And he spoke kindly to him, and set his throne above the throne of the kings that were with him in Babylon.
    translation: JPS 1917
    original: וַיְדַבֵּר אִתּוֹ טֹבוֹת וַיִּתֵּן אֶת־כִּסְאוֹ מֵעַל כִּסֵּא הַמְּלָכִים אֲשֶׁר אִתּוֹ בְּבָבֶל׃
    hebrewPlain: וידבר אתו טבות ויתן את כסאו מעל כסא המלכים אשר אתו בבבל
    kjvRefs:
    - 2 Kings 25:28
    kjvOsis:
    - 2Kgs.25.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.29
    scripture: tanakh
    name: Tanakh 2 Kings 25:29
    ref: 2 Kings 25:29
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 29
    ordinal: 10163
    text: And he changed his prison garments, and did eat bread before him continually all the days of his life.
    translation: JPS 1917
    original: וְשִׁנָּא אֵת בִּגְדֵי כִלְאוֹ וְאָכַל לֶחֶם תָּמִיד לְפָנָיו כָּל־יְמֵי חַיָּיו׃
    hebrewPlain: ושנא את בגדי כלאו ואכל לחם תמיד לפניו כל ימי חייו
    kjvRefs:
    - 2 Kings 25:29
    kjvOsis:
    - 2Kgs.25.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.30
    scripture: tanakh
    name: Tanakh 2 Kings 25:30
    ref: 2 Kings 25:30
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 30
    ordinal: 10164
    text: And for his allowance, there was a continual allowance given him of the king, every day a portion, all the days of his life.
    translation: JPS 1917
    original: וַאֲרֻחָתוֹ אֲרֻחַת תָּמִיד נִתְּנָה־לּוֹ מֵאֵת הַמֶּלֶךְ דְּבַר־יוֹם בְּיוֹמוֹ כֹּל יְמֵי חַיָּו׃
    hebrewPlain: וארחתו ארחת תמיד נתנה לו מאת המלך דבר יום ביומו כל ימי חיו
    kjvRefs:
    - 2 Kings 25:30
    kjvOsis:
    - 2Kgs.25.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
