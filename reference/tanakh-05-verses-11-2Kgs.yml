- type: TanakhVerse
  data:
    osis: 2Kgs.8.18
    scripture: tanakh
    name: Tanakh 2 Kings 8:18
    ref: 2 Kings 8:18
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 18
    ordinal: 9657
    text: And he walked in the way of the kings of Israel, as did the house of Ahab; for he had the daughter of Ahab to wife; and he did that which was evil in the sight of the LORD.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדֶרֶךְ מַלְכֵי יִשְׂרָאֵל כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב כִּי בַּת־אַחְאָב הָיְתָה־לּוֹ לְאִשָּׁה וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: וילך בדרך מלכי ישראל כאשר עשו בית אחאב כי בת אחאב היתה לו לאשה ויעש הרע בעיני יהוה
    kjvRefs:
    - 2 Kings 8:18
    kjvOsis:
    - 2Kgs.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.19
    scripture: tanakh
    name: Tanakh 2 Kings 8:19
    ref: 2 Kings 8:19
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 19
    ordinal: 9658
    text: Howbeit the LORD would not destroy Judah, for David His servant’s sake, as He promised him to give unto him a lamp and to his children alway.
    translation: JPS 1917
    original: וְלֹא־אָבָה יְהוָה לְהַשְׁחִית אֶת־יְהוּדָה לְמַעַן דָּוִד עַבְדּוֹ כַּאֲשֶׁר אָמַר־לוֹ לָתֵת לוֹ נִיר לְבָנָיו כָּל־הַיָּמִים׃
    hebrewPlain: ולא אבה יהוה להשחית את יהודה למען דוד עבדו כאשר אמר לו לתת לו ניר לבניו כל הימים
    kjvRefs:
    - 2 Kings 8:19
    kjvOsis:
    - 2Kgs.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.20
    scripture: tanakh
    name: Tanakh 2 Kings 8:20
    ref: 2 Kings 8:20
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 20
    ordinal: 9659
    text: In his days Edom revolted from under the hand of Judah, and made a king over themselves.
    translation: JPS 1917
    original: בְּיָמָיו פָּשַׁע אֱדוֹם מִתַּחַת יַד־יְהוּדָה וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ׃
    hebrewPlain: בימיו פשע אדום מתחת יד יהודה וימלכו עליהם מלך
    kjvRefs:
    - 2 Kings 8:20
    kjvOsis:
    - 2Kgs.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.21
    scripture: tanakh
    name: Tanakh 2 Kings 8:21
    ref: 2 Kings 8:21
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 21
    ordinal: 9660
    text: Then Joram passed over to Zair, and all his chariots with him; and he rose up by night, and smote the Edomites that compassed him about, and the captains of the chariots; and the people fled to their tents.
    translation: JPS 1917
    original: וַיַּעֲבֹר יוֹרָם צָעִירָה וְכָל־הָרֶכֶב עִמּוֹ וַיְהִי־הוּא קָם לַיְלָה וַיַּכֶּה אֶת־אֱדוֹם הַסֹּבֵיב אֵלָיו וְאֵת שָׂרֵי הָרֶכֶב וַיָּנָס הָעָם לְאֹהָלָיו׃
    hebrewPlain: ויעבר יורם צעירה וכל הרכב עמו ויהי הוא קם לילה ויכה את אדום הסביב אליו ואת שרי הרכב וינס העם לאהליו
    kjvRefs:
    - 2 Kings 8:21
    kjvOsis:
    - 2Kgs.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.22
    scripture: tanakh
    name: Tanakh 2 Kings 8:22
    ref: 2 Kings 8:22
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 22
    ordinal: 9661
    text: Yet Edom revolted from under the hand of Judah, unto this day. Then did Libnah revolt at the same time.
    translation: JPS 1917
    original: וַיִּפְשַׁע אֱדוֹם מִתַּחַת יַד־יְהוּדָה עַד הַיּוֹם הַזֶּה אָז תִּפְשַׁע לִבְנָה בָּעֵת הַהִיא׃
    hebrewPlain: ויפשע אדום מתחת יד יהודה עד היום הזה אז תפשע לבנה בעת ההיא
    kjvRefs:
    - 2 Kings 8:22
    kjvOsis:
    - 2Kgs.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.23
    scripture: tanakh
    name: Tanakh 2 Kings 8:23
    ref: 2 Kings 8:23
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 23
    ordinal: 9662
    text: And the rest of the acts of Joram, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יוֹרָם וְכָל־אֲשֶׁר עָשָׂה הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי יורם וכל אשר עשה הלוא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 8:23
    kjvOsis:
    - 2Kgs.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.24
    scripture: tanakh
    name: Tanakh 2 Kings 8:24
    ref: 2 Kings 8:24
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 24
    ordinal: 9663
    text: And Joram slept with his fathers, and was buried with his fathers in the city of David; and Ahaziah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יוֹרָם עִם־אֲבֹתָיו וַיִּקָּבֵר עִם־אֲבֹתָיו בְּעִיר דָּוִד וַיִּמְלֹךְ אֲחַזְיָהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יורם עם אבתיו ויקבר עם אבתיו בעיר דוד וימלך אחזיהו בנו תחתיו
    kjvRefs:
    - 2 Kings 8:24
    kjvOsis:
    - 2Kgs.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.25
    scripture: tanakh
    name: Tanakh 2 Kings 8:25
    ref: 2 Kings 8:25
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 25
    ordinal: 9664
    text: In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁתֵּים־עֶשְׂרֵה שָׁנָה לְיוֹרָם בֶּן־אַחְאָב מֶלֶךְ יִשְׂרָאֵל מָלַךְ אֲחַזְיָהוּ בֶן־יְהוֹרָם מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת שתים עשרה שנה ליורם בן אחאב מלך ישראל מלך אחזיהו בן יהורם מלך יהודה
    kjvRefs:
    - 2 Kings 8:25
    kjvOsis:
    - 2Kgs.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.26
    scripture: tanakh
    name: Tanakh 2 Kings 8:26
    ref: 2 Kings 8:26
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 26
    ordinal: 9665
    text: Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother’s name was Athaliah the daughter of Omri king of Israel.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וּשְׁתַּיִם שָׁנָה אֲחַזְיָהוּ בְמָלְכוֹ וְשָׁנָה אַחַת מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ עֲתַלְיָהוּ בַּת־עָמְרִי מֶלֶךְ יִשְׂרָאֵל׃
    hebrewPlain: בן עשרים ושתים שנה אחזיהו במלכו ושנה אחת מלך בירושלם ושם אמו עתליהו בת עמרי מלך ישראל
    kjvRefs:
    - 2 Kings 8:26
    kjvOsis:
    - 2Kgs.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.27
    scripture: tanakh
    name: Tanakh 2 Kings 8:27
    ref: 2 Kings 8:27
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 27
    ordinal: 9666
    text: And he walked in the way of the house of Ahab, and did that which was evil in the sight of the LORD, as did the house of Ahab; for he was the son-in-law of the house of Ahab.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדֶרֶךְ בֵּית אַחְאָב וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּבֵית אַחְאָב כִּי חֲתַן בֵּית־אַחְאָב הוּא׃
    hebrewPlain: וילך בדרך בית אחאב ויעש הרע בעיני יהוה כבית אחאב כי חתן בית אחאב הוא
    kjvRefs:
    - 2 Kings 8:27
    kjvOsis:
    - 2Kgs.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.28
    scripture: tanakh
    name: Tanakh 2 Kings 8:28
    ref: 2 Kings 8:28
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 28
    ordinal: 9667
    text: And he went with Joram the son of Ahab to war against Hazael king of Aram at Ramoth-gilead; and the Arameans wounded Joram.
    translation: JPS 1917
    original: וַיֵּלֶךְ אֶת־יוֹרָם בֶּן־אַחְאָב לַמִּלְחָמָה עִם־חֲזָהאֵל מֶלֶךְ־אֲרָם בְּרָמֹת גִּלְעָד וַיַּכּוּ אֲרַמִּים אֶת־יוֹרָם׃
    hebrewPlain: וילך את יורם בן אחאב למלחמה עם חזהאל מלך ארם ברמת גלעד ויכו ארמים את יורם
    kjvRefs:
    - 2 Kings 8:28
    kjvOsis:
    - 2Kgs.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.29
    scripture: tanakh
    name: Tanakh 2 Kings 8:29
    ref: 2 Kings 8:29
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 29
    ordinal: 9668
    text: And king Joram returned to be healed in Jezreel of the wounds which the Arameans had given him at Ramah, when he fought against Hazael king of Aram. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick.
    translation: JPS 1917
    original: וַיָּשָׁב יוֹרָם הַמֶּלֶךְ לְהִתְרַפֵּא בְיִזְרְעֶאל מִן־הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים בָּרָמָה בְּהִלָּחֲמוֹ אֶת־חֲזָהאֵל מֶלֶךְ אֲרָם וַאֲחַזְיָהוּ בֶן־יְהוֹרָם מֶלֶךְ יְהוּדָה יָרַד לִרְאוֹת אֶת־יוֹרָם בֶּן־אַחְאָב בְּיִזְרְעֶאל כִּי־חֹלֶה הוּא׃
    hebrewPlain: וישב יורם המלך להתרפא ביזרעאל מן המכים אשר יכהו ארמים ברמה בהלחמו את חזהאל מלך ארם ואחזיהו בן יהורם מלך יהודה ירד לראות את יורם בן אחאב ביזרעאל כי חלה הוא
    kjvRefs:
    - 2 Kings 8:29
    kjvOsis:
    - 2Kgs.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.9.1
    scripture: tanakh
    name: Tanakh 2 Kings 9:1
    ref: 2 Kings 9:1
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 1
    ordinal: 9669
    text: 'And Elisha the prophet called one of the sons of the prophets, and said unto him: ‘Gird up thy loins, and take this vial of oil in thy hand, and go to Ramoth-gilead.'
    translation: JPS 1917
    original: וֶאֱלִישָׁע הַנָּבִיא קָרָא לְאַחַד מִבְּנֵי הַנְּבִיאִים וַיֹּאמֶר לוֹ חֲגֹר מָתְנֶיךָ וְקַח פַּךְ הַשֶּׁמֶן הַזֶּה בְּיָדֶךָ וְלֵךְ רָמֹת גִּלְעָד׃
    hebrewPlain: ואלישע הנביא קרא לאחד מבני הנביאים ויאמר לו חגר מתניך וקח פך השמן הזה בידך ולך רמת גלעד
    kjvRefs:
    - 2 Kings 9:1
    kjvOsis:
    - 2Kgs.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.2
    scripture: tanakh
    name: Tanakh 2 Kings 9:2
    ref: 2 Kings 9:2
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 2
    ordinal: 9670
    text: And when thou comest thither, look out there Jehu the son of Jehoshaphat the son of Nimshi, and go in, and make him arise up from among his brethren, and carry him to an inner chamber.
    translation: JPS 1917
    original: וּבָאתָ שָׁמָּה וּרְאֵה־שָׁם יֵהוּא בֶן־יְהוֹשָׁפָט בֶּן־נִמְשִׁי וּבָאתָ וַהֲקֵמֹתוֹ מִתּוֹך אֶחָיו וְהֵבֵיאתָ אֹתוֹ חֶדֶר בְּחָדֶר׃
    hebrewPlain: ובאת שמה וראה שם יהוא בן יהושפט בן נמשי ובאת והקמתו מתוך אחיו והביאת אתו חדר בחדר
    kjvRefs:
    - 2 Kings 9:2
    kjvOsis:
    - 2Kgs.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.3
    scripture: tanakh
    name: Tanakh 2 Kings 9:3
    ref: 2 Kings 9:3
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 3
    ordinal: 9671
    text: 'Then take the vial of oil, and pour it on his head, and say: Thus saith the LORD: I have anointed thee king over Israel. Then open the door, and flee, and tarry not.’'
    translation: JPS 1917
    original: וְלָקַחְתָּ פַךְ־הַשֶּׁמֶן וְיָצַקְתָּ עַל־רֹאשׁוֹ וְאָמַרְתָּ כֹּה־אָמַר יְהוָה מְשַׁחְתִּיךָ לְמֶלֶךְ אֶל־יִשְׂרָאֵל וּפָתַחְתָּ הַדֶּלֶת וְנַסְתָּה וְלֹא תְחַכֶּה׃
    hebrewPlain: ולקחת פך השמן ויצקת על ראשו ואמרת כה אמר יהוה משחתיך למלך אל ישראל ופתחת הדלת ונסתה ולא תחכה
    kjvRefs:
    - 2 Kings 9:3
    kjvOsis:
    - 2Kgs.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.4
    scripture: tanakh
    name: Tanakh 2 Kings 9:4
    ref: 2 Kings 9:4
    book: 2Kgs
