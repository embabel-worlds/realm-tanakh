    name: Tanakh 2 Kings 21:25
    ref: 2 Kings 21:25
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 25
    ordinal: 10056
    text: Now the rest of the acts of Amon which he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אָמוֹן אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי אמון אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
