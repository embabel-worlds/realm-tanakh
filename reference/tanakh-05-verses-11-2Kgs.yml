  data:
    osis: 2Kgs.4.16
    scripture: tanakh
    name: Tanakh 2 Kings 4:16
    ref: 2 Kings 4:16
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 16
    ordinal: 9531
    text: 'And he said: ‘At this season, when the time cometh round, thou shalt embrace a son.’ And she said: ‘Nay, my lord, thou man of God, do not lie unto thy handmaid.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה אתי [אַתְּ] חֹבֶקֶת בֵּן וַתֹּאמֶר אַל־אֲדֹנִי אִישׁ הָאֱלֹהִים אַל־תְּכַזֵּב בְּשִׁפְחָתֶךָ׃
    hebrewPlain: ויאמר למועד הזה כעת חיה אתי [את] חבקת בן ותאמר אל אדני איש האלהים אל תכזב בשפחתך
    kjvRefs:
    - 2 Kings 4:16
    kjvOsis:
    - 2Kgs.4.16
  relations:
  - predicate: IN
    to:
