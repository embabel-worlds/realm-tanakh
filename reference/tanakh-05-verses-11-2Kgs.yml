  data:
    osis: 2Kgs.11.13
    scripture: tanakh
    name: Tanakh 2 Kings 11:13
    ref: 2 Kings 11:13
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 13
    ordinal: 9754
    text: And when Athaliah heard the noise of the guard and of the people, she came to the people into the house of the LORD.
    translation: JPS 1917
    original: וַתִּשְׁמַע עֲתַלְיָה אֶת־קוֹל הָרָצִין הָעָם וַתָּבֹא אֶל־הָעָם בֵּית יְהוָה׃
    hebrewPlain: ותשמע עתליה את קול הרצין העם ותבא אל העם בית יהוה
    kjvRefs:
    - 2 Kings 11:13
    kjvOsis:
    - 2Kgs.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.14
    scripture: tanakh
    name: Tanakh 2 Kings 11:14
    ref: 2 Kings 11:14
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 14
    ordinal: 9755
    text: 'And she looked, and, behold, the king stood on the platform, as the manner was, and the captains and the trumpets by the king; and all the people of the land rejoiced, and blew with trumpets. Then Athaliah rent her clothes, and cried: ‘Treason, treason.’'
    translation: JPS 1917
    original: וַתֵּרֶא וְהִנֵּה הַמֶּלֶךְ עֹמֵד עַל־הָעַמּוּד כַּמִּשְׁפָּט וְהַשָּׂרִים וְהַחֲצֹצְרוֹת אֶל־הַמֶּלֶךְ וְכָל־עַם הָאָרֶץ שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת וַתִּקְרַע עֲתַלְיָה אֶת־בְּגָדֶיהָ וַתִּקְרָא קֶשֶׁר קָשֶׁר׃
    hebrewPlain: ותרא והנה המלך עמד על העמוד כמשפט והשרים והחצצרות אל המלך וכל עם הארץ שמח ותקע בחצצרות ותקרע עתליה את בגדיה ותקרא קשר קשר
    kjvRefs:
    - 2 Kings 11:14
    kjvOsis:
    - 2Kgs.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.15
    scripture: tanakh
    name: Tanakh 2 Kings 11:15
    ref: 2 Kings 11:15
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 15
    ordinal: 9756
    text: 'And Jehoiada the priest commanded the captains of hundreds, the officers of the host, and said unto them: ‘Have her forth between the ranks; and him that followeth her slay with the sword’; for the priest said: ‘Let her not be slain in the house of the LORD.’'
    translation: JPS 1917
    original: וַיְצַו יְהוֹיָדָע הַכֹּהֵן אֶת־שָׂרֵי המיאות [הַמֵּאוֹת ] פְּקֻדֵי הַחַיִל וַיֹּאמֶר אֲלֵיהֶם הוֹצִיאוּ אֹתָהּ אֶל־מִבֵּית לַשְּׂדֵרֹת וְהַבָּא אַחֲרֶיהָ הָמֵת בֶּחָרֶב כִּי אָמַר הַכֹּהֵן אַל־תּוּמַת בֵּית יְהוָה׃
    hebrewPlain: ויצו יהוידע הכהן את שרי המיאות [המאות ] פקדי החיל ויאמר אליהם הוציאו אתה אל מבית לשדרת והבא אחריה המת בחרב כי אמר הכהן אל תומת בית יהוה
    kjvRefs:
    - 2 Kings 11:15
    kjvOsis:
    - 2Kgs.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.16
    scripture: tanakh
    name: Tanakh 2 Kings 11:16
    ref: 2 Kings 11:16
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 16
    ordinal: 9757
    text: So they made way for her; and she went by the way of the horses’ entry to the king’s house; and there was she slain.
    translation: JPS 1917
    original: וַיָּשִׂמוּ לָהּ יָדַיִם וַתָּבוֹא דֶּרֶךְ־מְבוֹא הַסּוּסִים בֵּית הַמֶּלֶךְ וַתּוּמַת שָׁם׃
    hebrewPlain: וישמו לה ידים ותבוא דרך מבוא הסוסים בית המלך ותומת שם
    kjvRefs:
    - 2 Kings 11:16
    kjvOsis:
    - 2Kgs.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.17
    scripture: tanakh
    name: Tanakh 2 Kings 11:17
    ref: 2 Kings 11:17
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 17
    ordinal: 9758
    text: And Jehoiada made a covenant between the LORD and the king and the people, that they should be the LORD’S people; between the king also and the people.
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוֹיָדָע אֶת־הַבְּרִית בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם לִהְיוֹת לְעָם לַיהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם׃
    hebrewPlain: ויכרת יהוידע את הברית בין יהוה ובין המלך ובין העם להיות לעם ליהוה ובין המלך ובין העם
    kjvRefs:
    - 2 Kings 11:17
    kjvOsis:
    - 2Kgs.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.18
    scripture: tanakh
    name: Tanakh 2 Kings 11:18
    ref: 2 Kings 11:18
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 18
    ordinal: 9759
    text: And all the people of the land went to the house of Baal, and broke it down; his altars and his images broke they in pieces thoroughly, and slew Mattan the priest of Baal before the altars. And the priest appointed officers over the house of the LORD.
    translation: JPS 1917
    original: וַיָּבֹאוּ כָל־עַם הָאָרֶץ בֵּית־הַבַּעַל וַיִּתְּצֻהוּ אֶת־מזבחתו [מִזְבְּחֹתָיו] וְאֶת־צְלָמָיו שִׁבְּרוּ הֵיטֵב וְאֵת מַתָּן כֹּהֵן הַבַּעַל הָרְגוּ לִפְנֵי הַמִּזְבְּחוֹת וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת עַל־בֵּית יְהוָה׃
    hebrewPlain: ויבאו כל עם הארץ בית הבעל ויתצהו את מזבחתו [מזבחתיו] ואת צלמיו שברו היטב ואת מתן כהן הבעל הרגו לפני המזבחות וישם הכהן פקדות על בית יהוה
    kjvRefs:
    - 2 Kings 11:18
    kjvOsis:
    - 2Kgs.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.19
    scripture: tanakh
    name: Tanakh 2 Kings 11:19
    ref: 2 Kings 11:19
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 19
    ordinal: 9760
    text: And he took the captains over hundreds, and the Carites, and the guard, and all the people of the land; and they brought down the king from the house of the LORD, and came by the way of the gate of the guard unto the king’s house. And he sat on the throne of the kings.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־שָׂרֵי הַמֵּאוֹת וְאֶת־הַכָּרִי וְאֶת־הָרָצִים וְאֵת כָּל־עַם הָאָרֶץ וַיֹּרִידוּ אֶת־הַמֶּלֶךְ מִבֵּית יְהוָה וַיָּבוֹאוּ דֶּרֶך־שַׁעַר הָרָצִים בֵּית הַמֶּלֶךְ וַיֵּשֶׁב עַל־כִּסֵּא הַמְּלָכִים׃
    hebrewPlain: ויקח את שרי המאות ואת הכרי ואת הרצים ואת כל עם הארץ וירידו את המלך מבית יהוה ויבואו דרך שער הרצים בית המלך וישב על כסא המלכים
    kjvRefs:
    - 2 Kings 11:19
    kjvOsis:
    - 2Kgs.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.20
    scripture: tanakh
    name: Tanakh 2 Kings 11:20
    ref: 2 Kings 11:20
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 20
    ordinal: 9761
    text: So all the people of the land rejoiced, and the city was quiet; and they slew Athaliah with the sword at the king’s house.
    translation: JPS 1917
    original: וַיִּשְׂמַח כָּל־עַם־הָאָרֶץ וְהָעִיר שָׁקָטָה וְאֶת־עֲתַלְיָהוּ הֵמִיתוּ בַחֶרֶב בֵּית מלך [הַמֶּלֶךְ׃]
    hebrewPlain: וישמח כל עם הארץ והעיר שקטה ואת עתליהו המיתו בחרב בית מלך [המלך]
    kjvRefs:
    - 2 Kings 11:20
    kjvOsis:
    - 2Kgs.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
