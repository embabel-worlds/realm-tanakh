  data:
    osis: 2Kgs.22.4
    scripture: tanakh
    name: Tanakh 2 Kings 22:4
    ref: 2 Kings 22:4
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 4
    ordinal: 10061
    text: ’Go up to Hilkiah the high priest, that he may sum the money which is brought into the house of the LORD, which the keepers of the door have gathered of the people;
    translation: JPS 1917
    original: עֲלֵה אֶל־חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל וְיַתֵּם אֶת־הַכֶּסֶף הַמּוּבָא בֵּית יְהוָה אֲשֶׁר אָסְפוּ שֹׁמְרֵי הַסַּף מֵאֵת הָעָם׃
    hebrewPlain: עלה אל חלקיהו הכהן הגדול ויתם את הכסף המובא בית יהוה אשר אספו שמרי הסף מאת העם
    kjvRefs:
