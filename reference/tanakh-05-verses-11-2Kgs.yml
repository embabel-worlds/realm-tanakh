- type: TanakhVerse
  data:
    osis: 2Kgs.9.37
    scripture: tanakh
    name: Tanakh 2 Kings 9:37
    ref: 2 Kings 9:37
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 37
    ordinal: 9705
    text: 'and the carcass of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; so that they shall not say: This is Jezebel.’'
    translation: JPS 1917
    original: והית [וְהָיְתָה] נִבְלַת אִיזֶבֶל כְּדֹמֶן עַל־פְּנֵי הַשָּׂדֶה בְּחֵלֶק יִזְרְעֶאל אֲשֶׁר לֹא־יֹאמְרוּ זֹאת אִיזָבֶל׃
    hebrewPlain: והית [והיתה] נבלת איזבל כדמן על פני השדה בחלק יזרעאל אשר לא יאמרו זאת איזבל
    kjvRefs:
    - 2 Kings 9:37
    kjvOsis:
    - 2Kgs.9.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.10.1
    scripture: tanakh
    name: Tanakh 2 Kings 10:1
    ref: 2 Kings 10:1
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 1
    ordinal: 9706
    text: 'Now Ahab had seventy sons in Samaria. And Jehu wrote letters, and sent to Samaria, unto the rulers of Jezreel, even the elders, and unto them that brought up [the sons of] Ahab, saying:'
    translation: JPS 1917
    original: וּלְאַחְאָב שִׁבְעִים בָּנִים בְּשֹׁמְרוֹן וַיִּכְתֹּב יֵהוּא סְפָרִים וַיִּשְׁלַח שֹׁמְרוֹן אֶל־שָׂרֵי יִזְרְעֶאל הַזְּקֵנִים וְאֶל־הָאֹמְנִים אַחְאָב לֵאמֹר׃
    hebrewPlain: ולאחאב שבעים בנים בשמרון ויכתב יהוא ספרים וישלח שמרון אל שרי יזרעאל הזקנים ואל האמנים אחאב לאמר
    kjvRefs:
    - 2 Kings 10:1
    kjvOsis:
    - 2Kgs.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.2
    scripture: tanakh
    name: Tanakh 2 Kings 10:2
    ref: 2 Kings 10:2
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 2
    ordinal: 9707
    text: ’And now as soon as this letter cometh to you, seeing your master’s sons are with you, and there are with you chariots and horses, fortified cities also, and armour;
    translation: JPS 1917
    original: וְעַתָּה כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם וְאִתְּכֶם בְּנֵי אֲדֹנֵיכֶם וְאִתְּכֶם הָרֶכֶב וְהַסּוּסִים וְעִיר מִבְצָר וְהַנָּשֶׁק׃
    hebrewPlain: ועתה כבא הספר הזה אליכם ואתכם בני אדניכם ואתכם הרכב והסוסים ועיר מבצר והנשק
    kjvRefs:
    - 2 Kings 10:2
    kjvOsis:
    - 2Kgs.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.3
    scripture: tanakh
    name: Tanakh 2 Kings 10:3
    ref: 2 Kings 10:3
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 3
    ordinal: 9708
    text: look ye out the best and meetest of your master’s sons, and set him on his father’s throne, and fight for your master’s house.’
    translation: JPS 1917
    original: וּרְאִיתֶם הַטּוֹב וְהַיָּשָׁר מִבְּנֵי אֲדֹנֵיכֶם וְשַׂמְתֶּם עַל־כִּסֵּא אָבִיו וְהִלָּחֲמוּ עַל־בֵּית אֲדֹנֵיכֶם׃
    hebrewPlain: וראיתם הטוב והישר מבני אדניכם ושמתם על כסא אביו והלחמו על בית אדניכם
    kjvRefs:
    - 2 Kings 10:3
    kjvOsis:
    - 2Kgs.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.4
    scripture: tanakh
    name: Tanakh 2 Kings 10:4
    ref: 2 Kings 10:4
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 4
    ordinal: 9709
    text: 'But they were exceedingly afraid, and said: ‘Behold, the two kings stood not before him; how then shall we stand?’'
    translation: JPS 1917
    original: וַיִּרְאוּ מְאֹד מְאֹד וַיֹּאמְרוּ הִנֵּה שְׁנֵי הַמְּלָכִים לֹא עָמְדוּ לְפָנָיו וְאֵיךְ נַעֲמֹד אֲנָחְנוּ׃
    hebrewPlain: ויראו מאד מאד ויאמרו הנה שני המלכים לא עמדו לפניו ואיך נעמד אנחנו
    kjvRefs:
    - 2 Kings 10:4
    kjvOsis:
    - 2Kgs.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.5
    scripture: tanakh
    name: Tanakh 2 Kings 10:5
    ref: 2 Kings 10:5
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 5
    ordinal: 9710
    text: 'And he that was over the household, and he that was over the city, the elders also, and they that brought up the children, sent to Jehu, saying: ‘We are thy servants, and will do all that thou shalt bid us; we will not make any man king; do thou that which is good in thine eyes.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֲשֶׁר־עַל־הַבַּיִת וַאֲשֶׁר עַל־הָעִיר וְהַזְּקֵנִים וְהָאֹמְנִים אֶל־יֵהוּא לֵאמֹר עֲבָדֶיךָ אֲנַחְנוּ וְכֹל אֲשֶׁר־תֹּאמַר אֵלֵינוּ נַעֲשֶׂה לֹא־נַמְלִיךְ אִישׁ הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה׃
    hebrewPlain: וישלח אשר על הבית ואשר על העיר והזקנים והאמנים אל יהוא לאמר עבדיך אנחנו וכל אשר תאמר אלינו נעשה לא נמליך איש הטוב בעיניך עשה
    kjvRefs:
    - 2 Kings 10:5
    kjvOsis:
    - 2Kgs.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.6
    scripture: tanakh
    name: Tanakh 2 Kings 10:6
    ref: 2 Kings 10:6
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 6
    ordinal: 9711
    text: 'Then he wrote a letter the second time to them, saying: ‘If ye be on my side, and if ye will hearken unto my voice, take ye the heads of the men your master’s sons, and come to me to Jezreel by to-morrow this time.’ Now the king’s sons, being seventy persons, were with the great men of the city, who brought them up.'
    translation: JPS 1917
    original: וַיִּכְתֹּב אֲלֵיהֶם סֵפֶר שֵׁנִית לֵאמֹר אִם־לִי אַתֶּם וּלְקֹלִי אַתֶּם שֹׁמְעִים קְחוּ אֶת־רָאשֵׁי אַנְשֵׁי בְנֵי־אֲדֹנֵיכֶם וּבֹאוּ אֵלַי כָּעֵת מָחָר יִזְרְעֶאלָה וּבְנֵי הַמֶּלֶךְ שִׁבְעִים אִישׁ אֶת־גְּדֹלֵי הָעִיר מְגַדְּלִים אוֹתָם׃
    hebrewPlain: ויכתב אליהם ספר שנית לאמר אם לי אתם ולקלי אתם שמעים קחו את ראשי אנשי בני אדניכם ובאו אלי כעת מחר יזרעאלה ובני המלך שבעים איש את גדלי העיר מגדלים אותם
    kjvRefs:
    - 2 Kings 10:6
    kjvOsis:
    - 2Kgs.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.7
    scripture: tanakh
    name: Tanakh 2 Kings 10:7
    ref: 2 Kings 10:7
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 7
    ordinal: 9712
    text: And it came to pass, when the letter came to them, that they took the king’s sons, and slew them, even seventy persons, and put their heads in baskets, and sent them unto him to Jezreel.
    translation: JPS 1917
    original: וַיְהִי כְּבֹא הַסֵּפֶר אֲלֵיהֶם וַיִּקְחוּ אֶת־בְּנֵי הַמֶּלֶךְ וַיִּשְׁחֲטוּ שִׁבְעִים אִישׁ וַיָּשִׂימוּ אֶת־רָאשֵׁיהֶם בַּדּוּדִים וַיִּשְׁלְחוּ אֵלָיו יִזְרְעֶאלָה׃
    hebrewPlain: ויהי כבא הספר אליהם ויקחו את בני המלך וישחטו שבעים איש וישימו את ראשיהם בדודים וישלחו אליו יזרעאלה
    kjvRefs:
    - 2 Kings 10:7
    kjvOsis:
    - 2Kgs.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.8
    scripture: tanakh
    name: Tanakh 2 Kings 10:8
    ref: 2 Kings 10:8
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 8
    ordinal: 9713
    text: 'And there came a messenger, and told him, saying: ‘They have brought the heads of the king’s sons.’ And he said: ‘Lay ye them in two heaps at the entrance of the gate until the morning.’'
    translation: JPS 1917
    original: וַיָּבֹא הַמַּלְאָךְ וַיַּגֶּד־לוֹ לֵאמֹר הֵבִיאוּ רָאשֵׁי בְנֵי־הַמֶּלֶךְ וַיֹּאמֶר שִׂימוּ אֹתָם שְׁנֵי צִבֻּרִים פֶּתַח הַשַּׁעַר עַד־הַבֹּקֶר׃
    hebrewPlain: ויבא המלאך ויגד לו לאמר הביאו ראשי בני המלך ויאמר שימו אתם שני צברים פתח השער עד הבקר
    kjvRefs:
    - 2 Kings 10:8
    kjvOsis:
    - 2Kgs.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.9
    scripture: tanakh
    name: Tanakh 2 Kings 10:9
    ref: 2 Kings 10:9
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 9
    ordinal: 9714
    text: 'And it came to pass in the morning, that he went out, and stood, and said to all the people: ‘Ye are righteous; behold, I conspired against my master, and slew him; but who smote all these?'
    translation: JPS 1917
    original: וַיְהִי בַבֹּקֶר וַיֵּצֵא וַיַּעֲמֹד וַיֹּאמֶר אֶל־כָּל־הָעָם צַדִּקִים אַתֶּם הִנֵּה אֲנִי קָשַׁרְתִּי עַל־אֲדֹנִי וָאֶהְרְגֵהוּ וּמִי הִכָּה אֶת־כָּל־אֵלֶּה׃
    hebrewPlain: ויהי בבקר ויצא ויעמד ויאמר אל כל העם צדקים אתם הנה אני קשרתי על אדני ואהרגהו ומי הכה את כל אלה
    kjvRefs:
    - 2 Kings 10:9
    kjvOsis:
    - 2Kgs.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.10
    scripture: tanakh
    name: Tanakh 2 Kings 10:10
    ref: 2 Kings 10:10
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 10
    ordinal: 9715
    text: Know now that there shall fall unto the earth nothing of the word of the LORD, which the LORD spoke concerning the house of Ahab; for the LORD hath done that which He spoke by His servant Elijah.’
    translation: JPS 1917
    original: דְּעוּ אֵפוֹא כִּי לֹא יִפֹּל מִדְּבַר יְהוָה אַרְצָה אֲשֶׁר־דִּבֶּר יְהוָה עַל־בֵּית אַחְאָב וַיהוָה עָשָׂה אֵת אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ אֵלִיָּהוּ׃
    hebrewPlain: דעו אפוא כי לא יפל מדבר יהוה ארצה אשר דבר יהוה על בית אחאב ויהוה עשה את אשר דבר ביד עבדו אליהו
    kjvRefs:
    - 2 Kings 10:10
    kjvOsis:
    - 2Kgs.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.11
    scripture: tanakh
    name: Tanakh 2 Kings 10:11
    ref: 2 Kings 10:11
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 11
    ordinal: 9716
    text: So Jehu smote all that remained of the house of Ahab in Jezreel, and all his great men, and his familiar friends, and his priests, until there was left him none remaining.
    translation: JPS 1917
    original: וַיַּךְ יֵהוּא אֵת כָּל־הַנִּשְׁאָרִים לְבֵית־אַחְאָב בְּיִזְרְעֶאל וְכָל־גְּדֹלָיו וּמְיֻדָּעָיו וְכֹהֲנָיו עַד־בִּלְתִּי הִשְׁאִיר־לוֹ שָׂרִיד׃
    hebrewPlain: ויך יהוא את כל הנשארים לבית אחאב ביזרעאל וכל גדליו ומידעיו וכהניו עד בלתי השאיר לו שריד
    kjvRefs:
    - 2 Kings 10:11
    kjvOsis:
    - 2Kgs.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.12
    scripture: tanakh
    name: Tanakh 2 Kings 10:12
    ref: 2 Kings 10:12
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 12
    ordinal: 9717
    text: And he arose and departed, and went to Samaria. And as he was at the shearing-house of the shepherds in the way,
    translation: JPS 1917
    original: וַיָּקָם וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן הוּא בֵּית־עֵקֶד הָרֹעִים בַּדָּרֶךְ׃
    hebrewPlain: ויקם ויבא וילך שמרון הוא בית עקד הרעים בדרך
    kjvRefs:
    - 2 Kings 10:12
    kjvOsis:
    - 2Kgs.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.13
    scripture: tanakh
    name: Tanakh 2 Kings 10:13
    ref: 2 Kings 10:13
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 13
    ordinal: 9718
    text: 'Jehu met with the brethren of Ahaziah king of Judah, and said: ‘Who are ye?’ And they answered: ‘We are the brethren of Ahaziah; and we go down to salute the children of the king and the children of the queen.’'
    translation: JPS 1917
    original: וְיֵהוּא מָצָא אֶת־אֲחֵי אֲחַזְיָהוּ מֶלֶךְ־יְהוּדָה וַיֹּאמֶר מִי אַתֶּם וַיֹּאמְרוּ אֲחֵי אֲחַזְיָהוּ אֲנַחְנוּ וַנֵּרֶד לִשְׁלוֹם בְּנֵי־הַמֶּלֶךְ וּבְנֵי הַגְּבִירָה׃
    hebrewPlain: ויהוא מצא את אחי אחזיהו מלך יהודה ויאמר מי אתם ויאמרו אחי אחזיהו אנחנו ונרד לשלום בני המלך ובני הגבירה
    kjvRefs:
    - 2 Kings 10:13
    kjvOsis:
    - 2Kgs.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.14
    scripture: tanakh
    name: Tanakh 2 Kings 10:14
    ref: 2 Kings 10:14
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 14
    ordinal: 9719
    text: 'And he said: ‘Take them alive.’ And they took them alive, and slew them at the pit of the shearing-house, even two and forty men; neither left he any of them.'
    translation: JPS 1917
    original: וַיֹּאמֶר תִּפְשׂוּם חַיִּים וַיִּתְפְּשׂוּם חַיִּים וַיִּשְׁחָטוּם אֶל־בּוֹר בֵּית־עֵקֶד אַרְבָּעִים וּשְׁנַיִם אִישׁ וְלֹא־הִשְׁאִיר אִישׁ מֵהֶם׃
    hebrewPlain: ויאמר תפשום חיים ויתפשום חיים וישחטום אל בור בית עקד ארבעים ושנים איש ולא השאיר איש מהם
    kjvRefs:
    - 2 Kings 10:14
    kjvOsis:
    - 2Kgs.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.15
    scripture: tanakh
    name: Tanakh 2 Kings 10:15
    ref: 2 Kings 10:15
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 15
    ordinal: 9720
    text: 'And when he was departed thence, he lighted on Jehonadab the son of Rechab coming to meet him; and he saluted him, and said to him: ‘Is thy heart right, as my heart is with thy heart?’ And Jehonadab answered: ‘It is.’ ''If it be,'' [said Jehu,] ''give me thy hand.’ And he gave him his hand; and he took him up to him into the chariot. .'
    translation: JPS 1917
    original: וַיֵּלֶךְ מִשָּׁם וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב לִקְרָאתוֹ וַיְבָרְכֵהוּ וַיֹּאמֶר אֵלָיו הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ וַיֹּאמֶר יְהוֹנָדָב יֵשׁ וָיֵשׁ תְּנָה אֶת־יָדֶךָ וַיִּתֵּן יָדוֹ וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה׃
    hebrewPlain: וילך משם וימצא את יהונדב בן רכב לקראתו ויברכהו ויאמר אליו היש את לבבך ישר כאשר לבבי עם לבבך ויאמר יהונדב יש ויש תנה את ידך ויתן ידו ויעלהו אליו אל המרכבה
    kjvRefs:
    - 2 Kings 10:15
    kjvOsis:
    - 2Kgs.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.16
    scripture: tanakh
    name: Tanakh 2 Kings 10:16
    ref: 2 Kings 10:16
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 16
    ordinal: 9721
    text: 'And he said: ‘Come with me, and see my zeal for the LORD.’ So they made him ride in his chariot.'
    translation: JPS 1917
    original: וַיֹּאמֶר לְכָה אִתִּי וּרְאֵה בְּקִנְאָתִי לַיהוָה וַיַּרְכִּבוּ אֹתוֹ בְּרִכְבּוֹ׃
    hebrewPlain: ויאמר לכה אתי וראה בקנאתי ליהוה וירכבו אתו ברכבו
    kjvRefs:
    - 2 Kings 10:16
    kjvOsis:
    - 2Kgs.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.17
    scripture: tanakh
    name: Tanakh 2 Kings 10:17
    ref: 2 Kings 10:17
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 17
    ordinal: 9722
    text: And when he came to Samaria, he smote all that remained unto Ahab in Samaria, till he had destroyed him, according to the word of the LORD, which He spoke to Elijah.
    translation: JPS 1917
    original: וַיָּבֹא שֹׁמְרוֹן וַיַּךְ אֶת־כָּל־הַנִּשְׁאָרִים לְאַחְאָב בְּשֹׁמְרוֹן עַד־הִשְׁמִידוֹ כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר אֶל־אֵלִיָּהוּ׃
    hebrewPlain: ויבא שמרון ויך את כל הנשארים לאחאב בשמרון עד השמידו כדבר יהוה אשר דבר אל אליהו
    kjvRefs:
    - 2 Kings 10:17
    kjvOsis:
    - 2Kgs.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.18
    scripture: tanakh
    name: Tanakh 2 Kings 10:18
    ref: 2 Kings 10:18
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 18
    ordinal: 9723
    text: 'And Jehu gathered all the people together, and said unto them: ‘Ahab served Baal a little; but Jehu will serve him much.'
    translation: JPS 1917
    original: וַיִּקְבֹּץ יֵהוּא אֶת־כָּל־הָעָם וַיֹּאמֶר אֲלֵהֶם אַחְאָב עָבַד אֶת־הַבַּעַל מְעָט יֵהוּא יַעַבְדֶנּוּ הַרְבֵּה׃
    hebrewPlain: ויקבץ יהוא את כל העם ויאמר אלהם אחאב עבד את הבעל מעט יהוא יעבדנו הרבה
    kjvRefs:
    - 2 Kings 10:18
    kjvOsis:
    - 2Kgs.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.19
    scripture: tanakh
    name: Tanakh 2 Kings 10:19
    ref: 2 Kings 10:19
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 19
    ordinal: 9724
    text: Now therefore call unto me all the prophets of Baal, all his worshippers, and all his priests, let none be wanting; for I have a great sacrifice to do to Baal; whosoever shall be wanting, he shall not live.’ But Jehu did it in subtlety, to the intent that he might destroy the worshippers of Baal.
    translation: JPS 1917
    original: וְעַתָּה כָל־נְבִיאֵי הַבַּעַל כָּל־עֹבְדָיו וְכָל־כֹּהֲנָיו קִרְאוּ אֵלַי אִישׁ אַל־יִפָּקֵד כִּי זֶבַח גָּדוֹל לִי לַבַּעַל כֹּל אֲשֶׁר־יִפָּקֵד לֹא יִחְיֶה וְיֵהוּא עָשָׂה בְעָקְבָּה לְמַעַן הַאֲבִיד אֶת־עֹבְדֵי הַבָּעַל׃
    hebrewPlain: ועתה כל נביאי הבעל כל עבדיו וכל כהניו קראו אלי איש אל יפקד כי זבח גדול לי לבעל כל אשר יפקד לא יחיה ויהוא עשה בעקבה למען האביד את עבדי הבעל
    kjvRefs:
    - 2 Kings 10:19
    kjvOsis:
    - 2Kgs.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.20
    scripture: tanakh
    name: Tanakh 2 Kings 10:20
    ref: 2 Kings 10:20
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 20
    ordinal: 9725
    text: 'And Jehu said: ‘Sanctify a solemn assembly for Baal.’ And they proclaimed it.'
    translation: JPS 1917
    original: וַיֹּאמֶר יֵהוּא קַדְּשׁוּ עֲצָרָה לַבַּעַל וַיִּקְרָאוּ׃
    hebrewPlain: ויאמר יהוא קדשו עצרה לבעל ויקראו
    kjvRefs:
    - 2 Kings 10:20
    kjvOsis:
    - 2Kgs.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.21
    scripture: tanakh
    name: Tanakh 2 Kings 10:21
    ref: 2 Kings 10:21
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 21
    ordinal: 9726
    text: And Jehu sent through all Israel; and all the worshippers of Baal came, so that there was not a man left that came not. And they came into the house of Baal; and the house of Baal was filled from one end to another.
    translation: JPS 1917
    original: וַיִּשְׁלַח יֵהוּא בְּכָל־יִשְׂרָאֵל וַיָּבֹאוּ כָּל־עֹבְדֵי הַבַּעַל וְלֹא־נִשְׁאַר אִישׁ אֲשֶׁר לֹא־בָא וַיָּבֹאוּ בֵּית הַבַּעַל וַיִּמָּלֵא בֵית־הַבַּעַל פֶּה לָפֶה׃
    hebrewPlain: וישלח יהוא בכל ישראל ויבאו כל עבדי הבעל ולא נשאר איש אשר לא בא ויבאו בית הבעל וימלא בית הבעל פה לפה
    kjvRefs:
    - 2 Kings 10:21
    kjvOsis:
    - 2Kgs.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.22
    scripture: tanakh
    name: Tanakh 2 Kings 10:22
    ref: 2 Kings 10:22
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 22
    ordinal: 9727
    text: 'And he said unto him that was over the vestry: ‘Bring forth vestments for all the worshippers of Baal.’ And he brought them forth vestments.'
    translation: JPS 1917
    original: וַיֹּאמֶר לַאֲשֶׁר עַל־הַמֶּלְתָּחָה הוֹצֵא לְבוּשׁ לְכֹל עֹבְדֵי הַבָּעַל וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ׃
    hebrewPlain: ויאמר לאשר על המלתחה הוצא לבוש לכל עבדי הבעל ויצא להם המלבוש
    kjvRefs:
    - 2 Kings 10:22
    kjvOsis:
    - 2Kgs.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.23
    scripture: tanakh
    name: Tanakh 2 Kings 10:23
    ref: 2 Kings 10:23
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 23
    ordinal: 9728
    text: 'And Jehu went, and Jehonadab the son of Rechab, into the house of Baal; and he said unto the worshippers of Baal: ‘Search, and look that there be here with you none of the servants of the LORD, but the worshippers of Baal only.’'
    translation: JPS 1917
    original: וַיָּבֹא יֵהוּא וִיהוֹנָדָב בֶּן־רֵכָב בֵּית הַבָּעַל וַיֹּאמֶר לְעֹבְדֵי הַבַּעַל חַפְּשׂוּ וּרְאוּ פֶּן־יֶשׁ־פֹּה עִמָּכֶם מֵעַבְדֵי יְהוָה כִּי אִם־עֹבְדֵי הַבַּעַל לְבַדָּם׃
    hebrewPlain: ויבא יהוא ויהונדב בן רכב בית הבעל ויאמר לעבדי הבעל חפשו וראו פן יש פה עמכם מעבדי יהוה כי אם עבדי הבעל לבדם
    kjvRefs:
    - 2 Kings 10:23
    kjvOsis:
    - 2Kgs.10.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.24
    scripture: tanakh
    name: Tanakh 2 Kings 10:24
    ref: 2 Kings 10:24
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 24
    ordinal: 9729
    text: 'And they went in to offer sacrifices and burnt-offerings. Now Jehu had appointed him fourscore men without, and said: ‘If any of the men whom I bring into your hands escape, his life shall be for the life of him.’'
    translation: JPS 1917
    original: וַיָּבֹאוּ לַעֲשׂוֹת זְבָחִים וְעֹלוֹת וְיֵהוּא שָׂם־לוֹ בַחוּץ שְׁמֹנִים אִישׁ וַיֹּאמֶר הָאִישׁ אֲשֶׁר־יִמָּלֵט מִן־הָאֲנָשִׁים אֲשֶׁר אֲנִי מֵבִיא עַל־יְדֵיכֶם נַפְשׁוֹ תַּחַת נַפְשׁוֹ׃
    hebrewPlain: ויבאו לעשות זבחים ועלות ויהוא שם לו בחוץ שמנים איש ויאמר האיש אשר ימלט מן האנשים אשר אני מביא על ידיכם נפשו תחת נפשו
    kjvRefs:
    - 2 Kings 10:24
    kjvOsis:
    - 2Kgs.10.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.25
    scripture: tanakh
    name: Tanakh 2 Kings 10:25
    ref: 2 Kings 10:25
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 25
    ordinal: 9730
    text: 'And it came to pass, as soon as he had made an end of offering the burnt-offering, that Jehu said to the guard and to the captains: ‘Go in, and slay them; let none come forth.’ And they smote them with the edge of the sword; and the guard and the captains cast them out, and went to the city of the house of Baal.'
    translation: JPS 1917
    original: וַיְהִי כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה וַיֹּאמֶר יֵהוּא לָרָצִים וְלַשָּׁלִשִׁים בֹּאוּ הַכּוּם אִישׁ אַל־יֵצֵא וַיַּכּוּם לְפִי־חָרֶב וַיַּשְׁלִכוּ הָרָצִים וְהַשָּׁלִשִׁים וַיֵּלְכוּ עַד־עִיר בֵּית־הַבָּעַל׃
    hebrewPlain: ויהי ככלתו לעשות העלה ויאמר יהוא לרצים ולשלשים באו הכום איש אל יצא ויכום לפי חרב וישלכו הרצים והשלשים וילכו עד עיר בית הבעל
    kjvRefs:
    - 2 Kings 10:25
    kjvOsis:
    - 2Kgs.10.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.26
    scripture: tanakh
    name: Tanakh 2 Kings 10:26
    ref: 2 Kings 10:26
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 26
    ordinal: 9731
    text: And they brought forth the pillars that were in the house of Baal, and burned them.
    translation: JPS 1917
    original: וַיֹּצִאוּ אֶת־מַצְּבוֹת בֵּית־הַבַּעַל וַיִּשְׂרְפוּהָ׃
    hebrewPlain: ויצאו את מצבות בית הבעל וישרפוה
    kjvRefs:
    - 2 Kings 10:26
    kjvOsis:
    - 2Kgs.10.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.27
    scripture: tanakh
    name: Tanakh 2 Kings 10:27
    ref: 2 Kings 10:27
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 27
    ordinal: 9732
    text: And they broke down the pillar of Baal, and broke down the house of Baal, and made it a draught-house, unto this day.
    translation: JPS 1917
    original: וַיִּתְּצוּ אֵת מַצְּבַת הַבָּעַל וַיִּתְּצוּ אֶת־בֵּית הַבַּעַל וַיְשִׂמֻהוּ למחראות [לְמוֹצָאוֹת] עַד־הַיּוֹם׃
    hebrewPlain: ויתצו את מצבת הבעל ויתצו את בית הבעל וישמהו למחראות [למוצאות] עד היום
    kjvRefs:
    - 2 Kings 10:27
    kjvOsis:
    - 2Kgs.10.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.28
    scripture: tanakh
    name: Tanakh 2 Kings 10:28
    ref: 2 Kings 10:28
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 28
    ordinal: 9733
    text: Thus Jehu destroyed Baal out of Israel.
    translation: JPS 1917
    original: וַיַּשְׁמֵד יֵהוּא אֶת־הַבַּעַל מִיִּשְׂרָאֵל׃
    hebrewPlain: וישמד יהוא את הבעל מישראל
    kjvRefs:
    - 2 Kings 10:28
    kjvOsis:
    - 2Kgs.10.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.29
    scripture: tanakh
    name: Tanakh 2 Kings 10:29
    ref: 2 Kings 10:29
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 29
    ordinal: 9734
    text: Howbeit from the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin, Jehu departed not from after them, the golden calves that were in Beth-el, and that were in Dan.
    translation: JPS 1917
    original: רַק חֲטָאֵי יָרָבְעָם בֶּן־נְבָט אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל לֹא־סָר יֵהוּא מֵאַחֲרֵיהֶם עֶגְלֵי הַזָּהָב אֲשֶׁר בֵּית־אֵל וַאֲשֶׁר בְּדָן׃
    hebrewPlain: רק חטאי ירבעם בן נבט אשר החטיא את ישראל לא סר יהוא מאחריהם עגלי הזהב אשר בית אל ואשר בדן
    kjvRefs:
    - 2 Kings 10:29
    kjvOsis:
    - 2Kgs.10.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.30
    scripture: tanakh
    name: Tanakh 2 Kings 10:30
    ref: 2 Kings 10:30
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 30
    ordinal: 9735
    text: 'And the LORD said unto Jehu: ‘Because thou hast done well in executing that which is right in Mine eyes, and hast done unto the house of Ahab according to all that was in My heart, thy sons of the fourth generation shall sit on the throne of Israel.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־יֵהוּא יַעַן אֲשֶׁר־הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי כְּכֹל אֲשֶׁר בִּלְבָבִי עָשִׂיתָ לְבֵית אַחְאָב בְּנֵי רְבִעִים יֵשְׁבוּ לְךָ עַל־כִּסֵּא יִשְׂרָאֵל׃
    hebrewPlain: ויאמר יהוה אל יהוא יען אשר הטיבת לעשות הישר בעיני ככל אשר בלבבי עשית לבית אחאב בני רבעים ישבו לך על כסא ישראל
    kjvRefs:
    - 2 Kings 10:30
    kjvOsis:
    - 2Kgs.10.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.31
    scripture: tanakh
    name: Tanakh 2 Kings 10:31
    ref: 2 Kings 10:31
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 31
    ordinal: 9736
    text: But Jehu took no heed to walk in the law of the LORD, the God of Israel, with all his heart; he departed not from the sins of Jeroboam, wherewith he made Israel to sin.
    translation: JPS 1917
    original: וְיֵהוּא לֹא שָׁמַר לָלֶכֶת בְּתוֹרַת־יְהוָה אֱלֹהֵי־יִשְׂרָאֵל בְּכָל־לְבָבוֹ לֹא סָר מֵעַל חַטֹּאות יָרָבְעָם אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל׃
    hebrewPlain: ויהוא לא שמר ללכת בתורת יהוה אלהי ישראל בכל לבבו לא סר מעל חטאות ירבעם אשר החטיא את ישראל
    kjvRefs:
    - 2 Kings 10:31
    kjvOsis:
    - 2Kgs.10.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.32
    scripture: tanakh
    name: Tanakh 2 Kings 10:32
    ref: 2 Kings 10:32
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 32
    ordinal: 9737
    text: 'In those days the LORD began to cut Israel short; and Hazael smote them in all the borders of Israel:'
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם הֵחֵל יְהוָה לְקַצּוֹת בְּיִשְׂרָאֵל וַיַּכֵּם חֲזָאֵל בְּכָל־גְּבוּל יִשְׂרָאֵל׃
    hebrewPlain: בימים ההם החל יהוה לקצות בישראל ויכם חזאל בכל גבול ישראל
    kjvRefs:
    - 2 Kings 10:32
    kjvOsis:
    - 2Kgs.10.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.33
    scripture: tanakh
    name: Tanakh 2 Kings 10:33
    ref: 2 Kings 10:33
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 33
    ordinal: 9738
    text: from the Jordan eastward, all the land of Gilead, the Gadites, and the Reubenites, and the Manassites, from Aroer, which is by the valley of Arnon, even Gilead and Bashan.
    translation: JPS 1917
    original: מִן־הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ אֵת כָּל־אֶרֶץ הַגִּלְעָד הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי מֵעֲרֹעֵר אֲשֶׁר עַל־נַחַל אַרְנֹן וְהַגִּלְעָד וְהַבָּשָׁן׃
    hebrewPlain: מן הירדן מזרח השמש את כל ארץ הגלעד הגדי והראובני והמנשי מערער אשר על נחל ארנן והגלעד והבשן
    kjvRefs:
    - 2 Kings 10:33
    kjvOsis:
    - 2Kgs.10.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.34
    scripture: tanakh
    name: Tanakh 2 Kings 10:34
    ref: 2 Kings 10:34
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 34
    ordinal: 9739
    text: Now the rest of the acts of Jehu, and all that he did, and all his might, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יֵהוּא וְכָל־אֲשֶׁר עָשָׂה וְכָל־גְּבוּרָתוֹ הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יהוא וכל אשר עשה וכל גבורתו הלוא הם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 10:34
    kjvOsis:
    - 2Kgs.10.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.35
    scripture: tanakh
    name: Tanakh 2 Kings 10:35
    ref: 2 Kings 10:35
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 35
    ordinal: 9740
    text: And Jehu slept with his fathers; and they buried him in Samaria. And Jehoahaz his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יֵהוּא עִם־אֲבֹתָיו וַיִּקְבְּרוּ אֹתוֹ בְּשֹׁמְרוֹן וַיִּמְלֹךְ יְהוֹאָחָז בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יהוא עם אבתיו ויקברו אתו בשמרון וימלך יהואחז בנו תחתיו
    kjvRefs:
    - 2 Kings 10:35
    kjvOsis:
    - 2Kgs.10.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.10.36
    scripture: tanakh
    name: Tanakh 2 Kings 10:36
    ref: 2 Kings 10:36
    book: 2Kgs
    section: neviim
    chapter: 10
    verse: 36
    ordinal: 9741
    text: And the time that Jehu reigned over Israel in Samaria was twenty and eight years.
    translation: JPS 1917
    original: וְהַיָּמִים אֲשֶׁר מָלַךְ יֵהוּא עַל־יִשְׂרָאֵל עֶשְׂרִים וּשְׁמֹנֶה־שָׁנָה בְּשֹׁמְרוֹן׃
    hebrewPlain: והימים אשר מלך יהוא על ישראל עשרים ושמנה שנה בשמרון
    kjvRefs:
    - 2 Kings 10:36
    kjvOsis:
    - 2Kgs.10.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.10
- type: TanakhVerse
  data:
    osis: 2Kgs.11.1
    scripture: tanakh
    name: Tanakh 2 Kings 11:1
    ref: 2 Kings 11:1
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 1
    ordinal: 9742
    text: Now when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal.
    translation: JPS 1917
    original: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ וראתה [רָאֲתָה] כִּי מֵת בְּנָהּ וַתָּקָם וַתְּאַבֵּד אֵת כָּל־זֶרַע הַמַּמְלָכָה׃
    hebrewPlain: ועתליה אם אחזיהו וראתה [ראתה] כי מת בנה ותקם ותאבד את כל זרע הממלכה
    kjvRefs:
    - 2 Kings 11:1
    kjvOsis:
    - 2Kgs.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.2
    scripture: tanakh
    name: Tanakh 2 Kings 11:2
    ref: 2 Kings 11:2
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 2
    ordinal: 9743
    text: But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him away from among the king’s sons that were slain, even him and his nurse, and put them in the bed-chamber; and they hid him from Athaliah, so that he was not slain.
    translation: JPS 1917
    original: וַתִּקַּח יְהוֹשֶׁבַע בַּת־הַמֶּלֶךְ־יוֹרָם אֲחוֹת אֲחַזְיָהוּ אֶת־יוֹאָשׁ בֶּן־אֲחַזְיָה וַתִּגְנֹב אֹתוֹ מִתּוֹךְ בְּנֵי־הַמֶּלֶךְ הממותתים [הַמּוּמָתִים] אֹתוֹ וְאֶת־מֵינִקְתּוֹ בַּחֲדַר הַמִּטּוֹת וַיַּסְתִּרוּ אֹתוֹ מִפְּנֵי עֲתַלְיָהוּ וְלֹא הוּמָת׃
    hebrewPlain: ותקח יהושבע בת המלך יורם אחות אחזיהו את יואש בן אחזיה ותגנב אתו מתוך בני המלך הממותתים [המומתים] אתו ואת מינקתו בחדר המטות ויסתרו אתו מפני עתליהו ולא הומת
    kjvRefs:
    - 2 Kings 11:2
    kjvOsis:
    - 2Kgs.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.3
    scripture: tanakh
    name: Tanakh 2 Kings 11:3
    ref: 2 Kings 11:3
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 3
    ordinal: 9744
    text: And he was with her hid in the house of the LORD six years; and Athaliah reigned over the land.
    translation: JPS 1917
    original: וַיְהִי אִתָּהּ בֵּית יְהוָה מִתְחַבֵּא שֵׁשׁ שָׁנִים וַעֲתַלְיָה מֹלֶכֶת עַל־הָאָרֶץ׃
    hebrewPlain: ויהי אתה בית יהוה מתחבא שש שנים ועתליה מלכת על הארץ
    kjvRefs:
    - 2 Kings 11:3
    kjvOsis:
    - 2Kgs.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.4
    scripture: tanakh
    name: Tanakh 2 Kings 11:4
    ref: 2 Kings 11:4
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 4
    ordinal: 9745
    text: And in the seventh year Jehoiada sent and fetched the captains over hundreds, of the Carites and of the guard, and brought them to him into the house of the LORD; and he made a covenant with them, and took an oath of them in the house of the LORD, and showed them the king’s son.
    translation: JPS 1917
    original: וּבַשָּׁנָה הַשְּׁבִיעִית שָׁלַח יְהוֹיָדָע וַיִּקַּח אֶת־שָׂרֵי המאיות [הַמֵּאוֹת] לַכָּרִי וְלָרָצִים וַיָּבֵא אֹתָם אֵלָיו בֵּית יְהוָה וַיִּכְרֹת לָהֶם בְּרִית וַיַּשְׁבַּע אֹתָם בְּבֵית יְהוָה וַיַּרְא אֹתָם אֶת־בֶּן־הַמֶּלֶךְ׃
    hebrewPlain: ובשנה השביעית שלח יהוידע ויקח את שרי המאיות [המאות] לכרי ולרצים ויבא אתם אליו בית יהוה ויכרת להם ברית וישבע אתם בבית יהוה וירא אתם את בן המלך
    kjvRefs:
    - 2 Kings 11:4
    kjvOsis:
    - 2Kgs.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.5
    scripture: tanakh
    name: Tanakh 2 Kings 11:5
    ref: 2 Kings 11:5
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 5
    ordinal: 9746
    text: 'And he commanded them, saying: ‘This is the thing that ye shall do: a third part of you, that come in on the sabbath, and that keep the watch of the king’s house—'
    translation: JPS 1917
    original: וַיְצַוֵּם לֵאמֹר זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן הַשְּׁלִשִׁית מִכֶּם בָּאֵי הַשַּׁבָּת וְשֹׁמְרֵי מִשְׁמֶרֶת בֵּית הַמֶּלֶךְ׃
    hebrewPlain: ויצום לאמר זה הדבר אשר תעשון השלשית מכם באי השבת ושמרי משמרת בית המלך
    kjvRefs:
    - 2 Kings 11:5
    kjvOsis:
    - 2Kgs.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.6
    scripture: tanakh
    name: Tanakh 2 Kings 11:6
    ref: 2 Kings 11:6
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 6
    ordinal: 9747
    text: now another third part was at the gate Sur, and another third part at the gate behind the guard—shall keep the watch of the house, and be a barrier.
    translation: JPS 1917
    original: וְהַשְּׁלִשִׁית בְּשַׁעַר סוּר וְהַשְּׁלִשִׁית בַּשַּׁעַר אַחַר הָרָצִים וּשְׁמַרְתֶּם אֶת־מִשְׁמֶרֶת הַבַּיִת מַסָּח׃
    hebrewPlain: והשלשית בשער סור והשלשית בשער אחר הרצים ושמרתם את משמרת הבית מסח
    kjvRefs:
    - 2 Kings 11:6
    kjvOsis:
    - 2Kgs.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.7
    scripture: tanakh
    name: Tanakh 2 Kings 11:7
    ref: 2 Kings 11:7
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 7
    ordinal: 9748
    text: And the other two parts of you, even all that go forth on the sabbath, shall keep the watch of the house of the LORD about the king.
    translation: JPS 1917
    original: וּשְׁתֵּי הַיָּדוֹת בָּכֶם כֹּל יֹצְאֵי הַשַּׁבָּת וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת בֵּית־יְהוָה אֶל־הַמֶּלֶךְ׃
    hebrewPlain: ושתי הידות בכם כל יצאי השבת ושמרו את משמרת בית יהוה אל המלך
    kjvRefs:
    - 2 Kings 11:7
    kjvOsis:
    - 2Kgs.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.8
    scripture: tanakh
    name: Tanakh 2 Kings 11:8
    ref: 2 Kings 11:8
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 8
    ordinal: 9749
    text: And ye shall compass the king round about, every man with his weapons in his hand; and he that cometh within the ranks, let him be slain; and be ye with the king when he goeth out, and when he cometh in.’
    translation: JPS 1917
    original: וְהִקַּפְתֶּם עַל־הַמֶּלֶךְ סָבִיב אִישׁ וְכֵלָיו בְּיָדוֹ וְהַבָּא אֶל־הַשְּׂדֵרוֹת יוּמָת וִהְיוּ אֶת־הַמֶּלֶךְ בְּצֵאתוֹ וּבְבֹאוֹ׃
    hebrewPlain: והקפתם על המלך סביב איש וכליו בידו והבא אל השדרות יומת והיו את המלך בצאתו ובבאו
    kjvRefs:
    - 2 Kings 11:8
    kjvOsis:
    - 2Kgs.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.9
    scripture: tanakh
    name: Tanakh 2 Kings 11:9
    ref: 2 Kings 11:9
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 9
    ordinal: 9750
    text: And the captains over hundreds did according to all that Jehoiada the priest commanded; and they took every man his men, those that were to come in on the sabbath, with those that were to go out on the sabbath, and came to Jehoiada the priest.
    translation: JPS 1917
    original: וַיַּעֲשׂוּ שָׂרֵי המאיות [הַמֵּאוֹת] כְּכֹל אֲשֶׁר־צִוָּה יְהוֹיָדָע הַכֹּהֵן וַיִּקְחוּ אִישׁ אֶת־אֲנָשָׁיו בָּאֵי הַשַּׁבָּת עִם יֹצְאֵי הַשַּׁבָּת וַיָּבֹאוּ אֶל־יְהוֹיָדָע הַכֹּהֵן׃
    hebrewPlain: ויעשו שרי המאיות [המאות] ככל אשר צוה יהוידע הכהן ויקחו איש את אנשיו באי השבת עם יצאי השבת ויבאו אל יהוידע הכהן
    kjvRefs:
    - 2 Kings 11:9
    kjvOsis:
    - 2Kgs.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.10
    scripture: tanakh
    name: Tanakh 2 Kings 11:10
    ref: 2 Kings 11:10
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 10
    ordinal: 9751
    text: And the priest delivered to the captains over hundreds the spear and shields that had been king David’s, which were in the house of the LORD.
    translation: JPS 1917
    original: וַיִּתֵּן הַכֹּהֵן לְשָׂרֵי המאיות [הַמֵּאוֹת] אֶת־הַחֲנִית וְאֶת־הַשְּׁלָטִים אֲשֶׁר לַמֶּלֶךְ דָּוִד אֲשֶׁר בְּבֵית יְהוָה׃
    hebrewPlain: ויתן הכהן לשרי המאיות [המאות] את החנית ואת השלטים אשר למלך דוד אשר בבית יהוה
    kjvRefs:
    - 2 Kings 11:10
    kjvOsis:
    - 2Kgs.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.11
- type: TanakhVerse
  data:
    osis: 2Kgs.11.11
    scripture: tanakh
    name: Tanakh 2 Kings 11:11
    ref: 2 Kings 11:11
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 11
    ordinal: 9752
    text: And the guard stood, every man with his weapons in his hand, from the right side of the house to the left side of the house, along by the altar and the house, by the king round about.
    translation: JPS 1917
    original: וַיַּעַמְדוּ הָרָצִים אִישׁ וְכֵלָיו בְּיָדוֹ מִכֶּתֶף הַבַּיִת הַיְמָנִית עַד־כֶּתֶף הַבַּיִת הַשְּׂמָאלִית לַמִּזְבֵּחַ וְלַבָּיִת עַל־הַמֶּלֶךְ סָבִיב׃
    hebrewPlain: ויעמדו הרצים איש וכליו בידו מכתף הבית הימנית עד כתף הבית השמאלית למזבח ולבית על המלך סביב
    kjvRefs:
    - 2 Kings 11:11
    kjvOsis:
