  data:
    osis: 2Kgs.1.13
    scripture: tanakh
    name: Tanakh 2 Kings 1:13
    ref: 2 Kings 1:13
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 9458
    text: 'And again he sent the captain of a third fifty with his fifty. And the third captain of fifty went up, and came and fell on his knees before Elijah, and besought him, and said unto him: ‘O man of God, I pray thee, let my life, and the life of these fifty thy servants, be precious in thy sight.'
    translation: JPS 1917
    original: וַיָּשָׁב וַיִּשְׁלַח שַׂר־חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו וַיַּעַל וַיָּבֹא שַׂר־הַחֲמִשִּׁים הַשְּׁלִישִׁי וַיִּכְרַע עַל־בִּרְכָּיו לְנֶגֶד אֵלִיָּהוּ וַיִּתְחַנֵּן אֵלָיו וַיְדַבֵּר אֵלָיו אִישׁ הָאֱלֹהִים תִּיקַר־נָא נַפְשִׁי וְנֶפֶשׁ עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים בְּעֵינֶיךָ׃
    hebrewPlain: וישב וישלח שר חמשים שלשים וחמשיו ויעל ויבא שר החמשים השלישי ויכרע על ברכיו לנגד אליהו ויתחנן אליו וידבר אליו איש האלהים תיקר נא נפשי ונפש עבדיך אלה חמשים בעיניך
    kjvRefs:
    - 2 Kings 1:13
    kjvOsis:
    - 2Kgs.1.13
  relations:
  - predicate: IN
