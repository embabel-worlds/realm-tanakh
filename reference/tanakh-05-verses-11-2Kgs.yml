    chapter: 1
    verse: 2
    ordinal: 9447
    text: 'And Ahaziah fell down through the lattice in his upper chamber that was in Samaria, and was sick; and he sent messengers, and said unto them: ‘Go, inquire of Baal-zebub the god of Ekron whether I shall recover of this sickness.’'
    translation: JPS 1917
