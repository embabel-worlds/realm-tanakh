  data:
    osis: 2Kgs.21.24
    scripture: tanakh
    name: Tanakh 2 Kings 21:24
    ref: 2 Kings 21:24
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 24
    ordinal: 10055
    text: But the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.
    translation: JPS 1917
    original: וַיַּךְ עַם־הָאָרֶץ אֵת כָּל־הַקֹּשְׁרִים עַל־הַמֶּלֶךְ אָמוֹן וַיַּמְלִיכוּ עַם־הָאָרֶץ אֶת־יֹאשִׁיָּהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: ויך עם הארץ את כל הקשרים על המלך אמון וימליכו עם הארץ את יאשיהו בנו תחתיו
    kjvRefs:
    - 2 Kings 21:24
    kjvOsis:
    - 2Kgs.21.24
