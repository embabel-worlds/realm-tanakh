  data:
    osis: 2Kgs.21.16
    scripture: tanakh
    name: Tanakh 2 Kings 21:16
    ref: 2 Kings 21:16
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 16
    ordinal: 10047
    text: Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another; beside his sin wherewith he made Judah to sin, in doing that which was evil in the sight of the LORD.
    translation: JPS 1917
    original: וְגַם דָּם נָקִי שָׁפַךְ מְנַשֶּׁה הַרְבֵּה מְאֹד עַד אֲשֶׁר־מִלֵּא אֶת־יְרוּשָׁלִַם פֶּה לָפֶה לְבַד מֵחַטָּאתוֹ אֲשֶׁר הֶחֱטִיא אֶת־יְהוּדָה לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה׃
    hebrewPlain: וגם דם נקי שפך מנשה הרבה מאד עד אשר מלא את ירושלם פה לפה לבד מחטאתו אשר החטיא את יהודה לעשות הרע בעיני יהוה
    kjvRefs:
    - 2 Kings 21:16
    kjvOsis:
    - 2Kgs.21.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
