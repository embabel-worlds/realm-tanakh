    original: וַיַּעַל מְנַחֵם בֶּן־גָּדִי מִתִּרְצָה וַיָּבֹא שֹׁמְרוֹן וַיַּךְ אֶת־שַׁלּוּם בֶּן־יָבֵישׁ בְּשֹׁמְרוֹן וַיְמִיתֵהוּ וַיִּמְלֹךְ תַּחְתָּיו׃
