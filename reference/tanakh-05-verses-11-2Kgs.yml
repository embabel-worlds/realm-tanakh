    ordinal: 9854
    text: In the nine and thirtieth year of Azariah king of Judah began Menahem the son of Gadi to reign over Israel, and reigned ten years in Samaria.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לַעֲזַרְיָה מֶלֶךְ יְהוּדָה מָלַךְ מְנַחֵם בֶּן־גָּדִי עַל־יִשְׂרָאֵל עֶשֶׂר שָׁנִים בְּשֹׁמְרוֹן׃
