- type: TanakhVerse
  data:
    osis: 2Kgs.1.9
    scripture: tanakh
    name: Tanakh 2 Kings 1:9
    ref: 2 Kings 1:9
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 9454
    text: 'Then the king sent unto him a captain of fifty with his fifty. And he went up to him; and, behold, he sat on the top of the hill. And he spoke unto him: ‘O man of God, the king hath said: Come down.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אֵלָיו שַׂר־חֲמִשִּׁים וַחֲמִשָּׁיו וַיַּעַל אֵלָיו וְהִנֵּה יֹשֵׁב עַל־רֹאשׁ הָהָר וַיְדַבֵּר אֵלָיו אִישׁ הָאֱלֹהִים הַמֶּלֶךְ דִּבֶּר רֵדָה׃
    hebrewPlain: וישלח אליו שר חמשים וחמשיו ויעל אליו והנה ישב על ראש ההר וידבר אליו איש האלהים המלך דבר רדה
    kjvRefs:
    - 2 Kings 1:9
    kjvOsis:
    - 2Kgs.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
- type: TanakhVerse
  data:
    osis: 2Kgs.1.10
    scripture: tanakh
    name: Tanakh 2 Kings 1:10
    ref: 2 Kings 1:10
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 9455
    text: 'And Elijah answered and said to the captain of fifty: ‘If I be a man of God, let fire come down from heaven, and consume thee and thy fifty.’ And there came down fire from heaven, and consumed him and his fifty.'
    translation: JPS 1917
    original: וַיַּעֲנֶה אֵלִיָּהוּ וַיְדַבֵּר אֶל־שַׂר הַחֲמִשִּׁים וְאִם־אִישׁ אֱלֹהִים אָנִי תֵּרֶד אֵשׁ מִן־הַשָּׁמַיִם וְתֹאכַל אֹתְךָ וְאֶת־חֲמִשֶּׁיךָ וַתֵּרֶד אֵשׁ מִן־הַשָּׁמַיִם וַתֹּאכַל אֹתוֹ וְאֶת־חֲמִשָּׁיו׃
    hebrewPlain: ויענה אליהו וידבר אל שר החמשים ואם איש אלהים אני תרד אש מן השמים ותאכל אתך ואת חמשיך ותרד אש מן השמים ותאכל אתו ואת חמשיו
    kjvRefs:
    - 2 Kings 1:10
    kjvOsis:
    - 2Kgs.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
- type: TanakhVerse
  data:
    osis: 2Kgs.1.11
    scripture: tanakh
    name: Tanakh 2 Kings 1:11
    ref: 2 Kings 1:11
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 9456
    text: 'And again he sent unto him another captain of fifty with his fifty. And he answered and said unto him: ‘O man of God, thus hath the king said: Come down quickly.’'
    translation: JPS 1917
    original: וַיָּשָׁב וַיִּשְׁלַח אֵלָיו שַׂר־חֲמִשִּׁים אַחֵר וַחֲמִשָּׁיו וַיַּעַן וַיְדַבֵּר אֵלָיו אִישׁ הָאֱלֹהִים כֹּה־אָמַר הַמֶּלֶךְ מְהֵרָה רֵדָה׃
    hebrewPlain: וישב וישלח אליו שר חמשים אחר וחמשיו ויען וידבר אליו איש האלהים כה אמר המלך מהרה רדה
    kjvRefs:
    - 2 Kings 1:11
    kjvOsis:
    - 2Kgs.1.11
  relations:
