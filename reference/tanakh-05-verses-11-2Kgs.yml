    ref: 2 Kings 4:15
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 15
    ordinal: 9530
    text: 'And he said: ‘Call her.’ And when he had called her, she stood in the door.'
    translation: JPS 1917
    original: וַיֹּאמֶר קְרָא־לָהּ וַיִּקְרָא־לָהּ וַתַּעֲמֹד בַּפָּתַח׃
