- type: TanakhVerse
  data:
    osis: 2Kgs.24.10
    scripture: tanakh
    name: Tanakh 2 Kings 24:10
    ref: 2 Kings 24:10
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 10
    ordinal: 10124
    text: At that time the servants of Nebuchadnezzar king of Babylon came up to Jerusalem, and the city was besieged.
    translation: JPS 1917
    original: בָּעֵת הַהִיא עלה [עָלוּ] עַבְדֵי נְבֻכַדְנֶאצַּר מֶלֶךְ־בָּבֶל יְרוּשָׁלִָם וַתָּבֹא הָעִיר בַּמָּצוֹר׃
    hebrewPlain: בעת ההיא עלה [עלו] עבדי נבכדנאצר מלך בבל ירושלם ותבא העיר במצור
    kjvRefs:
    - 2 Kings 24:10
    kjvOsis:
    - 2Kgs.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.11
    scripture: tanakh
    name: Tanakh 2 Kings 24:11
    ref: 2 Kings 24:11
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 11
    ordinal: 10125
    text: And Nebuchadnezzar king of Babylon came unto the city, while his servants were besieging it.
    translation: JPS 1917
    original: וַיָּבֹא נְבוּכַדְנֶאצַּר מֶלֶךְ־בָּבֶל עַל־הָעִיר וַעֲבָדָיו צָרִים עָלֶיהָ׃
    hebrewPlain: ויבא נבוכדנאצר מלך בבל על העיר ועבדיו צרים עליה
    kjvRefs:
    - 2 Kings 24:11
    kjvOsis:
    - 2Kgs.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.12
    scripture: tanakh
    name: Tanakh 2 Kings 24:12
    ref: 2 Kings 24:12
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 12
    ordinal: 10126
    text: And Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers; and the king of Babylon took him in the eighth year of his reign.
    translation: JPS 1917
    original: וַיֵּצֵא יְהוֹיָכִין מֶלֶךְ־יְהוּדָה עַל־מֶלֶךְ בָּבֶל הוּא וְאִמּוֹ וַעֲבָדָיו וְשָׂרָיו וְסָרִיסָיו וַיִּקַּח אֹתוֹ מֶלֶךְ בָּבֶל בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ׃
    hebrewPlain: ויצא יהויכין מלך יהודה על מלך בבל הוא ואמו ועבדיו ושריו וסריסיו ויקח אתו מלך בבל בשנת שמנה למלכו
    kjvRefs:
    - 2 Kings 24:12
    kjvOsis:
    - 2Kgs.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.13
    scripture: tanakh
    name: Tanakh 2 Kings 24:13
    ref: 2 Kings 24:13
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 13
    ordinal: 10127
    text: And he carried out thence all the treasures of the house of the LORD, and the treasures of the king’s house, and cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the LORD, as the LORD had said.
    translation: JPS 1917
    original: וַיּוֹצֵא מִשָּׁם אֶת־כָּל־אוֹצְרוֹת בֵּית יְהוָה וְאוֹצְרוֹת בֵּית הַמֶּלֶךְ וַיְקַצֵּץ אֶת־כָּל־כְּלֵי הַזָּהָב אֲשֶׁר עָשָׂה שְׁלֹמֹה מֶלֶךְ־יִשְׂרָאֵל בְּהֵיכַל יְהוָה כַּאֲשֶׁר דִּבֶּר יְהוָה׃
    hebrewPlain: ויוצא משם את כל אוצרות בית יהוה ואוצרות בית המלך ויקצץ את כל כלי הזהב אשר עשה שלמה מלך ישראל בהיכל יהוה כאשר דבר יהוה
    kjvRefs:
    - 2 Kings 24:13
    kjvOsis:
    - 2Kgs.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.14
    scripture: tanakh
    name: Tanakh 2 Kings 24:14
    ref: 2 Kings 24:14
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 14
    ordinal: 10128
    text: And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and the smiths; none remained, save the poorest sort of the people of the land.
    translation: JPS 1917
    original: וְהִגְלָה אֶת־כָּל־יְרוּשָׁלִַם וְאֶת־כָּל־הַשָּׂרִים וְאֵת כָּל־גִּבּוֹרֵי הַחַיִל עשרה [עֲשֶׂרֶת] אֲלָפִים גּוֹלֶה וְכָל־הֶחָרָשׁ וְהַמַּסְגֵּר לֹא נִשְׁאַר זוּלַת דַּלַּת עַם־הָאָרֶץ׃
    hebrewPlain: והגלה את כל ירושלם ואת כל השרים ואת כל גבורי החיל עשרה [עשרת] אלפים גולה וכל החרש והמסגר לא נשאר זולת דלת עם הארץ
    kjvRefs:
    - 2 Kings 24:14
    kjvOsis:
    - 2Kgs.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.15
    scripture: tanakh
    name: Tanakh 2 Kings 24:15
    ref: 2 Kings 24:15
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 15
    ordinal: 10129
    text: And he carried away Jehoiachin to Babylon; and the king’s mother, and the king’s wives, and his officers, and the chief men of the land, carried he into captivity from Jerusalem to Babylon.
    translation: JPS 1917
    original: וַיֶּגֶל אֶת־יְהוֹיָכִין בָּבֶלָה וְאֶת־אֵם הַמֶּלֶךְ וְאֶת־נְשֵׁי הַמֶּלֶךְ וְאֶת־סָרִיסָיו וְאֵת אולי [אֵילֵי] הָאָרֶץ הוֹלִיךְ גּוֹלָה מִירוּשָׁלִַם בָּבֶלָה׃
    hebrewPlain: ויגל את יהויכין בבלה ואת אם המלך ואת נשי המלך ואת סריסיו ואת אולי [אילי] הארץ הוליך גולה מירושלם בבלה
    kjvRefs:
    - 2 Kings 24:15
    kjvOsis:
    - 2Kgs.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.16
    scripture: tanakh
    name: Tanakh 2 Kings 24:16
    ref: 2 Kings 24:16
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 16
    ordinal: 10130
    text: And all the men of might, even seven thousand, and the craftsmen and the smiths a thousand, all of them strong and apt for war, even them the king of Babylon brought captive to Babylon.
    translation: JPS 1917
    original: וְאֵת כָּל־אַנְשֵׁי הַחַיִל שִׁבְעַת אֲלָפִים וְהֶחָרָשׁ וְהַמַּסְגֵּר אֶלֶף הַכֹּל גִּבּוֹרִים עֹשֵׂי מִלְחָמָה וַיְבִיאֵם מֶלֶךְ־בָּבֶל גּוֹלָה בָּבֶלָה׃
    hebrewPlain: ואת כל אנשי החיל שבעת אלפים והחרש והמסגר אלף הכל גבורים עשי מלחמה ויביאם מלך בבל גולה בבלה
    kjvRefs:
    - 2 Kings 24:16
    kjvOsis:
    - 2Kgs.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.17
    scripture: tanakh
    name: Tanakh 2 Kings 24:17
    ref: 2 Kings 24:17
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 17
    ordinal: 10131
    text: And the king of Babylon made Mattaniah his father’s brother king in his stead, and changed his name to Zedekiah.
    translation: JPS 1917
    original: וַיַּמְלֵךְ מֶלֶךְ־בָּבֶל אֶת־מַתַּנְיָה דֹדוֹ תַּחְתָּיו וַיַּסֵּב אֶת־שְׁמוֹ צִדְקִיָּהוּ׃
    hebrewPlain: וימלך מלך בבל את מתניה דדו תחתיו ויסב את שמו צדקיהו
    kjvRefs:
    - 2 Kings 24:17
    kjvOsis:
    - 2Kgs.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.18
    scripture: tanakh
    name: Tanakh 2 Kings 24:18
    ref: 2 Kings 24:18
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 18
    ordinal: 10132
    text: Zedekiah was twenty and one years old when he began to reign; and he reigned eleven years in Jerusalem; and his mother’s name was Hamutal the daughter of Jeremiah of Libnah.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְאַחַת שָׁנָה צִדְקִיָּהוּ בְמָלְכוֹ וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ חמיטל [חֲמוּטַל] בַּת־יִרְמְיָהוּ מִלִּבְנָה׃
    hebrewPlain: בן עשרים ואחת שנה צדקיהו במלכו ואחת עשרה שנה מלך בירושלם ושם אמו חמיטל [חמוטל] בת ירמיהו מלבנה
    kjvRefs:
    - 2 Kings 24:18
    kjvOsis:
    - 2Kgs.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.19
    scripture: tanakh
    name: Tanakh 2 Kings 24:19
    ref: 2 Kings 24:19
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 19
    ordinal: 10133
    text: And he did that which was evil in the sight of the LORD, according to all that Jehoiakim had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה יְהוֹיָקִים׃
    hebrewPlain: ויעש הרע בעיני יהוה ככל אשר עשה יהויקים
    kjvRefs:
    - 2 Kings 24:19
    kjvOsis:
    - 2Kgs.24.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.20
    scripture: tanakh
    name: Tanakh 2 Kings 24:20
    ref: 2 Kings 24:20
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 20
    ordinal: 10134
    text: For through the anger of the LORD did it come to pass in Jerusalem and Judah, until He had cast them out from His presence. And Zedekiah rebelled against the king of Babylon.
    translation: JPS 1917
    original: כִּי עַל־אַף יְהוָה הָיְתָה בִירוּשָׁלִַם וּבִיהוּדָה עַד־הִשְׁלִכוֹ אֹתָם מֵעַל פָּנָיו וַיִּמְרֹד צִדְקִיָּהוּ בְּמֶלֶךְ בָּבֶל׃
    hebrewPlain: כי על אף יהוה היתה בירושלם וביהודה עד השלכו אתם מעל פניו וימרד צדקיהו במלך בבל
    kjvRefs:
    - 2 Kings 24:20
    kjvOsis:
    - 2Kgs.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.25.1
    scripture: tanakh
    name: Tanakh 2 Kings 25:1
    ref: 2 Kings 25:1
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 1
    ordinal: 10135
    text: And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem, and encamped against it; and they built forts against it round about.
    translation: JPS 1917
    original: וַיְהִי בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ בָּא נְבֻכַדְנֶאצַּר מֶלֶךְ־בָּבֶל הוּא וְכָל־חֵילוֹ עַל־יְרוּשָׁלִַם וַיִּחַן עָלֶיהָ וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב׃
    hebrewPlain: ויהי בשנת התשיעית למלכו בחדש העשירי בעשור לחדש בא נבכדנאצר מלך בבל הוא וכל חילו על ירושלם ויחן עליה ויבנו עליה דיק סביב
    kjvRefs:
    - 2 Kings 25:1
    kjvOsis:
    - 2Kgs.25.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.2
    scripture: tanakh
    name: Tanakh 2 Kings 25:2
    ref: 2 Kings 25:2
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 2
    ordinal: 10136
    text: So the city was besieged unto the eleventh year of king Zedekiah.
    translation: JPS 1917
    original: וַתָּבֹא הָעִיר בַּמָּצוֹר עַד עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ צִדְקִיָּהוּ׃
    hebrewPlain: ותבא העיר במצור עד עשתי עשרה שנה למלך צדקיהו
    kjvRefs:
    - 2 Kings 25:2
    kjvOsis:
    - 2Kgs.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.3
    scripture: tanakh
    name: Tanakh 2 Kings 25:3
    ref: 2 Kings 25:3
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 3
    ordinal: 10137
    text: On the ninth day of the [fourth] month the famine was sore in the city, so that there was no bread for the people of the land.
    translation: JPS 1917
    original: בְּתִשְׁעָה לַחֹדֶשׁ וַיֶּחֱזַק הָרָעָב בָּעִיר וְלֹא־הָיָה לֶחֶם לְעַם הָאָרֶץ׃
    hebrewPlain: בתשעה לחדש ויחזק הרעב בעיר ולא היה לחם לעם הארץ
    kjvRefs:
    - 2 Kings 25:3
    kjvOsis:
    - 2Kgs.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.4
    scripture: tanakh
    name: Tanakh 2 Kings 25:4
    ref: 2 Kings 25:4
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 4
    ordinal: 10138
    text: Then a breach was made in the city, and all the men of war [fled] by night by the way of the gate between the two walls, which was by the king’s garden—now the Chaldeans were against the city round about—and the king went by the way of the Arabah.
    translation: JPS 1917
    original: וַתִּבָּקַע הָעִיר וְכָל־אַנְשֵׁי הַמִּלְחָמָה הַלַּיְלָה דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם אֲשֶׁר עַל־גַּן הַמֶּלֶךְ וְכַשְׂדִּים עַל־הָעִיר סָבִיב וַיֵּלֶךְ דֶּרֶךְ הָעֲרָבָה׃
    hebrewPlain: ותבקע העיר וכל אנשי המלחמה הלילה דרך שער בין החמתים אשר על גן המלך וכשדים על העיר סביב וילך דרך הערבה
    kjvRefs:
    - 2 Kings 25:4
    kjvOsis:
    - 2Kgs.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.5
    scripture: tanakh
    name: Tanakh 2 Kings 25:5
    ref: 2 Kings 25:5
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 5
    ordinal: 10139
    text: But the army of the Chaldeans pursued after the king, and overtook him in the plains of Jericho; and all his army was scattered from him.
    translation: JPS 1917
    original: וַיִּרְדְּפוּ חֵיל־כַּשְׂדִּים אַחַר הַמֶּלֶךְ וַיַּשִּׂגוּ אֹתוֹ בְּעַרְבוֹת יְרֵחוֹ וְכָל־חֵילוֹ נָפֹצוּ מֵעָלָיו׃
    hebrewPlain: וירדפו חיל כשדים אחר המלך וישגו אתו בערבות ירחו וכל חילו נפצו מעליו
    kjvRefs:
    - 2 Kings 25:5
    kjvOsis:
    - 2Kgs.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.6
    scripture: tanakh
    name: Tanakh 2 Kings 25:6
    ref: 2 Kings 25:6
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 6
    ordinal: 10140
    text: Then they took the king, and carried him up unto the king of Babylon to Riblah; and they gave judgment upon him.
    translation: JPS 1917
    original: וַיִּתְפְּשׂוּ אֶת־הַמֶּלֶךְ וַיַּעֲלוּ אֹתוֹ אֶל־מֶלֶךְ בָּבֶל רִבְלָתָה וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט׃
    hebrewPlain: ויתפשו את המלך ויעלו אתו אל מלך בבל רבלתה וידברו אתו משפט
    kjvRefs:
    - 2 Kings 25:6
    kjvOsis:
    - 2Kgs.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.7
    scripture: tanakh
    name: Tanakh 2 Kings 25:7
    ref: 2 Kings 25:7
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 7
    ordinal: 10141
    text: And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him in fetters, and carried him to Babylon.
    translation: JPS 1917
    original: וְאֶת־בְּנֵי צִדְקִיָּהוּ שָׁחֲטוּ לְעֵינָיו וְאֶת־עֵינֵי צִדְקִיָּהוּ עִוֵּר וַיַּאַסְרֵהוּ בַנְחֻשְׁתַּיִם וַיְבִאֵהוּ בָּבֶל׃
    hebrewPlain: ואת בני צדקיהו שחטו לעיניו ואת עיני צדקיהו עור ויאסרהו בנחשתים ויבאהו בבל
    kjvRefs:
    - 2 Kings 25:7
    kjvOsis:
    - 2Kgs.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.8
    scripture: tanakh
    name: Tanakh 2 Kings 25:8
    ref: 2 Kings 25:8
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 8
    ordinal: 10142
    text: Now in the fifth month, on the seventh day of the month, which was the nineteenth year of king Nebuchadnezzar, king of Babylon, came Nebuzaradan the captain of the guard, a servant of the king of Babylon, unto Jerusalem.
    translation: JPS 1917
    original: וּבַחֹדֶשׁ הַחֲמִישִׁי בְּשִׁבְעָה לַחֹדֶשׁ הִיא שְׁנַת תְּשַׁע־עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר מֶלֶךְ־בָּבֶל בָּא נְבוּזַרְאֲדָן רַב־טַבָּחִים עֶבֶד מֶלֶךְ־בָּבֶל יְרוּשָׁלִָם׃
    hebrewPlain: ובחדש החמישי בשבעה לחדש היא שנת תשע עשרה שנה למלך נבכדנאצר מלך בבל בא נבוזראדן רב טבחים עבד מלך בבל ירושלם
    kjvRefs:
    - 2 Kings 25:8
    kjvOsis:
    - 2Kgs.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.9
    scripture: tanakh
    name: Tanakh 2 Kings 25:9
    ref: 2 Kings 25:9
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 9
    ordinal: 10143
    text: And he burnt the house of the LORD, and the king’s house; and all the houses of Jerusalem, even every great man’s house, burnt he with fire.
    translation: JPS 1917
    original: וַיִּשְׂרֹף אֶת־בֵּית־יְהוָה וְאֶת־בֵּית הַמֶּלֶךְ וְאֵת כָּל־בָּתֵּי יְרוּשָׁלִַם וְאֶת־כָּל־בֵּית גָּדוֹל שָׂרַף בָּאֵשׁ׃
    hebrewPlain: וישרף את בית יהוה ואת בית המלך ואת כל בתי ירושלם ואת כל בית גדול שרף באש
    kjvRefs:
    - 2 Kings 25:9
    kjvOsis:
    - 2Kgs.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.10
    scripture: tanakh
    name: Tanakh 2 Kings 25:10
    ref: 2 Kings 25:10
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 10
    ordinal: 10144
    text: And all the army of the Chaldeans, that were with the captain of the guard, broke down the walls of Jerusalem round about.
    translation: JPS 1917
    original: וְאֶת־חוֹמֹת יְרוּשָׁלִַם סָבִיב נָתְצוּ כָּל־חֵיל כַּשְׂדִּים אֲשֶׁר רַב־טַבָּחִים׃
    hebrewPlain: ואת חומת ירושלם סביב נתצו כל חיל כשדים אשר רב טבחים
    kjvRefs:
    - 2 Kings 25:10
    kjvOsis:
    - 2Kgs.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.11
    scripture: tanakh
    name: Tanakh 2 Kings 25:11
    ref: 2 Kings 25:11
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 11
    ordinal: 10145
    text: And the residue of the people that were left in the city, and those that fell away, that fell to the king of Babylon, and the residue of the multitude, did Nebuzaradan the captain of the guard carry away captive.
    translation: JPS 1917
    original: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר וְאֶת־הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל־הַמֶּלֶךְ בָּבֶל וְאֵת יֶתֶר הֶהָמוֹן הֶגְלָה נְבוּזַרְאֲדָן רַב־טַבָּחִים׃
    hebrewPlain: ואת יתר העם הנשארים בעיר ואת הנפלים אשר נפלו על המלך בבל ואת יתר ההמון הגלה נבוזראדן רב טבחים
    kjvRefs:
    - 2 Kings 25:11
    kjvOsis:
    - 2Kgs.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.12
    scripture: tanakh
    name: Tanakh 2 Kings 25:12
    ref: 2 Kings 25:12
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 12
    ordinal: 10146
    text: But the captain of the guard left of the poorest of the land to be vinedressers and husbandmen.
    translation: JPS 1917
    original: וּמִדַּלַּת הָאָרֶץ הִשְׁאִיר רַב־טַבָּחִים לְכֹרְמִים וּלְיֹגְבִים׃
    hebrewPlain: ומדלת הארץ השאיר רב טבחים לכרמים וליגבים
    kjvRefs:
    - 2 Kings 25:12
    kjvOsis:
    - 2Kgs.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.13
    scripture: tanakh
    name: Tanakh 2 Kings 25:13
    ref: 2 Kings 25:13
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 13
    ordinal: 10147
    text: And the pillars of brass that were in the house of the LORD, and the bases and the brazen sea that were in the house of the LORD, did the Chaldeans break in pieces, and carried the brass of them to Babylon.
    translation: JPS 1917
    original: וְאֶת־עַמּוּדֵי הַנְּחֹשֶׁת אֲשֶׁר בֵּית־יְהוָה וְאֶת־הַמְּכֹנוֹת וְאֶת־יָם הַנְּחֹשֶׁת אֲשֶׁר בְּבֵית־יְהוָה שִׁבְּרוּ כַשְׂדִּים וַיִּשְׂאוּ אֶת־נְחֻשְׁתָּם בָּבֶלָה׃
    hebrewPlain: ואת עמודי הנחשת אשר בית יהוה ואת המכנות ואת ים הנחשת אשר בבית יהוה שברו כשדים וישאו את נחשתם בבלה
    kjvRefs:
    - 2 Kings 25:13
    kjvOsis:
    - 2Kgs.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.14
    scripture: tanakh
    name: Tanakh 2 Kings 25:14
    ref: 2 Kings 25:14
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 14
    ordinal: 10148
    text: And the pots, and the shovels, and the snuffers, and the pans, and all the vessels of brass wherewith they ministered, took they away.
    translation: JPS 1917
    original: וְאֶת־הַסִּירֹת וְאֶת־הַיָּעִים וְאֶת־הַמְזַמְּרוֹת וְאֶת־הַכַּפּוֹת וְאֵת כָּל־כְּלֵי הַנְּחֹשֶׁת אֲשֶׁר יְשָׁרְתוּ־בָם לָקָחוּ׃
    hebrewPlain: ואת הסירת ואת היעים ואת המזמרות ואת הכפות ואת כל כלי הנחשת אשר ישרתו בם לקחו
    kjvRefs:
    - 2 Kings 25:14
    kjvOsis:
    - 2Kgs.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.15
    scripture: tanakh
    name: Tanakh 2 Kings 25:15
    ref: 2 Kings 25:15
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 15
    ordinal: 10149
    text: And the fire-pans, and the basins, that which was of gold, in gold, and that which was of silver, in silver, the captain of the guard took away.
    translation: JPS 1917
    original: וְאֶת־הַמַּחְתּוֹת וְאֶת־הַמִּזְרָקוֹת אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר־כֶּסֶף כָּסֶף לָקַח רַב־טַבָּחִים׃
    hebrewPlain: ואת המחתות ואת המזרקות אשר זהב זהב ואשר כסף כסף לקח רב טבחים
    kjvRefs:
    - 2 Kings 25:15
    kjvOsis:
    - 2Kgs.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.16
    scripture: tanakh
    name: Tanakh 2 Kings 25:16
    ref: 2 Kings 25:16
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 16
    ordinal: 10150
    text: The two pillars, the one sea, and the bases, which Solomon had made for the house of the LORD; the brass of all these vessels was without weight.
    translation: JPS 1917
    original: הָעַמּוּדִים שְׁנַיִם הַיָּם הָאֶחָד וְהַמְּכֹנוֹת אֲשֶׁר־עָשָׂה שְׁלֹמֹה לְבֵית יְהוָה לֹא־הָיָה מִשְׁקָל לִנְחֹשֶׁת כָּל־הַכֵּלִים הָאֵלֶּה׃
    hebrewPlain: העמודים שנים הים האחד והמכנות אשר עשה שלמה לבית יהוה לא היה משקל לנחשת כל הכלים האלה
    kjvRefs:
    - 2 Kings 25:16
    kjvOsis:
    - 2Kgs.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.17
    scripture: tanakh
    name: Tanakh 2 Kings 25:17
    ref: 2 Kings 25:17
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 17
    ordinal: 10151
    text: The height of the one pillar was eighteen cubits, and a capital of brass was upon it; and the height of the capital was three cubits; with network and pomegranates upon the capital round about, all of brass; and like unto these had the second pillar with network.
    translation: JPS 1917
    original: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קוֹמַת הָעַמּוּד הָאֶחָד וְכֹתֶרֶת עָלָיו נְחֹשֶׁת וְקוֹמַת הַכֹּתֶרֶת שָׁלֹשׁ אמה [אַמּוֹת] וּשְׂבָכָה וְרִמֹּנִים עַל־הַכֹּתֶרֶת סָבִיב הַכֹּל נְחֹשֶׁת וְכָאֵלֶּה לַעַמּוּד הַשֵּׁנִי עַל־הַשְּׂבָכָה׃
    hebrewPlain: שמנה עשרה אמה קומת העמוד האחד וכתרת עליו נחשת וקומת הכתרת שלש אמה [אמות] ושבכה ורמנים על הכתרת סביב הכל נחשת וכאלה לעמוד השני על השבכה
    kjvRefs:
    - 2 Kings 25:17
    kjvOsis:
    - 2Kgs.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.18
    scripture: tanakh
    name: Tanakh 2 Kings 25:18
    ref: 2 Kings 25:18
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 18
    ordinal: 10152
    text: And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door;
    translation: JPS 1917
    original: וַיִּקַּח רַב־טַבָּחִים אֶת־שְׂרָיָה כֹּהֵן הָרֹאשׁ וְאֶת־צְפַנְיָהוּ כֹּהֵן מִשְׁנֶה וְאֶת־שְׁלֹשֶׁת שֹׁמְרֵי הַסַּף׃
    hebrewPlain: ויקח רב טבחים את שריה כהן הראש ואת צפניהו כהן משנה ואת שלשת שמרי הסף
    kjvRefs:
    - 2 Kings 25:18
    kjvOsis:
    - 2Kgs.25.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.19
    scripture: tanakh
    name: Tanakh 2 Kings 25:19
    ref: 2 Kings 25:19
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 19
    ordinal: 10153
    text: and out of the city he took an officer that was set over the men of war; and five men of them that saw the king’s face, who were found in the city; and the scribe of the captain of the host, who mustered the people of the land; and threescore men of the people of the land, that were found in the city.
    translation: JPS 1917
    original: וּמִן־הָעִיר לָקַח סָרִיס אֶחָד אֲ‍שֶׁר־הוּא פָקִיד עַל־אַנְשֵׁי הַמִּלְחָמָה וַחֲמִשָּׁה אֲנָשִׁים מֵרֹאֵי פְנֵי־הַמֶּלֶךְ אֲשֶׁר נִמְצְאוּ בָעִיר וְאֵת הַסֹּפֵר שַׂר הַצָּבָא הַמַּצְבִּא אֶת־עַם הָאָרֶץ וְשִׁשִּׁים אִישׁ מֵעַם הָאָרֶץ הַנִּמְצְאִים בָּעִיר׃
    hebrewPlain: ומן העיר לקח סריס אחד א‍שר הוא פקיד על אנשי המלחמה וחמשה אנשים מראי פני המלך אשר נמצאו בעיר ואת הספר שר הצבא המצבא את עם הארץ וששים איש מעם הארץ הנמצאים בעיר
    kjvRefs:
    - 2 Kings 25:19
    kjvOsis:
    - 2Kgs.25.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.20
    scripture: tanakh
    name: Tanakh 2 Kings 25:20
    ref: 2 Kings 25:20
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 20
    ordinal: 10154
    text: And Nebuzaradan the captain of the guard took them, and brought them to the king of Babylon to Riblah.
    translation: JPS 1917
    original: וַיִּקַּח אֹתָם נְבוּזַרְאֲדָן רַב־טַבָּחִים וַיֹּלֶךְ אֹתָם עַל־מֶלֶךְ בָּבֶל רִבְלָתָה׃
    hebrewPlain: ויקח אתם נבוזראדן רב טבחים וילך אתם על מלך בבל רבלתה
    kjvRefs:
    - 2 Kings 25:20
    kjvOsis:
    - 2Kgs.25.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.21
    scripture: tanakh
    name: Tanakh 2 Kings 25:21
    ref: 2 Kings 25:21
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 21
    ordinal: 10155
    text: And the king of Babylon smote them, and put them to death at Riblah in the land of Hamath. So Judah was carried away captive out of his land.
    translation: JPS 1917
    original: וַיַּךְ אֹתָם מֶלֶךְ בָּבֶל וַיְמִיתֵם בְּרִבְלָה בְּאֶרֶץ חֲמָת וַיִּגֶל יְהוּדָה מֵעַל אַדְמָתוֹ׃
    hebrewPlain: ויך אתם מלך בבל וימיתם ברבלה בארץ חמת ויגל יהודה מעל אדמתו
    kjvRefs:
    - 2 Kings 25:21
    kjvOsis:
    - 2Kgs.25.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.25
- type: TanakhVerse
  data:
    osis: 2Kgs.25.22
    scripture: tanakh
    name: Tanakh 2 Kings 25:22
    ref: 2 Kings 25:22
    book: 2Kgs
    section: neviim
    chapter: 25
    verse: 22
    ordinal: 10156
    text: And as for the people that were left in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, governor.
    translation: JPS 1917
    original: וְהָעָם הַנִּשְׁאָר בְּאֶרֶץ יְהוּדָה אֲשֶׁר הִשְׁאִיר נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל וַיַּפְקֵד עֲלֵיהֶם אֶת־גְּדַלְיָהוּ בֶּן־אֲחִיקָם בֶּן־שָׁפָן׃
    hebrewPlain: והעם הנשאר בארץ יהודה אשר השאיר נבוכדנאצר מלך בבל ויפקד עליהם את גדליהו בן אחיקם בן שפן
    kjvRefs:
    - 2 Kings 25:22
    kjvOsis:
    - 2Kgs.25.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
