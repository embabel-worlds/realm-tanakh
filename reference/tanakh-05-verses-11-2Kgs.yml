    scripture: tanakh
    name: Tanakh 2 Kings 13:3
    ref: 2 Kings 13:3
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 3
    ordinal: 9786
    text: And the anger of the LORD was kindled against Israel, and He delivered them into the hand of Hazael king of Aram, and into the hand of Ben-hadad the son of Hazael, continually.
    translation: JPS 1917
    original: וַיִּחַר־אַף יְהוָה בְּיִשְׂרָאֵל וַיִּתְּנֵם בְּיַד חֲזָאֵל מֶלֶךְ־אֲרָם וּבְיַד בֶּן־הֲדַד בֶּן־חֲזָאֵל כָּל־הַיָּמִים׃
    hebrewPlain: ויחר אף יהוה בישראל ויתנם ביד חזאל מלך ארם וביד בן הדד בן חזאל כל הימים
    kjvRefs:
