- type: TanakhVerse
  data:
    osis: 2Kgs.17.40
    scripture: tanakh
    name: Tanakh 2 Kings 17:40
    ref: 2 Kings 17:40
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 40
    ordinal: 9935
    text: Howbeit they did not hearken, but they did after their former manner.
    translation: JPS 1917
    original: וְלֹא שָׁמֵעוּ כִּי אִם־כְּמִשְׁפָּטָם הָרִאשׁוֹן הֵם עֹשִׂים׃
    hebrewPlain: ולא שמעו כי אם כמשפטם הראשון הם עשים
    kjvRefs:
    - 2 Kings 17:40
    kjvOsis:
    - 2Kgs.17.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.41
    scripture: tanakh
    name: Tanakh 2 Kings 17:41
    ref: 2 Kings 17:41
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 41
    ordinal: 9936
    text: So these nations feared the LORD, and served their graven images; their children likewise, and their children’s children, as did their fathers, so do they unto this day.
    translation: JPS 1917
    original: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה יְרֵאִים אֶת־יְהוָה וְאֶת־פְּסִילֵיהֶם הָיוּ עֹבְדִים גַּם־בְּנֵיהֶם וּבְנֵי בְנֵיהֶם כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: ויהיו הגוים האלה יראים את יהוה ואת פסיליהם היו עבדים גם בניהם ובני בניהם כאשר עשו אבתם הם עשים עד היום הזה
    kjvRefs:
    - 2 Kings 17:41
    kjvOsis:
    - 2Kgs.17.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.18.1
    scripture: tanakh
    name: Tanakh 2 Kings 18:1
    ref: 2 Kings 18:1
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 1
    ordinal: 9937
    text: Now it came to pass in the third year of Hoshea son of Elah king of Israel, that Hezekiah the son of Ahaz king of Judah began to reign.
    translation: JPS 1917
    original: וַיְהִי בִּשְׁנַת שָׁלֹשׁ לְהוֹשֵׁעַ בֶּן־אֵלָה מֶלֶךְ יִשְׂרָאֵל מָלַךְ חִזְקִיָּה בֶן־אָחָז מֶלֶךְ יְהוּדָה׃
    hebrewPlain: ויהי בשנת שלש להושע בן אלה מלך ישראל מלך חזקיה בן אחז מלך יהודה
    kjvRefs:
    - 2 Kings 18:1
    kjvOsis:
    - 2Kgs.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.2
    scripture: tanakh
    name: Tanakh 2 Kings 18:2
    ref: 2 Kings 18:2
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 2
    ordinal: 9938
    text: Twenty and five years old was he when he began to reign; and he reigned twenty and nine years in Jerusalem; and his mother’s name was Abi the daughter of Zechariah.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ אֲבִי בַּת־זְכַרְיָה׃
    hebrewPlain: בן עשרים וחמש שנה היה במלכו ועשרים ותשע שנה מלך בירושלם ושם אמו אבי בת זכריה
    kjvRefs:
    - 2 Kings 18:2
    kjvOsis:
    - 2Kgs.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.3
    scripture: tanakh
    name: Tanakh 2 Kings 18:3
    ref: 2 Kings 18:3
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 3
    ordinal: 9939
    text: And he did that which was right in the eyes of the LORD, according to all that David his father had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה דָּוִד אָבִיו׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה דוד אביו
    kjvRefs:
    - 2 Kings 18:3
    kjvOsis:
    - 2Kgs.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.4
    scripture: tanakh
    name: Tanakh 2 Kings 18:4
    ref: 2 Kings 18:4
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 4
    ordinal: 9940
    text: He removed the high places, and broke the pillars, and cut down the Asherah; and he broke in pieces the brazen serpent that Moses had made; for unto those days the children of Israel did offer to it; and it was called Nehushtan.
    translation: JPS 1917
    original: הוּא הֵסִיר אֶת־הַבָּמוֹת וְשִׁבַּר אֶת־הַמַּצֵּבֹת וְכָרַת אֶת־הָאֲשֵׁרָה וְכִתַּת נְחַשׁ הַנְּחֹשֶׁת אֲשֶׁר־עָשָׂה מֹשֶׁה כִּי עַד־הַיָּמִים הָהֵמָּה הָיוּ בְנֵי־יִשְׂרָאֵל מְקַטְּרִים לוֹ וַיִּקְרָא־לוֹ נְחֻשְׁתָּן׃
    hebrewPlain: הוא הסיר את הבמות ושבר את המצבת וכרת את האשרה וכתת נחש הנחשת אשר עשה משה כי עד הימים ההמה היו בני ישראל מקטרים לו ויקרא לו נחשתן
    kjvRefs:
    - 2 Kings 18:4
    kjvOsis:
    - 2Kgs.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.5
    scripture: tanakh
    name: Tanakh 2 Kings 18:5
    ref: 2 Kings 18:5
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 5
    ordinal: 9941
    text: He trusted in the LORD, the God of Israel;
    translation: JPS 1917
    original: בַּיהוָה אֱלֹהֵי־יִשְׂרָאֵל בָּטָח וְאַחֲרָיו לֹא־הָיָה כָמֹהוּ בְּכֹל מַלְכֵי יְהוּדָה וַאֲשֶׁר הָיוּ לְפָנָיו׃
    hebrewPlain: ביהוה אלהי ישראל בטח ואחריו לא היה כמהו בכל מלכי יהודה ואשר היו לפניו
    kjvRefs:
    - 2 Kings 18:5
    kjvOsis:
    - 2Kgs.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.6
    scripture: tanakh
    name: Tanakh 2 Kings 18:6
    ref: 2 Kings 18:6
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 6
    ordinal: 9942
    text: For he cleaved to the LORD, he departed not from following Him, but kept His commandments, which the LORD commanded Moses.
    translation: JPS 1917
    original: וַיִּדְבַּק בַּיהוָה לֹא־סָר מֵאַחֲרָיו וַיִּשְׁמֹר מִצְוֺתָיו אֲשֶׁר־צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: וידבק ביהוה לא סר מאחריו וישמר מצותיו אשר צוה יהוה את משה
    kjvRefs:
    - 2 Kings 18:6
    kjvOsis:
    - 2Kgs.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.7
    scripture: tanakh
    name: Tanakh 2 Kings 18:7
    ref: 2 Kings 18:7
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 7
    ordinal: 9943
    text: 'And the LORD was with him: whithersoever he went forth he prospered; and he rebelled against the king of Assyria, and served him not.'
    translation: JPS 1917
    original: וְהָיָה יְהוָה עִמּוֹ בְּכֹל אֲשֶׁר־יֵצֵא יַשְׂכִּיל וַיִּמְרֹד בְּמֶלֶךְ־אַשּׁוּר וְלֹא עֲבָדוֹ׃
    hebrewPlain: והיה יהוה עמו בכל אשר יצא ישכיל וימרד במלך אשור ולא עבדו
    kjvRefs:
    - 2 Kings 18:7
    kjvOsis:
    - 2Kgs.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.8
    scripture: tanakh
    name: Tanakh 2 Kings 18:8
    ref: 2 Kings 18:8
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 8
    ordinal: 9944
    text: He smote the Philistines unto Gaza and the borders thereof, from the tower of the watchmen to the fortified city.
    translation: JPS 1917
    original: הוּא־הִכָּה אֶת־פְּלִשְׁתִּים עַד־עַזָּה וְאֶת־גְּבוּלֶיהָ מִמִּגְדַּל נוֹצְרִים עַד־עִיר מִבְצָר׃
    hebrewPlain: הוא הכה את פלשתים עד עזה ואת גבוליה ממגדל נוצרים עד עיר מבצר
    kjvRefs:
    - 2 Kings 18:8
    kjvOsis:
    - 2Kgs.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.9
    scripture: tanakh
    name: Tanakh 2 Kings 18:9
    ref: 2 Kings 18:9
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 9
    ordinal: 9945
    text: And it came to pass in the fourth year of king Hezekiah, which was the seventh year of Hoshea son of Elah king of Israel, that Shalmaneser king of Assyria came up against Samaria, and besieged it.
    translation: JPS 1917
    original: וַיְהִי בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן־אֵלָה מֶלֶךְ יִשְׂרָאֵל עָלָה שַׁלְמַנְאֶסֶר מֶלֶךְ־אַשּׁוּר עַל־שֹׁמְרוֹן וַיָּצַר עָלֶיהָ׃
    hebrewPlain: ויהי בשנה הרביעית למלך חזקיהו היא השנה השביעית להושע בן אלה מלך ישראל עלה שלמנאסר מלך אשור על שמרון ויצר עליה
    kjvRefs:
    - 2 Kings 18:9
    kjvOsis:
    - 2Kgs.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.10
    scripture: tanakh
    name: Tanakh 2 Kings 18:10
    ref: 2 Kings 18:10
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 10
    ordinal: 9946
    text: And at the end of three years they took it; even in the sixth year of Hezekiah, which was the ninth year of Hoshea king of Israel, Samaria was taken.
    translation: JPS 1917
    original: וַיִּלְכְּדֻהָ מִקְצֵה שָׁלֹשׁ שָׁנִים בִּשְׁנַת־שֵׁשׁ לְחִזְקִיָּה הִיא שְׁנַת־תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל נִלְכְּדָה שֹׁמְרוֹן׃
    hebrewPlain: וילכדה מקצה שלש שנים בשנת שש לחזקיה היא שנת תשע להושע מלך ישראל נלכדה שמרון
    kjvRefs:
    - 2 Kings 18:10
    kjvOsis:
    - 2Kgs.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.11
    scripture: tanakh
    name: Tanakh 2 Kings 18:11
    ref: 2 Kings 18:11
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 11
    ordinal: 9947
    text: And the king of Assyria carried Israel away unto Assyria, and put them in Halah, and in Habor, on the river of Gozan, and in the cities of the Medes;
    translation: JPS 1917
    original: וַיֶּגֶל מֶלֶךְ־אַשּׁוּר אֶת־יִשְׂרָאֵל אַשּׁוּרָה וַיַּנְחֵם בַּחְלַח וּבְחָבוֹר נְהַר גּוֹזָן וְעָרֵי מָדָי׃
    hebrewPlain: ויגל מלך אשור את ישראל אשורה וינחם בחלח ובחבור נהר גוזן וערי מדי
    kjvRefs:
    - 2 Kings 18:11
    kjvOsis:
    - 2Kgs.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.12
    scripture: tanakh
    name: Tanakh 2 Kings 18:12
    ref: 2 Kings 18:12
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 12
    ordinal: 9948
    text: because they hearkened not to the voice of the LORD their God, but transgressed His covenant, even all that Moses the servant of the LORD commanded, and would not hear it, nor do it.
    translation: JPS 1917
    original: עַל אֲשֶׁר לֹא־שָׁמְעוּ בְּקוֹל יְהוָה אֱלֹהֵיהֶם וַיַּעַבְרוּ אֶת־בְּרִיתוֹ אֵת כָּל־אֲשֶׁר צִוָּה מֹשֶׁה עֶבֶד יְהוָה וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ׃
    hebrewPlain: על אשר לא שמעו בקול יהוה אלהיהם ויעברו את בריתו את כל אשר צוה משה עבד יהוה ולא שמעו ולא עשו
    kjvRefs:
    - 2 Kings 18:12
    kjvOsis:
    - 2Kgs.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.13
    scripture: tanakh
    name: Tanakh 2 Kings 18:13
    ref: 2 Kings 18:13
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 13
    ordinal: 9949
    text: Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fortified cities of Judah, and took them.
    translation: JPS 1917
    original: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה עָלָה סַנְחֵרִיב מֶלֶךְ־אַשּׁוּר עַל כָּל־עָרֵי יְהוּדָה הַבְּצֻרוֹת וַיִּתְפְּשֵׂם׃
    hebrewPlain: ובארבע עשרה שנה למלך חזקיה עלה סנחריב מלך אשור על כל ערי יהודה הבצרות ויתפשם
    kjvRefs:
    - 2 Kings 18:13
    kjvOsis:
    - 2Kgs.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.14
    scripture: tanakh
    name: Tanakh 2 Kings 18:14
    ref: 2 Kings 18:14
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 14
    ordinal: 9950
    text: 'And Hezekiah king of Judah sent to the king of Assyria to Lachish, saying: ‘I have offended; return from me; that which thou puttest on me will I bear.’ And the king of Assyria appointed unto Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.'
    translation: JPS 1917
    original: וַיִּשְׁלַח חִזְקִיָּה מֶלֶךְ־יְהוּדָה אֶל־מֶלֶךְ־אַשּׁוּר לָכִישָׁה לֵאמֹר חָטָאתִי שׁוּב מֵעָלַי אֵת אֲשֶׁר־תִּתֵּן עָלַי אֶשָּׂא וַיָּשֶׂם מֶלֶךְ־אַשּׁוּר עַל־חִזְקִיָּה מֶלֶךְ־יְהוּדָה שְׁלֹשׁ מֵאוֹת כִּכַּר־כֶּסֶף וּשְׁלֹשִׁים כִּכַּר זָהָב׃
    hebrewPlain: וישלח חזקיה מלך יהודה אל מלך אשור לכישה לאמר חטאתי שוב מעלי את אשר תתן עלי אשא וישם מלך אשור על חזקיה מלך יהודה שלש מאות ככר כסף ושלשים ככר זהב
    kjvRefs:
    - 2 Kings 18:14
    kjvOsis:
    - 2Kgs.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.15
    scripture: tanakh
    name: Tanakh 2 Kings 18:15
    ref: 2 Kings 18:15
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 15
    ordinal: 9951
    text: And Hezekiah gave him all the silver that was found in the house of the LORD, and in the treasures of the king’s house.
    translation: JPS 1917
    original: וַיִּתֵּן חִזְקִיָּה אֶת־כָּל־הַכֶּסֶף הַנִּמְצָא בֵית־יְהוָה וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ׃
    hebrewPlain: ויתן חזקיה את כל הכסף הנמצא בית יהוה ובאצרות בית המלך
    kjvRefs:
    - 2 Kings 18:15
    kjvOsis:
    - 2Kgs.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.16
    scripture: tanakh
    name: Tanakh 2 Kings 18:16
    ref: 2 Kings 18:16
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 16
    ordinal: 9952
    text: At that time did Hezekiah cut off the gold from the doors of the temple of the LORD, and from the door-posts which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.
    translation: JPS 1917
    original: בָּעֵת הַהִיא קִצַּץ חִזְקִיָּה אֶת־דַּלְתוֹת הֵיכַל יְהוָה וְאֶת־הָאֹמְנוֹת אֲשֶׁר צִפָּה חִזְקִיָּה מֶלֶךְ יְהוּדָה וַיִּתְּנֵם לְמֶלֶךְ אַשּׁוּר׃
    hebrewPlain: בעת ההיא קצץ חזקיה את דלתות היכל יהוה ואת האמנות אשר צפה חזקיה מלך יהודה ויתנם למלך אשור
    kjvRefs:
    - 2 Kings 18:16
    kjvOsis:
    - 2Kgs.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.17
    scripture: tanakh
    name: Tanakh 2 Kings 18:17
    ref: 2 Kings 18:17
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 17
    ordinal: 9953
    text: And the king of Assyria sent Tartan and Rab-saris and Rab-shakeh from Lachish to king Hezekiah with a great army unto Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fullers’ field.
    translation: JPS 1917
    original: וַיִּשְׁלַח מֶלֶךְ־אַשּׁוּר אֶת־תַּרְתָּן וְאֶת־רַב־סָרִיס וְאֶת־רַב־שָׁקֵה מִן־לָכִישׁ אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ בְּחֵיל כָּבֵד יְרוּשָׁלִָם וַיַּעֲלוּ וַיָּבֹאוּ יְרוּשָׁלִַם וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ בִּתְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה אֲשֶׁר בִּמְסִלַּת שְׂדֵה כוֹבֵס׃
    hebrewPlain: וישלח מלך אשור את תרתן ואת רב סריס ואת רב שקה מן לכיש אל המלך חזקיהו בחיל כבד ירושלם ויעלו ויבאו ירושלם ויעלו ויבאו ויעמדו בתעלת הברכה העליונה אשר במסלת שדה כובס
    kjvRefs:
    - 2 Kings 18:17
    kjvOsis:
    - 2Kgs.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.18
    scripture: tanakh
    name: Tanakh 2 Kings 18:18
    ref: 2 Kings 18:18
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 18
    ordinal: 9954
    text: And when they had called to the king, there came out to them Eliakim the son of Hilkiah, who was over the household, and Shebnah the scribe, and Joah the son of Asaph the recorder.
    translation: JPS 1917
    original: וַיִּקְרְאוּ אֶל־הַמֶּלֶךְ וַיֵּצֵא אֲלֵהֶם אֶלְיָקִים בֶּן־חִלְקִיָּהוּ אֲשֶׁר עַל־הַבָּיִת וְשֶׁבְנָה הַסֹּפֵר וְיוֹאָח בֶּן־אָסָף הַמַּזְכִּיר׃
    hebrewPlain: ויקראו אל המלך ויצא אלהם אליקים בן חלקיהו אשר על הבית ושבנה הספר ויואח בן אסף המזכיר
    kjvRefs:
    - 2 Kings 18:18
    kjvOsis:
    - 2Kgs.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.19
    scripture: tanakh
    name: Tanakh 2 Kings 18:19
    ref: 2 Kings 18:19
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 19
    ordinal: 9955
    text: 'And Rab-shakeh said unto them: ‘Say ye now to Hezekiah: Thus saith the great king, the king of Assyria: What confidence is this wherein thou trustest?'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם רַב־שָׁקֵה אִמְרוּ־נָא אֶל־חִזְקִיָּהוּ כֹּה־אָמַר הַמֶּלֶךְ הַגָּדוֹל מֶלֶךְ אַשּׁוּר מָה הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ׃
    hebrewPlain: ויאמר אלהם רב שקה אמרו נא אל חזקיהו כה אמר המלך הגדול מלך אשור מה הבטחון הזה אשר בטחת
    kjvRefs:
    - 2 Kings 18:19
    kjvOsis:
    - 2Kgs.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.20
    scripture: tanakh
    name: Tanakh 2 Kings 18:20
    ref: 2 Kings 18:20
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 20
    ordinal: 9956
    text: Sayest thou that a mere word of the lips is counsel and strength for the war? Now on whom dost thou trust, that thou hast rebelled against me?
    translation: JPS 1917
    original: אָמַרְתָּ אַךְ־דְּבַר־שְׂפָתַיִם עֵצָה וּגְבוּרָה לַמִּלְחָמָה עַתָּה עַל־מִי בָטַחְתָּ כִּי מָרַדְתָּ בִּי׃
    hebrewPlain: אמרת אך דבר שפתים עצה וגבורה למלחמה עתה על מי בטחת כי מרדת בי
    kjvRefs:
    - 2 Kings 18:20
    kjvOsis:
    - 2Kgs.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.21
    scripture: tanakh
    name: Tanakh 2 Kings 18:21
    ref: 2 Kings 18:21
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 21
    ordinal: 9957
    text: Now, behold, thou trustest upon the staff of this bruised reed, even upon Egypt; whereon if a man lean, it will go into his hand, and pierce it; so is Pharaoh king of Egypt unto all that trust on him.
    translation: JPS 1917
    original: עַתָּה הִנֵּה בָטַחְתָּ לְּךָ עַל־מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ הַזֶּה עַל־מִצְרַיִם אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו וּבָא בְכַפּוֹ וּנְקָבָהּ כֵּן פַּרְעֹה מֶלֶךְ־מִצְרַיִם לְכָל־הַבֹּטְחִים עָלָיו׃
    hebrewPlain: עתה הנה בטחת לך על משענת הקנה הרצוץ הזה על מצרים אשר יסמך איש עליו ובא בכפו ונקבה כן פרעה מלך מצרים לכל הבטחים עליו
    kjvRefs:
    - 2 Kings 18:21
    kjvOsis:
    - 2Kgs.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.22
    scripture: tanakh
    name: Tanakh 2 Kings 18:22
    ref: 2 Kings 18:22
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 22
    ordinal: 9958
    text: 'But if ye say unto me: We trust in the LORD our God; is not that He, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and to Jerusalem: Ye shall worship before this altar in Jerusalem?'
    translation: JPS 1917
    original: וְכִי־תֹאמְרוּן אֵלַי אֶל־יְהוָה אֱלֹהֵינוּ בָּטָחְנוּ הֲלוֹא־הוּא אֲשֶׁר הֵסִיר חִזְקִיָּהוּ אֶת־בָּמֹתָיו וְאֶת־מִזְבְּחֹתָיו וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לִפְנֵי הַמִּזְבֵּחַ הַזֶּה תִּשְׁתַּחֲווּ בִּירוּשָׁלִָם׃
    hebrewPlain: וכי תאמרון אלי אל יהוה אלהינו בטחנו הלוא הוא אשר הסיר חזקיהו את במתיו ואת מזבחתיו ויאמר ליהודה ולירושלם לפני המזבח הזה תשתחוו בירושלם
    kjvRefs:
    - 2 Kings 18:22
    kjvOsis:
    - 2Kgs.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.23
    scripture: tanakh
    name: Tanakh 2 Kings 18:23
    ref: 2 Kings 18:23
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 23
    ordinal: 9959
    text: Now therefore, I pray thee, make a wager with my master the king of Assyria, and I will give thee two thousand horses, if thou be able on thy part to set riders upon them.
    translation: JPS 1917
    original: וְעַתָּה הִתְעָרֶב נָא אֶת־אֲדֹנִי אֶת־מֶלֶךְ אַשּׁוּר וְאֶתְּנָה לְךָ אַלְפַּיִם סוּסִים אִם־תּוּכַל לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם׃
    hebrewPlain: ועתה התערב נא את אדני את מלך אשור ואתנה לך אלפים סוסים אם תוכל לתת לך רכבים עליהם
    kjvRefs:
    - 2 Kings 18:23
    kjvOsis:
    - 2Kgs.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.24
    scripture: tanakh
    name: Tanakh 2 Kings 18:24
    ref: 2 Kings 18:24
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 24
    ordinal: 9960
    text: How then canst thou turn away the face of one captain, even of the least of my masters servants? and yet thou puttest thy trust on Egypt for chariots and for horsemen!
    translation: JPS 1917
    original: וְאֵיךְ תָּשִׁיב אֵת פְּנֵי פַחַת אַחַד עַבְדֵי אֲדֹנִי הַקְּטַנִּים וַתִּבְטַח לְךָ עַל־מִצְרַיִם לְרֶכֶב וּלְפָרָשִׁים׃
    hebrewPlain: ואיך תשיב את פני פחת אחד עבדי אדני הקטנים ותבטח לך על מצרים לרכב ולפרשים
    kjvRefs:
    - 2 Kings 18:24
    kjvOsis:
    - 2Kgs.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.25
    scripture: tanakh
    name: Tanakh 2 Kings 18:25
    ref: 2 Kings 18:25
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 25
    ordinal: 9961
    text: 'Am I now come up without the LORD against this place to destroy it? The LORD said unto me: Go up against this land, destroy it.’'
    translation: JPS 1917
    original: עַתָּה הֲמִבַּלְעֲדֵי יְהוָה עָלִיתִי עַל־הַמָּקוֹם הַזֶּה לְהַשְׁחִתוֹ יְהוָה אָמַר אֵלַי עֲלֵה עַל־הָאָרֶץ הַזֹּאת וְהַשְׁחִיתָהּ׃
    hebrewPlain: עתה המבלעדי יהוה עליתי על המקום הזה להשחתו יהוה אמר אלי עלה על הארץ הזאת והשחיתה
    kjvRefs:
    - 2 Kings 18:25
    kjvOsis:
    - 2Kgs.18.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.26
    scripture: tanakh
    name: Tanakh 2 Kings 18:26
    ref: 2 Kings 18:26
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 26
    ordinal: 9962
    text: 'Then said Eliakim the son of Hilkiah, and Shebnah, and Joah, unto Rab-shakeh: ‘Speak, I pray thee, to thy servants in the Aramean language; for we understand it; and speak not with us in the Jews’ language, in the ears of the people that are on the wall.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶלְיָקִים בֶּן־חִלְקִיָּהוּ וְשֶׁבְנָה וְיוֹאָח אֶל־רַב־שָׁקֵה דַּבֶּר־נָא אֶל־עֲבָדֶיךָ אֲרָמִית כִּי שֹׁמְעִים אֲנָחְנוּ וְאַל־תְּדַבֵּר עִמָּנוּ יְהוּדִית בְּאָזְנֵי הָעָם אֲשֶׁר עַל־הַחֹמָה׃
    hebrewPlain: ויאמר אליקים בן חלקיהו ושבנה ויואח אל רב שקה דבר נא אל עבדיך ארמית כי שמעים אנחנו ואל תדבר עמנו יהודית באזני העם אשר על החמה
    kjvRefs:
    - 2 Kings 18:26
    kjvOsis:
    - 2Kgs.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.27
    scripture: tanakh
    name: Tanakh 2 Kings 18:27
    ref: 2 Kings 18:27
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 27
    ordinal: 9963
    text: 'But Rab-shakeh said unto them: ‘Hath my master sent me to thy master, and to thee, to speak these words? hath he not sent me to the men that sit on the wall, to eat their own dung, and to drink their own water with you?’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵיהֶם רַב־שָׁקֵה הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה הֲלֹא עַל־הָאֲנָשִׁים הַיֹּשְׁבִים עַל־הַחֹמָה לֶאֱכֹל אֶת חריהם [צוֹאָתָם] וְלִשְׁתּוֹת אֶת־שיניהם [מימֵי] [רַגְלֵיהֶם] עִמָּכֶם׃
    hebrewPlain: ויאמר אליהם רב שקה העל אדניך ואליך שלחני אדני לדבר את הדברים האלה הלא על האנשים הישבים על החמה לאכל את חריהם [צואתם] ולשתות את שיניהם [מימי] [רגליהם] עמכם
    kjvRefs:
    - 2 Kings 18:27
    kjvOsis:
    - 2Kgs.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.28
    scripture: tanakh
    name: Tanakh 2 Kings 18:28
    ref: 2 Kings 18:28
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 28
    ordinal: 9964
    text: 'Then Rab-shakeh stood, and cried with a loud voice in the Jews’ language, and spoke, saying: ‘Hear ye the word of the great king, the king of Assyria.'
    translation: JPS 1917
    original: וַיַּעֲמֹד רַב־שָׁקֵה וַיִּקְרָא בְקוֹל־גָּדוֹל יְהוּדִית וַיְדַבֵּר וַיֹּאמֶר שִׁמְעוּ דְּבַר־הַמֶּלֶךְ הַגָּדוֹל מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: ויעמד רב שקה ויקרא בקול גדול יהודית וידבר ויאמר שמעו דבר המלך הגדול מלך אשור
    kjvRefs:
    - 2 Kings 18:28
    kjvOsis:
    - 2Kgs.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.29
    scripture: tanakh
    name: Tanakh 2 Kings 18:29
    ref: 2 Kings 18:29
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 29
    ordinal: 9965
    text: 'Thus saith the king: Let not Hezekiah beguile you; for he will not be able to deliver you out of his hand;'
    translation: JPS 1917
    original: כֹּה אָמַר הַמֶּלֶךְ אַל־יַשִּׁיא לָכֶם חִזְקִיָּהוּ כִּי־לֹא יוּכַל לְהַצִּיל אֶתְכֶם מִיָּדוֹ׃
    hebrewPlain: כה אמר המלך אל ישיא לכם חזקיהו כי לא יוכל להציל אתכם מידו
    kjvRefs:
    - 2 Kings 18:29
    kjvOsis:
    - 2Kgs.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.30
    scripture: tanakh
    name: Tanakh 2 Kings 18:30
    ref: 2 Kings 18:30
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 30
    ordinal: 9966
    text: 'neither let Hezekiah make you trust in the LORD, saying: The LORD will surely deliver us, and this city shall not be given into the hand of the king of Assyria.'
    translation: JPS 1917
    original: וְאַל־יַבְטַח אֶתְכֶם חִזְקִיָּהוּ אֶל־יְהוָה לֵאמֹר הַצֵּל יַצִּילֵנוּ יְהוָה וְלֹא תִנָּתֵן אֶת־הָעִיר הַזֹּאת בְּיַד מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: ואל יבטח אתכם חזקיהו אל יהוה לאמר הצל יצילנו יהוה ולא תנתן את העיר הזאת ביד מלך אשור
    kjvRefs:
    - 2 Kings 18:30
    kjvOsis:
    - 2Kgs.18.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.31
    scripture: tanakh
    name: Tanakh 2 Kings 18:31
    ref: 2 Kings 18:31
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 31
    ordinal: 9967
    text: 'Hearken not to Hezekiah; for thus saith the king of Assyria: Make your peace with me, and come out to me; and eat ye every one of his vine, and every one of his fig-tree, and drink ye every one the waters of his own cistern;'
    translation: JPS 1917
    original: אַל־תִּשְׁמְעוּ אֶל־חִזְקִיָּהוּ כִּי כֹה אָמַר מֶלֶךְ אַשּׁוּר עֲשׂוּ־אִתִּי בְרָכָה וּצְאוּ אֵלַי וְאִכְלוּ אִישׁ־גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ וּשְׁתוּ אִישׁ מֵי־בוֹרוֹ׃
    hebrewPlain: אל תשמעו אל חזקיהו כי כה אמר מלך אשור עשו אתי ברכה וצאו אלי ואכלו איש גפנו ואיש תאנתו ושתו איש מי בורו
    kjvRefs:
    - 2 Kings 18:31
    kjvOsis:
    - 2Kgs.18.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.32
    scripture: tanakh
    name: Tanakh 2 Kings 18:32
    ref: 2 Kings 18:32
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 32
    ordinal: 9968
    text: 'until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of olive-trees and of honey, that ye may live, and not die; and hearken not unto Hezekiah, when he persuadeth you, saying: The LORD will deliver us.'
    translation: JPS 1917
    original: עַד־בֹּאִי וְלָקַחְתִּי אֶתְכֶם אֶל־אֶרֶץ כְּאַרְצְכֶם אֶרֶץ דָּגָן וְתִירוֹשׁ אֶרֶץ לֶחֶם וּכְרָמִים אֶרֶץ זֵית יִצְהָר וּדְבַשׁ וִחְיוּ וְלֹא תָמֻתוּ וְאַל־תִּשְׁמְעוּ אֶל־חִזְקִיָּהוּ כִּי־יַסִּית אֶתְכֶם לֵאמֹר יְהוָה יַצִּילֵנוּ׃
    hebrewPlain: עד באי ולקחתי אתכם אל ארץ כארצכם ארץ דגן ותירוש ארץ לחם וכרמים ארץ זית יצהר ודבש וחיו ולא תמתו ואל תשמעו אל חזקיהו כי יסית אתכם לאמר יהוה יצילנו
    kjvRefs:
    - 2 Kings 18:32
    kjvOsis:
    - 2Kgs.18.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.33
    scripture: tanakh
    name: Tanakh 2 Kings 18:33
    ref: 2 Kings 18:33
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 33
    ordinal: 9969
    text: Hath any of the gods of the nations ever delivered his land out of the hand of the king of Assyria?
    translation: JPS 1917
    original: הַהַצֵּל הִצִּילוּ אֱלֹהֵי הַגּוֹיִם אִישׁ אֶת־אַרְצוֹ מִיַּד מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: ההצל הצילו אלהי הגוים איש את ארצו מיד מלך אשור
    kjvRefs:
    - 2 Kings 18:33
    kjvOsis:
    - 2Kgs.18.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.34
    scripture: tanakh
    name: Tanakh 2 Kings 18:34
    ref: 2 Kings 18:34
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 34
    ordinal: 9970
    text: Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, of Hena, and Ivvah? have they delivered Samaria out of my hand?
    translation: JPS 1917
    original: אַיֵּה אֱלֹהֵי חֲמָת וְאַרְפָּד אַיֵּה אֱלֹהֵי סְפַרְוַיִם הֵנַע וְעִוָּה כִּי־הִצִּילוּ אֶת־שֹׁמְרוֹן מִיָּדִי׃
    hebrewPlain: איה אלהי חמת וארפד איה אלהי ספרוים הנע ועוה כי הצילו את שמרון מידי
    kjvRefs:
    - 2 Kings 18:34
    kjvOsis:
    - 2Kgs.18.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.35
    scripture: tanakh
    name: Tanakh 2 Kings 18:35
    ref: 2 Kings 18:35
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 35
    ordinal: 9971
    text: Who are they among all the gods of the countries, that have delivered their country out of my hand, that the LORD should deliver Jerusalem out of my hand?’
    translation: JPS 1917
    original: מִי בְּכָל־אֱלֹהֵי הָאֲרָצוֹת אֲשֶׁר־הִצִּילוּ אֶת־אַרְצָם מִיָּדִי כִּי־יַצִּיל יְהוָה אֶת־יְרוּשָׁלִַם מִיָּדִי׃
    hebrewPlain: מי בכל אלהי הארצות אשר הצילו את ארצם מידי כי יציל יהוה את ירושלם מידי
    kjvRefs:
    - 2 Kings 18:35
    kjvOsis:
    - 2Kgs.18.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.36
    scripture: tanakh
    name: Tanakh 2 Kings 18:36
    ref: 2 Kings 18:36
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 36
    ordinal: 9972
    text: 'But the people held their peace, and answered him not a word; for the king’s commandment was, saying: ‘Answer him not.’'
    translation: JPS 1917
    original: וְהֶחֱרִישׁוּ הָעָם וְלֹא־עָנוּ אֹתוֹ דָּבָר כִּי־מִצְוַת הַמֶּלֶךְ הִיא לֵאמֹר לֹא תַעֲנֻהוּ׃
    hebrewPlain: והחרישו העם ולא ענו אתו דבר כי מצות המלך היא לאמר לא תענהו
    kjvRefs:
    - 2 Kings 18:36
    kjvOsis:
    - 2Kgs.18.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.18.37
    scripture: tanakh
    name: Tanakh 2 Kings 18:37
    ref: 2 Kings 18:37
    book: 2Kgs
    section: neviim
    chapter: 18
    verse: 37
    ordinal: 9973
    text: Then came Eliakim the son of Hilkiah, who was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder, to Hezekiah with their clothes rent, and told him the words of Rab-shakeh.
    translation: JPS 1917
    original: וַיָּבֹא אֶלְיָקִים בֶּן־חִלְקִיָּה אֲשֶׁר־עַל־הַבַּיִת וְשֶׁבְנָא הַסֹּפֵר וְיוֹאָח בֶּן־אָסָף הַמַּזְכִּיר אֶל־חִזְקִיָּהוּ קְרוּעֵי בְגָדִים וַיַּגִּדוּ לוֹ דִּבְרֵי רַב־שָׁקֵה׃
    hebrewPlain: ויבא אליקים בן חלקיה אשר על הבית ושבנא הספר ויואח בן אסף המזכיר אל חזקיהו קרועי בגדים ויגדו לו דברי רב שקה
    kjvRefs:
    - 2 Kings 18:37
    kjvOsis:
    - 2Kgs.18.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.18
- type: TanakhVerse
  data:
    osis: 2Kgs.19.1
    scripture: tanakh
    name: Tanakh 2 Kings 19:1
    ref: 2 Kings 19:1
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 1
    ordinal: 9974
    text: And it came to pass, when king Hezekiah heard it, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD.
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ הַמֶּלֶךְ חִזְקִיָּהוּ וַיִּקְרַע אֶת־בְּגָדָיו וַיִּתְכַּס בַּשָּׂק וַיָּבֹא בֵּית יְהוָה׃
    hebrewPlain: ויהי כשמע המלך חזקיהו ויקרע את בגדיו ויתכס בשק ויבא בית יהוה
    kjvRefs:
    - 2 Kings 19:1
    kjvOsis:
    - 2Kgs.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.2
    scripture: tanakh
    name: Tanakh 2 Kings 19:2
    ref: 2 Kings 19:2
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 2
    ordinal: 9975
    text: And he sent Eliakim, who was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, unto Isaiah the prophet the son of Amoz.
    translation: JPS 1917
    original: וַיִּשְׁלַח אֶת־אֶלְיָקִים אֲשֶׁר־עַל־הַבַּיִת וְשֶׁבְנָא הַסֹּפֵר וְאֵת זִקְנֵי הַכֹּהֲנִים מִתְכַּסִּים בַּשַּׂקִּים אֶל־יְשַׁעְיָהוּ הַנָּבִיא בֶּן־אָמוֹץ׃
    hebrewPlain: וישלח את אליקים אשר על הבית ושבנא הספר ואת זקני הכהנים מתכסים בשקים אל ישעיהו הנביא בן אמוץ
    kjvRefs:
    - 2 Kings 19:2
    kjvOsis:
    - 2Kgs.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.3
    scripture: tanakh
    name: Tanakh 2 Kings 19:3
    ref: 2 Kings 19:3
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 3
    ordinal: 9976
    text: 'And they said unto him: ‘Thus saith Hezekiah: This day is a day of trouble, and of rebuke, and of contumely; for the children are come to the birth, and there is not strength to bring forth.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו כֹּה אָמַר חִזְקִיָּהוּ יוֹם־צָרָה וְתוֹכֵחָה וּנְאָצָה הַיּוֹם הַזֶּה כִּי בָאוּ בָנִים עַד־מַשְׁבֵּר וְכֹחַ אַיִן לְלֵדָה׃
    hebrewPlain: ויאמרו אליו כה אמר חזקיהו יום צרה ותוכחה ונאצה היום הזה כי באו בנים עד משבר וכח אין ללדה
    kjvRefs:
    - 2 Kings 19:3
    kjvOsis:
    - 2Kgs.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.4
    scripture: tanakh
    name: Tanakh 2 Kings 19:4
    ref: 2 Kings 19:4
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 4
    ordinal: 9977
    text: It may be the LORD thy God will hear all the words of Rabshakeh, whom the king of Assyria his master hath sent to taunt the living God, and will rebuke the words which the LORD thy God hath heard; wherefore make prayer for the remnant that is left.’
    translation: JPS 1917
    original: אוּלַי יִשְׁמַע יְהוָה אֱלֹהֶיךָ אֵת כָּל־דִּבְרֵי רַב־שָׁקֵה אֲשֶׁר שְׁלָחוֹ מֶלֶךְ־אַשּׁוּר אֲדֹנָיו לְחָרֵף אֱלֹהִים חַי וְהוֹכִיחַ בַּדְּבָרִים אֲשֶׁר שָׁמַע יְהוָה אֱלֹהֶיךָ וְנָשָׂאתָ תְפִלָּה בְּעַד הַשְּׁאֵרִית הַנִּמְצָאָה׃
    hebrewPlain: אולי ישמע יהוה אלהיך את כל דברי רב שקה אשר שלחו מלך אשור אדניו לחרף אלהים חי והוכיח בדברים אשר שמע יהוה אלהיך ונשאת תפלה בעד השארית הנמצאה
    kjvRefs:
    - 2 Kings 19:4
    kjvOsis:
    - 2Kgs.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.5
    scripture: tanakh
    name: Tanakh 2 Kings 19:5
    ref: 2 Kings 19:5
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 5
    ordinal: 9978
    text: So the servants of king Hezekiah came to Isaiah.
    translation: JPS 1917
    original: וַיָּבֹאוּ עַבְדֵי הַמֶּלֶךְ חִזְקִיָּהוּ אֶל־יְשַׁעַיָהוּ׃
    hebrewPlain: ויבאו עבדי המלך חזקיהו אל ישעיהו
    kjvRefs:
    - 2 Kings 19:5
    kjvOsis:
    - 2Kgs.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.6
    scripture: tanakh
    name: Tanakh 2 Kings 19:6
    ref: 2 Kings 19:6
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 6
    ordinal: 9979
    text: 'And Isaiah said unto them: ‘Thus shall ye say to your master: Thus saith the LORD: Be not afraid of the words that thou hast heard, wherewith the servants of the king of Assyria have blasphemed Me.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם יְשַׁעְיָהוּ כֹּה תֹאמְרוּן אֶל־אֲדֹנֵיכֶם כֹּה אָמַר יְהוָה אַל־תִּירָא מִפְּנֵי הַדְּבָרִים אֲשֶׁר שָׁמַעְתָּ אֲשֶׁר גִּדְּפוּ נַעֲרֵי מֶלֶךְ־אַשּׁוּר אֹתִי׃
    hebrewPlain: ויאמר להם ישעיהו כה תאמרון אל אדניכם כה אמר יהוה אל תירא מפני הדברים אשר שמעת אשר גדפו נערי מלך אשור אתי
    kjvRefs:
    - 2 Kings 19:6
    kjvOsis:
    - 2Kgs.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.7
    scripture: tanakh
    name: Tanakh 2 Kings 19:7
    ref: 2 Kings 19:7
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 7
    ordinal: 9980
    text: Behold, I will put a spirit in him, and he shall hear a rumour, and shall return to his own land; and I will cause him to fall by the sword in his own land.’
    translation: JPS 1917
    original: הִנְנִי נֹתֵן בּוֹ רוּחַ וְשָׁמַע שְׁמוּעָה וְשָׁב לְאַרְצוֹ וְהִפַּלְתִּיו בַּחֶרֶב בְּאַרְצוֹ׃
    hebrewPlain: הנני נתן בו רוח ושמע שמועה ושב לארצו והפלתיו בחרב בארצו
    kjvRefs:
    - 2 Kings 19:7
    kjvOsis:
    - 2Kgs.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.8
    scripture: tanakh
    name: Tanakh 2 Kings 19:8
    ref: 2 Kings 19:8
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 8
    ordinal: 9981
    text: So Rab-shakeh returned, and found the king of Assyria warring against Libnah; for he had heard that he was departed from Lachish.
    translation: JPS 1917
    original: וַיָּשָׁב רַב־שָׁקֵה וַיִּמְצָא אֶת־מֶלֶךְ אַשּׁוּר נִלְחָם עַל־לִבְנָה כִּי שָׁמַע כִּי נָסַע מִלָּכִישׁ׃
    hebrewPlain: וישב רב שקה וימצא את מלך אשור נלחם על לבנה כי שמע כי נסע מלכיש
    kjvRefs:
    - 2 Kings 19:8
    kjvOsis:
    - 2Kgs.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.9
    scripture: tanakh
    name: Tanakh 2 Kings 19:9
    ref: 2 Kings 19:9
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 9
    ordinal: 9982
    text: 'And when he heard say of Tirhakah king of Ethiopia: ‘Behold, he is come out to fight against thee’; he sent messengers again unto Hezekiah, saying:'
    translation: JPS 1917
    original: וַיִּשְׁמַע אֶל־תִּרְהָקָה מֶלֶך־כּוּשׁ לֵאמֹר הִנֵּה יָצָא לְהִלָּחֵם אִתָּךְ וַיָּשָׁב וַיִּשְׁלַח מַלְאָכִים אֶל־חִזְקִיָּהוּ לֵאמֹר׃
    hebrewPlain: וישמע אל תרהקה מלך כוש לאמר הנה יצא להלחם אתך וישב וישלח מלאכים אל חזקיהו לאמר
    kjvRefs:
    - 2 Kings 19:9
    kjvOsis:
    - 2Kgs.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.10
    scripture: tanakh
    name: Tanakh 2 Kings 19:10
    ref: 2 Kings 19:10
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 10
    ordinal: 9983
    text: '’Thus shall ye speak to Hezekiah king of Judah, saying: Let not thy God in whom thou trustest beguile thee, saying: Jerusalem shall not be given into the hand of the king of Assyria.'
    translation: JPS 1917
    original: כֹּה תֹאמְרוּן אֶל־חִזְקִיָּהוּ מֶלֶךְ־יְהוּדָה לֵאמֹר אַל־יַשִּׁאֲךָ אֱלֹהֶיךָ אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ לֵאמֹר לֹא תִנָּתֵן יְרוּשָׁלִַם בְּיַד מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: כה תאמרון אל חזקיהו מלך יהודה לאמר אל ישאך אלהיך אשר אתה בטח בו לאמר לא תנתן ירושלם ביד מלך אשור
    kjvRefs:
    - 2 Kings 19:10
    kjvOsis:
    - 2Kgs.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.11
    scripture: tanakh
    name: Tanakh 2 Kings 19:11
    ref: 2 Kings 19:11
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 11
    ordinal: 9984
    text: Behold, thou hast heard what the kings of Assyria have done to all lands, by destroying them utterly; and shalt thou be delivered?
    translation: JPS 1917
    original: הִנֵּה אַתָּה שָׁמַעְתָּ אֵת אֲשֶׁר עָשׂוּ מַלְכֵי אַשּׁוּר לְכָל־הָאֲרָצוֹת לְהַחֲרִימָם וְאַתָּה תִּנָּצֵל׃
    hebrewPlain: הנה אתה שמעת את אשר עשו מלכי אשור לכל הארצות להחרימם ואתה תנצל
    kjvRefs:
    - 2 Kings 19:11
    kjvOsis:
    - 2Kgs.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.12
    scripture: tanakh
    name: Tanakh 2 Kings 19:12
    ref: 2 Kings 19:12
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 12
    ordinal: 9985
    text: Have the gods of the nations delivered them, which my fathers have destroyed, Gozan, and Haran, and Rezeph, and the children of Eden that were in Telassar?
    translation: JPS 1917
    original: הַהִצִּילוּ אֹתָם אֱלֹהֵי הַגּוֹיִם אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי אֶת־גּוֹזָן וְאֶת־חָרָן וְרֶצֶף וּבְנֵי־עֶדֶן אֲשֶׁר בִּתְלַאשָּׂר׃
    hebrewPlain: ההצילו אתם אלהי הגוים אשר שחתו אבותי את גוזן ואת חרן ורצף ובני עדן אשר בתלאשר
    kjvRefs:
    - 2 Kings 19:12
    kjvOsis:
    - 2Kgs.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.13
    scripture: tanakh
    name: Tanakh 2 Kings 19:13
    ref: 2 Kings 19:13
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 13
    ordinal: 9986
    text: Where is the king of Hamath, and the king of Arpad, and the king of the city of Sepharvaim, of Hena, and Ivvah?’
    translation: JPS 1917
    original: אַיּוֹ מֶלֶךְ־חֲמָת וּמֶלֶךְ אַרְפָּד וּמֶלֶךְ לָעִיר סְפַרְוָיִם הֵנַע וְעִוָּה׃
    hebrewPlain: איו מלך חמת ומלך ארפד ומלך לעיר ספרוים הנע ועוה
    kjvRefs:
    - 2 Kings 19:13
    kjvOsis:
    - 2Kgs.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.14
    scripture: tanakh
    name: Tanakh 2 Kings 19:14
    ref: 2 Kings 19:14
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 14
    ordinal: 9987
    text: And Hezekiah received the letter from the hand of the messengers, and read it; and Hezekiah went up unto the house of the LORD, and spread it before the LORD.
    translation: JPS 1917
    original: וַיִּקַּח חִזְקִיָּהוּ אֶת־הַסְּפָרִים מִיַּד הַמַּלְאָכִים וַיִּקְרָאֵם וַיַּעַל בֵּית יְהוָה וַיִּפְרְשֵׂהוּ חִזְקִיָּהוּ לִפְנֵי יְהוָה׃
    hebrewPlain: ויקח חזקיהו את הספרים מיד המלאכים ויקראם ויעל בית יהוה ויפרשהו חזקיהו לפני יהוה
    kjvRefs:
    - 2 Kings 19:14
    kjvOsis:
    - 2Kgs.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.15
    scripture: tanakh
    name: Tanakh 2 Kings 19:15
    ref: 2 Kings 19:15
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 15
    ordinal: 9988
    text: 'And Hezekiah prayed before the LORD, and said: ‘O LORD, the God of Israel, that sittest upon the cherubim, Thou art the God, even Thou alone, of all the kingdoms of the earth; Thou hast made heaven and earth.'
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל חִזְקִיָּהוּ לִפְנֵי יְהוָה וַיֹּאמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל יֹשֵׁב הַכְּרֻבִים אַתָּה־הוּא הָאֱלֹהִים לְבַדְּךָ לְכֹל מַמְלְכוֹת הָאָרֶץ אַתָּה עָשִׂיתָ אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ׃
    hebrewPlain: ויתפלל חזקיהו לפני יהוה ויאמר יהוה אלהי ישראל ישב הכרבים אתה הוא האלהים לבדך לכל ממלכות הארץ אתה עשית את השמים ואת הארץ
    kjvRefs:
    - 2 Kings 19:15
    kjvOsis:
    - 2Kgs.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.16
    scripture: tanakh
    name: Tanakh 2 Kings 19:16
    ref: 2 Kings 19:16
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 16
    ordinal: 9989
    text: Incline Thine ear, O LORD, and hear; open Thine eyes, O LORD, and see; and hear the words of Sennacherib, wherewith he hath sent him to taunt the living God.
    translation: JPS 1917
    original: הַטֵּה יְהוָה אָזְנְךָ וּשֲׁמָע פְּקַח יְהוָה עֵינֶיךָ וּרְאֵה וּשְׁמַע אֵת דִּבְרֵי סַנְחֵרִיב אֲשֶׁר שְׁלָחוֹ לְחָרֵף אֱלֹהִים חָי׃
    hebrewPlain: הטה יהוה אזנך ושמע פקח יהוה עיניך וראה ושמע את דברי סנחריב אשר שלחו לחרף אלהים חי
    kjvRefs:
    - 2 Kings 19:16
    kjvOsis:
    - 2Kgs.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.17
    scripture: tanakh
    name: Tanakh 2 Kings 19:17
    ref: 2 Kings 19:17
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 17
    ordinal: 9990
    text: Of a truth, LORD, the kings of Assyria have laid waste the nations and their lands,
    translation: JPS 1917
    original: אָמְנָם יְהוָה הֶחֱרִיבוּ מַלְכֵי אַשּׁוּר אֶת־הַגּוֹיִם וְאֶת־אַרְצָם׃
    hebrewPlain: אמנם יהוה החריבו מלכי אשור את הגוים ואת ארצם
    kjvRefs:
    - 2 Kings 19:17
    kjvOsis:
    - 2Kgs.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.18
    scripture: tanakh
    name: Tanakh 2 Kings 19:18
    ref: 2 Kings 19:18
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 18
    ordinal: 9991
    text: and have cast their gods into the fire; for they were no gods, but the work of men’s hands, wood and stone; therefore they have destroyed them.
    translation: JPS 1917
    original: וְנָתְנוּ אֶת־אֱלֹהֵיהֶם בָּאֵשׁ כִּי לֹא אֱלֹהִים הֵמָּה כִּי אִם־מַעֲשֵׂה יְדֵי־אָדָם עֵץ וָאֶבֶן וַיְאַבְּדוּם׃
    hebrewPlain: ונתנו את אלהיהם באש כי לא אלהים המה כי אם מעשה ידי אדם עץ ואבן ויאבדום
    kjvRefs:
    - 2 Kings 19:18
    kjvOsis:
    - 2Kgs.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.19
    scripture: tanakh
    name: Tanakh 2 Kings 19:19
    ref: 2 Kings 19:19
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 19
    ordinal: 9992
    text: Now therefore, O LORD our God, save Thou us, I beseech Thee, out of his hand, that all the kingdoms of the earth may know that Thou art the LORD God, even Thou only.’
    translation: JPS 1917
    original: וְעַתָּה יְהוָה אֱלֹהֵינוּ הוֹשִׁיעֵנוּ נָא מִיָּדוֹ וְיֵדְעוּ כָּל־מַמְלְכוֹת הָאָרֶץ כִּי אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ׃
    hebrewPlain: ועתה יהוה אלהינו הושיענו נא מידו וידעו כל ממלכות הארץ כי אתה יהוה אלהים לבדך
    kjvRefs:
    - 2 Kings 19:19
    kjvOsis:
    - 2Kgs.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.20
    scripture: tanakh
    name: Tanakh 2 Kings 19:20
    ref: 2 Kings 19:20
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 20
    ordinal: 9993
    text: 'Then Isaiah the son of Amoz sent to Hezekiah, saying: ‘Thus saith the LORD, the God of Israel: Whereas thou hast prayed to Me against Sennacherib king of Assyria, I have heard thee.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יְשַׁעְיָהוּ בֶן־אָמוֹץ אֶל־חִזְקִיָּהוּ לֵאמֹר כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי אֶל־סַנְחֵרִב מֶלֶךְ־אַשּׁוּר שָׁמָעְתִּי׃
    hebrewPlain: וישלח ישעיהו בן אמוץ אל חזקיהו לאמר כה אמר יהוה אלהי ישראל אשר התפללת אלי אל סנחרב מלך אשור שמעתי
    kjvRefs:
    - 2 Kings 19:20
    kjvOsis:
    - 2Kgs.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.21
    scripture: tanakh
    name: Tanakh 2 Kings 19:21
    ref: 2 Kings 19:21
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 21
    ordinal: 9994
    text: 'This is the word that the LORD hath spoken concerning him: The virgin daughter of Zion Hath despised thee and laughed thee to scorn; The daughter of Jerusalem Hath shaken her head at thee.'
    translation: JPS 1917
    original: זֶה הַדָּבָר אֲשֶׁר־דִּבֶּר יְהוָה עָלָיו בָּזָה לְךָ לָעֲגָה לְךָ בְּתוּלַת בַּת־צִיּוֹן אַחֲרֶיךָ רֹאשׁ הֵנִיעָה בַּת יְרוּשָׁלִָם׃
    hebrewPlain: זה הדבר אשר דבר יהוה עליו בזה לך לעגה לך בתולת בת ציון אחריך ראש הניעה בת ירושלם
    kjvRefs:
    - 2 Kings 19:21
    kjvOsis:
    - 2Kgs.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.22
    scripture: tanakh
    name: Tanakh 2 Kings 19:22
    ref: 2 Kings 19:22
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 22
    ordinal: 9995
    text: Whom hast thou taunted and Blasphemed? And against whom hast thou exalted thy voice? Yea, thou hast lifted up thine eyes on high, Even against the Holy One of Israel!
    translation: JPS 1917
    original: אֶת־מִי חֵרַפְתָּ וְגִדַּפְתָּ וְעַל־מִי הֲרִימוֹתָ קּוֹל וַתִּשָּׂא מָרוֹם עֵינֶיךָ עַל־קְדוֹשׁ יִשְׂרָאֵל׃
    hebrewPlain: את מי חרפת וגדפת ועל מי הרימות קול ותשא מרום עיניך על קדוש ישראל
    kjvRefs:
    - 2 Kings 19:22
    kjvOsis:
    - 2Kgs.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.23
    scripture: tanakh
    name: Tanakh 2 Kings 19:23
    ref: 2 Kings 19:23
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 23
    ordinal: 9996
    text: 'By the messengers thou hast taunted the Lord, And hast said: With the multitude of my chariots Am I come up to the height of the mountains, To the innermost parts of Lebanon; And I have cut down the tall cedars thereof, And the choice cypresses thereof; and I have entered into his farthest lodge, The forest of his fruitful field.'
    translation: JPS 1917
    original: בְּיַד מַלְאָכֶיךָ חֵרַפְתָּ אֲדֹנָי וַתֹּאמֶר ברכב [בְּרֹב] רִכְבִּי אֲנִי עָלִיתִי מְרוֹם הָרִים יַרְכְּתֵי לְבָנוֹן וְאֶכְרֹת קוֹמַת אֲרָזָיו מִבְחוֹר בְּרֹשָׁיו וְאָבוֹאָה מְלוֹן קִצֹּה יַעַר כַּרְמִלּוֹ׃
    hebrewPlain: ביד מלאכיך חרפת אדני ותאמר ברכב [ברב] רכבי אני עליתי מרום הרים ירכתי לבנון ואכרת קומת ארזיו מבחור ברשיו ואבואה מלון קצה יער כרמלו
    kjvRefs:
    - 2 Kings 19:23
    kjvOsis:
    - 2Kgs.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.24
    scripture: tanakh
    name: Tanakh 2 Kings 19:24
    ref: 2 Kings 19:24
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 24
    ordinal: 9997
    text: I have digged and drunk Strange waters, And with the sole of my feet have I dried up All the rivers of Egypt.
    translation: JPS 1917
    original: אֲנִי קַרְתִּי וְשָׁתִיתִי מַיִם זָרִים וְאַחְרִב בְּכַף־פְּעָמַי כֹּל יְאֹרֵי מָצוֹר׃
    hebrewPlain: אני קרתי ושתיתי מים זרים ואחרב בכף פעמי כל יארי מצור
    kjvRefs:
    - 2 Kings 19:24
    kjvOsis:
    - 2Kgs.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.25
    scripture: tanakh
    name: Tanakh 2 Kings 19:25
    ref: 2 Kings 19:25
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 25
    ordinal: 9998
    text: Hast thou not heard? Long ago I made it, In ancient times I fashioned it; Now have I brought it to pass, Yea, it is done; that fortified cities Should be laid waste into ruinous heaps.
    translation: JPS 1917
    original: הֲלֹא־שָׁמַעְתָּ לְמֵרָחוֹק אֹתָהּ עָשִׂיתִי לְמִימֵי קֶדֶם וִיצַרְתִּיהָ עַתָּה הֲבֵיאתִיהָ וּתְהִי לַהְשׁוֹת גַּלִּים נִצִּים עָרִים בְּצֻרוֹת׃
    hebrewPlain: הלא שמעת למרחוק אתה עשיתי למימי קדם ויצרתיה עתה הביאתיה ותהי להשות גלים נצים ערים בצרות
    kjvRefs:
    - 2 Kings 19:25
    kjvOsis:
    - 2Kgs.19.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.26
    scripture: tanakh
    name: Tanakh 2 Kings 19:26
    ref: 2 Kings 19:26
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 26
    ordinal: 9999
    text: Therefore their inhabitants were of small power, They were dismayed and confounded; They were as the grass of the field, And as the green herb, As the grass on the housetops, And as corn blasted before it is grown up.
    translation: JPS 1917
    original: וְיֹשְׁבֵיהֶן קִצְרֵי־יָד חַתּוּ וַיֵּבֹשׁוּ הָיוּ עֵשֶׂב שָׂדֶה וִירַק דֶּשֶׁא חֲצִיר גַּגּוֹת וּשְׁדֵפָה לִפְנֵי קָמָה׃
    hebrewPlain: וישביהן קצרי יד חתו ויבשו היו עשב שדה וירק דשא חציר גגות ושדפה לפני קמה
    kjvRefs:
    - 2 Kings 19:26
    kjvOsis:
    - 2Kgs.19.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.27
    scripture: tanakh
    name: Tanakh 2 Kings 19:27
    ref: 2 Kings 19:27
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 27
    ordinal: 10000
    text: But I know thy sitting down, and thy going out, and thy coming in, And thy raging against Me.
    translation: JPS 1917
    original: וְשִׁבְתְּךָ וְצֵאתְךָ וּבֹאֲךָ יָדָעְתִּי וְאֵת הִתְרַגֶּזְךָ אֵלָי׃
    hebrewPlain: ושבתך וצאתך ובאך ידעתי ואת התרגזך אלי
    kjvRefs:
    - 2 Kings 19:27
    kjvOsis:
    - 2Kgs.19.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.28
    scripture: tanakh
    name: Tanakh 2 Kings 19:28
    ref: 2 Kings 19:28
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 28
    ordinal: 10001
    text: Because of thy raging against Me, And for that thy tumult is come up into Mine ears, Therefore will I put My hook in thy nose, And My bridle in thy lips, And I will turn thee back by the way By which thou camest.
    translation: JPS 1917
    original: יַעַן הִתְרַגֶּזְךָ אֵלַי וְשַׁאֲנַנְךָ עָלָה בְאָזְנָי וְשַׂמְתִּי חַחִי בְּאַפֶּךָ וּמִתְגִּי בִּשְׂפָתֶיךָ וַהֲשִׁבֹתִיךָ בַּדֶּרֶךְ אֲשֶׁר־בָּאתָ בָּהּ׃
    hebrewPlain: יען התרגזך אלי ושאננך עלה באזני ושמתי חחי באפך ומתגי בשפתיך והשבתיך בדרך אשר באת בה
    kjvRefs:
    - 2 Kings 19:28
    kjvOsis:
    - 2Kgs.19.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.29
    scripture: tanakh
    name: Tanakh 2 Kings 19:29
    ref: 2 Kings 19:29
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 29
    ordinal: 10002
    text: 'And this shall be the sign unto thee: ye shall eat this year that which groweth of itself, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruit thereof.'
    translation: JPS 1917
    original: וְזֶה־לְּךָ הָאוֹת אָכוֹל הַשָּׁנָה סָפִיחַ וּבַשָּׁנָה הַשֵּׁנִית סָחִישׁ וּבַשָּׁנָה הַשְּׁלִישִׁית זִרְעוּ וְקִצְרוּ וְנִטְעוּ כְרָמִים וְאִכְלוּ פִרְיָם׃
    hebrewPlain: וזה לך האות אכול השנה ספיח ובשנה השנית סחיש ובשנה השלישית זרעו וקצרו ונטעו כרמים ואכלו פרים
    kjvRefs:
    - 2 Kings 19:29
    kjvOsis:
    - 2Kgs.19.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.30
    scripture: tanakh
    name: Tanakh 2 Kings 19:30
    ref: 2 Kings 19:30
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 30
    ordinal: 10003
    text: And the remnant that is escaped of the house of Judah shall again take root downward, and bear fruit upward.
    translation: JPS 1917
    original: וְיָסְפָה פְּלֵיטַת בֵּית־יְהוּדָה הַנִּשְׁאָרָה שֹׁרֶשׁ לְמָטָּה וְעָשָׂה פְרִי לְמָעְלָה׃
    hebrewPlain: ויספה פליטת בית יהודה הנשארה שרש למטה ועשה פרי למעלה
    kjvRefs:
    - 2 Kings 19:30
    kjvOsis:
    - 2Kgs.19.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.31
    scripture: tanakh
    name: Tanakh 2 Kings 19:31
    ref: 2 Kings 19:31
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 31
    ordinal: 10004
    text: For out of Jerusalem shall go forth a remnant, and out of mount Zion they that shall escape; the zeal of the LORD of hosts shall perform this.
    translation: JPS 1917
    original: כִּי מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית וּפְלֵיטָה מֵהַר צִיּוֹן קִנְאַת יְהוָה [צְבָאוֹת] תַּעֲשֶׂה־זֹּאת׃
    hebrewPlain: כי מירושלם תצא שארית ופליטה מהר ציון קנאת יהוה [צבאות] תעשה זאת
    kjvRefs:
    - 2 Kings 19:31
    kjvOsis:
    - 2Kgs.19.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.32
    scripture: tanakh
    name: Tanakh 2 Kings 19:32
    ref: 2 Kings 19:32
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 32
    ordinal: 10005
    text: 'Therefore thus saith the LORD concerning the king of Assyria: He shall not come unto this city, nor shoot an arrow there, neither shall he come before it with shield, nor cast a mound against it.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר יְהוָה אֶל־מֶלֶךְ אַשּׁוּר לֹא יָבֹא אֶל־הָעִיר הַזֹּאת וְלֹא־יוֹרֶה שָׁם חֵץ וְלֹא־יְקַדְּמֶנָּה מָגֵן וְלֹא־יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה׃
    hebrewPlain: לכן כה אמר יהוה אל מלך אשור לא יבא אל העיר הזאת ולא יורה שם חץ ולא יקדמנה מגן ולא ישפך עליה סללה
    kjvRefs:
    - 2 Kings 19:32
    kjvOsis:
    - 2Kgs.19.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.33
    scripture: tanakh
    name: Tanakh 2 Kings 19:33
    ref: 2 Kings 19:33
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 33
    ordinal: 10006
    text: By the way that he came, by the same shall he return, and he shall not come unto this city, saith the LORD.
    translation: JPS 1917
    original: בַּדֶּרֶךְ אֲשֶׁר־יָבֹא בָּהּ יָשׁוּב וְאֶל־הָעִיר הַזֹּאת לֹא יָבֹא נְאֻם־יְהוָה׃
    hebrewPlain: בדרך אשר יבא בה ישוב ואל העיר הזאת לא יבא נאם יהוה
    kjvRefs:
    - 2 Kings 19:33
    kjvOsis:
    - 2Kgs.19.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.34
    scripture: tanakh
    name: Tanakh 2 Kings 19:34
    ref: 2 Kings 19:34
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 34
    ordinal: 10007
    text: For I will defend this city to save it, for Mine own sake, and for My servant David’s sake.’
    translation: JPS 1917
    original: וְגַנּוֹתִי אֶל־הָעִיר הַזֹּאת לְהוֹשִׁיעָהּ לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי׃
    hebrewPlain: וגנותי אל העיר הזאת להושיעה למעני ולמען דוד עבדי
    kjvRefs:
    - 2 Kings 19:34
    kjvOsis:
    - 2Kgs.19.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.35
    scripture: tanakh
    name: Tanakh 2 Kings 19:35
    ref: 2 Kings 19:35
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 35
    ordinal: 10008
    text: And it came to pass that night, that the angel of the LORD went forth, and smote in the camp of the Assyrians a hundred fourscore and five thousand; and when men arose early in the morning, behold, they were all dead corpses.
    translation: JPS 1917
    original: וַיְהִי בַּלַּיְלָה הַהוּא וַיֵּצֵא מַלְאַךְ יְהוָה וַיַּךְ בְּמַחֲנֵה אַשּׁוּר מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף וַיַּשְׁכִּימוּ בַבֹּקֶר וְהִנֵּה כֻלָּם פְּגָרִים מֵתִים׃
    hebrewPlain: ויהי בלילה ההוא ויצא מלאך יהוה ויך במחנה אשור מאה שמונים וחמשה אלף וישכימו בבקר והנה כלם פגרים מתים
    kjvRefs:
    - 2 Kings 19:35
    kjvOsis:
    - 2Kgs.19.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.36
    scripture: tanakh
    name: Tanakh 2 Kings 19:36
    ref: 2 Kings 19:36
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 36
    ordinal: 10009
    text: So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.
    translation: JPS 1917
    original: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב סַנְחֵרִיב מֶלֶךְ־אַשּׁוּר וַיֵּשֶׁב בְּנִינְוֵה׃
    hebrewPlain: ויסע וילך וישב סנחריב מלך אשור וישב בנינוה
    kjvRefs:
    - 2 Kings 19:36
    kjvOsis:
    - 2Kgs.19.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.19.37
    scripture: tanakh
    name: Tanakh 2 Kings 19:37
    ref: 2 Kings 19:37
    book: 2Kgs
    section: neviim
    chapter: 19
    verse: 37
    ordinal: 10010
    text: And it came to pass, as he was worshipping in the house of Nisroch his god, that Adrammelech and Sarezer his sons smote him with the sword; and they escaped into the land of Ararat. And Esarhaddon his son reigned in his stead.
    translation: JPS 1917
    original: וַיְהִי הוּא מִשְׁתַּחֲוֶה בֵּית נִסְרֹךְ אֱלֹהָיו וְאַדְרַמֶּלֶךְ וְשַׂרְאֶצֶר [בָּנָיו] הִכֻּהוּ בַחֶרֶב וְהֵמָּה נִמְלְטוּ אֶרֶץ אֲרָרָט וַיִּמְלֹךְ אֵסַר־חַדֹּן בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: ויהי הוא משתחוה בית נסרך אלהיו ואדרמלך ושראצר [בניו] הכהו בחרב והמה נמלטו ארץ אררט וימלך אסר חדן בנו תחתיו
    kjvRefs:
    - 2 Kings 19:37
    kjvOsis:
    - 2Kgs.19.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.19
- type: TanakhVerse
  data:
    osis: 2Kgs.20.1
    scripture: tanakh
    name: Tanakh 2 Kings 20:1
    ref: 2 Kings 20:1
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 1
    ordinal: 10011
    text: 'In those days was Hezekiah sick unto death. And Isaiah the prophet the son of Amoz came to him, and said unto him: ‘Thus saith the LORD: Set thy house in order; for thou shalt die, and not live.’'
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם חָלָה חִזְקִיָּהוּ לָמוּת וַיָּבֹא אֵלָיו יְשַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא וַיֹּאמֶר אֵלָיו כֹּה־אָמַר יְהוָה צַו לְבֵיתֶךָ כִּי מֵת אַתָּה וְלֹא תִחְיֶה׃
    hebrewPlain: בימים ההם חלה חזקיהו למות ויבא אליו ישעיהו בן אמוץ הנביא ויאמר אליו כה אמר יהוה צו לביתך כי מת אתה ולא תחיה
    kjvRefs:
    - 2 Kings 20:1
    kjvOsis:
    - 2Kgs.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.2
    scripture: tanakh
    name: Tanakh 2 Kings 20:2
    ref: 2 Kings 20:2
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 2
    ordinal: 10012
    text: 'Then he turned his face to the wall, and prayed unto the LORD, saying:'
    translation: JPS 1917
    original: וַיַּסֵּב אֶת־פָּנָיו אֶל־הַקִּיר וַיִּתְפַּלֵּל אֶל־יְהוָה לֵאמֹר׃
    hebrewPlain: ויסב את פניו אל הקיר ויתפלל אל יהוה לאמר
    kjvRefs:
    - 2 Kings 20:2
    kjvOsis:
    - 2Kgs.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.3
    scripture: tanakh
    name: Tanakh 2 Kings 20:3
    ref: 2 Kings 20:3
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 3
    ordinal: 10013
    text: ’Remember now, O LORD, I beseech Thee, how I have walked before Thee in truth and with a whole heart, and have done that which is good in Thy sight.’ And Hezekiah wept sore.
    translation: JPS 1917
    original: אָנָּה יְהוָה זְכָר־נָא אֵת אֲשֶׁר הִתְהַלַּכְתִּי לְפָנֶיךָ בֶּאֱמֶת וּבְלֵבָב שָׁלֵם וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי וַיֵּבְךְּ חִזְקִיָּהוּ בְּכִי גָדוֹל׃
    hebrewPlain: אנה יהוה זכר נא את אשר התהלכתי לפניך באמת ובלבב שלם והטוב בעיניך עשיתי ויבך חזקיהו בכי גדול
    kjvRefs:
    - 2 Kings 20:3
    kjvOsis:
    - 2Kgs.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.4
    scripture: tanakh
    name: Tanakh 2 Kings 20:4
    ref: 2 Kings 20:4
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 4
    ordinal: 10014
    text: 'And it came to pass, before Isaiah was gone out of the inner court of the city, that the word of the LORD came to him, saying:'
    translation: JPS 1917
    original: וַיְהִי יְשַׁעְיָהוּ לֹא יָצָא העיר [חָצֵר] הַתִּיכֹנָה וּדְבַר־יְהוָה הָיָה אֵלָיו לֵאמֹר׃
    hebrewPlain: ויהי ישעיהו לא יצא העיר [חצר] התיכנה ודבר יהוה היה אליו לאמר
    kjvRefs:
    - 2 Kings 20:4
    kjvOsis:
    - 2Kgs.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.5
    scripture: tanakh
    name: Tanakh 2 Kings 20:5
    ref: 2 Kings 20:5
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 5
    ordinal: 10015
    text: '’Return, and say to Hezekiah the prince of My people: Thus saith the LORD, the God of David thy father: I have heard thy prayer, I have seen thy tears; behold, I will heal thee; on the third day thou shalt go up unto the house of the LORD.'
    translation: JPS 1917
    original: שׁוּב וְאָמַרְתָּ אֶל־חִזְקִיָּהוּ נְגִיד־עַמִּי כֹּה־אָמַר יְהוָה אֱלֹהֵי דָּוִד אָבִיךָ שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ רָאִיתִי אֶת־דִּמְעָתֶךָ הִנְנִי רֹפֶא לָךְ בַּיּוֹם הַשְּׁלִישִׁי תַּעֲלֶה בֵּית יְהוָה׃
    hebrewPlain: שוב ואמרת אל חזקיהו נגיד עמי כה אמר יהוה אלהי דוד אביך שמעתי את תפלתך ראיתי את דמעתך הנני רפא לך ביום השלישי תעלה בית יהוה
    kjvRefs:
    - 2 Kings 20:5
    kjvOsis:
    - 2Kgs.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.6
    scripture: tanakh
    name: Tanakh 2 Kings 20:6
    ref: 2 Kings 20:6
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 6
    ordinal: 10016
    text: And I will add unto thy days fifteen years; and I will deliver thee and this city out of the hand of the king of Assyria; and I will defend this city for Mine own sake, and for My servant David’s sake.’
    translation: JPS 1917
    original: וְהֹסַפְתִּי עַל־יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּמִכַּף מֶלֶךְ־אַשּׁוּר אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת וְגַנּוֹתִי עַל־הָעִיר הַזֹּאת לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי׃
    hebrewPlain: והספתי על ימיך חמש עשרה שנה ומכף מלך אשור אצילך ואת העיר הזאת וגנותי על העיר הזאת למעני ולמען דוד עבדי
    kjvRefs:
    - 2 Kings 20:6
    kjvOsis:
    - 2Kgs.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.7
    scripture: tanakh
    name: Tanakh 2 Kings 20:7
    ref: 2 Kings 20:7
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 7
    ordinal: 10017
    text: 'And Isaiah said: ‘Take a cake of figs.’ And they took and laid it on the boil, and he recovered.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְשַׁעְיָהוּ קְחוּ דְּבֶלֶת תְּאֵנִים וַיִּקְחוּ וַיָּשִׂימוּ עַל־הַשְּׁחִין וַיֶּחִי׃
    hebrewPlain: ויאמר ישעיהו קחו דבלת תאנים ויקחו וישימו על השחין ויחי
    kjvRefs:
    - 2 Kings 20:7
    kjvOsis:
    - 2Kgs.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.8
    scripture: tanakh
    name: Tanakh 2 Kings 20:8
    ref: 2 Kings 20:8
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 8
    ordinal: 10018
    text: 'And Hezekiah said unto Isaiah: ‘What shall be the sign that the LORD will heal me, and that I shall go up unto the house of the LORD the third day?’'
    translation: JPS 1917
    original: וַיֹּאמֶר חִזְקִיָּהוּ אֶל־יְשַׁעְיָהוּ מָה אוֹת כִּי־יִרְפָּא יְהוָה לִי וְעָלִיתִי בַּיּוֹם הַשְּׁלִישִׁי בֵּית יְהוָה׃
    hebrewPlain: ויאמר חזקיהו אל ישעיהו מה אות כי ירפא יהוה לי ועליתי ביום השלישי בית יהוה
    kjvRefs:
    - 2 Kings 20:8
    kjvOsis:
    - 2Kgs.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.9
    scripture: tanakh
    name: Tanakh 2 Kings 20:9
    ref: 2 Kings 20:9
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 9
    ordinal: 10019
    text: 'And Isaiah said: ‘This shall be the sign unto thee from the LORD, that the LORD will do the thing that He hath spoken: shall the shadow go forward ten degrees, or go back ten degrees?'
    translation: JPS 1917
    original: וַיֹּאמֶר יְשַׁעְיָהוּ זֶה־לְּךָ הָאוֹת מֵאֵת יְהוָה כִּי יַעֲשֶׂה יְהוָה אֶת־הַדָּבָר אֲשֶׁר דִּבֵּר הָלַךְ הַצֵּל עֶשֶׂר מַעֲלוֹת אִם־יָשׁוּב עֶשֶׂר מַעֲלוֹת׃
    hebrewPlain: ויאמר ישעיהו זה לך האות מאת יהוה כי יעשה יהוה את הדבר אשר דבר הלך הצל עשר מעלות אם ישוב עשר מעלות
    kjvRefs:
    - 2 Kings 20:9
    kjvOsis:
    - 2Kgs.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.10
    scripture: tanakh
    name: Tanakh 2 Kings 20:10
    ref: 2 Kings 20:10
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 10
    ordinal: 10020
    text: 'And Hezekiah answered: ‘It is a light thing for the shadow to decline ten degrees; nay, but let the shadow return backward ten degrees.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְחִזְקִיָּהוּ נָקֵל לַצֵּל לִנְטוֹת עֶשֶׂר מַעֲלוֹת לֹא כִי יָשׁוּב הַצֵּל אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת׃
    hebrewPlain: ויאמר יחזקיהו נקל לצל לנטות עשר מעלות לא כי ישוב הצל אחרנית עשר מעלות
    kjvRefs:
    - 2 Kings 20:10
    kjvOsis:
    - 2Kgs.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.11
    scripture: tanakh
    name: Tanakh 2 Kings 20:11
    ref: 2 Kings 20:11
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 11
    ordinal: 10021
    text: And Isaiah the prophet cried unto the LORD; and he brought the shadow ten degrees backward, by which it had gone down on the dial of Ahaz.
    translation: JPS 1917
    original: וַיִּקְרָא יְשַׁעְיָהוּ הַנָּבִיא אֶל־יְהוָה וַיָּשֶׁב אֶת־הַצֵּל בַּמַּעֲלוֹת אֲשֶׁר יָרְדָה בְּמַעֲלוֹת אָחָז אֲחֹרַנִּית עֶשֶׂר מַעֲלוֹת׃
    hebrewPlain: ויקרא ישעיהו הנביא אל יהוה וישב את הצל במעלות אשר ירדה במעלות אחז אחרנית עשר מעלות
    kjvRefs:
    - 2 Kings 20:11
    kjvOsis:
    - 2Kgs.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.12
    scripture: tanakh
    name: Tanakh 2 Kings 20:12
    ref: 2 Kings 20:12
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 12
    ordinal: 10022
    text: At that time Berodach-baladan the son of Baladan, king of Babylon, sent a letter and a present unto Hezekiah; for he had heard that Hezekiah had been sick.
    translation: JPS 1917
    original: בָּעֵת הַהִיא שָׁלַח בְּרֹאדַךְ בַּלְאֲדָן בֶּן־בַּלְאֲדָן מֶלֶךְ־בָּבֶל סְפָרִים וּמִנְחָה אֶל־חִזְקִיָּהוּ כִּי שָׁמַע כִּי חָלָה חִזְקִיָּהוּ׃
    hebrewPlain: בעת ההיא שלח בראדך בלאדן בן בלאדן מלך בבל ספרים ומנחה אל חזקיהו כי שמע כי חלה חזקיהו
    kjvRefs:
    - 2 Kings 20:12
    kjvOsis:
    - 2Kgs.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.13
    scripture: tanakh
    name: Tanakh 2 Kings 20:13
    ref: 2 Kings 20:13
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 13
    ordinal: 10023
    text: And Hezekiah hearkened unto them, and showed them all his treasure-house, the silver, and the gold, and the spices, and the precious oil, and the house of his armour, and all that was found in his treasures; there was nothing in his house, nor in all his dominion, that Hezekiah showed them not.
    translation: JPS 1917
    original: וַיִּשְׁמַע עֲלֵיהֶם חִזְקִיָּהוּ וַיַּרְאֵם אֶת־כָּל־בֵּית נְכֹתֹה אֶת־הַכֶּסֶף וְאֶת־הַזָּהָב וְאֶת־הַבְּשָׂמִים וְאֵת שֶׁמֶן הַטּוֹב וְאֵת בֵּית כֵּלָיו וְאֵת כָּל־אֲשֶׁר נִמְצָא בְּאוֹצְרֹתָיו לֹא־הָיָה דָבָר אֲשֶׁר לֹא־הֶרְאָם חִזְקִיָּהוּ בְּבֵיתוֹ וּבְכָל־מֶמְשַׁלְתּוֹ׃
    hebrewPlain: וישמע עליהם חזקיהו ויראם את כל בית נכתה את הכסף ואת הזהב ואת הבשמים ואת שמן הטוב ואת בית כליו ואת כל אשר נמצא באוצרתיו לא היה דבר אשר לא הראם חזקיהו בביתו ובכל ממשלתו
    kjvRefs:
    - 2 Kings 20:13
    kjvOsis:
    - 2Kgs.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.14
    scripture: tanakh
    name: Tanakh 2 Kings 20:14
    ref: 2 Kings 20:14
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 14
    ordinal: 10024
    text: 'Then came Isaiah the prophet unto king Hezekiah, and said unto him: ‘What said these men? and from whence came they unto thee?’ And Hezekiah said: ‘They are come from a far country, even from Babylon.’'
    translation: JPS 1917
    original: וַיָּבֹא יְשַׁעְיָהוּ הַנָּבִיא אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ וַיֹּאמֶר אֵלָיו מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה וּמֵאַיִן יָבֹאוּ אֵלֶיךָ וַיֹּאמֶר חִזְקִיָּהוּ מֵאֶרֶץ רְחוֹקָה בָּאוּ מִבָּבֶל׃
    hebrewPlain: ויבא ישעיהו הנביא אל המלך חזקיהו ויאמר אליו מה אמרו האנשים האלה ומאין יבאו אליך ויאמר חזקיהו מארץ רחוקה באו מבבל
    kjvRefs:
    - 2 Kings 20:14
    kjvOsis:
    - 2Kgs.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.15
    scripture: tanakh
    name: Tanakh 2 Kings 20:15
    ref: 2 Kings 20:15
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 15
    ordinal: 10025
    text: 'And he said: ‘What have they seen in thy house?’ And Hezekiah answered: ‘All that is in my house have they seen; there is nothing among my treasures that I have not shown them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָה רָאוּ בְּבֵיתֶךָ וַיֹּאמֶר חִזְקִיָּהוּ אֵת כָּל־אֲשֶׁר בְּבֵיתִי רָאוּ לֹא־הָיָה דָבָר אֲשֶׁר לֹא־הִרְאִיתִם בְּאֹצְרֹתָי׃
    hebrewPlain: ויאמר מה ראו בביתך ויאמר חזקיהו את כל אשר בביתי ראו לא היה דבר אשר לא הראיתם באצרתי
    kjvRefs:
    - 2 Kings 20:15
    kjvOsis:
    - 2Kgs.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.16
    scripture: tanakh
    name: Tanakh 2 Kings 20:16
    ref: 2 Kings 20:16
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 16
    ordinal: 10026
    text: 'And Isaiah said unto Hezekiah: ‘Hear the word of the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְשַׁעְיָהוּ אֶל־חִזְקִיָּהוּ שְׁמַע דְּבַר־יְהוָה׃
    hebrewPlain: ויאמר ישעיהו אל חזקיהו שמע דבר יהוה
    kjvRefs:
    - 2 Kings 20:16
    kjvOsis:
    - 2Kgs.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.17
    scripture: tanakh
    name: Tanakh 2 Kings 20:17
    ref: 2 Kings 20:17
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 17
    ordinal: 10027
    text: Behold, the days come, that all that is in thy house, and that which thy fathers have laid up in store unto this day, shall be carried to Babylon; nothing shall be left, saith the LORD.
    translation: JPS 1917
    original: הִנֵּה יָמִים בָּאִים וְנִשָּׂא כָּל־אֲשֶׁר בְּבֵיתֶךָ וַאֲשֶׁר אָצְרוּ אֲבֹתֶיךָ עַד־הַיּוֹם הַזֶּה בָּבֶלָה לֹא־יִוָּתֵר דָּבָר אָמַר יְהוָה׃
    hebrewPlain: הנה ימים באים ונשא כל אשר בביתך ואשר אצרו אבתיך עד היום הזה בבלה לא יותר דבר אמר יהוה
    kjvRefs:
    - 2 Kings 20:17
    kjvOsis:
    - 2Kgs.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.18
    scripture: tanakh
    name: Tanakh 2 Kings 20:18
    ref: 2 Kings 20:18
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 18
    ordinal: 10028
    text: And of thy sons that shall issue from thee, whom thou shalt beget, shall they take away; and they shall be officers in the palace of the king of Babylon.’
    translation: JPS 1917
    original: וּמִבָּנֶיךָ אֲשֶׁר יֵצְאוּ מִמְּךָ אֲשֶׁר תּוֹלִיד יקח [יִקָּחוּ] וְהָיוּ סָרִיסִים בְּהֵיכַל מֶלֶךְ בָּבֶל׃
    hebrewPlain: ומבניך אשר יצאו ממך אשר תוליד יקח [יקחו] והיו סריסים בהיכל מלך בבל
    kjvRefs:
    - 2 Kings 20:18
    kjvOsis:
    - 2Kgs.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.19
    scripture: tanakh
    name: Tanakh 2 Kings 20:19
    ref: 2 Kings 20:19
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 19
    ordinal: 10029
    text: 'Then said Hezekiah unto Isaiah: ‘Good is the word of the LORD which thou hast spoken.’ He said moreover: ‘Is it not so, if peace and truth shall be in my days?’'
    translation: JPS 1917
    original: וַיֹּאמֶר חִזְקִיָּהוּ אֶל־יְשַׁעְיָהוּ טוֹב דְּבַר־יְהוָה אֲשֶׁר דִּבַּרְתָּ וַיֹּאמֶר הֲלוֹא אִם־שָׁלוֹם וֶאֱמֶת יִהְיֶה בְיָמָי׃
    hebrewPlain: ויאמר חזקיהו אל ישעיהו טוב דבר יהוה אשר דברת ויאמר הלוא אם שלום ואמת יהיה בימי
    kjvRefs:
    - 2 Kings 20:19
    kjvOsis:
    - 2Kgs.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.20
    scripture: tanakh
    name: Tanakh 2 Kings 20:20
    ref: 2 Kings 20:20
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 20
    ordinal: 10030
    text: Now the rest of the acts of Hezekiah, and all his might, and how he made the pool, and the conduit, and brought water into the city, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי חִזְקִיָּהוּ וְכָל־גְּבוּרָתוֹ וַאֲשֶׁר עָשָׂה אֶת־הַבְּרֵכָה וְאֶת־הַתְּעָלָה וַיָּבֵא אֶת־הַמַּיִם הָעִירָה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי חזקיהו וכל גבורתו ואשר עשה את הברכה ואת התעלה ויבא את המים העירה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 20:20
    kjvOsis:
    - 2Kgs.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.20.21
    scripture: tanakh
    name: Tanakh 2 Kings 20:21
    ref: 2 Kings 20:21
    book: 2Kgs
    section: neviim
    chapter: 20
    verse: 21
    ordinal: 10031
    text: And Hezekiah slept with his fathers; and Manasseh his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב חִזְקִיָּהוּ עִם־אֲבֹתָיו וַיִּמְלֹךְ מְנַשֶּׁה בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב חזקיהו עם אבתיו וימלך מנשה בנו תחתיו
    kjvRefs:
    - 2 Kings 20:21
    kjvOsis:
    - 2Kgs.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.20
- type: TanakhVerse
  data:
    osis: 2Kgs.21.1
    scripture: tanakh
    name: Tanakh 2 Kings 21:1
    ref: 2 Kings 21:1
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 1
    ordinal: 10032
    text: Manasseh was twelve years old when he began to reign; and he reigned five and fifty years in Jerusalem; and his mother’s name was Hephzi-bah.
    translation: JPS 1917
    original: בֶּן־שְׁתֵּים עֶשְׂרֵה שָׁנָה מְנַשֶּׁה בְמָלְכוֹ וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ חֶפְצִי־בָהּ׃
    hebrewPlain: בן שתים עשרה שנה מנשה במלכו וחמשים וחמש שנה מלך בירושלם ושם אמו חפצי בה
    kjvRefs:
    - 2 Kings 21:1
    kjvOsis:
    - 2Kgs.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.2
    scripture: tanakh
    name: Tanakh 2 Kings 21:2
    ref: 2 Kings 21:2
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 2
    ordinal: 10033
    text: And he did that which was evil in the sight of the LORD, after the abominations of the nations, whom the LORD cast out before the children of Israel.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּתוֹעֲבֹת הַגּוֹיִם אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויעש הרע בעיני יהוה כתועבת הגוים אשר הוריש יהוה מפני בני ישראל
    kjvRefs:
    - 2 Kings 21:2
    kjvOsis:
    - 2Kgs.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.3
    scripture: tanakh
    name: Tanakh 2 Kings 21:3
    ref: 2 Kings 21:3
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 3
    ordinal: 10034
    text: For he built again the high places which Hezekiah his father had destroyed; and he reared up altars for Baal, and made an Asherah, as did Ahab king of Israel, and worshipped all the host of heaven, and served them.
    translation: JPS 1917
    original: וַיָּשָׁב וַיִּבֶן אֶת־הַבָּמוֹת אֲשֶׁר אִבַּד חִזְקִיָּהוּ אָבִיו וַיָּקֶם מִזְבְּחֹת לַבַּעַל וַיַּעַשׂ אֲשֵׁרָה כַּאֲשֶׁר עָשָׂה אַחְאָב מֶלֶךְ יִשְׂרָאֵל וַיִּשְׁתַּחוּ לְכָל־צְבָא הַשָּׁמַיִם וַיַּעֲבֹד אֹתָם׃
    hebrewPlain: וישב ויבן את הבמות אשר אבד חזקיהו אביו ויקם מזבחת לבעל ויעש אשרה כאשר עשה אחאב מלך ישראל וישתחו לכל צבא השמים ויעבד אתם
    kjvRefs:
    - 2 Kings 21:3
    kjvOsis:
    - 2Kgs.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.4
    scripture: tanakh
    name: Tanakh 2 Kings 21:4
    ref: 2 Kings 21:4
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 4
    ordinal: 10035
    text: 'And he built altars in the house of the LORD, whereof the LORD said: ‘In Jerusalem will I put My name.’'
    translation: JPS 1917
    original: וּבָנָה מִזְבְּחֹת בְּבֵית יְהוָה אֲשֶׁר אָמַר יְהוָה בִּירוּשָׁלִַם אָשִׂים אֶת־שְׁמִי׃
    hebrewPlain: ובנה מזבחת בבית יהוה אשר אמר יהוה בירושלם אשים את שמי
    kjvRefs:
    - 2 Kings 21:4
    kjvOsis:
    - 2Kgs.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.5
    scripture: tanakh
    name: Tanakh 2 Kings 21:5
    ref: 2 Kings 21:5
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 5
    ordinal: 10036
    text: And he built altars for all the host of heaven in the two courts of the house of the LORD.
    translation: JPS 1917
    original: וַיִּבֶן מִזְבְּחוֹת לְכָל־צְבָא הַשָּׁמָיִם בִּשְׁתֵּי חַצְרוֹת בֵּית־יְהוָה׃
    hebrewPlain: ויבן מזבחות לכל צבא השמים בשתי חצרות בית יהוה
    kjvRefs:
    - 2 Kings 21:5
    kjvOsis:
    - 2Kgs.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.6
    scripture: tanakh
    name: Tanakh 2 Kings 21:6
    ref: 2 Kings 21:6
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 6
    ordinal: 10037
    text: 'And he made his son to pass through the fire, and practised soothsaying, and used enchantments, and appointed them that divined by a ghost or a familiar spirit: he wrought much evil in the sight of the LORD, to provoke Him.'
    translation: JPS 1917
    original: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ וְעוֹנֵן וְנִחֵשׁ וְעָשָׂה אוֹב וְיִדְּעֹנִים הִרְבָּה לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה לְהַכְעִיס׃
    hebrewPlain: והעביר את בנו באש ועונן ונחש ועשה אוב וידענים הרבה לעשות הרע בעיני יהוה להכעיס
    kjvRefs:
    - 2 Kings 21:6
    kjvOsis:
    - 2Kgs.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.7
    scripture: tanakh
    name: Tanakh 2 Kings 21:7
    ref: 2 Kings 21:7
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 7
    ordinal: 10038
    text: 'And he set the graven image of Asherah, that he had made, in the house of which the LORD said to David and to Solomon his son: ‘In this house, and in Jerusalem, which I have chosen out of all the tribes of Israel, will I put My name for ever;'
    translation: JPS 1917
    original: וַיָּשֶׂם אֶת־פֶּסֶל הָאֲשֵׁרָה אֲשֶׁר עָשָׂה בַּבַּיִת אֲשֶׁר אָמַר יְהוָה אֶל־דָּוִד וְאֶל־שְׁלֹמֹה בְנוֹ בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל אָשִׂים אֶת־שְׁמִי לְעוֹלָם׃
    hebrewPlain: וישם את פסל האשרה אשר עשה בבית אשר אמר יהוה אל דוד ואל שלמה בנו בבית הזה ובירושלם אשר בחרתי מכל שבטי ישראל אשים את שמי לעולם
    kjvRefs:
    - 2 Kings 21:7
    kjvOsis:
    - 2Kgs.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.8
    scripture: tanakh
    name: Tanakh 2 Kings 21:8
    ref: 2 Kings 21:8
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 8
    ordinal: 10039
    text: neither will I cause the feet of Israel to wander any more out of the land which I gave their fathers; if only they will observe to do according to all that I have commanded them, and according to all the law that My servant Moses commanded them.’
    translation: JPS 1917
    original: וְלֹא אֹסִיף לְהָנִיד רֶגֶל יִשְׂרָאֵל מִן־הָאֲדָמָה אֲשֶׁר נָתַתִּי לַאֲבוֹתָם רַק אִם־יִשְׁמְרוּ לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִים וּלְכָל־הַתּוֹרָה אֲשֶׁר־צִוָּה אֹתָם עַבְדִּי מֹשֶׁה׃
    hebrewPlain: ולא אסיף להניד רגל ישראל מן האדמה אשר נתתי לאבותם רק אם ישמרו לעשות ככל אשר צויתים ולכל התורה אשר צוה אתם עבדי משה
    kjvRefs:
    - 2 Kings 21:8
    kjvOsis:
    - 2Kgs.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.9
    scripture: tanakh
    name: Tanakh 2 Kings 21:9
    ref: 2 Kings 21:9
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 9
    ordinal: 10040
    text: But they hearkened not; and Manasseh seduced them to do that which is evil more than did the nations, whom the LORD destroyed before the children of Israel.
    translation: JPS 1917
    original: וְלֹא שָׁמֵעוּ וַיַּתְעֵם מְנַשֶּׁה לַעֲשׂוֹת אֶת־הָרָע מִן־הַגּוֹיִם אֲשֶׁר הִשְׁמִיד יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ולא שמעו ויתעם מנשה לעשות את הרע מן הגוים אשר השמיד יהוה מפני בני ישראל
    kjvRefs:
    - 2 Kings 21:9
    kjvOsis:
    - 2Kgs.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.10
    scripture: tanakh
    name: Tanakh 2 Kings 21:10
    ref: 2 Kings 21:10
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 10
    ordinal: 10041
    text: 'And the LORD spoke by His servants the prophets, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה בְּיַד־עֲבָדָיו הַנְּבִיאִים לֵאמֹר׃
    hebrewPlain: וידבר יהוה ביד עבדיו הנביאים לאמר
    kjvRefs:
    - 2 Kings 21:10
    kjvOsis:
    - 2Kgs.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.11
    scripture: tanakh
    name: Tanakh 2 Kings 21:11
    ref: 2 Kings 21:11
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 11
    ordinal: 10042
    text: ’Because Manasseh king of Judah hath done these abominations, and hath done wickedly above all that the Amorites did, that were before him, and hath made Judah also to sin with his idols;
    translation: JPS 1917
    original: יַעַן אֲשֶׁר עָשָׂה מְנַשֶּׁה מֶלֶךְ־יְהוּדָה הַתֹּעֵבוֹת הָאֵלֶּה הֵרַע מִכֹּל אֲשֶׁר־עָשׂוּ הָאֱמֹרִי אֲשֶׁר לְפָנָיו וַיַּחֲטִא גַם־אֶת־יְהוּדָה בְּגִלּוּלָיו׃
    hebrewPlain: יען אשר עשה מנשה מלך יהודה התעבות האלה הרע מכל אשר עשו האמרי אשר לפניו ויחטא גם את יהודה בגלוליו
    kjvRefs:
    - 2 Kings 21:11
    kjvOsis:
    - 2Kgs.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.12
    scripture: tanakh
    name: Tanakh 2 Kings 21:12
    ref: 2 Kings 21:12
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 12
    ordinal: 10043
    text: 'therefore thus saith the LORD, the God of Israel: Behold, I bring such evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle.'
    translation: JPS 1917
    original: לָכֵן כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל הִנְנִי מֵבִיא רָעָה עַל־יְרוּשָׁלִַם וִיהוּדָה אֲשֶׁר כָּל־שמעיו [שֹׁמְעָהּ] תִּצַּלְנָה שְׁתֵּי אָזְנָיו׃
    hebrewPlain: לכן כה אמר יהוה אלהי ישראל הנני מביא רעה על ירושלם ויהודה אשר כל שמעיו [שמעה] תצלנה שתי אזניו
    kjvRefs:
    - 2 Kings 21:12
    kjvOsis:
    - 2Kgs.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.13
    scripture: tanakh
    name: Tanakh 2 Kings 21:13
    ref: 2 Kings 21:13
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 13
    ordinal: 10044
    text: And I will stretch over Jerusalem the line of Samaria, and the plummet of the house of Ahab; and I will wipe Jerusalem as a man wipeth a dish, wiping it and turning it upside down.
    translation: JPS 1917
    original: וְנָטִיתִי עַל־יְרוּשָׁלִַם אֵת קָו שֹׁמְרוֹן וְאֶת־מִשְׁקֹלֶת בֵּית אַחְאָב וּמָחִיתִי אֶת־יְרוּשָׁלִַם כַּאֲשֶׁר־יִמְחֶה אֶת־הַצַּלַּחַת מָחָה וְהָפַךְ עַל־פָּנֶיהָ׃
    hebrewPlain: ונטיתי על ירושלם את קו שמרון ואת משקלת בית אחאב ומחיתי את ירושלם כאשר ימחה את הצלחת מחה והפך על פניה
    kjvRefs:
    - 2 Kings 21:13
    kjvOsis:
    - 2Kgs.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
- type: TanakhVerse
  data:
    osis: 2Kgs.21.14
    scripture: tanakh
    name: Tanakh 2 Kings 21:14
    ref: 2 Kings 21:14
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 14
    ordinal: 10045
    text: And I will cast off the remnant of Mine inheritance, and deliver them into the hand of their enemies; and they shall become a prey and a spoil to all their enemies;
    translation: JPS 1917
    original: וְנָטַשְׁתִּי אֵת שְׁאֵרִית נַחֲלָתִי וּנְתַתִּים בְּיַד אֹיְבֵיהֶם וְהָיוּ לְבַז וְלִמְשִׁסָּה לְכָל־אֹיְבֵיהֶם׃
    hebrewPlain: ונטשתי את שארית נחלתי ונתתים ביד איביהם והיו לבז ולמשסה לכל איביהם
    kjvRefs:
    - 2 Kings 21:14
    kjvOsis:
    - 2Kgs.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
