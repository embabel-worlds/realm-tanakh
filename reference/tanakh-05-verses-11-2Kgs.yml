  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.6
    scripture: tanakh
    name: Tanakh 2 Kings 13:6
    ref: 2 Kings 13:6
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 6
    ordinal: 9789
    text: Nevertheless they departed not from the sins of the house of Jeroboam, wherewith he made Israel to sin, but walked therein; and there remained the Asherah also in Samaria.—
    translation: JPS 1917
    original: אַךְ לֹא־סָרוּ מֵחַטֹּאות בֵּית־יָרָבְעָם אֲשֶׁר־החטי [הֶחֱטִיא] אֶת־יִשְׂרָאֵל בָּהּ הָלָךְ וְגַם הָאֲשֵׁרָה עָמְדָה בְּשֹׁמְרוֹן׃
    hebrewPlain: אך לא סרו מחטאות בית ירבעם אשר החטי [החטיא] את ישראל בה הלך וגם האשרה עמדה בשמרון
    kjvRefs:
    - 2 Kings 13:6
    kjvOsis:
    - 2Kgs.13.6
