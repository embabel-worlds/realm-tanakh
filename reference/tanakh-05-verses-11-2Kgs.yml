- type: TanakhVerse
  data:
    osis: 2Kgs.13.12
    scripture: tanakh
    name: Tanakh 2 Kings 13:12
    ref: 2 Kings 13:12
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 12
    ordinal: 9795
    text: Now the rest of the acts of Joash, and all that he did, and his might wherewith he fought against Amaziah king of Judah, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יוֹאָשׁ וְכָל־אֲשֶׁר עָשָׂה וּגְבוּרָתוֹ אֲשֶׁר נִלְחַם עִם אֲמַצְיָה מֶלֶךְ־יְהוּדָה הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יואש וכל אשר עשה וגבורתו אשר נלחם עם אמציה מלך יהודה הלוא הם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 13:12
    kjvOsis:
    - 2Kgs.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.13
    scripture: tanakh
    name: Tanakh 2 Kings 13:13
    ref: 2 Kings 13:13
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 13
    ordinal: 9796
    text: And Joash slept with his fathers; and Jeroboam sat upon his throne; and Joash was buried in Samaria with the kings of Israel.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יוֹאָשׁ עִם־אֲבֹתָיו וְיָרָבְעָם יָשַׁב עַל־כִּסְאוֹ וַיִּקָּבֵר יוֹאָשׁ בְּשֹׁמְרוֹן עִם מַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: וישכב יואש עם אבתיו וירבעם ישב על כסאו ויקבר יואש בשמרון עם מלכי ישראל
    kjvRefs:
    - 2 Kings 13:13
    kjvOsis:
    - 2Kgs.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.14
    scripture: tanakh
    name: Tanakh 2 Kings 13:14
    ref: 2 Kings 13:14
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 14
    ordinal: 9797
    text: 'Now Elisha was fallen sick of his sickness whereof he was to die; and Joash the king of Israel came down unto him, and wept over him, and said: ‘My father, my father, the chariots of Israel and the horsemen thereof! ’'
    translation: JPS 1917
    original: וֶאֱלִישָׁע חָלָה אֶת־חָלְיוֹ אֲשֶׁר יָמוּת בּוֹ וַיֵּרֶד אֵלָיו יוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל וַיֵּבְךְּ עַל־פָּנָיו וַיֹּאמַר אָבִי אָבִי רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו׃
    hebrewPlain: ואלישע חלה את חליו אשר ימות בו וירד אליו יואש מלך ישראל ויבך על פניו ויאמר אבי אבי רכב ישראל ופרשיו
    kjvRefs:
    - 2 Kings 13:14
    kjvOsis:
    - 2Kgs.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.15
    scripture: tanakh
    name: Tanakh 2 Kings 13:15
    ref: 2 Kings 13:15
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 15
    ordinal: 9798
    text: 'And Elisha said unto him: ‘Take bow and arrows’; and he took unto him bow and arrows.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ אֱלִישָׁע קַח קֶשֶׁת וְחִצִּים וַיִּקַּח אֵלָיו קֶשֶׁת וְחִצִּים׃
    hebrewPlain: ויאמר לו אלישע קח קשת וחצים ויקח אליו קשת וחצים
    kjvRefs:
    - 2 Kings 13:15
    kjvOsis:
    - 2Kgs.13.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.16
    scripture: tanakh
    name: Tanakh 2 Kings 13:16
    ref: 2 Kings 13:16
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 16
    ordinal: 9799
    text: 'And he said to the king of Israel: ‘Put thy hand upon the bow’; and he put his hand upon it. And Elisha laid his hands upon the king’s hands.'
    translation: JPS 1917
    original: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל הַרְכֵּב יָדְךָ עַל־הַקֶּשֶׁת וַיַּרְכֵּב יָדוֹ וַיָּשֶׂם אֱלִישָׁע יָדָיו עַל־יְדֵי הַמֶּלֶךְ׃
    hebrewPlain: ויאמר למלך ישראל הרכב ידך על הקשת וירכב ידו וישם אלישע ידיו על ידי המלך
    kjvRefs:
    - 2 Kings 13:16
    kjvOsis:
    - 2Kgs.13.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.17
    scripture: tanakh
    name: Tanakh 2 Kings 13:17
    ref: 2 Kings 13:17
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 17
    ordinal: 9800
    text: 'And he said: ‘Open the window eastward’; and he opened it. Then Elisha said: ‘Shoot’; and he shot. And he said: ‘The LORD’S arrow of victory, even the arrow of victory against Aram; for thou shalt smite the Arameans in Aphek, till thou have consumed them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר פְּתַח הַחַלּוֹן קֵדְמָה וַיִּפְתָּח וַיֹּאמֶר אֱלִישָׁע יְרֵה וַיּוֹר וַיֹּאמֶר חֵץ־תְּשׁוּעָה לַיהוָה וְחֵץ תְּשׁוּעָה בַאֲרָם וְהִכִּיתָ אֶת־אֲרָם בַּאֲפֵק עַד־כַּלֵּה׃
    hebrewPlain: ויאמר פתח החלון קדמה ויפתח ויאמר אלישע ירה ויור ויאמר חץ תשועה ליהוה וחץ תשועה בארם והכית את ארם באפק עד כלה
    kjvRefs:
    - 2 Kings 13:17
    kjvOsis:
    - 2Kgs.13.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.18
    scripture: tanakh
    name: Tanakh 2 Kings 13:18
    ref: 2 Kings 13:18
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 18
    ordinal: 9801
    text: 'And he said: ‘Take the arrows’; and he took them. And he said unto the king of Israel: ‘Smite upon the ground’; and he smote thrice, and stayed.'
    translation: JPS 1917
    original: וַיֹּאמֶר קַח הַחִצִּים וַיִּקָּח וַיֹּאמֶר לְמֶלֶךְ־יִשְׂרָאֵל הַךְ־אַרְצָה וַיַּךְ שָׁלֹשׁ־פְּעָמִים וַיַּעֲמֹד׃
    hebrewPlain: ויאמר קח החצים ויקח ויאמר למלך ישראל הך ארצה ויך שלש פעמים ויעמד
    kjvRefs:
    - 2 Kings 13:18
    kjvOsis:
    - 2Kgs.13.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.19
    scripture: tanakh
    name: Tanakh 2 Kings 13:19
    ref: 2 Kings 13:19
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 19
    ordinal: 9802
    text: 'And the man of God was wroth with him, and said: ‘Thou shouldest have smitten five or six times; then hadst thou smitten Aram till thou hadst consumed it; whereas now thou shalt smite Aram but thrice.’'
    translation: JPS 1917
    original: וַיִּקְצֹף עָלָיו אִישׁ הָאֱלֹהִים וַיֹּאמֶר לְהַכּוֹת חָמֵשׁ אוֹ־שֵׁשׁ פְּעָמִים אָז הִכִּיתָ אֶת־אֲרָם עַד־כַּלֵּה וְעַתָּה שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת־אֲרָם׃
    hebrewPlain: ויקצף עליו איש האלהים ויאמר להכות חמש או שש פעמים אז הכית את ארם עד כלה ועתה שלש פעמים תכה את ארם
    kjvRefs:
    - 2 Kings 13:19
    kjvOsis:
    - 2Kgs.13.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.20
    scripture: tanakh
    name: Tanakh 2 Kings 13:20
    ref: 2 Kings 13:20
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 20
    ordinal: 9803
    text: And Elisha died, and they buried him. Now the bands of the Moabites used to invade the land at the coming in of the year.
    translation: JPS 1917
    original: וַיָּמָת אֱלִישָׁע וַיִּקְבְּרֻהוּ וּגְדוּדֵי מוֹאָב יָבֹאוּ בָאָרֶץ בָּא שָׁנָה׃
    hebrewPlain: וימת אלישע ויקברהו וגדודי מואב יבאו בארץ בא שנה
    kjvRefs:
    - 2 Kings 13:20
    kjvOsis:
    - 2Kgs.13.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.21
    scripture: tanakh
    name: Tanakh 2 Kings 13:21
    ref: 2 Kings 13:21
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 21
    ordinal: 9804
    text: And it came to pass, as they were burying a man, that, behold, they spied a band; and they cast the man into the sepulchre of Elisha; and as soon as the man touched the bones of Elisha, he revived, and stood up on his feet.
    translation: JPS 1917
    original: וַיְהִי הֵם קֹבְרִים אִישׁ וְהִנֵּה רָאוּ אֶת־הַגְּדוּד וַיַּשְׁלִיכוּ אֶת־הָאִישׁ בְּקֶבֶר אֱלִישָׁע וַיֵּלֶךְ וַיִּגַּע הָאִישׁ בְּעַצְמוֹת אֱלִישָׁע וַיְחִי וַיָּקָם עַל־רַגְלָיו׃
    hebrewPlain: ויהי הם קברים איש והנה ראו את הגדוד וישליכו את האיש בקבר אלישע וילך ויגע האיש בעצמות אלישע ויחי ויקם על רגליו
    kjvRefs:
    - 2 Kings 13:21
    kjvOsis:
    - 2Kgs.13.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.22
    scripture: tanakh
    name: Tanakh 2 Kings 13:22
    ref: 2 Kings 13:22
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 22
    ordinal: 9805
    text: And Hazael king of Aram oppressed Israel all the days of Jehoahaz.
    translation: JPS 1917
    original: וַחֲזָאֵל מֶלֶךְ אֲרָם לָחַץ אֶת־יִשְׂרָאֵל כֹּל יְמֵי יְהוֹאָחָז׃
    hebrewPlain: וחזאל מלך ארם לחץ את ישראל כל ימי יהואחז
    kjvRefs:
    - 2 Kings 13:22
    kjvOsis:
    - 2Kgs.13.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.23
    scripture: tanakh
    name: Tanakh 2 Kings 13:23
    ref: 2 Kings 13:23
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 23
    ordinal: 9806
    text: But the LORD was gracious unto them, and had compassion on them, and had respect unto them, because of His covenant with Abraham, Isaac, and Jacob, and would not destroy them, neither hath He cast them from His presence until now.
    translation: JPS 1917
    original: וַיָּחָן יְהוָה אֹתָם וַיְרַחֲמֵם וַיִּפֶן אֲלֵיהֶם לְמַעַן בְּרִיתוֹ אֶת־אַבְרָהָם יִצְחָק וְיַעֲקֹב וְלֹא אָבָה הַשְׁחִיתָם וְלֹא־הִשְׁלִיכָם מֵעַל־פָּנָיו עַד־עָתָּה׃
    hebrewPlain: ויחן יהוה אתם וירחמם ויפן אליהם למען בריתו את אברהם יצחק ויעקב ולא אבה השחיתם ולא השליכם מעל פניו עד עתה
    kjvRefs:
    - 2 Kings 13:23
    kjvOsis:
    - 2Kgs.13.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.24
    scripture: tanakh
    name: Tanakh 2 Kings 13:24
    ref: 2 Kings 13:24
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 24
    ordinal: 9807
    text: And Hazael king of Aram died; and Ben-hadad his son reigned in his stead.
    translation: JPS 1917
    original: וַיָּמָת חֲזָאֵל מֶלֶךְ־אֲרָם וַיִּמְלֹךְ בֶּן־הֲדַד בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וימת חזאל מלך ארם וימלך בן הדד בנו תחתיו
    kjvRefs:
    - 2 Kings 13:24
    kjvOsis:
    - 2Kgs.13.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.25
    scripture: tanakh
    name: Tanakh 2 Kings 13:25
    ref: 2 Kings 13:25
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 25
    ordinal: 9808
    text: And Jehoash the son of Jehoahaz took again out of the hand of Ben-hadad the son of Hazael the cities which he had taken out of the hand of Jehoahaz his father by war. Three times did Joash smite him, and recovered the cities of Israel.
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹאָשׁ בֶּן־יְהוֹאָחָז וַיִּקַּח אֶת־הֶעָרִים מִיַּד בֶּן־הֲדַד בֶּן־חֲזָאֵל אֲשֶׁר לָקַח מִיַּד יְהוֹאָחָז אָבִיו בַּמִּלְחָמָה שָׁלֹשׁ פְּעָמִים הִכָּהוּ יוֹאָשׁ וַיָּשֶׁב אֶת־עָרֵי יִשְׂרָאֵל׃
    hebrewPlain: וישב יהואש בן יהואחז ויקח את הערים מיד בן הדד בן חזאל אשר לקח מיד יהואחז אביו במלחמה שלש פעמים הכהו יואש וישב את ערי ישראל
    kjvRefs:
    - 2 Kings 13:25
    kjvOsis:
    - 2Kgs.13.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.14.1
    scripture: tanakh
    name: Tanakh 2 Kings 14:1
    ref: 2 Kings 14:1
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 1
    ordinal: 9809
    text: In the second year of Joash son of Joahaz king of Israel began Amaziah the son of Joash king of Judah to reign.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁתַּיִם לְיוֹאָשׁ בֶּן־יוֹאָחָז מֶלֶךְ יִשְׂרָאֵל מָלַךְ אֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת שתים ליואש בן יואחז מלך ישראל מלך אמציהו בן יואש מלך יהודה
    kjvRefs:
    - 2 Kings 14:1
    kjvOsis:
    - 2Kgs.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.2
    scripture: tanakh
    name: Tanakh 2 Kings 14:2
    ref: 2 Kings 14:2
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 2
    ordinal: 9810
    text: He was twenty and five years old when he began to reign; and he reigned twenty and nine years in Jerusalem; and his mother’s name was Jehoaddan of Jerusalem.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יהועדין [יְהוֹעַדָּן] מִן־יְרוּשָׁלִָם׃
    hebrewPlain: בן עשרים וחמש שנה היה במלכו ועשרים ותשע שנה מלך בירושלם ושם אמו יהועדין [יהועדן] מן ירושלם
    kjvRefs:
    - 2 Kings 14:2
    kjvOsis:
    - 2Kgs.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.3
    scripture: tanakh
    name: Tanakh 2 Kings 14:3
    ref: 2 Kings 14:3
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 3
    ordinal: 9811
    text: And he did that which was right in the eyes of the LORD, yet not like David his father; he did according to all that Joash his father had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה רַק לֹא כְּדָוִד אָבִיו כְּכֹל אֲשֶׁר־עָשָׂה יוֹאָשׁ אָבִיו עָשָׂה׃
    hebrewPlain: ויעש הישר בעיני יהוה רק לא כדוד אביו ככל אשר עשה יואש אביו עשה
    kjvRefs:
    - 2 Kings 14:3
    kjvOsis:
    - 2Kgs.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.4
    scripture: tanakh
    name: Tanakh 2 Kings 14:4
    ref: 2 Kings 14:4
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 4
    ordinal: 9812
    text: Howbeit the high places were not taken away; the people still sacrificed and offered in the high places.
    translation: JPS 1917
    original: רַק הַבָּמוֹת לֹא־סָרוּ עוֹד הָעָם מְזַבְּחִים וּמְקַטְּרִים בַּבָּמוֹת׃
    hebrewPlain: רק הבמות לא סרו עוד העם מזבחים ומקטרים בבמות
    kjvRefs:
    - 2 Kings 14:4
    kjvOsis:
    - 2Kgs.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.5
    scripture: tanakh
    name: Tanakh 2 Kings 14:5
    ref: 2 Kings 14:5
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 5
    ordinal: 9813
    text: And it came to pass, as soon as the kingdom was established in his hand, that he slew his servants who had slain the king his father;
    translation: JPS 1917
    original: וַיְהִי כַּאֲשֶׁר חָזְקָה הַמַּמְלָכָה בְּיָדוֹ וַיַּךְ אֶת־עֲבָדָיו הַמַּכִּים אֶת־הַמֶּלֶךְ אָבִיו׃
    hebrewPlain: ויהי כאשר חזקה הממלכה בידו ויך את עבדיו המכים את המלך אביו
    kjvRefs:
    - 2 Kings 14:5
    kjvOsis:
    - 2Kgs.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.6
    scripture: tanakh
    name: Tanakh 2 Kings 14:6
    ref: 2 Kings 14:6
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 6
    ordinal: 9814
    text: 'but the children of the murderers he put not to death; according to that which is written in the book of the law of Moses, as the LORD commanded saying: ‘The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall be put to death for his own sin.’'
    translation: JPS 1917
    original: וְאֶת־בְּנֵי הַמַּכִּים לֹא הֵמִית כַּכָּתוּב בְּסֵפֶר תּוֹרַת־מֹשֶׁה אֲשֶׁר־צִוָּה יְהוָה לֵאמֹר לֹא־יוּמְתוּ אָבוֹת עַל־בָּנִים וּבָנִים לֹא־יוּמְתוּ עַל־אָבוֹת כִּי אִם־אִישׁ בְּחֶטְאוֹ ימות [יוּמָת׃]
    hebrewPlain: ואת בני המכים לא המית ככתוב בספר תורת משה אשר צוה יהוה לאמר לא יומתו אבות על בנים ובנים לא יומתו על אבות כי אם איש בחטאו ימות [יומת]
    kjvRefs:
    - 2 Kings 14:6
    kjvOsis:
    - 2Kgs.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.7
    scripture: tanakh
    name: Tanakh 2 Kings 14:7
    ref: 2 Kings 14:7
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 7
    ordinal: 9815
    text: He slew of Edom in the Valley of Salt ten thousand, and took Sela by war, and called the name of it Joktheel, unto this day.
    translation: JPS 1917
    original: הוּא־הִכָּה אֶת־אֱדוֹם בְּגֵיא־המלח [מֶלַח] עֲשֶׂרֶת אֲלָפִים וְתָפַשׂ אֶת־הַסֶּלַע בַּמִּלְחָמָה וַיִּקְרָא אֶת־שְׁמָהּ יָקְתְאֵל עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: הוא הכה את אדום בגיא המלח [מלח] עשרת אלפים ותפש את הסלע במלחמה ויקרא את שמה יקתאל עד היום הזה
    kjvRefs:
    - 2 Kings 14:7
    kjvOsis:
    - 2Kgs.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.8
    scripture: tanakh
    name: Tanakh 2 Kings 14:8
    ref: 2 Kings 14:8
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 8
    ordinal: 9816
    text: 'Then Amaziah sent messengers to Jehoash, the son of Jehoahaz son of Jehu, king of Israel, saying: ‘Come, let us look one another in the face.’'
    translation: JPS 1917
    original: אָז שָׁלַח אֲמַצְיָה מַלְאָכִים אֶל־יְהוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל לֵאמֹר לְכָה נִתְרָאֶה פָנִים׃
    hebrewPlain: אז שלח אמציה מלאכים אל יהואש בן יהואחז בן יהוא מלך ישראל לאמר לכה נתראה פנים
    kjvRefs:
    - 2 Kings 14:8
    kjvOsis:
    - 2Kgs.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.9
    scripture: tanakh
    name: Tanakh 2 Kings 14:9
    ref: 2 Kings 14:9
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 9
    ordinal: 9817
    text: 'And Jehoash the king of Israel sent to Amaziah king of Judah, saying: ‘The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying: Give thy daughter to my son to wife; and there passed by the wild beasts that were in Lebanon, and trod down the thistle.'
    translation: JPS 1917
    original: וַיִּשְׁלַח יְהוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל אֶל־אֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה לֵאמֹר הַחוֹחַ אֲשֶׁר בַּלְּבָנוֹן שָׁלַח אֶל־הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן לֵאמֹר תְּנָה־אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה וַתַּעֲבֹר חַיַּת הַשָּׂדֶה אֲשֶׁר בַּלְּבָנוֹן וַתִּרְמֹס אֶת־הַחוֹחַ׃
    hebrewPlain: וישלח יהואש מלך ישראל אל אמציהו מלך יהודה לאמר החוח אשר בלבנון שלח אל הארז אשר בלבנון לאמר תנה את בתך לבני לאשה ותעבר חית השדה אשר בלבנון ותרמס את החוח
    kjvRefs:
    - 2 Kings 14:9
    kjvOsis:
    - 2Kgs.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.10
    scripture: tanakh
    name: Tanakh 2 Kings 14:10
    ref: 2 Kings 14:10
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 10
    ordinal: 9818
    text: Thou hast indeed smitten Edom, and will thy heart lift thee up? glory therein, and remain at home; for why shouldest thou meddle with evil, that thou shouldest fall, even thou, and Judah with thee?
    translation: JPS 1917
    original: הַכֵּה הִכִּיתָ אֶת־אֱדוֹם וּנְשָׂאֲךָ לִבֶּךָ הִכָּבֵד וְשֵׁב בְּבֵיתֶךָ וְלָמָּה תִתְגָּרֶה בְּרָעָה וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ׃
    hebrewPlain: הכה הכית את אדום ונשאך לבך הכבד ושב בביתך ולמה תתגרה ברעה ונפלתה אתה ויהודה עמך
    kjvRefs:
    - 2 Kings 14:10
    kjvOsis:
    - 2Kgs.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.11
    scripture: tanakh
    name: Tanakh 2 Kings 14:11
    ref: 2 Kings 14:11
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 11
    ordinal: 9819
    text: But Amaziah would not hear. So Jehoash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at Beth-shemesh, which belongeth to Judah.
    translation: JPS 1917
    original: וְלֹא־שָׁמַע אֲמַצְיָהוּ וַיַּעַל יְהוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל וַיִּתְרָאוּ פָנִים הוּא וַאֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה בְּבֵית שֶׁמֶשׁ אֲשֶׁר לִיהוּדָה׃
    hebrewPlain: ולא שמע אמציהו ויעל יהואש מלך ישראל ויתראו פנים הוא ואמציהו מלך יהודה בבית שמש אשר ליהודה
    kjvRefs:
    - 2 Kings 14:11
    kjvOsis:
    - 2Kgs.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.12
    scripture: tanakh
    name: Tanakh 2 Kings 14:12
    ref: 2 Kings 14:12
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 12
    ordinal: 9820
    text: And Judah was put to the worse before Israel; and they fled every man to his tent.
    translation: JPS 1917
    original: וַיִּנָּגֶף יְהוּדָה לִפְנֵי יִשְׂרָאֵל וַיָּנֻסוּ אִישׁ לאהלו [לְאֹהָלָיו׃]
    hebrewPlain: וינגף יהודה לפני ישראל וינסו איש לאהלו [לאהליו]
    kjvRefs:
    - 2 Kings 14:12
    kjvOsis:
    - 2Kgs.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.13
    scripture: tanakh
    name: Tanakh 2 Kings 14:13
    ref: 2 Kings 14:13
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 13
    ordinal: 9821
    text: And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Beth-shemesh, and came to Jerusalem, and broke down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.
    translation: JPS 1917
    original: וְאֵת אֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה בֶּן־יְהוֹאָשׁ בֶּן־אֲחַזְיָהוּ תָּפַשׂ יְהוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל בְּבֵית שָׁמֶשׁ ויבאו [וַיָּבֹא] יְרוּשָׁלִַם וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם בְּשַׁעַר אֶפְרַיִם עַד־שַׁעַר הַפִּנָּה אַרְבַּע מֵאוֹת אַמָּה׃
    hebrewPlain: ואת אמציהו מלך יהודה בן יהואש בן אחזיהו תפש יהואש מלך ישראל בבית שמש ויבאו [ויבא] ירושלם ויפרץ בחומת ירושלם בשער אפרים עד שער הפנה ארבע מאות אמה
    kjvRefs:
    - 2 Kings 14:13
    kjvOsis:
    - 2Kgs.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.14
    scripture: tanakh
    name: Tanakh 2 Kings 14:14
    ref: 2 Kings 14:14
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 14
    ordinal: 9822
    text: And he took all the gold and silver, and all the vessels that were found in the house of the LORD, and in the treasures of the king’s house, the hostages also, and returned to Samaria.
    translation: JPS 1917
    original: וְלָקַח אֶת־כָּל־הַזָּהָב־וְהַכֶּסֶף וְאֵת כָּל־הַכֵּלִים הַנִּמְצְאִים בֵּית־יְהוָה וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ וְאֵת בְּנֵי הַתַּעֲרֻבוֹת וַיָּשָׁב שֹׁמְרוֹנָה׃
    hebrewPlain: ולקח את כל הזהב והכסף ואת כל הכלים הנמצאים בית יהוה ובאצרות בית המלך ואת בני התערבות וישב שמרונה
    kjvRefs:
    - 2 Kings 14:14
    kjvOsis:
    - 2Kgs.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.15
    scripture: tanakh
    name: Tanakh 2 Kings 14:15
    ref: 2 Kings 14:15
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 15
    ordinal: 9823
    text: Now the rest of the acts of Jehoash which he did, and his might, and how he fought with Amaziah king of Judah, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ אֲשֶׁר עָשָׂה וּגְבוּרָתוֹ וַאֲשֶׁר נִלְחַם עִם אֲמַצְיָהוּ מֶלֶךְ־יְהוּדָה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יהואש אשר עשה וגבורתו ואשר נלחם עם אמציהו מלך יהודה הלא הם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 14:15
    kjvOsis:
    - 2Kgs.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.16
    scripture: tanakh
    name: Tanakh 2 Kings 14:16
    ref: 2 Kings 14:16
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 16
    ordinal: 9824
    text: And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יְהוֹאָשׁ עִם־אֲבֹתָיו וַיִּקָּבֵר בְּשֹׁמְרוֹן עִם מַלְכֵי יִשְׂרָאֵל וַיִּמְלֹךְ יָרָבְעָם בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יהואש עם אבתיו ויקבר בשמרון עם מלכי ישראל וימלך ירבעם בנו תחתיו
    kjvRefs:
    - 2 Kings 14:16
    kjvOsis:
    - 2Kgs.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.17
    scripture: tanakh
    name: Tanakh 2 Kings 14:17
    ref: 2 Kings 14:17
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 17
    ordinal: 9825
    text: And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz king of Israel fifteen years.
    translation: JPS 1917
    original: וַיְחִי אֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה אַחֲרֵי מוֹת יְהוֹאָשׁ בֶּן־יְהוֹאָחָז מֶלֶךְ יִשְׂרָאֵל חֲמֵשׁ עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: ויחי אמציהו בן יואש מלך יהודה אחרי מות יהואש בן יהואחז מלך ישראל חמש עשרה שנה
    kjvRefs:
    - 2 Kings 14:17
    kjvOsis:
    - 2Kgs.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.18
    scripture: tanakh
    name: Tanakh 2 Kings 14:18
    ref: 2 Kings 14:18
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 18
    ordinal: 9826
    text: Now the rest of the acts of Amaziah, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי אמציהו הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 14:18
    kjvOsis:
    - 2Kgs.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.19
    scripture: tanakh
    name: Tanakh 2 Kings 14:19
    ref: 2 Kings 14:19
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 19
    ordinal: 9827
    text: And they made a conspiracy against him in Jerusalem; and he fled to Lachish; but they sent after him to Lachish, and slew him there.
    translation: JPS 1917
    original: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר בִּירוּשָׁלִַם וַיָּנָס לָכִישָׁה וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה וַיְמִתֻהוּ שָׁם׃
    hebrewPlain: ויקשרו עליו קשר בירושלם וינס לכישה וישלחו אחריו לכישה וימתהו שם
    kjvRefs:
    - 2 Kings 14:19
    kjvOsis:
    - 2Kgs.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.20
    scripture: tanakh
    name: Tanakh 2 Kings 14:20
    ref: 2 Kings 14:20
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 20
    ordinal: 9828
    text: And they brought him upon horses; and he was buried at Jerusalem with his fathers in the city of David.
    translation: JPS 1917
    original: וַיִּשְׂאוּ אֹתוֹ עַל־הַסּוּסִים וַיִּקָּבֵר בִּירוּשָׁלִַם עִם־אֲבֹתָיו בְּעִיר דָּוִד׃
    hebrewPlain: וישאו אתו על הסוסים ויקבר בירושלם עם אבתיו בעיר דוד
    kjvRefs:
    - 2 Kings 14:20
    kjvOsis:
    - 2Kgs.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.21
    scripture: tanakh
    name: Tanakh 2 Kings 14:21
    ref: 2 Kings 14:21
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 21
    ordinal: 9829
    text: And all the people of Judah took Azariah, who was sixteen years old, and made him king in the room of his father Amaziah.
    translation: JPS 1917
    original: וַיִּקְחוּ כָּל־עַם יְהוּדָה אֶת־עֲזַרְיָה וְהוּא בֶּן־שֵׁשׁ עֶשְׂרֵה שָׁנָה וַיַּמְלִכוּ אֹתוֹ תַּחַת אָבִיו אֲמַצְיָהוּ׃
    hebrewPlain: ויקחו כל עם יהודה את עזריה והוא בן שש עשרה שנה וימלכו אתו תחת אביו אמציהו
    kjvRefs:
    - 2 Kings 14:21
    kjvOsis:
    - 2Kgs.14.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.22
    scripture: tanakh
    name: Tanakh 2 Kings 14:22
    ref: 2 Kings 14:22
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 22
    ordinal: 9830
    text: He built Elath, and restored it to Judah, after that the king slept with his fathers.
    translation: JPS 1917
    original: הוּא בָּנָה אֶת־אֵילַת וַיְשִׁבֶהָ לִיהוּדָה אַחֲרֵי שְׁכַב־הַמֶּלֶךְ עִם־אֲבֹתָיו׃
    hebrewPlain: הוא בנה את אילת וישבה ליהודה אחרי שכב המלך עם אבתיו
    kjvRefs:
    - 2 Kings 14:22
    kjvOsis:
    - 2Kgs.14.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.23
    scripture: tanakh
    name: Tanakh 2 Kings 14:23
    ref: 2 Kings 14:23
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 23
    ordinal: 9831
    text: In the fifteenth year of Amaziah the son of Joash king of Judah Jeroboam the son of Joash king of Israel began to reign in Samaria, and reigned forty and one years.
    translation: JPS 1917
    original: בִּשְׁנַת חֲמֵשׁ־עֶשְׂרֵה שָׁנָה לַאֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה מָלַךְ יָרָבְעָם בֶּן־יוֹאָשׁ מֶלֶךְ־יִשְׂרָאֵל בְּשֹׁמְרוֹן אַרְבָּעִים וְאַחַת שָׁנָה׃
    hebrewPlain: בשנת חמש עשרה שנה לאמציהו בן יואש מלך יהודה מלך ירבעם בן יואש מלך ישראל בשמרון ארבעים ואחת שנה
    kjvRefs:
    - 2 Kings 14:23
    kjvOsis:
    - 2Kgs.14.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.24
    scripture: tanakh
    name: Tanakh 2 Kings 14:24
    ref: 2 Kings 14:24
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 24
    ordinal: 9832
    text: And he did that which was evil in the sight of the LORD; he departed not from all the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה לֹא סָר מִכָּל־חַטֹּאות יָרָבְעָם בֶּן־נְבָט אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל׃
    hebrewPlain: ויעש הרע בעיני יהוה לא סר מכל חטאות ירבעם בן נבט אשר החטיא את ישראל
    kjvRefs:
    - 2 Kings 14:24
    kjvOsis:
    - 2Kgs.14.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.14
- type: TanakhVerse
  data:
    osis: 2Kgs.14.25
    scripture: tanakh
    name: Tanakh 2 Kings 14:25
    ref: 2 Kings 14:25
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 25
    ordinal: 9833
    text: He restored the border of Israel from the entrance of Hamath unto the sea of the Arabah, according to the word of the LORD, the God of Israel, which He spoke by the hand of His servant Jonah the son of Amittai, the prophet, who was of Gath-hepher.
    translation: JPS 1917
    original: הוּא הֵשִׁיב אֶת־גְּבוּל יִשְׂרָאֵל מִלְּבוֹא חֲמָת עַד־יָם הָעֲרָבָה כִּדְבַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר דִּבֶּר בְּיַד־עַבְדּוֹ יוֹנָה בֶן־אֲמִתַּי הַנָּבִיא אֲשֶׁר מִגַּת הַחֵפֶר׃
    hebrewPlain: הוא השיב את גבול ישראל מלבוא חמת עד ים הערבה כדבר יהוה אלהי ישראל אשר דבר ביד עבדו יונה בן אמתי הנביא אשר מגת החפר
    kjvRefs:
