- type: TanakhVerse
  data:
    osis: 2Kgs.13.10
    scripture: tanakh
    name: Tanakh 2 Kings 13:10
    ref: 2 Kings 13:10
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 10
    ordinal: 9793
    text: In the thirty and seventh year of Joash king of Judah began Jehoash the son of Jehoahaz to reign over Israel in Samaria, and reigned sixteen years.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה לְיוֹאָשׁ מֶלֶךְ יְהוּדָה מָלַךְ יְהוֹאָשׁ בֶּן־יְהוֹאָחָז עַל־יִשְׂרָאֵל בְּשֹׁמְרוֹן שֵׁשׁ עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: בשנת שלשים ושבע שנה ליואש מלך יהודה מלך יהואש בן יהואחז על ישראל בשמרון שש עשרה שנה
    kjvRefs:
    - 2 Kings 13:10
    kjvOsis:
    - 2Kgs.13.10
