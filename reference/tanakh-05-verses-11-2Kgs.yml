- type: TanakhVerse
  data:
    osis: 2Kgs.13.5
    scripture: tanakh
    name: Tanakh 2 Kings 13:5
    ref: 2 Kings 13:5
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 5
    ordinal: 9788
    text: And the LORD gave Israel a deliverer, so that they went out from under the hand of the Arameans; and the children of Israel dwelt in their tents, as beforetime.
    translation: JPS 1917
    original: וַיִּתֵּן יְהוָה לְיִשְׂרָאֵל מוֹשִׁיעַ וַיֵּצְאוּ מִתַּחַת יַד־אֲרָם וַיֵּשְׁבוּ בְנֵי־יִשְׂרָאֵל בְּאָהֳלֵיהֶם כִּתְמוֹל שִׁלְשׁוֹם׃
    hebrewPlain: ויתן יהוה לישראל מושיע ויצאו מתחת יד ארם וישבו בני ישראל באהליהם כתמול שלשום
    kjvRefs:
    - 2 Kings 13:5
    kjvOsis:
    - 2Kgs.13.5
