- type: TanakhVerse
  data:
    osis: 2Kgs.4.18
    scripture: tanakh
    name: Tanakh 2 Kings 4:18
    ref: 2 Kings 4:18
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 18
    ordinal: 9533
    text: And when the child was grown, it fell on a day, that he went out to his father to the reapers.
    translation: JPS 1917
    original: וַיִּגְדַּל הַיָּלֶד וַיְהִי הַיּוֹם וַיֵּצֵא אֶל־אָבִיו אֶל־הַקֹּצְרִים׃
    hebrewPlain: ויגדל הילד ויהי היום ויצא אל אביו אל הקצרים
    kjvRefs:
