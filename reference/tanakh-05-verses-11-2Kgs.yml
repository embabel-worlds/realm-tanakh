    name: Tanakh 2 Kings 14:26
    ref: 2 Kings 14:26
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 26
    ordinal: 9834
    text: For the LORD saw the affliction of Israel, that it was very bitter; for there was none shut up nor left at large, neither was there any helper for Israel.
    translation: JPS 1917
    original: כִּי־רָאָה יְהוָה אֶת־עֳנִי יִשְׂרָאֵל מֹרֶה מְאֹד וְאֶפֶס עָצוּר וְאֶפֶס עָזוּב וְאֵין עֹזֵר לְיִשְׂרָאֵל׃
    hebrewPlain: כי ראה יהוה את עני ישראל מרה מאד ואפס עצור ואפס עזוב ואין עזר לישראל
    kjvRefs:
