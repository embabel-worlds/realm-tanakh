  data:
    osis: 2Kgs.21.21
    scripture: tanakh
    name: Tanakh 2 Kings 21:21
    ref: 2 Kings 21:21
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 21
    ordinal: 10052
    text: And he walked in all the way that his father walked in, and served the idols that his father served, and worshipped them.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּכָל־הַדֶּרֶךְ אֲשֶׁר־הָלַךְ אָבִיו וַיַּעֲבֹד אֶת־הַגִּלֻּלִים אֲשֶׁר עָבַד אָבִיו וַיִּשְׁתַּחוּ לָהֶם׃
    hebrewPlain: וילך בכל הדרך אשר הלך אביו ויעבד את הגללים אשר עבד אביו וישתחו להם
    kjvRefs:
    - 2 Kings 21:21
    kjvOsis:
    - 2Kgs.21.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.21
