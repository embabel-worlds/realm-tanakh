- type: TanakhVerse
  data:
    osis: 2Kgs.9.11
    scripture: tanakh
    name: Tanakh 2 Kings 9:11
    ref: 2 Kings 9:11
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 11
    ordinal: 9679
    text: 'Then Jehu came forth to the servants of his lord; and one said unto him: ‘Is all well? wherefore came this mad fellow to thee?’ And he said unto them: ‘Ye know the man and what his talk was.’'
    translation: JPS 1917
    original: וְיֵהוּא יָצָא אֶל־עַבְדֵי אֲדֹנָיו וַיֹּאמֶר לוֹ הֲשָׁלוֹם מַדּוּעַ בָּא־הַמְשֻׁגָּע הַזֶּה אֵלֶיךָ וַיֹּאמֶר אֲלֵיהֶם אַתֶּם יְדַעְתֶּם אֶת־הָאִישׁ וְאֶת־שִׂיחוֹ׃
    hebrewPlain: ויהוא יצא אל עבדי אדניו ויאמר לו השלום מדוע בא המשגע הזה אליך ויאמר אליהם אתם ידעתם את האיש ואת שיחו
    kjvRefs:
    - 2 Kings 9:11
    kjvOsis:
    - 2Kgs.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.12
    scripture: tanakh
    name: Tanakh 2 Kings 9:12
    ref: 2 Kings 9:12
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 12
    ordinal: 9680
    text: 'And they said: ‘It is false; tell us now.’ And he said: ‘Thus and thus spoke he to me, saying: Thus saith the LORD: I have anointed thee king over Israel.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ שֶׁקֶר הַגֶּד־נָא לָנוּ וַיֹּאמֶר כָּזֹאת וְכָזֹאת אָמַר אֵלַי לֵאמֹר כֹּה אָמַר יְהוָה מְשַׁחְתִּיךָ לְמֶלֶךְ אֶל־יִשְׂרָאֵל׃
    hebrewPlain: ויאמרו שקר הגד נא לנו ויאמר כזאת וכזאת אמר אלי לאמר כה אמר יהוה משחתיך למלך אל ישראל
    kjvRefs:
    - 2 Kings 9:12
    kjvOsis:
    - 2Kgs.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.13
    scripture: tanakh
    name: Tanakh 2 Kings 9:13
    ref: 2 Kings 9:13
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 13
    ordinal: 9681
    text: 'Then they hastened, and took every man his garment, and put it under him on the top of the stairs, and blew the horn, saying: ‘Jehu is king.’'
    translation: JPS 1917
    original: וַיְמַהֲרוּ וַיִּקְחוּ אִישׁ בִּגְדוֹ וַיָּשִׂימוּ תַחְתָּיו אֶל־גֶּרֶם הַמַּעֲלוֹת וַיִּתְקְעוּ בַּשּׁוֹפָר וַיֹּאמְרוּ מָלַךְ יֵהוּא׃
    hebrewPlain: וימהרו ויקחו איש בגדו וישימו תחתיו אל גרם המעלות ויתקעו בשופר ויאמרו מלך יהוא
    kjvRefs:
    - 2 Kings 9:13
    kjvOsis:
    - 2Kgs.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.14
    scripture: tanakh
    name: Tanakh 2 Kings 9:14
    ref: 2 Kings 9:14
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 14
    ordinal: 9682
    text: So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram.—Now Joram had been guarding Ramoth-gilead, he and all Israel, because of Hazael king of Aram;
    translation: JPS 1917
    original: וַיִּתְקַשֵּׁר יֵהוּא בֶּן־יְהוֹשָׁפָט בֶּן־נִמְשִׁי אֶל־יוֹרָם וְיוֹרָם הָיָה שֹׁמֵר בְּרָמֹת גִּלְעָד הוּא וְכָל־יִשְׂרָאֵל מִפְּנֵי חֲזָאֵל מֶלֶךְ־אֲרָם׃
    hebrewPlain: ויתקשר יהוא בן יהושפט בן נמשי אל יורם ויורם היה שמר ברמת גלעד הוא וכל ישראל מפני חזאל מלך ארם
    kjvRefs:
    - 2 Kings 9:14
    kjvOsis:
    - 2Kgs.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.15
    scripture: tanakh
    name: Tanakh 2 Kings 9:15
    ref: 2 Kings 9:15
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 15
    ordinal: 9683
    text: 'but king Joram was returned to be healed in Jezreel of the wounds which the Arameans had given him, when he fought with Hazael king of Aram.—And Jehu said: ‘If this be your mind, then let none escape and go forth out of the city, to go to tell it in Jezreel.’'
    translation: JPS 1917
    original: וַיָּשָׁב יְהוֹרָם הַמֶּלֶךְ לְהִתְרַפֵּא בִיְזְרְעֶאל מִן־הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים בְּהִלָּחֲמוֹ אֶת־חֲזָאֵל מֶלֶךְ אֲרָם וַיֹּאמֶר יֵהוּא אִם־יֵשׁ נַפְשְׁכֶם אַל־יֵצֵא פָלִיט מִן־הָעִיר לָלֶכֶת לגיד [לְהַגִּיד] בְּיִזְרְעֶאל׃
    hebrewPlain: וישב יהורם המלך להתרפא ביזרעאל מן המכים אשר יכהו ארמים בהלחמו את חזאל מלך ארם ויאמר יהוא אם יש נפשכם אל יצא פליט מן העיר ללכת לגיד [להגיד] ביזרעאל
    kjvRefs:
    - 2 Kings 9:15
    kjvOsis:
    - 2Kgs.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.16
    scripture: tanakh
    name: Tanakh 2 Kings 9:16
    ref: 2 Kings 9:16
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 16
    ordinal: 9684
    text: So Jehu rode in a chariot, and went to Jezreel; for Joram lay there. And Ahaziah king of Judah was come down to see Joram.
    translation: JPS 1917
    original: וַיִּרְכַּב יֵהוּא וַיֵּלֶךְ יִזְרְעֶאלָה כִּי יוֹרָם שֹׁכֵב שָׁמָּה וַאֲחַזְיָה מֶלֶךְ יְהוּדָה יָרַד לִרְאוֹת אֶת־יוֹרָם׃
    hebrewPlain: וירכב יהוא וילך יזרעאלה כי יורם שכב שמה ואחזיה מלך יהודה ירד לראות את יורם
    kjvRefs:
    - 2 Kings 9:16
    kjvOsis:
    - 2Kgs.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.17
    scripture: tanakh
    name: Tanakh 2 Kings 9:17
    ref: 2 Kings 9:17
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 17
    ordinal: 9685
    text: 'Now the watchman stood on the tower in Jezreel, and he spied the company of Jehu as he came, and said: ‘I see a company.’ And Joram said: ‘Take a horseman, and send to meet them, and let him say: Is it peace?’'
    translation: JPS 1917
    original: וְהַצֹּפֶה עֹמֵד עַל־הַמִּגְדָּל בְּיִזְרְעֶאל וַיַּרְא אֶת־שִׁפְעַת יֵהוּא בְּבֹאוֹ וַיֹּאמֶר שִׁפְעַת אֲנִי רֹאֶה וַיֹּאמֶר יְהוֹרָם קַח רַכָּב וּשְׁלַח לִקְרָאתָם וְיֹאמַר הֲשָׁלוֹם׃
    hebrewPlain: והצפה עמד על המגדל ביזרעאל וירא את שפעת יהוא בבאו ויאמר שפעת אני ראה ויאמר יהורם קח רכב ושלח לקראתם ויאמר השלום
    kjvRefs:
    - 2 Kings 9:17
    kjvOsis:
    - 2Kgs.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.18
    scripture: tanakh
    name: Tanakh 2 Kings 9:18
    ref: 2 Kings 9:18
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 18
    ordinal: 9686
    text: 'So there went one on horseback to meet him, and said: ‘Thus saith the king: Is it peace?’ And Jehu said: ‘What hast thou to do with peace? turn thee behind me.’ And the watchman told, saying: ‘The messenger came to them, but he cometh not back.’'
    translation: JPS 1917
    original: וַיֵּלֶךְ רֹכֵב הַסּוּס לִקְרָאתוֹ וַיֹּאמֶר כֹּה־אָמַר הַמֶּלֶךְ הֲשָׁלוֹם וַיֹּאמֶר יֵהוּא מַה־לְּךָ וּלְשָׁלוֹם סֹב אֶל־אַחֲרָי וַיַּגֵּד הַצֹּפֶה לֵאמֹר בָּא־הַמַּלְאָךְ עַד־הֵם וְלֹא־שָׁב׃
    hebrewPlain: וילך רכב הסוס לקראתו ויאמר כה אמר המלך השלום ויאמר יהוא מה לך ולשלום סב אל אחרי ויגד הצפה לאמר בא המלאך עד הם ולא שב
    kjvRefs:
    - 2 Kings 9:18
    kjvOsis:
    - 2Kgs.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.19
    scripture: tanakh
    name: Tanakh 2 Kings 9:19
    ref: 2 Kings 9:19
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 19
    ordinal: 9687
    text: 'Then he sent out a second on horseback, who came to them, and said: ‘Thus saith the king: Is it peace?’ And Jehu answered: ‘What hast thou to do with peace? turn thee behind me.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח רֹכֵב סוּס שֵׁנִי וַיָּבֹא אֲלֵהֶם וַיֹּאמֶר כֹּה־אָמַר הַמֶּלֶךְ שָׁלוֹם וַיֹּאמֶר יֵהוּא מַה־לְּךָ וּלְשָׁלוֹם סֹב אֶל־אַחֲרָי׃
    hebrewPlain: וישלח רכב סוס שני ויבא אלהם ויאמר כה אמר המלך שלום ויאמר יהוא מה לך ולשלום סב אל אחרי
    kjvRefs:
    - 2 Kings 9:19
    kjvOsis:
    - 2Kgs.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.20
    scripture: tanakh
    name: Tanakh 2 Kings 9:20
    ref: 2 Kings 9:20
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 20
    ordinal: 9688
    text: 'And the watchman told, saying: ‘He came even unto them, and cometh not back; and the driving is like the driving of Jehu the son of Nimshi; for he driveth furiously.’'
    translation: JPS 1917
    original: וַיַּגֵּד הַצֹּפֶה לֵאמֹר בָּא עַד־אֲלֵיהֶם וְלֹא־שָׁב וְהַמִּנְהָג כְּמִנְהַג יֵהוּא בֶן־נִמְשִׁי כִּי בְשִׁגָּעוֹן יִנְהָג׃
    hebrewPlain: ויגד הצפה לאמר בא עד אליהם ולא שב והמנהג כמנהג יהוא בן נמשי כי בשגעון ינהג
    kjvRefs:
    - 2 Kings 9:20
    kjvOsis:
    - 2Kgs.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.21
    scripture: tanakh
    name: Tanakh 2 Kings 9:21
    ref: 2 Kings 9:21
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 21
    ordinal: 9689
    text: 'And Joram said: ‘Make ready.’ And they made ready his chariot. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out to meet Jehu, and found him in the portion of Naboth the Jezreelite.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹרָם אֱסֹר וַיֶּאְסֹר רִכְבּוֹ וַיֵּצֵא יְהוֹרָם מֶלֶךְ־יִשְׂרָאֵל וַאֲחַזְיָהוּ מֶלֶךְ־יְהוּדָה אִישׁ בְּרִכְבּוֹ וַיֵּצְאוּ לִקְרַאת יֵהוּא וַיִּמְצָאֻהוּ בְּחֶלְקַת נָבוֹת הַיִּזְרְעֵאלִי׃
    hebrewPlain: ויאמר יהורם אסר ויאסר רכבו ויצא יהורם מלך ישראל ואחזיהו מלך יהודה איש ברכבו ויצאו לקראת יהוא וימצאהו בחלקת נבות היזרעאלי
    kjvRefs:
    - 2 Kings 9:21
    kjvOsis:
    - 2Kgs.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.22
    scripture: tanakh
    name: Tanakh 2 Kings 9:22
    ref: 2 Kings 9:22
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 22
    ordinal: 9690
    text: 'And it came to pass, when Joram saw Jehu, that he said: ‘Is it peace, Jehu?’ And he answered: ‘What peace, so long as the harlotries of thy mother Jezebel and her witchcrafts are so many?’'
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹת יְהוֹרָם אֶת־יֵהוּא וַיֹּאמֶר הֲשָׁלוֹם יֵהוּא וַיֹּאמֶר מָה הַשָּׁלוֹם עַד־זְנוּנֵי אִיזֶבֶל אִמְּךָ וּכְשָׁפֶיהָ הָרַבִּים׃
    hebrewPlain: ויהי כראות יהורם את יהוא ויאמר השלום יהוא ויאמר מה השלום עד זנוני איזבל אמך וכשפיה הרבים
    kjvRefs:
    - 2 Kings 9:22
    kjvOsis:
    - 2Kgs.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.23
    scripture: tanakh
    name: Tanakh 2 Kings 9:23
    ref: 2 Kings 9:23
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 23
    ordinal: 9691
    text: 'And Joram turned his hands, and fled, and said to Ahaziah: ‘There is treachery, O Ahaziah.’'
    translation: JPS 1917
    original: וַיַּהֲפֹךְ יְהוֹרָם יָדָיו וַיָּנֹס וַיֹּאמֶר אֶל־אֲחַזְיָהוּ מִרְמָה אֲחַזְיָה׃
    hebrewPlain: ויהפך יהורם ידיו וינס ויאמר אל אחזיהו מרמה אחזיה
    kjvRefs:
    - 2 Kings 9:23
    kjvOsis:
    - 2Kgs.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.24
    scripture: tanakh
    name: Tanakh 2 Kings 9:24
    ref: 2 Kings 9:24
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 24
    ordinal: 9692
    text: And Jehu drew his bow with his full strength, and smote Joram between his arms, and the arrow went out at his heart, and he sunk down in his chariot.
    translation: JPS 1917
    original: וְיֵהוּא מִלֵּא יָדוֹ בַקֶּשֶׁת וַיַּךְ אֶת־יְהוֹרָם בֵּין זְרֹעָיו וַיֵּצֵא הַחֵצִי מִלִּבּוֹ וַיִּכְרַע בְּרִכְבּוֹ׃
    hebrewPlain: ויהוא מלא ידו בקשת ויך את יהורם בין זרעיו ויצא החצי מלבו ויכרע ברכבו
    kjvRefs:
    - 2 Kings 9:24
    kjvOsis:
    - 2Kgs.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.25
    scripture: tanakh
    name: Tanakh 2 Kings 9:25
    ref: 2 Kings 9:25
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 25
    ordinal: 9693
    text: 'Then said [Jehu] to Bidkar his captain: ‘Take up, and cast him in the portion of the field of Naboth the Jezreelite; for remember how that, when I and thou rode together after Ahab his father, the LORD pronounced this burden against him:'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־בִּדְקַר שלשה [שָׁלִשׁוֹ] שָׂא הַשְׁלִכֵהוּ בְּחֶלְקַת שְׂדֵה נָבוֹת הַיִּזְרְעֵאלִי כִּי־זְכֹר אֲנִי וָאַתָּה אֵת רֹכְבִים צְמָדִים אַחֲרֵי אַחְאָב אָבִיו וַיהוָה נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה׃
    hebrewPlain: ויאמר אל בדקר שלשה [שלשו] שא השלכהו בחלקת שדה נבות היזרעאלי כי זכר אני ואתה את רכבים צמדים אחרי אחאב אביו ויהוה נשא עליו את המשא הזה
    kjvRefs:
    - 2 Kings 9:25
    kjvOsis:
    - 2Kgs.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.26
    scripture: tanakh
    name: Tanakh 2 Kings 9:26
    ref: 2 Kings 9:26
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 26
    ordinal: 9694
    text: Surely I have seen yesterday the blood of Naboth, and the blood of his sons, saith the LORD; and I will requite thee in this plot, saith the LORD. Now therefore take and cast him into the plot of ground, according to the word of the LORD.’
    translation: JPS 1917
    original: אִם־לֹא אֶת־דְּמֵי נָבוֹת וְאֶת־דְּמֵי בָנָיו רָאִיתִי אֶמֶשׁ נְאֻם־יְהוָה וְשִׁלַּמְתִּי לְךָ בַּחֶלְקָה הַזֹּאת נְאֻם־יְהוָה וְעַתָּה שָׂא הַשְׁלִכֵהוּ בַּחֶלְקָה כִּדְבַר יְהוָה׃
    hebrewPlain: אם לא את דמי נבות ואת דמי בניו ראיתי אמש נאם יהוה ושלמתי לך בחלקה הזאת נאם יהוה ועתה שא השלכהו בחלקה כדבר יהוה
    kjvRefs:
    - 2 Kings 9:26
    kjvOsis:
    - 2Kgs.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.27
    scripture: tanakh
    name: Tanakh 2 Kings 9:27
    ref: 2 Kings 9:27
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 27
    ordinal: 9695
    text: 'But when Ahaziah the king of Judah saw this, he fled by the way of the garden-house. And Jehu followed after him, and said: ‘Smite him also in the chariot’; [and they smote him] at the ascent of Gur, which is by Ibleam. And he fled to Megiddo, and died there.'
    translation: JPS 1917
    original: וַאֲחַזְיָה מֶלֶךְ־יְהוּדָה רָאָה וַיָּנָס דֶּרֶךְ בֵּית הַגָּן וַיִּרְדֹּף אַחֲרָיו יֵהוּא וַיֹּאמֶר גַּם־אֹתוֹ הַכֻּהוּ אֶל־הַמֶּרְכָּבָה בְּמַעֲלֵה־גוּר אֲשֶׁר אֶת־יִבְלְעָם וַיָּנָס מְגִדּוֹ וַיָּמָת שָׁם׃
    hebrewPlain: ואחזיה מלך יהודה ראה וינס דרך בית הגן וירדף אחריו יהוא ויאמר גם אתו הכהו אל המרכבה במעלה גור אשר את יבלעם וינס מגדו וימת שם
    kjvRefs:
    - 2 Kings 9:27
    kjvOsis:
    - 2Kgs.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.28
    scripture: tanakh
    name: Tanakh 2 Kings 9:28
    ref: 2 Kings 9:28
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 28
    ordinal: 9696
    text: And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.
    translation: JPS 1917
    original: וַיַּרְכִּבוּ אֹתוֹ עֲבָדָיו יְרוּשָׁלְָמָה וַיִּקְבְּרוּ אֹתוֹ בִקְבֻרָתוֹ עִם־אֲבֹתָיו בְּעִיר דָּוִד׃
    hebrewPlain: וירכבו אתו עבדיו ירושלמה ויקברו אתו בקברתו עם אבתיו בעיר דוד
    kjvRefs:
    - 2 Kings 9:28
    kjvOsis:
    - 2Kgs.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.29
    scripture: tanakh
    name: Tanakh 2 Kings 9:29
    ref: 2 Kings 9:29
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 29
    ordinal: 9697
    text: And in the eleventh year of Joram the son of Ahab began Ahaziah to reign over Judah.
    translation: JPS 1917
    original: וּבִשְׁנַת אַחַת עֶשְׂרֵה שָׁנָה לְיוֹרָם בֶּן־אַחְאָב מָלַךְ אֲחַזְיָה עַל־יְהוּדָה׃
    hebrewPlain: ובשנת אחת עשרה שנה ליורם בן אחאב מלך אחזיה על יהודה
    kjvRefs:
    - 2 Kings 9:29
    kjvOsis:
    - 2Kgs.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.30
    scripture: tanakh
    name: Tanakh 2 Kings 9:30
    ref: 2 Kings 9:30
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 30
    ordinal: 9698
    text: And when Jehu was come to Jezreel, Jezebel heard of it; and she painted her eyes, and attired her head, and looked out at the window.
    translation: JPS 1917
    original: וַיָּבוֹא יֵהוּא יִזְרְעֶאלָה וְאִיזֶבֶל שָׁמְעָה וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ וַתֵּיטֶב אֶת־רֹאשָׁהּ וַתַּשְׁקֵף בְּעַד הַחַלּוֹן׃
    hebrewPlain: ויבוא יהוא יזרעאלה ואיזבל שמעה ותשם בפוך עיניה ותיטב את ראשה ותשקף בעד החלון
    kjvRefs:
    - 2 Kings 9:30
    kjvOsis:
    - 2Kgs.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.31
    scripture: tanakh
    name: Tanakh 2 Kings 9:31
    ref: 2 Kings 9:31
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 31
    ordinal: 9699
    text: 'And as Jehu entered in at the gate, she said: ‘Is it peace, thou Zimri, thy master’s murderer?’'
    translation: JPS 1917
    original: וְיֵהוּא בָּא בַשָּׁעַר וַתֹּאמֶר הֲשָׁלוֹם זִמְרִי הֹרֵג אֲדֹנָיו׃
    hebrewPlain: ויהוא בא בשער ותאמר השלום זמרי הרג אדניו
    kjvRefs:
    - 2 Kings 9:31
    kjvOsis:
    - 2Kgs.9.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.32
    scripture: tanakh
    name: Tanakh 2 Kings 9:32
    ref: 2 Kings 9:32
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 32
    ordinal: 9700
    text: 'And he lifted up his face to the window, and said: ‘Who is on my side? who?’ And there looked out to him two or three officers.'
    translation: JPS 1917
    original: וַיִּשָּׂא פָנָיו אֶל־הַחַלּוֹן וַיֹּאמֶר מִי אִתִּי מִי וַיַּשְׁקִיפוּ אֵלָיו שְׁנַיִם שְׁלֹשָׁה סָרִיסִים׃
    hebrewPlain: וישא פניו אל החלון ויאמר מי אתי מי וישקיפו אליו שנים שלשה סריסים
    kjvRefs:
    - 2 Kings 9:32
    kjvOsis:
    - 2Kgs.9.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.33
    scripture: tanakh
    name: Tanakh 2 Kings 9:33
    ref: 2 Kings 9:33
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 33
    ordinal: 9701
    text: 'And he said: ‘Throw her down.’ So they threw her down; and some of her blood was sprinkled on the wall, and on the horses; and she was trodden under foot.'
    translation: JPS 1917
    original: וַיֹּאמֶר שמטהו [שִׁמְטוּהָ] וַיִּשְׁמְטוּהָ וַיִּז מִדָּמָהּ אֶל־הַקִּיר וְאֶל־הַסּוּסִים וַיִּרְמְסֶנָּה׃
    hebrewPlain: ויאמר שמטהו [שמטוה] וישמטוה ויז מדמה אל הקיר ואל הסוסים וירמסנה
    kjvRefs:
    - 2 Kings 9:33
    kjvOsis:
    - 2Kgs.9.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.34
    scripture: tanakh
    name: Tanakh 2 Kings 9:34
    ref: 2 Kings 9:34
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 34
    ordinal: 9702
    text: 'And when he was come in, he did eat and drink; and he said: ‘Look now after this cursed woman, and bury her; for she is a king’s daughter.’'
    translation: JPS 1917
    original: וַיָּבֹא וַיֹּאכַל וַיֵּשְׁתְּ וַיֹּאמֶר פִּקְדוּ־נָא אֶת־הָאֲרוּרָה הַזֹּאת וְקִבְרוּהָ כִּי בַת־מֶלֶךְ הִיא׃
    hebrewPlain: ויבא ויאכל וישת ויאמר פקדו נא את הארורה הזאת וקברוה כי בת מלך היא
    kjvRefs:
    - 2 Kings 9:34
    kjvOsis:
    - 2Kgs.9.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.35
    scripture: tanakh
    name: Tanakh 2 Kings 9:35
    ref: 2 Kings 9:35
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 35
    ordinal: 9703
    text: And they went to bury her; but they found no more of her than the skull, and the feet, and the palms of her hands.
    translation: JPS 1917
    original: וַיֵּלְכוּ לְקָבְרָהּ וְלֹא־מָצְאוּ בָהּ כִּי אִם־הַגֻּלְגֹּלֶת וְהָרַגְלַיִם וְכַפּוֹת הַיָּדָיִם׃
    hebrewPlain: וילכו לקברה ולא מצאו בה כי אם הגלגלת והרגלים וכפות הידים
    kjvRefs:
    - 2 Kings 9:35
    kjvOsis:
    - 2Kgs.9.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.9
- type: TanakhVerse
  data:
    osis: 2Kgs.9.36
    scripture: tanakh
    name: Tanakh 2 Kings 9:36
    ref: 2 Kings 9:36
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 36
    ordinal: 9704
    text: 'Wherefore they came back, and told him. And he said: ‘This is the word of the LORD, which He spoke by His servant Elijah the Tishbite, saying: In the portion of Jezreel shall the dogs eat the flesh of Jezebel;'
    translation: JPS 1917
    original: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ וַיֹּאמֶר דְּבַר־יְהוָה הוּא אֲשֶׁר דִּבֶּר בְּיַד־עַבְדּוֹ אֵלִיָּהוּ הַתִּשְׁבִּי לֵאמֹר בְּחֵלֶק יִזְרְעֶאל יֹאכְלוּ הַכְּלָבִים אֶת־בְּשַׂר אִיזָבֶל׃
    hebrewPlain: וישבו ויגידו לו ויאמר דבר יהוה הוא אשר דבר ביד עבדו אליהו התשבי לאמר בחלק יזרעאל יאכלו הכלבים את בשר איזבל
    kjvRefs:
    - 2 Kings 9:36
    kjvOsis:
    - 2Kgs.9.36
  relations:
  - predicate: IN
    to:
