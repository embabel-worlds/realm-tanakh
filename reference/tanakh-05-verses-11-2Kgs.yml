  data:
    osis: 2Kgs.15.12
    scripture: tanakh
    name: Tanakh 2 Kings 15:12
    ref: 2 Kings 15:12
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 12
    ordinal: 9849
    text: 'This was the word of the LORD which He spoke unto Jehu, saying: ‘Thy sons to the fourth generation shall sit upon the throne of Israel.’ And so it came to pass.'
    translation: JPS 1917
    original: הוּא דְבַר־יְהוָה אֲשֶׁר דִּבֶּר אֶל־יֵהוּא לֵאמֹר בְּנֵי רְבִיעִים יֵשְׁבוּ לְךָ עַל־כִּסֵּא יִשְׂרָאֵל וַיְהִי־כֵן׃
    hebrewPlain: הוא דבר יהוה אשר דבר אל יהוא לאמר בני רביעים ישבו לך על כסא ישראל ויהי כן
    kjvRefs:
    - 2 Kings 15:12
    kjvOsis:
    - 2Kgs.15.12
