    text: In the twenty and seventh year of Jeroboam king of Israel began Azariah son of Amaziah king of Judah to reign.
    translation: JPS 1917
    original: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל מָלַךְ עֲזַרְיָה בֶן־אֲמַצְיָה מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת עשרים ושבע שנה לירבעם מלך ישראל מלך עזריה בן אמציה מלך יהודה
