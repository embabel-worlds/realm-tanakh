  data:
    osis: 2Kgs.21.20
    scripture: tanakh
    name: Tanakh 2 Kings 21:20
    ref: 2 Kings 21:20
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 20
    ordinal: 10051
    text: And he did that which was evil in the sight of the LORD, as did Manasseh his father.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו׃
    hebrewPlain: ויעש הרע בעיני יהוה כאשר עשה מנשה אביו
