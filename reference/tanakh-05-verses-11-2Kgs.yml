  data:
    osis: 2Kgs.9.8
    scripture: tanakh
    name: Tanakh 2 Kings 9:8
    ref: 2 Kings 9:8
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 8
    ordinal: 9676
    text: For the whole house of Ahab shall perish; and I will cut off from Ahab every man-child, and him that is shut up and him that is left at large in Israel.
    translation: JPS 1917
    original: וְאָבַד כָּל־בֵּית אַחְאָב וְהִכְרַתִּי לְאַחְאָב מַשְׁתִּין בְּקִיר וְעָצוּר וְעָזוּב בְּיִשְׂרָאֵל׃
    hebrewPlain: ואבד כל בית אחאב והכרתי לאחאב משתין בקיר ועצור ועזוב בישראל
    kjvRefs:
    - 2 Kings 9:8
    kjvOsis:
    - 2Kgs.9.8
