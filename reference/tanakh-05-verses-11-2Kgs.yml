  data:
    osis: 2Kgs.4.20
    scripture: tanakh
    name: Tanakh 2 Kings 4:20
    ref: 2 Kings 4:20
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 20
    ordinal: 9535
    text: And when he had taken him, and brought him to his mother, he sat on her knees till noon, and then died.
    translation: JPS 1917
    original: וַיִּשָּׂאֵהוּ וַיְבִיאֵהוּ אֶל־אִמּוֹ וַיֵּשֶׁב עַל־בִּרְכֶּיהָ עַד־הַצָּהֳרַיִם וַיָּמֹת׃
    hebrewPlain: וישאהו ויביאהו אל אמו וישב על ברכיה עד הצהרים וימת
    kjvRefs:
    - 2 Kings 4:20
    kjvOsis:
    - 2Kgs.4.20
  relations:
