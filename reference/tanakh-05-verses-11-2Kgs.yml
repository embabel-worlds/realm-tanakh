- type: TanakhVerse
  data:
    osis: 2Kgs.6.25
    scripture: tanakh
    name: Tanakh 2 Kings 6:25
    ref: 2 Kings 6:25
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 25
    ordinal: 9611
    text: And there was a great famine in Samaria; and, behold, they besieged it, until an ass’ s head was sold for fourscore pieces of silver, and the fourth part of a kab of dove’s dung for five pieces of silver.
    translation: JPS 1917
    original: וַיְהִי רָעָב גָּדוֹל בְּשֹׁמְרוֹן וְהִנֵּה צָרִים עָלֶיהָ עַד הֱיוֹת רֹאשׁ־חֲמוֹר בִּשְׁמֹנִים כֶּסֶף וְרֹבַע הַקַּב חרייונים [דִּבְיוֹנִים] בַּחֲמִשָּׁה־כָסֶף׃
    hebrewPlain: ויהי רעב גדול בשמרון והנה צרים עליה עד היות ראש חמור בשמנים כסף ורבע הקב חרייונים [דביונים] בחמשה כסף
    kjvRefs:
    - 2 Kings 6:25
    kjvOsis:
    - 2Kgs.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.26
    scripture: tanakh
    name: Tanakh 2 Kings 6:26
    ref: 2 Kings 6:26
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 26
    ordinal: 9612
    text: 'And as the king of Israel was passing by upon the wall, there cried a woman unto him, saying: ‘Help, my lord, O king.’'
    translation: JPS 1917
    original: וַיְהִי מֶלֶךְ יִשְׂרָאֵל עֹבֵר עַל־הַחֹמָה וְאִשָּׁה צָעֲקָה אֵלָיו לֵאמֹר הוֹשִׁיעָה אֲדֹנִי הַמֶּלֶךְ׃
    hebrewPlain: ויהי מלך ישראל עבר על החמה ואשה צעקה אליו לאמר הושיעה אדני המלך
    kjvRefs:
    - 2 Kings 6:26
    kjvOsis:
    - 2Kgs.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.27
    scripture: tanakh
    name: Tanakh 2 Kings 6:27
    ref: 2 Kings 6:27
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 27
    ordinal: 9613
    text: 'And he said: ‘If the LORD do not help thee, whence shall I help thee? out of the threshingfloor, or out of the winepress?’'
    translation: JPS 1917
    original: וַיֹּאמֶר אַל־יוֹשִׁעֵךְ יְהוָה מֵאַיִן אוֹשִׁיעֵךְ הֲמִן־הַגֹּרֶן אוֹ מִן־הַיָּקֶב׃
    hebrewPlain: ויאמר אל יושעך יהוה מאין אושיעך המן הגרן או מן היקב
    kjvRefs:
    - 2 Kings 6:27
    kjvOsis:
    - 2Kgs.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.28
    scripture: tanakh
    name: Tanakh 2 Kings 6:28
    ref: 2 Kings 6:28
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 28
    ordinal: 9614
    text: 'And the king said unto her: ‘What aileth thee?’ And she answered: ‘This woman said unto me: Give thy son, that we may eat him to-day, and we will eat my son to-morrow.'
    translation: JPS 1917
    original: וַיֹּאמֶר־לָהּ הַמֶּלֶךְ מַה־לָּךְ וַתֹּאמֶר הָאִשָּׁה הַזֹּאת אָמְרָה אֵלַי תְּנִי אֶת־בְּנֵךְ וְנֹאכְלֶנּוּ הַיּוֹם וְאֶת־בְּנִי נֹאכַל מָחָר׃
    hebrewPlain: ויאמר לה המלך מה לך ותאמר האשה הזאת אמרה אלי תני את בנך ונאכלנו היום ואת בני נאכל מחר
    kjvRefs:
    - 2 Kings 6:28
    kjvOsis:
    - 2Kgs.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.29
    scripture: tanakh
    name: Tanakh 2 Kings 6:29
    ref: 2 Kings 6:29
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 29
    ordinal: 9615
    text: 'So we boiled my son, and did eat him; and I said unto her on the next day: Give thy son, that we may eat him; and she hath hid her son.’'
    translation: JPS 1917
    original: וַנְּבַשֵּׁל אֶת־בְּנִי וַנֹּאכְלֵהוּ וָאֹמַר אֵלֶיהָ בַּיּוֹם הָאַחֵר תְּנִי אֶת־בְּנֵךְ וְנֹאכְלֶנּוּ וַתַּחְבִּא אֶת־בְּנָהּ׃
    hebrewPlain: ונבשל את בני ונאכלהו ואמר אליה ביום האחר תני את בנך ונאכלנו ותחבא את בנה
    kjvRefs:
    - 2 Kings 6:29
    kjvOsis:
    - 2Kgs.6.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.30
    scripture: tanakh
    name: Tanakh 2 Kings 6:30
    ref: 2 Kings 6:30
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 30
    ordinal: 9616
    text: And it came to pass, when the king heard the words of the woman, that he rent his clothes—now he was passing by upon the wall—and the people looked, and, behold, he had sackcloth within upon his flesh.
    translation: JPS 1917
    original: וַיְהִי כִשְׁמֹעַ הַמֶּלֶךְ אֶת־דִּבְרֵי הָאִשָּׁה וַיִּקְרַע אֶת־בְּגָדָיו וְהוּא עֹבֵר עַל־הַחֹמָה וַיַּרְא הָעָם וְהִנֵּה הַשַּׂק עַל־בְּשָׂרוֹ מִבָּיִת׃
    hebrewPlain: ויהי כשמע המלך את דברי האשה ויקרע את בגדיו והוא עבר על החמה וירא העם והנה השק על בשרו מבית
    kjvRefs:
    - 2 Kings 6:30
    kjvOsis:
    - 2Kgs.6.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.31
    scripture: tanakh
    name: Tanakh 2 Kings 6:31
    ref: 2 Kings 6:31
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 31
    ordinal: 9617
    text: 'Then he said: ‘God do so to me, and more also, if the head of Elisha the son of Shaphat shall stand on him this day.’'
    translation: JPS 1917
    original: וַיֹּאמֶר כֹּה־יַעֲשֶׂה־לִּי אֱלֹהִים וְכֹה יוֹסִף אִם־יַעֲמֹד רֹאשׁ אֱלִישָׁע בֶּן־שָׁפָט עָלָיו הַיּוֹם׃
    hebrewPlain: ויאמר כה יעשה לי אלהים וכה יוסף אם יעמד ראש אלישע בן שפט עליו היום
    kjvRefs:
    - 2 Kings 6:31
    kjvOsis:
    - 2Kgs.6.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.32
    scripture: tanakh
    name: Tanakh 2 Kings 6:32
    ref: 2 Kings 6:32
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 32
    ordinal: 9618
    text: 'But Elisha sat in his house, and the elders sat with him; and the king sent a man from before him; but ere the messenger came to him, he said to the elders: ‘See ye how this son of a murderer hath sent to take away my head? look, when the messenger cometh, shut the door, and hold the door fast against him; is not the sound of his master’s feet behind him?’'
    translation: JPS 1917
    original: וֶאֱלִישָׁע יֹשֵׁב בְּבֵיתוֹ וְהַזְּקֵנִים יֹשְׁבִים אִתּוֹ וַיִּשְׁלַח אִישׁ מִלְּפָנָיו בְּטֶרֶם יָבֹא הַמַּלְאָךְ אֵלָיו וְהוּא אָמַר אֶל־הַזְּקֵנִים הַרְּאִיתֶם כִּי־שָׁלַח בֶּן־הַמְרַצֵּחַ הַזֶּה לְהָסִיר אֶת־רֹאשִׁי רְאוּ כְּבֹא הַמַּלְאָךְ סִגְרוּ הַדֶּלֶת וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו׃
    hebrewPlain: ואלישע ישב בביתו והזקנים ישבים אתו וישלח איש מלפניו בטרם יבא המלאך אליו והוא אמר אל הזקנים הראיתם כי שלח בן המרצח הזה להסיר את ראשי ראו כבא המלאך סגרו הדלת ולחצתם אתו בדלת הלוא קול רגלי אדניו אחריו
    kjvRefs:
    - 2 Kings 6:32
    kjvOsis:
    - 2Kgs.6.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.33
    scripture: tanakh
    name: Tanakh 2 Kings 6:33
    ref: 2 Kings 6:33
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 33
    ordinal: 9619
    text: 'And while he yet talked with them, behold, the messenger came down unto him; and [the king] said: ‘Behold, this evil is of the LORD; why should I wait for the LORD any longer?’'
    translation: JPS 1917
    original: עוֹדֶנּוּ מְדַבֵּר עִמָּם וְהִנֵּה הַמַּלְאָךְ יֹרֵד אֵלָיו וַיֹּאמֶר הִנֵּה־זֹאת הָרָעָה מֵאֵת יְהוָה מָה־אוֹחִיל לַיהוָה עוֹד׃
    hebrewPlain: עודנו מדבר עמם והנה המלאך ירד אליו ויאמר הנה זאת הרעה מאת יהוה מה אוחיל ליהוה עוד
    kjvRefs:
    - 2 Kings 6:33
    kjvOsis:
    - 2Kgs.6.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.7.1
    scripture: tanakh
    name: Tanakh 2 Kings 7:1
    ref: 2 Kings 7:1
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 1
    ordinal: 9620
    text: 'And Elisha said: ‘Hear ye the word of the LORD; thus saith the LORD: To-morrow about this time shall a measure of fine flour be sold for a shekel, and two measures of barley for a shekel, in the gate of Samaria.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֱלִישָׁע שִׁמְעוּ דְּבַר־יְהוָה כֹּה אָמַר יְהוָה כָּעֵת מָחָר סְאָה־סֹלֶת בְּשֶׁקֶל וְסָאתַיִם שְׂעֹרִים בְּשֶׁקֶל בְּשַׁעַר שֹׁמְרוֹן׃
    hebrewPlain: ויאמר אלישע שמעו דבר יהוה כה אמר יהוה כעת מחר סאה סלת בשקל וסאתים שערים בשקל בשער שמרון
    kjvRefs:
    - 2 Kings 7:1
    kjvOsis:
    - 2Kgs.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.2
    scripture: tanakh
    name: Tanakh 2 Kings 7:2
    ref: 2 Kings 7:2
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 2
    ordinal: 9621
    text: 'Then the captain on whose hand the king leaned answered the man of God, and said: ‘Behold, if the LORD should make windows in heaven, might this thing be?’ And he said: ‘Behold, thou shalt see it with thine eyes, but shalt not eat thereof.’'
    translation: JPS 1917
    original: וַיַּעַן הַשָּׁלִישׁ אֲשֶׁר־לַמֶּלֶךְ נִשְׁעָן עַל־יָדוֹ אֶת־אִישׁ הָאֱלֹהִים וַיֹּאמַר הִנֵּה יְהוָה עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם הֲיִהְיֶה הַדָּבָר הַזֶּה וַיֹּאמֶר הִנְּכָה רֹאֶה בְּעֵינֶיךָ וּמִשָּׁם לֹא תֹאכֵל׃
    hebrewPlain: ויען השליש אשר למלך נשען על ידו את איש האלהים ויאמר הנה יהוה עשה ארבות בשמים היהיה הדבר הזה ויאמר הנכה ראה בעיניך ומשם לא תאכל
    kjvRefs:
    - 2 Kings 7:2
    kjvOsis:
    - 2Kgs.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.3
    scripture: tanakh
    name: Tanakh 2 Kings 7:3
    ref: 2 Kings 7:3
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 3
    ordinal: 9622
    text: 'Now there were four leprous men at the entrance of the gate; and they said one to another: ‘Why sit we here until we die?'
    translation: JPS 1917
    original: וְאַרְבָּעָה אֲנָשִׁים הָיוּ מְצֹרָעִים פֶּתַח הַשָּׁעַר וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ מָה אֲנַחְנוּ יֹשְׁבִים פֹּה עַד־מָתְנוּ׃
    hebrewPlain: וארבעה אנשים היו מצרעים פתח השער ויאמרו איש אל רעהו מה אנחנו ישבים פה עד מתנו
    kjvRefs:
    - 2 Kings 7:3
    kjvOsis:
    - 2Kgs.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.4
    scripture: tanakh
    name: Tanakh 2 Kings 7:4
    ref: 2 Kings 7:4
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 4
    ordinal: 9623
    text: 'If we say: We will enter into the city, then the famine is in the city, and we shall die there; and if we sit still here, we die also. Now therefore come, and let us fall unto the host of the Arameans; if they save us alive, we shall live; and if they kill us, we shall but die.’'
    translation: JPS 1917
    original: אִם־אָמַרְנוּ נָבוֹא הָעִיר וְהָרָעָב בָּעִיר וָמַתְנוּ שָׁם וְאִם־יָשַׁבְנוּ פֹה וָמָתְנוּ וְעַתָּה לְכוּ וְנִפְּלָה אֶל־מַחֲנֵה אֲרָם אִם־יְחַיֻּנוּ נִחְיֶה וְאִם־יְמִיתֻנוּ וָמָתְנוּ׃
    hebrewPlain: אם אמרנו נבוא העיר והרעב בעיר ומתנו שם ואם ישבנו פה ומתנו ועתה לכו ונפלה אל מחנה ארם אם יחינו נחיה ואם ימיתנו ומתנו
    kjvRefs:
    - 2 Kings 7:4
    kjvOsis:
    - 2Kgs.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.5
    scripture: tanakh
    name: Tanakh 2 Kings 7:5
    ref: 2 Kings 7:5
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 5
    ordinal: 9624
    text: And they rose up in the twilight, to go unto the camp of the Arameans; and when they were come to the outermost part of the camp of the Arameans, behold, there was no man there.
    translation: JPS 1917
    original: וַיָּקוּמוּ בַנֶּשֶׁף לָבוֹא אֶל־מַחֲנֵה אֲרָם וַיָּבֹאוּ עַד־קְצֵה מַחֲנֵה אֲרָם וְהִנֵּה אֵין־שָׁם אִישׁ׃
    hebrewPlain: ויקומו בנשף לבוא אל מחנה ארם ויבאו עד קצה מחנה ארם והנה אין שם איש
    kjvRefs:
    - 2 Kings 7:5
    kjvOsis:
    - 2Kgs.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.6
    scripture: tanakh
    name: Tanakh 2 Kings 7:6
    ref: 2 Kings 7:6
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 6
    ordinal: 9625
    text: 'For the Lord had made the host of the Arameans to hear a noise of chariots, and a noise of horses, even the noise of a great host; and they said one to another: ‘Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.’'
    translation: JPS 1917
    original: וַאדֹנָי הִשְׁמִיעַ אֶת־מַחֲנֵה אֲרָם קוֹל רֶכֶב קוֹל סוּס קוֹל חַיִל גָּדוֹל וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו הִנֵּה שָׂכַר־עָלֵינוּ מֶלֶךְ יִשְׂרָאֵל אֶת־מַלְכֵי הַחִתִּים וְאֶת־מַלְכֵי מִצְרַיִם לָבוֹא עָלֵינוּ׃
    hebrewPlain: ואדני השמיע את מחנה ארם קול רכב קול סוס קול חיל גדול ויאמרו איש אל אחיו הנה שכר עלינו מלך ישראל את מלכי החתים ואת מלכי מצרים לבוא עלינו
    kjvRefs:
    - 2 Kings 7:6
    kjvOsis:
    - 2Kgs.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.7
    scripture: tanakh
    name: Tanakh 2 Kings 7:7
    ref: 2 Kings 7:7
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 7
    ordinal: 9626
    text: Wherefore they arose and fled in the twilight, and left their tents, and their horses, and their asses, even the camp as it was, and fled for their life.
    translation: JPS 1917
    original: וַיָּקוּמוּ וַיָּנוּסוּ בַנֶּשֶׁף וַיַּעַזְבוּ אֶת־אָהֳלֵיהֶם וְאֶת־סוּסֵיהֶם וְאֶת־חֲמֹרֵיהֶם הַמַּחֲנֶה כַּאֲשֶׁר־הִיא וַיָּנֻסוּ אֶל־נַפְשָׁם׃
    hebrewPlain: ויקומו וינוסו בנשף ויעזבו את אהליהם ואת סוסיהם ואת חמריהם המחנה כאשר היא וינסו אל נפשם
    kjvRefs:
    - 2 Kings 7:7
    kjvOsis:
    - 2Kgs.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.8
    scripture: tanakh
    name: Tanakh 2 Kings 7:8
    ref: 2 Kings 7:8
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 8
    ordinal: 9627
    text: And when these lepers came to the outermost part of the camp, they went into one tent, and did eat and drink, and carried thence silver, and gold, and raiment, and went and hid it; and they came back, and entered into another tent, and carried thence also, and went and hid it.
    translation: JPS 1917
    original: וַיָּבֹאוּ הַמְצֹרָעִים הָאֵלֶּה עַד־קְצֵה הַמַּחֲנֶה וַיָּבֹאוּ אֶל־אֹהֶל אֶחָד וַיֹּאכְלוּ וַיִּשְׁתּוּ וַיִּשְׂאוּ מִשָּׁם כֶּסֶף וְזָהָב וּבְגָדִים וַיֵּלְכוּ וַיַּטְמִנוּ וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־אֹהֶל אַחֵר וַיִּשְׂאוּ מִשָּׁם וַיֵּלְכוּ וַיַּטְמִנוּ׃
    hebrewPlain: ויבאו המצרעים האלה עד קצה המחנה ויבאו אל אהל אחד ויאכלו וישתו וישאו משם כסף וזהב ובגדים וילכו ויטמנו וישבו ויבאו אל אהל אחר וישאו משם וילכו ויטמנו
    kjvRefs:
    - 2 Kings 7:8
    kjvOsis:
    - 2Kgs.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.9
    scripture: tanakh
    name: Tanakh 2 Kings 7:9
    ref: 2 Kings 7:9
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 9
    ordinal: 9628
    text: 'Then they said one to another: ‘We do not well; this day is a day of good tidings, and we hold our peace; if we tarry till the morning light, punishment will overtake us; now therefore come, let us go and tell the king’s household.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אִישׁ אֶל־רֵעֵהוּ לֹא־כֵן אֲנַחְנוּ עֹשִׂים הַיּוֹם הַזֶּה יוֹם־בְּשֹׂרָה הוּא וַאֲנַחְנוּ מַחְשִׁים וְחִכִּינוּ עַד־אוֹר הַבֹּקֶר וּמְצָאָנוּ עָווֹן וְעַתָּה לְכוּ וְנָבֹאָה וְנַגִּידָה בֵּית הַמֶּלֶךְ׃
    hebrewPlain: ויאמרו איש אל רעהו לא כן אנחנו עשים היום הזה יום בשרה הוא ואנחנו מחשים וחכינו עד אור הבקר ומצאנו עוון ועתה לכו ונבאה ונגידה בית המלך
    kjvRefs:
    - 2 Kings 7:9
    kjvOsis:
    - 2Kgs.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.10
    scripture: tanakh
    name: Tanakh 2 Kings 7:10
    ref: 2 Kings 7:10
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 10
    ordinal: 9629
    text: So they came and called unto the porters of the city; and they told them, saying. 'We came to the camp of the Arameans, and, behold, there was no man there, neither voice of man, but the horses tied, and the asses tied, and the tents as they were.’
    translation: JPS 1917
    original: וַיָּבֹאוּ וַיִּקְרְאוּ אֶל־שֹׁעֵר הָעִיר וַיַּגִּידוּ לָהֶם לֵאמֹר בָּאנוּ אֶל־מַחֲנֵה אֲרָם וְהִנֵּה אֵין־שָׁם אִישׁ וְקוֹל אָדָם כִּי אִם־הַסּוּס אָסוּר וְהַחֲמוֹר אָסוּר וְאֹהָלִים כַּאֲשֶׁר־הֵמָּה׃
    hebrewPlain: ויבאו ויקראו אל שער העיר ויגידו להם לאמר באנו אל מחנה ארם והנה אין שם איש וקול אדם כי אם הסוס אסור והחמור אסור ואהלים כאשר המה
    kjvRefs:
    - 2 Kings 7:10
    kjvOsis:
    - 2Kgs.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.11
    scripture: tanakh
    name: Tanakh 2 Kings 7:11
    ref: 2 Kings 7:11
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 11
    ordinal: 9630
    text: And the porters called, and they told it to the king’s household within.
    translation: JPS 1917
    original: וַיִּקְרָא הַשֹּׁעֲרִים וַיַּגִּידוּ בֵּית הַמֶּלֶךְ פְּנִימָה׃
    hebrewPlain: ויקרא השערים ויגידו בית המלך פנימה
    kjvRefs:
    - 2 Kings 7:11
    kjvOsis:
    - 2Kgs.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.12
    scripture: tanakh
    name: Tanakh 2 Kings 7:12
    ref: 2 Kings 7:12
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 12
    ordinal: 9631
    text: 'And the king arose in the night, and said unto his servants: ‘I will now tell you what the Arameans have done to us. They know that we are hungry; therefore are they gone out of the camp to hide themselves in the field, saying: When they come out of the city, we shall take them alive, and get into the city.’'
    translation: JPS 1917
    original: וַיָּקָם הַמֶּלֶךְ לַיְלָה וַיֹּאמֶר אֶל־עֲבָדָיו אַגִּידָה־נָּא לָכֶם אֵת אֲשֶׁר־עָשׂוּ לָנוּ אֲרָם יָדְעוּ כִּי־רְעֵבִים אֲנַחְנוּ וַיֵּצְאוּ מִן־הַמַּחֲנֶה לְהֵחָבֵה בהשדה [בַשָּׂדֶה] לֵאמֹר כִּי־יֵצְאוּ מִן־הָעִיר וְנִתְפְּשֵׂם חַיִּים וְאֶל־הָעִיר נָבֹא׃
    hebrewPlain: ויקם המלך לילה ויאמר אל עבדיו אגידה נא לכם את אשר עשו לנו ארם ידעו כי רעבים אנחנו ויצאו מן המחנה להחבה בהשדה [בשדה] לאמר כי יצאו מן העיר ונתפשם חיים ואל העיר נבא
    kjvRefs:
    - 2 Kings 7:12
    kjvOsis:
    - 2Kgs.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.13
    scripture: tanakh
    name: Tanakh 2 Kings 7:13
    ref: 2 Kings 7:13
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 13
    ordinal: 9632
    text: 'And one of his servants answered and said: ‘Let some take, I pray thee, five of the horses that remain, which are left in the city— behold, they are as all the multitude of Israel that are left in it; behold, they are as all the multitude of Israel that are consumed—and let us send and see.’'
    translation: JPS 1917
    original: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר וְיִקְחוּ־נָא חֲמִשָּׁה מִן־הַסּוּסִים הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ־בָהּ הִנָּם כְּכָל־ההמון [הֲמוֹן] יִשְׂרָאֵל אֲשֶׁר נִשְׁאֲרוּ־בָהּ הִנָּם כְּכָל־הֲמוֹן יִשְׂרָאֵל אֲשֶׁר־תָּמּוּ וְנִשְׁלְחָה וְנִרְאֶה׃
    hebrewPlain: ויען אחד מעבדיו ויאמר ויקחו נא חמשה מן הסוסים הנשארים אשר נשארו בה הנם ככל ההמון [המון] ישראל אשר נשארו בה הנם ככל המון ישראל אשר תמו ונשלחה ונראה
    kjvRefs:
    - 2 Kings 7:13
    kjvOsis:
    - 2Kgs.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.14
    scripture: tanakh
    name: Tanakh 2 Kings 7:14
    ref: 2 Kings 7:14
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 14
    ordinal: 9633
    text: 'They took therefore two chariots with horses; and the king sent after the host of the Arameans, saying: ‘Go and see.’'
    translation: JPS 1917
    original: וַיִּקְחוּ שְׁנֵי רֶכֶב סוּסִים וַיִּשְׁלַח הַמֶּלֶךְ אַחֲרֵי מַחֲנֵה־אֲרָם לֵאמֹר לְכוּ וּרְאוּ׃
    hebrewPlain: ויקחו שני רכב סוסים וישלח המלך אחרי מחנה ארם לאמר לכו וראו
    kjvRefs:
    - 2 Kings 7:14
    kjvOsis:
    - 2Kgs.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.15
    scripture: tanakh
    name: Tanakh 2 Kings 7:15
    ref: 2 Kings 7:15
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 15
    ordinal: 9634
    text: And they went after them unto the Jordan; and, lo, all the way was full of garments and vessels, which the Arameans had cast away in their haste. And the messengers returned, and told the king.
    translation: JPS 1917
    original: וַיֵּלְכוּ אַחֲרֵיהֶם עַד־הַיַּרְדֵּן וְהִנֵּה כָל־הַדֶּרֶךְ מְלֵאָה בְגָדִים וְכֵלִים אֲשֶׁר־הִשְׁלִיכוּ אֲרָם בהחפזם [בְּחָפְזָם] וַיָּשֻׁבוּ הַמַּלְאָכִים וַיַּגִּדוּ לַמֶּלֶךְ׃
    hebrewPlain: וילכו אחריהם עד הירדן והנה כל הדרך מלאה בגדים וכלים אשר השליכו ארם בהחפזם [בחפזם] וישבו המלאכים ויגדו למלך
    kjvRefs:
    - 2 Kings 7:15
    kjvOsis:
    - 2Kgs.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.16
    scripture: tanakh
    name: Tanakh 2 Kings 7:16
    ref: 2 Kings 7:16
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 16
    ordinal: 9635
    text: And the people went out, and spoiled the camp of the Arameans. So a measure of fine flour was sold for a shekel, and two measures of barley for a shekel, according to the word of the LORD.
    translation: JPS 1917
    original: וַיֵּצֵא הָעָם וַיָּבֹזּוּ אֵת מַחֲנֵה אֲרָם וַיְהִי סְאָה־סֹלֶת בְּשֶׁקֶל וְסָאתַיִם שְׂעֹרִים בְּשֶׁקֶל כִּדְבַר יְהוָה׃
    hebrewPlain: ויצא העם ויבזו את מחנה ארם ויהי סאה סלת בשקל וסאתים שערים בשקל כדבר יהוה
    kjvRefs:
    - 2 Kings 7:16
    kjvOsis:
    - 2Kgs.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.17
    scripture: tanakh
    name: Tanakh 2 Kings 7:17
    ref: 2 Kings 7:17
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 17
    ordinal: 9636
    text: And the king appointed the captain on whose hand he leaned to have the charge of the gate; and the people trod upon him in the gate, and he died as the man of God had said, who spoke when the king came down to him.
    translation: JPS 1917
    original: וְהַמֶּלֶךְ הִפְקִיד אֶת־הַשָּׁלִישׁ אֲשֶׁר־נִשְׁעָן עַל־יָדוֹ עַל־הַשַּׁעַר וַיִּרְמְסֻהוּ הָעָם בַּשַּׁעַר וַיָּמֹת כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים אֲשֶׁר דִּבֶּר בְּרֶדֶת הַמֶּלֶךְ אֵלָיו׃
    hebrewPlain: והמלך הפקיד את השליש אשר נשען על ידו על השער וירמסהו העם בשער וימת כאשר דבר איש האלהים אשר דבר ברדת המלך אליו
    kjvRefs:
    - 2 Kings 7:17
    kjvOsis:
    - 2Kgs.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.18
    scripture: tanakh
    name: Tanakh 2 Kings 7:18
    ref: 2 Kings 7:18
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 18
    ordinal: 9637
    text: 'And it came to pass, as the man of God had spoken to the king, saying: ‘Two measures of barley for a shekel, and a measure of fine flour for a shekel, shall be to-morrow about this time in the gate of Samaria’;'
    translation: JPS 1917
    original: וַיְהִי כְּדַבֵּר אִישׁ הָאֱלֹהִים אֶל־הַמֶּלֶךְ לֵאמֹר סָאתַיִם שְׂעֹרִים בְּשֶׁקֶל וּסְאָה־סֹלֶת בְּשֶׁקֶל יִהְיֶה כָּעֵת מָחָר בְּשַׁעַר שֹׁמְרוֹן׃
    hebrewPlain: ויהי כדבר איש האלהים אל המלך לאמר סאתים שערים בשקל וסאה סלת בשקל יהיה כעת מחר בשער שמרון
    kjvRefs:
    - 2 Kings 7:18
    kjvOsis:
    - 2Kgs.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.19
    scripture: tanakh
    name: Tanakh 2 Kings 7:19
    ref: 2 Kings 7:19
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 19
    ordinal: 9638
    text: 'and that captain answered the man of God, and said: ‘Now, behold, if the LORD should make windows in heaven, might such a thing be?’ and he said: ‘Behold, thou shalt see it with thine eyes, but shalt not eat thereof’;'
    translation: JPS 1917
    original: וַיַּעַן הַשָּׁלִישׁ אֶת־אִישׁ הָאֱלֹהִים וַיֹּאמַר וְהִנֵּה יְהוָה עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם הֲיִהְיֶה כַּדָּבָר הַזֶּה וַיֹּאמֶר הִנְּךָ רֹאֶה בְּעֵינֶיךָ וּמִשָּׁם לֹא תֹאכֵל׃
    hebrewPlain: ויען השליש את איש האלהים ויאמר והנה יהוה עשה ארבות בשמים היהיה כדבר הזה ויאמר הנך ראה בעיניך ומשם לא תאכל
    kjvRefs:
    - 2 Kings 7:19
    kjvOsis:
    - 2Kgs.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.7.20
    scripture: tanakh
    name: Tanakh 2 Kings 7:20
    ref: 2 Kings 7:20
    book: 2Kgs
    section: neviim
    chapter: 7
    verse: 20
    ordinal: 9639
    text: it came to pass even so unto him; for the people trod upon him in the gate, and he died.
    translation: JPS 1917
    original: וַיְהִי־לוֹ כֵּן וַיִּרְמְסוּ אֹתוֹ הָעָם בַּשַּׁעַר וַיָּמֹת׃
    hebrewPlain: ויהי לו כן וירמסו אתו העם בשער וימת
    kjvRefs:
    - 2 Kings 7:20
    kjvOsis:
    - 2Kgs.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.7
- type: TanakhVerse
  data:
    osis: 2Kgs.8.1
    scripture: tanakh
    name: Tanakh 2 Kings 8:1
    ref: 2 Kings 8:1
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 1
    ordinal: 9640
    text: 'Now Elisha had spoken unto the woman, whose son he had restored to life, saying: ‘Arise, and go thou and thy household, and sojourn wheresoever thou canst sojourn; for the LORD hath called for a famine; and it shall also come upon the land seven years.’'
    translation: JPS 1917
    original: וֶאֱלִישָׁע דִּבֶּר אֶל־הָאִשָּׁה אֲשֶׁר־הֶחֱיָה אֶת־בְּנָהּ לֵאמֹר קוּמִי וּלְכִי אתי [אַתְּ] וּבֵיתֵךְ וְגוּרִי בַּאֲשֶׁר תָּגוּרִי כִּי־קָרָא יְהוָה לָרָעָב וְגַם־בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים׃
    hebrewPlain: ואלישע דבר אל האשה אשר החיה את בנה לאמר קומי ולכי אתי [את] וביתך וגורי באשר תגורי כי קרא יהוה לרעב וגם בא אל הארץ שבע שנים
    kjvRefs:
    - 2 Kings 8:1
    kjvOsis:
    - 2Kgs.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.2
    scripture: tanakh
    name: Tanakh 2 Kings 8:2
    ref: 2 Kings 8:2
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 2
    ordinal: 9641
    text: And the woman arose, and did according to the word of the man of God; and she went with her household, and sojourned in the land of the Philistines seven years.
    translation: JPS 1917
    original: וַתָּקָם הָאִשָּׁה וַתַּעַשׂ כִּדְבַר אִישׁ הָאֱלֹהִים וַתֵּלֶךְ הִיא וּבֵיתָהּ וַתָּגָר בְּאֶרֶץ־פְּלִשְׁתִּים שֶׁבַע שָׁנִים׃
    hebrewPlain: ותקם האשה ותעש כדבר איש האלהים ותלך היא וביתה ותגר בארץ פלשתים שבע שנים
    kjvRefs:
    - 2 Kings 8:2
    kjvOsis:
    - 2Kgs.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.3
    scripture: tanakh
    name: Tanakh 2 Kings 8:3
    ref: 2 Kings 8:3
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 3
    ordinal: 9642
    text: And it came to pass at the seven years’ end, that the woman returned out of the land of the Philistines; and she went forth to cry unto the king for her house and for her land.
    translation: JPS 1917
    original: וַיְהִי מִקְצֵה שֶׁבַע שָׁנִים וַתָּשָׁב הָאִשָּׁה מֵאֶרֶץ פְּלִשְׁתִּים וַתֵּצֵא לִצְעֹק אֶל־הַמֶּלֶךְ אֶל־בֵּיתָהּ וְאֶל־שָׂדָהּ׃
    hebrewPlain: ויהי מקצה שבע שנים ותשב האשה מארץ פלשתים ותצא לצעק אל המלך אל ביתה ואל שדה
    kjvRefs:
    - 2 Kings 8:3
    kjvOsis:
    - 2Kgs.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.4
    scripture: tanakh
    name: Tanakh 2 Kings 8:4
    ref: 2 Kings 8:4
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 4
    ordinal: 9643
    text: 'Now the king was talking with Gehazi the servant of the man of God, saying: ‘Tell me, I pray thee, all the great things that Elisha hath done.’'
    translation: JPS 1917
    original: וְהַמֶּלֶךְ מְדַבֵּר אֶל־גֵּחֲזִי נַעַר אִישׁ־הָאֱלֹהִים לֵאמֹר סַפְּרָה־נָּא לִי אֵת כָּל־הַגְּדֹלוֹת אֲשֶׁר־עָשָׂה אֱלִישָׁע׃
    hebrewPlain: והמלך מדבר אל גחזי נער איש האלהים לאמר ספרה נא לי את כל הגדלות אשר עשה אלישע
    kjvRefs:
    - 2 Kings 8:4
    kjvOsis:
    - 2Kgs.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.5
    scripture: tanakh
    name: Tanakh 2 Kings 8:5
    ref: 2 Kings 8:5
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 5
    ordinal: 9644
    text: 'And it came to pass, as he was telling the king how he had restored to life him that was dead, that, behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said: ‘My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.’'
    translation: JPS 1917
    original: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ אֵת אֲשֶׁר־הֶחֱיָה אֶת־הַמֵּת וְהִנֵּה הָאִשָּׁה אֲשֶׁר־הֶחֱיָה אֶת־בְּנָהּ צֹעֶקֶת אֶל־הַמֶּלֶךְ עַל־בֵּיתָהּ וְעַל־שָׂדָהּ וַיֹּאמֶר גֵּחֲזִי אֲדֹנִי הַמֶּלֶךְ זֹאת הָאִשָּׁה וְזֶה־בְּנָהּ אֲשֶׁר־הֶחֱיָה אֱלִישָׁע׃
    hebrewPlain: ויהי הוא מספר למלך את אשר החיה את המת והנה האשה אשר החיה את בנה צעקת אל המלך על ביתה ועל שדה ויאמר גחזי אדני המלך זאת האשה וזה בנה אשר החיה אלישע
    kjvRefs:
    - 2 Kings 8:5
    kjvOsis:
    - 2Kgs.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.6
    scripture: tanakh
    name: Tanakh 2 Kings 8:6
    ref: 2 Kings 8:6
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 6
    ordinal: 9645
    text: 'And when the king asked the woman, she told him. So the king appointed unto her a certain officer, saying: ‘Restore all that was hers, and all the fruits of the field since the day that she left the land, even until now.’'
    translation: JPS 1917
    original: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה וַתְּסַפֶּר־לוֹ וַיִּתֶּן־לָהּ הַמֶּלֶךְ סָרִיס אֶחָד לֵאמֹר הָשֵׁיב אֶת־כָּל־אֲשֶׁר־לָהּ וְאֵת כָּל־תְּבוּאֹת הַשָּׂדֶה מִיּוֹם עָזְבָה אֶת־הָאָרֶץ וְעַד־עָתָּה׃
    hebrewPlain: וישאל המלך לאשה ותספר לו ויתן לה המלך סריס אחד לאמר השיב את כל אשר לה ואת כל תבואת השדה מיום עזבה את הארץ ועד עתה
    kjvRefs:
    - 2 Kings 8:6
    kjvOsis:
    - 2Kgs.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.7
    scripture: tanakh
    name: Tanakh 2 Kings 8:7
    ref: 2 Kings 8:7
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 7
    ordinal: 9646
    text: And Elisha came to Damascus; and Ben-hadad the king of Aram was sick; and it was told him, saying. 'The man of God is come hither.’
    translation: JPS 1917
    original: וַיָּבֹא אֱלִישָׁע דַּמֶּשֶׂק וּבֶן־הֲדַד מֶלֶךְ־אֲרָם חֹלֶה וַיֻּגַּד־לוֹ לֵאמֹר בָּא אִישׁ הָאֱלֹהִים עַד־הֵנָּה׃
    hebrewPlain: ויבא אלישע דמשק ובן הדד מלך ארם חלה ויגד לו לאמר בא איש האלהים עד הנה
    kjvRefs:
    - 2 Kings 8:7
    kjvOsis:
    - 2Kgs.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.8
    scripture: tanakh
    name: Tanakh 2 Kings 8:8
    ref: 2 Kings 8:8
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 8
    ordinal: 9647
    text: 'And the king said unto Hazael: ‘Take a present in thy hand, and go meet the man of God, and inquire of the LORD by him, saying: Shall I recover of this sickness?’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ אֶל־חֲזָהאֵל קַח בְּיָדְךָ מִנְחָה וְלֵךְ לִקְרַאת אִישׁ הָאֱלֹהִים וְדָרַשְׁתָּ אֶת־יְהוָה מֵאוֹתוֹ לֵאמֹר הַאֶחְיֶה מֵחֳלִי זֶה׃
    hebrewPlain: ויאמר המלך אל חזהאל קח בידך מנחה ולך לקראת איש האלהים ודרשת את יהוה מאותו לאמר האחיה מחלי זה
    kjvRefs:
    - 2 Kings 8:8
    kjvOsis:
    - 2Kgs.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.9
    scripture: tanakh
    name: Tanakh 2 Kings 8:9
    ref: 2 Kings 8:9
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 9
    ordinal: 9648
    text: 'So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels’ burden, and came and stood before him, and said: ‘Thy son Ben-hadad king of Aram hath sent me to thee, saying: Shall I recover of this sickness?’'
    translation: JPS 1917
    original: וַיֵּלֶךְ חֲזָאֵל לִקְרָאתוֹ וַיִּקַּח מִנְחָה בְיָדוֹ וְכָל־טוּב דַּמֶּשֶׂק מַשָּׂא אַרְבָּעִים גָּמָל וַיָּבֹא וַיַּעֲמֹד לְפָנָיו וַיֹּאמֶר בִּנְךָ בֶן־הֲדַד מֶלֶךְ־אֲרָם שְׁלָחַנִי אֵלֶיךָ לֵאמֹר הַאֶחְיֶה מֵחֳלִי זֶה׃
    hebrewPlain: וילך חזאל לקראתו ויקח מנחה בידו וכל טוב דמשק משא ארבעים גמל ויבא ויעמד לפניו ויאמר בנך בן הדד מלך ארם שלחני אליך לאמר האחיה מחלי זה
    kjvRefs:
    - 2 Kings 8:9
    kjvOsis:
    - 2Kgs.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.10
    scripture: tanakh
    name: Tanakh 2 Kings 8:10
    ref: 2 Kings 8:10
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 10
    ordinal: 9649
    text: 'And Elisha said unto him: ‘Go, say unto him: Thou shalt surely recover; howbeit the LORD hath shown me that he shall surely die.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו אֱלִישָׁע לֵךְ אֱמָר־לא [לוֹ] חָיֹה תִחְיֶה וְהִרְאַנִי יְהוָה כִּי־מוֹת יָמוּת׃
    hebrewPlain: ויאמר אליו אלישע לך אמר לא [לו] חיה תחיה והראני יהוה כי מות ימות
    kjvRefs:
    - 2 Kings 8:10
    kjvOsis:
    - 2Kgs.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.11
    scripture: tanakh
    name: Tanakh 2 Kings 8:11
    ref: 2 Kings 8:11
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 11
    ordinal: 9650
    text: And he settled his countenance stedfastly upon him, until he was ashamed; and the man of God wept.
    translation: JPS 1917
    original: וַיַּעֲמֵד אֶת־פָּנָיו וַיָּשֶׂם עַד־בֹּשׁ וַיֵּבְךְּ אִישׁ הָאֱלֹהִים׃
    hebrewPlain: ויעמד את פניו וישם עד בש ויבך איש האלהים
    kjvRefs:
    - 2 Kings 8:11
    kjvOsis:
    - 2Kgs.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.12
    scripture: tanakh
    name: Tanakh 2 Kings 8:12
    ref: 2 Kings 8:12
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 12
    ordinal: 9651
    text: 'And Hazael said: ‘Why weepeth my lord?’ And he answered: ‘Because I know the evil that thou wilt do unto the children of Israel: their strongholds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash in pieces their little ones, and rip up their women with child.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חֲזָאֵל מַדּוּעַ אֲדֹנִי בֹכֶה וַיֹּאמֶר כִּי־יָדַעְתִּי אֵת אֲשֶׁר־תַּעֲשֶׂה לִבְנֵי יִשְׂרָאֵל רָעָה מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ וּבַחֻרֵיהֶם בַּחֶרֶב תַּהֲרֹג וְעֹלְלֵיהֶם תְּרַטֵּשׁ וְהָרֹתֵיהֶם תְּבַקֵּעַ׃
    hebrewPlain: ויאמר חזאל מדוע אדני בכה ויאמר כי ידעתי את אשר תעשה לבני ישראל רעה מבצריהם תשלח באש ובחריהם בחרב תהרג ועלליהם תרטש והרתיהם תבקע
    kjvRefs:
    - 2 Kings 8:12
    kjvOsis:
    - 2Kgs.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.13
    scripture: tanakh
    name: Tanakh 2 Kings 8:13
    ref: 2 Kings 8:13
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 13
    ordinal: 9652
    text: 'And Hazael said: ‘But what is thy servant, who is but a dog, that he should do this great thing?’ And Elisha answered: ‘The LORD hath shown me that thou shalt be king over Aram.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חֲזָהאֵל כִּי מָה עַבְדְּךָ הַכֶּלֶב כִּי יַעֲשֶׂה הַדָּבָר הַגָּדוֹל הַזֶּה וַיֹּאמֶר אֱלִישָׁע הִרְאַנִי יְהוָה אֹתְךָ מֶלֶךְ עַל־אֲרָם׃
    hebrewPlain: ויאמר חזהאל כי מה עבדך הכלב כי יעשה הדבר הגדול הזה ויאמר אלישע הראני יהוה אתך מלך על ארם
    kjvRefs:
    - 2 Kings 8:13
    kjvOsis:
    - 2Kgs.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.14
    scripture: tanakh
    name: Tanakh 2 Kings 8:14
    ref: 2 Kings 8:14
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 14
    ordinal: 9653
    text: 'Then he departed from Elisha, and came to his master, who said to him: ‘What said Elisha to thee?’ And he answered: ‘He told me that thou wouldest surely recover.’'
    translation: JPS 1917
    original: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע וַיָּבֹא אֶל־אֲדֹנָיו וַיֹּאמֶר לוֹ מָה־אָמַר לְךָ אֱלִישָׁע וַיֹּאמֶר אָמַר לִי חָיֹה תִחְיֶה׃
    hebrewPlain: וילך מאת אלישע ויבא אל אדניו ויאמר לו מה אמר לך אלישע ויאמר אמר לי חיה תחיה
    kjvRefs:
    - 2 Kings 8:14
    kjvOsis:
    - 2Kgs.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.15
    scripture: tanakh
    name: Tanakh 2 Kings 8:15
    ref: 2 Kings 8:15
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 15
    ordinal: 9654
    text: And it came to pass on the morrow, that he took the coverlet, and dipped it in water, and spread it on his face, so that he died; and Hazael reigned in his stead.
    translation: JPS 1917
    original: וַיְהִי מִמָּחֳרָת וַיִּקַּח הַמַּכְבֵּר וַיִּטְבֹּל בַּמַּיִם וַיִּפְרֹשׂ עַל־פָּנָיו וַיָּמֹת וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו׃
    hebrewPlain: ויהי ממחרת ויקח המכבר ויטבל במים ויפרש על פניו וימת וימלך חזהאל תחתיו
    kjvRefs:
    - 2 Kings 8:15
    kjvOsis:
    - 2Kgs.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.8
- type: TanakhVerse
  data:
    osis: 2Kgs.8.16
    scripture: tanakh
    name: Tanakh 2 Kings 8:16
    ref: 2 Kings 8:16
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 16
    ordinal: 9655
    text: And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat being the king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.
    translation: JPS 1917
    original: וּבִשְׁנַת חָמֵשׁ לְיוֹרָם בֶּן־אַחְאָב מֶלֶךְ יִשְׂרָאֵל וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה מָלַךְ יְהוֹרָם בֶּן־יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה׃
    hebrewPlain: ובשנת חמש ליורם בן אחאב מלך ישראל ויהושפט מלך יהודה מלך יהורם בן יהושפט מלך יהודה
    kjvRefs:
    - 2 Kings 8:16
    kjvOsis:
    - 2Kgs.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
