- type: TanakhVerse
  data:
    osis: 2Kgs.13.11
    scripture: tanakh
    name: Tanakh 2 Kings 13:11
    ref: 2 Kings 13:11
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 11
    ordinal: 9794
    text: And he did that which was evil in the sight of the LORD; he departed not from all the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin; but he walked therein.
    translation: JPS 1917
    original: וַיַּעֲשֶׂה הָרַע בְּעֵינֵי יְהוָה לֹא סָר מִכָּל־חַטֹּאות יָרָבְעָם בֶּן־נְבָט אֲשֶׁר־הֶחֱטִיא אֶת־יִשְׂרָאֵל בָּהּ הָלָךְ׃
    hebrewPlain: ויעשה הרע בעיני יהוה לא סר מכל חטאות ירבעם בן נבט אשר החטיא את ישראל בה הלך
    kjvRefs:
    - 2 Kings 13:11
    kjvOsis:
    - 2Kgs.13.11
