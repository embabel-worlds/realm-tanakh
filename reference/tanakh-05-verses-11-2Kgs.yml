  data:
    osis: 2Kgs.9.10
    scripture: tanakh
    name: Tanakh 2 Kings 9:10
    ref: 2 Kings 9:10
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 10
    ordinal: 9678
    text: And the dogs shall eat Jezebel in the portion of Jezreel, and there shall be none to bury her.’ And he opened the door, and fled.
    translation: JPS 1917
    original: וְאֶת־אִיזֶבֶל יֹאכְלוּ הַכְּלָבִים בְּחֵלֶק יִזְרְעֶאל וְאֵין קֹבֵר וַיִּפְתַּח הַדֶּלֶת וַיָּנֹס׃
    hebrewPlain: ואת איזבל יאכלו הכלבים בחלק יזרעאל ואין קבר ויפתח הדלת וינס
    kjvRefs:
    - 2 Kings 9:10
    kjvOsis:
    - 2Kgs.9.10
