  data:
    osis: 2Kgs.21.18
    scripture: tanakh
    name: Tanakh 2 Kings 21:18
    ref: 2 Kings 21:18
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 18
    ordinal: 10049
    text: And Manasseh slept with his fathers, and was buried in the garden of his own house, in the garden of Uzza; and Amon his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב מְנַשֶּׁה עִם־אֲבֹתָיו וַיִּקָּבֵר בְּגַן־בֵּיתוֹ בְּגַן־עֻזָּא וַיִּמְלֹךְ אָמוֹן בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב מנשה עם אבתיו ויקבר בגן ביתו בגן עזא וימלך אמון בנו תחתיו
    kjvRefs:
