    ref: 2 Kings 1:15
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 15
    ordinal: 9460
    text: 'And the angel of the LORD said unto Elijah: ‘Go down with him; be not afraid of him.’ And he arose, and went down with him unto the king.'
    translation: JPS 1917
    original: וַיְדַבֵּר מַלְאַךְ יְהוָה אֶל־אֵלִיָּהוּ רֵד אוֹתוֹ אַל־תִּירָא מִפָּנָיו וַיָּקָם וַיֵּרֶד אוֹתוֹ אֶל־הַמֶּלֶךְ׃
    hebrewPlain: וידבר מלאך יהוה אל אליהו רד אותו אל תירא מפניו ויקם וירד אותו אל המלך
