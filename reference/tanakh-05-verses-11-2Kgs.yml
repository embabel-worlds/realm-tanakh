    ref: 2 Kings 15:8
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 8
    ordinal: 9845
    text: In the thirty and eighth year of Azariah king of Judah did Zechariah the son of Jeroboam reign over Israel in Samaria six months.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה מָלַךְ זְכַרְיָהוּ בֶן־יָרָבְעָם עַל־יִשְׂרָאֵל בְּשֹׁמְרוֹן שִׁשָּׁה חֳדָשִׁים׃
    hebrewPlain: בשנת שלשים ושמנה שנה לעזריהו מלך יהודה מלך זכריהו בן ירבעם על ישראל בשמרון ששה חדשים
    kjvRefs:
