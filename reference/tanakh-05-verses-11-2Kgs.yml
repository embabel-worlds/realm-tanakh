  data:
    osis: 2Kgs.13.9
    scripture: tanakh
    name: Tanakh 2 Kings 13:9
    ref: 2 Kings 13:9
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 9
    ordinal: 9792
    text: And Jehoahaz slept with his fathers; and they buried him in Samaria; and Joash his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יְהוֹאָחָז עִם־אֲבֹתָיו וַיִּקְבְּרֻהוּ בְּשֹׁמְרוֹן וַיִּמְלֹךְ יוֹאָשׁ בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יהואחז עם אבתיו ויקברהו בשמרון וימלך יואש בנו תחתיו
    kjvRefs:
    - 2 Kings 13:9
    kjvOsis:
    - 2Kgs.13.9
