  data:
    osis: 2Kgs.15.11
    scripture: tanakh
    name: Tanakh 2 Kings 15:11
    ref: 2 Kings 15:11
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 11
    ordinal: 9848
    text: Now the rest of the acts of Zechariah, behold, they are written in the book of the chronicles of the kings of Israel.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי זְכַרְיָה הִנָּם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי זכריה הנם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 15:11
    kjvOsis:
    - 2Kgs.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
