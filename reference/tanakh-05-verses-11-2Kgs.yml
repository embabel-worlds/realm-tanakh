- type: TanakhVerse
  data:
    osis: 2Kgs.8.17
    scripture: tanakh
    name: Tanakh 2 Kings 8:17
    ref: 2 Kings 8:17
    book: 2Kgs
    section: neviim
    chapter: 8
    verse: 17
    ordinal: 9656
    text: Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.
    translation: JPS 1917
    original: בֶּן־שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה הָיָה בְמָלְכוֹ וּשְׁמֹנֶה שנה [שָׁנִים] מָלַךְ בִּירוּשָׁלִָם׃
    hebrewPlain: בן שלשים ושתים שנה היה במלכו ושמנה שנה [שנים] מלך בירושלם
    kjvRefs:
    - 2 Kings 8:17
    kjvOsis:
    - 2Kgs.8.17
  relations:
  - predicate: IN
    to:
