    chapter: 15
    verse: 6
    ordinal: 9843
    text: Now the rest of the acts of Azariah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי עֲזַרְיָהוּ וְכָל־אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי עזריהו וכל אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
