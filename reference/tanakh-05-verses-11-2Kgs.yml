  data:
    osis: 2Kgs.15.7
    scripture: tanakh
    name: Tanakh 2 Kings 15:7
    ref: 2 Kings 15:7
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 7
    ordinal: 9844
    text: And Azariah slept with his fathers; and they buried him with his fathers in the city of David; and Jotham his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב עֲזַרְיָה עִם־אֲבֹתָיו וַיִּקְבְּרוּ אֹתוֹ עִם־אֲבֹתָיו בְּעִיר דָּוִד וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב עזריה עם אבתיו ויקברו אתו עם אבתיו בעיר דוד וימלך יותם בנו תחתיו
