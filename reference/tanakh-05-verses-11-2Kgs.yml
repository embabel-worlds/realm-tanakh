    name: Tanakh 2 Kings 15:3
    ref: 2 Kings 15:3
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 3
    ordinal: 9840
    text: And he did that which was right in the eyes of the LORD, according to all that his father Amaziah had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה אֲמַצְיָהוּ אָבִיו׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה אמציהו אביו
