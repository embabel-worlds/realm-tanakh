- type: TanakhVerse
  data:
    osis: 2Kgs.4.17
    scripture: tanakh
    name: Tanakh 2 Kings 4:17
    ref: 2 Kings 4:17
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 17
    ordinal: 9532
    text: And the woman conceived, and bore a son at that season, when the time came round, as Elisha had said unto her.
    translation: JPS 1917
    original: וַתַּהַר הָאִשָּׁה וַתֵּלֶד בֵּן לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה אֲשֶׁר־דִּבֶּר אֵלֶיהָ אֱלִישָׁע׃
    hebrewPlain: ותהר האשה ותלד בן למועד הזה כעת חיה אשר דבר אליה אלישע
    kjvRefs:
    - 2 Kings 4:17
    kjvOsis:
    - 2Kgs.4.17
  relations:
  - predicate: IN
    to:
