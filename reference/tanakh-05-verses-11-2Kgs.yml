  data:
    osis: 2Kgs.15.10
    scripture: tanakh
    name: Tanakh 2 Kings 15:10
    ref: 2 Kings 15:10
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 10
    ordinal: 9847
    text: And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.
    translation: JPS 1917
    original: וַיִּקְשֹׁר עָלָיו שַׁלֻּם בֶּן־יָבֵשׁ וַיַּכֵּהוּ קָבָלְ־עָם וַיְמִיתֵהוּ וַיִּמְלֹךְ תַּחְתָּיו׃
    hebrewPlain: ויקשר עליו שלם בן יבש ויכהו קבל עם וימיתהו וימלך תחתיו
    kjvRefs:
