    scripture: tanakh
    name: Tanakh 2 Kings 21:22
    ref: 2 Kings 21:22
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 22
    ordinal: 10053
    text: And he forsook the LORD, the God of his fathers, and walked not in the way of the LORD.
    translation: JPS 1917
    original: וַיַּעֲזֹב אֶת־יְהוָה אֱלֹהֵי אֲבֹתָיו וְלֹא הָלַךְ בְּדֶרֶךְ יְהוָה׃
    hebrewPlain: ויעזב את יהוה אלהי אבתיו ולא הלך בדרך יהוה
    kjvRefs:
