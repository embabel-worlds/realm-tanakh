  data:
    osis: 2Kgs.9.7
    scripture: tanakh
    name: Tanakh 2 Kings 9:7
    ref: 2 Kings 9:7
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 7
    ordinal: 9675
    text: And thou shalt smite the house of Ahab thy master, that I may avenge the blood of My servants the prophets, and the blood of all the servants of the LORD, at the hand of Jezebel.
    translation: JPS 1917
    original: וְהִכִּיתָה אֶת־בֵּית אַחְאָב אֲדֹנֶיךָ וְנִקַּמְתִּי דְּמֵי עֲבָדַי הַנְּבִיאִים וּדְמֵי כָּל־עַבְדֵי יְהוָה מִיַּד אִיזָבֶל׃
    hebrewPlain: והכיתה את בית אחאב אדניך ונקמתי דמי עבדי הנביאים ודמי כל עבדי יהוה מיד איזבל
    kjvRefs:
    - 2 Kings 9:7
    kjvOsis:
    - 2Kgs.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
