    name: Tanakh 2 Kings 15:25
    ref: 2 Kings 15:25
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 25
    ordinal: 9862
    text: And Pekah the son of Remaliah, his captain, conspired against him, and smote him in Samaria, in the castle of the king’s house, by Argob and by Arieh; and with him were fifty men of the Gileadites; and he slew him, and reigned in his stead.
    translation: JPS 1917
    original: וַיִּקְשֹׁר עָלָיו פֶּקַח בֶּן־רְמַלְיָהוּ שָׁלִישׁוֹ וַיַּכֵּהוּ בְשֹׁמְרוֹן בְּאַרְמוֹן בֵּית־מלך [הַמֶּלֶךְ] אֶת־אַרְגֹּב וְאֶת־הָאַרְיֵה וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים וַיְמִיתֵהוּ וַיִּמְלֹךְ תַּחְתָּיו׃
    hebrewPlain: ויקשר עליו פקח בן רמליהו שלישו ויכהו בשמרון בארמון בית מלך [המלך] את ארגב ואת האריה ועמו חמשים איש מבני גלעדים וימיתהו וימלך תחתיו
