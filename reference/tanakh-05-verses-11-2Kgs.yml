  data:
    osis: 2Kgs.9.6
    scripture: tanakh
    name: Tanakh 2 Kings 9:6
    ref: 2 Kings 9:6
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 6
    ordinal: 9674
    text: 'And he arose, and went into the house; and he poured the oil on his head, and said unto him: ‘Thus saith the LORD, the God of Israel: I have anointed thee king over the people of the LORD, even over Israel.'
    translation: JPS 1917
    original: וַיָּקָם וַיָּבֹא הַבַּיְתָה וַיִּצֹק הַשֶּׁמֶן אֶל־רֹאשׁוֹ וַיֹּאמֶר לוֹ כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל מְשַׁחְתִּיךָ לְמֶלֶךְ אֶל־עַם יְהוָה אֶל־יִשְׂרָאֵל׃
    hebrewPlain: ויקם ויבא הביתה ויצק השמן אל ראשו ויאמר לו כה אמר יהוה אלהי ישראל משחתיך למלך אל עם יהוה אל ישראל
    kjvRefs:
