  data:
    osis: 2Kgs.15.9
    scripture: tanakh
    name: Tanakh 2 Kings 15:9
    ref: 2 Kings 15:9
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 9
    ordinal: 9846
    text: And he did that which was evil in the sight of the LORD, as his fathers had done; he departed not from the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו לֹא סָר מֵחַטֹּאות יָרָבְעָם בֶּן־נְבָט אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל׃
    hebrewPlain: ויעש הרע בעיני יהוה כאשר עשו אבתיו לא סר מחטאות ירבעם בן נבט אשר החטיא את ישראל
    kjvRefs:
