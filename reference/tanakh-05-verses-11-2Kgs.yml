- type: TanakhVerse
  data:
    osis: 2Kgs.13.7
    scripture: tanakh
    name: Tanakh 2 Kings 13:7
    ref: 2 Kings 13:7
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 7
    ordinal: 9790
    text: For there was not left to Jehoahaz of the people save fifty horsemen, and ten chariots, and ten thousand footmen; for the king of Aram destroyed them, and made them like the dust in threshing.
    translation: JPS 1917
    original: כִּי לֹא הִשְׁאִיר לִיהוֹאָחָז עָם כִּי אִם־חֲמִשִּׁים פָּרָשִׁים וַעֲשָׂרָה רֶכֶב וַעֲשֶׂרֶת אֲלָפִים רַגְלִי כִּי אִבְּדָם מֶלֶךְ אֲרָם וַיְשִׂמֵם כֶּעָפָר לָדֻשׁ׃
    hebrewPlain: כי לא השאיר ליהואחז עם כי אם חמשים פרשים ועשרה רכב ועשרת אלפים רגלי כי אבדם מלך ארם וישמם כעפר לדש
    kjvRefs:
    - 2 Kings 13:7
    kjvOsis:
    - 2Kgs.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.13
- type: TanakhVerse
  data:
    osis: 2Kgs.13.8
    scripture: tanakh
    name: Tanakh 2 Kings 13:8
    ref: 2 Kings 13:8
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 8
    ordinal: 9791
    text: Now the rest of the acts of Jehoahaz, and all that he did, and his might, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז וְכָל־אֲשֶׁר עָשָׂה וּגְבוּרָתוֹ הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי יהואחז וכל אשר עשה וגבורתו הלוא הם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
