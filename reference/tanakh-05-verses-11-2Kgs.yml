    section: neviim
    chapter: 15
    verse: 29
    ordinal: 9866
    text: In the days of Pekah king of Israel came Tiglath-pileser king of Assyria, and took Ijon, and Abel-beth-maacah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali; and he carried them captive to Assyria.
    translation: JPS 1917
    original: בִּימֵי פֶּקַח מֶלֶךְ־יִשְׂרָאֵל בָּא תִּגְלַת פִּלְאֶסֶר מֶלֶךְ אַשּׁוּר וַיִּקַּח אֶת־עִיּוֹן וְאֶת־אָבֵל בֵּית־מַעֲכָה וְאֶת־יָנוֹחַ וְאֶת־קֶדֶשׁ וְאֶת־חָצוֹר וְאֶת־הַגִּלְעָד וְאֶת־הַגָּלִילָה כֹּל אֶרֶץ נַפְתָּלִי וַיַּגְלֵם אַשּׁוּרָה׃
    hebrewPlain: בימי פקח מלך ישראל בא תגלת פלאסר מלך אשור ויקח את עיון ואת אבל בית מעכה ואת ינוח ואת קדש ואת חצור ואת הגלעד ואת הגלילה כל ארץ נפתלי ויגלם אשורה
    kjvRefs:
    - 2 Kings 15:29
    kjvOsis:
    - 2Kgs.15.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.30
    scripture: tanakh
    name: Tanakh 2 Kings 15:30
    ref: 2 Kings 15:30
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 30
    ordinal: 9867
    text: And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead, in the twentieth year of Jotham the son of Uzziah.
    translation: JPS 1917
    original: וַיִּקְשָׁר־קֶשֶׁר הוֹשֵׁעַ בֶּן־אֵלָה עַל־פֶּקַח בֶּן־רְמַלְיָהוּ וַיַּכֵּהוּ וַיְמִיתֵהוּ וַיִּמְלֹךְ תַּחְתָּיו בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן־עֻזִיָּה׃
    hebrewPlain: ויקשר קשר הושע בן אלה על פקח בן רמליהו ויכהו וימיתהו וימלך תחתיו בשנת עשרים ליותם בן עזיה
    kjvRefs:
    - 2 Kings 15:30
    kjvOsis:
    - 2Kgs.15.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.31
    scripture: tanakh
    name: Tanakh 2 Kings 15:31
    ref: 2 Kings 15:31
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 31
    ordinal: 9868
    text: Now the rest of the acts of Pekah, and all that he did, behold, they are written in the book of the chronicles of the kings of Israel.
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי־פֶקַח וְכָל־אֲשֶׁר עָשָׂה הִנָּם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי פקח וכל אשר עשה הנם כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 15:31
    kjvOsis:
    - 2Kgs.15.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.32
    scripture: tanakh
    name: Tanakh 2 Kings 15:32
    ref: 2 Kings 15:32
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 32
    ordinal: 9869
    text: In the second year of Pekah the son of Remaliah king of Israel began Jotham the son of Uzziah king of Judah to reign.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁתַּיִם לְפֶקַח בֶּן־רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל מָלַךְ יוֹתָם בֶּן־עֻזִיָּהוּ מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת שתים לפקח בן רמליהו מלך ישראל מלך יותם בן עזיהו מלך יהודה
    kjvRefs:
    - 2 Kings 15:32
    kjvOsis:
    - 2Kgs.15.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.33
    scripture: tanakh
    name: Tanakh 2 Kings 15:33
    ref: 2 Kings 15:33
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 33
    ordinal: 9870
    text: Five and twenty years old was he when he began to reign; and he reigned sixteen years in Jerusalem; and his mother’s name was Jerusha the daughter of Zadok.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה הָיָה בְמָלְכוֹ וְשֵׁשׁ־עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יְרוּשָׁא בַּת־צָדוֹק׃
    hebrewPlain: בן עשרים וחמש שנה היה במלכו ושש עשרה שנה מלך בירושלם ושם אמו ירושא בת צדוק
    kjvRefs:
    - 2 Kings 15:33
    kjvOsis:
    - 2Kgs.15.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.34
    scripture: tanakh
    name: Tanakh 2 Kings 15:34
    ref: 2 Kings 15:34
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 34
    ordinal: 9871
    text: And he did that which was right in the eyes of the LORD; he did according to all that his father Uzziah had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה עֻזִיָּהוּ אָבִיו עָשָׂה׃
    hebrewPlain: ויעש הישר בעיני יהוה ככל אשר עשה עזיהו אביו עשה
    kjvRefs:
    - 2 Kings 15:34
    kjvOsis:
    - 2Kgs.15.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.35
    scripture: tanakh
    name: Tanakh 2 Kings 15:35
    ref: 2 Kings 15:35
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 35
    ordinal: 9872
    text: Howbeit the high places were not taken away; the people still sacrificed and offered in the high places. He built the upper gate of the house of the LORD.
    translation: JPS 1917
    original: רַק הַבָּמוֹת לֹא סָרוּ עוֹד הָעָם מְזַבְּחִים וּמְקַטְּרִים בַּבָּמוֹת הוּא בָּנָה אֶת־שַׁעַר בֵּית־יְהוָה הָעֶלְיוֹן׃
    hebrewPlain: רק הבמות לא סרו עוד העם מזבחים ומקטרים בבמות הוא בנה את שער בית יהוה העליון
    kjvRefs:
    - 2 Kings 15:35
    kjvOsis:
    - 2Kgs.15.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.36
    scripture: tanakh
    name: Tanakh 2 Kings 15:36
    ref: 2 Kings 15:36
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 36
    ordinal: 9873
    text: Now the rest of the acts of Jotham, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יוֹתָם אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי יותם אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 15:36
    kjvOsis:
    - 2Kgs.15.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.37
    scripture: tanakh
    name: Tanakh 2 Kings 15:37
    ref: 2 Kings 15:37
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 37
    ordinal: 9874
    text: In those days the LORD began to send against Judah Rezin the king of Aram, and Pekah the son of Remaliah.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם הֵחֵל יְהוָה לְהַשְׁלִיחַ בִּיהוּדָה רְצִין מֶלֶךְ אֲרָם וְאֵת פֶּקַח בֶּן־רְמַלְיָהוּ׃
    hebrewPlain: בימים ההם החל יהוה להשליח ביהודה רצין מלך ארם ואת פקח בן רמליהו
    kjvRefs:
    - 2 Kings 15:37
    kjvOsis:
    - 2Kgs.15.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.15.38
    scripture: tanakh
    name: Tanakh 2 Kings 15:38
    ref: 2 Kings 15:38
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 38
    ordinal: 9875
    text: And Jotham slept with his fathers, and was buried with his fathers in the city of David his father; and Ahaz his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יוֹתָם עִם־אֲבֹתָיו וַיִּקָּבֵר עִם־אֲבֹתָיו בְּעִיר דָּוִד אָבִיו וַיִּמְלֹךְ אָחָז בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יותם עם אבתיו ויקבר עם אבתיו בעיר דוד אביו וימלך אחז בנו תחתיו
    kjvRefs:
    - 2 Kings 15:38
    kjvOsis:
    - 2Kgs.15.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.15
- type: TanakhVerse
  data:
    osis: 2Kgs.16.1
    scripture: tanakh
    name: Tanakh 2 Kings 16:1
    ref: 2 Kings 16:1
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 1
    ordinal: 9876
    text: In the seventeenth year of Pekah the son of Remaliah Ahaz the son of Jotham king of Judah began to reign.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁבַע־עֶשְׂרֵה שָׁנָה לְפֶקַח בֶּן־רְמַלְיָהוּ מָלַךְ אָחָז בֶּן־יוֹתָם מֶלֶךְ יְהוּדָה׃
    hebrewPlain: בשנת שבע עשרה שנה לפקח בן רמליהו מלך אחז בן יותם מלך יהודה
    kjvRefs:
    - 2 Kings 16:1
    kjvOsis:
    - 2Kgs.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.2
    scripture: tanakh
    name: Tanakh 2 Kings 16:2
    ref: 2 Kings 16:2
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 2
    ordinal: 9877
    text: Twenty years old was Ahaz when he began to reign; and he reigned sixteen years in Jerusalem; and he did not that which was right in the eyes of the LORD his God, like David his father.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים שָׁנָה אָחָז בְּמָלְכוֹ וְשֵׁשׁ־עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְלֹא־עָשָׂה הַיָּשָׁר בְּעֵינֵי יְהוָה אֱלֹהָיו כְּדָוִד אָבִיו׃
    hebrewPlain: בן עשרים שנה אחז במלכו ושש עשרה שנה מלך בירושלם ולא עשה הישר בעיני יהוה אלהיו כדוד אביו
    kjvRefs:
    - 2 Kings 16:2
    kjvOsis:
    - 2Kgs.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.3
    scripture: tanakh
    name: Tanakh 2 Kings 16:3
    ref: 2 Kings 16:3
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 3
    ordinal: 9878
    text: But he walked in the way of the kings of Israel, yea, and made his son to pass through the fire, according to the abominations of the heathen, whom the LORD cast out from before the children of Israel.
    translation: JPS 1917
    original: וַיֵּלֶךְ בְּדֶרֶךְ מַלְכֵי יִשְׂרָאֵל וְגַם אֶת־בְּנוֹ הֶעֱבִיר בָּאֵשׁ כְּתֹעֲבוֹת הַגּוֹיִם אֲשֶׁר הוֹרִישׁ יְהוָה אֹתָם מִפְּנֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: וילך בדרך מלכי ישראל וגם את בנו העביר באש כתעבות הגוים אשר הוריש יהוה אתם מפני בני ישראל
    kjvRefs:
    - 2 Kings 16:3
    kjvOsis:
    - 2Kgs.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.4
    scripture: tanakh
    name: Tanakh 2 Kings 16:4
    ref: 2 Kings 16:4
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 4
    ordinal: 9879
    text: And he sacrificed and offered in the high places, and on the hills, and under every leafy tree.
    translation: JPS 1917
    original: וַיְזַבֵּחַ וַיְקַטֵּר בַּבָּמוֹת וְעַל־הַגְּבָעוֹת וְתַחַת כָּל־עֵץ רַעֲנָן׃
    hebrewPlain: ויזבח ויקטר בבמות ועל הגבעות ותחת כל עץ רענן
    kjvRefs:
    - 2 Kings 16:4
    kjvOsis:
    - 2Kgs.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.5
    scripture: tanakh
    name: Tanakh 2 Kings 16:5
    ref: 2 Kings 16:5
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 5
    ordinal: 9880
    text: Then Rezin king of Aram and Pekah son of Remaliah king of Israel came up to Jerusalem to war; and they besieged Ahaz, but could not overcome him.
    translation: JPS 1917
    original: אָז יַעֲלֶה רְצִין מֶלֶךְ־אֲרָם וּפֶקַח בֶּן־רְמַלְיָהוּ מֶלֶךְ־יִשְׂרָאֵל יְרוּשָׁלִַם לַמִּלְחָמָה וַיָּצֻרוּ עַל־אָחָז וְלֹא יָכְלוּ לְהִלָּחֵם׃
    hebrewPlain: אז יעלה רצין מלך ארם ופקח בן רמליהו מלך ישראל ירושלם למלחמה ויצרו על אחז ולא יכלו להלחם
    kjvRefs:
    - 2 Kings 16:5
    kjvOsis:
    - 2Kgs.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.6
    scripture: tanakh
    name: Tanakh 2 Kings 16:6
    ref: 2 Kings 16:6
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 6
    ordinal: 9881
    text: At that time Rezin king of Aram recovered Elath to Aram, and drove the Jews from Elath; and the Edomites came to Elath, and dwelt there, unto this day.
    translation: JPS 1917
    original: בָּעֵת הַהִיא הֵשִׁיב רְצִין מֶלֶךְ־אֲרָם אֶת־אֵילַת לַאֲרָם וַיְנַשֵּׁל אֶת־הַיְהוּדִים מֵאֵילוֹת וארמים [וַאֲדוֹמִים] בָּאוּ אֵילַת וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: בעת ההיא השיב רצין מלך ארם את אילת לארם וינשל את היהודים מאילות וארמים [ואדומים] באו אילת וישבו שם עד היום הזה
    kjvRefs:
    - 2 Kings 16:6
    kjvOsis:
    - 2Kgs.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.7
    scripture: tanakh
    name: Tanakh 2 Kings 16:7
    ref: 2 Kings 16:7
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 7
    ordinal: 9882
    text: 'So Ahaz sent messengers to Tiglath-pileser king of Assyria, saying: ‘I am thy servant and thy son; come up, and save me out of the hand of the king of Aram, and out of the hand of the king of Israel, who rise up against me.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אָחָז מַלְאָכִים אֶל־תִּגְלַת פְּלֶסֶר מֶלֶךְ־אַשּׁוּר לֵאמֹר עַבְדְּךָ וּבִנְךָ אָנִי עֲלֵה וְהוֹשִׁעֵנִי מִכַּף מֶלֶךְ־אֲרָם וּמִכַּף מֶלֶךְ יִשְׂרָאֵל הַקּוֹמִים עָלָי׃
    hebrewPlain: וישלח אחז מלאכים אל תגלת פלסר מלך אשור לאמר עבדך ובנך אני עלה והושעני מכף מלך ארם ומכף מלך ישראל הקומים עלי
    kjvRefs:
    - 2 Kings 16:7
    kjvOsis:
    - 2Kgs.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.8
    scripture: tanakh
    name: Tanakh 2 Kings 16:8
    ref: 2 Kings 16:8
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 8
    ordinal: 9883
    text: And Ahaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king’s house, and sent it for a present to the king of Assyria.
    translation: JPS 1917
    original: וַיִּקַּח אָחָז אֶת־הַכֶּסֶף וְאֶת־הַזָּהָב הַנִּמְצָא בֵּית יְהוָה וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ וַיִּשְׁלַח לְמֶלֶךְ־אַשּׁוּר שֹׁחַד׃
    hebrewPlain: ויקח אחז את הכסף ואת הזהב הנמצא בית יהוה ובאצרות בית המלך וישלח למלך אשור שחד
    kjvRefs:
    - 2 Kings 16:8
    kjvOsis:
    - 2Kgs.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.9
    scripture: tanakh
    name: Tanakh 2 Kings 16:9
    ref: 2 Kings 16:9
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 9
    ordinal: 9884
    text: And the king of Assyria hearkened unto him; and the king of Assyria went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin.
    translation: JPS 1917
    original: וַיִּשְׁמַע אֵלָיו מֶלֶךְ אַשּׁוּר וַיַּעַל מֶלֶךְ אַשּׁוּר אֶל־דַּמֶּשֶׂק וַיִּתְפְּשֶׂהָ וַיַּגְלֶהָ קִירָה וְאֶת־רְצִין הֵמִית׃
    hebrewPlain: וישמע אליו מלך אשור ויעל מלך אשור אל דמשק ויתפשה ויגלה קירה ואת רצין המית
    kjvRefs:
    - 2 Kings 16:9
    kjvOsis:
    - 2Kgs.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.10
    scripture: tanakh
    name: Tanakh 2 Kings 16:10
    ref: 2 Kings 16:10
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 10
    ordinal: 9885
    text: And king Ahaz went to Damascus to meet Tiglath-pileser king of Assyria, and saw the altar that was at Damascus; and king Ahaz sent to Urijah the priest the fashion of the altar, and the pattern of it, according to all the workmanship thereof.
    translation: JPS 1917
    original: וַיֵּלֶךְ הַמֶּלֶךְ אָחָז לִקְרַאת תִּגְלַת פִּלְאֶסֶר מֶלֶךְ־אַשּׁוּר דּוּמֶּשֶׂק וַיַּרְא אֶת־הַמִּזְבֵּחַ אֲשֶׁר בְּדַמָּשֶׂק וַיִּשְׁלַח הַמֶּלֶךְ אָחָז אֶל־אוּרִיָּה הַכֹּהֵן אֶת־דְּמוּת הַמִּזְבֵּחַ וְאֶת־תַּבְנִיתוֹ לְכָל־מַעֲשֵׂהוּ׃
    hebrewPlain: וילך המלך אחז לקראת תגלת פלאסר מלך אשור דומשק וירא את המזבח אשר בדמשק וישלח המלך אחז אל אוריה הכהן את דמות המזבח ואת תבניתו לכל מעשהו
    kjvRefs:
    - 2 Kings 16:10
    kjvOsis:
    - 2Kgs.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.11
    scripture: tanakh
    name: Tanakh 2 Kings 16:11
    ref: 2 Kings 16:11
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 11
    ordinal: 9886
    text: And Urijah the priest built an altar; according to all that king Ahaz had sent from Damascus, so did Urijah the priest make it against the coming of king Ahaz from Damascus.
    translation: JPS 1917
    original: וַיִּבֶן אוּרִיָּה הַכֹּהֵן אֶת־הַמִּזְבֵּחַ כְּכֹל אֲשֶׁר־שָׁלַח הַמֶּלֶךְ אָחָז מִדַּמֶּשֶׂק כֵּן עָשָׂה אוּרִיָּה הַכֹּהֵן עַד־בּוֹא הַמֶּלֶךְ־אָחָז מִדַּמָּשֶׂק׃
    hebrewPlain: ויבן אוריה הכהן את המזבח ככל אשר שלח המלך אחז מדמשק כן עשה אוריה הכהן עד בוא המלך אחז מדמשק
    kjvRefs:
    - 2 Kings 16:11
    kjvOsis:
    - 2Kgs.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.12
    scripture: tanakh
    name: Tanakh 2 Kings 16:12
    ref: 2 Kings 16:12
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 12
    ordinal: 9887
    text: And when the king was come from Damascus, the king saw the altar; and the king drew near unto the altar, and offered thereon.
    translation: JPS 1917
    original: וַיָּבֹא הַמֶּלֶךְ מִדַּמֶּשֶׂק וַיַּרְא הַמֶּלֶךְ אֶת־הַמִּזְבֵּחַ וַיִּקְרַב הַמֶּלֶךְ עַל־הַמִּזְבֵּחַ וַיַּעַל עָלָיו׃
    hebrewPlain: ויבא המלך מדמשק וירא המלך את המזבח ויקרב המלך על המזבח ויעל עליו
    kjvRefs:
    - 2 Kings 16:12
    kjvOsis:
    - 2Kgs.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.13
    scripture: tanakh
    name: Tanakh 2 Kings 16:13
    ref: 2 Kings 16:13
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 13
    ordinal: 9888
    text: And he offered his burnt-offering and his meal-offering, and poured his drink-offering, and dashed the blood of his peace-offerings against the altar.
    translation: JPS 1917
    original: וַיַּקְטֵר אֶת־עֹלָתוֹ וְאֶת־מִנְחָתוֹ וַיַּסֵּךְ אֶת־נִסְכּוֹ וַיִּזְרֹק אֶת־דַּם־הַשְּׁלָמִים אֲשֶׁר־לוֹ עַל־הַמִּזְבֵּחַ׃
    hebrewPlain: ויקטר את עלתו ואת מנחתו ויסך את נסכו ויזרק את דם השלמים אשר לו על המזבח
    kjvRefs:
    - 2 Kings 16:13
    kjvOsis:
    - 2Kgs.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.14
    scripture: tanakh
    name: Tanakh 2 Kings 16:14
    ref: 2 Kings 16:14
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 14
    ordinal: 9889
    text: And the brazen altar, which was before the LORD, he brought from the forefront of the house, from between his altar and the house of the LORD, and put it on the north side of his altar.
    translation: JPS 1917
    original: וְאֵת הַמִּזְבַּח הַנְּחֹשֶׁת אֲשֶׁר לִפְנֵי יְהוָה וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה וַיִּתֵּן אֹתוֹ עַל־יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה׃
    hebrewPlain: ואת המזבח הנחשת אשר לפני יהוה ויקרב מאת פני הבית מבין המזבח ומבין בית יהוה ויתן אתו על ירך המזבח צפונה
    kjvRefs:
    - 2 Kings 16:14
    kjvOsis:
    - 2Kgs.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.15
    scripture: tanakh
    name: Tanakh 2 Kings 16:15
    ref: 2 Kings 16:15
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 15
    ordinal: 9890
    text: 'And king Ahaz commanded Urijah the priest, saying: ‘Upon the great altar offer the morning burnt-offering, and the evening meal-offering, and the king’s burnt-offering, and his meal-offering, with the burnt-offering of all the people of the land, and their meal-offering, and their drink-offerings; and dash against it all the blood of the burnt-offering, and all the blood of the sacrifice; but the brazen altar shall be for me to look to.’'
    translation: JPS 1917
    original: ויצוהו [וַיְצַוֶּה] הַמֶּלֶךְ־אָחָז אֶת־אוּרִיָּה הַכֹּהֵן לֵאמֹר עַל הַמִּזְבֵּחַ הַגָּדוֹל הַקְטֵר אֶת־עֹלַת־הַבֹּקֶר וְאֶת־מִנְחַת הָעֶרֶב וְאֶת־עֹלַת הַמֶּלֶךְ וְאֶת־מִנְחָתוֹ וְאֵת עֹלַת כָּל־עַם הָאָרֶץ וּמִנְחָתָם וְנִסְכֵּיהֶם וְכָל־דַּם עֹלָה וְכָל־דַּם־זֶבַח עָלָיו תִּזְרֹק וּמִזְבַּח הַנְּחֹשֶׁת יִהְיֶה־לִּי לְבַקֵּר׃
    hebrewPlain: ויצוהו [ויצוה] המלך אחז את אוריה הכהן לאמר על המזבח הגדול הקטר את עלת הבקר ואת מנחת הערב ואת עלת המלך ואת מנחתו ואת עלת כל עם הארץ ומנחתם ונסכיהם וכל דם עלה וכל דם זבח עליו תזרק ומזבח הנחשת יהיה לי לבקר
    kjvRefs:
    - 2 Kings 16:15
    kjvOsis:
    - 2Kgs.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.16
    scripture: tanakh
    name: Tanakh 2 Kings 16:16
    ref: 2 Kings 16:16
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 16
    ordinal: 9891
    text: Thus did Urijah the priest, according to all that king Ahaz commanded.
    translation: JPS 1917
    original: וַיַּעַשׂ אוּרִיָּה הַכֹּהֵן כְּכֹל אֲשֶׁר־צִוָּה הַמֶּלֶךְ אָחָז׃
    hebrewPlain: ויעש אוריה הכהן ככל אשר צוה המלך אחז
    kjvRefs:
    - 2 Kings 16:16
    kjvOsis:
    - 2Kgs.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.17
    scripture: tanakh
    name: Tanakh 2 Kings 16:17
    ref: 2 Kings 16:17
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 17
    ordinal: 9892
    text: And king Ahaz cut off the borders of the bases, and removed the laver from off them; and took down the sea from off the brazen oxen that were under it, and put it upon a pavement of stone.
    translation: JPS 1917
    original: וַיְקַצֵּץ הַמֶּלֶךְ אָחָז אֶת־הַמִּסְגְּרוֹת הַמְּכֹנוֹת וַיָּסַר מֵעֲלֵיהֶם ואת־[אֶת־] הַכִּיֹּר וְאֶת־הַיָּם הוֹרִד מֵעַל הַבָּקָר הַנְּחֹשֶׁת אֲשֶׁר תַּחְתֶּיהָ וַיִּתֵּן אֹתוֹ עַל מַרְצֶפֶת אֲבָנִים׃
    hebrewPlain: ויקצץ המלך אחז את המסגרות המכנות ויסר מעליהם ואת [את ] הכיר ואת הים הורד מעל הבקר הנחשת אשר תחתיה ויתן אתו על מרצפת אבנים
    kjvRefs:
    - 2 Kings 16:17
    kjvOsis:
    - 2Kgs.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.18
    scripture: tanakh
    name: Tanakh 2 Kings 16:18
    ref: 2 Kings 16:18
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 18
    ordinal: 9893
    text: And the covered place for the sabbath that they had built in the house, and the king’s entry without, turned he unto the house of the LORD, because of the king of Assyria.
    translation: JPS 1917
    original: וְאֶת־מיסך [מוּסַךְ] הַשַּׁבָּת אֲשֶׁר־בָּנוּ בַבַּיִת וְאֶת־מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה הֵסֵב בֵּית יְהוָה מִפְּנֵי מֶלֶךְ אַשּׁוּר׃
    hebrewPlain: ואת מיסך [מוסך] השבת אשר בנו בבית ואת מבוא המלך החיצונה הסב בית יהוה מפני מלך אשור
    kjvRefs:
    - 2 Kings 16:18
    kjvOsis:
    - 2Kgs.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.19
    scripture: tanakh
    name: Tanakh 2 Kings 16:19
    ref: 2 Kings 16:19
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 19
    ordinal: 9894
    text: Now the rest of the acts of Ahaz which he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אָחָז אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי אחז אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 16:19
    kjvOsis:
    - 2Kgs.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.16.20
    scripture: tanakh
    name: Tanakh 2 Kings 16:20
    ref: 2 Kings 16:20
    book: 2Kgs
    section: neviim
    chapter: 16
    verse: 20
    ordinal: 9895
    text: And Ahaz slept with his fathers, and was buried with his fathers in the city of David; and Hezekiah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב אָחָז עִם־אֲבֹתָיו וַיִּקָּבֵר עִם־אֲבֹתָיו בְּעִיר דָּוִד וַיִּמְלֹךְ חִזְקִיָּהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב אחז עם אבתיו ויקבר עם אבתיו בעיר דוד וימלך חזקיהו בנו תחתיו
    kjvRefs:
    - 2 Kings 16:20
    kjvOsis:
    - 2Kgs.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.16
- type: TanakhVerse
  data:
    osis: 2Kgs.17.1
    scripture: tanakh
    name: Tanakh 2 Kings 17:1
    ref: 2 Kings 17:1
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 1
    ordinal: 9896
    text: In the twelfth year of Ahaz king of Judah began Hoshea the son of Elah to reign in Samaria over Israel, and reigned nine years.
    translation: JPS 1917
    original: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לְאָחָז מֶלֶךְ יְהוּדָה מָלַךְ הוֹשֵׁעַ בֶּן־אֵלָה בְשֹׁמְרוֹן עַל־יִשְׂרָאֵל תֵּשַׁע שָׁנִים׃
    hebrewPlain: בשנת שתים עשרה לאחז מלך יהודה מלך הושע בן אלה בשמרון על ישראל תשע שנים
    kjvRefs:
    - 2 Kings 17:1
    kjvOsis:
    - 2Kgs.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.2
    scripture: tanakh
    name: Tanakh 2 Kings 17:2
    ref: 2 Kings 17:2
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 2
    ordinal: 9897
    text: And he did that which was evil in the sight of the LORD, yet not as the kings of Israel that were before him.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה רַק לֹא כְּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו׃
    hebrewPlain: ויעש הרע בעיני יהוה רק לא כמלכי ישראל אשר היו לפניו
    kjvRefs:
    - 2 Kings 17:2
    kjvOsis:
    - 2Kgs.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.3
    scripture: tanakh
    name: Tanakh 2 Kings 17:3
    ref: 2 Kings 17:3
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 3
    ordinal: 9898
    text: Against him came up Shalmaneser king of Assyria; and Hoshea became his servant, and brought him presents.
    translation: JPS 1917
    original: עָלָיו עָלָה שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר וַיְהִי־לוֹ הוֹשֵׁעַ עֶבֶד וַיָּשֶׁב לוֹ מִנְחָה׃
    hebrewPlain: עליו עלה שלמנאסר מלך אשור ויהי לו הושע עבד וישב לו מנחה
    kjvRefs:
    - 2 Kings 17:3
    kjvOsis:
    - 2Kgs.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.4
    scripture: tanakh
    name: Tanakh 2 Kings 17:4
    ref: 2 Kings 17:4
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 4
    ordinal: 9899
    text: And the king of Assyria found conspiracy in Hoshea; for he had sent messengers to So king of Egypt, and offered no present to the king of Assyria, as he had done year by year; therefore the king of Assyria shut him up, and bound him in prison.
    translation: JPS 1917
    original: וַיִּמְצָא מֶלֶךְ־אַשּׁוּר בְּהוֹשֵׁעַ קֶשֶׁר אֲשֶׁר שָׁלַח מַלְאָכִים אֶל־סוֹא מֶלֶךְ־מִצְרַיִם וְלֹא־הֶעֱלָה מִנְחָה לְמֶלֶךְ אַשּׁוּר כְּשָׁנָה בְשָׁנָה וַיַּעַצְרֵהוּ מֶלֶךְ אַשּׁוּר וַיַּאַסְרֵהוּ בֵּית כֶּלֶא׃
    hebrewPlain: וימצא מלך אשור בהושע קשר אשר שלח מלאכים אל סוא מלך מצרים ולא העלה מנחה למלך אשור כשנה בשנה ויעצרהו מלך אשור ויאסרהו בית כלא
    kjvRefs:
    - 2 Kings 17:4
    kjvOsis:
    - 2Kgs.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.5
    scripture: tanakh
    name: Tanakh 2 Kings 17:5
    ref: 2 Kings 17:5
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 5
    ordinal: 9900
    text: Then the king of Assyria came up throughout all the land, and went up to Samaria, and besieged it three years.
    translation: JPS 1917
    original: וַיַּעַל מֶלֶךְ־אַשּׁוּר בְּכָל־הָאָרֶץ וַיַּעַל שֹׁמְרוֹן וַיָּצַר עָלֶיהָ שָׁלֹשׁ שָׁנִים׃
    hebrewPlain: ויעל מלך אשור בכל הארץ ויעל שמרון ויצר עליה שלש שנים
    kjvRefs:
    - 2 Kings 17:5
    kjvOsis:
    - 2Kgs.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.6
    scripture: tanakh
    name: Tanakh 2 Kings 17:6
    ref: 2 Kings 17:6
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 6
    ordinal: 9901
    text: In the ninth year of Hoshea, the king of Assyria took Samaria, and carried Israel away unto Assyria, and placed them in Halah, and in Habor, on the river of Gozan, and in the cities of the Medes.
    translation: JPS 1917
    original: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ לָכַד מֶלֶךְ־אַשּׁוּר אֶת־שֹׁמְרוֹן וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה וַיֹּשֶׁב אֹתָם בַּחְלַח וּבְחָבוֹר נְהַר גּוֹזָן וְעָרֵי מָדָי׃
    hebrewPlain: בשנת התשיעית להושע לכד מלך אשור את שמרון ויגל את ישראל אשורה וישב אתם בחלח ובחבור נהר גוזן וערי מדי
    kjvRefs:
    - 2 Kings 17:6
    kjvOsis:
    - 2Kgs.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.7
    scripture: tanakh
    name: Tanakh 2 Kings 17:7
    ref: 2 Kings 17:7
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 7
    ordinal: 9902
    text: And it was so, because the children of Israel had sinned against the LORD their God, who brought them up out of the land of Egypt from under the hand of Pharaoh king of Egypt, and had feared other gods,
    translation: JPS 1917
    original: וַיְהִי כִּי־חָטְאוּ בְנֵי־יִשְׂרָאֵל לַיהוָה אֱלֹהֵיהֶם הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם מִתַּחַת יַד פַּרְעֹה מֶלֶךְ־מִצְרָיִם וַיִּירְאוּ אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ויהי כי חטאו בני ישראל ליהוה אלהיהם המעלה אתם מארץ מצרים מתחת יד פרעה מלך מצרים וייראו אלהים אחרים
    kjvRefs:
    - 2 Kings 17:7
    kjvOsis:
    - 2Kgs.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.8
    scripture: tanakh
    name: Tanakh 2 Kings 17:8
    ref: 2 Kings 17:8
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 8
    ordinal: 9903
    text: and walked in the statutes of the nations, whom the LORD cast out from before the children of Israel, and of the kings of Israel, which they practised;
    translation: JPS 1917
    original: וַיֵּלְכוּ בְּחֻקּוֹת הַגּוֹיִם אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי בְּנֵי יִשְׂרָאֵל וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ׃
    hebrewPlain: וילכו בחקות הגוים אשר הוריש יהוה מפני בני ישראל ומלכי ישראל אשר עשו
    kjvRefs:
    - 2 Kings 17:8
    kjvOsis:
    - 2Kgs.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.9
    scripture: tanakh
    name: Tanakh 2 Kings 17:9
    ref: 2 Kings 17:9
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 9
    ordinal: 9904
    text: and the children of Israel did impute things that were not right unto the LORD their God, and they built them high places in all their cities, from the tower of the watchmen to the fortified city;
    translation: JPS 1917
    original: וַיְחַפְּאוּ בְנֵי־יִשְׂרָאֵל דְּבָרִים אֲשֶׁר לֹא־כֵן עַל־יְהוָה אֱלֹהֵיהֶם וַיִּבְנוּ לָהֶם בָּמוֹת בְּכָל־עָרֵיהֶם מִמִּגְדַּל נוֹצְרִים עַד־עִיר מִבְצָר׃
    hebrewPlain: ויחפאו בני ישראל דברים אשר לא כן על יהוה אלהיהם ויבנו להם במות בכל עריהם ממגדל נוצרים עד עיר מבצר
    kjvRefs:
    - 2 Kings 17:9
    kjvOsis:
    - 2Kgs.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.10
    scripture: tanakh
    name: Tanakh 2 Kings 17:10
    ref: 2 Kings 17:10
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 10
    ordinal: 9905
    text: and they set them up pillars and Asherim upon every high hill, and under every leafy tree;
    translation: JPS 1917
    original: וַיַּצִּבוּ לָהֶם מַצֵּבוֹת וַאֲשֵׁרִים עַל כָּל־גִּבְעָה גְבֹהָה וְתַחַת כָּל־עֵץ רַעֲנָן׃
    hebrewPlain: ויצבו להם מצבות ואשרים על כל גבעה גבהה ותחת כל עץ רענן
    kjvRefs:
    - 2 Kings 17:10
    kjvOsis:
    - 2Kgs.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.11
    scripture: tanakh
    name: Tanakh 2 Kings 17:11
    ref: 2 Kings 17:11
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 11
    ordinal: 9906
    text: and there they offered in all the high places, as did the nations whom the LORD carried away before them; and wrought wicked things to provoke the LORD;
    translation: JPS 1917
    original: וַיְקַטְּרוּ־שָׁם בְּכָל־בָּמוֹת כַּגּוֹיִם אֲשֶׁר־הֶגְלָה יְהוָה מִפְּנֵיהֶם וַיַּעֲשׂוּ דְּבָרִים רָעִים לְהַכְעִיס אֶת־יְהוָה׃
    hebrewPlain: ויקטרו שם בכל במות כגוים אשר הגלה יהוה מפניהם ויעשו דברים רעים להכעיס את יהוה
    kjvRefs:
    - 2 Kings 17:11
    kjvOsis:
    - 2Kgs.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.12
    scripture: tanakh
    name: Tanakh 2 Kings 17:12
    ref: 2 Kings 17:12
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 12
    ordinal: 9907
    text: 'and they served idols, whereof the LORD had said unto them: ‘Ye shall not do this thing’;'
    translation: JPS 1917
    original: וַיַּעַבְדוּ הַגִּלֻּלִים אֲשֶׁר אָמַר יְהוָה לָהֶם לֹא תַעֲשׂוּ אֶת־הַדָּבָר הַזֶּה׃
    hebrewPlain: ויעבדו הגללים אשר אמר יהוה להם לא תעשו את הדבר הזה
    kjvRefs:
    - 2 Kings 17:12
    kjvOsis:
    - 2Kgs.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.13
    scripture: tanakh
    name: Tanakh 2 Kings 17:13
    ref: 2 Kings 17:13
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 13
    ordinal: 9908
    text: 'yet the LORD forewarned Israel, and Judah, by the hand of every prophet, and of every seer, saying: ‘Turn ye from your evil ways, and keep My commandments and My statutes, according to all the law which I commanded your fathers, and which I sent to you by the hand of My servants the prophets’;'
    translation: JPS 1917
    original: וַיָּעַד יְהוָה בְּיִשְׂרָאֵל וּבִיהוּדָה בְּיַד כָּל־נביאו [נְבִיאֵי] כָל־חֹזֶה לֵאמֹר שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי כְּכָל־הַתּוֹרָה אֲשֶׁר צִוִּיתִי אֶת־אֲבֹתֵיכֶם וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים׃
    hebrewPlain: ויעד יהוה בישראל וביהודה ביד כל נביאו [נביאי] כל חזה לאמר שבו מדרכיכם הרעים ושמרו מצותי חקותי ככל התורה אשר צויתי את אבתיכם ואשר שלחתי אליכם ביד עבדי הנביאים
    kjvRefs:
    - 2 Kings 17:13
    kjvOsis:
    - 2Kgs.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.14
    scripture: tanakh
    name: Tanakh 2 Kings 17:14
    ref: 2 Kings 17:14
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 14
    ordinal: 9909
    text: notwithstanding they would not hear, but hardened their neck, like to the neck of their fathers, who believed not in the LORD their God;
    translation: JPS 1917
    original: וְלֹא שָׁמֵעוּ וַיַּקְשׁוּ אֶת־עָרְפָּם כְּעֹרֶף אֲבוֹתָם אֲשֶׁר לֹא הֶאֱמִינוּ בַּיהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: ולא שמעו ויקשו את ערפם כערף אבותם אשר לא האמינו ביהוה אלהיהם
    kjvRefs:
    - 2 Kings 17:14
    kjvOsis:
    - 2Kgs.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.15
    scripture: tanakh
    name: Tanakh 2 Kings 17:15
    ref: 2 Kings 17:15
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 15
    ordinal: 9910
    text: and they rejected His statutes, and His covenant that He made with their fathers, and His testimonies wherewith He testified against them; and they went after things of nought, and became nought, and after the nations that were round about them, concerning whom the LORD had charged them that they should not do like them;
    translation: JPS 1917
    original: וַיִּמְאֲסוּ אֶת־חֻקָּיו וְאֶת־בְּרִיתוֹ אֲשֶׁר כָּרַת אֶת־אֲבוֹתָם וְאֵת עֵדְוֺתָיו אֲשֶׁר הֵעִיד בָּם וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל וַיֶּהְבָּלוּ וְאַחֲרֵי הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם אֲשֶׁר צִוָּה יְהוָה אֹתָם לְבִלְתִּי עֲשׂוֹת כָּהֶם׃
    hebrewPlain: וימאסו את חקיו ואת בריתו אשר כרת את אבותם ואת עדותיו אשר העיד בם וילכו אחרי ההבל ויהבלו ואחרי הגוים אשר סביבתם אשר צוה יהוה אתם לבלתי עשות כהם
    kjvRefs:
    - 2 Kings 17:15
    kjvOsis:
    - 2Kgs.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.16
    scripture: tanakh
    name: Tanakh 2 Kings 17:16
    ref: 2 Kings 17:16
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 16
    ordinal: 9911
    text: and they forsook all the commandments of the LORD their God, and made them molten images, even two calves, and made an Asherah, and worshipped all the host of heaven, and served Baal;
    translation: JPS 1917
    original: וַיַּעַזְבוּ אֶת־כָּל־מִצְוֺת יְהוָה אֱלֹהֵיהֶם וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים [שְׁנֵי] עֲגָלִים וַיַּעֲשׂוּ אֲשֵׁירָה וַיִּשְׁתַּחֲווּ לְכָל־צְבָא הַשָּׁמַיִם וַיַּעַבְדוּ אֶת־הַבָּעַל׃
    hebrewPlain: ויעזבו את כל מצות יהוה אלהיהם ויעשו להם מסכה שנים [שני] עגלים ויעשו אשירה וישתחוו לכל צבא השמים ויעבדו את הבעל
    kjvRefs:
    - 2 Kings 17:16
    kjvOsis:
    - 2Kgs.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.17
    scripture: tanakh
    name: Tanakh 2 Kings 17:17
    ref: 2 Kings 17:17
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 17
    ordinal: 9912
    text: and they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and gave themselves over to do that which was evil in the sight of the LORD, to provoke Him;
    translation: JPS 1917
    original: וַיַּעֲבִירוּ אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם בָּאֵשׁ וַיִּקְסְמוּ קְסָמִים וַיְנַחֵשׁוּ וַיִּתְמַכְּרוּ לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה לְהַכְעִיסוֹ׃
    hebrewPlain: ויעבירו את בניהם ואת בנותיהם באש ויקסמו קסמים וינחשו ויתמכרו לעשות הרע בעיני יהוה להכעיסו
    kjvRefs:
    - 2 Kings 17:17
    kjvOsis:
    - 2Kgs.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.18
    scripture: tanakh
    name: Tanakh 2 Kings 17:18
    ref: 2 Kings 17:18
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 18
    ordinal: 9913
    text: that the LORD was very angry with Israel, and removed them out of His sight; there was none left but the tribe of Judah only.
    translation: JPS 1917
    original: וַיִּתְאַנַּף יְהוָה מְאֹד בְּיִשְׂרָאֵל וַיְסִרֵם מֵעַל פָּנָיו לֹא נִשְׁאַר רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ׃
    hebrewPlain: ויתאנף יהוה מאד בישראל ויסרם מעל פניו לא נשאר רק שבט יהודה לבדו
    kjvRefs:
    - 2 Kings 17:18
    kjvOsis:
    - 2Kgs.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.19
    scripture: tanakh
    name: Tanakh 2 Kings 17:19
    ref: 2 Kings 17:19
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 19
    ordinal: 9914
    text: Also Judah kept not the commandments of the LORD their God, but walked in the statutes of Israel which they practised.
    translation: JPS 1917
    original: גַּם־יְהוּדָה לֹא שָׁמַר אֶת־מִצְוֺת יְהוָה אֱלֹהֵיהֶם וַיֵּלְכוּ בְּחֻקּוֹת יִשְׂרָאֵל אֲשֶׁר עָשׂוּ׃
    hebrewPlain: גם יהודה לא שמר את מצות יהוה אלהיהם וילכו בחקות ישראל אשר עשו
    kjvRefs:
    - 2 Kings 17:19
    kjvOsis:
    - 2Kgs.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.20
    scripture: tanakh
    name: Tanakh 2 Kings 17:20
    ref: 2 Kings 17:20
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 20
    ordinal: 9915
    text: And the LORD rejected all the seed of Israel, and afflicted them, and delivered them into the hand of spoilers, until He had cast them out of His sight.
    translation: JPS 1917
    original: וַיִּמְאַס יְהוָה בְּכָל־זֶרַע יִשְׂרָאֵל וַיְעַנֵּם וַיִּתְּנֵם בְּיַד־שֹׁסִים עַד אֲשֶׁר הִשְׁלִיכָם מִפָּנָיו׃
    hebrewPlain: וימאס יהוה בכל זרע ישראל ויענם ויתנם ביד שסים עד אשר השליכם מפניו
    kjvRefs:
    - 2 Kings 17:20
    kjvOsis:
    - 2Kgs.17.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.21
    scripture: tanakh
    name: Tanakh 2 Kings 17:21
    ref: 2 Kings 17:21
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 21
    ordinal: 9916
    text: For He rent Israel from the house of David; and they made Jeroboam the son of Nebat king; and Jeroboam drew Israel away from following the LORD, and made them sin a great sin.
    translation: JPS 1917
    original: כִּי־קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד וַיַּמְלִיכוּ אֶת־יָרָבְעָם בֶּן־נְבָט וידא [וַיַּדַּח] יָרָבְעָם אֶת־יִשְׂרָאֵל מֵאַחֲרֵי יְהוָה וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה׃
    hebrewPlain: כי קרע ישראל מעל בית דוד וימליכו את ירבעם בן נבט וידא [וידח] ירבעם את ישראל מאחרי יהוה והחטיאם חטאה גדולה
    kjvRefs:
    - 2 Kings 17:21
    kjvOsis:
    - 2Kgs.17.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.22
    scripture: tanakh
    name: Tanakh 2 Kings 17:22
    ref: 2 Kings 17:22
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 22
    ordinal: 9917
    text: And the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them;
    translation: JPS 1917
    original: וַיֵּלְכוּ בְּנֵי יִשְׂרָאֵל בְּכָל־חַטֹּאות יָרָבְעָם אֲשֶׁר עָשָׂה לֹא־סָרוּ מִמֶּנָּה׃
    hebrewPlain: וילכו בני ישראל בכל חטאות ירבעם אשר עשה לא סרו ממנה
    kjvRefs:
    - 2 Kings 17:22
    kjvOsis:
    - 2Kgs.17.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.23
    scripture: tanakh
    name: Tanakh 2 Kings 17:23
    ref: 2 Kings 17:23
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 23
    ordinal: 9918
    text: until the LORD removed Israel out of His sight, as He spoke by the hand of all His servants the prophets. So Israel was carried away out of their own land to Assyria, unto this day.
    translation: JPS 1917
    original: עַד אֲשֶׁר־הֵסִיר יְהוָה אֶת־יִשְׂרָאֵל מֵעַל פָּנָיו כַּאֲשֶׁר דִּבֶּר בְּיַד כָּל־עֲבָדָיו הַנְּבִיאִים וַיִּגֶל יִשְׂרָאֵל מֵעַל אַדְמָתוֹ אַשּׁוּרָה עַד הַיּוֹם הַזֶּה׃
    hebrewPlain: עד אשר הסיר יהוה את ישראל מעל פניו כאשר דבר ביד כל עבדיו הנביאים ויגל ישראל מעל אדמתו אשורה עד היום הזה
    kjvRefs:
    - 2 Kings 17:23
    kjvOsis:
    - 2Kgs.17.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.24
    scripture: tanakh
    name: Tanakh 2 Kings 17:24
    ref: 2 Kings 17:24
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 24
    ordinal: 9919
    text: And the king of Assyria brought men from Babylon, and from Cuthah, and from Avva, and from Hamath and Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel; and they possessed Samaria, and dwelt in the cities thereof.
    translation: JPS 1917
    original: וַיָּבֵא מֶלֶךְ־אַשּׁוּר מִבָּבֶל וּמִכּוּתָה וּמֵעַוָּא וּמֵחֲמָת וּסְפַרְוַיִם וַיֹּשֶׁב בְּעָרֵי שֹׁמְרוֹן תַּחַת בְּנֵי יִשְׂרָאֵל וַיִּרְשׁוּ אֶת־שֹׁמְרוֹן וַיֵּשְׁבוּ בְּעָרֶיהָ׃
    hebrewPlain: ויבא מלך אשור מבבל ומכותה ומעוא ומחמת וספרוים וישב בערי שמרון תחת בני ישראל וירשו את שמרון וישבו בעריה
    kjvRefs:
    - 2 Kings 17:24
    kjvOsis:
    - 2Kgs.17.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.25
    scripture: tanakh
    name: Tanakh 2 Kings 17:25
    ref: 2 Kings 17:25
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 25
    ordinal: 9920
    text: And so it was, at the beginning of their dwelling there, that they feared not the LORD; therefore the LORD sent lions among them, which killed some of them.
    translation: JPS 1917
    original: וַיְהִי בִּתְחִלַּת שִׁבְתָּם שָׁם לֹא יָרְאוּ אֶת־יְהוָה וַיְשַׁלַּח יְהוָה בָּהֶם אֶת־הָאֲרָיוֹת וַיִּהְיוּ הֹרְגִים בָּהֶם׃
    hebrewPlain: ויהי בתחלת שבתם שם לא יראו את יהוה וישלח יהוה בהם את האריות ויהיו הרגים בהם
    kjvRefs:
    - 2 Kings 17:25
    kjvOsis:
    - 2Kgs.17.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.26
    scripture: tanakh
    name: Tanakh 2 Kings 17:26
    ref: 2 Kings 17:26
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 26
    ordinal: 9921
    text: 'Wherefore they spoke to the king of Assyria, saying: ‘The nations which thou hast carried away, and placed in the cities of Samaria, know not the manner of the God of the land; therefore He hath sent lions among them, and, behold, they slay them, because they know not the manner of the God of the land.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ לְמֶלֶךְ אַשּׁוּר לֵאמֹר הַגּוֹיִם אֲשֶׁר הִגְלִיתָ וַתּוֹשֶׁב בְּעָרֵי שֹׁמְרוֹן לֹא יָדְעוּ אֶת־מִשְׁפַּט אֱלֹהֵי הָאָרֶץ וַיְשַׁלַּח־בָּם אֶת־הָאֲרָיוֹת וְהִנָּם מְמִיתִים אוֹתָם כַּאֲשֶׁר אֵינָם יֹדְעִים אֶת־מִשְׁפַּט אֱלֹהֵי הָאָרֶץ׃
    hebrewPlain: ויאמרו למלך אשור לאמר הגוים אשר הגלית ותושב בערי שמרון לא ידעו את משפט אלהי הארץ וישלח בם את האריות והנם ממיתים אותם כאשר אינם ידעים את משפט אלהי הארץ
    kjvRefs:
    - 2 Kings 17:26
    kjvOsis:
    - 2Kgs.17.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.27
    scripture: tanakh
    name: Tanakh 2 Kings 17:27
    ref: 2 Kings 17:27
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 27
    ordinal: 9922
    text: 'Then the king of Assyria commanded, saying: ‘Carry thither one of the priests whom ye brought from thence; and let them go and dwell there, and let him teach them the manner of the God of the land.’'
    translation: JPS 1917
    original: וַיְצַו מֶלֶךְ־אַשּׁוּר לֵאמֹר הֹלִיכוּ שָׁמָּה אֶחָד מֵהַכֹּהֲנִים אֲשֶׁר הִגְלִיתֶם מִשָּׁם וְיֵלְכוּ וְיֵשְׁבוּ שָׁם וְיֹרֵם אֶת־מִשְׁפַּט אֱלֹהֵי הָאָרֶץ׃
    hebrewPlain: ויצו מלך אשור לאמר הליכו שמה אחד מהכהנים אשר הגליתם משם וילכו וישבו שם וירם את משפט אלהי הארץ
    kjvRefs:
    - 2 Kings 17:27
    kjvOsis:
    - 2Kgs.17.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.28
    scripture: tanakh
    name: Tanakh 2 Kings 17:28
    ref: 2 Kings 17:28
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 28
    ordinal: 9923
    text: So one of the priests whom they had carried away from Samaria came and dwelt in Beth-el, and taught them how they should fear the LORD.
    translation: JPS 1917
    original: וַיָּבֹא אֶחָד מֵהַכֹּהֲנִים אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן וַיֵּשֶׁב בְּבֵית־אֵל וַיְהִי מוֹרֶה אֹתָם אֵיךְ יִירְאוּ אֶת־יְהוָה׃
    hebrewPlain: ויבא אחד מהכהנים אשר הגלו משמרון וישב בבית אל ויהי מורה אתם איך ייראו את יהוה
    kjvRefs:
    - 2 Kings 17:28
    kjvOsis:
    - 2Kgs.17.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.29
    scripture: tanakh
    name: Tanakh 2 Kings 17:29
    ref: 2 Kings 17:29
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 29
    ordinal: 9924
    text: Howbeit every nation made gods of their own, and put them in the houses of the high places which the Samaritans had made, every nation in their cities wherein they dwelt.
    translation: JPS 1917
    original: וַיִּהְיוּ עֹשִׂים גּוֹי גּוֹי אֱלֹהָיו וַיַּנִּיחוּ בְּבֵית הַבָּמוֹת אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים גּוֹי גּוֹי בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם׃
    hebrewPlain: ויהיו עשים גוי גוי אלהיו ויניחו בבית הבמות אשר עשו השמרנים גוי גוי בעריהם אשר הם ישבים שם
    kjvRefs:
    - 2 Kings 17:29
    kjvOsis:
    - 2Kgs.17.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.30
    scripture: tanakh
    name: Tanakh 2 Kings 17:30
    ref: 2 Kings 17:30
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 30
    ordinal: 9925
    text: And the men of Babylon made Succoth-benoth, and the men of Cuth made Nergal, and the men of Hamath made Ashima,
    translation: JPS 1917
    original: וְאַנְשֵׁי בָבֶל עָשׂוּ אֶת־סֻכּוֹת בְּנוֹת וְאַנְשֵׁי־כוּת עָשׂוּ אֶת־נֵרְגַל וְאַנְשֵׁי חֲמָת עָשׂוּ אֶת־אֲשִׁימָא׃
    hebrewPlain: ואנשי בבל עשו את סכות בנות ואנשי כות עשו את נרגל ואנשי חמת עשו את אשימא
    kjvRefs:
    - 2 Kings 17:30
    kjvOsis:
    - 2Kgs.17.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.31
    scripture: tanakh
    name: Tanakh 2 Kings 17:31
    ref: 2 Kings 17:31
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 31
    ordinal: 9926
    text: and the Avvites made Nibhaz and Tartak, and the Sepharvites burnt their children in the fire to Adrammelech and Anammelech, the gods of Sepharvaim.
    translation: JPS 1917
    original: וְהָעַוִּים עָשׂוּ נִבְחַז וְאֶת־תַּרְתָּק וְהַסְפַרְוִים שֹׂרְפִים אֶת־בְּנֵיהֶם בָּאֵשׁ לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ אלה [אֱלֹהֵי] ספרים [סְפַרְוָיִם׃]
    hebrewPlain: והעוים עשו נבחז ואת תרתק והספרוים שרפים את בניהם באש לאדרמלך וענמלך אלה [אלהי] ספרים [ספרוים]
    kjvRefs:
    - 2 Kings 17:31
    kjvOsis:
    - 2Kgs.17.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.32
    scripture: tanakh
    name: Tanakh 2 Kings 17:32
    ref: 2 Kings 17:32
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 32
    ordinal: 9927
    text: So they feared the LORD, and made unto them from among themselves priests of the high places, who sacrificed for them in the houses of the high places.
    translation: JPS 1917
    original: וַיִּהְיוּ יְרֵאִים אֶת־יְהוָה וַיַּעֲשׂוּ לָהֶם מִקְצוֹתָם כֹּהֲנֵי בָמוֹת וַיִּהְיוּ עֹשִׂים לָהֶם בְּבֵית הַבָּמוֹת׃
    hebrewPlain: ויהיו יראים את יהוה ויעשו להם מקצותם כהני במות ויהיו עשים להם בבית הבמות
    kjvRefs:
    - 2 Kings 17:32
    kjvOsis:
    - 2Kgs.17.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.33
    scripture: tanakh
    name: Tanakh 2 Kings 17:33
    ref: 2 Kings 17:33
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 33
    ordinal: 9928
    text: They feared the LORD, and served their own gods, after the manner of the nations from among whom they had been carried away.
    translation: JPS 1917
    original: אֶת־יְהוָה הָיוּ יְרֵאִים וְאֶת־אֱלֹהֵיהֶם הָיוּ עֹבְדִים כְּמִשְׁפַּט הַגּוֹיִם אֲשֶׁר־הִגְלוּ אֹתָם מִשָּׁם׃
    hebrewPlain: את יהוה היו יראים ואת אלהיהם היו עבדים כמשפט הגוים אשר הגלו אתם משם
    kjvRefs:
    - 2 Kings 17:33
    kjvOsis:
    - 2Kgs.17.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.34
    scripture: tanakh
    name: Tanakh 2 Kings 17:34
    ref: 2 Kings 17:34
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 34
    ordinal: 9929
    text: 'Unto this day they do after the former manners: they fear not the LORD, neither do they after their statutes, or after their ordinances, or after the law or after the commandment which the LORD commanded the children of Jacob, whom He named Israel;'
    translation: JPS 1917
    original: עַד הַיּוֹם הַזֶּה הֵם עֹשִׂים כַּמִּשְׁפָּטִים הָרִאשֹׁנִים אֵינָם יְרֵאִים אֶת־יְהוָה וְאֵינָם עֹשִׂים כְּחֻקֹּתָם וּכְמִשְׁפָּטָם וְכַתּוֹרָה וְכַמִּצְוָה אֲשֶׁר צִוָּה יְהוָה אֶת־בְּנֵי יַעֲקֹב אֲשֶׁר־שָׂם שְׁמוֹ יִשְׂרָאֵל׃
    hebrewPlain: עד היום הזה הם עשים כמשפטים הראשנים אינם יראים את יהוה ואינם עשים כחקתם וכמשפטם וכתורה וכמצוה אשר צוה יהוה את בני יעקב אשר שם שמו ישראל
    kjvRefs:
    - 2 Kings 17:34
    kjvOsis:
    - 2Kgs.17.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.35
    scripture: tanakh
    name: Tanakh 2 Kings 17:35
    ref: 2 Kings 17:35
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 35
    ordinal: 9930
    text: 'with whom the LORD had made a covenant, and charged them, saying: ‘Ye shall not fear other gods, nor bow down to them, nor serve them, nor sacrifice to them;'
    translation: JPS 1917
    original: וַיִּכְרֹת יְהוָה אִתָּם בְּרִית וַיְצַוֵּם לֵאמֹר לֹא תִירְאוּ אֱלֹהִים אֲחֵרִים וְלֹא־תִשְׁתַּחֲווּ לָהֶם וְלֹא תַעַבְדוּם וְלֹא תִזְבְּחוּ לָהֶם׃
    hebrewPlain: ויכרת יהוה אתם ברית ויצום לאמר לא תיראו אלהים אחרים ולא תשתחוו להם ולא תעבדום ולא תזבחו להם
    kjvRefs:
    - 2 Kings 17:35
    kjvOsis:
    - 2Kgs.17.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.36
    scripture: tanakh
    name: Tanakh 2 Kings 17:36
    ref: 2 Kings 17:36
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 36
    ordinal: 9931
    text: but the LORD, who brought you up out of the land of Egypt with great power and with an outstretched arm, Him shall ye fear, and Him shall ye worship, and to Him shall ye sacrifice;
    translation: JPS 1917
    original: כִּי אִם־אֶת־יְהוָה אֲשֶׁר הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם בְּכֹחַ גָּדוֹל וּבִזְרוֹעַ נְטוּיָה אֹתוֹ תִירָאוּ וְלוֹ תִשְׁתַּחֲווּ וְלוֹ תִזְבָּחוּ׃
    hebrewPlain: כי אם את יהוה אשר העלה אתכם מארץ מצרים בכח גדול ובזרוע נטויה אתו תיראו ולו תשתחוו ולו תזבחו
    kjvRefs:
    - 2 Kings 17:36
    kjvOsis:
    - 2Kgs.17.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
