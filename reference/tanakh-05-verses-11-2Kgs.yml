- type: TanakhVerse
  data:
    osis: 2Kgs.12.8
    scripture: tanakh
    name: Tanakh 2 Kings 12:8
    ref: 2 Kings 12:8
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 8
    ordinal: 9769
    text: 'Then king Jehoash called for Jehoiada the priest, and for the other priests, and said unto them: ‘Why repair ye not the breaches of the house? now therefore take no longer money from them that bestow it upon you, but deliver it for the breaches of the house.’'
    translation: JPS 1917
    original: וַיִּקְרָא הַמֶּלֶךְ יְהוֹאָשׁ לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים וַיֹּאמֶר אֲלֵהֶם מַדּוּעַ אֵינְכֶם מְחַזְּקִים אֶת־בֶּדֶק הַבָּיִת וְעַתָּה אַל־תִּקְחוּ־כֶסֶף מֵאֵת מַכָּרֵיכֶם כִּי־לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ׃
    hebrewPlain: ויקרא המלך יהואש ליהוידע הכהן ולכהנים ויאמר אלהם מדוע אינכם מחזקים את בדק הבית ועתה אל תקחו כסף מאת מכריכם כי לבדק הבית תתנהו
    kjvRefs:
    - 2 Kings 12:7
    kjvOsis:
    - 2Kgs.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.9
    scripture: tanakh
    name: Tanakh 2 Kings 12:9
    ref: 2 Kings 12:9
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 9
    ordinal: 9770
    text: And the priests consented that they should take no longer money from the people, neither repair the breaches of the house.
    translation: JPS 1917
    original: וַיֵּאֹתוּ הַכֹּהֲנִים לְבִלְתִּי קְחַת־כֶּסֶף מֵאֵת הָעָם וּלְבִלְתִּי חַזֵּק אֶת־בֶּדֶק הַבָּיִת׃
    hebrewPlain: ויאתו הכהנים לבלתי קחת כסף מאת העם ולבלתי חזק את בדק הבית
    kjvRefs:
    - 2 Kings 12:8
    kjvOsis:
    - 2Kgs.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.10
    scripture: tanakh
    name: Tanakh 2 Kings 12:10
    ref: 2 Kings 12:10
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 10
    ordinal: 9771
    text: And Jehoiada the priest took a chest, and bored a hole in the lid of it, and set it beside the altar, on the right side as one cometh into the house of the LORD; and the priests that kept the threshold put therein all the money that was brought into the house of the LORD.
    translation: JPS 1917
    original: וַיִּקַּח יְהוֹיָדָע הַכֹּהֵן אֲרוֹן אֶחָד וַיִּקֹּב חֹר בְּדַלְתּוֹ וַיִּתֵּן אֹתוֹ אֵצֶל הַמִּזְבֵּחַ בימין [מִיָּמִין] בְּבוֹא־אִישׁ בֵּית יְהוָה וְנָתְנוּ־שָׁמָּה הַכֹּהֲנִים שֹׁמְרֵי הַסַּף אֶת־כָּל־הַכֶּסֶף הַמּוּבָא בֵית־יְהוָה׃
    hebrewPlain: ויקח יהוידע הכהן ארון אחד ויקב חר בדלתו ויתן אתו אצל המזבח בימין [מימין] בבוא איש בית יהוה ונתנו שמה הכהנים שמרי הסף את כל הכסף המובא בית יהוה
    kjvRefs:
    - 2 Kings 12:9
    kjvOsis:
    - 2Kgs.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.11
    scripture: tanakh
    name: Tanakh 2 Kings 12:11
    ref: 2 Kings 12:11
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 11
    ordinal: 9772
    text: And it was so, when they saw that there was much money in the chest, that the king’s scribe and the high priest came up, and they put up in bags and counted the money that was found in the house of the LORD.
    translation: JPS 1917
    original: וַיְהִי כִּרְאוֹתָם כִּי־רַב הַכֶּסֶף בָּאָרוֹן וַיַּעַל סֹפֵר הַמֶּלֶךְ וְהַכֹּהֵן הַגָּדוֹל וַיָּצֻרוּ וַיִּמְנוּ אֶת־הַכֶּסֶף הַנִּמְצָא בֵית־יְהוָה׃
    hebrewPlain: ויהי כראותם כי רב הכסף בארון ויעל ספר המלך והכהן הגדול ויצרו וימנו את הכסף הנמצא בית יהוה
    kjvRefs:
    - 2 Kings 12:10
    kjvOsis:
    - 2Kgs.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.12
    scripture: tanakh
    name: Tanakh 2 Kings 12:12
    ref: 2 Kings 12:12
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 12
    ordinal: 9773
    text: And they gave the money that was weighed out into the hands of them that did the work, that had the oversight of the house of the LORD; and they paid it out to the carpenters and the builders, that wrought upon the house of the LORD,
    translation: JPS 1917
    original: וְנָתְנוּ אֶת־הַכֶּסֶף הַמְתֻכָּן עַל־יד [יְדֵי] עֹשֵׂי הַמְּלָאכָה הפקדים [הַמֻּפְקָדִים] בֵּית יְהוָה וַיּוֹצִיאֻהוּ לְחָרָשֵׁי הָעֵץ וְלַבֹּנִים הָעֹשִׂים בֵּית יְהוָה׃
    hebrewPlain: ונתנו את הכסף המתכן על יד [ידי] עשי המלאכה הפקדים [המפקדים] בית יהוה ויוציאהו לחרשי העץ ולבנים העשים בית יהוה
    kjvRefs:
    - 2 Kings 12:11
    kjvOsis:
    - 2Kgs.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.13
    scripture: tanakh
    name: Tanakh 2 Kings 12:13
    ref: 2 Kings 12:13
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 13
    ordinal: 9774
    text: and to the masons and the hewers of stone, and for buying timber and hewn stone to repair the breaches of the house of the LORD, and for all that was laid out for the house to repair it.
    translation: JPS 1917
    original: וְלַגֹּדְרִים וּלְחֹצְבֵי הָאֶבֶן וְלִקְנוֹת עֵצִים וְאַבְנֵי מַחְצֵב לְחַזֵּק אֶת־בֶּדֶק בֵּית־יְהוָה וּלְכֹל אֲשֶׁר־יֵצֵא עַל־הַבַּיִת לְחָזְקָה׃
    hebrewPlain: ולגדרים ולחצבי האבן ולקנות עצים ואבני מחצב לחזק את בדק בית יהוה ולכל אשר יצא על הבית לחזקה
    kjvRefs:
    - 2 Kings 12:12
    kjvOsis:
    - 2Kgs.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.14
    scripture: tanakh
    name: Tanakh 2 Kings 12:14
    ref: 2 Kings 12:14
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 14
    ordinal: 9775
    text: But there were not made for the house of the LORD cups of silver, snuffers, basins, trumpets, any vessels of gold, or vessels of silver, of the money that was brought into the house of the LORD;
    translation: JPS 1917
    original: אַךְ לֹא יֵעָשֶׂה בֵּית יְהוָה סִפּוֹת כֶּסֶף מְזַמְּרוֹת מִזְרָקוֹת חֲצֹצְרוֹת כָּל־כְּלִי זָהָב וּכְלִי־כָסֶף מִן־הַכֶּסֶף הַמּוּבָא בֵית־יְהוָה׃
    hebrewPlain: אך לא יעשה בית יהוה ספות כסף מזמרות מזרקות חצצרות כל כלי זהב וכלי כסף מן הכסף המובא בית יהוה
    kjvRefs:
    - 2 Kings 12:13
    kjvOsis:
    - 2Kgs.12.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.15
    scripture: tanakh
    name: Tanakh 2 Kings 12:15
    ref: 2 Kings 12:15
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 15
    ordinal: 9776
    text: for they gave that to them that did the work, and repaired therewith the house of the LORD.
    translation: JPS 1917
    original: כִּי־לְעֹשֵׂי הַמְּלָאכָה יִתְּנֻהוּ וְחִזְּקוּ־בוֹ אֶת־בֵּית יְהוָה׃
    hebrewPlain: כי לעשי המלאכה יתנהו וחזקו בו את בית יהוה
    kjvRefs:
    - 2 Kings 12:14
    kjvOsis:
    - 2Kgs.12.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.16
    scripture: tanakh
    name: Tanakh 2 Kings 12:16
    ref: 2 Kings 12:16
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 16
    ordinal: 9777
    text: Moreover they reckoned not with the men, into whose hand they delivered the money to give to them that did the work; for they dealt faithfully.
    translation: JPS 1917
    original: וְלֹא יְחַשְּׁבוּ אֶת־הָאֲנָשִׁים אֲשֶׁר יִתְּנוּ אֶת־הַכֶּסֶף עַל־יָדָם לָתֵת לְעֹשֵׂי הַמְּלָאכָה כִּי בֶאֱמֻנָה הֵם עֹשִׂים׃
    hebrewPlain: ולא יחשבו את האנשים אשר יתנו את הכסף על ידם לתת לעשי המלאכה כי באמנה הם עשים
    kjvRefs:
    - 2 Kings 12:15
    kjvOsis:
    - 2Kgs.12.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.17
    scripture: tanakh
    name: Tanakh 2 Kings 12:17
    ref: 2 Kings 12:17
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 17
    ordinal: 9778
    text: The forfeit money, and the sin money, was not brought into the house of the LORD; it was the priests.
    translation: JPS 1917
    original: כֶּסֶף אָשָׁם וְכֶסֶף חַטָּאוֹת לֹא יוּבָא בֵּית יְהוָה לַכֹּהֲנִים יִהְיוּ׃
    hebrewPlain: כסף אשם וכסף חטאות לא יובא בית יהוה לכהנים יהיו
    kjvRefs:
    - 2 Kings 12:16
    kjvOsis:
    - 2Kgs.12.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.18
    scripture: tanakh
    name: Tanakh 2 Kings 12:18
    ref: 2 Kings 12:18
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 18
    ordinal: 9779
    text: Then Hazael king of Aram went up, and fought against Gath, and took it; and Hazael set his face to go up to Jerusalem.
    translation: JPS 1917
    original: אָז יַעֲלֶה חֲזָאֵל מֶלֶךְ אֲרָם וַיִּלָּחֶם עַל־גַּת וַיִּלְכְּדָהּ וַיָּשֶׂם חֲזָאֵל פָּנָיו לַעֲלוֹת עַל־יְרוּשָׁלִָם׃
    hebrewPlain: אז יעלה חזאל מלך ארם וילחם על גת וילכדה וישם חזאל פניו לעלות על ירושלם
    kjvRefs:
    - 2 Kings 12:17
    kjvOsis:
    - 2Kgs.12.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.19
    scripture: tanakh
    name: Tanakh 2 Kings 12:19
    ref: 2 Kings 12:19
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 19
    ordinal: 9780
    text: And Jehoash king Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold that was found in the treasures of the house of the LORD, and of the king’s house, and sent it to Hazael king of Aram; and he went away from Jerusalem.
    translation: JPS 1917
    original: וַיִּקַּח יְהוֹאָשׁ מֶלֶךְ־יְהוּדָה אֵת כָּל־הַקֳּדָשִׁים אֲשֶׁר־הִקְדִּישׁוּ יְהוֹשָׁפָט וִיהוֹרָם וַאֲחַזְיָהוּ אֲבֹתָיו מַלְכֵי יְהוּדָה וְאֶת־קֳדָשָׁיו וְאֵת כָּל־הַזָּהָב הַנִּמְצָא בְּאֹצְרוֹת בֵּית־יְהוָה וּבֵית הַמֶּלֶךְ וַיִּשְׁלַח לַחֲזָאֵל מֶלֶךְ אֲרָם וַיַּעַל מֵעַל יְרוּשָׁלִָם׃
    hebrewPlain: ויקח יהואש מלך יהודה את כל הקדשים אשר הקדישו יהושפט ויהורם ואחזיהו אבתיו מלכי יהודה ואת קדשיו ואת כל הזהב הנמצא באצרות בית יהוה ובית המלך וישלח לחזאל מלך ארם ויעל מעל ירושלם
    kjvRefs:
    - 2 Kings 12:18
    kjvOsis:
    - 2Kgs.12.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.20
    scripture: tanakh
    name: Tanakh 2 Kings 12:20
    ref: 2 Kings 12:20
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 20
    ordinal: 9781
    text: Now the rest of the acts of Joash, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יוֹאָשׁ וְכָל־אֲשֶׁר עָשָׂה הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי יואש וכל אשר עשה הלוא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 12:19
    kjvOsis:
    - 2Kgs.12.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.21
    scripture: tanakh
    name: Tanakh 2 Kings 12:21
    ref: 2 Kings 12:21
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 21
    ordinal: 9782
    text: And his servants arose, and made a conspiracy, and smote Joash at Beth-millo, on the way that goeth down to Silla.
    translation: JPS 1917
    original: וַיָּקֻמוּ עֲבָדָיו וַיִּקְשְׁרוּ־קָשֶׁר וַיַּכּוּ אֶת־יוֹאָשׁ בֵּית מִלֹּא הַיּוֹרֵד סִלָּא׃
    hebrewPlain: ויקמו עבדיו ויקשרו קשר ויכו את יואש בית מלא היורד סלא
    kjvRefs:
    - 2 Kings 12:20
    kjvOsis:
    - 2Kgs.12.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.22
    scripture: tanakh
    name: Tanakh 2 Kings 12:22
    ref: 2 Kings 12:22
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 22
    ordinal: 9783
    text: For Jozacar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David; and Amaziah his son reigned in his stead.
    translation: JPS 1917
    original: וְיוֹזָבָד בֶּן־שִׁמְעָת וִיהוֹזָבָד בֶּן־שֹׁמֵר עֲבָדָיו הִכֻּהוּ וַיָּמֹת וַיִּקְבְּרוּ אֹתוֹ עִם־אֲבֹתָיו בְּעִיר דָּוִד וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו׃
    hebrewPlain: ויוזבד בן שמעת ויהוזבד בן שמר עבדיו הכהו וימת ויקברו אתו עם אבתיו בעיר דוד וימלך אמציה בנו תחתיו
    kjvRefs:
    - 2 Kings 12:21
    kjvOsis:
    - 2Kgs.12.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.13.1
    scripture: tanakh
    name: Tanakh 2 Kings 13:1
    ref: 2 Kings 13:1
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 1
    ordinal: 9784
    text: In the three and twentieth year of Joash the son of Ahaziah, king of Judah, Jehoahaz the son of Jehu began to reign over Israel in Samaria, and reigned seventeen years.
    translation: JPS 1917
    original: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לְיוֹאָשׁ בֶּן־אֲחַזְיָהוּ מֶלֶךְ יְהוּדָה מָלַךְ יְהוֹאָחָז בֶּן־יֵהוּא עַל־יִשְׂרָאֵל בְּשֹׁמְרוֹן שְׁבַע עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: בשנת עשרים ושלש שנה ליואש בן אחזיהו מלך יהודה מלך יהואחז בן יהוא על ישראל בשמרון שבע עשרה שנה
    kjvRefs:
