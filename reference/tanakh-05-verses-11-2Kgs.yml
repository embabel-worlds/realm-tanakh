    section: neviim
    chapter: 1
    verse: 8
    ordinal: 9453
    text: 'And they answered him: ‘He was a hairy man, and girt with a girdle of leather about his loins.’ And he said: ‘It is Elijah the Tishbite.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו אִישׁ בַּעַל שֵׂעָר וְאֵזוֹר עוֹר אָזוּר בְּמָתְנָיו וַיֹּאמַר אֵלִיָּה הַתִּשְׁבִּי הוּא׃
    hebrewPlain: ויאמרו אליו איש בעל שער ואזור עור אזור במתניו ויאמר אליה התשבי הוא
