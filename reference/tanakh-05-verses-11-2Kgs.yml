    name: Tanakh 2 Kings 4:12
    ref: 2 Kings 4:12
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 12
    ordinal: 9527
    text: 'And he said to Gehazi his servant: ‘Call this Shunammite.’ And when he had called her, she stood before him.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־גֵּחֲזִי נַעֲרוֹ קְרָא לַשּׁוּנַמִּית הַזֹּאת וַיִּקְרָא־לָהּ וַתַּעֲמֹד לְפָנָיו׃
    hebrewPlain: ויאמר אל גחזי נערו קרא לשונמית הזאת ויקרא לה ותעמד לפניו
    kjvRefs:
    - 2 Kings 4:12
    kjvOsis:
    - 2Kgs.4.12
