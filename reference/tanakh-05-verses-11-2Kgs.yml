    scripture: tanakh
    name: Tanakh 2 Kings 21:26
    ref: 2 Kings 21:26
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 26
    ordinal: 10057
    text: And he was buried in his sepulchre in the garden of Uzza; and Josiah his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּקְבֹּר אֹתוֹ בִּקְבֻרָתוֹ בְּגַן־עֻזָּא וַיִּמְלֹךְ יֹאשִׁיָּהוּ בְנוֹ תַּחְתָּיו׃
    hebrewPlain: ויקבר אתו בקברתו בגן עזא וימלך יאשיהו בנו תחתיו
