  data:
    osis: 2Kgs.21.19
    scripture: tanakh
    name: Tanakh 2 Kings 21:19
    ref: 2 Kings 21:19
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 19
    ordinal: 10050
    text: Amon was twenty and two years old when he began to reign; and he reigned two years in Jerusalem; and his mother’s name was Meshullemeth the daughter of Haruz of Jotbah.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וּשְׁתַּיִם שָׁנָה אָמוֹן בְּמָלְכוֹ וּשְׁתַּיִם שָׁנִים מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ מְשֻׁלֶּמֶת בַּת־חָרוּץ מִן־יָטְבָה׃
    hebrewPlain: בן עשרים ושתים שנה אמון במלכו ושתים שנים מלך בירושלם ושם אמו משלמת בת חרוץ מן יטבה
    kjvRefs:
    - 2 Kings 21:19
    kjvOsis:
    - 2Kgs.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
