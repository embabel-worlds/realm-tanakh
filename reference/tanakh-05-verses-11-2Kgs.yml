  data:
    osis: 2Kgs.15.13
    scripture: tanakh
    name: Tanakh 2 Kings 15:13
    ref: 2 Kings 15:13
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 13
    ordinal: 9850
    text: Shallum the son of Jabesh began to reign in the nine and thirtieth year of Uzziah king of Judah; and he reigned the space of a month in Samaria.
    translation: JPS 1917
    original: שַׁלּוּם בֶּן־יָבֵישׁ מָלַךְ בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לְעֻזִיָּה מֶלֶךְ יְהוּדָה וַיִּמְלֹךְ יֶרַח־יָמִים בְּשֹׁמְרוֹן׃
