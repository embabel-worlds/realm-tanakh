    name: Tanakh 2 Kings 9:5
    ref: 2 Kings 9:5
    book: 2Kgs
    section: neviim
    chapter: 9
    verse: 5
    ordinal: 9673
    text: 'And when he came, behold, the captains of the host were sitting; and he said: ‘I have an errand to thee, O captain.’ And Jehu said: ‘Unto which of us all?’ And he said: ‘To thee, O captain.’'
    translation: JPS 1917
    original: וַיָּבֹא וְהִנֵּה שָׂרֵי הַחַיִל יֹשְׁבִים וַיֹּאמֶר דָּבָר לִי אֵלֶיךָ הַשָּׂר וַיֹּאמֶר יֵהוּא אֶל־מִי מִכֻּלָּנוּ וַיֹּאמֶר אֵלֶיךָ הַשָּׂר׃
    hebrewPlain: ויבא והנה שרי החיל ישבים ויאמר דבר לי אליך השר ויאמר יהוא אל מי מכלנו ויאמר אליך השר
