- type: TanakhVerse
  data:
    osis: 2Kgs.12.2
    scripture: tanakh
    name: Tanakh 2 Kings 12:2
    ref: 2 Kings 12:2
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 2
    ordinal: 9763
    text: In the seventh year of Jehu began Jehoash to reign; and he reigned forty years in Jerusalem; and his mother’s name was Zibiah of Beer-sheba.
    translation: JPS 1917
    original: בִּשְׁנַת־שֶׁבַע לְיֵהוּא מָלַךְ יְהוֹאָשׁ וְאַרְבָּעִים שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ צִבְיָה מִבְּאֵר שָׁבַע׃
    hebrewPlain: בשנת שבע ליהוא מלך יהואש וארבעים שנה מלך בירושלם ושם אמו צביה מבאר שבע
    kjvRefs:
    - 2 Kings 12:1
    kjvOsis:
    - 2Kgs.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.3
    scripture: tanakh
    name: Tanakh 2 Kings 12:3
    ref: 2 Kings 12:3
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 3
    ordinal: 9764
    text: And Jehoash did that which was right in the eyes of the LORD all his days wherein Jehoiada the priest instructed him.
    translation: JPS 1917
    original: וַיַּעַשׂ יְהוֹאָשׁ הַיָּשָׁר בְּעֵינֵי יְהוָה כָּל־יָמָיו אֲשֶׁר הוֹרָהוּ יְהוֹיָדָע הַכֹּהֵן׃
    hebrewPlain: ויעש יהואש הישר בעיני יהוה כל ימיו אשר הורהו יהוידע הכהן
    kjvRefs:
    - 2 Kings 12:2
    kjvOsis:
    - 2Kgs.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.4
    scripture: tanakh
    name: Tanakh 2 Kings 12:4
    ref: 2 Kings 12:4
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 4
    ordinal: 9765
    text: Howbeit the high places were not taken away; the people still sacrificed and offered in the high places.
    translation: JPS 1917
    original: רַק הַבָּמוֹת לֹא־סָרוּ עוֹד הָעָם מְזַבְּחִים וּמְקַטְּרִים בַּבָּמוֹת׃
    hebrewPlain: רק הבמות לא סרו עוד העם מזבחים ומקטרים בבמות
    kjvRefs:
    - 2 Kings 12:3
    kjvOsis:
    - 2Kgs.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.5
    scripture: tanakh
    name: Tanakh 2 Kings 12:5
    ref: 2 Kings 12:5
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 5
    ordinal: 9766
    text: 'And Jehoash said to the priests: ‘All the money of the hallowed things that is brought into the house of the LORD, in current money, the money of the persons for whom each man is rated, all the money that cometh into any man’s heart to bring into the house of the LORD,'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹאָשׁ אֶל־הַכֹּהֲנִים כֹּל כֶּסֶף הַקֳּדָשִׁים אֲשֶׁר־יוּבָא בֵית־יְהוָה כֶּסֶף עוֹבֵר אִישׁ כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ כָּל־כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב־אִישׁ לְהָבִיא בֵּית יְהוָה׃
    hebrewPlain: ויאמר יהואש אל הכהנים כל כסף הקדשים אשר יובא בית יהוה כסף עובר איש כסף נפשות ערכו כל כסף אשר יעלה על לב איש להביא בית יהוה
    kjvRefs:
    - 2 Kings 12:4
    kjvOsis:
    - 2Kgs.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.6
    scripture: tanakh
    name: Tanakh 2 Kings 12:6
    ref: 2 Kings 12:6
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 6
    ordinal: 9767
    text: let the priests take it to them, every man from him that bestoweth it upon him; and they shall repair the breaches of the house, wheresoever any breach shall be found.’
    translation: JPS 1917
    original: יִקְחוּ לָהֶם הַכֹּהֲנִים אִישׁ מֵאֵת מַכָּרוֹ וְהֵם יְחַזְּקוּ אֶת־בֶּדֶק הַבַּיִת לְכֹל אֲשֶׁר־יִמָּצֵא שָׁם בָּדֶק׃
    hebrewPlain: יקחו להם הכהנים איש מאת מכרו והם יחזקו את בדק הבית לכל אשר ימצא שם בדק
    kjvRefs:
    - 2 Kings 12:5
    kjvOsis:
    - 2Kgs.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.12
- type: TanakhVerse
  data:
    osis: 2Kgs.12.7
    scripture: tanakh
    name: Tanakh 2 Kings 12:7
    ref: 2 Kings 12:7
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 7
    ordinal: 9768
    text: But it was so, that in the three and twentieth year of king Jehoash the priests had not repaired the breaches of the house.
    translation: JPS 1917
    original: וַיְהִי בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ לֹא־חִזְּקוּ הַכֹּהֲנִים אֶת־בֶּדֶק הַבָּיִת׃
    hebrewPlain: ויהי בשנת עשרים ושלש שנה למלך יהואש לא חזקו הכהנים את בדק הבית
    kjvRefs:
    - 2 Kings 12:6
    kjvOsis:
    - 2Kgs.12.6
  relations:
  - predicate: IN
    to:
