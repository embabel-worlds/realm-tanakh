- type: TanakhVerse
  data:
    osis: 2Kgs.5.18
    scripture: tanakh
    name: Tanakh 2 Kings 5:18
    ref: 2 Kings 5:18
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 18
    ordinal: 9577
    text: 'In this thing the LORD pardon thy servant: when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I prostrate myself in the house of Rimmon, when I prostrate myself in the house of Rimmon, the LORD pardon thy servant in this thing.’'
    translation: JPS 1917
    original: לַדָּבָר הַזֶּה יִסְלַח יְהוָה לְעַבְדֶּךָ בְּבוֹא אֲדֹנִי בֵית־רִמּוֹן לְהִשְׁתַּחֲוֺת שָׁמָּה וְהוּא נִשְׁעָן עַל־יָדִי וְהִשְׁתַּחֲוֵיתִי בֵּית רִמֹּן בְּהִשְׁתַּחֲוָיָתִי בֵּית רִמֹּן יִסְלַח־נא יְהוָה לְעַבְדְּךָ בַּדָּבָר הַזֶּה׃
    hebrewPlain: לדבר הזה יסלח יהוה לעבדך בבוא אדני בית רמון להשתחות שמה והוא נשען על ידי והשתחויתי בית רמן בהשתחויתי בית רמן יסלח נא יהוה לעבדך בדבר הזה
    kjvRefs:
    - 2 Kings 5:18
    kjvOsis:
    - 2Kgs.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.19
    scripture: tanakh
    name: Tanakh 2 Kings 5:19
    ref: 2 Kings 5:19
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 19
    ordinal: 9578
    text: 'And he said unto him: ‘Go in peace.’ So he departed from him some way.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ לֵךְ לְשָׁלוֹם וַיֵּלֶךְ מֵאִתּוֹ כִּבְרַת־אָרֶץ׃
    hebrewPlain: ויאמר לו לך לשלום וילך מאתו כברת ארץ
    kjvRefs:
    - 2 Kings 5:19
    kjvOsis:
    - 2Kgs.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.20
    scripture: tanakh
    name: Tanakh 2 Kings 5:20
    ref: 2 Kings 5:20
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 20
    ordinal: 9579
    text: 'But Gehazi, the servant of Elisha the man of God, said: ‘Behold, my master hath spared this Naaman the Aramean, in not receiving at his hands that which he brought; as the LORD liveth, I will surely run after him, and take somewhat of him.’'
    translation: JPS 1917
    original: וַיֹּאמֶר גֵּיחֲזִי נַעַר אֱלִישָׁע אִישׁ־הָאֱלֹהִים הִנֵּה חָשַׂךְ אֲדֹנִי אֶת־נַעֲמָן הָאֲרַמִּי הַזֶּה מִקַּחַת מִיָּדוֹ אֵת אֲשֶׁר־הֵבִיא חַי־יְהוָה כִּי־אִם־רַצְתִּי אַחֲרָיו וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה׃
    hebrewPlain: ויאמר גיחזי נער אלישע איש האלהים הנה חשך אדני את נעמן הארמי הזה מקחת מידו את אשר הביא חי יהוה כי אם רצתי אחריו ולקחתי מאתו מאומה
    kjvRefs:
    - 2 Kings 5:20
    kjvOsis:
    - 2Kgs.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.21
    scripture: tanakh
    name: Tanakh 2 Kings 5:21
    ref: 2 Kings 5:21
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 21
    ordinal: 9580
    text: 'So Gehazi followed after Naaman. And when Naaman saw one running after him, he alighted from the chariot to meet him, and said: ‘Is all well?’'
    translation: JPS 1917
    original: וַיִּרְדֹּף גֵּיחֲזִי אַחֲרֵי נַעֲמָן וַיִּרְאֶה נַעֲמָן רָץ אַחֲרָיו וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה לִקְרָאתוֹ וַיֹּאמֶר הֲשָׁלוֹם׃
    hebrewPlain: וירדף גיחזי אחרי נעמן ויראה נעמן רץ אחריו ויפל מעל המרכבה לקראתו ויאמר השלום
    kjvRefs:
    - 2 Kings 5:21
    kjvOsis:
    - 2Kgs.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.22
    scripture: tanakh
    name: Tanakh 2 Kings 5:22
    ref: 2 Kings 5:22
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 22
    ordinal: 9581
    text: 'And he said: ‘All is well. My master hath sent me, saying: Behold, even now there are come to me from the hill-country of Ephraim two young men of the sons of the prophets; give them, I pray thee, a talent of silver, and two changes of raiment.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שָׁלוֹם אֲדֹנִי שְׁלָחַנִי לֵאמֹר הִנֵּה עַתָּה זֶה בָּאוּ אֵלַי שְׁנֵי־נְעָרִים מֵהַר אֶפְרַיִם מִבְּנֵי הַנְּבִיאִים תְּנָה־נָּא לָהֶם כִּכַּר־כֶּסֶף וּשְׁתֵּי חֲלִפוֹת בְּגָדִים׃
    hebrewPlain: ויאמר שלום אדני שלחני לאמר הנה עתה זה באו אלי שני נערים מהר אפרים מבני הנביאים תנה נא להם ככר כסף ושתי חלפות בגדים
    kjvRefs:
    - 2 Kings 5:22
    kjvOsis:
    - 2Kgs.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.23
    scripture: tanakh
    name: Tanakh 2 Kings 5:23
    ref: 2 Kings 5:23
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 23
    ordinal: 9582
    text: 'And Naaman said: ‘Be content, take two talents.’ And he urged him, and bound two talents of silver in two bags, with two changes of raiment, and laid them upon two of his servants; and they bore them before him.'
    translation: JPS 1917
    original: וַיֹּאמֶר נַעֲמָן הוֹאֵל קַח כִּכָּרָיִם וַיִּפְרָץ־בּוֹ וַיָּצַר כִּכְּרַיִם כֶּסֶף בִּשְׁנֵי חֲרִטִים וּשְׁתֵּי חֲלִפוֹת בְּגָדִים וַיִּתֵּן אֶל־שְׁנֵי נְעָרָיו וַיִּשְׂאוּ לְפָנָיו׃
    hebrewPlain: ויאמר נעמן הואל קח ככרים ויפרץ בו ויצר ככרים כסף בשני חרטים ושתי חלפות בגדים ויתן אל שני נעריו וישאו לפניו
    kjvRefs:
    - 2 Kings 5:23
    kjvOsis:
    - 2Kgs.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.24
    scripture: tanakh
    name: Tanakh 2 Kings 5:24
    ref: 2 Kings 5:24
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 24
    ordinal: 9583
    text: And when he came to the hill, he took them from their hand, and deposited them in the house; and he let the men go, and they departed.
    translation: JPS 1917
    original: וַיָּבֹא אֶל־הָעֹפֶל וַיִּקַּח מִיָּדָם וַיִּפְקֹד בַּבָּיִת וַיְשַׁלַּח אֶת־הָאֲנָשִׁים וַיֵּלֵכוּ׃
    hebrewPlain: ויבא אל העפל ויקח מידם ויפקד בבית וישלח את האנשים וילכו
    kjvRefs:
    - 2 Kings 5:24
    kjvOsis:
    - 2Kgs.5.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.25
    scripture: tanakh
    name: Tanakh 2 Kings 5:25
    ref: 2 Kings 5:25
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 25
    ordinal: 9584
    text: 'But he went in, and stood before his master. And Elisha said unto him: ‘Whence comest thou, Gehazi?’ And he said: ‘Thy servant went no whither.’'
    translation: JPS 1917
    original: וְהוּא־בָא וַיַּעֲמֹד אֶל־אֲדֹנָיו וַיֹּאמֶר אֵלָיו אֱלִישָׁע מאן [מֵאַיִן] גֵּחֲזִי וַיֹּאמֶר לֹא־הָלַךְ עַבְדְּךָ אָנֶה וָאָנָה׃
    hebrewPlain: והוא בא ויעמד אל אדניו ויאמר אליו אלישע מאן [מאין] גחזי ויאמר לא הלך עבדך אנה ואנה
    kjvRefs:
    - 2 Kings 5:25
    kjvOsis:
    - 2Kgs.5.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.26
    scripture: tanakh
    name: Tanakh 2 Kings 5:26
    ref: 2 Kings 5:26
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 26
    ordinal: 9585
    text: 'And he said unto him: ‘Went not my heart [with thee], when the man turned back from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards and vineyards, and sheep and oxen, and men-servants and maid-servants?'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלָיו לֹא־לִבִּי הָלַךְ כַּאֲשֶׁר הָפַךְ־אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ הַעֵת לָקַחַת אֶת־הַכֶּסֶף וְלָקַחַת בְּגָדִים וְזֵיתִים וּכְרָמִים וְצֹאן וּבָקָר וַעֲבָדִים וּשְׁפָחוֹת׃
    hebrewPlain: ויאמר אליו לא לבי הלך כאשר הפך איש מעל מרכבתו לקראתך העת לקחת את הכסף ולקחת בגדים וזיתים וכרמים וצאן ובקר ועבדים ושפחות
    kjvRefs:
    - 2 Kings 5:26
    kjvOsis:
    - 2Kgs.5.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.5.27
    scripture: tanakh
    name: Tanakh 2 Kings 5:27
    ref: 2 Kings 5:27
    book: 2Kgs
    section: neviim
    chapter: 5
    verse: 27
    ordinal: 9586
    text: The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever.’ And he went out from his presence a leper as white as snow.
    translation: JPS 1917
    original: וְצָרַעַת נַעֲמָן תִּדְבַּק־בְּךָ וּבְזַרְעֲךָ לְעוֹלָם וַיֵּצֵא מִלְּפָנָיו מְצֹרָע כַּשָּׁלֶג׃
    hebrewPlain: וצרעת נעמן תדבק בך ובזרעך לעולם ויצא מלפניו מצרע כשלג
    kjvRefs:
    - 2 Kings 5:27
    kjvOsis:
    - 2Kgs.5.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.5
- type: TanakhVerse
  data:
    osis: 2Kgs.6.1
    scripture: tanakh
    name: Tanakh 2 Kings 6:1
    ref: 2 Kings 6:1
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 1
    ordinal: 9587
    text: 'And the sons of the prophets said unto Elisha: ‘Behold now, the place where we dwell before thee is too strait for us.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ בְנֵי־הַנְּבִיאִים אֶל־אֱלִישָׁע הִנֵּה־נָא הַמָּקוֹם אֲשֶׁר אֲנַחְנוּ יֹשְׁבִים שָׁם לְפָנֶיךָ צַר מִמֶּנּוּ׃
    hebrewPlain: ויאמרו בני הנביאים אל אלישע הנה נא המקום אשר אנחנו ישבים שם לפניך צר ממנו
    kjvRefs:
    - 2 Kings 6:1
    kjvOsis:
    - 2Kgs.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.2
    scripture: tanakh
    name: Tanakh 2 Kings 6:2
    ref: 2 Kings 6:2
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 2
    ordinal: 9588
    text: 'Let us go, we pray thee, unto the Jordan, and take thence every man a beam, and let us make us a place there, where we may dwell.’ And he answered: ‘Go ye.’'
    translation: JPS 1917
    original: נֵלְכָה־נָּא עַד־הַיַּרְדֵּן וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת וְנַעֲשֶׂה־לָּנוּ שָׁם מָקוֹם לָשֶׁבֶת שָׁם וַיֹּאמֶר לֵכוּ׃
    hebrewPlain: נלכה נא עד הירדן ונקחה משם איש קורה אחת ונעשה לנו שם מקום לשבת שם ויאמר לכו
    kjvRefs:
    - 2 Kings 6:2
    kjvOsis:
    - 2Kgs.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.3
    scripture: tanakh
    name: Tanakh 2 Kings 6:3
    ref: 2 Kings 6:3
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 3
    ordinal: 9589
    text: 'And one said: ‘Be content, I pray thee, and go with thy servants.’ And he answered: ‘I will go.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הָאֶחָד הוֹאֶל נָא וְלֵךְ אֶת־עֲבָדֶיךָ וַיֹּאמֶר אֲנִי אֵלֵךְ׃
    hebrewPlain: ויאמר האחד הואל נא ולך את עבדיך ויאמר אני אלך
    kjvRefs:
    - 2 Kings 6:3
    kjvOsis:
    - 2Kgs.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.4
    scripture: tanakh
    name: Tanakh 2 Kings 6:4
    ref: 2 Kings 6:4
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 4
    ordinal: 9590
    text: So he went with them. And when they came to the Jordan, they cut down wood.
    translation: JPS 1917
    original: וַיֵּלֶךְ אִתָּם וַיָּבֹאוּ הַיַּרְדֵּנָה וַיִּגְזְרוּ הָעֵצִים׃
    hebrewPlain: וילך אתם ויבאו הירדנה ויגזרו העצים
    kjvRefs:
    - 2 Kings 6:4
    kjvOsis:
    - 2Kgs.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.5
    scripture: tanakh
    name: Tanakh 2 Kings 6:5
    ref: 2 Kings 6:5
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 5
    ordinal: 9591
    text: 'But as one was felling a beam, the axe-head fell into the water; and he cried, and said: ‘Alas, my master! for it was borrowed.’'
    translation: JPS 1917
    original: וַיְהִי הָאֶחָד מַפִּיל הַקּוֹרָה וְאֶת־הַבַּרְזֶל נָפַל אֶל־הַמָּיִם וַיִּצְעַק וַיֹּאמֶר אֲהָהּ אֲדֹנִי וְהוּא שָׁאוּל׃
    hebrewPlain: ויהי האחד מפיל הקורה ואת הברזל נפל אל המים ויצעק ויאמר אהה אדני והוא שאול
    kjvRefs:
    - 2 Kings 6:5
    kjvOsis:
    - 2Kgs.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.6
    scripture: tanakh
    name: Tanakh 2 Kings 6:6
    ref: 2 Kings 6:6
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 6
    ordinal: 9592
    text: 'And the man of God said: ‘Where fell it?’ And he showed him the place. And he cut down a stick, and cast it in thither, and made the iron to swim.'
    translation: JPS 1917
    original: וַיֹּאמֶר אִישׁ־הָאֱלֹהִים אָנָה נָפָל וַיַּרְאֵהוּ אֶת־הַמָּקוֹם וַיִּקְצָב־עֵץ וַיַּשְׁלֶךְ־שָׁמָּה וַיָּצֶף הַבַּרְזֶל׃
    hebrewPlain: ויאמר איש האלהים אנה נפל ויראהו את המקום ויקצב עץ וישלך שמה ויצף הברזל
    kjvRefs:
    - 2 Kings 6:6
    kjvOsis:
    - 2Kgs.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.7
    scripture: tanakh
    name: Tanakh 2 Kings 6:7
    ref: 2 Kings 6:7
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 7
    ordinal: 9593
    text: 'And he said: ‘Take it up to thee.’ So he put out his hand, and took it.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָרֶם לָךְ וַיִּשְׁלַח יָדוֹ וַיִּקָּחֵהוּ׃
    hebrewPlain: ויאמר הרם לך וישלח ידו ויקחהו
    kjvRefs:
    - 2 Kings 6:7
    kjvOsis:
    - 2Kgs.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.8
    scripture: tanakh
    name: Tanakh 2 Kings 6:8
    ref: 2 Kings 6:8
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 8
    ordinal: 9594
    text: 'Now the king of Aram warred against Israel; and he took counsel with his servants, saying: ‘In such and such a place shall be my camp.’'
    translation: JPS 1917
    original: וּמֶלֶךְ אֲרָם הָיָה נִלְחָם בְּיִשְׂרָאֵל וַיִּוָּעַץ אֶל־עֲבָדָיו לֵאמֹר אֶל־מְקוֹם פְּלֹנִי אַלְמֹנִי תַּחֲנֹתִי׃
    hebrewPlain: ומלך ארם היה נלחם בישראל ויועץ אל עבדיו לאמר אל מקום פלני אלמני תחנתי
    kjvRefs:
    - 2 Kings 6:8
    kjvOsis:
    - 2Kgs.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.9
    scripture: tanakh
    name: Tanakh 2 Kings 6:9
    ref: 2 Kings 6:9
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 9
    ordinal: 9595
    text: 'And the man of God sent unto the king of Israel, saying: ‘Beware that thou pass not such a place; for thither the Arameans are coming down.’'
    translation: JPS 1917
    original: וַיִּשְׁלַח אִישׁ הָאֱלֹהִים אֶל־מֶלֶךְ יִשְׂרָאֵל לֵאמֹר הִשָּׁמֶר מֵעֲבֹר הַמָּקוֹם הַזֶּה כִּי־שָׁם אֲרָם נְחִתִּים׃
    hebrewPlain: וישלח איש האלהים אל מלך ישראל לאמר השמר מעבר המקום הזה כי שם ארם נחתים
    kjvRefs:
    - 2 Kings 6:9
    kjvOsis:
    - 2Kgs.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.10
    scripture: tanakh
    name: Tanakh 2 Kings 6:10
    ref: 2 Kings 6:10
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 10
    ordinal: 9596
    text: And the king of Israel sent to the place which the man of God told him and warned him of; and he guarded himself there, not once nor twice.
    translation: JPS 1917
    original: וַיִּשְׁלַח מֶלֶךְ יִשְׂרָאֵל אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ אִישׁ־הָאֱלֹהִים והזהירה [וְהִזְהִירוֹ] וְנִשְׁמַר שָׁם לֹא אַחַת וְלֹא שְׁתָּיִם׃
    hebrewPlain: וישלח מלך ישראל אל המקום אשר אמר לו איש האלהים והזהירה [והזהירו] ונשמר שם לא אחת ולא שתים
    kjvRefs:
    - 2 Kings 6:10
    kjvOsis:
    - 2Kgs.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.11
    scripture: tanakh
    name: Tanakh 2 Kings 6:11
    ref: 2 Kings 6:11
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 11
    ordinal: 9597
    text: 'And the heart of the king of Aram was sore troubled for this thing; and he called his servants, and said unto them: ‘Will ye not tell me which of us is for the king of Israel?’'
    translation: JPS 1917
    original: וַיִּסָּעֵר לֵב מֶלֶךְ־אֲרָם עַל־הַדָּבָר הַזֶּה וַיִּקְרָא אֶל־עֲבָדָיו וַיֹּאמֶר אֲלֵיהֶם הֲלוֹא תַּגִּידוּ לִי מִי מִשֶּׁלָּנוּ אֶל־מֶלֶךְ יִשְׂרָאֵל׃
    hebrewPlain: ויסער לב מלך ארם על הדבר הזה ויקרא אל עבדיו ויאמר אליהם הלוא תגידו לי מי משלנו אל מלך ישראל
    kjvRefs:
    - 2 Kings 6:11
    kjvOsis:
    - 2Kgs.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.12
    scripture: tanakh
    name: Tanakh 2 Kings 6:12
    ref: 2 Kings 6:12
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 12
    ordinal: 9598
    text: 'And one of his servants said: ‘Nay, my lord, O king; but Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bed-chamber.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אַחַד מֵעֲבָדָיו לוֹא אֲדֹנִי הַמֶּלֶךְ כִּי־אֱלִישָׁע הַנָּבִיא אֲשֶׁר בְּיִשְׂרָאֵל יַגִּיד לְמֶלֶךְ יִשְׂרָאֵל אֶת־הַדְּבָרִים אֲשֶׁר תְּדַבֵּר בַּחֲדַר מִשְׁכָּבֶךָ׃
    hebrewPlain: ויאמר אחד מעבדיו לוא אדני המלך כי אלישע הנביא אשר בישראל יגיד למלך ישראל את הדברים אשר תדבר בחדר משכבך
    kjvRefs:
    - 2 Kings 6:12
    kjvOsis:
    - 2Kgs.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.13
    scripture: tanakh
    name: Tanakh 2 Kings 6:13
    ref: 2 Kings 6:13
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 13
    ordinal: 9599
    text: 'And he said: ‘Go and see where he is, that I may send and fetch him.’ And it was told him, saying: ‘Behold, he is in Dothan.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לְכוּ וּרְאוּ אֵיכֹה הוּא וְאֶשְׁלַח וְאֶקָּחֵהוּ וַיֻּגַּד־לוֹ לֵאמֹר הִנֵּה בְדֹתָן׃
    hebrewPlain: ויאמר לכו וראו איכה הוא ואשלח ואקחהו ויגד לו לאמר הנה בדתן
    kjvRefs:
    - 2 Kings 6:13
    kjvOsis:
    - 2Kgs.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.14
    scripture: tanakh
    name: Tanakh 2 Kings 6:14
    ref: 2 Kings 6:14
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 14
    ordinal: 9600
    text: Therefore sent he thither horses, and chariots, and a great host; and they came by night, and compassed the city about.
    translation: JPS 1917
    original: וַיִּשְׁלַח־שָׁמָּה סוּסִים וְרֶכֶב וְחַיִל כָּבֵד וַיָּבֹאוּ לַיְלָה וַיַּקִּפוּ עַל־הָעִיר׃
    hebrewPlain: וישלח שמה סוסים ורכב וחיל כבד ויבאו לילה ויקפו על העיר
    kjvRefs:
    - 2 Kings 6:14
    kjvOsis:
    - 2Kgs.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.15
    scripture: tanakh
    name: Tanakh 2 Kings 6:15
    ref: 2 Kings 6:15
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 15
    ordinal: 9601
    text: 'And when the servant of the man of God was risen early, and gone forth, behold, a host with horses and chariots was round about the city. And his servant said unto him: ‘Alas, my master! how shall we do?’'
    translation: JPS 1917
    original: וַיַּשְׁכֵּם מְשָׁרֵת אִישׁ הָאֱלֹהִים לָקוּם וַיֵּצֵא וְהִנֵּה־חַיִל סוֹבֵב אֶת־הָעִיר וְסוּס וָרָכֶב וַיֹּאמֶר נַעֲרוֹ אֵלָיו אֲהָהּ אֲדֹנִי אֵיכָה נַעֲשֶׂה׃
    hebrewPlain: וישכם משרת איש האלהים לקום ויצא והנה חיל סובב את העיר וסוס ורכב ויאמר נערו אליו אהה אדני איכה נעשה
    kjvRefs:
    - 2 Kings 6:15
    kjvOsis:
    - 2Kgs.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.16
    scripture: tanakh
    name: Tanakh 2 Kings 6:16
    ref: 2 Kings 6:16
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 16
    ordinal: 9602
    text: 'And he answered: ‘Fear not: for they that are with us are more than they that are with them.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אַל־תִּירָא כִּי רַבִּים אֲשֶׁר אִתָּנוּ מֵאֲשֶׁר אוֹתָם׃
    hebrewPlain: ויאמר אל תירא כי רבים אשר אתנו מאשר אותם
    kjvRefs:
    - 2 Kings 6:16
    kjvOsis:
    - 2Kgs.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.17
    scripture: tanakh
    name: Tanakh 2 Kings 6:17
    ref: 2 Kings 6:17
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 17
    ordinal: 9603
    text: 'And Elisha prayed, and said: ‘LORD, I pray Thee, open his eyes, that he may see.’ And the LORD opened the eyes of the young man; and he saw; and, behold, the mountain was full of horses and chariots of fire round about Elisha.'
    translation: JPS 1917
    original: וַיִּתְפַּלֵּל אֱלִישָׁע וַיֹּאמַר יְהוָה פְּקַח־נָא אֶת־עֵינָיו וְיִרְאֶה וַיִּפְקַח יְהוָה אֶת־עֵינֵי הַנַּעַר וַיַּרְא וְהִנֵּה הָהָר מָלֵא סוּסִים וְרֶכֶב אֵשׁ סְבִיבֹת אֱלִישָׁע׃
    hebrewPlain: ויתפלל אלישע ויאמר יהוה פקח נא את עיניו ויראה ויפקח יהוה את עיני הנער וירא והנה ההר מלא סוסים ורכב אש סביבת אלישע
    kjvRefs:
    - 2 Kings 6:17
    kjvOsis:
    - 2Kgs.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.18
    scripture: tanakh
    name: Tanakh 2 Kings 6:18
    ref: 2 Kings 6:18
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 18
    ordinal: 9604
    text: 'And when they came down to him, Elisha prayed unto the LORD, and said: ‘Smite this people, I pray Thee, with blindness.’ And He smote them with blindness according to the word of Elisha.'
    translation: JPS 1917
    original: וַיֵּרְדוּ אֵלָיו וַיִּתְפַּלֵּל אֱלִישָׁע אֶל־יְהוָה וַיֹּאמַר הַךְ־נָא אֶת־הַגּוֹי־הַזֶּה בַּסַּנְוֵרִים וַיַּכֵּם בַּסַּנְוֵרִים כִּדְבַר אֱלִישָׁע׃
    hebrewPlain: וירדו אליו ויתפלל אלישע אל יהוה ויאמר הך נא את הגוי הזה בסנורים ויכם בסנורים כדבר אלישע
    kjvRefs:
    - 2 Kings 6:18
    kjvOsis:
    - 2Kgs.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.19
    scripture: tanakh
    name: Tanakh 2 Kings 6:19
    ref: 2 Kings 6:19
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 19
    ordinal: 9605
    text: 'And Elisha said unto them: ‘This is not the way, neither is this the city; follow me, and I will bring you to the man whom ye seek.’ And he led them to Samaria.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֲלֵהֶם אֱלִישָׁע לֹא זֶה הַדֶּרֶךְ וְלֹא זֹה הָעִיר לְכוּ אַחֲרַי וְאוֹלִיכָה אֶתְכֶם אֶל־הָאִישׁ אֲשֶׁר תְּבַקֵּשׁוּן וַיֹּלֶךְ אוֹתָם שֹׁמְרוֹנָה׃
    hebrewPlain: ויאמר אלהם אלישע לא זה הדרך ולא זה העיר לכו אחרי ואוליכה אתכם אל האיש אשר תבקשון וילך אותם שמרונה
    kjvRefs:
    - 2 Kings 6:19
    kjvOsis:
    - 2Kgs.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.20
    scripture: tanakh
    name: Tanakh 2 Kings 6:20
    ref: 2 Kings 6:20
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 20
    ordinal: 9606
    text: 'And it came to pass, when they were come into Samaria, that Elisha said: ‘LORD, open the eyes of these men, that they may see.’ And the LORD opened their eyes, and they saw; and, behold, they were in the midst of Samaria.'
    translation: JPS 1917
    original: וַיְהִי כְּבֹאָם שֹׁמְרוֹן וַיֹּאמֶר אֱלִישָׁע יְהוָה פְּקַח אֶת־עֵינֵי־אֵלֶּה וְיִרְאוּ וַיִּפְקַח יְהוָה אֶת־עֵינֵיהֶם וַיִּרְאוּ וְהִנֵּה בְּתוֹךְ שֹׁמְרוֹן׃
    hebrewPlain: ויהי כבאם שמרון ויאמר אלישע יהוה פקח את עיני אלה ויראו ויפקח יהוה את עיניהם ויראו והנה בתוך שמרון
    kjvRefs:
    - 2 Kings 6:20
    kjvOsis:
    - 2Kgs.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.21
    scripture: tanakh
    name: Tanakh 2 Kings 6:21
    ref: 2 Kings 6:21
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 21
    ordinal: 9607
    text: 'And the king of Israel said unto Elisha, when he saw them: ‘My father, shall I smite them? shall I smite them?’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ־יִשְׂרָאֵל אֶל־אֱלִישָׁע כִּרְאֹתוֹ אוֹתָם הַאַכֶּה אַכֶּה אָבִי׃
    hebrewPlain: ויאמר מלך ישראל אל אלישע כראתו אותם האכה אכה אבי
    kjvRefs:
    - 2 Kings 6:21
    kjvOsis:
    - 2Kgs.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.22
    scripture: tanakh
    name: Tanakh 2 Kings 6:22
    ref: 2 Kings 6:22
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 22
    ordinal: 9608
    text: 'And he answered: ‘Thou shalt not smite them; hast thou taken captive with thy sword and with thy bow those whom thou wouldest smite? set bread and water before them, that they may eat and drink, and go to their master.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לֹא תַכֶּה הַאֲשֶׁר שָׁבִיתָ בְּחַרְבְּךָ וּבְקַשְׁתְּךָ אַתָּה מַכֶּה שִׂים לֶחֶם וָמַיִם לִפְנֵיהֶם וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ אֶל־אֲדֹנֵיהֶם׃
    hebrewPlain: ויאמר לא תכה האשר שבית בחרבך ובקשתך אתה מכה שים לחם ומים לפניהם ויאכלו וישתו וילכו אל אדניהם
    kjvRefs:
    - 2 Kings 6:22
    kjvOsis:
    - 2Kgs.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.23
    scripture: tanakh
    name: Tanakh 2 Kings 6:23
    ref: 2 Kings 6:23
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 23
    ordinal: 9609
    text: And he prepared great provision for them; and when they had eaten and drunk, he sent them away, and they went to their master. And the bands of Aram came no more into the land of Israel.
    translation: JPS 1917
    original: וַיִּכְרֶה לָהֶם כֵּרָה גְדוֹלָה וַיֹּאכְלוּ וַיִּשְׁתּוּ וַיְשַׁלְּחֵם וַיֵּלְכוּ אֶל־אֲדֹנֵיהֶם וְלֹא־יָסְפוּ עוֹד גְּדוּדֵי אֲרָם לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל׃
    hebrewPlain: ויכרה להם כרה גדולה ויאכלו וישתו וישלחם וילכו אל אדניהם ולא יספו עוד גדודי ארם לבוא בארץ ישראל
    kjvRefs:
    - 2 Kings 6:23
    kjvOsis:
    - 2Kgs.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.6
- type: TanakhVerse
  data:
    osis: 2Kgs.6.24
    scripture: tanakh
    name: Tanakh 2 Kings 6:24
    ref: 2 Kings 6:24
    book: 2Kgs
    section: neviim
    chapter: 6
    verse: 24
    ordinal: 9610
    text: And it came to pass after this, that Ben-hadad king of Aram gathered all his host, and went up, and besieged Samaria.
    translation: JPS 1917
    original: וַיְהִי אַחֲרֵי־כֵן וַיִּקְבֹּץ בֶּן־הֲדַד מֶלֶךְ־אֲרָם אֶת־כָּל־מַחֲנֵהוּ וַיַּעַל וַיָּצַר עַל־שֹׁמְרוֹן׃
    hebrewPlain: ויהי אחרי כן ויקבץ בן הדד מלך ארם את כל מחנהו ויעל ויצר על שמרון
    kjvRefs:
    - 2 Kings 6:24
    kjvOsis:
