- type: TanakhVerse
  data:
    osis: 2Kgs.17.37
    scripture: tanakh
    name: Tanakh 2 Kings 17:37
    ref: 2 Kings 17:37
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 37
    ordinal: 9932
    text: and the statutes and the ordinances, and the law and the commandment, which He wrote for you, ye shall observe to do for evermore; and ye shall not fear other gods;
    translation: JPS 1917
    original: וְאֶת־הַחֻקִּים וְאֶת־הַמִּשְׁפָּטִים וְהַתּוֹרָה וְהַמִּצְוָה אֲשֶׁר כָּתַב לָכֶם תִּשְׁמְרוּן לַעֲשׂוֹת כָּל־הַיָּמִים וְלֹא תִירְאוּ אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: ואת החקים ואת המשפטים והתורה והמצוה אשר כתב לכם תשמרון לעשות כל הימים ולא תיראו אלהים אחרים
    kjvRefs:
    - 2 Kings 17:37
    kjvOsis:
    - 2Kgs.17.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.17
- type: TanakhVerse
  data:
    osis: 2Kgs.17.38
    scripture: tanakh
    name: Tanakh 2 Kings 17:38
    ref: 2 Kings 17:38
    book: 2Kgs
    section: neviim
    chapter: 17
    verse: 38
    ordinal: 9933
    text: and the covenant that I have made with you ye shall not forget; neither shall ye fear other gods;
    translation: JPS 1917
    original: וְהַבְּרִית אֲשֶׁר־כָּרַתִּי אִתְּכֶם לֹא תִשְׁכָּחוּ וְלֹא תִירְאוּ אֱלֹהִים אֲחֵרִים׃
    hebrewPlain: והברית אשר כרתי אתכם לא תשכחו ולא תיראו אלהים אחרים
    kjvRefs:
    - 2 Kings 17:38
    kjvOsis:
    - 2Kgs.17.38
  relations:
