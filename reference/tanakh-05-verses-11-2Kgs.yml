  data:
    osis: 2Kgs.14.27
    scripture: tanakh
    name: Tanakh 2 Kings 14:27
    ref: 2 Kings 14:27
    book: 2Kgs
    section: neviim
    chapter: 14
    verse: 27
    ordinal: 9835
    text: And the LORD said not that He would blot out the name of Israel from under heaven; but He saved them by the hand of Jeroboam the son of Joash.
    translation: JPS 1917
    original: וְלֹא־דִבֶּר יְהוָה לִמְחוֹת אֶת־שֵׁם יִשְׂרָאֵל מִתַּחַת הַשָּׁמָיִם וַיּוֹשִׁיעֵם בְּיַד יָרָבְעָם בֶּן־יוֹאָשׁ׃
    hebrewPlain: ולא דבר יהוה למחות את שם ישראל מתחת השמים ויושיעם ביד ירבעם בן יואש
    kjvRefs:
    - 2 Kings 14:27
    kjvOsis:
    - 2Kgs.14.27
  relations:
  - predicate: IN
