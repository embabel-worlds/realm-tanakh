    name: Tanakh 2 Kings 13:2
    ref: 2 Kings 13:2
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 2
    ordinal: 9785
    text: And he did that which was evil in the sight of the LORD, and followed the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin; he departed not therefrom.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה וַיֵּלֶךְ אַחַר חַטֹּאת יָרָבְעָם בֶּן־נְבָט אֲשֶׁר־הֶחֱטִיא אֶת־יִשְׂרָאֵל לֹא־סָר מִמֶּנָּה׃
    hebrewPlain: ויעש הרע בעיני יהוה וילך אחר חטאת ירבעם בן נבט אשר החטיא את ישראל לא סר ממנה
    kjvRefs:
