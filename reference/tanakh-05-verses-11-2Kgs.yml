    ref: 2 Kings 12:1
    book: 2Kgs
    section: neviim
    chapter: 12
    verse: 1
    ordinal: 9762
    text: Jehoash was seven years old when he began to reign.
    translation: JPS 1917
    original: בֶּן־שֶׁבַע שָׁנִים יְהוֹאָשׁ בְּמָלְכוֹ׃
    hebrewPlain: בן שבע שנים יהואש במלכו
    kjvRefs:
    - 2 Kings 11:21
    kjvOsis:
    - 2Kgs.11.21
  relations:
  - predicate: IN
    to:
