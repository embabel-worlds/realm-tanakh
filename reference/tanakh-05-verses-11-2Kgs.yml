  data:
    osis: 2Kgs.22.1
    scripture: tanakh
    name: Tanakh 2 Kings 22:1
    ref: 2 Kings 22:1
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 1
    ordinal: 10058
    text: Josiah was eight years old when he began to reign; and he reigned thirty and one years in Jerusalem; and his mother’s name was Jedidah the daughter of Adaiah of Bozkath.
    translation: JPS 1917
    original: בֶּן־שְׁמֹנֶה שָׁנָה יֹאשִׁיָּהוּ בְמָלְכוֹ וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יְדִידָה בַת־עֲדָיָה מִבָּצְקַת׃
    hebrewPlain: בן שמנה שנה יאשיהו במלכו ושלשים ואחת שנה מלך בירושלם ושם אמו ידידה בת עדיה מבצקת
