  data:
    osis: 2Kgs.4.19
    scripture: tanakh
    name: Tanakh 2 Kings 4:19
    ref: 2 Kings 4:19
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 19
    ordinal: 9534
    text: 'And he said unto his father: ‘My head, my head.’ And he said to his servant: ‘Carry him to his mother.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־אָבִיו רֹאשִׁי רֹאשִׁי וַיֹּאמֶר אֶל־הַנַּעַר שָׂאֵהוּ אֶל־אִמּוֹ׃
    hebrewPlain: ויאמר אל אביו ראשי ראשי ויאמר אל הנער שאהו אל אמו
    kjvRefs:
    - 2 Kings 4:19
    kjvOsis:
    - 2Kgs.4.19
