- type: TanakhVerse
  data:
    osis: 2Kgs.11.12
    scripture: tanakh
    name: Tanakh 2 Kings 11:12
    ref: 2 Kings 11:12
    book: 2Kgs
    section: neviim
    chapter: 11
    verse: 12
    ordinal: 9753
    text: 'Then he brought out the king’s son, and put upon him the crown and the insignia; and they made him king, and anointed him; and they clapped their hands, and said: ‘Long live the king.’'
    translation: JPS 1917
    original: וַיּוֹצִא אֶת־בֶּן־הַמֶּלֶךְ וַיִּתֵּן עָלָיו אֶת־הַנֵּזֶר וְאֶת־הָעֵדוּת וַיַּמְלִכוּ אֹתוֹ וַיִּמְשָׁחֻהוּ וַיַּכּוּ־כָף וַיֹּאמְרוּ יְחִי הַמֶּלֶךְ׃
    hebrewPlain: ויוצא את בן המלך ויתן עליו את הנזר ואת העדות וימלכו אתו וימשחהו ויכו כף ויאמרו יחי המלך
    kjvRefs:
    - 2 Kings 11:12
    kjvOsis:
    - 2Kgs.11.12
