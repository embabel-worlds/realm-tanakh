    scripture: tanakh
    name: Tanakh 2 Kings 22:5
    ref: 2 Kings 22:5
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 5
    ordinal: 10062
    text: and let them deliver it into the hand of the workmen that have the oversight of the house of the LORD; and let them give it to the workmen that are in the house of the LORD, to repair the breaches of the house;
    translation: JPS 1917
    original: ויתנה [וְיִתְּנֻהוּ] עַל־יַד עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים בבית [בֵּית] יְהוָה וְיִתְּנוּ אֹתוֹ לְעֹשֵׂי הַמְּלָאכָה אֲשֶׁר בְּבֵית יְהוָה לְחַזֵּק בֶּדֶק הַבָּיִת׃
    hebrewPlain: ויתנה [ויתנהו] על יד עשי המלאכה המפקדים בבית [בית] יהוה ויתנו אתו לעשי המלאכה אשר בבית יהוה לחזק בדק הבית
    kjvRefs:
    - 2 Kings 22:5
    kjvOsis:
    - 2Kgs.22.5
