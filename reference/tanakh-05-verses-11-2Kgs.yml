    name: Tanakh 2 Kings 22:7
    ref: 2 Kings 22:7
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 7
    ordinal: 10064
    text: Howbeit there was no reckoning made with them of the money that was delivered into their hand; for they dealt faithfully.
    translation: JPS 1917
    original: אַךְ לֹא־יֵחָשֵׁב אִתָּם הַכֶּסֶף הַנִּתָּן עַל־יָדָם כִּי בֶאֱמוּנָה הֵם עֹשִׂים׃
    hebrewPlain: אך לא יחשב אתם הכסף הנתן על ידם כי באמונה הם עשים
    kjvRefs:
    - 2 Kings 22:7
    kjvOsis:
    - 2Kgs.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
