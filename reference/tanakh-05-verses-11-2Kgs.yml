    osis: 2Kgs.1.16
    scripture: tanakh
    name: Tanakh 2 Kings 1:16
    ref: 2 Kings 1:16
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 16
    ordinal: 9461
    text: 'And he said unto him: ‘Thus saith the LORD: Forasmuch as thou hast sent messengers to inquire of Baal-zebub the god of Ekron, is it because there is no God in Israel to inquire of His word? therefore thou shalt not come down from the bed whether thou art gone up, but shalt surely die.’'
    translation: JPS 1917
    original: וַיְדַבֵּר אֵלָיו כֹּה־אָמַר יְהוָה יַעַן אֲשֶׁר־שָׁלַחְתָּ מַלְאָכִים לִדְרֹשׁ בְּבַעַל זְבוּב אֱלֹהֵי עֶקְרוֹן הַמִבְּלִי אֵין־אֱלֹהִים בְּיִשְׂרָאֵל לִדְרֹשׁ בִּדְבָרוֹ לָכֵן הַמִּטָּה אֲשֶׁר־עָלִיתָ שָּׁם לֹא־תֵרֵד מִמֶּנָּה כִּי־מוֹת תָּמוּת׃
    hebrewPlain: וידבר אליו כה אמר יהוה יען אשר שלחת מלאכים לדרש בבעל זבוב אלהי עקרון המבלי אין אלהים בישראל לדרש בדברו לכן המטה אשר עלית שם לא תרד ממנה כי מות תמות
    kjvRefs:
    - 2 Kings 1:16
    kjvOsis:
    - 2Kgs.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
- type: TanakhVerse
  data:
    osis: 2Kgs.1.17
    scripture: tanakh
    name: Tanakh 2 Kings 1:17
    ref: 2 Kings 1:17
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 17
    ordinal: 9462
    text: So he died according to the word of the LORD which Elijah had spoken. And Jehoram began to reign in his stead in the second year of Jehoram the son of Jehoshaphat king of Judah; because he had no son.
    translation: JPS 1917
    original: וַיָּמָת כִּדְבַר יְהוָה אֲשֶׁר־דִּבֶּר אֵלִיָּהוּ וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם בֶּן־יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה כִּי לֹא־הָיָה לוֹ בֵּן׃
    hebrewPlain: וימת כדבר יהוה אשר דבר אליהו וימלך יהורם תחתיו בשנת שתים ליהורם בן יהושפט מלך יהודה כי לא היה לו בן
    kjvRefs:
    - 2 Kings 1:17
    kjvOsis:
    - 2Kgs.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
- type: TanakhVerse
  data:
    osis: 2Kgs.1.18
    scripture: tanakh
    name: Tanakh 2 Kings 1:18
    ref: 2 Kings 1:18
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 18
    ordinal: 9463
    text: Now the rest of the acts of Ahaziah which he did, are they not written in the book of the chronicles of the kings of Israel?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי אֲחַזְיָהוּ אֲשֶׁר עָשָׂה הֲלוֹא־הֵמָּה כְתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל׃
    hebrewPlain: ויתר דברי אחזיהו אשר עשה הלוא המה כתובים על ספר דברי הימים למלכי ישראל
    kjvRefs:
    - 2 Kings 1:18
    kjvOsis:
    - 2Kgs.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
- type: TanakhVerse
  data:
    osis: 2Kgs.2.1
    scripture: tanakh
    name: Tanakh 2 Kings 2:1
    ref: 2 Kings 2:1
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 9464
    text: And it came to pass, when the LORD would take up Elijah by a whirlwind into heaven, that Elijah went with Elisha from Gilgal.
    translation: JPS 1917
    original: וַיְהִי בְּהַעֲלוֹת יְהוָה אֶת־אֵלִיָּהוּ בַּסְעָרָה הַשָּׁמָיִם וַיֵּלֶךְ אֵלִיָּהוּ וֶאֱלִישָׁע מִן־הַגִּלְגָּל׃
    hebrewPlain: ויהי בהעלות יהוה את אליהו בסערה השמים וילך אליהו ואלישע מן הגלגל
    kjvRefs:
    - 2 Kings 2:1
    kjvOsis:
    - 2Kgs.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.2
    scripture: tanakh
    name: Tanakh 2 Kings 2:2
    ref: 2 Kings 2:2
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 9465
    text: 'And Elijah said unto Elisha: ‘Tarry here, I pray thee; for the LORD hath sent me as far as Beth-el.’ And Elisha said: ‘As the LORD liveth, and as thy soul liveth, I will not leave thee.’ So they went down to Beth-el.—'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלִיָּהוּ אֶל־אֱלִישָׁע שֵׁב־נָא פֹה כִּי יְהוָה שְׁלָחַנִי עַד־בֵּית־אֵל וַיֹּאמֶר אֱלִישָׁע חַי־יְהוָה וְחֵי־נַפְשְׁךָ אִם־אֶעֶזְבֶךָּ וַיֵּרְדוּ בֵּית־אֵל׃
    hebrewPlain: ויאמר אליהו אל אלישע שב נא פה כי יהוה שלחני עד בית אל ויאמר אלישע חי יהוה וחי נפשך אם אעזבך וירדו בית אל
    kjvRefs:
    - 2 Kings 2:2
    kjvOsis:
    - 2Kgs.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.3
    scripture: tanakh
    name: Tanakh 2 Kings 2:3
    ref: 2 Kings 2:3
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 9466
    text: 'And the sons of the prophets that were at Beth-el came forth to Elisha, and said unto him: ‘Knowest thou that the LORD will take away thy master from thy head to-day?’ And he said: ‘Yea, I know it; hold ye your peace.’—'
    translation: JPS 1917
    original: וַיֵּצְאוּ בְנֵי־הַנְּבִיאִים אֲשֶׁר־בֵּית־אֵל אֶל־אֱלִישָׁע וַיֹּאמְרוּ אֵלָיו הֲיָדַעְתָּ כִּי הַיּוֹם יְהוָה לֹקֵחַ אֶת־אֲדֹנֶיךָ מֵעַל רֹאשֶׁךָ וַיֹּאמֶר גַּם־אֲנִי יָדַעְתִּי הֶחֱשׁוּ׃
    hebrewPlain: ויצאו בני הנביאים אשר בית אל אל אלישע ויאמרו אליו הידעת כי היום יהוה לקח את אדניך מעל ראשך ויאמר גם אני ידעתי החשו
    kjvRefs:
    - 2 Kings 2:3
    kjvOsis:
    - 2Kgs.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.4
    scripture: tanakh
    name: Tanakh 2 Kings 2:4
    ref: 2 Kings 2:4
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 9467
    text: 'And Elijah said unto him: ‘Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho.’ And he said: ‘As the LORD liveth, and as thy soul liveth, I will not leave thee.’ So they came to Jericho.—'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ אֵלִיָּהוּ אֱלִישָׁע שֵׁב־נָא פֹה כִּי יְהוָה שְׁלָחַנִי יְרִיחוֹ וַיֹּאמֶר חַי־יְהוָה וְחֵי־נַפְשְׁךָ אִם־אֶעֶזְבֶךָּ וַיָּבֹאוּ יְרִיחוֹ׃
    hebrewPlain: ויאמר לו אליהו אלישע שב נא פה כי יהוה שלחני יריחו ויאמר חי יהוה וחי נפשך אם אעזבך ויבאו יריחו
    kjvRefs:
    - 2 Kings 2:4
    kjvOsis:
    - 2Kgs.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.5
    scripture: tanakh
    name: Tanakh 2 Kings 2:5
    ref: 2 Kings 2:5
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 9468
    text: 'And the sons of the prophets that were at Jericho came near to Elisha, and said unto him: ‘Knowest thou that the LORD will take away thy master from thy head to-day?’ And he answered: ‘Yea, I know it; hold ye your peace.’—'
    translation: JPS 1917
    original: וַיִּגְּשׁוּ בְנֵי־הַנְּבִיאִים אֲשֶׁר־בִּירִיחוֹ אֶל־אֱלִישָׁע וַיֹּאמְרוּ אֵלָיו הֲיָדַעְתָּ כִּי הַיּוֹם יְהוָה לֹקֵחַ אֶת־אֲדֹנֶיךָ מֵעַל רֹאשֶׁךָ וַיֹּאמֶר גַּם־אֲנִי יָדַעְתִּי הֶחֱשׁוּ׃
    hebrewPlain: ויגשו בני הנביאים אשר ביריחו אל אלישע ויאמרו אליו הידעת כי היום יהוה לקח את אדניך מעל ראשך ויאמר גם אני ידעתי החשו
    kjvRefs:
    - 2 Kings 2:5
    kjvOsis:
    - 2Kgs.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.6
    scripture: tanakh
    name: Tanakh 2 Kings 2:6
    ref: 2 Kings 2:6
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 9469
    text: 'And Elijah said unto him: ‘Tarry here, I pray thee; for the LORD hath sent me to the Jordan.’ And he said: ‘As the LORD liveth, and as thy soul liveth, I will not leave thee.’ And they two went on.'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ אֵלִיָּהוּ שֵׁב־נָא פֹה כִּי יְהוָה שְׁלָחַנִי הַיַּרְדֵּנָה וַיֹּאמֶר חַי־יְהוָה וְחֵי־נַפְשְׁךָ אִם־אֶעֶזְבֶךָּ וַיֵּלְכוּ שְׁנֵיהֶם׃
    hebrewPlain: ויאמר לו אליהו שב נא פה כי יהוה שלחני הירדנה ויאמר חי יהוה וחי נפשך אם אעזבך וילכו שניהם
    kjvRefs:
    - 2 Kings 2:6
    kjvOsis:
    - 2Kgs.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.7
    scripture: tanakh
    name: Tanakh 2 Kings 2:7
    ref: 2 Kings 2:7
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 9470
    text: And fifty men of the sons of the prophets went, and stood over against them afar off; and they two stood by the Jordan.
    translation: JPS 1917
    original: וַחֲמִשִּׁים אִישׁ מִבְּנֵי הַנְּבִיאִים הָלְכוּ וַיַּעַמְדוּ מִנֶּגֶד מֵרָחוֹק וּשְׁנֵיהֶם עָמְדוּ עַל־הַיַּרְדֵּן׃
    hebrewPlain: וחמשים איש מבני הנביאים הלכו ויעמדו מנגד מרחוק ושניהם עמדו על הירדן
    kjvRefs:
    - 2 Kings 2:7
    kjvOsis:
    - 2Kgs.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.8
    scripture: tanakh
    name: Tanakh 2 Kings 2:8
    ref: 2 Kings 2:8
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 9471
    text: And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither, so that they two went over on dry ground.
    translation: JPS 1917
    original: וַיִּקַּח אֵלִיָּהוּ אֶת־אַדַּרְתּוֹ וַיִּגְלֹם וַיַּכֶּה אֶת־הַמַּיִם וַיֵּחָצוּ הֵנָּה וָהֵנָּה וַיַּעַבְרוּ שְׁנֵיהֶם בֶּחָרָבָה׃
    hebrewPlain: ויקח אליהו את אדרתו ויגלם ויכה את המים ויחצו הנה והנה ויעברו שניהם בחרבה
    kjvRefs:
    - 2 Kings 2:8
    kjvOsis:
    - 2Kgs.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.9
    scripture: tanakh
    name: Tanakh 2 Kings 2:9
    ref: 2 Kings 2:9
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 9472
    text: 'And it came to pass, when they were gone over, that Elijah said unto Elisha: ‘Ask what I shall do for thee, before I am taken from thee.’ And Elisha said: ‘I pray thee, let a double portion of thy spirit be upon me.’'
    translation: JPS 1917
    original: וַיְהִי כְעָבְרָם וְאֵלִיָּהוּ אָמַר אֶל־אֱלִישָׁע שְׁאַל מָה אֶעֱשֶׂה־לָּךְ בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ וַיֹּאמֶר אֱלִישָׁע וִיהִי־נָא פִּי־שְׁנַיִם בְּרוּחֲךָ אֵלָי׃
    hebrewPlain: ויהי כעברם ואליהו אמר אל אלישע שאל מה אעשה לך בטרם אלקח מעמך ויאמר אלישע ויהי נא פי שנים ברוחך אלי
    kjvRefs:
    - 2 Kings 2:9
    kjvOsis:
    - 2Kgs.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.10
    scripture: tanakh
    name: Tanakh 2 Kings 2:10
    ref: 2 Kings 2:10
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 9473
    text: 'And he said: ‘Thou hast asked a hard thing; nevertheless, if thou see me when I am taken from thee, it shall be so unto thee; but if not, it shall not be so.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הִקְשִׁיתָ לִשְׁאוֹל אִם־תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ יְהִי־לְךָ כֵן וְאִם־אַיִן לֹא יִהְיֶה׃
    hebrewPlain: ויאמר הקשית לשאול אם תראה אתי לקח מאתך יהי לך כן ואם אין לא יהיה
    kjvRefs:
    - 2 Kings 2:10
    kjvOsis:
    - 2Kgs.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.11
    scripture: tanakh
    name: Tanakh 2 Kings 2:11
    ref: 2 Kings 2:11
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 9474
    text: And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, which parted them both assunder; and Elijah went up by a whirlwind into heaven.
    translation: JPS 1917
    original: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר וְהִנֵּה רֶכֶב־אֵשׁ וְסוּסֵי אֵשׁ וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם וַיַּעַל אֵלִיָּהוּ בַּסְעָרָה הַשָּׁמָיִם׃
    hebrewPlain: ויהי המה הלכים הלוך ודבר והנה רכב אש וסוסי אש ויפרדו בין שניהם ויעל אליהו בסערה השמים
    kjvRefs:
    - 2 Kings 2:11
    kjvOsis:
    - 2Kgs.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.12
    scripture: tanakh
    name: Tanakh 2 Kings 2:12
    ref: 2 Kings 2:12
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 9475
    text: 'And Elisha saw it, and he cried: ‘My father, my father, the chariots of Israel and the horsemen thereof! ’ And he saw him no more; and he took hold of his own clothes, and rent them in two pieces.'
    translation: JPS 1917
    original: וֶאֱלִישָׁע רֹאֶה וְהוּא מְצַעֵק אָבִי אָבִי רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו וְלֹא רָאָהוּ עוֹד וַיַּחֲזֵק בִּבְגָדָיו וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים׃
    hebrewPlain: ואלישע ראה והוא מצעק אבי אבי רכב ישראל ופרשיו ולא ראהו עוד ויחזק בבגדיו ויקרעם לשנים קרעים
    kjvRefs:
    - 2 Kings 2:12
    kjvOsis:
    - 2Kgs.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.13
    scripture: tanakh
    name: Tanakh 2 Kings 2:13
    ref: 2 Kings 2:13
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 9476
    text: He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of the Jordan.
    translation: JPS 1917
    original: וַיָּרֶם אֶת־אַדֶּרֶת אֵלִיָּהוּ אֲשֶׁר נָפְלָה מֵעָלָיו וַיָּשָׁב וַיַּעֲמֹד עַל־שְׂפַת הַיַּרְדֵּן׃
    hebrewPlain: וירם את אדרת אליהו אשר נפלה מעליו וישב ויעמד על שפת הירדן
    kjvRefs:
    - 2 Kings 2:13
    kjvOsis:
    - 2Kgs.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.14
    scripture: tanakh
    name: Tanakh 2 Kings 2:14
    ref: 2 Kings 2:14
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 9477
    text: 'And he took the mantle of Elijah that fell from him, and smote the waters, and said: ‘Where is the LORD, the God of Elijah?’ and when he also had smitten the waters, they were divided hither and thither; and Elisha went over.'
    translation: JPS 1917
    original: וַיִּקַּח אֶת־אַדֶּרֶת אֵלִיָּהוּ אֲשֶׁר־נָפְלָה מֵעָלָיו וַיַּכֶּה אֶת־הַמַּיִם וַיֹּאמַר אַיֵּה יְהוָה אֱלֹהֵי אֵלִיָּהוּ אַף־הוּא וַיַּכֶּה אֶת־הַמַּיִם וַיֵּחָצוּ הֵנָּה וָהֵנָּה וַיַּעֲבֹר אֱלִישָׁע׃
    hebrewPlain: ויקח את אדרת אליהו אשר נפלה מעליו ויכה את המים ויאמר איה יהוה אלהי אליהו אף הוא ויכה את המים ויחצו הנה והנה ויעבר אלישע
    kjvRefs:
    - 2 Kings 2:14
    kjvOsis:
    - 2Kgs.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.15
    scripture: tanakh
    name: Tanakh 2 Kings 2:15
    ref: 2 Kings 2:15
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 9478
    text: 'And when the sons of the prophets that were at Jericho some way off saw him, they said: ‘The spirit of Elijah doth rest on Elisha.’ And they came to meet him, and bowed down to the ground before him.'
    translation: JPS 1917
    original: וַיִּרְאֻהוּ בְנֵי־הַנְּבִיאִים אֲשֶׁר־בִּירִיחוֹ מִנֶּגֶד וַיֹּאמְרוּ נָחָה רוּחַ אֵלִיָּהוּ עַל־אֱלִישָׁע וַיָּבֹאוּ לִקְרָאתוֹ וַיִּשְׁתַּחֲווּ־לוֹ אָרְצָה׃
    hebrewPlain: ויראהו בני הנביאים אשר ביריחו מנגד ויאמרו נחה רוח אליהו על אלישע ויבאו לקראתו וישתחוו לו ארצה
    kjvRefs:
    - 2 Kings 2:15
    kjvOsis:
    - 2Kgs.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.16
    scripture: tanakh
    name: Tanakh 2 Kings 2:16
    ref: 2 Kings 2:16
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 9479
    text: 'And they said unto him: ‘Behold now, there are with thy servants fifty strong men; let them go, we pray thee, and seek thy master; lest peradventure the spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley.’ And he said: ‘Ye shall not send.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו הִנֵּה־נָא יֵשׁ־אֶת־עֲבָדֶיךָ חֲמִשִּׁים אֲנָשִׁים בְּנֵי־חַיִל יֵלְכוּ נָא וִיבַקְשׁוּ אֶת־אֲדֹנֶיךָ פֶּן־נְשָׂאוֹ רוּחַ יְהוָה וַיַּשְׁלִכֵהוּ בְּאַחַד הֶהָרִים אוֹ בְּאַחַת הגיאות [הַגֵּאָיוֹת] וַיֹּאמֶר לֹא תִשְׁלָחוּ׃
    hebrewPlain: ויאמרו אליו הנה נא יש את עבדיך חמשים אנשים בני חיל ילכו נא ויבקשו את אדניך פן נשאו רוח יהוה וישלכהו באחד ההרים או באחת הגיאות [הגאיות] ויאמר לא תשלחו
    kjvRefs:
    - 2 Kings 2:16
    kjvOsis:
    - 2Kgs.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.17
    scripture: tanakh
    name: Tanakh 2 Kings 2:17
    ref: 2 Kings 2:17
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 9480
    text: 'And when they urged him till he was ashamed, he said: ‘Send.’ They sent therefore fifty men; and they sought three days, but found him not.'
    translation: JPS 1917
    original: וַיִּפְצְרוּ־בוֹ עַד־בֹּשׁ וַיֹּאמֶר שְׁלָחוּ וַיִּשְׁלְחוּ חֲמִשִּׁים אִישׁ וַיְבַקְשׁוּ שְׁלֹשָׁה־יָמִים וְלֹא מְצָאֻהוּ׃
    hebrewPlain: ויפצרו בו עד בש ויאמר שלחו וישלחו חמשים איש ויבקשו שלשה ימים ולא מצאהו
    kjvRefs:
    - 2 Kings 2:17
    kjvOsis:
    - 2Kgs.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.18
    scripture: tanakh
    name: Tanakh 2 Kings 2:18
    ref: 2 Kings 2:18
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 18
    ordinal: 9481
    text: 'And they came back to him, while he tarried at Jericho; and he said unto them: ‘Did I not say unto you: Go not?’'
    translation: JPS 1917
    original: וַיָּשֻׁבוּ אֵלָיו וְהוּא יֹשֵׁב בִּירִיחוֹ וַיֹּאמֶר אֲלֵהֶם הֲלוֹא־אָמַרְתִּי אֲלֵיכֶם אַל־תֵּלֵכוּ׃
    hebrewPlain: וישבו אליו והוא ישב ביריחו ויאמר אלהם הלוא אמרתי אליכם אל תלכו
    kjvRefs:
    - 2 Kings 2:18
    kjvOsis:
    - 2Kgs.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.19
    scripture: tanakh
    name: Tanakh 2 Kings 2:19
    ref: 2 Kings 2:19
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 19
    ordinal: 9482
    text: 'And the men of the city said unto Elisha: ‘Behold, we pray thee, the situation of this city is pleasant, as my lord seeth; but the water is bad, and the land miscarrieth.'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אַנְשֵׁי הָעִיר אֶל־אֱלִישָׁע הִנֵּה־נָא מוֹשַׁב הָעִיר טוֹב כַּאֲשֶׁר אֲדֹנִי רֹאֶה וְהַמַּיִם רָעִים וְהָאָרֶץ מְשַׁכָּלֶת׃
    hebrewPlain: ויאמרו אנשי העיר אל אלישע הנה נא מושב העיר טוב כאשר אדני ראה והמים רעים והארץ משכלת
    kjvRefs:
    - 2 Kings 2:19
    kjvOsis:
    - 2Kgs.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.20
    scripture: tanakh
    name: Tanakh 2 Kings 2:20
    ref: 2 Kings 2:20
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 20
    ordinal: 9483
    text: 'And he said: ‘Bring me a new cruse, and put salt therein.’ And they brought it to him.'
    translation: JPS 1917
    original: וַיֹּאמֶר קְחוּ־לִי צְלֹחִית חֲדָשָׁה וְשִׂימוּ שָׁם מֶלַח וַיִּקְחוּ אֵלָיו׃
    hebrewPlain: ויאמר קחו לי צלחית חדשה ושימו שם מלח ויקחו אליו
    kjvRefs:
    - 2 Kings 2:20
    kjvOsis:
    - 2Kgs.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.21
    scripture: tanakh
    name: Tanakh 2 Kings 2:21
    ref: 2 Kings 2:21
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 21
    ordinal: 9484
    text: 'And he went forth unto the spring of the waters, and cast salt therein, and said: ‘Thus saith the LORD: I have healed these waters; there shall not be from thence any more death or miscarrying.’'
    translation: JPS 1917
    original: וַיֵּצֵא אֶל־מוֹצָא הַמַּיִם וַיַּשְׁלֶךְ־שָׁם מֶלַח וַיֹּאמֶר כֹּה־אָמַר יְהוָה רִפִּאתִי לַמַּיִם הָאֵלֶּה לֹא־יִהְיֶה מִשָּׁם עוֹד מָוֶת וּמְשַׁכָּלֶת׃
    hebrewPlain: ויצא אל מוצא המים וישלך שם מלח ויאמר כה אמר יהוה רפאתי למים האלה לא יהיה משם עוד מות ומשכלת
    kjvRefs:
    - 2 Kings 2:21
    kjvOsis:
    - 2Kgs.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.22
    scripture: tanakh
    name: Tanakh 2 Kings 2:22
    ref: 2 Kings 2:22
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 22
    ordinal: 9485
    text: So the waters were healed unto this day, according to the word of Elisha which he spoke.
    translation: JPS 1917
    original: וַיֵּרָפוּ הַמַּיִם עַד הַיּוֹם הַזֶּה כִּדְבַר אֱלִישָׁע אֲשֶׁר דִּבֵּר׃
    hebrewPlain: וירפו המים עד היום הזה כדבר אלישע אשר דבר
    kjvRefs:
    - 2 Kings 2:22
    kjvOsis:
    - 2Kgs.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.23
    scripture: tanakh
    name: Tanakh 2 Kings 2:23
    ref: 2 Kings 2:23
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 23
    ordinal: 9486
    text: 'And he went up from thence unto Beth-el; and as he was going up by the way, there came forth little children out of the city, and mocked him, and said unto him: ‘Go up, thou baldhead; go up, thou baldhead.’'
    translation: JPS 1917
    original: וַיַּעַל מִשָּׁם בֵּית־אֵל וְהוּא עֹלֶה בַדֶּרֶךְ וּנְעָרִים קְטַנִּים יָצְאוּ מִן־הָעִיר וַיִּתְקַלְּסוּ־בוֹ וַיֹּאמְרוּ לוֹ עֲלֵה קֵרֵחַ עֲלֵה קֵרֵחַ׃
    hebrewPlain: ויעל משם בית אל והוא עלה בדרך ונערים קטנים יצאו מן העיר ויתקלסו בו ויאמרו לו עלה קרח עלה קרח
    kjvRefs:
    - 2 Kings 2:23
    kjvOsis:
    - 2Kgs.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.24
    scripture: tanakh
    name: Tanakh 2 Kings 2:24
    ref: 2 Kings 2:24
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 24
    ordinal: 9487
    text: And he looked behind him and saw them, and cursed them in the name of the LORD. And there came forth two she-bears out of the wood, and tore forty and two children of them.
    translation: JPS 1917
    original: וַיִּפֶן אַחֲרָיו וַיִּרְאֵם וַיְקַלְלֵם בְּשֵׁם יְהוָה וַתֵּצֶאנָה שְׁתַּיִם דֻּבִּים מִן־הַיַּעַר וַתְּבַקַּעְנָה מֵהֶם אַרְבָּעִים וּשְׁנֵי יְלָדִים׃
    hebrewPlain: ויפן אחריו ויראם ויקללם בשם יהוה ותצאנה שתים דבים מן היער ותבקענה מהם ארבעים ושני ילדים
    kjvRefs:
    - 2 Kings 2:24
    kjvOsis:
    - 2Kgs.2.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.2.25
    scripture: tanakh
    name: Tanakh 2 Kings 2:25
    ref: 2 Kings 2:25
    book: 2Kgs
    section: neviim
    chapter: 2
    verse: 25
    ordinal: 9488
    text: And he went from thence to mount Carmel, and from thence he returned to Samaria.
    translation: JPS 1917
    original: וַיֵּלֶךְ מִשָּׁם אֶל־הַר הַכַּרְמֶל וּמִשָּׁם שָׁב שֹׁמְרוֹן׃
    hebrewPlain: וילך משם אל הר הכרמל ומשם שב שמרון
    kjvRefs:
    - 2 Kings 2:25
    kjvOsis:
    - 2Kgs.2.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.2
- type: TanakhVerse
  data:
    osis: 2Kgs.3.1
    scripture: tanakh
    name: Tanakh 2 Kings 3:1
    ref: 2 Kings 3:1
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 9489
    text: Now Jehoram the son of Ahab began to reign over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.
    translation: JPS 1917
    original: וִיהוֹרָם בֶּן־אַחְאָב מָלַךְ עַל־יִשְׂרָאֵל בְּשֹׁמְרוֹן בִּשְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה וַיִּמְלֹךְ שְׁתֵּים־עֶשְׂרֵה שָׁנָה׃
    hebrewPlain: ויהורם בן אחאב מלך על ישראל בשמרון בשנת שמנה עשרה ליהושפט מלך יהודה וימלך שתים עשרה שנה
    kjvRefs:
    - 2 Kings 3:1
    kjvOsis:
    - 2Kgs.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.2
    scripture: tanakh
    name: Tanakh 2 Kings 3:2
    ref: 2 Kings 3:2
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 9490
    text: And he did that which was evil in the sight of the LORD; but not like his father, and like his mother; for he put away the pillar of Baal that his father had made. .
    translation: JPS 1917
    original: וַיַּעֲשֶׂה הָרַע בְּעֵינֵי יְהוָה רַק לֹא כְאָבִיו וּכְאִמּוֹ וַיָּסַר אֶת־מַצְּבַת הַבַּעַל אֲשֶׁר עָשָׂה אָבִיו׃
    hebrewPlain: ויעשה הרע בעיני יהוה רק לא כאביו וכאמו ויסר את מצבת הבעל אשר עשה אביו
    kjvRefs:
    - 2 Kings 3:2
    kjvOsis:
    - 2Kgs.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.3
    scripture: tanakh
    name: Tanakh 2 Kings 3:3
    ref: 2 Kings 3:3
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 9491
    text: Nevertheless he cleaved unto the sins of Jeroboam the son of Nebat, wherewith he made Israel to sin; he departed not therefrom.
    translation: JPS 1917
    original: רַק בְּחַטֹּאות יָרָבְעָם בֶּן־נְבָט אֲשֶׁר־הֶחֱטִיא אֶת־יִשְׂרָאֵל דָּבֵק לֹא־סָר מִמֶּנָּה׃
    hebrewPlain: רק בחטאות ירבעם בן נבט אשר החטיא את ישראל דבק לא סר ממנה
    kjvRefs:
    - 2 Kings 3:3
    kjvOsis:
    - 2Kgs.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.4
    scripture: tanakh
    name: Tanakh 2 Kings 3:4
    ref: 2 Kings 3:4
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 9492
    text: Now Mesha king of Moab was a sheep-master; and he rendered unto the king of Israel the wool of a hundred thousand lambs, and of a hundred thousand rams.
    translation: JPS 1917
    original: וּמֵישַׁע מֶלֶךְ־מוֹאָב הָיָה נֹקֵד וְהֵשִׁיב לְמֶלֶךְ־יִשְׂרָאֵל מֵאָה־אֶלֶף כָּרִים וּמֵאָה אֶלֶף אֵילִים צָמֶר׃
    hebrewPlain: ומישע מלך מואב היה נקד והשיב למלך ישראל מאה אלף כרים ומאה אלף אילים צמר
    kjvRefs:
    - 2 Kings 3:4
    kjvOsis:
    - 2Kgs.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.5
    scripture: tanakh
    name: Tanakh 2 Kings 3:5
    ref: 2 Kings 3:5
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 9493
    text: But it came to pass, when Ahab was dead, that the king of Moab rebelled against the king of Israel.
    translation: JPS 1917
    original: וַיְהִי כְּמוֹת אַחְאָב וַיִּפְשַׁע מֶלֶךְ־מוֹאָב בְּמֶלֶךְ יִשְׂרָאֵל׃
    hebrewPlain: ויהי כמות אחאב ויפשע מלך מואב במלך ישראל
    kjvRefs:
    - 2 Kings 3:5
    kjvOsis:
    - 2Kgs.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.6
    scripture: tanakh
    name: Tanakh 2 Kings 3:6
    ref: 2 Kings 3:6
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 9494
    text: And king Jehoram went out of Samaria at that time, and mustered all Israel.
    translation: JPS 1917
    original: וַיֵּצֵא הַמֶּלֶךְ יְהוֹרָם בַּיּוֹם הַהוּא מִשֹּׁמְרוֹן וַיִּפְקֹד אֶת־כָּל־יִשְׂרָאֵל׃
    hebrewPlain: ויצא המלך יהורם ביום ההוא משמרון ויפקד את כל ישראל
    kjvRefs:
    - 2 Kings 3:6
    kjvOsis:
    - 2Kgs.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.7
    scripture: tanakh
    name: Tanakh 2 Kings 3:7
    ref: 2 Kings 3:7
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 9495
    text: 'And he went and sent to Jehoshaphat the king of Judah, saying: ‘The king of Moab hath rebelled against me; wilt thou go with me against Moab to battle?’ And he said: ‘I will go up; I am as thou art, my people as thy people, my horses as thy horses.’'
    translation: JPS 1917
    original: וַיֵּלֶךְ וַיִּשְׁלַח אֶל־יְהוֹשָׁפָט מֶלֶךְ־יְהוּדָה לֵאמֹר מֶלֶךְ מוֹאָב פָּשַׁע בִּי הֲתֵלֵךְ אִתִּי אֶל־מוֹאָב לַמִּלְחָמָה וַיֹּאמֶר אֶעֱלֶה כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ׃
    hebrewPlain: וילך וישלח אל יהושפט מלך יהודה לאמר מלך מואב פשע בי התלך אתי אל מואב למלחמה ויאמר אעלה כמוני כמוך כעמי כעמך כסוסי כסוסיך
    kjvRefs:
    - 2 Kings 3:7
    kjvOsis:
    - 2Kgs.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.8
    scripture: tanakh
    name: Tanakh 2 Kings 3:8
    ref: 2 Kings 3:8
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 9496
    text: 'And he said: ‘Which way shall we go up?’ And he answered: ‘The way of the wilderness of Edom.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵי־זֶה הַדֶּרֶךְ נַעֲלֶה וַיֹּאמֶר דֶּרֶךְ מִדְבַּר אֱדוֹם׃
    hebrewPlain: ויאמר אי זה הדרך נעלה ויאמר דרך מדבר אדום
    kjvRefs:
    - 2 Kings 3:8
    kjvOsis:
    - 2Kgs.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.9
    scripture: tanakh
    name: Tanakh 2 Kings 3:9
    ref: 2 Kings 3:9
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 9497
    text: So the king of Israel went, and the king of Judah, and the king of Edom; and they made a circuit of seven days’ journey; and there was no water for the host, nor for the beasts that followed them.
    translation: JPS 1917
    original: וַיֵּלֶךְ מֶלֶךְ יִשְׂרָאֵל וּמֶלֶך־יְהוּדָה וּמֶלֶךְ אֱדוֹם וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים וְלֹא־הָיָה מַיִם לַמַּחֲנֶה וְלַבְּהֵמָה אֲשֶׁר בְּרַגְלֵיהֶם׃
    hebrewPlain: וילך מלך ישראל ומלך יהודה ומלך אדום ויסבו דרך שבעת ימים ולא היה מים למחנה ולבהמה אשר ברגליהם
    kjvRefs:
    - 2 Kings 3:9
    kjvOsis:
    - 2Kgs.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.10
    scripture: tanakh
    name: Tanakh 2 Kings 3:10
    ref: 2 Kings 3:10
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 9498
    text: 'And the king of Israel said: ‘Alas! for the LORD hath called these three kings together to deliver them into the hand of Moab.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֶלֶךְ יִשְׂרָאֵל אֲהָהּ כִּי־קָרָא יְהוָה לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה לָתֵת אוֹתָם בְּיַד־מוֹאָב׃
    hebrewPlain: ויאמר מלך ישראל אהה כי קרא יהוה לשלשת המלכים האלה לתת אותם ביד מואב
    kjvRefs:
    - 2 Kings 3:10
    kjvOsis:
    - 2Kgs.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.11
    scripture: tanakh
    name: Tanakh 2 Kings 3:11
    ref: 2 Kings 3:11
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 9499
    text: 'But Jehoshaphat said: ‘Is there not here a prophet of the LORD, that we may inquire of the LORD by him?’ And one of the king of Israel’s servants answered and said: ‘Elisha the son of Shaphat is here, who poured water on the hands of Elijah.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשָׁפָט הַאֵין פֹּה נָבִיא לַיהוָה וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ וַיַּעַן אֶחָד מֵעַבְדֵי מֶלֶךְ־יִשְׂרָאֵל וַיֹּאמֶר פֹּה אֱלִישָׁע בֶּן־שָׁפָט אֲשֶׁר־יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ׃
    hebrewPlain: ויאמר יהושפט האין פה נביא ליהוה ונדרשה את יהוה מאותו ויען אחד מעבדי מלך ישראל ויאמר פה אלישע בן שפט אשר יצק מים על ידי אליהו
    kjvRefs:
    - 2 Kings 3:11
    kjvOsis:
    - 2Kgs.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.12
    scripture: tanakh
    name: Tanakh 2 Kings 3:12
    ref: 2 Kings 3:12
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 9500
    text: 'And Jehoshaphat said: ‘The word of the LORD is with him.’ So the king of Israel and Jehoshaphat and the king of Edom went down to him.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוֹשָׁפָט יֵשׁ אוֹתוֹ דְּבַר־יְהוָה וַיֵּרְדוּ אֵלָיו מֶלֶךְ יִשְׂרָאֵל וִיהוֹשָׁפָט וּמֶלֶךְ אֱדוֹם׃
    hebrewPlain: ויאמר יהושפט יש אותו דבר יהוה וירדו אליו מלך ישראל ויהושפט ומלך אדום
    kjvRefs:
    - 2 Kings 3:12
    kjvOsis:
    - 2Kgs.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.13
    scripture: tanakh
    name: Tanakh 2 Kings 3:13
    ref: 2 Kings 3:13
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 9501
    text: 'And Elisha said unto the king of Israel: ‘What have I to do with thee? get thee to the prophets of thy father, and to the prophets of thy mother.’ And the king of Israel said unto him: ‘Nay; for the LORD hath called these three kings together to deliver them into the hand of Moab.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֱלִישָׁע אֶל־מֶלֶךְ יִשְׂרָאֵל מַה־לִּי וָלָךְ לֵךְ אֶל־נְבִיאֵי אָבִיךָ וְאֶל־נְבִיאֵי אִמֶּךָ וַיֹּאמֶר לוֹ מֶלֶךְ יִשְׂרָאֵל אַל כִּי־קָרָא יְהוָה לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה לָתֵת אוֹתָם בְּיַד־מוֹאָב׃
    hebrewPlain: ויאמר אלישע אל מלך ישראל מה לי ולך לך אל נביאי אביך ואל נביאי אמך ויאמר לו מלך ישראל אל כי קרא יהוה לשלשת המלכים האלה לתת אותם ביד מואב
    kjvRefs:
    - 2 Kings 3:13
    kjvOsis:
    - 2Kgs.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.14
    scripture: tanakh
    name: Tanakh 2 Kings 3:14
    ref: 2 Kings 3:14
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 9502
    text: 'And Elisha said: ‘As the LORD of hosts liveth, before whom I stand, surely, were it not that I regard the presence of Jehoshaphat the king of Judah, I would not look toward thee, nor see thee.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֱלִישָׁע חַי־יְהוָה צְבָאוֹת אֲשֶׁר עָמַדְתִּי לְפָנָיו כִּי לוּלֵי פְּנֵי יְהוֹשָׁפָט מֶלֶךְ־יְהוּדָה אֲנִי נֹשֵׂא אִם־אַבִּיט אֵלֶיךָ וְאִם־אֶרְאֶךָּ׃
    hebrewPlain: ויאמר אלישע חי יהוה צבאות אשר עמדתי לפניו כי לולי פני יהושפט מלך יהודה אני נשא אם אביט אליך ואם אראך
    kjvRefs:
    - 2 Kings 3:14
    kjvOsis:
    - 2Kgs.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.15
    scripture: tanakh
    name: Tanakh 2 Kings 3:15
    ref: 2 Kings 3:15
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 9503
    text: But now bring me a minstrel.’ And it came to pass, when the minstrel played, that the hand of the LORD came upon him.
    translation: JPS 1917
    original: וְעַתָּה קְחוּ־לִי מְנַגֵּן וְהָיָה כְּנַגֵּן הַמְנַגֵּן וַתְּהִי עָלָיו יַד־יְהוָה׃
    hebrewPlain: ועתה קחו לי מנגן והיה כנגן המנגן ותהי עליו יד יהוה
    kjvRefs:
    - 2 Kings 3:15
    kjvOsis:
    - 2Kgs.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.16
    scripture: tanakh
    name: Tanakh 2 Kings 3:16
    ref: 2 Kings 3:16
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 9504
    text: 'And he said: ‘Thus saith the LORD: Make this valley full of trenches.'
    translation: JPS 1917
    original: וַיֹּאמֶר כֹּה אָמַר יְהוָה עָשֹׂה הַנַּחַל הַזֶּה גֵּבִים גֵּבִים׃
    hebrewPlain: ויאמר כה אמר יהוה עשה הנחל הזה גבים גבים
    kjvRefs:
    - 2 Kings 3:16
    kjvOsis:
    - 2Kgs.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.17
    scripture: tanakh
    name: Tanakh 2 Kings 3:17
    ref: 2 Kings 3:17
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 9505
    text: 'For thus saith the LORD: Ye shall not see wind, neither shall ye see rain, yet that valley shall be filled with water; and ye shall drink, both ye and your cattle and your beasts.'
    translation: JPS 1917
    original: כִּי־כֹה אָמַר יְהוָה לֹא־תִרְאוּ רוּחַ וְלֹא־תִרְאוּ גֶשֶׁם וְהַנַּחַל הַהוּא יִמָּלֵא מָיִם וּשְׁתִיתֶם אַתֶּם וּמִקְנֵיכֶם וּבְהֶמְתְּכֶם׃
    hebrewPlain: כי כה אמר יהוה לא תראו רוח ולא תראו גשם והנחל ההוא ימלא מים ושתיתם אתם ומקניכם ובהמתכם
    kjvRefs:
    - 2 Kings 3:17
    kjvOsis:
    - 2Kgs.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.18
    scripture: tanakh
    name: Tanakh 2 Kings 3:18
    ref: 2 Kings 3:18
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 9506
    text: And this is but a light thing in the sight of the LORD; He will also deliver the Moabites into your hand.
    translation: JPS 1917
    original: וְנָקַל זֹאת בְּעֵינֵי יְהוָה וְנָתַן אֶת־מוֹאָב בְּיֶדְכֶם׃
    hebrewPlain: ונקל זאת בעיני יהוה ונתן את מואב בידכם
    kjvRefs:
    - 2 Kings 3:18
    kjvOsis:
    - 2Kgs.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.19
    scripture: tanakh
    name: Tanakh 2 Kings 3:19
    ref: 2 Kings 3:19
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 9507
    text: And ye shall smite every fortified city, and every choice city, and shall fell every good tree, and stop all fountains of water, and mar every good piece of land with stones.’
    translation: JPS 1917
    original: וְהִכִּיתֶם כָּל־עִיר מִבְצָר וְכָל־עִיר מִבְחוֹר וְכָל־עֵץ טוֹב תַּפִּילוּ וְכָל־מַעְיְנֵי־מַיִם תִּסְתֹּמוּ וְכֹל הַחֶלְקָה הַטּוֹבָה תַּכְאִבוּ בָּאֲבָנִים׃
    hebrewPlain: והכיתם כל עיר מבצר וכל עיר מבחור וכל עץ טוב תפילו וכל מעיני מים תסתמו וכל החלקה הטובה תכאבו באבנים
    kjvRefs:
    - 2 Kings 3:19
    kjvOsis:
    - 2Kgs.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.20
    scripture: tanakh
    name: Tanakh 2 Kings 3:20
    ref: 2 Kings 3:20
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 9508
    text: And it came to pass in the morning, about the time of making the offering, that, behold, there came water by the way of Edom, and the country was filled with water. .
    translation: JPS 1917
    original: וַיְהִי בַבֹּקֶר כַּעֲלוֹת הַמִּנְחָה וְהִנֵּה־מַיִם בָּאִים מִדֶּרֶךְ אֱדוֹם וַתִּמָּלֵא הָאָרֶץ אֶת־הַמָּיִם׃
    hebrewPlain: ויהי בבקר כעלות המנחה והנה מים באים מדרך אדום ותמלא הארץ את המים
    kjvRefs:
    - 2 Kings 3:20
    kjvOsis:
    - 2Kgs.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.21
    scripture: tanakh
    name: Tanakh 2 Kings 3:21
    ref: 2 Kings 3:21
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 21
    ordinal: 9509
    text: Now when all the Moabites heard that the kings were come up to fight against them, they gathered themselves together, all that were able to put on armour, and upward, and stood on the border.
    translation: JPS 1917
    original: וְכָל־מוֹאָב שָׁמְעוּ כִּי־עָלוּ הַמְּלָכִים לְהִלָּחֶם בָּם וַיִּצָּעֲקוּ מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה וַיַּעַמְדוּ עַל־הַגְּבוּל׃
    hebrewPlain: וכל מואב שמעו כי עלו המלכים להלחם בם ויצעקו מכל חגר חגרה ומעלה ויעמדו על הגבול
    kjvRefs:
    - 2 Kings 3:21
    kjvOsis:
    - 2Kgs.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.22
    scripture: tanakh
    name: Tanakh 2 Kings 3:22
    ref: 2 Kings 3:22
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 22
    ordinal: 9510
    text: And they rose up early in the morning, and the sun shone upon the water, and the Moabites saw the water some way off as red as blood;
    translation: JPS 1917
    original: וַיַּשְׁכִּימוּ בַבֹּקֶר וְהַשֶּׁמֶשׁ זָרְחָה עַל־הַמָּיִם וַיִּרְאוּ מוֹאָב מִנֶּגֶד אֶת־הַמַּיִם אֲדֻמִּים כַּדָּם׃
    hebrewPlain: וישכימו בבקר והשמש זרחה על המים ויראו מואב מנגד את המים אדמים כדם
    kjvRefs:
    - 2 Kings 3:22
    kjvOsis:
    - 2Kgs.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.23
    scripture: tanakh
    name: Tanakh 2 Kings 3:23
    ref: 2 Kings 3:23
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 23
    ordinal: 9511
    text: 'and they said: ‘This is blood: the kings have surely fought together, and they have smitten each man his fellow; now therefore, Moab, to the spoil.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ דָּם זֶה הָחֳרֵב נֶחֶרְבוּ הַמְּלָכִים וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ וְעַתָּה לַשָּׁלָל מוֹאָב׃
    hebrewPlain: ויאמרו דם זה החרב נחרבו המלכים ויכו איש את רעהו ועתה לשלל מואב
    kjvRefs:
    - 2 Kings 3:23
    kjvOsis:
    - 2Kgs.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.24
    scripture: tanakh
    name: Tanakh 2 Kings 3:24
    ref: 2 Kings 3:24
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 24
    ordinal: 9512
    text: And when they came to the camp of Israel, the Israelites rose up and smote the Moabites, so that they fled before them. And they smote the land, even Moab, mightily.
    translation: JPS 1917
    original: וַיָּבֹאוּ אֶל־מַחֲנֵה יִשְׂרָאֵל וַיָּקֻמוּ יִשְׂרָאֵל וַיַּכּוּ אֶת־מוֹאָב וַיָּנֻסוּ מִפְּנֵיהֶם ויבו־[וַיַּכּוּ־] בָהּ וְהַכּוֹת אֶת־מוֹאָב׃
    hebrewPlain: ויבאו אל מחנה ישראל ויקמו ישראל ויכו את מואב וינסו מפניהם ויבו [ויכו ] בה והכות את מואב
    kjvRefs:
    - 2 Kings 3:24
    kjvOsis:
    - 2Kgs.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.25
    scripture: tanakh
    name: Tanakh 2 Kings 3:25
    ref: 2 Kings 3:25
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 25
    ordinal: 9513
    text: And they beat down the cities; and on every good piece of land they cast every man his stone, and filled it; and they stopped all the fountains of water, and felled all the good trees; until there was left only Kir-hareseth with the stones of the wall thereof; so the slingers encompassed it, and smote it.
    translation: JPS 1917
    original: וְהֶעָרִים יַהֲרֹסוּ וְכָל־חֶלְקָה טוֹבָה יַשְׁלִיכוּ אִישׁ־אַבְנוֹ וּמִלְאוּהָ וְכָל־מַעְיַן־מַיִם יִסְתֹּמוּ וְכָל־עֵץ־טוֹב יַפִּילוּ עַד־הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת וַיָּסֹבּוּ הַקַּלָּעִים וַיַּכּוּהָ׃
    hebrewPlain: והערים יהרסו וכל חלקה טובה ישליכו איש אבנו ומלאוה וכל מעין מים יסתמו וכל עץ טוב יפילו עד השאיר אבניה בקיר חרשת ויסבו הקלעים ויכוה
    kjvRefs:
    - 2 Kings 3:25
    kjvOsis:
    - 2Kgs.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.26
    scripture: tanakh
    name: Tanakh 2 Kings 3:26
    ref: 2 Kings 3:26
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 26
    ordinal: 9514
    text: And when the king of Moab saw that the battle was too sore for him, he took with him seven hundred men that drew sword, to break through unto the king of Edom; but they could not.
    translation: JPS 1917
    original: וַיַּרְא מֶלֶךְ מוֹאָב כִּי־חָזַק מִמֶּנּוּ הַמִּלְחָמָה וַיִּקַּח אוֹתוֹ שְׁבַע־מֵאוֹת אִישׁ שֹׁלֵף חֶרֶב לְהַבְקִיעַ אֶל־מֶלֶךְ אֱדוֹם וְלֹא יָכֹלוּ׃
    hebrewPlain: וירא מלך מואב כי חזק ממנו המלחמה ויקח אותו שבע מאות איש שלף חרב להבקיע אל מלך אדום ולא יכלו
    kjvRefs:
    - 2 Kings 3:26
    kjvOsis:
    - 2Kgs.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.3.27
    scripture: tanakh
    name: Tanakh 2 Kings 3:27
    ref: 2 Kings 3:27
    book: 2Kgs
    section: neviim
    chapter: 3
    verse: 27
    ordinal: 9515
    text: Then he took his eldest son that should have reigned in his stead, and offered him for a burnt-offering upon the wall. And there came great wrath upon Israel; and they departed from him, and returned to their own land.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־בְּנוֹ הַבְּכוֹר אֲשֶׁר־יִמְלֹךְ תַּחְתָּיו וַיַּעֲלֵהוּ עֹלָה עַל־הַחֹמָה וַיְהִי קֶצֶף־גָּדוֹל עַל־יִשְׂרָאֵל וַיִּסְעוּ מֵעָלָיו וַיָּשֻׁבוּ לָאָרֶץ׃
    hebrewPlain: ויקח את בנו הבכור אשר ימלך תחתיו ויעלהו עלה על החמה ויהי קצף גדול על ישראל ויסעו מעליו וישבו לארץ
    kjvRefs:
    - 2 Kings 3:27
    kjvOsis:
    - 2Kgs.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.3
- type: TanakhVerse
  data:
    osis: 2Kgs.4.1
    scripture: tanakh
    name: Tanakh 2 Kings 4:1
    ref: 2 Kings 4:1
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 1
    ordinal: 9516
    text: 'Now there cried a certain woman of the wives of the sons of the prophets unto Elisha, saying: ‘Thy servant my husband is dead; and thou knowest that thy servant did fear the LORD; and the creditor is come to take unto him my two children to be bondmen.’'
    translation: JPS 1917
    original: וְאִשָּׁה אַחַת מִנְּשֵׁי בְנֵי־הַנְּבִיאִים צָעֲקָה אֶל־אֱלִישָׁע לֵאמֹר עַבְדְּךָ אִישִׁי מֵת וְאַתָּה יָדַעְתָּ כִּי עַבְדְּךָ הָיָה יָרֵא אֶת־יְהוָה וְהַנֹּשֶׁה בָּא לָקַחַת אֶת־שְׁנֵי יְלָדַי לוֹ לַעֲבָדִים׃
    hebrewPlain: ואשה אחת מנשי בני הנביאים צעקה אל אלישע לאמר עבדך אישי מת ואתה ידעת כי עבדך היה ירא את יהוה והנשה בא לקחת את שני ילדי לו לעבדים
    kjvRefs:
    - 2 Kings 4:1
    kjvOsis:
    - 2Kgs.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.2
    scripture: tanakh
    name: Tanakh 2 Kings 4:2
    ref: 2 Kings 4:2
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 2
    ordinal: 9517
    text: 'And Elisha said unto her: ‘What shall I do for thee? tell me; what hast thou in the house?’ And she said: ‘Thy handmaid hath not any thing in the house, save a pot of oil.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלֶיהָ אֱלִישָׁע מָה אֶעֱשֶׂה־לָּךְ הַגִּידִי לִי מַה־יֶּשׁ־לכי [לָךְ] בַּבָּיִת וַתֹּאמֶר אֵין לְשִׁפְחָתְךָ כֹל בַּבַּיִת כִּי אִם־אָסוּךְ שָׁמֶן׃
    hebrewPlain: ויאמר אליה אלישע מה אעשה לך הגידי לי מה יש לכי [לך] בבית ותאמר אין לשפחתך כל בבית כי אם אסוך שמן
    kjvRefs:
    - 2 Kings 4:2
    kjvOsis:
    - 2Kgs.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.3
    scripture: tanakh
    name: Tanakh 2 Kings 4:3
    ref: 2 Kings 4:3
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 3
    ordinal: 9518
    text: 'Then he said: ‘Go, borrow thee vessels abroad of all thy neighbours, even empty vessels; borrow not a few.'
    translation: JPS 1917
    original: וַיֹּאמֶר לְכִי שַׁאֲלִי־לָךְ כֵּלִים מִן־הַחוּץ מֵאֵת כָּל־שכנכי [שְׁכֵנָיִךְ] כֵּלִים רֵקִים אַל־תַּמְעִיטִי׃
    hebrewPlain: ויאמר לכי שאלי לך כלים מן החוץ מאת כל שכנכי [שכניך] כלים רקים אל תמעיטי
    kjvRefs:
    - 2 Kings 4:3
    kjvOsis:
    - 2Kgs.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.4
    scripture: tanakh
    name: Tanakh 2 Kings 4:4
    ref: 2 Kings 4:4
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 4
    ordinal: 9519
    text: And thou shalt go in, and shut the door upon thee and upon thy sons, and pour out into all those vessels; and thou shalt set aside that which is full.’
    translation: JPS 1917
    original: וּבָאת וְסָגַרְתְּ הַדֶּלֶת בַּעֲדֵךְ וּבְעַד־בָּנַיִךְ וְיָצַקְתְּ עַל כָּל־הַכֵּלִים הָאֵלֶּה וְהַמָּלֵא תַּסִּיעִי׃
    hebrewPlain: ובאת וסגרת הדלת בעדך ובעד בניך ויצקת על כל הכלים האלה והמלא תסיעי
    kjvRefs:
    - 2 Kings 4:4
    kjvOsis:
    - 2Kgs.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.5
    scripture: tanakh
    name: Tanakh 2 Kings 4:5
    ref: 2 Kings 4:5
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 5
    ordinal: 9520
    text: So she went from him, and shut the door upon her and upon her sons; they brought the vessels to her, and she poured out.
    translation: JPS 1917
    original: וַתֵּלֶךְ מֵאִתּוֹ וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ הֵם מַגִּשִׁים אֵלֶיהָ וְהִיא מיצקת [מוֹצָקֶת׃]
    hebrewPlain: ותלך מאתו ותסגר הדלת בעדה ובעד בניה הם מגשים אליה והיא מיצקת [מוצקת]
    kjvRefs:
    - 2 Kings 4:5
    kjvOsis:
    - 2Kgs.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.6
    scripture: tanakh
    name: Tanakh 2 Kings 4:6
    ref: 2 Kings 4:6
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 6
    ordinal: 9521
    text: 'And it came to pass, when the vessels were full, that she said unto her son: ‘Bring me yet a vessel.’ And he said unto her: ‘There is not a vessel more.’ And the oil stayed.'
    translation: JPS 1917
    original: וַיְהִי כִּמְלֹאת הַכֵּלִים וַתֹּאמֶר אֶל־בְּנָהּ הַגִּישָׁה אֵלַי עוֹד כֶּלִי וַיֹּאמֶר אֵלֶיהָ אֵין עוֹד כֶּלִי וַיַּעֲמֹד הַשָּׁמֶן׃
    hebrewPlain: ויהי כמלאת הכלים ותאמר אל בנה הגישה אלי עוד כלי ויאמר אליה אין עוד כלי ויעמד השמן
    kjvRefs:
    - 2 Kings 4:6
    kjvOsis:
    - 2Kgs.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.7
    scripture: tanakh
    name: Tanakh 2 Kings 4:7
    ref: 2 Kings 4:7
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 7
    ordinal: 9522
    text: 'Then she came and told the man of God. And he said: ‘Go, sell the oil, and pay thy debt, and live thou and thy sons of the rest.’'
    translation: JPS 1917
    original: וַתָּבֹא וַתַּגֵּד לְאִישׁ הָאֱלֹהִים וַיֹּאמֶר לְכִי מִכְרִי אֶת־הַשֶּׁמֶן וְשַׁלְּמִי אֶת־נשיכי [נִשְׁיֵךְ] וְאַתְּ בניכי [וּבָנַיִךְ] תִחְיִי בַּנּוֹתָר׃
    hebrewPlain: ותבא ותגד לאיש האלהים ויאמר לכי מכרי את השמן ושלמי את נשיכי [נשיך] ואת בניכי [ובניך] תחיי בנותר
    kjvRefs:
    - 2 Kings 4:7
    kjvOsis:
    - 2Kgs.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.8
    scripture: tanakh
    name: Tanakh 2 Kings 4:8
    ref: 2 Kings 4:8
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 8
    ordinal: 9523
    text: And it fell on a day, that Elisha passed to Shunem, where was a great woman; and she constrained him to eat bread. And so it was, that as oft as he passed by, he turned in thither to eat bread.
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיַּעֲבֹר אֱלִישָׁע אֶל־שׁוּנֵם וְשָׁם אִשָּׁה גְדוֹלָה וַתַּחֲזֶק־בּוֹ לֶאֱכָל־לָחֶם וַיְהִי מִדֵּי עָבְרוֹ יָסֻר שָׁמָּה לֶאֱכָל־לָחֶם׃
    hebrewPlain: ויהי היום ויעבר אלישע אל שונם ושם אשה גדולה ותחזק בו לאכל לחם ויהי מדי עברו יסר שמה לאכל לחם
    kjvRefs:
    - 2 Kings 4:8
    kjvOsis:
    - 2Kgs.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.9
    scripture: tanakh
    name: Tanakh 2 Kings 4:9
    ref: 2 Kings 4:9
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 9
    ordinal: 9524
    text: 'And she said unto her husband: ‘Behold now, I perceive that this is a holy man of God, that passeth by us continually.'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶל־אִישָׁהּ הִנֵּה־נָא יָדַעְתִּי כִּי אִישׁ אֱלֹהִים קָדוֹשׁ הוּא עֹבֵר עָלֵינוּ תָּמִיד׃
    hebrewPlain: ותאמר אל אישה הנה נא ידעתי כי איש אלהים קדוש הוא עבר עלינו תמיד
    kjvRefs:
    - 2 Kings 4:9
    kjvOsis:
    - 2Kgs.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.10
    scripture: tanakh
    name: Tanakh 2 Kings 4:10
    ref: 2 Kings 4:10
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 10
    ordinal: 9525
    text: Let us make, I pray thee, a little chamber on the roof; and let us set for him there a bed, and a table, and a stool, and a candlestick; and it shall be, when he cometh to us, that he shall turn in thither.’
    translation: JPS 1917
    original: נַעֲשֶׂה־נָּא עֲלִיַּת־קִיר קְטַנָּה וְנָשִׂים לוֹ שָׁם מִטָּה וְשֻׁלְחָן וְכִסֵּא וּמְנוֹרָה וְהָיָה בְּבֹאוֹ אֵלֵינוּ יָסוּר שָׁמָּה׃
    hebrewPlain: נעשה נא עלית קיר קטנה ונשים לו שם מטה ושלחן וכסא ומנורה והיה בבאו אלינו יסור שמה
    kjvRefs:
    - 2 Kings 4:10
    kjvOsis:
    - 2Kgs.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.11
    scripture: tanakh
    name: Tanakh 2 Kings 4:11
    ref: 2 Kings 4:11
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 11
    ordinal: 9526
    text: And it fell on a day, that he came thither, and he turned into the upper chamber and lay there.
    translation: JPS 1917
    original: וַיְהִי הַיּוֹם וַיָּבֹא שָׁמָּה וַיָּסַר אֶל־הָעֲלִיָּה וַיִּשְׁכַּב־שָׁמָּה׃
    hebrewPlain: ויהי היום ויבא שמה ויסר אל העליה וישכב שמה
    kjvRefs:
