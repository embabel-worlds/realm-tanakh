  data:
    osis: 2Kgs.4.13
    scripture: tanakh
    name: Tanakh 2 Kings 4:13
    ref: 2 Kings 4:13
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 13
    ordinal: 9528
    text: 'And he said unto him: ‘Say now unto her: Behold, thou hast been careful for us with all this care; what is to be done for thee? wouldest thou be spoken for to the king, or to the captain of the host?’ And she answered: ‘I dwell among mine own people.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לוֹ אֱמָר־נָא אֵלֶיהָ הִנֵּה חָרַדְתְּ אֵלֵינוּ אֶת־כָּל־הַחֲרָדָה הַזֹּאת מֶה לַעֲשׂוֹת לָךְ הֲיֵשׁ לְדַבֶּר־לָךְ אֶל־הַמֶּלֶךְ אוֹ אֶל־שַׂר הַצָּבָא וַתֹּאמֶר בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת׃
    hebrewPlain: ויאמר לו אמר נא אליה הנה חרדת אלינו את כל החרדה הזאת מה לעשות לך היש לדבר לך אל המלך או אל שר הצבא ותאמר בתוך עמי אנכי ישבת
    kjvRefs:
    - 2 Kings 4:13
    kjvOsis:
    - 2Kgs.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.4
- type: TanakhVerse
  data:
    osis: 2Kgs.4.14
    scripture: tanakh
    name: Tanakh 2 Kings 4:14
    ref: 2 Kings 4:14
    book: 2Kgs
    section: neviim
    chapter: 4
    verse: 14
    ordinal: 9529
    text: 'And he said: ‘What then is to be done for her?’ And Gehazi answered: ‘Verily she hath no son, and her husband is old.’'
    translation: JPS 1917
    original: וַיֹּאמֶר וּמֶה לַעֲשׂוֹת לָהּ וַיֹּאמֶר גֵּיחֲזִי אֲבָל בֵּן אֵין־לָהּ וְאִישָׁהּ זָקֵן׃
    hebrewPlain: ויאמר ומה לעשות לה ויאמר גיחזי אבל בן אין לה ואישה זקן
    kjvRefs:
