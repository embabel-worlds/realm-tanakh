    scripture: tanakh
    name: Tanakh 2 Kings 21:17
    ref: 2 Kings 21:17
    book: 2Kgs
    section: neviim
    chapter: 21
    verse: 17
    ordinal: 10048
    text: Now the rest of the acts of Manasseh, and all that he did, and his sin that he sinned, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה וְכָל־אֲשֶׁר עָשָׂה וְחַטָּאתוֹ אֲשֶׁר חָטָא הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי מנשה וכל אשר עשה וחטאתו אשר חטא הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 21:17
    kjvOsis:
    - 2Kgs.21.17
