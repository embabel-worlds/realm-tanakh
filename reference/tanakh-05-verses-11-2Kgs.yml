  data:
    osis: 2Kgs.13.4
    scripture: tanakh
    name: Tanakh 2 Kings 13:4
    ref: 2 Kings 13:4
    book: 2Kgs
    section: neviim
    chapter: 13
    verse: 4
    ordinal: 9787
    text: And Jehoahaz besought the LORD, and the LORD hearkened unto him; for He saw the oppression of Israel, how that the king of Aram oppressed them.—
    translation: JPS 1917
    original: וַיְחַל יְהוֹאָחָז אֶת־פְּנֵי יְהוָה וַיִּשְׁמַע אֵלָיו יְהוָה כִּי רָאָה אֶת־לַחַץ יִשְׂרָאֵל כִּי־לָחַץ אֹתָם מֶלֶךְ אֲרָם׃
    hebrewPlain: ויחל יהואחז את פני יהוה וישמע אליו יהוה כי ראה את לחץ ישראל כי לחץ אתם מלך ארם
    kjvRefs:
