  data:
    osis: 2Kgs.15.5
    scripture: tanakh
    name: Tanakh 2 Kings 15:5
    ref: 2 Kings 15:5
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 5
    ordinal: 9842
    text: And the LORD smote the king, so that he was a leper unto the day of his death, and dwelt in a house set apart. And Jotham the king’s son was over the household, judging the people of the land.
    translation: JPS 1917
    original: וַיְנַגַּע יְהוָה אֶת־הַמֶּלֶךְ וַיְהִי מְצֹרָע עַד־יוֹם מֹתוֹ וַיֵּשֶׁב בְּבֵית הַחָפְשִׁית וְיוֹתָם בֶּן־הַמֶּלֶךְ עַל־הַבַּיִת שֹׁפֵט אֶת־עַם הָאָרֶץ׃
    hebrewPlain: וינגע יהוה את המלך ויהי מצרע עד יום מתו וישב בבית החפשית ויותם בן המלך על הבית שפט את עם הארץ
    kjvRefs:
