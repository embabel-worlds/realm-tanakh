  data:
    osis: 2Kgs.22.3
    scripture: tanakh
    name: Tanakh 2 Kings 22:3
    ref: 2 Kings 22:3
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 3
    ordinal: 10060
    text: And it came to pass in the eighteenth year of king Josiah, that the king sent Shaphan the son of Azaliah, the son of Meshullam, the scribe, to the house of the LORD, saying.
    translation: JPS 1917
    original: וַיְהִי בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ שָׁלַח הַמֶּלֶךְ אֶת־שָׁפָן בֶּן־אֲצַלְיָהוּ בֶן־מְשֻׁלָּם הַסֹּפֵר בֵּית יְהוָה לֵאמֹר׃
    hebrewPlain: ויהי בשמנה עשרה שנה למלך יאשיהו שלח המלך את שפן בן אצליהו בן משלם הספר בית יהוה לאמר
    kjvRefs:
    - 2 Kings 22:3
    kjvOsis:
    - 2Kgs.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
