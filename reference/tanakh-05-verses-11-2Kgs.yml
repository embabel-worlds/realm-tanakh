    ref: 2 Kings 15:20
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 20
    ordinal: 9857
    text: And Menahem exacted the money of Israel, even of all the mighty men of wealth, of each man fifty shekels of silver, to give to the king of Assyria. So the king of Assyria turned back, and stayed not there in the land.
    translation: JPS 1917
    original: וַיֹּצֵא מְנַחֵם אֶת־הַכֶּסֶף עַל־יִשְׂרָאֵל עַל כָּל־גִּבּוֹרֵי הַחַיִל לָתֵת לְמֶלֶךְ אַשּׁוּר חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד וַיָּשָׁב מֶלֶךְ אַשּׁוּר וְלֹא־עָמַד שָׁם בָּאָרֶץ׃
    hebrewPlain: ויצא מנחם את הכסף על ישראל על כל גבורי החיל לתת למלך אשור חמשים שקלים כסף לאיש אחד וישב מלך אשור ולא עמד שם בארץ
    kjvRefs:
