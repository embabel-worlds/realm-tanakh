    scripture: tanakh
    name: Tanakh 2 Kings 15:2
    ref: 2 Kings 15:2
    book: 2Kgs
    section: neviim
    chapter: 15
    verse: 2
    ordinal: 9839
    text: Sixteen years old was he when he began to reign; and he reigned two and fifty years in Jerusalem; and his mother’s name was Jecoliah of Jerusalem.
    translation: JPS 1917
    original: בֶּן־שֵׁשׁ עֶשְׂרֵה שָׁנָה הָיָה בְמָלְכוֹ וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ יְכָלְיָהוּ מִירוּשָׁלִָם׃
    hebrewPlain: בן שש עשרה שנה היה במלכו וחמשים ושתים שנה מלך בירושלם ושם אמו יכליהו מירושלם
    kjvRefs:
