- type: TanakhVerse
  data:
    osis: 2Kgs.22.8
    scripture: tanakh
    name: Tanakh 2 Kings 22:8
    ref: 2 Kings 22:8
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 8
    ordinal: 10065
    text: 'And Hilkiah the high priest said unto Shaphan the scribe: ‘I have found the book of the Law in the house of the LORD.’ And Hilkiah delivered the book to Shaphan, and he read it.'
    translation: JPS 1917
    original: וַיֹּאמֶר חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל עַל־שָׁפָן הַסֹּפֵר סֵפֶר הַתּוֹרָה מָצָאתִי בְּבֵית יְהוָה וַיִּתֵּן חִלְקִיָּה אֶת־הַסֵּפֶר אֶל־שָׁפָן וַיִּקְרָאֵהוּ׃
    hebrewPlain: ויאמר חלקיהו הכהן הגדול על שפן הספר ספר התורה מצאתי בבית יהוה ויתן חלקיה את הספר אל שפן ויקראהו
    kjvRefs:
    - 2 Kings 22:8
    kjvOsis:
    - 2Kgs.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.9
    scripture: tanakh
    name: Tanakh 2 Kings 22:9
    ref: 2 Kings 22:9
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 9
    ordinal: 10066
    text: 'And Shaphan the scribe came to the king, and brought back word unto the king, and said: ‘Thy servants have poured out the money that was found in the house, and have delivered it into the hand of the workmen that have the oversight of the house of the LORD.’'
    translation: JPS 1917
    original: וַיָּבֹא שָׁפָן הַסֹּפֵר אֶל־הַמֶּלֶךְ וַיָּשֶׁב אֶת־הַמֶּלֶךְ דָּבָר וַיֹּאמֶר הִתִּיכוּ עֲבָדֶיךָ אֶת־הַכֶּסֶף הַנִּמְצָא בַבַּיִת וַיִּתְּנֻהוּ עַל־יַד עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים בֵּית יְהוָה׃
    hebrewPlain: ויבא שפן הספר אל המלך וישב את המלך דבר ויאמר התיכו עבדיך את הכסף הנמצא בבית ויתנהו על יד עשי המלאכה המפקדים בית יהוה
    kjvRefs:
    - 2 Kings 22:9
    kjvOsis:
    - 2Kgs.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.10
    scripture: tanakh
    name: Tanakh 2 Kings 22:10
    ref: 2 Kings 22:10
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 10
    ordinal: 10067
    text: 'And Shaphan the scribe told the king, saying: ‘Hilkiah the priest hath delivered me a book.’ And Shaphan read it before the king.'
    translation: JPS 1917
    original: וַיַּגֵּד שָׁפָן הַסֹּפֵר לַמֶּלֶךְ לֵאמֹר סֵפֶר נָתַן לִי חִלְקִיָּה הַכֹּהֵן וַיִּקְרָאֵהוּ שָׁפָן לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויגד שפן הספר למלך לאמר ספר נתן לי חלקיה הכהן ויקראהו שפן לפני המלך
    kjvRefs:
    - 2 Kings 22:10
    kjvOsis:
    - 2Kgs.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.11
    scripture: tanakh
    name: Tanakh 2 Kings 22:11
    ref: 2 Kings 22:11
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 11
    ordinal: 10068
    text: And it came to pass, when the king had heard the words of the book of the Law, that he rent his clothes.
    translation: JPS 1917
    original: וַיְהִי כִּשְׁמֹעַ הַמֶּלֶךְ אֶת־דִּבְרֵי סֵפֶר הַתּוֹרָה וַיִּקְרַע אֶת־בְּגָדָיו׃
    hebrewPlain: ויהי כשמע המלך את דברי ספר התורה ויקרע את בגדיו
    kjvRefs:
    - 2 Kings 22:11
    kjvOsis:
    - 2Kgs.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.12
    scripture: tanakh
    name: Tanakh 2 Kings 22:12
    ref: 2 Kings 22:12
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 12
    ordinal: 10069
    text: 'And the king commanded Hilkiah the priest, and Ahikam the son of Shaphan, and Achbor the son of Micaiah, and Shaphan the scribe, and Asaiah the king’s servant, saying:'
    translation: JPS 1917
    original: וַיְצַו הַמֶּלֶךְ אֶת־חִלְקִיָּה הַכֹּהֵן וְאֶת־אֲחִיקָם בֶּן־שָׁפָן וְאֶת־עַכְבּוֹר בֶּן־מִיכָיָה וְאֵת שָׁפָן הַסֹּפֵר וְאֵת עֲשָׂיָה עֶבֶד־הַמֶּלֶךְ לֵאמֹר׃
    hebrewPlain: ויצו המלך את חלקיה הכהן ואת אחיקם בן שפן ואת עכבור בן מיכיה ואת שפן הספר ואת עשיה עבד המלך לאמר
    kjvRefs:
    - 2 Kings 22:12
    kjvOsis:
    - 2Kgs.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.13
    scripture: tanakh
    name: Tanakh 2 Kings 22:13
    ref: 2 Kings 22:13
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 13
    ordinal: 10070
    text: ’Go ye, inquire of the LORD for me, and for the people, and for all Judah, concerning the words of this book that is found; for great is the wrath of the LORD that is kindled against us, because our fathers have not hearkened unto the words of this book, to do according unto all that which is written concerning us.’
    translation: JPS 1917
    original: לְכוּ דִרְשׁוּ אֶת־יְהוָה בַּעֲדִי וּבְעַד־הָעָם וּבְעַד כָּל־יְהוּדָה עַל־דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה כִּי־גְדוֹלָה חֲמַת יְהוָה אֲשֶׁר־הִיא נִצְּתָה בָנוּ עַל אֲשֶׁר לֹא־שָׁמְעוּ אֲבֹתֵינוּ עַל־דִּבְרֵי הַסֵּפֶר הַזֶּה לַעֲשׂוֹת כְּכָל־הַכָּתוּב עָלֵינוּ׃
    hebrewPlain: לכו דרשו את יהוה בעדי ובעד העם ובעד כל יהודה על דברי הספר הנמצא הזה כי גדולה חמת יהוה אשר היא נצתה בנו על אשר לא שמעו אבתינו על דברי הספר הזה לעשות ככל הכתוב עלינו
    kjvRefs:
    - 2 Kings 22:13
    kjvOsis:
    - 2Kgs.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.14
    scripture: tanakh
    name: Tanakh 2 Kings 22:14
    ref: 2 Kings 22:14
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 14
    ordinal: 10071
    text: So Hilkiah the priest, and Ahikam, and Achbor, and Shaphan, and Asaiah, went unto Huldah the prophetess, the wife of Shallum the son of Tikvah, the son of Harhas, keeper of the wardrobe—now she dwelt in Jerusalem in the second quarter—and they spoke with her.
    translation: JPS 1917
    original: וַיֵּלֶךְ חִלְקִיָּהוּ הַכֹּהֵן וַאֲחִיקָם וְעַכְבּוֹר וְשָׁפָן וַעֲשָׂיָה אֶל־חֻלְדָּה הַנְּבִיאָה אֵשֶׁת שַׁלֻּם בֶּן־תִּקְוָה בֶּן־חַרְחַס שֹׁמֵר הַבְּגָדִים וְהִיא יֹשֶׁבֶת בִּירוּשָׁלִַם בַּמִּשְׁנֶה וַיְדַבְּרוּ אֵלֶיהָ׃
    hebrewPlain: וילך חלקיהו הכהן ואחיקם ועכבור ושפן ועשיה אל חלדה הנביאה אשת שלם בן תקוה בן חרחס שמר הבגדים והיא ישבת בירושלם במשנה וידברו אליה
    kjvRefs:
    - 2 Kings 22:14
    kjvOsis:
    - 2Kgs.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.15
    scripture: tanakh
    name: Tanakh 2 Kings 22:15
    ref: 2 Kings 22:15
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 15
    ordinal: 10072
    text: 'And she said unto them: ‘Thus saith the LORD, the God of Israel: Tell ye the man that sent you unto me:'
    translation: JPS 1917
    original: וַתֹּאמֶר אֲלֵיהֶם כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל אִמְרוּ לָאִישׁ אֲשֶׁר־שָׁלַח אֶתְכֶם אֵלָי׃
    hebrewPlain: ותאמר אליהם כה אמר יהוה אלהי ישראל אמרו לאיש אשר שלח אתכם אלי
    kjvRefs:
    - 2 Kings 22:15
    kjvOsis:
    - 2Kgs.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.16
    scripture: tanakh
    name: Tanakh 2 Kings 22:16
    ref: 2 Kings 22:16
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 16
    ordinal: 10073
    text: 'Thus saith the LORD: Behold, I will bring evil upon this place, and upon the inhabitants thereof, even all the words of the book which the king of Judah hath read;'
    translation: JPS 1917
    original: כֹּה אָמַר יְהוָה הִנְנִי מֵבִיא רָעָה אֶל־הַמָּקוֹם הַזֶּה וְעַל־יֹשְׁבָיו אֵת כָּל־דִּבְרֵי הַסֵּפֶר אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה׃
    hebrewPlain: כה אמר יהוה הנני מביא רעה אל המקום הזה ועל ישביו את כל דברי הספר אשר קרא מלך יהודה
    kjvRefs:
    - 2 Kings 22:16
    kjvOsis:
    - 2Kgs.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.17
    scripture: tanakh
    name: Tanakh 2 Kings 22:17
    ref: 2 Kings 22:17
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 17
    ordinal: 10074
    text: because they have forsaken Me, and have offered unto other gods, that they might provoke Me with all the work of their hands; therefore My wrath shall be kindled against this place, and it shall not be quenched.
    translation: JPS 1917
    original: תַּחַת אֲשֶׁר עֲזָבוּנִי וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים לְמַעַן הַכְעִיסֵנִי בְּכֹל מַעֲשֵׂה יְדֵיהֶם וְנִצְּתָה חֲמָתִי בַּמָּקוֹם הַזֶּה וְלֹא תִכְבֶּה׃
    hebrewPlain: תחת אשר עזבוני ויקטרו לאלהים אחרים למען הכעיסני בכל מעשה ידיהם ונצתה חמתי במקום הזה ולא תכבה
    kjvRefs:
    - 2 Kings 22:17
    kjvOsis:
    - 2Kgs.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.18
    scripture: tanakh
    name: Tanakh 2 Kings 22:18
    ref: 2 Kings 22:18
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 18
    ordinal: 10075
    text: 'But unto the king of Judah, who sent you to inquire of the LORD, thus shall ye say to him: Thus saith the LORD, the God of Israel: As touching the words which thou hast heard,'
    translation: JPS 1917
    original: וְאֶל־מֶלֶךְ יְהוּדָה הַשֹּׁלֵחַ אֶתְכֶם לִדְרֹשׁ אֶת־יְהוָה כֹּה תֹאמְרוּ אֵלָיו כֹּה־אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ׃
    hebrewPlain: ואל מלך יהודה השלח אתכם לדרש את יהוה כה תאמרו אליו כה אמר יהוה אלהי ישראל הדברים אשר שמעת
    kjvRefs:
    - 2 Kings 22:18
    kjvOsis:
    - 2Kgs.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.19
    scripture: tanakh
    name: Tanakh 2 Kings 22:19
    ref: 2 Kings 22:19
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 19
    ordinal: 10076
    text: because thy heart was tender, and thou didst humble thyself before the LORD, when thou heardest what I spoke against this place, and against the inhabitants thereof, that they should become an astonishment and a curse, and hast rent thy clothes, and wept before Me, I also have heard thee, saith the LORD.
    translation: JPS 1917
    original: יַעַן רַךְ־לְבָבְךָ וַתִּכָּנַע מִפְּנֵי יְהוָה בְּשָׁמְעֲךָ אֲשֶׁר דִּבַּרְתִּי עַל־הַמָּקוֹם הַזֶּה וְעַל־יֹשְׁבָיו לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה וַתִּקְרַע אֶת־בְּגָדֶיךָ וַתִּבְכֶּה לְפָנָי וְגַם אָנֹכִי שָׁמַעְתִּי נְאֻם־יְהוָה׃
    hebrewPlain: יען רך לבבך ותכנע מפני יהוה בשמעך אשר דברתי על המקום הזה ועל ישביו להיות לשמה ולקללה ותקרע את בגדיך ותבכה לפני וגם אנכי שמעתי נאם יהוה
    kjvRefs:
    - 2 Kings 22:19
    kjvOsis:
    - 2Kgs.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.22.20
    scripture: tanakh
    name: Tanakh 2 Kings 22:20
    ref: 2 Kings 22:20
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 20
    ordinal: 10077
    text: Therefore, behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil which I will bring upon this place.’ And they brought back word unto the king.
    translation: JPS 1917
    original: לָכֵן הִנְנִי אֹסִפְךָ עַל־אֲבֹתֶיךָ וְנֶאֱסַפְתָּ אֶל־קִבְרֹתֶיךָ בְּשָׁלוֹם וְלֹא־תִרְאֶינָה עֵינֶיךָ בְּכֹל הָרָעָה אֲשֶׁר־אֲנִי מֵבִיא עַל־הַמָּקוֹם הַזֶּה וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר׃
    hebrewPlain: לכן הנני אספך על אבתיך ונאספת אל קברתיך בשלום ולא תראינה עיניך בכל הרעה אשר אני מביא על המקום הזה וישיבו את המלך דבר
    kjvRefs:
    - 2 Kings 22:20
    kjvOsis:
    - 2Kgs.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.22
- type: TanakhVerse
  data:
    osis: 2Kgs.23.1
    scripture: tanakh
    name: Tanakh 2 Kings 23:1
    ref: 2 Kings 23:1
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 1
    ordinal: 10078
    text: And the king sent, and they gathered unto him all the elders of Judah and of Jerusalem.
    translation: JPS 1917
    original: וַיִּשְׁלַח הַמֶּלֶךְ וַיַּאַסְפוּ אֵלָיו כָּל־זִקְנֵי יְהוּדָה וִירוּשָׁלִָם׃
    hebrewPlain: וישלח המלך ויאספו אליו כל זקני יהודה וירושלם
    kjvRefs:
    - 2 Kings 23:1
    kjvOsis:
    - 2Kgs.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.2
    scripture: tanakh
    name: Tanakh 2 Kings 23:2
    ref: 2 Kings 23:2
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 2
    ordinal: 10079
    text: And the king went up to the house of the LORD, and all the men of Judah and all the inhabitants of Jerusalem with him, and the priests, and the prophets, and all the people, both small and great; and he read in their ears all the words of the book of the covenant which was found in the house of the LORD.
    translation: JPS 1917
    original: וַיַּעַל הַמֶּלֶךְ בֵּית־יְהוָה וְכָל־אִישׁ יְהוּדָה וְכָל־יֹשְׁבֵי יְרוּשָׁלִַם אִתּוֹ וְהַכֹּהֲנִים וְהַנְּבִיאִים וְכָל־הָעָם לְמִקָּטֹן וְעַד־גָּדוֹל וַיִּקְרָא בְאָזְנֵיהֶם אֶת־כָּל־דִּבְרֵי סֵפֶר הַבְּרִית הַנִּמְצָא בְּבֵית יְהוָה׃
    hebrewPlain: ויעל המלך בית יהוה וכל איש יהודה וכל ישבי ירושלם אתו והכהנים והנביאים וכל העם למקטן ועד גדול ויקרא באזניהם את כל דברי ספר הברית הנמצא בבית יהוה
    kjvRefs:
    - 2 Kings 23:2
    kjvOsis:
    - 2Kgs.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.3
    scripture: tanakh
    name: Tanakh 2 Kings 23:3
    ref: 2 Kings 23:3
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 3
    ordinal: 10080
    text: And the king stood on the platform, and made a covenant before the LORD, to walk after the LORD, and to keep His commandments, and His testimonies, and His statutes, with all his heart, and all his soul, to confirm the words of this covenant that were written in this book; and all the people stood to the covenant.
    translation: JPS 1917
    original: וַיַּעֲמֹד הַמֶּלֶךְ עַל־הָעַמּוּד וַיִּכְרֹת אֶת־הַבְּרִית לִפְנֵי יְהוָה לָלֶכֶת אַחַר יְהוָה וְלִשְׁמֹר מִצְוֺתָיו וְאֶת־עֵדְוֺתָיו וְאֶת־חֻקֹּתָיו בְּכָל־לֵב וּבְכָל־נֶפֶשׁ לְהָקִים אֶת־דִּבְרֵי הַבְּרִית הַזֹּאת הַכְּתֻבִים עַל־הַסֵּפֶר הַזֶּה וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית׃
    hebrewPlain: ויעמד המלך על העמוד ויכרת את הברית לפני יהוה ללכת אחר יהוה ולשמר מצותיו ואת עדותיו ואת חקתיו בכל לב ובכל נפש להקים את דברי הברית הזאת הכתבים על הספר הזה ויעמד כל העם בברית
    kjvRefs:
    - 2 Kings 23:3
    kjvOsis:
    - 2Kgs.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.4
    scripture: tanakh
    name: Tanakh 2 Kings 23:4
    ref: 2 Kings 23:4
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 4
    ordinal: 10081
    text: And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the Asherah, and for all the host of heaven; and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them unto Beth-el.
    translation: JPS 1917
    original: וַיְצַו הַמֶּלֶךְ אֶת־חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל וְאֶת־כֹּהֲנֵי הַמִּשְׁנֶה וְאֶת־שֹׁמְרֵי הַסַּף לְהוֹצִיא מֵהֵיכַל יְהוָה אֵת כָּל־הַכֵּלִים הָעֲשׂוּיִם לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם וַיִּשְׂרְפֵם מִחוּץ לִירוּשָׁלִַם בְּשַׁדְמוֹת קִדְרוֹן וְנָשָׂא אֶת־עֲפָרָם בֵּית־אֵל׃
    hebrewPlain: ויצו המלך את חלקיהו הכהן הגדול ואת כהני המשנה ואת שמרי הסף להוציא מהיכל יהוה את כל הכלים העשוים לבעל ולאשרה ולכל צבא השמים וישרפם מחוץ לירושלם בשדמות קדרון ונשא את עפרם בית אל
    kjvRefs:
    - 2 Kings 23:4
    kjvOsis:
    - 2Kgs.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.5
    scripture: tanakh
    name: Tanakh 2 Kings 23:5
    ref: 2 Kings 23:5
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 5
    ordinal: 10082
    text: And he put down the idolatrous priests, whom the kings of Judah had ordained to offer in the high places in the cities of Judah, and in the places round about Jerusalem; them also that offered unto Baal, to the sun, and to the moon, and to the constellations, and to all the host of heaven.
    translation: JPS 1917
    original: וְהִשְׁבִּית אֶת־הַכְּמָרִים אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה וַיְקַטֵּר בַּבָּמוֹת בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם וְאֶת־הַמְקַטְּרִים לַבַּעַל לַשֶּׁמֶשׁ וְלַיָּרֵחַ וְלַמַּזָּלוֹת וּלְכֹל צְבָא הַשָּׁמָיִם׃
    hebrewPlain: והשבית את הכמרים אשר נתנו מלכי יהודה ויקטר בבמות בערי יהודה ומסבי ירושלם ואת המקטרים לבעל לשמש ולירח ולמזלות ולכל צבא השמים
    kjvRefs:
    - 2 Kings 23:5
    kjvOsis:
    - 2Kgs.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.6
    scripture: tanakh
    name: Tanakh 2 Kings 23:6
    ref: 2 Kings 23:6
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 6
    ordinal: 10083
    text: And he brought out the Asherah from the house of the LORD, without Jerusalem, unto the brook Kidron, and burned it at the brook Kidron, and stamped it small to powder, and cast the powder thereof upon the graves of the common people.
    translation: JPS 1917
    original: וַיֹּצֵא אֶת־הָאֲשֵׁרָה מִבֵּית יְהוָה מִחוּץ לִירוּשָׁלִַם אֶל־נַחַל קִדְרוֹן וַיִּשְׂרֹף אֹתָהּ בְּנַחַל קִדְרוֹן וַיָּדֶק לְעָפָר וַיַּשְׁלֵךְ אֶת־עֲפָרָהּ עַל־קֶבֶר בְּנֵי הָעָם׃
    hebrewPlain: ויצא את האשרה מבית יהוה מחוץ לירושלם אל נחל קדרון וישרף אתה בנחל קדרון וידק לעפר וישלך את עפרה על קבר בני העם
    kjvRefs:
    - 2 Kings 23:6
    kjvOsis:
    - 2Kgs.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.7
    scripture: tanakh
    name: Tanakh 2 Kings 23:7
    ref: 2 Kings 23:7
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 7
    ordinal: 10084
    text: And he broke down the houses of the sodomites, that were in the house of the LORD, where the women wove coverings for the Asherah.
    translation: JPS 1917
    original: וַיִּתֹּץ אֶת־בָּתֵּי הַקְּדֵשִׁים אֲשֶׁר בְּבֵית יְהוָה אֲשֶׁר הַנָּשִׁים אֹרְגוֹת שָׁם בָּתִּים לָאֲשֵׁרָה׃
    hebrewPlain: ויתץ את בתי הקדשים אשר בבית יהוה אשר הנשים ארגות שם בתים לאשרה
    kjvRefs:
    - 2 Kings 23:7
    kjvOsis:
    - 2Kgs.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.8
    scripture: tanakh
    name: Tanakh 2 Kings 23:8
    ref: 2 Kings 23:8
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 8
    ordinal: 10085
    text: And he brought all the priests out of the cities of Judah, and defiled the high places where the priests had made offerings, from Geba to Beer-sheba; and he broke down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city, which were on a man’s left hand as he entered the gate of the city.
    translation: JPS 1917
    original: וַיָּבֵא אֶת־כָּל־הַכֹּהֲנִים מֵעָרֵי יְהוּדָה וַיְטַמֵּא אֶת־הַבָּמוֹת אֲשֶׁר קִטְּרוּ־שָׁמָּה הַכֹּהֲנִים מִגֶּבַע עַד־בְּאֵר שָׁבַע וְנָתַץ אֶת־בָּמוֹת הַשְּׁעָרִים אֲשֶׁר־פֶּתַח שַׁעַר יְהוֹשֻׁעַ שַׂר־הָעִיר אֲשֶׁר־עַל־שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר׃
    hebrewPlain: ויבא את כל הכהנים מערי יהודה ויטמא את הבמות אשר קטרו שמה הכהנים מגבע עד באר שבע ונתץ את במות השערים אשר פתח שער יהושע שר העיר אשר על שמאול איש בשער העיר
    kjvRefs:
    - 2 Kings 23:8
    kjvOsis:
    - 2Kgs.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.9
    scripture: tanakh
    name: Tanakh 2 Kings 23:9
    ref: 2 Kings 23:9
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 9
    ordinal: 10086
    text: Nevertheless the priests of the high places came not up to the altar of the LORD in Jerusalem, but they did eat unleavened bread among their brethren.
    translation: JPS 1917
    original: אַךְ לֹא יַעֲלוּ כֹּהֲנֵי הַבָּמוֹת אֶל־מִזְבַּח יְהוָה בִּירוּשָׁלִָם כִּי אִם־אָכְלוּ מַצּוֹת בְּתוֹךְ אֲחֵיהֶם׃
    hebrewPlain: אך לא יעלו כהני הבמות אל מזבח יהוה בירושלם כי אם אכלו מצות בתוך אחיהם
    kjvRefs:
    - 2 Kings 23:9
    kjvOsis:
    - 2Kgs.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.10
    scripture: tanakh
    name: Tanakh 2 Kings 23:10
    ref: 2 Kings 23:10
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 10
    ordinal: 10087
    text: And he defiled Topheth, which is in the valley of the son of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.
    translation: JPS 1917
    original: וְטִמֵּא אֶת־הַתֹּפֶת אֲשֶׁר בְּגֵי בני־[בֶן־] הִנֹּם לְבִלְתִּי לְהַעֲבִיר אִישׁ אֶת־בְּנוֹ וְאֶת־בִּתּוֹ בָּאֵשׁ לַמֹּלֶךְ׃
    hebrewPlain: וטמא את התפת אשר בגי בני [בן ] הנם לבלתי להעביר איש את בנו ואת בתו באש למלך
    kjvRefs:
    - 2 Kings 23:10
    kjvOsis:
    - 2Kgs.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.11
    scripture: tanakh
    name: Tanakh 2 Kings 23:11
    ref: 2 Kings 23:11
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 11
    ordinal: 10088
    text: And he took away the horses that the kings of Judah had given to the sun, at the entrance of the house of the LORD, by the chamber of Nethan-melech the officer, which was in the precincts; and he burned the chariots of the sun with fire.
    translation: JPS 1917
    original: וַיַּשְׁבֵּת אֶת־הַסּוּסִים אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ מִבֹּא בֵית־יְהוָה אֶל־לִשְׁכַּת נְתַן־מֶלֶךְ הַסָּרִיס אֲשֶׁר בַּפַּרְוָרִים וְאֶת־מַרְכְּבוֹת הַשֶּׁמֶשׁ שָׂרַף בָּאֵשׁ׃
    hebrewPlain: וישבת את הסוסים אשר נתנו מלכי יהודה לשמש מבא בית יהוה אל לשכת נתן מלך הסריס אשר בפרורים ואת מרכבות השמש שרף באש
    kjvRefs:
    - 2 Kings 23:11
    kjvOsis:
    - 2Kgs.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.12
    scripture: tanakh
    name: Tanakh 2 Kings 23:12
    ref: 2 Kings 23:12
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 12
    ordinal: 10089
    text: And the altars that were on the roof of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king break down, and beat them down from thence, and cast the dust of them into the brook Kidron.
    translation: JPS 1917
    original: וְאֶת־הַמִּזְבְּחוֹת אֲשֶׁר עַל־הַגָּג עֲלִיַּת אָחָז אֲשֶׁר־עָשׂוּ מַלְכֵי יְהוּדָה וְאֶת־הַמִּזְבְּחוֹת אֲשֶׁר־עָשָׂה מְנַשֶּׁה בִּשְׁתֵּי חַצְרוֹת בֵּית־יְהוָה נָתַץ הַמֶּלֶךְ וַיָּרָץ מִשָּׁם וְהִשְׁלִיךְ אֶת־עֲפָרָם אֶל־נַחַל קִדְרוֹן׃
    hebrewPlain: ואת המזבחות אשר על הגג עלית אחז אשר עשו מלכי יהודה ואת המזבחות אשר עשה מנשה בשתי חצרות בית יהוה נתץ המלך וירץ משם והשליך את עפרם אל נחל קדרון
    kjvRefs:
    - 2 Kings 23:12
    kjvOsis:
    - 2Kgs.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.13
    scripture: tanakh
    name: Tanakh 2 Kings 23:13
    ref: 2 Kings 23:13
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 13
    ordinal: 10090
    text: And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the detestation of the Zidonians, and for Chemosh the detestation of Moab, and for Milcom the abomination of the children of Ammon, did the king defile.
    translation: JPS 1917
    original: וְאֶת־הַבָּמוֹת אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִַם אֲשֶׁר מִימִין לְהַר־הַמַּשְׁחִית אֲשֶׁר בָּנָה שְׁלֹמֹה מֶלֶךְ־יִשְׂרָאֵל לְעַשְׁתֹּרֶת שִׁקֻּץ צִידֹנִים וְלִכְמוֹשׁ שִׁקֻּץ מוֹאָב וּלְמִלְכֹּם תּוֹעֲבַת בְּנֵי־עַמּוֹן טִמֵּא הַמֶּלֶךְ׃
    hebrewPlain: ואת הבמות אשר על פני ירושלם אשר מימין להר המשחית אשר בנה שלמה מלך ישראל לעשתרת שקץ צידנים ולכמוש שקץ מואב ולמלכם תועבת בני עמון טמא המלך
    kjvRefs:
    - 2 Kings 23:13
    kjvOsis:
    - 2Kgs.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.14
    scripture: tanakh
    name: Tanakh 2 Kings 23:14
    ref: 2 Kings 23:14
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 14
    ordinal: 10091
    text: And he broke in pieces the pillars, and cut down the Asherim, and filled their places with the bones of men.
    translation: JPS 1917
    original: וְשִׁבַּר אֶת־הַמַּצֵּבוֹת וַיִּכְרֹת אֶת־הָאֲשֵׁרִים וַיְמַלֵּא אֶת־מְקוֹמָם עַצְמוֹת אָדָם׃
    hebrewPlain: ושבר את המצבות ויכרת את האשרים וימלא את מקומם עצמות אדם
    kjvRefs:
    - 2 Kings 23:14
    kjvOsis:
    - 2Kgs.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.15
    scripture: tanakh
    name: Tanakh 2 Kings 23:15
    ref: 2 Kings 23:15
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 15
    ordinal: 10092
    text: Moreover the altar that was at Beth-el, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, even that altar and the high place he broke down; and he burned the high place and stamped it small to powder, and burned the Asherah.
    translation: JPS 1917
    original: וְגַם אֶת־הַמִּזְבֵּחַ אֲשֶׁר בְּבֵית־אֵל הַבָּמָה אֲשֶׁר עָשָׂה יָרָבְעָם בֶּן־נְבָט אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל גַּם אֶת־הַמִּזְבֵּחַ הַהוּא וְאֶת־הַבָּמָה נָתָץ וַיִּשְׂרֹף אֶת־הַבָּמָה הֵדַק לְעָפָר וְשָׂרַף אֲשֵׁרָה׃
    hebrewPlain: וגם את המזבח אשר בבית אל הבמה אשר עשה ירבעם בן נבט אשר החטיא את ישראל גם את המזבח ההוא ואת הבמה נתץ וישרף את הבמה הדק לעפר ושרף אשרה
    kjvRefs:
    - 2 Kings 23:15
    kjvOsis:
    - 2Kgs.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.16
    scripture: tanakh
    name: Tanakh 2 Kings 23:16
    ref: 2 Kings 23:16
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 16
    ordinal: 10093
    text: And as Josiah turned himself, he spied the sepulchres that were there in the mount; and he sent, and took the bones out of the sepulchres, and burned them upon the altar, and defiled it, according to the word of the LORD which the man of God proclaimed, who proclaimed these things.
    translation: JPS 1917
    original: וַיִּפֶן יֹאשִׁיָּהוּ וַיַּרְא אֶת־הַקְּבָרִים אֲשֶׁר־שָׁם בָּהָר וַיִּשְׁלַח וַיִּקַּח אֶת־הָעֲצָמוֹת מִן־הַקְּבָרִים וַיִּשְׂרֹף עַל־הַמִּזְבֵּחַ וַיְטַמְּאֵהוּ כִּדְבַר יְהוָה אֲשֶׁר קָרָא אִישׁ הָאֱלֹהִים אֲשֶׁר קָרָא אֶת־הַדְּבָרִים הָאֵלֶּה׃
    hebrewPlain: ויפן יאשיהו וירא את הקברים אשר שם בהר וישלח ויקח את העצמות מן הקברים וישרף על המזבח ויטמאהו כדבר יהוה אשר קרא איש האלהים אשר קרא את הדברים האלה
    kjvRefs:
    - 2 Kings 23:16
    kjvOsis:
    - 2Kgs.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.17
    scripture: tanakh
    name: Tanakh 2 Kings 23:17
    ref: 2 Kings 23:17
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 17
    ordinal: 10094
    text: 'Then he said: ‘What monument is that which I see’And the men of the city told him: ‘It is the sepulchre of the man of God, who came from Judah, and proclaimed these things that thou hast done against the altar of Beth-el.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מָה הַצִּיּוּן הַלָּז אֲשֶׁר אֲנִי רֹאֶה וַיֹּאמְרוּ אֵלָיו אַנְשֵׁי הָעִיר הַקֶּבֶר אִישׁ־הָאֱלֹהִים אֲשֶׁר־בָּא מִיהוּדָה וַיִּקְרָא אֶת־הַדְּבָרִים הָאֵלֶּה אֲשֶׁר עָשִׂיתָ עַל הַמִּזְבַּח בֵּית־אֵל׃
    hebrewPlain: ויאמר מה הציון הלז אשר אני ראה ויאמרו אליו אנשי העיר הקבר איש האלהים אשר בא מיהודה ויקרא את הדברים האלה אשר עשית על המזבח בית אל
    kjvRefs:
    - 2 Kings 23:17
    kjvOsis:
    - 2Kgs.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.18
    scripture: tanakh
    name: Tanakh 2 Kings 23:18
    ref: 2 Kings 23:18
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 18
    ordinal: 10095
    text: 'And he said: ‘Let him be; let no man move his bones.’ So they let his bones alone, with the bones of the prophet that came out of Samaria.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַנִּיחוּ לוֹ אִישׁ אַל־יָנַע עַצְמֹתָיו וַיְמַלְּטוּ עַצְמֹתָיו אֵת עַצְמוֹת הַנָּבִיא אֲשֶׁר־בָּא מִשֹּׁמְרוֹן׃
    hebrewPlain: ויאמר הניחו לו איש אל ינע עצמתיו וימלטו עצמתיו את עצמות הנביא אשר בא משמרון
    kjvRefs:
    - 2 Kings 23:18
    kjvOsis:
    - 2Kgs.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.19
    scripture: tanakh
    name: Tanakh 2 Kings 23:19
    ref: 2 Kings 23:19
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 19
    ordinal: 10096
    text: And all the houses also of the high places that were in the cities of Samaria, which the kings of Israel had made to provoke [the LORD], Josiah took away, and did to them according to all the acts that he had done in Beth-el.
    translation: JPS 1917
    original: וְגַם אֶת־כָּל־בָּתֵּי הַבָּמוֹת אֲשֶׁר בְּעָרֵי שֹׁמְרוֹן אֲשֶׁר עָשׂוּ מַלְכֵי יִשְׂרָאֵל לְהַכְעִיס הֵסִיר יֹאשִׁיָּהוּ וַיַּעַשׂ לָהֶם כְּכָל־הַמַּעֲשִׂים אֲשֶׁר עָשָׂה בְּבֵית־אֵל׃
    hebrewPlain: וגם את כל בתי הבמות אשר בערי שמרון אשר עשו מלכי ישראל להכעיס הסיר יאשיהו ויעש להם ככל המעשים אשר עשה בבית אל
    kjvRefs:
    - 2 Kings 23:19
    kjvOsis:
    - 2Kgs.23.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.20
    scripture: tanakh
    name: Tanakh 2 Kings 23:20
    ref: 2 Kings 23:20
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 20
    ordinal: 10097
    text: And he slew all the priests of the high places that were there, upon the altars, and burned men’s bones upon them; and he returned to Jerusalem.
    translation: JPS 1917
    original: וַיִּזְבַּח אֶת־כָּל־כֹּהֲנֵי הַבָּמוֹת אֲשֶׁר־שָׁם עַל־הַמִּזְבְּחוֹת וַיִּשְׂרֹף אֶת־עַצְמוֹת אָדָם עֲלֵיהֶם וַיָּשָׁב יְרוּשָׁלִָם׃
    hebrewPlain: ויזבח את כל כהני הבמות אשר שם על המזבחות וישרף את עצמות אדם עליהם וישב ירושלם
    kjvRefs:
    - 2 Kings 23:20
    kjvOsis:
    - 2Kgs.23.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.21
    scripture: tanakh
    name: Tanakh 2 Kings 23:21
    ref: 2 Kings 23:21
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 21
    ordinal: 10098
    text: 'And the king commanded all the people, saying: ‘Keep the passover unto the LORD your God, as it is written in this book of the covenant.’'
    translation: JPS 1917
    original: וַיְצַו הַמֶּלֶךְ אֶת־כָּל־הָעָם לֵאמֹר עֲשׂוּ פֶסַח לַיהוָה אֱלֹהֵיכֶם כַּכָּתוּב עַל סֵפֶר הַבְּרִית הַזֶּה׃
    hebrewPlain: ויצו המלך את כל העם לאמר עשו פסח ליהוה אלהיכם ככתוב על ספר הברית הזה
    kjvRefs:
    - 2 Kings 23:21
    kjvOsis:
    - 2Kgs.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.22
    scripture: tanakh
    name: Tanakh 2 Kings 23:22
    ref: 2 Kings 23:22
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 22
    ordinal: 10099
    text: For there was not kept such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;
    translation: JPS 1917
    original: כִּי לֹא נַעֲשָׂה כַּפֶּסַח הַזֶּה מִימֵי הַשֹּׁפְטִים אֲשֶׁר שָׁפְטוּ אֶת־יִשְׂרָאֵל וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה׃
    hebrewPlain: כי לא נעשה כפסח הזה מימי השפטים אשר שפטו את ישראל וכל ימי מלכי ישראל ומלכי יהודה
    kjvRefs:
    - 2 Kings 23:22
    kjvOsis:
    - 2Kgs.23.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.23
    scripture: tanakh
    name: Tanakh 2 Kings 23:23
    ref: 2 Kings 23:23
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 23
    ordinal: 10100
    text: but in the eighteenth year of king Josiah was this passover kept to the LORD in Jerusalem.
    translation: JPS 1917
    original: כִּי אִם־בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ נַעֲשָׂה הַפֶּסַח הַזֶּה לַיהוָה בִּירוּשָׁלִָם׃
    hebrewPlain: כי אם בשמנה עשרה שנה למלך יאשיהו נעשה הפסח הזה ליהוה בירושלם
    kjvRefs:
    - 2 Kings 23:23
    kjvOsis:
    - 2Kgs.23.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.24
    scripture: tanakh
    name: Tanakh 2 Kings 23:24
    ref: 2 Kings 23:24
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 24
    ordinal: 10101
    text: Moreover them that divined by a ghost or a familiar spirit, and the teraphim, and the idols, and all the detestable things that were spied in the land of Judah and in Jerusalem, did Josiah put away, that he might confirm the words of the law which were written in the book that Hilkiah the priest found in the house of the LORD.
    translation: JPS 1917
    original: וְגַם אֶת־הָאֹבוֹת וְאֶת־הַיִּדְּעֹנִים וְאֶת־הַתְּרָפִים וְאֶת־הַגִּלֻּלִים וְאֵת כָּל־הַשִּׁקֻּצִים אֲשֶׁר נִרְאוּ בְּאֶרֶץ יְהוּדָה וּבִירוּשָׁלִַם בִּעֵר יֹאשִׁיָּהוּ לְמַעַן הָקִים אֶת־דִּבְרֵי הַתּוֹרָה הַכְּתֻבִים עַל־הַסֵּפֶר אֲשֶׁר מָצָא חִלְקִיָּהוּ הַכֹּהֵן בֵּית יְהוָה׃
    hebrewPlain: וגם את האבות ואת הידענים ואת התרפים ואת הגללים ואת כל השקצים אשר נראו בארץ יהודה ובירושלם בער יאשיהו למען הקים את דברי התורה הכתבים על הספר אשר מצא חלקיהו הכהן בית יהוה
    kjvRefs:
    - 2 Kings 23:24
    kjvOsis:
    - 2Kgs.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.25
    scripture: tanakh
    name: Tanakh 2 Kings 23:25
    ref: 2 Kings 23:25
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 25
    ordinal: 10102
    text: And like unto him was there no king before him, that turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there any like him.
    translation: JPS 1917
    original: וְכָמֹהוּ לֹא־הָיָה לְפָנָיו מֶלֶךְ אֲשֶׁר־שָׁב אֶל־יְהוָה בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ וּבְכָל־מְאֹדוֹ כְּכֹל תּוֹרַת מֹשֶׁה וְאַחֲרָיו לֹא־קָם כָּמֹהוּ׃
    hebrewPlain: וכמהו לא היה לפניו מלך אשר שב אל יהוה בכל לבבו ובכל נפשו ובכל מאדו ככל תורת משה ואחריו לא קם כמהו
    kjvRefs:
    - 2 Kings 23:25
    kjvOsis:
    - 2Kgs.23.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.26
    scripture: tanakh
    name: Tanakh 2 Kings 23:26
    ref: 2 Kings 23:26
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 26
    ordinal: 10103
    text: Notwithstanding the LORD turned not from the fierceness of His great wrath, wherewith His anger was kindled against Judah, because of all the provocations wherewith Manasseh had provoked Him.
    translation: JPS 1917
    original: אַךְ לֹא־שָׁב יְהוָה מֵחֲרוֹן אַפּוֹ הַגָּדוֹל אֲשֶׁר־חָרָה אַפּוֹ בִּיהוּדָה עַל כָּל־הַכְּעָסִים אֲשֶׁר הִכְעִיסוֹ מְנַשֶּׁה׃
    hebrewPlain: אך לא שב יהוה מחרון אפו הגדול אשר חרה אפו ביהודה על כל הכעסים אשר הכעיסו מנשה
    kjvRefs:
    - 2 Kings 23:26
    kjvOsis:
    - 2Kgs.23.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.27
    scripture: tanakh
    name: Tanakh 2 Kings 23:27
    ref: 2 Kings 23:27
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 27
    ordinal: 10104
    text: 'And the LORD said: ‘I will remove Judah also out of My sight, as I have removed Israel, and I will cast off this city which I have chosen, even Jerusalem, and the house of which I said: My name shall be there.’'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה גַּם אֶת־יְהוּדָה אָסִיר מֵעַל פָּנַי כַּאֲשֶׁר הֲסִרֹתִי אֶת־יִשְׂרָאֵל וּמָאַסְתִּי אֶת־הָעִיר הַזֹּאת אֲשֶׁר־בָּחַרְתִּי אֶת־יְרוּשָׁלִַם וְאֶת־הַבַּיִת אֲשֶׁר אָמַרְתִּי יִהְיֶה שְׁמִי שָׁם׃
    hebrewPlain: ויאמר יהוה גם את יהודה אסיר מעל פני כאשר הסרתי את ישראל ומאסתי את העיר הזאת אשר בחרתי את ירושלם ואת הבית אשר אמרתי יהיה שמי שם
    kjvRefs:
    - 2 Kings 23:27
    kjvOsis:
    - 2Kgs.23.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.28
    scripture: tanakh
    name: Tanakh 2 Kings 23:28
    ref: 2 Kings 23:28
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 28
    ordinal: 10105
    text: Now the rest of the acts of Josiah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ וְכָל־אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי יאשיהו וכל אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 23:28
    kjvOsis:
    - 2Kgs.23.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.29
    scripture: tanakh
    name: Tanakh 2 Kings 23:29
    ref: 2 Kings 23:29
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 29
    ordinal: 10106
    text: In his days Pharaoh-necoh king of Egypt went up against the king of Assyria to the river Euphrates; and king Josiah went against him; and he slew him at Megiddo, when he had seen him.
    translation: JPS 1917
    original: בְּיָמָיו עָלָה פַרְעֹה נְכֹה מֶלֶךְ־מִצְרַיִם עַל־מֶלֶךְ אַשּׁוּר עַל־נְהַר־פְּרָת וַיֵּלֶךְ הַמֶּלֶךְ יֹאשִׁיָּהוּ לִקְרָאתוֹ וַיְמִיתֵהוּ בִּמְגִדּוֹ כִּרְאֹתוֹ אֹתוֹ׃
    hebrewPlain: בימיו עלה פרעה נכה מלך מצרים על מלך אשור על נהר פרת וילך המלך יאשיהו לקראתו וימיתהו במגדו כראתו אתו
    kjvRefs:
    - 2 Kings 23:29
    kjvOsis:
    - 2Kgs.23.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.30
    scripture: tanakh
    name: Tanakh 2 Kings 23:30
    ref: 2 Kings 23:30
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 30
    ordinal: 10107
    text: And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father’s stead.
    translation: JPS 1917
    original: וַיַּרְכִּבֻהוּ עֲבָדָיו מֵת מִמְּגִדּוֹ וַיְבִאֻהוּ יְרוּשָׁלִַם וַיִּקְבְּרֻהוּ בִּקְבֻרָתוֹ וַיִּקַּח עַם־הָאָרֶץ אֶת־יְהוֹאָחָז בֶּן־יֹאשִׁיָּהוּ וַיִּמְשְׁחוּ אֹתוֹ וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו׃
    hebrewPlain: וירכבהו עבדיו מת ממגדו ויבאהו ירושלם ויקברהו בקברתו ויקח עם הארץ את יהואחז בן יאשיהו וימשחו אתו וימליכו אתו תחת אביו
    kjvRefs:
    - 2 Kings 23:30
    kjvOsis:
    - 2Kgs.23.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.31
    scripture: tanakh
    name: Tanakh 2 Kings 23:31
    ref: 2 Kings 23:31
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 31
    ordinal: 10108
    text: Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem; and his mother’s name was Hamutal the daughter of Jeremiah of Libnah.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה יְהוֹאָחָז בְּמָלְכוֹ וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ חֲמוּטַל בַּת־יִרְמְיָהוּ מִלִּבְנָה׃
    hebrewPlain: בן עשרים ושלש שנה יהואחז במלכו ושלשה חדשים מלך בירושלם ושם אמו חמוטל בת ירמיהו מלבנה
    kjvRefs:
    - 2 Kings 23:31
    kjvOsis:
    - 2Kgs.23.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.32
    scripture: tanakh
    name: Tanakh 2 Kings 23:32
    ref: 2 Kings 23:32
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 32
    ordinal: 10109
    text: And he did that which was evil in the sight of the LORD, according to all that his fathers had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשׂוּ אֲבֹתָיו׃
    hebrewPlain: ויעש הרע בעיני יהוה ככל אשר עשו אבתיו
    kjvRefs:
    - 2 Kings 23:32
    kjvOsis:
    - 2Kgs.23.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.33
    scripture: tanakh
    name: Tanakh 2 Kings 23:33
    ref: 2 Kings 23:33
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 33
    ordinal: 10110
    text: And Pharaoh-necoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem; and put the land to a fine of a hundred talents of silver, and a talent of gold.
    translation: JPS 1917
    original: וַיַּאַסְרֵהוּ פַרְעֹה נְכֹה בְרִבְלָה בְּאֶרֶץ חֲמָת במלך [מִמְּלֹךְ] בִּירוּשָׁלִָם וַיִּתֶּן־עֹנֶשׁ עַל־הָאָרֶץ מֵאָה כִכַּר־כֶּסֶף וְכִכַּר זָהָב׃
    hebrewPlain: ויאסרהו פרעה נכה ברבלה בארץ חמת במלך [ממלך] בירושלם ויתן ענש על הארץ מאה ככר כסף וככר זהב
    kjvRefs:
    - 2 Kings 23:33
    kjvOsis:
    - 2Kgs.23.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.34
    scripture: tanakh
    name: Tanakh 2 Kings 23:34
    ref: 2 Kings 23:34
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 34
    ordinal: 10111
    text: And Pharaoh-necoh made Eliakim the son of Josiah king in the room of Josiah his father, and changed his name to Jehoiakim; but he took Jehoahaz away; and he came to Egypt, and died there.
    translation: JPS 1917
    original: וַיַּמְלֵךְ פַּרְעֹה נְכֹה אֶת־אֶלְיָקִים בֶּן־יֹאשִׁיָּהוּ תַּחַת יֹאשִׁיָּהוּ אָבִיו וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים וְאֶת־יְהוֹאָחָז לָקָח וַיָּבֹא מִצְרַיִם וַיָּמָת שָׁם׃
    hebrewPlain: וימלך פרעה נכה את אליקים בן יאשיהו תחת יאשיהו אביו ויסב את שמו יהויקים ואת יהואחז לקח ויבא מצרים וימת שם
    kjvRefs:
    - 2 Kings 23:34
    kjvOsis:
    - 2Kgs.23.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.35
    scripture: tanakh
    name: Tanakh 2 Kings 23:35
    ref: 2 Kings 23:35
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 35
    ordinal: 10112
    text: And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh; he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give it unto Pharaoh-necoh.
    translation: JPS 1917
    original: וְהַכֶּסֶף וְהַזָּהָב נָתַן יְהוֹיָקִים לְפַרְעֹה אַךְ הֶעֱרִיךְ אֶת־הָאָרֶץ לָתֵת אֶת־הַכֶּסֶף עַל־פִּי פַרְעֹה אִישׁ כְּעֶרְכּוֹ נָגַשׂ אֶת־הַכֶּסֶף וְאֶת־הַזָּהָב אֶת־עַם הָאָרֶץ לָתֵת לְפַרְעֹה נְכֹה׃
    hebrewPlain: והכסף והזהב נתן יהויקים לפרעה אך העריך את הארץ לתת את הכסף על פי פרעה איש כערכו נגש את הכסף ואת הזהב את עם הארץ לתת לפרעה נכה
    kjvRefs:
    - 2 Kings 23:35
    kjvOsis:
    - 2Kgs.23.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.36
    scripture: tanakh
    name: Tanakh 2 Kings 23:36
    ref: 2 Kings 23:36
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 36
    ordinal: 10113
    text: Jehoiakim was twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem; and his mother’s name was Zebudah the daughter of Pedaiah of Rumah.
    translation: JPS 1917
    original: בֶּן־עֶשְׂרִים וְחָמֵשׁ שָׁנָה יְהוֹיָקִים בְּמָלְכוֹ וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ זבידה [זְבוּדָּה] בַת־פְּדָיָה מִן־רוּמָה׃
    hebrewPlain: בן עשרים וחמש שנה יהויקים במלכו ואחת עשרה שנה מלך בירושלם ושם אמו זבידה [זבודה] בת פדיה מן רומה
    kjvRefs:
    - 2 Kings 23:36
    kjvOsis:
    - 2Kgs.23.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.23.37
    scripture: tanakh
    name: Tanakh 2 Kings 23:37
    ref: 2 Kings 23:37
    book: 2Kgs
    section: neviim
    chapter: 23
    verse: 37
    ordinal: 10114
    text: And he did that which was evil in the sight of the LORD, according to all that his fathers had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשׂוּ אֲבֹתָיו׃
    hebrewPlain: ויעש הרע בעיני יהוה ככל אשר עשו אבתיו
    kjvRefs:
    - 2 Kings 23:37
    kjvOsis:
    - 2Kgs.23.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.23
- type: TanakhVerse
  data:
    osis: 2Kgs.24.1
    scripture: tanakh
    name: Tanakh 2 Kings 24:1
    ref: 2 Kings 24:1
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 1
    ordinal: 10115
    text: In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years; then he turned and rebelled against him.
    translation: JPS 1917
    original: בְּיָמָיו עָלָה נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל וַיְהִי־לוֹ יְהוֹיָקִים עֶבֶד שָׁלֹשׁ שָׁנִים וַיָּשָׁב וַיִּמְרָד־בּוֹ׃
    hebrewPlain: בימיו עלה נבכדנאצר מלך בבל ויהי לו יהויקים עבד שלש שנים וישב וימרד בו
    kjvRefs:
    - 2 Kings 24:1
    kjvOsis:
    - 2Kgs.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.2
    scripture: tanakh
    name: Tanakh 2 Kings 24:2
    ref: 2 Kings 24:2
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 2
    ordinal: 10116
    text: And the LORD sent against him bands of the Chaldeans, and bands of the Arameans, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the LORD, which He spoke by the hand of His servants the prophets.
    translation: JPS 1917
    original: וַיְשַׁלַּח יְהוָה בּוֹ אֶת־גְּדוּדֵי כַשְׂדִּים וְאֶת־גְּדוּדֵי אֲרָם וְאֵת גְּדוּדֵי מוֹאָב וְאֵת גְּדוּדֵי בְנֵי־עַמּוֹן וַיְשַׁלְּחֵם בִּיהוּדָה לְהַאֲבִידוֹ כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר בְּיַד עֲבָדָיו הַנְּבִיאִים׃
    hebrewPlain: וישלח יהוה בו את גדודי כשדים ואת גדודי ארם ואת גדודי מואב ואת גדודי בני עמון וישלחם ביהודה להאבידו כדבר יהוה אשר דבר ביד עבדיו הנביאים
    kjvRefs:
    - 2 Kings 24:2
    kjvOsis:
    - 2Kgs.24.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.3
    scripture: tanakh
    name: Tanakh 2 Kings 24:3
    ref: 2 Kings 24:3
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 3
    ordinal: 10117
    text: Surely at the commandment of the LORD came this upon Judah, to remove them out of His sight, for the sins of Manasseh, according to all that he did;
    translation: JPS 1917
    original: אַךְ עַל־פִּי יְהוָה הָיְתָה בִּיהוּדָה לְהָסִיר מֵעַל פָּנָיו בְּחַטֹּאת מְנַשֶּׁה כְּכֹל אֲשֶׁר עָשָׂה׃
    hebrewPlain: אך על פי יהוה היתה ביהודה להסיר מעל פניו בחטאת מנשה ככל אשר עשה
    kjvRefs:
    - 2 Kings 24:3
    kjvOsis:
    - 2Kgs.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.4
    scripture: tanakh
    name: Tanakh 2 Kings 24:4
    ref: 2 Kings 24:4
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 4
    ordinal: 10118
    text: and also for the innocent blood that he shed; for he filled Jerusalem with innocent blood; and the LORD would not pardon.
    translation: JPS 1917
    original: וְגַם דַּם־הַנָּקִי אֲשֶׁר שָׁפָךְ וַיְמַלֵּא אֶת־יְרוּשָׁלִַם דָּם נָקִי וְלֹא־אָבָה יְהוָה לִסְלֹחַ׃
    hebrewPlain: וגם דם הנקי אשר שפך וימלא את ירושלם דם נקי ולא אבה יהוה לסלח
    kjvRefs:
    - 2 Kings 24:4
    kjvOsis:
    - 2Kgs.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.5
    scripture: tanakh
    name: Tanakh 2 Kings 24:5
    ref: 2 Kings 24:5
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 5
    ordinal: 10119
    text: Now the rest of the acts of Jehoiakim, and all that he did, are they not written in the book of the chronicles of the kings of Judah?
    translation: JPS 1917
    original: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים וְכָל־אֲשֶׁר עָשָׂה הֲלֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה׃
    hebrewPlain: ויתר דברי יהויקים וכל אשר עשה הלא הם כתובים על ספר דברי הימים למלכי יהודה
    kjvRefs:
    - 2 Kings 24:5
    kjvOsis:
    - 2Kgs.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.6
    scripture: tanakh
    name: Tanakh 2 Kings 24:6
    ref: 2 Kings 24:6
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 6
    ordinal: 10120
    text: So Jehoiakim was buried with his fathers; and Jehoiachin his son reigned in his stead.
    translation: JPS 1917
    original: וַיִּשְׁכַּב יְהוֹיָקִים עִם־אֲבֹתָיו וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו׃
    hebrewPlain: וישכב יהויקים עם אבתיו וימלך יהויכין בנו תחתיו
    kjvRefs:
    - 2 Kings 24:6
    kjvOsis:
    - 2Kgs.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.7
    scripture: tanakh
    name: Tanakh 2 Kings 24:7
    ref: 2 Kings 24:7
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 7
    ordinal: 10121
    text: And the king of Egypt came not again any more out of his land; for the king of Babylon had taken, from the Brook of Egypt unto the river Euphrates, all that pertained to the king of Egypt.
    translation: JPS 1917
    original: וְלֹא־הֹסִיף עוֹד מֶלֶךְ מִצְרַיִם לָצֵאת מֵאַרְצוֹ כִּי־לָקַח מֶלֶךְ בָּבֶל מִנַּחַל מִצְרַיִם עַד־נְהַר־פְּרָת כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרָיִם׃
    hebrewPlain: ולא הסיף עוד מלך מצרים לצאת מארצו כי לקח מלך בבל מנחל מצרים עד נהר פרת כל אשר היתה למלך מצרים
    kjvRefs:
    - 2 Kings 24:7
    kjvOsis:
    - 2Kgs.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.8
    scripture: tanakh
    name: Tanakh 2 Kings 24:8
    ref: 2 Kings 24:8
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 8
    ordinal: 10122
    text: Jehoiachin was eighteen years old when he began to reign; and he reigned in Jerusalem three months; and his mother’s name was Nehushta the daughter of Elnathan of Jerusalem.
    translation: JPS 1917
    original: בֶּן־שְׁמֹנֶה עֶשְׂרֵה שָׁנָה יְהוֹיָכִין בְּמָלְכוֹ וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ בִּירוּשָׁלִָם וְשֵׁם אִמּוֹ נְחֻשְׁתָּא בַת־אֶלְנָתָן מִירוּשָׁלִָם׃
    hebrewPlain: בן שמנה עשרה שנה יהויכין במלכו ושלשה חדשים מלך בירושלם ושם אמו נחשתא בת אלנתן מירושלם
    kjvRefs:
    - 2 Kings 24:8
    kjvOsis:
    - 2Kgs.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.24
- type: TanakhVerse
  data:
    osis: 2Kgs.24.9
    scripture: tanakh
    name: Tanakh 2 Kings 24:9
    ref: 2 Kings 24:9
    book: 2Kgs
    section: neviim
    chapter: 24
    verse: 9
    ordinal: 10123
    text: And he did that which was evil in the sight of the LORD, according to all that his father had done.
    translation: JPS 1917
    original: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה כְּכֹל אֲשֶׁר־עָשָׂה אָבִיו׃
    hebrewPlain: ויעש הרע בעיני יהוה ככל אשר עשה אביו
    kjvRefs:
    - 2 Kings 24:9
    kjvOsis:
    - 2Kgs.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
