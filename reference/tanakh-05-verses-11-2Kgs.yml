    section: neviim
    chapter: 15
    verse: 19
    ordinal: 9856
    text: There came against the land Pul the king of Assyria; and Menahem gave Pul a thousand talents of silver, that his hand might be with him to confirm the kingdom in his hand.
    translation: JPS 1917
    original: בָּא פוּל מֶלֶךְ־אַשּׁוּר עַל־הָאָרֶץ וַיִּתֵּן מְנַחֵם לְפוּל אֶלֶף כִּכַּר־כָּסֶף לִהְיוֹת יָדָיו אִתּוֹ לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ׃
    hebrewPlain: בא פול מלך אשור על הארץ ויתן מנחם לפול אלף ככר כסף להיות ידיו אתו להחזיק הממלכה בידו
    kjvRefs:
