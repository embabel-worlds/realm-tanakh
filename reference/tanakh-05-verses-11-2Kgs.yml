    section: neviim
    chapter: 15
    verse: 16
    ordinal: 9853
    text: Then Menahem smote Tiphsah, and all that were therein, and the borders thereof, from Tirzah; because they opened not to him, therefore he smote it; and all the women therein that were with child he ripped up.
    translation: JPS 1917
    original: אָז יַכֶּה־מְנַחֵם אֶת־תִּפְסַח וְאֶת־כָּל־אֲשֶׁר־בָּהּ וְאֶת־גְּבוּלֶיהָ מִתִּרְצָה כִּי לֹא פָתַח וַיַּךְ אֵת כָּל־הֶהָרוֹתֶיהָ בִּקֵּעַ׃
    hebrewPlain: אז יכה מנחם את תפסח ואת כל אשר בה ואת גבוליה מתרצה כי לא פתח ויך את כל ההרותיה בקע
