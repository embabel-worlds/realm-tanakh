  data:
    osis: 2Kgs.22.2
    scripture: tanakh
    name: Tanakh 2 Kings 22:2
    ref: 2 Kings 22:2
    book: 2Kgs
    section: neviim
    chapter: 22
    verse: 2
    ordinal: 10059
    text: And he did that which was right in the eyes of the LORD, and walked in all the way of David his father, and turned not aside to the right hand or to the left.
    translation: JPS 1917
    original: וַיַּעַשׂ הַיָּשָׁר בְּעֵינֵי יְהוָה וַיֵּלֶךְ בְּכָל־דֶּרֶךְ דָּוִד אָבִיו וְלֹא־סָר יָמִין וּשְׂמֹאול׃
    hebrewPlain: ויעש הישר בעיני יהוה וילך בכל דרך דוד אביו ולא סר ימין ושמאול
    kjvRefs:
