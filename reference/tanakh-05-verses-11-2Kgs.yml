- type: TanakhVerse
  data:
    osis: 2Kgs.1.6
    scripture: tanakh
    name: Tanakh 2 Kings 1:6
    ref: 2 Kings 1:6
    book: 2Kgs
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 9451
    text: 'And they said unto him: ‘There came up a man to meet us, and said unto us: Go, return unto the king that sent you, and say unto him: Thus saith the LORD: Is it because there is no God in Israel, that thou sendest to inquire of Baal-zebub the god of Ekron? therefore thou shalt not come down from the bed whither thou art gone up, but shalt surely die.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ אֵלָיו אִישׁ עָלָה לִקְרָאתֵנוּ וַיֹּאמֶר אֵלֵינוּ לְכוּ שׁוּבוּ אֶל־הַמֶּלֶךְ אֲשֶׁר־שָׁלַח אֶתְכֶם וְדִבַּרְתֶּם אֵלָיו כֹּה אָמַר יְהוָה הַמִבְּלִי אֵין־אֱלֹהִים בְּיִשְׂרָאֵל אַתָּה שֹׁלֵחַ לִדְרֹשׁ בְּבַעַל זְבוּב אֱלֹהֵי עֶקְרוֹן לָכֵן הַמִּטָּה אֲשֶׁר־עָלִיתָ שָּׁם לֹא־תֵרֵד מִמֶּנָּה כִּי־מוֹת תָּמוּת׃
    hebrewPlain: ויאמרו אליו איש עלה לקראתנו ויאמר אלינו לכו שובו אל המלך אשר שלח אתכם ודברתם אליו כה אמר יהוה המבלי אין אלהים בישראל אתה שלח לדרש בבעל זבוב אלהי עקרון לכן המטה אשר עלית שם לא תרד ממנה כי מות תמות
    kjvRefs:
    - 2 Kings 1:6
    kjvOsis:
    - 2Kgs.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: 2Kgs.1
