    verse: 26
    ordinal: 17695
    text: I also, in your calamity, will laugh, I will mock when your dread cometh;
    translation: JPS 1917
    original: גַּם־אֲנִי בְּאֵידְכֶם אֶשְׂחָק אֶלְעַג בְּבֹא פַחְדְּכֶם׃
    hebrewPlain: גם אני באידכם אשחק אלעג בבא פחדכם
    kjvRefs:
    - Proverbs 1:26
    kjvOsis:
    - Prov.1.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.27
    scripture: tanakh
    name: Tanakh Proverbs 1:27
    ref: Proverbs 1:27
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 27
    ordinal: 17696
    text: When your dread cometh as a storm, and your calamity cometh on as a whirlwind; When trouble and distress come upon you.
    translation: JPS 1917
    original: בְּבֹא כשאוה [כְשׁוֹאָה ] פַּחְדְּכֶם וְאֵידְכֶם כְּסוּפָה יֶאֱתֶה בְּבֹא עֲלֵיכֶם צָרָה וְצוּקָה׃
    hebrewPlain: בבא כשאוה [כשואה ] פחדכם ואידכם כסופה יאתה בבא עליכם צרה וצוקה
    kjvRefs:
    - Proverbs 1:27
    kjvOsis:
    - Prov.1.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.28
    scripture: tanakh
    name: Tanakh Proverbs 1:28
    ref: Proverbs 1:28
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 28
    ordinal: 17697
    text: Then will they call me, but I will not answer, they will seek me earnestly, but they shall not find me.
    translation: JPS 1917
    original: אָז יִקְרָאֻנְנִי וְלֹא אֶעֱנֶה יְשַׁחֲרֻנְנִי וְלֹא יִמְצָאֻנְנִי׃
    hebrewPlain: אז יקראנני ולא אענה ישחרנני ולא ימצאנני
    kjvRefs:
    - Proverbs 1:28
    kjvOsis:
    - Prov.1.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.29
    scripture: tanakh
    name: Tanakh Proverbs 1:29
    ref: Proverbs 1:29
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 29
    ordinal: 17698
    text: For that they hated knowledge, and did not choose the fear of the LORD;
    translation: JPS 1917
    original: תַּחַת כִּי־שָׂנְאוּ דָעַת וְיִרְאַת יְהֹוָה לֹא בָחָרוּ׃
    hebrewPlain: תחת כי שנאו דעת ויראת יהוה לא בחרו
    kjvRefs:
    - Proverbs 1:29
    kjvOsis:
    - Prov.1.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.30
    scripture: tanakh
    name: Tanakh Proverbs 1:30
    ref: Proverbs 1:30
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 30
    ordinal: 17699
    text: They would none of my counsel, they despised all my reproof.
    translation: JPS 1917
    original: לֹא־אָבוּ לַעֲצָתִי נָאֲצוּ כָּל־תּוֹכַחְתִּי׃
    hebrewPlain: לא אבו לעצתי נאצו כל תוכחתי
    kjvRefs:
    - Proverbs 1:30
    kjvOsis:
    - Prov.1.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.31
    scripture: tanakh
    name: Tanakh Proverbs 1:31
    ref: Proverbs 1:31
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 31
    ordinal: 17700
    text: Therefore shall they eat of the fruit of their own way, and be filled with their own devices.
    translation: JPS 1917
    original: וְיֹאכְלוּ מִפְּרִי דַרְכָּם וּמִמֹּעֲצֹתֵיהֶם יִשְׂבָּעוּ׃
    hebrewPlain: ויאכלו מפרי דרכם וממעצתיהם ישבעו
    kjvRefs:
    - Proverbs 1:31
    kjvOsis:
    - Prov.1.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.32
    scripture: tanakh
    name: Tanakh Proverbs 1:32
    ref: Proverbs 1:32
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 32
    ordinal: 17701
    text: For the waywardness of the thoughtless shall slay them, and the confidence of fools shall destroy them.
    translation: JPS 1917
    original: כִּי מְשׁוּבַת פְּתָיִם תַּהַרְגֵם וְשַׁלְוַת כְּסִילִים תְּאַבְּדֵם׃
    hebrewPlain: כי משובת פתים תהרגם ושלות כסילים תאבדם
    kjvRefs:
    - Proverbs 1:32
    kjvOsis:
    - Prov.1.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.33
    scripture: tanakh
    name: Tanakh Proverbs 1:33
    ref: Proverbs 1:33
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 33
    ordinal: 17702
    text: But whoso hearkeneth unto me shall dwell securely, and shall be quiet without fear of evil.’
    translation: JPS 1917
    original: וְשֹׁמֵעַ לִי יִשְׁכָּן־בֶּטַח וְשַׁאֲנַן מִפַּחַד רָעָה׃
    hebrewPlain: ושמע לי ישכן בטח ושאנן מפחד רעה
    kjvRefs:
    - Proverbs 1:33
    kjvOsis:
    - Prov.1.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.2.1
    scripture: tanakh
    name: Tanakh Proverbs 2:1
    ref: Proverbs 2:1
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 17703
    text: My son, if thou wilt receive my words, And lay up my commandments with thee;
    translation: JPS 1917
    original: בְּנִי אִם־תִּקַּח אֲמָרָי וּמִצְוֺתַי תִּצְפֹּן אִתָּךְ׃
    hebrewPlain: בני אם תקח אמרי ומצותי תצפן אתך
    kjvRefs:
    - Proverbs 2:1
    kjvOsis:
    - Prov.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.2
    scripture: tanakh
    name: Tanakh Proverbs 2:2
    ref: Proverbs 2:2
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 17704
    text: So that thou make thine ear attend unto wisdom, And thy heart incline to discernment;
    translation: JPS 1917
    original: לְהַקְשִׁיב לַחָכְמָה אָזְנֶךָ תַּטֶּה לִבְּךָ לַתְּבוּנָה׃
    hebrewPlain: להקשיב לחכמה אזנך תטה לבך לתבונה
    kjvRefs:
    - Proverbs 2:2
    kjvOsis:
    - Prov.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.3
    scripture: tanakh
    name: Tanakh Proverbs 2:3
    ref: Proverbs 2:3
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 17705
    text: Yea, if thou call for understanding, And lift up thy voice for discernment;
    translation: JPS 1917
    original: כִּי אִם לַבִּינָה תִקְרָא לַתְּבוּנָה תִּתֵּן קוֹלֶךָ׃
    hebrewPlain: כי אם לבינה תקרא לתבונה תתן קולך
    kjvRefs:
    - Proverbs 2:3
    kjvOsis:
    - Prov.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.4
    scripture: tanakh
    name: Tanakh Proverbs 2:4
    ref: Proverbs 2:4
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 17706
    text: If thou seek her as silver, And search for her as for hid treasures;
    translation: JPS 1917
    original: אִם־תְּבַקְשֶׁנָּה כַכָּסֶף וְכַמַּטְמוֹנִים תַּחְפְּשֶׂנָּה׃
    hebrewPlain: אם תבקשנה ככסף וכמטמונים תחפשנה
    kjvRefs:
    - Proverbs 2:4
    kjvOsis:
    - Prov.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.5
    scripture: tanakh
    name: Tanakh Proverbs 2:5
    ref: Proverbs 2:5
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 17707
    text: Then shalt thou understand the fear of the LORD, And find the knowledge of God.
    translation: JPS 1917
    original: אָז תָּבִין יִרְאַת יְהוָה וְדַעַת אֱלֹהִים תִּמְצָא׃
    hebrewPlain: אז תבין יראת יהוה ודעת אלהים תמצא
    kjvRefs:
    - Proverbs 2:5
    kjvOsis:
    - Prov.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.6
    scripture: tanakh
    name: Tanakh Proverbs 2:6
    ref: Proverbs 2:6
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 17708
    text: For the LORD giveth wisdom, Out of His mouth cometh knowledge and discernment;
    translation: JPS 1917
    original: כִּי־יְהוָה יִתֵּן חָכְמָה מִפִּיו דַּעַת וּתְבוּנָה׃
    hebrewPlain: כי יהוה יתן חכמה מפיו דעת ותבונה
    kjvRefs:
    - Proverbs 2:6
    kjvOsis:
    - Prov.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.7
    scripture: tanakh
    name: Tanakh Proverbs 2:7
    ref: Proverbs 2:7
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 17709
    text: He layeth up sound wisdom for the upright, He is a shield to them that walk in integrity;
    translation: JPS 1917
    original: וצפן [יִצְפֹּן] לַיְשָׁרִים תּוּשִׁיָּה מָגֵן לְהֹלְכֵי תֹם׃
    hebrewPlain: וצפן [יצפן] לישרים תושיה מגן להלכי תם
    kjvRefs:
    - Proverbs 2:7
    kjvOsis:
    - Prov.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.8
    scripture: tanakh
    name: Tanakh Proverbs 2:8
    ref: Proverbs 2:8
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 17710
    text: That He may guard the paths of justice, And preserve the way of His godly ones. .
    translation: JPS 1917
    original: לִנְצֹר אָרְחוֹת מִשְׁפָּט וְדֶרֶךְ חסידו [חֲסִידָיו] יִשְׁמֹר׃
    hebrewPlain: לנצר ארחות משפט ודרך חסידו [חסידיו] ישמר
    kjvRefs:
    - Proverbs 2:8
    kjvOsis:
    - Prov.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.9
    scripture: tanakh
    name: Tanakh Proverbs 2:9
    ref: Proverbs 2:9
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 17711
    text: Then shalt thou understand righteousness and justice, And equity, yea, every good path.
    translation: JPS 1917
    original: אָז תָּבִין צֶדֶק וּמִשְׁפָּט וּמֵישָׁרִים כָּל־מַעְגַּל־טוֹב׃
    hebrewPlain: אז תבין צדק ומשפט ומישרים כל מעגל טוב
    kjvRefs:
    - Proverbs 2:9
    kjvOsis:
    - Prov.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.10
    scripture: tanakh
    name: Tanakh Proverbs 2:10
    ref: Proverbs 2:10
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 17712
    text: For wisdom shall enter into thy heart, And knowledge shall be pleasant unto thy soul;
    translation: JPS 1917
    original: כִּי־תָבוֹא חָכְמָה בְלִבֶּךָ וְדַעַת לְנַפְשְׁךָ יִנְעָם׃
    hebrewPlain: כי תבוא חכמה בלבך ודעת לנפשך ינעם
    kjvRefs:
    - Proverbs 2:10
    kjvOsis:
    - Prov.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.11
    scripture: tanakh
    name: Tanakh Proverbs 2:11
    ref: Proverbs 2:11
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 17713
    text: Discretion shall watch over thee, Discernment shall guard thee;
    translation: JPS 1917
    original: מְזִמָּה תִּשְׁמֹר עָלֶיךָ תְּבוּנָה תִנְצְרֶכָּה׃
    hebrewPlain: מזמה תשמר עליך תבונה תנצרכה
    kjvRefs:
    - Proverbs 2:11
    kjvOsis:
    - Prov.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.12
    scripture: tanakh
    name: Tanakh Proverbs 2:12
    ref: Proverbs 2:12
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 17714
    text: To deliver thee from the way of evil, From the men that speak froward things;
    translation: JPS 1917
    original: לְהַצִּילְךָ מִדֶּרֶךְ רָע מֵאִישׁ מְדַבֵּר תַּהְפֻּכוֹת׃
    hebrewPlain: להצילך מדרך רע מאיש מדבר תהפכות
    kjvRefs:
    - Proverbs 2:12
    kjvOsis:
    - Prov.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.13
    scripture: tanakh
    name: Tanakh Proverbs 2:13
    ref: Proverbs 2:13
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 17715
    text: Who leave the paths of uprightness, To walk in the ways of darkness;
    translation: JPS 1917
    original: הַעֹזְבִים אָרְחוֹת יֹשֶׁר לָלֶכֶת בְּדַרְכֵי־חֹשֶׁךְ׃
    hebrewPlain: העזבים ארחות ישר ללכת בדרכי חשך
    kjvRefs:
    - Proverbs 2:13
    kjvOsis:
    - Prov.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.14
    scripture: tanakh
    name: Tanakh Proverbs 2:14
    ref: Proverbs 2:14
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 17716
    text: Who rejoice to do evil, And delight in the frowardness of evil;
    translation: JPS 1917
    original: הַשְּׂמֵחִים לַעֲשׂוֹת רָע יָגִילוּ בְּתַהְפֻּכוֹת רָע׃
    hebrewPlain: השמחים לעשות רע יגילו בתהפכות רע
    kjvRefs:
    - Proverbs 2:14
    kjvOsis:
    - Prov.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.15
    scripture: tanakh
    name: Tanakh Proverbs 2:15
    ref: Proverbs 2:15
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 17717
    text: Who are crooked in their ways, And perverse in their paths;
    translation: JPS 1917
    original: אֲשֶׁר אָרְחֹתֵיהֶם עִקְּשִׁים וּנְלוֹזִים בְּמַעְגְּלוֹתָם׃
    hebrewPlain: אשר ארחתיהם עקשים ונלוזים במעגלותם
    kjvRefs:
    - Proverbs 2:15
    kjvOsis:
    - Prov.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.16
    scripture: tanakh
    name: Tanakh Proverbs 2:16
    ref: Proverbs 2:16
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 17718
    text: To deliver thee from the strange woman, Even from the alien woman that maketh smooth her words;
    translation: JPS 1917
    original: לְהַצִּילְךָ מֵאִשָּׁה זָרָה מִנָּכְרִיָּה אֲמָרֶיהָ הֶחֱלִיקָה׃
    hebrewPlain: להצילך מאשה זרה מנכריה אמריה החליקה
    kjvRefs:
    - Proverbs 2:16
    kjvOsis:
    - Prov.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.17
    scripture: tanakh
    name: Tanakh Proverbs 2:17
    ref: Proverbs 2:17
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 17719
    text: That forsaketh the lord of her youth, And forgetteth the covenant of her God.
    translation: JPS 1917
    original: הַעֹזֶבֶת אַלּוּף נְעוּרֶיהָ וְאֶת־בְּרִית אֱלֹהֶיהָ שָׁכֵחָה׃
    hebrewPlain: העזבת אלוף נעוריה ואת ברית אלהיה שכחה
    kjvRefs:
    - Proverbs 2:17
    kjvOsis:
    - Prov.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.18
    scripture: tanakh
    name: Tanakh Proverbs 2:18
    ref: Proverbs 2:18
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 17720
    text: For her house sinketh down unto death, And her paths unto the shades;
    translation: JPS 1917
    original: כִּי שָׁחָה אֶל־מָוֶת בֵּיתָהּ וְאֶל־רְפָאִים מַעְגְּלֹתֶיהָ׃
    hebrewPlain: כי שחה אל מות ביתה ואל רפאים מעגלתיה
    kjvRefs:
    - Proverbs 2:18
    kjvOsis:
    - Prov.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.19
    scripture: tanakh
    name: Tanakh Proverbs 2:19
    ref: Proverbs 2:19
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 17721
    text: None that go unto her return, Neither do they attain unto the paths of life;
    translation: JPS 1917
    original: כָּל־בָּאֶיהָ לֹא יְשׁוּבוּן וְלֹא־יַשִּׂיגוּ אָרְחוֹת חַיִּים׃
    hebrewPlain: כל באיה לא ישובון ולא ישיגו ארחות חיים
    kjvRefs:
    - Proverbs 2:19
    kjvOsis:
    - Prov.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.20
    scripture: tanakh
    name: Tanakh Proverbs 2:20
    ref: Proverbs 2:20
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 17722
    text: That thou mayest walk in the way of good men, And keep the paths of the righteous.
    translation: JPS 1917
    original: לְמַעַן תֵּלֵךְ בְּדֶרֶךְ טוֹבִים וְאָרְחוֹת צַדִּיקִים תִּשְׁמֹר׃
    hebrewPlain: למען תלך בדרך טובים וארחות צדיקים תשמר
    kjvRefs:
    - Proverbs 2:20
    kjvOsis:
    - Prov.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.21
    scripture: tanakh
    name: Tanakh Proverbs 2:21
    ref: Proverbs 2:21
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 17723
    text: For the upright shall dwell in the land, And the whole-hearted shall remain in it.
    translation: JPS 1917
    original: כִּי־יְשָׁרִים יִשְׁכְּנוּ אָרֶץ וּתְמִימִים יִוָּתְרוּ בָהּ׃
    hebrewPlain: כי ישרים ישכנו ארץ ותמימים יותרו בה
    kjvRefs:
    - Proverbs 2:21
    kjvOsis:
    - Prov.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.2.22
    scripture: tanakh
    name: Tanakh Proverbs 2:22
    ref: Proverbs 2:22
    book: Prov
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 17724
    text: But the wicked shall be cut off from the land, And the faithless shall be plucked up out of it.
    translation: JPS 1917
    original: וּרְשָׁעִים מֵאֶרֶץ יִכָּרֵתוּ וּבוֹגְדִים יִסְּחוּ מִמֶּנָּה׃
    hebrewPlain: ורשעים מארץ יכרתו ובוגדים יסחו ממנה
    kjvRefs:
    - Proverbs 2:22
    kjvOsis:
    - Prov.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.2
- type: TanakhVerse
  data:
    osis: Prov.3.1
    scripture: tanakh
    name: Tanakh Proverbs 3:1
    ref: Proverbs 3:1
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 17725
    text: My son, forget not my teaching; But let thy heart keep my commandments;
    translation: JPS 1917
    original: בְּנִי תּוֹרָתִי אַל־תִּשְׁכָּח וּמִצְוֺתַי יִצֹּר לִבֶּךָ׃
    hebrewPlain: בני תורתי אל תשכח ומצותי יצר לבך
    kjvRefs:
    - Proverbs 3:1
    kjvOsis:
    - Prov.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.2
    scripture: tanakh
    name: Tanakh Proverbs 3:2
    ref: Proverbs 3:2
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 17726
    text: For length of days, and years of life, And peace, will they add to thee.
    translation: JPS 1917
    original: כִּי אֹרֶךְ יָמִים וּשְׁנוֹת חַיִּים וְשָׁלוֹם יוֹסִיפוּ לָךְ׃
    hebrewPlain: כי ארך ימים ושנות חיים ושלום יוסיפו לך
    kjvRefs:
    - Proverbs 3:2
    kjvOsis:
    - Prov.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.3
    scripture: tanakh
    name: Tanakh Proverbs 3:3
    ref: Proverbs 3:3
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 17727
    text: Let not kindness and truth forsake thee; Bind them about thy neck, write them upon the table of thy heart;
    translation: JPS 1917
    original: חֶסֶד וֶאֱמֶת אַל־יַעַזְבֻךָ קָשְׁרֵם עַל־גַּרְגְּרוֹתֶיךָ כָּתְבֵם עַל־לוּחַ לִבֶּךָ׃
    hebrewPlain: חסד ואמת אל יעזבך קשרם על גרגרותיך כתבם על לוח לבך
    kjvRefs:
    - Proverbs 3:3
    kjvOsis:
    - Prov.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.4
    scripture: tanakh
    name: Tanakh Proverbs 3:4
    ref: Proverbs 3:4
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 17728
    text: So shalt thou find grace and good favour In the sight of God and man.
    translation: JPS 1917
    original: וּמְצָא־חֵן וְשֵׂכֶל־טוֹב בְּעֵינֵי אֱלֹהִים וְאָדָם׃
    hebrewPlain: ומצא חן ושכל טוב בעיני אלהים ואדם
    kjvRefs:
    - Proverbs 3:4
    kjvOsis:
    - Prov.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.5
    scripture: tanakh
    name: Tanakh Proverbs 3:5
    ref: Proverbs 3:5
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 17729
    text: Trust in the LORD with all thy heart, And lean not upon thine own understanding.
    translation: JPS 1917
    original: בְּטַח אֶל־יְהוָה בְּכָל־לִבֶּךָ וְאֶל־בִּינָתְךָ אַל־תִּשָּׁעֵן׃
    hebrewPlain: בטח אל יהוה בכל לבך ואל בינתך אל תשען
    kjvRefs:
    - Proverbs 3:5
    kjvOsis:
    - Prov.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.6
    scripture: tanakh
    name: Tanakh Proverbs 3:6
    ref: Proverbs 3:6
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 17730
    text: In all thy ways acknowledge Him, And He will direct thy paths.
    translation: JPS 1917
    original: בְּכָל־דְּרָכֶיךָ דָעֵהוּ וְהוּא יְיַשֵּׁר אֹרְחֹתֶיךָ׃
    hebrewPlain: בכל דרכיך דעהו והוא יישר ארחתיך
    kjvRefs:
    - Proverbs 3:6
    kjvOsis:
    - Prov.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.7
    scripture: tanakh
    name: Tanakh Proverbs 3:7
    ref: Proverbs 3:7
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 17731
    text: Be not wise in thine own eyes; Fear the LORD, and depart from evil;
    translation: JPS 1917
    original: אַל־תְּהִי חָכָם בְּעֵינֶיךָ יְרָא אֶת־יְהוָה וְסוּר מֵרָע׃
    hebrewPlain: אל תהי חכם בעיניך ירא את יהוה וסור מרע
    kjvRefs:
    - Proverbs 3:7
    kjvOsis:
    - Prov.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.8
    scripture: tanakh
    name: Tanakh Proverbs 3:8
    ref: Proverbs 3:8
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 17732
    text: It shall be health to thy navel, And marrow to thy bones.
    translation: JPS 1917
    original: רִפְאוּת תְּהִי לְשָׁרֶּךָ וְשִׁקּוּי לְעַצְמוֹתֶיךָ׃
    hebrewPlain: רפאות תהי לשרך ושקוי לעצמותיך
    kjvRefs:
    - Proverbs 3:8
    kjvOsis:
    - Prov.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.9
    scripture: tanakh
    name: Tanakh Proverbs 3:9
    ref: Proverbs 3:9
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 17733
    text: Honour the LORD with thy substance, And with the first-fruits of all thine increase;
    translation: JPS 1917
    original: כַּבֵּד אֶת־יְהוָה מֵהוֹנֶךָ וּמֵרֵאשִׁית כָּל־תְּבוּאָתֶךָ׃
    hebrewPlain: כבד את יהוה מהונך ומראשית כל תבואתך
    kjvRefs:
    - Proverbs 3:9
    kjvOsis:
    - Prov.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.10
    scripture: tanakh
    name: Tanakh Proverbs 3:10
    ref: Proverbs 3:10
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 17734
    text: So shall thy barns be filled with plenty, And thy vats shall overflow with new wine.
    translation: JPS 1917
    original: וְיִמָּלְאוּ אֲסָמֶיךָ שָׂבָע וְתִירוֹשׁ יְקָבֶיךָ יִפְרֹצוּ׃
    hebrewPlain: וימלאו אסמיך שבע ותירוש יקביך יפרצו
    kjvRefs:
    - Proverbs 3:10
    kjvOsis:
    - Prov.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.11
    scripture: tanakh
    name: Tanakh Proverbs 3:11
    ref: Proverbs 3:11
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 17735
    text: My son, despise not the chastening of the LORD, Neither spurn thou His correction;
    translation: JPS 1917
    original: מוּסַר יְהוָה בְּנִי אַל־תִּמְאָס וְאַל־תָּקֹץ בְּתוֹכַחְתּוֹ׃
    hebrewPlain: מוסר יהוה בני אל תמאס ואל תקץ בתוכחתו
    kjvRefs:
    - Proverbs 3:11
    kjvOsis:
    - Prov.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.12
    scripture: tanakh
    name: Tanakh Proverbs 3:12
    ref: Proverbs 3:12
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 17736
    text: For whom the LORD loveth He correcteth, Even as a father the son in whom he delighteth.
    translation: JPS 1917
    original: כִּי אֶת אֲשֶׁר יֶאֱהַב יְהוָה יוֹכִיחַ וּכְאָב אֶת־בֵּן יִרְצֶה׃
    hebrewPlain: כי את אשר יאהב יהוה יוכיח וכאב את בן ירצה
    kjvRefs:
    - Proverbs 3:12
    kjvOsis:
    - Prov.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.13
    scripture: tanakh
    name: Tanakh Proverbs 3:13
    ref: Proverbs 3:13
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 17737
    text: Happy is the man that findeth wisdom, And the man that obtaineth understanding.
    translation: JPS 1917
    original: אַשְׁרֵי אָדָם מָצָא חָכְמָה וְאָדָם יָפִיק תְּבוּנָה׃
    hebrewPlain: אשרי אדם מצא חכמה ואדם יפיק תבונה
    kjvRefs:
    - Proverbs 3:13
    kjvOsis:
    - Prov.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.14
    scripture: tanakh
    name: Tanakh Proverbs 3:14
    ref: Proverbs 3:14
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 17738
    text: For the merchandise of it is better than the merchandise of silver, And the gain thereof than fine gold.
    translation: JPS 1917
    original: כִּי טוֹב סַחְרָהּ מִסְּחַר־כָּסֶף וּמֵחָרוּץ תְּבוּאָתָהּ׃
    hebrewPlain: כי טוב סחרה מסחר כסף ומחרוץ תבואתה
    kjvRefs:
    - Proverbs 3:14
    kjvOsis:
    - Prov.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.15
    scripture: tanakh
    name: Tanakh Proverbs 3:15
    ref: Proverbs 3:15
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 17739
    text: She is more precious than rubies; And all the things thou canst desire are not to be compared unto her.
    translation: JPS 1917
    original: יְקָרָה הִיא מפניים [מִפְּנִינִים] וְכָל־חֲפָצֶיךָ לֹא יִשְׁווּ־בָהּ׃
    hebrewPlain: יקרה היא מפניים [מפנינים] וכל חפציך לא ישוו בה
    kjvRefs:
    - Proverbs 3:15
    kjvOsis:
    - Prov.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.16
    scripture: tanakh
    name: Tanakh Proverbs 3:16
    ref: Proverbs 3:16
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 17740
    text: Length of days is in her right hand; In her left hand are riches and honour.
    translation: JPS 1917
    original: אֹרֶךְ יָמִים בִּימִינָהּ בִּשְׂמֹאולָהּ עֹשֶׁר וְכָבוֹד׃
    hebrewPlain: ארך ימים בימינה בשמאולה עשר וכבוד
    kjvRefs:
    - Proverbs 3:16
    kjvOsis:
    - Prov.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.17
    scripture: tanakh
    name: Tanakh Proverbs 3:17
    ref: Proverbs 3:17
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 17741
    text: Her ways are ways of pleasantness, And all her paths are peace.
    translation: JPS 1917
    original: דְּרָכֶיהָ דַרְכֵי־נֹעַם וְכָל־נְתִיבוֹתֶיהָ שָׁלוֹם׃
    hebrewPlain: דרכיה דרכי נעם וכל נתיבותיה שלום
    kjvRefs:
    - Proverbs 3:17
    kjvOsis:
    - Prov.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.18
    scripture: tanakh
    name: Tanakh Proverbs 3:18
    ref: Proverbs 3:18
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 17742
    text: She is a tree of life to them that lay hold upon her, And happy is every one that holdest her fast.
    translation: JPS 1917
    original: עֵץ־חַיִּים הִיא לַמַּחֲזִיקִים בָּהּ וְתֹמְכֶיהָ מְאֻשָּׁר׃
    hebrewPlain: עץ חיים היא למחזיקים בה ותמכיה מאשר
    kjvRefs:
    - Proverbs 3:18
    kjvOsis:
    - Prov.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.19
    scripture: tanakh
    name: Tanakh Proverbs 3:19
    ref: Proverbs 3:19
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 19
    ordinal: 17743
    text: The LORD by wisdom founded the earth; By understanding He established the heavens.
    translation: JPS 1917
    original: יְהוָה בְּחָכְמָה יָסַד־אָרֶץ כּוֹנֵן שָׁמַיִם בִּתְבוּנָה׃
    hebrewPlain: יהוה בחכמה יסד ארץ כונן שמים בתבונה
    kjvRefs:
    - Proverbs 3:19
    kjvOsis:
    - Prov.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.20
    scripture: tanakh
    name: Tanakh Proverbs 3:20
    ref: Proverbs 3:20
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 20
    ordinal: 17744
    text: By His knowledge the depths were broken up, And the skies drop down the dew.
    translation: JPS 1917
    original: בְּדַעְתּוֹ תְּהוֹמוֹת נִבְקָעוּ וּשְׁחָקִים יִרְעֲפוּ־טָל׃
    hebrewPlain: בדעתו תהומות נבקעו ושחקים ירעפו טל
    kjvRefs:
    - Proverbs 3:20
    kjvOsis:
    - Prov.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.21
    scripture: tanakh
    name: Tanakh Proverbs 3:21
    ref: Proverbs 3:21
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 21
    ordinal: 17745
    text: My son, let not them depart from thine eyes; Keep sound wisdom and discretion;
    translation: JPS 1917
    original: בְּנִי אַל־יָלֻזוּ מֵעֵינֶיךָ נְצֹר תֻּשִׁיָּה וּמְזִמָּה׃
    hebrewPlain: בני אל ילזו מעיניך נצר תשיה ומזמה
    kjvRefs:
    - Proverbs 3:21
    kjvOsis:
    - Prov.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.22
    scripture: tanakh
    name: Tanakh Proverbs 3:22
    ref: Proverbs 3:22
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 22
    ordinal: 17746
    text: So shall they be life unto thy soul, And grace to thy neck.
    translation: JPS 1917
    original: וְיִהְיוּ חַיִּים לְנַפְשֶׁךָ וְחֵן לְגַרְגְּרֹתֶיךָ׃
    hebrewPlain: ויהיו חיים לנפשך וחן לגרגרתיך
    kjvRefs:
    - Proverbs 3:22
    kjvOsis:
    - Prov.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.23
    scripture: tanakh
    name: Tanakh Proverbs 3:23
    ref: Proverbs 3:23
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 23
    ordinal: 17747
    text: Then shalt thou walk in thy way securely, And thou shalt not dash thy foot.
    translation: JPS 1917
    original: אָז תֵּלֵךְ לָבֶטַח דַּרְכֶּךָ וְרַגְלְךָ לֹא תִגּוֹף׃
    hebrewPlain: אז תלך לבטח דרכך ורגלך לא תגוף
    kjvRefs:
    - Proverbs 3:23
    kjvOsis:
    - Prov.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.24
    scripture: tanakh
    name: Tanakh Proverbs 3:24
    ref: Proverbs 3:24
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 24
    ordinal: 17748
    text: When thou liest down, thou shalt not be afraid; Yea, thou shalt lie down, and thy sleep shall be sweet.
    translation: JPS 1917
    original: אִם־תִּשְׁכַּב לֹא־תִפְחָד וְשָׁכַבְתָּ וְעָרְבָה שְׁנָתֶךָ׃
    hebrewPlain: אם תשכב לא תפחד ושכבת וערבה שנתך
    kjvRefs:
    - Proverbs 3:24
    kjvOsis:
    - Prov.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.25
    scripture: tanakh
    name: Tanakh Proverbs 3:25
    ref: Proverbs 3:25
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 25
    ordinal: 17749
    text: Be not afraid of sudden terror, Neither of the destruction of the wicked, when it cometh;
    translation: JPS 1917
    original: אַל־תִּירָא מִפַּחַד פִּתְאֹם וּמִשֹּׁאַת רְשָׁעִים כִּי תָבֹא׃
    hebrewPlain: אל תירא מפחד פתאם ומשאת רשעים כי תבא
    kjvRefs:
    - Proverbs 3:25
    kjvOsis:
    - Prov.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.26
    scripture: tanakh
    name: Tanakh Proverbs 3:26
    ref: Proverbs 3:26
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 26
    ordinal: 17750
    text: For the LORD will be thy confidence, And will keep thy foot from being caught.
    translation: JPS 1917
    original: כִּי־יְהוָה יִהְיֶה בְכִסְלֶךָ וְשָׁמַר רַגְלְךָ מִלָּכֶד׃
    hebrewPlain: כי יהוה יהיה בכסלך ושמר רגלך מלכד
    kjvRefs:
    - Proverbs 3:26
    kjvOsis:
    - Prov.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.27
    scripture: tanakh
    name: Tanakh Proverbs 3:27
    ref: Proverbs 3:27
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 27
    ordinal: 17751
    text: Withhold not good from him to whom it is due, When it is in the power of thy hand to do it.
    translation: JPS 1917
    original: אַל־תִּמְנַע־טוֹב מִבְּעָלָיו בִּהְיוֹת לְאֵל ידיך [יָדְךָ] לַעֲשׂוֹת׃
    hebrewPlain: אל תמנע טוב מבעליו בהיות לאל ידיך [ידך] לעשות
    kjvRefs:
    - Proverbs 3:27
    kjvOsis:
    - Prov.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.28
    scripture: tanakh
    name: Tanakh Proverbs 3:28
    ref: Proverbs 3:28
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 28
    ordinal: 17752
    text: 'Say not unto thy neighbour: ‘Go, and come again, And to-morrow I will give’; when thou hast it by thee.'
    translation: JPS 1917
    original: אַל־תֹּאמַר לרעיך [לְרֵעֲךָ ] לֵךְ וָשׁוּב וּמָחָר אֶתֵּן וְיֵשׁ אִתָּךְ׃
    hebrewPlain: אל תאמר לרעיך [לרעך ] לך ושוב ומחר אתן ויש אתך
    kjvRefs:
    - Proverbs 3:28
    kjvOsis:
    - Prov.3.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.29
    scripture: tanakh
    name: Tanakh Proverbs 3:29
    ref: Proverbs 3:29
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 29
    ordinal: 17753
    text: Devise not evil against thy neighbour, Seeing he dwelleth securely by thee.
    translation: JPS 1917
    original: אַל־תַּחֲרֹשׁ עַל־רֵעֲךָ רָעָה וְהוּא־יוֹשֵׁב לָבֶטַח אִתָּךְ׃
    hebrewPlain: אל תחרש על רעך רעה והוא יושב לבטח אתך
    kjvRefs:
    - Proverbs 3:29
    kjvOsis:
    - Prov.3.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.30
    scripture: tanakh
    name: Tanakh Proverbs 3:30
    ref: Proverbs 3:30
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 30
    ordinal: 17754
    text: Strive not with a man without cause, If he have done thee no harm.
    translation: JPS 1917
    original: אַל־תרוב [תָּרִיב] עִם־אָדָם חִנָּם אִם־לֹא גְמָלְךָ רָעָה׃
    hebrewPlain: אל תרוב [תריב] עם אדם חנם אם לא גמלך רעה
    kjvRefs:
    - Proverbs 3:30
    kjvOsis:
    - Prov.3.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.31
    scripture: tanakh
    name: Tanakh Proverbs 3:31
    ref: Proverbs 3:31
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 31
    ordinal: 17755
    text: Envy thou not the man of violence, And choose none of his ways.
    translation: JPS 1917
    original: אַל־תְּקַנֵּא בְּאִישׁ חָמָס וְאַל־תִּבְחַר בְּכָל־דְּרָכָיו׃
    hebrewPlain: אל תקנא באיש חמס ואל תבחר בכל דרכיו
    kjvRefs:
    - Proverbs 3:31
    kjvOsis:
    - Prov.3.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.32
    scripture: tanakh
    name: Tanakh Proverbs 3:32
    ref: Proverbs 3:32
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 32
    ordinal: 17756
    text: For the perverse is an abomination to the LORD; But His counsel is with the upright.
    translation: JPS 1917
    original: כִּי תוֹעֲבַת יְהוָה נָלוֹז וְאֶת־יְשָׁרִים סוֹדוֹ׃
    hebrewPlain: כי תועבת יהוה נלוז ואת ישרים סודו
    kjvRefs:
    - Proverbs 3:32
    kjvOsis:
    - Prov.3.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.33
    scripture: tanakh
    name: Tanakh Proverbs 3:33
    ref: Proverbs 3:33
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 33
    ordinal: 17757
    text: The curse of the LORD is in the house of the wicked; But He blesseth the habitation of the righteous.
    translation: JPS 1917
    original: מְאֵרַת יְהוָה בְּבֵית רָשָׁע וּנְוֵה צַדִּיקִים יְבָרֵךְ׃
    hebrewPlain: מארת יהוה בבית רשע ונוה צדיקים יברך
    kjvRefs:
    - Proverbs 3:33
    kjvOsis:
    - Prov.3.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.34
    scripture: tanakh
    name: Tanakh Proverbs 3:34
    ref: Proverbs 3:34
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 34
    ordinal: 17758
    text: If it concerneth the scorners, He scorneth them, But unto the humble He giveth grace.
    translation: JPS 1917
    original: אִם־לַלֵּצִים הוּא־יָלִיץ ולעניים [וְלַעֲנָוִים] יִתֶּן־חֵן׃
    hebrewPlain: אם ללצים הוא יליץ ולעניים [ולענוים] יתן חן
    kjvRefs:
    - Proverbs 3:34
    kjvOsis:
    - Prov.3.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.3.35
    scripture: tanakh
    name: Tanakh Proverbs 3:35
    ref: Proverbs 3:35
    book: Prov
    section: ketuvim
    chapter: 3
    verse: 35
    ordinal: 17759
    text: The wise shall inherit honour; But as for the fools, they carry away shame.
    translation: JPS 1917
    original: כָּבוֹד חֲכָמִים יִנְחָלוּ וּכְסִילִים מֵרִים קָלוֹן׃
    hebrewPlain: כבוד חכמים ינחלו וכסילים מרים קלון
    kjvRefs:
    - Proverbs 3:35
    kjvOsis:
    - Prov.3.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.3
- type: TanakhVerse
  data:
    osis: Prov.4.1
    scripture: tanakh
    name: Tanakh Proverbs 4:1
    ref: Proverbs 4:1
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 17760
    text: Hear, ye children, the instruction of a father, And attend to know understanding.
    translation: JPS 1917
    original: שִׁמְעוּ בָנִים מוּסַר אָב וְהַקְשִׁיבוּ לָדַעַת בִּינָה׃
    hebrewPlain: שמעו בנים מוסר אב והקשיבו לדעת בינה
    kjvRefs:
    - Proverbs 4:1
    kjvOsis:
    - Prov.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.2
    scripture: tanakh
    name: Tanakh Proverbs 4:2
    ref: Proverbs 4:2
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 17761
    text: For I give you a good taking; Forsake ye not my teaching.
    translation: JPS 1917
    original: כִּי לֶקַח טוֹב נָתַתִּי לָכֶם תּוֹרָתִי אַל־תַּעֲזֹבוּ׃
    hebrewPlain: כי לקח טוב נתתי לכם תורתי אל תעזבו
    kjvRefs:
    - Proverbs 4:2
    kjvOsis:
    - Prov.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.3
    scripture: tanakh
    name: Tanakh Proverbs 4:3
    ref: Proverbs 4:3
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 17762
    text: For I was a son unto my father, Tender and an only one in front of my mother.
    translation: JPS 1917
    original: כִּי־בֵן הָיִיתִי לְאָבִי רַךְ וְיָחִיד לִפְנֵי אִמִּי׃
    hebrewPlain: כי בן הייתי לאבי רך ויחיד לפני אמי
    kjvRefs:
    - Proverbs 4:3
    kjvOsis:
    - Prov.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.4
    scripture: tanakh
    name: Tanakh Proverbs 4:4
    ref: Proverbs 4:4
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 17763
    text: 'And he taught me, and said unto me: ‘Let thy heart hold fast my words, Keep my commandments, and live;'
    translation: JPS 1917
    original: וַיֹּרֵנִי וַיֹּאמֶר לִי יִתְמָךְ־דְּבָרַי לִבֶּךָ שְׁמֹר מִצְוֺתַי וֶחְיֵה׃
    hebrewPlain: וירני ויאמר לי יתמך דברי לבך שמר מצותי וחיה
    kjvRefs:
    - Proverbs 4:4
    kjvOsis:
    - Prov.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.5
    scripture: tanakh
    name: Tanakh Proverbs 4:5
    ref: Proverbs 4:5
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 17764
    text: Get wisdom, get understanding; Forget not, neither decline from the words of my mouth;
    translation: JPS 1917
    original: קְנֵה חָכְמָה קְנֵה בִינָה אַל־תִּשְׁכַּח וְאַל־תֵּט מֵאִמְרֵי־פִי׃
    hebrewPlain: קנה חכמה קנה בינה אל תשכח ואל תט מאמרי פי
    kjvRefs:
    - Proverbs 4:5
    kjvOsis:
    - Prov.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.6
    scripture: tanakh
    name: Tanakh Proverbs 4:6
    ref: Proverbs 4:6
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 17765
    text: Forsake her not, and she will preserve thee; Love her, and she will keep thee.
    translation: JPS 1917
    original: אַל־תַּעַזְבֶהָ וְתִשְׁמְרֶךָּ אֱהָבֶהָ וְתִצְּרֶךָּ׃
    hebrewPlain: אל תעזבה ותשמרך אהבה ותצרך
    kjvRefs:
    - Proverbs 4:6
    kjvOsis:
    - Prov.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.7
    scripture: tanakh
    name: Tanakh Proverbs 4:7
    ref: Proverbs 4:7
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 17766
    text: 'The beginning of wisdom is: Get wisdom; Yea, with all thy getting get understanding.'
    translation: JPS 1917
    original: רֵאשִׁית חָכְמָה קְנֵה חָכְמָה וּבְכָל־קִנְיָנְךָ קְנֵה בִינָה׃
    hebrewPlain: ראשית חכמה קנה חכמה ובכל קנינך קנה בינה
    kjvRefs:
    - Proverbs 4:7
    kjvOsis:
    - Prov.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.8
    scripture: tanakh
    name: Tanakh Proverbs 4:8
    ref: Proverbs 4:8
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 17767
    text: Extol her, and she will exalt thee; She will bring thee to honour, when thou dost embrace her.
    translation: JPS 1917
    original: סַלְסְלֶהָ וּתְרוֹמְמֶךָּ תְּכַבֵּדְךָ כִּי תְחַבְּקֶנָּה׃
    hebrewPlain: סלסלה ותרוממך תכבדך כי תחבקנה
    kjvRefs:
    - Proverbs 4:8
    kjvOsis:
    - Prov.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.9
    scripture: tanakh
    name: Tanakh Proverbs 4:9
    ref: Proverbs 4:9
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 17768
    text: She will give to thy head a chaplet of grace; A crown of glory will she bestow on thee.’
    translation: JPS 1917
    original: תִּתֵּן לְרֹאשְׁךָ לִוְיַת־חֵן עֲטֶרֶת תִּפְאֶרֶת תְּמַגְּנֶךָּ׃
    hebrewPlain: תתן לראשך לוית חן עטרת תפארת תמגנך
    kjvRefs:
    - Proverbs 4:9
    kjvOsis:
    - Prov.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.10
    scripture: tanakh
    name: Tanakh Proverbs 4:10
    ref: Proverbs 4:10
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 17769
    text: Hear, O my son, and receive my sayings; And the years of thy life shall be many.
    translation: JPS 1917
    original: שְׁמַע בְּנִי וְקַח אֲמָרָי וְיִרְבּוּ לְךָ שְׁנוֹת חַיִּים׃
    hebrewPlain: שמע בני וקח אמרי וירבו לך שנות חיים
    kjvRefs:
    - Proverbs 4:10
    kjvOsis:
    - Prov.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.11
    scripture: tanakh
    name: Tanakh Proverbs 4:11
    ref: Proverbs 4:11
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 17770
    text: I have taught thee in the way of wisdom; I have led thee in paths of uprightness.
    translation: JPS 1917
    original: בְּדֶרֶךְ חָכְמָה הֹרֵתִיךָ הִדְרַכְתִּיךָ בְּמַעְגְּלֵי־יֹשֶׁר׃
    hebrewPlain: בדרך חכמה הרתיך הדרכתיך במעגלי ישר
    kjvRefs:
    - Proverbs 4:11
    kjvOsis:
    - Prov.4.11
  relations:
