    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.3
    scripture: tanakh
    name: Tanakh Proverbs 24:3
    ref: Proverbs 24:3
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 3
    ordinal: 18351
    text: Through wisdom is a house builded; And by understanding it is established;
    translation: JPS 1917
    original: בְּחָכְמָה יִבָּנֶה בָּיִת וּבִתְבוּנָה יִתְכּוֹנָן׃
    hebrewPlain: בחכמה יבנה בית ובתבונה יתכונן
    kjvRefs:
    - Proverbs 24:3
    kjvOsis:
    - Prov.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.4
    scripture: tanakh
    name: Tanakh Proverbs 24:4
    ref: Proverbs 24:4
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 4
    ordinal: 18352
    text: And by knowledge are the chambers filled With all precious and pleasant riches.
    translation: JPS 1917
    original: וּבְדַעַת חֲדָרִים יִמָּלְאוּ כָּל־הוֹן יָקָר וְנָעִים׃
    hebrewPlain: ובדעת חדרים ימלאו כל הון יקר ונעים
    kjvRefs:
    - Proverbs 24:4
    kjvOsis:
    - Prov.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.5
    scripture: tanakh
    name: Tanakh Proverbs 24:5
    ref: Proverbs 24:5
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 5
    ordinal: 18353
    text: A wise man is strong; Yea, a man of knowledge increaseth strength.
    translation: JPS 1917
    original: גֶּבֶר־חָכָם בַּעוֹז וְאִישׁ־דַּעַת מְאַמֶּץ־כֹּחַ׃
    hebrewPlain: גבר חכם בעוז ואיש דעת מאמץ כח
    kjvRefs:
    - Proverbs 24:5
    kjvOsis:
    - Prov.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.6
    scripture: tanakh
    name: Tanakh Proverbs 24:6
    ref: Proverbs 24:6
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 6
    ordinal: 18354
    text: For with wise advice thou shalt make thy war; And in the multitude of counsellors there is safety.
    translation: JPS 1917
    original: כִּי בְתַחְבֻּלוֹת תַּעֲשֶׂה־לְּךָ מִלְחָמָה וּתְשׁוּעָה בְּרֹב יוֹעֵץ׃
    hebrewPlain: כי בתחבלות תעשה לך מלחמה ותשועה ברב יועץ
    kjvRefs:
    - Proverbs 24:6
    kjvOsis:
    - Prov.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.7
    scripture: tanakh
    name: Tanakh Proverbs 24:7
    ref: Proverbs 24:7
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 7
    ordinal: 18355
    text: Wisdom is as unattainable to a fool as corals; He openeth not his mouth in the gate.
    translation: JPS 1917
    original: רָאמוֹת לֶאֱוִיל חָכְמוֹת בַּשַּׁעַר לֹא יִפְתַּח־פִּיהוּ׃
    hebrewPlain: ראמות לאויל חכמות בשער לא יפתח פיהו
    kjvRefs:
    - Proverbs 24:7
    kjvOsis:
    - Prov.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.8
    scripture: tanakh
    name: Tanakh Proverbs 24:8
    ref: Proverbs 24:8
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 8
    ordinal: 18356
    text: He that deviseth to do evil, Men shall call him a mischievous person.
    translation: JPS 1917
    original: מְחַשֵּׁב לְהָרֵעַ לוֹ בַּעַל־מְזִמּוֹת יִקְרָאוּ׃
    hebrewPlain: מחשב להרע לו בעל מזמות יקראו
    kjvRefs:
    - Proverbs 24:8
    kjvOsis:
    - Prov.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.9
    scripture: tanakh
    name: Tanakh Proverbs 24:9
    ref: Proverbs 24:9
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 9
    ordinal: 18357
    text: The thought of foolishness is sin; And the scorner is an abomination to men.
    translation: JPS 1917
    original: זִמַּת אִוֶּלֶת חַטָּאת וְתוֹעֲבַת לְאָדָם לֵץ׃
    hebrewPlain: זמת אולת חטאת ותועבת לאדם לץ
    kjvRefs:
    - Proverbs 24:9
    kjvOsis:
    - Prov.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.10
    scripture: tanakh
    name: Tanakh Proverbs 24:10
    ref: Proverbs 24:10
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 10
    ordinal: 18358
    text: If thou faint in the day of adversity, Thy strength is small indeed.
    translation: JPS 1917
    original: הִתְרַפִּיתָ בְּיוֹם צָרָה צַר כֹּחֶכָה׃
    hebrewPlain: התרפית ביום צרה צר כחכה
    kjvRefs:
    - Proverbs 24:10
    kjvOsis:
    - Prov.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.11
    scripture: tanakh
    name: Tanakh Proverbs 24:11
    ref: Proverbs 24:11
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 11
    ordinal: 18359
    text: Deliver them that are drawn unto death; And those that are ready to be slain wilt thou forbear to rescue?
    translation: JPS 1917
    original: הַצֵּל לְקֻחִים לַמָּוֶת וּמָטִים לַהֶרֶג אִם־תַּחְשׂוֹךְ׃
    hebrewPlain: הצל לקחים למות ומטים להרג אם תחשוך
    kjvRefs:
    - Proverbs 24:11
    kjvOsis:
    - Prov.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.12
    scripture: tanakh
    name: Tanakh Proverbs 24:12
    ref: Proverbs 24:12
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 12
    ordinal: 18360
    text: 'If thou sayest: ‘Behold, we knew not this’, Doth not He that weigheth the hearts consider it? And He that keepeth thy soul, doth not He know it? And shall not He render to every man according to his works?'
    translation: JPS 1917
    original: כִּי־תֹאמַר הֵן לֹא־יָדַעְנוּ זֶה הֲ‍לֹא־תֹכֵן לִבּוֹת הוּא־יָבִין וְנֹצֵר נַפְשְׁךָ הוּא יֵדָע וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ׃
    hebrewPlain: כי תאמר הן לא ידענו זה ה‍לא תכן לבות הוא יבין ונצר נפשך הוא ידע והשיב לאדם כפעלו
    kjvRefs:
    - Proverbs 24:12
    kjvOsis:
    - Prov.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.13
    scripture: tanakh
    name: Tanakh Proverbs 24:13
    ref: Proverbs 24:13
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 13
    ordinal: 18361
    text: My son, eat thou honey, for it is good, And the honeycomb is sweet to thy taste;
    translation: JPS 1917
    original: אֱכָל־בְּנִי דְבַשׁ כִּי־טוֹב וְנֹפֶת מָתוֹק עַל־חִכֶּךָ׃
    hebrewPlain: אכל בני דבש כי טוב ונפת מתוק על חכך
    kjvRefs:
    - Proverbs 24:13
    kjvOsis:
    - Prov.24.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.14
    scripture: tanakh
    name: Tanakh Proverbs 24:14
    ref: Proverbs 24:14
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 14
    ordinal: 18362
    text: So know thou wisdom to be unto thy soul; If thou hast found it, then shall there be a future, And thy hope shall not be cut off.
    translation: JPS 1917
    original: כֵּן דְּעֶה חָכְמָה לְנַפְשֶׁךָ אִם־מָצָאתָ וְיֵשׁ אַחֲרִית וְתִקְוָתְךָ לֹא תִכָּרֵת׃
    hebrewPlain: כן דעה חכמה לנפשך אם מצאת ויש אחרית ותקותך לא תכרת
    kjvRefs:
    - Proverbs 24:14
    kjvOsis:
    - Prov.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.15
    scripture: tanakh
    name: Tanakh Proverbs 24:15
    ref: Proverbs 24:15
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 15
    ordinal: 18363
    text: Lie not in wait, O wicked man, against the dwelling of the righteous, Spoil not his resting-place;
    translation: JPS 1917
    original: אַל־תֶּאֱרֹב רָשָׁע לִנְוֵה צַדִּיק אַל־תְּשַׁדֵּד רִבְצוֹ׃
    hebrewPlain: אל תארב רשע לנוה צדיק אל תשדד רבצו
    kjvRefs:
    - Proverbs 24:15
    kjvOsis:
    - Prov.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.16
    scripture: tanakh
    name: Tanakh Proverbs 24:16
    ref: Proverbs 24:16
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 16
    ordinal: 18364
    text: For a righteous man falleth seven times, and riseth up again, But the wicked stumble under adversity.
    translation: JPS 1917
    original: כִּי שֶׁבַע יִפּוֹל צַדִּיק וָקָם וּרְשָׁעִים יִכָּשְׁלוּ בְרָעָה׃
    hebrewPlain: כי שבע יפול צדיק וקם ורשעים יכשלו ברעה
    kjvRefs:
    - Proverbs 24:16
    kjvOsis:
    - Prov.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.17
    scripture: tanakh
    name: Tanakh Proverbs 24:17
    ref: Proverbs 24:17
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 17
    ordinal: 18365
    text: Rejoice not when thine enemy falleth, And let not thy heart be glad when he stumbleth;
    translation: JPS 1917
    original: בִּנְפֹל אויביך [אוֹיִבְךָ] אַל־תִּשְׂמָח וּבִכָּשְׁלוֹ אַל־יָגֵל לִבֶּךָ׃
    hebrewPlain: בנפל אויביך [אויבך] אל תשמח ובכשלו אל יגל לבך
    kjvRefs:
    - Proverbs 24:17
    kjvOsis:
    - Prov.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.18
    scripture: tanakh
    name: Tanakh Proverbs 24:18
    ref: Proverbs 24:18
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 18
    ordinal: 18366
    text: Lest the LORD see it, and it displease Him, And He turn away His wrath from him.
    translation: JPS 1917
    original: פֶּן־יִרְאֶה יְהוָה וְרַע בְּעֵינָיו וְהֵשִׁיב מֵעָלָיו אַפּוֹ׃
    hebrewPlain: פן יראה יהוה ורע בעיניו והשיב מעליו אפו
    kjvRefs:
    - Proverbs 24:18
    kjvOsis:
    - Prov.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.19
    scripture: tanakh
    name: Tanakh Proverbs 24:19
    ref: Proverbs 24:19
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 19
    ordinal: 18367
    text: Fret not thyself because of evildoers, Neither be thou envious at the wicked;
    translation: JPS 1917
    original: אַל־תִּתְחַר בַּמְּרֵעִים אַל־תְּקַנֵּא בָּרְשָׁעִים׃
    hebrewPlain: אל תתחר במרעים אל תקנא ברשעים
    kjvRefs:
    - Proverbs 24:19
    kjvOsis:
    - Prov.24.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.20
    scripture: tanakh
    name: Tanakh Proverbs 24:20
    ref: Proverbs 24:20
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 20
    ordinal: 18368
    text: For there will be no future to the evil man, The lamp of the wicked shall be put out.
    translation: JPS 1917
    original: כִּי לֹא־תִהְיֶה אַחֲרִית לָרָע נֵר רְשָׁעִים יִדְעָךְ׃
    hebrewPlain: כי לא תהיה אחרית לרע נר רשעים ידעך
    kjvRefs:
    - Proverbs 24:20
    kjvOsis:
    - Prov.24.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.21
    scripture: tanakh
    name: Tanakh Proverbs 24:21
    ref: Proverbs 24:21
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 21
    ordinal: 18369
    text: My son, fear thou the LORD and the king, And meddle not with them that are given to change;
    translation: JPS 1917
    original: יְרָא־אֶת־יְהוָה בְּנִי וָמֶלֶךְ עִם־שׁוֹנִים אַל־תִּתְעָרָב׃
    hebrewPlain: ירא את יהוה בני ומלך עם שונים אל תתערב
    kjvRefs:
    - Proverbs 24:21
    kjvOsis:
    - Prov.24.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.22
    scripture: tanakh
    name: Tanakh Proverbs 24:22
    ref: Proverbs 24:22
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 22
    ordinal: 18370
    text: For their calamity shall rise suddenly; And who knoweth the ruin from them both?
    translation: JPS 1917
    original: כִּי־פִתְאֹם יָקוּם אֵידָם וּפִיד שְׁנֵיהֶם מִי יוֹדֵעַ׃
    hebrewPlain: כי פתאם יקום אידם ופיד שניהם מי יודע
    kjvRefs:
    - Proverbs 24:22
    kjvOsis:
    - Prov.24.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.23
    scripture: tanakh
    name: Tanakh Proverbs 24:23
    ref: Proverbs 24:23
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 23
    ordinal: 18371
    text: These also are sayings of the wise. To have respect of persons in judgment is not good.
    translation: JPS 1917
    original: גַּם־אֵלֶּה לַחֲכָמִים הַכֵּר־פָּנִים בְּמִשְׁפָּט בַּל־טוֹב׃
    hebrewPlain: גם אלה לחכמים הכר פנים במשפט בל טוב
    kjvRefs:
    - Proverbs 24:23
    kjvOsis:
    - Prov.24.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.24
    scripture: tanakh
    name: Tanakh Proverbs 24:24
    ref: Proverbs 24:24
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 24
    ordinal: 18372
    text: 'He that saith unto the wicked: ‘Thou art righteous’, Peoples shall curse him, nations shall execrate him;'
    translation: JPS 1917
    original: אֹמֵר לְרָשָׁע צַדִּיק אָתָּה יִקְּבֻהוּ עַמִּים יִזְעָמוּהוּ לְאֻמִּים׃
    hebrewPlain: אמר לרשע צדיק אתה יקבהו עמים יזעמוהו לאמים
    kjvRefs:
    - Proverbs 24:24
    kjvOsis:
    - Prov.24.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.25
    scripture: tanakh
    name: Tanakh Proverbs 24:25
    ref: Proverbs 24:25
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 25
    ordinal: 18373
    text: But to them that decide justly shall be delight, And a good blessing shall come upon them.
    translation: JPS 1917
    original: וְלַמּוֹכִיחִים יִנְעָם וַעֲלֵיהֶם תָּבוֹא בִרְכַּת־טוֹב׃
    hebrewPlain: ולמוכיחים ינעם ועליהם תבוא ברכת טוב
    kjvRefs:
    - Proverbs 24:25
    kjvOsis:
    - Prov.24.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.26
    scripture: tanakh
    name: Tanakh Proverbs 24:26
    ref: Proverbs 24:26
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 26
    ordinal: 18374
    text: He kisseth the lips That giveth a right answer.
    translation: JPS 1917
    original: שְׂפָתַיִם יִשָּׁק מֵשִׁיב דְּבָרִים נְכֹחִים׃
    hebrewPlain: שפתים ישק משיב דברים נכחים
    kjvRefs:
    - Proverbs 24:26
    kjvOsis:
    - Prov.24.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.27
    scripture: tanakh
    name: Tanakh Proverbs 24:27
    ref: Proverbs 24:27
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 27
    ordinal: 18375
    text: Prepare thy work without, And make it fit for thyself in the field; And afterwards build thy house.
    translation: JPS 1917
    original: הָכֵן בַּחוּץ מְלַאכְתֶּךָ וְעַתְּדָהּ בַּשָּׂדֶה לָךְ אַחַר וּבָנִיתָ בֵיתֶךָ׃
    hebrewPlain: הכן בחוץ מלאכתך ועתדה בשדה לך אחר ובנית ביתך
    kjvRefs:
    - Proverbs 24:27
