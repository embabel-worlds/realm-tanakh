    name: Tanakh Proverbs 1:5
    ref: Proverbs 1:5
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 17674
    text: That the wise man may hear, and increase in learning, And the man of understanding may attain unto wise counsels;
    translation: JPS 1917
    original: יִשְׁמַע חָכָם וְיוֹסֶף לֶקַח וְנָבוֹן תַּחְבֻּלוֹת יִקְנֶה׃
    hebrewPlain: ישמע חכם ויוסף לקח ונבון תחבלות יקנה
    kjvRefs:
    - Proverbs 1:5
    kjvOsis:
