  data:
    osis: Prov.10.9
    scripture: tanakh
    name: Tanakh Proverbs 10:9
    ref: Proverbs 10:9
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 17934
    text: He that walketh uprightly walketh securely; but he that perverteth his ways shall be found out.
    translation: JPS 1917
    original: הוֹלֵךְ בַּתֹּם יֵלֶךְ בֶּטַח וּמְעַקֵּשׁ דְּרָכָיו יִוָּדֵעַ׃
    hebrewPlain: הולך בתם ילך בטח ומעקש דרכיו יודע
