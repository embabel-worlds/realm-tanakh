    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 17923
    text: '’Whoso is thoughtless, let him turn in hither’; And as for him that lacketh understanding, she saith to him:'
    translation: JPS 1917
    original: מִי־פֶתִי יָסֻר הֵנָּה וַחֲסַר־לֵב וְאָמְרָה לּוֹ׃
    hebrewPlain: מי פתי יסר הנה וחסר לב ואמרה לו
