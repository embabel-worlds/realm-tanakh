  data:
    osis: Prov.10.11
    scripture: tanakh
    name: Tanakh Proverbs 10:11
    ref: Proverbs 10:11
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 17936
    text: The mouth of the righteous is a fountain of life; but the mouth of the wicked concealeth violence.
    translation: JPS 1917
    original: מְקוֹר חַיִּים פִּי צַדִּיק וּפִי רְשָׁעִים יְכַסֶּה חָמָס׃
