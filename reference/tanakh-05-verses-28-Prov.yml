  data:
    osis: Prov.16.31
    scripture: tanakh
    name: Tanakh Proverbs 16:31
    ref: Proverbs 16:31
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 31
    ordinal: 18140
    text: The hoary head is a crown of glory, It is found in the way of righteousness.
    translation: JPS 1917
    original: עֲטֶרֶת תִּפְאֶרֶת שֵׂיבָה בְּדֶרֶךְ צְדָקָה תִּמָּצֵא׃
    hebrewPlain: עטרת תפארת שיבה בדרך צדקה תמצא
    kjvRefs:
    - Proverbs 16:31
    kjvOsis:
    - Prov.16.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.32
    scripture: tanakh
    name: Tanakh Proverbs 16:32
    ref: Proverbs 16:32
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 32
    ordinal: 18141
    text: He that is slow to anger is better than the mighty; And he that ruleth his spirit than he that taketh a city.
    translation: JPS 1917
    original: טוֹב אֶרֶךְ אַפַּיִם מִגִּבּוֹר וּמֹשֵׁל בְּרוּחוֹ מִלֹּכֵד עִיר׃
    hebrewPlain: טוב ארך אפים מגבור ומשל ברוחו מלכד עיר
    kjvRefs:
    - Proverbs 16:32
    kjvOsis:
    - Prov.16.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.33
    scripture: tanakh
    name: Tanakh Proverbs 16:33
    ref: Proverbs 16:33
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 33
    ordinal: 18142
    text: The lot is cast into the lap; But the whole disposing thereof is of the LORD.
    translation: JPS 1917
    original: בַּחֵיק יוּטַל אֶת־הַגּוֹרָל וּמֵיְהוָה כָּל־מִשְׁפָּטוֹ׃
    hebrewPlain: בחיק יוטל את הגורל ומיהוה כל משפטו
    kjvRefs:
    - Proverbs 16:33
    kjvOsis:
    - Prov.16.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.17.1
    scripture: tanakh
    name: Tanakh Proverbs 17:1
    ref: Proverbs 17:1
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 1
    ordinal: 18143
    text: Better is a dry morsel and quietness therewith, Than a house full of feasting with strife.
    translation: JPS 1917
    original: טוֹב פַּת חֲרֵבָה וְשַׁלְוָה־בָהּ מִבַּיִת מָלֵא זִבְחֵי־רִיב׃
    hebrewPlain: טוב פת חרבה ושלוה בה מבית מלא זבחי ריב
    kjvRefs:
    - Proverbs 17:1
    kjvOsis:
    - Prov.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.2
    scripture: tanakh
    name: Tanakh Proverbs 17:2
    ref: Proverbs 17:2
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 2
    ordinal: 18144
    text: A servant that dealeth wisely shall have rule over a son that dealeth shamefully, And shall have part of the inheritance among the brethren.
    translation: JPS 1917
    original: עֶבֶד־מַשְׂכִּיל יִמְשֹׁל בְּבֵן מֵבִישׁ וּבְתוֹךְ אַחִים יַחֲלֹק נַחֲלָה׃
    hebrewPlain: עבד משכיל ימשל בבן מביש ובתוך אחים יחלק נחלה
    kjvRefs:
    - Proverbs 17:2
    kjvOsis:
    - Prov.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.3
    scripture: tanakh
    name: Tanakh Proverbs 17:3
    ref: Proverbs 17:3
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 3
    ordinal: 18145
    text: The refining pot is for silver, and the furnace for gold; But the LORD trieth the hearts. .
    translation: JPS 1917
    original: מַצְרֵף לַכֶּסֶף וְכוּר לַזָּהָב וּבֹחֵן לִבּוֹת יְהוָה׃
    hebrewPlain: מצרף לכסף וכור לזהב ובחן לבות יהוה
    kjvRefs:
    - Proverbs 17:3
    kjvOsis:
    - Prov.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.4
    scripture: tanakh
    name: Tanakh Proverbs 17:4
    ref: Proverbs 17:4
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 4
    ordinal: 18146
    text: A evil-doer giveth heed to wicked lips; And a liar giveth ear to a mischievous tongue.
    translation: JPS 1917
    original: מֵרַע מַקְשִׁיב עַל־שְׂפַת־אָוֶן שֶׁקֶר מֵזִין עַל־לְשׁוֹן הַוֺּת׃
    hebrewPlain: מרע מקשיב על שפת און שקר מזין על לשון הות
    kjvRefs:
    - Proverbs 17:4
    kjvOsis:
    - Prov.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.5
    scripture: tanakh
    name: Tanakh Proverbs 17:5
    ref: Proverbs 17:5
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 5
    ordinal: 18147
    text: Whoso mocketh the poor blasphemeth his Maker; And he that is glad at calamity shall not be unpunished.
    translation: JPS 1917
    original: לֹעֵג לָרָשׁ חֵרֵף עֹשֵׂהוּ שָׂמֵחַ לְאֵיד לֹא יִנָּקֶה׃
    hebrewPlain: לעג לרש חרף עשהו שמח לאיד לא ינקה
    kjvRefs:
    - Proverbs 17:5
    kjvOsis:
    - Prov.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.6
    scripture: tanakh
    name: Tanakh Proverbs 17:6
    ref: Proverbs 17:6
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 6
    ordinal: 18148
    text: Children’s children are the crown of old men; And the glory of children are their fathers.
    translation: JPS 1917
    original: עֲטֶרֶת זְקֵנִים בְּנֵי בָנִים וְתִפְאֶרֶת בָּנִים אֲבוֹתָם׃
    hebrewPlain: עטרת זקנים בני בנים ותפארת בנים אבותם
    kjvRefs:
    - Proverbs 17:6
    kjvOsis:
    - Prov.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.7
    scripture: tanakh
    name: Tanakh Proverbs 17:7
    ref: Proverbs 17:7
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 7
    ordinal: 18149
    text: Overbearing speech becometh not a churl; Much less do lying lips a prince.
    translation: JPS 1917
    original: לֹא־נָאוָה לְנָבָל שְׂפַת־יֶתֶר אַף כִּי־לְנָדִיב שְׂפַת־שָׁקֶר׃
    hebrewPlain: לא נאוה לנבל שפת יתר אף כי לנדיב שפת שקר
    kjvRefs:
    - Proverbs 17:7
    kjvOsis:
    - Prov.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.8
    scripture: tanakh
    name: Tanakh Proverbs 17:8
    ref: Proverbs 17:8
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 8
    ordinal: 18150
    text: A gift is as a precious stone in the eyes of him that hath it; Whithersoever he turneth, he prospereth.
    translation: JPS 1917
    original: אֶבֶן־חֵן הַשֹּׁחַד בְּעֵינֵי בְעָלָיו אֶל־כָּל־אֲשֶׁר יִפְנֶה יַשְׂכִּיל׃
    hebrewPlain: אבן חן השחד בעיני בעליו אל כל אשר יפנה ישכיל
    kjvRefs:
    - Proverbs 17:8
    kjvOsis:
    - Prov.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.9
    scripture: tanakh
    name: Tanakh Proverbs 17:9
    ref: Proverbs 17:9
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 9
    ordinal: 18151
    text: He that covereth a transgression seeketh love; But he that harpeth on a matter estrangeth a familiar friend.
    translation: JPS 1917
    original: מְכַסֶּה־פֶּשַׁע מְבַקֵּשׁ אַהֲבָה וְשֹׁנֶה בְדָבָר מַפְרִיד אַלּוּף׃
    hebrewPlain: מכסה פשע מבקש אהבה ושנה בדבר מפריד אלוף
    kjvRefs:
    - Proverbs 17:9
    kjvOsis:
    - Prov.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.10
    scripture: tanakh
    name: Tanakh Proverbs 17:10
    ref: Proverbs 17:10
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 10
    ordinal: 18152
    text: A rebuke entereth deeper into a man of understanding Than a hundred stripes into a fool.
    translation: JPS 1917
    original: תֵּחַת גְּעָרָה בְמֵבִין מֵהַכּוֹת כְּסִיל מֵאָה׃
    hebrewPlain: תחת גערה במבין מהכות כסיל מאה
    kjvRefs:
    - Proverbs 17:10
    kjvOsis:
    - Prov.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.11
    scripture: tanakh
    name: Tanakh Proverbs 17:11
    ref: Proverbs 17:11
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 11
    ordinal: 18153
    text: A rebellious man seeketh only evil; Therefore a cruel messenger shall be sent against him.
    translation: JPS 1917
    original: אַךְ־מְרִי יְבַקֶּשׁ־רָע וּמַלְאָךְ אַכְזָרִי יְשֻׁלַּח־בּוֹ׃
    hebrewPlain: אך מרי יבקש רע ומלאך אכזרי ישלח בו
    kjvRefs:
    - Proverbs 17:11
    kjvOsis:
    - Prov.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.12
    scripture: tanakh
    name: Tanakh Proverbs 17:12
    ref: Proverbs 17:12
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 12
    ordinal: 18154
    text: Let a bear robbed of her whelps meet a man, Rather than a fool in his folly.
    translation: JPS 1917
    original: פָּגוֹשׁ דֹּב שַׁכּוּל בְּאִישׁ וְאַל־כְּסִיל בְּאִוַּלְתּוֹ׃
    hebrewPlain: פגוש דב שכול באיש ואל כסיל באולתו
    kjvRefs:
    - Proverbs 17:12
    kjvOsis:
    - Prov.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.13
    scripture: tanakh
    name: Tanakh Proverbs 17:13
    ref: Proverbs 17:13
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 13
    ordinal: 18155
    text: Whoso rewardeth evil for good, Evil shall not depart from his house.
    translation: JPS 1917
    original: מֵשִׁיב רָעָה תַּחַת טוֹבָה לֹא־תמיש [תָמוּשׁ] רָעָה מִבֵּיתוֹ׃
    hebrewPlain: משיב רעה תחת טובה לא תמיש [תמוש] רעה מביתו
    kjvRefs:
    - Proverbs 17:13
    kjvOsis:
    - Prov.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.14
    scripture: tanakh
    name: Tanakh Proverbs 17:14
    ref: Proverbs 17:14
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 14
    ordinal: 18156
    text: The beginning of strife is as when one letteth out water; Therefore leave off contention, before the quarrel break out.
    translation: JPS 1917
    original: פּוֹטֵר מַיִם רֵאשִׁית מָדוֹן וְלִפְנֵי הִתְגַּלַּע הָרִיב נְטוֹשׁ׃
    hebrewPlain: פוטר מים ראשית מדון ולפני התגלע הריב נטוש
    kjvRefs:
    - Proverbs 17:14
    kjvOsis:
    - Prov.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.15
    scripture: tanakh
    name: Tanakh Proverbs 17:15
    ref: Proverbs 17:15
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 15
    ordinal: 18157
    text: He that justifieth the wicked, and he that condemneth the righteous, Even they both are an abomination to the LORD.
    translation: JPS 1917
    original: מַצְדִּיק רָשָׁע וּמַרְשִׁיעַ צַדִּיק תּוֹעֲבַת יְהוָה גַּם־שְׁנֵיהֶם׃
    hebrewPlain: מצדיק רשע ומרשיע צדיק תועבת יהוה גם שניהם
    kjvRefs:
    - Proverbs 17:15
    kjvOsis:
    - Prov.17.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.16
    scripture: tanakh
    name: Tanakh Proverbs 17:16
    ref: Proverbs 17:16
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 16
    ordinal: 18158
    text: Wherefore is there a price in the hand of a fool To buy wisdom, seeing he hath no understanding?
    translation: JPS 1917
    original: לָמָּה־זֶּה מְחִיר בְּיַד־כְּסִיל לִקְנוֹת חָכְמָה וְלֶב־אָיִן׃
    hebrewPlain: למה זה מחיר ביד כסיל לקנות חכמה ולב אין
    kjvRefs:
    - Proverbs 17:16
    kjvOsis:
    - Prov.17.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.17
    scripture: tanakh
    name: Tanakh Proverbs 17:17
    ref: Proverbs 17:17
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 17
    ordinal: 18159
    text: A friend loveth at all times, And a brother is born for adversity.
    translation: JPS 1917
    original: בְּכָל־עֵת אֹהֵב הָרֵעַ וְאָח לְצָרָה יִוָּלֵד׃
    hebrewPlain: בכל עת אהב הרע ואח לצרה יולד
    kjvRefs:
    - Proverbs 17:17
    kjvOsis:
    - Prov.17.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.18
    scripture: tanakh
    name: Tanakh Proverbs 17:18
    ref: Proverbs 17:18
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 18
    ordinal: 18160
    text: A man void of understanding is he that striketh hands, And becometh surety in the presence of his neighbour.
    translation: JPS 1917
    original: אָדָם חֲסַר־לֵב תּוֹקֵעַ כָּף עֹרֵב עֲרֻבָּה לִפְנֵי רֵעֵהוּ׃
    hebrewPlain: אדם חסר לב תוקע כף ערב ערבה לפני רעהו
    kjvRefs:
    - Proverbs 17:18
    kjvOsis:
    - Prov.17.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.19
    scripture: tanakh
    name: Tanakh Proverbs 17:19
    ref: Proverbs 17:19
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 19
    ordinal: 18161
    text: He loveth transgression that loveth strife; He that exalteth his gate seeketh destruction.
    translation: JPS 1917
    original: אֹהֵב פֶּשַׁע אֹהֵב מַצָּה מַגְבִּיהַּ פִּתְחוֹ מְבַקֶּשׁ־שָׁבֶר׃
    hebrewPlain: אהב פשע אהב מצה מגביה פתחו מבקש שבר
    kjvRefs:
    - Proverbs 17:19
    kjvOsis:
    - Prov.17.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.20
    scripture: tanakh
    name: Tanakh Proverbs 17:20
    ref: Proverbs 17:20
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 20
    ordinal: 18162
    text: He that hath a forward heart findeth no good; And he that hath a perverse tongue falleth into evil.
    translation: JPS 1917
    original: עִקֶּשׁ־לֵב לֹא יִמְצָא־טוֹב וְנֶהְפָּךְ בִּלְשׁוֹנוֹ יִפּוֹל בְּרָעָה׃
    hebrewPlain: עקש לב לא ימצא טוב ונהפך בלשונו יפול ברעה
    kjvRefs:
    - Proverbs 17:20
    kjvOsis:
    - Prov.17.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.21
    scripture: tanakh
    name: Tanakh Proverbs 17:21
    ref: Proverbs 17:21
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 21
    ordinal: 18163
    text: He that begetteth a fool doeth it to his sorrow; And the father of a churl hath no joy.
    translation: JPS 1917
    original: יֹלֵד כְּסִיל לְתוּגָה לוֹ וְלֹא־יִשְׂמַח אֲבִי נָבָל׃
    hebrewPlain: ילד כסיל לתוגה לו ולא ישמח אבי נבל
    kjvRefs:
    - Proverbs 17:21
    kjvOsis:
    - Prov.17.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.22
    scripture: tanakh
    name: Tanakh Proverbs 17:22
    ref: Proverbs 17:22
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 22
    ordinal: 18164
    text: A merry heart is a good medicine; But a broken spirit drieth the bones.
    translation: JPS 1917
    original: לֵב שָׂמֵחַ יֵיטִב גֵּהָה וְרוּחַ נְכֵאָה תְּיַבֶּשׁ־גָּרֶם׃
    hebrewPlain: לב שמח ייטב גהה ורוח נכאה תיבש גרם
    kjvRefs:
    - Proverbs 17:22
    kjvOsis:
    - Prov.17.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.23
    scripture: tanakh
    name: Tanakh Proverbs 17:23
    ref: Proverbs 17:23
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 23
    ordinal: 18165
    text: A wicked man taketh a gift out of the bosom, To pervert the ways of justice.
    translation: JPS 1917
    original: שֹׁחַד מֵחֵיק רָשָׁע יִקָּח לְהַטּוֹת אָרְחוֹת מִשְׁפָּט׃
    hebrewPlain: שחד מחיק רשע יקח להטות ארחות משפט
    kjvRefs:
    - Proverbs 17:23
    kjvOsis:
    - Prov.17.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.24
    scripture: tanakh
    name: Tanakh Proverbs 17:24
    ref: Proverbs 17:24
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 24
    ordinal: 18166
    text: Wisdom is before him that hath understanding; But the eyes of a fool are in the ends of the earth.
    translation: JPS 1917
    original: אֶת־פְּנֵי מֵבִין חָכְמָה וְעֵינֵי כְסִיל בִּקְצֵה־אָרֶץ׃
    hebrewPlain: את פני מבין חכמה ועיני כסיל בקצה ארץ
    kjvRefs:
    - Proverbs 17:24
    kjvOsis:
    - Prov.17.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.25
    scripture: tanakh
    name: Tanakh Proverbs 17:25
    ref: Proverbs 17:25
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 25
    ordinal: 18167
    text: A foolish son is vexation to his father, And bitterness to her that bore him.
    translation: JPS 1917
    original: כַּעַס לְאָבִיו בֵּן כְּסִיל וּמֶמֶר לְיוֹלַדְתּוֹ׃
    hebrewPlain: כעס לאביו בן כסיל וממר ליולדתו
    kjvRefs:
    - Proverbs 17:25
    kjvOsis:
    - Prov.17.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.26
    scripture: tanakh
    name: Tanakh Proverbs 17:26
    ref: Proverbs 17:26
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 26
    ordinal: 18168
    text: To punish also the righteous is not good, Nor to strike the noble for their uprightness.
    translation: JPS 1917
    original: גַּם עֲנוֹשׁ לַצַּדִּיק לֹא־טוֹב לְהַכּוֹת נְדִיבִים עַל־יֹשֶׁר׃
    hebrewPlain: גם ענוש לצדיק לא טוב להכות נדיבים על ישר
    kjvRefs:
    - Proverbs 17:26
    kjvOsis:
    - Prov.17.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.27
    scripture: tanakh
    name: Tanakh Proverbs 17:27
    ref: Proverbs 17:27
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 27
    ordinal: 18169
    text: He that spareth his words hath knowledge; And he that husbandeth his spirit is a man of discernment.
    translation: JPS 1917
    original: חוֹשֵׂךְ אֲמָרָיו יוֹדֵעַ דָּעַת וקר־[יְקַר־] רוּחַ אִישׁ תְּבוּנָה׃
    hebrewPlain: חושך אמריו יודע דעת וקר [יקר ] רוח איש תבונה
    kjvRefs:
    - Proverbs 17:27
    kjvOsis:
    - Prov.17.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.17.28
    scripture: tanakh
    name: Tanakh Proverbs 17:28
    ref: Proverbs 17:28
    book: Prov
    section: ketuvim
    chapter: 17
    verse: 28
    ordinal: 18170
    text: Even a fool, when he holdeth his peace, is counted wise; And he that shutteth his lips is esteemed as a man of understanding.
    translation: JPS 1917
    original: גַּם אֱוִיל מַחֲרִישׁ חָכָם יֵחָשֵׁב אֹטֵם שְׂפָתָיו נָבוֹן׃
    hebrewPlain: גם אויל מחריש חכם יחשב אטם שפתיו נבון
    kjvRefs:
    - Proverbs 17:28
    kjvOsis:
    - Prov.17.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.17
- type: TanakhVerse
  data:
    osis: Prov.18.1
    scripture: tanakh
    name: Tanakh Proverbs 18:1
    ref: Proverbs 18:1
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 1
    ordinal: 18171
    text: He that separateth himself seeketh his own desire, And snarlest against all sound wisdom.
    translation: JPS 1917
    original: לְתַאֲוָה יְבַקֵּשׁ נִפְרָד בְּכָל־תּוּשִׁיָּה יִתְגַּלָּע׃
    hebrewPlain: לתאוה יבקש נפרד בכל תושיה יתגלע
    kjvRefs:
    - Proverbs 18:1
    kjvOsis:
    - Prov.18.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.2
    scripture: tanakh
    name: Tanakh Proverbs 18:2
    ref: Proverbs 18:2
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 2
    ordinal: 18172
    text: A fool hath no delight in understanding, But only that his heart may lay itself bare.
    translation: JPS 1917
    original: לֹא־יַחְפֹּץ כְּסִיל בִּתְבוּנָה כִּי אִם־בְּהִתְגַּלּוֹת לִבּוֹ׃
    hebrewPlain: לא יחפץ כסיל בתבונה כי אם בהתגלות לבו
    kjvRefs:
    - Proverbs 18:2
    kjvOsis:
    - Prov.18.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.3
    scripture: tanakh
    name: Tanakh Proverbs 18:3
    ref: Proverbs 18:3
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 3
    ordinal: 18173
    text: When the wicked cometh, there cometh also contempt, And with ignominy reproach.
    translation: JPS 1917
    original: בְּבוֹא־רָשָׁע בָּא גַם־בּוּז וְעִם־קָלוֹן חֶרְפָּה׃
    hebrewPlain: בבוא רשע בא גם בוז ועם קלון חרפה
    kjvRefs:
    - Proverbs 18:3
    kjvOsis:
    - Prov.18.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.4
    scripture: tanakh
    name: Tanakh Proverbs 18:4
    ref: Proverbs 18:4
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 4
    ordinal: 18174
    text: The words of a man’s mouth are as deep waters; A flowing brook, a fountain of wisdom.
    translation: JPS 1917
    original: מַיִם עֲמֻקִּים דִּבְרֵי פִי־אִישׁ נַחַל נֹבֵעַ מְקוֹר חָכְמָה׃
    hebrewPlain: מים עמקים דברי פי איש נחל נבע מקור חכמה
    kjvRefs:
    - Proverbs 18:4
    kjvOsis:
    - Prov.18.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.5
    scripture: tanakh
    name: Tanakh Proverbs 18:5
    ref: Proverbs 18:5
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 5
    ordinal: 18175
    text: It is not good to respect the person of the wicked, So as to turn aside the righteous in judgment.
    translation: JPS 1917
    original: שְׂאֵת פְּנֵי־רָשָׁע לֹא־טוֹב לְהַטּוֹת צַדִּיק בַּמִּשְׁפָּט׃
    hebrewPlain: שאת פני רשע לא טוב להטות צדיק במשפט
    kjvRefs:
    - Proverbs 18:5
    kjvOsis:
    - Prov.18.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.6
    scripture: tanakh
    name: Tanakh Proverbs 18:6
    ref: Proverbs 18:6
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 6
    ordinal: 18176
    text: A fool’s lips enter into contention, And his mouth calleth for strokes.
    translation: JPS 1917
    original: שִׂפְתֵי כְסִיל יָבֹאוּ בְרִיב וּפִיו לְמַהֲלֻמוֹת יִקְרָא׃
    hebrewPlain: שפתי כסיל יבאו בריב ופיו למהלמות יקרא
    kjvRefs:
    - Proverbs 18:6
    kjvOsis:
    - Prov.18.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.7
    scripture: tanakh
    name: Tanakh Proverbs 18:7
    ref: Proverbs 18:7
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 7
    ordinal: 18177
    text: A fool’s mouth is his ruin, And his lips are the snare of his soul.
    translation: JPS 1917
    original: פִּי־כְסִיל מְחִתָּה־לוֹ וּשְׂפָתָיו מוֹקֵשׁ נַפְשׁוֹ׃
    hebrewPlain: פי כסיל מחתה לו ושפתיו מוקש נפשו
    kjvRefs:
    - Proverbs 18:7
    kjvOsis:
    - Prov.18.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.8
    scripture: tanakh
    name: Tanakh Proverbs 18:8
    ref: Proverbs 18:8
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 8
    ordinal: 18178
    text: The words of a whisperer are as dainty morsels, And they go down into the innermost parts of the belly.
    translation: JPS 1917
    original: דִּבְרֵי נִרְגָּן כְּמִתְלַהֲמִים וְהֵם יָרְדוּ חַדְרֵי־בָטֶן׃
    hebrewPlain: דברי נרגן כמתלהמים והם ירדו חדרי בטן
    kjvRefs:
    - Proverbs 18:8
    kjvOsis:
    - Prov.18.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.9
    scripture: tanakh
    name: Tanakh Proverbs 18:9
    ref: Proverbs 18:9
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 9
    ordinal: 18179
    text: Even one that is slack in his work Is brother to him that is a destroyer. .
    translation: JPS 1917
    original: גַּם מִתְרַפֶּה בִמְלַאכְתּוֹ אָח הוּא לְבַעַל מַשְׁחִית׃
    hebrewPlain: גם מתרפה במלאכתו אח הוא לבעל משחית
    kjvRefs:
    - Proverbs 18:9
    kjvOsis:
    - Prov.18.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.10
    scripture: tanakh
    name: Tanakh Proverbs 18:10
    ref: Proverbs 18:10
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 10
    ordinal: 18180
    text: 'The name of the LORD is a strong tower: The righteous runneth into it, and is set up on high.'
    translation: JPS 1917
    original: מִגְדַּל־עֹז שֵׁם יְהוָה בּוֹ־יָרוּץ צַדִּיק וְנִשְׂגָּב׃
    hebrewPlain: מגדל עז שם יהוה בו ירוץ צדיק ונשגב
    kjvRefs:
    - Proverbs 18:10
    kjvOsis:
    - Prov.18.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.11
    scripture: tanakh
    name: Tanakh Proverbs 18:11
    ref: Proverbs 18:11
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 11
    ordinal: 18181
    text: The rich man’s wealth is his strong city, And as a high wall in his own conceit.
    translation: JPS 1917
    original: הוֹן עָשִׁיר קִרְיַת עֻזּוֹ וּכְחוֹמָה נִשְׂגָּבָה בְּמַשְׂכִּיתוֹ׃
    hebrewPlain: הון עשיר קרית עזו וכחומה נשגבה במשכיתו
    kjvRefs:
    - Proverbs 18:11
    kjvOsis:
    - Prov.18.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.12
    scripture: tanakh
    name: Tanakh Proverbs 18:12
    ref: Proverbs 18:12
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 12
    ordinal: 18182
    text: Before destruction the heart of a man is haughty, And before honour goeth humility.
    translation: JPS 1917
    original: לִפְנֵי־שֶׁבֶר יִגְבַּהּ לֵב־אִישׁ וְלִפְנֵי כָבוֹד עֲנָוָה׃
    hebrewPlain: לפני שבר יגבה לב איש ולפני כבוד ענוה
    kjvRefs:
    - Proverbs 18:12
    kjvOsis:
    - Prov.18.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.13
    scripture: tanakh
    name: Tanakh Proverbs 18:13
    ref: Proverbs 18:13
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 13
    ordinal: 18183
    text: He that giveth answer before he heareth, It is folly and confusion unto him.
    translation: JPS 1917
    original: מֵשִׁיב דָּבָר בְּטֶרֶם יִשְׁמָע אִוֶּלֶת הִיא־לוֹ וּכְלִמָּה׃
    hebrewPlain: משיב דבר בטרם ישמע אולת היא לו וכלמה
    kjvRefs:
    - Proverbs 18:13
    kjvOsis:
    - Prov.18.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.14
    scripture: tanakh
    name: Tanakh Proverbs 18:14
    ref: Proverbs 18:14
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 14
    ordinal: 18184
    text: The spirit of a man will sustain his infirmity; But a broken spirit who can bear?
    translation: JPS 1917
    original: רוּחַ־אִישׁ יְכַלְכֵּל מַחֲלֵהוּ וְרוּחַ נְכֵאָה מִי יִשָּׂאֶנָּה׃
    hebrewPlain: רוח איש יכלכל מחלהו ורוח נכאה מי ישאנה
    kjvRefs:
    - Proverbs 18:14
    kjvOsis:
    - Prov.18.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.15
    scripture: tanakh
    name: Tanakh Proverbs 18:15
    ref: Proverbs 18:15
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 15
    ordinal: 18185
    text: The heart of the prudent getteth knowledge; And the ear of the wise seeketh knowledge.
    translation: JPS 1917
    original: לֵב נָבוֹן יִקְנֶה־דָּעַת וְאֹזֶן חֲכָמִים תְּבַקֶּשׁ־דָּעַת׃
    hebrewPlain: לב נבון יקנה דעת ואזן חכמים תבקש דעת
    kjvRefs:
    - Proverbs 18:15
    kjvOsis:
    - Prov.18.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.16
    scripture: tanakh
    name: Tanakh Proverbs 18:16
    ref: Proverbs 18:16
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 16
    ordinal: 18186
    text: A man’s gift maketh room for him, And bringeth him before great men.
    translation: JPS 1917
    original: מַתָּן אָדָם יַרְחִיב לוֹ וְלִפְנֵי גְדֹלִים יַנְחֶנּוּ׃
    hebrewPlain: מתן אדם ירחיב לו ולפני גדלים ינחנו
    kjvRefs:
    - Proverbs 18:16
    kjvOsis:
    - Prov.18.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.17
    scripture: tanakh
    name: Tanakh Proverbs 18:17
    ref: Proverbs 18:17
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 17
    ordinal: 18187
    text: He that pleadeth his cause first seemeth just; But his neighbour cometh and searcheth him out.
    translation: JPS 1917
    original: צַדִּיק הָרִאשׁוֹן בְּרִיבוֹ יבא־[וּבָא־] רֵעֵהוּ וַחֲקָרוֹ׃
    hebrewPlain: צדיק הראשון בריבו יבא [ובא ] רעהו וחקרו
    kjvRefs:
    - Proverbs 18:17
    kjvOsis:
    - Prov.18.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.18
    scripture: tanakh
    name: Tanakh Proverbs 18:18
    ref: Proverbs 18:18
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 18
    ordinal: 18188
    text: The lot causeth strife to cease, And parteth asunder the contentious.
    translation: JPS 1917
    original: מִדְיָנִים יַשְׁבִּית הַגּוֹרָל וּבֵין עֲצוּמִים יַפְרִיד׃
    hebrewPlain: מדינים ישבית הגורל ובין עצומים יפריד
    kjvRefs:
    - Proverbs 18:18
    kjvOsis:
    - Prov.18.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.19
    scripture: tanakh
    name: Tanakh Proverbs 18:19
    ref: Proverbs 18:19
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 19
    ordinal: 18189
    text: A brother offended is harder to be won than a strong city; And their contentions are like the bars of a castle.
    translation: JPS 1917
    original: אָח נִפְשָׁע מִקִּרְיַת־עֹז ומדונים [וּמִדְיָנִים] כִּבְרִיחַ אַרְמוֹן׃
    hebrewPlain: אח נפשע מקרית עז ומדונים [ומדינים] כבריח ארמון
    kjvRefs:
    - Proverbs 18:19
    kjvOsis:
    - Prov.18.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.20
    scripture: tanakh
    name: Tanakh Proverbs 18:20
    ref: Proverbs 18:20
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 20
    ordinal: 18190
    text: A man’s belly shall be filled with the fruit of his mouth; With the increase of his lips shall he be satisfied.
    translation: JPS 1917
    original: מִפְּרִי פִי־אִישׁ תִּשְׂבַּע בִּטְנוֹ תְּבוּאַת שְׂפָתָיו יִשְׂבָּע׃
    hebrewPlain: מפרי פי איש תשבע בטנו תבואת שפתיו ישבע
    kjvRefs:
    - Proverbs 18:20
    kjvOsis:
    - Prov.18.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.21
    scripture: tanakh
    name: Tanakh Proverbs 18:21
    ref: Proverbs 18:21
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 21
    ordinal: 18191
    text: Death and life are in the power of the tongue; And they that indulge it shall eat the fruit thereof.
    translation: JPS 1917
    original: מָוֶת וְחַיִּים בְּיַד־לָשׁוֹן וְאֹהֲבֶיהָ יֹאכַל פִּרְיָהּ׃
    hebrewPlain: מות וחיים ביד לשון ואהביה יאכל פריה
    kjvRefs:
    - Proverbs 18:21
    kjvOsis:
    - Prov.18.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.22
    scripture: tanakh
    name: Tanakh Proverbs 18:22
    ref: Proverbs 18:22
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 22
    ordinal: 18192
    text: Whoso findeth a wife findeth a great good, And obtaineth favour of the LORD.
    translation: JPS 1917
    original: מָצָא אִשָּׁה מָצָא טוֹב וַיָּפֶק רָצוֹן מֵיְהוָה׃
    hebrewPlain: מצא אשה מצא טוב ויפק רצון מיהוה
    kjvRefs:
    - Proverbs 18:22
    kjvOsis:
    - Prov.18.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.23
    scripture: tanakh
    name: Tanakh Proverbs 18:23
    ref: Proverbs 18:23
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 23
    ordinal: 18193
    text: The poor useth entreaties; But the rich answereth impudently.
    translation: JPS 1917
    original: תַּחֲנוּנִים יְדַבֶּר־רָשׁ וְעָשִׁיר יַעֲנֶה עַזּוֹת׃
    hebrewPlain: תחנונים ידבר רש ועשיר יענה עזות
    kjvRefs:
    - Proverbs 18:23
    kjvOsis:
    - Prov.18.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.18.24
    scripture: tanakh
    name: Tanakh Proverbs 18:24
    ref: Proverbs 18:24
    book: Prov
    section: ketuvim
    chapter: 18
    verse: 24
    ordinal: 18194
    text: There are friends that one hath to his own hurt; But there is a friend that sticketh closer than a brother.
    translation: JPS 1917
    original: אִישׁ רֵעִים לְהִתְרֹעֵעַ וְיֵשׁ אֹהֵב דָּבֵק מֵאָח׃
    hebrewPlain: איש רעים להתרעע ויש אהב דבק מאח
    kjvRefs:
    - Proverbs 18:24
    kjvOsis:
    - Prov.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.18
- type: TanakhVerse
  data:
    osis: Prov.19.1
    scripture: tanakh
    name: Tanakh Proverbs 19:1
    ref: Proverbs 19:1
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 1
    ordinal: 18195
    text: Better is the poor that walketh in his integrity Than he that is perverse in his lips and a fool at the same time.
    translation: JPS 1917
    original: טוֹב־רָשׁ הוֹלֵךְ בְּתֻמּוֹ מֵעִקֵּשׁ שְׂפָתָיו וְהוּא כְסִיל׃
    hebrewPlain: טוב רש הולך בתמו מעקש שפתיו והוא כסיל
    kjvRefs:
    - Proverbs 19:1
    kjvOsis:
    - Prov.19.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.2
    scripture: tanakh
    name: Tanakh Proverbs 19:2
    ref: Proverbs 19:2
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 2
    ordinal: 18196
    text: Also, that the soul be without knowledge is not good; And he that hasteth with his feet sinneth.
    translation: JPS 1917
    original: גַּם בְּלֹא־דַעַת נֶפֶשׁ לֹא־טוֹב וְאָץ בְּרַגְלַיִם חוֹטֵא׃
    hebrewPlain: גם בלא דעת נפש לא טוב ואץ ברגלים חוטא
    kjvRefs:
    - Proverbs 19:2
    kjvOsis:
    - Prov.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.3
    scripture: tanakh
    name: Tanakh Proverbs 19:3
    ref: Proverbs 19:3
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 3
    ordinal: 18197
    text: The foolishness of man perverteth his way; And his heart fretteth against the LORD.
    translation: JPS 1917
    original: אִוֶּלֶת אָדָם תְּסַלֵּף דַּרְכּוֹ וְעַל־יְהוָה יִזְעַף לִבּוֹ׃
    hebrewPlain: אולת אדם תסלף דרכו ועל יהוה יזעף לבו
    kjvRefs:
    - Proverbs 19:3
    kjvOsis:
    - Prov.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.4
    scripture: tanakh
    name: Tanakh Proverbs 19:4
    ref: Proverbs 19:4
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 4
    ordinal: 18198
    text: Wealth addeth many friends; But as for the poor, his friend separateth himself from him.
    translation: JPS 1917
    original: הוֹן יֹסִיף רֵעִים רַבִּים וְדָל מֵרֵעהוּ יִפָּרֵד׃
    hebrewPlain: הון יסיף רעים רבים ודל מרעהו יפרד
    kjvRefs:
    - Proverbs 19:4
    kjvOsis:
    - Prov.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.5
    scripture: tanakh
    name: Tanakh Proverbs 19:5
    ref: Proverbs 19:5
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 5
    ordinal: 18199
    text: A false witness shall not be unpunished; And he that breatheth forth lies shall not escape.
    translation: JPS 1917
    original: עֵד שְׁקָרִים לֹא יִנָּקֶה וְיָפִיחַ כְּזָבִים לֹא יִמָּלֵט׃
    hebrewPlain: עד שקרים לא ינקה ויפיח כזבים לא ימלט
    kjvRefs:
    - Proverbs 19:5
    kjvOsis:
    - Prov.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.6
    scripture: tanakh
    name: Tanakh Proverbs 19:6
    ref: Proverbs 19:6
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 6
    ordinal: 18200
    text: Many will entreat the favour of the liberal man; And every man is a friend to him that giveth gifts.
    translation: JPS 1917
    original: רַבִּים יְחַלּוּ פְנֵי־נָדִיב וְכָל־הָרֵעַ לְאִישׁ מַתָּן׃
    hebrewPlain: רבים יחלו פני נדיב וכל הרע לאיש מתן
    kjvRefs:
    - Proverbs 19:6
    kjvOsis:
    - Prov.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.7
    scripture: tanakh
    name: Tanakh Proverbs 19:7
    ref: Proverbs 19:7
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 7
    ordinal: 18201
    text: All the brethren of the poor do hate him; How much more do his friends go far from him! He that pursueth words, they turn against him.
    translation: JPS 1917
    original: כָּל אֲחֵי־רָשׁ שְׂנֵאֻהוּ אַף כִּי מְרֵעֵהוּ רָחֲקוּ מִמֶּנּוּ מְרַדֵּף אֲמָרִים לא־[לוֹ־] הֵמָּה׃
    hebrewPlain: כל אחי רש שנאהו אף כי מרעהו רחקו ממנו מרדף אמרים לא [לו ] המה
    kjvRefs:
    - Proverbs 19:7
    kjvOsis:
    - Prov.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.8
    scripture: tanakh
    name: Tanakh Proverbs 19:8
    ref: Proverbs 19:8
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 8
    ordinal: 18202
    text: He that getteth wisdom loveth his own soul; He that keepeth understanding shall find good.
    translation: JPS 1917
    original: קֹנֶה־לֵּב אֹהֵב נַפְשׁוֹ שֹׁמֵר תְּבוּנָה לִמְצֹא־טוֹב׃
    hebrewPlain: קנה לב אהב נפשו שמר תבונה למצא טוב
    kjvRefs:
    - Proverbs 19:8
    kjvOsis:
    - Prov.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.9
    scripture: tanakh
    name: Tanakh Proverbs 19:9
    ref: Proverbs 19:9
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 9
    ordinal: 18203
    text: A false witness shall not be unpunished; And he that breatheth forth lies shall perish.
    translation: JPS 1917
    original: עֵד שְׁקָרִים לֹא יִנָּקֶה וְיָפִיחַ כְּזָבִים יֹאבֵד׃
    hebrewPlain: עד שקרים לא ינקה ויפיח כזבים יאבד
    kjvRefs:
    - Proverbs 19:9
    kjvOsis:
    - Prov.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.10
    scripture: tanakh
    name: Tanakh Proverbs 19:10
    ref: Proverbs 19:10
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 10
    ordinal: 18204
    text: Luxury is not seemly for a fool; Much less for a servant to have rule over princes.
    translation: JPS 1917
    original: לֹא־נָאוֶה לִכְסִיל תַּעֲנוּג אַף כִּי־לְעֶבֶד מְשֹׁל בְּשָׂרִים׃
    hebrewPlain: לא נאוה לכסיל תענוג אף כי לעבד משל בשרים
    kjvRefs:
    - Proverbs 19:10
    kjvOsis:
    - Prov.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.11
    scripture: tanakh
    name: Tanakh Proverbs 19:11
    ref: Proverbs 19:11
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 11
    ordinal: 18205
    text: It is the discretion of a man to be slow to anger, And it is his glory to pass over a transgression.
    translation: JPS 1917
    original: שֵׂכֶל אָדָם הֶאֱרִיךְ אַפּוֹ וְתִפאַרְתּוֹ עֲבֹר עַל־פָּשַׁע׃
    hebrewPlain: שכל אדם האריך אפו ותפארתו עבר על פשע
    kjvRefs:
    - Proverbs 19:11
    kjvOsis:
    - Prov.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.12
    scripture: tanakh
    name: Tanakh Proverbs 19:12
    ref: Proverbs 19:12
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 12
    ordinal: 18206
    text: The king’s wrath is as the roaring of a lion; But his favour is as dew upon the grass.
    translation: JPS 1917
    original: נַהַם כַּכְּפִיר זַעַף מֶלֶךְ וּכְטַל עַל־עֵשֶׂב רְצוֹנוֹ׃
    hebrewPlain: נהם ככפיר זעף מלך וכטל על עשב רצונו
    kjvRefs:
    - Proverbs 19:12
    kjvOsis:
    - Prov.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.13
    scripture: tanakh
    name: Tanakh Proverbs 19:13
    ref: Proverbs 19:13
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 13
    ordinal: 18207
    text: A foolish son is the calamity of his father; And the contentions of a wife are a continual dropping.
    translation: JPS 1917
    original: הַוֺּת לְאָבִיו בֵּן כְּסִיל וְדֶלֶף טֹרֵד מִדְיְנֵי אִשָּׁה׃
    hebrewPlain: הות לאביו בן כסיל ודלף טרד מדיני אשה
    kjvRefs:
    - Proverbs 19:13
    kjvOsis:
    - Prov.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.14
    scripture: tanakh
    name: Tanakh Proverbs 19:14
    ref: Proverbs 19:14
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 14
    ordinal: 18208
    text: House and riches are the inheritance of fathers; But a prudent wife is from the LORD.
    translation: JPS 1917
    original: בַּיִת וָהוֹן נַחֲלַת אָבוֹת וּמֵיְהוָה אִשָּׁה מַשְׂכָּלֶת׃
    hebrewPlain: בית והון נחלת אבות ומיהוה אשה משכלת
    kjvRefs:
    - Proverbs 19:14
    kjvOsis:
    - Prov.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.15
    scripture: tanakh
    name: Tanakh Proverbs 19:15
    ref: Proverbs 19:15
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 15
    ordinal: 18209
    text: Slothfulness casteth into a deep sleep; And the idle soul shall suffer hunger.
    translation: JPS 1917
    original: עַצְלָה תַּפִּיל תַּרְדֵּמָה וְנֶפֶשׁ רְמִיָּה תִרְעָב׃
    hebrewPlain: עצלה תפיל תרדמה ונפש רמיה תרעב
    kjvRefs:
    - Proverbs 19:15
    kjvOsis:
    - Prov.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.16
    scripture: tanakh
    name: Tanakh Proverbs 19:16
    ref: Proverbs 19:16
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 16
    ordinal: 18210
    text: He that keepeth the commandment keepeth his soul; But he that despiseth His ways shall die.
    translation: JPS 1917
    original: שֹׁמֵר מִצְוָה שֹׁמֵר נַפְשׁוֹ בּוֹזֵה דְרָכָיו יומת [יָמוּת׃]
    hebrewPlain: שמר מצוה שמר נפשו בוזה דרכיו יומת [ימות]
    kjvRefs:
    - Proverbs 19:16
    kjvOsis:
    - Prov.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.17
    scripture: tanakh
    name: Tanakh Proverbs 19:17
    ref: Proverbs 19:17
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 17
    ordinal: 18211
    text: He that is gracious unto the poor lendeth unto the LORD; And his good deed will He repay unto him.
    translation: JPS 1917
    original: מַלְוֵה יְהוָה חוֹנֵן דָּל וּגְמֻלוֹ יְשַׁלֶּם־לוֹ׃
    hebrewPlain: מלוה יהוה חונן דל וגמלו ישלם לו
    kjvRefs:
    - Proverbs 19:17
    kjvOsis:
    - Prov.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.18
    scripture: tanakh
    name: Tanakh Proverbs 19:18
    ref: Proverbs 19:18
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 18
    ordinal: 18212
    text: Chasten thy son, for there is hope; But set not thy heart on his destruction. .
    translation: JPS 1917
    original: יַסֵּר בִּנְךָ כִּי־יֵשׁ תִּקְוָה וְאֶל־הֲמִיתוֹ אַל־תִּשָּׂא נַפְשֶׁךָ׃
    hebrewPlain: יסר בנך כי יש תקוה ואל המיתו אל תשא נפשך
    kjvRefs:
    - Proverbs 19:18
    kjvOsis:
    - Prov.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.19
    scripture: tanakh
    name: Tanakh Proverbs 19:19
    ref: Proverbs 19:19
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 19
    ordinal: 18213
    text: A man of great wrath shall suffer punishment; For if thou interpose, thou wilt add thereto.
    translation: JPS 1917
    original: גרל־[גְּדָל־] חֵמָה נֹשֵׂא עֹנֶשׁ כִּי אִם־תַּצִּיל וְעוֹד תּוֹסִף׃
    hebrewPlain: גרל [גדל ] חמה נשא ענש כי אם תציל ועוד תוסף
    kjvRefs:
    - Proverbs 19:19
    kjvOsis:
    - Prov.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.20
    scripture: tanakh
    name: Tanakh Proverbs 19:20
    ref: Proverbs 19:20
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 20
    ordinal: 18214
    text: Hear counsel, and receive instruction, That thou mayest be wise in thy latter end.
    translation: JPS 1917
    original: שְׁמַע עֵצָה וְקַבֵּל מוּסָר לְמַעַן תֶּחְכַּם בְּאַחֲרִיתֶךָ׃
    hebrewPlain: שמע עצה וקבל מוסר למען תחכם באחריתך
    kjvRefs:
    - Proverbs 19:20
    kjvOsis:
    - Prov.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.21
    scripture: tanakh
    name: Tanakh Proverbs 19:21
    ref: Proverbs 19:21
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 21
    ordinal: 18215
    text: There are many devices in a man’s heart; But the counsel of the LORD, that shall stand.
    translation: JPS 1917
    original: רַבּוֹת מַחֲשָׁבוֹת בְּלֶב־אִישׁ וַעֲצַת יְהוָה הִיא תָקוּם׃
    hebrewPlain: רבות מחשבות בלב איש ועצת יהוה היא תקום
    kjvRefs:
    - Proverbs 19:21
    kjvOsis:
    - Prov.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.22
    scripture: tanakh
    name: Tanakh Proverbs 19:22
    ref: Proverbs 19:22
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 22
    ordinal: 18216
    text: The lust of a man is his shame; And a poor man is better than a liar.
    translation: JPS 1917
    original: תַּאֲוַת אָדָם חַסְדּוֹ וְטוֹב־רָשׁ מֵאִישׁ כָּזָב׃
    hebrewPlain: תאות אדם חסדו וטוב רש מאיש כזב
    kjvRefs:
    - Proverbs 19:22
    kjvOsis:
    - Prov.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.23
    scripture: tanakh
    name: Tanakh Proverbs 19:23
    ref: Proverbs 19:23
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 23
    ordinal: 18217
    text: The fear of the LORD tendeth to life; And he that hath it shall abide satisfied, He shall not be visited with evil.
    translation: JPS 1917
    original: יִרְאַת יְהוָה לְחַיִּים וְשָׂבֵעַ יָלִין בַּל־יִפָּקֶד רָע׃
    hebrewPlain: יראת יהוה לחיים ושבע ילין בל יפקד רע
    kjvRefs:
    - Proverbs 19:23
    kjvOsis:
    - Prov.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.24
    scripture: tanakh
    name: Tanakh Proverbs 19:24
    ref: Proverbs 19:24
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 24
    ordinal: 18218
    text: The sluggard burieth his hand in the dish, And will not so much as bring it back to his mouth.
    translation: JPS 1917
    original: טָמַן עָצֵל יָדוֹ בַּצַּלָּחַת גַּם־אֶל־פִּיהוּ לֹא יְשִׁיבֶנָּה׃
    hebrewPlain: טמן עצל ידו בצלחת גם אל פיהו לא ישיבנה
    kjvRefs:
    - Proverbs 19:24
    kjvOsis:
    - Prov.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.25
    scripture: tanakh
    name: Tanakh Proverbs 19:25
    ref: Proverbs 19:25
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 25
    ordinal: 18219
    text: When thou smitest a scorner, the simple will become prudent; And when one that hath understanding is reproved, he will understand knowledge.
    translation: JPS 1917
    original: לֵץ תַּכֶּה וּפֶתִי יַעְרִם וְהוֹכִיחַ לְנָבוֹן יָבִין דָּעַת׃
    hebrewPlain: לץ תכה ופתי יערם והוכיח לנבון יבין דעת
    kjvRefs:
    - Proverbs 19:25
    kjvOsis:
    - Prov.19.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.26
    scripture: tanakh
    name: Tanakh Proverbs 19:26
    ref: Proverbs 19:26
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 26
    ordinal: 18220
    text: A son that dealeth shamefully and reproachfully Will despoil his father, and chase away his mother.
    translation: JPS 1917
    original: מְשַׁדֶּד־אָב יַבְרִיחַ אֵם בֵּן מֵבִישׁ וּמַחְפִּיר׃
    hebrewPlain: משדד אב יבריח אם בן מביש ומחפיר
    kjvRefs:
    - Proverbs 19:26
    kjvOsis:
    - Prov.19.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.27
    scripture: tanakh
    name: Tanakh Proverbs 19:27
    ref: Proverbs 19:27
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 27
    ordinal: 18221
    text: Cease, my son, to hear the instruction That causeth to err from the words of knowledge.
    translation: JPS 1917
    original: חַדַל־בְּנִי לִשְׁמֹעַ מוּסָר לִשְׁגוֹת מֵאִמְרֵי־דָעַת׃
    hebrewPlain: חדל בני לשמע מוסר לשגות מאמרי דעת
    kjvRefs:
    - Proverbs 19:27
    kjvOsis:
    - Prov.19.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.28
    scripture: tanakh
    name: Tanakh Proverbs 19:28
    ref: Proverbs 19:28
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 28
    ordinal: 18222
    text: An ungodly witness mocketh at right; And the mouth of the wicked devoureth iniquity.
    translation: JPS 1917
    original: עֵד בְּלִיַּעַל יָלִיץ מִשְׁפָּט וּפִי רְשָׁעִים יְבַלַּע־אָוֶן׃
    hebrewPlain: עד בליעל יליץ משפט ופי רשעים יבלע און
    kjvRefs:
    - Proverbs 19:28
    kjvOsis:
    - Prov.19.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.19.29
    scripture: tanakh
    name: Tanakh Proverbs 19:29
    ref: Proverbs 19:29
    book: Prov
    section: ketuvim
    chapter: 19
    verse: 29
    ordinal: 18223
    text: Judgments are prepared for scorners, And stripes for the back of fools.
    translation: JPS 1917
    original: נָכוֹנוּ לַלֵּצִים שְׁפָטִים וּמַהֲלֻמוֹת לְגֵו כְּסִילִים׃
    hebrewPlain: נכונו ללצים שפטים ומהלמות לגו כסילים
    kjvRefs:
    - Proverbs 19:29
    kjvOsis:
    - Prov.19.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.19
- type: TanakhVerse
  data:
    osis: Prov.20.1
    scripture: tanakh
    name: Tanakh Proverbs 20:1
    ref: Proverbs 20:1
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 1
    ordinal: 18224
    text: Wine is a mocker, strong drink is riotous; and whosoever reeleth thereby is not wise.
    translation: JPS 1917
    original: לֵץ הַיַּין הֹמֶה שֵׁכָר וְכָל־שֹׁגֶה בּוֹ לֹא יֶחְכָּם׃
    hebrewPlain: לץ היין המה שכר וכל שגה בו לא יחכם
    kjvRefs:
    - Proverbs 20:1
    kjvOsis:
    - Prov.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.2
    scripture: tanakh
    name: Tanakh Proverbs 20:2
    ref: Proverbs 20:2
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 2
    ordinal: 18225
    text: 'The terror of a king is as the roaring of a lion: He that provoketh him to anger forfeiteth his life.'
    translation: JPS 1917
    original: נַהַם כַּכְּפִיר אֵימַת מֶלֶךְ מִתְעַבְּרוֹ חוֹטֵא נַפְשׁוֹ׃
    hebrewPlain: נהם ככפיר אימת מלך מתעברו חוטא נפשו
    kjvRefs:
    - Proverbs 20:2
    kjvOsis:
    - Prov.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.3
    scripture: tanakh
    name: Tanakh Proverbs 20:3
    ref: Proverbs 20:3
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 3
    ordinal: 18226
    text: It is an honour for a man to keep aloof from strife; but every fool will be snarling.
    translation: JPS 1917
    original: כָּבוֹד לָאִישׁ שֶׁבֶת מֵרִיב וְכָל־אֱוִיל יִתְגַּלָּע׃
    hebrewPlain: כבוד לאיש שבת מריב וכל אויל יתגלע
    kjvRefs:
    - Proverbs 20:3
    kjvOsis:
    - Prov.20.3
  relations:
