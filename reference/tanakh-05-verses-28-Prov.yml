- type: TanakhVerse
  data:
    osis: Prov.16.27
    scripture: tanakh
    name: Tanakh Proverbs 16:27
    ref: Proverbs 16:27
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 27
    ordinal: 18136
    text: An ungodly man diggeth up evil, And in his lips there is as a burning fire.
    translation: JPS 1917
    original: אִישׁ בְּלִיַּעַל כֹּרֶה רָעָה וְעַל־שפתיו [שְׂפָתוֹ] כְּאֵשׁ צָרָבֶת׃
    hebrewPlain: איש בליעל כרה רעה ועל שפתיו [שפתו] כאש צרבת
    kjvRefs:
    - Proverbs 16:27
    kjvOsis:
    - Prov.16.27
