    scripture: tanakh
    name: Tanakh Proverbs 9:17
    ref: Proverbs 9:17
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 17924
    text: ’Stolen waters are sweet, And bread eaten in secret is pleasant.’
    translation: JPS 1917
    original: מַיִם־גְּנוּבִים יִמְתָּקוּ וְלֶחֶם סְתָרִים יִנְעָם׃
    hebrewPlain: מים גנובים ימתקו ולחם סתרים ינעם
    kjvRefs:
