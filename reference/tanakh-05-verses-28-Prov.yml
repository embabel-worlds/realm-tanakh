  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.12
    scripture: tanakh
    name: Tanakh Proverbs 10:12
    ref: Proverbs 10:12
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 17937
    text: Hatred stirreth up strifes; but love covereth all transgressions.
    translation: JPS 1917
    original: שִׂנְאָה תְּעוֹרֵר מְדָנִים וְעַל כָּל־פְּשָׁעִים תְּכַסֶּה אַהֲבָה׃
    hebrewPlain: שנאה תעורר מדנים ועל כל פשעים תכסה אהבה
