    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.22
    scripture: tanakh
    name: Tanakh Proverbs 26:22
    ref: Proverbs 26:22
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 22
    ordinal: 18432
    text: The words of a whisperer are as dainty morsels, And they go down into the innermost parts of the body.
    translation: JPS 1917
    original: דִּבְרֵי נִרְגָּן כְּמִתְלַהֲמִים וְהֵם יָרְדוּ חַדְרֵי־בָטֶן׃
    hebrewPlain: דברי נרגן כמתלהמים והם ירדו חדרי בטן
    kjvRefs:
    - Proverbs 26:22
    kjvOsis:
    - Prov.26.22
