- type: TanakhVerse
  data:
    osis: Prov.26.17
    scripture: tanakh
    name: Tanakh Proverbs 26:17
    ref: Proverbs 26:17
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 17
    ordinal: 18427
    text: He that passeth by, and meddleth with strife not his own, Is like one that taketh a dog by the ears.
    translation: JPS 1917
    original: מַחֲזִיק בְּאָזְנֵי־כָלֶב עֹבֵר מִתְעַבֵּר עַל־רִיב לֹּא־לוֹ׃
    hebrewPlain: מחזיק באזני כלב עבר מתעבר על ריב לא לו
    kjvRefs:
    - Proverbs 26:17
    kjvOsis:
    - Prov.26.17
