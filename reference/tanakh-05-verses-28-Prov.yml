    book: Prov
    section: ketuvim
    chapter: 26
    verse: 15
    ordinal: 18425
    text: The sluggard burieth his hand in the dish; It wearieth him to bring it back to his mouth.
    translation: JPS 1917
    original: טָמַן עָצֵל יָדוֹ בַּצַּלָּחַת נִלְאָה לַהֲשִׁיבָהּ אֶל־פִּיו׃
    hebrewPlain: טמן עצל ידו בצלחת נלאה להשיבה אל פיו
    kjvRefs:
