    section: ketuvim
    chapter: 12
    verse: 15
    ordinal: 18003
    text: The way of a fool is straight in his own eyes; But he that is wise hearkeneth unto counsel.
    translation: JPS 1917
    original: דֶּרֶךְ אֱוִיל יָשָׁר בְּעֵינָיו וְשֹׁמֵעַ לְעֵצָה חָכָם׃
