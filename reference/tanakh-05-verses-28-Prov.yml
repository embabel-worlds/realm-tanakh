      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.2
    scripture: tanakh
    name: Tanakh Proverbs 10:2
    ref: Proverbs 10:2
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 17927
    text: Treasures of wickedness profit nothing; but righteousness delivereth from death.
    translation: JPS 1917
    original: לֹא־יוֹעִילוּ אוֹצְרוֹת רֶשַׁע וּצְדָקָה תַּצִּיל מִמָּוֶת׃
    hebrewPlain: לא יועילו אוצרות רשע וצדקה תציל ממות
    kjvRefs:
    - Proverbs 10:2
    kjvOsis:
    - Prov.10.2
  relations:
