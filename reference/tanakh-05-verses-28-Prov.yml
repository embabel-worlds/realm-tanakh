    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.3
    scripture: tanakh
    name: Tanakh Proverbs 10:3
    ref: Proverbs 10:3
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 17928
    text: The LORD will not suffer the soul of the righteous to famish; but He thrusteth away the desire of the wicked.
    translation: JPS 1917
    original: לֹא־יַרְעִיב יְהוָה נֶפֶשׁ צַדִּיק וְהַוַּת רְשָׁעִים יֶהְדֹּף׃
    hebrewPlain: לא ירעיב יהוה נפש צדיק והות רשעים יהדף
    kjvRefs:
    - Proverbs 10:3
    kjvOsis:
    - Prov.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.4
    scripture: tanakh
    name: Tanakh Proverbs 10:4
    ref: Proverbs 10:4
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 17929
    text: He becometh poor that dealeth with a slack hand; but the hand of the diligent maketh rich.
    translation: JPS 1917
    original: רָאשׁ עֹשֶׂה כַף־רְמִיָּה וְיַד חָרוּצִים תַּעֲשִׁיר׃
    hebrewPlain: ראש עשה כף רמיה ויד חרוצים תעשיר
    kjvRefs:
    - Proverbs 10:4
    kjvOsis:
    - Prov.10.4
  relations:
