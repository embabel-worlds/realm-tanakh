      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.29
    scripture: tanakh
    name: Tanakh Proverbs 31:29
    ref: Proverbs 31:29
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 29
    ordinal: 18582
    text: ’Many daughters have done valiantly, But thou excellest them all.’
    translation: JPS 1917
    original: רַבּוֹת בָּנוֹת עָשׂוּ חָיִל וְאַתְּ עָלִית עַל־כֻּלָּנָה׃
    hebrewPlain: רבות בנות עשו חיל ואת עלית על כלנה
    kjvRefs:
    - Proverbs 31:29
    kjvOsis:
    - Prov.31.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.30
    scripture: tanakh
    name: Tanakh Proverbs 31:30
    ref: Proverbs 31:30
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 30
    ordinal: 18583
    text: Grace is deceitful, and beauty is vain; But a woman that feareth the LORD, she shall be praised.
    translation: JPS 1917
    original: שֶׁקֶר הַחֵן וְהֶבֶל הַיֹּפִי אִשָּׁה יִרְאַת־יְהוָה הִיא תִתְהַלָּל׃
    hebrewPlain: שקר החן והבל היפי אשה יראת יהוה היא תתהלל
    kjvRefs:
    - Proverbs 31:30
    kjvOsis:
    - Prov.31.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
