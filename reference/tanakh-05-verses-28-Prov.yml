      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.20
    scripture: tanakh
    name: Tanakh Proverbs 16:20
    ref: Proverbs 16:20
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 20
    ordinal: 18129
    text: He that giveth heed unto the word shall find good; And whoso trusteth in the LORD, happy is he.
    translation: JPS 1917
    original: מַשְׂכִּיל עַל־דָּבָר יִמְצָא־טוֹב וּבוֹטֵחַ בַּיהוָה אַשְׁרָיו׃
    hebrewPlain: משכיל על דבר ימצא טוב ובוטח ביהוה אשריו
    kjvRefs:
    - Proverbs 16:20
    kjvOsis:
    - Prov.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.21
    scripture: tanakh
    name: Tanakh Proverbs 16:21
    ref: Proverbs 16:21
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 21
    ordinal: 18130
    text: The wise in heart is called a man of discernment; And the sweetness of the lips increaseth learning.
    translation: JPS 1917
    original: לַחֲכַם־לֵב יִקָּרֵא נָבוֹן וּמֶתֶק שְׂפָתַיִם יֹסִיף לֶקַח׃
    hebrewPlain: לחכם לב יקרא נבון ומתק שפתים יסיף לקח
    kjvRefs:
    - Proverbs 16:21
    kjvOsis:
    - Prov.16.21
