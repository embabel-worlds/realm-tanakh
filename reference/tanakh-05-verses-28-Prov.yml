      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.5
    scripture: tanakh
    name: Tanakh Proverbs 10:5
    ref: Proverbs 10:5
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 17930
    text: A wise son gathereth in summer; but a son that doeth shamefully sleepeth in harvest.
    translation: JPS 1917
    original: אֹגֵר בַּקַּיִץ בֵּן מַשְׂכִּיל נִרְדָּם בַּקָּצִיר בֵּן מֵבִישׁ׃
    hebrewPlain: אגר בקיץ בן משכיל נרדם בקציר בן מביש
    kjvRefs:
    - Proverbs 10:5
    kjvOsis:
