  data:
    osis: Prov.16.30
    scripture: tanakh
    name: Tanakh Proverbs 16:30
    ref: Proverbs 16:30
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 30
    ordinal: 18139
    text: He shutteth his eyes, it is to devise froward things; He that biteth his lips bringeth evil to pass.
    translation: JPS 1917
    original: עֹצֶה עֵינָיו לַחְשֹׁב תַּהְפֻּכוֹת קֹרֵץ שְׂפָתָיו כִּלָּה רָעָה׃
    hebrewPlain: עצה עיניו לחשב תהפכות קרץ שפתיו כלה רעה
    kjvRefs:
    - Proverbs 16:30
    kjvOsis:
    - Prov.16.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
