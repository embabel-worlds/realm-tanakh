  data:
    osis: Prov.31.26
    scripture: tanakh
    name: Tanakh Proverbs 31:26
    ref: Proverbs 31:26
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 26
    ordinal: 18579
    text: She openeth her mouth with wisdom; And the law of kindness is on her tongue.
    translation: JPS 1917
    original: פִּיהָ פָּתְחָה בְחָכְמָה וְתוֹרַת־חֶסֶד עַל־לְשׁוֹנָהּ׃
    hebrewPlain: פיה פתחה בחכמה ותורת חסד על לשונה
    kjvRefs:
    - Proverbs 31:26
    kjvOsis:
    - Prov.31.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
