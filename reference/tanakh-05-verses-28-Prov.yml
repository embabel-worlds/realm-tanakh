      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.23
    scripture: tanakh
    name: Tanakh Proverbs 26:23
    ref: Proverbs 26:23
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 23
    ordinal: 18433
    text: Burning lips and a wicked heart Are like an earthen vessel overlaid with silver dross.
    translation: JPS 1917
    original: כֶּסֶף סִיגִים מְצֻפֶּה עַל־חָרֶשׂ שְׂפָתַיִם דֹּלְקִים וְלֶב־רָע׃
    hebrewPlain: כסף סיגים מצפה על חרש שפתים דלקים ולב רע
    kjvRefs:
    - Proverbs 26:23
    kjvOsis:
    - Prov.26.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.24
    scripture: tanakh
    name: Tanakh Proverbs 26:24
    ref: Proverbs 26:24
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 24
    ordinal: 18434
    text: He that hateth dissembleth with his lips, But he layeth up deceit within him.
    translation: JPS 1917
    original: בשפתו [בִּשְׂפָתָיו] יִנָּכֵר שׂוֹנֵא וּבְקִרְבּוֹ יָשִׁית מִרְמָה׃
    hebrewPlain: בשפתו [בשפתיו] ינכר שונא ובקרבו ישית מרמה
    kjvRefs:
    - Proverbs 26:24
    kjvOsis:
    - Prov.26.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.25
    scripture: tanakh
    name: Tanakh Proverbs 26:25
    ref: Proverbs 26:25
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 25
    ordinal: 18435
    text: When he speaketh fair, Believe him not; For there are seven abominations in his heart.
    translation: JPS 1917
    original: כִּי־יְחַנֵּן קוֹלוֹ אַל־תַּאֲמֶן־בּוֹ כִּי שֶׁבַע תּוֹעֵבוֹת בְּלִבּוֹ׃
    hebrewPlain: כי יחנן קולו אל תאמן בו כי שבע תועבות בלבו
    kjvRefs:
    - Proverbs 26:25
    kjvOsis:
    - Prov.26.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
