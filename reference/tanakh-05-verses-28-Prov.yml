    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.4
    scripture: tanakh
    name: Tanakh Proverbs 20:4
    ref: Proverbs 20:4
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 4
    ordinal: 18227
    text: The sluggard will not plow when winter setteth in; therefore he shall beg in harvest, and have nothing.
    translation: JPS 1917
    original: מֵחֹרֶף עָצֵל לֹא־יַחֲרֹשׁ ישאל [וְשָׁאַל] בַּקָּצִיר וָאָיִן׃
    hebrewPlain: מחרף עצל לא יחרש ישאל [ושאל] בקציר ואין
    kjvRefs:
    - Proverbs 20:4
    kjvOsis:
    - Prov.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.5
    scripture: tanakh
    name: Tanakh Proverbs 20:5
    ref: Proverbs 20:5
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 5
    ordinal: 18228
    text: Counsel in the heart of man is like deep water; but a man of understanding will draw it out. .
    translation: JPS 1917
    original: מַיִם עֲמֻקִּים עֵצָה בְלֶב־אִישׁ וְאִישׁ תְּבוּנָה יִדְלֶנָּה׃
    hebrewPlain: מים עמקים עצה בלב איש ואיש תבונה ידלנה
    kjvRefs:
    - Proverbs 20:5
    kjvOsis:
    - Prov.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.6
    scripture: tanakh
    name: Tanakh Proverbs 20:6
    ref: Proverbs 20:6
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 6
    ordinal: 18229
    text: Most men will proclaim every one his own goodness; but a faithful man who can find?
    translation: JPS 1917
    original: רָב־אָדָם יִקְרָא אִישׁ חַסְדּוֹ וְאִישׁ אֱמוּנִים מִי יִמְצָא׃
    hebrewPlain: רב אדם יקרא איש חסדו ואיש אמונים מי ימצא
    kjvRefs:
    - Proverbs 20:6
    kjvOsis:
    - Prov.20.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.7
    scripture: tanakh
    name: Tanakh Proverbs 20:7
    ref: Proverbs 20:7
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 7
    ordinal: 18230
    text: He that walketh in his integrity as a just man, happy are his children after him.
    translation: JPS 1917
    original: מִתְהַלֵּךְ בְּתֻמּוֹ צַדִּיק אַשְׁרֵי בָנָיו אַחֲרָיו׃
    hebrewPlain: מתהלך בתמו צדיק אשרי בניו אחריו
    kjvRefs:
    - Proverbs 20:7
    kjvOsis:
    - Prov.20.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.8
    scripture: tanakh
    name: Tanakh Proverbs 20:8
    ref: Proverbs 20:8
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 8
    ordinal: 18231
    text: A king that sitteth on the throne of judgment scattereth away all evil with his eyes.
    translation: JPS 1917
    original: מֶלֶךְ יוֹשֵׁב עַל־כִּסֵּא־דִין מְזָרֶה בְעֵינָיו כָּל־רָע׃
    hebrewPlain: מלך יושב על כסא דין מזרה בעיניו כל רע
    kjvRefs:
    - Proverbs 20:8
    kjvOsis:
    - Prov.20.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.9
    scripture: tanakh
    name: Tanakh Proverbs 20:9
    ref: Proverbs 20:9
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 9
    ordinal: 18232
    text: 'Who can say: ‘I have made my heart clean, I am pure from my sin’?'
    translation: JPS 1917
    original: מִי־יֹאמַר זִכִּיתִי לִבִּי טָהַרְתִּי מֵחַטָּאתִי׃
    hebrewPlain: מי יאמר זכיתי לבי טהרתי מחטאתי
    kjvRefs:
    - Proverbs 20:9
    kjvOsis:
    - Prov.20.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.10
    scripture: tanakh
    name: Tanakh Proverbs 20:10
    ref: Proverbs 20:10
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 10
    ordinal: 18233
    text: Divers weights, and divers measures, both of them alike are abomination to the LORD.
    translation: JPS 1917
    original: אֶבֶן וָאֶבֶן אֵיפָה וְאֵיפָה תּוֹעֲבַת יְהוָה גַּם־שְׁנֵיהֶם׃
    hebrewPlain: אבן ואבן איפה ואיפה תועבת יהוה גם שניהם
    kjvRefs:
    - Proverbs 20:10
    kjvOsis:
    - Prov.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.11
    scripture: tanakh
    name: Tanakh Proverbs 20:11
    ref: Proverbs 20:11
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 11
    ordinal: 18234
    text: Even a child is known by his doings, whether his work be pure, and whether it be right.
    translation: JPS 1917
    original: גַּם בְּמַעֲלָלָיו יִתְנַכֶּר־נָעַר אִם־זַךְ וְאִם־יָשָׁר פָּעֳלוֹ׃
    hebrewPlain: גם במעלליו יתנכר נער אם זך ואם ישר פעלו
    kjvRefs:
    - Proverbs 20:11
    kjvOsis:
    - Prov.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.12
    scripture: tanakh
    name: Tanakh Proverbs 20:12
    ref: Proverbs 20:12
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 12
    ordinal: 18235
    text: The hearing ear, and the seeing eye, the LORD hath made even both of them.
    translation: JPS 1917
    original: אֹזֶן שֹׁמַעַת וְעַיִן רֹאָה יְהוָה עָשָׂה גַם־שְׁנֵיהֶם׃
    hebrewPlain: אזן שמעת ועין ראה יהוה עשה גם שניהם
    kjvRefs:
    - Proverbs 20:12
    kjvOsis:
    - Prov.20.12
  relations:
