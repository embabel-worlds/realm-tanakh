  data:
    osis: Prov.31.27
    scripture: tanakh
    name: Tanakh Proverbs 31:27
    ref: Proverbs 31:27
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 27
    ordinal: 18580
    text: She looketh well to the ways of her household, And eateth not the bread of idleness.
    translation: JPS 1917
    original: צוֹפִיָּה הֲלִיכוֹת בֵּיתָהּ וְלֶחֶם עַצְלוּת לֹא תֹאכֵל׃
    hebrewPlain: צופיה הליכות ביתה ולחם עצלות לא תאכל
