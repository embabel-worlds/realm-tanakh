  data:
    osis: Prov.26.28
    scripture: tanakh
    name: Tanakh Proverbs 26:28
    ref: Proverbs 26:28
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 28
    ordinal: 18438
    text: A lying tongue hateth those that are crushed by it; And a flattering mouth worketh ruin.
    translation: JPS 1917
    original: לְשׁוֹן־שֶׁקֶר יִשְׂנָא דַכָּיו וּפֶה חָלָק יַעֲשֶׂה מִדְחֶה׃
    hebrewPlain: לשון שקר ישנא דכיו ופה חלק יעשה מדחה
    kjvRefs:
    - Proverbs 26:28
    kjvOsis:
    - Prov.26.28
