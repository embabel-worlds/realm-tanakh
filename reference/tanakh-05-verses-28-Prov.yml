      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.6
    scripture: tanakh
    name: Tanakh Proverbs 10:6
    ref: Proverbs 10:6
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 17931
    text: Blessings are upon the head of the righteous; but the mouth of the wicked concealeth violence.
    translation: JPS 1917
    original: בְּרָכוֹת לְרֹאשׁ צַדִּיק וּפִי רְשָׁעִים יְכַסֶּה חָמָס׃
    hebrewPlain: ברכות לראש צדיק ופי רשעים יכסה חמס
