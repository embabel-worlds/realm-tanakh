      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.18
    scripture: tanakh
    name: Tanakh Proverbs 26:18
    ref: Proverbs 26:18
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 18
    ordinal: 18428
    text: As a madman who casteth firebrands, Arrows, and death;
    translation: JPS 1917
    original: כְּמִתְלַהְלֵהַּ הַיֹּרֶה זִקִּים חִצִּים וָמָוֶת׃
    hebrewPlain: כמתלהלה הירה זקים חצים ומות
    kjvRefs:
    - Proverbs 26:18
    kjvOsis:
    - Prov.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.19
    scripture: tanakh
    name: Tanakh Proverbs 26:19
    ref: Proverbs 26:19
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 19
    ordinal: 18429
    text: 'So is the man that deceiveth his neighbour, And saith: ‘Am not I in sport?’'
    translation: JPS 1917
    original: כֵּן־אִישׁ רִמָּה אֶת־רֵעֵהוּ וְאָמַר הֲ‍לֹא־מְשַׂחֵק אָנִי׃
    hebrewPlain: כן איש רמה את רעהו ואמר ה‍לא משחק אני
    kjvRefs:
    - Proverbs 26:19
    kjvOsis:
    - Prov.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.20
    scripture: tanakh
    name: Tanakh Proverbs 26:20
    ref: Proverbs 26:20
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 20
    ordinal: 18430
    text: Where no wood is, the fire goeth out; And where there is no whisperer, contention ceaseth.
    translation: JPS 1917
    original: בְּאֶפֶס עֵצִים תִּכְבֶּה־אֵשׁ וּבְאֵין נִרְגָּן יִשְׁתֹּק מָדוֹן׃
    hebrewPlain: באפס עצים תכבה אש ובאין נרגן ישתק מדון
    kjvRefs:
    - Proverbs 26:20
    kjvOsis:
    - Prov.26.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.21
    scripture: tanakh
    name: Tanakh Proverbs 26:21
    ref: Proverbs 26:21
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 21
    ordinal: 18431
    text: As coals are to burning coals, and wood to fire; So is a contentious man to kindle strife.
    translation: JPS 1917
    original: פֶּחָם לְגֶחָלִים וְעֵצִים לְאֵשׁ וְאִישׁ מדונים [מִדְיָנִים] לְחַרְחַר־רִיב׃
    hebrewPlain: פחם לגחלים ועצים לאש ואיש מדונים [מדינים] לחרחר ריב
    kjvRefs:
    - Proverbs 26:21
    kjvOsis:
    - Prov.26.21
