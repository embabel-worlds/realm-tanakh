    name: Tanakh Proverbs 31:20
    ref: Proverbs 31:20
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 20
    ordinal: 18573
    text: She stretcheth out her hand to the poor; Yea, she reacheth forth her hands to the needy.
    translation: JPS 1917
    original: כַּפָּהּ פָּרְשָׂה לֶעָנִי וְיָדֶיהָ שִׁלְּחָה לָאֶבְיוֹן׃
    hebrewPlain: כפה פרשה לעני וידיה שלחה לאביון
