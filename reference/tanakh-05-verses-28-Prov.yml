    ref: Proverbs 16:18
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 18
    ordinal: 18127
    text: Pride goeth before destruction, And a haughty spirit before a fall.
    translation: JPS 1917
    original: לִפְנֵי־שֶׁבֶר גָּאוֹן וְלִפְנֵי כִשָּׁלוֹן גֹּבַהּ רוּחַ׃
    hebrewPlain: לפני שבר גאון ולפני כשלון גבה רוח
    kjvRefs:
    - Proverbs 16:18
    kjvOsis:
