    - Proverbs 10:12
    kjvOsis:
    - Prov.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.13
    scripture: tanakh
    name: Tanakh Proverbs 10:13
    ref: Proverbs 10:13
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 17938
    text: In the lips of him that hath discernment wisdom is found; but a rod is for the back of him that is void of understanding.
    translation: JPS 1917
    original: בְּשִׂפְתֵי נָבוֹן תִּמָּצֵא חָכְמָה וְשֵׁבֶט לְגֵו חֲסַר־לֵב׃
    hebrewPlain: בשפתי נבון תמצא חכמה ושבט לגו חסר לב
    kjvRefs:
    - Proverbs 10:13
    kjvOsis:
    - Prov.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.14
    scripture: tanakh
    name: Tanakh Proverbs 10:14
    ref: Proverbs 10:14
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 17939
    text: Wise men lay up knowledge; but the mouth of the foolish is an imminent ruin.
    translation: JPS 1917
    original: חֲכָמִים יִצְפְּנוּ־דָעַת וּפִי־אֱוִיל מְחִתָּה קְרֹבָה׃
    hebrewPlain: חכמים יצפנו דעת ופי אויל מחתה קרבה
    kjvRefs:
    - Proverbs 10:14
    kjvOsis:
    - Prov.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.15
    scripture: tanakh
    name: Tanakh Proverbs 10:15
    ref: Proverbs 10:15
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 17940
    text: The rich man’s wealth is his strong city; the ruin of the poor is their poverty.
    translation: JPS 1917
    original: הוֹן עָשִׁיר קִרְיַת עֻזּוֹ מְחִתַּת דַּלִּים רֵישָׁם׃
    hebrewPlain: הון עשיר קרית עזו מחתת דלים רישם
    kjvRefs:
    - Proverbs 10:15
    kjvOsis:
    - Prov.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.16
    scripture: tanakh
    name: Tanakh Proverbs 10:16
    ref: Proverbs 10:16
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 17941
    text: The wages of the righteous is life; The increase of the wicked is sin.
    translation: JPS 1917
    original: פְּעֻלַּת צַדִּיק לְחַיִּים תְּבוּאַת רָשָׁע לְחַטָּאת׃
    hebrewPlain: פעלת צדיק לחיים תבואת רשע לחטאת
    kjvRefs:
    - Proverbs 10:16
    kjvOsis:
    - Prov.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.17
    scripture: tanakh
    name: Tanakh Proverbs 10:17
    ref: Proverbs 10:17
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 17
    ordinal: 17942
    text: He is in the way of life that heedeth instruction; But he that forsaketh reproof erreth.
    translation: JPS 1917
    original: אֹרַח לְחַיִּים שׁוֹמֵר מוּסָר וְעוֹזֵב תּוֹכַחַת מַתְעֶה׃
    hebrewPlain: ארח לחיים שומר מוסר ועוזב תוכחת מתעה
    kjvRefs:
    - Proverbs 10:17
    kjvOsis:
    - Prov.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.18
    scripture: tanakh
    name: Tanakh Proverbs 10:18
    ref: Proverbs 10:18
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 17943
    text: He that hideth hatred is of lying lips; And he that uttereth a slander is a fool.
    translation: JPS 1917
    original: מְכַסֶּה שִׂנְאָה שִׂפְתֵי־שָׁקֶר וּמוֹצִא דִבָּה הוּא כְסִיל׃
    hebrewPlain: מכסה שנאה שפתי שקר ומוצא דבה הוא כסיל
    kjvRefs:
    - Proverbs 10:18
    kjvOsis:
    - Prov.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.19
    scripture: tanakh
    name: Tanakh Proverbs 10:19
    ref: Proverbs 10:19
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 19
    ordinal: 17944
    text: In the multitude of words there wanteth not transgression; But he that refraineth his lips is wise.
    translation: JPS 1917
    original: בְּרֹב דְּבָרִים לֹא יֶחְדַּל־פָּשַׁע וְחֹשֵׂךְ שְׂפָתָיו מַשְׂכִּיל׃
    hebrewPlain: ברב דברים לא יחדל פשע וחשך שפתיו משכיל
    kjvRefs:
    - Proverbs 10:19
    kjvOsis:
    - Prov.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.20
    scripture: tanakh
    name: Tanakh Proverbs 10:20
    ref: Proverbs 10:20
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 20
    ordinal: 17945
    text: The tongue of the righteous is as choice silver; The heart of the wicked is little worth.
    translation: JPS 1917
    original: כֶּסֶף נִבְחָר לְשׁוֹן צַדִּיק לֵב רְשָׁעִים כִּמְעָט׃
    hebrewPlain: כסף נבחר לשון צדיק לב רשעים כמעט
    kjvRefs:
    - Proverbs 10:20
    kjvOsis:
    - Prov.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.21
    scripture: tanakh
    name: Tanakh Proverbs 10:21
    ref: Proverbs 10:21
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 21
    ordinal: 17946
    text: The lips of the righteous feed many; But the foolish die for want of understanding. .
    translation: JPS 1917
    original: שִׂפְתֵי צַדִּיק יִרְעוּ רַבִּים וֶאֱוִילִים בַּחֲסַר־לֵב יָמוּתוּ׃
    hebrewPlain: שפתי צדיק ירעו רבים ואוילים בחסר לב ימותו
    kjvRefs:
    - Proverbs 10:21
    kjvOsis:
    - Prov.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.22
    scripture: tanakh
    name: Tanakh Proverbs 10:22
    ref: Proverbs 10:22
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 22
    ordinal: 17947
    text: The blessing of the LORD, it maketh rich, And toil addeth nothing thereto.
    translation: JPS 1917
    original: בִּרְכַּת יְהוָה הִיא תַעֲשִׁיר וְלֹא־יוֹסִף עֶצֶב עִמָּהּ׃
    hebrewPlain: ברכת יהוה היא תעשיר ולא יוסף עצב עמה
    kjvRefs:
    - Proverbs 10:22
    kjvOsis:
    - Prov.10.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.23
    scripture: tanakh
    name: Tanakh Proverbs 10:23
    ref: Proverbs 10:23
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 23
    ordinal: 17948
    text: It is as sport to a fool to do wickedness, And so is wisdom to a man of discernment.
    translation: JPS 1917
    original: כִּשְׂחוֹק לִכְסִיל עֲשׂוֹת זִמָּה וְחָכְמָה לְאִישׁ תְּבוּנָה׃
    hebrewPlain: כשחוק לכסיל עשות זמה וחכמה לאיש תבונה
    kjvRefs:
    - Proverbs 10:23
    kjvOsis:
    - Prov.10.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.24
    scripture: tanakh
    name: Tanakh Proverbs 10:24
    ref: Proverbs 10:24
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 24
    ordinal: 17949
    text: The fear of the wicked, it shall come upon him; And the desire of the righteous shall be granted.
    translation: JPS 1917
    original: מְגוֹרַת רָשָׁע הִיא תְבוֹאֶנּוּ וְתַאֲוַת צַדִּיקִים יִתֵּן׃
    hebrewPlain: מגורת רשע היא תבואנו ותאות צדיקים יתן
    kjvRefs:
    - Proverbs 10:24
    kjvOsis:
    - Prov.10.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.25
    scripture: tanakh
    name: Tanakh Proverbs 10:25
    ref: Proverbs 10:25
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 25
    ordinal: 17950
    text: When the whirlwind passeth, the wicked is no more; But the righteous is an everlasting foundation.
    translation: JPS 1917
    original: כַּעֲבוֹר סוּפָה וְאֵין רָשָׁע וְצַדִּיק יְסוֹד עוֹלָם׃
    hebrewPlain: כעבור סופה ואין רשע וצדיק יסוד עולם
    kjvRefs:
    - Proverbs 10:25
    kjvOsis:
    - Prov.10.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.26
    scripture: tanakh
    name: Tanakh Proverbs 10:26
    ref: Proverbs 10:26
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 26
    ordinal: 17951
    text: As vinegar to the teeth, and as smoke to the eyes, So is the sluggard to them that send him.
    translation: JPS 1917
    original: כַּחֹמֶץ לַשִּׁנַּיִם וְכֶעָשָׁן לָעֵינָיִם כֵּן הֶעָצֵל לְשֹׁלְחָיו׃
    hebrewPlain: כחמץ לשנים וכעשן לעינים כן העצל לשלחיו
    kjvRefs:
    - Proverbs 10:26
    kjvOsis:
    - Prov.10.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.27
    scripture: tanakh
    name: Tanakh Proverbs 10:27
    ref: Proverbs 10:27
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 27
    ordinal: 17952
    text: The fear of the LORD prolongeth days; But the years of the wicked shall be shortened.
    translation: JPS 1917
    original: יִרְאַת יְהוָה תּוֹסִיף יָמִים וּשְׁנוֹת רְשָׁעִים תִּקְצֹרְנָה׃
    hebrewPlain: יראת יהוה תוסיף ימים ושנות רשעים תקצרנה
    kjvRefs:
    - Proverbs 10:27
    kjvOsis:
    - Prov.10.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.28
    scripture: tanakh
    name: Tanakh Proverbs 10:28
    ref: Proverbs 10:28
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 28
    ordinal: 17953
    text: The hope of the righteous is gladness; But the expectation of the wicked shall perish.
    translation: JPS 1917
    original: תּוֹחֶלֶת צַדִּיקִים שִׂמְחָה וְתִקְוַת רְשָׁעִים תֹּאבֵד׃
    hebrewPlain: תוחלת צדיקים שמחה ותקות רשעים תאבד
    kjvRefs:
    - Proverbs 10:28
    kjvOsis:
    - Prov.10.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.29
    scripture: tanakh
    name: Tanakh Proverbs 10:29
    ref: Proverbs 10:29
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 29
    ordinal: 17954
    text: The way of the LORD is a stronghold to the upright, But ruin to the workers of iniquity.
    translation: JPS 1917
    original: מָעוֹז לַתֹּם דֶּרֶךְ יְהוָה וּמְחִתָּה לְפֹעֲלֵי אָוֶן׃
    hebrewPlain: מעוז לתם דרך יהוה ומחתה לפעלי און
    kjvRefs:
    - Proverbs 10:29
    kjvOsis:
    - Prov.10.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.30
    scripture: tanakh
    name: Tanakh Proverbs 10:30
    ref: Proverbs 10:30
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 30
    ordinal: 17955
    text: The righteous shall never be moved; But the wicked shall not inhabit the land.
    translation: JPS 1917
    original: צַדִּיק לְעוֹלָם בַּל־יִמּוֹט וּרְשָׁעִים לֹא יִשְׁכְּנוּ־אָרֶץ׃
    hebrewPlain: צדיק לעולם בל ימוט ורשעים לא ישכנו ארץ
    kjvRefs:
    - Proverbs 10:30
    kjvOsis:
    - Prov.10.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.31
    scripture: tanakh
    name: Tanakh Proverbs 10:31
    ref: Proverbs 10:31
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 31
    ordinal: 17956
    text: The mouth of the righteous buddeth with wisdom; But the froward tongue shall be cut off.
    translation: JPS 1917
    original: פִּי־צַדִּיק יָנוּב חָכְמָה וּלְשׁוֹן תַּהְפֻּכוֹת תִּכָּרֵת׃
    hebrewPlain: פי צדיק ינוב חכמה ולשון תהפכות תכרת
    kjvRefs:
    - Proverbs 10:31
    kjvOsis:
    - Prov.10.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.10.32
    scripture: tanakh
    name: Tanakh Proverbs 10:32
    ref: Proverbs 10:32
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 32
    ordinal: 17957
    text: The lips of the righteous know what is acceptable; But the mouth of the wicked is all frowardness.
    translation: JPS 1917
    original: שִׂפְתֵי צַדִּיק יֵדְעוּן רָצוֹן וּפִי רְשָׁעִים תַּהְפֻּכוֹת׃
    hebrewPlain: שפתי צדיק ידעון רצון ופי רשעים תהפכות
    kjvRefs:
    - Proverbs 10:32
    kjvOsis:
    - Prov.10.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.10
- type: TanakhVerse
  data:
    osis: Prov.11.1
    scripture: tanakh
    name: Tanakh Proverbs 11:1
    ref: Proverbs 11:1
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 17958
    text: A false balance is an abomination to the LORD; But a perfect weight is His delight.
    translation: JPS 1917
    original: מֹאזְנֵי מִרְמָה תּוֹעֲבַת יְהוָה וְאֶבֶן שְׁלֵמָה רְצוֹנוֹ׃
    hebrewPlain: מאזני מרמה תועבת יהוה ואבן שלמה רצונו
    kjvRefs:
    - Proverbs 11:1
    kjvOsis:
    - Prov.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.2
    scripture: tanakh
    name: Tanakh Proverbs 11:2
    ref: Proverbs 11:2
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 17959
    text: When pride cometh, then cometh shame; But with the lowly is wisdom.
    translation: JPS 1917
    original: בָּא־זָדוֹן וַיָּבֹא קָלוֹן וְאֶת־צְנוּעִים חָכְמָה׃
    hebrewPlain: בא זדון ויבא קלון ואת צנועים חכמה
    kjvRefs:
    - Proverbs 11:2
    kjvOsis:
    - Prov.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.3
    scripture: tanakh
    name: Tanakh Proverbs 11:3
    ref: Proverbs 11:3
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 17960
    text: The integrity of the upright shall guide them; But the perverseness of the faithless shall destroy them.
    translation: JPS 1917
    original: תֻּמַּת יְשָׁרִים תַּנְחֵם וְסֶלֶף בּוֹגְדִים ושדם [יְשָׁדֵּם׃]
    hebrewPlain: תמת ישרים תנחם וסלף בוגדים ושדם [ישדם]
    kjvRefs:
    - Proverbs 11:3
    kjvOsis:
    - Prov.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.4
    scripture: tanakh
    name: Tanakh Proverbs 11:4
    ref: Proverbs 11:4
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 17961
    text: Riches profit not in the day of wrath; But righteousness delivereth from death.
    translation: JPS 1917
    original: לֹא־יוֹעִיל הוֹן בְּיוֹם עֶבְרָה וּצְדָקָה תַּצִּיל מִמָּוֶת׃
    hebrewPlain: לא יועיל הון ביום עברה וצדקה תציל ממות
    kjvRefs:
    - Proverbs 11:4
    kjvOsis:
    - Prov.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.5
    scripture: tanakh
    name: Tanakh Proverbs 11:5
    ref: Proverbs 11:5
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 17962
    text: The righteousness of the sincere shall make straight his way; But the wicked shall fall by his own wickedness. .
    translation: JPS 1917
    original: צִדְקַת תָּמִים תְּיַשֵּׁר דַּרְכּוֹ וּבְרִשְׁעָתוֹ יִפֹּל רָשָׁע׃
    hebrewPlain: צדקת תמים תישר דרכו וברשעתו יפל רשע
    kjvRefs:
    - Proverbs 11:5
    kjvOsis:
    - Prov.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.6
    scripture: tanakh
    name: Tanakh Proverbs 11:6
    ref: Proverbs 11:6
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 17963
    text: The righteousness of the upright shall deliver them; But the faithless shall be trapped in their own crafty device.
    translation: JPS 1917
    original: צִדְקַת יְשָׁרִים תַּצִּילֵם וּבְהַוַּת בֹּגְדִים יִלָּכֵדוּ׃
    hebrewPlain: צדקת ישרים תצילם ובהות בגדים ילכדו
    kjvRefs:
    - Proverbs 11:6
    kjvOsis:
    - Prov.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.7
    scripture: tanakh
    name: Tanakh Proverbs 11:7
    ref: Proverbs 11:7
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 17964
    text: When a wicked man dieth, his expectation shall perish, And the hope of strength perisheth.
    translation: JPS 1917
    original: בְּמוֹת אָדָם רָשָׁע תֹּאבַד תִּקְוָה וְתוֹחֶלֶת אוֹנִים אָבָדָה׃
    hebrewPlain: במות אדם רשע תאבד תקוה ותוחלת אונים אבדה
    kjvRefs:
    - Proverbs 11:7
    kjvOsis:
    - Prov.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.8
    scripture: tanakh
    name: Tanakh Proverbs 11:8
    ref: Proverbs 11:8
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 17965
    text: The righteous is delivered out of trouble, And the wicked cometh in his stead.
    translation: JPS 1917
    original: צַדִּיק מִצָּרָה נֶחֱלָץ וַיָּבֹא רָשָׁע תַּחְתָּיו׃
    hebrewPlain: צדיק מצרה נחלץ ויבא רשע תחתיו
    kjvRefs:
    - Proverbs 11:8
    kjvOsis:
    - Prov.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.9
    scripture: tanakh
    name: Tanakh Proverbs 11:9
    ref: Proverbs 11:9
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 17966
    text: With his mouth the impious man destroyeth his neighbour; But through knowledge shall the righteous be delivered.
    translation: JPS 1917
    original: בְּפֶה חָנֵף יַשְׁחִת רֵעֵהוּ וּבְדַעַת צַדִּיקִים יֵחָלֵצוּ׃
    hebrewPlain: בפה חנף ישחת רעהו ובדעת צדיקים יחלצו
    kjvRefs:
    - Proverbs 11:9
    kjvOsis:
    - Prov.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.10
    scripture: tanakh
    name: Tanakh Proverbs 11:10
    ref: Proverbs 11:10
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 17967
    text: When it goeth well with the righteous, the city rejoiceth; And when the wicked perish, there is joy.
    translation: JPS 1917
    original: בְּטוּב צַדִּיקִים תַּעֲלֹץ קִרְיָה וּבַאֲבֹד רְשָׁעִים רִנָּה׃
    hebrewPlain: בטוב צדיקים תעלץ קריה ובאבד רשעים רנה
    kjvRefs:
    - Proverbs 11:10
    kjvOsis:
    - Prov.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.11
    scripture: tanakh
    name: Tanakh Proverbs 11:11
    ref: Proverbs 11:11
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 11
    ordinal: 17968
    text: By the blessing of the upright a city is exalted; But it is overthrown by the mouth of the wicked.
    translation: JPS 1917
    original: בְּבִרְכַּת יְשָׁרִים תָּרוּם קָרֶת וּבְפִי רְשָׁעִים תֵּהָרֵס׃
    hebrewPlain: בברכת ישרים תרום קרת ובפי רשעים תהרס
    kjvRefs:
    - Proverbs 11:11
    kjvOsis:
    - Prov.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.12
    scripture: tanakh
    name: Tanakh Proverbs 11:12
    ref: Proverbs 11:12
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 12
    ordinal: 17969
    text: He that despiseth his neighbour lacketh understanding; But a man of discernment holdeth his peace.
    translation: JPS 1917
    original: בָּז־לְרֵעֵהוּ חֲסַר־לֵב וְאִישׁ תְּבוּנוֹת יַחֲרִישׁ׃
    hebrewPlain: בז לרעהו חסר לב ואיש תבונות יחריש
    kjvRefs:
    - Proverbs 11:12
    kjvOsis:
    - Prov.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.13
    scripture: tanakh
    name: Tanakh Proverbs 11:13
    ref: Proverbs 11:13
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 13
    ordinal: 17970
    text: He that goeth about as a talebearer revealeth secrets; But he that is of a faithful spirit concealeth a matter.
    translation: JPS 1917
    original: הוֹלֵךְ רָכִיל מְגַלֶּה־סּוֹד וְנֶאֱמַן־רוּחַ מְכַסֶּה דָבָר׃
    hebrewPlain: הולך רכיל מגלה סוד ונאמן רוח מכסה דבר
    kjvRefs:
    - Proverbs 11:13
    kjvOsis:
    - Prov.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.14
    scripture: tanakh
    name: Tanakh Proverbs 11:14
    ref: Proverbs 11:14
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 14
    ordinal: 17971
    text: Where no wise direction is, a people falleth; But in the multitude of counsellors there is safety.
    translation: JPS 1917
    original: בְּאֵין תַּחְבֻּלוֹת יִפָּל־עָם וּתְשׁוּעָה בְּרֹב יוֹעֵץ׃
    hebrewPlain: באין תחבלות יפל עם ותשועה ברב יועץ
    kjvRefs:
    - Proverbs 11:14
    kjvOsis:
    - Prov.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.15
    scripture: tanakh
    name: Tanakh Proverbs 11:15
    ref: Proverbs 11:15
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 15
    ordinal: 17972
    text: He that is surety for a stranger shall smart for it; But he that hateth them that strike hands is secure.
    translation: JPS 1917
    original: רַע־יֵרוֹעַ כִּי־עָרַב זָר וְשֹׂנֵא תֹקְעִים בּוֹטֵחַ׃
    hebrewPlain: רע ירוע כי ערב זר ושנא תקעים בוטח
    kjvRefs:
    - Proverbs 11:15
    kjvOsis:
    - Prov.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.16
    scripture: tanakh
    name: Tanakh Proverbs 11:16
    ref: Proverbs 11:16
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 16
    ordinal: 17973
    text: A gracious woman obtaineth honour; And strong men obtain riches.
    translation: JPS 1917
    original: אֵשֶׁת־חֵן תִּתְמֹךְ כָּבוֹד וְעָרִיצִים יִתְמְכוּ־עֹשֶׁר׃
    hebrewPlain: אשת חן תתמך כבוד ועריצים יתמכו עשר
    kjvRefs:
    - Proverbs 11:16
    kjvOsis:
    - Prov.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.17
    scripture: tanakh
    name: Tanakh Proverbs 11:17
    ref: Proverbs 11:17
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 17
    ordinal: 17974
    text: The merciful man doeth good to his own soul; But he that is cruel troubleth his own flesh.
    translation: JPS 1917
    original: גֹּמֵל נַפְשׁוֹ אִישׁ חָסֶד וְעֹכֵר שְׁאֵרוֹ אַכְזָרִי׃
    hebrewPlain: גמל נפשו איש חסד ועכר שארו אכזרי
    kjvRefs:
    - Proverbs 11:17
    kjvOsis:
    - Prov.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.18
    scripture: tanakh
    name: Tanakh Proverbs 11:18
    ref: Proverbs 11:18
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 18
    ordinal: 17975
    text: The wicked earneth deceitful wages; But he that soweth righteousness hath a sure reward.
    translation: JPS 1917
    original: רָשָׁע עֹשֶׂה פְעֻלַּת־שָׁקֶר וְזֹרֵעַ צְדָקָה שֶׂכֶר אֱמֶת׃
    hebrewPlain: רשע עשה פעלת שקר וזרע צדקה שכר אמת
    kjvRefs:
    - Proverbs 11:18
    kjvOsis:
    - Prov.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.19
    scripture: tanakh
    name: Tanakh Proverbs 11:19
    ref: Proverbs 11:19
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 19
    ordinal: 17976
    text: Stedfast righteousness tendeth to life; But he that pursueth evil pursueth it to his own death.
    translation: JPS 1917
    original: כֵּן־צְדָקָה לְחַיִּים וּמְרַדֵּף רָעָה לְמוֹתוֹ׃
    hebrewPlain: כן צדקה לחיים ומרדף רעה למותו
    kjvRefs:
    - Proverbs 11:19
    kjvOsis:
    - Prov.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.20
    scripture: tanakh
    name: Tanakh Proverbs 11:20
    ref: Proverbs 11:20
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 20
    ordinal: 17977
    text: They that are perverse in heart are an abomination to the LORD; But such as are upright in their way are His delight.
    translation: JPS 1917
    original: תּוֹעֲבַת יְהוָה עִקְּשֵׁי־לֵב וּרְצוֹנוֹ תְּמִימֵי דָרֶךְ׃
    hebrewPlain: תועבת יהוה עקשי לב ורצונו תמימי דרך
    kjvRefs:
    - Proverbs 11:20
    kjvOsis:
    - Prov.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.21
    scripture: tanakh
    name: Tanakh Proverbs 11:21
    ref: Proverbs 11:21
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 21
    ordinal: 17978
    text: My hand upon it! the evil man shall not be unpunished; But the seed of the righteous shall escape. .
    translation: JPS 1917
    original: יָד לְיָד לֹא־יִנָּקֶה רָּע וְזֶרַע צַדִּיקִים נִמְלָט׃
    hebrewPlain: יד ליד לא ינקה רע וזרע צדיקים נמלט
    kjvRefs:
    - Proverbs 11:21
    kjvOsis:
    - Prov.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.22
    scripture: tanakh
    name: Tanakh Proverbs 11:22
    ref: Proverbs 11:22
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 22
    ordinal: 17979
    text: As a ring of gold in a swine’s snout, so is a fair woman that turneth aside from discretion.
    translation: JPS 1917
    original: נֶזֶם זָהָב בְּאַף חֲזִיר אִשָּׁה יָפָה וְסָרַת טָעַם׃
    hebrewPlain: נזם זהב באף חזיר אשה יפה וסרת טעם
    kjvRefs:
    - Proverbs 11:22
    kjvOsis:
    - Prov.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.23
    scripture: tanakh
    name: Tanakh Proverbs 11:23
    ref: Proverbs 11:23
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 23
    ordinal: 17980
    text: The desire of the righteous is only good; But the expectation of the wicked is wrath.
    translation: JPS 1917
    original: תַּאֲוַת צַדִּיקִים אַךְ־טוֹב תִּקְוַת רְשָׁעִים עֶבְרָה׃
    hebrewPlain: תאות צדיקים אך טוב תקות רשעים עברה
    kjvRefs:
    - Proverbs 11:23
    kjvOsis:
    - Prov.11.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.24
    scripture: tanakh
    name: Tanakh Proverbs 11:24
    ref: Proverbs 11:24
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 24
    ordinal: 17981
    text: There is that scattereth, and yet increaseth; And there is that withholdeth more than is meet, but it tendeth only to want.
    translation: JPS 1917
    original: יֵשׁ מְפַזֵּר וְנוֹסָף עוֹד וְחוֹשֵׂךְ מִיֹּשֶׁר אַךְ־לְמַחְסוֹר׃
    hebrewPlain: יש מפזר ונוסף עוד וחושך מישר אך למחסור
    kjvRefs:
    - Proverbs 11:24
    kjvOsis:
    - Prov.11.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.25
    scripture: tanakh
    name: Tanakh Proverbs 11:25
    ref: Proverbs 11:25
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 25
    ordinal: 17982
    text: The beneficent soul shall be made rich, and he that satisfieth abundantly shall be satisfied also himself.
    translation: JPS 1917
    original: נֶפֶשׁ־בְּרָכָה תְדֻשָּׁן וּמַרְוֶה גַּם־הוּא יוֹרֶא׃
    hebrewPlain: נפש ברכה תדשן ומרוה גם הוא יורא
    kjvRefs:
    - Proverbs 11:25
    kjvOsis:
    - Prov.11.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.26
    scripture: tanakh
    name: Tanakh Proverbs 11:26
    ref: Proverbs 11:26
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 26
    ordinal: 17983
    text: He that withholdeth corn, the people shall curse him; But blessing shall be upon the head of him that selleth it.
    translation: JPS 1917
    original: מֹנֵעַ בָּר יִקְּבֻהוּ לְאוֹם וּבְרָכָה לְרֹאשׁ מַשְׁבִּיר׃
    hebrewPlain: מנע בר יקבהו לאום וברכה לראש משביר
    kjvRefs:
    - Proverbs 11:26
    kjvOsis:
    - Prov.11.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.27
    scripture: tanakh
    name: Tanakh Proverbs 11:27
    ref: Proverbs 11:27
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 27
    ordinal: 17984
    text: He that diligently seeketh good seeketh favour; But he that searcheth for evil, it shall come unto him.
    translation: JPS 1917
    original: שֹׁחֵר טוֹב יְבַקֵּשׁ רָצוֹן וְדֹרֵשׁ רָעָה תְבוֹאֶנּוּ׃
    hebrewPlain: שחר טוב יבקש רצון ודרש רעה תבואנו
    kjvRefs:
    - Proverbs 11:27
    kjvOsis:
    - Prov.11.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.28
    scripture: tanakh
    name: Tanakh Proverbs 11:28
    ref: Proverbs 11:28
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 28
    ordinal: 17985
    text: He that trusteth in his riches shall fall; But the righteous shall flourish as foliage.
    translation: JPS 1917
    original: בּוֹטֵחַ בְּעָשְׁרוֹ הוּא יִפֹּל וְכֶעָלֶה צַדִּיקִים יִפְרָחוּ׃
    hebrewPlain: בוטח בעשרו הוא יפל וכעלה צדיקים יפרחו
    kjvRefs:
    - Proverbs 11:28
    kjvOsis:
    - Prov.11.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.29
    scripture: tanakh
    name: Tanakh Proverbs 11:29
    ref: Proverbs 11:29
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 29
    ordinal: 17986
    text: He that troubleth his own house shall inherit the wind; And the foolish shall be servant to the wise of heart.
    translation: JPS 1917
    original: עוֹכֵר בֵּיתוֹ יִנְחַל־רוּחַ וְעֶבֶד אֱוִיל לַחֲכַם־לֵב׃
    hebrewPlain: עוכר ביתו ינחל רוח ועבד אויל לחכם לב
    kjvRefs:
    - Proverbs 11:29
    kjvOsis:
    - Prov.11.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.30
    scripture: tanakh
    name: Tanakh Proverbs 11:30
    ref: Proverbs 11:30
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 30
    ordinal: 17987
    text: The fruit of the righteous is a tree of life; And he that is wise winneth souls.
    translation: JPS 1917
    original: פְּרִי־צַדִּיק עֵץ חַיִּים וְלֹקֵחַ נְפָשׂוֹת חָכָם׃
    hebrewPlain: פרי צדיק עץ חיים ולקח נפשות חכם
    kjvRefs:
    - Proverbs 11:30
    kjvOsis:
    - Prov.11.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.11.31
    scripture: tanakh
    name: Tanakh Proverbs 11:31
    ref: Proverbs 11:31
    book: Prov
    section: ketuvim
    chapter: 11
    verse: 31
    ordinal: 17988
    text: Behold, the righteous shall be requited in the earth; How much more the wicked and the sinner!
    translation: JPS 1917
    original: הֵן צַדִּיק בָּאָרֶץ יְשֻׁלָּם אַף כִּי־רָשָׁע וְחוֹטֵא׃
    hebrewPlain: הן צדיק בארץ ישלם אף כי רשע וחוטא
    kjvRefs:
    - Proverbs 11:31
    kjvOsis:
    - Prov.11.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.11
- type: TanakhVerse
  data:
    osis: Prov.12.1
    scripture: tanakh
    name: Tanakh Proverbs 12:1
    ref: Proverbs 12:1
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 1
    ordinal: 17989
    text: Whoso loveth knowledge loveth correction; But he that is brutish hateth reproof.
    translation: JPS 1917
    original: אֹהֵב מוּסָר אֹהֵב דָּעַת וְשֹׂנֵא תוֹכַחַת בָּעַר׃
    hebrewPlain: אהב מוסר אהב דעת ושנא תוכחת בער
    kjvRefs:
    - Proverbs 12:1
    kjvOsis:
    - Prov.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.2
    scripture: tanakh
    name: Tanakh Proverbs 12:2
    ref: Proverbs 12:2
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 2
    ordinal: 17990
    text: A good man shall obtain favour of the LORD; But a man of wicked devices will He condemn.
    translation: JPS 1917
    original: טוֹב יָפִיק רָצוֹן מֵיְהוָה וְאִישׁ מְזִמּוֹת יַרְשִׁיעַ׃
    hebrewPlain: טוב יפיק רצון מיהוה ואיש מזמות ירשיע
    kjvRefs:
    - Proverbs 12:2
    kjvOsis:
    - Prov.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.3
    scripture: tanakh
    name: Tanakh Proverbs 12:3
    ref: Proverbs 12:3
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 3
    ordinal: 17991
    text: A man shall not be established by wickedness; But the root of the righteous shall never be moved.
    translation: JPS 1917
    original: לֹא־יִכּוֹן אָדָם בְּרֶשַׁע וְשֹׁרֶשׁ צַדִּיקִים בַּל־יִמּוֹט׃
    hebrewPlain: לא יכון אדם ברשע ושרש צדיקים בל ימוט
    kjvRefs:
    - Proverbs 12:3
    kjvOsis:
    - Prov.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.4
    scripture: tanakh
    name: Tanakh Proverbs 12:4
    ref: Proverbs 12:4
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 4
    ordinal: 17992
    text: A virtuous woman is a crown to her husband; But she that doeth shamefully is as rottenness in his bones.
    translation: JPS 1917
    original: אֵשֶׁת־חַיִל עֲטֶרֶת בַּעְלָהּ וּכְרָקָב בְּעַצְמוֹתָיו מְבִישָׁה׃
    hebrewPlain: אשת חיל עטרת בעלה וכרקב בעצמותיו מבישה
    kjvRefs:
    - Proverbs 12:4
    kjvOsis:
    - Prov.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.5
    scripture: tanakh
    name: Tanakh Proverbs 12:5
    ref: Proverbs 12:5
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 5
    ordinal: 17993
    text: The thoughts of the righteous are right; But the counsels of the wicked are deceit.
    translation: JPS 1917
    original: מַחְשְׁבוֹת צַדִּיקִים מִשְׁפָּט תַּחְבֻּלוֹת רְשָׁעִים מִרְמָה׃
    hebrewPlain: מחשבות צדיקים משפט תחבלות רשעים מרמה
    kjvRefs:
    - Proverbs 12:5
    kjvOsis:
    - Prov.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.6
    scripture: tanakh
    name: Tanakh Proverbs 12:6
    ref: Proverbs 12:6
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 6
    ordinal: 17994
    text: The words of the wicked are to lie in wait for blood; But the mouth of the upright shall deliver them. .
    translation: JPS 1917
    original: דִּבְרֵי רְשָׁעִים אֱרָב־דָּם וּפִי יְשָׁרִים יַצִּילֵם׃
    hebrewPlain: דברי רשעים ארב דם ופי ישרים יצילם
    kjvRefs:
    - Proverbs 12:6
    kjvOsis:
    - Prov.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.7
    scripture: tanakh
    name: Tanakh Proverbs 12:7
    ref: Proverbs 12:7
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 7
    ordinal: 17995
    text: The wicked are overthrown, and are not; But the house of the righteous shall stand.
    translation: JPS 1917
    original: הָפוֹךְ רְשָׁעִים וְאֵינָם וּבֵית צַדִּיקִים יַעֲמֹד׃
    hebrewPlain: הפוך רשעים ואינם ובית צדיקים יעמד
    kjvRefs:
    - Proverbs 12:7
    kjvOsis:
    - Prov.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.8
    scripture: tanakh
    name: Tanakh Proverbs 12:8
    ref: Proverbs 12:8
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 8
    ordinal: 17996
    text: A man shall be commended according to his intelligence; But he that is of a distorted understanding shall be despised.
    translation: JPS 1917
    original: לְפִי־שִׂכְלוֹ יְהֻלַּל־אִישׁ וְנַעֲוֵה־לֵב יִהְיֶה לָבוּז׃
    hebrewPlain: לפי שכלו יהלל איש ונעוה לב יהיה לבוז
    kjvRefs:
    - Proverbs 12:8
    kjvOsis:
    - Prov.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.9
    scripture: tanakh
    name: Tanakh Proverbs 12:9
    ref: Proverbs 12:9
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 9
    ordinal: 17997
    text: Better is he that is lightly esteemed, and hath a servant, Than he that playeth the man of rank, and lacketh bread.
    translation: JPS 1917
    original: טוֹב נִקְלֶה וְעֶבֶד לוֹ מִמְּתַכַּבֵּד וַחֲסַר־לָחֶם׃
    hebrewPlain: טוב נקלה ועבד לו ממתכבד וחסר לחם
    kjvRefs:
    - Proverbs 12:9
    kjvOsis:
    - Prov.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.12
- type: TanakhVerse
  data:
    osis: Prov.12.10
    scripture: tanakh
    name: Tanakh Proverbs 12:10
    ref: Proverbs 12:10
    book: Prov
    section: ketuvim
    chapter: 12
    verse: 10
    ordinal: 17998
    text: A righteous man regardeth the life of his beast; But the tender mercies of the wicked are cruel.
    translation: JPS 1917
    original: יוֹדֵעַ צַדִּיק נֶפֶשׁ בְּהֶמְתּוֹ וְרַחֲמֵי רְשָׁעִים אַכְזָרִי׃
    hebrewPlain: יודע צדיק נפש בהמתו ורחמי רשעים אכזרי
    kjvRefs:
    - Proverbs 12:10
    kjvOsis:
    - Prov.12.10
  relations:
