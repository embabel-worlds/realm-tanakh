    scripture: tanakh
    name: Tanakh Proverbs 31:25
    ref: Proverbs 31:25
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 25
    ordinal: 18578
    text: Strength and dignity are her clothing; And she laugheth at the time to come.
    translation: JPS 1917
    original: עֹז־וְהָדָר לְבוּשָׁהּ וַתִּשְׂחַק לְיוֹם אַחֲרוֹן׃
    hebrewPlain: עז והדר לבושה ותשחק ליום אחרון
