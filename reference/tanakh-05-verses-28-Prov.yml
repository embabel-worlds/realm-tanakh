    name: Tanakh Proverbs 16:23
    ref: Proverbs 16:23
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 23
    ordinal: 18132
    text: The heart of the wise teacheth his mouth, And addeth learning to his lips.
    translation: JPS 1917
    original: לֵב חָכָם יַשְׂכִּיל פִּיהוּ וְעַל־שְׂפָתָיו יֹסִיף לֶקַח׃
    hebrewPlain: לב חכם ישכיל פיהו ועל שפתיו יסיף לקח
