    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.13
    scripture: tanakh
    name: Tanakh Proverbs 20:13
    ref: Proverbs 20:13
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 13
    ordinal: 18236
    text: Love not sleep, lest thou come to poverty; open thine eyes, and thou shalt have bread in plenty.
    translation: JPS 1917
    original: אַל־תֶּאֱהַב שֵׁנָה פֶּן־תִּוָּרֵשׁ פְּקַח עֵינֶיךָ שְׂבַע־לָחֶם׃
    hebrewPlain: אל תאהב שנה פן תורש פקח עיניך שבע לחם
    kjvRefs:
    - Proverbs 20:13
    kjvOsis:
    - Prov.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.14
    scripture: tanakh
    name: Tanakh Proverbs 20:14
    ref: Proverbs 20:14
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 14
    ordinal: 18237
    text: ’It is bad, it is bad’, saith the buyer; but when he is gone his way, then he boasteth.
    translation: JPS 1917
    original: רַע רַע יֹאמַר הַקּוֹנֶה וְאֹזֵל לוֹ אָז יִתְהַלָּל׃
    hebrewPlain: רע רע יאמר הקונה ואזל לו אז יתהלל
    kjvRefs:
    - Proverbs 20:14
    kjvOsis:
    - Prov.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.15
    scripture: tanakh
    name: Tanakh Proverbs 20:15
    ref: Proverbs 20:15
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 15
    ordinal: 18238
    text: There is gold, and a multitude of rubies; but the lips of knowledge are a precious jewel.
    translation: JPS 1917
    original: יֵשׁ זָהָב וְרָב־פְּנִינִים וּכְלִי יְקָר שִׂפְתֵי־דָעַת׃
    hebrewPlain: יש זהב ורב פנינים וכלי יקר שפתי דעת
    kjvRefs:
    - Proverbs 20:15
    kjvOsis:
    - Prov.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.16
    scripture: tanakh
    name: Tanakh Proverbs 20:16
    ref: Proverbs 20:16
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 16
    ordinal: 18239
    text: Take his garment that is surety for a stranger; and hold him in pledge that is surety for an alien woman.
    translation: JPS 1917
    original: לְקַח־בִּגְדוֹ כִּי־עָרַב זָר וּבְעַד נכרים [נָכְרִיָּה] חַבְלֵהוּ׃
    hebrewPlain: לקח בגדו כי ערב זר ובעד נכרים [נכריה] חבלהו
    kjvRefs:
    - Proverbs 20:16
    kjvOsis:
    - Prov.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.17
    scripture: tanakh
    name: Tanakh Proverbs 20:17
    ref: Proverbs 20:17
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 17
    ordinal: 18240
    text: Bread of falsehood is sweet to a man; but afterwards his mouth shall be filled with gravel.
    translation: JPS 1917
    original: עָרֵב לָאִישׁ לֶחֶם שָׁקֶר וְאַחַר יִמָּלֵא־פִיהוּ חָצָץ׃
    hebrewPlain: ערב לאיש לחם שקר ואחר ימלא פיהו חצץ
    kjvRefs:
    - Proverbs 20:17
    kjvOsis:
    - Prov.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.18
    scripture: tanakh
    name: Tanakh Proverbs 20:18
    ref: Proverbs 20:18
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 18
    ordinal: 18241
    text: Every purpose is established by counsel; and with good advice carry on war.
    translation: JPS 1917
    original: מַחֲשָׁבוֹת בְּעֵצָה תִכּוֹן וּבְתַחְבֻּלוֹת עֲשֵׂה מִלְחָמָה׃
    hebrewPlain: מחשבות בעצה תכון ובתחבלות עשה מלחמה
    kjvRefs:
    - Proverbs 20:18
    kjvOsis:
    - Prov.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.19
    scripture: tanakh
    name: Tanakh Proverbs 20:19
    ref: Proverbs 20:19
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 19
    ordinal: 18242
    text: He that goeth about as a talebearer revealeth secrets; therefore meddle not with him that openeth wide his lips.
    translation: JPS 1917
    original: גּוֹלֶה־סּוֹד הוֹלֵךְ רָכִיל וּלְפֹתֶה שְׂפָתָיו לֹא תִתְעָרָב׃
    hebrewPlain: גולה סוד הולך רכיל ולפתה שפתיו לא תתערב
    kjvRefs:
    - Proverbs 20:19
    kjvOsis:
    - Prov.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.20
    scripture: tanakh
    name: Tanakh Proverbs 20:20
    ref: Proverbs 20:20
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 20
    ordinal: 18243
    text: Whoso curseth his father or his mother, his lamp shall be put out in the blackest darkness.
    translation: JPS 1917
    original: מְקַלֵּל אָבִיו וְאִמּוֹ יִדְעַךְ נֵרוֹ באישון [בֶּאֱשׁוּן] חֹשֶׁךְ׃
    hebrewPlain: מקלל אביו ואמו ידעך נרו באישון [באשון] חשך
    kjvRefs:
    - Proverbs 20:20
    kjvOsis:
    - Prov.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.21
    scripture: tanakh
    name: Tanakh Proverbs 20:21
    ref: Proverbs 20:21
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 21
    ordinal: 18244
    text: An estate may be gotten hastily at the beginning; but the end thereof shall not be blessed.
    translation: JPS 1917
    original: נַחֲלָה מבחלת [מְבֹהֶלֶת] בָּרִאשֹׁנָה וְאַחֲרִיתָהּ לֹא תְבֹרָךְ׃
    hebrewPlain: נחלה מבחלת [מבהלת] בראשנה ואחריתה לא תברך
    kjvRefs:
    - Proverbs 20:21
    kjvOsis:
    - Prov.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.22
    scripture: tanakh
    name: Tanakh Proverbs 20:22
    ref: Proverbs 20:22
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 22
    ordinal: 18245
    text: 'Say not thou: ‘I will requite evil’; wait for the LORD, and He will save thee.'
    translation: JPS 1917
    original: אַל־תֹּאמַר אֲשַׁלְּמָה־רָע קַוֵּה לַיהוָה וְיֹשַׁע לָךְ׃
    hebrewPlain: אל תאמר אשלמה רע קוה ליהוה וישע לך
    kjvRefs:
    - Proverbs 20:22
    kjvOsis:
    - Prov.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.23
    scripture: tanakh
    name: Tanakh Proverbs 20:23
    ref: Proverbs 20:23
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 23
    ordinal: 18246
    text: Divers weights are an abomination to the LORD; and a false balance is not good.
    translation: JPS 1917
    original: תּוֹעֲבַת יְהוָה אֶבֶן וָאָבֶן וּמֹאזְנֵי מִרְמָה לֹא־טוֹב׃
    hebrewPlain: תועבת יהוה אבן ואבן ומאזני מרמה לא טוב
    kjvRefs:
    - Proverbs 20:23
    kjvOsis:
    - Prov.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.24
    scripture: tanakh
    name: Tanakh Proverbs 20:24
    ref: Proverbs 20:24
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 24
    ordinal: 18247
    text: A man’s goings are of the LORD; how then can man look to his way?
    translation: JPS 1917
    original: מֵיהוָה מִצְעֲדֵי־גָבֶר וְאָדָם מַה־יָּבִין דַּרְכּוֹ׃
    hebrewPlain: מיהוה מצעדי גבר ואדם מה יבין דרכו
    kjvRefs:
    - Proverbs 20:24
    kjvOsis:
    - Prov.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.25
    scripture: tanakh
    name: Tanakh Proverbs 20:25
    ref: Proverbs 20:25
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 25
    ordinal: 18248
    text: 'It is a snare to a man rashly to say: ‘Holy’, and after vows to make inquiry.'
    translation: JPS 1917
    original: מוֹקֵשׁ אָדָם יָלַע קֹדֶשׁ וְאַחַר נְדָרִים לְבַקֵּר׃
    hebrewPlain: מוקש אדם ילע קדש ואחר נדרים לבקר
    kjvRefs:
    - Proverbs 20:25
    kjvOsis:
    - Prov.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.26
    scripture: tanakh
    name: Tanakh Proverbs 20:26
    ref: Proverbs 20:26
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 26
    ordinal: 18249
    text: A wise king sifteth the wicked, and turneth the wheel over them.
    translation: JPS 1917
    original: מְזָרֶה רְשָׁעִים מֶלֶךְ חָכָם וַיָּשֶׁב עֲלֵיהֶם אוֹפָן׃
    hebrewPlain: מזרה רשעים מלך חכם וישב עליהם אופן
    kjvRefs:
    - Proverbs 20:26
    kjvOsis:
    - Prov.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.27
    scripture: tanakh
    name: Tanakh Proverbs 20:27
    ref: Proverbs 20:27
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 27
    ordinal: 18250
    text: The spirit of man is the lamp of the LORD, searching all the inward parts.
    translation: JPS 1917
    original: נֵר יְהוָה נִשְׁמַת אָדָם חֹפֵשׂ כָּל־חַדְרֵי־בָטֶן׃
    hebrewPlain: נר יהוה נשמת אדם חפש כל חדרי בטן
    kjvRefs:
    - Proverbs 20:27
    kjvOsis:
    - Prov.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.28
    scripture: tanakh
    name: Tanakh Proverbs 20:28
    ref: Proverbs 20:28
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 28
    ordinal: 18251
    text: Mercy and truth preserve the king; and his throne is upheld by mercy.
    translation: JPS 1917
    original: חֶסֶד וֶאֱמֶת יִצְּרוּ־מֶלֶךְ וְסָעַד בַּחֶסֶד כִּסְאוֹ׃
    hebrewPlain: חסד ואמת יצרו מלך וסעד בחסד כסאו
    kjvRefs:
    - Proverbs 20:28
    kjvOsis:
    - Prov.20.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.29
    scripture: tanakh
    name: Tanakh Proverbs 20:29
    ref: Proverbs 20:29
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 29
    ordinal: 18252
    text: The glory of young men is their strength; and the beauty of old men is the hoary head.
    translation: JPS 1917
    original: תִּפְאֶרֶת בַּחוּרִים כֹּחָם וַהֲדַר זְקֵנִים שֵׂיבָה׃
    hebrewPlain: תפארת בחורים כחם והדר זקנים שיבה
    kjvRefs:
    - Proverbs 20:29
    kjvOsis:
    - Prov.20.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.20.30
    scripture: tanakh
    name: Tanakh Proverbs 20:30
    ref: Proverbs 20:30
    book: Prov
    section: ketuvim
    chapter: 20
    verse: 30
    ordinal: 18253
    text: Sharp wounds cleanse away evil; So do stripes that reach the inward parts.
    translation: JPS 1917
    original: חַבֻּרוֹת פֶּצַע תמריק [תַּמְרוּק] בְּרָע וּמַכּוֹת חַדְרֵי־בָטֶן׃
    hebrewPlain: חברות פצע תמריק [תמרוק] ברע ומכות חדרי בטן
    kjvRefs:
    - Proverbs 20:30
    kjvOsis:
    - Prov.20.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.20
- type: TanakhVerse
  data:
    osis: Prov.21.1
    scripture: tanakh
    name: Tanakh Proverbs 21:1
    ref: Proverbs 21:1
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 1
    ordinal: 18254
    text: 'The king’s heart is in the hand of the LORD, as the watercourses: He turneth it whithersoever He will.'
    translation: JPS 1917
    original: פַּלְגֵי־מַיִם לֶב־מֶלֶךְ בְּיַד־יְהוָה עַל־כָּל־אֲשֶׁר יַחְפֹּץ יַטֶּנּוּ׃
    hebrewPlain: פלגי מים לב מלך ביד יהוה על כל אשר יחפץ יטנו
    kjvRefs:
    - Proverbs 21:1
    kjvOsis:
    - Prov.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.2
    scripture: tanakh
    name: Tanakh Proverbs 21:2
    ref: Proverbs 21:2
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 2
    ordinal: 18255
    text: Every way of a man is right in his own eyes; But the LORD weigheth the hearts.
    translation: JPS 1917
    original: כָּל־דֶּרֶךְ־אִישׁ יָשָׁר בְּעֵינָיו וְתֹכֵן לִבּוֹת יְהוָה׃
    hebrewPlain: כל דרך איש ישר בעיניו ותכן לבות יהוה
    kjvRefs:
    - Proverbs 21:2
    kjvOsis:
    - Prov.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.3
    scripture: tanakh
    name: Tanakh Proverbs 21:3
    ref: Proverbs 21:3
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 3
    ordinal: 18256
    text: To do righteousness and justice Is more acceptable to the LORD than sacrifice.
    translation: JPS 1917
    original: עֲשֹׂה צְדָקָה וּמִשְׁפָּט נִבְחָר לַיהוָה מִזָּבַח׃
    hebrewPlain: עשה צדקה ומשפט נבחר ליהוה מזבח
    kjvRefs:
    - Proverbs 21:3
    kjvOsis:
    - Prov.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.4
    scripture: tanakh
    name: Tanakh Proverbs 21:4
    ref: Proverbs 21:4
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 4
    ordinal: 18257
    text: A haughty look, and a proud heart— The tillage of the wicked is sin.
    translation: JPS 1917
    original: רוּם־עֵינַיִם וּרְחַב־לֵב נִר רְשָׁעִים חַטָּאת׃
    hebrewPlain: רום עינים ורחב לב נר רשעים חטאת
    kjvRefs:
    - Proverbs 21:4
    kjvOsis:
    - Prov.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.5
    scripture: tanakh
    name: Tanakh Proverbs 21:5
    ref: Proverbs 21:5
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 5
    ordinal: 18258
    text: The thoughts of the diligent tend only to plenteousness; But every one that is hasty hasteth only to want.
    translation: JPS 1917
    original: מַחְשְׁבוֹת חָרוּץ אַךְ־לְמוֹתָר וְכָל־אָץ אַךְ־לְמַחְסוֹר׃
    hebrewPlain: מחשבות חרוץ אך למותר וכל אץ אך למחסור
    kjvRefs:
    - Proverbs 21:5
    kjvOsis:
    - Prov.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.6
    scripture: tanakh
    name: Tanakh Proverbs 21:6
    ref: Proverbs 21:6
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 6
    ordinal: 18259
    text: The getting of treasures by a lying tongue Is a vapour driven to and fro; they [that seek them] seek death.
    translation: JPS 1917
    original: פֹּעַל אוֹצָרוֹת בִּלְשׁוֹן שָׁקֶר הֶבֶל נִדָּף מְבַקְשֵׁי־מָוֶת׃
    hebrewPlain: פעל אוצרות בלשון שקר הבל נדף מבקשי מות
    kjvRefs:
    - Proverbs 21:6
    kjvOsis:
    - Prov.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.7
    scripture: tanakh
    name: Tanakh Proverbs 21:7
    ref: Proverbs 21:7
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 7
    ordinal: 18260
    text: The violence of the wicked shall drag them away; Because they refuse to do justly.
    translation: JPS 1917
    original: שֹׁד־רְשָׁעִים יְגוֹרֵם כִּי מֵאֲנוּ לַעֲשׂוֹת מִשְׁפָּט׃
    hebrewPlain: שד רשעים יגורם כי מאנו לעשות משפט
    kjvRefs:
    - Proverbs 21:7
    kjvOsis:
    - Prov.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.8
    scripture: tanakh
    name: Tanakh Proverbs 21:8
    ref: Proverbs 21:8
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 8
    ordinal: 18261
    text: The way of man is froward and strange; But as for the pure, his work is right.
    translation: JPS 1917
    original: הֲפַכְפַּךְ דֶּרֶךְ אִישׁ וָזָר וְזַךְ יָשָׁר פָּעֳלוֹ׃
    hebrewPlain: הפכפך דרך איש וזר וזך ישר פעלו
    kjvRefs:
    - Proverbs 21:8
    kjvOsis:
    - Prov.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.9
    scripture: tanakh
    name: Tanakh Proverbs 21:9
    ref: Proverbs 21:9
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 9
    ordinal: 18262
    text: It is better to dwell in a corner of the housetop, Than in a house in common with a contentious woman.
    translation: JPS 1917
    original: טוֹב לָשֶׁבֶת עַל־פִּנַּת־גָּג מֵאֵשֶׁת מִדְיָנִים וּבֵית חָבֶר׃
    hebrewPlain: טוב לשבת על פנת גג מאשת מדינים ובית חבר
    kjvRefs:
    - Proverbs 21:9
    kjvOsis:
    - Prov.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.10
    scripture: tanakh
    name: Tanakh Proverbs 21:10
    ref: Proverbs 21:10
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 10
    ordinal: 18263
    text: The soul of the wicked desireth evil; His neighbour findeth no favour in his eyes.
    translation: JPS 1917
    original: נֶפֶשׁ רָשָׁע אִוְּתָה־רָע לֹא־יֻחַן בְּעֵינָיו רֵעֵהוּ׃
    hebrewPlain: נפש רשע אותה רע לא יחן בעיניו רעהו
    kjvRefs:
    - Proverbs 21:10
    kjvOsis:
    - Prov.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.11
    scripture: tanakh
    name: Tanakh Proverbs 21:11
    ref: Proverbs 21:11
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 11
    ordinal: 18264
    text: When the scorner is punished, the thoughtless is made wise; And when the wise is instructed, he receiveth knowledge.
    translation: JPS 1917
    original: בַּעְנָשׁ־לֵץ יֶחְכַּם־פֶּתִי וּבְהַשְׂכִּיל לְחָכָם יִקַּח־דָּעַת׃
    hebrewPlain: בענש לץ יחכם פתי ובהשכיל לחכם יקח דעת
    kjvRefs:
    - Proverbs 21:11
    kjvOsis:
    - Prov.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.12
    scripture: tanakh
    name: Tanakh Proverbs 21:12
    ref: Proverbs 21:12
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 12
    ordinal: 18265
    text: The Righteous One considereth the house of the wicked; Overthrowing the wicked to their ruin.
    translation: JPS 1917
    original: מַשְׂכִּיל צַדִּיק לְבֵית רָשָׁע מְסַלֵּף רְשָׁעִים לָרָע׃
    hebrewPlain: משכיל צדיק לבית רשע מסלף רשעים לרע
    kjvRefs:
    - Proverbs 21:12
    kjvOsis:
    - Prov.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.13
    scripture: tanakh
    name: Tanakh Proverbs 21:13
    ref: Proverbs 21:13
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 13
    ordinal: 18266
    text: Whoso stoppeth his ears at the cry of the poor, He also shall cry himself, but shall not be answered.
    translation: JPS 1917
    original: אֹטֵם אָזְנוֹ מִזַּעֲקַת־דָּל גַּם־הוּא יִקְרָא וְלֹא יֵעָנֶה׃
    hebrewPlain: אטם אזנו מזעקת דל גם הוא יקרא ולא יענה
    kjvRefs:
    - Proverbs 21:13
    kjvOsis:
    - Prov.21.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.14
    scripture: tanakh
    name: Tanakh Proverbs 21:14
    ref: Proverbs 21:14
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 14
    ordinal: 18267
    text: A gift in secret pacifieth anger, And a present in the bosom strong wrath.
    translation: JPS 1917
    original: מַתָּן בַּסֵּתֶר יִכְפֶּה־אָף וְשֹׁחַד בַּחֵק חֵמָה עַזָּה׃
    hebrewPlain: מתן בסתר יכפה אף ושחד בחק חמה עזה
    kjvRefs:
    - Proverbs 21:14
    kjvOsis:
    - Prov.21.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.15
    scripture: tanakh
    name: Tanakh Proverbs 21:15
    ref: Proverbs 21:15
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 15
    ordinal: 18268
    text: To do justly is joy to the righteous, But ruin to the workers of iniquity.
    translation: JPS 1917
    original: שִׂמְחָה לַצַּדִּיק עֲשׂוֹת מִשְׁפָּט וּמְחִתָּה לְפֹעֲלֵי אָוֶן׃
    hebrewPlain: שמחה לצדיק עשות משפט ומחתה לפעלי און
    kjvRefs:
    - Proverbs 21:15
    kjvOsis:
    - Prov.21.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.16
    scripture: tanakh
    name: Tanakh Proverbs 21:16
    ref: Proverbs 21:16
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 16
    ordinal: 18269
    text: The man that strayeth out of the way of understanding Shall rest in the congregation of the shades.
    translation: JPS 1917
    original: אָדָם תּוֹעֶה מִדֶּרֶךְ הַשְׂכֵּל בִּקְהַל רְפָאִים יָנוּחַ׃
    hebrewPlain: אדם תועה מדרך השכל בקהל רפאים ינוח
    kjvRefs:
    - Proverbs 21:16
    kjvOsis:
    - Prov.21.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.17
    scripture: tanakh
    name: Tanakh Proverbs 21:17
    ref: Proverbs 21:17
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 17
    ordinal: 18270
    text: He that loveth pleasure shall be a poor man; He that loveth wine and oil shall not be rich.
    translation: JPS 1917
    original: אִישׁ מַחְסוֹר אֹהֵב שִׂמְחָה אֹהֵב יַיִן־וָשֶׁמֶן לֹא יַעֲשִׁיר׃
    hebrewPlain: איש מחסור אהב שמחה אהב יין ושמן לא יעשיר
    kjvRefs:
    - Proverbs 21:17
    kjvOsis:
    - Prov.21.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.18
    scripture: tanakh
    name: Tanakh Proverbs 21:18
    ref: Proverbs 21:18
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 18
    ordinal: 18271
    text: The wicked is a ransom for the righteous; And the faithless cometh in the stead of the upright.
    translation: JPS 1917
    original: כֹּפֶר לַצַּדִּיק רָשָׁע וְתַחַת יְשָׁרִים בּוֹגֵד׃
    hebrewPlain: כפר לצדיק רשע ותחת ישרים בוגד
    kjvRefs:
    - Proverbs 21:18
    kjvOsis:
    - Prov.21.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.19
    scripture: tanakh
    name: Tanakh Proverbs 21:19
    ref: Proverbs 21:19
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 19
    ordinal: 18272
    text: It is better to dwell in a desert land, Than with a contentious and fretful woman.
    translation: JPS 1917
    original: טוֹב שֶׁבֶת בְּאֶרֶץ־מִדְבָּר מֵאֵשֶׁת מדונים [מִדְיָנִים] וָכָעַס׃
    hebrewPlain: טוב שבת בארץ מדבר מאשת מדונים [מדינים] וכעס
    kjvRefs:
    - Proverbs 21:19
    kjvOsis:
    - Prov.21.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.20
    scripture: tanakh
    name: Tanakh Proverbs 21:20
    ref: Proverbs 21:20
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 20
    ordinal: 18273
    text: There is desirable treasure and oil in the dwelling of the wise; But a foolish man swalloweth it up.
    translation: JPS 1917
    original: אוֹצָר נֶחְמָד וָשֶׁמֶן בִּנְוֵה חָכָם וּכְסִיל אָדָם יְבַלְּעֶנּוּ׃
    hebrewPlain: אוצר נחמד ושמן בנוה חכם וכסיל אדם יבלענו
    kjvRefs:
    - Proverbs 21:20
    kjvOsis:
    - Prov.21.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.21
    scripture: tanakh
    name: Tanakh Proverbs 21:21
    ref: Proverbs 21:21
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 21
    ordinal: 18274
    text: He that followeth after righteousness and mercy Findeth life, prosperity, and honour.
    translation: JPS 1917
    original: רֹדֵף צְדָקָה וָחָסֶד יִמְצָא חַיִּים צְדָקָה וְכָבוֹד׃
    hebrewPlain: רדף צדקה וחסד ימצא חיים צדקה וכבוד
    kjvRefs:
    - Proverbs 21:21
    kjvOsis:
    - Prov.21.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.22
    scripture: tanakh
    name: Tanakh Proverbs 21:22
    ref: Proverbs 21:22
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 22
    ordinal: 18275
    text: A wise man scaleth the city of the mighty, And bringeth down the stronghold wherein it trusteth.
    translation: JPS 1917
    original: עִיר גִּבֹּרִים עָלָה חָכָם וַיֹּרֶד עֹז מִבְטֶחָה׃
    hebrewPlain: עיר גברים עלה חכם וירד עז מבטחה
    kjvRefs:
    - Proverbs 21:22
    kjvOsis:
    - Prov.21.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.23
    scripture: tanakh
    name: Tanakh Proverbs 21:23
    ref: Proverbs 21:23
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 23
    ordinal: 18276
    text: Whoso keepeth his mouth and his tongue Keepeth his soul from troubles.
    translation: JPS 1917
    original: שֹׁמֵר פִּיו וּלְשׁוֹנוֹ שֹׁמֵר מִצָּרוֹת נַפְשׁוֹ׃
    hebrewPlain: שמר פיו ולשונו שמר מצרות נפשו
    kjvRefs:
    - Proverbs 21:23
    kjvOsis:
    - Prov.21.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.24
    scripture: tanakh
    name: Tanakh Proverbs 21:24
    ref: Proverbs 21:24
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 24
    ordinal: 18277
    text: A proud and haughty man, scorner is his name, Even he that dealeth in overbearing pride.
    translation: JPS 1917
    original: זֵד יָהִיר לֵץ שְׁמוֹ עוֹשֶׂה בְּעֶבְרַת זָדוֹן׃
    hebrewPlain: זד יהיר לץ שמו עושה בעברת זדון
    kjvRefs:
    - Proverbs 21:24
    kjvOsis:
    - Prov.21.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.25
    scripture: tanakh
    name: Tanakh Proverbs 21:25
    ref: Proverbs 21:25
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 25
    ordinal: 18278
    text: The desire of the slothful killeth him; For his hands refuse to labour.
    translation: JPS 1917
    original: תַּאֲוַת עָצֵל תְּמִיתֶנּוּ כִּי־מֵאֲנוּ יָדָיו לַעֲשׂוֹת׃
    hebrewPlain: תאות עצל תמיתנו כי מאנו ידיו לעשות
    kjvRefs:
    - Proverbs 21:25
    kjvOsis:
    - Prov.21.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.26
    scripture: tanakh
    name: Tanakh Proverbs 21:26
    ref: Proverbs 21:26
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 26
    ordinal: 18279
    text: There is that coveteth greedily all the day long; But the righteous giveth and spareth not.
    translation: JPS 1917
    original: כָּל־הַיּוֹם הִתְאַוָּה תַאֲוָה וְצַדִּיק יִתֵּן וְלֹא יַחְשֹׂךְ׃
    hebrewPlain: כל היום התאוה תאוה וצדיק יתן ולא יחשך
    kjvRefs:
    - Proverbs 21:26
    kjvOsis:
    - Prov.21.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.27
    scripture: tanakh
    name: Tanakh Proverbs 21:27
    ref: Proverbs 21:27
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 27
    ordinal: 18280
    text: The sacrifice of the wicked is an abomination; How much more, when he bringeth it with the proceeds of wickedness?
    translation: JPS 1917
    original: זֶבַח רְשָׁעִים תּוֹעֵבָה אַף כִּי־בְזִמָּה יְבִיאֶנּוּ׃
    hebrewPlain: זבח רשעים תועבה אף כי בזמה יביאנו
    kjvRefs:
    - Proverbs 21:27
    kjvOsis:
    - Prov.21.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.28
    scripture: tanakh
    name: Tanakh Proverbs 21:28
    ref: Proverbs 21:28
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 28
    ordinal: 18281
    text: A false witness shall perish; But the man that obeyeth shall speak unchallenged.
    translation: JPS 1917
    original: עֵד־כְּזָבִים יֹאבֵד וְאִישׁ שׁוֹמֵעַ לָנֶצַח יְדַבֵּר׃
    hebrewPlain: עד כזבים יאבד ואיש שומע לנצח ידבר
    kjvRefs:
    - Proverbs 21:28
    kjvOsis:
    - Prov.21.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.29
    scripture: tanakh
    name: Tanakh Proverbs 21:29
    ref: Proverbs 21:29
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 29
    ordinal: 18282
    text: A wicked man hardeneth his face; But as for the upright, he looketh well to his way.
    translation: JPS 1917
    original: הֵעֵז אִישׁ רָשָׁע בְּפָנָיו וְיָשָׁר הוּא יכין [יָבִין] דרכיו [דַּרְכּוֹ׃]
    hebrewPlain: העז איש רשע בפניו וישר הוא יכין [יבין] דרכיו [דרכו]
    kjvRefs:
    - Proverbs 21:29
    kjvOsis:
    - Prov.21.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.30
    scripture: tanakh
    name: Tanakh Proverbs 21:30
    ref: Proverbs 21:30
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 30
    ordinal: 18283
    text: There is no wisdom nor understanding Nor counsel against the LORD.
    translation: JPS 1917
    original: אֵין חָכְמָה וְאֵין תְּבוּנָה וְאֵין עֵצָה לְנֶגֶד יְהוָה׃
    hebrewPlain: אין חכמה ואין תבונה ואין עצה לנגד יהוה
    kjvRefs:
    - Proverbs 21:30
    kjvOsis:
    - Prov.21.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.21.31
    scripture: tanakh
    name: Tanakh Proverbs 21:31
    ref: Proverbs 21:31
    book: Prov
    section: ketuvim
    chapter: 21
    verse: 31
    ordinal: 18284
    text: The horse is prepared against the day of battle; But victory is of the LORD.
    translation: JPS 1917
    original: סוּס מוּכָן לְיוֹם מִלְחָמָה וְלַיהוָה הַתְּשׁוּעָה׃
    hebrewPlain: סוס מוכן ליום מלחמה וליהוה התשועה
    kjvRefs:
    - Proverbs 21:31
    kjvOsis:
    - Prov.21.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.21
- type: TanakhVerse
  data:
    osis: Prov.22.1
    scripture: tanakh
    name: Tanakh Proverbs 22:1
    ref: Proverbs 22:1
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 1
    ordinal: 18285
    text: A good name is rather to be chosen than great riches, And loving favour rather than silver and gold.
    translation: JPS 1917
    original: נִבְחָר שֵׁם מֵעֹשֶׁר רָב מִכֶּסֶף וּמִזָּהָב חֵן טוֹב׃
    hebrewPlain: נבחר שם מעשר רב מכסף ומזהב חן טוב
    kjvRefs:
    - Proverbs 22:1
    kjvOsis:
    - Prov.22.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.2
    scripture: tanakh
    name: Tanakh Proverbs 22:2
    ref: Proverbs 22:2
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 2
    ordinal: 18286
    text: The rich and the poor meet together— The LORD is the maker of them all.
    translation: JPS 1917
    original: עָשִׁיר וָרָשׁ נִפְגָּשׁוּ עֹשֵׂה כֻלָּם יְהוָה׃
    hebrewPlain: עשיר ורש נפגשו עשה כלם יהוה
    kjvRefs:
    - Proverbs 22:2
    kjvOsis:
    - Prov.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.3
    scripture: tanakh
    name: Tanakh Proverbs 22:3
    ref: Proverbs 22:3
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 3
    ordinal: 18287
    text: A prudent man seeth the evil, and hideth himself; But the thoughtless pass on, and are punished.
    translation: JPS 1917
    original: עָרוּם רָאָה רָעָה ויסתר [וְנִסְתָּר] וּפְתָיִים עָבְרוּ וְנֶעֱנָשׁוּ׃
    hebrewPlain: ערום ראה רעה ויסתר [ונסתר] ופתיים עברו ונענשו
    kjvRefs:
    - Proverbs 22:3
    kjvOsis:
    - Prov.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.4
    scripture: tanakh
    name: Tanakh Proverbs 22:4
    ref: Proverbs 22:4
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 4
    ordinal: 18288
    text: The reward of humility is the fear of the LORD, Even riches, and honour, and life.
    translation: JPS 1917
    original: עֵקֶב עֲנָוָה יִרְאַת יְהוָה עֹשֶׁר וְכָבוֹד וְחַיִּים׃
    hebrewPlain: עקב ענוה יראת יהוה עשר וכבוד וחיים
    kjvRefs:
    - Proverbs 22:4
    kjvOsis:
    - Prov.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.5
    scripture: tanakh
    name: Tanakh Proverbs 22:5
    ref: Proverbs 22:5
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 5
    ordinal: 18289
    text: Thorns and snares are in the way of the froward; He that keepeth his soul holdeth himself far from them.
    translation: JPS 1917
    original: צִנִּים פַּחִים בְּדֶרֶךְ עִקֵּשׁ שׁוֹמֵר נַפְשׁוֹ יִרְחַק מֵהֶם׃
    hebrewPlain: צנים פחים בדרך עקש שומר נפשו ירחק מהם
    kjvRefs:
    - Proverbs 22:5
    kjvOsis:
    - Prov.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.6
    scripture: tanakh
    name: Tanakh Proverbs 22:6
    ref: Proverbs 22:6
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 6
    ordinal: 18290
    text: Train up a child in the way he should go, And even when he is old, he will not depart from it.
    translation: JPS 1917
    original: חֲנֹךְ לַנַּעַר עַל־פִּי דַרְכּוֹ גַּם כִּי־יַזְקִין לֹא־יָסוּר מִמֶּנָּה׃
    hebrewPlain: חנך לנער על פי דרכו גם כי יזקין לא יסור ממנה
    kjvRefs:
    - Proverbs 22:6
    kjvOsis:
    - Prov.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.7
    scripture: tanakh
    name: Tanakh Proverbs 22:7
    ref: Proverbs 22:7
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 7
    ordinal: 18291
    text: The rich ruleth over the poor, And the borrower is servant to the lender.
    translation: JPS 1917
    original: עָשִׁיר בְּרָשִׁים יִמְשׁוֹל וְעֶבֶד לֹוֶה לְאִישׁ מַלְוֶה׃
    hebrewPlain: עשיר ברשים ימשול ועבד לוה לאיש מלוה
    kjvRefs:
    - Proverbs 22:7
    kjvOsis:
    - Prov.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.8
    scripture: tanakh
    name: Tanakh Proverbs 22:8
    ref: Proverbs 22:8
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 8
    ordinal: 18292
    text: He that soweth iniquity shall reap vanity; And the rod of his wrath shall fail.
    translation: JPS 1917
    original: זוֹרֵעַ עַוְלָה יקצור־[יִקְצָר־] אָוֶן וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה׃
    hebrewPlain: זורע עולה יקצור [יקצר ] און ושבט עברתו יכלה
    kjvRefs:
    - Proverbs 22:8
    kjvOsis:
    - Prov.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.9
    scripture: tanakh
    name: Tanakh Proverbs 22:9
    ref: Proverbs 22:9
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 9
    ordinal: 18293
    text: He that hath a bountiful eye shall be blessed; For he giveth of his bread to the poor.
    translation: JPS 1917
    original: טוֹב־עַיִן הוּא יְבֹרָךְ כִּי־נָתַן מִלַּחְמוֹ לַדָּל׃
    hebrewPlain: טוב עין הוא יברך כי נתן מלחמו לדל
    kjvRefs:
    - Proverbs 22:9
    kjvOsis:
    - Prov.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.10
    scripture: tanakh
    name: Tanakh Proverbs 22:10
    ref: Proverbs 22:10
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 10
    ordinal: 18294
    text: Cast out the scorner, and contention will go out; Yea, strife and shame will cease.
    translation: JPS 1917
    original: גָּרֵשׁ לֵץ וְיֵצֵא מָדוֹן וְיִשְׁבֹּת דִּין וְקָלוֹן׃
    hebrewPlain: גרש לץ ויצא מדון וישבת דין וקלון
    kjvRefs:
    - Proverbs 22:10
    kjvOsis:
    - Prov.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.11
    scripture: tanakh
    name: Tanakh Proverbs 22:11
    ref: Proverbs 22:11
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 11
    ordinal: 18295
    text: He that loveth pureness of heart, That hath grace in his lips, the king shall be his friend.
    translation: JPS 1917
    original: אֹהֵב טהור־[טְהָר־] לֵב חֵן שְׂפָתָיו רֵעֵהוּ מֶלֶךְ׃
    hebrewPlain: אהב טהור [טהר ] לב חן שפתיו רעהו מלך
    kjvRefs:
    - Proverbs 22:11
    kjvOsis:
    - Prov.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.12
    scripture: tanakh
    name: Tanakh Proverbs 22:12
    ref: Proverbs 22:12
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 12
    ordinal: 18296
    text: The eyes of the LORD preserve him that hath knowledge, But He overthroweth the words of the faithless man.
    translation: JPS 1917
    original: עֵינֵי יְהוָה נָצְרוּ דָעַת וַיְסַלֵּף דִּבְרֵי בֹגֵד׃
    hebrewPlain: עיני יהוה נצרו דעת ויסלף דברי בגד
    kjvRefs:
    - Proverbs 22:12
    kjvOsis:
    - Prov.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.13
    scripture: tanakh
    name: Tanakh Proverbs 22:13
    ref: Proverbs 22:13
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 13
    ordinal: 18297
    text: 'The sluggard saith: ‘There is a lion without; I shall be slain in the streets.’'
    translation: JPS 1917
    original: אָמַר עָצֵל אֲרִי בַחוּץ בְּתוֹךְ רְחֹבוֹת אֵרָצֵחַ׃
    hebrewPlain: אמר עצל ארי בחוץ בתוך רחבות ארצח
    kjvRefs:
    - Proverbs 22:13
    kjvOsis:
    - Prov.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.14
    scripture: tanakh
    name: Tanakh Proverbs 22:14
    ref: Proverbs 22:14
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 14
    ordinal: 18298
    text: 'The mouth of strange women is a deep pit: He that is abhorred of the LORD shall fall therein.'
    translation: JPS 1917
    original: שׁוּחָה עֲמֻקָּה פִּי זָרוֹת זְעוּם יְהוָה יפול־[יִפָּל־] שָׁם׃
    hebrewPlain: שוחה עמקה פי זרות זעום יהוה יפול [יפל ] שם
    kjvRefs:
    - Proverbs 22:14
    kjvOsis:
    - Prov.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.15
    scripture: tanakh
    name: Tanakh Proverbs 22:15
    ref: Proverbs 22:15
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 15
    ordinal: 18299
    text: Foolishness is bound up in the heart of a child; But the rod of correction shall drive it far from him.
    translation: JPS 1917
    original: אִוֶּלֶת קְשׁוּרָה בְלֶב־נָעַר שֵׁבֶט מוּסָר יַרְחִיקֶנָּה מִמֶּנּוּ׃
    hebrewPlain: אולת קשורה בלב נער שבט מוסר ירחיקנה ממנו
    kjvRefs:
    - Proverbs 22:15
    kjvOsis:
    - Prov.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.16
    scripture: tanakh
    name: Tanakh Proverbs 22:16
    ref: Proverbs 22:16
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 16
    ordinal: 18300
    text: One may oppress the poor, yet will their gain increase; One may give to the rich, yet will want come.
    translation: JPS 1917
    original: עֹשֵׁק דָּל לְהַרְבּוֹת לוֹ נֹתֵן לְעָשִׁיר אַךְ־לְמַחְסוֹר׃
    hebrewPlain: עשק דל להרבות לו נתן לעשיר אך למחסור
    kjvRefs:
    - Proverbs 22:16
    kjvOsis:
    - Prov.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.17
    scripture: tanakh
    name: Tanakh Proverbs 22:17
    ref: Proverbs 22:17
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 17
    ordinal: 18301
    text: Incline thine ear, and hear the words of the wise, And apply thy heart unto my knowledge.
    translation: JPS 1917
    original: הַט אָזְנְךָ וּשְׁמַע דִּבְרֵי חֲכָמִים וְלִבְּךָ תָּשִׁית לְדַעְתִּי׃
    hebrewPlain: הט אזנך ושמע דברי חכמים ולבך תשית לדעתי
    kjvRefs:
    - Proverbs 22:17
    kjvOsis:
    - Prov.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.18
    scripture: tanakh
    name: Tanakh Proverbs 22:18
    ref: Proverbs 22:18
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 18
    ordinal: 18302
    text: For it is a pleasant thing if thou keep them within thee; Let them be established altogether upon thy lips.
    translation: JPS 1917
    original: כִּי־נָעִים כִּי־תִשְׁמְרֵם בְּבִטְנֶךָ יִכֹּנוּ יַחְדָּו עַל־שְׂפָתֶיךָ׃
    hebrewPlain: כי נעים כי תשמרם בבטנך יכנו יחדו על שפתיך
    kjvRefs:
    - Proverbs 22:18
    kjvOsis:
    - Prov.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.19
    scripture: tanakh
    name: Tanakh Proverbs 22:19
    ref: Proverbs 22:19
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 19
    ordinal: 18303
    text: That thy trust may be in the LORD, I have made them known to thee this day, even to thee.
    translation: JPS 1917
    original: לִהְיוֹת בַּיהוָה מִבְטַחֶךָ הוֹדַעְתִּיךָ הַיּוֹם אַף־אָתָּה׃
    hebrewPlain: להיות ביהוה מבטחך הודעתיך היום אף אתה
    kjvRefs:
    - Proverbs 22:19
    kjvOsis:
    - Prov.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.20
    scripture: tanakh
    name: Tanakh Proverbs 22:20
    ref: Proverbs 22:20
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 20
    ordinal: 18304
    text: Have not I written unto thee excellent things Of counsels and knowledge;
    translation: JPS 1917
    original: הֲלֹא כָתַבְתִּי לְךָ שלשום [שָׁלִישִׁים] בְּמוֹעֵצֹת וָדָעַת׃
    hebrewPlain: הלא כתבתי לך שלשום [שלישים] במועצת ודעת
    kjvRefs:
    - Proverbs 22:20
    kjvOsis:
    - Prov.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.21
    scripture: tanakh
    name: Tanakh Proverbs 22:21
    ref: Proverbs 22:21
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 21
    ordinal: 18305
    text: That I might make thee know the certainty of the words of truth, That thou mightest bring back words of truth to them that send thee?
    translation: JPS 1917
    original: לְהוֹדִיעֲךָ קֹשְׁטְ אִמְרֵי אֱמֶת לְהָשִׁיב אֲמָרִים אֱמֶת לְשֹׁלְחֶיךָ׃
    hebrewPlain: להודיעך קשט אמרי אמת להשיב אמרים אמת לשלחיך
    kjvRefs:
    - Proverbs 22:21
    kjvOsis:
    - Prov.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.22
    scripture: tanakh
    name: Tanakh Proverbs 22:22
    ref: Proverbs 22:22
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 22
    ordinal: 18306
    text: Rob not the weak, because he is weak, Neither crush the poor in the gate;
    translation: JPS 1917
    original: אַל־תִּגְזָל־דָּל כִּי דַל־הוּא וְאַל־תְּדַכֵּא עָנִי בַשָּׁעַר׃
    hebrewPlain: אל תגזל דל כי דל הוא ואל תדכא עני בשער
    kjvRefs:
    - Proverbs 22:22
    kjvOsis:
    - Prov.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.23
    scripture: tanakh
    name: Tanakh Proverbs 22:23
    ref: Proverbs 22:23
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 23
    ordinal: 18307
    text: For the LORD will plead their cause, And despoil of life those that despoil them.
    translation: JPS 1917
    original: כִּי־יְהוָה יָרִיב רִיבָם וְקָבַע אֶת־קֹבְעֵיהֶם נָפֶשׁ׃
    hebrewPlain: כי יהוה יריב ריבם וקבע את קבעיהם נפש
    kjvRefs:
    - Proverbs 22:23
    kjvOsis:
    - Prov.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.24
    scripture: tanakh
    name: Tanakh Proverbs 22:24
    ref: Proverbs 22:24
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 24
    ordinal: 18308
    text: Make no friendship with a man that is given to anger; And with a wrathful man thou shalt not go;
    translation: JPS 1917
    original: אַל־תִּתְרַע אֶת־בַּעַל אָף וְאֶת־אִישׁ חֵמוֹת לֹא תָבוֹא׃
    hebrewPlain: אל תתרע את בעל אף ואת איש חמות לא תבוא
    kjvRefs:
    - Proverbs 22:24
    kjvOsis:
    - Prov.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.25
    scripture: tanakh
    name: Tanakh Proverbs 22:25
    ref: Proverbs 22:25
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 25
    ordinal: 18309
    text: Lest thou learn his ways, And get a snare to thy soul.
    translation: JPS 1917
    original: פֶּן־תֶּאֱלַף ארחתו [אֹרְחֹתָיו] וְלָקַחְתָּ מוֹקֵשׁ לְנַפְשֶׁךָ׃
    hebrewPlain: פן תאלף ארחתו [ארחתיו] ולקחת מוקש לנפשך
    kjvRefs:
    - Proverbs 22:25
    kjvOsis:
    - Prov.22.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.26
    scripture: tanakh
    name: Tanakh Proverbs 22:26
    ref: Proverbs 22:26
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 26
    ordinal: 18310
    text: Be thou not of them that strike hands, Or of them that are sureties for debts;
    translation: JPS 1917
    original: אַל־תְּהִי בְתֹקְעֵי־כָף בַּעֹרְבִים מַשָּׁאוֹת׃
    hebrewPlain: אל תהי בתקעי כף בערבים משאות
    kjvRefs:
    - Proverbs 22:26
    kjvOsis:
    - Prov.22.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.27
    scripture: tanakh
    name: Tanakh Proverbs 22:27
    ref: Proverbs 22:27
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 27
    ordinal: 18311
    text: If thou hast not wherewith to pay, Why should he take away thy bed from under thee?
    translation: JPS 1917
    original: אִם־אֵין־לְךָ לְשַׁלֵּם לָמָּה יִקַּח מִשְׁכָּבְךָ מִתַּחְתֶּיךָ׃
    hebrewPlain: אם אין לך לשלם למה יקח משכבך מתחתיך
    kjvRefs:
    - Proverbs 22:27
    kjvOsis:
    - Prov.22.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.28
    scripture: tanakh
    name: Tanakh Proverbs 22:28
    ref: Proverbs 22:28
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 28
    ordinal: 18312
    text: Remove not the ancient landmark, Which thy fathers have set.
    translation: JPS 1917
    original: אַל־תַּסֵּג גְּבוּל עוֹלָם אֲשֶׁר עָשׂוּ אֲבוֹתֶיךָ׃
    hebrewPlain: אל תסג גבול עולם אשר עשו אבותיך
    kjvRefs:
    - Proverbs 22:28
    kjvOsis:
    - Prov.22.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.22.29
    scripture: tanakh
    name: Tanakh Proverbs 22:29
    ref: Proverbs 22:29
    book: Prov
    section: ketuvim
    chapter: 22
    verse: 29
    ordinal: 18313
    text: Seest thou a man diligent in his business? he shall stand before kings; He shall not stand before mean men.
    translation: JPS 1917
    original: חָזִיתָ אִישׁ מָהִיר בִּמְלַאכְתּוֹ לִפְנֵי־מְלָכִים יִתְיַצָּב בַּל־יִתְיַצֵּב לִפְנֵי חֲשֻׁכִּים׃
    hebrewPlain: חזית איש מהיר במלאכתו לפני מלכים יתיצב בל יתיצב לפני חשכים
    kjvRefs:
    - Proverbs 22:29
    kjvOsis:
    - Prov.22.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.22
- type: TanakhVerse
  data:
    osis: Prov.23.1
    scripture: tanakh
    name: Tanakh Proverbs 23:1
    ref: Proverbs 23:1
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 1
    ordinal: 18314
    text: When thou sittest to eat with a ruler, consider well him that is before thee;
    translation: JPS 1917
    original: כִּי־תֵשֵׁב לִלְחוֹם אֶת־מוֹשֵׁל בִּין תָּבִין אֶת־אֲשֶׁר לְפָנֶיךָ׃
    hebrewPlain: כי תשב ללחום את מושל בין תבין את אשר לפניך
    kjvRefs:
    - Proverbs 23:1
    kjvOsis:
    - Prov.23.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.2
    scripture: tanakh
    name: Tanakh Proverbs 23:2
    ref: Proverbs 23:2
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 2
    ordinal: 18315
    text: And put a knife to thy throat, if thou be a man given to appetite.
    translation: JPS 1917
    original: וְשַׂמְתָּ שַׂכִּין בְּלֹעֶךָ אִם־בַּעַל נֶפֶשׁ אָתָּה׃
    hebrewPlain: ושמת שכין בלעך אם בעל נפש אתה
    kjvRefs:
    - Proverbs 23:2
    kjvOsis:
    - Prov.23.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.3
    scripture: tanakh
    name: Tanakh Proverbs 23:3
    ref: Proverbs 23:3
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 3
    ordinal: 18316
    text: Be not desirous of his dainties; seeing they are deceitful food.
    translation: JPS 1917
    original: אַל־תִּתְאָו לְמַטְעַמּוֹתָיו וְהוּא לֶחֶם כְּזָבִים׃
    hebrewPlain: אל תתאו למטעמותיו והוא לחם כזבים
    kjvRefs:
    - Proverbs 23:3
    kjvOsis:
    - Prov.23.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.4
    scripture: tanakh
    name: Tanakh Proverbs 23:4
    ref: Proverbs 23:4
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 4
    ordinal: 18317
    text: Weary not thyself to be rich; Cease from thine own wisdom. .
    translation: JPS 1917
    original: אַל־תִּיגַע לְהַעֲשִׁיר מִבִּינָתְךָ חֲדָל׃
    hebrewPlain: אל תיגע להעשיר מבינתך חדל
    kjvRefs:
    - Proverbs 23:4
    kjvOsis:
    - Prov.23.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.5
    scripture: tanakh
    name: Tanakh Proverbs 23:5
    ref: Proverbs 23:5
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 5
    ordinal: 18318
    text: Wilt thou set thine eyes upon it? it is gone; For riches certainly make themselves wings, Like an eagle that flieth toward heaven.
    translation: JPS 1917
    original: התעוף [הֲתָעִיף] עֵינֶיךָ בּוֹ וְאֵינֶנּוּ כִּי עָשֹׂה יַעֲשֶׂה־לּוֹ כְנָפַיִם כְּנֶשֶׁר ועיף [יָעוּף] הַשָּׁמָיִם׃
    hebrewPlain: התעוף [התעיף] עיניך בו ואיננו כי עשה יעשה לו כנפים כנשר ועיף [יעוף] השמים
    kjvRefs:
    - Proverbs 23:5
    kjvOsis:
    - Prov.23.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.6
    scripture: tanakh
    name: Tanakh Proverbs 23:6
    ref: Proverbs 23:6
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 6
    ordinal: 18319
    text: Eat thou not the bread of him that hath an evil eye, Neither desire thou his dainties;
    translation: JPS 1917
    original: אַל־תִּלְחַם אֶת־לֶחֶם רַע עָיִן וְאַל־תתאו [תִּתְאָיו] לְמַטְעַמֹּתָיו׃
    hebrewPlain: אל תלחם את לחם רע עין ואל תתאו [תתאיו] למטעמתיו
    kjvRefs:
    - Proverbs 23:6
    kjvOsis:
    - Prov.23.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.7
    scripture: tanakh
    name: Tanakh Proverbs 23:7
    ref: Proverbs 23:7
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 7
    ordinal: 18320
    text: 'For as one that hath reckoned within himself, so is he: ‘Eat and drink’, saith he to thee; But his heart is not with thee.'
    translation: JPS 1917
    original: כִּי כְּמוֹ־שָׁעַר בְּנַפְשׁוֹ כֶּן־הוּא אֱכֹל וּשְׁתֵה יֹאמַר לָךְ וְלִבּוֹ בַּל־עִמָּךְ׃
    hebrewPlain: כי כמו שער בנפשו כן הוא אכל ושתה יאמר לך ולבו בל עמך
    kjvRefs:
    - Proverbs 23:7
    kjvOsis:
    - Prov.23.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.8
    scripture: tanakh
    name: Tanakh Proverbs 23:8
    ref: Proverbs 23:8
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 8
    ordinal: 18321
    text: The morsel which thou hast eaten shalt thou vomit up, And lose thy sweet words.
    translation: JPS 1917
    original: פִּתְּךָ־אָכַלְתָּ תְקִיאֶנָּה וְשִׁחַתָּ דְּבָרֶיךָ הַנְּעִימִים׃
    hebrewPlain: פתך אכלת תקיאנה ושחת דבריך הנעימים
    kjvRefs:
    - Proverbs 23:8
    kjvOsis:
    - Prov.23.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.9
    scripture: tanakh
    name: Tanakh Proverbs 23:9
    ref: Proverbs 23:9
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 9
    ordinal: 18322
    text: Speak not in the ears of a fool; for he will despise the wisdom of thy words.
    translation: JPS 1917
    original: בְּאָזְנֵי כְסִיל אַל־תְּדַבֵּר כִּי־יָבוּז לְשֵׂכֶל מִלֶּיךָ׃
    hebrewPlain: באזני כסיל אל תדבר כי יבוז לשכל מליך
    kjvRefs:
    - Proverbs 23:9
    kjvOsis:
    - Prov.23.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.10
    scripture: tanakh
    name: Tanakh Proverbs 23:10
    ref: Proverbs 23:10
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 10
    ordinal: 18323
    text: Remove not the ancient landmark; and enter not into the fields of the fatherless;
    translation: JPS 1917
    original: אַל־תַּסֵּג גְּבוּל עוֹלָם וּבִשְׂדֵי יְתוֹמִים אַל־תָּבֹא׃
    hebrewPlain: אל תסג גבול עולם ובשדי יתומים אל תבא
    kjvRefs:
    - Proverbs 23:10
    kjvOsis:
    - Prov.23.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.11
    scripture: tanakh
    name: Tanakh Proverbs 23:11
    ref: Proverbs 23:11
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 11
    ordinal: 18324
    text: For their Redeemer is strong; He will plead their cause with thee.
    translation: JPS 1917
    original: כִּי־גֹאֲלָם חָזָק הוּא־יָרִיב אֶת־רִיבָם אִתָּךְ׃
    hebrewPlain: כי גאלם חזק הוא יריב את ריבם אתך
    kjvRefs:
    - Proverbs 23:11
    kjvOsis:
    - Prov.23.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.12
    scripture: tanakh
    name: Tanakh Proverbs 23:12
    ref: Proverbs 23:12
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 12
    ordinal: 18325
    text: Apply thy heart unto instruction, And thine ears to the words of knowledge.
    translation: JPS 1917
    original: הָבִיאָה לַמּוּסָר לִבֶּךָ וְאָזְנֶךָ לְאִמְרֵי־דָעַת׃
    hebrewPlain: הביאה למוסר לבך ואזנך לאמרי דעת
    kjvRefs:
    - Proverbs 23:12
    kjvOsis:
    - Prov.23.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.13
    scripture: tanakh
    name: Tanakh Proverbs 23:13
    ref: Proverbs 23:13
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 13
    ordinal: 18326
    text: Withhold not correction from the child; For though thou beat him with the rod, he will not die.
    translation: JPS 1917
    original: אַל־תִּמְנַע מִנַּעַר מוּסָר כִּי־תַכֶּנּוּ בַשֵּׁבֶט לֹא יָמוּת׃
    hebrewPlain: אל תמנע מנער מוסר כי תכנו בשבט לא ימות
    kjvRefs:
    - Proverbs 23:13
    kjvOsis:
    - Prov.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.14
    scripture: tanakh
    name: Tanakh Proverbs 23:14
    ref: Proverbs 23:14
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 14
    ordinal: 18327
    text: Thou beatest him with the rod, And wilt deliver his soul from the nether-world.
    translation: JPS 1917
    original: אַתָּה בַּשֵּׁבֶט תַּכֶּנּוּ וְנַפְשׁוֹ מִשְּׁאוֹל תַּצִּיל׃
    hebrewPlain: אתה בשבט תכנו ונפשו משאול תציל
    kjvRefs:
    - Proverbs 23:14
    kjvOsis:
    - Prov.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.15
    scripture: tanakh
    name: Tanakh Proverbs 23:15
    ref: Proverbs 23:15
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 15
    ordinal: 18328
    text: My son, if thy heart be wise, My heart will be glad, even mine;
    translation: JPS 1917
    original: בְּנִי אִם־חָכַם לִבֶּךָ יִשְׂמַח לִבִּי גַם־אָנִי׃
    hebrewPlain: בני אם חכם לבך ישמח לבי גם אני
    kjvRefs:
    - Proverbs 23:15
    kjvOsis:
    - Prov.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.16
    scripture: tanakh
    name: Tanakh Proverbs 23:16
    ref: Proverbs 23:16
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 16
    ordinal: 18329
    text: Yea, my reins will rejoice, When thy lips speak right things.
    translation: JPS 1917
    original: וְתַעְלֹזְנָה כִלְיוֹתָי בְּדַבֵּר שְׂפָתֶיךָ מֵישָׁרִים׃
    hebrewPlain: ותעלזנה כליותי בדבר שפתיך מישרים
    kjvRefs:
    - Proverbs 23:16
    kjvOsis:
    - Prov.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.17
    scripture: tanakh
    name: Tanakh Proverbs 23:17
    ref: Proverbs 23:17
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 17
    ordinal: 18330
    text: Let not thy heart envy sinners, But be in the fear of the LORD all the day;
    translation: JPS 1917
    original: אַל־יְקַנֵּא לִבְּךָ בַּחַטָּאִים כִּי אִם־בְּיִרְאַת־יְהוָה כָּל־הַיּוֹם׃
    hebrewPlain: אל יקנא לבך בחטאים כי אם ביראת יהוה כל היום
    kjvRefs:
    - Proverbs 23:17
    kjvOsis:
    - Prov.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.18
    scripture: tanakh
    name: Tanakh Proverbs 23:18
    ref: Proverbs 23:18
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 18
    ordinal: 18331
    text: For surely there is a future; And thy hope shall not be cut off.
    translation: JPS 1917
    original: כִּי אִם־יֵשׁ אַחֲרִית וְתִקְוָתְךָ לֹא תִכָּרֵת׃
    hebrewPlain: כי אם יש אחרית ותקותך לא תכרת
    kjvRefs:
    - Proverbs 23:18
    kjvOsis:
    - Prov.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.19
    scripture: tanakh
    name: Tanakh Proverbs 23:19
    ref: Proverbs 23:19
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 19
    ordinal: 18332
    text: Hear thou, my son, and be wise, And guide thy heart in the way.
    translation: JPS 1917
    original: שְׁמַע־אַתָּה בְנִי וַחֲכָם וְאַשֵּׁר בַּדֶּרֶךְ לִבֶּךָ׃
    hebrewPlain: שמע אתה בני וחכם ואשר בדרך לבך
    kjvRefs:
    - Proverbs 23:19
    kjvOsis:
    - Prov.23.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.20
    scripture: tanakh
    name: Tanakh Proverbs 23:20
    ref: Proverbs 23:20
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 20
    ordinal: 18333
    text: Be not among winebibbers; Among gluttonous eaters of flesh;
    translation: JPS 1917
    original: אַל־תְּהִי בְסֹבְאֵי־יָיִן בְּזֹלֲלֵי בָשָׂר לָמוֹ׃
    hebrewPlain: אל תהי בסבאי יין בזללי בשר למו
    kjvRefs:
    - Proverbs 23:20
    kjvOsis:
    - Prov.23.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.21
    scripture: tanakh
    name: Tanakh Proverbs 23:21
    ref: Proverbs 23:21
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 21
    ordinal: 18334
    text: For the drunkard and the glutton shall come to poverty; And drowsiness shall clothe a man with rags.
    translation: JPS 1917
    original: כִּי־סֹבֵא וְזוֹלֵל יִוָּרֵשׁ וּקְרָעִים תַּלְבִּישׁ נוּמָה׃
    hebrewPlain: כי סבא וזולל יורש וקרעים תלביש נומה
    kjvRefs:
    - Proverbs 23:21
    kjvOsis:
    - Prov.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.22
    scripture: tanakh
    name: Tanakh Proverbs 23:22
    ref: Proverbs 23:22
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 22
    ordinal: 18335
    text: Hearken unto thy father that begot thee, And despise not thy mother when she is old.
    translation: JPS 1917
    original: שְׁמַע לְאָבִיךָ זֶה יְלָדֶךָ וְאַל־תָּבוּז כִּי־זָקְנָה אִמֶּךָ׃
    hebrewPlain: שמע לאביך זה ילדך ואל תבוז כי זקנה אמך
    kjvRefs:
    - Proverbs 23:22
    kjvOsis:
    - Prov.23.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.23
    scripture: tanakh
    name: Tanakh Proverbs 23:23
    ref: Proverbs 23:23
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 23
    ordinal: 18336
    text: Buy the truth, and sell it not; also wisdom, and instruction, and understanding.
    translation: JPS 1917
    original: אֱמֶת קְנֵה וְאַל־תִּמְכֹּר חָכְמָה וּמוּסָר וּבִינָה׃
    hebrewPlain: אמת קנה ואל תמכר חכמה ומוסר ובינה
    kjvRefs:
    - Proverbs 23:23
    kjvOsis:
    - Prov.23.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.24
    scripture: tanakh
    name: Tanakh Proverbs 23:24
    ref: Proverbs 23:24
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 24
    ordinal: 18337
    text: The father of the righteous will greatly rejoice; and he that begetteth a wise child will have joy of him.
    translation: JPS 1917
    original: גול [גִּיל] יגול [יָגִיל] אֲבִי צַדִּיק יולד [וְיוֹלֵד] חָכָם וישמח־[יִשְׂמַח־] בּוֹ׃
    hebrewPlain: גול [גיל] יגול [יגיל] אבי צדיק יולד [ויולד] חכם וישמח [ישמח ] בו
    kjvRefs:
    - Proverbs 23:24
    kjvOsis:
    - Prov.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.25
    scripture: tanakh
    name: Tanakh Proverbs 23:25
    ref: Proverbs 23:25
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 25
    ordinal: 18338
    text: Let thy father and thy mother be glad, and let her that bore thee rejoice.
    translation: JPS 1917
    original: יִשְׂמַח־אָבִיךָ וְאִמֶּךָ וְתָגֵל יוֹלַדְתֶּךָ׃
    hebrewPlain: ישמח אביך ואמך ותגל יולדתך
    kjvRefs:
    - Proverbs 23:25
    kjvOsis:
    - Prov.23.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.26
    scripture: tanakh
    name: Tanakh Proverbs 23:26
    ref: Proverbs 23:26
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 26
    ordinal: 18339
    text: My son, give me thy heart, and let thine eyes observe my ways. .
    translation: JPS 1917
    original: תְּנָה־בְנִי לִבְּךָ לִי וְעֵינֶיךָ דְּרָכַי תרצנה [תִּצֹּרְנָה׃]
    hebrewPlain: תנה בני לבך לי ועיניך דרכי תרצנה [תצרנה]
    kjvRefs:
    - Proverbs 23:26
    kjvOsis:
    - Prov.23.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.27
    scripture: tanakh
    name: Tanakh Proverbs 23:27
    ref: Proverbs 23:27
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 27
    ordinal: 18340
    text: For a harlot is a deep ditch; and an alien woman is a narrow pit.
    translation: JPS 1917
    original: כִּי־שׁוּחָה עֲמֻקָּה זוֹנָה וּבְאֵר צָרָה נָכְרִיָּה׃
    hebrewPlain: כי שוחה עמקה זונה ובאר צרה נכריה
    kjvRefs:
    - Proverbs 23:27
    kjvOsis:
    - Prov.23.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.28
    scripture: tanakh
    name: Tanakh Proverbs 23:28
    ref: Proverbs 23:28
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 28
    ordinal: 18341
    text: She also lieth in wait as a robber, and increaseth the faithless among men.
    translation: JPS 1917
    original: אַף־הִיא כְּחֶתֶף תֶּאֱרֹב וּבוֹגְדִים בְּאָדָם תּוֹסִף׃
    hebrewPlain: אף היא כחתף תארב ובוגדים באדם תוסף
    kjvRefs:
    - Proverbs 23:28
    kjvOsis:
    - Prov.23.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.29
    scripture: tanakh
    name: Tanakh Proverbs 23:29
    ref: Proverbs 23:29
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 29
    ordinal: 18342
    text: 'Who crieth: ‘Woe’? who: ‘Alas’? Who hath contentions? who hath raving? Who hath wounds without cause? Who hath redness of eyes?'
    translation: JPS 1917
    original: לְמִי אוֹי לְמִי אֲבוֹי לְמִי מדונים [מִדְיָנִים ] לְמִי שִׂיחַ לְמִי פְּצָעִים חִנָּם לְמִי חַכְלִלוּת עֵינָיִם׃
    hebrewPlain: למי אוי למי אבוי למי מדונים [מדינים ] למי שיח למי פצעים חנם למי חכללות עינים
    kjvRefs:
    - Proverbs 23:29
    kjvOsis:
    - Prov.23.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.30
    scripture: tanakh
    name: Tanakh Proverbs 23:30
    ref: Proverbs 23:30
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 30
    ordinal: 18343
    text: They that tarry long at the wine; They that go to try mixed wine.
    translation: JPS 1917
    original: לַמְאַחֲרִים עַל־הַיָּיִן לַבָּאִים לַחְקֹר מִמְסָךְ׃
    hebrewPlain: למאחרים על היין לבאים לחקר ממסך
    kjvRefs:
    - Proverbs 23:30
    kjvOsis:
    - Prov.23.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.31
    scripture: tanakh
    name: Tanakh Proverbs 23:31
    ref: Proverbs 23:31
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 31
    ordinal: 18344
    text: Look not thou upon the wine when it is red, when it giveth its colour in the cup, When it glideth down smoothly;
    translation: JPS 1917
    original: אַל־תֵּרֶא יַיִן כִּי יִתְאַדָּם כִּי־יִתֵּן בכיס [בַּכּוֹס] עֵינוֹ יִתְהַלֵּךְ בְּמֵישָׁרִים׃
    hebrewPlain: אל תרא יין כי יתאדם כי יתן בכיס [בכוס] עינו יתהלך במישרים
    kjvRefs:
    - Proverbs 23:31
    kjvOsis:
    - Prov.23.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.32
    scripture: tanakh
    name: Tanakh Proverbs 23:32
    ref: Proverbs 23:32
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 32
    ordinal: 18345
    text: At the last it biteth like a serpent, and stingeth like a basilisk.
    translation: JPS 1917
    original: אַחֲרִיתוֹ כְּנָחָשׁ יִשָּׁךְ וּכְצִפְעֹנִי יַפְרִשׁ׃
    hebrewPlain: אחריתו כנחש ישך וכצפעני יפרש
    kjvRefs:
    - Proverbs 23:32
    kjvOsis:
    - Prov.23.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.33
    scripture: tanakh
    name: Tanakh Proverbs 23:33
    ref: Proverbs 23:33
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 33
    ordinal: 18346
    text: Thine eyes shall behold strange things, and thy heart shall utter confused things.
    translation: JPS 1917
    original: עֵינֶיךָ יִרְאוּ זָרוֹת וְלִבְּךָ יְדַבֵּר תַּהְפֻּכוֹת׃
    hebrewPlain: עיניך יראו זרות ולבך ידבר תהפכות
    kjvRefs:
    - Proverbs 23:33
    kjvOsis:
    - Prov.23.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.34
    scripture: tanakh
    name: Tanakh Proverbs 23:34
    ref: Proverbs 23:34
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 34
    ordinal: 18347
    text: Yea, thou shalt be as he that lieth down in the midst of the sea, or as he that lieth upon the top of a mast.
    translation: JPS 1917
    original: וְהָיִיתָ כְּשֹׁכֵב בְּלֶב־יָם וּכְשֹׁכֵב בְּרֹאשׁ חִבֵּל׃
    hebrewPlain: והיית כשכב בלב ים וכשכב בראש חבל
    kjvRefs:
    - Proverbs 23:34
    kjvOsis:
    - Prov.23.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.23.35
    scripture: tanakh
    name: Tanakh Proverbs 23:35
    ref: Proverbs 23:35
    book: Prov
    section: ketuvim
    chapter: 23
    verse: 35
    ordinal: 18348
    text: ’They have struck me, and I felt it not, they have beaten me, and I knew it not; when shall I awake? I will seek it yet again.’
    translation: JPS 1917
    original: הִכּוּנִי בַל־חָלִיתִי הֲלָמוּנִי בַּל־יָדָעְתִּי מָתַי אָקִיץ אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד׃
    hebrewPlain: הכוני בל חליתי הלמוני בל ידעתי מתי אקיץ אוסיף אבקשנו עוד
    kjvRefs:
    - Proverbs 23:35
    kjvOsis:
    - Prov.23.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.23
- type: TanakhVerse
  data:
    osis: Prov.24.1
    scripture: tanakh
    name: Tanakh Proverbs 24:1
    ref: Proverbs 24:1
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 1
    ordinal: 18349
    text: Be not thou envious of evil men, Neither desire to be with them.
    translation: JPS 1917
    original: אַל־תְּקַנֵּא בְּאַנְשֵׁי רָעָה וְאַל־תתאו [תִּתְאָיו] לִהְיוֹת אִתָּם׃
    hebrewPlain: אל תקנא באנשי רעה ואל תתאו [תתאיו] להיות אתם
    kjvRefs:
    - Proverbs 24:1
    kjvOsis:
    - Prov.24.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.2
    scripture: tanakh
    name: Tanakh Proverbs 24:2
    ref: Proverbs 24:2
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 2
    ordinal: 18350
    text: For their heart studieth destruction, And their lips talk of mischief.
    translation: JPS 1917
    original: כִּי־שֹׁד יֶהְגֶּה לִבָּם וְעָמָל שִׂפְתֵיהֶם תְּדַבֵּרְנָה׃
    hebrewPlain: כי שד יהגה לבם ועמל שפתיהם תדברנה
    kjvRefs:
    - Proverbs 24:2
    kjvOsis:
    - Prov.24.2
  relations:
