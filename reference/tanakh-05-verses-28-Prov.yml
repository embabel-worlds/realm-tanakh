    ref: Proverbs 1:4
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 17673
    text: To give prudence to the simple, To the young man knowledge and discretion;
    translation: JPS 1917
    original: לָתֵת לִפְתָאיִם עָרְמָה לְנַעַר דַּעַת וּמְזִמָּה׃
    hebrewPlain: לתת לפתאים ערמה לנער דעת ומזמה
