    scripture: tanakh
    name: Tanakh Proverbs 1:6
    ref: Proverbs 1:6
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 17675
    text: To understand a proverb, and a figure; The words of the wise, and their dark sayings.
    translation: JPS 1917
    original: לְהָבִין מָשָׁל וּמְלִיצָה דִּבְרֵי חֲכָמִים וְחִידֹתָם׃
    hebrewPlain: להבין משל ומליצה דברי חכמים וחידתם
