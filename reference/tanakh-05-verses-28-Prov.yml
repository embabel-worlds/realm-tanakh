    ref: Proverbs 31:19
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 19
    ordinal: 18572
    text: She layeth her hands to the distaff, And her hands hold the spindle.
    translation: JPS 1917
    original: יָדֶיהָ שִׁלְּחָה בַכִּישׁוֹר וְכַפֶּיהָ תָּמְכוּ פָלֶךְ׃
    hebrewPlain: ידיה שלחה בכישור וכפיה תמכו פלך
