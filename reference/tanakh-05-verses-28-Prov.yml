    scripture: tanakh
    name: Tanakh Proverbs 31:28
    ref: Proverbs 31:28
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 28
    ordinal: 18581
    text: 'Her children rise up, and call her blessed; Her husband also, and he praiseth her:'
    translation: JPS 1917
    original: קָמוּ בָנֶיהָ וַיְאַשְּׁרוּהָ בַּעְלָהּ וַיְהַלְלָהּ׃
    hebrewPlain: קמו בניה ויאשרוה בעלה ויהללה
    kjvRefs:
