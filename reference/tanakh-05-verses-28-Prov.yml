  data:
    osis: Prov.26.27
    scripture: tanakh
    name: Tanakh Proverbs 26:27
    ref: Proverbs 26:27
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 27
    ordinal: 18437
    text: Whoso diggeth a pit shall fall therein; And he that rolleth a stone, it shall return upon him.
    translation: JPS 1917
    original: כֹּרֶה־שַּׁחַת בָּהּ יִפֹּל וְגֹלֵל אֶבֶן אֵלָיו תָּשׁוּב׃
    hebrewPlain: כרה שחת בה יפל וגלל אבן אליו תשוב
    kjvRefs:
    - Proverbs 26:27
    kjvOsis:
    - Prov.26.27
