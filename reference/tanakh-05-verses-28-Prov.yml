- type: TanakhVerse
  data:
    osis: Prov.1.7
    scripture: tanakh
    name: Tanakh Proverbs 1:7
    ref: Proverbs 1:7
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 17676
    text: The fear of the LORD is the beginning of knowledge; But the foolish despise wisdom and discipline.
    translation: JPS 1917
    original: יִרְאַת יְהוָה רֵאשִׁית דָּעַת חָכְמָה וּמוּסָר אֱוִילִים בָּזוּ׃
    hebrewPlain: יראת יהוה ראשית דעת חכמה ומוסר אוילים בזו
    kjvRefs:
    - Proverbs 1:7
    kjvOsis:
    - Prov.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.8
    scripture: tanakh
    name: Tanakh Proverbs 1:8
    ref: Proverbs 1:8
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 17677
    text: Hear, my son, the instruction of thy father, And forsake not the teaching of thy mother;
    translation: JPS 1917
    original: שְׁמַע בְּנִי מוּסַר אָבִיךָ וְאַל־תִּטֹּשׁ תּוֹרַת אִמֶּךָ׃
    hebrewPlain: שמע בני מוסר אביך ואל תטש תורת אמך
    kjvRefs:
    - Proverbs 1:8
    kjvOsis:
    - Prov.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.9
    scripture: tanakh
    name: Tanakh Proverbs 1:9
    ref: Proverbs 1:9
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 17678
    text: For they shall be a chaplet of grace unto thy head, And chains about thy neck.
    translation: JPS 1917
    original: כִּי לִוְיַת חֵן הֵם לְרֹאשֶׁךָ וַעֲנָקִים לְגַרְגְּרֹתֶיךָ׃
    hebrewPlain: כי לוית חן הם לראשך וענקים לגרגרתיך
    kjvRefs:
    - Proverbs 1:9
    kjvOsis:
    - Prov.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.10
    scripture: tanakh
    name: Tanakh Proverbs 1:10
    ref: Proverbs 1:10
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 17679
    text: My son, if sinners entice thee, Consent thou not.
    translation: JPS 1917
    original: בְּנִי אִם־יְפַתּוּךָ חַטָּאִים אַל־תֹּבֵא׃
    hebrewPlain: בני אם יפתוך חטאים אל תבא
    kjvRefs:
    - Proverbs 1:10
    kjvOsis:
    - Prov.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.11
    scripture: tanakh
    name: Tanakh Proverbs 1:11
    ref: Proverbs 1:11
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 17680
    text: 'If they say: ‘Come with us, Let us lie in wait for blood, Let us lurk for the innocent without cause;'
    translation: JPS 1917
    original: אִם־יֹאמְרוּ לְכָה אִתָּנוּ נֶאֶרְבָה לְדָם נִצְפְּנָה לְנָקִי חִנָּם׃
    hebrewPlain: אם יאמרו לכה אתנו נארבה לדם נצפנה לנקי חנם
    kjvRefs:
    - Proverbs 1:11
    kjvOsis:
    - Prov.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.12
    scripture: tanakh
    name: Tanakh Proverbs 1:12
    ref: Proverbs 1:12
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 17681
    text: Let us swallow them up alive as the grave, and whole, as those that go down into the pit;
    translation: JPS 1917
    original: נִבְלָעֵם כִּשְׁאוֹל חַיִּים וּתְמִימִים כְּיוֹרְדֵי בוֹר׃
    hebrewPlain: נבלעם כשאול חיים ותמימים כיורדי בור
    kjvRefs:
    - Proverbs 1:12
    kjvOsis:
    - Prov.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.13
    scripture: tanakh
    name: Tanakh Proverbs 1:13
    ref: Proverbs 1:13
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 17682
    text: We shall find all precious substance, We shall fill our houses with spoil;
    translation: JPS 1917
    original: כָּל־הוֹן יָקָר נִמְצָא נְמַלֵּא בָתֵּינוּ שָׁלָל׃
    hebrewPlain: כל הון יקר נמצא נמלא בתינו שלל
    kjvRefs:
    - Proverbs 1:13
    kjvOsis:
    - Prov.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.14
    scripture: tanakh
    name: Tanakh Proverbs 1:14
    ref: Proverbs 1:14
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 17683
    text: Cast in thy lot among us; Let us all have one purse’—
    translation: JPS 1917
    original: גּוֹרָלְךָ תַּפִּיל בְּתוֹכֵנוּ כִּיס אֶחָד יִהְיֶה לְכֻלָּנוּ׃
    hebrewPlain: גורלך תפיל בתוכנו כיס אחד יהיה לכלנו
    kjvRefs:
    - Proverbs 1:14
    kjvOsis:
    - Prov.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.15
    scripture: tanakh
    name: Tanakh Proverbs 1:15
    ref: Proverbs 1:15
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 17684
    text: My son, walk not thou in the way with them, restrain thy foot from their path;
    translation: JPS 1917
    original: בְּנִי אַל־תֵּלֵךְ בְּדֶרֶךְ אִתָּם מְנַע רַגְלְךָ מִנְּתִיבָתָם׃
    hebrewPlain: בני אל תלך בדרך אתם מנע רגלך מנתיבתם
    kjvRefs:
    - Proverbs 1:15
    kjvOsis:
    - Prov.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.16
    scripture: tanakh
    name: Tanakh Proverbs 1:16
    ref: Proverbs 1:16
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 17685
    text: For their feet run to evil, and they make haste to shed blood.
    translation: JPS 1917
    original: כִּי רַגְלֵיהֶם לָרַע יָרוּצוּ וִימַהֲרוּ לִשְׁפָּךְ־דָּם׃
    hebrewPlain: כי רגליהם לרע ירוצו וימהרו לשפך דם
    kjvRefs:
    - Proverbs 1:16
    kjvOsis:
    - Prov.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.17
    scripture: tanakh
    name: Tanakh Proverbs 1:17
    ref: Proverbs 1:17
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 17686
    text: For in vain the net is spread in the eyes of any bird;
    translation: JPS 1917
    original: כִּי־חִנָּם מְזֹרָה הָרָשֶׁת בְּעֵינֵי כָל־בַּעַל כָּנָף׃
    hebrewPlain: כי חנם מזרה הרשת בעיני כל בעל כנף
    kjvRefs:
    - Proverbs 1:17
    kjvOsis:
    - Prov.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.18
    scripture: tanakh
    name: Tanakh Proverbs 1:18
    ref: Proverbs 1:18
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 17687
    text: And these lie in wait for their own blood, they lurk for their own lives.
    translation: JPS 1917
    original: וְהֵם לְדָמָם יֶאֱרֹבוּ יִצְפְּנוּ לְנַפְשֹׁתָם׃
    hebrewPlain: והם לדמם יארבו יצפנו לנפשתם
    kjvRefs:
    - Proverbs 1:18
    kjvOsis:
    - Prov.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.19
    scripture: tanakh
    name: Tanakh Proverbs 1:19
    ref: Proverbs 1:19
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 19
    ordinal: 17688
    text: So are the ways of every one that is greedy of gain; it taketh away the life of the owners thereof.
    translation: JPS 1917
    original: כֵּן אָרְחוֹת כָּל־בֹּצֵעַ בָּצַע אֶת־נֶפֶשׁ בְּעָלָיו יִקָּח׃
    hebrewPlain: כן ארחות כל בצע בצע את נפש בעליו יקח
    kjvRefs:
    - Proverbs 1:19
    kjvOsis:
    - Prov.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.20
    scripture: tanakh
    name: Tanakh Proverbs 1:20
    ref: Proverbs 1:20
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 17689
    text: Wisdom crieth aloud in the streets, she uttereth her voice in the broad places;
    translation: JPS 1917
    original: חָכְמוֹת בַּחוּץ תָּרֹנָּה בָּרְחֹבוֹת תִּתֵּן קוֹלָהּ׃
    hebrewPlain: חכמות בחוץ תרנה ברחבות תתן קולה
    kjvRefs:
    - Proverbs 1:20
    kjvOsis:
    - Prov.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.21
    scripture: tanakh
    name: Tanakh Proverbs 1:21
    ref: Proverbs 1:21
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 17690
    text: 'She calleth at the head of the noisy streets, at the entrances of the gates, in the city, she uttereth her words:'
    translation: JPS 1917
    original: בְּרֹאשׁ הֹמִיּוֹת תִּקְרָא בְּפִתְחֵי שְׁעָרִים בָּעִיר אֲמָרֶיהָ תֹאמֵר׃
    hebrewPlain: בראש המיות תקרא בפתחי שערים בעיר אמריה תאמר
    kjvRefs:
    - Proverbs 1:21
    kjvOsis:
    - Prov.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.22
    scripture: tanakh
    name: Tanakh Proverbs 1:22
    ref: Proverbs 1:22
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 22
    ordinal: 17691
    text: ’How long, ye thoughtless, will ye love thoughtlessness? And how long will scorners delight them in scorning, And fools hate knowledge?
    translation: JPS 1917
    original: עַד־מָתַי פְּתָיִם תְּאֵהֲבוּ פֶתִי וְלֵצִים לָצוֹן חָמְדוּ לָהֶם וּכְסִילִים יִשְׂנְאוּ־דָעַת׃
    hebrewPlain: עד מתי פתים תאהבו פתי ולצים לצון חמדו להם וכסילים ישנאו דעת
    kjvRefs:
    - Proverbs 1:22
    kjvOsis:
    - Prov.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.23
    scripture: tanakh
    name: Tanakh Proverbs 1:23
    ref: Proverbs 1:23
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 23
    ordinal: 17692
    text: Turn you at my reproof; behold, I will pour out my spirit unto you, I will make known my words unto you.
    translation: JPS 1917
    original: תָּשׁוּבוּ לְתוֹכַחְתִּי הִנֵּה אַבִּיעָה לָכֶם רוּחִי אוֹדִיעָה דְבָרַי אֶתְכֶם׃
    hebrewPlain: תשובו לתוכחתי הנה אביעה לכם רוחי אודיעה דברי אתכם
    kjvRefs:
    - Proverbs 1:23
    kjvOsis:
    - Prov.1.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.24
    scripture: tanakh
    name: Tanakh Proverbs 1:24
    ref: Proverbs 1:24
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 24
    ordinal: 17693
    text: Because I have called, and ye refused, I have stretched out my hand, and no man attended,
    translation: JPS 1917
    original: יַעַן קָרָאתִי וַתְּמָאֵנוּ נָטִיתִי יָדִי וְאֵין מַקְשִׁיב׃
    hebrewPlain: יען קראתי ותמאנו נטיתי ידי ואין מקשיב
    kjvRefs:
    - Proverbs 1:24
    kjvOsis:
    - Prov.1.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
- type: TanakhVerse
  data:
    osis: Prov.1.25
    scripture: tanakh
    name: Tanakh Proverbs 1:25
    ref: Proverbs 1:25
    book: Prov
    section: ketuvim
    chapter: 1
    verse: 25
    ordinal: 17694
    text: But ye have set at nought all my counsel, and would none of my reproof;
    translation: JPS 1917
    original: וַתִּפְרְעוּ כָל־עֲצָתִי וְתוֹכַחְתִּי לֹא אֲבִיתֶם׃
    hebrewPlain: ותפרעו כל עצתי ותוכחתי לא אביתם
    kjvRefs:
    - Proverbs 1:25
    kjvOsis:
    - Prov.1.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.1
