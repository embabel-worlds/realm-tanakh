  data:
    osis: Prov.27.1
    scripture: tanakh
    name: Tanakh Proverbs 27:1
    ref: Proverbs 27:1
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 1
    ordinal: 18439
    text: Boast not thyself of to- morrow; For thou knowest not what a day may bring forth.
    translation: JPS 1917
    original: אַל־תִּתְהַלֵּל בְּיוֹם מָחָר כִּי לֹא־תֵדַע מַה־יֵּלֶד יוֹם׃
    hebrewPlain: אל תתהלל ביום מחר כי לא תדע מה ילד יום
    kjvRefs:
    - Proverbs 27:1
    kjvOsis:
    - Prov.27.1
  relations:
