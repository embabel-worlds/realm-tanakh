- type: TanakhVerse
  data:
    osis: Prov.16.19
    scripture: tanakh
    name: Tanakh Proverbs 16:19
    ref: Proverbs 16:19
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 19
    ordinal: 18128
    text: Better it is to be of a lowly spirit with the humble, Than to divide the spoil with the proud.
    translation: JPS 1917
    original: טוֹב שְׁפַל־רוּחַ אֶת־עניים [עֲנָוִים] מֵחַלֵּק שָׁלָל אֶת־גֵּאִים׃
    hebrewPlain: טוב שפל רוח את עניים [ענוים] מחלק שלל את גאים
    kjvRefs:
    - Proverbs 16:19
    kjvOsis:
    - Prov.16.19
