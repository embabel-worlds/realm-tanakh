    name: Tanakh Proverbs 16:24
    ref: Proverbs 16:24
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 24
    ordinal: 18133
    text: Pleasant words are as a honeycomb, Sweet to the soul, and health to the bones.
    translation: JPS 1917
    original: צוּף־דְּבַשׁ אִמְרֵי־נֹעַם מָתוֹק לַנֶּפֶשׁ וּמַרְפֵּא לָעָצֶם׃
    hebrewPlain: צוף דבש אמרי נעם מתוק לנפש ומרפא לעצם
    kjvRefs:
    - Proverbs 16:24
    kjvOsis:
    - Prov.16.24
