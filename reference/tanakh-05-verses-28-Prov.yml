    name: Tanakh Proverbs 13:4
    ref: Proverbs 13:4
    book: Prov
    section: ketuvim
    chapter: 13
    verse: 4
    ordinal: 18020
    text: The soul of the sluggard desireth, and hath nothing; But the soul of the diligent shall be abundantly gratified.
    translation: JPS 1917
    original: מִתְאַוָּה וָאַיִן נַפְשׁוֹ עָצֵל וְנֶפֶשׁ חָרֻצִים תְּדֻשָּׁן׃
