    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.2
    scripture: tanakh
    name: Tanakh Proverbs 27:2
    ref: Proverbs 27:2
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 2
    ordinal: 18440
    text: Let another man praise thee, and not thine own mouth; A stranger, and not thine own lips.
    translation: JPS 1917
    original: יְהַלֶּלְךָ זָר וְלֹא־פִיךָ נָכְרִי וְאַל־שְׂפָתֶיךָ׃
    hebrewPlain: יהללך זר ולא פיך נכרי ואל שפתיך
    kjvRefs:
    - Proverbs 27:2
    kjvOsis:
    - Prov.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.3
    scripture: tanakh
    name: Tanakh Proverbs 27:3
    ref: Proverbs 27:3
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 3
    ordinal: 18441
    text: A stone is heavy, and the sand weighty; But a fool’s vexation is heavier than they both.
    translation: JPS 1917
    original: כֹּבֶד־אֶבֶן וְנֵטֶל הַחוֹל וְכַעַס אֱוִיל כָּבֵד מִשְּׁנֵיהֶם׃
    hebrewPlain: כבד אבן ונטל החול וכעס אויל כבד משניהם
    kjvRefs:
    - Proverbs 27:3
    kjvOsis:
    - Prov.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.4
    scripture: tanakh
    name: Tanakh Proverbs 27:4
    ref: Proverbs 27:4
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 4
    ordinal: 18442
    text: Wrath is cruel, and anger is overwhelming; But who is able to stand before jealousy?
    translation: JPS 1917
    original: אַכְזְרִיּוּת חֵמָה וְשֶׁטֶף אָף וּמִי יַעֲמֹד לִפְנֵי קִנְאָה׃
    hebrewPlain: אכזריות חמה ושטף אף ומי יעמד לפני קנאה
    kjvRefs:
    - Proverbs 27:4
    kjvOsis:
    - Prov.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.5
    scripture: tanakh
    name: Tanakh Proverbs 27:5
    ref: Proverbs 27:5
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 5
    ordinal: 18443
    text: Better is open rebuke Than love that is hidden.
    translation: JPS 1917
    original: טוֹבָה תּוֹכַחַת מְגֻלָּה מֵאַהֲבָה מְסֻתָּרֶת׃
    hebrewPlain: טובה תוכחת מגלה מאהבה מסתרת
    kjvRefs:
    - Proverbs 27:5
    kjvOsis:
    - Prov.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.6
    scripture: tanakh
    name: Tanakh Proverbs 27:6
    ref: Proverbs 27:6
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 6
    ordinal: 18444
    text: Faithful are the wounds of a friend; But the kisses of an enemy are importunate.
    translation: JPS 1917
    original: נֶאֱמָנִים פִּצְעֵי אוֹהֵב וְנַעְתָּרוֹת נְשִׁיקוֹת שׂוֹנֵא׃
    hebrewPlain: נאמנים פצעי אוהב ונעתרות נשיקות שונא
    kjvRefs:
    - Proverbs 27:6
    kjvOsis:
    - Prov.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.7
    scripture: tanakh
    name: Tanakh Proverbs 27:7
    ref: Proverbs 27:7
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 7
    ordinal: 18445
    text: The full soul loatheth a honeycomb; But to the hungry soul every bitter thing is sweet.
    translation: JPS 1917
    original: נֶפֶשׁ שְׂבֵעָה תָּבוּס נֹפֶת וְנֶפֶשׁ רְעֵבָה כָּל־מַר מָתוֹק׃
    hebrewPlain: נפש שבעה תבוס נפת ונפש רעבה כל מר מתוק
    kjvRefs:
    - Proverbs 27:7
    kjvOsis:
    - Prov.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.8
    scripture: tanakh
    name: Tanakh Proverbs 27:8
    ref: Proverbs 27:8
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 8
    ordinal: 18446
    text: As a bird that wandereth from her nest, So is a man that wandereth from his place.
    translation: JPS 1917
    original: כְּצִפּוֹר נוֹדֶדֶת מִן־קִנָּהּ כֵּן־אִישׁ נוֹדֵד מִמְּקוֹמוֹ׃
    hebrewPlain: כצפור נודדת מן קנה כן איש נודד ממקומו
    kjvRefs:
    - Proverbs 27:8
    kjvOsis:
    - Prov.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.9
    scripture: tanakh
    name: Tanakh Proverbs 27:9
    ref: Proverbs 27:9
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 9
    ordinal: 18447
    text: Ointment and perfume rejoice the heart; So doth the sweetness of a man’s friend by hearty counsel.
    translation: JPS 1917
    original: שֶׁמֶן וּקְטֹרֶת יְשַׂמַּח־לֵב וּמֶתֶק רֵעֵהוּ מֵעֲצַת־נָפֶשׁ׃
    hebrewPlain: שמן וקטרת ישמח לב ומתק רעהו מעצת נפש
    kjvRefs:
    - Proverbs 27:9
    kjvOsis:
    - Prov.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.10
    scripture: tanakh
    name: Tanakh Proverbs 27:10
    ref: Proverbs 27:10
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 10
    ordinal: 18448
    text: Thine own friend, and thy father’s friend, forsake not; Neither go into thy brother’s house in the day of thy calamity; Better is a neighbour that is near than a brother far off.
    translation: JPS 1917
    original: רֵעֲךָ ורעה [וְרֵעַ] אָבִיךָ אַל־תַּעֲזֹב וּבֵית אָחִיךָ אַל־תָּבוֹא בְּיוֹם אֵידֶךָ טוֹב שָׁכֵן קָרוֹב מֵאָח רָחוֹק׃
    hebrewPlain: רעך ורעה [ורע] אביך אל תעזב ובית אחיך אל תבוא ביום אידך טוב שכן קרוב מאח רחוק
    kjvRefs:
    - Proverbs 27:10
    kjvOsis:
    - Prov.27.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.11
    scripture: tanakh
    name: Tanakh Proverbs 27:11
    ref: Proverbs 27:11
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 11
    ordinal: 18449
    text: My son, be wise, and make my heart glad, That I may answer him that taunteth me.
    translation: JPS 1917
    original: חֲכַם בְּנִי וְשַׂמַּח לִבִּי וְאָשִׁיבָה חֹרְפִי דָבָר׃
    hebrewPlain: חכם בני ושמח לבי ואשיבה חרפי דבר
    kjvRefs:
    - Proverbs 27:11
    kjvOsis:
    - Prov.27.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.12
    scripture: tanakh
    name: Tanakh Proverbs 27:12
    ref: Proverbs 27:12
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 12
    ordinal: 18450
    text: A prudent man seeth the evil, and hideth himself; But the thoughtless pass on, and are punished.
    translation: JPS 1917
    original: עָרוּם רָאָה רָעָה נִסְתָּר פְּתָאיִם עָבְרוּ נֶעֱנָשׁוּ׃
    hebrewPlain: ערום ראה רעה נסתר פתאים עברו נענשו
    kjvRefs:
    - Proverbs 27:12
    kjvOsis:
    - Prov.27.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.13
    scripture: tanakh
    name: Tanakh Proverbs 27:13
    ref: Proverbs 27:13
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 13
    ordinal: 18451
    text: Take his garment that is surety for a stranger; And hold him in pledge that is surety for an alien woman.
    translation: JPS 1917
    original: קַח־בִּגְדוֹ כִּי־עָרַב זָר וּבְעַד נָכְרִיָּה חַבְלֵהוּ׃
    hebrewPlain: קח בגדו כי ערב זר ובעד נכריה חבלהו
    kjvRefs:
    - Proverbs 27:13
    kjvOsis:
    - Prov.27.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.14
    scripture: tanakh
    name: Tanakh Proverbs 27:14
    ref: Proverbs 27:14
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 14
    ordinal: 18452
    text: He that blesseth his friend with a loud voice, rising early in the morning, It shall be counted a curse to him.
    translation: JPS 1917
    original: מְבָרֵךְ רֵעֵהוּ בְּקוֹל גָּדוֹל בַּבֹּקֶר הַשְׁכֵּים קְלָלָה תֵּחָשֶׁב לוֹ׃
    hebrewPlain: מברך רעהו בקול גדול בבקר השכים קללה תחשב לו
    kjvRefs:
    - Proverbs 27:14
    kjvOsis:
    - Prov.27.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.15
    scripture: tanakh
    name: Tanakh Proverbs 27:15
    ref: Proverbs 27:15
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 15
    ordinal: 18453
    text: A continual dropping in a very rainy day And a contentious woman are alike;
    translation: JPS 1917
    original: דֶּלֶף טוֹרֵד בְּיוֹם סַגְרִיר וְאֵשֶׁת מדונים [מִדְיָנִים] נִשְׁתָּוָה׃
    hebrewPlain: דלף טורד ביום סגריר ואשת מדונים [מדינים] נשתוה
    kjvRefs:
    - Proverbs 27:15
    kjvOsis:
    - Prov.27.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.16
    scripture: tanakh
    name: Tanakh Proverbs 27:16
    ref: Proverbs 27:16
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 16
    ordinal: 18454
    text: He that would hide her hideth the wind, And the ointment of his right hand betrayeth itself.
    translation: JPS 1917
    original: צֹפְנֶיהָ צָפַן־רוּחַ וְשֶׁמֶן יְמִינוֹ יִקְרָא׃
    hebrewPlain: צפניה צפן רוח ושמן ימינו יקרא
    kjvRefs:
    - Proverbs 27:16
    kjvOsis:
    - Prov.27.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.17
    scripture: tanakh
    name: Tanakh Proverbs 27:17
    ref: Proverbs 27:17
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 17
    ordinal: 18455
    text: Iron sharpeneth iron; So a man sharpeneth the countenance of his friend.
    translation: JPS 1917
    original: בַּרְזֶל בְּבַרְזֶל יָחַד וְאִישׁ יַחַד פְּנֵי־רֵעֵהוּ׃
    hebrewPlain: ברזל בברזל יחד ואיש יחד פני רעהו
    kjvRefs:
    - Proverbs 27:17
    kjvOsis:
    - Prov.27.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.18
    scripture: tanakh
    name: Tanakh Proverbs 27:18
    ref: Proverbs 27:18
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 18
    ordinal: 18456
    text: Whoso keepeth the fig-tree shall eat the fruit thereof; And he that waiteth on his master shall be honoured.
    translation: JPS 1917
    original: נֹצֵר תְּאֵנָה יֹאכַל פִּרְיָהּ וְשֹׁמֵר אֲדֹנָיו יְכֻבָּד׃
    hebrewPlain: נצר תאנה יאכל פריה ושמר אדניו יכבד
    kjvRefs:
    - Proverbs 27:18
    kjvOsis:
    - Prov.27.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.19
    scripture: tanakh
    name: Tanakh Proverbs 27:19
    ref: Proverbs 27:19
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 19
    ordinal: 18457
    text: As in water face answereth to face, So the heart of man to man.
    translation: JPS 1917
    original: כַּמַּיִם הַפָּנִים לַפָּנִים כֵּן לֵב־הָאָדָם לָאָדָם׃
    hebrewPlain: כמים הפנים לפנים כן לב האדם לאדם
    kjvRefs:
    - Proverbs 27:19
    kjvOsis:
    - Prov.27.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.20
    scripture: tanakh
    name: Tanakh Proverbs 27:20
    ref: Proverbs 27:20
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 20
    ordinal: 18458
    text: The nether-world and Destruction are never satiated; So the eyes of man are never satiated.
    translation: JPS 1917
    original: שְׁאוֹל ואבדה [וַאֲבַדּוֹ] לֹא תִשְׂבַּעְנָה וְעֵינֵי הָאָדָם לֹא תִשְׂבַּעְנָה׃
    hebrewPlain: שאול ואבדה [ואבדו] לא תשבענה ועיני האדם לא תשבענה
    kjvRefs:
    - Proverbs 27:20
    kjvOsis:
    - Prov.27.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.21
    scripture: tanakh
    name: Tanakh Proverbs 27:21
    ref: Proverbs 27:21
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 21
    ordinal: 18459
    text: The refining pot is for silver, and the furnace for gold, And a man is tried by his praise.
    translation: JPS 1917
    original: מַצְרֵף לַכֶּסֶף וְכוּר לַזָּהָב וְאִישׁ לְפִי מַהֲלָלוֹ׃
    hebrewPlain: מצרף לכסף וכור לזהב ואיש לפי מהללו
    kjvRefs:
    - Proverbs 27:21
    kjvOsis:
    - Prov.27.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.22
    scripture: tanakh
    name: Tanakh Proverbs 27:22
    ref: Proverbs 27:22
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 22
    ordinal: 18460
    text: Though thou shouldest bray a fool in a mortar with a pestle among groats, Yet will not his foolishness depart from him.
    translation: JPS 1917
    original: אִם תִּכְתּוֹשׁ־אֶת־הָאֱוִיל בַּמַּכְתֵּשׁ בְּתוֹךְ הָרִיפוֹת בַּעֱלִי לֹא־תָסוּר מֵעָלָיו אִוַּלְתּוֹ׃
    hebrewPlain: אם תכתוש את האויל במכתש בתוך הריפות בעלי לא תסור מעליו אולתו
    kjvRefs:
    - Proverbs 27:22
    kjvOsis:
    - Prov.27.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.23
    scripture: tanakh
    name: Tanakh Proverbs 27:23
    ref: Proverbs 27:23
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 23
    ordinal: 18461
    text: Be thou diligent to know the state of thy flocks, And look well to thy herds;
    translation: JPS 1917
    original: יָדֹעַ תֵּדַע פְּנֵי צֹאנֶךָ שִׁית לִבְּךָ לַעֲדָרִים׃
    hebrewPlain: ידע תדע פני צאנך שית לבך לעדרים
    kjvRefs:
    - Proverbs 27:23
    kjvOsis:
    - Prov.27.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.24
    scripture: tanakh
    name: Tanakh Proverbs 27:24
    ref: Proverbs 27:24
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 24
    ordinal: 18462
    text: For riches are not for ever; And doth the crown endure unto all generations?
    translation: JPS 1917
    original: כִּי לֹא לְעוֹלָם חֹסֶן וְאִם־נֵזֶר לְדוֹר דור [וָדוֹר׃]
    hebrewPlain: כי לא לעולם חסן ואם נזר לדור דור [ודור]
    kjvRefs:
    - Proverbs 27:24
    kjvOsis:
    - Prov.27.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.25
    scripture: tanakh
    name: Tanakh Proverbs 27:25
    ref: Proverbs 27:25
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 25
    ordinal: 18463
    text: When the hay is mown, and the tender grass showeth itself, And the herbs of the mountains are gathered in;
    translation: JPS 1917
    original: גָּלָה חָצִיר וְנִרְאָה־דֶשֶׁא וְנֶאֶסְפוּ עִשְּׂבוֹת הָרִים׃
    hebrewPlain: גלה חציר ונראה דשא ונאספו עשבות הרים
    kjvRefs:
    - Proverbs 27:25
    kjvOsis:
    - Prov.27.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.26
    scripture: tanakh
    name: Tanakh Proverbs 27:26
    ref: Proverbs 27:26
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 26
    ordinal: 18464
    text: The lambs will be for thy clothing, And the goats the price for a field. .
    translation: JPS 1917
    original: כְּבָשִׂים לִלְבוּשֶׁךָ וּמְחִיר שָׂדֶה עַתּוּדִים׃
    hebrewPlain: כבשים ללבושך ומחיר שדה עתודים
    kjvRefs:
    - Proverbs 27:26
    kjvOsis:
    - Prov.27.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.27.27
    scripture: tanakh
    name: Tanakh Proverbs 27:27
    ref: Proverbs 27:27
    book: Prov
    section: ketuvim
    chapter: 27
    verse: 27
    ordinal: 18465
    text: And there will be goats’ milk enough for thy food, for the food of thy household; And maintenance for thy maidens.
    translation: JPS 1917
    original: וְדֵי חֲלֵב עִזִּים לְלַחְמְךָ לְלֶחֶם בֵּיתֶךָ וְחַיִּים לְנַעֲרוֹתֶיךָ׃
    hebrewPlain: ודי חלב עזים ללחמך ללחם ביתך וחיים לנערותיך
    kjvRefs:
    - Proverbs 27:27
    kjvOsis:
    - Prov.27.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.27
- type: TanakhVerse
  data:
    osis: Prov.28.1
    scripture: tanakh
    name: Tanakh Proverbs 28:1
    ref: Proverbs 28:1
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 1
    ordinal: 18466
    text: The wicked flee when no man pursueth; But the righteous are secure as a young lion.
    translation: JPS 1917
    original: נָסוּ וְאֵין־רֹדֵף רָשָׁע וְצַדִּיקִים כִּכְפִיר יִבְטָח׃
    hebrewPlain: נסו ואין רדף רשע וצדיקים ככפיר יבטח
    kjvRefs:
    - Proverbs 28:1
    kjvOsis:
    - Prov.28.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.2
    scripture: tanakh
    name: Tanakh Proverbs 28:2
    ref: Proverbs 28:2
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 2
    ordinal: 18467
    text: For the transgression of a land many are the princes thereof; But by a man of understanding and knowledge established order shall long continue.
    translation: JPS 1917
    original: בְּפֶשַׁע אֶרֶץ רַבִּים שָׂרֶיהָ וּבְאָדָם מֵבִין יֹדֵעַ כֵּן יַאֲרִיךְ׃
    hebrewPlain: בפשע ארץ רבים שריה ובאדם מבין ידע כן יאריך
    kjvRefs:
    - Proverbs 28:2
    kjvOsis:
    - Prov.28.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.3
    scripture: tanakh
    name: Tanakh Proverbs 28:3
    ref: Proverbs 28:3
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 3
    ordinal: 18468
    text: A poor man that oppresseth the weak Is like a sweeping rain which leaveth no food.
    translation: JPS 1917
    original: גֶּבֶר רָשׁ וְעֹשֵׁק דַּלִּים מָטָר סֹחֵף וְאֵין לָחֶם׃
    hebrewPlain: גבר רש ועשק דלים מטר סחף ואין לחם
    kjvRefs:
    - Proverbs 28:3
    kjvOsis:
    - Prov.28.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.4
    scripture: tanakh
    name: Tanakh Proverbs 28:4
    ref: Proverbs 28:4
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 4
    ordinal: 18469
    text: They that forsake the law praise the wicked; But such as keep the law contend with them.
    translation: JPS 1917
    original: עֹזְבֵי תוֹרָה יְהַלְלוּ רָשָׁע וְשֹׁמְרֵי תוֹרָה יִתְגָּרוּ בָם׃
    hebrewPlain: עזבי תורה יהללו רשע ושמרי תורה יתגרו בם
    kjvRefs:
    - Proverbs 28:4
    kjvOsis:
    - Prov.28.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.5
    scripture: tanakh
    name: Tanakh Proverbs 28:5
    ref: Proverbs 28:5
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 5
    ordinal: 18470
    text: Evil men understand not justice; But they that seek the LORD understand all things.
    translation: JPS 1917
    original: אַנְשֵׁי־רָע לֹא־יָבִינוּ מִשְׁפָּט וּמְבַקְשֵׁי יְהוָה יָבִינוּ כֹל׃
    hebrewPlain: אנשי רע לא יבינו משפט ומבקשי יהוה יבינו כל
    kjvRefs:
    - Proverbs 28:5
    kjvOsis:
    - Prov.28.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.6
    scripture: tanakh
    name: Tanakh Proverbs 28:6
    ref: Proverbs 28:6
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 6
    ordinal: 18471
    text: Better is the poor that walketh in his integrity, Than he that is perverse in his ways, though he be rich.
    translation: JPS 1917
    original: טוֹב־רָשׁ הוֹלֵךְ בְּתֻמּוֹ מֵעִקֵּשׁ דְּרָכַיִם וְהוּא עָשִׁיר׃
    hebrewPlain: טוב רש הולך בתמו מעקש דרכים והוא עשיר
    kjvRefs:
    - Proverbs 28:6
    kjvOsis:
    - Prov.28.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.7
    scripture: tanakh
    name: Tanakh Proverbs 28:7
    ref: Proverbs 28:7
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 7
    ordinal: 18472
    text: A wise son observeth the teaching; But he that is a companion of gluttonous men shameth his father.
    translation: JPS 1917
    original: נוֹצֵר תּוֹרָה בֵּן מֵבִין וְרֹעֶה זוֹלְלִים יַכְלִים אָבִיו׃
    hebrewPlain: נוצר תורה בן מבין ורעה זוללים יכלים אביו
    kjvRefs:
    - Proverbs 28:7
    kjvOsis:
    - Prov.28.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.8
    scripture: tanakh
    name: Tanakh Proverbs 28:8
    ref: Proverbs 28:8
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 8
    ordinal: 18473
    text: He that augmenteth his substance by interest and increase, Gathereth it for him that is gracious to the poor.
    translation: JPS 1917
    original: מַרְבֶּה הוֹנוֹ בְּנֶשֶׁךְ ובתרבית [וְתַרְבִּית] לְחוֹנֵן דַּלִּים יִקְבְּצֶנּוּ׃
    hebrewPlain: מרבה הונו בנשך ובתרבית [ותרבית] לחונן דלים יקבצנו
    kjvRefs:
    - Proverbs 28:8
    kjvOsis:
    - Prov.28.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.9
    scripture: tanakh
    name: Tanakh Proverbs 28:9
    ref: Proverbs 28:9
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 9
    ordinal: 18474
    text: He that turneth away his ear from hearing the law, Even his prayer is an abomination.
    translation: JPS 1917
    original: מֵסִיר אָזְנוֹ מִשְּׁמֹעַ תּוֹרָה גַּם־תְּפִלָּתוֹ תּוֹעֵבָה׃
    hebrewPlain: מסיר אזנו משמע תורה גם תפלתו תועבה
    kjvRefs:
    - Proverbs 28:9
    kjvOsis:
    - Prov.28.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.10
    scripture: tanakh
    name: Tanakh Proverbs 28:10
    ref: Proverbs 28:10
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 10
    ordinal: 18475
    text: Whoso causeth the upright to go astray in an evil way, He shall fall himself into his own pit; But the whole-hearted shall inherit good.
    translation: JPS 1917
    original: מַשְׁגֶּה יְשָׁרִים בְּדֶרֶךְ רָע בִּשְׁחוּתוֹ הוּא־יִפּוֹל וּתְמִימִים יִנְחֲלוּ־טוֹב׃
    hebrewPlain: משגה ישרים בדרך רע בשחותו הוא יפול ותמימים ינחלו טוב
    kjvRefs:
    - Proverbs 28:10
    kjvOsis:
    - Prov.28.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.11
    scripture: tanakh
    name: Tanakh Proverbs 28:11
    ref: Proverbs 28:11
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 11
    ordinal: 18476
    text: The rich man is wise in his own eyes; But the poor that hath understanding searcheth him through.
    translation: JPS 1917
    original: חָכָם בְּעֵינָיו אִישׁ עָשִׁיר וְדַל מֵבִין יַחְקְרֶנּוּ׃
    hebrewPlain: חכם בעיניו איש עשיר ודל מבין יחקרנו
    kjvRefs:
    - Proverbs 28:11
    kjvOsis:
    - Prov.28.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.12
    scripture: tanakh
    name: Tanakh Proverbs 28:12
    ref: Proverbs 28:12
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 12
    ordinal: 18477
    text: When the righteous exult, there is great glory; But when the wicked rise, men must be sought for.
    translation: JPS 1917
    original: בַּעֲלֹץ צַדִּיקִים רַבָּה תִפְאָרֶת וּבְקוּם רְשָׁעִים יְחֻפַּשׂ אָדָם׃
    hebrewPlain: בעלץ צדיקים רבה תפארת ובקום רשעים יחפש אדם
    kjvRefs:
    - Proverbs 28:12
    kjvOsis:
    - Prov.28.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.13
    scripture: tanakh
    name: Tanakh Proverbs 28:13
    ref: Proverbs 28:13
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 13
    ordinal: 18478
    text: He that covereth his transgressions shall not prosper; But whoso confesseth and forsaketh them shall obtain mercy.
    translation: JPS 1917
    original: מְכַסֶּה פְשָׁעָיו לֹא יַצְלִיחַ וּמוֹדֶה וְעֹזֵב יְרֻחָם׃
    hebrewPlain: מכסה פשעיו לא יצליח ומודה ועזב ירחם
    kjvRefs:
    - Proverbs 28:13
    kjvOsis:
    - Prov.28.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.14
    scripture: tanakh
    name: Tanakh Proverbs 28:14
    ref: Proverbs 28:14
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 14
    ordinal: 18479
    text: Happy is the man that feareth alway; But he that hardeneth his heart shall fall into evil.
    translation: JPS 1917
    original: אַשְׁרֵי אָדָם מְפַחֵד תָּמִיד וּמַקְשֶׁה לִבּוֹ יִפּוֹל בְּרָעָה׃
    hebrewPlain: אשרי אדם מפחד תמיד ומקשה לבו יפול ברעה
    kjvRefs:
    - Proverbs 28:14
    kjvOsis:
    - Prov.28.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.15
    scripture: tanakh
    name: Tanakh Proverbs 28:15
    ref: Proverbs 28:15
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 15
    ordinal: 18480
    text: As a roaring lion, and a ravenous bear; So is a wicked ruler over a poor people.
    translation: JPS 1917
    original: אֲרִי־נֹהֵם וְדֹב שׁוֹקֵק מֹשֵׁל רָשָׁע עַל עַם־דָּל׃
    hebrewPlain: ארי נהם ודב שוקק משל רשע על עם דל
    kjvRefs:
    - Proverbs 28:15
    kjvOsis:
    - Prov.28.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.16
    scripture: tanakh
    name: Tanakh Proverbs 28:16
    ref: Proverbs 28:16
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 16
    ordinal: 18481
    text: The prince that lacketh understanding is also a great oppressor; But he that hateth covetousness shall prolong his days.
    translation: JPS 1917
    original: נָגִיד חֲסַר תְּבוּנוֹת וְרַב מַעֲשַׁקּוֹת שנאי [שֹׂנֵא] בֶצַע יַאֲרִיךְ יָמִים׃
    hebrewPlain: נגיד חסר תבונות ורב מעשקות שנאי [שנא] בצע יאריך ימים
    kjvRefs:
    - Proverbs 28:16
    kjvOsis:
    - Prov.28.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.17
    scripture: tanakh
    name: Tanakh Proverbs 28:17
    ref: Proverbs 28:17
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 17
    ordinal: 18482
    text: A man that is laden with the blood of any person Shall hasten his steps unto the pit; none will support him.
    translation: JPS 1917
    original: אָדָם עָשֻׁק בְּדַם־נָפֶשׁ עַד־בּוֹר יָנוּס אַל־יִתְמְכוּ־בוֹ׃
    hebrewPlain: אדם עשק בדם נפש עד בור ינוס אל יתמכו בו
    kjvRefs:
    - Proverbs 28:17
    kjvOsis:
    - Prov.28.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.18
    scripture: tanakh
    name: Tanakh Proverbs 28:18
    ref: Proverbs 28:18
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 18
    ordinal: 18483
    text: Whoso walketh uprightly shall be saved; But he that is perverse in his ways shall fall at once.
    translation: JPS 1917
    original: הוֹלֵךְ תָּמִים יִוָּשֵׁעַ וְנֶעְקַשׁ דְּרָכַיִם יִפּוֹל בְּאֶחָת׃
    hebrewPlain: הולך תמים יושע ונעקש דרכים יפול באחת
    kjvRefs:
    - Proverbs 28:18
    kjvOsis:
    - Prov.28.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.19
    scripture: tanakh
    name: Tanakh Proverbs 28:19
    ref: Proverbs 28:19
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 19
    ordinal: 18484
    text: He that tilleth his ground shall have plenty of bread; But he that followeth after vain things shall have poverty enough.
    translation: JPS 1917
    original: עֹבֵד אַדְמָתוֹ יִשְׂבַּע־לָחֶם וּמְרַדֵּף רֵקִים יִשְׂבַּע־רִישׁ׃
    hebrewPlain: עבד אדמתו ישבע לחם ומרדף רקים ישבע ריש
    kjvRefs:
    - Proverbs 28:19
    kjvOsis:
    - Prov.28.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.20
    scripture: tanakh
    name: Tanakh Proverbs 28:20
    ref: Proverbs 28:20
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 20
    ordinal: 18485
    text: A faithful man shall abound with blessings; But he that maketh haste to be rich shall not be unpunished.
    translation: JPS 1917
    original: אִישׁ אֱמוּנוֹת רַב־בְּרָכוֹת וְאָץ לְהַעֲשִׁיר לֹא יִנָּקֶה׃
    hebrewPlain: איש אמונות רב ברכות ואץ להעשיר לא ינקה
    kjvRefs:
    - Proverbs 28:20
    kjvOsis:
    - Prov.28.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.21
    scripture: tanakh
    name: Tanakh Proverbs 28:21
    ref: Proverbs 28:21
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 21
    ordinal: 18486
    text: To have respect of persons is not good; For a man will transgress for a piece of bread.
    translation: JPS 1917
    original: הַכֵּר־פָּנִים לֹא־טוֹב וְעַל־פַּת־לֶחֶם יִפְשַׁע־גָּבֶר׃
    hebrewPlain: הכר פנים לא טוב ועל פת לחם יפשע גבר
    kjvRefs:
    - Proverbs 28:21
    kjvOsis:
    - Prov.28.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.22
    scripture: tanakh
    name: Tanakh Proverbs 28:22
    ref: Proverbs 28:22
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 22
    ordinal: 18487
    text: He that hath an evil eye hasteneth after riches, And knoweth not that want shall come upon him.
    translation: JPS 1917
    original: נִבֳהָל לַהוֹן אִישׁ רַע עָיִן וְלֹא־יֵדַע כִּי־חֶסֶר יְבֹאֶנּוּ׃
    hebrewPlain: נבהל להון איש רע עין ולא ידע כי חסר יבאנו
    kjvRefs:
    - Proverbs 28:22
    kjvOsis:
    - Prov.28.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.23
    scripture: tanakh
    name: Tanakh Proverbs 28:23
    ref: Proverbs 28:23
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 23
    ordinal: 18488
    text: He that rebuketh a man shall in the end find more favour Than he that flattereth with the tongue.
    translation: JPS 1917
    original: מוֹכִיחַ אָדָם אַחֲרַי חֵן יִמְצָא מִמַּחֲלִיק לָשׁוֹן׃
    hebrewPlain: מוכיח אדם אחרי חן ימצא ממחליק לשון
    kjvRefs:
    - Proverbs 28:23
    kjvOsis:
    - Prov.28.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.24
    scripture: tanakh
    name: Tanakh Proverbs 28:24
    ref: Proverbs 28:24
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 24
    ordinal: 18489
    text: 'Whoso robbeth his father or his mother, and saith: ‘It is no transgression’, The same is the companion of a destroyer.'
    translation: JPS 1917
    original: גּוֹזֵל אָבִיו וְאִמּוֹ וְאֹמֵר אֵין־פָּשַׁע חָבֵר הוּא לְאִישׁ מַשְׁחִית׃
    hebrewPlain: גוזל אביו ואמו ואמר אין פשע חבר הוא לאיש משחית
    kjvRefs:
    - Proverbs 28:24
    kjvOsis:
    - Prov.28.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.25
    scripture: tanakh
    name: Tanakh Proverbs 28:25
    ref: Proverbs 28:25
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 25
    ordinal: 18490
    text: He that is of a greedy spirit stirreth up strife; But he that putteth his trust in the LORD shall be abundantly gratified.
    translation: JPS 1917
    original: רְחַב־נֶפֶשׁ יְגָרֶה מָדוֹן וּבוֹטֵחַ עַל־יְהוָה יְדֻשָּׁן׃
    hebrewPlain: רחב נפש יגרה מדון ובוטח על יהוה ידשן
    kjvRefs:
    - Proverbs 28:25
    kjvOsis:
    - Prov.28.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.26
    scripture: tanakh
    name: Tanakh Proverbs 28:26
    ref: Proverbs 28:26
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 26
    ordinal: 18491
    text: He that trusteth in his own heart is a fool; But whoso walketh wisely, he shall escape.
    translation: JPS 1917
    original: בּוֹטֵחַ בְּלִבּוֹ הוּא כְסִיל וְהוֹלֵךְ בְּחָכְמָה הוּא יִמָּלֵט׃
    hebrewPlain: בוטח בלבו הוא כסיל והולך בחכמה הוא ימלט
    kjvRefs:
    - Proverbs 28:26
    kjvOsis:
    - Prov.28.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.27
    scripture: tanakh
    name: Tanakh Proverbs 28:27
    ref: Proverbs 28:27
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 27
    ordinal: 18492
    text: He that giveth unto the poor shall not lack; But he that hideth his eyes shall have many a curse.
    translation: JPS 1917
    original: נוֹתֵן לָרָשׁ אֵין מַחְסוֹר וּמַעְלִים עֵינָיו רַב־מְאֵרוֹת׃
    hebrewPlain: נותן לרש אין מחסור ומעלים עיניו רב מארות
    kjvRefs:
    - Proverbs 28:27
    kjvOsis:
    - Prov.28.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.28.28
    scripture: tanakh
    name: Tanakh Proverbs 28:28
    ref: Proverbs 28:28
    book: Prov
    section: ketuvim
    chapter: 28
    verse: 28
    ordinal: 18493
    text: When the wicked rise, men hide themselves; But when they perish, the righteous increase.
    translation: JPS 1917
    original: בְּקוּם רְשָׁעִים יִסָּתֵר אָדָם וּבְאָבְדָם יִרְבּוּ צַדִּיקִים׃
    hebrewPlain: בקום רשעים יסתר אדם ובאבדם ירבו צדיקים
    kjvRefs:
    - Proverbs 28:28
    kjvOsis:
    - Prov.28.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.28
- type: TanakhVerse
  data:
    osis: Prov.29.1
    scripture: tanakh
    name: Tanakh Proverbs 29:1
    ref: Proverbs 29:1
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 1
    ordinal: 18494
    text: He that being often reproved hardeneth his neck Shall suddenly be broken, and that without remedy.
    translation: JPS 1917
    original: אִישׁ תּוֹכָחוֹת מַקְשֶׁה־עֹרֶף פֶּתַע יִשָּׁבֵר וְאֵין מַרְפֵּא׃
    hebrewPlain: איש תוכחות מקשה ערף פתע ישבר ואין מרפא
    kjvRefs:
    - Proverbs 29:1
    kjvOsis:
    - Prov.29.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.2
    scripture: tanakh
    name: Tanakh Proverbs 29:2
    ref: Proverbs 29:2
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 2
    ordinal: 18495
    text: When the righteous are increased, the people rejoice; but when the wicked beareth rule, the people sigh.
    translation: JPS 1917
    original: בִּרְבוֹת צַדִּיקִים יִשְׂמַח הָעָם וּבִמְשֹׁל רָשָׁע יֵאָנַח עָם׃
    hebrewPlain: ברבות צדיקים ישמח העם ובמשל רשע יאנח עם
    kjvRefs:
    - Proverbs 29:2
    kjvOsis:
    - Prov.29.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.3
    scripture: tanakh
    name: Tanakh Proverbs 29:3
    ref: Proverbs 29:3
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 3
    ordinal: 18496
    text: Whoso loveth wisdom rejoiceth his father; but he that keepeth company with harlots wasteth his substance.
    translation: JPS 1917
    original: אִישׁ־אֹהֵב חָכְמָה יְשַׂמַּח אָבִיו וְרֹעֶה זוֹנוֹת יְאַבֶּד־הוֹן׃
    hebrewPlain: איש אהב חכמה ישמח אביו ורעה זונות יאבד הון
    kjvRefs:
    - Proverbs 29:3
    kjvOsis:
    - Prov.29.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.4
    scripture: tanakh
    name: Tanakh Proverbs 29:4
    ref: Proverbs 29:4
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 4
    ordinal: 18497
    text: The king by justice establisheth the land; but he that exacteth gifts overthroweth it.
    translation: JPS 1917
    original: מֶלֶךְ בְּמִשְׁפָּט יַעֲמִיד אָרֶץ וְאִישׁ תְּרוּמוֹת יֶהֶרְסֶנָּה׃
    hebrewPlain: מלך במשפט יעמיד ארץ ואיש תרומות יהרסנה
    kjvRefs:
    - Proverbs 29:4
    kjvOsis:
    - Prov.29.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.5
    scripture: tanakh
    name: Tanakh Proverbs 29:5
    ref: Proverbs 29:5
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 5
    ordinal: 18498
    text: A man that flattereth his neighbour spreadeth a net for his steps.
    translation: JPS 1917
    original: גֶּבֶר מַחֲלִיק עַל־רֵעֵהוּ רֶשֶׁת פּוֹרֵשׂ עַל־פְּעָמָיו׃
    hebrewPlain: גבר מחליק על רעהו רשת פורש על פעמיו
    kjvRefs:
    - Proverbs 29:5
    kjvOsis:
    - Prov.29.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.6
    scripture: tanakh
    name: Tanakh Proverbs 29:6
    ref: Proverbs 29:6
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 6
    ordinal: 18499
    text: In the transgression of an evil man there is a snare; but the righteous doth sing and rejoice.
    translation: JPS 1917
    original: בְּפֶשַׁע אִישׁ רָע מוֹקֵשׁ וְצַדִּיק יָרוּן וְשָׂמֵחַ׃
    hebrewPlain: בפשע איש רע מוקש וצדיק ירון ושמח
    kjvRefs:
    - Proverbs 29:6
    kjvOsis:
    - Prov.29.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.7
    scripture: tanakh
    name: Tanakh Proverbs 29:7
    ref: Proverbs 29:7
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 7
    ordinal: 18500
    text: The righteous taketh knowledge of the cause of the poor; the wicked understandeth not knowledge.
    translation: JPS 1917
    original: יֹדֵעַ צַדִּיק דִּין דַּלִּים רָשָׁע לֹא־יָבִין דָּעַת׃
    hebrewPlain: ידע צדיק דין דלים רשע לא יבין דעת
    kjvRefs:
    - Proverbs 29:7
    kjvOsis:
    - Prov.29.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.8
    scripture: tanakh
    name: Tanakh Proverbs 29:8
    ref: Proverbs 29:8
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 8
    ordinal: 18501
    text: Scornful men set a city in a blaze; But wise men turn away wrath.
    translation: JPS 1917
    original: אַנְשֵׁי לָצוֹן יָפִיחוּ קִרְיָה וַחֲכָמִים יָשִׁיבוּ אָף׃
    hebrewPlain: אנשי לצון יפיחו קריה וחכמים ישיבו אף
    kjvRefs:
    - Proverbs 29:8
    kjvOsis:
    - Prov.29.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.9
    scripture: tanakh
    name: Tanakh Proverbs 29:9
    ref: Proverbs 29:9
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 9
    ordinal: 18502
    text: If a wise man contendeth with a foolish man, Whether he be angry or laugh, there will be no rest.
    translation: JPS 1917
    original: אִישׁ־חָכָם נִשְׁפָּט אֶת־אִישׁ אֱוִיל וְרָגַז וְשָׂחַק וְאֵין נָחַת׃
    hebrewPlain: איש חכם נשפט את איש אויל ורגז ושחק ואין נחת
    kjvRefs:
    - Proverbs 29:9
    kjvOsis:
    - Prov.29.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.10
    scripture: tanakh
    name: Tanakh Proverbs 29:10
    ref: Proverbs 29:10
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 10
    ordinal: 18503
    text: The men of blood hate him that is sincere; And as for the upright, they seek his life.
    translation: JPS 1917
    original: אַנְשֵׁי דָמִים יִשְׂנְאוּ־תָם וִישָׁרִים יְבַקְשׁוּ נַפְשׁוֹ׃
    hebrewPlain: אנשי דמים ישנאו תם וישרים יבקשו נפשו
    kjvRefs:
    - Proverbs 29:10
    kjvOsis:
    - Prov.29.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.11
    scripture: tanakh
    name: Tanakh Proverbs 29:11
    ref: Proverbs 29:11
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 11
    ordinal: 18504
    text: A fool spendeth all his spirit; But a wise man stilleth it within him.
    translation: JPS 1917
    original: כָּל־רוּחוֹ יוֹצִיא כְסִיל וְחָכָם בְּאָחוֹר יְשַׁבְּחֶנָּה׃
    hebrewPlain: כל רוחו יוציא כסיל וחכם באחור ישבחנה
    kjvRefs:
    - Proverbs 29:11
    kjvOsis:
    - Prov.29.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.12
    scripture: tanakh
    name: Tanakh Proverbs 29:12
    ref: Proverbs 29:12
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 12
    ordinal: 18505
    text: If a ruler hearkeneth to falsehood, All his servants are wicked.
    translation: JPS 1917
    original: מֹשֵׁל מַקְשִׁיב עַל־דְּבַר־שָׁקֶר כָּל־מְשָׁרְתָיו רְשָׁעִים׃
    hebrewPlain: משל מקשיב על דבר שקר כל משרתיו רשעים
    kjvRefs:
    - Proverbs 29:12
    kjvOsis:
    - Prov.29.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.13
    scripture: tanakh
    name: Tanakh Proverbs 29:13
    ref: Proverbs 29:13
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 13
    ordinal: 18506
    text: The poor man and the oppressor meet together; The LORD giveth light to the eyes of them both.
    translation: JPS 1917
    original: רָשׁ וְאִישׁ תְּכָכִים נִפְגָּשׁוּ מֵאִיר־עֵינֵי שְׁנֵיהֶם יְהוָה׃
    hebrewPlain: רש ואיש תככים נפגשו מאיר עיני שניהם יהוה
    kjvRefs:
    - Proverbs 29:13
    kjvOsis:
    - Prov.29.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.14
    scripture: tanakh
    name: Tanakh Proverbs 29:14
    ref: Proverbs 29:14
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 14
    ordinal: 18507
    text: The king that faithfully judgeth the poor, His throne shall be established for ever.
    translation: JPS 1917
    original: מֶלֶךְ שׁוֹפֵט בֶּאֱמֶת דַּלִּים כִּסְאוֹ לָעַד יִכּוֹן׃
    hebrewPlain: מלך שופט באמת דלים כסאו לעד יכון
    kjvRefs:
    - Proverbs 29:14
    kjvOsis:
    - Prov.29.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.15
    scripture: tanakh
    name: Tanakh Proverbs 29:15
    ref: Proverbs 29:15
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 15
    ordinal: 18508
    text: The rod and reproof give wisdom; But a child left to himself causeth shame to his mother.
    translation: JPS 1917
    original: שֵׁבֶט וְתוֹכַחַת יִתֵּן חָכְמָה וְנַעַר מְשֻׁלָּח מֵבִישׁ אִמּוֹ׃
    hebrewPlain: שבט ותוכחת יתן חכמה ונער משלח מביש אמו
    kjvRefs:
    - Proverbs 29:15
    kjvOsis:
    - Prov.29.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.16
    scripture: tanakh
    name: Tanakh Proverbs 29:16
    ref: Proverbs 29:16
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 16
    ordinal: 18509
    text: When the wicked are increased, transgression increaseth; But the righteous shall gaze upon their fall.
    translation: JPS 1917
    original: בִּרְבוֹת רְשָׁעִים יִרְבֶּה־פָּשַׁע וְצַדִּיקִים בְּמַפַּלְתָּם יִרְאוּ׃
    hebrewPlain: ברבות רשעים ירבה פשע וצדיקים במפלתם יראו
    kjvRefs:
    - Proverbs 29:16
    kjvOsis:
    - Prov.29.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.17
    scripture: tanakh
    name: Tanakh Proverbs 29:17
    ref: Proverbs 29:17
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 17
    ordinal: 18510
    text: Correct thy son, and he will give thee rest; Yea, he will give delight unto thy soul.
    translation: JPS 1917
    original: יַסֵּר בִּנְךָ וִינִיחֶךָ וְיִתֵּן מַעֲדַנִּים לְנַפְשֶׁךָ׃
    hebrewPlain: יסר בנך ויניחך ויתן מעדנים לנפשך
    kjvRefs:
    - Proverbs 29:17
    kjvOsis:
    - Prov.29.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.18
    scripture: tanakh
    name: Tanakh Proverbs 29:18
    ref: Proverbs 29:18
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 18
    ordinal: 18511
    text: Where there is no vision, the people cast off restraint; But he that keepeth the law, happy is he.
    translation: JPS 1917
    original: בְּאֵין חָזוֹן יִפָּרַע עָם וְשֹׁמֵר תּוֹרָה אַשְׁרֵהוּ׃
    hebrewPlain: באין חזון יפרע עם ושמר תורה אשרהו
    kjvRefs:
    - Proverbs 29:18
    kjvOsis:
    - Prov.29.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.19
    scripture: tanakh
    name: Tanakh Proverbs 29:19
    ref: Proverbs 29:19
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 19
    ordinal: 18512
    text: A servant will not be corrected by words; For though he understand, there will be no response.
    translation: JPS 1917
    original: בִּדְבָרִים לֹא־יִוָּסֶר עָבֶד כִּי־יָבִין וְאֵין מַעֲנֶה׃
    hebrewPlain: בדברים לא יוסר עבד כי יבין ואין מענה
    kjvRefs:
    - Proverbs 29:19
    kjvOsis:
    - Prov.29.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.20
    scripture: tanakh
    name: Tanakh Proverbs 29:20
    ref: Proverbs 29:20
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 20
    ordinal: 18513
    text: Seest thou a man that is hasty in his words? There is more hope for a fool than for him.
    translation: JPS 1917
    original: חָזִיתָ אִישׁ אָץ בִּדְבָרָיו תִּקְוָה לִכְסִיל מִמֶּנּוּ׃
    hebrewPlain: חזית איש אץ בדבריו תקוה לכסיל ממנו
    kjvRefs:
    - Proverbs 29:20
    kjvOsis:
    - Prov.29.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.21
    scripture: tanakh
    name: Tanakh Proverbs 29:21
    ref: Proverbs 29:21
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 21
    ordinal: 18514
    text: He that delicately bringeth up his servant from a child Shall have him become master at the last.
    translation: JPS 1917
    original: מְפַנֵּק מִנֹּעַר עַבְדּוֹ וְאַחֲרִיתוֹ יִהְיֶה מָנוֹן׃
    hebrewPlain: מפנק מנער עבדו ואחריתו יהיה מנון
    kjvRefs:
    - Proverbs 29:21
    kjvOsis:
    - Prov.29.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.22
    scripture: tanakh
    name: Tanakh Proverbs 29:22
    ref: Proverbs 29:22
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 22
    ordinal: 18515
    text: An angry man stirreth up strife, And a wrathful man aboundeth in transgression.
    translation: JPS 1917
    original: אִישׁ־אַף יְגָרֶה מָדוֹן וּבַעַל חֵמָה רַב־פָּשַׁע׃
    hebrewPlain: איש אף יגרה מדון ובעל חמה רב פשע
    kjvRefs:
    - Proverbs 29:22
    kjvOsis:
    - Prov.29.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.23
    scripture: tanakh
    name: Tanakh Proverbs 29:23
    ref: Proverbs 29:23
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 23
    ordinal: 18516
    text: A man’s pride shall bring him low; but he that is of a lowly spirit shall attain to honour.
    translation: JPS 1917
    original: גַּאֲוַת אָדָם תַּשְׁפִּילֶנּוּ וּשְׁפַל־רוּחַ יִתְמֹךְ כָּבוֹד׃
    hebrewPlain: גאות אדם תשפילנו ושפל רוח יתמך כבוד
    kjvRefs:
    - Proverbs 29:23
    kjvOsis:
    - Prov.29.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.24
    scripture: tanakh
    name: Tanakh Proverbs 29:24
    ref: Proverbs 29:24
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 24
    ordinal: 18517
    text: 'Whoso is partner with a thief hateth his own soul: He heareth the adjuration and uttereth nothing.'
    translation: JPS 1917
    original: חוֹלֵק עִם־גַּנָּב שׂוֹנֵא נַפְשׁוֹ אָלָה יִשְׁמַע וְלֹא יַגִּיד׃
    hebrewPlain: חולק עם גנב שונא נפשו אלה ישמע ולא יגיד
    kjvRefs:
    - Proverbs 29:24
    kjvOsis:
    - Prov.29.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.25
    scripture: tanakh
    name: Tanakh Proverbs 29:25
    ref: Proverbs 29:25
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 25
    ordinal: 18518
    text: The fear of man bringeth a snare; but whoso putteth his trust in the LORD shall be set up on high.
    translation: JPS 1917
    original: חֶרְדַּת אָדָם יִתֵּן מוֹקֵשׁ וּבוֹטֵחַ בַּיהוָה יְשֻׂגָּב׃
    hebrewPlain: חרדת אדם יתן מוקש ובוטח ביהוה ישגב
    kjvRefs:
    - Proverbs 29:25
    kjvOsis:
    - Prov.29.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.26
    scripture: tanakh
    name: Tanakh Proverbs 29:26
    ref: Proverbs 29:26
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 26
    ordinal: 18519
    text: Many seek the ruler’s favour; but a man’s judgment cometh from the LORD.
    translation: JPS 1917
    original: רַבִּים מְבַקְשִׁים פְּנֵי־מוֹשֵׁל וּמֵיְהוָה מִשְׁפַּט־אִישׁ׃
    hebrewPlain: רבים מבקשים פני מושל ומיהוה משפט איש
    kjvRefs:
    - Proverbs 29:26
    kjvOsis:
    - Prov.29.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.29.27
    scripture: tanakh
    name: Tanakh Proverbs 29:27
    ref: Proverbs 29:27
    book: Prov
    section: ketuvim
    chapter: 29
    verse: 27
    ordinal: 18520
    text: An unjust man is an abomination to the righteous; and he that is upright in the way is an abomination to the wicked.
    translation: JPS 1917
    original: תּוֹעֲבַת צַדִּיקִים אִישׁ עָוֶל וְתוֹעֲבַת רָשָׁע יְשַׁר־דָּרֶךְ׃
    hebrewPlain: תועבת צדיקים איש עול ותועבת רשע ישר דרך
    kjvRefs:
    - Proverbs 29:27
    kjvOsis:
    - Prov.29.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.29
- type: TanakhVerse
  data:
    osis: Prov.30.1
    scripture: tanakh
    name: Tanakh Proverbs 30:1
    ref: Proverbs 30:1
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 1
    ordinal: 18521
    text: 'The words of Agur the son of Jakeh; the burden. The man saith unto Ithiel, unto Ithiel and Ucal:'
    translation: JPS 1917
    original: דִּבְרֵי אָגוּר בִּן־יָקֶה הַמַּשָּׂא נְאֻם הַגֶּבֶר לְאִיתִיאֵל לְאִיתִיאֵל וְאֻכָל׃
    hebrewPlain: דברי אגור בן יקה המשא נאם הגבר לאיתיאל לאיתיאל ואכל
    kjvRefs:
    - Proverbs 30:1
    kjvOsis:
    - Prov.30.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.2
    scripture: tanakh
    name: Tanakh Proverbs 30:2
    ref: Proverbs 30:2
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 2
    ordinal: 18522
    text: Surely I am brutish, unlike a man, And have not the understanding of a man;
    translation: JPS 1917
    original: כִּי בַעַר אָנֹכִי מֵאִישׁ וְלֹא־בִינַת אָדָם לִי׃
    hebrewPlain: כי בער אנכי מאיש ולא בינת אדם לי
    kjvRefs:
    - Proverbs 30:2
    kjvOsis:
    - Prov.30.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.3
    scripture: tanakh
    name: Tanakh Proverbs 30:3
    ref: Proverbs 30:3
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 3
    ordinal: 18523
    text: And I have not learned wisdom, That I should have the knowledge of the Holy One.
    translation: JPS 1917
    original: וְלֹא־לָמַדְתִּי חָכְמָה וְדַעַת קְדֹשִׁים אֵדָע׃
    hebrewPlain: ולא למדתי חכמה ודעת קדשים אדע
    kjvRefs:
    - Proverbs 30:3
    kjvOsis:
    - Prov.30.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.4
    scripture: tanakh
    name: Tanakh Proverbs 30:4
    ref: Proverbs 30:4
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 4
    ordinal: 18524
    text: Who hath ascended up into heaven, and descended? Who hath gathered the wind in his fists? Who hath bound the waters in his garment? Who hath established all the ends of the earth? What is his name, and what is his son’s name, if thou knowest?
    translation: JPS 1917
    original: מִי עָלָה־שָׁמַיִם וַיֵּרַד מִי אָסַף־רוּחַ בְּחָפְנָיו מִי צָרַר־מַיִם בַּשִּׂמְלָה מִי הֵקִים כָּל־אַפְסֵי־אָרֶץ מַה־שְּׁמוֹ וּמַה־שֶּׁם־בְּנוֹ כִּי תֵדָע׃
    hebrewPlain: מי עלה שמים וירד מי אסף רוח בחפניו מי צרר מים בשמלה מי הקים כל אפסי ארץ מה שמו ומה שם בנו כי תדע
    kjvRefs:
    - Proverbs 30:4
    kjvOsis:
    - Prov.30.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.5
    scripture: tanakh
    name: Tanakh Proverbs 30:5
    ref: Proverbs 30:5
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 5
    ordinal: 18525
    text: Every word of God is tried; He is a shield unto them that take refuge in Him.
    translation: JPS 1917
    original: כָּל־אִמְרַת אֱלוֹהַּ צְרוּפָה מָגֵן הוּא לַחֹסִים בּוֹ׃
    hebrewPlain: כל אמרת אלוה צרופה מגן הוא לחסים בו
    kjvRefs:
    - Proverbs 30:5
    kjvOsis:
    - Prov.30.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.6
    scripture: tanakh
    name: Tanakh Proverbs 30:6
    ref: Proverbs 30:6
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 6
    ordinal: 18526
    text: Add thou not unto His words, Lest He reprove thee, and thou be found a liar.
    translation: JPS 1917
    original: אַל־תּוֹסְףְּ עַל־דְּבָרָיו פֶּן־יוֹכִיחַ בְּךָ וְנִכְזָבְתָּ׃
    hebrewPlain: אל תוסף על דבריו פן יוכיח בך ונכזבת
    kjvRefs:
    - Proverbs 30:6
    kjvOsis:
    - Prov.30.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.7
    scripture: tanakh
    name: Tanakh Proverbs 30:7
    ref: Proverbs 30:7
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 7
    ordinal: 18527
    text: 'Two things have I asked of Thee; Deny me them not before I die:'
    translation: JPS 1917
    original: שְׁתַּיִם שָׁאַלְתִּי מֵאִתָּךְ אַל־תִּמְנַע מִמֶּנִּי בְּטֶרֶם אָמוּת׃
    hebrewPlain: שתים שאלתי מאתך אל תמנע ממני בטרם אמות
    kjvRefs:
    - Proverbs 30:7
    kjvOsis:
    - Prov.30.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.8
    scripture: tanakh
    name: Tanakh Proverbs 30:8
    ref: Proverbs 30:8
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 8
    ordinal: 18528
    text: Remove far from me falsehood and lies; Give me neither poverty nor riches; feed me with mine allotted bread;
    translation: JPS 1917
    original: שָׁוְא וּדְבַר־כָּזָב הַרְחֵק מִמֶּנִּי רֵאשׁ וָעֹשֶׁר אַל־תִּתֶּן־לִי הַטְרִיפֵנִי לֶחֶם חֻקִּי׃
    hebrewPlain: שוא ודבר כזב הרחק ממני ראש ועשר אל תתן לי הטריפני לחם חקי
    kjvRefs:
    - Proverbs 30:8
    kjvOsis:
    - Prov.30.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.9
    scripture: tanakh
    name: Tanakh Proverbs 30:9
    ref: Proverbs 30:9
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 9
    ordinal: 18529
    text: 'Lest I be full, and deny, and say: ‘Who is the LORD?’ Or lest I be poor, and steal, And profane the name of my God.'
    translation: JPS 1917
    original: פֶּן אֶשְׂבַּע וְכִחַשְׁתִּי וְאָמַרְתִּי מִי יְהוָה וּפֶן־אִוָּרֵשׁ וְגָנַבְתִּי וְתָפַשְׂתִּי שֵׁם אֱלֹהָי׃
    hebrewPlain: פן אשבע וכחשתי ואמרתי מי יהוה ופן אורש וגנבתי ותפשתי שם אלהי
    kjvRefs:
    - Proverbs 30:9
    kjvOsis:
    - Prov.30.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.10
    scripture: tanakh
    name: Tanakh Proverbs 30:10
    ref: Proverbs 30:10
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 10
    ordinal: 18530
    text: Slander not a servant unto his master, Lest he curse thee, and thou be found guilty.
    translation: JPS 1917
    original: אַל־תַּלְשֵׁן עֶבֶד אֶל־אדנו [אֲדֹנָיו] פֶּן־יְקַלֶּלְךָ וְאָשָׁמְתָּ׃
    hebrewPlain: אל תלשן עבד אל אדנו [אדניו] פן יקללך ואשמת
    kjvRefs:
    - Proverbs 30:10
    kjvOsis:
    - Prov.30.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.11
    scripture: tanakh
    name: Tanakh Proverbs 30:11
    ref: Proverbs 30:11
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 11
    ordinal: 18531
    text: There is a generation that curse their father, And do not bless their mother.
    translation: JPS 1917
    original: דּוֹר אָבִיו יְקַלֵּל וְאֶת־אִמּוֹ לֹא יְבָרֵךְ׃
    hebrewPlain: דור אביו יקלל ואת אמו לא יברך
    kjvRefs:
    - Proverbs 30:11
    kjvOsis:
    - Prov.30.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.12
    scripture: tanakh
    name: Tanakh Proverbs 30:12
    ref: Proverbs 30:12
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 12
    ordinal: 18532
    text: There is a generation that are pure in their own eyes, And yet are not washed from their filthiness.
    translation: JPS 1917
    original: דּוֹר טָהוֹר בְּעֵינָיו וּמִצֹּאָתוֹ לֹא רֻחָץ׃
    hebrewPlain: דור טהור בעיניו ומצאתו לא רחץ
    kjvRefs:
    - Proverbs 30:12
    kjvOsis:
    - Prov.30.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.13
    scripture: tanakh
    name: Tanakh Proverbs 30:13
    ref: Proverbs 30:13
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 13
    ordinal: 18533
    text: There is a generation, Oh how lofty are their eyes! And their eyelids are lifted up.
    translation: JPS 1917
    original: דּוֹר מָה־רָמוּ עֵינָיו וְעַפְעַפָּיו יִנָּשֵׂאוּ׃
    hebrewPlain: דור מה רמו עיניו ועפעפיו ינשאו
    kjvRefs:
    - Proverbs 30:13
    kjvOsis:
    - Prov.30.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.14
    scripture: tanakh
    name: Tanakh Proverbs 30:14
    ref: Proverbs 30:14
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 14
    ordinal: 18534
    text: There is a generation whose teeth are as swords, and their great teeth as knives, To devour the poor from off the earth, and the needy from among men.
    translation: JPS 1917
    original: דּוֹר חֲרָבוֹת שִׁנָּיו וּמַאֲכָלוֹת מְתַלְּעֹתָיו לֶאֱכֹל עֲנִיִּים מֵאֶרֶץ וְאֶבְיוֹנִים מֵאָדָם׃
    hebrewPlain: דור חרבות שניו ומאכלות מתלעתיו לאכל עניים מארץ ואביונים מאדם
    kjvRefs:
    - Proverbs 30:14
    kjvOsis:
    - Prov.30.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.15
    scripture: tanakh
    name: Tanakh Proverbs 30:15
    ref: Proverbs 30:15
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 15
    ordinal: 18535
    text: 'The horseleech hath two daughters: ‘Give, give.’ There are three things that are never satisfied, Yea, four that say not: ‘Enough’:'
    translation: JPS 1917
    original: לַעֲלוּקָה שְׁתֵּי בָנוֹת הַב הַב שָׁלוֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה אַרְבַּע לֹא־אָמְרוּ הוֹן׃
    hebrewPlain: לעלוקה שתי בנות הב הב שלוש הנה לא תשבענה ארבע לא אמרו הון
    kjvRefs:
    - Proverbs 30:15
    kjvOsis:
    - Prov.30.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.16
    scripture: tanakh
    name: Tanakh Proverbs 30:16
    ref: Proverbs 30:16
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 16
    ordinal: 18536
    text: 'The grave; and the barren womb; The earth that is not satisfied with water; And the fire that saith not: ‘Enough.’'
    translation: JPS 1917
    original: שְׁאוֹל וְעֹצֶר רָחַם אֶרֶץ לֹא־שָׂבְעָה מַּיִם וְאֵשׁ לֹא־אָמְרָה הוֹן׃
    hebrewPlain: שאול ועצר רחם ארץ לא שבעה מים ואש לא אמרה הון
    kjvRefs:
    - Proverbs 30:16
    kjvOsis:
    - Prov.30.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.17
    scripture: tanakh
    name: Tanakh Proverbs 30:17
    ref: Proverbs 30:17
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 17
    ordinal: 18537
    text: The eye that mocketh at his father, And despiseth to obey his mother, The ravens of the valley shall pick it out, And the young vultures shall eat it.
    translation: JPS 1917
    original: עַיִן תִּלְעַג לְאָב וְתָבוּז לִיקֲּהַת־אֵם יִקְּרוּהָ עֹרְבֵי־נַחַל וְיֹאכְלוּהָ בְנֵי־נָשֶׁר׃
    hebrewPlain: עין תלעג לאב ותבוז ליקהת אם יקרוה ערבי נחל ויאכלוה בני נשר
    kjvRefs:
    - Proverbs 30:17
    kjvOsis:
    - Prov.30.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.18
    scripture: tanakh
    name: Tanakh Proverbs 30:18
    ref: Proverbs 30:18
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 18
    ordinal: 18538
    text: 'There are three things which are too wonderful for me, Yea, four which I know not:'
    translation: JPS 1917
    original: שְׁלֹשָׁה הֵמָּה נִפְלְאוּ מִמֶּנִּי וארבע [וְאַרְבָּעָה] לֹא יְדַעְתִּים׃
    hebrewPlain: שלשה המה נפלאו ממני וארבע [וארבעה] לא ידעתים
    kjvRefs:
    - Proverbs 30:18
    kjvOsis:
    - Prov.30.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.19
    scripture: tanakh
    name: Tanakh Proverbs 30:19
    ref: Proverbs 30:19
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 19
    ordinal: 18539
    text: The way of an eagle in the air; The way of a serpent upon a rock; The way of a ship in the midst of the sea; And the way of a man with a young woman.
    translation: JPS 1917
    original: דֶּרֶךְ הַנֶּשֶׁר בַּשָּׁמַיִם דֶּרֶךְ נָחָשׁ עֲלֵי צוּר דֶּרֶךְ־אֳנִיָּה בְלֶב־יָם וְדֶרֶךְ גֶּבֶר בְּעַלְמָה׃
    hebrewPlain: דרך הנשר בשמים דרך נחש עלי צור דרך אניה בלב ים ודרך גבר בעלמה
    kjvRefs:
    - Proverbs 30:19
    kjvOsis:
    - Prov.30.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.20
    scripture: tanakh
    name: Tanakh Proverbs 30:20
    ref: Proverbs 30:20
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 20
    ordinal: 18540
    text: 'So is the way of an adulterous woman; She eateth, and wipeth her mouth, And saith: ‘I have done no wickedness.’'
    translation: JPS 1917
    original: כֵּן דֶּרֶךְ אִשָּׁה מְנָאָפֶת אָכְלָה וּמָחֲתָה פִיהָ וְאָמְרָה לֹא־פָעַלְתִּי אָוֶן׃
    hebrewPlain: כן דרך אשה מנאפת אכלה ומחתה פיה ואמרה לא פעלתי און
    kjvRefs:
    - Proverbs 30:20
    kjvOsis:
    - Prov.30.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.21
    scripture: tanakh
    name: Tanakh Proverbs 30:21
    ref: Proverbs 30:21
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 21
    ordinal: 18541
    text: 'For three things the earth doth quake, And for four it cannot endure:'
    translation: JPS 1917
    original: תַּחַת שָׁלוֹשׁ רָגְזָה אֶרֶץ וְתַחַת אַרְבַּע לֹא־תוּכַל שְׂאֵת׃
    hebrewPlain: תחת שלוש רגזה ארץ ותחת ארבע לא תוכל שאת
    kjvRefs:
    - Proverbs 30:21
    kjvOsis:
    - Prov.30.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.22
    scripture: tanakh
    name: Tanakh Proverbs 30:22
    ref: Proverbs 30:22
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 22
    ordinal: 18542
    text: For a servant when he reigneth; And a churl when he is filled with food;
    translation: JPS 1917
    original: תַּחַת־עֶבֶד כִּי יִמְלוֹךְ וְנָבָל כִּי יִשְׂבַּע־לָחֶם׃
    hebrewPlain: תחת עבד כי ימלוך ונבל כי ישבע לחם
    kjvRefs:
    - Proverbs 30:22
    kjvOsis:
    - Prov.30.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.23
    scripture: tanakh
    name: Tanakh Proverbs 30:23
    ref: Proverbs 30:23
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 23
    ordinal: 18543
    text: For an odious woman when she is married; And a handmaid that is heir to her mistress.
    translation: JPS 1917
    original: תַּחַת שְׂנוּאָה כִּי תִבָּעֵל וְשִׁפְחָה כִּי־תִירַשׁ גְּבִרְתָּהּ׃
    hebrewPlain: תחת שנואה כי תבעל ושפחה כי תירש גברתה
    kjvRefs:
    - Proverbs 30:23
    kjvOsis:
    - Prov.30.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.24
    scripture: tanakh
    name: Tanakh Proverbs 30:24
    ref: Proverbs 30:24
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 24
    ordinal: 18544
    text: 'There are four things which are little upon the earth, But they are exceeding wise:'
    translation: JPS 1917
    original: אַרְבָּעָה הֵם קְטַנֵּי־אָרֶץ וְהֵמָּה חֲכָמִים מְחֻכָּמִים׃
    hebrewPlain: ארבעה הם קטני ארץ והמה חכמים מחכמים
    kjvRefs:
    - Proverbs 30:24
    kjvOsis:
    - Prov.30.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.25
    scripture: tanakh
    name: Tanakh Proverbs 30:25
    ref: Proverbs 30:25
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 25
    ordinal: 18545
    text: The ants are a people not strong, Yet they provide their food in the summer;
    translation: JPS 1917
    original: הַנְּמָלִים עַם לֹא־עָז וַיָּכִינוּ בַקַּיִץ לַחְמָם׃
    hebrewPlain: הנמלים עם לא עז ויכינו בקיץ לחמם
    kjvRefs:
    - Proverbs 30:25
    kjvOsis:
    - Prov.30.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.26
    scripture: tanakh
    name: Tanakh Proverbs 30:26
    ref: Proverbs 30:26
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 26
    ordinal: 18546
    text: The rock-badgers are but a feeble folk, Yet make they their houses in the crags;
    translation: JPS 1917
    original: שְׁפַנִּים עַם לֹא־עָצוּם וַיָּשִׂימוּ בַסֶּלַע בֵּיתָם׃
    hebrewPlain: שפנים עם לא עצום וישימו בסלע ביתם
    kjvRefs:
    - Proverbs 30:26
    kjvOsis:
    - Prov.30.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.27
    scripture: tanakh
    name: Tanakh Proverbs 30:27
    ref: Proverbs 30:27
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 27
    ordinal: 18547
    text: The locusts have no king, Yet go they forth all of them by bands;
    translation: JPS 1917
    original: מֶלֶךְ אֵין לָאַרְבֶּה וַיֵּצֵא חֹצֵץ כֻּלּוֹ׃
    hebrewPlain: מלך אין לארבה ויצא חצץ כלו
    kjvRefs:
    - Proverbs 30:27
    kjvOsis:
    - Prov.30.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.28
    scripture: tanakh
    name: Tanakh Proverbs 30:28
    ref: Proverbs 30:28
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 28
    ordinal: 18548
    text: The spider thou canst take with the hands, Yet is she in kings’ palaces.
    translation: JPS 1917
    original: שְׂמָמִית בְּיָדַיִם תְּתַפֵּשׂ וְהִיא בְּהֵיכְלֵי מֶלֶךְ׃
    hebrewPlain: שממית בידים תתפש והיא בהיכלי מלך
    kjvRefs:
    - Proverbs 30:28
    kjvOsis:
    - Prov.30.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.29
    scripture: tanakh
    name: Tanakh Proverbs 30:29
    ref: Proverbs 30:29
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 29
    ordinal: 18549
    text: 'There are three things which are stately in their march, Yea, four which are stately in going:'
    translation: JPS 1917
    original: שְׁלֹשָׁה הֵמָּה מֵיטִיבֵי צָעַד וְאַרְבָּעָה מֵיטִבֵי לָכֶת׃
    hebrewPlain: שלשה המה מיטיבי צעד וארבעה מיטבי לכת
    kjvRefs:
    - Proverbs 30:29
    kjvOsis:
    - Prov.30.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.30
    scripture: tanakh
    name: Tanakh Proverbs 30:30
    ref: Proverbs 30:30
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 30
    ordinal: 18550
    text: The lion, which is mightiest among beasts, And turneth not away for any;
    translation: JPS 1917
    original: לַיִשׁ גִּבּוֹר בַּבְּהֵמָה וְלֹא־יָשׁוּב מִפְּנֵי־כֹל׃
    hebrewPlain: ליש גבור בבהמה ולא ישוב מפני כל
    kjvRefs:
    - Proverbs 30:30
    kjvOsis:
    - Prov.30.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.31
    scripture: tanakh
    name: Tanakh Proverbs 30:31
    ref: Proverbs 30:31
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 31
    ordinal: 18551
    text: The greyhound; the he-goat also; And the king, against whom there is no rising up.
    translation: JPS 1917
    original: זַרְזִיר מָתְנַיִם אוֹ־תָיִשׁ וּמֶלֶךְ אַלְקוּם עִמּוֹ׃
    hebrewPlain: זרזיר מתנים או תיש ומלך אלקום עמו
    kjvRefs:
    - Proverbs 30:31
    kjvOsis:
    - Prov.30.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.32
    scripture: tanakh
    name: Tanakh Proverbs 30:32
    ref: Proverbs 30:32
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 32
    ordinal: 18552
    text: If thou hast done foolishly in lifting up thyself, Or if thou hast planned devices, lay thy hand upon thy mouth.
    translation: JPS 1917
    original: אִם־נָבַלְתָּ בְהִתְנַשֵּׂא וְאִם־זַמּוֹתָ יָד לְפֶה׃
    hebrewPlain: אם נבלת בהתנשא ואם זמות יד לפה
    kjvRefs:
    - Proverbs 30:32
    kjvOsis:
    - Prov.30.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.30.33
    scripture: tanakh
    name: Tanakh Proverbs 30:33
    ref: Proverbs 30:33
    book: Prov
    section: ketuvim
    chapter: 30
    verse: 33
    ordinal: 18553
    text: For the churning of milk bringeth forth curd, And the wringing of the nose bringeth forth blood; So the forcing of wrath bringeth forth strife.
    translation: JPS 1917
    original: כִּי מִיץ חָלָב יוֹצִיא חֶמְאָה וּמִיץ־אַף יוֹצִיא דָם וּמִיץ אַפַּיִם יוֹצִיא רִיב׃
    hebrewPlain: כי מיץ חלב יוציא חמאה ומיץ אף יוציא דם ומיץ אפים יוציא ריב
    kjvRefs:
    - Proverbs 30:33
    kjvOsis:
    - Prov.30.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.30
- type: TanakhVerse
  data:
    osis: Prov.31.1
    scripture: tanakh
    name: Tanakh Proverbs 31:1
    ref: Proverbs 31:1
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 1
    ordinal: 18554
    text: The words of king Lemuel; the burden wherewith his mother corrected him.
    translation: JPS 1917
    original: דִּבְרֵי לְמוּאֵל מֶלֶךְ מַשָּׂא אֲ‍שֶׁר־יִסְּרַתּוּ אִמּוֹ׃
    hebrewPlain: דברי למואל מלך משא א‍שר יסרתו אמו
    kjvRefs:
    - Proverbs 31:1
    kjvOsis:
    - Prov.31.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.2
    scripture: tanakh
    name: Tanakh Proverbs 31:2
    ref: Proverbs 31:2
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 2
    ordinal: 18555
    text: What, my son? and what, O son of my womb? And what, O son of my vows?
    translation: JPS 1917
    original: מַה־בְּרִי וּמַה־בַּר־בִּטְנִי וּמֶה בַּר־נְדָרָי׃
    hebrewPlain: מה ברי ומה בר בטני ומה בר נדרי
    kjvRefs:
    - Proverbs 31:2
    kjvOsis:
    - Prov.31.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.3
    scripture: tanakh
    name: Tanakh Proverbs 31:3
    ref: Proverbs 31:3
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 3
    ordinal: 18556
    text: Give not thy strength unto women, Nor thy ways to that which destroyeth kings.
    translation: JPS 1917
    original: אַל־תִּתֵּן לַנָּשִׁים חֵילֶךָ וּדְרָכֶיךָ לַמְחוֹת מְלָכִין׃
    hebrewPlain: אל תתן לנשים חילך ודרכיך למחות מלכין
    kjvRefs:
    - Proverbs 31:3
    kjvOsis:
    - Prov.31.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.4
    scripture: tanakh
    name: Tanakh Proverbs 31:4
    ref: Proverbs 31:4
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 4
    ordinal: 18557
    text: 'It is not for kings, O Lemuel, it is not for kings to drink wine: Nor for princes to say: ‘Where is strong drink?’'
    translation: JPS 1917
    original: אַל לַמְלָכִים לְמוֹאֵל אַל לַמְלָכִים שְׁתוֹ־יָיִן וּלְרוֹזְנִים או [אֵי] שֵׁכָר׃
    hebrewPlain: אל למלכים למואל אל למלכים שתו יין ולרוזנים או [אי] שכר
    kjvRefs:
    - Proverbs 31:4
    kjvOsis:
    - Prov.31.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.5
    scripture: tanakh
    name: Tanakh Proverbs 31:5
    ref: Proverbs 31:5
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 5
    ordinal: 18558
    text: Lest they drink, and forget that which is decreed, And pervert the justice due to any that is afflicted.
    translation: JPS 1917
    original: פֶּן־יִשְׁתֶּה וְיִשְׁכַּח מְחֻקָּק וִישַׁנֶּה דִּין כָּל־בְּנֵי־עֹנִי׃
    hebrewPlain: פן ישתה וישכח מחקק וישנה דין כל בני עני
    kjvRefs:
    - Proverbs 31:5
    kjvOsis:
    - Prov.31.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.6
    scripture: tanakh
    name: Tanakh Proverbs 31:6
    ref: Proverbs 31:6
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 6
    ordinal: 18559
    text: Give strong drink unto him that is ready to perish, And wine unto the bitter in soul;
    translation: JPS 1917
    original: תְּנוּ־שֵׁכָר לְאוֹבֵד וְיַיִן לְמָרֵי נָפֶשׁ׃
    hebrewPlain: תנו שכר לאובד ויין למרי נפש
    kjvRefs:
    - Proverbs 31:6
    kjvOsis:
    - Prov.31.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.7
    scripture: tanakh
    name: Tanakh Proverbs 31:7
    ref: Proverbs 31:7
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 7
    ordinal: 18560
    text: Let him drink, and forget his poverty, and remember his misery no more.
    translation: JPS 1917
    original: יִשְׁתֶּה וְיִשְׁכַּח רִישׁוֹ וַעֲמָלוֹ לֹא יִזְכָּר־עוֹד׃
    hebrewPlain: ישתה וישכח רישו ועמלו לא יזכר עוד
    kjvRefs:
    - Proverbs 31:7
    kjvOsis:
    - Prov.31.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.8
    scripture: tanakh
    name: Tanakh Proverbs 31:8
    ref: Proverbs 31:8
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 8
    ordinal: 18561
    text: Open thy mouth for the dumb, in the cause of all such as are appointed to destruction.
    translation: JPS 1917
    original: פְּתַח־פִּיךָ לְאִלֵּם אֶל־דִּין כָּל־בְּנֵי חֲלוֹף׃
    hebrewPlain: פתח פיך לאלם אל דין כל בני חלוף
    kjvRefs:
    - Proverbs 31:8
    kjvOsis:
    - Prov.31.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.9
    scripture: tanakh
    name: Tanakh Proverbs 31:9
    ref: Proverbs 31:9
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 9
    ordinal: 18562
    text: Open thy mouth, judge righteously, and plead the cause of the poor and needy.
    translation: JPS 1917
    original: פְּתַח־פִּיךָ שְׁפָט־צֶדֶק וְדִין עָנִי וְאֶבְיוֹן׃
    hebrewPlain: פתח פיך שפט צדק ודין עני ואביון
    kjvRefs:
    - Proverbs 31:9
    kjvOsis:
    - Prov.31.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.10
    scripture: tanakh
    name: Tanakh Proverbs 31:10
    ref: Proverbs 31:10
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 10
    ordinal: 18563
    text: A woman of valour who can find? For her price is far above rubies.
    translation: JPS 1917
    original: אֵשֶׁת־חַיִל מִי יִמְצָא וְרָחֹק מִפְּנִינִים מִכְרָהּ׃
    hebrewPlain: אשת חיל מי ימצא ורחק מפנינים מכרה
    kjvRefs:
    - Proverbs 31:10
    kjvOsis:
    - Prov.31.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.11
    scripture: tanakh
    name: Tanakh Proverbs 31:11
    ref: Proverbs 31:11
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 11
    ordinal: 18564
    text: The heart of her husband doth safely trust in her, and he hath no lack of gain.
    translation: JPS 1917
    original: בָּטַח בָּהּ לֵב בַּעְלָהּ וְשָׁלָל לֹא יֶחְסָר׃
    hebrewPlain: בטח בה לב בעלה ושלל לא יחסר
    kjvRefs:
    - Proverbs 31:11
    kjvOsis:
    - Prov.31.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.12
    scripture: tanakh
    name: Tanakh Proverbs 31:12
    ref: Proverbs 31:12
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 12
    ordinal: 18565
    text: She doeth him good and not evil all the days of her life.
    translation: JPS 1917
    original: גְּמָלַתְהוּ טוֹב וְלֹא־רָע כֹּל יְמֵי חַיֶּיה׃
    hebrewPlain: גמלתהו טוב ולא רע כל ימי חייה
    kjvRefs:
    - Proverbs 31:12
    kjvOsis:
    - Prov.31.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.13
    scripture: tanakh
    name: Tanakh Proverbs 31:13
    ref: Proverbs 31:13
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 13
    ordinal: 18566
    text: She seeketh wool and flax, and worketh willingly with her hands.
    translation: JPS 1917
    original: דָּרְשָׁה צֶמֶר וּפִשְׁתִּים וַתַּעַשׂ בְּחֵפֶץ כַּפֶּיהָ׃
    hebrewPlain: דרשה צמר ופשתים ותעש בחפץ כפיה
    kjvRefs:
    - Proverbs 31:13
    kjvOsis:
    - Prov.31.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.14
    scripture: tanakh
    name: Tanakh Proverbs 31:14
    ref: Proverbs 31:14
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 14
    ordinal: 18567
    text: She is like the merchant-ships; she bringeth her food from afar.
    translation: JPS 1917
    original: הָיְתָה כָּאֳנִיּוֹת סוֹחֵר מִמֶּרְחָק תָּבִיא לַחְמָהּ׃
    hebrewPlain: היתה כאניות סוחר ממרחק תביא לחמה
    kjvRefs:
    - Proverbs 31:14
    kjvOsis:
    - Prov.31.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.15
    scripture: tanakh
    name: Tanakh Proverbs 31:15
    ref: Proverbs 31:15
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 15
    ordinal: 18568
    text: She riseth also while it is yet night, and giveth food to her household, and a portion to her maidens.
    translation: JPS 1917
    original: וַתָּקָם בְּעוֹד לַיְלָה וַתִּתֵּן טֶרֶף לְבֵיתָהּ וְחֹק לְנַעֲרֹתֶיהָ׃
    hebrewPlain: ותקם בעוד לילה ותתן טרף לביתה וחק לנערתיה
    kjvRefs:
    - Proverbs 31:15
    kjvOsis:
    - Prov.31.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.16
    scripture: tanakh
    name: Tanakh Proverbs 31:16
    ref: Proverbs 31:16
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 16
    ordinal: 18569
    text: She considereth a field, and buyeth it; with the fruit of her hands she planteth a vineyard.
    translation: JPS 1917
    original: זָמְמָה שָׂדֶה וַתִּקָּחֵהוּ מִפְּרִי כַפֶּיהָ נטע [נָטְעָה] כָּרֶם׃
    hebrewPlain: זממה שדה ותקחהו מפרי כפיה נטע [נטעה] כרם
    kjvRefs:
    - Proverbs 31:16
    kjvOsis:
    - Prov.31.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.17
    scripture: tanakh
    name: Tanakh Proverbs 31:17
    ref: Proverbs 31:17
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 17
    ordinal: 18570
    text: She girdeth her loins with strength, And maketh strong her arms.
    translation: JPS 1917
    original: חָגְרָה בְעוֹז מָתְנֶיהָ וַתְּאַמֵּץ זְרֹעוֹתֶיהָ׃
    hebrewPlain: חגרה בעוז מתניה ותאמץ זרעותיה
    kjvRefs:
    - Proverbs 31:17
    kjvOsis:
    - Prov.31.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.31
- type: TanakhVerse
  data:
    osis: Prov.31.18
    scripture: tanakh
    name: Tanakh Proverbs 31:18
    ref: Proverbs 31:18
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 18
    ordinal: 18571
    text: She perceiveth that her merchandise is good; Her lamp goeth not out by night.
    translation: JPS 1917
    original: טָעֲמָה כִּי־טוֹב סַחְרָהּ לֹא־יִכְבֶּה בליל [בַלַּיְלָה] נֵרָהּ׃
    hebrewPlain: טעמה כי טוב סחרה לא יכבה בליל [בלילה] נרה
    kjvRefs:
    - Proverbs 31:18
    kjvOsis:
    - Prov.31.18
