  data:
    osis: Prov.31.31
    scripture: tanakh
    name: Tanakh Proverbs 31:31
    ref: Proverbs 31:31
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 31
    ordinal: 18584
    text: Give her of the fruit of her hands; And let her works praise her in the gates.
    translation: JPS 1917
    original: תְּנוּ־לָהּ מִפְּרִי יָדֶיהָ וִיהַלְלוּהָ בַשְּׁעָרִים מַעֲשֶׂיהָ׃
    hebrewPlain: תנו לה מפרי ידיה ויהללוה בשערים מעשיה
    kjvRefs:
    - Proverbs 31:31
    kjvOsis:
    - Prov.31.31
