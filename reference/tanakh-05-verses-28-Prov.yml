    name: Tanakh Proverbs 31:21
    ref: Proverbs 31:21
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 21
    ordinal: 18574
    text: She is not afraid of the snow for her household; For all her household are clothed with scarlet.
    translation: JPS 1917
    original: לֹא־תִירָא לְבֵיתָהּ מִשָּׁלֶג כִּי כָל־בֵּיתָהּ לָבֻשׁ שָׁנִים׃
    hebrewPlain: לא תירא לביתה משלג כי כל ביתה לבש שנים
    kjvRefs:
