- type: TanakhVerse
  data:
    osis: Prov.24.28
    scripture: tanakh
    name: Tanakh Proverbs 24:28
    ref: Proverbs 24:28
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 28
    ordinal: 18376
    text: Be not a witness against thy neighbour without cause; And deceive not with thy lips.
    translation: JPS 1917
    original: אַל־תְּהִי עֵד־חִנָּם בְּרֵעֶךָ וַהֲפִתִּיתָ בִּשְׂפָתֶיךָ׃
    hebrewPlain: אל תהי עד חנם ברעך והפתית בשפתיך
    kjvRefs:
    - Proverbs 24:28
    kjvOsis:
    - Prov.24.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.29
    scripture: tanakh
    name: Tanakh Proverbs 24:29
    ref: Proverbs 24:29
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 29
    ordinal: 18377
    text: 'Say not: ‘I will do so to him as he hath done to me; I will render to the man according to his work.’'
    translation: JPS 1917
    original: אַל־תֹּאמַר כַּאֲשֶׁר עָשָׂה־לִי כֵּן אֶעֱשֶׂה־לּוֹ אָשִׁיב לָאִישׁ כְּפָעֳלוֹ׃
    hebrewPlain: אל תאמר כאשר עשה לי כן אעשה לו אשיב לאיש כפעלו
    kjvRefs:
    - Proverbs 24:29
    kjvOsis:
    - Prov.24.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.30
    scripture: tanakh
    name: Tanakh Proverbs 24:30
    ref: Proverbs 24:30
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 30
    ordinal: 18378
    text: I went by the field of the slothful, And by the vineyard of the man void of understanding;
    translation: JPS 1917
    original: עַל־שְׂדֵה אִישׁ־עָצֵל עָבַרְתִּי וְעַל־כֶּרֶם אָדָם חֲסַר־לֵב׃
    hebrewPlain: על שדה איש עצל עברתי ועל כרם אדם חסר לב
    kjvRefs:
    - Proverbs 24:30
    kjvOsis:
    - Prov.24.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.31
    scripture: tanakh
    name: Tanakh Proverbs 24:31
    ref: Proverbs 24:31
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 31
    ordinal: 18379
    text: And, lo, it was all grown over with thistles, The face thereof was covered with nettles, And the stone wall thereof was broken down.
    translation: JPS 1917
    original: וְהִנֵּה עָלָה כֻלּוֹ קִמְּשֹׂנִים כָּסּוּ פָנָיו חֲרֻלִּים וְגֶדֶר אֲבָנָיו נֶהֱרָסָה׃
    hebrewPlain: והנה עלה כלו קמשנים כסו פניו חרלים וגדר אבניו נהרסה
    kjvRefs:
    - Proverbs 24:31
    kjvOsis:
    - Prov.24.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.32
    scripture: tanakh
    name: Tanakh Proverbs 24:32
    ref: Proverbs 24:32
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 32
    ordinal: 18380
    text: Then I beheld, and considered well; I saw, and received instruction.
    translation: JPS 1917
    original: וָאֶחֱזֶה אָנֹכִי אָשִׁית לִבִּי רָאִיתִי לָקַחְתִּי מוּסָר׃
    hebrewPlain: ואחזה אנכי אשית לבי ראיתי לקחתי מוסר
    kjvRefs:
    - Proverbs 24:32
    kjvOsis:
    - Prov.24.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.33
    scripture: tanakh
    name: Tanakh Proverbs 24:33
    ref: Proverbs 24:33
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 33
    ordinal: 18381
    text: ’Yet a little sleep, a little slumber, A little folding of the hands to sleep’—
    translation: JPS 1917
    original: מְעַט שֵׁנוֹת מְעַט תְּנוּמוֹת מְעַט חִבֻּק יָדַיִם לִשְׁכָּב׃
    hebrewPlain: מעט שנות מעט תנומות מעט חבק ידים לשכב
    kjvRefs:
    - Proverbs 24:33
    kjvOsis:
    - Prov.24.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.24.34
    scripture: tanakh
    name: Tanakh Proverbs 24:34
    ref: Proverbs 24:34
    book: Prov
    section: ketuvim
    chapter: 24
    verse: 34
    ordinal: 18382
    text: So shall thy poverty come as a runner, And thy want as an armed man.
    translation: JPS 1917
    original: וּבָא־מִתְהַלֵּךְ רֵישֶׁךָ וּמַחְסֹרֶיךָ כְּאִישׁ מָגֵן׃
    hebrewPlain: ובא מתהלך רישך ומחסריך כאיש מגן
    kjvRefs:
    - Proverbs 24:34
    kjvOsis:
    - Prov.24.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.24
- type: TanakhVerse
  data:
    osis: Prov.25.1
    scripture: tanakh
    name: Tanakh Proverbs 25:1
    ref: Proverbs 25:1
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 1
    ordinal: 18383
    text: These also are proverbs of Solomon, which the men of Hezekiah king of Judah copied out.
    translation: JPS 1917
    original: גַּם־אֵלֶּה מִשְׁלֵי שְׁלֹמֹה אֲשֶׁר הֶעְתִּיקוּ אַנְשֵׁי חִזְקִיָּה מֶלֶךְ־יְהוּדָה׃
    hebrewPlain: גם אלה משלי שלמה אשר העתיקו אנשי חזקיה מלך יהודה
    kjvRefs:
    - Proverbs 25:1
    kjvOsis:
    - Prov.25.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.2
    scripture: tanakh
    name: Tanakh Proverbs 25:2
    ref: Proverbs 25:2
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 2
    ordinal: 18384
    text: It is the glory of God to conceal a thing; but the glory of kings is to search out a matter.
    translation: JPS 1917
    original: כְּבֹד אֱלֹהִים הַסְתֵּר דָּבָר וּכְבֹד מְלָכִים חֲקֹר דָּבָר׃
    hebrewPlain: כבד אלהים הסתר דבר וכבד מלכים חקר דבר
    kjvRefs:
    - Proverbs 25:2
    kjvOsis:
    - Prov.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.3
    scripture: tanakh
    name: Tanakh Proverbs 25:3
    ref: Proverbs 25:3
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 3
    ordinal: 18385
    text: The heaven for height, and the earth for depth, and the heart of kings is unsearchable.
    translation: JPS 1917
    original: שָׁמַיִם לָרוּם וָאָרֶץ לָעֹמֶק וְלֵב מְלָכִים אֵין חֵקֶר׃
    hebrewPlain: שמים לרום וארץ לעמק ולב מלכים אין חקר
    kjvRefs:
    - Proverbs 25:3
    kjvOsis:
    - Prov.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.4
    scripture: tanakh
    name: Tanakh Proverbs 25:4
    ref: Proverbs 25:4
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 4
    ordinal: 18386
    text: Take away the dross from the silver, and there cometh forth a vessel for the refiner;
    translation: JPS 1917
    original: הָגוֹ סִיגִים מִכָּסֶף וַיֵּצֵא לַצֹּרֵף כֶּלִי׃
    hebrewPlain: הגו סיגים מכסף ויצא לצרף כלי
    kjvRefs:
    - Proverbs 25:4
    kjvOsis:
    - Prov.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.5
    scripture: tanakh
    name: Tanakh Proverbs 25:5
    ref: Proverbs 25:5
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 5
    ordinal: 18387
    text: Take away the wicked from before the king, and his throne shall be established in righteousness.
    translation: JPS 1917
    original: הָגוֹ רָשָׁע לִפְנֵי־מֶלֶךְ וְיִכּוֹן בַּצֶּדֶק כִּסְאוֹ׃
    hebrewPlain: הגו רשע לפני מלך ויכון בצדק כסאו
    kjvRefs:
    - Proverbs 25:5
    kjvOsis:
    - Prov.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.6
    scripture: tanakh
    name: Tanakh Proverbs 25:6
    ref: Proverbs 25:6
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 6
    ordinal: 18388
    text: Glorify not thyself in the presence of the king, and stand not in the place of great men;
    translation: JPS 1917
    original: אַל־תִּתְהַדַּר לִפְנֵי־מֶלֶךְ וּבִמְקוֹם גְּדֹלִים אַל־תַּעֲמֹד׃
    hebrewPlain: אל תתהדר לפני מלך ובמקום גדלים אל תעמד
    kjvRefs:
    - Proverbs 25:6
    kjvOsis:
    - Prov.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.7
    scripture: tanakh
    name: Tanakh Proverbs 25:7
    ref: Proverbs 25:7
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 7
    ordinal: 18389
    text: 'For better is it that it be said unto thee: ‘Come up hither’, than that thou shouldest be put lower in the presence of the prince, whom thine eyes have seen.'
    translation: JPS 1917
    original: כִּי טוֹב אֲמָר־לְךָ עֲ‍לֵה הֵנָּה מֵהַשְׁפִּילְךָ לִפְנֵי נָדִיב אֲשֶׁר רָאוּ עֵינֶיךָ׃
    hebrewPlain: כי טוב אמר לך ע‍לה הנה מהשפילך לפני נדיב אשר ראו עיניך
    kjvRefs:
    - Proverbs 25:7
    kjvOsis:
    - Prov.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.8
    scripture: tanakh
    name: Tanakh Proverbs 25:8
    ref: Proverbs 25:8
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 8
    ordinal: 18390
    text: Go not forth hastily to strive, lest thou know not what to do in the end thereof, when thy neighbour hath put thee to shame.
    translation: JPS 1917
    original: אַל־תֵּצֵא לָרִב מַהֵר פֶּן מַה־תַּעֲשֶׂה בְּאַחֲרִיתָהּ בְּהַכְלִים אֹתְךָ רֵעֶךָ׃
    hebrewPlain: אל תצא לרב מהר פן מה תעשה באחריתה בהכלים אתך רעך
    kjvRefs:
    - Proverbs 25:8
    kjvOsis:
    - Prov.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.9
    scripture: tanakh
    name: Tanakh Proverbs 25:9
    ref: Proverbs 25:9
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 9
    ordinal: 18391
    text: Debate thy cause with thy neighbour, but reveal not the secret of another;
    translation: JPS 1917
    original: רִיבְךָ רִיב אֶת־רֵעֶךָ וְסוֹד אַחֵר אַל־תְּגָל׃
    hebrewPlain: ריבך ריב את רעך וסוד אחר אל תגל
    kjvRefs:
    - Proverbs 25:9
    kjvOsis:
    - Prov.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.10
    scripture: tanakh
    name: Tanakh Proverbs 25:10
    ref: Proverbs 25:10
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 10
    ordinal: 18392
    text: Lest he that heareth it revile thee, and thine infamy turn not away.
    translation: JPS 1917
    original: פֶּן־יְחַסֶּדְךָ שֹׁמֵעַ וְדִבָּתְךָ לֹא תָשׁוּב׃
    hebrewPlain: פן יחסדך שמע ודבתך לא תשוב
    kjvRefs:
    - Proverbs 25:10
    kjvOsis:
    - Prov.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.11
    scripture: tanakh
    name: Tanakh Proverbs 25:11
    ref: Proverbs 25:11
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 11
    ordinal: 18393
    text: A word fitly spoken Is like apples of gold in settings of silver.
    translation: JPS 1917
    original: תַּפּוּחֵי זָהָב בְּמַשְׂכִּיּוֹת כָּסֶף דָּבָר דָּבֻר עַל־אָפְנָיו׃
    hebrewPlain: תפוחי זהב במשכיות כסף דבר דבר על אפניו
    kjvRefs:
    - Proverbs 25:11
    kjvOsis:
    - Prov.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.12
    scripture: tanakh
    name: Tanakh Proverbs 25:12
    ref: Proverbs 25:12
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 12
    ordinal: 18394
    text: As an ear-ring of gold, and an ornament of fine gold, So is a wise reprover upon an obedient ear.
    translation: JPS 1917
    original: נֶזֶם זָהָב וַחֲלִי־כָתֶם מוֹכִיחַ חָכָם עַל־אֹזֶן שֹׁמָעַת׃
    hebrewPlain: נזם זהב וחלי כתם מוכיח חכם על אזן שמעת
    kjvRefs:
    - Proverbs 25:12
    kjvOsis:
    - Prov.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.13
    scripture: tanakh
    name: Tanakh Proverbs 25:13
    ref: Proverbs 25:13
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 13
    ordinal: 18395
    text: As the cold of snow in the time of harvest, So is a faithful messenger to him that sendeth him; For he refresheth the soul of his master. .
    translation: JPS 1917
    original: כְּצִנַּת־שֶׁלֶג בְּיוֹם קָצִיר צִיר נֶאֱמָן לְשֹׁלְחָיו וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב׃
    hebrewPlain: כצנת שלג ביום קציר ציר נאמן לשלחיו ונפש אדניו ישיב
    kjvRefs:
    - Proverbs 25:13
    kjvOsis:
    - Prov.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.14
    scripture: tanakh
    name: Tanakh Proverbs 25:14
    ref: Proverbs 25:14
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 14
    ordinal: 18396
    text: As vapours and wind without rain, So is he that boasteth himself of a false gift.
    translation: JPS 1917
    original: נְשִׂיאִים וְרוּחַ וְגֶשֶׁם אָיִן אִישׁ מִתְהַלֵּל בְּמַתַּת־שָׁקֶר׃
    hebrewPlain: נשיאים ורוח וגשם אין איש מתהלל במתת שקר
    kjvRefs:
    - Proverbs 25:14
    kjvOsis:
    - Prov.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.15
    scripture: tanakh
    name: Tanakh Proverbs 25:15
    ref: Proverbs 25:15
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 15
    ordinal: 18397
    text: By long forbearing is a ruler persuaded, And a soft tongue breaketh the bone.
    translation: JPS 1917
    original: בְּאֹרֶךְ אַפַּיִם יְפֻתֶּה קָצִין וְלָשׁוֹן רַכָּה תִּשְׁבָּר־גָּרֶם׃
    hebrewPlain: בארך אפים יפתה קצין ולשון רכה תשבר גרם
    kjvRefs:
    - Proverbs 25:15
    kjvOsis:
    - Prov.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.16
    scripture: tanakh
    name: Tanakh Proverbs 25:16
    ref: Proverbs 25:16
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 16
    ordinal: 18398
    text: Hast thou found honey? eat so much as is sufficient for thee, Lest thou be filled therewith, and vomit it.
    translation: JPS 1917
    original: דְּבַשׁ מָצָאתָ אֱכֹל דַּיֶּךָּ פֶּן־תִּשְׂבָּעֶנּוּ וַהֲקֵאתוֹ׃
    hebrewPlain: דבש מצאת אכל דיך פן תשבענו והקאתו
    kjvRefs:
    - Proverbs 25:16
    kjvOsis:
    - Prov.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.17
    scripture: tanakh
    name: Tanakh Proverbs 25:17
    ref: Proverbs 25:17
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 17
    ordinal: 18399
    text: Let thy foot be seldom in thy neighbour’s house; Lest he be sated with thee, and hate thee.
    translation: JPS 1917
    original: הֹקַר רַגְלְךָ מִבֵּית רֵעֶךָ פֶּן־יִשְׂבָּעֲךָ וּשְׂנֵאֶךָ׃
    hebrewPlain: הקר רגלך מבית רעך פן ישבעך ושנאך
    kjvRefs:
    - Proverbs 25:17
    kjvOsis:
    - Prov.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.18
    scripture: tanakh
    name: Tanakh Proverbs 25:18
    ref: Proverbs 25:18
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 18
    ordinal: 18400
    text: As a maul, and a sword, and a sharp arrow, So is a man that beareth false witness against his neighbour.
    translation: JPS 1917
    original: מֵפִיץ וְחֶרֶב וְחֵץ שָׁנוּן אִישׁ עֹנֶה בְרֵעֵהוּ עֵד שָׁקֶר׃
    hebrewPlain: מפיץ וחרב וחץ שנון איש ענה ברעהו עד שקר
    kjvRefs:
    - Proverbs 25:18
    kjvOsis:
    - Prov.25.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.19
    scripture: tanakh
    name: Tanakh Proverbs 25:19
    ref: Proverbs 25:19
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 19
    ordinal: 18401
    text: Confidence in an unfaithful man in time of trouble Is like a broken tooth, and a foot out of joint.
    translation: JPS 1917
    original: שֵׁן רֹעָה וְרֶגֶל מוּעָדֶת מִבְטָח בּוֹגֵד בְּיוֹם צָרָה׃
    hebrewPlain: שן רעה ורגל מועדת מבטח בוגד ביום צרה
    kjvRefs:
    - Proverbs 25:19
    kjvOsis:
    - Prov.25.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.20
    scripture: tanakh
    name: Tanakh Proverbs 25:20
    ref: Proverbs 25:20
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 20
    ordinal: 18402
    text: As one that taketh off a garment in cold weather, and as vinegar upon nitre, So is he that singeth songs to a heavy heart.
    translation: JPS 1917
    original: מַעֲדֶה בֶּגֶד בְּיוֹם קָרָה חֹמֶץ עַל־נָתֶר וְשָׁר בַּשִּׁרִים עַל לֶב־רָע׃
    hebrewPlain: מעדה בגד ביום קרה חמץ על נתר ושר בשרים על לב רע
    kjvRefs:
    - Proverbs 25:20
    kjvOsis:
    - Prov.25.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.21
    scripture: tanakh
    name: Tanakh Proverbs 25:21
    ref: Proverbs 25:21
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 21
    ordinal: 18403
    text: If thine enemy be hungry, give him bread to eat, And if he be thirsty, give him water to drink;
    translation: JPS 1917
    original: אִם־רָעֵב שֹׂנַאֲךָ הַאֲכִלֵהוּ לָחֶם וְאִם־צָמֵא הַשְׁקֵהוּ מָיִם׃
    hebrewPlain: אם רעב שנאך האכלהו לחם ואם צמא השקהו מים
    kjvRefs:
    - Proverbs 25:21
    kjvOsis:
    - Prov.25.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.22
    scripture: tanakh
    name: Tanakh Proverbs 25:22
    ref: Proverbs 25:22
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 22
    ordinal: 18404
    text: For thou wilt heap coals of fire upon his head, And the LORD will reward thee.
    translation: JPS 1917
    original: כִּי גֶחָלִים אַתָּה חֹתֶה עַל־רֹאשׁוֹ וַיהוָה יְשַׁלֶּם־לָךְ׃
    hebrewPlain: כי גחלים אתה חתה על ראשו ויהוה ישלם לך
    kjvRefs:
    - Proverbs 25:22
    kjvOsis:
    - Prov.25.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.23
    scripture: tanakh
    name: Tanakh Proverbs 25:23
    ref: Proverbs 25:23
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 23
    ordinal: 18405
    text: The north wind bringeth forth rain, And a backbiting tongue an angry countenance.
    translation: JPS 1917
    original: רוּחַ צָפוֹן תְּחוֹלֵל גָּשֶׁם וּפָנִים נִזְעָמִים לְשׁוֹן סָתֶר׃
    hebrewPlain: רוח צפון תחולל גשם ופנים נזעמים לשון סתר
    kjvRefs:
    - Proverbs 25:23
    kjvOsis:
    - Prov.25.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.24
    scripture: tanakh
    name: Tanakh Proverbs 25:24
    ref: Proverbs 25:24
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 24
    ordinal: 18406
    text: It is better to dwell in a corner of the housetop, Than in a house in common with a contentious woman.
    translation: JPS 1917
    original: טוֹב שֶׁבֶת עַל־פִּנַּת־גָּג מֵאֵשֶׁת מדונים [מִדְיָנִים] וּבֵית חָבֶר׃
    hebrewPlain: טוב שבת על פנת גג מאשת מדונים [מדינים] ובית חבר
    kjvRefs:
    - Proverbs 25:24
    kjvOsis:
    - Prov.25.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.25
    scripture: tanakh
    name: Tanakh Proverbs 25:25
    ref: Proverbs 25:25
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 25
    ordinal: 18407
    text: As cold waters to a faint soul, So is good news from a far country.
    translation: JPS 1917
    original: מַיִם קָרִים עַל־נֶפֶשׁ עֲיֵפָה וּשְׁמוּעָה טוֹבָה מֵאֶרֶץ מֶרְחָק׃
    hebrewPlain: מים קרים על נפש עיפה ושמועה טובה מארץ מרחק
    kjvRefs:
    - Proverbs 25:25
    kjvOsis:
    - Prov.25.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.26
    scripture: tanakh
    name: Tanakh Proverbs 25:26
    ref: Proverbs 25:26
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 26
    ordinal: 18408
    text: As a troubled fountain, and a corrupted spring, So is a righteous man that giveth way before the wicked.
    translation: JPS 1917
    original: מַעְיָן נִרְפָּשׂ וּמָקוֹר מָשְׁחָת צַדִּיק מָט לִפְנֵי־רָשָׁע׃
    hebrewPlain: מעין נרפש ומקור משחת צדיק מט לפני רשע
    kjvRefs:
    - Proverbs 25:26
    kjvOsis:
    - Prov.25.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.27
    scripture: tanakh
    name: Tanakh Proverbs 25:27
    ref: Proverbs 25:27
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 27
    ordinal: 18409
    text: It is not good to eat much honey; So for men to search out their own glory is not glory.
    translation: JPS 1917
    original: אָכֹל דְּבַשׁ הַרְבּוֹת לֹא־טוֹב וְחֵקֶר כְּבֹדָם כָּבוֹד׃
    hebrewPlain: אכל דבש הרבות לא טוב וחקר כבדם כבוד
    kjvRefs:
    - Proverbs 25:27
    kjvOsis:
    - Prov.25.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.25.28
    scripture: tanakh
    name: Tanakh Proverbs 25:28
    ref: Proverbs 25:28
    book: Prov
    section: ketuvim
    chapter: 25
    verse: 28
    ordinal: 18410
    text: Like a city broken down and without a wall, So is he whose spirit is without restraint.
    translation: JPS 1917
    original: עִיר פְּרוּצָה אֵין חוֹמָה אִישׁ אֲשֶׁר אֵין מַעְצָר לְרוּחוֹ׃
    hebrewPlain: עיר פרוצה אין חומה איש אשר אין מעצר לרוחו
    kjvRefs:
    - Proverbs 25:28
    kjvOsis:
    - Prov.25.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.25
- type: TanakhVerse
  data:
    osis: Prov.26.1
    scripture: tanakh
    name: Tanakh Proverbs 26:1
    ref: Proverbs 26:1
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 1
    ordinal: 18411
    text: As snow in summer, and as rain in harvest, So honour is not seemly for a fool.
    translation: JPS 1917
    original: כַּשֶּׁלֶג בַּקַּיִץ וְכַמָּטָר בַּקָּצִיר כֵּן לֹא־נָאוֶה לִכְסִיל כָּבוֹד׃
    hebrewPlain: כשלג בקיץ וכמטר בקציר כן לא נאוה לכסיל כבוד
    kjvRefs:
    - Proverbs 26:1
    kjvOsis:
    - Prov.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.2
    scripture: tanakh
    name: Tanakh Proverbs 26:2
    ref: Proverbs 26:2
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 2
    ordinal: 18412
    text: As the wandering sparrow, as the flying swallow, So the curse that is causeless shall come home. .
    translation: JPS 1917
    original: כַּצִּפּוֹר לָנוּד כַּדְּרוֹר לָעוּף כֵּן קִלְלַת חִנָּם לא [לוֹ] תָבֹא׃
    hebrewPlain: כצפור לנוד כדרור לעוף כן קללת חנם לא [לו] תבא
    kjvRefs:
    - Proverbs 26:2
    kjvOsis:
    - Prov.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.3
    scripture: tanakh
    name: Tanakh Proverbs 26:3
    ref: Proverbs 26:3
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 3
    ordinal: 18413
    text: A whip for the horse, a bridle for the ass, And a rod for the back of fools.
    translation: JPS 1917
    original: שׁוֹט לַסּוּס מֶתֶג לַחֲמוֹר וְשֵׁבֶט לְגֵו כְּסִילִים׃
    hebrewPlain: שוט לסוס מתג לחמור ושבט לגו כסילים
    kjvRefs:
    - Proverbs 26:3
    kjvOsis:
    - Prov.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.4
    scripture: tanakh
    name: Tanakh Proverbs 26:4
    ref: Proverbs 26:4
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 4
    ordinal: 18414
    text: Answer not a fool according to his folly, Lest thou also be like unto him.
    translation: JPS 1917
    original: אַל־תַּעַן כְּסִיל כְּאִוַּלְתּוֹ פֶּן־תִּשְׁוֶה־לּוֹ גַם־אָתָּה׃
    hebrewPlain: אל תען כסיל כאולתו פן תשוה לו גם אתה
    kjvRefs:
    - Proverbs 26:4
    kjvOsis:
    - Prov.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.5
    scripture: tanakh
    name: Tanakh Proverbs 26:5
    ref: Proverbs 26:5
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 5
    ordinal: 18415
    text: Answer a fool according to his folly, Lest he be wise in his own eyes.
    translation: JPS 1917
    original: עֲנֵה כְסִיל כְּאִוַּלְתּוֹ פֶּן־יִהְיֶה חָכָם בְּעֵינָיו׃
    hebrewPlain: ענה כסיל כאולתו פן יהיה חכם בעיניו
    kjvRefs:
    - Proverbs 26:5
    kjvOsis:
    - Prov.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.6
    scripture: tanakh
    name: Tanakh Proverbs 26:6
    ref: Proverbs 26:6
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 6
    ordinal: 18416
    text: He that sendeth a message by the hand of a fool Cutteth off his own feet, and drinketh damage.
    translation: JPS 1917
    original: מְקַצֶּה רַגְלַיִם חָמָס שֹׁתֶה שֹׁלֵחַ דְּבָרִים בְּיַד־כְּסִיל׃
    hebrewPlain: מקצה רגלים חמס שתה שלח דברים ביד כסיל
    kjvRefs:
    - Proverbs 26:6
    kjvOsis:
    - Prov.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.7
    scripture: tanakh
    name: Tanakh Proverbs 26:7
    ref: Proverbs 26:7
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 7
    ordinal: 18417
    text: The legs hang limp from the lame; So is a parable in the mouth of fools.
    translation: JPS 1917
    original: דַּלְיוּ שֹׁקַיִם מִפִּסֵּחַ וּמָשָׁל בְּפִי כְסִילִים׃
    hebrewPlain: דליו שקים מפסח ומשל בפי כסילים
    kjvRefs:
    - Proverbs 26:7
    kjvOsis:
    - Prov.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.8
    scripture: tanakh
    name: Tanakh Proverbs 26:8
    ref: Proverbs 26:8
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 8
    ordinal: 18418
    text: As a small stone in a heap of stones, So is he that giveth honour to a fool.
    translation: JPS 1917
    original: כִּצְרוֹר אֶבֶן בְּמַרְגֵּמָה כֵּן־נוֹתֵן לִכְסִיל כָּבוֹד׃
    hebrewPlain: כצרור אבן במרגמה כן נותן לכסיל כבוד
    kjvRefs:
    - Proverbs 26:8
    kjvOsis:
    - Prov.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.9
    scripture: tanakh
    name: Tanakh Proverbs 26:9
    ref: Proverbs 26:9
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 9
    ordinal: 18419
    text: As a thorn that cometh into the hand of a drunkard, So is a parable in the mouth of fools.
    translation: JPS 1917
    original: חוֹחַ עָלָה בְיַד־שִׁכּוֹר וּמָשָׁל בְּפִי כְסִילִים׃
    hebrewPlain: חוח עלה ביד שכור ומשל בפי כסילים
    kjvRefs:
    - Proverbs 26:9
    kjvOsis:
    - Prov.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.10
    scripture: tanakh
    name: Tanakh Proverbs 26:10
    ref: Proverbs 26:10
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 10
    ordinal: 18420
    text: A master performeth all things; But he that stoppeth a fool is as one that stoppeth a flood.
    translation: JPS 1917
    original: רַב מְחוֹלֵל־כֹּל וְשֹׂכֵר כְּסִיל וְשֹׂכֵר עֹבְרִים׃
    hebrewPlain: רב מחולל כל ושכר כסיל ושכר עברים
    kjvRefs:
    - Proverbs 26:10
    kjvOsis:
    - Prov.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.11
    scripture: tanakh
    name: Tanakh Proverbs 26:11
    ref: Proverbs 26:11
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 11
    ordinal: 18421
    text: As a dog that returneth to his vomit, So is a fool that repeateth his folly.
    translation: JPS 1917
    original: כְּכֶלֶב שָׁב עַל־קֵאוֹ כְּסִיל שׁוֹנֶה בְאִוַּלְתּוֹ׃
    hebrewPlain: ככלב שב על קאו כסיל שונה באולתו
    kjvRefs:
    - Proverbs 26:11
    kjvOsis:
    - Prov.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.12
    scripture: tanakh
    name: Tanakh Proverbs 26:12
    ref: Proverbs 26:12
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 12
    ordinal: 18422
    text: Seest thou a man wise in his own eyes? There is more hope of a fool than of him.
    translation: JPS 1917
    original: רָאִיתָ אִישׁ חָכָם בְּעֵינָיו תִּקְוָה לִכְסִיל מִמֶּנּוּ׃
    hebrewPlain: ראית איש חכם בעיניו תקוה לכסיל ממנו
    kjvRefs:
    - Proverbs 26:12
    kjvOsis:
    - Prov.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.13
    scripture: tanakh
    name: Tanakh Proverbs 26:13
    ref: Proverbs 26:13
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 13
    ordinal: 18423
    text: 'The sluggard saith: ‘There is a lion in the way; Yea, a lion is in the streets.’'
    translation: JPS 1917
    original: אָמַר עָצֵל שַׁחַל בַּדָּרֶךְ אֲרִי בֵּין הָרְחֹבוֹת׃
    hebrewPlain: אמר עצל שחל בדרך ארי בין הרחבות
    kjvRefs:
    - Proverbs 26:13
    kjvOsis:
    - Prov.26.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.14
    scripture: tanakh
    name: Tanakh Proverbs 26:14
    ref: Proverbs 26:14
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 14
    ordinal: 18424
    text: The door is turning upon its hinges, And the sluggard is still upon his bed.
    translation: JPS 1917
    original: הַדֶּלֶת תִּסּוֹב עַל־צִירָהּ וְעָצֵל עַל־מִטָּתוֹ׃
    hebrewPlain: הדלת תסוב על צירה ועצל על מטתו
    kjvRefs:
    - Proverbs 26:14
    kjvOsis:
    - Prov.26.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
- type: TanakhVerse
  data:
    osis: Prov.26.15
    scripture: tanakh
