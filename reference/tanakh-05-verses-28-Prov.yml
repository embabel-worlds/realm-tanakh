    scripture: tanakh
    name: Tanakh Proverbs 26:16
    ref: Proverbs 26:16
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 16
    ordinal: 18426
    text: The sluggard is wiser in his own eyes Than seven men that give wise answer.
    translation: JPS 1917
    original: חָכָם עָצֵל בְּעֵינָיו מִשִּׁבְעָה מְשִׁיבֵי טָעַם׃
    hebrewPlain: חכם עצל בעיניו משבעה משיבי טעם
    kjvRefs:
    - Proverbs 26:16
    kjvOsis:
    - Prov.26.16
