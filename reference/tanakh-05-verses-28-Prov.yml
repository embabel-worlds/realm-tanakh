  data:
    osis: Prov.26.26
    scripture: tanakh
    name: Tanakh Proverbs 26:26
    ref: Proverbs 26:26
    book: Prov
    section: ketuvim
    chapter: 26
    verse: 26
    ordinal: 18436
    text: Though his hatred be concealed with deceit, His wickedness shall be revealed before the congregation.
    translation: JPS 1917
    original: תִּכַּסֶּה שִׂנְאָה בְּמַשָּׁאוֹן תִּגָּלֶה רָעָתוֹ בְקָהָל׃
    hebrewPlain: תכסה שנאה במשאון תגלה רעתו בקהל
    kjvRefs:
    - Proverbs 26:26
    kjvOsis:
    - Prov.26.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.26
