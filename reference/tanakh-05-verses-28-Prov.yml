    scripture: tanakh
    name: Tanakh Proverbs 10:8
    ref: Proverbs 10:8
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 17933
    text: The wise in heart will receive commandments; but a prating fool shall fall.
    translation: JPS 1917
    original: חֲכַם־לֵב יִקַּח מִצְוֺת וֶאֱוִיל שְׂפָתַיִם יִלָּבֵט׃
    hebrewPlain: חכם לב יקח מצות ואויל שפתים ילבט
