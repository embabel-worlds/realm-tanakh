    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.12
    scripture: tanakh
    name: Tanakh Proverbs 4:12
    ref: Proverbs 4:12
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 17771
    text: When thou goest, thy step shall not be straitened; And if thou runnest, thou shalt not stumble.
    translation: JPS 1917
    original: בְּלֶכְתְּךָ לֹא־יֵצַר צַעֲדֶךָ וְאִם־תָּרוּץ לֹא תִכָּשֵׁל׃
    hebrewPlain: בלכתך לא יצר צעדך ואם תרוץ לא תכשל
    kjvRefs:
    - Proverbs 4:12
    kjvOsis:
    - Prov.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.13
    scripture: tanakh
    name: Tanakh Proverbs 4:13
    ref: Proverbs 4:13
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 17772
    text: Take fast hold of instruction, let her not go; Keep her, for she is thy life.
    translation: JPS 1917
    original: הַחֲזֵק בַּמּוּסָר אַל־תֶּרֶף נִצְּרֶהָ כִּי־הִיא חַיֶּיךָ׃
    hebrewPlain: החזק במוסר אל תרף נצרה כי היא חייך
    kjvRefs:
    - Proverbs 4:13
    kjvOsis:
    - Prov.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.14
    scripture: tanakh
    name: Tanakh Proverbs 4:14
    ref: Proverbs 4:14
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 17773
    text: Enter not into the path of the wicked, And walk not in the way of evil men.
    translation: JPS 1917
    original: בְּאֹרַח רְשָׁעִים אַל־תָּבֹא וְאַל־תְּאַשֵּׁר בְּדֶרֶךְ רָעִים׃
    hebrewPlain: בארח רשעים אל תבא ואל תאשר בדרך רעים
    kjvRefs:
    - Proverbs 4:14
    kjvOsis:
    - Prov.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.15
    scripture: tanakh
    name: Tanakh Proverbs 4:15
    ref: Proverbs 4:15
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 17774
    text: Avoid it, pass not by it; Turn from it, and pass on.
    translation: JPS 1917
    original: פְּרָעֵהוּ אַל־תַּעֲבָר־בּוֹ שְׂטֵה מֵעָלָיו וַעֲבוֹר׃
    hebrewPlain: פרעהו אל תעבר בו שטה מעליו ועבור
    kjvRefs:
    - Proverbs 4:15
    kjvOsis:
    - Prov.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.16
    scripture: tanakh
    name: Tanakh Proverbs 4:16
    ref: Proverbs 4:16
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 17775
    text: For they sleep not, except they have done evil; And their sleep is taken away, unless they cause some to fall.
    translation: JPS 1917
    original: כִּי לֹא יִשְׁנוּ אִם־לֹא יָרֵעוּ וְנִגְזְלָה שְׁנָתָם אִם־לֹא יכשולו [יַכְשִׁילוּ׃]
    hebrewPlain: כי לא ישנו אם לא ירעו ונגזלה שנתם אם לא יכשולו [יכשילו]
    kjvRefs:
    - Proverbs 4:16
    kjvOsis:
    - Prov.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.17
    scripture: tanakh
    name: Tanakh Proverbs 4:17
    ref: Proverbs 4:17
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 17776
    text: For they eat the bread of wickedness, And drink the wine of violence.
    translation: JPS 1917
    original: כִּי לָחֲמוּ לֶחֶם רֶשַׁע וְיֵין חֲמָסִים יִשְׁתּוּ׃
    hebrewPlain: כי לחמו לחם רשע ויין חמסים ישתו
    kjvRefs:
    - Proverbs 4:17
    kjvOsis:
    - Prov.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.18
    scripture: tanakh
    name: Tanakh Proverbs 4:18
    ref: Proverbs 4:18
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 17777
    text: But the path of the righteous is as the light of dawn, That shineth more and more unto the perfect day.
    translation: JPS 1917
    original: וְאֹרַח צַדִּיקִים כְּאוֹר נֹגַהּ הוֹלֵךְ וָאוֹר עַד־נְכוֹן הַיּוֹם׃
    hebrewPlain: וארח צדיקים כאור נגה הולך ואור עד נכון היום
    kjvRefs:
    - Proverbs 4:18
    kjvOsis:
    - Prov.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.19
    scripture: tanakh
    name: Tanakh Proverbs 4:19
    ref: Proverbs 4:19
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 17778
    text: The way of the wicked is as darkness; They know not at what they stumble.
    translation: JPS 1917
    original: דֶּרֶךְ רְשָׁעִים כָּאֲפֵלָה לֹא יָדְעוּ בַּמֶּה יִכָּשֵׁלוּ׃
    hebrewPlain: דרך רשעים כאפלה לא ידעו במה יכשלו
    kjvRefs:
    - Proverbs 4:19
    kjvOsis:
    - Prov.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.20
    scripture: tanakh
    name: Tanakh Proverbs 4:20
    ref: Proverbs 4:20
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 17779
    text: My son, attend to my words; Incline thine ear unto my sayings.
    translation: JPS 1917
    original: בְּנִי לִדְבָרַי הַקְשִׁיבָה לַאֲמָרַי הַט־אָזְנֶךָ׃
    hebrewPlain: בני לדברי הקשיבה לאמרי הט אזנך
    kjvRefs:
    - Proverbs 4:20
    kjvOsis:
    - Prov.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.21
    scripture: tanakh
    name: Tanakh Proverbs 4:21
    ref: Proverbs 4:21
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 17780
    text: Let them not depart from thine eyes; Keep them in the midst of thy heart.
    translation: JPS 1917
    original: אַל־יַלִּיזוּ מֵעֵינֶיךָ שָׁמְרֵם בְּתוֹךְ לְבָבֶךָ׃
    hebrewPlain: אל יליזו מעיניך שמרם בתוך לבבך
    kjvRefs:
    - Proverbs 4:21
    kjvOsis:
    - Prov.4.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.22
    scripture: tanakh
    name: Tanakh Proverbs 4:22
    ref: Proverbs 4:22
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 17781
    text: For they are life unto those that find them, And health to all their flesh.
    translation: JPS 1917
    original: כִּי־חַיִּים הֵם לְמֹצְאֵיהֶם וּלְכָל־בְּשָׂרוֹ מַרְפֵּא׃
    hebrewPlain: כי חיים הם למצאיהם ולכל בשרו מרפא
    kjvRefs:
    - Proverbs 4:22
    kjvOsis:
    - Prov.4.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.23
    scripture: tanakh
    name: Tanakh Proverbs 4:23
    ref: Proverbs 4:23
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 23
    ordinal: 17782
    text: Above all that thou guardest keep thy heart; For out of it are the issues of life.
    translation: JPS 1917
    original: מִכָּל־מִשְׁמָר נְצֹר לִבֶּךָ כִּי־מִמֶּנּוּ תּוֹצְאוֹת חַיִּים׃
    hebrewPlain: מכל משמר נצר לבך כי ממנו תוצאות חיים
    kjvRefs:
    - Proverbs 4:23
    kjvOsis:
    - Prov.4.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.24
    scripture: tanakh
    name: Tanakh Proverbs 4:24
    ref: Proverbs 4:24
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 24
    ordinal: 17783
    text: Put away from thee a froward mouth, And perverse lips put far from thee.
    translation: JPS 1917
    original: הָסֵר מִמְּךָ עִקְּשׁוּת פֶּה וּלְזוּת שְׂפָתַיִם הַרְחֵק מִמֶּךָּ׃
    hebrewPlain: הסר ממך עקשות פה ולזות שפתים הרחק ממך
    kjvRefs:
    - Proverbs 4:24
    kjvOsis:
    - Prov.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.25
    scripture: tanakh
    name: Tanakh Proverbs 4:25
    ref: Proverbs 4:25
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 25
    ordinal: 17784
    text: Let thine eyes look right on, And let thine eyelids look straight before thee.
    translation: JPS 1917
    original: עֵינֶיךָ לְנֹכַח יַבִּיטוּ וְעַפְעַפֶּיךָ יַיְשִׁרוּ נֶגְדֶּךָ׃
    hebrewPlain: עיניך לנכח יביטו ועפעפיך יישרו נגדך
    kjvRefs:
    - Proverbs 4:25
    kjvOsis:
    - Prov.4.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.26
    scripture: tanakh
    name: Tanakh Proverbs 4:26
    ref: Proverbs 4:26
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 26
    ordinal: 17785
    text: Make plain the path of thy feet, And let all thy ways be established.
    translation: JPS 1917
    original: פַּלֵּס מַעְגַּל רַגְלֶךָ וְכָל־דְּרָכֶיךָ יִכֹּנוּ׃
    hebrewPlain: פלס מעגל רגלך וכל דרכיך יכנו
    kjvRefs:
    - Proverbs 4:26
    kjvOsis:
    - Prov.4.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.4.27
    scripture: tanakh
    name: Tanakh Proverbs 4:27
    ref: Proverbs 4:27
    book: Prov
    section: ketuvim
    chapter: 4
    verse: 27
    ordinal: 17786
    text: Turn not to the right hand nor to the left; Remove thy foot from evil.
    translation: JPS 1917
    original: אַל־תֵּט־יָמִין וּשְׂמֹאול הָסֵר רַגְלְךָ מֵרָע׃
    hebrewPlain: אל תט ימין ושמאול הסר רגלך מרע
    kjvRefs:
    - Proverbs 4:27
    kjvOsis:
    - Prov.4.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.4
- type: TanakhVerse
  data:
    osis: Prov.5.1
    scripture: tanakh
    name: Tanakh Proverbs 5:1
    ref: Proverbs 5:1
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 17787
    text: My son, attend unto my wisdom; Incline thine ear to my understanding;
    translation: JPS 1917
    original: בְּנִי לְחָכְמָתִי הַקְשִׁיבָה לִתְבוּנָתִי הַט־אָזְנֶךָ׃
    hebrewPlain: בני לחכמתי הקשיבה לתבונתי הט אזנך
    kjvRefs:
    - Proverbs 5:1
    kjvOsis:
    - Prov.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.2
    scripture: tanakh
    name: Tanakh Proverbs 5:2
    ref: Proverbs 5:2
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 17788
    text: That thou mayest preserve discretion, And that thy lips may keep knowledge.
    translation: JPS 1917
    original: לִשְׁמֹר מְזִמּוֹת וְדַעַת שְׂפָתֶיךָ יִנְצֹרוּ׃
    hebrewPlain: לשמר מזמות ודעת שפתיך ינצרו
    kjvRefs:
    - Proverbs 5:2
    kjvOsis:
    - Prov.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.3
    scripture: tanakh
    name: Tanakh Proverbs 5:3
    ref: Proverbs 5:3
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 17789
    text: For the lips of a strange woman drop honey, And her mouth is smoother than oil;
    translation: JPS 1917
    original: כִּי נֹפֶת תִּטֹּפְנָה שִׂפְתֵי זָרָה וְחָלָק מִשֶּׁמֶן חִכָּהּ׃
    hebrewPlain: כי נפת תטפנה שפתי זרה וחלק משמן חכה
    kjvRefs:
    - Proverbs 5:3
    kjvOsis:
    - Prov.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.4
    scripture: tanakh
    name: Tanakh Proverbs 5:4
    ref: Proverbs 5:4
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 17790
    text: But her end is bitter as wormwood, Sharp as a two-edged sword.
    translation: JPS 1917
    original: וְאַחֲרִיתָהּ מָרָה כַלַּעֲנָה חַדָּה כְּחֶרֶב פִּיּוֹת׃
    hebrewPlain: ואחריתה מרה כלענה חדה כחרב פיות
    kjvRefs:
    - Proverbs 5:4
    kjvOsis:
    - Prov.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.5
    scripture: tanakh
    name: Tanakh Proverbs 5:5
    ref: Proverbs 5:5
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 17791
    text: Her feet go down to death; Her steps take hold on the nether-world;
    translation: JPS 1917
    original: רַגְלֶיהָ יֹרְדוֹת מָוֶת שְׁאוֹל צְעָדֶיהָ יִתְמֹכוּ׃
    hebrewPlain: רגליה ירדות מות שאול צעדיה יתמכו
    kjvRefs:
    - Proverbs 5:5
    kjvOsis:
    - Prov.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.6
    scripture: tanakh
    name: Tanakh Proverbs 5:6
    ref: Proverbs 5:6
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 17792
    text: Lest she should walk the even path of life, Her ways wander, but she knoweth it not.
    translation: JPS 1917
    original: אֹרַח חַיִּים פֶּן־תְּפַלֵּס נָעוּ מַעְגְּלֹתֶיהָ לֹא תֵדָע׃
    hebrewPlain: ארח חיים פן תפלס נעו מעגלתיה לא תדע
    kjvRefs:
    - Proverbs 5:6
    kjvOsis:
    - Prov.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.7
    scripture: tanakh
    name: Tanakh Proverbs 5:7
    ref: Proverbs 5:7
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 17793
    text: Now therefore, O ye children, hearken unto me, And depart not from the words of my mouth.
    translation: JPS 1917
    original: וְעַתָּה בָנִים שִׁמְעוּ־לִי וְאַל־תָּסוּרוּ מֵאִמְרֵי־פִי׃
    hebrewPlain: ועתה בנים שמעו לי ואל תסורו מאמרי פי
    kjvRefs:
    - Proverbs 5:7
    kjvOsis:
    - Prov.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.8
    scripture: tanakh
    name: Tanakh Proverbs 5:8
    ref: Proverbs 5:8
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 17794
    text: Remove thy way far from her, And come not nigh the door of her house;
    translation: JPS 1917
    original: הַרְחֵק מֵעָלֶיהָ דַרְכֶּךָ וְאַל־תִּקְרַב אֶל־פֶּתַח בֵּיתָהּ׃
    hebrewPlain: הרחק מעליה דרכך ואל תקרב אל פתח ביתה
    kjvRefs:
    - Proverbs 5:8
    kjvOsis:
    - Prov.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.9
    scripture: tanakh
    name: Tanakh Proverbs 5:9
    ref: Proverbs 5:9
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 17795
    text: Lest thou give thy vigour unto others, And thy years unto the cruel;
    translation: JPS 1917
    original: פֶּן־תִּתֵּן לַאֲחֵרִים הוֹדֶךָ וּשְׁנֹתֶיךָ לְאַכְזָרִי׃
    hebrewPlain: פן תתן לאחרים הודך ושנתיך לאכזרי
    kjvRefs:
    - Proverbs 5:9
    kjvOsis:
    - Prov.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.10
    scripture: tanakh
    name: Tanakh Proverbs 5:10
    ref: Proverbs 5:10
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 17796
    text: Lest strangers be filled with thy strength, And thy labours be in the house of an alien;
    translation: JPS 1917
    original: פֶּן־יִשְׂבְּעוּ זָרִים כֹּחֶךָ וַעֲצָבֶיךָ בְּבֵית נָכְרִי׃
    hebrewPlain: פן ישבעו זרים כחך ועצביך בבית נכרי
    kjvRefs:
    - Proverbs 5:10
    kjvOsis:
    - Prov.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.11
    scripture: tanakh
    name: Tanakh Proverbs 5:11
    ref: Proverbs 5:11
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 17797
    text: And thou moan, when thine end cometh, When thy flesh and thy body are consumed,
    translation: JPS 1917
    original: וְנָהַמְתָּ בְאַחֲרִיתֶךָ בִּכְלוֹת בְּשָׂרְךָ וּשְׁאֵרֶךָ׃
    hebrewPlain: ונהמת באחריתך בכלות בשרך ושארך
    kjvRefs:
    - Proverbs 5:11
    kjvOsis:
    - Prov.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.12
    scripture: tanakh
    name: Tanakh Proverbs 5:12
    ref: Proverbs 5:12
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 17798
    text: 'And say: ‘How have I hated instruction, And my heart despised reproof;'
    translation: JPS 1917
    original: וְאָמַרְתָּ אֵיךְ שָׂנֵאתִי מוּסָר וְתוֹכַחַת נָאַץ לִבִּי׃
    hebrewPlain: ואמרת איך שנאתי מוסר ותוכחת נאץ לבי
    kjvRefs:
    - Proverbs 5:12
    kjvOsis:
    - Prov.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.13
    scripture: tanakh
    name: Tanakh Proverbs 5:13
    ref: Proverbs 5:13
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 17799
    text: Neither have I hearkened to the voice of my teachers, Nor inclined mine ear to them that instructed me!
    translation: JPS 1917
    original: וְלֹא־שָׁמַעְתִּי בְּקוֹל מוֹרָי וְלִמְלַמְּדַי לֹא־הִטִּיתִי אָזְנִי׃
    hebrewPlain: ולא שמעתי בקול מורי ולמלמדי לא הטיתי אזני
    kjvRefs:
    - Proverbs 5:13
    kjvOsis:
    - Prov.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.14
    scripture: tanakh
    name: Tanakh Proverbs 5:14
    ref: Proverbs 5:14
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 17800
    text: I was well nigh in all evil In the midst of the congregation and assembly.’
    translation: JPS 1917
    original: כִּמְעַט הָיִיתִי בְכָל־רָע בְּתוֹךְ קָהָל וְעֵדָה׃
    hebrewPlain: כמעט הייתי בכל רע בתוך קהל ועדה
    kjvRefs:
    - Proverbs 5:14
    kjvOsis:
    - Prov.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.15
    scripture: tanakh
    name: Tanakh Proverbs 5:15
    ref: Proverbs 5:15
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 17801
    text: Drink waters out of thine own cistern, And running waters out of thine own well.
    translation: JPS 1917
    original: שְׁתֵה־מַיִם מִבּוֹרֶךָ וְנֹזְלִים מִתּוֹךְ בְּאֵרֶךָ׃
    hebrewPlain: שתה מים מבורך ונזלים מתוך בארך
    kjvRefs:
    - Proverbs 5:15
    kjvOsis:
    - Prov.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.16
    scripture: tanakh
    name: Tanakh Proverbs 5:16
    ref: Proverbs 5:16
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 17802
    text: Let thy springs be dispersed abroad, And courses of water in the streets.
    translation: JPS 1917
    original: יָפוּצוּ מַעְיְנֹתֶיךָ חוּצָה בָּרְחֹבוֹת פַּלְגֵי־מָיִם׃
    hebrewPlain: יפוצו מעינתיך חוצה ברחבות פלגי מים
    kjvRefs:
    - Proverbs 5:16
    kjvOsis:
    - Prov.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.17
    scripture: tanakh
    name: Tanakh Proverbs 5:17
    ref: Proverbs 5:17
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 17803
    text: Let them be only thine own, And not strangers’ with thee.
    translation: JPS 1917
    original: יִהְיוּ־לְךָ לְבַדֶּךָ וְאֵין לְזָרִים אִתָּךְ׃
    hebrewPlain: יהיו לך לבדך ואין לזרים אתך
    kjvRefs:
    - Proverbs 5:17
    kjvOsis:
    - Prov.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.18
    scripture: tanakh
    name: Tanakh Proverbs 5:18
    ref: Proverbs 5:18
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 17804
    text: Let thy fountain be blessed; And have joy of the wife of thy youth.
    translation: JPS 1917
    original: יְהִי־מְקוֹרְךָ בָרוּךְ וּשְׂמַח מֵאֵשֶׁת נְעוּרֶךָ׃
    hebrewPlain: יהי מקורך ברוך ושמח מאשת נעורך
    kjvRefs:
    - Proverbs 5:18
    kjvOsis:
    - Prov.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.19
    scripture: tanakh
    name: Tanakh Proverbs 5:19
    ref: Proverbs 5:19
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 17805
    text: A lovely hind and a graceful doe, Let her breasts satisfy thee at all times; With her love be thou ravished always.
    translation: JPS 1917
    original: אַיֶּלֶת אֲהָבִים וְיַעֲלַת־חֵן דַּדֶּיהָ יְרַוֻּךָ בְכָל־עֵת בְּאַהֲבָתָהּ תִּשְׁגֶּה תָמִיד׃
    hebrewPlain: אילת אהבים ויעלת חן דדיה ירוך בכל עת באהבתה תשגה תמיד
    kjvRefs:
    - Proverbs 5:19
    kjvOsis:
    - Prov.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.20
    scripture: tanakh
    name: Tanakh Proverbs 5:20
    ref: Proverbs 5:20
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 20
    ordinal: 17806
    text: Why then wilt thou, my son, be ravished with a strange woman, And embrace the bosom of an alien?
    translation: JPS 1917
    original: וְלָמָּה תִשְׁגֶּה בְנִי בְזָרָה וּתְחַבֵּק חֵק נָכְרִיָּה׃
    hebrewPlain: ולמה תשגה בני בזרה ותחבק חק נכריה
    kjvRefs:
    - Proverbs 5:20
    kjvOsis:
    - Prov.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.21
    scripture: tanakh
    name: Tanakh Proverbs 5:21
    ref: Proverbs 5:21
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 21
    ordinal: 17807
    text: For the ways of man are before the eyes of the LORD, And He maketh even all his paths.
    translation: JPS 1917
    original: כִּי נֹכַח עֵינֵי יְהוָה דַּרְכֵי־אִישׁ וְכָל־מַעְגְּלֹתָיו מְפַלֵּס׃
    hebrewPlain: כי נכח עיני יהוה דרכי איש וכל מעגלתיו מפלס
    kjvRefs:
    - Proverbs 5:21
    kjvOsis:
    - Prov.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.22
    scripture: tanakh
    name: Tanakh Proverbs 5:22
    ref: Proverbs 5:22
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 22
    ordinal: 17808
    text: His own iniquities shall ensnare the wicked, And he shall be holden with the cords of his sin.
    translation: JPS 1917
    original: עַווֹנוֹתָיו יִלְכְּדֻנוֹ אֶת־הָרָשָׁע וּבְחַבְלֵי חַטָּאתוֹ יִתָּמֵךְ׃
    hebrewPlain: עוונותיו ילכדנו את הרשע ובחבלי חטאתו יתמך
    kjvRefs:
    - Proverbs 5:22
    kjvOsis:
    - Prov.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.5.23
    scripture: tanakh
    name: Tanakh Proverbs 5:23
    ref: Proverbs 5:23
    book: Prov
    section: ketuvim
    chapter: 5
    verse: 23
    ordinal: 17809
    text: He shall die for lack of instruction; And in the greatness of his folly he shall reel.
    translation: JPS 1917
    original: הוּא יָמוּת בְּאֵין מוּסָר וּבְרֹב אִוַּלְתּוֹ יִשְׁגֶּה׃
    hebrewPlain: הוא ימות באין מוסר וברב אולתו ישגה
    kjvRefs:
    - Proverbs 5:23
    kjvOsis:
    - Prov.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.5
- type: TanakhVerse
  data:
    osis: Prov.6.1
    scripture: tanakh
    name: Tanakh Proverbs 6:1
    ref: Proverbs 6:1
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 17810
    text: My son, if thou art become surety for thy neighbour, If thou hast struck thy hands for a stranger—
    translation: JPS 1917
    original: בְּנִי אִם־עָרַבְתָּ לְרֵעֶךָ תָּקַעְתָּ לַזָּר כַּפֶּיךָ׃
    hebrewPlain: בני אם ערבת לרעך תקעת לזר כפיך
    kjvRefs:
    - Proverbs 6:1
    kjvOsis:
    - Prov.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.2
    scripture: tanakh
    name: Tanakh Proverbs 6:2
    ref: Proverbs 6:2
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 17811
    text: Thou art snared by the words of thy mouth, Thou art caught by the words of thy mouth—
    translation: JPS 1917
    original: נוֹקַשְׁתָּ בְאִמְרֵי־פִיךָ נִלְכַּדְתָּ בְּאִמְרֵי־פִיךָ׃
    hebrewPlain: נוקשת באמרי פיך נלכדת באמרי פיך
    kjvRefs:
    - Proverbs 6:2
    kjvOsis:
    - Prov.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.3
    scripture: tanakh
    name: Tanakh Proverbs 6:3
    ref: Proverbs 6:3
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 17812
    text: Do this now, my son, and deliver thyself, Seeing thou art come into the hand of thy neighbour; Go, humble thyself, and urge thy neighbour.
    translation: JPS 1917
    original: עֲשֵׂה זֹאת אֵפוֹא בְּנִי וְהִנָּצֵל כִּי בָאתָ בְכַף־רֵעֶךָ לֵךְ הִתְרַפֵּס וּרְהַב רֵעֶיךָ׃
    hebrewPlain: עשה זאת אפוא בני והנצל כי באת בכף רעך לך התרפס ורהב רעיך
    kjvRefs:
    - Proverbs 6:3
    kjvOsis:
    - Prov.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.4
    scripture: tanakh
    name: Tanakh Proverbs 6:4
    ref: Proverbs 6:4
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 17813
    text: Give not sleep to thine eyes, nor slumber to thine eyelids.
    translation: JPS 1917
    original: אַל־תִּתֵּן שֵׁנָה לְעֵינֶיךָ וּתְנוּמָה לְעַפְעַפֶּיךָ׃
    hebrewPlain: אל תתן שנה לעיניך ותנומה לעפעפיך
    kjvRefs:
    - Proverbs 6:4
    kjvOsis:
    - Prov.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.5
    scripture: tanakh
    name: Tanakh Proverbs 6:5
    ref: Proverbs 6:5
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 17814
    text: Deliver thyself as a gazelle from the hand [of the hunter], And as a bird from the hand of the fowler.
    translation: JPS 1917
    original: הִנָּצֵל כִּצְבִי מִיָּד וּכְצִפּוֹר מִיַּד יָקוּשׁ׃
    hebrewPlain: הנצל כצבי מיד וכצפור מיד יקוש
    kjvRefs:
    - Proverbs 6:5
    kjvOsis:
    - Prov.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.6
    scripture: tanakh
    name: Tanakh Proverbs 6:6
    ref: Proverbs 6:6
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 17815
    text: Go to the ant, thou sluggard; Consider her ways, and be wise;
    translation: JPS 1917
    original: לֵךְ־אֶל־נְמָלָה עָצֵל רְאֵה דְרָכֶיהָ וַחֲכָם׃
    hebrewPlain: לך אל נמלה עצל ראה דרכיה וחכם
    kjvRefs:
    - Proverbs 6:6
    kjvOsis:
    - Prov.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.7
    scripture: tanakh
    name: Tanakh Proverbs 6:7
    ref: Proverbs 6:7
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 17816
    text: Which having no chief, Overseer, or ruler,
    translation: JPS 1917
    original: אֲשֶׁר אֵין־לָהּ קָצִין שֹׁטֵר וּמֹשֵׁל׃
    hebrewPlain: אשר אין לה קצין שטר ומשל
    kjvRefs:
    - Proverbs 6:7
    kjvOsis:
    - Prov.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.8
    scripture: tanakh
    name: Tanakh Proverbs 6:8
    ref: Proverbs 6:8
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 17817
    text: Provideth her bread in the summer, And gatherest her food in the harvest.
    translation: JPS 1917
    original: תָּכִין בַּקַּיִץ לַחְמָהּ אָגְרָה בַקָּצִיר מַאֲכָלָהּ׃
    hebrewPlain: תכין בקיץ לחמה אגרה בקציר מאכלה
    kjvRefs:
    - Proverbs 6:8
    kjvOsis:
    - Prov.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.9
    scripture: tanakh
    name: Tanakh Proverbs 6:9
    ref: Proverbs 6:9
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 17818
    text: How long wilt thou sleep, O sluggard? When wilt thou arise out of thy sleep?
    translation: JPS 1917
    original: עַד־מָתַי עָצֵל תִּשְׁכָּב מָתַי תָּקוּם מִשְּׁנָתֶךָ׃
    hebrewPlain: עד מתי עצל תשכב מתי תקום משנתך
    kjvRefs:
    - Proverbs 6:9
    kjvOsis:
    - Prov.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.10
    scripture: tanakh
    name: Tanakh Proverbs 6:10
    ref: Proverbs 6:10
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 17819
    text: ’Yet a little sleep, a little slumber, A little folding of the hands to sleep’—
    translation: JPS 1917
    original: מְעַט שֵׁנוֹת מְעַט תְּנוּמוֹת מְעַט חִבֻּק יָדַיִם לִשְׁכָּב׃
    hebrewPlain: מעט שנות מעט תנומות מעט חבק ידים לשכב
    kjvRefs:
    - Proverbs 6:10
    kjvOsis:
    - Prov.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.11
    scripture: tanakh
    name: Tanakh Proverbs 6:11
    ref: Proverbs 6:11
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 17820
    text: So shall thy poverty come as a runner, And thy want as an armed man.
    translation: JPS 1917
    original: וּבָא־כִמְהַלֵּךְ רֵאשֶׁךָ וּמַחְסֹרְךָ כְּאִישׁ מָגֵן׃
    hebrewPlain: ובא כמהלך ראשך ומחסרך כאיש מגן
    kjvRefs:
    - Proverbs 6:11
    kjvOsis:
    - Prov.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.12
    scripture: tanakh
    name: Tanakh Proverbs 6:12
    ref: Proverbs 6:12
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 17821
    text: A base person, a man of iniquity, Is he that walketh with a froward mouth; .
    translation: JPS 1917
    original: אָדָם בְּלִיַּעַל אִישׁ אָוֶן הוֹלֵךְ עִקְּשׁוּת פֶּה׃
    hebrewPlain: אדם בליעל איש און הולך עקשות פה
    kjvRefs:
    - Proverbs 6:12
    kjvOsis:
    - Prov.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.13
    scripture: tanakh
    name: Tanakh Proverbs 6:13
    ref: Proverbs 6:13
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 17822
    text: That winketh with his eyes, that scrapeth with his feet, That pointeth with his fingers;
    translation: JPS 1917
    original: קֹרֵץ בְּעֵינָו מֹלֵל בְּרַגְלָו מֹרֶה בְּאֶצְבְּעֹתָיו׃
    hebrewPlain: קרץ בעינו מלל ברגלו מרה באצבעתיו
    kjvRefs:
    - Proverbs 6:13
    kjvOsis:
    - Prov.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.14
    scripture: tanakh
    name: Tanakh Proverbs 6:14
    ref: Proverbs 6:14
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 17823
    text: Frowardness is in his heart, he deviseth evil continually; He soweth discord.
    translation: JPS 1917
    original: תַּהְפֻּכוֹת בְּלִבּוֹ חֹרֵשׁ רָע בְּכָל־עֵת מדנים [מִדְיָנִים] יְשַׁלֵּחַ׃
    hebrewPlain: תהפכות בלבו חרש רע בכל עת מדנים [מדינים] ישלח
    kjvRefs:
    - Proverbs 6:14
    kjvOsis:
    - Prov.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.15
    scripture: tanakh
    name: Tanakh Proverbs 6:15
    ref: Proverbs 6:15
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 17824
    text: Therefore shall his calamity come suddenly; On a sudden shall he be broken, and that without remedy.
    translation: JPS 1917
    original: עַל־כֵּן פִּתְאֹם יָבוֹא אֵידוֹ פֶּתַע יִשָּׁבֵר וְאֵין מַרְפֵּא׃
    hebrewPlain: על כן פתאם יבוא אידו פתע ישבר ואין מרפא
    kjvRefs:
    - Proverbs 6:15
    kjvOsis:
    - Prov.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.16
    scripture: tanakh
    name: Tanakh Proverbs 6:16
    ref: Proverbs 6:16
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 17825
    text: 'There are six things which the LORD hateth, Yea, seven which are an abomination unto Him:'
    translation: JPS 1917
    original: שֶׁשׁ־הֵנָּה שָׂנֵא יְהוָה וְשֶׁבַע תועבות [תּוֹעֲבַת] נַפְשׁוֹ׃
    hebrewPlain: שש הנה שנא יהוה ושבע תועבות [תועבת] נפשו
    kjvRefs:
    - Proverbs 6:16
    kjvOsis:
    - Prov.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.17
    scripture: tanakh
    name: Tanakh Proverbs 6:17
    ref: Proverbs 6:17
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 17826
    text: Haughty eyes, a lying tongue, And hands that shed innocent blood;
    translation: JPS 1917
    original: עֵינַיִם רָמוֹת לְשׁוֹן שָׁקֶר וְיָדַיִם שֹׁפְכוֹת דָּם־נָקִי׃
    hebrewPlain: עינים רמות לשון שקר וידים שפכות דם נקי
    kjvRefs:
    - Proverbs 6:17
    kjvOsis:
    - Prov.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.18
    scripture: tanakh
    name: Tanakh Proverbs 6:18
    ref: Proverbs 6:18
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 17827
    text: A heart that deviseth wicked thoughts, Feet that are swift in running to evil;
    translation: JPS 1917
    original: לֵב חֹרֵשׁ מַחְשְׁבוֹת אָוֶן רַגְלַיִם מְמַהֲרוֹת לָרוּץ לָרָעָה׃
    hebrewPlain: לב חרש מחשבות און רגלים ממהרות לרוץ לרעה
    kjvRefs:
    - Proverbs 6:18
    kjvOsis:
    - Prov.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.19
    scripture: tanakh
    name: Tanakh Proverbs 6:19
    ref: Proverbs 6:19
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 17828
    text: A false witness that breatheth out lies, And he that soweth discord among brethren.
    translation: JPS 1917
    original: יָפִיחַ כְּזָבִים עֵד שָׁקֶר וּמְשַׁלֵּחַ מְדָנִים בֵּין אַחִים׃
    hebrewPlain: יפיח כזבים עד שקר ומשלח מדנים בין אחים
    kjvRefs:
    - Proverbs 6:19
    kjvOsis:
    - Prov.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.20
    scripture: tanakh
    name: Tanakh Proverbs 6:20
    ref: Proverbs 6:20
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 20
    ordinal: 17829
    text: My son, keep the commandment of thy father, And forsake not the teaching of thy mother;
    translation: JPS 1917
    original: נְצֹר בְּנִי מִצְוַת אָבִיךָ וְאַל־תִּטֹּשׁ תּוֹרַת אִמֶּךָ׃
    hebrewPlain: נצר בני מצות אביך ואל תטש תורת אמך
    kjvRefs:
    - Proverbs 6:20
    kjvOsis:
    - Prov.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.21
    scripture: tanakh
    name: Tanakh Proverbs 6:21
    ref: Proverbs 6:21
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 21
    ordinal: 17830
    text: Bind them continually upon thy heart, Tie them about thy neck.
    translation: JPS 1917
    original: קָשְׁרֵם עַל־לִבְּךָ תָמִיד עָנְדֵם עַל־גַּרְגְּרֹתֶךָ׃
    hebrewPlain: קשרם על לבך תמיד ענדם על גרגרתך
    kjvRefs:
    - Proverbs 6:21
    kjvOsis:
    - Prov.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.22
    scripture: tanakh
    name: Tanakh Proverbs 6:22
    ref: Proverbs 6:22
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 22
    ordinal: 17831
    text: When thou walkest, it shall lead thee, When thou liest down, it shall watch over thee; And when thou awakest, it shall talk with thee.
    translation: JPS 1917
    original: בְּהִתְהַלֶּכְךָ תַּנְחֶה אֹתָךְ בְּשָׁכְבְּךָ תִּשְׁמֹר עָלֶיךָ וַהֲקִיצוֹתָ הִיא תְשִׂיחֶךָ׃
    hebrewPlain: בהתהלכך תנחה אתך בשכבך תשמר עליך והקיצות היא תשיחך
    kjvRefs:
    - Proverbs 6:22
    kjvOsis:
    - Prov.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.23
    scripture: tanakh
    name: Tanakh Proverbs 6:23
    ref: Proverbs 6:23
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 23
    ordinal: 17832
    text: For the commandment is a lamp, and the teaching is light, And reproofs of instruction are the way of life;
    translation: JPS 1917
    original: כִּי נֵר מִצְוָה וְתוֹרָה אוֹר וְדֶרֶךְ חַיִּים תּוֹכְחוֹת מוּסָר׃
    hebrewPlain: כי נר מצוה ותורה אור ודרך חיים תוכחות מוסר
    kjvRefs:
    - Proverbs 6:23
    kjvOsis:
    - Prov.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.24
    scripture: tanakh
    name: Tanakh Proverbs 6:24
    ref: Proverbs 6:24
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 24
    ordinal: 17833
    text: To keep thee from the evil woman, From the smoothness of the alien tongue.
    translation: JPS 1917
    original: לִשְׁמָרְךָ מֵאֵשֶׁת רָע מֵחֶלְקַת לָשׁוֹן נָכְרִיָּה׃
    hebrewPlain: לשמרך מאשת רע מחלקת לשון נכריה
    kjvRefs:
    - Proverbs 6:24
    kjvOsis:
    - Prov.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.25
    scripture: tanakh
    name: Tanakh Proverbs 6:25
    ref: Proverbs 6:25
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 25
    ordinal: 17834
    text: Lust not after her beauty in thy heart; Neither let her captivate thee with her eyelids.
    translation: JPS 1917
    original: אַל־תַּחְמֹד יָפְיָהּ בִּלְבָבֶךָ וְאַל־תִּקָּחֲךָ בְּעַפְעַפֶּיהָ׃
    hebrewPlain: אל תחמד יפיה בלבבך ואל תקחך בעפעפיה
    kjvRefs:
    - Proverbs 6:25
    kjvOsis:
    - Prov.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.26
    scripture: tanakh
    name: Tanakh Proverbs 6:26
    ref: Proverbs 6:26
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 26
    ordinal: 17835
    text: For on account of a harlot a man is brought to a loaf of bread, But the adulteress hunteth for the precious life.
    translation: JPS 1917
    original: כִּי בְעַד־אִשָּׁה זוֹנָה עַד־כִּכַּר לָחֶם וְאֵשֶׁת אִישׁ נֶפֶשׁ יְקָרָה תָצוּד׃
    hebrewPlain: כי בעד אשה זונה עד ככר לחם ואשת איש נפש יקרה תצוד
    kjvRefs:
    - Proverbs 6:26
    kjvOsis:
    - Prov.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.27
    scripture: tanakh
    name: Tanakh Proverbs 6:27
    ref: Proverbs 6:27
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 27
    ordinal: 17836
    text: Can a man take fire in his bosom, And his clothes not be burned?
    translation: JPS 1917
    original: הֲיַחְתֶּה אִישׁ אֵשׁ בְּחֵיקוֹ וּבְגָדָיו לֹא תִשָּׂרַפְנָה׃
    hebrewPlain: היחתה איש אש בחיקו ובגדיו לא תשרפנה
    kjvRefs:
    - Proverbs 6:27
    kjvOsis:
    - Prov.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.28
    scripture: tanakh
    name: Tanakh Proverbs 6:28
    ref: Proverbs 6:28
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 28
    ordinal: 17837
    text: Or can one walk upon hot coals, And his feet not be scorched?
    translation: JPS 1917
    original: אִם־יְהַלֵּךְ אִישׁ עַל־הַגֶּחָלִים וְרַגְלָיו לֹא תִכָּוֶינָה׃
    hebrewPlain: אם יהלך איש על הגחלים ורגליו לא תכוינה
    kjvRefs:
    - Proverbs 6:28
    kjvOsis:
    - Prov.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.29
    scripture: tanakh
    name: Tanakh Proverbs 6:29
    ref: Proverbs 6:29
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 29
    ordinal: 17838
    text: So he that goeth in to his neighbour’s wife; Whosoever toucheth her shall not go unpunished.
    translation: JPS 1917
    original: כֵּן הַבָּא אֶל־אֵשֶׁת רֵעֵהוּ לֹא יִנָּקֶה כָּל־הַנֹּגֵעַ בָּהּ׃
    hebrewPlain: כן הבא אל אשת רעהו לא ינקה כל הנגע בה
    kjvRefs:
    - Proverbs 6:29
    kjvOsis:
    - Prov.6.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.30
    scripture: tanakh
    name: Tanakh Proverbs 6:30
    ref: Proverbs 6:30
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 30
    ordinal: 17839
    text: Men do not despise a thief, if he steal To satisfy his soul when he is hungry;
    translation: JPS 1917
    original: לֹא־יָבוּזוּ לַגַּנָּב כִּי יִגְנוֹב לְמַלֵּא נַפְשׁוֹ כִּי יִרְעָב׃
    hebrewPlain: לא יבוזו לגנב כי יגנוב למלא נפשו כי ירעב
    kjvRefs:
    - Proverbs 6:30
    kjvOsis:
    - Prov.6.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.31
    scripture: tanakh
    name: Tanakh Proverbs 6:31
    ref: Proverbs 6:31
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 31
    ordinal: 17840
    text: But if he be found, he must restore sevenfold, He must give all the substance of his house.
    translation: JPS 1917
    original: וְנִמְצָא יְשַׁלֵּם שִׁבְעָתָיִם אֶת־כָּל־הוֹן בֵּיתוֹ יִתֵּן׃
    hebrewPlain: ונמצא ישלם שבעתים את כל הון ביתו יתן
    kjvRefs:
    - Proverbs 6:31
    kjvOsis:
    - Prov.6.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.32
    scripture: tanakh
    name: Tanakh Proverbs 6:32
    ref: Proverbs 6:32
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 32
    ordinal: 17841
    text: He that committeth adultery with a woman lacketh understanding; He doeth it that would destroy his own soul.
    translation: JPS 1917
    original: נֹאֵף אִשָּׁה חֲסַר־לֵב מַשְׁחִית נַפְשׁוֹ הוּא יַעֲשֶׂנָּה׃
    hebrewPlain: נאף אשה חסר לב משחית נפשו הוא יעשנה
    kjvRefs:
    - Proverbs 6:32
    kjvOsis:
    - Prov.6.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.33
    scripture: tanakh
    name: Tanakh Proverbs 6:33
    ref: Proverbs 6:33
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 33
    ordinal: 17842
    text: Wounds and dishonour shall he get, And his reproach shall not be wiped away. .
    translation: JPS 1917
    original: נֶגַע־וְקָלוֹן יִמְצָא וְחֶרְפָּתוֹ לֹא תִמָּחֶה׃
    hebrewPlain: נגע וקלון ימצא וחרפתו לא תמחה
    kjvRefs:
    - Proverbs 6:33
    kjvOsis:
    - Prov.6.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.34
    scripture: tanakh
    name: Tanakh Proverbs 6:34
    ref: Proverbs 6:34
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 34
    ordinal: 17843
    text: For jealousy is the rage of a man, And he will not spare in the day of vengeance.
    translation: JPS 1917
    original: כִּי־קִנְאָה חֲמַת־גָּבֶר וְלֹא־יַחְמוֹל בְּיוֹם נָקָם׃
    hebrewPlain: כי קנאה חמת גבר ולא יחמול ביום נקם
    kjvRefs:
    - Proverbs 6:34
    kjvOsis:
    - Prov.6.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.6.35
    scripture: tanakh
    name: Tanakh Proverbs 6:35
    ref: Proverbs 6:35
    book: Prov
    section: ketuvim
    chapter: 6
    verse: 35
    ordinal: 17844
    text: He will not regard any ransom; Neither will he rest content, though thou givest many gifts.
    translation: JPS 1917
    original: לֹא־יִשָּׂא פְּנֵי כָל־כֹּפֶר וְלֹא־יֹאבֶה כִּי תַרְבֶּה־שֹׁחַד׃
    hebrewPlain: לא ישא פני כל כפר ולא יאבה כי תרבה שחד
    kjvRefs:
    - Proverbs 6:35
    kjvOsis:
    - Prov.6.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.6
- type: TanakhVerse
  data:
    osis: Prov.7.1
    scripture: tanakh
    name: Tanakh Proverbs 7:1
    ref: Proverbs 7:1
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 17845
    text: My son, keep my words, And lay up my commandments with thee.
    translation: JPS 1917
    original: בְּנִי שְׁמֹר אֲמָרָי וּמִצְוֺתַי תִּצְפֹּן אִתָּךְ׃
    hebrewPlain: בני שמר אמרי ומצותי תצפן אתך
    kjvRefs:
    - Proverbs 7:1
    kjvOsis:
    - Prov.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.2
    scripture: tanakh
    name: Tanakh Proverbs 7:2
    ref: Proverbs 7:2
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 17846
    text: Keep my commandments and live, And my teaching as the apple of thine eye.
    translation: JPS 1917
    original: שְׁמֹר מִצְוֺתַי וֶחְיֵה וְתוֹרָתִי כְּאִישׁוֹן עֵינֶיךָ׃
    hebrewPlain: שמר מצותי וחיה ותורתי כאישון עיניך
    kjvRefs:
    - Proverbs 7:2
    kjvOsis:
    - Prov.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.3
    scripture: tanakh
    name: Tanakh Proverbs 7:3
    ref: Proverbs 7:3
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 17847
    text: Bind them upon thy fingers, Write them upon the table of thy heart.
    translation: JPS 1917
    original: קָשְׁרֵם עַל־אֶצְבְּעֹתֶיךָ כָּתְבֵם עַל־לוּחַ לִבֶּךָ׃
    hebrewPlain: קשרם על אצבעתיך כתבם על לוח לבך
    kjvRefs:
    - Proverbs 7:3
    kjvOsis:
    - Prov.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.4
    scripture: tanakh
    name: Tanakh Proverbs 7:4
    ref: Proverbs 7:4
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 17848
    text: 'Say unto wisdom: ‘Thou art my sister’, And call understanding thy kinswoman;'
    translation: JPS 1917
    original: אֱמֹר לַחָכְמָה אֲחֹתִי אָתְּ וּמֹדָע לַבִּינָה תִקְרָא׃
    hebrewPlain: אמר לחכמה אחתי את ומדע לבינה תקרא
    kjvRefs:
    - Proverbs 7:4
    kjvOsis:
    - Prov.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.5
    scripture: tanakh
    name: Tanakh Proverbs 7:5
    ref: Proverbs 7:5
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 17849
    text: That they may keep thee from the strange woman, From the alien woman that maketh smooth her words.
    translation: JPS 1917
    original: לִשְׁמָרְךָ מֵאִשָּׁה זָרָה מִנָּכְרִיָּה אֲמָרֶיהָ הֶחֱלִיקָה׃
    hebrewPlain: לשמרך מאשה זרה מנכריה אמריה החליקה
    kjvRefs:
    - Proverbs 7:5
    kjvOsis:
    - Prov.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.6
    scripture: tanakh
    name: Tanakh Proverbs 7:6
    ref: Proverbs 7:6
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 17850
    text: For at the window of my house I looked forth through my lattice;
    translation: JPS 1917
    original: כִּי בְּחַלּוֹן בֵּיתִי בְּעַד אֶשְׁנַבִּי נִשְׁקָפְתִּי׃
    hebrewPlain: כי בחלון ביתי בעד אשנבי נשקפתי
    kjvRefs:
    - Proverbs 7:6
    kjvOsis:
    - Prov.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.7
    scripture: tanakh
    name: Tanakh Proverbs 7:7
    ref: Proverbs 7:7
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 17851
    text: And I beheld among the thoughtless ones, I discerned among the youths, A young man void of understanding,
    translation: JPS 1917
    original: וָאֵרֶא בַפְּתָאיִם אָבִינָה בַבָּנִים נַעַר חֲסַר־לֵב׃
    hebrewPlain: וארא בפתאים אבינה בבנים נער חסר לב
    kjvRefs:
    - Proverbs 7:7
    kjvOsis:
    - Prov.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.8
    scripture: tanakh
    name: Tanakh Proverbs 7:8
    ref: Proverbs 7:8
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 17852
    text: Passing through the street near her corner, And he went the way to her house;
    translation: JPS 1917
    original: עֹבֵר בַּשּׁוּק אֵצֶל פִּנָּהּ וְדֶרֶךְ בֵּיתָהּ יִצְעָד׃
    hebrewPlain: עבר בשוק אצל פנה ודרך ביתה יצעד
    kjvRefs:
    - Proverbs 7:8
    kjvOsis:
    - Prov.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.9
    scripture: tanakh
    name: Tanakh Proverbs 7:9
    ref: Proverbs 7:9
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 17853
    text: In the twilight, in the evening of the day, In the blackness of night and the darkness.
    translation: JPS 1917
    original: בְּנֶשֶׁף־בְּעֶרֶב יוֹם בְּאִישׁוֹן לַיְלָה וַאֲפֵלָה׃
    hebrewPlain: בנשף בערב יום באישון לילה ואפלה
    kjvRefs:
    - Proverbs 7:9
    kjvOsis:
    - Prov.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.10
    scripture: tanakh
    name: Tanakh Proverbs 7:10
    ref: Proverbs 7:10
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 17854
    text: And, behold, there met him a woman With the attire of a harlot, and wily of heart.
    translation: JPS 1917
    original: וְהִנֵּה אִשָּׁה לִקְרָאתוֹ שִׁית זוֹנָה וּנְצֻרַת לֵב׃
    hebrewPlain: והנה אשה לקראתו שית זונה ונצרת לב
    kjvRefs:
    - Proverbs 7:10
    kjvOsis:
    - Prov.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.11
    scripture: tanakh
    name: Tanakh Proverbs 7:11
    ref: Proverbs 7:11
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 17855
    text: She is riotous and rebellious, Her feet abide not in her house;
    translation: JPS 1917
    original: הֹמִיָּה הִיא וְסֹרָרֶת בְּבֵיתָהּ לֹא־יִשְׁכְּנוּ רַגְלֶיהָ׃
    hebrewPlain: המיה היא וסררת בביתה לא ישכנו רגליה
    kjvRefs:
    - Proverbs 7:11
    kjvOsis:
    - Prov.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.12
    scripture: tanakh
    name: Tanakh Proverbs 7:12
    ref: Proverbs 7:12
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 17856
    text: Now she is in the streets, now in the broad places, And lieth in wait at every corner.
    translation: JPS 1917
    original: פַּעַם בַּחוּץ פַּעַם בָּרְחֹבוֹת וְאֵצֶל כָּל־פִּנָּה תֶאֱרֹב׃
    hebrewPlain: פעם בחוץ פעם ברחבות ואצל כל פנה תארב
    kjvRefs:
    - Proverbs 7:12
    kjvOsis:
    - Prov.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.13
    scripture: tanakh
    name: Tanakh Proverbs 7:13
    ref: Proverbs 7:13
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 17857
    text: 'So she caught him, and kissed him, And with an impudent face she said unto him:'
    translation: JPS 1917
    original: וְהֶחֱזִיקָה בּוֹ וְנָשְׁקָה־לּוֹ הֵעֵזָה פָנֶיהָ וַתֹּאמַר לוֹ׃
    hebrewPlain: והחזיקה בו ונשקה לו העזה פניה ותאמר לו
    kjvRefs:
    - Proverbs 7:13
    kjvOsis:
    - Prov.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.14
    scripture: tanakh
    name: Tanakh Proverbs 7:14
    ref: Proverbs 7:14
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 17858
    text: ’Sacrifices of peace-offerings were due from me; This day have I paid my vows.
    translation: JPS 1917
    original: זִבְחֵי שְׁלָמִים עָלָי הַיּוֹם שִׁלַּמְתִּי נְדָרָי׃
    hebrewPlain: זבחי שלמים עלי היום שלמתי נדרי
    kjvRefs:
    - Proverbs 7:14
    kjvOsis:
    - Prov.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.15
    scripture: tanakh
    name: Tanakh Proverbs 7:15
    ref: Proverbs 7:15
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 17859
    text: Therefore came I forth to meet thee, To seek thy face, and I have found thee.
    translation: JPS 1917
    original: עַל־כֵּן יָצָאתִי לִקְרָאתֶךָ לְשַׁחֵר פָּנֶיךָ וָאֶמְצָאֶךָּ׃
    hebrewPlain: על כן יצאתי לקראתך לשחר פניך ואמצאך
    kjvRefs:
    - Proverbs 7:15
    kjvOsis:
    - Prov.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.16
    scripture: tanakh
    name: Tanakh Proverbs 7:16
    ref: Proverbs 7:16
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 17860
    text: I have decked my couch with coverlets, With striped cloths of the yarn of Egypt.
    translation: JPS 1917
    original: מַרְבַדִּים רָבַדְתִּי עַרְשִׂי חֲטֻבוֹת אֵטוּן מִצְרָיִם׃
    hebrewPlain: מרבדים רבדתי ערשי חטבות אטון מצרים
    kjvRefs:
    - Proverbs 7:16
    kjvOsis:
    - Prov.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.17
    scripture: tanakh
    name: Tanakh Proverbs 7:17
    ref: Proverbs 7:17
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 17861
    text: I have perfumed my bed With myrrh, aloes, and cinnamon.
    translation: JPS 1917
    original: נַפְתִּי מִשְׁכָּבִי מֹר אֲהָלִים וְקִנָּמוֹן׃
    hebrewPlain: נפתי משכבי מר אהלים וקנמון
    kjvRefs:
    - Proverbs 7:17
    kjvOsis:
    - Prov.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.18
    scripture: tanakh
    name: Tanakh Proverbs 7:18
    ref: Proverbs 7:18
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 17862
    text: Come, let us take our fill of love until the morning; Let us solace ourselves with loves.
    translation: JPS 1917
    original: לְכָה נִרְוֶה דֹדִים עַד־הַבֹּקֶר נִתְעַלְּסָה בָּאֳהָבִים׃
    hebrewPlain: לכה נרוה דדים עד הבקר נתעלסה באהבים
    kjvRefs:
    - Proverbs 7:18
    kjvOsis:
    - Prov.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.19
    scripture: tanakh
    name: Tanakh Proverbs 7:19
    ref: Proverbs 7:19
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 17863
    text: For my husband is not at home, He is gone a long journey;
    translation: JPS 1917
    original: כִּי אֵין הָאִישׁ בְּבֵיתוֹ הָלַךְ בְּדֶרֶךְ מֵרָחוֹק׃
    hebrewPlain: כי אין האיש בביתו הלך בדרך מרחוק
    kjvRefs:
    - Proverbs 7:19
    kjvOsis:
    - Prov.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.20
    scripture: tanakh
    name: Tanakh Proverbs 7:20
    ref: Proverbs 7:20
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 17864
    text: He hath taken the bag of money with him; He will come home at the full moon.’
    translation: JPS 1917
    original: צְרוֹר־הַכֶּסֶף לָקַח בְּיָדוֹ לְיוֹם הַכֵּסֶא יָבֹא בֵיתוֹ׃
    hebrewPlain: צרור הכסף לקח בידו ליום הכסא יבא ביתו
    kjvRefs:
    - Proverbs 7:20
    kjvOsis:
    - Prov.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.21
    scripture: tanakh
    name: Tanakh Proverbs 7:21
    ref: Proverbs 7:21
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 17865
    text: With her much fair speech she causeth him to yield, With the blandishment of her lips she enticeth him away.
    translation: JPS 1917
    original: הִטַּתּוּ בְּרֹב לִקְחָהּ בְּחֵלֶק שְׂפָתֶיהָ תַּדִּיחֶנּוּ׃
    hebrewPlain: הטתו ברב לקחה בחלק שפתיה תדיחנו
    kjvRefs:
    - Proverbs 7:21
    kjvOsis:
    - Prov.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.22
    scripture: tanakh
    name: Tanakh Proverbs 7:22
    ref: Proverbs 7:22
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 22
    ordinal: 17866
    text: He goeth after her straightway, As an ox that goeth to the slaughter, Or as one in fetters to the correction of the fool;
    translation: JPS 1917
    original: הוֹלֵךְ אַחֲרֶיהָ פִּתְאֹם כְּשׁוֹר אֶל־טָבַח יָבוֹא וּכְעֶכֶס אֶל־מוּסַר אֱוִיל׃
    hebrewPlain: הולך אחריה פתאם כשור אל טבח יבוא וכעכס אל מוסר אויל
    kjvRefs:
    - Proverbs 7:22
    kjvOsis:
    - Prov.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.23
    scripture: tanakh
    name: Tanakh Proverbs 7:23
    ref: Proverbs 7:23
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 23
    ordinal: 17867
    text: Till an arrow strike through his liver; As a bird hasteneth to the snare— And knoweth not that it is at the cost of his life.
    translation: JPS 1917
    original: עַד יְפַלַּח חֵץ כְּבֵדוֹ כְּמַהֵר צִפּוֹר אֶל־פָּח וְלֹא־יָדַע כִּי־בְנַפְשׁוֹ הוּא׃
    hebrewPlain: עד יפלח חץ כבדו כמהר צפור אל פח ולא ידע כי בנפשו הוא
    kjvRefs:
    - Proverbs 7:23
    kjvOsis:
    - Prov.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.24
    scripture: tanakh
    name: Tanakh Proverbs 7:24
    ref: Proverbs 7:24
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 24
    ordinal: 17868
    text: Now therefore, O ye children, hearken unto me, And attend to the words of my mouth.
    translation: JPS 1917
    original: וְעַתָּה בָנִים שִׁמְעוּ־לִי וְהַקְשִׁיבוּ לְאִמְרֵי־פִי׃
    hebrewPlain: ועתה בנים שמעו לי והקשיבו לאמרי פי
    kjvRefs:
    - Proverbs 7:24
    kjvOsis:
    - Prov.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.25
    scripture: tanakh
    name: Tanakh Proverbs 7:25
    ref: Proverbs 7:25
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 25
    ordinal: 17869
    text: Let not thy heart decline to her ways, Go not astray in her paths.
    translation: JPS 1917
    original: אַל־יֵשְׂטְ אֶל־דְּרָכֶיהָ לִבֶּךָ אַל־תֵּתַע בִּנְתִיבוֹתֶיהָ׃
    hebrewPlain: אל ישט אל דרכיה לבך אל תתע בנתיבותיה
    kjvRefs:
    - Proverbs 7:25
    kjvOsis:
    - Prov.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.26
    scripture: tanakh
    name: Tanakh Proverbs 7:26
    ref: Proverbs 7:26
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 26
    ordinal: 17870
    text: For she hath cast down many wounded; Yea, a mighty host are all her slain.
    translation: JPS 1917
    original: כִּי־רַבִּים חֲלָלִים הִפִּילָה וַעֲצֻמִים כָּל־הֲרֻגֶיהָ׃
    hebrewPlain: כי רבים חללים הפילה ועצמים כל הרגיה
    kjvRefs:
    - Proverbs 7:26
    kjvOsis:
    - Prov.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.7.27
    scripture: tanakh
    name: Tanakh Proverbs 7:27
    ref: Proverbs 7:27
    book: Prov
    section: ketuvim
    chapter: 7
    verse: 27
    ordinal: 17871
    text: Her house is the way to the nether-world, Going down to the chambers of death.
    translation: JPS 1917
    original: דַּרְכֵי שְׁאוֹל בֵּיתָהּ יֹרְדוֹת אֶל־חַדְרֵי־מָוֶת׃
    hebrewPlain: דרכי שאול ביתה ירדות אל חדרי מות
    kjvRefs:
    - Proverbs 7:27
    kjvOsis:
    - Prov.7.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.7
- type: TanakhVerse
  data:
    osis: Prov.8.1
    scripture: tanakh
    name: Tanakh Proverbs 8:1
    ref: Proverbs 8:1
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 17872
    text: Doth not wisdom call, And understanding put forth her voice?
    translation: JPS 1917
    original: הֲלֹא־חָכְמָה תִקְרָא וּתְבוּנָה תִּתֵּן קוֹלָהּ׃
    hebrewPlain: הלא חכמה תקרא ותבונה תתן קולה
    kjvRefs:
    - Proverbs 8:1
    kjvOsis:
    - Prov.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.2
    scripture: tanakh
    name: Tanakh Proverbs 8:2
    ref: Proverbs 8:2
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 17873
    text: In the top of high places by the way, Where the paths meet, she standeth;
    translation: JPS 1917
    original: בְּרֹאשׁ־מְרוֹמִים עֲלֵי־דָרֶךְ בֵּית נְתִיבוֹת נִצָּבָה׃
    hebrewPlain: בראש מרומים עלי דרך בית נתיבות נצבה
    kjvRefs:
    - Proverbs 8:2
    kjvOsis:
    - Prov.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.3
    scripture: tanakh
    name: Tanakh Proverbs 8:3
    ref: Proverbs 8:3
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 17874
    text: 'Beside the gates, at the entry of the city, At the coming in at the doors, she crieth aloud:'
    translation: JPS 1917
    original: לְיַד־שְׁעָרִים לְפִי־קָרֶת מְבוֹא פְתָחִים תָּרֹנָּה׃
    hebrewPlain: ליד שערים לפי קרת מבוא פתחים תרנה
    kjvRefs:
    - Proverbs 8:3
    kjvOsis:
    - Prov.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.4
    scripture: tanakh
    name: Tanakh Proverbs 8:4
    ref: Proverbs 8:4
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 17875
    text: ’Unto you, O men, I call, And my voice is to the sons of men.
    translation: JPS 1917
    original: אֲלֵיכֶם אִישִׁים אֶקְרָא וְקוֹלִי אֶל־בְּנֵי אָדָם׃
    hebrewPlain: אליכם אישים אקרא וקולי אל בני אדם
    kjvRefs:
    - Proverbs 8:4
    kjvOsis:
    - Prov.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.5
    scripture: tanakh
    name: Tanakh Proverbs 8:5
    ref: Proverbs 8:5
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 17876
    text: O ye thoughtless, understand prudence, And, ye fools, be ye of an understanding heart.
    translation: JPS 1917
    original: הָבִינוּ פְתָאיִם עָרְמָה וּכְסִילִים הָבִינוּ לֵב׃
    hebrewPlain: הבינו פתאים ערמה וכסילים הבינו לב
    kjvRefs:
    - Proverbs 8:5
    kjvOsis:
    - Prov.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.6
    scripture: tanakh
    name: Tanakh Proverbs 8:6
    ref: Proverbs 8:6
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 17877
    text: Hear, for I will speak excellent things, And the opening of my lips shall be right things.
    translation: JPS 1917
    original: שִׁמְעוּ כִּי־נְגִידִים אֲדַבֵּר וּמִפְתַּח שְׂפָתַי מֵישָׁרִים׃
    hebrewPlain: שמעו כי נגידים אדבר ומפתח שפתי מישרים
    kjvRefs:
    - Proverbs 8:6
    kjvOsis:
    - Prov.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.7
    scripture: tanakh
    name: Tanakh Proverbs 8:7
    ref: Proverbs 8:7
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 17878
    text: For my mouth shall utter truth, And wickedness is an abomination to my lips.
    translation: JPS 1917
    original: כִּי־אֱמֶת יֶהְגֶּה חִכִּי וְתוֹעֲבַת שְׂפָתַי רֶשַׁע׃
    hebrewPlain: כי אמת יהגה חכי ותועבת שפתי רשע
    kjvRefs:
    - Proverbs 8:7
    kjvOsis:
    - Prov.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.8
    scripture: tanakh
    name: Tanakh Proverbs 8:8
    ref: Proverbs 8:8
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 17879
    text: All the words of my mouth are in righteousness, There is nothing perverse or crooked in them.
    translation: JPS 1917
    original: בְּצֶדֶק כָּל־אִמְרֵי־פִי אֵין בָּהֶם נִפְתָּל וְעִקֵּשׁ׃
    hebrewPlain: בצדק כל אמרי פי אין בהם נפתל ועקש
    kjvRefs:
    - Proverbs 8:8
    kjvOsis:
    - Prov.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.9
    scripture: tanakh
    name: Tanakh Proverbs 8:9
    ref: Proverbs 8:9
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 17880
    text: They are all plain to him that understandeth, And right to them that find knowledge.
    translation: JPS 1917
    original: כֻּלָּם נְכֹחִים לַמֵּבִין וִישָׁרִים לְמֹצְאֵי דָעַת׃
    hebrewPlain: כלם נכחים למבין וישרים למצאי דעת
    kjvRefs:
    - Proverbs 8:9
    kjvOsis:
    - Prov.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.10
    scripture: tanakh
    name: Tanakh Proverbs 8:10
    ref: Proverbs 8:10
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 17881
    text: Receive my instruction, and not silver, And knowledge rather than choice gold.
    translation: JPS 1917
    original: קְחוּ־מוּסָרִי וְאַל־כָּסֶף וְדַעַת מֵחָרוּץ נִבְחָר׃
    hebrewPlain: קחו מוסרי ואל כסף ודעת מחרוץ נבחר
    kjvRefs:
    - Proverbs 8:10
    kjvOsis:
    - Prov.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.11
    scripture: tanakh
    name: Tanakh Proverbs 8:11
    ref: Proverbs 8:11
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 17882
    text: For wisdom is better than rubies, And all things desirable are not to be compared unto her.
    translation: JPS 1917
    original: כִּי־טוֹבָה חָכְמָה מִפְּנִינִים וְכָל־חֲפָצִים לֹא יִשְׁווּ־בָהּ׃
    hebrewPlain: כי טובה חכמה מפנינים וכל חפצים לא ישוו בה
    kjvRefs:
    - Proverbs 8:11
    kjvOsis:
    - Prov.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.12
    scripture: tanakh
    name: Tanakh Proverbs 8:12
    ref: Proverbs 8:12
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 17883
    text: I wisdom dwell with prudence, And find out knowledge of devices.
    translation: JPS 1917
    original: אֲ‍נִי־חָכְמָה שָׁכַנְתִּי עָרְמָה וְדַעַת מְזִמּוֹת אֶמְצָא׃
    hebrewPlain: א‍ני חכמה שכנתי ערמה ודעת מזמות אמצא
    kjvRefs:
    - Proverbs 8:12
    kjvOsis:
    - Prov.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.13
    scripture: tanakh
    name: Tanakh Proverbs 8:13
    ref: Proverbs 8:13
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 17884
    text: The fear of the LORD is to hate evil; Pride, and arrogancy, and the evil way, And the froward mouth, do I hate.
    translation: JPS 1917
    original: יִרְאַת יְהוָה שְׂנֹאת רָע גֵּאָה וְגָאוֹן וְדֶרֶךְ רָע וּפִי תַהְפֻּכוֹת שָׂנֵאתִי׃
    hebrewPlain: יראת יהוה שנאת רע גאה וגאון ודרך רע ופי תהפכות שנאתי
    kjvRefs:
    - Proverbs 8:13
    kjvOsis:
    - Prov.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.14
    scripture: tanakh
    name: Tanakh Proverbs 8:14
    ref: Proverbs 8:14
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 17885
    text: Counsel is mine, and sound wisdom; I am understanding, power is mine.
    translation: JPS 1917
    original: לִי־עֵצָה וְתוּשִׁיָּה אֲנִי בִינָה לִי גְבוּרָה׃
    hebrewPlain: לי עצה ותושיה אני בינה לי גבורה
    kjvRefs:
    - Proverbs 8:14
    kjvOsis:
    - Prov.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.15
    scripture: tanakh
    name: Tanakh Proverbs 8:15
    ref: Proverbs 8:15
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 17886
    text: By me kings reign, And princes decree justice.
    translation: JPS 1917
    original: בִּי מְלָכִים יִמְלֹכוּ וְרוֹזְנִים יְחֹקְקוּ צֶדֶק׃
    hebrewPlain: בי מלכים ימלכו ורוזנים יחקקו צדק
    kjvRefs:
    - Proverbs 8:15
    kjvOsis:
    - Prov.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.16
    scripture: tanakh
    name: Tanakh Proverbs 8:16
    ref: Proverbs 8:16
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 17887
    text: By me princes rule, And nobles, even all the judges of the earth.
    translation: JPS 1917
    original: בִּי שָׂרִים יָשֹׂרוּ וּנְדִיבִים כָּל־שֹׁפְטֵי צֶדֶק׃
    hebrewPlain: בי שרים ישרו ונדיבים כל שפטי צדק
    kjvRefs:
    - Proverbs 8:16
    kjvOsis:
    - Prov.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.17
    scripture: tanakh
    name: Tanakh Proverbs 8:17
    ref: Proverbs 8:17
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 17888
    text: I love them that love me, And those that seek me earnestly shall find me.
    translation: JPS 1917
    original: אֲנִי אהביה [אֹהֲבַי] אֵהָב וּמְשַׁחֲרַי יִמְצָאֻנְנִי׃
    hebrewPlain: אני אהביה [אהבי] אהב ומשחרי ימצאנני
    kjvRefs:
    - Proverbs 8:17
    kjvOsis:
    - Prov.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.18
    scripture: tanakh
    name: Tanakh Proverbs 8:18
    ref: Proverbs 8:18
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 17889
    text: Riches and honour are with me; Yea, enduring riches and righteousness.
    translation: JPS 1917
    original: עֹשֶׁר־וְכָבוֹד אִתִּי הוֹן עָתֵק וּצְדָקָה׃
    hebrewPlain: עשר וכבוד אתי הון עתק וצדקה
    kjvRefs:
    - Proverbs 8:18
    kjvOsis:
    - Prov.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.19
    scripture: tanakh
    name: Tanakh Proverbs 8:19
    ref: Proverbs 8:19
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 19
    ordinal: 17890
    text: My fruit is better than gold, yea, than fine gold; And my produce than choice silver.
    translation: JPS 1917
    original: טוֹב פִּרְיִי מֵחָרוּץ וּמִפָּז וּתְבוּאָתִי מִכֶּסֶף נִבְחָר׃
    hebrewPlain: טוב פריי מחרוץ ומפז ותבואתי מכסף נבחר
    kjvRefs:
    - Proverbs 8:19
    kjvOsis:
    - Prov.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.20
    scripture: tanakh
    name: Tanakh Proverbs 8:20
    ref: Proverbs 8:20
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 20
    ordinal: 17891
    text: I walk in the way of righteousness, In the midst of the paths of justice;
    translation: JPS 1917
    original: בְּאֹרַח־צְדָקָה אֲהַלֵּך בְּתוֹךְ נְתִיבוֹת מִשְׁפָּט׃
    hebrewPlain: בארח צדקה אהלך בתוך נתיבות משפט
    kjvRefs:
    - Proverbs 8:20
    kjvOsis:
    - Prov.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.21
    scripture: tanakh
    name: Tanakh Proverbs 8:21
    ref: Proverbs 8:21
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 21
    ordinal: 17892
    text: That I may cause those that love me to inherit substance, And that I may fill their treasuries.
    translation: JPS 1917
    original: לְהַנְחִיל אֹהֲבַי יֵשׁ וְאֹצְרֹתֵיהֶם אֲמַלֵּא׃
    hebrewPlain: להנחיל אהבי יש ואצרתיהם אמלא
    kjvRefs:
    - Proverbs 8:21
    kjvOsis:
    - Prov.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.22
    scripture: tanakh
    name: Tanakh Proverbs 8:22
    ref: Proverbs 8:22
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 22
    ordinal: 17893
    text: The LORD made me as the beginning of His way, The first of His works of old.
    translation: JPS 1917
    original: יְהוָה קָנָנִי רֵאשִׁית דַּרְכּוֹ קֶדֶם מִפְעָלָיו מֵאָז׃
    hebrewPlain: יהוה קנני ראשית דרכו קדם מפעליו מאז
    kjvRefs:
    - Proverbs 8:22
    kjvOsis:
    - Prov.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.23
    scripture: tanakh
    name: Tanakh Proverbs 8:23
    ref: Proverbs 8:23
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 23
    ordinal: 17894
    text: I was set up from everlasting, from the beginning, Or ever the earth was.
    translation: JPS 1917
    original: מֵעוֹלָם נִסַּכְתִּי מֵרֹאשׁ מִקַּדְמֵי־אָרֶץ׃
    hebrewPlain: מעולם נסכתי מראש מקדמי ארץ
    kjvRefs:
    - Proverbs 8:23
    kjvOsis:
    - Prov.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.24
    scripture: tanakh
    name: Tanakh Proverbs 8:24
    ref: Proverbs 8:24
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 24
    ordinal: 17895
    text: When there were no depths, I was brought forth; When there were no fountains abounding with water.
    translation: JPS 1917
    original: בְּאֵין־תְּהֹמוֹת חוֹלָלְתִּי בְּאֵין מַעְיָנוֹת נִכְבַּדֵּי־מָיִם׃
    hebrewPlain: באין תהמות חוללתי באין מעינות נכבדי מים
    kjvRefs:
    - Proverbs 8:24
    kjvOsis:
    - Prov.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.25
    scripture: tanakh
    name: Tanakh Proverbs 8:25
    ref: Proverbs 8:25
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 25
    ordinal: 17896
    text: Before the mountains were settled, Before the hills was I brought forth;
    translation: JPS 1917
    original: בְּטֶרֶם הָרִים הָטְבָּעוּ לִפְנֵי גְבָעוֹת חוֹלָלְתִּי׃
    hebrewPlain: בטרם הרים הטבעו לפני גבעות חוללתי
    kjvRefs:
    - Proverbs 8:25
    kjvOsis:
    - Prov.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.26
    scripture: tanakh
    name: Tanakh Proverbs 8:26
    ref: Proverbs 8:26
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 26
    ordinal: 17897
    text: While as yet He had not made the earth, nor the fields, Nor the beginning of the dust of the world.
    translation: JPS 1917
    original: עַד־לֹא עָשָׂה אֶרֶץ וְחוּצוֹת וְרֹאשׁ עָפְרוֹת תֵּבֵל׃
    hebrewPlain: עד לא עשה ארץ וחוצות וראש עפרות תבל
    kjvRefs:
    - Proverbs 8:26
    kjvOsis:
    - Prov.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.27
    scripture: tanakh
    name: Tanakh Proverbs 8:27
    ref: Proverbs 8:27
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 27
    ordinal: 17898
    text: When He established the heavens, I was there; When He set a circle upon the face of the deep,
    translation: JPS 1917
    original: בַּהֲכִינוֹ שָׁמַיִם שָׁם אָנִי בְּחוּקוֹ חוּג עַל־פְּנֵי תְהוֹם׃
    hebrewPlain: בהכינו שמים שם אני בחוקו חוג על פני תהום
    kjvRefs:
    - Proverbs 8:27
    kjvOsis:
    - Prov.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.28
    scripture: tanakh
    name: Tanakh Proverbs 8:28
    ref: Proverbs 8:28
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 28
    ordinal: 17899
    text: When He made firm the skies above, When the fountains of the deep showed their might,
    translation: JPS 1917
    original: בְּאַמְּצוֹ שְׁחָקִים מִמָּעַל בַּעֲזוֹז עִינוֹת תְּהוֹם׃
    hebrewPlain: באמצו שחקים ממעל בעזוז עינות תהום
    kjvRefs:
    - Proverbs 8:28
    kjvOsis:
    - Prov.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.29
    scripture: tanakh
    name: Tanakh Proverbs 8:29
    ref: Proverbs 8:29
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 29
    ordinal: 17900
    text: When He gave to the sea His decree, That the waters should not transgress His commandment, When He appointed the foundations of the earth;
    translation: JPS 1917
    original: בְּשׂוּמוֹ לַיָּם חֻקּוֹ וּמַיִם לֹא יַעַבְרוּ־פִיו בְּחוּקוֹ מוֹסְדֵי אָרֶץ׃
    hebrewPlain: בשומו לים חקו ומים לא יעברו פיו בחוקו מוסדי ארץ
    kjvRefs:
    - Proverbs 8:29
    kjvOsis:
    - Prov.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.30
    scripture: tanakh
    name: Tanakh Proverbs 8:30
    ref: Proverbs 8:30
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 30
    ordinal: 17901
    text: Then I was by Him, as a nursling; And I was daily all delight, Playing always before Him,
    translation: JPS 1917
    original: וָאֶהְיֶה אֶצְלוֹ אָמוֹן וָאֶהְיֶה שַׁעֲשֻׁעִים יוֹם יוֹם מְשַׂחֶקֶת לְפָנָיו בְּכָל־עֵת׃
    hebrewPlain: ואהיה אצלו אמון ואהיה שעשעים יום יום משחקת לפניו בכל עת
    kjvRefs:
    - Proverbs 8:30
    kjvOsis:
    - Prov.8.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.31
    scripture: tanakh
    name: Tanakh Proverbs 8:31
    ref: Proverbs 8:31
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 31
    ordinal: 17902
    text: Playing in His habitable earth, And my delights are with the sons of men.
    translation: JPS 1917
    original: מְשַׂחֶקֶת בְּתֵבֵל אַרְצוֹ וְשַׁעֲשֻׁעַי אֶת־בְּנֵי אָדָם׃
    hebrewPlain: משחקת בתבל ארצו ושעשעי את בני אדם
    kjvRefs:
    - Proverbs 8:31
    kjvOsis:
    - Prov.8.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.32
    scripture: tanakh
    name: Tanakh Proverbs 8:32
    ref: Proverbs 8:32
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 32
    ordinal: 17903
    text: Now therefore, ye children, hearken unto me; For happy are they that keep my ways.
    translation: JPS 1917
    original: וְעַתָּה בָנִים שִׁמְעוּ־לִי וְאַשְׁרֵי דְּרָכַי יִשְׁמֹרוּ׃
    hebrewPlain: ועתה בנים שמעו לי ואשרי דרכי ישמרו
    kjvRefs:
    - Proverbs 8:32
    kjvOsis:
    - Prov.8.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.33
    scripture: tanakh
    name: Tanakh Proverbs 8:33
    ref: Proverbs 8:33
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 33
    ordinal: 17904
    text: Hear instruction, and be wise, And refuse it not.
    translation: JPS 1917
    original: שִׁמְעוּ מוּסָר וַחֲכָמוּ וְאַל־תִּפְרָעוּ׃
    hebrewPlain: שמעו מוסר וחכמו ואל תפרעו
    kjvRefs:
    - Proverbs 8:33
    kjvOsis:
    - Prov.8.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.34
    scripture: tanakh
    name: Tanakh Proverbs 8:34
    ref: Proverbs 8:34
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 34
    ordinal: 17905
    text: Happy is the man that hearkeneth to me, Watching daily at my gates, waiting at the posts of my doors.
    translation: JPS 1917
    original: אַשְׁרֵי אָדָם שֹׁמֵעַ לִי לִשְׁקֹד עַל־דַּלְתֹתַי יוֹם יוֹם לִשְׁמֹר מְזוּזֹת פְּתָחָי׃
    hebrewPlain: אשרי אדם שמע לי לשקד על דלתתי יום יום לשמר מזוזת פתחי
    kjvRefs:
    - Proverbs 8:34
    kjvOsis:
    - Prov.8.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.35
    scripture: tanakh
    name: Tanakh Proverbs 8:35
    ref: Proverbs 8:35
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 35
    ordinal: 17906
    text: For whoso findeth me findeth life, And obtaineth favour of the LORD.
    translation: JPS 1917
    original: כִּי מֹצְאִי מצאי [מָצָא] חַיִּים וַיָּפֶק רָצוֹן מֵיְהוָה׃
    hebrewPlain: כי מצאי מצאי [מצא] חיים ויפק רצון מיהוה
    kjvRefs:
    - Proverbs 8:35
    kjvOsis:
    - Prov.8.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.8.36
    scripture: tanakh
    name: Tanakh Proverbs 8:36
    ref: Proverbs 8:36
    book: Prov
    section: ketuvim
    chapter: 8
    verse: 36
    ordinal: 17907
    text: But he that misseth me wrongeth his own soul; All they that hate me love death.’
    translation: JPS 1917
    original: וְחֹטְאִי חֹמֵס נַפְשׁוֹ כָּל־מְשַׂנְאַי אָהֲבוּ מָוֶת׃
    hebrewPlain: וחטאי חמס נפשו כל משנאי אהבו מות
    kjvRefs:
    - Proverbs 8:36
    kjvOsis:
    - Prov.8.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.8
- type: TanakhVerse
  data:
    osis: Prov.9.1
    scripture: tanakh
    name: Tanakh Proverbs 9:1
    ref: Proverbs 9:1
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 17908
    text: Wisdom hath builded her house, she hath hewn out her seven pillars;
    translation: JPS 1917
    original: חָכְמוֹת בָּנְתָה בֵיתָהּ חָצְבָה עַמּוּדֶיהָ שִׁבְעָה׃
    hebrewPlain: חכמות בנתה ביתה חצבה עמודיה שבעה
    kjvRefs:
    - Proverbs 9:1
    kjvOsis:
    - Prov.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.2
    scripture: tanakh
    name: Tanakh Proverbs 9:2
    ref: Proverbs 9:2
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 17909
    text: She hath prepared her meat, she hath mingled her wine; she hath also furnished her table.
    translation: JPS 1917
    original: טָבְחָה טִבְחָהּ מָסְכָה יֵינָהּ אַף עָרְכָה שֻׁלְחָנָהּ׃
    hebrewPlain: טבחה טבחה מסכה יינה אף ערכה שלחנה
    kjvRefs:
    - Proverbs 9:2
    kjvOsis:
    - Prov.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.3
    scripture: tanakh
    name: Tanakh Proverbs 9:3
    ref: Proverbs 9:3
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 17910
    text: 'She hath sent forth her maidens, she calleth, upon the highest places of the city:'
    translation: JPS 1917
    original: שָׁלְחָה נַעֲרֹתֶיהָ תִקְרָא עַל־גַּפֵּי מְרֹמֵי קָרֶת׃
    hebrewPlain: שלחה נערתיה תקרא על גפי מרמי קרת
    kjvRefs:
    - Proverbs 9:3
    kjvOsis:
    - Prov.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.4
    scripture: tanakh
    name: Tanakh Proverbs 9:4
    ref: Proverbs 9:4
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 17911
    text: '’Whoso is thoughtless, let him turn in hither’; as for him that lacketh understanding, she saith to him:'
    translation: JPS 1917
    original: מִי־פֶתִי יָסֻר הֵנָּה חֲסַר־לֵב אָמְרָה לּוֹ׃
    hebrewPlain: מי פתי יסר הנה חסר לב אמרה לו
    kjvRefs:
    - Proverbs 9:4
    kjvOsis:
    - Prov.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.5
    scripture: tanakh
    name: Tanakh Proverbs 9:5
    ref: Proverbs 9:5
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 17912
    text: '''Come, eat of my bread, and drink of the wine which I have mingled.'
    translation: JPS 1917
    original: לְכוּ לַחֲמוּ בְלַחֲמִי וּשְׁתוּ בְּיַיִן מָסָכְתִּי׃
    hebrewPlain: לכו לחמו בלחמי ושתו ביין מסכתי
    kjvRefs:
    - Proverbs 9:5
    kjvOsis:
    - Prov.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.6
    scripture: tanakh
    name: Tanakh Proverbs 9:6
    ref: Proverbs 9:6
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 17913
    text: Forsake all thoughtlessness, and live; and walk in the way of understanding.
    translation: JPS 1917
    original: עִזְבוּ פְתָאיִם וִחְיוּ וְאִשְׁרוּ בְּדֶרֶךְ בִּינָה׃
    hebrewPlain: עזבו פתאים וחיו ואשרו בדרך בינה
    kjvRefs:
    - Proverbs 9:6
    kjvOsis:
    - Prov.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.7
    scripture: tanakh
    name: Tanakh Proverbs 9:7
    ref: Proverbs 9:7
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 17914
    text: He that correcteth a scorner getteth to himself shame, and he that reproveth a wicked man, it becometh unto him a blot.
    translation: JPS 1917
    original: יֹסֵר לֵץ לֹקֵחַ לוֹ קָלוֹן וּמוֹכִיחַ לְרָשָׁע מוּמוֹ׃
    hebrewPlain: יסר לץ לקח לו קלון ומוכיח לרשע מומו
    kjvRefs:
    - Proverbs 9:7
    kjvOsis:
    - Prov.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.8
    scripture: tanakh
    name: Tanakh Proverbs 9:8
    ref: Proverbs 9:8
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 17915
    text: Reprove not a scorner, lest he hate thee; reprove a wise man, and he will love thee.
    translation: JPS 1917
    original: אַל־תּוֹכַח לֵץ פֶּן־יִשְׂנָאֶךָּ הוֹכַח לְחָכָם וְיֶאֱהָבֶךָּ׃
    hebrewPlain: אל תוכח לץ פן ישנאך הוכח לחכם ויאהבך
    kjvRefs:
    - Proverbs 9:8
    kjvOsis:
    - Prov.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.9
    scripture: tanakh
    name: Tanakh Proverbs 9:9
    ref: Proverbs 9:9
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 17916
    text: Give to a wise man, and he will be yet wiser; teach a righteous man, and he will increase in learning.
    translation: JPS 1917
    original: תֵּן לְחָכָם וְיֶחְכַּם־עוֹד הוֹדַע לְצַדִּיק וְיוֹסֶף לֶקַח׃
    hebrewPlain: תן לחכם ויחכם עוד הודע לצדיק ויוסף לקח
    kjvRefs:
    - Proverbs 9:9
    kjvOsis:
    - Prov.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.10
    scripture: tanakh
    name: Tanakh Proverbs 9:10
    ref: Proverbs 9:10
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 17917
    text: The fear of the LORD is the beginning of wisdom, and the knowledge of the All-holy is understanding.
    translation: JPS 1917
    original: תְּחִלַּת חָכְמָה יִרְאַת יְהוָה וְדַעַת קְדֹשִׁים בִּינָה׃
    hebrewPlain: תחלת חכמה יראת יהוה ודעת קדשים בינה
    kjvRefs:
    - Proverbs 9:10
    kjvOsis:
    - Prov.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.11
    scripture: tanakh
    name: Tanakh Proverbs 9:11
    ref: Proverbs 9:11
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 17918
    text: For by me thy days shall be multiplied, and the years of thy life shall be increased.
    translation: JPS 1917
    original: כִּי־בִי יִרְבּוּ יָמֶיךָ וְיוֹסִיפוּ לְּךָ שְׁנוֹת חַיִּים׃
    hebrewPlain: כי בי ירבו ימיך ויוסיפו לך שנות חיים
    kjvRefs:
    - Proverbs 9:11
    kjvOsis:
    - Prov.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.12
    scripture: tanakh
    name: Tanakh Proverbs 9:12
    ref: Proverbs 9:12
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 17919
    text: If thou art wise, thou art wise for thyself; And if thou scornest, thou alone shalt bear it.’
    translation: JPS 1917
    original: אִם־חָכַמְתָּ חָכַמְתָּ לָּךְ וְלַצְתָּ לְבַדְּךָ תִשָּׂא׃
    hebrewPlain: אם חכמת חכמת לך ולצת לבדך תשא
    kjvRefs:
    - Proverbs 9:12
    kjvOsis:
    - Prov.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.13
    scripture: tanakh
    name: Tanakh Proverbs 9:13
    ref: Proverbs 9:13
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 17920
    text: The woman Folly is riotous; She is thoughtless, and knoweth nothing.
    translation: JPS 1917
    original: אֵשֶׁת כְּסִילוּת הֹמִיָּה פְּתַיּוּת וּבַל־יָדְעָה מָּה׃
    hebrewPlain: אשת כסילות המיה פתיות ובל ידעה מה
    kjvRefs:
    - Proverbs 9:13
    kjvOsis:
    - Prov.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.14
    scripture: tanakh
    name: Tanakh Proverbs 9:14
    ref: Proverbs 9:14
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 17921
    text: And she sitteth at the door of her house, On a seat in the high places of the city,
    translation: JPS 1917
    original: וְיָשְׁבָה לְפֶתַח בֵּיתָהּ עַל־כִּסֵּא מְרֹמֵי קָרֶת׃
    hebrewPlain: וישבה לפתח ביתה על כסא מרמי קרת
    kjvRefs:
    - Proverbs 9:14
    kjvOsis:
    - Prov.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.9
- type: TanakhVerse
  data:
    osis: Prov.9.15
    scripture: tanakh
    name: Tanakh Proverbs 9:15
    ref: Proverbs 9:15
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 17922
    text: 'To call to them that pass by, Who go right on their ways:'
    translation: JPS 1917
    original: לִקְרֹא לְעֹבְרֵי־דָרֶךְ הַמְיַשְּׁרִים אֹרְחוֹתָם׃
    hebrewPlain: לקרא לעברי דרך המישרים ארחותם
    kjvRefs:
    - Proverbs 9:15
    kjvOsis:
