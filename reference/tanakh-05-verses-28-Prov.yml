  data:
    osis: Prov.14.9
    scripture: tanakh
    name: Tanakh Proverbs 14:9
    ref: Proverbs 14:9
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 9
    ordinal: 18050
    text: Amends pleadeth for fools; But among the upright there is good will.
    translation: JPS 1917
    original: אֱוִלִים יָלִיץ אָשָׁם וּבֵין יְשָׁרִים רָצוֹן׃
    hebrewPlain: אולים יליץ אשם ובין ישרים רצון
    kjvRefs:
    - Proverbs 14:9
    kjvOsis:
    - Prov.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.10
    scripture: tanakh
    name: Tanakh Proverbs 14:10
    ref: Proverbs 14:10
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 10
    ordinal: 18051
    text: The heart knoweth its own bitterness; And with its joy no stranger can intermeddle.
    translation: JPS 1917
    original: לֵב יוֹדֵעַ מָרַּת נַפְשׁוֹ וּבְשִׂמְחָתוֹ לֹא־יִתְעָרַב זָר׃
    hebrewPlain: לב יודע מרת נפשו ובשמחתו לא יתערב זר
    kjvRefs:
    - Proverbs 14:10
    kjvOsis:
    - Prov.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.11
    scripture: tanakh
    name: Tanakh Proverbs 14:11
    ref: Proverbs 14:11
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 11
    ordinal: 18052
    text: The house of the wicked shall be overthrown; But the tent of the upright shall flourish.
    translation: JPS 1917
    original: בֵּית רְשָׁעִים יִשָּׁמֵד וְאֹהֶל יְשָׁרִים יַפְרִיחַ׃
    hebrewPlain: בית רשעים ישמד ואהל ישרים יפריח
    kjvRefs:
    - Proverbs 14:11
    kjvOsis:
    - Prov.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.12
    scripture: tanakh
    name: Tanakh Proverbs 14:12
    ref: Proverbs 14:12
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 12
    ordinal: 18053
    text: There is a way which seemeth right unto a man, But the end thereof are the ways of death.
    translation: JPS 1917
    original: יֵשׁ דֶּרֶךְ יָשָׁר לִפְנֵי־אִישׁ וְאַחֲרִיתָהּ דַּרְכֵי־מָוֶת׃
    hebrewPlain: יש דרך ישר לפני איש ואחריתה דרכי מות
    kjvRefs:
    - Proverbs 14:12
    kjvOsis:
    - Prov.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.13
    scripture: tanakh
    name: Tanakh Proverbs 14:13
    ref: Proverbs 14:13
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 13
    ordinal: 18054
    text: Even in laughter the heart acheth; And the end of mirth is heaviness.
    translation: JPS 1917
    original: גַּם־בִּשְׂחוֹק יִכְאַב־לֵב וְאַחֲרִיתָהּ שִׂמְחָה תוּגָה׃
    hebrewPlain: גם בשחוק יכאב לב ואחריתה שמחה תוגה
    kjvRefs:
    - Proverbs 14:13
    kjvOsis:
    - Prov.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.14
    scripture: tanakh
    name: Tanakh Proverbs 14:14
    ref: Proverbs 14:14
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 14
    ordinal: 18055
    text: The dissembler in heart shall have his fill from his own ways; And a good man shall be satisfied from himself.
    translation: JPS 1917
    original: מִדְּרָכָיו יִשְׂבַּע סוּג לֵב וּמֵעָלָיו אִישׁ טוֹב׃
    hebrewPlain: מדרכיו ישבע סוג לב ומעליו איש טוב
    kjvRefs:
    - Proverbs 14:14
    kjvOsis:
    - Prov.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.15
    scripture: tanakh
    name: Tanakh Proverbs 14:15
    ref: Proverbs 14:15
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 15
    ordinal: 18056
    text: The thoughtless believeth every word; But the prudent man looketh well to his going.
    translation: JPS 1917
    original: פֶּתִי יַאֲמִין לְכָל־דָּבָר וְעָרוּם יָבִין לַאֲשֻׁרוֹ׃
    hebrewPlain: פתי יאמין לכל דבר וערום יבין לאשרו
    kjvRefs:
    - Proverbs 14:15
    kjvOsis:
    - Prov.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.16
    scripture: tanakh
    name: Tanakh Proverbs 14:16
    ref: Proverbs 14:16
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 16
    ordinal: 18057
    text: A wise man feareth, and departeth from evil; But the fool behaveth overbearingly, and is confident.
    translation: JPS 1917
    original: חָכָם יָרֵא וְסָר מֵרָע וּכְסִיל מִתְעַבֵּר וּבוֹטֵחַ׃
    hebrewPlain: חכם ירא וסר מרע וכסיל מתעבר ובוטח
    kjvRefs:
    - Proverbs 14:16
    kjvOsis:
    - Prov.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.17
    scripture: tanakh
    name: Tanakh Proverbs 14:17
    ref: Proverbs 14:17
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 17
    ordinal: 18058
    text: He that is soon angry dealeth foolishly; And a man of wicked devices is hated.
    translation: JPS 1917
    original: קְצַר־אַפַּיִם יַעֲשֶׂה אִוֶּלֶת וְאִישׁ מְזִמּוֹת יִשָּׂנֵא׃
    hebrewPlain: קצר אפים יעשה אולת ואיש מזמות ישנא
    kjvRefs:
    - Proverbs 14:17
    kjvOsis:
    - Prov.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.18
    scripture: tanakh
    name: Tanakh Proverbs 14:18
    ref: Proverbs 14:18
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 18
    ordinal: 18059
    text: The thoughtless come into possession of folly; But the prudent are crowned with knowledge.
    translation: JPS 1917
    original: נָחֲלוּ פְתָאיִם אִוֶּלֶת וַעֲרוּמִים יַכְתִּרוּ דָעַת׃
    hebrewPlain: נחלו פתאים אולת וערומים יכתרו דעת
    kjvRefs:
    - Proverbs 14:18
    kjvOsis:
    - Prov.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.19
    scripture: tanakh
    name: Tanakh Proverbs 14:19
    ref: Proverbs 14:19
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 19
    ordinal: 18060
    text: The evil bow before the good, And the wicked at the gates of the righteous.
    translation: JPS 1917
    original: שַׁחוּ רָעִים לִפְנֵי טוֹבִים וּרְשָׁעִים עַל־שַׁעֲרֵי צַדִּיק׃
    hebrewPlain: שחו רעים לפני טובים ורשעים על שערי צדיק
    kjvRefs:
    - Proverbs 14:19
    kjvOsis:
    - Prov.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.20
    scripture: tanakh
    name: Tanakh Proverbs 14:20
    ref: Proverbs 14:20
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 20
    ordinal: 18061
    text: The poor is hated even of his own neighbour; But the rich hath many friends. .
    translation: JPS 1917
    original: גַּם־לְרֵעֵהוּ יִשָּׂנֵא רָשׁ וְאֹהֲבֵי עָשִׁיר רַבִּים׃
    hebrewPlain: גם לרעהו ישנא רש ואהבי עשיר רבים
    kjvRefs:
    - Proverbs 14:20
    kjvOsis:
    - Prov.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.21
    scripture: tanakh
    name: Tanakh Proverbs 14:21
    ref: Proverbs 14:21
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 21
    ordinal: 18062
    text: He that despiseth his neighbour sinneth; But he that is gracious unto the humble, happy is he.
    translation: JPS 1917
    original: בָּז־לְרֵעֵהוּ חוֹטֵא וּמְחוֹנֵן עניים [עֲנָוִים] אַשְׁרָיו׃
    hebrewPlain: בז לרעהו חוטא ומחונן עניים [ענוים] אשריו
    kjvRefs:
    - Proverbs 14:21
    kjvOsis:
    - Prov.14.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.22
    scripture: tanakh
    name: Tanakh Proverbs 14:22
    ref: Proverbs 14:22
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 22
    ordinal: 18063
    text: Shall they not go astray that devise evil? But mercy and truth shall be for them that devise good.
    translation: JPS 1917
    original: הֲ‍לוֹא־יִתְעוּ חֹרְשֵׁי רָע וְחֶסֶד וֶאֱמֶת חֹרְשֵׁי טוֹב׃
    hebrewPlain: ה‍לוא יתעו חרשי רע וחסד ואמת חרשי טוב
    kjvRefs:
    - Proverbs 14:22
    kjvOsis:
    - Prov.14.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.23
    scripture: tanakh
    name: Tanakh Proverbs 14:23
    ref: Proverbs 14:23
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 23
    ordinal: 18064
    text: In all labour there is profit; But the talk of the lips tendeth only to penury.
    translation: JPS 1917
    original: בְּכָל־עֶצֶב יִהְיֶה מוֹתָר וּדְבַר־שְׂפָתַיִם אַךְ־לְמַחְסוֹר׃
    hebrewPlain: בכל עצב יהיה מותר ודבר שפתים אך למחסור
    kjvRefs:
    - Proverbs 14:23
    kjvOsis:
    - Prov.14.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.24
    scripture: tanakh
    name: Tanakh Proverbs 14:24
    ref: Proverbs 14:24
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 24
    ordinal: 18065
    text: The crown of the wise is their riches; But the folly of fools remaineth folly.
    translation: JPS 1917
    original: עֲטֶרֶת חֲכָמִים עָשְׁרָם אִוֶּלֶת כְּסִילִים אִוֶּלֶת׃
    hebrewPlain: עטרת חכמים עשרם אולת כסילים אולת
    kjvRefs:
    - Proverbs 14:24
    kjvOsis:
    - Prov.14.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.25
    scripture: tanakh
    name: Tanakh Proverbs 14:25
    ref: Proverbs 14:25
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 25
    ordinal: 18066
    text: A true witness delivereth souls; But he that breatheth forth lies is all deceit.
    translation: JPS 1917
    original: מַצִּיל נְפָשׁוֹת עֵד אֱמֶת וְיָפִחַ כְּזָבִים מִרְמָה׃
    hebrewPlain: מציל נפשות עד אמת ויפח כזבים מרמה
    kjvRefs:
    - Proverbs 14:25
    kjvOsis:
    - Prov.14.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.26
    scripture: tanakh
    name: Tanakh Proverbs 14:26
    ref: Proverbs 14:26
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 26
    ordinal: 18067
    text: In the fear of the LORD a man hath strong confidence; And his children shall have a place of refuge.
    translation: JPS 1917
    original: בְּיִרְאַת יְהוָה מִבְטַח־עֹז וּלְבָנָיו יִהְיֶה מַחְסֶה׃
    hebrewPlain: ביראת יהוה מבטח עז ולבניו יהיה מחסה
    kjvRefs:
    - Proverbs 14:26
    kjvOsis:
    - Prov.14.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.27
    scripture: tanakh
    name: Tanakh Proverbs 14:27
    ref: Proverbs 14:27
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 27
    ordinal: 18068
    text: The fear of the LORD is a fountain of life, to depart from the snares of death.
    translation: JPS 1917
    original: יִרְאַת יְהוָה מְקוֹר חַיִּים לָסוּר מִמֹּקְשֵׁי מָוֶת׃
    hebrewPlain: יראת יהוה מקור חיים לסור ממקשי מות
    kjvRefs:
    - Proverbs 14:27
    kjvOsis:
    - Prov.14.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.28
    scripture: tanakh
    name: Tanakh Proverbs 14:28
    ref: Proverbs 14:28
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 28
    ordinal: 18069
    text: In the multitude of people is the king’s glory; But in the want of people is the ruin of the prince.
    translation: JPS 1917
    original: בְּרָב־עָם הַדְרַת־מֶלֶךְ וּבְאֶפֶס לְאֹם מְחִתַּת רָזוֹן׃
    hebrewPlain: ברב עם הדרת מלך ובאפס לאם מחתת רזון
    kjvRefs:
    - Proverbs 14:28
    kjvOsis:
    - Prov.14.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.29
    scripture: tanakh
    name: Tanakh Proverbs 14:29
    ref: Proverbs 14:29
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 29
    ordinal: 18070
    text: He that is slow to anger is of great understanding; But he that is hasty of spirit exalteth folly.
    translation: JPS 1917
    original: אֶרֶךְ אַפַּיִם רַב־תְּבוּנָה וּקְצַר־רוּחַ מֵרִים אִוֶּלֶת׃
    hebrewPlain: ארך אפים רב תבונה וקצר רוח מרים אולת
    kjvRefs:
    - Proverbs 14:29
    kjvOsis:
    - Prov.14.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.30
    scripture: tanakh
    name: Tanakh Proverbs 14:30
    ref: Proverbs 14:30
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 30
    ordinal: 18071
    text: A tranquil heart is the life of the flesh; But envy is the rottenness of the bones.
    translation: JPS 1917
    original: חַיֵּי בְשָׂרִים לֵב מַרְפֵּא וּרְקַב עֲצָמוֹת קִנְאָה׃
    hebrewPlain: חיי בשרים לב מרפא ורקב עצמות קנאה
    kjvRefs:
    - Proverbs 14:30
    kjvOsis:
    - Prov.14.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.31
    scripture: tanakh
    name: Tanakh Proverbs 14:31
    ref: Proverbs 14:31
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 31
    ordinal: 18072
    text: He that oppresseth the poor blasphemeth his Maker; But he that is gracious unto the needy honoureth Him.
    translation: JPS 1917
    original: עֹשֵׁק־דָּל חֵרֵף עֹשֵׂהוּ וּמְכַבְּדוֹ חֹנֵן אֶבְיוֹן׃
    hebrewPlain: עשק דל חרף עשהו ומכבדו חנן אביון
    kjvRefs:
    - Proverbs 14:31
    kjvOsis:
    - Prov.14.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.32
    scripture: tanakh
    name: Tanakh Proverbs 14:32
    ref: Proverbs 14:32
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 32
    ordinal: 18073
    text: The wicked is thrust down in his misfortune; But the righteous, even when he is brought to death, hath hope.
    translation: JPS 1917
    original: בְּרָעָתוֹ יִדָּחֶה רָשָׁע וְחֹסֶה בְמוֹתוֹ צַדִּיק׃
    hebrewPlain: ברעתו ידחה רשע וחסה במותו צדיק
    kjvRefs:
    - Proverbs 14:32
    kjvOsis:
    - Prov.14.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.33
    scripture: tanakh
    name: Tanakh Proverbs 14:33
    ref: Proverbs 14:33
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 33
    ordinal: 18074
    text: In the heart of him that hath discernment wisdom resteth; But in the inward part of fools it maketh itself known.
    translation: JPS 1917
    original: בְּלֵב נָבוֹן תָּנוּחַ חָכְמָה וּבְקֶרֶב כְּסִילִים תִּוָּדֵעַ׃
    hebrewPlain: בלב נבון תנוח חכמה ובקרב כסילים תודע
    kjvRefs:
    - Proverbs 14:33
    kjvOsis:
    - Prov.14.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.34
    scripture: tanakh
    name: Tanakh Proverbs 14:34
    ref: Proverbs 14:34
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 34
    ordinal: 18075
    text: Righteousness exalteth a nation; But sin is a reproach to any people.
    translation: JPS 1917
    original: צְדָקָה תְרוֹמֵם־גּוֹי וְחֶסֶד לְאֻמִּים חַטָּאת׃
    hebrewPlain: צדקה תרומם גוי וחסד לאמים חטאת
    kjvRefs:
    - Proverbs 14:34
    kjvOsis:
    - Prov.14.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.14.35
    scripture: tanakh
    name: Tanakh Proverbs 14:35
    ref: Proverbs 14:35
    book: Prov
    section: ketuvim
    chapter: 14
    verse: 35
    ordinal: 18076
    text: The king’s favour is toward a servant that dealeth wisely; But his wrath striketh him that dealeth shamefully.
    translation: JPS 1917
    original: רְצוֹן־מֶלֶךְ לְעֶבֶד מַשְׂכִּיל וְעֶבְרָתוֹ תִּהְיֶה מֵבִישׁ׃
    hebrewPlain: רצון מלך לעבד משכיל ועברתו תהיה מביש
    kjvRefs:
    - Proverbs 14:35
    kjvOsis:
    - Prov.14.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.14
- type: TanakhVerse
  data:
    osis: Prov.15.1
    scripture: tanakh
    name: Tanakh Proverbs 15:1
    ref: Proverbs 15:1
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 1
    ordinal: 18077
    text: A soft answer turneth away wrath; But a grievous word stirreth up anger.
    translation: JPS 1917
    original: מַעֲנֶה־רַּךְ יָשִׁיב חֵמָה וּדְבַר־עֶצֶב יַעֲלֶה־אָף׃
    hebrewPlain: מענה רך ישיב חמה ודבר עצב יעלה אף
    kjvRefs:
    - Proverbs 15:1
    kjvOsis:
    - Prov.15.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.2
    scripture: tanakh
    name: Tanakh Proverbs 15:2
    ref: Proverbs 15:2
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 2
    ordinal: 18078
    text: The tongue of the wise useth knowledge aright; But the mouth of fools poureth out foolishness.
    translation: JPS 1917
    original: לְשׁוֹן חֲכָמִים תֵּיטִיב דָּעַת וּפִי כְסִילִים יַבִּיעַ אִוֶּלֶת׃
    hebrewPlain: לשון חכמים תיטיב דעת ופי כסילים יביע אולת
    kjvRefs:
    - Proverbs 15:2
    kjvOsis:
    - Prov.15.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.3
    scripture: tanakh
    name: Tanakh Proverbs 15:3
    ref: Proverbs 15:3
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 3
    ordinal: 18079
    text: The eyes of the LORD are in every place, Keeping watch upon the evil and the good.
    translation: JPS 1917
    original: בְּכָל־מָקוֹם עֵינֵי יְהוָה צֹפוֹת רָעִים וטוֹבִים׃
    hebrewPlain: בכל מקום עיני יהוה צפות רעים וטובים
    kjvRefs:
    - Proverbs 15:3
    kjvOsis:
    - Prov.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.4
    scripture: tanakh
    name: Tanakh Proverbs 15:4
    ref: Proverbs 15:4
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 4
    ordinal: 18080
    text: A soothing tongue is a tree of life; But perverseness therein is a wound to the spirit.
    translation: JPS 1917
    original: מַרְפֵּא לָשׁוֹן עֵץ חַיִּים וְסֶלֶף בָּהּ שֶׁבֶר בְּרוּחַ׃
    hebrewPlain: מרפא לשון עץ חיים וסלף בה שבר ברוח
    kjvRefs:
    - Proverbs 15:4
    kjvOsis:
    - Prov.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.5
    scripture: tanakh
    name: Tanakh Proverbs 15:5
    ref: Proverbs 15:5
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 5
    ordinal: 18081
    text: A fool despiseth his father’s correction; But he that regardeth reproof is prudent.
    translation: JPS 1917
    original: אֱוִיל יִנְאַץ מוּסַר אָבִיו וְשֹׁמֵר תּוֹכַחַת יַעְרִם׃
    hebrewPlain: אויל ינאץ מוסר אביו ושמר תוכחת יערם
    kjvRefs:
    - Proverbs 15:5
    kjvOsis:
    - Prov.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.6
    scripture: tanakh
    name: Tanakh Proverbs 15:6
    ref: Proverbs 15:6
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 6
    ordinal: 18082
    text: In the house of the righteous is much treasure; But in the revenues of the wicked is trouble.
    translation: JPS 1917
    original: בֵּית צַדִּיק חֹסֶן רָב וּבִתְבוּאַת רָשָׁע נֶעְכָּרֶת׃
    hebrewPlain: בית צדיק חסן רב ובתבואת רשע נעכרת
    kjvRefs:
    - Proverbs 15:6
    kjvOsis:
    - Prov.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.7
    scripture: tanakh
    name: Tanakh Proverbs 15:7
    ref: Proverbs 15:7
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 7
    ordinal: 18083
    text: The lips of the wise disperse knowledge; But the heart of the foolish is not stedfast.
    translation: JPS 1917
    original: שִׂפְתֵי חֲכָמִים יְזָרוּ דָעַת וְלֵב כְּסִילִים לֹא־כֵן׃
    hebrewPlain: שפתי חכמים יזרו דעת ולב כסילים לא כן
    kjvRefs:
    - Proverbs 15:7
    kjvOsis:
    - Prov.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.8
    scripture: tanakh
    name: Tanakh Proverbs 15:8
    ref: Proverbs 15:8
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 8
    ordinal: 18084
    text: The sacrifice of the wicked is an abomination to the LORD; But the prayer of the upright is His delight.
    translation: JPS 1917
    original: זֶבַח רְשָׁעִים תּוֹעֲבַת יְהוָה וּתְפִלַּת יְשָׁרִים רְצוֹנוֹ׃
    hebrewPlain: זבח רשעים תועבת יהוה ותפלת ישרים רצונו
    kjvRefs:
    - Proverbs 15:8
    kjvOsis:
    - Prov.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.9
    scripture: tanakh
    name: Tanakh Proverbs 15:9
    ref: Proverbs 15:9
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 9
    ordinal: 18085
    text: The way of the wicked is an abomination to the LORD; But He loveth him that followeth after righteousness.
    translation: JPS 1917
    original: תּוֹעֲבַת יְהוָה דֶּרֶךְ רָשָׁע וּמְרַדֵּף צְדָקָה יֶאֱהָב׃
    hebrewPlain: תועבת יהוה דרך רשע ומרדף צדקה יאהב
    kjvRefs:
    - Proverbs 15:9
    kjvOsis:
    - Prov.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.10
    scripture: tanakh
    name: Tanakh Proverbs 15:10
    ref: Proverbs 15:10
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 10
    ordinal: 18086
    text: There is grievous correction for him that forsaketh the way; And he that hateth reproof shall die.
    translation: JPS 1917
    original: מוּסָר רָע לְעֹזֵב אֹרַח שׂוֹנֵא תוֹכַחַת יָמוּת׃
    hebrewPlain: מוסר רע לעזב ארח שונא תוכחת ימות
    kjvRefs:
    - Proverbs 15:10
    kjvOsis:
    - Prov.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.11
    scripture: tanakh
    name: Tanakh Proverbs 15:11
    ref: Proverbs 15:11
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 11
    ordinal: 18087
    text: The nether-world and Destruction are before the LORD; How much more then the hearts of the children of men!
    translation: JPS 1917
    original: שְׁאוֹל וַאֲבַדּוֹן נֶגֶד יְהוָה אַף כִּי־לִבּוֹת בְּנֵי־אָדָם׃
    hebrewPlain: שאול ואבדון נגד יהוה אף כי לבות בני אדם
    kjvRefs:
    - Proverbs 15:11
    kjvOsis:
    - Prov.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.12
    scripture: tanakh
    name: Tanakh Proverbs 15:12
    ref: Proverbs 15:12
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 12
    ordinal: 18088
    text: A scorner loveth not to be reproved; He will not go unto the wise.
    translation: JPS 1917
    original: לֹא יֶאֱהַב־לֵץ הוֹכֵחַ לוֹ אֶל־חֲכָמִים לֹא יֵלֵךְ׃
    hebrewPlain: לא יאהב לץ הוכח לו אל חכמים לא ילך
    kjvRefs:
    - Proverbs 15:12
    kjvOsis:
    - Prov.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.13
    scripture: tanakh
    name: Tanakh Proverbs 15:13
    ref: Proverbs 15:13
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 13
    ordinal: 18089
    text: A merry heart maketh a cheerful countenance; But by sorrow of heart the spirit is broken.
    translation: JPS 1917
    original: לֵב שָׂמֵחַ יֵיטִב פָּנִים וּבְעַצְּבַת־לֵב רוּחַ נְכֵאָה׃
    hebrewPlain: לב שמח ייטב פנים ובעצבת לב רוח נכאה
    kjvRefs:
    - Proverbs 15:13
    kjvOsis:
    - Prov.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.14
    scripture: tanakh
    name: Tanakh Proverbs 15:14
    ref: Proverbs 15:14
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 14
    ordinal: 18090
    text: The heart of him that hath discernment seeketh knowledge; But the mouth of fools feedeth on folly.
    translation: JPS 1917
    original: לֵב נָבוֹן יְבַקֶּשׁ־דָּעַת ופני [וּפִי] כְסִילִים יִרְעֶה אִוֶּלֶת׃
    hebrewPlain: לב נבון יבקש דעת ופני [ופי] כסילים ירעה אולת
    kjvRefs:
    - Proverbs 15:14
    kjvOsis:
    - Prov.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.15
    scripture: tanakh
    name: Tanakh Proverbs 15:15
    ref: Proverbs 15:15
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 15
    ordinal: 18091
    text: All the days of the poor are evil; But he that is of a merry heart hath a continual feast.
    translation: JPS 1917
    original: כָּל־יְמֵי עָנִי רָעִים וְטוֹב־לֵב מִשְׁתֶּה תָמִיד׃
    hebrewPlain: כל ימי עני רעים וטוב לב משתה תמיד
    kjvRefs:
    - Proverbs 15:15
    kjvOsis:
    - Prov.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.16
    scripture: tanakh
    name: Tanakh Proverbs 15:16
    ref: Proverbs 15:16
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 16
    ordinal: 18092
    text: Better is little with the fear of the LORD, Than great treasure and turmoil therewith.
    translation: JPS 1917
    original: טוֹב־מְעַט בְּיִרְאַת יְהוָה מֵאוֹצָר רָב וּמְהוּמָה בוֹ׃
    hebrewPlain: טוב מעט ביראת יהוה מאוצר רב ומהומה בו
    kjvRefs:
    - Proverbs 15:16
    kjvOsis:
    - Prov.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.17
    scripture: tanakh
    name: Tanakh Proverbs 15:17
    ref: Proverbs 15:17
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 17
    ordinal: 18093
    text: Better is a dinner of herbs where love is, Than a stalled ox and hatred therewith.
    translation: JPS 1917
    original: טוֹב אֲרֻחַת יָרָק וְאַהֲבָה־שָׁם מִשּׁוֹר אָבוּס וְשִׂנְאָה־בוֹ׃
    hebrewPlain: טוב ארחת ירק ואהבה שם משור אבוס ושנאה בו
    kjvRefs:
    - Proverbs 15:17
    kjvOsis:
    - Prov.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.18
    scripture: tanakh
    name: Tanakh Proverbs 15:18
    ref: Proverbs 15:18
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 18
    ordinal: 18094
    text: A wrathful man stirreth up discord; But he that is slow to anger appeaseth strife.
    translation: JPS 1917
    original: אִישׁ חֵמָה יְגָרֶה מָדוֹן וְאֶרֶך אַפַּיִם יַשְׁקִיט רִיב׃
    hebrewPlain: איש חמה יגרה מדון וארך אפים ישקיט ריב
    kjvRefs:
    - Proverbs 15:18
    kjvOsis:
    - Prov.15.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.19
    scripture: tanakh
    name: Tanakh Proverbs 15:19
    ref: Proverbs 15:19
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 19
    ordinal: 18095
    text: The way of the sluggard is as though hedged by thorns; But the path of the upright is even.
    translation: JPS 1917
    original: דֶּרֶךְ עָצֵל כִּמְשֻׂכַת חָדֶק וְאֹרַח יְשָׁרִים סְלֻלָה׃
    hebrewPlain: דרך עצל כמשכת חדק וארח ישרים סללה
    kjvRefs:
    - Proverbs 15:19
    kjvOsis:
    - Prov.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.20
    scripture: tanakh
    name: Tanakh Proverbs 15:20
    ref: Proverbs 15:20
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 20
    ordinal: 18096
    text: A wise son maketh a glad father; But a foolish man despiseth his mother.
    translation: JPS 1917
    original: בֵּן חָכָם יְשַׂמַּח־אָב וּכְסִיל אָדָם בּוֹזֶה אִמּוֹ׃
    hebrewPlain: בן חכם ישמח אב וכסיל אדם בוזה אמו
    kjvRefs:
    - Proverbs 15:20
    kjvOsis:
    - Prov.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.21
    scripture: tanakh
    name: Tanakh Proverbs 15:21
    ref: Proverbs 15:21
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 21
    ordinal: 18097
    text: Folly is joy to him that lacketh understanding; But a man of discernment walketh straightforwards.
    translation: JPS 1917
    original: אִוֶּלֶת שִׂמְחָה לַחֲסַר־לֵב וְאִישׁ תְּבוּנָה יְיַשֶׁר־לָכֶת׃
    hebrewPlain: אולת שמחה לחסר לב ואיש תבונה יישר לכת
    kjvRefs:
    - Proverbs 15:21
    kjvOsis:
    - Prov.15.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.22
    scripture: tanakh
    name: Tanakh Proverbs 15:22
    ref: Proverbs 15:22
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 22
    ordinal: 18098
    text: For want of counsel purposes are frustrated; But in the multitude of counsellors they are established.
    translation: JPS 1917
    original: הָפֵר מַחֲשָׁבוֹת בְּאֵין סוֹד וּבְרֹב יוֹעֲצִים תָּקוּם׃
    hebrewPlain: הפר מחשבות באין סוד וברב יועצים תקום
    kjvRefs:
    - Proverbs 15:22
    kjvOsis:
    - Prov.15.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.23
    scripture: tanakh
    name: Tanakh Proverbs 15:23
    ref: Proverbs 15:23
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 23
    ordinal: 18099
    text: A man hath joy in the answer of his mouth; And a word in due season, how good is it!
    translation: JPS 1917
    original: שִׂמְחָה לָאִישׁ בְּמַעֲנֵה־פִיו וְדָבָר בְּעִתּוֹ מַה־טּוֹב׃
    hebrewPlain: שמחה לאיש במענה פיו ודבר בעתו מה טוב
    kjvRefs:
    - Proverbs 15:23
    kjvOsis:
    - Prov.15.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.24
    scripture: tanakh
    name: Tanakh Proverbs 15:24
    ref: Proverbs 15:24
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 24
    ordinal: 18100
    text: The path of life goeth upward for the wise, that he may depart from the nether-world beneath.
    translation: JPS 1917
    original: אֹרַח חַיִּים לְמַעְלָה לְמַשְׂכִּיל לְמַעַן סוּר מִשְּׁאוֹל מָטָּה׃
    hebrewPlain: ארח חיים למעלה למשכיל למען סור משאול מטה
    kjvRefs:
    - Proverbs 15:24
    kjvOsis:
    - Prov.15.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.25
    scripture: tanakh
    name: Tanakh Proverbs 15:25
    ref: Proverbs 15:25
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 25
    ordinal: 18101
    text: The LORD will pluck up the house of the proud; But He will establish the border of the widow.
    translation: JPS 1917
    original: בֵּית גֵּאִים יִסַּח יְהוָה וְיַצֵּב גְּבוּל אַלְמָנָה׃
    hebrewPlain: בית גאים יסח יהוה ויצב גבול אלמנה
    kjvRefs:
    - Proverbs 15:25
    kjvOsis:
    - Prov.15.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.26
    scripture: tanakh
    name: Tanakh Proverbs 15:26
    ref: Proverbs 15:26
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 26
    ordinal: 18102
    text: The thoughts of wickedness are an abomination to the LORD; But words of pleasantness are pure.
    translation: JPS 1917
    original: תּוֹעֲבַת יְהוָה מַחְשְׁבוֹת רָע וּטְהֹרִים אִמְרֵי־נֹעַם׃
    hebrewPlain: תועבת יהוה מחשבות רע וטהרים אמרי נעם
    kjvRefs:
    - Proverbs 15:26
    kjvOsis:
    - Prov.15.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.27
    scripture: tanakh
    name: Tanakh Proverbs 15:27
    ref: Proverbs 15:27
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 27
    ordinal: 18103
    text: He that is greedy of gain troubleth his own house; But he that hateth gifts shall live.
    translation: JPS 1917
    original: עֹכֵר בֵּיתוֹ בּוֹצֵעַ בָּצַע וְשׂוֹנֵא מַתָּנֹת יִחְיֶה׃
    hebrewPlain: עכר ביתו בוצע בצע ושונא מתנת יחיה
    kjvRefs:
    - Proverbs 15:27
    kjvOsis:
    - Prov.15.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.28
    scripture: tanakh
    name: Tanakh Proverbs 15:28
    ref: Proverbs 15:28
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 28
    ordinal: 18104
    text: The heart of the righteous studieth to answer; But the mouth of the wicked poureth out evil things.
    translation: JPS 1917
    original: לֵב צַדִּיק יֶהְגֶּה לַעֲנוֹת וּפִי רְשָׁעִים יַבִּיעַ רָעוֹת׃
    hebrewPlain: לב צדיק יהגה לענות ופי רשעים יביע רעות
    kjvRefs:
    - Proverbs 15:28
    kjvOsis:
    - Prov.15.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.29
    scripture: tanakh
    name: Tanakh Proverbs 15:29
    ref: Proverbs 15:29
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 29
    ordinal: 18105
    text: The LORD is far from the wicked; But He heareth the prayer of the righteous.
    translation: JPS 1917
    original: רָחוֹק יְהוָה מֵרְשָׁעִים וּתְפִלַּת צַדִּיקִים יִשְׁמָע׃
    hebrewPlain: רחוק יהוה מרשעים ותפלת צדיקים ישמע
    kjvRefs:
    - Proverbs 15:29
    kjvOsis:
    - Prov.15.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.30
    scripture: tanakh
    name: Tanakh Proverbs 15:30
    ref: Proverbs 15:30
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 30
    ordinal: 18106
    text: The light of the eyes rejoiceth the heart; And a good report maketh the bones fat.
    translation: JPS 1917
    original: מְאוֹר־עֵינַיִם יְשַׂמַּח־לֵב שְׁמוּעָה טוֹבָה תְּדַשֶּׁן־עָצֶם׃
    hebrewPlain: מאור עינים ישמח לב שמועה טובה תדשן עצם
    kjvRefs:
    - Proverbs 15:30
    kjvOsis:
    - Prov.15.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.31
    scripture: tanakh
    name: Tanakh Proverbs 15:31
    ref: Proverbs 15:31
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 31
    ordinal: 18107
    text: The ear that hearkeneth to the reproof of life abideth among the wise.
    translation: JPS 1917
    original: אֹזֶן שֹׁמַעַת תּוֹכַחַת חַיִּים בְּקֶרֶב חֲכָמִים תָּלִין׃
    hebrewPlain: אזן שמעת תוכחת חיים בקרב חכמים תלין
    kjvRefs:
    - Proverbs 15:31
    kjvOsis:
    - Prov.15.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.32
    scripture: tanakh
    name: Tanakh Proverbs 15:32
    ref: Proverbs 15:32
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 32
    ordinal: 18108
    text: He that refuseth correction despiseth his own soul; But he that hearkeneth to reproof getteth understanding.
    translation: JPS 1917
    original: פּוֹרֵעַ מוּסָר מוֹאֵס נַפְשׁוֹ וְשׁוֹמֵעַ תּוֹכַחַת קוֹנֶה לֵּב׃
    hebrewPlain: פורע מוסר מואס נפשו ושומע תוכחת קונה לב
    kjvRefs:
    - Proverbs 15:32
    kjvOsis:
    - Prov.15.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.15.33
    scripture: tanakh
    name: Tanakh Proverbs 15:33
    ref: Proverbs 15:33
    book: Prov
    section: ketuvim
    chapter: 15
    verse: 33
    ordinal: 18109
    text: The fear of the LORD is the instruction of wisdom; And before honour goeth humility.
    translation: JPS 1917
    original: יִרְאַת יְהוָה מוּסַר חָכְמָה וְלִפְנֵי כָבוֹד עֲנָוָה׃
    hebrewPlain: יראת יהוה מוסר חכמה ולפני כבוד ענוה
    kjvRefs:
    - Proverbs 15:33
    kjvOsis:
    - Prov.15.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.15
- type: TanakhVerse
  data:
    osis: Prov.16.1
    scripture: tanakh
    name: Tanakh Proverbs 16:1
    ref: Proverbs 16:1
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 1
    ordinal: 18110
    text: The preparations of the heart are man’s, But the answer of the tongue is from the LORD.
    translation: JPS 1917
    original: לְאָדָם מַעַרְכֵי־לֵב וּמֵיְהוָה מַעֲנֵה לָשׁוֹן׃
    hebrewPlain: לאדם מערכי לב ומיהוה מענה לשון
    kjvRefs:
    - Proverbs 16:1
    kjvOsis:
    - Prov.16.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.2
    scripture: tanakh
    name: Tanakh Proverbs 16:2
    ref: Proverbs 16:2
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 2
    ordinal: 18111
    text: All the ways of a man are clean in his own eyes; But the LORD weigheth the spirits.
    translation: JPS 1917
    original: כָּל־דַּרְכֵי־אִישׁ זַךְ בְּעֵינָיו וְתֹכֵן רוּחוֹת יְהוָה׃
    hebrewPlain: כל דרכי איש זך בעיניו ותכן רוחות יהוה
    kjvRefs:
    - Proverbs 16:2
    kjvOsis:
    - Prov.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.3
    scripture: tanakh
    name: Tanakh Proverbs 16:3
    ref: Proverbs 16:3
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 3
    ordinal: 18112
    text: Commit thy works unto the LORD, And thy thoughts shall be established.
    translation: JPS 1917
    original: גֹּל אֶל־יְהוָה מַעֲשֶׂיךָ וְיִכֹּנוּ מַחְשְׁבֹתֶיךָ׃
    hebrewPlain: גל אל יהוה מעשיך ויכנו מחשבתיך
    kjvRefs:
    - Proverbs 16:3
    kjvOsis:
    - Prov.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.4
    scripture: tanakh
    name: Tanakh Proverbs 16:4
    ref: Proverbs 16:4
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 4
    ordinal: 18113
    text: The LORD hath made every things for His own purpose, Yea, even the wicked for the day of evil.
    translation: JPS 1917
    original: כֹּל פָּעַל יְהוָה לַמַּעֲנֵהוּ וְגַם־רָשָׁע לְיוֹם רָעָה׃
    hebrewPlain: כל פעל יהוה למענהו וגם רשע ליום רעה
    kjvRefs:
    - Proverbs 16:4
    kjvOsis:
    - Prov.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.5
    scripture: tanakh
    name: Tanakh Proverbs 16:5
    ref: Proverbs 16:5
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 5
    ordinal: 18114
    text: Every one that is proud in heart is an abomination to the LORD; My hand upon it! he shall not be unpunished.
    translation: JPS 1917
    original: תּוֹעֲבַת יְהוָה כָּל־גְּבַהּ־לֵב יָד לְיָד לֹא יִנָּקֶה׃
    hebrewPlain: תועבת יהוה כל גבה לב יד ליד לא ינקה
    kjvRefs:
    - Proverbs 16:5
    kjvOsis:
    - Prov.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.6
    scripture: tanakh
    name: Tanakh Proverbs 16:6
    ref: Proverbs 16:6
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 6
    ordinal: 18115
    text: By mercy and truth iniquity is expiated; And by the fear of the LORD men depart from evil.
    translation: JPS 1917
    original: בְּחֶסֶד וֶאֱמֶת יְכֻפַּר עָוֺן וּבְיִרְאַת יְהוָה סוּר מֵרָע׃
    hebrewPlain: בחסד ואמת יכפר עון וביראת יהוה סור מרע
    kjvRefs:
    - Proverbs 16:6
    kjvOsis:
    - Prov.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.7
    scripture: tanakh
    name: Tanakh Proverbs 16:7
    ref: Proverbs 16:7
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 7
    ordinal: 18116
    text: When a man’s ways please the LORD, He maketh even his enemies to be at peace with him.
    translation: JPS 1917
    original: בִּרְצוֹת יְהוָה דַּרְכֵי־אִישׁ גַּם־אוֹיְבָיו יַשְׁלִם אִתּוֹ׃
    hebrewPlain: ברצות יהוה דרכי איש גם אויביו ישלם אתו
    kjvRefs:
    - Proverbs 16:7
    kjvOsis:
    - Prov.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.8
    scripture: tanakh
    name: Tanakh Proverbs 16:8
    ref: Proverbs 16:8
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 8
    ordinal: 18117
    text: Better is a little with righteousness Than great revenues with injustice.
    translation: JPS 1917
    original: טוֹב־מְעַט בִּצְדָקָה מֵרֹב תְּבוּאוֹת בְּלֹא מִשְׁפָּט׃
    hebrewPlain: טוב מעט בצדקה מרב תבואות בלא משפט
    kjvRefs:
    - Proverbs 16:8
    kjvOsis:
    - Prov.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.9
    scripture: tanakh
    name: Tanakh Proverbs 16:9
    ref: Proverbs 16:9
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 9
    ordinal: 18118
    text: A man’s heart deviseth his way; But the LORD directeth his steps.
    translation: JPS 1917
    original: לֵב אָדָם יְחַשֵּׁב דַּרְכּוֹ וַיהוָה יָכִין צַעֲדוֹ׃
    hebrewPlain: לב אדם יחשב דרכו ויהוה יכין צעדו
    kjvRefs:
    - Proverbs 16:9
    kjvOsis:
    - Prov.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.10
    scripture: tanakh
    name: Tanakh Proverbs 16:10
    ref: Proverbs 16:10
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 10
    ordinal: 18119
    text: A divine sentence is in the lips of the king; His mouth trespasseth not in judgment.
    translation: JPS 1917
    original: קֶסֶם עַל־שִׂפְתֵי־מֶלֶךְ בְּמִשְׁפָּט לֹא יִמְעַל־פִּיו׃
    hebrewPlain: קסם על שפתי מלך במשפט לא ימעל פיו
    kjvRefs:
    - Proverbs 16:10
    kjvOsis:
    - Prov.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.11
    scripture: tanakh
    name: Tanakh Proverbs 16:11
    ref: Proverbs 16:11
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 11
    ordinal: 18120
    text: A just balance and scales are the LORD’S; All the weights of the bag are His work.
    translation: JPS 1917
    original: פֶּלֶס וּמֹאזְנֵי מִשְׁפָּט לַיהוָה מַעֲשֵׂהוּ כָּל־אַבְנֵי־כִיס׃
    hebrewPlain: פלס ומאזני משפט ליהוה מעשהו כל אבני כיס
    kjvRefs:
    - Proverbs 16:11
    kjvOsis:
    - Prov.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.12
    scripture: tanakh
    name: Tanakh Proverbs 16:12
    ref: Proverbs 16:12
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 12
    ordinal: 18121
    text: It is an abomination to kings to commit wickedness; For the throne is established by righteousness.
    translation: JPS 1917
    original: תּוֹעֲבַת מְלָכִים עֲשׂוֹת רֶשַׁע כִּי בִצְדָקָה יִכּוֹן כִּסֵּא׃
    hebrewPlain: תועבת מלכים עשות רשע כי בצדקה יכון כסא
    kjvRefs:
    - Proverbs 16:12
    kjvOsis:
    - Prov.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.13
    scripture: tanakh
    name: Tanakh Proverbs 16:13
    ref: Proverbs 16:13
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 13
    ordinal: 18122
    text: Righteous lips are the delight of kings; And they love him that speaketh right.
    translation: JPS 1917
    original: רְצוֹן מְלָכִים שִׂפְתֵי־צֶדֶק וְדֹבֵר יְשָׁרִים יֶאֱהָב׃
    hebrewPlain: רצון מלכים שפתי צדק ודבר ישרים יאהב
    kjvRefs:
    - Proverbs 16:13
    kjvOsis:
    - Prov.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.14
    scripture: tanakh
    name: Tanakh Proverbs 16:14
    ref: Proverbs 16:14
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 14
    ordinal: 18123
    text: The wrath of a king is as messengers of death; But a wise man will pacify it.
    translation: JPS 1917
    original: חֲמַת־מֶלֶךְ מַלְאֲכֵי־מָוֶת וְאִישׁ חָכָם יְכַפְּרֶנָּה׃
    hebrewPlain: חמת מלך מלאכי מות ואיש חכם יכפרנה
    kjvRefs:
    - Proverbs 16:14
    kjvOsis:
    - Prov.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.15
    scripture: tanakh
    name: Tanakh Proverbs 16:15
    ref: Proverbs 16:15
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 15
    ordinal: 18124
    text: In the light of the king’s countenance is life; And his favour is as a cloud of the latter rain.
    translation: JPS 1917
    original: בְּאוֹר־פְּנֵי־מֶלֶךְ חַיִּים וּרְצוֹנוֹ כְּעָב מַלְקוֹשׁ׃
    hebrewPlain: באור פני מלך חיים ורצונו כעב מלקוש
    kjvRefs:
    - Proverbs 16:15
    kjvOsis:
    - Prov.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.16
    scripture: tanakh
    name: Tanakh Proverbs 16:16
    ref: Proverbs 16:16
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 16
    ordinal: 18125
    text: How much better is it to get wisdom than gold! Yea, to get understanding is rather to be chosen than silver.
    translation: JPS 1917
    original: קְנֹה־חָכְמָה מַה־טּוֹב מֵחָרוּץ וּקְנוֹת בִּינָה נִבְחָר מִכָּסֶף׃
    hebrewPlain: קנה חכמה מה טוב מחרוץ וקנות בינה נבחר מכסף
    kjvRefs:
    - Proverbs 16:16
    kjvOsis:
    - Prov.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.17
    scripture: tanakh
    name: Tanakh Proverbs 16:17
    ref: Proverbs 16:17
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 17
    ordinal: 18126
    text: The highway of the upright is to depart from evil; He that keepeth his way preserveth his soul.
    translation: JPS 1917
    original: מְסִלַּת יְשָׁרִים סוּר מֵרָע שֹׁמֵר נַפְשׁוֹ נֹצֵר דַּרְכּוֹ׃
    hebrewPlain: מסלת ישרים סור מרע שמר נפשו נצר דרכו
    kjvRefs:
    - Proverbs 16:17
