    name: Tanakh Proverbs 31:23
    ref: Proverbs 31:23
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 23
    ordinal: 18576
    text: Her husband is known in the gates, When he sitteth among the elders of the land.
    translation: JPS 1917
    original: נוֹדָע בַּשְּׁעָרִים בַּעְלָהּ בְּשִׁבְתּוֹ עִם־זִקְנֵי־אָרֶץ׃
    hebrewPlain: נודע בשערים בעלה בשבתו עם זקני ארץ
