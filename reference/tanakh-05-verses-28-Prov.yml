      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.26
    scripture: tanakh
    name: Tanakh Proverbs 16:26
    ref: Proverbs 16:26
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 26
    ordinal: 18135
    text: The hunger of the labouring man laboureth for him; For his mouth compelleth him.
    translation: JPS 1917
    original: נֶפֶשׁ עָמֵל עָמְלָה לּוֹ כִּי־אָכַף עָלָיו פִּיהוּ׃
    hebrewPlain: נפש עמל עמלה לו כי אכף עליו פיהו
    kjvRefs:
    - Proverbs 16:26
    kjvOsis:
    - Prov.16.26
  relations:
