  data:
    osis: Prov.10.10
    scripture: tanakh
    name: Tanakh Proverbs 10:10
    ref: Proverbs 10:10
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 17935
    text: He that winketh with the eye causeth sorrow; and a prating fool shall fall.
    translation: JPS 1917
    original: קֹרֵץ עַיִן יִתֵּן עַצָּבֶת וֶאֱוִיל שְׂפָתַיִם יִלָּבֵט׃
