    name: Tanakh Proverbs 31:22
    ref: Proverbs 31:22
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 22
    ordinal: 18575
    text: She maketh for herself coverlets; Her clothing is fine linen and purple.
    translation: JPS 1917
    original: מַרְבַדִּים עָשְׂתָה־לָּהּ שֵׁשׁ וְאַרְגָּמָן לְבוּשָׁהּ׃
    hebrewPlain: מרבדים עשתה לה שש וארגמן לבושה
