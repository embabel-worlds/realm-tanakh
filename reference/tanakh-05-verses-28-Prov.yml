    name: Tanakh Proverbs 31:24
    ref: Proverbs 31:24
    book: Prov
    section: ketuvim
    chapter: 31
    verse: 24
    ordinal: 18577
    text: She maketh linen garments and selleth them; And delivereth girdles unto the merchant.
    translation: JPS 1917
    original: סָדִין עָשְׂתָה וַתִּמְכֹּר וַחֲגוֹר נָתְנָה לַכְּנַעֲנִי׃
    hebrewPlain: סדין עשתה ותמכר וחגור נתנה לכנעני
