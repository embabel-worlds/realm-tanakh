- type: TanakhVerse
  data:
    osis: Prov.16.25
    scripture: tanakh
    name: Tanakh Proverbs 16:25
    ref: Proverbs 16:25
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 25
    ordinal: 18134
    text: There is a way which seemeth right unto a man, But the end thereof are the ways of death.
    translation: JPS 1917
    original: יֵשׁ דֶּרֶךְ יָשָׁר לִפְנֵי־אִישׁ וְאַחֲרִיתָהּ דַּרְכֵי־מָוֶת׃
    hebrewPlain: יש דרך ישר לפני איש ואחריתה דרכי מות
    kjvRefs:
    - Proverbs 16:25
    kjvOsis:
    - Prov.16.25
  relations:
  - predicate: IN
    to:
