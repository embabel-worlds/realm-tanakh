  data:
    osis: Prov.10.7
    scripture: tanakh
    name: Tanakh Proverbs 10:7
    ref: Proverbs 10:7
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 17932
    text: The memory of the righteous shall be for a blessing; but the name of the wicked shall rot.
    translation: JPS 1917
    original: זֵכֶר צַדִּיק לִבְרָכָה וְשֵׁם רְשָׁעִים יִרְקָב׃
    hebrewPlain: זכר צדיק לברכה ושם רשעים ירקב
