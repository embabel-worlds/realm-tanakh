    ref: Proverbs 10:1
    book: Prov
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 17926
    text: The proverbs of Solomon. A wise son maketh a glad father; but a foolish son is the grief of his mother.
    translation: JPS 1917
    original: מִשְׁלֵי שְׁלֹמֹה בֵּן חָכָם יְשַׂמַּח־אָב וּבֵן כְּסִיל תּוּגַת אִמּוֹ׃
    hebrewPlain: משלי שלמה בן חכם ישמח אב ובן כסיל תוגת אמו
    kjvRefs:
    - Proverbs 10:1
    kjvOsis:
    - Prov.10.1
