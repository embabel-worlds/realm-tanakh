  data:
    osis: Prov.9.18
    scripture: tanakh
    name: Tanakh Proverbs 9:18
    ref: Proverbs 9:18
    book: Prov
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 17925
    text: But he knoweth not that the shades are there; that her guests are in the depths of the nether-world.
    translation: JPS 1917
    original: וְלֹא־יָדַע כִּי־רְפָאִים שָׁם בְּעִמְקֵי שְׁאוֹל קְרֻאֶיהָ׃
    hebrewPlain: ולא ידע כי רפאים שם בעמקי שאול קראיה
    kjvRefs:
