  data:
    osis: Prov.16.29
    scripture: tanakh
    name: Tanakh Proverbs 16:29
    ref: Proverbs 16:29
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 29
    ordinal: 18138
    text: A man of violence enticeth his neighbour, And leadeth him into a way that is not good.
    translation: JPS 1917
    original: אִישׁ חָמָס יְפַתֶּה רֵעֵהוּ וְהוֹלִיכוֹ בְּדֶרֶךְ לֹא־טוֹב׃
    hebrewPlain: איש חמס יפתה רעהו והוליכו בדרך לא טוב
    kjvRefs:
    - Proverbs 16:29
    kjvOsis:
