  data:
    osis: Prov.16.28
    scripture: tanakh
    name: Tanakh Proverbs 16:28
    ref: Proverbs 16:28
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 28
    ordinal: 18137
    text: A froward man soweth strife; And a whisperer separateth familiar friends.
    translation: JPS 1917
    original: אִישׁ תַּהְפֻּכוֹת יְשַׁלַּח מָדוֹן וְנִרְגָּן מַפְרִיד אַלּוּף׃
    hebrewPlain: איש תהפכות ישלח מדון ונרגן מפריד אלוף
    kjvRefs:
    - Proverbs 16:28
    kjvOsis:
    - Prov.16.28
