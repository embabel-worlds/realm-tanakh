      osis: Prov.16
- type: TanakhVerse
  data:
    osis: Prov.16.22
    scripture: tanakh
    name: Tanakh Proverbs 16:22
    ref: Proverbs 16:22
    book: Prov
    section: ketuvim
    chapter: 16
    verse: 22
    ordinal: 18131
    text: Understanding is a fountain of life unto him that hath it; But folly is the chastisement of fools.
    translation: JPS 1917
    original: מְקוֹר חַיִּים שֵׂכֶל בְּעָלָיו וּמוּסַר אֱוִלִים אִוֶּלֶת׃
    hebrewPlain: מקור חיים שכל בעליו ומוסר אולים אולת
    kjvRefs:
