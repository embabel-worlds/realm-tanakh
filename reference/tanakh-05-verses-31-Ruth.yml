    verse: 19
    ordinal: 19790
    text: 'So they two went until they came to Beth-lehem. And it came to pass, when they were come to Beth-lehem, that all the city was astir concerning them, and the women said: ‘Is this Naomi?’'
    translation: JPS 1917
    original: וַתֵּלַכְנָה שְׁתֵּיהֶם עַד־בֹּאָנָה בֵּית לָחֶם וַיְהִי כְּבֹאָנָה בֵּית לֶחֶם וַתֵּהֹם כָּל־הָעִיר עֲלֵיהֶן וַתֹּאמַרְנָה הֲזֹאת נָעֳמִי׃
    hebrewPlain: ותלכנה שתיהם עד באנה בית לחם ויהי כבאנה בית לחם ותהם כל העיר עליהן ותאמרנה הזאת נעמי
    kjvRefs:
    - Ruth 1:19
    kjvOsis:
    - Ruth.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.1
- type: TanakhVerse
  data:
    osis: Ruth.1.20
    scripture: tanakh
    name: Tanakh Ruth 1:20
    ref: Ruth 1:20
    book: Ruth
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 19791
    text: 'And she said unto them: ‘Call me not Naomi, call me Marah; for the Almighty hath dealt very bitterly with me.'
    translation: JPS 1917
    original: וַתֹּאמֶר אֲלֵיהֶן אַל־תִּקְרֶאנָה לִי נָעֳמִי קְרֶאןָ לִי מָרָא כִּי־הֵמַר שַׁדַּי לִי מְאֹד׃
    hebrewPlain: ותאמר אליהן אל תקראנה לי נעמי קראן לי מרא כי המר שדי לי מאד
    kjvRefs:
    - Ruth 1:20
    kjvOsis:
    - Ruth.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.1
- type: TanakhVerse
  data:
    osis: Ruth.1.21
    scripture: tanakh
    name: Tanakh Ruth 1:21
    ref: Ruth 1:21
    book: Ruth
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 19792
    text: I went out full, and the LORD hath brought me back home empty; why call ye me Naomi, seeing the LORD hath testified against me, and the Almighty hath afflicted me?’
    translation: JPS 1917
    original: אֲנִי מְלֵאָה הָלַכְתִּי וְרֵיקָם הֱשִׁיבַנִי יְהוָה לָמָּה תִקְרֶאנָה לִי נָעֳמִי וַיהוָה עָנָה בִי וְשַׁדַּי הֵרַע לִי׃
    hebrewPlain: אני מלאה הלכתי וריקם השיבני יהוה למה תקראנה לי נעמי ויהוה ענה בי ושדי הרע לי
    kjvRefs:
    - Ruth 1:21
    kjvOsis:
    - Ruth.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.1
- type: TanakhVerse
  data:
    osis: Ruth.1.22
    scripture: tanakh
    name: Tanakh Ruth 1:22
    ref: Ruth 1:22
    book: Ruth
    section: ketuvim
    chapter: 1
    verse: 22
    ordinal: 19793
    text: So Naomi returned, and Ruth the Moabitess, her daughter-in-law, with her, who returned out of the field of Moab—and they came to Beth-lehem in the beginning of barley harvest.
    translation: JPS 1917
    original: וַתָּשָׁב נָעֳמִי וְרוּת הַמּוֹאֲבִיָּה כַלָּתָהּ עִמָּהּ הַשָּׁבָה מִשְּׂדֵי מוֹאָב וְהֵמָּה בָּאוּ בֵּית לֶחֶם בִּתְחִלַּת קְצִיר שְׂעֹרִים׃
    hebrewPlain: ותשב נעמי ורות המואביה כלתה עמה השבה משדי מואב והמה באו בית לחם בתחלת קציר שערים
    kjvRefs:
    - Ruth 1:22
    kjvOsis:
    - Ruth.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.1
- type: TanakhVerse
  data:
    osis: Ruth.2.1
    scripture: tanakh
    name: Tanakh Ruth 2:1
    ref: Ruth 2:1
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 19794
    text: And Naomi had a kinsman of her husband’s, a mighty man of valour, of the family of Elimelech, and his name was Boaz.
    translation: JPS 1917
    original: וּלְנָעֳמִי מידע [מוֹדַע] לְאִישָׁהּ אִישׁ גִּבּוֹר חַיִל מִמִּשְׁפַּחַת אֱלִימֶלֶךְ וּשְׁמוֹ בֹּעַז׃
    hebrewPlain: ולנעמי מידע [מודע] לאישה איש גבור חיל ממשפחת אלימלך ושמו בעז
    kjvRefs:
    - Ruth 2:1
    kjvOsis:
    - Ruth.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.2
    scripture: tanakh
    name: Tanakh Ruth 2:2
    ref: Ruth 2:2
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 19795
    text: 'And Ruth the Moabitess said unto Naomi: ‘Let me now go to the field, and glean among the ears of corn after him in whose sight I shall find favour.’ And she said unto her: ‘Go, my daughter.’'
    translation: JPS 1917
    original: וַתֹּאמֶר רוּת הַמּוֹאֲבִיָּה אֶל־נָעֳמִי אֵלְכָה־נָּא הַשָּׂדֶה וַאֲלַקֳטָּה בַשִׁבֳּלִים אַחַר אֲשֶׁר אֶמְצָא־חֵן בְּעֵינָיו וַתֹּאמֶר לָהּ לְכִי בִתִּי׃
    hebrewPlain: ותאמר רות המואביה אל נעמי אלכה נא השדה ואלקטה בשבלים אחר אשר אמצא חן בעיניו ותאמר לה לכי בתי
    kjvRefs:
    - Ruth 2:2
    kjvOsis:
    - Ruth.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.3
    scripture: tanakh
    name: Tanakh Ruth 2:3
    ref: Ruth 2:3
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 19796
    text: And she went, and came and gleaned in the field after the reapers; and her hap was to light on the portion of the field belonging unto Boaz, who was of the family of Elimelech.
    translation: JPS 1917
    original: וַתֵּלֶךְ וַתָּבוֹא וַתְּלַקֵּט בַּשָּׂדֶה אַחֲרֵי הַקֹּצְרִים וַיִּקֶר מִקְרֶהָ חֶלְקַת הַשָּׂדֶה לְבֹעַז אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ׃
    hebrewPlain: ותלך ותבוא ותלקט בשדה אחרי הקצרים ויקר מקרה חלקת השדה לבעז אשר ממשפחת אלימלך
    kjvRefs:
    - Ruth 2:3
    kjvOsis:
    - Ruth.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.4
    scripture: tanakh
    name: Tanakh Ruth 2:4
    ref: Ruth 2:4
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 19797
    text: 'And, behold, Boaz came from Beth-lehem, and said unto the reapers: ‘The LORD be with you.’ And they answered him: ‘The LORD bless thee.’'
    translation: JPS 1917
    original: וְהִנֵּה־בֹעַז בָּא מִבֵּית לֶחֶם וַיֹּאמֶר לַקּוֹצְרִים יְהוָה עִמָּכֶם וַיֹּאמְרוּ לוֹ יְבָרֶכְךָ יְהוָה׃
    hebrewPlain: והנה בעז בא מבית לחם ויאמר לקוצרים יהוה עמכם ויאמרו לו יברכך יהוה
    kjvRefs:
    - Ruth 2:4
    kjvOsis:
    - Ruth.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.5
    scripture: tanakh
    name: Tanakh Ruth 2:5
    ref: Ruth 2:5
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 19798
    text: 'Then said Boaz unto his servant that was set over the reapers: ‘Whose damsel is this?’'
    translation: JPS 1917
    original: וַיֹּאמֶר בֹּעַז לְנַעֲרוֹ הַנִּצָּב עַל־הַקּוֹצְרִים לְמִי הַנַּעֲרָה הַזֹּאת׃
    hebrewPlain: ויאמר בעז לנערו הנצב על הקוצרים למי הנערה הזאת
    kjvRefs:
    - Ruth 2:5
    kjvOsis:
    - Ruth.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.6
    scripture: tanakh
    name: Tanakh Ruth 2:6
    ref: Ruth 2:6
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 19799
    text: 'And the servant that was set over the reapers answered and said: ‘It is a Moabitish damsel that came back with Naomi out of the field of Moab;'
    translation: JPS 1917
    original: וַיַּעַן הַנַּעַר הַנִּצָּב עַל־הַקּוֹצְרִים וַיֹּאמַר נַעֲרָה מוֹאֲבִיָּה הִיא הַשָּׁבָה עִם־נָעֳמִי מִשְּׂדֵה מוֹאָב׃
    hebrewPlain: ויען הנער הנצב על הקוצרים ויאמר נערה מואביה היא השבה עם נעמי משדה מואב
    kjvRefs:
    - Ruth 2:6
    kjvOsis:
    - Ruth.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.7
    scripture: tanakh
    name: Tanakh Ruth 2:7
    ref: Ruth 2:7
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 19800
    text: 'and she said: Let me glean, I pray you, and gather after the reapers among the sheaves; so she came, and hath continued even from the morning until now, save that she tarried a little in the house.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֲלַקֳטָה־נָּא וְאָסַפְתִּי בָעֳמָרִים אַחֲרֵי הַקּוֹצְרִים וַתָּבוֹא וַתַּעֲמוֹד מֵאָז הַבֹּקֶר וְעַד־עַתָּה זֶה שִׁבְתָּהּ הַבַּיִת מְעָט׃
    hebrewPlain: ותאמר אלקטה נא ואספתי בעמרים אחרי הקוצרים ותבוא ותעמוד מאז הבקר ועד עתה זה שבתה הבית מעט
    kjvRefs:
    - Ruth 2:7
    kjvOsis:
    - Ruth.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.8
    scripture: tanakh
    name: Tanakh Ruth 2:8
    ref: Ruth 2:8
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 19801
    text: 'Then said Boaz unto Ruth: ‘Hearest thou not, my daughter? Go not to glean in another field, neither pass from hence, but abide here fast by my maidens.'
    translation: JPS 1917
    original: וַיֹּאמֶר בֹּעַז אֶל־רוּת הֲלוֹא שָׁמַעַתְּ בִּתִּי אַל־תֵּלְכִי לִלְקֹט בְּשָׂדֶה אַחֵר וְגַם לֹא תַעֲבוּרִי מִזֶּה וְכֹה תִדְבָּקִין עִם־נַעֲרֹתָי׃
    hebrewPlain: ויאמר בעז אל רות הלוא שמעת בתי אל תלכי ללקט בשדה אחר וגם לא תעבורי מזה וכה תדבקין עם נערתי
    kjvRefs:
    - Ruth 2:8
    kjvOsis:
    - Ruth.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.9
    scripture: tanakh
    name: Tanakh Ruth 2:9
    ref: Ruth 2:9
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 19802
    text: Let thine eyes be on the field that they do reap, and go thou after them; have I not charged the young men that they shall not touch thee? and when thou art athirst, go unto the vessels, and drink of that which the young men have drawn.’
    translation: JPS 1917
    original: עֵינַיִךְ בַּשָּׂדֶה אֲשֶׁר־יִקְצֹרוּן וְהָלַכְתִּ אַחֲרֵיהֶן הֲלוֹא צִוִּיתִי אֶת־הַנְּעָרִים לְבִלְתִּי נָגְעֵךְ וְצָמִת וְהָלַכְתְּ אֶל־הַכֵּלִים וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים׃
    hebrewPlain: עיניך בשדה אשר יקצרון והלכת אחריהן הלוא צויתי את הנערים לבלתי נגעך וצמת והלכת אל הכלים ושתית מאשר ישאבון הנערים
    kjvRefs:
    - Ruth 2:9
    kjvOsis:
    - Ruth.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.10
    scripture: tanakh
    name: Tanakh Ruth 2:10
    ref: Ruth 2:10
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 19803
    text: 'Then she fell on her face, and bowed down to the ground, and said unto him: ‘Why have I found favour in thy sight, that thou shouldest take cognizance of me, seeing I am a foreigner?’'
    translation: JPS 1917
    original: וַתִּפֹּל עַל־פָּנֶיהָ וַתִּשְׁתַּחוּ אָרְצָה וַתֹּאמֶר אֵלָיו מַדּוּעַ מָצָאתִי חֵן בְּעֵינֶיךָ לְהַכִּירֵנִי וְאָּנֹכִי נָכְרִיָּה׃
    hebrewPlain: ותפל על פניה ותשתחו ארצה ותאמר אליו מדוע מצאתי חן בעיניך להכירני ואנכי נכריה
    kjvRefs:
    - Ruth 2:10
    kjvOsis:
    - Ruth.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.11
    scripture: tanakh
    name: Tanakh Ruth 2:11
    ref: Ruth 2:11
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 19804
    text: 'And Boaz answered and said unto her: ‘It hath fully been told me, all that thou hast done unto thy mother-in-law since the death of thy husband; and how thou hast left thy father and thy mother, and the land of thy nativity, and art come unto a people that thou knewest not heretofore.'
    translation: JPS 1917
    original: וַיַּעַן בֹּעַז וַיֹּאמֶר לָהּ הֻגֵּד הֻגַּד לִי כֹּל אֲשֶׁר־עָשִׂית אֶת־חֲמוֹתֵךְ אַחֲרֵי מוֹת אִישֵׁךְ וַתַּעַזְבִי אָּבִיךְ וְאִמֵּךְ וְאֶרֶץ מוֹלַדְתֵּךְ וַתֵּלְכִי אֶל־עַם אֲשֶׁר לֹא־יָדַעַתְּ תְּמוֹל שִׁלְשׁוֹם׃
    hebrewPlain: ויען בעז ויאמר לה הגד הגד לי כל אשר עשית את חמותך אחרי מות אישך ותעזבי אביך ואמך וארץ מולדתך ותלכי אל עם אשר לא ידעת תמול שלשום
    kjvRefs:
    - Ruth 2:11
    kjvOsis:
    - Ruth.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.12
    scripture: tanakh
    name: Tanakh Ruth 2:12
    ref: Ruth 2:12
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 19805
    text: The LORD recompense thy work, and be thy reward complete from the LORD, the God of Israel, under whose wings thou art come to take refuge.’
    translation: JPS 1917
    original: יְשַׁלֵּם יְהוָה פָּעֳלֵךְ וּתְהִי מַשְׂכֻּרְתֵּךְ שְׁלֵמָה מֵעִם יְהוָה אֱלֹהֵי יִשְׂרָאֵל אֲשֶׁר־בָּאת לַחֲסוֹת תַּחַת־כְּנָפָיו׃
    hebrewPlain: ישלם יהוה פעלך ותהי משכרתך שלמה מעם יהוה אלהי ישראל אשר באת לחסות תחת כנפיו
    kjvRefs:
    - Ruth 2:12
    kjvOsis:
    - Ruth.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.13
    scripture: tanakh
    name: Tanakh Ruth 2:13
    ref: Ruth 2:13
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 19806
    text: 'Then she said: ‘Let me find favour in thy sight, my LORD; for that thou hast comforted me, and for that thou hast spoken to the heart of thy handmaid, though I be not as one of thy handmaidens.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶמְצָא־חֵן בְּעֵינֶיךָ אֲדֹנִי כִּי נִחַמְתָּנִי וְכִי דִבַּרְתָּ עַל־לֵב שִׁפְחָתֶךָ וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת שִׁפְחֹתֶיךָ׃
    hebrewPlain: ותאמר אמצא חן בעיניך אדני כי נחמתני וכי דברת על לב שפחתך ואנכי לא אהיה כאחת שפחתיך
    kjvRefs:
    - Ruth 2:13
    kjvOsis:
    - Ruth.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.14
    scripture: tanakh
    name: Tanakh Ruth 2:14
    ref: Ruth 2:14
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 19807
    text: 'And Boaz said unto her at meal-time: ‘Come hither, and eat of the bread, and dip thy morsel in the vinegar.’ And she sat beside the reapers; and they reached her parched corn, and she did eat and was satisfied, and left thereof.'
    translation: JPS 1917
    original: וַיֹּאמֶר לָה בֹעַז לְעֵת הָאֹכֶל גֹּשִׁי הֲלֹם וְאָכַלְתְּ מִן־הַלֶּחֶם וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ וַתֵּשֶׁב מִצַּד הַקּוֹצְרִים וַיִּצְבָּט־לָהּ קָלִי וַתֹּאכַל וַתִּשְׂבַּע וַתֹּתַר׃
    hebrewPlain: ויאמר לה בעז לעת האכל גשי הלם ואכלת מן הלחם וטבלת פתך בחמץ ותשב מצד הקוצרים ויצבט לה קלי ותאכל ותשבע ותתר
    kjvRefs:
    - Ruth 2:14
    kjvOsis:
    - Ruth.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.15
    scripture: tanakh
    name: Tanakh Ruth 2:15
    ref: Ruth 2:15
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 19808
    text: 'And when she was risen up to glean, Boaz commanded his young men, saying: ‘Let her glean even among the sheaves, and put her not to shame.'
    translation: JPS 1917
    original: וַתָּקָם לְלַקֵּט וַיְצַו בֹּעַז אֶת־נְעָרָיו לֵאמֹר גַּם בֵּין הָעֳמָרִים תְּלַקֵּט וְלֹא תַכְלִימוּהָ׃
    hebrewPlain: ותקם ללקט ויצו בעז את נעריו לאמר גם בין העמרים תלקט ולא תכלימוה
    kjvRefs:
    - Ruth 2:15
    kjvOsis:
    - Ruth.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.16
    scripture: tanakh
    name: Tanakh Ruth 2:16
    ref: Ruth 2:16
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 19809
    text: And also pull out some for her of purpose from the bundles, and leave it, and let her glean, and rebuke her not.’
    translation: JPS 1917
    original: וְגַם שֹׁל־תָּשֹׁלּוּ לָהּ מִן־הַצְּבָתִים וַעֲזַבְתֶּם וְלִקְּטָה וְלֹא תִגְעֲרוּ־בָהּ׃
    hebrewPlain: וגם של תשלו לה מן הצבתים ועזבתם ולקטה ולא תגערו בה
    kjvRefs:
    - Ruth 2:16
    kjvOsis:
    - Ruth.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.17
    scripture: tanakh
    name: Tanakh Ruth 2:17
    ref: Ruth 2:17
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 19810
    text: So she gleaned in the field until even; and she beat out that which she had gleaned, and it was about an ephah of barley.
    translation: JPS 1917
    original: וַתְּלַקֵּט בַּשָּׂדֶה עַד־הָעָרֶב וַתַּחְבֹּט אֵת אֲשֶׁר־לִקֵּטָה וַיְהִי כְּאֵיפָה שְׂעֹרִים׃
    hebrewPlain: ותלקט בשדה עד הערב ותחבט את אשר לקטה ויהי כאיפה שערים
    kjvRefs:
    - Ruth 2:17
    kjvOsis:
    - Ruth.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.18
    scripture: tanakh
    name: Tanakh Ruth 2:18
    ref: Ruth 2:18
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 19811
    text: And she took it up, and went into the city; and her mother-in-law saw what she had gleaned; and she brought forth and gave to her that which she had left after she was satisfied.
    translation: JPS 1917
    original: וַתִּשָּׂא וַתָּבוֹא הָעִיר וַתֵּרֶא חֲמוֹתָהּ אֵת אֲשֶׁר־לִקֵּטָה וַתּוֹצֵא וַתִּתֶּן־לָהּ אֵת אֲשֶׁר־הוֹתִרָה מִשָּׂבְעָהּ׃
    hebrewPlain: ותשא ותבוא העיר ותרא חמותה את אשר לקטה ותוצא ותתן לה את אשר הותרה משבעה
    kjvRefs:
    - Ruth 2:18
    kjvOsis:
    - Ruth.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.19
    scripture: tanakh
    name: Tanakh Ruth 2:19
    ref: Ruth 2:19
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 19812
    text: 'And her mother-in-law said unto her: ‘Where hast thou gleaned to-day? and where wroughtest thou? blessed be he that did take knowledge of thee.’ And she told her mother-in-law with whom she had wrought, and said: ‘The man’s name with whom I wrought to-day is Boaz.’'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהּ חֲמוֹתָהּ אֵיפֹה לִקַּטְתְּ הַיּוֹם וְאָנָה עָשִׂית יְהִי מַכִּירֵךְ בָּרוּךְ וַתַּגֵּד לַחֲמוֹתָהּ אֵת אֲשֶׁר־עָשְׂתָה עִמּוֹ וַתֹּאמֶר שֵׁם הָאִישׁ אֲשֶׁר עָשִׂיתִי עִמּוֹ הַיּוֹם בֹּעַז׃
    hebrewPlain: ותאמר לה חמותה איפה לקטת היום ואנה עשית יהי מכירך ברוך ותגד לחמותה את אשר עשתה עמו ותאמר שם האיש אשר עשיתי עמו היום בעז
    kjvRefs:
    - Ruth 2:19
    kjvOsis:
    - Ruth.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.20
    scripture: tanakh
    name: Tanakh Ruth 2:20
    ref: Ruth 2:20
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 19813
    text: 'And Naomi said unto her daughter-in-law: ‘Blessed be he of the LORD, who hath not left off His kindness to the living and to the dead.’ And Naomi said unto her: ‘The man is nigh of kin unto us, one of our near kinsmen.’'
    translation: JPS 1917
    original: וַתֹּאמֶר נָעֳמִי לְכַלָּתָהּ בָּרוּךְ הוּא לַיהוָה אֲשֶׁר לֹא־עָזַב חַסְדּוֹ אֶת־הַחַיִּים וְאֶת־הַמֵּתִים וַתֹּאמֶר לָהּ נָעֳמִי קָרוֹב לָנוּ הָאִישׁ מִגֹּאֲלֵנוּ הוּא׃
    hebrewPlain: ותאמר נעמי לכלתה ברוך הוא ליהוה אשר לא עזב חסדו את החיים ואת המתים ותאמר לה נעמי קרוב לנו האיש מגאלנו הוא
    kjvRefs:
    - Ruth 2:20
    kjvOsis:
    - Ruth.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.21
    scripture: tanakh
    name: Tanakh Ruth 2:21
    ref: Ruth 2:21
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 19814
    text: 'And Ruth the Moabitess said: ‘Yea, he said unto me: Thou shalt keep fast by my young men, until they have ended all my harvest.’'
    translation: JPS 1917
    original: וַתֹּאמֶר רוּת הַמּוֹאֲבִיָּה גַּם כִּי־אָמַר אֵלַי עִם־הַנְּעָרִים אֲשֶׁר־לִי תִּדְבָּקִין עַד אִם־כִּלּוּ אֵת כָּל־הַקָּצִיר אֲשֶׁר־לִי׃
    hebrewPlain: ותאמר רות המואביה גם כי אמר אלי עם הנערים אשר לי תדבקין עד אם כלו את כל הקציר אשר לי
    kjvRefs:
    - Ruth 2:21
    kjvOsis:
    - Ruth.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.22
    scripture: tanakh
    name: Tanakh Ruth 2:22
    ref: Ruth 2:22
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 19815
    text: 'And Naomi said unto Ruth her daughter-in-law: ‘It is good, my daughter, that thou go out with his maidens, and that thou be not met in any other field.’'
    translation: JPS 1917
    original: וַתֹּאמֶר נָעֳמִי אֶל־רוּת כַּלָּתָהּ טוֹב בִּתִּי כִּי תֵצְאִי עִם־נַעֲרוֹתָיו וְלֹא יִפְגְּעוּ־בָךְ בְּשָׂדֶה אַחֵר׃
    hebrewPlain: ותאמר נעמי אל רות כלתה טוב בתי כי תצאי עם נערותיו ולא יפגעו בך בשדה אחר
    kjvRefs:
    - Ruth 2:22
    kjvOsis:
    - Ruth.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.2.23
    scripture: tanakh
    name: Tanakh Ruth 2:23
    ref: Ruth 2:23
    book: Ruth
    section: ketuvim
    chapter: 2
    verse: 23
    ordinal: 19816
    text: So she kept fast by the maidens of Boaz to glean unto the end of barley harvest and of wheat harvest; and she dwelt with her mother-in-law.
    translation: JPS 1917
    original: וַתִּדְבַּק בְּנַעֲרוֹת בֹּעַז לְלַקֵּט עַד־כְּלוֹת קְצִיר־הַשְּׂעֹרִים וּקְצִיר הַחִטִּים וַתֵּשֶׁב אֶת־חֲמוֹתָהּ׃
    hebrewPlain: ותדבק בנערות בעז ללקט עד כלות קציר השערים וקציר החטים ותשב את חמותה
    kjvRefs:
    - Ruth 2:23
    kjvOsis:
    - Ruth.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.2
- type: TanakhVerse
  data:
    osis: Ruth.3.1
    scripture: tanakh
    name: Tanakh Ruth 3:1
    ref: Ruth 3:1
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 19817
    text: 'And Naomi her mother-in-law said unto her: ‘My daughter, shall I not seek rest for thee, that it may be well with thee?'
    translation: JPS 1917
    original: וַתֹּאמֶר לָהּ נָעֳמִי חֲמוֹתָהּ בִּתִּי הֲלֹא אֲבַקֶּשׁ־לָךְ מָנוֹחַ אֲשֶׁר יִיטַב־לָךְ׃
    hebrewPlain: ותאמר לה נעמי חמותה בתי הלא אבקש לך מנוח אשר ייטב לך
    kjvRefs:
    - Ruth 3:1
    kjvOsis:
    - Ruth.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.2
    scripture: tanakh
    name: Tanakh Ruth 3:2
    ref: Ruth 3:2
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 19818
    text: And now is there not Boaz our kinsman, with whose maidens thou wast? Behold, he winnoweth barley to-night in the threshing-floor.
    translation: JPS 1917
    original: וְעַתָּה הֲלֹא בֹעַז מֹדַעְתָּנוּ אֲשֶׁר הָיִית אֶת־נַעֲרוֹתָיו הִנֵּה־הוּא זֹרֶה אֶת־גֹּרֶן הַשְּׂעֹרִים הַלָּיְלָה׃
    hebrewPlain: ועתה הלא בעז מדעתנו אשר היית את נערותיו הנה הוא זרה את גרן השערים הלילה
    kjvRefs:
    - Ruth 3:2
    kjvOsis:
    - Ruth.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.3
    scripture: tanakh
    name: Tanakh Ruth 3:3
    ref: Ruth 3:3
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 19819
    text: Wash thyself therefore, and anoint thee, and put thy raiment upon thee, and get thee down to the threshing-floor; but make not thyself known unto the man, until he shall have done eating and drinking.
    translation: JPS 1917
    original: וְרָחַצְתְּ וָסַכְתְּ וְשַׂמְתְּ שמלתך [שִׂמְלֹתַיִךְ] עָלַיִךְ וירדתי [וְיָרַדְתְּ] הַגֹּרֶן אַל־תִּוָּדְעִי לָאִישׁ עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת׃
    hebrewPlain: ורחצת וסכת ושמת שמלתך [שמלתיך] עליך וירדתי [וירדת] הגרן אל תודעי לאיש עד כלתו לאכל ולשתות
    kjvRefs:
    - Ruth 3:3
    kjvOsis:
    - Ruth.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.4
    scripture: tanakh
    name: Tanakh Ruth 3:4
    ref: Ruth 3:4
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 19820
    text: And it shall be, when he lieth down, that thou shalt mark the place where he shall lie, and thou shalt go in, and uncover his feet, and lay thee down; and he will tell thee what thou shalt do.’
    translation: JPS 1917
    original: וִיהִי בְשָׁכְבוֹ וְיָדַעַתְּ אֶת־הַמָּקוֹם אֲשֶׁר יִשְׁכַּב־שָׁם וּבָאת וְגִלִּית מַרְגְּלֹתָיו ושכבתי [וְשָׁכָבְתְּ] וְהוּא יַגִּיד לָךְ אֵת אֲשֶׁר תַּעַשִׂין׃
    hebrewPlain: ויהי בשכבו וידעת את המקום אשר ישכב שם ובאת וגלית מרגלתיו ושכבתי [ושכבת] והוא יגיד לך את אשר תעשין
    kjvRefs:
    - Ruth 3:4
    kjvOsis:
    - Ruth.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.5
    scripture: tanakh
    name: Tanakh Ruth 3:5
    ref: Ruth 3:5
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 19821
    text: 'And she said unto her: ‘All that thou sayest unto me I will do.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֵלֶיהָ כֹּל אֲשֶׁר־תֹּאמְרִי [אֵלַי] אֶעֱשֶׂה׃
    hebrewPlain: ותאמר אליה כל אשר תאמרי [אלי] אעשה
    kjvRefs:
    - Ruth 3:5
    kjvOsis:
    - Ruth.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.6
    scripture: tanakh
    name: Tanakh Ruth 3:6
    ref: Ruth 3:6
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 19822
    text: And she went down unto the threshing-floor, and did according to all that her mother-in-law bade her.
    translation: JPS 1917
    original: וַתֵּרֶד הַגֹּרֶן וַתַּעַשׂ כְּכֹל אֲשֶׁר־צִוַּתָּה חֲמוֹתָהּ׃
    hebrewPlain: ותרד הגרן ותעש ככל אשר צותה חמותה
    kjvRefs:
    - Ruth 3:6
    kjvOsis:
    - Ruth.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.7
    scripture: tanakh
    name: Tanakh Ruth 3:7
    ref: Ruth 3:7
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 19823
    text: And when Boaz had eaten and drunk, and his heart was merry, he went to lie down at the end of the heap of corn; and she came softly, and uncovered his feet, and laid her down.
    translation: JPS 1917
    original: וַיֹּאכַל בֹּעַז וַיֵּשְׁתְּ וַיִּיטַב לִבּוֹ וַיָּבֹא לִשְׁכַּב בִּקְצֵה הָעֲרֵמָה וַתָּבֹא בַלָּט וַתְּגַל מַרְגְּלֹתָיו וַתִּשְׁכָּב׃
    hebrewPlain: ויאכל בעז וישת וייטב לבו ויבא לשכב בקצה הערמה ותבא בלט ותגל מרגלתיו ותשכב
    kjvRefs:
    - Ruth 3:7
    kjvOsis:
    - Ruth.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.8
    scripture: tanakh
    name: Tanakh Ruth 3:8
    ref: Ruth 3:8
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 19824
    text: And it came to pass at midnight, that the man was startled, and turned himself; and, behold, a woman lay at his feet.
    translation: JPS 1917
    original: וַיְהִי בַּחֲצִי הַלַּיְלָה וַיֶּחֱרַד הָאִישׁ וַיִּלָּפֵת וְהִנֵּה אִשָּׁה שֹׁכֶבֶת מַרְגְּלֹתָיו׃
    hebrewPlain: ויהי בחצי הלילה ויחרד האיש וילפת והנה אשה שכבת מרגלתיו
    kjvRefs:
    - Ruth 3:8
    kjvOsis:
    - Ruth.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.9
    scripture: tanakh
    name: Tanakh Ruth 3:9
    ref: Ruth 3:9
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 19825
    text: 'And he said: ‘Who art thou?’ And she answered: ‘I am Ruth thine handmaid; spread therefore thy skirt over thy handmaid; for thou art a near kinsman.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מִי־אָתּ וַתֹּאמֶר אָנֹכִי רוּת אֲמָתֶךָ וּפָרַשְׂתָּ כְנָפֶךָ עַל־אֲמָתְךָ כִּי גֹאֵל אָתָּה׃
    hebrewPlain: ויאמר מי את ותאמר אנכי רות אמתך ופרשת כנפך על אמתך כי גאל אתה
    kjvRefs:
    - Ruth 3:9
    kjvOsis:
    - Ruth.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.10
    scripture: tanakh
    name: Tanakh Ruth 3:10
    ref: Ruth 3:10
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 19826
    text: 'And he said: ‘Blessed be thou of the LORD, my daughter; thou hast shown more kindness in the end than at the beginning, inasmuch as thou didst not follow the young men, whether poor or rich.'
    translation: JPS 1917
    original: וַיֹּאמֶר בְּרוּכָה אַתְּ לַיהוָה בִּתִּי הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן־הָרִאשׁוֹן לְבִלְתִּי־לֶכֶת אַחֲרֵי הַבַּחוּרִים אִם־דַּל וְאִם־עָשִׁיר׃
    hebrewPlain: ויאמר ברוכה את ליהוה בתי היטבת חסדך האחרון מן הראשון לבלתי לכת אחרי הבחורים אם דל ואם עשיר
    kjvRefs:
    - Ruth 3:10
    kjvOsis:
    - Ruth.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.11
    scripture: tanakh
    name: Tanakh Ruth 3:11
    ref: Ruth 3:11
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 19827
    text: And now, my daughter, fear not; I will do to thee all that thou sayest; for all the men in the gate of my people do know that thou art a virtuous woman.
    translation: JPS 1917
    original: וְעַתָּה בִּתִּי אַל־תִּירְאִי כֹּל אֲשֶׁר־תֹּאמְרִי אֶעֱשֶׂה־לָּךְ כִּי יוֹדֵעַ כָּל־שַׁעַר עַמִּי כִּי אֵשֶׁת חַיִל אָתְּ׃
    hebrewPlain: ועתה בתי אל תיראי כל אשר תאמרי אעשה לך כי יודע כל שער עמי כי אשת חיל את
    kjvRefs:
    - Ruth 3:11
    kjvOsis:
    - Ruth.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.12
    scripture: tanakh
    name: Tanakh Ruth 3:12
    ref: Ruth 3:12
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 19828
    text: And now it is true that I am a near kinsman; howbeit there is a kinsman nearer than I.
    translation: JPS 1917
    original: וְעַתָּה כִּי אָמְנָם כִּי אם גֹאֵל אָנֹכִי וְגַם יֵשׁ גֹּאֵל קָרוֹב מִמֶּנִּי׃
    hebrewPlain: ועתה כי אמנם כי אם גאל אנכי וגם יש גאל קרוב ממני
    kjvRefs:
    - Ruth 3:12
    kjvOsis:
    - Ruth.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.13
    scripture: tanakh
    name: Tanakh Ruth 3:13
    ref: Ruth 3:13
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 19829
    text: Tarry this night, and it shall be in the morning, that if he will perform unto thee the part of a kinsman, well; let him do the kinsman’s part; but if he be not willing to do the part of a kinsman to thee, then will I do the part of a kinsman to thee, as the LORD liveth; lie down until the morning.’
    translation: JPS 1917
    original: לִינִי הַלַּיְלָה וְהָיָה בַבֹּקֶר אִם־יִגְאָלֵךְ טוֹב יִגְאָל וְאִם־לֹא יַחְפֹּץ לְגָאֳלֵךְ וּגְאַלְתִּיךְ אָנֹכִי חַי־יְהוָה שִׁכְבִי עַד־הַבֹּקֶר׃
    hebrewPlain: ליני הלילה והיה בבקר אם יגאלך טוב יגאל ואם לא יחפץ לגאלך וגאלתיך אנכי חי יהוה שכבי עד הבקר
    kjvRefs:
    - Ruth 3:13
    kjvOsis:
    - Ruth.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.14
    scripture: tanakh
    name: Tanakh Ruth 3:14
    ref: Ruth 3:14
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 19830
    text: 'And she lay at his feet until the morning; and she rose up before one could discern another. For he said: ‘Let it not be known that the woman came to the threshing-floor.’'
    translation: JPS 1917
    original: וַתִּשְׁכַּב מרגלתו [מַרְגְּלוֹתָיוֹ] עַד־הַבֹּקֶר וַתָּקָם בטרום [בְּטֶרֶם] יַכִּיר אִישׁ אֶת־רֵעֵהוּ וַיֹּאמֶר אַל־יִוָּדַע כִּי־בָאָה הָאִשָּׁה הַגֹּרֶן׃
    hebrewPlain: ותשכב מרגלתו [מרגלותיו] עד הבקר ותקם בטרום [בטרם] יכיר איש את רעהו ויאמר אל יודע כי באה האשה הגרן
    kjvRefs:
    - Ruth 3:14
    kjvOsis:
    - Ruth.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.15
    scripture: tanakh
    name: Tanakh Ruth 3:15
    ref: Ruth 3:15
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 19831
    text: 'And he said: ‘Bring the mantle that is upon thee, and hold it’; and she held it; and he measured six measures of barley, and laid it on her; and he went into the city.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָבִי הַמִּטְפַּחַת אֲשֶׁר־עָלַיִךְ וְאֶחֳזִי־בָהּ וַתֹּאחֶז בָּהּ וַיָּמָד שֵׁשׁ־שְׂעֹרִים וַיָּשֶׁת עָלֶיהָ וַיָּבֹא הָעִיר׃
    hebrewPlain: ויאמר הבי המטפחת אשר עליך ואחזי בה ותאחז בה וימד שש שערים וישת עליה ויבא העיר
    kjvRefs:
    - Ruth 3:15
    kjvOsis:
    - Ruth.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.16
    scripture: tanakh
    name: Tanakh Ruth 3:16
    ref: Ruth 3:16
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 19832
    text: 'And when she came to her mother-in-law, she said: ‘Who art thou, my daughter?’ And she told her all that the man had done to her.'
    translation: JPS 1917
    original: וַתָּבוֹא אֶל־חֲמוֹתָהּ וַתֹּאמֶר מִי־אַתְּ בִּתִּי וַתַּגֶּד־לָהּ אֵת כָּל־אֲשֶׁר עָשָׂה־לָהּ הָאִישׁ׃
    hebrewPlain: ותבוא אל חמותה ותאמר מי את בתי ותגד לה את כל אשר עשה לה האיש
    kjvRefs:
    - Ruth 3:16
    kjvOsis:
    - Ruth.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.17
    scripture: tanakh
    name: Tanakh Ruth 3:17
    ref: Ruth 3:17
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 19833
    text: 'And she said: ‘These six measures of barley gave he me; for he said to me: Go not empty unto thy mother-in-law.’'
    translation: JPS 1917
    original: וַתֹּאמֶר שֵׁשׁ־הַשְּׂעֹרִים הָאֵלֶּה נָתַן לִי כִּי אָמַר [אֵלַי] אַל־תָּבוֹאִי רֵיקָם אֶל־חֲמוֹתֵךְ׃
    hebrewPlain: ותאמר שש השערים האלה נתן לי כי אמר [אלי] אל תבואי ריקם אל חמותך
    kjvRefs:
    - Ruth 3:17
    kjvOsis:
    - Ruth.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.3.18
    scripture: tanakh
    name: Tanakh Ruth 3:18
    ref: Ruth 3:18
    book: Ruth
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 19834
    text: 'Then said she: ‘Sit still, my daughter, until thou know how the matter will fall; for the man will not rest, until he have finished the thing this day.’'
    translation: JPS 1917
    original: וַתֹּאמֶר שְׁבִי בִתִּי עַד אֲשֶׁר תֵּדְעִין אֵיךְ יִפֹּל דָּבָר כִּי לֹא יִשְׁקֹט הָאִישׁ כִּי־אִם־כִּלָּה הַדָּבָר הַיּוֹם׃
    hebrewPlain: ותאמר שבי בתי עד אשר תדעין איך יפל דבר כי לא ישקט האיש כי אם כלה הדבר היום
    kjvRefs:
    - Ruth 3:18
    kjvOsis:
    - Ruth.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.3
- type: TanakhVerse
  data:
    osis: Ruth.4.1
    scripture: tanakh
    name: Tanakh Ruth 4:1
    ref: Ruth 4:1
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 19835
    text: 'Now Boaz went up to the gate, and sat him down there; and, behold, the near kinsman of whom Boaz spoke came by; unto whom he said: ‘Ho, such a one! turn aside, sit down here.’ And he turned aside, and sat down.'
    translation: JPS 1917
    original: וּבֹעַז עָלָה הַשַּׁעַר וַיֵּשֶׁב שָׁם וְהִנֵּה הַגֹּאֵל עֹבֵר אֲשֶׁר דִּבֶּר־בֹּעַז וַיֹּאמֶר סוּרָה שְׁבָה־פֹּה פְּלֹנִי אַלְמֹנִי וַיָּסַר וַיֵּשֵׁב׃
    hebrewPlain: ובעז עלה השער וישב שם והנה הגאל עבר אשר דבר בעז ויאמר סורה שבה פה פלני אלמני ויסר וישב
    kjvRefs:
    - Ruth 4:1
    kjvOsis:
    - Ruth.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.2
    scripture: tanakh
    name: Tanakh Ruth 4:2
    ref: Ruth 4:2
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 19836
    text: 'And he took ten men of the elders of the city, and said: ‘Sit ye down here.’ And they sat down.'
    translation: JPS 1917
    original: וַיִּקַּח עֲשָׂרָה אֲנָשִׁים מִזִּקְנֵי הָעִיר וַיֹּאמֶר שְׁבוּ־פֹה וַיֵּשֵׁבוּ׃
    hebrewPlain: ויקח עשרה אנשים מזקני העיר ויאמר שבו פה וישבו
    kjvRefs:
    - Ruth 4:2
    kjvOsis:
    - Ruth.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.3
    scripture: tanakh
    name: Tanakh Ruth 4:3
    ref: Ruth 4:3
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 19837
    text: 'And he said unto the near kinsman: ‘Naomi, that is come back out of the field of Moab, selleth the parcel of land, which was our brother Elimelech’s;'
    translation: JPS 1917
    original: וַיֹּאמֶר לַגֹּאֵל חֶלְקַת הַשָּׂדֶה אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ מָכְרָה נָעֳמִי הַשָּׁבָה מִשְּׂדֵה מוֹאָב׃
    hebrewPlain: ויאמר לגאל חלקת השדה אשר לאחינו לאלימלך מכרה נעמי השבה משדה מואב
    kjvRefs:
    - Ruth 4:3
    kjvOsis:
    - Ruth.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.4
    scripture: tanakh
    name: Tanakh Ruth 4:4
    ref: Ruth 4:4
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 19838
    text: 'and I thought to disclose it unto thee, saying: Buy it before them that sit here, and before the elders of my people. If thou wilt redeem it, redeem it; but if it will not be redeemed, then tell me, that I may know; for there is none to redeem it beside thee; and I am after thee.’ And he said: ‘I will redeem it.’'
    translation: JPS 1917
    original: וַאֲנִי אָמַרְתִּי אֶגְלֶה אָזְנְךָ לֵאמֹר קְנֵה נֶגֶד הַיֹּשְׁבִים וְנֶגֶד זִקְנֵי עַמִּי אִם־תִּגְאַל גְּאָל וְאִם־לֹא יִגְאַל הַגִּידָה לִּי ואדע [וְאֵדְעָה] כִּי אֵין זוּלָתְךָ לִגְאוֹל וְאָנֹכִי אַחֲרֶיךָ וַיֹּאמֶר אָנֹכִי אֶגְאָל׃
    hebrewPlain: ואני אמרתי אגלה אזנך לאמר קנה נגד הישבים ונגד זקני עמי אם תגאל גאל ואם לא יגאל הגידה לי ואדע [ואדעה] כי אין זולתך לגאול ואנכי אחריך ויאמר אנכי אגאל
    kjvRefs:
    - Ruth 4:4
    kjvOsis:
    - Ruth.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.5
    scripture: tanakh
    name: Tanakh Ruth 4:5
    ref: Ruth 4:5
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 19839
    text: 'Then said Boaz: ‘What day thou buyest the field of the hand of Naomi—hast thou also bought of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance?’'
    translation: JPS 1917
    original: וַיֹּאמֶר בֹּעַז בְּיוֹם־קְנוֹתְךָ הַשָּׂדֶה מִיַּד נָעֳמִי וּמֵאֵת רוּת הַמּוֹאֲבִיָּה אֵשֶׁת־הַמֵּת קניתי [קָנִיתָה] לְהָקִים שֵׁם־הַמֵּת עַל־נַחֲלָתוֹ׃
    hebrewPlain: ויאמר בעז ביום קנותך השדה מיד נעמי ומאת רות המואביה אשת המת קניתי [קניתה] להקים שם המת על נחלתו
    kjvRefs:
    - Ruth 4:5
    kjvOsis:
    - Ruth.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.6
    scripture: tanakh
    name: Tanakh Ruth 4:6
    ref: Ruth 4:6
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 19840
    text: 'And the near kinsman said: ‘I cannot redeem it for myself, lest I mar mine own inheritance; take thou my right of redemption on thee; for I cannot redeem it.’—'
    translation: JPS 1917
    original: וַיֹּאמֶר הַגֹּאֵל לֹא אוּכַל לגאול־[לִגְאָל־] לִי פֶּן־אַשְׁחִית אֶת־נַחֲלָתִי גְּאַל־לְךָ אַתָּה אֶת־גְּאֻלָּתִי כִּי לֹא־אוּכַל לִגְאֹל׃
    hebrewPlain: ויאמר הגאל לא אוכל לגאול [לגאל ] לי פן אשחית את נחלתי גאל לך אתה את גאלתי כי לא אוכל לגאל
    kjvRefs:
    - Ruth 4:6
    kjvOsis:
    - Ruth.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.7
    scripture: tanakh
    name: Tanakh Ruth 4:7
    ref: Ruth 4:7
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 19841
    text: 'Now this was the custom in former time in Israel concerning redeeming and concerning exchanging, to confirm all things: a man drew off his shoe, and gave it to his neighbour; and this was the attestation in Israel.—'
    translation: JPS 1917
    original: וְזֹאת לְפָנִים בְּיִשְׂרָאֵל עַל־הַגְּאוּלָּה וְעַל־הַתְּמוּרָה לְקַיֵּם כָּל־דָּבָר שָׁלַף אִישׁ נַעֲלוֹ וְנָתַן לְרֵעֵהוּ וְזֹאת הַתְּעוּדָה בְּיִשְׂרָאֵל׃
    hebrewPlain: וזאת לפנים בישראל על הגאולה ועל התמורה לקים כל דבר שלף איש נעלו ונתן לרעהו וזאת התעודה בישראל
    kjvRefs:
    - Ruth 4:7
    kjvOsis:
    - Ruth.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.8
    scripture: tanakh
    name: Tanakh Ruth 4:8
    ref: Ruth 4:8
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 19842
    text: 'So the near kinsman said unto Boaz: ‘Buy it for thyself.’ And he drew off his shoe.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַגֹּאֵל לְבֹעַז קְנֵה־לָךְ וַיִּשְׁלֹף נַעֲלוֹ׃
    hebrewPlain: ויאמר הגאל לבעז קנה לך וישלף נעלו
    kjvRefs:
    - Ruth 4:8
    kjvOsis:
    - Ruth.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.9
    scripture: tanakh
    name: Tanakh Ruth 4:9
    ref: Ruth 4:9
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 19843
    text: 'And Boaz said unto the elders, and unto all the people: ‘Ye are witnesses this day, that I have bought all that was Elimelech’s, and all that was Chilion’s and Mahlon’s, of the hand of Naomi.'
    translation: JPS 1917
    original: וַיֹּאמֶר בֹּעַז לַזְּקֵנִים וְכָל־הָעָם עֵדִים אַתֶּם הַיּוֹם כִּי קָנִיתִי אֶת־כָּל־אֲשֶׁר לֶאֱלִימֶלֶךְ וְאֵת כָּל־אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן מִיַּד נָעֳמִי׃
    hebrewPlain: ויאמר בעז לזקנים וכל העם עדים אתם היום כי קניתי את כל אשר לאלימלך ואת כל אשר לכליון ומחלון מיד נעמי
    kjvRefs:
    - Ruth 4:9
    kjvOsis:
    - Ruth.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.10
    scripture: tanakh
    name: Tanakh Ruth 4:10
    ref: Ruth 4:10
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 19844
    text: Moreover Ruth the Moabitess, the wife of Mahlon, have I acquired to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place; ye are witnesses this day.’
    translation: JPS 1917
    original: וְגַם אֶת־רוּת הַמֹּאֲבִיָּה אֵשֶׁת מַחְלוֹן קָנִיתִי לִי לְאִשָּׁה לְהָקִים שֵׁם־הַמֵּת עַל־נַחֲלָתוֹ וְלֹא־יִכָּרֵת שֵׁם־הַמֵּת מֵעִם אֶחָיו וּמִשַּׁעַר מְקוֹמוֹ עֵדִים אַתֶּם הַיּוֹם׃
    hebrewPlain: וגם את רות המאביה אשת מחלון קניתי לי לאשה להקים שם המת על נחלתו ולא יכרת שם המת מעם אחיו ומשער מקומו עדים אתם היום
    kjvRefs:
    - Ruth 4:10
    kjvOsis:
    - Ruth.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.11
    scripture: tanakh
    name: Tanakh Ruth 4:11
    ref: Ruth 4:11
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 19845
    text: 'And all the people that were in the gate, and the elders, said: ‘We are witnesses. The LORD make the woman that is come into thy house like Rachel and like Leah, which two did build the house of Israel; and do thou worthily in Ephrath, and be famous in Beth-lehem;'
    translation: JPS 1917
    original: וַיֹּאמְרוּ כָּל־הָעָם אֲשֶׁר־בַּשַּׁעַר וְהַזְּקֵנִים עֵדִים יִתֵּן יְהוָה אֶת־הָאִשָּׁה הַבָּאָה אֶל־בֵּיתֶךָ כְּרָחֵל וּכְלֵאָה אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת־בֵּית יִשְׂרָאֵל וַעֲשֵׂה־חַיִל בְּאֶפְרָתָה וּקְרָא־שֵׁם בְּבֵית לָחֶם׃
    hebrewPlain: ויאמרו כל העם אשר בשער והזקנים עדים יתן יהוה את האשה הבאה אל ביתך כרחל וכלאה אשר בנו שתיהם את בית ישראל ועשה חיל באפרתה וקרא שם בבית לחם
    kjvRefs:
    - Ruth 4:11
    kjvOsis:
    - Ruth.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.12
    scripture: tanakh
    name: Tanakh Ruth 4:12
    ref: Ruth 4:12
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 19846
    text: and let thy house be like the house of Perez, whom Tamar bore unto Judah, of the seed which the LORD shall give thee of this young woman.’
    translation: JPS 1917
    original: וִיהִי בֵיתְךָ כְּבֵית פֶּרֶץ אֲשֶׁר־יָלְדָה תָמָר לִיהוּדָה מִן־הַזֶּרַע אֲשֶׁר יִתֵּן יְהוָה לְךָ מִן־הַנַּעֲרָה הַזֹּאת׃
    hebrewPlain: ויהי ביתך כבית פרץ אשר ילדה תמר ליהודה מן הזרע אשר יתן יהוה לך מן הנערה הזאת
    kjvRefs:
    - Ruth 4:12
    kjvOsis:
    - Ruth.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.13
    scripture: tanakh
    name: Tanakh Ruth 4:13
    ref: Ruth 4:13
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 19847
    text: So Boaz took Ruth, and she became his wife; and he went in unto her, and the LORD gave her conception, and she bore a son.
    translation: JPS 1917
    original: וַיִּקַּח בֹּעַז אֶת־רוּת וַתְּהִי־לוֹ לְאִשָּׁה וַיָּבֹא אֵלֶיהָ וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן וַתֵּלֶד בֵּן׃
    hebrewPlain: ויקח בעז את רות ותהי לו לאשה ויבא אליה ויתן יהוה לה הריון ותלד בן
    kjvRefs:
    - Ruth 4:13
    kjvOsis:
    - Ruth.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.14
    scripture: tanakh
    name: Tanakh Ruth 4:14
    ref: Ruth 4:14
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 19848
    text: 'And the women said unto Naomi: ‘Blessed be the LORD, who hath not left thee this day without a near kinsman, and let his name be famous in Israel.'
    translation: JPS 1917
    original: וַתֹּאמַרְנָה הַנָּשִׁים אֶל־נָעֳמִי בָּרוּךְ יְהוָה אֲשֶׁר לֹא הִשְׁבִּית לָךְ גֹּאֵל הַיּוֹם וְיִקָּרֵא שְׁמוֹ בְּיִשְׂרָאֵל׃
    hebrewPlain: ותאמרנה הנשים אל נעמי ברוך יהוה אשר לא השבית לך גאל היום ויקרא שמו בישראל
    kjvRefs:
    - Ruth 4:14
    kjvOsis:
    - Ruth.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.15
    scripture: tanakh
    name: Tanakh Ruth 4:15
    ref: Ruth 4:15
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 19849
    text: And he shall be unto thee a restorer of life, and a nourisher of thine old age; for thy daughter-in-law, who loveth thee, who is better to thee than seven sons, hath borne him.’
    translation: JPS 1917
    original: וְהָיָה לָךְ לְמֵשִׁיב נֶפֶשׁ וּלְכַלְכֵּל אֶת־שֵׂיבָתֵךְ כִּי כַלָּתֵךְ אֲ‍שֶׁר־אֲהֵבַתֶךְ יְלָדַתּוּ אֲשֶׁר־הִיא טוֹבָה לָךְ מִשִּׁבְעָה בָּנִים׃
    hebrewPlain: והיה לך למשיב נפש ולכלכל את שיבתך כי כלתך א‍שר אהבתך ילדתו אשר היא טובה לך משבעה בנים
    kjvRefs:
    - Ruth 4:15
    kjvOsis:
    - Ruth.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.16
    scripture: tanakh
    name: Tanakh Ruth 4:16
    ref: Ruth 4:16
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 19850
    text: And Naomi took the child, and laid it in her bosom, and became nurse unto it.
    translation: JPS 1917
    original: וַתִּקַּח נָעֳמִי אֶת־הַיֶּלֶד וַתְּשִׁתֵהוּ בְחֵיקָהּ וַתְּהִי־לוֹ לְאֹמֶנֶת׃
    hebrewPlain: ותקח נעמי את הילד ותשתהו בחיקה ותהי לו לאמנת
    kjvRefs:
    - Ruth 4:16
    kjvOsis:
    - Ruth.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.17
    scripture: tanakh
    name: Tanakh Ruth 4:17
    ref: Ruth 4:17
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 19851
    text: 'And the women her neighbours gave it a name, saying: ‘There is a son born to Naomi’; and they called his name Obed; he is the father of Jesse, the father of David.'
    translation: JPS 1917
    original: וַתִּקְרֶאנָה לוֹ הַשְּׁכֵנוֹת שֵׁם לֵאמֹר יֻלַּד־בֵּן לְנָעֳמִי וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד הוּא אֲבִי־יִשַׁי אֲבִי דָוִד׃
    hebrewPlain: ותקראנה לו השכנות שם לאמר ילד בן לנעמי ותקראנה שמו עובד הוא אבי ישי אבי דוד
    kjvRefs:
    - Ruth 4:17
    kjvOsis:
    - Ruth.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.18
    scripture: tanakh
    name: Tanakh Ruth 4:18
    ref: Ruth 4:18
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 18
    ordinal: 19852
    text: 'Now these are the generations of Perez: Perez begot Hezron;'
    translation: JPS 1917
    original: וְאֵלֶּה תּוֹלְדוֹת פָּרֶץ פֶּרֶץ הוֹלִיד אֶת־חֶצְרוֹן׃
    hebrewPlain: ואלה תולדות פרץ פרץ הוליד את חצרון
    kjvRefs:
    - Ruth 4:18
    kjvOsis:
    - Ruth.4.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.19
    scripture: tanakh
    name: Tanakh Ruth 4:19
    ref: Ruth 4:19
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 19853
    text: and Hezron begot Ram, and Ram begot Amminadab;
    translation: JPS 1917
    original: וְחֶצְרוֹן הוֹלִיד אֶת־רָם וְרָם הוֹלִיד אֶת־עַמִּינָדָב׃
    hebrewPlain: וחצרון הוליד את רם ורם הוליד את עמינדב
    kjvRefs:
    - Ruth 4:19
    kjvOsis:
    - Ruth.4.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.20
    scripture: tanakh
    name: Tanakh Ruth 4:20
    ref: Ruth 4:20
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 19854
    text: and Amminadab begot Nahshon, and Nahshon begot Salmon;
    translation: JPS 1917
    original: וְעַמִּינָדָב הוֹלִיד אֶת־נַחְשׁוֹן וְנַחְשׁוֹן הוֹלִיד אֶת־שַׂלְמָה׃
    hebrewPlain: ועמינדב הוליד את נחשון ונחשון הוליד את שלמה
    kjvRefs:
    - Ruth 4:20
    kjvOsis:
    - Ruth.4.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Ruth.4
- type: TanakhVerse
  data:
    osis: Ruth.4.21
    scripture: tanakh
    name: Tanakh Ruth 4:21
    ref: Ruth 4:21
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 19855
    text: and Salmon begot Boaz, and Boaz begot Obed;
    translation: JPS 1917
    original: וְשַׂלְמוֹן הוֹלִיד אֶת־בֹּעַז וּבֹעַז הוֹלִיד אֶת־עוֹבֵד׃
    hebrewPlain: ושלמון הוליד את בעז ובעז הוליד את עובד
    kjvRefs:
    - Ruth 4:21
    kjvOsis:
    - Ruth.4.21
