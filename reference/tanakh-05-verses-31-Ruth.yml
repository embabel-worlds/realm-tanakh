  data:
    osis: Ruth.4.22
    scripture: tanakh
    name: Tanakh Ruth 4:22
    ref: Ruth 4:22
    book: Ruth
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 19856
    text: and Obed begot Jesse, and Jesse begot David.
    translation: JPS 1917
    original: וְעֹבֵד הוֹלִיד אֶת־יִשָׁי וְיִשַׁי הוֹלִיד אֶת־דָּוִד׃
    hebrewPlain: ועבד הוליד את ישי וישי הוליד את דוד
    kjvRefs:
    - Ruth 4:22
