- type: TanakhVerse
  data:
    osis: Mal.1.2
    scripture: tanakh
    name: Tanakh Malachi 1:2
    ref: Malachi 1:2
    book: Mal
    section: neviim
    chapter: 1
    verse: 2
    ordinal: 15089
    text: 'I have loved you, saith the LORD. Yet ye say: ‘Wherein hast Thou loved us?’ Was not Esau Jacob’s brother? Saith the LORD; Yet I loved Jacob;'
    translation: JPS 1917
    original: אָהַבְתִּי אֶתְכֶם אָמַר יְהוָה וַאֲמַרְתֶּם בַּמָּה אֲהַבְתָּנוּ הֲלוֹא־אָח עֵשָׂו לְיַעֲקֹב נְאֻם־יְהוָה וָאֹהַב אֶת־יַעֲקֹב׃
    hebrewPlain: אהבתי אתכם אמר יהוה ואמרתם במה אהבתנו הלוא אח עשו ליעקב נאם יהוה ואהב את יעקב
    kjvRefs:
    - Malachi 1:2
    kjvOsis:
    - Mal.1.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.3
    scripture: tanakh
    name: Tanakh Malachi 1:3
    ref: Malachi 1:3
    book: Mal
    section: neviim
    chapter: 1
    verse: 3
    ordinal: 15090
    text: But Esau I hated, And made his mountains a desolation, And gave his heritage to the jackals of the wilderness.
    translation: JPS 1917
    original: וְאֶת־עֵשָׂו שָׂנֵאתִי וָאָשִׂים אֶת־הָרָיו שְׁמָמָה וְאֶת־נַחֲלָתוֹ לְתַנּוֹת מִדְבָּר׃
    hebrewPlain: ואת עשו שנאתי ואשים את הריו שממה ואת נחלתו לתנות מדבר
    kjvRefs:
    - Malachi 1:3
    kjvOsis:
    - Mal.1.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.4
    scripture: tanakh
    name: Tanakh Malachi 1:4
    ref: Malachi 1:4
    book: Mal
    section: neviim
    chapter: 1
    verse: 4
    ordinal: 15091
    text: 'Whereas Edom saith: ‘We are beaten down, But we will return and build the waste places’; Thus saith the LORD of hosts: They shall build, but I will throw down; And they shall be called The border of wickedness, And The people whom the LORD execrateth for ever.'
    translation: JPS 1917
    original: כִּי־תֹאמַר אֱדוֹם רֻשַּׁשְׁנוּ וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת כֹּה אָמַר יְהוָה צְבָאוֹת הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרוֹס וְקָרְאוּ לָהֶם גְּבוּל רִשְׁעָה וְהָעָם אֲשֶׁר־זָעַם יְהוָה עַד־עוֹלָם׃
    hebrewPlain: כי תאמר אדום רששנו ונשוב ונבנה חרבות כה אמר יהוה צבאות המה יבנו ואני אהרוס וקראו להם גבול רשעה והעם אשר זעם יהוה עד עולם
    kjvRefs:
    - Malachi 1:4
    kjvOsis:
    - Mal.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.5
    scripture: tanakh
    name: Tanakh Malachi 1:5
    ref: Malachi 1:5
    book: Mal
    section: neviim
    chapter: 1
    verse: 5
    ordinal: 15092
    text: 'And your eyes shall see, And ye shall say: ‘The LORD is great beyond the border of Israel.’'
    translation: JPS 1917
    original: וְעֵינֵיכֶם תִּרְאֶינָה וְאַתֶּם תֹּאמְרוּ יִגְדַּל יְהוָה מֵעַל לִגְבוּל יִשְׂרָאֵל׃
    hebrewPlain: ועיניכם תראינה ואתם תאמרו יגדל יהוה מעל לגבול ישראל
    kjvRefs:
    - Malachi 1:5
    kjvOsis:
    - Mal.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.6
    scripture: tanakh
    name: Tanakh Malachi 1:6
    ref: Malachi 1:6
    book: Mal
    section: neviim
    chapter: 1
    verse: 6
    ordinal: 15093
    text: 'A son honoureth his father, And a servant his master; If then I be a father, Where is My honour? And if I be a master, Where is My fear? Saith the LORD of hosts Unto you, O priests, that despise My name. And ye say: ‘Wherein have we despised Thy name?’'
    translation: JPS 1917
    original: בֵּן יְכַבֵּד אָב וְעֶבֶד אֲדֹנָיו וְאִם־אָב אָנִי אַיֵּה כְבוֹדִי וְאִם־אֲדוֹנִים אָנִי אַיֵּה מוֹרָאִי אָמַר יְהוָה צְבָאוֹת לָכֶם הַכֹּהֲנִים בּוֹזֵי שְׁמִי וַאֲמַרְתֶּם בַּמֶּה בָזִינוּ אֶת־שְׁמֶךָ׃
    hebrewPlain: בן יכבד אב ועבד אדניו ואם אב אני איה כבודי ואם אדונים אני איה מוראי אמר יהוה צבאות לכם הכהנים בוזי שמי ואמרתם במה בזינו את שמך
    kjvRefs:
    - Malachi 1:6
    kjvOsis:
    - Mal.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.7
    scripture: tanakh
    name: Tanakh Malachi 1:7
    ref: Malachi 1:7
    book: Mal
    section: neviim
    chapter: 1
    verse: 7
    ordinal: 15094
    text: 'Ye offer polluted bread upon Mine altar. And ye say: ‘Wherein have we polluted thee?’ In that ye say: ‘The table of the LORD is contemptible.’'
    translation: JPS 1917
    original: מַגִּישִׁים עַל־מִזְבְּחִי לֶחֶם מְגֹאָל וַאֲמַרְתֶּם בַּמֶּה גֵאַלְנוּךָ בֶּאֱמָרְכֶם שֻׁלְחַן יְהוָה נִבְזֶה הוּא׃
    hebrewPlain: מגישים על מזבחי לחם מגאל ואמרתם במה גאלנוך באמרכם שלחן יהוה נבזה הוא
    kjvRefs:
    - Malachi 1:7
    kjvOsis:
    - Mal.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.8
    scripture: tanakh
    name: Tanakh Malachi 1:8
    ref: Malachi 1:8
    book: Mal
    section: neviim
    chapter: 1
    verse: 8
    ordinal: 15095
    text: And when ye offer the blind for sacrifice, is it no evil! And when ye offer the lame and sick, is it no evil! Present it now unto thy governor; will he be pleased with thee? Or will he accept thy person? Saith the LORD of hosts.
    translation: JPS 1917
    original: וְכִי־תַגִּשׁוּן עִוֵּר לִזְבֹּחַ אֵין רָע וְכִי תַגִּישׁוּ פִּסֵּחַ וְחֹלֶה אֵין רָע הַקְרִיבֵהוּ נָא לְפֶחָתֶךָ הֲיִּרְצְךָ אוֹ הֲיִשָּׂא פָנֶיךָ אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: וכי תגשון עור לזבח אין רע וכי תגישו פסח וחלה אין רע הקריבהו נא לפחתך הירצך או הישא פניך אמר יהוה צבאות
    kjvRefs:
    - Malachi 1:8
    kjvOsis:
    - Mal.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.9
    scripture: tanakh
    name: Tanakh Malachi 1:9
    ref: Malachi 1:9
    book: Mal
    section: neviim
    chapter: 1
    verse: 9
    ordinal: 15096
    text: And now, I pray you, entreat the favour of God That He may be gracious unto us!— This hath been of your doing.— Will He accept any of your persons? Saith the LORD of hosts.
    translation: JPS 1917
    original: וְעַתָּה חַלּוּ־נָא פְנֵי־אֵל וִיחָנֵנוּ מִיֶּדְכֶם הָיְתָה זֹּאת הֲיִשָּׂא מִכֶּם פָּנִים אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: ועתה חלו נא פני אל ויחננו מידכם היתה זאת הישא מכם פנים אמר יהוה צבאות
    kjvRefs:
    - Malachi 1:9
    kjvOsis:
    - Mal.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.10
    scripture: tanakh
    name: Tanakh Malachi 1:10
    ref: Malachi 1:10
    book: Mal
    section: neviim
    chapter: 1
    verse: 10
    ordinal: 15097
    text: Oh that there were even one among you that would shut the doors, That ye might not kindle fire on Mine altar in vain! I have no pleasure in you, Saith the LORD of hosts, Neither will I accept an offering at your hand.
    translation: JPS 1917
    original: מִי גַם־בָּכֶם וְיִסְגֹּר דְּלָתַיִם וְלֹא־תָאִירוּ מִזְבְּחִי חִנָּם אֵין־לִי חֵפֶץ בָּכֶם אָמַר יְהוָה צְבָאוֹת וּמִנְחָה לֹא־אֶרְצֶה מִיֶּדְכֶם׃
    hebrewPlain: מי גם בכם ויסגר דלתים ולא תאירו מזבחי חנם אין לי חפץ בכם אמר יהוה צבאות ומנחה לא ארצה מידכם
    kjvRefs:
    - Malachi 1:10
    kjvOsis:
    - Mal.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.11
    scripture: tanakh
    name: Tanakh Malachi 1:11
    ref: Malachi 1:11
    book: Mal
    section: neviim
    chapter: 1
    verse: 11
    ordinal: 15098
    text: For from the rising of the sun even unto the going down of the same My name is great among the nations; And in every place offerings are presented unto My name, Even pure oblations; For My name is great among the nations, Saith the LORD of hosts.
    translation: JPS 1917
    original: כִּי מִמִּזְרַח־שֶׁמֶשׁ וְעַד־מְבוֹאוֹ גָּדוֹל שְׁמִי בַּגּוֹיִם וּבְכָל־מָקוֹם מֻקְטָר מֻגָּשׁ לִשְׁמִי וּמִנְחָה טְהוֹרָה כִּי־גָדוֹל שְׁמִי בַּגּוֹיִם אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: כי ממזרח שמש ועד מבואו גדול שמי בגוים ובכל מקום מקטר מגש לשמי ומנחה טהורה כי גדול שמי בגוים אמר יהוה צבאות
    kjvRefs:
    - Malachi 1:11
    kjvOsis:
    - Mal.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.12
    scripture: tanakh
    name: Tanakh Malachi 1:12
    ref: Malachi 1:12
    book: Mal
    section: neviim
    chapter: 1
    verse: 12
    ordinal: 15099
    text: 'But ye profane it, In that ye say: ‘The table of the LORD is polluted, And the fruit thereof, even the food thereof, is contemptible.’'
    translation: JPS 1917
    original: וְאַתֶּם מְחַלְּלִים אוֹתוֹ בֶּאֱמָרְכֶם שֻׁלְחַן אֲדֹנָי מְגֹאָל הוּא וְנִיבוֹ נִבְזֶה אָכְלוֹ׃
    hebrewPlain: ואתם מחללים אותו באמרכם שלחן אדני מגאל הוא וניבו נבזה אכלו
    kjvRefs:
    - Malachi 1:12
    kjvOsis:
    - Mal.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.13
    scripture: tanakh
    name: Tanakh Malachi 1:13
    ref: Malachi 1:13
    book: Mal
    section: neviim
    chapter: 1
    verse: 13
    ordinal: 15100
    text: 'Ye say also: ‘Behold, what a weariness is it!’ And ye have snuffed at it, Saith the LORD of hosts; And ye have brought that which was taken by violence, And the lame, and the sick; Thus ye bring the offering; Should I accept this of your hand? Saith the LORD.'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם הִנֵּה מַתְּלָאָה וְהִפַּחְתֶּם אוֹתוֹ אָמַר יְהוָה צְבָאוֹת וַהֲבֵאתֶם גָּזוּל וְאֶת־הַפִּסֵּחַ וְאֶת־הַחוֹלֶה וַהֲבֵאתֶם אֶת־הַמִּנְחָה הַאֶרְצֶה אוֹתָהּ מִיֶּדְכֶם אָמַר יְהוָה׃
    hebrewPlain: ואמרתם הנה מתלאה והפחתם אותו אמר יהוה צבאות והבאתם גזול ואת הפסח ואת החולה והבאתם את המנחה הארצה אותה מידכם אמר יהוה
    kjvRefs:
    - Malachi 1:13
    kjvOsis:
    - Mal.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.1.14
    scripture: tanakh
    name: Tanakh Malachi 1:14
    ref: Malachi 1:14
    book: Mal
    section: neviim
    chapter: 1
    verse: 14
    ordinal: 15101
    text: But cursed be he that dealeth craftily, Whereas he hath in his flock a male, And voweth, and sacrificeth unto the Lord a blemished thing; For I am a great King, Saith the LORD of hosts, And My name is feared among the nations.
    translation: JPS 1917
    original: וְאָרוּר נוֹכֵל וְיֵשׁ בְּעֶדְרוֹ זָכָר וְנֹדֵר וְזֹבֵחַ מָשְׁחָת לַאדֹנָי כִּי מֶלֶךְ גָּדוֹל אָנִי אָמַר יְהוָה צְבָאוֹת וּשְׁמִי נוֹרָא בַגּוֹיִם׃
    hebrewPlain: וארור נוכל ויש בעדרו זכר ונדר וזבח משחת לאדני כי מלך גדול אני אמר יהוה צבאות ושמי נורא בגוים
    kjvRefs:
    - Malachi 1:14
    kjvOsis:
    - Mal.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.1
- type: TanakhVerse
  data:
    osis: Mal.2.1
    scripture: tanakh
    name: Tanakh Malachi 2:1
    ref: Malachi 2:1
    book: Mal
    section: neviim
    chapter: 2
    verse: 1
    ordinal: 15102
    text: And now, this commandment Is for you, O ye priests.
    translation: JPS 1917
    original: וְעַתָּה אֲלֵיכֶם הַמִּצְוָה הַזֹּאת הַכֹּהֲנִים׃
    hebrewPlain: ועתה אליכם המצוה הזאת הכהנים
    kjvRefs:
    - Malachi 2:1
    kjvOsis:
    - Mal.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.2
    scripture: tanakh
    name: Tanakh Malachi 2:2
    ref: Malachi 2:2
    book: Mal
    section: neviim
    chapter: 2
    verse: 2
    ordinal: 15103
    text: If ye will not hearken, and if ye will not lay it to heart, To give glory unto My name, Saith the LORD of hosts, Then will I send the curse upon you, And I will curse your blessings; Yea, I curse them, Because ye do not lay it to heart.
    translation: JPS 1917
    original: אִם־לֹא תִשְׁמְעוּ וְאִם־לֹא תָשִׂימוּ עַל־לֵב לָתֵת כָּבוֹד לִשְׁמִי אָמַר יְהוָה צְבָאוֹת וְשִׁלַּחְתִּי בָכֶם אֶת־הַמְּאֵרָה וְאָרוֹתִי אֶת־בִּרְכוֹתֵיכֶם וְגַם אָרוֹתִיהָ כִּי אֵינְכֶם שָׂמִים עַל־לֵב׃
    hebrewPlain: אם לא תשמעו ואם לא תשימו על לב לתת כבוד לשמי אמר יהוה צבאות ושלחתי בכם את המארה וארותי את ברכותיכם וגם ארותיה כי אינכם שמים על לב
    kjvRefs:
    - Malachi 2:2
    kjvOsis:
    - Mal.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.3
    scripture: tanakh
    name: Tanakh Malachi 2:3
    ref: Malachi 2:3
    book: Mal
    section: neviim
    chapter: 2
    verse: 3
    ordinal: 15104
    text: Behold, I will rebuke the seed for your hurt, And will spread dung upon your faces, Even the dung of your sacrifices; And ye shall be taken away unto it.
    translation: JPS 1917
    original: הִנְנִי גֹעֵר לָכֶם אֶת־הַזֶּרַע וְזֵרִיתִי פֶרֶשׁ עַל־פְּנֵיכֶם פֶּרֶשׁ חַגֵּיכֶם וְנָשָׂא אֶתְכֶם אֵלָיו׃
    hebrewPlain: הנני גער לכם את הזרע וזריתי פרש על פניכם פרש חגיכם ונשא אתכם אליו
    kjvRefs:
    - Malachi 2:3
    kjvOsis:
    - Mal.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.4
    scripture: tanakh
    name: Tanakh Malachi 2:4
    ref: Malachi 2:4
    book: Mal
    section: neviim
    chapter: 2
    verse: 4
    ordinal: 15105
    text: Know then that I have sent This commandment unto you, That My covenant might be with Levi, Saith the LORD of hosts.
    translation: JPS 1917
    original: וִידַעְתֶּם כִּי שִׁלַּחְתִּי אֲלֵיכֶם אֵת הַמִּצְוָה הַזֹּאת לִהְיוֹת בְּרִיתִי אֶת־לֵוִי אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: וידעתם כי שלחתי אליכם את המצוה הזאת להיות בריתי את לוי אמר יהוה צבאות
    kjvRefs:
    - Malachi 2:4
    kjvOsis:
    - Mal.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.5
    scripture: tanakh
    name: Tanakh Malachi 2:5
    ref: Malachi 2:5
    book: Mal
    section: neviim
    chapter: 2
    verse: 5
    ordinal: 15106
    text: My covenant was with him Of life and peace, and I gave them to him, And of fear, and he feared Me, And was afraid of My name.
    translation: JPS 1917
    original: בְּרִיתִי הָיְתָה אִתּוֹ הַחַיִּים וְהַשָּׁלוֹם וָאֶתְּנֵם־לוֹ מוֹרָא וַיִּירָאֵנִי וּמִפְּנֵי שְׁמִי נִחַת הוּא׃
    hebrewPlain: בריתי היתה אתו החיים והשלום ואתנם לו מורא וייראני ומפני שמי נחת הוא
    kjvRefs:
    - Malachi 2:5
    kjvOsis:
    - Mal.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.6
    scripture: tanakh
    name: Tanakh Malachi 2:6
    ref: Malachi 2:6
    book: Mal
    section: neviim
    chapter: 2
    verse: 6
    ordinal: 15107
    text: The law of truth was in his mouth, And unrighteousness was not found in his lips; He walked with Me in peace and uprightness, And did turn many away from iniquity.
    translation: JPS 1917
    original: תּוֹרַת אֱמֶת הָיְתָה בְּפִיהוּ וְעַוְלָה לֹא־נִמְצָא בִשְׂפָתָיו בְּשָׁלוֹם וּבְמִישׁוֹר הָלַךְ אִתִּי וְרַבִּים הֵשִׁיב מֵעָוֺן׃
    hebrewPlain: תורת אמת היתה בפיהו ועולה לא נמצא בשפתיו בשלום ובמישור הלך אתי ורבים השיב מעון
    kjvRefs:
    - Malachi 2:6
    kjvOsis:
    - Mal.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.7
    scripture: tanakh
    name: Tanakh Malachi 2:7
    ref: Malachi 2:7
    book: Mal
    section: neviim
    chapter: 2
    verse: 7
    ordinal: 15108
    text: For the priest’s lips should keep knowledge, And they should seek the law at his mouth; For he is the messenger of the LORD of hosts.
    translation: JPS 1917
    original: כִּי־שִׂפְתֵי כֹהֵן יִשְׁמְרוּ־דַעַת וְתוֹרָה יְבַקְשׁוּ מִפִּיהוּ כִּי מַלְאַךְ יְהוָה־צְבָאוֹת הוּא׃
    hebrewPlain: כי שפתי כהן ישמרו דעת ותורה יבקשו מפיהו כי מלאך יהוה צבאות הוא
    kjvRefs:
    - Malachi 2:7
    kjvOsis:
    - Mal.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.8
    scripture: tanakh
    name: Tanakh Malachi 2:8
    ref: Malachi 2:8
    book: Mal
    section: neviim
    chapter: 2
    verse: 8
    ordinal: 15109
    text: But ye are turned aside out of the way; Ye have caused many to stumble in the law; Ye have corrupted the covenant of Levi, Saith the LORD of hosts.
    translation: JPS 1917
    original: וְאַתֶּם סַרְתֶּם מִן־הַדֶּרֶךְ הִכְשַׁלְתֶּם רַבִּים בַּתּוֹרָה שִׁחַתֶּם בְּרִית הַלֵּוִי אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: ואתם סרתם מן הדרך הכשלתם רבים בתורה שחתם ברית הלוי אמר יהוה צבאות
    kjvRefs:
    - Malachi 2:8
    kjvOsis:
    - Mal.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.9
    scripture: tanakh
    name: Tanakh Malachi 2:9
    ref: Malachi 2:9
    book: Mal
    section: neviim
    chapter: 2
    verse: 9
    ordinal: 15110
    text: Therefore have I also made you Contemptible and base before all the people, According as ye have not kept My ways, But have had respect of persons in the law.
    translation: JPS 1917
    original: וְגַם־אֲנִי נָתַתִּי אֶתְכֶם נִבְזִים וּשְׁפָלִים לְכָל־הָעָם כְּפִי אֲשֶׁר אֵינְכֶם שֹׁמְרִים אֶת־דְּרָכַי וְנֹשְׂאִים פָּנִים בַּתּוֹרָה׃
    hebrewPlain: וגם אני נתתי אתכם נבזים ושפלים לכל העם כפי אשר אינכם שמרים את דרכי ונשאים פנים בתורה
    kjvRefs:
    - Malachi 2:9
    kjvOsis:
    - Mal.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.10
    scripture: tanakh
    name: Tanakh Malachi 2:10
    ref: Malachi 2:10
    book: Mal
    section: neviim
    chapter: 2
    verse: 10
    ordinal: 15111
    text: Have we not all one father? Hath not one God created us? Why do we deal treacherously every man against his brother, Profaning the covenant of our fathers?
    translation: JPS 1917
    original: הֲלוֹא אָב אֶחָד לְכֻלָּנוּ הֲלוֹא אֵל אֶחָד בְּרָאָנוּ מַדּוּעַ נִבְגַּד אִישׁ בְּאָחִיו לְחַלֵּל בְּרִית אֲבֹתֵינוּ׃
    hebrewPlain: הלוא אב אחד לכלנו הלוא אל אחד בראנו מדוע נבגד איש באחיו לחלל ברית אבתינו
    kjvRefs:
    - Malachi 2:10
    kjvOsis:
    - Mal.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.11
    scripture: tanakh
    name: Tanakh Malachi 2:11
    ref: Malachi 2:11
    book: Mal
    section: neviim
    chapter: 2
    verse: 11
    ordinal: 15112
    text: Judah hath dealt treacherously, And an abomination is committed in Israel and in Jerusalem; For Judah hath profaned the holiness of the LORD which He loveth, And hath married the daughter of a strange god.
    translation: JPS 1917
    original: בָּגְדָה יְהוּדָה וְתוֹעֵבָה נֶעֶשְׂתָה בְיִשְׂרָאֵל וּבִירוּשָׁלִָם כִּי חִלֵּל יְהוּדָה קֹדֶשׁ יְהוָה אֲשֶׁר אָהֵב וּבָעַל בַּת־אֵל נֵכָר׃
    hebrewPlain: בגדה יהודה ותועבה נעשתה בישראל ובירושלם כי חלל יהודה קדש יהוה אשר אהב ובעל בת אל נכר
    kjvRefs:
    - Malachi 2:11
    kjvOsis:
    - Mal.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.12
    scripture: tanakh
    name: Tanakh Malachi 2:12
    ref: Malachi 2:12
    book: Mal
    section: neviim
    chapter: 2
    verse: 12
    ordinal: 15113
    text: May the LORD cut off to the man that doeth this, Him that calleth and him that answereth out of the tents of Jacob, And him that offereth an offering unto the LORD of hosts.
    translation: JPS 1917
    original: יַכְרֵת יְהוָה לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה עֵר וְעֹנֶה מֵאָהֳלֵי יַעֲקֹב וּמַגִּישׁ מִנְחָה לַיהוָה צְבָאוֹת׃
    hebrewPlain: יכרת יהוה לאיש אשר יעשנה ער וענה מאהלי יעקב ומגיש מנחה ליהוה צבאות
    kjvRefs:
    - Malachi 2:12
    kjvOsis:
    - Mal.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.13
    scripture: tanakh
    name: Tanakh Malachi 2:13
    ref: Malachi 2:13
    book: Mal
    section: neviim
    chapter: 2
    verse: 13
    ordinal: 15114
    text: 'And this further ye do: Ye cover the altar of the LORD with tears, With weeping, and with sighing, Insomuch that He regardeth not the offering any more, Neither receiveth it with good will at your hand.'
    translation: JPS 1917
    original: וְזֹאת שֵׁנִית תַּעֲשׂוּ כַּסּוֹת דִּמְעָה אֶת־מִזְבַּח יְהוָה בְּכִי וַאֲנָקָה מֵאֵין עוֹד פְּנוֹת אֶל־הַמִּנְחָה וְלָקַחַת רָצוֹן מִיֶּדְכֶם׃
    hebrewPlain: וזאת שנית תעשו כסות דמעה את מזבח יהוה בכי ואנקה מאין עוד פנות אל המנחה ולקחת רצון מידכם
    kjvRefs:
    - Malachi 2:13
    kjvOsis:
    - Mal.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.14
    scripture: tanakh
    name: Tanakh Malachi 2:14
    ref: Malachi 2:14
    book: Mal
    section: neviim
    chapter: 2
    verse: 14
    ordinal: 15115
    text: 'Yet ye say: ‘Wherefore?’ Because the LORD hath been witness Between thee and the wife of thy youth, Against whom thou hast dealt treacherously, Though she is thy companion, And the wife of thy covenant.'
    translation: JPS 1917
    original: וַאֲמַרְתֶּם עַל־מָה עַל כִּי־יְהוָה הֵעִיד בֵּינְךָ וּבֵין אֵשֶׁת נְעוּרֶיךָ אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ וְהִיא חֲבֶרְתְּךָ וְאֵשֶׁת בְּרִיתֶךָ׃
    hebrewPlain: ואמרתם על מה על כי יהוה העיד בינך ובין אשת נעוריך אשר אתה בגדתה בה והיא חברתך ואשת בריתך
    kjvRefs:
    - Malachi 2:14
    kjvOsis:
    - Mal.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.15
    scripture: tanakh
    name: Tanakh Malachi 2:15
    ref: Malachi 2:15
    book: Mal
    section: neviim
    chapter: 2
    verse: 15
    ordinal: 15116
    text: And not one hath done so Who had exuberance of spirit! For what seeketh the one? A seed given of God. Therefore take heed to your spirit, And let none deal treacherously against the wife of his youth.
    translation: JPS 1917
    original: וְלֹא־אֶחָד עָשָׂה וּשְׁאָר רוּחַ לוֹ וּמָה הָאֶחָד מְבַקֵּשׁ זֶרַע אֱלֹהִים וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם וּבְאֵשֶׁת נְעוּרֶיךָ אַל־יִבְגֹּד׃
    hebrewPlain: ולא אחד עשה ושאר רוח לו ומה האחד מבקש זרע אלהים ונשמרתם ברוחכם ובאשת נעוריך אל יבגד
    kjvRefs:
    - Malachi 2:15
    kjvOsis:
    - Mal.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.16
    scripture: tanakh
    name: Tanakh Malachi 2:16
    ref: Malachi 2:16
    book: Mal
    section: neviim
    chapter: 2
    verse: 16
    ordinal: 15117
    text: For I hate putting away, Saith the LORD, the God of Israel, And him that covereth his garment with violence, Saith the LORD of hosts; Therefore take heed to your spirit, That ye deal not treacherously.
    translation: JPS 1917
    original: כִּי־שָׂנֵא שַׁלַּח אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל וְכִסָּה חָמָס עַל־לְבוּשׁוֹ אָמַר יְהוָה צְבָאוֹת וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם וְלֹא תִבְגֹּדוּ׃
    hebrewPlain: כי שנא שלח אמר יהוה אלהי ישראל וכסה חמס על לבושו אמר יהוה צבאות ונשמרתם ברוחכם ולא תבגדו
    kjvRefs:
    - Malachi 2:16
    kjvOsis:
    - Mal.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.2.17
    scripture: tanakh
    name: Tanakh Malachi 2:17
    ref: Malachi 2:17
    book: Mal
    section: neviim
    chapter: 2
    verse: 17
    ordinal: 15118
    text: 'Ye have wearied the LORD with your words. Yet ye say: ‘Wherein have we wearied Him?’ In that ye say: ‘Every one that doeth evil Is good in the sight of the LORD, And He delighteth in them; Or where is the God of justice?’'
    translation: JPS 1917
    original: הוֹגַעְתֶּם יְהוָה בְּדִבְרֵיכֶם וַאֲמַרְתֶּם בַּמָּה הוֹגָעְנוּ בֶּאֱמָרְכֶם כָּל־עֹשֵׂה רָע טוֹב בְּעֵינֵי יְהוָה וּבָהֶם הוּא חָפֵץ אוֹ אַיֵּה אֱלֹהֵי הַמִּשְׁפָּט׃
    hebrewPlain: הוגעתם יהוה בדבריכם ואמרתם במה הוגענו באמרכם כל עשה רע טוב בעיני יהוה ובהם הוא חפץ או איה אלהי המשפט
    kjvRefs:
    - Malachi 2:17
    kjvOsis:
    - Mal.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.2
- type: TanakhVerse
  data:
    osis: Mal.3.1
    scripture: tanakh
    name: Tanakh Malachi 3:1
    ref: Malachi 3:1
    book: Mal
    section: neviim
    chapter: 3
    verse: 1
    ordinal: 15119
    text: Behold, I send My messenger, and he shall clear the way before Me; and the Lord, whom ye seek, will suddenly come to His temple, and the messenger of the covenant, Whom ye delight in, Behold, he cometh, Saith the LORD of hosts.
    translation: JPS 1917
    original: הִנְנִי שֹׁלֵחַ מַלְאָכִי וּפִנָּה־דֶרֶךְ לְפָנָי וּפִתְאֹם יָבוֹא אֶל־הֵיכָלוֹ הָאָדוֹן אֲשֶׁר־אַתֶּם מְבַקְשִׁים וּמַלְאַךְ הַבְּרִית אֲשֶׁר־אַתֶּם חֲפֵצִים הִנֵּה־בָא אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: הנני שלח מלאכי ופנה דרך לפני ופתאם יבוא אל היכלו האדון אשר אתם מבקשים ומלאך הברית אשר אתם חפצים הנה בא אמר יהוה צבאות
    kjvRefs:
    - Malachi 3:1
    kjvOsis:
    - Mal.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.2
    scripture: tanakh
    name: Tanakh Malachi 3:2
    ref: Malachi 3:2
    book: Mal
    section: neviim
    chapter: 3
    verse: 2
    ordinal: 15120
    text: But who may abide the day of his coming? And who shall stand when he appeareth? For he is like a refiner’s fire, and like fullers’ soap;
    translation: JPS 1917
    original: וּמִי מְכַלְכֵּל אֶת־יוֹם בּוֹאוֹ וּמִי הָעֹמֵד בְּהֵרָאוֹתוֹ כִּי־הוּא כְּאֵשׁ מְצָרֵף וּכְבֹרִית מְכַבְּסִים׃
    hebrewPlain: ומי מכלכל את יום בואו ומי העמד בהראותו כי הוא כאש מצרף וכברית מכבסים
    kjvRefs:
    - Malachi 3:2
    kjvOsis:
    - Mal.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.3
    scripture: tanakh
    name: Tanakh Malachi 3:3
    ref: Malachi 3:3
    book: Mal
    section: neviim
    chapter: 3
    verse: 3
    ordinal: 15121
    text: And he shall sit as a refiner and purifier of silver; and he shall purify the sons of Levi, and purge them as gold and silver; and there shall be they that shall offer unto the LORD offerings in righteousness.
    translation: JPS 1917
    original: וְיָשַׁב מְצָרֵף וּמְטַהֵר כֶּסֶף וְטִהַר אֶת־בְּנֵי־לֵוִי וְזִקַּק אֹתָם כַּזָּהָב וְכַכָּסֶף וְהָיוּ לַיהוָה מַגִּישֵׁי מִנְחָה בִּצְדָקָה׃
    hebrewPlain: וישב מצרף ומטהר כסף וטהר את בני לוי וזקק אתם כזהב וככסף והיו ליהוה מגישי מנחה בצדקה
    kjvRefs:
    - Malachi 3:3
    kjvOsis:
    - Mal.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.4
    scripture: tanakh
    name: Tanakh Malachi 3:4
    ref: Malachi 3:4
    book: Mal
    section: neviim
    chapter: 3
    verse: 4
    ordinal: 15122
    text: Then shall the offering of Judah and Jerusalem be pleasant unto the LORD, as in the days of old, and as in ancient years.
    translation: JPS 1917
    original: וְעָרְבָה לַיהוָה מִנְחַת יְהוּדָה וִירוּשָׁלִָם כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמֹנִיּוֹת׃
    hebrewPlain: וערבה ליהוה מנחת יהודה וירושלם כימי עולם וכשנים קדמניות
    kjvRefs:
    - Malachi 3:4
    kjvOsis:
    - Mal.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.5
    scripture: tanakh
    name: Tanakh Malachi 3:5
    ref: Malachi 3:5
    book: Mal
    section: neviim
    chapter: 3
    verse: 5
    ordinal: 15123
    text: And I will come near to you to judgment; and I will be a swift witness against the sorcerers, and against the adulterers, and against false swearers; and against those that oppress the hireling in his wages, The widow, and the fatherless, and that turn aside the stranger from his right, and fear not Me, Saith the LORD of hosts.
    translation: JPS 1917
    original: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט וְהָיִיתִי עֵד מְמַהֵר בַּמְכַשְּׁפִים וּבַמְנָאֲפִים וּבַנִּשְׁבָּעִים לַשָּׁקֶר וּבְעֹשְׁקֵי שְׂכַר־שָׂכִיר אַלְמָנָה וְיָתוֹם וּמַטֵּי־גֵר וְלֹא יְרֵאוּנִי אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: וקרבתי אליכם למשפט והייתי עד ממהר במכשפים ובמנאפים ובנשבעים לשקר ובעשקי שכר שכיר אלמנה ויתום ומטי גר ולא יראוני אמר יהוה צבאות
    kjvRefs:
    - Malachi 3:5
    kjvOsis:
    - Mal.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.6
    scripture: tanakh
    name: Tanakh Malachi 3:6
    ref: Malachi 3:6
    book: Mal
    section: neviim
    chapter: 3
    verse: 6
    ordinal: 15124
    text: For I the LORD change not; and ye, O sons of Jacob, are not consumed.
    translation: JPS 1917
    original: כִּי אֲנִי יְהוָה לֹא שָׁנִיתִי וְאַתֶּם בְּנֵי־יַעֲקֹב לֹא כְלִיתֶם׃
    hebrewPlain: כי אני יהוה לא שניתי ואתם בני יעקב לא כליתם
    kjvRefs:
    - Malachi 3:6
    kjvOsis:
    - Mal.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.7
    scripture: tanakh
    name: Tanakh Malachi 3:7
    ref: Malachi 3:7
    book: Mal
    section: neviim
    chapter: 3
    verse: 7
    ordinal: 15125
    text: 'From the days of your fathers ye have turned aside from Mine ordinances, and have not kept them. Return unto Me, and I will return unto you, Saith the LORD of hosts. But ye say: ‘Wherein shall we return?’'
    translation: JPS 1917
    original: לְמִימֵי אֲבֹתֵיכֶם סַרְתֶּם מֵחֻקַּי וְלֹא שְׁמַרְתֶּם שׁוּבוּ אֵלַי וְאָשׁוּבָה אֲלֵיכֶם אָמַר יְהוָה צְבָאוֹת וַאֲמַרְתֶּם בַּמֶּה נָשׁוּב׃
    hebrewPlain: למימי אבתיכם סרתם מחקי ולא שמרתם שובו אלי ואשובה אליכם אמר יהוה צבאות ואמרתם במה נשוב
    kjvRefs:
    - Malachi 3:7
    kjvOsis:
    - Mal.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.8
    scripture: tanakh
    name: Tanakh Malachi 3:8
    ref: Malachi 3:8
    book: Mal
    section: neviim
    chapter: 3
    verse: 8
    ordinal: 15126
    text: 'Will a man rob God? Yet ye rob Me. But ye say: ‘Wherein have we robbed Thee?’ In tithes and heave-offerings.'
    translation: JPS 1917
    original: הֲיִקְבַּע אָדָם אֱלֹהִים כִּי אַתֶּם קֹבְעִים אֹתִי וַאֲמַרְתֶּם בַּמֶּה קְבַעֲנוּךָ הַמַּעֲשֵׂר וְהַתְּרוּמָה׃
    hebrewPlain: היקבע אדם אלהים כי אתם קבעים אתי ואמרתם במה קבענוך המעשר והתרומה
    kjvRefs:
    - Malachi 3:8
    kjvOsis:
    - Mal.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.9
    scripture: tanakh
    name: Tanakh Malachi 3:9
    ref: Malachi 3:9
    book: Mal
    section: neviim
    chapter: 3
    verse: 9
    ordinal: 15127
    text: Ye are cursed with the curse, Yet ye rob Me, Even this whole nation.
    translation: JPS 1917
    original: בַּמְּאֵרָה אַתֶּם נֵאָרִים וְאֹתִי אַתֶּם קֹבְעִים הַגּוֹי כֻּלּוֹ׃
    hebrewPlain: במארה אתם נארים ואתי אתם קבעים הגוי כלו
    kjvRefs:
    - Malachi 3:9
    kjvOsis:
    - Mal.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.10
    scripture: tanakh
    name: Tanakh Malachi 3:10
    ref: Malachi 3:10
    book: Mal
    section: neviim
    chapter: 3
    verse: 10
    ordinal: 15128
    text: Bring ye the whole tithe into the store-house, that there may be food in My house, and try Me now herewith, Saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall be more than sufficiency. .
    translation: JPS 1917
    original: הָבִיאוּ אֶת־כָּל־הַמַּעֲשֵׂר אֶל־בֵּית הָאוֹצָר וִיהִי טֶרֶף בְּבֵיתִי וּבְחָנוּנִי נָא בָּזֹאת אָמַר יְהוָה צְבָאוֹת אִם־לֹא אֶפְתַּח לָכֶם אֵת אֲרֻבּוֹת הַשָּׁמַיִם וַהֲרִיקֹתִי לָכֶם בְּרָכָה עַד־בְּלִי־דָי׃
    hebrewPlain: הביאו את כל המעשר אל בית האוצר ויהי טרף בביתי ובחנוני נא בזאת אמר יהוה צבאות אם לא אפתח לכם את ארבות השמים והריקתי לכם ברכה עד בלי די
    kjvRefs:
    - Malachi 3:10
    kjvOsis:
    - Mal.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.11
    scripture: tanakh
    name: Tanakh Malachi 3:11
    ref: Malachi 3:11
    book: Mal
    section: neviim
    chapter: 3
    verse: 11
    ordinal: 15129
    text: And I will rebuke the devourer for your good, and he shall not destroy the fruits of your land; Neither shall your vine cast its fruit before the time in the field, Saith the LORD of hosts.
    translation: JPS 1917
    original: וְגָעַרְתִּי לָכֶם בָּאֹכֵל וְלֹא־יַשְׁחִת לָכֶם אֶת־פְּרִי הָאֲדָמָה וְלֹא־תְשַׁכֵּל לָכֶם הַגֶּפֶן בַּשָּׂדֶה אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: וגערתי לכם באכל ולא ישחת לכם את פרי האדמה ולא תשכל לכם הגפן בשדה אמר יהוה צבאות
    kjvRefs:
    - Malachi 3:11
    kjvOsis:
    - Mal.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.12
    scripture: tanakh
    name: Tanakh Malachi 3:12
    ref: Malachi 3:12
    book: Mal
    section: neviim
    chapter: 3
    verse: 12
    ordinal: 15130
    text: And all nations shall call you happy; For ye shall be a delightsome land, Saith the LORD of hosts.
    translation: JPS 1917
    original: וְאִשְּׁרוּ אֶתְכֶם כָּל־הַגּוֹיִם כִּי־תִהְיוּ אַתֶּם אֶרֶץ חֵפֶץ אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: ואשרו אתכם כל הגוים כי תהיו אתם ארץ חפץ אמר יהוה צבאות
    kjvRefs:
    - Malachi 3:12
    kjvOsis:
    - Mal.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.13
    scripture: tanakh
    name: Tanakh Malachi 3:13
    ref: Malachi 3:13
    book: Mal
    section: neviim
    chapter: 3
    verse: 13
    ordinal: 15131
    text: 'Your words have been all too strong against Me, Saith the LORD. Yet ye say: ‘Wherein have we spoken against thee?’'
    translation: JPS 1917
    original: חָזְקוּ עָלַי דִּבְרֵיכֶם אָמַר יְהוָה וַאֲמַרְתֶּם מַה־נִּדְבַּרְנוּ עָלֶיךָ׃
    hebrewPlain: חזקו עלי דבריכם אמר יהוה ואמרתם מה נדברנו עליך
    kjvRefs:
    - Malachi 3:13
    kjvOsis:
    - Mal.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.14
    scripture: tanakh
    name: Tanakh Malachi 3:14
    ref: Malachi 3:14
    book: Mal
    section: neviim
    chapter: 3
    verse: 14
    ordinal: 15132
    text: 'Ye have said: ‘It is vain to serve God; and what profit is it that we have kept His charge, and that we have walked mournfully because of the LORD of hosts?'
    translation: JPS 1917
    original: אֲמַרְתֶּם שָׁוְא עֲבֹד אֱלֹהִים וּמַה־בֶּצַע כִּי שָׁמַרְנוּ מִשְׁמַרְתּוֹ וְכִי הָלַכְנוּ קְדֹרַנִּית מִפְּנֵי יְהוָה צְבָאוֹת׃
    hebrewPlain: אמרתם שוא עבד אלהים ומה בצע כי שמרנו משמרתו וכי הלכנו קדרנית מפני יהוה צבאות
    kjvRefs:
    - Malachi 3:14
    kjvOsis:
    - Mal.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.15
    scripture: tanakh
    name: Tanakh Malachi 3:15
    ref: Malachi 3:15
    book: Mal
    section: neviim
    chapter: 3
    verse: 15
    ordinal: 15133
    text: And now we call the proud happy; yea, they that work wickedness are built up; yea, they try God, and are delivered.’
    translation: JPS 1917
    original: וְעַתָּה אֲנַחְנוּ מְאַשְּׁרִים זֵדִים גַּם־נִבְנוּ עֹשֵׂי רִשְׁעָה גַּם בָּחֲנוּ אֱלֹהִים וַיִּמָּלֵטוּ׃
    hebrewPlain: ועתה אנחנו מאשרים זדים גם נבנו עשי רשעה גם בחנו אלהים וימלטו
    kjvRefs:
    - Malachi 3:15
    kjvOsis:
    - Mal.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.16
    scripture: tanakh
    name: Tanakh Malachi 3:16
    ref: Malachi 3:16
    book: Mal
    section: neviim
    chapter: 3
    verse: 16
    ordinal: 15134
    text: Then they that feared the LORD Spoke one with another; and the LORD hearkened, and heard, and a book of remembrance was written before Him, for them that feared the LORD, and that thought upon His name.
    translation: JPS 1917
    original: אָז נִדְבְּרוּ יִרְאֵי יְהוָה אִישׁ אֶת־רֵעֵהוּ וַיַּקְשֵׁב יְהוָה וַיִּשְׁמָע וַיִּכָּתֵב סֵפֶר זִכָּרוֹן לְפָנָיו לְיִרְאֵי יְהוָה וּלְחֹשְׁבֵי שְׁמוֹ׃
    hebrewPlain: אז נדברו יראי יהוה איש את רעהו ויקשב יהוה וישמע ויכתב ספר זכרון לפניו ליראי יהוה ולחשבי שמו
    kjvRefs:
    - Malachi 3:16
    kjvOsis:
    - Mal.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.17
    scripture: tanakh
    name: Tanakh Malachi 3:17
    ref: Malachi 3:17
    book: Mal
    section: neviim
    chapter: 3
    verse: 17
    ordinal: 15135
    text: And they shall be Mine, saith the LORD of hosts, in the day that I do make, even Mine own treasure; and I will spare them, as a man spareth His own son that serveth him.
    translation: JPS 1917
    original: וְהָיוּ לִי אָמַר יְהוָה צְבָאוֹת לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה סְגֻלָּה וְחָמַלְתִּי עֲלֵיהֶם כַּאֲשֶׁר יַחְמֹל אִישׁ עַל־בְּנוֹ הָעֹבֵד אֹתוֹ׃
    hebrewPlain: והיו לי אמר יהוה צבאות ליום אשר אני עשה סגלה וחמלתי עליהם כאשר יחמל איש על בנו העבד אתו
    kjvRefs:
    - Malachi 3:17
    kjvOsis:
    - Mal.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.18
    scripture: tanakh
    name: Tanakh Malachi 3:18
    ref: Malachi 3:18
    book: Mal
    section: neviim
    chapter: 3
    verse: 18
    ordinal: 15136
    text: Then shall ye again discern between the righteous and the wicked, between him that serveth God and him that serveth Him not.
    translation: JPS 1917
    original: וְשַׁבְתֶּם וּרְאִיתֶם בֵּין צַדִּיק לְרָשָׁע בֵּין עֹבֵד אֱלֹהִים לַאֲשֶׁר לֹא עֲבָדוֹ׃
    hebrewPlain: ושבתם וראיתם בין צדיק לרשע בין עבד אלהים לאשר לא עבדו
    kjvRefs:
    - Malachi 3:18
    kjvOsis:
    - Mal.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.19
    scripture: tanakh
    name: Tanakh Malachi 3:19
    ref: Malachi 3:19
    book: Mal
    section: neviim
    chapter: 3
    verse: 19
    ordinal: 15137
    text: For, behold, the day cometh, It burneth as a furnace; and all the proud, and all that work wickedness, shall be stubble; and the day that cometh shall set them ablaze, Saith the LORD of hosts, that it shall leave them neither root nor branch.
    translation: JPS 1917
    original: כִּי־הִנֵּה הַיּוֹם בָּא בֹּעֵר כַּתַּנּוּר וְהָיוּ כָל־זֵדִים וְכָל־עֹשֵׂה רִשְׁעָה קַשׁ וְלִהַט אֹתָם הַיּוֹם הַבָּא אָמַר יְהוָה צְבָאוֹת אֲשֶׁר לֹא־יַעֲזֹב לָהֶם שֹׁרֶשׁ וְעָנָף׃
    hebrewPlain: כי הנה היום בא בער כתנור והיו כל זדים וכל עשה רשעה קש ולהט אתם היום הבא אמר יהוה צבאות אשר לא יעזב להם שרש וענף
    kjvRefs:
    - Malachi 4:1
    kjvOsis:
    - Mal.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.20
    scripture: tanakh
    name: Tanakh Malachi 3:20
    ref: Malachi 3:20
    book: Mal
    section: neviim
    chapter: 3
    verse: 20
    ordinal: 15138
    text: But unto you that fear My name shall the sun of righteousness arise with healing in its wings; and ye shall go forth, and gambol as calves of the stall.
    translation: JPS 1917
    original: וְזָרְחָה לָכֶם יִרְאֵי שְׁמִי שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא בִּכְנָפֶיהָ וִיצָאתֶם וּפִשְׁתֶּם כְּעֶגְלֵי מַרְבֵּק׃
    hebrewPlain: וזרחה לכם יראי שמי שמש צדקה ומרפא בכנפיה ויצאתם ופשתם כעגלי מרבק
    kjvRefs:
    - Malachi 4:2
    kjvOsis:
    - Mal.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.21
    scripture: tanakh
    name: Tanakh Malachi 3:21
    ref: Malachi 3:21
    book: Mal
    section: neviim
    chapter: 3
    verse: 21
    ordinal: 15139
    text: And ye shall tread down the wicked; for they shall be ashes under the soles of your feet in the day that I do make, Saith the LORD of hosts.
    translation: JPS 1917
    original: וְעַסּוֹתֶם רְשָׁעִים כִּי־יִהְיוּ אֵפֶר תַּחַת כַּפּוֹת רַגְלֵיכֶם בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה אָמַר יְהוָה צְבָאוֹת׃
    hebrewPlain: ועסותם רשעים כי יהיו אפר תחת כפות רגליכם ביום אשר אני עשה אמר יהוה צבאות
    kjvRefs:
    - Malachi 4:3
    kjvOsis:
    - Mal.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Mal.3
- type: TanakhVerse
  data:
    osis: Mal.3.22
    scripture: tanakh
