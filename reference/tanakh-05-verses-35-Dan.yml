  data:
    osis: Dan.4.20
    scripture: tanakh
    name: Tanakh Daniel 4:20
    ref: Daniel 4:20
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 20
    ordinal: 20522
    text: 'And whereas the king saw a watcher and a holy one coming down from heaven, and saying: Hew down the tree, and destroy it; nevertheless leave the stump of the roots thereof in the earth, even in a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and let his portion be with the beasts of the field, till seven times pass over him—'
    translation: JPS 1917
    original: וְדִי חֲזָה מַלְכָּא עִיר וְקַדִּישׁ נָחִת מִן־שְׁמַיָּא וְאָמַר גֹּדּוּ אִילָנָא וְחַבְּלוּהִי בְּרַם עִקַּר שָׁרְשׁוֹהִי בְּאַרְעָא שְׁבֻקוּ וּבֶאֱסוּר דִּי־פַרְזֶל וּנְחָשׁ בְּדִתְאָא דִּי בָרָא וּבְטַל שְׁמַיָּא יִצְטַבַּע וְעִם־חֵיוַת בָּרָא חֲלָקֵהּ עַד דִּי־שִׁבְעָה עִדָּנִין יַחְלְפוּן עֲלוֹהִי׃
    hebrewPlain: ודי חזה מלכא עיר וקדיש נחת מן שמיא ואמר גדו אילנא וחבלוהי ברם עקר שרשוהי בארעא שבקו ובאסור די פרזל ונחש בדתאא די ברא ובטל שמיא יצטבע ועם חיות ברא חלקה עד די שבעה עדנין יחלפון עלוהי
    kjvRefs:
    - Daniel 4:23
    kjvOsis:
    - Dan.4.23
