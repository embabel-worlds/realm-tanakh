    text: 'He cried aloud, and said thus: Hew down the tree, and cut off its branches, Shake off its leaves, and scatter its fruit; Let the beasts get away from under it, And the fowls from its branches.'
    translation: JPS 1917
    original: קָרֵא בְחַיִל וְכֵן אָמַר גֹּדּוּ אִילָנָא וְקַצִּצוּ עַנְפוֹהִי אַתַּרוּ עָפְיֵהּ וּבַדַּרוּ אִנְבֵּהּ תְּנֻד חֵיוְתָא מִן־תַּחְתּוֹהִי וְצִפְּרַיָּא מִן־עַנְפוֹהִי׃
    hebrewPlain: קרא בחיל וכן אמר גדו אילנא וקצצו ענפוהי אתרו עפיה ובדרו אנבה תנד חיותא מן תחתוהי וצפריא מן ענפוהי
