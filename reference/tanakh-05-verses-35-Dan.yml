  data:
    osis: Dan.4.24
    scripture: tanakh
    name: Tanakh Daniel 4:24
    ref: Daniel 4:24
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 24
    ordinal: 20526
    text: Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by almsgiving, and thine iniquities by showing mercy to the poor; if there may be a lengthening of thy prosperity.’
    translation: JPS 1917
    original: לָהֵן מַלְכָּא מִלְכִּי יִשְׁפַּר עליך [עֲלָךְ] וחטיך [וַחֲטָאָךְ] בְּצִדְקָה פְרֻק וַעֲוָיָתָךְ בְּמִחַן עֲנָיִן הֵן תֶּהֱוֵא אַרְכָה לִשְׁלֵוְתָךְ׃
    hebrewPlain: להן מלכא מלכי ישפר עליך [עלך] וחטיך [וחטאך] בצדקה פרק ועויתך במחן ענין הן תהוא ארכה לשלותך
    kjvRefs:
