  data:
    osis: Dan.4.19
    scripture: tanakh
    name: Tanakh Daniel 4:19
    ref: Daniel 4:19
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 19
    ordinal: 20521
    text: it is thou, O king, that art grown and become strong; for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth.
    translation: JPS 1917
    original: אנתה־[אַנְתְּ־] הוּא מַלְכָּא דִּי רְבַית וּתְקֵפְתְּ וּרְבוּתָךְ רְבָת וּמְטָת לִשְׁמַיָּא וְשָׁלְטָנָךְ לְסוֹף אַרְעָא׃
    hebrewPlain: אנתה [אנת ] הוא מלכא די רבית ותקפת ורבותך רבת ומטת לשמיא ושלטנך לסוף ארעא
