    scripture: tanakh
    name: Tanakh Daniel 4:15
    ref: Daniel 4:15
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 20517
    text: This dream I king Nebuchadnezzar have seen; and thou, O Belteshazzar, declare the interpretation, forasmuch as all the wise men of my kingdom are not able to make known unto me the interpretation; but thou art able, for the spirit of the holy gods is in thee.’
    translation: JPS 1917
    original: דְּנָה חֶלְמָא חֲזֵית אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר ואנתה [וְאַנְתְּ] בֵּלְטְשַׁאצַּר פִּשְׁרֵא אֱמַר כָּל־קֳבֵל דִּי כָּל־חַכִּימֵי מַלְכוּתִי לָא־יָכְלִין פִּשְׁרָא לְהוֹדָעֻתַנִי ואנתה [וְאַנְתְּ] כָּהֵל דִּי רוּחַ־אֱלָהִין קַדִּישִׁין בָּךְ׃
    hebrewPlain: דנה חלמא חזית אנה מלכא נבוכדנצר ואנתה [ואנת] בלטשאצר פשרא אמר כל קבל די כל חכימי מלכותי לא יכלין פשרא להודעתני ואנתה [ואנת] כהל די רוח אלהין קדישין בך
    kjvRefs:
