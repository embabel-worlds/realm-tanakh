  data:
    osis: Dan.4.27
    scripture: tanakh
    name: Tanakh Daniel 4:27
    ref: Daniel 4:27
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 27
    ordinal: 20529
    text: 'The king spoke, and said: ‘Is not this great Babylon, which I have built for a royal dwelling-place, by the might of my power and for the glory of my majesty?’'
    translation: JPS 1917
    original: עָנֵה מַלְכָּא וְאָמַר הֲלָא דָא־הִיא בָּבֶל רַבְּתָא דִּי־אֲנָה בֱנַיְתַהּ לְבֵית מַלְכוּ בִּתְקַף חִסְנִי וְלִיקָר הַדְרִי׃
    hebrewPlain: ענה מלכא ואמר הלא דא היא בבל רבתא די אנה בניתה לבית מלכו בתקף חסני וליקר הדרי
    kjvRefs:
    - Daniel 4:30
