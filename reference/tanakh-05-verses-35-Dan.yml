    verse: 13
    ordinal: 20515
    text: Let his heart be changed from man’s, And let a beast’s heart be given unto him; And let seven times pass over him.
    translation: JPS 1917
    original: לִבְבֵהּ מִן־אנושא [אֲנָשָׁא] יְשַׁנּוֹן וּלְבַב חֵיוָה יִתְיְהִב לֵהּ וְשִׁבְעָה עִדָּנִין יַחְלְפוּן עֲלוֹהִי׃
    hebrewPlain: לבבה מן אנושא [אנשא] ישנון ולבב חיוה יתיהב לה ושבעה עדנין יחלפון עלוהי
