  data:
    osis: Dan.4.21
    scripture: tanakh
    name: Tanakh Daniel 4:21
    ref: Daniel 4:21
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 21
    ordinal: 20523
    text: this is the interpretation, O king, and it is the decree of the Most High, which is come upon my lord the king,
    translation: JPS 1917
    original: דְּנָה פִשְׁרָא מַלְכָּא וּגְזֵרַת עליא [עִלָּאָה] הִיא דִּי מְטָת עַל־מראי [מָרִי] מַלְכָּא׃
    hebrewPlain: דנה פשרא מלכא וגזרת עליא [עלאה] היא די מטת על מראי [מרי] מלכא
    kjvRefs:
    - Daniel 4:24
    kjvOsis:
    - Dan.4.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.22
    scripture: tanakh
    name: Tanakh Daniel 4:22
    ref: Daniel 4:22
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 22
    ordinal: 20524
    text: that thou shalt be driven from men, and thy dwelling shall be with the beasts of the field, and thou shalt be made to eat grass as oxen, and shalt be wet with the dew of heaven, and seven times shall pass over thee; till thou know that the Most High ruleth in the kingdom of men, and giveth it to whomsoever He will.
    translation: JPS 1917
    original: וְלָךְ טָרְדִין מִן־אֲנָשָׁא וְעִם־חֵיוַת בָּרָא לֶהֱוֵה מְדֹרָךְ וְעִשְׂבָּא כְתוֹרִין לָךְ יְטַעֲמוּן וּמִטַּל שְׁמַיָּא לָךְ מְצַבְּעִין וְשִׁבְעָה עִדָּנִין יַחְלְפוּן עֲלָיךְ עַד דִּי־תִנְדַּע דִּי־שַׁלִּיט עִלָּיָא בְּמַלְכוּת אֲנָשָׁא וּלְמַן־דִּי יִצְבֵּא יִתְּנִנַּהּ׃
    hebrewPlain: ולך טרדין מן אנשא ועם חיות ברא להוה מדרך ועשבא כתורין לך יטעמון ומטל שמיא לך מצבעין ושבעה עדנין יחלפון עליך עד די תנדע די שליט עליא במלכות אנשא ולמן די יצבא יתננה
    kjvRefs:
    - Daniel 4:25
    kjvOsis:
    - Dan.4.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.23
    scripture: tanakh
    name: Tanakh Daniel 4:23
    ref: Daniel 4:23
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 23
    ordinal: 20525
    text: And whereas it was commanded to leave the stump of the roots of the tree, thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule.
    translation: JPS 1917
    original: וְדִי אֲמַרוּ לְמִשְׁבַּק עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא מַלְכוּתָךְ לָךְ קַיָּמָה מִן־דִּי תִנְדַּע דִּי שַׁלִּטִן שְׁמַיָּא׃
    hebrewPlain: ודי אמרו למשבק עקר שרשוהי די אילנא מלכותך לך קימה מן די תנדע די שלטן שמיא
    kjvRefs:
    - Daniel 4:26
    kjvOsis:
    - Dan.4.26
