- type: TanakhVerse
  data:
    osis: Dan.4.29
    scripture: tanakh
    name: Tanakh Daniel 4:29
    ref: Daniel 4:29
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 29
    ordinal: 20531
    text: And thou shalt be driven from men, and thy dwelling shall be with the beasts of the field; thou shalt be made to eat grass as oxen, and seven times shall pass over thee; until thou know that the Most High ruleth in the kingdom of men, and giveth it to whomsoever He will.’
    translation: JPS 1917
    original: וּמִן־אֲנָשָׁא לָךְ טָרְדִין וְעִם־חֵיוַת בָּרָא מְדֹרָךְ עִשְׂבָּא כְתוֹרִין לָךְ יְטַעֲמוּן וְשִׁבְעָה עִדָּנִין יַחְלְפוּן עליך [עֲלָךְ] עַד דִּי־תִנְדַּע דִּי־שַׁלִּיט עִלָּיָא בְּמַלְכוּת אֲנָשָׁא וּלְמַן־דִּי יִצְבֵּא יִתְּנִנַּהּ׃
    hebrewPlain: ומן אנשא לך טרדין ועם חיות ברא מדרך עשבא כתורין לך יטעמון ושבעה עדנין יחלפון עליך [עלך] עד די תנדע די שליט עליא במלכות אנשא ולמן די יצבא יתננה
    kjvRefs:
    - Daniel 4:32
    kjvOsis:
    - Dan.4.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.30
    scripture: tanakh
    name: Tanakh Daniel 4:30
    ref: Daniel 4:30
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 30
    ordinal: 20532
    text: The same hour was the thing fulfilled upon Nebuchadnezzar; and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hair was grown like eagles’ feathers, and his nails like birds’ claws.
    translation: JPS 1917
    original: בַּהּ־שַׁעֲתָא מִלְּתָא סָפַת עַל־נְבוּכַדְנֶצַּר וּמִן־אֲנָשָׁא טְרִיד וְעִשְׂבָּא כְתוֹרִין יֵאכֻל וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע עַד דִּי שַׂעְרֵהּ כְּנִשְׁרִין רְבָה וְטִפְרוֹהִי כְצִפְּרִין׃
    hebrewPlain: בה שעתא מלתא ספת על נבוכדנצר ומן אנשא טריד ועשבא כתורין יאכל ומטל שמיא גשמה יצטבע עד די שערה כנשרין רבה וטפרוהי כצפרין
    kjvRefs:
    - Daniel 4:33
    kjvOsis:
    - Dan.4.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.31
    scripture: tanakh
    name: Tanakh Daniel 4:31
    ref: Daniel 4:31
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 31
    ordinal: 20533
    text: ‘And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the Most High, and I praised and honoured Him that liveth for ever; For His dominion is an everlasting dominion, And His kingdom from generation to generation;
    translation: JPS 1917
    original: וְלִקְצָת יוֹמַיָּה אֲנָה נְבוּכַדְנֶצַּר עַיְנַי לִשְׁמַיָּא נִטְלֵת וּמַנְדְּעִי עֲלַי יְתוּב ולעליא [וּלְעִלָּאָה] בָּרְכֵת וּלְחַי עָלְמָא שַׁבְּחֵת וְהַדְּרֵת דִּי שָׁלְטָנֵהּ שָׁלְטָן עָלַם וּמַלְכוּתֵהּ עִם־דָּר וְדָר׃
    hebrewPlain: ולקצת יומיה אנה נבוכדנצר עיני לשמיא נטלת ומנדעי עלי יתוב ולעליא [ולעלאה] ברכת ולחי עלמא שבחת והדרת די שלטנה שלטן עלם ומלכותה עם דר ודר
    kjvRefs:
    - Daniel 4:34
    kjvOsis:
    - Dan.4.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.32
    scripture: tanakh
    name: Tanakh Daniel 4:32
    ref: Daniel 4:32
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 32
    ordinal: 20534
    text: 'And all the inhabitants of the earth are reputed as nothing; And He doeth according to His will in the host of heaven, And among the inhabitants of the earth; And none can stay His hand, Or say unto Him: What doest Thou?'
    translation: JPS 1917
    original: וְכָל־דארי [דָּיְרֵי] אַרְעָא כְּלָה חֲשִׁיבִין וּכְמִצְבְּיֵהּ עָבֵד בְּחֵיל שְׁמַיָּא ודארי [וְדָיְרֵי] אַרְעָא וְלָא אִיתַי דִּי־יְמַחֵא בִידֵהּ וְיֵאמַר לֵהּ מָה עֲבַדְתְּ׃
    hebrewPlain: וכל דארי [דירי] ארעא כלה חשיבין וכמצביה עבד בחיל שמיא ודארי [ודירי] ארעא ולא איתי די ימחא בידה ויאמר לה מה עבדת
    kjvRefs:
    - Daniel 4:35
    kjvOsis:
    - Dan.4.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.33
    scripture: tanakh
    name: Tanakh Daniel 4:33
    ref: Daniel 4:33
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 33
    ordinal: 20535
    text: At the same time mine understanding returned unto me; and for the glory of my kingdom, my majesty and my splendour returned unto me; and my ministers and my lords sought unto me; and I was established in my kingdom, and surpassing greatness was added unto me.
    translation: JPS 1917
    original: בֵּהּ־זִמְנָא מַנְדְּעִי יְתוּב עֲלַי וְלִיקַר מַלְכוּתִי הַדְרִי וְזִוִי יְתוּב עֲלַי וְלִי הַדָּבְרַי וְרַבְרְבָנַי יְבַעוֹן וְעַל־מַלְכוּתִי הָתְקְנַת וּרְבוּ יַתִּירָה הוּסְפַת לִי׃
    hebrewPlain: בה זמנא מנדעי יתוב עלי וליקר מלכותי הדרי וזוי יתוב עלי ולי הדברי ורברבני יבעון ועל מלכותי התקנת ורבו יתירה הוספת לי
    kjvRefs:
    - Daniel 4:36
    kjvOsis:
    - Dan.4.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.34
    scripture: tanakh
    name: Tanakh Daniel 4:34
    ref: Daniel 4:34
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 34
    ordinal: 20536
    text: Now I Nebuchadnezzar praise and extol and honour the King of heaven; for all His works are truth, and His ways justice; and those that walk in pride He is able to abase.’
    translation: JPS 1917
    original: כְּעַן אֲנָה נְבוּכַדְנֶצַּר מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר לְמֶלֶךְ שְׁמַיָּא דִּי כָל־מַעֲבָדוֹהִי קְשֹׁט וְאֹרְחָתֵהּ דִּין וְדִי מַהְלְכִין בְּגֵוָה יָכִל לְהַשְׁפָּלָה׃
    hebrewPlain: כען אנה נבוכדנצר משבח ומרומם ומהדר למלך שמיא די כל מעבדוהי קשט וארחתה דין ודי מהלכין בגוה יכל להשפלה
    kjvRefs:
    - Daniel 4:37
    kjvOsis:
    - Dan.4.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.5.1
    scripture: tanakh
    name: Tanakh Daniel 5:1
    ref: Daniel 5:1
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 20537
    text: Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.
    translation: JPS 1917
    original: בֵּלְשַׁאצַּר מַלְכָּא עֲבַד לְחֶם רַב לְרַבְרְבָנוֹהִי אֲלַף וְלָקֳבֵל אַלְפָּא חַמְרָא שָׁתֵה׃
    hebrewPlain: בלשאצר מלכא עבד לחם רב לרברבנוהי אלף ולקבל אלפא חמרא שתה
    kjvRefs:
    - Daniel 5:1
    kjvOsis:
    - Dan.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.2
    scripture: tanakh
    name: Tanakh Daniel 5:2
    ref: Daniel 5:2
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 20538
    text: Belshazzar, while he tasted the wine, commanded to bring the golden and silver vessels which Nebuchadnezzar his father had taken out of the temple which was in Jerusalem; that the king and his lords, his consorts and his concubines, might drink therein.
    translation: JPS 1917
    original: בֵּלְשַׁאצַּר אֲמַר בִּטְעֵם חַמְרָא לְהַיְתָיָה לְמָאנֵי דַּהֲבָא וְכַסְפָּא דִּי הַנְפֵּק נְבוּכַדְנֶצַּר אֲבוּהִי מִן־הֵיכְלָא דִּי בִירוּשְׁלֶם וְיִשְׁתּוֹן בְּהוֹן מַלְכָּא וְרַבְרְבָנוֹהִי שֵׁגְלָתֵהּ וּלְחֵנָתֵהּ׃
    hebrewPlain: בלשאצר אמר בטעם חמרא להיתיה למאני דהבא וכספא די הנפק נבוכדנצר אבוהי מן היכלא די בירושלם וישתון בהון מלכא ורברבנוהי שגלתה ולחנתה
    kjvRefs:
    - Daniel 5:2
    kjvOsis:
    - Dan.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.3
    scripture: tanakh
    name: Tanakh Daniel 5:3
    ref: Daniel 5:3
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 20539
    text: Then they brought the golden vessels that were taken out of the temple of the house of God which was at Jerusalem; and the king, and his lords, his consorts and his concubines, drank in them.
    translation: JPS 1917
    original: בֵּאדַיִן הַיְתִיו מָאנֵי דַהֲבָא דִּי הַנְפִּקוּ מִן־הֵיכְלָא דִּי־בֵית אֱלָהָא דִּי בִירוּשְׁלֶם וְאִשְׁתִּיו בְּהוֹן מַלְכָּא וְרַבְרְבָנוֹהִי שֵׁגְלָתֵהּ וּלְחֵנָתֵהּ׃
    hebrewPlain: באדין היתיו מאני דהבא די הנפקו מן היכלא די בית אלהא די בירושלם ואשתיו בהון מלכא ורברבנוהי שגלתה ולחנתה
    kjvRefs:
    - Daniel 5:3
    kjvOsis:
    - Dan.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.4
    scripture: tanakh
    name: Tanakh Daniel 5:4
    ref: Daniel 5:4
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 20540
    text: They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.
    translation: JPS 1917
    original: אִשְׁתִּיו חַמְרָא וְשַׁבַּחוּ לֵאלָהֵי דַּהֲבָא וְכַסְפָּא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא׃
    hebrewPlain: אשתיו חמרא ושבחו לאלהי דהבא וכספא נחשא פרזלא אעא ואבנא
    kjvRefs:
    - Daniel 5:4
    kjvOsis:
    - Dan.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.5
    scripture: tanakh
    name: Tanakh Daniel 5:5
    ref: Daniel 5:5
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 20541
    text: In the same hour came forth fingers of a man’s hand, and wrote over against the candlestick upon the plaster of the wall of the king’s palace; and the king saw the palm of the hand that wrote.
    translation: JPS 1917
    original: בַּהּ־שַׁעֲתָה נפקו [נְפַקָה] אֶצְבְּעָן דִּי יַד־אֱנָשׁ וְכָתְבָן לָקֳבֵל נֶבְרַשְׁתָּא עַל־גִּירָא דִּי־כְתַל הֵיכְלָא דִּי מַלְכָּא וּמַלְכָּא חָזֵה פַּס יְדָה דִּי כָתְבָה׃
    hebrewPlain: בה שעתה נפקו [נפקה] אצבען די יד אנש וכתבן לקבל נברשתא על גירא די כתל היכלא די מלכא ומלכא חזה פס ידה די כתבה
    kjvRefs:
    - Daniel 5:5
    kjvOsis:
    - Dan.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.6
    scripture: tanakh
    name: Tanakh Daniel 5:6
    ref: Daniel 5:6
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 20542
    text: Then the king’s countenance was changed in him, and his thoughts affrighted him; and the joints of his loins were loosed, and his knees smote one against another.
    translation: JPS 1917
    original: אֱדַיִן מַלְכָּא זִיוֺהִי שְׁנוֹהִי וְרַעיֹנֹהִי יְבַהֲלוּנֵּהּ וְקִטְרֵי חַרְצֵהּ מִשְׁתָּרַיִן וְאַרְכֻבָּתֵהּ דָּא לְדָא נָקְשָׁן׃
    hebrewPlain: אדין מלכא זיוהי שנוהי ורעינהי יבהלונה וקטרי חרצה משתרין וארכבתה דא לדא נקשן
    kjvRefs:
    - Daniel 5:6
    kjvOsis:
    - Dan.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.7
    scripture: tanakh
    name: Tanakh Daniel 5:7
    ref: Daniel 5:7
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 20543
    text: 'The king cried aloud to bring in the enchanters, the Chaldeans, and the astrologers. The king spoke and said to the wise men of Babylon: ‘Whosoever shall read this writing, and declare unto me the interpretation thereof, shall be clothed with purple, and have a chain of gold about his neck, and shall rule as one of three in the kingdom.’'
    translation: JPS 1917
    original: קָרֵא מַלְכָּא בְּחַיִל לְהֶעָלָה לְאָשְׁפַיָּא כשדיא [כַּשְׂדָּאֵי] וְגָזְרַיָּא עָנֵה מַלְכָּא וְאָמַר לְחַכִּימֵי בָבֶל דִּי כָל־אֱנָשׁ דִּי־יִקְרֵה כְּתָבָה דְנָה וּפִשְׁרֵהּ יְחַוִּנַּנִי אַרְגְּוָנָא יִלְבַּשׁ והמונכא [וְהַמְנִיכָא] דִי־דַהֲבָא עַל־צַוְּארֵהּ וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט׃
    hebrewPlain: קרא מלכא בחיל להעלה לאשפיא כשדיא [כשדאי] וגזריא ענה מלכא ואמר לחכימי בבל די כל אנש די יקרה כתבה דנה ופשרה יחונני ארגונא ילבש והמונכא [והמניכא] די דהבא על צוארה ותלתי במלכותא ישלט
    kjvRefs:
    - Daniel 5:7
    kjvOsis:
    - Dan.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.8
    scripture: tanakh
    name: Tanakh Daniel 5:8
    ref: Daniel 5:8
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 20544
    text: 'Then came in all the king’s wise men: but they could not read the writing, nor make known to the king the interpretation.'
    translation: JPS 1917
    original: אֱדַיִן עללין [עָלִּין] כֹּל חַכִּימֵי מַלְכָּא וְלָא־כָהֲלִין כְּתָבָא לְמִקְרֵא ופשרא [וּפִשְׁרֵהּ] לְהוֹדָעָה לְמַלְכָּא׃
    hebrewPlain: אדין עללין [עלין] כל חכימי מלכא ולא כהלין כתבא למקרא ופשרא [ופשרה] להודעה למלכא
    kjvRefs:
    - Daniel 5:8
    kjvOsis:
    - Dan.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
