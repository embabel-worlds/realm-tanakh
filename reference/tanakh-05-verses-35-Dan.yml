  data:
    osis: Dan.4.16
    scripture: tanakh
    name: Tanakh Daniel 4:16
    ref: Daniel 4:16
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 20518
    text: 'Then Daniel, whose name was Belteshazzar, was appalled for a while, and his thoughts affrighted him. The king spoke and said: ‘Belteshazzar, let not the dream, or the interpretation, affright thee.’ Belteshazzar answered and said: ‘My lord, the dream be to them that hate thee, and the interpretation thereof to thine adversaries.'
    translation: JPS 1917
    original: אֱדַיִן דָּנִיֵּאל דִּי־שְׁמֵהּ בֵּלְטְשַׁאצַּר אֶשְׁתּוֹמַם כְּשָׁעָה חֲדָה וְרַעְיֹנֹהִי יְבַהֲלֻנֵּהּ עָנֵה מַלְכָּא וְאָמַר בֵּלְטְשַׁאצַּר חֶלְמָא וּפִשְׁרֵא אַל־יְבַהֲלָךְ עָנֵה בֵלְטְשַׁאצַּר וְאָמַר מראי [מָרִי] חֶלְמָא לשנאיך [לְשָׂנְאָךְ] וּפִשְׁרֵהּ לעריך [לְעָרָךְ׃]
    hebrewPlain: אדין דניאל די שמה בלטשאצר אשתומם כשעה חדה ורעינהי יבהלנה ענה מלכא ואמר בלטשאצר חלמא ופשרא אל יבהלך ענה בלטשאצר ואמר מראי [מרי] חלמא לשנאיך [לשנאך] ופשרה לעריך [לערך]
    kjvRefs:
    - Daniel 4:19
    kjvOsis:
    - Dan.4.19
