    scripture: tanakh
    name: Tanakh Daniel 4:14
    ref: Daniel 4:14
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 20516
    text: The matter is by the decree of the watchers, And the sentence by the word of the holy ones; To the intent that the living may know That the Most High ruleth in the kingdom of men, And giveth it to whomsoever He will, And setteth up over it the lowest of men.
    translation: JPS 1917
    original: בִּגְזֵרַת עִירִין פִּתְגָמָא וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא עַד־דִּבְרַת דִּי יִנְדְּעוּן חַיַּיָּא דִּי־שַׁלִּיט עליא [עִלָּאָה] בְּמַלְכוּת אנושא [אֲנָשָׁא] וּלְמַן־דִּי יִצְבֵּא יִתְּנִנַּהּ וּשְׁפַל אֲנָשִׁים יְקִים עליה [עֲלַהּ׃]
    hebrewPlain: בגזרת עירין פתגמא ומאמר קדישין שאלתא עד דברת די ינדעון חייא די שליט עליא [עלאה] במלכות אנושא [אנשא] ולמן די יצבא יתננה ושפל אנשים יקים עליה [עלה]
    kjvRefs:
    - Daniel 4:17
    kjvOsis:
    - Dan.4.17
