      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.4
    scripture: tanakh
    name: Tanakh Daniel 1:4
    ref: Daniel 1:4
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 4
    ordinal: 20403
    text: youths in whom was no blemish, but fair to look on, and skilful in all wisdom, and skilful in knowledge, and discerning in thought, and such as had ability to stand in the king’s palace; and that he should teach them the learning and the tongue of the Chaldeans.
    translation: JPS 1917
    original: יְלָדִים אֲשֶׁר אֵין־בָּהֶם כָּל־מאום [מוּם] וְטוֹבֵי מַרְאֶה וּמַשְׂכִּילִים בְּכָל־חָכְמָה וְיֹדְעֵי דַעַת וּמְבִינֵי מַדָּע וַאֲשֶׁר כֹּחַ בָּהֶם לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ וּלֲלַמְּדָם סֵפֶר וּלְשׁוֹן כַּשְׂדִּים׃
    hebrewPlain: ילדים אשר אין בהם כל מאום [מום] וטובי מראה ומשכילים בכל חכמה וידעי דעת ומביני מדע ואשר כח בהם לעמד בהיכל המלך וללמדם ספר ולשון כשדים
    kjvRefs:
    - Daniel 1:4
    kjvOsis:
    - Dan.1.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.5
    scripture: tanakh
    name: Tanakh Daniel 1:5
    ref: Daniel 1:5
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 20404
    text: And the king appointed for them a daily portion of the king’s food, and of the wine which he drank, and that they should be nourished three years; that at the end thereof they might stand before the king.
    translation: JPS 1917
    original: וַיְמַן לָהֶם הַמֶּלֶךְ דְּבַר־יוֹם בְּיוֹמוֹ מִפַּת־בַּג הַמֶּלֶךְ וּמִיֵּין מִשְׁתָּיו וּלְגַדְּלָם שָׁנִים שָׁלוֹשׁ וּמִקְצָתָם יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: וימן להם המלך דבר יום ביומו מפת בג המלך ומיין משתיו ולגדלם שנים שלוש ומקצתם יעמדו לפני המלך
    kjvRefs:
    - Daniel 1:5
    kjvOsis:
    - Dan.1.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.6
    scripture: tanakh
    name: Tanakh Daniel 1:6
    ref: Daniel 1:6
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 20405
    text: Now among these were, of the children of Judah, Daniel, Hananiah, Mishael, and Azariah.
    translation: JPS 1917
    original: וַיְהִי בָהֶם מִבְּנֵי יְהוּדָה דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה׃
    hebrewPlain: ויהי בהם מבני יהודה דניאל חנניה מישאל ועזריה
    kjvRefs:
    - Daniel 1:6
    kjvOsis:
    - Dan.1.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.7
    scripture: tanakh
    name: Tanakh Daniel 1:7
    ref: Daniel 1:7
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 20406
    text: 'And the chief of the officers gave names unto them: unto Daniel he gave the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abed-nego.'
    translation: JPS 1917
    original: וַיָּשֶׂם לָהֶם שַׂר הַסָּרִיסִים שֵׁמוֹת וַיָּשֶׂם לְדָנִיֵּאל בֵּלְטְשַׁאצַּר וְלַחֲנַנְיָה שַׁדְרַךְ וּלְמִישָׁאֵל מֵישַׁךְ וְלַעֲזַרְיָה עֲבֵד נְגוֹ׃
    hebrewPlain: וישם להם שר הסריסים שמות וישם לדניאל בלטשאצר ולחנניה שדרך ולמישאל מישך ולעזריה עבד נגו
    kjvRefs:
    - Daniel 1:7
    kjvOsis:
    - Dan.1.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.8
    scripture: tanakh
    name: Tanakh Daniel 1:8
    ref: Daniel 1:8
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 20407
    text: But Daniel purposed in his heart that he would not defile himself with the king’s food, nor with the wine which he drank; therefore he requested of the chief of the officers that he might not defile himself.
    translation: JPS 1917
    original: וַיָּשֶׂם דָּנִיֵּאל עַל־לִבּוֹ אֲשֶׁר לֹא־יִתְגָּאַל בְּפַתְבַּג הַמֶּלֶךְ וּבְיֵין מִשְׁתָּיו וַיְבַקֵּשׁ מִשַּׂר הַסָּרִיסִים אֲשֶׁר לֹא יִתְגָּאָל׃
    hebrewPlain: וישם דניאל על לבו אשר לא יתגאל בפתבג המלך וביין משתיו ויבקש משר הסריסים אשר לא יתגאל
    kjvRefs:
    - Daniel 1:8
    kjvOsis:
    - Dan.1.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.9
    scripture: tanakh
    name: Tanakh Daniel 1:9
    ref: Daniel 1:9
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 20408
    text: And God granted Daniel mercy and compassion in the sight of the chief of the officers.
    translation: JPS 1917
    original: וַיִּתֵּן הָאֱלֹהִים אֶת־דָּנִיֵּאל לְחֶסֶד וּלְרַחֲמִים לִפְנֵי שַׂר הַסָּרִיסִים׃
    hebrewPlain: ויתן האלהים את דניאל לחסד ולרחמים לפני שר הסריסים
    kjvRefs:
    - Daniel 1:9
    kjvOsis:
    - Dan.1.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.10
    scripture: tanakh
    name: Tanakh Daniel 1:10
    ref: Daniel 1:10
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 20409
    text: 'And the chief of the officers said unto Daniel: ‘I fear my lord the king, who hath appointed your food and your drink; for why should he see your faces sad in comparison with the youths that are of your own age? so would ye endanger my head with the king.’'
    translation: JPS 1917
    original: וַיֹּאמֶר שַׂר הַסָּרִיסִים לְדָנִיֵּאל יָרֵא אֲנִי אֶת־אֲדֹנִי הַמֶּלֶךְ אֲשֶׁר מִנָּה אֶת־מַאֲכַלְכֶם וְאֶת־מִשְׁתֵּיכֶם אֲשֶׁר לָמָּה יִרְאֶה אֶת־פְּנֵיכֶם זֹעֲפִים מִן־הַיְלָדִים אֲשֶׁר כְּגִילְכֶם וְחִיַּבְתֶּם אֶת־רֹאשִׁי לַמֶּלֶךְ׃
    hebrewPlain: ויאמר שר הסריסים לדניאל ירא אני את אדני המלך אשר מנה את מאכלכם ואת משתיכם אשר למה יראה את פניכם זעפים מן הילדים אשר כגילכם וחיבתם את ראשי למלך
    kjvRefs:
    - Daniel 1:10
    kjvOsis:
    - Dan.1.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.11
    scripture: tanakh
    name: Tanakh Daniel 1:11
    ref: Daniel 1:11
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 20410
    text: 'Then said Daniel to the steward, whom the chief of the officers had appointed over Daniel, Hananiah, Mishael, and Azariah:'
    translation: JPS 1917
    original: וַיֹּאמֶר דָּנִיֵּאל אֶל־הַמֶּלְצַר אֲשֶׁר מִנָּה שַׂר הַסָּרִיסִים עַל־דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה׃
    hebrewPlain: ויאמר דניאל אל המלצר אשר מנה שר הסריסים על דניאל חנניה מישאל ועזריה
    kjvRefs:
    - Daniel 1:11
    kjvOsis:
    - Dan.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.12
    scripture: tanakh
    name: Tanakh Daniel 1:12
    ref: Daniel 1:12
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 20411
    text: ’Try thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.
    translation: JPS 1917
    original: נַס־נָא אֶת־עֲבָדֶיךָ יָמִים עֲשָׂרָה וְיִתְּנוּ־לָנוּ מִן־הַזֵּרֹעִים וְנֹאכְלָה וּמַיִם וְנִשְׁתֶּה׃
    hebrewPlain: נס נא את עבדיך ימים עשרה ויתנו לנו מן הזרעים ונאכלה ומים ונשתה
    kjvRefs:
    - Daniel 1:12
    kjvOsis:
    - Dan.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.13
    scripture: tanakh
    name: Tanakh Daniel 1:13
    ref: Daniel 1:13
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 20412
    text: Then let our countenances be looked upon before thee, and the countenance of the youths that eat of the king’s food; and as thou seest, deal with thy servants.’
    translation: JPS 1917
    original: וְיֵרָאוּ לְפָנֶיךָ מַרְאֵינוּ וּמַרְאֵה הַיְלָדִים הָאֹכְלִים אֵת פַּתְבַּג הַמֶּלֶךְ וְכַאֲשֶׁר תִּרְאֵה עֲשֵׂה עִם־עֲבָדֶיךָ׃
    hebrewPlain: ויראו לפניך מראינו ומראה הילדים האכלים את פתבג המלך וכאשר תראה עשה עם עבדיך
    kjvRefs:
    - Daniel 1:13
    kjvOsis:
    - Dan.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.14
    scripture: tanakh
    name: Tanakh Daniel 1:14
    ref: Daniel 1:14
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 20413
    text: So he hearkened unto them in this matter, and tried them ten days.
    translation: JPS 1917
    original: וַיִּשְׁמַע לָהֶם לַדָּבָר הַזֶּה וַיְנַסֵּם יָמִים עֲשָׂרָה׃
    hebrewPlain: וישמע להם לדבר הזה וינסם ימים עשרה
    kjvRefs:
    - Daniel 1:14
    kjvOsis:
    - Dan.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.15
    scripture: tanakh
    name: Tanakh Daniel 1:15
    ref: Daniel 1:15
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 20414
    text: And at the end of ten days their countenances appeared fairer, and they were fatter in flesh, than all the youths that did eat of the king’s food.
    translation: JPS 1917
    original: וּמִקְצָת יָמִים עֲשָׂרָה נִרְאָה מַרְאֵיהֶם טוֹב וּבְרִיאֵי בָּשָׂר מִן־כָּל־הַיְלָדִים הָאֹכְלִים אֵת פַּתְבַּג הַמֶּלֶךְ׃
    hebrewPlain: ומקצת ימים עשרה נראה מראיהם טוב ובריאי בשר מן כל הילדים האכלים את פתבג המלך
    kjvRefs:
    - Daniel 1:15
    kjvOsis:
    - Dan.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.16
    scripture: tanakh
    name: Tanakh Daniel 1:16
    ref: Daniel 1:16
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 20415
    text: So the steward took away their food, and the wine that they should drink, and gave them pulse.
    translation: JPS 1917
    original: וַיְהִי הַמֶּלְצַר נֹשֵׂא אֶת־פַּתְבָּגָם וְיֵין מִשְׁתֵּיהֶם וְנֹתֵן לָהֶם זֵרְעֹנִים׃
    hebrewPlain: ויהי המלצר נשא את פתבגם ויין משתיהם ונתן להם זרענים
    kjvRefs:
    - Daniel 1:16
    kjvOsis:
    - Dan.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.17
    scripture: tanakh
    name: Tanakh Daniel 1:17
    ref: Daniel 1:17
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 20416
    text: Now as for these four youths, God gave them knowledge and skill in all learning and wisdom; and Daniel had understanding in all visions and dreams.
    translation: JPS 1917
    original: וְהַיְלָדִים הָאֵלֶּה אַרְבַּעְתָּם נָתַן לָהֶם הָאֱלֹהִים מַדָּע וְהַשְׂכֵּל בְּכָל־סֵפֶר וְחָכְמָה וְדָנִיֵּאל הֵבִין בְּכָל־חָזוֹן וַחֲלֹמוֹת׃
    hebrewPlain: והילדים האלה ארבעתם נתן להם האלהים מדע והשכל בכל ספר וחכמה ודניאל הבין בכל חזון וחלמות
    kjvRefs:
    - Daniel 1:17
    kjvOsis:
    - Dan.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.18
    scripture: tanakh
    name: Tanakh Daniel 1:18
    ref: Daniel 1:18
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 20417
    text: And at the end of the days which the king had appointed for bringing them in, the chief of the officers brought them in before Nebuchadnezzar.
    translation: JPS 1917
    original: וּלְמִקְצָת הַיָּמִים אֲשֶׁר־אָמַר הַמֶּלֶךְ לַהֲבִיאָם וַיְבִיאֵם שַׂר הַסָּרִיסִים לִפְנֵי נְבֻכַדְנֶצַּר׃
    hebrewPlain: ולמקצת הימים אשר אמר המלך להביאם ויביאם שר הסריסים לפני נבכדנצר
    kjvRefs:
    - Daniel 1:18
    kjvOsis:
    - Dan.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.19
    scripture: tanakh
    name: Tanakh Daniel 1:19
    ref: Daniel 1:19
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 19
    ordinal: 20418
    text: And the king spoke with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah; therefore stood they before the king.
    translation: JPS 1917
    original: וַיְדַבֵּר אִתָּם הַמֶּלֶךְ וְלֹא נִמְצָא מִכֻּלָּם כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: וידבר אתם המלך ולא נמצא מכלם כדניאל חנניה מישאל ועזריה ויעמדו לפני המלך
    kjvRefs:
    - Daniel 1:19
    kjvOsis:
    - Dan.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.20
    scripture: tanakh
    name: Tanakh Daniel 1:20
    ref: Daniel 1:20
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 20419
    text: And in all matters of wisdom and understanding, that the king inquired of them, he found them ten times better than all the magicians and enchanters that were in all his realm.
    translation: JPS 1917
    original: וְכֹל דְּבַר חָכְמַת בִּינָה אֲשֶׁר־בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ וַיִּמְצָאֵם עֶשֶׂר יָדוֹת עַל כָּל־הַחַרְטֻמִּים הָאַשָּׁפִים אֲשֶׁר בְּכָל־מַלְכוּתוֹ׃
    hebrewPlain: וכל דבר חכמת בינה אשר בקש מהם המלך וימצאם עשר ידות על כל החרטמים האשפים אשר בכל מלכותו
    kjvRefs:
    - Daniel 1:20
    kjvOsis:
    - Dan.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.1.21
    scripture: tanakh
    name: Tanakh Daniel 1:21
    ref: Daniel 1:21
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 20420
    text: And Daniel continued even unto the first year of king Cyrus.
    translation: JPS 1917
    original: וַיְהִי דָּנִיֵּאל עַד־שְׁנַת אַחַת לְכוֹרֶשׁ הַמֶּלֶךְ׃
    hebrewPlain: ויהי דניאל עד שנת אחת לכורש המלך
    kjvRefs:
    - Daniel 1:21
    kjvOsis:
    - Dan.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.1
- type: TanakhVerse
  data:
    osis: Dan.2.1
    scripture: tanakh
    name: Tanakh Daniel 2:1
    ref: Daniel 2:1
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 20421
    text: And in the second year of the reign of Nebuchadnezzar, Nebuchadnezzar dreamed dreams; and his spirit was troubled, and his sleep broke from him.
    translation: JPS 1917
    original: וּבִשְׁנַת שְׁתַּיִם לְמַלְכוּת נְבֻכַדְנֶצַּר חָלַם נְבֻכַדְנֶצַּר חֲלֹמוֹת וַתִּתְפָּעֶם רוּחוֹ וּשְׁנָתוֹ נִהְיְתָה עָלָיו׃
    hebrewPlain: ובשנת שתים למלכות נבכדנצר חלם נבכדנצר חלמות ותתפעם רוחו ושנתו נהיתה עליו
    kjvRefs:
    - Daniel 2:1
    kjvOsis:
    - Dan.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.2
    scripture: tanakh
    name: Tanakh Daniel 2:2
    ref: Daniel 2:2
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 20422
    text: Then the king commanded to call the magicians, and the enchanters, and the sorcerers, and the Chaldeans, to tell the king his dreams. So they came and stood before the king.
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לִקְרֹא לַחַרְטֻמִּים וְלָאַשָּׁפִים וְלַמְכַשְּׁפִים וְלַכַּשְׂדִּים לְהַגִּיד לַמֶּלֶךְ חֲלֹמֹתָיו וַיָּבֹאוּ וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויאמר המלך לקרא לחרטמים ולאשפים ולמכשפים ולכשדים להגיד למלך חלמתיו ויבאו ויעמדו לפני המלך
    kjvRefs:
    - Daniel 2:2
    kjvOsis:
    - Dan.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.3
    scripture: tanakh
    name: Tanakh Daniel 2:3
    ref: Daniel 2:3
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 20423
    text: 'And the king said unto them: ‘I have dreamed a dream, and my spirit is troubled to know the dream.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהֶם הַמֶּלֶךְ חֲלוֹם חָלָמְתִּי וַתִּפָּעֶם רוּחִי לָדַעַת אֶת־הַחֲלוֹם׃
    hebrewPlain: ויאמר להם המלך חלום חלמתי ותפעם רוחי לדעת את החלום
    kjvRefs:
    - Daniel 2:3
    kjvOsis:
    - Dan.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.4
    scripture: tanakh
    name: Tanakh Daniel 2:4
    ref: Daniel 2:4
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 20424
    text: 'Then spoke the Chaldeans to the king in Aramaic: ‘O king, live for ever! tell thy servants the dream, and we will declare the interpretation.’'
    translation: JPS 1917
    original: וַיְדַבְּרוּ הַכַּשְׂדִּים לַמֶּלֶךְ אֲרָמִית מַלְכָּא לְעָלְמִין חֱיִי אֱמַר חֶלְמָא לעבדיך [לְעַבְדָךְ] וּפִשְׁרָא נְחַוֵּא׃
    hebrewPlain: וידברו הכשדים למלך ארמית מלכא לעלמין חיי אמר חלמא לעבדיך [לעבדך] ופשרא נחוא
    kjvRefs:
    - Daniel 2:4
    kjvOsis:
    - Dan.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.5
    scripture: tanakh
    name: Tanakh Daniel 2:5
    ref: Daniel 2:5
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 20425
    text: 'The king answered and said to the Chaldeans: ‘The thing is certain with me; if ye make not known unto me the dream and the interpretation thereof, ye shall be cut in pieces, and your houses shall be made a dunghill.'
    translation: JPS 1917
    original: עָנֵה מַלְכָּא וְאָמַר לכשדיא [לְכַשְׂדָּאֵי] מִלְּתָא מִנִּי אַזְדָּא הֵן לָא תְהוֹדְעוּנַּנִי חֶלְמָא וּפִשְׁרֵהּ הַדָּמִין תִּתְעַבְדוּן וּבָתֵּיכוֹן נְוָלִי יִתְּשָׂמוּן׃
    hebrewPlain: ענה מלכא ואמר לכשדיא [לכשדאי] מלתא מני אזדא הן לא תהודעונני חלמא ופשרה הדמין תתעבדון ובתיכון נולי יתשמון
    kjvRefs:
    - Daniel 2:5
    kjvOsis:
    - Dan.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.6
    scripture: tanakh
    name: Tanakh Daniel 2:6
    ref: Daniel 2:6
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 20426
    text: But if ye declare the dream and the interpretation thereof, ye shall receive of me gifts and rewards and great honour; only declare unto me the dream and the interpretation thereof.’
    translation: JPS 1917
    original: וְהֵן חֶלְמָא וּפִשְׁרֵהּ תְּהַחֲוֺן מַתְּנָן וּנְבִזְבָּה וִיקָר שַׂגִּיא תְּקַבְּלוּן מִן־קֳדָמָי לָהֵן חֶלְמָא וּפִשְׁרֵהּ הַחֲוֺנִי׃
    hebrewPlain: והן חלמא ופשרה תהחון מתנן ונבזבה ויקר שגיא תקבלון מן קדמי להן חלמא ופשרה החוני
    kjvRefs:
    - Daniel 2:6
    kjvOsis:
    - Dan.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.7
    scripture: tanakh
    name: Tanakh Daniel 2:7
    ref: Daniel 2:7
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 20427
    text: 'They answered the second time and said: ‘Let the king tell his servants the dream, and we will declare the interpretation.’'
    translation: JPS 1917
    original: עֲנוֹ תִנְיָנוּת וְאָמְרִין מַלְכָּא חֶלְמָא יֵאמַר לְעַבְדוֹהִי וּפִשְׁרָה נְהַחֲוֵה׃
    hebrewPlain: ענו תנינות ואמרין מלכא חלמא יאמר לעבדוהי ופשרה נהחוה
    kjvRefs:
    - Daniel 2:7
    kjvOsis:
    - Dan.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.8
    scripture: tanakh
    name: Tanakh Daniel 2:8
    ref: Daniel 2:8
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 20428
    text: 'The king answered and said: ‘I know of a truth that ye would gain time, inasmuch as ye see the thing is certain with me,'
    translation: JPS 1917
    original: עָנֵה מַלְכָּא וְאָמַר מִן־יַצִּיב יָדַע אֲנָה דִּי עִדָּנָא אַנְתּוּן זָבְנִין כָּל־קֳבֵל דִּי חֲזֵיתוֹן דִּי אַזְדָּא מִנִּי מִלְּתָא׃
    hebrewPlain: ענה מלכא ואמר מן יציב ידע אנה די עדנא אנתון זבנין כל קבל די חזיתון די אזדא מני מלתא
    kjvRefs:
    - Daniel 2:8
    kjvOsis:
    - Dan.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.9
    scripture: tanakh
    name: Tanakh Daniel 2:9
    ref: Daniel 2:9
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 20429
    text: that, if ye make not known unto me the dream, there is but one law for you; and ye have agreed together to speak before me lying and corrupt words, till the time be changed; only tell me the dream, and I shall know that ye can declare unto me the interpretation thereof.’
    translation: JPS 1917
    original: דִּי הֵן־חֶלְמָא לָא תְהוֹדְעֻנַּנִי חֲדָה־הִיא דָתְכוֹן וּמִלָּה כִדְבָה וּשְׁחִיתָה הזמנתון [הִזְדְּמִנְתּוּן] לְמֵאמַר קָדָמַי עַד דִּי עִדָּנָא יִשְׁתַּנֵּא לָהֵן חֶלְמָא אֱמַרוּ לִי וְאִנְדַּע דִּי פִשְׁרֵהּ תְּהַחֲוֻנַּנִי׃
    hebrewPlain: די הן חלמא לא תהודענני חדה היא דתכון ומלה כדבה ושחיתה הזמנתון [הזדמנתון] למאמר קדמי עד די עדנא ישתנא להן חלמא אמרו לי ואנדע די פשרה תהחונני
    kjvRefs:
    - Daniel 2:9
    kjvOsis:
    - Dan.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.10
    scripture: tanakh
    name: Tanakh Daniel 2:10
    ref: Daniel 2:10
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 20430
    text: 'The Chaldeans answered before the king, and said: ‘There is not a man upon the earth that can declare the king’s matter; forasmuch as no great and powerful king hath asked such a thing of any magician, or enchanter, or Chaldean.'
    translation: JPS 1917
    original: עֲנוֹ כשדיא [כַשְׂדָּאֵי] קֳדָם־מַלְכָּא וְאָמְרִין לָא־אִיתַי אֲנָשׁ עַל־יַבֶּשְׁתָּא דִּי מִלַּת מַלְכָּא יוּכַל לְהַחֲוָיָה כָּל־קֳבֵל דִּי כָּל־מֶלֶךְ רַב וְשַׁלִּיט מִלָּה כִדְנָה לָא שְׁאֵל לְכָל־חַרְטֹּם וְאָשַׁף וְכַשְׂדָּי׃
    hebrewPlain: ענו כשדיא [כשדאי] קדם מלכא ואמרין לא איתי אנש על יבשתא די מלת מלכא יוכל להחויה כל קבל די כל מלך רב ושליט מלה כדנה לא שאל לכל חרטם ואשף וכשדי
    kjvRefs:
    - Daniel 2:10
    kjvOsis:
    - Dan.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.11
    scripture: tanakh
    name: Tanakh Daniel 2:11
    ref: Daniel 2:11
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 20431
    text: And it is a hard thing that the king asketh, and there is none other that can declare it before the king, except the gods, whose dwelling is not with flesh.’
    translation: JPS 1917
    original: וּמִלְּתָא דִי־מַלְכָּה שָׁאֵל יַקִּירָה וְאָחֳרָן לָא אִיתַי דִּי יְחַוִּנַּהּ קֳדָם מַלְכָּא לָהֵן אֱלָהִין דִּי מְדָרְהוֹן עִם־בִּשְׂרָא לָא אִיתוֹהִי׃
    hebrewPlain: ומלתא די מלכה שאל יקירה ואחרן לא איתי די יחונה קדם מלכא להן אלהין די מדרהון עם בשרא לא איתוהי
    kjvRefs:
    - Daniel 2:11
    kjvOsis:
    - Dan.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.12
    scripture: tanakh
    name: Tanakh Daniel 2:12
    ref: Daniel 2:12
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 20432
    text: For this cause the king was angry and very furious, and commanded to destroy all the wise men of Babylon.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה מַלְכָּא בְּנַס וּקְצַף שַׂגִּיא וַאֲמַר לְהוֹבָדָה לְכֹל חַכִּימֵי בָבֶל׃
    hebrewPlain: כל קבל דנה מלכא בנס וקצף שגיא ואמר להובדה לכל חכימי בבל
    kjvRefs:
    - Daniel 2:12
    kjvOsis:
    - Dan.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.13
    scripture: tanakh
    name: Tanakh Daniel 2:13
    ref: Daniel 2:13
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 20433
    text: So the decree went forth, and the wise men were to be slain; and they sought Daniel and his companions to be slain.
    translation: JPS 1917
    original: וְדָתָא נֶפְקַת וְחַכִּימַיָּא מִתְקַטְּלִין וּבְעוֹ דָּנִיֵּאל וְחַבְרוֹהִי לְהִתְקְטָלָה׃
    hebrewPlain: ודתא נפקת וחכימיא מתקטלין ובעו דניאל וחברוהי להתקטלה
    kjvRefs:
    - Daniel 2:13
    kjvOsis:
    - Dan.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.14
    scripture: tanakh
    name: Tanakh Daniel 2:14
    ref: Daniel 2:14
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 20434
    text: Then Daniel returned answer with counsel and discretion to Arioch the captain of the king’s guard, who was gone forth to slay the wise men of Babylon;
    translation: JPS 1917
    original: בֵּאדַיִן דָּנִיֵּאל הֲתִיב עֵטָא וּטְעֵם לְאַרְיוֹךְ רַב־טַבָּחַיָּא דִּי מַלְכָּא דִּי נְפַק לְקַטָּלָה לְחַכִּימֵי בָּבֶל׃
    hebrewPlain: באדין דניאל התיב עטא וטעם לאריוך רב טבחיא די מלכא די נפק לקטלה לחכימי בבל
    kjvRefs:
    - Daniel 2:14
    kjvOsis:
    - Dan.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.15
    scripture: tanakh
    name: Tanakh Daniel 2:15
    ref: Daniel 2:15
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 20435
    text: 'he answered and said to Arioch the king’s captain: ‘Wherefore is the decree so peremptory from the king?’ Then Arioch made the thing known to Daniel.'
    translation: JPS 1917
    original: עָנֵה וְאָמַר לְאַרְיוֹךְ שַׁלִּיטָא דִי־מַלְכָּא עַל־מָה דָתָא מְהַחְצְפָה מִן־קֳדָם מַלְכָּא אֱדַיִן מִלְּתָא הוֹדַע אַרְיוֹךְ לְדָנִיֵּאל׃
    hebrewPlain: ענה ואמר לאריוך שליטא די מלכא על מה דתא מהחצפה מן קדם מלכא אדין מלתא הודע אריוך לדניאל
    kjvRefs:
    - Daniel 2:15
    kjvOsis:
    - Dan.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.16
    scripture: tanakh
    name: Tanakh Daniel 2:16
    ref: Daniel 2:16
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 20436
    text: Then Daniel went in, and desired of the king that he would give him time, that he might declare unto the king the interpretation.
    translation: JPS 1917
    original: וְדָנִיֵּאל עַל וּבְעָה מִן־מַלְכָּא דִּי זְמָן יִנְתֵּן־לֵהּ וּפִשְׁרָא לְהַחֲוָיָה לְמַלְכָּא׃
    hebrewPlain: ודניאל על ובעה מן מלכא די זמן ינתן לה ופשרא להחויה למלכא
    kjvRefs:
    - Daniel 2:16
    kjvOsis:
    - Dan.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.17
    scripture: tanakh
    name: Tanakh Daniel 2:17
    ref: Daniel 2:17
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 20437
    text: Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions;
    translation: JPS 1917
    original: אֱדַיִן דָּנִיֵּאל לְבַיְתֵהּ אֲזַל וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה חַבְרוֹהִי מִלְּתָא הוֹדַע׃
    hebrewPlain: אדין דניאל לביתה אזל ולחנניה מישאל ועזריה חברוהי מלתא הודע
    kjvRefs:
    - Daniel 2:17
    kjvOsis:
    - Dan.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.18
    scripture: tanakh
    name: Tanakh Daniel 2:18
    ref: Daniel 2:18
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 20438
    text: that they might ask mercy of the God of heaven concerning this secret; that Daniel and his companions should not perish with the rest of the wise men of Babylon.
    translation: JPS 1917
    original: וְרַחֲמִין לְמִבְעֵא מִן־קֳדָם אֱלָהּ שְׁמַיָּא עַל־רָזָה דְּנָה דִּי לָא יְהֹבְדוּן דָּנִיֵּאל וְחַבְרוֹהִי עִם־שְׁאָר חַכִּימֵי בָבֶל׃
    hebrewPlain: ורחמין למבעא מן קדם אלה שמיא על רזה דנה די לא יהבדון דניאל וחברוהי עם שאר חכימי בבל
    kjvRefs:
    - Daniel 2:18
    kjvOsis:
    - Dan.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.19
    scripture: tanakh
    name: Tanakh Daniel 2:19
    ref: Daniel 2:19
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 20439
    text: Then was the secret revealed unto Daniel in a vision of the night. Then Daniel blessed the God of heaven.
    translation: JPS 1917
    original: אֱדַיִן לְדָנִיֵּאל בְּחֶזְוָא דִי־לֵילְיָא רָזָה גֲלִי אֱדַיִן דָּנִיֵּאל בָּרִךְ לֶאֱלָהּ שְׁמַיָּא׃
    hebrewPlain: אדין לדניאל בחזוא די ליליא רזה גלי אדין דניאל ברך לאלה שמיא
    kjvRefs:
    - Daniel 2:19
    kjvOsis:
    - Dan.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.20
    scripture: tanakh
    name: Tanakh Daniel 2:20
    ref: Daniel 2:20
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 20440
    text: 'Daniel spoke and said: Blessed be the name of God From everlasting even unto everlasting; For wisdom and might are His;'
    translation: JPS 1917
    original: עָנֵה דָנִיֵּאל וְאָמַר לֶהֱוֵא שְׁמֵהּ דִּי־אֱלָהָא מְבָרַךְ מִן־עָלְמָא וְעַד־עָלְמָא דִּי חָכְמְתָא וּגְבוּרְתָא דִּי לֵהּ־הִיא׃
    hebrewPlain: ענה דניאל ואמר להוא שמה די אלהא מברך מן עלמא ועד עלמא די חכמתא וגבורתא די לה היא
    kjvRefs:
    - Daniel 2:20
    kjvOsis:
    - Dan.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.21
    scripture: tanakh
    name: Tanakh Daniel 2:21
    ref: Daniel 2:21
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 20441
    text: And He changeth the times and the seasons; He removeth kings, and setteth up kings; He giveth wisdom unto the wise, And knowledge to them that know understanding;
    translation: JPS 1917
    original: וְהוּא מְהַשְׁנֵא עִדָּנַיָּא וְזִמְנַיָּא מְהַעְדֵּה מַלְכִין וּמְהָקֵים מַלְכִין יָהֵב חָכְמְתָא לְחַכִּימִין וּמַנְדְּעָא לְיָדְעֵי בִינָה׃
    hebrewPlain: והוא מהשנא עדניא וזמניא מהעדה מלכין ומהקים מלכין יהב חכמתא לחכימין ומנדעא לידעי בינה
    kjvRefs:
    - Daniel 2:21
    kjvOsis:
    - Dan.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.22
    scripture: tanakh
    name: Tanakh Daniel 2:22
    ref: Daniel 2:22
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 20442
    text: He revealeth the deep and secret things; He knoweth what is in the darkness, And the light dwelleth with Him.
    translation: JPS 1917
    original: הוּא גָּלֵא עַמִּיקָתָא וּמְסַתְּרָתָא יָדַע מָה בַחֲשׁוֹכָא ונהירא [וּנְהוֹרָא] עִמֵּהּ שְׁרֵא׃
    hebrewPlain: הוא גלא עמיקתא ומסתרתא ידע מה בחשוכא ונהירא [ונהורא] עמה שרא
    kjvRefs:
    - Daniel 2:22
    kjvOsis:
    - Dan.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.23
    scripture: tanakh
    name: Tanakh Daniel 2:23
    ref: Daniel 2:23
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 23
    ordinal: 20443
    text: I thank Thee, and praise Thee, O Thou God of my fathers, w Who hast given me wisdom and might, And hast now made known unto me what we desired of Thee; For Thou hast made known unto us the king’s matter.
    translation: JPS 1917
    original: לָךְ אֱלָהּ אֲבָהָתִי מְהוֹדֵא וּמְשַׁבַּח אֲנָה דִּי חָכְמְתָא וּגְבוּרְתָא יְהַבְתְּ לִי וּכְעַן הוֹדַעְתַּנִי דִּי־בְעֵינָא מִנָּךְ דִּי־מִלַּת מַלְכָּא הוֹדַעְתֶּנָא׃
    hebrewPlain: לך אלה אבהתי מהודא ומשבח אנה די חכמתא וגבורתא יהבת לי וכען הודעתני די בעינא מנך די מלת מלכא הודעתנא
    kjvRefs:
    - Daniel 2:23
    kjvOsis:
    - Dan.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.24
    scripture: tanakh
    name: Tanakh Daniel 2:24
    ref: Daniel 2:24
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 24
    ordinal: 20444
    text: 'Therefore Daniel went in unto Arioch, whom the king had appointed to destroy the wise men of Babylon; he went and said thus unto him: ‘Destroy not the wise men of Babylon; bring me in before the king, and I will declare unto the king the interpretation.’'
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה דָּנִיֵּאל עַל עַל־אַרְיוֹךְ דִּי מַנִּי מַלְכָּא לְהוֹבָדָה לְחַכִּימֵי בָבֶל אֲזַל וְכֵן אֲמַר־לֵהּ לְחַכִּימֵי בָבֶל אַל־תְּהוֹבֵד הַעֵלְנִי קֳדָם מַלְכָּא וּפִשְׁרָא לְמַלְכָּא אֲחַוֵּא׃
    hebrewPlain: כל קבל דנה דניאל על על אריוך די מני מלכא להובדה לחכימי בבל אזל וכן אמר לה לחכימי בבל אל תהובד העלני קדם מלכא ופשרא למלכא אחוא
    kjvRefs:
    - Daniel 2:24
    kjvOsis:
    - Dan.2.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.25
    scripture: tanakh
    name: Tanakh Daniel 2:25
    ref: Daniel 2:25
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 25
    ordinal: 20445
    text: 'Then Arioch brought in Daniel before the king in haste, and said thus unto him: ‘I have found a man of the children of the captivity of Judah, that will make known unto the king the interpretation.’'
    translation: JPS 1917
    original: אֱדַיִן אַרְיוֹךְ בְּהִתְבְּהָלָה הַנְעֵל לְדָנִיֵּאל קֳדָם מַלְכָּא וְכֵן אֲמַר־לֵהּ דִּי־הַשְׁכַּחַת גְּבַר מִן־בְּנֵי גָלוּתָא דִּי יְהוּד דִּי פִשְׁרָא לְמַלְכָּא יְהוֹדַע׃
    hebrewPlain: אדין אריוך בהתבהלה הנעל לדניאל קדם מלכא וכן אמר לה די השכחת גבר מן בני גלותא די יהוד די פשרא למלכא יהודע
    kjvRefs:
    - Daniel 2:25
    kjvOsis:
    - Dan.2.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.26
    scripture: tanakh
    name: Tanakh Daniel 2:26
    ref: Daniel 2:26
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 26
    ordinal: 20446
    text: 'The king spoke and said to Daniel, whose name was Belteshazzar: ‘Art thou able to make known unto me the dream which I have seen, and the interpretation thereof?’'
    translation: JPS 1917
    original: עָנֵה מַלְכָּא וְאָמַר לְדָנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר האיתיך [הַאִיתָךְ] כָּהֵל לְהוֹדָעֻתַנִי חֶלְמָא דִי־חֲזֵית וּפִשְׁרֵהּ׃
    hebrewPlain: ענה מלכא ואמר לדניאל די שמה בלטשאצר האיתיך [האיתך] כהל להודעתני חלמא די חזית ופשרה
    kjvRefs:
    - Daniel 2:26
    kjvOsis:
    - Dan.2.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.27
    scripture: tanakh
    name: Tanakh Daniel 2:27
    ref: Daniel 2:27
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 27
    ordinal: 20447
    text: 'Daniel answered before the king, and said: ‘The secret which the king hath asked can neither wise men, enchanters, magicians, nor astrologers, declare unto the king;'
    translation: JPS 1917
    original: עָנֵה דָנִיֵּאל קֳדָם מַלְכָּא וְאָמַר רָזָה דִּי־מַלְכָּא שָׁאֵל לָא חַכִּימִין אָשְׁפִין חַרְטֻמִּין גָּזְרִין יָכְלִין לְהַחֲוָיָה לְמַלְכָּא׃
    hebrewPlain: ענה דניאל קדם מלכא ואמר רזה די מלכא שאל לא חכימין אשפין חרטמין גזרין יכלין להחויה למלכא
    kjvRefs:
    - Daniel 2:27
    kjvOsis:
    - Dan.2.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.28
    scripture: tanakh
    name: Tanakh Daniel 2:28
    ref: Daniel 2:28
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 28
    ordinal: 20448
    text: 'but there is a God in heaven that revealeth secrets, and He hath made known to the king Nebuchadnezzar what shall be in the end of days. Thy dream, and the visions of thy head upon thy bed, are these:'
    translation: JPS 1917
    original: בְּרַם אִיתַי אֱלָהּ בִּשְׁמַיָּא גָּלֵא רָזִין וְהוֹדַע לְמַלְכָּא נְבוּכַדְנֶצַּר מָה דִּי לֶהֱוֵא בְּאַחֲרִית יוֹמַיָּא חֶלְמָךְ וְחֶזְוֵי רֵאשָׁךְ עַל־מִשְׁכְּבָךְ דְּנָה הוּא׃
    hebrewPlain: ברם איתי אלה בשמיא גלא רזין והודע למלכא נבוכדנצר מה די להוא באחרית יומיא חלמך וחזוי ראשך על משכבך דנה הוא
    kjvRefs:
    - Daniel 2:28
    kjvOsis:
    - Dan.2.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.29
    scripture: tanakh
    name: Tanakh Daniel 2:29
    ref: Daniel 2:29
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 29
    ordinal: 20449
    text: as for thee, O king, thy thoughts came [into thy mind] upon thy bed, what should come to pass hereafter; and He that revealeth secrets hath made known to thee what shall come to pass.
    translation: JPS 1917
    original: אַנְתְּה מַלְכָּא רַעְיוֹנָךְ עַל־מִשְׁכְּבָךְ סְלִקוּ מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה וְגָלֵא רָזַיָּא הוֹדְעָךְ מָה־דִי לֶהֱוֵא׃
    hebrewPlain: אנתה מלכא רעיונך על משכבך סלקו מה די להוא אחרי דנה וגלא רזיא הודעך מה די להוא
    kjvRefs:
    - Daniel 2:29
    kjvOsis:
    - Dan.2.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.30
    scripture: tanakh
    name: Tanakh Daniel 2:30
    ref: Daniel 2:30
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 30
    ordinal: 20450
    text: But as for me, this secret is not revealed to me for any wisdom that I have more than any living, but to the intent that the interpretation may be made known to the king, and that thou mayest know the thoughts of thy heart.
    translation: JPS 1917
    original: וַאֲנָה לָא בְחָכְמָה דִּי־אִיתַי בִּי מִן־כָּל־חַיַּיָּא רָזָא דְנָה גֱּלִי לִי לָהֵן עַל־דִּבְרַת דִּי פִשְׁרָא לְמַלְכָּא יְהוֹדְעוּן וְרַעְיוֹנֵי לִבְבָךְ תִּנְדַּע׃
    hebrewPlain: ואנה לא בחכמה די איתי בי מן כל חייא רזא דנה גלי לי להן על דברת די פשרא למלכא יהודעון ורעיוני לבבך תנדע
    kjvRefs:
    - Daniel 2:30
    kjvOsis:
    - Dan.2.30
  relations:
  - predicate: IN
    to:
