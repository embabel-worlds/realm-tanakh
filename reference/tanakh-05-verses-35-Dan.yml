    ordinal: 20520
    text: whose leaves were fair, and the fruit thereof much, and in it was food for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation;
    translation: JPS 1917
    original: וְעָפְיֵהּ שַׁפִּיר וְאִנְבֵּהּ שַׂגִּיא וּמָזוֹן לְכֹלָּא־בֵהּ תְּחֹתוֹהִי תְּדוּר חֵיוַת בָּרָא וּבְעַנְפוֹהִי יִשְׁכְּנָן צִפֲּרֵי שְׁמַיָּא׃
    hebrewPlain: ועפיה שפיר ואנבה שגיא ומזון לכלא בה תחתוהי תדור חיות ברא ובענפוהי ישכנן צפרי שמיא
