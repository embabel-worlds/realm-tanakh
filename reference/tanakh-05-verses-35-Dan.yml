- type: TanakhVerse
  data:
    osis: Dan.3.12
    scripture: tanakh
    name: Tanakh Daniel 3:12
    ref: Daniel 3:12
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 20481
    text: 'There are certain Jews whom thou hast appointed over the affairs of the province of Babylon, Shadrach, Meshach, and Abed-nego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up.’'
    translation: JPS 1917
    original: אִיתַי גֻּבְרִין יְהוּדָאיִן דִּי־מַנִּיתָ יָתְהוֹן עַל־עֲבִידַת מְדִינַת בָּבֶל שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ גֻּבְרַיָּא אִלֵּךְ לָא־שָׂמוּ עליך [עֲלָךְ] מַלְכָּא טְעֵם לאלהיך [לֵאלָהָךְ] לָא פָלְחִין וּלְצֶלֶם דַּהֲבָא דִּי הֲקֵימְתָּ לָא סָגְדִין׃
    hebrewPlain: איתי גברין יהודאין די מנית יתהון על עבידת מדינת בבל שדרך מישך ועבד נגו גבריא אלך לא שמו עליך [עלך] מלכא טעם לאלהיך [לאלהך] לא פלחין ולצלם דהבא די הקימת לא סגדין
    kjvRefs:
    - Daniel 3:12
    kjvOsis:
    - Dan.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.13
    scripture: tanakh
    name: Tanakh Daniel 3:13
    ref: Daniel 3:13
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 20482
    text: Then Nebuchadnezzar in his rage and fury commanded to bring Shadrach, Meshach, and Abed-nego. Then were these men brought before the king.
    translation: JPS 1917
    original: בֵּאדַיִן נְבוּכַדְנֶצַּר בִּרְגַז וַחֲמָה אֲמַר לְהַיְתָיָה לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ בֵּאדַיִן גֻּבְרַיָּא אִלֵּךְ הֵיתָיוּ קֳדָם מַלְכָּא׃
    hebrewPlain: באדין נבוכדנצר ברגז וחמה אמר להיתיה לשדרך מישך ועבד נגו באדין גבריא אלך היתיו קדם מלכא
    kjvRefs:
    - Daniel 3:13
    kjvOsis:
    - Dan.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.14
    scripture: tanakh
    name: Tanakh Daniel 3:14
    ref: Daniel 3:14
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 20483
    text: 'Nebuchadnezzar spoke and said unto them: ‘Is it true, O Shadrach, Meshach, and Abed-nego, that ye serve not my gods, nor worship the golden image which I have set up?'
    translation: JPS 1917
    original: עָנֵה נְבֻכַדְנֶצַּר וְאָמַר לְהוֹן הַצְדָּא שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ לֵאלָהַי לָא אִיתֵיכוֹן פָּלְחִין וּלְצֶלֶם דַּהֲבָא דִּי הֲקֵימֶת לָא סָגְדִין׃
    hebrewPlain: ענה נבכדנצר ואמר להון הצדא שדרך מישך ועבד נגו לאלהי לא איתיכון פלחין ולצלם דהבא די הקימת לא סגדין
    kjvRefs:
    - Daniel 3:14
    kjvOsis:
    - Dan.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.15
    scripture: tanakh
    name: Tanakh Daniel 3:15
    ref: Daniel 3:15
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 20484
    text: Now if ye be ready that at what time ye hear the sound of the horn, pipe, harp, trigon, psaltery, and bagpipe, and all kinds of music, ye fall down and worship the image which I have made , well; but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who is the god that shall deliver you out of my hands?’
    translation: JPS 1917
    original: כְּעַן הֵן אִיתֵיכוֹן עֲתִידִין דִּי בְעִדָּנָא דִּי־תִשְׁמְעוּן קָל קַרְנָא מַשְׁרוֹקִיתָא קיתרס [קַתְרוֹס] שַׂבְּכָא פְּסַנְתֵּרִין וְסוּמְפֹּנְיָה וְכֹל זְנֵי זְמָרָא תִּפְּלוּן וְתִסְגְּדוּן לְצַלְמָא דִי־עַבְדֵת וְהֵן לָא תִסְגְּדוּן בַּהּ־שַׁעֲתָה תִתְרְמוֹן לְגוֹא־אַתּוּן נוּרָא יָקִדְתָּא וּמַן־הוּא אֱלָהּ דֵּי יְשֵׁיזְבִנְכוֹן מִן־יְדָי׃
    hebrewPlain: כען הן איתיכון עתידין די בעדנא די תשמעון קל קרנא משרוקיתא קיתרס [קתרוס] שבכא פסנתרין וסומפניה וכל זני זמרא תפלון ותסגדון לצלמא די עבדת והן לא תסגדון בה שעתה תתרמון לגוא אתון נורא יקדתא ומן הוא אלה די ישיזבנכון מן ידי
    kjvRefs:
    - Daniel 3:15
    kjvOsis:
    - Dan.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.16
    scripture: tanakh
    name: Tanakh Daniel 3:16
    ref: Daniel 3:16
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 16
    ordinal: 20485
    text: 'Shadrach, Meshach, and Abed-nego, answered and said to the king: ‘O Nebuchadnezzar, we have no need to answer thee in this matter.'
    translation: JPS 1917
    original: עֲנוֹ שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ וְאָמְרִין לְמַלְכָּא נְבוּכַדְנֶצַּר לָא־חַשְׁחִין אֲנַחְנָה עַל־דְּנָה פִּתְגָם לַהֲתָבוּתָךְ׃
    hebrewPlain: ענו שדרך מישך ועבד נגו ואמרין למלכא נבוכדנצר לא חשחין אנחנה על דנה פתגם להתבותך
    kjvRefs:
    - Daniel 3:16
    kjvOsis:
    - Dan.3.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.17
    scripture: tanakh
    name: Tanakh Daniel 3:17
    ref: Daniel 3:17
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 17
    ordinal: 20486
    text: If our God whom we serve is able to deliver us, He will deliver us from the burning fiery furnace, and out of thy hand, O king.
    translation: JPS 1917
    original: הֵן אִיתַי אֱלָהַנָא דִּי־אֲנַחְנָא פָלְחִין יָכִל לְשֵׁיזָבוּתַנָא מִן־אַתּוּן נוּרָא יָקִדְתָּא וּמִן־יְדָךְ מַלְכָּא יְשֵׁיזִב׃
    hebrewPlain: הן איתי אלהנא די אנחנא פלחין יכל לשיזבותנא מן אתון נורא יקדתא ומן ידך מלכא ישיזב
    kjvRefs:
    - Daniel 3:17
    kjvOsis:
    - Dan.3.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.18
    scripture: tanakh
    name: Tanakh Daniel 3:18
    ref: Daniel 3:18
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 18
    ordinal: 20487
    text: But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.’
    translation: JPS 1917
    original: וְהֵן לָא יְדִיעַ לֶהֱוֵא־לָךְ מַלְכָּא דִּי לאלהיך [לֵאלָהָךְ] לָא־איתינא [אִיתַנָא] פָלְחִין וּלְצֶלֶם דַּהֲבָא דִּי הֲקֵימְתָּ לָא נִסְגֻּד׃
    hebrewPlain: והן לא ידיע להוא לך מלכא די לאלהיך [לאלהך] לא איתינא [איתנא] פלחין ולצלם דהבא די הקימת לא נסגד
    kjvRefs:
    - Daniel 3:18
    kjvOsis:
    - Dan.3.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.19
    scripture: tanakh
    name: Tanakh Daniel 3:19
    ref: Daniel 3:19
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 19
    ordinal: 20488
    text: Then was Nebuchadnezzar filled with fury, and the form of his visage was changed, against Shadrach, Meshach, and Abed-nego; he spoke, and commanded that they should heat the furnace seven times more than it was wont to be heated.
    translation: JPS 1917
    original: בֵּאדַיִן נְבוּכַדְנֶצַּר הִתְמְלִי חֱמָא וּצְלֵם אַנְפּוֹהִי אשתנו [אֶשְׁתַּנִּי] עַל־שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ עָנֵה וְאָמַר לְמֵזֵא לְאַתּוּנָא חַד־שִׁבְעָה עַל דִּי חֲזֵה לְמֵזְיֵהּ׃
    hebrewPlain: באדין נבוכדנצר התמלי חמא וצלם אנפוהי אשתנו [אשתני] על שדרך מישך ועבד נגו ענה ואמר למזא לאתונא חד שבעה על די חזה למזיה
    kjvRefs:
    - Daniel 3:19
    kjvOsis:
    - Dan.3.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.20
    scripture: tanakh
    name: Tanakh Daniel 3:20
    ref: Daniel 3:20
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 20
    ordinal: 20489
    text: And he commanded certain mighty men that were in his army to bind Shadrach, Meshach, and Abed-nego, and to cast them into the burning fiery furnace.
    translation: JPS 1917
    original: וּלְגֻבְרִין גִּבָּרֵי־חַיִל דִּי בְחַיְלֵהּ אֲמַר לְכַפָּתָה לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ לְמִרְמֵא לְאַתּוּן נוּרָא יָקִדְתָּא׃
    hebrewPlain: ולגברין גברי חיל די בחילה אמר לכפתה לשדרך מישך ועבד נגו למרמא לאתון נורא יקדתא
    kjvRefs:
    - Daniel 3:20
    kjvOsis:
    - Dan.3.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.21
    scripture: tanakh
    name: Tanakh Daniel 3:21
    ref: Daniel 3:21
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 21
    ordinal: 20490
    text: Then these men were bound in their cloaks, their tunics, and their robes, and their other garments, and were cast into the midst of the burning fiery furnace.
    translation: JPS 1917
    original: בֵּאדַיִן גֻּבְרַיָּא אִלֵּךְ כְּפִתוּ בְּסַרְבָּלֵיהוֹן פטישיהון [פַּטְּשֵׁיהוֹן] וְכַרְבְּלָתְהוֹן וּלְבֻשֵׁיהוֹן וּרְמִיו לְגוֹא־אַתּוּן נוּרָא יָקִדְתָּא׃
    hebrewPlain: באדין גבריא אלך כפתו בסרבליהון פטישיהון [פטשיהון] וכרבלתהון ולבשיהון ורמיו לגוא אתון נורא יקדתא
    kjvRefs:
    - Daniel 3:21
    kjvOsis:
    - Dan.3.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.22
    scripture: tanakh
    name: Tanakh Daniel 3:22
    ref: Daniel 3:22
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 22
    ordinal: 20491
    text: Therefore because the king’s commandment was peremptory, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abed-nego.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה מִן־דִּי מִלַּת מַלְכָּא מַחְצְפָה וְאַתּוּנָא אֵזֵה יַתִּירָא גֻּבְרַיָּא אִלֵּךְ דִּי הַסִּקוּ לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ קַטִּל הִמּוֹן שְׁבִיבָא דִּי נוּרָא׃
    hebrewPlain: כל קבל דנה מן די מלת מלכא מחצפה ואתונא אזה יתירא גבריא אלך די הסקו לשדרך מישך ועבד נגו קטל המון שביבא די נורא
    kjvRefs:
    - Daniel 3:22
    kjvOsis:
    - Dan.3.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.23
    scripture: tanakh
    name: Tanakh Daniel 3:23
    ref: Daniel 3:23
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 23
    ordinal: 20492
    text: And these three men, Shadrach, Meshach, and Abed-nego, fell down bound into the midst of the burning fiery furnace.
    translation: JPS 1917
    original: וְגֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ נְפַלוּ לְגוֹא־אַתּוּן־נוּרָא יָקִדְתָּא מְכַפְּתִין׃
    hebrewPlain: וגבריא אלך תלתהון שדרך מישך ועבד נגו נפלו לגוא אתון נורא יקדתא מכפתין
    kjvRefs:
    - Daniel 3:23
    kjvOsis:
    - Dan.3.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.24
    scripture: tanakh
    name: Tanakh Daniel 3:24
    ref: Daniel 3:24
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 24
    ordinal: 20493
    text: 'Then Nebuchadnezzar the king was alarmed, and rose up in haste; he spoke and said unto his ministers: ‘Did not we cast three men bound into the midst of the fire?’ They answered and said unto the king: ‘True, O king.’'
    translation: JPS 1917
    original: אֱדַיִן נְבוּכַדְנֶצַּר מַלְכָּא תְּוַהּ וְקָם בְּהִתְבְּהָלָה עָנֵה וְאָמַר לְהַדָּבְרוֹהִי הֲלָא גֻבְרִין תְּלָתָא רְמֵינָא לְגוֹא־נוּרָא מְכַפְּתִין עָנַיִן וְאָמְרִין לְמַלְכָּא יַצִּיבָא מַלְכָּא׃
    hebrewPlain: אדין נבוכדנצר מלכא תוה וקם בהתבהלה ענה ואמר להדברוהי הלא גברין תלתא רמינא לגוא נורא מכפתין ענין ואמרין למלכא יציבא מלכא
    kjvRefs:
    - Daniel 3:24
    kjvOsis:
    - Dan.3.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.25
    scripture: tanakh
    name: Tanakh Daniel 3:25
    ref: Daniel 3:25
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 25
    ordinal: 20494
    text: 'He answered and said: ‘Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the appearance of the fourth is like a son of the gods.’'
    translation: JPS 1917
    original: עָנֵה וְאָמַר הָא־אֲנָה חָזֵה גֻּבְרִין אַרְבְּעָה שְׁרַיִן מַהְלְכִין בְּגוֹא־נוּרָא וַחֲבָל לָא־אִיתַי בְּהוֹן וְרֵוֵהּ דִּי רביעיא [רְבִיעָאָה] דָּמֵה לְבַר־אֱלָהִין׃
    hebrewPlain: ענה ואמר הא אנה חזה גברין ארבעה שרין מהלכין בגוא נורא וחבל לא איתי בהון ורוה די רביעיא [רביעאה] דמה לבר אלהין
    kjvRefs:
    - Daniel 3:25
    kjvOsis:
    - Dan.3.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.26
    scripture: tanakh
    name: Tanakh Daniel 3:26
    ref: Daniel 3:26
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 26
    ordinal: 20495
    text: 'Then Nebuchadnezzar came near to the mouth of the burning fiery furnace; he spoke and said: ‘Shadrach, Meshach, and Abed-nego, ye servants of God Most High, come forth, and come hither.’ Then Shadrach, Meshach, and Abed-nego, came forth out of the midst of the fire.'
    translation: JPS 1917
    original: בֵּאדַיִן קְרֵב נְבוּכַדְנֶצַּר לִתְרַע אַתּוּן נוּרָא יָקִדְתָּא עָנֵה וְאָמַר שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד־נְגוֹ עַבְדוֹהִי דִּי־אֱלָהָא עליא [עִלָּאָה] פֻּקוּ וֶאֱתוֹ בֵּאדַיִן נָפְקִין שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ מִן־גּוֹא נוּרָא׃
    hebrewPlain: באדין קרב נבוכדנצר לתרע אתון נורא יקדתא ענה ואמר שדרך מישך ועבד נגו עבדוהי די אלהא עליא [עלאה] פקו ואתו באדין נפקין שדרך מישך ועבד נגו מן גוא נורא
    kjvRefs:
    - Daniel 3:26
    kjvOsis:
    - Dan.3.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.27
    scripture: tanakh
    name: Tanakh Daniel 3:27
    ref: Daniel 3:27
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 27
    ordinal: 20496
    text: And the satraps, the prefects, and the governors, and the king’s ministers, being gathered together, saw these men, that the fire had no power upon their bodies, nor was the hair of their head singed, neither were their cloaks changed, nor had the smell of fire passed on them.
    translation: JPS 1917
    original: וּמִתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּא סִגְנַיָּא וּפַחֲוָתָא וְהַדָּבְרֵי מַלְכָּא חָזַיִן לְגֻבְרַיָּא אִלֵּךְ דִּי לָא־שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן וּשְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ וְסָרְבָּלֵיהוֹן לָא שְׁנוֹ וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן׃
    hebrewPlain: ומתכנשין אחשדרפניא סגניא ופחותא והדברי מלכא חזין לגבריא אלך די לא שלט נורא בגשמהון ושער ראשהון לא התחרך וסרבליהון לא שנו וריח נור לא עדת בהון
    kjvRefs:
    - Daniel 3:27
    kjvOsis:
    - Dan.3.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.28
    scripture: tanakh
    name: Tanakh Daniel 3:28
    ref: Daniel 3:28
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 28
    ordinal: 20497
    text: 'Nebuchadnezzar spoke and said: ‘Blessed be the God of Shadrach, Meshach, and Abed-nego, who hath sent His angel, and delivered His servants that trusted in Him, and have changed the king’s word, and have yielded their bodies, that they might not serve nor worship any god, except their own God.'
    translation: JPS 1917
    original: עָנֵה נְבוּכַדְנֶצַּר וְאָמַר בְּרִיךְ אֱלָהֲהוֹן דִּי־שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ דִּי־שְׁלַח מַלְאֲכֵהּ וְשֵׁיזִב לְעַבְדוֹהִי דִּי הִתְרְחִצוּ עֲלוֹהִי וּמִלַּת מַלְכָּא שַׁנִּיו וִיהַבוּ גשמיהון [גֶשְׁמְהוֹן] דִּי לָא־יִפְלְחוּן וְלָא־יִסְגְּדוּן לְכָל־אֱלָהּ לָהֵן לֵאלָהֲהוֹן׃
    hebrewPlain: ענה נבוכדנצר ואמר בריך אלההון די שדרך מישך ועבד נגו די שלח מלאכה ושיזב לעבדוהי די התרחצו עלוהי ומלת מלכא שניו ויהבו גשמיהון [גשמהון] די לא יפלחון ולא יסגדון לכל אלה להן לאלההון
    kjvRefs:
    - Daniel 3:28
    kjvOsis:
    - Dan.3.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.29
    scripture: tanakh
    name: Tanakh Daniel 3:29
    ref: Daniel 3:29
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 29
    ordinal: 20498
    text: Therefore I make a decree, that every people, nation, and language, which speak any thing amiss against the God of Shadrach, Meshach, and Abed-nego, shall be cut in pieces, and their houses shall be made a dunghill; because there is no other god that is able to deliver after this sort.’
    translation: JPS 1917
    original: וּמִנִּי שִׂים טְעֵם דִּי כָל־עַם אֻמָּה וְלִשָּׁן דִּי־יֵאמַר שלה [שָׁלוּ] עַל אֱלָהֲהוֹן דִּי־שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹא הַדָּמִין יִתְעֲבֵד וּבַיְתֵהּ נְוָלִי יִשְׁתַּוֵּה כָּל־קֳבֵל דִּי לָא אִיתַי אֱלָה אָחֳרָן דִּי־יִכֻּל לְהַצָּלָה כִּדְנָה׃
    hebrewPlain: ומני שים טעם די כל עם אמה ולשן די יאמר שלה [שלו] על אלההון די שדרך מישך ועבד נגוא הדמין יתעבד וביתה נולי ישתוה כל קבל די לא איתי אלה אחרן די יכל להצלה כדנה
    kjvRefs:
    - Daniel 3:29
    kjvOsis:
    - Dan.3.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.30
    scripture: tanakh
    name: Tanakh Daniel 3:30
    ref: Daniel 3:30
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 30
    ordinal: 20499
    text: Then the king promoted Shadrach, Meshach, and Abed-nego, in the province of Babylon.
    translation: JPS 1917
    original: בֵּאדַיִן מַלְכָּא הַצְלַח לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ בִּמְדִינַת בָּבֶל׃
    hebrewPlain: באדין מלכא הצלח לשדרך מישך ועבד נגו במדינת בבל
    kjvRefs:
    - Daniel 3:30
    kjvOsis:
    - Dan.3.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.31
    scripture: tanakh
    name: Tanakh Daniel 3:31
    ref: Daniel 3:31
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 31
    ordinal: 20500
    text: ‘Nebuchadnezzar the king, unto all peoples, nations, and languages, that dwell in all the earth; peace be multiplied unto you.
    translation: JPS 1917
    original: נְבוּכַדְנֶצַּר מַלְכָּא לְכָל־עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא דִּי־דארין [דָיְרִין] בְּכָל־אַרְעָא שְׁלָמְכוֹן יִשְׂגֵּא׃
    hebrewPlain: נבוכדנצר מלכא לכל עממיא אמיא ולשניא די דארין [דירין] בכל ארעא שלמכון ישגא
    kjvRefs:
    - Daniel 4:1
    kjvOsis:
    - Dan.4.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.32
    scripture: tanakh
    name: Tanakh Daniel 3:32
    ref: Daniel 3:32
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 32
    ordinal: 20501
    text: It hath seemed good unto me to declare the signs and wonders that God Most High hath wrought toward me.
    translation: JPS 1917
    original: אָתַיָּא וְתִמְהַיָּא דִּי עֲבַד עִמִּי אֱלָהָא עליא [עִלָּאָה] שְׁפַר קָדָמַי לְהַחֲוָיָה׃
    hebrewPlain: אתיא ותמהיא די עבד עמי אלהא עליא [עלאה] שפר קדמי להחויה
    kjvRefs:
    - Daniel 4:2
    kjvOsis:
    - Dan.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.33
    scripture: tanakh
    name: Tanakh Daniel 3:33
    ref: Daniel 3:33
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 33
    ordinal: 20502
    text: How great are His signs! And how mighty are His wonders! His kingdom is an everlasting kingdom, And His dominion is from generation to generation.
    translation: JPS 1917
    original: אָתוֹהִי כְּמָה רַבְרְבִין וְתִמְהוֹהִי כְּמָה תַקִּיפִין מַלְכוּתֵהּ מַלְכוּת עָלַם וְשָׁלְטָנֵהּ עִם־דָּר וְדָר׃
    hebrewPlain: אתוהי כמה רברבין ותמהוהי כמה תקיפין מלכותה מלכות עלם ושלטנה עם דר ודר
    kjvRefs:
    - Daniel 4:3
    kjvOsis:
    - Dan.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.4.1
    scripture: tanakh
    name: Tanakh Daniel 4:1
    ref: Daniel 4:1
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 20503
    text: I Nebuchadnezzar was at rest in my house, and flourishing in my palace.
    translation: JPS 1917
    original: אֲנָה נְבוּכַדְנֶצַּר שְׁלֵה הֲוֵית בְּבֵיתִי וְרַעְנַן בְּהֵיכְלִי׃
    hebrewPlain: אנה נבוכדנצר שלה הוית בביתי ורענן בהיכלי
    kjvRefs:
    - Daniel 4:4
    kjvOsis:
    - Dan.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.2
    scripture: tanakh
    name: Tanakh Daniel 4:2
    ref: Daniel 4:2
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 20504
    text: I saw a dream which made me afraid; and imaginings upon my bed and the visions of my head affrighted me.
    translation: JPS 1917
    original: חֵלֶם חֲזֵית וִידַחֲלִנַּנִי וְהַרְהֹרִין עַל־מִשְׁכְּבִי וְחֶזְוֵי רֵאשִׁי יְבַהֲלֻנַּנִי׃
    hebrewPlain: חלם חזית וידחלנני והרהרין על משכבי וחזוי ראשי יבהלנני
    kjvRefs:
    - Daniel 4:5
    kjvOsis:
    - Dan.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.3
    scripture: tanakh
    name: Tanakh Daniel 4:3
    ref: Daniel 4:3
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 20505
    text: Therefore made I a decree to bring in all the wise men of Babylon before me, that they might make known unto me the interpretation of the dream.
    translation: JPS 1917
    original: וּמִנִּי שִׂים טְעֵם לְהַנְעָלָה קָדָמַי לְכֹל חַכִּימֵי בָבֶל דִּי־פְשַׁר חֶלְמָא יְהוֹדְעֻנַּנִי׃
    hebrewPlain: ומני שים טעם להנעלה קדמי לכל חכימי בבל די פשר חלמא יהודענני
    kjvRefs:
    - Daniel 4:6
    kjvOsis:
    - Dan.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.4
    scripture: tanakh
    name: Tanakh Daniel 4:4
    ref: Daniel 4:4
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 20506
    text: Then came in the magicians, the enchanters, the Chaldeans, and the astrologers; and I told the dream before them; but they did not make known unto me the interpretation thereof.
    translation: JPS 1917
    original: בֵּאדַיִן עללין [עָלִּין] חַרְטֻמַיָּא אָשְׁפַיָּא כשדיא [כַּשְׂדָּאֵי] וְגָזְרַיָּא וְחֶלְמָא אָמַר אֲנָה קֳדָמֵיהוֹן וּפִשְׁרֵהּ לָא־מְהוֹדְעִין לִי׃
    hebrewPlain: באדין עללין [עלין] חרטמיא אשפיא כשדיא [כשדאי] וגזריא וחלמא אמר אנה קדמיהון ופשרה לא מהודעין לי
    kjvRefs:
    - Daniel 4:7
    kjvOsis:
    - Dan.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.5
    scripture: tanakh
    name: Tanakh Daniel 4:5
    ref: Daniel 4:5
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 20507
    text: 'But at the last Daniel came in before me, whose name was Belteshazzar, according to the name of my god, and in whom is the spirit of the holy gods; and I told the dream before him:'
    translation: JPS 1917
    original: וְעַד אָחֳרֵין עַל קָדָמַי דָּנִיֵּאל דִּי־שְׁמֵהּ בֵּלְטְשַׁאצַּר כְּשֻׁם אֱלָהִי וְדִי רוּחַ־אֱלָהִין קַדִּישִׁין בֵּהּ וְחֶלְמָא קָדָמוֹהִי אַמְרֵת׃
    hebrewPlain: ועד אחרין על קדמי דניאל די שמה בלטשאצר כשם אלהי ודי רוח אלהין קדישין בה וחלמא קדמוהי אמרת
    kjvRefs:
    - Daniel 4:8
    kjvOsis:
    - Dan.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.6
    scripture: tanakh
    name: Tanakh Daniel 4:6
    ref: Daniel 4:6
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 20508
    text: O Belteshazzar, master of the magicians, because I know that the spirit of the holy gods is in thee, and no secret causeth thee trouble, tell me the visions of my dream that I have seen, and the interpretation thereof.
    translation: JPS 1917
    original: בֵּלְטְשַׁאצַּר רַב חַרְטֻמַיָּא דִּי אֲנָה יִדְעֵת דִּי רוּחַ אֱלָהִין קַדִּישִׁין בָּךְ וְכָל־רָז לָא־אָנֵס לָךְ חֶזְוֵי חֶלְמִי דִי־חֲזֵית וּפִשְׁרֵהּ אֱמַר׃
    hebrewPlain: בלטשאצר רב חרטמיא די אנה ידעת די רוח אלהין קדישין בך וכל רז לא אנס לך חזוי חלמי די חזית ופשרה אמר
    kjvRefs:
    - Daniel 4:9
    kjvOsis:
    - Dan.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.7
    scripture: tanakh
    name: Tanakh Daniel 4:7
    ref: Daniel 4:7
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 20509
    text: 'Thus were the visions of my head upon my bed: I saw, And behold a tree in the midst of the earth, And the height thereof was great.'
    translation: JPS 1917
    original: וְחֶזְוֵי רֵאשִׁי עַל־מִשְׁכְּבִי חָזֵה הֲוֵית וַאֲלוּ אִילָן בְּגוֹא אַרְעָא וְרוּמֵהּ שַׂגִּיא׃
    hebrewPlain: וחזוי ראשי על משכבי חזה הוית ואלו אילן בגוא ארעא ורומה שגיא
    kjvRefs:
    - Daniel 4:10
    kjvOsis:
    - Dan.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.8
    scripture: tanakh
    name: Tanakh Daniel 4:8
    ref: Daniel 4:8
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 20510
    text: The tree grew, and was strong, And the height thereof reached unto heaven, And the sight thereof to the end of all the earth.
    translation: JPS 1917
    original: רְבָה אִילָנָא וּתְקִף וְרוּמֵהּ יִמְטֵא לִשְׁמַיָּא וַחֲזוֹתֵהּ לְסוֹף כָּל־אַרְעָא׃
    hebrewPlain: רבה אילנא ותקף ורומה ימטא לשמיא וחזותה לסוף כל ארעא
    kjvRefs:
    - Daniel 4:11
    kjvOsis:
    - Dan.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.4
- type: TanakhVerse
  data:
    osis: Dan.4.9
    scripture: tanakh
    name: Tanakh Daniel 4:9
    ref: Daniel 4:9
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 20511
    text: The leaves thereof were fair, and the fruit thereof much, And in it was food for all; The beasts of the field had shadow under it, And the fowls of the heaven dwelt in the branches thereof, And all flesh was fed of it.
    translation: JPS 1917
    original: עָפְיֵהּ שַׁפִּיר וְאִנְבֵּהּ שַׂגִּיא וּמָזוֹן לְכֹלָּא־בֵהּ תְּחֹתוֹהִי תַּטְלֵל חֵיוַת בָּרָא וּבְעַנְפוֹהִי ידרון [יְדוּרָן] צִפֲּרֵי שְׁמַיָּא וּמִנֵּהּ יִתְּזִין כָּל־בִּשְׂרָא׃
    hebrewPlain: עפיה שפיר ואנבה שגיא ומזון לכלא בה תחתוהי תטלל חיות ברא ובענפוהי ידרון [ידורן] צפרי שמיא ומנה יתזין כל בשרא
