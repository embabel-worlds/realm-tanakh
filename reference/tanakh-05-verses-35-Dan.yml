- type: TanakhVerse
  data:
    osis: Dan.1.2
    scripture: tanakh
    name: Tanakh Daniel 1:2
    ref: Daniel 1:2
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 2
    ordinal: 20401
    text: And the Lord gave Jehoiakim king of Judah into his hand, with all of the vessels of the house of God; and he carried them into the land of Shinar to the house of his god, and the vessels he brought into the treasure-house of his god.
    translation: JPS 1917
    original: וַיִּתֵּן אֲדֹנָי בְּיָדוֹ אֶת־יְהוֹיָקִים מֶלֶךְ־יְהוּדָה וּמִקְצָת כְּלֵי בֵית־הָאֱלֹהִים וַיְבִיאֵם אֶרֶץ־שִׁנְעָר בֵּית אֱלֹהָיו וְאֶת־הַכֵּלִים הֵבִיא בֵּית אוֹצַר אֱלֹהָיו׃
    hebrewPlain: ויתן אדני בידו את יהויקים מלך יהודה ומקצת כלי בית האלהים ויביאם ארץ שנער בית אלהיו ואת הכלים הביא בית אוצר אלהיו
    kjvRefs:
    - Daniel 1:2
    kjvOsis:
    - Dan.1.2
