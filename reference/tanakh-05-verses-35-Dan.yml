  data:
    osis: Dan.4.28
    scripture: tanakh
    name: Tanakh Daniel 4:28
    ref: Daniel 4:28
    book: Dan
    section: ketuvim
    chapter: 4
    verse: 28
    ordinal: 20530
    text: 'While the word was in the king’s mouth, there fell a voice from heaven: ‘O king Nebuchadnezzar, to thee it is spoken: the kingdom is departed from thee.'
    translation: JPS 1917
    original: עוֹד מִלְּתָא בְּפֻם מַלְכָּא קָל מִן־שְׁמַיָּא נְפַל לָךְ אָמְרִין נְבוּכַדְנֶצַּר מַלְכָּא מַלְכוּתָה עֲדָת מִנָּךְ׃
    hebrewPlain: עוד מלתא בפם מלכא קל מן שמיא נפל לך אמרין נבוכדנצר מלכא מלכותה עדת מנך
    kjvRefs:
    - Daniel 4:31
    kjvOsis:
    - Dan.4.31
  relations:
  - predicate: IN
