  data:
    osis: Dan.5.9
    scripture: tanakh
    name: Tanakh Daniel 5:9
    ref: Daniel 5:9
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 20545
    text: Then was king Belshazzar greatly affrighted, and his countenance was changed in him, and his lords were perplexed.
    translation: JPS 1917
    original: אֱדַיִן מַלְכָּא בֵלְשַׁאצַּר שַׂגִּיא מִתְבָּהַל וְזִיוֺהִי שָׁנַיִן עֲלוֹהִי וְרַבְרְבָנוֹהִי מִשְׁתַּבְּשִׁין׃
    hebrewPlain: אדין מלכא בלשאצר שגיא מתבהל וזיוהי שנין עלוהי ורברבנוהי משתבשין
    kjvRefs:
    - Daniel 5:9
    kjvOsis:
    - Dan.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.10
    scripture: tanakh
    name: Tanakh Daniel 5:10
    ref: Daniel 5:10
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 20546
    text: 'Now the queen by reason of the words of the king and his lords came into the banquet house; the queen spoke and said: ‘O king, live for ever! let not thy thoughts affright thee, nor let thy countenance be changed;'
    translation: JPS 1917
    original: מַלְכְּתָא לָקֳבֵל מִלֵּי מַלְכָּא וְרַבְרְבָנוֹהִי לְבֵית מִשְׁתְּיָא עללת [עַלַּת] עֲנָת מַלְכְּתָא וַאֲמֶרֶת מַלְכָּא לְעָלְמִין חֱיִי אַל־יְבַהֲלוּךְ רַעְיוֹנָךְ וְזִיוָיךְ אַל־יִשְׁתַּנּוֹ׃
    hebrewPlain: מלכתא לקבל מלי מלכא ורברבנוהי לבית משתיא עללת [עלת] ענת מלכתא ואמרת מלכא לעלמין חיי אל יבהלוך רעיונך וזיויך אל ישתנו
    kjvRefs:
    - Daniel 5:10
    kjvOsis:
    - Dan.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.11
    scripture: tanakh
    name: Tanakh Daniel 5:11
    ref: Daniel 5:11
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 20547
    text: there is a man in thy kingdom, in whom is the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; and the king Nebuchadnezzar thy father, the king, I say, thy father, made him master of the magicians, enchanters, Chaldeans, and astrologers;
    translation: JPS 1917
    original: אִיתַי גְּבַר בְּמַלְכוּתָךְ דִּי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ וּבְיוֹמֵי אֲבוּךְ נַהִירוּ וְשָׂכְלְתָנוּ וְחָכְמָה כְּחָכְמַת־אֱלָהִין הִשְׁתְּכַחַת בֵּהּ וּמַלְכָּא נְבֻכַדְנֶצַּר אֲבוּךְ רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין הֲקִימֵהּ אֲבוּךְ מַלְכָּא׃
    hebrewPlain: איתי גבר במלכותך די רוח אלהין קדישין בה וביומי אבוך נהירו ושכלתנו וחכמה כחכמת אלהין השתכחת בה ומלכא נבכדנצר אבוך רב חרטמין אשפין כשדאין גזרין הקימה אבוך מלכא
    kjvRefs:
    - Daniel 5:11
    kjvOsis:
    - Dan.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.12
    scripture: tanakh
    name: Tanakh Daniel 5:12
    ref: Daniel 5:12
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 20548
    text: forasmuch as a surpassing spirit, and knowledge, and understanding, interpreting of dreams, and declaring of riddles, and loosing of knots, were found in the same Daniel, whom the king named Belteshazzar. Now let Daniel be called, and he will declare the interpretation.’
    translation: JPS 1917
    original: כָּל־קֳבֵל דִּי רוּחַ יַתִּירָה וּמַנְדַּע וְשָׂכְלְתָנוּ מְפַשַּׁר חֶלְמִין וַאַחֲוָיַת אֲחִידָן וּמְשָׁרֵא קִטְרִין הִשְׁתְּכַחַת בֵּהּ בְּדָנִיֵּאל דִּי־מַלְכָּא שָׂם־שְׁמֵהּ בֵּלְטְשַׁאצַּר כְּעַן דָּנִיֵּאל יִתְקְרֵי וּפִשְׁרָה יְהַחֲוֵה׃
    hebrewPlain: כל קבל די רוח יתירה ומנדע ושכלתנו מפשר חלמין ואחוית אחידן ומשרא קטרין השתכחת בה בדניאל די מלכא שם שמה בלטשאצר כען דניאל יתקרי ופשרה יהחוה
    kjvRefs:
    - Daniel 5:12
    kjvOsis:
    - Dan.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.13
    scripture: tanakh
    name: Tanakh Daniel 5:13
    ref: Daniel 5:13
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 20549
    text: 'Then was Daniel brought in before the king. The king spoke and said unto Daniel: ‘Art thou Daniel, who is of the children of the captivity of Judah, whom the king my father brought out of Judah?'
    translation: JPS 1917
    original: בֵּאדַיִן דָּנִיֵּאל הֻעַל קֳדָם מַלְכָּא עָנֵה מַלְכָּא וְאָמַר לְדָנִיֵּאל אנתה־[אַנְתְּ־] הוּא דָנִיֵּאל דִּי־מִן־בְּנֵי גָלוּתָא דִּי יְהוּד דִּי הַיְתִי מַלְכָּא אַבִי מִן־יְהוּד׃
    hebrewPlain: באדין דניאל העל קדם מלכא ענה מלכא ואמר לדניאל אנתה [אנת ] הוא דניאל די מן בני גלותא די יהוד די היתי מלכא אבי מן יהוד
    kjvRefs:
    - Daniel 5:13
    kjvOsis:
    - Dan.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.14
    scripture: tanakh
    name: Tanakh Daniel 5:14
    ref: Daniel 5:14
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 20550
    text: I have heard of thee, that the spirit of the gods is in thee, and that light and understanding and surpassing wisdom is found in thee.
    translation: JPS 1917
    original: וְשִׁמְעֵת עליך [עֲלָךְ] דִּי רוּחַ אֱלָהִין בָּךְ וְנַהִירוּ וְשָׂכְלְתָנוּ וְחָכְמָה יַתִּירָה הִשְׁתְּכַחַת בָּךְ׃
    hebrewPlain: ושמעת עליך [עלך] די רוח אלהין בך ונהירו ושכלתנו וחכמה יתירה השתכחת בך
    kjvRefs:
    - Daniel 5:14
    kjvOsis:
    - Dan.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.15
    scripture: tanakh
    name: Tanakh Daniel 5:15
    ref: Daniel 5:15
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 15
    ordinal: 20551
    text: And now the wise men, the enchanters, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof; but they could not declare the interpretation of the thing.
    translation: JPS 1917
    original: וּכְעַן הֻעַלּוּ קָדָמַי חַכִּימַיָּא אָשְׁפַיָּא דִּי־כְתָבָה דְנָה יִקְרוֹן וּפִשְׁרֵהּ לְהוֹדָעֻתַנִי וְלָא־כָהֲלִין פְּשַׁר־מִלְּתָא לְהַחֲוָיָה׃
    hebrewPlain: וכען העלו קדמי חכימיא אשפיא די כתבה דנה יקרון ופשרה להודעתני ולא כהלין פשר מלתא להחויה
    kjvRefs:
    - Daniel 5:15
    kjvOsis:
    - Dan.5.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.16
    scripture: tanakh
    name: Tanakh Daniel 5:16
    ref: Daniel 5:16
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 16
    ordinal: 20552
    text: But I have heard of thee, that thou canst give interpretations, and loose knots; now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with purple, and have a chain of gold about thy neck, and shalt rule as one of three in the kingdom.’
    translation: JPS 1917
    original: וַאֲנָה שִׁמְעֵת עליך [עֲלָךְ] דִּי־תוכל [תִיכּוּל] פִּשְׁרִין לְמִפְשַׁר וְקִטְרִין לְמִשְׁרֵא כְּעַן הֵן תוכל [תִּכוּל] כְּתָבָא לְמִקְרֵא וּפִשְׁרֵהּ לְהוֹדָעֻתַנִי אַרְגְּוָנָא תִלְבַּשׁ והמונכא [וְהַמְנִיכָא] דִי־דַהֲבָא עַל־צַוְּארָךְ וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט׃
    hebrewPlain: ואנה שמעת עליך [עלך] די תוכל [תיכול] פשרין למפשר וקטרין למשרא כען הן תוכל [תכול] כתבא למקרא ופשרה להודעתני ארגונא תלבש והמונכא [והמניכא] די דהבא על צוארך ותלתא במלכותא תשלט
    kjvRefs:
    - Daniel 5:16
    kjvOsis:
    - Dan.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.17
    scripture: tanakh
    name: Tanakh Daniel 5:17
    ref: Daniel 5:17
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 17
    ordinal: 20553
    text: 'Then Daniel answered and said before the king: ‘Let thy gifts be to thyself, and give thy rewards to another; nevertheless I will read the writing unto the king, and make known to him the interpretation.'
    translation: JPS 1917
    original: בֵּאדַיִן עָנֵה דָנִיֵּאל וְאָמַר קֳדָם מַלְכָּא מַתְּנָתָךְ לָךְ לֶהֶוְיָן וּנְבָזְבְּיָתָךְ לְאָחֳרָן הַב בְּרַם כְּתָבָא אֶקְרֵא לְמַלְכָּא וּפִשְׁרָא אֲהוֹדְעִנֵּהּ׃
    hebrewPlain: באדין ענה דניאל ואמר קדם מלכא מתנתך לך להוין ונבזביתך לאחרן הב ברם כתבא אקרא למלכא ופשרא אהודענה
    kjvRefs:
    - Daniel 5:17
    kjvOsis:
    - Dan.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.18
    scripture: tanakh
    name: Tanakh Daniel 5:18
    ref: Daniel 5:18
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 18
    ordinal: 20554
    text: O thou king, God Most High gave Nebuchadnezzar thy father the kingdom, and greatness, and glory, and majesty;
    translation: JPS 1917
    original: אנתה [אַנְתְּ] מַלְכָּא אֱלָהָא עליא [עִלָּאָה] מַלְכוּתָא וּרְבוּתָא וִיקָרָא וְהַדְרָה יְהַב לִנְבֻכַדְנֶצַּר אֲבוּךְ׃
    hebrewPlain: אנתה [אנת] מלכא אלהא עליא [עלאה] מלכותא ורבותא ויקרא והדרה יהב לנבכדנצר אבוך
    kjvRefs:
    - Daniel 5:18
    kjvOsis:
    - Dan.5.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.19
    scripture: tanakh
    name: Tanakh Daniel 5:19
    ref: Daniel 5:19
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 19
    ordinal: 20555
    text: 'and because of the greatness that He gave him, all the peoples, nations, and languages trembled and feared before him: whom he would he slew, and whom he would he kept alive; and whom he would he raised up, and whom he would he put down.'
    translation: JPS 1917
    original: וּמִן־רְבוּתָא דִּי יְהַב־לֵהּ כֹּל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא הֲווֹ זאעין [זָיְעִין] וְדָחֲלִין מִן־קֳדָמוֹהִי דִּי־הֲוָה צָבֵא הֲוָא קָטֵל וְדִי־הֲוָה צָבֵא הֲוָה מַחֵא וְדִי־הֲוָה צָבֵא הֲוָה מָרִים וְדִי־הֲוָה צָבֵא הֲוָה מַשְׁפִּיל׃
    hebrewPlain: ומן רבותא די יהב לה כל עממיא אמיא ולשניא הוו זאעין [זיעין] ודחלין מן קדמוהי די הוה צבא הוא קטל ודי הוה צבא הוה מחא ודי הוה צבא הוה מרים ודי הוה צבא הוה משפיל
    kjvRefs:
    - Daniel 5:19
    kjvOsis:
    - Dan.5.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.20
    scripture: tanakh
    name: Tanakh Daniel 5:20
    ref: Daniel 5:20
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 20
    ordinal: 20556
    text: But when his heart was lifted up, and his spirit was hardened that he dealt proudly, he was deposed from his kingly throne, and his glory was taken from him;
    translation: JPS 1917
    original: וּכְדִי רִם לִבְבֵהּ וְרוּחֵהּ תִּקְפַת לַהֲזָדָה הָנְחַת מִן־כָּרְסֵא מַלְכוּתֵהּ וִיקָרָה הֶעְדִּיוּ מִנֵּהּ׃
    hebrewPlain: וכדי רם לבבה ורוחה תקפת להזדה הנחת מן כרסא מלכותה ויקרה העדיו מנה
    kjvRefs:
    - Daniel 5:20
    kjvOsis:
    - Dan.5.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.21
    scripture: tanakh
    name: Tanakh Daniel 5:21
    ref: Daniel 5:21
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 21
    ordinal: 20557
    text: and he was driven from the sons of men, and his heart was made like the beasts, and his dwelling was with the wild asses; he was fed with grass like oxen, and his body was wet with the dew of heaven; until he knew that God Most High ruleth in the kingdom of men, and that He setteth up over it whomsoever He will.
    translation: JPS 1917
    original: וּמִן־בְּנֵי אֲנָשָׁא טְרִיד וְלִבְבֵהּ עִם־חֵיוְתָא שוי [שַׁוִּיְו] וְעִם־עֲרָדַיָּא מְדוֹרֵהּ עִשְׂבָּא כְתוֹרִין יְטַעֲמוּנֵּהּ וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע עַד דִּי־יְדַע דִּי־שַׁלִּיט אֱלָהָא עליא [עִלָּאָה] בְּמַלְכוּת אֲנָשָׁא וּלְמַן־דִּי יִצְבֵּה יְהָקֵים עליה [עֲלַהּ׃]
    hebrewPlain: ומן בני אנשא טריד ולבבה עם חיותא שוי [שויו] ועם ערדיא מדורה עשבא כתורין יטעמונה ומטל שמיא גשמה יצטבע עד די ידע די שליט אלהא עליא [עלאה] במלכות אנשא ולמן די יצבה יהקים עליה [עלה]
    kjvRefs:
    - Daniel 5:21
    kjvOsis:
    - Dan.5.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.22
    scripture: tanakh
    name: Tanakh Daniel 5:22
    ref: Daniel 5:22
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 22
    ordinal: 20558
    text: And thou his son, O Belshazzar, hast not humbled thy heart, though thou knewest all this;
    translation: JPS 1917
    original: ואנתה [וְאַנְתְּ] בְּרֵהּ בֵּלְשַׁאצַּר לָא הַשְׁפֵּלְתְּ לִבְבָךְ כָּל־קֳבֵל דִּי כָל־דְּנָה יְדַעְתָּ׃
    hebrewPlain: ואנתה [ואנת] ברה בלשאצר לא השפלת לבבך כל קבל די כל דנה ידעת
    kjvRefs:
    - Daniel 5:22
    kjvOsis:
    - Dan.5.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.23
    scripture: tanakh
    name: Tanakh Daniel 5:23
    ref: Daniel 5:23
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 23
    ordinal: 20559
    text: but hast lifted up thyself against the Lord of heaven; and they have brought the vessels of His house before thee, and thou and thy lords, thy consorts and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know; and the God in whose hand thy breath is, and whose are all thy ways, hast thou not glorified;
    translation: JPS 1917
    original: וְעַל מָרֵא־שְׁמַיָּא הִתְרוֹמַמְתָּ וּלְמָאנַיָּא דִי־בַיְתֵהּ הַיְתִיו קדמיך [קָדָמָךְ] ואנתה [וְאַנְתְּ] ורברבניך [וְרַבְרְבָנָךְ] שֵׁגְלָתָךְ וּלְחֵנָתָךְ חַמְרָא שָׁתַיִן בְּהוֹן וְלֵאלָהֵי כַסְפָּא־וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא דִּי לָא־חָזַיִן וְלָא־שָׁמְעִין וְלָא יָדְעִין שַׁבַּחְתָּ וְלֵאלָהָא דִּי־נִשְׁמְתָךְ בִּידֵהּ וְכָל־אֹרְחָתָךְ לֵהּ לָא הַדַּרְתָּ׃
    hebrewPlain: ועל מרא שמיא התרוממת ולמאניא די ביתה היתיו קדמיך [קדמך] ואנתה [ואנת] ורברבניך [ורברבנך] שגלתך ולחנתך חמרא שתין בהון ולאלהי כספא ודהבא נחשא פרזלא אעא ואבנא די לא חזין ולא שמעין ולא ידעין שבחת ולאלהא די נשמתך בידה וכל ארחתך לה לא הדרת
    kjvRefs:
    - Daniel 5:23
    kjvOsis:
    - Dan.5.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.24
    scripture: tanakh
    name: Tanakh Daniel 5:24
    ref: Daniel 5:24
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 24
    ordinal: 20560
    text: then was the palm of the hand sent from before Him, and this writing was inscribed.
    translation: JPS 1917
    original: בֵּאדַיִן מִן־קֳדָמוֹהִי שְׁלִיַחַ פַּסָּא דִי־יְדָא וּכְתָבָא דְנָה רְשִׁים׃
    hebrewPlain: באדין מן קדמוהי שליח פסא די ידא וכתבא דנה רשים
    kjvRefs:
    - Daniel 5:24
    kjvOsis:
    - Dan.5.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.25
    scripture: tanakh
    name: Tanakh Daniel 5:25
    ref: Daniel 5:25
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 25
    ordinal: 20561
    text: 'And this is the writing that was inscribed: MENE MENE, TEKEL UPHARSIN.'
    translation: JPS 1917
    original: וּדְנָה כְתָבָא דִּי רְשִׁים מְנֵא מְנֵא תְּקֵל וּפַרְסִין׃
    hebrewPlain: ודנה כתבא די רשים מנא מנא תקל ופרסין
    kjvRefs:
    - Daniel 5:25
    kjvOsis:
    - Dan.5.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.26
    scripture: tanakh
    name: Tanakh Daniel 5:26
    ref: Daniel 5:26
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 26
    ordinal: 20562
    text: 'This is the interpretation of the thing: MENE, God hath numbered thy kingdom, and brought it to an end.'
    translation: JPS 1917
    original: דְּנָה פְּשַׁר־מִלְּתָא מְנֵא מְנָה־אֱלָהָא מַלְכוּתָךְ וְהַשְׁלְמַהּ׃
    hebrewPlain: דנה פשר מלתא מנא מנה אלהא מלכותך והשלמה
    kjvRefs:
    - Daniel 5:26
    kjvOsis:
    - Dan.5.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.27
    scripture: tanakh
    name: Tanakh Daniel 5:27
    ref: Daniel 5:27
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 27
    ordinal: 20563
    text: TEKEL, Thou art weighed in the balances, and art found wanting.
    translation: JPS 1917
    original: תְּקֵל תְּקִילְתָּה בְמֹאזַנְיָא וְהִשְׁתְּכַחַתְּ חַסִּיר׃
    hebrewPlain: תקל תקילתה במאזניא והשתכחת חסיר
    kjvRefs:
    - Daniel 5:27
    kjvOsis:
    - Dan.5.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.28
    scripture: tanakh
    name: Tanakh Daniel 5:28
    ref: Daniel 5:28
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 28
    ordinal: 20564
    text: PERES, thy kingdom is divided, and given to the Medes and Persians.’
    translation: JPS 1917
    original: פְּרֵס פְּרִיסַת מַלְכוּתָךְ וִיהִיבַת לְמָדַי וּפָרָס׃
    hebrewPlain: פרס פריסת מלכותך ויהיבת למדי ופרס
    kjvRefs:
    - Daniel 5:28
    kjvOsis:
    - Dan.5.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.29
    scripture: tanakh
    name: Tanakh Daniel 5:29
    ref: Daniel 5:29
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 29
    ordinal: 20565
    text: Then commanded Belshazzar, and they clothed Daniel with purple, and put a chain of gold about his neck, and made proclamation concerning him, that he should rule as one of three in the kingdom.
    translation: JPS 1917
    original: בֵּאדַיִן אֲמַר בֵּלְשַׁאצַּר וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא והמונכא [וְהַמְנִיכָא] דִי־דַהֲבָא עַל־צַוְּארֵהּ וְהַכְרִזוּ עֲלוֹהִי דִּי־לֶהֱוֵא שַׁלִּיט תַּלְתָּא בְּמַלְכוּתָא׃
    hebrewPlain: באדין אמר בלשאצר והלבישו לדניאל ארגונא והמונכא [והמניכא] די דהבא על צוארה והכרזו עלוהי די להוא שליט תלתא במלכותא
    kjvRefs:
    - Daniel 5:29
    kjvOsis:
    - Dan.5.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.5.30
    scripture: tanakh
    name: Tanakh Daniel 5:30
    ref: Daniel 5:30
    book: Dan
    section: ketuvim
    chapter: 5
    verse: 30
    ordinal: 20566
    text: In that night Belshazzar the Chaldean king was slain.
    translation: JPS 1917
    original: בֵּהּ בְּלֵילְיָא קְטִיל בֵּלְאשַׁצַּר מַלְכָּא כשדיא [כַשְׂדָּאָה׃]
    hebrewPlain: בה בליליא קטיל בלאשצר מלכא כשדיא [כשדאה]
    kjvRefs:
    - Daniel 5:30
    kjvOsis:
    - Dan.5.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.5
- type: TanakhVerse
  data:
    osis: Dan.6.1
    scripture: tanakh
    name: Tanakh Daniel 6:1
    ref: Daniel 6:1
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 20567
    text: And Darius the Mede received the kingdom, being about threescore and two years old.
    translation: JPS 1917
    original: וְדָרְיָוֶשׁ מָדָיָא קַבֵּל מַלְכוּתָא כְּבַר שְׁנִין שִׁתִּין וְתַרְתֵּין׃
    hebrewPlain: ודריוש מדיא קבל מלכותא כבר שנין שתין ותרתין
    kjvRefs:
    - Daniel 5:31
    kjvOsis:
    - Dan.5.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.2
    scripture: tanakh
    name: Tanakh Daniel 6:2
    ref: Daniel 6:2
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 20568
    text: It pleased Darius to set over the kingdom a hundred and twenty satraps, who should be throughout the whole kingdom;
    translation: JPS 1917
    original: שְׁפַר קֳדָם דָּרְיָוֶשׁ וַהֲקִים עַל־מַלְכוּתָא לַאֲחַשְׁדַּרְפְּנַיָּא מְאָה וְעֶשְׂרִין דִּי לֶהֱוֺן בְּכָל־מַלְכוּתָא׃
    hebrewPlain: שפר קדם דריוש והקים על מלכותא לאחשדרפניא מאה ועשרין די להון בכל מלכותא
    kjvRefs:
    - Daniel 6:1
    kjvOsis:
    - Dan.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.3
    scripture: tanakh
    name: Tanakh Daniel 6:3
    ref: Daniel 6:3
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 20569
    text: and over them three presidents, of whom Daniel was one; that these satraps might give account unto them, and that the king should have no damage.
    translation: JPS 1917
    original: וְעֵלָּא מִנְּהוֹן סָרְכִין תְּלָתָא דִּי דָנִיֵּאל חַד־מִנְּהוֹן דִּי־לֶהֱוֺן אֲחַשְׁדַּרְפְּנַיָּא אִלֵּין יָהֲבִין לְהוֹן טַעְמָא וּמַלְכָּא לָא־לֶהֱוֵא נָזִק׃
    hebrewPlain: ועלא מנהון סרכין תלתא די דניאל חד מנהון די להון אחשדרפניא אלין יהבין להון טעמא ומלכא לא להוא נזק
    kjvRefs:
    - Daniel 6:2
    kjvOsis:
    - Dan.6.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.4
    scripture: tanakh
    name: Tanakh Daniel 6:4
    ref: Daniel 6:4
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 20570
    text: Then this Daniel distinguished himself above the presidents and the satraps, because a surpassing spirit was in him; and the king thought to set him over the whole realm.
    translation: JPS 1917
    original: אֱדַיִן דָּנִיֵּאל דְּנָה הֲוָא מִתְנַצַּח עַל־סָרְכַיָּא וַאֲחַשְׁדַּרְפְּנַיָּא כָּל־קֳבֵל דִּי רוּחַ יַתִּירָא בֵּהּ וּמַלְכָּא עֲשִׁית לַהֲקָמוּתֵהּ עַל־כָּל־מַלְכוּתָא׃
    hebrewPlain: אדין דניאל דנה הוא מתנצח על סרכיא ואחשדרפניא כל קבל די רוח יתירא בה ומלכא עשית להקמותה על כל מלכותא
    kjvRefs:
    - Daniel 6:3
    kjvOsis:
    - Dan.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.5
    scripture: tanakh
    name: Tanakh Daniel 6:5
    ref: Daniel 6:5
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 20571
    text: Then the presidents and the satraps sought to find occasion against Daniel as touching the kingdom; but they could find no occasion nor fault; forasmuch as he was faithful, neither was there any error or fault found in him.
    translation: JPS 1917
    original: אֱדַיִן סָרְכַיָּא וַאֲחַשְׁדַּרְפְּנַיָּא הֲווֹ בָעַיִן עִלָּה לְהַשְׁכָּחָה לְדָנִיֵּאל מִצַּד מַלְכוּתָא וְכָל־עִלָּה וּשְׁחִיתָה לָא־יָכְלִין לְהַשְׁכָּחָה כָּל־קֳבֵל דִּי־מְהֵימַן הוּא וְכָל־שָׁלוּ וּשְׁחִיתָה לָא הִשְׁתְּכַחַת עֲלוֹהִי׃
    hebrewPlain: אדין סרכיא ואחשדרפניא הוו בעין עלה להשכחה לדניאל מצד מלכותא וכל עלה ושחיתה לא יכלין להשכחה כל קבל די מהימן הוא וכל שלו ושחיתה לא השתכחת עלוהי
    kjvRefs:
    - Daniel 6:4
    kjvOsis:
    - Dan.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.6
    scripture: tanakh
    name: Tanakh Daniel 6:6
    ref: Daniel 6:6
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 20572
    text: 'Then said these men: ‘We shall not find any occasion against this Daniel, except we find it against him in the matter of the law of his God.’'
    translation: JPS 1917
    original: אֱדַיִן גֻּבְרַיָּא אִלֵּךְ אָמְרִין דִּי לָא נְהַשְׁכַּח לְדָנִיֵּאל דְּנָה כָּל־עִלָּא לָהֵן הַשְׁכַּחְנָה עֲלוֹהִי בְּדָת אֱלָהֵהּ׃
    hebrewPlain: אדין גבריא אלך אמרין די לא נהשכח לדניאל דנה כל עלא להן השכחנה עלוהי בדת אלהה
    kjvRefs:
    - Daniel 6:5
    kjvOsis:
    - Dan.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.7
    scripture: tanakh
    name: Tanakh Daniel 6:7
    ref: Daniel 6:7
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 20573
    text: 'Then these presidents and satraps came tumultuously to the king, and said thus unto him: ‘King Darius, live for ever!'
    translation: JPS 1917
    original: אֱדַיִן סָרְכַיָּא וַאֲחַשְׁדַּרְפְּנַיָּא אִלֵּן הַרְגִּשׁוּ עַל־מַלְכָּא וְכֵן אָמְרִין לֵהּ דָּרְיָוֶשׁ מַלְכָּא לְעָלְמִין חֱיִי׃
    hebrewPlain: אדין סרכיא ואחשדרפניא אלן הרגשו על מלכא וכן אמרין לה דריוש מלכא לעלמין חיי
    kjvRefs:
    - Daniel 6:6
    kjvOsis:
    - Dan.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.8
    scripture: tanakh
    name: Tanakh Daniel 6:8
    ref: Daniel 6:8
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 20574
    text: All the presidents of the kingdom, the prefects and the satraps, the ministers and the governors, have consulted together that the king should establish a statute, and make a strong interdict, that whosoever shall ask a petition of any god or man for thirty days, save of thee, O king, he shall be cast into the den of lions.
    translation: JPS 1917
    original: אִתְיָעַטוּ כֹּל סָרְכֵי מַלְכוּתָא סִגְנַיָּא וַאֲחַשְׁדַּרְפְּנַיָּא הַדָּבְרַיָּא וּפַחֲוָתָא לְקַיָּמָה קְיָם מַלְכָּא וּלְתַקָּפָה אֱסָר דִּי כָל־דִּי־יִבְעֵה בָעוּ מִן־כָּל־אֱלָהּ וֶאֱנָשׁ עַד־יוֹמִין תְּלָתִין לָהֵן מִנָּךְ מַלְכָּא יִתְרְמֵא לְגֹב אַרְיָוָתָא׃
    hebrewPlain: אתיעטו כל סרכי מלכותא סגניא ואחשדרפניא הדבריא ופחותא לקימה קים מלכא ולתקפה אסר די כל די יבעה בעו מן כל אלה ואנש עד יומין תלתין להן מנך מלכא יתרמא לגב אריותא
    kjvRefs:
    - Daniel 6:7
    kjvOsis:
    - Dan.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.9
    scripture: tanakh
    name: Tanakh Daniel 6:9
    ref: Daniel 6:9
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 20575
    text: Now, O king, establish the interdict, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which altereth not.’
    translation: JPS 1917
    original: כְּעַן מַלְכָּא תְּקִים אֱסָרָא וְתִרְשֻׁם כְּתָבָא דִּי לָא לְהַשְׁנָיָה כְּדָת־מָדַי וּפָרַס דִּי־לָא תֶעְדֵּא׃
    hebrewPlain: כען מלכא תקים אסרא ותרשם כתבא די לא להשניה כדת מדי ופרס די לא תעדא
    kjvRefs:
    - Daniel 6:8
    kjvOsis:
    - Dan.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.10
    scripture: tanakh
    name: Tanakh Daniel 6:10
    ref: Daniel 6:10
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 20576
    text: Wherefore king Darius signed the writing and the interdict.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה מַלְכָּא דָּרְיָוֶשׁ רְשַׁם כְּתָבָא וֶאֱסָרָא׃
    hebrewPlain: כל קבל דנה מלכא דריוש רשם כתבא ואסרא
    kjvRefs:
    - Daniel 6:9
    kjvOsis:
    - Dan.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.11
    scripture: tanakh
    name: Tanakh Daniel 6:11
    ref: Daniel 6:11
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 20577
    text: And when Daniel knew that the writing was signed, he went into his house—now his windows were open in his upper chamber toward Jerusalem—and he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.
    translation: JPS 1917
    original: וְדָנִיֵּאל כְּדִי יְדַע דִּי־רְשִׁים כְּתָבָא עַל לְבַיְתֵהּ וְכַוִּין פְּתִיחָן לֵהּ בְּעִלִּיתֵהּ נֶגֶד יְרוּשְׁלֶם וְזִמְנִין תְּלָתָה בְיוֹמָא הוּא בָּרֵךְ עַל־בִּרְכוֹהִי וּמְצַלֵּא וּמוֹדֵא קֳדָם אֱלָהֵהּ כָּל־קֳבֵל דִּי־הֲוָא עָבֵד מִן־קַדְמַת דְּנָה׃
    hebrewPlain: ודניאל כדי ידע די רשים כתבא על לביתה וכוין פתיחן לה בעליתה נגד ירושלם וזמנין תלתה ביומא הוא ברך על ברכוהי ומצלא ומודא קדם אלהה כל קבל די הוא עבד מן קדמת דנה
    kjvRefs:
    - Daniel 6:10
    kjvOsis:
    - Dan.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.12
    scripture: tanakh
    name: Tanakh Daniel 6:12
    ref: Daniel 6:12
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 20578
    text: Then these men came tumultuously, and found Daniel making petition and supplication before his God.
    translation: JPS 1917
    original: אֱדַיִן גֻּבְרַיָּא אִלֵּךְ הַרְגִּשׁוּ וְהַשְׁכַּחוּ לְדָנִיֵּאל בָּעֵא וּמִתְחַנַּן קֳדָם אֱלָהֵהּ׃
    hebrewPlain: אדין גבריא אלך הרגשו והשכחו לדניאל בעא ומתחנן קדם אלהה
    kjvRefs:
    - Daniel 6:11
    kjvOsis:
    - Dan.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.13
    scripture: tanakh
    name: Tanakh Daniel 6:13
    ref: Daniel 6:13
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 20579
    text: 'Then they came near, and spoke before the king concerning the king’s interdict: ‘Hast thou not signed an interdict, that every man that shall make petition unto any god or man within thirty days, save of thee, O king, shall be cast into the den of lions?’ The king answered and said: ‘The thing is true, according to the law of the Medes and Persians, which altereth not.’'
    translation: JPS 1917
    original: בֵּאדַיִן קְרִיבוּ וְאָמְרִין קֳדָם־מַלְכָּא עַל־אֱסָר מַלְכָּא הֲלָא אֱסָר רְשַׁמְתָּ דִּי כָל־אֱנָשׁ דִּי־יִבְעֵה מִן־כָּל־אֱלָהּ וֶאֱנָשׁ עַד־יוֹמִין תְּלָתִין לָהֵן מִנָּךְ מַלְכָּא יִתְרְמֵא לְגוֹב אַרְיָותָא עָנֵה מַלְכָּא וְאָמַר יַצִּיבָא מִלְּתָא כְּדָת־מָדַי וּפָרַס דִּי־לָא תֶעְדֵּא׃
    hebrewPlain: באדין קריבו ואמרין קדם מלכא על אסר מלכא הלא אסר רשמת די כל אנש די יבעה מן כל אלה ואנש עד יומין תלתין להן מנך מלכא יתרמא לגוב אריותא ענה מלכא ואמר יציבא מלתא כדת מדי ופרס די לא תעדא
    kjvRefs:
    - Daniel 6:12
    kjvOsis:
    - Dan.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.14
    scripture: tanakh
    name: Tanakh Daniel 6:14
    ref: Daniel 6:14
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 20580
    text: 'Then answered they and said before the king: ‘That Daniel, who is of the children of the captivity of Judah, regardeth not thee, O king, nor the interdict that thou hast signed, but maketh his petition three times a day.’'
    translation: JPS 1917
    original: בֵּאדַיִן עֲנוֹ וְאָמְרִין קֳדָם מַלְכָּא דִּי דָנִיֵּאל דִּי מִן־בְּנֵי גָלוּתָא דִּי יְהוּד לָא־שָׂם עליך [עֲלָךְ] מַלְכָּא טְעֵם וְעַל־אֱסָרָא דִּי רְשַׁמְתָּ וְזִמְנִין תְּלָתָה בְּיוֹמָא בָּעֵא בָּעוּתֵהּ׃
    hebrewPlain: באדין ענו ואמרין קדם מלכא די דניאל די מן בני גלותא די יהוד לא שם עליך [עלך] מלכא טעם ועל אסרא די רשמת וזמנין תלתה ביומא בעא בעותה
    kjvRefs:
    - Daniel 6:13
    kjvOsis:
    - Dan.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.15
    scripture: tanakh
    name: Tanakh Daniel 6:15
    ref: Daniel 6:15
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 15
    ordinal: 20581
    text: Then the king, when he heard these words, was sore displeased, and set his heart on Daniel to deliver him; and he laboured till the going down of the sun to deliver him.
    translation: JPS 1917
    original: אֱדַיִן מַלְכָּא כְּדִי מִלְּתָא שְׁמַע שַׂגִּיא בְּאֵשׁ עֲלוֹהִי וְעַל דָּנִיֵּאל שָׂם בָּל לְשֵׁיזָבוּתֵהּ וְעַד מֶעָלֵי שִׁמְשָׁא הֲוָא מִשְׁתַּדַּר לְהַצָּלוּתֵהּ׃
    hebrewPlain: אדין מלכא כדי מלתא שמע שגיא באש עלוהי ועל דניאל שם בל לשיזבותה ועד מעלי שמשא הוא משתדר להצלותה
    kjvRefs:
    - Daniel 6:14
    kjvOsis:
    - Dan.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.16
    scripture: tanakh
    name: Tanakh Daniel 6:16
    ref: Daniel 6:16
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 16
    ordinal: 20582
    text: 'Then these men came tumultuously unto the king, and said unto the king: ‘Know, O king, that it is a law of the Medes and Persians, that no interdict nor statute which the king establisheth may be changed.’'
    translation: JPS 1917
    original: בֵּאדַיִן גֻּבְרַיָּא אִלֵּךְ הַרְגִּשׁוּ עַל־מַלְכָּא וְאָמְרִין לְמַלְכָּא דַּע מַלְכָּא דִּי־דָת לְמָדַי וּפָרַס דִּי־כָל־אֱסָר וּקְיָם דִּי־מַלְכָּא יְהָקֵים לָא לְהַשְׁנָיָה׃
    hebrewPlain: באדין גבריא אלך הרגשו על מלכא ואמרין למלכא דע מלכא די דת למדי ופרס די כל אסר וקים די מלכא יהקים לא להשניה
    kjvRefs:
    - Daniel 6:15
    kjvOsis:
    - Dan.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.17
    scripture: tanakh
    name: Tanakh Daniel 6:17
    ref: Daniel 6:17
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 17
    ordinal: 20583
    text: 'Then the king commanded, and they brought Daniel, and cast him into the den of lions. Now the king spoke and said unto Daniel: ‘Thy God whom thou servest continually, He will deliver thee.’'
    translation: JPS 1917
    original: בֵּאדַיִן מַלְכָּא אֲמַר וְהַיְתִיו לְדָנִיֵּאל וּרְמוֹ לְגֻבָּא דִּי אַרְיָוָתָא עָנֵה מַלְכָּא וְאָמַר לְדָנִיֵּאל אֱלָהָךְ דִּי אנתה [אַנְתְּ] פָּלַח־לֵהּ בִּתְדִירָא הוּא יְשֵׁיזְבִנָּךְ׃
    hebrewPlain: באדין מלכא אמר והיתיו לדניאל ורמו לגבא די אריותא ענה מלכא ואמר לדניאל אלהך די אנתה [אנת] פלח לה בתדירא הוא ישיזבנך
    kjvRefs:
    - Daniel 6:16
    kjvOsis:
    - Dan.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.18
    scripture: tanakh
    name: Tanakh Daniel 6:18
    ref: Daniel 6:18
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 18
    ordinal: 20584
    text: And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that nothing might be changed concerning Daniel.
    translation: JPS 1917
    original: וְהֵיתָיִת אֶבֶן חֲדָה וְשֻׂמַת עַל־פֻּם גֻּבָּא וְחַתְמַהּ מַלְכָּא בְּעִזְקְתֵהּ וּבְעִזְקָת רַבְרְבָנוֹהִי דִּי לָא־תִשְׁנֵא צְבוּ בְּדָנִיֵּאל׃
    hebrewPlain: והיתית אבן חדה ושמת על פם גבא וחתמה מלכא בעזקתה ובעזקת רברבנוהי די לא תשנא צבו בדניאל
    kjvRefs:
    - Daniel 6:17
    kjvOsis:
    - Dan.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.19
    scripture: tanakh
    name: Tanakh Daniel 6:19
    ref: Daniel 6:19
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 19
    ordinal: 20585
    text: Then the king went to his palace, and passed the night fasting; neither were diversions brought before him; and his sleep fled from him.
    translation: JPS 1917
    original: אֱדַיִן אֲזַל מַלְכָּא לְהֵיכְלֵהּ וּבָת טְוָת וְדַחֲוָן לָא־הַנְעֵל קָדָמוֹהִי וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי׃
    hebrewPlain: אדין אזל מלכא להיכלה ובת טות ודחון לא הנעל קדמוהי ושנתה נדת עלוהי
    kjvRefs:
    - Daniel 6:18
    kjvOsis:
    - Dan.6.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.20
    scripture: tanakh
    name: Tanakh Daniel 6:20
    ref: Daniel 6:20
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 20
    ordinal: 20586
    text: Then the king arose very early in the morning, and went in haste unto the den of lions.
    translation: JPS 1917
    original: בֵּאדַיִן מַלְכָּא בִּשְׁפַּרְפָּרָא יְקוּם בְּנָגְהָא וּבְהִתְבְּהָלָה לְגֻבָּא דִי־אַרְיָוָתָא אֲזַל׃
    hebrewPlain: באדין מלכא בשפרפרא יקום בנגהא ובהתבהלה לגבא די אריותא אזל
    kjvRefs:
    - Daniel 6:19
    kjvOsis:
    - Dan.6.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.21
    scripture: tanakh
    name: Tanakh Daniel 6:21
    ref: Daniel 6:21
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 21
    ordinal: 20587
    text: 'And when he came near unto the den to Daniel, he cried with a pained voice; the king spoke and said to Daniel: ‘O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?’'
    translation: JPS 1917
    original: וּכְמִקְרְבֵהּ לְגֻבָּא לְדָנִיֵּאל בְּקָל עֲצִיב זְעִק עָנֵה מַלְכָּא וְאָמַר לְדָנִיֵּאל דָּנִיֵּאל עֲבֵד אֱלָהָא חַיָּא אֱלָהָךְ דִּי אנתה [אַנְתְּ] פָּלַח־לֵהּ בִּתְדִירָא הַיְכִל לְשֵׁיזָבוּתָךְ מִן־אַרְיָוָתָא׃
    hebrewPlain: וכמקרבה לגבא לדניאל בקל עציב זעק ענה מלכא ואמר לדניאל דניאל עבד אלהא חיא אלהך די אנתה [אנת] פלח לה בתדירא היכל לשיזבותך מן אריותא
    kjvRefs:
    - Daniel 6:20
    kjvOsis:
    - Dan.6.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.22
    scripture: tanakh
    name: Tanakh Daniel 6:22
    ref: Daniel 6:22
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 22
    ordinal: 20588
    text: 'Then said Daniel unto the king: ‘O king, live for ever!'
    translation: JPS 1917
    original: אֱדַיִן דָּנִיֶּאל עִם־מַלְכָּא מַלִּל מַלְכָּא לְעָלְמִין חֱיִי׃
    hebrewPlain: אדין דניאל עם מלכא מלל מלכא לעלמין חיי
    kjvRefs:
    - Daniel 6:21
    kjvOsis:
    - Dan.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.23
    scripture: tanakh
    name: Tanakh Daniel 6:23
    ref: Daniel 6:23
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 23
    ordinal: 20589
    text: My God hath sent His angel, and hath shut the lions’ mouths, and they have not hurt me; forasmuch as before Him innocency was found in me; and also before thee, O king, have I done no hurt.’
    translation: JPS 1917
    original: אֱלָהִי שְׁלַח מַלְאֲכֵהּ וּסֲגַר פֻּם אַרְיָוָתָא וְלָא חַבְּלוּנִי כָּל־קֳבֵל דִּי קָדָמוֹהִי זָכוּ הִשְׁתְּכַחַת לִי וְאַף קדמיך [קָדָמָךְ] מַלְכָּא חֲבוּלָה לָא עַבְדֵת׃
    hebrewPlain: אלהי שלח מלאכה וסגר פם אריותא ולא חבלוני כל קבל די קדמוהי זכו השתכחת לי ואף קדמיך [קדמך] מלכא חבולה לא עבדת
    kjvRefs:
    - Daniel 6:22
    kjvOsis:
    - Dan.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.24
    scripture: tanakh
    name: Tanakh Daniel 6:24
    ref: Daniel 6:24
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 24
    ordinal: 20590
    text: Then was the king exceeding glad, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he had trusted in his God.
    translation: JPS 1917
    original: בֵּאדַיִן מַלְכָּא שַׂגִּיא טְאֵב עֲלוֹהִי וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה מִן־גֻּבָּא וְהֻסַּק דָּנִיֵּאל מִן־גֻּבָּא וְכָל־חֲבָל לָא־הִשְׁתְּכַח בֵּהּ דִּי הֵימִן בֵּאלָהֵהּ׃
    hebrewPlain: באדין מלכא שגיא טאב עלוהי ולדניאל אמר להנסקה מן גבא והסק דניאל מן גבא וכל חבל לא השתכח בה די הימן באלהה
    kjvRefs:
    - Daniel 6:23
    kjvOsis:
    - Dan.6.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.25
    scripture: tanakh
    name: Tanakh Daniel 6:25
    ref: Daniel 6:25
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 25
    ordinal: 20591
    text: And the king commanded, and they brought those men that had accused Daniel, and they cast them into the den of lions, them, their children, and their wives; and they had not come to the bottom of the den, when the lions had the mastery of them, and broke all their bones in pieces.
    translation: JPS 1917
    original: וַאֲמַר מַלְכָּא וְהַיְתִיו גֻּבְרַיָּא אִלֵּךְ דִּי־אֲכַלוּ קַרְצוֹהִי דִּי דָנִיֵּאל וּלְגֹב אַרְיָוָתָא רְמוֹ אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן וְלָא־מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי־שְׁלִטוּ בְהוֹן אַרְיָוָתָא וְכָל־גַּרְמֵיהוֹן הַדִּקוּ׃
    hebrewPlain: ואמר מלכא והיתיו גבריא אלך די אכלו קרצוהי די דניאל ולגב אריותא רמו אנון בניהון ונשיהון ולא מטו לארעית גבא עד די שלטו בהון אריותא וכל גרמיהון הדקו
    kjvRefs:
    - Daniel 6:24
    kjvOsis:
    - Dan.6.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.26
    scripture: tanakh
    name: Tanakh Daniel 6:26
    ref: Daniel 6:26
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 26
    ordinal: 20592
    text: 'Then king Darius wrote unto all the peoples, nations, and languages, that dwell in all the earth: ‘Peace be multiplied unto you.'
    translation: JPS 1917
    original: בֵּאדַיִן דָּרְיָוֶשׁ מַלְכָּא כְּתַב לְכָל־עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא דִּי־דארין [דָיְרִין] בְּכָל־אַרְעָא שְׁלָמְכוֹן יִשְׂגֵּא׃
    hebrewPlain: באדין דריוש מלכא כתב לכל עממיא אמיא ולשניא די דארין [דירין] בכל ארעא שלמכון ישגא
    kjvRefs:
    - Daniel 6:25
    kjvOsis:
    - Dan.6.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.27
    scripture: tanakh
    name: Tanakh Daniel 6:27
    ref: Daniel 6:27
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 27
    ordinal: 20593
    text: I make a decree, that in all the dominion of my kingdom men tremble and fear before the God of Daniel; For He is the living God, And stedfast for ever, And His kingdom that which shall not be destroyed, And His dominion shall be even unto the end;
    translation: JPS 1917
    original: מִן־קֳדָמַי שִׂים טְעֵם דִּי בְּכָל־שָׁלְטָן מַלְכוּתִי לֶהֱוֺן זאעין [זָיְעִין] וְדָחֲלִין מִן־קֳדָם אֱלָהֵהּ דִּי־דָנִיֵּאל דִּי־הוּא אֱלָהָא חַיָּא וְקַיָּם לְעָלְמִין וּמַלְכוּתֵהּ דִּי־לָא תִתְחַבַּל וְשָׁלְטָנֵהּ עַד־סוֹפָא׃
    hebrewPlain: מן קדמי שים טעם די בכל שלטן מלכותי להון זאעין [זיעין] ודחלין מן קדם אלהה די דניאל די הוא אלהא חיא וקים לעלמין ומלכותה די לא תתחבל ושלטנה עד סופא
    kjvRefs:
    - Daniel 6:26
    kjvOsis:
    - Dan.6.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.28
    scripture: tanakh
    name: Tanakh Daniel 6:28
    ref: Daniel 6:28
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 28
    ordinal: 20594
    text: He delivereth and rescueth, And He worketh signs and wonders In heaven and in earth; Who hath delivered Daniel from the power of the lions.’
    translation: JPS 1917
    original: מְשֵׁיזִב וּמַצִּל וְעָבֵד אָתִין וְתִמְהִין בִּשְׁמַיָּא וּבְאַרְעָא דִּי שֵׁיזִיב לְדָנִיֵּאל מִן־יַד אַרְיָוָתָא׃
    hebrewPlain: משיזב ומצל ועבד אתין ותמהין בשמיא ובארעא די שיזיב לדניאל מן יד אריותא
    kjvRefs:
    - Daniel 6:27
    kjvOsis:
    - Dan.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.6.29
    scripture: tanakh
    name: Tanakh Daniel 6:29
    ref: Daniel 6:29
    book: Dan
    section: ketuvim
    chapter: 6
    verse: 29
    ordinal: 20595
    text: So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian.
    translation: JPS 1917
    original: וְדָנִיֵּאל דְּנָה הַצְלַח בְּמַלְכוּת דָּרְיָוֶשׁ וּבְמַלְכוּת כּוֹרֶשׁ פרסיא [פָּרְסָאָה׃]
    hebrewPlain: ודניאל דנה הצלח במלכות דריוש ובמלכות כורש פרסיא [פרסאה]
    kjvRefs:
    - Daniel 6:28
    kjvOsis:
    - Dan.6.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.6
- type: TanakhVerse
  data:
    osis: Dan.7.1
    scripture: tanakh
    name: Tanakh Daniel 7:1
    ref: Daniel 7:1
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 20596
    text: In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed; then he wrote the dream and told the sum of the matters.
    translation: JPS 1917
    original: בִּשְׁנַת חֲדָה לְבֵלְאשַׁצַּר מֶלֶךְ בָּבֶל דָּנִיֵּאל חֵלֶם חֲזָה וְחֶזְוֵי רֵאשֵׁהּ עַל־מִשְׁכְּבֵהּ בֵּאדַיִן חֶלְמָא כְתַב רֵאשׁ מִלִּין אֲמַר׃
    hebrewPlain: בשנת חדה לבלאשצר מלך בבל דניאל חלם חזה וחזוי ראשה על משכבה באדין חלמא כתב ראש מלין אמר
    kjvRefs:
    - Daniel 7:1
    kjvOsis:
    - Dan.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.2
    scripture: tanakh
    name: Tanakh Daniel 7:2
    ref: Daniel 7:2
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 20597
    text: 'Daniel spoke and said: I saw in my vision by night, and, behold, the four winds of the heaven broke forth upon the great sea.'
    translation: JPS 1917
    original: עָנֵה דָנִיֵּאל וְאָמַר חָזֵה הֲוֵית בְּחֶזְוִי עִם־לֵילְיָא וַאֲרוּ אַרְבַּע רוּחֵי שְׁמַיָּא מְגִיחָן לְיַמָּא רַבָּא׃
    hebrewPlain: ענה דניאל ואמר חזה הוית בחזוי עם ליליא וארו ארבע רוחי שמיא מגיחן לימא רבא
    kjvRefs:
    - Daniel 7:2
    kjvOsis:
    - Dan.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.3
    scripture: tanakh
    name: Tanakh Daniel 7:3
    ref: Daniel 7:3
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 20598
    text: And four great beasts came up from the sea, diverse one from another.
    translation: JPS 1917
    original: וְאַרְבַּע חֵיוָן רַבְרְבָן סָלְקָן מִן־יַמָּא שָׁנְיָן דָּא מִן־דָּא׃
    hebrewPlain: וארבע חיון רברבן סלקן מן ימא שנין דא מן דא
    kjvRefs:
    - Daniel 7:3
    kjvOsis:
    - Dan.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.4
    scripture: tanakh
    name: Tanakh Daniel 7:4
    ref: Daniel 7:4
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 20599
    text: The first was like a lion, and had eagle’s wings; I beheld till the wings thereof were plucked off, and it was lifted up from the earth, and made stand upon two feet as a man, and a man’s heart was given to it.
    translation: JPS 1917
    original: קַדְמָיְתָא כְאַרְיֵה וְגַפִּין דִּי־נְשַׁר לַהּ חָזֵה הֲוֵית עַד דִּי־מְּרִיטוּ גַפַּיהּ וּנְטִילַת מִן־אַרְעָא וְעַל־רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת וּלְבַב אֱנָשׁ יְהִיב לַהּ׃
    hebrewPlain: קדמיתא כאריה וגפין די נשר לה חזה הוית עד די מריטו גפיה ונטילת מן ארעא ועל רגלין כאנש הקימת ולבב אנש יהיב לה
    kjvRefs:
    - Daniel 7:4
    kjvOsis:
    - Dan.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.5
    scripture: tanakh
    name: Tanakh Daniel 7:5
    ref: Daniel 7:5
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 20600
    text: 'And behold another beast, a second, like to a bear, and it raised up itself on one side, and it had three ribs in its mouth between its teeth; and it was said thus unto it: ‘Arise, devour much flesh.’'
    translation: JPS 1917
    original: וַאֲרוּ חֵיוָה אָחֳרִי תִנְיָנָה דָּמְיָה לְדֹב וְלִשְׂטַר־חַד הֳקִמַת וּתְלָת עִלְעִין בְּפֻמַּהּ בֵּין שניה [שִׁנַּהּ] וְכֵן אָמְרִין לַהּ קוּמִי אֲכֻלִי בְּשַׂר שַׂגִּיא׃
    hebrewPlain: וארו חיוה אחרי תנינה דמיה לדב ולשטר חד הקמת ותלת עלעין בפמה בין שניה [שנה] וכן אמרין לה קומי אכלי בשר שגיא
    kjvRefs:
    - Daniel 7:5
    kjvOsis:
    - Dan.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.6
    scripture: tanakh
    name: Tanakh Daniel 7:6
    ref: Daniel 7:6
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 20601
    text: After this I beheld, and lo another, like a leopard, which had upon the sides of it four wings of a fowl; the beast had also four heads; and dominion was given to it.
    translation: JPS 1917
    original: בָּאתַר דְּנָה חָזֵה הֲוֵית וַאֲרוּ אָחֳרִי כִּנְמַר וְלַהּ גַּפִּין אַרְבַּע דִּי־עוֹף עַל־גביה [גַּבַּהּ] וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא וְשָׁלְטָן יְהִיב לַהּ׃
    hebrewPlain: באתר דנה חזה הוית וארו אחרי כנמר ולה גפין ארבע די עוף על גביה [גבה] וארבעה ראשין לחיותא ושלטן יהיב לה
    kjvRefs:
    - Daniel 7:6
    kjvOsis:
    - Dan.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.7
    scripture: tanakh
    name: Tanakh Daniel 7:7
    ref: Daniel 7:7
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 20602
    text: After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth; it devoured and broke in pieces, and stamped the residue with its feet; and it was diverse from all the beasts that were before it; and it had ten horns.
    translation: JPS 1917
    original: בָּאתַר דְּנָה חָזֵה הֲוֵית בְּחֶזְוֵי לֵילְיָא וַאֲרוּ חֵיוָה רביעיה [רְבִיעָאָה] דְּחִילָה וְאֵימְתָנִי וְתַקִּיפָא יַתִּירָא וְשִׁנַּיִן דִּי־פַרְזֶל לַהּ רַבְרְבָן אָכְלָה וּמַדֱּקָה וּשְׁאָרָא ברגליה [בְּרַגְלַהּ] רָפְסָה וְהִיא מְשַׁנְּיָה מִן־כָּל־חֵיוָתָא דִּי קָדָמַיהּ וְקַרְנַיִן עֲשַׂר לַהּ׃
    hebrewPlain: באתר דנה חזה הוית בחזוי ליליא וארו חיוה רביעיה [רביעאה] דחילה ואימתני ותקיפא יתירא ושנין די פרזל לה רברבן אכלה ומדקה ושארא ברגליה [ברגלה] רפסה והיא משניה מן כל חיותא די קדמיה וקרנין עשר לה
    kjvRefs:
    - Daniel 7:7
    kjvOsis:
    - Dan.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.8
    scripture: tanakh
    name: Tanakh Daniel 7:8
    ref: Daniel 7:8
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 20603
    text: I considered the horns, and, behold, there came up among them another horn, a little one, before which three of the first horns were plucked up by the roots; and, behold, in this horn were eyes like the eyes of a man, and a mouth speaking great things.
    translation: JPS 1917
    original: מִשְׂתַּכַּל הֲוֵית בְּקַרְנַיָּא וַאֲלוּ קֶרֶן אָחֳרִי זְעֵירָה סִלְקָת ביניהון [בֵּינֵיהֵן] וּתְלָת מִן־קַרְנַיָּא קַדְמָיָתָא אתעקרו [אֶתְעֲקַרָה] מִן־קדמיה [קֳדָמַהּ] וַאֲלוּ עַיְנִין כְּעַיְנֵי אֲנָשָׁא בְּקַרְנָא־דָא וּפֻם מְמַלִּל רַבְרְבָן׃
    hebrewPlain: משתכל הוית בקרניא ואלו קרן אחרי זעירה סלקת ביניהון [ביניהן] ותלת מן קרניא קדמיתא אתעקרו [אתעקרה] מן קדמיה [קדמה] ואלו עינין כעיני אנשא בקרנא דא ופם ממלל רברבן
    kjvRefs:
    - Daniel 7:8
    kjvOsis:
    - Dan.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.9
    scripture: tanakh
    name: Tanakh Daniel 7:9
    ref: Daniel 7:9
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 20604
    text: 'I beheld Till thrones were placed, And one that was ancient of days did sit: His raiment was as white snow, And the hair of his head like pure wool; His throne was fiery flames, and the wheels thereof burning fire.'
    translation: JPS 1917
    original: חָזֵה הֲוֵית עַד דִּי כָרְסָוָן רְמִיו וְעַתִּיק יוֹמִין יְתִב לְבוּשֵׁהּ כִּתְלַג חִוָּר וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא כָּרְסְיֵהּ שְׁבִיבִין דִּי־נוּר גַּלְגִּלּוֹהִי נוּר דָּלִק׃
    hebrewPlain: חזה הוית עד די כרסון רמיו ועתיק יומין יתב לבושה כתלג חור ושער ראשה כעמר נקא כרסיה שביבין די נור גלגלוהי נור דלק
    kjvRefs:
    - Daniel 7:9
    kjvOsis:
    - Dan.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.10
    scripture: tanakh
    name: Tanakh Daniel 7:10
    ref: Daniel 7:10
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 20605
    text: A fiery stream issued And came forth from before him; thousand thousands ministered unto him, And ten thousand times ten thousand stood before him; The judgment was set, And the books were opened.
    translation: JPS 1917
    original: נְהַר דִּי־נוּר נָגֵד וְנָפֵק מִן־קֳדָמוֹהִי אֶלֶף אלפים [אַלְפִין] יְשַׁמְּשׁוּנֵּהּ וְרִבּוֹ רבון [רִבְבָן] קָדָמוֹהִי יְקוּמוּן דִּינָא יְתִב וְסִפְרִין פְּתִיחוּ׃
    hebrewPlain: נהר די נור נגד ונפק מן קדמוהי אלף אלפים [אלפין] ישמשונה ורבו רבון [רבבן] קדמוהי יקומון דינא יתב וספרין פתיחו
    kjvRefs:
    - Daniel 7:10
    kjvOsis:
    - Dan.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.11
    scripture: tanakh
    name: Tanakh Daniel 7:11
    ref: Daniel 7:11
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 11
    ordinal: 20606
    text: I beheld at that time because of the voice of the great words which the horn spoke, I beheld even till the beast was slain, and its body destroyed, and it was given to be burned with fire.
    translation: JPS 1917
    original: חָזֵה הֲוֵית בֵּאדַיִן מִן־קָל מִלַּיָּא רַבְרְבָתָא דִּי קַרְנָא מְמַלֱּלָה חָזֵה הֲוֵית עַד דִּי קְטִילַת חֵיוְתָא וְהוּבַד גִּשְׁמַהּ וִיהִיבַת לִיקֵדַת אֶשָּׁא׃
    hebrewPlain: חזה הוית באדין מן קל מליא רברבתא די קרנא ממללה חזה הוית עד די קטילת חיותא והובד גשמה ויהיבת ליקדת אשא
    kjvRefs:
    - Daniel 7:11
    kjvOsis:
    - Dan.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.12
    scripture: tanakh
    name: Tanakh Daniel 7:12
    ref: Daniel 7:12
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 12
    ordinal: 20607
    text: And as for the rest of the beasts, their dominion was taken away; yet their lives were prolonged for a season and a time.
    translation: JPS 1917
    original: וּשְׁאָר חֵיוָתָא הֶעְדִּיו שָׁלְטָנְהוֹן וְאַרְכָה בְחַיִּין יְהִיבַת לְהוֹן עַד־זְמַן וְעִדָּן׃
    hebrewPlain: ושאר חיותא העדיו שלטנהון וארכה בחיין יהיבת להון עד זמן ועדן
    kjvRefs:
    - Daniel 7:12
    kjvOsis:
    - Dan.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.13
    scripture: tanakh
    name: Tanakh Daniel 7:13
    ref: Daniel 7:13
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 13
    ordinal: 20608
    text: I saw in the night visions, And, behold, there came with the clouds of heaven One like unto a son of man, And he came even to the Ancient of days, And he was brought near before Him.
    translation: JPS 1917
    original: חָזֵה הֲוֵית בְּחֶזְוֵי לֵילְיָא וַאֲרוּ עִם־עֲנָנֵי שְׁמַיָּא כְּבַר אֱנָשׁ אָתֵה הֲוָה וְעַד־עַתִּיק יוֹמַיָּא מְטָה וּקְדָמוֹהִי הַקְרְבוּהִי׃
    hebrewPlain: חזה הוית בחזוי ליליא וארו עם ענני שמיא כבר אנש אתה הוה ועד עתיק יומיא מטה וקדמוהי הקרבוהי
    kjvRefs:
    - Daniel 7:13
    kjvOsis:
    - Dan.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.14
    scripture: tanakh
    name: Tanakh Daniel 7:14
    ref: Daniel 7:14
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 14
    ordinal: 20609
    text: And there was given him dominion, And glory, and a kingdom, That all the peoples, nations, and languages Should serve him; His dominion is an everlasting dominion, which shall not pass away, And his kingdom that which shall not be destroyed.
    translation: JPS 1917
    original: וְלֵהּ יְהִיב שָׁלְטָן וִיקָר וּמַלְכוּ וְכֹל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא לֵהּ יִפְלְחוּן שָׁלְטָנֵהּ שָׁלְטָן עָלַם דִּי־לָא יֶעְדֵּה וּמַלְכוּתֵהּ דִּי־לָא תִתְחַבַּל׃
    hebrewPlain: ולה יהיב שלטן ויקר ומלכו וכל עממיא אמיא ולשניא לה יפלחון שלטנה שלטן עלם די לא יעדה ומלכותה די לא תתחבל
    kjvRefs:
    - Daniel 7:14
    kjvOsis:
    - Dan.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.15
    scripture: tanakh
    name: Tanakh Daniel 7:15
    ref: Daniel 7:15
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 15
    ordinal: 20610
    text: As for me Daniel, my spirit was pained in the midst of my body, and the visions of my head affrighted me. .
    translation: JPS 1917
    original: אֶתְכְּרִיַּת רוּחִי אֲנָה דָנִיֵּאל בְּגוֹא נִדְנֶה וְחֶזְוֵי רֵאשִׁי יְבַהֲלֻנַּנִי׃
    hebrewPlain: אתכרית רוחי אנה דניאל בגוא נדנה וחזוי ראשי יבהלנני
    kjvRefs:
    - Daniel 7:15
    kjvOsis:
    - Dan.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.16
    scripture: tanakh
    name: Tanakh Daniel 7:16
    ref: Daniel 7:16
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 16
    ordinal: 20611
    text: 'I came near unto one of them that stood by, and asked him the truth concerning all this. So he told me, and made me know the interpretation of the things:'
    translation: JPS 1917
    original: קִרְבֵת עַל־חַד מִן־קָאֲמַיָּא וְיַצִּיבָא אֶבְעֵא־מִנֵּהּ עַל־כָּל־דְּנָה וַאֲמַר־לִי וּפְשַׁר מִלַּיָּא יְהוֹדְעִנַּנִי׃
    hebrewPlain: קרבת על חד מן קאמיא ויציבא אבעא מנה על כל דנה ואמר לי ופשר מליא יהודענני
    kjvRefs:
    - Daniel 7:16
    kjvOsis:
    - Dan.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.17
    scripture: tanakh
    name: Tanakh Daniel 7:17
    ref: Daniel 7:17
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 17
    ordinal: 20612
    text: ’These great beasts, which are four, are four kings, that shall arise out of the earth.
    translation: JPS 1917
    original: אִלֵּין חֵיוָתָא רַבְרְבָתָא דִּי אִנִּין אַרְבַּע אַרְבְּעָה מַלְכִין יְקוּמוּן מִן־אַרְעָא׃
    hebrewPlain: אלין חיותא רברבתא די אנין ארבע ארבעה מלכין יקומון מן ארעא
    kjvRefs:
    - Daniel 7:17
    kjvOsis:
    - Dan.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.18
    scripture: tanakh
    name: Tanakh Daniel 7:18
    ref: Daniel 7:18
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 18
    ordinal: 20613
    text: But the saints of the Most High shall receive the kingdom, and possess the kingdom for ever, even for ever and ever.’
    translation: JPS 1917
    original: וִיקַבְּלוּן מַלְכוּתָא קַדִּישֵׁי עֶלְיוֹנִין וְיַחְסְנוּן מַלְכוּתָא עַד־עָלְמָא וְעַד עָלַם עָלְמַיָּא׃
    hebrewPlain: ויקבלון מלכותא קדישי עליונין ויחסנון מלכותא עד עלמא ועד עלם עלמיא
    kjvRefs:
    - Daniel 7:18
    kjvOsis:
    - Dan.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.19
    scripture: tanakh
    name: Tanakh Daniel 7:19
    ref: Daniel 7:19
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 19
    ordinal: 20614
    text: Then I desired to know the truth concerning the fourth beast, which was diverse from all of them, exceeding terrible, whose teeth were of iron, and its nails of brass; which devoured, brake in pieces, and stamped the residue with its feet;
    translation: JPS 1917
    original: אֱדַיִן צְבִית לְיַצָּבָא עַל־חֵיוְתָא רְבִיעָיְתָא דִּי־הֲוָת שָׁנְיָה מִן־כלהון [כָּלְּהֵין] דְּחִילָה יַתִּירָה שניה [שִׁנַּהּ] דִּי־פַרְזֶל וְטִפְרַיהּ דִּי־נְחָשׁ אָכְלָה מַדֲּקָה וּשְׁאָרָא בְּרַגְלַיהּ רָפְסָה׃
    hebrewPlain: אדין צבית ליצבא על חיותא רביעיתא די הות שניה מן כלהון [כלהין] דחילה יתירה שניה [שנה] די פרזל וטפריה די נחש אכלה מדקה ושארא ברגליה רפסה
    kjvRefs:
    - Daniel 7:19
    kjvOsis:
    - Dan.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.20
    scripture: tanakh
    name: Tanakh Daniel 7:20
    ref: Daniel 7:20
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 20
    ordinal: 20615
    text: and concerning the ten horns that were on its head, and the other horn which came up, and before which three fell; even that horn that had eyes, and a mouth that spoke great things, whose appearance was greater than that of its fellows.
    translation: JPS 1917
    original: וְעַל־קַרְנַיָּא עֲשַׂר דִּי בְרֵאשַׁהּ וְאָחֳרִי דִּי סִלְקַת ונפלו [וּנְפַלָה] מִן־קדמיה [קֳדָמַהּ] תְּלָת וְקַרְנָא דִכֵּן וְעַיְנִין לַהּ וְפֻם מְמַלִּל רַבְרְבָן וְחֶזְוַהּ רַב מִן־חַבְרָתַהּ׃
    hebrewPlain: ועל קרניא עשר די בראשה ואחרי די סלקת ונפלו [ונפלה] מן קדמיה [קדמה] תלת וקרנא דכן ועינין לה ופם ממלל רברבן וחזוה רב מן חברתה
    kjvRefs:
    - Daniel 7:20
    kjvOsis:
    - Dan.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.21
    scripture: tanakh
    name: Tanakh Daniel 7:21
    ref: Daniel 7:21
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 21
    ordinal: 20616
    text: I beheld, and the same horn made war with the saints, and prevailed against them;
    translation: JPS 1917
    original: חָזֵה הֲוֵית וְקַרְנָא דִכֵּן עָבְדָה קְרָב עִם־קַדִּישִׁין וְיָכְלָה לְהוֹן׃
    hebrewPlain: חזה הוית וקרנא דכן עבדה קרב עם קדישין ויכלה להון
    kjvRefs:
    - Daniel 7:21
    kjvOsis:
    - Dan.7.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.22
    scripture: tanakh
    name: Tanakh Daniel 7:22
    ref: Daniel 7:22
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 22
    ordinal: 20617
    text: until the Ancient of days came, and judgment was given for the saints of the Most High; and the time came, and the saints possessed the kingdom.
    translation: JPS 1917
    original: עַד דִּי־אֲתָה עַתִּיק יוֹמַיָּא וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין וְזִמְנָא מְטָה וּמַלְכוּתָא הֶחֱסִנוּ קַדִּישִׁין׃
    hebrewPlain: עד די אתה עתיק יומיא ודינא יהב לקדישי עליונין וזמנא מטה ומלכותא החסנו קדישין
    kjvRefs:
    - Daniel 7:22
    kjvOsis:
    - Dan.7.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.23
    scripture: tanakh
    name: Tanakh Daniel 7:23
    ref: Daniel 7:23
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 23
    ordinal: 20618
    text: 'Thus he said: ‘The fourth beast shall be a fourth kingdom upon earth, which shall be diverse from all the kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.'
    translation: JPS 1917
    original: כֵּן אֲמַר חֵיוְתָא רְבִיעָיְתָא מַלְכוּ רביעיא [רְבִיעָאָה] תֶּהֱוֵא בְאַרְעָא דִּי תִשְׁנֵא מִן־כָּל־מַלְכְוָתָא וְתֵאכֻל כָּל־אַרְעָא וּתְדוּשִׁנַּהּ וְתַדְּקִנַּהּ׃
    hebrewPlain: כן אמר חיותא רביעיתא מלכו רביעיא [רביעאה] תהוא בארעא די תשנא מן כל מלכותא ותאכל כל ארעא ותדושנה ותדקנה
    kjvRefs:
    - Daniel 7:23
    kjvOsis:
    - Dan.7.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.24
    scripture: tanakh
    name: Tanakh Daniel 7:24
    ref: Daniel 7:24
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 24
    ordinal: 20619
    text: And as for the ten horns, out of this kingdom shall ten kings arise; and another shall arise after them; and he shall be diverse from the former, and he shall put down three kings.
    translation: JPS 1917
    original: וְקַרְנַיָּא עֲשַׂר מִנַּהּ מַלְכוּתָה עַשְׂרָה מַלְכִין יְקֻמוּן וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן וְהוּא יִשְׁנֵא מִן־קַדְמָיֵא וּתְלָתָה מַלְכִין יְהַשְׁפִּל׃
    hebrewPlain: וקרניא עשר מנה מלכותה עשרה מלכין יקמון ואחרן יקום אחריהון והוא ישנא מן קדמיא ותלתה מלכין יהשפל
    kjvRefs:
    - Daniel 7:24
    kjvOsis:
    - Dan.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.25
    scripture: tanakh
    name: Tanakh Daniel 7:25
    ref: Daniel 7:25
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 25
    ordinal: 20620
    text: And he shall speak words against the Most High, and shall wear out the saints of the Most High; and he shall think to change the seasons and the law; and they shall be given into his hand until a time and times and half a time.
    translation: JPS 1917
    original: וּמִלִּין לְצַד עליא [עִלָּאָה] יְמַלִּל וּלְקַדִּישֵׁי עֶלְיוֹנִין יְבַלֵּא וְיִסְבַּר לְהַשְׁנָיָה זִמְנִין וְדָת וְיִתְיַהֲבוּן בִּידֵהּ עַד־עִדָּן וְעִדָּנִין וּפְלַג עִדָּן׃
    hebrewPlain: ומלין לצד עליא [עלאה] ימלל ולקדישי עליונין יבלא ויסבר להשניה זמנין ודת ויתיהבון בידה עד עדן ועדנין ופלג עדן
    kjvRefs:
    - Daniel 7:25
    kjvOsis:
    - Dan.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.26
    scripture: tanakh
    name: Tanakh Daniel 7:26
    ref: Daniel 7:26
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 26
    ordinal: 20621
    text: But the judgment shall sit, and his dominions shall be taken away, to be consumed and to be destroy unto the end.
    translation: JPS 1917
    original: וְדִינָא יִתִּב וְשָׁלְטָנֵהּ יְהַעְדּוֹן לְהַשְׁמָדָה וּלְהוֹבָדָה עַד־סוֹפָא׃
    hebrewPlain: ודינא יתב ושלטנה יהעדון להשמדה ולהובדה עד סופא
    kjvRefs:
    - Daniel 7:26
    kjvOsis:
    - Dan.7.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.27
    scripture: tanakh
    name: Tanakh Daniel 7:27
    ref: Daniel 7:27
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 27
    ordinal: 20622
    text: And the kingdom and the dominion, and the greatness of the kingdoms under the whole heaven, shall be given to the people of the saints of the Most High; their kingdom is an everlasting kingdom, and all dominions shall serve and obey them.’
    translation: JPS 1917
    original: וּמַלְכוּתָה וְשָׁלְטָנָא וּרְבוּתָא דִּי מַלְכְוָת תְּחוֹת כָּל־שְׁמַיָּא יְהִיבַת לְעַם קַדִּישֵׁי עֶלְיוֹנִין מַלְכוּתֵהּ מַלְכוּת עָלַם וְכֹל שָׁלְטָנַיָּא לֵהּ יִפְלְחוּן וְיִשְׁתַּמְּעוּן׃
    hebrewPlain: ומלכותה ושלטנא ורבותא די מלכות תחות כל שמיא יהיבת לעם קדישי עליונין מלכותה מלכות עלם וכל שלטניא לה יפלחון וישתמעון
    kjvRefs:
    - Daniel 7:27
    kjvOsis:
    - Dan.7.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.7.28
    scripture: tanakh
    name: Tanakh Daniel 7:28
    ref: Daniel 7:28
    book: Dan
    section: ketuvim
    chapter: 7
    verse: 28
    ordinal: 20623
    text: Here is the end of the matter. As for me Daniel, my thoughts much affrighted me, and my countenance was changed in me; but I kept the matter in my heart.
    translation: JPS 1917
    original: עַד־כָּה סוֹפָא דִי־מִלְּתָא אֲנָה דָנִיֵּאל שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי וְזִיוַי יִשְׁתַּנּוֹן עֲלַי וּמִלְּתָא בְּלִבִּי נִטְרֵת׃
    hebrewPlain: עד כה סופא די מלתא אנה דניאל שגיא רעיוני יבהלנני וזיוי ישתנון עלי ומלתא בלבי נטרת
    kjvRefs:
    - Daniel 7:28
    kjvOsis:
    - Dan.7.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.7
- type: TanakhVerse
  data:
    osis: Dan.8.1
    scripture: tanakh
    name: Tanakh Daniel 8:1
    ref: Daniel 8:1
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 20624
    text: In the third year of the reign of king Belshazzar a vision appeared unto me, even unto me Daniel, after that which appeared unto me at the first.
    translation: JPS 1917
    original: בִּשְׁנַת שָׁלוֹשׁ לְמַלְכוּת בֵּלְאשַׁצַּר הַמֶּלֶךְ חָזוֹן נִרְאָה אֵלַי אֲנִי דָנִיֵּאל אַחֲרֵי הַנִּרְאָה אֵלַי בַּתְּחִלָּה׃
    hebrewPlain: בשנת שלוש למלכות בלאשצר המלך חזון נראה אלי אני דניאל אחרי הנראה אלי בתחלה
    kjvRefs:
    - Daniel 8:1
    kjvOsis:
    - Dan.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.2
    scripture: tanakh
    name: Tanakh Daniel 8:2
    ref: Daniel 8:2
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 20625
    text: And I saw in the vision; now it was so, that when I saw, I was in Shushan the castle, which is in the province of Elam; and I saw in the vision, and I was by the stream Ulai.
    translation: JPS 1917
    original: וָאֶרְאֶה בֶּחָזוֹן וַיְהִי בִּרְאֹתִי וַאֲנִי בְּשׁוּשַׁן הַבִּירָה אֲשֶׁר בְּעֵילָם הַמְּדִינָה וָאֶרְאֶה בֶּחָזוֹן וַאֲנִי הָיִיתִי עַל־אוּבַל אוּלָי׃
    hebrewPlain: ואראה בחזון ויהי בראתי ואני בשושן הבירה אשר בעילם המדינה ואראה בחזון ואני הייתי על אובל אולי
    kjvRefs:
    - Daniel 8:2
    kjvOsis:
    - Dan.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.3
    scripture: tanakh
    name: Tanakh Daniel 8:3
    ref: Daniel 8:3
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 20626
    text: And I lifted up mine eyes, and saw, and, behold, there stood before the stream a ram which had two horns; and the two horns were high; but one was higher than the other, and the higher came up last.
    translation: JPS 1917
    original: וָאֶשָּׂא עֵינַי וָאֶרְאֶה וְהִנֵּה אַיִל אֶחָד עֹמֵד לִפְנֵי הָאֻבָל וְלוֹ קְרָנָיִם וְהַקְּרָנַיִם גְּבֹהוֹת וְהָאַחַת גְּבֹהָה מִן־הַשֵּׁנִית וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה׃
    hebrewPlain: ואשא עיני ואראה והנה איל אחד עמד לפני האבל ולו קרנים והקרנים גבהות והאחת גבהה מן השנית והגבהה עלה באחרנה
    kjvRefs:
    - Daniel 8:3
    kjvOsis:
    - Dan.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.4
    scripture: tanakh
    name: Tanakh Daniel 8:4
    ref: Daniel 8:4
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 20627
    text: I saw the ram pushing westward, and northward, and southward; and no beasts could stand before him, neither was there any that could deliver out of his hand; but he did according to his will, and magnified himself.
    translation: JPS 1917
    original: רָאִיתִי אֶת־הָאַיִל מְנַגֵּחַ יָמָּה וְצָפוֹנָה וָנֶגְבָּה וְכָל־חַיּוֹת לֹא־יַעַמְדוּ לְפָנָיו וְאֵין מַצִּיל מִיָּדוֹ וְעָשָׂה כִרְצֹנוֹ וְהִגְדִּיל׃
    hebrewPlain: ראיתי את האיל מנגח ימה וצפונה ונגבה וכל חיות לא יעמדו לפניו ואין מציל מידו ועשה כרצנו והגדיל
    kjvRefs:
    - Daniel 8:4
    kjvOsis:
    - Dan.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.5
    scripture: tanakh
    name: Tanakh Daniel 8:5
    ref: Daniel 8:5
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 20628
    text: And as I was considering, behold, a he-goat came from the west over the face of the whole earth, and touched not the ground; and the goat had a conspicuous horn between his eyes.
    translation: JPS 1917
    original: וַאֲנִי הָיִיתִי מֵבִין וְהִנֵּה צְפִיר־הָעִזִּים בָּא מִן־הַמַּעֲרָב עַל־פְּנֵי כָל־הָאָרֶץ וְאֵין נוֹגֵעַ בָּאָרֶץ וְהַצָּפִיר קֶרֶן חָזוּת בֵּין עֵינָיו׃
    hebrewPlain: ואני הייתי מבין והנה צפיר העזים בא מן המערב על פני כל הארץ ואין נוגע בארץ והצפיר קרן חזות בין עיניו
    kjvRefs:
    - Daniel 8:5
    kjvOsis:
    - Dan.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.6
    scripture: tanakh
    name: Tanakh Daniel 8:6
    ref: Daniel 8:6
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 20629
    text: And he came to the ram that had the two horns, which I saw standing before the stream, and ran at him in the fury of his power.
    translation: JPS 1917
    original: וַיָּבֹא עַד־הָאַיִל בַּעַל הַקְּרָנַיִם אֲשֶׁר רָאִיתִי עֹמֵד לִפְנֵי הָאֻבָל וַיָּרָץ אֵלָיו בַּחֲמַת כֹּחוֹ׃
    hebrewPlain: ויבא עד האיל בעל הקרנים אשר ראיתי עמד לפני האבל וירץ אליו בחמת כחו
    kjvRefs:
    - Daniel 8:6
    kjvOsis:
    - Dan.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.7
    scripture: tanakh
    name: Tanakh Daniel 8:7
    ref: Daniel 8:7
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 20630
    text: And I saw him come close unto the ram, and he was moved with choler against him, and smote the ram, and broke his two horns; and there was no power in the ram to stand before him; but he cast him down to the ground, and trampled upon him; and there was none that could deliver the ram out of his hand.
    translation: JPS 1917
    original: וּרְאִיתִיו מַגִּיעַ אֵצֶל הָאַיִל וַיִּתְמַרְמַר אֵלָיו וַיַּךְ אֶת־הָאַיִל וַיְשַׁבֵּר אֶת־שְׁתֵּי קְרָנָיו וְלֹא־הָיָה כֹחַ בָּאַיִל לַעֲמֹד לְפָנָיו וַיַּשְׁלִיכֵהוּ אַרְצָה וַיִּרְמְסֵהוּ וְלֹא־הָיָה מַצִּיל לָאַיִל מִיָּדוֹ׃
    hebrewPlain: וראיתיו מגיע אצל האיל ויתמרמר אליו ויך את האיל וישבר את שתי קרניו ולא היה כח באיל לעמד לפניו וישליכהו ארצה וירמסהו ולא היה מציל לאיל מידו
    kjvRefs:
    - Daniel 8:7
    kjvOsis:
    - Dan.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.8
    scripture: tanakh
    name: Tanakh Daniel 8:8
    ref: Daniel 8:8
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 20631
    text: And the he-goat magnified himself exceedingly; and when he was strong, the great horn was broken; and instead of it there came up the appearance of four horns toward the four winds of heaven.
    translation: JPS 1917
    original: וּצְפִיר הָעִזִּים הִגְדִּיל עַד־מְאֹד וּכְעָצְמוֹ נִשְׁבְּרָה הַקֶּרֶן הַגְּדוֹלָה וַתַּעֲלֶנָה חָזוּת אַרְבַּע תַּחְתֶּיהָ לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם׃
    hebrewPlain: וצפיר העזים הגדיל עד מאד וכעצמו נשברה הקרן הגדולה ותעלנה חזות ארבע תחתיה לארבע רוחות השמים
    kjvRefs:
    - Daniel 8:8
    kjvOsis:
    - Dan.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.9
    scripture: tanakh
    name: Tanakh Daniel 8:9
    ref: Daniel 8:9
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 20632
    text: And out of one of them came forth a little horn, which waxed exceeding great, toward the south, and toward the east, and toward the beauteous land.
    translation: JPS 1917
    original: וּמִן־הָאַחַת מֵהֶם יָצָא קֶרֶן־אַחַת מִצְּעִירָה וַתִּגְדַּל־יֶתֶר אֶל־הַנֶּגֶב וְאֶל־הַמִּזְרָח וְאֶל־הַצֶּבִי׃
    hebrewPlain: ומן האחת מהם יצא קרן אחת מצעירה ותגדל יתר אל הנגב ואל המזרח ואל הצבי
    kjvRefs:
    - Daniel 8:9
    kjvOsis:
    - Dan.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.10
    scripture: tanakh
    name: Tanakh Daniel 8:10
    ref: Daniel 8:10
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 20633
    text: And it waxed great, even to the host of heaven; and some of the host and of the stars it cast down to the ground, and trampled upon them.
    translation: JPS 1917
    original: וַתִּגְדַּל עַד־צְבָא הַשָּׁמָיִם וַתַּפֵּל אַרְצָה מִן־הַצָּבָא וּמִן־הַכּוֹכָבִים וַתִּרְמְסֵם׃
    hebrewPlain: ותגדל עד צבא השמים ותפל ארצה מן הצבא ומן הכוכבים ותרמסם
    kjvRefs:
    - Daniel 8:10
    kjvOsis:
    - Dan.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.11
    scripture: tanakh
    name: Tanakh Daniel 8:11
    ref: Daniel 8:11
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 20634
    text: Yea, it magnified itself, even to the prince of the host; and from him the continual burnt-offering was taken away, and the place of his sanctuary was cast down.
    translation: JPS 1917
    original: וְעַד שַׂר־הַצָּבָא הִגְדִּיל וּמִמֶּנּוּ הרים [הוּרַם] הַתָּמִיד וְהֻשְׁלַךְ מְכוֹן מִקְדָּשׁוֹ׃
    hebrewPlain: ועד שר הצבא הגדיל וממנו הרים [הורם] התמיד והשלך מכון מקדשו
    kjvRefs:
    - Daniel 8:11
    kjvOsis:
    - Dan.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.12
    scripture: tanakh
    name: Tanakh Daniel 8:12
    ref: Daniel 8:12
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 20635
    text: And the host was given over to it together with the continual burnt-offering through transgression; and it cast down truth to the ground, and it wrought, and prospered.
    translation: JPS 1917
    original: וְצָבָא תִּנָּתֵן עַל־הַתָּמִיד בְּפָשַׁע וְתַשְׁלֵךְ אֱמֶת אַרְצָה וְעָשְׂתָה וְהִצְלִיחָה׃
    hebrewPlain: וצבא תנתן על התמיד בפשע ותשלך אמת ארצה ועשתה והצליחה
    kjvRefs:
    - Daniel 8:12
    kjvOsis:
    - Dan.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.13
    scripture: tanakh
    name: Tanakh Daniel 8:13
    ref: Daniel 8:13
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 20636
    text: 'Then I heard a holy one speaking; and another holy one said unto that certain one who spoke: ‘How long shall be the vision concerning the continual burnt-offering, and the transgression that causes appalment, to give both the sanctuary and the host to be trampled under foot?’'
    translation: JPS 1917
    original: וָאֶשְׁמְעָה אֶחָד־קָדוֹשׁ מְדַבֵּר וַיֹּאמֶר אֶחָד קָדוֹשׁ לַפַּלְמוֹנִי הַמְדַבֵּר עַד־מָתַי הֶחָזוֹן הַתָּמִיד וְהַפֶּשַׁע שֹׁמֵם תֵּת וְקֹדֶשׁ וְצָבָא מִרְמָס׃
    hebrewPlain: ואשמעה אחד קדוש מדבר ויאמר אחד קדוש לפלמוני המדבר עד מתי החזון התמיד והפשע שמם תת וקדש וצבא מרמס
    kjvRefs:
    - Daniel 8:13
    kjvOsis:
    - Dan.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.14
    scripture: tanakh
    name: Tanakh Daniel 8:14
    ref: Daniel 8:14
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 20637
    text: 'And he said unto me: ‘Unto two thousand and three hundred evenings and mornings; then shall the sanctuary be victorious.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי עַד עֶרֶב בֹּקֶר אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת וְנִצְדַּק קֹדֶשׁ׃
    hebrewPlain: ויאמר אלי עד ערב בקר אלפים ושלש מאות ונצדק קדש
    kjvRefs:
    - Daniel 8:14
    kjvOsis:
    - Dan.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.15
    scripture: tanakh
    name: Tanakh Daniel 8:15
    ref: Daniel 8:15
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 20638
    text: And it came to pass, when I, even I Daniel, had seen the vision, that I sought to understand it; and, behold, there stood before me as the appearance of a man.
    translation: JPS 1917
    original: וַיְהִי בִּרְאֹתִי אֲנִי דָנִיֵּאל אֶת־הֶחָזוֹן וָאֲבַקְשָׁה בִינָה וְהִנֵּה עֹמֵד לְנֶגְדִּי כְּמַרְאֵה־גָבֶר׃
    hebrewPlain: ויהי בראתי אני דניאל את החזון ואבקשה בינה והנה עמד לנגדי כמראה גבר
    kjvRefs:
    - Daniel 8:15
    kjvOsis:
    - Dan.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.16
    scripture: tanakh
    name: Tanakh Daniel 8:16
    ref: Daniel 8:16
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 20639
    text: 'And I heard the voice of a man between the banks of Ulai, who called, and said: ‘Gabriel, make this man to understand the vision.’'
    translation: JPS 1917
    original: וָאֶשְׁמַע קוֹל־אָדָם בֵּין אוּלָי וַיִּקְרָא וַיֹּאמַר גַּבְרִיאֵל הָבֵן לְהַלָּז אֶת־הַמַּרְאֶה׃
    hebrewPlain: ואשמע קול אדם בין אולי ויקרא ויאמר גבריאל הבן להלז את המראה
    kjvRefs:
    - Daniel 8:16
    kjvOsis:
    - Dan.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.17
    scripture: tanakh
    name: Tanakh Daniel 8:17
    ref: Daniel 8:17
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 20640
    text: 'So he came near where I stood; and when he came, I was terrified, and fell upon my face; but he said unto me: ‘Understand, O son of man; for the vision belongeth to the time of the end.’'
    translation: JPS 1917
    original: וַיָּבֹא אֵצֶל עָמְדִי וּבְבֹאוֹ נִבְעַתִּי וָאֶפְּלָה עַל־פָּנָי וַיֹּאמֶר אֵלַי הָבֵן בֶּן־אָדָם כִּי לְעֶת־קֵץ הֶחָזוֹן׃
    hebrewPlain: ויבא אצל עמדי ובבאו נבעתי ואפלה על פני ויאמר אלי הבן בן אדם כי לעת קץ החזון
    kjvRefs:
    - Daniel 8:17
    kjvOsis:
    - Dan.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.18
    scripture: tanakh
    name: Tanakh Daniel 8:18
    ref: Daniel 8:18
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 18
    ordinal: 20641
    text: Now as he was speaking with me, I fell into a deep sleep with my face toward the ground; but he touched me, and set me upright.
    translation: JPS 1917
    original: וּבְדַבְּרוֹ עִמִּי נִרְדַּמְתִּי עַל־פָּנַי אָרְצָה וַיִּגַּע־בִּי וַיַּעֲמִידֵנִי עַל־עָמְדִי׃
    hebrewPlain: ובדברו עמי נרדמתי על פני ארצה ויגע בי ויעמידני על עמדי
    kjvRefs:
    - Daniel 8:18
    kjvOsis:
    - Dan.8.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.19
    scripture: tanakh
    name: Tanakh Daniel 8:19
    ref: Daniel 8:19
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 19
    ordinal: 20642
    text: 'And he said: ‘Behold, I will make thee know what shall be in the latter time of the indignation; for it belongeth to the appointed time of the end.'
    translation: JPS 1917
    original: וַיֹּאמֶר הִנְנִי מוֹדִיעֲךָ אֵת אֲשֶׁר־יִהְיֶה בְּאַחֲרִית הַזָּעַם כִּי לְמוֹעֵד קֵץ׃
    hebrewPlain: ויאמר הנני מודיעך את אשר יהיה באחרית הזעם כי למועד קץ
    kjvRefs:
    - Daniel 8:19
    kjvOsis:
    - Dan.8.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.20
    scripture: tanakh
    name: Tanakh Daniel 8:20
    ref: Daniel 8:20
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 20
    ordinal: 20643
    text: The ram which thou sawest having the two horns, they are the kings of Media and Persia.
    translation: JPS 1917
    original: הָאַיִל אֲשֶׁר־רָאִיתָ בַּעַל הַקְּרָנָיִם מַלְכֵי מָדַי וּפָרָס׃
    hebrewPlain: האיל אשר ראית בעל הקרנים מלכי מדי ופרס
    kjvRefs:
    - Daniel 8:20
    kjvOsis:
    - Dan.8.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.21
    scripture: tanakh
    name: Tanakh Daniel 8:21
    ref: Daniel 8:21
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 21
    ordinal: 20644
    text: And the rough he-goat is the king of Greece; and the great horn that is between his eyes is the first king.
    translation: JPS 1917
    original: וְהַצָּפִיר הַשָּׂעִיר מֶלֶךְ יָוָן וְהַקֶּרֶן הַגְּדוֹלָה אֲשֶׁר בֵּין־עֵינָיו הוּא הַמֶּלֶךְ הָרִאשׁוֹן׃
    hebrewPlain: והצפיר השעיר מלך יון והקרן הגדולה אשר בין עיניו הוא המלך הראשון
    kjvRefs:
    - Daniel 8:21
    kjvOsis:
    - Dan.8.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.22
    scripture: tanakh
    name: Tanakh Daniel 8:22
    ref: Daniel 8:22
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 22
    ordinal: 20645
    text: And as for that which was broken, in the place whereof four stood up, four kingdoms shall stand up out of the nation, but not with his power.
    translation: JPS 1917
    original: וְהַנִּשְׁבֶּרֶת וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ אַרְבַּע מַלְכֻיוֹת מִגּוֹי יַעֲמֹדְנָה וְלֹא בְכֹחוֹ׃
    hebrewPlain: והנשברת ותעמדנה ארבע תחתיה ארבע מלכיות מגוי יעמדנה ולא בכחו
    kjvRefs:
    - Daniel 8:22
    kjvOsis:
    - Dan.8.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.23
    scripture: tanakh
    name: Tanakh Daniel 8:23
    ref: Daniel 8:23
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 23
    ordinal: 20646
    text: And in the latter time of their kingdom, when the transgressors have completed their transgression, there shall stand up a king of fierce countenance, and understanding stratagems.
    translation: JPS 1917
    original: וּבְאַחֲרִית מַלְכוּתָם כְּהָתֵם הַפֹּשְׁעִים יַעֲמֹד מֶלֶךְ עַז־פָּנִים וּמֵבִין חִידוֹת׃
    hebrewPlain: ובאחרית מלכותם כהתם הפשעים יעמד מלך עז פנים ומבין חידות
    kjvRefs:
    - Daniel 8:23
    kjvOsis:
    - Dan.8.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.24
    scripture: tanakh
    name: Tanakh Daniel 8:24
    ref: Daniel 8:24
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 24
    ordinal: 20647
    text: And his power shall be mighty, but not by his own power; and he shall destroy wonderfully, and shall prosper and do; and he shall destroy them that are mighty and the people of the saints.
    translation: JPS 1917
    original: וְעָצַם כֹּחוֹ וְלֹא בְכֹחוֹ וְנִפְלָאוֹת יַשְׁחִית וְהִצְלִיחַ וְעָשָׂה וְהִשְׁחִית עֲצוּמִים וְעַם־קְדֹשִׁים׃
    hebrewPlain: ועצם כחו ולא בכחו ונפלאות ישחית והצליח ועשה והשחית עצומים ועם קדשים
    kjvRefs:
    - Daniel 8:24
    kjvOsis:
    - Dan.8.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.25
    scripture: tanakh
    name: Tanakh Daniel 8:25
    ref: Daniel 8:25
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 25
    ordinal: 20648
    text: And through his cunning he shall cause craft to prosper in his hand; and he shall magnify himself in his heart, and in time of security shall he destroy many; he shall also stand up against the prince of princes; but he shall be broken without hand.
    translation: JPS 1917
    original: וְעַל־שִׂכְלוֹ וְהִצְלִיחַ מִרְמָה בְּיָדוֹ וּבִלְבָבוֹ יַגְדִּיל וּבְשַׁלְוָה יַשְׁחִית רַבִּים וְעַל־שַׂר־שָׂרִים יַעֲמֹד וּבְאֶפֶס יָד יִשָּׁבֵר׃
    hebrewPlain: ועל שכלו והצליח מרמה בידו ובלבבו יגדיל ובשלוה ישחית רבים ועל שר שרים יעמד ובאפס יד ישבר
    kjvRefs:
    - Daniel 8:25
    kjvOsis:
    - Dan.8.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.26
    scripture: tanakh
    name: Tanakh Daniel 8:26
    ref: Daniel 8:26
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 26
    ordinal: 20649
    text: And the vision of the evenings and mornings which hath been told is true; but thou, shut thou up the vision; for it belongeth to many days to come.’
    translation: JPS 1917
    original: וּמַרְאֵה הָעֶרֶב וְהַבֹּקֶר אֲשֶׁר נֶאֱמַר אֱמֶת הוּא וְאַתָּה סְתֹם הֶחָזוֹן כִּי לְיָמִים רַבִּים׃
    hebrewPlain: ומראה הערב והבקר אשר נאמר אמת הוא ואתה סתם החזון כי לימים רבים
    kjvRefs:
    - Daniel 8:26
    kjvOsis:
    - Dan.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.8.27
    scripture: tanakh
    name: Tanakh Daniel 8:27
    ref: Daniel 8:27
    book: Dan
    section: ketuvim
    chapter: 8
    verse: 27
    ordinal: 20650
    text: And I Daniel fainted, and was sick certain days; then I rose up, and did the king’s business; and I was appalled at the vision, but understood it not.
    translation: JPS 1917
    original: וַאֲנִי דָנִיֵּאל נִהְיֵיתִי וְנֶחֱלֵיתִי יָמִים וָאָקוּם וָאֶעֱשֶׂה אֶת־מְלֶאכֶת הַמֶּלֶךְ וָאֶשְׁתּוֹמֵם עַל־הַמַּרְאֶה וְאֵין מֵבִין׃
    hebrewPlain: ואני דניאל נהייתי ונחליתי ימים ואקום ואעשה את מלאכת המלך ואשתומם על המראה ואין מבין
    kjvRefs:
    - Daniel 8:27
    kjvOsis:
    - Dan.8.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.8
- type: TanakhVerse
  data:
    osis: Dan.9.1
    scripture: tanakh
    name: Tanakh Daniel 9:1
    ref: Daniel 9:1
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 20651
    text: In the first year of Darius the son of Ahasuerus, of the seed of the Medes, who was made king over the realm of the Chaldeans;
    translation: JPS 1917
    original: בִּשְׁנַת אַחַת לְדָרְיָוֶשׁ בֶּן־אֲחַשְׁוֵרוֹשׁ מִזֶּרַע מָדָי אֲשֶׁר הָמְלַךְ עַל מַלְכוּת כַּשְׂדִּים׃
    hebrewPlain: בשנת אחת לדריוש בן אחשורוש מזרע מדי אשר המלך על מלכות כשדים
    kjvRefs:
    - Daniel 9:1
    kjvOsis:
    - Dan.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.2
    scripture: tanakh
    name: Tanakh Daniel 9:2
    ref: Daniel 9:2
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 20652
    text: in the first year of his reign I Daniel meditated in the books, over the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that He would accomplish for the desolations of Jerusalem seventy years.
    translation: JPS 1917
    original: בִּשְׁנַת אַחַת לְמָלְכוֹ אֲנִי דָּנִיֵּאל בִּינֹתִי בַּסְּפָרִים מִסְפַּר הַשָּׁנִים אֲשֶׁר הָיָה דְבַר־יְהוָה אֶל־יִרְמִיָה הַנָּבִיא לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם שִׁבְעִים שָׁנָה׃
    hebrewPlain: בשנת אחת למלכו אני דניאל בינתי בספרים מספר השנים אשר היה דבר יהוה אל ירמיה הנביא למלאות לחרבות ירושלם שבעים שנה
    kjvRefs:
    - Daniel 9:2
    kjvOsis:
    - Dan.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.3
    scripture: tanakh
    name: Tanakh Daniel 9:3
    ref: Daniel 9:3
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 20653
    text: And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes.
    translation: JPS 1917
    original: וָאֶתְּנָה אֶת־פָּנַי אֶל־אֲדֹנָי הָאֱלֹהִים לְבַקֵּשׁ תְּפִלָּה וְתַחֲנוּנִים בְּצוֹם וְשַׂק וָאֵפֶר׃
    hebrewPlain: ואתנה את פני אל אדני האלהים לבקש תפלה ותחנונים בצום ושק ואפר
    kjvRefs:
    - Daniel 9:3
    kjvOsis:
    - Dan.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.4
    scripture: tanakh
    name: Tanakh Daniel 9:4
    ref: Daniel 9:4
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 20654
    text: 'And I prayed unto the LORD my God, and made confession, and said: ‘O Lord, the great and awful God, who keepest covenant and mercy with them that love Thee and keep Thy commandments,'
    translation: JPS 1917
    original: וָאֶתְפַּלְלָה לַיהוָה אֱלֹהַי וָאֶתְוַדֶּה וָאֹמְרָה אָנָּא אֲדֹנָי הָאֵל הַגָּדוֹל וְהַנּוֹרָא שֹׁמֵר הַבְּרִית וְהַחֶסֶד לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו׃
    hebrewPlain: ואתפללה ליהוה אלהי ואתודה ואמרה אנא אדני האל הגדול והנורא שמר הברית והחסד לאהביו ולשמרי מצותיו
    kjvRefs:
    - Daniel 9:4
    kjvOsis:
    - Dan.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.5
    scripture: tanakh
    name: Tanakh Daniel 9:5
    ref: Daniel 9:5
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 20655
    text: we have sinned, and have dealt iniquitously, and have done wickedly, and have rebelled, and have turned aside from Thy commandments and from Thine ordinances;
    translation: JPS 1917
    original: חָטָאנוּ וְעָוִינוּ והרשענו [הִרְשַׁעְנוּ] וּמָרָדְנוּ וְסוֹר מִמִּצְוֺתֶךָ וּמִמִּשְׁפָּטֶיךָ׃
    hebrewPlain: חטאנו ועוינו והרשענו [הרשענו] ומרדנו וסור ממצותך וממשפטיך
    kjvRefs:
    - Daniel 9:5
    kjvOsis:
    - Dan.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.6
    scripture: tanakh
    name: Tanakh Daniel 9:6
    ref: Daniel 9:6
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 20656
    text: neither have we hearkened unto Thy servants the prophets, that spoke in Thy name to our kings, our princes, and our fathers, and to all the people of the land.
    translation: JPS 1917
    original: וְלֹא שָׁמַעְנוּ אֶל־עֲבָדֶיךָ הַנְּבִיאִים אֲשֶׁר דִּבְּרוּ בְּשִׁמְךָ אֶל־מְלָכֵינוּ שָׂרֵינוּ וַאֲבֹתֵינוּ וְאֶל כָּל־עַם הָאָרֶץ׃
    hebrewPlain: ולא שמענו אל עבדיך הנביאים אשר דברו בשמך אל מלכינו שרינו ואבתינו ואל כל עם הארץ
    kjvRefs:
    - Daniel 9:6
    kjvOsis:
    - Dan.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.7
    scripture: tanakh
    name: Tanakh Daniel 9:7
    ref: Daniel 9:7
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 7
    ordinal: 20657
    text: Unto Thee, O Lord, belongeth righteousness, but unto us confusion of face, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither Thou hast driven them, because they dealt treacherously with Thee.
    translation: JPS 1917
    original: לְךָ אֲדֹנָי הַצְּדָקָה וְלָנוּ בֹּשֶׁת הַפָּנִים כַּיּוֹם הַזֶּה לְאִישׁ יְהוּדָה וּלְיוֹשְׁבֵי יְרוּשָׁלִַם וּלְכָל־יִשְׂרָאֵל הַקְּרֹבִים וְהָרְחֹקִים בְּכָל־הָאֲרָצוֹת אֲשֶׁר הִדַּחְתָּם שָׁם בְּמַעֲלָם אֲשֶׁר מָעֲלוּ־בָךְ׃
    hebrewPlain: לך אדני הצדקה ולנו בשת הפנים כיום הזה לאיש יהודה וליושבי ירושלם ולכל ישראל הקרבים והרחקים בכל הארצות אשר הדחתם שם במעלם אשר מעלו בך
    kjvRefs:
    - Daniel 9:7
    kjvOsis:
    - Dan.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.8
    scripture: tanakh
    name: Tanakh Daniel 9:8
    ref: Daniel 9:8
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 8
    ordinal: 20658
    text: O LORD, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against Thee.
    translation: JPS 1917
    original: יְהוָה לָנוּ בֹּשֶׁת הַפָּנִים לִמְלָכֵינוּ לְשָׂרֵינוּ וְלַאֲבֹתֵינוּ אֲשֶׁר חָטָאנוּ לָךְ׃
    hebrewPlain: יהוה לנו בשת הפנים למלכינו לשרינו ולאבתינו אשר חטאנו לך
    kjvRefs:
    - Daniel 9:8
    kjvOsis:
    - Dan.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.9
    scripture: tanakh
    name: Tanakh Daniel 9:9
    ref: Daniel 9:9
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 9
    ordinal: 20659
    text: To the Lord our God belong compassions and forgivenesses; for we have rebelled against Him;
    translation: JPS 1917
    original: לַאדֹנָי אֱלֹהֵינוּ הָרַחֲמִים וְהַסְּלִחוֹת כִּי מָרַדְנוּ בּוֹ׃
    hebrewPlain: לאדני אלהינו הרחמים והסלחות כי מרדנו בו
    kjvRefs:
    - Daniel 9:9
    kjvOsis:
    - Dan.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.10
    scripture: tanakh
    name: Tanakh Daniel 9:10
    ref: Daniel 9:10
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 10
    ordinal: 20660
    text: neither have we hearkened to the voice of the LORD our God, to walk in His laws, which He set before us by His servants the prophets. .
    translation: JPS 1917
    original: וְלֹא שָׁמַעְנוּ בְּקוֹל יְהוָה אֱלֹהֵינוּ לָלֶכֶת בְּתוֹרֹתָיו אֲשֶׁר נָתַן לְפָנֵינוּ בְּיַד עֲבָדָיו הַנְּבִיאִים׃
    hebrewPlain: ולא שמענו בקול יהוה אלהינו ללכת בתורתיו אשר נתן לפנינו ביד עבדיו הנביאים
    kjvRefs:
    - Daniel 9:10
    kjvOsis:
    - Dan.9.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.11
    scripture: tanakh
    name: Tanakh Daniel 9:11
    ref: Daniel 9:11
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 20661
    text: Yea, all Israel have transgressed Thy law, and have turned aside, so as not to hearken to Thy voice; and so there hath been poured out upon us the curse and the oath that is written in the Law of Moses the servant of God; for we have sinned against Him.
    translation: JPS 1917
    original: וְכָל־יִשְׂרָאֵל עָבְרוּ אֶת־תּוֹרָתֶךָ וְסוֹר לְבִלְתִּי שְׁמוֹעַ בְּקֹלֶךָ וַתִּתַּךְ עָלֵינוּ הָאָלָה וְהַשְּׁבֻעָה אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה עֶבֶד־הָאֱלֹהִים כִּי חָטָאנוּ לוֹ׃
    hebrewPlain: וכל ישראל עברו את תורתך וסור לבלתי שמוע בקלך ותתך עלינו האלה והשבעה אשר כתובה בתורת משה עבד האלהים כי חטאנו לו
    kjvRefs:
    - Daniel 9:11
    kjvOsis:
    - Dan.9.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.12
    scripture: tanakh
    name: Tanakh Daniel 9:12
    ref: Daniel 9:12
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 20662
    text: And He hath confirmed His word, which He spoke against us, and against our judges that judged us, by bringing upon us a great evil; so that under the whole heaven hath not been done as hath been done upon Jerusalem.
    translation: JPS 1917
    original: וַיָּקֶם אֶת־דבריו [דְּבָרוֹ ] אֲשֶׁר־דִּבֶּר עָלֵינוּ וְעַל שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ לְהָבִיא עָלֵינוּ רָעָה גְדֹלָה אֲשֶׁר לֹא־נֶעֶשְׂתָה תַּחַת כָּל־הַשָּׁמַיִם כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלִָם׃
    hebrewPlain: ויקם את דבריו [דברו ] אשר דבר עלינו ועל שפטינו אשר שפטונו להביא עלינו רעה גדלה אשר לא נעשתה תחת כל השמים כאשר נעשתה בירושלם
    kjvRefs:
    - Daniel 9:12
    kjvOsis:
    - Dan.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.13
    scripture: tanakh
    name: Tanakh Daniel 9:13
    ref: Daniel 9:13
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 20663
    text: As it is written in the Law of Moses, all this evil is come upon us; yet have we not entreated the favour of the LORD our God, that we might turn from our iniquities, and have discernment in Thy truth.
    translation: JPS 1917
    original: כַּאֲשֶׁר כָּתוּב בְּתוֹרַת מֹשֶׁה אֵת כָּל־הָרָעָה הַזֹּאת בָּאָה עָלֵינוּ וְלֹא־חִלִּינוּ אֶת־פְּנֵי יְהוָה אֱלֹהֵינוּ לָשׁוּב מֵעֲוֺנֵנוּ וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ׃
    hebrewPlain: כאשר כתוב בתורת משה את כל הרעה הזאת באה עלינו ולא חלינו את פני יהוה אלהינו לשוב מעוננו ולהשכיל באמתך
    kjvRefs:
    - Daniel 9:13
    kjvOsis:
    - Dan.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.14
    scripture: tanakh
    name: Tanakh Daniel 9:14
    ref: Daniel 9:14
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 20664
    text: And so the LORD hath watched over the evil, and brought it upon us; for the LORD our God is righteous in all His works which He hath done, and we have not hearkened to His voice.
    translation: JPS 1917
    original: וַיִּשְׁקֹד יְהוָה עַל־הָרָעָה וַיְבִיאֶהָ עָלֵינוּ כִּי־צַדִּיק יְהוָה אֱלֹהֵינוּ עַל־כָּל־מַעֲשָׂיו אֲשֶׁר עָשָׂה וְלֹא שָׁמַעְנוּ בְּקֹלוֹ׃
    hebrewPlain: וישקד יהוה על הרעה ויביאה עלינו כי צדיק יהוה אלהינו על כל מעשיו אשר עשה ולא שמענו בקלו
    kjvRefs:
    - Daniel 9:14
    kjvOsis:
    - Dan.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.15
    scripture: tanakh
    name: Tanakh Daniel 9:15
    ref: Daniel 9:15
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 20665
    text: And now, O Lord our God, that hast brought Thy people forth out of the land of Egypt with a mighty hand, and hast gotten Thee renown, as at this day; we have sinned, we have done wickedly.
    translation: JPS 1917
    original: וְעַתָּה אֲדֹנָי אֱלֹהֵינוּ אֲשֶׁר הוֹצֵאתָ אֶת־עַמְּךָ מֵאֶרֶץ מִצְרַיִם בְּיָד חֲזָקָה וַתַּעַשׂ־לְךָ שֵׁם כַּיּוֹם הַזֶּה חָטָאנוּ רָשָׁעְנוּ׃
    hebrewPlain: ועתה אדני אלהינו אשר הוצאת את עמך מארץ מצרים ביד חזקה ותעש לך שם כיום הזה חטאנו רשענו
    kjvRefs:
    - Daniel 9:15
    kjvOsis:
    - Dan.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.16
    scripture: tanakh
    name: Tanakh Daniel 9:16
    ref: Daniel 9:16
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 20666
    text: O Lord, according to all Thy righteousness, let Thine anger and Thy fury, I pray Thee, be turned away from Thy city Jerusalem, Thy holy mountain; because for our sins, and for the iniquities of our fathers, Jerusalem and Thy people are become a reproach to all that are about us.
    translation: JPS 1917
    original: אֲדֹנָי כְּכָל־צִדְקֹתֶךָ יָשָׁב־נָא אַפְּךָ וַחֲמָתְךָ מֵעִירְךָ יְרוּשָׁלִַם הַר־קָדְשֶׁךָ כִּי בַחֲטָאֵינוּ וּבַעֲוֺנוֹת אֲבֹתֵינוּ יְרוּשָׁלִַם וְעַמְּךָ לְחֶרְפָּה לְכָל־סְבִיבֹתֵינוּ׃
    hebrewPlain: אדני ככל צדקתך ישב נא אפך וחמתך מעירך ירושלם הר קדשך כי בחטאינו ובעונות אבתינו ירושלם ועמך לחרפה לכל סביבתינו
    kjvRefs:
    - Daniel 9:16
    kjvOsis:
    - Dan.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.17
    scripture: tanakh
    name: Tanakh Daniel 9:17
    ref: Daniel 9:17
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 20667
    text: Now therefore, O our God, hearken unto the prayer of Thy servant, and to his supplications, and cause Thy face to shine upon Thy sanctuary that is desolate, for the Lord’s sake.
    translation: JPS 1917
    original: וְעַתָּה שְׁמַע אֱלֹהֵינוּ אֶל־תְּפִלַּת עַבְדְּךָ וְאֶל־תַּחֲנוּנָיו וְהָאֵר פָּנֶיךָ עַל־מִקְדָּשְׁךָ הַשָּׁמֵם לְמַעַן אֲדֹנָי׃
    hebrewPlain: ועתה שמע אלהינו אל תפלת עבדך ואל תחנוניו והאר פניך על מקדשך השמם למען אדני
    kjvRefs:
    - Daniel 9:17
    kjvOsis:
    - Dan.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.18
    scripture: tanakh
    name: Tanakh Daniel 9:18
    ref: Daniel 9:18
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 20668
    text: O my God, incline Thine ear, and hear; open Thine eyes, and behold our desolations, and the city upon which Thy name is called; for we do not present our supplications before Thee because of our righteousness, but because of Thy great compassions.
    translation: JPS 1917
    original: הַטֵּה אֱלֹהַי אָזְנְךָ וּשֲׁמָע פקחה [פְּקַח] עֵינֶיךָ וּרְאֵה שֹׁמְמֹתֵינוּ וְהָעִיר אֲשֶׁר־נִקְרָא שִׁמְךָ עָלֶיהָ כִּי לֹא עַל־צִדְקֹתֵינוּ אֲנַחְנוּ מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ כִּי עַל־רַחֲמֶיךָ הָרַבִּים׃
    hebrewPlain: הטה אלהי אזנך ושמע פקחה [פקח] עיניך וראה שממתינו והעיר אשר נקרא שמך עליה כי לא על צדקתינו אנחנו מפילים תחנונינו לפניך כי על רחמיך הרבים
    kjvRefs:
    - Daniel 9:18
    kjvOsis:
    - Dan.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.19
    scripture: tanakh
    name: Tanakh Daniel 9:19
    ref: Daniel 9:19
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 19
    ordinal: 20669
    text: O Lord, hear, O Lord, forgive, O Lord, attend and do, defer not; for Thine own sake, O my God, because Thy name is called upon Thy city and Thy people.’
    translation: JPS 1917
    original: אֲדֹנָי שְׁמָעָה אֲדֹנָי סְלָחָה אֲדֹנָי הַקֲשִׁיבָה וַעֲשֵׂה אַל־תְּאַחַר לְמַעֲנְךָ אֱלֹהַי כִּי־שִׁמְךָ נִקְרָא עַל־עִירְךָ וְעַל־עַמֶּךָ׃
    hebrewPlain: אדני שמעה אדני סלחה אדני הקשיבה ועשה אל תאחר למענך אלהי כי שמך נקרא על עירך ועל עמך
    kjvRefs:
    - Daniel 9:19
    kjvOsis:
    - Dan.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.20
    scripture: tanakh
    name: Tanakh Daniel 9:20
    ref: Daniel 9:20
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 20
    ordinal: 20670
    text: And while I was speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;
    translation: JPS 1917
    original: וְעוֹד אֲנִי מְדַבֵּר וּמִתְפַּלֵּל וּמִתְוַדֶּה חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל וּמַפִּיל תְּחִנָּתִי לִפְנֵי יְהוָה אֱלֹהַי עַל הַר־קֹדֶשׁ אֱלֹהָי׃
    hebrewPlain: ועוד אני מדבר ומתפלל ומתודה חטאתי וחטאת עמי ישראל ומפיל תחנתי לפני יהוה אלהי על הר קדש אלהי
    kjvRefs:
    - Daniel 9:20
    kjvOsis:
    - Dan.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.21
    scripture: tanakh
    name: Tanakh Daniel 9:21
    ref: Daniel 9:21
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 21
    ordinal: 20671
    text: yea, while I was speaking in prayer, the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, approached close to me about the time of the evening offering.
    translation: JPS 1917
    original: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה וְהָאִישׁ גַּבְרִיאֵל אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה מֻעָף בִּיעָף נֹגֵעַ אֵלַי כְּעֵת מִנְחַת־עָרֶב׃
    hebrewPlain: ועוד אני מדבר בתפלה והאיש גבריאל אשר ראיתי בחזון בתחלה מעף ביעף נגע אלי כעת מנחת ערב
    kjvRefs:
    - Daniel 9:21
    kjvOsis:
    - Dan.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.22
    scripture: tanakh
    name: Tanakh Daniel 9:22
    ref: Daniel 9:22
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 22
    ordinal: 20672
    text: 'And he made me to understand, and talked with me, and said: ‘O Daniel, I am now come forth to make thee skilful of understanding.'
    translation: JPS 1917
    original: וַיָּבֶן וַיְדַבֵּר עִמִּי וַיֹּאמַר דָּנִיֵּאל עַתָּה יָצָאתִי לְהַשְׂכִּילְךָ בִינָה׃
    hebrewPlain: ויבן וידבר עמי ויאמר דניאל עתה יצאתי להשכילך בינה
    kjvRefs:
    - Daniel 9:22
    kjvOsis:
    - Dan.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.23
    scripture: tanakh
    name: Tanakh Daniel 9:23
    ref: Daniel 9:23
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 23
    ordinal: 20673
    text: At the beginning of thy supplications a word went forth, and I am come to declare it; for thou art greatly beloved; therefore look into the word, and understand the vision.
    translation: JPS 1917
    original: בִּתְחִלַּת תַּחֲנוּנֶיךָ יָצָא דָבָר וַאֲנִי בָּאתִי לְהַגִּיד כִּי חֲמוּדוֹת אָתָּה וּבִין בַּדָּבָר וְהָבֵן בַּמַּרְאֶה׃
    hebrewPlain: בתחלת תחנוניך יצא דבר ואני באתי להגיד כי חמודות אתה ובין בדבר והבן במראה
    kjvRefs:
    - Daniel 9:23
    kjvOsis:
    - Dan.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.24
    scripture: tanakh
    name: Tanakh Daniel 9:24
    ref: Daniel 9:24
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 24
    ordinal: 20674
    text: Seventy weeks are decreed upon thy people and upon thy holy city, to finish the transgression, and to make an end of sin, and to forgive iniquity, and to bring in everlasting righteousness, and to seal vision and prophet, and to anoint the most holy place.
    translation: JPS 1917
    original: שָׁבֻעִים שִׁבְעִים נֶחְתַּךְ עַל־עַמְּךָ וְעַל־עִיר קָדְשֶׁךָ לְכַלֵּא הַפֶּשַׁע ולחתם [וּלְהָתֵם] חטאות [חַטָּאת] וּלְכַפֵּר עָוֺן וּלְהָבִיא צֶדֶק עֹלָמִים וְלַחְתֹּם חָזוֹן וְנָבִיא וְלִמְשֹׁחַ קֹדֶשׁ קָדָשִׁים׃
    hebrewPlain: שבעים שבעים נחתך על עמך ועל עיר קדשך לכלא הפשע ולחתם [ולהתם] חטאות [חטאת] ולכפר עון ולהביא צדק עלמים ולחתם חזון ונביא ולמשח קדש קדשים
    kjvRefs:
    - Daniel 9:24
    kjvOsis:
    - Dan.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.25
    scripture: tanakh
    name: Tanakh Daniel 9:25
    ref: Daniel 9:25
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 25
    ordinal: 20675
    text: Know therefore and discern, that from the going forth of the word to restore and to build Jerusalem unto one anointed, a prince, shall be seven weeks; and for threescore and two weeks, it shall be built again, with broad place and moat, but in troublous times.
    translation: JPS 1917
    original: וְתֵדַע וְתַשְׂכֵּל מִן־מֹצָא דָבָר לְהָשִׁיב וְלִבְנוֹת יְרוּשָׁלִַם עַד־מָשִׁיחַ נָגִיד שָׁבֻעִים שִׁבְעָה וְשָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם תָּשׁוּב וְנִבְנְתָה רְחוֹב וְחָרוּץ וּבְצוֹק הָעִתִּים׃
    hebrewPlain: ותדע ותשכל מן מצא דבר להשיב ולבנות ירושלם עד משיח נגיד שבעים שבעה ושבעים ששים ושנים תשוב ונבנתה רחוב וחרוץ ובצוק העתים
    kjvRefs:
    - Daniel 9:25
    kjvOsis:
    - Dan.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.26
    scripture: tanakh
    name: Tanakh Daniel 9:26
    ref: Daniel 9:26
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 26
    ordinal: 20676
    text: And after the threescore and two weeks shall an anointed one be cut off, and be no more; and the people of a prince that shall come shall destroy the city and the sanctuary; but his end shall be with a flood; and unto the end of the war desolations are determined.
    translation: JPS 1917
    original: וְאַחֲרֵי הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם יִכָּרֵת מָשִׁיחַ וְאֵין לוֹ וְהָעִיר וְהַקֹּדֶשׁ יַשְׁחִית עַם נָגִיד הַבָּא וְקִצּוֹ בַשֶּׁטֶף וְעַד קֵץ מִלְחָמָה נֶחֱרֶצֶת שֹׁמֵמוֹת׃
    hebrewPlain: ואחרי השבעים ששים ושנים יכרת משיח ואין לו והעיר והקדש ישחית עם נגיד הבא וקצו בשטף ועד קץ מלחמה נחרצת שממות
    kjvRefs:
    - Daniel 9:26
    kjvOsis:
    - Dan.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.9.27
    scripture: tanakh
    name: Tanakh Daniel 9:27
    ref: Daniel 9:27
    book: Dan
    section: ketuvim
    chapter: 9
    verse: 27
    ordinal: 20677
    text: And he shall make a firm covenant with many for one week; and for half of the week he shall cause the sacrifice and the offering to cease; and upon the wing of detestable things shall be that which causeth appalment; and that until the extermination wholly determined be poured out upon that which causeth appalment.’
    translation: JPS 1917
    original: וְהִגְבִּיר בְּרִית לָרַבִּים שָׁבוּעַ אֶחָד וַחֲצִי הַשָּׁבוּעַ יַשְׁבִּית זֶבַח וּמִנְחָה וְעַל כְּנַף שִׁקּוּצִים מְשֹׁמֵם וְעַד־כָּלָה וְנֶחֱרָצָה תִּתַּךְ עַל־שֹׁמֵם׃
    hebrewPlain: והגביר ברית לרבים שבוע אחד וחצי השבוע ישבית זבח ומנחה ועל כנף שקוצים משמם ועד כלה ונחרצה תתך על שמם
    kjvRefs:
    - Daniel 9:27
    kjvOsis:
    - Dan.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.9
- type: TanakhVerse
  data:
    osis: Dan.10.1
    scripture: tanakh
    name: Tanakh Daniel 10:1
    ref: Daniel 10:1
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 20678
    text: In the third year of Cyrus king of Persia a word was revealed unto Daniel, whose name was called Belteshazzar; and the word was true, even a great warfare; and he gave heed to the word, and had understanding of the vision.
    translation: JPS 1917
    original: בִּשְׁנַת שָׁלוֹשׁ לְכוֹרֶשׁ מֶלֶךְ פָּרַס דָּבָר נִגְלָה לְדָנִיֵּאל אֲשֶׁר־נִקְרָא שְׁמוֹ בֵּלְטְשַׁאצַּר וֶאֱמֶת הַדָּבָר וְצָבָא גָדוֹל וּבִין אֶת־הַדָּבָר וּבִינָה לוֹ בַּמַּרְאֶה׃
    hebrewPlain: בשנת שלוש לכורש מלך פרס דבר נגלה לדניאל אשר נקרא שמו בלטשאצר ואמת הדבר וצבא גדול ובין את הדבר ובינה לו במראה
    kjvRefs:
    - Daniel 10:1
    kjvOsis:
    - Dan.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.2
    scripture: tanakh
    name: Tanakh Daniel 10:2
    ref: Daniel 10:2
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 20679
    text: In those days I Daniel was mourning three whole weeks.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם אֲנִי דָנִיֵּאל הָיִיתִי מִתְאַבֵּל שְׁלֹשָׁה שָׁבֻעִים יָמִים׃
    hebrewPlain: בימים ההם אני דניאל הייתי מתאבל שלשה שבעים ימים
    kjvRefs:
    - Daniel 10:2
    kjvOsis:
    - Dan.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.3
    scripture: tanakh
    name: Tanakh Daniel 10:3
    ref: Daniel 10:3
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 20680
    text: I ate no pleasant bread, neither came flesh nor wine in my mouth, neither did I anoint myself at all, till three whole weeks were fulfilled.
    translation: JPS 1917
    original: לֶחֶם חֲמֻדוֹת לֹא אָכַלְתִּי וּבָשָׂר וָיַיִן לֹא־בָא אֶל־פִּי וְסוֹךְ לֹא־סָכְתִּי עַד־מְלֹאת שְׁלֹשֶׁת שָׁבֻעִים יָמִים׃
    hebrewPlain: לחם חמדות לא אכלתי ובשר ויין לא בא אל פי וסוך לא סכתי עד מלאת שלשת שבעים ימים
    kjvRefs:
    - Daniel 10:3
    kjvOsis:
    - Dan.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.4
    scripture: tanakh
    name: Tanakh Daniel 10:4
    ref: Daniel 10:4
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 4
    ordinal: 20681
    text: And in the four and twentieth day of the first month, as I was by the side of the great river, which is Tigris,
    translation: JPS 1917
    original: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הָרִאשׁוֹן וַאֲנִי הָיִיתִי עַל יַד הַנָּהָר הַגָּדוֹל הוּא חִדָּקֶל׃
    hebrewPlain: וביום עשרים וארבעה לחדש הראשון ואני הייתי על יד הנהר הגדול הוא חדקל
    kjvRefs:
    - Daniel 10:4
    kjvOsis:
    - Dan.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.5
    scripture: tanakh
    name: Tanakh Daniel 10:5
    ref: Daniel 10:5
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 5
    ordinal: 20682
    text: I lifted up mine eyes, and looked, and behold a man clothed in linen, whose loins were girded with fine gold of Uphaz;
    translation: JPS 1917
    original: וָאֶשָּׂא אֶת־עֵינַי וָאֵרֶא וְהִנֵּה אִישׁ־אֶחָד לָבוּשׁ בַּדִּים וּמָתְנָיו חֲגֻרִים בְּכֶתֶם אוּפָז׃
    hebrewPlain: ואשא את עיני וארא והנה איש אחד לבוש בדים ומתניו חגרים בכתם אופז
    kjvRefs:
    - Daniel 10:5
    kjvOsis:
    - Dan.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.6
    scripture: tanakh
    name: Tanakh Daniel 10:6
    ref: Daniel 10:6
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 6
    ordinal: 20683
    text: his body also was like the beryl, and his face as the appearance of lightning, and his eyes as torches of fire, and his arms and his feet like in colour to burnished brass, and the voice of his words like the voice of a multitude.
    translation: JPS 1917
    original: וּגְוִיָּתוֹ כְתַרְשִׁישׁ וּפָנָיו כְּמַרְאֵה בָרָק וְעֵינָיו כְּלַפִּידֵי אֵשׁ וּזְרֹעֹתָיו וּמַרְגְּלֹתָיו כְּעֵין נְחֹשֶׁת קָלָל וְקוֹל דְּבָרָיו כְּקוֹל הָמוֹן׃
    hebrewPlain: וגויתו כתרשיש ופניו כמראה ברק ועיניו כלפידי אש וזרעתיו ומרגלתיו כעין נחשת קלל וקול דבריו כקול המון
    kjvRefs:
    - Daniel 10:6
    kjvOsis:
    - Dan.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.7
    scripture: tanakh
    name: Tanakh Daniel 10:7
    ref: Daniel 10:7
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 7
    ordinal: 20684
    text: And I Daniel alone saw the vision; for the men that were with me saw not the vision; howbeit a great trembling fell upon them, and they fled to hide themselves.
    translation: JPS 1917
    original: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי אֶת־הַמַּרְאָה וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי לֹא רָאוּ אֶת־הַמַּרְאָה אֲבָל חֲרָדָה גְדֹלָה נָפְלָה עֲלֵיהֶם וַיִּבְרְחוּ בְּהֵחָבֵא׃
    hebrewPlain: וראיתי אני דניאל לבדי את המראה והאנשים אשר היו עמי לא ראו את המראה אבל חרדה גדלה נפלה עליהם ויברחו בהחבא
    kjvRefs:
    - Daniel 10:7
    kjvOsis:
    - Dan.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.8
    scripture: tanakh
    name: Tanakh Daniel 10:8
    ref: Daniel 10:8
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 8
    ordinal: 20685
    text: So that I was left alone, and saw this great vision, and there remained no strength in me; for my comeliness was turned in me into corruption, and I retained no strength.
    translation: JPS 1917
    original: וַאֲנִי נִשְׁאַרְתִּי לְבַדִּי וָאֶרְאֶה אֶת־הַמַּרְאָה הַגְּדֹלָה הַזֹּאת וְלֹא נִשְׁאַר־בִּי כֹּח וְהוֹדִי נֶהְפַּךְ עָלַי לְמַשְׁחִית וְלֹא עָצַרְתִּי כֹּחַ׃
    hebrewPlain: ואני נשארתי לבדי ואראה את המראה הגדלה הזאת ולא נשאר בי כח והודי נהפך עלי למשחית ולא עצרתי כח
    kjvRefs:
    - Daniel 10:8
    kjvOsis:
    - Dan.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.9
    scripture: tanakh
    name: Tanakh Daniel 10:9
    ref: Daniel 10:9
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 9
    ordinal: 20686
    text: Yet heard I the voice of his words; and when I heard the voice of his words, then was I fallen into a deep sleep on my face, with my face toward the ground.
    translation: JPS 1917
    original: וָאֶשְׁמַע אֶת־קוֹל דְּבָרָיו וּכְשָׁמְעִי אֶת־קוֹל דְּבָרָיו וַאֲנִי הָיִיתִי נִרְדָּם עַל־פָּנַי וּפָנַי אָרְצָה׃
    hebrewPlain: ואשמע את קול דבריו וכשמעי את קול דבריו ואני הייתי נרדם על פני ופני ארצה
    kjvRefs:
    - Daniel 10:9
    kjvOsis:
    - Dan.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.10
    scripture: tanakh
    name: Tanakh Daniel 10:10
    ref: Daniel 10:10
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 10
    ordinal: 20687
    text: And, behold, a hand touched me, which set me tottering upon my knees and upon the palms of my hands.
    translation: JPS 1917
    original: וְהִנֵּה־יָד נָגְעָה בִּי וַתְּנִיעֵנִי עַל־בִּרְכַּי וְכַפּוֹת יָדָי׃
    hebrewPlain: והנה יד נגעה בי ותניעני על ברכי וכפות ידי
    kjvRefs:
    - Daniel 10:10
    kjvOsis:
    - Dan.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.11
    scripture: tanakh
    name: Tanakh Daniel 10:11
    ref: Daniel 10:11
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 11
    ordinal: 20688
    text: 'And he said unto me: ‘O Daniel, thou man greatly beloved, give heed unto the words that I speak unto thee, and stand upright; for now am I sent unto thee’; and when he had spoken this word unto me, I stood trembling.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי דָּנִיֵּאל אִישׁ־חֲמֻדוֹת הָבֵן בַּדְּבָרִים אֲשֶׁר אָנֹכִי דֹבֵר אֵלֶיךָ וַעֲמֹד עַל־עָמְדֶךָ כִּי עַתָּה שֻׁלַּחְתִּי אֵלֶיךָ וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה עָמַדְתִּי מַרְעִיד׃
    hebrewPlain: ויאמר אלי דניאל איש חמדות הבן בדברים אשר אנכי דבר אליך ועמד על עמדך כי עתה שלחתי אליך ובדברו עמי את הדבר הזה עמדתי מרעיד
    kjvRefs:
    - Daniel 10:11
    kjvOsis:
    - Dan.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.12
    scripture: tanakh
    name: Tanakh Daniel 10:12
    ref: Daniel 10:12
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 12
    ordinal: 20689
    text: 'Then said he unto me: ‘Fear not, Daniel; for from the first day that thou didst set thy heart to understand, and to humble thyself before thy God, thy words were heard; and I am come because of thy words.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֵלַי אַל־תִּירָא דָנִיֵּאל כִּי מִן־הַיּוֹם הָרִאשׁוֹן אֲשֶׁר נָתַתָּ אֶת־לִבְּךָ לְהָבִין וּלְהִתְעַנּוֹת לִפְנֵי אֱלֹהֶיךָ נִשְׁמְעוּ דְבָרֶיךָ וַאֲנִי־בָאתִי בִּדְבָרֶיךָ׃
    hebrewPlain: ויאמר אלי אל תירא דניאל כי מן היום הראשון אשר נתת את לבך להבין ולהתענות לפני אלהיך נשמעו דבריך ואני באתי בדבריך
    kjvRefs:
    - Daniel 10:12
    kjvOsis:
    - Dan.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.13
    scripture: tanakh
    name: Tanakh Daniel 10:13
    ref: Daniel 10:13
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 13
    ordinal: 20690
    text: But the prince of the kingdom of Persia withstood me one and twenty days; but, lo, Michael, one of the chief princes, came to help me; and I was left over there beside the kings of Persia.
    translation: JPS 1917
    original: וְשַׂר מַלְכוּת פָּרַס עֹמֵד לְנֶגְדִּי עֶשְׂרִים וְאֶחָד יוֹם וְהִנֵּה מִיכָאֵל אַחַד הַשָּׂרִים הָרִאשֹׁנִים בָּא לְעָזְרֵנִי וַאֲנִי נוֹתַרְתִּי שָׁם אֵצֶל מַלְכֵי פָרָס׃
    hebrewPlain: ושר מלכות פרס עמד לנגדי עשרים ואחד יום והנה מיכאל אחד השרים הראשנים בא לעזרני ואני נותרתי שם אצל מלכי פרס
    kjvRefs:
    - Daniel 10:13
    kjvOsis:
    - Dan.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.14
    scripture: tanakh
    name: Tanakh Daniel 10:14
    ref: Daniel 10:14
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 14
    ordinal: 20691
    text: Now I am come to make thee understand what shall befall thy people in the end of days; for there is yet a vision for the days.’
    translation: JPS 1917
    original: וּבָאתִי לַהֲבִינְךָ אֵת אֲשֶׁר־יִקְרָה לְעַמְּךָ בְּאַחֲרִית הַיָּמִים כִּי־עוֹד חָזוֹן לַיָּמִים׃
    hebrewPlain: ובאתי להבינך את אשר יקרה לעמך באחרית הימים כי עוד חזון לימים
    kjvRefs:
    - Daniel 10:14
    kjvOsis:
    - Dan.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.15
    scripture: tanakh
    name: Tanakh Daniel 10:15
    ref: Daniel 10:15
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 15
    ordinal: 20692
    text: And when he had spoken unto me according to these words, I set my face toward the ground, and was dumb.
    translation: JPS 1917
    original: וּבְדַבְּרוֹ עִמִּי כַּדְּבָרִים הָאֵלֶּה נָתַתִּי פָנַי אַרְצָה וְנֶאֱלָמְתִּי׃
    hebrewPlain: ובדברו עמי כדברים האלה נתתי פני ארצה ונאלמתי
    kjvRefs:
    - Daniel 10:15
    kjvOsis:
    - Dan.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.16
    scripture: tanakh
    name: Tanakh Daniel 10:16
    ref: Daniel 10:16
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 16
    ordinal: 20693
    text: 'And, behold, one like the similitude of the sons of men touched my lips; then I opened my mouth, and spoke and said unto him that stood before me: ‘O my lord, by reason of the vision my pains are come upon me, and I retain no strength.'
    translation: JPS 1917
    original: וְהִנֵּה כִּדְמוּת בְּנֵי אָדָם נֹגֵעַ עַל־שְׂפָתָי וָאֶפְתַּח־פִּי וָאֲדַבְּרָה וָאֹמְרָה אֶל־הָעֹמֵד לְנֶגְדִּי אֲדֹנִי בַּמַּרְאָה נֶהֶפְכוּ צִירַי עָלַי וְלֹא עָצַרְתִּי כֹּחַ׃
    hebrewPlain: והנה כדמות בני אדם נגע על שפתי ואפתח פי ואדברה ואמרה אל העמד לנגדי אדני במראה נהפכו צירי עלי ולא עצרתי כח
    kjvRefs:
    - Daniel 10:16
    kjvOsis:
    - Dan.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.17
    scripture: tanakh
    name: Tanakh Daniel 10:17
    ref: Daniel 10:17
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 17
    ordinal: 20694
    text: For how can this servant of my lord talk with this my lord? for as for me, straightway there remained no strength in me, neither was there breath left in me.’
    translation: JPS 1917
    original: וְהֵיךְ יוּכַל עֶבֶד אֲדֹנִי זֶה לְדַבֵּר עִם־אֲדֹנִי זֶה וַאֲנִי מֵעַתָּה לֹא־יַעֲמָד־בִּי כֹחַ וּנְשָׁמָה לֹא נִשְׁאֲרָה־בִי׃
    hebrewPlain: והיך יוכל עבד אדני זה לדבר עם אדני זה ואני מעתה לא יעמד בי כח ונשמה לא נשארה בי
    kjvRefs:
    - Daniel 10:17
    kjvOsis:
    - Dan.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.18
    scripture: tanakh
    name: Tanakh Daniel 10:18
    ref: Daniel 10:18
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 18
    ordinal: 20695
    text: Then there touched me again one like the appearance of a man, and he strengthened me.
    translation: JPS 1917
    original: וַיֹּסֶף וַיִּגַּע־בִּי כְּמַרְאֵה אָדָם וַיְחַזְּקֵנִי׃
    hebrewPlain: ויסף ויגע בי כמראה אדם ויחזקני
    kjvRefs:
    - Daniel 10:18
    kjvOsis:
    - Dan.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.19
    scripture: tanakh
    name: Tanakh Daniel 10:19
    ref: Daniel 10:19
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 19
    ordinal: 20696
    text: 'And he said: ‘O man greatly beloved, fear not! peace be unto thee, be strong, yea, be strong.’ And when he had spoken unto me, I was strengthened, and said: ‘Let my lord speak; for thou hast strengthened me.’'
    translation: JPS 1917
    original: וַיֹּאמֶר אַל־תִּירָא אִישׁ־חֲמֻדוֹת שָׁלוֹם לָךְ חֲזַק וַחֲזָק וּבְדַבְּרוֹ עִמִּי הִתְחַזַּקְתִּי וָאֹמְרָה יְדַבֵּר אֲדֹנִי כִּי חִזַּקְתָּנִי׃
    hebrewPlain: ויאמר אל תירא איש חמדות שלום לך חזק וחזק ובדברו עמי התחזקתי ואמרה ידבר אדני כי חזקתני
    kjvRefs:
    - Daniel 10:19
    kjvOsis:
    - Dan.10.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.20
    scripture: tanakh
    name: Tanakh Daniel 10:20
    ref: Daniel 10:20
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 20
    ordinal: 20697
    text: 'Then said he: Knowest thou wherefore I come unto thee? and now will I return to fight with the prince of Persia; and when I go forth, lo, the prince of Greece shall come.'
    translation: JPS 1917
    original: וַיֹּאמֶר הֲיָדַעְתָּ לָמָּה־בָּאתִי אֵלֶיךָ וְעַתָּה אָשׁוּב לְהִלָּחֵם עִם־שַׂר פָּרָס וַאֲנִי יוֹצֵא וְהִנֵּה שַׂר־יָוָן בָּא׃
    hebrewPlain: ויאמר הידעת למה באתי אליך ועתה אשוב להלחם עם שר פרס ואני יוצא והנה שר יון בא
    kjvRefs:
    - Daniel 10:20
    kjvOsis:
    - Dan.10.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.10.21
    scripture: tanakh
    name: Tanakh Daniel 10:21
    ref: Daniel 10:21
    book: Dan
    section: ketuvim
    chapter: 10
    verse: 21
    ordinal: 20698
    text: Howbeit I will declare unto thee that which is inscribed in the writing of truth; and there is none that holdeth with me against these, except Michael your prince.
    translation: JPS 1917
    original: אֲבָל אַגִּיד לְךָ אֶת־הָרָשׁוּם בִּכְתָב אֱמֶת וְאֵין אֶחָד מִתְחַזֵּק עִמִּי עַל־אֵלֶּה כִּי אִם־מִיכָאֵל שַׂרְכֶם׃
    hebrewPlain: אבל אגיד לך את הרשום בכתב אמת ואין אחד מתחזק עמי על אלה כי אם מיכאל שרכם
    kjvRefs:
    - Daniel 10:21
    kjvOsis:
    - Dan.10.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.10
- type: TanakhVerse
  data:
    osis: Dan.11.1
    scripture: tanakh
    name: Tanakh Daniel 11:1
    ref: Daniel 11:1
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 1
    ordinal: 20699
    text: And as for me, in the first year of Darius the Mede, I stood up to be a supporter and a stronghold unto him.
    translation: JPS 1917
    original: וַאֲנִי בִּשְׁנַת אַחַת לְדָרְיָוֶשׁ הַמָּדִי עָמְדִי לְמַחֲזִיק וּלְמָעוֹז לוֹ׃
    hebrewPlain: ואני בשנת אחת לדריוש המדי עמדי למחזיק ולמעוז לו
    kjvRefs:
    - Daniel 11:1
    kjvOsis:
    - Dan.11.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.2
    scripture: tanakh
    name: Tanakh Daniel 11:2
    ref: Daniel 11:2
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 2
    ordinal: 20700
    text: And now will I declare unto thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than they all; and when he is waxed strong through his riches, he shall stir up all against the realm of Greece.
    translation: JPS 1917
    original: וְעַתָּה אֱמֶת אַגִּיד לָךְ הִנֵּה־עוֹד שְׁלֹשָׁה מְלָכִים עֹמְדִים לְפָרַס וְהָרְבִיעִי יַעֲשִׁיר עֹשֶׁר־גָּדוֹל מִכֹּל וּכְחֶזְקָתוֹ בְעָשְׁרוֹ יָעִיר הַכֹּל אֵת מַלְכוּת יָוָן׃
    hebrewPlain: ועתה אמת אגיד לך הנה עוד שלשה מלכים עמדים לפרס והרביעי יעשיר עשר גדול מכל וכחזקתו בעשרו יעיר הכל את מלכות יון
    kjvRefs:
    - Daniel 11:2
    kjvOsis:
    - Dan.11.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.3
    scripture: tanakh
    name: Tanakh Daniel 11:3
    ref: Daniel 11:3
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 3
    ordinal: 20701
    text: And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.
    translation: JPS 1917
    original: וְעָמַד מֶלֶךְ גִּבּוֹר וּמָשַׁל מִמְשָׁל רַב וְעָשָׂה כִּרְצוֹנוֹ׃
    hebrewPlain: ועמד מלך גבור ומשל ממשל רב ועשה כרצונו
    kjvRefs:
    - Daniel 11:3
    kjvOsis:
    - Dan.11.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.4
    scripture: tanakh
    name: Tanakh Daniel 11:4
    ref: Daniel 11:4
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 4
    ordinal: 20702
    text: And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; but not to his posterity, nor according to his dominion wherewith he ruled; for his kingdom shall be plucked up, even for others beside those.
    translation: JPS 1917
    original: וּכְעָמְדוֹ תִּשָּׁבֵר מַלְכוּתוֹ וְתֵחָץ לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם וְלֹא לְאַחֲרִיתוֹ וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל כִּי תִנָּתֵשׁ מַלְכוּתוֹ וְלַאֲחֵרִים מִלְּבַד־אֵלֶּה׃
    hebrewPlain: וכעמדו תשבר מלכותו ותחץ לארבע רוחות השמים ולא לאחריתו ולא כמשלו אשר משל כי תנתש מלכותו ולאחרים מלבד אלה
    kjvRefs:
    - Daniel 11:4
    kjvOsis:
    - Dan.11.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.5
    scripture: tanakh
    name: Tanakh Daniel 11:5
    ref: Daniel 11:5
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 5
    ordinal: 20703
    text: And the king of the south shall be strong, and one of his princes; and he shall be strong above him, and have dominion; his dominion shall be a great dominion.
    translation: JPS 1917
    original: וְיֶחֱזַק מֶלֶךְ־הַנֶּגֶב וּמִן־שָׂרָיו וְיֶחֱזַק עָלָיו וּמָשָׁל מִמְשָׁל רַב מֶמְשַׁלְתּוֹ׃
    hebrewPlain: ויחזק מלך הנגב ומן שריו ויחזק עליו ומשל ממשל רב ממשלתו
    kjvRefs:
    - Daniel 11:5
    kjvOsis:
    - Dan.11.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.6
    scripture: tanakh
    name: Tanakh Daniel 11:6
    ref: Daniel 11:6
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 6
    ordinal: 20704
    text: And at the end of years they shall join themselves together; and the daughter of the king of the south shall come to the king of the north to make an agreement; but she shall not retain the strength of her arm; neither shall he stand, nor his arm; but she shall be given up, and they that brought her, and he that begot her, and he that obtained her in those times.
    translation: JPS 1917
    original: וּלְקֵץ שָׁנִים יִתְחַבָּרוּ וּבַת מֶלֶךְ־הַנֶּגֶב תָּבוֹא אֶל־מֶלֶךְ הַצָּפוֹן לַעֲשׂוֹת מֵישָׁרִים וְלֹא־תַעְצֹר כּוֹחַ הַזְּרוֹעַ וְלֹא יַעֲמֹד וּזְרֹעוֹ וְתִנָּתֵן הִיא וּמְבִיאֶיהָ וְהַיֹּלְדָהּ וּמַחֲזִקָהּ בָּעִתִּים׃
    hebrewPlain: ולקץ שנים יתחברו ובת מלך הנגב תבוא אל מלך הצפון לעשות מישרים ולא תעצר כוח הזרוע ולא יעמד וזרעו ותנתן היא ומביאיה והילדה ומחזקה בעתים
    kjvRefs:
    - Daniel 11:6
    kjvOsis:
    - Dan.11.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.7
    scripture: tanakh
    name: Tanakh Daniel 11:7
    ref: Daniel 11:7
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 7
    ordinal: 20705
    text: But one of the shoots of her roots shall stand up in his place, and shall come unto the army, and shall enter into the stronghold of the king of the north, and shall deal with them, and shall prevail;
    translation: JPS 1917
    original: וְעָמַד מִנֵּצֶר שָׁרָשֶׁיהָ כַּנּוֹ וְיָבֹא אֶל־הַחַיִל וְיָבֹא בְּמָעוֹז מֶלֶךְ הַצָּפוֹן וְעָשָׂה בָהֶם וְהֶחֱזִיק׃
    hebrewPlain: ועמד מנצר שרשיה כנו ויבא אל החיל ויבא במעוז מלך הצפון ועשה בהם והחזיק
    kjvRefs:
    - Daniel 11:7
    kjvOsis:
    - Dan.11.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.8
    scripture: tanakh
    name: Tanakh Daniel 11:8
    ref: Daniel 11:8
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 8
    ordinal: 20706
    text: and also their gods, with their molten images, and with their precious vessels of silver and of gold, shall he bring into captivity into Egypt; and he shall desist some years from the king of the north.
    translation: JPS 1917
    original: וְגַם אֱ‍לֹהֵיהֶם עִם־נְסִכֵיהֶם עִם־כְּלֵי חֶמְדָּתָם כֶּסֶף וְזָהָב בַּשְּׁבִי יָבִא מִצְרָיִם וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן׃
    hebrewPlain: וגם א‍להיהם עם נסכיהם עם כלי חמדתם כסף וזהב בשבי יבא מצרים והוא שנים יעמד ממלך הצפון
    kjvRefs:
    - Daniel 11:8
    kjvOsis:
    - Dan.11.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.9
    scripture: tanakh
    name: Tanakh Daniel 11:9
    ref: Daniel 11:9
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 9
    ordinal: 20707
    text: And he shall come into the kingdom of the king of the south, but he shall return into his own land.
    translation: JPS 1917
    original: וּבָא בְּמַלְכוּת מֶלֶךְ הַנֶּגֶב וְשָׁב אֶל־אַדְמָתוֹ׃
    hebrewPlain: ובא במלכות מלך הנגב ושב אל אדמתו
    kjvRefs:
    - Daniel 11:9
    kjvOsis:
    - Dan.11.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.10
    scripture: tanakh
    name: Tanakh Daniel 11:10
    ref: Daniel 11:10
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 10
    ordinal: 20708
    text: And his sons shall stir themselves up, and shall assemble a multitude of great forces, and he shall come on, and overflow, as he passes through; and he shall return and stir himself up, even to his stronghold.
    translation: JPS 1917
    original: ובנו [וּבָנָיו] יִתְגָּרוּ וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים וּבָא בוֹא וְשָׁטַף וְעָבָר וְיָשֹׁב ויתגרו [וְיִתְגָּרֶה] עַד־מעזה [מָעֻזּוֹ׃]
    hebrewPlain: ובנו [ובניו] יתגרו ואספו המון חילים רבים ובא בוא ושטף ועבר וישב ויתגרו [ויתגרה] עד מעזה [מעזו]
    kjvRefs:
    - Daniel 11:10
    kjvOsis:
    - Dan.11.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.11
    scripture: tanakh
    name: Tanakh Daniel 11:11
    ref: Daniel 11:11
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 11
    ordinal: 20709
    text: And the king of the south shall be moved with choler, and shall come forth and fight with him, even with the king of the north; and he shall set forth a great multitude, but the multitude shall be given into his hand.
    translation: JPS 1917
    original: וְיִתְמַרְמַר מֶלֶךְ הַנֶּגֶב וְיָצָא וְנִלְחַם עִמּוֹ עִם־מֶלֶךְ הַצָּפוֹן וְהֶעֱמִיד הָמוֹן רָב וְנִתַּן הֶהָמוֹן בְּיָדוֹ׃
    hebrewPlain: ויתמרמר מלך הנגב ויצא ונלחם עמו עם מלך הצפון והעמיד המון רב ונתן ההמון בידו
    kjvRefs:
    - Daniel 11:11
    kjvOsis:
    - Dan.11.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.12
    scripture: tanakh
    name: Tanakh Daniel 11:12
    ref: Daniel 11:12
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 12
    ordinal: 20710
    text: and the multitude shall be carried away, and his heart shall be lifted up; and he shall cast down tens of thousands; but he shall not prevail.
    translation: JPS 1917
    original: וְנִשָּׂא הֶהָמוֹן ירום [וְרָם] לְבָבוֹ וְהִפִּיל רִבֹּאוֹת וְלֹא יָעוֹז׃
    hebrewPlain: ונשא ההמון ירום [ורם] לבבו והפיל רבאות ולא יעוז
    kjvRefs:
    - Daniel 11:12
    kjvOsis:
    - Dan.11.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.13
    scripture: tanakh
    name: Tanakh Daniel 11:13
    ref: Daniel 11:13
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 13
    ordinal: 20711
    text: And the king of the north shall again set forth a multitude, greater than the former; and he shall come on at the end of the times, even of years, with a great army and with much substance.
    translation: JPS 1917
    original: וְשָׁב מֶלֶךְ הַצָּפוֹן וְהֶעֱמִיד הָמוֹן רַב מִן־הָרִאשׁוֹן וּלְקֵץ הָעִתִּים שָׁנִים יָבוֹא בוֹא בְּחַיִל גָּדוֹל וּבִרְכוּשׁ רָב׃
    hebrewPlain: ושב מלך הצפון והעמיד המון רב מן הראשון ולקץ העתים שנים יבוא בוא בחיל גדול וברכוש רב
    kjvRefs:
    - Daniel 11:13
    kjvOsis:
    - Dan.11.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.14
    scripture: tanakh
    name: Tanakh Daniel 11:14
    ref: Daniel 11:14
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 14
    ordinal: 20712
    text: And in those times there shall many stand up against the king of the south; also the children of the violent among thy people shall lift themselves up to establish the vision; but they shall stumble.
    translation: JPS 1917
    original: וּבָעִתִּים הָהֵם רַבִּים יַעַמְדוּ עַל־מֶלֶךְ הַנֶּגֶב וּבְנֵי פָּרִיצֵי עַמְּךָ יִנַּשְּׂאוּ לְהַעֲמִיד חָזוֹן וְנִכְשָׁלוּ׃
    hebrewPlain: ובעתים ההם רבים יעמדו על מלך הנגב ובני פריצי עמך ינשאו להעמיד חזון ונכשלו
    kjvRefs:
    - Daniel 11:14
    kjvOsis:
    - Dan.11.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.15
    scripture: tanakh
    name: Tanakh Daniel 11:15
    ref: Daniel 11:15
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 15
    ordinal: 20713
    text: And the king of the north shall come, and cast up a mound, and take a well-fortified city; and the arms of the south shall not withstand; and as for his chosen people, there shall be no strength in them to withstand.
    translation: JPS 1917
    original: וְיָבֹא מֶלֶךְ הַצָּפוֹן וְיִשְׁפֹּךְ סוֹלֲלָה וְלָכַד עִיר מִבְצָרוֹת וּזְרֹעוֹת הַנֶּגֶב לֹא יַעֲמֹדוּ וְעַם מִבְחָרָיו וְאֵין כֹּחַ לַעֲמֹד׃
    hebrewPlain: ויבא מלך הצפון וישפך סוללה ולכד עיר מבצרות וזרעות הנגב לא יעמדו ועם מבחריו ואין כח לעמד
    kjvRefs:
    - Daniel 11:15
    kjvOsis:
    - Dan.11.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.16
    scripture: tanakh
    name: Tanakh Daniel 11:16
    ref: Daniel 11:16
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 16
    ordinal: 20714
    text: But he that cometh against him shall do according to his own will, and none shall stand before him; and he shall stand in the beauteous land, and in his hand shall be extermination.
    translation: JPS 1917
    original: וְיַעַשׂ הַבָּא אֵלָיו כִּרְצוֹנוֹ וְאֵין עוֹמֵד לְפָנָיו וְיַעֲמֹד בְּאֶרֶץ־הַצְּבִי וְכָלָה בְיָדוֹ׃
    hebrewPlain: ויעש הבא אליו כרצונו ואין עומד לפניו ויעמד בארץ הצבי וכלה בידו
    kjvRefs:
    - Daniel 11:16
    kjvOsis:
    - Dan.11.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.17
    scripture: tanakh
    name: Tanakh Daniel 11:17
    ref: Daniel 11:17
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 17
    ordinal: 20715
    text: And he shall set his face to come with the strength of his whole kingdom, but shall make an agreement with him; and he shall give him the daughter of women, to destroy it; but it shall not stand, neither be for him.
    translation: JPS 1917
    original: וְיָשֵׂם פָּנָיו לָבוֹא בְּתֹקֶף כָּל־מַלְכוּתוֹ וִישָׁרִים עִמּוֹ וְעָשָׂה וּבַת הַנָּשִׁים יִתֶּן־לוֹ לְהַשְׁחִיתָהּ וְלֹא תַעֲמֹד וְלֹא־לוֹ תִהְיֶה׃
    hebrewPlain: וישם פניו לבוא בתקף כל מלכותו וישרים עמו ועשה ובת הנשים יתן לו להשחיתה ולא תעמד ולא לו תהיה
    kjvRefs:
    - Daniel 11:17
    kjvOsis:
    - Dan.11.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.18
    scripture: tanakh
    name: Tanakh Daniel 11:18
    ref: Daniel 11:18
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 18
    ordinal: 20716
    text: After this shall he set his face unto the isles, and shall take many; but a captain shall cause the reproach offered by him to cease; yea, he shall cause his own reproach to return upon him.
    translation: JPS 1917
    original: וישב [וְיָשֵׂם ] פָּנָיו לְאִיִּים וְלָכַד רַבִּים וְהִשְׁבִּית קָצִין חֶרְפָּתוֹ לוֹ בִּלְתִּי חֶרְפָּתוֹ יָשִׁיב לוֹ׃
    hebrewPlain: וישב [וישם ] פניו לאיים ולכד רבים והשבית קצין חרפתו לו בלתי חרפתו ישיב לו
    kjvRefs:
    - Daniel 11:18
    kjvOsis:
    - Dan.11.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.19
    scripture: tanakh
    name: Tanakh Daniel 11:19
    ref: Daniel 11:19
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 19
    ordinal: 20717
    text: Then he shall turn his face toward the strongholds of his own land; but he shall stumble and fall, and shall not be found.
    translation: JPS 1917
    original: וְיָשֵׁב פָּנָיו לְמָעוּזֵּי אַרְצוֹ וְנִכְשַׁל וְנָפַל וְלֹא יִמָּצֵא׃
    hebrewPlain: וישב פניו למעוזי ארצו ונכשל ונפל ולא ימצא
    kjvRefs:
    - Daniel 11:19
    kjvOsis:
    - Dan.11.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.20
    scripture: tanakh
    name: Tanakh Daniel 11:20
    ref: Daniel 11:20
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 20
    ordinal: 20718
    text: Then shall stand up in his place one that shall cause an exactor to pass through the glory of the kingdom; but within few days he shall be destroyed, neither in anger, nor in battle.
    translation: JPS 1917
    original: וְעָמַד עַל־כַּנּוֹ מַעֲבִיר נוֹגֵשׂ הֶדֶר מַלְכוּת וּבְיָמִים אֲחָדִים יִשָּׁבֵר וְלֹא בְאַפַּיִם וְלֹא בְמִלְחָמָה׃
    hebrewPlain: ועמד על כנו מעביר נוגש הדר מלכות ובימים אחדים ישבר ולא באפים ולא במלחמה
    kjvRefs:
    - Daniel 11:20
    kjvOsis:
    - Dan.11.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.21
    scripture: tanakh
    name: Tanakh Daniel 11:21
    ref: Daniel 11:21
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 21
    ordinal: 20719
    text: And in his place shall stand up a contemptible person, upon whom had not been conferred the majesty of the kingdom; but he shall come in time of security, and shall obtain the kingdom by blandishments.
    translation: JPS 1917
    original: וְעָמַד עַל־כַּנּוֹ נִבְזֶה וְלֹא־נָתְנוּ עָלָיו הוֹד מַלְכוּת וּבָא בְשַׁלְוָה וְהֶחֱזִיק מַלְכוּת בַּחֲלַקְלַקּוֹת׃
    hebrewPlain: ועמד על כנו נבזה ולא נתנו עליו הוד מלכות ובא בשלוה והחזיק מלכות בחלקלקות
    kjvRefs:
    - Daniel 11:21
    kjvOsis:
    - Dan.11.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.22
    scripture: tanakh
    name: Tanakh Daniel 11:22
    ref: Daniel 11:22
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 22
    ordinal: 20720
    text: And the arms of the flood shall be swept away from before him, and shall be broken; yea, also the prince of the covenant.
    translation: JPS 1917
    original: וּזְרֹעוֹת הַשֶּׁטֶף יִשָּׁטְפוּ מִלְּפָנָיו וְיִשָּׁבֵרוּ וְגַם נְגִיד בְּרִית׃
    hebrewPlain: וזרעות השטף ישטפו מלפניו וישברו וגם נגיד ברית
    kjvRefs:
    - Daniel 11:22
    kjvOsis:
    - Dan.11.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.23
    scripture: tanakh
    name: Tanakh Daniel 11:23
    ref: Daniel 11:23
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 23
    ordinal: 20721
    text: And after the league made with him he shall work deceitfully; and he shall come up and become strong, with a little nation.
    translation: JPS 1917
    original: וּמִן־הִתְחַבְּרוּת אֵלָיו יַעֲשֶׂה מִרְמָה וְעָלָה וְעָצַם בִּמְעַט־גּוֹי׃
    hebrewPlain: ומן התחברות אליו יעשה מרמה ועלה ועצם במעט גוי
    kjvRefs:
    - Daniel 11:23
    kjvOsis:
    - Dan.11.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.24
    scripture: tanakh
    name: Tanakh Daniel 11:24
    ref: Daniel 11:24
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 24
    ordinal: 20722
    text: 'In time of security shall he come even upon the fattest places of the province; and he shall do that which his fathers have not done, nor his fathers’ fathers: he shall scatter among them prey, and spoil, and substance; yea, he shall devise his devices against fortresses, but only until the time.'
    translation: JPS 1917
    original: בְּשַׁלְוָה וּבְמִשְׁמַנֵּי מְדִינָה יָבוֹא וְעָשָׂה אֲשֶׁר לֹא־עָשׂוּ אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו בִּזָּה וְשָׁלָל וּרְכוּשׁ לָהֶם יִבְזוֹר וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו וְעַד־עֵת׃
    hebrewPlain: בשלוה ובמשמני מדינה יבוא ועשה אשר לא עשו אבתיו ואבות אבתיו בזה ושלל ורכוש להם יבזור ועל מבצרים יחשב מחשבתיו ועד עת
    kjvRefs:
    - Daniel 11:24
    kjvOsis:
    - Dan.11.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.25
    scripture: tanakh
    name: Tanakh Daniel 11:25
    ref: Daniel 11:25
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 25
    ordinal: 20723
    text: And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall stir himself up to battle with a very great and mighty army; but he shall not stand, for they shall devise devices against him.
    translation: JPS 1917
    original: וְיָעֵר כֹּחוֹ וּלְבָבוֹ עַל־מֶלֶךְ הַנֶּגֶב בְּחַיִל גָּדוֹל וּמֶלֶךְ הַנֶּגֶב יִתְגָּרֶה לַמִּלְחָמָה בְּחַיִל־גָּדוֹל וְעָצוּם עַד־מְאֹד וְלֹא יַעֲמֹד כִּי־יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת׃
    hebrewPlain: ויער כחו ולבבו על מלך הנגב בחיל גדול ומלך הנגב יתגרה למלחמה בחיל גדול ועצום עד מאד ולא יעמד כי יחשבו עליו מחשבות
    kjvRefs:
    - Daniel 11:25
    kjvOsis:
    - Dan.11.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.26
    scripture: tanakh
    name: Tanakh Daniel 11:26
    ref: Daniel 11:26
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 26
    ordinal: 20724
    text: Yea, they that eat of his food shall destroy him, and his army shall be swept away; and many shall fall down slain.
    translation: JPS 1917
    original: וְאֹכְלֵי פַת־בָּגוֹ יִשְׁבְּרוּהוּ וְחֵילוֹ יִשְׁטוֹף וְנָפְלוּ חֲלָלִים רַבִּים׃
    hebrewPlain: ואכלי פת בגו ישברוהו וחילו ישטוף ונפלו חללים רבים
    kjvRefs:
    - Daniel 11:26
    kjvOsis:
    - Dan.11.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.27
    scripture: tanakh
    name: Tanakh Daniel 11:27
    ref: Daniel 11:27
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 27
    ordinal: 20725
    text: And as for both these kings, their hearts shall be to do mischief, and they shall speak lies at one table; but it shall not prosper, for the end remaineth yet for the time appointed.
    translation: JPS 1917
    original: וּשְׁנֵיהֶם הַמְּלָכִים לְבָבָם לְמֵרָע וְעַל־שֻׁלְחָן אֶחָד כָּזָב יְדַבֵּרוּ וְלֹא תִצְלָח כִּי־עוֹד קֵץ לַמּוֹעֵד׃
    hebrewPlain: ושניהם המלכים לבבם למרע ועל שלחן אחד כזב ידברו ולא תצלח כי עוד קץ למועד
    kjvRefs:
    - Daniel 11:27
    kjvOsis:
    - Dan.11.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.28
    scripture: tanakh
    name: Tanakh Daniel 11:28
    ref: Daniel 11:28
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 28
    ordinal: 20726
    text: And he shall return to his own land with great substance; and his heart shall be against the holy covenant; and he shall do his pleasure, and return to his own land.
    translation: JPS 1917
    original: וְיָשֹׁב אַרְצוֹ בִּרְכוּשׁ גָּדוֹל וּלְבָבוֹ עַל־בְּרִית קֹדֶשׁ וְעָשָׂה וְשָׁב לְאַרְצוֹ׃
    hebrewPlain: וישב ארצו ברכוש גדול ולבבו על ברית קדש ועשה ושב לארצו
    kjvRefs:
    - Daniel 11:28
    kjvOsis:
    - Dan.11.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.29
    scripture: tanakh
    name: Tanakh Daniel 11:29
    ref: Daniel 11:29
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 29
    ordinal: 20727
    text: At the time appointed he shall return, and come into the south; but it shall not be in the latter time as it was in the former.
    translation: JPS 1917
    original: לַמּוֹעֵד יָשׁוּב וּבָא בַנֶּגֶב וְלֹא־תִהְיֶה כָרִאשֹׁנָה וְכָאַחֲרֹנָה׃
    hebrewPlain: למועד ישוב ובא בנגב ולא תהיה כראשנה וכאחרנה
    kjvRefs:
    - Daniel 11:29
    kjvOsis:
    - Dan.11.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.30
    scripture: tanakh
    name: Tanakh Daniel 11:30
    ref: Daniel 11:30
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 30
    ordinal: 20728
    text: For ships of Kittim shall come against him, and he shall be cowed, and he shall return, and have indignation against the holy covenant, and shall do his pleasure; and he shall return, and have regard unto them that forsake the holy covenant.
    translation: JPS 1917
    original: וּבָאוּ בוֹ צִיִּים כִּתִּים וְנִכְאָה וְשָׁב וְזָעַם עַל־בְּרִית־קוֹדֶשׁ וְעָשָׂה וְשָׁב וְיָבֵן עַל־עֹזְבֵי בְּרִית קֹדֶשׁ׃
    hebrewPlain: ובאו בו ציים כתים ונכאה ושב וזעם על ברית קודש ועשה ושב ויבן על עזבי ברית קדש
    kjvRefs:
    - Daniel 11:30
    kjvOsis:
    - Dan.11.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.31
    scripture: tanakh
    name: Tanakh Daniel 11:31
    ref: Daniel 11:31
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 31
    ordinal: 20729
    text: And arms shall stand on his part, and they shall profane the sanctuary, even the stronghold, and shall take away the continual burnt-offering, and they shall set up the detestable thing that causeth appalment.
    translation: JPS 1917
    original: וּזְרֹעִים מִמֶּנּוּ יַעֲמֹדוּ וְחִלְּלוּ הַמִּקְדָּשׁ הַמָּעוֹז וְהֵסִירוּ הַתָּמִיד וְנָתְנוּ הַשִּׁקּוּץ מְשׁוֹמֵם׃
    hebrewPlain: וזרעים ממנו יעמדו וחללו המקדש המעוז והסירו התמיד ונתנו השקוץ משומם
    kjvRefs:
    - Daniel 11:31
    kjvOsis:
    - Dan.11.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.32
    scripture: tanakh
    name: Tanakh Daniel 11:32
    ref: Daniel 11:32
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 32
    ordinal: 20730
    text: And such as do wickedly against the covenant shall be corrupt by blandishments; but the people that know their God shall show strength, and prevail.
    translation: JPS 1917
    original: וּמַרְשִׁיעֵי בְרִית יַחֲנִיף בַּחֲלַקּוֹת וְעַם יֹדְעֵי אֱלֹהָיו יַחֲזִקוּ וְעָשׂוּ׃
    hebrewPlain: ומרשיעי ברית יחניף בחלקות ועם ידעי אלהיו יחזקו ועשו
    kjvRefs:
    - Daniel 11:32
    kjvOsis:
    - Dan.11.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.33
    scripture: tanakh
    name: Tanakh Daniel 11:33
    ref: Daniel 11:33
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 33
    ordinal: 20731
    text: And they that are wise among the people shall cause the many to understand; yet they shall stumble by the sword and by flame, by captivity and by spoil, many days.
    translation: JPS 1917
    original: וּמַשְׂכִּילֵי עָם יָבִינוּ לָרַבִּים וְנִכְשְׁלוּ בְּחֶרֶב וּבְלֶהָבָה בִּשְׁבִי וּבְבִזָּה יָמִים׃
    hebrewPlain: ומשכילי עם יבינו לרבים ונכשלו בחרב ובלהבה בשבי ובבזה ימים
    kjvRefs:
    - Daniel 11:33
    kjvOsis:
    - Dan.11.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.34
    scripture: tanakh
    name: Tanakh Daniel 11:34
    ref: Daniel 11:34
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 34
    ordinal: 20732
    text: Now when they shall stumble, they shall be helped with a little help; but many shall join themselves unto them with blandishments.
    translation: JPS 1917
    original: וּבְהִכָּשְׁלָם יֵעָזְרוּ עֵזֶר מְעָט וְנִלְווּ עֲלֵיהֶם רַבִּים בַּחֲלַקְלַקּוֹת׃
    hebrewPlain: ובהכשלם יעזרו עזר מעט ונלוו עליהם רבים בחלקלקות
    kjvRefs:
    - Daniel 11:34
    kjvOsis:
    - Dan.11.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.35
    scripture: tanakh
    name: Tanakh Daniel 11:35
    ref: Daniel 11:35
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 35
    ordinal: 20733
    text: And some of them that are wise shall stumble, to refine among them, and to purify, and to make white, even to the time of the end; for it is yet for the time appointed.
    translation: JPS 1917
    original: וּמִן־הַמַּשְׂכִּילִים יִכָּשְׁלוּ לִצְרוֹף בָּהֶם וּלְבָרֵר וְלַלְבֵּן עַד־עֵת קֵץ כִּי־עוֹד לַמּוֹעֵד׃
    hebrewPlain: ומן המשכילים יכשלו לצרוף בהם ולברר וללבן עד עת קץ כי עוד למועד
    kjvRefs:
    - Daniel 11:35
    kjvOsis:
    - Dan.11.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.36
    scripture: tanakh
    name: Tanakh Daniel 11:36
    ref: Daniel 11:36
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 36
    ordinal: 20734
    text: And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak strange things against the God of gods; and he shall prosper till the indignation be accomplished; for that which is determined shall be done.
    translation: JPS 1917
    original: וְעָשָׂה כִרְצוֹנוֹ הַמֶּלֶךְ וְיִתְרוֹמֵם וְיִתְגַּדֵּל עַל־כָּל־אֵל וְעַל אֵל אֵלִים יְדַבֵּר נִפְלָאוֹת וְהִצְלִיחַ עַד־כָּלָה זַעַם כִּי נֶחֱרָצָה נֶעֱשָׂתָה׃
    hebrewPlain: ועשה כרצונו המלך ויתרומם ויתגדל על כל אל ועל אל אלים ידבר נפלאות והצליח עד כלה זעם כי נחרצה נעשתה
    kjvRefs:
    - Daniel 11:36
    kjvOsis:
    - Dan.11.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.37
    scripture: tanakh
    name: Tanakh Daniel 11:37
    ref: Daniel 11:37
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 37
    ordinal: 20735
    text: Neither shall he regard the gods of his fathers; and neither the desire of women, nor any god, shall he regard; for he shall magnify himself above all.
    translation: JPS 1917
    original: וְעַל־אֱלֹהֵי אֲבֹתָיו לֹא יָבִין וְעַל־חֶמְדַּת נָשִׁים וְעַל־כָּל־אֱלוֹהַּ לֹא יָבִין כִּי עַל־כֹּל יִתְגַּדָּל׃
    hebrewPlain: ועל אלהי אבתיו לא יבין ועל חמדת נשים ועל כל אלוה לא יבין כי על כל יתגדל
    kjvRefs:
    - Daniel 11:37
    kjvOsis:
    - Dan.11.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.38
    scripture: tanakh
    name: Tanakh Daniel 11:38
    ref: Daniel 11:38
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 38
    ordinal: 20736
    text: But in his place shall he honour the god of strongholds; and a god whom his fathers knew not shall he honour with gold, and silver, and with precious stones, and costly things. .
    translation: JPS 1917
    original: וְלֶאֱלֹהַּ מָעֻזִּים עַל־כַּנּוֹ יְכַבֵּד וְלֶאֱלוֹהַּ אֲשֶׁר לֹא־יְדָעֻהוּ אֲבֹתָיו יְכַבֵּד בְּזָהָב וּבְכֶסֶף וּבְאֶבֶן יְקָרָה וּבַחֲמֻדוֹת׃
    hebrewPlain: ולאלה מעזים על כנו יכבד ולאלוה אשר לא ידעהו אבתיו יכבד בזהב ובכסף ובאבן יקרה ובחמדות
    kjvRefs:
    - Daniel 11:38
    kjvOsis:
    - Dan.11.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.39
    scripture: tanakh
    name: Tanakh Daniel 11:39
    ref: Daniel 11:39
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 39
    ordinal: 20737
    text: And he shall deal with the strongest fortresses with the help of a foreign god; whom he shall acknowledge, shall increase glory; and he shall cause them to rule over many, and shall divide the land for a price.
    translation: JPS 1917
    original: וְעָשָׂה לְמִבְצְרֵי מָעֻזִּים עִם־אֱלוֹהַּ נֵכָר אֲשֶׁר הכיר [יַכִּיר] יַרְבֶּה כָבוֹד וְהִמְשִׁילָם בָּרַבִּים וַאֲדָמָה יְחַלֵּק בִּמְחִיר׃
    hebrewPlain: ועשה למבצרי מעזים עם אלוה נכר אשר הכיר [יכיר] ירבה כבוד והמשילם ברבים ואדמה יחלק במחיר
    kjvRefs:
    - Daniel 11:39
    kjvOsis:
    - Dan.11.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.40
    scripture: tanakh
    name: Tanakh Daniel 11:40
    ref: Daniel 11:40
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 40
    ordinal: 20738
    text: And at the time of the end shall the king of the south push at him; and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow, as he passes through.
    translation: JPS 1917
    original: וּבְעֵת קֵץ יִתְנַגַּח עִמּוֹ מֶלֶךְ הַנֶּגֶב וְיִשְׂתָּעֵר עָלָיו מֶלֶךְ הַצָּפוֹן בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת וּבָא בַאֲרָצוֹת וְשָׁטַף וְעָבָר׃
    hebrewPlain: ובעת קץ יתנגח עמו מלך הנגב וישתער עליו מלך הצפון ברכב ובפרשים ובאניות רבות ובא בארצות ושטף ועבר
    kjvRefs:
    - Daniel 11:40
    kjvOsis:
    - Dan.11.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.41
    scripture: tanakh
    name: Tanakh Daniel 11:41
    ref: Daniel 11:41
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 41
    ordinal: 20739
    text: He shall enter also into the beauteous land, and many countries shall be overthrown; but these shall be delivered out of his hand, Edom, and Moab, and the chief of the children of Ammon.
    translation: JPS 1917
    original: וּבָא בְּאֶרֶץ הַצְּבִי וְרַבּוֹת יִכָּשֵׁלוּ וְאֵלֶּה יִמָּלְטוּ מִיָּדוֹ אֱדוֹם וּמוֹאָב וְרֵאשִׁית בְּנֵי עַמּוֹן׃
    hebrewPlain: ובא בארץ הצבי ורבות יכשלו ואלה ימלטו מידו אדום ומואב וראשית בני עמון
    kjvRefs:
    - Daniel 11:41
    kjvOsis:
    - Dan.11.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.42
    scripture: tanakh
    name: Tanakh Daniel 11:42
    ref: Daniel 11:42
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 42
    ordinal: 20740
    text: He shall stretch forth his hand also upon the countries; and the land of Egypt shall not escape.
    translation: JPS 1917
    original: וְיִשְׁלַח יָדוֹ בַּאֲרָצוֹת וְאֶרֶץ מִצְרַיִם לֹא תִהְיֶה לִפְלֵיטָה׃
    hebrewPlain: וישלח ידו בארצות וארץ מצרים לא תהיה לפליטה
    kjvRefs:
    - Daniel 11:42
    kjvOsis:
    - Dan.11.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.43
    scripture: tanakh
    name: Tanakh Daniel 11:43
    ref: Daniel 11:43
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 43
    ordinal: 20741
    text: But he shall have power over the treasures of gold and silver, and over all the precious things of Egypt; and the Libyans and the Ethiopians shall be at his steps.
    translation: JPS 1917
    original: וּמָשַׁל בְּמִכְמַנֵּי הַזָּהָב וְהַכֶּסֶף וּבְכֹל חֲמֻדוֹת מִצְרָיִם וְלֻבִים וְכֻשִׁים בְּמִצְעָדָיו׃
    hebrewPlain: ומשל במכמני הזהב והכסף ובכל חמדות מצרים ולבים וכשים במצעדיו
    kjvRefs:
    - Daniel 11:43
    kjvOsis:
    - Dan.11.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.44
    scripture: tanakh
    name: Tanakh Daniel 11:44
    ref: Daniel 11:44
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 44
    ordinal: 20742
    text: But tidings out of the east and out of the north shall affright him; and he shall go forth with great fury to destroy and utterly to take away many.
    translation: JPS 1917
    original: וּשְׁמֻעוֹת יְבַהֲלֻהוּ מִמִּזְרָח וּמִצָּפוֹן וְיָצָא בְּחֵמָא גְדֹלָה לְהַשְׁמִיד וּלְהַחֲרִים רַבִּים׃
    hebrewPlain: ושמעות יבהלהו ממזרח ומצפון ויצא בחמא גדלה להשמיד ולהחרים רבים
    kjvRefs:
    - Daniel 11:44
    kjvOsis:
    - Dan.11.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.11.45
    scripture: tanakh
    name: Tanakh Daniel 11:45
    ref: Daniel 11:45
    book: Dan
    section: ketuvim
    chapter: 11
    verse: 45
    ordinal: 20743
    text: And he shall plant the tents of his palace between the seas and the beauteous holy mountain; and he shall come to his end, and none shall help him.
    translation: JPS 1917
    original: וְיִטַּע אָהֳלֶי אַפַּדְנוֹ בֵּין יַמִּים לְהַר־צְבִי־קֹדֶשׁ וּבָא עַד־קִצּוֹ וְאֵין עוֹזֵר לוֹ׃
    hebrewPlain: ויטע אהלי אפדנו בין ימים להר צבי קדש ובא עד קצו ואין עוזר לו
    kjvRefs:
    - Daniel 11:45
    kjvOsis:
    - Dan.11.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.11
- type: TanakhVerse
  data:
    osis: Dan.12.1
    scripture: tanakh
    name: Tanakh Daniel 12:1
    ref: Daniel 12:1
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 1
    ordinal: 20744
    text: And at that time shall Michael stand up, the great prince who standeth for the children of thy people; and there shall be a time of trouble, such as never was since there was a nation even to that same time; and at that time thy people shall be delivered, every one that shall be found written in the book.
    translation: JPS 1917
    original: וּבָעֵת הַהִיא יַעֲמֹד מִיכָאֵל הַשַּׂר הַגָּדוֹל הָעֹמֵד עַל־בְּנֵי עַמֶּךָ וְהָיְתָה עֵת צָרָה אֲשֶׁר לֹא־נִהְיְתָה מִהְיוֹת גּוֹי עַד הָעֵת הַהִיא וּבָעֵת הַהִיא יִמָּלֵט עַמְּךָ כָּל־הַנִּמְצָא כָּתוּב בַּסֵּפֶר׃
    hebrewPlain: ובעת ההיא יעמד מיכאל השר הגדול העמד על בני עמך והיתה עת צרה אשר לא נהיתה מהיות גוי עד העת ההיא ובעת ההיא ימלט עמך כל הנמצא כתוב בספר
    kjvRefs:
    - Daniel 12:1
    kjvOsis:
    - Dan.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.2
    scripture: tanakh
    name: Tanakh Daniel 12:2
    ref: Daniel 12:2
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 2
    ordinal: 20745
    text: And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to reproaches and everlasting abhorrence.
    translation: JPS 1917
    original: וְרַבִּים מִיְּשֵׁנֵי אַדְמַת־עָפָר יָקִיצוּ אֵלֶּה לְחַיֵּי עוֹלָם וְאֵלֶּה לַחֲרָפוֹת לְדִרְאוֹן עוֹלָם׃
    hebrewPlain: ורבים מישני אדמת עפר יקיצו אלה לחיי עולם ואלה לחרפות לדראון עולם
    kjvRefs:
    - Daniel 12:2
    kjvOsis:
    - Dan.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.3
    scripture: tanakh
    name: Tanakh Daniel 12:3
    ref: Daniel 12:3
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 3
    ordinal: 20746
    text: And they that are wise shall shine as the brightness of the firmament; and they that turn the many to righteousness as the stars for ever and ever.
    translation: JPS 1917
    original: וְהַמַּשְׂכִּלִים יַזְהִרוּ כְּזֹהַר הָרָקִיעַ וּמַצְדִּיקֵי הָרַבִּים כַּכּוֹכָבִים לְעוֹלָם וָעֶד׃
    hebrewPlain: והמשכלים יזהרו כזהר הרקיע ומצדיקי הרבים ככוכבים לעולם ועד
    kjvRefs:
    - Daniel 12:3
    kjvOsis:
    - Dan.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.4
    scripture: tanakh
    name: Tanakh Daniel 12:4
    ref: Daniel 12:4
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 4
    ordinal: 20747
    text: But thou, O Daniel, shut up the words, and seal the book, even to the time of the end; many shall run to and fro, and knowledge shall be increased.’
    translation: JPS 1917
    original: וְאַתָּה דָנִיֵּאל סְתֹם הַדְּבָרִים וַחֲתֹם הַסֵּפֶר עַד־עֵת קֵץ יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת׃
    hebrewPlain: ואתה דניאל סתם הדברים וחתם הספר עד עת קץ ישטטו רבים ותרבה הדעת
    kjvRefs:
    - Daniel 12:4
    kjvOsis:
    - Dan.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.5
    scripture: tanakh
    name: Tanakh Daniel 12:5
    ref: Daniel 12:5
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 5
    ordinal: 20748
    text: Then I Daniel looked, and, behold, there stood other two, the one on the bank of the river on this side, and the other on the bank of the river on that side.
    translation: JPS 1917
    original: וְרָאִיתִי אֲנִי דָנִיֵּאל וְהִנֵּה שְׁנַיִם אֲחֵרִים עֹמְדִים אֶחָד הֵנָּה לִשְׂפַת הַיְאֹר וְאֶחָד הֵנָּה לִשְׂפַת הַיְאֹר׃
    hebrewPlain: וראיתי אני דניאל והנה שנים אחרים עמדים אחד הנה לשפת היאר ואחד הנה לשפת היאר
    kjvRefs:
    - Daniel 12:5
    kjvOsis:
    - Dan.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.6
    scripture: tanakh
    name: Tanakh Daniel 12:6
    ref: Daniel 12:6
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 6
    ordinal: 20749
    text: 'And one said to the man clothed in linen, who was above the waters of the river: ‘How long shall it be to the end of the wonders?’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָאִישׁ לְבוּשׁ הַבַּדִּים אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר עַד־מָתַי קֵץ הַפְּלָאוֹת׃
    hebrewPlain: ויאמר לאיש לבוש הבדים אשר ממעל למימי היאר עד מתי קץ הפלאות
    kjvRefs:
    - Daniel 12:6
    kjvOsis:
    - Dan.12.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.7
    scripture: tanakh
    name: Tanakh Daniel 12:7
    ref: Daniel 12:7
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 7
    ordinal: 20750
    text: And I heard the man clothed in linen, who was above the waters of the river, when he lifted up his right hand and his left hand unto heaven, and swore by Him that liveth for ever that it shall be for a time, times, and a half; and when they have made an end of breaking in pieces the power of the holy people, all these things shall be finished.
    translation: JPS 1917
    original: וָאֶשְׁמַע אֶת־הָאִישׁ לְבוּשׁ הַבַּדִּים אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ אֶל־הַשָּׁמַיִם וַיִּשָּׁבַע בְּחֵי הָעוֹלָם כִּי לְמוֹעֵד מוֹעֲדִים וָחֵצִי וּכְכַלּוֹת נַפֵּץ יַד־עַם־קֹדֶשׁ תִּכְלֶינָה כָל־אֵלֶּה׃
    hebrewPlain: ואשמע את האיש לבוש הבדים אשר ממעל למימי היאר וירם ימינו ושמאלו אל השמים וישבע בחי העולם כי למועד מועדים וחצי וככלות נפץ יד עם קדש תכלינה כל אלה
    kjvRefs:
    - Daniel 12:7
    kjvOsis:
    - Dan.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.8
    scripture: tanakh
    name: Tanakh Daniel 12:8
    ref: Daniel 12:8
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 8
    ordinal: 20751
    text: 'And I heard, but I understood not; then said I: ‘O my Lord, what shall be the latter end of these things?’'
    translation: JPS 1917
    original: וַאֲנִי שָׁמַעְתִּי וְלֹא אָבִין וָאֹמְרָה אֲדֹנִי מָה אַחֲרִית אֵלֶּה׃
    hebrewPlain: ואני שמעתי ולא אבין ואמרה אדני מה אחרית אלה
    kjvRefs:
    - Daniel 12:8
    kjvOsis:
    - Dan.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.9
    scripture: tanakh
    name: Tanakh Daniel 12:9
    ref: Daniel 12:9
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 9
    ordinal: 20752
    text: 'And he said: ‘Go thy way, Daniel; for the words are shut up and sealed till the time of the end.'
    translation: JPS 1917
    original: וַיֹּאמֶר לֵךְ דָּנִיֵּאל כִּי־סְתֻמִים וַחֲתֻמִים הַדְּבָרִים עַד־עֵת קֵץ׃
    hebrewPlain: ויאמר לך דניאל כי סתמים וחתמים הדברים עד עת קץ
    kjvRefs:
    - Daniel 12:9
    kjvOsis:
    - Dan.12.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.10
    scripture: tanakh
    name: Tanakh Daniel 12:10
    ref: Daniel 12:10
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 10
    ordinal: 20753
    text: Many shall purify themselves, and make themselves white, and be refined; but the wicked shall do wickedly; and none of the wicked shall understand; but they that are wise shall understand.
    translation: JPS 1917
    original: יִתְבָּרֲרוּ וְיִתְלַבְּנוּ וְיִצָּרְפוּ רַבִּים וְהִרְשִׁיעוּ רְשָׁעִים וְלֹא יָבִינוּ כָּל־רְשָׁעִים וְהַמַּשְׂכִּלִים יָבִינוּ׃
    hebrewPlain: יתבררו ויתלבנו ויצרפו רבים והרשיעו רשעים ולא יבינו כל רשעים והמשכלים יבינו
    kjvRefs:
    - Daniel 12:10
    kjvOsis:
    - Dan.12.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.11
    scripture: tanakh
    name: Tanakh Daniel 12:11
    ref: Daniel 12:11
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 11
    ordinal: 20754
    text: And from the time that the continual burnt-offering shall be taken away, and the detestable thing that causes appalment set up, there shall be a thousand two hundred and ninety days.
    translation: JPS 1917
    original: וּמֵעֵת הוּסַר הַתָּמִיד וְלָתֵת שִׁקּוּץ שֹׁמֵם יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים׃
    hebrewPlain: ומעת הוסר התמיד ולתת שקוץ שמם ימים אלף מאתים ותשעים
    kjvRefs:
    - Daniel 12:11
    kjvOsis:
    - Dan.12.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.12
- type: TanakhVerse
  data:
    osis: Dan.12.12
    scripture: tanakh
    name: Tanakh Daniel 12:12
    ref: Daniel 12:12
    book: Dan
    section: ketuvim
    chapter: 12
    verse: 12
    ordinal: 20755
    text: Happy is he that waiteth, and cometh to the thousand three hundred and five and thirty days.
    translation: JPS 1917
    original: אַשְׁרֵי הַמְחַכֶּה וְיַגִּיעַ לְיָמִים אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה׃
    hebrewPlain: אשרי המחכה ויגיע לימים אלף שלש מאות שלשים וחמשה
    kjvRefs:
    - Daniel 12:12
    kjvOsis:
    - Dan.12.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
