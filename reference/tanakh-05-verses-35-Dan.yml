- type: TanakhVerse
  data:
    osis: Dan.2.31
    scripture: tanakh
    name: Tanakh Daniel 2:31
    ref: Daniel 2:31
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 31
    ordinal: 20451
    text: Thou, O king, sawest, and behold a great image. This image, which was mighty, and whose brightness was surpassing, stood before thee; and the appearance thereof was terrible.
    translation: JPS 1917
    original: אַנְתְּה מַלְכָּא חָזֵה הֲוַיְתָ וַאֲלוּ צְלֵם חַד שַׂגִּיא צַלְמָא דִּכֵּן רַב וְזִיוֵהּ יַתִּיר קָאֵם לְקָבְלָךְ וְרֵוֵהּ דְּחִיל׃
    hebrewPlain: אנתה מלכא חזה הוית ואלו צלם חד שגיא צלמא דכן רב וזיוה יתיר קאם לקבלך ורוה דחיל
    kjvRefs:
    - Daniel 2:31
    kjvOsis:
    - Dan.2.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.32
    scripture: tanakh
    name: Tanakh Daniel 2:32
    ref: Daniel 2:32
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 32
    ordinal: 20452
    text: As for that image, its head was of fine gold, its breast and its arms of silver, its belly and its thighs of brass,
    translation: JPS 1917
    original: הוּא צַלְמָא רֵאשֵׁהּ דִּי־דְהַב טָב חֲדוֹהִי וּדְרָעוֹהִי דִּי כְסַף מְעוֹהִי וְיַרְכָתֵהּ דִּי נְחָשׁ׃
    hebrewPlain: הוא צלמא ראשה די דהב טב חדוהי ודרעוהי די כסף מעוהי וירכתה די נחש
    kjvRefs:
    - Daniel 2:32
    kjvOsis:
    - Dan.2.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.33
    scripture: tanakh
    name: Tanakh Daniel 2:33
    ref: Daniel 2:33
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 33
    ordinal: 20453
    text: its legs of iron, its feet part of iron and part of clay.
    translation: JPS 1917
    original: שָׁקוֹהִי דִּי פַרְזֶל רַגְלוֹהִי מנהון [מִנְּהֵין] דִּי פַרְזֶל ומנהון [וּמִנְּהֵין] דִּי חֲסַף׃
    hebrewPlain: שקוהי די פרזל רגלוהי מנהון [מנהין] די פרזל ומנהון [ומנהין] די חסף
    kjvRefs:
    - Daniel 2:33
    kjvOsis:
    - Dan.2.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.34
    scripture: tanakh
    name: Tanakh Daniel 2:34
    ref: Daniel 2:34
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 34
    ordinal: 20454
    text: Thou sawest till that a stone was cut out without hands, which smote the image upon its feet that were of iron and clay, and broke them to pieces.
    translation: JPS 1917
    original: חָזֵה הֲוַיְתָ עַד דִּי הִתְגְּזֶרֶת אֶבֶן דִּי־לָא בִידַיִן וּמְחָת לְצַלְמָא עַל־רַגְלוֹהִי דִּי פַרְזְלָא וְחַסְפָּא וְהַדֵּקֶת הִמּוֹן׃
    hebrewPlain: חזה הוית עד די התגזרת אבן די לא בידין ומחת לצלמא על רגלוהי די פרזלא וחספא והדקת המון
    kjvRefs:
    - Daniel 2:34
    kjvOsis:
    - Dan.2.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.35
    scripture: tanakh
    name: Tanakh Daniel 2:35
    ref: Daniel 2:35
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 35
    ordinal: 20455
    text: Then was the iron, the clay, the brass, the silver, and the gold, broken in pieces together, and became like the chaff of the summer threshing-floors; and the wind carried them away, so that no place was found for them; and the stone that smote the image became a great mountain, and filled the whole earth.
    translation: JPS 1917
    original: בֵּאדַיִן דָּקוּ כַחֲדָה פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא וַהֲווֹ כְּעוּר מִן־אִדְּרֵי־קַיִט וּנְשָׂא הִמּוֹן רוּחָא וְכָל־אֲתַר לָא־הִשְׁתֲּכַח לְהוֹן וְאַבְנָא דִּי־מְחָת לְצַלְמָא הֲוָת לְטוּר רַב וּמְלָת כָּל־אַרְעָא׃
    hebrewPlain: באדין דקו כחדה פרזלא חספא נחשא כספא ודהבא והוו כעור מן אדרי קיט ונשא המון רוחא וכל אתר לא השתכח להון ואבנא די מחת לצלמא הות לטור רב ומלת כל ארעא
    kjvRefs:
    - Daniel 2:35
    kjvOsis:
    - Dan.2.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.36
    scripture: tanakh
    name: Tanakh Daniel 2:36
    ref: Daniel 2:36
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 36
    ordinal: 20456
    text: This is the dream; and we will tell the interpretation thereof before the king.
    translation: JPS 1917
    original: דְּנָה חֶלְמָא וּפִשְׁרֵהּ נֵאמַר קֳדָם־מַלְכָּא׃
    hebrewPlain: דנה חלמא ופשרה נאמר קדם מלכא
    kjvRefs:
    - Daniel 2:36
    kjvOsis:
    - Dan.2.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.37
    scripture: tanakh
    name: Tanakh Daniel 2:37
    ref: Daniel 2:37
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 37
    ordinal: 20457
    text: Thou, O king, king of kings, unto whom the God of heaven hath given the kingdom, the power, and the strength, and the glory;
    translation: JPS 1917
    original: אַנְתְּה מַלְכָּא מֶלֶךְ מַלְכַיָּא דִּי אֱלָהּ שְׁמַיָּא מַלְכוּתָא חִסְנָא וְתָקְפָּא וִיקָרָא יְהַב־לָךְ׃
    hebrewPlain: אנתה מלכא מלך מלכיא די אלה שמיא מלכותא חסנא ותקפא ויקרא יהב לך
    kjvRefs:
    - Daniel 2:37
    kjvOsis:
    - Dan.2.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.38
    scripture: tanakh
    name: Tanakh Daniel 2:38
    ref: Daniel 2:38
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 38
    ordinal: 20458
    text: and wheresoever the children of men, the beasts of the field, and the fowls of the heaven dwell, hath He given them into thy hand, and hath made thee to rule over them all; thou art the head of gold.
    translation: JPS 1917
    original: וּבְכָל־דִּי דארין [דָיְרִין] בְּנֵי־אֲנָשָׁא חֵיוַת בָּרָא וְעוֹף־שְׁמַיָּא יְהַב בִּידָךְ וְהַשְׁלְטָךְ בְּכָלְּהוֹן אַנְתְּה־הוּא רֵאשָׁה דִּי דַהֲבָא׃
    hebrewPlain: ובכל די דארין [דירין] בני אנשא חיות ברא ועוף שמיא יהב בידך והשלטך בכלהון אנתה הוא ראשה די דהבא
    kjvRefs:
    - Daniel 2:38
    kjvOsis:
    - Dan.2.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.39
    scripture: tanakh
    name: Tanakh Daniel 2:39
    ref: Daniel 2:39
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 39
    ordinal: 20459
    text: And after thee shall arise another kingdom inferior to thee; and another third kingdom of brass, which shall bear rule over all the earth.
    translation: JPS 1917
    original: וּבָתְרָךְ תְּקוּם מַלְכוּ אָחֳרִי אֲרַעא מִנָּךְ וּמַלְכוּ תליתיא [תְלִיתָאָה] אָחֳרִי דִּי נְחָשָׁא דִּי תִשְׁלַט בְּכָל־אַרְעָא׃
    hebrewPlain: ובתרך תקום מלכו אחרי ארעא מנך ומלכו תליתיא [תליתאה] אחרי די נחשא די תשלט בכל ארעא
    kjvRefs:
    - Daniel 2:39
    kjvOsis:
    - Dan.2.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.40
    scripture: tanakh
    name: Tanakh Daniel 2:40
    ref: Daniel 2:40
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 40
    ordinal: 20460
    text: And the fourth kingdom shall be strong as iron; forasmuch as iron breaketh in pieces and beateth down all things; and as iron that crusheth all these, shall it break in pieces and crush.
    translation: JPS 1917
    original: וּמַלְכוּ רביעיה [רְבִיעָאָה] תֶּהֱוֵא תַקִּיפָה כְּפַרְזְלָא כָּל־קֳבֵל דִּי פַרְזְלָא מְהַדֵּק וְחָשֵׁל כֹּלָּא וּכְפַרְזְלָא דִּי־מְרָעַע כָּל־אִלֵּין תַּדִּק וְתֵרֹעַ׃
    hebrewPlain: ומלכו רביעיה [רביעאה] תהוא תקיפה כפרזלא כל קבל די פרזלא מהדק וחשל כלא וכפרזלא די מרעע כל אלין תדק ותרע
    kjvRefs:
    - Daniel 2:40
    kjvOsis:
    - Dan.2.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.41
    scripture: tanakh
    name: Tanakh Daniel 2:41
    ref: Daniel 2:41
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 41
    ordinal: 20461
    text: And whereas thou sawest the feet and toes, part of potters’ clay, and part of iron, it shall be a divided kingdom; but there shall be in it of the firmness of the iron, forasmuch as thou sawest the iron mixed with miry clay.
    translation: JPS 1917
    original: וְדִי־חֲזַיְתָה רַגְלַיָּא וְאֶצְבְּעָתָא מנהון [מִנְּהֵן] חֲסַף דִּי־פֶחָר ומנהון [וּמִנְּהֵין] פַּרְזֶל מַלְכוּ פְלִיגָה תֶּהֱוֵה וּמִן־נִצְבְּתָא דִי פַרְזְלָא לֶהֱוֵא־בַהּ כָּל־קֳבֵל דִּי חֲזַיְתָה פַּרְזְלָא מְעָרַב בַּחֲסַף טִינָא׃
    hebrewPlain: ודי חזיתה רגליא ואצבעתא מנהון [מנהן] חסף די פחר ומנהון [ומנהין] פרזל מלכו פליגה תהוה ומן נצבתא די פרזלא להוא בה כל קבל די חזיתה פרזלא מערב בחסף טינא
    kjvRefs:
    - Daniel 2:41
    kjvOsis:
    - Dan.2.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.42
    scripture: tanakh
    name: Tanakh Daniel 2:42
    ref: Daniel 2:42
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 42
    ordinal: 20462
    text: And as the toes of the feet were part of iron, and part of clay, so part of the kingdom shall be strong, and part thereof broken.
    translation: JPS 1917
    original: וְאֶצְבְּעָת רַגְלַיָּא מנהון [מִנְּהֵין] פַּרְזֶל ומנהון [וּמִנְּהֵין] חֲסַף מִן־קְצָת מַלְכוּתָא תֶּהֱוֵה תַקִּיפָה וּמִנַּהּ תֶּהֱוֵה תְבִירָה׃
    hebrewPlain: ואצבעת רגליא מנהון [מנהין] פרזל ומנהון [ומנהין] חסף מן קצת מלכותא תהוה תקיפה ומנה תהוה תבירה
    kjvRefs:
    - Daniel 2:42
    kjvOsis:
    - Dan.2.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.43
    scripture: tanakh
    name: Tanakh Daniel 2:43
    ref: Daniel 2:43
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 43
    ordinal: 20463
    text: And whereas thou sawest the iron mixed with miry clay, they shall mingle themselves by the seed of men; but they shall not cleave one to another, even as iron doth not mingle with clay.
    translation: JPS 1917
    original: די [וְדִי] חֲזַיְתָ פַּרְזְלָא מְעָרַב בַּחֲסַף טִינָא מִתְעָרְבִין לֶהֱוֺן בִּזְרַע אֲנָשָׁא וְלָא־לֶהֱוֺן דָּבְקִין דְּנָה עִם־דְּנָה הֵא־כְדִי פַרְזְלָא לָא מִתְעָרַב עִם־חַסְפָּא׃
    hebrewPlain: די [ודי] חזית פרזלא מערב בחסף טינא מתערבין להון בזרע אנשא ולא להון דבקין דנה עם דנה הא כדי פרזלא לא מתערב עם חספא
    kjvRefs:
    - Daniel 2:43
    kjvOsis:
    - Dan.2.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.44
    scripture: tanakh
    name: Tanakh Daniel 2:44
    ref: Daniel 2:44
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 44
    ordinal: 20464
    text: And in the days of those kings shall the God of heaven set up a kingdom, which shall never be destroyed; nor shall the kingdom be left to another people; it shall break in pieces and consume all these kingdoms, but it shall stand for ever.
    translation: JPS 1917
    original: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן יְקִים אֱלָהּ שְׁמַיָּא מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל וּמַלְכוּתָה לְעַם אָחֳרָן לָא תִשְׁתְּבִק תַּדִּק וְתָסֵיף כָּל־אִלֵּין מַלְכְוָתָא וְהִיא תְּקוּם לְעָלְמַיָּא׃
    hebrewPlain: וביומיהון די מלכיא אנון יקים אלה שמיא מלכו די לעלמין לא תתחבל ומלכותה לעם אחרן לא תשתבק תדק ותסיף כל אלין מלכותא והיא תקום לעלמיא
    kjvRefs:
    - Daniel 2:44
    kjvOsis:
    - Dan.2.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.45
    scripture: tanakh
    name: Tanakh Daniel 2:45
    ref: Daniel 2:45
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 45
    ordinal: 20465
    text: Forasmuch as thou sawest that a stone was cut out of the mountain without hands, and that it broke in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter; and the dream is certain, and the interpretation thereof sure.’
    translation: JPS 1917
    original: כָּל־קֳבֵל דִּי־חֲזַיְתָ דִּי מִטּוּרָא אִתְגְּזֶרֶת אֶבֶן דִּי־לָא בִידַיִן וְהַדֶּקֶת פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא אֱלָהּ רַב הוֹדַע לְמַלְכָּא מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה וְיַצִּיב חֶלְמָא וּמְהֵימַן פִּשְׁרֵהּ׃
    hebrewPlain: כל קבל די חזית די מטורא אתגזרת אבן די לא בידין והדקת פרזלא נחשא חספא כספא ודהבא אלה רב הודע למלכא מה די להוא אחרי דנה ויציב חלמא ומהימן פשרה
    kjvRefs:
    - Daniel 2:45
    kjvOsis:
    - Dan.2.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.46
    scripture: tanakh
    name: Tanakh Daniel 2:46
    ref: Daniel 2:46
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 46
    ordinal: 20466
    text: Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an offering and sweet odours unto him.
    translation: JPS 1917
    original: בֵּאדַיִן מַלְכָּא נְבוּכַדְנֶצַּר נְפַל עַל־אַנְפּוֹהִי וּלְדָנִיֵּאל סְגִד וּמִנְחָה וְנִיחֹחִין אֲמַר לְנַסָּכָה לֵהּ׃
    hebrewPlain: באדין מלכא נבוכדנצר נפל על אנפוהי ולדניאל סגד ומנחה וניחחין אמר לנסכה לה
    kjvRefs:
    - Daniel 2:46
    kjvOsis:
    - Dan.2.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.47
    scripture: tanakh
    name: Tanakh Daniel 2:47
    ref: Daniel 2:47
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 47
    ordinal: 20467
    text: 'The king spoke unto Daniel, and said: ‘Of a truth it is, that your God is the God of gods, and the Lord of kings, and a revealer of secrets, seeing thou hast been able to reveal this secret.’'
    translation: JPS 1917
    original: עָנֵה מַלְכָּא לְדָנִיֵּאל וְאָמַר מִן־קְשֹׁט דִּי אֱלָהֲכוֹן הוּא אֱלָהּ אֱלָהִין וּמָרֵא מַלְכִין וְגָלֵה רָזִין דִּי יְכֵלְתָּ לְמִגְלֵא רָזָה דְנָה׃
    hebrewPlain: ענה מלכא לדניאל ואמר מן קשט די אלהכון הוא אלה אלהין ומרא מלכין וגלה רזין די יכלת למגלא רזה דנה
    kjvRefs:
    - Daniel 2:47
    kjvOsis:
    - Dan.2.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.48
    scripture: tanakh
    name: Tanakh Daniel 2:48
    ref: Daniel 2:48
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 48
    ordinal: 20468
    text: Then the king made Daniel great, and gave him many great gifts, and made him to rule over the whole province of Babylon, and to be chief prefect over all the wise men of Babylon.
    translation: JPS 1917
    original: אֱדַיִן מַלְכָּא לְדָנִיֵּאל רַבִּי וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן יְהַב־לֵהּ וְהַשְׁלְטֵהּ עַל כָּל־מְדִינַת בָּבֶל וְרַב־סִגְנִין עַל כָּל־חַכִּימֵי בָבֶל׃
    hebrewPlain: אדין מלכא לדניאל רבי ומתנן רברבן שגיאן יהב לה והשלטה על כל מדינת בבל ורב סגנין על כל חכימי בבל
    kjvRefs:
    - Daniel 2:48
    kjvOsis:
    - Dan.2.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
- type: TanakhVerse
  data:
    osis: Dan.2.49
    scripture: tanakh
    name: Tanakh Daniel 2:49
    ref: Daniel 2:49
    book: Dan
    section: ketuvim
    chapter: 2
    verse: 49
    ordinal: 20469
    text: And Daniel requested of the king, and he appointed Shadrach, Meshach, and Abed-nego, over the affairs of the province of Babylon; but Daniel was in the gate of the king.
    translation: JPS 1917
    original: וְדָנִיֵּאל בְּעָא מִן־מַלְכָּא וּמַנִּי עַל עֲבִידְתָּא דִּי מְדִינַת בָּבֶל לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ וְדָנִיֵּאל בִּתְרַע מַלְכָּא׃
    hebrewPlain: ודניאל בעא מן מלכא ומני על עבידתא די מדינת בבל לשדרך מישך ועבד נגו ודניאל בתרע מלכא
    kjvRefs:
    - Daniel 2:49
    kjvOsis:
    - Dan.2.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.2
