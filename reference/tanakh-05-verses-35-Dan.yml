    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 20514
    text: Nevertheless leave the stump of its roots in the earth, Even in a band of iron and brass, in the tender grass of the field; And let it be wet with the dew of heaven, And let his portion be with the beasts in the grass of the earth;
    translation: JPS 1917
    original: בְּרַם עִקַּר שָׁרְשׁוֹהִי בְּאַרְעָא שְׁבֻקוּ וּבֶאֱסוּר דִּי־פַרְזֶל וּנְחָשׁ בְּדִתְאָא דִּי בָרָא וּבְטַל שְׁמַיָּא יִצְטַבַּע וְעִם־חֵיוְתָא חֲלָקֵהּ בַּעֲשַׂב אַרְעָא׃
    hebrewPlain: ברם עקר שרשוהי בארעא שבקו ובאסור די פרזל ונחש בדתאא די ברא ובטל שמיא יצטבע ועם חיותא חלקה בעשב ארעא
    kjvRefs:
