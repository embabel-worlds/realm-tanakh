    text: IN THE third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged it.
    translation: JPS 1917
    original: בִּשְׁנַת שָׁלוֹשׁ לְמַלְכוּת יְהוֹיָקִים מֶלֶךְ־יְהוּדָה בָּא נְבוּכַדְנֶאצַּר מֶלֶךְ־בָּבֶל יְרוּשָׁלִַם וַיָּצַר עָלֶיהָ׃
    hebrewPlain: בשנת שלוש למלכות יהויקים מלך יהודה בא נבוכדנאצר מלך בבל ירושלם ויצר עליה
