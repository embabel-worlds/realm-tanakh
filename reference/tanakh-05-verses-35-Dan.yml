    scripture: tanakh
    name: Tanakh Daniel 1:3
    ref: Daniel 1:3
    book: Dan
    section: ketuvim
    chapter: 1
    verse: 3
    ordinal: 20402
    text: And the king spoke unto Ashpenaz his chief officer, that he should bring in certain of the children of Israel, and of the seed royal, and of the nobles,
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְאַשְׁפְּנַז רַב סָרִיסָיו לְהָבִיא מִבְּנֵי יִשְׂרָאֵל וּמִזֶּרַע הַמְּלוּכָה וּמִן־הַפַּרְתְּמִים׃
    hebrewPlain: ויאמר המלך לאשפנז רב סריסיו להביא מבני ישראל ומזרע המלוכה ומן הפרתמים
    kjvRefs:
    - Daniel 1:3
    kjvOsis:
