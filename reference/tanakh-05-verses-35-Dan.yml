    text: At the end of twelve months he was walking upon the royal palace of Babylon.
    translation: JPS 1917
    original: לִקְצָת יַרְחִין תְּרֵי־עֲשַׂר עַל־הֵיכַל מַלְכוּתָא דִּי בָבֶל מְהַלֵּךְ הֲוָה׃
    hebrewPlain: לקצת ירחין תרי עשר על היכל מלכותא די בבל מהלך הוה
