  data:
    osis: Dan.3.1
    scripture: tanakh
    name: Tanakh Daniel 3:1
    ref: Daniel 3:1
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 20470
    text: Nebuchadnezzar the king made an image of gold, whose height was threescore cubits, and the breadth thereof six cubits; he set it up in the plain of Dura, in the province of Babylon.
    translation: JPS 1917
    original: נְבוּכַדְנֶצַּר מַלְכָּא עֲבַד צְלֵם דִּי־דְהַב רוּמֵהּ אַמִּין שִׁתִּין פְּתָיֵהּ אַמִּין שִׁת אֲקִימֵהּ בְּבִקְעַת דּוּרָא בִּמְדִינַת בָּבֶל׃
    hebrewPlain: נבוכדנצר מלכא עבד צלם די דהב רומה אמין שתין פתיה אמין שת אקימה בבקעת דורא במדינת בבל
    kjvRefs:
    - Daniel 3:1
    kjvOsis:
    - Dan.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.2
    scripture: tanakh
    name: Tanakh Daniel 3:2
    ref: Daniel 3:2
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 20471
    text: Then Nebuchadnezzar the king sent to gather together the satraps, the prefects, and the governors, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up.
    translation: JPS 1917
    original: וּנְבוּכַדְנֶצַּר מַלְכָּא שְׁלַח לְמִכְנַשׁ לַאֲחַשְׁדַּרְפְּנַיָּא סִגְנַיָּא וּפַחֲוָתָא אֲדַרְגָּזְרַיָּא גְדָבְרַיָּא דְּתָבְרַיָּא תִּפְתָּיֵא וְכֹל שִׁלְטֹנֵי מְדִינָתָא לְמֵתֵא לַחֲנֻכַּת צַלְמָא דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא׃
    hebrewPlain: ונבוכדנצר מלכא שלח למכנש לאחשדרפניא סגניא ופחותא אדרגזריא גדבריא דתבריא תפתיא וכל שלטני מדינתא למתא לחנכת צלמא די הקים נבוכדנצר מלכא
    kjvRefs:
    - Daniel 3:2
    kjvOsis:
    - Dan.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.3
    scripture: tanakh
    name: Tanakh Daniel 3:3
    ref: Daniel 3:3
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 20472
    text: Then the satraps, the prefects, and the governors, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up.
    translation: JPS 1917
    original: בֵּאדַיִן מִתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּא סִגְנַיָּא וּפַחֲוָתָא אֲדַרְגָּזְרַיָּא גְדָבְרַיָּא דְּתָבְרַיָּא תִּפְתָּיֵא וְכֹל שִׁלְטֹנֵי מְדִינָתָא לַחֲנֻכַּת צַלְמָא דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא וקאמין [וְקָיְמִין] לָקֳבֵל צַלְמָא דִּי הֲקֵים נְבוּכַדְנֶצַּר׃
    hebrewPlain: באדין מתכנשין אחשדרפניא סגניא ופחותא אדרגזריא גדבריא דתבריא תפתיא וכל שלטני מדינתא לחנכת צלמא די הקים נבוכדנצר מלכא וקאמין [וקימין] לקבל צלמא די הקים נבוכדנצר
    kjvRefs:
    - Daniel 3:3
    kjvOsis:
    - Dan.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.4
    scripture: tanakh
    name: Tanakh Daniel 3:4
    ref: Daniel 3:4
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 20473
    text: 'And the herald cried aloud: ‘To you it is commanded, O peoples, nations, and languages,'
    translation: JPS 1917
    original: וְכָרוֹזָא קָרֵא בְחָיִל לְכוֹן אָמְרִין עַמְמַיָּא אֻמַּיָּא וְלִשָּׁנַיָּא׃
    hebrewPlain: וכרוזא קרא בחיל לכון אמרין עממיא אמיא ולשניא
    kjvRefs:
    - Daniel 3:4
    kjvOsis:
    - Dan.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.5
    scripture: tanakh
    name: Tanakh Daniel 3:5
    ref: Daniel 3:5
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 20474
    text: that at what time ye hear the sound of the horn, pipe, harp, trigon, psaltery, bagpipe, and all kinds of music, ye fall down and worship the golden image that Nebuchadnezzar the king hath set up;
    translation: JPS 1917
    original: בְּעִדָּנָא דִּי־תִשְׁמְעוּן קָל קַרְנָא מַשְׁרוֹקִיתָא קיתרוס [קַתְרוֹס] סַבְּכָא פְּסַנְתֵּרִין סוּמְפֹּנְיָה וְכֹל זְנֵי זְמָרָא תִּפְּלוּן וְתִסְגְּדוּן לְצֶלֶם דַּהֲבָא דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא׃
    hebrewPlain: בעדנא די תשמעון קל קרנא משרוקיתא קיתרוס [קתרוס] סבכא פסנתרין סומפניה וכל זני זמרא תפלון ותסגדון לצלם דהבא די הקים נבוכדנצר מלכא
    kjvRefs:
    - Daniel 3:5
    kjvOsis:
    - Dan.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.6
    scripture: tanakh
    name: Tanakh Daniel 3:6
    ref: Daniel 3:6
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 20475
    text: and whoso falleth not down and worshippeth shall the same hour be cast into the midst of a burning fiery furnace.’
    translation: JPS 1917
    original: וּמַן־דִּי־לָא יִפֵּל וְיִסְגֻּד בַּהּ־שַׁעֲתָא יִתְרְמֵא לְגוֹא־אַתּוּן נוּרָא יָקִדְתָּא׃
    hebrewPlain: ומן די לא יפל ויסגד בה שעתא יתרמא לגוא אתון נורא יקדתא
    kjvRefs:
    - Daniel 3:6
    kjvOsis:
    - Dan.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.7
    scripture: tanakh
    name: Tanakh Daniel 3:7
    ref: Daniel 3:7
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 20476
    text: Therefore at that time, when all the peoples heard the sound of the horn, pipe, harp, trigon, psaltery, and all kinds of music, all the peoples, the nations, and the languages, fell down and worshipped the golden image that Nebuchadnezzar the king had set up.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה בֵּהּ־זִמְנָא כְּדִי שָׁמְעִין כָּל־עַמְמַיָּא קָל קַרְנָא מַשְׁרוֹקִיתָא קיתרס [קַתְרוֹס] שַׂבְּכָא פְּסַנְטֵרִין וְכֹל זְנֵי זְמָרָא נָפְלִין כָּל־עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא סָגְדִין לְצֶלֶם דַּהֲבָא דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא׃
    hebrewPlain: כל קבל דנה בה זמנא כדי שמעין כל עממיא קל קרנא משרוקיתא קיתרס [קתרוס] שבכא פסנטרין וכל זני זמרא נפלין כל עממיא אמיא ולשניא סגדין לצלם דהבא די הקים נבוכדנצר מלכא
    kjvRefs:
    - Daniel 3:7
    kjvOsis:
    - Dan.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.8
    scripture: tanakh
    name: Tanakh Daniel 3:8
    ref: Daniel 3:8
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 20477
    text: Wherefore at that time certain Chaldeans came near, and brought accusation against the Jews.
    translation: JPS 1917
    original: כָּל־קֳבֵל דְּנָה בֵּהּ־זִמְנָא קְרִבוּ גֻּבְרִין כַּשְׂדָּאִין וַאֲכַלוּ קַרְצֵיהוֹן דִּי יְהוּדָיֵא׃
    hebrewPlain: כל קבל דנה בה זמנא קרבו גברין כשדאין ואכלו קרציהון די יהודיא
    kjvRefs:
    - Daniel 3:8
    kjvOsis:
    - Dan.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.9
    scripture: tanakh
    name: Tanakh Daniel 3:9
    ref: Daniel 3:9
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 20478
    text: 'They spoke and said to Nebuchadnezzar the king: ‘O king, live for ever!'
    translation: JPS 1917
    original: עֲנוֹ וְאָמְרִין לִנְבוּכַדְנֶצַּר מַלְכָּא מַלְכָּא לְעָלְמִין חֱיִי׃
    hebrewPlain: ענו ואמרין לנבוכדנצר מלכא מלכא לעלמין חיי
    kjvRefs:
    - Daniel 3:9
    kjvOsis:
    - Dan.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.10
    scripture: tanakh
    name: Tanakh Daniel 3:10
    ref: Daniel 3:10
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 20479
    text: Thou, O king, hast made a decree, that every man that shall hear the sound of the horn, pipe, harp, trigon, psaltery, and bagpipe, and all kinds of music, shall fall down and worship the golden image;
    translation: JPS 1917
    original: אנתה [אַנְתְּ] מַלְכָּא שָׂמְתָּ טְּעֵם דִּי כָל־אֱנָשׁ דִּי־יִשְׁמַע קָל קַרְנָא מַשְׁרֹקִיתָא קיתרס [קַתְרוֹס] שַׂבְּכָא פְסַנְתֵּרִין וסיפניה [וְסוּפֹּנְיָה] וְכֹל זְנֵי זְמָרָא יִפֵּל וְיִסְגֻּד לְצֶלֶם דַּהֲבָא׃
    hebrewPlain: אנתה [אנת] מלכא שמת טעם די כל אנש די ישמע קל קרנא משרקיתא קיתרס [קתרוס] שבכא פסנתרין וסיפניה [וסופניה] וכל זני זמרא יפל ויסגד לצלם דהבא
    kjvRefs:
    - Daniel 3:10
    kjvOsis:
    - Dan.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Dan.3
- type: TanakhVerse
  data:
    osis: Dan.3.11
    scripture: tanakh
    name: Tanakh Daniel 3:11
    ref: Daniel 3:11
    book: Dan
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 20480
    text: and whoso falleth not down and worshippeth shall be cast into the midst of a burning fiery furnace.
    translation: JPS 1917
    original: וּמַן־דִּי־לָא יִפֵּל וְיִסְגֻּד יִתְרְמֵא לְגוֹא־אַתּוּן נוּרָא יָקִדְתָּא׃
    hebrewPlain: ומן די לא יפל ויסגד יתרמא לגוא אתון נורא יקדתא
    kjvRefs:
    - Daniel 3:11
    kjvOsis:
