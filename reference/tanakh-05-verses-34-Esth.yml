    scripture: tanakh
    name: Tanakh Esther 1:9
    ref: Esther 1:9
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 9
    ordinal: 20241
    text: Also Vashti the queen made a feast for the women in the royal house which belonged to king Ahasuerus.
    translation: JPS 1917
    original: גַּם וַשְׁתִּי הַמַּלְכָּה עָשְׂתָה מִשְׁתֵּה נָשִׁים בֵּית הַמַּלְכוּת אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ׃
    hebrewPlain: גם ושתי המלכה עשתה משתה נשים בית המלכות אשר למלך אחשורוש
    kjvRefs:
