  data:
    osis: Esth.1.13
    scripture: tanakh
    name: Tanakh Esther 1:13
    ref: Esther 1:13
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 13
    ordinal: 20245
    text: Then the king said to the wise men, who knew the times—for so was the king’s manner toward all that knew law and judgment;
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לַחֲכָמִים יֹדְעֵי הָעִתִּים כִּי־כֵן דְּבַר הַמֶּלֶךְ לִפְנֵי כָּל־יֹדְעֵי דָּת וָדִין׃
    hebrewPlain: ויאמר המלך לחכמים ידעי העתים כי כן דבר המלך לפני כל ידעי דת ודין
    kjvRefs:
    - Esther 1:13
    kjvOsis:
    - Esth.1.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.14
    scripture: tanakh
    name: Tanakh Esther 1:14
    ref: Esther 1:14
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 14
    ordinal: 20246
    text: 'and the next unto him was Carshena, Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan, the seven princes of Persia and Media, who saw the king’s face, and sat the first in the kingdom:'
    translation: JPS 1917
    original: וְהַקָּרֹב אֵלָיו כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן שִׁבְעַת שָׂרֵי פָּרַס וּמָדַי רֹאֵי פְּנֵי הַמֶּלֶךְ הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת׃
    hebrewPlain: והקרב אליו כרשנא שתר אדמתא תרשיש מרס מרסנא ממוכן שבעת שרי פרס ומדי ראי פני המלך הישבים ראשנה במלכות
    kjvRefs:
    - Esther 1:14
    kjvOsis:
    - Esth.1.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.15
    scripture: tanakh
    name: Tanakh Esther 1:15
    ref: Esther 1:15
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 15
    ordinal: 20247
    text: ’What shall we do unto the queen Vashti according to law, forasmuch as she hath not done the bidding of the king Ahasuerus by the chamberlains?’
    translation: JPS 1917
    original: כְּדָת מַה־לַּעֲשׂוֹת בַּמַּלְכָּה וַשְׁתִּי עַל אֲשֶׁר לֹא־עָשְׂתָה אֶת־מַאֲמַר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ בְּיַד הַסָּרִיסִים׃
    hebrewPlain: כדת מה לעשות במלכה ושתי על אשר לא עשתה את מאמר המלך אחשורוש ביד הסריסים
    kjvRefs:
    - Esther 1:15
    kjvOsis:
    - Esth.1.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.16
    scripture: tanakh
    name: Tanakh Esther 1:16
    ref: Esther 1:16
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 16
    ordinal: 20248
    text: 'And Memucan answered before the king and the princes: ‘Vashti the queen hath not done wrong to the king only, but also to all the princes, and to all the peoples, that are in all the provinces of the king Ahasuerus.'
    translation: JPS 1917
    original: וַיֹּאמֶר מומכן [מְמוּכָן] לִפְנֵי הַמֶּלֶךְ וְהַשָּׂרִים לֹא עַל־הַמֶּלֶךְ לְבַדּוֹ עָוְתָה וַשְׁתִּי הַמַּלְכָּה כִּי עַל־כָּל־הַשָּׂרִים וְעַל־כָּל־הָעַמִּים אֲשֶׁר בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ׃
    hebrewPlain: ויאמר מומכן [ממוכן] לפני המלך והשרים לא על המלך לבדו עותה ושתי המלכה כי על כל השרים ועל כל העמים אשר בכל מדינות המלך אחשורוש
    kjvRefs:
    - Esther 1:16
    kjvOsis:
    - Esth.1.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.17
    scripture: tanakh
    name: Tanakh Esther 1:17
    ref: Esther 1:17
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 17
    ordinal: 20249
    text: 'For this deed of the queen will come abroad unto all women, to make their husbands contemptible in their eyes, when it will be said: The king Ahasuerus commanded Vashti the queen to be brought in before him, but she came not.'
    translation: JPS 1917
    original: כִּי־יֵצֵא דְבַר־הַמַּלְכָּה עַל־כָּל־הַנָּשִׁים לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן בְּאָמְרָם הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ אָמַר לְהָבִיא אֶת־וַשְׁתִּי הַמַּלְכָּה לְפָנָיו וְלֹא־בָאָה׃
    hebrewPlain: כי יצא דבר המלכה על כל הנשים להבזות בעליהן בעיניהן באמרם המלך אחשורוש אמר להביא את ושתי המלכה לפניו ולא באה
    kjvRefs:
    - Esther 1:17
    kjvOsis:
    - Esth.1.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.18
    scripture: tanakh
    name: Tanakh Esther 1:18
    ref: Esther 1:18
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 18
    ordinal: 20250
    text: And this day will the princesses of Persia and Media who have heard of the deed of the queen say the like unto all the king’s princes. So will there arise enough contempt and wrath.
    translation: JPS 1917
    original: וְהַיּוֹם הַזֶּה תֹּאמַרְנָה שָׂרוֹת פָּרַס־וּמָדַי אֲשֶׁר שָׁמְעוּ אֶת־דְּבַר הַמַּלְכָּה לְכֹל שָׂרֵי הַמֶּלֶךְ וּכְדַי בִּזָּיוֹן וָקָצֶף׃
    hebrewPlain: והיום הזה תאמרנה שרות פרס ומדי אשר שמעו את דבר המלכה לכל שרי המלך וכדי בזיון וקצף
    kjvRefs:
    - Esther 1:18
    kjvOsis:
    - Esth.1.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.19
    scripture: tanakh
    name: Tanakh Esther 1:19
    ref: Esther 1:19
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 19
    ordinal: 20251
    text: If it please the king, let there go forth a royal commandment from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, that Vashti come no more before king Ahasuerus, and that the king give her royal estate unto another that is better than she.
    translation: JPS 1917
    original: אִם־עַל־הַמֶּלֶךְ טוֹב יֵצֵא דְבַר־מַלְכוּת מִלְּפָנָיו וְיִכָּתֵב בְּדָתֵי פָרַס־וּמָדַי וְלֹא יַעֲבוֹר אֲשֶׁר לֹא־תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ וּמַלְכוּתָהּ יִתֵּן הַמֶּלֶךְ לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה׃
    hebrewPlain: אם על המלך טוב יצא דבר מלכות מלפניו ויכתב בדתי פרס ומדי ולא יעבור אשר לא תבוא ושתי לפני המלך אחשורוש ומלכותה יתן המלך לרעותה הטובה ממנה
    kjvRefs:
    - Esther 1:19
    kjvOsis:
    - Esth.1.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.20
    scripture: tanakh
    name: Tanakh Esther 1:20
    ref: Esther 1:20
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 20
    ordinal: 20252
    text: And when the king’s decree which he shall make shall be published throughout all his kingdom, great though it be, all the wives will give to their husbands honour, both to great and small.’
    translation: JPS 1917
    original: וְנִשְׁמַע פִּתְגָם הַמֶּלֶךְ אֲשֶׁר־יַעֲשֶׂה בְּכָל־מַלְכוּתוֹ כִּי רַבָּה הִיא וְכָל־הַנָּשִׁים יִתְּנוּ יְקָר לְבַעְלֵיהֶן לְמִגָּדוֹל וְעַד־קָטָן׃
    hebrewPlain: ונשמע פתגם המלך אשר יעשה בכל מלכותו כי רבה היא וכל הנשים יתנו יקר לבעליהן למגדול ועד קטן
    kjvRefs:
    - Esther 1:20
    kjvOsis:
    - Esth.1.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.21
    scripture: tanakh
    name: Tanakh Esther 1:21
    ref: Esther 1:21
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 21
    ordinal: 20253
    text: And the word pleased the king and the princes; and the king did according to the word of Memucan;
    translation: JPS 1917
    original: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ וְהַשָּׂרִים וַיַּעַשׂ הַמֶּלֶךְ כִּדְבַר מְמוּכָן׃
    hebrewPlain: וייטב הדבר בעיני המלך והשרים ויעש המלך כדבר ממוכן
    kjvRefs:
    - Esther 1:21
    kjvOsis:
    - Esth.1.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.22
    scripture: tanakh
    name: Tanakh Esther 1:22
    ref: Esther 1:22
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 22
    ordinal: 20254
    text: for he sent letters into all the king’s provinces, into every province according to the writing thereof, and to every people after their language, that every man should bear rule in his own house, and speak according to the language of his people.
    translation: JPS 1917
    original: וַיִּשְׁלַח סְפָרִים אֶל־כָּל־מְדִינוֹת הַמֶּלֶךְ אֶל־מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְאֶל־עַם וָעָם כִּלְשׁוֹנוֹ לִהְיוֹת כָּל־אִישׁ שֹׂרֵר בְּבֵיתוֹ וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ׃
    hebrewPlain: וישלח ספרים אל כל מדינות המלך אל מדינה ומדינה ככתבה ואל עם ועם כלשונו להיות כל איש שרר בביתו ומדבר כלשון עמו
    kjvRefs:
    - Esther 1:22
    kjvOsis:
    - Esth.1.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.2.1
    scripture: tanakh
    name: Tanakh Esther 2:1
    ref: Esther 2:1
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 1
    ordinal: 20255
    text: After these things, when the wrath of king Ahasuerus was assuaged, he remembered Vashti, and what she had done, and what was decreed against her.
    translation: JPS 1917
    original: אַחַר הַדְּבָרִים הָאֵלֶּה כְּשֹׁךְ חֲמַת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ זָכַר אֶת־וַשְׁתִּי וְאֵת אֲשֶׁר־עָשָׂתָה וְאֵת אֲשֶׁר־נִגְזַר עָלֶיהָ׃
    hebrewPlain: אחר הדברים האלה כשך חמת המלך אחשורוש זכר את ושתי ואת אשר עשתה ואת אשר נגזר עליה
    kjvRefs:
    - Esther 2:1
    kjvOsis:
    - Esth.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.2
    scripture: tanakh
    name: Tanakh Esther 2:2
    ref: Esther 2:2
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 2
    ordinal: 20256
    text: 'Then said the king’s servants that ministered unto him: ‘Let there be sought for the king young virgins fair to look on;'
    translation: JPS 1917
    original: וַיֹּאמְרוּ נַעֲרֵי־הַמֶּלֶךְ מְשָׁרְתָיו יְבַקְשׁוּ לַמֶּלֶךְ נְעָרוֹת בְּתוּלוֹת טוֹבוֹת מַרְאֶה׃
    hebrewPlain: ויאמרו נערי המלך משרתיו יבקשו למלך נערות בתולות טובות מראה
    kjvRefs:
    - Esther 2:2
    kjvOsis:
    - Esth.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.3
    scripture: tanakh
    name: Tanakh Esther 2:3
    ref: Esther 2:3
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 3
    ordinal: 20257
    text: and let the king appoint officers in all the provinces of his kingdom, that they may gather together all the fair young virgins unto Shushan the castle, to the house of the women, unto the custody of Hegai the king’s chamberlain, keeper of the women; and let their ointments be given them;
    translation: JPS 1917
    original: וְיַפְקֵד הַמֶּלֶךְ פְּקִידִים בְּכָל־מְדִינוֹת מַלְכוּתוֹ וְיִקְבְּצוּ אֶת־כָּל־נַעֲרָה־בְתוּלָה טוֹבַת מַרְאֶה אֶל־שׁוּשַׁן הַבִּירָה אֶל־בֵּית הַנָּשִׁים אֶל־יַד הֵגֶא סְרִיס הַמֶּלֶךְ שֹׁמֵר הַנָּשִׁים וְנָתוֹן תַּמְרוּקֵיהֶן׃
    hebrewPlain: ויפקד המלך פקידים בכל מדינות מלכותו ויקבצו את כל נערה בתולה טובת מראה אל שושן הבירה אל בית הנשים אל יד הגא סריס המלך שמר הנשים ונתון תמרוקיהן
    kjvRefs:
    - Esther 2:3
    kjvOsis:
    - Esth.2.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.4
    scripture: tanakh
    name: Tanakh Esther 2:4
    ref: Esther 2:4
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 4
    ordinal: 20258
    text: and let the maiden that pleaseth the king be queen instead of Vashti.’ And the thing pleased the king; and he did so.
    translation: JPS 1917
    original: וְהַנַּעֲרָה אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ תִּמְלֹךְ תַּחַת וַשְׁתִּי וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ וַיַּעַשׂ כֵּן׃
    hebrewPlain: והנערה אשר תיטב בעיני המלך תמלך תחת ושתי וייטב הדבר בעיני המלך ויעש כן
    kjvRefs:
    - Esther 2:4
    kjvOsis:
    - Esth.2.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.5
    scripture: tanakh
    name: Tanakh Esther 2:5
    ref: Esther 2:5
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 5
    ordinal: 20259
    text: There was a certain Jew in Shushan the castle, whose name was Mordecai the son of Jair the son of Shimei the son of Kish, a Benjamite,
    translation: JPS 1917
    original: אִישׁ יְהוּדִי הָיָה בְּשׁוּשַׁן הַבִּירָה וּשְׁמוֹ מָרְדֳּכַי בֶּן יָאִיר בֶּן־שִׁמְעִי בֶּן־קִישׁ אִישׁ יְמִינִי׃
    hebrewPlain: איש יהודי היה בשושן הבירה ושמו מרדכי בן יאיר בן שמעי בן קיש איש ימיני
    kjvRefs:
    - Esther 2:5
    kjvOsis:
    - Esth.2.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.6
    scripture: tanakh
    name: Tanakh Esther 2:6
    ref: Esther 2:6
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 6
    ordinal: 20260
    text: who had been carried away from Jerusalem with the captives that had been carried away with Jeconiah king of Judah, whom Nebuchadnezzar the king of Babylon had carried away.
    translation: JPS 1917
    original: אֲשֶׁר הָגְלָה מִירוּשָׁלַיִם עִם־הַגֹּלָה אֲשֶׁר הָגְלְתָה עִם יְכָנְיָה מֶלֶךְ־יְהוּדָה אֲשֶׁר הֶגְלָה נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל׃
    hebrewPlain: אשר הגלה מירושלים עם הגלה אשר הגלתה עם יכניה מלך יהודה אשר הגלה נבוכדנאצר מלך בבל
    kjvRefs:
    - Esther 2:6
    kjvOsis:
    - Esth.2.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.7
    scripture: tanakh
    name: Tanakh Esther 2:7
    ref: Esther 2:7
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 7
    ordinal: 20261
    text: And he brought up Hadassah, that is, Esther, his uncle’s daughter; for she had neither father nor mother, and the maiden was of beautiful form and fair to look on; and when her father and mother were dead, Mordecai took her for his own daughter.
    translation: JPS 1917
    original: וַיְהִי אֹמֵן אֶת־הֲדַסָּה הִיא אֶסְתֵּר בַּת־דֹּדוֹ כִּי אֵין לָהּ אָב וָאֵם וְהַנַּעֲרָה יְפַת־תֹּאַר וְטוֹבַת מַרְאֶה וּבְמוֹת אָבִיהָ וְאִמָּהּ לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת׃
    hebrewPlain: ויהי אמן את הדסה היא אסתר בת דדו כי אין לה אב ואם והנערה יפת תאר וטובת מראה ובמות אביה ואמה לקחה מרדכי לו לבת
    kjvRefs:
    - Esther 2:7
    kjvOsis:
    - Esth.2.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.8
    scripture: tanakh
    name: Tanakh Esther 2:8
    ref: Esther 2:8
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 8
    ordinal: 20262
    text: So it came to pass, when the king’s commandment and his decree was published, and when many maidens were gathered together unto Shushan the castle, to the custody of Hegai, that Esther was taken into the king’s house, to the custody of Hegai, keeper of the women.
    translation: JPS 1917
    original: וַיְהִי בְּהִשָּׁמַע דְּבַר־הַמֶּלֶךְ וְדָתוֹ וּבְהִקָּבֵץ נְעָרוֹת רַבּוֹת אֶל־שׁוּשַׁן הַבִּירָה אֶל־יַד הֵגָי וַתִּלָּקַח אֶסְתֵּר אֶל־בֵּית הַמֶּלֶךְ אֶל־יַד הֵגַי שֹׁמֵר הַנָּשִׁים׃
    hebrewPlain: ויהי בהשמע דבר המלך ודתו ובהקבץ נערות רבות אל שושן הבירה אל יד הגי ותלקח אסתר אל בית המלך אל יד הגי שמר הנשים
    kjvRefs:
    - Esther 2:8
    kjvOsis:
    - Esth.2.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.9
    scripture: tanakh
    name: Tanakh Esther 2:9
    ref: Esther 2:9
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 9
    ordinal: 20263
    text: And the maiden pleased him, and she obtained kindness of him; and he speedily gave her her ointments, with her portions, and the seven maidens, who were meet to be given her out of the king’s house; and he advanced her and her maidens to the best place in the house of the women.
    translation: JPS 1917
    original: וַתִּיטַב הַנַּעֲרָה בְעֵינָיו וַתִּשָּׂא חֶסֶד לְפָנָיו וַיְבַהֵל אֶת־תַּמְרוּקֶיהָ וְאֶת־מָנוֹתֶהָ לָתֵת לָהּ וְאֵת שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת לָתֶת־לָהּ מִבֵּית הַמֶּלֶךְ וַיְשַׁנֶּהָ וְאֶת־נַעֲרוֹתֶיהָ לְטוֹב בֵּית הַנָּשִׁים׃
    hebrewPlain: ותיטב הנערה בעיניו ותשא חסד לפניו ויבהל את תמרוקיה ואת מנותה לתת לה ואת שבע הנערות הראיות לתת לה מבית המלך וישנה ואת נערותיה לטוב בית הנשים
    kjvRefs:
    - Esther 2:9
    kjvOsis:
    - Esth.2.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.10
    scripture: tanakh
    name: Tanakh Esther 2:10
    ref: Esther 2:10
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 10
    ordinal: 20264
    text: Esther had not made known her people nor her kindred; for Mordecai had charged her that she should not tell it.
    translation: JPS 1917
    original: לֹא־הִגִּידָה אֶסְתֵּר אֶת־עַמָּהּ וְאֶת־מוֹלַדְתָּהּ כִּי מָרְדֳּכַי צִוָּה עָלֶיהָ אֲשֶׁר לֹא־תַגִּיד׃
    hebrewPlain: לא הגידה אסתר את עמה ואת מולדתה כי מרדכי צוה עליה אשר לא תגיד
    kjvRefs:
    - Esther 2:10
    kjvOsis:
    - Esth.2.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.11
    scripture: tanakh
    name: Tanakh Esther 2:11
    ref: Esther 2:11
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 11
    ordinal: 20265
    text: And Mordecai walked every day before the court of the women’s house, to know how Esther did, and what would become of her.
    translation: JPS 1917
    original: וּבְכָל־יוֹם וָיוֹם מָרְדֳּכַי מִתְהַלֵּךְ לִפְנֵי חֲצַר בֵּית־הַנָּשִׁים לָדַעַת אֶת־שְׁלוֹם אֶסְתֵּר וּמַה־יֵּעָשֶׂה בָּהּ׃
    hebrewPlain: ובכל יום ויום מרדכי מתהלך לפני חצר בית הנשים לדעת את שלום אסתר ומה יעשה בה
    kjvRefs:
    - Esther 2:11
    kjvOsis:
    - Esth.2.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.12
    scripture: tanakh
    name: Tanakh Esther 2:12
    ref: Esther 2:12
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 12
    ordinal: 20266
    text: Now when the turn of every maiden was come to go in to king Ahasuerus, after that it had been done to her according to the law for the women, twelve months—for so were the days of their anointing accomplished, to wit, six months with oil of myrrh, and six month with sweet odours, and with other ointments of the women —
    translation: JPS 1917
    original: וּבְהַגִּיעַ תֹּר נַעֲרָה וְנַעֲרָה לָבוֹא אֶל־הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ מִקֵּץ הֱיוֹת לָהּ כְּדָת הַנָּשִׁים שְׁנֵים עָשָׂר חֹדֶשׁ כִּי כֵּן יִמְלְאוּ יְמֵי מְרוּקֵיהֶן שִׁשָּׁה חֳדָשִׁים בְּשֶׁמֶן הַמֹּר וְשִׁשָּׁה חֳדָשִׁים בַּבְּשָׂמִים וּבְתַמְרוּקֵי הַנָּשִׁים׃
    hebrewPlain: ובהגיע תר נערה ונערה לבוא אל המלך אחשורוש מקץ היות לה כדת הנשים שנים עשר חדש כי כן ימלאו ימי מרוקיהן ששה חדשים בשמן המר וששה חדשים בבשמים ובתמרוקי הנשים
    kjvRefs:
    - Esther 2:12
    kjvOsis:
    - Esth.2.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.13
    scripture: tanakh
    name: Tanakh Esther 2:13
    ref: Esther 2:13
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 13
    ordinal: 20267
    text: when then the maiden came unto the king, whatsoever she desired was given her to go with her out of the house of the women unto the king’s house.
    translation: JPS 1917
    original: וּבָזֶה הַנַּעֲרָה בָּאָה אֶל־הַמֶּלֶךְ אֵת כָּל־אֲשֶׁר תֹּאמַר יִנָּתֵן לָהּ לָבוֹא עִמָּהּ מִבֵּית הַנָּשִׁים עַד־בֵּית הַמֶּלֶךְ׃
    hebrewPlain: ובזה הנערה באה אל המלך את כל אשר תאמר ינתן לה לבוא עמה מבית הנשים עד בית המלך
    kjvRefs:
    - Esther 2:13
    kjvOsis:
    - Esth.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.14
    scripture: tanakh
    name: Tanakh Esther 2:14
    ref: Esther 2:14
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 14
    ordinal: 20268
    text: In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king’s chamberlain, who kept the concubines; she came in unto the king no more, except the king delighted in her, and she were called by name.
    translation: JPS 1917
    original: בָּעֶרֶב הִיא בָאָה וּבַבֹּקֶר הִיא שָׁבָה אֶל־בֵּית הַנָּשִׁים שֵׁנִי אֶל־יַד שַׁעֲשְׁגַז סְרִיס הַמֶּלֶךְ שֹׁמֵר הַפִּילַגְשִׁים לֹא־תָבוֹא עוֹד אֶל־הַמֶּלֶךְ כִּי אִם־חָפֵץ בָּהּ הַמֶּלֶךְ וְנִקְרְאָה בְשֵׁם׃
    hebrewPlain: בערב היא באה ובבקר היא שבה אל בית הנשים שני אל יד שעשגז סריס המלך שמר הפילגשים לא תבוא עוד אל המלך כי אם חפץ בה המלך ונקראה בשם
    kjvRefs:
    - Esther 2:14
    kjvOsis:
    - Esth.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.15
    scripture: tanakh
    name: Tanakh Esther 2:15
    ref: Esther 2:15
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 15
    ordinal: 20269
    text: Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king’s chamberlain, the keeper of the women, appointed. And Esther obtained favour in the sight of all them that looked upon her.
    translation: JPS 1917
    original: וּבְהַגִּיעַ תֹּר־אֶסְתֵּר בַּת־אֲבִיחַיִל דֹּד מָרְדֳּכַי אֲשֶׁר לָקַח־לוֹ לְבַת לָבוֹא אֶל־הַמֶּלֶךְ לֹא בִקְשָׁה דָּבָר כִּי אִם אֶת־אֲשֶׁר יֹאמַר הֵגַי סְרִיס־הַמֶּלֶךְ שֹׁמֵר הַנָּשִׁים וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן בְּעֵינֵי כָּל־רֹאֶיהָ׃
    hebrewPlain: ובהגיע תר אסתר בת אביחיל דד מרדכי אשר לקח לו לבת לבוא אל המלך לא בקשה דבר כי אם את אשר יאמר הגי סריס המלך שמר הנשים ותהי אסתר נשאת חן בעיני כל ראיה
    kjvRefs:
    - Esther 2:15
    kjvOsis:
    - Esth.2.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.16
    scripture: tanakh
    name: Tanakh Esther 2:16
    ref: Esther 2:16
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 16
    ordinal: 20270
    text: So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which is the month Tebeth, in the seventh year of his reign.
    translation: JPS 1917
    original: וַתִּלָּקַח אֶסְתֵּר אֶל־הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ אֶל־בֵּית מַלְכוּתוֹ בַּחֹדֶשׁ הָעֲשִׂירִי הוּא־חֹדֶשׁ טֵבֵת בִּשְׁנַת־שֶׁבַע לְמַלְכוּתוֹ׃
    hebrewPlain: ותלקח אסתר אל המלך אחשורוש אל בית מלכותו בחדש העשירי הוא חדש טבת בשנת שבע למלכותו
    kjvRefs:
    - Esther 2:16
    kjvOsis:
    - Esth.2.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.17
    scripture: tanakh
    name: Tanakh Esther 2:17
    ref: Esther 2:17
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 17
    ordinal: 20271
    text: And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.
    translation: JPS 1917
    original: וַיֶּאֱהַב הַמֶּלֶךְ אֶת־אֶסְתֵּר מִכָּל־הַנָּשִׁים וַתִּשָּׂא־חֵן וָחֶסֶד לְפָנָיו מִכָּל־הַבְּתוּלֹת וַיָּשֶׂם כֶּתֶר־מַלְכוּת בְּרֹאשָׁהּ וַיַּמְלִיכֶהָ תַּחַת וַשְׁתִּי׃
    hebrewPlain: ויאהב המלך את אסתר מכל הנשים ותשא חן וחסד לפניו מכל הבתולת וישם כתר מלכות בראשה וימליכה תחת ושתי
    kjvRefs:
    - Esther 2:17
    kjvOsis:
    - Esth.2.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.18
    scripture: tanakh
    name: Tanakh Esther 2:18
    ref: Esther 2:18
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 18
    ordinal: 20272
    text: Then the king made a great feast unto all his princes and his servants, even Esther’s feast; and he made a release to the provinces, and gave gifts, according to the bounty of the king.
    translation: JPS 1917
    original: וַיַּעַשׂ הַמֶּלֶךְ מִשְׁתֶּה גָדוֹל לְכָל־שָׂרָיו וַעֲבָדָיו אֵת מִשְׁתֵּה אֶסְתֵּר וַהֲנָחָה לַמְּדִינוֹת עָשָׂה וַיִּתֵּן מַשְׂאֵת כְּיַד הַמֶּלֶךְ׃
    hebrewPlain: ויעש המלך משתה גדול לכל שריו ועבדיו את משתה אסתר והנחה למדינות עשה ויתן משאת כיד המלך
    kjvRefs:
    - Esther 2:18
    kjvOsis:
    - Esth.2.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.19
    scripture: tanakh
    name: Tanakh Esther 2:19
    ref: Esther 2:19
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 19
    ordinal: 20273
    text: And when the virgins were gathered together the second time, and Mordecai sat in the king’s gate—
    translation: JPS 1917
    original: וּבְהִקָּבֵץ בְּתוּלוֹת שֵׁנִית וּמָרְדֳּכַי יֹשֵׁב בְּשַׁעַר־הַמֶּלֶךְ׃
    hebrewPlain: ובהקבץ בתולות שנית ומרדכי ישב בשער המלך
    kjvRefs:
    - Esther 2:19
    kjvOsis:
    - Esth.2.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.20
    scripture: tanakh
    name: Tanakh Esther 2:20
    ref: Esther 2:20
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 20
    ordinal: 20274
    text: Esther had not yet made known her kindred nor her people; as Mordecai had charged her; for Esther did the commandment of Mordecai, like as when she was brought up with him—
    translation: JPS 1917
    original: אֵין אֶסְתֵּר מַגֶּדֶת מוֹלַדְתָּהּ וְאֶת־עַמָּהּ כַּאֲשֶׁר צִוָּה עָלֶיהָ מָרְדֳּכָי וְאֶת־מַאֲמַר מָרְדֳּכַי אֶסְתֵּר עֹשָׂה כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ׃
    hebrewPlain: אין אסתר מגדת מולדתה ואת עמה כאשר צוה עליה מרדכי ואת מאמר מרדכי אסתר עשה כאשר היתה באמנה אתו
    kjvRefs:
    - Esther 2:20
    kjvOsis:
    - Esth.2.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.21
    scripture: tanakh
    name: Tanakh Esther 2:21
    ref: Esther 2:21
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 21
    ordinal: 20275
    text: in those days, while Mordecai sat in the king’s gate, two of the king’s chamberlains, Bigthan and Teresh, of those that kept the door, were wroth, and sought to lay hands on the king Ahasuerus.
    translation: JPS 1917
    original: בַּיָּמִים הָהֵם וּמָרְדֳּכַי יֹשֵׁב בְּשַׁעַר־הַמֶּלֶךְ קָצַף בִּגְתָן וָתֶרֶשׁ שְׁנֵי־סָרִיסֵי הַמֶּלֶךְ מִשֹּׁמְרֵי הַסַּף וַיְבַקְשׁוּ לִשְׁלֹחַ יָד בַּמֶּלֶךְ אֲחַשְׁוֵרֹשׁ׃
    hebrewPlain: בימים ההם ומרדכי ישב בשער המלך קצף בגתן ותרש שני סריסי המלך משמרי הסף ויבקשו לשלח יד במלך אחשורש
    kjvRefs:
    - Esther 2:21
    kjvOsis:
    - Esth.2.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.22
    scripture: tanakh
    name: Tanakh Esther 2:22
    ref: Esther 2:22
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 22
    ordinal: 20276
    text: And the thing became known to Mordecai, who told it unto Esther the queen; and Esther told the king thereof in Mordecai’s name.
    translation: JPS 1917
    original: וַיִּוָּדַע הַדָּבָר לְמָרְדֳּכַי וַיַּגֵּד לְאֶסְתֵּר הַמַּלְכָּה וַתֹּאמֶר אֶסְתֵּר לַמֶּלֶךְ בְּשֵׁם מָרְדֳּכָי׃
    hebrewPlain: ויודע הדבר למרדכי ויגד לאסתר המלכה ותאמר אסתר למלך בשם מרדכי
    kjvRefs:
    - Esther 2:22
    kjvOsis:
    - Esth.2.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.2.23
    scripture: tanakh
    name: Tanakh Esther 2:23
    ref: Esther 2:23
    book: Esth
    section: ketuvim
    chapter: 2
    verse: 23
    ordinal: 20277
    text: And when inquisition was made of the matter, and it was found to be so, they were both hanged on a tree; and it was written in the book of the chronicles before the king.
    translation: JPS 1917
    original: וַיְבֻקַּשׁ הַדָּבָר וַיִּמָּצֵא וַיִּתָּלוּ שְׁנֵיהֶם עַל־עֵץ וַיִּכָּתֵב בְּסֵפֶר דִּבְרֵי הַיָּמִים לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויבקש הדבר וימצא ויתלו שניהם על עץ ויכתב בספר דברי הימים לפני המלך
    kjvRefs:
    - Esther 2:23
    kjvOsis:
    - Esth.2.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.2
- type: TanakhVerse
  data:
    osis: Esth.3.1
    scripture: tanakh
    name: Tanakh Esther 3:1
    ref: Esther 3:1
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 1
    ordinal: 20278
    text: After these things did king Ahasuerus promote Haman the son of Hammedatha the Agagite, and advanced him, and set his seat above all the princes that were with him.
    translation: JPS 1917
    original: אַחַר הַדְּבָרִים הָאֵלֶּה גִּדַּל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ אֶת־הָמָן בֶּן־הַמְּדָתָא הָאֲגָגִי וַיְנַשְּׂאֵהוּ וַיָּשֶׂם אֶת־כִּסְאוֹ מֵעַל כָּל־הַשָּׂרִים אֲשֶׁר אִתּוֹ׃
    hebrewPlain: אחר הדברים האלה גדל המלך אחשורוש את המן בן המדתא האגגי וינשאהו וישם את כסאו מעל כל השרים אשר אתו
    kjvRefs:
    - Esther 3:1
    kjvOsis:
    - Esth.3.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.2
    scripture: tanakh
    name: Tanakh Esther 3:2
    ref: Esther 3:2
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 2
    ordinal: 20279
    text: And all the king’s servants, that were in the king’s gate, bowed down, and prostrated themselves before Haman; for the king had so commanded concerning him. But Mordecai bowed not down, nor prostrated himself before him.
    translation: JPS 1917
    original: וְכָל־עַבְדֵי הַמֶּלֶךְ אֲשֶׁר־בְּשַׁעַר הַמֶּלֶךְ כֹּרְעִים וּמִשְׁתַּחֲוִים לְהָמָן כִּי־כֵן צִוָּה־לוֹ הַמֶּלֶךְ וּמָרְדֳּכַי לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה׃
    hebrewPlain: וכל עבדי המלך אשר בשער המלך כרעים ומשתחוים להמן כי כן צוה לו המלך ומרדכי לא יכרע ולא ישתחוה
    kjvRefs:
    - Esther 3:2
    kjvOsis:
    - Esth.3.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.3
    scripture: tanakh
    name: Tanakh Esther 3:3
    ref: Esther 3:3
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 3
    ordinal: 20280
    text: 'Then the king’s servants, that were in the king’s gate, said unto Mordecai: ‘Why transgressest thou the king’s commandment?’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ עַבְדֵי הַמֶּלֶךְ אֲשֶׁר־בְּשַׁעַר הַמֶּלֶךְ לְמָרְדֳּכָי מַדּוּעַ אַתָּה עוֹבֵר אֵת מִצְוַת הַמֶּלֶךְ׃
    hebrewPlain: ויאמרו עבדי המלך אשר בשער המלך למרדכי מדוע אתה עובר את מצות המלך
    kjvRefs:
    - Esther 3:3
    kjvOsis:
    - Esth.3.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.4
    scripture: tanakh
    name: Tanakh Esther 3:4
    ref: Esther 3:4
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 4
    ordinal: 20281
    text: Now it came to pass, when they spoke daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai’s words would stand; for he had told them that he was a Jew.
    translation: JPS 1917
    original: וַיְהִי באמרם [כְּאָמְרָם] אֵלָיו יוֹם וָיוֹם וְלֹא שָׁמַע אֲלֵיהֶם וַיַּגִּידוּ לְהָמָן לִרְאוֹת הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי כִּי־הִגִּיד לָהֶם אֲשֶׁר־הוּא יְהוּדִי׃
    hebrewPlain: ויהי באמרם [כאמרם] אליו יום ויום ולא שמע אליהם ויגידו להמן לראות היעמדו דברי מרדכי כי הגיד להם אשר הוא יהודי
    kjvRefs:
    - Esther 3:4
    kjvOsis:
    - Esth.3.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.5
    scripture: tanakh
    name: Tanakh Esther 3:5
    ref: Esther 3:5
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 5
    ordinal: 20282
    text: And when Haman saw that Mordecai bowed not down, nor prostrated himself before him, then was Haman full of wrath.
    translation: JPS 1917
    original: וַיַּרְא הָמָן כִּי־אֵין מָרְדֳּכַי כֹּרֵעַ וּמִשְׁתַּחֲוֶה לוֹ וַיִּמָּלֵא הָמָן חֵמָה׃
    hebrewPlain: וירא המן כי אין מרדכי כרע ומשתחוה לו וימלא המן חמה
    kjvRefs:
    - Esther 3:5
    kjvOsis:
    - Esth.3.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.6
    scripture: tanakh
    name: Tanakh Esther 3:6
    ref: Esther 3:6
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 6
    ordinal: 20283
    text: But it seemed contemptible in his eyes to lay hands on Mordecai alone; for they had made known to him the people of Mordecai; wherefore Haman sought to destroy all the Jews that were throughout the whole kingdom of Ahasuerus, even the people of Mordecai.
    translation: JPS 1917
    original: וַיִּבֶז בְּעֵינָיו לִשְׁלֹח יָד בְּמָרְדֳּכַי לְבַדּוֹ כִּי־הִגִּידוּ לוֹ אֶת־עַם מָרְדֳּכָי וַיְבַקֵּשׁ הָמָן לְהַשְׁמִיד אֶת־כָּל־הַיְּהוּדִים אֲשֶׁר בְּכָל־מַלְכוּת אֲחַשְׁוֵרוֹשׁ עַם מָרְדֳּכָי׃
    hebrewPlain: ויבז בעיניו לשלח יד במרדכי לבדו כי הגידו לו את עם מרדכי ויבקש המן להשמיד את כל היהודים אשר בכל מלכות אחשורוש עם מרדכי
    kjvRefs:
    - Esther 3:6
    kjvOsis:
    - Esth.3.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.7
    scripture: tanakh
    name: Tanakh Esther 3:7
    ref: Esther 3:7
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 7
    ordinal: 20284
    text: In the first month, which is the month Nisan, in the twelfth year of king Ahasuerus, they cast pur, that is, the lot, before Haman from day to day, and from month to month, to the twelfth month, which is the month Adar.
    translation: JPS 1917
    original: בַּחֹדֶשׁ הָרִאשׁוֹן הוּא־חֹדֶשׁ נִיסָן בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ הִפִּיל פּוּר הוּא הַגּוֹרָל לִפְנֵי הָמָן מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ שְׁנֵים־עָשָׂר הוּא־חֹדֶשׁ אֲדָר׃
    hebrewPlain: בחדש הראשון הוא חדש ניסן בשנת שתים עשרה למלך אחשורוש הפיל פור הוא הגורל לפני המן מיום ליום ומחדש לחדש שנים עשר הוא חדש אדר
    kjvRefs:
    - Esther 3:7
    kjvOsis:
    - Esth.3.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.8
    scripture: tanakh
    name: Tanakh Esther 3:8
    ref: Esther 3:8
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 8
    ordinal: 20285
    text: 'And Haman said unto king Ahasuerus: ‘There is a certain people scattered abroad and dispersed among the peoples in all the provinces of thy kingdom; and their laws are diverse from those of every people; neither keep they the king’s laws; therefore it profiteth not the king to suffer them.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָמָן לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ יֶשְׁנוֹ עַם־אֶחָד מְפֻזָּר וּמְפֹרָד בֵּין הָעַמִּים בְּכֹל מְדִינוֹת מַלְכוּתֶךָ וְדָתֵיהֶם שֹׁנוֹת מִכָּל־עָם וְאֶת־דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים וְלַמֶּלֶךְ אֵין־שֹׁוֶה לְהַנִּיחָם׃
    hebrewPlain: ויאמר המן למלך אחשורוש ישנו עם אחד מפזר ומפרד בין העמים בכל מדינות מלכותך ודתיהם שנות מכל עם ואת דתי המלך אינם עשים ולמלך אין שוה להניחם
    kjvRefs:
    - Esther 3:8
    kjvOsis:
    - Esth.3.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.9
    scripture: tanakh
    name: Tanakh Esther 3:9
    ref: Esther 3:9
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 9
    ordinal: 20286
    text: If it please the king, let it be written that they be destroyed; and I will pay ten thousand talents of silver into the hands of those that have the charge of the king’s business, to bring it into the king’s treasuries.’
    translation: JPS 1917
    original: אִם־עַל־הַמֶּלֶךְ טוֹב יִכָּתֵב לְאַבְּדָם וַעֲשֶׂרֶת אֲלָפִים כִּכַּר־כֶּסֶף אֶשְׁקוֹל עַל־יְדֵי עֹשֵׂי הַמְּלָאכָה לְהָבִיא אֶל־גִּנְזֵי הַמֶּלֶךְ׃
    hebrewPlain: אם על המלך טוב יכתב לאבדם ועשרת אלפים ככר כסף אשקול על ידי עשי המלאכה להביא אל גנזי המלך
    kjvRefs:
    - Esther 3:9
    kjvOsis:
    - Esth.3.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.10
    scripture: tanakh
    name: Tanakh Esther 3:10
    ref: Esther 3:10
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 10
    ordinal: 20287
    text: And the king took his ring from his hand, and gave it unto Haman the son of Hammedatha the Agagite, the Jews’ enemy.
    translation: JPS 1917
    original: וַיָּסַר הַמֶּלֶךְ אֶת־טַבַּעְתּוֹ מֵעַל יָדוֹ וַיִּתְּנָהּ לְהָמָן בֶּן־הַמְּדָתָא הָאֲגָגִי צֹרֵר הַיְּהוּדִים׃
    hebrewPlain: ויסר המלך את טבעתו מעל ידו ויתנה להמן בן המדתא האגגי צרר היהודים
    kjvRefs:
    - Esther 3:10
    kjvOsis:
    - Esth.3.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.11
    scripture: tanakh
    name: Tanakh Esther 3:11
    ref: Esther 3:11
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 11
    ordinal: 20288
    text: 'And the king said unto Haman: ‘The silver is given to thee, the people also, to do with them as it seemeth good to thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְהָמָן הַכֶּסֶף נָתוּן לָךְ וְהָעָם לַעֲשׂוֹת בּוֹ כַּטּוֹב בְּעֵינֶיךָ׃
    hebrewPlain: ויאמר המלך להמן הכסף נתון לך והעם לעשות בו כטוב בעיניך
    kjvRefs:
    - Esther 3:11
    kjvOsis:
    - Esth.3.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.12
    scripture: tanakh
    name: Tanakh Esther 3:12
    ref: Esther 3:12
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 12
    ordinal: 20289
    text: Then were the king’s scribes called in the first month, on the thirteenth day thereof, and there was written, according to all that Haman commanded, unto the king’s satraps, and to the governors that were over every province, and to the princes of every people; to every province according to the writing thereof, and to every people after their language; in the name of king Ahasuerus was it written, and it was sealed with the king’s ring.
    translation: JPS 1917
    original: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ וַיִּכָּתֵב כְּכָל־אֲשֶׁר־צִוָּה הָמָן אֶל אֲחַשְׁדַּרְפְּנֵי־הַמֶּלֶךְ וְאֶל־הַפַּחוֹת אֲשֶׁר עַל־מְדִינָה וּמְדִינָה וְאֶל־שָׂרֵי עַם וָעָם מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשׁוֹנוֹ בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ נִכְתָּב וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ׃
    hebrewPlain: ויקראו ספרי המלך בחדש הראשון בשלושה עשר יום בו ויכתב ככל אשר צוה המן אל אחשדרפני המלך ואל הפחות אשר על מדינה ומדינה ואל שרי עם ועם מדינה ומדינה ככתבה ועם ועם כלשונו בשם המלך אחשורש נכתב ונחתם בטבעת המלך
    kjvRefs:
    - Esther 3:12
    kjvOsis:
    - Esth.3.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.13
    scripture: tanakh
    name: Tanakh Esther 3:13
    ref: Esther 3:13
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 13
    ordinal: 20290
    text: And letters were sent by posts into all the king’s provinces, to destroy, to slay, and to cause to perish, all Jews, both young and old, little children and women, in one day, even upon the thirteenth day of the twelfth month, which is the month Adar, and to take the spoil of them for a prey.
    translation: JPS 1917
    original: וְנִשְׁלוֹחַ סְפָרִים בְּיַד הָרָצִים אֶל־כָּל־מְדִינוֹת הַמֶּלֶךְ לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד אֶת־כָּל־הַיְּהוּדִים מִנַּעַר וְעַד־זָקֵן טַף וְנָשִׁים בְּיוֹם אֶחָד בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים־עָשָׂר הוּא־חֹדֶשׁ אֲדָר וּשְׁלָלָם לָבוֹז׃
    hebrewPlain: ונשלוח ספרים ביד הרצים אל כל מדינות המלך להשמיד להרג ולאבד את כל היהודים מנער ועד זקן טף ונשים ביום אחד בשלושה עשר לחדש שנים עשר הוא חדש אדר ושללם לבוז
    kjvRefs:
    - Esther 3:13
    kjvOsis:
    - Esth.3.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.14
    scripture: tanakh
    name: Tanakh Esther 3:14
    ref: Esther 3:14
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 14
    ordinal: 20291
    text: The copy of the writing, to be given out for a decree in every province, was to be published unto all peoples, that they should be ready against that day.
    translation: JPS 1917
    original: פַּתְשֶׁגֶן הַכְּתָב לְהִנָּתֵן דָּת בְּכָל־מְדִינָה וּמְדִינָה גָּלוּי לְכָל־הָעַמִּים לִהְיוֹת עֲתִדִים לַיּוֹם הַזֶּה׃
    hebrewPlain: פתשגן הכתב להנתן דת בכל מדינה ומדינה גלוי לכל העמים להיות עתדים ליום הזה
    kjvRefs:
    - Esther 3:14
    kjvOsis:
    - Esth.3.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.3.15
    scripture: tanakh
    name: Tanakh Esther 3:15
    ref: Esther 3:15
    book: Esth
    section: ketuvim
    chapter: 3
    verse: 15
    ordinal: 20292
    text: The posts went forth in haste by the king’s commandment, and the decree was given out in Shushan the castle; and the king and Haman sat down to drink; but the city of Shushan was perplexed.
    translation: JPS 1917
    original: הָרָצִים יָצְאוּ דְחוּפִים בִּדְבַר הַמֶּלֶךְ וְהַדָּת נִתְּנָה בְּשׁוּשַׁן הַבִּירָה וְהַמֶּלֶךְ וְהָמָן יָשְׁבוּ לִשְׁתּוֹת וְהָעִיר שׁוּשָׁן נָבוֹכָה׃
    hebrewPlain: הרצים יצאו דחופים בדבר המלך והדת נתנה בשושן הבירה והמלך והמן ישבו לשתות והעיר שושן נבוכה
    kjvRefs:
    - Esther 3:15
    kjvOsis:
    - Esth.3.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.3
- type: TanakhVerse
  data:
    osis: Esth.4.1
    scripture: tanakh
    name: Tanakh Esther 4:1
    ref: Esther 4:1
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 1
    ordinal: 20293
    text: Now when Mordecai knew all that was done, Mordecai rent his clothes, and put on sackcloth with ashes, and went out into the midst of the city, and cried with a loud and a bitter cry;
    translation: JPS 1917
    original: וּמָרְדֳּכַי יָדַע אֶת־כָּל־אֲשֶׁר נַעֲשָׂה וַיִּקְרַע מָרְדֳּכַי אֶת־בְּגָדָיו וַיִּלְבַּשׁ שַׂק וָאֵפֶר וַיֵּצֵא בְּתוֹךְ הָעִיר וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה׃
    hebrewPlain: ומרדכי ידע את כל אשר נעשה ויקרע מרדכי את בגדיו וילבש שק ואפר ויצא בתוך העיר ויזעק זעקה גדלה ומרה
    kjvRefs:
    - Esther 4:1
