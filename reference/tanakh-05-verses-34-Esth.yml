      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.11
    scripture: tanakh
    name: Tanakh Esther 1:11
    ref: Esther 1:11
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 11
    ordinal: 20243
    text: to bring Vashti the queen before the king with the crown royal, to show the peoples and the princes her beauty; for she was fair to look on.
    translation: JPS 1917
    original: לְהָבִיא אֶת־וַשְׁתִּי הַמַּלְכָּה לִפְנֵי הַמֶּלֶךְ בְּכֶתֶר מַלְכוּת לְהַרְאוֹת הָעַמִּים וְהַשָּׂרִים אֶת־יָפְיָהּ כִּי־טוֹבַת מַרְאֶה הִיא׃
    hebrewPlain: להביא את ושתי המלכה לפני המלך בכתר מלכות להראות העמים והשרים את יפיה כי טובת מראה היא
    kjvRefs:
    - Esther 1:11
    kjvOsis:
    - Esth.1.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
- type: TanakhVerse
  data:
    osis: Esth.1.12
    scripture: tanakh
    name: Tanakh Esther 1:12
    ref: Esther 1:12
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 12
    ordinal: 20244
    text: But the queen Vashti refused to come at the king’s commandment by the chamberlains; therefore was the king very wroth, and his anger burned in him.
    translation: JPS 1917
    original: וַתְּמָאֵן הַמַּלְכָּה וַשְׁתִּי לָבוֹא בִּדְבַר הַמֶּלֶךְ אֲשֶׁר בְּיַד הַסָּרִיסִים וַיִּקְצֹף הַמֶּלֶךְ מְאֹד וַחֲמָתוֹ בָּעֲרָה בוֹ׃
    hebrewPlain: ותמאן המלכה ושתי לבוא בדבר המלך אשר ביד הסריסים ויקצף המלך מאד וחמתו בערה בו
    kjvRefs:
    - Esther 1:12
    kjvOsis:
    - Esth.1.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.1
