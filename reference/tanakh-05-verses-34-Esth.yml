  data:
    osis: Esth.1.8
    scripture: tanakh
    name: Tanakh Esther 1:8
    ref: Esther 1:8
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 8
    ordinal: 20240
    text: And the drinking was according to the law; none did compel; for so the king had appointed to all the officers of his house, that they should do according to every man’s pleasure.
    translation: JPS 1917
    original: וְהַשְּׁתִיָּה כַדָּת אֵין אֹנֵס כִּי־כֵן יִסַּד הַמֶּלֶךְ עַל כָּל־רַב בֵּיתוֹ לַעֲשׂוֹת כִּרְצוֹן אִישׁ־וָאִישׁ׃
    hebrewPlain: והשתיה כדת אין אנס כי כן יסד המלך על כל רב ביתו לעשות כרצון איש ואיש
