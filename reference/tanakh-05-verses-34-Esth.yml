- type: TanakhVerse
  data:
    osis: Esth.6.3
    scripture: tanakh
    name: Tanakh Esther 6:3
    ref: Esther 6:3
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 3
    ordinal: 20326
    text: 'And the king said: ‘What honour and dignity hath been done to Mordecai for this?’ Then said the king’s servants that ministered unto him: ‘There is nothing done for him.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ מַה־נַּעֲשָׂה יְקָר וּגְדוּלָּה לְמָרְדֳּכַי עַל־זֶה וַיֹּאמְרוּ נַעֲרֵי הַמֶּלֶךְ מְשָׁרְתָיו לֹא־נַעֲשָׂה עִמּוֹ דָּבָר׃
    hebrewPlain: ויאמר המלך מה נעשה יקר וגדולה למרדכי על זה ויאמרו נערי המלך משרתיו לא נעשה עמו דבר
    kjvRefs:
    - Esther 6:3
    kjvOsis:
    - Esth.6.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.4
    scripture: tanakh
    name: Tanakh Esther 6:4
    ref: Esther 6:4
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 4
    ordinal: 20327
    text: 'And the king said: ‘Who is in the court?’—Now Haman was come into the outer court of the king’s house, to speak unto the king to hang Mordecai on the gallows that he had prepared for him.—'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ מִי בֶחָצֵר וְהָמָן בָּא לַחֲצַר בֵּית־הַמֶּלֶךְ הַחִיצוֹנָה לֵאמֹר לַמֶּלֶךְ לִתְלוֹת אֶת־מָרְדֳּכַי עַל־הָעֵץ אֲשֶׁר־הֵכִין לוֹ׃
    hebrewPlain: ויאמר המלך מי בחצר והמן בא לחצר בית המלך החיצונה לאמר למלך לתלות את מרדכי על העץ אשר הכין לו
    kjvRefs:
    - Esther 6:4
    kjvOsis:
    - Esth.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.5
    scripture: tanakh
    name: Tanakh Esther 6:5
    ref: Esther 6:5
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 5
    ordinal: 20328
    text: 'And the king’s servants said unto him: ‘Behold, Haman standeth in the court.’ And the king said: ‘Let him come in.’'
    translation: JPS 1917
    original: וַיֹּאמְרוּ נַעֲרֵי הַמֶּלֶךְ אֵלָיו הִנֵּה הָמָן עֹמֵד בֶּחָצֵר וַיֹּאמֶר הַמֶּלֶךְ יָבוֹא׃
    hebrewPlain: ויאמרו נערי המלך אליו הנה המן עמד בחצר ויאמר המלך יבוא
    kjvRefs:
    - Esther 6:5
    kjvOsis:
    - Esth.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.6
    scripture: tanakh
    name: Tanakh Esther 6:6
    ref: Esther 6:6
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 6
    ordinal: 20329
    text: 'So Haman came in. And the king said unto him: ‘What shall be done unto the man whom the king delighteth to honour?’—Now Haman said in his heart: ‘Whom would the king delight to honour besides myself?’—'
    translation: JPS 1917
    original: וַיָּבוֹא הָמָן וַיֹּאמֶר לוֹ הַמֶּלֶךְ מַה־לַעֲשׂוֹת בָּאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ וַיֹּאמֶר הָמָן בְּלִבּוֹ לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר יוֹתֵר מִמֶּנִּי׃
    hebrewPlain: ויבוא המן ויאמר לו המלך מה לעשות באיש אשר המלך חפץ ביקרו ויאמר המן בלבו למי יחפץ המלך לעשות יקר יותר ממני
    kjvRefs:
    - Esther 6:6
    kjvOsis:
    - Esth.6.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.7
    scripture: tanakh
    name: Tanakh Esther 6:7
    ref: Esther 6:7
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 7
    ordinal: 20330
    text: 'And Haman said unto the king: ‘For the man whom the king delighteth to honour,'
    translation: JPS 1917
    original: וַיֹּאמֶר הָמָן אֶל־הַמֶּלֶךְ אִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ׃
    hebrewPlain: ויאמר המן אל המלך איש אשר המלך חפץ ביקרו
    kjvRefs:
    - Esther 6:7
    kjvOsis:
    - Esth.6.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.8
    scripture: tanakh
    name: Tanakh Esther 6:8
    ref: Esther 6:8
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 8
    ordinal: 20331
    text: let royal apparel be brought which the king useth to wear, and the horse that the king rideth upon, and on whose head a crown royal is set;
    translation: JPS 1917
    original: יָבִיאוּ לְבוּשׁ מַלְכוּת אֲשֶׁר לָבַשׁ־בּוֹ הַמֶּלֶךְ וְסוּס אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ וַאֲשֶׁר נִתַּן כֶּתֶר מַלְכוּת בְּרֹאשׁוֹ׃
    hebrewPlain: יביאו לבוש מלכות אשר לבש בו המלך וסוס אשר רכב עליו המלך ואשר נתן כתר מלכות בראשו
    kjvRefs:
    - Esther 6:8
    kjvOsis:
    - Esth.6.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.9
    scripture: tanakh
    name: Tanakh Esther 6:9
    ref: Esther 6:9
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 9
    ordinal: 20332
    text: 'and let the apparel and the horse be delivered to the hand of one of the king’s most noble princes, that they may array the man therewith whom the king delighteth to honour, and cause him to ride on horseback through the street of the city, and proclaim before him: Thus shall it be done to the man whom the king delighteth to honour.’'
    translation: JPS 1917
    original: וְנָתוֹן הַלְּבוּשׁ וְהַסּוּס עַל־יַד־אִישׁ מִשָּׂרֵי הַמֶּלֶךְ הַפַּרְתְּמִים וְהִלְבִּישׁוּ אֶת־הָאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ וְהִרְכִּיבֻהוּ עַל־הַסּוּס בִּרְחוֹב הָעִיר וְקָרְאוּ לְפָנָיו כָּכָה יֵעָשֶׂה לָאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ׃
    hebrewPlain: ונתון הלבוש והסוס על יד איש משרי המלך הפרתמים והלבישו את האיש אשר המלך חפץ ביקרו והרכיבהו על הסוס ברחוב העיר וקראו לפניו ככה יעשה לאיש אשר המלך חפץ ביקרו
    kjvRefs:
    - Esther 6:9
    kjvOsis:
    - Esth.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.10
    scripture: tanakh
    name: Tanakh Esther 6:10
    ref: Esther 6:10
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 10
    ordinal: 20333
    text: 'Then the king said to Haman: ‘Make haste, and take the apparel and the horse, as thou hast said, and do even so to Mordecai the Jew, that sitteth at the king’s gate; let nothing fail of all that thou hast spoken.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְהָמָן מַהֵר קַח אֶת־הַלְּבוּשׁ וְאֶת־הַסּוּס כַּאֲשֶׁר דִּבַּרְתָּ וַעֲשֵׂה־כֵן לְמָרְדֳּכַי הַיְּהוּדִי הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ אַל־תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ׃
    hebrewPlain: ויאמר המלך להמן מהר קח את הלבוש ואת הסוס כאשר דברת ועשה כן למרדכי היהודי היושב בשער המלך אל תפל דבר מכל אשר דברת
    kjvRefs:
    - Esther 6:10
    kjvOsis:
    - Esth.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.11
    scripture: tanakh
    name: Tanakh Esther 6:11
    ref: Esther 6:11
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 11
    ordinal: 20334
    text: 'Then took Haman the apparel and the horse, and arrayed Mordecai, and caused him to ride through the street of the city, and proclaimed before him: ‘Thus shall it be done unto the man whom the king delighteth to honour.’'
    translation: JPS 1917
    original: וַיִּקַּח הָמָן אֶת־הַלְּבוּשׁ וְאֶת־הַסּוּס וַיַּלְבֵּשׁ אֶת־מָרְדֳּכָי וַיַּרְכִּיבֵהוּ בִּרְחוֹב הָעִיר וַיִּקְרָא לְפָנָיו כָּכָה יֵעָשֶׂה לָאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ׃
    hebrewPlain: ויקח המן את הלבוש ואת הסוס וילבש את מרדכי וירכיבהו ברחוב העיר ויקרא לפניו ככה יעשה לאיש אשר המלך חפץ ביקרו
    kjvRefs:
    - Esther 6:11
    kjvOsis:
    - Esth.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.12
    scripture: tanakh
    name: Tanakh Esther 6:12
    ref: Esther 6:12
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 12
    ordinal: 20335
    text: And Mordecai returned to the king’s gate. But Haman hasted to his house, mourning and having his head covered.
    translation: JPS 1917
    original: וַיָּשָׁב מָרְדֳּכַי אֶל־שַׁעַר הַמֶּלֶךְ וְהָמָן נִדְחַף אֶל־בֵּיתוֹ אָבֵל וַחֲפוּי רֹאשׁ׃
    hebrewPlain: וישב מרדכי אל שער המלך והמן נדחף אל ביתו אבל וחפוי ראש
    kjvRefs:
    - Esther 6:12
    kjvOsis:
    - Esth.6.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.13
    scripture: tanakh
    name: Tanakh Esther 6:13
    ref: Esther 6:13
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 13
    ordinal: 20336
    text: 'And Haman recounted unto Zeresh his wife and all his friends every thing that had befallen him. Then said his wise men and Zeresh his wife unto him: ‘If Mordecai, before whom thou hast begun to fall, be of the seed of the Jews, thou shalt not prevail against him, but shalt surely fall before him.’'
    translation: JPS 1917
    original: וַיְסַפֵּר הָמָן לְזֶרֶשׁ אִשְׁתּוֹ וּלְכָל־אֹהֲבָיו אֵת כָּל־אֲשֶׁר קָרָהוּ וַיֹּאמְרוּ לוֹ חֲכָמָיו וְזֶרֶשׁ אִשְׁתּוֹ אִם מִזֶּרַע הַיְּהוּדִים מָרְדֳּכַי אֲשֶׁר הַחִלּוֹתָ לִנְפֹּל לְפָנָיו לֹא־תוּכַל לוֹ כִּי־נָפוֹל תִּפּוֹל לְפָנָיו׃
    hebrewPlain: ויספר המן לזרש אשתו ולכל אהביו את כל אשר קרהו ויאמרו לו חכמיו וזרש אשתו אם מזרע היהודים מרדכי אשר החלות לנפל לפניו לא תוכל לו כי נפול תפול לפניו
    kjvRefs:
    - Esther 6:13
    kjvOsis:
    - Esth.6.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.14
    scripture: tanakh
    name: Tanakh Esther 6:14
    ref: Esther 6:14
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 14
    ordinal: 20337
    text: While they were yet talking with him, came the king’s chamberlains, and hastened to bring Haman unto the banquet that Esther had prepared.
    translation: JPS 1917
    original: עוֹדָם מְדַבְּרִים עִמּוֹ וְסָרִיסֵי הַמֶּלֶךְ הִגִּיעוּ וַיַּבְהִלוּ לְהָבִיא אֶת־הָמָן אֶל־הַמִּשְׁתֶּה אֲשֶׁר־עָשְׂתָה אֶסְתֵּר׃
    hebrewPlain: עודם מדברים עמו וסריסי המלך הגיעו ויבהלו להביא את המן אל המשתה אשר עשתה אסתר
    kjvRefs:
    - Esther 6:14
    kjvOsis:
    - Esth.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.7.1
    scripture: tanakh
    name: Tanakh Esther 7:1
    ref: Esther 7:1
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 1
    ordinal: 20338
    text: So the king and Haman came to banquet with Esther the queen.
    translation: JPS 1917
    original: וַיָּבֹא הַמֶּלֶךְ וְהָמָן לִשְׁתּוֹת עִם־אֶסְתֵּר הַמַּלְכָּה׃
    hebrewPlain: ויבא המלך והמן לשתות עם אסתר המלכה
    kjvRefs:
    - Esther 7:1
    kjvOsis:
    - Esth.7.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.2
    scripture: tanakh
    name: Tanakh Esther 7:2
    ref: Esther 7:2
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 2
    ordinal: 20339
    text: 'And the king said again unto Esther on the second day at the banquet of wine: ‘Whatever thy petition, queen Esther, it shall be granted thee; and whatever thy request, even to the half of the kingdom, it shall be performed.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְאֶסְתֵּר גַּם בַּיּוֹם הַשֵּׁנִי בְּמִשְׁתֵּה הַיַּיִן מַה־שְּׁאֵלָתֵךְ אֶסְתֵּר הַמַּלְכָּה וְתִנָּתֵן לָךְ וּמַה־בַּקָּשָׁתֵךְ עַד־חֲצִי הַמַּלְכוּת וְתֵעָשׂ׃
    hebrewPlain: ויאמר המלך לאסתר גם ביום השני במשתה היין מה שאלתך אסתר המלכה ותנתן לך ומה בקשתך עד חצי המלכות ותעש
    kjvRefs:
    - Esther 7:2
    kjvOsis:
    - Esth.7.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.3
    scripture: tanakh
    name: Tanakh Esther 7:3
    ref: Esther 7:3
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 3
    ordinal: 20340
    text: 'Then Esther the queen answered and said: ‘If I have found favour in thy sight, O king, and if it please the king, let my life be given me at my petition, and my people at my request;'
    translation: JPS 1917
    original: וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר אִם־מָצָאתִי חֵן בְּעֵינֶיךָ הַמֶּלֶךְ וְאִם־עַל־הַמֶּלֶךְ טוֹב תִּנָּתֶן־לִי נַפְשִׁי בִּשְׁאֵלָתִי וְעַמִּי בְּבַקָּשָׁתִי׃
    hebrewPlain: ותען אסתר המלכה ותאמר אם מצאתי חן בעיניך המלך ואם על המלך טוב תנתן לי נפשי בשאלתי ועמי בבקשתי
    kjvRefs:
    - Esther 7:3
    kjvOsis:
    - Esth.7.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.4
    scripture: tanakh
    name: Tanakh Esther 7:4
    ref: Esther 7:4
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 4
    ordinal: 20341
    text: for we are sold, I and my people, to be destroyed, to be slain, and to perish. But if we had been sold for bondmen and bondwomen, I had held my peace, for the adversary is not worthy that the king be endamaged.’
    translation: JPS 1917
    original: כִּי נִמְכַּרְנוּ אֲנִי וְעַמִּי לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד וְאִלּוּ לַעֲבָדִים וְלִשְׁפָחוֹת נִמְכַּרְנוּ הֶחֱרַשְׁתִּי כִּי אֵין הַצָּר שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ׃
    hebrewPlain: כי נמכרנו אני ועמי להשמיד להרוג ולאבד ואלו לעבדים ולשפחות נמכרנו החרשתי כי אין הצר שוה בנזק המלך
    kjvRefs:
    - Esther 7:4
    kjvOsis:
    - Esth.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.5
    scripture: tanakh
    name: Tanakh Esther 7:5
    ref: Esther 7:5
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 5
    ordinal: 20342
    text: 'Then spoke the king Ahasuerus and said unto Esther the queen: ‘Who is he, and where is he, that durst presume in his heart to do so?’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ וַיֹּאמֶר לְאֶסְתֵּר הַמַּלְכָּה מִי הוּא זֶה וְאֵי־זֶה הוּא אֲשֶׁר־מְלָאוֹ לִבּוֹ לַעֲשׂוֹת כֵּן׃
    hebrewPlain: ויאמר המלך אחשורוש ויאמר לאסתר המלכה מי הוא זה ואי זה הוא אשר מלאו לבו לעשות כן
    kjvRefs:
    - Esther 7:5
    kjvOsis:
    - Esth.7.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.6
    scripture: tanakh
    name: Tanakh Esther 7:6
    ref: Esther 7:6
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 6
    ordinal: 20343
    text: 'And Esther said: ‘An adversary and an enemy, even this wicked Haman.’ Then Haman was terrified before the king and the queen.'
    translation: JPS 1917
    original: וַתֹּאמֶר־אֶסְתֵּר אִישׁ צַר וְאוֹיֵב הָמָן הָרָע הַזֶּה וְהָמָן נִבְעַת מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה׃
    hebrewPlain: ותאמר אסתר איש צר ואויב המן הרע הזה והמן נבעת מלפני המלך והמלכה
    kjvRefs:
    - Esther 7:6
    kjvOsis:
    - Esth.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.7
    scripture: tanakh
    name: Tanakh Esther 7:7
    ref: Esther 7:7
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 7
    ordinal: 20344
    text: And the king arose in his wrath from the banquet of wine and went into the palace garden; but Haman remained to make request for his life to Esther the queen; for he saw that there was evil determined against him by the king.
    translation: JPS 1917
    original: וְהַמֶּלֶךְ קָם בַּחֲמָתוֹ מִמִּשְׁתֵּה הַיַּיִן אֶל־גִּנַּת הַבִּיתָן וְהָמָן עָמַד לְבַקֵּשׁ עַל־נַפְשׁוֹ מֵאֶסְתֵּר הַמַּלְכָּה כִּי רָאָה כִּי־כָלְתָה אֵלָיו הָרָעָה מֵאֵת הַמֶּלֶךְ׃
    hebrewPlain: והמלך קם בחמתו ממשתה היין אל גנת הביתן והמן עמד לבקש על נפשו מאסתר המלכה כי ראה כי כלתה אליו הרעה מאת המלך
    kjvRefs:
    - Esther 7:7
    kjvOsis:
    - Esth.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.8
    scripture: tanakh
    name: Tanakh Esther 7:8
    ref: Esther 7:8
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 8
    ordinal: 20345
    text: 'Then the king returned out of the palace garden into the place of the banquet of wine; and Haman was fallen upon the couch whereon Esther was. Then said the king: ‘Will he even force the queen before me in the house?’ As the word went out of the king’s mouth, they covered Haman’s face.'
    translation: JPS 1917
    original: וְהַמֶּלֶךְ שָׁב מִגִּנַּת הַבִּיתָן אֶל־בֵּית מִשְׁתֵּה הַיַּיִן וְהָמָן נֹפֵל עַל־הַמִּטָּה אֲשֶׁר אֶסְתֵּר עָלֶיהָ וַיֹּאמֶר הַמֶּלֶךְ הֲגַם לִכְבּוֹשׁ אֶת־הַמַּלְכָּה עִמִּי בַּבָּיִת הַדָּבָר יָצָא מִפִּי הַמֶּלֶךְ וּפְנֵי הָמָן חָפוּ׃
    hebrewPlain: והמלך שב מגנת הביתן אל בית משתה היין והמן נפל על המטה אשר אסתר עליה ויאמר המלך הגם לכבוש את המלכה עמי בבית הדבר יצא מפי המלך ופני המן חפו
    kjvRefs:
    - Esther 7:8
    kjvOsis:
    - Esth.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.9
    scripture: tanakh
    name: Tanakh Esther 7:9
    ref: Esther 7:9
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 9
    ordinal: 20346
    text: 'Then said Harbonah, one of the chamberlains that were before the king: ‘Behold also, the gallows fifty cubits high, which Haman hath made for Mordecai, who spoke good for the king, standeth in the house of Haman.’ And the king said: ‘Hang him thereon.’'
    translation: JPS 1917
    original: וַיֹּאמֶר חַרְבוֹנָה אֶחָד מִן־הַסָּרִיסִים לִפְנֵי הַמֶּלֶךְ גַּם הִנֵּה־הָעֵץ אֲשֶׁר־עָשָׂה הָמָן לְמָרְדֳּכַי אֲשֶׁר דִּבֶּר־טוֹב עַל־הַמֶּלֶךְ עֹמֵד בְּבֵית הָמָן גָּבֹהַּ חֲמִשִּׁים אַמָּה וַיֹּאמֶר הַמֶּלֶךְ תְּלֻהוּ עָלָיו׃
    hebrewPlain: ויאמר חרבונה אחד מן הסריסים לפני המלך גם הנה העץ אשר עשה המן למרדכי אשר דבר טוב על המלך עמד בבית המן גבה חמשים אמה ויאמר המלך תלהו עליו
    kjvRefs:
    - Esther 7:9
    kjvOsis:
    - Esth.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.7.10
    scripture: tanakh
    name: Tanakh Esther 7:10
    ref: Esther 7:10
    book: Esth
    section: ketuvim
    chapter: 7
    verse: 10
    ordinal: 20347
    text: So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath assuaged.
    translation: JPS 1917
    original: וַיִּתְלוּ אֶת־הָמָן עַל־הָעֵץ אֲשֶׁר־הֵכִין לְמָרְדֳּכָי וַחֲמַת הַמֶּלֶךְ שָׁכָכָה׃
    hebrewPlain: ויתלו את המן על העץ אשר הכין למרדכי וחמת המלך שככה
    kjvRefs:
    - Esther 7:10
    kjvOsis:
    - Esth.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.7
- type: TanakhVerse
  data:
    osis: Esth.8.1
    scripture: tanakh
    name: Tanakh Esther 8:1
    ref: Esther 8:1
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 1
    ordinal: 20348
    text: On that day did the king Ahasuerus give the house of Haman the Jews’ enemy unto Esther the queen. And Mordecai came before the king; for Esther had told what he was unto her.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא נָתַן הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ לְאֶסְתֵּר הַמַּלְכָּה אֶת־בֵּית הָמָן צֹרֵר היהודיים [הַיְּהוּדִים] וּמָרְדֳּכַי בָּא לִפְנֵי הַמֶּלֶךְ כִּי־הִגִּידָה אֶסְתֵּר מַה הוּא־לָהּ׃
    hebrewPlain: ביום ההוא נתן המלך אחשורוש לאסתר המלכה את בית המן צרר היהודיים [היהודים] ומרדכי בא לפני המלך כי הגידה אסתר מה הוא לה
    kjvRefs:
    - Esther 8:1
    kjvOsis:
    - Esth.8.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.2
    scripture: tanakh
    name: Tanakh Esther 8:2
    ref: Esther 8:2
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 2
    ordinal: 20349
    text: And the king took off his ring, which he had taken from Haman, and gave it unto Mordecai. And Esther set Mordecai over the house of Haman.
    translation: JPS 1917
    original: וַיָּסַר הַמֶּלֶךְ אֶת־טַבַּעְתּוֹ אֲשֶׁר הֶעֱבִיר מֵהָמָן וַיִּתְּנָהּ לְמָרְדֳּכָי וַתָּשֶׂם אֶסְתֵּר אֶת־מָרְדֳּכַי עַל־בֵּית הָמָן׃
    hebrewPlain: ויסר המלך את טבעתו אשר העביר מהמן ויתנה למרדכי ותשם אסתר את מרדכי על בית המן
    kjvRefs:
    - Esther 8:2
    kjvOsis:
    - Esth.8.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.3
    scripture: tanakh
    name: Tanakh Esther 8:3
    ref: Esther 8:3
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 3
    ordinal: 20350
    text: And Esther spoke yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Jews.
    translation: JPS 1917
    original: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר לִפְנֵי הַמֶּלֶךְ וַתִּפֹּל לִפְנֵי רַגְלָיו וַתֵּבְךְּ וַתִּתְחַנֶּן־לוֹ לְהַעֲבִיר אֶת־רָעַת הָמָן הָאֲגָגִי וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב עַל־הַיְּהוּדִים׃
    hebrewPlain: ותוסף אסתר ותדבר לפני המלך ותפל לפני רגליו ותבך ותתחנן לו להעביר את רעת המן האגגי ואת מחשבתו אשר חשב על היהודים
    kjvRefs:
    - Esther 8:3
    kjvOsis:
    - Esth.8.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.4
    scripture: tanakh
    name: Tanakh Esther 8:4
    ref: Esther 8:4
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 4
    ordinal: 20351
    text: Then the king held out to Esther the golden sceptre. So Esther arose, and stood before the king.
    translation: JPS 1917
    original: וַיּוֹשֶׁט הַמֶּלֶךְ לְאֶסְתֵּר אֵת שַׁרְבִט הַזָּהָב וַתָּקָם אֶסְתֵּר וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ויושט המלך לאסתר את שרבט הזהב ותקם אסתר ותעמד לפני המלך
    kjvRefs:
    - Esther 8:4
    kjvOsis:
    - Esth.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.5
    scripture: tanakh
    name: Tanakh Esther 8:5
    ref: Esther 8:5
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 5
    ordinal: 20352
    text: 'And she said: ‘If it please the king, and if I have found favour in his sight, and the thing seem right before the king, and I be pleasing in his eyes, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews that are in all the king’s provinces;'
    translation: JPS 1917
    original: וַתֹּאמֶר אִם־עַל־הַמֶּלֶךְ טוֹב וְאִם־מָצָאתִי חֵן לְפָנָיו וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ וְטוֹבָה אֲנִי בְּעֵינָיו יִכָּתֵב לְהָשִׁיב אֶת־הַסְּפָרִים מַחֲשֶׁבֶת הָמָן בֶּן־הַמְּדָתָא הָאֲגָגִי אֲשֶׁר כָּתַב לְאַבֵּד אֶת־הַיְּהוּדִים אֲשֶׁר בְּכָל־מְדִינוֹת הַמֶּלֶךְ׃
    hebrewPlain: ותאמר אם על המלך טוב ואם מצאתי חן לפניו וכשר הדבר לפני המלך וטובה אני בעיניו יכתב להשיב את הספרים מחשבת המן בן המדתא האגגי אשר כתב לאבד את היהודים אשר בכל מדינות המלך
    kjvRefs:
    - Esther 8:5
    kjvOsis:
    - Esth.8.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.6
    scripture: tanakh
    name: Tanakh Esther 8:6
    ref: Esther 8:6
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 6
    ordinal: 20353
    text: for how can I endure to see the evil that shall come unto my people? or how can I endure to see the destruction of my kindred?’
    translation: JPS 1917
    original: כִּי אֵיכָכָה אוּכַל וְרָאִיתִי בָּרָעָה אֲשֶׁר־יִמְצָא אֶת־עַמִּי וְאֵיכָכָה אוּכַל וְרָאִיתִי בְּאָבְדַן מוֹלַדְתִּי׃
    hebrewPlain: כי איככה אוכל וראיתי ברעה אשר ימצא את עמי ואיככה אוכל וראיתי באבדן מולדתי
    kjvRefs:
    - Esther 8:6
    kjvOsis:
    - Esth.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.7
    scripture: tanakh
    name: Tanakh Esther 8:7
    ref: Esther 8:7
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 7
    ordinal: 20354
    text: 'Then the king Ahasuerus said unto Esther the queen and to Mordecai the Jew: ‘Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ לְאֶסְתֵּר הַמַּלְכָּה וּלְמָרְדֳּכַי הַיְּהוּדִי הִנֵּה בֵית־הָמָן נָתַתִּי לְאֶסְתֵּר וְאֹתוֹ תָּלוּ עַל־הָעֵץ עַל אֲשֶׁר־שָׁלַח יָדוֹ ביהודיים [בַּיְּהוּדִים׃]
    hebrewPlain: ויאמר המלך אחשורש לאסתר המלכה ולמרדכי היהודי הנה בית המן נתתי לאסתר ואתו תלו על העץ על אשר שלח ידו ביהודיים [ביהודים]
    kjvRefs:
    - Esther 8:7
    kjvOsis:
    - Esth.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.8
    scripture: tanakh
    name: Tanakh Esther 8:8
    ref: Esther 8:8
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 8
    ordinal: 20355
    text: Write ye also concerning the Jews, as it liketh you, in the king’s name, and seal it with the king’s ring; for the writing which is written in the king’s name, and sealed with the king’s ring, may no man reverse.’
    translation: JPS 1917
    original: וְאַתֶּם כִּתְבוּ עַל־הַיְּהוּדִים כַּטּוֹב בְּעֵינֵיכֶם בְּשֵׁם הַמֶּלֶךְ וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ כִּי־כְתָב אֲשֶׁר־נִכְתָּב בְּשֵׁם־הַמֶּלֶךְ וְנַחְתּוֹם בְּטַבַּעַת הַמֶּלֶךְ אֵין לְהָשִׁיב׃
    hebrewPlain: ואתם כתבו על היהודים כטוב בעיניכם בשם המלך וחתמו בטבעת המלך כי כתב אשר נכתב בשם המלך ונחתום בטבעת המלך אין להשיב
    kjvRefs:
    - Esther 8:8
    kjvOsis:
    - Esth.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.9
    scripture: tanakh
    name: Tanakh Esther 8:9
    ref: Esther 8:9
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 9
    ordinal: 20356
    text: Then were the king’s scribes called at that time, in the third month, which is the month Sivan, on the three and twentieth day thereof; and it was written according to all that Mordecai commanded concerning the Jews, even to the satraps, and the governors and princes of the provinces which are from India unto Ethiopia, a hundred twenty and seven provinces, unto every province according to the writing thereof, and unto every people after their language, and to the Jews according to their writing, and according to their language.
    translation: JPS 1917
    original: וַיִּקָּרְאוּ סֹפְרֵי־הַמֶּלֶךְ בָּעֵת־הַהִיא בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא־חֹדֶשׁ סִיוָן בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ וַיִּכָּתֵב כְּכָל־אֲשֶׁר־צִוָּה מָרְדֳּכַי אֶל־הַיְּהוּדִים וְאֶל הָאֲחַשְׁדַּרְפְּנִים־וְהַפַּחוֹת וְשָׂרֵי הַמְּדִינוֹת אֲשֶׁר מֵהֹדּוּ וְעַד־כּוּשׁ שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ וְאֶל־הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם׃
    hebrewPlain: ויקראו ספרי המלך בעת ההיא בחדש השלישי הוא חדש סיון בשלושה ועשרים בו ויכתב ככל אשר צוה מרדכי אל היהודים ואל האחשדרפנים והפחות ושרי המדינות אשר מהדו ועד כוש שבע ועשרים ומאה מדינה מדינה ומדינה ככתבה ועם ועם כלשנו ואל היהודים ככתבם וכלשונם
    kjvRefs:
    - Esther 8:9
    kjvOsis:
    - Esth.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.10
    scripture: tanakh
    name: Tanakh Esther 8:10
    ref: Esther 8:10
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 10
    ordinal: 20357
    text: And they wrote in the name of king Ahasuerus, and sealed it with the king’s ring, and sent letters by posts on horseback, riding on swift steeds that were used in the king’s service, bred of the stud;
    translation: JPS 1917
    original: וַיִּכְתֹּב בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ וַיִּשְׁלַח סְפָרִים בְּיַד הָרָצִים בַּסּוּסִים רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים׃
    hebrewPlain: ויכתב בשם המלך אחשורש ויחתם בטבעת המלך וישלח ספרים ביד הרצים בסוסים רכבי הרכש האחשתרנים בני הרמכים
    kjvRefs:
    - Esther 8:10
    kjvOsis:
    - Esth.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.11
    scripture: tanakh
    name: Tanakh Esther 8:11
    ref: Esther 8:11
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 11
    ordinal: 20358
    text: that the king had granted the Jews that were in every city to gather themselves together, and to stand for their life, to destroy, and to slay, and to cause to perish, all the forces of the people and province that would assault them, their little ones and women, and to take the spoil of them for a prey,
    translation: JPS 1917
    original: אֲשֶׁר נָתַן הַמֶּלֶךְ לַיְּהוּדִים אֲשֶׁר בְּכָל־עִיר־וָעִיר לְהִקָּהֵל וְלַעֲמֹד עַל־נַפְשָׁם לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד אֶת־כָּל־חֵיל עַם וּמְדִינָה הַצָּרִים אֹתָם טַף וְנָשִׁים וּשְׁלָלָם לָבוֹז׃
    hebrewPlain: אשר נתן המלך ליהודים אשר בכל עיר ועיר להקהל ולעמד על נפשם להשמיד ולהרג ולאבד את כל חיל עם ומדינה הצרים אתם טף ונשים ושללם לבוז
    kjvRefs:
    - Esther 8:11
    kjvOsis:
    - Esth.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.12
    scripture: tanakh
    name: Tanakh Esther 8:12
    ref: Esther 8:12
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 12
    ordinal: 20359
    text: upon one day in all the provinces of king Ahasuerus, namely, upon the thirteenth day of the twelfth month, which is the month Adar.
    translation: JPS 1917
    original: בְּיוֹם אֶחָד בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים־עָשָׂר הוּא־חֹדֶשׁ אֲדָר׃
    hebrewPlain: ביום אחד בכל מדינות המלך אחשורוש בשלושה עשר לחדש שנים עשר הוא חדש אדר
    kjvRefs:
    - Esther 8:12
    kjvOsis:
    - Esth.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.13
    scripture: tanakh
    name: Tanakh Esther 8:13
    ref: Esther 8:13
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 13
    ordinal: 20360
    text: The copy of the writing, to be given out for a decree in every province, was to be published unto all the peoples, and that the Jews should be ready against that day to avenge themselves on their enemies.
    translation: JPS 1917
    original: פַּתְשֶׁגֶן הַכְּתָב לְהִנָּתֵן דָּת בְּכָל־מְדִינָה וּמְדִינָה גָּלוּי לְכָל־הָעַמִּים וְלִהְיוֹת היהודיים [הַיְּהוּדִים] עתודים [עֲתִידִים] לַיּוֹם הַזֶּה לְהִנָּקֵם מֵאֹיְבֵיהֶם׃
    hebrewPlain: פתשגן הכתב להנתן דת בכל מדינה ומדינה גלוי לכל העמים ולהיות היהודיים [היהודים] עתודים [עתידים] ליום הזה להנקם מאיביהם
    kjvRefs:
    - Esther 8:13
    kjvOsis:
    - Esth.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.14
    scripture: tanakh
    name: Tanakh Esther 8:14
    ref: Esther 8:14
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 14
    ordinal: 20361
    text: So the posts that rode upon swift steeds that were used in the king’s service went out, being hastened and pressed on by the king’s commandment; and the decree was given out in Shushan the castle.
    translation: JPS 1917
    original: הָרָצִים רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים יָצְאוּ מְבֹהָלִים וּדְחוּפִים בִּדְבַר הַמֶּלֶךְ וְהַדָּת נִתְּנָה בְּשׁוּשַׁן הַבִּירָה׃
    hebrewPlain: הרצים רכבי הרכש האחשתרנים יצאו מבהלים ודחופים בדבר המלך והדת נתנה בשושן הבירה
    kjvRefs:
    - Esther 8:14
    kjvOsis:
    - Esth.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.15
    scripture: tanakh
    name: Tanakh Esther 8:15
    ref: Esther 8:15
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 15
    ordinal: 20362
    text: And Mordecai went forth from the presence of the king in royal apparel of blue and white, and with a great crown of gold, and with a robe of fine linen and purple; and the city of Shushan shouted and was glad.
    translation: JPS 1917
    original: וּמָרְדֳּכַי יָצָא מִלִּפְנֵי הַמֶּלֶךְ בִּלְבוּשׁ מַלְכוּת תְּכֵלֶת וָחוּר וַעֲטֶרֶת זָהָב גְּדוֹלָה וְתַכְרִיךְ בּוּץ וְאַרְגָּמָן וְהָעִיר שׁוּשָׁן צָהֲלָה וְשָׂמֵחָה׃
    hebrewPlain: ומרדכי יצא מלפני המלך בלבוש מלכות תכלת וחור ועטרת זהב גדולה ותכריך בוץ וארגמן והעיר שושן צהלה ושמחה
    kjvRefs:
    - Esther 8:15
    kjvOsis:
    - Esth.8.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.16
    scripture: tanakh
    name: Tanakh Esther 8:16
    ref: Esther 8:16
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 16
    ordinal: 20363
    text: The Jews had light and gladness, and joy and honour.
    translation: JPS 1917
    original: לַיְּהוּדִים הָיְתָה אוֹרָה וְשִׂמְחָה וְשָׂשֹׂן וִיקָר׃
    hebrewPlain: ליהודים היתה אורה ושמחה וששן ויקר
    kjvRefs:
    - Esther 8:16
    kjvOsis:
    - Esth.8.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.8.17
    scripture: tanakh
    name: Tanakh Esther 8:17
    ref: Esther 8:17
    book: Esth
    section: ketuvim
    chapter: 8
    verse: 17
    ordinal: 20364
    text: And in every province, and in every city, whithersoever the king’s commandment and his decree came, the Jews had gladness and joy, a feast and a good day. And many from among the peoples of the land became Jews; for the fear of the Jews was fallen upon them.
    translation: JPS 1917
    original: וּבְכָל־מְדִינָה וּמְדִינָה וּבְכָל־עִיר וָעִיר מְקוֹם אֲשֶׁר דְּבַר־הַמֶּלֶךְ וְדָתוֹ מַגִּיעַ שִׂמְחָה וְשָׂשׂוֹן לַיְּהוּדִים מִשְׁתֶּה וְיוֹם טוֹב וְרַבִּים מֵעַמֵּי הָאָרֶץ מִתְיַהֲדִים כִּי־נָפַל פַּחַד־הַיְּהוּדִים עֲלֵיהֶם׃
    hebrewPlain: ובכל מדינה ומדינה ובכל עיר ועיר מקום אשר דבר המלך ודתו מגיע שמחה וששון ליהודים משתה ויום טוב ורבים מעמי הארץ מתיהדים כי נפל פחד היהודים עליהם
    kjvRefs:
    - Esther 8:17
    kjvOsis:
    - Esth.8.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.8
- type: TanakhVerse
  data:
    osis: Esth.9.1
    scripture: tanakh
    name: Tanakh Esther 9:1
    ref: Esther 9:1
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 1
    ordinal: 20365
    text: Now in the twelfth month, which is the month Adar, on the thirteenth day of the same, when the king’s commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have rule over them; whereas it was turned to the contrary, that the Jews had rule over them that hated them;
    translation: JPS 1917
    original: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ הוּא־חֹדֶשׁ אֲדָר בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ אֲשֶׁר הִגִּיעַ דְּבַר־הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת בַּיּוֹם אֲשֶׁר שִׂבְּרוּ אֹיְבֵי הַיְּהוּדִים לִשְׁלוֹט בָּהֶם וְנַהֲפוֹךְ הוּא אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה בְּשֹׂנְאֵיהֶם׃
    hebrewPlain: ובשנים עשר חדש הוא חדש אדר בשלושה עשר יום בו אשר הגיע דבר המלך ודתו להעשות ביום אשר שברו איבי היהודים לשלוט בהם ונהפוך הוא אשר ישלטו היהודים המה בשנאיהם
    kjvRefs:
    - Esther 9:1
    kjvOsis:
    - Esth.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.2
    scripture: tanakh
    name: Tanakh Esther 9:2
    ref: Esther 9:2
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 2
    ordinal: 20366
    text: the Jews gathered themselves together in their cities throughout all the provinces of the king Ahasuerus, to lay hand on such as sought their hurt; and no man could withstand them; for the fear of them was fallen upon all the peoples.
    translation: JPS 1917
    original: נִקְהֲלוּ הַיְּהוּדִים בְּעָרֵיהֶם בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ לִשְׁלֹחַ יָד בִּמְבַקְשֵׁי רָעָתָם וְאִישׁ לֹא־עָמַד לִפְנֵיהֶם כִּי־נָפַל פַּחְדָּם עַל־כָּל־הָעַמִּים׃
    hebrewPlain: נקהלו היהודים בעריהם בכל מדינות המלך אחשורוש לשלח יד במבקשי רעתם ואיש לא עמד לפניהם כי נפל פחדם על כל העמים
    kjvRefs:
    - Esther 9:2
    kjvOsis:
    - Esth.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.3
    scripture: tanakh
    name: Tanakh Esther 9:3
    ref: Esther 9:3
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 3
    ordinal: 20367
    text: And all the princes of the provinces, and the satraps, and the governors, and they that did the king’s business, helped the Jews; because the fear of Mordecai was fallen upon them.
    translation: JPS 1917
    original: וְכָל־שָׂרֵי הַמְּדִינוֹת וְהָאֲחַשְׁדַּרְפְּנִים וְהַפַּחוֹת וְעֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ מְנַשְּׂאִים אֶת־הַיְּהוּדִים כִּי־נָפַל פַּחַד־מָרְדֳּכַי עֲלֵיהֶם׃
    hebrewPlain: וכל שרי המדינות והאחשדרפנים והפחות ועשי המלאכה אשר למלך מנשאים את היהודים כי נפל פחד מרדכי עליהם
    kjvRefs:
    - Esther 9:3
    kjvOsis:
    - Esth.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.4
    scripture: tanakh
    name: Tanakh Esther 9:4
    ref: Esther 9:4
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 4
    ordinal: 20368
    text: For Mordecai was great in the king’s house, and his fame went forth throughout all the provinces; for the man Mordecai waxed greater and greater.
    translation: JPS 1917
    original: כִּי־גָדוֹל מָרְדֳּכַי בְּבֵית הַמֶּלֶךְ וְשָׁמְעוֹ הוֹלֵךְ בְּכָל־הַמְּדִינוֹת כִּי־הָאִישׁ מָרְדֳּכַי הוֹלֵךְ וְגָדוֹל׃
    hebrewPlain: כי גדול מרדכי בבית המלך ושמעו הולך בכל המדינות כי האיש מרדכי הולך וגדול
    kjvRefs:
    - Esther 9:4
    kjvOsis:
    - Esth.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.5
    scripture: tanakh
    name: Tanakh Esther 9:5
    ref: Esther 9:5
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 5
    ordinal: 20369
    text: And the Jews smote all their enemies with the stroke of the sword, and with slaughter and destruction, and did what they would unto them that hated them.
    translation: JPS 1917
    original: וַיַּכּוּ הַיְּהוּדִים בְּכָל־אֹיְבֵיהֶם מַכַּת־חֶרֶב וְהֶרֶג וְאַבְדָן וַיַּעֲשׂוּ בְשֹׂנְאֵיהֶם כִּרְצוֹנָם׃
    hebrewPlain: ויכו היהודים בכל איביהם מכת חרב והרג ואבדן ויעשו בשנאיהם כרצונם
    kjvRefs:
    - Esther 9:5
    kjvOsis:
    - Esth.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.6
    scripture: tanakh
    name: Tanakh Esther 9:6
    ref: Esther 9:6
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 6
    ordinal: 20370
    text: And in Shushan the castle the Jews slew and destroyed five hundred men.
    translation: JPS 1917
