  data:
    osis: Esth.9.12
    scripture: tanakh
    name: Tanakh Esther 9:12
    ref: Esther 9:12
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 12
    ordinal: 20376
    text: 'And the king said unto Esther the queen: ‘The Jews have slain and destroyed five hundred men in Shushan the castle, and the ten sons of Haman; what then have they done in the rest of the king’s provinces! Now whatever thy petition, it shall be granted thee; and whatever thy request further, it shall be done.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְאֶסְתֵּר הַמַּלְכָּה בְּשׁוּשַׁן הַבִּירָה הָרְגוּ הַיְּהוּדִים וְאַבֵּד חֲמֵשׁ מֵאוֹת אִישׁ וְאֵת עֲשֶׂרֶת בְּנֵי־הָמָן בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ מֶה עָשׂוּ וּמַה־שְּׁאֵלָתֵךְ וְיִנָּתֵן לָךְ וּמַה־בַּקָּשָׁתֵךְ עוֹד וְתֵעָשׂ׃
    hebrewPlain: ויאמר המלך לאסתר המלכה בשושן הבירה הרגו היהודים ואבד חמש מאות איש ואת עשרת בני המן בשאר מדינות המלך מה עשו ומה שאלתך וינתן לך ומה בקשתך עוד ותעש
    kjvRefs:
    - Esther 9:12
    kjvOsis:
    - Esth.9.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.13
    scripture: tanakh
    name: Tanakh Esther 9:13
    ref: Esther 9:13
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 13
    ordinal: 20377
    text: 'Then said Esther: ‘If it please the king, let it be granted to the Jews that are in Shushan to do to-morrow also according unto this day’s decree, and let Haman’s ten sons be hanged upon the gallows.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶסְתֵּר אִם־עַל־הַמֶּלֶךְ טוֹב יִנָּתֵן גַּם־מָחָר לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן לַעֲשׂוֹת כְּדָת הַיּוֹם וְאֵת עֲשֶׂרֶת בְּנֵי־הָמָן יִתְלוּ עַל־הָעֵץ׃
    hebrewPlain: ותאמר אסתר אם על המלך טוב ינתן גם מחר ליהודים אשר בשושן לעשות כדת היום ואת עשרת בני המן יתלו על העץ
    kjvRefs:
    - Esther 9:13
    kjvOsis:
    - Esth.9.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.14
    scripture: tanakh
    name: Tanakh Esther 9:14
    ref: Esther 9:14
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 14
    ordinal: 20378
    text: And the king commanded it so to be done; and a decree was given out in Shushan; and they hanged Haman’s ten sons.
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְהֵעָשׂוֹת כֵּן וַתִּנָּתֵן דָּת בְּשׁוּשָׁן וְאֵת עֲשֶׂרֶת בְּנֵי־הָמָן תָּלוּ׃
    hebrewPlain: ויאמר המלך להעשות כן ותנתן דת בשושן ואת עשרת בני המן תלו
    kjvRefs:
    - Esther 9:14
    kjvOsis:
    - Esth.9.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.15
    scripture: tanakh
    name: Tanakh Esther 9:15
    ref: Esther 9:15
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 15
    ordinal: 20379
    text: And the Jews that were in Shushan gathered themselves together on the fourteenth day also of the month Adar, and slew three hundred men in Shushan; but on the spoil they laid not their hand.
    translation: JPS 1917
    original: וַיִּקָּהֲלוּ היהודיים [הַיְּהוּדִים] אֲשֶׁר־בְּשׁוּשָׁן גַּם בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר וַיַּהַרְגוּ בְשׁוּשָׁן שְׁלֹשׁ מֵאוֹת אִישׁ וּבַבִּזָּה לֹא שָׁלְחוּ אֶת־יָדָם׃
    hebrewPlain: ויקהלו היהודיים [היהודים] אשר בשושן גם ביום ארבעה עשר לחדש אדר ויהרגו בשושן שלש מאות איש ובבזה לא שלחו את ידם
    kjvRefs:
    - Esther 9:15
    kjvOsis:
    - Esth.9.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.16
    scripture: tanakh
    name: Tanakh Esther 9:16
    ref: Esther 9:16
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 16
    ordinal: 20380
    text: And the other Jews that were in the king’s provinces gathered themselves together, and stood for their lives, and had rest from their enemies, and slew of them that hated them seventy and five thousand—but on the spoil they laid not their hand—.
    translation: JPS 1917
    original: וּשְׁאָר הַיְּהוּדִים אֲשֶׁר בִּמְדִינוֹת הַמֶּלֶךְ נִקְהֲלוּ וְעָמֹד עַל־נַפְשָׁם וְנוֹחַ מֵאֹיְבֵיהֶם וְהָרֹג בְּשֹׂנְאֵיהֶם חֲמִשָּׁה וְשִׁבְעִים אָלֶף וּבַבִּזָּה לֹא שָׁלְחוּ אֶת־יָדָם׃
    hebrewPlain: ושאר היהודים אשר במדינות המלך נקהלו ועמד על נפשם ונוח מאיביהם והרג בשנאיהם חמשה ושבעים אלף ובבזה לא שלחו את ידם
    kjvRefs:
    - Esther 9:16
    kjvOsis:
    - Esth.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.17
    scripture: tanakh
    name: Tanakh Esther 9:17
    ref: Esther 9:17
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 17
    ordinal: 20381
    text: on the thirteenth day of the month Adar, and on the fourteenth day of the same they rested, and made it a day of feasting and gladness.
    translation: JPS 1917
    original: בְּיוֹם־שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר וְנוֹחַ בְּאַרְבָּעָה עָשָׂר בּוֹ וְעָשֹׂה אֹתוֹ יוֹם מִשְׁתֶּה וְשִׂמְחָה׃
    hebrewPlain: ביום שלשה עשר לחדש אדר ונוח בארבעה עשר בו ועשה אתו יום משתה ושמחה
    kjvRefs:
    - Esther 9:17
    kjvOsis:
    - Esth.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.18
    scripture: tanakh
    name: Tanakh Esther 9:18
    ref: Esther 9:18
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 18
    ordinal: 20382
    text: But the Jews that were in Shushan assembled together on the thirteenth day thereof, and on the fourteenth thereof; and on the fifteenth day of the same they rested, and made it a day of feasting and gladness and they ate.
    translation: JPS 1917
    original: והיהודיים [וְהַיְּהוּדִים] אֲשֶׁר־בְּשׁוּשָׁן נִקְהֲלוּ בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ וְנוֹחַ בַּחֲמִשָּׁה עָשָׂר בּוֹ וְעָשֹׂה אֹתוֹ יוֹם מִשְׁתֶּה וְשִׂמְחָה׃
    hebrewPlain: והיהודיים [והיהודים] אשר בשושן נקהלו בשלשה עשר בו ובארבעה עשר בו ונוח בחמשה עשר בו ועשה אתו יום משתה ושמחה
    kjvRefs:
    - Esther 9:18
    kjvOsis:
    - Esth.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.19
    scripture: tanakh
    name: Tanakh Esther 9:19
    ref: Esther 9:19
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 19
    ordinal: 20383
    text: Therefore do the Jews of the villages, that dwell in the unwalled towns, make the fourteenth day of the month Adar a day of gladness and feasting, and a good day, and of sending portions one to another.
    translation: JPS 1917
    original: עַל־כֵּן הַיְּהוּדִים הפרוזים [הַפְּרָזִים] הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב וּמִשְׁלוֹחַ מָנוֹת אִישׁ לְרֵעֵהוּ׃
    hebrewPlain: על כן היהודים הפרוזים [הפרזים] הישבים בערי הפרזות עשים את יום ארבעה עשר לחדש אדר שמחה ומשתה ויום טוב ומשלוח מנות איש לרעהו
    kjvRefs:
    - Esther 9:19
    kjvOsis:
    - Esth.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.20
    scripture: tanakh
    name: Tanakh Esther 9:20
    ref: Esther 9:20
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 20
    ordinal: 20384
    text: And Mordecai wrote these things, and sent letters unto all the Jews that were in all the provinces of the king Ahasuerus, both nigh and far,
    translation: JPS 1917
    original: וַיִּכְתֹּב מָרְדֳּכַי אֶת־הַדְּבָרִים הָאֵלֶּה וַיִּשְׁלַח סְפָרִים אֶל־כָּל־הַיְּהוּדִים אֲשֶׁר בְּכָל־מְדִינוֹת הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ הַקְּרוֹבִים וְהָרְחוֹקִים׃
    hebrewPlain: ויכתב מרדכי את הדברים האלה וישלח ספרים אל כל היהודים אשר בכל מדינות המלך אחשורוש הקרובים והרחוקים
    kjvRefs:
    - Esther 9:20
    kjvOsis:
    - Esth.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.21
    scripture: tanakh
    name: Tanakh Esther 9:21
    ref: Esther 9:21
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 21
    ordinal: 20385
    text: to enjoin them that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,
    translation: JPS 1917
    original: לְקַיֵּם עֲלֵיהֶם לִהְיוֹת עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר וְאֵת יוֹם־חֲמִשָּׁה עָשָׂר בּוֹ בְּכָל־שָׁנָה וְשָׁנָה׃
    hebrewPlain: לקים עליהם להיות עשים את יום ארבעה עשר לחדש אדר ואת יום חמשה עשר בו בכל שנה ושנה
    kjvRefs:
    - Esther 9:21
    kjvOsis:
    - Esth.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.22
    scripture: tanakh
    name: Tanakh Esther 9:22
    ref: Esther 9:22
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 22
    ordinal: 20386
    text: the days wherein the Jews had rest from their enemies, and the month which was turned unto them from sorrow to gladness, and from mourning into a good day; that they should make them days of feasting and gladness, and of sending portions one to another, and gifts to the poor.
    translation: JPS 1917
    original: כַּיָּמִים אֲשֶׁר־נָחוּ בָהֶם הַיְּהוּדִים מֵאוֹיְבֵיהֶם וְהַחֹדֶשׁ אֲשֶׁר נֶהְפַּךְ לָהֶם מִיָּגוֹן לְשִׂמְחָה וּמֵאֵבֶל לְיוֹם טוֹב לַעֲשׂוֹת אוֹתָם יְמֵי מִשְׁתֶּה וְשִׂמְחָה וּמִשְׁלוֹחַ מָנוֹת אִישׁ לְרֵעֵהוּ וּמַתָּנוֹת לָאֶבְיוֹנִים׃
    hebrewPlain: כימים אשר נחו בהם היהודים מאויביהם והחדש אשר נהפך להם מיגון לשמחה ומאבל ליום טוב לעשות אותם ימי משתה ושמחה ומשלוח מנות איש לרעהו ומתנות לאביונים
    kjvRefs:
    - Esther 9:22
    kjvOsis:
    - Esth.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.23
    scripture: tanakh
    name: Tanakh Esther 9:23
    ref: Esther 9:23
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 23
    ordinal: 20387
    text: And the Jews took upon them to do as they had begun, and as Mordecai had written unto them;
    translation: JPS 1917
    original: וְקִבֵּל הַיְּהוּדִים אֵת אֲשֶׁר־הֵחֵלּוּ לַעֲשׂוֹת וְאֵת אֲשֶׁר־כָּתַב מָרְדֳּכַי אֲלֵיהֶם׃
    hebrewPlain: וקבל היהודים את אשר החלו לעשות ואת אשר כתב מרדכי אליהם
    kjvRefs:
    - Esther 9:23
    kjvOsis:
    - Esth.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.24
    scripture: tanakh
    name: Tanakh Esther 9:24
    ref: Esther 9:24
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 24
    ordinal: 20388
    text: because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast pur, that is, the lot, to discomfit them, and to destroy them;
    translation: JPS 1917
    original: כִּי הָמָן בֶּן־הַמְּדָתָא הָאֲגָגִי צֹרֵר כָּל־הַיְּהוּדִים חָשַׁב עַל־הַיְּהוּדִים לְאַבְּדָם וְהִפִּיל פּוּר הוּא הַגּוֹרָל לְהֻמָּם וּלְאַבְּדָם׃
    hebrewPlain: כי המן בן המדתא האגגי צרר כל היהודים חשב על היהודים לאבדם והפיל פור הוא הגורל להמם ולאבדם
    kjvRefs:
    - Esther 9:24
    kjvOsis:
    - Esth.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.25
    scripture: tanakh
    name: Tanakh Esther 9:25
    ref: Esther 9:25
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 25
    ordinal: 20389
    text: but when ashe came before the king, he commanded by letters that his wicked device, which he had devised against the Jews, should return upon his own head; and that he and his sons should be hanged on the gallows.
    translation: JPS 1917
    original: וּבְבֹאָהּ לִפְנֵי הַמֶּלֶךְ אָמַר עִם־הַסֵּפֶר יָשׁוּב מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר־חָשַׁב עַל־הַיְּהוּדִים עַל־רֹאשׁוֹ וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל־הָעֵץ׃
    hebrewPlain: ובבאה לפני המלך אמר עם הספר ישוב מחשבתו הרעה אשר חשב על היהודים על ראשו ותלו אתו ואת בניו על העץ
    kjvRefs:
    - Esther 9:25
    kjvOsis:
    - Esth.9.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.26
    scripture: tanakh
    name: Tanakh Esther 9:26
    ref: Esther 9:26
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 26
    ordinal: 20390
    text: Wherefore they called these days Purim, after the name of pur. Therefore because of all the words of this letter, and of that which they had seen concerning this matter, and that which had come unto them,
    translation: JPS 1917
    original: עַל־כֵּן קָרְאוּ לַיָּמִים הָאֵלֶּה פוּרִים עַל־שֵׁם הַפּוּר עַל־כֵּן עַל־כָּל־דִּבְרֵי הָאִגֶּרֶת הַזֹּאת וּמָה־רָאוּ עַל־כָּכָה וּמָה הִגִּיעַ אֲלֵיהֶם׃
    hebrewPlain: על כן קראו לימים האלה פורים על שם הפור על כן על כל דברי האגרת הזאת ומה ראו על ככה ומה הגיע אליהם
    kjvRefs:
    - Esther 9:26
    kjvOsis:
    - Esth.9.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.27
    scripture: tanakh
    name: Tanakh Esther 9:27
    ref: Esther 9:27
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 27
    ordinal: 20391
    text: the Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so as it should not fail, that they would keep these two days according to the writing thereof, and according to the appointed time thereof, every year;
    translation: JPS 1917
    original: קִיְּמוּ וקבל [וְקִבְּלוּ] הַיְּהוּדִים עֲלֵיהֶם וְעַל־זַרְעָם וְעַל כָּל־הַנִּלְוִים עֲלֵיהֶם וְלֹא יַעֲבוֹר לִהְיוֹת עֹשִׂים אֵת שְׁנֵי הַיָּמִים הָאֵלֶּה כִּכְתָבָם וְכִזְמַנָּם בְּכָל־שָׁנָה וְשָׁנָה׃
    hebrewPlain: קימו וקבל [וקבלו] היהודים עליהם ועל זרעם ועל כל הנלוים עליהם ולא יעבור להיות עשים את שני הימים האלה ככתבם וכזמנם בכל שנה ושנה
    kjvRefs:
    - Esther 9:27
    kjvOsis:
    - Esth.9.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.28
    scripture: tanakh
    name: Tanakh Esther 9:28
    ref: Esther 9:28
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 28
    ordinal: 20392
    text: and that these days should be remembered and kept throughout every generation, every family, every province, and every city; and that these days of Purim should not fail from among the Jews, nor the memorial of them perish from their seed.
    translation: JPS 1917
    original: וְהַיָּמִים הָאֵלֶּה נִזְכָּרִים וְנַעֲשִׂים בְּכָל־דּוֹר וָדוֹר מִשְׁפָּחָה וּמִשְׁפָּחָה מְדִינָה וּמְדִינָה וְעִיר וָעִיר וִימֵי הַפּוּרִים הָאֵלֶּה לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים וְזִכְרָם לֹא־יָסוּף מִזַּרְעָם׃
    hebrewPlain: והימים האלה נזכרים ונעשים בכל דור ודור משפחה ומשפחה מדינה ומדינה ועיר ועיר וימי הפורים האלה לא יעברו מתוך היהודים וזכרם לא יסוף מזרעם
    kjvRefs:
    - Esther 9:28
    kjvOsis:
    - Esth.9.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.29
    scripture: tanakh
    name: Tanakh Esther 9:29
    ref: Esther 9:29
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 29
    ordinal: 20393
    text: Then Esther the queen, the daughter of Abihail, and Mordecai the Jew, wrote down all the acts of power, to confirm this second letter of Purim.
    translation: JPS 1917
    original: וַתִּכְתֹּב אֶסְתֵּר הַמַּלְכָּה בַת־אֲבִיחַיִל וּמָרְדֳּכַי הַיְּהוּדִי אֶת־כָּל־תֹּקֶף לְקַיֵּם אֵת אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית׃
    hebrewPlain: ותכתב אסתר המלכה בת אביחיל ומרדכי היהודי את כל תקף לקים את אגרת הפורים הזאת השנית
    kjvRefs:
    - Esther 9:29
    kjvOsis:
    - Esth.9.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.30
    scripture: tanakh
    name: Tanakh Esther 9:30
    ref: Esther 9:30
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 30
    ordinal: 20394
    text: And he sent letters unto all the Jews, to the hundred twenty and seven provinces of the kingdom of Ahasuerus, with words of peace and truth,
    translation: JPS 1917
    original: וַיִּשְׁלַח סְפָרִים אֶל־כָּל־הַיְּהוּדִים אֶל־שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה מַלְכוּת אֲחַשְׁוֵרוֹשׁ דִּבְרֵי שָׁלוֹם וֶאֱמֶת׃
    hebrewPlain: וישלח ספרים אל כל היהודים אל שבע ועשרים ומאה מדינה מלכות אחשורוש דברי שלום ואמת
    kjvRefs:
    - Esther 9:30
    kjvOsis:
    - Esth.9.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.31
    scripture: tanakh
    name: Tanakh Esther 9:31
    ref: Esther 9:31
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 31
    ordinal: 20395
    text: to confirm these days of Purim in their appointed times, according as Mordecai the Jew and Esther the queen had enjoined them, and as they had ordained for themselves and for their seed, the matters of the fastings and their cry.
    translation: JPS 1917
    original: לְקַיֵּם אֵת־יְמֵי הַפֻּרִים הָאֵלֶּה בִּזְמַנֵּיהֶם כַּאֲשֶׁר קִיַּם עֲלֵיהֶם מָרְדֳּכַי הַיְּהוּדִי וְאֶסְתֵּר הַמַּלְכָּה וְכַאֲשֶׁר קִיְּמוּ עַל־נַפְשָׁם וְעַל־זַרְעָם דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם׃
    hebrewPlain: לקים את ימי הפרים האלה בזמניהם כאשר קים עליהם מרדכי היהודי ואסתר המלכה וכאשר קימו על נפשם ועל זרעם דברי הצמות וזעקתם
    kjvRefs:
    - Esther 9:31
    kjvOsis:
    - Esth.9.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.9.32
    scripture: tanakh
    name: Tanakh Esther 9:32
    ref: Esther 9:32
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 32
    ordinal: 20396
    text: And the commandment of Esther confirmed these matters of Purim; and it was written in the book.
    translation: JPS 1917
    original: וּמַאֲמַר אֶסְתֵּר קִיַּם דִּבְרֵי הַפֻּרִים הָאֵלֶּה וְנִכְתָּב בַּסֵּפֶר׃
    hebrewPlain: ומאמר אסתר קים דברי הפרים האלה ונכתב בספר
    kjvRefs:
    - Esther 9:32
    kjvOsis:
    - Esth.9.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.9
- type: TanakhVerse
  data:
    osis: Esth.10.1
    scripture: tanakh
    name: Tanakh Esther 10:1
    ref: Esther 10:1
    book: Esth
    section: ketuvim
    chapter: 10
    verse: 1
    ordinal: 20397
    text: And the king Ahasuerus laid a tribute upon the land, and upon the isles of the sea.
    translation: JPS 1917
    original: וַיָּשֶׂם הַמֶּלֶךְ אחשרש [אֲחַשְׁוֵרוֹשׁ ] מַס עַל־הָאָרֶץ וְאִיֵּי הַיָּם׃
    hebrewPlain: וישם המלך אחשרש [אחשורוש ] מס על הארץ ואיי הים
    kjvRefs:
    - Esther 10:1
    kjvOsis:
    - Esth.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.10
- type: TanakhVerse
  data:
    osis: Esth.10.2
    scripture: tanakh
    name: Tanakh Esther 10:2
    ref: Esther 10:2
    book: Esth
    section: ketuvim
    chapter: 10
    verse: 2
    ordinal: 20398
    text: And all the acts of his power and of his might, and the full account of the greatness of Mordecai, how the king advanced him, are they not written in the book of the chronicles of the kings of Media and Persia?
    translation: JPS 1917
    original: וְכָל־מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ וּפָרָשַׁת גְּדֻלַּת מָרְדֳּכַי אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ הֲלוֹא־הֵם כְּתוּבִים עַל־סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי מָדַי וּפָרָס׃
    hebrewPlain: וכל מעשה תקפו וגבורתו ופרשת גדלת מרדכי אשר גדלו המלך הלוא הם כתובים על ספר דברי הימים למלכי מדי ופרס
    kjvRefs:
    - Esther 10:2
    kjvOsis:
    - Esth.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.10
- type: TanakhVerse
  data:
    osis: Esth.10.3
    scripture: tanakh
    name: Tanakh Esther 10:3
    ref: Esther 10:3
    book: Esth
    section: ketuvim
    chapter: 10
    verse: 3
    ordinal: 20399
    text: For Mordecai the Jew was next unto king Ahasuerus, and great among the Jews, and accepted of the multitude of his brethren; seeking the good of his people and speaking peace to all his seed.
    translation: JPS 1917
    original: כִּי מָרְדֳּכַי הַיְּהוּדִי מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ וְגָדוֹל לַיְּהוּדִים וְרָצוּי לְרֹב אֶחָיו דֹּרֵשׁ טוֹב לְעַמּוֹ וְדֹבֵר שָׁלוֹם לְכָל־זַרְעוֹ׃
    hebrewPlain: כי מרדכי היהודי משנה למלך אחשורוש וגדול ליהודים ורצוי לרב אחיו דרש טוב לעמו ודבר שלום לכל זרעו
    kjvRefs:
    - Esther 10:3
    kjvOsis:
    - Esth.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.10
