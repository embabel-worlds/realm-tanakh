  data:
    osis: Esth.1.10
    scripture: tanakh
    name: Tanakh Esther 1:10
    ref: Esther 1:10
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 10
    ordinal: 20242
    text: On the seventh day, when the heart of the king was merry with wine, he commanded Mehuman, Bizzetha, Harbona, Bigtha, and Abagtha, Zethar, and Carcas, the seven chamberlains that ministered in the presence of Ahasuerus the king,
    translation: JPS 1917
    original: בַּיּוֹם הַשְּׁבִיעִי כְּטוֹב לֵב־הַמֶּלֶךְ בַּיָּיִן אָמַר לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס שִׁבְעַת הַסָּרִיסִים הַמְשָׁרְתִים אֶת־פְּנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ׃
    hebrewPlain: ביום השביעי כטוב לב המלך ביין אמר למהומן בזתא חרבונא בגתא ואבגתא זתר וכרכס שבעת הסריסים המשרתים את פני המלך אחשורוש
    kjvRefs:
    - Esther 1:10
    kjvOsis:
    - Esth.1.10
