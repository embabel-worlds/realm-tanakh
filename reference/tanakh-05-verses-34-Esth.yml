- type: TanakhVerse
  data:
    osis: Esth.4.2
    scripture: tanakh
    name: Tanakh Esther 4:2
    ref: Esther 4:2
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 2
    ordinal: 20294
    text: and he came even before the king’s gate; for none might enter within the king’s gate clothed with sackcloth.
    translation: JPS 1917
    original: וַיָּבוֹא עַד לִפְנֵי שַׁעַר־הַמֶּלֶךְ כִּי אֵין לָבוֹא אֶל־שַׁעַר הַמֶּלֶךְ בִּלְבוּשׁ שָׂק׃
    hebrewPlain: ויבוא עד לפני שער המלך כי אין לבוא אל שער המלך בלבוש שק
    kjvRefs:
    - Esther 4:2
    kjvOsis:
    - Esth.4.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.3
    scripture: tanakh
    name: Tanakh Esther 4:3
    ref: Esther 4:3
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 3
    ordinal: 20295
    text: And in every province, whithersoever the king’s commandment and his decree came, there was great mourning among the Jews, and fasting, and weeping, and wailing; and many lay in sackcloth and ashes.
    translation: JPS 1917
    original: וּבְכָל־מְדִינָה וּמְדִינָה מְקוֹם אֲשֶׁר דְּבַר־הַמֶּלֶךְ וְדָתוֹ מַגִּיעַ אֵבֶל גָּדוֹל לַיְּהוּדִים וְצוֹם וּבְכִי וּמִסְפֵּד שַׂק וָאֵפֶר יֻצַּע לָרַבִּים׃
    hebrewPlain: ובכל מדינה ומדינה מקום אשר דבר המלך ודתו מגיע אבל גדול ליהודים וצום ובכי ומספד שק ואפר יצע לרבים
    kjvRefs:
    - Esther 4:3
    kjvOsis:
    - Esth.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.4
    scripture: tanakh
    name: Tanakh Esther 4:4
    ref: Esther 4:4
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 4
    ordinal: 20296
    text: And Esther’s maidens and her chamberlains came and told it her; and the queen was exceedingly pained; and she sent raiment to clothe Mordecai; and to take his sackcloth from off him; but he accepted it not.
    translation: JPS 1917
    original: וַתָּבוֹאינָה נַעֲרוֹת אֶסְתֵּר וְסָרִיסֶיהָ וַיַּגִּידוּ לָהּ וַתִּתְחַלְחַל הַמַּלְכָּה מְאֹד וַתִּשְׁלַח בְּגָדִים לְהַלְבִּישׁ אֶת־מָרְדֳּכַי וּלְהָסִיר שַׂקּוֹ מֵעָלָיו וְלֹא קִבֵּל׃
    hebrewPlain: ותבואינה נערות אסתר וסריסיה ויגידו לה ותתחלחל המלכה מאד ותשלח בגדים להלביש את מרדכי ולהסיר שקו מעליו ולא קבל
    kjvRefs:
    - Esther 4:4
    kjvOsis:
    - Esth.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.5
    scripture: tanakh
    name: Tanakh Esther 4:5
    ref: Esther 4:5
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 5
    ordinal: 20297
    text: Then called Esther for Hathach, one of the king’s chamberlains, whom he had appointed to attend upon her, and charged him to go to Mordecai, to know what this was, and why it was.
    translation: JPS 1917
    original: וַתִּקְרָא אֶסְתֵּר לַהֲתָךְ מִסָּרִיסֵי הַמֶּלֶךְ אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ וַתְּצַוֵּהוּ עַל־מָרְדֳּכָי לָדַעַת מַה־זֶּה וְעַל־מַה־זֶּה׃
    hebrewPlain: ותקרא אסתר להתך מסריסי המלך אשר העמיד לפניה ותצוהו על מרדכי לדעת מה זה ועל מה זה
    kjvRefs:
    - Esther 4:5
    kjvOsis:
    - Esth.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.6
    scripture: tanakh
    name: Tanakh Esther 4:6
    ref: Esther 4:6
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 6
    ordinal: 20298
    text: So Hathach went forth to Mordecai unto the broad place of the city, which was before the king’s gate.
    translation: JPS 1917
    original: וַיֵּצֵא הֲתָךְ אֶל־מָרְדֳּכָי אֶל־רְחוֹב הָעִיר אֲשֶׁר לִפְנֵי שַׁעַר־הַמֶּלֶךְ׃
    hebrewPlain: ויצא התך אל מרדכי אל רחוב העיר אשר לפני שער המלך
    kjvRefs:
    - Esther 4:6
    kjvOsis:
    - Esth.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.7
    scripture: tanakh
    name: Tanakh Esther 4:7
    ref: Esther 4:7
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 7
    ordinal: 20299
    text: And Mordecai told him of all that had happened unto him, and the exact sum of the money that Haman had promised to pay to the king’s treasuries for the Jews, to destroy them.
    translation: JPS 1917
    original: וַיַּגֶּד־לוֹ מָרְדֳּכַי אֵת כָּל־אֲשֶׁר קָרָהוּ וְאֵת פָּרָשַׁת הַכֶּסֶף אֲשֶׁר אָמַר הָמָן לִשְׁקוֹל עַל־גִּנְזֵי הַמֶּלֶךְ ביהודיים [בַּיְּהוּדִים] לְאַבְּדָם׃
    hebrewPlain: ויגד לו מרדכי את כל אשר קרהו ואת פרשת הכסף אשר אמר המן לשקול על גנזי המלך ביהודיים [ביהודים] לאבדם
    kjvRefs:
    - Esther 4:7
    kjvOsis:
    - Esth.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.8
    scripture: tanakh
    name: Tanakh Esther 4:8
    ref: Esther 4:8
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 8
    ordinal: 20300
    text: Also he gave him the copy of the writing of the decree that was given out in Shushan to destroy them, to show it unto Esther, and to declare it unto her; and to charge her that she should go in unto the king, to make supplication unto him, and to make request before him, for her people.
    translation: JPS 1917
    original: וְאֶת־פַּתְשֶׁגֶן כְּתָב־הַדָּת אֲשֶׁר־נִתַּן בְּשׁוּשָׁן לְהַשְׁמִידָם נָתַן לוֹ לְהַרְאוֹת אֶת־אֶסְתֵּר וּלְהַגִּיד לָהּ וּלְצַוּוֹת עָלֶיהָ לָבוֹא אֶל־הַמֶּלֶךְ לְהִתְחַנֶּן־לוֹ וּלְבַקֵּשׁ מִלְּפָנָיו עַל־עַמָּהּ׃
    hebrewPlain: ואת פתשגן כתב הדת אשר נתן בשושן להשמידם נתן לו להראות את אסתר ולהגיד לה ולצוות עליה לבוא אל המלך להתחנן לו ולבקש מלפניו על עמה
    kjvRefs:
    - Esther 4:8
    kjvOsis:
    - Esth.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.9
    scripture: tanakh
    name: Tanakh Esther 4:9
    ref: Esther 4:9
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 9
    ordinal: 20301
    text: And Hathach came and told Esther the words of Mordecai.
    translation: JPS 1917
    original: וַיָּבוֹא הֲתָךְ וַיַּגֵּד לְאֶסְתֵּר אֵת דִּבְרֵי מָרְדֳּכָי׃
    hebrewPlain: ויבוא התך ויגד לאסתר את דברי מרדכי
    kjvRefs:
    - Esther 4:9
    kjvOsis:
    - Esth.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.10
    scripture: tanakh
    name: Tanakh Esther 4:10
    ref: Esther 4:10
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 10
    ordinal: 20302
    text: 'Then Esther spoke unto Hathach, and gave him a message unto Mordecai:'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶסְתֵּר לַהֲתָךְ וַתְּצַוֵּהוּ אֶל־מָרְדֳּכָי׃
    hebrewPlain: ותאמר אסתר להתך ותצוהו אל מרדכי
    kjvRefs:
    - Esther 4:10
    kjvOsis:
    - Esth.4.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.11
    scripture: tanakh
    name: Tanakh Esther 4:11
    ref: Esther 4:11
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 11
    ordinal: 20303
    text: ’All the king’s servants, and the people of the king’s provinces, do know, that whosoever, whether man or woman, shall come unto the king into the inner court, who is not called, there is one law for him, that he be put to death, except such to whom the king shall hold out the golden sceptre, that he may live; but I have not been called to come in unto the king these thirty days.’
    translation: JPS 1917
    original: כָּל־עַבְדֵי הַמֶּלֶךְ וְעַם־מְדִינוֹת הַמֶּלֶךְ יוֹדְעִים אֲשֶׁר כָּל־אִישׁ וְאִשָּׁה אֲשֶׁר יָבוֹא־אֶל־הַמֶּלֶךְ אֶל־הֶחָצֵר הַפְּנִימִית אֲשֶׁר לֹא־יִקָּרֵא אַחַת דָּתוֹ לְהָמִית לְבַד מֵאֲשֶׁר יוֹשִׁיט־לוֹ הַמֶּלֶךְ אֶת־שַׁרְבִיט הַזָּהָב וְחָיָה וַאֲנִי לֹא נִקְרֵאתי לָבוֹא אֶל־הַמֶּלֶךְ זֶה שְׁלוֹשִׁים יוֹם׃
    hebrewPlain: כל עבדי המלך ועם מדינות המלך יודעים אשר כל איש ואשה אשר יבוא אל המלך אל החצר הפנימית אשר לא יקרא אחת דתו להמית לבד מאשר יושיט לו המלך את שרביט הזהב וחיה ואני לא נקראתי לבוא אל המלך זה שלושים יום
    kjvRefs:
    - Esther 4:11
    kjvOsis:
    - Esth.4.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.12
    scripture: tanakh
    name: Tanakh Esther 4:12
    ref: Esther 4:12
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 12
    ordinal: 20304
    text: And they told to Mordecai Esther’s words.
    translation: JPS 1917
    original: וַיַּגִּידוּ לְמָרְדֳּכָי אֵת דִּבְרֵי אֶסְתֵּר׃
    hebrewPlain: ויגידו למרדכי את דברי אסתר
    kjvRefs:
    - Esther 4:12
    kjvOsis:
    - Esth.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.13
    scripture: tanakh
    name: Tanakh Esther 4:13
    ref: Esther 4:13
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 13
    ordinal: 20305
    text: 'Then Mordecai bade them to return answer unto Esther: ‘Think not with thyself that thou shalt escape in the king’s house, more than all the Jews.'
    translation: JPS 1917
    original: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר אַל־תְּדַמִּי בְנַפְשֵׁךְ לְהִמָּלֵט בֵּית־הַמֶּלֶךְ מִכָּל־הַיְּהוּדִים׃
    hebrewPlain: ויאמר מרדכי להשיב אל אסתר אל תדמי בנפשך להמלט בית המלך מכל היהודים
    kjvRefs:
    - Esther 4:13
    kjvOsis:
    - Esth.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.14
    scripture: tanakh
    name: Tanakh Esther 4:14
    ref: Esther 4:14
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 14
    ordinal: 20306
    text: For if thou altogether holdest thy peace at this time, then will relief and deliverance arise to the Jews from another place, but thou and thy father’s house will perish; and who knoweth whether thou art not come to royal estate for such a time as this?’
    translation: JPS 1917
    original: כִּי אִם־הַחֲרֵשׁ תַּחֲרִישִׁי בָּעֵת הַזֹּאת רֶוַח וְהַצָּלָה יַעֲמוֹד לַיְּהוּדִים מִמָּקוֹם אַחֵר וְאַתְּ וּבֵית־אָבִיךְ תֹּאבֵדוּ וּמִי יוֹדֵעַ אִם־לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת׃
    hebrewPlain: כי אם החרש תחרישי בעת הזאת רוח והצלה יעמוד ליהודים ממקום אחר ואת ובית אביך תאבדו ומי יודע אם לעת כזאת הגעת למלכות
    kjvRefs:
    - Esther 4:14
    kjvOsis:
    - Esth.4.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.15
    scripture: tanakh
    name: Tanakh Esther 4:15
    ref: Esther 4:15
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 15
    ordinal: 20307
    text: 'Then Esther bade them return answer unto Mordecai:'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶסְתֵּר לְהָשִׁיב אֶל־מָרְדֳּכָי׃
    hebrewPlain: ותאמר אסתר להשיב אל מרדכי
    kjvRefs:
    - Esther 4:15
    kjvOsis:
    - Esth.4.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.16
    scripture: tanakh
    name: Tanakh Esther 4:16
    ref: Esther 4:16
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 16
    ordinal: 20308
    text: ’Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day; I also and my maidens will fast in like manner; and so will I go in unto the king, which is not according to the law; and if I perish, I perish.’
    translation: JPS 1917
    original: לֵךְ כְּנוֹס אֶת־כָּל־הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן וְצוּמוּ עָלַי וְאַל־תֹּאכְלוּ וְאַל־תִּשְׁתּוּ שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם גַּם־אֲנִי וְנַעֲרֹתַי אָצוּם כֵּן וּבְכֵן אָבוֹא אֶל־הַמֶּלֶךְ אֲשֶׁר לֹא־כַדָּת וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי׃
    hebrewPlain: לך כנוס את כל היהודים הנמצאים בשושן וצומו עלי ואל תאכלו ואל תשתו שלשת ימים לילה ויום גם אני ונערתי אצום כן ובכן אבוא אל המלך אשר לא כדת וכאשר אבדתי אבדתי
    kjvRefs:
    - Esther 4:16
    kjvOsis:
    - Esth.4.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.4.17
    scripture: tanakh
    name: Tanakh Esther 4:17
    ref: Esther 4:17
    book: Esth
    section: ketuvim
    chapter: 4
    verse: 17
    ordinal: 20309
    text: So Mordecai went his way, and did according to all that Esther had commanded him.
    translation: JPS 1917
    original: וַיַּעֲבֹר מָרְדֳּכָי וַיַּעַשׂ כְּכֹל אֲשֶׁר־צִוְּתָה עָלָיו אֶסְתֵּר׃
    hebrewPlain: ויעבר מרדכי ויעש ככל אשר צותה עליו אסתר
    kjvRefs:
    - Esther 4:17
    kjvOsis:
    - Esth.4.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.4
- type: TanakhVerse
  data:
    osis: Esth.5.1
    scripture: tanakh
    name: Tanakh Esther 5:1
    ref: Esther 5:1
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 1
    ordinal: 20310
    text: Now it came to pass on the third day, that Esther put on her royal apparel, and stood in the inner court of the king’s house, over against the king’s house; and the king sat upon his royal throne in the royal house, over against the entrance of the house.
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת וַתַּעֲמֹד בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית נֹכַח בֵּית הַמֶּלֶךְ וְהַמֶּלֶךְ יוֹשֵׁב עַל־כִּסֵּא מַלְכוּתוֹ בְּבֵית הַמַּלְכוּת נֹכַח פֶּתַח הַבָּיִת׃
    hebrewPlain: ויהי ביום השלישי ותלבש אסתר מלכות ותעמד בחצר בית המלך הפנימית נכח בית המלך והמלך יושב על כסא מלכותו בבית המלכות נכח פתח הבית
    kjvRefs:
    - Esther 5:1
    kjvOsis:
    - Esth.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.2
    scripture: tanakh
    name: Tanakh Esther 5:2
    ref: Esther 5:2
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 2
    ordinal: 20311
    text: And it was so, when the king saw Esther the queen standing in the court, that she obtained favour in his sight; and the king held out to Esther the golden sceptre that was in his hand. So Esther drew near, and touched the top of the sceptre.
    translation: JPS 1917
    original: וַיְהִי כִרְאוֹת הַמֶּלֶךְ אֶת־אֶסְתֵּר הַמַּלְכָּה עֹמֶדֶת בֶּחָצֵר נָשְׂאָה חֵן בְּעֵינָיו וַיּוֹשֶׁט הַמֶּלֶךְ לְאֶסְתֵּר אֶת־שַׁרְבִיט הַזָּהָב אֲשֶׁר בְּיָדוֹ וַתִּקְרַב אֶסְתֵּר וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט׃
    hebrewPlain: ויהי כראות המלך את אסתר המלכה עמדת בחצר נשאה חן בעיניו ויושט המלך לאסתר את שרביט הזהב אשר בידו ותקרב אסתר ותגע בראש השרביט
    kjvRefs:
    - Esther 5:2
    kjvOsis:
    - Esth.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.3
    scripture: tanakh
    name: Tanakh Esther 5:3
    ref: Esther 5:3
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 3
    ordinal: 20312
    text: 'Then said the king unto her: ‘What wilt thou, queen Esther? for whatever thy request, even to the half of the kingdom, it shall be given thee.’'
    translation: JPS 1917
    original: וַיֹּאמֶר לָהּ הַמֶּלֶךְ מַה־לָּךְ אֶסְתֵּר הַמַּלְכָּה וּמַה־בַּקָּשָׁתֵךְ עַד־חֲצִי הַמַּלְכוּת וְיִנָּתֵן לָךְ׃
    hebrewPlain: ויאמר לה המלך מה לך אסתר המלכה ומה בקשתך עד חצי המלכות וינתן לך
    kjvRefs:
    - Esther 5:3
    kjvOsis:
    - Esth.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.4
    scripture: tanakh
    name: Tanakh Esther 5:4
    ref: Esther 5:4
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 4
    ordinal: 20313
    text: 'And Esther said: ‘If it seem good unto the king, let the king and Haman come this day unto the banquet that I have prepared for him.’'
    translation: JPS 1917
    original: וַתֹּאמֶר אֶסְתֵּר אִם־עַל־הַמֶּלֶךְ טוֹב יָבוֹא הַמֶּלֶךְ וְהָמָן הַיּוֹם אֶל־הַמִּשְׁתֶּה אֲשֶׁר־עָשִׂיתִי לוֹ׃
    hebrewPlain: ותאמר אסתר אם על המלך טוב יבוא המלך והמן היום אל המשתה אשר עשיתי לו
    kjvRefs:
    - Esther 5:4
    kjvOsis:
    - Esth.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.5
    scripture: tanakh
    name: Tanakh Esther 5:5
    ref: Esther 5:5
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 5
    ordinal: 20314
    text: 'Then the king said: ‘Cause Haman to make haste, that it may be done as Esther hath said.’ So the king and Haman came to the banquet that Esther had prepared.'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ מַהֲרוּ אֶת־הָמָן לַעֲשׂוֹת אֶת־דְּבַר אֶסְתֵּר וַיָּבֹא הַמֶּלֶךְ וְהָמָן אֶל־הַמִּשְׁתֶּה אֲשֶׁר־עָשְׂתָה אֶסְתֵּר׃
    hebrewPlain: ויאמר המלך מהרו את המן לעשות את דבר אסתר ויבא המלך והמן אל המשתה אשר עשתה אסתר
    kjvRefs:
    - Esther 5:5
    kjvOsis:
    - Esth.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.6
    scripture: tanakh
    name: Tanakh Esther 5:6
    ref: Esther 5:6
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 6
    ordinal: 20315
    text: 'And the king said unto Esther at the banquet of wine: ‘Whatever thy petition, it shall be granted thee; and whatever thy request, even to the half of the kingdom, it shall be performed.’'
    translation: JPS 1917
    original: וַיֹּאמֶר הַמֶּלֶךְ לְאֶסְתֵּר בְּמִשְׁתֵּה הַיַּיִן מַה־שְּׁאֵלָתֵךְ וְיִנָּתֵן לָךְ וּמַה־בַּקָּשָׁתֵךְ עַד־חֲצִי הַמַּלְכוּת וְתֵעָשׂ׃
    hebrewPlain: ויאמר המלך לאסתר במשתה היין מה שאלתך וינתן לך ומה בקשתך עד חצי המלכות ותעש
    kjvRefs:
    - Esther 5:6
    kjvOsis:
    - Esth.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.7
    scripture: tanakh
    name: Tanakh Esther 5:7
    ref: Esther 5:7
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 7
    ordinal: 20316
    text: 'Then answered Esther, and said: ‘My petition and my request is—'
    translation: JPS 1917
    original: וַתַּעַן אֶסְתֵּר וַתֹּאמַר שְׁאֵלָתִי וּבַקָּשָׁתִי׃
    hebrewPlain: ותען אסתר ותאמר שאלתי ובקשתי
    kjvRefs:
    - Esther 5:7
    kjvOsis:
    - Esth.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.8
    scripture: tanakh
    name: Tanakh Esther 5:8
    ref: Esther 5:8
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 8
    ordinal: 20317
    text: if I have found favour in the sight of the king, and if it please the king to grant my petition, and to perform my request—let the king and Haman come to the banquet that I shall prepare for them, and I will do to-morrow as the king hath said.’
    translation: JPS 1917
    original: אִם־מָצָאתִי חֵן בְּעֵינֵי הַמֶּלֶךְ וְאִם־עַל־הַמֶּלֶךְ טוֹב לָתֵת אֶת־שְׁאֵלָתִי וְלַעֲשׂוֹת אֶת־בַּקָּשָׁתִי יָבוֹא הַמֶּלֶךְ וְהָמָן אֶל־הַמִּשְׁתֶּה אֲשֶׁר אֶעֱשֶׂה לָהֶם וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ׃
    hebrewPlain: אם מצאתי חן בעיני המלך ואם על המלך טוב לתת את שאלתי ולעשות את בקשתי יבוא המלך והמן אל המשתה אשר אעשה להם ומחר אעשה כדבר המלך
    kjvRefs:
    - Esther 5:8
    kjvOsis:
    - Esth.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.9
    scripture: tanakh
    name: Tanakh Esther 5:9
    ref: Esther 5:9
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 9
    ordinal: 20318
    text: Then went Haman forth that day joyful and glad of heart; but when Haman saw Mordecai in the king’s gate, that he stood not up, nor moved for him, Haman was filled with wrath against Mordecai.
    translation: JPS 1917
    original: וַיֵּצֵא הָמָן בַּיּוֹם הַהוּא שָׂמֵחַ וְטוֹב לֵב וְכִרְאוֹת הָמָן אֶת־מָרְדֳּכַי בְּשַׁעַר הַמֶּלֶךְ וְלֹא־קָם וְלֹא־זָע מִמֶּנּוּ וַיִּמָּלֵא הָמָן עַל־מָרְדֳּכַי חֵמָה׃
    hebrewPlain: ויצא המן ביום ההוא שמח וטוב לב וכראות המן את מרדכי בשער המלך ולא קם ולא זע ממנו וימלא המן על מרדכי חמה
    kjvRefs:
    - Esther 5:9
    kjvOsis:
    - Esth.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.10
    scripture: tanakh
    name: Tanakh Esther 5:10
    ref: Esther 5:10
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 10
    ordinal: 20319
    text: Nevertheless Haman refrained himself, and went home; and he sent and fetched his friends and Zeresh his wife.
    translation: JPS 1917
    original: וַיִּתְאַפַּק הָמָן וַיָּבוֹא אֶל־בֵּיתוֹ וַיִּשְׁלַח וַיָּבֵא אֶת־אֹהֲבָיו וְאֶת־זֶרֶשׁ אִשְׁתּוֹ׃
    hebrewPlain: ויתאפק המן ויבוא אל ביתו וישלח ויבא את אהביו ואת זרש אשתו
    kjvRefs:
    - Esther 5:10
    kjvOsis:
    - Esth.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.11
    scripture: tanakh
    name: Tanakh Esther 5:11
    ref: Esther 5:11
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 11
    ordinal: 20320
    text: And Haman recounted unto them the glory of his riches, and the multitude of his children, and everything as to how the king had promoted him, and how he had advanced him above the princes and servants of the king.
    translation: JPS 1917
    original: וַיְסַפֵּר לָהֶם הָמָן אֶת־כְּבוֹד עָשְׁרוֹ וְרֹב בָּנָיו וְאֵת כָּל־אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ וְאֵת אֲשֶׁר נִשְּׂאוֹ עַל־הַשָּׂרִים וְעַבְדֵי הַמֶּלֶךְ׃
    hebrewPlain: ויספר להם המן את כבוד עשרו ורב בניו ואת כל אשר גדלו המלך ואת אשר נשאו על השרים ועבדי המלך
    kjvRefs:
    - Esther 5:11
    kjvOsis:
    - Esth.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.12
    scripture: tanakh
    name: Tanakh Esther 5:12
    ref: Esther 5:12
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 12
    ordinal: 20321
    text: 'Haman said moreover: ‘Yea, Esther the queen did let no man come in with the king unto the banquet that she had prepared but myself; and to-morrow also am I invited by her together with the king.'
    translation: JPS 1917
    original: וַיֹּאמֶר הָמָן אַף לֹא־הֵבִיאָה אֶסְתֵּר הַמַּלְכָּה עִם־הַמֶּלֶךְ אֶל־הַמִּשְׁתֶּה אֲשֶׁר־עָשָׂתָה כִּי אִם־אוֹתִי וְגַם־לְמָחָר אֲנִי קָרוּא־לָהּ עִם־הַמֶּלֶךְ׃
    hebrewPlain: ויאמר המן אף לא הביאה אסתר המלכה עם המלך אל המשתה אשר עשתה כי אם אותי וגם למחר אני קרוא לה עם המלך
    kjvRefs:
    - Esther 5:12
    kjvOsis:
    - Esth.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.13
    scripture: tanakh
    name: Tanakh Esther 5:13
    ref: Esther 5:13
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 13
    ordinal: 20322
    text: Yet all this availeth me nothing, so long as I see Mordecai the Jew sitting at the king’s gate.’
    translation: JPS 1917
    original: וְכָל־זֶה אֵינֶנּוּ שֹׁוֶה לִי בְּכָל־עֵת אֲשֶׁר אֲנִי רֹאֶה אֶת־מָרְדֳּכַי הַיְּהוּדִי יוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ׃
    hebrewPlain: וכל זה איננו שוה לי בכל עת אשר אני ראה את מרדכי היהודי יושב בשער המלך
    kjvRefs:
    - Esther 5:13
    kjvOsis:
    - Esth.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.5.14
    scripture: tanakh
    name: Tanakh Esther 5:14
    ref: Esther 5:14
    book: Esth
    section: ketuvim
    chapter: 5
    verse: 14
    ordinal: 20323
    text: 'Then said Zeresh his wife and all his friends unto him: ‘Let a gallows be made of fifty cubits high, and in the morning speak thou unto the king that Mordecai may be hanged thereon; then go thou in merrily with the king unto the banquet.’ And the thing pleased Haman; and he caused the gallows to be made.'
    translation: JPS 1917
    original: וַתֹּאמֶר לוֹ זֶרֶשׁ אִשְׁתּוֹ וְכָל־אֹהֲבָיו יַעֲשׂוּ־עֵץ גָּבֹהַּ חֲמִשִּׁים אַמָּה וּבַבֹּקֶר אֱמֹר לַמֶּלֶךְ וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו וּבֹא־עִם־הַמֶּלֶךְ אֶל הַמִּשְׁתֶּה שָׂמֵחַ וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן וַיַּעַשׂ הָעֵץ׃
    hebrewPlain: ותאמר לו זרש אשתו וכל אהביו יעשו עץ גבה חמשים אמה ובבקר אמר למלך ויתלו את מרדכי עליו ובא עם המלך אל המשתה שמח וייטב הדבר לפני המן ויעש העץ
    kjvRefs:
    - Esther 5:14
    kjvOsis:
    - Esth.5.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.5
- type: TanakhVerse
  data:
    osis: Esth.6.1
    scripture: tanakh
    name: Tanakh Esther 6:1
    ref: Esther 6:1
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 1
    ordinal: 20324
    text: On that night could not the king sleep; and he commanded to bring the book of records of the chronicles, and they were read before the king.
    translation: JPS 1917
    original: בַּלַּיְלָה הַהוּא נָדְדָה שְׁנַת הַמֶּלֶךְ וַיֹּאמֶר לְהָבִיא אֶת־סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים וַיִּהְיוּ נִקְרָאִים לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: בלילה ההוא נדדה שנת המלך ויאמר להביא את ספר הזכרנות דברי הימים ויהיו נקראים לפני המלך
    kjvRefs:
    - Esther 6:1
    kjvOsis:
    - Esth.6.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Esth.6
- type: TanakhVerse
  data:
    osis: Esth.6.2
    scripture: tanakh
    name: Tanakh Esther 6:2
    ref: Esther 6:2
    book: Esth
    section: ketuvim
    chapter: 6
    verse: 2
    ordinal: 20325
    text: And it was found written, that Mordecai had told of Bigthana and Teresh, two of the king’s chamberlains, of those that kept the door, who had sought to lay hands on the king Ahasuerus.
    translation: JPS 1917
    original: וַיִּמָּצֵא כָתוּב אֲשֶׁר הִגִּיד מָרְדֳּכַי עַל־בִּגְתָנָא וָתֶרֶשׁ שְׁנֵי סָרִיסֵי הַמֶּלֶךְ מִשֹּׁמְרֵי הַסַּף אֲשֶׁר בִּקְשׁוּ לִשְׁלֹחַ יָד בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ׃
    hebrewPlain: וימצא כתוב אשר הגיד מרדכי על בגתנא ותרש שני סריסי המלך משמרי הסף אשר בקשו לשלח יד במלך אחשורוש
    kjvRefs:
    - Esther 6:2
    kjvOsis:
    - Esth.6.2
  relations:
  - predicate: IN
    to:
