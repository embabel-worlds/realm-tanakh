    scripture: tanakh
    name: Tanakh Esther 1:7
    ref: Esther 1:7
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 7
    ordinal: 20239
    text: And they gave them drink in vessels of gold—the vessels being diverse one from another—and royal wine in abundance, according to the bounty of the king.
    translation: JPS 1917
    original: וְהַשְׁקוֹת בִּכְלֵי זָהָב וְכֵלִים מִכֵּלִים שׁוֹנִים וְיֵין מַלְכוּת רָב כְּיַד הַמֶּלֶךְ׃
    hebrewPlain: והשקות בכלי זהב וכלים מכלים שונים ויין מלכות רב כיד המלך
    kjvRefs:
