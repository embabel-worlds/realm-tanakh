- type: TanakhVerse
  data:
    osis: Esth.1.5
    scripture: tanakh
    name: Tanakh Esther 1:5
    ref: Esther 1:5
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 5
    ordinal: 20237
    text: And when these days were fulfilled, the king made a feast unto all the people that were present in Shushan the castle, both great and small, seven days, in the court of the garden of the king’s palace;
    translation: JPS 1917
    original: וּבִמְלוֹאת הַיָּמִים הָאֵלֶּה עָשָׂה הַמֶּלֶךְ לְכָל־הָעָם הַנִּמְצְאִים בְּשׁוּשַׁן הַבִּירָה לְמִגָּדוֹל וְעַד־קָטָן מִשְׁתֶּה שִׁבְעַת יָמִים בַּחֲצַר גִּנַּת בִּיתַן הַמֶּלֶךְ׃
    hebrewPlain: ובמלואת הימים האלה עשה המלך לכל העם הנמצאים בשושן הבירה למגדול ועד קטן משתה שבעת ימים בחצר גנת ביתן המלך
    kjvRefs:
    - Esther 1:5
    kjvOsis:
    - Esth.1.5
