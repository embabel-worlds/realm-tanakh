    name: Tanakh Esther 9:11
    ref: Esther 9:11
    book: Esth
    section: ketuvim
    chapter: 9
    verse: 11
    ordinal: 20375
    text: On that day the number of those that were slain in Shushan the castle was brought before the king.
    translation: JPS 1917
    original: בַּיּוֹם הַהוּא בָּא מִסְפַּר הַהֲרוּגִים בְּשׁוּשַׁן הַבִּירָה לִפְנֵי הַמֶּלֶךְ׃
    hebrewPlain: ביום ההוא בא מספר ההרוגים בשושן הבירה לפני המלך
