    scripture: tanakh
    name: Tanakh Esther 1:6
    ref: Esther 1:6
    book: Esth
    section: ketuvim
    chapter: 1
    verse: 6
    ordinal: 20238
    text: there were hangings of white, fine cotton, and blue, bordered with cords of fine linen and purple, upon silver rods and pillars of marble; the couches were of gold and silver, upon a pavement of green, and white, and shell, and onyx marble.
    translation: JPS 1917
    original: חוּר כַּרְפַּס וּתְכֵלֶת אָחוּז בְּחַבְלֵי־בוּץ וְאַרְגָּמָן עַל־גְּלִילֵי כֶסֶף וְעַמּוּדֵי שֵׁשׁ מִטּוֹת זָהָב וָכֶסֶף עַל רִצְפַת בַּהַט־וָשֵׁשׁ וְדַר וְסֹחָרֶת׃
    hebrewPlain: חור כרפס ותכלת אחוז בחבלי בוץ וארגמן על גלילי כסף ועמודי שש מטות זהב וכסף על רצפת בהט ושש ודר וסחרת
    kjvRefs:
    - Esther 1:6
    kjvOsis:
    - Esth.1.6
