  data:
    osis: Lev.8.23
    scripture: tanakh
    name: Tanakh Leviticus 8:23
    ref: Leviticus 8:23
    book: Lev
    section: torah
    chapter: 8
    verse: 23
    ordinal: 2938
    text: And when it was slain, Moses took of the blood thereof, and put it upon the tip of Aaron’s right ear, and upon the thumb of his right hand, and upon the great toe of his right foot.
    translation: JPS 1917
    original: וַיִּשְׁחָט וַיִּקַּח מֹשֶׁה מִדָּמוֹ וַיִּתֵּן עַל־תְּנוּךְ אֹזֶן־אַהֲרֹן הַיְמָנִית וְעַל־בֹּהֶן יָדוֹ הַיְמָנִית וְעַל־בֹּהֶן רַגְלוֹ הַיְמָנִית׃
    hebrewPlain: וישחט ויקח משה מדמו ויתן על תנוך אזן אהרן הימנית ועל בהן ידו הימנית ועל בהן רגלו הימנית
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:23
    kjvOsis:
    - Lev.8.23
