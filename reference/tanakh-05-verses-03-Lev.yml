      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.27
    scripture: tanakh
    name: Tanakh Leviticus 8:27
    ref: Leviticus 8:27
    book: Lev
    section: torah
    chapter: 8
    verse: 27
    ordinal: 2942
    text: And he put the whole upon the hands of Aaron, and upon the hands of his sons, and waved them for a wave-offering before the LORD.
    translation: JPS 1917
    original: וַיִּתֵּן אֶת־הַכֹּל עַל כַּפֵּי אַהֲרֹן וְעַל כַּפֵּי בָנָיו וַיָּנֶף אֹתָם תְּנוּפָה לִפְנֵי יְהוָה׃
    hebrewPlain: ויתן את הכל על כפי אהרן ועל כפי בניו וינף אתם תנופה לפני יהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:27
    kjvOsis:
    - Lev.8.27
