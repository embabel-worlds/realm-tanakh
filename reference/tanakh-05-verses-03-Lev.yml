- type: TanakhVerse
  data:
    osis: Lev.15.22
    scripture: tanakh
    name: Tanakh Leviticus 15:22
    ref: Leviticus 15:22
    book: Lev
    section: torah
    chapter: 15
    verse: 22
    ordinal: 3188
    text: And whosoever toucheth any thing that she sitteth upon shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־הַנֹּגֵעַ בְּכָל־כְּלִי אֲשֶׁר־תֵּשֵׁב עָלָיו יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל הנגע בכל כלי אשר תשב עליו יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:22
    kjvOsis:
    - Lev.15.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
