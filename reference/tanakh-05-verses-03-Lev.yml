    scripture: tanakh
    name: Tanakh Leviticus 13:38
    ref: Leviticus 13:38
    book: Lev
    section: torah
    chapter: 13
    verse: 38
    ordinal: 3088
    text: And if a man or a woman have in the skin of their flesh bright spots, even white bright spots;
    translation: JPS 1917
    original: וְאִישׁ אוֹ־אִשָּׁה כִּי־יִהְיֶה בְעוֹר־בְּשָׂרָם בֶּהָרֹת בֶּהָרֹת לְבָנֹת׃
    hebrewPlain: ואיש או אשה כי יהיה בעור בשרם בהרת בהרת לבנת
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:38
    kjvOsis:
    - Lev.13.38
