  data:
    osis: Lev.13.46
    scripture: tanakh
    name: Tanakh Leviticus 13:46
    ref: Leviticus 13:46
    book: Lev
    section: torah
    chapter: 13
    verse: 46
    ordinal: 3096
    text: All the days wherein the plague is in him he shall be unclean; he is unclean; he shall dwell alone; without the camp shall his dwelling be.
    translation: JPS 1917
    original: כָּל־יְמֵי אֲשֶׁר הַנֶּגַע בּוֹ יִטְמָא טָמֵא הוּא בָּדָד יֵשֵׁב מִחוּץ לַמַּחֲנֶה מוֹשָׁבוֹ׃
    hebrewPlain: כל ימי אשר הנגע בו יטמא טמא הוא בדד ישב מחוץ למחנה מושבו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:46
    kjvOsis:
    - Lev.13.46
