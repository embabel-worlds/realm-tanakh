    scripture: tanakh
    name: Tanakh Leviticus 11:25
    ref: Leviticus 11:25
    book: Lev
    section: torah
    chapter: 11
    verse: 25
    ordinal: 3020
    text: And whosoever beareth aught of the carcass of them shall wash his clothes, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־הַנֹּשֵׂא מִנִּבְלָתָם יְכַבֵּס בְּגָדָיו וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל הנשא מנבלתם יכבס בגדיו וטמא עד הערב
