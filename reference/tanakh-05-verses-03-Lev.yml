  data:
    osis: Lev.7.18
    scripture: tanakh
    name: Tanakh Leviticus 7:18
    ref: Leviticus 7:18
    book: Lev
    section: torah
    chapter: 7
    verse: 18
    ordinal: 2895
    text: And if any of the flesh of the sacrifice of his peace-offerings be at all eaten on the third day, it shall not be accepted, neither shall it be imputed unto him that offereth it; it shall be an abhorred thing, and the soul that eateth of it shall bear his iniquity.
    translation: JPS 1917
    original: וְאִם הֵאָכֹל יֵאָכֵל מִבְּשַׂר־זֶבַח שְׁלָמָיו בַּיּוֹם הַשְּׁלִישִׁי לֹא יֵרָצֶה הַמַּקְרִיב אֹתוֹ לֹא יֵחָשֵׁב לוֹ פִּגּוּל יִהְיֶה וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ עֲוֺנָהּ תִּשָּׂא׃
    hebrewPlain: ואם האכל יאכל מבשר זבח שלמיו ביום השלישי לא ירצה המקריב אתו לא יחשב לו פגול יהיה והנפש האכלת ממנו עונה תשא
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:18
    kjvOsis:
    - Lev.7.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
