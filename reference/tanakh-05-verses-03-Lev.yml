- type: TanakhVerse
  data:
    osis: Lev.18.28
    scripture: tanakh
    name: Tanakh Leviticus 18:28
    ref: Leviticus 18:28
    book: Lev
    section: torah
    chapter: 18
    verse: 28
    ordinal: 3277
    text: that the land vomit not you out also, when ye defile it, as it vomited out the nation that was before you.
    translation: JPS 1917
    original: וְלֹא־תָקִיא הָאָרֶץ אֶתְכֶם בְּטַמַּאֲכֶם אֹתָהּ כַּאֲשֶׁר קָאָה אֶת־הַגּוֹי אֲשֶׁר לִפְנֵיכֶם׃
    hebrewPlain: ולא תקיא הארץ אתכם בטמאכם אתה כאשר קאה את הגוי אשר לפניכם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:28
    kjvOsis:
    - Lev.18.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.18.29
    scripture: tanakh
    name: Tanakh Leviticus 18:29
    ref: Leviticus 18:29
    book: Lev
    section: torah
    chapter: 18
    verse: 29
    ordinal: 3278
    text: For whosoever shall do any of these abominations, even the souls that do them shall be cut off from among their people.
    translation: JPS 1917
    original: כִּי כָּל־אֲשֶׁר יַעֲשֶׂה מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה וְנִכְרְתוּ הַנְּפָשׁוֹת הָעֹשֹׂת מִקֶּרֶב עַמָּם׃
    hebrewPlain: כי כל אשר יעשה מכל התועבות האלה ונכרתו הנפשות העשת מקרב עמם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:29
    kjvOsis:
    - Lev.18.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.18
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.18.30
    scripture: tanakh
    name: Tanakh Leviticus 18:30
    ref: Leviticus 18:30
    book: Lev
    section: torah
    chapter: 18
    verse: 30
    ordinal: 3279
    text: 'Therefore shall ye keep My charge, that ye do not any of these abominable customs, which were done before you, and that ye defile not yourselves therein: I am the LORD your God.'
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי לְבִלְתִּי עֲשׂוֹת מֵחֻקּוֹת הַתּוֹעֵבֹת אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם וְלֹא תִטַּמְּאוּ בָּהֶם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ושמרתם את משמרתי לבלתי עשות מחקות התועבת אשר נעשו לפניכם ולא תטמאו בהם אני יהוה אלהיכם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:30
    kjvOsis:
    - Lev.18.30
