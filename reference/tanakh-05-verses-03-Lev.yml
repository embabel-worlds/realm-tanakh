  data:
    osis: Lev.6.16
    scripture: tanakh
    name: Tanakh Leviticus 6:16
    ref: Leviticus 6:16
    book: Lev
    section: torah
    chapter: 6
    verse: 16
    ordinal: 2870
    text: And every meal-offering of the priest shall be wholly made to smoke; it shall not be eaten.
    translation: JPS 1917
    original: וְכָל־מִנְחַת כֹּהֵן כָּלִיל תִּהְיֶה לֹא תֵאָכֵל׃
    hebrewPlain: וכל מנחת כהן כליל תהיה לא תאכל
