    scripture: tanakh
    name: Tanakh Leviticus 8:20
    ref: Leviticus 8:20
    book: Lev
    section: torah
    chapter: 8
    verse: 20
    ordinal: 2935
    text: And when the ram was cut into its pieces, Moses made the head, and the pieces, and the suet smoke.
    translation: JPS 1917
    original: וְאֶת־הָאַיִל נִתַּח לִנְתָחָיו וַיַּקְטֵר מֹשֶׁה אֶת־הָרֹאשׁ וְאֶת־הַנְּתָחִים וְאֶת־הַפָּדֶר׃
    hebrewPlain: ואת האיל נתח לנתחיו ויקטר משה את הראש ואת הנתחים ואת הפדר
    parashah: Tzav
    kjvRefs:
