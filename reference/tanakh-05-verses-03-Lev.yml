- type: TanakhVerse
  data:
    osis: Lev.11.38
    scripture: tanakh
    name: Tanakh Leviticus 11:38
    ref: Leviticus 11:38
    book: Lev
    section: torah
    chapter: 11
    verse: 38
    ordinal: 3033
    text: But if water be put upon the seed, and aught of their carcass fall thereon, it is unclean unto you.
    translation: JPS 1917
    original: וְכִי יֻתַּן־מַיִם עַל־זֶרַע וְנָפַל מִנִּבְלָתָם עָלָיו טָמֵא הוּא לָכֶם׃
    hebrewPlain: וכי יתן מים על זרע ונפל מנבלתם עליו טמא הוא לכם
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:38
    kjvOsis:
    - Lev.11.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
