  data:
    osis: Lev.20.10
    scripture: tanakh
    name: Tanakh Leviticus 20:10
    ref: Leviticus 20:10
    book: Lev
    section: torah
    chapter: 20
    verse: 10
    ordinal: 3326
    text: And the man that committeth adultery with another man’s wife, even he that committeth adultery with his neighbour’s wife, both the adulterer and the adulteress shall surely be put to death.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִנְאַף אֶת־אֵשֶׁת אִישׁ אֲשֶׁר יִנְאַף אֶת־אֵשֶׁת רֵעֵהוּ מוֹת־יוּמַת הַנֹּאֵף וְהַנֹּאָפֶת׃
    hebrewPlain: ואיש אשר ינאף את אשת איש אשר ינאף את אשת רעהו מות יומת הנאף והנאפת
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:10
    kjvOsis:
    - Lev.20.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.11
    scripture: tanakh
    name: Tanakh Leviticus 20:11
    ref: Leviticus 20:11
    book: Lev
    section: torah
    chapter: 20
    verse: 11
    ordinal: 3327
    text: And the man that lieth with his father’s wife—he hath uncovered his father’s nakedness—both of them shall surely be put to death; their blood shall be upon them.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִשְׁכַּב אֶת־אֵשֶׁת אָבִיו עֶרְוַת אָבִיו גִּלָּה מוֹת־יוּמְתוּ שְׁנֵיהֶם דְּמֵיהֶם בָּם׃
    hebrewPlain: ואיש אשר ישכב את אשת אביו ערות אביו גלה מות יומתו שניהם דמיהם בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:11
    kjvOsis:
    - Lev.20.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
