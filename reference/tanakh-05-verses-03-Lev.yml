    name: Tanakh Leviticus 11:24
    ref: Leviticus 11:24
    book: Lev
    section: torah
    chapter: 11
    verse: 24
    ordinal: 3019
    text: And by these ye shall become unclean; whosoever toucheth the carcass of them shall be unclean until even.
    translation: JPS 1917
    original: וּלְאֵלֶּה תִּטַּמָּאוּ כָּל־הַנֹּגֵעַ בְּנִבְלָתָם יִטְמָא עַד־הָעָרֶב׃
