      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.55
    scripture: tanakh
    name: Tanakh Leviticus 25:55
    ref: Leviticus 25:55
    book: Lev
    section: torah
    chapter: 25
    verse: 55
    ordinal: 3522
    text: 'For unto Me the children of Israel are servants; they are My servants whom I brought forth out of the land of Egypt: I am the LORD your God.'
    translation: JPS 1917
    original: כִּי־לִי בְנֵי־יִשְׂרָאֵל עֲבָדִים עֲבָדַי הֵם אֲשֶׁר־הוֹצֵאתִי אוֹתָם מֵאֶרֶץ מִצְרָיִם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: כי לי בני ישראל עבדים עבדי הם אשר הוצאתי אותם מארץ מצרים אני יהוה אלהיכם
    parashah: Behar
    kjvRefs:
    - Leviticus 25:55
    kjvOsis:
    - Lev.25.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.26.1
    scripture: tanakh
    name: Tanakh Leviticus 26:1
    ref: Leviticus 26:1
    book: Lev
    section: torah
    chapter: 26
    verse: 1
    ordinal: 3523
    text: Ye shall make you no idols, neither shall ye rear you up a graven image, or a pillar, neither shall ye place any figured stone in your land, to bow down unto it; for I am the LORD your God.
    translation: JPS 1917
    original: לֹא־תַעֲשׂוּ לָכֶם אֱלִילִם וּפֶסֶל וּמַצֵּבָה לֹא־תָקִימוּ לָכֶם וְאֶבֶן מַשְׂכִּית לֹא תִתְּנוּ בְּאַרְצְכֶם לְהִשְׁתַּחֲוֺת עָלֶיהָ כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: לא תעשו לכם אלילם ופסל ומצבה לא תקימו לכם ואבן משכית לא תתנו בארצכם להשתחות עליה כי אני יהוה אלהיכם
    parashah: Behar
    kjvRefs:
    - Leviticus 26:1
    kjvOsis:
    - Lev.26.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.26.2
    scripture: tanakh
    name: Tanakh Leviticus 26:2
    ref: Leviticus 26:2
    book: Lev
    section: torah
    chapter: 26
    verse: 2
    ordinal: 3524
    text: 'Ye shall keep My sabbaths, and reverence My sanctuary: I am the LORD.'
    translation: JPS 1917
    original: אֶת־שַׁבְּתֹתַי תִּשְׁמֹרוּ וּמִקְדָּשִׁי תִּירָאוּ אֲנִי יְהוָה׃
    hebrewPlain: את שבתתי תשמרו ומקדשי תיראו אני יהוה
    parashah: Behar
    kjvRefs:
    - Leviticus 26:2
    kjvOsis:
    - Lev.26.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.26.3
    scripture: tanakh
    name: Tanakh Leviticus 26:3
    ref: Leviticus 26:3
    book: Lev
    section: torah
    chapter: 26
    verse: 3
    ordinal: 3525
    text: If ye walk in My statutes, and keep My commandments, and do them;
    translation: JPS 1917
    original: אִם־בְּחֻקֹּתַי תֵּלֵכוּ וְאֶת־מִצְוֺתַי תִּשְׁמְרוּ וַעֲשִׂיתֶם אֹתָם׃
    hebrewPlain: אם בחקתי תלכו ואת מצותי תשמרו ועשיתם אתם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:3
    kjvOsis:
    - Lev.26.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.4
    scripture: tanakh
    name: Tanakh Leviticus 26:4
    ref: Leviticus 26:4
    book: Lev
    section: torah
    chapter: 26
    verse: 4
    ordinal: 3526
    text: then I will give your rains in their season, and the land shall yield her produce, and the trees of the field shall yield their fruit.
    translation: JPS 1917
    original: וְנָתַתִּי גִשְׁמֵיכֶם בְּעִתָּם וְנָתְנָה הָאָרֶץ יְבוּלָהּ וְעֵץ הַשָּׂדֶה יִתֵּן פִּרְיוֹ׃
    hebrewPlain: ונתתי גשמיכם בעתם ונתנה הארץ יבולה ועץ השדה יתן פריו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:4
    kjvOsis:
    - Lev.26.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.5
    scripture: tanakh
    name: Tanakh Leviticus 26:5
    ref: Leviticus 26:5
    book: Lev
    section: torah
    chapter: 26
    verse: 5
    ordinal: 3527
    text: And your threshing shall reach unto the vintage, and the vintage shall reach unto the sowing time; and ye shall eat your bread until ye have enough, and dwell in your land safely.
    translation: JPS 1917
    original: וְהִשִּׂיג לָכֶם דַּיִשׁ אֶת־בָּצִיר וּבָצִיר יַשִּׂיג אֶת־זָרַע וַאֲכַלְתֶּם לַחְמְכֶם לָשֹׂבַע וִישַׁבְתֶּם לָבֶטַח בְּאַרְצְכֶם׃
    hebrewPlain: והשיג לכם דיש את בציר ובציר ישיג את זרע ואכלתם לחמכם לשבע וישבתם לבטח בארצכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:5
    kjvOsis:
    - Lev.26.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.6
    scripture: tanakh
    name: Tanakh Leviticus 26:6
    ref: Leviticus 26:6
    book: Lev
    section: torah
    chapter: 26
    verse: 6
    ordinal: 3528
    text: And I will give peace in the land, and ye shall lie down, and none shall make you afraid; and I will cause evil beasts to cease out of the land, neither shall the sword go through your land.
    translation: JPS 1917
    original: וְנָתַתִּי שָׁלוֹם בָּאָרֶץ וּשְׁכַבְתֶּם וְאֵין מַחֲרִיד וְהִשְׁבַּתִּי חַיָּה רָעָה מִן־הָאָרֶץ וְחֶרֶב לֹא־תַעֲבֹר בְּאַרְצְכֶם׃
    hebrewPlain: ונתתי שלום בארץ ושכבתם ואין מחריד והשבתי חיה רעה מן הארץ וחרב לא תעבר בארצכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:6
    kjvOsis:
    - Lev.26.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.7
    scripture: tanakh
    name: Tanakh Leviticus 26:7
    ref: Leviticus 26:7
    book: Lev
    section: torah
    chapter: 26
    verse: 7
    ordinal: 3529
    text: And ye shall chase your enemies, and they shall fall before you by the sword.
    translation: JPS 1917
    original: וּרְדַפְתֶּם אֶת־אֹיְבֵיכֶם וְנָפְלוּ לִפְנֵיכֶם לֶחָרֶב
    hebrewPlain: ורדפתם את איביכם ונפלו לפניכם לחרב
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:7
    kjvOsis:
    - Lev.26.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.8
    scripture: tanakh
    name: Tanakh Leviticus 26:8
    ref: Leviticus 26:8
    book: Lev
    section: torah
    chapter: 26
    verse: 8
    ordinal: 3530
    text: And five of you shall chase a hundred, and a hundred of you shall chase ten thousand; and your enemies shall fall before you by the sword.
    translation: JPS 1917
    original: וְרָדְפוּ מִכֶּם חֲמִשָּׁה מֵאָה וּמֵאָה מִכֶּם רְבָבָה יִרְדֹּפוּ וְנָפְלוּ אֹיְבֵיכֶם לִפְנֵיכֶם לֶחָרֶב׃
    hebrewPlain: ורדפו מכם חמשה מאה ומאה מכם רבבה ירדפו ונפלו איביכם לפניכם לחרב
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:8
    kjvOsis:
    - Lev.26.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.9
    scripture: tanakh
    name: Tanakh Leviticus 26:9
    ref: Leviticus 26:9
    book: Lev
    section: torah
    chapter: 26
    verse: 9
    ordinal: 3531
    text: And I will have respect unto you, and make you fruitful, and multiply you; and will establish My covenant with you.
    translation: JPS 1917
    original: וּפָנִיתִי אֲלֵיכֶם וְהִפְרֵיתִי אֶתְכֶם וְהִרְבֵּיתִי אֶתְכֶם וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם׃
    hebrewPlain: ופניתי אליכם והפריתי אתכם והרביתי אתכם והקימתי את בריתי אתכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:9
    kjvOsis:
    - Lev.26.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.10
    scripture: tanakh
    name: Tanakh Leviticus 26:10
    ref: Leviticus 26:10
    book: Lev
    section: torah
    chapter: 26
    verse: 10
    ordinal: 3532
    text: And ye shall eat old store long kept, and ye shall bring forth the old from before the new.
    translation: JPS 1917
    original: וַאֲכַלְתֶּם יָשָׁן נוֹשָׁן וְיָשָׁן מִפְּנֵי חָדָשׁ תּוֹצִיאוּ׃
    hebrewPlain: ואכלתם ישן נושן וישן מפני חדש תוציאו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:10
    kjvOsis:
    - Lev.26.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.11
    scripture: tanakh
    name: Tanakh Leviticus 26:11
    ref: Leviticus 26:11
    book: Lev
    section: torah
    chapter: 26
    verse: 11
    ordinal: 3533
    text: And I will set My tabernacle among you, and My soul shall not abhor you.
    translation: JPS 1917
    original: וְנָתַתִּי מִשְׁכָּנִי בְּתוֹכְכֶם וְלֹא־תִגְעַל נַפְשִׁי אֶתְכֶם׃
    hebrewPlain: ונתתי משכני בתוככם ולא תגעל נפשי אתכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:11
    kjvOsis:
    - Lev.26.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.12
    scripture: tanakh
    name: Tanakh Leviticus 26:12
    ref: Leviticus 26:12
    book: Lev
    section: torah
    chapter: 26
    verse: 12
    ordinal: 3534
    text: And I will walk among you, and will be your God, and ye shall be My people.
    translation: JPS 1917
    original: וְהִתְהַלַּכְתִּי בְּתוֹכְכֶם וְהָיִיתִי לָכֶם לֵאלֹהִים וְאַתֶּם תִּהְיוּ־לִי לְעָם׃
    hebrewPlain: והתהלכתי בתוככם והייתי לכם לאלהים ואתם תהיו לי לעם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:12
    kjvOsis:
    - Lev.26.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.13
    scripture: tanakh
    name: Tanakh Leviticus 26:13
    ref: Leviticus 26:13
    book: Lev
    section: torah
    chapter: 26
    verse: 13
    ordinal: 3535
    text: I am the LORD your God, who brought you forth out of the land of Egypt, that ye should not be their bondmen; and I have broken the bars of your yoke, and made you go upright.
    translation: JPS 1917
    original: אֲנִי יְהוָה אֱלֹהֵיכֶם אֲשֶׁר הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם מִהְיֹת לָהֶם עֲבָדִים וָאֶשְׁבֹּר מֹטֹת עֻלְּכֶם וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת׃
    hebrewPlain: אני יהוה אלהיכם אשר הוצאתי אתכם מארץ מצרים מהית להם עבדים ואשבר מטת עלכם ואולך אתכם קוממיות
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:13
    kjvOsis:
    - Lev.26.13
