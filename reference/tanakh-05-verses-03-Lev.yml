  data:
    osis: Lev.18.23
    scripture: tanakh
    name: Tanakh Leviticus 18:23
    ref: Leviticus 18:23
    book: Lev
    section: torah
    chapter: 18
    verse: 23
    ordinal: 3272
    text: And thou shalt not lie with any beast to defile thyself therewith; neither shall any woman stand before a beast, to lie down thereto; it is perversion.
    translation: JPS 1917
    original: וּבְכָל־בְּהֵמָה לֹא־תִתֵּן שְׁכָבְתְּךָ לְטָמְאָה־בָהּ וְאִשָּׁה לֹא־תַעֲמֹד לִפְנֵי בְהֵמָה לְרִבְעָהּ תֶּבֶל הוּא׃
    hebrewPlain: ובכל בהמה לא תתן שכבתך לטמאה בה ואשה לא תעמד לפני בהמה לרבעה תבל הוא
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:23
    kjvOsis:
    - Lev.18.23
