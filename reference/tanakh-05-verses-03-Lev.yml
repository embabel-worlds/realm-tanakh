    book: Lev
    section: torah
    chapter: 11
    verse: 3
    ordinal: 2998
    text: Whatsoever parteth the hoof, and is wholly cloven-footed, and cheweth the cud, among the beasts, that may ye eat.
    translation: JPS 1917
    original: כֹּל מַפְרֶסֶת פַּרְסָה וְשֹׁסַעַת שֶׁסַע פְּרָסֹת מַעֲלַת גֵּרָה בַּבְּהֵמָה אֹתָהּ תֹּאכֵלוּ׃
    hebrewPlain: כל מפרסת פרסה ושסעת שסע פרסת מעלת גרה בבהמה אתה תאכלו
    parashah: Shmini
    kjvRefs:
