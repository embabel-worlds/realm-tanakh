  data:
    osis: Lev.14.55
    scripture: tanakh
    name: Tanakh Leviticus 14:55
    ref: Leviticus 14:55
    book: Lev
    section: torah
    chapter: 14
    verse: 55
    ordinal: 3164
    text: and for the leprosy of a garment, and for a house;
    translation: JPS 1917
    original: וּלְצָרַעַת הַבֶּגֶד וְלַבָּיִת׃
    hebrewPlain: ולצרעת הבגד ולבית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:55
    kjvOsis:
    - Lev.14.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
