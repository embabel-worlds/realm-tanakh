  data:
    osis: Lev.19.26
    scripture: tanakh
    name: Tanakh Leviticus 19:26
    ref: Leviticus 19:26
    book: Lev
    section: torah
    chapter: 19
    verse: 26
    ordinal: 3305
    text: Ye shall not eat with the blood; neither shall ye practise divination nor soothsaying.
    translation: JPS 1917
    original: לֹא תֹאכְלוּ עַל־הַדָּם לֹא תְנַחֲשׁוּ וְלֹא תְעוֹנֵנוּ׃
    hebrewPlain: לא תאכלו על הדם לא תנחשו ולא תעוננו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:26
    kjvOsis:
    - Lev.19.26
