    chapter: 16
    verse: 2
    ordinal: 3201
    text: 'and the LORD said unto Moses: ‘Speak unto Aaron thy brother, that he come not at all times into the holy place within the veil, before the ark-cover which is upon the ark; that he die not; for I appear in the cloud upon the ark-cover.'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־מֹשֶׁה דַּבֵּר אֶל־אַהֲרֹן אָחִיךָ וְאַל־יָבֹא בְכָל־עֵת אֶל־הַקֹּדֶשׁ מִבֵּית לַפָּרֹכֶת אֶל־פְּנֵי הַכַּפֹּרֶת אֲשֶׁר עַל־הָאָרֹן וְלֹא יָמוּת כִּי בֶּעָנָן אֵרָאֶה עַל־הַכַּפֹּרֶת׃
    hebrewPlain: ויאמר יהוה אל משה דבר אל אהרן אחיך ואל יבא בכל עת אל הקדש מבית לפרכת אל פני הכפרת אשר על הארן ולא ימות כי בענן אראה על הכפרת
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:2
    kjvOsis:
    - Lev.16.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.3
    scripture: tanakh
    name: Tanakh Leviticus 16:3
    ref: Leviticus 16:3
    book: Lev
    section: torah
    chapter: 16
    verse: 3
    ordinal: 3202
    text: 'Herewith shall Aaron come into the holy place: with a young bullock for a sin-offering, and a ram for a burnt-offering.'
    translation: JPS 1917
    original: בְּזֹאת יָבֹא אַהֲרֹן אֶל־הַקֹּדֶשׁ בְּפַר בֶּן־בָּקָר לְחַטָּאת וְאַיִל לְעֹלָה׃
    hebrewPlain: בזאת יבא אהרן אל הקדש בפר בן בקר לחטאת ואיל לעלה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:3
    kjvOsis:
    - Lev.16.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.4
    scripture: tanakh
    name: Tanakh Leviticus 16:4
    ref: Leviticus 16:4
    book: Lev
    section: torah
    chapter: 16
    verse: 4
    ordinal: 3203
    text: He shall put on the holy linen tunic, and he shall have the linen breeches upon his flesh, and shall be girded with the linen girdle, and with the linen mitre shall he be attired; they are the holy garments; and he shall bathe his flesh in water, and put them on.
    translation: JPS 1917
    original: כְּתֹנֶת־בַּד קֹדֶשׁ יִלְבָּשׁ וּמִכְנְסֵי־בַד יִהְיוּ עַל־בְּשָׂרוֹ וּבְאַבְנֵט בַּד יַחְגֹּר וּבְמִצְנֶפֶת בַּד יִצְנֹף בִּגְדֵי־קֹדֶשׁ הֵם וְרָחַץ בַּמַּיִם אֶת־בְּשָׂרוֹ וּלְבֵשָׁם׃
    hebrewPlain: כתנת בד קדש ילבש ומכנסי בד יהיו על בשרו ובאבנט בד יחגר ובמצנפת בד יצנף בגדי קדש הם ורחץ במים את בשרו ולבשם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:4
    kjvOsis:
    - Lev.16.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.5
    scripture: tanakh
    name: Tanakh Leviticus 16:5
    ref: Leviticus 16:5
    book: Lev
    section: torah
    chapter: 16
    verse: 5
    ordinal: 3204
    text: And he shall take of the congregation of the children of Israel two he-goats for a sin-offering, and one ram for a burnt-offering.
    translation: JPS 1917
    original: וּמֵאֵת עֲדַת בְּנֵי יִשְׂרָאֵל יִקַּח שְׁנֵי־שְׂעִירֵי עִזִּים לְחַטָּאת וְאַיִל אֶחָד לְעֹלָה׃
    hebrewPlain: ומאת עדת בני ישראל יקח שני שעירי עזים לחטאת ואיל אחד לעלה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:5
    kjvOsis:
    - Lev.16.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.6
    scripture: tanakh
    name: Tanakh Leviticus 16:6
    ref: Leviticus 16:6
    book: Lev
    section: torah
    chapter: 16
    verse: 6
    ordinal: 3205
    text: And Aaron shall present the bullock of the sin-offering, which is for himself, and make atonement for himself, and for his house.
    translation: JPS 1917
    original: וְהִקְרִיב אַהֲרֹן אֶת־פַּר הַחַטָּאת אֲשֶׁר־לוֹ וְכִפֶּר בַּעֲדוֹ וּבְעַד בֵּיתוֹ׃
    hebrewPlain: והקריב אהרן את פר החטאת אשר לו וכפר בעדו ובעד ביתו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:6
    kjvOsis:
    - Lev.16.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.7
    scripture: tanakh
    name: Tanakh Leviticus 16:7
    ref: Leviticus 16:7
    book: Lev
    section: torah
    chapter: 16
    verse: 7
    ordinal: 3206
    text: And he shall take the two goats, and set them before the LORD at the door of the tent of meeting.
    translation: JPS 1917
    original: וְלָקַח אֶת־שְׁנֵי הַשְּׂעִירִם וְהֶעֱמִיד אֹתָם לִפְנֵי יְהוָה פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: ולקח את שני השעירם והעמיד אתם לפני יהוה פתח אהל מועד
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:7
    kjvOsis:
    - Lev.16.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.8
    scripture: tanakh
    name: Tanakh Leviticus 16:8
    ref: Leviticus 16:8
    book: Lev
    section: torah
    chapter: 16
    verse: 8
    ordinal: 3207
    text: 'And Aaron shall cast lots upon the two goats: one lot for the LORD, and the other lot for Azazel.'
    translation: JPS 1917
    original: וְנָתַן אַהֲרֹן עַל־שְׁנֵי הַשְּׂעִירִם גּוֹרָלוֹת גּוֹרָל אֶחָד לַיהוָה וְגוֹרָל אֶחָד לַעֲזָאזֵל׃
    hebrewPlain: ונתן אהרן על שני השעירם גורלות גורל אחד ליהוה וגורל אחד לעזאזל
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:8
    kjvOsis:
    - Lev.16.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.9
    scripture: tanakh
    name: Tanakh Leviticus 16:9
    ref: Leviticus 16:9
    book: Lev
    section: torah
    chapter: 16
    verse: 9
    ordinal: 3208
    text: And Aaron shall present the goat upon which the lot fell for the LORD, and offer him for a sin-offering.
    translation: JPS 1917
    original: וְהִקְרִיב אַהֲרֹן אֶת־הַשָּׂעִיר אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל לַיהוָה וְעָשָׂהוּ חַטָּאת׃
    hebrewPlain: והקריב אהרן את השעיר אשר עלה עליו הגורל ליהוה ועשהו חטאת
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:9
    kjvOsis:
    - Lev.16.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.10
    scripture: tanakh
    name: Tanakh Leviticus 16:10
    ref: Leviticus 16:10
    book: Lev
    section: torah
    chapter: 16
    verse: 10
    ordinal: 3209
    text: But the goat, on which the lot fell for Azazel, shall be set alive before the LORD, to make atonement over him, to send him away for Azazel into the wilderness.
    translation: JPS 1917
    original: וְהַשָּׂעִיר אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל לַעֲזָאזֵל יָעֳמַד־חַי לִפְנֵי יְהוָה לְכַפֵּר עָלָיו לְשַׁלַּח אֹתוֹ לַעֲזָאזֵל הַמִּדְבָּרָה׃
    hebrewPlain: והשעיר אשר עלה עליו הגורל לעזאזל יעמד חי לפני יהוה לכפר עליו לשלח אתו לעזאזל המדברה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:10
    kjvOsis:
    - Lev.16.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.11
    scripture: tanakh
    name: Tanakh Leviticus 16:11
    ref: Leviticus 16:11
    book: Lev
    section: torah
    chapter: 16
    verse: 11
    ordinal: 3210
    text: And Aaron shall present the bullock of the sin-offering, which is for himself, and shall make atonement for himself, and for his house, and shall kill the bullock of the sin-offering which is for himself.
    translation: JPS 1917
    original: וְהִקְרִיב אַהֲרֹן אֶת־פַּר הַחַטָּאת אֲשֶׁר־לוֹ וְכִפֶּר בַּעֲדוֹ וּבְעַד בֵּיתוֹ וְשָׁחַט אֶת־פַּר הַחַטָּאת אֲשֶׁר־לוֹ׃
    hebrewPlain: והקריב אהרן את פר החטאת אשר לו וכפר בעדו ובעד ביתו ושחט את פר החטאת אשר לו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:11
    kjvOsis:
    - Lev.16.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.12
    scripture: tanakh
    name: Tanakh Leviticus 16:12
    ref: Leviticus 16:12
    book: Lev
    section: torah
    chapter: 16
    verse: 12
    ordinal: 3211
    text: And he shall take a censer full of coals of fire from off the altar before the LORD, and his hands full of sweet incense beaten small, and bring it within the veil.
    translation: JPS 1917
    original: וְלָקַח מְלֹא־הַמַּחְתָּה גַּחֲלֵי־אֵשׁ מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה וּמְלֹא חָפְנָיו קְטֹרֶת סַמִּים דַּקָּה וְהֵבִיא מִבֵּית לַפָּרֹכֶת׃
    hebrewPlain: ולקח מלא המחתה גחלי אש מעל המזבח מלפני יהוה ומלא חפניו קטרת סמים דקה והביא מבית לפרכת
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:12
    kjvOsis:
    - Lev.16.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.13
    scripture: tanakh
    name: Tanakh Leviticus 16:13
    ref: Leviticus 16:13
    book: Lev
    section: torah
    chapter: 16
    verse: 13
    ordinal: 3212
    text: And he shall put the incense upon the fire before the LORD, that the cloud of the incense may cover the ark-cover that is upon the testimony, that he die not.
    translation: JPS 1917
    original: וְנָתַן אֶת־הַקְּטֹרֶת עַל־הָאֵשׁ לִפְנֵי יְהוָה וְכִסָּה עֲנַן הַקְּטֹרֶת אֶת־הַכַּפֹּרֶת אֲשֶׁר עַל־הָעֵדוּת וְלֹא יָמוּת׃
    hebrewPlain: ונתן את הקטרת על האש לפני יהוה וכסה ענן הקטרת את הכפרת אשר על העדות ולא ימות
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:13
    kjvOsis:
    - Lev.16.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.14
    scripture: tanakh
    name: Tanakh Leviticus 16:14
    ref: Leviticus 16:14
    book: Lev
    section: torah
    chapter: 16
    verse: 14
    ordinal: 3213
    text: And he shall take of the blood of the bullock, and sprinkle it with his finger upon the ark-cover on the east; and before the ark-cover shall he sprinkle of the blood with his finger seven times.
    translation: JPS 1917
    original: וְלָקַח מִדַּם הַפָּר וְהִזָּה בְאֶצְבָּעוֹ עַל־פְּנֵי הַכַּפֹּרֶת קֵדְמָה וְלִפְנֵי הַכַּפֹּרֶת יַזֶּה שֶׁבַע־פְּעָמִים מִן־הַדָּם בְּאֶצְבָּעוֹ׃
    hebrewPlain: ולקח מדם הפר והזה באצבעו על פני הכפרת קדמה ולפני הכפרת יזה שבע פעמים מן הדם באצבעו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:14
    kjvOsis:
    - Lev.16.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.15
    scripture: tanakh
    name: Tanakh Leviticus 16:15
    ref: Leviticus 16:15
    book: Lev
    section: torah
    chapter: 16
    verse: 15
    ordinal: 3214
    text: Then shall he kill the goat of the sin-offering, that is for the people, and bring his blood within the veil, and do with his blood as he did with the blood of the bullock, and sprinkle it upon the ark-cover, and before the ark-cover.
    translation: JPS 1917
    original: וְשָׁחַט אֶת־שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם וְהֵבִיא אֶת־דָּמוֹ אֶל־מִבֵּית לַפָּרֹכֶת וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר וְהִזָּה אֹתוֹ עַל־הַכַּפֹּרֶת וְלִפְנֵי הַכַּפֹּרֶת׃
    hebrewPlain: ושחט את שעיר החטאת אשר לעם והביא את דמו אל מבית לפרכת ועשה את דמו כאשר עשה לדם הפר והזה אתו על הכפרת ולפני הכפרת
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:15
    kjvOsis:
    - Lev.16.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.16
    scripture: tanakh
    name: Tanakh Leviticus 16:16
    ref: Leviticus 16:16
    book: Lev
    section: torah
    chapter: 16
    verse: 16
    ordinal: 3215
    text: And he shall make atonement for the holy place, because of the uncleannesses of the children of Israel, and because of their transgressions, even all their sins; and so shall he do for the tent of meeting, that dwelleth with them in the midst of their uncleannesses.
    translation: JPS 1917
    original: וְכִפֶּר עַל־הַקֹּדֶשׁ מִטֻּמְאֹת בְּנֵי יִשְׂרָאֵל וּמִפִּשְׁעֵיהֶם לְכָל־חַטֹּאתָם וְכֵן יַעֲשֶׂה לְאֹהֶל מוֹעֵד הַשֹּׁכֵן אִתָּם בְּתוֹךְ טֻמְאֹתָם׃
    hebrewPlain: וכפר על הקדש מטמאת בני ישראל ומפשעיהם לכל חטאתם וכן יעשה לאהל מועד השכן אתם בתוך טמאתם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:16
    kjvOsis:
    - Lev.16.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.17
    scripture: tanakh
    name: Tanakh Leviticus 16:17
    ref: Leviticus 16:17
    book: Lev
    section: torah
    chapter: 16
    verse: 17
    ordinal: 3216
    text: And there shall be no man in the tent of meeting when he goeth in to make atonement in the holy place, until he come out, and have made atonement for himself, and for his household, and for all the assembly of Israel.
    translation: JPS 1917
    original: וְכָל־אָדָם לֹא־יִהְיֶה בְּאֹהֶל מוֹעֵד בְּבֹאוֹ לְכַפֵּר בַּקֹּדֶשׁ עַד־צֵאתוֹ וְכִפֶּר בַּעֲדוֹ וּבְעַד בֵּיתוֹ וּבְעַד כָּל־קְהַל יִשְׂרָאֵל׃
    hebrewPlain: וכל אדם לא יהיה באהל מועד בבאו לכפר בקדש עד צאתו וכפר בעדו ובעד ביתו ובעד כל קהל ישראל
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:17
    kjvOsis:
    - Lev.16.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
