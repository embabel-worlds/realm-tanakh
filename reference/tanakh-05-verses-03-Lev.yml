    ref: Leviticus 8:18
    book: Lev
    section: torah
    chapter: 8
    verse: 18
    ordinal: 2933
    text: And the ram of the burnt-offering was presented; and Aaron and his sons laid their hands upon the head of the ram.
    translation: JPS 1917
    original: וַיַּקְרֵב אֵת אֵיל הָעֹלָה וַיִּסְמְכוּ אַהֲרֹן וּבָנָיו אֶת־יְדֵיהֶם עַל־רֹאשׁ הָאָיִל׃
    hebrewPlain: ויקרב את איל העלה ויסמכו אהרן ובניו את ידיהם על ראש האיל
