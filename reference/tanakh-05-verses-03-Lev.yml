    ref: Leviticus 1:17
    book: Lev
    section: torah
    chapter: 1
    verse: 17
    ordinal: 2760
    text: And he shall rend it by the wings thereof, but shall not divide it asunder; and the priest shall make it smoke upon the altar, upon the wood that is upon the fire; it is a burnt-offering, an offering made by fire, of a sweet savour unto the LORD.
    translation: JPS 1917
    original: וְשִׁסַּע אֹתוֹ בִכְנָפָיו לֹא יַבְדִּיל וְהִקְטִיר אֹתוֹ הַכֹּהֵן הַמִּזְבֵּחָה עַל־הָעֵצִים אֲשֶׁר עַל־הָאֵשׁ עֹלָה הוּא אִשֵּׁה רֵיחַ נִיחֹחַ לַיהוָה׃
    hebrewPlain: ושסע אתו בכנפיו לא יבדיל והקטיר אתו הכהן המזבחה על העצים אשר על האש עלה הוא אשה ריח ניחח ליהוה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 1:17
    kjvOsis:
