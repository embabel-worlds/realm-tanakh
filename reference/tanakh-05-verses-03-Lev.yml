      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.2
    scripture: tanakh
    name: Tanakh Leviticus 13:2
    ref: Leviticus 13:2
    book: Lev
    section: torah
    chapter: 13
    verse: 2
    ordinal: 3052
    text: When a man shall have in the skin of his flesh a rising, or a scab, or a bright spot, and it become in the skin of his flesh the plague of leprosy, then he shall be brought unto Aaron the priest, or unto one of his sons the priests.
    translation: JPS 1917
    original: אָדָם כִּי־יִהְיֶה בְעוֹר־בְּשָׂרוֹ שְׂאֵת אוֹ־סַפַּחַת אוֹ בַהֶרֶת וְהָיָה בְעוֹר־בְּשָׂרוֹ לְנֶגַע צָרָעַת וְהוּבָא אֶל־אַהֲרֹן הַכֹּהֵן אוֹ אֶל־אַחַד מִבָּנָיו הַכֹּהֲנִים׃
    hebrewPlain: אדם כי יהיה בעור בשרו שאת או ספחת או בהרת והיה בעור בשרו לנגע צרעת והובא אל אהרן הכהן או אל אחד מבניו הכהנים
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:2
    kjvOsis:
    - Lev.13.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.3
    scripture: tanakh
    name: Tanakh Leviticus 13:3
    ref: Leviticus 13:3
    book: Lev
    section: torah
    chapter: 13
    verse: 3
    ordinal: 3053
    text: And the priest shall look upon the plague in the skin of the flesh; and if the hair in the plague be turned white, and the appearance of the plague be deeper than the skin of his flesh, it is the plague of leprosy; and the priest shall look on him, and pronounce him unclean.
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן אֶת־הַנֶּגַע בְּעוֹר־הַבָּשָׂר וְשֵׂעָר בַּנֶּגַע הָפַךְ לָבָן וּמַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ נֶגַע צָרַעַת הוּא וְרָאָהוּ הַכֹּהֵן וְטִמֵּא אֹתוֹ׃
    hebrewPlain: וראה הכהן את הנגע בעור הבשר ושער בנגע הפך לבן ומראה הנגע עמק מעור בשרו נגע צרעת הוא וראהו הכהן וטמא אתו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:3
    kjvOsis:
    - Lev.13.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.4
    scripture: tanakh
    name: Tanakh Leviticus 13:4
    ref: Leviticus 13:4
    book: Lev
    section: torah
    chapter: 13
    verse: 4
    ordinal: 3054
    text: And if the bright spot be white in the skin of his flesh, and the appearance thereof be not deeper than the skin, and the hair thereof be not turned white, then the priest shall shut up him that hath the plague seven days.
    translation: JPS 1917
    original: וְאִם־בַּהֶרֶת לְבָנָה הִוא בְּעוֹר בְּשָׂרוֹ וְעָמֹק אֵין־מַרְאֶהָ מִן־הָעוֹר וּשְׂעָרָה לֹא־הָפַךְ לָבָן וְהִסְגִּיר הַכֹּהֵן אֶת־הַנֶּגַע שִׁבְעַת יָמִים׃
    hebrewPlain: ואם בהרת לבנה הוא בעור בשרו ועמק אין מראה מן העור ושערה לא הפך לבן והסגיר הכהן את הנגע שבעת ימים
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:4
    kjvOsis:
    - Lev.13.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.5
    scripture: tanakh
    name: Tanakh Leviticus 13:5
    ref: Leviticus 13:5
    book: Lev
    section: torah
    chapter: 13
    verse: 5
    ordinal: 3055
    text: And the priest shall look on him the seventh day; and, behold, if the plague stay in its appearance, and the plague be not spread in the skin, then the priest shall shut him up seven days more.
    translation: JPS 1917
    original: וְרָאָהוּ הַכֹּהֵן בַּיּוֹם הַשְּׁבִיעִי וְהִנֵּה הַנֶּגַע עָמַד בְּעֵינָיו לֹא־פָשָׂה הַנֶּגַע בָּעוֹר וְהִסְגִּירוֹ הַכֹּהֵן שִׁבְעַת יָמִים שֵׁנִית׃
    hebrewPlain: וראהו הכהן ביום השביעי והנה הנגע עמד בעיניו לא פשה הנגע בעור והסגירו הכהן שבעת ימים שנית
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:5
    kjvOsis:
    - Lev.13.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.6
    scripture: tanakh
    name: Tanakh Leviticus 13:6
    ref: Leviticus 13:6
    book: Lev
    section: torah
    chapter: 13
    verse: 6
    ordinal: 3056
    text: 'And the priest shall look on him again the seventh day; and, behold, if the plague be dim, and the plague be not spread in the skin, then the priest shall pronounce him clean: it is a scab; and he shall wash his clothes, and be clean.'
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן אֹתוֹ בַּיּוֹם הַשְּׁבִיעִי שֵׁנִית וְהִנֵּה כֵּהָה הַנֶּגַע וְלֹא־פָשָׂה הַנֶּגַע בָּעוֹר וְטִהֲרוֹ הַכֹּהֵן מִסְפַּחַת הִיא וְכִבֶּס בְּגָדָיו וְטָהֵר׃
    hebrewPlain: וראה הכהן אתו ביום השביעי שנית והנה כהה הנגע ולא פשה הנגע בעור וטהרו הכהן מספחת היא וכבס בגדיו וטהר
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:6
    kjvOsis:
    - Lev.13.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.7
    scripture: tanakh
    name: Tanakh Leviticus 13:7
    ref: Leviticus 13:7
    book: Lev
    section: torah
    chapter: 13
    verse: 7
    ordinal: 3057
    text: But if the scab spread abroad in the skin, after that he hath shown himself to the priest for his cleansing, he shall show himself to the priest again.
    translation: JPS 1917
    original: וְאִם־פָּשֹׂה תִפְשֶׂה הַמִּסְפַּחַת בָּעוֹר אַחֲרֵי הֵרָאֹתוֹ אֶל־הַכֹּהֵן לְטָהֳרָתוֹ וְנִרְאָה שֵׁנִית אֶל־הַכֹּהֵן׃
    hebrewPlain: ואם פשה תפשה המספחת בעור אחרי הראתו אל הכהן לטהרתו ונראה שנית אל הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:7
    kjvOsis:
    - Lev.13.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.8
    scripture: tanakh
    name: Tanakh Leviticus 13:8
    ref: Leviticus 13:8
    book: Lev
    section: torah
    chapter: 13
    verse: 8
    ordinal: 3058
    text: 'And the priest shall look, and, behold, if the scab be spread in the skin, then the priest shall pronounce him unclean: it is leprosy.'
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן וְהִנֵּה פָּשְׂתָה הַמִּסְפַּחַת בָּעוֹר וְטִמְּאוֹ הַכֹּהֵן צָרַעַת הִוא׃
    hebrewPlain: וראה הכהן והנה פשתה המספחת בעור וטמאו הכהן צרעת הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:8
    kjvOsis:
    - Lev.13.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.9
    scripture: tanakh
    name: Tanakh Leviticus 13:9
    ref: Leviticus 13:9
    book: Lev
    section: torah
    chapter: 13
    verse: 9
    ordinal: 3059
    text: When the plague of leprosy is in a man, then he shall be brought unto the priest.
    translation: JPS 1917
    original: נֶגַע צָרַעַת כִּי תִהְיֶה בְּאָדָם וְהוּבָא אֶל־הַכֹּהֵן׃
    hebrewPlain: נגע צרעת כי תהיה באדם והובא אל הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:9
    kjvOsis:
    - Lev.13.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.10
    scripture: tanakh
    name: Tanakh Leviticus 13:10
    ref: Leviticus 13:10
    book: Lev
    section: torah
    chapter: 13
    verse: 10
    ordinal: 3060
    text: And the priest shall look, and, behold, if there be a white rising in the skin, and it have turned the hair white, and there be quick raw flesh in the rising,
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן וְהִנֵּה שְׂאֵת־לְבָנָה בָּעוֹר וְהִיא הָפְכָה שֵׂעָר לָבָן וּמִחְיַת בָּשָׂר חַי בַּשְׂאֵת׃
    hebrewPlain: וראה הכהן והנה שאת לבנה בעור והיא הפכה שער לבן ומחית בשר חי בשאת
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:10
    kjvOsis:
    - Lev.13.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.11
    scripture: tanakh
    name: Tanakh Leviticus 13:11
    ref: Leviticus 13:11
    book: Lev
    section: torah
    chapter: 13
    verse: 11
    ordinal: 3061
    text: it is an old leprosy in the skin of his flesh, and the priest shall pronounce him unclean; he shall not shut him up; for he is unclean.
    translation: JPS 1917
    original: צָרַעַת נוֹשֶׁנֶת הִוא בְּעוֹר בְּשָׂרוֹ וְטִמְּאוֹ הַכֹּהֵן לֹא יַסְגִּרֶנּוּ כִּי טָמֵא הוּא׃
    hebrewPlain: צרעת נושנת הוא בעור בשרו וטמאו הכהן לא יסגרנו כי טמא הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:11
    kjvOsis:
    - Lev.13.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.12
    scripture: tanakh
    name: Tanakh Leviticus 13:12
    ref: Leviticus 13:12
    book: Lev
    section: torah
    chapter: 13
    verse: 12
    ordinal: 3062
    text: And if the leprosy break out abroad in the skin, and the leprosy cover all the skin of him that hath the plague from his head even to his feet, as far as appeareth to the priest;
    translation: JPS 1917
    original: וְאִם־פָּרוֹחַ תִּפְרַח הַצָּרַעַת בָּעוֹר וְכִסְּתָה הַצָּרַעַת אֵת כָּל־עוֹר הַנֶּגַע מֵרֹאשׁוֹ וְעַד־רַגְלָיו לְכָל־מַרְאֵה עֵינֵי הַכֹּהֵן׃
    hebrewPlain: ואם פרוח תפרח הצרעת בעור וכסתה הצרעת את כל עור הנגע מראשו ועד רגליו לכל מראה עיני הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:12
    kjvOsis:
    - Lev.13.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.13
    scripture: tanakh
    name: Tanakh Leviticus 13:13
    ref: Leviticus 13:13
    book: Lev
    section: torah
    chapter: 13
    verse: 13
    ordinal: 3063
    text: 'then the priest shall look; and, behold, if the leprosy have covered all his flesh, he shall pronounce him clean that hath the plague; it is all turned white: he is clean.'
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן וְהִנֵּה כִסְּתָה הַצָּרַעַת אֶת־כָּל־בְּשָׂרוֹ וְטִהַר אֶת־הַנָּגַע כֻּלּוֹ הָפַךְ לָבָן טָהוֹר הוּא׃
    hebrewPlain: וראה הכהן והנה כסתה הצרעת את כל בשרו וטהר את הנגע כלו הפך לבן טהור הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:13
    kjvOsis:
    - Lev.13.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.14
    scripture: tanakh
    name: Tanakh Leviticus 13:14
    ref: Leviticus 13:14
    book: Lev
    section: torah
    chapter: 13
    verse: 14
    ordinal: 3064
    text: But whensoever raw flesh appeareth in him, he shall be unclean.
    translation: JPS 1917
    original: וּבְיוֹם הֵרָאוֹת בּוֹ בָּשָׂר חַי יִטְמָא׃
    hebrewPlain: וביום הראות בו בשר חי יטמא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:14
    kjvOsis:
    - Lev.13.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.15
    scripture: tanakh
    name: Tanakh Leviticus 13:15
    ref: Leviticus 13:15
    book: Lev
    section: torah
    chapter: 13
    verse: 15
    ordinal: 3065
    text: 'And the priest shall look on the raw flesh, and pronounce him unclean; the raw flesh is unclean: it is leprosy.'
    translation: JPS 1917
