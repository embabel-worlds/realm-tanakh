      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.54
    scripture: tanakh
    name: Tanakh Leviticus 14:54
    ref: Leviticus 14:54
    book: Lev
    section: torah
    chapter: 14
    verse: 54
    ordinal: 3163
    text: This is the law for all manner of plague of leprosy, and for a scall;
    translation: JPS 1917
    original: זֹאת הַתּוֹרָה לְכָל־נֶגַע הַצָּרַעַת וְלַנָּתֶק׃
    hebrewPlain: זאת התורה לכל נגע הצרעת ולנתק
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:54
    kjvOsis:
    - Lev.14.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
