  data:
    osis: Lev.18.26
    scripture: tanakh
    name: Tanakh Leviticus 18:26
    ref: Leviticus 18:26
    book: Lev
    section: torah
    chapter: 18
    verse: 26
    ordinal: 3275
    text: Ye therefore shall keep My statutes and Mine ordinances, and shall not do any of these abominations; neither the home-born, nor the stranger that sojourneth among you—
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם אַתֶּם אֶת־חֻקֹּתַי וְאֶת־מִשְׁפָּטַי וְלֹא תַעֲשׂוּ מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה הָאֶזְרָח וְהַגֵּר הַגָּר בְּתוֹכְכֶם׃
    hebrewPlain: ושמרתם אתם את חקתי ואת משפטי ולא תעשו מכל התועבת האלה האזרח והגר הגר בתוככם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:26
    kjvOsis:
    - Lev.18.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.18
  - predicate: IN_PORTION
    to:
