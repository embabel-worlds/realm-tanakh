- type: TanakhVerse
  data:
    osis: Lev.23.25
    scripture: tanakh
    name: Tanakh Leviticus 23:25
    ref: Leviticus 23:25
    book: Lev
    section: torah
    chapter: 23
    verse: 25
    ordinal: 3425
    text: Ye shall do no manner of servile work; and ye shall bring an offering made by fire unto the LORD.
    translation: JPS 1917
    original: כָּל־מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ וְהִקְרַבְתֶּם אִשֶּׁה לַיהוָה׃
    hebrewPlain: כל מלאכת עבדה לא תעשו והקרבתם אשה ליהוה
    parashah: Emor
