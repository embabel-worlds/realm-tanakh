  data:
    osis: Lev.9.12
    scripture: tanakh
    name: Tanakh Leviticus 9:12
    ref: Leviticus 9:12
    book: Lev
    section: torah
    chapter: 9
    verse: 12
    ordinal: 2963
    text: And he slew the burnt-offering; and Aaron’s sons delivered unto him the blood, and he dashed it against the altar round about.
    translation: JPS 1917
    original: וַיִּשְׁחַט אֶת־הָעֹלָה וַיַּמְצִאוּ בְּנֵי אַהֲרֹן אֵלָיו אֶת־הַדָּם וַיִּזְרְקֵהוּ עַל־הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: וישחט את העלה וימצאו בני אהרן אליו את הדם ויזרקהו על המזבח סביב
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:12
    kjvOsis:
