    scripture: tanakh
    name: Tanakh Leviticus 7:27
    ref: Leviticus 7:27
    book: Lev
    section: torah
    chapter: 7
    verse: 27
    ordinal: 2904
    text: Whosoever it be that eateth any blood, that soul shall be cut off from his people.
    translation: JPS 1917
    original: כָּל־נֶפֶשׁ אֲשֶׁר־תֹּאכַל כָּל־דָּם וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ׃
    hebrewPlain: כל נפש אשר תאכל כל דם ונכרתה הנפש ההוא מעמיה
