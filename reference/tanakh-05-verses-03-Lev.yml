    section: torah
    chapter: 20
    verse: 7
    ordinal: 3323
    text: Sanctify yourselves therefore, and be ye holy; for I am the LORD your God.
    translation: JPS 1917
    original: וְהִתְקַדִּשְׁתֶּם וִהְיִיתֶם קְדֹשִׁים כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: והתקדשתם והייתם קדשים כי אני יהוה אלהיכם
