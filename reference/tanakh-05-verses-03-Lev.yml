  data:
    osis: Lev.14.57
    scripture: tanakh
    name: Tanakh Leviticus 14:57
    ref: Leviticus 14:57
    book: Lev
    section: torah
    chapter: 14
    verse: 57
    ordinal: 3166
    text: to teach when it is unclean, and when it is clean; this is the law of leprosy.
    translation: JPS 1917
    original: לְהוֹרֹת בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר זֹאת תּוֹרַת הַצָּרָעַת׃
    hebrewPlain: להורת ביום הטמא וביום הטהר זאת תורת הצרעת
    parashah: Metzora
