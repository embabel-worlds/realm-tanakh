  data:
    osis: Lev.19.31
    scripture: tanakh
    name: Tanakh Leviticus 19:31
    ref: Leviticus 19:31
    book: Lev
    section: torah
    chapter: 19
    verse: 31
    ordinal: 3310
    text: 'Turn ye not unto the ghosts, nor unto familiar spirits; seek them not out, to be defiled by them: I am the LORD your God.'
    translation: JPS 1917
    original: אַל־תִּפְנוּ אֶל־הָאֹבֹת וְאֶל־הַיִּדְּעֹנִים אַל־תְּבַקְשׁוּ לְטָמְאָה בָהֶם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: אל תפנו אל האבת ואל הידענים אל תבקשו לטמאה בהם אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:31
    kjvOsis:
    - Lev.19.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.32
    scripture: tanakh
    name: Tanakh Leviticus 19:32
    ref: Leviticus 19:32
    book: Lev
    section: torah
    chapter: 19
    verse: 32
    ordinal: 3311
    text: 'Thou shalt rise up before the hoary head, and honour the face of the old man, and thou shalt fear thy God: I am the LORD.'
    translation: JPS 1917
    original: מִפְּנֵי שֵׂיבָה תָּקוּם וְהָדַרְתָּ פְּנֵי זָקֵן וְיָרֵאתָ מֵּאֱלֹהֶיךָ אֲנִי יְהוָה׃
    hebrewPlain: מפני שיבה תקום והדרת פני זקן ויראת מאלהיך אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:32
    kjvOsis:
    - Lev.19.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.33
    scripture: tanakh
    name: Tanakh Leviticus 19:33
    ref: Leviticus 19:33
    book: Lev
    section: torah
    chapter: 19
    verse: 33
    ordinal: 3312
    text: And if a stranger sojourn with thee in your land, ye shall not do him wrong.
    translation: JPS 1917
    original: וְכִי־יָגוּר אִתְּךָ גֵּר בְּאַרְצְכֶם לֹא תוֹנוּ אֹתוֹ׃
    hebrewPlain: וכי יגור אתך גר בארצכם לא תונו אתו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:33
    kjvOsis:
    - Lev.19.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.34
    scripture: tanakh
    name: Tanakh Leviticus 19:34
    ref: Leviticus 19:34
    book: Lev
    section: torah
    chapter: 19
    verse: 34
    ordinal: 3313
    text: 'The stranger that sojourneth with you shall be unto you as the home-born among you, and thou shalt love him as thyself; for ye were strangers in the land of Egypt: I am the LORD your God.'
    translation: JPS 1917
    original: כְּאֶזְרָח מִכֶּם יִהְיֶה לָכֶם הַגֵּר הַגָּר אִתְּכֶם וְאָהַבְתָּ לוֹ כָּמוֹךָ כִּי־גֵרִים הֱיִיתֶם בְּאֶרֶץ מִצְרָיִם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: כאזרח מכם יהיה לכם הגר הגר אתכם ואהבת לו כמוך כי גרים הייתם בארץ מצרים אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:34
    kjvOsis:
    - Lev.19.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.35
    scripture: tanakh
    name: Tanakh Leviticus 19:35
    ref: Leviticus 19:35
    book: Lev
    section: torah
    chapter: 19
    verse: 35
    ordinal: 3314
    text: Ye shall do no unrighteousness in judgment, in meteyard, in weight, or in measure.
    translation: JPS 1917
    original: לֹא־תַעֲשׂוּ עָוֶל בַּמִּשְׁפָּט בַּמִּדָּה בַּמִּשְׁקָל וּבַמְּשׂוּרָה׃
    hebrewPlain: לא תעשו עול במשפט במדה במשקל ובמשורה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:35
    kjvOsis:
    - Lev.19.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.36
    scripture: tanakh
    name: Tanakh Leviticus 19:36
    ref: Leviticus 19:36
    book: Lev
    section: torah
    chapter: 19
    verse: 36
    ordinal: 3315
    text: 'Just balances, just weights, a just ephah, and a just hin, shall ye have: I am the LORD your God, who brought you out of the land of Egypt.'
    translation: JPS 1917
    original: מֹאזְנֵי צֶדֶק אַבְנֵי־צֶדֶק אֵיפַת צֶדֶק וְהִין צֶדֶק יִהְיֶה לָכֶם אֲנִי יְהוָה אֱלֹהֵיכֶם אֲשֶׁר־הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם׃
    hebrewPlain: מאזני צדק אבני צדק איפת צדק והין צדק יהיה לכם אני יהוה אלהיכם אשר הוצאתי אתכם מארץ מצרים
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:36
    kjvOsis:
    - Lev.19.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.37
    scripture: tanakh
    name: Tanakh Leviticus 19:37
    ref: Leviticus 19:37
    book: Lev
    section: torah
    chapter: 19
    verse: 37
    ordinal: 3316
    text: 'And ye shall observe all My statutes, and all Mine ordinances, and do them: I am the LORD.'
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם אֶת־כָּל־חֻקֹּתַי וְאֶת־כָּל־מִשְׁפָּטַי וַעֲשִׂיתֶם אֹתָם אֲנִי יְהוָה׃
    hebrewPlain: ושמרתם את כל חקתי ואת כל משפטי ועשיתם אתם אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:37
    kjvOsis:
    - Lev.19.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.1
    scripture: tanakh
    name: Tanakh Leviticus 20:1
    ref: Leviticus 20:1
    book: Lev
    section: torah
    chapter: 20
    verse: 1
    ordinal: 3317
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:1
    kjvOsis:
    - Lev.20.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.2
    scripture: tanakh
    name: Tanakh Leviticus 20:2
    ref: Leviticus 20:2
    book: Lev
    section: torah
    chapter: 20
    verse: 2
    ordinal: 3318
    text: 'Moreover, thou shalt say to the children of Israel: Whosoever he be of the children of Israel, or of the strangers that sojourn in Israel, that giveth of his seed unto Molech; he shall surely be put to death; the people of the land shall stone him with stones.'
    translation: JPS 1917
    original: וְאֶל־בְּנֵי יִשְׂרָאֵל תֹּאמַר אִישׁ אִישׁ מִבְּנֵי יִשְׂרָאֵל וּמִן־הַגֵּר הַגָּר בְּיִשְׂרָאֵל אֲשֶׁר יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ מוֹת יוּמָת עַם הָאָרֶץ יִרְגְּמֻהוּ בָאָבֶן׃
    hebrewPlain: ואל בני ישראל תאמר איש איש מבני ישראל ומן הגר הגר בישראל אשר יתן מזרעו למלך מות יומת עם הארץ ירגמהו באבן
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:2
    kjvOsis:
    - Lev.20.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.3
    scripture: tanakh
    name: Tanakh Leviticus 20:3
    ref: Leviticus 20:3
    book: Lev
    section: torah
    chapter: 20
    verse: 3
    ordinal: 3319
    text: I also will set My face against that man, and will cut him off from among his people, because he hath given of his seed unto Molech, to defile My sanctuary, and to profane My holy name.
    translation: JPS 1917
    original: וַאֲנִי אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ כִּי מִזַּרְעוֹ נָתַן לַמֹּלֶךְ לְמַעַן טַמֵּא אֶת־מִקְדָּשִׁי וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי׃
    hebrewPlain: ואני אתן את פני באיש ההוא והכרתי אתו מקרב עמו כי מזרעו נתן למלך למען טמא את מקדשי ולחלל את שם קדשי
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:3
    kjvOsis:
    - Lev.20.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.4
    scripture: tanakh
    name: Tanakh Leviticus 20:4
    ref: Leviticus 20:4
    book: Lev
    section: torah
    chapter: 20
    verse: 4
    ordinal: 3320
    text: And if the people of the land do at all hide their eyes from that man, when he giveth of his seed unto Molech, and put him not to death;
    translation: JPS 1917
    original: וְאִם הַעְלֵם יַעְלִימוּ עַם הָאָרֶץ אֶת־עֵינֵיהֶם מִן־הָאִישׁ הַהוּא בְּתִתּוֹ מִזַּרְעוֹ לַמֹּלֶךְ לְבִלְתִּי הָמִית אֹתוֹ׃
    hebrewPlain: ואם העלם יעלימו עם הארץ את עיניהם מן האיש ההוא בתתו מזרעו למלך לבלתי המית אתו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:4
    kjvOsis:
    - Lev.20.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.5
    scripture: tanakh
    name: Tanakh Leviticus 20:5
    ref: Leviticus 20:5
    book: Lev
    section: torah
    chapter: 20
    verse: 5
    ordinal: 3321
    text: then I will set My face against that man, and against his family, and will cut him off, and all that go astray after him, to go astray after Molech, from among their people.
    translation: JPS 1917
    original: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי בָּאִישׁ הַהוּא וּבְמִשְׁפַּחְתּוֹ וְהִכְרַתִּי אֹתוֹ וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ מִקֶּרֶב עַמָּם׃
    hebrewPlain: ושמתי אני את פני באיש ההוא ובמשפחתו והכרתי אתו ואת כל הזנים אחריו לזנות אחרי המלך מקרב עמם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:5
    kjvOsis:
    - Lev.20.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.6
    scripture: tanakh
    name: Tanakh Leviticus 20:6
    ref: Leviticus 20:6
    book: Lev
    section: torah
    chapter: 20
    verse: 6
    ordinal: 3322
    text: And the soul that turneth unto the ghosts, and unto the familiar spirits, to go astray after them, I will even set My face against that soul, and will cut him off from among his people.
    translation: JPS 1917
    original: וְהַנֶּפֶשׁ אֲשֶׁר תִּפְנֶה אֶל־הָאֹבֹת וְאֶל־הַיִּדְּעֹנִים לִזְנוֹת אַחֲרֵיהֶם וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ׃
    hebrewPlain: והנפש אשר תפנה אל האבת ואל הידענים לזנות אחריהם ונתתי את פני בנפש ההוא והכרתי אתו מקרב עמו
    parashah: Kedoshim
    kjvRefs:
