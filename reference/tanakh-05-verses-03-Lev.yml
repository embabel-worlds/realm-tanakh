- type: TanakhVerse
  data:
    osis: Lev.13.51
    scripture: tanakh
    name: Tanakh Leviticus 13:51
    ref: Leviticus 13:51
    book: Lev
    section: torah
    chapter: 13
    verse: 51
    ordinal: 3101
    text: 'And he shall look on the plague on the seventh day: if the plague be spread in the garment, or in the warp, or in the woof, or in the skin, whatever service skin is used for, the plague is a malignant leprosy: it is unclean.'
    translation: JPS 1917
    original: וְרָאָה אֶת־הַנֶּגַע בַּיּוֹם הַשְּׁבִיעִי כִּי־פָשָׂה הַנֶּגַע בַּבֶּגֶד אוֹ־בַשְּׁתִי אוֹ־בָעֵרֶב אוֹ בָעוֹר לְכֹל אֲשֶׁר־יֵעָשֶׂה הָעוֹר לִמְלָאכָה צָרַעַת מַמְאֶרֶת הַנֶּגַע טָמֵא הוּא׃
    hebrewPlain: וראה את הנגע ביום השביעי כי פשה הנגע בבגד או בשתי או בערב או בעור לכל אשר יעשה העור למלאכה צרעת ממארת הנגע טמא הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:51
    kjvOsis:
    - Lev.13.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.52
    scripture: tanakh
    name: Tanakh Leviticus 13:52
    ref: Leviticus 13:52
    book: Lev
    section: torah
    chapter: 13
    verse: 52
    ordinal: 3102
    text: And he shall burn the garment, or the warp, or the woof, whether it be of wool or of linen, or any thing of skin, wherein the plague is; for it is a malignant leprosy; it shall be burnt in the fire.
    translation: JPS 1917
    original: וְשָׂרַף אֶת־הַבֶּגֶד אוֹ אֶת־הַשְּׁתִי אוֹ אֶת־הָעֵרֶב בַּצֶּמֶר אוֹ בַפִּשְׁתִּים אוֹ אֶת־כָּל־כְּלִי הָעוֹר אֲשֶׁר־יִהְיֶה בוֹ הַנָּגַע כִּי־צָרַעַת מַמְאֶרֶת הִוא בָּאֵשׁ תִּשָּׂרֵף׃
    hebrewPlain: ושרף את הבגד או את השתי או את הערב בצמר או בפשתים או את כל כלי העור אשר יהיה בו הנגע כי צרעת ממארת הוא באש תשרף
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:52
    kjvOsis:
    - Lev.13.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.53
    scripture: tanakh
    name: Tanakh Leviticus 13:53
    ref: Leviticus 13:53
    book: Lev
    section: torah
    chapter: 13
    verse: 53
    ordinal: 3103
    text: And if the priest shall look, and, behold, the plague be not spread in the garment, or in the warp, or in the woof, or in any thing of skin;
    translation: JPS 1917
    original: וְאִם יִרְאֶה הַכֹּהֵן וְהִנֵּה לֹא־פָשָׂה הַנֶּגַע בַּבֶּגֶד אוֹ בַשְּׁתִי אוֹ בָעֵרֶב אוֹ בְּכָל־כְּלִי־עוֹר׃
    hebrewPlain: ואם יראה הכהן והנה לא פשה הנגע בבגד או בשתי או בערב או בכל כלי עור
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:53
    kjvOsis:
    - Lev.13.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.54
    scripture: tanakh
    name: Tanakh Leviticus 13:54
    ref: Leviticus 13:54
    book: Lev
    section: torah
    chapter: 13
    verse: 54
    ordinal: 3104
    text: then the priest shall command that they wash the thing wherein the plague is, and he shall shut it up seven days more.
    translation: JPS 1917
    original: וְצִוָּה הַכֹּהֵן וְכִבְּסוּ אֵת אֲשֶׁר־בּוֹ הַנָּגַע וְהִסְגִּירוֹ שִׁבְעַת־יָמִים שֵׁנִית׃
    hebrewPlain: וצוה הכהן וכבסו את אשר בו הנגע והסגירו שבעת ימים שנית
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:54
    kjvOsis:
    - Lev.13.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.55
    scripture: tanakh
    name: Tanakh Leviticus 13:55
    ref: Leviticus 13:55
    book: Lev
    section: torah
    chapter: 13
    verse: 55
    ordinal: 3105
    text: And the priest shall look, after that the plague is washed; and, behold, if the plague have not changed its colour, and the plague be not spread, it is unclean; thou shalt burn it in the fire; it is a fret, whether the bareness be within or without.
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן אַחֲרֵי הֻכַּבֵּס אֶת־הַנֶּגַע וְהִנֵּה לֹא־הָפַךְ הַנֶּגַע אֶת־עֵינוֹ וְהַנֶּגַע לֹא־פָשָׂה טָמֵא הוּא בָּאֵשׁ תִּשְׂרְפֶנּוּ פְּחֶתֶת הִוא בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ׃
    hebrewPlain: וראה הכהן אחרי הכבס את הנגע והנה לא הפך הנגע את עינו והנגע לא פשה טמא הוא באש תשרפנו פחתת הוא בקרחתו או בגבחתו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:55
    kjvOsis:
    - Lev.13.55
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.56
    scripture: tanakh
    name: Tanakh Leviticus 13:56
    ref: Leviticus 13:56
    book: Lev
    section: torah
    chapter: 13
    verse: 56
    ordinal: 3106
    text: And if the priest look, and, behold, the plague be dim after the washing thereof, then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof.
    translation: JPS 1917
    original: וְאִם רָאָה הַכֹּהֵן וְהִנֵּה כֵּהָה הַנֶּגַע אַחֲרֵי הֻכַּבֵּס אֹתוֹ וְקָרַע אֹתוֹ מִן־הַבֶּגֶד אוֹ מִן־הָעוֹר אוֹ מִן־הַשְּׁתִי אוֹ מִן־הָעֵרֶב׃
    hebrewPlain: ואם ראה הכהן והנה כהה הנגע אחרי הכבס אתו וקרע אתו מן הבגד או מן העור או מן השתי או מן הערב
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:56
    kjvOsis:
    - Lev.13.56
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.57
    scripture: tanakh
    name: Tanakh Leviticus 13:57
    ref: Leviticus 13:57
    book: Lev
    section: torah
    chapter: 13
    verse: 57
    ordinal: 3107
    text: And if it appear still in the garment, or in the warp, or in the woof, or in any thing of skin, it is breaking out, thou shalt burn that wherein the plague is with fire.
    translation: JPS 1917
    original: וְאִם־תֵּרָאֶה עוֹד בַּבֶּגֶד אוֹ־בַשְּׁתִי אוֹ־בָעֵרֶב אוֹ בְכָל־כְּלִי־עוֹר פֹּרַחַת הִוא בָּאֵשׁ תִּשְׂרְפֶנּוּ אֵת אֲשֶׁר־בּוֹ הַנָּגַע׃
    hebrewPlain: ואם תראה עוד בבגד או בשתי או בערב או בכל כלי עור פרחת הוא באש תשרפנו את אשר בו הנגע
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:57
    kjvOsis:
    - Lev.13.57
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.58
    scripture: tanakh
    name: Tanakh Leviticus 13:58
    ref: Leviticus 13:58
    book: Lev
    section: torah
    chapter: 13
    verse: 58
    ordinal: 3108
    text: And the garment, or the warp, or the woof, or whatsoever thing of skin it be, which thou shalt wash, if the plague be departed from them, then it shall be washed the second time, and shall be clean.
    translation: JPS 1917
    original: וְהַבֶּגֶד אוֹ־הַשְּׁתִי אוֹ־הָעֵרֶב אוֹ־כָל־כְּלִי הָעוֹר אֲשֶׁר תְּכַבֵּס וְסָר מֵהֶם הַנָּגַע וְכֻבַּס שֵׁנִית וְטָהֵר׃
    hebrewPlain: והבגד או השתי או הערב או כל כלי העור אשר תכבס וסר מהם הנגע וכבס שנית וטהר
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:58
    kjvOsis:
    - Lev.13.58
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.13.59
    scripture: tanakh
    name: Tanakh Leviticus 13:59
    ref: Leviticus 13:59
    book: Lev
    section: torah
    chapter: 13
    verse: 59
    ordinal: 3109
    text: This is the law of the plague of leprosy in a garment of wool or linen, or in the warp, or in the woof, or in any thing of skin, to pronounce it clean, or to pronounce it unclean.
    translation: JPS 1917
    original: זֹאת תּוֹרַת נֶגַע־צָרַעַת בֶּגֶד הַצֶּמֶר אוֹ הַפִּשְׁתִּים אוֹ הַשְּׁתִי אוֹ הָעֵרֶב אוֹ כָּל־כְּלִי־עוֹר לְטַהֲרוֹ אוֹ לְטַמְּאוֹ׃
    hebrewPlain: זאת תורת נגע צרעת בגד הצמר או הפשתים או השתי או הערב או כל כלי עור לטהרו או לטמאו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:59
    kjvOsis:
    - Lev.13.59
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.14.1
    scripture: tanakh
    name: Tanakh Leviticus 14:1
    ref: Leviticus 14:1
    book: Lev
    section: torah
    chapter: 14
    verse: 1
    ordinal: 3110
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:1
    kjvOsis:
    - Lev.14.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.2
    scripture: tanakh
    name: Tanakh Leviticus 14:2
    ref: Leviticus 14:2
    book: Lev
    section: torah
    chapter: 14
    verse: 2
    ordinal: 3111
    text: 'This shall be the law of the leper in the day of his cleansing: he shall be brought unto the priest.'
    translation: JPS 1917
    original: זֹאת תִּהְיֶה תּוֹרַת הַמְּצֹרָע בְּיוֹם טָהֳרָתוֹ וְהוּבָא אֶל־הַכֹּהֵן׃
    hebrewPlain: זאת תהיה תורת המצרע ביום טהרתו והובא אל הכהן
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:2
    kjvOsis:
    - Lev.14.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.3
    scripture: tanakh
    name: Tanakh Leviticus 14:3
    ref: Leviticus 14:3
    book: Lev
    section: torah
    chapter: 14
    verse: 3
    ordinal: 3112
    text: And the priest shall go forth out of the camp; and the priest shall look, and, behold, if the plague of leprosy be healed in the leper;
    translation: JPS 1917
    original: וְיָצָא הַכֹּהֵן אֶל־מִחוּץ לַמַּחֲנֶה וְרָאָה הַכֹּהֵן וְהִנֵּה נִרְפָּא נֶגַע־הַצָּרַעַת מִן־הַצָּרוּעַ׃
    hebrewPlain: ויצא הכהן אל מחוץ למחנה וראה הכהן והנה נרפא נגע הצרעת מן הצרוע
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:3
    kjvOsis:
    - Lev.14.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.4
    scripture: tanakh
    name: Tanakh Leviticus 14:4
    ref: Leviticus 14:4
    book: Lev
    section: torah
    chapter: 14
    verse: 4
    ordinal: 3113
    text: then shall the priest command to take for him that is to be cleansed two living clean birds, and cedar-wood, and scarlet, and hyssop.
    translation: JPS 1917
    original: וְצִוָּה הַכֹּהֵן וְלָקַח לַמִּטַּהֵר שְׁתֵּי־צִפֳּרִים חַיּוֹת טְהֹרוֹת וְעֵץ אֶרֶז וּשְׁנִי תוֹלַעַת וְאֵזֹב׃
    hebrewPlain: וצוה הכהן ולקח למטהר שתי צפרים חיות טהרות ועץ ארז ושני תולעת ואזב
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:4
    kjvOsis:
    - Lev.14.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.5
    scripture: tanakh
    name: Tanakh Leviticus 14:5
    ref: Leviticus 14:5
    book: Lev
    section: torah
    chapter: 14
    verse: 5
    ordinal: 3114
    text: And the priest shall command to kill one of the birds in an earthen vessel over running water.
    translation: JPS 1917
    original: וְצִוָּה הַכֹּהֵן וְשָׁחַט אֶת־הַצִּפּוֹר הָאֶחָת אֶל־כְּלִי־חֶרֶשׂ עַל־מַיִם חַיִּים׃
    hebrewPlain: וצוה הכהן ושחט את הצפור האחת אל כלי חרש על מים חיים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:5
    kjvOsis:
    - Lev.14.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.6
    scripture: tanakh
    name: Tanakh Leviticus 14:6
    ref: Leviticus 14:6
    book: Lev
    section: torah
    chapter: 14
    verse: 6
    ordinal: 3115
    text: As for the living bird, he shall take it, and the cedar-wood, and the scarlet, and the hyssop, and shall dip them and the living bird in the blood of the bird that was killed over the running water.
    translation: JPS 1917
    original: אֶת־הַצִּפֹּר הַחַיָּה יִקַּח אֹתָהּ וְאֶת־עֵץ הָאֶרֶז וְאֶת־שְׁנִי הַתּוֹלַעַת וְאֶת־הָאֵזֹב וְטָבַל אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה בְּדַם הַצִּפֹּר הַשְּׁחֻטָה עַל הַמַּיִם הַחַיִּים׃
    hebrewPlain: את הצפר החיה יקח אתה ואת עץ הארז ואת שני התולעת ואת האזב וטבל אותם ואת הצפר החיה בדם הצפר השחטה על המים החיים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:6
    kjvOsis:
    - Lev.14.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.7
    scripture: tanakh
    name: Tanakh Leviticus 14:7
    ref: Leviticus 14:7
    book: Lev
    section: torah
    chapter: 14
    verse: 7
    ordinal: 3116
    text: And he shall sprinkle upon him that is to be cleansed from the leprosy seven times, and shall pronounce him clean, and shall let go the living bird into the open field.
    translation: JPS 1917
    original: וְהִזָּה עַל הַמִּטַּהֵר מִן־הַצָּרַעַת שֶׁבַע פְּעָמִים וְטִהֲרוֹ וְשִׁלַּח אֶת־הַצִּפֹּר הַחַיָּה עַל־פְּנֵי הַשָּׂדֶה׃
    hebrewPlain: והזה על המטהר מן הצרעת שבע פעמים וטהרו ושלח את הצפר החיה על פני השדה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:7
    kjvOsis:
    - Lev.14.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.8
    scripture: tanakh
    name: Tanakh Leviticus 14:8
    ref: Leviticus 14:8
    book: Lev
    section: torah
    chapter: 14
    verse: 8
    ordinal: 3117
    text: And he that is to be cleansed shall wash his clothes, and shave off all his hair, and bathe himself in water, and he shall be clean; and after that he may come into the camp, but shall dwell outside his tent seven days.
    translation: JPS 1917
    original: וְכִבֶּס הַמִּטַּהֵר אֶת־בְּגָדָיו וְגִלַּח אֶת־כָּל־שְׂעָרוֹ וְרָחַץ בַּמַּיִם וְטָהֵר וְאַחַר יָבוֹא אֶל־הַמַּחֲנֶה וְיָשַׁב מִחוּץ לְאָהֳלוֹ שִׁבְעַת יָמִים׃
    hebrewPlain: וכבס המטהר את בגדיו וגלח את כל שערו ורחץ במים וטהר ואחר יבוא אל המחנה וישב מחוץ לאהלו שבעת ימים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:8
    kjvOsis:
    - Lev.14.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.9
    scripture: tanakh
    name: Tanakh Leviticus 14:9
    ref: Leviticus 14:9
    book: Lev
    section: torah
    chapter: 14
    verse: 9
    ordinal: 3118
    text: And it shall be on the seventh day, that he shall shave all his hair off his head and his beard and his eyebrows, even all his hair he shall shave off; and he shall wash his clothes, and he shall bathe his flesh in water, and he shall be clean.
    translation: JPS 1917
    original: וְהָיָה בַיּוֹם הַשְּׁבִיעִי יְגַלַּח אֶת־כָּל־שְׂעָרוֹ אֶת־רֹאשׁוֹ וְאֶת־זְקָנוֹ וְאֵת גַּבֹּת עֵינָיו וְאֶת־כָּל־שְׂעָרוֹ יְגַלֵּחַ וְכִבֶּס אֶת־בְּגָדָיו וְרָחַץ אֶת־בְּשָׂרוֹ בַּמַּיִם וְטָהֵר׃
    hebrewPlain: והיה ביום השביעי יגלח את כל שערו את ראשו ואת זקנו ואת גבת עיניו ואת כל שערו יגלח וכבס את בגדיו ורחץ את בשרו במים וטהר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:9
    kjvOsis:
    - Lev.14.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.10
    scripture: tanakh
    name: Tanakh Leviticus 14:10
    ref: Leviticus 14:10
    book: Lev
    section: torah
    chapter: 14
    verse: 10
    ordinal: 3119
    text: And on the eighth day he shall take two he-lambs without blemish, and one ewe-lamb of the first year without blemish, and three tenth parts of an ephah of fine flour for a meal-offering, mingled with oil, and one log of oil.
    translation: JPS 1917
    original: וּבַיּוֹם הַשְּׁמִינִי יִקַּח שְׁנֵי־כְבָשִׂים תְּמִימִים וְכַבְשָׂה אַחַת בַּת־שְׁנָתָהּ תְּמִימָה וּשְׁלֹשָׁה עֶשְׂרֹנִים סֹלֶת מִנְחָה בְּלוּלָה בַשֶּׁמֶן וְלֹג אֶחָד שָׁמֶן׃
    hebrewPlain: וביום השמיני יקח שני כבשים תמימים וכבשה אחת בת שנתה תמימה ושלשה עשרנים סלת מנחה בלולה בשמן ולג אחד שמן
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:10
    kjvOsis:
    - Lev.14.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.11
    scripture: tanakh
    name: Tanakh Leviticus 14:11
    ref: Leviticus 14:11
    book: Lev
    section: torah
    chapter: 14
    verse: 11
    ordinal: 3120
    text: And the priest that cleanseth him shall set the man that is to be cleansed, and those things, before the LORD, at the door of the tent of meeting.
    translation: JPS 1917
    original: וְהֶעֱמִיד הַכֹּהֵן הַמְטַהֵר אֵת הָאִישׁ הַמִּטַּהֵר וְאֹתָם לִפְנֵי יְהוָה פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: והעמיד הכהן המטהר את האיש המטהר ואתם לפני יהוה פתח אהל מועד
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:11
    kjvOsis:
    - Lev.14.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.12
    scripture: tanakh
    name: Tanakh Leviticus 14:12
    ref: Leviticus 14:12
    book: Lev
    section: torah
    chapter: 14
    verse: 12
    ordinal: 3121
    text: And the priest shall take one of the he-lambs, and offer him for a guilt-offering, and the log of oil, and wave them for a wave-offering before the LORD.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן אֶת־הַכֶּבֶשׂ הָאֶחָד וְהִקְרִיב אֹתוֹ לְאָשָׁם וְאֶת־לֹג הַשָּׁמֶן וְהֵנִיף אֹתָם תְּנוּפָה לִפְנֵי יְהוָה׃
    hebrewPlain: ולקח הכהן את הכבש האחד והקריב אתו לאשם ואת לג השמן והניף אתם תנופה לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:12
    kjvOsis:
    - Lev.14.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.13
    scripture: tanakh
    name: Tanakh Leviticus 14:13
    ref: Leviticus 14:13
    book: Lev
    section: torah
    chapter: 14
    verse: 13
    ordinal: 3122
    text: And he shall kill the he-lamb in the place where they kill the sin-offering and the burnt-offering, in the place of the sanctuary; for as the sin-offering is the priest’s, so is the guilt-offering; it is most holy.
    translation: JPS 1917
    original: וְשָׁחַט אֶת־הַכֶּבֶשׂ בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת־הַחַטָּאת וְאֶת־הָעֹלָה בִּמְקוֹם הַקֹּדֶשׁ כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן קֹדֶשׁ קָדָשִׁים הוּא׃
    hebrewPlain: ושחט את הכבש במקום אשר ישחט את החטאת ואת העלה במקום הקדש כי כחטאת האשם הוא לכהן קדש קדשים הוא
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:13
    kjvOsis:
    - Lev.14.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.14
    scripture: tanakh
    name: Tanakh Leviticus 14:14
    ref: Leviticus 14:14
    book: Lev
    section: torah
    chapter: 14
    verse: 14
    ordinal: 3123
    text: And the priest shall take of the blood of the guilt-offering, and the priest shall put it upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן מִדַּם הָאָשָׁם וְנָתַן הַכֹּהֵן עַל־תְּנוּךְ אֹזֶן הַמִּטַּהֵר הַיְמָנִית וְעַל־בֹּהֶן יָדוֹ הַיְמָנִית וְעַל־בֹּהֶן רַגְלוֹ הַיְמָנִית׃
    hebrewPlain: ולקח הכהן מדם האשם ונתן הכהן על תנוך אזן המטהר הימנית ועל בהן ידו הימנית ועל בהן רגלו הימנית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:14
    kjvOsis:
    - Lev.14.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.15
    scripture: tanakh
    name: Tanakh Leviticus 14:15
    ref: Leviticus 14:15
    book: Lev
    section: torah
    chapter: 14
    verse: 15
    ordinal: 3124
    text: And the priest shall take of the log of oil, and pour it into the palm of his own left hand.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן מִלֹּג הַשָּׁמֶן וְיָצַק עַל־כַּף הַכֹּהֵן הַשְּׂמָאלִית׃
    hebrewPlain: ולקח הכהן מלג השמן ויצק על כף הכהן השמאלית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:15
    kjvOsis:
    - Lev.14.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.16
    scripture: tanakh
    name: Tanakh Leviticus 14:16
    ref: Leviticus 14:16
    book: Lev
    section: torah
    chapter: 14
    verse: 16
    ordinal: 3125
    text: And the priest shall dip his right finger in the oil that is in his left hand, and shall sprinkle of the oil with his finger seven times before the LORD.
    translation: JPS 1917
    original: וְטָבַל הַכֹּהֵן אֶת־אֶצְבָּעוֹ הַיְמָנִית מִן־הַשֶּׁמֶן אֲשֶׁר עַל־כַּפּוֹ הַשְּׂמָאלִית וְהִזָּה מִן־הַשֶּׁמֶן בְּאֶצְבָּעוֹ שֶׁבַע פְּעָמִים לִפְנֵי יְהוָה׃
    hebrewPlain: וטבל הכהן את אצבעו הימנית מן השמן אשר על כפו השמאלית והזה מן השמן באצבעו שבע פעמים לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:16
    kjvOsis:
    - Lev.14.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.17
    scripture: tanakh
    name: Tanakh Leviticus 14:17
    ref: Leviticus 14:17
    book: Lev
    section: torah
    chapter: 14
    verse: 17
    ordinal: 3126
    text: And of the rest of the oil that is in his hand shall the priest put upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, upon the blood of the guilt-offering.
    translation: JPS 1917
    original: וּמִיֶּתֶר הַשֶּׁמֶן אֲשֶׁר עַל־כַּפּוֹ יִתֵּן הַכֹּהֵן עַל־תְּנוּךְ אֹזֶן הַמִּטַּהֵר הַיְמָנִית וְעַל־בֹּהֶן יָדוֹ הַיְמָנִית וְעַל־בֹּהֶן רַגְלוֹ הַיְמָנִית עַל דַּם הָאָשָׁם׃
    hebrewPlain: ומיתר השמן אשר על כפו יתן הכהן על תנוך אזן המטהר הימנית ועל בהן ידו הימנית ועל בהן רגלו הימנית על דם האשם
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:17
    kjvOsis:
    - Lev.14.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.18
    scripture: tanakh
    name: Tanakh Leviticus 14:18
    ref: Leviticus 14:18
    book: Lev
    section: torah
    chapter: 14
    verse: 18
    ordinal: 3127
    text: And the rest of the oil that is in the priest’s hand he shall put upon the head of him that is to be cleansed; and the priest shall make atonement for him before the LORD.
    translation: JPS 1917
    original: וְהַנּוֹתָר בַּשֶּׁמֶן אֲשֶׁר עַל־כַּף הַכֹּהֵן יִתֵּן עַל־רֹאשׁ הַמִּטַּהֵר וְכִפֶּר עָלָיו הַכֹּהֵן לִפְנֵי יְהוָה׃
    hebrewPlain: והנותר בשמן אשר על כף הכהן יתן על ראש המטהר וכפר עליו הכהן לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:18
    kjvOsis:
    - Lev.14.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.19
    scripture: tanakh
    name: Tanakh Leviticus 14:19
    ref: Leviticus 14:19
    book: Lev
    section: torah
    chapter: 14
    verse: 19
    ordinal: 3128
    text: And the priest shall offer the sin-offering, and make atonement for him that is to be cleansed because of his uncleanness; and afterward he shall kill the burnt-offering.
    translation: JPS 1917
    original: וְעָשָׂה הַכֹּהֵן אֶת־הַחַטָּאת וְכִפֶּר עַל־הַמִּטַּהֵר מִטֻּמְאָתוֹ וְאַחַר יִשְׁחַט אֶת־הָעֹלָה׃
    hebrewPlain: ועשה הכהן את החטאת וכפר על המטהר מטמאתו ואחר ישחט את העלה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:19
    kjvOsis:
    - Lev.14.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.20
    scripture: tanakh
    name: Tanakh Leviticus 14:20
    ref: Leviticus 14:20
    book: Lev
    section: torah
    chapter: 14
    verse: 20
    ordinal: 3129
    text: And the priest shall offer the burnt-offering and the meal-offering upon the altar; and the priest shall make atonement for him, and he shall be clean.
    translation: JPS 1917
    original: וְהֶעֱלָה הַכֹּהֵן אֶת־הָעֹלָה וְאֶת־הַמִּנְחָה הַמִּזְבֵּחָה וְכִפֶּר עָלָיו הַכֹּהֵן וְטָהֵר׃
    hebrewPlain: והעלה הכהן את העלה ואת המנחה המזבחה וכפר עליו הכהן וטהר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:20
    kjvOsis:
    - Lev.14.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.21
    scripture: tanakh
    name: Tanakh Leviticus 14:21
    ref: Leviticus 14:21
    book: Lev
    section: torah
    chapter: 14
    verse: 21
    ordinal: 3130
    text: And if he be poor, and his means suffice not, then he shall take one he-lamb for a guilt-offering to be waved, to make atonement for him, and one tenth part of an ephah of fine flour mingled with oil for a meal-offering, and a log of oil;
    translation: JPS 1917
    original: וְאִם־דַּל הוּא וְאֵין יָדוֹ מַשֶּׂגֶת וְלָקַח כֶּבֶשׂ אֶחָד אָשָׁם לִתְנוּפָה לְכַפֵּר עָלָיו וְעִשָּׂרוֹן סֹלֶת אֶחָד בָּלוּל בַּשֶּׁמֶן לְמִנְחָה וְלֹג שָׁמֶן׃
    hebrewPlain: ואם דל הוא ואין ידו משגת ולקח כבש אחד אשם לתנופה לכפר עליו ועשרון סלת אחד בלול בשמן למנחה ולג שמן
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:21
    kjvOsis:
    - Lev.14.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.22
    scripture: tanakh
    name: Tanakh Leviticus 14:22
    ref: Leviticus 14:22
    book: Lev
    section: torah
    chapter: 14
    verse: 22
    ordinal: 3131
    text: and two turtle-doves, or two young pigeons, such as his means suffice for; and the one shall be a sin-offering, and the other a burnt-offering.
    translation: JPS 1917
    original: וּשְׁתֵּי תֹרִים אוֹ שְׁנֵי בְּנֵי יוֹנָה אֲשֶׁר תַּשִּׂיג יָדוֹ וְהָיָה אֶחָד חַטָּאת וְהָאֶחָד עֹלָה׃
    hebrewPlain: ושתי תרים או שני בני יונה אשר תשיג ידו והיה אחד חטאת והאחד עלה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:22
    kjvOsis:
    - Lev.14.22
