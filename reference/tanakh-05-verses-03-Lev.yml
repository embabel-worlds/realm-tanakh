  data:
    osis: Lev.7.7
    scripture: tanakh
    name: Tanakh Leviticus 7:7
    ref: Leviticus 7:7
    book: Lev
    section: torah
    chapter: 7
    verse: 7
    ordinal: 2884
    text: As is the sin-offering, so is the guilt-offering; there is one law for them; the priest that maketh atonement therewith, he shall have it.
    translation: JPS 1917
    original: כַּחַטָּאת כָּאָשָׁם תּוֹרָה אַחַת לָהֶם הַכֹּהֵן אֲשֶׁר יְכַפֶּר־בּוֹ לוֹ יִהְיֶה׃
    hebrewPlain: כחטאת כאשם תורה אחת להם הכהן אשר יכפר בו לו יהיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:7
    kjvOsis:
    - Lev.7.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.8
    scripture: tanakh
    name: Tanakh Leviticus 7:8
    ref: Leviticus 7:8
    book: Lev
    section: torah
    chapter: 7
    verse: 8
    ordinal: 2885
    text: And the priest that offereth any man’s burnt-offering, even the priest shall have to himself the skin of the burnt-offering which he hath offered.
    translation: JPS 1917
    original: וְהַכֹּהֵן הַמַּקְרִיב אֶת־עֹלַת אִישׁ עוֹר הָעֹלָה אֲשֶׁר הִקְרִיב לַכֹּהֵן לוֹ יִהְיֶה׃
    hebrewPlain: והכהן המקריב את עלת איש עור העלה אשר הקריב לכהן לו יהיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:8
    kjvOsis:
    - Lev.7.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.9
    scripture: tanakh
    name: Tanakh Leviticus 7:9
    ref: Leviticus 7:9
    book: Lev
    section: torah
    chapter: 7
    verse: 9
    ordinal: 2886
    text: And every meal-offering that is baked in the oven, and all that is dressed in the stewing-pan, and on the griddle, shall be the priest’s that offereth it.
    translation: JPS 1917
    original: וְכָל־מִנְחָה אֲשֶׁר תֵּאָפֶה בַּתַּנּוּר וְכָל־נַעֲשָׂה בַמַּרְחֶשֶׁת וְעַל־מַחֲבַת לַכֹּהֵן הַמַּקְרִיב אֹתָהּ לוֹ תִהְיֶה׃
    hebrewPlain: וכל מנחה אשר תאפה בתנור וכל נעשה במרחשת ועל מחבת לכהן המקריב אתה לו תהיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:9
    kjvOsis:
    - Lev.7.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.10
    scripture: tanakh
    name: Tanakh Leviticus 7:10
    ref: Leviticus 7:10
    book: Lev
    section: torah
    chapter: 7
    verse: 10
    ordinal: 2887
    text: And every meal-offering, mingled with oil, or dry, shall all the sons of Aaron have, one as well as another.
    translation: JPS 1917
    original: וְכָל־מִנְחָה בְלוּלָה־בַשֶּׁמֶן וַחֲרֵבָה לְכָל־בְּנֵי אַהֲרֹן תִּהְיֶה אִישׁ כְּאָחִיו׃
    hebrewPlain: וכל מנחה בלולה בשמן וחרבה לכל בני אהרן תהיה איש כאחיו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:10
    kjvOsis:
    - Lev.7.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.11
    scripture: tanakh
    name: Tanakh Leviticus 7:11
    ref: Leviticus 7:11
    book: Lev
    section: torah
    chapter: 7
    verse: 11
    ordinal: 2888
    text: And this is the law of the sacrifice of peace-offerings, which one may offer unto the LORD.
    translation: JPS 1917
    original: וְזֹאת תּוֹרַת זֶבַח הַשְּׁלָמִים אֲשֶׁר יַקְרִיב לַיהוָה׃
    hebrewPlain: וזאת תורת זבח השלמים אשר יקריב ליהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:11
    kjvOsis:
    - Lev.7.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.12
    scripture: tanakh
    name: Tanakh Leviticus 7:12
    ref: Leviticus 7:12
    book: Lev
    section: torah
    chapter: 7
    verse: 12
    ordinal: 2889
    text: If he offer it for a thanksgiving, then he shall offer with the sacrifice of thanksgiving unleavened cakes mingled with oil, and unleavened wafers spread with oil, and cakes mingled with oil, of fine flour soaked.
    translation: JPS 1917
    original: אִם עַל־תּוֹדָה יַקְרִיבֶנּוּ וְהִקְרִיב עַל־זֶבַח הַתּוֹדָה חַלּוֹת מַצּוֹת בְּלוּלֹת בַּשֶּׁמֶן וּרְקִיקֵי מַצּוֹת מְשֻׁחִים בַּשָּׁמֶן וְסֹלֶת מֻרְבֶּכֶת חַלֹּת בְּלוּלֹת בַּשָּׁמֶן׃
    hebrewPlain: אם על תודה יקריבנו והקריב על זבח התודה חלות מצות בלולת בשמן ורקיקי מצות משחים בשמן וסלת מרבכת חלת בלולת בשמן
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:12
    kjvOsis:
    - Lev.7.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.13
    scripture: tanakh
    name: Tanakh Leviticus 7:13
    ref: Leviticus 7:13
    book: Lev
    section: torah
    chapter: 7
    verse: 13
    ordinal: 2890
    text: With cakes of leavened bread he shall present his offering with the sacrifice of his peace-offerings for thanksgiving.
    translation: JPS 1917
    original: עַל־חַלֹּת לֶחֶם חָמֵץ יַקְרִיב קָרְבָּנוֹ עַל־זֶבַח תּוֹדַת שְׁלָמָיו׃
    hebrewPlain: על חלת לחם חמץ יקריב קרבנו על זבח תודת שלמיו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:13
    kjvOsis:
    - Lev.7.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.14
    scripture: tanakh
    name: Tanakh Leviticus 7:14
    ref: Leviticus 7:14
    book: Lev
    section: torah
    chapter: 7
    verse: 14
    ordinal: 2891
    text: And of it he shall present one out of each offering for a gift unto the LORD; it shall be the priest’s that dasheth the blood of the peace-offerings against the altar.
    translation: JPS 1917
    original: וְהִקְרִיב מִמֶּנּוּ אֶחָד מִכָּל־קָרְבָּן תְּרוּמָה לַיהוָה לַכֹּהֵן הַזֹּרֵק אֶת־דַּם הַשְּׁלָמִים לוֹ יִהְיֶה׃
    hebrewPlain: והקריב ממנו אחד מכל קרבן תרומה ליהוה לכהן הזרק את דם השלמים לו יהיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:14
    kjvOsis:
    - Lev.7.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.15
    scripture: tanakh
    name: Tanakh Leviticus 7:15
    ref: Leviticus 7:15
    book: Lev
    section: torah
    chapter: 7
    verse: 15
    ordinal: 2892
    text: And the flesh of the sacrifice of his peace-offerings for thanksgiving shall be eaten on the day of his offering; he shall not leave any of it until the morning.
    translation: JPS 1917
    original: וּבְשַׂר זֶבַח תּוֹדַת שְׁלָמָיו בְּיוֹם קָרְבָּנוֹ יֵאָכֵל לֹא־יַנִּיחַ מִמֶּנּוּ עַד־בֹּקֶר׃
    hebrewPlain: ובשר זבח תודת שלמיו ביום קרבנו יאכל לא יניח ממנו עד בקר
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:15
    kjvOsis:
    - Lev.7.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.16
    scripture: tanakh
    name: Tanakh Leviticus 7:16
    ref: Leviticus 7:16
    book: Lev
    section: torah
    chapter: 7
    verse: 16
    ordinal: 2893
    text: But if the sacrifice of his offering be a vow, or a freewill-offering, it shall be eaten on the day that he offereth his sacrifice; and on the morrow that which remaineth of it may be eaten.
    translation: JPS 1917
    original: וְאִם־נֶדֶר אוֹ נְדָבָה זֶבַח קָרְבָּנוֹ בְּיוֹם הַקְרִיבוֹ אֶת־זִבְחוֹ יֵאָכֵל וּמִמָּחֳרָת וְהַנּוֹתָר מִמֶּנּוּ יֵאָכֵל׃
    hebrewPlain: ואם נדר או נדבה זבח קרבנו ביום הקריבו את זבחו יאכל וממחרת והנותר ממנו יאכל
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:16
    kjvOsis:
    - Lev.7.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.17
    scripture: tanakh
    name: Tanakh Leviticus 7:17
    ref: Leviticus 7:17
    book: Lev
    section: torah
    chapter: 7
    verse: 17
    ordinal: 2894
    text: But that which remaineth of the flesh of the sacrifice on the third day shall be burnt with fire.
    translation: JPS 1917
    original: וְהַנּוֹתָר מִבְּשַׂר הַזָּבַח בַּיּוֹם הַשְּׁלִישִׁי בָּאֵשׁ יִשָּׂרֵף׃
    hebrewPlain: והנותר מבשר הזבח ביום השלישי באש ישרף
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:17
    kjvOsis:
    - Lev.7.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
