  data:
    osis: Lev.8.5
    scripture: tanakh
    name: Tanakh Leviticus 8:5
    ref: Leviticus 8:5
    book: Lev
    section: torah
    chapter: 8
    verse: 5
    ordinal: 2920
    text: 'And Moses said unto the congregation: ‘This is the thing which the LORD hath commanded to be done.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה אֶל־הָעֵדָה זֶה הַדָּבָר אֲשֶׁר־צִוָּה יְהוָה לַעֲשׂוֹת׃
    hebrewPlain: ויאמר משה אל העדה זה הדבר אשר צוה יהוה לעשות
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:5
    kjvOsis:
    - Lev.8.5
