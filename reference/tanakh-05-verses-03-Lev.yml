  data:
    osis: Lev.8.21
    scripture: tanakh
    name: Tanakh Leviticus 8:21
    ref: Leviticus 8:21
    book: Lev
    section: torah
    chapter: 8
    verse: 21
    ordinal: 2936
    text: And when the inwards and the legs were washed with water, Moses made the whole ram smoke upon the altar; it was a burnt-offering for a sweet savour; it was an offering made by fire unto the LORD; as the LORD commanded Moses.
    translation: JPS 1917
    original: וְאֶת־הַקֶּרֶב וְאֶת־הַכְּרָעַיִם רָחַץ בַּמָּיִם וַיַּקְטֵר מֹשֶׁה אֶת־כָּל־הָאַיִל הַמִּזְבֵּחָה עֹלָה הוּא לְרֵיחַ־נִיחֹחַ אִשֶּׁה הוּא לַיהוָה כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: ואת הקרב ואת הכרעים רחץ במים ויקטר משה את כל האיל המזבחה עלה הוא לריח ניחח אשה הוא ליהוה כאשר צוה יהוה את משה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:21
    kjvOsis:
