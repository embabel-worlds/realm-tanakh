    ref: Leviticus 18:20
    book: Lev
    section: torah
    chapter: 18
    verse: 20
    ordinal: 3269
    text: And thou shalt not lie carnally with thy neighbour’s wife, to defile thyself with her.
    translation: JPS 1917
    original: וְאֶל־אֵשֶׁת עֲמִיתְךָ לֹא־תִתֵּן שְׁכָבְתְּךָ לְזָרַע לְטָמְאָה־בָהּ׃
    hebrewPlain: ואל אשת עמיתך לא תתן שכבתך לזרע לטמאה בה
    parashah: Achrei Mot
    kjvRefs:
