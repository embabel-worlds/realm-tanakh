  data:
    osis: Lev.19.29
    scripture: tanakh
    name: Tanakh Leviticus 19:29
    ref: Leviticus 19:29
    book: Lev
    section: torah
    chapter: 19
    verse: 29
    ordinal: 3308
    text: Profane not thy daughter, to make her a harlot, lest the land fall into harlotry, and the land become full of lewdness.
    translation: JPS 1917
    original: אַל־תְּחַלֵּל אֶת־בִּתְּךָ לְהַזְנוֹתָהּ וְלֹא־תִזְנֶה הָאָרֶץ וּמָלְאָה הָאָרֶץ זִמָּה׃
    hebrewPlain: אל תחלל את בתך להזנותה ולא תזנה הארץ ומלאה הארץ זמה
    parashah: Kedoshim
    kjvRefs:
