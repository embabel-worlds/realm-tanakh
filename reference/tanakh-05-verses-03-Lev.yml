  data:
    osis: Lev.6.8
    scripture: tanakh
    name: Tanakh Leviticus 6:8
    ref: Leviticus 6:8
    book: Lev
    section: torah
    chapter: 6
    verse: 8
    ordinal: 2862
    text: And he shall take up therefrom his handful, of the fine flour of the meal-offering, and of the oil thereof, and all the frankincense which is upon the meal-offering, and shall make the memorial-part thereof smoke upon the altar for a sweet savour unto the LORD.
    translation: JPS 1917
    original: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ מִסֹּלֶת הַמִּנְחָה וּמִשַּׁמְנָהּ וְאֵת כָּל־הַלְּבֹנָה אֲשֶׁר עַל־הַמִּנְחָה וְהִקְטִיר הַמִּזְבֵּחַ רֵיחַ נִיחֹחַ אַזְכָּרָתָהּ לַיהוָה׃
    hebrewPlain: והרים ממנו בקמצו מסלת המנחה ומשמנה ואת כל הלבנה אשר על המנחה והקטיר המזבח ריח ניחח אזכרתה ליהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:15
    kjvOsis:
    - Lev.6.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
