  data:
    osis: Lev.6.13
    scripture: tanakh
    name: Tanakh Leviticus 6:13
    ref: Leviticus 6:13
    book: Lev
    section: torah
    chapter: 6
    verse: 13
    ordinal: 2867
    text: 'This is the offering of Aaron and of his sons, which they shall offer unto the LORD in the day when he is anointed: the tenth part of an ephah of fine flour for a meal-offering perpetually, half of it in the morning, and half thereof in the evening.'
    translation: JPS 1917
    original: זֶה קָרְבַּן אַהֲרֹן וּבָנָיו אֲשֶׁר־יַקְרִיבוּ לַיהוָה בְּיוֹם הִמָּשַׁח אֹתוֹ עֲשִׂירִת הָאֵפָה סֹלֶת מִנְחָה תָּמִיד מַחֲצִיתָהּ בַּבֹּקֶר וּמַחֲצִיתָהּ בָּעָרֶב׃
    hebrewPlain: זה קרבן אהרן ובניו אשר יקריבו ליהוה ביום המשח אתו עשירת האפה סלת מנחה תמיד מחציתה בבקר ומחציתה בערב
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:20
    kjvOsis:
