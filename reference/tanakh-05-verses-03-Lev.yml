  data:
    osis: Lev.18.25
    scripture: tanakh
    name: Tanakh Leviticus 18:25
    ref: Leviticus 18:25
    book: Lev
    section: torah
    chapter: 18
    verse: 25
    ordinal: 3274
    text: And the land was defiled, therefore I did visit the iniquity thereof upon it, and the land vomited out her inhabitants.
    translation: JPS 1917
    original: וַתִּטְמָא הָאָרֶץ וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ וַתָּקִא הָאָרֶץ אֶת־יֹשְׁבֶיהָ׃
    hebrewPlain: ותטמא הארץ ואפקד עונה עליה ותקא הארץ את ישביה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:25
    kjvOsis:
    - Lev.18.25
  relations:
