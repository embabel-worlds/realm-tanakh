    text: But if the priest look on it, and, behold, there be no white hairs therein, and it be not lower than the skin, but be dim, then the priest shall shut him up seven days.
    translation: JPS 1917
    original: וְאִם יִרְאֶנָּה הַכֹּהֵן וְהִנֵּה אֵין־בָּהּ שֵׂעָר לָבָן וּשְׁפָלָה אֵינֶנָּה מִן־הָעוֹר וְהִיא כֵהָה וְהִסְגִּירוֹ הַכֹּהֵן שִׁבְעַת יָמִים׃
