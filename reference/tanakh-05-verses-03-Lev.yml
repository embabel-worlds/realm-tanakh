    osis: Lev.23.44
    scripture: tanakh
    name: Tanakh Leviticus 23:44
    ref: Leviticus 23:44
    book: Lev
    section: torah
    chapter: 23
    verse: 44
    ordinal: 3444
    text: And Moses declared unto the children of Israel the appointed seasons of the LORD.
    translation: JPS 1917
    original: וַיְדַבֵּר מֹשֶׁה אֶת־מֹעֲדֵי יְהוָה אֶל־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: וידבר משה את מעדי יהוה אל בני ישראל
