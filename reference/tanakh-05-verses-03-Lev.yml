- type: TanakhVerse
  data:
    osis: Lev.7.30
    scripture: tanakh
    name: Tanakh Leviticus 7:30
    ref: Leviticus 7:30
    book: Lev
    section: torah
    chapter: 7
    verse: 30
    ordinal: 2907
    text: 'His own hands shall bring the offerings of the LORD made by fire: the fat with the breast shall he bring, that the breast may be waved for a wave-offering before the LORD.'
    translation: JPS 1917
    original: יָדָיו תְּבִיאֶינָה אֵת אִשֵּׁי יְהוָה אֶת־הַחֵלֶב עַל־הֶחָזֶה יְבִיאֶנּוּ אֵת הֶחָזֶה לְהָנִיף אֹתוֹ תְּנוּפָה לִפְנֵי יְהוָה׃
    hebrewPlain: ידיו תביאינה את אשי יהוה את החלב על החזה יביאנו את החזה להניף אתו תנופה לפני יהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:30
    kjvOsis:
    - Lev.7.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.31
    scripture: tanakh
    name: Tanakh Leviticus 7:31
    ref: Leviticus 7:31
    book: Lev
    section: torah
    chapter: 7
    verse: 31
    ordinal: 2908
    text: And the priest shall make the fat smoke upon the altar; but the breast shall be Aaron’s and his sons’.
    translation: JPS 1917
    original: וְהִקְטִיר הַכֹּהֵן אֶת־הַחֵלֶב הַמִּזְבֵּחָה וְהָיָה הֶחָזֶה לְאַהֲרֹן וּלְבָנָיו׃
    hebrewPlain: והקטיר הכהן את החלב המזבחה והיה החזה לאהרן ולבניו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:31
    kjvOsis:
    - Lev.7.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.32
    scripture: tanakh
    name: Tanakh Leviticus 7:32
    ref: Leviticus 7:32
    book: Lev
    section: torah
    chapter: 7
    verse: 32
    ordinal: 2909
    text: And the right thigh shall ye give unto the priest for a heave-offering out of your sacrifices of peace-offerings.
    translation: JPS 1917
    original: וְאֵת שׁוֹק הַיָּמִין תִּתְּנוּ תְרוּמָה לַכֹּהֵן מִזִּבְחֵי שַׁלְמֵיכֶם׃
    hebrewPlain: ואת שוק הימין תתנו תרומה לכהן מזבחי שלמיכם
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:32
    kjvOsis:
    - Lev.7.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.33
    scripture: tanakh
    name: Tanakh Leviticus 7:33
    ref: Leviticus 7:33
    book: Lev
    section: torah
    chapter: 7
    verse: 33
    ordinal: 2910
    text: He among the sons of Aaron, that offereth the blood of the peace-offerings, and the fat, shall have the right thigh for a portion.
    translation: JPS 1917
    original: הַמַּקְרִיב אֶת־דַּם הַשְּׁלָמִים וְאֶת־הַחֵלֶב מִבְּנֵי אַהֲרֹן לוֹ תִהְיֶה שׁוֹק הַיָּמִין לְמָנָה׃
    hebrewPlain: המקריב את דם השלמים ואת החלב מבני אהרן לו תהיה שוק הימין למנה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:33
    kjvOsis:
    - Lev.7.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.34
    scripture: tanakh
    name: Tanakh Leviticus 7:34
    ref: Leviticus 7:34
    book: Lev
    section: torah
    chapter: 7
    verse: 34
    ordinal: 2911
    text: For the breast of waving and the thigh of heaving have I taken of the children of Israel out of their sacrifices of peace-offerings, and have given them unto Aaron the priest and unto his sons as a due for ever from the children of Israel.
    translation: JPS 1917
    original: כִּי אֶת־חֲזֵה הַתְּנוּפָה וְאֵת שׁוֹק הַתְּרוּמָה לָקַחְתִּי מֵאֵת בְּנֵי־יִשְׂרָאֵל מִזִּבְחֵי שַׁלְמֵיהֶם וָאֶתֵּן אֹתָם לְאַהֲרֹן הַכֹּהֵן וּלְבָנָיו לְחָק־עוֹלָם מֵאֵת בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: כי את חזה התנופה ואת שוק התרומה לקחתי מאת בני ישראל מזבחי שלמיהם ואתן אתם לאהרן הכהן ולבניו לחק עולם מאת בני ישראל
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:34
    kjvOsis:
    - Lev.7.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.35
    scripture: tanakh
    name: Tanakh Leviticus 7:35
    ref: Leviticus 7:35
    book: Lev
    section: torah
    chapter: 7
    verse: 35
    ordinal: 2912
    text: This is the consecrated portion of Aaron, and the consecrated portion of his sons, out of the offerings of the LORD made by fire, in the day when they were presented to minister unto the LORD in the priest’s office;
    translation: JPS 1917
    original: זֹאת מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו מֵאִשֵּׁי יְהוָה בְּיוֹם הִקְרִיב אֹתָם לְכַהֵן לַיהוָה׃
    hebrewPlain: זאת משחת אהרן ומשחת בניו מאשי יהוה ביום הקריב אתם לכהן ליהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:35
    kjvOsis:
    - Lev.7.35
  relations:
  - predicate: IN
    to:
