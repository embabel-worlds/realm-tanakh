  data:
    osis: Lev.6.20
    scripture: tanakh
    name: Tanakh Leviticus 6:20
    ref: Leviticus 6:20
    book: Lev
    section: torah
    chapter: 6
    verse: 20
    ordinal: 2874
    text: Whatsoever shall touch the flesh thereof shall be holy; and when there is sprinkled of the blood thereof upon any garment, thou shalt wash that whereon it was sprinkled in a holy place.
    translation: JPS 1917
    original: כֹּל אֲשֶׁר־יִגַּע בִּבְשָׂרָהּ יִקְדָּשׁ וַאֲשֶׁר יִזֶּה מִדָּמָהּ עַל־הַבֶּגֶד אֲשֶׁר יִזֶּה עָלֶיהָ תְּכַבֵּס בְּמָקוֹם קָדֹשׁ׃
    hebrewPlain: כל אשר יגע בבשרה יקדש ואשר יזה מדמה על הבגד אשר יזה עליה תכבס במקום קדש
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:27
    kjvOsis:
    - Lev.6.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.6.21
    scripture: tanakh
    name: Tanakh Leviticus 6:21
    ref: Leviticus 6:21
    book: Lev
    section: torah
    chapter: 6
    verse: 21
    ordinal: 2875
    text: But the earthen vessel wherein it is sodden shall be broken; and if it be sodden in a brazen vessel, it shall be scoured, and rinsed in water.
    translation: JPS 1917
    original: וּכְלִי־חֶרֶשׂ אֲשֶׁר תְּבֻשַּׁל־בּוֹ יִשָּׁבֵר וְאִם־בִּכְלִי נְחֹשֶׁת בֻּשָּׁלָה וּמֹרַק וְשֻׁטַּף בַּמָּיִם׃
    hebrewPlain: וכלי חרש אשר תבשל בו ישבר ואם בכלי נחשת בשלה ומרק ושטף במים
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:28
    kjvOsis:
    - Lev.6.28
