      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.35
    scripture: tanakh
    name: Tanakh Leviticus 25:35
    ref: Leviticus 25:35
    book: Lev
    section: torah
    chapter: 25
    verse: 35
    ordinal: 3502
    text: 'And if thy brother be waxen poor, and his means fail with thee; then thou shalt uphold him: as a stranger and a settler shall he live with thee.'
    translation: JPS 1917
    original: וְכִי־יָמוּךְ אָחִיךָ וּמָטָה יָדוֹ עִמָּךְ וְהֶחֱזַקְתָּ בּוֹ גֵּר וְתוֹשָׁב וָחַי עִמָּךְ׃
    hebrewPlain: וכי ימוך אחיך ומטה ידו עמך והחזקת בו גר ותושב וחי עמך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:35
    kjvOsis:
    - Lev.25.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.36
    scripture: tanakh
    name: Tanakh Leviticus 25:36
    ref: Leviticus 25:36
    book: Lev
    section: torah
    chapter: 25
    verse: 36
    ordinal: 3503
    text: Take thou no interest of him or increase; but fear thy God; that thy brother may live with thee.
    translation: JPS 1917
    original: אַל־תִּקַּח מֵאִתּוֹ נֶשֶׁךְ וְתַרְבִּית וְיָרֵאתָ מֵאֱלֹהֶיךָ וְחֵי אָחִיךָ עִמָּךְ׃
    hebrewPlain: אל תקח מאתו נשך ותרבית ויראת מאלהיך וחי אחיך עמך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:36
    kjvOsis:
    - Lev.25.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.37
    scripture: tanakh
    name: Tanakh Leviticus 25:37
    ref: Leviticus 25:37
    book: Lev
    section: torah
    chapter: 25
    verse: 37
    ordinal: 3504
    text: Thou shalt not give him thy money upon interest, nor give him thy victuals for increase.
    translation: JPS 1917
    original: אֶת־כַּסְפְּךָ לֹא־תִתֵּן לוֹ בְּנֶשֶׁךְ וּבְמַרְבִּית לֹא־תִתֵּן אָכְלֶךָ׃
    hebrewPlain: את כספך לא תתן לו בנשך ובמרבית לא תתן אכלך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:37
    kjvOsis:
    - Lev.25.37
