- type: TanakhVerse
  data:
    osis: Lev.7.6
    scripture: tanakh
    name: Tanakh Leviticus 7:6
    ref: Leviticus 7:6
    book: Lev
    section: torah
    chapter: 7
    verse: 6
    ordinal: 2883
    text: Every male among the priests may eat thereof; it shall be eaten in a holy place; it is most holy.
    translation: JPS 1917
    original: כָּל־זָכָר בַּכֹּהֲנִים יֹאכְלֶנּוּ בְּמָקוֹם קָדוֹשׁ יֵאָכֵל קֹדֶשׁ קָדָשִׁים הוּא׃
    hebrewPlain: כל זכר בכהנים יאכלנו במקום קדוש יאכל קדש קדשים הוא
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:6
    kjvOsis:
    - Lev.7.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
