  data:
    osis: Lev.20.9
    scripture: tanakh
    name: Tanakh Leviticus 20:9
    ref: Leviticus 20:9
    book: Lev
    section: torah
    chapter: 20
    verse: 9
    ordinal: 3325
    text: For whatsoever man there be that curseth his father or his mother shall surely be put to death; he hath cursed his father or his mother; his blood shall be upon him.
    translation: JPS 1917
    original: כִּי־אִישׁ אִישׁ אֲשֶׁר יְקַלֵּל אֶת־אָבִיו וְאֶת־אִמּוֹ מוֹת יוּמָת אָבִיו וְאִמּוֹ קִלֵּל דָּמָיו בּוֹ׃
    hebrewPlain: כי איש איש אשר יקלל את אביו ואת אמו מות יומת אביו ואמו קלל דמיו בו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:9
    kjvOsis:
    - Lev.20.9
  relations:
  - predicate: IN
    to:
