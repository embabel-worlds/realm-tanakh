- type: TanakhVerse
  data:
    osis: Lev.14.28
    scripture: tanakh
    name: Tanakh Leviticus 14:28
    ref: Leviticus 14:28
    book: Lev
    section: torah
    chapter: 14
    verse: 28
    ordinal: 3137
    text: And the priest shall put of the oil that is in his hand upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, upon the place of the blood of the guilt-offering.
    translation: JPS 1917
    original: וְנָתַן הַכֹּהֵן מִן־הַשֶּׁמֶן אֲשֶׁר עַל־כַּפּוֹ עַל־תְּנוּךְ אֹזֶן הַמִּטַּהֵר הַיְמָנִית וְעַל־בֹּהֶן יָדוֹ הַיְמָנִית וְעַל־בֹּהֶן רַגְלוֹ הַיְמָנִית עַל־מְקוֹם דַּם הָאָשָׁם׃
    hebrewPlain: ונתן הכהן מן השמן אשר על כפו על תנוך אזן המטהר הימנית ועל בהן ידו הימנית ועל בהן רגלו הימנית על מקום דם האשם
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:28
    kjvOsis:
    - Lev.14.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.29
    scripture: tanakh
    name: Tanakh Leviticus 14:29
    ref: Leviticus 14:29
    book: Lev
    section: torah
    chapter: 14
    verse: 29
    ordinal: 3138
    text: And the rest of the oil that is in the priest’s hand he shall put upon the head of him that is to be cleansed, to make atonement for him before the LORD.
    translation: JPS 1917
    original: וְהַנּוֹתָר מִן־הַשֶּׁמֶן אֲשֶׁר עַל־כַּף הַכֹּהֵן יִתֵּן עַל־רֹאשׁ הַמִּטַּהֵר לְכַפֵּר עָלָיו לִפְנֵי יְהוָה׃
    hebrewPlain: והנותר מן השמן אשר על כף הכהן יתן על ראש המטהר לכפר עליו לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:29
    kjvOsis:
    - Lev.14.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.30
    scripture: tanakh
    name: Tanakh Leviticus 14:30
    ref: Leviticus 14:30
    book: Lev
    section: torah
    chapter: 14
    verse: 30
    ordinal: 3139
    text: And he shall offer one of the turtle-doves, or of the young pigeons, such as his means suffice for;
    translation: JPS 1917
    original: וְעָשָׂה אֶת־הָאֶחָד מִן־הַתֹּרִים אוֹ מִן־בְּנֵי הַיּוֹנָה מֵאֲשֶׁר תַּשִּׂיג יָדוֹ׃
    hebrewPlain: ועשה את האחד מן התרים או מן בני היונה מאשר תשיג ידו
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:30
    kjvOsis:
    - Lev.14.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.31
    scripture: tanakh
    name: Tanakh Leviticus 14:31
    ref: Leviticus 14:31
    book: Lev
    section: torah
    chapter: 14
    verse: 31
    ordinal: 3140
    text: even such as his means suffice for, the one for a sin-offering, and the other for a burnt-offering, with the meal-offering; and the priest shall make atonement for him that is to be cleansed before the LORD.
    translation: JPS 1917
    original: אֵת אֲשֶׁר־תַּשִּׂיג יָדוֹ אֶת־הָאֶחָד חַטָּאת וְאֶת־הָאֶחָד עֹלָה עַל־הַמִּנְחָה וְכִפֶּר הַכֹּהֵן עַל הַמִּטַּהֵר לִפְנֵי יְהוָה׃
    hebrewPlain: את אשר תשיג ידו את האחד חטאת ואת האחד עלה על המנחה וכפר הכהן על המטהר לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:31
    kjvOsis:
    - Lev.14.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
