  data:
    osis: Lev.11.31
    scripture: tanakh
    name: Tanakh Leviticus 11:31
    ref: Leviticus 11:31
    book: Lev
    section: torah
    chapter: 11
    verse: 31
    ordinal: 3026
    text: These are they which are unclean to you among all that swarm; whosoever doth touch them, when they are dead, shall be unclean until the even.
    translation: JPS 1917
    original: אֵלֶּה הַטְּמֵאִים לָכֶם בְּכָל־הַשָּׁרֶץ כָּל־הַנֹּגֵעַ בָּהֶם בְּמֹתָם יִטְמָא עַד־הָעָרֶב׃
    hebrewPlain: אלה הטמאים לכם בכל השרץ כל הנגע בהם במתם יטמא עד הערב
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:31
    kjvOsis:
    - Lev.11.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
