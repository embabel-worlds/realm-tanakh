  data:
    osis: Lev.23.13
    scripture: tanakh
    name: Tanakh Leviticus 23:13
    ref: Leviticus 23:13
    book: Lev
    section: torah
    chapter: 23
    verse: 13
    ordinal: 3413
    text: And the meal-offering thereof shall be two tenth parts of an ephah of fine flour mingled with oil, an offering made by fire unto the LORD for a sweet savour; and the drink-offering thereof shall be of wine, the fourth part of a hin.
    translation: JPS 1917
    original: וּמִנְחָתוֹ שְׁנֵי עֶשְׂרֹנִים סֹלֶת בְּלוּלָה בַשֶּׁמֶן אִשֶּׁה לַיהוָה רֵיחַ נִיחֹחַ וְנִסְכֹּה יַיִן רְבִיעִת הַהִין׃
    hebrewPlain: ומנחתו שני עשרנים סלת בלולה בשמן אשה ליהוה ריח ניחח ונסכה יין רביעת ההין
    parashah: Emor
    kjvRefs:
    - Leviticus 23:13
    kjvOsis:
    - Lev.23.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.14
    scripture: tanakh
    name: Tanakh Leviticus 23:14
    ref: Leviticus 23:14
    book: Lev
    section: torah
    chapter: 23
    verse: 14
    ordinal: 3414
    text: And ye shall eat neither bread, nor parched corn, nor fresh ears, until this selfsame day, until ye have brought the offering of your God; it is a statute for ever throughout your generations in all your dwellings.
    translation: JPS 1917
    original: וְלֶחֶם וְקָלִי וְכַרְמֶל לֹא תֹאכְלוּ עַד־עֶצֶם הַיּוֹם הַזֶּה עַד הֲבִיאֲכֶם אֶת־קָרְבַּן אֱלֹהֵיכֶם חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם בְּכֹל מֹשְׁבֹתֵיכֶם׃
    hebrewPlain: ולחם וקלי וכרמל לא תאכלו עד עצם היום הזה עד הביאכם את קרבן אלהיכם חקת עולם לדרתיכם בכל משבתיכם
    parashah: Emor
    kjvRefs:
    - Leviticus 23:14
    kjvOsis:
    - Lev.23.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.15
    scripture: tanakh
    name: Tanakh Leviticus 23:15
    ref: Leviticus 23:15
    book: Lev
    section: torah
    chapter: 23
    verse: 15
    ordinal: 3415
    text: And ye shall count unto you from the morrow after the day of rest, from the day that ye brought the sheaf of the waving; seven weeks shall there be complete;
    translation: JPS 1917
    original: וּסְפַרְתֶּם לָכֶם מִמָּחֳרַת הַשַּׁבָּת מִיּוֹם הֲבִיאֲכֶם אֶת־עֹמֶר הַתְּנוּפָה שֶׁבַע שַׁבָּתוֹת תְּמִימֹת תִּהְיֶינָה׃
    hebrewPlain: וספרתם לכם ממחרת השבת מיום הביאכם את עמר התנופה שבע שבתות תמימת תהיינה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:15
    kjvOsis:
    - Lev.23.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.16
    scripture: tanakh
    name: Tanakh Leviticus 23:16
    ref: Leviticus 23:16
    book: Lev
    section: torah
    chapter: 23
    verse: 16
    ordinal: 3416
    text: even unto the morrow after the seventh week shall ye number fifty days; and ye shall present a new meal-offering unto the LORD.
    translation: JPS 1917
    original: עַד מִמָּחֳרַת הַשַּׁבָּת הַשְּׁבִיעִת תִּסְפְּרוּ חֲמִשִּׁים יוֹם וְהִקְרַבְתֶּם מִנְחָה חֲדָשָׁה לַיהוָה׃
    hebrewPlain: עד ממחרת השבת השביעת תספרו חמשים יום והקרבתם מנחה חדשה ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:16
    kjvOsis:
    - Lev.23.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.17
    scripture: tanakh
    name: Tanakh Leviticus 23:17
    ref: Leviticus 23:17
    book: Lev
    section: torah
    chapter: 23
    verse: 17
    ordinal: 3417
    text: Ye shall bring out of your dwellings two wave-loaves of two tenth parts of an ephah; they shall be of fine flour, they shall be baked with leaven, for first-fruits unto the LORD.
    translation: JPS 1917
    original: מִמּוֹשְׁבֹתֵיכֶם תָּבִיאּוּ לֶחֶם תְּנוּפָה שְׁתַּיִם שְׁנֵי עֶשְׂרֹנִים סֹלֶת תִּהְיֶינָה חָמֵץ תֵּאָפֶינָה בִּכּוּרִים לַיהוָה׃
    hebrewPlain: ממושבתיכם תביאו לחם תנופה שתים שני עשרנים סלת תהיינה חמץ תאפינה בכורים ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:17
    kjvOsis:
    - Lev.23.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.18
    scripture: tanakh
    name: Tanakh Leviticus 23:18
    ref: Leviticus 23:18
    book: Lev
    section: torah
    chapter: 23
    verse: 18
    ordinal: 3418
    text: And ye shall present with the bread seven lambs without blemish of the first year, and one young bullock, and two rams; they shall be a burnt-offering unto the LORD, with their meal-offering, and their drink-offerings, even an offering made by fire, of a sweet savour unto the LORD.
    translation: JPS 1917
    original: וְהִקְרַבְתֶּם עַל־הַלֶּחֶם שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה וּפַר בֶּן־בָּקָר אֶחָד וְאֵילִם שְׁנָיִם יִהְיוּ עֹלָה לַיהוָה וּמִנְחָתָם וְנִסְכֵּיהֶם אִשֵּׁה רֵיחַ־נִיחֹחַ לַיהוָה׃
    hebrewPlain: והקרבתם על הלחם שבעת כבשים תמימם בני שנה ופר בן בקר אחד ואילם שנים יהיו עלה ליהוה ומנחתם ונסכיהם אשה ריח ניחח ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:18
    kjvOsis:
    - Lev.23.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.19
    scripture: tanakh
    name: Tanakh Leviticus 23:19
    ref: Leviticus 23:19
    book: Lev
    section: torah
    chapter: 23
    verse: 19
    ordinal: 3419
    text: And ye shall offer one he-goat for a sin-offering, and two he-lambs of the first year for a sacrifice of peace-offerings.
    translation: JPS 1917
    original: וַעֲשִׂיתֶם שְׂעִיר־עִזִּים אֶחָד לְחַטָּאת וּשְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה לְזֶבַח שְׁלָמִים׃
    hebrewPlain: ועשיתם שעיר עזים אחד לחטאת ושני כבשים בני שנה לזבח שלמים
    parashah: Emor
    kjvRefs:
    - Leviticus 23:19
    kjvOsis:
    - Lev.23.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.20
    scripture: tanakh
    name: Tanakh Leviticus 23:20
    ref: Leviticus 23:20
    book: Lev
    section: torah
    chapter: 23
    verse: 20
    ordinal: 3420
    text: And the priest shall wave them with the bread of the first-fruits for a wave-offering before the LORD, with the two lambs; they shall be holy to the LORD for the priest.
    translation: JPS 1917
    original: וְהֵנִיף הַכֹּהֵן אֹתָם עַל לֶחֶם הַבִּכּוּרִים תְּנוּפָה לִפְנֵי יְהוָה עַל־שְׁנֵי כְּבָשִׂים קֹדֶשׁ יִהְיוּ לַיהוָה לַכֹּהֵן׃
    hebrewPlain: והניף הכהן אתם על לחם הבכורים תנופה לפני יהוה על שני כבשים קדש יהיו ליהוה לכהן
    parashah: Emor
    kjvRefs:
    - Leviticus 23:20
    kjvOsis:
    - Lev.23.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.21
    scripture: tanakh
    name: Tanakh Leviticus 23:21
    ref: Leviticus 23:21
    book: Lev
    section: torah
    chapter: 23
    verse: 21
    ordinal: 3421
    text: And ye shall make proclamation on the selfsame day; there shall be a holy convocation unto you; ye shall do no manner of servile work; it is a statute for ever in all your dwellings throughout your generations.
    translation: JPS 1917
    original: וּקְרָאתֶם בְּעֶצֶם הַיּוֹם הַזֶּה מִקְרָא־קֹדֶשׁ יִהְיֶה לָכֶם כָּל־מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ חֻקַּת עוֹלָם בְּכָל־מוֹשְׁבֹתֵיכֶם לְדֹרֹתֵיכֶם׃
    hebrewPlain: וקראתם בעצם היום הזה מקרא קדש יהיה לכם כל מלאכת עבדה לא תעשו חקת עולם בכל מושבתיכם לדרתיכם
    parashah: Emor
    kjvRefs:
    - Leviticus 23:21
    kjvOsis:
    - Lev.23.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.22
    scripture: tanakh
    name: Tanakh Leviticus 23:22
    ref: Leviticus 23:22
    book: Lev
    section: torah
    chapter: 23
    verse: 22
    ordinal: 3422
    text: 'And when ye reap the harvest of your land, thou shalt not wholly reap the corner of thy field, neither shalt thou gather the gleaning of thy harvest; thou shalt leave them for the poor, and for the stranger: I am the LORD your God.'
    translation: JPS 1917
    original: וּבְקֻצְרְכֶם אֶת־קְצִיר אַרְצְכֶם לֹא־תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט לֶעָנִי וְלַגֵּר תַּעֲזֹב אֹתָם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ובקצרכם את קציר ארצכם לא תכלה פאת שדך בקצרך ולקט קצירך לא תלקט לעני ולגר תעזב אתם אני יהוה אלהיכם
    parashah: Emor
    kjvRefs:
    - Leviticus 23:22
    kjvOsis:
    - Lev.23.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
