  data:
    osis: Lev.21.17
    scripture: tanakh
    name: Tanakh Leviticus 21:17
    ref: Leviticus 21:17
    book: Lev
    section: torah
    chapter: 21
    verse: 17
    ordinal: 3360
    text: 'Speak unto Aaron, saying: Whosoever he be of thy seed throughout their generations that hath a blemish, let him not approach to offer the bread of his God.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר אִישׁ מִזַּרְעֲךָ לְדֹרֹתָם אֲשֶׁר יִהְיֶה בוֹ מוּם לֹא יִקְרַב לְהַקְרִיב לֶחֶם אֱלֹהָיו׃
    hebrewPlain: דבר אל אהרן לאמר איש מזרעך לדרתם אשר יהיה בו מום לא יקרב להקריב לחם אלהיו
    parashah: Emor
    kjvRefs:
