  data:
    osis: Lev.8.2
    scripture: tanakh
    name: Tanakh Leviticus 8:2
    ref: Leviticus 8:2
    book: Lev
    section: torah
    chapter: 8
    verse: 2
    ordinal: 2917
    text: ’Take Aaron and his sons with him, and the garments, and the anointing oil, and the bullock of the sin-offering, and the two rams, and the basket of unleavened bread;
    translation: JPS 1917
    original: קַח אֶת־אַהֲרֹן וְאֶת־בָּנָיו אִתּוֹ וְאֵת הַבְּגָדִים וְאֵת שֶׁמֶן הַמִּשְׁחָה וְאֵת פַּר הַחַטָּאת וְאֵת שְׁנֵי הָאֵילִים וְאֵת סַל הַמַּצּוֹת׃
    hebrewPlain: קח את אהרן ואת בניו אתו ואת הבגדים ואת שמן המשחה ואת פר החטאת ואת שני האילים ואת סל המצות
    parashah: Tzav
    kjvRefs:
