    scripture: tanakh
    name: Tanakh Leviticus 26:14
    ref: Leviticus 26:14
    book: Lev
    section: torah
    chapter: 26
    verse: 14
    ordinal: 3536
    text: But if ye will not hearken unto Me, and will not do all these commandments;
    translation: JPS 1917
    original: וְאִם־לֹא תִשְׁמְעוּ לִי וְלֹא תַעֲשׂוּ אֵת כָּל־הַמִּצְוֺת הָאֵלֶּה׃
    hebrewPlain: ואם לא תשמעו לי ולא תעשו את כל המצות האלה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:14
    kjvOsis:
