  data:
    osis: Lev.14.40
    scripture: tanakh
    name: Tanakh Leviticus 14:40
    ref: Leviticus 14:40
    book: Lev
    section: torah
    chapter: 14
    verse: 40
    ordinal: 3149
    text: then the priest shall command that they take out the stones in which the plague is, and cast them into an unclean place without the city.
    translation: JPS 1917
    original: וְצִוָּה הַכֹּהֵן וְחִלְּצוּ אֶת־הָאֲבָנִים אֲשֶׁר בָּהֵן הַנָּגַע וְהִשְׁלִיכוּ אֶתְהֶן אֶל־מִחוּץ לָעִיר אֶל־מָקוֹם טָמֵא׃
    hebrewPlain: וצוה הכהן וחלצו את האבנים אשר בהן הנגע והשליכו אתהן אל מחוץ לעיר אל מקום טמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:40
    kjvOsis:
    - Lev.14.40
