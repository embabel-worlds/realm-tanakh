    text: And in the seventh day the priest shall look on the plague; and, behold, if the scall be not spread, and there be in it no yellow hair, and the appearance of the scall be not deeper than the skin,
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן אֶת־הַנֶּגַע בַּיּוֹם הַשְּׁבִיעִי וְהִנֵּה לֹא־פָשָׂה הַנֶּתֶק וְלֹא־הָיָה בוֹ שֵׂעָר צָהֹב וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן־הָעוֹר׃
    hebrewPlain: וראה הכהן את הנגע ביום השביעי והנה לא פשה הנתק ולא היה בו שער צהב ומראה הנתק אין עמק מן העור
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:32
    kjvOsis:
    - Lev.13.32
