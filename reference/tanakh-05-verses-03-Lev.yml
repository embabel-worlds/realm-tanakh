    ref: Leviticus 25:1
    book: Lev
    section: torah
    chapter: 25
    verse: 1
    ordinal: 3468
    text: 'And the LORD spoke unto Moses in mount Sinai, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה בְּהַר סִינַי לֵאמֹר׃
    hebrewPlain: וידבר יהוה אל משה בהר סיני לאמר
