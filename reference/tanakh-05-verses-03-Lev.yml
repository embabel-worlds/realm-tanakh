    section: torah
    chapter: 4
    verse: 23
    ordinal: 2816
    text: if his sin, wherein he hath sinned, be known to him, he shall bring for his offering a goat, a male without blemish.
    translation: JPS 1917
    original: אוֹ־הוֹדַע אֵלָיו חַטָּאתוֹ אֲשֶׁר חָטָא בָּהּ וְהֵבִיא אֶת־קָרְבָּנוֹ שְׂעִיר עִזִּים זָכָר תָּמִים׃
    hebrewPlain: או הודע אליו חטאתו אשר חטא בה והביא את קרבנו שעיר עזים זכר תמים
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:23
    kjvOsis:
