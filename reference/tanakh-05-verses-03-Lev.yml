      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.25
    scripture: tanakh
    name: Tanakh Leviticus 14:25
    ref: Leviticus 14:25
    book: Lev
    section: torah
    chapter: 14
    verse: 25
    ordinal: 3134
    text: And he shall kill the lamb of the guilt-offering, and the priest shall take of the blood of the guilt-offering, and put it upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot.
    translation: JPS 1917
    original: וְשָׁחַט אֶת־כֶּבֶשׂ הָאָשָׁם וְלָקַח הַכֹּהֵן מִדַּם הָאָשָׁם וְנָתַן עַל־תְּנוּךְ אֹזֶן־הַמִּטַּהֵר הַיְמָנִית וְעַל־בֹּהֶן יָדוֹ הַיְמָנִית וְעַל־בֹּהֶן רַגְלוֹ הַיְמָנִית׃
    hebrewPlain: ושחט את כבש האשם ולקח הכהן מדם האשם ונתן על תנוך אזן המטהר הימנית ועל בהן ידו הימנית ועל בהן רגלו הימנית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:25
    kjvOsis:
    - Lev.14.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.26
    scripture: tanakh
    name: Tanakh Leviticus 14:26
    ref: Leviticus 14:26
    book: Lev
    section: torah
    chapter: 14
    verse: 26
    ordinal: 3135
    text: And the priest shall pour of the oil into the palm of his own left hand.
    translation: JPS 1917
    original: וּמִן־הַשֶּׁמֶן יִצֹק הַכֹּהֵן עַל־כַּף הַכֹּהֵן הַשְּׂמָאלִית׃
    hebrewPlain: ומן השמן יצק הכהן על כף הכהן השמאלית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:26
    kjvOsis:
    - Lev.14.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
