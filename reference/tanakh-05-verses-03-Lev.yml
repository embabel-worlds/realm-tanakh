    translation: JPS 1917
    original: וְהִקְטִיר הַכֹּהֵן אֶת־אַזְכָּרָתָהּ מִגִּרְשָׂהּ וּמִשַּׁמְנָהּ עַל כָּל־לְבֹנָתָהּ אִשֶּׁה לַיהוָה׃
    hebrewPlain: והקטיר הכהן את אזכרתה מגרשה ומשמנה על כל לבנתה אשה ליהוה
    parashah: Vayikra
    kjvRefs:
