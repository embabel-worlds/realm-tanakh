  data:
    osis: Lev.19.28
    scripture: tanakh
    name: Tanakh Leviticus 19:28
    ref: Leviticus 19:28
    book: Lev
    section: torah
    chapter: 19
    verse: 28
    ordinal: 3307
    text: 'Ye shall not make any cuttings in your flesh for the dead, nor imprint any marks upon you: I am the LORD.'
    translation: JPS 1917
    original: וְשֶׂרֶט לָנֶפֶשׁ לֹא תִתְּנוּ בִּבְשַׂרְכֶם וּכְתֹבֶת קַעֲקַע לֹא תִתְּנוּ בָּכֶם אֲנִי יְהוָה׃
    hebrewPlain: ושרט לנפש לא תתנו בבשרכם וכתבת קעקע לא תתנו בכם אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:28
    kjvOsis:
    - Lev.19.28
