  data:
    osis: Lev.14.24
    scripture: tanakh
    name: Tanakh Leviticus 14:24
    ref: Leviticus 14:24
    book: Lev
    section: torah
    chapter: 14
    verse: 24
    ordinal: 3133
    text: And the priest shall take the lamb of the guilt-offering, and the log of oil, and the priest shall wave them for a wave-offering before the LORD.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן אֶת־כֶּבֶשׂ הָאָשָׁם וְאֶת־לֹג הַשָּׁמֶן וְהֵנִיף אֹתָם הַכֹּהֵן תְּנוּפָה לִפְנֵי יְהוָה׃
    hebrewPlain: ולקח הכהן את כבש האשם ואת לג השמן והניף אתם הכהן תנופה לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:24
    kjvOsis:
    - Lev.14.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
