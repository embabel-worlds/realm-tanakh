  data:
    osis: Lev.19.30
    scripture: tanakh
    name: Tanakh Leviticus 19:30
    ref: Leviticus 19:30
    book: Lev
    section: torah
    chapter: 19
    verse: 30
    ordinal: 3309
    text: 'Ye shall keep My sabbaths, and reverence My sanctuary: I am the LORD.'
    translation: JPS 1917
    original: אֶת־שַׁבְּתֹתַי תִּשְׁמֹרוּ וּמִקְדָּשִׁי תִּירָאוּ אֲנִי יְהוָה׃
    hebrewPlain: את שבתתי תשמרו ומקדשי תיראו אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:30
    kjvOsis:
    - Lev.19.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
