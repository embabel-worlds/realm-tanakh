- type: TanakhVerse
  data:
    osis: Lev.24.23
    scripture: tanakh
    name: Tanakh Leviticus 24:23
    ref: Leviticus 24:23
    book: Lev
    section: torah
    chapter: 24
    verse: 23
    ordinal: 3467
    text: And Moses spoke to the children of Israel, and they brought forth him that had cursed out of the camp, and stoned him with stones. And the children of Israel did as the LORD commanded Moses.
    translation: JPS 1917
    original: וַיְדַבֵּר מֹשֶׁה אֶל־בְּנֵי יִשְׂרָאֵל וַיּוֹצִיאוּ אֶת־הַמְקַלֵּל אֶל־מִחוּץ לַמַּחֲנֶה וַיִּרְגְּמוּ אֹתוֹ אָבֶן וּבְנֵי־יִשְׂרָאֵל עָשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: וידבר משה אל בני ישראל ויוציאו את המקלל אל מחוץ למחנה וירגמו אתו אבן ובני ישראל עשו כאשר צוה יהוה את משה
    parashah: Emor
    kjvRefs:
    - Leviticus 24:23
    kjvOsis:
    - Lev.24.23
