  data:
    osis: Lev.27.1
    scripture: tanakh
    name: Tanakh Leviticus 27:1
    ref: Leviticus 27:1
    book: Lev
    section: torah
    chapter: 27
    verse: 1
    ordinal: 3569
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Bechukotai
    kjvRefs:
