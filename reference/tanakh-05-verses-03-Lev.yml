- type: TanakhVerse
  data:
    osis: Lev.24.5
    scripture: tanakh
    name: Tanakh Leviticus 24:5
    ref: Leviticus 24:5
    book: Lev
    section: torah
    chapter: 24
    verse: 5
    ordinal: 3449
    text: 'And thou shalt take fine flour, and bake twelve cakes thereof: two tenth parts of an ephah shall be in one cake.'
    translation: JPS 1917
    original: וְלָקַחְתָּ סֹלֶת וְאָפִיתָ אֹתָהּ שְׁתֵּים עֶשְׂרֵה חַלּוֹת שְׁנֵי עֶשְׂרֹנִים יִהְיֶה הַחַלָּה הָאֶחָת׃
    hebrewPlain: ולקחת סלת ואפית אתה שתים עשרה חלות שני עשרנים יהיה החלה האחת
    parashah: Emor
    kjvRefs:
    - Leviticus 24:5
    kjvOsis:
    - Lev.24.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.6
    scripture: tanakh
    name: Tanakh Leviticus 24:6
    ref: Leviticus 24:6
    book: Lev
    section: torah
    chapter: 24
    verse: 6
    ordinal: 3450
    text: And thou shalt set them in two rows, six in a row, upon the pure table before the LORD.
    translation: JPS 1917
    original: וְשַׂמְתָּ אוֹתָם שְׁתַּיִם מַעֲרָכוֹת שֵׁשׁ הַמַּעֲרָכֶת עַל הַשֻּׁלְחָן הַטָּהֹר לִפְנֵי יְהוָה׃
    hebrewPlain: ושמת אותם שתים מערכות שש המערכת על השלחן הטהר לפני יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 24:6
    kjvOsis:
    - Lev.24.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.7
    scripture: tanakh
    name: Tanakh Leviticus 24:7
    ref: Leviticus 24:7
    book: Lev
    section: torah
    chapter: 24
    verse: 7
    ordinal: 3451
    text: And thou shalt put pure frankincense with each row, that it may be to the bread for a memorial-part, even an offering made by fire unto the LORD.
    translation: JPS 1917
    original: וְנָתַתָּ עַל־הַמַּעֲרֶכֶת לְבֹנָה זַכָּה וְהָיְתָה לַלֶּחֶם לְאַזְכָּרָה אִשֶּׁה לַיהוָה׃
    hebrewPlain: ונתת על המערכת לבנה זכה והיתה ללחם לאזכרה אשה ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 24:7
    kjvOsis:
    - Lev.24.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.8
    scripture: tanakh
    name: Tanakh Leviticus 24:8
    ref: Leviticus 24:8
    book: Lev
    section: torah
    chapter: 24
    verse: 8
    ordinal: 3452
    text: Every sabbath day he shall set it in order before the LORD continually; it is from the children of Israel, an everlasting covenant.
    translation: JPS 1917
    original: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת יַעַרְכֶנּוּ לִפְנֵי יְהוָה תָּמִיד מֵאֵת בְּנֵי־יִשְׂרָאֵל בְּרִית עוֹלָם׃
    hebrewPlain: ביום השבת ביום השבת יערכנו לפני יהוה תמיד מאת בני ישראל ברית עולם
    parashah: Emor
    kjvRefs:
    - Leviticus 24:8
    kjvOsis:
    - Lev.24.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.9
    scripture: tanakh
    name: Tanakh Leviticus 24:9
    ref: Leviticus 24:9
    book: Lev
    section: torah
    chapter: 24
    verse: 9
    ordinal: 3453
    text: And it shall be for Aaron and his sons; and they shall eat it in a holy place; for it is most holy unto him of the offerings of the LORD made by fire, a perpetual due.’
    translation: JPS 1917
    original: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו וַאֲכָלֻהוּ בְּמָקוֹם קָדֹשׁ כִּי קֹדֶשׁ קָדָשִׁים הוּא לוֹ מֵאִשֵּׁי יְהוָה חָק־עוֹלָם׃
    hebrewPlain: והיתה לאהרן ולבניו ואכלהו במקום קדש כי קדש קדשים הוא לו מאשי יהוה חק עולם
    parashah: Emor
    kjvRefs:
    - Leviticus 24:9
    kjvOsis:
    - Lev.24.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.10
    scripture: tanakh
    name: Tanakh Leviticus 24:10
    ref: Leviticus 24:10
    book: Lev
    section: torah
    chapter: 24
    verse: 10
    ordinal: 3454
    text: And the son of an Israelitish woman, whose father was an Egyptian, went out among the children of Israel; and the son of the Israelitish woman and a man of Israel strove together in the camp.
    translation: JPS 1917
    original: וַיֵּצֵא בֶּן־אִשָּׁה יִשְׂרְאֵלִית וְהוּא בֶּן־אִישׁ מִצְרִי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל וַיִּנָּצוּ בַּמַּחֲנֶה בֶּן הַיִּשְׂרְאֵלִית וְאִישׁ הַיִּשְׂרְאֵלִי׃
    hebrewPlain: ויצא בן אשה ישראלית והוא בן איש מצרי בתוך בני ישראל וינצו במחנה בן הישראלית ואיש הישראלי
    parashah: Emor
    kjvRefs:
    - Leviticus 24:10
    kjvOsis:
    - Lev.24.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.11
    scripture: tanakh
    name: Tanakh Leviticus 24:11
    ref: Leviticus 24:11
    book: Lev
    section: torah
    chapter: 24
    verse: 11
    ordinal: 3455
    text: And the son of the Israelitish woman blasphemed the Name, and cursed; and they brought him unto Moses. And his mother’s name was Shelomith, the daughter of Dibri, of the tribe of Dan.
    translation: JPS 1917
    original: וַיִּקֹּב בֶּן־הָאִשָּׁה הַיִּשְׂרְאֵלִית אֶת־הַשֵּׁם וַיְקַלֵּל וַיָּבִיאוּ אֹתוֹ אֶל־מֹשֶׁה וְשֵׁם אִמּוֹ שְׁלֹמִית בַּת־דִּבְרִי לְמַטֵּה־דָן׃
    hebrewPlain: ויקב בן האשה הישראלית את השם ויקלל ויביאו אתו אל משה ושם אמו שלמית בת דברי למטה דן
    parashah: Emor
    kjvRefs:
    - Leviticus 24:11
    kjvOsis:
    - Lev.24.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.12
    scripture: tanakh
    name: Tanakh Leviticus 24:12
    ref: Leviticus 24:12
    book: Lev
    section: torah
    chapter: 24
    verse: 12
    ordinal: 3456
    text: And they put him in ward, that it might be declared unto them at the mouth of the LORD.
    translation: JPS 1917
    original: וַיַּנִּיחֻהוּ בַּמִּשְׁמָר לִפְרֹשׁ לָהֶם עַל־פִּי יְהוָה׃
    hebrewPlain: ויניחהו במשמר לפרש להם על פי יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 24:12
    kjvOsis:
    - Lev.24.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
