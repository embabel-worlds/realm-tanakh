  data:
    osis: Lev.7.23
    scripture: tanakh
    name: Tanakh Leviticus 7:23
    ref: Leviticus 7:23
    book: Lev
    section: torah
    chapter: 7
    verse: 23
    ordinal: 2900
    text: 'Speak unto the children of Israel, saying: Ye shall eat no fat, of ox, or sheep, or goat.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר כָּל־חֵלֶב שׁוֹר וְכֶשֶׂב וָעֵז לֹא תֹאכֵלוּ׃
    hebrewPlain: דבר אל בני ישראל לאמר כל חלב שור וכשב ועז לא תאכלו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:23
    kjvOsis:
    - Lev.7.23
