    name: Tanakh Leviticus 4:24
    ref: Leviticus 4:24
    book: Lev
    section: torah
    chapter: 4
    verse: 24
    ordinal: 2817
    text: And he shall lay his hand upon the head of the goat, and kill it in the place where they kill the burnt-offering before the LORD; it is a sin-offering.
    translation: JPS 1917
    original: וְסָמַךְ יָדוֹ עַל־רֹאשׁ הַשָּׂעִיר וְשָׁחַט אֹתוֹ בִּמְקוֹם אֲשֶׁר־יִשְׁחַט אֶת־הָעֹלָה לִפְנֵי יְהוָה חַטָּאת הוּא׃
    hebrewPlain: וסמך ידו על ראש השעיר ושחט אתו במקום אשר ישחט את העלה לפני יהוה חטאת הוא
    parashah: Vayikra
