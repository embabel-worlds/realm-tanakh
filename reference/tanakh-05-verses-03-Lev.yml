- type: TanakhVerse
  data:
    osis: Lev.25.2
    scripture: tanakh
    name: Tanakh Leviticus 25:2
    ref: Leviticus 25:2
    book: Lev
    section: torah
    chapter: 25
    verse: 2
    ordinal: 3469
    text: 'Speak unto the children of Israel, and say unto them: When ye come into the land which I give you, then shall the land keep a sabbath unto the LORD.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם כִּי תָבֹאוּ אֶל־הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם וְשָׁבְתָה הָאָרֶץ שַׁבָּת לַיהוָה׃
    hebrewPlain: דבר אל בני ישראל ואמרת אלהם כי תבאו אל הארץ אשר אני נתן לכם ושבתה הארץ שבת ליהוה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:2
    kjvOsis:
    - Lev.25.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.3
    scripture: tanakh
    name: Tanakh Leviticus 25:3
    ref: Leviticus 25:3
    book: Lev
    section: torah
    chapter: 25
    verse: 3
    ordinal: 3470
    text: Six years thou shalt sow thy field, and six years thou shalt prune thy vineyard, and gather in the produce thereof.
    translation: JPS 1917
    original: שֵׁשׁ שָׁנִים תִּזְרַע שָׂדֶךָ וְשֵׁשׁ שָׁנִים תִּזְמֹר כַּרְמֶךָ וְאָסַפְתָּ אֶת־תְּבוּאָתָהּ׃
    hebrewPlain: שש שנים תזרע שדך ושש שנים תזמר כרמך ואספת את תבואתה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:3
    kjvOsis:
    - Lev.25.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.4
    scripture: tanakh
    name: Tanakh Leviticus 25:4
    ref: Leviticus 25:4
    book: Lev
    section: torah
    chapter: 25
    verse: 4
    ordinal: 3471
    text: But in the seventh year shall be a sabbath of solemn rest for the land, a sabbath unto the LORD; thou shalt neither sow thy field, nor prune thy vineyard.
    translation: JPS 1917
    original: וּבַשָּׁנָה הַשְּׁבִיעִת שַׁבַּת שַׁבָּתוֹן יִהְיֶה לָאָרֶץ שַׁבָּת לַיהוָה שָׂדְךָ לֹא תִזְרָע וְכַרְמְךָ לֹא תִזְמֹר׃
    hebrewPlain: ובשנה השביעת שבת שבתון יהיה לארץ שבת ליהוה שדך לא תזרע וכרמך לא תזמר
    parashah: Behar
    kjvRefs:
    - Leviticus 25:4
    kjvOsis:
    - Lev.25.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.5
    scripture: tanakh
    name: Tanakh Leviticus 25:5
    ref: Leviticus 25:5
    book: Lev
    section: torah
    chapter: 25
    verse: 5
    ordinal: 3472
    text: That which groweth of itself of thy harvest thou shalt not reap, and the grapes of thy undressed vine thou shalt not gather; it shall be a year of solemn rest for the land.
    translation: JPS 1917
    original: אֵת סְפִיחַ קְצִירְךָ לֹא תִקְצוֹר וְאֶת־עִנְּבֵי נְזִירֶךָ לֹא תִבְצֹר שְׁנַת שַׁבָּתוֹן יִהְיֶה לָאָרֶץ׃
    hebrewPlain: את ספיח קצירך לא תקצור ואת ענבי נזירך לא תבצר שנת שבתון יהיה לארץ
    parashah: Behar
    kjvRefs:
    - Leviticus 25:5
    kjvOsis:
    - Lev.25.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.6
    scripture: tanakh
    name: Tanakh Leviticus 25:6
    ref: Leviticus 25:6
    book: Lev
    section: torah
    chapter: 25
    verse: 6
    ordinal: 3473
    text: 'And the sabbath-produce of the land shall be for food for you: for thee, and for thy servant and for thy maid, and for thy hired servant and for the settler by thy side that sojourn with thee;'
    translation: JPS 1917
    original: וְהָיְתָה שַׁבַּת הָאָרֶץ לָכֶם לְאָכְלָה לְךָ וּלְעַבְדְּךָ וְלַאֲמָתֶךָ וְלִשְׂכִירְךָ וּלְתוֹשָׁבְךָ הַגָּרִים עִמָּךְ׃
    hebrewPlain: והיתה שבת הארץ לכם לאכלה לך ולעבדך ולאמתך ולשכירך ולתושבך הגרים עמך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:6
    kjvOsis:
    - Lev.25.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.7
    scripture: tanakh
    name: Tanakh Leviticus 25:7
    ref: Leviticus 25:7
    book: Lev
    section: torah
    chapter: 25
    verse: 7
    ordinal: 3474
    text: and for thy cattle, and for the beasts that are in thy land, shall all the increase thereof be for food.
    translation: JPS 1917
    original: וְלִבְהֶמְתְּךָ וְלַחַיָּה אֲשֶׁר בְּאַרְצֶךָ תִּהְיֶה כָל־תְּבוּאָתָהּ לֶאֱכֹל׃
    hebrewPlain: ולבהמתך ולחיה אשר בארצך תהיה כל תבואתה לאכל
    parashah: Behar
    kjvRefs:
    - Leviticus 25:7
    kjvOsis:
    - Lev.25.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.8
    scripture: tanakh
    name: Tanakh Leviticus 25:8
    ref: Leviticus 25:8
    book: Lev
    section: torah
    chapter: 25
    verse: 8
    ordinal: 3475
    text: And thou shalt number seven sabbaths of years unto thee, seven times seven years; and there shall be unto thee the days of seven sabbaths of years, even forty and nine years.
    translation: JPS 1917
    original: וְסָפַרְתָּ לְךָ שֶׁבַע שַׁבְּתֹת שָׁנִים שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים וְהָיוּ לְךָ יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים תֵּשַׁע וְאַרְבָּעִים שָׁנָה׃
    hebrewPlain: וספרת לך שבע שבתת שנים שבע שנים שבע פעמים והיו לך ימי שבע שבתת השנים תשע וארבעים שנה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:8
    kjvOsis:
    - Lev.25.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.9
    scripture: tanakh
    name: Tanakh Leviticus 25:9
    ref: Leviticus 25:9
    book: Lev
    section: torah
    chapter: 25
    verse: 9
    ordinal: 3476
    text: Then shalt thou make proclamation with the blast of the horn on the tenth day of the seventh month; in the day of atonement shall ye make proclamation with the horn throughout all your land.
    translation: JPS 1917
    original: וְהַעֲבַרְתָּ שׁוֹפַר תְּרוּעָה בַּחֹדֶשׁ הַשְּׁבִעִי בֶּעָשׂוֹר לַחֹדֶשׁ בְּיוֹם הַכִּפֻּרִים תַּעֲבִירוּ שׁוֹפָר בְּכָל־אַרְצְכֶם׃
    hebrewPlain: והעברת שופר תרועה בחדש השבעי בעשור לחדש ביום הכפרים תעבירו שופר בכל ארצכם
    parashah: Behar
    kjvRefs:
    - Leviticus 25:9
    kjvOsis:
    - Lev.25.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.10
    scripture: tanakh
    name: Tanakh Leviticus 25:10
    ref: Leviticus 25:10
    book: Lev
    section: torah
    chapter: 25
    verse: 10
    ordinal: 3477
    text: And ye shall hallow the fiftieth year, and proclaim liberty throughout the land unto all the inhabitants thereof; it shall be a jubilee unto you; and ye shall return every man unto his possession, and ye shall return every man unto his family.
    translation: JPS 1917
    original: וְקִדַּשְׁתֶּם אֵת שְׁנַת הַחֲמִשִּׁים שָׁנָה וּקְרָאתֶם דְּרוֹר בָּאָרֶץ לְכָל־יֹשְׁבֶיהָ יוֹבֵל הִוא תִּהְיֶה לָכֶם וְשַׁבְתֶּם אִישׁ אֶל־אֲחֻזָּתוֹ וְאִישׁ אֶל־מִשְׁפַּחְתּוֹ תָּשֻׁבוּ׃
    hebrewPlain: וקדשתם את שנת החמשים שנה וקראתם דרור בארץ לכל ישביה יובל הוא תהיה לכם ושבתם איש אל אחזתו ואיש אל משפחתו תשבו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:10
    kjvOsis:
    - Lev.25.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.11
    scripture: tanakh
    name: Tanakh Leviticus 25:11
    ref: Leviticus 25:11
    book: Lev
    section: torah
    chapter: 25
    verse: 11
    ordinal: 3478
    text: A jubilee shall that fiftieth year be unto you; ye shall not sow, neither reap that which groweth of itself in it, nor gather the grapes in it of the undressed vines.
    translation: JPS 1917
    original: יוֹבֵל הִוא שְׁנַת הַחֲמִשִּׁים שָׁנָה תִּהְיֶה לָכֶם לֹא תִזְרָעוּ וְלֹא תִקְצְרוּ אֶת־סְפִיחֶיהָ וְלֹא תִבְצְרוּ אֶת־נְזִרֶיהָ׃
    hebrewPlain: יובל הוא שנת החמשים שנה תהיה לכם לא תזרעו ולא תקצרו את ספיחיה ולא תבצרו את נזריה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:11
    kjvOsis:
    - Lev.25.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.12
    scripture: tanakh
    name: Tanakh Leviticus 25:12
    ref: Leviticus 25:12
    book: Lev
    section: torah
    chapter: 25
    verse: 12
    ordinal: 3479
    text: For it is a jubilee; it shall be holy unto you; ye shall eat the increase thereof out of the field.
    translation: JPS 1917
    original: כִּי יוֹבֵל הִוא קֹדֶשׁ תִּהְיֶה לָכֶם מִן־הַשָּׂדֶה תֹּאכְלוּ אֶת־תְּבוּאָתָהּ׃
    hebrewPlain: כי יובל הוא קדש תהיה לכם מן השדה תאכלו את תבואתה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:12
    kjvOsis:
    - Lev.25.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.13
    scripture: tanakh
    name: Tanakh Leviticus 25:13
    ref: Leviticus 25:13
    book: Lev
    section: torah
    chapter: 25
    verse: 13
    ordinal: 3480
    text: In this year of jubilee ye shall return every man unto his possession.
    translation: JPS 1917
    original: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת תָּשֻׁבוּ אִישׁ אֶל־אֲחֻזָּתוֹ׃
    hebrewPlain: בשנת היובל הזאת תשבו איש אל אחזתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:13
    kjvOsis:
    - Lev.25.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.14
    scripture: tanakh
    name: Tanakh Leviticus 25:14
    ref: Leviticus 25:14
    book: Lev
    section: torah
    chapter: 25
    verse: 14
    ordinal: 3481
    text: And if thou sell aught unto thy neighbour, or buy of thy neighbour’s hand, ye shall not wrong one another.
    translation: JPS 1917
    original: וְכִי־תִמְכְּרוּ מִמְכָּר לַעֲמִיתֶךָ אוֹ קָנֹה מִיַּד עֲמִיתֶךָ אַל־תּוֹנוּ אִישׁ אֶת־אָחִיו׃
    hebrewPlain: וכי תמכרו ממכר לעמיתך או קנה מיד עמיתך אל תונו איש את אחיו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:14
    kjvOsis:
    - Lev.25.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.15
    scripture: tanakh
    name: Tanakh Leviticus 25:15
    ref: Leviticus 25:15
    book: Lev
    section: torah
    chapter: 25
    verse: 15
    ordinal: 3482
    text: According to the number of years after the jubilee thou shalt buy of thy neighbour, and according unto the number of years of the crops he shall sell unto thee.
    translation: JPS 1917
    original: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל תִּקְנֶה מֵאֵת עֲמִיתֶךָ בְּמִסְפַּר שְׁנֵי־תְבוּאֹת יִמְכָּר־לָךְ׃
    hebrewPlain: במספר שנים אחר היובל תקנה מאת עמיתך במספר שני תבואת ימכר לך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:15
    kjvOsis:
    - Lev.25.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.16
    scripture: tanakh
    name: Tanakh Leviticus 25:16
    ref: Leviticus 25:16
    book: Lev
    section: torah
    chapter: 25
    verse: 16
    ordinal: 3483
    text: According to the multitude of the years thou shalt increase the price thereof, and according to the fewness of the years thou shalt diminish the price of it; for the number of crops doth he sell unto thee.
    translation: JPS 1917
    original: לְפִי רֹב הַשָּׁנִים תַּרְבֶּה מִקְנָתוֹ וּלְפִי מְעֹט הַשָּׁנִים תַּמְעִיט מִקְנָתוֹ כִּי מִסְפַּר תְּבוּאֹת הוּא מֹכֵר לָךְ׃
    hebrewPlain: לפי רב השנים תרבה מקנתו ולפי מעט השנים תמעיט מקנתו כי מספר תבואת הוא מכר לך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:16
    kjvOsis:
    - Lev.25.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.17
    scripture: tanakh
    name: Tanakh Leviticus 25:17
    ref: Leviticus 25:17
    book: Lev
    section: torah
    chapter: 25
    verse: 17
    ordinal: 3484
    text: And ye shall not wrong one another; but thou shalt fear thy God; for I am the LORD your God.
    translation: JPS 1917
    original: וְלֹא תוֹנוּ אִישׁ אֶת־עֲמִיתוֹ וְיָרֵאתָ מֵאֱלֹהֶיךָ כִּי אֲנִי יְהֹוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ולא תונו איש את עמיתו ויראת מאלהיך כי אני יהוה אלהיכם
    parashah: Behar
    kjvRefs:
    - Leviticus 25:17
    kjvOsis:
    - Lev.25.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.18
    scripture: tanakh
    name: Tanakh Leviticus 25:18
    ref: Leviticus 25:18
    book: Lev
    section: torah
    chapter: 25
    verse: 18
    ordinal: 3485
    text: Wherefore ye shall do My statutes, and keep Mine ordinances and do them; and ye shall dwell in the land in safety.
    translation: JPS 1917
    original: וַעֲשִׂיתֶם אֶת־חֻקֹּתַי וְאֶת־מִשְׁפָּטַי תִּשְׁמְרוּ וַעֲשִׂיתֶם אֹתָם וִישַׁבְתֶּם עַל־הָאָרֶץ לָבֶטַח׃
    hebrewPlain: ועשיתם את חקתי ואת משפטי תשמרו ועשיתם אתם וישבתם על הארץ לבטח
    parashah: Behar
    kjvRefs:
    - Leviticus 25:18
    kjvOsis:
    - Lev.25.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.19
    scripture: tanakh
    name: Tanakh Leviticus 25:19
    ref: Leviticus 25:19
    book: Lev
    section: torah
    chapter: 25
    verse: 19
    ordinal: 3486
    text: And the land shall yield her fruit, and ye shall eat until ye have enough, and dwell therein in safety.
    translation: JPS 1917
    original: וְנָתְנָה הָאָרֶץ פִּרְיָהּ וַאֲכַלְתֶּם לָשֹׂבַע וִישַׁבְתֶּם לָבֶטַח עָלֶיהָ׃
    hebrewPlain: ונתנה הארץ פריה ואכלתם לשבע וישבתם לבטח עליה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:19
    kjvOsis:
    - Lev.25.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.20
    scripture: tanakh
    name: Tanakh Leviticus 25:20
    ref: Leviticus 25:20
    book: Lev
    section: torah
    chapter: 25
    verse: 20
    ordinal: 3487
    text: 'And if ye shall say: ‘What shall we eat the seventh year? behold, we may not sow, nor gather in our increase’;'
    translation: JPS 1917
    original: וְכִי תֹאמְרוּ מַה־נֹּאכַל בַּשָּׁנָה הַשְּׁבִיעִת הֵן לֹא נִזְרָע וְלֹא נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ׃
    hebrewPlain: וכי תאמרו מה נאכל בשנה השביעת הן לא נזרע ולא נאסף את תבואתנו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:20
    kjvOsis:
    - Lev.25.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.21
    scripture: tanakh
    name: Tanakh Leviticus 25:21
    ref: Leviticus 25:21
    book: Lev
    section: torah
    chapter: 25
    verse: 21
    ordinal: 3488
    text: then I will command My blessing upon you in the sixth year, and it shall bring forth produce for the three years.
    translation: JPS 1917
    original: וְצִוִּיתִי אֶת־בִּרְכָתִי לָכֶם בַּשָּׁנָה הַשִּׁשִּׁית וְעָשָׂת אֶת־הַתְּבוּאָה לִשְׁלֹשׁ הַשָּׁנִים׃
    hebrewPlain: וצויתי את ברכתי לכם בשנה הששית ועשת את התבואה לשלש השנים
    parashah: Behar
    kjvRefs:
    - Leviticus 25:21
    kjvOsis:
    - Lev.25.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.22
    scripture: tanakh
    name: Tanakh Leviticus 25:22
    ref: Leviticus 25:22
    book: Lev
    section: torah
    chapter: 25
    verse: 22
    ordinal: 3489
    text: And ye shall sow the eighth year, and eat of the produce, the old store; until the ninth year, until her produce come in, ye shall eat the old store.
    translation: JPS 1917
    original: וּזְרַעְתֶּם אֵת הַשָּׁנָה הַשְּׁמִינִת וַאֲכַלְתֶּם מִן־הַתְּבוּאָה יָשָׁן עַד הַשָּׁנָה הַתְּשִׁיעִת עַד־בּוֹא תְּבוּאָתָהּ תֹּאכְלוּ יָשָׁן׃
    hebrewPlain: וזרעתם את השנה השמינת ואכלתם מן התבואה ישן עד השנה התשיעת עד בוא תבואתה תאכלו ישן
    parashah: Behar
    kjvRefs:
    - Leviticus 25:22
    kjvOsis:
    - Lev.25.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.23
    scripture: tanakh
    name: Tanakh Leviticus 25:23
    ref: Leviticus 25:23
    book: Lev
    section: torah
    chapter: 25
    verse: 23
    ordinal: 3490
    text: And the land shall not be sold in perpetuity; for the land is Mine; for ye are strangers and settlers with Me.
    translation: JPS 1917
    original: וְהָאָרֶץ לֹא תִמָּכֵר לִצְמִתֻת כִּי־לִי הָאָרֶץ כִּי־גֵרִים וְתוֹשָׁבִים אַתֶּם עִמָּדִי׃
    hebrewPlain: והארץ לא תמכר לצמתת כי לי הארץ כי גרים ותושבים אתם עמדי
    parashah: Behar
    kjvRefs:
    - Leviticus 25:23
    kjvOsis:
    - Lev.25.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.24
    scripture: tanakh
    name: Tanakh Leviticus 25:24
    ref: Leviticus 25:24
    book: Lev
    section: torah
    chapter: 25
    verse: 24
    ordinal: 3491
    text: And in all the land of your possession ye shall grant a redemption for the land.
    translation: JPS 1917
    original: וּבְכֹל אֶרֶץ אֲחֻזַּתְכֶם גְּאֻלָּה תִּתְּנוּ לָאָרֶץ׃
    hebrewPlain: ובכל ארץ אחזתכם גאלה תתנו לארץ
    parashah: Behar
    kjvRefs:
    - Leviticus 25:24
    kjvOsis:
    - Lev.25.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.25
    scripture: tanakh
    name: Tanakh Leviticus 25:25
    ref: Leviticus 25:25
    book: Lev
    section: torah
    chapter: 25
    verse: 25
    ordinal: 3492
    text: If thy brother be waxen poor, and sell some of his possession, then shall his kinsman that is next unto him come, and shall redeem that which his brother hath sold.
    translation: JPS 1917
    original: כִּי־יָמוּךְ אָחִיךָ וּמָכַר מֵאֲחֻזָּתוֹ וּבָא גֹאֲלוֹ הַקָּרֹב אֵלָיו וְגָאַל אֵת מִמְכַּר אָחִיו׃
    hebrewPlain: כי ימוך אחיך ומכר מאחזתו ובא גאלו הקרב אליו וגאל את ממכר אחיו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:25
    kjvOsis:
    - Lev.25.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.26
    scripture: tanakh
    name: Tanakh Leviticus 25:26
    ref: Leviticus 25:26
    book: Lev
    section: torah
    chapter: 25
    verse: 26
    ordinal: 3493
    text: And if a man have no one to redeem it, and he be waxen rich and find sufficient means to redeem it;
    translation: JPS 1917
    original: וְאִישׁ כִּי לֹא יִהְיֶה־לּוֹ גֹּאֵל וְהִשִּׂיגָה יָדוֹ וּמָצָא כְּדֵי גְאֻלָּתוֹ׃
    hebrewPlain: ואיש כי לא יהיה לו גאל והשיגה ידו ומצא כדי גאלתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:26
    kjvOsis:
    - Lev.25.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.27
    scripture: tanakh
    name: Tanakh Leviticus 25:27
    ref: Leviticus 25:27
    book: Lev
    section: torah
    chapter: 25
    verse: 27
    ordinal: 3494
    text: then let him count the years of the sale thereof, and restore the overplus unto the man to whom he sold it; and he shall return unto his possession.
    translation: JPS 1917
    original: וְחִשַּׁב אֶת־שְׁנֵי מִמְכָּרוֹ וְהֵשִׁיב אֶת־הָעֹדֵף לָאִישׁ אֲשֶׁר מָכַר־לוֹ וְשָׁב לַאֲחֻזָּתוֹ׃
    hebrewPlain: וחשב את שני ממכרו והשיב את העדף לאיש אשר מכר לו ושב לאחזתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:27
    kjvOsis:
    - Lev.25.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.28
    scripture: tanakh
    name: Tanakh Leviticus 25:28
    ref: Leviticus 25:28
    book: Lev
    section: torah
    chapter: 25
    verse: 28
    ordinal: 3495
    text: But if he have not sufficient means to get it back for himself, then that which he hath sold shall remain in the hand of him that hath bought it until the year of jubilee; and in the jubilee it shall go out, and he shall return unto his possession.
    translation: JPS 1917
    original: וְאִם לֹא־מָצְאָה יָדוֹ דֵּי הָשִׁיב לוֹ וְהָיָה מִמְכָּרוֹ בְּיַד הַקֹּנֶה אֹתוֹ עַד שְׁנַת הַיּוֹבֵל וְיָצָא בַּיֹּבֵל וְשָׁב לַאֲחֻזָּתוֹ׃
    hebrewPlain: ואם לא מצאה ידו די השיב לו והיה ממכרו ביד הקנה אתו עד שנת היובל ויצא ביבל ושב לאחזתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:28
    kjvOsis:
    - Lev.25.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.29
    scripture: tanakh
    name: Tanakh Leviticus 25:29
    ref: Leviticus 25:29
    book: Lev
    section: torah
    chapter: 25
    verse: 29
    ordinal: 3496
    text: And if a man sell a dwelling-house in a walled city, then he may redeem it within a whole year after it is sold; for a full year shall he have the right of redemption.
    translation: JPS 1917
    original: וְאִישׁ כִּי־יִמְכֹּר בֵּית־מוֹשַׁב עִיר חוֹמָה וְהָיְתָה גְּאֻלָּתוֹ עַד־תֹּם שְׁנַת מִמְכָּרוֹ יָמִים תִּהְיֶה גְאֻלָּתוֹ׃
    hebrewPlain: ואיש כי ימכר בית מושב עיר חומה והיתה גאלתו עד תם שנת ממכרו ימים תהיה גאלתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:29
    kjvOsis:
    - Lev.25.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.30
    scripture: tanakh
    name: Tanakh Leviticus 25:30
    ref: Leviticus 25:30
    book: Lev
    section: torah
    chapter: 25
    verse: 30
    ordinal: 3497
    text: And if it be not redeemed within the space of a full year, then the house that is in the walled city shall be made sure in perpetuity to him that bought it, throughout his generations; it shall not go out in the jubilee.
    translation: JPS 1917
    original: וְאִם לֹא־יִגָּאֵל עַד־מְלֹאת לוֹ שָׁנָה תְמִימָה וְקָם הַבַּיִת אֲשֶׁר־בָּעִיר אֲשֶׁר־לא [לוֹ] חֹמָה לַצְּמִיתֻת לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו לֹא יֵצֵא בַּיֹּבֵל׃
    hebrewPlain: ואם לא יגאל עד מלאת לו שנה תמימה וקם הבית אשר בעיר אשר לא [לו] חמה לצמיתת לקנה אתו לדרתיו לא יצא ביבל
    parashah: Behar
    kjvRefs:
    - Leviticus 25:30
    kjvOsis:
    - Lev.25.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.31
    scripture: tanakh
    name: Tanakh Leviticus 25:31
    ref: Leviticus 25:31
    book: Lev
    section: torah
    chapter: 25
    verse: 31
    ordinal: 3498
    text: But the houses of the villages which have no wall round about them shall be reckoned with the fields of the country; they may be redeemed, and they shall go out in the jubilee.
    translation: JPS 1917
    original: וּבָתֵּי הַחֲצֵרִים אֲשֶׁר אֵין־לָהֶם חֹמָה סָבִיב עַל־שְׂדֵה הָאָרֶץ יֵחָשֵׁב גְּאֻלָּה תִּהְיֶה־לּוֹ וּבַיֹּבֵל יֵצֵא׃
    hebrewPlain: ובתי החצרים אשר אין להם חמה סביב על שדה הארץ יחשב גאלה תהיה לו וביבל יצא
    parashah: Behar
    kjvRefs:
    - Leviticus 25:31
    kjvOsis:
    - Lev.25.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.32
    scripture: tanakh
    name: Tanakh Leviticus 25:32
    ref: Leviticus 25:32
    book: Lev
    section: torah
    chapter: 25
    verse: 32
    ordinal: 3499
    text: But as for the cities of the Levites, the houses of the cities of their possession, the Levites shall have a perpetual right of redemption.
    translation: JPS 1917
    original: וְעָרֵי הַלְוִיִּם בָּתֵּי עָרֵי אֲחֻזָּתָם גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם׃
    hebrewPlain: וערי הלוים בתי ערי אחזתם גאלת עולם תהיה ללוים
    parashah: Behar
    kjvRefs:
    - Leviticus 25:32
    kjvOsis:
    - Lev.25.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
