    original: וְהֵסִיר אֶת־מֻרְאָתוֹ בְּנֹצָתָהּ וְהִשְׁלִיךְ אֹתָהּ אֵצֶל הַמִּזְבֵּחַ קֵדְמָה אֶל־מְקוֹם הַדָּשֶׁן׃
    hebrewPlain: והסיר את מראתו בנצתה והשליך אתה אצל המזבח קדמה אל מקום הדשן
