    name: Tanakh Leviticus 19:1
    ref: Leviticus 19:1
    book: Lev
    section: torah
    chapter: 19
    verse: 1
    ordinal: 3280
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:1
    kjvOsis:
    - Lev.19.1
