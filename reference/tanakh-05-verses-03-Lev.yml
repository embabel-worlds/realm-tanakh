    scripture: tanakh
    name: Tanakh Leviticus 23:11
    ref: Leviticus 23:11
    book: Lev
    section: torah
    chapter: 23
    verse: 11
    ordinal: 3411
    text: And he shall wave the sheaf before the LORD, to be accepted for you; on the morrow after the sabbath the priest shall wave it.
    translation: JPS 1917
    original: וְהֵנִיף אֶת־הָעֹמֶר לִפְנֵי יְהוָה לִרְצֹנְכֶם מִמָּחֳרַת הַשַּׁבָּת יְנִיפֶנּוּ הַכֹּהֵן׃
    hebrewPlain: והניף את העמר לפני יהוה לרצנכם ממחרת השבת יניפנו הכהן
    parashah: Emor
    kjvRefs:
    - Leviticus 23:11
    kjvOsis:
    - Lev.23.11
