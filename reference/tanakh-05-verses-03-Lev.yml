    scripture: tanakh
    name: Tanakh Leviticus 8:3
    ref: Leviticus 8:3
    book: Lev
    section: torah
    chapter: 8
    verse: 3
    ordinal: 2918
    text: and assemble thou all the congregation at the door of the tent of meeting.’
    translation: JPS 1917
    original: וְאֵת כָּל־הָעֵדָה הַקְהֵל אֶל־פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: ואת כל העדה הקהל אל פתח אהל מועד
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:3
    kjvOsis:
    - Lev.8.3
