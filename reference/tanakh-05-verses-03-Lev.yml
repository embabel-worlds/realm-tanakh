  data:
    osis: Lev.14.23
    scripture: tanakh
    name: Tanakh Leviticus 14:23
    ref: Leviticus 14:23
    book: Lev
    section: torah
    chapter: 14
    verse: 23
    ordinal: 3132
    text: And on the eighth day he shall bring them for his cleansing unto the priest, unto the door of the tent of meeting, before the LORD.
    translation: JPS 1917
    original: וְהֵבִיא אֹתָם בַּיּוֹם הַשְּׁמִינִי לְטָהֳרָתוֹ אֶל־הַכֹּהֵן אֶל־פֶּתַח אֹהֶל־מוֹעֵד לִפְנֵי יְהוָה׃
    hebrewPlain: והביא אתם ביום השמיני לטהרתו אל הכהן אל פתח אהל מועד לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:23
    kjvOsis:
    - Lev.14.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
