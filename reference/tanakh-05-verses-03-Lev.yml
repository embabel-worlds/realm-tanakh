  data:
    osis: Lev.7.4
    scripture: tanakh
    name: Tanakh Leviticus 7:4
    ref: Leviticus 7:4
    book: Lev
    section: torah
    chapter: 7
    verse: 4
    ordinal: 2881
    text: and the two kidneys, and the fat that is on them, which is by the loins, and the lobe above the liver, which he shall take away by the kidneys.
    translation: JPS 1917
    original: וְאֵת שְׁתֵּי הַכְּלָיֹת וְאֶת־הַחֵלֶב אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל־הַכְּסָלִים וְאֶת־הַיֹּתֶרֶת עַל־הַכָּבֵד עַל־הַכְּלָיֹת יְסִירֶנָּה׃
    hebrewPlain: ואת שתי הכלית ואת החלב אשר עליהן אשר על הכסלים ואת היתרת על הכבד על הכלית יסירנה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:4
    kjvOsis:
    - Lev.7.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
