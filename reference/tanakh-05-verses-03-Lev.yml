- type: TanakhVerse
  data:
    osis: Lev.7.24
    scripture: tanakh
    name: Tanakh Leviticus 7:24
    ref: Leviticus 7:24
    book: Lev
    section: torah
    chapter: 7
    verse: 24
    ordinal: 2901
    text: And the fat of that which dieth of itself, and the fat of that which is torn of beasts, may be used for any other service; but ye shall in no wise eat of it.
    translation: JPS 1917
    original: וְחֵלֶב נְבֵלָה וְחֵלֶב טְרֵפָה יֵעָשֶׂה לְכָל־מְלָאכָה וְאָכֹל לֹא תֹאכְלֻהוּ׃
    hebrewPlain: וחלב נבלה וחלב טרפה יעשה לכל מלאכה ואכל לא תאכלהו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:24
    kjvOsis:
    - Lev.7.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
