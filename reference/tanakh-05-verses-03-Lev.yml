    ref: Leviticus 4:22
    book: Lev
    section: torah
    chapter: 4
    verse: 22
    ordinal: 2815
    text: 'When a ruler sinneth, and doeth through error any one of all the things which the LORD his God hath commanded not to be done, and is guilty:'
    translation: JPS 1917
    original: אֲשֶׁר נָשִׂיא יֶחֱטָא וְעָשָׂה אַחַת מִכָּל־מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא־תֵעָשֶׂינָה בִּשְׁגָגָה וְאָשֵׁם׃
    hebrewPlain: אשר נשיא יחטא ועשה אחת מכל מצות יהוה אלהיו אשר לא תעשינה בשגגה ואשם
    parashah: Vayikra
