  data:
    osis: Lev.5.16
    scripture: tanakh
    name: Tanakh Leviticus 5:16
    ref: Leviticus 5:16
    book: Lev
    section: torah
    chapter: 5
    verse: 16
    ordinal: 2844
    text: And he shall make restitution for that which he hath done amiss in the holy thing, and shall add the fifth part thereto, and give it unto the priest; and the priest shall make atonement for him with the ram of the guilt-offering, and he shall be forgiven.
    translation: JPS 1917
    original: וְאֵת אֲשֶׁר חָטָא מִן־הַקֹּדֶשׁ יְשַׁלֵּם וְאֶת־חֲמִישִׁתוֹ יוֹסֵף עָלָיו וְנָתַן אֹתוֹ לַכֹּהֵן וְהַכֹּהֵן יְכַפֵּר עָלָיו בְּאֵיל הָאָשָׁם וְנִסְלַח לוֹ׃
    hebrewPlain: ואת אשר חטא מן הקדש ישלם ואת חמישתו יוסף עליו ונתן אתו לכהן והכהן יכפר עליו באיל האשם ונסלח לו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:16
    kjvOsis:
    - Lev.5.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
