  data:
    osis: Lev.23.12
    scripture: tanakh
    name: Tanakh Leviticus 23:12
    ref: Leviticus 23:12
    book: Lev
    section: torah
    chapter: 23
    verse: 12
    ordinal: 3412
    text: And in the day when ye wave the sheaf, ye shall offer a he-lamb without blemish of the first year for a burnt-offering unto the LORD.
    translation: JPS 1917
    original: וַעֲשִׂיתֶם בְּיוֹם הֲנִיפְכֶם אֶת־הָעֹמֶר כֶּבֶשׂ תָּמִים בֶּן־שְׁנָתוֹ לְעֹלָה לַיהוָה׃
    hebrewPlain: ועשיתם ביום הניפכם את העמר כבש תמים בן שנתו לעלה ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:12
    kjvOsis:
    - Lev.23.12
