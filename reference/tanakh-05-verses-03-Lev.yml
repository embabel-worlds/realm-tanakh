  data:
    osis: Lev.14.56
    scripture: tanakh
    name: Tanakh Leviticus 14:56
    ref: Leviticus 14:56
    book: Lev
    section: torah
    chapter: 14
    verse: 56
    ordinal: 3165
    text: and for a rising, and for a scab, and for a bright spot;
    translation: JPS 1917
    original: וְלַשְׂאֵת וְלַסַּפַּחַת וְלַבֶּהָרֶת׃
    hebrewPlain: ולשאת ולספחת ולבהרת
    parashah: Metzora
    kjvRefs:
