  data:
    osis: Lev.13.42
    scripture: tanakh
    name: Tanakh Leviticus 13:42
    ref: Leviticus 13:42
    book: Lev
    section: torah
    chapter: 13
    verse: 42
    ordinal: 3092
    text: But if there be in the bald head, or the bald forehead, a reddish-white plague, it is leprosy breaking out in his bald head, or his bald forehead.
    translation: JPS 1917
    original: וְכִי־יִהְיֶה בַקָּרַחַת אוֹ בַגַּבַּחַת נֶגַע לָבָן אֲדַמְדָּם צָרַעַת פֹּרַחַת הִוא בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ׃
    hebrewPlain: וכי יהיה בקרחת או בגבחת נגע לבן אדמדם צרעת פרחת הוא בקרחתו או בגבחתו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:42
    kjvOsis:
    - Lev.13.42
