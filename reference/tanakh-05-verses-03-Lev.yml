  data:
    osis: Lev.23.37
    scripture: tanakh
    name: Tanakh Leviticus 23:37
    ref: Leviticus 23:37
    book: Lev
    section: torah
    chapter: 23
    verse: 37
    ordinal: 3437
    text: These are the appointed seasons of the LORD, which ye shall proclaim to be holy convocations, to bring an offering made by fire unto the LORD, a burnt-offering, and a meal-offering, a sacrifice, and drink-offerings, each on its own day;
    translation: JPS 1917
    original: אֵלֶּה מוֹעֲדֵי יְהוָה אֲשֶׁר־תִּקְרְאוּ אֹתָם מִקְרָאֵי קֹדֶשׁ לְהַקְרִיב אִשֶּׁה לַיהוָה עֹלָה וּמִנְחָה זֶבַח וּנְסָכִים דְּבַר־יוֹם בְּיוֹמוֹ׃
    hebrewPlain: אלה מועדי יהוה אשר תקראו אתם מקראי קדש להקריב אשה ליהוה עלה ומנחה זבח ונסכים דבר יום ביומו
    parashah: Emor
    kjvRefs:
    - Leviticus 23:37
    kjvOsis:
    - Lev.23.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
