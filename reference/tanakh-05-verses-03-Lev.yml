    section: torah
    chapter: 23
    verse: 6
    ordinal: 3406
    text: And on the fifteenth day of the same month is the feast of unleavened bread unto the LORD; seven days ye shall eat unleavened bread.
    translation: JPS 1917
    original: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה חַג הַמַּצּוֹת לַיהוָה שִׁבְעַת יָמִים מַצּוֹת תֹּאכֵלוּ׃
    hebrewPlain: ובחמשה עשר יום לחדש הזה חג המצות ליהוה שבעת ימים מצות תאכלו
