    verse: 31
    ordinal: 2824
    text: And all the fat thereof shall he take away, as the fat is taken away from off the sacrifice of peace-offerings; and the priest shall make it smoke upon the altar for a sweet savour unto the LORD; and the priest shall make atonement for him, and he shall be forgiven.
    translation: JPS 1917
