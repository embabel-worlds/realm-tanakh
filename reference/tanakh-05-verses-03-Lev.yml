      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.37
    scripture: tanakh
    name: Tanakh Leviticus 11:37
    ref: Leviticus 11:37
    book: Lev
    section: torah
    chapter: 11
    verse: 37
    ordinal: 3032
    text: And if aught of their carcass fall upon any sowing seed which is to be sown, it is clean.
    translation: JPS 1917
    original: וְכִי יִפֹּל מִנִּבְלָתָם עַל־כָּל־זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ טָהוֹר הוּא׃
    hebrewPlain: וכי יפל מנבלתם על כל זרע זרוע אשר יזרע טהור הוא
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:37
    kjvOsis:
    - Lev.11.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
