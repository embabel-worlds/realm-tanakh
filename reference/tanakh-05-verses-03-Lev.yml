    text: And ye shall do no manner of work in that same day; for it is a day of atonement, to make atonement for you before the LORD your God.
    translation: JPS 1917
    original: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ בְּעֶצֶם הַיּוֹם הַזֶּה כִּי יוֹם כִּפֻּרִים הוּא לְכַפֵּר עֲלֵיכֶם לִפְנֵי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: וכל מלאכה לא תעשו בעצם היום הזה כי יום כפרים הוא לכפר עליכם לפני יהוה אלהיכם
    parashah: Emor
