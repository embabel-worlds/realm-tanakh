    ref: Leviticus 2:7
    book: Lev
    section: torah
    chapter: 2
    verse: 7
    ordinal: 2767
    text: And if thy offering be a meal-offering of the stewing-pan, it shall be made of fine flour with oil.
    translation: JPS 1917
    original: וְאִם־מִנְחַת מַרְחֶשֶׁת קָרְבָּנֶךָ סֹלֶת בַּשֶּׁמֶן תֵּעָשֶׂה׃
    hebrewPlain: ואם מנחת מרחשת קרבנך סלת בשמן תעשה
    parashah: Vayikra
