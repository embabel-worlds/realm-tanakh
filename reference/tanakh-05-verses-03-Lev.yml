  data:
    osis: Lev.24.14
    scripture: tanakh
    name: Tanakh Leviticus 24:14
    ref: Leviticus 24:14
    book: Lev
    section: torah
    chapter: 24
    verse: 14
    ordinal: 3458
    text: ’Bring forth him that hath cursed without the camp; and let all that heard him lay their hands upon his head, and let all the congregation stone him.
    translation: JPS 1917
    original: הוֹצֵא אֶת־הַמְקַלֵּל אֶל־מִחוּץ לַמַּחֲנֶה וְסָמְכוּ כָל־הַשֹּׁמְעִים אֶת־יְדֵיהֶם עַל־רֹאשׁוֹ וְרָגְמוּ אֹתוֹ כָּל־הָעֵדָה׃
    hebrewPlain: הוצא את המקלל אל מחוץ למחנה וסמכו כל השמעים את ידיהם על ראשו ורגמו אתו כל העדה
    parashah: Emor
    kjvRefs:
    - Leviticus 24:14
    kjvOsis:
    - Lev.24.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.15
    scripture: tanakh
    name: Tanakh Leviticus 24:15
    ref: Leviticus 24:15
    book: Lev
    section: torah
    chapter: 24
    verse: 15
    ordinal: 3459
    text: 'And thou shalt speak unto the children of Israel, saying: Whosoever curseth his God shall bear his sin.'
    translation: JPS 1917
    original: וְאֶל־בְּנֵי יִשְׂרָאֵל תְּדַבֵּר לֵאמֹר אִישׁ אִישׁ כִּי־יְקַלֵּל אֱלֹהָיו וְנָשָׂא חֶטְאוֹ׃
    hebrewPlain: ואל בני ישראל תדבר לאמר איש איש כי יקלל אלהיו ונשא חטאו
    parashah: Emor
    kjvRefs:
    - Leviticus 24:15
    kjvOsis:
    - Lev.24.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.16
    scripture: tanakh
    name: Tanakh Leviticus 24:16
    ref: Leviticus 24:16
    book: Lev
    section: torah
    chapter: 24
    verse: 16
    ordinal: 3460
    text: And he that blasphemeth the name of the LORD, he shall surely be put to death; all the congregation shall certainly stone him; as well the stranger, as the home-born, when he blasphemeth the Name, shall be put to death.
    translation: JPS 1917
    original: וְנֹקֵב שֵׁם־יְהוָה מוֹת יוּמָת רָגוֹם יִרְגְּמוּ־בוֹ כָּל־הָעֵדָה כַּגֵּר כָּאֶזְרָח בְּנָקְבוֹ־שֵׁם יוּמָת׃
    hebrewPlain: ונקב שם יהוה מות יומת רגום ירגמו בו כל העדה כגר כאזרח בנקבו שם יומת
    parashah: Emor
    kjvRefs:
    - Leviticus 24:16
    kjvOsis:
    - Lev.24.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.17
    scripture: tanakh
    name: Tanakh Leviticus 24:17
    ref: Leviticus 24:17
    book: Lev
    section: torah
    chapter: 24
    verse: 17
    ordinal: 3461
    text: And he that smiteth any man mortally shall surely be put to death.
    translation: JPS 1917
    original: וְאִישׁ כִּי יַכֶּה כָּל־נֶפֶשׁ אָדָם מוֹת יוּמָת׃
    hebrewPlain: ואיש כי יכה כל נפש אדם מות יומת
    parashah: Emor
    kjvRefs:
    - Leviticus 24:17
    kjvOsis:
    - Lev.24.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.18
    scripture: tanakh
    name: Tanakh Leviticus 24:18
    ref: Leviticus 24:18
    book: Lev
    section: torah
    chapter: 24
    verse: 18
    ordinal: 3462
    text: 'And he that smiteth a beast mortally shall make it good: life for life.'
    translation: JPS 1917
    original: וּמַכֵּה נֶפֶשׁ־בְּהֵמָה יְשַׁלְּמֶנָּה נֶפֶשׁ תַּחַת נָפֶשׁ׃
    hebrewPlain: ומכה נפש בהמה ישלמנה נפש תחת נפש
    parashah: Emor
    kjvRefs:
    - Leviticus 24:18
    kjvOsis:
    - Lev.24.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.19
    scripture: tanakh
    name: Tanakh Leviticus 24:19
    ref: Leviticus 24:19
    book: Lev
    section: torah
    chapter: 24
    verse: 19
    ordinal: 3463
    text: 'And if a man maim his neighbour; as he hath done, so shall it be done to him:'
    translation: JPS 1917
    original: וְאִישׁ כִּי־יִתֵּן מוּם בַּעֲמִיתוֹ כַּאֲשֶׁר עָשָׂה כֵּן יֵעָשֶׂה לּוֹ׃
    hebrewPlain: ואיש כי יתן מום בעמיתו כאשר עשה כן יעשה לו
    parashah: Emor
    kjvRefs:
    - Leviticus 24:19
    kjvOsis:
    - Lev.24.19
  relations:
