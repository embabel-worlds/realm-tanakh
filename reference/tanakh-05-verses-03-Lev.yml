- type: TanakhVerse
  data:
    osis: Lev.26.15
    scripture: tanakh
    name: Tanakh Leviticus 26:15
    ref: Leviticus 26:15
    book: Lev
    section: torah
    chapter: 26
    verse: 15
    ordinal: 3537
    text: and if ye shall reject My statutes, and if your soul abhor Mine ordinances, so that ye will not do all My commandments, but break My covenant;
    translation: JPS 1917
    original: וְאִם־בְּחֻקֹּתַי תִּמְאָסוּ וְאִם אֶת־מִשְׁפָּטַי תִּגְעַל נַפְשְׁכֶם לְבִלְתִּי עֲשׂוֹת אֶת־כָּל־מִצְוֺתַי לְהַפְרְכֶם אֶת־בְּרִיתִי׃
    hebrewPlain: ואם בחקתי תמאסו ואם את משפטי תגעל נפשכם לבלתי עשות את כל מצותי להפרכם את בריתי
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:15
    kjvOsis:
    - Lev.26.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.16
    scripture: tanakh
    name: Tanakh Leviticus 26:16
    ref: Leviticus 26:16
    book: Lev
    section: torah
    chapter: 26
    verse: 16
    ordinal: 3538
    text: 'I also will do this unto you: I will appoint terror over you, even consumption and fever, that shall make the eyes to fail, and the soul to languish; and ye shall sow your seed in vain, for your enemies shall eat it.'
    translation: JPS 1917
    original: אַף־אֲנִי אֶעֱשֶׂה־זֹּאת לָכֶם וְהִפְקַדְתִּי עֲלֵיכֶם בֶּהָלָה אֶת־הַשַּׁחֶפֶת וְאֶת־הַקַּדַּחַת מְכַלּוֹת עֵינַיִם וּמְדִיבֹת נָפֶשׁ וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם וַאֲכָלֻהוּ אֹיְבֵיכֶם׃
    hebrewPlain: אף אני אעשה זאת לכם והפקדתי עליכם בהלה את השחפת ואת הקדחת מכלות עינים ומדיבת נפש וזרעתם לריק זרעכם ואכלהו איביכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:16
    kjvOsis:
    - Lev.26.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.17
    scripture: tanakh
    name: Tanakh Leviticus 26:17
    ref: Leviticus 26:17
    book: Lev
    section: torah
    chapter: 26
    verse: 17
    ordinal: 3539
    text: And I will set My face against you, and ye shall be smitten before your enemies; they that hate you shall rule over you; and ye shall flee when none pursueth you.
    translation: JPS 1917
    original: וְנָתַתִּי פָנַי בָּכֶם וְנִגַּפְתֶּם לִפְנֵי אֹיְבֵיכֶם וְרָדוּ בָכֶם שֹׂנְאֵיכֶם וְנַסְתֶּם וְאֵין־רֹדֵף אֶתְכֶם׃
    hebrewPlain: ונתתי פני בכם ונגפתם לפני איביכם ורדו בכם שנאיכם ונסתם ואין רדף אתכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:17
    kjvOsis:
    - Lev.26.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.18
    scripture: tanakh
    name: Tanakh Leviticus 26:18
    ref: Leviticus 26:18
    book: Lev
    section: torah
    chapter: 26
    verse: 18
    ordinal: 3540
    text: And if ye will not yet for these things hearken unto Me, then I will chastise you seven times more for your sins.
    translation: JPS 1917
    original: וְאִם־עַד־אֵלֶּה לֹא תִשְׁמְעוּ לִי וְיָסַפְתִּי לְיַסְּרָה אֶתְכֶם שֶׁבַע עַל־חַטֹּאתֵיכֶם׃
    hebrewPlain: ואם עד אלה לא תשמעו לי ויספתי ליסרה אתכם שבע על חטאתיכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:18
    kjvOsis:
    - Lev.26.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.19
    scripture: tanakh
    name: Tanakh Leviticus 26:19
    ref: Leviticus 26:19
    book: Lev
    section: torah
    chapter: 26
    verse: 19
    ordinal: 3541
    text: And I will break the pride of your power; and I will make your heaven as iron, and your earth as brass.
    translation: JPS 1917
    original: וְשָׁבַרְתִּי אֶת־גְּאוֹן עֻזְּכֶם וְנָתַתִּי אֶת־שְׁמֵיכֶם כַּבַּרְזֶל וְאֶת־אַרְצְכֶם כַּנְּחֻשָׁה׃
    hebrewPlain: ושברתי את גאון עזכם ונתתי את שמיכם כברזל ואת ארצכם כנחשה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:19
    kjvOsis:
    - Lev.26.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.20
    scripture: tanakh
    name: Tanakh Leviticus 26:20
    ref: Leviticus 26:20
    book: Lev
    section: torah
    chapter: 26
    verse: 20
    ordinal: 3542
    text: And your strength shall be spent in vain; for your land shall not yield her produce, neither shall the trees of the land yield their fruit.
    translation: JPS 1917
    original: וְתַם לָרִיק כֹּחֲכֶם וְלֹא־תִתֵּן אַרְצְכֶם אֶת־יְבוּלָהּ וְעֵץ הָאָרֶץ לֹא יִתֵּן פִּרְיוֹ׃
    hebrewPlain: ותם לריק כחכם ולא תתן ארצכם את יבולה ועץ הארץ לא יתן פריו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:20
    kjvOsis:
    - Lev.26.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.21
    scripture: tanakh
    name: Tanakh Leviticus 26:21
    ref: Leviticus 26:21
    book: Lev
    section: torah
    chapter: 26
    verse: 21
    ordinal: 3543
    text: And if ye walk contrary unto Me, and will not hearken unto Me; I will bring seven times more plagues upon you according to your sins.
    translation: JPS 1917
    original: וְאִם־תֵּלְכוּ עִמִּי קֶרִי וְלֹא תֹאבוּ לִשְׁמֹעַ לִי וְיָסַפְתִּי עֲלֵיכֶם מַכָּה שֶׁבַע כְּחַטֹּאתֵיכֶם׃
    hebrewPlain: ואם תלכו עמי קרי ולא תאבו לשמע לי ויספתי עליכם מכה שבע כחטאתיכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:21
    kjvOsis:
    - Lev.26.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.22
    scripture: tanakh
    name: Tanakh Leviticus 26:22
    ref: Leviticus 26:22
    book: Lev
    section: torah
    chapter: 26
    verse: 22
    ordinal: 3544
    text: And I will send the beast of the field among you, which shall rob you of your children, and destroy your cattle, and make you few in number; and your ways shall become desolate.
    translation: JPS 1917
    original: וְהִשְׁלַחְתִּי בָכֶם אֶת־חַיַּת הַשָּׂדֶה וְשִׁכְּלָה אֶתְכֶם וְהִכְרִיתָה אֶת־בְּהֶמְתְּכֶם וְהִמְעִיטָה אֶתְכֶם וְנָשַׁמּוּ דַּרְכֵיכֶם׃
    hebrewPlain: והשלחתי בכם את חית השדה ושכלה אתכם והכריתה את בהמתכם והמעיטה אתכם ונשמו דרכיכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:22
    kjvOsis:
    - Lev.26.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.23
    scripture: tanakh
    name: Tanakh Leviticus 26:23
    ref: Leviticus 26:23
    book: Lev
    section: torah
    chapter: 26
    verse: 23
    ordinal: 3545
    text: And if in spite of these things ye will not be corrected unto Me, but will walk contrary unto Me;
    translation: JPS 1917
    original: וְאִם־בְּאֵלֶּה לֹא תִוָּסְרוּ לִי וַהֲלַכְתֶּם עִמִּי קֶרִי׃
    hebrewPlain: ואם באלה לא תוסרו לי והלכתם עמי קרי
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:23
    kjvOsis:
    - Lev.26.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.24
    scripture: tanakh
    name: Tanakh Leviticus 26:24
    ref: Leviticus 26:24
    book: Lev
    section: torah
    chapter: 26
    verse: 24
    ordinal: 3546
    text: then will I also walk contrary unto you; and I will smite you, even I, seven times for your sins.
    translation: JPS 1917
    original: וְהָלַכְתִּי אַף־אֲנִי עִמָּכֶם בְּקֶרִי וְהִכֵּיתִי אֶתְכֶם גַּם־אָנִי שֶׁבַע עַל־חַטֹּאתֵיכֶם׃
    hebrewPlain: והלכתי אף אני עמכם בקרי והכיתי אתכם גם אני שבע על חטאתיכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:24
    kjvOsis:
    - Lev.26.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.25
    scripture: tanakh
    name: Tanakh Leviticus 26:25
    ref: Leviticus 26:25
    book: Lev
    section: torah
    chapter: 26
    verse: 25
    ordinal: 3547
    text: And I will bring a sword upon you, that shall execute the vengeance of the covenant; and ye shall be gathered together within your cities; and I will send the pestilence among you; and ye shall be delivered into the hand of the enemy.
    translation: JPS 1917
    original: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב נֹקֶמֶת נְקַם־בְּרִית וְנֶאֱסַפְתֶּם אֶל־עָרֵיכֶם וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם וְנִתַּתֶּם בְּיַד־אוֹיֵב׃
    hebrewPlain: והבאתי עליכם חרב נקמת נקם ברית ונאספתם אל עריכם ושלחתי דבר בתוככם ונתתם ביד אויב
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:25
    kjvOsis:
    - Lev.26.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.26
    scripture: tanakh
    name: Tanakh Leviticus 26:26
    ref: Leviticus 26:26
    book: Lev
    section: torah
    chapter: 26
    verse: 26
    ordinal: 3548
    text: When I break your staff of bread, ten women shall bake your bread in one oven, and they shall deliver your bread again by weight; and ye shall eat, and not be satisfied.
    translation: JPS 1917
    original: בְּשִׁבְרִי לָכֶם מַטֵּה־לֶחֶם וְאָפוּ עֶשֶׂר נָשִׁים לַחְמְכֶם בְּתַנּוּר אֶחָד וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ׃
    hebrewPlain: בשברי לכם מטה לחם ואפו עשר נשים לחמכם בתנור אחד והשיבו לחמכם במשקל ואכלתם ולא תשבעו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:26
    kjvOsis:
    - Lev.26.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.27
    scripture: tanakh
    name: Tanakh Leviticus 26:27
    ref: Leviticus 26:27
    book: Lev
    section: torah
    chapter: 26
    verse: 27
    ordinal: 3549
    text: And if ye will not for all this hearken unto Me, but walk contrary unto Me;
    translation: JPS 1917
    original: וְאִם־בְּזֹאת לֹא תִשְׁמְעוּ לִי וַהֲלַכְתֶּם עִמִּי בְּקֶרִי׃
    hebrewPlain: ואם בזאת לא תשמעו לי והלכתם עמי בקרי
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:27
    kjvOsis:
    - Lev.26.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.28
    scripture: tanakh
    name: Tanakh Leviticus 26:28
    ref: Leviticus 26:28
    book: Lev
    section: torah
    chapter: 26
    verse: 28
    ordinal: 3550
    text: then I will walk contrary unto you in fury; and I also will chastise you seven times for your sins.
    translation: JPS 1917
    original: וְהָלַכְתִּי עִמָּכֶם בַּחֲמַת־קֶרִי וְיִסַּרְתִּי אֶתְכֶם אַף־אָנִי שֶׁבַע עַל־חַטֹּאתֵיכֶם׃
    hebrewPlain: והלכתי עמכם בחמת קרי ויסרתי אתכם אף אני שבע על חטאתיכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:28
    kjvOsis:
    - Lev.26.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.29
    scripture: tanakh
    name: Tanakh Leviticus 26:29
    ref: Leviticus 26:29
    book: Lev
    section: torah
    chapter: 26
    verse: 29
    ordinal: 3551
    text: And ye shall eat the flesh of your sons, and the flesh of your daughters shall ye eat.
    translation: JPS 1917
    original: וַאֲכַלְתֶּם בְּשַׂר בְּנֵיכֶם וּבְשַׂר בְּנֹתֵיכֶם תֹּאכֵלוּ׃
    hebrewPlain: ואכלתם בשר בניכם ובשר בנתיכם תאכלו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:29
    kjvOsis:
    - Lev.26.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.30
    scripture: tanakh
    name: Tanakh Leviticus 26:30
    ref: Leviticus 26:30
    book: Lev
    section: torah
    chapter: 26
    verse: 30
    ordinal: 3552
    text: And I will destroy your high places, and cut down your sun-pillars, and cast your carcasses upon the carcasses of your idols; and My soul shall abhor you.
    translation: JPS 1917
    original: וְהִשְׁמַדְתִּי אֶת־בָּמֹתֵיכֶם וְהִכְרַתִּי אֶת־חַמָּנֵיכֶם וְנָתַתִּי אֶת־פִּגְרֵיכֶם עַל־פִּגְרֵי גִּלּוּלֵיכֶם וְגָעֲלָה נַפְשִׁי אֶתְכֶם׃
    hebrewPlain: והשמדתי את במתיכם והכרתי את חמניכם ונתתי את פגריכם על פגרי גלוליכם וגעלה נפשי אתכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:30
    kjvOsis:
    - Lev.26.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.31
    scripture: tanakh
    name: Tanakh Leviticus 26:31
    ref: Leviticus 26:31
    book: Lev
    section: torah
    chapter: 26
    verse: 31
    ordinal: 3553
    text: And I will make your cities a waste, and will bring your sanctuaries unto desolation, and I will not smell the savour of your sweet odours.
    translation: JPS 1917
    original: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה וַהֲשִׁמּוֹתִי אֶת־מִקְדְּשֵׁיכֶם וְלֹא אָרִיחַ בְּרֵיחַ נִיחֹחֲכֶם׃
    hebrewPlain: ונתתי את עריכם חרבה והשמותי את מקדשיכם ולא אריח בריח ניחחכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:31
    kjvOsis:
    - Lev.26.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.32
    scripture: tanakh
    name: Tanakh Leviticus 26:32
    ref: Leviticus 26:32
    book: Lev
    section: torah
    chapter: 26
    verse: 32
    ordinal: 3554
    text: And I will bring the land into desolation; and your enemies that dwell therein shall be astonished at it.
    translation: JPS 1917
    original: וַהֲשִׁמֹּתִי אֲנִי אֶת־הָאָרֶץ וְשָׁמְמוּ עָלֶיהָ אֹיְבֵיכֶם הַיֹּשְׁבִים בָּהּ׃
    hebrewPlain: והשמתי אני את הארץ ושממו עליה איביכם הישבים בה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:32
    kjvOsis:
    - Lev.26.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.33
    scripture: tanakh
    name: Tanakh Leviticus 26:33
    ref: Leviticus 26:33
    book: Lev
    section: torah
    chapter: 26
    verse: 33
    ordinal: 3555
    text: And you will I scatter among the nations, and I will draw out the sword after you; and your land shall be a desolation, and your cities shall be a waste.
    translation: JPS 1917
    original: וְאֶתְכֶם אֱזָרֶה בַגּוֹיִם וַהֲרִיקֹתִי אַחֲרֵיכֶם חָרֶב וְהָיְתָה אַרְצְכֶם שְׁמָמָה וְעָרֵיכֶם יִהְיוּ חָרְבָּה׃
    hebrewPlain: ואתכם אזרה בגוים והריקתי אחריכם חרב והיתה ארצכם שממה ועריכם יהיו חרבה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:33
    kjvOsis:
    - Lev.26.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.34
    scripture: tanakh
    name: Tanakh Leviticus 26:34
    ref: Leviticus 26:34
    book: Lev
    section: torah
    chapter: 26
    verse: 34
    ordinal: 3556
    text: Then shall the land be paid her sabbaths, as long as it lieth desolate, and ye are in your enemies’ land; even then shall the land rest, and repay her sabbaths.
    translation: JPS 1917
    original: אָז תִּרְצֶה הָאָרֶץ אֶת־שַׁבְּתֹתֶיהָ כֹּל יְמֵי הֳשַׁמָּה וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם אָז תִּשְׁבַּת הָאָרֶץ וְהִרְצָת אֶת־שַׁבְּתֹתֶיהָ׃
    hebrewPlain: אז תרצה הארץ את שבתתיה כל ימי השמה ואתם בארץ איביכם אז תשבת הארץ והרצת את שבתתיה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:34
    kjvOsis:
    - Lev.26.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.35
    scripture: tanakh
    name: Tanakh Leviticus 26:35
    ref: Leviticus 26:35
    book: Lev
    section: torah
    chapter: 26
    verse: 35
    ordinal: 3557
    text: As long as it lieth desolate it shall have rest; even the rest which it had not in your sabbaths, when ye dwelt upon it.
    translation: JPS 1917
    original: כָּל־יְמֵי הָשַּׁמָּה תִּשְׁבֹּת אֵת אֲשֶׁר לֹא־שָׁבְתָה בְּשַׁבְּתֹתֵיכֶם בְּשִׁבְתְּכֶם עָלֶיהָ׃
    hebrewPlain: כל ימי השמה תשבת את אשר לא שבתה בשבתתיכם בשבתכם עליה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:35
    kjvOsis:
    - Lev.26.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.36
    scripture: tanakh
    name: Tanakh Leviticus 26:36
    ref: Leviticus 26:36
    book: Lev
    section: torah
    chapter: 26
    verse: 36
    ordinal: 3558
    text: And as for them that are left of you, I will send a faintness into their heart in the lands of their enemies; and the sound of a driven leaf shall chase them; and they shall flee, as one fleeth from the sword; and they shall fall when none pursueth.
    translation: JPS 1917
    original: וְהַנִּשְׁאָרִים בָּכֶם וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם בְּאַרְצֹת אֹיְבֵיהֶם וְרָדַף אֹתָם קוֹל עָלֶה נִדָּף וְנָסוּ מְנֻסַת־חֶרֶב וְנָפְלוּ וְאֵין רֹדֵף׃
    hebrewPlain: והנשארים בכם והבאתי מרך בלבבם בארצת איביהם ורדף אתם קול עלה נדף ונסו מנסת חרב ונפלו ואין רדף
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:36
    kjvOsis:
    - Lev.26.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.37
    scripture: tanakh
    name: Tanakh Leviticus 26:37
    ref: Leviticus 26:37
    book: Lev
    section: torah
    chapter: 26
    verse: 37
    ordinal: 3559
    text: And they shall stumble one upon another, as it were before the sword, when none pursueth; and ye shall have no power to stand before your enemies.
    translation: JPS 1917
    original: וְכָשְׁלוּ אִישׁ־בְּאָחִיו כְּמִפְּנֵי־חֶרֶב וְרֹדֵף אָיִן וְלֹא־תִהְיֶה לָכֶם תְּקוּמָה לִפְנֵי אֹיְבֵיכֶם׃
    hebrewPlain: וכשלו איש באחיו כמפני חרב ורדף אין ולא תהיה לכם תקומה לפני איביכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:37
    kjvOsis:
    - Lev.26.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.38
    scripture: tanakh
    name: Tanakh Leviticus 26:38
    ref: Leviticus 26:38
    book: Lev
    section: torah
    chapter: 26
    verse: 38
    ordinal: 3560
    text: And ye shall perish among the nations, and the land of your enemies shall eat you up.
    translation: JPS 1917
    original: וַאֲבַדְתֶּם בַּגּוֹיִם וְאָכְלָה אֶתְכֶם אֶרֶץ אֹיְבֵיכֶם׃
    hebrewPlain: ואבדתם בגוים ואכלה אתכם ארץ איביכם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:38
    kjvOsis:
    - Lev.26.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.39
    scripture: tanakh
    name: Tanakh Leviticus 26:39
    ref: Leviticus 26:39
    book: Lev
    section: torah
    chapter: 26
    verse: 39
    ordinal: 3561
    text: And they that are left of you shall pine away in their iniquity in your enemies’ lands; and also in the iniquities of their fathers shall they pine away with them.
    translation: JPS 1917
    original: וְהַנִּשְׁאָרִים בָּכֶם יִמַּקּוּ בַּעֲוֺנָם בְּאַרְצֹת אֹיְבֵיכֶם וְאַף בַּעֲוֺנֹת אֲבֹתָם אִתָּם יִמָּקּוּ׃
    hebrewPlain: והנשארים בכם ימקו בעונם בארצת איביכם ואף בעונת אבתם אתם ימקו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:39
    kjvOsis:
    - Lev.26.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.40
    scripture: tanakh
    name: Tanakh Leviticus 26:40
    ref: Leviticus 26:40
    book: Lev
    section: torah
    chapter: 26
    verse: 40
    ordinal: 3562
    text: And they shall confess their iniquity, and the iniquity of their fathers, in their treachery which they committed against Me, and also that they have walked contrary unto Me.
    translation: JPS 1917
    original: וְהִתְוַדּוּ אֶת־עֲוֺנָם וְאֶת־עֲוֺן אֲבֹתָם בְּמַעֲלָם אֲשֶׁר מָעֲלוּ־בִי וְאַף אֲשֶׁר־הָלְכוּ עִמִּי בְּקֶרִי׃
    hebrewPlain: והתודו את עונם ואת עון אבתם במעלם אשר מעלו בי ואף אשר הלכו עמי בקרי
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:40
    kjvOsis:
    - Lev.26.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.41
    scripture: tanakh
    name: Tanakh Leviticus 26:41
    ref: Leviticus 26:41
    book: Lev
    section: torah
    chapter: 26
    verse: 41
    ordinal: 3563
    text: I also will walk contrary unto them, and bring them into the land of their enemies; if then perchance their uncircumcised heart be humbled, and they then be paid the punishment of their iniquity;
    translation: JPS 1917
    original: אַף־אֲנִי אֵלֵךְ עִמָּם בְּקֶרִי וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם אוֹ־אָז יִכָּנַע לְבָבָם הֶעָרֵל וְאָז יִרְצוּ אֶת־עֲוֺנָם׃
    hebrewPlain: אף אני אלך עמם בקרי והבאתי אתם בארץ איביהם או אז יכנע לבבם הערל ואז ירצו את עונם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:41
    kjvOsis:
    - Lev.26.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.42
    scripture: tanakh
    name: Tanakh Leviticus 26:42
    ref: Leviticus 26:42
    book: Lev
    section: torah
    chapter: 26
    verse: 42
    ordinal: 3564
    text: then will I remember My covenant with Jacob, and also My covenant with Isaac, and also My covenant with Abraham will I remember; and I will remember the land.
    translation: JPS 1917
    original: וְזָכַרְתִּי אֶת־בְּרִיתִי יַעֲקוֹב וְאַף אֶת־בְּרִיתִי יִצְחָק וְאַף אֶת־בְּרִיתִי אַבְרָהָם אֶזְכֹּר וְהָאָרֶץ אֶזְכֹּר׃
    hebrewPlain: וזכרתי את בריתי יעקוב ואף את בריתי יצחק ואף את בריתי אברהם אזכר והארץ אזכר
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:42
    kjvOsis:
    - Lev.26.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.43
    scripture: tanakh
    name: Tanakh Leviticus 26:43
    ref: Leviticus 26:43
    book: Lev
    section: torah
    chapter: 26
    verse: 43
    ordinal: 3565
    text: For the land shall lie forsaken without them, and shall be paid her sabbaths, while she lieth desolate without them; and they shall be paid the punishment of their iniquity; because, even because they rejected Mine ordinances, and their soul abhorred My statutes.
    translation: JPS 1917
    original: וְהָאָרֶץ תֵּעָזֵב מֵהֶם וְתִרֶץ אֶת־שַׁבְּתֹתֶיהָ בָּהְשַׁמָּה מֵהֶם וְהֵם יִרְצוּ אֶת־עֲוֺנָם יַעַן וּבְיַעַן בְּמִשְׁפָּטַי מָאָסוּ וְאֶת־חֻקֹּתַי גָּעֲלָה נַפְשָׁם׃
    hebrewPlain: והארץ תעזב מהם ותרץ את שבתתיה בהשמה מהם והם ירצו את עונם יען וביען במשפטי מאסו ואת חקתי געלה נפשם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:43
    kjvOsis:
    - Lev.26.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.44
    scripture: tanakh
    name: Tanakh Leviticus 26:44
    ref: Leviticus 26:44
    book: Lev
    section: torah
    chapter: 26
    verse: 44
    ordinal: 3566
    text: And yet for all that, when they are in the land of their enemies, I will not reject them, neither will I abhor them, to destroy them utterly, and to break My covenant with them; for I am the LORD their God.
    translation: JPS 1917
    original: וְאַף־גַּם־זֹאת בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם לֹא־מְאַסְתִּים וְלֹא־גְעַלְתִּים לְכַלֹּתָם לְהָפֵר בְּרִיתִי אִתָּם כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם׃
    hebrewPlain: ואף גם זאת בהיותם בארץ איביהם לא מאסתים ולא געלתים לכלתם להפר בריתי אתם כי אני יהוה אלהיהם
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:44
    kjvOsis:
    - Lev.26.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.45
    scripture: tanakh
    name: Tanakh Leviticus 26:45
    ref: Leviticus 26:45
    book: Lev
    section: torah
    chapter: 26
    verse: 45
    ordinal: 3567
    text: 'But I will for their sakes remember the covenant of their ancestors, whom I brought forth out of the land of Egypt in the sight of the nations, that I might be their God: I am the LORD.'
    translation: JPS 1917
    original: וְזָכַרְתִּי לָהֶם בְּרִית רִאשֹׁנִים אֲשֶׁר הוֹצֵאתִי־אֹתָם מֵאֶרֶץ מִצְרַיִם לְעֵינֵי הַגּוֹיִם לִהְיֹת לָהֶם לֵאלֹהִים אֲנִי יְהוָה׃
    hebrewPlain: וזכרתי להם ברית ראשנים אשר הוצאתי אתם מארץ מצרים לעיני הגוים להית להם לאלהים אני יהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:45
    kjvOsis:
    - Lev.26.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.26
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.26.46
    scripture: tanakh
    name: Tanakh Leviticus 26:46
    ref: Leviticus 26:46
    book: Lev
    section: torah
    chapter: 26
    verse: 46
    ordinal: 3568
    text: These are the statutes and ordinances and laws, which the LORD made between Him and the children of Israel in mount Sinai by the hand of Moses.
    translation: JPS 1917
    original: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים וְהַתּוֹרֹת אֲשֶׁר נָתַן יְהוָה בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל בְּהַר סִינַי בְּיַד־מֹשֶׁה׃
    hebrewPlain: אלה החקים והמשפטים והתורת אשר נתן יהוה בינו ובין בני ישראל בהר סיני ביד משה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 26:46
    kjvOsis:
    - Lev.26.46
  relations:
