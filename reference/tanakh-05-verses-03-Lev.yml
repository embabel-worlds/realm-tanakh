  data:
    osis: Lev.13.50
    scripture: tanakh
    name: Tanakh Leviticus 13:50
    ref: Leviticus 13:50
    book: Lev
    section: torah
    chapter: 13
    verse: 50
    ordinal: 3100
    text: And the priest shall look upon the plague, and shut up that which hath the plague seven days.
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן אֶת־הַנָּגַע וְהִסְגִּיר אֶת־הַנֶּגַע שִׁבְעַת יָמִים׃
    hebrewPlain: וראה הכהן את הנגע והסגיר את הנגע שבעת ימים
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:50
    kjvOsis:
    - Lev.13.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
