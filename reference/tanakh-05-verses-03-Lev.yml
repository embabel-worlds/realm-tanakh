    translation: JPS 1917
    original: וְנָתַתָּ עָלֶיהָ שֶׁמֶן וְשַׂמְתָּ עָלֶיהָ לְבֹנָה מִנְחָה הִוא׃
    hebrewPlain: ונתת עליה שמן ושמת עליה לבנה מנחה הוא
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:15
    kjvOsis:
