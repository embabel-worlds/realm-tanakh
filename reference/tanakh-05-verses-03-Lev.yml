  data:
    osis: Lev.13.47
    scripture: tanakh
    name: Tanakh Leviticus 13:47
    ref: Leviticus 13:47
    book: Lev
    section: torah
    chapter: 13
    verse: 47
    ordinal: 3097
    text: And when the plague of leprosy is in a garment, whether it be a woolen garment, or a linen garment;
    translation: JPS 1917
    original: וְהַבֶּגֶד כִּי־יִהְיֶה בוֹ נֶגַע צָרָעַת בְּבֶגֶד צֶמֶר אוֹ בְּבֶגֶד פִּשְׁתִּים׃
    hebrewPlain: והבגד כי יהיה בו נגע צרעת בבגד צמר או בבגד פשתים
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:47
    kjvOsis:
    - Lev.13.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
      type: Parashah
