    scripture: tanakh
    name: Tanakh Leviticus 8:25
    ref: Leviticus 8:25
    book: Lev
    section: torah
    chapter: 8
    verse: 25
    ordinal: 2940
    text: And he took the fat, and the fat tail, and all the fat that was upon the inwards, and the lobe of the liver, and the two kidneys, and their fat, and the right thigh.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־הַחֵלֶב וְאֶת־הָאַלְיָה וְאֶת־כָּל־הַחֵלֶב אֲשֶׁר עַל־הַקֶּרֶב וְאֵת יֹתֶרֶת הַכָּבֵד וְאֶת־שְׁתֵּי הַכְּלָיֹת וְאֶת־חֶלְבְּהֶן וְאֵת שׁוֹק הַיָּמִין׃
    hebrewPlain: ויקח את החלב ואת האליה ואת כל החלב אשר על הקרב ואת יתרת הכבד ואת שתי הכלית ואת חלבהן ואת שוק הימין
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:25
    kjvOsis:
    - Lev.8.25
