    ref: Leviticus 20:8
    book: Lev
    section: torah
    chapter: 20
    verse: 8
    ordinal: 3324
    text: 'And keep ye My statutes, and do them: I am the LORD who sanctify you.'
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם אֶת־חֻקֹּתַי וַעֲשִׂיתֶם אֹתָם אֲנִי יְהוָה מְקַדִּשְׁכֶם׃
    hebrewPlain: ושמרתם את חקתי ועשיתם אתם אני יהוה מקדשכם
    parashah: Kedoshim
    kjvRefs:
