  data:
    osis: Lev.9.13
    scripture: tanakh
    name: Tanakh Leviticus 9:13
    ref: Leviticus 9:13
    book: Lev
    section: torah
    chapter: 9
    verse: 13
    ordinal: 2964
    text: And they delivered the burnt-offering unto him, piece by piece, and the head; and he made them smoke upon the altar.
    translation: JPS 1917
    original: וְאֶת־הָעֹלָה הִמְצִיאוּ אֵלָיו לִנְתָחֶיהָ וְאֶת־הָרֹאשׁ וַיַּקְטֵר עַל־הַמִּזְבֵּחַ׃
    hebrewPlain: ואת העלה המציאו אליו לנתחיה ואת הראש ויקטר על המזבח
    parashah: Shmini
    kjvRefs:
