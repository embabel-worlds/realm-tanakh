  data:
    osis: Lev.2.9
    scripture: tanakh
    name: Tanakh Leviticus 2:9
    ref: Leviticus 2:9
    book: Lev
    section: torah
    chapter: 2
    verse: 9
    ordinal: 2769
    text: And the priest shall take off from the meal-offering the memorial-part thereof, and shall make it smoke upon the altar—an offering made by fire, of a sweet savour unto the LORD.
    translation: JPS 1917
    original: וְהֵרִים הַכֹּהֵן מִן־הַמִּנְחָה אֶת־אַזְכָּרָתָהּ וְהִקְטִיר הַמִּזְבֵּחָה אִשֵּׁה רֵיחַ נִיחֹחַ לַיהוָה׃
    hebrewPlain: והרים הכהן מן המנחה את אזכרתה והקטיר המזבחה אשה ריח ניחח ליהוה
