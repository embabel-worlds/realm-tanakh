  data:
    osis: Lev.12.7
    scripture: tanakh
    name: Tanakh Leviticus 12:7
    ref: Leviticus 12:7
    book: Lev
    section: torah
    chapter: 12
    verse: 7
    ordinal: 3049
    text: And he shall offer it before the LORD, and make atonement for her; and she shall be cleansed from the fountain of her blood. This is the law for her that beareth, whether a male or a female.
    translation: JPS 1917
    original: וְהִקְרִיבוֹ לִפְנֵי יְהוָה וְכִפֶּר עָלֶיהָ וְטָהֲרָה מִמְּקֹר דָּמֶיהָ זֹאת תּוֹרַת הַיֹּלֶדֶת לַזָּכָר אוֹ לַנְּקֵבָה׃
    hebrewPlain: והקריבו לפני יהוה וכפר עליה וטהרה ממקר דמיה זאת תורת הילדת לזכר או לנקבה
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:7
    kjvOsis:
    - Lev.12.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.8
    scripture: tanakh
    name: Tanakh Leviticus 12:8
    ref: Leviticus 12:8
    book: Lev
    section: torah
    chapter: 12
    verse: 8
    ordinal: 3050
    text: 'And if her means suffice not for a lamb, then she shall take two turtle-doves, or two young pigeons: the one for a burnt-offering, and the other for a sin-offering; and the priest shall make atonement for her, and she shall be clean.'
    translation: JPS 1917
    original: וְאִם־לֹא תִמְצָא יָדָהּ דֵּי שֶׂה וְלָקְחָה שְׁתֵּי־תֹרִים אוֹ שְׁנֵי בְּנֵי יוֹנָה אֶחָד לְעֹלָה וְאֶחָד לְחַטָּאת וְכִפֶּר עָלֶיהָ הַכֹּהֵן וְטָהֵרָה׃
    hebrewPlain: ואם לא תמצא ידה די שה ולקחה שתי תרים או שני בני יונה אחד לעלה ואחד לחטאת וכפר עליה הכהן וטהרה
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:8
    kjvOsis:
    - Lev.12.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
