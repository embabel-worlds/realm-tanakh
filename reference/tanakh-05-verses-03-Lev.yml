  data:
    osis: Lev.23.36
    scripture: tanakh
    name: Tanakh Leviticus 23:36
    ref: Leviticus 23:36
    book: Lev
    section: torah
    chapter: 23
    verse: 36
    ordinal: 3436
    text: Seven days ye shall bring an offering made by fire unto the LORD; on the eighth day shall be a holy convocation unto you; and ye shall bring an offering made by fire unto the LORD; it is a day of solemn assembly; ye shall do no manner of servile work.
    translation: JPS 1917
    original: שִׁבְעַת יָמִים תַּקְרִיבוּ אִשֶּׁה לַיהוָה בַּיּוֹם הַשְּׁמִינִי מִקְרָא־קֹדֶשׁ יִהְיֶה לָכֶם וְהִקְרַבְתֶּם אִשֶּׁה לַיהוָה עֲצֶרֶת הִוא כָּל־מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ׃
    hebrewPlain: שבעת ימים תקריבו אשה ליהוה ביום השמיני מקרא קדש יהיה לכם והקרבתם אשה ליהוה עצרת הוא כל מלאכת עבדה לא תעשו
    parashah: Emor
    kjvRefs:
    - Leviticus 23:36
    kjvOsis:
    - Lev.23.36
