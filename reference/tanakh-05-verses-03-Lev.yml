  data:
    osis: Lev.5.26
    scripture: tanakh
    name: Tanakh Leviticus 5:26
    ref: Leviticus 5:26
    book: Lev
    section: torah
    chapter: 5
    verse: 26
    ordinal: 2854
    text: And the priest shall make atonement for him before the LORD, and he shall be forgiven, concerning whatsoever he doeth so as to be guilty thereby.
    translation: JPS 1917
    original: וְכִפֶּר עָלָיו הַכֹּהֵן לִפְנֵי יְהוָה וְנִסְלַח לוֹ עַל־אַחַת מִכֹּל אֲשֶׁר־יַעֲשֶׂה לְאַשְׁמָה בָהּ׃
    hebrewPlain: וכפר עליו הכהן לפני יהוה ונסלח לו על אחת מכל אשר יעשה לאשמה בה
    parashah: Vayikra
