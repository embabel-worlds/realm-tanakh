    ordinal: 2931
    text: And he took all the fat that was upon the inwards, and the lobe of the liver, and the two kidneys, and their fat, and Moses made it smoke upon the altar.
    translation: JPS 1917
    original: וַיִּקַּח אֶת־כָּל־הַחֵלֶב אֲשֶׁר עַל־הַקֶּרֶב וְאֵת יֹתֶרֶת הַכָּבֵד וְאֶת־שְׁתֵּי הַכְּלָיֹת וְאֶת־חֶלְבְּהֶן וַיַּקְטֵר מֹשֶׁה הַמִּזְבֵּחָה׃
    hebrewPlain: ויקח את כל החלב אשר על הקרב ואת יתרת הכבד ואת שתי הכלית ואת חלבהן ויקטר משה המזבחה
    parashah: Tzav
