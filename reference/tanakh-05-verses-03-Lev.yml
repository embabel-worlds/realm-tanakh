    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.15
    scripture: tanakh
    name: Tanakh Leviticus 4:15
    ref: Leviticus 4:15
    book: Lev
    section: torah
    chapter: 4
    verse: 15
    ordinal: 2808
    text: And the elders of the congregation shall lay their hands upon the head of the bullock before the LORD; and the bullock shall be killed before the LORD.
    translation: JPS 1917
    original: וְסָמְכוּ זִקְנֵי הָעֵדָה אֶת־יְדֵיהֶם עַל־רֹאשׁ הַפָּר לִפְנֵי יְהוָה וְשָׁחַט אֶת־הַפָּר לִפְנֵי יְהוָה׃
    hebrewPlain: וסמכו זקני העדה את ידיהם על ראש הפר לפני יהוה ושחט את הפר לפני יהוה
    parashah: Vayikra
