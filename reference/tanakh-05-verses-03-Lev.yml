- type: TanakhVerse
  data:
    osis: Lev.20.14
    scripture: tanakh
    name: Tanakh Leviticus 20:14
    ref: Leviticus 20:14
    book: Lev
    section: torah
    chapter: 20
    verse: 14
    ordinal: 3330
    text: 'And if a man take with his wife also her mother, it is wickedness: they shall be burnt with fire, both he and they; that there be no wickedness among you.'
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִקַּח אֶת־אִשָּׁה וְאֶת־אִמָּהּ זִמָּה הִוא בָּאֵשׁ יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן וְלֹא־תִהְיֶה זִמָּה בְּתוֹכְכֶם׃
    hebrewPlain: ואיש אשר יקח את אשה ואת אמה זמה הוא באש ישרפו אתו ואתהן ולא תהיה זמה בתוככם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:14
    kjvOsis:
    - Lev.20.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.15
    scripture: tanakh
    name: Tanakh Leviticus 20:15
    ref: Leviticus 20:15
    book: Lev
    section: torah
    chapter: 20
    verse: 15
    ordinal: 3331
    text: And if a man lie with a beast, he shall surely be put to death; and ye shall slay the beast.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִתֵּן שְׁכָבְתּוֹ בִּבְהֵמָה מוֹת יוּמָת וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ׃
    hebrewPlain: ואיש אשר יתן שכבתו בבהמה מות יומת ואת הבהמה תהרגו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:15
    kjvOsis:
    - Lev.20.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.16
    scripture: tanakh
    name: Tanakh Leviticus 20:16
    ref: Leviticus 20:16
    book: Lev
    section: torah
    chapter: 20
    verse: 16
    ordinal: 3332
    text: 'And if a woman approach unto any beast, and lie down thereto, thou shalt kill the woman, and the beast: they shall surely be put to death; their blood shall be upon them.'
    translation: JPS 1917
    original: וְאִשָּׁה אֲשֶׁר תִּקְרַב אֶל־כָּל־בְּהֵמָה לְרִבְעָה אֹתָהּ וְהָרַגְתָּ אֶת־הָאִשָּׁה וְאֶת־הַבְּהֵמָה מוֹת יוּמָתוּ דְּמֵיהֶם בָּם׃
    hebrewPlain: ואשה אשר תקרב אל כל בהמה לרבעה אתה והרגת את האשה ואת הבהמה מות יומתו דמיהם בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:16
    kjvOsis:
    - Lev.20.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.17
    scripture: tanakh
    name: Tanakh Leviticus 20:17
    ref: Leviticus 20:17
    book: Lev
    section: torah
    chapter: 20
    verse: 17
    ordinal: 3333
    text: 'And if a man shall take his sister, his father’s daughter, or his mother’s daughter, and see her nakedness, and she see his nakedness: it is a shameful thing; and they shall be cut off in the sight of the children of their people: he hath uncovered his sister’s nakedness; he shall bear his iniquity.'
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר־יִקַּח אֶת־אֲחֹתוֹ בַּת־אָבִיו אוֹ בַת־אִמּוֹ וְרָאָה אֶת־עֶרְוָתָהּ וְהִיא־תִרְאֶה אֶת־עֶרְוָתוֹ חֶסֶד הוּא וְנִכְרְתוּ לְעֵינֵי בְּנֵי עַמָּם עֶרְוַת אֲחֹתוֹ גִּלָּה עֲוֺנוֹ יִשָּׂא׃
    hebrewPlain: ואיש אשר יקח את אחתו בת אביו או בת אמו וראה את ערותה והיא תראה את ערותו חסד הוא ונכרתו לעיני בני עמם ערות אחתו גלה עונו ישא
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:17
    kjvOsis:
    - Lev.20.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.18
    scripture: tanakh
    name: Tanakh Leviticus 20:18
    ref: Leviticus 20:18
    book: Lev
    section: torah
    chapter: 20
    verse: 18
    ordinal: 3334
    text: And if a man shall lie with a woman having her sickness, and shall uncover her nakedness—he hath made naked her fountain, and she hath uncovered the fountain of her blood—both of them shall be cut off from among their people.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר־יִשְׁכַּב אֶת־אִשָּׁה דָּוָה וְגִלָּה אֶת־עֶרְוָתָהּ אֶת־מְקֹרָהּ הֶעֱרָה וְהִיא גִּלְּתָה אֶת־מְקוֹר דָּמֶיהָ וְנִכְרְתוּ שְׁנֵיהֶם מִקֶּרֶב עַמָּם׃
    hebrewPlain: ואיש אשר ישכב את אשה דוה וגלה את ערותה את מקרה הערה והיא גלתה את מקור דמיה ונכרתו שניהם מקרב עמם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:18
    kjvOsis:
    - Lev.20.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.19
    scripture: tanakh
    name: Tanakh Leviticus 20:19
    ref: Leviticus 20:19
    book: Lev
    section: torah
    chapter: 20
    verse: 19
    ordinal: 3335
    text: And thou shalt not uncover the nakedness of thy mother’s sister, nor of thy father’s sister; for he hath made naked his near kin; they shall bear their iniquity.
    translation: JPS 1917
    original: וְעֶרְוַת אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ לֹא תְגַלֵּה כִּי אֶת־שְׁאֵרוֹ הֶעֱרָה עֲוֺנָם יִשָּׂאוּ׃
    hebrewPlain: וערות אחות אמך ואחות אביך לא תגלה כי את שארו הערה עונם ישאו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:19
    kjvOsis:
    - Lev.20.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.20
    scripture: tanakh
    name: Tanakh Leviticus 20:20
    ref: Leviticus 20:20
    book: Lev
    section: torah
    chapter: 20
    verse: 20
    ordinal: 3336
    text: And if a man shall lie with his uncle’s wife—he hath uncovered his uncle’s nakedness—they shall bear their sin; they shall die childless.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִשְׁכַּב אֶת־דֹּדָתוֹ עֶרְוַת דֹּדוֹ גִּלָּה חֶטְאָם יִשָּׂאוּ עֲרִירִים יָמֻתוּ׃
    hebrewPlain: ואיש אשר ישכב את דדתו ערות דדו גלה חטאם ישאו ערירים ימתו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:20
    kjvOsis:
    - Lev.20.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.21
    scripture: tanakh
    name: Tanakh Leviticus 20:21
    ref: Leviticus 20:21
    book: Lev
    section: torah
    chapter: 20
    verse: 21
    ordinal: 3337
    text: 'And if a man shall take his brother’s wife, it is impurity: he hath uncovered his brother’s nakedness; they shall be childless.'
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִקַּח אֶת־אֵשֶׁת אָחִיו נִדָּה הִוא עֶרְוַת אָחִיו גִּלָּה עֲרִירִים יִהְיוּ׃
    hebrewPlain: ואיש אשר יקח את אשת אחיו נדה הוא ערות אחיו גלה ערירים יהיו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:21
    kjvOsis:
    - Lev.20.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.22
    scripture: tanakh
    name: Tanakh Leviticus 20:22
    ref: Leviticus 20:22
    book: Lev
    section: torah
    chapter: 20
    verse: 22
    ordinal: 3338
    text: Ye shall therefore keep all My statutes, and all Mine ordinances, and do them, that the land, whither I bring you to dwell therein, vomit you not out.
    translation: JPS 1917
    original: וּשְׁמַרְתֶּם אֶת־כָּל־חֻקֹּתַי וְאֶת־כָּל־מִשְׁפָּטַי וַעֲשִׂיתֶם אֹתָם וְלֹא־תָקִיא אֶתְכֶם הָאָרֶץ אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה לָשֶׁבֶת בָּהּ׃
    hebrewPlain: ושמרתם את כל חקתי ואת כל משפטי ועשיתם אתם ולא תקיא אתכם הארץ אשר אני מביא אתכם שמה לשבת בה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:22
    kjvOsis:
    - Lev.20.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.23
    scripture: tanakh
    name: Tanakh Leviticus 20:23
    ref: Leviticus 20:23
    book: Lev
    section: torah
    chapter: 20
    verse: 23
    ordinal: 3339
    text: And ye shall not walk in the customs of the nation, which I am casting out before you; for they did all these things, and therefore I abhorred them.
    translation: JPS 1917
    original: וְלֹא תֵלְכוּ בְּחֻקֹּת הַגּוֹי אֲשֶׁר־אֲנִי מְשַׁלֵּחַ מִפְּנֵיכֶם כִּי אֶת־כָּל־אֵלֶּה עָשׂוּ וָאָקֻץ בָּם׃
    hebrewPlain: ולא תלכו בחקת הגוי אשר אני משלח מפניכם כי את כל אלה עשו ואקץ בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:23
    kjvOsis:
    - Lev.20.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.24
    scripture: tanakh
    name: Tanakh Leviticus 20:24
    ref: Leviticus 20:24
    book: Lev
    section: torah
    chapter: 20
    verse: 24
    ordinal: 3340
    text: 'But I have said unto you: ‘Ye shall inherit their land, and I will give it unto you to possess it, a land flowing with milk and honey.’ I am the LORD your God, who have set you apart from the peoples.'
    translation: JPS 1917
    original: וָאֹמַר לָכֶם אַתֶּם תִּירְשׁוּ אֶת־אַדְמָתָם וַאֲנִי אֶתְּנֶנָּה לָכֶם לָרֶשֶׁת אֹתָהּ אֶרֶץ זָבַת חָלָב וּדְבָשׁ אֲנִי יְהוָה אֱלֹהֵיכֶם אֲשֶׁר־הִבְדַּלְתִּי אֶתְכֶם מִן־הָעַמִּים׃
    hebrewPlain: ואמר לכם אתם תירשו את אדמתם ואני אתננה לכם לרשת אתה ארץ זבת חלב ודבש אני יהוה אלהיכם אשר הבדלתי אתכם מן העמים
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:24
    kjvOsis:
    - Lev.20.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.25
    scripture: tanakh
    name: Tanakh Leviticus 20:25
    ref: Leviticus 20:25
    book: Lev
    section: torah
    chapter: 20
    verse: 25
    ordinal: 3341
    text: Ye shall therefore separate between the clean beast and the unclean, and between the unclean fowl and the clean; and ye shall not make your souls detestable by beast, or by fowl, or by any thing wherewith the ground teemeth, which I have set apart for you to hold unclean.
    translation: JPS 1917
    original: וְהִבְדַּלְתֶּם בֵּין־הַבְּהֵמָה הַטְּהֹרָה לַטְּמֵאָה וּבֵין־הָעוֹף הַטָּמֵא לַטָּהֹר וְלֹא־תְשַׁקְּצוּ אֶת־נַפְשֹׁתֵיכֶם בַּבְּהֵמָה וּבָעוֹף וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה אֲשֶׁר־הִבְדַּלְתִּי לָכֶם לְטַמֵּא׃
    hebrewPlain: והבדלתם בין הבהמה הטהרה לטמאה ובין העוף הטמא לטהר ולא תשקצו את נפשתיכם בבהמה ובעוף ובכל אשר תרמש האדמה אשר הבדלתי לכם לטמא
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:25
    kjvOsis:
    - Lev.20.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.26
    scripture: tanakh
    name: Tanakh Leviticus 20:26
    ref: Leviticus 20:26
    book: Lev
    section: torah
    chapter: 20
    verse: 26
    ordinal: 3342
    text: And ye shall be holy unto Me; for I the LORD am holy, and have set you apart from the peoples, that ye should be Mine.
    translation: JPS 1917
    original: וִהְיִיתֶם לִי קְדֹשִׁים כִּי קָדוֹשׁ אֲנִי יְהוָה וָאַבְדִּל אֶתְכֶם מִן־הָעַמִּים לִהְיוֹת לִי׃
    hebrewPlain: והייתם לי קדשים כי קדוש אני יהוה ואבדל אתכם מן העמים להיות לי
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:26
    kjvOsis:
    - Lev.20.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.20.27
    scripture: tanakh
    name: Tanakh Leviticus 20:27
    ref: Leviticus 20:27
    book: Lev
    section: torah
    chapter: 20
    verse: 27
    ordinal: 3343
    text: A man also or a woman that divineth by a ghost or a familiar spirit, shall surely be put to death; they shall stone them with stones; their blood shall be upon them.
    translation: JPS 1917
    original: וְאִישׁ אוֹ־אִשָּׁה כִּי־יִהְיֶה בָהֶם אוֹב אוֹ יִדְּעֹנִי מוֹת יוּמָתוּ בָּאֶבֶן יִרְגְּמוּ אֹתָם דְּמֵיהֶם בָּם׃
    hebrewPlain: ואיש או אשה כי יהיה בהם אוב או ידעני מות יומתו באבן ירגמו אתם דמיהם בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:27
    kjvOsis:
    - Lev.20.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.21.1
    scripture: tanakh
    name: Tanakh Leviticus 21:1
    ref: Leviticus 21:1
    book: Lev
    section: torah
    chapter: 21
    verse: 1
    ordinal: 3344
    text: 'And the LORD said unto Moses: Speak unto the priests the sons of Aaron, and say unto them: There shall none defile himself for the dead among his people;'
    translation: JPS 1917
    original: וַיֹּאמֶר יְהוָה אֶל־מֹשֶׁה אֱמֹר אֶל־הַכֹּהֲנִים בְּנֵי אַהֲרֹן וְאָמַרְתָּ אֲלֵהֶם לְנֶפֶשׁ לֹא־יִטַּמָּא בְּעַמָּיו׃
    hebrewPlain: ויאמר יהוה אל משה אמר אל הכהנים בני אהרן ואמרת אלהם לנפש לא יטמא בעמיו
    parashah: Emor
    kjvRefs:
    - Leviticus 21:1
    kjvOsis:
    - Lev.21.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.2
    scripture: tanakh
    name: Tanakh Leviticus 21:2
    ref: Leviticus 21:2
    book: Lev
    section: torah
    chapter: 21
    verse: 2
    ordinal: 3345
    text: except for his kin, that is near unto him, for his mother, and for his father, and for his son, and for his daughter, and for his brother;
    translation: JPS 1917
    original: כִּי אִם־לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו׃
    hebrewPlain: כי אם לשארו הקרב אליו לאמו ולאביו ולבנו ולבתו ולאחיו
    parashah: Emor
    kjvRefs:
    - Leviticus 21:2
    kjvOsis:
    - Lev.21.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.3
    scripture: tanakh
    name: Tanakh Leviticus 21:3
    ref: Leviticus 21:3
    book: Lev
    section: torah
    chapter: 21
    verse: 3
    ordinal: 3346
    text: and for his sister a virgin, that is near unto him, that hath had no husband, for her may he defile himself.
    translation: JPS 1917
    original: וְלַאֲחֹתוֹ הַבְּתוּלָה הַקְּרוֹבָה אֵלָיו אֲשֶׁר לֹא־הָיְתָה לְאִישׁ לָהּ יִטַּמָּא׃
    hebrewPlain: ולאחתו הבתולה הקרובה אליו אשר לא היתה לאיש לה יטמא
    parashah: Emor
    kjvRefs:
    - Leviticus 21:3
    kjvOsis:
    - Lev.21.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.4
    scripture: tanakh
    name: Tanakh Leviticus 21:4
    ref: Leviticus 21:4
    book: Lev
    section: torah
    chapter: 21
    verse: 4
    ordinal: 3347
    text: He shall not defile himself, being a chief man among his people, to profane himself.
    translation: JPS 1917
    original: לֹא יִטַּמָּא בַּעַל בְּעַמָּיו לְהֵחַלּוֹ׃
    hebrewPlain: לא יטמא בעל בעמיו להחלו
    parashah: Emor
    kjvRefs:
    - Leviticus 21:4
    kjvOsis:
    - Lev.21.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.5
    scripture: tanakh
    name: Tanakh Leviticus 21:5
    ref: Leviticus 21:5
    book: Lev
    section: torah
    chapter: 21
    verse: 5
    ordinal: 3348
    text: They shall not make baldness upon their head, neither shall they shave off the corners of their beard, nor make any cuttings in their flesh.
    translation: JPS 1917
    original: לֹא־יקרחה [יִקְרְחוּ] קָרְחָה בְּרֹאשָׁם וּפְאַת זְקָנָם לֹא יְגַלֵּחוּ וּבִבְשָׂרָם לֹא יִשְׂרְטוּ שָׂרָטֶת׃
    hebrewPlain: לא יקרחה [יקרחו] קרחה בראשם ופאת זקנם לא יגלחו ובבשרם לא ישרטו שרטת
    parashah: Emor
    kjvRefs:
    - Leviticus 21:5
    kjvOsis:
    - Lev.21.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.6
    scripture: tanakh
    name: Tanakh Leviticus 21:6
    ref: Leviticus 21:6
    book: Lev
    section: torah
    chapter: 21
    verse: 6
    ordinal: 3349
    text: They shall be holy unto their God, and not profane the name of their God; for the offerings of the LORD made by fire, the bread of their God, they do offer; therefore they shall be holy.
    translation: JPS 1917
    original: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם וְלֹא יְחַלְּלוּ שֵׁם אֱלֹהֵיהֶם כִּי אֶת־אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם הֵם מַקְרִיבִם וְהָיוּ קֹדֶשׁ׃
    hebrewPlain: קדשים יהיו לאלהיהם ולא יחללו שם אלהיהם כי את אשי יהוה לחם אלהיהם הם מקריבם והיו קדש
    parashah: Emor
    kjvRefs:
    - Leviticus 21:6
    kjvOsis:
    - Lev.21.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.7
    scripture: tanakh
    name: Tanakh Leviticus 21:7
    ref: Leviticus 21:7
    book: Lev
    section: torah
    chapter: 21
    verse: 7
    ordinal: 3350
    text: They shall not take a woman that is a harlot, or profaned; neither shall they take a woman put away from her husband; for he is holy unto his God.
    translation: JPS 1917
    original: אִשָּׁה זֹנָה וַחֲלָלָה לֹא יִקָּחוּ וְאִשָּׁה גְּרוּשָׁה מֵאִישָׁהּ לֹא יִקָּחוּ כִּי־קָדֹשׁ הוּא לֵאלֹהָיו׃
    hebrewPlain: אשה זנה וחללה לא יקחו ואשה גרושה מאישה לא יקחו כי קדש הוא לאלהיו
    parashah: Emor
    kjvRefs:
    - Leviticus 21:7
    kjvOsis:
    - Lev.21.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.8
    scripture: tanakh
    name: Tanakh Leviticus 21:8
    ref: Leviticus 21:8
    book: Lev
    section: torah
    chapter: 21
    verse: 8
    ordinal: 3351
    text: Thou shalt sanctify him therefore; for he offereth the bread of thy God; he shall be holy unto thee; for I the LORD, who sanctify you, am holy.
    translation: JPS 1917
    original: וְקִדַּשְׁתּוֹ כִּי־אֶת־לֶחֶם אֱלֹהֶיךָ הוּא מַקְרִיב קָדֹשׁ יִהְיֶה־לָּךְ כִּי קָדוֹשׁ אֲנִי יְהוָה מְקַדִּשְׁכֶם׃
    hebrewPlain: וקדשתו כי את לחם אלהיך הוא מקריב קדש יהיה לך כי קדוש אני יהוה מקדשכם
    parashah: Emor
    kjvRefs:
    - Leviticus 21:8
    kjvOsis:
    - Lev.21.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.9
    scripture: tanakh
    name: Tanakh Leviticus 21:9
    ref: Leviticus 21:9
    book: Lev
    section: torah
    chapter: 21
    verse: 9
    ordinal: 3352
    text: 'And the daughter of any priest, if she profane herself by playing the harlot, she profaneth her father: she shall be burnt with fire.'
    translation: JPS 1917
    original: וּבַת אִישׁ כֹּהֵן כִּי תֵחֵל לִזְנוֹת אֶת־אָבִיהָ הִיא מְחַלֶּלֶת בָּאֵשׁ תִּשָּׂרֵף׃
    hebrewPlain: ובת איש כהן כי תחל לזנות את אביה היא מחללת באש תשרף
    parashah: Emor
    kjvRefs:
    - Leviticus 21:9
    kjvOsis:
    - Lev.21.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.10
    scripture: tanakh
    name: Tanakh Leviticus 21:10
    ref: Leviticus 21:10
    book: Lev
    section: torah
    chapter: 21
    verse: 10
    ordinal: 3353
    text: And the priest that is highest among his brethren, upon whose head the anointing oil is poured, and that is consecrated to put on the garments, shall not let the hair of his head go loose, nor rend his clothes;
    translation: JPS 1917
    original: וְהַכֹּהֵן הַגָּדוֹל מֵאֶחָיו אֲ‍שֶׁר־יוּצַק עַל־רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה וּמִלֵּא אֶת־יָדוֹ לִלְבֹּשׁ אֶת־הַבְּגָדִים אֶת־רֹאשׁוֹ לֹא יִפְרָע וּבְגָדָיו לֹא יִפְרֹם׃
    hebrewPlain: והכהן הגדול מאחיו א‍שר יוצק על ראשו שמן המשחה ומלא את ידו ללבש את הבגדים את ראשו לא יפרע ובגדיו לא יפרם
    parashah: Emor
    kjvRefs:
    - Leviticus 21:10
    kjvOsis:
    - Lev.21.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.11
    scripture: tanakh
    name: Tanakh Leviticus 21:11
    ref: Leviticus 21:11
    book: Lev
    section: torah
    chapter: 21
    verse: 11
    ordinal: 3354
    text: neither shall he go in to any dead body, nor defile himself for his father, or for his mother;
    translation: JPS 1917
    original: וְעַל כָּל־נַפְשֹׁת מֵת לֹא יָבֹא לְאָבִיו וּלְאִמּוֹ לֹא יִטַּמָּא׃
    hebrewPlain: ועל כל נפשת מת לא יבא לאביו ולאמו לא יטמא
    parashah: Emor
    kjvRefs:
    - Leviticus 21:11
    kjvOsis:
    - Lev.21.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.12
    scripture: tanakh
    name: Tanakh Leviticus 21:12
    ref: Leviticus 21:12
    book: Lev
    section: torah
    chapter: 21
    verse: 12
    ordinal: 3355
    text: 'neither shall he go out of the sanctuary, nor profane the sanctuary of his God; for the consecration of the anointing oil of his God is upon him: I am the LORD.'
    translation: JPS 1917
    original: וּמִן־הַמִּקְדָּשׁ לֹא יֵצֵא וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו כִּי נֵזֶר שֶׁמֶן מִשְׁחַת אֱלֹהָיו עָלָיו אֲנִי יְהוָה׃
    hebrewPlain: ומן המקדש לא יצא ולא יחלל את מקדש אלהיו כי נזר שמן משחת אלהיו עליו אני יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 21:12
    kjvOsis:
    - Lev.21.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.13
    scripture: tanakh
    name: Tanakh Leviticus 21:13
    ref: Leviticus 21:13
