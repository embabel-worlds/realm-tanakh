      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.33
    scripture: tanakh
    name: Tanakh Leviticus 11:33
    ref: Leviticus 11:33
    book: Lev
    section: torah
    chapter: 11
    verse: 33
    ordinal: 3028
    text: And every earthen vessel whereinto any of them falleth, whatsoever is in it shall be unclean, and it ye shall break.
    translation: JPS 1917
    original: וְכָל־כְּלִי־חֶרֶשׂ אֲשֶׁר־יִפֹּל מֵהֶם אֶל־תּוֹכוֹ כֹּל אֲשֶׁר בְּתוֹכוֹ יִטְמָא וְאֹתוֹ תִשְׁבֹּרוּ׃
    hebrewPlain: וכל כלי חרש אשר יפל מהם אל תוכו כל אשר בתוכו יטמא ואתו תשברו
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:33
    kjvOsis:
    - Lev.11.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.34
    scripture: tanakh
    name: Tanakh Leviticus 11:34
    ref: Leviticus 11:34
    book: Lev
    section: torah
    chapter: 11
    verse: 34
    ordinal: 3029
    text: All food therein which may be eaten, that on which water cometh, shall be unclean; and all drink in every such vessel that may be drunk shall be unclean.
    translation: JPS 1917
    original: מִכָּל־הָאֹכֶל אֲשֶׁר יֵאָכֵל אֲשֶׁר יָבוֹא עָלָיו מַיִם יִטְמָא וְכָל־מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה בְּכָל־כְּלִי יִטְמָא׃
    hebrewPlain: מכל האכל אשר יאכל אשר יבוא עליו מים יטמא וכל משקה אשר ישתה בכל כלי יטמא
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:34
    kjvOsis:
    - Lev.11.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.35
    scripture: tanakh
    name: Tanakh Leviticus 11:35
    ref: Leviticus 11:35
    book: Lev
    section: torah
    chapter: 11
    verse: 35
    ordinal: 3030
    text: And every thing whereupon any part of their carcass falleth shall be unclean; whether oven, or range for pots, it shall be broken in pieces; they are unclean, and shall be unclean unto you.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר־יִפֹּל מִנִּבְלָתָם עָלָיו יִטְמָא תַּנּוּר וְכִירַיִם יֻתָּץ טְמֵאִים הֵם וּטְמֵאִים יִהְיוּ לָכֶם׃
    hebrewPlain: וכל אשר יפל מנבלתם עליו יטמא תנור וכירים יתץ טמאים הם וטמאים יהיו לכם
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:35
    kjvOsis:
    - Lev.11.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.36
    scripture: tanakh
    name: Tanakh Leviticus 11:36
    ref: Leviticus 11:36
    book: Lev
    section: torah
    chapter: 11
    verse: 36
    ordinal: 3031
    text: Nevertheless a fountain or a cistern wherein is a gathering of water shall be clean; but he who toucheth their carcass shall be unclean.
    translation: JPS 1917
    original: אַךְ מַעְיָן וּבוֹר מִקְוֵה־מַיִם יִהְיֶה טָהוֹר וְנֹגֵעַ בְּנִבְלָתָם יִטְמָא׃
    hebrewPlain: אך מעין ובור מקוה מים יהיה טהור ונגע בנבלתם יטמא
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:36
    kjvOsis:
    - Lev.11.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
