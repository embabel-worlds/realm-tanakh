  data:
    osis: Lev.4.2
    scripture: tanakh
    name: Tanakh Leviticus 4:2
    ref: Leviticus 4:2
    book: Lev
    section: torah
    chapter: 4
    verse: 2
    ordinal: 2795
    text: 'Speak unto the children of Israel, saying: If any one shall sin through error, in any of the things which the LORD hath commanded not to be done, and shall do any one of them:'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר נֶפֶשׁ כִּי־תֶחֱטָא בִשְׁגָגָה מִכֹּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה וְעָשָׂה מֵאַחַת מֵהֵנָּה׃
    hebrewPlain: דבר אל בני ישראל לאמר נפש כי תחטא בשגגה מכל מצות יהוה אשר לא תעשינה ועשה מאחת מהנה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:2
    kjvOsis:
    - Lev.4.2
