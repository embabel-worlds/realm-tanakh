  data:
    osis: Lev.7.5
    scripture: tanakh
    name: Tanakh Leviticus 7:5
    ref: Leviticus 7:5
    book: Lev
    section: torah
    chapter: 7
    verse: 5
    ordinal: 2882
    text: And the priest shall make them smoke upon the altar for an offering made by fire unto the LORD; it is a guilt-offering.
    translation: JPS 1917
    original: וְהִקְטִיר אֹתָם הַכֹּהֵן הַמִּזְבֵּחָה אִשֶּׁה לַיהוָה אָשָׁם הוּא׃
    hebrewPlain: והקטיר אתם הכהן המזבחה אשה ליהוה אשם הוא
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:5
    kjvOsis:
    - Lev.7.5
