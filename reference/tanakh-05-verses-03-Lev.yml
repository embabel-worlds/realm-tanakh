- type: TanakhVerse
  data:
    osis: Lev.18.27
    scripture: tanakh
    name: Tanakh Leviticus 18:27
    ref: Leviticus 18:27
    book: Lev
    section: torah
    chapter: 18
    verse: 27
    ordinal: 3276
    text: for all these abominations have the men of the land done, that were before you, and the land is defiled—
    translation: JPS 1917
    original: כִּי אֶת־כָּל־הַתּוֹעֵבֹת הָאֵל עָשׂוּ אַנְשֵׁי־הָאָרֶץ אֲשֶׁר לִפְנֵיכֶם וַתִּטְמָא הָאָרֶץ׃
    hebrewPlain: כי את כל התועבת האל עשו אנשי הארץ אשר לפניכם ותטמא הארץ
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:27
    kjvOsis:
    - Lev.18.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.18
  - predicate: IN_PORTION
    to:
      type: Parashah
