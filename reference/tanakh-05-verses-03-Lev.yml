    section: torah
    chapter: 11
    verse: 26
    ordinal: 3021
    text: Every beast which parteth the hoof, but is not cloven footed, nor cheweth the cud, is unclean unto you; every one that to toucheth them shall be unclean.
    translation: JPS 1917
    original: לְכָל־הַבְּהֵמָה אֲשֶׁר הִוא מַפְרֶסֶת פַּרְסָה וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת וְגֵרָה אֵינֶנָּה מַעֲלָה טְמֵאִים הֵם לָכֶם כָּל־הַנֹּגֵעַ בָּהֶם יִטְמָא׃
    hebrewPlain: לכל הבהמה אשר הוא מפרסת פרסה ושסע איננה שסעת וגרה איננה מעלה טמאים הם לכם כל הנגע בהם יטמא
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:26
    kjvOsis:
    - Lev.11.26
