  data:
    osis: Lev.6.19
    scripture: tanakh
    name: Tanakh Leviticus 6:19
    ref: Leviticus 6:19
    book: Lev
    section: torah
    chapter: 6
    verse: 19
    ordinal: 2873
    text: The priest that offereth it for sin shall eat it; in a holy place shall it be eaten, in the court of the tent of meeting.
    translation: JPS 1917
    original: הַכֹּהֵן הַמְחַטֵּא אֹתָהּ יֹאכֲלֶנָּה בְּמָקוֹם קָדֹשׁ תֵּאָכֵל בַּחֲצַר אֹהֶל מוֹעֵד׃
    hebrewPlain: הכהן המחטא אתה יאכלנה במקום קדש תאכל בחצר אהל מועד
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:26
    kjvOsis:
