  data:
    osis: Lev.5.17
    scripture: tanakh
    name: Tanakh Leviticus 5:17
    ref: Leviticus 5:17
    book: Lev
    section: torah
    chapter: 5
    verse: 17
    ordinal: 2845
    text: And if any one sin, and do any of the things which the LORD hath commanded not to be done, though he know it not, yet is he guilty, and shall bear his iniquity.
    translation: JPS 1917
    original: וְאִם־נֶפֶשׁ כִּי תֶחֱטָא וְעָשְׂתָה אַחַת מִכָּל־מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה וְלֹא־יָדַע וְאָשֵׁם וְנָשָׂא עֲוֺנוֹ׃
    hebrewPlain: ואם נפש כי תחטא ועשתה אחת מכל מצות יהוה אשר לא תעשינה ולא ידע ואשם ונשא עונו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:17
    kjvOsis:
    - Lev.5.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.18
    scripture: tanakh
    name: Tanakh Leviticus 5:18
    ref: Leviticus 5:18
    book: Lev
    section: torah
    chapter: 5
    verse: 18
    ordinal: 2846
    text: And he shall bring a ram without blemish out of the flock, according to thy valuation, for a guilt-offering, unto the priest; and the priest shall make atonement for him concerning the error which he committed, though he knew it not, and he shall be forgiven.
    translation: JPS 1917
    original: וְהֵבִיא אַיִל תָּמִים מִן־הַצֹּאן בְּעֶרְכְּךָ לְאָשָׁם אֶל־הַכֹּהֵן וְכִפֶּר עָלָיו הַכֹּהֵן עַל שִׁגְגָתוֹ אֲשֶׁר־שָׁגָג וְהוּא לֹא־יָדַע וְנִסְלַח לוֹ׃
    hebrewPlain: והביא איל תמים מן הצאן בערכך לאשם אל הכהן וכפר עליו הכהן על שגגתו אשר שגג והוא לא ידע ונסלח לו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:18
    kjvOsis:
    - Lev.5.18
