  data:
    osis: Lev.13.43
    scripture: tanakh
    name: Tanakh Leviticus 13:43
    ref: Leviticus 13:43
    book: Lev
    section: torah
    chapter: 13
    verse: 43
    ordinal: 3093
    text: Then the priest shall look upon him; and, behold, if the rising of the plague be reddish-white in his bald head, or in his bald forehead, as the appearance of leprosy in the skin of the flesh,
    translation: JPS 1917
    original: וְרָאָה אֹתוֹ הַכֹּהֵן וְהִנֵּה שְׂאֵת־הַנֶּגַע לְבָנָה אֲדַמְדֶּמֶת בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ כְּמַרְאֵה צָרַעַת עוֹר בָּשָׂר׃
    hebrewPlain: וראה אתו הכהן והנה שאת הנגע לבנה אדמדמת בקרחתו או בגבחתו כמראה צרעת עור בשר
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:43
    kjvOsis:
    - Lev.13.43
