  data:
    osis: Lev.9.15
    scripture: tanakh
    name: Tanakh Leviticus 9:15
    ref: Leviticus 9:15
    book: Lev
    section: torah
    chapter: 9
    verse: 15
    ordinal: 2966
    text: And the people’s offering was presented; and he took the goat of the sin-offering which was for the people, and slew it, and offered it for sin, as the first.
    translation: JPS 1917
    original: וַיַּקְרֵב אֵת קָרְבַּן הָעָם וַיִּקַּח אֶת־שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם וַיִּשְׁחָטֵהוּ וַיְחַטְּאֵהוּ כָּרִאשׁוֹן׃
    hebrewPlain: ויקרב את קרבן העם ויקח את שעיר החטאת אשר לעם וישחטהו ויחטאהו כראשון
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:15
    kjvOsis:
    - Lev.9.15
