  data:
    osis: Lev.23.24
    scripture: tanakh
    name: Tanakh Leviticus 23:24
    ref: Leviticus 23:24
    book: Lev
    section: torah
    chapter: 23
    verse: 24
    ordinal: 3424
    text: 'Speak unto the children of Israel, saying: In the seventh month, in the first day of the month, shall be a solemn rest unto you, a memorial proclaimed with the blast of horns, a holy convocation.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ יִהְיֶה לָכֶם שַׁבָּתוֹן זִכְרוֹן תְּרוּעָה מִקְרָא־קֹדֶשׁ׃
    hebrewPlain: דבר אל בני ישראל לאמר בחדש השביעי באחד לחדש יהיה לכם שבתון זכרון תרועה מקרא קדש
    parashah: Emor
    kjvRefs:
    - Leviticus 23:24
    kjvOsis:
    - Lev.23.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
