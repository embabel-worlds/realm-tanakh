      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.47
    scripture: tanakh
    name: Tanakh Leviticus 14:47
    ref: Leviticus 14:47
    book: Lev
    section: torah
    chapter: 14
    verse: 47
    ordinal: 3156
    text: And he that lieth in the house shall wash his clothes; and he that eateth in the house shall wash his clothes.
    translation: JPS 1917
    original: וְהַשֹּׁכֵב בַּבַּיִת יְכַבֵּס אֶת־בְּגָדָיו וְהָאֹכֵל בַּבַּיִת יְכַבֵּס אֶת־בְּגָדָיו׃
    hebrewPlain: והשכב בבית יכבס את בגדיו והאכל בבית יכבס את בגדיו
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:47
    kjvOsis:
    - Lev.14.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
