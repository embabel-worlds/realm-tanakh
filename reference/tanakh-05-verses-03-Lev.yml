  data:
    osis: Lev.13.45
    scripture: tanakh
    name: Tanakh Leviticus 13:45
    ref: Leviticus 13:45
    book: Lev
    section: torah
    chapter: 13
    verse: 45
    ordinal: 3095
    text: 'And the leper in whom the plague is, his clothes shall be rent, and the hair of his head shall go loose, and he shall cover his upper lip, and shall cry: ‘Unclean, unclean.’'
    translation: JPS 1917
    original: וְהַצָּרוּעַ אֲשֶׁר־בּוֹ הַנֶּגַע בְּגָדָיו יִהְיוּ פְרֻמִים וְרֹאשׁוֹ יִהְיֶה פָרוּעַ וְעַל־שָׂפָם יַעְטֶה וְטָמֵא טָמֵא יִקְרָא׃
    hebrewPlain: והצרוע אשר בו הנגע בגדיו יהיו פרמים וראשו יהיה פרוע ועל שפם יעטה וטמא טמא יקרא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:45
    kjvOsis:
    - Lev.13.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
