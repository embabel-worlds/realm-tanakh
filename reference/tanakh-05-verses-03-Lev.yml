  data:
    osis: Lev.2.12
    scripture: tanakh
    name: Tanakh Leviticus 2:12
    ref: Leviticus 2:12
    book: Lev
    section: torah
    chapter: 2
    verse: 12
    ordinal: 2772
    text: As an offering of first-fruits ye may bring them unto the LORD; but they shall not come up for a sweet savour on the altar.
    translation: JPS 1917
    original: קָרְבַּן רֵאשִׁית תַּקְרִיבוּ אֹתָם לַיהוָה וְאֶל־הַמִּזְבֵּחַ לֹא־יַעֲלוּ לְרֵיחַ נִיחֹחַ׃
    hebrewPlain: קרבן ראשית תקריבו אתם ליהוה ואל המזבח לא יעלו לריח ניחח
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:12
    kjvOsis:
    - Lev.2.12
