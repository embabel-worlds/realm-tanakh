- type: TanakhVerse
  data:
    osis: Lev.17.2
    scripture: tanakh
    name: Tanakh Leviticus 17:2
    ref: Leviticus 17:2
    book: Lev
    section: torah
    chapter: 17
    verse: 2
    ordinal: 3235
    text: 'Speak unto Aaron, and unto his sons, and unto all the children of Israel, and say unto them: This is the thing which the LORD hath commanded, saying:'
    translation: JPS 1917
    original: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו וְאֶל כָּל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵיהֶם זֶה הַדָּבָר אֲשֶׁר־צִוָּה יְהוָה לֵאמֹר׃
    hebrewPlain: דבר אל אהרן ואל בניו ואל כל בני ישראל ואמרת אליהם זה הדבר אשר צוה יהוה לאמר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:2
    kjvOsis:
    - Lev.17.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.3
    scripture: tanakh
    name: Tanakh Leviticus 17:3
    ref: Leviticus 17:3
    book: Lev
    section: torah
    chapter: 17
    verse: 3
    ordinal: 3236
    text: What man soever there be of the house of Israel, that killeth an ox, or lamb, or goat, in the camp, or that killeth it without the camp,
    translation: JPS 1917
    original: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל אֲשֶׁר יִשְׁחַט שׁוֹר אוֹ־כֶשֶׂב אוֹ־עֵז בַּמַּחֲנֶה אוֹ אֲשֶׁר יִשְׁחַט מִחוּץ לַמַּחֲנֶה׃
    hebrewPlain: איש איש מבית ישראל אשר ישחט שור או כשב או עז במחנה או אשר ישחט מחוץ למחנה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:3
    kjvOsis:
    - Lev.17.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.4
    scripture: tanakh
    name: Tanakh Leviticus 17:4
    ref: Leviticus 17:4
    book: Lev
    section: torah
    chapter: 17
    verse: 4
    ordinal: 3237
    text: and hath not brought it unto the door of the tent of meeting, to present it as an offering unto the LORD before the tabernacle of the LORD, blood shall be imputed unto that man; he hath shed blood; and that man shall be cut off from among his people.
    translation: JPS 1917
    original: וְאֶל־פֶּתַח אֹהֶל מוֹעֵד לֹא הֱבִיאוֹ לְהַקְרִיב קָרְבָּן לַיהוָה לִפְנֵי מִשְׁכַּן יְהוָה דָּם יֵחָשֵׁב לָאִישׁ הַהוּא דָּם שָׁפָךְ וְנִכְרַת הָאִישׁ הַהוּא מִקֶּרֶב עַמּוֹ׃
    hebrewPlain: ואל פתח אהל מועד לא הביאו להקריב קרבן ליהוה לפני משכן יהוה דם יחשב לאיש ההוא דם שפך ונכרת האיש ההוא מקרב עמו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:4
    kjvOsis:
    - Lev.17.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.5
    scripture: tanakh
    name: Tanakh Leviticus 17:5
    ref: Leviticus 17:5
    book: Lev
    section: torah
    chapter: 17
    verse: 5
    ordinal: 3238
    text: To the end that the children of Israel may bring their sacrifices, which they sacrifice in the open field, even that they may bring them unto the LORD, unto the door of the tent of meeting, unto the priest, and sacrifice them for sacrifices of peace-offerings unto the LORD.
    translation: JPS 1917
    original: לְמַעַן אֲשֶׁר יָבִיאוּ בְּנֵי יִשְׂרָאֵל אֶת־זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים עַל־פְּנֵי הַשָּׂדֶה וֶהֱבִיאֻם לַיהוָה אֶל־פֶּתַח אֹהֶל מוֹעֵד אֶל־הַכֹּהֵן וְזָבְחוּ זִבְחֵי שְׁלָמִים לַיהוָה אוֹתָם׃
    hebrewPlain: למען אשר יביאו בני ישראל את זבחיהם אשר הם זבחים על פני השדה והביאם ליהוה אל פתח אהל מועד אל הכהן וזבחו זבחי שלמים ליהוה אותם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:5
    kjvOsis:
    - Lev.17.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.6
    scripture: tanakh
    name: Tanakh Leviticus 17:6
    ref: Leviticus 17:6
    book: Lev
    section: torah
    chapter: 17
    verse: 6
    ordinal: 3239
    text: And the priest shall dash the blood against the altar of the LORD at the door of the tent of meeting, and make the fat smoke for a sweet savour unto the LORD.
    translation: JPS 1917
    original: וְזָרַק הַכֹּהֵן אֶת־הַדָּם עַל־מִזְבַּח יְהוָה פֶּתַח אֹהֶל מוֹעֵד וְהִקְטִיר הַחֵלֶב לְרֵיחַ נִיחֹחַ לַיהוָה׃
    hebrewPlain: וזרק הכהן את הדם על מזבח יהוה פתח אהל מועד והקטיר החלב לריח ניחח ליהוה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:6
    kjvOsis:
    - Lev.17.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.7
    scripture: tanakh
    name: Tanakh Leviticus 17:7
    ref: Leviticus 17:7
    book: Lev
    section: torah
    chapter: 17
    verse: 7
    ordinal: 3240
    text: And they shall no more sacrifice their sacrifices unto the satyrs, after whom they go astray. This shall be a statute for ever unto them throughout their generations. .
    translation: JPS 1917
    original: וְלֹא־יִזְבְּחוּ עוֹד אֶת־זִבְחֵיהֶם לַשְּׂעִירִם אֲשֶׁר הֵם זֹנִים אַחֲרֵיהֶם חֻקַּת עוֹלָם תִּהְיֶה־זֹּאת לָהֶם לְדֹרֹתָם׃
    hebrewPlain: ולא יזבחו עוד את זבחיהם לשעירם אשר הם זנים אחריהם חקת עולם תהיה זאת להם לדרתם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:7
    kjvOsis:
    - Lev.17.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.8
    scripture: tanakh
    name: Tanakh Leviticus 17:8
    ref: Leviticus 17:8
    book: Lev
    section: torah
    chapter: 17
    verse: 8
    ordinal: 3241
    text: 'And thou shalt say unto them: Whatsoever man there be of the house of Israel, or of the strangers that sojourn among them, that offereth a burnt-offering or sacrifice,'
    translation: JPS 1917
    original: וַאֲלֵהֶם תֹּאמַר אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמִן־הַגֵּר אֲשֶׁר־יָגוּר בְּתוֹכָם אֲשֶׁר־יַעֲלֶה עֹלָה אוֹ־זָבַח׃
    hebrewPlain: ואלהם תאמר איש איש מבית ישראל ומן הגר אשר יגור בתוכם אשר יעלה עלה או זבח
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:8
    kjvOsis:
    - Lev.17.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.9
    scripture: tanakh
    name: Tanakh Leviticus 17:9
    ref: Leviticus 17:9
    book: Lev
    section: torah
    chapter: 17
    verse: 9
    ordinal: 3242
    text: and bringeth it not unto the door of the tent of meeting, to sacrifice it unto the LORD, even that man shall be cut off from his people.
    translation: JPS 1917
    original: וְאֶל־פֶּתַח אֹהֶל מוֹעֵד לֹא יְבִיאֶנּוּ לַעֲשׂוֹת אֹתוֹ לַיהוָה וְנִכְרַת הָאִישׁ הַהוּא מֵעַמָּיו׃
    hebrewPlain: ואל פתח אהל מועד לא יביאנו לעשות אתו ליהוה ונכרת האיש ההוא מעמיו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:9
    kjvOsis:
    - Lev.17.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.10
    scripture: tanakh
    name: Tanakh Leviticus 17:10
    ref: Leviticus 17:10
    book: Lev
    section: torah
    chapter: 17
    verse: 10
    ordinal: 3243
    text: And whatsoever man there be of the house of Israel, or of the strangers that sojourn among them, that eateth any manner of blood, I will set My face against that soul that eateth blood, and will cut him off from among his people.
    translation: JPS 1917
    original: וְאִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמִן־הַגֵּר הַגָּר בְּתוֹכָם אֲשֶׁר יֹאכַל כָּל־דָּם וְנָתַתִּי פָנַי בַּנֶּפֶשׁ הָאֹכֶלֶת אֶת־הַדָּם וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ׃
    hebrewPlain: ואיש איש מבית ישראל ומן הגר הגר בתוכם אשר יאכל כל דם ונתתי פני בנפש האכלת את הדם והכרתי אתה מקרב עמה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:10
    kjvOsis:
    - Lev.17.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.11
    scripture: tanakh
    name: Tanakh Leviticus 17:11
    ref: Leviticus 17:11
    book: Lev
    section: torah
    chapter: 17
    verse: 11
    ordinal: 3244
    text: For the life of the flesh is in the blood; and I have given it to you upon the altar to make atonement for your souls; for it is the blood that maketh atonement by reason of the life.
    translation: JPS 1917
    original: כִּי נֶפֶשׁ הַבָּשָׂר בַּדָּם הִוא וַאֲנִי נְתַתִּיו לָכֶם עַל־הַמִּזְבֵּחַ לְכַפֵּר עַל־נַפְשֹׁתֵיכֶם כִּי־הַדָּם הוּא בַּנֶּפֶשׁ יְכַפֵּר׃
    hebrewPlain: כי נפש הבשר בדם הוא ואני נתתיו לכם על המזבח לכפר על נפשתיכם כי הדם הוא בנפש יכפר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:11
    kjvOsis:
    - Lev.17.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.12
    scripture: tanakh
    name: Tanakh Leviticus 17:12
    ref: Leviticus 17:12
    book: Lev
    section: torah
    chapter: 17
    verse: 12
    ordinal: 3245
    text: 'Therefore I said unto the children of Israel: No soul of you shall eat blood, neither shall any stranger that sojourneth among you eat blood.'
    translation: JPS 1917
    original: עַל־כֵּן אָמַרְתִּי לִבְנֵי יִשְׂרָאֵל כָּל־נֶפֶשׁ מִכֶּם לֹא־תֹאכַל דָּם וְהַגֵּר הַגָּר בְּתוֹכְכֶם לֹא־יֹאכַל דָּם׃
    hebrewPlain: על כן אמרתי לבני ישראל כל נפש מכם לא תאכל דם והגר הגר בתוככם לא יאכל דם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:12
    kjvOsis:
    - Lev.17.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.13
    scripture: tanakh
    name: Tanakh Leviticus 17:13
    ref: Leviticus 17:13
    book: Lev
    section: torah
    chapter: 17
    verse: 13
    ordinal: 3246
    text: And whatsoever man there be of the children of Israel, or of the strangers that sojourn among them, that taketh in hunting any beast or fowl that may be eaten, he shall pour out the blood thereof, and cover it with dust.
    translation: JPS 1917
    original: וְאִישׁ אִישׁ מִבְּנֵי יִשְׂרָאֵל וּמִן־הַגֵּר הַגָּר בְּתוֹכָם אֲשֶׁר יָצוּד צֵיד חַיָּה אוֹ־עוֹף אֲשֶׁר יֵאָכֵל וְשָׁפַךְ אֶת־דָּמוֹ וְכִסָּהוּ בֶּעָפָר׃
    hebrewPlain: ואיש איש מבני ישראל ומן הגר הגר בתוכם אשר יצוד ציד חיה או עוף אשר יאכל ושפך את דמו וכסהו בעפר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:13
    kjvOsis:
    - Lev.17.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.14
    scripture: tanakh
    name: Tanakh Leviticus 17:14
    ref: Leviticus 17:14
    book: Lev
    section: torah
    chapter: 17
    verse: 14
    ordinal: 3247
    text: 'For as to the life of all flesh, the blood thereof is all one with the life thereof; therefore I said unto the children of Israel: Ye shall eat the blood of no manner of flesh; for the life of all flesh is the blood thereof; whosoever eateth it shall be cut off.'
    translation: JPS 1917
    original: כִּי־נֶפֶשׁ כָּל־בָּשָׂר דָּמוֹ בְנַפְשׁוֹ הוּא וָאֹמַר לִבְנֵי יִשְׂרָאֵל דַּם כָּל־בָּשָׂר לֹא תֹאכֵלוּ כִּי נֶפֶשׁ כָּל־בָּשָׂר דָּמוֹ הִוא כָּל־אֹכְלָיו יִכָּרֵת׃
    hebrewPlain: כי נפש כל בשר דמו בנפשו הוא ואמר לבני ישראל דם כל בשר לא תאכלו כי נפש כל בשר דמו הוא כל אכליו יכרת
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:14
    kjvOsis:
    - Lev.17.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.17.15
    scripture: tanakh
    name: Tanakh Leviticus 17:15
    ref: Leviticus 17:15
    book: Lev
    section: torah
    chapter: 17
    verse: 15
    ordinal: 3248
    text: And every soul that eateth that which dieth of itself, or that which is torn of beasts, whether he be home-born or a stranger, he shall wash his clothes, and bathe himself in water, and be unclean until the even; then shall he be clean.
    translation: JPS 1917
