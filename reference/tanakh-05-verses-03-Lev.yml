- type: TanakhVerse
  data:
    osis: Lev.15.19
    scripture: tanakh
    name: Tanakh Leviticus 15:19
    ref: Leviticus 15:19
    book: Lev
    section: torah
    chapter: 15
    verse: 19
    ordinal: 3185
    text: And if a woman have an issue, and her issue in her flesh be blood, she shall be in her impurity seven days; and whosoever toucheth her shall be unclean until the even.
    translation: JPS 1917
    original: וְאִשָּׁה כִּי־תִהְיֶה זָבָה דָּם יִהְיֶה זֹבָהּ בִּבְשָׂרָהּ שִׁבְעַת יָמִים תִּהְיֶה בְנִדָּתָהּ וְכָל־הַנֹּגֵעַ בָּהּ יִטְמָא עַד־הָעָרֶב׃
    hebrewPlain: ואשה כי תהיה זבה דם יהיה זבה בבשרה שבעת ימים תהיה בנדתה וכל הנגע בה יטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:19
    kjvOsis:
    - Lev.15.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.20
    scripture: tanakh
    name: Tanakh Leviticus 15:20
    ref: Leviticus 15:20
    book: Lev
    section: torah
    chapter: 15
    verse: 20
    ordinal: 3186
    text: And every thing that she lieth upon in her impurity shall be unclean; every thing also that she sitteth upon shall be unclean.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר תִּשְׁכַּב עָלָיו בְּנִדָּתָהּ יִטְמָא וְכֹל אֲשֶׁר־תֵּשֵׁב עָלָיו יִטְמָא׃
    hebrewPlain: וכל אשר תשכב עליו בנדתה יטמא וכל אשר תשב עליו יטמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:20
    kjvOsis:
    - Lev.15.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.21
    scripture: tanakh
    name: Tanakh Leviticus 15:21
    ref: Leviticus 15:21
    book: Lev
    section: torah
    chapter: 15
    verse: 21
    ordinal: 3187
    text: And whosoever toucheth her bed shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־הַנֹּגֵעַ בְּמִשְׁכָּבָהּ יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל הנגע במשכבה יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:21
    kjvOsis:
    - Lev.15.21
