  data:
    osis: Lev.7.2
    scripture: tanakh
    name: Tanakh Leviticus 7:2
    ref: Leviticus 7:2
    book: Lev
    section: torah
    chapter: 7
    verse: 2
    ordinal: 2879
    text: 'In the place where they kill the burnt-offering shall they kill the guilt-offering: and the blood thereof shall be dashed against the altar round about.'
    translation: JPS 1917
    original: בִּמְקוֹם אֲשֶׁר יִשְׁחֲטוּ אֶת־הָעֹלָה יִשְׁחֲטוּ אֶת־הָאָשָׁם וְאֶת־דָּמוֹ יִזְרֹק עַל־הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: במקום אשר ישחטו את העלה ישחטו את האשם ואת דמו יזרק על המזבח סביב
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:2
    kjvOsis:
