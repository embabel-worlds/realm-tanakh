  data:
    osis: Lev.6.15
    scripture: tanakh
    name: Tanakh Leviticus 6:15
    ref: Leviticus 6:15
    book: Lev
    section: torah
    chapter: 6
    verse: 15
    ordinal: 2869
    text: And the anointed priest that shall be in his stead from among his sons shall offer it, it is a due for ever; it shall be wholly made to smoke unto the LORD.
    translation: JPS 1917
    original: וְהַכֹּהֵן הַמָּשִׁיחַ תַּחְתָּיו מִבָּנָיו יַעֲשֶׂה אֹתָהּ חָק־עוֹלָם לַיהוָה כָּלִיל תָּקְטָר׃
    hebrewPlain: והכהן המשיח תחתיו מבניו יעשה אתה חק עולם ליהוה כליל תקטר
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:22
    kjvOsis:
    - Lev.6.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
