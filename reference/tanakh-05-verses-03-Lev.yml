  data:
    osis: Lev.25.34
    scripture: tanakh
    name: Tanakh Leviticus 25:34
    ref: Leviticus 25:34
    book: Lev
    section: torah
    chapter: 25
    verse: 34
    ordinal: 3501
    text: But the fields of the open land about their cities may not be sold; for that is their perpetual possession.
    translation: JPS 1917
    original: וּשְׂדֵה מִגְרַשׁ עָרֵיהֶם לֹא יִמָּכֵר כִּי־אֲחֻזַּת עוֹלָם הוּא לָהֶם׃
    hebrewPlain: ושדה מגרש עריהם לא ימכר כי אחזת עולם הוא להם
    parashah: Behar
    kjvRefs:
    - Leviticus 25:34
    kjvOsis:
    - Lev.25.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
