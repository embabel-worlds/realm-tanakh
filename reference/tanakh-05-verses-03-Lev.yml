      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.48
    scripture: tanakh
    name: Tanakh Leviticus 14:48
    ref: Leviticus 14:48
    book: Lev
    section: torah
    chapter: 14
    verse: 48
    ordinal: 3157
    text: And if the priest shall come in, and look, and, behold, the plague hath not spread in the house, after the house was plastered; then the priest shall pronounce the house clean, because the plague is healed.
    translation: JPS 1917
    original: וְאִם־בֹּא יָבֹא הַכֹּהֵן וְרָאָה וְהִנֵּה לֹא־פָשָׂה הַנֶּגַע בַּבַּיִת אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת כִּי נִרְפָּא הַנָּגַע׃
    hebrewPlain: ואם בא יבא הכהן וראה והנה לא פשה הנגע בבית אחרי הטח את הבית וטהר הכהן את הבית כי נרפא הנגע
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:48
    kjvOsis:
    - Lev.14.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.49
    scripture: tanakh
    name: Tanakh Leviticus 14:49
    ref: Leviticus 14:49
    book: Lev
    section: torah
    chapter: 14
    verse: 49
    ordinal: 3158
    text: And he shall take to cleanse the house two birds, and cedar-wood, and scarlet, and hyssop.
    translation: JPS 1917
    original: וְלָקַח לְחַטֵּא אֶת־הַבַּיִת שְׁתֵּי צִפֳּרִים וְעֵץ אֶרֶז וּשְׁנִי תוֹלַעַת וְאֵזֹב׃
    hebrewPlain: ולקח לחטא את הבית שתי צפרים ועץ ארז ושני תולעת ואזב
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:49
    kjvOsis:
    - Lev.14.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.50
    scripture: tanakh
    name: Tanakh Leviticus 14:50
    ref: Leviticus 14:50
    book: Lev
    section: torah
    chapter: 14
    verse: 50
    ordinal: 3159
    text: And he shall kill one of the birds in an earthen vessel over running water.
    translation: JPS 1917
    original: וְשָׁחַט אֶת־הַצִּפֹּר הָאֶחָת אֶל־כְּלִי־חֶרֶשׂ עַל־מַיִם חַיִּים׃
    hebrewPlain: ושחט את הצפר האחת אל כלי חרש על מים חיים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:50
    kjvOsis:
    - Lev.14.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.51
    scripture: tanakh
    name: Tanakh Leviticus 14:51
    ref: Leviticus 14:51
    book: Lev
    section: torah
    chapter: 14
    verse: 51
    ordinal: 3160
    text: And he shall take the cedar-wood, and the hyssop, and the scarlet, and the living bird, and dip them in the blood of the slain bird, and in the running water, and sprinkle the house seven times.
    translation: JPS 1917
    original: וְלָקַח אֶת־עֵץ־הָאֶרֶז וְאֶת־הָאֵזֹב וְאֵת שְׁנִי הַתּוֹלַעַת וְאֵת הַצִּפֹּר הַחַיָּה וְטָבַל אֹתָם בְּדַם הַצִּפֹּר הַשְּׁחוּטָה וּבַמַּיִם הַחַיִּים וְהִזָּה אֶל־הַבַּיִת שֶׁבַע פְּעָמִים׃
    hebrewPlain: ולקח את עץ הארז ואת האזב ואת שני התולעת ואת הצפר החיה וטבל אתם בדם הצפר השחוטה ובמים החיים והזה אל הבית שבע פעמים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:51
    kjvOsis:
    - Lev.14.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.52
    scripture: tanakh
    name: Tanakh Leviticus 14:52
    ref: Leviticus 14:52
    book: Lev
    section: torah
    chapter: 14
    verse: 52
    ordinal: 3161
    text: And he shall cleanse the house with the blood of the bird, and with the running water, and with the living bird, and with the cedar-wood, and with the hyssop, and with the scarlet.
    translation: JPS 1917
    original: וְחִטֵּא אֶת־הַבַּיִת בְּדַם הַצִּפּוֹר וּבַמַּיִם הַחַיִּים וּבַצִּפֹּר הַחַיָּה וּבְעֵץ הָאֶרֶז וּבָאֵזֹב וּבִשְׁנִי הַתּוֹלָעַת׃
    hebrewPlain: וחטא את הבית בדם הצפור ובמים החיים ובצפר החיה ובעץ הארז ובאזב ובשני התולעת
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:52
    kjvOsis:
    - Lev.14.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.53
    scripture: tanakh
    name: Tanakh Leviticus 14:53
    ref: Leviticus 14:53
    book: Lev
    section: torah
    chapter: 14
    verse: 53
    ordinal: 3162
    text: But he shall let go the living bird out of the city into the open field; so shall he make atonement for the house; and it shall be clean.
    translation: JPS 1917
    original: וְשִׁלַּח אֶת־הַצִּפֹּר הַחַיָּה אֶל־מִחוּץ לָעִיר אֶל־פְּנֵי הַשָּׂדֶה וְכִפֶּר עַל־הַבַּיִת וְטָהֵר׃
    hebrewPlain: ושלח את הצפר החיה אל מחוץ לעיר אל פני השדה וכפר על הבית וטהר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:53
    kjvOsis:
    - Lev.14.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
