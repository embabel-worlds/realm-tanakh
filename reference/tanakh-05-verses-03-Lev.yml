  data:
    osis: Lev.24.2
    scripture: tanakh
    name: Tanakh Leviticus 24:2
    ref: Leviticus 24:2
    book: Lev
    section: torah
    chapter: 24
    verse: 2
    ordinal: 3446
    text: ’Command the children of Israel, that they bring unto thee pure olive oil beaten for the light, to cause a lamp to burn continually.
    translation: JPS 1917
    original: צַו אֶת־בְּנֵי יִשְׂרָאֵל וְיִקְחוּ אֵלֶיךָ שֶׁמֶן זַיִת זָךְ כָּתִית לַמָּאוֹר לְהַעֲלֹת נֵר תָּמִיד׃
    hebrewPlain: צו את בני ישראל ויקחו אליך שמן זית זך כתית למאור להעלת נר תמיד
    parashah: Emor
    kjvRefs:
    - Leviticus 24:2
    kjvOsis:
    - Lev.24.2
