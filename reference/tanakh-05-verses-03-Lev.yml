    scripture: tanakh
    name: Tanakh Leviticus 4:14
    ref: Leviticus 4:14
    book: Lev
    section: torah
    chapter: 4
    verse: 14
    ordinal: 2807
    text: when the sin wherein they have sinned is known, then the assembly shall offer a young bullock for a sin-offering, and bring it before the tent of meeting.
    translation: JPS 1917
    original: וְנוֹדְעָה הַחַטָּאת אֲשֶׁר חָטְאוּ עָלֶיהָ וְהִקְרִיבוּ הַקָּהָל פַּר בֶּן־בָּקָר לְחַטָּאת וְהֵבִיאוּ אֹתוֹ לִפְנֵי אֹהֶל מוֹעֵד׃
    hebrewPlain: ונודעה החטאת אשר חטאו עליה והקריבו הקהל פר בן בקר לחטאת והביאו אתו לפני אהל מועד
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:14
    kjvOsis:
    - Lev.4.14
