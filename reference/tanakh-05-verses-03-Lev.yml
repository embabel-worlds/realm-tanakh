    name: Tanakh Leviticus 5:25
    ref: Leviticus 5:25
    book: Lev
    section: torah
    chapter: 5
    verse: 25
    ordinal: 2853
    text: And he shall bring his forfeit unto the LORD, a ram without blemish out of the flock, according to thy valuation, for a guilt-offering, unto the priest.
    translation: JPS 1917
    original: וְאֶת־אֲשָׁמוֹ יָבִיא לַיהוָה אַיִל תָּמִים מִן־הַצֹּאן בְּעֶרְכְּךָ לְאָשָׁם אֶל־הַכֹּהֵן׃
    hebrewPlain: ואת אשמו יביא ליהוה איל תמים מן הצאן בערכך לאשם אל הכהן
    parashah: Vayikra
    kjvRefs:
