    ref: Leviticus 24:22
    book: Lev
    section: torah
    chapter: 24
    verse: 22
    ordinal: 3466
    text: Ye shall have one manner of law, as well for the stranger, as for the home-born; for I am the LORD your God.’
    translation: JPS 1917
    original: מִשְׁפַּט אֶחָד יִהְיֶה לָכֶם כַּגֵּר כָּאֶזְרָח יִהְיֶה כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: משפט אחד יהיה לכם כגר כאזרח יהיה כי אני יהוה אלהיכם
    parashah: Emor
