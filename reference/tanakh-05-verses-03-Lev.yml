  data:
    osis: Lev.6.22
    scripture: tanakh
    name: Tanakh Leviticus 6:22
    ref: Leviticus 6:22
    book: Lev
    section: torah
    chapter: 6
    verse: 22
    ordinal: 2876
    text: Every male among the priests may eat thereof; it is most holy.
    translation: JPS 1917
    original: כָּל־זָכָר בַּכֹּהֲנִים יֹאכַל אֹתָהּ קֹדֶשׁ קָדָשִׁים הִוא׃
    hebrewPlain: כל זכר בכהנים יאכל אתה קדש קדשים הוא
    parashah: Tzav
