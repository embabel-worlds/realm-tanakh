  data:
    osis: Lev.7.3
    scripture: tanakh
    name: Tanakh Leviticus 7:3
    ref: Leviticus 7:3
    book: Lev
    section: torah
    chapter: 7
    verse: 3
    ordinal: 2880
    text: 'And he shall offer of it all the fat thereof: the fat tail, and the fat that covereth the inwards,'
    translation: JPS 1917
    original: וְאֵת כָּל־חֶלְבּוֹ יַקְרִיב מִמֶּנּוּ אֵת הָאַלְיָה וְאֶת־הַחֵלֶב הַמְכַסֶּה אֶת־הַקֶּרֶב׃
    hebrewPlain: ואת כל חלבו יקריב ממנו את האליה ואת החלב המכסה את הקרב
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:3
    kjvOsis:
    - Lev.7.3
  relations:
