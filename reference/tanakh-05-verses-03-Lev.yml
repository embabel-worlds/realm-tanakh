    translation: JPS 1917
    original: וְאֶל־אִשָּׁה בְּנִדַּת טֻמְאָתָהּ לֹא תִקְרַב לְגַלּוֹת עֶרְוָתָהּ׃
    hebrewPlain: ואל אשה בנדת טמאתה לא תקרב לגלות ערותה
