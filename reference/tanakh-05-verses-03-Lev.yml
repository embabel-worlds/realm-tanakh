- type: TanakhVerse
  data:
    osis: Lev.16.18
    scripture: tanakh
    name: Tanakh Leviticus 16:18
    ref: Leviticus 16:18
    book: Lev
    section: torah
    chapter: 16
    verse: 18
    ordinal: 3217
    text: And he shall go out unto the altar that is before the LORD, and make atonement for it; and shall take of the blood of the bullock, and of the blood of the goat, and put it upon the horns of the altar round about.
    translation: JPS 1917
    original: וְיָצָא אֶל־הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי־יְהוָה וְכִפֶּר עָלָיו וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר וְנָתַן עַל־קַרְנוֹת הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: ויצא אל המזבח אשר לפני יהוה וכפר עליו ולקח מדם הפר ומדם השעיר ונתן על קרנות המזבח סביב
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:18
    kjvOsis:
    - Lev.16.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.19
    scripture: tanakh
    name: Tanakh Leviticus 16:19
    ref: Leviticus 16:19
    book: Lev
    section: torah
    chapter: 16
    verse: 19
    ordinal: 3218
    text: And he shall sprinkle of the blood upon it with his finger seven times, and cleanse it, and hallow it from the uncleannesses of the children of Israel.
    translation: JPS 1917
    original: וְהִזָּה עָלָיו מִן־הַדָּם בְּאֶצְבָּעוֹ שֶׁבַע פְּעָמִים וְטִהֲרוֹ וְקִדְּשׁוֹ מִטֻּמְאֹת בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: והזה עליו מן הדם באצבעו שבע פעמים וטהרו וקדשו מטמאת בני ישראל
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:19
    kjvOsis:
    - Lev.16.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.20
    scripture: tanakh
    name: Tanakh Leviticus 16:20
    ref: Leviticus 16:20
    book: Lev
    section: torah
    chapter: 16
    verse: 20
    ordinal: 3219
    text: And when he hath made an end of atoning for the holy place, and the tent of meeting, and the altar, he shall present the live goat.
    translation: JPS 1917
    original: וְכִלָּה מִכַּפֵּר אֶת־הַקֹּדֶשׁ וְאֶת־אֹהֶל מוֹעֵד וְאֶת־הַמִּזְבֵּחַ וְהִקְרִיב אֶת־הַשָּׂעִיר הֶחָי׃
    hebrewPlain: וכלה מכפר את הקדש ואת אהל מועד ואת המזבח והקריב את השעיר החי
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:20
    kjvOsis:
    - Lev.16.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.21
    scripture: tanakh
    name: Tanakh Leviticus 16:21
    ref: Leviticus 16:21
    book: Lev
    section: torah
    chapter: 16
    verse: 21
    ordinal: 3220
    text: And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions, even all their sins; and he shall put them upon the head of the goat, and shall send him away by the hand of an appointed man into the wilderness.
    translation: JPS 1917
    original: וְסָמַךְ אַהֲרֹן אֶת־שְׁתֵּי ידו [יָדָיו] עַל רֹאשׁ הַשָּׂעִיר הַחַי וְהִתְוַדָּה עָלָיו אֶת־כָּל־עֲוֺנֹת בְּנֵי יִשְׂרָאֵל וְאֶת־כָּל־פִּשְׁעֵיהֶם לְכָל־חַטֹּאתָם וְנָתַן אֹתָם עַל־רֹאשׁ הַשָּׂעִיר וְשִׁלַּח בְּיַד־אִישׁ עִתִּי הַמִּדְבָּרָה׃
    hebrewPlain: וסמך אהרן את שתי ידו [ידיו] על ראש השעיר החי והתודה עליו את כל עונת בני ישראל ואת כל פשעיהם לכל חטאתם ונתן אתם על ראש השעיר ושלח ביד איש עתי המדברה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:21
    kjvOsis:
    - Lev.16.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.22
    scripture: tanakh
    name: Tanakh Leviticus 16:22
    ref: Leviticus 16:22
    book: Lev
    section: torah
    chapter: 16
    verse: 22
    ordinal: 3221
    text: And the goat shall bear upon him all their iniquities unto a land which is cut off; and he shall let go the goat in the wilderness.
    translation: JPS 1917
    original: וְנָשָׂא הַשָּׂעִיר עָלָיו אֶת־כָּל־עֲוֺנֹתָם אֶל־אֶרֶץ גְּזֵרָה וְשִׁלַּח אֶת־הַשָּׂעִיר בַּמִּדְבָּר׃
    hebrewPlain: ונשא השעיר עליו את כל עונתם אל ארץ גזרה ושלח את השעיר במדבר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:22
    kjvOsis:
    - Lev.16.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.23
    scripture: tanakh
    name: Tanakh Leviticus 16:23
    ref: Leviticus 16:23
    book: Lev
    section: torah
    chapter: 16
    verse: 23
    ordinal: 3222
    text: And Aaron shall come into the tent of meeting, and shall put off the linen garments, which he put on when he went into the holy place, and shall leave them there.
    translation: JPS 1917
    original: וּבָא אַהֲרֹן אֶל־אֹהֶל מוֹעֵד וּפָשַׁט אֶת־בִּגְדֵי הַבָּד אֲשֶׁר לָבַשׁ בְּבֹאוֹ אֶל־הַקֹּדֶשׁ וְהִנִּיחָם שָׁם׃
    hebrewPlain: ובא אהרן אל אהל מועד ופשט את בגדי הבד אשר לבש בבאו אל הקדש והניחם שם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:23
    kjvOsis:
    - Lev.16.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.24
    scripture: tanakh
    name: Tanakh Leviticus 16:24
    ref: Leviticus 16:24
    book: Lev
    section: torah
    chapter: 16
    verse: 24
    ordinal: 3223
    text: And he shall bathe his flesh in water in a holy place and put on his other vestments, and come forth, and offer his burnt-offering and the burnt-offering of the people, and make atonement for himself and for the people.
    translation: JPS 1917
    original: וְרָחַץ אֶת־בְּשָׂרוֹ בַמַּיִם בְּמָקוֹם קָדוֹשׁ וְלָבַשׁ אֶת־בְּגָדָיו וְיָצָא וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־עֹלַת הָעָם וְכִפֶּר בַּעֲדוֹ וּבְעַד הָעָם׃
    hebrewPlain: ורחץ את בשרו במים במקום קדוש ולבש את בגדיו ויצא ועשה את עלתו ואת עלת העם וכפר בעדו ובעד העם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:24
    kjvOsis:
    - Lev.16.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.25
    scripture: tanakh
    name: Tanakh Leviticus 16:25
    ref: Leviticus 16:25
    book: Lev
    section: torah
    chapter: 16
    verse: 25
    ordinal: 3224
    text: And the fat of the sin-offering shall he make smoke upon the altar.
    translation: JPS 1917
    original: וְאֵת חֵלֶב הַחַטָּאת יַקְטִיר הַמִּזְבֵּחָה׃
    hebrewPlain: ואת חלב החטאת יקטיר המזבחה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:25
    kjvOsis:
    - Lev.16.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.26
    scripture: tanakh
    name: Tanakh Leviticus 16:26
    ref: Leviticus 16:26
    book: Lev
    section: torah
    chapter: 16
    verse: 26
    ordinal: 3225
    text: And he that letteth go the goat for Azazel shall wash his clothes, and bathe his flesh in water, and afterward he may come into the camp.
    translation: JPS 1917
    original: וְהַמְשַׁלֵּחַ אֶת־הַשָּׂעִיר לַעֲזָאזֵל יְכַבֵּס בְּגָדָיו וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם וְאַחֲרֵי־כֵן יָבוֹא אֶל־הַמַּחֲנֶה׃
    hebrewPlain: והמשלח את השעיר לעזאזל יכבס בגדיו ורחץ את בשרו במים ואחרי כן יבוא אל המחנה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:26
    kjvOsis:
    - Lev.16.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.27
    scripture: tanakh
    name: Tanakh Leviticus 16:27
    ref: Leviticus 16:27
    book: Lev
    section: torah
    chapter: 16
    verse: 27
    ordinal: 3226
    text: And the bullock of the sin-offering, and the goat of the sin-offering, whose blood was brought in to make atonement in the holy place, shall be carried forth without the camp; and they shall burn in the fire their skins, and their flesh, and their dung.
    translation: JPS 1917
    original: וְאֵת פַּר הַחַטָּאת וְאֵת שְׂעִיר הַחַטָּאת אֲשֶׁר הוּבָא אֶת־דָּמָם לְכַפֵּר בַּקֹּדֶשׁ יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה וְשָׂרְפוּ בָאֵשׁ אֶת־עֹרֹתָם וְאֶת־בְּשָׂרָם וְאֶת־פִּרְשָׁם׃
    hebrewPlain: ואת פר החטאת ואת שעיר החטאת אשר הובא את דמם לכפר בקדש יוציא אל מחוץ למחנה ושרפו באש את ערתם ואת בשרם ואת פרשם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:27
    kjvOsis:
    - Lev.16.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.28
    scripture: tanakh
    name: Tanakh Leviticus 16:28
    ref: Leviticus 16:28
    book: Lev
    section: torah
    chapter: 16
    verse: 28
    ordinal: 3227
    text: And he that burneth them shall wash his clothes, and bathe his flesh in water, and afterward he may come into the camp.
    translation: JPS 1917
    original: וְהַשֹּׂרֵף אֹתָם יְכַבֵּס בְּגָדָיו וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם וְאַחֲרֵי־כֵן יָבוֹא אֶל־הַמַּחֲנֶה׃
    hebrewPlain: והשרף אתם יכבס בגדיו ורחץ את בשרו במים ואחרי כן יבוא אל המחנה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:28
    kjvOsis:
    - Lev.16.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.29
    scripture: tanakh
    name: Tanakh Leviticus 16:29
    ref: Leviticus 16:29
    book: Lev
    section: torah
    chapter: 16
    verse: 29
    ordinal: 3228
    text: 'And it shall be a statute for ever unto you: in the seventh month, on the tenth day of the month, ye shall afflict your souls, and shall do no manner of work, the home-born, or the stranger that sojourneth among you.'
    translation: JPS 1917
    original: וְהָיְתָה לָכֶם לְחֻקַּת עוֹלָם בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם וְכָל־מְלָאכָה לֹא תַעֲשׂוּ הָאֶזְרָח וְהַגֵּר הַגָּר בְּתוֹכְכֶם׃
    hebrewPlain: והיתה לכם לחקת עולם בחדש השביעי בעשור לחדש תענו את נפשתיכם וכל מלאכה לא תעשו האזרח והגר הגר בתוככם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:29
    kjvOsis:
    - Lev.16.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.30
    scripture: tanakh
    name: Tanakh Leviticus 16:30
    ref: Leviticus 16:30
    book: Lev
    section: torah
    chapter: 16
    verse: 30
    ordinal: 3229
    text: For on this day shall atonement be made for you, to cleanse you; from all your sins shall ye be clean before the LORD.
    translation: JPS 1917
    original: כִּי־בַיּוֹם הַזֶּה יְכַפֵּר עֲלֵיכֶם לְטַהֵר אֶתְכֶם מִכֹּל חַטֹּאתֵיכֶם לִפְנֵי יְהוָה תִּטְהָרוּ׃
    hebrewPlain: כי ביום הזה יכפר עליכם לטהר אתכם מכל חטאתיכם לפני יהוה תטהרו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:30
    kjvOsis:
    - Lev.16.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.31
    scripture: tanakh
    name: Tanakh Leviticus 16:31
    ref: Leviticus 16:31
    book: Lev
    section: torah
    chapter: 16
    verse: 31
    ordinal: 3230
    text: It is a sabbath of solemn rest unto you, and ye shall afflict your souls; it is a statute for ever.
    translation: JPS 1917
    original: שַׁבַּת שַׁבָּתוֹן הִיא לָכֶם וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם חֻקַּת עוֹלָם׃
    hebrewPlain: שבת שבתון היא לכם ועניתם את נפשתיכם חקת עולם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:31
    kjvOsis:
    - Lev.16.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.32
    scripture: tanakh
    name: Tanakh Leviticus 16:32
    ref: Leviticus 16:32
    book: Lev
    section: torah
    chapter: 16
    verse: 32
    ordinal: 3231
    text: And the priest, who shall be anointed and who shall be consecrated to be priest in his father’s stead, shall make the atonement, and shall put on the linen garments, even the holy garments.
    translation: JPS 1917
    original: וְכִפֶּר הַכֹּהֵן אֲשֶׁר־יִמְשַׁח אֹתוֹ וַאֲשֶׁר יְמַלֵּא אֶת־יָדוֹ לְכַהֵן תַּחַת אָבִיו וְלָבַשׁ אֶת־בִּגְדֵי הַבָּד בִּגְדֵי הַקֹּדֶשׁ׃
    hebrewPlain: וכפר הכהן אשר ימשח אתו ואשר ימלא את ידו לכהן תחת אביו ולבש את בגדי הבד בגדי הקדש
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:32
    kjvOsis:
    - Lev.16.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: achrei-mot
- type: TanakhVerse
  data:
    osis: Lev.16.33
    scripture: tanakh
    name: Tanakh Leviticus 16:33
    ref: Leviticus 16:33
    book: Lev
    section: torah
    chapter: 16
    verse: 33
    ordinal: 3232
    text: And he shall make atonement for the most holy place, and he shall make atonement for the tent of meeting and for the altar; and he shall make atonement for the priests and for all the people of the assembly.
    translation: JPS 1917
    original: וְכִפֶּר אֶת־מִקְדַּשׁ הַקֹּדֶשׁ וְאֶת־אֹהֶל מוֹעֵד וְאֶת־הַמִּזְבֵּחַ יְכַפֵּר וְעַל הַכֹּהֲנִים וְעַל־כָּל־עַם הַקָּהָל יְכַפֵּר׃
    hebrewPlain: וכפר את מקדש הקדש ואת אהל מועד ואת המזבח יכפר ועל הכהנים ועל כל עם הקהל יכפר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:33
    kjvOsis:
    - Lev.16.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.16
