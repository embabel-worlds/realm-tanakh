- type: TanakhVerse
  data:
    osis: Lev.25.38
    scripture: tanakh
    name: Tanakh Leviticus 25:38
    ref: Leviticus 25:38
    book: Lev
    section: torah
    chapter: 25
    verse: 38
    ordinal: 3505
    text: I am the LORD your God, who brought you forth out of the land of Egypt, to give you the land of Canaan, to be your God.
    translation: JPS 1917
    original: אֲנִי יְהוָה אֱלֹהֵיכֶם אֲשֶׁר־הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם לָתֵת לָכֶם אֶת־אֶרֶץ כְּנַעַן לִהְיוֹת לָכֶם לֵאלֹהִים׃
    hebrewPlain: אני יהוה אלהיכם אשר הוצאתי אתכם מארץ מצרים לתת לכם את ארץ כנען להיות לכם לאלהים
    parashah: Behar
    kjvRefs:
    - Leviticus 25:38
    kjvOsis:
    - Lev.25.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.39
    scripture: tanakh
    name: Tanakh Leviticus 25:39
    ref: Leviticus 25:39
    book: Lev
    section: torah
    chapter: 25
    verse: 39
    ordinal: 3506
    text: And if thy brother be waxen poor with thee, and sell himself unto thee, thou shalt not make him to serve as a bondservant.
    translation: JPS 1917
    original: וְכִי־יָמוּךְ אָחִיךָ עִמָּךְ וְנִמְכַּר־לָךְ לֹא־תַעֲבֹד בּוֹ עֲבֹדַת עָבֶד׃
    hebrewPlain: וכי ימוך אחיך עמך ונמכר לך לא תעבד בו עבדת עבד
    parashah: Behar
    kjvRefs:
    - Leviticus 25:39
    kjvOsis:
    - Lev.25.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.40
    scripture: tanakh
    name: Tanakh Leviticus 25:40
    ref: Leviticus 25:40
    book: Lev
    section: torah
    chapter: 25
    verse: 40
    ordinal: 3507
    text: As a hired servant, and as a settler, he shall be with thee; he shall serve with thee unto the year of jubilee.
    translation: JPS 1917
    original: כְּשָׂכִיר כְּתוֹשָׁב יִהְיֶה עִמָּךְ עַד־שְׁנַת הַיֹּבֵל יַעֲבֹד עִמָּךְ׃
    hebrewPlain: כשכיר כתושב יהיה עמך עד שנת היבל יעבד עמך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:40
    kjvOsis:
    - Lev.25.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.41
    scripture: tanakh
    name: Tanakh Leviticus 25:41
    ref: Leviticus 25:41
    book: Lev
    section: torah
    chapter: 25
    verse: 41
    ordinal: 3508
    text: Then shall he go out from thee, he and his children with him, and shall return unto his own family, and unto the possession of his fathers shall he return.
    translation: JPS 1917
    original: וְיָצָא מֵעִמָּךְ הוּא וּבָנָיו עִמּוֹ וְשָׁב אֶל־מִשְׁפַּחְתּוֹ וְאֶל־אֲחֻזַּת אֲבֹתָיו יָשׁוּב׃
    hebrewPlain: ויצא מעמך הוא ובניו עמו ושב אל משפחתו ואל אחזת אבתיו ישוב
    parashah: Behar
    kjvRefs:
    - Leviticus 25:41
    kjvOsis:
    - Lev.25.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.42
    scripture: tanakh
    name: Tanakh Leviticus 25:42
    ref: Leviticus 25:42
    book: Lev
    section: torah
    chapter: 25
    verse: 42
    ordinal: 3509
    text: For they are My servants, whom I brought forth out of the land of Egypt; they shall not be sold as bondmen.
    translation: JPS 1917
    original: כִּי־עֲבָדַי הֵם אֲשֶׁר־הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרָיִם לֹא יִמָּכְרוּ מִמְכֶּרֶת עָבֶד׃
    hebrewPlain: כי עבדי הם אשר הוצאתי אתם מארץ מצרים לא ימכרו ממכרת עבד
    parashah: Behar
    kjvRefs:
    - Leviticus 25:42
    kjvOsis:
    - Lev.25.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.43
    scripture: tanakh
    name: Tanakh Leviticus 25:43
    ref: Leviticus 25:43
    book: Lev
    section: torah
    chapter: 25
    verse: 43
    ordinal: 3510
    text: Thou shalt not rule over him with rigour; but shalt fear thy God.
    translation: JPS 1917
    original: לֹא־תִרְדֶּה בוֹ בְּפָרֶךְ וְיָרֵאתָ מֵאֱלֹהֶיךָ׃
    hebrewPlain: לא תרדה בו בפרך ויראת מאלהיך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:43
    kjvOsis:
    - Lev.25.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.44
    scripture: tanakh
    name: Tanakh Leviticus 25:44
    ref: Leviticus 25:44
    book: Lev
    section: torah
    chapter: 25
    verse: 44
    ordinal: 3511
    text: 'And as for thy bondmen, and thy bondmaids, whom thou mayest have: of the nations that are round about you, of them shall ye buy bondmen and bondmaids.'
    translation: JPS 1917
    original: וְעַבְדְּךָ וַאֲמָתְךָ אֲשֶׁר יִהְיוּ־לָךְ מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם מֵהֶם תִּקְנוּ עֶבֶד וְאָמָה׃
    hebrewPlain: ועבדך ואמתך אשר יהיו לך מאת הגוים אשר סביבתיכם מהם תקנו עבד ואמה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:44
    kjvOsis:
    - Lev.25.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.45
    scripture: tanakh
    name: Tanakh Leviticus 25:45
    ref: Leviticus 25:45
    book: Lev
    section: torah
    chapter: 25
    verse: 45
    ordinal: 3512
    text: Moreover of the children of the strangers that do sojourn among you, of them may ye buy, and of their families that are with you, which they have begotten in your land; and they may be your possession.
    translation: JPS 1917
    original: וְגַם מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם מֵהֶם תִּקְנוּ וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם וְהָיוּ לָכֶם לַאֲחֻזָּה׃
    hebrewPlain: וגם מבני התושבים הגרים עמכם מהם תקנו וממשפחתם אשר עמכם אשר הולידו בארצכם והיו לכם לאחזה
    parashah: Behar
    kjvRefs:
    - Leviticus 25:45
    kjvOsis:
    - Lev.25.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.46
    scripture: tanakh
    name: Tanakh Leviticus 25:46
    ref: Leviticus 25:46
    book: Lev
    section: torah
    chapter: 25
    verse: 46
    ordinal: 3513
    text: 'And ye may make them an inheritance for your children after you, to hold for a possession: of them may ye take your bondmen for ever; but over your brethren the children of Israel ye shall not rule, one over another, with rigour.'
    translation: JPS 1917
    original: וְהִתְנַחֲלְתֶּם אֹתָם לִבְנֵיכֶם אַחֲרֵיכֶם לָרֶשֶׁת אֲחֻזָּה לְעֹלָם בָּהֶם תַּעֲבֹדוּ וּבְאַחֵיכֶם בְּנֵי־יִשְׂרָאֵל אִישׁ בְּאָחִיו לֹא־תִרְדֶּה בוֹ בְּפָרֶךְ׃
    hebrewPlain: והתנחלתם אתם לבניכם אחריכם לרשת אחזה לעלם בהם תעבדו ובאחיכם בני ישראל איש באחיו לא תרדה בו בפרך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:46
    kjvOsis:
    - Lev.25.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.47
    scripture: tanakh
    name: Tanakh Leviticus 25:47
    ref: Leviticus 25:47
    book: Lev
    section: torah
    chapter: 25
    verse: 47
    ordinal: 3514
    text: And if a stranger who is a settler with thee be waxen rich, and thy brother be waxen poor beside him, and sell himself unto the stranger who is a settler with thee, or to the offshoot of a stranger’s family,
    translation: JPS 1917
    original: וְכִי תַשִּׂיג יַד גֵּר וְתוֹשָׁב עִמָּךְ וּמָךְ אָחִיךָ עִמּוֹ וְנִמְכַּר לְגֵר תּוֹשָׁב עִמָּךְ אוֹ לְעֵקֶר מִשְׁפַּחַת גֵּר׃
    hebrewPlain: וכי תשיג יד גר ותושב עמך ומך אחיך עמו ונמכר לגר תושב עמך או לעקר משפחת גר
    parashah: Behar
    kjvRefs:
    - Leviticus 25:47
    kjvOsis:
    - Lev.25.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.48
    scripture: tanakh
    name: Tanakh Leviticus 25:48
    ref: Leviticus 25:48
    book: Lev
    section: torah
    chapter: 25
    verse: 48
    ordinal: 3515
    text: after that he is sold he may be redeemed; one of his brethren may redeem him;
    translation: JPS 1917
    original: אַחֲרֵי נִמְכַּר גְּאֻלָּה תִּהְיֶה־לּוֹ אֶחָד מֵאֶחָיו יִגְאָלֶנּוּ׃
    hebrewPlain: אחרי נמכר גאלה תהיה לו אחד מאחיו יגאלנו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:48
    kjvOsis:
    - Lev.25.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.49
    scripture: tanakh
    name: Tanakh Leviticus 25:49
    ref: Leviticus 25:49
    book: Lev
    section: torah
    chapter: 25
    verse: 49
    ordinal: 3516
    text: or his uncle, or his uncle’s son, may redeem him, or any that is nigh of kin unto him of his family may redeem him; or if he be waxen rich, he may redeem himself.
    translation: JPS 1917
    original: אוֹ־דֹדוֹ אוֹ בֶן־דֹּדוֹ יִגְאָלֶנּוּ אוֹ־מִשְּׁאֵר בְּשָׂרוֹ מִמִּשְׁפַּחְתּוֹ יִגְאָלֶנּוּ אוֹ־הִשִּׂיגָה יָדוֹ וְנִגְאָל׃
    hebrewPlain: או דדו או בן דדו יגאלנו או משאר בשרו ממשפחתו יגאלנו או השיגה ידו ונגאל
    parashah: Behar
    kjvRefs:
    - Leviticus 25:49
    kjvOsis:
    - Lev.25.49
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.50
    scripture: tanakh
    name: Tanakh Leviticus 25:50
    ref: Leviticus 25:50
    book: Lev
    section: torah
    chapter: 25
    verse: 50
    ordinal: 3517
    text: And he shall reckon with him that bought him from the year that he sold himself to him unto the year of jubilee; and the price of his sale shall be according unto the number of years; according to the time of a hired servant shall he be with him.
    translation: JPS 1917
    original: וְחִשַּׁב עִם־קֹנֵהוּ מִשְּׁנַת הִמָּכְרוֹ לוֹ עַד שְׁנַת הַיֹּבֵל וְהָיָה כֶּסֶף מִמְכָּרוֹ בְּמִסְפַּר שָׁנִים כִּימֵי שָׂכִיר יִהְיֶה עִמּוֹ׃
    hebrewPlain: וחשב עם קנהו משנת המכרו לו עד שנת היבל והיה כסף ממכרו במספר שנים כימי שכיר יהיה עמו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:50
    kjvOsis:
    - Lev.25.50
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.51
    scripture: tanakh
    name: Tanakh Leviticus 25:51
    ref: Leviticus 25:51
    book: Lev
    section: torah
    chapter: 25
    verse: 51
    ordinal: 3518
    text: If there be yet many years, according unto them he shall give back the price of his redemption out of the money that he was bought for.
    translation: JPS 1917
    original: אִם־עוֹד רַבּוֹת בַּשָּׁנִים לְפִיהֶן יָשִׁיב גְּאֻלָּתוֹ מִכֶּסֶף מִקְנָתוֹ׃
    hebrewPlain: אם עוד רבות בשנים לפיהן ישיב גאלתו מכסף מקנתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:51
    kjvOsis:
    - Lev.25.51
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.52
    scripture: tanakh
    name: Tanakh Leviticus 25:52
    ref: Leviticus 25:52
    book: Lev
    section: torah
    chapter: 25
    verse: 52
    ordinal: 3519
    text: And if there remain but few years unto the year of jubilee, then he shall reckon with him; according unto his years shall he give back the price of his redemption.
    translation: JPS 1917
    original: וְאִם־מְעַט נִשְׁאַר בַּשָּׁנִים עַד־שְׁנַת הַיֹּבֵל וְחִשַּׁב־לוֹ כְּפִי שָׁנָיו יָשִׁיב אֶת־גְּאֻלָּתוֹ׃
    hebrewPlain: ואם מעט נשאר בשנים עד שנת היבל וחשב לו כפי שניו ישיב את גאלתו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:52
    kjvOsis:
    - Lev.25.52
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
