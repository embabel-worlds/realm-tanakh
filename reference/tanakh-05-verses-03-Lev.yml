  data:
    osis: Lev.17.1
    scripture: tanakh
    name: Tanakh Leviticus 17:1
    ref: Leviticus 17:1
    book: Lev
    section: torah
    chapter: 17
    verse: 1
    ordinal: 3234
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 17:1
    kjvOsis:
    - Lev.17.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.17
  - predicate: IN_PORTION
    to:
