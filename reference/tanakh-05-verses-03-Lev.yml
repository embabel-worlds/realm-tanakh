  data:
    osis: Lev.2.13
    scripture: tanakh
    name: Tanakh Leviticus 2:13
    ref: Leviticus 2:13
    book: Lev
    section: torah
    chapter: 2
    verse: 13
    ordinal: 2773
    text: And every meal-offering of thine shalt thou season with salt; neither shalt thou suffer the salt of the covenant of thy God to be lacking from thy meal-offering; with all thy offerings thou shalt offer salt.
    translation: JPS 1917
    original: וְכָל־קָרְבַּן מִנְחָתְךָ בַּמֶּלַח תִּמְלָח וְלֹא תַשְׁבִּית מֶלַח בְּרִית אֱלֹהֶיךָ מֵעַל מִנְחָתֶךָ עַל כָּל־קָרְבָּנְךָ תַּקְרִיב מֶלַח׃
    hebrewPlain: וכל קרבן מנחתך במלח תמלח ולא תשבית מלח ברית אלהיך מעל מנחתך על כל קרבנך תקריב מלח
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:13
    kjvOsis:
    - Lev.2.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.2
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.2.14
    scripture: tanakh
    name: Tanakh Leviticus 2:14
    ref: Leviticus 2:14
    book: Lev
    section: torah
    chapter: 2
    verse: 14
    ordinal: 2774
    text: And if thou bring a meal-offering of first-fruits unto the LORD, thou shalt bring for the meal-offering of thy first-fruits corn in the ear parched with fire, even groats of the fresh ear.
    translation: JPS 1917
    original: וְאִם־תַּקְרִיב מִנְחַת בִּכּוּרִים לַיהוָה אָבִיב קָלוּי בָּאֵשׁ גֶּרֶשׂ כַּרְמֶל תַּקְרִיב אֵת מִנְחַת בִּכּוּרֶיךָ׃
    hebrewPlain: ואם תקריב מנחת בכורים ליהוה אביב קלוי באש גרש כרמל תקריב את מנחת בכוריך
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:14
    kjvOsis:
    - Lev.2.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.2
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.2.15
    scripture: tanakh
    name: Tanakh Leviticus 2:15
    ref: Leviticus 2:15
    book: Lev
    section: torah
    chapter: 2
    verse: 15
    ordinal: 2775
