  data:
    osis: Lev.13.39
    scripture: tanakh
    name: Tanakh Leviticus 13:39
    ref: Leviticus 13:39
    book: Lev
    section: torah
    chapter: 13
    verse: 39
    ordinal: 3089
    text: 'then the priest shall look; and, behold, if the bright spots in the skin of their flesh be of a dull white, it is a tetter, it hath broken out in the skin: he is clean.'
    translation: JPS 1917
    original: וְרָאָה הַכֹּהֵן וְהִנֵּה בְעוֹר־בְּשָׂרָם בֶּהָרֹת כֵּהוֹת לְבָנֹת בֹּהַק הוּא פָּרַח בָּעוֹר טָהוֹר הוּא׃
    hebrewPlain: וראה הכהן והנה בעור בשרם בהרת כהות לבנת בהק הוא פרח בעור טהור הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:39
    kjvOsis:
    - Lev.13.39
  relations:
