  data:
    osis: Lev.22.2
    scripture: tanakh
    name: Tanakh Leviticus 22:2
    ref: Leviticus 22:2
    book: Lev
    section: torah
    chapter: 22
    verse: 2
    ordinal: 3369
    text: 'Speak unto Aaron and to his sons, that they separate themselves from the holy things of the children of Israel, which they hallow unto Me, and that they profane not My holy name: I am the LORD.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו וְיִנָּזְרוּ מִקָּדְשֵׁי בְנֵי־יִשְׂרָאֵל וְלֹא יְחַלְּלוּ אֶת־שֵׁם קָדְשִׁי אֲשֶׁר הֵם מַקְדִּשִׁים לִי אֲנִי יְהוָה׃
    hebrewPlain: דבר אל אהרן ואל בניו וינזרו מקדשי בני ישראל ולא יחללו את שם קדשי אשר הם מקדשים לי אני יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:2
    kjvOsis:
    - Lev.22.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.3
    scripture: tanakh
    name: Tanakh Leviticus 22:3
    ref: Leviticus 22:3
    book: Lev
    section: torah
    chapter: 22
    verse: 3
    ordinal: 3370
    text: 'Say unto them: Whosoever he be of all your seed throughout your generations, that approacheth unto the holy things, which the children of Israel hallow unto the LORD, having his uncleanness upon him, that soul shall be cut off from before Me: I am the LORD.'
    translation: JPS 1917
    original: אֱמֹר אֲלֵהֶם לְדֹרֹתֵיכֶם כָּל־אִישׁ אֲשֶׁר־יִקְרַב מִכָּל־זַרְעֲכֶם אֶל־הַקֳּדָשִׁים אֲשֶׁר יַקְדִּישׁוּ בְנֵי־יִשְׂרָאֵל לַיהוָה וְטֻמְאָתוֹ עָלָיו וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִלְּפָנַי אֲנִי יְהוָה׃
    hebrewPlain: אמר אלהם לדרתיכם כל איש אשר יקרב מכל זרעכם אל הקדשים אשר יקדישו בני ישראל ליהוה וטמאתו עליו ונכרתה הנפש ההוא מלפני אני יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:3
    kjvOsis:
    - Lev.22.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.4
    scripture: tanakh
    name: Tanakh Leviticus 22:4
    ref: Leviticus 22:4
    book: Lev
    section: torah
    chapter: 22
    verse: 4
    ordinal: 3371
    text: What man soever of the seed of Aaron is a leper, or hath an issue, he shall not eat of the holy things, until he be clean. And whoso toucheth any one that is unclean by the dead; or from whomsoever the flow of seed goeth out;
    translation: JPS 1917
    original: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן וְהוּא צָרוּעַ אוֹ זָב בַּקֳּדָשִׁים לֹא יֹאכַל עַד אֲשֶׁר יִטְהָר וְהַנֹּגֵעַ בְּכָל־טְמֵא־נֶפֶשׁ אוֹ אִישׁ אֲשֶׁר־תֵּצֵא מִמֶּנּוּ שִׁכְבַת־זָרַע׃
    hebrewPlain: איש איש מזרע אהרן והוא צרוע או זב בקדשים לא יאכל עד אשר יטהר והנגע בכל טמא נפש או איש אשר תצא ממנו שכבת זרע
    parashah: Emor
    kjvRefs:
    - Leviticus 22:4
    kjvOsis:
    - Lev.22.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.5
    scripture: tanakh
    name: Tanakh Leviticus 22:5
    ref: Leviticus 22:5
    book: Lev
    section: torah
    chapter: 22
    verse: 5
    ordinal: 3372
    text: or whosoever toucheth any swarming thing, whereby he may be made unclean, or a man of whom he may take uncleanness, whatsoever uncleanness he hath;
    translation: JPS 1917
    original: אוֹ־אִישׁ אֲשֶׁר יִגַּע בְּכָל־שֶׁרֶץ אֲשֶׁר יִטְמָא־לוֹ אוֹ בְאָדָם אֲשֶׁר יִטְמָא־לוֹ לְכֹל טֻמְאָתוֹ׃
    hebrewPlain: או איש אשר יגע בכל שרץ אשר יטמא לו או באדם אשר יטמא לו לכל טמאתו
    parashah: Emor
    kjvRefs:
    - Leviticus 22:5
    kjvOsis:
    - Lev.22.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.6
    scripture: tanakh
    name: Tanakh Leviticus 22:6
    ref: Leviticus 22:6
    book: Lev
    section: torah
    chapter: 22
    verse: 6
    ordinal: 3373
    text: the soul that toucheth any such shall be unclean until the even, and shall not eat of the holy things, unless he bathe his flesh in water.
    translation: JPS 1917
    original: נֶפֶשׁ אֲשֶׁר תִּגַּע־בּוֹ וְטָמְאָה עַד־הָעָרֶב וְלֹא יֹאכַל מִן־הַקֳּדָשִׁים כִּי אִם־רָחַץ בְּשָׂרוֹ בַּמָּיִם׃
    hebrewPlain: נפש אשר תגע בו וטמאה עד הערב ולא יאכל מן הקדשים כי אם רחץ בשרו במים
    parashah: Emor
    kjvRefs:
    - Leviticus 22:6
    kjvOsis:
    - Lev.22.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.7
    scripture: tanakh
    name: Tanakh Leviticus 22:7
    ref: Leviticus 22:7
    book: Lev
    section: torah
    chapter: 22
    verse: 7
    ordinal: 3374
    text: And when the sun is down, he shall be clean; and afterward he may eat of the holy things, because it is his bread.
    translation: JPS 1917
    original: וּבָא הַשֶּׁמֶשׁ וְטָהֵר וְאַחַר יֹאכַל מִן־הַקֳּדָשִׁים כִּי לַחְמוֹ הוּא׃
    hebrewPlain: ובא השמש וטהר ואחר יאכל מן הקדשים כי לחמו הוא
    parashah: Emor
    kjvRefs:
    - Leviticus 22:7
    kjvOsis:
    - Lev.22.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.8
    scripture: tanakh
    name: Tanakh Leviticus 22:8
    ref: Leviticus 22:8
    book: Lev
    section: torah
    chapter: 22
    verse: 8
    ordinal: 3375
    text: 'That which dieth of itself, or is torn of beasts, he shall not eat to defile himself therewith: I am the LORD.'
    translation: JPS 1917
    original: נְבֵלָה וּטְרֵפָה לֹא יֹאכַל לְטָמְאָה־בָהּ אֲנִי יְהוָה׃
    hebrewPlain: נבלה וטרפה לא יאכל לטמאה בה אני יהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:8
    kjvOsis:
    - Lev.22.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.9
    scripture: tanakh
    name: Tanakh Leviticus 22:9
    ref: Leviticus 22:9
    book: Lev
    section: torah
    chapter: 22
    verse: 9
    ordinal: 3376
    text: 'They shall therefore keep My charge, lest they bear sin for it, and die therein, if they profane it: I am the LORD who sanctify them.'
    translation: JPS 1917
    original: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי וְלֹא־יִשְׂאוּ עָלָיו חֵטְא וּמֵתוּ בוֹ כִּי יְחַלְּלֻהוּ אֲנִי יְהוָה מְקַדְּשָׁם׃
    hebrewPlain: ושמרו את משמרתי ולא ישאו עליו חטא ומתו בו כי יחללהו אני יהוה מקדשם
    parashah: Emor
    kjvRefs:
    - Leviticus 22:9
    kjvOsis:
    - Lev.22.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.10
    scripture: tanakh
    name: Tanakh Leviticus 22:10
    ref: Leviticus 22:10
    book: Lev
    section: torah
    chapter: 22
    verse: 10
    ordinal: 3377
    text: There shall no common man eat of the holy thing; a tenant of a priest, or a hired servant, shall not eat of the holy thing.
    translation: JPS 1917
    original: וְכָל־זָר לֹא־יֹאכַל קֹדֶשׁ תּוֹשַׁב כֹּהֵן וְשָׂכִיר לֹא־יֹאכַל קֹדֶשׁ׃
    hebrewPlain: וכל זר לא יאכל קדש תושב כהן ושכיר לא יאכל קדש
    parashah: Emor
    kjvRefs:
    - Leviticus 22:10
    kjvOsis:
    - Lev.22.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.11
    scripture: tanakh
    name: Tanakh Leviticus 22:11
    ref: Leviticus 22:11
    book: Lev
    section: torah
    chapter: 22
    verse: 11
    ordinal: 3378
    text: But if a priest buy any soul, the purchase of his money, he may eat of it; and such as are born in his house, they may eat of his bread.
    translation: JPS 1917
    original: וְכֹהֵן כִּי־יִקְנֶה נֶפֶשׁ קִנְיַן כַּסְפּוֹ הוּא יֹאכַל בּוֹ וִילִיד בֵּיתוֹ הֵם יֹאכְלוּ בְלַחְמוֹ׃
    hebrewPlain: וכהן כי יקנה נפש קנין כספו הוא יאכל בו ויליד ביתו הם יאכלו בלחמו
    parashah: Emor
    kjvRefs:
    - Leviticus 22:11
    kjvOsis:
    - Lev.22.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.12
    scripture: tanakh
    name: Tanakh Leviticus 22:12
    ref: Leviticus 22:12
    book: Lev
    section: torah
    chapter: 22
    verse: 12
    ordinal: 3379
    text: And if a priest’s daughter be married unto a common man, she shall not eat of that which is set apart from the holy things.
    translation: JPS 1917
    original: וּבַת־כֹּהֵן כִּי תִהְיֶה לְאִישׁ זָר הִוא בִּתְרוּמַת הַקֳּדָשִׁים לֹא תֹאכֵל׃
    hebrewPlain: ובת כהן כי תהיה לאיש זר הוא בתרומת הקדשים לא תאכל
    parashah: Emor
    kjvRefs:
    - Leviticus 22:12
    kjvOsis:
    - Lev.22.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.13
    scripture: tanakh
    name: Tanakh Leviticus 22:13
    ref: Leviticus 22:13
    book: Lev
    section: torah
    chapter: 22
    verse: 13
    ordinal: 3380
    text: But if a priest’s daughter be a widow, or divorced, and have no child, and is returned unto her father’s house, as in her youth, she may eat of her father’s bread; but there shall no common man eat thereof.
    translation: JPS 1917
    original: וּבַת־כֹּהֵן כִּי תִהְיֶה אַלְמָנָה וּגְרוּשָׁה וְזֶרַע אֵין לָהּ וְשָׁבָה אֶל־בֵּית אָבִיהָ כִּנְעוּרֶיהָ מִלֶּחֶם אָבִיהָ תֹּאכֵל וְכָל־זָר לֹא־יֹאכַל בּוֹ׃
    hebrewPlain: ובת כהן כי תהיה אלמנה וגרושה וזרע אין לה ושבה אל בית אביה כנעוריה מלחם אביה תאכל וכל זר לא יאכל בו
    parashah: Emor
    kjvRefs:
    - Leviticus 22:13
    kjvOsis:
    - Lev.22.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.14
    scripture: tanakh
    name: Tanakh Leviticus 22:14
    ref: Leviticus 22:14
    book: Lev
    section: torah
    chapter: 22
    verse: 14
    ordinal: 3381
    text: And if a man eat of the holy thing through error, then he shall put the fifth part thereof unto it, and shall give unto the priest the holy thing.
    translation: JPS 1917
    original: וְאִישׁ כִּי־יֹאכַל קֹדֶשׁ בִּשְׁגָגָה וְיָסַף חֲמִשִׁיתוֹ עָלָיו וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ׃
    hebrewPlain: ואיש כי יאכל קדש בשגגה ויסף חמשיתו עליו ונתן לכהן את הקדש
    parashah: Emor
    kjvRefs:
    - Leviticus 22:14
    kjvOsis:
    - Lev.22.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.15
    scripture: tanakh
    name: Tanakh Leviticus 22:15
    ref: Leviticus 22:15
    book: Lev
    section: torah
    chapter: 22
    verse: 15
    ordinal: 3382
    text: And they shall not profane the holy things of the children of Israel, which they set apart unto the LORD;
    translation: JPS 1917
    original: וְלֹא יְחַלְּלוּ אֶת־קָדְשֵׁי בְּנֵי יִשְׂרָאֵל אֵת אֲשֶׁר־יָרִימוּ לַיהוָה׃
    hebrewPlain: ולא יחללו את קדשי בני ישראל את אשר ירימו ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:15
    kjvOsis:
    - Lev.22.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.16
    scripture: tanakh
    name: Tanakh Leviticus 22:16
    ref: Leviticus 22:16
    book: Lev
    section: torah
    chapter: 22
    verse: 16
    ordinal: 3383
    text: and so cause them to bear the iniquity that bringeth guilt, when they eat their holy things; for I am the LORD who sanctify them.
    translation: JPS 1917
    original: וְהִשִּׂיאוּ אוֹתָם עֲוֺן אַשְׁמָה בְּאָכְלָם אֶת־קָדְשֵׁיהֶם כִּי אֲנִי יְהוָה מְקַדְּשָׁם׃
    hebrewPlain: והשיאו אותם עון אשמה באכלם את קדשיהם כי אני יהוה מקדשם
    parashah: Emor
    kjvRefs:
    - Leviticus 22:16
    kjvOsis:
    - Lev.22.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.17
    scripture: tanakh
    name: Tanakh Leviticus 22:17
    ref: Leviticus 22:17
    book: Lev
    section: torah
    chapter: 22
    verse: 17
    ordinal: 3384
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Emor
    kjvRefs:
    - Leviticus 22:17
    kjvOsis:
    - Lev.22.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.18
    scripture: tanakh
    name: Tanakh Leviticus 22:18
    ref: Leviticus 22:18
    book: Lev
    section: torah
    chapter: 22
    verse: 18
    ordinal: 3385
    text: 'Speak unto Aaron, and to his sons, and unto all the children of Israel, and say unto them: Whosoever he be of the house of Israel, or of the strangers in Israel, that bringeth his offering, whether it be any of their vows, or any of their free-will-offerings, which are brought unto the LORD for a burnt-offering;'
    translation: JPS 1917
    original: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו וְאֶל כָּל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל וּמִן־הַגֵּר בְּיִשְׂרָאֵל אֲשֶׁר יַקְרִיב קָרְבָּנוֹ לְכָל־נִדְרֵיהֶם וּלְכָל־נִדְבוֹתָם אֲשֶׁר־יַקְרִיבוּ לַיהוָה לְעֹלָה׃
    hebrewPlain: דבר אל אהרן ואל בניו ואל כל בני ישראל ואמרת אלהם איש איש מבית ישראל ומן הגר בישראל אשר יקריב קרבנו לכל נדריהם ולכל נדבותם אשר יקריבו ליהוה לעלה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:18
    kjvOsis:
    - Lev.22.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.19
    scripture: tanakh
    name: Tanakh Leviticus 22:19
    ref: Leviticus 22:19
    book: Lev
    section: torah
    chapter: 22
    verse: 19
    ordinal: 3386
    text: that ye may be accepted, ye shall offer a male without blemish, of the beeves, of the sheep, or of the goats.
    translation: JPS 1917
    original: לִרְצֹנְכֶם תָּמִים זָכָר בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים׃
    hebrewPlain: לרצנכם תמים זכר בבקר בכשבים ובעזים
    parashah: Emor
    kjvRefs:
    - Leviticus 22:19
    kjvOsis:
    - Lev.22.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.20
    scripture: tanakh
    name: Tanakh Leviticus 22:20
    ref: Leviticus 22:20
    book: Lev
    section: torah
    chapter: 22
    verse: 20
    ordinal: 3387
    text: But whatsoever hath a blemish, that shall ye not bring; for it shall not be acceptable for you.
    translation: JPS 1917
    original: כֹּל אֲשֶׁר־בּוֹ מוּם לֹא תַקְרִיבוּ כִּי־לֹא לְרָצוֹן יִהְיֶה לָכֶם׃
    hebrewPlain: כל אשר בו מום לא תקריבו כי לא לרצון יהיה לכם
    parashah: Emor
    kjvRefs:
    - Leviticus 22:20
    kjvOsis:
    - Lev.22.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.21
    scripture: tanakh
    name: Tanakh Leviticus 22:21
    ref: Leviticus 22:21
    book: Lev
    section: torah
    chapter: 22
    verse: 21
    ordinal: 3388
    text: And whosoever bringeth a sacrifice of peace-offerings unto the LORD in fulfilment of a vow clearly uttered, or for a freewill-offering, of the herd or of the flock, it shall be perfect to be accepted; there shall be no blemish therein.
    translation: JPS 1917
    original: וְאִישׁ כִּי־יַקְרִיב זֶבַח־שְׁלָמִים לַיהוָה לְפַלֵּא־נֶדֶר אוֹ לִנְדָבָה בַּבָּקָר אוֹ בַצֹּאן תָּמִים יִהְיֶה לְרָצוֹן כָּל־מוּם לֹא יִהְיֶה־בּוֹ׃
    hebrewPlain: ואיש כי יקריב זבח שלמים ליהוה לפלא נדר או לנדבה בבקר או בצאן תמים יהיה לרצון כל מום לא יהיה בו
    parashah: Emor
    kjvRefs:
    - Leviticus 22:21
    kjvOsis:
    - Lev.22.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.22
    scripture: tanakh
    name: Tanakh Leviticus 22:22
    ref: Leviticus 22:22
    book: Lev
    section: torah
    chapter: 22
    verse: 22
    ordinal: 3389
    text: Blind, or broken, or maimed, or having a wen, or scabbed, or scurvy, ye shall not offer these unto the LORD, nor make an offering by fire of them upon the altar unto the LORD.
    translation: JPS 1917
    original: עַוֶּרֶת אוֹ שָׁבוּר אוֹ־חָרוּץ אוֹ־יַבֶּלֶת אוֹ גָרָב אוֹ יַלֶּפֶת לֹא־תַקְרִיבוּ אֵלֶּה לַיהוָה וְאִשֶּׁה לֹא־תִתְּנוּ מֵהֶם עַל־הַמִּזְבֵּחַ לַיהוָה׃
    hebrewPlain: עורת או שבור או חרוץ או יבלת או גרב או ילפת לא תקריבו אלה ליהוה ואשה לא תתנו מהם על המזבח ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:22
    kjvOsis:
    - Lev.22.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.23
    scripture: tanakh
    name: Tanakh Leviticus 22:23
    ref: Leviticus 22:23
    book: Lev
    section: torah
    chapter: 22
    verse: 23
    ordinal: 3390
    text: Either a bullock or a lamb that hath any thing too long or too short, that mayest thou offer for a freewill-offering; but for a vow it shall not be accepted.
    translation: JPS 1917
    original: וְשׁוֹר וָשֶׂה שָׂרוּעַ וְקָלוּט נְדָבָה תַּעֲשֶׂה אֹתוֹ וּלְנֵדֶר לֹא יֵרָצֶה׃
    hebrewPlain: ושור ושה שרוע וקלוט נדבה תעשה אתו ולנדר לא ירצה
    parashah: Emor
    kjvRefs:
    - Leviticus 22:23
    kjvOsis:
    - Lev.22.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.24
    scripture: tanakh
    name: Tanakh Leviticus 22:24
    ref: Leviticus 22:24
    book: Lev
    section: torah
    chapter: 22
    verse: 24
    ordinal: 3391
    text: That which hath its stones bruised, or crushed, or torn, or cut, ye shall not offer unto the LORD; neither shall ye do thus in your land.
    translation: JPS 1917
    original: וּמָעוּךְ וְכָתוּת וְנָתוּק וְכָרוּת לֹא תַקְרִיבוּ לַיהוָה וּבְאַרְצְכֶם לֹא תַעֲשׂוּ׃
    hebrewPlain: ומעוך וכתות ונתוק וכרות לא תקריבו ליהוה ובארצכם לא תעשו
    parashah: Emor
    kjvRefs:
    - Leviticus 22:24
    kjvOsis:
    - Lev.22.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.22
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.22.25
    scripture: tanakh
    name: Tanakh Leviticus 22:25
    ref: Leviticus 22:25
    book: Lev
    section: torah
    chapter: 22
    verse: 25
    ordinal: 3392
    text: Neither from the hand of a foreigner shall ye offer the bread of your God of any of these, because their corruption is in them, there is a blemish in them; they shall not be accepted for you.
    translation: JPS 1917
