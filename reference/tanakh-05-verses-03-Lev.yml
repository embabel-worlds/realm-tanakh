  data:
    osis: Lev.13.1
    scripture: tanakh
    name: Tanakh Leviticus 13:1
    ref: Leviticus 13:1
    book: Lev
    section: torah
    chapter: 13
    verse: 1
    ordinal: 3051
    text: 'And the LORD spoke unto Moses and unto Aaron, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן לֵאמֹר׃
    hebrewPlain: וידבר יהוה אל משה ואל אהרן לאמר
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:1
    kjvOsis:
    - Lev.13.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
