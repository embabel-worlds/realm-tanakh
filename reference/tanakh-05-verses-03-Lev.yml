- type: TanakhVerse
  data:
    osis: Lev.6.5
    scripture: tanakh
    name: Tanakh Leviticus 6:5
    ref: Leviticus 6:5
    book: Lev
    section: torah
    chapter: 6
    verse: 5
    ordinal: 2859
    text: And the fire upon the altar shall be kept burning thereby, it shall not go out; and the priest shall kindle wood on it every morning; and he shall lay the burnt-offering in order upon it, and shall make smoke thereon the fat of the peace-offerings.
    translation: JPS 1917
    original: וְהָאֵשׁ עַל־הַמִּזְבֵּחַ תּוּקַד־בּוֹ לֹא תִכְבֶּה וּבִעֵר עָלֶיהָ הַכֹּהֵן עֵצִים בַּבֹּקֶר בַּבֹּקֶר וְעָרַךְ עָלֶיהָ הָעֹלָה וְהִקְטִיר עָלֶיהָ חֶלְבֵי הַשְּׁלָמִים׃
    hebrewPlain: והאש על המזבח תוקד בו לא תכבה ובער עליה הכהן עצים בבקר בבקר וערך עליה העלה והקטיר עליה חלבי השלמים
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:12
    kjvOsis:
    - Lev.6.12
