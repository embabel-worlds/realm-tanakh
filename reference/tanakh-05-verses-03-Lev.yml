  data:
    osis: Lev.14.42
    scripture: tanakh
    name: Tanakh Leviticus 14:42
    ref: Leviticus 14:42
    book: Lev
    section: torah
    chapter: 14
    verse: 42
    ordinal: 3151
    text: And they shall take other stones, and put them in the place of those stones; and he shall take other mortar, and shall plaster the house.
    translation: JPS 1917
    original: וְלָקְחוּ אֲבָנִים אֲחֵרוֹת וְהֵבִיאוּ אֶל־תַּחַת הָאֲבָנִים וְעָפָר אַחֵר יִקַּח וְטָח אֶת־הַבָּיִת׃
    hebrewPlain: ולקחו אבנים אחרות והביאו אל תחת האבנים ועפר אחר יקח וטח את הבית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:42
    kjvOsis:
    - Lev.14.42
