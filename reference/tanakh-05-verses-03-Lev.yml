      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.19
    scripture: tanakh
    name: Tanakh Leviticus 7:19
    ref: Leviticus 7:19
    book: Lev
    section: torah
    chapter: 7
    verse: 19
    ordinal: 2896
    text: And the flesh that toucheth any unclean thing shall not be eaten; it shall be burnt with fire. And as for the flesh, every one that is clean may eat thereof.
    translation: JPS 1917
    original: וְהַבָּשָׂר אֲשֶׁר־יִגַּע בְּכָל־טָמֵא לֹא יֵאָכֵל בָּאֵשׁ יִשָּׂרֵף וְהַבָּשָׂר כָּל־טָהוֹר יֹאכַל בָּשָׂר׃
    hebrewPlain: והבשר אשר יגע בכל טמא לא יאכל באש ישרף והבשר כל טהור יאכל בשר
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:19
    kjvOsis:
    - Lev.7.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.20
    scripture: tanakh
    name: Tanakh Leviticus 7:20
    ref: Leviticus 7:20
    book: Lev
    section: torah
    chapter: 7
    verse: 20
    ordinal: 2897
    text: But the soul that eateth of the flesh of the sacrifice of peace-offerings, that pertain unto the LORD, having his uncleanness upon him, that soul shall be cut off from his people.
    translation: JPS 1917
    original: וְהַנֶּפֶשׁ אֲשֶׁר־תֹּאכַל בָּשָׂר מִזֶּבַח הַשְּׁלָמִים אֲשֶׁר לַיהוָה וְטֻמְאָתוֹ עָלָיו וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ׃
    hebrewPlain: והנפש אשר תאכל בשר מזבח השלמים אשר ליהוה וטמאתו עליו ונכרתה הנפש ההוא מעמיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:20
    kjvOsis:
    - Lev.7.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.21
    scripture: tanakh
    name: Tanakh Leviticus 7:21
    ref: Leviticus 7:21
    book: Lev
    section: torah
    chapter: 7
    verse: 21
    ordinal: 2898
    text: And when any one shall touch any unclean thing, whether it be the uncleanness of man, or an unclean beast, or any unclean detestable thing, and eat of the flesh of the sacrifice of peace-offerings, which pertain unto the LORD, that soul shall be cut off from his people.
    translation: JPS 1917
    original: וְנֶפֶשׁ כִּי־תִגַּע בְּכָל־טָמֵא בְּטֻמְאַת אָדָם אוֹ בִּבְהֵמָה טְמֵאָה אוֹ בְּכָל־שֶׁקֶץ טָמֵא וְאָכַל מִבְּשַׂר־זֶבַח הַשְּׁלָמִים אֲשֶׁר לַיהוָה וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ׃
    hebrewPlain: ונפש כי תגע בכל טמא בטמאת אדם או בבהמה טמאה או בכל שקץ טמא ואכל מבשר זבח השלמים אשר ליהוה ונכרתה הנפש ההוא מעמיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:21
    kjvOsis:
    - Lev.7.21
  relations:
