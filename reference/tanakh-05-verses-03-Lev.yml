  data:
    osis: Lev.23.35
    scripture: tanakh
    name: Tanakh Leviticus 23:35
    ref: Leviticus 23:35
    book: Lev
    section: torah
    chapter: 23
    verse: 35
    ordinal: 3435
    text: On the first day shall be a holy convocation; ye shall do no manner of servile work.
    translation: JPS 1917
    original: בַּיּוֹם הָרִאשׁוֹן מִקְרָא־קֹדֶשׁ כָּל־מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ׃
    hebrewPlain: ביום הראשון מקרא קדש כל מלאכת עבדה לא תעשו
    parashah: Emor
    kjvRefs:
    - Leviticus 23:35
    kjvOsis:
