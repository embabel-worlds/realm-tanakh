  data:
    osis: Lev.16.34
    scripture: tanakh
    name: Tanakh Leviticus 16:34
    ref: Leviticus 16:34
    book: Lev
    section: torah
    chapter: 16
    verse: 34
    ordinal: 3233
    text: And this shall be an everlasting statute unto you, to make atonement for the children of Israel because of all their sins once in the year.’ And he did as the LORD commanded Moses.
    translation: JPS 1917
    original: וְהָיְתָה־זֹּאת לָכֶם לְחֻקַּת עוֹלָם לְכַפֵּר עַל־בְּנֵי יִשְׂרָאֵל מִכָּל־חַטֹּאתָם אַחַת בַּשָּׁנָה וַיַּעַשׂ כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: והיתה זאת לכם לחקת עולם לכפר על בני ישראל מכל חטאתם אחת בשנה ויעש כאשר צוה יהוה את משה
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:34
    kjvOsis:
    - Lev.16.34
