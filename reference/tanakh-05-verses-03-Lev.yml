  data:
    osis: Lev.7.29
    scripture: tanakh
    name: Tanakh Leviticus 7:29
    ref: Leviticus 7:29
    book: Lev
    section: torah
    chapter: 7
    verse: 29
    ordinal: 2906
    text: 'Speak unto the children of Israel, saying: He that offereth his sacrifice of peace-offerings unto the LORD shall bring his offering unto the LORD out of his sacrifice of peace-offerings.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר הַמַּקְרִיב אֶת־זֶבַח שְׁלָמָיו לַיהוָה יָבִיא אֶת־קָרְבָּנוֹ לַיהוָה מִזֶּבַח שְׁלָמָיו׃
    hebrewPlain: דבר אל בני ישראל לאמר המקריב את זבח שלמיו ליהוה יביא את קרבנו ליהוה מזבח שלמיו
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:29
    kjvOsis:
    - Lev.7.29
