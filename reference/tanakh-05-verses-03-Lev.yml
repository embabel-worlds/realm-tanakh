  data:
    osis: Lev.14.44
    scripture: tanakh
    name: Tanakh Leviticus 14:44
    ref: Leviticus 14:44
    book: Lev
    section: torah
    chapter: 14
    verse: 44
    ordinal: 3153
    text: 'then the priest shall come in and look; and, behold, if the plague be spread in the house, it is a malignant leprosy in the house: it is unclean.'
    translation: JPS 1917
    original: וּבָא הַכֹּהֵן וְרָאָה וְהִנֵּה פָּשָׂה הַנֶּגַע בַּבָּיִת צָרַעַת מַמְאֶרֶת הִוא בַּבַּיִת טָמֵא הוּא׃
    hebrewPlain: ובא הכהן וראה והנה פשה הנגע בבית צרעת ממארת הוא בבית טמא הוא
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:44
    kjvOsis:
    - Lev.14.44
