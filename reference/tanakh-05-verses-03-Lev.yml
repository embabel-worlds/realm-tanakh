  data:
    osis: Lev.4.12
    scripture: tanakh
    name: Tanakh Leviticus 4:12
    ref: Leviticus 4:12
    book: Lev
    section: torah
    chapter: 4
    verse: 12
    ordinal: 2805
    text: even the whole bullock shall he carry forth without the camp unto a clean place, where the ashes are poured out, and burn it on wood with fire; where the ashes are poured out shall it be burnt.
    translation: JPS 1917
    original: וְהוֹצִיא אֶת־כָּל־הַפָּר אֶל־מִחוּץ לַמַּחֲנֶה אֶל־מָקוֹם טָהוֹר אֶל־שֶׁפֶךְ הַדֶּשֶׁן וְשָׂרַף אֹתוֹ עַל־עֵצִים בָּאֵשׁ עַל־שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף׃
    hebrewPlain: והוציא את כל הפר אל מחוץ למחנה אל מקום טהור אל שפך הדשן ושרף אתו על עצים באש על שפך הדשן ישרף
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:12
    kjvOsis:
    - Lev.4.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
