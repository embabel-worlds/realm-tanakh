    scripture: tanakh
    name: Tanakh Leviticus 2:8
    ref: Leviticus 2:8
    book: Lev
    section: torah
    chapter: 2
    verse: 8
    ordinal: 2768
    text: And thou shalt bring the meal-offering that is made of these things unto the LORD; and it shall be presented unto the priest, and he shall bring it unto the altar.
    translation: JPS 1917
    original: וְהֵבֵאתָ אֶת־הַמִּנְחָה אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה לַיהוָה וְהִקְרִיבָהּ אֶל־הַכֹּהֵן וְהִגִּישָׁהּ אֶל־הַמִּזְבֵּחַ׃
    hebrewPlain: והבאת את המנחה אשר יעשה מאלה ליהוה והקריבה אל הכהן והגישה אל המזבח
    parashah: Vayikra
    kjvRefs:
