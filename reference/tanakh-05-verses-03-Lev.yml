    ref: Leviticus 13:36
    book: Lev
    section: torah
    chapter: 13
    verse: 36
    ordinal: 3086
    text: 'then the priest shall look on him; and, behold, if the scall be spread in the skin, the priest shall not seek for the yellow hair: he is unclean.'
    translation: JPS 1917
    original: וְרָאָהוּ הַכֹּהֵן וְהִנֵּה פָּשָׂה הַנֶּתֶק בָּעוֹר לֹא־יְבַקֵּר הַכֹּהֵן לַשֵּׂעָר הַצָּהֹב טָמֵא הוּא׃
    hebrewPlain: וראהו הכהן והנה פשה הנתק בעור לא יבקר הכהן לשער הצהב טמא הוא
    parashah: Tazria
    kjvRefs:
