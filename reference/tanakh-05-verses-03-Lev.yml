    section: torah
    chapter: 8
    verse: 17
    ordinal: 2932
    text: But the bullock, and its skin, and its flesh, and its dung, were burnt with fire without the camp; as the LORD commanded Moses.
    translation: JPS 1917
    original: וְאֶת־הַפָּר וְאֶת־עֹרוֹ וְאֶת־בְּשָׂרוֹ וְאֶת־פִּרְשׁוֹ שָׂרַף בָּאֵשׁ מִחוּץ לַמַּחֲנֶה כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: ואת הפר ואת ערו ואת בשרו ואת פרשו שרף באש מחוץ למחנה כאשר צוה יהוה את משה
    parashah: Tzav
