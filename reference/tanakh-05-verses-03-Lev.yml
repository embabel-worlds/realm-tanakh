  data:
    osis: Lev.13.41
    scripture: tanakh
    name: Tanakh Leviticus 13:41
    ref: Leviticus 13:41
    book: Lev
    section: torah
    chapter: 13
    verse: 41
    ordinal: 3091
    text: And if his hair be fallen off from the front part of his head, he is forehead-bald; yet is he clean.
    translation: JPS 1917
    original: וְאִם מִפְּאַת פָּנָיו יִמָּרֵט רֹאשׁוֹ גִּבֵּחַ הוּא טָהוֹר הוּא׃
    hebrewPlain: ואם מפאת פניו ימרט ראשו גבח הוא טהור הוא
    parashah: Tazria
    kjvRefs:
