  data:
    osis: Lev.5.23
    scripture: tanakh
    name: Tanakh Leviticus 5:23
    ref: Leviticus 5:23
    book: Lev
    section: torah
    chapter: 5
    verse: 23
    ordinal: 2851
    text: then it shall be, if he hath sinned, and is guilty, that he shall restore that which he took by robbery, or the thing which he hath gotten by oppression, or the deposit which was deposited with him, or the lost thing which he found,
    translation: JPS 1917
    original: וְהָיָה כִּי־יֶחֱטָא וְאָשֵׁם וְהֵשִׁיב אֶת־הַגְּזֵלָה אֲשֶׁר גָּזָל אוֹ אֶת־הָעֹשֶׁק אֲשֶׁר עָשָׁק אוֹ אֶת־הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ אוֹ אֶת־הָאֲבֵדָה אֲשֶׁר מָצָא׃
    hebrewPlain: והיה כי יחטא ואשם והשיב את הגזלה אשר גזל או את העשק אשר עשק או את הפקדון אשר הפקד אתו או את האבדה אשר מצא
    parashah: Vayikra
    kjvRefs:
    - Leviticus 6:4
    kjvOsis:
    - Lev.6.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.24
    scripture: tanakh
    name: Tanakh Leviticus 5:24
    ref: Leviticus 5:24
    book: Lev
    section: torah
    chapter: 5
    verse: 24
    ordinal: 2852
    text: or any thing about which he hath sworn falsely, he shall even restore it in full, and shall add the fifth part more thereto; unto him to whom it appertaineth shall he give it, in the day of his being guilty.
    translation: JPS 1917
    original: אוֹ מִכֹּל אֲשֶׁר־יִשָּׁבַע עָלָיו לַשֶּׁקֶר וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ וַחֲמִשִׁתָיו יֹסֵף עָלָיו לַאֲשֶׁר הוּא לוֹ יִתְּנֶנּוּ בְּיוֹם אַשְׁמָתוֹ׃
    hebrewPlain: או מכל אשר ישבע עליו לשקר ושלם אתו בראשו וחמשתיו יסף עליו לאשר הוא לו יתננו ביום אשמתו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 6:5
    kjvOsis:
    - Lev.6.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
