  data:
    osis: Lev.2.11
    scripture: tanakh
    name: Tanakh Leviticus 2:11
    ref: Leviticus 2:11
    book: Lev
    section: torah
    chapter: 2
    verse: 11
    ordinal: 2771
    text: No meal-offering, which ye shall bring unto the LORD, shall be made with leaven; for ye shall make no leaven, nor any honey, smoke as an offering made by fire unto the LORD.
    translation: JPS 1917
    original: כָּל־הַמִּנְחָה אֲשֶׁר תַּקְרִיבוּ לַיהוָה לֹא תֵעָשֶׂה חָמֵץ כִּי כָל־שְׂאֹר וְכָל־דְּבַשׁ לֹא־תַקְטִירוּ מִמֶּנּוּ אִשֶּׁה לַיהוָה׃
    hebrewPlain: כל המנחה אשר תקריבו ליהוה לא תעשה חמץ כי כל שאר וכל דבש לא תקטירו ממנו אשה ליהוה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:11
    kjvOsis:
    - Lev.2.11
