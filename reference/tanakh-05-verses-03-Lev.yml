  data:
    osis: Lev.9.14
    scripture: tanakh
    name: Tanakh Leviticus 9:14
    ref: Leviticus 9:14
    book: Lev
    section: torah
    chapter: 9
    verse: 14
    ordinal: 2965
    text: And he washed the inwards and the legs, and made them smoke upon the burnt-offering on the altar.
    translation: JPS 1917
    original: וַיִּרְחַץ אֶת־הַקֶּרֶב וְאֶת־הַכְּרָעָיִם וַיַּקְטֵר עַל־הָעֹלָה הַמִּזְבֵּחָה׃
    hebrewPlain: וירחץ את הקרב ואת הכרעים ויקטר על העלה המזבחה
    parashah: Shmini
    kjvRefs:
