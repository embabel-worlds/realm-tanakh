- type: TanakhVerse
  data:
    osis: Lev.15.23
    scripture: tanakh
    name: Tanakh Leviticus 15:23
    ref: Leviticus 15:23
    book: Lev
    section: torah
    chapter: 15
    verse: 23
    ordinal: 3189
    text: And if he be on the bed, or on any thing whereon she sitteth, when he toucheth it, he shall be unclean until the even.
    translation: JPS 1917
    original: וְאִם עַל־הַמִּשְׁכָּב הוּא אוֹ עַל־הַכְּלִי אֲשֶׁר־הִוא יֹשֶׁבֶת־עָלָיו בְּנָגְעוֹ־בוֹ יִטְמָא עַד־הָעָרֶב׃
    hebrewPlain: ואם על המשכב הוא או על הכלי אשר הוא ישבת עליו בנגעו בו יטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:23
    kjvOsis:
    - Lev.15.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
