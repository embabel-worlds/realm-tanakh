    ordinal: 3465
    text: And he that killeth a beast shall make it good; and he that killeth a man shall be put to death.
    translation: JPS 1917
    original: וּמַכֵּה בְהֵמָה יְשַׁלְּמֶנָּה וּמַכֵּה אָדָם יוּמָת׃
    hebrewPlain: ומכה בהמה ישלמנה ומכה אדם יומת
