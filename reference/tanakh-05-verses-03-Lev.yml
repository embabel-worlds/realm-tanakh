  data:
    osis: Lev.13.49
    scripture: tanakh
    name: Tanakh Leviticus 13:49
    ref: Leviticus 13:49
    book: Lev
    section: torah
    chapter: 13
    verse: 49
    ordinal: 3099
    text: If the plague be greenish or reddish in the garment, or in the skin, or in the warp, or in the woof, or in any thing of skin, it is the plague of leprosy, and shall be shown unto the priest.
    translation: JPS 1917
    original: וְהָיָה הַנֶּגַע יְרַקְרַק אוֹ אֲדַמְדָּם בַּבֶּגֶד אוֹ בָעוֹר אוֹ־בַשְּׁתִי אוֹ־בָעֵרֶב אוֹ בְכָל־כְּלִי־עוֹר נֶגַע צָרַעַת הוּא וְהָרְאָה אֶת־הַכֹּהֵן׃
    hebrewPlain: והיה הנגע ירקרק או אדמדם בבגד או בעור או בשתי או בערב או בכל כלי עור נגע צרעת הוא והראה את הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:49
    kjvOsis:
    - Lev.13.49
