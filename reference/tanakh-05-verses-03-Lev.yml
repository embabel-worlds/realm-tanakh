  data:
    osis: Lev.8.4
    scripture: tanakh
    name: Tanakh Leviticus 8:4
    ref: Leviticus 8:4
    book: Lev
    section: torah
    chapter: 8
    verse: 4
    ordinal: 2919
    text: And Moses did as the LORD commanded him; and the congregation was assembled at the door of the tent of meeting.
    translation: JPS 1917
    original: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ וַתִּקָּהֵל הָעֵדָה אֶל־פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: ויעש משה כאשר צוה יהוה אתו ותקהל העדה אל פתח אהל מועד
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:4
    kjvOsis:
    - Lev.8.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
