  data:
    osis: Lev.18.22
    scripture: tanakh
    name: Tanakh Leviticus 18:22
    ref: Leviticus 18:22
    book: Lev
    section: torah
    chapter: 18
    verse: 22
    ordinal: 3271
    text: Thou shalt not lie with mankind, as with womankind; it is abomination.
    translation: JPS 1917
    original: וְאֶת־זָכָר לֹא תִשְׁכַּב מִשְׁכְּבֵי אִשָּׁה תּוֹעֵבָה הִוא׃
    hebrewPlain: ואת זכר לא תשכב משכבי אשה תועבה הוא
    parashah: Achrei Mot
    kjvRefs:
