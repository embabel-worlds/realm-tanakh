  data:
    osis: Lev.14.41
    scripture: tanakh
    name: Tanakh Leviticus 14:41
    ref: Leviticus 14:41
    book: Lev
    section: torah
    chapter: 14
    verse: 41
    ordinal: 3150
    text: And he shall cause the house to be scraped within round about, and they shall pour out the mortar that they scrape off without the city into an unclean place.
    translation: JPS 1917
    original: וְאֶת־הַבַּיִת יַקְצִעַ מִבַּיִת סָבִיב וְשָׁפְכוּ אֶת־הֶעָפָר אֲשֶׁר הִקְצוּ אֶל־מִחוּץ לָעִיר אֶל־מָקוֹם טָמֵא׃
    hebrewPlain: ואת הבית יקצע מבית סביב ושפכו את העפר אשר הקצו אל מחוץ לעיר אל מקום טמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:41
    kjvOsis:
    - Lev.14.41
