    scripture: tanakh
    name: Tanakh Leviticus 19:27
    ref: Leviticus 19:27
    book: Lev
    section: torah
    chapter: 19
    verse: 27
    ordinal: 3306
    text: Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.
    translation: JPS 1917
    original: לֹא תַקִּפוּ פְּאַת רֹאשְׁכֶם וְלֹא תַשְׁחִית אֵת פְּאַת זְקָנֶךָ׃
    hebrewPlain: לא תקפו פאת ראשכם ולא תשחית את פאת זקנך
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:27
    kjvOsis:
    - Lev.19.27
  relations:
