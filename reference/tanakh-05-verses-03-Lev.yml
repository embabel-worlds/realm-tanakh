    scripture: tanakh
    name: Tanakh Leviticus 6:14
    ref: Leviticus 6:14
    book: Lev
    section: torah
    chapter: 6
    verse: 14
    ordinal: 2868
    text: On a griddle it shall be made with oil; when it is soaked, thou shalt bring it in; in broken pieces shalt thou offer the meal-offering for a sweet savour unto the LORD.
    translation: JPS 1917
    original: עַל־מַחֲבַת בַּשֶּׁמֶן תֵּעָשֶׂה מֻרְבֶּכֶת תְּבִיאֶנָּה תֻּפִינֵי מִנְחַת פִּתִּים תַּקְרִיב רֵיחַ־נִיחֹחַ לַיהוָה׃
    hebrewPlain: על מחבת בשמן תעשה מרבכת תביאנה תפיני מנחת פתים תקריב ריח ניחח ליהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:21
    kjvOsis:
    - Lev.6.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
