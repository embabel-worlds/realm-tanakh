  data:
    osis: Lev.21.21
    scripture: tanakh
    name: Tanakh Leviticus 21:21
    ref: Leviticus 21:21
    book: Lev
    section: torah
    chapter: 21
    verse: 21
    ordinal: 3364
    text: no man of the seed of Aaron the priest, that hath a blemish, shall come nigh to offer the offerings of the LORD made by fire; he hath a blemish; he shall not come nigh to offer the bread of his God.
    translation: JPS 1917
    original: כָּל־אִישׁ אֲשֶׁר־בּוֹ מוּם מִזֶּרַע אַהֲרֹן הַכֹּהֵן לֹא יִגַּשׁ לְהַקְרִיב אֶת־אִשֵּׁי יְהוָה מוּם בּוֹ אֵת לֶחֶם אֱלֹהָיו לֹא יִגַּשׁ לְהַקְרִיב׃
    hebrewPlain: כל איש אשר בו מום מזרע אהרן הכהן לא יגש להקריב את אשי יהוה מום בו את לחם אלהיו לא יגש להקריב
    parashah: Emor
    kjvRefs:
    - Leviticus 21:21
    kjvOsis:
    - Lev.21.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.22
    scripture: tanakh
    name: Tanakh Leviticus 21:22
    ref: Leviticus 21:22
    book: Lev
    section: torah
    chapter: 21
    verse: 22
    ordinal: 3365
    text: He may eat the bread of his God, both of the most holy, and of the holy.
    translation: JPS 1917
    original: לֶחֶם אֱלֹהָיו מִקָּדְשֵׁי הַקֳּדָשִׁים וּמִן־הַקֳּדָשִׁים יֹאכֵל׃
    hebrewPlain: לחם אלהיו מקדשי הקדשים ומן הקדשים יאכל
    parashah: Emor
    kjvRefs:
    - Leviticus 21:22
    kjvOsis:
    - Lev.21.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.23
    scripture: tanakh
    name: Tanakh Leviticus 21:23
    ref: Leviticus 21:23
    book: Lev
    section: torah
    chapter: 21
    verse: 23
    ordinal: 3366
    text: Only he shall not go in unto the veil, nor come nigh unto the altar, because he hath a blemish; that he profane not My holy places; for I am the LORD who sanctify them.
    translation: JPS 1917
    original: אַךְ אֶל־הַפָּרֹכֶת לֹא יָבֹא וְאֶל־הַמִּזְבֵּחַ לֹא יִגַּשׁ כִּי־מוּם בּוֹ וְלֹא יְחַלֵּל אֶת־מִקְדָּשַׁי כִּי אֲנִי יְהוָה מְקַדְּשָׁם׃
    hebrewPlain: אך אל הפרכת לא יבא ואל המזבח לא יגש כי מום בו ולא יחלל את מקדשי כי אני יהוה מקדשם
    parashah: Emor
    kjvRefs:
    - Leviticus 21:23
    kjvOsis:
    - Lev.21.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.21
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.21.24
    scripture: tanakh
    name: Tanakh Leviticus 21:24
    ref: Leviticus 21:24
    book: Lev
    section: torah
    chapter: 21
    verse: 24
    ordinal: 3367
    text: So Moses spoke unto Aaron, and to his sons, and unto all the children of Israel.
    translation: JPS 1917
    original: וַיְדַבֵּר מֹשֶׁה אֶל־אַהֲרֹן וְאֶל־בָּנָיו וְאֶל־כָּל־בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: וידבר משה אל אהרן ואל בניו ואל כל בני ישראל
    parashah: Emor
    kjvRefs:
    - Leviticus 21:24
    kjvOsis:
    - Lev.21.24
