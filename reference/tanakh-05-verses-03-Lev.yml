- type: TanakhVerse
  data:
    osis: Lev.4.3
    scripture: tanakh
    name: Tanakh Leviticus 4:3
    ref: Leviticus 4:3
    book: Lev
    section: torah
    chapter: 4
    verse: 3
    ordinal: 2796
    text: if the anointed priest shall sin so as to bring guilt on the people, then let him offer for his sin, which he hath sinned, a young bullock without blemish unto the LORD for a sin-offering.
    translation: JPS 1917
    original: אִם הַכֹּהֵן הַמָּשִׁיחַ יֶחֱטָא לְאַשְׁמַת הָעָם וְהִקְרִיב עַל חַטָּאתוֹ אֲשֶׁר חָטָא פַּר בֶּן־בָּקָר תָּמִים לַיהוָה לְחַטָּאת׃
    hebrewPlain: אם הכהן המשיח יחטא לאשמת העם והקריב על חטאתו אשר חטא פר בן בקר תמים ליהוה לחטאת
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:3
    kjvOsis:
    - Lev.4.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.4
    scripture: tanakh
    name: Tanakh Leviticus 4:4
    ref: Leviticus 4:4
    book: Lev
    section: torah
    chapter: 4
    verse: 4
    ordinal: 2797
    text: And he shall bring the bullock unto the door of the tent of meeting before the LORD; and he shall lay his hand upon the head of the bullock, and kill the bullock before the LORD.
    translation: JPS 1917
    original: וְהֵבִיא אֶת־הַפָּר אֶל־פֶּתַח אֹהֶל מוֹעֵד לִפְנֵי יְהוָה וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁ הַפָּר וְשָׁחַט אֶת־הַפָּר לִפְנֵי יְהוָה׃
    hebrewPlain: והביא את הפר אל פתח אהל מועד לפני יהוה וסמך את ידו על ראש הפר ושחט את הפר לפני יהוה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:4
    kjvOsis:
    - Lev.4.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.5
    scripture: tanakh
    name: Tanakh Leviticus 4:5
    ref: Leviticus 4:5
    book: Lev
    section: torah
    chapter: 4
    verse: 5
    ordinal: 2798
    text: And the anointed priest shall take of the blood of the bullock, and bring it to the tent of meeting.
    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן הַמָּשִׁיחַ מִדַּם הַפָּר וְהֵבִיא אֹתוֹ אֶל־אֹהֶל מוֹעֵד׃
    hebrewPlain: ולקח הכהן המשיח מדם הפר והביא אתו אל אהל מועד
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:5
    kjvOsis:
    - Lev.4.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.6
    scripture: tanakh
    name: Tanakh Leviticus 4:6
    ref: Leviticus 4:6
    book: Lev
    section: torah
    chapter: 4
    verse: 6
    ordinal: 2799
    text: And the priest shall dip his finger in the blood, and sprinkle of the blood seven times before the LORD, in front of the veil of the sanctuary.
    translation: JPS 1917
    original: וְטָבַל הַכֹּהֵן אֶת־אֶצְבָּעוֹ בַּדָּם וְהִזָּה מִן־הַדָּם שֶׁבַע פְּעָמִים לִפְנֵי יְהוָה אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ׃
    hebrewPlain: וטבל הכהן את אצבעו בדם והזה מן הדם שבע פעמים לפני יהוה את פני פרכת הקדש
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:6
    kjvOsis:
    - Lev.4.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.7
    scripture: tanakh
    name: Tanakh Leviticus 4:7
    ref: Leviticus 4:7
    book: Lev
    section: torah
    chapter: 4
    verse: 7
    ordinal: 2800
    text: And the priest shall put of the blood upon the horns of the altar of sweet incense before the LORD, which is in the tent of meeting; and all the remaining blood of the bullock shall he pour out at the base of the altar of burnt-offering, which is at the door of the tent of meeting.
    translation: JPS 1917
    original: וְנָתַן הַכֹּהֵן מִן־הַדָּם עַל־קַרְנוֹת מִזְבַּח קְטֹרֶת הַסַּמִּים לִפְנֵי יְהוָה אֲשֶׁר בְּאֹהֶל מוֹעֵד וְאֵת כָּל־דַּם הַפָּר יִשְׁפֹּךְ אֶל־יְסוֹד מִזְבַּח הָעֹלָה אֲשֶׁר־פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: ונתן הכהן מן הדם על קרנות מזבח קטרת הסמים לפני יהוה אשר באהל מועד ואת כל דם הפר ישפך אל יסוד מזבח העלה אשר פתח אהל מועד
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:7
    kjvOsis:
    - Lev.4.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.8
    scripture: tanakh
    name: Tanakh Leviticus 4:8
    ref: Leviticus 4:8
    book: Lev
    section: torah
    chapter: 4
    verse: 8
    ordinal: 2801
    text: And all the fat of the bullock of the sin-offering he shall take off from it; the fat that covereth the inwards, and all the fat that is upon the inwards,
    translation: JPS 1917
    original: וְאֶת־כָּל־חֵלֶב פַּר הַחַטָּאת יָרִים מִמֶּנּוּ אֶת־הַחֵלֶב הַמְכַסֶּה עַל־הַקֶּרֶב וְאֵת כָּל־הַחֵלֶב אֲשֶׁר עַל־הַקֶּרֶב׃
    hebrewPlain: ואת כל חלב פר החטאת ירים ממנו את החלב המכסה על הקרב ואת כל החלב אשר על הקרב
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:8
    kjvOsis:
    - Lev.4.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.9
    scripture: tanakh
    name: Tanakh Leviticus 4:9
    ref: Leviticus 4:9
    book: Lev
    section: torah
    chapter: 4
    verse: 9
    ordinal: 2802
    text: and the two kidneys, and the fat that is upon them, which is by the loins, and the lobe above the liver, which he shall take away by kidneys,
    translation: JPS 1917
    original: וְאֵת שְׁתֵּי הַכְּלָיֹת וְאֶת־הַחֵלֶב אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל־הַכְּסָלִים וְאֶת־הַיֹּתֶרֶת עַל־הַכָּבֵד עַל־הַכְּלָיוֹת יְסִירֶנָּה׃
    hebrewPlain: ואת שתי הכלית ואת החלב אשר עליהן אשר על הכסלים ואת היתרת על הכבד על הכליות יסירנה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:9
    kjvOsis:
    - Lev.4.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.10
    scripture: tanakh
    name: Tanakh Leviticus 4:10
    ref: Leviticus 4:10
    book: Lev
    section: torah
    chapter: 4
    verse: 10
    ordinal: 2803
    text: as it is taken off from the ox of the sacrifice of peace-offerings; and the priest shall make them smoke upon the altar of burnt-offering.
    translation: JPS 1917
    original: כַּאֲשֶׁר יוּרַם מִשּׁוֹר זֶבַח הַשְּׁלָמִים וְהִקְטִירָם הַכֹּהֵן עַל מִזְבַּח הָעֹלָה׃
    hebrewPlain: כאשר יורם משור זבח השלמים והקטירם הכהן על מזבח העלה
    parashah: Vayikra
    kjvRefs:
