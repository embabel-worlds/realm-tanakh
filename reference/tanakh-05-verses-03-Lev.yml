  data:
    osis: Lev.13.37
    scripture: tanakh
    name: Tanakh Leviticus 13:37
    ref: Leviticus 13:37
    book: Lev
    section: torah
    chapter: 13
    verse: 37
    ordinal: 3087
    text: But if the scall stay in its appearance, and black hair be grown up therein; the scall is healed, he is clean; and the priest shall pronounce him clean.
    translation: JPS 1917
    original: וְאִם־בְּעֵינָיו עָמַד הַנֶּתֶק וְשֵׂעָר שָׁחֹר צָמַח־בּוֹ נִרְפָּא הַנֶּתֶק טָהוֹר הוּא וְטִהֲרוֹ הַכֹּהֵן׃
    hebrewPlain: ואם בעיניו עמד הנתק ושער שחר צמח בו נרפא הנתק טהור הוא וטהרו הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:37
    kjvOsis:
    - Lev.13.37
