  data:
    osis: Lev.6.7
    scripture: tanakh
    name: Tanakh Leviticus 6:7
    ref: Leviticus 6:7
    book: Lev
    section: torah
    chapter: 6
    verse: 7
    ordinal: 2861
    text: 'And this is the law of the meal-offering: the sons of Aaron shall offer it before the LORD, in front of the altar.'
    translation: JPS 1917
    original: וְזֹאת תּוֹרַת הַמִּנְחָה הַקְרֵב אֹתָהּ בְּנֵי־אַהֲרֹן לִפְנֵי יְהוָה אֶל־פְּנֵי הַמִּזְבֵּחַ׃
    hebrewPlain: וזאת תורת המנחה הקרב אתה בני אהרן לפני יהוה אל פני המזבח
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:14
    kjvOsis:
    - Lev.6.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
