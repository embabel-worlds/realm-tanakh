  data:
    osis: Lev.9.16
    scripture: tanakh
    name: Tanakh Leviticus 9:16
    ref: Leviticus 9:16
    book: Lev
    section: torah
    chapter: 9
    verse: 16
    ordinal: 2967
    text: And the burnt-offering was presented; and he offered it according to the ordinance.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־הָעֹלָה וַיַּעֲשֶׂהָ כַּמִּשְׁפָּט׃
    hebrewPlain: ויקרב את העלה ויעשה כמשפט
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:16
    kjvOsis:
    - Lev.9.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
