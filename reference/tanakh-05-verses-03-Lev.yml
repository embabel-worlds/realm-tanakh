- type: TanakhVerse
  data:
    osis: Lev.25.33
    scripture: tanakh
    name: Tanakh Leviticus 25:33
    ref: Leviticus 25:33
    book: Lev
    section: torah
    chapter: 25
    verse: 33
    ordinal: 3500
    text: And if a man purchase of the Levites, then the house that was sold in the city of his possession, shall go out in the jubilee; for the houses of the cities of the Levites are their possession among the children of Israel.
    translation: JPS 1917
    original: וַאֲשֶׁר יִגְאַל מִן־הַלְוִיִּם וְיָצָא מִמְכַּר־בַּיִת וְעִיר אֲחֻזָּתוֹ בַּיֹּבֵל כִּי בָתֵּי עָרֵי הַלְוִיִּם הִוא אֲחֻזָּתָם בְּתוֹךְ בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ואשר יגאל מן הלוים ויצא ממכר בית ועיר אחזתו ביבל כי בתי ערי הלוים הוא אחזתם בתוך בני ישראל
    parashah: Behar
    kjvRefs:
    - Leviticus 25:33
    kjvOsis:
    - Lev.25.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
