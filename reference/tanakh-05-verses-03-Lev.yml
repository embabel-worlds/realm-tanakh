- type: TanakhVerse
  data:
    osis: Lev.27.2
    scripture: tanakh
    name: Tanakh Leviticus 27:2
    ref: Leviticus 27:2
    book: Lev
    section: torah
    chapter: 27
    verse: 2
    ordinal: 3570
    text: 'Speak unto the children of Israel, and say unto them: When a man shall clearly utter a vow of persons unto the LORD, according to thy valuation,'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם אִישׁ כִּי יַפְלִא נֶדֶר בְּעֶרְכְּךָ נְפָשֹׁת לַיהוָה׃
    hebrewPlain: דבר אל בני ישראל ואמרת אלהם איש כי יפלא נדר בערכך נפשת ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:2
    kjvOsis:
    - Lev.27.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.3
    scripture: tanakh
    name: Tanakh Leviticus 27:3
    ref: Leviticus 27:3
    book: Lev
    section: torah
    chapter: 27
    verse: 3
    ordinal: 3571
    text: then thy valuation shall be for the male from twenty years old even unto sixty years old, even thy valuation shall be fifty shekels of silver, after the shekel of the sanctuary.
    translation: JPS 1917
    original: וְהָיָה עֶרְכְּךָ הַזָּכָר מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן־שִׁשִּׁים שָׁנָה וְהָיָה עֶרְכְּךָ חֲמִשִּׁים שֶׁקֶל כֶּסֶף בְּשֶׁקֶל הַקֹּדֶשׁ׃
    hebrewPlain: והיה ערכך הזכר מבן עשרים שנה ועד בן ששים שנה והיה ערכך חמשים שקל כסף בשקל הקדש
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:3
    kjvOsis:
    - Lev.27.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.4
    scripture: tanakh
    name: Tanakh Leviticus 27:4
    ref: Leviticus 27:4
    book: Lev
    section: torah
    chapter: 27
    verse: 4
    ordinal: 3572
    text: And if it be a female, then thy valuation shall be thirty shekels.
    translation: JPS 1917
    original: וְאִם־נְקֵבָה הִוא וְהָיָה עֶרְכְּךָ שְׁלֹשִׁים שָׁקֶל׃
    hebrewPlain: ואם נקבה הוא והיה ערכך שלשים שקל
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:4
    kjvOsis:
    - Lev.27.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.5
    scripture: tanakh
    name: Tanakh Leviticus 27:5
    ref: Leviticus 27:5
    book: Lev
    section: torah
    chapter: 27
    verse: 5
    ordinal: 3573
    text: And if it be from five years old even unto twenty years old, then thy valuation shall be for the male twenty shekels, and for the female ten shekels.
    translation: JPS 1917
    original: וְאִם מִבֶּן־חָמֵשׁ שָׁנִים וְעַד בֶּן־עֶשְׂרִים שָׁנָה וְהָיָה עֶרְכְּךָ הַזָּכָר עֶשְׂרִים שְׁקָלִים וְלַנְּקֵבָה עֲשֶׂרֶת שְׁקָלִים׃
    hebrewPlain: ואם מבן חמש שנים ועד בן עשרים שנה והיה ערכך הזכר עשרים שקלים ולנקבה עשרת שקלים
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:5
    kjvOsis:
    - Lev.27.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.6
    scripture: tanakh
    name: Tanakh Leviticus 27:6
    ref: Leviticus 27:6
    book: Lev
    section: torah
    chapter: 27
    verse: 6
    ordinal: 3574
    text: And if it be from a month old even unto five years old, then thy valuation shall be for the male five shekels of silver, and for the female thy valuation shall be three shekels of silver.
    translation: JPS 1917
    original: וְאִם מִבֶּן־חֹדֶשׁ וְעַד בֶּן־חָמֵשׁ שָׁנִים וְהָיָה עֶרְכְּךָ הַזָּכָר חֲמִשָּׁה שְׁקָלִים כָּסֶף וְלַנְּקֵבָה עֶרְכְּךָ שְׁלֹשֶׁת שְׁקָלִים כָּסֶף׃
    hebrewPlain: ואם מבן חדש ועד בן חמש שנים והיה ערכך הזכר חמשה שקלים כסף ולנקבה ערכך שלשת שקלים כסף
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:6
    kjvOsis:
    - Lev.27.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.7
    scripture: tanakh
    name: Tanakh Leviticus 27:7
    ref: Leviticus 27:7
    book: Lev
    section: torah
    chapter: 27
    verse: 7
    ordinal: 3575
    text: 'And if it be from sixty years old and upward: if it be a male, then thy valuation shall be fifteen shekels, and for the female ten shekels.'
    translation: JPS 1917
    original: וְאִם מִבֶּן־שִׁשִּׁים שָׁנָה וָמַעְלָה אִם־זָכָר וְהָיָה עֶרְכְּךָ חֲמִשָּׁה עָשָׂר שָׁקֶל וְלַנְּקֵבָה עֲשָׂרָה שְׁקָלִים׃
    hebrewPlain: ואם מבן ששים שנה ומעלה אם זכר והיה ערכך חמשה עשר שקל ולנקבה עשרה שקלים
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:7
    kjvOsis:
    - Lev.27.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.8
    scripture: tanakh
    name: Tanakh Leviticus 27:8
    ref: Leviticus 27:8
    book: Lev
    section: torah
    chapter: 27
    verse: 8
    ordinal: 3576
    text: But if he be too poor for thy valuation, then he shall be set before the priest, and the priest shall value him; according to the means of him that vowed shall the priest value him.
    translation: JPS 1917
    original: וְאִם־מָךְ הוּא מֵעֶרְכֶּךָ וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן וְהֶעֱרִיךְ אֹתוֹ הַכֹּהֵן עַל־פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר יַעֲרִיכֶנּוּ הַכֹּהֵן׃
    hebrewPlain: ואם מך הוא מערכך והעמידו לפני הכהן והעריך אתו הכהן על פי אשר תשיג יד הנדר יעריכנו הכהן
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:8
    kjvOsis:
    - Lev.27.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.9
    scripture: tanakh
    name: Tanakh Leviticus 27:9
    ref: Leviticus 27:9
    book: Lev
    section: torah
    chapter: 27
    verse: 9
    ordinal: 3577
    text: And if it be a beast, whereof men bring an offering unto the LORD, all that any man giveth of such unto the LORD shall be holy.
    translation: JPS 1917
    original: וְאִם־בְּהֵמָה אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ לַיהוָה יִהְיֶה־קֹּדֶשׁ׃
    hebrewPlain: ואם בהמה אשר יקריבו ממנה קרבן ליהוה כל אשר יתן ממנו ליהוה יהיה קדש
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:9
    kjvOsis:
    - Lev.27.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.10
    scripture: tanakh
    name: Tanakh Leviticus 27:10
    ref: Leviticus 27:10
    book: Lev
    section: torah
    chapter: 27
    verse: 10
    ordinal: 3578
    text: He shall not alter it, nor change it, a good for a bad, or a bad for a good; and if he shall at all change beast for beast, then both it and that for which it is changed shall be holy.
    translation: JPS 1917
    original: לֹא יַחֲלִיפֶנּוּ וְלֹא־יָמִיר אֹתוֹ טוֹב בְּרָע אוֹ־רַע בְּטוֹב וְאִם־הָמֵר יָמִיר בְּהֵמָה בִּבְהֵמָה וְהָיָה־הוּא וּתְמוּרָתוֹ יִהְיֶה־קֹּדֶשׁ׃
    hebrewPlain: לא יחליפנו ולא ימיר אתו טוב ברע או רע בטוב ואם המר ימיר בהמה בבהמה והיה הוא ותמורתו יהיה קדש
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:10
    kjvOsis:
    - Lev.27.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.11
    scripture: tanakh
    name: Tanakh Leviticus 27:11
    ref: Leviticus 27:11
    book: Lev
    section: torah
    chapter: 27
    verse: 11
    ordinal: 3579
    text: And if it be any unclean beast, of which they may not bring an offering unto the LORD, then he shall set the beast before the priest.
    translation: JPS 1917
    original: וְאִם כָּל־בְּהֵמָה טְמֵאָה אֲשֶׁר לֹא־יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה וְהֶעֱמִיד אֶת־הַבְּהֵמָה לִפְנֵי הַכֹּהֵן׃
    hebrewPlain: ואם כל בהמה טמאה אשר לא יקריבו ממנה קרבן ליהוה והעמיד את הבהמה לפני הכהן
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:11
    kjvOsis:
    - Lev.27.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.12
    scripture: tanakh
    name: Tanakh Leviticus 27:12
    ref: Leviticus 27:12
    book: Lev
    section: torah
    chapter: 27
    verse: 12
    ordinal: 3580
    text: And the priest shall value it, whether it be good or bad; as thou the priest valuest it, so shall it be.
    translation: JPS 1917
    original: וְהֶעֱרִיךְ הַכֹּהֵן אֹתָהּ בֵּין טוֹב וּבֵין רָע כְּעֶרְכְּךָ הַכֹּהֵן כֵּן יִהְיֶה׃
    hebrewPlain: והעריך הכהן אתה בין טוב ובין רע כערכך הכהן כן יהיה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:12
    kjvOsis:
    - Lev.27.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.13
    scripture: tanakh
    name: Tanakh Leviticus 27:13
    ref: Leviticus 27:13
    book: Lev
    section: torah
    chapter: 27
    verse: 13
    ordinal: 3581
    text: But if he will indeed redeem it, then he shall add the fifth part thereof unto thy valuation.
    translation: JPS 1917
    original: וְאִם־גָּאֹל יִגְאָלֶנָּה וְיָסַף חֲמִישִׁתוֹ עַל־עֶרְכֶּךָ׃
    hebrewPlain: ואם גאל יגאלנה ויסף חמישתו על ערכך
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:13
    kjvOsis:
    - Lev.27.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.14
    scripture: tanakh
    name: Tanakh Leviticus 27:14
    ref: Leviticus 27:14
    book: Lev
    section: torah
    chapter: 27
    verse: 14
    ordinal: 3582
    text: And when a man shall sanctify his house to be holy unto the LORD, then the priest shall value it, whether it be good or bad; as the priest shall value it, so shall it stand.
    translation: JPS 1917
    original: וְאִישׁ כִּי־יַקְדִּשׁ אֶת־בֵּיתוֹ קֹדֶשׁ לַיהוָה וְהֶעֱרִיכוֹ הַכֹּהֵן בֵּין טוֹב וּבֵין רָע כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן כֵּן יָקוּם׃
    hebrewPlain: ואיש כי יקדש את ביתו קדש ליהוה והעריכו הכהן בין טוב ובין רע כאשר יעריך אתו הכהן כן יקום
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:14
    kjvOsis:
    - Lev.27.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.15
    scripture: tanakh
    name: Tanakh Leviticus 27:15
    ref: Leviticus 27:15
    book: Lev
    section: torah
    chapter: 27
    verse: 15
    ordinal: 3583
    text: And if he that sanctified it will redeem his house, then he shall add the fifth part of the money of thy valuation unto it, and it shall be his.
    translation: JPS 1917
    original: וְאִם־הַמַּקְדִּישׁ יִגְאַל אֶת־בֵּיתוֹ וְיָסַף חֲמִישִׁית כֶּסֶף־עֶרְכְּךָ עָלָיו וְהָיָה לוֹ׃
    hebrewPlain: ואם המקדיש יגאל את ביתו ויסף חמישית כסף ערכך עליו והיה לו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:15
    kjvOsis:
    - Lev.27.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.16
    scripture: tanakh
    name: Tanakh Leviticus 27:16
    ref: Leviticus 27:16
    book: Lev
    section: torah
    chapter: 27
    verse: 16
    ordinal: 3584
    text: And if a man shall sanctify unto the LORD part of the field of his possession, then thy valuation shall be according to the sowing thereof; the sowing of a homer of barley shall be valued at fifty shekels of silver.
    translation: JPS 1917
    original: וְאִם מִשְּׂדֵה אֲחֻזָּתוֹ יַקְדִּישׁ אִישׁ לַיהוָה וְהָיָה עֶרְכְּךָ לְפִי זַרְעוֹ זֶרַע חֹמֶר שְׂעֹרִים בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף׃
    hebrewPlain: ואם משדה אחזתו יקדיש איש ליהוה והיה ערכך לפי זרעו זרע חמר שערים בחמשים שקל כסף
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:16
    kjvOsis:
    - Lev.27.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.17
    scripture: tanakh
    name: Tanakh Leviticus 27:17
    ref: Leviticus 27:17
    book: Lev
    section: torah
    chapter: 27
    verse: 17
    ordinal: 3585
    text: If he sanctify his field from the year of jubilee, according to thy valuation it shall stand.
    translation: JPS 1917
    original: אִם־מִשְּׁנַת הַיֹּבֵל יַקְדִּישׁ שָׂדֵהוּ כְּעֶרְכְּךָ יָקוּם׃
    hebrewPlain: אם משנת היבל יקדיש שדהו כערכך יקום
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:17
    kjvOsis:
    - Lev.27.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.18
    scripture: tanakh
    name: Tanakh Leviticus 27:18
    ref: Leviticus 27:18
    book: Lev
    section: torah
    chapter: 27
    verse: 18
    ordinal: 3586
    text: But if he sanctify his field after the jubilee, then the priest shall reckon unto him the money according to the years that remain unto the year of jubilee, and an abatement shall be made from thy valuation.
    translation: JPS 1917
    original: וְאִם־אַחַר הַיֹּבֵל יַקְדִּישׁ שָׂדֵהוּ וְחִשַּׁב־לוֹ הַכֹּהֵן אֶת־הַכֶּסֶף עַל־פִּי הַשָּׁנִים הַנּוֹתָרֹת עַד שְׁנַת הַיֹּבֵל וְנִגְרַע מֵעֶרְכֶּךָ׃
    hebrewPlain: ואם אחר היבל יקדיש שדהו וחשב לו הכהן את הכסף על פי השנים הנותרת עד שנת היבל ונגרע מערכך
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:18
    kjvOsis:
    - Lev.27.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.19
    scripture: tanakh
    name: Tanakh Leviticus 27:19
    ref: Leviticus 27:19
    book: Lev
    section: torah
    chapter: 27
    verse: 19
    ordinal: 3587
    text: And if he that sanctified the field will indeed redeem it, then he shall add the fifth part of the money of thy valuation unto it, and it shall be assured to him.
    translation: JPS 1917
    original: וְאִם־גָּאֹל יִגְאַל אֶת־הַשָּׂדֶה הַמַּקְדִּישׁ אֹתוֹ וְיָסַף חֲמִשִׁית כֶּסֶף־עֶרְכְּךָ עָלָיו וְקָם לוֹ׃
    hebrewPlain: ואם גאל יגאל את השדה המקדיש אתו ויסף חמשית כסף ערכך עליו וקם לו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:19
    kjvOsis:
    - Lev.27.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.20
    scripture: tanakh
    name: Tanakh Leviticus 27:20
    ref: Leviticus 27:20
    book: Lev
    section: torah
    chapter: 27
    verse: 20
    ordinal: 3588
    text: And if he will not redeem the field, or if he have sold the field to another man, it shall not be redeemed any more.
    translation: JPS 1917
    original: וְאִם־לֹא יִגְאַל אֶת־הַשָּׂדֶה וְאִם־מָכַר אֶת־הַשָּׂדֶה לְאִישׁ אַחֵר לֹא יִגָּאֵל עוֹד׃
    hebrewPlain: ואם לא יגאל את השדה ואם מכר את השדה לאיש אחר לא יגאל עוד
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:20
    kjvOsis:
    - Lev.27.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.21
    scripture: tanakh
    name: Tanakh Leviticus 27:21
    ref: Leviticus 27:21
    book: Lev
    section: torah
    chapter: 27
    verse: 21
    ordinal: 3589
    text: But the field, when it goeth out in the jubilee, shall be holy unto the LORD, as a field devoted; the possession thereof shall be the priest’s.
    translation: JPS 1917
    original: וְהָיָה הַשָּׂדֶה בְּצֵאתוֹ בַיֹּבֵל קֹדֶשׁ לַיהוָה כִּשְׂדֵה הַחֵרֶם לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ׃
    hebrewPlain: והיה השדה בצאתו ביבל קדש ליהוה כשדה החרם לכהן תהיה אחזתו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:21
    kjvOsis:
    - Lev.27.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.22
    scripture: tanakh
    name: Tanakh Leviticus 27:22
    ref: Leviticus 27:22
    book: Lev
    section: torah
    chapter: 27
    verse: 22
    ordinal: 3590
    text: And if he sanctify unto the LORD a field which he hath bought, which is not of the field of his possession;
    translation: JPS 1917
    original: וְאִם אֶת־שְׂדֵה מִקְנָתוֹ אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ יַקְדִּישׁ לַיהוָה׃
    hebrewPlain: ואם את שדה מקנתו אשר לא משדה אחזתו יקדיש ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:22
    kjvOsis:
    - Lev.27.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.23
    scripture: tanakh
    name: Tanakh Leviticus 27:23
    ref: Leviticus 27:23
    book: Lev
    section: torah
    chapter: 27
    verse: 23
    ordinal: 3591
    text: then the priest shall reckon unto him the worth of thy valuation unto the year of jubilee; and he shall give thy valuation in that day, as a holy thing unto the LORD.
    translation: JPS 1917
    original: וְחִשַּׁב־לוֹ הַכֹּהֵן אֵת מִכְסַת הָעֶרְכְּךָ עַד שְׁנַת הַיֹּבֵל וְנָתַן אֶת־הָעֶרְכְּךָ בַּיּוֹם הַהוּא קֹדֶשׁ לַיהוָה׃
    hebrewPlain: וחשב לו הכהן את מכסת הערכך עד שנת היבל ונתן את הערכך ביום ההוא קדש ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:23
    kjvOsis:
    - Lev.27.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.24
    scripture: tanakh
    name: Tanakh Leviticus 27:24
    ref: Leviticus 27:24
    book: Lev
    section: torah
    chapter: 27
    verse: 24
    ordinal: 3592
    text: In the year of jubilee the field shall return unto him of whom it was bought, even to him to whom the possession of the land belongeth.
    translation: JPS 1917
    original: בִּשְׁנַת הַיּוֹבֵל יָשׁוּב הַשָּׂדֶה לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ לַאֲשֶׁר־לוֹ אֲחֻזַּת הָאָרֶץ׃
    hebrewPlain: בשנת היובל ישוב השדה לאשר קנהו מאתו לאשר לו אחזת הארץ
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:24
    kjvOsis:
    - Lev.27.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.25
    scripture: tanakh
    name: Tanakh Leviticus 27:25
    ref: Leviticus 27:25
    book: Lev
    section: torah
    chapter: 27
    verse: 25
    ordinal: 3593
    text: And all thy valuations shall be according to the shekel of the sanctuary; twenty gerahs shall be the shekel.
    translation: JPS 1917
    original: וְכָל־עֶרְכְּךָ יִהְיֶה בְּשֶׁקֶל הַקֹּדֶשׁ עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל׃
    hebrewPlain: וכל ערכך יהיה בשקל הקדש עשרים גרה יהיה השקל
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:25
    kjvOsis:
    - Lev.27.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.26
    scripture: tanakh
    name: Tanakh Leviticus 27:26
    ref: Leviticus 27:26
    book: Lev
    section: torah
    chapter: 27
    verse: 26
    ordinal: 3594
    text: Howbeit the firstling among beasts, which is born as a firstling to the LORD, no man shall sanctify it; whether it be ox or sheep, it is the LORD’S.
    translation: JPS 1917
    original: אַךְ־בְּכוֹר אֲשֶׁר־יְבֻכַּר לַיהוָה בִּבְהֵמָה לֹא־יַקְדִּישׁ אִישׁ אֹתוֹ אִם־שׁוֹר אִם־שֶׂה לַיהוָה הוּא׃
    hebrewPlain: אך בכור אשר יבכר ליהוה בבהמה לא יקדיש איש אתו אם שור אם שה ליהוה הוא
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:26
    kjvOsis:
    - Lev.27.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.27
    scripture: tanakh
    name: Tanakh Leviticus 27:27
    ref: Leviticus 27:27
    book: Lev
    section: torah
    chapter: 27
    verse: 27
    ordinal: 3595
    text: And if it be of an unclean beast, then he shall ransom it according to thy valuation, and shall add unto it the fifth part thereof; or if it be not redeemed, then it shall be sold according to thy valuation.
    translation: JPS 1917
    original: וְאִם בַּבְּהֵמָה הַטְּמֵאָה וּפָדָה בְעֶרְכֶּךָ וְיָסַף חֲמִשִׁתוֹ עָלָיו וְאִם־לֹא יִגָּאֵל וְנִמְכַּר בְּעֶרְכֶּךָ׃
    hebrewPlain: ואם בבהמה הטמאה ופדה בערכך ויסף חמשתו עליו ואם לא יגאל ונמכר בערכך
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:27
    kjvOsis:
    - Lev.27.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.28
    scripture: tanakh
    name: Tanakh Leviticus 27:28
    ref: Leviticus 27:28
    book: Lev
    section: torah
    chapter: 27
    verse: 28
    ordinal: 3596
    text: Notwithstanding, no devoted thing, that a man may devote unto the LORD of all that he hath, whether of man or beast, or of the field of his possession, shall be sold or redeemed; every devoted thing is most holy unto the LORD.
    translation: JPS 1917
    original: אַךְ־כָּל־חֵרֶם אֲשֶׁר יַחֲרִם אִישׁ לַיהוָה מִכָּל־אֲשֶׁר־לוֹ מֵאָדָם וּבְהֵמָה וּמִשְּׂדֵה אֲחֻזָּתוֹ לֹא יִמָּכֵר וְלֹא יִגָּאֵל כָּל־חֵרֶם קֹדֶשׁ־קָדָשִׁים הוּא לַיהוָה׃
    hebrewPlain: אך כל חרם אשר יחרם איש ליהוה מכל אשר לו מאדם ובהמה ומשדה אחזתו לא ימכר ולא יגאל כל חרם קדש קדשים הוא ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:28
    kjvOsis:
    - Lev.27.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.29
    scripture: tanakh
    name: Tanakh Leviticus 27:29
    ref: Leviticus 27:29
    book: Lev
    section: torah
    chapter: 27
    verse: 29
    ordinal: 3597
    text: None devoted, that may be devoted of men, shall be ransomed; he shall surely be put to death.
    translation: JPS 1917
    original: כָּל־חֵרֶם אֲשֶׁר יָחֳרַם מִן־הָאָדָם לֹא יִפָּדֶה מוֹת יוּמָת׃
    hebrewPlain: כל חרם אשר יחרם מן האדם לא יפדה מות יומת
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:29
    kjvOsis:
    - Lev.27.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.30
    scripture: tanakh
    name: Tanakh Leviticus 27:30
    ref: Leviticus 27:30
    book: Lev
    section: torah
    chapter: 27
    verse: 30
    ordinal: 3598
    text: And all the tithe of the land, whether of the seed of the land, or of the fruit of the tree, is the LORD’S; it is holy unto the LORD.
    translation: JPS 1917
    original: וְכָל־מַעְשַׂר הָאָרֶץ מִזֶּרַע הָאָרֶץ מִפְּרִי הָעֵץ לַיהוָה הוּא קֹדֶשׁ לַיהוָה׃
    hebrewPlain: וכל מעשר הארץ מזרע הארץ מפרי העץ ליהוה הוא קדש ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:30
    kjvOsis:
    - Lev.27.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.31
    scripture: tanakh
    name: Tanakh Leviticus 27:31
    ref: Leviticus 27:31
    book: Lev
    section: torah
    chapter: 27
    verse: 31
    ordinal: 3599
    text: And if a man will redeem aught of his tithe, he shall add unto it the fifth part thereof.
    translation: JPS 1917
    original: וְאִם־גָּאֹל יִגְאַל אִישׁ מִמַּעַשְׂרוֹ חֲמִשִׁיתוֹ יֹסֵף עָלָיו׃
    hebrewPlain: ואם גאל יגאל איש ממעשרו חמשיתו יסף עליו
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:31
    kjvOsis:
    - Lev.27.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.32
    scripture: tanakh
    name: Tanakh Leviticus 27:32
    ref: Leviticus 27:32
    book: Lev
    section: torah
    chapter: 27
    verse: 32
    ordinal: 3600
    text: And all the tithe of the herd or the flock, whatsoever passeth under the rod, the tenth shall be holy unto the LORD.
    translation: JPS 1917
    original: וְכָל־מַעְשַׂר בָּקָר וָצֹאן כֹּל אֲשֶׁר־יַעֲבֹר תַּחַת הַשָּׁבֶט הָעֲשִׂירִי יִהְיֶה־קֹּדֶשׁ לַיהוָה׃
    hebrewPlain: וכל מעשר בקר וצאן כל אשר יעבר תחת השבט העשירי יהיה קדש ליהוה
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:32
    kjvOsis:
    - Lev.27.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.33
    scripture: tanakh
    name: Tanakh Leviticus 27:33
    ref: Leviticus 27:33
    book: Lev
    section: torah
    chapter: 27
    verse: 33
    ordinal: 3601
    text: He shall not inquire whether it be good or bad, neither shall he change it; and if he change it at all, then both it and that for which it is changed shall be holy; it shall not be redeemed.
    translation: JPS 1917
    original: לֹא יְבַקֵּר בֵּין־טוֹב לָרַע וְלֹא יְמִירֶנּוּ וְאִם־הָמֵר יְמִירֶנּוּ וְהָיָה־הוּא וּתְמוּרָתוֹ יִהְיֶה־קֹדֶשׁ לֹא יִגָּאֵל׃
    hebrewPlain: לא יבקר בין טוב לרע ולא ימירנו ואם המר ימירנו והיה הוא ותמורתו יהיה קדש לא יגאל
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:33
    kjvOsis:
    - Lev.27.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
- type: TanakhVerse
  data:
    osis: Lev.27.34
    scripture: tanakh
    name: Tanakh Leviticus 27:34
    ref: Leviticus 27:34
    book: Lev
    section: torah
    chapter: 27
    verse: 34
    ordinal: 3602
    text: These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai.
    translation: JPS 1917
    original: אֵלֶּה הַמִּצְוֺת אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה אֶל־בְּנֵי יִשְׂרָאֵל בְּהַר סִינָי׃
    hebrewPlain: אלה המצות אשר צוה יהוה את משה אל בני ישראל בהר סיני
    parashah: Bechukotai
    kjvRefs:
    - Leviticus 27:34
    kjvOsis:
    - Lev.27.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.27
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: bechukotai
