    ref: Leviticus 21:20
    book: Lev
    section: torah
    chapter: 21
    verse: 20
    ordinal: 3363
    text: or crook-backed, or a dwarf, or that hath his eye overspread, or is scabbed, or scurvy, or hath his stones crushed;
    translation: JPS 1917
    original: אוֹ־גִבֵּן אוֹ־דַק אוֹ תְּבַלֻּל בְּעֵינוֹ אוֹ גָרָב אוֹ יַלֶּפֶת אוֹ מְרוֹחַ אָשֶׁךְ׃
    hebrewPlain: או גבן או דק או תבלל בעינו או גרב או ילפת או מרוח אשך
