  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.28
    scripture: tanakh
    name: Tanakh Leviticus 8:28
    ref: Leviticus 8:28
    book: Lev
    section: torah
    chapter: 8
    verse: 28
    ordinal: 2943
    text: And Moses took them from off their hands, and made them smoke on the altar upon the burnt-offering; they were a consecration-offering for a sweet savour; it was an offering made by fire unto the LORD.
    translation: JPS 1917
    original: וַיִּקַּח מֹשֶׁה אֹתָם מֵעַל כַּפֵּיהֶם וַיַּקְטֵר הַמִּזְבֵּחָה עַל־הָעֹלָה מִלֻּאִים הֵם לְרֵיחַ נִיחֹחַ אִשֶּׁה הוּא לַיהוָה׃
    hebrewPlain: ויקח משה אתם מעל כפיהם ויקטר המזבחה על העלה מלאים הם לריח ניחח אשה הוא ליהוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:28
    kjvOsis:
    - Lev.8.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.29
    scripture: tanakh
    name: Tanakh Leviticus 8:29
    ref: Leviticus 8:29
    book: Lev
    section: torah
    chapter: 8
    verse: 29
    ordinal: 2944
    text: And Moses took the breast, and waved it for a wave-offering before the LORD; it was Moses’ portion of the ram of consecration; as the LORD commanded Moses.
    translation: JPS 1917
    original: וַיִּקַּח מֹשֶׁה אֶת־הֶחָזֶה וַיְנִיפֵהוּ תְנוּפָה לִפְנֵי יְהוָה מֵאֵיל הַמִּלֻּאִים לְמֹשֶׁה הָיָה לְמָנָה כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: ויקח משה את החזה ויניפהו תנופה לפני יהוה מאיל המלאים למשה היה למנה כאשר צוה יהוה את משה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:29
    kjvOsis:
    - Lev.8.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.30
    scripture: tanakh
    name: Tanakh Leviticus 8:30
    ref: Leviticus 8:30
    book: Lev
    section: torah
    chapter: 8
    verse: 30
    ordinal: 2945
    text: And Moses took of the anointing oil, and of the blood which was upon the altar, and sprinkled it upon Aaron, and upon his garments, and upon his sons, and upon his sons’ garments with him, and sanctified Aaron, and his garments, and his sons, and his sons’ garments with him.
    translation: JPS 1917
    original: וַיִּקַּח מֹשֶׁה מִשֶּׁמֶן הַמִּשְׁחָה וּמִן־הַדָּם אֲשֶׁר עַל־הַמִּזְבֵּחַ וַיַּז עַל־אַהֲרֹן עַל־בְּגָדָיו וְעַל־בָּנָיו וְעַל־בִּגְדֵי בָנָיו אִתּוֹ וַיְקַדֵּשׁ אֶת־אַהֲרֹן אֶת־בְּגָדָיו וְאֶת־בָּנָיו וְאֶת־בִּגְדֵי בָנָיו אִתּוֹ׃
    hebrewPlain: ויקח משה משמן המשחה ומן הדם אשר על המזבח ויז על אהרן על בגדיו ועל בניו ועל בגדי בניו אתו ויקדש את אהרן את בגדיו ואת בניו ואת בגדי בניו אתו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:30
    kjvOsis:
    - Lev.8.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.31
    scripture: tanakh
    name: Tanakh Leviticus 8:31
    ref: Leviticus 8:31
    book: Lev
    section: torah
    chapter: 8
    verse: 31
    ordinal: 2946
    text: 'And Moses said unto Aaron and to his sons: ‘Boil the flesh at the door of the tent of meeting; and there eat it and the bread that is in the basket of consecration, as I commanded, saying: Aaron and his sons shall eat it.'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה אֶל־אַהֲרֹן וְאֶל־בָּנָיו בַּשְּׁלוּ אֶת־הַבָּשָׂר פֶּתַח אֹהֶל מוֹעֵד וְשָׁם תֹּאכְלוּ אֹתוֹ וְאֶת־הַלֶּחֶם אֲשֶׁר בְּסַל הַמִּלֻּאִים כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר אַהֲרֹן וּבָנָיו יֹאכְלֻהוּ׃
    hebrewPlain: ויאמר משה אל אהרן ואל בניו בשלו את הבשר פתח אהל מועד ושם תאכלו אתו ואת הלחם אשר בסל המלאים כאשר צויתי לאמר אהרן ובניו יאכלהו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:31
    kjvOsis:
    - Lev.8.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.32
    scripture: tanakh
    name: Tanakh Leviticus 8:32
    ref: Leviticus 8:32
    book: Lev
    section: torah
    chapter: 8
    verse: 32
    ordinal: 2947
    text: And that which remaineth of the flesh and of the bread shall ye burn with fire.
    translation: JPS 1917
    original: וְהַנּוֹתָר בַּבָּשָׂר וּבַלָּחֶם בָּאֵשׁ תִּשְׂרֹפוּ׃
    hebrewPlain: והנותר בבשר ובלחם באש תשרפו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:32
    kjvOsis:
    - Lev.8.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.33
    scripture: tanakh
    name: Tanakh Leviticus 8:33
    ref: Leviticus 8:33
    book: Lev
    section: torah
    chapter: 8
    verse: 33
    ordinal: 2948
    text: And ye shall not go out from the door of the tent of meeting seven days, until the days of your consecration be fulfilled; for He shall consecrate you seven days.
    translation: JPS 1917
    original: וּמִפֶּתַח אֹהֶל מוֹעֵד לֹא תֵצְאוּ שִׁבְעַת יָמִים עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם כִּי שִׁבְעַת יָמִים יְמַלֵּא אֶת־יֶדְכֶם׃
    hebrewPlain: ומפתח אהל מועד לא תצאו שבעת ימים עד יום מלאת ימי מלאיכם כי שבעת ימים ימלא את ידכם
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:33
    kjvOsis:
    - Lev.8.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.34
    scripture: tanakh
    name: Tanakh Leviticus 8:34
    ref: Leviticus 8:34
    book: Lev
    section: torah
    chapter: 8
    verse: 34
    ordinal: 2949
    text: As hath been done this day, so the LORD hath commanded to do, to make atonement for you.
    translation: JPS 1917
    original: כַּאֲשֶׁר עָשָׂה בַּיּוֹם הַזֶּה צִוָּה יְהוָה לַעֲשֹׂת לְכַפֵּר עֲלֵיכֶם׃
    hebrewPlain: כאשר עשה ביום הזה צוה יהוה לעשת לכפר עליכם
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:34
    kjvOsis:
    - Lev.8.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.35
    scripture: tanakh
    name: Tanakh Leviticus 8:35
    ref: Leviticus 8:35
    book: Lev
    section: torah
    chapter: 8
    verse: 35
    ordinal: 2950
    text: And at the door of the tent of meeting shall ye abide day and night seven days, and keep the charge of the LORD, that ye die not; for so I am commanded.
    translation: JPS 1917
    original: וּפֶתַח אֹהֶל מוֹעֵד תֵּשְׁבוּ יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים וּשְׁמַרְתֶּם אֶת־מִשְׁמֶרֶת יְהוָה וְלֹא תָמוּתוּ כִּי־כֵן צֻוֵּיתִי׃
    hebrewPlain: ופתח אהל מועד תשבו יומם ולילה שבעת ימים ושמרתם את משמרת יהוה ולא תמותו כי כן צויתי
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:35
    kjvOsis:
    - Lev.8.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.36
    scripture: tanakh
    name: Tanakh Leviticus 8:36
    ref: Leviticus 8:36
    book: Lev
    section: torah
    chapter: 8
    verse: 36
    ordinal: 2951
    text: And Aaron and his sons did all the things which the LORD commanded by the hand of Moses.
    translation: JPS 1917
    original: וַיַּעַשׂ אַהֲרֹן וּבָנָיו אֵת כָּל־הַדְּבָרִים אֲשֶׁר־צִוָּה יְהוָה בְּיַד־מֹשֶׁה׃
    hebrewPlain: ויעש אהרן ובניו את כל הדברים אשר צוה יהוה ביד משה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:36
    kjvOsis:
    - Lev.8.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.9.1
    scripture: tanakh
    name: Tanakh Leviticus 9:1
    ref: Leviticus 9:1
    book: Lev
    section: torah
    chapter: 9
    verse: 1
    ordinal: 2952
    text: And it came to pass on the eighth day, that Moses called Aaron and his sons, and the elders of Israel;
    translation: JPS 1917
    original: וַיְהִי בַּיּוֹם הַשְּׁמִינִי קָרָא מֹשֶׁה לְאַהֲרֹן וּלְבָנָיו וּלְזִקְנֵי יִשְׂרָאֵל׃
    hebrewPlain: ויהי ביום השמיני קרא משה לאהרן ולבניו ולזקני ישראל
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:1
    kjvOsis:
    - Lev.9.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.2
    scripture: tanakh
    name: Tanakh Leviticus 9:2
    ref: Leviticus 9:2
    book: Lev
    section: torah
    chapter: 9
    verse: 2
    ordinal: 2953
    text: 'and he said unto Aaron: ‘Take thee a bull-calf for a sin-offering, and a ram for a burnt-offering, without blemish, and offer them before the LORD.'
    translation: JPS 1917
    original: וַיֹּאמֶר אֶל־אַהֲרֹן קַח־לְךָ עֵגֶל בֶּן־בָּקָר לְחַטָּאת וְאַיִל לְעֹלָה תְּמִימִם וְהַקְרֵב לִפְנֵי יְהוָה׃
    hebrewPlain: ויאמר אל אהרן קח לך עגל בן בקר לחטאת ואיל לעלה תמימם והקרב לפני יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:2
    kjvOsis:
    - Lev.9.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.3
    scripture: tanakh
    name: Tanakh Leviticus 9:3
    ref: Leviticus 9:3
    book: Lev
    section: torah
    chapter: 9
    verse: 3
    ordinal: 2954
    text: 'And unto the children of Israel thou shalt speak, saying: Take ye a he-goat for a sin-offering; and a calf and a lamb, both of the first year, without blemish, for a burnt-offering;'
    translation: JPS 1917
    original: וְאֶל־בְּנֵי יִשְׂרָאֵל תְּדַבֵּר לֵאמֹר קְחוּ שְׂעִיר־עִזִּים לְחַטָּאת וְעֵגֶל וָכֶבֶשׂ בְּנֵי־שָׁנָה תְּמִימִם לְעֹלָה׃
    hebrewPlain: ואל בני ישראל תדבר לאמר קחו שעיר עזים לחטאת ועגל וכבש בני שנה תמימם לעלה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:3
    kjvOsis:
    - Lev.9.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.4
    scripture: tanakh
    name: Tanakh Leviticus 9:4
    ref: Leviticus 9:4
    book: Lev
    section: torah
    chapter: 9
    verse: 4
    ordinal: 2955
    text: and an ox and a ram for peace-offerings, to sacrifice before the LORD; and a meal-offering mingled with oil; for to-day the LORD appeareth unto you.’
    translation: JPS 1917
    original: וְשׁוֹר וָאַיִל לִשְׁלָמִים לִזְבֹּחַ לִפְנֵי יְהוָה וּמִנְחָה בְּלוּלָה בַשָּׁמֶן כִּי הַיּוֹם יְהוָה נִרְאָה אֲלֵיכֶם׃
    hebrewPlain: ושור ואיל לשלמים לזבח לפני יהוה ומנחה בלולה בשמן כי היום יהוה נראה אליכם
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:4
    kjvOsis:
    - Lev.9.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.5
    scripture: tanakh
    name: Tanakh Leviticus 9:5
    ref: Leviticus 9:5
    book: Lev
    section: torah
    chapter: 9
    verse: 5
    ordinal: 2956
    text: And they brought that which Moses commanded before the tent of meeting; and all the congregation drew near and stood before the LORD.
    translation: JPS 1917
    original: וַיִּקְחוּ אֵת אֲשֶׁר צִוָּה מֹשֶׁה אֶל־פְּנֵי אֹהֶל מוֹעֵד וַיִּקְרְבוּ כָּל־הָעֵדָה וַיַּעַמְדוּ לִפְנֵי יְהוָה׃
    hebrewPlain: ויקחו את אשר צוה משה אל פני אהל מועד ויקרבו כל העדה ויעמדו לפני יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:5
    kjvOsis:
    - Lev.9.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.6
    scripture: tanakh
    name: Tanakh Leviticus 9:6
    ref: Leviticus 9:6
    book: Lev
    section: torah
    chapter: 9
    verse: 6
    ordinal: 2957
    text: 'And Moses said: ‘This is the thing which the LORD commanded that ye should do; that the glory of the LORD may appear unto you.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה זֶה הַדָּבָר אֲשֶׁר־צִוָּה יְהוָה תַּעֲשׂוּ וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה׃
    hebrewPlain: ויאמר משה זה הדבר אשר צוה יהוה תעשו וירא אליכם כבוד יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:6
    kjvOsis:
    - Lev.9.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.7
    scripture: tanakh
    name: Tanakh Leviticus 9:7
    ref: Leviticus 9:7
    book: Lev
    section: torah
    chapter: 9
    verse: 7
    ordinal: 2958
    text: 'And Moses said unto Aaron: ‘Draw near unto the altar, and offer thy sin-offering, and thy burnt-offering, and make atonement for thyself, and for the people; and present the offering of the people, and make atonement for them; as the LORD commanded.’'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה אֶל־אַהֲרֹן קְרַב אֶל־הַמִּזְבֵּחַ וַעֲשֵׂה אֶת־חַטָּאתְךָ וְאֶת־עֹלָתֶךָ וְכַפֵּר בַּעַדְךָ וּבְעַד הָעָם וַעֲשֵׂה אֶת־קָרְבַּן הָעָם וְכַפֵּר בַּעֲדָם כַּאֲשֶׁר צִוָּה יְהוָה׃
    hebrewPlain: ויאמר משה אל אהרן קרב אל המזבח ועשה את חטאתך ואת עלתך וכפר בעדך ובעד העם ועשה את קרבן העם וכפר בעדם כאשר צוה יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:7
    kjvOsis:
    - Lev.9.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.8
    scripture: tanakh
    name: Tanakh Leviticus 9:8
    ref: Leviticus 9:8
    book: Lev
    section: torah
    chapter: 9
    verse: 8
    ordinal: 2959
    text: So Aaron drew near unto the altar, and slew the calf of the sin-offering, which was for himself.
    translation: JPS 1917
    original: וַיִּקְרַב אַהֲרֹן אֶל־הַמִּזְבֵּחַ וַיִּשְׁחַט אֶת־עֵגֶל הַחַטָּאת אֲשֶׁר־לוֹ׃
    hebrewPlain: ויקרב אהרן אל המזבח וישחט את עגל החטאת אשר לו
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:8
    kjvOsis:
    - Lev.9.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.9
    scripture: tanakh
    name: Tanakh Leviticus 9:9
    ref: Leviticus 9:9
    book: Lev
    section: torah
    chapter: 9
    verse: 9
    ordinal: 2960
    text: And the sons of Aaron presented the blood unto him; and he dipped his finger in the blood, and put it upon the horns of the altar, and poured out the blood at the base of the altar.
    translation: JPS 1917
    original: וַיַּקְרִבוּ בְּנֵי אַהֲרֹן אֶת־הַדָּם אֵלָיו וַיִּטְבֹּל אֶצְבָּעוֹ בַּדָּם וַיִּתֵּן עַל־קַרְנוֹת הַמִּזְבֵּחַ וְאֶת־הַדָּם יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ׃
    hebrewPlain: ויקרבו בני אהרן את הדם אליו ויטבל אצבעו בדם ויתן על קרנות המזבח ואת הדם יצק אל יסוד המזבח
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:9
    kjvOsis:
    - Lev.9.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.10
    scripture: tanakh
    name: Tanakh Leviticus 9:10
    ref: Leviticus 9:10
    book: Lev
    section: torah
    chapter: 9
    verse: 10
    ordinal: 2961
    text: But the fat, and the kidneys, and the lobe of the liver of the sin-offering, he made smoke upon the altar; as the LORD commanded Moses.
    translation: JPS 1917
    original: וְאֶת־הַחֵלֶב וְאֶת־הַכְּלָיֹת וְאֶת־הַיֹּתֶרֶת מִן־הַכָּבֵד מִן־הַחַטָּאת הִקְטִיר הַמִּזְבֵּחָה כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: ואת החלב ואת הכלית ואת היתרת מן הכבד מן החטאת הקטיר המזבחה כאשר צוה יהוה את משה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:10
    kjvOsis:
    - Lev.9.10
