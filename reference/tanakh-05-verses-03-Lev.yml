  data:
    osis: Lev.4.11
    scripture: tanakh
    name: Tanakh Leviticus 4:11
    ref: Leviticus 4:11
    book: Lev
    section: torah
    chapter: 4
    verse: 11
    ordinal: 2804
    text: But the skin of the bullock, and all its flesh, with its head, and with its legs, and its inwards, and its dung,
    translation: JPS 1917
    original: וְאֶת־עוֹר הַפָּר וְאֶת־כָּל־בְּשָׂרוֹ עַל־רֹאשׁוֹ וְעַל־כְּרָעָיו וְקִרְבּוֹ וּפִרְשׁוֹ׃
    hebrewPlain: ואת עור הפר ואת כל בשרו על ראשו ועל כרעיו וקרבו ופרשו
    parashah: Vayikra
    kjvRefs:
