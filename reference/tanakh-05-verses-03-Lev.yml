  data:
    osis: Lev.24.3
    scripture: tanakh
    name: Tanakh Leviticus 24:3
    ref: Leviticus 24:3
    book: Lev
    section: torah
    chapter: 24
    verse: 3
    ordinal: 3447
    text: Without the veil of the testimony, in the tent of meeting, shall Aaron order it from evening to morning before the LORD continually; it shall be a statute for ever throughout your generations.
    translation: JPS 1917
    original: מִחוּץ לְפָרֹכֶת הָעֵדֻת בְּאֹהֶל מוֹעֵד יַעֲרֹךְ אֹתוֹ אַהֲרֹן מֵעֶרֶב עַד־בֹּקֶר לִפְנֵי יְהוָה תָּמִיד חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם׃
    hebrewPlain: מחוץ לפרכת העדת באהל מועד יערך אתו אהרן מערב עד בקר לפני יהוה תמיד חקת עולם לדרתיכם
    parashah: Emor
    kjvRefs:
    - Leviticus 24:3
    kjvOsis:
    - Lev.24.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.24.4
    scripture: tanakh
    name: Tanakh Leviticus 24:4
    ref: Leviticus 24:4
    book: Lev
    section: torah
    chapter: 24
    verse: 4
    ordinal: 3448
    text: He shall order the lamps upon the pure candlestick before the LORD continually.
    translation: JPS 1917
    original: עַל הַמְּנֹרָה הַטְּהֹרָה יַעֲרֹךְ אֶת־הַנֵּרוֹת לִפְנֵי יְהוָה תָּמִיד׃
    hebrewPlain: על המנרה הטהרה יערך את הנרות לפני יהוה תמיד
    parashah: Emor
    kjvRefs:
    - Leviticus 24:4
    kjvOsis:
    - Lev.24.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.24
  - predicate: IN_PORTION
