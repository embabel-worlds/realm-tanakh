  data:
    osis: Lev.15.2
    scripture: tanakh
    name: Tanakh Leviticus 15:2
    ref: Leviticus 15:2
    book: Lev
    section: torah
    chapter: 15
    verse: 2
    ordinal: 3168
    text: 'Speak unto the children of Israel, and say unto them: When any man hath an issue out of his flesh, his issue is unclean.'
    translation: JPS 1917
    original: דַּבְּרוּ אֶל־בְּנֵי יִשְׂרָאֵל וַאֲמַרְתֶּם אֲלֵהֶם אִישׁ אִישׁ כִּי יִהְיֶה זָב מִבְּשָׂרוֹ זוֹבוֹ טָמֵא הוּא׃
    hebrewPlain: דברו אל בני ישראל ואמרתם אלהם איש איש כי יהיה זב מבשרו זובו טמא הוא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:2
    kjvOsis:
