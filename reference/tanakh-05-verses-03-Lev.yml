- type: TanakhVerse
  data:
    osis: Lev.6.9
    scripture: tanakh
    name: Tanakh Leviticus 6:9
    ref: Leviticus 6:9
    book: Lev
    section: torah
    chapter: 6
    verse: 9
    ordinal: 2863
    text: And that which is left thereof shall Aaron and his sons eat; it shall be eaten without leaven in a holy place; in the court of the tent of meeting they shall eat it.
    translation: JPS 1917
    original: וְהַנּוֹתֶרֶת מִמֶּנָּה יֹאכְלוּ אַהֲרֹן וּבָנָיו מַצּוֹת תֵּאָכֵל בְּמָקוֹם קָדֹשׁ בַּחֲצַר אֹהֶל־מוֹעֵד יֹאכְלוּהָ׃
    hebrewPlain: והנותרת ממנה יאכלו אהרן ובניו מצות תאכל במקום קדש בחצר אהל מועד יאכלוה
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:16
    kjvOsis:
    - Lev.6.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.6.10
    scripture: tanakh
    name: Tanakh Leviticus 6:10
    ref: Leviticus 6:10
    book: Lev
    section: torah
    chapter: 6
    verse: 10
    ordinal: 2864
    text: It shall not be baked with leaven. I have given it as their portion of My offerings made by fire; it is most holy, as the sin-offering, and as the guilt-offering.
    translation: JPS 1917
    original: לֹא תֵאָפֶה חָמֵץ חֶלְקָם נָתַתִּי אֹתָהּ מֵאִשָּׁי קֹדֶשׁ קָדָשִׁים הִוא כַּחַטָּאת וְכָאָשָׁם׃
    hebrewPlain: לא תאפה חמץ חלקם נתתי אתה מאשי קדש קדשים הוא כחטאת וכאשם
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:17
    kjvOsis:
    - Lev.6.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.6.11
    scripture: tanakh
    name: Tanakh Leviticus 6:11
    ref: Leviticus 6:11
    book: Lev
    section: torah
    chapter: 6
    verse: 11
    ordinal: 2865
    text: Every male among the children of Aaron may eat of it, as a due for ever throughout your generations, from the offerings of the LORD made by fire; whatsoever toucheth them shall be holy.
    translation: JPS 1917
    original: כָּל־זָכָר בִּבְנֵי אַהֲרֹן יֹאכֲלֶנָּה חָק־עוֹלָם לְדֹרֹתֵיכֶם מֵאִשֵּׁי יְהוָה כֹּל אֲשֶׁר־יִגַּע בָּהֶם יִקְדָּשׁ׃
    hebrewPlain: כל זכר בבני אהרן יאכלנה חק עולם לדרתיכם מאשי יהוה כל אשר יגע בהם יקדש
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:18
    kjvOsis:
