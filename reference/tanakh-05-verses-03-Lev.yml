    translation: JPS 1917
    original: וְאֶת־הַבָּשָׂר וְאֶת־הָעוֹר שָׂרַף בָּאֵשׁ מִחוּץ לַמַּחֲנֶה׃
    hebrewPlain: ואת הבשר ואת העור שרף באש מחוץ למחנה
    parashah: Shmini
    kjvRefs:
