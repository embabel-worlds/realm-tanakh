    section: torah
    chapter: 11
    verse: 30
    ordinal: 3025
    text: and the gecko, and the land-crocodile, and the lizard, and the sand-lizard, and the chameleon.
    translation: JPS 1917
    original: וְהָאֲנָקָה וְהַכֹּחַ וְהַלְּטָאָה וְהַחֹמֶט וְהַתִּנְשָׁמֶת׃
