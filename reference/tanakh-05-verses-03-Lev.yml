    name: Tanakh Leviticus 5:21
    ref: Leviticus 5:21
    book: Lev
    section: torah
    chapter: 5
    verse: 21
    ordinal: 2849
    text: If any one sin, and commit a trespass against the LORD, and deal falsely with his neighbour in a matter of deposit, or of pledge, or of robbery, or have oppressed his neighbour;
    translation: JPS 1917
    original: נֶפֶשׁ כִּי תֶחֱטָא וּמָעֲלָה מַעַל בַּיהוָה וְכִחֵשׁ בַּעֲמִיתוֹ בְּפִקָּדוֹן אוֹ־בִתְשׂוּמֶת יָד אוֹ בְגָזֵל אוֹ עָשַׁק אֶת־עֲמִיתוֹ׃
    hebrewPlain: נפש כי תחטא ומעלה מעל ביהוה וכחש בעמיתו בפקדון או בתשומת יד או בגזל או עשק את עמיתו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 6:2
