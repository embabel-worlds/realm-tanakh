  data:
    osis: Lev.23.38
    scripture: tanakh
    name: Tanakh Leviticus 23:38
    ref: Leviticus 23:38
    book: Lev
    section: torah
    chapter: 23
    verse: 38
    ordinal: 3438
    text: beside the sabbaths of the LORD, and beside your gifts, and beside all your vows, and beside all your freewill-offerings, which ye give unto the LORD.
    translation: JPS 1917
    original: מִלְּבַד שַׁבְּתֹת יְּהוָה וּמִלְּבַד מַתְּנוֹתֵיכֶם וּמִלְּבַד כָּל־נִדְרֵיכֶם וּמִלְּבַד כָּל־נִדְבוֹתֵיכֶם אֲשֶׁר תִּתְּנוּ לַיהוָה׃
    hebrewPlain: מלבד שבתת יהוה ומלבד מתנותיכם ומלבד כל נדריכם ומלבד כל נדבותיכם אשר תתנו ליהוה
    parashah: Emor
    kjvRefs:
    - Leviticus 23:38
    kjvOsis:
    - Lev.23.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
