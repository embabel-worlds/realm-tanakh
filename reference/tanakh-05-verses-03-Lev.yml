  data:
    osis: Lev.11.32
    scripture: tanakh
    name: Tanakh Leviticus 11:32
    ref: Leviticus 11:32
    book: Lev
    section: torah
    chapter: 11
    verse: 32
    ordinal: 3027
    text: And upon whatsoever any of them, when they are dead, doth fall, it shall be unclean; whether it be any vessel of wood, or raiment, or skin, or sack, whatsoever vessel it be, wherewith any work is done, it must be put into water, and it shall be unclean until the even; then shall it be clean.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר־יִפֹּל־עָלָיו מֵהֶם בְּמֹתָם יִטְמָא מִכָּל־כְּלִי־עֵץ אוֹ בֶגֶד אוֹ־עוֹר אוֹ שָׂק כָּל־כְּלִי אֲשֶׁר־יֵעָשֶׂה מְלָאכָה בָּהֶם בַּמַּיִם יוּבָא וְטָמֵא עַד־הָעֶרֶב וְטָהֵר׃
    hebrewPlain: וכל אשר יפל עליו מהם במתם יטמא מכל כלי עץ או בגד או עור או שק כל כלי אשר יעשה מלאכה בהם במים יובא וטמא עד הערב וטהר
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:32
    kjvOsis:
    - Lev.11.32
