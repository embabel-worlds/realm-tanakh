    name: Tanakh Leviticus 2:5
    ref: Leviticus 2:5
    book: Lev
    section: torah
    chapter: 2
    verse: 5
    ordinal: 2765
    text: And if thy offering be a meal-offering baked on a griddle, it shall be of fine flour unleavened, mingled with oil.
    translation: JPS 1917
    original: וְאִם־מִנְחָה עַל־הַמַּחֲבַת קָרְבָּנֶךָ סֹלֶת בְּלוּלָה בַשֶּׁמֶן מַצָּה תִהְיֶה׃
    hebrewPlain: ואם מנחה על המחבת קרבנך סלת בלולה בשמן מצה תהיה
    parashah: Vayikra
    kjvRefs:
