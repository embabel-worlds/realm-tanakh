  data:
    osis: Lev.2.1
    scripture: tanakh
    name: Tanakh Leviticus 2:1
    ref: Leviticus 2:1
    book: Lev
    section: torah
    chapter: 2
    verse: 1
    ordinal: 2761
    text: And when any one bringeth a meal-offering unto the LORD, his offering shall be of fine flour; and he shall pour oil upon it, and put frankincense thereon.
    translation: JPS 1917
    original: וְנֶפֶשׁ כִּי־תַקְרִיב קָרְבַּן מִנְחָה לַיהוָה סֹלֶת יִהְיֶה קָרְבָּנוֹ וְיָצַק עָלֶיהָ שֶׁמֶן וְנָתַן עָלֶיהָ לְבֹנָה׃
    hebrewPlain: ונפש כי תקריב קרבן מנחה ליהוה סלת יהיה קרבנו ויצק עליה שמן ונתן עליה לבנה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:1
    kjvOsis:
    - Lev.2.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.2
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
