    original: וְאִם־מִן־הַצֹּאן קָרְבָּנוֹ מִן־הַכְּשָׂבִים אוֹ מִן־הָעִזִּים לְעֹלָה זָכָר תָּמִים יַקְרִיבֶנּוּ׃
    hebrewPlain: ואם מן הצאן קרבנו מן הכשבים או מן העזים לעלה זכר תמים יקריבנו
