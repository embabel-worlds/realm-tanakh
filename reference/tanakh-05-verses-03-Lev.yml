    scripture: tanakh
    name: Tanakh Leviticus 8:19
    ref: Leviticus 8:19
    book: Lev
    section: torah
    chapter: 8
    verse: 19
    ordinal: 2934
    text: And when it was killed, Moses dashed the blood against the altar round about.
    translation: JPS 1917
    original: וַיִּשְׁחָט וַיִּזְרֹק מֹשֶׁה אֶת־הַדָּם עַל־הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: וישחט ויזרק משה את הדם על המזבח סביב
