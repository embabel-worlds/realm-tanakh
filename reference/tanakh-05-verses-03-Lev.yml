  data:
    osis: Lev.14.45
    scripture: tanakh
    name: Tanakh Leviticus 14:45
    ref: Leviticus 14:45
    book: Lev
    section: torah
    chapter: 14
    verse: 45
    ordinal: 3154
    text: And he shall break down the house, the stones of it, and the timber thereof, and all the mortar of the house; and he shall carry them forth out of the city into an unclean place.
    translation: JPS 1917
    original: וְנָתַץ אֶת־הַבַּיִת אֶת־אֲבָנָיו וְאֶת־עֵצָיו וְאֵת כָּל־עֲפַר הַבָּיִת וְהוֹצִיא אֶל־מִחוּץ לָעִיר אֶל־מָקוֹם טָמֵא׃
    hebrewPlain: ונתץ את הבית את אבניו ואת עציו ואת כל עפר הבית והוציא אל מחוץ לעיר אל מקום טמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:45
    kjvOsis:
    - Lev.14.45
