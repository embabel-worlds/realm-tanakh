  data:
    osis: Lev.6.18
    scripture: tanakh
    name: Tanakh Leviticus 6:18
    ref: Leviticus 6:18
    book: Lev
    section: torah
    chapter: 6
    verse: 18
    ordinal: 2872
    text: 'Speak unto Aaron and to his sons, saying: This is the law of the sin-offering: in the place where the burnt-offering is killed shall the sin-offering be killed before the LORD; it is most holy.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר זֹאת תּוֹרַת הַחַטָּאת בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה תִּשָּׁחֵט הַחַטָּאת לִפְנֵי יְהוָה קֹדֶשׁ קָדָשִׁים הִוא׃
    hebrewPlain: דבר אל אהרן ואל בניו לאמר זאת תורת החטאת במקום אשר תשחט העלה תשחט החטאת לפני יהוה קדש קדשים הוא
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:25
    kjvOsis:
