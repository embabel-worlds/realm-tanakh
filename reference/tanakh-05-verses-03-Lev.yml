  data:
    osis: Lev.14.43
    scripture: tanakh
    name: Tanakh Leviticus 14:43
    ref: Leviticus 14:43
    book: Lev
    section: torah
    chapter: 14
    verse: 43
    ordinal: 3152
    text: And if the plague come again, and break out in the house, after that the stones have been taken out, and after the house hath been scraped, and after it is plastered;
    translation: JPS 1917
    original: וְאִם־יָשׁוּב הַנֶּגַע וּפָרַח בַּבַּיִת אַחַר חִלֵּץ אֶת־הָאֲבָנִים וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת וְאַחֲרֵי הִטּוֹחַ׃
    hebrewPlain: ואם ישוב הנגע ופרח בבית אחר חלץ את האבנים ואחרי הקצות את הבית ואחרי הטוח
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:43
    kjvOsis:
    - Lev.14.43
