  data:
    osis: Lev.2.2
    scripture: tanakh
    name: Tanakh Leviticus 2:2
    ref: Leviticus 2:2
    book: Lev
    section: torah
    chapter: 2
    verse: 2
    ordinal: 2762
    text: And he shall bring it to Aaron’s sons the priests; and he shall take thereout his handful of the fine flour thereof, and of the oil thereof, together with all the frankincense thereof; and the priest shall make the memorial-part thereof smoke upon the altar, an offering made by fire, of a sweet savour unto the LORD.
    translation: JPS 1917
    original: וֶהֱבִיאָהּ אֶל־בְּנֵי אַהֲרֹן הַכֹּהֲנִים וְקָמַץ מִשָּׁם מְלֹא קֻמְצוֹ מִסָּלְתָּהּ וּמִשַּׁמְנָהּ עַל כָּל־לְבֹנָתָהּ וְהִקְטִיר הַכֹּהֵן אֶת־אַזְכָּרָתָהּ הַמִּזְבֵּחָה אִשֵּׁה רֵיחַ נִיחֹחַ לַיהוָה׃
    hebrewPlain: והביאה אל בני אהרן הכהנים וקמץ משם מלא קמצו מסלתה ומשמנה על כל לבנתה והקטיר הכהן את אזכרתה המזבחה אשה ריח ניחח ליהוה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:2
    kjvOsis:
    - Lev.2.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.2
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.2.3
    scripture: tanakh
    name: Tanakh Leviticus 2:3
    ref: Leviticus 2:3
    book: Lev
    section: torah
    chapter: 2
    verse: 3
    ordinal: 2763
    text: But that which is left of the meal-offering shall be Aaron’s and his sons’; it is a thing most holy of the offerings of the LORD made by fire.
    translation: JPS 1917
    original: וְהַנּוֹתֶרֶת מִן־הַמִּנְחָה לְאַהֲרֹן וּלְבָנָיו קֹדֶשׁ קָדָשִׁים מֵאִשֵּׁי יְהוָה׃
    hebrewPlain: והנותרת מן המנחה לאהרן ולבניו קדש קדשים מאשי יהוה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:3
    kjvOsis:
    - Lev.2.3
