    text: And no sin-offering, whereof any of the blood is brought into the tent of meeting to make atonement in the holy place, shall be eaten; it shall be burnt with fire.
    translation: JPS 1917
    original: וְכָל־חַטָּאת אֲשֶׁר יוּבָא מִדָּמָהּ אֶל־אֹהֶל מוֹעֵד לְכַפֵּר בַּקֹּדֶשׁ לֹא תֵאָכֵל בָּאֵשׁ תִּשָּׂרֵף׃
    hebrewPlain: וכל חטאת אשר יובא מדמה אל אהל מועד לכפר בקדש לא תאכל באש תשרף
    parashah: Tzav
