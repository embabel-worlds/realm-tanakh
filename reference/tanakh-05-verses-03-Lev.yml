    section: torah
    chapter: 23
    verse: 5
    ordinal: 3405
    text: In the first month, on the fourteenth day of the month at dusk, is the LORD’S passover.
    translation: JPS 1917
    original: בַּחֹדֶשׁ הָרִאשׁוֹן בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ בֵּין הָעַרְבָּיִם פֶּסַח לַיהוָה׃
    hebrewPlain: בחדש הראשון בארבעה עשר לחדש בין הערבים פסח ליהוה
