  data:
    osis: Lev.23.27
    scripture: tanakh
    name: Tanakh Leviticus 23:27
    ref: Leviticus 23:27
    book: Lev
    section: torah
    chapter: 23
    verse: 27
    ordinal: 3427
    text: Howbeit on the tenth day of this seventh month is the day of atonement; there shall be a holy convocation unto you, and ye shall afflict your souls; and ye shall bring an offering made by fire unto the LORD.
    translation: JPS 1917
    original: אַךְ בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה יוֹם הַכִּפֻּרִים הוּא מִקְרָא־קֹדֶשׁ יִהְיֶה לָכֶם וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם וְהִקְרַבְתֶּם אִשֶּׁה לַיהוָה׃
    hebrewPlain: אך בעשור לחדש השביעי הזה יום הכפרים הוא מקרא קדש יהיה לכם ועניתם את נפשתיכם והקרבתם אשה ליהוה
    parashah: Emor
    kjvRefs:
