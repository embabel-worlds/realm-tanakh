  data:
    osis: Lev.2.4
    scripture: tanakh
    name: Tanakh Leviticus 2:4
    ref: Leviticus 2:4
    book: Lev
    section: torah
    chapter: 2
    verse: 4
    ordinal: 2764
    text: And when thou bringest a meal-offering baked in the oven, it shall be unleavened cakes of fine flour mingled with oil, or unleavened wafers spread with oil.
    translation: JPS 1917
    original: וְכִי תַקְרִב קָרְבַּן מִנְחָה מַאֲפֵה תַנּוּר סֹלֶת חַלּוֹת מַצֹּת בְּלוּלֹת בַּשֶּׁמֶן וּרְקִיקֵי מַצּוֹת מְשֻׁחִים בַּשָּׁמֶן׃
    hebrewPlain: וכי תקרב קרבן מנחה מאפה תנור סלת חלות מצת בלולת בשמן ורקיקי מצות משחים בשמן
    parashah: Vayikra
    kjvRefs:
    - Leviticus 2:4
    kjvOsis:
    - Lev.2.4
