  data:
    osis: Lev.5.15
    scripture: tanakh
    name: Tanakh Leviticus 5:15
    ref: Leviticus 5:15
    book: Lev
    section: torah
    chapter: 5
    verse: 15
    ordinal: 2843
    text: If any one commit a trespass, and sin through error, in the holy things of the LORD, then he shall bring his forfeit unto the LORD, a ram without blemish out of the flock, according to thy valuation in silver by shekels, after the shekel of the sanctuary, for a guilt-offering.
    translation: JPS 1917
    original: נֶפֶשׁ כִּי־תִמְעֹל מַעַל וְחָטְאָה בִּשְׁגָגָה מִקָּדְשֵׁי יְהוָה וְהֵבִיא אֶת־אֲשָׁמוֹ לַיהוָה אַיִל תָּמִים מִן־הַצֹּאן בְּעֶרְכְּךָ כֶּסֶף־שְׁקָלִים בְּשֶׁקֶל־הַקֹּדֶשׁ לְאָשָׁם׃
    hebrewPlain: נפש כי תמעל מעל וחטאה בשגגה מקדשי יהוה והביא את אשמו ליהוה איל תמים מן הצאן בערכך כסף שקלים בשקל הקדש לאשם
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:15
    kjvOsis:
    - Lev.5.15
