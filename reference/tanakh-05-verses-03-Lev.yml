  data:
    osis: Lev.14.46
    scripture: tanakh
    name: Tanakh Leviticus 14:46
    ref: Leviticus 14:46
    book: Lev
    section: torah
    chapter: 14
    verse: 46
    ordinal: 3155
    text: Moreover he that goeth into the house all the while that it is shut up shall be unclean until the even.
    translation: JPS 1917
    original: וְהַבָּא אֶל־הַבַּיִת כָּל־יְמֵי הִסְגִּיר אֹתוֹ יִטְמָא עַד־הָעָרֶב׃
    hebrewPlain: והבא אל הבית כל ימי הסגיר אתו יטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:46
    kjvOsis:
    - Lev.14.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
