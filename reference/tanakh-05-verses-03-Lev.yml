  data:
    osis: Lev.13.40
    scripture: tanakh
    name: Tanakh Leviticus 13:40
    ref: Leviticus 13:40
    book: Lev
    section: torah
    chapter: 13
    verse: 40
    ordinal: 3090
    text: And if a man’s hair be fallen off his head, he is bald; yet is he clean.
    translation: JPS 1917
    original: וְאִישׁ כִּי יִמָּרֵט רֹאשׁוֹ קֵרֵחַ הוּא טָהוֹר הוּא׃
    hebrewPlain: ואיש כי ימרט ראשו קרח הוא טהור הוא
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:40
    kjvOsis:
    - Lev.13.40
  relations:
