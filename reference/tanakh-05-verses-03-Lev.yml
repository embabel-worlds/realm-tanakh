  data:
    osis: Lev.13.48
    scripture: tanakh
    name: Tanakh Leviticus 13:48
    ref: Leviticus 13:48
    book: Lev
    section: torah
    chapter: 13
    verse: 48
    ordinal: 3098
    text: or in the warp, or in the woof, whether they be of linen, or of wool; or in a skin, or in any thing made of skin.
    translation: JPS 1917
    original: אוֹ בִשְׁתִי אוֹ בְעֵרֶב לַפִּשְׁתִּים וְלַצָּמֶר אוֹ בְעוֹר אוֹ בְּכָל־מְלֶאכֶת עוֹר׃
    hebrewPlain: או בשתי או בערב לפשתים ולצמר או בעור או בכל מלאכת עור
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:48
    kjvOsis:
    - Lev.13.48
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.13
  - predicate: IN_PORTION
    to:
