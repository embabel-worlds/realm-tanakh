- type: TanakhVerse
  data:
    osis: Lev.21.18
    scripture: tanakh
    name: Tanakh Leviticus 21:18
    ref: Leviticus 21:18
    book: Lev
    section: torah
    chapter: 21
    verse: 18
    ordinal: 3361
    text: 'For whatsoever man he be that hath a blemish, he shall not approach: a blind man, or a lame, or he that hath any thing maimed, or anything too long,'
    translation: JPS 1917
    original: כִּי כָל־אִישׁ אֲשֶׁר־בּוֹ מוּם לֹא יִקְרָב אִישׁ עִוֵּר אוֹ פִסֵּחַ אוֹ חָרֻם אוֹ שָׂרוּעַ׃
    hebrewPlain: כי כל איש אשר בו מום לא יקרב איש עור או פסח או חרם או שרוע
    parashah: Emor
    kjvRefs:
    - Leviticus 21:18
    kjvOsis:
    - Lev.21.18
