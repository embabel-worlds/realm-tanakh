    translation: JPS 1917
    original: וְזֹאת תּוֹרַת הָאָשָׁם קֹדֶשׁ קָדָשִׁים הוּא׃
    hebrewPlain: וזאת תורת האשם קדש קדשים הוא
    parashah: Tzav
    kjvRefs:
