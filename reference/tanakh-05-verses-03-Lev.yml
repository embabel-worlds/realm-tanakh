- type: TanakhVerse
  data:
    osis: Lev.11.39
    scripture: tanakh
    name: Tanakh Leviticus 11:39
    ref: Leviticus 11:39
    book: Lev
    section: torah
    chapter: 11
    verse: 39
    ordinal: 3034
    text: And if any beast, of which ye may eat, die, he that toucheth the carcass thereof shall be unclean until the even.
    translation: JPS 1917
    original: וְכִי יָמוּת מִן־הַבְּהֵמָה אֲשֶׁר־הִיא לָכֶם לְאָכְלָה הַנֹּגֵעַ בְּנִבְלָתָהּ יִטְמָא עַד־הָעָרֶב׃
    hebrewPlain: וכי ימות מן הבהמה אשר היא לכם לאכלה הנגע בנבלתה יטמא עד הערב
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:39
    kjvOsis:
    - Lev.11.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.40
    scripture: tanakh
    name: Tanakh Leviticus 11:40
    ref: Leviticus 11:40
    book: Lev
    section: torah
    chapter: 11
    verse: 40
    ordinal: 3035
    text: And he that eateth of the carcass of it shall wash his clothes, and be unclean until the even; he also that beareth the carcass of it shall wash his clothes, and be unclean until the even.
    translation: JPS 1917
    original: וְהָאֹכֵל מִנִּבְלָתָהּ יְכַבֵּס בְּגָדָיו וְטָמֵא עַד־הָעָרֶב וְהַנֹּשֵׂא אֶת־נִבְלָתָהּ יְכַבֵּס בְּגָדָיו וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: והאכל מנבלתה יכבס בגדיו וטמא עד הערב והנשא את נבלתה יכבס בגדיו וטמא עד הערב
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:40
    kjvOsis:
    - Lev.11.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.41
    scripture: tanakh
    name: Tanakh Leviticus 11:41
    ref: Leviticus 11:41
    book: Lev
    section: torah
    chapter: 11
    verse: 41
    ordinal: 3036
    text: And every swarming thing that swarmeth upon the earth is a detestable thing; it shall not be eaten.
    translation: JPS 1917
    original: וְכָל־הַשֶּׁרֶץ הַשֹּׁרֵץ עַל־הָאָרֶץ שֶׁקֶץ הוּא לֹא יֵאָכֵל׃
    hebrewPlain: וכל השרץ השרץ על הארץ שקץ הוא לא יאכל
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:41
    kjvOsis:
    - Lev.11.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.42
    scripture: tanakh
    name: Tanakh Leviticus 11:42
    ref: Leviticus 11:42
    book: Lev
    section: torah
    chapter: 11
    verse: 42
    ordinal: 3037
    text: Whatsoever goeth upon the belly, and whatsoever goeth upon all fours, or whatsoever hath many feet, even all swarming things that swarm upon the earth, them ye shall not eat; for they are a detestable thing.
    translation: JPS 1917
    original: כֹּל הוֹלֵךְ עַל־גָּחוֹן וְכֹל הוֹלֵךְ עַל־אַרְבַּע עַד כָּל־מַרְבֵּה רַגְלַיִם לְכָל־הַשֶּׁרֶץ הַשֹּׁרֵץ עַל־הָאָרֶץ לֹא תֹאכְלוּם כִּי־שֶׁקֶץ הֵם׃
    hebrewPlain: כל הולך על גחון וכל הולך על ארבע עד כל מרבה רגלים לכל השרץ השרץ על הארץ לא תאכלום כי שקץ הם
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:42
    kjvOsis:
    - Lev.11.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.43
    scripture: tanakh
    name: Tanakh Leviticus 11:43
    ref: Leviticus 11:43
    book: Lev
    section: torah
    chapter: 11
    verse: 43
    ordinal: 3038
    text: Ye shall not make yourselves detestable with any swarming thing that swarmeth, neither shall ye make yourselves unclean with them, that ye should be defiled thereby.
    translation: JPS 1917
    original: אַל־תְּשַׁקְּצוּ אֶת־נַפְשֹׁתֵיכֶם בְּכָל־הַשֶּׁרֶץ הַשֹּׁרֵץ וְלֹא תִטַּמְּאוּ בָּהֶם וְנִטְמֵתֶם בָּם׃
    hebrewPlain: אל תשקצו את נפשתיכם בכל השרץ השרץ ולא תטמאו בהם ונטמתם בם
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:43
    kjvOsis:
    - Lev.11.43
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.44
    scripture: tanakh
    name: Tanakh Leviticus 11:44
    ref: Leviticus 11:44
    book: Lev
    section: torah
    chapter: 11
    verse: 44
    ordinal: 3039
    text: For I am the LORD your God; sanctify yourselves therefore, and be ye holy; for I am holy; neither shall ye defile yourselves with any manner of swarming thing that moveth upon the earth.
    translation: JPS 1917
    original: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם וְהִתְקַדִּשְׁתֶּם וִהְיִיתֶם קְדֹשִׁים כִּי קָדוֹשׁ אָנִי וְלֹא תְטַמְּאוּ אֶת־נַפְשֹׁתֵיכֶם בְּכָל־הַשֶּׁרֶץ הָרֹמֵשׂ עַל־הָאָרֶץ׃
    hebrewPlain: כי אני יהוה אלהיכם והתקדשתם והייתם קדשים כי קדוש אני ולא תטמאו את נפשתיכם בכל השרץ הרמש על הארץ
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:44
    kjvOsis:
    - Lev.11.44
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.45
    scripture: tanakh
    name: Tanakh Leviticus 11:45
    ref: Leviticus 11:45
    book: Lev
    section: torah
    chapter: 11
    verse: 45
    ordinal: 3040
    text: For I am the LORD that brought you up out of the land of Egypt, to be your God; ye shall therefore be holy, for I am holy. .
    translation: JPS 1917
    original: כִּי אֲנִי יְהוָה הַמַּעֲלֶה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם לִהְיֹת לָכֶם לֵאלֹהִים וִהְיִיתֶם קְדֹשִׁים כִּי קָדוֹשׁ אָנִי׃
    hebrewPlain: כי אני יהוה המעלה אתכם מארץ מצרים להית לכם לאלהים והייתם קדשים כי קדוש אני
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:45
    kjvOsis:
    - Lev.11.45
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.46
    scripture: tanakh
    name: Tanakh Leviticus 11:46
    ref: Leviticus 11:46
    book: Lev
    section: torah
    chapter: 11
    verse: 46
    ordinal: 3041
    text: This is the law of the beast, and of the fowl, and of every living creature that moveth in the waters, and of every creature that swarmeth upon the earth;
    translation: JPS 1917
    original: זֹאת תּוֹרַת הַבְּהֵמָה וְהָעוֹף וְכֹל נֶפֶשׁ הַחַיָּה הָרֹמֶשֶׂת בַּמָּיִם וּלְכָל־נֶפֶשׁ הַשֹּׁרֶצֶת עַל־הָאָרֶץ׃
    hebrewPlain: זאת תורת הבהמה והעוף וכל נפש החיה הרמשת במים ולכל נפש השרצת על הארץ
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:46
    kjvOsis:
    - Lev.11.46
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.11.47
    scripture: tanakh
    name: Tanakh Leviticus 11:47
    ref: Leviticus 11:47
    book: Lev
    section: torah
    chapter: 11
    verse: 47
    ordinal: 3042
    text: to make a difference between the unclean and the clean, and between the living thing that may be eaten and the living thing that may not be eaten.
    translation: JPS 1917
    original: לְהַבְדִּיל בֵּין הַטָּמֵא וּבֵין הַטָּהֹר וּבֵין הַחַיָּה הַנֶּאֱכֶלֶת וּבֵין הַחַיָּה אֲשֶׁר לֹא תֵאָכֵל׃
    hebrewPlain: להבדיל בין הטמא ובין הטהר ובין החיה הנאכלת ובין החיה אשר לא תאכל
    parashah: Shmini
    kjvRefs:
    - Leviticus 11:47
    kjvOsis:
    - Lev.11.47
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.11
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.12.1
    scripture: tanakh
    name: Tanakh Leviticus 12:1
    ref: Leviticus 12:1
    book: Lev
    section: torah
    chapter: 12
    verse: 1
    ordinal: 3043
    text: 'And the LORD spoke unto Moses, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵּאמֹר׃
    hebrewPlain: וידבר יהוה אל משה לאמר
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:1
    kjvOsis:
    - Lev.12.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.2
    scripture: tanakh
    name: Tanakh Leviticus 12:2
    ref: Leviticus 12:2
    book: Lev
    section: torah
    chapter: 12
    verse: 2
    ordinal: 3044
    text: 'Speak unto the children of Israel, saying: If a woman be delivered, and bear a man-child, then she shall be unclean seven days; as in the days of the impurity of her sickness shall she be unclean.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר אִשָּׁה כִּי תַזְרִיעַ וְיָלְדָה זָכָר וְטָמְאָה שִׁבְעַת יָמִים כִּימֵי נִדַּת דְּוֺתָהּ תִּטְמָא׃
    hebrewPlain: דבר אל בני ישראל לאמר אשה כי תזריע וילדה זכר וטמאה שבעת ימים כימי נדת דותה תטמא
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:2
    kjvOsis:
    - Lev.12.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.3
    scripture: tanakh
    name: Tanakh Leviticus 12:3
    ref: Leviticus 12:3
    book: Lev
    section: torah
    chapter: 12
    verse: 3
    ordinal: 3045
    text: And in the eighth day the flesh of his foreskin shall be circumcised.
    translation: JPS 1917
    original: וּבַיּוֹם הַשְּׁמִינִי יִמּוֹל בְּשַׂר עָרְלָתוֹ׃
    hebrewPlain: וביום השמיני ימול בשר ערלתו
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:3
    kjvOsis:
    - Lev.12.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.4
    scripture: tanakh
    name: Tanakh Leviticus 12:4
    ref: Leviticus 12:4
    book: Lev
    section: torah
    chapter: 12
    verse: 4
    ordinal: 3046
    text: And she shall continue in the blood of purification three and thirty days; she shall touch no hallowed thing, nor come into the sanctuary, until the days of her purification be fulfilled.
    translation: JPS 1917
    original: וּשְׁלֹשִׁים יוֹם וּשְׁלֹשֶׁת יָמִים תֵּשֵׁב בִּדְמֵי טָהֳרָה בְּכָל־קֹדֶשׁ לֹא־תִגָּע וְאֶל־הַמִּקְדָּשׁ לֹא תָבֹא עַד־מְלֹאת יְמֵי טָהֳרָהּ׃
    hebrewPlain: ושלשים יום ושלשת ימים תשב בדמי טהרה בכל קדש לא תגע ואל המקדש לא תבא עד מלאת ימי טהרה
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:4
    kjvOsis:
    - Lev.12.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.5
    scripture: tanakh
    name: Tanakh Leviticus 12:5
    ref: Leviticus 12:5
    book: Lev
    section: torah
    chapter: 12
    verse: 5
    ordinal: 3047
    text: But if she bear a maid-child, then she shall be unclean two weeks, as in her impurity; and she shall continue in the blood of purification threescore and six days.
    translation: JPS 1917
    original: וְאִם־נְקֵבָה תֵלֵד וְטָמְאָה שְׁבֻעַיִם כְּנִדָּתָהּ וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים תֵּשֵׁב עַל־דְּמֵי טָהֳרָה׃
    hebrewPlain: ואם נקבה תלד וטמאה שבעים כנדתה וששים יום וששת ימים תשב על דמי טהרה
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:5
    kjvOsis:
    - Lev.12.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.12
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tazria
- type: TanakhVerse
  data:
    osis: Lev.12.6
    scripture: tanakh
    name: Tanakh Leviticus 12:6
    ref: Leviticus 12:6
    book: Lev
    section: torah
    chapter: 12
    verse: 6
    ordinal: 3048
    text: And when the days of her purification are fulfilled, for a son, or for a daughter, she shall bring a lamb of the first year for a burnt-offering, and a young pigeon, or a turtle-dove, for a sin-offering, unto the door of the tent of meeting, unto the priest.
    translation: JPS 1917
    original: וּבִמְלֹאת יְמֵי טָהֳרָהּ לְבֵן אוֹ לְבַת תָּבִיא כֶּבֶשׂ בֶּן־שְׁנָתוֹ לְעֹלָה וּבֶן־יוֹנָה אוֹ־תֹר לְחַטָּאת אֶל־פֶּתַח אֹהֶל־מוֹעֵד אֶל־הַכֹּהֵן׃
    hebrewPlain: ובמלאת ימי טהרה לבן או לבת תביא כבש בן שנתו לעלה ובן יונה או תר לחטאת אל פתח אהל מועד אל הכהן
    parashah: Tazria
    kjvRefs:
    - Leviticus 12:6
    kjvOsis:
    - Lev.12.6
  relations:
  - predicate: IN
