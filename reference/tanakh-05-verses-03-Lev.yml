- type: TanakhVerse
  data:
    osis: Lev.14.32
    scripture: tanakh
    name: Tanakh Leviticus 14:32
    ref: Leviticus 14:32
    book: Lev
    section: torah
    chapter: 14
    verse: 32
    ordinal: 3141
    text: This is the law of him in whom is the plague of leprosy, whose means suffice not for that which pertaineth to his cleansing.
    translation: JPS 1917
    original: זֹאת תּוֹרַת אֲשֶׁר־בּוֹ נֶגַע צָרָעַת אֲשֶׁר לֹא־תַשִּׂיג יָדוֹ בְּטָהֳרָתוֹ׃
    hebrewPlain: זאת תורת אשר בו נגע צרעת אשר לא תשיג ידו בטהרתו
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:32
    kjvOsis:
    - Lev.14.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.33
    scripture: tanakh
    name: Tanakh Leviticus 14:33
    ref: Leviticus 14:33
    book: Lev
    section: torah
    chapter: 14
    verse: 33
    ordinal: 3142
    text: 'And the LORD spoke unto Moses and unto Aaron, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן לֵאמֹר׃
    hebrewPlain: וידבר יהוה אל משה ואל אהרן לאמר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:33
    kjvOsis:
    - Lev.14.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.34
    scripture: tanakh
    name: Tanakh Leviticus 14:34
    ref: Leviticus 14:34
    book: Lev
    section: torah
    chapter: 14
    verse: 34
    ordinal: 3143
    text: When ye are come into the land of Canaan, which I give to you for a possession, and I put the plague of leprosy in a house of the land of your possession;
    translation: JPS 1917
    original: כִּי תָבֹאוּ אֶל־אֶרֶץ כְּנַעַן אֲשֶׁר אֲנִי נֹתֵן לָכֶם לַאֲחֻזָּה וְנָתַתִּי נֶגַע צָרַעַת בְּבֵית אֶרֶץ אֲחֻזַּתְכֶם׃
    hebrewPlain: כי תבאו אל ארץ כנען אשר אני נתן לכם לאחזה ונתתי נגע צרעת בבית ארץ אחזתכם
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:34
    kjvOsis:
    - Lev.14.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.35
    scripture: tanakh
    name: Tanakh Leviticus 14:35
    ref: Leviticus 14:35
    book: Lev
    section: torah
    chapter: 14
    verse: 35
    ordinal: 3144
    text: 'then he that owneth the house shall come and tell the priest, saying: ‘There seemeth to me to be as it were a plague in the house.’'
    translation: JPS 1917
    original: וּבָא אֲשֶׁר־לוֹ הַבַּיִת וְהִגִּיד לַכֹּהֵן לֵאמֹר כְּנֶגַע נִרְאָה לִי בַּבָּיִת׃
    hebrewPlain: ובא אשר לו הבית והגיד לכהן לאמר כנגע נראה לי בבית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:35
    kjvOsis:
    - Lev.14.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.36
    scripture: tanakh
    name: Tanakh Leviticus 14:36
    ref: Leviticus 14:36
    book: Lev
    section: torah
    chapter: 14
    verse: 36
    ordinal: 3145
    text: And the priest shall command that they empty the house, before the priest go in to see the plague, that all that is in the house be not made unclean; and afterward the priest shall go in to see the house.
    translation: JPS 1917
    original: וְצִוָּה הַכֹּהֵן וּפִנּוּ אֶת־הַבַּיִת בְּטֶרֶם יָבֹא הַכֹּהֵן לִרְאוֹת אֶת־הַנֶּגַע וְלֹא יִטְמָא כָּל־אֲשֶׁר בַּבָּיִת וְאַחַר כֵּן יָבֹא הַכֹּהֵן לִרְאוֹת אֶת־הַבָּיִת׃
    hebrewPlain: וצוה הכהן ופנו את הבית בטרם יבא הכהן לראות את הנגע ולא יטמא כל אשר בבית ואחר כן יבא הכהן לראות את הבית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:36
    kjvOsis:
    - Lev.14.36
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.37
    scripture: tanakh
    name: Tanakh Leviticus 14:37
    ref: Leviticus 14:37
    book: Lev
    section: torah
    chapter: 14
    verse: 37
    ordinal: 3146
    text: And he shall look on the plague, and, behold, if the plague be in the walls of the house with hollow streaks, greenish or reddish, and the appearance thereof be lower than the wall;
    translation: JPS 1917
    original: וְרָאָה אֶת־הַנֶּגַע וְהִנֵּה הַנֶּגַע בְּקִירֹת הַבַּיִת שְׁקַעֲרוּרֹת יְרַקְרַקֹּת אוֹ אֲדַמְדַּמֹּת וּמַרְאֵיהֶן שָׁפָל מִן־הַקִּיר׃
    hebrewPlain: וראה את הנגע והנה הנגע בקירת הבית שקערורת ירקרקת או אדמדמת ומראיהן שפל מן הקיר
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:37
    kjvOsis:
    - Lev.14.37
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.38
    scripture: tanakh
    name: Tanakh Leviticus 14:38
    ref: Leviticus 14:38
    book: Lev
    section: torah
    chapter: 14
    verse: 38
    ordinal: 3147
    text: then the priest shall go out of the house to the door of the house, and shut up the house seven days.
    translation: JPS 1917
    original: וְיָצָא הַכֹּהֵן מִן־הַבַּיִת אֶל־פֶּתַח הַבָּיִת וְהִסְגִּיר אֶת־הַבַּיִת שִׁבְעַת יָמִים׃
    hebrewPlain: ויצא הכהן מן הבית אל פתח הבית והסגיר את הבית שבעת ימים
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:38
    kjvOsis:
    - Lev.14.38
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.14.39
    scripture: tanakh
    name: Tanakh Leviticus 14:39
    ref: Leviticus 14:39
    book: Lev
    section: torah
    chapter: 14
    verse: 39
    ordinal: 3148
    text: And the priest shall come again the seventh day, and shall look; and, behold, if the plague be spread in the walls of the house;
    translation: JPS 1917
    original: וְשָׁב הַכֹּהֵן בַּיּוֹם הַשְּׁבִיעִי וְרָאָה וְהִנֵּה פָּשָׂה הַנֶּגַע בְּקִירֹת הַבָּיִת׃
    hebrewPlain: ושב הכהן ביום השביעי וראה והנה פשה הנגע בקירת הבית
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:39
    kjvOsis:
    - Lev.14.39
