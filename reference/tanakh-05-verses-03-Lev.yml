    translation: JPS 1917
    original: וְלָקַח הַכֹּהֵן מִדַּם הַחַטָּאת בְּאֶצְבָּעוֹ וְנָתַן עַל־קַרְנֹת מִזְבַּח הָעֹלָה וְאֶת־כָּל־דָּמָהּ יִשְׁפֹּךְ אֶל־יְסוֹד הַמִּזְבֵּחַ׃
    hebrewPlain: ולקח הכהן מדם החטאת באצבעו ונתן על קרנת מזבח העלה ואת כל דמה ישפך אל יסוד המזבח
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:34
    kjvOsis:
    - Lev.4.34
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.4.35
    scripture: tanakh
    name: Tanakh Leviticus 4:35
    ref: Leviticus 4:35
    book: Lev
    section: torah
    chapter: 4
    verse: 35
    ordinal: 2828
    text: And all the fat thereof shall he take away, as the fat of the lamb is taken away from the sacrifice of peace-offerings; and the priest shall make them smoke on the altar, upon the offerings of the LORD made by fire; and the priest shall make atonement for him as touching his sin that he hath sinned, and he shall be forgiven.
    translation: JPS 1917
    original: וְאֶת־כָּל־חֶלְבָּה יָסִיר כַּאֲשֶׁר יוּסַר חֵלֶב־הַכֶּשֶׂב מִזֶּבַח הַשְּׁלָמִים וְהִקְטִיר הַכֹּהֵן אֹתָם הַמִּזְבֵּחָה עַל אִשֵּׁי יְהוָה וְכִפֶּר עָלָיו הַכֹּהֵן עַל־חַטָּאתוֹ אֲשֶׁר־חָטָא וְנִסְלַח לוֹ׃
    hebrewPlain: ואת כל חלבה יסיר כאשר יוסר חלב הכשב מזבח השלמים והקטיר הכהן אתם המזבחה על אשי יהוה וכפר עליו הכהן על חטאתו אשר חטא ונסלח לו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:35
    kjvOsis:
    - Lev.4.35
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.1
    scripture: tanakh
    name: Tanakh Leviticus 5:1
    ref: Leviticus 5:1
    book: Lev
    section: torah
    chapter: 5
    verse: 1
    ordinal: 2829
    text: And if any one sin, in that he heareth the voice of adjuration, he being a witness, whether he hath seen or known, if he do not utter it, then he shall bear his iniquity;
    translation: JPS 1917
    original: וְנֶפֶשׁ כִּי־תֶחֱטָא וְשָׁמְעָה קוֹל אָלָה וְהוּא עֵד אוֹ רָאָה אוֹ יָדָע אִם־לוֹא יַגִּיד וְנָשָׂא עֲוֺנוֹ׃
    hebrewPlain: ונפש כי תחטא ושמעה קול אלה והוא עד או ראה או ידע אם לוא יגיד ונשא עונו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:1
    kjvOsis:
    - Lev.5.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.2
    scripture: tanakh
    name: Tanakh Leviticus 5:2
    ref: Leviticus 5:2
    book: Lev
    section: torah
    chapter: 5
    verse: 2
    ordinal: 2830
    text: or if any one touch any unclean thing, whether it be the carcass of an unclean beast, or the carcass of unclean cattle, or the carcass of unclean swarming things, and be guilty, it being hidden from him that he is unclean;
    translation: JPS 1917
    original: אוֹ נֶפֶשׁ אֲשֶׁר תִּגַּע בְּכָל־דָּבָר טָמֵא אוֹ בְנִבְלַת חַיָּה טְמֵאָה אוֹ בְּנִבְלַת בְּהֵמָה טְמֵאָה אוֹ בְּנִבְלַת שֶׁרֶץ טָמֵא וְנֶעְלַם מִמֶּנּוּ וְהוּא טָמֵא וְאָשֵׁם׃
    hebrewPlain: או נפש אשר תגע בכל דבר טמא או בנבלת חיה טמאה או בנבלת בהמה טמאה או בנבלת שרץ טמא ונעלם ממנו והוא טמא ואשם
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:2
    kjvOsis:
    - Lev.5.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.3
    scripture: tanakh
    name: Tanakh Leviticus 5:3
    ref: Leviticus 5:3
    book: Lev
    section: torah
    chapter: 5
    verse: 3
    ordinal: 2831
    text: or if he touch the uncleanness of man, whatsoever his uncleanness be wherewith he is unclean, and it be hid from him; and, when he knoweth of it, be guilty;
    translation: JPS 1917
    original: אוֹ כִי יִגַּע בְּטֻמְאַת אָדָם לְכֹל טֻמְאָתוֹ אֲשֶׁר יִטְמָא בָּהּ וְנֶעְלַם מִמֶּנּוּ וְהוּא יָדַע וְאָשֵׁם׃
    hebrewPlain: או כי יגע בטמאת אדם לכל טמאתו אשר יטמא בה ונעלם ממנו והוא ידע ואשם
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:3
    kjvOsis:
    - Lev.5.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.4
    scripture: tanakh
    name: Tanakh Leviticus 5:4
    ref: Leviticus 5:4
    book: Lev
    section: torah
    chapter: 5
    verse: 4
    ordinal: 2832
    text: or if any one swear clearly with his lips to do evil, or to do good, whatsoever it be that a man shall utter clearly with an oath, and it be hid from him; and, when he knoweth of it, be guilty in one of these things;
    translation: JPS 1917
    original: אוֹ נֶפֶשׁ כִּי תִשָּׁבַע לְבַטֵּא בִשְׂפָתַיִם לְהָרַע אוֹ לְהֵיטִיב לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה וְנֶעְלַם מִמֶּנּוּ וְהוּא־יָדַע וְאָשֵׁם לְאַחַת מֵאֵלֶּה׃
    hebrewPlain: או נפש כי תשבע לבטא בשפתים להרע או להיטיב לכל אשר יבטא האדם בשבעה ונעלם ממנו והוא ידע ואשם לאחת מאלה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:4
    kjvOsis:
    - Lev.5.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.5
    scripture: tanakh
    name: Tanakh Leviticus 5:5
    ref: Leviticus 5:5
    book: Lev
    section: torah
    chapter: 5
    verse: 5
    ordinal: 2833
    text: and it shall be, when he shall be guilty in one of these things, that he shall confess that wherein he hath sinned;
    translation: JPS 1917
    original: וְהָיָה כִי־יֶאְשַׁם לְאַחַת מֵאֵלֶּה וְהִתְוַדָּה אֲשֶׁר חָטָא עָלֶיהָ׃
    hebrewPlain: והיה כי יאשם לאחת מאלה והתודה אשר חטא עליה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:5
    kjvOsis:
    - Lev.5.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.6
    scripture: tanakh
    name: Tanakh Leviticus 5:6
    ref: Leviticus 5:6
    book: Lev
    section: torah
    chapter: 5
    verse: 6
    ordinal: 2834
    text: and he shall bring his forfeit unto the LORD for his sin which he hath sinned, a female from the flock, a lamb or a goat, for a sin-offering; and the priest shall make atonement for him as concerning his sin.
    translation: JPS 1917
    original: וְהֵבִיא אֶת־אֲשָׁמוֹ לַיהוָה עַל חַטָּאתוֹ אֲשֶׁר חָטָא נְקֵבָה מִן־הַצֹּאן כִּשְׂבָּה אוֹ־שְׂעִירַת עִזִּים לְחַטָּאת וְכִפֶּר עָלָיו הַכֹּהֵן מֵחַטָּאתוֹ׃
    hebrewPlain: והביא את אשמו ליהוה על חטאתו אשר חטא נקבה מן הצאן כשבה או שעירת עזים לחטאת וכפר עליו הכהן מחטאתו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:6
    kjvOsis:
    - Lev.5.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.7
    scripture: tanakh
    name: Tanakh Leviticus 5:7
    ref: Leviticus 5:7
    book: Lev
    section: torah
    chapter: 5
    verse: 7
    ordinal: 2835
    text: 'And if his means suffice not for a lamb, then he shall bring his forfeit for that wherein he hath sinned, two turtle-doves, or two young pigeons, unto the LORD: one for a sin-offering, and the other for a burnt-offering.'
    translation: JPS 1917
    original: וְאִם־לֹא תַגִּיע יָדוֹ דֵּי שֶׂה וְהֵבִיא אֶת־אֲשָׁמוֹ אֲשֶׁר חָטָא שְׁתֵּי תֹרִים אוֹ־שְׁנֵי בְנֵי־יוֹנָה לַיהוָה אֶחָד לְחַטָּאת וְאֶחָד לְעֹלָה׃
    hebrewPlain: ואם לא תגיע ידו די שה והביא את אשמו אשר חטא שתי תרים או שני בני יונה ליהוה אחד לחטאת ואחד לעלה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:7
    kjvOsis:
    - Lev.5.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.8
    scripture: tanakh
    name: Tanakh Leviticus 5:8
    ref: Leviticus 5:8
    book: Lev
    section: torah
    chapter: 5
    verse: 8
    ordinal: 2836
    text: And he shall bring them unto the priest, who shall offer that which is for the sin-offering first, and pinch off its head close by its neck, but shall not divide it asunder.
    translation: JPS 1917
    original: וְהֵבִיא אֹתָם אֶל־הַכֹּהֵן וְהִקְרִיב אֶת־אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה וּמָלַק אֶת־רֹאשׁוֹ מִמּוּל עָרְפּוֹ וְלֹא יַבְדִּיל׃
    hebrewPlain: והביא אתם אל הכהן והקריב את אשר לחטאת ראשונה ומלק את ראשו ממול ערפו ולא יבדיל
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:8
    kjvOsis:
    - Lev.5.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.9
    scripture: tanakh
    name: Tanakh Leviticus 5:9
    ref: Leviticus 5:9
    book: Lev
    section: torah
    chapter: 5
    verse: 9
    ordinal: 2837
    text: And he shall sprinkle of the blood of the sin-offering upon the side of the altar; and the rest of the blood shall be drained out at the base of the altar; it is a sin-offering.
    translation: JPS 1917
    original: וְהִזָּה מִדַּם הַחַטָּאת עַל־קִיר הַמִּזְבֵּחַ וְהַנִּשְׁאָר בַּדָּם יִמָּצֵה אֶל־יְסוֹד הַמִּזְבֵּחַ חַטָּאת הוּא׃
    hebrewPlain: והזה מדם החטאת על קיר המזבח והנשאר בדם ימצה אל יסוד המזבח חטאת הוא
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:9
    kjvOsis:
    - Lev.5.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.10
    scripture: tanakh
    name: Tanakh Leviticus 5:10
    ref: Leviticus 5:10
    book: Lev
    section: torah
    chapter: 5
    verse: 10
    ordinal: 2838
    text: And he shall prepare the second for a burnt-offering, according to the ordinance; and the priest shall make atonement for him as concerning his sin which he hath sinned, and he shall be forgiven.
    translation: JPS 1917
    original: וְאֶת־הַשֵּׁנִי יַעֲשֶׂה עֹלָה כַּמִּשְׁפָּט וְכִפֶּר עָלָיו הַכֹּהֵן מֵחַטָּאתוֹ אֲשֶׁר־חָטָא וְנִסְלַח לוֹ׃
    hebrewPlain: ואת השני יעשה עלה כמשפט וכפר עליו הכהן מחטאתו אשר חטא ונסלח לו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:10
    kjvOsis:
    - Lev.5.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.11
    scripture: tanakh
    name: Tanakh Leviticus 5:11
    ref: Leviticus 5:11
    book: Lev
    section: torah
    chapter: 5
    verse: 11
    ordinal: 2839
    text: But if his means suffice not for two turtledoves, or two young pigeons, then he shall bring his offering for that wherein he hath sinned, the tenth part of an ephah of fine flour for a sin-offering; he shall put no oil upon it, neither shall he put any frankincense thereon; for it is a sin-offering.
    translation: JPS 1917
    original: וְאִם־לֹא תַשִּׂיג יָדוֹ לִשְׁתֵּי תֹרִים אוֹ לִשְׁנֵי בְנֵי־יוֹנָה וְהֵבִיא אֶת־קָרְבָּנוֹ אֲשֶׁר חָטָא עֲשִׂירִת הָאֵפָה סֹלֶת לְחַטָּאת לֹא־יָשִׂים עָלֶיהָ שֶׁמֶן וְלֹא־יִתֵּן עָלֶיהָ לְבֹנָה כִּי חַטָּאת הִיא׃
    hebrewPlain: ואם לא תשיג ידו לשתי תרים או לשני בני יונה והביא את קרבנו אשר חטא עשירת האפה סלת לחטאת לא ישים עליה שמן ולא יתן עליה לבנה כי חטאת היא
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:11
    kjvOsis:
    - Lev.5.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.12
    scripture: tanakh
    name: Tanakh Leviticus 5:12
    ref: Leviticus 5:12
    book: Lev
    section: torah
    chapter: 5
    verse: 12
    ordinal: 2840
    text: And he shall bring it to the priest, and the priest shall take his handful of it as the memorial-part thereof, and make it smoke on the altar, upon the offerings of the LORD made by fire; it is a sin-offering.
    translation: JPS 1917
    original: וֶהֱבִיאָהּ אֶל־הַכֹּהֵן וְקָמַץ הַכֹּהֵן מִמֶּנָּה מְלוֹא קֻמְצוֹ אֶת־אַזְכָּרָתָה וְהִקְטִיר הַמִּזְבֵּחָה עַל אִשֵּׁי יְהוָה חַטָּאת הִוא׃
    hebrewPlain: והביאה אל הכהן וקמץ הכהן ממנה מלוא קמצו את אזכרתה והקטיר המזבחה על אשי יהוה חטאת הוא
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:12
    kjvOsis:
    - Lev.5.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.13
    scripture: tanakh
    name: Tanakh Leviticus 5:13
    ref: Leviticus 5:13
    book: Lev
    section: torah
    chapter: 5
    verse: 13
    ordinal: 2841
    text: And the priest shall make atonement for him as touching his sin that he hath sinned in any of these things, and he shall be forgiven; and the remnant shall be the priest’s, as the meal-offering.
    translation: JPS 1917
    original: וְכִפֶּר עָלָיו הַכֹּהֵן עַל־חַטָּאתוֹ אֲשֶׁר־חָטָא מֵאַחַת מֵאֵלֶּה וְנִסְלַח לוֹ וְהָיְתָה לַכֹּהֵן כַּמִּנְחָה׃
    hebrewPlain: וכפר עליו הכהן על חטאתו אשר חטא מאחת מאלה ונסלח לו והיתה לכהן כמנחה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 5:13
    kjvOsis:
    - Lev.5.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.5
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
    osis: Lev.5.14
    scripture: tanakh
    name: Tanakh Leviticus 5:14
    ref: Leviticus 5:14
    book: Lev
    section: torah
    chapter: 5
    verse: 14
    ordinal: 2842
    text: 'And the LORD spoke unto Moses, saying:'
