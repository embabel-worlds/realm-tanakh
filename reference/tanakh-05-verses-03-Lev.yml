    book: Lev
    section: torah
    chapter: 11
    verse: 2
    ordinal: 2997
    text: 'Speak unto the children of Israel, saying: These are the living things which ye may eat among all the beasts that are on the earth.'
    translation: JPS 1917
    original: דַּבְּרוּ אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר זֹאת הַחַיָּה אֲשֶׁר תֹּאכְלוּ מִכָּל־הַבְּהֵמָה אֲשֶׁר עַל־הָאָרֶץ׃
