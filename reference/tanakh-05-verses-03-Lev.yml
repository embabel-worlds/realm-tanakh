- type: TanakhVerse
  data:
    osis: Lev.25.53
    scripture: tanakh
    name: Tanakh Leviticus 25:53
    ref: Leviticus 25:53
    book: Lev
    section: torah
    chapter: 25
    verse: 53
    ordinal: 3520
    text: As a servant hired year by year shall he be with him; he shall not rule with rigour over him in thy sight.
    translation: JPS 1917
    original: כִּשְׂכִיר שָׁנָה בְּשָׁנָה יִהְיֶה עִמּוֹ לֹא־יִרְדֶּנּוּ בְּפֶרֶךְ לְעֵינֶיךָ׃
    hebrewPlain: כשכיר שנה בשנה יהיה עמו לא ירדנו בפרך לעיניך
    parashah: Behar
    kjvRefs:
    - Leviticus 25:53
    kjvOsis:
    - Lev.25.53
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: behar
- type: TanakhVerse
  data:
    osis: Lev.25.54
    scripture: tanakh
    name: Tanakh Leviticus 25:54
    ref: Leviticus 25:54
    book: Lev
    section: torah
    chapter: 25
    verse: 54
    ordinal: 3521
    text: And if he be not redeemed by any of these means, then he shall go out in the year of jubilee, he, and his children with him.
    translation: JPS 1917
    original: וְאִם־לֹא יִגָּאֵל בְּאֵלֶּה וְיָצָא בִּשְׁנַת הַיֹּבֵל הוּא וּבָנָיו עִמּוֹ׃
    hebrewPlain: ואם לא יגאל באלה ויצא בשנת היבל הוא ובניו עמו
    parashah: Behar
    kjvRefs:
    - Leviticus 25:54
    kjvOsis:
    - Lev.25.54
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.25
  - predicate: IN_PORTION
    to:
