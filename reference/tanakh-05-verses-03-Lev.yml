- type: TanakhVerse
  data:
    osis: Lev.4.13
    scripture: tanakh
    name: Tanakh Leviticus 4:13
    ref: Leviticus 4:13
    book: Lev
    section: torah
    chapter: 4
    verse: 13
    ordinal: 2806
    text: 'And if the whole congregation of Israel shall err, the thing being hid from the eyes of the assembly, and do any of the things which the LORD hath commanded not to be done, and are guilty:'
    translation: JPS 1917
    original: וְאִם כָּל־עֲדַת יִשְׂרָאֵל יִשְׁגּוּ וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל וְעָשׂוּ אַחַת מִכָּל־מִצְוֺת יְהוָה אֲשֶׁר לֹא־תֵעָשֶׂינָה וְאָשֵׁמוּ׃
    hebrewPlain: ואם כל עדת ישראל ישגו ונעלם דבר מעיני הקהל ועשו אחת מכל מצות יהוה אשר לא תעשינה ואשמו
    parashah: Vayikra
    kjvRefs:
    - Leviticus 4:13
    kjvOsis:
    - Lev.4.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.4
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: vayikra
- type: TanakhVerse
  data:
