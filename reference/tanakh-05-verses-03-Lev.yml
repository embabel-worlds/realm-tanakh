  data:
    osis: Lev.3.1
    scripture: tanakh
    name: Tanakh Leviticus 3:1
    ref: Leviticus 3:1
    book: Lev
    section: torah
    chapter: 3
    verse: 1
    ordinal: 2777
    text: 'And if his offering be a sacrifice of peace-offerings: if he offer of the herd, whether male or female, he shall offer it without blemish before the LORD.'
