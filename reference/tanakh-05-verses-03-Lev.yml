      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.17
    scripture: tanakh
    name: Tanakh Leviticus 9:17
    ref: Leviticus 9:17
    book: Lev
    section: torah
    chapter: 9
    verse: 17
    ordinal: 2968
    text: And the meal-offering was presented; and he filled his hand therefrom, and made it smoke upon the altar, besides the burnt-offering of the morning.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־הַמִּנְחָה וַיְמַלֵּא כַפּוֹ מִמֶּנָּה וַיַּקְטֵר עַל־הַמִּזְבֵּחַ מִלְּבַד עֹלַת הַבֹּקֶר׃
    hebrewPlain: ויקרב את המנחה וימלא כפו ממנה ויקטר על המזבח מלבד עלת הבקר
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:17
    kjvOsis:
    - Lev.9.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.18
    scripture: tanakh
    name: Tanakh Leviticus 9:18
    ref: Leviticus 9:18
    book: Lev
    section: torah
    chapter: 9
    verse: 18
    ordinal: 2969
    text: He slew also the ox and the ram, the sacrifice of peace-offerings, which was for the people; and Aaron’s sons delivered unto him the blood, and he dashed it against the altar round about,
    translation: JPS 1917
    original: וַיִּשְׁחַט אֶת־הַשּׁוֹר וְאֶת־הָאַיִל זֶבַח הַשְּׁלָמִים אֲשֶׁר לָעָם וַיַּמְצִאוּ בְּנֵי אַהֲרֹן אֶת־הַדָּם אֵלָיו וַיִּזְרְקֵהוּ עַל־הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: וישחט את השור ואת האיל זבח השלמים אשר לעם וימצאו בני אהרן את הדם אליו ויזרקהו על המזבח סביב
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:18
    kjvOsis:
    - Lev.9.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.19
    scripture: tanakh
    name: Tanakh Leviticus 9:19
    ref: Leviticus 9:19
    book: Lev
    section: torah
    chapter: 9
    verse: 19
    ordinal: 2970
    text: and the fat of the ox, and of the ram, the fat tail, and that which covereth the inwards, and the kidneys, and the lobe of the liver.
    translation: JPS 1917
    original: וְאֶת־הַחֲלָבִים מִן־הַשּׁוֹר וּמִן־הָאַיִל הָאַלְיָה וְהַמְכַסֶּה וְהַכְּלָיֹת וְיֹתֶרֶת הַכָּבֵד׃
    hebrewPlain: ואת החלבים מן השור ומן האיל האליה והמכסה והכלית ויתרת הכבד
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:19
    kjvOsis:
    - Lev.9.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.20
    scripture: tanakh
    name: Tanakh Leviticus 9:20
    ref: Leviticus 9:20
    book: Lev
    section: torah
    chapter: 9
    verse: 20
    ordinal: 2971
    text: And they put the fat upon the breasts, and he made the fat smoke upon the altar.
    translation: JPS 1917
    original: וַיָּשִׂימוּ אֶת־הַחֲלָבִים עַל־הֶחָזוֹת וַיַּקְטֵר הַחֲלָבִים הַמִּזְבֵּחָה׃
    hebrewPlain: וישימו את החלבים על החזות ויקטר החלבים המזבחה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:20
    kjvOsis:
    - Lev.9.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.21
    scripture: tanakh
    name: Tanakh Leviticus 9:21
    ref: Leviticus 9:21
    book: Lev
    section: torah
    chapter: 9
    verse: 21
    ordinal: 2972
    text: And the breasts and the right thigh Aaron waved for a wave-offering before the LORD; as Moses commanded.
    translation: JPS 1917
    original: וְאֵת הֶחָזוֹת וְאֵת שׁוֹק הַיָּמִין הֵנִיף אַהֲרֹן תְּנוּפָה לִפְנֵי יְהוָה כַּאֲשֶׁר צִוָּה מֹשֶׁה׃
    hebrewPlain: ואת החזות ואת שוק הימין הניף אהרן תנופה לפני יהוה כאשר צוה משה
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:21
    kjvOsis:
    - Lev.9.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.22
    scripture: tanakh
    name: Tanakh Leviticus 9:22
    ref: Leviticus 9:22
    book: Lev
    section: torah
    chapter: 9
    verse: 22
    ordinal: 2973
    text: And Aaron lifted up his hands toward the people, and blessed them; and he came down from offering the sin-offering, and the burnt-offering, and the peace-offerings.
    translation: JPS 1917
    original: וַיִּשָּׂא אַהֲרֹן אֶת־ידו [יָדָיו] אֶל־הָעָם וַיְבָרְכֵם וַיֵּרֶד מֵעֲשֹׂת הַחַטָּאת וְהָעֹלָה וְהַשְּׁלָמִים׃
    hebrewPlain: וישא אהרן את ידו [ידיו] אל העם ויברכם וירד מעשת החטאת והעלה והשלמים
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:22
    kjvOsis:
    - Lev.9.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.23
    scripture: tanakh
    name: Tanakh Leviticus 9:23
    ref: Leviticus 9:23
    book: Lev
    section: torah
    chapter: 9
    verse: 23
    ordinal: 2974
    text: And Moses and Aaron went into the tent of meeting, and came out, and blessed the people; and the glory of the LORD appeared unto all the people.
    translation: JPS 1917
    original: וַיָּבֹא מֹשֶׁה וְאַהֲרֹן אֶל־אֹהֶל מוֹעֵד וַיֵּצְאוּ וַיְבָרֲכוּ אֶת־הָעָם וַיֵּרָא כְבוֹד־יְהוָה אֶל־כָּל־הָעָם׃
    hebrewPlain: ויבא משה ואהרן אל אהל מועד ויצאו ויברכו את העם וירא כבוד יהוה אל כל העם
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:23
    kjvOsis:
    - Lev.9.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.9.24
    scripture: tanakh
    name: Tanakh Leviticus 9:24
    ref: Leviticus 9:24
    book: Lev
    section: torah
    chapter: 9
    verse: 24
    ordinal: 2975
    text: And there came forth fire from before the LORD, and consumed upon the altar the burnt-offering and the fat; and when all the people saw it, they shouted, and fell on their faces.
    translation: JPS 1917
    original: וַתֵּצֵא אֵשׁ מִלִּפְנֵי יְהוָה וַתֹּאכַל עַל־הַמִּזְבֵּחַ אֶת־הָעֹלָה וְאֶת־הַחֲלָבִים וַיַּרְא כָּל־הָעָם וַיָּרֹנּוּ וַיִּפְּלוּ עַל־פְּנֵיהֶם׃
    hebrewPlain: ותצא אש מלפני יהוה ותאכל על המזבח את העלה ואת החלבים וירא כל העם וירנו ויפלו על פניהם
    parashah: Shmini
    kjvRefs:
    - Leviticus 9:24
    kjvOsis:
    - Lev.9.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.9
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.1
    scripture: tanakh
    name: Tanakh Leviticus 10:1
    ref: Leviticus 10:1
    book: Lev
    section: torah
    chapter: 10
    verse: 1
    ordinal: 2976
    text: And Nadab and Abihu, the sons of Aaron, took each of them his censer, and put fire therein, and laid incense thereon, and offered strange fire before the LORD, which He had not commanded them.
    translation: JPS 1917
    original: וַיִּקְחוּ בְנֵי־אַהֲרֹן נָדָב וַאֲבִיהוּא אִישׁ מַחְתָּתוֹ וַיִּתְּנוּ בָהֵן אֵשׁ וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת וַיַּקְרִבוּ לִפְנֵי יְהוָה אֵשׁ זָרָה אֲשֶׁר לֹא צִוָּה אֹתָם׃
    hebrewPlain: ויקחו בני אהרן נדב ואביהוא איש מחתתו ויתנו בהן אש וישימו עליה קטרת ויקרבו לפני יהוה אש זרה אשר לא צוה אתם
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:1
    kjvOsis:
    - Lev.10.1
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.2
    scripture: tanakh
    name: Tanakh Leviticus 10:2
    ref: Leviticus 10:2
    book: Lev
    section: torah
    chapter: 10
    verse: 2
    ordinal: 2977
    text: And there came forth fire from before the LORD, and devoured them, and they died before the LORD.
    translation: JPS 1917
    original: וַתֵּצֵא אֵשׁ מִלִּפְנֵי יְהוָה וַתֹּאכַל אוֹתָם וַיָּמֻתוּ לִפְנֵי יְהוָה׃
    hebrewPlain: ותצא אש מלפני יהוה ותאכל אותם וימתו לפני יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:2
    kjvOsis:
    - Lev.10.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.3
    scripture: tanakh
    name: Tanakh Leviticus 10:3
    ref: Leviticus 10:3
    book: Lev
    section: torah
    chapter: 10
    verse: 3
    ordinal: 2978
    text: 'Then Moses said unto Aaron: ‘This is it that the LORD spoke, saying: Through them that are nigh unto Me I will be sanctified, and before all the people I will be glorified.’ And Aaron held his peace.'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה אֶל־אַהֲרֹן הוּא אֲשֶׁר־דִּבֶּר יְהוָה לֵאמֹר בִּקְרֹבַי אֶקָּדֵשׁ וְעַל־פְּנֵי כָל־הָעָם אֶכָּבֵד וַיִּדֹּם אַהֲרֹן׃
    hebrewPlain: ויאמר משה אל אהרן הוא אשר דבר יהוה לאמר בקרבי אקדש ועל פני כל העם אכבד וידם אהרן
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:3
    kjvOsis:
    - Lev.10.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.4
    scripture: tanakh
    name: Tanakh Leviticus 10:4
    ref: Leviticus 10:4
    book: Lev
    section: torah
    chapter: 10
    verse: 4
    ordinal: 2979
    text: 'And Moses called Mishael and Elzaphan, the sons of Uzziel the uncle of Aaron, and said unto them: ‘Draw near, carry your brethren from before the sanctuary out of the camp.’'
    translation: JPS 1917
    original: וַיִּקְרָא מֹשֶׁה אֶל־מִישָׁאֵל וְאֶל אֶלְצָפָן בְּנֵי עֻזִּיאֵל דֹּד אַהֲרֹן וַיֹּאמֶר אֲלֵהֶם קִרְבוּ שְׂאוּ אֶת־אֲחֵיכֶם מֵאֵת פְּנֵי־הַקֹּדֶשׁ אֶל־מִחוּץ לַמַּחֲנֶה׃
    hebrewPlain: ויקרא משה אל מישאל ואל אלצפן בני עזיאל דד אהרן ויאמר אלהם קרבו שאו את אחיכם מאת פני הקדש אל מחוץ למחנה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:4
    kjvOsis:
    - Lev.10.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.5
    scripture: tanakh
    name: Tanakh Leviticus 10:5
    ref: Leviticus 10:5
    book: Lev
    section: torah
    chapter: 10
    verse: 5
    ordinal: 2980
    text: So they drew near, and carried them in their tunics out of the camp, as Moses had said.
    translation: JPS 1917
    original: וַיִּקְרְבוּ וַיִּשָּׂאֻם בְּכֻתֳּנֹתָם אֶל־מִחוּץ לַמַּחֲנֶה כַּאֲשֶׁר דִּבֶּר מֹשֶׁה׃
    hebrewPlain: ויקרבו וישאם בכתנתם אל מחוץ למחנה כאשר דבר משה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:5
    kjvOsis:
    - Lev.10.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.6
    scripture: tanakh
    name: Tanakh Leviticus 10:6
    ref: Leviticus 10:6
    book: Lev
    section: torah
    chapter: 10
    verse: 6
    ordinal: 2981
    text: 'And Moses said unto Aaron, and unto Eleazar and unto Ithamar, his sons: ‘Let not the hair of your heads go loose, neither rend your clothes, that ye die not, and that He be not wroth with all the congregation; but let your brethren, the whole house of Israel, bewail the burning which the LORD hath kindled.'
    translation: JPS 1917
    original: וַיֹּאמֶר מֹשֶׁה אֶל־אַהֲרֹן וּלְאֶלְעָזָר וּלְאִיתָמָר בָּנָיו רָאשֵׁיכֶם אַל־תִּפְרָעוּ וּבִגְדֵיכֶם לֹא־תִפְרֹמוּ וְלֹא תָמֻתוּ וְעַל כָּל־הָעֵדָה יִקְצֹף וַאֲחֵיכֶם כָּל־בֵּית יִשְׂרָאֵל יִבְכּוּ אֶת־הַשְּׂרֵפָה אֲשֶׁר שָׂרַף יְהוָה׃
    hebrewPlain: ויאמר משה אל אהרן ולאלעזר ולאיתמר בניו ראשיכם אל תפרעו ובגדיכם לא תפרמו ולא תמתו ועל כל העדה יקצף ואחיכם כל בית ישראל יבכו את השרפה אשר שרף יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:6
    kjvOsis:
    - Lev.10.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.7
    scripture: tanakh
    name: Tanakh Leviticus 10:7
    ref: Leviticus 10:7
    book: Lev
    section: torah
    chapter: 10
    verse: 7
    ordinal: 2982
    text: And ye shall not go out from the door of the tent of meeting, lest ye die; for the anointing oil of the LORD is upon you.’ And they did according to the word of Moses.
    translation: JPS 1917
    original: וּמִפֶּתַח אֹהֶל מוֹעֵד לֹא תֵצְאוּ פֶּן־תָּמֻתוּ כִּי־שֶׁמֶן מִשְׁחַת יְהוָה עֲלֵיכֶם וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה׃
    hebrewPlain: ומפתח אהל מועד לא תצאו פן תמתו כי שמן משחת יהוה עליכם ויעשו כדבר משה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:7
    kjvOsis:
    - Lev.10.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.8
    scripture: tanakh
    name: Tanakh Leviticus 10:8
    ref: Leviticus 10:8
    book: Lev
    section: torah
    chapter: 10
    verse: 8
    ordinal: 2983
    text: 'And the LORD spoke unto Aaron, saying:'
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־אַהֲרֹן לֵאמֹר׃
    hebrewPlain: וידבר יהוה אל אהרן לאמר
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:8
    kjvOsis:
    - Lev.10.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.9
    scripture: tanakh
    name: Tanakh Leviticus 10:9
    ref: Leviticus 10:9
    book: Lev
    section: torah
    chapter: 10
    verse: 9
    ordinal: 2984
    text: ’Drink no wine nor strong drink, thou, nor thy sons with thee, when ye go into the tent of meeting, that ye die not; it shall be a statute forever throughout your generations.
    translation: JPS 1917
    original: יַיִן וְשֵׁכָר אַל־תֵּשְׁתְּ אַתָּה וּבָנֶיךָ אִתָּךְ בְּבֹאֲכֶם אֶל־אֹהֶל מוֹעֵד וְלֹא תָמֻתוּ חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם׃
    hebrewPlain: יין ושכר אל תשת אתה ובניך אתך בבאכם אל אהל מועד ולא תמתו חקת עולם לדרתיכם
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:9
    kjvOsis:
    - Lev.10.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.10
    scripture: tanakh
    name: Tanakh Leviticus 10:10
    ref: Leviticus 10:10
    book: Lev
    section: torah
    chapter: 10
    verse: 10
    ordinal: 2985
    text: And that ye may put difference between the holy and the common, and between the unclean and the clean;
    translation: JPS 1917
    original: וּלֲהַבְדִּיל בֵּין הַקֹּדֶשׁ וּבֵין הַחֹל וּבֵין הַטָּמֵא וּבֵין הַטָּהוֹר׃
    hebrewPlain: ולהבדיל בין הקדש ובין החל ובין הטמא ובין הטהור
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:10
    kjvOsis:
    - Lev.10.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.11
    scripture: tanakh
    name: Tanakh Leviticus 10:11
    ref: Leviticus 10:11
    book: Lev
    section: torah
    chapter: 10
    verse: 11
    ordinal: 2986
    text: and that ye may teach the children of Israel all the statutes which the LORD hath spoken unto them by the hand of Moses.’
    translation: JPS 1917
    original: וּלְהוֹרֹת אֶת־בְּנֵי יִשְׂרָאֵל אֵת כָּל־הַחֻקִּים אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם בְּיַד־מֹשֶׁה׃
    hebrewPlain: ולהורת את בני ישראל את כל החקים אשר דבר יהוה אליהם ביד משה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:11
    kjvOsis:
    - Lev.10.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.12
    scripture: tanakh
    name: Tanakh Leviticus 10:12
    ref: Leviticus 10:12
    book: Lev
    section: torah
    chapter: 10
    verse: 12
    ordinal: 2987
    text: 'And Moses spoke unto Aaron, and unto Eleazar and unto Ithamar, his sons that were left: ‘Take the meal-offering that remaineth of the offerings of the LORD made by fire, and eat it without leaven beside the altar; for it is most holy.'
    translation: JPS 1917
    original: וַיְדַבֵּר מֹשֶׁה אֶל־אַהֲרֹן וְאֶל אֶלְעָזָר וְאֶל־אִיתָמָר בָּנָיו הַנּוֹתָרִים קְחוּ אֶת־הַמִּנְחָה הַנּוֹתֶרֶת מֵאִשֵּׁי יְהוָה וְאִכְלוּהָ מַצּוֹת אֵצֶל הַמִּזְבֵּחַ כִּי קֹדֶשׁ קָדָשִׁים הִוא׃
    hebrewPlain: וידבר משה אל אהרן ואל אלעזר ואל איתמר בניו הנותרים קחו את המנחה הנותרת מאשי יהוה ואכלוה מצות אצל המזבח כי קדש קדשים הוא
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:12
    kjvOsis:
    - Lev.10.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.13
    scripture: tanakh
    name: Tanakh Leviticus 10:13
    ref: Leviticus 10:13
    book: Lev
    section: torah
    chapter: 10
    verse: 13
    ordinal: 2988
    text: And ye shall eat it in a holy place, because it is thy due, and thy sons’ due, of the offerings of the LORD made by fire; for so I am commanded.
    translation: JPS 1917
    original: וַאֲכַלְתֶּם אֹתָהּ בְּמָקוֹם קָדֹשׁ כִּי חָקְךָ וְחָק־בָּנֶיךָ הִוא מֵאִשֵּׁי יְהוָה כִּי־כֵן צֻוֵּיתִי׃
    hebrewPlain: ואכלתם אתה במקום קדש כי חקך וחק בניך הוא מאשי יהוה כי כן צויתי
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:13
    kjvOsis:
    - Lev.10.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.14
    scripture: tanakh
    name: Tanakh Leviticus 10:14
    ref: Leviticus 10:14
    book: Lev
    section: torah
    chapter: 10
    verse: 14
    ordinal: 2989
    text: And the breast of waving and the thigh of heaving shall ye eat in a clean place; thou, and thy sons, and thy daughters with thee; for they are given as thy due, and thy sons’ due, out of the sacrifices of the peace-offerings of the children of Israel.
    translation: JPS 1917
    original: וְאֵת חֲזֵה הַתְּנוּפָה וְאֵת שׁוֹק הַתְּרוּמָה תֹּאכְלוּ בְּמָקוֹם טָהוֹר אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ כִּי־חָקְךָ וְחָק־בָּנֶיךָ נִתְּנוּ מִזִּבְחֵי שַׁלְמֵי בְּנֵי יִשְׂרָאֵל׃
    hebrewPlain: ואת חזה התנופה ואת שוק התרומה תאכלו במקום טהור אתה ובניך ובנתיך אתך כי חקך וחק בניך נתנו מזבחי שלמי בני ישראל
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:14
    kjvOsis:
    - Lev.10.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.15
    scripture: tanakh
    name: Tanakh Leviticus 10:15
    ref: Leviticus 10:15
    book: Lev
    section: torah
    chapter: 10
    verse: 15
    ordinal: 2990
    text: The thigh of heaving and the breast of waving shall they bring with the offerings of the fat made by fire, to wave it for a wave-offering before the LORD; and it shall be thine, and thy sons’ with thee, as a due for ever; as the LORD hath commanded.’
    translation: JPS 1917
    original: שׁוֹק הַתְּרוּמָה וַחֲזֵה הַתְּנוּפָה עַל אִשֵּׁי הַחֲלָבִים יָבִיאוּ לְהָנִיף תְּנוּפָה לִפְנֵי יְהוָה וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ לְחָק־עוֹלָם כַּאֲשֶׁר צִוָּה יְהוָה׃
    hebrewPlain: שוק התרומה וחזה התנופה על אשי החלבים יביאו להניף תנופה לפני יהוה והיה לך ולבניך אתך לחק עולם כאשר צוה יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:15
    kjvOsis:
    - Lev.10.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.16
    scripture: tanakh
    name: Tanakh Leviticus 10:16
    ref: Leviticus 10:16
    book: Lev
    section: torah
    chapter: 10
    verse: 16
    ordinal: 2991
    text: 'And Moses diligently inquired for the goat of the sin-offering, and, behold, it was burnt; and he was angry with Eleazar and with Ithamar, the sons of Aaron that were left, saying:'
    translation: JPS 1917
    original: וְאֵת שְׂעִיר הַחַטָּאת דָּרֹשׁ דָּרַשׁ מֹשֶׁה וְהִנֵּה שֹׂרָף וַיִּקְצֹף עַל־אֶלְעָזָר וְעַל־אִיתָמָר בְּנֵי אַהֲרֹן הַנּוֹתָרִם לֵאמֹר׃
    hebrewPlain: ואת שעיר החטאת דרש דרש משה והנה שרף ויקצף על אלעזר ועל איתמר בני אהרן הנותרם לאמר
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:16
    kjvOsis:
    - Lev.10.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.17
    scripture: tanakh
    name: Tanakh Leviticus 10:17
    ref: Leviticus 10:17
    book: Lev
    section: torah
    chapter: 10
    verse: 17
    ordinal: 2992
    text: ’Wherefore have ye not eaten the sin-offering in the place of the sanctuary, seeing it is most holy, and He hath given it you to bear the iniquity of the congregation, to make atonement for them before the LORD?
    translation: JPS 1917
    original: מַדּוּעַ לֹא־אֲכַלְתֶּם אֶת־הַחַטָּאת בִּמְקוֹם הַקֹּדֶשׁ כִּי קֹדֶשׁ קָדָשִׁים הִוא וְאֹתָהּ נָתַן לָכֶם לָשֵׂאת אֶת־עֲוֺן הָעֵדָה לְכַפֵּר עֲלֵיהֶם לִפְנֵי יְהוָה׃
    hebrewPlain: מדוע לא אכלתם את החטאת במקום הקדש כי קדש קדשים הוא ואתה נתן לכם לשאת את עון העדה לכפר עליהם לפני יהוה
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:17
    kjvOsis:
    - Lev.10.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.18
    scripture: tanakh
    name: Tanakh Leviticus 10:18
    ref: Leviticus 10:18
    book: Lev
    section: torah
    chapter: 10
    verse: 18
    ordinal: 2993
    text: Behold, the blood of it was not brought into the sanctuary within; ye should certainly have eaten it in the sanctuary, as I commanded.’
    translation: JPS 1917
    original: הֵן לֹא־הוּבָא אֶת־דָּמָהּ אֶל־הַקֹּדֶשׁ פְּנִימָה אָכוֹל תֹּאכְלוּ אֹתָהּ בַּקֹּדֶשׁ כַּאֲשֶׁר צִוֵּיתִי׃
    hebrewPlain: הן לא הובא את דמה אל הקדש פנימה אכול תאכלו אתה בקדש כאשר צויתי
    parashah: Shmini
    kjvRefs:
    - Leviticus 10:18
    kjvOsis:
    - Lev.10.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.10
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: shmini
- type: TanakhVerse
  data:
    osis: Lev.10.19
    scripture: tanakh
    name: Tanakh Leviticus 10:19
    ref: Leviticus 10:19
    book: Lev
    section: torah
    chapter: 10
    verse: 19
    ordinal: 2994
    text: 'And Aaron spoke unto Moses: ‘Behold, this day have they offered their sin-offering and their burnt-offering before the LORD, and there have befallen me such things as these; and if I had eaten the sin-offering to-day, would it have been well-pleasing in the sight of the LORD?'
    translation: JPS 1917
    original: וַיְדַבֵּר אַהֲרֹן אֶל־מֹשֶׁה הֵן הַיּוֹם הִקְרִיבוּ אֶת־חַטָּאתָם וְאֶת־עֹלָתָם לִפְנֵי יְהוָה וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה וְאָכַלְתִּי חַטָּאת הַיּוֹם הַיִּיטַב בְּעֵינֵי יְהוָה׃
    hebrewPlain: וידבר אהרן אל משה הן היום הקריבו את חטאתם ואת עלתם לפני יהוה ותקראנה אתי כאלה ואכלתי חטאת היום הייטב בעיני יהוה
    parashah: Shmini
    kjvRefs:
