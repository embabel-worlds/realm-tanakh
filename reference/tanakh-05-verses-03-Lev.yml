  data:
    osis: Lev.8.26
    scripture: tanakh
    name: Tanakh Leviticus 8:26
    ref: Leviticus 8:26
    book: Lev
    section: torah
    chapter: 8
    verse: 26
    ordinal: 2941
    text: And out of the basket of unleavened bread, that was before the LORD, he took one unleavened cake, and one cake of oiled bread, and one wafer, and placed them on the fat, and upon the right thigh.
    translation: JPS 1917
    original: וּמִסַּל הַמַּצּוֹת אֲשֶׁר לִפְנֵי יְהוָה לָקַח חַלַּת מַצָּה אַחַת וְחַלַּת לֶחֶם שֶׁמֶן אַחַת וְרָקִיק אֶחָד וַיָּשֶׂם עַל־הַחֲלָבִים וְעַל שׁוֹק הַיָּמִין׃
    hebrewPlain: ומסל המצות אשר לפני יהוה לקח חלת מצה אחת וחלת לחם שמן אחת ורקיק אחד וישם על החלבים ועל שוק הימין
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:26
    kjvOsis:
    - Lev.8.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
