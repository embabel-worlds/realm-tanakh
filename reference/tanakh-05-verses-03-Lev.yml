- type: TanakhVerse
  data:
    osis: Lev.7.25
    scripture: tanakh
    name: Tanakh Leviticus 7:25
    ref: Leviticus 7:25
    book: Lev
    section: torah
    chapter: 7
    verse: 25
    ordinal: 2902
    text: For whosoever eateth the fat of the beast, of which men present an offering made by fire unto the LORD, even the soul that eateth it shall be cut off from his people.
    translation: JPS 1917
    original: כִּי כָּל־אֹכֵל חֵלֶב מִן־הַבְּהֵמָה אֲשֶׁר יַקְרִיב מִמֶּנָּה אִשֶּׁה לַיהוָה וְנִכְרְתָה הַנֶּפֶשׁ הָאֹכֶלֶת מֵעַמֶּיהָ׃
    hebrewPlain: כי כל אכל חלב מן הבהמה אשר יקריב ממנה אשה ליהוה ונכרתה הנפש האכלת מעמיה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:25
    kjvOsis:
    - Lev.7.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.7
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.7.26
    scripture: tanakh
    name: Tanakh Leviticus 7:26
    ref: Leviticus 7:26
    book: Lev
    section: torah
    chapter: 7
    verse: 26
    ordinal: 2903
    text: And ye shall eat no manner of blood, whether it be of fowl or of beast, in any of your dwellings.
    translation: JPS 1917
    original: וְכָל־דָּם לֹא תֹאכְלוּ בְּכֹל מוֹשְׁבֹתֵיכֶם לָעוֹף וְלַבְּהֵמָה׃
    hebrewPlain: וכל דם לא תאכלו בכל מושבתיכם לעוף ולבהמה
    parashah: Tzav
    kjvRefs:
    - Leviticus 7:26
    kjvOsis:
    - Lev.7.26
