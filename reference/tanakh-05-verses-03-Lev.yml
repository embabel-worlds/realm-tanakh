  data:
    osis: Lev.6.2
    scripture: tanakh
    name: Tanakh Leviticus 6:2
    ref: Leviticus 6:2
    book: Lev
    section: torah
    chapter: 6
    verse: 2
    ordinal: 2856
    text: 'Command Aaron and his sons, saying: This is the law of the burnt-offering: it is that which goeth up on its firewood upon the altar all night unto the morning; and the fire of the altar shall be kept burning thereby.'
    translation: JPS 1917
    original: צַו אֶת־אַהֲרֹן וְאֶת־בָּנָיו לֵאמֹר זֹאת תּוֹרַת הָעֹלָה הִוא הָעֹלָה עַל מוֹקְדָה עַל־הַמִּזְבֵּחַ כָּל־הַלַּיְלָה עַד־הַבֹּקֶר וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ׃
    hebrewPlain: צו את אהרן ואת בניו לאמר זאת תורת העלה הוא העלה על מוקדה על המזבח כל הלילה עד הבקר ואש המזבח תוקד בו
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:9
    kjvOsis:
    - Lev.6.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.6.3
    scripture: tanakh
    name: Tanakh Leviticus 6:3
    ref: Leviticus 6:3
    book: Lev
    section: torah
    chapter: 6
    verse: 3
    ordinal: 2857
    text: And the priest shall put on his linen garment, and his linen breeches shall he put upon his flesh; and he shall take up the ashes whereto the fire hath consumed the burnt-offering on the altar, and he shall put them beside the altar.
    translation: JPS 1917
    original: וְלָבַשׁ הַכֹּהֵן מִדּוֹ בַד וּמִכְנְסֵי־בַד יִלְבַּשׁ עַל־בְּשָׂרוֹ וְהֵרִים אֶת־הַדֶּשֶׁן אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת־הָעֹלָה עַל־הַמִּזְבֵּחַ וְשָׂמוֹ אֵצֶל הַמִּזְבֵּחַ׃
    hebrewPlain: ולבש הכהן מדו בד ומכנסי בד ילבש על בשרו והרים את הדשן אשר תאכל האש את העלה על המזבח ושמו אצל המזבח
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:10
    kjvOsis:
    - Lev.6.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.6.4
    scripture: tanakh
    name: Tanakh Leviticus 6:4
    ref: Leviticus 6:4
    book: Lev
    section: torah
    chapter: 6
    verse: 4
    ordinal: 2858
    text: And he shall put off his garments, and put on other garments, and carry forth the ashes without the camp unto a clean place.
    translation: JPS 1917
    original: וּפָשַׁט אֶת־בְּגָדָיו וְלָבַשׁ בְּגָדִים אֲחֵרִים וְהוֹצִיא אֶת־הַדֶּשֶׁן אֶל־מִחוּץ לַמַּחֲנֶה אֶל־מָקוֹם טָהוֹר׃
    hebrewPlain: ופשט את בגדיו ולבש בגדים אחרים והוציא את הדשן אל מחוץ למחנה אל מקום טהור
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:11
    kjvOsis:
    - Lev.6.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.6
  - predicate: IN_PORTION
    to:
