  data:
    osis: Lev.6.6
    scripture: tanakh
    name: Tanakh Leviticus 6:6
    ref: Leviticus 6:6
    book: Lev
    section: torah
    chapter: 6
    verse: 6
    ordinal: 2860
    text: Fire shall be kept burning upon the altar continually; it shall not go out.
    translation: JPS 1917
    original: אֵשׁ תָּמִיד תּוּקַד עַל־הַמִּזְבֵּחַ לֹא תִכְבֶה׃
    hebrewPlain: אש תמיד תוקד על המזבח לא תכבה
    parashah: Tzav
    kjvRefs:
    - Leviticus 6:13
    kjvOsis:
