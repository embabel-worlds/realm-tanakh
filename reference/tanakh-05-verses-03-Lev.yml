  data:
    osis: Lev.18.24
    scripture: tanakh
    name: Tanakh Leviticus 18:24
    ref: Leviticus 18:24
    book: Lev
    section: torah
    chapter: 18
    verse: 24
    ordinal: 3273
    text: Defile not ye yourselves in any of these things; for in all these the nations are defiled, which I cast out from before you.
    translation: JPS 1917
    original: אַל־תִּטַּמְּאוּ בְּכָל־אֵלֶּה כִּי בְכָל־אֵלֶּה נִטְמְאוּ הַגּוֹיִם אֲשֶׁר־אֲנִי מְשַׁלֵּחַ מִפְּנֵיכֶם׃
    hebrewPlain: אל תטמאו בכל אלה כי בכל אלה נטמאו הגוים אשר אני משלח מפניכם
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 18:24
    kjvOsis:
    - Lev.18.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.18
  - predicate: IN_PORTION
    to:
