  data:
    osis: Lev.8.6
    scripture: tanakh
    name: Tanakh Leviticus 8:6
    ref: Leviticus 8:6
    book: Lev
    section: torah
    chapter: 8
    verse: 6
    ordinal: 2921
    text: And Moses brought Aaron and his sons, and washed them with water.
    translation: JPS 1917
    original: וַיַּקְרֵב מֹשֶׁה אֶת־אַהֲרֹן וְאֶת־בָּנָיו וַיִּרְחַץ אֹתָם בַּמָּיִם׃
    hebrewPlain: ויקרב משה את אהרן ואת בניו וירחץ אתם במים
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:6
    kjvOsis:
    - Lev.8.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.7
    scripture: tanakh
    name: Tanakh Leviticus 8:7
    ref: Leviticus 8:7
    book: Lev
    section: torah
    chapter: 8
    verse: 7
    ordinal: 2922
    text: And he put upon him the tunic, and girded him with the girdle, and clothed him with the robe, and put the ephod upon him, and he girded him with the skilfully woven band of the ephod, and bound it unto him therewith.
    translation: JPS 1917
    original: וַיִּתֵּן עָלָיו אֶת־הַכֻּתֹּנֶת וַיַּחְגֹּר אֹתוֹ בָּאַבְנֵט וַיַּלְבֵּשׁ אֹתוֹ אֶת־הַמְּעִיל וַיִּתֵּן עָלָיו אֶת־הָאֵפֹד וַיַּחְגֹּר אֹתוֹ בְּחֵשֶׁב הָאֵפֹד וַיֶּאְפֹּד לוֹ בּוֹ׃
    hebrewPlain: ויתן עליו את הכתנת ויחגר אתו באבנט וילבש אתו את המעיל ויתן עליו את האפד ויחגר אתו בחשב האפד ויאפד לו בו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:7
    kjvOsis:
    - Lev.8.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.8
    scripture: tanakh
    name: Tanakh Leviticus 8:8
    ref: Leviticus 8:8
    book: Lev
    section: torah
    chapter: 8
    verse: 8
    ordinal: 2923
    text: And he placed the breastplate upon him; and in the breastplate he put the Urim and the Thummim.
    translation: JPS 1917
    original: וַיָּשֶׂם עָלָיו אֶת־הַחֹשֶׁן וַיִּתֵּן אֶל־הַחֹשֶׁן אֶת־הָאוּרִים וְאֶת־הַתֻּמִּים׃
    hebrewPlain: וישם עליו את החשן ויתן אל החשן את האורים ואת התמים
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:8
    kjvOsis:
    - Lev.8.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.9
    scripture: tanakh
    name: Tanakh Leviticus 8:9
    ref: Leviticus 8:9
    book: Lev
    section: torah
    chapter: 8
    verse: 9
    ordinal: 2924
    text: And he set the mitre upon his head; and upon the mitre, in front, did he set the golden plate, the holy crown; as the LORD commanded Moses.
    translation: JPS 1917
    original: וַיָּשֶׂם אֶת־הַמִּצְנֶפֶת עַל־רֹאשׁוֹ וַיָּשֶׂם עַל־הַמִּצְנֶפֶת אֶל־מוּל פָּנָיו אֵת צִיץ הַזָּהָב נֵזֶר הַקֹּדֶשׁ כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: וישם את המצנפת על ראשו וישם על המצנפת אל מול פניו את ציץ הזהב נזר הקדש כאשר צוה יהוה את משה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:9
    kjvOsis:
    - Lev.8.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.10
    scripture: tanakh
    name: Tanakh Leviticus 8:10
    ref: Leviticus 8:10
    book: Lev
    section: torah
    chapter: 8
    verse: 10
    ordinal: 2925
    text: And Moses took the anointing oil, and anointed the tabernacle and all that was therein, and sanctified them.
    translation: JPS 1917
    original: וַיִּקַּח מֹשֶׁה אֶת־שֶׁמֶן הַמִּשְׁחָה וַיִּמְשַׁח אֶת־הַמִּשְׁכָּן וְאֶת־כָּל־אֲשֶׁר־בּוֹ וַיְקַדֵּשׁ אֹתָם׃
    hebrewPlain: ויקח משה את שמן המשחה וימשח את המשכן ואת כל אשר בו ויקדש אתם
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:10
    kjvOsis:
    - Lev.8.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.11
    scripture: tanakh
    name: Tanakh Leviticus 8:11
    ref: Leviticus 8:11
    book: Lev
    section: torah
    chapter: 8
    verse: 11
    ordinal: 2926
    text: And he sprinkled thereof upon the altar seven times, and anointed the altar and all its vessels, and the laver and its base, to sanctify them.
    translation: JPS 1917
    original: וַיַּז מִמֶּנּוּ עַל־הַמִּזְבֵּחַ שֶׁבַע פְּעָמִים וַיִּמְשַׁח אֶת־הַמִּזְבֵּחַ וְאֶת־כָּל־כֵּלָיו וְאֶת־הַכִּיֹּר וְאֶת־כַּנּוֹ לְקַדְּשָׁם׃
    hebrewPlain: ויז ממנו על המזבח שבע פעמים וימשח את המזבח ואת כל כליו ואת הכיר ואת כנו לקדשם
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:11
    kjvOsis:
    - Lev.8.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.12
    scripture: tanakh
    name: Tanakh Leviticus 8:12
    ref: Leviticus 8:12
    book: Lev
    section: torah
    chapter: 8
    verse: 12
    ordinal: 2927
    text: And he poured of the anointing oil upon Aaron’s head, and anointed him, to sanctify him.
    translation: JPS 1917
    original: וַיִּצֹק מִשֶּׁמֶן הַמִּשְׁחָה עַל רֹאשׁ אַהֲרֹן וַיִּמְשַׁח אֹתוֹ לְקַדְּשׁוֹ׃
    hebrewPlain: ויצק משמן המשחה על ראש אהרן וימשח אתו לקדשו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:12
    kjvOsis:
    - Lev.8.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.13
    scripture: tanakh
    name: Tanakh Leviticus 8:13
    ref: Leviticus 8:13
    book: Lev
    section: torah
    chapter: 8
    verse: 13
    ordinal: 2928
    text: And Moses brought Aaron’s sons, and clothed them with tunics, and girded them with girdles, and bound head-tires upon them; as the LORD commanded Moses.
    translation: JPS 1917
    original: וַיַּקְרֵב מֹשֶׁה אֶת־בְּנֵי אַהֲרֹן וַיַּלְבִּשֵׁם כֻּתֳּנֹת וַיַּחְגֹּר אֹתָם אַבְנֵט וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה׃
    hebrewPlain: ויקרב משה את בני אהרן וילבשם כתנת ויחגר אתם אבנט ויחבש להם מגבעות כאשר צוה יהוה את משה
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:13
    kjvOsis:
    - Lev.8.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.14
    scripture: tanakh
    name: Tanakh Leviticus 8:14
    ref: Leviticus 8:14
    book: Lev
    section: torah
    chapter: 8
    verse: 14
    ordinal: 2929
    text: And the bullock of the sin-offering was brought; and Aaron and his sons laid their hands upon the head of the bullock of the sin-offering.
    translation: JPS 1917
    original: וַיַּגֵּשׁ אֵת פַּר הַחַטָּאת וַיִּסְמֹךְ אַהֲרֹן וּבָנָיו אֶת־יְדֵיהֶם עַל־רֹאשׁ פַּר הַחַטָּאת׃
    hebrewPlain: ויגש את פר החטאת ויסמך אהרן ובניו את ידיהם על ראש פר החטאת
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:14
    kjvOsis:
    - Lev.8.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.8
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: tzav
- type: TanakhVerse
  data:
    osis: Lev.8.15
    scripture: tanakh
    name: Tanakh Leviticus 8:15
    ref: Leviticus 8:15
    book: Lev
    section: torah
    chapter: 8
    verse: 15
    ordinal: 2930
    text: And when it was slain, Moses took the blood, and put it upon the horns of the altar round about with his finger, and purified the altar, and poured out the remaining blood at the base of the altar, and sanctified it, to make atonement for it.
    translation: JPS 1917
    original: וַיִּשְׁחָט וַיִּקַּח מֹשֶׁה אֶת־הַדָּם וַיִּתֵּן עַל־קַרְנוֹת הַמִּזְבֵּחַ סָבִיב בְּאֶצְבָּעוֹ וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ וְאֶת־הַדָּם יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ וַיְקַדְּשֵׁהוּ לְכַפֵּר עָלָיו׃
    hebrewPlain: וישחט ויקח משה את הדם ויתן על קרנות המזבח סביב באצבעו ויחטא את המזבח ואת הדם יצק אל יסוד המזבח ויקדשהו לכפר עליו
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:15
    kjvOsis:
    - Lev.8.15
