  data:
    osis: Lev.20.12
    scripture: tanakh
    name: Tanakh Leviticus 20:12
    ref: Leviticus 20:12
    book: Lev
    section: torah
    chapter: 20
    verse: 12
    ordinal: 3328
    text: And if a man lie with his daughter-in-law, both of them shall surely be put to death; they have wrought corruption; their blood shall be upon them.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִשְׁכַּב אֶת־כַּלָּתוֹ מוֹת יוּמְתוּ שְׁנֵיהֶם תֶּבֶל עָשׂוּ דְּמֵיהֶם בָּם׃
    hebrewPlain: ואיש אשר ישכב את כלתו מות יומתו שניהם תבל עשו דמיהם בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:12
    kjvOsis:
    - Lev.20.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
    to:
