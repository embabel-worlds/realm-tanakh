- type: TanakhVerse
  data:
    osis: Lev.20.13
    scripture: tanakh
    name: Tanakh Leviticus 20:13
    ref: Leviticus 20:13
    book: Lev
    section: torah
    chapter: 20
    verse: 13
    ordinal: 3329
    text: 'And if a man lie with mankind, as with womankind, both of them have committed abomination: they shall surely be put to death; their blood shall be upon them.'
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִשְׁכַּב אֶת־זָכָר מִשְׁכְּבֵי אִשָּׁה תּוֹעֵבָה עָשׂוּ שְׁנֵיהֶם מוֹת יוּמָתוּ דְּמֵיהֶם בָּם׃
    hebrewPlain: ואיש אשר ישכב את זכר משכבי אשה תועבה עשו שניהם מות יומתו דמיהם בם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 20:13
    kjvOsis:
    - Lev.20.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.20
  - predicate: IN_PORTION
