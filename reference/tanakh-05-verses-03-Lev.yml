- type: TanakhVerse
  data:
    osis: Lev.14.27
    scripture: tanakh
    name: Tanakh Leviticus 14:27
    ref: Leviticus 14:27
    book: Lev
    section: torah
    chapter: 14
    verse: 27
    ordinal: 3136
    text: And the priest shall sprinkle with his right finger some of the oil that is in his left hand seven times before the LORD.
    translation: JPS 1917
    original: וְהִזָּה הַכֹּהֵן בְּאֶצְבָּעוֹ הַיְמָנִית מִן־הַשֶּׁמֶן אֲשֶׁר עַל־כַּפּוֹ הַשְּׂמָאלִית שֶׁבַע פְּעָמִים לִפְנֵי יְהוָה׃
    hebrewPlain: והזה הכהן באצבעו הימנית מן השמן אשר על כפו השמאלית שבע פעמים לפני יהוה
    parashah: Metzora
    kjvRefs:
    - Leviticus 14:27
    kjvOsis:
    - Lev.14.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.14
  - predicate: IN_PORTION
    to:
