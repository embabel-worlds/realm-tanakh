  data:
    osis: Lev.19.2
    scripture: tanakh
    name: Tanakh Leviticus 19:2
    ref: Leviticus 19:2
    book: Lev
    section: torah
    chapter: 19
    verse: 2
    ordinal: 3281
    text: 'Speak unto all the congregation of the children of Israel, and say unto them: Ye shall be holy; for I the LORD your God am holy.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם קְדֹשִׁים תִּהְיוּ כִּי קָדוֹשׁ אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: דבר אל כל עדת בני ישראל ואמרת אלהם קדשים תהיו כי קדוש אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:2
    kjvOsis:
    - Lev.19.2
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.3
    scripture: tanakh
    name: Tanakh Leviticus 19:3
    ref: Leviticus 19:3
    book: Lev
    section: torah
    chapter: 19
    verse: 3
    ordinal: 3282
    text: 'Ye shall fear every man his mother, and his father, and ye shall keep My sabbaths: I am the LORD your God.'
    translation: JPS 1917
    original: אִישׁ אִמּוֹ וְאָבִיו תִּירָאוּ וְאֶת־שַׁבְּתֹתַי תִּשְׁמֹרוּ אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: איש אמו ואביו תיראו ואת שבתתי תשמרו אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:3
    kjvOsis:
    - Lev.19.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.4
    scripture: tanakh
    name: Tanakh Leviticus 19:4
    ref: Leviticus 19:4
    book: Lev
    section: torah
    chapter: 19
    verse: 4
    ordinal: 3283
    text: 'Turn ye not unto the idols, nor make to yourselves molten gods: I am the LORD your God.'
    translation: JPS 1917
    original: אַל־תִּפְנוּ אֶל־הָאֱלִילִים וֵאלֹהֵי מַסֵּכָה לֹא תַעֲשׂוּ לָכֶם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: אל תפנו אל האלילים ואלהי מסכה לא תעשו לכם אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:4
    kjvOsis:
    - Lev.19.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.5
    scripture: tanakh
    name: Tanakh Leviticus 19:5
    ref: Leviticus 19:5
    book: Lev
    section: torah
    chapter: 19
    verse: 5
    ordinal: 3284
    text: And when ye offer a sacrifice of peace-offerings unto the LORD, ye shall offer it that ye may be accepted.
    translation: JPS 1917
    original: וְכִי תִזְבְּחוּ זֶבַח שְׁלָמִים לַיהוָה לִרְצֹנְכֶם תִּזְבָּחֻהוּ׃
    hebrewPlain: וכי תזבחו זבח שלמים ליהוה לרצנכם תזבחהו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:5
    kjvOsis:
    - Lev.19.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.6
    scripture: tanakh
    name: Tanakh Leviticus 19:6
    ref: Leviticus 19:6
    book: Lev
    section: torah
    chapter: 19
    verse: 6
    ordinal: 3285
    text: It shall be eaten the same day ye offer it, and on the morrow; and if aught remain until the third day, it shall be burnt with fire.
    translation: JPS 1917
    original: בְּיוֹם זִבְחֲכֶם יֵאָכֵל וּמִמָּחֳרָת וְהַנּוֹתָר עַד־יוֹם הַשְּׁלִישִׁי בָּאֵשׁ יִשָּׂרֵף׃
    hebrewPlain: ביום זבחכם יאכל וממחרת והנותר עד יום השלישי באש ישרף
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:6
    kjvOsis:
    - Lev.19.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.7
    scripture: tanakh
    name: Tanakh Leviticus 19:7
    ref: Leviticus 19:7
    book: Lev
    section: torah
    chapter: 19
    verse: 7
    ordinal: 3286
    text: And if it be eaten at all on the third day, it is a vile thing; it shall not be accepted.
    translation: JPS 1917
    original: וְאִם הֵאָכֹל יֵאָכֵל בַּיּוֹם הַשְּׁלִישִׁי פִּגּוּל הוּא לֹא יֵרָצֶה׃
    hebrewPlain: ואם האכל יאכל ביום השלישי פגול הוא לא ירצה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:7
    kjvOsis:
    - Lev.19.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.8
    scripture: tanakh
    name: Tanakh Leviticus 19:8
    ref: Leviticus 19:8
    book: Lev
    section: torah
    chapter: 19
    verse: 8
    ordinal: 3287
    text: But every one that eateth it shall bear his iniquity, because he hath profaned the holy thing of the LORD; and that soul shall be cut off from his people.
    translation: JPS 1917
    original: וְאֹכְלָיו עֲוֺנוֹ יִשָּׂא כִּי־אֶת־קֹדֶשׁ יְהוָה חִלֵּל וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ׃
    hebrewPlain: ואכליו עונו ישא כי את קדש יהוה חלל ונכרתה הנפש ההוא מעמיה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:8
    kjvOsis:
    - Lev.19.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.9
    scripture: tanakh
    name: Tanakh Leviticus 19:9
    ref: Leviticus 19:9
    book: Lev
    section: torah
    chapter: 19
    verse: 9
    ordinal: 3288
    text: And when ye reap the harvest of your land, thou shalt not wholly reap the corner of thy field, neither shalt thou gather the gleaning of thy harvest.
    translation: JPS 1917
    original: וּבְקֻצְרְכֶם אֶת־קְצִיר אַרְצְכֶם לֹא תְכַלֶּה פְּאַת שָׂדְךָ לִקְצֹר וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט׃
    hebrewPlain: ובקצרכם את קציר ארצכם לא תכלה פאת שדך לקצר ולקט קצירך לא תלקט
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:9
    kjvOsis:
    - Lev.19.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.10
    scripture: tanakh
    name: Tanakh Leviticus 19:10
    ref: Leviticus 19:10
    book: Lev
    section: torah
    chapter: 19
    verse: 10
    ordinal: 3289
    text: 'And thou shalt not glean thy vineyard, neither shalt thou gather the fallen fruit of thy vineyard; thou shalt leave them for the poor and for the stranger: I am the LORD your God.'
    translation: JPS 1917
    original: וְכַרְמְךָ לֹא תְעוֹלֵל וּפֶרֶט כַּרְמְךָ לֹא תְלַקֵּט לֶעָנִי וְלַגֵּר תַּעֲזֹב אֹתָם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: וכרמך לא תעולל ופרט כרמך לא תלקט לעני ולגר תעזב אתם אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:10
    kjvOsis:
    - Lev.19.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.11
    scripture: tanakh
    name: Tanakh Leviticus 19:11
    ref: Leviticus 19:11
    book: Lev
    section: torah
    chapter: 19
    verse: 11
    ordinal: 3290
    text: Ye shall not steal; neither shall ye deal falsely, nor lie one to another.
    translation: JPS 1917
    original: לֹא תִּגְנֹבוּ וְלֹא־תְכַחֲשׁוּ וְלֹא־תְשַׁקְּרוּ אִישׁ בַּעֲמִיתוֹ׃
    hebrewPlain: לא תגנבו ולא תכחשו ולא תשקרו איש בעמיתו
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:11
    kjvOsis:
    - Lev.19.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.12
    scripture: tanakh
    name: Tanakh Leviticus 19:12
    ref: Leviticus 19:12
    book: Lev
    section: torah
    chapter: 19
    verse: 12
    ordinal: 3291
    text: 'And ye shall not swear by My name falsely, so that thou profane the name of thy God: I am the LORD.'
    translation: JPS 1917
    original: וְלֹא־תִשָּׁבְעוּ בִשְׁמִי לַשָּׁקֶר וְחִלַּלְתָּ אֶת־שֵׁם אֱלֹהֶיךָ אֲנִי יְהוָה׃
    hebrewPlain: ולא תשבעו בשמי לשקר וחללת את שם אלהיך אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:12
    kjvOsis:
    - Lev.19.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.13
    scripture: tanakh
    name: Tanakh Leviticus 19:13
    ref: Leviticus 19:13
    book: Lev
    section: torah
    chapter: 19
    verse: 13
    ordinal: 3292
    text: Thou shalt not oppress thy neighbour, nor rob him; the wages of a hired servant shall not abide with thee all night until the morning.
    translation: JPS 1917
    original: לֹא־תַעֲשֹׁק אֶת־רֵעֲךָ וְלֹא תִגְזֹל לֹא־תָלִין פְּעֻלַּת שָׂכִיר אִתְּךָ עַד־בֹּקֶר׃
    hebrewPlain: לא תעשק את רעך ולא תגזל לא תלין פעלת שכיר אתך עד בקר
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:13
    kjvOsis:
    - Lev.19.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.14
    scripture: tanakh
    name: Tanakh Leviticus 19:14
    ref: Leviticus 19:14
    book: Lev
    section: torah
    chapter: 19
    verse: 14
    ordinal: 3293
    text: 'Thou shalt not curse the deaf, nor put a stumbling-block before the blind, but thou shalt fear thy God: I am the LORD.'
    translation: JPS 1917
    original: לֹא־תְקַלֵּל חֵרֵשׁ וְלִפְנֵי עִוֵּר לֹא תִתֵּן מִכְשֹׁל וְיָרֵאתָ מֵּאֱלֹהֶיךָ אֲנִי יְהוָה׃
    hebrewPlain: לא תקלל חרש ולפני עור לא תתן מכשל ויראת מאלהיך אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:14
    kjvOsis:
    - Lev.19.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.15
    scripture: tanakh
    name: Tanakh Leviticus 19:15
    ref: Leviticus 19:15
    book: Lev
    section: torah
    chapter: 19
    verse: 15
    ordinal: 3294
    text: Ye shall do no unrighteousness in judgment; thou shalt not respect the person of the poor, nor favour the person of the mighty; but in righteousness shalt thou judge thy neighbour.
    translation: JPS 1917
    original: לֹא־תַעֲשׂוּ עָוֶל בַּמִּשְׁפָּט לֹא־תִשָּׂא פְנֵי־דָל וְלֹא תֶהְדַּר פְּנֵי גָדוֹל בְּצֶדֶק תִּשְׁפֹּט עֲמִיתֶךָ׃
    hebrewPlain: לא תעשו עול במשפט לא תשא פני דל ולא תהדר פני גדול בצדק תשפט עמיתך
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:15
    kjvOsis:
    - Lev.19.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.16
    scripture: tanakh
    name: Tanakh Leviticus 19:16
    ref: Leviticus 19:16
    book: Lev
    section: torah
    chapter: 19
    verse: 16
    ordinal: 3295
    text: 'Thou shalt not go up and down as a talebearer among thy people; neither shalt thou stand idly by the blood of thy neighbour: I am the LORD.'
    translation: JPS 1917
    original: לֹא־תֵלֵךְ רָכִיל בְּעַמֶּיךָ לֹא תַעֲמֹד עַל־דַּם רֵעֶךָ אֲנִי יְהוָה׃
    hebrewPlain: לא תלך רכיל בעמיך לא תעמד על דם רעך אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:16
    kjvOsis:
    - Lev.19.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.17
    scripture: tanakh
    name: Tanakh Leviticus 19:17
    ref: Leviticus 19:17
    book: Lev
    section: torah
    chapter: 19
    verse: 17
    ordinal: 3296
    text: Thou shalt not hate thy brother in thy heart; thou shalt surely rebuke thy neighbour, and not bear sin because of him.
    translation: JPS 1917
    original: לֹא־תִשְׂנָא אֶת־אָחִיךָ בִּלְבָבֶךָ הוֹכֵחַ תּוֹכִיחַ אֶת־עֲמִיתֶךָ וְלֹא־תִשָּׂא עָלָיו חֵטְא׃
    hebrewPlain: לא תשנא את אחיך בלבבך הוכח תוכיח את עמיתך ולא תשא עליו חטא
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:17
    kjvOsis:
    - Lev.19.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.18
    scripture: tanakh
    name: Tanakh Leviticus 19:18
    ref: Leviticus 19:18
    book: Lev
    section: torah
    chapter: 19
    verse: 18
    ordinal: 3297
    text: 'Thou shalt not take vengeance, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I am the LORD.'
    translation: JPS 1917
    original: לֹא־תִקֹּם וְלֹא־תִטֹּר אֶת־בְּנֵי עַמֶּךָ וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ אֲנִי יְהוָה׃
    hebrewPlain: לא תקם ולא תטר את בני עמך ואהבת לרעך כמוך אני יהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:18
    kjvOsis:
    - Lev.19.18
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.19
    scripture: tanakh
    name: Tanakh Leviticus 19:19
    ref: Leviticus 19:19
    book: Lev
    section: torah
    chapter: 19
    verse: 19
    ordinal: 3298
    text: Ye shall keep My statutes. Thou shalt not let thy cattle gender with a diverse kind; thou shalt not sow thy field with two kinds of seed; neither shall there come upon thee a garment of two kinds of stuff mingled together.
    translation: JPS 1917
    original: אֶת־חֻקֹּתַי תִּשְׁמֹרוּ בְּהֶמְתְּךָ לֹא־תַרְבִּיעַ כִּלְאַיִם שָׂדְךָ לֹא־תִזְרַע כִּלְאָיִם וּבֶגֶד כִּלְאַיִם שַׁעַטְנֵז לֹא יַעֲלֶה עָלֶיךָ׃
    hebrewPlain: את חקתי תשמרו בהמתך לא תרביע כלאים שדך לא תזרע כלאים ובגד כלאים שעטנז לא יעלה עליך
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:19
    kjvOsis:
    - Lev.19.19
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.20
    scripture: tanakh
    name: Tanakh Leviticus 19:20
    ref: Leviticus 19:20
    book: Lev
    section: torah
    chapter: 19
    verse: 20
    ordinal: 3299
    text: And whosoever lieth carnally with a woman, that is a bondmaid, designated for a man, and not at all redeemed, nor was freedom given her; there shall be inquisition; they shall not be put to death, because she was not free.
    translation: JPS 1917
    original: וְאִישׁ כִּי־יִשְׁכַּב אֶת־אִשָּׁה שִׁכְבַת־זֶרַע וְהִוא שִׁפְחָה נֶחֱרֶפֶת לְאִישׁ וְהָפְדֵּה לֹא נִפְדָּתָה אוֹ חֻפְשָׁה לֹא נִתַּן־לָהּ בִּקֹּרֶת תִּהְיֶה לֹא יוּמְתוּ כִּי־לֹא חֻפָּשָׁה׃
    hebrewPlain: ואיש כי ישכב את אשה שכבת זרע והוא שפחה נחרפת לאיש והפדה לא נפדתה או חפשה לא נתן לה בקרת תהיה לא יומתו כי לא חפשה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:20
    kjvOsis:
    - Lev.19.20
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.21
    scripture: tanakh
    name: Tanakh Leviticus 19:21
    ref: Leviticus 19:21
    book: Lev
    section: torah
    chapter: 19
    verse: 21
    ordinal: 3300
    text: And he shall bring his forfeit unto the LORD, unto the door of the tent of meeting, even a ram for a guilt-offering.
    translation: JPS 1917
    original: וְהֵבִיא אֶת־אֲשָׁמוֹ לַיהוָה אֶל־פֶּתַח אֹהֶל מוֹעֵד אֵיל אָשָׁם׃
    hebrewPlain: והביא את אשמו ליהוה אל פתח אהל מועד איל אשם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:21
    kjvOsis:
    - Lev.19.21
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.22
    scripture: tanakh
    name: Tanakh Leviticus 19:22
    ref: Leviticus 19:22
    book: Lev
    section: torah
    chapter: 19
    verse: 22
    ordinal: 3301
    text: And the priest shall make atonement for him with the ram of the guilt-offering before the LORD for his sin which he hath sinned; and he shall be forgiven for his sin which he hath sinned.
    translation: JPS 1917
    original: וְכִפֶּר עָלָיו הַכֹּהֵן בְּאֵיל הָאָשָׁם לִפְנֵי יְהוָה עַל־חַטָּאתוֹ אֲשֶׁר חָטָא וְנִסְלַח לוֹ מֵחַטָּאתוֹ אֲשֶׁר חָטָא׃
    hebrewPlain: וכפר עליו הכהן באיל האשם לפני יהוה על חטאתו אשר חטא ונסלח לו מחטאתו אשר חטא
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:22
    kjvOsis:
    - Lev.19.22
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.23
    scripture: tanakh
    name: Tanakh Leviticus 19:23
    ref: Leviticus 19:23
    book: Lev
    section: torah
    chapter: 19
    verse: 23
    ordinal: 3302
    text: And when ye shall come into the land, and shall have planted all manner of trees for food, then ye shall count the fruit thereof as forbidden; three years shall it be as forbidden unto you; it shall not be eaten.
    translation: JPS 1917
    original: וְכִי־תָבֹאוּ אֶל־הָאָרֶץ וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים לֹא יֵאָכֵל׃
    hebrewPlain: וכי תבאו אל הארץ ונטעתם כל עץ מאכל וערלתם ערלתו את פריו שלש שנים יהיה לכם ערלים לא יאכל
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:23
    kjvOsis:
    - Lev.19.23
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.24
    scripture: tanakh
    name: Tanakh Leviticus 19:24
    ref: Leviticus 19:24
    book: Lev
    section: torah
    chapter: 19
    verse: 24
    ordinal: 3303
    text: And in the fourth year all the fruit thereof shall be holy, for giving praise unto the LORD.
    translation: JPS 1917
    original: וּבַשָּׁנָה הָרְבִיעִת יִהְיֶה כָּל־פִּרְיוֹ קֹדֶשׁ הִלּוּלִים לַיהוָה׃
    hebrewPlain: ובשנה הרביעת יהיה כל פריו קדש הלולים ליהוה
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:24
    kjvOsis:
    - Lev.19.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.19
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: kedoshim
- type: TanakhVerse
  data:
    osis: Lev.19.25
    scripture: tanakh
    name: Tanakh Leviticus 19:25
    ref: Leviticus 19:25
    book: Lev
    section: torah
    chapter: 19
    verse: 25
    ordinal: 3304
    text: 'But in the fifth year may ye eat of the fruit thereof, that it may yield unto you more richly the increase thereof: I am the LORD your God.'
    translation: JPS 1917
    original: וּבַשָּׁנָה הַחֲמִישִׁת תֹּאכְלוּ אֶת־פִּרְיוֹ לְהוֹסִיף לָכֶם תְּבוּאָתוֹ אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: ובשנה החמישת תאכלו את פריו להוסיף לכם תבואתו אני יהוה אלהיכם
    parashah: Kedoshim
    kjvRefs:
    - Leviticus 19:25
    kjvOsis:
    - Lev.19.25
