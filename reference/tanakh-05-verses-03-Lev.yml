    scripture: tanakh
    name: Tanakh Leviticus 2:6
    ref: Leviticus 2:6
    book: Lev
    section: torah
    chapter: 2
    verse: 6
    ordinal: 2766
    text: Thou shalt break it in pieces, and pour oil thereon; it is a meal-offering.
    translation: JPS 1917
    original: פָּתוֹת אֹתָהּ פִּתִּים וְיָצַקְתָּ עָלֶיהָ שָׁמֶן מִנְחָה הִוא׃
    hebrewPlain: פתות אתה פתים ויצקת עליה שמן מנחה הוא
    parashah: Vayikra
    kjvRefs:
