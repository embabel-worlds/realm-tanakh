    ref: Leviticus 13:35
    book: Lev
    section: torah
    chapter: 13
    verse: 35
    ordinal: 3085
    text: But if the scall spread abroad in the skin after his cleansing,
    translation: JPS 1917
    original: וְאִם־פָּשֹׂה יִפְשֶׂה הַנֶּתֶק בָּעוֹר אַחֲרֵי טָהֳרָתוֹ׃
    hebrewPlain: ואם פשה יפשה הנתק בעור אחרי טהרתו
    parashah: Tazria
    kjvRefs:
