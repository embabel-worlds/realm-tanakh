      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.24
    scripture: tanakh
    name: Tanakh Leviticus 15:24
    ref: Leviticus 15:24
    book: Lev
    section: torah
    chapter: 15
    verse: 24
    ordinal: 3190
    text: And if any man lie with her, and her impurity be upon him, he shall be unclean seven days; and every bed whereon he lieth shall be unclean. .
    translation: JPS 1917
    original: וְאִם שָׁכֹב יִשְׁכַּב אִישׁ אֹתָהּ וּתְהִי נִדָּתָהּ עָלָיו וְטָמֵא שִׁבְעַת יָמִים וְכָל־הַמִּשְׁכָּב אֲשֶׁר־יִשְׁכַּב עָלָיו יִטְמָא׃
    hebrewPlain: ואם שכב ישכב איש אתה ותהי נדתה עליו וטמא שבעת ימים וכל המשכב אשר ישכב עליו יטמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:24
    kjvOsis:
    - Lev.15.24
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.25
    scripture: tanakh
    name: Tanakh Leviticus 15:25
    ref: Leviticus 15:25
    book: Lev
    section: torah
    chapter: 15
    verse: 25
    ordinal: 3191
    text: 'And if a woman have an issue of her blood many days not in the time of her impurity, or if she have an issue beyond the time of her impurity; all the days of the issue of her uncleanness she shall be as in the days of her impurity: she is unclean.'
    translation: JPS 1917
    original: וְאִשָּׁה כִּי־יָזוּב זוֹב דָּמָהּ יָמִים רַבִּים בְּלֹא עֶת־נִדָּתָהּ אוֹ כִי־תָזוּב עַל־נִדָּתָהּ כָּל־יְמֵי זוֹב טֻמְאָתָהּ כִּימֵי נִדָּתָהּ תִּהְיֶה טְמֵאָה הִוא׃
    hebrewPlain: ואשה כי יזוב זוב דמה ימים רבים בלא עת נדתה או כי תזוב על נדתה כל ימי זוב טמאתה כימי נדתה תהיה טמאה הוא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:25
    kjvOsis:
    - Lev.15.25
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.26
    scripture: tanakh
    name: Tanakh Leviticus 15:26
    ref: Leviticus 15:26
    book: Lev
    section: torah
    chapter: 15
    verse: 26
    ordinal: 3192
    text: Every bed whereon she lieth all the days of her issue shall be unto her as the bed of her impurity; and every thing whereon she sitteth shall be unclean, as the uncleanness of her impurity.
    translation: JPS 1917
    original: כָּל־הַמִּשְׁכָּב אֲשֶׁר־תִּשְׁכַּב עָלָיו כָּל־יְמֵי זוֹבָהּ כְּמִשְׁכַּב נִדָּתָהּ יִהְיֶה־לָּהּ וְכָל־הַכְּלִי אֲשֶׁר תֵּשֵׁב עָלָיו טָמֵא יִהְיֶה כְּטֻמְאַת נִדָּתָהּ׃
    hebrewPlain: כל המשכב אשר תשכב עליו כל ימי זובה כמשכב נדתה יהיה לה וכל הכלי אשר תשב עליו טמא יהיה כטמאת נדתה
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:26
    kjvOsis:
    - Lev.15.26
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.27
    scripture: tanakh
    name: Tanakh Leviticus 15:27
    ref: Leviticus 15:27
    book: Lev
    section: torah
    chapter: 15
    verse: 27
    ordinal: 3193
    text: And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־הַנּוֹגֵעַ בָּם יִטְמָא וְכִבֶּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל הנוגע בם יטמא וכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:27
    kjvOsis:
    - Lev.15.27
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.28
    scripture: tanakh
    name: Tanakh Leviticus 15:28
    ref: Leviticus 15:28
    book: Lev
    section: torah
    chapter: 15
    verse: 28
    ordinal: 3194
    text: But if she be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.
    translation: JPS 1917
    original: וְאִם־טָהֲרָה מִזּוֹבָהּ וְסָפְרָה לָּהּ שִׁבְעַת יָמִים וְאַחַר תִּטְהָר׃
    hebrewPlain: ואם טהרה מזובה וספרה לה שבעת ימים ואחר תטהר
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:28
    kjvOsis:
    - Lev.15.28
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.29
    scripture: tanakh
    name: Tanakh Leviticus 15:29
    ref: Leviticus 15:29
    book: Lev
    section: torah
    chapter: 15
    verse: 29
    ordinal: 3195
    text: And on the eighth day she shall take unto her two turtle-doves, or two young pigeons, and bring them unto the priest, to the door of the tent of meeting.
    translation: JPS 1917
    original: וּבַיּוֹם הַשְּׁמִינִי תִּקַּח־לָהּ שְׁתֵּי תֹרִים אוֹ שְׁנֵי בְּנֵי יוֹנָה וְהֵבִיאָה אוֹתָם אֶל־הַכֹּהֵן אֶל־פֶּתַח אֹהֶל מוֹעֵד׃
    hebrewPlain: וביום השמיני תקח לה שתי תרים או שני בני יונה והביאה אותם אל הכהן אל פתח אהל מועד
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:29
    kjvOsis:
    - Lev.15.29
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.30
    scripture: tanakh
    name: Tanakh Leviticus 15:30
    ref: Leviticus 15:30
    book: Lev
    section: torah
    chapter: 15
    verse: 30
    ordinal: 3196
    text: And the priest shall offer the one for a sin-offering, and the other for a burnt-offering; and the priest shall make atonement for her before the LORD for the issue of her uncleanness.
    translation: JPS 1917
    original: וְעָשָׂה הַכֹּהֵן אֶת־הָאֶחָד חַטָּאת וְאֶת־הָאֶחָד עֹלָה וְכִפֶּר עָלֶיהָ הַכֹּהֵן לִפְנֵי יְהוָה מִזּוֹב טֻמְאָתָהּ׃
    hebrewPlain: ועשה הכהן את האחד חטאת ואת האחד עלה וכפר עליה הכהן לפני יהוה מזוב טמאתה
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:30
    kjvOsis:
    - Lev.15.30
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.31
    scripture: tanakh
    name: Tanakh Leviticus 15:31
    ref: Leviticus 15:31
    book: Lev
    section: torah
    chapter: 15
    verse: 31
    ordinal: 3197
    text: Thus shall ye separate the children of Israel from their uncleanness; that they die not in their uncleanness, when they defile My tabernacle that is in the midst of them.
    translation: JPS 1917
    original: וְהִזַּרְתֶּם אֶת־בְּנֵי־יִשְׂרָאֵל מִטֻּמְאָתָם וְלֹא יָמֻתוּ בְּטֻמְאָתָם בְּטַמְּאָם אֶת־מִשְׁכָּנִי אֲשֶׁר בְּתוֹכָם׃
    hebrewPlain: והזרתם את בני ישראל מטמאתם ולא ימתו בטמאתם בטמאם את משכני אשר בתוכם
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:31
    kjvOsis:
    - Lev.15.31
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.32
    scripture: tanakh
    name: Tanakh Leviticus 15:32
    ref: Leviticus 15:32
    book: Lev
    section: torah
    chapter: 15
    verse: 32
    ordinal: 3198
    text: This is the law of him that hath an issue, and of him from whom the flow of seed goeth out, so that he is unclean thereby;
    translation: JPS 1917
    original: זֹאת תּוֹרַת הַזָּב וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת־זֶרַע לְטָמְאָה־בָהּ׃
    hebrewPlain: זאת תורת הזב ואשר תצא ממנו שכבת זרע לטמאה בה
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:32
    kjvOsis:
    - Lev.15.32
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.33
    scripture: tanakh
    name: Tanakh Leviticus 15:33
    ref: Leviticus 15:33
    book: Lev
    section: torah
    chapter: 15
    verse: 33
    ordinal: 3199
    text: and of her that is sick with her impurity, and of them that have an issue, whether it be a man, or a woman; and of him that lieth with her that is unclean.
    translation: JPS 1917
    original: וְהַדָּוָה בְּנִדָּתָהּ וְהַזָּב אֶת־זוֹבוֹ לַזָּכָר וְלַנְּקֵבָה וּלְאִישׁ אֲשֶׁר יִשְׁכַּב עִם־טְמֵאָה׃
    hebrewPlain: והדוה בנדתה והזב את זובו לזכר ולנקבה ולאיש אשר ישכב עם טמאה
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:33
    kjvOsis:
    - Lev.15.33
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.16.1
    scripture: tanakh
    name: Tanakh Leviticus 16:1
    ref: Leviticus 16:1
    book: Lev
    section: torah
    chapter: 16
    verse: 1
    ordinal: 3200
    text: And the LORD spoke unto Moses, after the death of the two sons of Aaron, when they drew near before the LORD, and died;
    translation: JPS 1917
    original: וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה אַחֲרֵי מוֹת שְׁנֵי בְּנֵי אַהֲרֹן בְּקָרְבָתָם לִפְנֵי־יְהוָה וַיָּמֻתוּ׃
    hebrewPlain: וידבר יהוה אל משה אחרי מות שני בני אהרן בקרבתם לפני יהוה וימתו
    parashah: Achrei Mot
    kjvRefs:
    - Leviticus 16:1
    kjvOsis:
    - Lev.16.1
