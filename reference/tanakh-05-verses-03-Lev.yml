    ordinal: 3083
    text: then he shall be shaven, but the scall shall he not shave; and the priest shall shut up him that hath the scall seven days more.
    translation: JPS 1917
    original: וְהִתְגַּלָּח וְאֶת־הַנֶּתֶק לֹא יְגַלֵּחַ וְהִסְגִּיר הַכֹּהֵן אֶת־הַנֶּתֶק שִׁבְעַת יָמִים שֵׁנִית׃
    hebrewPlain: והתגלח ואת הנתק לא יגלח והסגיר הכהן את הנתק שבעת ימים שנית
