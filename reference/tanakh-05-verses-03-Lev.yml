    scripture: tanakh
    name: Tanakh Leviticus 18:21
    ref: Leviticus 18:21
    book: Lev
    section: torah
    chapter: 18
    verse: 21
    ordinal: 3270
    text: 'And thou shalt not give any of thy seed to set them apart to Molech, neither shalt thou profane the name of thy God: I am the LORD.'
    translation: JPS 1917
    original: וּמִזַּרְעֲךָ לֹא־תִתֵּן לְהַעֲבִיר לַמֹּלֶךְ וְלֹא תְחַלֵּל אֶת־שֵׁם אֱלֹהֶיךָ אֲנִי יְהוָה׃
    hebrewPlain: ומזרעך לא תתן להעביר למלך ולא תחלל את שם אלהיך אני יהוה
    parashah: Achrei Mot
    kjvRefs:
