  data:
    osis: Lev.23.34
    scripture: tanakh
    name: Tanakh Leviticus 23:34
    ref: Leviticus 23:34
    book: Lev
    section: torah
    chapter: 23
    verse: 34
    ordinal: 3434
    text: 'Speak unto the children of Israel, saying: On the fifteenth day of this seventh month is the feast of tabernacles for seven days unto the LORD.'
    translation: JPS 1917
    original: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה חַג הַסֻּכּוֹת שִׁבְעַת יָמִים לַיהֹוָה׃
    hebrewPlain: דבר אל בני ישראל לאמר בחמשה עשר יום לחדש השביעי הזה חג הסכות שבעת ימים ליהוה
    parashah: Emor
    kjvRefs:
