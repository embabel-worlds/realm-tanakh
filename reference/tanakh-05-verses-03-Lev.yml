- type: TanakhVerse
  data:
    osis: Lev.15.3
    scripture: tanakh
    name: Tanakh Leviticus 15:3
    ref: Leviticus 15:3
    book: Lev
    section: torah
    chapter: 15
    verse: 3
    ordinal: 3169
    text: 'And this shall be his uncleanness in his issue: whether his flesh run with his issue, or his flesh be stopped from his issue, it is his uncleanness.'
    translation: JPS 1917
    original: וְזֹאת תִּהְיֶה טֻמְאָתוֹ בְּזוֹבוֹ רָר בְּשָׂרוֹ אֶת־זוֹבוֹ אוֹ־הֶחְתִּים בְּשָׂרוֹ מִזּוֹבוֹ טֻמְאָתוֹ הִוא׃
    hebrewPlain: וזאת תהיה טמאתו בזובו רר בשרו את זובו או החתים בשרו מזובו טמאתו הוא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:3
    kjvOsis:
    - Lev.15.3
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.4
    scripture: tanakh
    name: Tanakh Leviticus 15:4
    ref: Leviticus 15:4
    book: Lev
    section: torah
    chapter: 15
    verse: 4
    ordinal: 3170
    text: Every bed whereon he that hath the issue lieth shall be unclean; and every thing whereon he sitteth shall be unclean. .
    translation: JPS 1917
    original: כָּל־הַמִּשְׁכָּב אֲשֶׁר יִשְׁכַּב עָלָיו הַזָּב יִטְמָא וְכָל־הַכְּלִי אֲשֶׁר־יֵשֵׁב עָלָיו יִטְמָא׃
    hebrewPlain: כל המשכב אשר ישכב עליו הזב יטמא וכל הכלי אשר ישב עליו יטמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:4
    kjvOsis:
    - Lev.15.4
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.5
    scripture: tanakh
    name: Tanakh Leviticus 15:5
    ref: Leviticus 15:5
    book: Lev
    section: torah
    chapter: 15
    verse: 5
    ordinal: 3171
    text: And whosoever toucheth his bed shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְאִישׁ אֲשֶׁר יִגַּע בְּמִשְׁכָּבוֹ יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: ואיש אשר יגע במשכבו יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:5
    kjvOsis:
    - Lev.15.5
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.6
    scripture: tanakh
    name: Tanakh Leviticus 15:6
    ref: Leviticus 15:6
    book: Lev
    section: torah
    chapter: 15
    verse: 6
    ordinal: 3172
    text: And he that sitteth on any thing whereon he that hath the issue sat shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְהַיֹּשֵׁב עַל־הַכְּלִי אֲשֶׁר־יֵשֵׁב עָלָיו הַזָּב יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: והישב על הכלי אשר ישב עליו הזב יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:6
    kjvOsis:
    - Lev.15.6
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.7
    scripture: tanakh
    name: Tanakh Leviticus 15:7
    ref: Leviticus 15:7
    book: Lev
    section: torah
    chapter: 15
    verse: 7
    ordinal: 3173
    text: And he that toucheth the flesh of him that hath the issue shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְהַנֹּגֵעַ בִּבְשַׂר הַזָּב יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: והנגע בבשר הזב יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:7
    kjvOsis:
    - Lev.15.7
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.8
    scripture: tanakh
    name: Tanakh Leviticus 15:8
    ref: Leviticus 15:8
    book: Lev
    section: torah
    chapter: 15
    verse: 8
    ordinal: 3174
    text: And if he that hath the issue spit upon him that is clean, then he shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכִי־יָרֹק הַזָּב בַּטָּהוֹר וְכִבֶּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכי ירק הזב בטהור וכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:8
    kjvOsis:
    - Lev.15.8
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.9
    scripture: tanakh
    name: Tanakh Leviticus 15:9
    ref: Leviticus 15:9
    book: Lev
    section: torah
    chapter: 15
    verse: 9
    ordinal: 3175
    text: And what saddle soever he that hath the issue rideth upon shall be unclean.
    translation: JPS 1917
    original: וְכָל־הַמֶּרְכָּב אֲשֶׁר יִרְכַּב עָלָיו הַזָּב יִטְמָא׃
    hebrewPlain: וכל המרכב אשר ירכב עליו הזב יטמא
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:9
    kjvOsis:
    - Lev.15.9
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.10
    scripture: tanakh
    name: Tanakh Leviticus 15:10
    ref: Leviticus 15:10
    book: Lev
    section: torah
    chapter: 15
    verse: 10
    ordinal: 3176
    text: And whosoever toucheth any thing that was under him shall be unclean until the even; and he that beareth those things shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־הַנֹּגֵעַ בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו יִטְמָא עַד־הָעָרֶב וְהַנּוֹשֵׂא אוֹתָם יְכַבֵּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל הנגע בכל אשר יהיה תחתיו יטמא עד הערב והנושא אותם יכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:10
    kjvOsis:
    - Lev.15.10
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.11
    scripture: tanakh
    name: Tanakh Leviticus 15:11
    ref: Leviticus 15:11
    book: Lev
    section: torah
    chapter: 15
    verse: 11
    ordinal: 3177
    text: And whomsoever he that hath the issue toucheth, without having rinsed his hands in water, he shall wash his clothes, and bathe himself in water, and be unclean until the even.
    translation: JPS 1917
    original: וְכֹל אֲשֶׁר יִגַּע־בּוֹ הַזָּב וְיָדָיו לֹא־שָׁטַף בַּמָּיִם וְכִבֶּס בְּגָדָיו וְרָחַץ בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל אשר יגע בו הזב וידיו לא שטף במים וכבס בגדיו ורחץ במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:11
    kjvOsis:
    - Lev.15.11
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.12
    scripture: tanakh
    name: Tanakh Leviticus 15:12
    ref: Leviticus 15:12
    book: Lev
    section: torah
    chapter: 15
    verse: 12
    ordinal: 3178
    text: And the earthen vessel, which he that hath the issue toucheth, shall be broken; and every vessel of wood shall be rinsed in water.
    translation: JPS 1917
    original: וּכְלִי־חֶרֶשׂ אֲשֶׁר־יִגַּע־בּוֹ הַזָּב יִשָּׁבֵר וְכָל־כְּלִי־עֵץ יִשָּׁטֵף בַּמָּיִם׃
    hebrewPlain: וכלי חרש אשר יגע בו הזב ישבר וכל כלי עץ ישטף במים
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:12
    kjvOsis:
    - Lev.15.12
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.13
    scripture: tanakh
    name: Tanakh Leviticus 15:13
    ref: Leviticus 15:13
    book: Lev
    section: torah
    chapter: 15
    verse: 13
    ordinal: 3179
    text: And when he that hath an issue is cleansed of his issue, then he shall number to himself seven days for his cleansing, and wash his clothes; and he shall bathe his flesh in running water, and shall be clean.
    translation: JPS 1917
    original: וְכִי־יִטְהַר הַזָּב מִזּוֹבוֹ וְסָפַר לוֹ שִׁבְעַת יָמִים לְטָהֳרָתוֹ וְכִבֶּס בְּגָדָיו וְרָחַץ בְּשָׂרוֹ בְּמַיִם חַיִּים וְטָהֵר׃
    hebrewPlain: וכי יטהר הזב מזובו וספר לו שבעת ימים לטהרתו וכבס בגדיו ורחץ בשרו במים חיים וטהר
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:13
    kjvOsis:
    - Lev.15.13
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.14
    scripture: tanakh
    name: Tanakh Leviticus 15:14
    ref: Leviticus 15:14
    book: Lev
    section: torah
    chapter: 15
    verse: 14
    ordinal: 3180
    text: And on the eighth day he shall take to him two turtle-doves, or two young pigeons, and come before the LORD unto the door of the tent of meeting, and give them unto the priest.
    translation: JPS 1917
    original: וּבַיּוֹם הַשְּׁמִינִי יִקַּח־לוֹ שְׁתֵּי תֹרִים אוֹ שְׁנֵי בְּנֵי יוֹנָה וּבָא לִפְנֵי יְהוָה אֶל־פֶּתַח אֹהֶל מוֹעֵד וּנְתָנָם אֶל־הַכֹּהֵן׃
    hebrewPlain: וביום השמיני יקח לו שתי תרים או שני בני יונה ובא לפני יהוה אל פתח אהל מועד ונתנם אל הכהן
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:14
    kjvOsis:
    - Lev.15.14
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.15
    scripture: tanakh
    name: Tanakh Leviticus 15:15
    ref: Leviticus 15:15
    book: Lev
    section: torah
    chapter: 15
    verse: 15
    ordinal: 3181
    text: And the priest shall offer them, the one for a sin-offering, and the other for a burnt-offering; and the priest shall make atonement for him before the LORD for his issue.
    translation: JPS 1917
    original: וְעָשָׂה אֹתָם הַכֹּהֵן אֶחָד חַטָּאת וְהָאֶחָד עֹלָה וְכִפֶּר עָלָיו הַכֹּהֵן לִפְנֵי יְהוָה מִזּוֹבוֹ׃
    hebrewPlain: ועשה אתם הכהן אחד חטאת והאחד עלה וכפר עליו הכהן לפני יהוה מזובו
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:15
    kjvOsis:
    - Lev.15.15
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.16
    scripture: tanakh
    name: Tanakh Leviticus 15:16
    ref: Leviticus 15:16
    book: Lev
    section: torah
    chapter: 15
    verse: 16
    ordinal: 3182
    text: And if the flow of seed go out from a man, then he shall bathe all his flesh in water, and be unclean until the even.
    translation: JPS 1917
    original: וְאִישׁ כִּי־תֵצֵא מִמֶּנּוּ שִׁכְבַת־זָרַע וְרָחַץ בַּמַּיִם אֶת־כָּל־בְּשָׂרוֹ וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: ואיש כי תצא ממנו שכבת זרע ורחץ במים את כל בשרו וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:16
    kjvOsis:
    - Lev.15.16
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.17
    scripture: tanakh
    name: Tanakh Leviticus 15:17
    ref: Leviticus 15:17
    book: Lev
    section: torah
    chapter: 15
    verse: 17
    ordinal: 3183
    text: And every garment, and every skin, whereon is the flow of seed, shall be washed with water, and be unclean until the even.
    translation: JPS 1917
    original: וְכָל־בֶּגֶד וְכָל־עוֹר אֲשֶׁר־יִהְיֶה עָלָיו שִׁכְבַת־זָרַע וְכֻבַּס בַּמַּיִם וְטָמֵא עַד־הָעָרֶב׃
    hebrewPlain: וכל בגד וכל עור אשר יהיה עליו שכבת זרע וכבס במים וטמא עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:17
    kjvOsis:
    - Lev.15.17
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.15
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: metzora
- type: TanakhVerse
  data:
    osis: Lev.15.18
    scripture: tanakh
    name: Tanakh Leviticus 15:18
    ref: Leviticus 15:18
    book: Lev
    section: torah
    chapter: 15
    verse: 18
    ordinal: 3184
    text: The woman also with whom a man shall lie carnally, they shall both bathe themselves in water, and be unclean until the even.
    translation: JPS 1917
    original: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ שִׁכְבַת־זָרַע וְרָחֲצוּ בַמַּיִם וְטָמְאוּ עַד־הָעָרֶב׃
    hebrewPlain: ואשה אשר ישכב איש אתה שכבת זרע ורחצו במים וטמאו עד הערב
    parashah: Metzora
    kjvRefs:
    - Leviticus 15:18
    kjvOsis:
    - Lev.15.18
