  data:
    osis: Lev.23.39
    scripture: tanakh
    name: Tanakh Leviticus 23:39
    ref: Leviticus 23:39
    book: Lev
    section: torah
    chapter: 23
    verse: 39
    ordinal: 3439
    text: Howbeit on the fifteenth day of the seventh month, when ye have gathered in the fruits of the land, ye shall keep the feast of the LORD seven days; on the first day shall be a solemn rest, and on the eighth day shall be a solemn rest.
    translation: JPS 1917
    original: אַךְ בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי בְּאָסְפְּכֶם אֶת־תְּבוּאַת הָאָרֶץ תָּחֹגּוּ אֶת־חַג־יְהוָה שִׁבְעַת יָמִים בַּיּוֹם הָרִאשׁוֹן שַׁבָּתוֹן וּבַיּוֹם הַשְּׁמִינִי שַׁבָּתוֹן׃
    hebrewPlain: אך בחמשה עשר יום לחדש השביעי באספכם את תבואת הארץ תחגו את חג יהוה שבעת ימים ביום הראשון שבתון וביום השמיני שבתון
    parashah: Emor
    kjvRefs:
    - Leviticus 23:39
    kjvOsis:
    - Lev.23.39
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.40
    scripture: tanakh
    name: Tanakh Leviticus 23:40
    ref: Leviticus 23:40
    book: Lev
    section: torah
    chapter: 23
    verse: 40
    ordinal: 3440
    text: And ye shall take you on the first day the fruit of goodly trees, branches of palm-trees, and boughs of thick trees, and willows of the brook, and ye shall rejoice before the LORD your God seven days.
    translation: JPS 1917
    original: וּלְקַחְתֶּם לָכֶם בַּיּוֹם הָרִאשׁוֹן פְּרִי עֵץ הָדָר כַּפֹּת תְּמָרִים וַעֲנַף עֵץ־עָבֹת וְעַרְבֵי־נָחַל וּשְׂמַחְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם שִׁבְעַת יָמִים׃
    hebrewPlain: ולקחתם לכם ביום הראשון פרי עץ הדר כפת תמרים וענף עץ עבת וערבי נחל ושמחתם לפני יהוה אלהיכם שבעת ימים
    parashah: Emor
    kjvRefs:
    - Leviticus 23:40
    kjvOsis:
    - Lev.23.40
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.41
    scripture: tanakh
    name: Tanakh Leviticus 23:41
    ref: Leviticus 23:41
    book: Lev
    section: torah
    chapter: 23
    verse: 41
    ordinal: 3441
    text: And ye shall keep it a feast unto the LORD seven days in the year; it is a statute for ever in your generations; ye shall keep it in the seventh month.
    translation: JPS 1917
    original: וְחַגֹּתֶם אֹתוֹ חַג לַיהוָה שִׁבְעַת יָמִים בַּשָּׁנָה חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם בַּחֹדֶשׁ הַשְּׁבִיעִי תָּחֹגּוּ אֹתוֹ׃
    hebrewPlain: וחגתם אתו חג ליהוה שבעת ימים בשנה חקת עולם לדרתיכם בחדש השביעי תחגו אתו
    parashah: Emor
    kjvRefs:
    - Leviticus 23:41
    kjvOsis:
    - Lev.23.41
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.42
    scripture: tanakh
    name: Tanakh Leviticus 23:42
    ref: Leviticus 23:42
    book: Lev
    section: torah
    chapter: 23
    verse: 42
    ordinal: 3442
    text: Ye shall dwell in booths seven days; all that are home-born in Israel shall dwell in booths;
    translation: JPS 1917
    original: בַּסֻּכֹּת תֵּשְׁבוּ שִׁבְעַת יָמִים כָּל־הָאֶזְרָח בְּיִשְׂרָאֵל יֵשְׁבוּ בַּסֻּכֹּת׃
    hebrewPlain: בסכת תשבו שבעת ימים כל האזרח בישראל ישבו בסכת
    parashah: Emor
    kjvRefs:
    - Leviticus 23:42
    kjvOsis:
    - Lev.23.42
  relations:
  - predicate: IN
    to:
      type: TanakhChapter
      osis: Lev.23
  - predicate: IN_PORTION
    to:
      type: Parashah
      key: emor
- type: TanakhVerse
  data:
    osis: Lev.23.43
    scripture: tanakh
    name: Tanakh Leviticus 23:43
    ref: Leviticus 23:43
    book: Lev
    section: torah
    chapter: 23
    verse: 43
    ordinal: 3443
    text: 'that your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt: I am the LORD your God.'
    translation: JPS 1917
    original: לְמַעַן יֵדְעוּ דֹרֹתֵיכֶם כִּי בַסֻּכּוֹת הוֹשַׁבְתִּי אֶת־בְּנֵי יִשְׂרָאֵל בְּהוֹצִיאִי אוֹתָם מֵאֶרֶץ מִצְרָיִם אֲנִי יְהוָה אֱלֹהֵיכֶם׃
    hebrewPlain: למען ידעו דרתיכם כי בסכות הושבתי את בני ישראל בהוציאי אותם מארץ מצרים אני יהוה אלהיכם
    parashah: Emor
    kjvRefs:
