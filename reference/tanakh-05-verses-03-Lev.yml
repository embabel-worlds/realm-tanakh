    name: Tanakh Leviticus 5:22
    ref: Leviticus 5:22
    book: Lev
    section: torah
    chapter: 5
    verse: 22
    ordinal: 2850
    text: or have found that which was lost, and deal falsely therein, and swear to a lie; in any of all these that a man doeth, sinning therein;
    translation: JPS 1917
    original: אוֹ־מָצָא אֲבֵדָה וְכִחֶשׁ בָּהּ וְנִשְׁבַּע עַל־שָׁקֶר עַל־אַחַת מִכֹּל אֲשֶׁר־יַעֲשֶׂה הָאָדָם לַחֲטֹא בָהֵנָּה׃
    hebrewPlain: או מצא אבדה וכחש בה ונשבע על שקר על אחת מכל אשר יעשה האדם לחטא בהנה
    parashah: Vayikra
    kjvRefs:
    - Leviticus 6:3
    kjvOsis:
    - Lev.6.3
