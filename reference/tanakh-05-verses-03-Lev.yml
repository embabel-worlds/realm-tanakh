    scripture: tanakh
    name: Tanakh Leviticus 8:22
    ref: Leviticus 8:22
    book: Lev
    section: torah
    chapter: 8
    verse: 22
    ordinal: 2937
    text: And the other ram was presented, the ram of consecration, and Aaron and his sons laid their hands upon the head of the ram.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־הָאַיִל הַשֵּׁנִי אֵיל הַמִּלֻּאִים וַיִּסְמְכוּ אַהֲרֹן וּבָנָיו אֶת־יְדֵיהֶם עַל־רֹאשׁ הָאָיִל׃
    hebrewPlain: ויקרב את האיל השני איל המלאים ויסמכו אהרן ובניו את ידיהם על ראש האיל
    parashah: Tzav
    kjvRefs:
