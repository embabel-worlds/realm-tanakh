  data:
    osis: Lev.11.4
    scripture: tanakh
    name: Tanakh Leviticus 11:4
    ref: Leviticus 11:4
    book: Lev
    section: torah
    chapter: 11
    verse: 4
    ordinal: 2999
    text: 'Nevertheless these shall ye not eat of them that only chew the cud, or of them that only part the hoof: the camel, because he cheweth the cud but parteth not the hoof, he is unclean unto you.'
    translation: JPS 1917
    original: אַךְ אֶת־זֶה לֹא תֹאכְלוּ מִמַּעֲלֵי הַגֵּרָה וּמִמַּפְרִיסֵי הַפַּרְסָה אֶת־הַגָּמָל כִּי־מַעֲלֵה גֵרָה הוּא וּפַרְסָה אֵינֶנּוּ מַפְרִיס טָמֵא הוּא לָכֶם׃
    hebrewPlain: אך את זה לא תאכלו ממעלי הגרה וממפריסי הפרסה את הגמל כי מעלה גרה הוא ופרסה איננו מפריס טמא הוא לכם
    parashah: Shmini
    kjvRefs:
