  data:
    osis: Lev.13.44
    scripture: tanakh
    name: Tanakh Leviticus 13:44
    ref: Leviticus 13:44
    book: Lev
    section: torah
    chapter: 13
    verse: 44
    ordinal: 3094
    text: 'he is a leprous man, he is unclean; the priest shall surely pronounce him unclean: his plague is in his head. .'
    translation: JPS 1917
    original: אִישׁ־צָרוּעַ הוּא טָמֵא הוּא טַמֵּא יְטַמְּאֶנּוּ הַכֹּהֵן בְּרֹאשׁוֹ נִגְעוֹ׃
    hebrewPlain: איש צרוע הוא טמא הוא טמא יטמאנו הכהן בראשו נגעו
    parashah: Tazria
    kjvRefs:
    - Leviticus 13:44
    kjvOsis:
    - Lev.13.44
