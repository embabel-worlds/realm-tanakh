  data:
    osis: Lev.8.24
    scripture: tanakh
    name: Tanakh Leviticus 8:24
    ref: Leviticus 8:24
    book: Lev
    section: torah
    chapter: 8
    verse: 24
    ordinal: 2939
    text: And Aaron’s sons were brought, and Moses put of the blood upon the tip of their right ear, and upon the thumb of their right hand, and upon the great toe of their right foot; and Moses dashed the blood against the altar round about.
    translation: JPS 1917
    original: וַיַּקְרֵב אֶת־בְּנֵי אַהֲרֹן וַיִּתֵּן מֹשֶׁה מִן־הַדָּם עַל־תְּנוּךְ אָזְנָם הַיְמָנִית וְעַל־בֹּהֶן יָדָם הַיְמָנִית וְעַל־בֹּהֶן רַגְלָם הַיְמָנִית וַיִּזְרֹק מֹשֶׁה אֶת־הַדָּם עַל־הַמִּזְבֵּחַ סָבִיב׃
    hebrewPlain: ויקרב את בני אהרן ויתן משה מן הדם על תנוך אזנם הימנית ועל בהן ידם הימנית ועל בהן רגלם הימנית ויזרק משה את הדם על המזבח סביב
    parashah: Tzav
    kjvRefs:
    - Leviticus 8:24
    kjvOsis:
    - Lev.8.24
